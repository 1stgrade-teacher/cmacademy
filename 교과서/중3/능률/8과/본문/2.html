  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 8과 본문2","audioDir":"2_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 8과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Fifth Man and the Tallest Tree\u003c/h1>\u003ch2>다섯 번째 남자와 가장 높은 나무\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>숲에서 길을 잃은 다섯 번째 남자가 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">나무\u003c/b>에 올라 \u003cb class=\"key\">최단 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 찾았지만, 내려왔을 때는 모두 떠난 뒤였다. 그는 \u003cb class=\"key\">자신만 \u003c/b>\u003cb class=\"key\">지혜롭다\u003c/b>고 생각했지만 \u003cb class=\"key\">소통\u003c/b>이 먼저 끊겼다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The fifth man found the shortest way out from a high vantage point, but everyone else had already left, so he concluded only he was wise.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 3학년 능률 8과 본문에 나오는 이야기를 함께 볼게요. 다섯 번째 남자가 숲에서 길을 찾으려고 가장 높은 나무에 올라가는 내용인데요. 결국 그는 가장 짧은 길을 찾지만, 내려왔을 때는 모두 떠나 버린 상태였어요. 이 이야기를 통해 소통의 중요함과 자신만 옳다고 믿는 태도를 생각해 보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러 명이 숲에서 길을 잃었을 때, 높은 곳에 올라가면 \u003cb class=\"key\">bird's-eye \u003c/b>\u003cb class=\"key\">view\u003c/b>를 얻어 전체 경로를 파악할 수 있습니다. 이를 \u003cb class=\"key\">big \u003c/b>\u003cb class=\"key\">picture\u003c/b> 또는 \u003cb class=\"key\">whole \u003c/b>\u003cb class=\"key\">picture\u003c/b>라고 합니다. 지도 앱으로 출발지와 도착지를 한눈에 보면 최단 경로를 찾듯이, 다섯 번째 남자는 나무 위에서 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">whole \u003c/b>\u003cb class=\"key\">forest\u003c/b>를 내려다보았습니다. 하지만 아무리 좋은 \u003cb class=\"key\">solution\u003c/b>을 찾아도 함께 공유하지 못하면 아무 소용이 없습니다. 이 글은 \u003cb class=\"key\">communication\u003c/b>이 끊긴 뒤에는 정답이라도 \u003cb class=\"key\">고립\u003c/b>될 수 있음을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"여러 사람이 숲에서 길을 잃었을 때 높은 곳에 올라가면 전체가 보이죠. 영어로 bird's-eye view라고 하는데, 지도 앱으로 출발지와 도착지를 한눈에 보면서 빠른 길을 찾는 것과 비슷해요. 이렇게 전체 그림을 보는 것을 big picture라고 해요. 그런데 아무리 좋은 solution을 찾아도 함께 나누지 못하면 혼자만의 발견에 그치고 말아요. 이 글은 communication이 끊기면 정답도 고립될 수 있다는 점을 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>나무를 오르는 순간, 흩어지는 사람들\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>다섯 번째 남자는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 오르기 시작했다. 그가 오르는 동안 다른 사람들은 각자 \u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 가기로 결정했다. 높은 곳에서 길을 찾으려는 선택이 집단의 \u003cb class=\"key\">분열\u003c/b>과 함께 시작되었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>숲 전체를 보고 찾은 최단 경로\u003csmall>전개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>꼭대기에 오르자 \u003cb class=\"key\">숲 \u003c/b>\u003cb class=\"key\">전체\u003c/b>가 보였고, 모든 길을 살펴 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 찾아냈다. 높은 곳에서 얻은 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">조망\u003c/b>이 문제 해결의 실마리가 되었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>알리러 내려왔지만 모두 떠나 버린 상황\u003csmall>반전 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">사람들에게 \u003c/b>\u003cb class=\"key\">알리려고\u003c/b> 서둘러 내려갔다. 하지만 밑에 도착했을 때 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">사라진 \u003c/b>\u003cb class=\"key\">뒤\u003c/b>였다. 그가 찾은 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 전할 기회가 사라져 버렸다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>자신만 지혜롭다고 믿는 착각\u003csmall>결론 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>그는 속으로 다들 어디로 갔는지 궁금해하며 자신이 찾은 길을 떠올렸다. 결국 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">틀렸고\u003c/b> \u003cb class=\"key\">자신만 \u003c/b>\u003cb class=\"key\">지혜롭다\u003c/b>고 판단했다. 소통이 끊긴 뒤에는 확신이 \u003cb class=\"key\">오만한 \u003c/b>\u003cb class=\"key\">결론\u003c/b>으로 굳어질 수 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 시간 순서에 따라 네 단계로 흘러갑니다.","hl":null},{"n":4,"text":"먼저 다섯 번째 남자가 가장 높은 나무를 오르기 시작해요. 그가 나무를 오르는 동안 다른 사람들은 각자 서로 다른 길을 가기로 결정합니다. 높은 곳에서 길을 찾으려는 선택이 곧 집단이 흩어지는 순간이었어요.","hl":"f0"},{"n":5,"text":"꼭대기에 오르자 숲 전체가 보였고, 모든 길을 살펴 가장 짧은 길을 찾아냈어요. 높은 곳에서 얻은 전체 조망이 문제 해결의 실마리가 된 거죠.","hl":"f1"},{"n":6,"text":"그는 다른 사람들에게 알리려고 서둘러 내려갔어요. 하지만 밑에 도착했을 때는 모두 사라진 뒤였죠. 그가 찾은 최선의 길을 전할 기회가 사라져 버렸어요.","hl":"f2"},{"n":7,"text":"결국 그는 속으로 다들 어디로 갔는지 궁금해하면서 자신이 찾은 길을 떠올렸어요. 그리고 그들이 모두 틀렸고 자신만 지혜롭다고 판단했죠. 소통이 끊긴 뒤에는 확신이 오만한 결론으로 굳어질 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이야기가 시간 순서대로 진행되면서 마지막 문장에서 \u003cb class=\"key\">화자의 \u003c/b>\u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">확신\u003c/b>이 드러난다. 앞부분은 \u003cb class=\"key\">길 \u003c/b>\u003cb class=\"key\">찾기 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 서술하고, 결론에 해당하는 마지막 문장에서 \u003cb class=\"key\">자신만 \u003c/b>\u003cb class=\"key\">옳다는 \u003c/b>\u003cb class=\"key\">판단\u003c/b>이 제시된다. 따라서 전체 구조는 \u003cb class=\"key\">미괄식\u003c/b>이고, 전개 방식은 \u003cb class=\"key\">시간순\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (2)\u003c/b>\u003cspan>시간의 동시 진행\u003c/span>\u003cb>When (3)\u003c/b>\u003cspan>시간의 조건\u003c/span>\u003cb>However (6)\u003c/b>\u003cspan>역접·반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">everyone else\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">everyone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they all\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>다섯 번째 남자\u003c/th>\u003cth>다른 사람들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>높은 나무에 올라 숲 전체를 봄\u003c/td>\u003ctd>각자 서로 다른 길로 흩어짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가장 짧은 길을 찾아 알리려 함\u003c/td>\u003ctd>이미 떠나 버려 들을 사람이 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자신만 옳다고 확신함\u003c/td>\u003ctd>함께하지 못해 소통이 끊김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순 전개 방식에 미괄식 구조를 취하고 있어요. 처음부터 다섯 번째 남자의 행동을 따라가다가 마지막 문장에 가서야 화자의 잘못된 확신이 드러나죠. 앞부분은 길 찾기 과정을 서술하고, 결론에 해당하는 마지막 문장에서 자신만 옳다는 판단이 제시됩니다. 그래서 주제문은 마지막 문장이에요.","hl":"ty"},{"n":9,"text":"신호어도 함께 볼까요. 두 번째 문장의 as는 시간의 동시 진행을 나타내고, 세 번째 문장의 when은 특정 시점을 알려 줘요. 여섯 번째 문장의 however는 상황이 반전된다는 중요한 신호입니다. 또 everyone else, the others, everyone 같은 표현은 같은 대상인 다른 사람들을 바꿔 말한 것이에요. 이렇게 재진술을 따라 읽으면 글의 흐름이 선명해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tall\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>높은, 키가 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>tree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안에, ~하면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone else\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 모든 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다, 결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>separate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>서로 다른, 별개의\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길, 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>fifth\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다섯 번째의\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>top\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꼭대기\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길, 경로\u003c/span>\u003c/div>\u003cdiv>\u003cb>short\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짧은, 키가 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>way out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나가는 길, 출구\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurry down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서둘러 내려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 알리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>get to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bottom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밑바닥, 아래\u003c/span>\u003c/div>\u003cdiv>\u003cb>gone\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가 버린, 없어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>think to oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>속으로 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>only\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유일한, 오직\u003c/span>\u003c/div>\u003cdiv>\u003cb>wise\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지혜로운\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 짚어 볼게요. climb은 오르다, separate는 서로 다른, whole은 전체의라는 뜻이에요. way out은 나가는 길 또는 출구라는 뜻이고, think to oneself는 속으로 생각하다라는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"s\">commence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">whole\u003c/b>\u003cspan class=\"m\">전체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"s\">total\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003cspan class=\"a\">incomplete\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">separate\u003c/b>\u003cspan class=\"m\">서로 다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">individual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">together\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">joined\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wrong\u003c/b>\u003cspan class=\"m\">틀린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incorrect\u003c/span>\u003cspan class=\"s\">false\u003c/span>\u003cspan class=\"s\">mistaken\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003cspan class=\"a\">correct\u003c/span>\u003cspan class=\"a\">true\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wise\u003c/b>\u003cspan class=\"m\">지혜로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smart\u003c/span>\u003cspan class=\"s\">intelligent\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolish\u003c/span>\u003cspan class=\"a\">unwise\u003c/span>\u003cspan class=\"a\">stupid\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 두면 시험에 도움이 됩니다. wise는 smart나 intelligent와 비슷하고, foolish나 stupid와 반대예요. find는 discover나 locate와 비슷하고 lose와 반대죠. separate는 different와 비슷하고 together와 반대, wrong은 incorrect와 비슷하고 right와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 오르기 시작했다\u003c/span>\u003cspan class=\"en\">He started \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">climb\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 높은 나무를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tallest \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 찾을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그가 찾을 수 있는 가장 높은 나무를 오르기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 번째 남자가 길을 선택하기 전에 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">나무\u003c/b>에 올라 시야를 확보하려는 장면의 도입부입니다. 뒤에서 he could find가 the tallest tree를 꾸며 '그가 찾을 수 있는 가장 높은 나무'라는 의미가 됩니다. 이 행동은 다음 문장에서 전체 숲을 내려다보는 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : started + to climb (to부정사구/목적어) : \"오르기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 표현 (the + 최상급 + 명사)\u003c/span> : the + tallest + tree : \"가장 높은 나무\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that의 생략\u003c/span> : the tallest tree (that) he could find : \"그가 찾을 수 있는 가장 높은 나무\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"He started to climb, 그는 오르기 시작했다. the tallest tree, 가장 높은 나무를. he could find, 그가 찾을 수 있는. 이 문장 전체를 해석하면, 그는 그가 찾을 수 있는 가장 높은 나무를 오르기 시작했다.","hl":"m"},{"n":13,"text":"다섯 번째 남자는 무작정 길을 가는 다른 사람들과 달리, 가장 높은 나무에 올라가 숲 전체를 보려고 합니다. the tallest tree 뒤에 he could find가 붙어서 그가 찾을 수 있는 가장 높은 나무라는 뜻이 되죠. 이 행동은 다음에 이어질 전체 숲을 바라보는 장면의 준비가 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 to climb입니다. start는 뒤에 to부정사나 동명사를 목적어로 가질 수 있는데, 여기서는 to climb이 started의 목적어로 쓰여서 오르기를 시작했다가 됩니다. 두 번째는 the tallest tree입니다. the와 최상급 tallest가 함께 쓰여 가장 높은 나무라는 뜻이에요. 세 번째는 he could find입니다. 원래 the tallest tree that he could find에서 목적격 관계대명사 that이 생략된 형태로, 뒤에서 나무를 꾸며주는 관계절이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 나무를 오르고 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">climbed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 모든 사람들은\u003c/span>\u003cspan class=\"en\">everyone else\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가기로 결정했다\u003c/span>\u003cspan class=\"en\">decided \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각자 서로 다른 길을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">separate \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 나무를 오르고 있을 때 다른 모든 사람들은 각자 서로 다른 길을 가기로 결정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 번째 남자가 나무를 오르는 동안 나머지 사람들이 \u003cb class=\"key\">각자 \u003c/b>\u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">길\u003c/b>로 흩어졌다는 대조적인 상황을 보여줍니다. As는 '~할 때'라는 뜻의 시간 접속사로 두 사건이 동시에 일어났음을 나타냅니다. go their separate ways는 '각자 갈 길을 가다, 흩어지다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (시간) ~할 때\u003c/span> : As + 주어 + 과거동사, 주절 : \"그가 나무를 오르고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decided + to go (to부정사구/목적어) : \"가기로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">go one's separate ways 관용 표현\u003c/span> : go + one's separate ways : \"각자 서로 다른 길을 가다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"As he climbed, 그가 나무를 오르고 있을 때. everyone else, 다른 모든 사람들은. decided to go, 가기로 결정했다. their separate ways, 각자 서로 다른 길을. 이 문장 전체를 해석하면, 그가 나무를 오르고 있을 때 다른 모든 사람들은 각자 서로 다른 길을 가기로 결정했다.","hl":"m"},{"n":16,"text":"이 문장은 남자가 나무를 오르는 동안 다른 사람들이 전부 자기 갈 길로 흩어졌다는 대조적인 상황을 보여줍니다. everyone else에서 else가 everyone 뒤에 붙어서 다른 모든 사람들이라는 뜻이 되죠. go their separate ways는 각자 서로 다른 길을 가다라는 관용 표현입니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 As he climbed입니다. As가 시간 접속사로 쓰여서 그가 나무를 오르고 있을 때라는 시간의 부사절을 이끌어요. 두 번째는 to go입니다. decided는 to부정사를 목적어로 가지는 동사라서 decided to go는 가기로 결정했다로 해석합니다. 세 번째는 their separate ways인데, go one's separate ways가 각자 갈 길을 가다, 흩어지다라는 관용 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다섯 번째 남자가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fifth \u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭대기에 이르자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">reached \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">top\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 볼 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲 전체를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">forest\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다섯 번째 남자가 꼭대기에 이르자 그는 숲 전체를 볼 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 번째 남자가 나무 꼭대기에 오르자 \u003cb class=\"key\">숲 \u003c/b>\u003cb class=\"key\">전체\u003c/b>를 볼 수 있었던 결정적 순간을 보여줍니다. When이 이끄는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부사절\u003c/b>이 먼저 나와 시점을 알려주고, 주절에서 could see로 그의 능력을 말합니다. the whole forest는 '숲 전체'라는 뜻으로, 그가 숲의 전체 지형을 파악하게 되었음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when (시간 부사절)\u003c/span> : When + 주어 + 동사, 주절 : \"다섯 번째 남자가 꼭대기에 이르자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could (can의 과거형)\u003c/span> : could + 동사원형 : \"그는 볼 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">whole의 한정적 용법\u003c/span> : the whole + 명사 : \"숲 전체를\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When the fifth man, 다섯 번째 남자가. reached the top, 꼭대기에 이르자. he could see, 그는 볼 수 있었다. the whole forest, 숲 전체를. 이 문장 전체를 해석하면, 다섯 번째 남자가 꼭대기에 이르자 그는 숲 전체를 볼 수 있었다.","hl":"m"},{"n":19,"text":"이 문장은 다섯 번째 남자가 가장 높은 나무 꼭대기에 올라서자 숲 전체를 내려다볼 수 있게 된 순간을 보여줍니다. When이 이끄는 시간의 부사절이 먼저 나와서 시점을 알려주고, 주절에서 he could see로 그의 능력을 말하고 있죠. the whole forest는 숲 전체라는 뜻으로, 그가 전체 지형을 파악하게 되었음을 나타냅니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 When the fifth man reached the top입니다. When이 시간 접속사로 쓰여서 다섯 번째 남자가 꼭대기에 이르자라는 시간의 부사절을 이끌어요. 두 번째는 he could see입니다. could는 can의 과거형으로, 과거 시점에서 볼 수 있었다는 능력을 나타내죠. 세 번째는 the whole forest인데, whole은 전체의라는 뜻으로 명사 forest를 앞에서 꾸며서 숲 전체를 뜻합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 길을 바라보며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Looking \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">paths\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가장 짧은 탈출로를 찾았다\u003c/span>\u003cspan class=\"en\">he found \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">shortest \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 길을 바라보며 그는 빠져나갈 가장 짧은 길을 찾았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무 꼭대기에서 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 바라보며 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">탈출로\u003c/b>를 찾아낸 순간이에요. way out은 밖으로 나가는 길이라는 뜻이라서, the shortest way out은 숲에서 빠져나갈 \u003cb class=\"key\">최단 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 의미해요. 이 문장은 그가 합리적으로 답을 찾았다고 확신하게 되는 지점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사의 부사적 용법)\u003c/span> : Looking at all the paths, he found ~ : \"모든 길을 바라보며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 표현\u003c/span> : the + 최상급(shortest) + 명사(way) + out : \"가장 짧은 출구, 빠져나갈 가장 짧은 길\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Looking at all the paths, 모든 길을 바라보며. he found the shortest way out, 그는 가장 짧은 탈출로를 찾았다. 이 문장 전체를 해석하면, 모든 길을 바라보며 그는 빠져나갈 가장 짧은 길을 찾았다.","hl":"m"},{"n":22,"text":"이 문장은 다섯 번째 남자가 나무 꼭대기에서 전체 길을 보고 가장 짧은 탈출로를 찾아냈다는 내용이에요. way out은 밖으로 나가는 길이라는 뜻이고, the shortest가 붙어서 가장 짧은 길이라는 최상급 표현이 됐어요. 그는 스스로 합리적으로 길을 찾았다고 판단하는 장면이에요.","hl":"mn"},{"n":23,"text":"첫 번째로, Looking at all the paths는 분사구문이에요. 주어가 he로 같으니까 While he looked at all the paths를 줄여서 Looking at all the paths로 표현했어요. 두 번째로, the shortest way out에서 the shortest는 최상급 표현이고 way out은 출구라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 서둘러 내려갔다\u003c/span>\u003cspan class=\"en\">He hurried down\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들에게 알리기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 다른 사람들에게 알리기 위해 서둘러 내려갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그는 자신이 찾은 길을 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>에게 알리려고 \u003cb class=\"key\">서둘러\u003c/b> 내려왔어요. 이 행동은 협력하려는 태도를 보여 주지만, 다음 문장에서 모두가 이미 떠났다는 \u003cb class=\"key\">반전\u003c/b>과 대비돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : hurry down + to tell (to부정사구) : \"다른 사람들에게 알리기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He hurried down, 그는 서둘러 내려갔다. to tell the others, 다른 사람들에게 알리기 위해. 이 문장 전체를 해석하면, 그는 다른 사람들에게 알리기 위해 서둘러 내려갔다.","hl":"m"},{"n":25,"text":"이 문장은 그가 자신이 찾은 길을 다른 사람들에게 알리려고 서둘러 내려갔다는 내용이에요. to tell the others는 알리기 위한 목적을 나타내는 to부정사 표현이죠. 이 행동은 협력하려는 마음을 보여 주지만 곧 모두가 떠나 버렸다는 다음 문장과 대비돼요.","hl":"mn"},{"n":26,"text":"이 문장에서 to tell the others는 to부정사의 부사적 용법 가운데 목적을 나타내요. 서둘러 내려간 이유가 다른 사람들에게 알리기 위해서라는 거죠. the others는 나머지 사람들 전체를 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 밑으로 내려왔을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bottom\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들은 이미 가 버리고 없었다\u003c/span>\u003cspan class=\"en\">everyone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">gone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그가 밑으로 내려왔을 때, 모든 사람들은 이미 가 버리고 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 서둘러 내려왔지만 사람들은 이미 \u003cb class=\"key\">떠나\u003c/b> 버려 혼자가 되는 \u003cb class=\"key\">반전\u003c/b>이 드러나요. got to the bottom은 나무 아래까지 내려왔다는 뜻이고, was gone은 \u003cb class=\"key\">수동태\u003c/b>가 아니라 없어진 \u003cb class=\"key\">상태\u003c/b>를 나타내요. 이 문장은 앞 문장의 기대와 대비되면서 다음 문장의 혼잣말로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when + 주어 + 동사)\u003c/span> : when + he + got to + the bottom : \"그가 밑으로 내려왔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be + gone (과거분사 형용사적 쓰임)\u003c/span> : be [was] + gone : \"가 버리고 없었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"However, 하지만. when he got to the bottom, 그가 밑으로 내려왔을 때. everyone was gone, 모든 사람들은 이미 가 버리고 없었다. 이 문장 전체를 해석하면, 하지만 그가 밑으로 내려왔을 때, 모든 사람들은 이미 가 버리고 없었다.","hl":"m"},{"n":28,"text":"이 문장은 그가 내려왔을 때 이미 모두가 떠나고 없었다는 반전을 보여 줍니다. when he got to the bottom은 시간을 나타내는 부사절이고, was gone은 수동태가 아니라 없어진 상태를 뜻해요. 앞 문장에서 알리려고 서둘렀던 기대와 대비되면서 다음 혼잣말로 이어져요.","hl":"mn"},{"n":29,"text":"첫 번째로, when he got to the bottom은 when이 이끄는 시간 부사절로 뒤 주절의 시점을 알려 줍니다. 두 번째로, was gone에서 gone은 과거분사가 형용사처럼 쓰여서 가 버리고 없는 상태를 나타내요. 수동태가 아니라는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 마음속으로 생각했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다들 어디 간 거야?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">go?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 마음속으로 생각했다. ‘다들 어디 간 거야?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그는 혼자 남겨진 상황에서 \u003cb class=\"key\">혼잣말\u003c/b>로 당황함을 드러냅니다. 다들 어디 갔는지 몰라 \u003cb class=\"key\">어리둥절\u003c/b>해 하는 모습입니다. 이는 그가 자기만 옳다고 생각하는 태도의 시작을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 think to oneself\u003c/span> : think to oneself = 마음속으로 생각하다 : \"그는 마음속으로 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사의 직접의문문 (wh-의문문)\u003c/span> : 의문사(Where) + did + 주어(they) + 동사원형(go)? : \"그들은 어디로 갔나?\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He thought to himself, 그는 마음속으로 생각했다. Where did they go?, 다들 어디 간 거야?. 이 문장 전체를 해석하면, 그는 마음속으로 생각했다. ‘다들 어디 간 거야?","hl":"m"},{"n":31,"text":"이 문장은 다섯 번째 남자가 혼자 남겨진 상황을 보여줘요. 다른 사람들이 모두 떠난 뒤에 그는 마음속으로 다들 어디 갔는지 궁금해하고 있어요. 이 장면은 그가 자신만 옳다고 생각하는 태도의 시작을 암시해 줘요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 thought to oneself라는 관용 표현이에요. think to oneself는 마음속으로 생각하다라는 뜻인데요. oneself 자리에 주어와 같은 재귀대명사를 쓰는 게 포인트입니다. 두 번째 어법 포인트는 Where did they go?라는 직접의문문의 어순이에요. 의문사 Where가 문장 앞에 오고 그 뒤에 조동사 did, 주어 they, 동사원형 go가 오는 순서입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 찾았다\u003c/span>\u003cspan class=\"en\">I found\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠져나갈 최선의 길\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 빠져나갈 최선의 길을 찾았는데.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신이 찾은 길이 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">탈출로\u003c/b>라고 확신하는 모습입니다. 하지만 다른 사람들은 이미 각자 길을 갔기 때문에, 이 생각은 그의 \u003cb class=\"key\">독선\u003c/b>을 드러냅니다. 이 문장은 다음 문장에서 그가 모두 틀렸다고 단정하는 태도로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 + 명사 + 부사 out의 후치수식\u003c/span> : the + 최상급(best) + 명사(way) + 부사(out) : \"가장 좋은 탈출로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I found, 나는 찾았다. the best way out, 빠져나갈 최선의 길. 이 문장 전체를 해석하면, 내가 빠져나갈 최선의 길을 찾았는데.’","hl":"m"},{"n":34,"text":"그는 자신이 찾은 길이 가장 좋은 탈출로라고 확신하고 있어요. 하지만 다른 사람들은 이미 각자 길을 떠났기 때문에 그의 생각은 독선으로 이어져요. 이 문장은 다음 문장에서 그가 모두 틀렸다고 단정하는 태도로 연결됩니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 the best way out이라는 표현이에요. best는 good의 최상급이고, out은 부사로 way를 뒤에서 수식해서 탈출로라는 뜻을 만들어요. 최상급과 부사의 후치수식이 함께 쓰인 표현이라는 걸 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 모두 틀렸다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자신이 유일하게 지혜로운 사람이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">wise \u003c/span>\u003cspan class=\"tgt\">man\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그들이 모두 틀렸고 자신이 유일하게 지혜로운 사람이라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그는 모든 사람이 틀렸고 자신만 \u003cb class=\"key\">현명하다\u003c/b>고 단정합니다. 이는 \u003cb class=\"key\">교만\u003c/b>과 \u003cb class=\"key\">독선\u003c/b>의 절정을 보여주며, 그가 실제로는 지혜롭지 않다는 반어적 상황을 만듭니다. 이 문장은 우화가 주는 교훈과 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적절을 이끄는 접속사 that 생략\u003c/span> : thought (that) + 주어 + 동사 : \"그는 그들이 모두 틀렸다고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : S1 + V1 ~~, and + S2 + V2 ~~ : \"그리고 그가 유일하게 지혜로운 사람이었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He thought, 그는 생각했다. they were all wrong, 그들이 모두 틀렸다고. and he was the only wise man, 그리고 자신이 유일하게 지혜로운 사람이라고. 이 문장 전체를 해석하면, 그는 그들이 모두 틀렸고 자신이 유일하게 지혜로운 사람이라고 생각했다.","hl":"m"},{"n":37,"text":"이 문장은 그의 자기중심적인 생각이 절정에 이르는 부분이에요. 그는 모든 사람이 틀렸고 자신만이 지혜로운 사람이라고 단정하고 있어요. 이런 태도는 우화가 전하려는 교훈과 맞닿아 있어요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 thought 뒤에 that이 생략된 목적절이에요. He thought they were all wrong에서 thought 뒤에 that이 생략되었고, 그 뒤에 완전한 절이 목적어로 온 거죠. 두 번째 어법 포인트는 and에 의한 병렬 구조예요. and가 앞 절 they were all wrong과 뒤 절 he was the only wise man을 대등하게 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>다섯 번째 남자는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 올라 \u003cb class=\"key\">숲 \u003c/b>\u003cb class=\"key\">전체\u003c/b>를 보려 했다.\u003c/li>\u003cli>꼭대기에서 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 살펴 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 찾았다.\u003c/li>\u003cli>알리러 내려왔을 때 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">사람들은 \u003c/b>\u003cb class=\"key\">이미 \u003c/b>\u003cb class=\"key\">떠나\u003c/b> 있었다.\u003c/li>\u003cli>그는 \u003cb class=\"key\">그들이 \u003c/b>\u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">틀렸고\u003c/b> \u003cb class=\"key\">자신만 \u003c/b>\u003cb class=\"key\">지혜롭다\u003c/b>고 생각했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The fifth man found the shortest way out from a high vantage point, but everyone else had already left, so he concluded only he was wise.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">숲에서 길을 잃은 다섯 번째 남자가 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">나무\u003c/b>에 올라 \u003cb class=\"key\">최단 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 찾았지만, 내려왔을 때는 모두 떠난 뒤였다. 그는 \u003cb class=\"key\">자신만 \u003c/b>\u003cb class=\"key\">지혜롭다\u003c/b>고 생각했지만 \u003cb class=\"key\">소통\u003c/b>이 먼저 끊겼다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"정리하면, 다섯 번째 남자는 나무 위에서 최단 경로를 찾았지만 이미 사람들은 떠나 버렸어요. 함께할 사람이 없었기 때문에 아무리 좋은 답도 의미를 잃게 된 거죠. 마지막 문장에서 그는 자신만 현명하다고 생각하지만, 여러분은 소통이 먼저라는 점을 꼭 기억하세요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
