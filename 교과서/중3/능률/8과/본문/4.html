@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 8과 본문4","audioDir":"4_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 8과\u003cbr>본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Find Your Own Path in Life\u003c/h1>\u003ch2>삶에서 자신만의 길을 찾아라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>숲에서 다섯 남자가 각자 선택한 길로 \u003cb class=\"key\">개척자\u003c/b>와 \u003cb class=\"key\">안내자\u003c/b>가 된 이야기를 통해, 우리도 남의 여정과 비교하지 말고 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들어 행동해야 한다는 교훈을 전한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You have to create your own path in life.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중3 능률 8과 본문 마지막 부분을 함께 볼게요. 이 글은 다섯 남자가 각자 자기 길을 찾는 이야기를 통해, 우리 인생도 남과 비교하지 말고 자기 길을 만들어야 한다는 메시지를 전해요. 요지는 You have to create your own path입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 다섯 남자가 숲에서 서로 다른 선택을 한 이야기를 바탕으로 삶의 태도를 전하는 우화 형식의 글입니다. 여기서 \u003cb class=\"key\">pioneer\u003c/b>는 남이 가 보지 않은 곳을 처음 열어 가는 사람이고, \u003cb class=\"key\">guide\u003c/b>는 이미 경험한 길을 바탕으로 남을 이끄는 사람이죠. 인생을 \u003cb class=\"key\">journey\u003c/b>에 비유하는 표현은 영어권에서 매우 흔한데, journey는 단순한 이동이 아니라 성장과 선택의 과정을 뜻해요. 등산로에서 남이 만든 길만 따라가면 새로운 풍경을 보기 어렵듯이, 삶에서도 자기만의 길을 찾는 것이 중요합니다. 이런 \u003cb class=\"key\">path\u003c/b>의 비유는 자기 삶의 방향을 상징합니다.\u003c/div>","segs":[{"n":2,"text":"이 글은 다섯 남자가 숲에서 서로 다른 선택을 한 이야기를 바탕으로 삶의 태도를 전하는 우화 형식의 글이에요. 여기서 pioneer는 남이 가 보지 않은 곳을 처음 열어 가는 사람이고, guide는 이미 경험한 길을 바탕으로 남을 이끄는 사람이죠. 인생을 journey에 비유하는 표현은 영어권에서 매우 흔한데, journey는 단순한 이동이 아니라 성장과 선택의 과정을 뜻해요. 등산로에서 남이 만든 길만 따라가면 새로운 풍경을 보기 어렵듯이, 삶에서도 자기만의 길을 찾는 것이 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>개척자가 된 남자\u003csmall>예시 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>곧게 간 남자는 \u003cb class=\"key\">개척자\u003c/b>가 되었다. 그는 숲을 벗어나 아무도 이전에 가 본 적이 없는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">땅\u003c/b>을 발견했다. 그 덕분에 사람들은 이 새롭고 아름다운 땅을 \u003cb class=\"key\">누릴 \u003c/b>\u003cb class=\"key\">수\u003c/b> 있었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>안내자가 된 남자\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>나무에 오른 남자는 \u003cb class=\"key\">안내자\u003c/b>가 되었다. 그는 여러 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 발견했기 때문에 사람들에게 목적지까지 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 찾는 법을 가르칠 수 있었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인생 여정의 교훈\u003csmall>적용 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이렇게 다섯 남자는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 찾았다. 우리도 각자 삶에서 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">여행\u003c/b>을 하고 있다. 한 \u003cb class=\"key\">여정\u003c/b>을 다른 여정과 비교할 수 없다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>자기 길 만들기\u003csmall>주장/결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>당신은 \u003cb class=\"key\">당신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들어 가야 한다. 자신의 목소리를 듣고 \u003cb class=\"key\">결정\u003c/b>하고 그 결정에 따라 \u003cb class=\"key\">행동\u003c/b>하라. 그러면 언젠가 자신에게 \u003cb class=\"key\">맞는 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 살아가고 있음을 깨닫게 된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 흐름은 첫 번째 문장부터 세 번째 문장까지예요. 곧게 간 남자가 개척자가 되어 숲을 벗어나 아무도 가 본 적 없던 곳을 발견했다는 내용이에요. 이 남자 덕분에 사람들은 새롭고 아름다운 땅을 누릴 수 있었죠. 여기서 pioneer는 개척자, discover는 발견하다라는 뜻으로 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 흐름은 네 번째 문장과 다섯 번째 문장이에요. 이번에는 나무 위로 올라간 남자가 안내자가 되었어요. 그는 여러 길을 알고 있어서 사람들에게 목적지까지 가장 빠른 길을 찾는 방법을 가르쳐 줄 수 있었어요. guide는 안내자, destination은 목적지라는 뜻이에요.","hl":"f1"},{"n":6,"text":"세 번째 흐름은 여섯 번째와 일곱 번째 문장이에요. 이런 식으로 다섯 남자는 각자 자기만의 길을 찾게 됐어요. 우리도 그들처럼 삶에서 각자 자기만의 여행을 하고 있고, 한 여정을 다른 여정과 비교할 수 없다는 적용이 나와요. 여기서 journey는 단순한 여행이 아니라 인생 여정이라는 의미로 쓰였어요.","hl":"f2"},{"n":7,"text":"마지막 흐름은 여덟 번째 문장부터 열 번째 문장까지예요. 당신은 당신만의 길을 만들어 가야 한다고 주장해요. 그러기 위해 자신의 목소리를 듣고, 결정하고, 그 결정에 따라 행동하라고 조언해요. 그러면 언젠가 자신에게 맞는 삶을 살아가고 있다는 것을 깨닫게 된다고 말해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">앞부분에서는 곧게 간 남자와 나무에 오른 남자의 \u003cb class=\"key\">선택과 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 예로 들어 보여 준다. 이 예시를 바탕으로 뒷부분에서 우리 각자의 \u003cb class=\"key\">인생 \u003c/b>\u003cb class=\"key\">여정\u003c/b>에 적용하며 중심 주장을 드러낸다. 중심 문장은 8번 문장으로, \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들어야 한다는 주장이 미괄식으로 제시된다. 이어서 9번과 10번 문장은 그 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">방법\u003c/b>과 \u003cb class=\"key\">결과\u003c/b>를 덧붙인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This is how (6)\u003c/b>\u003cspan>정리/결과\u003c/span>\u003cb>Like them (7)\u003c/b>\u003cspan>유사/적용\u003c/span>\u003cb>Since (5)\u003c/b>\u003cspan>이유\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">their own paths\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your own path\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the life that is right for you\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 다섯 남자의 이야기를 예로 들어 우리 삶을 비유하는 구조예요. 앞부분에서는 곧게 간 남자와 나무에 오른 남자의 선택과 결과를 보여 주고, 뒷부분에서 우리 각자의 인생 여정에 적용해요. 중심 문장은 여덟 번째 문장인 You have to create your own path로, 자신의 길을 만들어야 한다는 주장이 미괄식으로 드러나요. 그 다음에는 행동 방법과 결과를 덧붙여요.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 여섯 번째 문장의 This is how는 앞의 이야기를 정리하면서 다음 내용으로 이어 주는 신호예요. 일곱 번째 문장의 Like them은 앞의 이야기를 우리에게 적용하는 유사 표현이에요. 다섯 번째 문장의 Since는 이유를 나타내고, 열 번째 문장의 Then은 앞의 행동에 따른 결과를 나타내는 신호예요. 또한 their own paths에서 your own path, the life that is right for you로 바꾸어 말하며 핵심 개념을 반복하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>go straight\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>곧게 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pioneer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개척자\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>land\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>guide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안내자, 길잡이\u003c/span>\u003c/div>\u003cdiv>\u003cb>since\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길, 진로\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>teach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가르치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>destination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적지\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>journey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행, 여정\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 귀 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a decision\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>act on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라 행동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알맞은, 올바른\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 꼭 알아야 할 단어를 짚어 볼게요. pioneer는 개척자, guide는 안내자라는 뜻으로 두 남자의 역할을 나타내는 핵심 단어예요. journey는 여행이지만 여기서는 인생 여정이라는 의미로 쓰였고, destination은 목적지예요. create는 만들다, realize는 깨닫다, make a decision은 결정하다라는 뜻으로 마지막 조언을 이해하는 데 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">pioneer\u003c/b>\u003cspan class=\"m\">개척자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">explorer\u003c/span>\u003cspan class=\"s\">trailblazer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">follower\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">guide\u003c/b>\u003cspan class=\"m\">안내자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">leader\u003c/span>\u003cspan class=\"s\">mentor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">follower\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">path\u003c/b>\u003cspan class=\"m\">길, 진로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">way\u003c/span>\u003cspan class=\"s\">route\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">obstacle\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">demolish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compare\u003c/b>\u003cspan class=\"m\">비교하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contrast\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 둘게요. pioneer는 explorer나 trailblazer와 뜻이 가깝고, follower와 반대 개념이에요. discover는 find나 detect와 비슷하고 miss나 overlook과 반대예요. guide는 leader나 mentor와 가깝고, path는 way나 route와 바꾸어 쓸 수 있어요. create는 make나 produce와 비슷하고 destroy와 반대이며, realize는 recognize나 understand와 가깝고 misunderstand나 ignore와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자는\u003c/span>\u003cspan class=\"en\">The man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">똑바로 간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">straight\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개척자가 되었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pioneer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">똑바로 간 남자는 개척자가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 남자 중 한 명이 곧장 나아가 \u003cb class=\"key\">개척자\u003c/b>가 되었다는 첫 번째 사례를 제시합니다. 'went straight'는 문자 그대로의 \u003cb class=\"key\">직진\u003c/b>이 아니라, 자기 길을 망설이지 않고 선택한 태도를 비유적으로 보여 줍니다. 뒤에 나올 여러 인물의 선택과 결과를 이끌어 내는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(사람) + who + 동사 : \"똑바로 간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 become\u003c/span> : 주어 + become + 주격보어(명사) : \"개척자가 되었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The man, 그 남자는. who went straight, 똑바로 간. became a pioneer, 개척자가 되었다.. 이 문장 전체를 해석하면, 똑바로 간 남자는 개척자가 되었다.","hl":"m"},{"n":13,"text":"이 문장은 다섯 명 중 첫 번째 남자가 곧장 나아가 개척자가 되었다는 이야기예요. 여기서 went straight는 직역하면 똑바로 갔다는 뜻이지만, 자기 길을 주저 없이 선택했다는 의미로 볼 수 있어요. 뒤에 나오는 다른 인물들의 선택과 비교되는 출발점이 되는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 who went straight예요. who는 앞에 있는 The man을 수식하는 주격 관계대명사인데, 사람 선행사 뒤에 who와 동사가 와서 그 남자가 똑바로 갔다는 뜻을 만들어요. 두 번째 포인트는 became a pioneer예요. become은 주격 보어를 필요로 하는 불완전자동사라서, 뒤에 명사 pioneer가 보어로 와서 개척자가 되었다는 의미를 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 숲을 벗어나\u003c/span>\u003cspan class=\"en\">He left the forest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 장소들을 발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">discovered \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">places \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무도 이전에 가 본 적이 없는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">else \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">before\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 숲을 벗어나 아무도 이전에 가 본 적이 없는 곳들을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개척자가 한 구체적인 행동을 설명하는 문장으로, 익숙한 \u003cb class=\"key\">숲\u003c/b>을 벗어나 아무도 가 보지 못한 \u003cb class=\"key\">미지의 \u003c/b>\u003cb class=\"key\">장소\u003c/b>를 발견했음을 보여 줍니다. 앞 문장의 pioneer가 무엇을 했는지 풀어 주며, 남들이 가지 않은 길을 개척했다는 의미를 강조합니다. places no one else had been before는 \u003cb class=\"key\">선행사\u003c/b>를 꾸며 완전히 새로운 곳임을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and 병렬\u003c/span> : 동사구 A + and + 동사구 B : \"그리고 장소들을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where 생략\u003c/span> : 선행사(장소) + (where) + 주어 + 동사 : \"아무도 이전에 가 본 적이 없는 곳들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료 had p.p.\u003c/span> : had + 과거분사 : \"가 본 적이 있었다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He left the forest, 그는 숲을 벗어나. and discovered places, 그리고 장소들을 발견했다. no one else had been before, 아무도 이전에 가 본 적이 없는.. 이 문장 전체를 해석하면, 그는 숲을 벗어나 아무도 이전에 가 본 적이 없는 곳들을 발견했다.","hl":"m"},{"n":16,"text":"이 문장은 개척자가 구체적으로 한 일을 설명해요. 숲을 벗어나 아무도 가 보지 못한 새로운 장소를 발견한 거죠. no one else had been before는 앞의 places를 꾸며 주는 표현으로, 완전히 미지의 영역을 뜻해요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 and discovered places예요. and가 앞의 left the forest와 discovered places를 대등하게 연결하고 있어요. 두 번째 포인트는 places no one else had been before인데, places 뒤에 관계부사 where가 생략되어 있어요. where는 장소를 선행사로 받아서 뒤에 완전한 절을 이끌며, 아무도 이전에 가 본 적이 없는 곳이라는 뜻을 만들어요. 세 번째 포인트는 had been이에요. 과거완료로 과거의 한 시점보다 더 이전의 경험을 나타내는데, before와 함께 쓰여 이미 그 전에 가 본 적이 없다는 의미를 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자 덕분에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thanks \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 누릴 수 있었다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 새롭고 아름다운 땅을.\u003c/span>\u003cspan class=\"en\">these new beautiful lands.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 남자 덕분에, 사람들은 이 새롭고 아름다운 땅을 누릴 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개척자의 발견이 다른 사람들에게 \u003cb class=\"key\">혜택\u003c/b>을 주었다는 결과를 제시합니다. Thanks to him은 그 덕분에라는 뜻의 \u003cb class=\"key\">원인 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, 앞 문장의 행동과 긍정적인 결과를 자연스럽게 연결합니다. 이로써 개척자의 선택이 공동체에 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 미쳤음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 thanks to (원인)\u003c/span> : thanks to + 명사/대명사 : \"그 남자 덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could\u003c/span> : 조동사 could + 동사원형 : \"누릴 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Thanks to him, 그 남자 덕분에. people could enjoy, 사람들은 누릴 수 있었다. these new beautiful lands, 이 새롭고 아름다운 땅을.. 이 문장 전체를 해석하면, 그 남자 덕분에, 사람들은 이 새롭고 아름다운 땅을 누릴 수 있었다.","hl":"m"},{"n":19,"text":"이 문장은 개척자의 발견이 다른 사람들에게 어떤 영향을 주었는지 보여 줘요. thanks to him은 그 사람 덕분에라는 뜻으로, 앞 문장의 결과를 자연스럽게 이어 주는 표현이에요. 그의 선택이 공동체에 긍정적인 혜택을 주었다는 점이 드러나요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 Thanks to him이에요. thanks to는 덕분에라는 뜻의 전치사라서 뒤에 명사나 대명사가 와요. 여기서는 him이 와서 그 남자 덕분에라는 원인을 나타내요. 두 번째 포인트는 could enjoy예요. could는 can의 과거형 조동사로 과거의 가능을 나타내고, 뒤에는 동사원형 enjoy가 와서 누릴 수 있었다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자는\u003c/span>\u003cspan class=\"en\">The man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무 위로 올라간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">climbed \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안내자가 되었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">guide\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나무 위로 올라간 남자는 안내자가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 남자 중 나무 위로 올라간 사람이 \u003cb class=\"key\">안내자\u003c/b>가 되었다는 이야기입니다. 나무 위에서 여러 갈래 길을 내려다본 경험이 사람들을 이끄는 능력이 되었음을 보여 줍니다. who는 사람 선행사 The man을 수식하는 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(사람) + who + 동사 : \"나무 위로 올라간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">become + 주격 보어(2형식)\u003c/span> : 주어 + become + 명사 보어 : \"안내자가 되었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The man, 그 남자는. who climbed the tree, 나무 위로 올라간. became a guide, 안내자가 되었다.. 이 문장 전체를 해석하면, 나무 위로 올라간 남자는 안내자가 되었다.","hl":"m"},{"n":22,"text":"이 문장은 다섯 남자 중 나무 위로 올라간 남자가 안내자가 되었다는 이야기입니다. 나무 위에서 여러 갈래 길을 내려다본 경험이 사람들을 이끄는 능력이 되었어요. who는 사람을 가리키는 The man을 뒤에서 꾸며 주는 주격 관계대명사입니다.","hl":"mn"},{"n":23,"text":"이 문장의 첫 번째 핵심은 who climbed the tree입니다. who는 사람을 선행사로 하는 주격 관계대명사이고, climbed의 주어 역할을 해요. 두 번째 핵심은 became a guide입니다. become은 뒤에 명사 보어를 취하는 2형식 동사라서 주어의 상태나 신분 변화를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 여러 다양한 길을 발견했었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">paths\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 사람들에게 가르쳐 줄 수 있었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">teach\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 빠른 길을 찾는 법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">quickest \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 목적지에 이르는\u003c/span>\u003cspan class=\"en\">to their destinations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 여러 다양한 길을 발견했었기 때문에, 사람들에게 그들의 목적지에 이르는 가장 빠른 길을 찾는 법을 가르쳐 줄 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나무 위로 올라갔던 남자가 안내자가 된 이유를 설명합니다. 여러 길을 직접 경험했기 때문에 다른 사람에게 가장 빠른 길을 알려 줄 능력이 생겼다는 뜻이에요. had found는 가르칠 수 있었던 때보다 앞선 경험을 나타내는 \u003cb class=\"key\">과거완료\u003c/b>이고, was able to는 실제로 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있었다\u003c/b>는 뜻이며, how to find는 \u003cb class=\"key\">찾는 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이라는 명사구로 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 접속사 Since와 과거완료\u003c/span> : Since + 주어 + had p.p., 주어 + 동사 : \"그가 여러 다양한 길을 발견했었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to\u003c/span> : was able to + 동사원형 : \"가르쳐 줄 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : how + to부정사 : \"찾는 법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">최상급\u003c/span> : the + 최상급 + 명사 : \"가장 빠른 길\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Since he had found many different paths, 그가 여러 다양한 길을 발견했었기 때문에. he was able to teach people, 그는 사람들에게 가르쳐 줄 수 있었다. how to find the quickest ways, 가장 빠른 길을 찾는 법을. to their destinations, 그들의 목적지에 이르는. 이 문장 전체를 해석하면, 그는 여러 다양한 길을 발견했었기 때문에, 사람들에게 그들의 목적지에 이르는 가장 빠른 길을 찾는 법을 가르쳐 줄 수 있었다.","hl":"m"},{"n":25,"text":"이 문장은 나무 위로 올라갔던 남자가 안내자가 된 이유를 설명해요. 여러 길을 직접 경험했기 때문에 다른 사람에게 가장 빠른 길을 알려 줄 능력이 생겼다는 뜻이에요. had found는 가르칠 수 있었던 때보다 앞선 경험을 나타내는 과거완료이고, was able to는 실제로 할 수 있었다는 뜻이며, how to find는 찾는 방법이라는 명사구로 쓰였습니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 Since he had found many different paths입니다. Since는 때문에라는 뜻의 이유 접속사이고, had found는 과거완료로 더 먼저 일어난 경험을 나타내요. 두 번째 포인트는 was able to teach입니다. was able to는 과거에 실제로 해낸 능력을 가리켜요. 세 번째 포인트는 how to find입니다. 의문사와 to부정사가 결합해서 찾는 방법이라는 명사구가 되었고, teach의 직접목적어 역할을 해요. 네 번째 포인트는 the quickest ways입니다. quickest는 quick의 최상급이라서 가장 빠른 길이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 식으로\u003c/span>\u003cspan class=\"en\">This is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다섯 남자가 찾아낸\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">five \u003c/span>\u003cspan class=\"tgt\">men \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신만의 길을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">paths\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 식으로 다섯 남자는 자신만의 길을 찾아냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지금까지 서로 다른 선택을 한 다섯 남자가 각자 자기만의 길을 찾게 되었음을 정리합니다. This is how는 '이런 식으로 하다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, how절이 be동사의 보어로 쓰였습니다. 이제 이야기를 우리 인생에 적용하는 전환점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">how가 이끄는 간접의문문(명사절)\u003c/span> : This is + how + 주어 + 동사 : \"다섯 남자가 자신만의 길을 찾아낸 방식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This is how, 이런 식으로. the five men found, 다섯 남자가 찾아낸. their own paths, 그들 자신만의 길을. 이 문장 전체를 해석하면, 이런 식으로 다섯 남자는 자신만의 길을 찾아냈다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 나온 다섯 남자의 이야기를 정리하면서 이런 식으로 각자 자기만의 길을 찾게 되었다고 말해요. This is how는 이런 식으로라는 뜻의 관용 표현이고, 뒤에 how절이 와서 그 방법을 설명해 줘요. 이제 이 이야기를 우리 인생에 적용하는 전환점이 되는 문장입니다.","hl":"mn"},{"n":29,"text":"이 문장의 핵심은 how the five men found their own paths입니다. how절은 is의 보어로 쓰이는 명사절이고, 어떻게 다섯 남자가 자신만의 길을 찾았는지라는 뜻이에요. 간접의문문은 의문사 뒤에 주어와 동사가 평서문 어순으로 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들처럼\u003c/span>\u003cspan class=\"en\">Like them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 각자 삶 속에서 자신만의 여행을 하고 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">each\u003c/span> on our own journey in life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리는 비교할 수 없다\u003c/span>\u003cspan class=\"en\">and we cannot \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">compare \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 여정을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">journey \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 여정과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들처럼 우리는 각자 삶 속에서 자신만의 여행을 하고 있고, 우리는 한 여정을 다른 여정과 비교할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 남자의 서로 다른 길 찾기를 우리 인생에 적용하는 핵심 문장입니다. 우리 각자의 삶은 \u003cb class=\"key\">독자적인 \u003c/b>\u003cb class=\"key\">여정\u003c/b>이므로 한 여정을 다른 여정과 \u003cb class=\"key\">비교할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 메시지를 전합니다. 남의 길과 비교하지 말고 자신만의 길을 가라는 교훈으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">each의 부사적 용법 (각자)\u003c/span> : 복수 주어 + be동사 + each + ... : \"우리는 각자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">compare A to B (A를 B와 비교하다)\u003c/span> : compare + A(목적어) + to + B : \"한 여정을 다른 여정과 비교하다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Like them, 그들처럼. we are each on our own journey in life, 우리는 각자 삶 속에서 자신만의 여행을 하고 있고. and we cannot compare, 그리고 우리는 비교할 수 없다. one journey, 한 여정을. to another, 다른 여정과. 이 문장 전체를 해석하면, 그들처럼 우리는 각자 삶 속에서 자신만의 여행을 하고 있고, 우리는 한 여정을 다른 여정과 비교할 수 없다.","hl":"m"},{"n":31,"text":"이 문장은 다섯 남자의 이야기를 우리 인생에 적용하는 핵심 문장이에요. 우리는 각자 삶이라는 여정을 가고 있고, 한 여정을 다른 여정과 비교할 수 없다는 뜻이에요. 결국 남의 길과 비교하지 말고 자신만의 길을 찾아야 한다는 교훈으로 이어져요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 we are each에 쓰인 each의 쓰임이에요. each는 주어 뒤에서 각자라는 뜻으로 쓰여서 주어 전체를 강조해 줘요. 두 번째 어법 포인트는 compare one journey to another에 쓰인 compare A to B 구문이에요. compare는 타동사로 목적어 one journey를 취하고 비교 대상은 전치사 to로 연결해 줘요. 그래서 한 여정을 다른 여정과 비교하다가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 만들어야 한다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신만의 길을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">path\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 당신만의 길을 만들어 가야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 남자의 이야기에서 얻은 교훈을 직접적으로 요구하는 핵심 문장입니다. 자신의 삶은 남이 정해 준 길이 아니라 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 스스로 \u003cb class=\"key\">만들어 \u003c/b>\u003cb class=\"key\">가야\u003c/b> 한다는 의미입니다. 이어지는 구체적인 행동 지침의 근거가 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (의무/필요)\u003c/span> : have to + create (동사원형) : \"만들어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">own의 형용사적 용법 (자신만의)\u003c/span> : 소유격 + own + 명사 : \"당신만의 길\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"You have to create, 당신은 만들어야 한다. your own path, 당신만의 길을. 이 문장 전체를 해석하면, 당신은 당신만의 길을 만들어 가야 한다.","hl":"m"},{"n":34,"text":"이 문장은 다섯 남자 이야기에서 얻은 교훈을 직접적으로 요구하는 문장이에요. 당신은 당신만의 길을 만들어야 한다는 뜻이에요. 남이 만든 길을 따라가는 게 아니라 자신이 선택하고 개척해야 한다는 핵심 메시지예요.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 have to create에 쓰인 have to예요. have to는 의무나 필요를 나타내는 표현으로 뒤에 동사원형 create가 와서 만들어야 한다가 되는 거죠. 두 번째 어법 포인트는 your own path에 쓰인 own의 쓰임이에요. own은 소유격 뒤에서 자신만의라는 뜻으로 명사를 강조해 줘요. 그래서 당신만의 길이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 목소리를 듣고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Listen \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">decision\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결정에 따라 행동하라\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신의 목소리를 듣고, 결정하고, 그 결정에 따라 행동하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자신만의 길을 만드는 구체적인 방법 세 가지를 명령문으로 나열한 문장입니다. \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">목소리\u003c/b>에 귀 기울이고, \u003cb class=\"key\">결정\u003c/b>을 내리고, 그 결정대로 \u003cb class=\"key\">행동\u003c/b>하는 과정이 중요함을 강조합니다. 앞 문장의 추상적인 조언을 실천하는 행동 지침 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : 동사원형 + ... : \"자신의 목소리를 들어라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 명사 (관용 표현)\u003c/span> : make + a decision : \"결정을 내리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">act on (숙어) (~에 따라 행동하다)\u003c/span> : act on + 목적어 : \"그 결정에 따라 행동하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Listen to yourself, 자신의 목소리를 듣고. make a decision, 결정하고. and act on it, 그 결정에 따라 행동하라. 이 문장 전체를 해석하면, 자신의 목소리를 듣고, 결정하고, 그 결정에 따라 행동하라.","hl":"m"},{"n":37,"text":"이 문장은 자신만의 길을 만드는 구체적인 방법 세 가지를 명령문으로 나열한 문장이에요. 자기 자신의 목소리를 듣고, 결정하고, 그 결정에 따라 행동하라는 뜻이에요. 앞 문장의 you have to create your own path를 실천하는 행동 지침이라고 볼 수 있죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 Listen to yourself에 쓰인 명령문이에요. 명령문은 주어 없이 동사원형으로 시작해서 상대에게 지시나 권고를 해요. 여기서는 Listen, make, act 세 개의 동사원형이 and로 연결되어 있죠. 두 번째 어법 포인트는 make a decision이에요. make는 명사 decision과 함께 쓰여 결정하다라는 관용 표현이 됩니다. 세 번째 어법 포인트는 act on it이에요. act on은 어떤 것에 따라 행동하다라는 뜻의 숙어이고 it은 앞에 나온 decision을 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 언젠가,\u003c/span>\u003cspan class=\"en\">Then, someday,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 깨닫게 될 것이다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">realize \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 그 삶을 살아오고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">living\u003c/span> the life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 맞는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 언젠가 당신은 당신에게 맞는 삶을 살아가고 있다는 것을 깨닫게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 남자의 이야기가 주는 교훈을 마무리하는 결론입니다. 앞에서 '자신만의 길을 만들어 행동하라'고 한 충고를 실천하면, 언젠가는 스스로 \u003cb class=\"key\">맞는 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 살아오고 있었음을 깨닫게 된다는 뜻이에요. 'have been living'은 과거부터 현재까지 이어지는 \u003cb class=\"key\">현재완료진행\u003c/b>형으로, 깨닫는 순간에도 그 삶이 계속되고 있음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 목적어)\u003c/span> : realize + that + 주어 + 동사 : \"~라는 것을 깨닫게 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료진행형\u003c/span> : have + been + V-ing : \"살아오고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격)\u003c/span> : 선행사(사물) + that + 동사 : \"당신에게 맞는\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then, someday, 그러면 언젠가. you will realize, 당신은 깨닫게 될 것이다. that you have been living the life, 당신이 그 삶을 살아오고 있다는 것을. that is right for you, 당신에게 맞는. 이 문장 전체를 해석하면, 그러면 언젠가 당신은 당신에게 맞는 삶을 살아가고 있다는 것을 깨닫게 될 것이다.","hl":"m"},{"n":40,"text":"이 문장은 이 글의 마지막 교훈을 정리하는 문장입니다. 앞에서 말한 자신만의 길을 만들고 행동하라는 충고를 실천하면, 언젠가는 자신에게 맞는 삶을 살아오고 있었음을 스스로 깨닫게 된다는 의미예요. 특히 have been living은 현재완료진행형으로, 그 삶이 과거부터 현재까지 계속되고 있다는 느낌을 줍니다.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 will realize that에서 that이 이끄는 명사절이에요. realize의 목적어 자리에 that절이 왔고, that 뒤에 주어 you와 동사 have been living이 있는 완전한 절이 왔으므로 접속사 that입니다. 두 번째 포인트는 have been living 현재완료진행형이에요. 과거부터 현재까지 삶이 계속되고 있음을 나타내죠. 세 번째 포인트는 that is right for you의 관계대명사 that이에요. 앞에 나온 the life를 수식하면서 뒤에 오는 is의 주어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>곧게 간 남자는 \u003cb class=\"key\">개척자\u003c/b>가 되어 새로운 땅을 발견했고 사람들이 즐기게 했다.\u003c/li>\u003cli>나무에 오른 남자는 \u003cb class=\"key\">안내자\u003c/b>가 되어 발견한 길로 목적지까지 가장 빠른 길을 가르쳤다.\u003c/li>\u003cli>이처럼 다섯 남자는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 찾았고 우리도 각자의 \u003cb class=\"key\">인생 \u003c/b>\u003cb class=\"key\">여정\u003c/b>을 비교할 수 없다.\u003c/li>\u003cli>\u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들기 위해 자신에게 귀 기울여 \u003cb class=\"key\">결정\u003c/b>하고 행동하면 맞는 삶을 살게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You have to create your own path in life.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">숲에서 다섯 남자가 각자 선택한 길로 \u003cb class=\"key\">개척자\u003c/b>와 \u003cb class=\"key\">안내자\u003c/b>가 된 이야기를 통해, 우리도 남의 여정과 비교하지 말고 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들어 행동해야 한다는 교훈을 전한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 다섯 남자의 이야기를 통해 인생에서도 남의 길과 비교하지 말고 자신만의 길을 만들어야 한다는 교훈을 배웠어요. 자신의 목소리를 듣고 결정하고 행동하는 것이 중요하다는 점, 꼭 기억하세요. 이제 여러분도 자신에게 맞는 삶을 향해 한 걸음 나아가 보길 바랄게요. 오늘 수업은 여기까지예요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
