@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 8과 본문3","audioDir":"3_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 8과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Three Paths, One Wisdom\u003c/h1>\u003ch2>세 갈래 길, 하나의 지혜\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>세 남자가 각자 다른 길을 선택했지만 모두 \u003cb class=\"key\">지혜로웠다\u003c/b>. 왼쪽 남자는 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 익혔고, 오른쪽 남자는 \u003cb class=\"key\">친절\u003c/b>로 도둑들을 변화시켰으며, 뒤돌아 간 남자는 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Everyone was wise because each man chose his own path and created his future through survival, kindness, or building a safe path.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 능률 영어 교과서의 세 번째 본문 지문을 함께 볼게요. 이 글은 세 남자가 서로 다른 길을 선택하지만 결국 모두 지혜로웠다는 이야기예요. 요약하면, 왼쪽 남자는 생존 기술을 익혔고, 오른쪽 남자는 친절로 도둑을 변화시켰고, 뒤돌아 간 남자는 안전한 길을 만들었어요. 핵심 요지는 Everyone was wise because each man chose his own path and created his future through survival, kindness, or building a safe path입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 우화 형식이라서 길이라는 말이 삶의 선택을 상징한다고 볼 수 있어요. 숲은 우리가 겪는 낯선 상황이나 어려움을 뜻하고요. 지혜 wisdom는 단순한 지식 knowledge와 달리 경험을 통해 얻는 실천적 판단력이에요. 예를 들어 같은 산을 오를 때 누구는 험한 길로 체력을 기르고, 누구는 동행을 도와주고, 누구는 쉬운 길을 내는 것과 비슷하죠. 그래서 이 글에서는 어떤 길이 더 낫다고 말하기보다, 각자가 자기 길에서 어떻게 \u003cb class=\"key\">살아내고\u003c/b> 남을 도왔는지가 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"이 글은 우화 형식이라서 길이라는 말이 삶의 선택을 상징한다고 볼 수 있어요. 숲은 우리가 겪는 낯선 상황이나 어려움을 뜻하고요. 지혜 wisdom는 단순한 지식 knowledge와 달리 경험을 통해 얻는 실천적 판단력이에요. 예를 들어 같은 산을 오를 때 누구는 험한 길로 체력을 기르고, 누구는 동행을 도와주고, 누구는 쉬운 길을 내는 것과 비슷하죠. 그래서 이 글에서는 어떤 길이 더 낫다고 말하기보다, 각자가 자기 길에서 어떻게 살아내고 남을 도왔는지가 핵심입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>모두 지혜로웠다\u003csmall>주장 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 문장은 앞선 판단이 \u003cb class=\"key\">틀렸다\u003c/b>고 반전시킨다. 이어서 모든 사람이 \u003cb class=\"key\">지혜로웠다\u003c/b>고 선언한다. 각 남자는 스스로 \u003cb class=\"key\">길\u003c/b>을 선택하고 \u003cb class=\"key\">미래\u003c/b>를 만들었기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>왼쪽 길의 시련과 극복\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>왼쪽으로 간 남자는 숲 깊이 들어가 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">동물\u003c/b>에게 공격받고 \u003cb class=\"key\">굶어 \u003c/b>\u003cb class=\"key\">죽을 \u003c/b>\u003cb class=\"key\">뻔했다\u003c/b>. 하지만 곧 자신을 \u003cb class=\"key\">지키고\u003c/b> 먹을 것을 찾는 방법을 배웠다. 결국 숲을 빠져나와 다른 사람들에게 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 가르쳤다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오른쪽 길의 친절과 변화\u003csmall>예시 · 문장 8–12\u003c/small>\u003c/h4>\u003cp>오른쪽으로 간 남자는 \u003cb class=\"key\">도둑\u003c/b> 무리를 만나 모든 것을 빼앗기고 합류했다. 그는 그들과 함께 있는 동안 큰 \u003cb class=\"key\">친절\u003c/b>을 베풀었다. 도둑들은 감동하여 그의 \u003cb class=\"key\">지혜\u003c/b>를 배워 마침내 \u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 되었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>뒤로 간 길의 안전한 선택\u003csmall>예시 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>뒤돌아 간 남자는 숲 주변에 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들었다. 이 길을 이용하면 시간이 조금 더 걸려도 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 목적지에 다다를 수 있었다. 그의 선택은 비록 느리지만 모두를 위한 길을 남겼다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 세 남자의 이야기가 어떻게 전개되는지 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 앞선 판단을 뒤집으면서 모두가 지혜로웠다고 선언해요. 각 남자가 스스로 길을 선택하고 자기 미래를 만들었기 때문이에요. 이 부분이 이 글의 중심 주장입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 왼쪽으로 간 남자의 이야기예요. 야생 동물에게 공격받고 거의 굶어 죽을 뻔했지만, 자신을 지키고 먹을 것을 찾는 방법을 배웠어요. 결국 숲을 빠져나와 다른 사람들에게 생존 기술을 가르쳤죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 오른쪽으로 간 남자의 이야기예요. 도둑 무리를 만나 모든 것을 빼앗기고 합류했지만, 그들에게 큰 친절을 베풀었어요. 도둑들은 감동해서 그의 지혜를 배우고 지혜로운 사람들이 되었죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 뒤돌아 간 남자의 이야기예요. 숲 주변에 안전한 길을 만들어서, 시간이 조금 더 걸리지만 사람들이 길을 잃지 않고 목적지에 갈 수 있게 했어요. 느리지만 모두를 위한 길을 남긴 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장이 앞선 판단을 반전시키고, 두 번째 문장에서 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">지혜로웠다\u003c/b>는 중심 주장을 제시한다. 이후 세 남자의 이야기가 각각 \u003cb class=\"key\">예시\u003c/b>로 제시된다. 따라서 주장을 먼저 밝히고 사례를 드는 \u003cb class=\"key\">두괄식\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (1)\u003c/b>\u003cspan>앞선 판단을 반전\u003c/span>\u003cb>In the end (7)\u003c/b>\u003cspan>시간 경과에 따른 결과\u003c/span>\u003cb>Later (12)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>even though (14)\u003c/b>\u003cspan>양보와 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his wisdom\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wise men\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 결론을 던지고 뒤에서 세 가지 사례를 드는 두괄식 구조예요. 전개 방식은 예시라고 할 수 있죠. 첫 문장과 두 번째 문장에서 모두가 지혜로웠다는 주장을 제시하고, 그다음 왼쪽, 오른쪽, 뒤로 간 남자의 이야기를 근거로 제시합니다. 그래서 주제문은 두 번째 문장이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"글의 신호어를 보면 However는 앞선 판단을 반전시키는 역할을 해요. In the end와 Later는 시간 흐름에 따른 결과를 보여 주죠. 반복되는 wise, his wisdom, wise men은 같은 개념을 다르게 표현한 것이에요. 이렇게 신호어를 잡으면 흐름이 훨씬 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>wise\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지혜로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길, 진로\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk deeper into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 더 깊이 걸어 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>attack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>die of hunger\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>굶어 죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배우다, 터득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지키다, 보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find food\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>먹을 것을 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the end\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>make one's way out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 빠져나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival skills\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>a group of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 무리의\u003c/span>\u003c/div>\u003cdiv>\u003cb>thief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도둑\u003c/span>\u003c/div>\u003cdiv>\u003cb>take everything from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게서 모든 것을 빼앗다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make him join them\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그가 그들과 합류하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show kindness\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>친절을 베풀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be moved by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 감동받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kindness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친절\u003c/span>\u003c/div>\u003cdiv>\u003cb>wisdom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지혜\u003c/span>\u003c/div>\u003cdiv>\u003cb>wise men\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지혜로운 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>되돌아가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전한 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>even though\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>get lost\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>길을 잃다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 표현을 짚어 볼게요. die of hunger는 굶어 죽다, make one's way out of는 빠져나오다, show kindness는 친절을 베풀다라는 뜻이에요. survival skills는 생존 기술, even though는 비록 무엇일지라도라는 접속사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wise\u003c/b>\u003cspan class=\"m\">지혜로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intelligent\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"s\">prudent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolish\u003c/span>\u003cspan class=\"a\">unwise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">choose\u003c/b>\u003cspan class=\"m\">선택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">select\u003c/span>\u003cspan class=\"s\">pick\u003c/span>\u003cspan class=\"s\">opt for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">지키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">survival\u003c/b>\u003cspan class=\"m\">생존\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">endurance\u003c/span>\u003cspan class=\"s\">existence\u003c/span>\u003cspan class=\"s\">living\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">death\u003c/span>\u003cspan class=\"a\">extinction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">kindness\u003c/b>\u003cspan class=\"m\">친절\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compassion\u003c/span>\u003cspan class=\"s\">goodwill\u003c/span>\u003cspan class=\"s\">benevolence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cruelty\u003c/span>\u003cspan class=\"a\">unkindness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wisdom\u003c/b>\u003cspan class=\"m\">지혜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">insight\u003c/span>\u003cspan class=\"s\">judgment\u003c/span>\u003cspan class=\"s\">sagacity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">folly\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">safe\u003c/b>\u003cspan class=\"m\">안전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">secure\u003c/span>\u003cspan class=\"s\">protected\u003c/span>\u003cspan class=\"s\">harmless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dangerous\u003c/span>\u003cspan class=\"a\">unsafe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lost\u003c/b>\u003cspan class=\"m\">길을 잃은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">astray\u003c/span>\u003cspan class=\"s\">disoriented\u003c/span>\u003cspan class=\"s\">missing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">found\u003c/span>\u003cspan class=\"a\">on track\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 핵심 어휘도 정리할게요. wise의 동의어는 intelligent, sensible, prudent이고 반의어는 foolish, unwise예요. choose는 select, pick, opt for와 바꿔 쓸 수 있고, protect는 defend, guard, shield와 연결되죠. kindness는 compassion, goodwill, benevolence와 유사하고 반대말은 cruelty, unkindness입니다. safe는 secure, protected, harmless와 통하고 dangerous, unsafe와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 틀렸다.\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그가 틀렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 내용을 뒤집는 전환점이다. 앞에서 어떤 예언이나 판단이 나왔고, 그 판단이 잘못되었음을 알린다. \u003cb class=\"key\">However\u003c/b>는 이어지는 반전을, \u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">wrong\u003c/b>은 과거의 상태가 틀렸음을 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장 (주어+be동사+형용사)\u003c/span> : he [주어] + was [be동사] + wrong [형용사 보어] : \"그는 틀렸다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"However, 그러나. he was wrong, 그가 틀렸다.. 이 문장 전체를 해석하면, 그러나 그가 틀렸다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 앞에 나온 판단이 뒤집히는 장면이에요. However는 그런 반전을 알려주고, was wrong은 과거에 틀렸던 상태를 나타내죠. 그래서 이 문장은 이야기의 흐름을 바꾸는 전환점 역할을 해요.","hl":"mn"},{"n":14,"text":"여기서 중요한 건 was wrong이에요. be동사 was 뒤에 형용사 wrong이 와서 주어 he를 설명하는 주격보어가 되었죠. 이렇게 be동사 뒤에 형용사가 오면 주어의 상태를 나타내는 2형식 문장이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Everyone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지혜로웠다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">wise\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두가 지혜로웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 결과를 설명하는 짧은 문장이다. Everyone은 사람 전체를 가리키며, \u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">wise\u003c/b>는 모두가 지혜로운 상태였음을 보여 준다. 이 문장은 뒤에 나올 세 사람의 지혜로운 행동을 아우르는 핵심 주제이기도 하다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 everyone\u003c/span> : everyone [부정대명사] + 단수 동사 : \"모두가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장 (주어+be동사+형용사)\u003c/span> : Everyone [주어] + was [be동사] + wise [형용사 보어] : \"지혜로웠다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Everyone, 모두가. was wise, 지혜로웠다.. 이 문장 전체를 해석하면, 모두가 지혜로웠다.","hl":"m"},{"n":16,"text":"두 번째 문장은 모든 사람이 지혜로웠다고 짧게 정리해 줘요. Everyone은 사람 전체를 하나로 묶어서 말할 때 쓰는 표현이라 단수 동사 was가 왔죠. 여기서 wise는 지혜로운 상태를 뜻해요.","hl":"mn"},{"n":17,"text":"첫 번째로 Everyone을 볼게요. Everyone은 부정대명사라서 단수로 취급해요. 그래서 are가 아니라 was가 와야 해요. 두 번째로 was wise는 be동사 뒤에 형용사 wise가 와서 주어의 상태를 설명하는 2형식 문장이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Each \u003c/span>\u003cspan class=\"tgt\">man\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 길을 선택했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">chosen\u003c/span> his path\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 미래를 만들어 냈다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">created \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">각자 자신의 길을 선택했고 자신의 미래를 만들어 냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 사람의 공통된 성취를 요약하는 문장이다. \u003cb class=\"key\">Each\u003c/b>는 개별성을, \u003cb class=\"key\">had \u003c/b>\u003cb class=\"key\">chosen\u003c/b>은 과거에 이미 선택했음을, \u003cb class=\"key\">created\u003c/b>는 그 선택의 결과로 미래를 만들었음을 보여 준다. 이 문장은 뒤에 이어지는 세 인물의 이야기를 여는 주제문이자, 선택과 결과의 관계를 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">each + 단수 명사\u003c/span> : each [한정사] + man [단수 명사] + 단수 동사 : \"각각의 남자는, 각자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 (had + 과거분사)\u003c/span> : had + chosen(과거분사) : \"선택했었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬\u003c/span> : had chosen his path and (had) created his future : \"그리고 자신의 미래를 만들어 냈다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Each man, 각자. had chosen his path, 자신의 길을 선택했고. and created his future, 자신의 미래를 만들어 냈다.. 이 문장 전체를 해석하면, 각자 자신의 길을 선택했고 자신의 미래를 만들어 냈다.","hl":"m"},{"n":19,"text":"세 번째 문장은 세 사람 모두 각자 자기 길을 선택했고 그 결과로 미래를 만들었다고 정리해 줘요. Each는 한 명 한 명을 따로 본다는 뜻이라서 단수 동사가 왔고, had chosen은 그보다 더 이전에 선택을 마쳤다는 과거완료예요. 결국 선택이 곧 미래를 만든다는 이야기 전체의 핵심 메시지를 담고 있죠.","hl":"mn"},{"n":20,"text":"먼저 Each man을 보면, each는 각각의라는 뜻으로 뒤에 단수 명사 man이 와서 주어 전체를 단수로 만들어 줘요. 그래서 have가 아니라 had가 온 거죠. 다음으로 had chosen은 과거완료로, 이야기의 과거 시점보다 더 앞선 선택임을 나타내요. 마지막으로 and는 had chosen his path와 created his future를 병렬로 연결하는 등위접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왼쪽으로 간 남자는\u003c/span>\u003cspan class=\"en\">The man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸어 들어갔다\u003c/span>\u003cspan class=\"en\">walked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 깊이 숲속으로\u003c/span>\u003cspan class=\"en\">deeper into the forest.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왼쪽으로 간 남자는 숲속으로 더 깊이 걸어 들어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왼쪽으로 간 남자가 숲속으로 더 깊이 들어갔다는 첫 행동을 보여 줍니다. 세 갈래 길에서 왼쪽을 택한 그가 본격적으로 험난한 여정을 시작했음을 암시하며, 뒤에 이어질 시련의 배경이 됩니다. who went to the left는 \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">who\u003c/b>가 이끄는 절로 선행사 The man을 수식하고, deeper into the forest는 \u003cb class=\"key\">숲속으로 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">깊이\u003c/b> 들어갔음을 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사(사람)] + who + [동사 ~] : \"왼쪽으로 간\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The man who went to the left, 왼쪽으로 간 남자는. walked, 걸어 들어갔다. deeper into the forest, 더 깊이 숲속으로. 이 문장 전체를 해석하면, 왼쪽으로 간 남자는 숲속으로 더 깊이 걸어 들어갔다.","hl":"m"},{"n":22,"text":"이 문장은 왼쪽으로 간 남자가 숲속으로 더 깊이 들어갔다는 첫 행동을 보여 줍니다. 세 갈래 길에서 왼쪽을 선택한 그가 본격적으로 험난한 여정을 시작했음을 암시하고, 뒤에 이어질 시련의 배경이 됩니다. who went to the left가 앞의 The man을 꾸며 주는 관계대명사 who이고, deeper into the forest는 숲속으로 더 깊이라는 뜻입니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 주격 관계대명사 who입니다. who went to the left가 선행사 The man을 꾸며 주면서 who가 관계대명사절의 주어 역할을 해요. who 뒤에는 went라는 동사가 바로 오므로 관계대명사절 안에는 주어가 따로 없습니다. 주격 관계대명사 who는 사람 선행사를 받을 때 쓴다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공격을 받았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">attacked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 동물들에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 거의 죽을 뻔했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">died \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">굶주림으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">hunger\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 야생 동물들의 공격을 받았고 거의 굶어 죽을 뻔했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 야생 동물에게 공격을 당하고 굶주림으로 거의 죽을 뻔한 시련을 겪었음을 보여 줍니다. 왼쪽 길의 험난함을 구체적으로 드러내며, 그가 이후 생존 기술을 배우는 성장의 계기가 되는 문장입니다. was attacked by wild animals는 행위자보다 피해를 입은 주어를 앞세운 \u003cb class=\"key\">수동태\u003c/b> 표현이고, almost died of hunger는 \u003cb class=\"key\">거의 \u003c/b>\u003cb class=\"key\">굶어 \u003c/b>\u003cb class=\"key\">죽을 \u003c/b>\u003cb class=\"key\">뻔했다\u003c/b>는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사 + by 행위자)\u003c/span> : be attacked by [행위자] : \"야생 동물들의 공격을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">die of + 원인\u003c/span> : die of [원인] : \"거의 굶어 죽을 뻔했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He, 그는. was attacked, 공격을 받았다. by wild animals, 야생 동물들에 의해. and almost died, 그리고 거의 죽을 뻔했다. of hunger, 굶주림으로. 이 문장 전체를 해석하면, 그는 야생 동물들의 공격을 받았고 거의 굶어 죽을 뻔했다.","hl":"m"},{"n":25,"text":"이 문장은 그가 야생 동물들의 공격을 받고 거의 굶어 죽을 뻔한 시련을 겪었음을 보여 줍니다. 왼쪽 길에서 만난 위험을 구체적으로 드러내며, 이 경험이 이후 생존 기술을 배우는 계기가 된다는 점에서 중요한 문장입니다. was attacked by wild animals는 공격을 받은 입장을 나타내는 수동태 표현이고, almost died of hunger는 거의 굶어 죽을 뻔했다는 뜻이에요.","hl":"mn"},{"n":26,"text":"어법 포인트는 두 가지입니다. 첫 번째는 수동태 was attacked by wild animals입니다. 주어 He가 공격을 받는 입장이므로 be attacked를 썼고, by 뒤에 wild animals라는 행위자가 나옵니다. 능동태로 바꾸면 Wild animals attacked him이 됩니다. 두 번째는 die of hunger라는 표현인데요, die of는 굶주림처럼 원인으로 죽을 때 쓰는 관용 표현이에요. of는 원인을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 그는 터득했다\u003c/span>\u003cspan class=\"en\">Soon he learned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신을 지키는 방법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003cspan class=\"tgt\">himself \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 먹을 것을 찾는 방법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧 그는 자신을 지키고 먹을 것을 찾는 방법을 터득했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 시련을 겪은 뒤 곧 자신을 지키고 먹을 것을 찾는 방법을 터득하게 되었음을 보여 줍니다. 앞 문장의 위기를 극복하고 생존 능력을 갖추는 전환점 역할을 하며, 그가 지혜로운 사람으로 성장해 가는 과정을 나타냅니다. how to protect himself and find food는 \u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">지키고 \u003c/b>\u003cb class=\"key\">먹을 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">찾는 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 의미하고, learned는 단순한 암기가 아니라 \u003cb class=\"key\">터득했다\u003c/b>는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (how to v)\u003c/span> : learned [how + to protect + (to) find ~] : \"자신을 지키고 먹을 것을 찾는 방법\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Soon he learned, 곧 그는 터득했다. how to protect himself, 자신을 지키는 방법을. and find food, 그리고 먹을 것을 찾는 방법을. 이 문장 전체를 해석하면, 곧 그는 자신을 지키고 먹을 것을 찾는 방법을 터득했다.","hl":"m"},{"n":28,"text":"이 문장은 그가 시련을 겪은 뒤 곧 자신을 지키고 먹을 것을 찾는 방법을 터득하게 되었음을 보여 줍니다. 앞 문장의 위기를 극복하고 생존 능력을 갖추는 전환점 역할을 하며, 그가 지혜로운 사람으로 성장해 가는 과정을 나타냅니다. how to protect himself and find food는 자신을 지키고 먹을 것을 찾는 방법이라는 뜻이고, learned는 경험을 통해 터득했다는 의미입니다.","hl":"mn"},{"n":29,"text":"어법 포인트는 how to부정사입니다. how to protect himself and find food가 learned의 목적어로 쓰여서 방법을 나타내는 명사구 역할을 합니다. to protect와 find는 and로 병렬 연결되었고, 두 번째 to는 생략된 형태예요. himself는 주어 he와 같은 대상을 가리키는 재귀대명사이므로 protect himself는 자신을 지키다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국\u003c/span>\u003cspan class=\"en\">In the end,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 나아갔다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲 밖으로\u003c/span>\u003cspan class=\"en\">out of the forest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 사람들을 가르쳤다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">taught \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생존 기술을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">survival \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국 그는 숲을 빠져나왔고 다른 사람들에게 생존 기술을 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왼쪽으로 갔던 남자가 숲 속에서 온갖 고난을 겪은 뒤 그 경험을 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>로 승화시켜 다른 사람을 가르치는 현자로 성장했음을 보여줍니다. 여기서 \u003cb class=\"key\">made \u003c/b>\u003cb class=\"key\">his \u003c/b>\u003cb class=\"key\">way\u003c/b>는 단순한 이동이 아니라 고생 끝에 길을 찾아 나아갔다는 뉘앙스를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">make one's way (관용 표현)\u003c/span> : make + one's way : \"나아가다, 길을 가다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">teach + 간접목적어 + 직접목적어 (4형식)\u003c/span> : taught [간접목적어] + [직접목적어] : \"다른 사람들에게 생존 기술을 가르쳤다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In the end, 결국. he made his way, 그는 나아갔다. out of the forest, 숲 밖으로. and taught others, 그리고 다른 사람들을 가르쳤다. survival skills, 생존 기술을. 이 문장 전체를 해석하면, 결국 그는 숲을 빠져나왔고 다른 사람들에게 생존 기술을 가르쳤다.","hl":"m"},{"n":31,"text":"이 문장은 왼쪽으로 갔던 남자가 숲속에서 온갖 고난을 겪은 뒤 결국 자신의 길을 찾아 밖으로 나왔고, 그 경험을 살려 다른 사람들에게 생존 기술을 가르치는 사람으로 성장했음을 보여줍니다. made his way는 단순히 길을 만든 게 아니라 힘들게 나아가서 빠져나왔다는 뜻이고, taught others survival skills는 다른 사람들에게 생존 기술을 가르쳤다는 4형식 구문이에요.","hl":"mn"},{"n":32,"text":"첫 번째, made his way는 make one's way라는 관용 표현이에요. make가 만들다가 아니라 길을 가다 또는 나아가다는 뜻이 되어서 out of the forest와 함께 숲을 빠져나오다로 해석합니다. 두 번째, taught others survival skills에서 taught는 teach의 과거형이고, others라는 간접목적어와 survival skills라는 직접목적어를 연달아 쓰는 4형식 문장이에요. 다음 사람에게 무엇을 가르치다라고 할 때 teach somebody something처럼 목적어 두 개를 줄 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오른쪽으로 간 남자는\u003c/span>\u003cspan class=\"en\">The man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만났다\u003c/span>\u003cspan class=\"en\">met\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑 무리를\u003c/span>\u003cspan class=\"en\">a group of thieves.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오른쪽으로 간 남자는 도둑 무리를 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오른쪽으로 간 남자는 \u003cb class=\"key\">도둑 \u003c/b>\u003cb class=\"key\">무리\u003c/b>를 만나는 또 다른 시험을 겪습니다. 여기서 \u003cb class=\"key\">who\u003c/b>는 앞의 The man을 받는 주격 관계대명사로, 이 남자의 선택이 곧 이 만남으로 이어짐을 보여줍니다. 이 만남은 이후 도둑들이 지혜로운 사람으로 바뀌는 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사 + who + 동사 : \"오른쪽으로 간\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The man who went to the right, 오른쪽으로 간 남자는. met, 만났다. a group of thieves, 도둑 무리를. 이 문장 전체를 해석하면, 오른쪽으로 간 남자는 도둑 무리를 만났다.","hl":"m"},{"n":34,"text":"이 문장은 오른쪽으로 간 남자가 도둑 무리를 만나는 또 다른 시험을 겪는다는 내용이에요. who went to the right에서 who가 앞의 The man을 받는 주격 관계대명사라서 뒤에서 꾸며 주고 있어요. 이 만남이 이후 도둑들을 지혜로운 사람으로 바꾸는 계기가 되죠.","hl":"mn"},{"n":35,"text":"who went to the right에서 who는 사람 선행사 The man을 받는 주격 관계대명사입니다. 관계대명사 who 뒤에는 주어 없이 동사 went가 바로 오는 것이 포인트예요. 앞에 나온 The man을 뒤에서 꾸며 주는 절이므로 전체적으로 오른쪽으로 간 남자라고 해석하면 자연스럽죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그에게서 모든 것을 빼앗았다\u003c/span>\u003cspan class=\"en\">They took everything from him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그가 그들과 합류하게 했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">join \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그에게서 모든 것을 빼앗고 그를 그들과 합류하게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑들이 그 남자에게서 모든 것을 \u003cb class=\"key\">약탈\u003c/b>하고도 그냥 두지 않고 \u003cb class=\"key\">자기들과 \u003c/b>\u003cb class=\"key\">합류\u003c/b>하게 만듭니다. 여기서 made him join them은 강제성이 담긴 \u003cb class=\"key\">사역\u003c/b>의 의미라서, 그가 원해서가 아니라 어쩔 수 없이 도둑 무리에 들어갔음을 분명히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + 목적어 + 목적격 보어(동사원형) : \"그가 그들과 합류하게 했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They took everything from him, 그들은 그에게서 모든 것을 빼앗았다. and made him join them, 그리고 그가 그들과 합류하게 했다. 이 문장 전체를 해석하면, 그들은 그에게서 모든 것을 빼앗고 그를 그들과 합류하게 했다.","hl":"m"},{"n":37,"text":"이 문장은 도둑들이 그 남자에게서 모든 것을 빼앗고, 그를 자기 무리에 강제로 합류하게 만들었음을 보여줍니다. made him join them에서 made는 그냥 만들었다가 아니라 강제성이 있는 사역동사로, 그가 원해서가 아니라 어쩔 수 없이 합류하게 되었음을 분명히 해 줘요.","hl":"mn"},{"n":38,"text":"여기서 made him join them이 가장 중요한 어법 포인트입니다. make는 사역동사로 쓸 때 목적어 him 다음에 to부정사가 아니라 동사원형 join이 온다는 점을 꼭 기억하세요. 목적어가 목적격 보어의 행동을 하는 능동 관계이기 때문에 make는 동사원형을 목적격 보어로 취합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 그들과 함께 있는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그들에게 큰 친절을 베풀었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">showed \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">kindness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그들과 함께 있는 동안 그들에게 큰 친절을 베풀었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 도둑들과 함께 지내는 동안에도 그가 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">친절\u003c/b>을 베풀었음을 보여 줍니다. while he was with them은 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">부사절\u003c/b>로, 주절과 동시에 일어난 상황을 알려 줍니다. show someone great kindness는 '~에게 큰 친절을 베풀다'라는 뜻으로, 그의 태도가 도둑들을 변화시키는 시작점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while이 이끄는 부사절\u003c/span> : While + 주어 + 동사, 주절 : \"그가 그들과 함께 있는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 문장 (수여동사 show)\u003c/span> : show + 간접목적어(them) + 직접목적어(great kindness) : \"그들에게 큰 친절을 베풀었다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"While he was with them, 그가 그들과 함께 있는 동안. he showed them great kindness, 그는 그들에게 큰 친절을 베풀었다. 이 문장 전체를 해석하면, 그는 그들과 함께 있는 동안 그들에게 큰 친절을 베풀었다.","hl":"m"},{"n":40,"text":"이 문장은 그가 도둑들과 함께 있는 동안에도 큰 친절을 베풀었다는 사실을 전해 줘요. while은 시간의 부사절을 이끌어서 주절과 동시에 일어난 상황을 나타내고, show someone something은 누구에게 무엇을 베풀다는 뜻이에요. 이 친절이 바로 도둑들을 변화시키는 시작점이 되죠.","hl":"mn"},{"n":41,"text":"첫 번째 어법은 while이 이끄는 부사절이에요. while은 하는 동안이라는 뜻의 부사절 접속사로, 주절과 동시에 일어나는 시간적 배경을 나타냅니다. 두 번째 어법은 showed them great kindness인데요, show는 수여동사로 목적어를 두 개 취해서 누구에게 무엇을 베풀다는 뜻이 됩니다. 여기서는 물건이 아니라 친절을 직접 목적어로 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑들은 그의 친절에 감동을 받았다\u003c/span>\u003cspan class=\"en\">The thieves \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">moved \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">kindness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그의 지혜에서 교훈을 얻었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">learned \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">wisdom\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도둑들은 그의 친절에 감동을 받았고 그의 지혜에서 교훈을 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑들은 그의 친절에 \u003cb class=\"key\">감동\u003c/b>을 받았고, 그의 지혜를 통해 배웠다는 내용입니다. were moved by는 \u003cb class=\"key\">수동태\u003c/b>로, 도둑들이 스스로 감동한 것이 아니라 그의 친절에 의해 마음이 움직였음을 나타냅니다. learned from his wisdom은 단순한 지식이 아니라 삶의 지혜를 교훈으로 받아들였다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be p.p. + by 행위자)\u003c/span> : be moved + by + 행위자(his kindness) : \"그의 친절에 감동을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 연결된 병렬 구조\u003c/span> : were moved ~ and learned ~ : \"그리고 그의 지혜에서 교훈을 얻었다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The thieves were moved by his kindness, 도둑들은 그의 친절에 감동을 받았다. and learned from his wisdom, 그리고 그의 지혜에서 교훈을 얻었다. 이 문장 전체를 해석하면, 도둑들은 그의 친절에 감동을 받았고 그의 지혜에서 교훈을 얻었다.","hl":"m"},{"n":43,"text":"도둑들은 그의 친절에 감동을 받았고, 그의 지혜를 통해 배웠다는 내용이에요. were moved by는 수동태로, 도둑들이 스스로 감동한 게 아니라 그의 친절에 의해 마음이 움직인 거예요. learned from his wisdom은 단순한 지식이 아니라 삶의 지혜를 교훈으로 받아들였다는 뜻이죠.","hl":"mn"},{"n":44,"text":"첫 번째 어법은 were moved by his kindness인데요, 수동태예요. 도둑들이 감동을 받은 대상으로 주어가 되었고, by 뒤의 his kindness가 감동의 원인을 나타내요. 두 번째 어법은 and learned from his wisdom이에요. 주어 The thieves에 대해 감동을 받은 것과 배운 것이 and로 병렬 연결되어 있어요. 앞의 수동태와 뒤의 능동태가 and로 이어져서 감동과 배움이 순서대로 일어났음을 보여 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">후에\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 또한 지혜로운 사람들이 되었다\u003c/span>\u003cspan class=\"en\">they also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">wise \u003c/span>\u003cspan class=\"tgt\">men\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">후에 그들 또한 지혜로운 사람들이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 결국 도둑들도 나중에 \u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 되었다는 결론입니다. also는 앞서 왼쪽으로 간 남자나 다른 사람들처럼 그들도 \u003cb class=\"key\">지혜롭게\u003c/b> 변했음을 강조합니다. became wise men은 신분이나 상태의 변화를 나타내는 표현으로, 도둑이라는 과거와 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격 보어\u003c/span> : become + 주격 보어(명사 wise men) : \"지혜로운 사람들이 되었다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Later, 후에. they also became wise men, 그들 또한 지혜로운 사람들이 되었다. 이 문장 전체를 해석하면, 후에 그들 또한 지혜로운 사람들이 되었다.","hl":"m"},{"n":46,"text":"결국 도둑들도 나중에 지혜로운 사람들이 되었다는 결론이에요. also는 앞의 사람들과 마찬가지로 그들도 지혜롭게 변했음을 강조하고, became wise men은 상태의 변화를 나타내요. 도둑이었다가 지혜로운 사람이 된 대비가 느껴지죠.","hl":"mn"},{"n":47,"text":"이 문장의 핵심 어법은 became wise men이에요. become은 '~이 되다'라는 뜻의 상태 변화 동사로, 주어의 상태나 신분이 변하는 것을 나타냅니다. 여기서 wise men은 주어 they를 설명하는 주격 보어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒤돌아 간 남자는\u003c/span>\u003cspan class=\"en\">The man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">walked \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들었다\u003c/span>\u003cspan class=\"en\">created\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안전한 길을\u003c/span>\u003cspan class=\"en\">a safe path\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲 주변에\u003c/span>\u003cspan class=\"en\">around the forest.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">뒤돌아 간 남자는 숲 주변에 안전한 길을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뒤돌아 간 남자는 숲으로 들어가지 않고 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 \u003cb class=\"key\">숲 \u003c/b>\u003cb class=\"key\">주변\u003c/b>에 만들었어요. 이는 위험을 피하면서도 모두에게 도움이 되는 대안을 만든 지혜로운 선택을 보여 줘요. 글 흐름에서 세 번째 인물의 결과를 제시하며, 길을 만든 행동이 뒤에 이어지는 문장의 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(The man) + [주격 관계대명사 who + 동사(walked back)] : \"뒤돌아 간 남자는\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The man who walked back, 뒤돌아 간 남자는. created, 만들었다. a safe path, 안전한 길을. around the forest, 숲 주변에. 이 문장 전체를 해석하면, 뒤돌아 간 남자는 숲 주변에 안전한 길을 만들었다.","hl":"m"},{"n":49,"text":"이 문장은 뒤돌아 간 남자가 숲으로 들어가지 않고 숲 주변에 안전한 길을 만든 행동을 설명해요. 어려운 길을 억지로 가지 않아도 모두에게 도움이 되는 안전한 길을 만들 수 있다는 뜻으로, 앞선 두 사람과 다른 지혜를 보여 줘요.","hl":"mn"},{"n":50,"text":"첫 번째 문장에서는 who walked back이 주격 관계대명사 who가 이끄는 절로, 앞에 있는 The man을 수식해요. who는 사람 선행사 The man을 받으며 뒤에 동사 walked가 왔고, 해석은 뒤돌아 간 남자라고 해요. 주격 관계대명사 who는 주어 역할을 하기 때문에 뒤에 동사가 바로 이어지는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 길을 이용할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Using \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">path\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 다다를 수 있었다\u003c/span>\u003cspan class=\"en\">people could get\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 가고자 하는 곳에\u003c/span>\u003cspan class=\"en\">where they were going\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을 잃지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 이동 시간이 조금 더 오래 걸렸지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">though \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trip \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">longer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 이 길을 이용할 때 길을 잃지 않고 그들이 가고자 하는 곳에 다다를 수 있었다. 비록 이동 시간이 조금 더 오래 걸렸지만 말이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>의 효용을 설명해요. 사람들이 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 목적지에 갈 수 있지만, \u003cb class=\"key\">조금 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">걸렸지만\u003c/b>이라는 단점도 함께 말해요. 그래서 안전한 길이 느리지만 더 나은 선택일 수 있다는 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사구문)\u003c/span> : Using this path (분사구문) + 주절(people could get where they were going) : \"이 길을 이용할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : without [전치사] + getting lost [동명사구] : \"길을 잃지 않고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">양보 부사절 (even though)\u003c/span> : even though [양보 접속사] + 주어(the trip) + 동사(took) + a little longer : \"비록 이동 시간이 조금 더 오래 걸렸지만\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Using this path, 이 길을 이용할 때. people could get, 사람들은 다다를 수 있었다. where they were going, 그들이 가고자 하는 곳에. without getting lost, 길을 잃지 않고. even though the trip took a little longer, 비록 이동 시간이 조금 더 오래 걸렸지만. 이 문장 전체를 해석하면, 사람들은 이 길을 이용할 때 길을 잃지 않고 그들이 가고자 하는 곳에 다다를 수 있었다. 비록 이동 시간이 조금 더 오래 걸렸지만 말이다.","hl":"m"},{"n":52,"text":"이 문장은 그 안전한 길을 이용하면 사람들이 길을 잃지 않고 목적지에 갈 수 있다는 걸 설명해요. 다만 그 길은 이동 시간이 조금 더 오래 걸린다는 단점도 함께 말해 줘요. 그래서 안전한 길이 조금 느리지만 더 나은 선택일 수 있다는 의미를 담고 있어요.","hl":"mn"},{"n":53,"text":"두 번째 문장에서는 주요 포인트를 몇 가지 볼 수 있어요. 먼저 Using this path는 현재분사구문으로, 문장 앞에서 부대 상황이나 조건을 나타내며 이 길을 이용할 때라고 해석해요. 다음으로 without getting lost에서 without은 전치사이고 뒤에 동명사 getting이 왔어요. get lost는 길을 잃다라는 뜻의 숙어인데, 전치사 뒤에는 동사 원형이 아니라 동명사가 와야 하므로 getting lost가 된 거예요. 마지막으로 even though는 비록 무엇일지라도라는 뜻의 양보 접속사로, 뒤에 주어와 동사를 갖춘 절이 와서 조금 더 오래 걸렸지만이라는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이야기는 앞선 판단이 \u003cb class=\"key\">틀렸다\u003c/b>고 반전시키며 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">지혜로웠다\u003c/b>는 주장을 제시한다.\u003c/li>\u003cli>왼쪽으로 간 남자는 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">동물\u003c/b>과 \u003cb class=\"key\">굶주림\u003c/b>을 겪었지만 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 익혀 다른 사람들을 가르쳤다.\u003c/li>\u003cli>오른쪽으로 간 남자는 \u003cb class=\"key\">도둑\u003c/b>들에게 모든 것을 빼앗겼지만 \u003cb class=\"key\">친절\u003c/b>로 그들을 \u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>로 바꾸었다.\u003c/li>\u003cli>뒤돌아 간 남자는 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들어 시간이 조금 더 걸려도 사람들이 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 목적지에 가게 했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Everyone was wise because each man chose his own path and created his future through survival, kindness, or building a safe path.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">세 남자가 각자 다른 길을 선택했지만 모두 \u003cb class=\"key\">지혜로웠다\u003c/b>. 왼쪽 남자는 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 익혔고, 오른쪽 남자는 \u003cb class=\"key\">친절\u003c/b>로 도둑들을 변화시켰으며, 뒤돌아 간 남자는 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 만들었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 지문은 길을 선택하는 방식이 달라도 결국 각자가 지혜로웠다는 이야기였어요. 왼쪽은 생존 기술, 오른쪽은 친절과 감화, 뒤로 간 길은 안전한 길이라는 결과를 만들었죠. 중요한 건 어떤 길이 더 낫다가 아니라 자기 선택 속에서 배우고 나누는 태도예요. 여러분도 각자의 길에서 오늘 배운 내용을 정리해 보시고, 오늘 강의는 여기서 마치겠습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
