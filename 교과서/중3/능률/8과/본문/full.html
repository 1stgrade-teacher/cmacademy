ferent Paths, Different Wisdom: The Value of Individual Choices<small>서로 다른 길, 서로 다른 지혜: 개인적 선택의 가치</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 여러 사람이 각자의 방식대로 문제를 해결하는 과정을 다루고 있는데, 여기서 가장 중요한 개념은 관점의 전환(Perspective Taking)이에요. 숲에 갇혔을 때 단순히 길을 찾는 것만 생각하는 것이 아니라, 더 높은 곳에서 전체를 내려다보는 조감도(Bird&#39;s-eye view)를 통해 상황을 객관적으로 분석하는 능력이 필요하죠. 하지만 이 이야기는 다원주의(Pluralism)라는 철학적 관점도 강조하는데, 이는 하나의 절대적인 정답만이 옳다는 생각에서 벗어나, 서로 다른 선택과 경험이 모여 각자의 독자적인 가치(Unique value)를 만들어낼 수 있다는 점을 시사합니다. 마치 우리가 겪는 실패나 고난이 단순히 잘못된 길이 아니라, 그 과정 자체가 성장(Growth)을 위한 필수적인 경험이 되는 것과 같은 맥락이에요. 즉, 이 지문은 정해진 답을 찾으려는 노력만큼이나, 저마다의 선택이 가진 개별적인 의미(Individual significance)를 존중하는 태도가 중요함을 잘 보여줍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생 및 의견 대립</div><ul><li>다섯 명의 현자가 숲에서 길을 잃고 각자 다른 탈출 방법을 제시합니다.</li><li>숲(forest)에서 길을 잃은 다섯 명의 현자</li><li>각자 왼쪽, 오른쪽, 왔던 길, 직진 등의 다른 의견 제시</li><li>다섯 번째 현자만이 나무에 올라가 전체 상황을 보려 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02선택과 갈라짐</div><ul><li>나무에 오른 현자가 길을 찾는 동안 나머지 사람들은 각자의 신념대로 길을 떠납니다.</li><li>가장 높은 나무(tallest tree)에 올라 길을 찾으려는 다섯 번째 현자</li><li>상황을 기다리지 못하고 각자의 길(separate ways)을 택한 사람들</li><li>다섯 번째 현자는 혼자 남겨진 것에 대해 당혹감을 느낌</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03각자의 여정과 성취</div><ul><li>서로 다른 길을 선택한 현자들은 그 과정에서 고난을 겪으며 각자의 가치를 증명합니다.</li><li>왼쪽으로 간 사람: 생존 기술(survival skills)을 배우고 타인을 도움</li><li>오른쪽으로 간 사람: 도둑들에게 친절을 베풀어 그들을 변화시킴</li><li>뒤로 돌아간 사람: 숲을 우회하는 안전한 길(safe path)을 만듦</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 교훈</div><ul><li>누구의 방법이 옳고 그른 것이 아니라, 모든 선택은 자신만의 미래를 만드는 과정입니다.</li><li>자신의 선택이 곧 자신의 미래(future)를 창조함</li><li>단순히 한 가지 길만이 정답은 아님</li><li>결과적으로 모두가 각자의 방식으로 현명한 선택을 함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr><tr><td class=\"w\">agree</td><td class=\"m\">동의하다, 합의하다</td></tr><tr><td class=\"w\">travel</td><td class=\"m\">여행하다, 이동하다</td></tr><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr><tr><td class=\"w\">thick</td><td class=\"m\">빽빽한, 두꺼운</td></tr><tr><td class=\"w\">forest</td><td class=\"m\">숲</td></tr><tr><td class=\"w\">further</td><td class=\"m\">더 먼, 추가의</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다</td></tr><tr><td class=\"w\">strongly</td><td class=\"m\">강력하게, 굳게</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">correct</td><td class=\"m\">옳은, 정확한</td></tr><tr><td class=\"w\">disagree</td><td class=\"m\">의견이 다르다, 동의하지 않다</td></tr><tr><td class=\"w\">straight</td><td class=\"m\">똑바로</td></tr><tr><td class=\"w\">forever</td><td class=\"m\">영원히</td></tr><tr><td class=\"w\">path</td><td class=\"m\">길, 통로</td></tr><tr><td class=\"w\">solve</td><td class=\"m\">해결하다</td></tr><tr><td class=\"w\">climb</td><td class=\"m\">오르다, 등반하다</td></tr><tr><td class=\"w\">separate</td><td class=\"m\">각자의, 별개의</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">도달하다, 도착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다섯 명의 현자</span><span class=\"en\"><b><span class=\"grammar-hl\">The Five Wise Men</span></b></span></div></div><div class=\"lec-sent-ko\">(다섯 명의 현자)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다섯 명의 현자가 우연히 만나 함께 길을 떠나기로 약속하는 이야기의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Five Wise Men (고유명사구): 인물들을 지칭하는 명사구로, &#39;Wise&#39;는 형용사로서 &#39;Men&#39;을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다섯 명의 현자가</span><span class=\"en\"><b><span class=\"grammar-hl\">five wise men</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만났는데</span><span class=\"en\"><b>met</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길 위에서.</span><span class=\"en\"><b>on the road.</b></span></div></div><div class=\"lec-sent-ko\">어느 날 지혜로운 다섯 남자가 길에서 만났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다섯 명의 현자가 우연히 만나 함께 길을 떠나기로 약속하는 이야기의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">five wise men (명사구): &#39;wise&#39;가 &#39;men&#39;의 상태를 나타내는 형용사로 명사를 직접 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 동의했다</span><span class=\"en\"><b>They agreed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 여행하기로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to travel</span> together.</b></span></div></div><div class=\"lec-sent-ko\">그들은 여행을 함께 하기로 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 만남을 계기로, 공동의 목적을 가지고 동행하게 된 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to travel (to부정사): 동사 &#39;agreed&#39;의 목적어 역할을 하는 명사적 용법임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agree</td><td class=\"m\">동의하다, 합의하다</td></tr><tr><td class=\"w\">travel</td><td class=\"m\">여행하다, 이동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가는 도중에,</span><span class=\"en\"><b>On the way,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 길을 잃었는데</span><span class=\"en\"><b>they <span class=\"grammar-hl\">became lost</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">울창한 숲에서.</span><span class=\"en\"><b>in a thick forest.</b></span></div></div><div class=\"lec-sent-ko\">그러나 도중에 그들은 울창한 숲속에서 길을 잃게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;thick&#39;은 사전적으로 &#39;두꺼운&#39;이지만, 여기서는 숲이 아주 빽빽하고 앞이 보이지 않을 만큼 울창하다는 의미입니다. 상황의 심각성을 강조하여 뒤에 나올 갈등의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became lost (과거분사): 주어 &#39;they&#39;의 상태를 설명하는 보어 역할을 하며, &#39;lost&#39;는 수동적 의미의 과거분사임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr><tr><td class=\"w\">thick</td><td class=\"m\">빽빽한, 두꺼운</td></tr><tr><td class=\"w\">forest</td><td class=\"m\">숲</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 멀리 걷기 전에,</span><span class=\"en\"><b>Before walking any further,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 결정했다</span><span class=\"en\"><b>they decided</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추고</span><span class=\"en\"><b><span class=\"grammar-hl\">to stop</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾기로</span><span class=\"en\"><b><span class=\"grammar-hl\">and find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 좋은 탈출구를.</span><span class=\"en\"><b>the best way out.</b></span></div></div><div class=\"lec-sent-ko\">더 멀리 가기 전에 그들은 멈추고 빠져나갈 최선의 방법을 찾기로 결정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 길을 잃은 문제 상황을 해결하기 위해 성급하게 움직이지 않고 &#39;잠시 멈춤&#39;을 선택했다는 점에서 그들이 지혜로운 자들임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to stop and find (to부정사): 동사 &#39;decided&#39;의 목적어 역할을 하는 명사적 용법으로 &#39;stop&#39;과 &#39;find&#39;가 병렬로 연결됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">further</td><td class=\"m\">더 먼, 추가의</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잠시 생각한 후,</span><span class=\"en\"><b>After thinking for a while,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫 번째 사람이 말했다,</span><span class=\"en\"><b>the first man said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 강하게 느낍니다</span><span class=\"en\"><b>“I strongly feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 왼쪽으로 가야 한다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that we should go left</span>.</b></span></div></div><div class=\"lec-sent-ko\">잠시 동안 생각한 후, 첫 번째 남자가 말했다. “나는 우리가 왼쪽으로 가야 한다는 생각이 강하게 들어요.&quot;</div></div>\n        <div class=\"lec-grammar l "lec-gr-item\">was gone (수동태(상태)): &#39;was&#39;와 과거분사 &#39;gone&#39;이 결합하여 상태를 나타냄. 단, 여기서 &#39;gone&#39;은 자동사의 과거분사로 형용사처럼 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 22 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 속으로 생각했다,</span><span class=\"en\"><b>He thought to himself,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 어디로 갔을까?</span><span class=\"en\"><b><span class=\"grammar-hl\">Where did they go?</span></b></span></div></div><div class=\"lec-sent-ko\">그는 마음속으로 생각했다. ‘다들 어디 간 거야?’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 방식만이 옳았다고 믿는 독단적인 모습을 드러내기 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where did they go? 간접의문문과 달리 직접의문문 구조로, 의문사 &#39;Where&#39; + 조동사 &#39;did&#39; + 주어 + 동사원형으로 구성됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 찾았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 좋은 탈출구를.</span><span class=\"en\"><b>the best way out.</b></span></div></div><div class=\"lec-sent-ko\">‘내가 빠져나갈 최선의 길을 찾았는데.’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시련이 그를 성장시켜 생존 능력을 갖춘 사람으로 변화시켰습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">found 단순 과거동사로 주어의 행위를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 생각했는데</span><span class=\"en\"><b>He <span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 모두가 틀렸고</span><span class=\"en\"><b><span class=\"grammar-hl\">they were all wrong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신만이 현명한 사람이라고.</span><span class=\"en\"><b>and he was the only wise man.</b></span></div></div><div class=\"lec-sent-ko\">그는 그들이 모두 틀렸고 자신이 유일하게 지혜로운 사람이라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대적인 가치를 인정하지 않는 그의 오만을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought they were all wrong (명사절): 접속사 &#39;that&#39;이 생략된 문장 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 25 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 틀렸다.</span><span class=\"en\"><b>he <span class=\"grammar-hl\">was wrong</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그가 틀렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 생각을 정면으로 반박하며, 이 글의 주제가 드러나는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was wrong be동사 + 보어 형태의 서술 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 26 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가</span><span class=\"en\"><b>Everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was wise</span>.</b></span></div></div><div class=\"lec-sent-ko\">모두가 지혜로웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현명함이란 하나의 정답이 아니라, 각자의 삶에서 결과를 만들어내는 과정임을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was wise be동사 + 보어 형태의 서술 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 27 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 사람은</span><span class=\"en\"><b>Each man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 길을 선택했고</span><span class=\"en\"><b><span class=\"grammar-hl\">had chosen</span> his path</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 미래를 만들었다.</span><span class=\"en\"><b>and created his future.</b></span></div></div><div class=\"lec-sent-ko\">각자 자신의 길을 선택했고 자신의 미래를 만들어 냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 각자의 선택이 존중받아야 할 삶의 방식임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had chosen (과거완료): 기준 시점 이전의 완료된 동작을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">path</td><td class=\"m\">길, 통로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">The man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왼쪽으로 간</span><span class=\"en\"><b><span class=\"grammar-hl\">who went to the left</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 깊이 걸어갔는데</span><span class=\"en\"><b>walked deeper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숲 안으로.</span><span class=\"en\"><b>into the forest.</b></span></div></div><div class=\"lec-sent-ko\">왼쪽으로 간 남자는 숲속으로 더 깊이 걸어 들어갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 초기에는 위기를 겪지만, 그것이 성장의 발판이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The man who went to the left (관계대명사): &#39;who&#39;가 주격 관계대명사로서 &#39;The man&#39;을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forest</td><td class=\"m\">숲</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 29 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생 동물에게 공격당했고</span><span class=\"en\"><b><span class=\"grammar-hl\">was attacked</span> by wild animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">굶주림으로 거의 죽을 뻔했다.</span><span class=\"en\"><b>and almost died of hunger.</b></span></div></div><div class=\"lec-sent-ko\">그는 야생 동물들의 공격을 받았고 거의 굶어 죽을 뻔했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고난을 통해 현실적인 생존의 필요성을 깨닫게 되는 과정입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was attacked (수동태): be동사(was) + p.p.(attacked) 형태. 기본구조: attack + O(목적어). 타동사 attack의 목적어가 주어로 올라간 수동 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b>Soon</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 배웠는데</span><span class=\"en\"><b>he <span class=\"grammar-hl\">learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 보호하는 방법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to protect</span> himself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 음식을 찾는 방법을.</span><span class=\"en\"><b>and find food.</b></span></div></div><div class=\"lec-sent-ko\">곧 그는 자신을 지키고 먹을 것을 찾는 방법을 터득했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시련이 그를 성장시켜 생존 능력을 갖춘 사람으로 변화시켰습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learned how to protect (간접의문문): 의문사 &#39;how&#39; + to부정사 구조가 &#39;learned&#39;의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결국,</span><span class=\"en\"><b>In the end,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 숲에서 빠져나오는 길을 만들었고</span><span class=\"en\"><b>he <span class=\"grammar-hl\">made his way out</span> of the forest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에게 가르쳤는데</span><span class=\"en\"><b>and taught others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생존 기술을.</span><span class=\"en\"><b>survival skills.</b></span></div></div><div class=\"lec-sent-ko\">결국 그는 숲을 빠져나왔고 다른 사람들에게 생존 기술을 가르쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인의 시련이 타인에게 도움을 주는 결과로 이어지는 지혜의 전파를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made his way out (관용표현): &#39;make one&#39;s way&#39;는 &#39;나아가다/빠져나오다&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forest</td><td class=\"m\">숲</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 32 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">The man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오른쪽으로 간</span><span class=\"en\"><b><span class=\"grammar-hl\">who went to the right</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도둑 무리를 만났다.</span><span class=\"en\"><b>met a group of thieves.</b></span></div></div><div class=\"lec-sent-ko\">오른쪽으로 간 남자는 도둑 무리를 만났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예상치 못한 위험한 상황에 직면하게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The man who went to the right (관계대명사): &#39;who&#39;가 주격 관계대명사로서 &#39;The man&#39;을 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게서 모든 것을 빼앗았고</span><span class=\"en\"><b>took everything from him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 자신들과 합류하게 만들었다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">made him join</span> them.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그에게서 모든 것을 빼앗고 그를 그들과 합류하게 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완전한 상실과 타의에 의한 삶의 변화를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made him join 5형식 구조: &#39;make + O + 원형부정사&#39; 형태(사역동사)로, 목적어가 목적보어하도록 시키다라는 의미임</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 그들과 함께 있는 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">While he was with them</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그들에게 보여주었는데</span><span class=\"en\"><b>he showed them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 친절을.</span><span class=\"en\"><b>great kindness.</b></span></div></div><div class=\"lec-sent-ko\">그는 그들과 함께 있는 동안 그들에게 큰 친절을 베풀었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;kindness&#39;는 사전적 의미인 &#39;친절&#39;을 넘어, 도둑들조차 감화시킬 수 있는 그의 인격적 성숙함을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">While he was with them (부사절): 접속사 &#39;While&#39;이 이끄는 시간의 절</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">도둑들은</span><span class=\"en\"><b>The thieves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 친절에 감동했고</span><span class=\"en\"><b><span class=\"grammar-hl\">were moved</span> by his kindness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 지혜로부터 배웠다.</span><span class=\"en\"><b>and learned from his wisdom.</b></span></div></div><div class=\"lec-sent-ko\">도둑들은 그의 친절에 감동을 받았고 그의 지혜에서 교훈을 얻었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한 사람의 태도가 타인의 삶을 변화시킬 수 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were moved (수동태): be동사(were) + p.p.(moved) 형태. 기본구조: move + O(목적어). 감동시키다라는 뜻의 타동사 move가 수동 구조로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 36 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에,</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들도 현명한 사람들이 되었다.</span><span class=\"en\"><b>they also <span class=\"grammar-hl\">became wise men</span>.</b></span></div></div><div class=\"lec-sent-ko\">후에 그들 또한 지혜로운 사람들이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 선한 영향력이 퍼져나가는 결말입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became wise men 2형식 구조: &#39;become&#39; 뒤에 보어인 명사구가 옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 37 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">The man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돌아온</span><span class=\"en\"><b><span class=\"grammar-hl\">who walked back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전한 길을 만들었는데</span><span class=\"en\"><b>created a safe path</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숲 주위에.</span><span class=\"en\"><b>around the forest.</b></span></div></div><div class=\"lec-sent-ko\">뒤돌아 간 남자는 숲 주변에 안전한 길을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 실패를 토대로 타인에게 유용한 가치를 창출해냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The man who walked back (관계대명사): &#39;who&#39;가 주격 관계대명사로서 &#39;The man&#39;을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forest</td><td class=\"m\">숲</td></tr><tr><td class=\"w\">path</td><td class=\"m\">길, 통로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 38 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 경로를 이용하면,</span><span class=\"en\"><b>Using this path,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 갈 수 있었는데</span><span class=\"en\"><b>people could <span class=\"grammar-hl\">get</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목적지까지</span><span class=\"en\"><b><span class=\"grammar-hl\">where they were going</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길을 잃지 않고</span><span class=\"en\"><b>without getting lost,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 이동 시간은 조금 더 걸렸지만 말이다.</span><span class=\"en\"><b>even though the trip took a little longer.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 이 길을 이용할 때 길을 잃지 않고 그들이 가고자 하는 곳에 다다를 수 있었다. 비록 이동 시간이 조금 더 오래 걸렸지만 말이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 속도보다는 안전과 정확성을 중시하는 또 다른 형태의 지혜를 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get where they were going (관계부사): &#39;where&#39;가 &#39;the place&#39;를 대신하여 장소를 나타내는 절을 이끎</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">path</td><td class=\"m\">길, 통로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>다섯 명의 현자가 숲에서 길을 잃자 각자 다른 방식으로 해결책을 선택한다.</li><li>나무에 올라간 현자만이 숲 전체를 보고 길을 찾지만, 다른 이들을 낮게 평가한다.</li><li>하지만 각자 선택한 길에서 그들은 고난을 극복하고, 새로운 능력을 갖추거나 타인을 변화시키며 각자의 방식으로 현명함을 증명한다.</li><li>진정한 지혜는 단 하나의 효율적인 정답이 아니라, 각자의 삶을 개척하고 성장해 나가는 과정에 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The men took different paths to escape the forest, and each person’s unique journey resulted in valuable experiences that contributed to their wisdom.</div>\n              <div class=\"lec-final-sum-ko\">다섯 남자는 숲을 벗어나기 위해 각기 다른 길을 택했으며, 각자의 독특한 여정은 그들의 지혜를 형성하는 소중한 경험이 되었다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"audio":"./full_audio/9.mp3","hl":"main"},{"audio":"./full_audio/10.mp3","hl":"meaning"},{"audio":"./full_audio/11.mp3","hl":"grammar"}],[{"audio":"./full_audio/12.mp3","hl":"main"},{"audio":"./full_audio/13.mp3","hl":"meaning"},{"audio":"./full_audio/14.mp3","hl":"grammar"}],[{"audio":"./full_audio/15.mp3","hl":"main"},{"audio":"./full_audio/16.mp3","hl":"meaning"},{"audio":"./full_audio/17.mp3","hl":"grammar"}],[{"audio":"./full_audio/18.mp3","hl":"main"},{"audio":"./full_audio/19.mp3","hl":"meaning"},{"audio":"./full_audio/20.mp3","hl":"grammar"}],[{"audio":"./full_audio/21.mp3","hl":"main"},{"audio":"./full_audio/22.mp3","hl":"meaning"},{"audio":"./full_audio/23.mp3","hl":"grammar"}],[{"audio":"./full_audio/24.mp3","hl":"main"},{"audio":"./full_audio/25.mp3","hl":"meaning"},{"audio":"./full_audio/26.mp3","hl":"grammar"}],[{"audio":"./full_audio/27.mp3","hl":"main"},{"audio":"./full_audio/28.mp3","hl":"meaning"},{"audio":
