<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 능률 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 8과 본문1","audioDir":"1_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 8과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Five Wise Men in the Forest\u003c/h1>\u003ch2>다섯 지혜로운 남자와 숲\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>어느 날 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">남자\u003c/b>가 울창한 숲에서 길을 잃고, 네 남자가 서로 다른 방향을 주장하지만, 마지막 남자는 \u003cb class=\"key\">잠깐 \u003c/b>\u003cb class=\"key\">기다리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 해결책이라고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When five wise men got lost in a thick forest, they suggested different directions, but the last man told them to just wait.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 다섯 지혜로운 남자와 숲 이야기예요. 이 글은 숲에서 길을 잃은 다섯 명이 서로 다른 방향을 주장하다가, 마지막 남자가 잠깐 기다리라고 말하는 짧은 이야기입니다. 먼저 글 전체의 핵심을 잡고 가면, 길을 잃었다는 문제에 대해 네 명은 각자 길을 택하자고 하지만 다섯 번째 남자는 기다림이 해결책이라고 말해요. 이게 이 글의 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러분은 살면서 \u003cb class=\"key\">갈림길\u003c/b>에 서면 여러 선택지 중에서 혼란스러운 경험을 한 적이 있을 거예요. 이 이야기처럼 숲속에서 길을 잃으면 왼쪽, 오른쪽, 뒤로, 직진 같은 선택지가 생기고, 사람들은 각자 경험이나 감정에 따라 다른 방향을 주장하며 의견이 갈리기 쉽습니다. 지혜로운 판단은 곧바로 행동하기보다 잠시 멈추어 정보를 확인하고 상황을 살피는 \u003cb class=\"key\">인내\u003c/b>에서 나와요. 영어 속담에 Look before you leap라는 말이 있는데, 행동하기 전에 생각하라는 뜻이에요. 일상에서도 길을 잃었을 때 무작정 걷기보다 지도를 확인하거나 잠시 멈추는 것이 실수를 줄여 주죠.\u003c/div>","segs":[{"n":2,"text":"여러분, 살면서 어떤 갈림길에 서면 선택이 어렵죠. 이 이야기처럼 숲속에서 길을 잃으면 왼쪽, 오른쪽, 뒤로, 직진 같은 여러 선택지가 눈앞에 나타나요. 그런데 사람들은 각자 경험이나 감정에 따라 다른 방향을 주장하면서 의견이 갈리기 쉽습니다. 그래서 지혜로운 판단은 곧바로 행동하기보다 잠시 멈추어 정보를 확인하고 상황을 살피는 인내에서 나와요. 영어 속담에 Look before you leap라는 말이 있는데, 행동하기 전에 생각하라는 뜻이에요. 일상에서도 길을 잃었을 때 무작정 걷기보다 지도를 확인하거나 잠시 멈추는 것이 실수를 줄여 주죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 발생: 숲에서 길을 잃다\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">남자\u003c/b>가 길에서 만나 여행을 하기로 하지만, \u003cb class=\"key\">울창한 \u003c/b>\u003cb class=\"key\">숲\u003c/b>에서 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃게\u003c/b> 된다. 더 나아가기 전에 멈추고 최선의 탈출구를 찾기로 결정한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>세 남자의 엇갈린 제안\u003csmall>전개 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>첫째는 \u003cb class=\"key\">왼쪽\u003c/b>으로 가자고 \u003cb class=\"key\">강하게\u003c/b> 주장한다. 둘째는 right가 옳은이라는 뜻도 있다며 \u003cb class=\"key\">오른쪽\u003c/b>을 택한다. 셋째는 왔던 길을 되돌아가 숲을 빙 둘러서 나가자고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>네 번째 남자의 반박\u003csmall>반론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>네 번째 남자는 앞선 제안에 \u003cb class=\"key\">동의하지 \u003c/b>\u003cb class=\"key\">않고\u003c/b>, 계속 \u003cb class=\"key\">똑바로\u003c/b> 걸으면 숲이 끝나고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">길\u003c/b>이 열릴 것이라고 주장한다. 여기서 네 가지 방향 선택이 모두 제시되며 의견 충돌이 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다섯 번째 남자의 해결책\u003csmall>결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>다섯 번째 남자는 그들 모두를 \u003cb class=\"key\">바라보며\u003c/b> \u003cb class=\"key\">고개를 \u003c/b>\u003cb class=\"key\">저으며\u003c/b> 해결 방법을 안다고 말한다. 그의 해결책은 바로 \u003cb class=\"key\">잠깐 \u003c/b>\u003cb class=\"key\">기다리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이다. 서두르지 않고 멈추는 것이 글의 핵심이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 문제가 생기는 부분이에요. 다섯 명의 지혜로운 남자가 길에서 만나 함께 여행을 하기로 했는데, 가는 길에 울창한 숲속에서 길을 잃게 됩니다. 그래서 더 멀리 가기 전에 멈추고 빠져나갈 최선의 방법을 찾기로 결정해요. 여기까지가 문장 첫 번째부터 네 번째까지의 내용이고요, 앞으로 어떤 해결책이 나올지 궁금하게 만드는 도입부예요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 세 남자가 각자 다른 방향을 제안해요. 첫 번째 남자는 왼쪽으로 가야 한다고 강하게 느끼고, 두 번째 남자는 오른쪽이 옳은이라는 뜻도 있다면서 오른쪽을 주장합니다. 이어서 세 번째 남자는 왔던 길을 되돌아가서 숲을 빙 돌아 나가자고 말해요. 이렇게 왼쪽, 오른쪽, 뒤로 가는 세 가지 주장이 엇갈리면서 해결책이 하나로 모이지 않아요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 네 번째 남자가 앞선 의견에 동의하지 않아요. 그는 계속 똑바로 걸어 나가야 한다고 주장하는데, 숲이 영원히 계속될 수는 없고 새로운 길이 열릴 것이라고 말해요. 이 부분에서 네 가지 방향 선택이 모두 나오면서 의견 충돌이 분명하게 드러나요. 문제는 더 커지고, 이제 마지막 인물의 반응이 궁금해집니다.","hl":"f2"},{"n":7,"text":"네 번째이자 마지막 단계에서는 다섯 번째 남자가 그들 모두를 바라보며 고개를 저어요. 그는 해결하는 방법을 안다고 말한 뒤 잠깐 기다려 보라고 합니다. 이 말이 글의 결론이에요. 서두르지 않고 잠시 멈추는 것이 가장 지혜로운 해결책이라는 메시지를 마지막 문장에 담고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃는 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에서 시작해 네 남자의 서로 다른 제안을 거쳐, 마지막 문장에서 \u003cb class=\"key\">기다려야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 핵심 해결책을 제시해요. 앞부분은 문제와 여러 제안을 나열하는 도입과 전개이고, 결론이 마지막에 있으므로 \u003cb class=\"key\">미괄식\u003c/b>입니다. 핵심 신호어 however가 예상치 못한 문제 전환을 보여 주고, Just wait가 글의 요지를 압축해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (3)\u003c/b>\u003cspan>대조적 전환\u003c/span>\u003cb>Before walking any further (4)\u003c/b>\u003cspan>멈춤·신중함\u003c/span>\u003cb>disagreed (9)\u003c/b>\u003cspan>의견 충돌\u003c/span>\u003cb>Just wait (13)\u003c/b>\u003cspan>결론·핵심 해결책\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the best way out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that way\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a new path\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>네 남자의 즉시 이동 제안\u003c/th>\u003cth>다섯 번째 남자의 기다림\u003c/th>\u003c/tr>\u003ctr>\u003ctd>왼쪽, 오른쪽, 뒤, 직진 등 즉시 방향을 선택하려 함\u003c/td>\u003ctd>잠시 멈추고 기다리며 신중함을 강조함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>행동으로 문제를 해결하려는 접근\u003c/td>\u003ctd>시간을 두고 상황을 살피는 접근\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결 구조예요. 처음에 길을 잃는 문제가 제시되고, 중간에 여러 해결책이 나오다가, 마지막에 기다림이라는 핵심 해결책이 제시되거든요. 주제가 마지막 문장에 있기 때문에 짜임은 미괄식으로 볼 수 있어요. 여러분이 이 글을 읽을 때 앞부분의 여러 제안만 보고 핵심을 놓치면 안 되고, 마지막 다섯 번째 남자의 말을 꼭 잡아야 해요.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 세 번째 문장에 나오는 however는 앞 내용과 다른 상황으로 전환되는 신호예요. 함께 여행을 하던 중에 갑자기 길을 잃게 된다는 반전을 보여 주죠. 네 번째 문장의 Before walking any further는 성급하게 행동하지 않고 멈추겠다는 결정을 드러내요. 마지막 문장의 Just wait는 글 전체의 결론을 압축하는 중요한 신호어입니다. 또한 길을 찾는 표현이 the best way out, that way, a new path처럼 조금씩 바뀌어 나오는 것도 지문의 흐름을 보여 주는 장치예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wise\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지혜로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>On the way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>도중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>become lost\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>길을 잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>울창한\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>way out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빠져나갈 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>strongly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>강하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>left\u003c/b>\u003cem>부사\u003c/em>\u003cspan>왼쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오른쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>correct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>옳은\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>되돌아가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빙 둘러서 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disagree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep walking\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 걷다\u003c/span>\u003c/div>\u003cdiv>\u003cb>straight\u003c/b>\u003cem>부사\u003c/em>\u003cspan>똑바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>go on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영원히\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shake\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흔들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이제 핵심 단어를 몇 개 정리해 볼게요. wise는 지혜로운이라는 뜻의 형용사이고, became lost는 길을 잃었다는 의미의 숙어예요. thick은 울창한, forest는 숲이라는 뜻이고, walk around는 빙 둘러서 가다는 뜻이에요. 마지막에 쓰인 solve는 해결하다, wait는 기다리다는 뜻으로 시험에 자주 나오니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wise\u003c/b>\u003cspan class=\"m\">지혜로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smart\u003c/span>\u003cspan class=\"s\">clever\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolish\u003c/span>\u003cspan class=\"a\">stupid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concur\u003c/span>\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">object\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thick\u003c/b>\u003cspan class=\"m\">울창한, 두꺼운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dense\u003c/span>\u003cspan class=\"s\">heavy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thin\u003c/span>\u003cspan class=\"a\">sparse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">straight\u003c/b>\u003cspan class=\"m\">똑바로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">directly\u003c/span>\u003cspan class=\"s\">upright\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">crooked\u003c/span>\u003cspan class=\"a\">bent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solve\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">figure out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complicate\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wait\u003c/b>\u003cspan class=\"m\">기다리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"s\">pause\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">move\u003c/span>\u003cspan class=\"a\">act\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번에는 시험에 자주 나오는 동의어와 반의어를 함께 외워 보세요. wise는 smart, clever, sensible과 비슷하고, foolish, stupid과 반대예요. agree는 concur와 consent가 비슷하고, disagree와 object가 반대입니다. thick은 dense와 heavy가 비슷하고, thin과 sparse가 반대예요. find는 discover, locate와 비슷하고 lose, miss와 반대입니다. straight는 directly, upright과 비슷하고 crooked, bent와 반대예요. solve는 resolve, figure out과 비슷하고, wait는 stay, pause와 비슷한데 move, act와 반대예요. 이렇게 묶어서 기억하면 어휘 문제가 훨씬 쉬워져요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지혜로운 다섯 남자가\u003c/span>\u003cspan class=\"en\">five wise men\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">met\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">road\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 지혜로운 다섯 남자가 길에서 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작으로, 다섯 명의 지혜로운 남자가 우연히 길에서 만났다는 배경을 제시합니다. \u003cb class=\"key\">five \u003c/b>\u003cb class=\"key\">wise \u003c/b>\u003cb class=\"key\">men\u003c/b>은 이후 갈등을 이끌 주인공들이며, \u003cb class=\"key\">one \u003c/b>\u003cb class=\"key\">day\u003c/b>와 \u003cb class=\"key\">on \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">road\u003c/b>가 시간과 장소를 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형 (meet-met-met)\u003c/span> : five wise men [주어] + met [동사] : \"만났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : met [동사] + on the road [전치사구] : \"길에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One day, 어느 날. five wise men, 지혜로운 다섯 남자가. met, 만났다. on the road, 길에서.. 이 문장 전체를 해석하면, 어느 날 지혜로운 다섯 남자가 길에서 만났다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작이에요. 어느 날 지혜로운 다섯 남자가 길에서 만났다는 배경을 제시하고 있어요. five wise men이 앞으로 이야기를 이끌 주인공이고, one day와 on the road가 시간과 장소를 분명히 잡아 주고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 문법은 met입니다. meet의 과거형 met는 불규칙 변화라서 꼭 외워야 하고요, 이야기가 과거 사건이라는 걸 나타내요. 두 번째로 on the road는 전치사구로 만난 장소를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 동의했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agreed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여행하기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">travel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께.\u003c/span>\u003cspan class=\"en\">together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 여행을 함께 하기로 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장에서 만난 다섯 남자가 함께 여행하기로 결정했다는 내용입니다. \u003cb class=\"key\">agree \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">travel\u003c/b>은 여행하기로 동의했다는 뜻으로, 이들의 동행이 시작되었음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (agree의 목적어)\u003c/span> : They [주어] + agreed [동사] + to travel [to부정사구] : \"여행하기로 동의했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They agreed, 그들은 동의했다. to travel, 여행하기로. together, 함께.. 이 문장 전체를 해석하면, 그들은 여행을 함께 하기로 했다.","hl":"m"},{"n":16,"text":"이 문장은 다섯 명이 함께 여행하기로 결정했다는 내용이에요. agree to travel이라는 표현에서 agree가 to부정사를 목적어로 취해 여행하기로 동의했다는 뜻이 되죠.","hl":"mn"},{"n":17,"text":"여기서 핵심 어법은 agreed to travel입니다. agree는 to부정사를 목적어로 취하는 대표 동사라서 agree to 다음에 동사 원형을 씁니다. 그래서 여행하기로 동의했다고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도중에,\u003c/span>\u003cspan class=\"en\">On the way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 길을 잃게 되었다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">울창한 숲속에서.\u003c/span>\u003cspan class=\"en\">in a thick forest.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 도중에 그들은 울창한 숲속에서 길을 잃게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 순조롭던 여행이 숲속에서 길을 잃는 위기로 바뀌는 전환점입니다. \u003cb class=\"key\">became \u003c/b>\u003cb class=\"key\">lost\u003c/b>는 길을 잃게 되었다는 상태 변화를, \u003cb class=\"key\">thick \u003c/b>\u003cb class=\"key\">forest\u003c/b>는 울창해서 빠져나오기 어려운 공간을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 however (역접)\u003c/span> : However, they became lost : \"그러나 그들은 길을 잃게 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">become + 형용사 (상태 변화, 2형식)\u003c/span> : they [주어] + became [2형식 동사] + lost [형용사 보어] : \"길을 잃게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"On the way, 도중에. however, 그러나. they became lost, 그들은 길을 잃게 되었다. in a thick forest, 울창한 숲속에서.. 이 문장 전체를 해석하면, 그러나 도중에 그들은 울창한 숲속에서 길을 잃게 되었다.","hl":"m"},{"n":19,"text":"이 문장은 여행이 숲속에서 길을 잃는 위기로 전환되는 지점이에요. however가 앞의 순조로운 분위기를 뒤집고, became lost는 길을 잃게 되었다는 상태 변화를 나타내요. thick forest라는 표현으로 숲이 울창해서 빠져나오기 어렵다는 느낌을 주고 있죠.","hl":"mn"},{"n":20,"text":"첫 번째로 however는 접속 부사로 앞 문장과 반대 방향으로 전환을 해 주는 표현이에요. 두 번째로 became lost는 become이 형용사 lost를 보어로 취해서 길을 잃게 되었다는 상태 변화를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 멀리 가기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">walking \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">further\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 멈추기로 결심했다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 빠져나갈 최선의 방법을 찾기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 멀리 가기 전에 그들은 멈추고 빠져나갈 최선의 방법을 찾기로 결정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 길을 잃은 지혜로운 다섯 남자가 더 멀리 나아가기 전에 일단 \u003cb class=\"key\">멈추고\u003c/b> 빠져나갈 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 \u003cb class=\"key\">찾기로\u003c/b> 결정하는 도입 부분이에요. Before walking any further는 '더 멀리 걷기 전에'라는 시간 조건을 제시하고, decided to stop and find는 결정의 내용을 to부정사로 묶어 표현해요. 성급하게 행동하지 않고 신중하게 대처하려는 태도를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 before + 동명사구\u003c/span> : before + [walking any further (동명사구)] : \"더 멀리 가기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (decide의 목적어)\u003c/span> : decided [타동사] + [to stop and find the best way out (to부정사구/목적어)] : \"멈추고 빠져나갈 최선의 방법을 찾기로 결정했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Before walking any further, 더 멀리 가기 전에. they decided to stop, 그들은 멈추기로 결심했다. and find the best way out, 그리고 빠져나갈 최선의 방법을 찾기로. 이 문장 전체를 해석하면, 더 멀리 가기 전에 그들은 멈추고 빠져나갈 최선의 방법을 찾기로 결정했다.","hl":"m"},{"n":22,"text":"이 문장은 길을 잃은 다섯 남자가 더 멀리 나아가기 전에 멈추고 최선의 방법을 찾기로 결정하는 도입 부분이에요. 성급하게 행동하지 않고 신중하게 대처하려는 태도를 보여 주죠. Before walking any further는 더 멀리 걷기 전에라는 시간 조건을 제시하고, decided to stop and find는 결정한 내용을 to부정사로 묶어 표현했어요.","hl":"mn"},{"n":23,"text":"첫 번째, Before walking any further에서 before는 전치사이고 뒤에 동명사 walking any further가 왔어요. 전치사 뒤에는 명사나 동명사가 오기 때문에 walk가 아니라 walking으로 쓴 거예요. 두 번째, decided to stop and find the best way out에서 decided는 타동사라서 to부정사구를 목적어로 가져요. stop과 find는 to에 나란히 연결된 병렬 구조로, 멈추는 것과 찾는 것을 함께 결정한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 동안 생각한 후\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">while\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 남자가 말했다\u003c/span>\u003cspan class=\"en\">the first man said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나는 강하게 느낀다\u003c/span>\u003cspan class=\"en\">&quot;I strongly feel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 왼쪽으로 가야 한다고&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잠시 동안 생각한 후, 첫 번째 남자가 말했다. “나는 우리가 왼쪽으로 가야 한다는 생각이 강하게 들어요.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 남자가 잠시 생각한 뒤 자신의 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">느낌\u003c/b>을 말하는 장면이에요. feel 뒤에 \u003cb class=\"key\">that절\u003c/b>을 써서 '왼쪽으로 가야 한다'는 내용을 한 덩어리로 전달해요. should go left는 강한 확신보다 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">판단\u003c/b>과 충고의 느낌을 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사구\u003c/span> : after + [thinking for a while (동명사구)] : \"잠시 동안 생각한 후\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (feel의 목적어)\u003c/span> : feel + [that we should go left (명사절/목적어)] : \"우리가 왼쪽으로 가야 한다고\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"After thinking for a while, 잠시 동안 생각한 후. the first man said, 첫 번째 남자가 말했다. \"I strongly feel, \"나는 강하게 느낀다. that we should go left.\", 우리가 왼쪽으로 가야 한다고\". 이 문장 전체를 해석하면, 잠시 동안 생각한 후, 첫 번째 남자가 말했다. “나는 우리가 왼쪽으로 가야 한다는 생각이 강하게 들어요.\"","hl":"m"},{"n":25,"text":"첫 번째 남자가 잠시 생각한 뒤 자신의 강한 느낌을 말하는 장면이에요. feel 뒤에 that절을 써서 왼쪽으로 가야 한다는 내용을 한 덩어리로 전달해요. should go left는 주관적 판단과 충고의 느낌을 줘서 강한 확신보다는 자신의 의견을 조심스럽게 내는 어조예요.","hl":"mn"},{"n":26,"text":"첫 번째, After thinking for a while에서 after도 전치사라서 뒤에 동명사 thinking이 왔어요. 전치사 뒤에는 동명사를 쓰는 것을 꼭 기억하세요. 두 번째, feel 뒤에 that절이 와서 feel that 구문이 되었어요. 이때 that은 명사절을 이끄는 접속사이고, should가 있어서 왼쪽으로 가야 한다는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 번째 남자가 말했다\u003c/span>\u003cspan class=\"en\">The second man said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;우리는 오른쪽으로 가야 해요\u003c/span>\u003cspan class=\"en\">&quot;We should go right,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 '오른쪽'은 또한 '옳은'이라는 의미이기 때문이죠&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003cspan class=\"tgt\">'correct.'\u003c/span>&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자 세 번째 남자가 말했다\u003c/span>\u003cspan class=\"en\">Then the third man said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;다시 돌아갑시다.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">back.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 번째 남자가 말했다. “우리는 오른쪽으로 가야 해요. 왜냐하면 ‘오른쪽'은 또한 ’옳은’이라는 의미이기 때문이죠.” 그러자 세 번째 남자가 말했다. “다시 돌아갑시다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 남자는 right가 '오른쪽'과 '옳은'을 동시에 뜻하는 점을 이용해 \u003cb class=\"key\">말장난\u003c/b>으로 자기 의견을 정당화해요. 이어서 세 번째 남자는 왔던 길을 \u003cb class=\"key\">되돌아가자\u003c/b>고 제안하며 다른 해결책을 내놓아요. 이 문장은 서로 다른 방향을 제시하는 인물들의 \u003cb class=\"key\">시각 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 보여 주는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">because 부사절 (이유)\u003c/span> : because + [right also means 'correct' (주어+동사 부사절)] : \"왜냐하면 '오른쪽'은 또한 '옳은'이라는 의미이기 때문이죠\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">청유문 Let's\u003c/span> : Let's + [walk back (동사원형)] : \"다시 돌아갑시다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The second man said, 두 번째 남자가 말했다. \"We should go right, \"우리는 오른쪽으로 가야 해요. because right also means 'correct.'\", 왜냐하면 '오른쪽'은 또한 '옳은'이라는 의미이기 때문이죠\". Then the third man said, 그러자 세 번째 남자가 말했다. \"Let's walk back, \"다시 돌아갑시다.. 이 문장 전체를 해석하면, 두 번째 남자가 말했다. “우리는 오른쪽으로 가야 해요. 왜냐하면 ‘오른쪽'은 또한 ’옳은’이라는 의미이기 때문이죠.” 그러자 세 번째 남자가 말했다. “다시 돌아갑시다.","hl":"m"},{"n":28,"text":"두 번째 남자는 right가 오른쪽과 옳은을 동시에 뜻한다는 점을 이용해 말장난으로 자기 의견을 정당화해요. 이어서 세 번째 남자는 왔던 길을 되돌아가자고 제안하며 또 다른 해결책을 내놓아요. 이렇게 서로 다른 방향을 제시하는 인물들의 시각 차이를 보여 주는 흐름이에요.","hl":"mn"},{"n":29,"text":"첫 번째, because는 이유를 나타내는 접속사로 뒤에 완전한 절이 와요. right also means correct에서 right이 오른쪽과 옳은이라는 두 가지 뜻을 동시에 가지는 말장난을 하고 있죠. 두 번째, Let's walk back은 함께 되돌아가자고 제안하는 청유문이에요. Let's 뒤에는 반드시 동사원형인 walk가 와야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그 길로 왔고\u003c/span>\u003cspan class=\"en\">We came that way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 나갈 수 있어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 길로\u003c/span>\u003cspan class=\"en\">that way.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그 길로 왔으니 그 길로 나갈 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 남자는 이미 왔던 길을 근거로 다시 돌아가자고 제안해요. came that way는 그 길로 왔다는 \u003cb class=\"key\">경험\u003c/b>, leave that way는 같은 길로 나가자는 판단을 연결해요. so는 앞의 경험을 \u003cb class=\"key\">근거\u003c/b>로 삼는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 so의 원인-결과 연결\u003c/span> : S + V, so + S + V : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 가능\u003c/span> : can + 동사원형 : \"나갈 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We came that way, 우리는 그 길로 왔고. so, 그래서. we can leave, 우리는 나갈 수 있어요. that way, 그 길로. 이 문장 전체를 해석하면, 우리는 그 길로 왔으니 그 길로 나갈 수 있어요.","hl":"m"},{"n":31,"text":"세 번째 남자는 이미 왔던 길이라는 경험을 근거로 다시 돌아가자고 제안합니다. came that way는 그 길로 왔다는 경험, leave that way는 같은 길로 나가자는 판단을 연결해요. so가 앞 문장의 경험을 근거로 삼는 흐름을 만들어 줘요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 so예요. so는 앞뒤 문장을 연결하는 등위접속사로, 앞 문장이 원인이 되고 뒤 문장이 결과가 되는 관계를 만들어요. 두 번째 어법 포인트는 can leave예요. can은 가능을 뜻하는 조동사라서 뒤에 동사원형 leave가 왔고, 그래서 나갈 수 있다고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 걸어갈 수 있어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲 주위를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">forest\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 우리는 숲을 빙 돌아서 갈 수 있고요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 남자는 돌아간 뒤 숲을 통과하지 않고 가장자리로 돌아서 가자고 구체적으로 덧붙여요. walk around the forest는 숲을 \u003cb class=\"key\">우회\u003c/b>하는 동선이에요. 이 문장은 앞 문장의 판단을 이어받아 행동 계획을 완성해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 Then의 순서 연결\u003c/span> : Then + S + V : \"그러면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 가능\u003c/span> : can + 동사원형 : \"걸어갈 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 around the forest의 장소 방향\u003c/span> : walk around + 명사구 : \"숲 주위를 걷다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Then, 그러면. we can walk, 우리는 걸어갈 수 있어요. around the forest.\", 숲 주위를. 이 문장 전체를 해석하면, 그러면 우리는 숲을 빙 돌아서 갈 수 있고요.","hl":"m"},{"n":34,"text":"세 번째 남자는 돌아간 뒤 숲을 통과하지 않고 가장자리로 돌아서 가자고 구체적으로 덧붙여요. walk around the forest는 숲을 우회하는 동선을 나타내요. 이 문장은 앞 문장의 판단을 이어받아 행동 계획을 완성해요.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 Then이에요. Then은 접속부사로 앞 문장에 이어서 그러면이라는 뜻으로 순서를 자연스럽게 연결해요. 두 번째 어법 포인트는 can walk예요. can은 가능을 뜻하는 조동사이므로 뒤에 동사원형 walk가 와요. 세 번째 어법 포인트는 around the forest예요. around는 전치사로 뒤에 명사구 the forest를 데리고 장소와 방향을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 번째 남자는 동의하지 않았고\u003c/span>\u003cspan class=\"en\">The fourth man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">disagreed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 생각에는\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 계속 걸어가야 해요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">walking \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">똑바로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">straight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네 번째 남자가 동의하지 않고 말했다. “나는 우리가 계속 똑바로 걸어 나가야 한다고 생각해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 네 번째 남자는 세 번째 남자의 의견에 반대하며 계속 직진하자고 제시해요. keep walking straight는 방향을 바꾸지 않고 \u003cb class=\"key\">직진\u003c/b>하는 것이고, I think는 확신보다는 자신의 \u003cb class=\"key\">판단\u003c/b>을 완곡하게 드러내요. 이로써 여러 상반된 해결책이 나와 갈등이 커져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 서술어 병렬\u003c/span> : 주어 + V1 + and + V2 : \"동의하지 않았고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적절을 이끄는 I think의 that 생략\u003c/span> : I think [(that) + S + V] : \"나는 ~라고 생각해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 should와 keep 동명사 구문\u003c/span> : should + keep + [-ing] : \"계속 똑바로 걸어가야 해요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The fourth man disagreed, 네 번째 남자는 동의하지 않았고. and said, 그리고 말했어요. \"I think, 내 생각에는. we should keep walking, 우리는 계속 걸어가야 해요. straight, 똑바로. 이 문장 전체를 해석하면, 네 번째 남자가 동의하지 않고 말했다. “나는 우리가 계속 똑바로 걸어 나가야 한다고 생각해요.","hl":"m"},{"n":37,"text":"네 번째 남자는 세 번째 남자의 의견에 반대하며 계속 직진하자고 제시합니다. keep walking straight는 방향을 바꾸지 않고 직진하는 것이고, I think는 확신보다는 자신의 판단을 완곡하게 드러내요. 이로써 여러 상반된 해결책이 나와 갈등이 커져요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 disagreed and said예요. and가 두 서술어를 병렬로 연결해서 한 주어의 두 동작을 이어 주고 있어요. 두 번째 어법 포인트는 I think예요. think 뒤에는 that이 생략된 명사절이 이어지고, 우리가 계속 걸어가야 한다는 의견을 완곡하게 전달해요. 세 번째 어법 포인트는 should keep walking straight예요. should는 의무나 충고를 나타내는 조동사이고, keep은 뒤에 동명사를 목적어로 취해서 계속 똑바로 걸어가야 한다고 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 숲은\u003c/span>\u003cspan class=\"en\">The forest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속될 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영원히\u003c/span>\u003cspan class=\"en\">forever.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">숲이 영원히 계속될 수는 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 네 번째 남자가 직진을 주장하는 근거로, 숲이 무한하지 않다는 논리를 펼치는 문장입니다. '계속될 수 없다'는 \u003cb class=\"key\">cannot \u003c/b>\u003cb class=\"key\">go \u003c/b>\u003cb class=\"key\">on \u003c/b>\u003cb class=\"key\">forever\u003c/b>가 핵심으로, 앞서 나온 방향 전환 주장과 대비되는 확신을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 cannot + 구동사 go on\u003c/span> : cannot [조동사] + go on [구동사] + forever [부사] : \"영원히 계속될 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The forest, 그 숲은. cannot go on, 계속될 수 없다. forever, 영원히. 이 문장 전체를 해석하면, 숲이 영원히 계속될 수는 없어요.","hl":"m"},{"n":40,"text":"이 문장은 네 번째 남자가 숲이 무한하지 않으니 계속 직진하면 끝이 있다고 주장하는 거예요. cannot go on forever이 핵심 표현으로, 숲이 영원히 계속될 수 없다는 뜻이죠. 앞에서 방향을 정하자는 다른 사람들과 달리 직진을 선택한 이유가 여기에 있어요.","hl":"mn"},{"n":41,"text":"문법 포인트를 짚어 볼게요. cannot go on에서 cannot은 can의 부정형으로 뒤에 동사원형이 오고, go on은 계속되다라는 뜻의 구동사예요. 그래서 cannot go on forever는 영원히 계속될 수 없다가 됩니다. 시험에서는 cannot 뒤에 동사원형이 오는지, 그리고 go on의 뜻을 묻는 문제가 자주 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 길이\u003c/span>\u003cspan class=\"en\">A new path\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열릴 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">open\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 길이 열릴 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 직진하면 결국 새로운 길이 나타날 것이라는 낙관적 전망을 제시합니다. \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">new \u003c/b>\u003cb class=\"key\">path\u003c/b>가 \u003cb class=\"key\">will \u003c/b>\u003cb class=\"key\">open\u003c/b>이라는 표현으로, 길이 수동적으로 만들어지는 것이 아니라 자연스럽게 열린다는 느낌을 줍니다. 네 번째 남자의 주장을 완성하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형 open (open의 자동사 용법)\u003c/span> : will [조동사] + open [자동사] : \"열릴 것이다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"A new path, 새로운 길이. will open, 열릴 것이다. 이 문장 전체를 해석하면, 새로운 길이 열릴 것입니다.","hl":"m"},{"n":43,"text":"이 문장은 직진하면 결국 새로운 길이 나타날 것이라는 낙관적인 전망을 보여줘요. A new path가 will open이라는 표현을 통해 길이 자연스럽게 열린다는 느낌을 주죠. 네 번째 남자의 주장을 완성하는 문장이에요.","hl":"mn"},{"n":44,"text":"will open을 보면, will은 미래를 나타내는 조동사이고 뒤에 동사원형 open이 왔어요. open은 우리말로 열리다라고 해석되지만 수동태 be opened를 쓰지 않고 자동사로 표현한 점이 중요해요. 그래서 A new path will open은 새로운 길이 열릴 것이다라는 자연스러운 미래 예측이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 모두를 바라보면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Looking \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">all,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다섯 번째 남자가 고개를 저으며\u003c/span>\u003cspan class=\"en\">the fifth man \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shook \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">head\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했다\u003c/span>\u003cspan class=\"en\">and said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나는 이것을 해결하는 방법을 알아요\u003c/span>\u003cspan class=\"en\">&quot;I know \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">solve \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들 모두를 바라보면서, 다섯 번째 남자가 고개를 저으며 말했다. “나는 이것을 해결하는 방법을 알아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다섯 번째 남자가 다른 네 사람의 주장을 듣고도 성급히 방향을 정하지 않고, 해결 방법을 알고 있다고 말하는 문장입니다. \u003cb class=\"key\">shook \u003c/b>\u003cb class=\"key\">his \u003c/b>\u003cb class=\"key\">head\u003c/b>는 부정이나 반대의 태도를, \u003cb class=\"key\">how \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">solve \u003c/b>\u003cb class=\"key\">this\u003c/b>는 문제 해결의 확신을 나타냅니다. 이는 곧 이어질 '잠깐 기다려 보세요'와 함께 갈등 해결의 전환점을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사의 부사적 용법)\u003c/span> : Looking at them all, + S + V : \"그들 모두를 바라보면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불규칙 동사 shake-shook-shaken\u003c/span> : shake - shook - shaken : \"고개를 저었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (명사구)\u003c/span> : know + [how to solve this] (의문사+to부정사구, 목적어) : \"이것을 해결하는 방법\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Looking at them all, 그들 모두를 바라보면서. the fifth man shook his head, 다섯 번째 남자가 고개를 저으며. and said, 말했다. \"I know how to solve this, \"나는 이것을 해결하는 방법을 알아요. 이 문장 전체를 해석하면, 그들 모두를 바라보면서, 다섯 번째 남자가 고개를 저으며 말했다. “나는 이것을 해결하는 방법을 알아요.","hl":"m"},{"n":46,"text":"이 문장은 다섯 번째 남자가 다른 네 사람의 주장을 듣고도 성급히 방향을 정하지 않고, 해결 방법을 알고 있다고 말하는 거예요. shook his head는 부정이나 반대의 태도를, how to solve this는 문제 해결의 확신을 나타내요. 이 장면은 이어지는 잠깐 기다려 보세요와 함께 갈등 해결의 전환점을 예고합니다.","hl":"mn"},{"n":47,"text":"문법 포인트를 짚어 볼게요. 첫 번째는 Looking at them all인데, 주절 주어 the fifth man이 보는 행위의 주체이므로 능동의 현재분사 Looking을 쓴 분사구문입니다. 두 번째는 shook his head인데, shake의 과거형이 shook이라는 불규칙 변화를 기억하세요. 세 번째는 how to solve this로, 의문사 how에 to부정사가 붙어 명사구가 되어 know의 목적어 역할을 합니다. 해석은 해결하는 방법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠깐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기다려 보세요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">wait.\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잠깐 기다려 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 번째 남자가 자신이 해결 방법을 알고 있다고 말한 뒤, \u003cb class=\"key\">잠깐 \u003c/b>\u003cb class=\"key\">기다리라고\u003c/b> 요청하며 분위기를 전환하는 역할을 합니다. 'Just wait'라는 짧은 \u003cb class=\"key\">명령문\u003c/b>은 말을 길게 늘어놓지 않고 상대의 주의를 집중시키며, 다음에 어떤 행동이 이어질지 \u003cb class=\"key\">궁금증\u003c/b>을 불러일으킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : Just + [동사원형] : \"잠깐 기다려 보세요.\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Just, 잠깐. wait, 기다려 보세요.. 이 문장 전체를 해석하면, 잠깐 기다려 보세요.","hl":"m"},{"n":49,"text":"이 문장은 다섯 번째 남자가 다른 네 명에게 잠깐 기다리라고 말하는 장면이에요. 앞 문장에서 내가 이 문제를 해결하는 방법을 안다고 말한 다음, 바로 방법을 말하지 않고 기다리라고 해서 궁금증을 불러일으키죠. 여기서 Just는 명령의 느낌을 부드럽게 하지만, 여전히 기다리라는 지시예요.","hl":"mn"},{"n":50,"text":"이 문장의 핵심 어법은 명령문이에요. Just wait.는 주어 없이 동사원형 wait으로 시작하는 명령문이고, Just는 그 명령을 부드럽게 하면서 잠깐이라는 의미를 더하는 부사예요. 명령문은 상대방에게 지시나 요청을 할 때 쓰고, 여기서는 잠깐 기다려 보세요라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">남자\u003c/b>가 여행 중 \u003cb class=\"key\">울창한 \u003c/b>\u003cb class=\"key\">숲\u003c/b>에서 길을 잃는다.\u003c/li>\u003cli>네 남자는 \u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">방향\u003c/b>을 각각 주장한다.\u003c/li>\u003cli>다섯 번째 남자는 그들의 제안에 \u003cb class=\"key\">고개를 \u003c/b>\u003cb class=\"key\">저으며\u003c/b> 해결 방법을 안다고 말한다.\u003c/li>\u003cli>그의 해결책은 서두르지 말고 \u003cb class=\"key\">잠깐 \u003c/b>\u003cb class=\"key\">기다리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When five wise men got lost in a thick forest, they suggested different directions, but the last man told them to just wait.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">어느 날 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">남자\u003c/b>가 울창한 숲에서 길을 잃고, 네 남자가 서로 다른 방향을 주장하지만, 마지막 남자는 \u003cb class=\"key\">잠깐 \u003c/b>\u003cb class=\"key\">기다리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 해결책이라고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 지문을 정리하면, 다섯 지혜로운 남자가 숲에서 길을 잃고 네 명이 서로 다른 방향을 주장하지만, 다섯 번째 남자는 잠깐 기다리는 것이 해결책이라고 말해요. 이 짧은 이야기 속에는 성급하게 행동하기보다 멈추어 생각하라는 메시지가 담겨 있어요. 글의 구조를 문제와 해결, 미괄식으로 잡고 마지막 문장 Just wait를 핵심으로 기억하면 시험에서 큰 도움이 될 거예요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
