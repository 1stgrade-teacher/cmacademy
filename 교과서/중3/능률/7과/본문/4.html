할 것으로 보이지만, 동시에 여러 우려도 존재합니다.</li><li>로봇의 도움으로 편리해질 일상(convenient)에 대한 기대</li><li>일자리 감소 및 안전 위협(threats)에 대한 걱정</li><li>핵심 키워드: 미래(future)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 공존을 위한 과제</div><ul><li>로봇을 안전하고 유익하게 활용하기 위해 우리는 해결책을 찾아야 합니다.</li><li>로봇이 가져올 문제에 대한 해결책(solutions) 모색</li><li>로봇을 오직 긍정적인 방향으로 사용하려는 노력(ensure)</li><li>핵심 키워드: 공존(coexistence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">search-and-rescue</td><td class=\"m\">수색 및 구조의</td></tr><tr><td class=\"w\">disaster</td><td class=\"m\">재난, 재해</td></tr><tr><td class=\"w\">area</td><td class=\"m\">지역, 구역</td></tr><tr><td class=\"w\">survivor</td><td class=\"m\">생존자</td></tr><tr><td class=\"w\">deal with</td><td class=\"m\">~을 처리하다, 대처하다</td></tr><tr><td class=\"w\">clear</td><td class=\"m\">(장애물 등을) 치우다, 제거하다</td></tr><tr><td class=\"w\">route</td><td class=\"m\">길, 경로</td></tr><tr><td class=\"w\">escape</td><td class=\"m\">탈출하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">safety</td><td class=\"m\">안전</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 희망적인</td></tr><tr><td class=\"w\">convenient</td><td class=\"m\">편리한</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr><tr><td class=\"w\">threat</td><td class=\"m\">위협</td></tr><tr><td class=\"w\">solution</td><td class=\"m\">해결책</td></tr><tr><td class=\"w\">ensure</td><td class=\"m\">확실하게 하다, 보장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수색 구조 로봇은</span><span class=\"en\"><b>Search-and-rescue robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들어갈 수 있다</span><span class=\"en\"><b>can go into</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재난 지역 안으로</span><span class=\"en\"><b>disaster areas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험한</span><span class=\"en\"><b><span class=\"grammar-hl\">that are dangerous</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간에게</span><span class=\"en\"><b><span class=\"grammar-hl\">for humans</span>.</b></span></div></div><div class=\"lec-sent-ko\">수색 구조 로봇은 사람에게 위험한 재난 지역에 투입될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재난 현장에 로봇이 투입될 수 있다는 도입부입니다. 인간이 직접 가기 힘든 환경을 로봇이 대신한다는 기능적 역할을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that are dangerous for humans (관계대명사): that은 주격 관계대명사로, 선행사 disaster areas를 수식하며 절 내부에서 주어 역할을 수행하여 &#39;인간에게 위험한 재난 지역&#39;이라는 의미를 만듭니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">search-and-rescue</td><td class=\"m\">수색 및 구조의</td></tr><tr><td class=\"w\">disaster</td><td class=\"m\">재난, 재해</td></tr><tr><td class=\"w\">area</td><td class=\"m\">지역, 구역</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생존자를 찾고,</span><span class=\"en\"><b>find survivors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험 요소들을 처리하며,</span><span class=\"en\"><b>deal with dangers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길을 치운다</span><span class=\"en\"><b>and clear routes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">so that</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탈출할 수 있도록</span><span class=\"en\"><b>can escape</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전한 곳으로</span><span class=\"en\"><b>to safety.</b></span></div></div><div class=\"lec-sent-ko\">그들은 생존자를 찾고, 위험 요소를 처리하며, 사람들이 안전한 곳으로 탈출할 수 있도록 길을 말끔히 치운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 로봇의 구체적인 임무를 설명합니다. &#39;deal with&#39;는 사전적으로 &#39;다루다&#39;인데, 여기서는 재난 현장의 위험물을 &#39;직접 제거하거나 조치한다&#39;는 의미입니다. 로봇이 인간의 안전을 위해 수행하는 실질적인 활동을 강조하기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so that (관용표현): 목적을 나타내는 접속사 구로, 뒤에 주어(people)와 동사(can escape)가 이어져 &#39;~할 수 있도록&#39;이라는 의미의 부사절을 이끕니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survivor</td><td class=\"m\">생존자</td></tr><tr><td class=\"w\">deal with</td><td class=\"m\">~을 처리하다, 대처하다</td></tr><tr><td class=\"w\">clear</td><td class=\"m\">(장애물 등을) 치우다, 제거하다</td></tr><tr><td class=\"w\">route</td><td class=\"m\">길, 경로</td></tr><tr><td class=\"w\">escape</td><td class=\"m\">탈출하다</td></tr><tr><td class=\"w\">safety</td><td class=\"m\">안전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 미래는</span><span class=\"en\"><b>Our future</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇과 함께하는</span><span class=\"en\"><b>with robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밝아 보인다</span><span class=\"en\"><b>looks bright</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 완벽하지는 않다</span><span class=\"en\"><b>but not perfect.</b></span></div></div><div class=\"lec-sent-ko\">로봇과 함께하는 우리의 미래는 밝지만 완벽해 보이지는 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주제가 &#39;로봇의 활용&#39;에서 &#39;미래에 대한 전망&#39;으로 전환됩니다. 밝은 측면과 위험성을 동시에 언급하며 글의 균형을 잡는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Looking toward the Future (현재분사): 분사구문으로, 문장 전체의 주제를 제시하며 &#39;미래를 바라보면서&#39;와 같이 시간 또는 부수적인 상황을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 희망적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삶이 ~되기를 기대한다</span><span class=\"en\"><b><span class=\"grammar-hl\">expect life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 편리해지기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to become more convenient</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇의 도움으로</span><span class=\"en\"><b>with the help of robots.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 로봇의 도움으로 생활이 더욱 편리해질 것이라고 기대한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇이 가져올 긍정적인 기대감을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">expect life to become more convenient 5형식(SVOC) 구조: expect(동사) + life(목적어) + to become(목적보어) 구조입니다. to부정사가 목적보어로 쓰여 목적어인 life가 하는 동작을 설명합니다.</div><div class=\"lec-gr-item\">to become (to부정사): 5형식 구조에서 expect의 목적보어로 쓰여 &#39;삶이 ~하게 되는 것&#39;을 기대한다는 의미를 보충합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">convenient</td><td class=\"m\">편리한</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들은</span><span class=\"en\"><b>other people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제들에 대해 걱정한다</span><span class=\"en\"><b>worry about problems</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 일으킬지도 모르는</span><span class=\"en\"><b><span class=\"grammar-hl\">they might cause</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위협과 같은</span><span class=\"en\"><b>such as threats</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 일자리와 안전에 대한</span><span class=\"en\"><b>to our jobs and safety.</b></span></div></div><div class=\"lec-sent-ko\">그러나 다른 어떤 사람들은 우리의 일자리와 안전에 대한 위협과 같이, 로봇이 일으킬지 모르는 문제들에 대해 걱정한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장과 대조되는 부정적인 전망을 제시합니다. 앞 문장의 기대를 반전시켜 독자가 로봇의 양면성을 생각하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">they might cause (관계대명사): 목적격 관계대명사(which/that)가 생략된 구조로, 선행사 problems를 수식합니다. 절 내부의 cause 뒤에 목적어 자리가 비어 있어 &#39;그들이 초래할지도 모르는 문제들&#39;이라는 의미가 됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">safety</td><td class=\"m\">안전</td></tr><tr><td class=\"w\">threat</td><td class=\"m\">위협</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중요한 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">The important thing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is to find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 해결책들을</span><span class=\"en\"><b><span class=\"grammar-hl\">possible solutions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 확실히 하는 것이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to ensure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇들이</span><span class=\"en\"><b>that robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 사용되도록</span><span class=\"en\"><b><span class=\"grammar-hl\">are only used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선한 목적을 위해</span><span class=\"en\"><b>for good.</b></span></div></div><div class=\"lec-sent-ko\">중요한 것은 가능한 해결책들을 찾는 것과 로봇이 반드시 좋은 일을 위해서만 쓰이도록 하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론입니다. 앞서 제시된 문제점(위협)에 대해 인간이 해야 할 과제를 제시합니다. &#39;ensure&#39;는 &#39;보장하다&#39;라는 뜻인데, 여기서는 로봇의 활용 방향을 인간이 통제하여 &#39;부정적인 결과를 막겠다&#39;는 강력한 의지를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The important thing is to find possible solutions (가주어): 진주어: 명사구 &#39;to find possible solutions&#39;가 보어 자리에 위치하여 주어 &#39;The important thing&#39;의 내용을 구체적으로 설명합니다.</div><div class=\"lec-gr-item\">to find (to부정사): 명사적 용법으로 주격 보어 역할을 하며 &#39;~하는 것&#39;으로 해석됩니다.</div><div class=\"lec-gr-item\">to ensure (to부정사): 명사적 용법으로, 앞의 to find와 대등하게 연결되어 &#39;보장하는 것&#39;이라는 보어 역할을 합니다.</div><div class=\"lec-gr-item\">are only used (수동태): be동사(are)+p.p.(used) 구조입니다. use는 타동사인데 목적어가 없어서 수동구조로 쓰입니다. 기본구조: use A for B(A를 B를 위해 사용하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">solution</td><td class=\"m\">해결책</td></tr><tr><td class=\"w\">ensure</td><td class=\"m\">확실하게 하다, 보장하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>수색 및 구조 로봇은 인간이 가기 힘든 위험한 재난 지역에서 생존자를 구조하는 임무를 수행한다.</li><li>로봇 기술의 미래는 밝지만 일자리 위협 등 잠재적인 문제점도 공존한다.</li><li>따라서 로봇이 우리에게 긍정적인 역할만 하도록 해결책을 마련하는 것이 중요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Robots perform dangerous tasks in disaster areas, but society must address concerns about their potential threats to ensure safe use.</div>\n              <div class=\"lec-final-sum-ko\">로봇은 재난 지역에서 위험한 작업을 수행하지만, 사회는 안전한 사용을 보장하기 위해 그것이 초래할 잠재적 위협에 대한 우려를 해결해야 한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":"main"},{"audio":"./4_audio/9.mp3","hl":"meaning"},{"audio":"./4_audio/10.mp3","hl":"grammar"}],[{"audio":"./4_audio/11.mp3","hl":"main"},{"audio":"./4_audio/12.mp3","hl":"meaning"},{"audio":"./4_audio/13.mp3","hl":"grammar"}],[{"audio":"./4_audio/14.mp3","hl":"main"},{"audio":"./4_audio/15.mp3","hl":"meaning"},{"audio":"./4_audio/16.mp3","hl":"grammar"}],[{"audio":"./4_audio/17.mp3","hl":"main"},{"audio":"./4_audio/18.mp3","hl":"meaning"},{"audio":"./4_audio/19.mp3","hl":"grammar"}],[{"audio":"./4_audio/20.mp3","hl":"main"},{"audio":"./4_audio/21.mp3","hl":"meaning"},{"audio":"./4_audio/22.mp3","hl":"grammar"}],[{"audio":"./4_audio/23.mp3","hl":"main"},{"audio":"./4_audio/24.mp3","hl":"meaning"},{"audio":"./4_audio/25.mp3","hl":"grammar"}],[{"audio":"./4_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.que );show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
