v class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01로봇의 변화와 AI의 역할</div><ul><li>과거의 단순한 로봇에서 벗어나 인간처럼 사고하는 스마트한 로봇으로 발전하고 있다.</li><li>과거: 인간이 프로그래밍한 단순한 작업 수행</li><li>현재: 인공지능(Artificial Intelligence)을 통해 스스로 생각함</li><li>핵심 키워드: 인공지능(Artificial Intelligence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02인공지능 로봇의 주요 기능</div><ul><li>인공지능을 탑재한 로봇은 주변 상황을 파악하고 인간과 복합적인 상호작용이 가능하다.</li><li>주변 환경 인식 및 스스로 결정 내리기</li><li>사람의 말 인식(recognize speech) 및 농담하기</li><li>인간과 함께 게임하기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03생활 속 AI 스피커의 활용</div><ul><li>일상생활에서 편리함을 주는 인공지능 스피커의 다양한 기능을 설명한다.</li><li>궁금한 질문에 대한 대답 제공</li><li>가정 내 가전 기기 제어(control machines)</li><li>음악 재생 및 편의 서비스 제공</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04인공지능 펫의 특징</div><ul><li>실제 반려동물처럼 행동하며 인간과 교감하는 인공지능 로봇의 모습이다.</li><li>실제 개와 유사한 행동 방식</li><li>주인과 함께 걷거나 놀기</li><li>칭찬을 인식(recognize praise)하고 반응함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perform</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr><tr><td class=\"w\">program</td><td class=\"m\">프로그램을 입력하다, 프로그래밍하다</td></tr><tr><td class=\"w\">smart</td><td class=\"m\">똑똑한</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">artificial intelligence</td><td class=\"m\">인공지능</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 감지하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">make a decision</td><td class=\"m\">결정하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recognize</td><td class=\"m\">인식하다, 알아보다</td></tr><tr><td class=\"w\">speech</td><td class=\"m\">말, 언어</td></tr><tr><td class=\"w\">tell a joke</td><td class=\"m\">농담하다</td></tr><tr><td class=\"w\">answer</td><td class=\"m\">대답하다</td></tr><tr><td class=\"w\">control</td><td class=\"m\">제어하다, 조종하다</td></tr><tr><td class=\"w\">act</td><td class=\"m\">행동하다</td></tr><tr><td class=\"w\">owner</td><td class=\"m\">주인</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과거에,</span><span class=\"en\"><b>In the past,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇들은 수행했다</span><span class=\"en\"><b>robots performed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 쉬운 일들만을</span><span class=\"en\"><b>only easy tasks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간이 그들에게 프로그래밍했던</span><span class=\"en\"><b><span class=\"grammar-hl\">that humans programmed them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span>.</b></span></div></div><div class=\"lec-sent-ko\">과거에 로봇은 인간이 로봇에게 행하도록 프로그래밍한 간단한 일만을 수행했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 나타내는 제목입니다. 과거의 단순한 기계였던 로봇이 지능을 갖추게 변화했다는 핵심 내용을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that humans programmed them to do (관계대명사): that이 목적격 관계대명사로 쓰여 선행사 tasks를 수식함. 구조는 &#39;관계대명사 + S(humans) + V(programmed) + O(them) + O.C.(to do)&#39; 형태이며, to do(to부정사)는 5형식 구조의 목적보어로 사용됨.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perform</td><td class=\"m\">수행하다</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr><tr><td class=\"w\">program</td><td class=\"m\">프로그램을 입력하다, 프로그래밍하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇들은 이제 되고 있다</span><span class=\"en\"><b>robots are now getting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 똑똑해지고,</span><span class=\"en\"><b>“smarter,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b>and soon</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각할 수 있을지도 모른다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">might be able to think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간처럼</span><span class=\"en\"><b>like humans.</b></span></div></div><div class=\"lec-sent-ko\">그러나 로봇은 이제 점점 ‘더 똑똑해’지고 있으며, 곧 그들은 인간처럼 생각을 할 수 있을지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장과 대조를 이루는 문장입니다. getting은 단순한 &#39;얻다&#39;가 아니라 &#39;어떤 상태로 변화하고 있다&#39;는 진행의 의미로 쓰였습니다. 로봇이 수동적 존재에서 능동적 사고를 하는 존재로 진화하고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might be able to think (관용표현): be able to는 조동사 can의 의미를 보완하는 구조로, &#39;～할 수 있다&#39;는 능력을 나타냄. 뒤에 to think(to부정사)가 이어짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smart</td><td class=\"m\">똑똑한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 가능하게 만드는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">What makes this possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인공지능(AI)</span><span class=\"en\"><b>artificial intelligence (AI).</b></span></div></div><div class=\"lec-sent-ko\">이를 가능하게 하는 것이 인공지능(AI)이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇의 지능적인 변화를 가능케 한 원인(AI)을 밝히는 문장으로, 앞 문장에서 제기된 변화의 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What makes this possible (관계대명사): What은 선행사를 포함한 관계대명사로 &#39;～하는 것&#39;이라는 명사절을 이끎. makes(5형식 동사) + this(O) + possible(C) 구조를 취함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">artificial intelligence</td><td class=\"m\">인공지능</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로봇들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Robots</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인공지능을 가진</span><span class=\"en\"><b><span class=\"grammar-hl\">that have AI</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 인지할 수 있다</span><span class=\"en\"><b>can perceive environments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 결정을 내릴 수 있다</span><span class=\"en\"><b>and make decisions.</b></span></div></div><div class=\"lec-sent-ko\">인공 지능을 갖춘 로봇은 환경을 인지하고 결정을 내릴 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> AI가 구체적으로 어떤 능력을 부여하는지 설명합니다. perceive는 &#39;인지하다&#39;라는 뜻인데, 단순히 보는 것을 넘어 주변 상황을 이해하고 파악하는 지적인 과정을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Robots that have AI (관계대명사): that이 주격 관계대명사로 쓰여 앞의 Robots를 수식함. 관계대명사 뒤에는 동사 have가 바로 이어지며 절을 구성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 감지하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 말을 인식할 수 있다,</span><span class=\"en\"><b>They can also recognize speech,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농담을 할 수 있고,</span><span class=\"en\"><b>tell jokes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게임을 할 수 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">play games</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with humans</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 말을 인식하고, 농담을 건네며, 인간과 게임을 할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇의 능력이 단순 작업을 넘어 인간과 상호작용하는 수준까지 도달했음을 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">play games with humans (관용표현): play games with(~와 게임을 하다)는 함께 상호작용하는 대상을 나타내는 관용구임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recognize</td><td class=\"m\">인식하다, 알아보다</td></tr><tr><td class=\"w\">speech</td><td class=\"m\">말, 언어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 대답할 수 있다</span><span class=\"en\"><b>They can answer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 질문들에,</span><span class=\"en\"><b>your questions,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기계들을 제어할 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">control machines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 집에 있는,</span><span class=\"en\"><b>in your home,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 음악을 재생할 수 있다</span><span class=\"en\"><b>and play music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 위해</span><span class=\"en\"><b>for you.</b></span></div></div><div class=\"lec-sent-ko\">그들은 당신의 질문에 대답할 수 있고, 당신의 가정에 있는 기계를 제어할 수 있으며, 당신을 위해 음악을 재생할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> AI가 적용된 구체적인 사례인 &#39;AI 스피커&#39;의 기능을 나열합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">control machines (to부정사): 앞서 생략된 조동사 can의 영향을 받는 구조로, &#39;can answer, (can) control, (can) play&#39;처럼 병렬 구조로 연결됨.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">answer</td><td class=\"m\">대답하다</td></tr><tr><td class=\"w\">control</td><td class=\"m\">제어하다, 조종하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 행동한다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">act</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼭 ~처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">just like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진짜 강아지들</span><span class=\"en\"><b><span class=\"grammar-hl\">real dogs</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 꼭 진짜 강아지처럼 행동한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 또 다른 사례인 &#39;AI 반려동물&#39;을 소개하며, 인간과 정서적으로 교감할 수 있는 로봇의 등장을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">act just like real dogs (관용표현): act like는 &#39;~처럼 행동하다&#39;라는 의미의 숙어적 표현임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">act</td><td class=\"m\">행동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 걷고 논다</span><span class=\"en\"><b>They walk and <span class=\"grammar-hl\">play</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 주인들과</span><span class=\"en\"><b><span class=\"grammar-hl\">with their owners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 인식한다</span><span class=\"en\"><b>and recognize</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">칭찬을</span><span class=\"en\"><b>praise.</b></span></div></div><div class=\"lec-sent-ko\">그들은 주인과 함께 걷고 놀며 칭찬을 알아듣는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> AI 반려동물이 진짜 생명체처럼 반응한다는 점을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">play with their owners (관용표현): play with는 &#39;~와 함께 놀다&#39;라는 의미의 전치사 포함 관용구임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recognize</td><td class=\"m\">인식하다, 알아보다</td></tr><tr><td class=\"w\">owner</td><td class=\"m\">주인</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과거의 로봇은 인간이 입력한 단순 업무만 반복하는 수동적인 기계였다.</li><li>인공지능(AI)의 등장으로 로봇은 스스로 환경을 인지하고 사고하는 능력을 갖게 되었다.</li><li>AI 스피커나 반려동물처럼, 오늘날의 로봇은 인간과 대화하고 교감하는 수준으로 발전했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Robots have evolved to perform complex tasks through AI, and they now interact with humans by perceiving environments or mimicking behaviors.</div>\n              <div class=\"lec-final-sum-ko\">로봇은 인공지능을 통해 복잡한 작업을 수행하도록 진화했으며, 이제는 주변 환경을 인식하거나 행동을 모방하며 인간과 상호작용한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"audio":"./2_audio/30.mp3","hl":"main"},{"audio":"./2_audio/31.mp3","hl":"meaning"},{"audio":"./2_audio/32.mp3","hl":"grammar"}],[{"audio":"./2_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById
