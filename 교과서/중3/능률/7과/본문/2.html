@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 7과 본문2","audioDir":"2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 7과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Robots Are Becoming Smart\u003c/h1>\u003ch2>로봇이 똑똑해지고 있다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">로봇\u003c/b>은 과거에 단순 작업만 했지만 \u003cb class=\"key\">인공지능(AI)\u003c/b> 덕분에 점점 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">똑똑해\u003c/b>져 인간처럼 생각할 가능성이 생겼다. \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">스피커\u003c/b>와 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">반려동물\u003c/b>은 질문 응답, 기기 제어, 놀이, 칭찬 인식까지 가능하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Robots are becoming smarter through artificial intelligence, and AI speakers and AI pets show human-like abilities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 중학교 3학년 능률 7과 본문 두 번째 지문을 함께 볼게요. 제목은 Robots Are Becoming Smart이고, 우리말로는 로봇이 똑똑해지고 있다입니다. 이 글은 로봇이 인공지능 덕분에 점점 인간처럼 생각하고 행동하게 된다는 내용을 다루고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문을 이해하려면 \u003cb class=\"key\">인공지능\u003c/b>이라는 개념을 알아야 해요. 인공지능은 영어로 artificial intelligence, 줄여서 AI라고 하죠. 사람처럼 듣고 말하고 판단하는 기계의 능력을 뜻해요. 예를 들어 집에 있는 AI 스피커는 여러분의 말을 듣고 질문에 답하거나 음악을 틀어 주는 비서 같은 존재예요. 최근에는 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">반려동물\u003c/b>처럼 감정을 주고받는 기기도 나오고 있어요.\u003c/div>","segs":[{"n":2,"text":"이 지문을 이해하려면 인공지능이라는 개념을 알아야 해요. 인공지능은 영어로 artificial intelligence, 줄여서 AI라고 하죠. 사람처럼 듣고 말하고 판단하는 기계의 능력을 뜻해요. 예를 들어 집에 있는 AI 스피커는 여러분의 말을 듣고 질문에 답하거나 음악을 틀어 주는 비서 같은 존재예요. 최근에는 AI 반려동물처럼 감정을 주고받는 기기도 나오고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과거의 로봇과 현재 변화\u003csmall>도입·전환 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>과거에는 \u003cb class=\"key\">로봇\u003c/b>이 사람이 프로그래밍한 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">일\u003c/b>만 수행했다. 그러나 로봇은 이제 점점 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">똑똑해\u003c/b>지고 있으며, 곧 인간처럼 \u003cb class=\"key\">생각\u003c/b>할 수 있을지도 모른다. 첫 문단은 이렇게 과거와 현재를 대비하며 변화를 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인공지능의 가능성\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이 변화를 가능하게 하는 것은 \u003cb class=\"key\">인공지능(AI)\u003c/b>이다. AI를 가진 로봇은 \u003cb class=\"key\">환경을 \u003c/b>\u003cb class=\"key\">인지\u003c/b>하고 \u003cb class=\"key\">결정\u003c/b>을 내릴 수 있다. 이것이 기존 로봇과의 차이를 만든다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>AI 스피커 예시\u003csmall>예시(능력) · 문장 5–6\u003c/small>\u003c/h4>\u003cp>AI 로봇은 \u003cb class=\"key\">말을 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하고 \u003cb class=\"key\">농담\u003c/b>도 하며 게임도 할 수 있다. \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">스피커\u003c/b>는 질문에 답하고 집 안 기계를 제어하며 음악을 재생한다. 이는 로봇이 사람과 소통하고 도움을 주는 모습이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>AI 반려동물 예시\u003csmall>예시(적용) · 문장 7–8\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">반려동물\u003c/b>은 꼭 진짜 강아지처럼 행동한다. 주인과 함께 걷고 놀며 \u003cb class=\"key\">칭찬\u003c/b>을 알아듣는다. 이 예시는 AI가 일상의 반려 동물까지 대체할 수 있음을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 과거와 현재를 비교해 줘요. 과거에는 로봇이 사람이 프로그래밍한 단순한 일만 수행했어요. 그런데 지금은 더 똑똑해지고 있고, 곧 인간처럼 생각할 수 있을지도 모른다고 해요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 그 이유를 설명해요. 이를 가능하게 하는 것이 바로 artificial intelligence, 인공지능이에요. 인공지능을 가진 로봇은 환경을 인지하고 결정을 내릴 수 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 구체적인 능력과 예시가 나와요. 로봇은 말을 인식하고 농담도 하고 게임도 할 수 있고요. AI 스피커는 질문에 답하고 집 안의 기계를 제어하며 음악도 재생해 줘요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장은 AI 반려동물에 관한 내용이에요. AI 반려동물은 꼭 진짜 강아지처럼 행동해요. 주인과 함께 걷고 놀고 칭찬도 알아들어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 로봇이 똑똑해지고 있다는 핵심 주장을 제시하므로 \u003cb class=\"key\">두괄식\u003c/b>이다. 이어서 과거의 \u003cb class=\"key\">통념\u003c/b>을 제시하고 However로 \u003cb class=\"key\">반박\u003c/b>한다. 셋째 문장에서 \u003cb class=\"key\">인공지능(AI)\u003c/b>이 원인임을 밝히고, 뒤에 AI 스피커와 AI 반려동물 예시를 든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In the past (1)\u003c/b>\u003cspan>시간 대조\u003c/span>\u003cb>However (2)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>What makes this possible (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">robots performed only easy tasks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">robots are now getting smarter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">think like humans\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">artificial intelligence (AI)\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Robots that have AI\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI Speakers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI Pets\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거의 로봇\u003c/th>\u003cth>현재의 AI 로봇\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단순 작업만 수행\u003c/td>\u003ctd>환경을 인지하고 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사람이 프로그래밍한 일만 가능\u003c/td>\u003ctd>인간처럼 생각할 가능성\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두괄식 구조예요. 첫 문장에서 로봇이 똑똑해지고 있다는 핵심 주장을 먼저 제시하죠. 그다음 과거의 통념을 제시하고 However로 반박하면서 인공지능이 원인임을 설명해요. 마지막에는 AI 스피커와 AI 반려동물이라는 예시로 뒷받침하는 전개 방식이에요.","hl":"ty"},{"n":9,"text":"신호어도 확인해 볼게요. 첫 문장의 In the past는 과거 시점을 나타내고, 두 번째 문장의 However는 앞 내용을 반전시켜 줘요. 세 번째 문장의 What makes this possible은 인공지능이 원인임을 알려 주는 표현이에요. 다섯 번째 문장의 also는 능력이 더 추가된다는 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>In the past\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>과거에\u003c/span>\u003c/div>\u003cdiv>\u003cb>perform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일, 과업\u003c/span>\u003c/div>\u003cdiv>\u003cb>program\u003c/b>\u003cem>동사\u003c/em>\u003cspan>프로그래밍하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>However\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>get smarter\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 똑똑해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>might be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있을지도 모른다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think like humans\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인간처럼 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>What makes this possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이를 가능하게 하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>artificial intelligence (AI)\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인공지능\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>make decisions\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결정을 내리다\u003c/span n>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">artificial\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둘게요. smart는 intelligent나 clever와 바꿔 쓸 수 있고 반대말은 stupid예요. possible은 feasible과 뜻이 비슷하고 반대말은 impossible이에요. perceive는 sense나 notice와 통하고 반대말은 overlook이에요. recognize는 identify와 비슷하고 반대말은 ignore인데, artificial은 man-made나 synthetic과 같은 뜻이고 반대말은 natural이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇이 똑똑해지고 있다\u003c/span>\u003cspan class=\"en\">Robots \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Are \u003c/span>\u003cspan class=\"tgt\">Becoming \u003c/span>\u003cspan class=\"tgt\">Smart\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거에\u003c/span>\u003cspan class=\"en\">In the past,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇은 간단한 일만을 수행했다\u003c/span>\u003cspan class=\"en\">robots performed only easy tasks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 로봇에게 행하도록 프로그래밍한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003cspan class=\"tgt\">programmed \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">로봇이 똑똑해지고 있다 과거에 로봇은 인간이 로봇에게 행하도록 프로그래밍한 간단한 일만을 수행했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, 과거 로봇의 한계를 먼저 제시합니다. Robots Are Becoming Smart는 \u003cb class=\"key\">현재진행형\u003c/b>을 써서 로봇이 점차 똑똑해지는 흐름을 암시하고, 이어서 과거에는 인간이 \u003cb class=\"key\">프로그래밍\u003c/b>한 단순한 일만 했다는 사실을 대비시킵니다. that 절은 easy tasks를 꾸며 주어 인간이 명령을 넣어 준 일이라는 의미를 덧붙입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + 동사원형-ing : \"똑똑해지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사 + that + 주어 + 동사 : \"인간이 로봇에게 행하도록 프로그래밍한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Robots Are Becoming Smart, 로봇이 똑똑해지고 있다. In the past, 과거에. robots performed only easy tasks, 로봇은 간단한 일만을 수행했다. that humans programmed them to do, 인간이 로봇에게 행하도록 프로그래밍한. 이 문장 전체를 해석하면, 로봇이 똑똑해지고 있다 과거에 로봇은 인간이 로봇에게 행하도록 프로그래밍한 간단한 일만을 수행했다.","hl":"m"},{"n":13,"text":"이 문장은 전체 글의 도입부로, 과거의 로봇은 시키는 대로 단순한 일만 했다는 사실을 먼저 제시합니다. Robots Are Becoming Smart에서 현재진행형을 써서 지금 변화하는 흐름을 암시하고, 과거의 제한된 모습을 대비시킵니다. that humans programmed them to do는 easy tasks를 꾸며 주는 형용사절로, 인간이 명령을 넣어 준 일이라는 점을 강조합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 Are Becoming Smart의 현재진행형입니다. be동사와 동사원형 ing가 결합해 지금도 계속 변하고 있는 중이라는 뜻을 나타냅니다. 두 번째 어법 포인트는 that humans programmed them to do의 목적격 관계대명사 that입니다. that은 선행사 easy tasks를 받아 절 안에서 do의 목적어 역할을 하며, 인간이 로봇에게 하도록 프로그래밍한이라는 의미로 앞의 명사를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇은 이제 점점 ‘더 똑똑해’지고 있으며\u003c/span>\u003cspan class=\"en\">robots \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">&quot;smarter,&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 곧\u003c/span>\u003cspan class=\"en\">and soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각을 할 수 있을지도 모른다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간처럼.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 로봇은 이제 점점 ‘더 똑똑해’지고 있으며, 곧 그들은 인간처럼 생각을 할 수 있을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장과 반대 방향으로 전환하며, 로봇이 점점 더 똑똑해지고 있다는 현재의 변화를 보여 줍니다. smarter에 따옴표를 붙여 로봇이 진짜 사람처럼 되는 것은 아니지만 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">수준\u003c/b>으로 나아가고 있음을 암시합니다. might be able to think는 미래에 그럴 \u003cb class=\"key\">가능성\u003c/b>이 있지만 확실하지 않다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + 동사원형-ing : \"이제 점점 ‘더 똑똑해’지고 있으며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might + be able to\u003c/span> : might + be able to + 동사원형 : \"생각을 할 수 있을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : like + 명사 : \"인간처럼\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 그러나. robots are now getting \"smarter,\", 로봇은 이제 점점 ‘더 똑똑해’지고 있으며. and soon, 그리고 곧. they might be able to think, 그들은 생각을 할 수 있을지도 모른다. like humans, 인간처럼.. 이 문장 전체를 해석하면, 그러나 로봇은 이제 점점 ‘더 똑똑해’지고 있으며, 곧 그들은 인간처럼 생각을 할 수 있을지도 모른다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장과 반대 방향으로 전환하며, 로봇이 점점 더 똑똑해지고 있다는 현재의 변화를 보여 줍니다. smarter에 따옴표를 붙여 로봇이 진짜 사람처럼 되는 것은 아니지만 인간과 비슷한 수준으로 나아가고 있음을 암시합니다. might be able to think는 미래에 그럴 가능성이 있지만 확실하지 않다는 뜻입니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 are now getting smarter의 현재진행형입니다. be동사와 동사원형 ing가 결합해 지금 점점 변해 가는 중이라는 뜻을 나타냅니다. 두 번째 어법 포인트는 might be able to think의 조동사 might와 be able to입니다. might는 불확실한 가능성을, be able to는 능력을 뜻해 생각할 수 있을지도 모른다는 조심스러운 전망을 표현합니다. 세 번째 어법 포인트는 like humans의 전치사 like입니다. like는 뒤에 명사 humans가 와서 인간처럼이라는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이를 가능하게 하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공지능(AI)이다.\u003c/span>\u003cspan class=\"en\">is artificial intelligence (AI).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이를 가능하게 하는 것이 인공지능(AI)이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로봇이 똑똑해질 수 있는 이유를 \u003cb class=\"key\">AI\u003c/b>라고 밝히는 핵심 문장입니다. What makes this possible은 앞 문장의 내용을 받아 '이것을 가능하게 하는 것'을 뜻하는 \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">what절\u003c/b>입니다. 문장 전체가 무엇이 가능하게 하는지 묻는 것이 아니라, 그 주체가 인공지능이라고 선언합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : What + 동사 + 목적어 + 목적격보어 : \"이를 가능하게 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 목적격보어\u003c/span> : make + 목적어(this) + 목적격보어(possible) : \"이것을 가능하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"What makes this possible, 이를 가능하게 하는 것이. is artificial intelligence (AI), 인공지능(AI)이다.. 이 문장 전체를 해석하면, 이를 가능하게 하는 것이 인공지능(AI)이다.","hl":"m"},{"n":19,"text":"이 문장은 로봇이 똑똑해질 수 있는 이유를 AI라고 밝히는 핵심 문장입니다. What makes this possible은 앞 문장의 내용을 받아 이것을 가능하게 하는 것을 뜻하는 관계대명사 what절입니다. 문장 전체가 무엇이 가능하게 하는지 묻는 것이 아니라, 그 주체가 인공지능이라고 선언합니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 What makes this possible의 관계대명사 what입니다. what은 하는 것이라는 뜻으로 명사절을 이끌고, 절 안에서는 makes의 주어 역할을 합니다. 두 번째 어법 포인트는 makes this possible의 make와 목적어와 목적격보어 구조입니다. make는 목적어 this와 목적격보어 possible을 취해 이것이 가능하도록 만들다라는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공 지능을 갖춘 로봇은\u003c/span>\u003cspan class=\"en\">Robots \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">AI\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경을 인지할 수 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">perceive \u003c/span>\u003cspan class=\"tgt\">environments \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정을 내릴 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인공 지능을 갖춘 로봇은 환경을 인지하고 결정을 내릴 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인공 지능을 갖춘 로봇이 할 수 있는 핵심 능력을 설명합니다. 앞에서 로봇이 점점 똑똑해진다고 했는데, 여기서 그 이유로 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">인지\u003c/b>와 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b> 능력을 들고 있습니다. perceive는 주변 정보를 받아들인다는 의미로, 로봇의 똑똑함을 구체적으로 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(Robots) + that + 동사(have) ~ : \"AI를 갖춘 로봇\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 병렬\u003c/span> : can + 동사원형 A and 동사원형 B : \"환경을 인지하고 결정을 내릴 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Robots that have AI, 인공 지능을 갖춘 로봇은. can perceive environments, 환경을 인지할 수 있고. and make decisions, 결정을 내릴 수 있다.. 이 문장 전체를 해석하면, 인공 지능을 갖춘 로봇은 환경을 인지하고 결정을 내릴 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 인공 지능을 가진 로봇이 환경을 인지하고 결정을 내릴 수 있다는 뜻입니다. 앞에서 로봇이 점점 똑똑해진다고 했는데 그 구체적인 능력으로 환경 인지와 의사 결정을 제시합니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 Robots that have AI에 나오는 관계대명사 that입니다. that은 주격 관계대명사로 앞에 있는 Robots를 꾸며 주고 뒤에 have AI가 와서 인공 지능을 갖춘 로봇이라는 의미를 만듭니다. 두 번째 포인트는 can 뒤에 동사원형 두 개가 and로 연결된 병렬 구조입니다. can perceive environments와 make decisions가 can에 함께 걸려서 환경을 인지하고 결정을 내릴 수 있다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 말을 인식하고,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">recognize \u003c/span>\u003cspan class=\"tgt\">speech, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농담을 건네며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">jokes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과 게임을 할 수도 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003cspan class=\"tgt\">games \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 말을 인식하고, 농담을 건네며, 인간과 게임을 할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인공 지능 로봇이 인간과 소통할 수 있다는 예를 열거합니다. 말을 인식하고 농담을 건네며 게임을 하는 것은 로봇이 단순 작업을 넘어 인간과 \u003cb class=\"key\">상호작용\u003c/b>한다는 것을 보여 줍니다. recognize speech는 \u003cb class=\"key\">말을 \u003c/b>\u003cb class=\"key\">인식하다\u003c/b>로, 사람의 말소리를 이해하는 능력을 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 3개 병렬\u003c/span> : can + (also) + 동사원형 A, B, and C : \"말을 인식하고, 농담을 건네고, 인간과 게임을 할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with의 용법\u003c/span> : 동사 + with + 명사 : \"인간과\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They can also recognize speech, 그들은 또한 말을 인식하고. tell jokes, 농담을 건네며. and play games with humans, 인간과 게임을 할 수도 있다.. 이 문장 전체를 해석하면, 그들은 또한 말을 인식하고, 농담을 건네며, 인간과 게임을 할 수도 있다.","hl":"m"},{"n":25,"text":"이 문장은 인공 지능 로봇이 인간과 소통할 수 있다는 예를 나열합니다. 말 인식, 농담, 게임은 로봇이 단순 작업을 넘어 인간과 상호작용한다는 것을 보여 줍니다. recognize speech는 말을 인식하다로 사람의 말소리를 이해하는 능력을 뜻합니다.","hl":"mn"},{"n":26,"text":"이 문장에서는 조동사 can 뒤에 동사원형 세 개가 병렬로 연결된 구조가 핵심이에요. They can also recognize speech, tell jokes, and play games with humans에서 can이 recognize, tell, play를 모두 이끌어요. 그래서 말을 인식하고 농담을 건네고 게임을 할 수 있다는 뜻이 됩니다. 마지막 with humans는 전치사 with가 놀이 상대를 나타내서 인간과라는 뜻을 만들어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공지능 스피커\u003c/span>\u003cspan class=\"en\">AI Speakers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 당신의 질문에 대답할 수 있고,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">answer \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">questions, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 가정에 있는 기계를 제어할 수 있으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">control \u003c/span>\u003cspan class=\"tgt\">machines \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">home, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 위해 음악을 재생할 수도 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003cspan class=\"tgt\">music \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인공지능 스피커 그들은 당신의 질문에 대답할 수 있고, 당신의 가정에 있는 기계를 제어할 수 있으며, 당신을 위해 음악을 재생할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인공 지능 스피커가 가정에서 제공하는 구체적인 기능을 소개합니다. 사용자의 질문에 답하고, 집 안 기기를 제어하며, 음악을 재생해 주는 \u003cb class=\"key\">편의 \u003c/b>\u003cb class=\"key\">기능\u003c/b>을 나열합니다. They는 앞에 나온 AI Speakers를 가리키므로 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">지능 \u003c/b>\u003cb class=\"key\">스피커\u003c/b>로 해석해야 자연스럽습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 3개 병렬\u003c/span> : can + 동사원형 A, B, and C : \"당신의 질문에 대답하고, 기계를 제어하며, 음악을 재생할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식\u003c/span> : 명사 + in + 명사 : \"당신의 가정에 있는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"AI Speakers, 인공지능 스피커. They can answer your questions, 그들은 당신의 질문에 대답할 수 있고. control machines in your home, 당신의 가정에 있는 기계를 제어할 수 있으며. and play music for you, 당신을 위해 음악을 재생할 수도 있다.. 이 문장 전체를 해석하면, 인공지능 스피커 그들은 당신의 질문에 대답할 수 있고, 당신의 가정에 있는 기계를 제어할 수 있으며, 당신을 위해 음악을 재생할 수도 있다.","hl":"m"},{"n":28,"text":"이 문장은 인공 지능 스피커가 가정에서 제공하는 구체적인 기능을 소개합니다. 질문에 대답하고 집 안 기기를 제어하며 음악을 재생해 주는 편의 기능을 나열합니다. They는 앞에 나온 AI Speakers를 가리키므로 인공 지능 스피커로 해석해야 자연스럽습니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 can 뒤에 동사원형 세 개가 and로 병렬 연결된 구조입니다. can answer, control, play가 모두 can에 걸려서 질문에 대답하고 기계를 제어하고 음악을 재생할 수 있다는 뜻이 됩니다. 두 번째 포인트는 in your home이 앞의 machines를 뒤에서 수식하는 전치사구입니다. 당신의 집에 있는 기계라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공지능 반려동물\u003c/span>\u003cspan class=\"en\">AI Pets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 행동한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭 진짜 강아지들처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">dogs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인공 지능 반려동물 그들은 꼭 진짜 강아지처럼 행동한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 AI 스피커에 이어 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">Pets\u003c/b>를 소개하는 표제어와 함께, 그들이 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">강아지처럼\u003c/b> 행동한다는 핵심 내용을 담고 있다. just like real dogs는 '꼭 진짜 개들처럼'이라는 뜻으로, 사람이 기대하는 반려동물의 모습을 \u003cb class=\"key\">직유\u003c/b>적으로 표현했다. 글 흐름에서 AI 로봇의 또 다른 예인 반려동물 기능을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like의 유사 표현\u003c/span> : [They] [act] [just like + 명사구] : \"그들은 꼭 진짜 강아지처럼 행동한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"AI Pets, 인공지능 반려동물. They act, 그들은 행동한다. just like real dogs, 꼭 진짜 강아지들처럼. 이 문장 전체를 해석하면, 인공 지능 반려동물 그들은 꼭 진짜 강아지처럼 행동한다.","hl":"m"},{"n":31,"text":"이 문장은 AI Pets, 즉 인공지능 반려동물을 소개하면서 그들이 진짜 강아지처럼 행동한다는 핵심을 말해 줍니다. just like real dogs는 꼭 진짜 개들처럼이라는 뜻이고, 사람이 반려동물에게 기대하는 친근한 모습을 비유적으로 표현한 거예요. 글 전체에서는 AI 로봇의 또 다른 예로 반려동물 기능을 보여 주는 역할을 합니다.","hl":"mn"},{"n":32,"text":"이 문장에서 볼 어법은 just like real dogs입니다. like는 전치사라서 뒤에 명사구 real dogs가 오고, 전체가 act를 꾸며서 꼭 진짜 강아지들처럼이라는 뜻이 됩니다. just는 like를 강조해서 꼭이라는 느낌을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 걷고 놀고\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 주인들과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> their owners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 칭찬을 알아듣는다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">recognize \u003c/span>\u003cspan class=\"tgt\">praise\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 주인과 함께 걷고 놀며 칭찬을 알아듣는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '진짜 강아지처럼 행동한다'고 한 내용을 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 보여 주는 문장이다. 주인과 함께 걷고 노는 것은 실제 반려견과의 \u003cb class=\"key\">상호작용\u003c/b>을 모방한 것이고, 칭찬을 알아듣는다는 것은 AI가 사람의 말을 \u003cb class=\"key\">인식\u003c/b>할 수 있다는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">and 병렬 구조(동사 병렬)\u003c/span> : [walk] and [play] : \"걷고 놀고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with (동반)\u003c/span> : [play] + [with + 명사구] : \"~와 놀다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">타동사 recognize + 목적어\u003c/span> : [recognize] + [praise (목적어)] : \"칭찬을 알아듣는다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They walk and play, 그들은 걷고 놀고. with their owners, 그들의 주인들과 함께. and recognize praise, 그리고 칭찬을 알아듣는다. 이 문장 전체를 해석하면, 그들은 주인과 함께 걷고 놀며 칭찬을 알아듣는다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 말한 진짜 강아지처럼 행동한다는 내용을 구체적으로 보여 줍니다. AI 반려동물은 주인과 함께 걷고 놀 수 있고, 칭찬도 알아들을 수 있다는 거죠. recognize praise는 칭찬을 알아듣는다는 뜻이에요. 사람의 말을 이해하는 AI의 능력이 드러나는 부분입니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 walk and play입니다. and가 두 동사를 병렬로 연결해서, 걷고 논다는 두 동작을 나란히 나열해 줍니다. 두 번째는 play with인데, with는 전치사라서 뒤에 주인들을 뜻하는 owners가 목적어로 옵니다. play with는 함께 놀다는 뜻의 덩어리 표현이에요. 세 번째는 recognize praise입니다. recognize는 타동사라서 뒤에 목적어 praise가 바로 오고, 칭찬을 알아듣는다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과거의 \u003cb class=\"key\">로봇\u003c/b>은 사람이 프로그래밍한 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">일\u003c/b>만 수행했다.\u003c/li>\u003cli>이제는 \u003cb class=\"key\">인공지능(AI)\u003c/b> 덕분에 로봇이 \u003cb class=\"key\">인간처럼 \u003c/b>\u003cb class=\"key\">생각\u003c/b>할 가능성이 열렸다.\u003c/li>\u003cli>AI를 가진 로봇은 환경을 인지하고 결정하며 \u003cb class=\"key\">말을 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하고 \u003cb class=\"key\">농담\u003c/b>과 게임도 한다.\u003c/li>\u003cli>\u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">스피커\u003c/b>와 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">반려동물\u003c/b>은 질문 응답, 기기 제어, 음악 재생, 걷기와 \u003cb class=\"key\">칭찬\u003c/b> 인식까지 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Robots are becoming smarter through artificial intelligence, and AI speakers and AI pets show human-like abilities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">로봇\u003c/b>은 과거에 단순 작업만 했지만 \u003cb class=\"key\">인공지능(AI)\u003c/b> 덕분에 점점 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">똑똑해\u003c/b>져 인간처럼 생각할 가능성이 생겼다. \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">스피커\u003c/b>와 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">반려동물\u003c/b>은 질문 응답, 기기 제어, 놀이, 칭찬 인식까지 가능하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"이번 지문은 로봇이 과거에는 단순한 일만 했지만 인공지능 덕분에 점점 인간처럼 생각하고 행동하게 된다는 내용이었어요. AI 스피커와 AI 반려동물 같은 예시를 통해 실제 생활 속에서 그 모습을 확인할 수 있었죠. 오늘 정리한 핵심 단어와 흐름을 복습해 보세요. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
