</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){

  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 7과 본문1","audioDir":"1_audio","preview":false,"count":24,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 7과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Where Do We See Robots?\u003c/h1>\u003ch2>우리는 어디에서 로봇을 보는가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>로봇은 더 이상 \u003cb class=\"key\">영화와 \u003c/b>\u003cb class=\"key\">책\u003c/b> 속에만 있지 않고, \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">곳곳\u003c/b>에서 \u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">팔\u003c/b>, \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b> 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 수행한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Robots now do a variety of tasks everywhere, from delivery robots in the sky and robot arms in factories to service robots in public places.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 중3 능률 7과 본문1입니다. 제목은 Where Do We See Robots? 즉 우리는 어디에서 로봇을 보는가?이고, 로봇이 더 이상 영화와 책 속에만 있지 않고 세계 곳곳에서 다양한 일을 한다는 내용입니다. 요지는 Robots now do a variety of tasks everywhere, from delivery robots in the sky and robot arms in factories to service robots in public places입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로봇 공학(Robotics)은 기계가 사람 대신 일을 하도록 만드는 기술입니다. 예전에는 로봇이 주로 \u003cb class=\"key\">영화와 \u003c/b>\u003cb class=\"key\">책\u003c/b> 속 상상의 존재였지만, 이제는 \u003cb class=\"key\">실생활\u003c/b> 깊숙이 들어와 있습니다. 배달 드론(delivery drone)은 하늘에서, 로봇 팔(robot arm)은 공장에서, 서비스 로봇(service robot)은 공공장소에서 각각 쓰입니다. 집에서 쓰는 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">청소기\u003c/b>처럼 우리 주변에서 이미 여러 로봇이 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 맡고 있습니다. 로봇은 사람이 하기 힘든 일이나 반복적인 일을 대신하며 산업과 생활을 바꾸고 있습니다.\u003c/div>","segs":[{"n":2,"text":"자, 배경지식을 먼저 볼게요. 로봇 공학, robotics는 기계가 사람 대신 일을 하도록 만드는 기술이에요. 예전에는 로봇이 주로 영화와 책 속 상상의 존재였지만, 이제는 실생활 깊숙이 들어와 있죠. 배달 드론 delivery drone은 하늘에서, 로봇 팔 robot arm은 공장에서, 서비스 로봇 service robot은 공공장소에서 쓰이고 있어요. 집에서 쓰는 로봇 청소기처럼 우리 주변에서 이미 여러 로봇이 다양한 일을 맡고 있잖아요. 로봇은 사람이 하기 힘든 일이나 반복적인 일을 대신하며 산업과 생활을 바꾸고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>로봇을 보는 곳\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 번째 문장인 Where Do We See Robots?는 독자에게 \u003cb class=\"key\">로봇\u003c/b>이 보이는 장소를 질문합니다. 이 질문은 로봇이 이미 우리 주변에 있다는 호기심을 불러일으킵니다. 글 전체의 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>영화·책에서 벗어나다\u003csmall>통념 반박 · 문장 2\u003c/small>\u003c/h4>\u003cp>두 번째 문장은 로봇이 더 이상 \u003cb class=\"key\">영화와 \u003c/b>\u003cb class=\"key\">책\u003c/b> 속에만 있지 않다고 말합니다. 이는 로봇에 대한 기존의 \u003cb class=\"key\">통념\u003c/b>을 깨는 표현입니다. not only ~ anymore가 \u003cb class=\"key\">한정된 \u003c/b>\u003cb class=\"key\">공간\u003c/b>에서 벗어났음을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>세계 곳곳의 다양한 일\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 로봇이 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">곳곳\u003c/b>에서 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 수행한다고 주장합니다. 이 문장이 글의 핵심 \u003cb class=\"key\">주장\u003c/b>입니다. Around the world와 a variety of tasks가 공간과 일의 범위를 확장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>하늘·공장·공공장소의 예\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>마지막 문장은 하늘의 \u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, 공장의 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">팔\u003c/b>, 공공장소의 \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>을 예로 듭니다. 평창 올림픽의 서비스 로봇 사례도 제시합니다. 이 예시들은 앞의 주장을 뒷받침합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 짚어 볼게요. 질문으로 시작해서 기존 생각을 깨고, 주장을 한 뒤, 구체적인 예시로 마무리하는 구조입니다.","hl":null},{"n":4,"text":"[object Object]","hl":"f0"},{"n":5,"text":"[object Object]","hl":"f1"},{"n":6,"text":"[object Object]","hl":"f2"},{"n":7,"text":"[object Object]","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장이 \u003cb class=\"key\">질문\u003c/b>을 던지고, 두 번째 문장은 기존 \u003cb class=\"key\">통념\u003c/b>을 반박합니다. 세 번째 문장에서 \u003cb class=\"key\">주제문\u003c/b>이 제시되고, 마지막 문장은 \u003cb class=\"key\">예시\u003c/b>를 듭니다. 핵심 주장이 글의 중간에 있으므로 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Where (1)\u003c/b>\u003cspan>질문 도입\u003c/span>\u003cb>not only ~ anymore (2)\u003c/b>\u003cspan>통념 반박\u003c/span>\u003cb>Around the world (3)\u003c/b>\u003cspan>공간 확장\u003c/span>\u003cb>There are (4)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">movies and books\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">around the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a variety of tasks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">delivery robots flying in the sky, robot arms in factories, service robots in public places\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>영화·책 속 로봇\u003c/th>\u003cth>실제 세계의 로봇\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가상의 존재\u003c/td>\u003ctd>실생활 속 존재\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한정된 공간\u003c/td>\u003ctd>세계 곳곳의 다양한 장소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문-답변 방식으로 전개돼요. 첫 문장이 질문을 던지고, 두 번째 문장은 기존 통념을 반박하며, 세 번째 문장에서 주제문이 나오고, 마지막에 예시가 붙는 중괄식 구조입니다. 중괄식은 주제문이 글 가운데 있는 구조를 말해요. 주제문은 세 번째 문장, Around the world, robots are doing a variety of tasks예요.","hl":"ty"},{"n":9,"text":"신호어를 보면, Where가 질문을 도입하고, not only anymore가 통념 반박을 나타내요. Around the world는 공간을 확장하고, There are는 예시를 이끄는 신호입니다. movies and books가 delivery robots, robot arms, service robots로 재진술되면서 개념이 구체화돼요. 대조는 영화·책 속 로봇과 실제 세계의 로봇 사이에서 나타납니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Where\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어디에\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>robot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>not only\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~뿐만 아니라\u003c/span>\u003c/div>\u003cdiv>\u003cb>in\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>movie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영화\u003c/span>\u003c/div>\u003cdiv>\u003cb>book\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세계 곳곳에\u003c/span>\u003c/div>\u003cdiv>\u003cb>a variety of tasks\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다양한 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>variety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다양성, 여러 가지\u003c/span>\u003c/div>\u003cdiv>\u003cb>do\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하다, 수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일, 과업\u003c/span>\u003c/div>\u003cdiv>\u003cb>There are\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delivery robot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배달 로봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>fly\u003c/b>\u003cem>동사\u003c/em>\u003cspan>날다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>robot arm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로봇 팔\u003c/span>\u003c/div>\u003cdiv>\u003cb>factory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공장\u003c/span>\u003c/div>\u003cdiv>\u003cb>service robot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서비스 로봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>public\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공공의\u003c/span>\u003c/div>\u003cdiv>\u003cb>in public places\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공공장소에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the PyeongChang Olympics\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>평창 올림픽에서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚을게요. not only는뿐만 아니라, anymore는 더 이상, around the world는 세계 곳곳에, a variety of tasks는 다양한 일이라는 뜻이에요. delivery robot은 배달 로봇, robot arm은 로봇 팔, service robot은 서비스 로봇이죠. 문장에서 그대로 해석해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">robot\u003c/b>\u003cspan class=\"m\">로봇\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">machine\u003c/span>\u003cspan class=\"s\">automaton\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">human\u003c/span>\u003cspan class=\"a\">person\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">variety\u003c/b>\u003cspan class=\"m\">다양성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diversity\u003c/span>\u003cspan class=\"s\">range\u003c/span>\u003cspan class=\"s\">assortment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniformity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">task\u003c/b>\u003cspan class=\"m\">일, 과업\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">job\u003c/span>\u003cspan class=\"s\">work\u003c/span>\u003cspan class=\"s\">duty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leisure\u003c/span>\u003cspan class=\"a\">rest\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">public\u003c/b>\u003cspan class=\"m\">공공의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">open\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">private\u003c/span>\u003cspan class=\"a\">personal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">service\u003c/b>\u003cspan class=\"m\">서비스, 봉사\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assistance\u003c/span>\u003cspan class=\"s\">help\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disservice\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fly\u003c/b>\u003cspan class=\"m\">날다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">soar\u003c/span>\u003cspan class=\"s\">glide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">land\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리할게요. robot은 machine, automaton과 비슷하고 human과는 반대예요. variety는 diversity, range와 비슷하고 uniformity, sameness와 반대예요. task는 job, work와 비슷하고 leisure와는 거리가 멀어요. public은 common, shared와 비슷하고 private, personal과 반대예요. service는 assistance, help와 비슷하고 disservice와 반대고요. fly는 soar, glide와 비슷하고 land와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 보는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">See \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Robots?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 어디에서 로봇을 보는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 제목이자 \u003cb class=\"key\">의문문\u003c/b>으로, 로봇을 어디에서 볼 수 있는지 묻는 질문이에요. 독자의 호기심을 불러일으키고 앞으로 나올 내용을 \u003cb class=\"key\">안내\u003c/b>하는 역할을 해요. where를 통해 장소에 초점을 맞추고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 의문문과 do-support\u003c/span> : Where [의문사] + Do [조동사] + We [주어] + See [동사원형] + Robots [목적어]? : \"우리는 어디에서 로봇을 보는가?\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Where, 어디에서. Do We See, 우리는 보는가. Robots?, 로봇을?. 이 문장 전체를 해석하면, 우리는 어디에서 로봇을 보는가?","hl":"m"},{"n":13,"text":"이 문장은 이 글의 제목이에요. 로봇을 어디에서 볼 수 있는지 묻는 질문이죠. 이 질문이 앞으로 나올 내용을 안내하는 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째 문장은 의문사 Where가 문장 맨 앞에 온 의문문이에요. 일반동사 see를 사용한 의문문이라서 조동사 Do가 주어 We 앞에 왔어요. 이렇게 do를 써서 의문문을 만드는 걸 do support라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇은\u003c/span>\u003cspan class=\"en\">Robots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 ~만은 아니다\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화와 책 속에만\u003c/span>\u003cspan class=\"en\">in movies and books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">로봇은 더 이상 영화와 책 속에만 있지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로봇이 더 이상 영화와 책 속에만 존재하지 않는다는 뜻으로, \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">only \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">anymore\u003c/b> 표현을 통해 과거와 달라진 상황을 보여줘요. 문장의 흐름에서 로봇의 등장 범위가 넓어졌음을 \u003cb class=\"key\">반전\u003c/b>시키는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">not only A (but also B) 표현\u003c/span> : not only + [명사구] (but also ...) : \"단지 ~만 있는 것이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에 쓰이는 부사 anymore\u003c/span> : not ~ anymore : \"더 이상\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Robots, 로봇은. are not only, 단지 ~만은 아니다. in movies and books, 영화와 책 속에만. anymore, 더 이상.. 이 문장 전체를 해석하면, 로봇은 더 이상 영화와 책 속에만 있지 않다.","hl":"m"},{"n":16,"text":"이 문장은 로봇이 예전에는 영화나 책에서만 등장했지만, 이제는 그렇지 않다는 뜻이에요. not only와 anymore가 함께 쓰여 영화와 책에만 있다는 생각을 반전시켜요. 앞으로 로봇이 다른 곳에서도 많이 쓰인다는 암시를 줘요.","hl":"mn"},{"n":17,"text":"이 문장에서 not only는 뒤에 나오는 in movies and books를 수식해요. 부정문에 쓰인 anymore는 더 이상 이라는 뜻으로, 과거와 달라진 상황을 강조해요. 시험에서는 not only가 나오면 but also가 함께 오는지 확인하는 문제가 자주 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 곳곳에서\u003c/span>\u003cspan class=\"en\">Around the world,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇은\u003c/span>\u003cspan class=\"en\">robots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수행하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">doing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 일을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">variety \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">tasks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세계 곳곳에서 로봇은 다양한 일을 수행하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로, 세계 곳곳에서 로봇이 다양한 일을 수행하고 있다는 주제를 명확히 제시해요. 앞 문장의 일반적인 진술을 구체화하고, 이어지는 예시 \u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">로봇, \u003c/b>\u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">팔, \u003c/b>\u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>을 이끌어 내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사(are) + 동사원형-ing(doing) : \"수행하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">a variety of + 복수명사\u003c/span> : a variety of + [복수명사] : \"다양한 일\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Around the world, 세계 곳곳에서. robots, 로봇은. are doing, 수행하고 있다. a variety of tasks, 다양한 일을.. 이 문장 전체를 해석하면, 세계 곳곳에서 로봇은 다양한 일을 수행하고 있다.","hl":"m"},{"n":19,"text":"이 문장은 이 글의 핵심 내용이에요. 세계 여러 곳에서 로봇들이 다양한 임무를 수행하고 있다고 말하고 있죠. 다음 문장에서 배달 로봇, 로봇 팔, 서비스 로봇이라는 구체적인 예가 이어져요.","hl":"mn"},{"n":20,"text":"이 문장에는 현재진행형 are doing이 쓰였어요. be동사와 동사 원형에 ing를 붙여 지금 진행 중인 일을 나타내요. 또 a variety of는 뒤에 복수명사 tasks를 데리고 다양한 이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘을 날고 있는 배달 로봇이 있고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">delivery \u003c/span>\u003cspan class=\"tgt\">robots\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flying \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공장에는 로봇 팔이 있고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">robot \u003c/span>\u003cspan class=\"tgt\">arms \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">factories, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 공공장소에는 서비스 로봇이 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">service \u003c/span>\u003cspan class=\"tgt\">robots \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">public \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>. - A delivery robot in the sky - Robot arms in a factory - A service robot at the PyeongChang Olympics\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하늘에는 날아다니는 배달 로봇이, 공장에는 로봇 팔이, 그리고 공공장소에는 서비스 로봇이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로봇이 실제로 어디에서 일하는지 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 든다. 앞 문장의 'a variety of tasks'를 하늘·공장·공공장소로 나누어 보여 주는 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>이며, 로봇이 일상 곳곳에 있다는 흐름을 이어 간다. 'flying in the sky'는 delivery robots를 뒤에서 꾸며 주는 \u003cb class=\"key\">현재분사구\u003c/b>이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 There is/are 구문\u003c/span> : There are + 복수명사 (진짜 주어) : \"배달 로봇들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 후치수식 (분사구)\u003c/span> : 명사 + 현재분사구 (~ing ...) : \"하늘을 날고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : A, B, and C : \"공장의 로봇 팔, 그리고 공공장소의 서비스 로봇\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"There are delivery robots flying in the sky, 하늘을 날고 있는 배달 로봇이 있고. robot arms in factories, 공장에는 로봇 팔이 있고. and service robots in public places, 그리고 공공장소에는 서비스 로봇이 있다.. 이 문장 전체를 해석하면, 하늘에는 날아다니는 배달 로봇이, 공장에는 로봇 팔이, 그리고 공공장소에는 서비스 로봇이 있다.","hl":"m"},{"n":22,"text":"이 문장은 로봇이 활동하는 장소를 하늘, 공장, 공공장소로 나누어 구체적인 예를 드는 부분이에요. 앞 문장에서 말했던 다양한 일이라는 표현을 이 세 장면으로 보여 주면서 로봇이 실제로 우리 주변 곳곳에 있다는 걸 강조해요. flying in the sky는 배달 로봇을 뒤에서 꾸며 주는 현재분사구라서 로봇이 하늘을 나는 능동적인 모습을 나타내요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 There are delivery robots에 쓰인 존재 구문이에요. There은 유도부사라 뜻을 해석하지 않고, 진짜 주어가 복수 명사 delivery robots이라서 be동사 are를 쓴 거예요. 두 번째 포인트는 flying in the sky라는 현재분사구예요. 명사 delivery robots를 뒤에서 꾸며 주며 로봇이 능동적으로 나는 의미라서 flying을 쓴 거예요. 세 번째 포인트는 병렬 구조인데요, delivery robots flying in the sky와 robot arms in factories와 service robots in public places가 and로 묶였어요. 이때 공통된 There are는 생략되어 뒤에서도 반복되지 않아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>로봇은 더 이상 \u003cb class=\"key\">영화와 \u003c/b>\u003cb class=\"key\">책\u003c/b> 속에만 있지 않다.\u003c/li>\u003cli>로봇은 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">곳곳\u003c/b>에서 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 수행한다.\u003c/li>\u003cli>하늘에는 \u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, 공장에는 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">팔\u003c/b>, 공공장소에는 \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>이 있다.\u003c/li>\u003cli>평창 올림픽에서도 \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>이 활용되었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Robots now do a variety of tasks everywhere, from delivery robots in the sky and robot arms in factories to service robots in public places.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">로봇은 더 이상 \u003cb class=\"key\">영화와 \u003c/b>\u003cb class=\"key\">책\u003c/b> 속에만 있지 않고, \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">곳곳\u003c/b>에서 \u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">팔\u003c/b>, \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">로봇\u003c/b> 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 수행한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"오늘 지문은 로봇이 더 이상 영화와 책 속에만 있지 않고 세계 곳곳에서 배달 로봇, 로봇 팔, 서비스 로봇 등 다양한 일을 하고 있다는 내용이었습니다. 질문으로 시작해서 주장과 예시로 이어지는 중괄식 구조를 기억해 두세요. 다음 시간에도 중요한 표현을 꼼꼼히 정리해 봅시다. 수고했어요.","hl":null}]}]});</script></body></html>
