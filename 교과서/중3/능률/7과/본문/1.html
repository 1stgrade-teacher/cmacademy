ec-cover-title\">Robots: Moving from Fiction to Our Daily Lives<small>로봇: 공상 속에서 일상으로의 이동</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 이제 로봇은 영화 속 상상 속의 존재를 넘어 우리 일상 곳곳에 깊숙이 자리 잡고 있어요. 이런 현상을 로봇 공학(Robotics)의 발전이라고 하는데, 이는 기계를 설계하고 제작하여 인간을 대신하거나 보조하는 모든 기술을 말하죠. 특히 최근에는 인공지능(Artificial Intelligence)과 결합한 로봇들이 단순히 정해진 동작만 하는 것이 아니라, 복잡한 상황을 스스로 판단하며 일하는 수준까지 도달했어요. 예를 들어, 식당에서 음식을 나르는 서빙 로봇이나 하늘을 나는 배달 드론은 이제 우리에게 낯설지 않은 모습이 되었답니다. 이처럼 로봇이 자동화(Automation)를 통해 생산성을 높이고 삶을 편리하게 만드는 과정이 우리 사회를 어떻게 변화시키고 있는지 지문을 통해 함께 살펴봐요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01로봇의 일상화</div><ul><li>로봇은 더 이상 영화나 책 속에만 존재하는 것이 아니라 현실 속에서 우리와 함께하고 있습니다.</li><li>로봇의 활동 범위 확대 (variety of tasks)</li><li>더 이상 상상 속의 존재가 아님 (not only in movies and books)</li><li>핵심 키워드: 로봇(robots)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02다양한 로봇의 활용</div><ul><li>전 세계 곳곳에서 로봇은 각기 다른 목적과 장소에서 다양한 역할을 수행하고 있습니다.</li><li>하늘을 날며 배달을 수행하는 배달 로봇 (delivery robots)</li><li>공장에서 작업을 돕는 로봇 팔 (robot arms)</li><li>공공장소에서 서비스를 제공하는 서비스 로봇 (service robots)</li><li>핵심 키워드: 활용(tasks)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03구체적인 사례</div><ul><li>로봇은 실제로 우리 주변의 산업 현장과 공공 행사 등에서 활발하게 사용됩니다.</li><li>공장 생산 라인의 로봇 팔</li><li>평창 올림픽 당시의 서비스 로봇</li><li>하늘의 배달 로봇</li><li>핵심 키워드: 사례(examples)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety</td><td class=\"m\">여러 가지, 각양각색</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr><tr><td class=\"w\">delivery</td><td class=\"m\">배달</td></tr><tr><td class=\"w\">factory</td><td class=\"m\">공장</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스, 봉사</td></tr><tr><td class=\"w\">public</td><td class=\"m\">공공의, 일반 대중의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로봇은</span><span class=\"en\"><b>Robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있지 않은데</span><span class=\"en\"><b>are <span class=\"grammar-hl\">not only</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화와 책 속에만</span><span class=\"en\"><b>in movies and books</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상 있지 않다.</span><span class=\"en\"><b>anymore.</b></span></div></div><div class=\"lec-sent-ko\">로봇은 더 이상 영화와 책 속에만 있지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇이 과거에는 상상 속의 존재였다면, 이제는 현실 세계의 일부가 되었음을 알리며 글의 주제를 던지고 있습니다. &#39;anymore&#39;를 사용하여 이전과 현재의 상황이 달라졌음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only (관용표현): &#39;not only A (but also B)&#39; 구문에서 B가 생략된 형태로, &#39;~뿐만 아니라&#39;라는 의미를 담은 부사적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세계 곳곳에서</span><span class=\"en\"><b>Around the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇은</span><span class=\"en\"><b>robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수행하고</span><span class=\"en\"><b><span class=\"grammar-hl\">are doing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 일을 수행하고 있다.</span><span class=\"en\"><b>a variety of tasks.</b></span></div></div><div class=\"lec-sent-ko\">세계 곳곳에서 로봇은 다양한 일을 수행하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;로봇의 현실화&#39;에 대한 구체적인 근거를 제시합니다. &#39;a variety of&#39;는 &#39;여러 가지의&#39;라는 뜻으로, 로봇의 활용 범위가 매우 넓어졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are doing (현재진행): be동사(are) + -ing(doing) 구조로, 현재 어떤 동작이 진행 중임을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety</td><td class=\"m\">여러 가지, 각양각색</td></tr><tr><td class=\"w\">task</td><td class=\"m\">일, 과업</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배달 로봇이</span><span class=\"en\"><b>delivery robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에는 날아다니는</span><span class=\"en\"><b><span class=\"grammar-hl\">flying in the sky</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇 팔이</span><span class=\"en\"><b>robot arms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공장에는</span><span class=\"en\"><b>in factories,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 서비스 로봇이</span><span class=\"en\"><b>and service robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공공장소에는 있다.</span><span class=\"en\"><b>in public places.</b></span></div></div><div class=\"lec-sent-ko\">하늘에는 날아다니는 배달 로봇이, 공장에는 로봇 팔이, 그리고 공공장소에는 서비스 로봇이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇이 실제로 사용되는 구체적인 예시들을 열거합니다. 앞에서 언급한 &#39;다양한 업무(a variety of tasks)&#39;가 무엇인지 독자가 쉽게 이해할 수 있도록 시각적인 이미지를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flying in the sky (현재분사(형용사)): flying이 앞의 명사 delivery robots를 수식합니다. &#39;하늘을 날고 있는 배달 로봇&#39;이라는 의미로, 명사가 동작을 수행하는 능동적 상태를 나타냅니다.</div><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문두에 오면서 &#39;주어(robots)+동사(are)&#39;의 순서가 &#39;동사(are)+주어(robots)&#39;로 도치된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delivery</td><td class=\"m\">배달</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스, 봉사</td></tr><tr><td class=\"w\">public</td><td class=\"m\">공공의, 일반 대중의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>로봇은 이제 공상 과학 속 이야기가 아니라 우리 현실의 일부가 되었다.</li><li>전 세계적으로 로봇은 매우 다양한 분야에서 활동하고 있다.</li><li>하늘을 나는 배달용, 공장의 제조용, 공공장소의 서비스용 등 로봇의 활용처가 매우 넓다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Robots have moved beyond movies and books, and they are now actively performing various roles in our modern society.</div>\n              <div class=\"lec-final-sum-ko\">로봇은 영화나 책 속의 존재를 넘어섰고, 이제 현대 사회에서 다양한 역할을 활발히 수행하고 있다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=
