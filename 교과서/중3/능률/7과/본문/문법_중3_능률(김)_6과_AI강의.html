  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"문법1","title":"중3 능률(김) 6과 문법1 the 비교급","audioDir":"문법_중3_능률(김)_6과_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중3 능률(김) 6과\u003c/div>\u003ch1>the 비교급, the 비교급 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>the+비교급을 사용해서 하면 할수록 점점 더 ~하다는 의미를 표현할 수 있어요\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘 영문법 수업을 시작할게요. 중학교 삼학년 능률 김 육과에서 아주 중요하게 다루는 표현을 배울 거예요. 바로 이전에 배운 비교급을 응용해서 아주 유용한 문장을 만들어 볼 거랍니다. 오늘 수업을 끝까지 잘 들으면 여러분도 완벽하게 이해할 수 있을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">the 비교급, the 비교급의 기본 형태와 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">the+비교급\u003c/b>, \u003cb class=\"key\">the+비교급\u003c/b>의 형태를 사용하여 \u003cb class=\"key\">하면 할수록 더욱더 ~하다\u003c/b>는 의미를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The longer\u003c/span> he ran, the more tired he became.\u003c/div>\u003cdiv class=\"g-ko\">그가 더 오래 달릴수록, 그는 더 피곤해졌다.\u003c/div>\u003cdiv class=\"g-note\">오래 달릴수록 피곤해진다는 비례 관계를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The older\u003c/span> you get, the wiser you will be.\u003c/div>\u003cdiv class=\"g-ko\">네가 나이가 더 들수록, 너는 더 현명해질 것이다.\u003c/div>\u003cdiv class=\"g-note\">나이가 듦에 따라 지혜가 늘어난다는 의미입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비교급 뒤에 오는 \u003cb class=\"key\">주어와 동사\u003c/b>는 상황에 따라 생략될 수 있어요.\u003c/div>","segs":[{"n":2,"text":"오늘 배울 핵심 문법은 the 비교급 the 비교급 구문이에요. 이 형태는 앞 문장도 비교급을 쓰고 뒷 문장도 비교급을 쓰는 아주 독특한 구조랍니다. 의미는 하면 할수록 더욱더 ~하다라는 뜻을 가지게 되죠.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 같이 볼게요. The longer he ran, the more tired he became. 라고 했어요. 그가 더 오래 달릴수록, 그는 더 피곤해졌다라는 뜻이에요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. The older you get, the wiser you will be. 이라고 읽어요. 네가 나이가 더 들수록, 너는 더 현명해질 것이다라는 의미랍니다.","hl":"ex-1"},{"n":5,"text":"여기서 한 가지 팁을 주자면 문맥이 명확할 때 주어와 동사 같은 부분은 종종 생략되기도 한다는 점을 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">크기와 가격의 비례 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사를 수식하는 형용사나 부사의 비교급도 \u003cb class=\"key\">the+비교급\u003c/b> 맨앞에 올 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">the + 비교급 명사 + 주어 + 동사, the + 비교급 명사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The bigger the size is\u003c/span>, the higher the price gets.\u003c/div>\u003cdiv class=\"g-ko\">크기가 더 클수록, 가격이 더 높아진다.\u003c/div>\u003cdiv class=\"g-note\">크기와 가격의 비례 관계를 보여줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비교급을 만들 때 단음절 단어는 뒤에 \u003cb class=\"key\">er\u003c/b>를 붙이고, 긴 단어는 앞에 \u003cb class=\"key\">more\u003c/b>를 붙여요.\u003c/div>","segs":[{"n":6,"text":"이번에는 크기나 가격처럼 명사와 함께 쓰이는 비교급을 살펴볼게요. 형용사나 부사가 명사를 꾸며줄 때도 비교급을 문장 맨 앞으로 데리고 와서 똑같이 만들어 줄 수 있어요.","hl":"rule"},{"n":7,"text":"세 번째 예문을 들어볼까요. The bigger the size is, the higher the price gets. 라고 해요. 크기가 더 클수록, 가격이 더 높아진다는 뜻이에요.","hl":"ex-0"},{"n":8,"text":"비교급을 만드는 기본 규칙을 잊지 않았죠. 짧은 단어는 er을 붙이고 긴 단어는 more를 붙인다는 것을 항상 염두에 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">연습과 실수 줄이기의 관계\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">더 많이 연습할수록 실수가 줄어든다는 표현처럼 \u003cb class=\"key\">부사의 비교급\u003c/b>도 자유롭게 쓸 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">the + more/less/fewer + 주어 + 동사, the + more/less/fewer + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The more you practice\u003c/span>, the fewer mistakes you will make.\u003c/div>\u003cdiv class=\"g-ko\">네가 더 많이 연습할수록, 너는 더 적은 실수를 하게 될 것이다.\u003c/div>\u003cdiv class=\"g-note\">연습량과 실수량의 반비례 관계를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>셀 수 없는 명사 앞에는 less를 쓰고 셀 수 있는 명사 복수형 앞에는 \u003cb class=\"key\">fewer\u003c/b>를 써야 해요.\u003c/div>","segs":[{"n":9,"text":"마지막 예문에서는 우리가 일상에서 자주 쓰는 연습과 실수라는 표현을 다뤄볼 거예요. 부사의 비교급을 사용해서 행동의 변화가 결과에 미치는 영향을 멋지게 나타낼 수 있답니다.","hl":"rule"},{"n":10,"text":"네 번째 예문을 살펴볼게요. The more you practice, the fewer mistakes you will make. 라는 문장이에요. 네가 더 많이 연습할수록, 너는 더 적은 실수를 하게 될 것이라는 멋진 표현이죠.","hl":"ex-0"},{"n":11,"text":"여기서 아주 중요한 주의점이 있어요. 실수는 셀 수 있는 명사라서 less가 아니라 fewer를 썼다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The more you study hard, the you will get smart.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The harder you study, the smarter you will get.\u003c/div>\u003cdiv class=\"g-why\">비교급을 만들 때 단어 자체에 er을 붙이거나 more를 붙여서 the 바로 뒤에 위치시켜야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The tall he is, the smart he is.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The taller he is, the smarter he is.\u003c/div>\u003cdiv class=\"g-why\">tall과 smart는 원급이므로 각각 비교급인 taller와 smarter로 바꿔야 합니다.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"학생들이 자주 하는 실수예요. the 뒤에 바로 비교급이 와야 하는데 순서를 헷갈리거나 비교급 형태를 틀리는 경우가 많아요. 올바른 형태인 the harder you study, the smarter you will get으로 써야 맞아요.","hl":"mk-0"},{"n":13,"text":"두 번째로 흔히 하는 실수는 비교급이 아닌 원급을 그대로 쓰는 것이에요. tall이나 smart는 원급이니까 반드시 비교급 형태로 고쳐서 써야 한답니다.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u0
