</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 능률 7과 본문3","audioDir":"3_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>능률 7과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Robots around Us - Present and Future\u003c/h1>\u003ch2>우리 주변의 로봇 - 현재와 미래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>로봇은 일을 더 빠르고 더 쉽게 만들어 주며 \u003cb class=\"key\">가정\u003c/b>, \u003cb class=\"key\">도로\u003c/b>, \u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b> 등 어디에서나 우리를 돕는다. \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행차\u003c/b>, \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">군집\u003c/b>이 각각 가사, 주행, 집단 작업에서 활용된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Robots help us anywhere, including homes, roads, and disaster areas, through home helper robots, self-driving cars, and robot swarms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중3 능률 7과 본문, Robots around Us - Present and Future를 함께 공부해요. 이 글은 로봇이 우리 삶을 어떻게 더 빠르고 쉽게 만들어 주는지 소개하고, 가정 도우미 로봇, 자율 주행차, 로봇 군집의 세 가지 사례를 보여 줘요. 핵심 요지는 로봇이 가정과 도로와 재난 지역처럼 우리 주변 어디에서나 도움을 준다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로봇은 단순한 기계를 넘어 \u003cb class=\"key\">인공지능\u003c/b>과 \u003cb class=\"key\">센서\u003c/b> 기술을 갖추고 인간의 일을 대신한다. 자동화(automation)가 진행되면서 가정에서는 \u003cb class=\"key\">Home \u003c/b>\u003cb class=\"key\">Helper \u003c/b>\u003cb class=\"key\">Robot\u003c/b>이 요리와 청소를 돕고, 도로에서는 \u003cb class=\"key\">Self-Driving \u003c/b>\u003cb class=\"key\">Car\u003c/b>가 운전자 없이 주행한다. 자율 주행차는 카메라(camera), 센서(sensor), 소프트웨어(software)로 길을 찾으며, 이는 사람이 직접 운전하지 않는 무인 자동차(autonomous vehicle) 기술이다. 여러 대가 함께 움직이는 \u003cb class=\"key\">Robot \u003c/b>\u003cb class=\"key\">Swarm\u003c/b>은 벌이나 개미처럼 집단 지능(swarm intelligence)으로 문제를 해결한다. 마치 개미 한 마리는 약하지만 개미 떼가 먹이를 나르는 것처럼, 로봇 군집도 협력하여 큰 작업을 수행한다. 이런 로봇들은 가정과 농장, 건설 현장 같은 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">장소\u003c/b>에서 효율을 높인다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 살펴볼게요. 로봇은 단순한 기계가 아니라 인공지능과 센서 기술을 갖추고 인간의 일을 대신해요. 자동화 automation이 진행되면서 가정에서는 Home Helper Robot이 요리와 청소를 돕고, 도로에서는 Self-Driving Car가 운전자 없이 주행하죠. 자율 주행차는 camera와 sensor와 software로 길을 찾아가는데, 이런 기술을 autonomous vehicle이라고 해요. 여러 대가 함께 움직이는 Robot Swarm은 벌이나 개미처럼 swarm intelligence로 문제를 해결해요. 개미 한 마리는 약하지만 개미 떼가 먹이를 나르는 것처럼 로봇 군집도 협력해서 큰 작업을 수행해요. 이런 로봇들은 가정과 농장과 건설 현장 같은 다양한 장소에서 효율을 높이고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>로봇의 일반적 이점\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>로봇은 \u003cb class=\"key\">일을 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">빠르고 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">쉽게\u003c/b> 만들어 준다. 이 로봇들은 \u003cb class=\"key\">가정\u003c/b>, \u003cb class=\"key\">도로\u003c/b>, \u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b> 등 어디에서나 우리를 도울 수 있다. 즉, 로봇의 활용 범위가 넓음을 먼저 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가정 도우미 로봇\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>은 온종일 가족을 돕는다. 요리와 청소가 더 쉬워지고, \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">구성원\u003c/b>과 대화하며 \u003cb class=\"key\">감정\u003c/b>도 감지한다. 집 안에서 인간을 돕는 구체적 사례다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자율 주행차\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행차\u003c/b>는 운전자가 필요 없다. \u003cb class=\"key\">카메라\u003c/b>, \u003cb class=\"key\">감지기\u003c/b>, \u003cb class=\"key\">소프트웨어\u003c/b>로 길을 찾아가므로 사람은 쉬면서 주행을 즐길 수 있다. 이동 수단에서의 로봇 활용을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>로봇 군집\u003csmall>예시 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">군집\u003c/b>은 개미나 벌처럼 \u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>하는 대규모 로봇 집단이다. \u003cb class=\"key\">농장\u003c/b>이나 \u003cb class=\"key\">건설 \u003c/b>\u003cb class=\"key\">현장\u003c/b> 등 다양한 장소에서 쓰이며, 집단으로 \u003cb class=\"key\">임무\u003c/b>에 착수하고 \u003cb class=\"key\">해결책\u003c/b>을 찾는다. 협력하는 로봇의 사례를 제시한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 살펴볼게요. 이 글은 로봇의 일반적 이점을 먼저 말하고 세 가지 로봇을 차례대로 예로 들어 설명하는 구조예요.","hl":null},{"n":4,"text":"첫 번째 흐름은 도입이에요. 로봇은 일을 더 빠르고 더 쉽게 만들어 주고, 우리 집과 도로, 재난 지역처럼 어디에서나 우리를 도울 수 있다고 해요. 그래서 로봇의 활용 범위가 넓다는 큰 그림을 먼저 제시해요.","hl":"f0"},{"n":5,"text":"두 번째 흐름은 가정 도우미 로봇이에요. 이 로봇은 온종일 가족을 돕고, 요리와 청소를 더 쉽게 해 줘요. 가족 구성원과 이야기를 나누고 감정까지 감지할 수 있다고 해요. 집 안에서 인간을 돕는 구체적인 사례예요.","hl":"f1"},{"n":6,"text":"세 번째 흐름은 자율 주행차예요. 자율 주행차는 운전자가 필요 없고, 카메라와 감지기와 소프트웨어를 이용해서 길을 찾아가요. 그래서 사람은 쉬면서 주행을 즐길 수 있어요. 이동 수단에서 로봇 기술이 쓰이는 사례를 보여 줘요.","hl":"f2"},{"n":7,"text":"네 번째 흐름은 로봇 군집이에요. 로봇 군집은 개미나 벌처럼 서로 의사소통하는 대규모 로봇 집단을 말해요. 농장이나 건설 현장 같은 다양한 장소에서 쓰이고, 집단으로 임무를 수행하고 해결책도 찾아요. 협력하는 로봇의 사례를 보여 줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 로봇이 \u003cb class=\"key\">일을 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">빠르고 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">쉽게\u003c/b> 만들어 준다는 핵심 주장을 제시한 뒤, \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행차\u003c/b>, \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">군집\u003c/b>을 차례로 분류하여 설명한다. 따라서 이 글은 전체 주제를 먼저 제시하는 \u003cb class=\"key\">두괄식\u003c/b> 구조이다. 세 가지 로봇 사례가 각각 한 단락씩 나뉘어 제시되므로 \u003cb class=\"key\">분류\u003c/b> 전개 방식으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Robots (1)\u003c/b>\u003cspan>주제 제시\u003c/span>\u003cb>They (2)\u003c/b>\u003cspan>앞 문장의 Robots 재진술\u003c/span>\u003cb>Home Helper Robot (3)\u003c/b>\u003cspan>첫 번째 분류 항목\u003c/span>\u003cb>Self-Driving Car (6)\u003c/b>\u003cspan>두 번째 분류 항목\u003c/span>\u003cb>Robot Swarm (8)\u003c/b>\u003cspan>세 번째 분류 항목\u003c/span>\u003cb>They (9)\u003c/b>\u003cspan>Robot Swarm 재진술\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Robots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Home Helper Robot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This robot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">It\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Self-Driving Car\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Robot Swarm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 분류이고, 구조는 두괄식이에요. 첫 문장에서 로봇이 일을 더 빠르고 쉽게 만들어 준다는 핵심 주장을 먼저 제시하고, 뒤에서 가정 도우미 로봇, 자율 주행차, 로봇 군집을 차례로 분류해서 설명해요. 주제문은 첫 번째 문장이에요. 그래서 앞부분만 읽어도 글의 중심 내용을 잡을 수 있어요.","hl":"ty"},{"n":9,"text":"신호어와 재진술을 살펴볼게요. 첫 문장의 Robots는 이 글의 주제를 제시하고, 두 번째 문장의 They는 Robots를 다시 가리키며 자연스럽게 연결해요. Home Helper Robot, Self-Driving Car, Robot Swarm은 각각 세 가지 로봇을 분류하는 표지 역할을 해요. 뒤에 나오는 This robot, It, They 같은 대명사들은 앞서 나온 로봇을 반복해서 가리키는 재진술 표현이에요. 이렇게 주제어와 대명사를 따라가면 글의 구조가 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>robot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anywhere\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어디에서나\u003c/span>\u003c/div>\u003cdiv>\u003cb>home\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가정, 집\u003c/span>\u003c/div>\u003cdiv>\u003cb>road\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도로\u003c/span>\u003c/div>\u003cdiv>\u003cb>disaster area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재난 지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>helper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도우미\u003c/span>\u003c/div>\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>cook\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>청소하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-driving car\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자율 주행차\u003c/span>\u003c/div>\u003cdiv>\u003cb>driver\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감지기, 센서\u003c/span>\u003c/div>\u003cdiv>\u003cb>software\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소프트웨어\u003c/span>\u003c/div>\u003cdiv>\u003cb>navigate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>길을 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relax\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쉬다, 편안히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swarm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군집, 떼\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개미\u003c/span>\u003c/div>\u003cdiv>\u003cb>bee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌\u003c/span>\u003c/div>\u003cdiv>\u003cb>farm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농장\u003c/span>\u003c/div>\u003cdiv>\u003cb>building site\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건설 현장\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임무, 과제\u003c/span>\u003c/div>\u003cdiv>\u003cb>solution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해결책\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 정리할게요. disaster area는 재난 지역, throughout는 하루 내내처럼 시간 전체를 나타내는 표현이에요. sense는 감지하다, navigate는 길을 찾다, swarm은 무리나 군집이라는 뜻이에요. 이 어휘들은 시험에 자주 나오니까 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">obstruct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">rapid\u003c/span>\u003cspan class=\"s\">speedy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">effortless\u003c/span>\u003cspan class=\"s\">manageable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003cspan class=\"a\">tough\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sense\u003c/b>\u003cspan class=\"m\">감지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">communicate\u003c/b>\u003cspan class=\"m\">의사소통하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interact\u003c/span>\u003cspan class=\"s\">exchange\u003c/span>\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solution\u003c/b>\u003cspan class=\"m\">해결책\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">answer\u003c/span>\u003cspan class=\"s\">resolution\u003c/span>\u003cspan class=\"s\">remedy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">problem\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 같이 볼게요. help는 assist나 aid와 바꿔 쓸 수 있고 반대는 hinder예요. fast는 quick이나 rapid와 비슷하고 slow와 반대예요. easy는 simple이나 effortless와 비슷하고 difficult나 hard와 반대예요. sense는 detect나 perceive와 연결되고, communicate는 interact나 exchange와 연결돼요. solution은 answer나 resolution과 바꿔 쓸 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 주변의 로봇 - 현재와 미래\u003c/span>\u003cspan class=\"en\">Robots around Us - Present and Future\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇은 일을 더 빠르고 더 쉽게 만들어 주고 있다.\u003c/span>\u003cspan class=\"en\">Robots \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">making\u003c/span> things \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">faster \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">easier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 주변의 로봇 - 현재와 미래 로봇은 일을 더 빠르고 더 쉽게 만들어 주고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로봇에 대한 글의 첫머리로, 로봇이 \u003cb class=\"key\">현재\u003c/b>와 \u003cb class=\"key\">미래\u003c/b>에 걸쳐 우리 생활을 바꾸고 있음을 제시한다. 'make things faster and easier'는 \u003cb class=\"key\">5형식 \u003c/b>\u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">구조\u003c/b>로, '일을 더 빠르고 더 쉽게 만든다'는 뜻이다. 로봇이 인간의 일을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">효율적으로\u003c/b> 만들어 준다는 핵심 내용을 미리 요약한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + 동사원형-ing : \"만들고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 병렬\u003c/span> : 비교급 + and + 비교급 : \"더 빠르고 더 쉽게\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Robots around Us - Present and Future, 우리 주변의 로봇 - 현재와 미래. Robots are making things faster and easier, 로봇은 일을 더 빠르고 더 쉽게 만들어 주고 있다.. 이 문장 전체를 해석하면, 우리 주변의 로봇 - 현재와 미래 로봇은 일을 더 빠르고 더 쉽게 만들어 주고 있다.","hl":"m"},{"n":13,"text":"이 문장은 로봇에 대한 글의 첫머리로, 로봇이 현재와 미래에 걸쳐 우리 생활을 바꾸고 있음을 제시해요. make things faster and easier는 오형식 make 구조로, 일을 더 빠르고 더 쉽게 만든다는 뜻이에요. 로봇이 인간의 일을 더 효율적으로 만들어 준다는 핵심 내용을 미리 요약해 주는 문장이에요.","hl":"mn"},{"n":14,"text":"어법 포인트를 짚어 볼게요. 첫 번째 포인트는 are making이에요. be동사 are와 현재분사 making이 만나 현재진행형을 만드는데, 주어 Robots가 지금 동작을 진행 중이라는 뜻이에요. 이 동사는 뒤에 목적어 things와 목적격 보어 faster and easier를 취하는 오형식 구조까지 이어져요. 두 번째 포인트는 faster and easier예요. fast와 easy의 비교급을 and로 병렬 연결해서 두 가지 특성이 함께 높아짐을 표현해요. make의 목적격 보어 자리에 형용사로 쓰여 things를 꾸며 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 우리를 도울 수 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에서나—우리의 가정에서,\u003c/span>\u003cspan class=\"en\">anywhere—\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">homes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">roads, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 재난 지역에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">disaster \u003c/span>\u003cspan class=\"tgt\">areas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 어디에서나 우리를 도울 수 있다―우리의 가정에서, 길에서, 또는 재난 지역에서.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 로봇의 도움을 받는 장소를 구체적으로 예시하는 문장이다. \u003cb class=\"key\">anywhere\u003c/b>라는 부사 뒤에 대시를 써서 가정, 도로, 재난 지역을 \u003cb class=\"key\">병렬\u003c/b>로 나열한다. 로봇이 특정 장소가 아니라 \u003cb class=\"key\">어디에서나\u003c/b> 쓸모 있다는 점을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can\u003c/span> : can + 동사원형 : \"도울 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 병렬\u003c/span> : 전치사구 A, B, or C : \"우리의 가정에서, 길에서, 또는 재난 지역에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They can help us, 그들은 우리를 도울 수 있다. anywhere—in our homes, 어디에서나—우리의 가정에서. on roads, 길에서. or in disaster areas, 또는 재난 지역에서.. 이 문장 전체를 해석하면, 그들은 어디에서나 우리를 도울 수 있다―우리의 가정에서, 길에서, 또는 재난 지역에서.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장에서 말한 로봇의 도움을 받는 장소를 구체적으로 예시하고 있어요. anywhere라는 부사 뒤에 가정과 도로와 재난 지역을 병렬로 나열했어요. 로봇이 특정 장소가 아니라 어디에서나 쓸모 있다는 점을 강조해 주고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 can help예요. 조동사 can은 능력과 가능을 나타내고, 뒤에는 항상 동사원형 help가 와요. 여기서는 로봇들이 어디에서나 우리를 도울 수 있다는 가능성을 표현해요. 두 번째 포인트는 in our homes, on roads, or in disaster areas예요. 전치사구 세 개가 or로 병렬 연결되어 anywhere의 구체적인 장소를 예시해요. 마지막 항목 앞에 or를 써서 선택의 의미를 더해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정 도우미 로봇\u003c/span>\u003cspan class=\"en\">Home Helper Robot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 로봇은 당신의 가족을 돕는다\u003c/span>\u003cspan class=\"en\">This robot \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps\u003c/span> your family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온종일.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">throughout \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가정 도우미 로봇 이 로봇은 온종일 당신의 가족을 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 로봇 예시로 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>을 소개한다. 이 로봇이 \u003cb class=\"key\">온종일\u003c/b> 가족을 돕는다고 하여 일상생활에서의 역할을 구체화한다. \u003cb class=\"key\">throughout \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">day\u003c/b>는 '하루 종일 내내'라는 뜻으로 시간의 연속성을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3인칭 단수 현재형\u003c/span> : 주어(3인칭 단수) + 동사원형 + -s/es : \"돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 전치사구\u003c/span> : throughout + 명사(기간) : \"온종일\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Home Helper Robot, 가정 도우미 로봇. This robot helps your family, 이 로봇은 당신의 가족을 돕는다. throughout the day, 온종일.. 이 문장 전체를 해석하면, 가정 도우미 로봇 이 로봇은 온종일 당신의 가족을 돕는다.","hl":"m"},{"n":19,"text":"이 문장은 첫 번째 로봇 예시로 가정 도우미 로봇을 소개해요. 이 로봇이 온종일 가족을 돕는다고 하여 일상생활에서의 역할을 구체화하고 있어요. throughout the day는 하루 종일 내내라는 뜻으로 시간의 연속성을 강조해요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 helps예요. 주어 This robot이 삼인칭 단수이므로 현재 시제 동사 help에 s를 붙여 helps가 돼요. 일반동사의 현재형은 주어가 삼인칭 단수일 때 동사원형에 s나 es를 붙여요. 두 번째 포인트는 throughout the day예요. throughout은 동안 내내라는 뜻의 전치사이고, the day와 함께 하루 종일이라는 시간 부사구를 만들어 동사 helps를 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요리와 청소는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Cooking \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cleaning\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 쉬워질 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">easier \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 하나를 가지고 있다면.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신이 이런 로봇 하나를 가지고 있다면 요리와 청소가 더 쉬워질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 만약 당신이 이런 로봇 하나를 가지고 있다면 요리와 청소가 더 쉬워질 것이라고 말해요. 홈 헬퍼 로봇의 혜택을 \u003cb class=\"key\">가정\u003c/b>을 통해 설명하며, if you had one은 현재 사실보다 막연한 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거\u003c/b> 표현이에요. would를 써서 실현될 가능성이 낮은 상상 속 상황임을 부드럽게 표현해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Cooking and cleaning + [동사구] : \"요리하는 것과 청소하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + S + 과거동사 ~, S + would + 동사원형 ~ : \"만약 당신이 하나를 가지고 있다면 더 쉬워질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Cooking and cleaning, 요리와 청소는. would be easier, 더 쉬워질 것이다. if you had one, 만약 당신이 하나를 가지고 있다면.. 이 문장 전체를 해석하면, 만약 당신이 이런 로봇 하나를 가지고 있다면 요리와 청소가 더 쉬워질 것이다.","hl":"m"},{"n":22,"text":"이 문장은 만약 당신이 이런 로봇 하나를 가지고 있다면 요리와 청소가 더 쉬워질 것이라는 뜻이에요. 실제로 그 로봇이 지금 있는지 없는지는 모르지만, 가정을 통해 홈 헬퍼 로봇의 장점을 말해 주고 있어요. if you had one처럼 과거 시제가 쓰였지만 뜻은 현재나 일반적인 가정을 나타내는 가정법 과거 표현이에요.","hl":"mn"},{"n":23,"text":"첫 번째 문법 포인트는 Cooking and cleaning이 동명사 주어로 쓰인 거예요. 동사에 ing를 붙여 명사처럼 만든 동명사가 문장 맨 앞에서 주어 역할을 해요. 두 번째 문법 포인트는 would be easier if you had one 가정법 과거예요. if 뒤에 과거 시제를 쓰고 주절에는 would와 동사 원형을 써서 현재 사실의 반대나 막연한 가정을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 이야기한다\u003c/span> "m"},{"n":34,"text":"이 문장은 로봇 군집의 정의를 내리는 문장이에요. 로봇 군집은 개미나 벌처럼 서로 의사소통할 수 있는 대규모 로봇 집단이라는 설명이에요. that 이하는 앞에 나온 robots를 수식해서 어떤 로봇 집단인지 구체화하고, like ants or bees는 비유를 통해 협력하는 방식을 쉽게 알려줘요.","hl":"mn"},{"n":35,"text":"첫 번째, that can communicate with one another에서 that은 주격 관계대명사예요. 앞에 나온 robots를 받으면서 뒤 절의 주어 역할을 해요. communicate with one another는 서로 의사소통하다라는 뜻이고, one another는 셋 이상이 서로 관계를 맺을 때 쓰는 표현이에요. 두 번째, like ants or bees에서 like는 전치사로 개미나 벌처럼이라는 뜻이에요. 로봇 군집을 곤충에 빗대어 협력하는 모습을 설명해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 사용될 수 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 장소에서\u003c/span>\u003cspan class=\"en\">in a variety of places,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농장이나 건설 현장을 포함하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">including \u003c/span>\u003cspan class=\"tgt\">farms \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">building \u003c/span>\u003cspan class=\"tgt\">sites\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 농장이나 건설 현장을 포함하여 다양한 장소에서 사용될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로봇 군집의 활용 범위를 설명합니다. \u003cb class=\"key\">수동태\u003c/b> can be used를 통해 로봇 군집이 사용되는 대상임을 나타내고, \u003cb class=\"key\">including \u003c/b>\u003cb class=\"key\">전치사구\u003c/b>로 농장이나 건설 현장 같은 구체적인 예를 들어 다양한 장소를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 수동태 (can be + 과거분사)\u003c/span> : 주어 + can be + [과거분사] : \"사용될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 including + 명사구 (예시 포함)\u003c/span> : including + [명사A] + or + [명사B] : \"농장이나 건설 현장을 포함하여\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They can be used, 그들은 사용될 수 있다. in a variety of places, 다양한 장소에서. including farms or building sites, 농장이나 건설 현장을 포함하여. 이 문장 전체를 해석하면, 그들은 농장이나 건설 현장을 포함하여 다양한 장소에서 사용될 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 로봇 군집이 활용될 수 있는 장소를 설명해요. They can be used는 수동태로, 로봇 군집이 스스로 사용하는 것이 아니라 사람에 의해 사용되는 대상임을 나타내요. including 이하는 농장이나 건설 현장 같은 구체적인 예를 들어 다양한 장소의 범위를 보여줘요.","hl":"mn"},{"n":38,"text":"첫 번째, They can be used에서 can be used는 조동사 can과 수동태 be used가 결합한 형태예요. 주어 They, 즉 로봇 군집이 사용하는 주체가 아니라 사용되는 대상이라서 be used로 수동태를 쓰고, can을 붙여 사용될 수 있다는 가능성을 표현해요. 두 번째, including farms or building sites에서 including은 포함하여라는 뜻의 전치사예요. 뒤에 농장이나 건설 현장을 예로 들어 다양한 장소를 구체화해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 임무에 착수한다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">tasks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 해결책을 찾는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">solutions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단을 이루어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">group\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 집단을 이루어 임무에 착수하고 해결책을 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로봇 swarm은 개별 로봇이 아니라 집단 전체가 하나의 팀처럼 움직이며, 맡은 임무에 착수하고 해결책을 찾는다는 의미입니다. 앞 문장에서 로봇 swarm을 개미나 벌에 비유했는데, 이 문장은 그 비유를 이어받아 \u003cb class=\"key\">협업\u003c/b>과 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결\u003c/b>이라는 핵심 기능을 정리해 줍니다. as a group이 문장 끝에 와서 '집단으로서'의 방식을 강조하므로, 로봇 여러 대가 \u003cb class=\"key\">분업\u003c/b>하거나 협력하는 모습을 상상하면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조 (동사구 병렬)\u003c/span> : [주어 They] + [동사구 work on tasks] + and + [동사구 find solutions] : \"임무에 착수하고 해결책을 찾는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as + 명사구 (부사구)\u003c/span> : as + [명사구 a group] (전치사구가 문장 끝에서 방식·자격을 나타냄) : \"집단으로서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They work on tasks, 그들은 임무에 착수한다. and find solutions, 그리고 해결책을 찾는다. as a group, 집단을 이루어. 이 문장 전체를 해석하면, 그들은 집단을 이루어 임무에 착수하고 해결책을 찾는다.","hl":"m"},{"n":40,"text":"이 문장은 로봇 swarm이 혼자 움직이지 않고 집단으로 협력해서 일한다는 걸 정리해 줍니다. 앞에서 개미나 벌에 비유했던 것처럼, 로봇들이 함께 임무에 착수하고 문제를 해결한다는 뜻이에요. as a group이라는 표현이 문장 끝에 나와서 집단으로서의 방식을 강조하고 있습니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 병렬 구조입니다. 주어 They에 이어서 work on tasks와 find solutions가 and로 연결되어 있는데요. 두 동사구가 같은 주어를 공유하면서 나란히 이어진 형태입니다. 두 번째 포인트는 전치사 as의 쓰임입니다. as a group은 as라는 전치사 뒤에 a group이라는 명사구가 와서 집단으로서라는 뜻의 부사구 역할을 합니다. 이 부사구는 일하는 방법을 설명해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>로봇은 \u003cb class=\"key\">일을 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">빠르고 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">쉽게\u003c/b> 만들어 주며, \u003cb class=\"key\">가정\u003c/b>과 \u003cb class=\"key\">도로\u003c/b>, \u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b> 등 어디에서나 우리를 돕는다.\u003c/li>\u003cli>\u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>은 요리와 청소를 돕고 가족과 대화하며 \u003cb class=\"key\">감정\u003c/b>을 감지한다.\u003c/li>\u003cli>\u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행차\u003c/b>는 \u003cb class=\"key\">카메라\u003c/b>, \u003cb class=\"key\">감지기\u003c/b>, \u003cb class=\"key\">소프트웨어\u003c/b>로 운전자 없이 길을 찾아간다.\u003c/li>\u003cli>\u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">군집\u003c/b>은 개미나 벌처럼 \u003cb class=\"key\">의사소통\u003c/b>하며 \u003cb class=\"key\">집단\u003c/b>으로 임무를 수행하고 해결책을 찾는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Robots help us anywhere, including homes, roads, and disaster areas, through home helper robots, self-driving cars, and robot swarms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">로봇은 일을 더 빠르고 더 쉽게 만들어 주며 \u003cb class=\"key\">가정\u003c/b>, \u003cb class=\"key\">도로\u003c/b>, \u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b> 등 어디에서나 우리를 돕는다. \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">도우미 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>, \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행차\u003c/b>, \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">군집\u003c/b>이 각각 가사, 주행, 집단 작업에서 활용된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘은 로봇이 가정과 도로와 재난 지역에서 우리를 돕는 모습을 세 가지 사례로 살펴봤어요. 가정 도우미 로봇은 집안일과 감정을 돕고, 자율 주행차는 운전을 대신하고, 로봇 군집은 협력해서 문제를 해결해요. 글의 구조는 두괄식 분류이니까 첫 문장과 세 가지 사례의 표지를 잡는 연습을 해 보세요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
