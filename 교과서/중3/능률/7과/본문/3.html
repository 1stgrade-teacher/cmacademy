집단 지성(Collective intelligence)을 발휘해 거대한 작업을 수행하는 효율적인 방식을 의미합니다. 이렇게 로봇이 우리 삶에 스며드는 과정은 단순히 기계가 일을 대신하는 것을 넘어, 로봇이 사람의 감정을 이해하거나 협력하는 인간과 로봇의 상호작용(HRI) 시대로 나아가고 있다는 점을 이해하면 지문을 훨씬 쉽게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01로봇의 역할</div><ul><li>로봇은 일상 곳곳에서 작업을 더 빠르고 편리하게 만들어 줍니다.</li><li>가정, 도로, 재난 현장 등 어디서나 도움을 줌</li><li>인간의 활동을 지원하는 다목적 로봇(robots)</li><li>핵심 키워드: 로봇(Robots)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가정용 로봇</div><ul><li>가정용 로봇은 집안일을 돕고 가족과 소통하는 역할을 합니다.</li><li>요리와 청소 같은 가사 노동의 효율화</li><li>가족의 감정을 느끼고 대화할 수 있는 능력</li><li>핵심 키워드: 가정용 도우미(Home Helper Robot)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자율주행 자동차</div><ul><li>자율주행 자동차는 운전자 없이도 스스로 도로를 주행합니다.</li><li>카메라, 센서, 소프트웨어를 통한 운행</li><li>탑승자가 휴식을 취할 수 있도록 지원</li><li>핵심 키워드: 자율주행 자동차(Self-Driving Car)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04로봇 군집</div><ul><li>로봇 군집은 개미나 벌처럼 서로 소통하며 협동 작업을 수행합니다.</li><li>여러 로봇이 정보를 교환하며 공동의 목표 달성</li><li>농장이나 건설 현장 등 다양한 장소에서 활용</li><li>핵심 키워드: 로봇 군집(Robot Swarm)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">disaster</td><td class=\"m\">재난, 재해</td></tr><tr><td class=\"w\">throughout</td><td class=\"m\">~동안 내내, 도처에</td></tr><tr><td class=\"w\">member</td><td class=\"m\">구성원, 일원</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감지하다, 느끼다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">self-driving</td><td class=\"m\">자율 주행의</td></tr><tr><td class=\"w\">sensor</td><td class=\"m\">센서, 감지기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">navigate</td><td class=\"m\">길을 찾다, 항해하다</td></tr><tr><td class=\"w\">swarm</td><td class=\"m\">떼, 군집</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">task</td><td class=\"m\">과업, 일</td></tr><tr><td class=\"w\">solution</td><td class=\"m\">해결책</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로봇들은</span><span class=\"en\"><b>Robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일들을 만들고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are making</span> things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 빠르고 더 쉽게</span><span class=\"en\"><b><span class=\"grammar-hl\">faster and easier</span>.</b></span></div></div><div class=\"lec-sent-ko\">로봇은 일을 더 빠르고 더 쉽게 만들어 주고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 로봇이 도입됨으로써 인간이 하는 일의 효율성이 높아지고, 과정은 간편해지고 있음을 알리는 글의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are making (현재진행): be동사(are) + 현재분사(making) 구조로, 로봇들이 현재 ~하고 있는 동작을 나타냄</div><div class=\"lec-gr-item\">faster and easier (5형식(SVOC)): make + 목적어(things) + 목적격보어(faster and easier) 구조. 목적어 things의 상태를 보어로 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 우리를 도울 수 있다</span><span class=\"en\"><b>They can <span class=\"grammar-hl\">help us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디에서나</span><span class=\"en\"><b>anywhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">—우리의 가정에서,</span><span class=\"en\"><b>—in our homes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길 위에서,</span><span class=\"en\"><b>on roads,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 재난 지역에서.</span><span class=\"en\"><b>or in disaster areas.</b></span></div></div><div class=\"lec-sent-ko\">그들은 어디에서나 우리를 도울 수 있다―우리의 가정에서, 길에서, 또는 재난 지역에서.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 로봇의 기능을 구체적인 장소와 연결합니다. anywhere는 &#39;어디든지&#39;라는 사전적 뜻을 넘어, 로봇의 활용 범위가 일상생활부터 위험한 환경까지 무한히 넓다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help us (5형식(SVOC)): help + 목적어(us) + 목적격보어(동사원형) 구조로, us가 ~하는 것을 돕는다는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disaster</td><td class=\"m\">재난, 재해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 로봇은</span><span class=\"en\"><b>This robot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 가족을 돕는다</span><span class=\"en\"><b><span class=\"grammar-hl\">helps your family</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 종일</span><span class=\"en\"><b>throughout the day.</b></span></div></div><div class=\"lec-sent-ko\">이 로봇은 온종일 당신의 가족을 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본격적으로 로봇의 종류를 설명하기 시작하며, 가사 도우미 로봇이 일상생활에 밀착되어 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps your family (5형식(SVOC)): help + 목적어(your family) + 목적격보어(to부정사 생략) 구조로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">throughout</td><td class=\"m\">~동안 내내, 도처에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요리와 청소는</span><span class=\"en\"><b>Cooking and cleaning</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉬워질 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">would be</span> easier</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 하나를 가진다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if you had one</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 이런 로봇 하나를 가지고 있다면 요리와 청소가 더 쉬워질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가정법을 사용하여 로봇의 유용성을 가정함으로써 독자의 흥미를 유발합니다. 여기서 one은 막연한 &#39;하나&#39;가 아니라 앞 문장에서 언급된 &#39;가사 도우미 로봇&#39;을 가리키는 대명사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would be 가정법 과거: if절에 과거동사(had)가 쓰여 현재 사실과 반대되는 상황을 가정하며, 주절에 would + 동사원형을 사용함</div><div class=\"lec-gr-item\">if you had one 가정법 과거: if + 주어 + 과거동사(had) 구조로, 현재 가지고 있지 않은 상태를 가정함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 또한 이야기를 나눈다</span><span class=\"en\"><b>It also <span class=\"grammar-hl\">talks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원들과</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 감정을 감지할 수 있다.</span><span class=\"en\"><b>and can sense emotions.</b></span></div></div><div class=\"lec-sent-ko\">이 로봇은 또한 가족 구성원들과 이야기를 나누며 감정을 감지할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순한 육체노동뿐만 아니라 정서적인 교류도 가능하다는 점을 추가하여 로봇의 기능적 진화를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talks with (관용표현): talk with(~와 대화하다)는 함께 상호작용하는 대상을 나타내는 숙어임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">member</td><td class=\"m\">구성원, 일원</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감지하다, 느끼다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자율 주행차는</span><span class=\"en\"><b>A <span class=\"grammar-hl\">self-driving car</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요로 하지 않는다</span><span class=\"en\"><b>doesn’t need</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운전자를</span><span class=\"en\"><b>a driver.</b></span></div></div><div class=\"lec-sent-ko\">자율 주행차는 운전자를 필요로 하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 사례인 &#39;자율주행차&#39;의 핵심적인 특징을 간결하게 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Self-Driving Car (동명사(명사적)): self-driving(스스로 운전하기)이라는 활동의 목적을 나타내며 뒤의 car를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">self-driving</td><td class=\"m\">자율 주행의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">카메라, 센서, 그리고 소프트웨어로,</span><span class=\"en\"><b>With cameras, sensors, and software,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 길을 찾아갈 수 있다</span><span class=\"en\"><b>it can navigate roads</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 위해</span><span class=\"en\"><b>for you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 당신은 쉴 수 있고</span><span class=\"en\"><b><span class=\"grammar-hl\">so that you can relax</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 주행을 즐길 수 있다.</span><span class=\"en\"><b>and enjoy the ride.</b></span></div></div><div class=\"lec-sent-ko\">카메라, 감지기, 그리고 소프트웨어를 이용하여 이 차는 당신이 쉬면서 주행을 즐길 수 있도록 당신을 위해 길을 찾아갈 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술적 요소(카메라, 센서 등)가 어떻게 인간의 편의를 돕는지 설명합니다. navigate는 사전적으로 &#39;길을 찾다&#39;는 뜻인데, 여기서는 자율주행차가 스스로 복잡한 도로 상황을 파악해 운전하는 능동적이고 지능적인 과정을 묘사하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so that you can relax (관용표현): so that은 목적(~하기 위해서)을 나타내는 접속사 구문으로, 뒤에 주어+동사의 절을 이끎</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sensor</td><td class=\"m\">센서, 감지기</td></tr><tr><td class=\"w\">navigate</td><td class=\"m\">길을 찾다, 항해하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로봇 군집은</span><span class=\"en\"><b>A robot swarm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 집단이다</span><span class=\"en\"><b>is a large group</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로봇들의</span><span class=\"en\"><b>of robots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사소통할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that can communicate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로와,</span><span class=\"en\"><b>with one another,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개미나 벌처럼</span><span class=\"en\"><b>like ants or bees.</b></span></div></div><div class=\"lec-sent-ko\">로봇 군집이란 개미나 벌처럼 서로 의사소통할 수 있는 대규모의 로봇 집단을 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;로봇 군집&#39;이라는 새로운 개념을 자연계(개미, 벌)의 집단 지성에 비유하여 독자가 쉽게 이해하도록 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that can communicate (관계대명사): that은 선행사 robots를 수식하며, 관계대명사 절 내부에서 주어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">swarm</td><td class=\"m\">떼, 군집</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 사용될 수 있다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">can be used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 장소들에서,</span><span class=\"en\"><b>in a variety of places,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농장들을 포함하여</span><span class=\"en\"><b><span class=\"grammar-hl\">including farms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 건설 현장들을</span><span class=\"en\"><b><span class=\"grammar-hl\">or building sites</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 농장이나 건설 현장을 포함하여 다양한 장소에서 사용될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 군집 로봇의 활용 범위가 산업적인 영역까지 넓음을 구체적인 장소 예시를 들어 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be used (수동태): be동사(be) + 과거분사(used) 구조. use는 타동사인데 목적어가 없어서 수동구조 be used 형태로 씀. 기본구조: use + O(목적어)</div><div class=\"lec-gr-item\">including farms or building sites (현재분사): 전치사적으로 쓰인 분사구문으로, 뒤의 대상을 예시로 포함한다는 의미를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 작업한다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">임무들에</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> tasks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 해결책들을 찾는다</span><span class=\"en\"><b>and find solutions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단으로서</span><span class=\"en\"><b>as a group.</b></span></div></div><div class=\"lec-sent-ko\">그들은 집단을 이루어 임무에 착수하고 해결책을 찾는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 군집 로봇의 핵심 작동 원리인 &#39;협동&#39;과 &#39;집단 지성&#39;을 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">work on (관용표현): work on(~을 수행하다/~에 매달리다)은 특정 작업이나 임무를 진행함을 나타내는 숙어임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">task</td><td class=\"m\">과업, 일</td></tr><tr><td class=\"w\">solution</td><td class=\"m\">해결책</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>로봇은 일상의 효율을 높이며 집, 도로, 재난 현장 등 다양한 곳에서 활약한다.</li><li>가사 도우미 로봇은 집안일을 돕고 정서적 교감까지 수행한다.</li><li>자율주행차는 스스로 주행하여 인간에게 휴식을 제공한다.</li><li>군집 로봇은 개미처럼 서로 소통하며 대규모 산업 현장에서 협력하여 문제를 해결한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Robots assist people in daily life and transportation, and they also work together in groups to solve complex problems efficiently.</div>\n              <div class=\"lec-final-sum-ko\">로봇은 일상생활과 교통에서 사람들을 돕고, 또한 집단을 이루어 협력함으로써 복잡한 문제를 효율적으로 해결한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"audio":"./3_audio/25.mp3","hl":"meaning"},{"audio":"./3_audio/26.mp3","hl":"grammar"}],[{"audio":"./3_audio/27.mp3","hl":"main"},{"audio":"./3_audio/28.mp3","hl":"meaning"},{"audio":"./3_audio/29.mp3","hl":"grammar"}],[{"audio":"./3_audio/30.mp3","hl":"main"},{"audio":"./3_audio/31.mp3","hl":"meaning"},{"audio":"./3_audio/32.mp3","hl":"grammar"}],[{"audio":"./3_audio/33.mp3","hl":"main"},{"audio":"./3_audio/34.mp3","hl":"meaning"},{"audio":"./3_audio/35.mp3","hl":"grammar"}],[{"audio":"./3_audio/36.mp3","hl":"main"},{"audio":".
