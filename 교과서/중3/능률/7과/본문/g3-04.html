<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 능률(김) 본문4 — Lesson07</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson07","title":"중3 능률(김) 본문4","audioDir":"g3-04_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 능률(김)\u003c/div>\u003ch1>Search-and-Rescue Robots and Our Future\u003c/h1>\u003ch2>수색 구조 로봇과 우리의 미래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수색 구조 로봇은 재난 현장에서 \u003cb class=\"key\">생존자\u003c/b>를 찾고 \u003cb class=\"key\">위험 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 처리한다. 로봇의 미래는 \u003cb class=\"key\">밝지만 \u003c/b>\u003cb class=\"key\">완벽하지 \u003c/b>\u003cb class=\"key\">않으며\u003c/b>, \u003cb class=\"key\">편리함\u003c/b>에 대한 기대와 \u003cb class=\"key\">일자리·안전\u003c/b>에 대한 우려가 공존하므로 \u003cb class=\"key\">해결책\u003c/b>을 찾아 좋은 일에만 쓰이게 해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our future with robots looks bright but not perfect, so we need to find possible solutions and ensure that robots are used only for good.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘 같이 볼 지문은 수색 구조 로봇과 우리의 미래입니다. 이 글은 로봇이 재난 현장에서 사람을 돕는 모습을 먼저 보여 주고, 로봇의 미래가 밝지만 완벽하지 않다는 점을 이야기합니다. 결국 기대와 우려를 함께 살피면서 로봇을 좋은 일에만 쓰도록 해결책을 찾아야 한다는 내용입니다. 자, 그럼 지문 속으로 들어가 볼까요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로봇은 사람이 접근하기 어려운 \u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b>에서 활약하는 경우가 많습니다. 이런 로봇을 \u003cb class=\"key\">search-and-rescue \u003c/b>\u003cb class=\"key\">robot\u003c/b>이라고 하며, 센서와 통신 장비를 이용해 \u003cb class=\"key\">생존자\u003c/b>를 탐지하거나 위험물을 제거합니다. 일상에서는 로봇 청소기가 집 안을 돌아다니며 먼지를 치우는 것과 비슷하게, 재난 현장에서는 구조 로봇이 위험한 길을 \u003cb class=\"key\">말끔히 \u003c/b>\u003cb class=\"key\">치우는\u003c/b> 역할을 합니다. 기술이 발전하면서 로봇은 \u003cb class=\"key\">일자리\u003c/b>와 \u003cb class=\"key\">안전\u003c/b> 같은 사회적 문제에도 영향을 줄 수 있다는 논의가 커지고 있습니다. 따라서 로봇의 활용은 \u003cb class=\"key\">효율성\u003c/b>과 \u003cb class=\"key\">위험성\u003c/b>을 함께 고려해야 합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 재난 지역에는 사람이 들어가기 어려운 위험한 곳이 많죠. 그런 곳에서 활약하는 로봇을 수색 구조 로봇, 즉 search-and-rescue robot이라고 합니다. 이 로봇은 센서와 통신 장비를 이용해 생존자를 탐지하고 위험물을 제거하는 일을 합니다. 일상에서 로봇 청소기가 집 안을 돌아다니며 먼지를 치우는 것처럼, 재난 현장에서는 구조 로봇이 위험한 길을 치우고 사람들이 탈출할 수 있게 도와줍니다. 기술이 발전하면서 로봇은 일자리와 안전 같은 사회적 문제에도 영향을 줄 수 있다는 논의가 커지고 있어요. 그래서 로봇의 활용은 효율성과 위험성을 함께 고려해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>재난 현장의 로봇\u003csmall>도입/예시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문단은 \u003cb class=\"key\">수색 \u003c/b>\u003cb class=\"key\">구조 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>의 활약을 구체적으로 보여 줍니다. 이런 로봇은 사람이 들어가기 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b>에 투입되어 \u003cb class=\"key\">생존자\u003c/b>를 찾습니다. 또한 위험 요소를 처리하고 사람들이 안전한 곳으로 탈출할 수 있도록 길을 말끔히 치웁니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>밝지만 완벽하지 않은 미래\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>이제 시선을 \u003cb class=\"key\">미래\u003c/b>로 돌리면, 로봇과 함께하는 우리의 미래는 \u003cb class=\"key\">밝지만 \u003c/b>\u003cb class=\"key\">완벽하지는 \u003c/b>\u003cb class=\"key\">않습니다\u003c/b>. 이 문장은 뒤에 나올 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">전망\u003c/b>과 부정적 우려를 모두 아우르는 중심 생각입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기대와 우려\u003csmall>대조 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>어떤 사람들은 로봇의 도움으로 생활이 더욱 \u003cb class=\"key\">편리해질 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라고 기대합니다. 그러나 다른 사람들은 \u003cb class=\"key\">일자리와 \u003c/b>\u003cb class=\"key\">안전\u003c/b>에 대한 위협처럼 로봇이 일으킬지 모를 문제들을 걱정합니다. 이렇게 \u003cb class=\"key\">기대\u003c/b>와 우려가 대비됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해결책 모색\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>마지막으로 중요한 것은 가능한 \u003cb class=\"key\">해결책\u003c/b>을 찾는 것입니다. 그리고 로봇이 반드시 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 위해서만 쓰이도록 해야 합니다. 이는 기술 발전과 사회적 우려를 함께 고려하는 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 살펴보면, 먼저 로봇의 구체적인 활약 사례가 나오고 이어서 미래에 대한 전망과 대비되는 관점, 그리고 결론으로 이어집니다.","hl":null},{"n":4,"text":"첫 문단에서는 수색 구조 로봇의 활약을 구체적으로 보여 줍니다. 이런 로봇은 사람이 들어가기 위험한 재난 지역에 투입되어 생존자를 찾습니다. 또 위험 요소를 처리하고 사람들이 안전한 곳으로 탈출할 수 있도록 길을 말끔히 치워 주죠. 로봇이 좋은 일에 쓰일 수 있다는 사례입니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 시선을 미래로 돌립니다. 로봇과 함께하는 우리의 미래는 밝지만 완벽하지는 않다고 말합니다. 이 문장은 뒤에 나올 긍정적 전망과 부정적 우려를 모두 아우르는 중심 생각이에요.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장에서는 두 가지 관점이 대비됩니다. 어떤 사람들은 로봇의 도움으로 생활이 더욱 편리해질 것이라고 기대합니다. 그러나 다른 사람들은 일자리와 안전에 대한 위협처럼 로봇이 일으킬지 모를 문제들을 걱정하죠. 이렇게 기대와 우려가 나란히 제시됩니다.","hl":"f2"},{"n":7,"text":"마지막 문장에서는 결론을 내립니다. 중요한 것은 가능한 해결책을 찾는 것이고, 로봇이 반드시 좋은 일을 위해서만 쓰이도록 해야 한다는 겁니다. 이는 기술 발전과 사회적 우려를 함께 고려하는 균형 잡힌 태도를 강조합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">수색 \u003c/b>\u003cb class=\"key\">구조 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>이라는 구체적 사례를 먼저 제시합니다. 이어서 세 번째 문장에서 로봇의 미래가 \u003cb class=\"key\">밝지만 \u003c/b>\u003cb class=\"key\">완벽하지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 중심 생각을 제시합니다. 그다음 \u003cb class=\"key\">기대\u003c/b>와 \u003cb class=\"key\">우려\u003c/b>를 대조하고, 마지막 문장에서 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 따라서 주제문이 중간에 있는 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (5)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>such as (5)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>The important thing (6)\u003c/b>\u003cspan>결론·해결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Search-and-rescue robots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Our future with robots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">robots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">robots\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>로봇에 대한 기대\u003c/th>\u003cth>로봇에 대한 우려\u003c/th>\u003c/tr>\u003ctr>\u003ctd>생활이 더욱 편리해질 것\u003c/td>\u003ctd>일자리와 안전에 위협이 될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>로봇의 도움을 긍정적으로 봄\u003c/td>\u003ctd>로봇이 일으킬 문제를 걱정함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교 대조 구조입니다. 수색 구조 로봇이라는 구체적 사례를 먼저 보여 준 뒤, 세 번째 문장에서 로봇의 미래가 밝지만 완벽하지 않다는 중심 생각을 제시합니다. 네 번째와 다섯 번째 문장에서 기대와 우려를 대조하고, 마지막 문장에서 해결책을 제시하죠. 주제문이 중간에 있기 때문에 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면, 다섯 번째 문장의 However가 앞 문장과의 대조 전환을 알려 줍니다. 같은 문장에 나오는 such as는 일자리와 안전이 문제의 예시임을 보여 주죠. 마지막 문장의 The important thing은 결론을 이끄는 표현입니다. 재진술로는 로봇이라는 개념이 Search-and-rescue robots, They, Our future with robots 등으로 이어지고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>search-and-rescue\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수색 구조의\u003c/span>\u003c/div>\u003cdiv>\u003cb>robot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>disaster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재난\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survivor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존자\u003c/span>\u003c/div>\u003cdiv>\u003cb>deal with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험 요소\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>치우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>탈출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>safety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전\u003c/span>\u003c/div>\u003cdiv>\u003cb>look toward\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 향해 보다, 전망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>future\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미래\u003c/span>\u003c/div>\u003cdiv>\u003cb>bright\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>밝은\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>convenient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편리한\u003c/span>\u003c/div>\u003cdiv>\u003cb>with the help of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 도움으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>threat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위협\u003c/span>\u003c/div>\u003cdiv>\u003cb>job\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일자리\u003c/span>\u003c/div>\u003cdiv>\u003cb span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">disaster \u003c/span>\u003cspan class=\"tgt\">areas \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람에게 위험한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">dangerous \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수색 구조 로봇 수색 구조 로봇은 사람에게 위험한 재난 지역에 투입될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수색 구조 로봇이 사람이 들어가기 어려운 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">재난 \u003c/b>\u003cb class=\"key\">지역\u003c/b>에 투입될 수 있다는 사실을 소개합니다. 로봇의 핵심 임무를 제시하며 뒤에 나올 구체적 임무의 배경을 깔아 주는 문장입니다. \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">that\u003c/b>이 disaster areas를 수식해 로봇이 투입되는 장소를 구체적으로 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형 go] + [전치사구 into disaster areas] : \"재난 지역에 투입될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 [disaster areas] + [that are dangerous for humans] : \"사람에게 위험한 재난 지역\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Search-and-Rescue Robot, 수색 구조 로봇. Search-and-rescue robots can go into disaster areas, 수색 구조 로봇들은 재난 지역에 투입될 수 있다. that are dangerous for humans, 사람에게 위험한. 이 문장 전체를 해석하면, 수색 구조 로봇 수색 구조 로봇은 사람에게 위험한 재난 지역에 투입될 수 있다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 수색 구조 로봇이 사람이 들어가기 어려운 위험한 재난 지역에 투입될 수 있다는 사실을 소개합니다. 로봇의 핵심 임무를 제시하며 뒤에 나올 구체적 임무의 배경을 깔아 주는 문장입니다. 관계대명사 that이 disaster areas를 수식해 로봇이 투입되는 장소를 구체적으로 설명합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 조동사 can이에요. can은 가능성을 나타내고 뒤에 동사원형 go가 오는 구조입니다. 여기서는 수색 구조 로봇이 위험한 재난 지역에 들어갈 수 있다는 가능성으로 쓰였어요. 두 번째 어법 포인트는 주격 관계대명사 that이에요. that은 앞에 있는 disaster areas를 수식하고, 뒤에 are dangerous for humans라는 불완전한 절을 이끌어요. 주격 관계대명사라서 that 절 안에 주어가 따로 없고 동사 are가 바로 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생존자를 찾고\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">survivors, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험 요소를 처리하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">deal \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">dangers, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 길을 말끔히 치운다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">clear \u003c/span>\u003cspan class=\"tgt\">routes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 안전한 곳으로 탈출할 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">escape \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">safety\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 생존자를 찾고, 위험 요소를 처리하며, 사람들이 안전한 곳으로 탈출할 수 있도록 길을 말끔히 치운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로봇이 실제로 하는 세 가지 임무를 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>로 나열합니다. 생존자 찾기, 위험 처리, 탈출로 확보라는 임무가 순서대로 제시됩니다. \u003cb class=\"key\">so \u003c/b>\u003cb class=\"key\">that\u003c/b>은 로봇이 길을 치우는 목적이 사람들의 안전한 탈출임을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B, and C)\u003c/span> : [find survivors], [deal with dangers], and [clear routes] : \"생존자를 찾고, 위험 요소를 처리하며, 길을 말끔히 치운다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">so that + 주어 + can + 동사원형\u003c/span> : clear routes [[so that people can escape to safety]] : \"사람들이 안전한 곳으로 탈출할 수 있도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They find survivors, 그들은 생존자를 찾고. deal with dangers, 위험 요소를 처리하며. and clear routes, 그리고 길을 말끔히 치운다. so that people can escape to safety, 사람들이 안전한 곳으로 탈출할 수 있도록. 이 문장 전체를 해석하면, 그들은 생존자를 찾고, 위험 요소를 처리하며, 사람들이 안전한 곳으로 탈출할 수 있도록 길을 말끔히 치운다.","hl":"m"},{"n":16,"text":"두 번째 문장은 로봇이 실제로 하는 세 가지 임무를 병렬 구조로 나열합니다. 생존자 찾기, 위험 처리, 탈출로 확보라는 임무가 순서대로 제시됩니다. so that은 로봇이 길을 치우는 목적이 사람들의 안전한 탈출임을 나타냅니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 병렬 구조예요. find survivors, deal with dangers, and clear routes처럼 세 동사구가 and로 나란히 연결되어 있어요. 병렬 구조에서는 세 가지 형태를 모두 동사구로 맞추는 것이 중요해요. 두 번째 어법 포인트는 so that 구문이에요. so that 뒤에 people can escape to safety가 와서, 길을 말끔히 치우는 목적이 사람들의 안전한 탈출이라는 것을 나타내요. so that은 목적을 뜻하는 접속사로, 뒤에 can이 자주 쓰인다고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래에 대한 전망\u003c/span>\u003cspan class=\"en\">Looking toward the Future\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇과 함께하는 우리의 미래는 밝아 보인다\u003c/span>\u003cspan class=\"en\">Our future \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">robots\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 완벽하지는 않다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">perfect\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미래에 대한 전망 로봇과 함께하는 우리의 미래는 밝지만 완벽해 보이지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로봇과 함께하는 미래가 희망적이지만 완벽하지는 않다는 글 전체의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 제시합니다. \u003cb class=\"key\">look\u003c/b>이 감각동사로 쓰여 미래가 밝아 보인다는 상태를 설명합니다. but not perfect는 밝은 면과 부정적 측면을 \u003cb class=\"key\">대조\u003c/b>하며 이후 문단의 문제 제기를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 with robots (형용사적 수식)\u003c/span> : Our future [with robots] looks ... : \"로봇과 함께하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사 보어\u003c/span> : Our future with robots [looks] [bright but not perfect] : \"밝지만 완벽해 보이지는 않는다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Looking toward the Future, 미래에 대한 전망. Our future with robots looks bright, 로봇과 함께하는 우리의 미래는 밝아 보인다. but not perfect, 하지만 완벽하지는 않다. 이 문장 전체를 해석하면, 미래에 대한 전망 로봇과 함께하는 우리의 미래는 밝지만 완벽해 보이지는 않는다.","hl":"m"},{"n":19,"text":"세 번째 문장은 로봇과 함께하는 미래가 희망적이지만 완벽하지는 않다는 글 전체의 핵심 주제를 제시합니다. look이 감각동사로 쓰여 미래가 밝아 보인다는 상태를 설명합니다. but not perfect는 밝은 면과 부정적 측면을 대조하며 이후 문단의 문제 제기를 암시합니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 전치사구 with robots예요. with robots가 앞에 있는 Our future를 수식해서 로봇과 함께하는 우리의 미래라는 뜻을 만들어요. 두 번째 어법 포인트는 감각동사 look이에요. look은 보어로 형용사 bright를 취해서 미래가 밝아 보인다는 뜻을 나타내요. 이런 감각동사는 뒤에 형용사 보어가 온다는 점이 서술형에 자주 나오죠. but not perfect는 밝지만 완벽하지는 않다는 대조의 의미를 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 기대한다\u003c/span>\u003cspan class=\"en\">Some people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">expect \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱 편리해질 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">convenient\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇의 도움으로\u003c/span>\u003cspan class=\"en\">with the help of robots.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 로봇의 도움으로 생활이 더욱 편리해질 것이라고 기대한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로봇에 대한 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 구체화한다. 앞 문장의 bright but not perfect 중 밝은 면을 설명하며, 어떤 사람들은 로봇 덕분에 생활이 더 편리해질 것이라고 기대한다는 내용이다. expect life to become more convenient는 '삶이 더 편리해지기를 기대하다'로, 목적어와 to부정사를 함께 쓰는 \u003cb class=\"key\">5형식\u003c/b> 구조다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">expect + 목적어 + to부정사 (5형식)\u003c/span> : expect + [목적어] + [to부정사구] : \"삶이 더욱 편리해질 것이라고 기대하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Some people expect, 어떤 사람들은 기대한다. life, 삶이. to become more convenient, 더욱 편리해질 것이라고. with the help of robots, 로봇의 도움으로. 이 문장 전체를 해석하면, 어떤 사람들은 로봇의 도움으로 생활이 더욱 편리해질 것이라고 기대한다.","hl":"m"},{"n":22,"text":"이 문장은 로봇의 밝은 면을 말하고 있어요. 어떤 사람들은 로봇이 생활을 더 편리하게 해 줄 것이라고 기대한다는 뜻이에요. expect는 목적어 뒤에 to부정사를 넣어서 life to become more convenient처럼 표현합니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 expect life to become more convenient입니다. expect는 목적어와 to부정사를 함께 쓰는 동사예요. life가 목적어이고 to become more convenient가 목적격 보어입니다. 이렇게 expect는 오 형식 구조를 만든다고 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 어떤 사람들은 걱정한다\u003c/span>\u003cspan class=\"en\">other people worry about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇이 일으킬지 모르는 문제들에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">problems \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">cause\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 일자리와 안전에 대한 위협과 같이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">threats \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">jobs \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">safety\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 다른 어떤 사람들은 우리의 일자리와 안전에 대한 위협과 같이, 로봇이 일으킬지 모르는 문제들에 대해 걱정한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 However로 방향을 바꾸어 로봇에 대한 \u003cb class=\"key\">우려\u003c/b>를 제시한다. 로봇이 일자리와 안전을 위협하는 문제를 일으킬 수 있다는 반대 입장이다. problems they might cause에서는 목적격 관계대명사가 생략되어 '로봇이 일으킬지 모르는 문제들'을 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : problems [(that/which) they might cause] : \"그들이 일으킬지 모르는 문제들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as + 명사구 (예시)\u003c/span> : such as + [명사구] : \"우리의 일자리와 안전에 대한 위협과 같이\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"However, 그러나. other people worry about, 다른 어떤 사람들은 걱정한다. problems they might cause, 로봇이 일으킬지 모르는 문제들에 대해. such as threats to our jobs and safety, 우리의 일자리와 안전에 대한 위협과 같이. 이 문장 전체를 해석하면, 그러나 다른 어떤 사람들은 우리의 일자리와 안전에 대한 위협과 같이, 로봇이 일으킬지 모르는 문제들에 대해 걱정한다.","hl":"m"},{"n":25,"text":"이 문장은 앞 문장과 반대되는 우려를 말해요. 로봇이 우리 일자리와 안전을 위협할 수 있다는 걱정이에요. problems they might cause에서는 목적격 관계대명사가 생략되어 있어서, 로봇이 일으킬지 모르는 문제들이라고 자연스럽게 해석하면 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 problems they might cause입니다. problems가 they might cause의 목적어 자리라서, 원래는 problems that they might cause인데 목적격 관계대명사 that을 생략했어요. 두 번째 포인트는 such as입니다. such as는 앞에 나온 problems의 구체적인 예를 드는 표현이에요. 뒤에 threats to our jobs and safety가 와서 우리 일자리와 안전에 대한 위협을 예로 들고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것은\u003c/span>\u003cspan class=\"en\">The important thing is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 해결책들을 찾는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003cspan class=\"tgt\">solutions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 반드시 하도록 하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ensure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇이 오직 좋은 일을 위해서만 사용되도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">robots \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">good\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중요한 것은 가능한 해결책들을 찾는 것과 로봇이 반드시 좋은 일을 위해서만 쓰이도록 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">결론\u003c/b>으로, 로봇의 긍정적 전망과 우려를 모두 정리한 뒤 강조하는 핵심이다. 중요한 것은 가능한 해결책을 찾는 것과 로봇이 오직 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">일\u003c/b>에만 사용되도록 확실히 하는 것이다. 이는 to부정사 주격 보어와 that절, 수동태가 함께 쓰인 문장으로 시험에서 자주 다뤄진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어) / 병렬\u003c/span> : The important thing is [to find ... and to ensure ...] : \"가능한 해결책들을 찾는 것과 반드시 하도록 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (ensure의 목적어)\u003c/span> : ensure + [that절] : \"로봇이 오직 좋은 일을 위해서만 사용되도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + [과거분사] : \"오직 사용되다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The important thing is, 중요한 것은. to find possible solutions, 가능한 해결책들을 찾는 것. and to ensure, 그리고 반드시 하도록 하는 것. that robots are only used for good, 로봇이 오직 좋은 일을 위해서만 사용되도록. 이 문장 전체를 해석하면, 중요한 것은 가능한 해결책들을 찾는 것과 로봇이 반드시 좋은 일을 위해서만 쓰이도록 하는 것이다.","hl":"m"},{"n":28,"text":"이 문장은 글의 결론이에요. 로봇의 밝은 면과 어두운 면을 모두 다룬 뒤, 결국 중요한 것은 해결책을 찾고 로봇을 좋은 일에만 쓰이도록 보장하는 것이라고 말해요. to find possible solutions와 to ensure가 and로 병렬되어 있고, that절은 ensure의 목적어 역할을 합니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 The important thing is to find possible solutions and to ensure입니다. 주어 The important thing을 설명하는 보어 자리에 to부정사구가 왔어요. and로 두 개의 to부정사가 병렬 연결되어 있어요. 두 번째는 that robots are only used for good입니다. 이 that절은 ensure의 목적어 역할을 하는 명사절이에요. 세 번째는 are only used입니다. 로봇이 사용되는 수동의 의미라서 be 동사와 used가 결합한 수동태로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">수색 \u003c/b>\u003cb class=\"key\">구조 \u003c/b>\u003cb class=\"key\">로봇\u003c/b>은 위험한 재난 지역에서 \u003cb class=\"key\">생존자\u003c/b>를 찾고 위험 요소를 처리한다.\u003c/li>\u003cli>로봇과 함께하는 미래는 \u003cb class=\"key\">밝지만 \u003c/b>\u003cb class=\"key\">완벽하지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>.\u003c/li>\u003cli>어떤 사람들은 \u003cb class=\"key\">편리함\u003c/b>을 기대하고, 다른 사람들은 \u003cb class=\"key\">일자리와 \u003c/b>\u003cb class=\"key\">안전\u003c/b>을 걱정한다.\u003c/li>\u003cli>가능한 \u003cb class=\"key\">해결책\u003c/b>을 찾고 로봇이 좋은 일에만 쓰이도록 해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our future with robots looks bright but not perfect, so we need to find possible solutions and ensure that robots are used only for good.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수색 구조 로봇은 재난 현장에서 \u003cb class=\"key\">생존자\u003c/b>를 찾고 \u003cb class=\"key\">위험 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 처리한다. 로봇의 미래는 \u003cb class=\"key\">밝지만 \u003c/b>\u003cb class=\"key\">완벽하지 \u003c/b>\u003cb class=\"key\">않으며\u003c/b>, \u003cb class=\"key\">편리함\u003c/b>에 대한 기대와 \u003cb class=\"key\">일자리·안전\u003c/b>에 대한 우려가 공존하므로 \u003cb class=\"key\">해결책\u003c/b>을 찾아 좋은 일에만 쓰이게 해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글을 정리하면, 로봇은 재난 현장에서 사람을 돕는 좋은 도구가 될 수 있지만 미래가 밝지만은 않다는 내용이었습니다. 어떤 사람들은 편리함을 기대하고 어떤 사람들은 일자리와 안전을 걱정하죠. 결국 가능한 해결책을 찾고 로봇을 좋은 일에만 쓰도록 해야 한다는 것이 핵심입니다. 다음 시간에 또 만나요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
