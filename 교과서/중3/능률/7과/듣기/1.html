3c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"내용 일치 문제예요. 대화 내용과 일치하지 않는 보기를 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 다섯 번째 보기예요. 비행 카메라를 사고 싶다고 말한 사람은 소년이 아니라 소녀예요. 소녀가 I want to buy it 이라고 말했죠. 나머지 보기는 모두 대화 내용과 같아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 7\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">Which statement is true according to the dialogue?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The girl thinks the new inventions are boring.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The smart refrigerator can cook recipes by itself.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>The flying camera can take pictures from 500 meters above the location.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The boy wants to take pictures of flying birds.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>The flying camera cannot fly to a set destination.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The flying camera can take pictures from 500 meters above the location.\u003c/span>\u003cdiv class=\"g-exp\">비행 카메라는 목적지 위 오백 미터 상공에서 사진을 찍을 수 있다고 했어요. 스마트 냉장고는 요리법을 추천할 뿐 직접 요리하지는 않고, 새 사진을 찍고 싶은 사람은 소녀예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"내용 일치 문제예요. 대화 내용과 일치하는 보기를 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 세 번째 보기예요. 비행 카메라는 목적지 위 오백 미터 상공에서 사진을 찍을 수 있다고 했어요. 스마트 냉장고는 요리법을 추천할 뿐 직접 요리하지는 않고, 새 사진을 찍고 싶은 사람은 소녀예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 7\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">Which statement is NOT true according to the dialogue?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The girl introduces the new inventions of the month.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The smart refrigerator senses the items inside it.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The boy asks the girl to explain how the flying camera works.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The girl says the flying camera can take pictures while it is flying.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>⑤\u003c/b>The girl wants to take pictures of the smart refrigerator.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The girl wants to take pictures of the smart refrigerator.\u003c/span>\u003cdiv class=\"g-exp\">소녀가 사진을 찍고 싶어 하는 대상은 스마트 냉장고가 아니라 나는 새들이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"내용 일치 문제예요. 대화 내용과 일치하지 않는 보기를 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":6},{"n":43,"text":"정답은 다섯 번째 보기예요. 소녀가 사진을 찍고 싶어 하는 대상은 스마트 냉장고가 아니라 나는 새들이에요. 나머지 보기는 모두 대화 내용과 같아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 7 / 7\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 부분을 같은 뜻으로 바꾼 것으로 알맞은 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Could you explain how it works?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Could you tell me how it works?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Could you explain how does it work?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Could you explain what it works?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Could you say me how it works?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Could you tell me how it works?\u003c/span>\u003cdiv class=\"g-exp\">설명을 요청할 때는 Could you tell me how + 주어 + 동사 형태로도 쓸 수 있어요. 간접의문문에서는 어순이 '의문사 + 주어 + 동사'예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":44,"text":"대체 표현 문제예요. Could you explain how it works? 를 같은 뜻으로 바꾼 표현을 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":45,"text":"","hl":"q","pause":6},{"n":46,"text":"정답은 첫 번째 보기예요. Could you tell me how it works? 는 같은 뜻을 가진 표현이죠. 간접의문문에서는 how it works처럼 의문사 다음에 주어와 동사가 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">의견 묻고 답하기 / 설명 요청하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>의견을 물을 때는 \u003cb class=\"key\">What do you think of\u003c/b> + 명사 표현을 써요.\u003c/li>\u003cli>감각동사 look, sound 뒤에는 \u003cb class=\"key\">형용사\u003c/b>가 와요.\u003c/li>\u003cli>설명을 요청할 때는 \u003cb class=\"key\">Could you explain\u003c/b> + \u003cb class=\"key\">간접의문문\u003c/b> 형태를 써요.\u003c/li>\u003cli>사진을 찍는다고 할 때는 \u003cb class=\"key\">take pictures of\u003c/b> + 대상을 써요.\u003c/li>\u003c/ul>","segs":[{"n":47,"text":"오늘은 의견을 묻고 설명을 요청하는 표현을 배웠어요. 의견을 물을 때는 What do you think of 뒤에 궁금한 대상을 붙이면 되고, 설명을 부탁할 때는 Could you explain how it works처럼 간접의문문을 목적어로 쓴다는 것도 꼭 기억해 주세요. 감각동사 look과 sound 뒤에는 형용사가 온다는 점, 그리고 take pictures of로 사진 찍는 대상을 말한다는 점도 챙겨 주세요. 오늘 배운 표현들을 입으로 여러 번 소리 내어 연습해 보면 훨씬 오래 남을 거예요. 수고 많았습니다.","hl":"sum"}]}]});</script></body></html>
