  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

arm and move it.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">That's amazing! I think this technology can help many people.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"What are you watching?","hl":"r-0"},{"n":3,"text":"It's a show about a man who lost one of his arms in an accident. Surprisingly, he can play the drums very well.","hl":"r-1"},{"n":4,"text":"How can he play the drums with only one arm?","hl":"r-2"},{"n":5,"text":"Actually he uses two arms. One is a robot arm controlled by his brain.","hl":"r-3"},{"n":6,"text":"That's awesome. Could you explain in more detail?","hl":"r-4"},{"n":7,"text":"Sure. First, he thinks what he wants to do with his arm. Then those thoughts are turned into electronic signals. The signals travel from his brain to his robot arm and move it.","hl":"r-5"},{"n":8,"text":"That's amazing! I think this technology can help many people.","hl":"r-6"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">설명 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Could you explain in more detail?\u003c/div>\u003cdiv class=\"d-mean\">좀 더 자세히 설명해 줄래요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: That's awesome. Could you explain in more detail?\u003c/div>\u003cdiv class=\"d-exp\">이해하지 못한 부분이 있거나 상대의 의도를 파악하지 못했을 때 \u003cb class=\"key\">Could you explain ~?\u003c/b>로 정중히 \u003cb class=\"key\">설명\u003c/b>을 요청합니다. \u003cb class=\"key\">in detail\u003c/b>은 '자세히'라는 뜻으로, 더 자세한 정보를 원할 때 함께 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What do you mean by that?\u003c/li>\u003cli>Can you tell me more about it?\u003c/li>\u003cli>What does that mean?\u003c/li>\u003cli>I'd like to know what it means.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. First, let me explain.\u003c/li>\u003cli>Of course. Here is how it works.\u003c/li>\u003cli>Okay. I will explain it in more detail.\u003c/li>\u003cli>That means the robot arm moves by his thoughts.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"상대가 한 말을 이해하지 못했을 때는 Could you explain in more detail?라고 말할 수 있어요. 이 표현은 좀 더 자세히 설명해 달라는 뜻이에요. 특히 in detail은 자세히라는 뜻으로 기억해 두세요.","hl":"key"},{"n":10,"text":"비슷한 표현으로 What do you mean by that?은 그게 무슨 말이야라는 뜻이에요. Can you tell me more about it?은 그것에 대해 더 말해 줄 수 있니라는 뜻이고, What does that mean?은 그게 무슨 뜻이야라는 뜻이에요. I'd like to know what it means는 그게 무슨 의미인지 알고 싶다는 뜻이에요.","hl":"alts"},{"n":11,"text":"설명을 요청받으면 Sure. First, let me explain.이라고 말하며 설명을 시작할 수 있어요. Of course. Here is how it works.라고 자연스럽게 답할 수도 있어요. Okay. I will explain it in more detail.처럼 더 자세히 설명하겠다고 말해도 좋아요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">설명하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">First, ... Then ...\u003c/div>\u003cdiv class=\"d-mean\">먼저, 그다음\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Sure. First, he thinks what he wants to do with his arm. Then those thoughts are turned into electronic signals. The signals travel from his brain to his robot arm and move it.\u003c/div>\u003cdiv class=\"d-exp\">어떤 원리나 과정을 차례대로 \u003cb class=\"key\">설명\u003c/b>할 때 \u003cb class=\"key\">First\u003c/b>와 \u003cb class=\"key\">Then\u003c/b>을 사용합니다. 첫 단계와 다음 단계를 분명히 나누어 말하면 듣는 사람이 이해하기 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>First of all, ... After that, ...\u003c/li>\u003cli>To begin with, ... Next, ...\u003c/li>\u003cli>The first step is ... The next step is ...\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I see. Now I understand.\u003c/li>\u003cli>That makes sense.\u003c/li>\u003cli>Thank you for explaining.\u003c/li>\u003cli>Now I get it.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"설명할 때는 First와 Then을 사용해 순서를 보여 줄 수 있어요. First는 먼저라는 뜻이고 Then은 그다음이라는 뜻이에요. 이 두 표현을 사용하면 과정이 아주 분명해져요.","hl":"key"},{"n":13,"text":"비슷하게 First of all과 After that을 사용할 수 있어요. To begin with와 Next도 순서를 나타내는 표현이에요. The first step is와 The next step is는 각 단계를 소개할 때 쓸 수 있어요.","hl":"alts"},{"n":14,"text":"설명을 들은 뒤에는 I see. Now I understand.라고 말할 수 있어요. That makes sense.는 이해가 된다는 뜻이고, Thank you for explaining.은 설명해 줘서 고맙다는 뜻이에요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 7\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What are you watching?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">지금 무엇을 보고 있니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>현재진행형 \u003cb class=\"key\">What are you watching?\u003c/b>은 지금 보고 있는 대상을 묻는 표현입니다. \u003cb class=\"key\">현재진행형\u003c/b>은 be동사와 동사원형에 ing를 붙인 형태로 현재 하고 있는 일을 나타냅니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What show are you watching?\u003c/span>\u003cspan>What are you watching right now?\u003c/span>\u003cspan>Which show are you watching?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">It's a show about a man \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who lost one of his arms in an accident\u003c/span>. \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Surprisingly\u003c/span>, he can \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">play the drums very well\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">사고로 팔 하나를 잃은 남자에 대한 쇼야. 놀랍게도, 그는 드럼을 아주 잘 칠 수 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">주격 관계대명사\u003c/b> who는 사람인 선행사 \u003cb class=\"key\">a man\u003c/b>을 수식하는 절을 이끌며, 여기서는 that으로 바꿔 쓸 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">Surprisingly\u003c/b>는 '놀랍게도'라는 뜻으로, 예상과 다른 사실에 놀라움을 나타내는 \u003cb class=\"key\">부사\u003c/b>입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>play the drums는 '드럼을 치다'라는 뜻이고, \u003cb class=\"key\">very well\u003c/b>은 '아주 잘'을 나타냅니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>It's a show about a man who lost an arm in an accident. Surprisingly, he can play the drums very well.\u003c/span>\u003cspan>It's a program about a man who lost an arm in an accident. Surprisingly, he is very good at playing the drums.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"첫 번째 문장은 What are you watching?이고, 지금 무엇을 보고 있니라는 뜻이에요. 현재진행형을 사용해 지금 보고 있는 것을 묻고 있죠. 비슷하게 What show are you watching?라고 하면 무슨 쇼를 보고 있는지 묻는 표현이 돼요.","hl":"l-0"},{"n":16,"text":"두 번째 문장은 It's a show about a man who lost one of his arms in an accident.이고, 사고로 팔 하나를 잃은 남자에 대한 쇼라는 뜻이에요. 여기서 who는 사람인 a man을 수식하는 주격 관계대명사이고, that으로 바꿔 쓸 수도 있어요. Surprisingly는 놀랍게도라는 뜻이고, play the drums very well은 드럼을 아주 잘 친다는 뜻이에요. 비슷하게 It's a program about a man who lost an arm in an accident.라고 표현할 수도 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 7\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">How can he play the drums with only one arm?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">어떻게 팔 하나만으로 드럼을 칠 수 있니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">의문사 How\u003c/b>가 방법을 묻고, \u003cb class=\"key\">조동사 can\u003c/b>이 '할 수 있다'는 능력을 나타냅니다. with only one arm은 '팔 하나만으로'라는 뜻입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How is he able to play the drums with only one arm?\u003c/span>\u003cspan>How does he play the drums with only one arm?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">Actually\u003c/span> he uses two arms. One is a robot arm \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">controlled by his brain\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">사실 그는 두 팔을 사용해. 하나는 그의 뇌로 조종되는 로봇 팔이야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">과거분사\u003c/b> controlled 이하는 앞의 명사구 \u003cb class=\"key\">a robot arm\u003c/b>을 수식하는 과거분사구입니다. 이때 명사와 과거분사 사이에는 '주격 관계대명사와 be동사'가 생략되어 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">Actually\u003c/b>는 '사실은'이라는 뜻으로, 앞의 내용을 바로잡거나 덧붙여 설명할 때 씁니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>In fact, he uses two arms. One is a robot arm that is controlled by his brain.\u003c/span>\u003cspan>Actually, he uses both arms. One is a robot arm which his brain controls.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"세 번째 문장은 How can he play the drums with only one arm?이고, 어떻게 팔 하나만으로 드럼을 칠 수 있니라는 뜻이에요. How는 방법을 묻고 can은 할 수 있다는 능력을 나타내요. How is he able to play the drums with only one arm?라고 바꿔 말할 수도 있어요.","hl":"l-0"},{"n":18,"text":"네 번째 문장은 Actually he uses two arms. One is a robot arm controlled by his brain.이고, 사실 그는 두 팔을 사용하고 하나는 뇌로 조종되는 로봇 팔이라는 뜻이에요. controlled by his brain은 a robot arm을 수식하는 과거분사구이고, 그 사이에는 주격 관계대명사와 be동사가 생략되어 있어요. In fact, he uses two arms. One is a robot arm that is controlled by his brain.처럼 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 7\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">That's awesome\u003c/span>. \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Could you explain in more detail?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그거 멋지다. 좀 더 자세히 설명해 줄래?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>이해하지 못한 부분에 대한 \u003cb class=\"key\">설명 요청하기\u003c/b> 표현으로, \u003cb class=\"key\">Could you explain ~?\u003c/b>은 '~을 설명해 줄래요?'라는 정중한 요청입니다. \u003cb class=\"key\">in more detail\u003c/b>은 '더 자세히'라는 뜻입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">That's awesome\u003c/b>은 '그거 멋지다'라는 뜻으로 놀라움과 감탄을 나타냅니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Could you explain that in more detail?\u003c/span>\u003cspan>Can you tell me more about it?\u003c/span>\u003cspan>What do you mean by that?\u003c/span>\u003cspan>I'd like to know more about it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">First\u003c/span>, he thinks \u003csp
