  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;

    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"B. Listen and Choose","title":"중3 능률(김) 7과 Listen & Talk 2 — 미래의 식량, 가능성 표현과 설명 요청하기","audioDir":"3_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가능성 정도 표현하기 / 설명 요청하기\u003c/div>\u003ch1>중3 능률(김) 7과 Listen &amp; Talk 2 — 미래의 식량, 가능성 표현과 설명 요청하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>기후 변화로 농사짓기가 어려워지고 자원이 부족해질 수 있다는 점을 언급하며, 앞으로는 실험실에서 기른 고기와 곤충이 우리의 식량이 될 가능성이 크다고 말하는 대화입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 능률 교과서 칠과의 Listen and Talk 두 번째 대화문을 함께 공부할 거예요. 이 글은 기후 변화 때문에 앞으로 우리가 식량을 얻는 방식이 달라질 수 있다는 이야기를 담고 있죠. 미래의 음식으로 실험실 고기와 곤충이 등장한다는 아주 흥미로운 내용이에요. 그럼 오늘도 힘차게 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">As climate change is going to make farming harder, there may not be enough resources for the increasing number of people on Earth. For this reason, it is likely that we will have to change how we get our food. For example, we won't kill animals for food. Instead, meat will be grown in a lab using animal cells. This will require less land, water, and other resources. Also, bugs such as ants will become part of our daily meals. You might not want to eat them, but they are actually very rich in nutrients!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">..\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"As climate change is going to make farming harder, there may not be enough resources for the increasing number of people on Earth. For this reason, it is likely that we will have to change how we get our food. For example, we won't kill animals for food. Instead, meat will be grown in a lab using animal cells. This will require less land, water, and other resources. Also, bugs such as ants will become part of our daily meals. You might not want to eat them, but they are actually very rich in nutrients!","hl":"r-0"},{"n":3,"text":"..","hl":"r-1"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">가능성 정도 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">It is likely that + 주어 + 동사\u003c/div>\u003cdiv class=\"d-mean\">~할 가능성이 있다, ~일 것 같다\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: As climate change is going to make farming harder, there may not be enough resources for the increasing number of people on Earth. For this reason, it is likely that we will have to change how we get our food. For example, we won't kill animals for food. Instead, meat will be grown in a lab using animal cells. This will require less land, water, and other resources. Also, bugs such as ants will become part of our daily meals. You might not want to eat them, but they are actually very rich in nutrients!\u003c/div>\u003cdiv class=\"d-exp\">어떤 일이 일어날 \u003cb class=\"key\">가능성\u003c/b>이 있음을 나타낼 때 \u003cb class=\"key\">It is likely that\u003c/b> + 주어 + 동사 형태를 씁니다. ‘~할 가능성이 있다, ~일 것 같다’라는 뜻으로, 확신은 아니지만 그럴 것 같다고 조심스럽게 말할 때 자주 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>It is possible that + 주어 + 동사\u003c/li>\u003cli>Maybe + 주어 + 동사\u003c/li>\u003cli>I guess there may be ~\u003c/li>\u003cli>I'm not sure, but there will probably be ~\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I agree. It's quite likely.\u003c/li>\u003cli>That's possible.\u003c/li>\u003cli>I think so, too.\u003c/li>\u003cli>I'm not sure about that.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"이 대화에서 가장 중요한 표현은 가능성 정도를 나타내는 말이에요. It is likely that we will have to change how we get our food, 라는 문장이 나오는데, 여기서 It is likely that 뒤에 주어와 동사를 붙이면 어떤 일이 일어날 가능성이 높다는 뜻이 됩니다. 우리말로는 할 가능성이 있다, 일 것 같다, 정도로 이해하면 돼요. 그래서 앞으로 우리가 식량을 얻는 방식을 바꿔야 할 가능성이 크다는 의미예요.","hl":"key"},{"n":5,"text":"같은 뜻을 다른 말로도 표현해 볼게요. It is possible that we will have to change how we get our food, 는 그럴 수도 있다는 뜻이고요. Maybe we will have to change how we get our food, 는 아마도 그럴 것이라는 뜻이에요. I guess there may be a big change, 처럼 I guess there may be를 쓸 수도 있고, I'm not sure but there will probably be a big change, 처럼 확실하지는 않지만 아마도라고 말할 수도 있습니다.","hl":"alts"},{"n":6,"text":"그럼 이런 말에는 어떻게 대답할까요. I agree, it's quite likely, 라고 하면 그럴 가능성이 크다는 데 동의하는 말이에요. That's possible, 은 그럴 수도 있다는 뜻이고요. I think so, too, 는 나도 그렇게 생각해, 라는 뜻이에요. I'm not sure about that, 이라고 하면 글쎄, 잘 모르겠다는 뜻이 됩니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">설명 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Could you explain ~ (in more detail)?\u003c/div>\u003cdiv class=\"d-mean\">~을 좀 더 자세히 설명해 줄래요?\u003c/div>\u003cdiv class=\"d-exp\">상대방의 말 중에 이해하지 못한 부분이 있거나 \u003cb class=\"key\">의도\u003c/b>를 파악하지 못했을 때 \u003cb class=\"key\">Could you explain\u003c/b> ~?을 씁니다. ‘~을 설명해 줄래요?’라는 뜻으로, 뒤에 \u003cb class=\"key\">in more detail\u003c/b>을 붙이면 자세한 설명을 요청하는 표현이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What do you mean by that?\u003c/li>\u003cli>Can you tell me more about it?\u003c/li>\u003cli>What does that mean?\u003c/li>\u003cli>I would like to know what it means.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. I mean that we will eat more insects.\u003c/li>\u003cli>Let me explain. It means we will grow meat in a lab.\u003c/li>\u003cli>For example, we will use animal cells.\u003c/li>\u003cli>Of course. It means our meals will change.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"다음은 설명을 요청하는 표현이에요. 상대방 말을 잘 이해하지 못했을 때는 Could you explain in more detail, 이라고 말합니다. 뜻은 좀 더 자세히 설명해 줄래요, 이고요. 부사구 in detail이 자세히라는 뜻으로 함께 쓰여서 상세한 설명을 부탁하는 표현이 돼요.","hl":"key"},{"n":8,"text":"비슷한 표현도 알아 둘게요. What do you mean by that, 은 그게 무슨 말이에요, 라는 뜻이에요. Can you tell me more about it, 은 그것에 대해 더 말해 줄 수 있어요, 라는 뜻이고요. What does that mean, 은 그게 무슨 뜻이에요, 라는 뜻입니다. I would like to know what it means, 는 그게 무슨 의미인지 알고 싶어요, 라는 뜻이에요.","hl":"alts"},{"n":9,"text":"이런 질문을 받으면 어떻게 대답하면 좋을까요. Sure, I mean that we will eat more insects, 처럼 I mean that으로 시작해서 뜻을 풀어 주면 좋아요. Let me explain, 이라고 한 뒤에 차례대로 설명해도 좋고요. For example, 을 써서 예를 들어 설명해 주는 것도 아주 좋은 방법입니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 2\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">M\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As climate change is going to make farming harder\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there may not be enough resources for the increasing number of people on Earth\u003c/span>. \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">For this reason\u003c/span>, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it is likely that we will have to change how we get our food\u003c/span>. For example, we won't kill animals for food. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Instead\u003c/span>, \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">meat will be grown in a lab using animal cells\u003c/span>. \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">This will require less land, water, and other resources\u003c/span>. Also, \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">bugs such as ants will become part of our daily meals\u003c/span>. You might not want to eat them, but \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">they are actually very rich in nutrients\u003c/span>!\u003c/div>\u003cdiv class=\"d-ko\">기후 변화로 농사짓기가 더 힘들어질 것이기 때문에, 지구에서 늘어나는 사람들을 위한 자원이 충분하지 않을지도 모릅니다. 이런 이유로 우리는 식량을 얻는 방식을 바꿔야 할 가능성이 큽니다. 예를 들어, 우리는 식량을 위해 동물을 죽이지 않을 것입니다. 대신 고기는 동물 세포를 이용해 실험실에서 길러질 것입니다. 이렇게 하면 땅과 물, 그리고 다른 자원이 덜 필요하게 됩니다. 또한 개미와 같은 곤충이 우리의 일상 식사 일부가 될 것입니다. 여러분은 그것들을 먹고 싶지 않을지도 모르지만, 그것들은 사실 영양소가 아주 풍부합니다!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>여기서 \u003cb class=\"key\">As\u003c/b>는 ‘~하면서, ~때문에’라는 뜻으로 이유를 이끄는 접속사이고, \u003cb class=\"key\">be going to\u003c/b>는 ‘~할 것이다’라는 미래 예측을 나타냅니다. \u003cb class=\"key\">farming\u003c/b>은 ‘농사짓기’라는 뜻의 동명사입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">may not be\u003c/b>는 ‘~하지 않을지도 모른다, ~이 없을 수도 있다’는 가능성 표현이고, \u003cb class=\"key\">enough\u003c/b>는 명사 앞에서 ‘충분한’이라는 뜻입니다. \u003cb class=\"key\">the increasing number of\u003c/b>는 ‘늘어나는 ~의 수’로 해석합니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">It is likely that + 주어 + 동사\u003c/b>는 ‘~할 가능성이 있다, ~일 것 같다’라는 뜻의 가능성 표현입니다. \u003cb class=\"key\">how we get our food\u003c/b>는 ‘우리가 식량을 얻는 방식’이라는 뜻의 \u003cb class=\"key\">간접의문문\u003c/b>입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">For this reason\u003c/b>은 앞의 내용을 이유로 받아 ‘이런 이유로, 그래서’라고 이어 주는 \u003cb class=\"key\">연결어\u003c/b>입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">Instead\u003c/b>는 앞에서 말한 것과 반대되는 내용을 이어 ‘대신에, 그 대신’이라는 뜻을 나타내는 부사입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">will be grown\u003c/b>은 ‘길러질 것이다’라는 뜻의 \u003cb class=\"key\">수동태\u003c/b> 미래 표현입니다. \u003cb class=\"key\">using animal cells\u003c/b>는 ‘동물 세포를 이용해서’라는 뜻의 분사구입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">require\u003c/b>는 ‘필요로 하다’라는 뜻이고, \u003cb class=\"key\">less\u003c/b>는 셀 수 없는 명사 앞에서 ‘더 적은’이라는 뜻입니다. land, water, resources가 \u003cb class=\"key\">병렬구조\u003c/b>로 연결되어 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">such as\u003c/b>는 ‘~와 같은’이라는 뜻으로 예를 들 때 쓰고, \u003cb class=\"key\">become part of\u003c/b>는 ‘~의 일부가 되다’라는 뜻입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">be rich in\u003c/b>은 ‘~이 풍부하다’라는 뜻이고, \u003cb class=\"key\">nutrients\u003c/b>는 ‘영양소’라는 뜻입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>We will probably have to change how we get our food.\u003c/span>\u003cspan>It is possible that we will have to change how we get our food.\u003c/span>\u003cspan>Maybe we will have to change how we get our food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">..\u003c/div>\u003c/div>","segs":[{"n":10,"text":"자, 첫 번째 문장을 읽어 볼게요. As climate change is going to make farming harder, there may not be enough resources for the increasing number of people on Earth. 뜻은 기후 변화 때문에 농사짓기가 더 힘들어질 것이고, 지구에서 늘어나는 사람들을 위한 자원이 충분하지 않을 수도 있다는 거예요. 여기서 As는 이유를 이끄는 접속사고, may not be는 그럴 수도 있다는 가능성 표현이에요. 이어지는 문장입니다. For this reason, it is likely that we will have to change how we get our food. 이런 이유로 우리가 식량을 얻는 방식을 바꿔야 할 가능성이 크다는 뜻이고, 오늘의 핵심 표현인 It is likely that이 들어 있죠. 같은 뜻으로 We will probably have to change how we get our food, 라고도 말할 수 있어요. 다음은 For example, we won't kill animals for food. Instead, meat will be grown in a lab using animal cells. 예를 들어 식량을 위해 동물을 죽이지 않고, 대신 고기는 동물 세포로 실험실에서 길러진다는 뜻이에요. will be grown은 길러질 것이다라는 수동태 표현입니다. 이어서 This will require less land, water, and other resources. 이렇게 하면 땅과 물, 다른 자원이 덜 필요하다는 뜻이고요. Also, bugs such as ants will become part of our daily meals. 또한 개미 같은 곤충이 우리의 일상 식사 일부가 될 거예요. 마지막으로 You might not want to eat them, but they are actually very rich in nutrients. 먹고 싶지 않을 수도 있지만 사실 영양소가 아주 풍부하다는 말이에요. be rich in은 무엇이 풍부하다는 뜻입니다.","hl":"l-0"},{"n":11,"text":"..","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장과 같은 뜻이 되도록 바꾼 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">It is likely that we will have to change how we get our food.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>We will probably have to change how we get our food.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>We must change how we get our food right now.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>We don't have to change how we get our food.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>We should never change how we get our food.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>We are not likely to change how we get our food.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">We will probably have to change how we get our food.\u003c/span>\u003cdiv class=\"g-exp\">It is likely that은 ‘~할 가능성이 있다’는 뜻이므로 probably를 써서 ‘아마 ~할 것이다’로 바꿔 쓸 수 있다. 나머지 보기는 반드시 해야 한다거나 바꿀 필요가 없다는 뜻이라 원래 의미와 다르다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"첫 번째 문제예요. It is likely that we will have to change how we get our food, 와 같은 뜻이 되는 문장을 골라 보세요. 보기를 하나씩 읽고 가장 비슷한 뜻을 찾으면
