  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"C. Listen and Speak","title":"중3 능률(김) 7과 Listen & Talk 2 — 미래의 식량, 가능성 표현과 설명 요청하기","audioDir":"4_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가능성 정도 표현하기와 확인 요청하기\u003c/div>\u003ch1>중3 능률(김) 7과 대화문 Listen &amp; Talk 2 — 계산원이 없는 가게, 가능성 말하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>가게에서 오래 줄을 서서 기다린 경험을 이야기하던 두 사람이, 계산원 없이 그냥 나오면 되는 미래의 가게에 대해 이야기합니다. 마지막에는 그런 가게가 앞으로 더 흔해질 가능성이 있다고 말합니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 중학교 삼학년 능률 교과서 칠과, Listen and Talk 두 번째 대화문을 같이 공부해 볼 거예요. 오늘 이야기는 줄을 오래 서서 기다린 경험이나, 계산원이 없는 가게처럼 미래에 생길 새로운 가게에 대한 내용이에요. 이야기 속 인물들이 어떤 표현으로 되묻고 어떤 표현으로 가능성을 말하는지 잘 들어 봐요. 그럼 첫 번째 줄부터 차근차근 함께 읽어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I had to wait in line at the store for almost twenty minutes.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">That's too bad. Maybe in the future we'll never have to wait in line.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">What do you mean?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">I read about a store without cashiers. You take what you want to buy and just walk out.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">That's it? How do you pay for it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">There are cameras and sensors in the store. They keep track of the items you choose and send the information to an app on your smartphone.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Then the app pays for them when you leave the store?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Exactly. It's likely that these kinds of stores will be more common in the future.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"I had to wait in line at the store for almost twenty minutes.","hl":"r-0"},{"n":3,"text":"That's too bad. Maybe in the future we'll never have to wait in line.","hl":"r-1"},{"n":4,"text":"What do you mean?","hl":"r-2"},{"n":5,"text":"I read about a store without cashiers. You take what you want to buy and just walk out.","hl":"r-3"},{"n":6,"text":"That's it? How do you pay for it?","hl":"r-4"},{"n":7,"text":"There are cameras and sensors in the store. They keep track of the items you choose and send the information to an app on your smartphone.","hl":"r-5"},{"n":8,"text":"Then the app pays for them when you leave the store?","hl":"r-6"},{"n":9,"text":"Exactly. It's likely that these kinds of stores will be more common in the future.","hl":"r-7"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">확인 요청하기, 되묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What do you mean?\u003c/div>\u003cdiv class=\"d-mean\">그게 무슨 말이야?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: What do you mean?\u003c/div>\u003cdiv class=\"d-exp\">상대방이 한 말을 이해하지 못했거나 오해를 막기 위해 확인하려고 쓰는 \u003cb class=\"key\">되묻기\u003c/b> 표현이에요. 짧게 \u003cb class=\"key\">What do you mean?\u003c/b>이라고 말하면 그게 무슨 말이야라는 뜻이 되죠. 대화에서는 계산원이 없는 가게라는 말을 듣고 다시 확인할 때 이 표현을 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What are you talking about?\u003c/li>\u003cli>How do you mean?\u003c/li>\u003cli>Can you explain what you mean?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I mean that + 주어 + 동사\u003c/li>\u003cli>What I mean is + 내용\u003c/li>\u003cli>I'm saying that + 주어 + 동사\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"먼저 확인하는 표현을 배워 볼게요. 상대방이 한 말이 잘 이해되지 않을 때 What do you mean?이라고 물어보면 그게 무슨 말이야라는 뜻이 돼요. 대화에서도 계산원이 없는 가게라는 말을 듣고 지수가 바로 이 표현으로 다시 물었답니다.","hl":"key"},{"n":11,"text":"같은 뜻으로는 What are you talking about?이라고 말할 수 있어요. How do you mean?도 같은 상황에서 쓸 수 있고, Can you explain what you mean?처럼 조금 더 길게 물어도 좋아요.","hl":"alts"},{"n":12,"text":"이렇게 물으면 I mean that it is a store without cashiers처럼 I mean that으로 설명을 시작하면 돼요. What I mean is로 이어 말해도 자연스럽고, I am saying that으로 다시 풀어 말해 줄 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">가능성 정도 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">It is likely that + 주어 + 동사\u003c/div>\u003cdiv class=\"d-mean\">~할 가능성이 있다, ~일 것 같다\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Exactly. It's likely that these kinds of stores will be more common in the future.\u003c/div>\u003cdiv class=\"d-exp\">어떤 일이 일어날 \u003cb class=\"key\">가능성\u003c/b>을 나타낼 때 \u003cb class=\"key\">It is likely that S V\u003c/b> 형태로 쓸 수 있어요. 뜻은 ~할 가능성이 있다, ~일 것 같다이고, \u003cb class=\"key\">주어 + be likely to + 동사원형\u003c/b>으로도 바꿔 쓸 수 있답니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>It is possible that + 주어 + 동사\u003c/li>\u003cli>Maybe + 주어 + 동사\u003c/li>\u003cli>I guess there may be ~\u003c/li>\u003cli>I'm not sure but + 주어 + will probably + 동사\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Yes, I think so too.\u003c/li>\u003cli>I agree. It's very likely.\u003c/li>\u003cli>Maybe, but I'm not sure.\u003c/li>\u003cli>That's exactly what I think.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"이번에는 가능성을 말하는 표현을 배워 볼게요. It is likely that 뒤에 주어와 동사를 붙이면 어떤 일이 일어날 가능성이 있다는 뜻이 돼요. 대화의 마지막 줄처럼 It is likely that these kinds of stores will be more common in the future라고 말하면 이런 종류의 가게가 앞으로 더 흔해질 가능성이 있다는 뜻이에요.","hl":"key"},{"n":14,"text":"같은 뜻으로 It is possible that these kinds of stores will be more common이라고 해도 좋아요. Maybe these kinds of stores will be more common in the future라고 하면 아마도라는 느낌을 살릴 수 있어요. I guess there may be more of these stores in the future처럼 말해도 되고, I am not sure but there will probably be more of them이라고 조심스럽게 말할 수도 있어요.","hl":"alts"},{"n":15,"text":"이런 말에는 Yes, I think so too라고 공감해 주면 좋아요. I agree. It is very likely라고 해도 되고, Maybe, but I am not sure처럼 확신 없이 답할 수도 있어요. That is exactly what I think이라고 하면 아주 강하게 동의한다는 뜻이 된답니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 8\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had to\u003c/span> \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wait in line\u003c/span> at the store \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for almost twenty minutes\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">지수: 나는 가게에서 이십 분 가까이 줄을 서서 기다려야 했어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">wait in line\u003c/b>은 줄을 서서 기다리다라는 뜻의 어구예요. wait for가 ~을 기다리다라면, wait in line은 줄 안에서 기다린다는 뜻이죠.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>전치사 \u003cb class=\"key\">for\u003c/b> 뒤에 시간 표현이 오면 그 시간 동안이라는 뜻이 돼요. almost는 거의라는 뜻이라서 for almost twenty minutes는 이십 분 가까이 동안으로 해석해요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">had to\u003c/b>는 have to의 과거형으로 ~해야 했다는 뜻이에요. 그래서 이 문장은 줄을 서서 기다려야 했다는 과거의 상황을 말하고 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I waited in line at the store for almost twenty minutes.\u003c/span>\u003cspan>I spent almost twenty minutes standing in line at the store.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">That's too bad\u003c/span>. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Maybe in the future\u003c/span> we'll \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">never have to wait\u003c/span> in line.\u003c/div>\u003cdiv class=\"d-ko\">민준: 안됐구나. 어쩌면 앞으로는 우리가 줄을 설 필요가 없을지도 몰라.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">That's too bad\u003c/b>는 상대방의 안 좋은 상황에 안됐다는 마음을 전하는 반응 표현이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">Maybe\u003c/b>는 확신은 없지만 아마도라는 가능성을 부드럽게 나타내는 말이에요. in the future는 앞으로, 미래에라는 뜻이죠.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>have to는 ~해야 한다는 뜻이고, 여기에 \u003cb class=\"key\">never\u003c/b>가 붙으면 결코 ~할 필요가 없다는 뜻이 돼요. will never have to로 앞으로는 그럴 필요가 없을 것이라고 말하고 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That's a shame. Maybe we won't have to wait in line in the future.\u003c/span>\u003cspan>What a shame. Perhaps we'll never have to stand in line in the future.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"첫 번째 줄이에요. 지수가 말합니다. I had =\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Customers take what they want and just walk out.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The app pays for the items before customers enter the store.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Cashiers check the items with sensors at the door.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Customers need to scan a code at the cashier before leaving.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Customers take what they want and just walk out.\u003c/span>\u003cdiv class=\"g-exp\">민준이는 You take what you want to buy and just walk out이라고 했어요. 사고 싶은 것을 집어 들고 그냥 나오면 된다는 뜻이에요. 현금으로 계산대에서 내거나, 가게에 들어가기 전에 앱이 값을 치르거나, 계산원이 문에서 센서로 확인한다는 내용은 없어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"세 번째 문제예요. 대화 내용과 일치하는 보기를 고르세요. 다섯 개의 보기 중에서 알맞은 것을 골라 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 두 번째 보기예요. 사고 싶은 것을 집어 들고 그냥 나오면 된다고 했으니 손님이 원하는 물건을 가지고 나온다는 내용이 맞아요. 계산대에서 현금을 내거나, 가게에 들어가기 전에 앱이 결제하거나, 계산원이 문에서 확인한다는 말은 대화에 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 불일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화 내용과 일치하지 않는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The boy read about a store without cashiers.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The girl asks how to pay for the items.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>The boy thinks these kinds of stores will be less common in the future.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The information is sent to an app on a smartphone.\u003c/button>\u003cbutton class=\"g-opt\">\u00 . 그래서 가게를 나갈 때 앱이 값을 치른다는 내용이 맞아요. 계산원이 없는 가게라서 줄을 섰다는 말이나 계산원이 카메라와 센서를 쓴다는 말은 없어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"다섯 번째 문제예요. 대화 내용과 일치하는 보기를 고르세요. 다섯 개의 보기 중에서 알맞은 것을 골라 보세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":6},{"n":38,"text":"정답은 두 번째 보기예요. 가게를 나갈 때 앱이 물건 값을 치른다고 했고, 민준이가 바로 그거라고 확인해 줬어요. 계산원이 없어서 줄을 섰다거나, 가게에 계산원이 카메라와 센서를 쓴다거나, 앱으로 미리 물건을 골라야 한다는 말은 대화에 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">가능성 정도 표현하기와 확인 요청하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">wait in line\u003c/b>은 줄을 서서 기다리다는 뜻이고, 전치사 \u003cb class=\"key\">for\u003c/b> 뒤에 시간이 오면 ~동안이라는 뜻이 돼요.\u003c/li>\u003cli>이해하지 못한 말은 \u003cb class=\"key\">What do you mean?\u003c/b>으로 다시 물어보고, 답할 때는 I mean that으로 설명을 시작해요.\u003c/li>\u003cli>물건을 계속 파악할 때는 \u003cb class=\"key\">keep track of\u003c/b>를 쓰고, the items you choose처럼 목적격 관계대명사는 생략할 수 있어요.\u003c/li>\u003cli>가능성은 \u003cb class=\"key\">It is likely that + 주어 + 동사\u003c/b>로 말하고, 주어 + be likely to + 동사원형으로도 표현할 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":39,"text":"오늘은 계산원이 없는 가게에 대한 대화를 통해 두 가지 표현을 배웠어요. 이해하지 못한 말은 What do you mean?으로 다시 물어보면 되고, 가능성은 It is likely that 뒤에 주어와 동사를 붙여서 말하면 된답니다. 또 wait in line은 줄을 서서 기다리다, keep track of는 계속 파악하다는 뜻이었죠. 오늘 배운 표현들을 꼭 소리 내어 여러 번 연습해 보시고요, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
