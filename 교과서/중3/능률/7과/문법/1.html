</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"문법1","title":"만약 내가 너라면? 가정법 과거 완전 정복","audioDir":"1_audio","preview":false,"count":77,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가정법 과거\u003c/div>\u003ch1>만약 내가 너라면? 가정법 과거 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>현재 사실과 반대되는 상황을 가정하는 가정법 과거의 쓰임과 형태를 익히고 문장으로 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 삼학년 능률 김 교과서 칠과에서 아주 중요한 문법을 배워 볼 거예요. 바로 가정법 과거인데요, 이름은 과거지만 실제로는 지금 사실과 반대되는 상황을 상상할 때 쓰는 표현이에요. 오늘 배우고 나면 If I were you 같은 문장을 여러분도 직접 만들 수 있게 될 거예요. 그럼 힘차게 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">가정법 과거의 쓰임과 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거는 \u003cb class=\"key\">현재 사실\u003c/b>과 \u003cb class=\"key\">반대\u003c/b>되는 일이나 \u003cb class=\"key\">실현 가능성\u003c/b>이 희박한 일을 가정할 때 씁니다. 뜻은 '만약 ···하면, ~할 텐데'로, 지금 이루어지지 않는 상황을 상상하며 말할 때 써요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I had enough time\u003c/span>, I could visit them with you.\u003c/div>\u003cdiv class=\"g-ko\">만약 내가 시간이 충분하다면, 너와 함께 그들을 방문할 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">실제로는 시간이 없어서 함께 방문할 수 없다는 뜻을 담고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I had a lot of money\u003c/span>, I would buy a big house.\u003c/div>\u003cdiv class=\"g-ko\">만약 내가 돈이 많다면, 큰 집을 살 텐데.\u003c/div>\u003cdiv class=\"g-note\">지금은 돈이 많지 않다는 사실을 반대로 상상한 문장이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가정법 과거는 과거의 일이 아니라 \u003cb class=\"key\">현재\u003c/b>의 반대 상황을 나타내니, 해석할 때도 현재 시점으로 생각해야 해요. 주절에는 will이 아니라 \u003cb class=\"key\">조동사의 과거형\u003c/b>이 온다는 것도 잊지 마세요.\u003c/div>","segs":[{"n":2,"text":"가정법 과거는 지금 사실과 반대되는 상황을 머릿속으로 그려 볼 때 쓰는 표현이에요. 예를 들어 지금은 시간이 없어서 친구를 만나지 못하는데, 시간이 있다고 가정해서 말하고 싶을 때 쓰죠. 이때 뜻은 만약 그렇다면 이렇게 할 텐데라는 느낌이에요. 실제로는 그렇지 않다는 마음이 담겨 있다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 함께 볼게요. If I had enough time, I could visit them with you. 뜻은 만약 내가 시간이 충분하다면 너와 함께 그들을 방문할 수 있을 텐데예요. 지금은 시간이 없어서 함께 방문할 수 없다는 사실을 반대로 가정한 문장이에요.","hl":"ex-0"},{"n":4,"text":"이번에는 제가 준비한 예문이에요. If I had a lot of money, I would buy a big house. 뜻은 만약 내가 돈이 많다면 큰 집을 살 텐데예요. 지금은 돈이 많지 않다는 사실을 반대로 상상한 문장이죠.","hl":"ex-1"},{"n":5,"text":"여기서 주의할 점이 하나 있어요. 가정법 과거는 이름에 과거가 들어가지만 과거의 일을 말하는 게 아니라 지금 현재와 반대되는 상황을 말해요. 그래서 해석할 때도 지금 시점으로 해석해야 하고, 주절에는 will이 아니라 would나 could 같은 조동사의 과거형이 온다는 것도 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">가정법 과거의 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거는 If 절에 \u003cb class=\"key\">동사의 과거형\u003c/b>을 쓰고, 주절에는 \u003cb class=\"key\">조동사의 과거형\u003c/b>과 \u003cb class=\"key\">동사원형\u003c/b>을 씁니다. 주절의 조동사는 보통 would를 쓰고, can이나 may는 could, might로 바꿔 써요.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + 동사의 과거형 ···, 주어 + 조동사의 과거형 + 동사원형 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If you exercised more\u003c/span>, you would lose weight.\u003c/div>\u003cdiv class=\"g-ko\">만약 네가 더 운동한다면, 너는 살을 뺄 텐데.\u003c/div>\u003cdiv class=\"g-note\">실제로는 운동을 더 하지 않아서 살이 빠지지 않는다는 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I knew his number\u003c/span>, I would call him.\u003c/div>\u003cdiv class=\"g-ko\">만약 내가 그의 전화번호를 안다면, 그에게 전화할 텐데.\u003c/div>\u003cdiv class=\"g-note\">If 절에 knew라는 과거형이, 주절에 would call이 온 문장이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>If 절에 과거형이 있다고 해서 \u003cb class=\"key\">과거\u003c/b>의 일을 말하는 게 아니라는 점을 헷갈리지 마세요. 주절에는 \u003cb class=\"key\">동사원형\u003c/b>이 온다는 것도 꼭 확인해요.\u003c/div>","segs":[{"n":6,"text":"이제 형태를 정리해 볼게요. If 뒤에는 동사의 과거형이 오고, 뒤쪽 주절에는 조동사의 과거형과 동사원형이 와요. 조동사는 보통 would를 쓰고, can은 could로, may는 might로 바꿔 준다고 생각하면 쉬워요. 그래서 If 절에는 과거형이, 주절에는 would나 could 다음에 동사원형이 온다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":7,"text":"If you exercised more, you would lose weight. 뜻은 만약 네가 더 운동한다면 너는 살을 뺄 텐데예요. 실제로는 운동을 더 하지 않아서 살이 빠지지 않는다는 뜻이 담겨 있어요. If 뒤에 exercised가 오고, 주절에 would와 동사원형 lose가 온 것도 확인해 보세요.","hl":"ex-0"},{"n":8,"text":"이번 문장도 함께 볼게요. If I knew his number, I would call him. 뜻은 만약 내가 그의 전화번호를 안다면 그에게 전화할 텐데예요. If 뒤에 knew라는 과거형이 오고, 주절에 would call이 온 문장이에요.","hl":"ex-1"},{"n":9,"text":"형태에서 가장 헷갈리는 부분이에요. If 절에 동사의 과거형이 있다고 해서 과거의 일을 말하는 게 아니라는 점을 꼭 기억해 주세요. 그리고 주절에서 would나 could 다음에는 반드시 동사원형이 온다는 것도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">be동사는 were로\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거에서 If 절의 동사가 \u003cb class=\"key\">be동사\u003c/b>일 때는 인칭과 수에 상관없이 \u003cb class=\"key\">were\u003c/b>를 씁니다. 단, \u003cb class=\"key\">구어체\u003c/b>에서는 was를 쓰기도 해요.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + were ···, 주어 + 조동사의 과거형 + 동사원형 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I were you\u003c/span>, I would stay at home.\u003c/div>\u003cdiv class=\"g-ko\">만약 내가 너라면, 집에 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">I 뒤에 were를 쓴 대표적인 가정법 과거 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If she were rich\u003c/span>, she could travel all around the world.\u003c/div>\u003cdiv class=\"g-ko\">만약 그녀가 부자라면, 전 세계를 여행할 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">she 뒤에도 were를 쓰고, 주절에는 could와 동사원형이 왔어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>If 절의 주어가 I나 he, she여도 \u003cb class=\"key\">were\u003c/b>를 쓰는 것이 원칙이에요. 일상 대화인 \u003cb class=\"key\">구어체\u003c/b>에서는 was도 가능하다는 정도만 알아 두세요.\u003c/div>","segs":[{"n":10,"text":"이번에는 be동사 차례예요. 가정법 과거에서 If 절에 be동사가 들어가면 인칭과 수에 상관없이 were를 씁니다. I 뒤에도, she 뒤에도 모두 were를 쓰는 거죠. 다만 실제로 일상 대화인 구어체에서는 was를 쓰기도 한다는 점도 함께 알아 두세요.","hl":"rule"},{"n":11,"text":"If I were you, I would stay at home. 뜻은 만약 내가 너라면 집에 있을 텐데예요. 여기서 I 뒤에 were를 쓴 것이 핵심이에요. 인칭과 수에 상관없이 were를 쓴다는 점을 꼭 기억해 주세요.","hl":"ex-0"},{"n":12,"text":"If she were rich, she could travel all around the world. 뜻은 만약 그녀가 부자라면 전 세계를 여행할 수 있을 텐데예요. she 뒤에도 were를 썼고, 주절에는 could와 동사원형 travel이 왔어요.","hl":"ex-1"},{"n":13,"text":"한 가지만 더 짚어 볼게요. If 절의 주어가 I여도, he나 she여도 were를 쓰는 것이 원칙이에요. 일상 대화인 구어체에서는 was도 가능하다는 정도만 알아 두면 충분해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I am you, I would stay at home.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I were you, I would stay at home.\u003c/div>\u003cdiv class=\"g-why\">가정법 과거에서 If 절의 be동사는 were를 써야 하기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If you exercise more, you would lose weight.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If you exercised more, you would lose weight.\u003c/div>\u003cdiv class=\"g-why\">If 절에는 현재형이 아니라 동사의 과거형을 써야 하기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I had enough time, I can visit them with you.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I had enough time, I could visit them with you.\u003c/div>\u003cdiv class=\"g-why\">주절에는 현재의 can이 아니라 과거형 could를 써야 하기 때문이에요.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 가장 많이 하는 실수예요. If I am you, I would stay at home이라고 쓰면 틀려요. 가정법 과거에서 If 절의 be동사는 were를 써야 하니까 If I were you, I would stay at home이라고 해야 맞아요.","hl":"mk-0"},{"n":15,"text":"If you exercise more, you would lose weight라고 쓰는 실수도 아주 많아요. If 절에는 현재형이 아니라 동사의 과거형을 써야 하므로 If you exercised more, you would lose weight가 맞아요.","hl":"mk-1"},{"n":16,"text":"이번에는 주절에서 실수한 경우예요. If I had enough time, I can visit them with you라고 하면 틀려요. 주절에는 현재의 can이 아니라 과거형 could를 써야 해서 If I had enough time, I could visit them with you가 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 가정법 과거 문장으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>If I have enough time, I can visit them with you.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>If I had enough time, I could visit them with you.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>If I will have enough time, I could visit them with you.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>If I had enough time, I can visit them with you.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">2\u003c/span>\u003cdiv class=\"g-exp\">가정법 과거는 If 절에 동사의 과거형을, 주절에 조동사의 과거형과 동사원형을 씁니다. 따라서 If I had enough time, I could visit them with you.가 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제는 객관식이에요. 가정법 과거 문장으로 알맞은 것을 고르는 문제인데요, 보기를 하나씩 소리 내어 읽어 보고 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 두 번째 보기예요. If I had enough time, I could visit them with you. 가정법 과거는 If 절에 동사의 과거형을 쓰고 주절에 조동사의 과거형과 동사원형을 써요. 첫 번째 보기는 현재형을 썼고, 세 번째 보기는 will을 썼고, 네 번째 보기는 주절에 can을 썼기 때문에 모두 알맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u
