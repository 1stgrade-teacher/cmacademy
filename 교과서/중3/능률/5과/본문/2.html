1GaikY7GwOx6/ewCQwx2zj3457HEbMuckjDHgEjufUnnkcfy6Yu2FlPqV1b2VohmnuplgjjUbsvKdozgHCqAzu5G1I1MjEKpNDas3zKy1bvdWW/3/AKlU6UpTjTjFzm7RjGL5pTk2lFWtfmk2tOremh//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Underwater Museums: A Creative Strategy for Marine Conservation<small>수중 박물관: 해양 보존을 위한 창의적인 전략</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 &#39;인공 어초(Artificial Reef)&#39;라는 개념을 들어본 적 있나요? 바다 생태계가 파괴된 곳에 사람이 만든 구조물을 설치하면, 시간이 지나면서 그곳에 산호나 해조류가 붙어 자라나고 다양한 물고기들이 모여드는 새로운 바닷속 보금자리가 된답니다. 이번 지문에서는 예술가들이 조각상을 활용해 이런 자연친화적인 환경을 만드는 방식을 다루고 있는데, 이는 단순히 예쁜 작품을 설치하는 것을 넘어 관광객들의 발길을 분산시켜 자연을 보호하려는 창의적인 시도라고 볼 수 있어요. 마치 우리가 붐비는 유명한 맛집 대신 근처의 새로운 명소를 찾아가며 동네의 상권이 골고루 살아나는 것처럼, 바다에서도 인간의 활동과 자연의 회복이 공존하는 방법을 찾으려는 노력을 보여주는 것이죠. 이렇게 인공 구조물이 자연의 일부가 되어 생태계를 살리는 과정을 이해하면, 예술이 환경 문제와 어떻게 상호작용하는지 더 깊이 파악할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 해결을 위한 전략</div><ul><li>예술가들은 관광객의 발길을 돌려 죽어가는 바다 구역을 회복시키고자 했다.</li><li>바다 생태계가 파괴되는 곳에서 멀리 떨어진 곳에 장소를 선정</li><li>관광객들을 다른 지역으로 유도(attract)하여 손상된 구역의 회복 시간 확보</li><li>핵심 키워드: 바다 환경 보호(protecting the sea)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수중 박물관의 조성</div><ul><li>해수면 아래에 수백 개의 조각상을 배치하여 새로운 공간을 만들었다.</li><li>수면 아래 약 14미터 지점에 수중 박물관(underwater museum) 설치</li><li>총 500개의 조각상(statues)으로 구성</li><li>핵심 키워드: 수중 예술(underwater art)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03생태계 보존 기능</div><ul><li>조각상은 단순히 보는 예술품을 넘어 해양 생물의 서식지를 제공한다.</li><li>해양 생물이 살기 좋은 재료(materials)를 사용하여 제작</li><li>식물과 동물이 부착하여 살 수 있는 공간 제공</li><li>시간이 지나며 조각상 위에 다양한 해양 생물(sea life)이 자라남</li><li>핵심 키워드: 서식지 제공(providing habitat)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04환경 인식 제고</div><ul><li>예술 작품을 통해 사람들이 바다 보호의 중요성을 깨닫게 하려는 목적이 있다.</li><li>조각상 위에서 자라나는 생물들을 직접 관찰하게 함</li><li>풍부한 해양 생태계를 목격하며 바다의 가치를 이해함</li><li>바다를 살려야 할 필요성(importance of saving the sea)을 인식하게 함</li><li>핵심 키워드: 환경 인식(environmental awareness)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent</td><td class=\"m\">막다, 예방하다</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">tourist</td><td class=\"m\">관광객</td></tr><tr><td class=\"w\">dying</td><td class=\"m\">죽어가는</td></tr><tr><td class=\"w\">underwater</td><td class=\"m\">수중의, 물속의</td></tr><tr><td class=\"w\">surface</td><td class=\"m\">표면, 수면</td></tr><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 들어 있다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">material</td><td class=\"m\">재료, 물질</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지탱하다, 뒷받침하다, 살 수 있게 하다</td></tr><tr><td class=\"w\">additional</td><td class=\"m\">추가적인</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실감하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이를 방지하기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To prevent</span> this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술가들이</span><span class=\"en\"><b>artists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가 재미난 일을</span><span class=\"en\"><b>did</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">했습니다.</span><span class=\"en\"><b>something interesting.</b></span></div></div><div class=\"lec-sent-ko\">이를 방지하기 위해, 예술가들이 무언가 재미난 일을 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급된 &#39;바닷속 생태계 파괴&#39;라는 문제를 해결하기 위해, 예술가들이 기발한 아이디어를 실행에 옮겼음을 알리는 문장입니다. 여기서 interesting은 단순한 &#39;재미있는&#39;이라는 사전적 의미를 넘어, 문제 해결을 위한 &#39;창의적이고 독특한&#39; 방식이라는 점을 강조하여 독자의 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To prevent (to부정사): 문장 전체의 목적을 나타내는 부사적 용법(~하기 위해서)으로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent</td><td class=\"m\">막다, 예방하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각했는데</span><span class=\"en\"><b>They thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 관광객들을 유인한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if they attracted</span> tourists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다의 다른 쪽으로</span><span class=\"en\"><b>to a different part of the sea,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 죽어가는 지역이</span><span class=\"en\"><b>the <span class=\"grammar-hl\">dying areas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 가질 수 있을 것이라</span><span class=\"en\"><b>could have time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호전될.</span><span class=\"en\"><b>to get better.</b></span></div></div><div class=\"lec-sent-ko\">그들은 만약 관광객들을 바다의 다른 쪽으로 유인한다면, 그 죽어가는 지역이 호전될 시간을 가질 수 있을 것이라 생각했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술가들이 세운 전략적 계획을 설명합니다. 관광객의 발길을 돌려 특정 구역의 환경을 보호하려는 &#39;분산 효과&#39;를 의도했습니다. attract는 &#39;끌어당기다&#39;라는 뜻인데, 여기서는 관광객을 특정 장소로 &#39;유도하여 집중을 분산시키는&#39; 목적을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if they attracted 가정법 과거: if + S + 과거동사(attracted), S + 조동사과거(could) + 동사원형 구조로, 현재 사실과 반대되거나 실현 가능성이 낮은 가정을 나타냄.</div><div class=\"lec-gr-item\">dying areas (현재분사): dying이 areas를 수식하며 &#39;죽어가는(상태)&#39;이라는 의미를 나타냄. (areas that are dying)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">tourist</td><td class=\"m\">관광객</td></tr><tr><td class=\"w\">dying</td><td class=\"m\">죽어가는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 만들었는데</span><span class=\"en\"><b>They made</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수중 박물관을</span><span class=\"en\"><b>an underwater museum</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지역으로부터 떨어진 곳에</span><span class=\"en\"><b>away from the places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해양 생물이</span><span class=\"en\"><b><span class=\"grammar-hl\">where sea life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죽어가는.</span><span class=\"en\"><b><span class=\"grammar-hl\">was dying</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 해양 생물이 죽어가는 지역으로부터 떨어진 곳에 수중 박물관을 만들었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 생각을 실천한 구체적인 결과물입니다. &#39;죽어가는 곳&#39;과 &#39;박물관&#39;을 지리적으로 격리(away from)함으로써 보호 구역을 확보하려는 논리적 대응을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where sea life was dying (관계부사): 장소(the places)를 선행사로 가지며, 뒤에 완전한 문장(sea life was dying)이 이어지는 관계부사절임.</div><div class=\"lec-gr-item\">was dying (과거진행): be동사(was) + 현재분사(dying) 형태로 과거의 특정 시점에 진행 중이었던 동작을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dying</td><td class=\"m\">죽어가는</td></tr><tr><td class=\"w\">underwater</td><td class=\"m\">수중의, 물속의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳은</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해수면에서 약 14미터 아래에 있으며</span><span class=\"en\"><b><span class=\"grammar-hl\">about 14 meters below the surface</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">500개의 조각상을</span><span class=\"en\"><b>and contains</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있습니다.</span><span class=\"en\"><b>500 statues.</b></span></div></div><div class=\"lec-sent-ko\">그곳은 해수면에서 약 14미터 아래에 있으며 500개의 조각상이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수중 박물관의 물리적 위치와 규모를 구체적으로 묘사하여 독자에게 시각적인 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s about 14 meters below the surface (관용표현): It&#39;s(~이다/상태) 구조를 통해 장소나 거리를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surface</td><td class=\"m\">표면, 수면</td></tr><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 들어 있다</td></tr><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 조각상들은</span><span class=\"en\"><b>The statues</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재료들로 만들어졌는데</span><span class=\"en\"><b><span class=\"grammar-hl\">are made from</span> materials</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해양 생물이 살아갈 수 있게 하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that support sea life</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 조각상들은 해양 생물이 살아갈 수 있게 하는 재료들로 만들어졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 보여주기 위한 조각상이 아니라, 해양 생태계를 돕는 &#39;기능성&#39; 소재임을 강조합니다. support는 사전적으로 &#39;지지하다&#39;이지만, 여기서는 해양 생물이 그 위에서 자라나고 생존할 수 있도록 &#39;환경을 제공하고 돕는&#39; 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are made from (수동태): be동사(are)+p.p.(made) 구조. make는 타동사(기본구조: make O)인데 뒤에 목적어가 없어서 수동구조 are made 형태로 쓴다.</div><div class=\"lec-gr-item\">that support sea life (관계대명사): 주격 관계대명사 that이 선행사(materials)를 수식하며, 절 내부에서 주어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">material</td><td class=\"m\">재료, 물질</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지탱하다, 뒷받침하다, 살 수 있게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 제공하는데</span><span class=\"en\"><b>They provide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장소를 추가로</span><span class=\"en\"><b>additional places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동식물이</span><span class=\"en\"><b>for plants and animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살 수 있는.</span><span class=\"en\"><b><span class=\"grammar-hl\">to live on</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 동식물이 살 수 있는 장소를 추가로 제공합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에 이어, 조각상이 생태계의 서식지로서 어떤 역할을 하는지 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to live on (to부정사): 형용사적 용법으로 앞의 명사(places)를 수식하며, (~할 장소)라는 의미를 가짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">additional</td><td class=\"m\">추가적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 지나면서</span><span class=\"en\"><b>Over time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 종류의 해양 생물이</span><span class=\"en\"><b>many types of sea life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조각상 위에서 자랄 것인데</span><span class=\"en\"><b>will grow on the statues,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 그 예술 작품을</span><span class=\"en\"><b><span class=\"grammar-hl\">which will make the artwork</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독특하게 만들 것입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">unique</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간이 지나면서 많은 종류의 해양 생물이 조각상 위에서 자랄 것인데, 이는 그 예술 작품을 독특하게 만들 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간이 흐름에 따라 예술품과 자연이 결합하여 변화할 미래를 예고합니다. unique는 &#39;독특한&#39;이라는 사전적 의미인데, 여기서는 자연의 생명력이 더해져 세상에 단 하나뿐인 &#39;살아있는 예술품&#39;이 된다는 긍정적인 변화를 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which will make the artwork unique (관계대명사): 계속적 용법의 관계대명사(which)가 앞 문장 전체 내용을 부연 설명함.</div><div class=\"lec-gr-item\">make the artwork unique (5형식(SVOC)): make(동사) + the artwork(목적어) + unique(형용사 목적보어) 구조로, 목적어를 보어한 상태로 만들다는 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예술가들은</span><span class=\"en\"><b>The artists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 ~하길 원하는데</span><span class=\"en\"><b><span class=\"grammar-hl\">want</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보길</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 해양 생물을</span><span class=\"en\"><b>a variety of sea life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조각상에서.</span><span class=\"en\"><b>on the statues.</b></span></div></div><div class=\"lec-sent-ko\">예술가들은 사람들이 조각상에서 다양한 해양 생물을 보길 원합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술가들이 이 프로젝트를 통해 사람들에게 보여주고자 하는 궁극적인 시각적 경험을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want people to see (5형식(SVOC)): want(동사) + people(목적어) + to see(to부정사 목적보어) 구조로, 목적어가 ~하기를 원하다는 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성, 여러 가지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 사람들이 깨닫는다면</span><span class=\"en\"><b>If people realize</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해양 생물이 얼마나 풍부한지</span><span class=\"en\"><b><span class=\"grammar-hl\">how rich sea life is</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해하게 될 것입니다</span><span class=\"en\"><b>will understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼마나 중요한지</span><span class=\"en\"><b><span class=\"grammar-hl\">how important it is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다를 지키는 것이.</span><span class=\"en\"><b><span class=\"grammar-hl\">to save the sea</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 사람들이 해양 생물이 얼마나 풍부한지 깨닫는다면, 그들은 바다를 지키는 것이 얼마나 중요한지 이해하게 될 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 최종 목적입니다. 예술을 통한 환경 보호의 인식을 유도하는 것이며, &#39;깨달음(realize)&#39;이 &#39;이해(understand)&#39;와 &#39;보호&#39;로 이어지는 인과 관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how rich sea life is (간접의문문): 의문사(how) + S + V 어순으로 문장 내에서 동사(realize)의 목적어 역할을 함.</div><div class=\"lec-gr-item\">how important it is to save the sea (간접의문문): 의문사(how) + 형용사(important) + S(it) + V(is) 어순으로 문장 내에서 동사(understand)의 목적어 역할을 함.</div><div class=\"lec-gr-item\">it is to save (가주어): 진주어: it(가주어) + is(동사) + important(보어) + to save(진주어/to부정사) 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실감하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>예술가들은 해양 생태계 보호를 위해 관광객을 다른 곳으로 유도하는 수중 박물관을 만들었다.</li><li>수중 조각상들은 단순히 관람용이 아니라 해양 생물의 서식지 역할을 한다.</li><li>시간이 흐르며 조각상에 생명체가 자라나고, 이를 통해 사람들은 바다 보호의 중요성을 깨닫게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Artists built an underwater museum to protect damaged sea areas, and they hope this project encourages people to preserve marine life.</div>\n              <div class=\"lec-final-sum-ko\">예술가들은 훼손된 해역을 보호하기 위해 수중 박물관을 건설했고, 이 프로젝트를 통해 사람들이 해양 생태계 보존에 관심을 갖기를 기대한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null}],[{"audio":"./2_audio/4.mp3","hl":null}],[{"audio":"./2_audio/5.mp3","hl":null}],[{"audio":"./2_audio/6.mp3","hl":null}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":null}],[{"audio":"./2_audio/10.mp3","hl":null}],[{"audio":"./2_audio/11.mp3","hl":null}],[{"audio":"./2_audio/12.mp3","hl":null}],[{"audio":"./2_audio/13.mp3","hl":null}],[{"audio":"./2_audio/14.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requ
