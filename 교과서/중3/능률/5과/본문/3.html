tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01배경 문제 제기</div><ul><li>싱가포르의 더운 기후 때문에 냉방 에너지 사용량이 많아 환경 문제가 발생한다.</li><li>연중 내내 더운 날씨 (hot throughout the year)</li><li>과도한 냉방(air conditioning) 사용이 기후 변화(climate change)를 유발함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02친환경 건축의 목적</div><ul><li>건축가들은 냉방 의존도를 낮추면서도 실내 온도를 시원하게 유지하는 건물을 설계한다.</li><li>에너지를 적게 쓰는 친환경 건물(eco-friendly buildings) 설계</li><li>냉방 장치 없이 시원함 유지</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03설계 방식</div><ul><li>외부 공기가 자유롭게 순환하도록 돕는 개방형 구조를 적극적으로 활용한다.</li><li>외부 공기가 건물 전체로 이동하는 개방형 구조(open structure) 채택</li><li>자연적인 공기 흐름(natural air flow)을 이용한 냉각 효과</li><li>핵심 키워드: 자연 환기(natural ventilation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architecture</td><td class=\"m\">건축(술), 건축 양식</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr><tr><td class=\"w\">throughout</td><td class=\"m\">~동안 내내, 도처에</td></tr><tr><td class=\"w\">air conditioning</td><td class=\"m\">에어컨, 냉방 장치</td></tr><tr><td class=\"w\">contribute to</td><td class=\"m\">~의 원인이 되다, ~에 기여하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">climate change</td><td class=\"m\">기후 변화</td></tr><tr><td class=\"w\">design</td><td class=\"m\">설계하다, 디자인하다</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조, 건축물</td></tr><tr><td class=\"w\">make it possible for ~ to</td><td class=\"m\">~가 ~하는 것을 가능하게 하다</td></tr><tr><td class=\"w\">natural</td><td class=\"m\">자연의, 당연한</td></tr><tr><td class=\"w\">flow</td><td class=\"m\">흐름, 이동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">싱가포르에서는</span><span class=\"en\"><b>In Singapore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 건축을 이용하고 있는데</span><span class=\"en\"><b>people <span class=\"grammar-hl\">are using</span> architecture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호하기 위해</span><span class=\"en\"><b>to protect the environment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅 위에서.</span><span class=\"en\"><b>on land.</b></span></div></div><div class=\"lec-sent-ko\">싱가포르에서는 사람들이 땅 위에서 환경을 보호하기 위해 건축을 이용하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 싱가포르가 환경 보호라는 목적을 달성하기 위한 구체적인 수단으로 &#39;건축&#39;을 선택했음을 밝히며, 전체 글의 주제를 제시하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are using (현재진행): be동사(are) + 현재분사(-ing) 구조로, 현재 어떤 동작이 진행 중임을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architecture</td><td class=\"m\">건축(술), 건축 양식</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">들어 보자</span><span class=\"en\"><b>Let’s hear</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건축가인 Rajesh Khan이 무엇을 말하는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">what Rajesh Khan,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건축가인</span><span class=\"en\"><b><span class=\"grammar-hl\">an architect,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">says</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친환경 건물에 대해.</span><span class=\"en\"><b>about eco-friendly buildings.</b></span></div></div><div class=\"lec-sent-ko\">건축가인 Rajesh Khan이 친환경 건물에 대해 말하는 것을 들어 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;건축을 통한 환경 보호&#39;를 구체적인 전문가의 의견을 통해 뒷받침하겠다는 내용을 전달하며 자연스럽게 인터뷰 내용으로 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what Rajesh Khan, an architect, says (간접의문문): 의문사(what) + S(Rajesh Khan) + V(says) 구조로, &#39;hear&#39;의 목적어 역할을 하는 명사절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">싱가포르는</span><span class=\"en\"><b>Singapore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덥습니다</span><span class=\"en\"><b>is hot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일 년 내내.</span><span class=\"en\"><b><span class=\"grammar-hl\">throughout the year</span>.</b></span></div></div><div class=\"lec-sent-ko\">싱가포르는 일 년 내내 덥습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 싱가포르가 겪고 있는 지리적, 기후적 특성을 설명하며 뒤에 나올 문제 상황의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">throughout the year (관용표현): &#39;일 년 내내&#39;라는 의미의 전치사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throughout</td><td class=\"m\">~동안 내내, 도처에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대부분의 건물들이</span><span class=\"en\"><b>Most buildings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에어컨 가동을 필요로 하는데</span><span class=\"en\"><b>need air conditioning<span class=\"grammar-hl\">,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 많은 에너지를 사용하며</span><span class=\"en\"><b><span class=\"grammar-hl\">which uses</span> a lot of energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기후 변화의 원인이 됩니다.</span><span class=\"en\"><b>and contributes to climate change.</b></span></div></div><div class=\"lec-sent-ko\">대부분의 건물들이 에어컨 가동을 필요로 하는데, 그것은 많은 에너지를 사용하며 기후 변화의 원인이 됩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> contributes to는 사전적으로 &#39;기여하다&#39;라는 뜻이지만, 여기서는 부정적인 결과인 &#39;기후 변화&#39;가 일어나는 데 일조한다는 의미로 쓰였습니다. 필자는 건축이 환경을 파괴하는 원인임을 강조하기 위해 이 표현을 선택했습니다. 앞 문장의 &#39;더운 날씨&#39;라는 원인이 &#39;에너지 낭비와 기후 변화&#39;라는 결과로 이어지는 인과 관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">, which uses (관계대명사): 계속적 용법의 관계대명사(which)로, 앞 문장 전체의 내용을 선행사로 받아 부연 설명함. 절 내부에서 주어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">air conditioning</td><td class=\"m\">에어컨, 냉방 장치</td></tr><tr><td class=\"w\">climate change</td><td class=\"m\">기후 변화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 이유입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">싱가포르의 건축가들이</span><span class=\"en\"><b>architects in Singapore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친환경 건물을 설계하기 시작한</span><span class=\"en\"><b>have begun to design eco-friendly buildings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에어컨을 덜 사용하면서도</span><span class=\"en\"><b><span class=\"grammar-hl\">that use less air conditioning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실내는 여전히 시원한.</span><span class=\"en\"><b>but <span class=\"grammar-hl\">are still cool</span> inside.</b></span></div></div><div class=\"lec-sent-ko\">그것이 싱가포르의 건축가들이 에어컨을 덜 사용하면서도 실내는 여전히 시원한 친환경 건물을 설계하기 시작한 이유입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 &#39;기후 변화&#39;라는 문제를 해결하기 위해 등장한 &#39;친환경 건축&#39;이라는 새로운 해결책을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s why (관계부사): &#39;the reason(생략) why&#39; 구조로, 선행사가 reason일 때 사용하는 관계부사 why절</div><div class=\"lec-gr-item\">that use less air conditioning (관계대명사): 주격 관계대명사 that이 뒤의 동사(use)를 이끌며 선행사(eco-friendly buildings)를 수식</div><div class=\"lec-gr-item\">are still cool 5형식(SVOC) 구조의 변형: 앞선 문맥에서 생략된 주어를 공유하며, &#39;cool&#39;은 건물의 상태를 설명하는 보어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr><tr><td class=\"w\">air conditioning</td><td class=\"m\">에어컨, 냉방 장치</td></tr><tr><td class=\"w\">design</td><td class=\"m\">설계하다, 디자인하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">싱가포르의 많은 건물은</span><span class=\"en\"><b>many buildings in Singapore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설계되는데</span><span class=\"en\"><b><span class=\"grammar-hl\">are designed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개방형 구조를 갖도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">to have</span> an open structure.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 싱가포르의 많은 건물은 개방형 구조를 갖도록 설계됩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;친환경 설계&#39;에 대한 구체적인 사례를 제시하기 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are designed (수동태): be동사(are) + p.p.(designed) 구조. design은 타동사인데 목적어가 없어서 수동구조(are designed) 형태로 쓴다. 기본구조: design + O(목적어)</div><div class=\"lec-gr-item\">to have (to부정사): 앞의 수동태 동사구(are designed)의 목적이나 결과를 부가적으로 설명하는 부사적 용법</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">설계하다, 디자인하다</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조, 건축물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 구조는</span><span class=\"en\"><b>This structure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능하게 만들어 주는데</span><span class=\"en\"><b><span class=\"grammar-hl\">makes it possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바깥 공기가</span><span class=\"en\"><b><span class=\"grammar-hl\">for outside air</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건물 구석구석까지 이동할 수 있게.</span><span class=\"en\"><b><span class=\"grammar-hl\">to move</span> throughout a building.</b></span></div></div><div class=\"lec-sent-ko\">이러한 구조는 바깥 공기가 건물 구석구석까지 이동할 수 있게 해 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> structure는 사전적으로 &#39;구조&#39;를 뜻하는데, 여기서는 건물 설계 방식 그 자체를 의미합니다. &#39;개방적&#39;이라는 특징을 기술적으로 어떻게 구현하는지를 설명하며 원리를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes it possible for outside air to move (5형식(SVOC)): &#39;make + O(가목적어 it) + C(형용사 possible) + 진목적어(to부정사)&#39; 구조. 여기서 for outside air는 to부정사의 의미상 주어임</div><div class=\"lec-gr-item\">to move (to부정사): 5형식 구조의 진목적어로서 &#39;air&#39;가 수행하는 동작을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throughout</td><td class=\"m\">~동안 내내, 도처에</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조, 건축물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 자연적인 공기의 흐름은</span><span class=\"en\"><b>This natural air flow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방법입니다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 건물들이 시원하게 유지되는.</span><span class=\"en\"><b><span class=\"grammar-hl\">how these buildings stay cool</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 자연적인 공기의 흐름은 이 건물들이 시원하게 유지되는 방법입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> flow는 사전적으로 &#39;흐름&#39;이지만, 여기서는 건물 내부를 순환하는 바람을 의미합니다. 앞 문장에서 설명한 원리가 어떻게 건물을 시원하게 유지하는지 정리하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how these buildings stay cool (간접의문문): 의문부사(how) + S(these buildings) + V(stay) 구조로, 주격 보어 역할을 하는 명사절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">natural</td><td class=\"m\">자연의, 당연한</td></tr><tr><td class=\"w\">flow</td><td class=\"m\">흐름, 이동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Rajesh Khan / 건축가</span><span class=\"en\"><b><span class=\"grammar-hl\">Rajesh Khan</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">Architect</span></b></span></div></div><div class=\"lec-sent-ko\">(Rajesh Khan / 건축가)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Rajesh Khan Architect (관용표현): 인물 이름 뒤에 직함을 붙여 설명하는 동격 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>싱가포르는 일 년 내내 더운 기후 때문에 에어컨 사용이 많아 기후 변화에 악영향을 준다.</li><li>이를 해결하기 위해 싱가포르 건축가들은 에어컨을 덜 쓰고도 시원한 친환경 건축을 설계한다.</li><li>그 핵심 방법은 개방적인 구조를 통해 자연적인 공기 흐름을 유도하는 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Singaporean buildings use open structures to allow natural air flow, and they do this to decrease energy use while keeping the interior cool.</div>\n              <div class=\"lec-final-sum-ko\">싱가포르의 건물들은 자연적인 공기 흐름을 위해 개방형 구조를 사용하며, 실내를 시원하게 유지하면서 에너지 사용을 줄이기 위해 이렇게 설계한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null}],[{"audio":"./3_audio/4.mp3","hl":null}],[{"audio":"./3_audio/5.mp3","hl":null}],[{"audio":"./3_audio/6.mp3","hl":null}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":null}],[{"audio":"./3_audio/10.mp3","hl":null}],[{"audio":"./3_audio/11.mp3","hl":null}],[{"audio":"./3_audio/12.mp3","hl":null}],[{"audio":".
