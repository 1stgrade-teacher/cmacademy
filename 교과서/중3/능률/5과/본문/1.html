lass=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01환경 보호의 필요성</div><ul><li>환경을 지키는 것은 우리 모두에게 중요한 과제이며, 사람들은 이를 위해 창의적인 방법을 찾고 있다.</li><li>지구를 살리기 위한 창의적 노력 (creative ways to save the earth)</li><li>멕시코 칸쿤의 수중 박물관 사례 (underwater museum)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02칸쿤의 관광 현황</div><ul><li>칸쿤은 매년 수많은 관광객이 방문하는 유명한 도시로, 수중 생태계 관람이 가장 인기 있는 활동이다.</li><li>연간 480만 명의 관광객이 방문 (4.8 million tourists)</li><li>아름다운 바다 생물 관람 (sea life)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03환경 파괴의 문제점</div><ul><li>활발한 관광 활동이 오히려 칸쿤 인근 바다의 생태계에 심각한 피해를 주고 있다.</li><li>관광 활동으로 인한 환경 훼손 (damaging the sea)</li><li>수중 생태계 보호의 시급성</li><li>핵심 키워드: 환경 파괴(environmental damage)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">join hands</td><td class=\"m\">협력하다, 손을 잡다</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">creative</td><td class=\"m\">창의적인</td></tr><tr><td class=\"w\">underwater</td><td class=\"m\">수중의, 물속의</td></tr><tr><td class=\"w\">professor</td><td class=\"m\">교수</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explanation</td><td class=\"m\">설명</td></tr><tr><td class=\"w\">tourist</td><td class=\"m\">관광객</td></tr><tr><td class=\"w\">activity</td><td class=\"m\">활동</td></tr><tr><td class=\"w\">seriously</td><td class=\"m\">심각하게</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상을 주다, 해를 끼치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가</span><span class=\"en\"><b><span class=\"grammar-hl\">for us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방법을 찾는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to find ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호할</span><span class=\"en\"><b><span class=\"grammar-hl\">to protect</span> the environment.</b></span></div></div><div class=\"lec-sent-ko\">우리가 환경을 보호하는 방법을 찾는 것은 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 환경 보호라는 대전제를 제시하며 독자의 관심을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is important for us to find ways (가주어): 진주어: It은 가주어로 쓰였고, to find ways가 진주어로서 문장의 실제 주어 역할을 한다. for us는 to부정사 to find의 의미상 주어이다.</div><div class=\"lec-gr-item\">to protect (to부정사): ways를 뒤에서 수식하는 형용사적 용법으로, ways의 구체적인 내용을 보충 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 사람들은</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾아냈다</span><span class=\"en\"><b><span class=\"grammar-hl\">have found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의적인 방법들을</span><span class=\"en\"><b><span class=\"grammar-hl\">creative ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 구하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">to save</span> the earth.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 사람들은 지구를 구하기 위한 창의적인 방법들을 찾아냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 환경 보호의 필요성(1번 문장)에서 나아가, 구체적인 해결책(창의적 방법)으로 논의를 좁히는 연결 고리 역할을 합니다. 여기서 creative는 단순히 &#39;창의적인&#39;이라는 사전적 의미를 넘어, 기존의 평범한 방식과는 차별화된 독특한 아이디어를 강조하기 위해 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have found (현재완료): 과거에 시작된 행동이 현재까지 영향을 미치고 있음을 나타낸다.</div><div class=\"lec-gr-item\">creative ways to save (to부정사): to save가 앞의 명사 ways를 수식하는 형용사적 용법으로, &#39;지구를 구할&#39;이라는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creative</td><td class=\"m\">창의적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 예는 이다</span><span class=\"en\"><b>One example is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수중 박물관이</span><span class=\"en\"><b><span class=\"grammar-hl\">an underwater museum</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">칸쿤에 있는</span><span class=\"en\"><b>in Cancun,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멕시코의</span><span class=\"en\"><b>Mexico.</b></span></div></div><div class=\"lec-sent-ko\">한 예로 멕시코 칸쿤에 있는 수중 박물관이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;창의적인 방법&#39;의 구체적인 사례를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">an underwater museum (관용표현): an underwater museum은 특정 장소를 지칭하는 명사구로, 전체 문장에서 보어(C) 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underwater</td><td class=\"m\">수중의, 물속의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만나보자 Rosa Allison 박사를</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s meet</span> Dr. Rosa Allison,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미술학 교수인</span><span class=\"en\"><b><span class=\"grammar-hl\">an art professor</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 들어보자 그녀의 설명을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">listen to</span> her explanation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 특별한 박물관에 관한</span><span class=\"en\"><b>about the special museum.</b></span></div></div><div class=\"lec-sent-ko\">미술학 교수인 Rosa Allison 박사를 만나 이 특별한 박물관에 관한 설명을 들어 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박물관의 운영 주체나 전문가를 소개하며, 독자가 글에 더 몰입할 수 있도록 안내하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s meet (관용표현): Let us의 축약형으로, 상대방에게 제안할 때 사용하는 &#39;우리 ~하자&#39;라는 의미의 구조이다.</div><div class=\"lec-gr-item\">an art professor (동격): Dr. Rosa Allison과 an art professor는 같은 대상을 가리키며, 뒤의 어구가 앞의 명사를 보충 설명하는 동격 관계이다.</div><div class=\"lec-gr-item\">listen to (관용표현): listen은 자동사로, 뒤에 목적어를 취하기 위해 전치사 to와 결합하여 &#39;듣다&#39;라는 의미를 완성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">professor</td><td class=\"m\">교수</td></tr><tr><td class=\"w\">explanation</td><td class=\"m\">설명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">칸쿤은 도시이다</span><span class=\"en\"><b>Cancun is a city</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">480만 명의 관광객들이</span><span class=\"en\"><b><span class=\"grammar-hl\">where 4.8 million tourists</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여행하는</span><span class=\"en\"><b><span class=\"grammar-hl\">travel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b><span class=\"grammar-hl\">every year</span>.</b></span></div></div><div class=\"lec-sent-ko\">칸쿤은 매년 480만 명의 관광객이 여행하는 도시입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 칸쿤이라는 장소의 배경 정보를 제공하며, 왜 이곳에서 환경 문제가 발생하는지에 대한 인과관계를 설명하기 위한 준비 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where 4.8 million tourists travel every year (관계부사): where가 이끄는 절은 앞의 선행사 a city를 수식한다. 관계부사 뒤에는 주어(tourists)와 동사(travel)를 갖춘 완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tourist</td><td class=\"m\">관광객</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 인기 있는 활동들 중 하나는</span><span class=\"en\"><b>One of the most popular activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">looking at</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 지역의 아름다운 해양 생물을</span><span class=\"en\"><b>the area’s beautiful sea life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b>underwater.</b></span></div></div><div class=\"lec-sent-ko\">그곳에서 하는 가장 인기 있는 활동 중 하나는 물속에서 그 지역의 아름다운 해양 생물을 보는 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 칸쿤의 대표적인 관광 자원을 언급하며, 앞선 5번 문장에 이어 관광객들이 몰리는 구체적인 이유를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to do (to부정사): 앞의 명사 activities를 뒤에서 수식하는 형용사적 용법이다.</div><div class=\"lec-gr-item\">looking at (동명사): 문장에서 보어(C) 자리에 위치하여 &#39;~하는 것&#39;이라는 명사적 역할을 수행한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underwater</td><td class=\"m\">수중의, 물속의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관광 활동들은</span><span class=\"en\"><b>tourist activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각하게 훼손하고 있다</span><span class=\"en\"><b>are seriously damaging</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다의 일부를</span><span class=\"en\"><b>parts of the sea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">칸쿤 근처의</span><span class=\"en\"><b>near Cancun.</b></span></div></div><div class=\"lec-sent-ko\">하지만 관광 활동들은 칸쿤 인근의 바다 일부를 심각하게 훼손하고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 제시한 &#39;인기 있는 활동&#39;이 오히려 환경 파괴라는 부작용을 낳고 있음을 보여주는 대조적인 문장입니다. 여기서 damaging은 사전적으로 &#39;손상을 입히다&#39;인데, 여기서는 자연환경이 복구가 어려울 정도로 망가지고 있다는 경각심을 강조하기 위해 선택되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are... damaging (현재진행): be동사(are) + 현재분사(-ing) 구조로, 주어인 tourist activities가 현재 수행하고 있는 능동적인 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tourist</td><td class=\"m\">관광객</td></tr><tr><td class=\"w\">seriously</td><td class=\"m\">심각하게</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환경 보호는 중요하며, 이를 위한 창의적인 해결책이 시도되고 있다.</li><li>멕시코 칸쿤은 인기 있는 관광지이지만, 그만큼 환경 훼손이라는 문제를 겪고 있다.</li><li>이러한 문제를 해결하기 위한 창의적인 사례로 &#39;수중 박물관&#39;이 제시된다.</li><li>예술 교수인 로사 앨리슨 박사를 통해 이 박물관에 대한 구체적인 설명을 들을 예정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Increased tourism is damaging the sea life in Cancun, so people are adopting creative methods to protect the local environment.</div>\n              <div class=\"lec-final-sum-ko\">관광객의 증가가 칸쿤의 해양 생태계를 파괴하고 있어, 지역 환경을 보호하기 위해 창의적인 방법들을 도입하고 있다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null}],[{"audio":"./1_audio/4.mp3","hl":null}],[{"audio":"./1_audio/5.mp3","hl":null}],[{"audio":"./1_audio/6.mp3","hl":null}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":null}],[{"audio":"./1_audio/10.mp3","hl":null}],[{"audio":"./1_audio/11.mp3","hl":null}],[{"audio":"./1_audio/12.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scroll
