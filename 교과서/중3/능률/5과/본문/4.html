EtJvRav7j/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Eco-friendly Architecture: A Path to Coexistence with Nature<small>친환경 건축: 자연과 공존하는 길</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 자연 친화적인 건축 방식인 친환경 건축(Eco-friendly architecture)을 다루고 있는데, 여기서 가장 중요한 개념은 바로 건물의 에너지 효율을 높이는 지속 가능성(Sustainability)입니다. 마치 식물이 뜨거운 햇빛 아래에서 스스로 그늘을 만들어 온도를 낮추듯, 건물에 식물을 배치하는 수직 정원(Vertical garden)이나 녹화(Greening) 기법은 냉방 에너지를 획기적으로 줄여주는 똑똑한 해결책이 되죠. 이처럼 건물 자체를 하나의 살아있는 생태계처럼 설계하여 자연과 인간이 공존하는 것을 생태 건축(Biophilic design)이라고 부르는데, 이는 단순히 환경을 보호하는 것을 넘어 우리가 머무는 공간의 삶의 질을 높이는 현대 건축의 핵심 목표랍니다. 결국 기술과 자연이 조화를 이루는 혁신적인 아이디어들이 쌓여야만, 우리가 미래에도 지구와 건강하게 공존할 수 있는 환경을 만들 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01친환경 건축의 전략</div><ul><li>건축가들은 열린 구조뿐만 아니라 대형 정원을 활용하여 건물의 온도를 조절합니다.</li><li>녹지(greenery)를 조성하여 그늘을 제공함</li><li>직사광선을 차단하여 건물 내부 온도를 낮게 유지함</li><li>핵심 키워드: 친환경 건축(eco-friendly architecture)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02친환경 건축의 가치</div><ul><li>친환경 건물은 환경을 보호할 뿐만 아니라 인간의 삶의 질까지 향상시킵니다.</li><li>환경 보호(protecting the environment)와 삶의 질(quality of life)의 조화</li><li>새로운 건축 양식이 추구하는 주요 목표</li><li>지속적인 친환경 아이디어 개발의 필요성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03미래를 위한 공존</div><ul><li>각 분야의 혁신적인 노력을 통해 인간과 자연은 미래에 함께 어우러져 살 수 있습니다.</li><li>분야별 환경 보호를 위한 다양한 방법(different ways) 모색</li><li>혁신(innovation)을 통한 발전</li><li>인간과 자연의 조화로운 공존(live together in harmony)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in addition to</td><td class=\"m\">~외에도, ~에 더하여</td></tr><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조물</td></tr><tr><td class=\"w\">greenery</td><td class=\"m\">녹색 식물, 녹지</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">shade</td><td class=\"m\">그늘</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">direct</td><td class=\"m\">직접적인</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">not only A but also B</td><td class=\"m\">A뿐만 아니라 B도</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr><tr><td class=\"w\">architecture</td><td class=\"m\">건축(학)</td></tr><tr><td class=\"w\">hopefully</td><td class=\"m\">바라건대</td></tr><tr><td class=\"w\">come up with</td><td class=\"m\">(~을) 생각해 내다, 제안하다</td></tr><tr><td class=\"w\">field</td><td class=\"m\">분야</td></tr><tr><td class=\"w\">innovation</td><td class=\"m\">혁신</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개방형 구조를 만드는 것 외에도,</span><span class=\"en\"><b><span class=\"grammar-hl\">In addition to</span> <span class=\"grammar-hl\">making</span> open structures,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건축가들은 추가한다</span><span class=\"en\"><b>architects add</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">커다란 정원을</span><span class=\"en\"><b>large gardens.</b></span></div></div><div class=\"lec-sent-ko\">건축가들은 개방형 구조를 만드는 것 외에도 커다란 정원을 추가합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 글에서 언급된 개방형 설계라는 환경 친화적 건축 방식에 &#39;추가적으로(In addition to)&#39; 정원을 도입한다는 내용을 담고 있습니다. 이는 환경을 보호하기 위한 건축적 노력이 단순히 건물 구조에만 그치지 않고 더욱 확장되고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In addition to (관용표현): ‘~외에도’라는 뜻으로, 전치사 to 뒤에 동명사 making이 와서 하나의 의미 단위를 형성합니다.</div><div class=\"lec-gr-item\">making (동명사): 전치사 to의 목적어 역할을 하며, ‘만드는 것’이라는 명사적 개념을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in addition to</td><td class=\"m\">~외에도, ~에 더하여</td></tr><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 녹지 공간은</span><span class=\"en\"><b>This greenery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그늘을 제공하고</span><span class=\"en\"><b>provides shade</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건물 일부를 보호한다</span><span class=\"en\"><b>and protects parts of the building</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직사광선으로부터,</span><span class=\"en\"><b>from direct sunlight,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그것은) 건물을 더 시원하게 유지한다</span><span class=\"en\"><b><span class=\"grammar-hl\">which keeps</span> the building cooler.</b></span></div></div><div class=\"lec-sent-ko\">이러한 녹지 공간은 그늘을 제공하고 직사광선으로부터 건물 일부를 보호하여, 건물을 더 시원하게 유지합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Greenery는 사전적으로 &#39;푸른 나뭇잎이나 식물&#39;을 의미하지만, 여기서는 정원에 심어진 식물들이 만드는 &#39;녹지 공간&#39;을 뜻합니다. 필자는 이 단어를 통해 식물이 단순히 장식용이 아니라 환경을 조절하는 실질적인 &#39;생태적 장치&#39;임을 강조하려 했습니다. 앞 문장에서 언급된 정원의 구체적인 기능과 그로 인한 온도 조절 효과라는 논리적 결과를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which keeps (관계대명사): 앞 문장 전체(식물이 그늘을 제공하고 건물을 보호하는 행위)를 선행사로 받는 주격 관계대명사이며, 뒤에 동사 keeps가 이어지는 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenery</td><td class=\"m\">녹색 식물, 녹지</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">shade</td><td class=\"m\">그늘</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">direct</td><td class=\"m\">직접적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이와 같은 친환경 건물들은</span><span class=\"en\"><b>Eco-friendly buildings like these</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호하는 데 도움을 줄 뿐만 아니라,</span><span class=\"en\"><b>not only help <span class=\"grammar-hl\">protect</span> the environment,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 제공한다</span><span class=\"en\"><b>but also provide people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양질의 삶을</span><span class=\"en\"><b>with a good quality of life.</b></span></div></div><div class=\"lec-sent-ko\">이와 같은 친환경 건물들은 환경을 보호하는 데 도움을 줄 뿐만 아니라, 사람들에게 양질의 삶을 제공합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Quality of life는 사전적으로 &#39;삶의 질&#39;이라는 뜻인데, 여기서는 쾌적한 건물 내부 환경이 인간의 행복과 안락함에 직접적으로 기여한다는 점을 나타냅니다. 환경 보호(자연)와 삶의 질(인간)이라는 두 마리 토끼를 다 잡는 친환경 건축의 양면적 효과를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only ~ but also (관용표현): ‘~뿐만 아니라 ~도’라는 뜻의 상관접속사로, help와 provide라는 병렬 구조를 연결합니다.</div><div class=\"lec-gr-item\">protect (to부정사): 동사 help의 목적격 보어 자리에 쓰인 원형부정사(to가 생략됨)로, 환경을 보호하는 행위를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들이 이다</span><span class=\"en\"><b><span class=\"grammar-hl\">Those are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목표들</span><span class=\"en\"><b><span class=\"grammar-hl\">the goals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 새로운 건축 양식의</span><span class=\"en\"><b>of this new style of architecture.</b></span></div></div><div class=\"lec-sent-ko\">그것들이 이 새로운 건축 양식의 목표입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;환경 보호&#39;와 &#39;삶의 질 향상&#39;이 현재 건축 흐름이 지향하는 핵심 가치임을 다시 한번 정리해 주는 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Those are the goals 5형식 구조: be동사는 주어와 보어를 연결하며, goals가 주어 Those의 상태를 설명하는 명사 보어(C)로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">architecture</td><td class=\"m\">건축(학)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바라건대,</span><span class=\"en\"><b>Hopefully,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건축가들은 계속해서 생각해낼 것이다</span><span class=\"en\"><b>architects will keep <span class=\"grammar-hl\">coming up with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 친환경 아이디어들을</span><span class=\"en\"><b>new eco-friendly ideas.</b></span></div></div><div class=\"lec-sent-ko\">바라건대, 건축가들은 계속해서 새로운 친환경 아이디어를 생각해낼 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Come up with는 사전적으로 &#39;~를 생각해 내다&#39;인데, 여기서는 단순히 떠올리는 것을 넘어 실현 가능한 &#39;혁신적인 건축적 해결책을 도출&#39;해내는 과정을 뜻합니다. 필자의 기대를 나타내며, 미래 지향적인 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">coming up with (동명사): 동사 keep의 목적어 역할을 하며, ‘생각해 내는 것’이라는 명사적 활동을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인</td></tr><tr><td class=\"w\">hopefully</td><td class=\"m\">바라건대</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 분야는</span><span class=\"en\"><b>Every field</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있다 다른 방법들을</span><span class=\"en\"><b>has different ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호하는</span><span class=\"en\"><b><span class=\"grammar-hl\">of protecting</span> the environment.</b></span></div></div><div class=\"lec-sent-ko\">모든 분야에는 환경을 보호하는 각기 다른 방법이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건축 분야에서 더 넓은 전체 산업계로 시야를 확장하는 문장입니다. 환경 보호라는 공통된 목표를 위해 각 분야가 각자의 방식으로 노력하고 있다는 맥락으로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">of protecting (동명사): 전치사 of의 목적어이며, ‘보호하는 것’이라는 명사적 행위를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">field</td><td class=\"m\">분야</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 많은 혁신으로,</span><span class=\"en\"><b>With more innovation,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간과 자연은</span><span class=\"en\"><b>humans and nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 살아갈 수 있을 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">will be able to live</span> together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조화를 이루며</span><span class=\"en\"><b>in harmony</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먼 미래까지</span><span class=\"en\"><b>far into the future.</b></span></div></div><div class=\"lec-sent-ko\">더 많은 혁신으로, 먼 미래에 인간과 자연은 함께 조화를 이루며 살아갈 수 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Harmony는 사전적으로 &#39;조화&#39;인데, 여기서는 인간이 자연을 파괴하는 것이 아니라 자연의 일부로서 &#39;공존하는 상태&#39;를 의미합니다. 필자는 건축을 넘어선 기술적 혁신이 인류의 지속 가능한 미래를 보장할 것이라는 긍정적인 전망을 제시하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be able to live (to부정사): 조동사 표현 be able to 뒤에 동사원형 live가 결합되어, ‘살 수 있게 될 것이다’라는 미래의 가능성을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">innovation</td><td class=\"m\">혁신</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>건축가들은 개방형 구조와 정원 도입 등 친환경적인 설계를 시도하고 있다.</li><li>이러한 친환경 건물은 환경 보호와 더불어 거주자의 삶의 질을 높여준다.</li><li>환경 보호는 특정 분야에 국한되지 않으며, 모든 산업의 목표이다.</li><li>끊임없는 혁신을 통해 인간과 자연은 먼 미래까지 조화롭게 공존할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Architects use greenery to create cooling effects for buildings, and these innovations foster a harmonious future between humans and nature.</div>\n              <div class=\"lec-final-sum-ko\">건축가들은 건물의 냉방 효과를 위해 녹지를 활용하며, 이러한 혁신은 인간과 자연 사이의 조화로운 미래를 촉진한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null}],[{"audio":"./4_audio/4.mp3","hl":null}],[{"audio":"./4_audio/5.mp3","hl":null}],[{"audio":"./4_audio/6.mp3","hl":null}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":null}],[{"audio":"./4_audio/10.mp3","hl":null}],[{"audio":"./4_audio/11.mp3","hl":null}],[{"audio":"./4_audio/12.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationF
