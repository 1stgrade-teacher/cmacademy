  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"문법2","title":"분사구문 한 방에 정리! 동시동작·때·이유·조건","audioDir":"2_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사구문\u003c/div>\u003ch1>분사구문 한 방에 정리! 동시동작·때·이유·조건\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>분사구문을 만드는 순서를 익히고, 동시동작·때·이유·조건의 의미로 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중3 능률 김 교과서에 나오는 분사구문을 함께 공부해 볼 거예요. 분사구문은 처음 보면 어렵게 느껴지지만, 만드는 순서만 기억하면 정말 간단해요. 오늘은 분사구문이 무엇인지, 그리고 동시동작, 때, 이유, 조건이라는 네 가지 의미를 예문으로 차근차근 익혀 볼게요. 자, 그럼 힘차게 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">분사구문이란? (만드는 순서)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문은 「접속사+주어+동사」 형태로 이루어진 부사절을 \u003cb class=\"key\">분사\u003c/b>가 이끄는 \u003cb class=\"key\">부사구\u003c/b>로 간결하게 나타낸 구문이에요. 부사절의 주어가 주절과 같으면 \u003cb class=\"key\">생략\u003c/b>하고, 접속사를 생략한 뒤, 동사를 분사 형태로 바꿔 써요.\u003cdiv>\u003cspan class=\"g-formula\">접속사 + 주어 + 동사 → (접속사·주어 생략) + 동사원형-ing ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">While I was playing basketball\u003c/span>, I hurt my leg.\u003c/div>\u003cdiv class=\"g-ko\">나는 농구를 하다가 다리를 다쳤다.\u003c/div>\u003cdiv class=\"g-note\">접속사와 주어가 살아 있는 원래의 부사절 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Playing basketball\u003c/span>, I hurt my leg.\u003c/div>\u003cdiv class=\"g-ko\">나는 농구를 하다가 다리를 다쳤어요.\u003c/div>\u003cdiv class=\"g-note\">접속사와 주어를 생략하고 동사를 Playing으로 바꾼 분사구문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어가 주절과 다르면 \u003cb class=\"key\">생략\u003c/b>할 수 없고, 접속사는 \u003cb class=\"key\">반드시\u003c/b> 지워야 해요. 동사는 \u003cb class=\"key\">-ing\u003c/b> 형태로 바꾼다는 점도 잊지 마세요.\u003c/div>","segs":[{"n":2,"text":"먼저 분사구문이 무엇인지부터 알아볼게요. 분사구문은 접속사와 주어와 동사로 이루어진 부사절을, 분사가 이끄는 부사구로 짧게 줄여서 말하는 표현이에요. 만드는 순서는 아주 간단해요. 부사절의 주어가 주절의 주어와 같으면 먼저 주어를 생략하고, 그다음 접속사를 지운 다음, 마지막으로 동사를 동사원형에 ing를 붙인 분사 형태로 바꿔 주면 돼요. 이 세 가지만 기억하면 어떤 부사절이든 짧고 간결하게 바꿀 수 있어요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 While I was playing basketball, I hurt my leg. 예요. 뜻은 나는 농구를 하다가 다리를 다쳤다라는 뜻이에요. 접속사 while과 주어 I가 들어 있는 부사절이 있다는 점을 눈여겨보세요.","hl":"ex-0"},{"n":4,"text":"이 문장을 분사구문으로 바꾸면 Playing basketball, I hurt my leg. 가 돼요. 뜻은 똑같이 나는 농구를 하다가 다리를 다쳤다예요. 접속사와 주어가 사라지고 동사가 Playing으로 바뀌었죠. 훨씬 짧고 간결해졌죠?","hl":"ex-1"},{"n":5,"text":"여기서 주의할 점이 있어요. 부사절의 주어가 주절의 주어와 다르면 주어를 생략할 수 없어요. 그리고 접속사는 반드시 지워야 하고, 동사는 ing 형태로 바꿔야 한다는 것도 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">의미 1 - 동시동작 (~하면서)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">두 가지 동작이 같은 주어에 의해 동시에 일어날 때 분사구문은 \u003cb class=\"key\">~하면서\u003c/b>로 해석해요. while이 이끄는 부사절을 줄인 경우가 많아요.\u003cdiv>\u003cspan class=\"g-formula\">While + 주어 + 동사 ~ → V-ing ~, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Clapping his hands\u003c/span>, he danced to the music.\u003c/div>\u003cdiv class=\"g-ko\">그는 손뼉을 치면서 음악에 맞춰 춤을 췄다.\u003c/div>\u003cdiv class=\"g-note\">While he clapped his hands, he danced to the music.과 같은 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Singing a song\u003c/span>, she cleaned the room.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 노래를 부르면서 방을 청소했다.\u003c/div>\u003cdiv class=\"g-note\">노래 부르기와 청소하기가 동시에 일어나는 동시동작이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동시동작은 \u003cb class=\"key\">같은 주어\u003c/b>가 두 동작을 함께 한다는 점이 핵심이에요. 해석할 때 \u003cb class=\"key\">~하면서\u003c/b>를 넣어 보세요.\u003c/div>","segs":[{"n":6,"text":"이제 분사구문의 첫 번째 의미인 동시동작을 볼게요. 두 가지 일을 같은 사람이 거의 동시에 할 때, 분사구문은 하면서라고 해석해요. 보통 while이 이끄는 부사절을 분사구문으로 바꾼 경우가 많아요. 주절과 분사구문의 주어가 같다는 것도 함께 확인해 주세요.","hl":"rule"},{"n":7,"text":"예문을 함께 볼게요. Clapping his hands, he danced to the music. 이에요. 뜻은 그는 손뼉을 치면서 음악에 맞춰 춤을 췄다예요. 손뼉을 치는 동작과 춤을 추는 동작이 같은 주어 he에 의해 동시에 일어나고 있죠.","hl":"ex-0"},{"n":8,"text":"하나 더 볼게요. Singing a song, she cleaned the room. 이에요. 뜻은 그녀는 노래를 부르면서 방을 청소했다예요. 노래 부르는 일과 청소하는 일을 같은 주어 she가 동시에 하고 있으니까 하면서라고 해석하면 자연스러워요.","hl":"ex-1"},{"n":9,"text":"동시동작에서 가장 중요한 건 두 동작을 같은 주어가 한다는 점이에요. 해석이 헷갈리면 하면서를 넣어서 자연스러운지 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">의미 2 - 때 (~할 때, ~하는 동안)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문이 \u003cb class=\"key\">~할 때\u003c/b>나 \u003cb class=\"key\">~하는 동안\u003c/b>의 의미를 나타낼 수 있어요. when이 이끄는 부사절을 줄여서 만든 경우가 많아요.\u003cdiv>\u003cspan class=\"g-formula\">When + 주어 + 동사 ~ → V-ing ~, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Leaving home\u003c/span>, she asked me to look after her dog.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 집을 떠날 때 나에게 그녀의 개를 돌봐 달라고 부탁했다.\u003c/div>\u003cdiv class=\"g-note\">When she left home, she asked me to look after her dog.과 같은 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Walking home\u003c/span>, I met my teacher.\u003c/div>\u003cdiv class=\"g-ko\">집으로 걸어가다가 선생님을 만났다.\u003c/div>\u003cdiv class=\"g-note\">걸어가던 때 선생님을 만났다는 의미의 분사구문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>때를 나타내는 분사구문은 \u003cb class=\"key\">When\u003c/b>이 이끄는 부사절로 바꿔 의미를 확인할 수 있어요. 해석은 \u003cb class=\"key\">~할 때\u003c/b>로 해 보세요.\u003c/div>","segs":[{"n":10,"text":"다음은 때를 나타내는 분사구문이에요. 분사구문은 할 때라든가 하는 동안이라는 뜻으로도 자주 쓰여요. 이때는 when이 이끄는 부사절이 분사구문으로 바뀐 경우가 많아요. 해석할 때는 주절 앞에 때를 나타내는 말을 자연스럽게 붙여 주면 돼요.","hl":"rule"},{"n":11,"text":"예문을 읽어 볼게요. Leaving home, she asked me to look after her dog. 예요. 뜻은 그녀는 집을 떠날 때 나에게 그녀의 개를 돌봐 달라고 부탁했다예요. 집을 떠나는 시점에 부탁했다는 뜻이니까 할 때라고 해석하면 딱 맞아요.","hl":"ex-0"},{"n":12,"text":"한 문장 더 볼게요. Walking home, I met my teacher. 예요. 뜻은 집으로 걸어가다가 선생님을 만났다예요. 걸어가던 때라는 의미가 담겨 있으니까 때를 나타내는 분사구문이에요.","hl":"ex-1"},{"n":13,"text":"때를 나타내는지 헷갈릴 때는 when을 넣어서 문장을 다시 만들어 보세요. 뜻이 자연스러우면 때의 분사구문이 맞아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">의미 3 - 이유와 조건 (~이므로, 만약 ~한다면)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문은 \u003cb class=\"key\">~이므로\u003c/b>처럼 이유를 나타내거나, \u003cb class=\"key\">만약 ~한다면\u003c/b>처럼 조건을 나타내기도 해요. 이유는 because, 조건은 if가 이끄는 부사절로 바꿔 확인할 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">Because + 주어 + 동사 ~ → V-ing ~, 주절 / If + 주어 + 동사 ~ → V-ing ~, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Feeling cold\u003c/span>, I put on thick clothes.\u003c/div>\u003cdiv class=\"g-ko\">추워서 나는 두꺼운 옷을 입었다.\u003c/div>\u003cdiv class=\"g-note\">Because I felt cold, I put on thick clothes.와 같은 뜻으로 이유를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Buying this hat\u003c/span>, you'll get one for free.\u003c/div>\u003cdiv class=\"g-ko\">이 모자를 사면, 하나를 무료로 받을 거예요.\u003c/div>\u003cdiv class=\"g-note\">If you buy this hat, you'll get one for free.와 같은 뜻으로 조건을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>이유인지 조건인지 헷갈리면 \u003cb class=\"key\">because\u003c/b>와 \u003cb class=\"key\">if\u003c/b>를 넣어 문장을 바꿔 보세요. 해석이 자연스러운 쪽이 정답이에요.\u003c/div>","segs":[{"n":14,"text":"마지막으로 이유와 조건을 나타내는 분사구문을 볼게요. 추워서 옷을 입었다처럼 이유를 말할 때도 분사구문을 쓰고, 만약 이 모자를 산다면처럼 조건을 말할 때도 분사구문을 써요. 이유는 because, 조건은 if로 바꿔서 뜻을 확인해 보면 아주 쉬워요. 두 문장을 나란히 놓고 비교해 볼게요.","hl":"rule"},{"n":15,"text":"먼저 이유를 나타내는 예문이에요. Feeling cold, I put on thick clothes. 예요. 뜻은 추워서 나는 두꺼운 옷을 입었다예요. 추운 것이 두꺼운 옷을 입은 이유가 되니까 이유의 분사구문이에요.","hl":"ex-0"},{"n":16,"text":"이번엔 조건을 나타내는 예문이에요. Buying this hat, you'll get one for free. 예요. 뜻은 이 모자를 사면 하나를 무료로 받을 거예요라는 뜻이에요. 만약 산다면이라는 조건이 담겨 있으니까 조건의 분사구문이에요.","hl":"ex-1"},{"n":17,"text":"이유인지 조건인지 헷갈릴 때는 because를 넣어 보고, 그다음 if를 넣어 보세요. 뜻이 자연스러운 쪽으로 해석하면 절대 틀리지 않아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Because feeling cold, I put on thick clothes.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Feeling cold, I put on thick clothes.\u003c/div>\u003cdiv class=\"g-why\">분사구문으로 바꿀 때는 부사절의 접속사를 반드시 생략해야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Clap his hands, he danced to the music.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Clapping his hands, he danced to the music.\u003c/div>\u003cdiv class=\"g-why\">동사를 분사 형태인 -ing로 바꾸지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If buying this hat, you'll get one for free.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Buying this hat, you'll get one for free.\u003c/div>\u003cdiv class=\"g-why\">조건의 접속사 If도 분사구문에서는 생략해요.\u003c/div>\u003c/div>","segs":[{"n":18,"text":"자주 나오는 실수를 하나 볼게요. Because feeling cold, I put on thick clothes라고 쓰면 틀린 문장이에요. 분사구문으로 바꿀 때는 접속사를 반드시 지워야 하니까, Feeling cold, I put on thick clothes라고 써야 맞아요.","hl":"mk-0"},{"n":19,"text":"또 하나 볼게요. Clap his hands, he danced to the music이라고 쓰면 동사원형이 그대로 남아 있어서 틀려요. 동사를 분사 형태로 바꿔야 하니까 Clapping his hands, he danced to the music이라고 써야 해요.","hl":"mk-1"},{"n":20,"text":"조건의 분사구문에서도 실수가 많아요. If buying this hat, you'll get one for free라고 쓰면 접속사가 남아 있어서 틀린 문장이에요. 분사구문에서는 if도 지워 주니까 Buying this hat, you'll get one for free라고 써야 맞아요.","hl":"mk-2"}]},{"ht
