lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01서비스 개요</div><ul><li>반려동물 주인이 믿을 수 있는 돌봄 서비스를 찾도록 돕는 플랫폼입니다.</li><li>앱 이름: 펫 시터 파인더(Pet Sitter Finder)</li><li>주인은 구인 글(post)을 올리고 시터는 메시지를 보냄</li><li>주인은 후기(reviews)를 확인하여 최적의 시터를 선택</li><li>핵심 키워드: 돌봄 서비스(pet sitter), 플랫폼(app)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사용자의 우려와 대응</div><ul><li>사용자는 개인정보 노출을 걱정했고, 운영진은 이를 개선 중입니다.</li><li>조지(George)의 개인정보(personal information) 유출 우려</li><li>운영진의 시스템 개발 계획: 개인정보 노출 없는 소통 방식 도입</li><li>핵심 키워드: 개인정보(personal information), 개선(developing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03다양한 활용 사례</div><ul><li>반려동물이 없는 사용자도 이 앱을 통해 즐거움을 얻을 수 있습니다.</li><li>사만다(Samantha)의 사례: 거주지 문제로 반려동물을 키울 수 없음</li><li>앱을 활용해 반려견 산책(walking a dog) 경험</li><li>핵심 키워드: 반려견 산책(walking a dog), 활용(experience)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look after</td><td class=\"m\">~을 돌보다</td></tr><tr><td class=\"w\">pet sitter</td><td class=\"m\">애완동물 돌봐주는 사람</td></tr><tr><td class=\"w\">reliable</td><td class=\"m\">믿을 수 있는</td></tr><tr><td class=\"w\">upload</td><td class=\"m\">(데이터 등을) 올리다</td></tr><tr><td class=\"w\">dog walker</td><td class=\"m\">개 산책 도우미</td></tr><tr><td class=\"w\">review</td><td class=\"m\">후기, 평가</td></tr><tr><td class=\"w\">go out of town</td><td class=\"m\">(도시를 떠나) 여행을 가다, 출타하다</td></tr><tr><td class=\"w\">concern</td><td class=\"m\">우려, 걱정</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personal information</td><td class=\"m\">개인 정보</td></tr><tr><td class=\"w\">purpose</td><td class=\"m\">목적</td></tr><tr><td class=\"w\">be aware of</td><td class=\"m\">~을 알고 있다</td></tr><tr><td class=\"w\">issue</td><td class=\"m\">문제, 사안</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">개발하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허락하다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제가 돌볼 수 있어요</span><span class=\"en\"><b>I can <span class=\"grammar-hl\">look after</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 반려동물을</span><span class=\"en\"><b>your pet!</b></span></div></div><div class=\"lec-sent-ko\">제가 당신의 반려동물을 돌볼 수 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앱의 목적을 직관적으로 보여주는 문구입니다. **look after**는 사전적으로는 &#39;살펴보다&#39;이지만, 여기서는 &#39;돌보다, 보살피다&#39;라는 의미로 쓰였습니다. 서비스를 제공하는 사람(펫시터)의 입장에서 친근하게 다가가는 느낌을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look after (관용표현): &#39;~을 돌보다&#39;라는 의미의 구동사로, 하나의 동사구로 쓰인다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look after</td><td class=\"m\">~을 돌보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Pet Sitter Finder는</span><span class=\"en\"><b>Pet Sitter Finder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완벽한 앱</span><span class=\"en\"><b>the perfect app</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반려동물 애호가들과 반려동물 주인들을 위한</span><span class=\"en\"><b>for <span class=\"grammar-hl\">pet lovers and pet owners</span>.</b></span></div></div><div class=\"lec-sent-ko\">Pet Sitter Finder는 반려동물 애호가들과 반려동물 주인들을 위한 완벽한 앱이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 서비스의 이름을 밝히며, 이 앱이 누구에게 필요한지 대상을 명확히 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pet lovers and pet owners (관용표현): &#39;pet&#39;이라는 명사가 다른 명사를 수식하여 &#39;반려동물을 사랑하는 사람들&#39;과 &#39;반려동물 주인들&#39;이라는 복합명사적 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pet sitter</td><td class=\"m\">애완동물 돌봐주는 사람</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕는다</span><span class=\"en\"><b><span class=\"grammar-hl\">helps</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반려동물 주인들이</span><span class=\"en\"><b><span class=\"grammar-hl\">pet owners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿을 만한 사람들을 찾도록</span><span class=\"en\"><b><span class=\"grammar-hl\">find</span> reliable people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 반려동물을 돌봐 줄</span><span class=\"en\"><b><span class=\"grammar-hl\">to look after</span> their pets.</b></span></div></div><div class=\"lec-sent-ko\">그것은 반려동물 주인들이 그들의 반려동물을 돌봐 줄 믿을 만한 사람들을 찾도록 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 앱의 구체적인 기능을 설명합니다. &#39;믿을 만한(reliable)&#39;이라는 표현을 통해 사용자가 가질 수 있는 불안감을 해소해 주는 앱의 가치를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps pet owners find 5형식(SVOC) 구조: help는 5형식 동사로 쓰이며, 목적어(pet owners) 뒤에 목적보어로 동사원형(find)을 취하는 구조이다.</div><div class=\"lec-gr-item\">to look after (to부정사): 앞의 명사(reliable people)를 수식하는 형용사적 용법으로, &#39;~할 사람들&#39;이라는 의미를 갖는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look after</td><td class=\"m\">~을 돌보다</td></tr><tr><td class=\"w\">reliable</td><td class=\"m\">믿을 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반려동물 주인이 ~할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When a pet owner</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">is looking for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반려동물을 돌보는 사람들을</span><span class=\"en\"><b>pet sitters,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 또는 그녀는</span><span class=\"en\"><b>he or she</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게시물을 올린다.</span><span class=\"en\"><b>uploads a post.</b></span></div></div><div class=\"lec-sent-ko\">반려동물 주인이 반려동물을 돌보는 사람들을 구할 때, 그 또는 그녀는 게시물을 올린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 서비스 이용 절차를 순차적으로 설명하기 시작하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When a pet owner is looking for (분사구문): &#39;When + S + V&#39; 형태의 시간 부사절로, &#39;-ing&#39; 형태인 &#39;looking&#39;이 사용되었다. 이 문장에서 &#39;is looking&#39;은 현재진행으로, &#39;반려동물 주인이 돌봐줄 사람을 찾는 중일 때&#39;라는 상황을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pet sitter</td><td class=\"m\">애완동물 돌봐주는 사람</td></tr><tr><td class=\"w\">upload</td><td class=\"m\">(데이터 등을) 올리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면 반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이</span><span class=\"en\"><b>Pet sitters or dog walkers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보낼 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can then send</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">메시지를</span><span class=\"en\"><b>messages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주인에게</span><span class=\"en\"><b>to the owner.</b></span></div></div><div class=\"lec-sent-ko\">그러면 반려동물을 돌보는 사람들이나 강아지를 산책시키는 사람들이 주인에게 메시지를 보낼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인의 게시물을 보고 서비스 제공자들이 어떻게 반응하는지 이어지는 절차를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can then send (관용표현): &#39;can&#39; 뒤에 부사 &#39;then&#39;이 삽입되어 &#39;그 후에 ~할 수 있다&#39;는 순차적 동작의 가능성을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pet sitter</td><td class=\"m\">애완동물 돌봐주는 사람</td></tr><tr><td class=\"w\">dog walker</td><td class=\"m\">개 산책 도우미</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주인은</span><span class=\"en\"><b>The owner</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인하고</span><span class=\"en\"><b>checks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 후기를</span><span class=\"en\"><b>their reviews</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택한다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">chooses</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 마음에 드는 사람을</span><span class=\"en\"><b>the best person.</b></span></div></div><div class=\"lec-sent-ko\">주인은 그들의 후기를 확인하고 가장 마음에 드는 사람을 선택한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 서비스 이용의 마지막 단계로, 신뢰를 확인할 수 있는 &#39;후기&#39;라는 장치를 통해 안전한 선택이 가능함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chooses (일반동사): 주어(The owner)가 3인칭 단수이므로 동사에 -es가 붙은 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">review</td><td class=\"m\">후기, 평가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">George / 2019년 11월 12일</span><span class=\"en\"><b><span class=\"grammar-hl\">George</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">November 12, 2019</span></b></span></div></div><div class=\"lec-sent-ko\">George / 2019년 11월 12일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사용자 George의 후기가 시작됩니다. &#39;going out of town&#39;은 말 그대로 &#39;시외로 나가다&#39;, 즉 여행이나 출장을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">George November 12, 2019 (관용표현): 작성자와 날짜를 표기하는 서식으로, 명사와 날짜 정보가 결합된 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 사용해요</span><span class=\"en\"><b>I use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 앱을</span><span class=\"en\"><b>this app</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">할 때마다</span><span class=\"en\"><b><span class=\"grammar-hl\">whenever</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교외로 나갈</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m going out of town</span>.</b></span></div></div><div class=
