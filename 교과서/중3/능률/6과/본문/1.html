 반려동물을 돌봐줄 사람까지 쉽게 찾을 수 있는 세상이 되었는데, 이번 지문에서는 이런 공유 경제가 우리 일상을 어떻게 편리하게 바꾸고 있는지 함께 살펴볼 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>주말 계획을 세우던 중 부자간에 캠핑에 필요한 물품과 애완동물 돌봄 문제가 발생한다.</li><li>아들의 고민: 캠핑 장비(camping equipment)의 부재와 애완견(dog) 돌봄 문제</li><li>해결책 제안: 공유 경제 서비스 앱(apps) 활용</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제 해결</div><ul><li>아빠는 앱을 통해 필요한 자원을 빌리거나 서비스를 받는 방법을 제시한다.</li><li>물품 구매 대신 빌리기(renting)를 통해 비용 절감</li><li>반려동물 돌봄(pet sitting) 서비스 활용 가능</li><li>핵심 키워드: 공유 경제(sharing economy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sharing economy</td><td class=\"m\">공유 경제</td></tr><tr><td class=\"w\">weekend</td><td class=\"m\">주말</td></tr><tr><td class=\"w\">camping</td><td class=\"m\">캠핑, 야영</td></tr><tr><td class=\"w\">tent</td><td class=\"m\">텐트</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다</td></tr><tr><td class=\"w\">worry</td><td class=\"m\">걱정하다</td></tr><tr><td class=\"w\">app</td><td class=\"m\">앱, 애플리케이션</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">삶은</span><span class=\"en\"><b>Life in the <span class=\"grammar-hl\">Sharing</span> Economy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유 경제에서의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(공유 경제에서의 삶)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아들이 주말 계획에 대해 아빠에게 의견을 묻는 도입부입니다. 가족 간의 대화가 시작되며 캠핑이라는 주제로 나아가는 계기가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Sharing (동명사): 전치사 of의 목적어 역할을 하는 동명사로 &#39;공유하는 것&#39;이라는 명사적 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sharing economy</td><td class=\"m\">공유 경제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아들:</span><span class=\"en\"><b>Son: What <span class=\"grammar-hl\">should we do</span> this weekend, Dad?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 할까요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">이번 주말에</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠,</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">아들: 아빠, 우리 이번 주말에 뭐 할까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아들이 주말 계획에 대해 아빠에게 의견을 묻는 도입부입니다. 가족 간의 대화가 시작되며 캠핑이라는 주제로 나아가는 계기가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should we do (간접의문문/의문문): 조동사 should를 포함한 의문문 구조로, 주어 we와 동사 do가 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">weekend</td><td class=\"m\">주말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠:</span><span class=\"en\"><b>Dad: <span class=\"grammar-hl\">Why don’t we go</span> camping?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 캠핑 가는 게 어떨까?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">아빠: 우리 캠핑 가는 게 어떨까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 주말 활동으로 &#39;캠핑&#39;을 제안하는 문장입니다. 여기서 Why don’t we는 직역하면 &#39;왜 우리는 ~하지 않니?&#39;이지만, 상대방에게 무엇인가를 부드럽게 권유할 때 쓰는 관용적 표현입니다. 단순히 묻는 것이 아니라 함께 즐거운 시간을 보내자는 제안의 의미를 강조하기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why don’t we go (관용표현): &#39;~하는 게 어때?&#39;라는 의미의 제안을 나타내는 관용적 표현으로 조동사 do와 부정어 not이 결합됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camping</td><td class=\"m\">캠핑, 야영</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아들:</span><span class=\"en\"><b>Son: But we <span class=\"grammar-hl\">don’t have</span> a tent.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 텐트가 없잖아요.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">아들: 그런데 우리는 텐트가 없잖아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아들이 캠핑을 가기 위해 필요한 장비(텐트)가 없고, 반려동물(강아지)을 돌봐줄 사람이 없다는 현실적인 고민을 제기합니다. 앞선 아빠의 제안에 대해 논리적인 &#39;반대 급부&#39;를 제시하여 갈등 상황을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t have 일반동사 부정문: 조동사 do와 부정어 not을 사용하여 상태를 나타내는 동사 have를 부정함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tent</td><td class=\"m\">텐트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사야 할까요</span><span class=\"en\"><b><span class=\"grammar-hl\">Should we buy</span> one?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">하나 사야 할까요?</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Should we buy 조동사 구문: 주어의 의지나 제안을 묻는 의문문 구조로 조동사 should와 일반동사 buy가 결합함</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또</span><span class=\"en\"><b>Also, who <span class=\"grammar-hl\">will take care of</span> our dog?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누가 돌봐요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 강아지는</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">또 우리 강아지는 누가 돌봐요?</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will take care of (관용표현): &#39;돌보다&#39;라는 의미의 숙어 take care of에 미래를 나타내는 조동사 will이 결합된 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠:</span><span class=\"en\"><b>Dad: <span class=\"grammar-hl\">Don’t worry</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걱정하지 마.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">아빠: 걱정하지 마.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 공유 경제 앱을 활용해 아들의 고민(장비, 반려동물 관리)을 해결할 수 있다고 안심시키는 문장입니다. 공유 경제라는 글의 주제를 본격적으로 제시하는 해결책의 시작점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t worry (명령문): 조동사 do와 부정어 not을 사용하여 상대방에게 &#39;~하지 마라&#39;고 금지하거나 충고하는 명령문 구조</div></d
