<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중 능률(김) 6과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pk),#7CCBC8)}

.lp-sa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.lp-sa>div{border:1px solid #F1F1F1;border-radius:10px;padding:10px 14px}

.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}

.lp-chips .a{background:#FFF1D8;color:#8A5A00}
.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}
.lp-sno .es{color:#fff;background:#E0952B;border-radius:4px;padding:1px 8px;font-size:11.5px;margin-left:8px}
.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}
.lp .mk{border-radius:4px;width:auto;min-width:20px;padding:0 3px;background:var(--pk-t)}
.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}
.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

.lp-hl{border-radius:6px}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중 능률(김) 6과 본문1","audioDir":"1_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중 능률(김) 6과\u003c/div>\u003ch1>Camping Plans and Helpful Apps\u003c/h1>\u003ch2>캠핑 계획과 도움을 주는 앱들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아들이 주말 캠핑을 제안한 아빠에게 텐트가 없고 강아지 돌봄 문제가 있다고 걱정하자, 아빠는 도움을 줄 \u003cb class=\"key\">앱\u003c/b>들을 알고 있다며 안심시킨다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A father suggests camping for the weekend and reassures his son that helpful apps can solve their concerns.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 능률 김 선생님 교과서 여섯 번째 과 본문 첫 번째 지문을 함께 공부해 볼게요. 아들이 주말 계획을 질문하고, 아빠가 캠핑을 제안한 뒤 텐트와 강아지 걱정을 앱으로 해결하는 대화예요. 핵심은 도움을 줄 수 있는 앱을 알고 있다는 아빠의 말이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">캠핑은 준비물이 많아 처음 도전하는 사람에게는 부담이 될 수 있어요. 그래서 최근에는 텐트나 캠핑 장비를 빌려 주는 \u003cb class=\"key\">camping \u003c/b>\u003cb class=\"key\">gear \u003c/b>\u003cb class=\"key\">rental\u003c/b> 앱, 캠핑장을 예약해 주는 \u003cb class=\"key\">reservation \u003c/b>\u003cb class=\"key\">app\u003c/b>이 널리 쓰입니다. 반려동물과 함께 여행할 때 필요한 \u003cb class=\"key\">pet \u003c/b>\u003cb class=\"key\">sitting\u003c/b> 서비스나 돌봄 매칭 앱도 빠르게 성장하고 있죠. 이런 서비스는 필요한 자원을 이웃과 나누는 \u003cb class=\"key\">sharing \u003c/b>\u003cb class=\"key\">economy\u003c/b>의 한 예로 볼 수 있습니다. 배달 앱으로 음식을 주문하듯, 캠핑 앱으로 장비와 돌봄 서비스를 한 번에 찾는 시대인 거예요. 이 지문은 캠핑 계획에서 생기는 걱정을 \u003cb class=\"key\">앱\u003c/b>으로 해결하는 대화를 담고 있습니다.\u003c/div>","segs":[{"n":2,"text":"캠핑은 준비물이 많아서 처음 도전하는 사람에게는 부담이 될 수 있어요. 그래서 요즘은 텐트나 장비를 빌려 주는 camping gear rental 앱이나 캠핑장을 예약하는 reservation app을 많이 써요. 반려동물과 여행할 때 필요한 돌봄을 연결해 주는 pet sitting 서비스도 빠르게 커지고 있죠. 이런 서비스는 필요한 자원을 이웃과 나누는 sharing economy의 한 예로 볼 수 있어요. 배달 앱으로 음식을 주문하듯, 캠핑 앱으로 장비와 돌봄 서비스를 한 번에 찾는 시대인 거예요. 이 지문의 대화도 바로 그런 앱의 도움을 떠올리는 장면이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주말 계획 제안\u003csmall>도입·제안 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>아들이 아빠에게 이번 주말에 무엇을 할지 묻고, 아빠는 \u003cb class=\"key\">캠핑\u003c/b>을 가자고 제안해요. 'Why don't we ~?'는 상대에게 부드럽게 \u003cb class=\"key\">제안\u003c/b>할 때 쓰는 표현이에요. 대화의 \u003cb class=\"key\">화제\u003c/b>가 주말 활동으로 좁혀지는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>텐트 준비 걱정\u003csmall>문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>아들은 캠핑에 필요한 \u003cb class=\"key\">텐트\u003c/b>가 없다는 점을 지적해요. 이어서 텐트를 새로 \u003cb class=\"key\">구매\u003c/b>해야 하는지 묻죠. 아빠의 제안에 대한 첫 번째 \u003cb class=\"key\">걱정\u003c/b>이 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>강아지 돌봄 질문\u003csmall>추가 문제 · 문장 5\u003c/small>\u003c/h4>\u003cp>아들은 또 한 가지 문제를 꺼내요. 바로 \u003cb class=\"key\">강아지\u003c/b>를 누가 \u003cb class=\"key\">돌볼\u003c/b> 것인지 묻는 거예요. 'Also'가 앞의 텐트 문제에 \u003cb class=\"key\">추가\u003c/b> 걱정을 이어 붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>앱으로 해결\u003csmall>해결·안심 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>아빠는 'Don't worry'로 아들을 \u003cb class=\"key\">안심\u003c/b>시켜요. 그리고 도움을 줄 수 있는 \u003cb class=\"key\">앱\u003c/b>들을 알고 있다고 말하며 해결책을 제시합니다. 대화는 걱정에서 \u003cb class=\"key\">해결\u003c/b>로 마무리돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 대화가 어떤 순서로 걱정을 쌓고 해결하는지 흐름을 짚어 볼게요.","hl":null},{"n":4,"text":"먼저 아들이 아빠에게 이번 주말에 무엇을 할지 물어요. 그러자 아빠가 Why don't we go camping이라고 말하며 캠핑을 제안하죠. Why don't we는 상대에게 부드럽게 제안할 때 쓰는 표현이에요. 대화의 화제가 주말 활동으로 좁혀지는 단계입니다.","hl":"f0"},{"n":5,"text":"다음으로 아들은 텐트가 없다는 점을 말해요. 그리고 Should we buy one이라고 물으며 텐트를 구매해야 하는지 걱정하죠. 아빠의 제안에 대한 첫 번째 걱정이 드러납니다.","hl":"f1"},{"n":6,"text":"이어서 아들은 또 한 가지 문제를 꺼내요. 바로 강아지를 누가 돌볼 것인지 묻는 거예요. Also가 앞의 텐트 문제에 추가 걱정을 이어 붙여 줍니다.","hl":"f2"},{"n":7,"text":"마지막으로 아빠가 Don't worry라고 말하며 아들을 안심시켜요. 그러고는 도움을 줄 수 있는 앱들을 알고 있다고 말하며 해결책을 제시합니다. 대화는 걱정에서 해결로 마무리돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">아들이 텐트가 없다는 점과 강아지 돌봄 문제를 연달아 \u003cb class=\"key\">문제\u003c/b>로 제기하고, 아빠가 마지막에 \u003cb class=\"key\">앱\u003c/b>이라는 해결책을 제시해요. 핵심 내용이 끝에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 'But'과 'Also'는 문제를 쌓고, 'Don't worry'와 'I know some apps'는 \u003cb class=\"key\">해결\u003c/b>로 전환하는 신호예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why don't we (2)\u003c/b>\u003cspan>제안\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>문제 제기\u003c/span>\u003cb>Also (5)\u003c/b>\u003cspan>추가 문제\u003c/span>\u003cb>Don't worry (6)\u003c/b>\u003cspan>안심·전환\u003c/span>\u003cb>that can help us (7)\u003c/b>\u003cspan>해결 근거\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">What should we do\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Why don't we go camping\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">take care of our dog\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">some apps that can help us\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 대화는 문제를 제기하고 해결책을 찾는 문제 해결 구조예요. 아들이 텐트와 강아지 돌봄이라는 문제를 연달아 꺼내고, 아빠가 마지막에 앱이라는 해결책을 제시하죠. 핵심 내용이 끝에서 드러나므로 미괄식으로 볼 수 있어요. 그래서 마지막 문장인 I know some apps that can help us에 주목해야 합니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 Why don't we가 제안을 열고, But이 문제 제기를 표시해요. Also는 추가 문제를 붙이고, Don't worry는 안심으로 전환하는 신호죠. that can help us는 앱이 해결 근거가 된다는 점을 보여 줍니다. 대조보다는 문제 제기와 해결의 흐름을 따라 읽으면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>weekend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주말\u003c/span>\u003c/div>\u003cdiv>\u003cb>dad\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아빠\u003c/span>\u003c/div>\u003cdiv>\u003cb>what should we do\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 무엇을 해야 할까\u003c/span>\u003c/div>\u003cdiv>\u003cb>why don't we\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 ~하는 게 어때\u003c/span>\u003c/div>\u003cdiv>\u003cb>go\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>camping\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠핑\u003c/span>\u003c/div>\u003cdiv>\u003cb>but\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그런데\u003c/span>\u003c/div>\u003cdiv>\u003cb>have\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가지고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>텐트\u003c/span>\u003c/div>\u003cdiv>\u003cb>should we buy\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 ~을 사야 할까\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>one\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하나, 앞에 나온 명사를 대신하는 말\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>who will take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>누가 ~을 돌볼 것인가\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dog\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강아지\u003c/span>\u003c/div>\u003cdiv>\u003cb>our dog\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 강아지\u003c/span>\u003c/div>\u003cdiv>\u003cb>don't worry\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>걱정하지 마\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>know\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>some apps\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몇 가지 앱\u003c/span>\u003c/div>\u003cdiv>\u003cb>app\u003c/b>\u003cem>명사\u003c/em>\u003cspan>앱\u003c/span>\u003c/div>\u003cdiv>\u003cb>that can help\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>도와줄 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어부터 짚어 볼게요. take care of는 돌보다, worry는 걱정하다, help는 돕다라는 뜻이에요. why don't we는 우리가 하는 게 어때라는 제안 표현이고, some apps는 몇 가지 앱이라는 뜻으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">worry\u003c/b>\u003cspan class=\"m\">걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fret\u003c/span>\u003cspan class=\"s\">be anxious\u003c/span>\u003cspan class=\"s\">be concerned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">obstruct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">take care of\u003c/b>\u003cspan class=\"m\">돌보다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">look after\u003c/span>\u003cspan class=\"s\">care for\u003c/span>\u003cspan class=\"s\">attend to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">know\u003c/b>\u003cspan class=\"m\">알다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"s\">be aware of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">buy\u003c/b>\u003cspan class=\"m\">사다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">purchase\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sell\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">go\u003c/b>\u003cspan class=\"m\">가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">leave\u003c/span>\u003cspan class=\"s\">travel\u003c/span>\u003cspan class=\"s\">move\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003cspan class=\"a\">remain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 정리해 볼게요. worry의 동의어는 fret이나 be concerned이고, 반의어는 relax나 calm이에요. help는 assist나 aid로 바꿔 쓸 수 있고, 반대말은 hinder나 obstruct예요. take care of는 look after나 care for와 같은 뜻이고, 반대말은 neglect나 ignore입니다. buy는 purchase나 acquire, go는 travel이나 leave로 바꿔 쓸 수 있고, know는 understand나 be aware of로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">B: What\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 해야 할까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이번 주말에\u003c/span>\u003cspan class=\"en\">this weekend,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠?\u003c/span>\u003cspan class=\"en\">Dad?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아들: 아빠, 우리 이번 주말에 뭐 할까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들이 아빠에게 이번 주말 계획을 함께 정하자고 묻는 장면이에요. 대화의 \u003cb class=\"key\">제안\u003c/b>이 시작되는 첫 질문이죠. 뒤에서 캠핑 이야기가 자연스럽게 이어지도록 \u003cb class=\"key\">주말 \u003c/b>\u003cb class=\"key\">계획\u003c/b>을 꺼내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 의문문(주어-조동사 도치)\u003c/span> : [의문사 What] + [조동사 should] + [주어 we] + [동사원형 do] : \"우리가 ~해야 할까요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"What, 무엇을. should we do, 우리가 해야 할까요. this weekend, 이번 주말에. Dad?, 아빠?. 이 문장 전체를 해석하면, 아들: 아빠, 우리 이번 주말에 뭐 할까요?","hl":"m"},{"n":13,"text":"아들이 아빠에게 이번 주말 계획을 함께 정하자고 묻는 장면이에요. 대화의 제안이 시작되는 첫 질문이죠. 뒤에서 캠핑 이야기가 자연스럽게 이어지도록 주말 계획을 꺼내는 역할을 한답니다.","hl":"mn"},{"n":14,"text":"여기서 눈여겨볼 것은 조동사 의문문이에요. 의문사 What 다음에 조동사 should가 먼저 나오고 주어 we가 따라오죠. 이렇게 주어와 조동사가 자리를 바꾸는 것을 도치라고 해요. 그래서 우리가 무엇을 해야 할까라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 ~하는 게 어때요\u003c/span>\u003cspan class=\"en\">D: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">we\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캠핑 가는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">camping\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠: 우리 캠핑 가는 게 어떨까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 먼저 캠핑을 가자고 제안하는 문장이에요. Why don't we는 '왜 우리는 ~하지 않지'가 아니라 '우리 ~하는 게 어때'라는 뜻의 \u003cb class=\"key\">제안 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이죠. 그래서 아들이 곧바로 텐트가 없다고 답하는 흐름으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현 Why don't we + 동사원형\u003c/span> : Why don't we + [동사원형]? = 우리 ~하는 게 어때? : \"우리 ~하는 게 어때요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">go + 동명사(활동 표현)\u003c/span> : go + [-ing] : \"캠핑하러 가다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Why don't we, 우리 ~하는 게 어때요. go camping?, 캠핑 가는. 이 문장 전체를 해석하면, 아빠: 우리 캠핑 가는 게 어떨까?","hl":"m"},{"n":16,"text":"아빠가 먼저 캠핑을 가자고 제안하는 문장이에요. Why don't we는 왜 우리는 하지 않지가 아니라 우리 하는 게 어때라는 뜻의 제안 표현이죠. 그래서 아들이 곧바로 텐트가 없다고 답하는 흐름으로 이어진답니다.","hl":"mn"},{"n":17,"text":"먼저 Why don't we 뒤에는 동사원형이 온다는 점을 기억하세요. 직역투가 아니라 제안할 때 쓰는 관용 표현이라서 통째로 외워 두면 좋아요. 그리고 go camping처럼 go 뒤에 동명사를 붙이면 캠핑하러 가다라는 활동을 나타낸답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데\u003c/span>\u003cspan class=\"en\">B: But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 가지고 있지 않아요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">텐트가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tent\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아들: 그런데 우리는 텐트가 없잖아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들이 아빠의 제안에 텐트가 없다는 문제를 짚는 문장이에요. But으로 앞의 제안을 부드럽게 되돌리면서 \u003cb class=\"key\">걱정\u003c/b>을 꺼내죠. 그래서 다음에 텐트를 사야 하는지 묻는 말이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정문(do not + 동사원형)\u003c/span> : [주어] + do not + [동사원형] : \"가지고 있지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정관사 a + 단수 가산명사\u003c/span> : a + [단수 가산명사] : \"텐트 하나\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 그런데. we don't have, 우리는 가지고 있지 않아요. a tent, 텐트가. 이 문장 전체를 해석하면, 아들: 그런데 우리는 텐트가 없잖아요.","hl":"m"},{"n":19,"text":"아들이 아빠의 제안에 텐트가 없다는 문제를 짚는 문장이에요. But으로 앞의 제안을 부드럽게 되돌리면서 걱정을 꺼내죠. 그래서 다음에 텐트를 사야 하는지 묻는 말이 이어져요.","hl":"mn"},{"n":20,"text":"have는 일반동사라서 부정할 때 do not의 도움을 받아요. 그래서 we don't have a tent가 되고, don't 뒤에는 동사원형 have가 와요. 그리고 tent처럼 가산명사가 단수로 쓰이면 관사 a를 붙여서 텐트 하나라는 뜻을 나타낸답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 ~해야 할까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Should \u003c/span>\u003cspan class=\"tgt\">we\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나 사야\u003c/span>\u003cspan class=\"en\">buy \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하나 사야 할까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠의 캠핑 제안에 대해 B가 텐트가 없다는 사실을 먼저 말하고, 그럼 텐트를 하나 사야 하는지 \u003cb class=\"key\">제안\u003c/b>을 구하는 문장이에요. 여기서 one은 앞에 나온 a tent를 다시 말하지 않으려고 쓰는 \u003cb class=\"key\">대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should의 의문문(제안·권유)\u003c/span> : [[Should]] + [주어] + [동사원형] ~? : \"우리가 ~해야 할까요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 one(반복 회피)\u003c/span> : [앞에 나온 명사 a tent] → [[one]] : \"하나(텐트 하나)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Should we, 우리가 ~해야 할까요. buy one?, 하나 사야. 이 문장 전체를 해석하면, 하나 사야 할까요?","hl":"m"},{"n":22,"text":"아빠가 캠핑을 가자고 했죠. 그런데 텐트가 없으니까 텐트를 하나 사야 하는지 제안을 구하는 거예요. 여기서 one은 앞에 나온 a tent를 다시 말하지 않고 짧게 받아 주는 대명사예요.","hl":"mn"},{"n":23,"text":"먼저 Should we로 시작하는 의문문을 봐요. 제안이나 권유를 물을 때는 조동사 should를 주어 앞으로 보내서 의문문을 만들어요. 두 번째로 one이라는 단어는 앞에 나온 a tent를 다시 쓰지 않으려고 쓰는 대명사예요. 그래서 '텐트 하나'라는 뜻이 그대로 살아 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 ~을 돌볼 것인가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 강아지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">dog\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 우리 강아지는 누가 돌봐요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 텐트 걱정에 이어 강아지 \u003cb class=\"key\">돌봄\u003c/b> 문제를 하나 더 보태는 문장이에요. 의문사 who가 '누구를'이 아니라 '누가'라는 \u003cb class=\"key\">주어\u003c/b> 자리에 있어서 who 바로 뒤에 조동사가 오는 어순이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문대명사 who가 주어인 의문문\u003c/span> : [[Who]] + [조동사] + [동사] + ~? (who가 주어) : \"누가 우리 강아지를 돌볼 것인가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구(숙어) take care of\u003c/span> : [take care of + 목적어] = [~을 돌보다] : \"~을 돌보다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Also, 또. who will take care of, 누가 ~을 돌볼 것인가. our dog?, 우리 강아지를. 이 문장 전체를 해석하면, 또 우리 강아지는 누가 돌봐요?","hl":"m"},{"n":25,"text":"텐트 걱정에 이어서 강아지 걱정을 하나 더 보태는 문장이에요. 누가 우리 강아지를 돌볼 거냐고 물으면서, 캠핑을 가면 강아지 돌봄 문제가 생긴다는 걸 짚는 거죠.","hl":"mn"},{"n":26,"text":"먼저 who를 봐요. 여기서 who는 '누구를'이 아니라 '누가'라는 주어예요. 주어를 묻는 의문사라서 who 뒤에 조동사 will이 바로 와요. 두 번째로 take care of는 하나의 동사구로 묶여서 '돌보다'라는 뜻을 만들어요. 그래서 목적어인 our dog가 of 뒤에 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하지 마세요\u003c/span>\u003cspan class=\"en\">D: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">worry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠: 걱정하지 마.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 텐트도 없고 강아지도 걱정이라는 아들의 말을 한 번에 \u003cb class=\"key\">안심\u003c/b>시키는 문장이에요. 바로 뒤에 '도와줄 앱이 있다'는 말을 꺼내기 위한 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문(Don't + 동사원형)\u003c/span> : [[Don't]] + [동사원형] = [~하지 마] : \"걱정하지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Don't, ~하지 마세요. worry, 걱정하다. 이 문장 전체를 해석하면, 아빠: 걱정하지 마.","hl":"m"},{"n":28,"text":"아빠가 텐트도 없고 강아지도 걱정인 아들에게 일단 마음을 놓으라고 안심시키는 말이에요. 바로 뒤에 도와줄 앱이 있다고 말할 준비를 하는 거죠.","hl":"mn"},{"n":29,"text":"여기는 부정 명령문이에요. 상대에게 하지 말라고 할 때는 don't를 문장 앞에 두고, 동사 worry는 원형 그대로 써요. 명령문에서는 주어 you가 생략된다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고 있지\u003c/span>\u003cspan class=\"en\">know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 앱들을\u003c/span>\u003cspan class=\"en\">some apps\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 도와줄 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 우리를 도와줄 수 있는 몇 가지 앱들을 알고 있지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 걱정하지 말라는 말의 근거로 \u003cb class=\"key\">해결책\u003c/b>을 제시하는 문장이에요. 'some apps'는 구체적으로 말하지 않은 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">앱\u003c/b>이고, that절은 그 앱들이 우리를 도와줄 수 있다는 \u003cb class=\"key\">관계대명사\u003c/b> 수식이에요. 앞으로 캠핑 준비 문제를 앱으로 해결하겠다는 흐름을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : some apps + [that can help us (주격 관계대명사절)] : \"우리를 도와줄 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I, 내가. know, 알고 있지. some apps, 몇 가지 앱들을. that can help us, 우리를 도와줄 수 있는. 이 문장 전체를 해석하면, 내가 우리를 도와줄 수 있는 몇 가지 앱들을 알고 있지.","hl":"m"},{"n":31,"text":"이 문장은 아빠가 걱정하지 말라는 말의 근거로 해결책을 제시하는 문장이에요. some apps는 구체적으로 말하지 않은 몇 가지 앱이고, that절은 그 앱들이 우리를 도와줄 수 있다는 관계대명사 수식이에요. 그래서 앞으로 캠핑 준비 문제를 앱으로 해결하겠다는 흐름을 만들어 줍니다.","hl":"mn"},{"n":32,"text":"여기서 that은 앞에 있는 선행사 some apps를 받아서 뒤 문장에서 주어 역할을 하는 주격 관계대명사예요. that can help us 전체가 some apps를 꾸며 주니까 우리를 도와줄 수 있는 몇 가지 앱들이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아들은 이번 주말에 무엇을 할지 아빠에게 \u003cb class=\"key\">질문\u003c/b>해요.\u003c/li>\u003cli>아빠는 함께 \u003cb class=\"key\">캠핑\u003c/b>을 가자고 제안하지만, 아들은 \u003cb class=\"key\">텐트\u003c/b>가 없다는 걱정을 꺼내요.\u003c/li>\u003cli>아들은 텐트를 사야 하는지와 \u003cb class=\"key\">강아지\u003c/b>를 누가 돌볼지도 물어요.\u003c/li>\u003cli>아빠는 걱정하지 말라며 도움을 줄 수 있는 \u003cb class=\"key\">앱\u003c/b>들을 알고 있다고 말해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A father suggests camping for the weekend and reassures his son that helpful apps can solve their concerns.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아들이 주말 캠핑을 제안한 아빠에게 텐트가 없고 강아지 돌봄 문제가 있다고 걱정하자, 아빠는 도움을 줄 \u003cb class=\"key\">앱\u003c/b>들을 알고 있다며 안심시킨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 대화는 주말 캠핑 제안에서 시작해 텐트와 강아지 걱정을 앱으로 해결하는 내용이었어요. 문제가 끝에서 해결되는 미괄식 구조라는 점, 그리고 Don't worry와 I know some apps that can help us를 꼭 기억해 주세요. 여러분도 직접 소리 내어 대화를 읽으며 제안 표현과 돌봄 표현을 익혀 보세요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
