유 경제 애플리케이션을 통해 물건을 빌리거나 반려견 돌봄 같은 서비스를 이용할 수 있다.</li><li>다양한 앱을 통한 자원 대여 및 서비스 활용</li><li>공유 경제(sharing economy)의 일상화</li><li>핵심 키워드: 공유 경제(sharing economy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02공유 경제의 정의</div><ul><li>사람들이 자신의 물건이나 서비스를 저렴한 비용 또는 무료로 공유하는 방식을 말한다.</li><li>자산과 서비스의 자발적 공유</li><li>수수료(fee) 기반의 서비스 제공</li><li>핵심 키워드: 공유(share), 서비스(services)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03공유 경제의 한계</div><ul><li>사용자들에 의해 부정적인 평가가 제기되기도 하며, 서비스 이용 과정에서 단점이 드러난다.</li><li>서비스 이용 후기(reviews)를 통한 불만 사례 발생</li><li>공유 서비스가 가진 구조적 약점(weaknesses)</li><li>핵심 키워드: 부정적 후기(negative reviews), 약점(weaknesses)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04공유 경제의 미래</div><ul><li>서비스 이용자가 많아질수록 시스템이 점차 발전하고 개선될 것으로 기대된다.</li><li>사용자 증가에 따른 시스템 보완</li><li>공유 경제 서비스의 지속적 개선(improve)</li><li>핵심 키워드: 개선(improve)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">sharing economy</td><td class=\"m\">공유 경제</td></tr><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fee</td><td class=\"m\">요금, 수수료</td></tr><tr><td class=\"w\">weakness</td><td class=\"m\">약점</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr><tr><td class=\"w\">review</td><td class=\"m\">후기, 평가</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선되다, 향상되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아들:</span><span class=\"en\"><b>Son:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 좋은 앱들이네요!</span><span class=\"en\"><b><span class=\"grammar-hl\">What great apps!</span></b></span></div></div><div class=\"lec-sent-ko\">(아들: 정말 좋은 앱들이네요!)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아들이 공유 경제 앱을 직접 사용해 보고 그 편리함과 유용성에 감탄하며 대화를 시작합니다. 앞뒤 맥락상 공유 경제 서비스의 긍정적인 측면을 먼저 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What great apps! (감탄문): &#39;What + 형용사 + 명사(!)&#39; 구조로, 명사를 강조하여 감탄을 나타내는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 텐트를 빌리고</span><span class=\"en\"><b>We can borrow a tent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을 찾을 수 있어요</span><span class=\"en\"><b>and find someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 강아지를 돌봐 줄</span><span class=\"en\"><b><span class=\"grammar-hl\">to take care of</span> our dog.</b></span></div></div><div class=\"lec-sent-ko\">(우리는 텐트를 빌리고 우리 강아지를 돌봐 줄 사람을 찾을 수 있어요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 아들의 의견에 동의하며, 방금 언급한 앱들이 경제학적 개념인 &#39;공유 경제&#39;에 해당한다는 것을 알려줍니다. 뒤에 이어질 공유 경제의 정의를 제시하기 위한 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take care of (to부정사): &#39;to + 동사원형&#39; 형태가 앞의 대명사 someone을 수식하는 형용사적 용법으로, &#39;~할&#39;이라는 의미를 가집니다.</div><div class=\"lec-gr-item\">take care of (관용표현): &#39;~를 돌보다&#39;라는 의미의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠:</span><span class=\"en\"><b>Dad:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지.</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s</span> right.</b></span></div></div><div class=\"lec-sent-ko\">(아빠: 그렇지.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 아들의 의견에 동의하며, 방금 언급한 앱들이 경제학적 개념인 &#39;공유 경제&#39;에 해당한다는 것을 알려줍니다. 뒤에 이어질 공유 경제의 정의를 제시하기 위한 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s (축약형): &#39;That is&#39;의 줄임말로, 앞서 언급된 상황을 지칭하는 주어와 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 서비스가</span><span class=\"en\"><b>These kinds of services</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘공유 경제’의 일부란다.</span><span class=\"en\"><b>are part of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부란다.</span><span class=\"en\"><b>the “<span class=\"grammar-hl\">sharing</span> economy.</b></span></div></div><div class=\"lec-sent-ko\">(이런 종류의 서비스가 ‘공유 경제’의 일부란다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠의 긍정적인 설명에 대해 아들이 반론을 제기합니다. weaknesses는 사전적으로 &#39;약점&#39;이지만, 여기서는 공유 경제 서비스가 가진 &#39;단점&#39;이나 &#39;한계&#39;를 의미합니다. 단순히 성격적 약점이 아니라 시스템상의 결함을 지적하려는 아들의 비판적인 시각이 잘 드러나 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sharing (동명사): &#39;sharing(공유)&#39;이라는 행위가 economy를 꾸며주는 명사적 용도로 사용된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">sharing economy</td><td class=\"m\">공유 경제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 물건을 다른 사람들과 공유할 수 있고</span><span class=\"en\"><b>can <span class=\"grammar-hl\">share their items with others</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 서비스를 제공할 수 있어</span><span class=\"en\"><b>and <span class=\"grammar-hl\">provide services to them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적은 비용이나 무료로</span><span class=\"en\"><b>at a small fee or for free.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 적은 비용이나 무료로 자신의 물건을 다른 사람들과 공유할 수 있고 그들에게 서비스를 제공할 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공유 경제의 구체적인 작동 방식을 설명합니다. 여기서 fee는 사전적으로 &#39;수수료&#39;를 뜻하지만, 여기서는 서비스를 이용하기 위해 지불하는 &#39;대가&#39;나 &#39;비용&#39;을 의미합니다. 필자는 공유 경제가 거창한 거래가 아니라 소액으로도 쉽게 이루어질 수 있다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">share their items with others 5형식 구조와 유사한 일반동사 활용: &#39;share A with B&#39; 패턴으로, A를 B와 나누다라는 의미의 기본 구조입니다.</div><div class=\"lec-gr-item\">provide services to them (기본구조): &#39;provide A to B&#39; 패턴으로, A를 B에게 제공한다는 의미의 타동사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr><tr><td class=\"w\">provide</td><td class=\"m\">제공하다</td></tr><tr><td class=\"w\">fee</td><td class=\"m\">요금, 수수료</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아들:</span><span class=\"en\"><b>Son:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 이런 서비스들은</span><span class=\"en\"><b>But these services</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 약점들을 가지고 있긴 해요.</span><span class=\"en\"><b><span class=\"grammar-hl\">do have</span> some weaknesses.</b></span></div></div><div class=\"lec-sent-ko\">아들: 하지만 이런 서비스들은 몇 가지 약점들을 가지고 있긴 해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠의 긍정적인 설명에 대해 아들이 반론을 제기합니다. weaknesses는 사전적으로 &#39;약점&#39;이지만, 여기서는 공유 경제 서비스가 가진 &#39;단점&#39;이나 &#39;한계&#39;를 의미합니다. 단순히 성격적 약점이 아니라 시스템상의 결함을 지적하려는 아들의 비판적인 시각이 잘 드러나 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do have (강조구문): 일반동사 have 앞에 do를 추가하여 동사의 의미를 강조하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">weakness</td><td class=\"m\">약점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 사람들이</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 후기들을 남겼잖아요.</span><span class=\"en\"><b>left <span class=\"grammar-hl\">negative reviews</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서비스에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">about the services</span>.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 사람들이 서비스에 대해 부정적인 후기들을 남겼잖아요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">negative reviews about the services (기본구조): 명사(reviews) 뒤에 전치사구(about the services)가 붙어 내용을 부연 설명하는 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr><tr><td class=\"w\">review</td><td class=\"m\">후기, 평가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠:</span><span class=\"en\"><b>Dad: Well, I think <span class=\"grammar-hl\">the more people use the services, the more they will improve</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글쎄,</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 ~라고 생각해</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 사람들이 그 서비스들을 사용할수록,</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 더 개선될 것이라는 것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">아빠: 글쎄, 나는 더 많은 사람들이 그 서비스들을 사용할수록, 그것들이 더 개선될 것이라고 생각해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 아들의 지적(단점)을 인정하면서도, 공유 경제가 성장하면서 자연스럽게 보완될 것이라는 낙관적인 전망을 제시합니다. &#39;The 비교급~, the 비교급~&#39; 구문을 사용하여 서비스 이용량과 발전 정도가 비례한다는 점을 논리적으로 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the more people use the services, the more they will improve (관용표현): &#39;the + 비교급 + S + V, the + 비교급 + S + V&#39; 구조로, &#39;~하면 할수록 더욱 ~하다&#39;라는 비례를 나타내는 표현입니다.</div><div class=\"lec-gr-item\">they will improve 대명사: 앞에 언급된 the services를 가리키는 주어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선되다, 향상되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아들은 공유 경제 앱의 편리함에 감탄하지만, 동시에 부정적인 후기라는 단점도 발견한다.</li><li>아빠는 이를 공유 경제의 개념으로 설명하며, 초기의 미흡함은 이용자가 늘어날수록 해결될 것이라고 조언한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The sharing economy provides convenient access to various services, but it still requires further improvements to address negative user feedback.</div>\n              <div class=\"lec-final-sum-ko\">공유 경제는 다양한 서비스에 대한 편리한 접근을 제공하지만, 부정적인 사용자 피드백을 해결하기 위해 여전히 추가적인 개선이 필요하다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":"main"},{"audio":"./4_audio/13.mp3","hl":"meaning"},{"audio":"./4_audio/14.mp3","hl":"grammar"}],[{"audio":"./4_audio/15.mp3","hl":"main"},{"audio":"./4_audio/16.mp3","hl":"meaning"},{"audio":"./4_audio/17.mp3","hl":"grammar"}],[{"audio":"./4_audio/18.mp3","hl":"main"},{"audio":"./4_audio/19.mp3","hl":"meaning"},{"audio":"./4_audio/20.mp3","hl":"grammar"}],[{"audio":"./4_audio/21.mp3","hl":"main"},{"audio":"./4_audio/22.mp3","hl":"meaning"},{"audio":"./4_audio/23.mp3","hl":"grammar"}],[{"audio":"./4_audio/24.mp3","hl":"main"},{"audio":"./4_audio/25.mp3","hl":"meaning"},{"audio":"./4_audio/26.mp3","hl":"grammar"}],[{"audio":"./4_audio/27.mp3","hl":"main"},{"audio":"./4_audio/28.mp3","hl":"grammar"}],[{"au
