<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중 능률(김) 6과 본문4 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중 능률(김) 6과 본문4","audioDir":"4_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중 능률(김) 6과\u003c/div>\u003ch1>The Sharing Economy: Great Apps with Room to Improve\u003c/h1>\u003ch2>공유 경제: 좋은 앱, 그러나 개선의 여지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아들은 텐트를 빌리고 강아지를 돌봐 줄 사람을 찾을 수 있는 앱을 보고 감탄하고, 아빠는 이런 서비스가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 일부라고 설명한다. 아들이 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b> 같은 약점을 지적하자, 아빠는 더 많은 사람들이 서비스를 사용할수록 더 \u003cb class=\"key\">개선\u003c/b>될 것이라고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sharing economy services have some weaknesses, but they will improve as more people use them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 중학교 능률 김 선생님 교과서 육과 본문 네 번째 부분이에요. 아들과 아빠가 앱을 보면서 나누는 짧은 대화인데, 처음에는 신기한 서비스에 감탄하고 나중에는 그 서비스의 약점과 미래를 이야기해요. 한마디로 공유 경제 서비스는 약점이 있지만 사람들이 많이 쓸수록 개선될 거라는 내용이에요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">공유 경제(sharing economy)는 자동차나 텐트, 심지어 반려동물 돌봄 같은 자원을 굳이 소유하지 않고 필요한 사람끼리 빌리고 나누는 방식이에요. 우버(Uber)나 에어비앤비(Airbnb)처럼 개인이 가진 물건이나 재능을 플랫폼(platform)을 통해 거래하는 서비스가 대표적이죠. 이때 이용자들은 적은 비용(a small fee)을 내거나 무료로 서비스를 주고받아요. 그런데 낯선 사람과 거래하다 보니 상대를 판단할 근거가 후기(review)밖에 없다는 점이 늘 걸림돌이 돼요. 마치 중고 거래 앱에서 판매자의 평점을 먼저 확인하고 물건을 사는 것과 같은 원리예요. 그래서 처음에는 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b>가 있어도 이용자가 늘면서 \u003cb class=\"key\">신뢰\u003c/b>가 쌓이면 서비스가 \u003cb class=\"key\">개선\u003c/b>된다는 것이 이 글의 시각이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 공유 경제, 영어로 sharing economy는 자동차나 텐트, 심지어 반려동물 돌봄 같은 자원을 굳이 사지 않고 필요한 사람끼리 빌리고 나누는 방식이에요. 우버나 에어비앤비처럼 개인이 가진 물건이나 재능을 플랫폼을 통해 거래하는 서비스가 대표적이죠. 이때 사람들은 적은 비용을 내거나 무료로 서비스를 주고받아요. 그런데 낯선 사람과 거래하다 보니 상대를 판단할 근거가 후기밖에 없다는 게 늘 걸림돌이에요. 중고 거래 앱에서 판매자 평점을 먼저 보고 물건을 사는 것과 똑같은 원리죠. 그래서 처음에는 부정적인 후기가 있어도 이용자가 늘면서 신뢰가 쌓이면 서비스가 개선된다는 것이 이 글의 시각이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>앱에 대한 감탄\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>아들이 'What great apps!'라고 감탄하며 대화가 시작돼요. 이어서 텐트를 \u003cb class=\"key\">빌리고\u003c/b> 우리 강아지를 \u003cb class=\"key\">돌봐 \u003c/b>\u003cb class=\"key\">줄\u003c/b> 사람을 찾을 수 있다는 구체적인 활용법을 말하죠. 실제 생활에서 바로 쓸 수 있는 서비스라는 점이 드러나는 \u003cb class=\"key\">도입\u003c/b> 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>공유 경제의 개념\u003csmall>개념 정의 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>아빠가 'That's right.'이라고 맞장구를 치며 이런 서비스가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 일부라고 설명해요. 사람들이 적은 비용이나 무료로 자신의 물건을 다른 사람들과 \u003cb class=\"key\">공유\u003c/b>하고 그들에게 서비스를 \u003cb class=\"key\">제공\u003c/b>할 수 있다는 원리를 밝히죠. 구체적인 사례가 개념 설명으로 넓어지는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>약점 제기\u003csmall>반례 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>아들이 But을 붙여 화제를 돌려요. 이런 서비스들이 몇 가지 \u003cb class=\"key\">약점\u003c/b>을 가지고 있긴 하다면서, 몇몇 사람들이 서비스에 대해 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b>를 남겼다는 근거를 들어요. 앞에서 말한 장점에 대한 \u003cb class=\"key\">반례\u003c/b>를 드는 셈이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>개선에 대한 기대\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>아빠가 Well로 한 박자 쉬며 자신의 생각을 꺼내요. 더 많은 사람들이 그 서비스들을 사용할수록 그것들이 더 \u003cb class=\"key\">개선\u003c/b>될 것이라고 말하며 대화를 맺어요. the more ~ the more 구문으로 \u003cb class=\"key\">비례\u003c/b> 관계를 보여 주면서, 약점을 성장의 과정으로 바꿔 놓는 \u003cb class=\"key\">결론\u003c/b>이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 대화가 어떤 순서로 흘러가는지 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 아들이 What great apps!라고 감탄하면서 대화가 열리죠. 이어서 우리는 텐트를 빌리고 우리 강아지를 돌봐 줄 사람을 찾을 수 있다고 말해요. 실제 생활에서 바로 쓸 수 있는 서비스라는 걸 보여 주는 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 개념이 나와요. 아빠가 That's right라고 맞장구를 치면서 이런 종류의 서비스가 공유 경제의 일부라고 설명하죠. 사람들은 적은 비용이나 무료로 자신의 물건을 다른 사람들과 공유할 수 있고 그들에게 서비스를 제공할 수 있다고 덧붙여요. 구체적인 사례가 개념 설명으로 넓어지는 지점이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 약점 제기예요. 아들이 But을 붙이면서 분위기를 바꾸죠. 이런 서비스들이 몇 가지 약점을 가지고 있긴 하다면서, 몇몇 사람들이 서비스에 대해 부정적인 후기들을 남겼다고 근거를 대요. 앞에서 말한 장점에 반례를 드는 셈이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 개선에 대한 기대예요. 아빠가 Well로 한 박자 쉬고 나서, 나는 더 많은 사람들이 그 서비스들을 사용할수록 그것들이 더 개선될 것이라고 생각한다고 말해요. the more the more 구문으로 비례 관계를 보여 주면서 약점을 성장의 과정으로 바꿔 놓는 결론이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">대화가 아들의 감탄으로 시작해 아빠의 \u003cb class=\"key\">개념 \u003c/b>\u003cb class=\"key\">설명\u003c/b>으로 이어지지만, 글쓴이의 핵심 생각은 마지막 문장에서 나와요. 여섯 번째 문장에서 아들이 \u003cb class=\"key\">약점\u003c/b>을 꺼내 분위기를 바꾸고, 마지막에 아빠가 그것을 \u003cb class=\"key\">반박\u003c/b>하며 주제를 완성하죠. 그래서 중심 내용이 맨 끝에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>That's right (3)\u003c/b>\u003cspan>동의·수용\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>화제 전환(약점 제기)\u003c/span>\u003cb>Well, I think (8)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003cb>the more ~ the more (8)\u003c/b>\u003cspan>비례·인과 관계\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">great apps\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these kinds of services\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the &quot;sharing economy&quot;\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">share their items with others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">provide services to them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these services\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the services\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>공유 서비스의 긍정적 측면\u003c/th>\u003cth>공유 서비스의 약점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>텐트를 빌리고 강아지를 돌볼 사람을 찾을 수 있음\u003c/td>\u003ctd>서비스에 대한 부정적인 후기들이 남겨져 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적은 비용이나 무료로 물건과 서비스를 공유 가능\u003c/td>\u003ctd>이용자가 늘수록 개선될 것이라는 기대\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념과 반박의 방식으로 전개되고, 구조는 미괄식이에요. 앞부분에서 아들은 감탄하고 아빠는 개념을 설명하지만, 핵심 생각은 마지막 문장에서 나와요. 여섯 번째 문장에서 아들이 약점을 꺼내고 마지막에 아빠가 그것을 반박하면서 주제를 완성하니까요. 그래서 중심 내용이 끝에 놓인 미괄식으로 읽어야 해요.","hl":"ty"},{"n":9,"text":"신호어도 짚어 볼게요. 세 번째 문장의 That's right는 상대 말을 받아들이는 동의의 신호예요. 여섯 번째 문장의 But은 화제를 약점 쪽으로 돌리는 전환이고, 마지막 문장의 Well, I think는 화자의 주장이 시작된다는 표시죠. 그리고 the more the more는 앞의 내용이 뒤의 결과로 이어진다는 비례 관계를 알려 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>app\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응용 프로그램, 앱\u003c/span>\u003c/div>\u003cdiv>\u003cb>borrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>텐트\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>That's right\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그렇지, 맞아\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종류\u003c/span>\u003c/div>\u003cdiv>\u003cb>service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>part of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 일부\u003c/span>\u003c/div>\u003cdiv>\u003cb>sharing economy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공유 경제\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다, 나누다\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건, 항목\u003c/span>\u003c/div>\u003cdiv>\u003cb>others\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다른 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at a small fee\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적은 비용으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>for free\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무료로\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>do\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(동사 강조) 정말 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>some\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>몇몇의, 약간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>negative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>review\u003c/b>\u003cem>명사\u003c/em>\u003cspan>후기, 평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>well\u003c/b>\u003cem>부사\u003c/em>\u003cspan>글쎄, 음\u003c/span>\u003c/div>\u003cdiv>\u003cb>the more ~ the more\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할수록 더 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선되다, 향상시키다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚을게요. borrow는 빌리다, take care of는 돌보다, provide는 제공하다, weakness는 약점, review는 후기라는 뜻이에요. 특히 at a small fee는 적은 비용으로, for free는 무료로라는 숙어니까 통째로 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">공유하다, 나누다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"s\">exchange\u003c/span>\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">hoard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">provide\u003c/b>\u003cspan class=\"m\">제공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">supply\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weakness\u003c/b>\u003cspan class=\"m\">약점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flaw\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">shortcoming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003cspan class=\"a\">merit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">negative\u003c/b>\u003cspan class=\"m\">부정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfavorable\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"s\">adverse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">positive\u003c/span>\u003cspan class=\"a\">favorable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">개선되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">upgrade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">use\u003c/b>\u003cspan class=\"m\">사용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">utilize\u003c/span>\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"s\">apply\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">free\u003c/b>\u003cspan class=\"m\">무료의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costless\u003c/span>\u003cspan class=\"s\">complimentary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">paid\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 정리해 볼게요. share는 나누다라는 뜻으로 divide나 exchange와 가깝고 반대말은 keep이에요. provide는 supply나 offer로 바꿔 쓸 수 있고 반대는 receive죠. weakness는 flaw나 shortcoming과 같고 반대는 strength예요. negative는 unfavorable나 critical로 바꿀 수 있고 반대는 positive고요. improve는 enhance나 better로 바꿀 수 있고 반대는 worsen이며, use는 utilize나 employ와 같고 반대는 abandon이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들:\u003c/span>\u003cspan class=\"en\">Son:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 좋은 앱들이네요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">apps!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아들: 정말 좋은 앱들이네요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들이 공유 경제 앱을 보고 감탄하는 장면이에요. \u003cb class=\"key\">감탄문\u003c/b>인 What great apps!는 '정말 좋은 앱들이네요!'라는 뜻으로, What 뒤에 형용사 great과 복수명사 apps가 온 구조예요. 주어와 동사 they are가 생략된 \u003cb class=\"key\">구어체\u003c/b> 표현이라 짧고 힘 있게 감탄을 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문 (What + 형용사 + 명사)\u003c/span> : What + [형용사] + [명사] (+ 주어 + 동사)! : \"정말 좋은 앱들이네요!\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Son, 아들:. What great apps!, 정말 좋은 앱들이네요!. 이 문장 전체를 해석하면, 아들: 정말 좋은 앱들이네요!","hl":"m"},{"n":13,"text":"아들이 공유 경제 앱을 보면서 감탄하는 장면이에요. What great apps는 감탄문으로 '정말 좋은 앱들이네요'라는 뜻이죠. 주어와 동사가 생략된 구어체 표현이라 짧고 힘 있게 감탄이 전달돼요.","hl":"mn"},{"n":14,"text":"첫 번째 어법은 감탄문이에요. What 다음에는 형용사 great과 명사 apps가 같이 와서 '정말 좋은 앱들'이라는 감탄을 만들어요. How였다면 형용사만 오니까 What great apps와 How great apps의 차이를 꼭 구분해 두세요. 주어와 동사가 생략된 구어체라서 짧게 던지는 느낌이 난다는 것도 함께 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">텐트를 빌릴 수 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">borrow\u003c/span> a tent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 ~할 사람을 찾을 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 강아지를 돌봐 줄\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">dog\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 텐트를 빌리고 우리 강아지를 돌봐 줄 사람을 찾을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공유 경제 서비스를 이용해 텐트를 빌리고 강아지 돌봄 서비스를 찾을 수 있다는 뜻이에요. 조동사 can이 borrow와 find 두 동사를 함께 이끌어 '빌릴 수 있고 찾을 수 있다'는 \u003cb class=\"key\">가능\u003c/b>의 의미를 만들어요. to take care of our dog는 someone을 꾸미는 \u003cb class=\"key\">형용사적 \u003c/b>\u003cb class=\"key\">용법\u003c/b>으로 '우리 강아지를 돌봐 줄 사람'이라고 해석해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (가능)\u003c/span> : 주어 + [can] + [동사원형] + 목적어 : \"빌릴 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and (병렬)\u003c/span> : [(can) borrow + 목적어] and [(can) find + 목적어] : \"그리고 찾을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : someone + [to + 동사원형 ~] (명사 수식) : \"우리 강아지를 돌봐 줄\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We, 우리는. can borrow a tent, 텐트를 빌릴 수 있고. and find someone, 그리고 ~할 사람을 찾을 수 있어요. to take care of our dog, 우리 강아지를 돌봐 줄. 이 문장 전체를 해석하면, 우리는 텐트를 빌리고 우리 강아지를 돌봐 줄 사람을 찾을 수 있어요.","hl":"m"},{"n":16,"text":"공유 경제 서비스를 이용해서 텐트를 빌리고 강아지를 돌봐 줄 사람까지 찾을 수 있다는 뜻이에요. 조동사 can 하나가 borrow와 find 두 동사를 함께 이끌면서 가능의 의미를 만들어 주죠. 뒤에 붙은 to take care of our dog는 someone을 꾸미는 형용사적 용법이라서 '우리 강아지를 돌봐 줄 사람'으로 해석해요.","hl":"mn"},{"n":17,"text":"첫 번째 어법은 조동사 can이에요. 조동사 뒤에는 반드시 동사원형이 오기 때문에 borrow가 원형 그대로 쓰였어요. 두 번째는 등위접속사 and의 병렬 구조예요. 앞의 can borrow와 같은 조동사의 힘을 이어받아 find도 동사원형으로 나란히 연결돼요. 세 번째는 to부정사의 형용사적 용법인데요, to take care of our dog가 someone 뒤에서 명사를 꾸며 주면서 '우리 강아지를 돌봐 줄'이라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠:\u003c/span>\u003cspan class=\"en\">Dad:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> right.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠: 그렇지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 아들의 말에 동의하며 짧게 맞장구치는 문장이에요. That's는 That is의 \u003cb class=\"key\">축약형\u003c/b>이고, right는 '맞다'는 뜻의 \u003cb class=\"key\">형용사\u003c/b>예요. 회화에서 상대의 말을 인정할 때 가장 자주 쓰는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 That + be동사 축약\u003c/span> : That(지시대명사) + is(be동사) → That's + 형용사 : \"그것은 ~이다 → 그렇지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Dad, 아빠:. That's right, 그렇지.. 이 문장 전체를 해석하면, 아빠: 그렇지.","hl":"m"},{"n":19,"text":"아버지가 아들의 말에 동의하면서 짧게 맞장구치는 문장이에요. That's는 That is의 축약형이고 right는 '맞다'는 뜻의 형용사죠. 회화에서 상대의 말을 인정할 때 가장 자주 쓰는 표현이에요.","hl":"mn"},{"n":20,"text":"첫 번째 어법은 지시대명사 That이에요. 앞에 나온 말 전체를 That으로 받아서 '그것은 맞아요'라고 지시하는 구조죠. 그리고 is를 줄여서 That's로 가볍게 발음한다는 점도 함께 기억해 두세요. 이렇게 짧은 동의 표현은 회화 문장에서 자주 나오니까 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 서비스가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">kinds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">services \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부란다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘공유 경제’의\u003c/span>\u003cspan class=\"en\">the &quot;sharing economy.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 종류의 서비스가 ‘공유 경제’의 일부란다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 언급한 앱 서비스들이 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>라는 큰 개념 안에 포함된다는 점을 처음 제시하는 문장이에요. \u003cb class=\"key\">These \u003c/b>\u003cb class=\"key\">kinds \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">services\u003c/b>는 앞에 나온 서비스들을 묶어 가리키고, are part of는 ‘~의 일부이다’라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 개념 안에 들어 있다는 느낌을 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치(복수 주어)\u003c/span> : [These kinds of + 복수명사] + are + [명사구] : \"이런 종류의 서비스들은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">‘be part of’ 관용 표현(무관사)\u003c/span> : [주어] + be + part of + [명사] : \"~의 일부이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"These kinds of services, 이런 종류의 서비스가. are part of, 일부란다. the \"sharing economy.\", ‘공유 경제’의. 이 문장 전체를 해석하면, 이런 종류의 서비스가 ‘공유 경제’의 일부란다.","hl":"m"},{"n":22,"text":"앞에서 나온 서비스들이 공유 경제라는 큰 틀 안에 들어 있다는 걸 알려 주는 문장이에요. These kinds of services가 복수라는 점과 are part of가 일부이라는 뜻의 관용 표현이라는 점이 핵심이에요.","hl":"mn"},{"n":23,"text":"어법 포인트는 두 가지예요. 첫 번째, 주어가 These kinds of services라서 복수이기 때문에 be동사가 are로 와요. kinds of 뒤에 복수 명사가 오면 동사도 복수에 맞춰 준다는 걸 기억하세요. 두 번째, are part of는 일부이라는 뜻의 관용 표현인데 part 앞에 관사를 쓰지 않는다는 게 포인트예요. 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 자신의 물건을 공유할 수 있고\u003c/span>\u003cspan class=\"en\">People can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">share \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">items \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 서비스를 제공할 수 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">provide \u003c/span>\u003cspan class=\"tgt\">services \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적은 비용으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">fee \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 무료로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 적은 비용이나 무료로 자신의 물건을 다른 사람들과 공유할 수 있고 그들에게 서비스를 제공할 수 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공유 경제에서 사람들이 실제로 무엇을 하는지 구체적으로 설명하는 문장이에요. 조동사 can 하나가 share와 provide 두 동사를 함께 이끌어 \u003cb class=\"key\">병렬\u003c/b> 구조를 이루고, 마지막에 at a small fee or for free로 \u003cb class=\"key\">비용\u003c/b> 조건까지 붙여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 뒤 동사원형의 병렬 구조\u003c/span> : can + [share] + and + [(can) provide] : \"공유할 수 있고 … 제공할 수 있어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">provide + 목적어 + to + 대상\u003c/span> : provide + [services] + to + [them] : \"그들에게 서비스를 제공하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬(부사구)\u003c/span> : at + [a small fee] + or + for + [free] : \"적은 비용으로 또는 무료로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"People can share their items, 사람들은 자신의 물건을 공유할 수 있고. with others, 다른 사람들과. and provide services to them, 그들에게 서비스를 제공할 수 있어. at a small fee, 적은 비용으로. or for free, 또는 무료로. 이 문장 전체를 해석하면, 사람들은 적은 비용이나 무료로 자신의 물건을 다른 사람들과 공유할 수 있고 그들에게 서비스를 제공할 수 있어.","hl":"m"},{"n":25,"text":"공유 경제에서 사람들이 실제로 무엇을 하는지 구체적으로 보여 주는 문장이에요. 조동사 can 하나가 share와 provide를 같이 이끌고 있고, 마지막에 적은 비용이나 무료라는 조건까지 붙어 있어요.","hl":"mn"},{"n":26,"text":"어법 포인트는 세 가지예요. 첫 번째, 조동사 can 하나가 share와 provide를 함께 이끌기 때문에 뒤쪽 provide도 동사원형으로 병렬을 맞춰요. 두 번째, provide services to them은 provide A to B 형태로, services가 목적어고 them이 서비스를 받는 대상이에요. provide B with A로 바꿔 쓸 수 있다는 것도 같이 기억해 두세요. 세 번째, at a small fee or for free는 전치사 at과 for가 이끄는 두 부사구가 or로 병렬을 이루는 구조예요. for free는 무료로라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">Son: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 서비스들은\u003c/span>\u003cspan class=\"en\">these services\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 가지고 있긴 해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 약점들을\u003c/span>\u003cspan class=\"en\">some weaknesses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아들: 하지만 이런 서비스들은 몇 가지 약점들을 가지고 있긴 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 공유 경제 설명을 인정하면서도, 반대되는 내용을 꺼내 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 전환하는 문장이에요. do have에서 do가 동사를 \u003cb class=\"key\">강조\u003c/b>해 ‘정말 가지고 있긴 하다’는 뉘앙스를 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 But의 역접\u003c/span> : [앞 내용] + But + [반대 내용] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 강조(do + 동사원형)\u003c/span> : [주어] + do/does/did + [동사원형] : \"정말 ~을 가지고 있다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But, 하지만. these services, 이런 서비스들은. do have, 정말 가지고 있긴 해. some weaknesses, 몇 가지 약점들을. 이 문장 전체를 해석하면, 아들: 하지만 이런 서비스들은 몇 가지 약점들을 가지고 있긴 해요.","hl":"m"},{"n":28,"text":"앞에서 한 공유 경제 설명을 인정하면서도 반대되는 내용을 꺼내서 글의 흐름을 바꿔 주는 문장이에요. 아들이 서비스의 단점을 걱정하는 장면이라고 보면 돼요.","hl":"mn"},{"n":29,"text":"여기서 do have가 눈에 띄죠. 일반동사 앞에 do를 넣으면 그 동사를 강조하는 뜻이 돼요. 그래서 그냥 have가 아니라 정말 가지고 있긴 하다는 뉘앙스가 생겨요. 이때 뒤에 오는 동사는 반드시 동사원형이에요. 주어가 these services로 복수라서 do를 쓰고 뒤에는 have를 그대로 둔다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들이\u003c/span>\u003cspan class=\"en\">Some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남겼다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부정적인 후기들을\u003c/span>\u003cspan class=\"en\">negative reviews\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서비스에 대해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">services\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들이 서비스에 대해 부정적인 후기들을 남겼잖아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 &quot;these services do have some weaknesses&quot;라고 한 아들의 주장을 구체적으로 뒷받침하는 \u003cb class=\"key\">예시\u003c/b> 문장이에요. 사람들이 \u003cb class=\"key\">negative \u003c/b>\u003cb class=\"key\">reviews\u003c/b>를 남겼다는 사실을 근거로 들어 서비스의 약점을 보여 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 leave의 과거형(3형식 타동사)\u003c/span> : leave + [목적어 reviews] (3형식) : \"남겼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 reviews] + [전치사 about + 명사] : \"서비스에 대한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Some people, 몇몇 사람들이. left, 남겼다. negative reviews, 부정적인 후기들을. about the services, 서비스에 대해.. 이 문장 전체를 해석하면, 몇몇 사람들이 서비스에 대해 부정적인 후기들을 남겼잖아요.","hl":"m"},{"n":31,"text":"여기서 아들은 앞에서 서비스에 약점이 있다고 했죠. 그걸 구체적으로 받쳐 주는 예시가 바로 이 문장이에요. 몇몇 사람들이 negative reviews, 즉 부정적인 후기를 남겼다는 걸 근거로 드는 거예요.","hl":"mn"},{"n":32,"text":"먼저 left를 보세요. 이건 leave의 과거형이고 뒤에 목적어 negative reviews를 데리고 있는 타동사예요. 그래서 3형식 문장이 되는 거죠. 두 번째로 about the services는 전치사구인데, 앞에 있는 명사 reviews를 뒤에서 수식해 주는 역할을 해요. 그래서 '서비스에 대한 부정적인 후기들'이라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글쎄,\u003c/span>\u003cspan class=\"en\">Dad: Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 사람들이 그 서비스들을 사용할수록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">services, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 더 개선될 것이라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">improve\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠: 글쎄, 나는 더 많은 사람들이 그 서비스들을 사용할수록, 그것들이 더 개선될 것이라고 생각해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들의 걱정에 아빠가 낙관적으로 답하는 부분이에요. the 비교급 ~ the 비교급 구문으로 이용자가 늘수록 서비스가 \u003cb class=\"key\">개선\u003c/b>된다는 \u003cb class=\"key\">비례\u003c/b> 관계를 보여 주죠. 부정적 후기도 결국 서비스가 좋아지는 데 도움이 된다는 \u003cb class=\"key\">긍정적\u003c/b> 시각이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think + 목적절(접속사 that 생략)\u003c/span> : think + [(that) + 주어 + 동사] : \"나는 ~라고 생각해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the 비교급 ~ the 비교급 (비례 관용구)\u003c/span> : [the + 비교급 + 주어 + 동사], [the + 비교급 + 주어 + 동사] : \"~할수록 더 ~하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Well, 글쎄. I think, 나는 생각해요. the more people use the services, 더 많은 사람들이 그 서비스들을 사용할수록. the more they will improve, 그것들이 더 개선될 것이라고.. 이 문장 전체를 해석하면, 아빠: 글쎄, 나는 더 많은 사람들이 그 서비스들을 사용할수록, 그것들이 더 개선될 것이라고 생각해.","hl":"m"},{"n":34,"text":"아빠는 걱정하는 아들에게 오히려 더 긍정적으로 답하고 있어요. 사람들이 서비스를 많이 쓸수록 서비스는 더 좋아진다는 비례 관계를 말하는 거죠. 결국 부정적인 후기도 서비스가 개선되는 데 도움이 된다는 시각이에요.","hl":"mn"},{"n":35,"text":"먼저 I think 뒤에는 접속사 that이 생략된 목적절이 통째로 와요. 그래서 '나는 ~라고 생각해요'로 받아 주면 돼요. 두 번째로 the more people use the services, the more they will improve는 the 비교급이 앞뒤에 나오는 비례 표현이에요. '~할수록 더 ~하다'로 해석하고, 뒤에는 will이 붙어서 미래의 개선을 나타낸다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아들은 텐트를 빌리고 강아지를 돌봐 줄 사람을 찾을 수 있는 앱을 보며 \u003cb class=\"key\">감탄\u003c/b>한다.\u003c/li>\u003cli>아빠는 이런 종류의 서비스가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 일부이며, 사람들이 적은 비용이나 무료로 물건을 공유하고 서비스를 제공한다고 설명한다.\u003c/li>\u003cli>아들은 몇몇 사람들이 서비스에 대해 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b>를 남겼다는 \u003cb class=\"key\">약점\u003c/b>을 지적한다.\u003c/li>\u003cli>아빠는 더 많은 사람들이 서비스를 사용할수록 그것들이 더 \u003cb class=\"key\">개선\u003c/b>될 것이라고 말한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sharing economy services have some weaknesses, but they will improve as more people use them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아들은 텐트를 빌리고 강아지를 돌봐 줄 사람을 찾을 수 있는 앱을 보고 감탄하고, 아빠는 이런 서비스가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 일부라고 설명한다. 아들이 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b> 같은 약점을 지적하자, 아빠는 더 많은 사람들이 서비스를 사용할수록 더 \u003cb class=\"key\">개선\u003c/b>될 것이라고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문은 아들과 아빠의 짧은 대화였지만 공유 경제의 원리와 한계, 그리고 가능성을 모두 담고 있었어요. 텐트를 빌리고 강아지를 돌봐 줄 사람을 찾는 작은 예에서 출발해 공유 경제라는 개념으로, 다시 약점과 개선이라는 주제로 이어졌죠. 마지막 문장 the more people use the services, the more they will improve를 꼭 기억해 두세요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
