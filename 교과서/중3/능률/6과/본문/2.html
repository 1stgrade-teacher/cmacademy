 노력을 기울이고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01앱의 서비스 방식</div><ul><li>Ask Your Neighbors는 사용자들이 필요한 물건을 이웃에게 쉽게 빌릴 수 있도록 돕는 서비스이다.</li><li>앱을 다운로드한 후 필요한 물건을 가진 이웃을 검색함</li><li>직접 물건을 빌리고 나중에 다시 돌려주는 방식</li><li>핵심 키워드: 공유 앱(sharing app), 빌리다(borrow)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02긍정적인 사용자 사례</div><ul><li>앱을 통해 물건을 빌리면 비용을 절약할 수 있고 환경 보호에도 도움이 된다.</li><li>30분 안에 보드게임을 빌린 사용자의 만족스러운 경험</li><li>자주 쓰지 않는 물건을 빌려 경제적 이득을 취함</li><li>물건 구매를 줄여 자원을 보존하는 친환경적 효과(environmentally friendly)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문제 발생과 불만 사항</div><ul><li>긍정적인 후기와 달리, 실제 상태가 좋지 않은 물건을 빌려 피해를 본 경우도 발생한다.</li><li>자전거 헬멧을 빌렸으나 파손되어 있어 실망함</li><li>사용자가 부정적인 경험(negative experience)을 겪음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04서비스의 개선 대책</div><ul><li>운영진은 물건의 상태를 투명하게 공개하여 문제를 해결하고자 한다.</li><li>대여자들에게 물건의 사진을 주기적으로 업데이트하도록 요청함</li><li>물건의 정확한 상태(exact condition)를 확인하게 하여 신뢰도 회복</li><li>핵심 키워드: 개선(improvement), 상태 확인(check condition)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">neighbor</td><td class=\"m\">이웃</td></tr><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr><tr><td class=\"w\">download</td><td class=\"m\">다운로드하다</td></tr><tr><td class=\"w\">search for</td><td class=\"m\">~을 찾다</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">(물건을) 가지러 가다, 찾으러 가다</td></tr><tr><td class=\"w\">return</td><td class=\"m\">돌려주다</td></tr><tr><td class=\"w\">board game</td><td class=\"m\">보드게임</td></tr><tr><td class=\"w\">less than</td><td class=\"m\">~ 미만의, ~보다 적은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">save</td><td class=\"m\">아끼다, 절약하다</td></tr><tr><td class=\"w\">environmentally friendly</td><td class=\"m\">환경 친화적인</td></tr><tr><td class=\"w\">product</td><td class=\"m\">상품, 제품</td></tr><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인</td></tr><tr><td class=\"w\">review</td><td class=\"m\">후기, 평가</td></tr><tr><td class=\"w\">however</td><td class=\"m\">하지만</td></tr><tr><td class=\"w\">broken</td><td class=\"m\">고장 난, 부서진</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빌려라</span><span class=\"en\"><b><span class=\"grammar-hl\">Borrow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 이웃들로부터</span><span class=\"en\"><b>from your neighbors!</b></span></div></div><div class=\"lec-sent-ko\">당신의 이웃들로부터 빌려라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;Borrow&#39;는 빌리다라는 뜻입니다. 이 문장은 이 서비스가 이웃 간의 물건 공유를 기반으로 한다는 핵심 목적을 명확히 드러내며 독자의 관심을 끄는 광고성 슬로건입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Borrow (명령문): 주어(you)가 생략된 동사원형으로 시작하여 상대방에게 행동을 요청하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">neighbor</td><td class=\"m\">이웃</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ask Your Neighbors는</span><span class=\"en\"><b>Ask Your Neighbors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 ~하도록 돕는데</span><span class=\"en\"><b>helps people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건을 쉽게 찾도록</span><span class=\"en\"><b>easily find items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 빌릴 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that they can borrow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from others</span>.</b></span></div></div><div class=\"lec-sent-ko\">Ask Your Neighbors는 사람들이 다른 사람들로부터 빌릴 수 있는 물건을 쉽게 찾도록 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 서비스가 무엇을 하는 곳인지 구체적으로 설명합니다. &#39;helps&#39;는 단순히 돕는다는 의미를 넘어, 이 앱이 사용자들 사이의 연결 고리 역할을 한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that they can borrow from others (관계대명사): that이 이끄는 절이 앞의 명사 items를 수식합니다. 관계대명사절 내부에서 borrow의 목적어 자리가 비어 있는 불완전한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">neighbor</td><td class=\"m\">이웃</td></tr><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우선,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용자들은 그 앱을 내려받고</span><span class=\"en\"><b>users download the app</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 사용자를 찾는데</span><span class=\"en\"><b>and search for another user</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건을 가지고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that has the item</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 필요로 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">they need</span>.</b></span></div></div><div class=\"lec-sent-ko\">우선, 사용자들은 그 앱을 내려받고 그들이 필요로 하는 물건을 가지고 있는 또 다른 사용자를 찾는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앱의 사용 절차를 순서대로 설명합니다. &#39;First&#39;를 사용하여 서비스 이용 방법을 단계별로 보여주려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that has the item they need (관계대명사): that이 이끄는 절이 선행사 another user를 수식하며, 절 내부에서 that이 주어 역할을 하는 주격 관계대명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr><tr><td class=\"w\">download</td><td class=\"m\">다운로드하다</td></tr><tr><td class=\"w\">search for</td><td class=\"m\">~을 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 다음</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그 물건을 찾아오고</span><span class=\"en\"><b>they <span class=\"grammar-hl\">pick up</span> the item</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나중에 그것을 반납한다.</span><span class=\"en\"><b>and return it later.</b></span></div></div><div class=\"lec-sent-ko\">그런 다음 그들은 그 물건을 찾아오고 나중에 그것을 반납한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빌리는 과정의 마무리 단계를 설명하며, 이 앱이 단기 대여 시스템임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pick up (관용표현): &#39;가지러 가다/줍다&#39;라는 뜻의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">item</td><td class=\"m\">물건, 품목</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">(물건을) 가지러 가다, 찾으러 가다</td></tr><tr><td class=
