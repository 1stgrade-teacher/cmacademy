</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){

  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중 능률(김) 6과 본문2","audioDir":"2_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중 능률(김) 6과\u003c/div>\u003ch1>Ask Your Neighbors: Borrowing, Reviews, and Improvement\u003c/h1>\u003ch2>Ask Your Neighbors: 이웃에게 빌리기, 후기, 그리고 개선\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">Ask \u003c/b>\u003cb class=\"key\">Your \u003c/b>\u003cb class=\"key\">Neighbors\u003c/b> 앱은 이웃이 가진 물건을 쉽게 빌리고 반납하도록 돕는다. Jasmine은 \u003cb class=\"key\">돈 \u003c/b>\u003cb class=\"key\">절약\u003c/b>과 \u003cb class=\"key\">환경친화성\u003c/b>을 칭찬했지만 Cassandra는 망가진 헬멧을 받아 불만을 제기했고, 회사는 사진을 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>해 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 알리겠다고 응답했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ask Your Neighbors helps users borrow needed items from neighbors, and the company responds to a negative experience by improving item photos for accurate information.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Ask Your Neighbors라는 앱을 소개하는 지문을 함께 읽어 볼게요. 이 글은 이웃에게 필요한 물건을 빌리는 서비스와 그 이용 과정을 보여 주고, 긍정적인 후기와 부정적인 후기를 함께 소개해요. 핵심은 이 앱이 물건을 쉽게 빌리도록 돕고, 회사가 부정적인 경험을 개선하려고 노력한다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>(sharing economy)는 물건을 모두 소유하는 대신 필요한 사람끼리 빌려 쓰는 방식이다. 이런 서비스는 \u003cb class=\"key\">P2P\u003c/b>(peer-to-peer) 플랫폼을 통해 낯선 이웃 사이에서도 거래가 이루어지므로 \u003cb class=\"key\">신뢰\u003c/b>(trust)가 중요하다. 이용자들은 \u003cb class=\"key\">리뷰\u003c/b>(review)와 사진을 보고 물건의 \u003cb class=\"key\">상태\u003c/b>(condition)를 짐작하며, 플랫폼은 문제가 생기면 정보를 갱신해 신뢰를 회복하려 한다. 예를 들어 중고 거래 앱에서 사진과 설명이 실제 물건과 같아야 안심하고 거래하는 것과 비슷하다. 이 지문의 Ask Your Neighbors도 빌려주는 사람이 사진을 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>하도록 하여 이용자 간 신뢰를 높이려는 사례이다.\u003c/div>","segs":[{"n":2,"text":"먼저 공유 경제라는 개념을 짚고 갈게요. 공유 경제는 물건을 모두 사서 소유하기보다 필요한 사람끼리 빌려 쓰는 방식이에요. 이런 서비스는 낯선 이웃 사이에서도 거래가 이루어지기 때문에 신뢰가 아주 중요하죠. 그래서 이용자들은 리뷰와 사진을 보고 물건의 상태를 짐작하고, 플랫폼은 문제가 생기면 정보를 갱신해서 신뢰를 회복하려고 해요. 중고 거래 앱에서 사진과 설명이 실제 물건과 같아야 안심하고 거래하는 것과 비슷해요. Ask Your Neighbors도 빌려주는 사람이 사진을 정기적으로 업데이트하도록 해서 신뢰를 높이려는 사례랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이웃과 빌리기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 'Borrow from your neighbors!'라는 명령문으로 이웃에게서 물건을 빌리는 상황을 제시한다. 이어 \u003cb class=\"key\">Ask \u003c/b>\u003cb class=\"key\">Your \u003c/b>\u003cb class=\"key\">Neighbors\u003c/b> 앱이 사람들이 다른 사람에게서 빌릴 수 있는 물건을 쉽게 찾도록 돕는다고 소개한다. 즉, 물건을 새로 사기보다 이웃의 물건을 \u003cb class=\"key\">대여\u003c/b>하는 서비스의 목적이 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이용 절차\u003csmall>과정 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사용자는 먼저 앱을 내려받고 필요한 물건을 가진 다른 사용자를 검색한다. 그다음 물건을 \u003cb class=\"key\">찾아오고\u003c/b> 나중에 \u003cb class=\"key\">반납\u003c/b>한다. First와 Then이 절차의 순서를 분명히 표시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>긍정 사례\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>Jasmine은 보드게임을 요청하고 30분도 안 되어 구했다며 긍정적인 경험을 말한다. 자주 필요하지 않은 물건을 빌려 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">절약\u003c/b>하고, 환경친화적이라고 평가한다. 나아가 제품을 적게 살수록 \u003cb class=\"key\">자원\u003c/b>을 더 많이 아낀다는 원리로 장점을 뒷받침한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>부정 사례\u003csmall>반례 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>Cassandra는 많은 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">후기\u003c/b>를 보고 자전거 헬멧을 빌리기로 결정한다. 그러나 받은 헬멧이 망가져 있어 몹시 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">상\u003c/b>했다고 말한다. 이는 후기만으로 물건의 실제 상태를 판단하기 어렵다는 \u003cb class=\"key\">문제점\u003c/b>을 드러낸다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>개선 대응\u003csmall>해결 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>Ask Your Neighbors는 부정적인 경험에 대해 사과하고 문제를 바로잡겠다고 응답한다. 빌려주는 사람들에게 물건 사진을 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>해 달라고 요청한다. 그 결과 다른 사용자가 제품의 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 알 수 있게 하려는 것이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 글은 이웃에게서 물건을 빌리자는 말로 시작해요. 그리고 Ask Your Neighbors 앱이 사람들이 다른 사람에게서 빌릴 수 있는 물건을 쉽게 찾도록 돕는다고 소개하죠. 여기서 물건을 새로 사기보다 이웃의 물건을 대여하는 서비스의 목적이 드러나요.","hl":"f0"},{"n":5,"text":"다음은 이용 절차예요. 사용자는 먼저 앱을 내려받고 필요한 물건을 가진 다른 사용자를 검색해요. 그다음 물건을 찾아오고 나중에 반납하죠. First와 Then이 절차의 순서를 분명하게 표시해 줘요.","hl":"f1"},{"n":6,"text":"세 번째는 긍정적인 사례예요. Jasmine은 보드게임을 요청하고 삼십 분도 안 되어 구했다며 만족해요. 자주 필요하지 않은 물건을 빌려 돈을 절약하고 환경친화적이라고 평가하죠. 또 제품을 적게 살수록 자원을 더 많이 아낀다는 원리로 장점을 뒷받침해요.","hl":"f2"},{"n":7,"text":"네 번째는 부정적인 사례예요. Cassandra는 많은 긍정적인 후기를 보고 자전거 헬멧을 빌리기로 결정해요. 그러나 받은 헬멧이 망가져 있어서 몹시 기분이 상했다고 말하죠. 이 장면은 후기만으로 물건의 실제 상태를 판단하기 어렵다는 문제점을 보여 줘요.","hl":"f3"},{"n":8,"text":"마지막은 회사의 개선 대응이에요. Ask Your Neighbors는 부정적인 경험에 대해 사과하고 문제를 바로잡겠다고 응답해요. 빌려주는 사람들에게 물건 사진을 정기적으로 업데이트해 달라고 요청하죠. 그 결과 다른 사용자가 제품의 정확한 상태를 알 수 있게 하려는 거예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 2번 문장에서 앱의 기능을 먼저 제시한 뒤 구체적인 이용 절차와 사용자 사례를 보여 주므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 긍정 사례와 부정 사례를 연이어 제시해 서비스의 장점과 \u003cb class=\"key\">문제점\u003c/b>을 함께 드러내고, 마지막에 회사의 개선 대응을 덧붙인다. 따라서 전개 방식은 \u003cb class=\"key\">예시\u003c/b>를 활용한 설명이며, 문제가 제기된 뒤 해결 방안이 제시되는 \u003cb class=\"key\">문제-해결\u003c/b>의 흐름도 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Borrow from (1)\u003c/b>\u003cspan>주제 제시\u003c/span>\u003cb>First (3)\u003c/b>\u003cspan>순서\u003c/span>\u003cb>Then (4)\u003c/b>\u003cspan>순서\u003c/span>\u003cb>however (10)\u003c/b>\u003cspan>전환·반례\u003c/span>\u003cb>To fix this issue (13)\u003c/b>\u003cspan>문제 해결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">borrow from others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">has the item they need\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pick up the item\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">return it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">saving money\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">environmentally friendly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">save resources\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">positive reviews\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">negative experience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fix this issue\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">update the pictures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exact condition\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Jasmine의 긍정 경험\u003c/th>\u003cth>Cassandra의 부정 경험\u003c/th>\u003c/tr>\u003ctr>\u003ctd>보드게임을 30분 내 구함\u003c/td>\u003ctd>자전거 헬멧이 망가져 도착함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돈 절약과 환경친화성을 장점으로 평가\u003c/td>\u003ctd>후기와 실제 상태의 차이에 실망\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 두 번째 문장에서 앱의 기능을 먼저 제시한 뒤 구체적인 이용 절차와 사용자 사례를 보여 주는 두괄식 구조예요. 긍정 사례와 부정 사례를 연이어 보여 주면서 서비스의 장점과 문제점을 함께 드러내죠. 그래서 예시를 활용한 설명 글이라고 볼 수 있고, 뒤에는 문제를 해결하려는 대응까지 이어져요.","hl":"ty"},{"n":10,"text":"신호어를 보면 First와 Then이 이용 절차의 순서를 잡아 줘요. however는 앞의 긍정적인 분위기에서 부정적인 사례로 전환하는 역할을 하죠. To fix this issue는 문제를 해결하는 대응으로 넘어가게 해 주고, 마지막의 exact condition은 개선의 목적을 분명히 보여 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Borrow from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게서 빌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>borrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>user\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용자\u003c/span>\u003c/div>\u003cdiv>\u003cb>download\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내려받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>search for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 찾다, 검색하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾아오다, 집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>return\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반납하다, 돌려주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>save money\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돈을 절약하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmentally friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경친화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>fewer\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 적은\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>review\u003c/b>\u003cem>명사\u003c/em>\u003cspan>후기\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>helmet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헬멧\u003c/span>\u003c/div>\u003cdiv>\u003cb>broken\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>망가진\u003c/span>\u003c/div>\u003cdiv>\u003cb>upset\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기분이 상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>negative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바로잡다, 고치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>issue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>lender\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빌려주는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>update\u003c/b>\u003cem>동사\u003c/em>\u003cspan>업데이트하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>regularly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정기적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>exact\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어부터 짚어 볼게요. borrow는 빌리다, lend는 빌려주다라는 차이가 중요하고, pick up은 물건을 찾아오다, return은 반납하다로 기억해 두세요. positive와 negative는 각각 긍정적인과 부정적인, regularly는 정기적으로, exact condition은 정확한 상태라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">borrow\u003c/b>\u003cspan class=\"m\">빌리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take temporarily\u003c/span>\u003cspan class=\"s\">use temporarily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lend\u003c/span>\u003cspan class=\"a\">return\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">positive\u003c/b>\u003cspan class=\"m\">긍정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">favorable\u003c/span>\u003cspan class=\"s\">optimistic\u003c/span>\u003cspan class=\"s\">affirmative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">negative\u003c/span>\u003cspan class=\"a\">unfavorable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">negative\u003c/b>\u003cspan class=\"m\">부정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfavorable\u003c/span>\u003cspan class=\"s\">pessimistic\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">positive\u003c/span>\u003cspan class=\"a\">favorable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">broken\u003c/b>\u003cspan class=\"m\">망가진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damaged\u003c/span>\u003cspan class=\"s\">faulty\u003c/span>\u003cspan class=\"s\">cracked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fixed\u003c/span>\u003cspan class=\"a\">intact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fix\u003c/b>\u003cspan class=\"m\">고치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">repair\u003c/span>\u003cspan class=\"s\">mend\u003c/span>\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">regularly\u003c/b>\u003cspan class=\"m\">정기적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">routinely\u003c/span>\u003cspan class=\"s\">frequently\u003c/span>\u003cspan class=\"s\">consistently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003cspan class=\"a\">occasionally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exact\u003c/b>\u003cspan class=\"m\">정확한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precise\u003c/span>\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">approximate\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 묶어 볼게요. positive는 favorable, optimistic과 가깝고 negative, unfavorable와 반대돼요. broken은 damaged, faulty와 비슷하고 fixed, intact와 반대되죠. fix는 repair, mend와 가깝고 break, damage와 반대돼요. regularly는 routinely, frequently와 비슷하고 rarely, occasionally와 반대된다는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빌려라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Borrow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 이웃들로부터!\u003c/span>\u003cspan class=\"en\">from your neighbors!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 이웃들로부터 빌려라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 주제를 한마디로 던지는 \u003cb class=\"key\">표제\u003c/b> 문장이에요. 독자에게 이웃에게 물건을 빌리라고 직접 촉구하는 \u003cb class=\"key\">명령문\u003c/b> 형태라서, 뒤에 이어질 앱 소개가 왜 필요한지 자연스럽게 궁금하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [[동사원형]] + 수식어구 (주어 You [[생략]]) : \"빌려라\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Borrow, 빌려라. from your neighbors!, 당신의 이웃들로부터!. 이 문장 전체를 해석하면, 당신의 이웃들로부터 빌려라!","hl":"m"},{"n":14,"text":"이 문장은 글의 표제예요. 독자에게 이웃에게 물건을 빌리라고 직접 말하는 명령문이죠. 딱 두 단어로 주제를 던지는 아주 강한 문장이에요.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 명령문이에요. 주어 You를 생략하고 동사원형 Borrow로 시작하면 '빌려라'라는 명령이 되죠. 두 번째로 from은 '~로부터'라는 출처를 나타내는 전치사예요. 그래서 from your neighbors는 '당신의 이웃들로부터'가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ask Your Neighbors는\u003c/span>\u003cspan class=\"en\">Ask Your Neighbors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 ~하도록 돕는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물건을 쉽게 찾도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> items\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 빌릴 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">borrow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들로부터\u003c/span>\u003cspan class=\"en\">from others.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ask Your Neighbors는 사람들이 다른 사람들로부터 빌릴 수 있는 물건을 쉽게 찾도록 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱의 기능을 한 문장으로 요약한 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. '이웃에게서 물건을 빌리는 일'을 \u003cb class=\"key\">쉽게\u003c/b> 만들어 준다는 점이 글 전체를 이끄는 핵심입니다. 뒤에 나오는 사용 순서와 후기들은 모두 이 문장을 뒷받침하는 내용이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형(목적격보어)\u003c/span> : help + [[목적어]](people) + (to) [[동사원형]](find) : \"사람들이 …하도록 돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [[선행사]] items + that + 주어 they + 동사 can borrow (that이 borrow의 목적어) : \"그들이 빌릴 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Ask Your Neighbors, Ask Your Neighbors는. helps people, 사람들이 ~하도록 돕는다. easily find items, 물건을 쉽게 찾도록. that they can borrow, 그들이 빌릴 수 있는. from others, 다른 사람들로부터. 이 문장 전체를 해석하면, Ask Your Neighbors는 사람들이 다른 사람들로부터 빌릴 수 있는 물건을 쉽게 찾도록 돕는다.","hl":"m"},{"n":17,"text":"이 문장은 앱의 기능을 한 줄로 요약한 중심 문장이에요. 이웃에게 물건을 빌리는 일을 쉽게 만들어 준다는 점을 강조하고 있죠. 뒤에 나오는 사용법과 후기 이야기가 모두 이 문장을 받쳐 주는 거예요.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 help 뒤에 목적어 people이 오고 그 뒤에 동사원형 find가 온다는 거예요. 목적격보어로 동사원형을 쓰면 '~가 …하도록 돕다'가 됩니다. 두 번째는 that이 목적격 관계대명사라는 점이에요. 앞의 items를 받으면서 borrow의 목적어 역할을 동시에 하죠. 세 번째로 easily는 부사로 동사 find를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우선,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자들은 그 앱을 내려받고\u003c/span>\u003cspan class=\"en\">users \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">download \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">app \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 사용자를 찾는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">search \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> another user\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물건을 가지고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">item\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 필요로 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우선, 사용자들은 그 앱을 내려받고 그들이 필요로 하는 물건을 가지고 있는 또 다른 사용자를 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱을 쓰는 \u003cb class=\"key\">순서\u003c/b>를 설명하는 대목이에요. 앱을 내려받는 첫 단계와 물건을 가진 상대를 찾는 다음 단계가 and로 자연스럽게 이어집니다. 뒤 문장에서 물건을 픽업하고 돌려주는 과정이 계속 이어질 것을 예고하는 역할도 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬(and로 연결)\u003c/span> : 주어 users + [[동사]] download + 목적어 and [[동사]] search for + 목적어 : \"앱을 내려받고 ~을 찾는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [[선행사]] another user + that + [[동사]] has + 목적어 : \"그 물건을 가지고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : the item + (which/that) + 주어 they + 동사 need : \"그들이 필요로 하는\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"First, 우선. users download the app, 사용자들은 그 앱을 내려받고. and search for another user, 또 다른 사용자를 찾는다. that has the item, 그 물건을 가지고 있는. they need, 그들이 필요로 하는. 이 문장 전체를 해석하면, 우선, 사용자들은 그 앱을 내려받고 그들이 필요로 하는 물건을 가지고 있는 또 다른 사용자를 찾는다.","hl":"m"},{"n":20,"text":"이 문장은 앱을 쓰는 순서를 설명하는 대목이에요. 앱을 내려받는 첫 단계와 상대를 찾는 다음 단계가 and로 자연스럽게 이어지죠. 뒤에서 이어질 물건을 받고 돌려주는 과정을 미리 깔아 주는 역할도 합니다.","hl":"mn"},{"n":21,"text":"첫 번째는 병렬 구조예요. users라는 주어 하나에 download와 search for라는 동사 두 개가 and로 나란히 연결되어 있죠. 두 번째는 that이 주격 관계대명사라는 점이에요. 앞의 another user를 받고 바로 뒤에 동사 has가 와서 주격임을 알 수 있어요. 세 번째로 the item과 they need 사이에는 목적격 관계대명사가 생략되어 있습니다. 그래서 '그들이 필요로 하는 물건'이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그 물건을 찾아오고\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> the item\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 반납한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">return \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">later\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 그들은 그 물건을 찾아오고 나중에 그것을 반납한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앱으로 물건을 빌리는 \u003cb class=\"key\">절차\u003c/b>를 순서대로 알려 주는 부분이에요. 찾아오기와 반납하기, 두 단계를 and로 이어서 보여 주죠. \u003cb class=\"key\">later\u003c/b>는 '나중에'라는 뜻으로, 반납이 물건을 빌린 뒤에 이루어진다는 시간 흐름을 분명히 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : pick [동사] + up [부사] + 목적어 (목적어가 대명사이면 pick + it + up) : \"찾아오고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사구 병렬\u003c/span> : [pick up the item] + and + [return it] : \"그리고 그것을 반납한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사\u003c/span> : return it + later : \"나중에\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Then, 그런 다음. they pick up the item, 그들은 그 물건을 찾아오고. and return it, 그리고 그것을 반납한다. later, 나중에. 이 문장 전체를 해석하면, 그런 다음 그들은 그 물건을 찾아오고 나중에 그것을 반납한다.","hl":"m"},{"n":23,"text":"이 문장은 앱으로 물건을 빌리는 절차를 순서대로 알려 주는 부분이에요. 찾아오기와 반납하기, 두 단계를 and로 이어서 보여 주고 있죠. later는 나중에라는 뜻으로, 반납이 물건을 빌린 뒤에 이루어진다는 시간 흐름을 분명히 해 줍니다.","hl":"mn"},{"n":24,"text":"첫 번째로 pick up을 보세요. pick은 집다, up은 위로라는 뜻인데 둘이 굳어져서 찾아오다라는 구동사가 돼요. 목적어가 대명사일 때는 pick it up처럼 사이에 넣는다는 것도 기억해 두세요. 두 번째로 and는 pick up the item과 return it이라는 두 동사구를 나란히 이어 주는 등위접속사예요. 세 번째로 later는 문장 끝에서 나중에라는 시간과 순서를 알려 주는 부사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 보드게임을 요청했고\u003c/span>\u003cspan class=\"en\">Jasmine / December 12, 2019 I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> a board game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 하나를 구했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">30분도 안 되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">minutes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jasmine / 2019년 12월 12일 저는 보드게임을 요청했고 30분도 안 되어 하나를 구했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앱을 써 본 한 사용자의 \u003cb class=\"key\">후기\u003c/b>예요. 보드게임을 요청한 뒤 30분도 안 되어 구했다는 사실로 앱의 \u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">속도\u003c/b>를 강조하고 있죠. 앞에 붙은 이름과 날짜는 이 이야기가 실제 이용 경험이라는 느낌을 더해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 + 전치사 구동사(ask for)\u003c/span> : ask [자동사] + for + 목적어(~을 요청하다) : \"요청했고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : I + [asked for ~] + and + [got one] : \"그리고 하나를 구했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 one(반복 회피)\u003c/span> : one = a board game : \"하나(보드게임)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 in + 비교급 less than(시간의 범위)\u003c/span> : in + less than + [시간] : \"30분도 안 되어\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I asked for a board game, 저는 보드게임을 요청했고. and got one, 그리고 하나를 구했어요. in less than 30 minutes, 30분도 안 되어. 이 문장 전체를 해석하면, Jasmine / 2019년 12월 12일 저는 보드게임을 요청했고 30분도 안 되어 하나를 구했어요.","hl":"m"},{"n":26,"text":"이 문장은 앱을 써 본 한 사용자의 후기예요. 보드게임을 요청한 뒤 30분도 안 되어 구했다는 사실로 앱의 빠른 속도를 강조하고 있죠. 앞에 붙은 이름과 날짜는 이 이야기가 실제 이용 경험이라는 느낌을 더해 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째로 asked for를 보세요. ask는 묻다라는 뜻인데 전치사 for와 만나면 요청하다라는 구동사가 돼요. 두 번째로 and는 주어 I를 함께 쓰면서 asked와 got, 두 동사를 나란히 이어 주는 등위접속사예요. 세 번째로 one은 앞에 나온 a board game을 다시 말하지 않으려고 쓴 대명사랍니다. 네 번째로 in less than 30 minutes에서 in은 기간을, less than은 비교급으로 30분이 안 되는 시간을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 좋아해요\u003c/span>\u003cspan class=\"en\">I love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 아끼는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saving \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것들을 빌림으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">borrowing \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 자주 필요로 하지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 제가 자주 필요로 하지 않는 것들을 빌림으로써 돈을 아낄 수 있다는 것이 정말 마음에 들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 빌리기를 좋아하는 이유를 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">이득\u003c/b>으로 풀어 놓았어요. 자주 쓰지 않는 물건을 빌리면 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">아낄\u003c/b> 수 있다는 것이죠. 전치사 by를 써서 '빌리는 행동'이 돈을 아끼는 \u003cb class=\"key\">수단\u003c/b>임을 분명히 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사(동사 love의 목적어)\u003c/span> : love + [동명사 ~ing] (목적어) : \"돈을 아끼는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사(~ing)] (~함으로써) : \"것들을 빌림으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사 things] + that + [주어 I + 동사 need] (목적어 자리) : \"제가 자주 필요로 하지 않는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">빈도 부사 often의 위치\u003c/span> : [조동사·do] + often + [일반동사] : \"자주 필요로 하지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I love, 저는 좋아해요. saving money, 돈을 아끼는 것을. by borrowing things, 것들을 빌림으로써. that I don't often need, 제가 자주 필요로 하지 않는. 이 문장 전체를 해석하면, 저는 제가 자주 필요로 하지 않는 것들을 빌림으로써 돈을 아낄 수 있다는 것이 정말 마음에 들어요.","hl":"m"},{"n":29,"text":"이 문장은 빌리기를 좋아하는 이유를 경제적 이득으로 풀어 놓았어요. 자주 쓰지 않는 물건을 빌리면 돈을 아낄 수 있다는 것이죠. 전치사 by를 써서 빌리는 행동이 돈을 아끼는 수단임을 분명히 밝히고 있습니다.","hl":"mn"},{"n":30,"text":"첫 번째로 saving money는 love의 목적어로 쓰인 동명사예요. 두 번째로 by borrowing things에서 by는 수단을 나타내는 전치사라서 뒤에 반드시 동명사가 와요. 세 번째로 that은 앞의 things를 꾸며 주는 목적격 관계대명사이고, 뒤에는 목적어가 빠진 불완전한 절이 이어져요. 네 번째로 often은 빈도 부사라서 don't와 need 사이에 자리한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 생각해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 환경친화적이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">friendly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가 저는 이것이 환경친화적이라고 생각해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 \u003cb class=\"key\">it\u003c/b>은 앞 문장의 \u003cb class=\"key\">borrowing \u003c/b>\u003cb class=\"key\">things\u003c/b>, 즉 필요한 것을 빌리는 일을 가리켜요. 재사용을 통해 물건을 덜 사는 일이 \u003cb class=\"key\">환경친화적\u003c/b>이라고 말하는 거죠. Jasmine이 빌려 쓰기의 장점을 환경친화적이라는 말로 한 번 더 강조하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생각·판단 동사 think + 목적어절\u003c/span> : think + (that) + [주어 + 동사 + 보어] : \"저는 그것이 환경친화적이라고 생각해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 + 형용사\u003c/span> : environmentally [부사] + friendly [형용사] : \"환경친화적인\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Also, 게다가. I think, 저는 생각해요. it's environmentally friendly, 그것이 환경친화적이라고. 이 문장 전체를 해석하면, 게다가 저는 이것이 환경친화적이라고 생각해요.","hl":"m"},{"n":32,"text":"여기서 it은 앞 문장의 borrowing things, 즉 필요한 것을 빌리는 일을 가리켜요. 재사용을 통해 물건을 덜 사는 일이 환경친화적이라고 말하는 거죠. Jasmine이 빌려 쓰기의 장점을 환경친화적이라는 말로 한 번 더 강조하는 부분이에요.","hl":"mn"},{"n":33,"text":"첫 번째로 I think 뒤에는 접속사 that이 생략된 목적어절이 와요. 목적어절 안은 주어와 보어를 갖춘 완전한 절이기 때문에 생각의 내용을 그대로 담을 수 있죠. 두 번째로 environmentally는 부사이고 friendly는 형용사예요. 부사가 형용사 friendly를 앞에서 꾸며 주고, environmentally friendly 전체가 보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 적은 제품을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">fewer \u003c/span>\u003cspan class=\"tgt\">products \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 구매할수록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 자원을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">resources \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 절약하게 되는 거예요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">save\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 더 적은 제품을 구매할수록, 우리는 더 많은 자원을 절약하게 되는 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">비교급, \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">비교급\u003c/b> 구문으로 제품을 적게 살수록 자원을 더 많이 아낀다는 \u003cb class=\"key\">비례\u003c/b> 관계를 보여 줘요. 앞 문장의 환경친화적이라는 평가를 \u003cb class=\"key\">자원 \u003c/b>\u003cb class=\"key\">절약\u003c/b>이라는 구체적인 이유로 뒷받침하는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the 비교급, the 비교급 (전반부)\u003c/span> : The + 비교급 + 명사 + 주어 + 동사 : \"우리가 더 적은 제품을 구매할수록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the 비교급, the 비교급 (후반부)\u003c/span> : the + 비교급 + 명사 + 주어 + 동사 : \"우리는 더 많은 자원을 절약하게 되는 거예요\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"The fewer products, 더 적은 제품을. we buy, 우리가 구매할수록. the more resources, 더 많은 자원을. we save, 우리는 절약하게 되는 거예요.. 이 문장 전체를 해석하면, 우리가 더 적은 제품을 구매할수록, 우리는 더 많은 자원을 절약하게 되는 거예요.","hl":"m"},{"n":35,"text":"이 문장은 the 비교급, the 비교급 구문으로 제품을 적게 살수록 자원을 더 많이 아낀다는 비례 관계를 보여 줘요. 앞 문장의 환경친화적이라는 평가를 자원 절약이라는 구체적인 이유로 뒷받침하는 거죠.","hl":"mn"},{"n":36,"text":"첫 번째로 앞부분의 the 비교급 표현은 더 적게 사면이라는 조건을 만들어요. fewer는 셀 수 있는 복수명사 products를 꾸미는 비교급이에요. 두 번째로 뒷부분의 the more resources는 더 많은 자원을이라는 목적어 역할을 하고, 전체가 비례 관계를 만드는 상관 접속 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cassandra / 2020년 3월 7일\u003c/span>\u003cspan class=\"en\">Cassandra / March 7, 2020\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 긍정적인 후기들을 보고 나서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Seeing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">reviews\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 자전거 헬멧을 빌리기로 결정했어요.\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">borrow\u003c/span> a bike helmet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Cassandra / 2020년 3월 7일 많은 긍정적인 후기들을 보고 나서, 저는 자전거 헬멧을 빌리기로 결정했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긍정적인 후기들을 많이 보고 자전거 헬멧을 빌리기로 한 Cassandra의 계기와 결정을 보여 주는 문장이에요. \u003cb class=\"key\">Seeing\u003c/b>은 '보고 나서'라는 \u003cb class=\"key\">분사구문\u003c/b>으로, 후기가 결정에 영향을 주었음을 드러내죠. 그런데 다음 문장에서 헬멧이 망가져 있었다고 해서 \u003cb class=\"key\">기대\u003c/b>와 실제 경험이 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (이유·시간)\u003c/span> : Seeing + 목적어, 주어 + 동사 : \"많은 긍정적인 후기들을 보고 나서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide + to부정사 : \"빌리기로 결정했어요\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Cassandra / March 7, 2020, Cassandra / 2020년 3월 7일. Seeing a lot of positive reviews, 많은 긍정적인 후기들을 보고 나서. I decided to borrow a bike helmet, 저는 자전거 헬멧을 빌리기로 결정했어요.. 이 문장 전체를 해석하면, Cassandra / 2020년 3월 7일 많은 긍정적인 후기들을 보고 나서, 저는 자전거 헬멧을 빌리기로 결정했어요.","hl":"m"},{"n":38,"text":"긍정적인 후기들을 많이 보고 자전거 헬멧을 빌리기로 한 Cassandra의 계기와 결정을 보여 주는 문장이에요. Seeing은 보고 나서라는 분사구문으로, 후기가 결정에 영향을 주었음을 드러내죠. 그런데 다음 문장에서 헬멧이 망가져 있었다고 해서 기대와 실제 경험이 대비됩니다.","hl":"mn"},{"n":39,"text":"첫 번째로 Seeing a lot of positive reviews는 접속사와 주어를 줄이고 동사를 현재분사 Seeing으로 바꾼 분사구문이에요. 분사구문의 주체는 주절의 주어 I와 같기 때문에 후기를 본 사람이 나라는 점을 알 수 있고, 여기서는 이유의 의미도 담겨요. 두 번째로 decided to borrow에서 to부정사는 decide의 목적어로 쓰였어요. to borrow 뒤에는 a bike helmet이 목적어로 이어지는 타동사 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 그것을 받았을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 망가져 있었어요.\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">broken\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 제가 그것을 받았을 때, 그것은 망가져 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 긍정적인 후기를 보고 기대했던 것과 달리, 실제로 받은 물건이 \u003cb class=\"key\">망가져\u003c/b> 있었음을 말해요. 'however'가 기대와 실제의 \u003cb class=\"key\">반전\u003c/b>을 만들어 내고, 이는 다음 문장의 \u003cb class=\"key\">불만\u003c/b>으로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어 + 동사], [주절] : \"제가 그것을 받았을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사 however의 삽입\u003c/span> : [문장], however, [문장] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 broken의 형용사적 용법(주격 보어)\u003c/span> : [주어] + was + [broken (과거분사/주격 보어)] : \"망가져 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"When I got it, 제가 그것을 받았을 때. however, 그러나. it was broken, 그것은 망가져 있었어요.. 이 문장 전체를 해석하면, 그러나 제가 그것을 받았을 때, 그것은 망가져 있었어요.","hl":"m"},{"n":41,"text":"이 문장은 긍정적인 후기를 보고 기대했던 것과 달리 실제로 받은 물건이 망가져 있었다는 걸 말해요. however가 기대와 실제의 반전을 만들어 주고, 그래서 다음 문장의 불만으로 자연스럽게 이어지는 거죠.","hl":"mn"},{"n":42,"text":"첫 번째로 when은 할 때라는 시간을 나타내는 접속사로 부사절을 이끌어요. 두 번째로 however는 앞뒤를 반대로 연결하는 접속부사이고, 문장 중간에 삽입되어 그러나의 뜻을 더해요. 세 번째로 broken은 과거분사가 형용사처럼 쓰여 it의 상태를 설명하는 주격 보어예요. 그래서 망가뜨려졌다보다 망가져 있었다라는 상태로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몹시 기분이 상했어요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 몹시 기분이 상했어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 망가진 물건을 받은 뒤 느낀 \u003cb class=\"key\">불쾌감\u003c/b>을 강하게 드러내는 문장이에요. 'so'로 감정을 \u003cb class=\"key\">강조\u003c/b>해서, 다음의 회사 응답이 필요해지는 \u003cb class=\"key\">이유\u003c/b>를 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 감정 형용사 upset과 강조 부사 so\u003c/span> : [주어] + was + [so upset (형용사/주격 보어)] : \"몹시 기분이 상했어요\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I, 저는. was so upset!, 몹시 기분이 상했어요!. 이 문장 전체를 해석하면, 저는 몹시 기분이 상했어요!","hl":"m"},{"n":44,"text":"이 문장은 망가진 물건을 받은 뒤 느낀 불쾌감을 강하게 드러내요. so로 감정을 강조해서, 다음에 회사 응답이 필요해지는 이유를 만들어 주는 거죠.","hl":"mn"},{"n":45,"text":"첫 번째로 upset은 속상한 상태를 나타내는 감정 형용사라서 be동사 뒤에서 주어 I의 주격 보어 역할을 해요. so는 형용사를 강조해서 감정의 정도를 세게 만들어 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ask Your Neighbors /\u003c/span>\u003cspan class=\"en\">Ask Your Neighbors /\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2020년 3월 9일\u003c/span>\u003cspan class=\"en\">March 9, 2020 발판이 되는 거죠.","hl":"mn"},{"n":48,"text":"첫 번째로 sorry 뒤의 that절은 슬픔이나 유감의 원인이 되는 내용을 이끌어요. 그래서 고객님이 그런 경험을 겪게 해서 죄송하다는 이유를 담아 해석하는 거죠. 두 번째로 such는 그렇게, 매우의 뜻으로 형용사 negative를 강조해요. experience는 셀 수 있는 단수 명사라서 such와 형용사 사이에 관사 a가 들어가는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 문제를 바로잡기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">issue\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 빌려주는 분들에게 요청하고 있습니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">asking \u003c/span>\u003cspan class=\"tgt\">lenders \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 물건 사진을 업데이트할 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">update\u003c/span> the pictures of their items\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정기적으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">regularly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 문제를 바로잡기 위해서, 저희는 빌려주는 분들에게 물건의 사진을 정기적으로 업데이트할 것을 요청하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 이용자가 겪은 불편, 즉 깨진 물건을 받은 문제를 해결하겠다고 밝히는 문장입니다. \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 구체적으로 제시하는 부분으로, 앱 운영진이 사진 갱신이라는 실천 방안을 약속하고 있어요. '이 문제를 바로잡기 위해서'라는 목적 표현이 문장 앞에 놓여 \u003cb class=\"key\">목적\u003c/b>을 분명히 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [To fix (to부정사구)] + [this issue (목적어)] → 문장 앞에서 목적 제시 : \"이 문제를 바로잡기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">ask + 목적어 + to부정사(목적격보어)\u003c/span> : ask [lenders (목적어)] + [to update (to부정사/목적격보어)] : \"빌려주는 분들에게 업데이트할 것을 요청하고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">빈도·방법의 부사\u003c/span> : [update (동사)] + [regularly (부사)] : \"정기적으로\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"To fix this issue, 이 문제를 바로잡기 위해서. we are asking lenders, 저희는 빌려주는 분들에게 요청하고 있습니다. to update the pictures of their items, 그들의 물건 사진을 업데이트할 것을. regularly, 정기적으로.. 이 문장 전체를 해석하면, 이 문제를 바로잡기 위해서, 저희는 빌려주는 분들에게 물건의 사진을 정기적으로 업데이트할 것을 요청하고 있습니다.","hl":"m"},{"n":50,"text":"이 문장은 깨진 물건을 받아서 속상했다는 이용자의 항의에 대한 회사의 답변이에요. 그래서 '문제를 해결하겠다'는 뜻을 앞세우고, 그 방법으로 사진을 정기적으로 새로 올려 달라고 부탁하고 있죠. 문제와 해결책을 연결하는 아주 전형적인 문장이라고 보시면 됩니다.","hl":"mn"},{"n":51,"text":"첫 번째로 문장 맨 앞의 To fix this issue를 보세요. 여기서 to부정사는 '이 문제를 바로잡기 위해서'라는 목적을 나타내고 있어요. 두 번째로 are asking lenders to update를 보시면, ask 목적어 to동사, 즉 목적어에게 무엇을 해 달라고 요청하는 5형식 구조이고, 현재진행형이라 지금 요청하고 있는 중이라는 뜻이 됩니다. 세 번째로 문장 끝의 regularly는 동사 update를 꾸며 주는 부사로, 정기적으로 해 달라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~하도록 할 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사용자분들이 알\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">users \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확한 상태를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">exact \u003c/span>\u003cspan class=\"tgt\">condition \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 제품의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">product\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 다른 사용자분들로 하여금 그 제품의 정확한 상태를 알 수 있도록 해 줄 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 해결책, 즉 사진을 정기적으로 갱신하는 일이 가져올 \u003cb class=\"key\">기대 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 설명하는 문장입니다. 사진이 최신이면 이용자가 물건의 실제 상태를 미리 알 수 있어 같은 문제가 반복되지 않는다는 흐름이에요. 'This'는 바로 앞 문장의 내용 전체를 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This + 조동사 will\u003c/span> : [This (앞 문장 내용 지시)] + [will let (조동사 + 동사원형)] : \"이것은 ~하게 할 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 let + 목적어 + 동사원형(목적격보어)\u003c/span> : let [other users (목적어)] + [know (동사원형/목적격보어)] : \"다른 사용자분들이 알도록 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(of)의 형용사적 수식\u003c/span> : [the exact condition (명사)] + [of the product (전치사구)] : \"그 제품의 정확한 상태\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"This will let, 이것은 ~하도록 할 것입니다. other users know, 다른 사용자분들이 알. the exact condition, 정확한 상태를. of the product, 그 제품의. 이 문장 전체를 해석하면, 이것은 다른 사용자분들로 하여금 그 제품의 정확한 상태를 알 수 있도록 해 줄 것입니다.","hl":"m"},{"n":53,"text":"이 문장은 회사가 약속한 해결책이 실제로 어떤 좋은 결과를 낳는지 알려 주는 문장이에요. 사진이 최신이면 빌리는 사람이 물건 상태를 미리 확인할 수 있어서, 깨진 물건을 받는 일이 줄어들겠죠. 앞 문장과 이어서 '원인과 기대 효과'의 흐름으로 읽으시면 됩니다.","hl":"mn"},{"n":54,"text":"첫 번째로 let other users know를 보세요. let은 사역동사라서 목적어 뒤에 to를 붙이지 않고 동사원형 know를 씁니다. 두 번째로 the exact condition of the product에서 of the product가 앞의 명사 condition을 뒤에서 꾸며 주고 있죠. 세 번째로 문장 첫 단어 This는 앞 문장의 내용 전체를 가리키는 지시대명사이고, will 뒤에는 동사원형 let이 왔다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Ask Your Neighbors는 사람들이 이웃에게서 필요한 \u003cb class=\"key\">물건\u003c/b>을 쉽게 빌리도록 돕는 앱이다.\u003c/li>\u003cli>사용자는 앱에서 물건을 찾아 \u003cb class=\"key\">찾아오고\u003c/b> 나중에 반납한다.\u003c/li>\u003cli>Jasmine은 돈 절약과 \u003cb class=\"key\">환경친화성\u003c/b>을 장점으로 말했지만, Cassandra는 망가진 헬멧을 받아 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 했다.\u003c/li>\u003cli>회사는 사진을 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>하게 해 제품의 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 알 수 있도록 개선하려 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ask Your Neighbors helps users borrow needed items from neighbors, and the company responds to a negative experience by improving item photos for accurate information.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">Ask \u003c/b>\u003cb class=\"key\">Your \u003c/b>\u003cb class=\"key\">Neighbors\u003c/b> 앱은 이웃이 가진 물건을 쉽게 빌리고 반납하도록 돕는다. Jasmine은 \u003cb class=\"key\">돈 \u003c/b>\u003cb class=\"key\">절약\u003c/b>과 \u003cb class=\"key\">환경친화성\u003c/b>을 칭찬했지만 Cassandra는 망가진 헬멧을 받아 불만을 제기했고, 회사는 사진을 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>해 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 알리겠다고 응답했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 글은 이웃에게 물건을 빌리는 앱의 장점과 이용 과정, 그리고 한 사용자의 부정적인 경험을 회사가 어떻게 개선하려는지 보여 줬어요. 긍정 후기와 부정 후기를 함께 읽으면서 서비스에 필요한 신뢰와 정확한 정보의 중요성을 잡아 두면 좋아요. 마지막에는 사진 업데이트와 정확한 상태 안내가 문제 해결의 핵심이라는 점을 꼭 기억해 주세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
