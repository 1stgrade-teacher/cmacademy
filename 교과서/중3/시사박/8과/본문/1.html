div class=\"lec-cover-bkg-txt\">팝아트(Pop Art)를 이해하려면 우선 1950년대 당시 예술계를 지배하던 &#39;고급 예술(Fine Art)&#39;에 대한 고정관념을 알 필요가 있어요. 당시 예술은 박물관에 걸린 난해하고 엄숙한 것만 해당한다고 여겨졌는데, 팝아트의 거장들은 일상 속 친숙한 대중문화(Popular Culture)를 예술의 영역으로 과감하게 끌어들였답니다. 마치 길거리에서 흔히 보는 광고나 만화책을 미술관 벽에 붙여놓는 것처럼, 예술이 엘리트들만의 전유물이 아니라는 점을 강조한 것이죠. 대표적인 작가인 앤디 워홀(Andy Warhol)이 캠벨 수프 캔을 작품화한 것은 예술과 상업의 경계를 허문 아주 중요한 사건으로 평가받아요. 이처럼 팝아트는 대중의 눈높이에서 예술의 정의를 새롭게 쓴 혁명적인 시도라고 생각하면 지문을 훨씬 재미있게 읽으실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01팝아트의 정의와 시작</div><ul><li>팝아트는 대중을 위한 예술이라는 의미를 지니며, 1950년대 미국에서 처음 등장했습니다.</li><li>팝(Pop)은 대중적인(Popular)의 줄임말</li><li>누구나 즐길 수 있는 예술을 지향함</li><li>핵심 키워드: 팝아트(Pop Art), 대중적인(Popular)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02예술적 소재의 변화</div><ul><li>기존의 어렵고 전통적인 예술에서 벗어나 우리 주변의 대중문화적 요소를 활용했습니다.</li><li>TV, 만화책, 잡지, 광고 등에서 소재를 차용함</li><li>익숙한 이미지를 사용하여 친근함을 극대화함</li><li>핵심 키워드: 대중문화(Popular culture), 이미지(Images)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03대중의 반응과 영향</div><ul><li>사람들은 전시회에서 친숙한 이미지를 발견하며 팝아트를 신선하고 이해하기 쉬운 예술로 받아들였습니다.</li><li>어렵고 난해했던 기존 예술에 대한 고정관념 변화</li><li>일상의 이미지와 밝은 색채를 활용해 대중과 소통</li><li>핵심 키워드: 신선한(Refreshing), 일상의(Daily)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">short for</td><td class=\"m\">~의 줄임말인, ~을 줄여서 부르는</td></tr><tr><td class=\"w\">turn one&#39;s eyes to</td><td class=\"m\">~으로 눈을 돌리다, ~에 관심을 가지기 시작하다</td></tr><tr><td class=\"w\">familiar</td><td class=\"m\">익숙한, 친숙한</td></tr><tr><td class=\"w\">refreshing</td><td class=\"m\">상쾌하게 하는, 신선한</td></tr><tr><td class=\"w\">since then</td><td class=\"m\">그 이후로, 그때부터</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">환영합니다</span><span class=\"en\"><b>Welcome</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트 전시회에!</span><span class=\"en\"><b>to the Pop Art Exhibition!</b></span></div></div><div class=\"lec-sent-ko\">팝 아트 전시회에 오신 것을 환영합니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전시회 입구에서 관람객을 맞이하는 상황을 설정하여, 앞으로 소개할 팝 아트라는 주제에 자연스럽게 관심을 가지도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Art for Everyone (관용표현): &#39;모두를 위한 예술&#39;이라는 의미로, 전치사 for를 사용하여 대상을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 보나요?</span><span class=\"en\"><b><span class=\"grammar-hl\">do you see?</span></b></span></div></div><div class=\"lec-sent-ko\">여러분은 무엇이 보이나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 환영 인사에 이어, 관람객이 전시 공간 안에서 구체적인 대상들을 직접 관찰하도록 주의를 집중시키는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What do you see? 간접의문문과 혼동 주의: 의문사가 문두에 오는 직접의문문 구조로, 조동사 do가 일반동사 see의 의문문을 만들기 위해 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수프 통조림의 그림들인가요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Paintings of soup cans?</span></b></span></div></div><div class=\"lec-sent-ko\">수프 통조림들의 그림인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상적인 대상을 예술의 소재로 삼는 팝 아트의 특징을 직접적으로 언급하며, 관람객이 목격한 대상을 확인하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Paintings of soup cans? (관용표현): 명사 Paintings와 전치사 of를 활용해 대상의 내용을 설명하는 구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">커다란 만화들인가요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Big cartoons?</span></b></span></div></div><div class=\"lec-sent-ko\">커다란 만화들이요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 팝 아트의 또 다른 소재를 나열하면서, 예술이라고 생각하기 어려운 대상이 전시된 상황을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Big cartoons? 형용사 수식: 형용사 Big이 명사 cartoons를 직접 수식하여 상태나 성질을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들이</span><span class=\"en\"><b><span class=\"grammar-hl\">Do they look like</span> art works?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보이나요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술 작품처럼</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것들이 예술 작품처럼 보이나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상적인 사물을 예술 작품으로 보는 관점에 의문을 던지며, 예술에 대한 기존의 고정관념을 흔드는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do they look like (관용표현): look like(~처럼 보이다)는 자동사 look 뒤에 전치사 like를 사용하여 대상과의 유사성을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마 아닐 것이지만,</span><span class=\"en\"><b>Probably not,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 생각해 보세요.</span><span class=\"en\"><b>but <span class=\"grammar-hl\">think again</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마 그렇게 보이지 않겠지만, 다시 생각해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 관람객이 느낄 법한 부정적인 답변을 먼저 수용하고, 뒤이어 이어질 본격적인 설명에 앞서 예술에 대한 관점을 전환하도록 권유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">think again (관용표현): 부사 again을 동사 think 뒤에 배치하여 행동의 반복을 지시하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b><span class=\"grammar-hl\">They are all famous works</span> of pop art.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 팝 아트 작품들입니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것들은 모두 유명한 팝 아트 작품들입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 일상적 대상들이 예술의 범주에 속한다는 사실을 명확히 밝히며, 이 글이 다루는 핵심 대상을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They are all famous works 5형식(SVOC) 구조와 유사한 보어 역할: are(be동사) 뒤에 famous works(명사 보어)가 와서 주어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘pop’은</span><span class=\"en\"><b>Pop <span class=\"grammar-hl\">is short for</span> popular.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄임말이다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘popular(대중적인)’의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">‘pop’은 ‘popular(대중적인)’의 줄임말이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 용어의 어원을 통해 &#39;팝 아트&#39;라는 명칭이 대중적인 성격을 띠고 있음을 논리적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is short for (관용표현): &#39;~의 줄임말이다&#39;라는 뜻의 숙어로, be동사 + 형용사 + 전치사 구조로 이루어져 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">short for</td><td class=\"m\">~의 줄임말인, ~을 줄여서 부르는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서</span><span class=\"en\"><b>So pop art means popular art, or <span class=\"grammar-hl\">art for people</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트는</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미한다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중적인 예술</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 사람들을 위한 예술을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">따라서 팝 아트는 대중적인 예술 또는 사람들을 위한 예술을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장의 어원 풀이를 바탕으로, 팝 아트가 소수만을 위한 것이 아닌 일반 대중을 지향하는 예술임을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">art for people (관용표현): 전치사 for를 통해 예술의 대상(사람들)을 한정하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It began</span> in the 1950s in America.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작되었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">1950년대에</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 미국에서 1950년대에 시작되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팝 아트가 등장한 역사적 배경을 서술하며 대중문화가 급성장하던 당시 미국의 상황을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It began 자동사 구조: began은 목적어를 취하지 않는 자동사로 사용되어 주어의 행동을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">팝 아트 예술가들은</span><span class=\"en\"><b>Pop artists at that time wanted <span class=\"grammar-hl\">to create something fun and easy</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 당시</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들고 싶었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">재미있고 쉬운 것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그 당시 팝 아트 예술가들은 재미있고 쉬운 것을 만들고 싶었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 어렵고 엄숙한 예술관에서 벗어나려는 창작자들의 의도를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to create something fun and easy (to부정사): 동사 wanted의 목적어 역할을 하며, something을 후위수식하는 형용사(fun, easy)와 결합된 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어려운 전통 예술 작품 대신에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Instead of</span> difficult traditional art works,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 눈을 돌렸습니다</span><span class=\"en\"><b>they turned their eyes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중문화로.</span><span class=\"en\"><b>to popular culture.</b></span></div></div><div class=\"lec-sent-ko\">어려운 전통 예술 작품 대신에 그들은 대중문화로 눈을 돌렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전통 예술과의 차별성을 강조하기 위해, 예술의 소재를 어디에서 가져왔는지 대조적인 방식을 통해 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Instead of (관용표현): 전치사구로서 &#39;~대신에&#39;라는 의미를 나타내며 뒤에 명사구가 옵니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 이미지를 사용했습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">They used images</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">TV, 만화책, 잡지, 그리고 광고로부터의.</span><span class=\"en\"><b>from TV, comic books, magazines, and advertising.</b></span></div></div><div class=\"lec-sent-ko\">그들은 TV와 만화책, 잡지, 광고에 있는 이미지를 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 12번 문장에서 언급한 &#39;대중문화&#39;의 구체적인 예시를 들어 팝 아트의 제작 방식을 상세히 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They used images 5형식(SVOC)과 유사한 구조: 주어(They) + 동사(used) + 목적어(images)의 기본 3형식 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 친숙한 이미지들을 보았을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When people saw familiar images</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미술 전시회에서,</span><span class=\"en\"><b>in art exhibitions,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그것들이 신선하다는 것을 알게 되었습니다.</span><span class=\"en\"><b>they <span class=\"grammar-hl\">found them refreshing</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 미술 전시회에서 친숙한 이미지들을 봤을 때, 그들은 그것이 신선하다는 것을 알게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중이 예술을 접했을 때 느꼈던 감정 변화를 다루며, 팝 아트가 왜 성공할 수 있었는지 그 원인을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When people saw familiar images 분사구문의 선행절: 접속사 When을 사용한 부사절로, 주어와 동사의 구조가 갖춰진 절입니다.</div><div class=\"lec-gr-item\">found them refreshing 5형식(SVOC) 구조: 주어(they) + 동사(found) + 목적어(them) + 목적보어(refreshing, 현재분사)로, 목적어의 상태를 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">familiar</td><td class=\"m\">익숙한, 친숙한</td></tr><tr><td class=\"w\">refreshing</td><td class=\"m\">상쾌하게 하는, 신선한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이후로,</span><span class=\"en\"><b>Since then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트는 정말로 인기가 많아졌습니다.</span><span class=\"en\"><b>pop art <span class=\"grammar-hl\">has become</span> truly popular.</b></span></div></div><div class=\"lec-sent-ko\">그 이후로 팝 아트는 정말로 인기가 많아졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름에 따라 팝 아트가 예술계에서 확고한 위치를 차지하게 되었음을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has become (현재완료): 과거의 시작점에서 현재까지의 상태 변화를 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">since then</td><td class=\"m\">그 이후로, 그때부터</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People thought <span class=\"grammar-hl\">that art was too difficult to understand</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술이</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 어려워서</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해할 수 없다는 것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">사람들은 예술이 너무 어려워서 이해할 수 없다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팝 아트가 등장하기 전 예술에 대해 사람들이 가졌던 일반적인 통념을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that art was too difficult to understand 명사절(접속사 that): 동사 thought의 목적어 역할을 하는 절입니다. &#39;too ~ to V&#39; 구문(너무 ~해서 ~할 수 없다)이 포함되어 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일상의 이미지와 밝은색을 사용함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">By using daily images</span> and bright colors, <span class=\"grammar-hl\">pop artists changed that thought</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트 예술가들은</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꿨다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 생각을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">일상의 이미지와 밝은색을 사용함으로써 팝 아트 예술가들은 그 생각을 바꿨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 방법론을 통해 팝 아트가 어떻게 기존의 통념을 깨뜨리고 대중에게 다가갔는지 최종적으로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By using daily images (동명사): 전치사 By 뒤에서 &#39;수단&#39;을 나타내는 명사 역할을 합니다.</div><div class=\"lec-gr-item\">pop artists changed that thought 5형식(SVOC) 기본구조: 주어 + 동사 + 목적어 구조로 이루어진 문장입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>팝 아트는 미국에서 시작된 &#39;사람들을 위한 대중 예술&#39;이다.</li><li>기존의 어렵고 난해한 전통 예술에서 벗어나기 위해 노력했다.</li><li>TV나 광고 등 일상적이고 친숙한 이미지를 사용하여 대중의 호응을 얻었다.</li><li>팝 아트는 어렵다는 예술의 고정관념을 깨고 누구나 즐길 수 있는 예술로 자리 잡았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Pop art originated in the 1950s by using familiar images from popular culture to make art more relatable, and it transformed public perception by replacing traditional, difficult art with vibrant and accessible works.</div>\n              <div class=\"lec-final-sum-ko\">팝아트는 대중문화의 친숙한 이미지를 활용해 예술의 접근성을 높이며 1950년대에 시작되었고, 전통적이고 어려운 예술을 생동감 넘치고 이해하기 쉬운 작품들로 대체하며 대중의 인식을 변화시켰다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"a
