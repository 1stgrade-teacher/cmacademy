<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 시사(박) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 8과 본문1","audioDir":"1_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Pop Art: Popular Art for People\u003c/h1>\u003ch2>팝 아트, 대중을 위한 예술\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아트\u003c/b>가 \u003cb class=\"key\">대중적인 \u003c/b>\u003cb class=\"key\">예술\u003c/b>이라는 뜻이며, \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>와 \u003cb class=\"key\">밝은색\u003c/b>으로 예술이 어렵다는 통념을 바꿨다는 내용을 담고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Pop art is popular art for people, and it changed the idea that art is too difficult by using everyday images and bright colors.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 시사 박 교재 팝 아트 전시회라는 본문 지문을 함께 볼게요. 이 글은 팝 아트가 대중적인 예술이라는 뜻이고, 일상의 이미지로 예술이 어렵다는 생각을 바꿨다는 내용을 담고 있어요. 먼저 전체 요약과 요지를 확인하고 본문으로 들어가겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">팝 아트(Pop Art)는 popular art의 줄임말로, 대중문화 속 이미지를 예술로 끌어올린 현대 미술 사조예요. 1950년대 미국에서는 추상표현주의(Abstract Expressionism)처럼 어려운 \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">미술\u003c/b>이 주류였는데, 팝 아티스트들은 TV, 만화책, 광고 같은 \u003cb class=\"key\">대중문화\u003c/b>에서 소재를 가져왔어요. 앤디 워홀(Andy Warhol)의 수프 캔 그림처럼 일상에서 흔히 보던 물건이 미술관에 걸리면 사람들은 이것도 예술인가 하고 질문하게 되죠. 이는 마치 평범한 간식이 고급 레스토랑 메뉴에 등장하면서 새롭게 보이는 것과 비슷해요. 팝 아트는 예술의 경계를 낮추고 누구나 즐길 수 있는 \u003cb class=\"key\">쉬운 \u003c/b>\u003cb class=\"key\">예술\u003c/b>을 추구했어요.\u003c/div>","segs":[{"n":2,"text":"팝 아트라는 말은 popular art의 줄임말이에요. 이십 세기 중반 미국에서는 어려운 추상표현주의 같은 현대 미술이 주류였는데, 팝 아티스트들은 TV와 만화책, 잡지, 광고에 나오는 대중문화 이미지를 작품으로 가져왔죠. 앤디 워홀의 수프 캔 그림처럼 일상의 물건이 미술관에 걸리면 우리는 이것도 예술인가 하고 질문하게 돼요. 평범한 간식이 고급 레스토랑 메뉴에 등장하면 새롭게 보이는 것과 비슷해요. 팝 아트는 예술의 경계를 낮추고 누구나 즐길 수 있는 쉬운 예술을 추구했어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문으로 시작\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>전시회에 온 관람객에게 수프 통조림 그림이나 커다란 만화가 예술 작품으로 보이는지 \u003cb class=\"key\">질문\u003c/b>을 던진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전환과 정의\u003csmall>전환 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>아마 아니라고 생각하겠지만 다시 생각해 보라고 한 뒤, 팝은 popular의 \u003cb class=\"key\">줄임말\u003c/b>이며 팝 아트는 대중적인 예술, 즉 사람들을 위한 예술이라고 정의한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>탄생과 방법\u003csmall>근거 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>팝 아트는 미국에서 1950년대에 \u003cb class=\"key\">시작\u003c/b>되었고, 당시 예술가들은 어려운 전통 예술 대신 \u003cb class=\"key\">대중문화\u003c/b>로 눈을 돌려 TV, 만화책, 잡지, 광고의 이미지를 사용했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영향과 결론\u003csmall>결론 · 문장 14–17\u003c/small>\u003c/h4>\u003cp>사람들은 전시회에서 \u003cb class=\"key\">친숙한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 보고 신선함을 느꼈고, 팝 아트는 정말 인기를 얻었다. 결국 일상 이미지와 밝은색으로 예술이 어렵다는 \u003cb class=\"key\">통념\u003c/b>을 바꿨다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 팝 아트의 뜻과 시작, 그리고 영향 순으로 이야기가 흘러가요.","hl":null},{"n":4,"text":"첫 번째 단계는 질문으로 시작하는 도입이에요. 전시회에 온 관람객에게 수프 통조림 그림과 커다란 만화가 예술 작품으로 보이는지 물어보죠. 이 질문들은 우리의 호기심을 끌어내면서 팝 아트라는 낯선 개념을 소개하는 장치예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환과 정의예요. 아마 아니라고 생각하겠지만 다시 생각해 보라고 한 뒤에, 팝은 popular의 줄임말이고 팝 아트는 대중적인 예술, 즉 사람들을 위한 예술이라고 정의해요. 이 부분에서 팝 아트의 정체가 분명해지죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 팝 아트의 탄생과 방법이에요. 팝 아트는 이십 세기 중반 미국에서 시작되었고, 당시 예술가들은 어려운 전통 예술 대신 대중문화로 눈을 돌렸어요. TV와 만화책, 잡지, 광고에서 이미지를 가져와 작품을 만들었죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 영향과 결론이에요. 사람들은 전시회에서 친숙한 이미지를 보고 신선함을 느꼈고, 그 이후로 팝 아트는 정말로 인기를 얻었어요. 결국 일상의 이미지와 밝은색을 사용해서 예술이 너무 어렵다는 통념을 바꿨죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 수프 캔 그림이나 만화가 예술 작품 같지 않다는 반응을 예상하고, 다시 생각해 보라고 하면서 팝 아트라고 \u003cb class=\"key\">반박\u003c/b>한다. 마지막에도 예술은 어렵다는 \u003cb class=\"key\">통념\u003c/b>을 일상 이미지와 밝은색으로 바꿨다고 정리한다. 따라서 중심 생각을 처음과 끝에서 반복하는 \u003cb class=\"key\">양괄식\u003c/b> 구조로 판단했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Probably not, but think again (6)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>So (9)\u003c/b>\u003cspan>인과·정의\u003c/span>\u003cb>Instead of (12)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Since then (15)\u003c/b>\u003cspan>시간·결과\u003c/span>\u003cb>By using (17)\u003c/b>\u003cspan>수단·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">famous works of pop art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">popular art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">art for people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">popular culture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">familiar images\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">daily images\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>전통 예술\u003c/th>\u003cth>대중문화 이미지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>어려운 전통 예술 작품\u003c/td>\u003ctd>TV·만화책·잡지·광고 이미지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예술은 이해하기 어렵다는 생각\u003c/td>\u003ctd>일상의 이미지와 밝은색\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념과 반박 구조로 볼 수 있어요. 처음에는 수프 캔이나 만화가 예술 작품 같지 않다는 반응을 예상하고, 다시 생각해 보라고 하면서 팝 아트라고 반박하죠. 마지막에도 예술은 어렵다는 통념을 일상 이미지와 밝은색으로 바꿨다고 정리해서 처음과 끝에서 중심 생각을 반복하는 양괄식 구조예요.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. 여섯 번째 문장의 Probably not, but think again은 대중적인 예술이 아니라는 생각을 전환하는 신호예요. 아홉 번째 문장의 So는 앞의 줄임말 설명을 받아서 팝 아트의 뜻을 정리하는 인과 표현이에요. 열두 번째 문장의 Instead of는 어려운 전통 예술과 대중문화를 대조해 주고요. 열다섯 번째 문장의 Since then은 시간의 흐름에 따른 결과를 보여 줘요. 그리고 친숙한 이미지와 일상의 이미지는 계속해서 같은 개념을 바꿔 말한 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>exhibition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전시회\u003c/span>\u003c/div>\u003cdiv>\u003cb>soup can\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수프 통조림\u003c/span>\u003c/div>\u003cdiv>\u003cb>cartoon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>만화\u003c/span>\u003c/div>\u003cdiv>\u003cb>art work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술 작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>think again\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pop art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팝 아트\u003c/span>\u003c/div>\u003cdiv>\u003cb>short for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 줄임말\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중적인, 인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at that time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 당시\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fun\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재미있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>traditional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전통적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn one's eyes to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 눈을 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대중문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이미지, 영상\u003c/span>\u003c/div>\u003cdiv>\u003cb>comic book\u003c/b>\u003cem>명사\u003c/em>\u003cspan>만화책\u003c/span>\u003c/div>\u003cdiv>\u003cb>magazine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잡지\u003c/span>\u003c/div>\u003cdiv>\u003cb>advertising\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광고\u003c/span>\u003c/div>\u003cdiv>\u003cb>familiar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>refreshing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신선한, 참신한\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상의 이미지\u003c/span>\u003c/div>\u003cdiv>\u003cb>bright color\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밝은색\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개를 짚을게요. exhibition은 전시회, popular는 대중적인, create는 만들다, traditional은 전통적인, familiar는 친숙한, refreshing은 신선한이라는 뜻이에요. 특히 Instead of는 뒤에 나오는 것을 대신한다는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">대중적인, 인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">widely liked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difficult\u003c/b>\u003cspan class=\"m\">어려운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"s\">challenging\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">familiar\u003c/b>\u003cspan class=\"m\">친숙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">recognizable\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfamiliar\u003c/span>\u003cspan class=\"a\">strange\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">refreshing\u003c/b>\u003cspan class=\"m\">신선한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">novel\u003c/span>\u003cspan class=\"s\">new\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">invent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">change\u003c/b>\u003cspan class=\"m\">바꾸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fun\u003c/b>\u003cspan class=\"m\">재미있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enjoyable\u003c/span>\u003cspan class=\"s\">entertaining\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">effortless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 어휘를 확장해 볼게요. popular는 well-known이나 common과 비슷하고, 반대는 unpopular예요. difficult는 hard나 challenging과 비슷하고 easy가 반대죠. familiar는 well-known으로, unfamiliar가 반대예요. refreshing은 new나 novel과 가깝고, boring과는 반대 느낌이에요. create는 make나 produce와 비슷하고 destroy가 반대고요. change는 alter나 transform과 비슷해서 시험에서 어휘 문제로 자주 출제돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 오신 것을 환영합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Welcome \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트 전시회!\u003c/span>\u003cspan class=\"en\">the Pop Art Exhibition!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">팝 아트 전시회에 오신 것을 환영합니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전시회에 온 관람객을 \u003cb class=\"key\">환영\u003c/b>하는 첫 문장으로, 글이 \u003cb class=\"key\">Pop \u003c/b>\u003cb class=\"key\">Art \u003c/b>\u003cb class=\"key\">Exhibition\u003c/b> 안내임을 바로 알려 준다. 'Welcome to + 장소'는 공식적인 환영 인사 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">환영 표현 (Welcome to + 장소)\u003c/span> : Welcome to + [장소/행사] : \"~에 오신 것을 환영합니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Welcome to, ~에 오신 것을 환영합니다. the Pop Art Exhibition!, 팝 아트 전시회!. 이 문장 전체를 해석하면, 팝 아트 전시회에 오신 것을 환영합니다!","hl":"m"},{"n":13,"text":"이 문장은 전시회에 온 관람객을 환영하는 첫인사예요. Welcome to는 어떤 장소나 행사에 상대방을 환영할 때 쓰는 표현이에요. 이 문장 덕분에 글이 팝 아트 전시회 안내글이라는 걸 바로 알 수 있죠.","hl":"mn"},{"n":14,"text":"어법 포인트는 Welcome to입니다. Welcome to 다음에 장소나 행사를 넣으면 그곳에 온 사람을 환영하는 뜻이 돼요. 여기서는 the Pop Art Exhibition이 뒤에 와서 팝 아트 전시회에 온 것을 환영한다는 의미를 나타내요. 시험에서는 Welcome to 뒤에 올 수 있는 장소를 고르는 문제나 빈칸 채우기로 나올 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 무엇이 보이나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관람객에게 무엇이 보이는지 물으며 눈을 그림으로 이끄는 \u003cb class=\"key\">의문문\u003c/b>이다. 뒤에 제시될 낯선 작품들에 대한 \u003cb class=\"key\">호기심\u003c/b>을 불러일으킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 의문문\u003c/span> : 의문사 + do/does + 주어 + 동사원형? : \"무엇이 보이나요?\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What, 무엇이. do you see?, 보이나요?. 이 문장 전체를 해석하면, 여러분은 무엇이 보이나요?","hl":"m"},{"n":16,"text":"이 문장은 전시회에서 관람객에게 무엇이 보이는지 물어보는 질문이에요. 상대방의 시선을 그림 쪽으로 이끌면서 다음에 나올 수프 통조림이나 만화 같은 그림을 떠올리게 하죠. 평범한 질문처럼 보이지만 앞으로 소개할 낯선 작품들에 대한 호기심을 불러일으키는 역할을 해요.","hl":"mn"},{"n":17,"text":"어법 포인트는 What do you see?예요. 의문사 What이 문장 맨 앞에 오고, 일반동사 see가 있으니까 do를 써서 What do you see?라고 묻는 거예요. 주어가 you일 때는 do를 쓰고, 주어가 삼인칭 단수면 does를 써야 하죠. 시험에서는 do와 does 중에 고르는 문제로 자주 출제돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Paintings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수프 통조림들의?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">soup \u003c/span>\u003cspan class=\"tgt\">cans\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수프 통조림들의 그림인가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수프 통조림 그림이냐고 되묻는 \u003cb class=\"key\">수사의문문\u003c/b>으로, 일상적 사물이 예술 작품이 될 수 있다는 \u003cb class=\"key\">반전\u003c/b>을 암시한다. 팝 아트의 소재가 전통적 예술과 다르다는 점을 \u003cb class=\"key\">강조\u003c/b>한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of의 명사 수식\u003c/span> : [명사] + of + [명사] : \"수프 통조림들의 그림\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Paintings, 그림들. of soup cans?, 수프 통조림들의?. 이 문장 전체를 해석하면, 수프 통조림들의 그림인가요?","hl":"m"},{"n":19,"text":"이 문장은 보이는 것이 수프 통조림 그림이냐고 되묻는 표현이에요. 사실은 질문이라기보다는 놀라움이나 반문의 느낌을 담고 있어요. 수프 통조림처럼 평범한 물건이 그림의 주제가 될 수 있다는 점을 부각하면서 팝 아트의 특징을 미리 보여 주는 문장이에요.","hl":"mn"},{"n":20,"text":"어법 포인트는 Paintings of soup cans입니다. of는 뒤에 오는 명사가 앞의 명사를 설명해 주는 전치사인데, 여기서는 soup cans가 paintings의 내용이나 소재를 나타내요. 그래서 수프 통조림들의 그림, 즉 수프 통조림을 그린 그림이라는 뜻이 돼요. 명사 of 명사 형태는 소유나 내용을 나타낼 수 있다는 걸 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Big \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만화들이요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">cartoons?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">커다란 만화들이요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에 나온 What do you see?의 대답에 이어져, 보이는 것 중 하나로 커다란 만화를 예로 들며 되묻는 표현이에요. 전체 문장이 아닌 \u003cb class=\"key\">명사구\u003c/b>만으로 질문을 만들었기 때문에 가볍게 확인하는 느낌을 줘요. \u003cb class=\"key\">생략 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>으로서 독자의 시선을 전시된 만화 그림으로 이끄는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생략 의문문 (Do you see big cartoons?의 생략)\u003c/span> : Do you see big cartoons? → Big cartoons? : \"커다란 만화들이요?\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Big, 커다란. cartoons?, 만화들이요?. 이 문장 전체를 해석하면, 커다란 만화들이요?","hl":"m"},{"n":22,"text":"이 문장은 바로 앞에 있는 What do you see?라는 질문에 이어서, 보이는 것 중 하나로 커다란 만화들을 예로 든 거예요. 말 그대로 만화 그림이 미술 작품으로 전시되어 있다는 상황을 떠올리게 해 주는 거죠. 문장 전체가 아니라 명사구만으로 질문한 거라서, 상대에게 짧게 되묻는 느낌을 줘요.","hl":"mn"},{"n":23,"text":"이 문장은 전체 절을 쓰지 않고 Big cartoons?라고 명사구만 남긴 생략 의문문이에요. 원래는 Do you see big cartoons?처럼 주어와 동사가 있어야 하는데, 앞에 What do you see?가 있으니까 반복되는 부분을 빼고 이렇게 짧게 물어본 겁니다. 그래서 앞 문장과 자연스럽게 연결되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~처럼 보이나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술 작품?\u003c/span>\u003cspan class=\"en\">art works?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들이 예술 작품처럼 보이나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전시된 수프 캔 그림이나 만화 같은 것들이 전통적인 예술 작품과 같은 느낌을 주는지 독자에게 묻는 문장이에요. \u003cb class=\"key\">look \u003c/b>\u003cb class=\"key\">like\u003c/b>는 겉모습이 그렇게 보인다는 뜻을 나타내는 중요한 표현이고, 이를 통해 팝아트를 처음 본 사람들이 느낄 의문을 대신 말해 줘요. 글 흐름에서는 앞에서 든 예시들을 묶어 \u003cb class=\"key\">되묻기\u003c/b>하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 do를 이용한 일반동사 의문문\u003c/span> : Do + 주어(they) + 동사원형(look) ~? : \"그것들은 ~처럼 보이나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">look like + 명사\u003c/span> : look + like + 명사(art works) : \"~처럼 보이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Do they, 그것들이. look like, ~처럼 보이나요?. art works?, 예술 작품?. 이 문장 전체를 해석하면, 그것들이 예술 작품처럼 보이나요?","hl":"m"},{"n":25,"text":"이 문장은 전시된 수프 캔 그림이나 커다란 만화 같은 것들이 우리가 평소에 생각하는 예술 작품처럼 보이는지 독자에게 물어보는 거예요. look like는 어떤 대상의 모습이 그렇게 보인다는 뜻을 나타내는 아주 중요한 표현이에요. 이 질문을 통해 팝아트를 처음 보면 예술 작품으로 인정하기 어렵다는 점을 자연스럽게 끄집어내고 있죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 Do they look like? 형태예요. 일반동사 look이 쓰인 의문문이라서 조동사 do를 문장 맨 앞에 두고, 주어 they 다음에는 동사원형 look을 써 준 겁니다. 두 번째 포인트는 look like인데, look이 like와 함께 붙어서 ~처럼 보이다라는 하나의 의미 단위를 만들어요. 뒤에 art works가 오면서 예술 작품처럼 보이다가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마 그렇게 보이지 않겠지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Probably \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 생각해 보세요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">again\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아마 그렇게 보이지 않겠지만, 다시 생각해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 질문 Do they look like art works?에 대해 독자가 아마 아니라고 생각할 반응을 먼저 인정해 주는 문장이에요. but을 경계로 앞의 \u003cb class=\"key\">부정 \u003c/b>\u003cb class=\"key\">추측\u003c/b>을 받아들인 뒤, \u003cb class=\"key\">명령문\u003c/b>으로 다시 생각해 보라고 권유해요. 이를 통해 팝아트를 예술 작품으로 인정하는 새로운 관점으로 전환시키는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 Probably와 not을 이용한 짧은 부정 추측\u003c/span> : Probably + not : \"아마 그렇게 보이지 않겠지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">but + 명령문\u003c/span> : but + 동사원형(think) ~ : \"하지만 다시 생각해 보세요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Probably not, but, 아마 그렇게 보이지 않겠지만. think again, 다시 생각해 보세요.. 이 문장 전체를 해석하면, 아마 그렇게 보이지 않겠지만, 다시 생각해 보세요.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 한 질문에 대해 독자가 아마 아니라고 생각할 거라는 반응을 먼저 인정해 주는 거예요. 그런 다음 but을 써서 다시 생각해 보라고 권유하며 생각을 바꾸도록 이끌죠. 그래서 팝아트 작품들도 충분히 예술 작품이 될 수 있다는 새로운 시각을 열어 주는 전환점 역할을 해요.","hl":"mn"},{"n":29,"text":"Probably not은 앞선 질문에 대한 대답을 짧게 줄인 생략 표현이에요. probably가 아마라는 추측의 의미를 더해 주고 not이 그 내용을 부정하는 거죠. but은 앞 내용과 반대되는 방향으로 이어 주는 등위접속사이고, think again은 주어 없이 동사원형으로 시작하는 명령문이에요. 이렇게 but과 명령문을 함께 써서 상대방에게 다시 생각해 보라고 부드럽게 권유하고 있는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명한 작품들\u003c/span>\u003cspan class=\"en\">famous \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">works \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">pop \u003c/span>\u003cspan class=\"tgt\">art\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 모두 유명한 팝 아트 작품들입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 언급한 수프 캔 그림이나 큰 만화 같은 것들이 모두 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아트\u003c/b>의 유명한 \u003cb class=\"key\">작품\u003c/b>이라는 점을 정리해 주는 문장입니다. works는 일이나 노동이 아니라 예술 분야의 작품이라는 뜻이에요. 글의 흐름에서 의문을 제기했던 이미지들을 예술로 인정하게 만드는 전환점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">all의 위치\u003c/span> : 주어 + be동사 + all + 보어 : \"그것들은 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of 전치사구의 명사 수식\u003c/span> : work(s) of + 명사 : \"팝 아트의 작품들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They are, 그것들은. all, 모두. famous works, 유명한 작품들. of pop art, 팝 아트의. 이 문장 전체를 해석하면, 그것들은 모두 유명한 팝 아트 작품들입니다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 본 수프 캔 그림이나 큰 만화 같은 이미지들이 사실은 모두 팝 아트의 유명한 작품들이라고 정리해 주는 역할을 해요. They는 앞에 나온 그런 이미지들을 가리키고, works는 일이나 작업이 아니라 예술 분야에서 작품이라는 뜻이에요. 그러니까 독자에게 조금 장난스러워 보였던 그림들이 예술 작품이라는 사실을 분명히 알려 주는 전환점이 되는 문장입니다.","hl":"mn"},{"n":32,"text":"첫 번째 문법 포인트는 all의 위치입니다. They are all에서 all은 주어를 강조하면서 be동사 뒤에 오는 형태예요. 일반동사 앞, be동사 뒤라는 위치가 중요하고, 이 문장에서는 그 뒤에 famous works라는 보어가 이어지면서 그것들은 모두 유명한 작품들이라고 해석됩니다. 두 번째 문법 포인트는 works of pop art의 of입니다. of는 뒤에 오는 명사가 앞의 명사를 수식하도록 연결하는 전치사로, 여기서는 works를 pop art가 수식해서 팝 아트의 작품들이라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Pop은\u003c/span>\u003cspan class=\"en\">Pop\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~의 줄임말이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">short \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">popular(대중적인)\u003c/span>\u003cspan class=\"en\">popular.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘pop’은 ‘popular(대중적인)’의 줄임말이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Pop이 popular의 \u003cb class=\"key\">줄임말\u003c/b>임을 정의하는 문장입니다. popular는 \u003cb class=\"key\">대중적인\u003c/b>이라는 뜻이므로 팝 아트라는 이름 안에 이미 대중성이라는 성격이 들어 있다는 것을 보여 줘요. 이 정의는 다음 문장에서 팝 아트의 뜻을 설명하는 핵심 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be short for 관용 표현\u003c/span> : be short for + 명사 : \"~의 줄임말이다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Pop, Pop은. is short for, ~의 줄임말이다. popular, popular(대중적인). 이 문장 전체를 해석하면, ‘pop’은 ‘popular(대중적인)’의 줄임말이다.","hl":"m"},{"n":34,"text":"이 문장은 Pop이라는 단어가 popular의 줄임말임을 정의해 줘요. popular는 대중적인이라는 뜻이니까 팝 아트라는 이름 안에 이미 대중성이라는 성격이 들어 있다는 걸 보여 주는 거예요. 다음 문장에서 팝 아트가 대중적인 예술이라고 설명할 수 있는 근거가 되는 문장이에요.","hl":"mn"},{"n":35,"text":"이 문장의 핵심 어법은 is short for라는 관용 표현입니다. is short for는 어떤 단어가 다른 단어의 줄임말이라는 뜻을 나타내는 표현이라서 Pop is short for popular는 Pop이 popular의 줄임말이다로 해석돼요. 이 표현은 시험에서 어휘나 영작 문제로 자주 출제되니까 그대로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트는\u003c/span>\u003cspan class=\"en\">pop art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미한다\u003c/span>\u003cspan class=\"en\">means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중적인 예술\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">art, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 사람들을 위한 예술\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 팝 아트는 대중적인 예술 또는 사람들을 위한 예술을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 팝 아트가 \u003cb class=\"key\">대중적인 \u003c/b>\u003cb class=\"key\">예술\u003c/b>, 즉 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">예술\u003c/b>을 의미한다고 정의합니다. popular art와 art for people이 or로 연결되어 같은 의미를 부연 설명해 줍니다. 따라서 팝 아트는 어려운 예술이 아니라 누구나 즐길 수 있는 예술이라는 글의 핵심 개념을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 or의 병렬 구조\u003c/span> : A or B (같은 자격의 명사구 병렬) : \"대중적인 예술, 또는 사람들을 위한 예술\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 for people의 형용사적 수식\u003c/span> : art + for people (전치사구) : \"사람들을 위한 예술\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"So, 따라서. pop art, 팝 아트는. means, 의미한다. popular art, 대중적인 예술. or art for people, 또는 사람들을 위한 예술. 이 문장 전체를 해석하면, 따라서 팝 아트는 대중적인 예술 또는 사람들을 위한 예술을 의미한다.","hl":"m"},{"n":37,"text":"이 문장은 팝 아트가 대중적인 예술, 즉 사람들을 위한 예술을 의미한다고 정의해 줍니다. popular art와 art for people이 or로 연결되어 앞의 표현을 더 쉬운 말로 풀어 주고 있어요. 따라서 팝 아트는 어려운 예술이 아니라 누구나 쉽게 즐길 수 있는 예술이라는 이 글의 핵심 개념을 제시하는 문장입니다.","hl":"mn"},{"n":38,"text":"첫 번째 문법 포인트는 or의 병렬 구조입니다. popular art와 art for people이 or로 연결되면서 둘 다 같은 명사구 자격을 갖고 있어요. 앞뒤가 같은 문법 단위로 연결되어야 자연스러운 병렬이라는 점이 중요합니다. 두 번째 문법 포인트는 art for people의 전치사구입니다. for people은 앞에 있는 art를 수식하는 형용사적 전치사구로 사람들을 위한이라는 뜻을 더해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 시작되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">began\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1950년대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1950s \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">America\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 미국에서 1950년대에 시작되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 소개한 팝 아트의 \u003cb class=\"key\">시작 \u003c/b>\u003cb class=\"key\">시기\u003c/b>와 \u003cb class=\"key\">장소\u003c/b>를 밝히는 문장입니다. It은 pop art를 가리키며, 과거 사실을 나타내려고 begin의 과거형 \u003cb class=\"key\">began\u003c/b>을 썼습니다. in the 1950s는 시대를, in America는 장소를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 불규칙 과거 동사\u003c/span> : It [주어] + began [동사 과거형] : \"그것은 시작되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구를 통한 시간·장소 표시\u003c/span> : in + the 1950s [시간] / in + America [장소] : \"1950년대에 미국에서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"It began, 그것은 시작되었다. in the 1950s, 1950년대에. in America, 미국에서. 이 문장 전체를 해석하면, 그것은 미국에서 1950년대에 시작되었다.","hl":"m"},{"n":40,"text":"이 문장은 팝 아트의 시작 시기와 장소를 제시하는 문장입니다. 여기서 It은 앞에서 설명한 pop art를 가리키고, began은 begin의 과거형이에요. in the nineteen fifties는 천구백오십 년대라는 시대를, in America는 미국이라는 장소를 나타냅니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 불규칙 동사의 과거형입니다. begin의 과거형이 began이에요. 여기서 It은 pop art를 가리킵니다. 두 번째 어법 포인트는 전치사구입니다. in the nineteen fifties는 연대를, in America는 장소를 나타내는 전치사구로 각각 천구백오십 년대에, 미국에서라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 당시 팝 아트 예술가들은\u003c/span>\u003cspan class=\"en\">Pop artists at that time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들고 싶었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재미있고 쉬운 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">fun \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 당시 팝 아트 예술가들은 재미있고 쉬운 것을 만들고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아티스트들의 당시 \u003cb class=\"key\">창작 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 설명합니다. 어려운 전통 예술과 달리 \u003cb class=\"key\">재미있고 \u003c/b>\u003cb class=\"key\">쉬운\u003c/b> 작품을 만들고 싶어 했다는 점에서 팝 아트의 특징이 드러납니다. wanted to create는 want to-v 구조로 ‘만들고 싶어 했다’는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : wanted [타동사] + to create [to부정사구/목적어] : \"만들고 싶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : something [대명사] + fun and easy [형용사구] : \"재미있고 쉬운 무언가\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Pop artists at that time, 그 당시 팝 아트 예술가들은. wanted to create, 만들고 싶었다. something fun and easy, 재미있고 쉬운 것을. 이 문장 전체를 해석하면, 그 당시 팝 아트 예술가들은 재미있고 쉬운 것을 만들고 싶었다.","hl":"m"},{"n":43,"text":"이 문장은 팝 아트 예술가들의 당시 창작 의도를 설명해요. 그들은 어려운 예술 대신에 재미있고 쉬운 것을 만들고 싶어 했습니다. want to create는 만들고 싶어 하다라는 뜻이에요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 to부정사의 명사적 용법입니다. wanted to create에서 to create는 wanted의 목적어 역할을 하며 만들기를 혹은 만드는 것이라는 뜻이에요. 두 번째 어법 포인트는 형용사의 후치 수식입니다. something처럼 thing으로 끝나는 부정대명사는 형용사가 뒤에서 수식하므로 something fun and easy라고 해야 재미있고 쉬운 무언가라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려운 전통 예술 작품 대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">traditional \u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 눈을 돌렸다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">eyes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중문화로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">culture\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어려운 전통 예술 작품 대신에 그들은 대중문화로 눈을 돌렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아티스트들이 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">예술\u003c/b>에서 \u003cb class=\"key\">대중문화\u003c/b>로 관심을 돌렸다는 대조를 보여 줍니다. Instead of는 ‘~ 대신에’라는 뜻으로 어려운 전통 예술 작품을 버렸다는 의미를 강조합니다. turn one's eyes to는 ‘~로 눈을 돌리다’라는 관용 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">instead of 전치사구\u003c/span> : Instead of + 명사구 [difficult traditional art works] : \"어려운 전통 예술 작품 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 turn one's eyes to\u003c/span> : turn + one's eyes + to + [명사구] : \"대중문화로 눈을 돌렸다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Instead of difficult traditional art works, 어려운 전통 예술 작품 대신에. they turned their eyes, 그들은 눈을 돌렸다. to popular culture, 대중문화로. 이 문장 전체를 해석하면, 어려운 전통 예술 작품 대신에 그들은 대중문화로 눈을 돌렸다.","hl":"m"},{"n":46,"text":"이 문장은 팝 아티스트들이 어려운 전통 예술 작품 대신에 대중문화로 관심을 돌렸다는 내용을 대조적으로 보여 줍니다. instead of는 전치사로 뒤에 명사구를 취해서 대신에라는 뜻이 되고, turn one's eyes to는 눈을 돌리다는 관용 표현입니다.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 instead of 전치사구입니다. instead of 뒤에는 명사구가 와야 하며, 여기서 difficult traditional art works라는 명사구가 와서 어려운 전통 예술 작품 대신에라는 뜻을 만들어요. 두 번째 어법 포인트는 turn one's eyes to입니다. turn one's eyes to는 무엇으로 눈을 돌리다, 즉 관심을 옮기다라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 이미지들을 사용했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used\u003c/span> images\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">TV, 만화책, 잡지, 광고에서.\u003c/span>\u003cspan class=\"en\">from \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">TV, \u003c/span>\u003cspan class=\"tgt\">comic \u003c/span>\u003cspan class=\"tgt\">books, \u003c/span>\u003cspan class=\"tgt\">magazines, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">advertising\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 TV와 만화책, 잡지, 광고에 있는 이미지를 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아티스트들이 \u003cb class=\"key\">대중문화\u003c/b> 속 \u003cb class=\"key\">이미지\u003c/b>를 소재로 삼았다는 점을 구체적으로 보여줍니다. 앞 문장에서 나온 popular culture를 TV, 만화책, 잡지, 광고로 \u003cb class=\"key\">예시\u003c/b>하면서 팝 아트의 특징을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제\u003c/span> : 주어 + 과거형 동사 : \"사용했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : A, B, C, and D : \"TV, 만화책, 잡지, 그리고 광고\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"They used images, 그들은 이미지들을 사용했다. from TV, comic books, magazines, and advertising, TV, 만화책, 잡지, 광고에서.. 이 문장 전체를 해석하면, 그들은 TV와 만화책, 잡지, 광고에 있는 이미지를 사용했다.","hl":"m"},{"n":49,"text":"이 문장은 팝 아티스트들이 어려운 전통 예술 대신 대중문화 속 이미지를 가져왔다는 것을 구체적으로 보여줍니다. TV, 만화책, 잡지, 광고처럼 사람들이 일상에서 접하는 예시를 나열해서 팝 아트의 특징을 뒷받침해요.","hl":"mn"},{"n":50,"text":"첫 번째 어법은 병렬 구조입니다. TV, comic books, magazines, and advertising처럼 여러 개를 나열할 때 마지막 단어 앞에 and를 붙여 줘요. 두 번째 어법은 과거 시제입니다. used는 팝 아티스트들이 과거에 행동했음을 나타내는 과거형 동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 친숙한 이미지들을 봤을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003cspan class=\"tgt\">familiar \u003c/span>\u003cspan class=\"tgt\">images\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미술 전시회에서\u003c/span>\u003cspan class=\"en\">in art exhibitions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그것이 신선하다는 것을 알게 되었다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">refreshing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 미술 전시회에서 친숙한 이미지들을 봤을 때, 그들은 그것이 신선하다는 것을 알게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 익숙한 이미지가 전시회에서 오히려 \u003cb class=\"key\">신선함\u003c/b>을 주었다는 관객의 반응을 설명합니다. 일상에서 흔히 보던 소재가 미술 전시회에 놓이면서 새롭게 느껴졌다는 의미입니다. 팝 아트가 \u003cb class=\"key\">대중\u003c/b>에게 호응을 얻기 시작한 이유를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 부사절을 이끄는 When\u003c/span> : When + 주어 + 동사, 주어 + 동사 : \"사람들이 친숙한 이미지들을 봤을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">find의 5형식 목적격 보어\u003c/span> : find + 목적어 + 목적격 보어(형용사) : \"그것이 신선하다는 것을 알게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When people saw familiar images, 사람들이 친숙한 이미지들을 봤을 때. in art exhibitions, 미술 전시회에서. they found them refreshing, 그들은 그것이 신선하다는 것을 알게 되었다. 이 문장 전체를 해석하면, 사람들이 미술 전시회에서 친숙한 이미지들을 봤을 때, 그들은 그것이 신선하다는 것을 알게 되었다.","hl":"m"},{"n":52,"text":"이 문장은 친숙한 이미지가 전시회에서 신선하게 느껴졌다는 사람들의 반응을 말해요. 일상에서 보던 소재가 미술관에 놓이니 오히려 새롭고 신선하게 다가왔던 거죠. 그래서 팝 아트가 대중에게 호응을 얻기 시작한 이유를 보여줍니다.","hl":"mn"},{"n":53,"text":"첫 번째 어법은 시간의 부사절 when입니다. When people saw familiar images에서 when이 '~할 때'라는 뜻으로 뒤에 주어와 동사가 오는 부사절을 이끌어요. 두 번째 어법은 find의 목적격 보어입니다. They found them refreshing에서 found는 '~가 ~하다는 것을 알게 되다'라는 뜻으로, 목적어 them 뒤에 형용사 refreshing이 목적격 보어로 쓰였어요. 목적어와 목적격 보어는 의미상 서술 관계라서 them이 refreshing한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이후로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">then\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트는 되었다\u003c/span>\u003cspan class=\"en\">pop art \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말로 인기 있게\u003c/span>\u003cspan class=\"en\">truly popular.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이후로 팝 아트는 정말로 인기가 많아졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트가 그 이후로 \u003cb class=\"key\">대중적\u003c/b>으로 \u003cb class=\"key\">인기\u003c/b>를 얻게 되었음을 정리합니다. 앞 문장의 긍정적 반응이 현재까지 이어져 팝 아트가 널리 사랑받는 예술로 자리 잡았다는 결론입니다. \u003cb class=\"key\">현재완료\u003c/b>를 통해 과거의 변화가 현재의 결과로 이어짐을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료와 함께 쓰이는 부사구 Since then\u003c/span> : Since then, + 현재완료 문장 : \"그 이후로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 (결과)\u003c/span> : have/has + 과거분사 : \"되었다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Since then, 그 이후로. pop art has become, 팝 아트는 되었다. truly popular, 정말로 인기 있게. 이 문장 전체를 해석하면, 그 이후로 팝 아트는 정말로 인기가 많아졌다.","hl":"m"},{"n":55,"text":"이 문장은 팝 아트가 그 이후로 진짜 대중적인 예술로 자리 잡았다고 정리해 줍니다. 앞에서 설명한 긍정적인 반응 덕분에 팝 아트가 널리 인기를 얻었다는 결론이에요.","hl":"mn"},{"n":56,"text":"첫 번째 어법은 Since then입니다. since then은 '그 이후로'라는 뜻으로, 뒤에 현재완료가 오는 신호예요. 두 번째 어법은 현재완료입니다. has become은 have나 has와 과거분사 become이 합쳐진 형태로, 과거의 어떤 시점부터 지금까지 이어진 결과를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각했다\u003c/span>\u003cspan class=\"en\">thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 어렵다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해할 수 없다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 예술이 너무 어려워서 이해할 수 없다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 예술에 대한 사람들의 기존 생각을 정리하는 역할을 해요. \u003cb class=\"key\">too \u003c/b>\u003cb class=\"key\">difficult \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">understand\u003c/b>는 '너무 어려워서 이해할 수 없다'는 뜻으로, 예술을 어렵게 느꼈다는 부정적 인식을 보여 줘요. 이 생각은 바로 다음 문장에서 팝 아트 예술가들이 \u003cb class=\"key\">that \u003c/b>\u003cb class=\"key\">thought\u003c/b>로 받아 바꾸게 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that (목적어)\u003c/span> : thought + that + [주어 + 동사 ~] : \"예술이 너무 어려워서 이해할 수 없다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too + 형용사 + to부정사\u003c/span> : too + [difficult (형용사)] + [to understand (to부정사구)] : \"너무 어려워서 이해할 수 없는\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"People, 사람들은. thought, 생각했다. that art, 예술이. was too difficult, 너무 어렵다고. to understand, 이해할 수 없다고. 이 문장 전체를 해석하면, 사람들은 예술이 너무 어려워서 이해할 수 없다고 생각했다.","hl":"m"},{"n":58,"text":"이 문장은 그 전까지 사람들이 예술을 어떻게 생각했는지를 정리해 주는 문장이에요. 예술이 너무 어려워서 이해할 수 없다는 부정적인 인식을 보여 주죠. too difficult to understand는 너무 어려워서 이해할 수 없다는 뜻이고, think 다음에 that절이 오면 그렇게 생각했다는 내용을 이끌어요.","hl":"mn"},{"n":59,"text":"첫 번째 포인트는 that절이에요. thought는 타동사라서 뒤에 목적어가 필요한데, that art was too difficult to understand라는 명사절 전체가 목적어 자리에 왔어요. that은 명사절을 이끄는 접속사이고 우리말로는 그렇게 생각했다는 내용으로 이어져요. 두 번째 포인트는 too difficult to understand 구문이에요. too와 형용사 difficult, 그리고 to부정사 understand가 만나서 너무 어려워서 이해할 수 없다는 뜻을 만들어요. too와 to부정사를 묶어서 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상의 이미지와 밝은색을 사용함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">images \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003cspan class=\"tgt\">colors\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트 예술가들은\u003c/span>\u003cspan class=\"en\">pop artists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바꿨다\u003c/span>\u003cspan class=\"en\">changed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 생각을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일상의 이미지와 밝은색을 사용함으로써 팝 아트 예술가들은 그 생각을 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트가 예술은 어렵다는 기존 생각을 \u003cb class=\"key\">by \u003c/b>\u003cb class=\"key\">using\u003c/b>을 통해 바꾸었다는 핵심 결론이에요. 일상의 이미지와 밝은색은 팝 아트의 대표적인 소재로, \u003cb class=\"key\">대중문화\u003c/b>에서 가져온 친근함을 강조해요. 앞 문장의 어려운 예술이라는 고정관념을 깨는 흐름을 완성해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사 (수단)\u003c/span> : By + [using (동명사)] + [daily images and bright colors (목적어구)] : \"일상의 이미지와 밝은색을 사용함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 that\u003c/span> : that + [thought (명사)] : \"그 생각\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"By using daily images and bright colors, 일상의 이미지와 밝은색을 사용함으로써. pop artists, 팝 아트 예술가들은. changed, 바꿨다. that thought, 그 생각을. 이 문장 전체를 해석하면, 일상의 이미지와 밝은색을 사용함으로써 팝 아트 예술가들은 그 생각을 바꿨다.","hl":"m"},{"n":61,"text":"이 문장은 앞 문장의 그 생각, 즉 예술은 너무 어렵다는 생각을 팝 아트 예술가들이 어떻게 바꾸었는지 보여 줘요. by using은 사용함으로써라는 뜻으로 방법을 나타내고, 일상의 이미지와 밝은색이 팝 아트의 핵심 소재라는 점을 강조해요. 그래서 이 문장은 팝 아트가 어려운 예술의 고정관념을 깨뜨렸다는 글의 결론 역할을 해요.","hl":"mn"},{"n":62,"text":"첫 번째 포인트는 By using daily images and bright colors예요. by는 전치사라서 뒤에 동사가 올 수 없고, 동명사 using이 와야 해요. by에 동명사를 붙이면 무엇을 사용해서 또는 어떤 방법으로라는 뜻이 돼요. 두 번째 포인트는 that thought예요. 여기서 that은 앞에서 말한 예술은 너무 어렵다는 내용을 가리키는 지시형용사라서 뒤에 명사 thought를 데리고 와요. 그래서 that thought는 그 생각이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>팝 아트는 \u003cb class=\"key\">대중적인 \u003c/b>\u003cb class=\"key\">예술\u003c/b>, 즉 사람들을 위한 예술이라는 뜻이다.\u003c/li>\u003cli>1950년대 미국에서 시작된 팝 아트 예술가들은 \u003cb class=\"key\">대중문화\u003c/b>의 이미지를 사용했다.\u003c/li>\u003cli>사람들은 전시회에서 \u003cb class=\"key\">친숙한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 보고 신선함을 느꼈다.\u003c/li>\u003cli>팝 아트는 일상 이미지와 밝은색으로 예술이 어렵다는 \u003cb class=\"key\">통념\u003c/b>을 바꿨다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Pop art is popular art for people, and it changed the idea that art is too difficult by using everyday images and bright colors.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아트\u003c/b>가 \u003cb class=\"key\">대중적인 \u003c/b>\u003cb class=\"key\">예술\u003c/b>이라는 뜻이며, \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>와 \u003cb class=\"key\">밝은색\u003c/b>으로 예술이 어렵다는 통념을 바꿨다는 내용을 담고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"오늘 배운 팝 아트는 대중적인 예술로 사람들을 위한 예술이에요. 이십 세기 중반 미국에서 시작해서 대중문화의 친숙한 이미지를 사용했고, 예술이 어렵다는 통념을 바꿨죠. 이 글은 통념과 반박, 양괄식 구조로 되어 있어서 중심 문장을 처음과 끝에서 확인하는 것이 중요해요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
