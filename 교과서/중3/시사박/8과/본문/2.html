n) 방식을 도입했는데, 이는 예술의 희소성을 강조하던 기존 관념을 뒤집고 예술의 민주화를 꾀한 혁신적인 시도였습니다. 우리가 마트에서 흔히 보는 통조림 캔이 예술 작품이 될 수 있었던 이유도 바로 이처럼 예술과 일상의 경계(Boundary between art and everyday life)를 허물고자 했던 팝아트의 철학 덕분이라고 이해하시면 글을 읽기가 훨씬 수월하실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01팝아트의 특징</div><ul><li>팝아트는 평범한 이미지를 사용하여 단순해 보이지만 그 안에 깊은 의미를 내포하고 있다.</li><li>겉보기에는 예술적이지 않음(plain)</li><li>단순함 속에 숨겨진 의미(meaning)</li><li>핵심 키워드: 팝아트(Pop art), 평범함(plain)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02팝아트의 예술성</div><ul><li>팝아티스트들은 흔한 일상의 사물을 놀라운 예술 작품으로 변화시키는 능력을 지녔다.</li><li>일상의 사물을 예술로 전환(change common objects)</li><li>예술적 역량(artistic ability)을 통한 유명세</li><li>핵심 키워드: 예술적 능력(artistic ability)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03앤디 워홀의 소재</div><ul><li>팝아트의 거장 앤디 워홀은 잡지나 상점 등 주변의 일상적인 환경에서 작품의 주제를 찾았다.</li><li>팝아트의 왕(King of Pop Art)으로 불림</li><li>마릴린 먼로, 수프 캔(cans of soup) 등을 소재로 활용</li><li>핵심 키워드: 앤디 워홀(Andy Warhol)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대량 복제의 목적</div><ul><li>워홀이 자신의 작품을 반복적으로 복제한 것은 예술이 특별한 것이 아니라 일상 속에 존재함을 보여주기 위함이었다.</li><li>반복된 이미지 복제(copies)</li><li>예술의 일상성(art is something you see every day) 강조</li><li>핵심 키워드: 복제(copies)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pop art</td><td class=\"m\">팝아트(대중예술)</td></tr><tr><td class=\"w\">plain</td><td class=\"m\">단순한, 평범한</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">artistic</td><td class=\"m\">예술적인, 예술의</td></tr><tr><td class=\"w\">worth</td><td class=\"m\">~의 가치가 있는</td></tr><tr><td class=\"w\">pay attention to</td><td class=\"m\">~에 주목하다, ~에 주의를 기울이다</td></tr><tr><td class=\"w\">be filled with</td><td class=\"m\">~로 가득 차다</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 취지</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artistic ability</td><td class=\"m\">예술적 재능, 예술적 역량</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다</td></tr><tr><td class=\"w\">change A into B</td><td class=\"m\">A를 B로 바꾸다</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 평범한</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 대상</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운, 굉장한</td></tr><tr><td class=\"w\">make up</td><td class=\"m\">~을 구성하다, ~을 만들어내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흔한 이미지를 사용하기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">Using common images</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트는</span><span class=\"en\"><b>pop art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평범해 보인다.</span><span class=\"en\"><b>looks plain.</b></span></div></div><div class=\"lec-sent-ko\">흔한 이미지를 사용하기 때문에 팝 아트는 평범해 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팝 아트가 대중에게 첫인상으로 어떻게 다가가는지 서술하며 글의 주제를 도입하는 문장입니다. 흔히 예술은 고상해야 한다는 통념과 달리 팝 아트는 주변에서 보는 흔한 소재를 다룬다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Using common images (현재분사): 분사구문으로 쓰임. 원래 절로 바꾸면 &#39;Because it uses common images&#39;와 같이 표현할 수 있으며, 주어인 pop art가 images를 사용하는 능동의 관계임을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pop art</td><td class=\"m\">팝아트(대중예술)</td></tr><tr><td class=\"w\">plain</td><td class=\"m\">단순한, 평범한</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 평범한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 말하면</span><span class=\"en\"><b><span class=\"grammar-hl\">In other words</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술적으로 보이지 않는다.</span><span class=\"en\"><b>doesn't look artistic.</b></span></div></div><div class=\"lec-sent-ko\">다시 말하면 그것은 예술적으로 보이지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 &#39;평범함&#39;이 예술이라는 범주에서 벗어나 보인다는 사실을 부연 설명합니다. 예술 작품 특유의 복잡함이나 난해함이 느껴지지 않는다는 점을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In other words (관용표현): 앞의 내용을 다른 방식으로 다시 설명할 때 쓰는 연결어구.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">artistic</td><td class=\"m\">예술적인, 예술의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 주목할 만한 가치가 있다.</span><span class=\"en\"><b>is still <span class=\"grammar-hl\">worth paying attention to</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 여전히 주목할 만한 가치가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장들의 부정적인 인상을 반전시키는 문장입니다. 겉모습이 평범하다는 이유로 팝 아트를 무시해서는 안 된다는 글쓴이의 주장이 시작됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">worth paying attention to (관용표현): &#39;be worth + -ing(동명사)&#39; 구조로, &#39;~할 가치가 있다&#39;는 의미. 뒤의 to는 전치사로서 뒤에 attention이라는 명사가 목적어로 옴.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worth</td><td class=\"m\">~의 가치가 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 평범해 보일지라도</span><span class=\"en\"><b>Although it <span class=\"grammar-hl\">looks plain</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가득 차 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is filled with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미로.</span><span class=\"en\"><b>meaning.</b></span></div></div><div class=\"lec-sent-ko\">그것은 평범해 보일지라도 의미로 가득 차 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 겉과 속이 다르다는 점을 대비시키며 팝 아트를 깊이 있게 보아야 할 이유를 제시합니다. 시각적인 단순함 이면에 작가의 의도나 사회적 메시지가 담겨 있음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looks plain (현재분사): 현재분사는 아니지만, 감각동사 look 뒤에 형용사 보어(plain)를 취하는 2형식 구조.</div><div class=\"lec-gr-item\">is filled with (수동태): be동사(is)+p.p.(filled) 구조. fill은 타동사인데 목적어가 없어서 수동구조 is filled with 형태로 쓴다. 기본구조: fill A with B (A를 B로 채우다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plain</td><td class=\"m\">단순한, 평범한</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 취지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알아보자</span><span class=\"en\"><b><span class=\"grammar-hl\">Let's learn about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 유명한 팝 아트 예술가들에 대해.</span><span class=\"en\"><b>some famous pop artists.</b></span></div></div><div class=\"lec-sent-ko\">몇 명의 유명한 팝 아트 예술가들에 대해 알아보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 팝 아트의 가치를 구체적인 인물 사례를 통해 증명하기 위해 독자의 관심을 다음 단계로 유도하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let&#39;s learn about (관용표현): &#39;Let us + 동사원형&#39; 구조로, &#39;~하자&#39;라는 제안을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pop art</td><td class=\"m\">팝아트(대중예술)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명해졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">became famous</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 특별한 예술적 능력으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> their special artistic ability.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그들의 특별한 예술적 능력으로 유명해졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 유명 팝 아티스트들이 단순히 흔한 소재를 가져온 것이 아니라, 그것을 예술로 탈바꿈시키는 자신들만의 독창적인 재능을 갖추었음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became famous for (관용표현): &#39;~로 유명해지다&#39;라는 의미로 쓰이는 숙어적 표현.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artistic</td><td class=\"m\">예술적인, 예술의</td></tr><tr><td class=\"w\">artistic ability</td><td class=\"m\">예술적 재능, 예술적 역량</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔한 대상을 바꿀 수 있었다</span><span class=\"en\"><b>were <span class=\"grammar-hl\">able to change</span> common objects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 예술로.</span><span class=\"en\"><b>into amazing art.</b></span></div></div><div class=\"lec-sent-ko\">그들은 흔한 대상을 놀라운 예술로 바꿀 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;예술적 능력&#39;이 구체적으로 어떤 행위를 말하는지 보여줍니다. 일상의 사물을 예술의 영역으로 끌어올린 작가들의 작업 방식을 요약한 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">able to change (to부정사): 형용사 able을 수식하며, &#39;~할 수 있는&#39;이라는 의미를 갖는 형용사적 용법의 to부정사.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">common</td><td class=\"m\">흔한, 평범한</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 대상</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운, 굉장한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Andy Warhol은</span><span class=\"en\"><b>Andy Warhol</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불린다</span><span class=\"en\"><b><span class=\"grammar-hl\">is called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트의 왕이라고.</span><span class=\"en\"><b>the King of Pop Art.</b></span></div></div><div class=\"lec-sent-ko\">Andy Warhol은 팝 아트의 왕이라고 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팝 아트를 대표하는 구체적인 인물을 소개하며 논의의 범위를 좁히는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is called (수동태): be동사(is)+p.p.(called) 구조. call은 타동사인데 목적어가 없어서 수동구조 is called 형태로 쓴다. 기본구조: call A B (A를 B라고 부르다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pop art</td><td class=\"m\">팝아트(대중예술)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 소재를 찾았다</span><span class=\"en\"><b>found <span class=\"grammar-hl\">his subjects</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잡지와 상점에서.</span><span class=\"en\"><b>in magazines and stores.</b></span></div></div><div class=\"lec-sent-ko\">그는 잡지와 상점에서 그의 소재를 찾았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;일상적인 이미지&#39;가 구체적으로 어디서 유래했는지 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">his subjects (관용표현): 여기서는 &#39;주제&#39;나 &#39;대상&#39;이라는 의미로 사용됨.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 유명한 작품 중 하나는</span><span class=\"en\"><b>One of his famous works</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Marilyn Monroe의 사진들로 구성되어 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is made up of</span> pictures of Marilyn Monroe,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 배우인.</span><span class=\"en\"><b>the American actor.</b></span></div></div><div class=\"lec-sent-ko\">그의 유명한 작품 중 하나는 미국 배우인 Marilyn Monroe의 사진으로 구성되어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앤디 워홀의 예술적 시도를 보여주는 대표적인 예시입니다. 대중 스타라는 일상적이고 소비적인 대상을 예술적 소재로 활용했음을 알 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is made up of (수동태): be동사(is)+p.p.(made)+up of 구조. make up은 타동사인데 목적어가 없어서 수동구조 is made up of 형태로 쓴다. 기본구조: make up A (A를 구성하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 작품은</span><span class=\"en\"><b>Another work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여 준다</span><span class=\"en\"><b><span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수프 통조림들을.</span><span class=\"en\"><b><span class=\"grammar-hl\">cans of soup</span>.</b></span></div></div><div class=\"lec-sent-ko\">다른 작품은 수프 통조림들을 보여 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중 스타뿐만 아니라 아주 사소한 생필품조차 예술의 소재가 될 수 있음을 보여주는 두 번째 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows cans of soup 5형식 구조와 유사하게 보이나, 여기서는 cans of soup을 목적어로 취하는 3형식 타동사 show 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 복사본을 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made</span> many copies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 작품들의.</span><span class=\"en\"><b>of these works.</b></span></div></div><div class=\"lec-sent-ko\">그는 이 작품들의 복사본을 많이 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앤디 워홀이 단순한 창작을 넘어 &#39;대량 생산&#39;이라는 독특한 방식을 택했음을 밝히며 다음 문장의 의도를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made 5형식 구조: He(S) made(V) many copies(O) - 3형식 구조로 쓰였으며, 단순히 무언가를 만들었다는 의미.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b>Why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 복사본을 만들었을까</span><span class=\"en\"><b><span class=\"grammar-hl\">did he make</span> copies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 작품의?</span><span class=\"en\"><b>of his works?</b></span></div></div><div class=\"lec-sent-ko\">그는 왜 그의 작품의 복사본을 만들었을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 던짐으로써 독자가 팝 아트의 핵심 철학을 스스로 생각해보게 만드는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did he make 간접의문문이 아닌 직접의문문으로, 일반동사 make를 의문문으로 만들기 위해 대동사 did를 주어 앞에 위치시킴.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여 주길 원했다</span><span class=\"en\"><b>wanted to <span class=\"grammar-hl\">show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술이 어떤 것임을</span><span class=\"en\"><b><span class=\"grammar-hl\">that art is something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 매일 보는.</span><span class=\"en\"><b><span class=\"grammar-hl\">you see every day</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 예술이 당신이 매일 보는 것임을 보여 주고 싶었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앤디 워홀의 예술적 목적을 정리하는 결론부입니다. 예술이 미술관에 박제된 것이 아니라 우리 삶의 일부분임을 증명하려 했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">show that art is something you see every day (관계대명사): something 뒤에 목적격 관계대명사 that/which가 생략되어 있으며, you see every day가 something을 수식함. 관계대명사 뒤에는 목적어가 빠진 불완전한 절이 옴.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>팝 아트는 일상의 사물을 사용하여 평범해 보이지만 깊은 의미를 담고 있다.</li><li>앤디 워홀을 비롯한 팝 아티스트들은 일상적 소재를 예술로 승화시키는 독창적인 능력을 갖추었다.</li><li>앤디 워홀은 작품을 복제하는 방식을 통해 예술이 우리 일상과 아주 가까운 곳에 있음을 증명하려 했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Pop art appears plain due to its use of common imagery, yet it holds deep significance by transforming everyday items into extraordinary art.</div>\n              <div class=\"lec-final-sum-ko\">팝아트는 흔한 이미지를 사용하여 평범해 보이지만, 일상적인 사물을 특별한 예술로 변화시킴으로써 깊은 의미를 지닌다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16
