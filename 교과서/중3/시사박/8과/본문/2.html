</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 8과 본문2","audioDir":"2_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Pop Art: Plain Look, Deep Meaning\u003c/h1>\u003ch2>팝아트: 평범한 겉모습, 깊은 의미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>팝아트는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b> 때문에 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보이지만\u003c/b> \u003cb class=\"key\">의미로 \u003c/b>\u003cb class=\"key\">가득\u003c/b> 차 있다. \u003cb class=\"key\">앤디 \u003c/b>\u003cb class=\"key\">워홀\u003c/b>은 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">예술\u003c/b>로 바꾸어, 예술이 \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것\u003c/b>임을 보여 주었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Although pop art uses common images, it is worth paying attention to because it is filled with meaning and shows art in everyday objects.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 시사 박 교과서의 팝아트 본문을 함께 공부해요. 이 지문은 팝아트가 겉으로는 평범해 보이지만 그 안에 의미가 가득하다는 내용을 담고 있어요. 핵심 요지는 Pop art may look plain, but it is filled with meaning and shows art in everyday objects 입니다. 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">팝아트(Pop Art)는 1950년대와 1960년대 미국과 영국에서 등장한 미술 사조예요. 광고, 만화, 유명인 사진 같은 \u003cb class=\"key\">대중문화\u003c/b>와 \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 작품에 직접 사용했어요. 기존의 고급 예술(fine art)과 달리, 팝아트는 일상 속 평범한 사물도 \u003cb class=\"key\">예술의 \u003c/b>\u003cb class=\"key\">소재\u003c/b>가 될 수 있다고 보았죠. 마치 평소 무심코 지나치던 길가의 \u003cb class=\"key\">간판\u003c/b>이나 \u003cb class=\"key\">수프 \u003c/b>\u003cb class=\"key\">통조림\u003c/b>도 누군가의 눈에는 이야기가 담긴 그림처럼 보이는 것과 같아요. 앤디 워홀(Andy Warhol)은 실크스크린(silkscreen) 기법으로 같은 이미지를 대량으로 찍어 내며 \u003cb class=\"key\">복제\u003c/b>와 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">사회\u003c/b>를 예술로 표현했어요. 그의 Marilyn Monroe 작품은 화려한 스타의 이미지와 죽음이라는 주제를 동시에 담고 있어 더 깊이 읽을 수 있죠.\u003c/div>","segs":[{"n":2,"text":"팝아트는 영어로 Pop Art라고 하는데, 지금으로부터 수십 년 전 미국과 영국에서 크게 유행한 미술 사조예요. 광고, 만화, 유명인 사진 같은 대중문화와 상업적 이미지를 예술 작품에 직접 가져와서 사용했죠. 기존의 고급 예술인 fine art과 달리, 팝아트는 일상 속 평범한 사물도 훌륭한 예술의 소재가 될 수 있다고 보았어요. 마치 평소에 길에서 무심코 지나치던 간판이나 수프 통조림도 누군가의 눈에는 이야기가 담긴 그림처럼 보이는 것과 같아요. 앤디 워홀은 Andy Warhol이라고 쓰는데, silkscreen 기법으로 같은 이미지를 대량으로 찍어 내면서 복제와 소비 사회를 예술로 표현했어요. 그의 Marilyn Monroe 작품은 화려한 스타 이미지와 삶과 죽음이라는 무거운 주제를 함께 담고 있어서 더 깊이 읽을 수 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>팝아트에 대한 첫인상\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장에서 팝아트는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 사용하기 때문에 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보인다\u003c/b>고 말합니다. 흔한 이미지란 광고나 일상 사물처럼 우리 주변에서 쉽게 볼 수 있는 그림이나 사진을 뜻해요. 두 번째 문장은 \u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">other \u003c/b>\u003cb class=\"key\">words\u003c/b>라는 표현으로 같은 말을 다시 바꿔서, 팝아트가 \u003cb class=\"key\">예술적으로 \u003c/b>\u003cb class=\"key\">보이지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 점을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반전: 숨은 의미\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>하지만 팝아트는 여전히 \u003cb class=\"key\">주목할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 있다는 말로 방향을 바꿉니다. 겉으로는 평범해 보일지라도, 팝아트는 \u003cb class=\"key\">의미로 \u003c/b>\u003cb class=\"key\">가득 \u003c/b>\u003cb class=\"key\">차 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 것이 핵심 주장입니다. \u003cb class=\"key\">Although\u003c/b>는 겉모습과 실제 내용의 대조를 보여 주는 신호예요. 여기서 이 글의 \u003cb class=\"key\">두괄식\u003c/b> 주제가 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>팝아트 예술가들\u003csmall>주장·예시 도입 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>이제 유명한 \u003cb class=\"key\">팝아트 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>들을 예로 들어 주장을 뒷받침합니다. 그들은 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>으로 유명해졌고, \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">예술\u003c/b>로 바꾸는 재주가 있었어요. 그중 앤디 워홀은 \u003cb class=\"key\">팝아트의 \u003c/b>\u003cb class=\"key\">왕\u003c/b>이라 불릴 만큼 대표적인 인물입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>워홀의 작품\u003csmall>예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>워홀은 \u003cb class=\"key\">잡지\u003c/b>와 \u003cb class=\"key\">상점\u003c/b>에서 작품 소재를 찾았어요. 대표작에는 미국 배우 \u003cb class=\"key\">마릴린 \u003c/b>\u003cb class=\"key\">먼로\u003c/b>의 사진을 배열한 작품과 \u003cb class=\"key\">수프 \u003c/b>\u003cb class=\"key\">통조림\u003c/b>을 그린 작품이 있습니다. 그는 이 작품들을 \u003cb class=\"key\">복사본\u003c/b>으로 많이 만들었습니다. 이 대량 복제는 예술과 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">사회\u003c/b>를 연결하는 중요한 장치입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>복사본을 만든 이유\u003csmall>결론 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>마지막으로 글은 스스로 \u003cb class=\"key\">Why\u003c/b>라는 질문을 던집니다. 워홀이 왜 작품 복사본을 많이 만들었는지 답하면서, 그는 예술이 \u003cb class=\"key\">당신이 \u003c/b>\u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라는 점을 보여 주고 싶었다고 설명해요. 결국 팝아트의 \u003cb class=\"key\">주제\u003c/b>는 일상 속 예술의 발견으로 이어집니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 팝아트에 대한 첫인상이에요. 팝아트는 common images, 즉 흔한 이미지를 사용해서 plain, 평범해 보인다고 지문은 말해요. 다시 말해, 두 번째 문장에서 In other words라고 하면서 artistic하지 않다고 재진술을 해 줘요. 그래서 독자들은 팝아트가 평범하고 일상적인 것 같다는 인상을 먼저 받게 되죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 이 글의 중요한 전환이에요. But이 나오면서 팝아트가 여전히 worth paying attention to, 다시 말해 주목할 만한 가치가 있다고 방향을 바꿔요. Although를 써서 겉으로는 평범해 보일지라도 filled with meaning, 의미로 가득 차 있다는 사실을 강조하죠. 이 부분이 이 글의 핵심 주장이랍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 유명한 팝아트 예술가들을 예로 들어요. 그들은 special artistic ability, 특별한 예술적 능력으로 유명해졌고, common objects, 흔한 대상을 amazing art, 놀라운 예술로 바꿀 수 있었어요. 특히 Andy Warhol은 the King of Pop Art, 팝아트의 왕이라고 불릴 만한 인물이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 Andy Warhol의 작품 세계에요. 그는 magazines와 stores, 잡지와 상점에서 subjects, 소재를 찾았죠. 대표작 하나는 미국 배우 Marilyn Monroe의 pictures, 사진으로 구성되어 있고, 다른 작품은 cans of soup, 수프 통조림을 보여 줘요. 그리고 그는 이 작품들의 copies, 복사본을 많이 만들었답니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계는 복사본을 만든 이유예요. 지문은 Why did he make copies of his works라는 질문을 던지고 스스로 답해요. Andy Warhol은 예술이 you see every day, 매일 보는 것이라는 점을 보여 주고 싶었어요. 결국 팝아트는 일상 속에서 예술을 발견하도록 돕는 장르라는 뜻이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 팝아트가 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보인다\u003c/b>는 \u003cb class=\"key\">통념\u003c/b>을 제시한 뒤, \u003cb class=\"key\">But\u003c/b>과 \u003cb class=\"key\">Although\u003c/b>로 방향을 바꿔 실제로는 \u003cb class=\"key\">의미로 \u003c/b>\u003cb class=\"key\">가득 \u003c/b>\u003cb class=\"key\">차 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 \u003cb class=\"key\">주장\u003c/b>을 내세운다. 그런 다음 앤디 워홀의 \u003cb class=\"key\">예시\u003c/b>를 들어 주장을 뒷받침한다. 따라서 \u003cb class=\"key\">두괄식\u003c/b> 구조로, 앞부분에서 핵심 주장이 먼저 나오고 뒤에서 예시를 드는 방식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In other words (2)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Although (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Why (13)\u003c/b>\u003cspan>질문\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">common images\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">plain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">doesn't look artistic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">common objects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">art is something you see every day\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>평범한 겉모습\u003c/th>\u003cth>실제 의미\u003c/th>\u003c/tr>\u003ctr>\u003ctd>흔한 이미지 사용\u003c/td>\u003ctd>의미로 가득 참\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예술적으로 보이지 않음\u003c/td>\u003ctd>주목할 만한 가치 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 구조는 통념을 제시한 뒤 이를 반박하는 통념 반박 전개예요. 앞부분에서 팝아트가 평범해 보인다는 통념을 말하고, But과 Although로 이어지는 부분에서 실제로는 의미로 가득 차 있다는 주장을 밝혀요. 이 주장이 앞부분에 위치하므로 두괄식 구조로 볼 수 있어요. 뒤이어 Andy Warhol의 예시가 주장을 뒷받침하죠.","hl":"ty"},{"n":10,"text":"신호어를 정리해 볼게요. 두 번째 문장의 In other words는 앞에서 말한 내용을 다른 표현으로 다시 말해 주는 재진술 신호예요. 세 번째 문장의 But은 흐름을 전환시키고, 네 번째 문장의 Although는 겉모습과 실제 의미를 대조해 주죠. 열세 번째 문장의 Why는 질문을 던져 뒤에 답이 따라오는 구조를 알려 줘요. 또한 plain과 doesn't look artistic, common objects처럼 같은 의미를 여러 표현으로 바꿔 말하고 있다는 점도 눈여겨봐야 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흔한\u003c/span>\u003c/div>\u003cdiv>\u003cb>image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이미지\u003c/span>\u003c/div>\u003cdiv>\u003cb>pop art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팝아트\u003c/span>\u003c/div>\u003cdiv>\u003cb>plain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평범한\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>artistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예술적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>worth\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~할 가치가 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay attention to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 주목하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>be filled with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 가득 차다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 배우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change A into B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>subject\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소재, 주제\u003c/span>\u003c/div>\u003cdiv>\u003cb>magazine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잡지\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상점\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made up of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 구성되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사진, 그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>can\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캔, 통조림\u003c/span>\u003c/div>\u003cdiv>\u003cb>soup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수프\u003c/span>\u003c/div>\u003cdiv>\u003cb>copy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복사본\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술\u003c/span>\u003c/div>\u003cdiv>\u003cb>every day\u003c/b>\u003cem>부사\u003c/em>\u003cspan>매일\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번 지문의 핵심 단어를 몇 개만 짚어 볼게요. common은 흔한, image는 이미지, plain은 평범한이라는 뜻이에요. in other words는 다시 말하면이라는 숙어이고, worth는 어떤 동작을 할 가치가 있다는 표현과 함께 쓰여요. pay attention to는 주목하다, be filled with는 가득 차다라는 뜻이죠. 작품을 뜻하는 work는 여기서 셀 수 있는 명사로 쓰였고, copy는 복사본이라는 뜻으로도 아주 자주 쓰여요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">plain\u003c/b>\u003cspan class=\"m\">평범한, 단순한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fancy\u003c/span>\u003cspan class=\"a\">elaborate\u003c/span>\u003cspan class=\"a\">artistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">흔한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">everyday\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">unique\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">artistic\u003c/b>\u003cspan class=\"m\">예술적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">creative\u003c/span>\u003cspan class=\"s\">aesthetic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">inartistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">normal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"s\">incredible\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003cspan class=\"a\">unremarkable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 둘게요. plain은 simple이나 ordinary와 동의어이고 반대말로 fancy나 elaborate를 생각할 수 있어요. common은 ordinary, usual과 가깝고 반대말은 rare, unique, special이에요. artistic은 creative, aesthetic과 같은 방향이고 반대말은 plain, ordinary가 되죠. famous는 well known, celebrated와 같은 뜻이고 반대말은 unknown, obscure예요. special은 particular, unique와 가깝고 반대말로 ordinary, common, normal을 기억하면 돼요. amazing은 astonishing, incredible과 동의어이고 반대말은 ordinary, unremarkable이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔한 이미지를 사용하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Using \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003cspan class=\"tgt\">images\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트는 평범해 보인다\u003c/span>\u003cspan class=\"en\">pop art \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">plain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">흔한 이미지를 사용하기 때문에 팝 아트는 평범해 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트가 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 사용해서 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보인다\u003c/b>고 말하며, 뒤에 이어질 반전의 출발점을 만든다. 'Using common images'는 이유를 나타내는 \u003cb class=\"key\">분사구문\u003c/b>이고, 'looks plain'은 '보인다'는 \u003cb class=\"key\">감각동사+형용사\u003c/b> 구조이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (부사적 용법 - 이유)\u003c/span> : Using [common images] ~, 주어 + 동사 : \"흔한 이미지를 사용하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사 (주격보어)\u003c/span> : 주어 + look + 형용사(주격보어) : \"평범해 보인다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Using common images, 흔한 이미지를 사용하기 때문에. pop art looks plain, 팝 아트는 평범해 보인다. 이 문장 전체를 해석하면, 흔한 이미지를 사용하기 때문에 팝 아트는 평범해 보인다.","hl":"m"},{"n":14,"text":"이 문장은 팝 아트가 흔한 이미지를 사용해서 평범해 보인다고 말해요. 하지만 이건 글의 도입일 뿐이고, 뒤에서 예술적 의미가 있다고 반전을 준비하는 역할이죠. Using common images처럼 현재분사로 시작하면 이유를 나타낼 수 있다는 점을 기억해 두세요.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 문장 앞에 나온 Using common images라는 분사구문이에요. 주어 pop art가 스스로 사용하는 능동 관계이므로 현재분사 Using을 썼고, 왜 평범해 보이는지 이유를 나타내요. 두 번째 포인트는 looks plain인데요, look은 보이다라는 감각동사이고 뒤에 형용사 plain이 와서 주어를 설명해 줘요. 감각동사 뒤에는 부사가 아니라 형용사가 온다는 점을 꼭 잡아 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말하면\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 예술적으로 보이지 않는다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">artistic\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말하면 그것은 예술적으로 보이지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 plain을 \u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">other \u003c/b>\u003cb class=\"key\">words\u003c/b>로 다시 설명한다. 즉 평범해 보인다는 것은 \u003cb class=\"key\">예술적으로 \u003c/b>\u003cb class=\"key\">보이지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 뜻이다. plain과 artistic을 대비시켜 팝 아트가 예술처럼 보이지 않는다는 점을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사 (부정문)\u003c/span> : 주어 + doesn't + look + 형용사 : \"예술적으로 보이지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"In other words, 다시 말하면. it doesn't look artistic, 그것은 예술적으로 보이지 않는다. 이 문장 전체를 해석하면, 다시 말하면 그것은 예술적으로 보이지 않는다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 plain을 다른 말로 바꾼 표현이에요. In other words는 앞 내용을 다시 설명할 때 쓰는 연결 표현이고, 평범해 보인다는 건 곧 예술적으로 보이지 않는다는 뜻이죠. 결국 팝 아트가 예술처럼 안 보인다는 점을 강조해요.","hl":"mn"},{"n":18,"text":"여기서 볼 어법은 doesn't look artistic 부분이에요. look은 보이다라는 감각동사라서 뒤에 형용사 artistic이 와요. doesn't는 일반동사를 부정할 때 쓰는 조동사이고, 조동사 뒤에는 반드시 동사원형 look이 온다는 점도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여전히 가치가 있다\u003c/span>\u003cspan class=\"en\">it is still \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worth \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주목할 만한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">paying \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 여전히 주목할 만한 가치가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 평범해 보여도 무시할 수 없다는 \u003cb class=\"key\">반전\u003c/b>의 핵심이다. \u003cb class=\"key\">still\u003c/b>은 앞의 부정적인 내용에도 불구하고 가치는 여전하다는 의미를 더한다. \u003cb class=\"key\">worth \u003c/b>\u003cb class=\"key\">paying \u003c/b>\u003cb class=\"key\">attention \u003c/b>\u003cb class=\"key\">to\u003c/b>는 '주목할 만한 가치가 있다'는 뜻으로 이 글의 중심 태도이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be worth + 동명사\u003c/span> : be worth + [paying attention to (동명사구)] : \"주목할 만한 가치가 있다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"But, 하지만. it is still worth, 그것은 여전히 가치가 있다. paying attention to, 주목할 만한. 이 문장 전체를 해석하면, 하지만 여전히 주목할 만한 가치가 있다.","hl":"m"},{"n":20,"text":"이 문장은 팝 아트가 평범해 보여도 무시할 수 없다는 반전의 핵심이에요. worth paying attention to는 주목할 가치가 있다는 뜻이고, still은 그런 단점에도 불구하고 가치는 여전하다는 의미를 더해 줘요. 앞의 두 문장과 대조되는 흐름을 만들어 주죠.","hl":"mn"},{"n":21,"text":"문법 포인트는 worth paying attention to입니다. worth는 가치가 있다는 뜻의 형용사인데, 뒤에 동명사 paying이 왔어요. be worth 뒤에는 동명사를 써서 ~할 가치가 있다고 해석하고, paying의 목적어는 attention이에요. 주목할 만한 가치가 있다는 표현으로 통째로 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그것이 평범해 보이지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">plain\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가득 차 있다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">filled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">meaning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 평범해 보일지라도 의미로 가득 차 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 팝아트가 주목할 가치가 있다는 이유를 설명해요. 겉모습은 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보이지만\u003c/b> 그 안에는 \u003cb class=\"key\">의미\u003c/b>가 \u003cb class=\"key\">가득 \u003c/b>\u003cb class=\"key\">차 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 대조를 통해 팝아트의 진짜 가치를 강조해요. although가 이끄는 양보절과 주절이 대조되면서 보이는 것과 담긴 것이 다르다는 점을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 although (양보)\u003c/span> : Although + 주어 + 동사, 주어 + 동사 : \"비록 그것이 평범해 보이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 be filled with\u003c/span> : be filled with + 명사 : \"의미로 가득 차 있다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Although it looks plain, 비록 그것이 평범해 보이지만. it is filled, 그것은 가득 차 있다. with meaning, 의미로. 이 문장 전체를 해석하면, 그것은 평범해 보일지라도 의미로 가득 차 있다.","hl":"m"},{"n":23,"text":"이 문장은 팝아트가 겉으로는 평범해 보여도 그 안에 의미가 가득 차 있다는 걸 알려 줘요. 앞에서 팝아트가 주목할 가치가 있다고 했는데, 그 이유를 이 문장이 설명해 주는 거예요. 평범해 보이는 것과 의미로 가득 차 있다는 것이 서로 대조되면서 팝아트의 진짜 가치를 강조하고 있어요.","hl":"mn"},{"n":24,"text":"여기서 첫 번째 어법 포인트는 although예요. although는 비록 이지만이라는 뜻의 양보 접속사라서 뒤에 절이 오고, 주절과 대조되는 의미를 만들어 줘요. 두 번째 어법 포인트는 is filled with meaning이에요. fill A with B가 A를 B로 채우다라는 능동태인데, 수동태 be filled with가 되면 A가 B로 가득 차다라는 상태를 나타내요. 그래서 it is filled with meaning은 그것이 의미로 가득 차 있다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대해 알아보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 유명한 팝 아트 예술가들을\u003c/span>\u003cspan class=\"en\">some famous pop artists.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 명의 유명한 팝 아트 예술가들에 대해 알아보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지금까지의 일반적인 팝아트 설명에서 벗어나 구체적인 예술가들로 화제를 전환해요. Let's learn about은 단순한 지식 전달이 아니라 함께 알아보자고 \u003cb class=\"key\">제안\u003c/b>하며 독자의 흥미를 불러일으켜요. 이 문장 이후에 앤디 워홀 등의 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>들이 소개될 거라는 예고 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Let's + 동사원형 (제안)\u003c/span> : Let's + 동사원형 + ... : \"~하자\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Let's learn about, ~에 대해 알아보자. some famous pop artists, 몇몇 유명한 팝 아트 예술가들을. 이 문장 전체를 해석하면, 몇 명의 유명한 팝 아트 예술가들에 대해 알아보자.","hl":"m"},{"n":26,"text":"이 문장은 이제 구체적인 예술가들을 소개하겠다는 전환 신호예요. Let's learn about은 함께 알아보자고 제안하는 표현이라서 독자가 글에 더 관심을 가지게 만들어요. 앞으로 유명한 팝 아트 예술가들이 누구인지 소개될 거라는 예고를 해 주는 역할을 해요.","hl":"mn"},{"n":27,"text":"이 문장에서 중요한 어법은 Let's learn이에요. Let's는 Let us의 줄임말로, 상대방에게 함께 무엇을 하자고 제안하는 표현이죠. 뒤에는 반드시 동사원형이 와요. 그래서 learn이라는 동사원형이 온 거예요. 이렇게 Let's 다음에 동사원형을 쓰는 제안문을 청유문이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 유명해졌다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">famous\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 특별한 예술적 능력으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">artistic \u003c/span>\u003cspan class=\"tgt\">ability\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그들의 특별한 예술적 능력으로 유명해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 소개하기로 한 유명한 팝 아티스트들이 왜 유명해졌는지 이유를 제시해요. their special artistic ability는 평범한 대상을 놀라운 예술로 바꾸는 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 가리켜요. became famous for는 '\u003cb class=\"key\">~로 \u003c/b>\u003cb class=\"key\">유명해졌다\u003c/b>'라는 뜻으로, 이어질 예술가들의 공통된 특징을 미리 정리해 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">become + 형용사 (2형식 연결동사)\u003c/span> : become + 형용사(주격 보어) : \"유명해졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (이유·원인)\u003c/span> : for + 명사구 : \"그들의 특별한 예술적 능력 때문에\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They became famous, 그들은 유명해졌다. for their special artistic ability, 그들의 특별한 예술적 능력으로. 이 문장 전체를 해석하면, 그들은 그들의 특별한 예술적 능력으로 유명해졌다.","hl":"m"},{"n":29,"text":"이 문장은 유명한 팝 아트 예술가들이 왜 유명해졌는지 그 이유를 설명해 줘요. 그들은 평범한 대상을 놀라운 예술로 바꾸는 특별한 예술적 능력으로 유명해졌다는 거예요. 앞으로 소개될 예술가들의 공통된 특징을 미리 정리해 주는 역할을 해요.","hl":"mn"},{"n":30,"text":"여기서 첫 번째로 볼 어법은 became famous예요. become은 무엇이 되다라는 뜻의 불완전자동사인데, 뒤에 형용사 famous가 주격 보어로 와서 주어의 상태 변화를 나타내요. 두 번째로 for their special artistic ability에서 for는 이유를 나타내는 전치사예요. 그래서 for 다음에 명사구가 와서 그들이 유명해진 이유를 설명해 주죠. 이렇게 become 다음에 형용사가 오는 점과 for가 이유를 나타내는 점을 함께 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~할 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔한 대상을 바꾸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">change\u003c/span> common objects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 예술로.\u003c/span>\u003cspan class=\"en\">into amazing art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 흔한 대상을 놀라운 예술로 바꿀 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아티스트들의 특별한 능력을 구체적으로 설명합니다. 흔한 대상을 놀라운 예술로 바꿀 수 있었다는 것은 그들이 평범한 것을 예술로 탈바꿈시키는 \u003cb class=\"key\">변형 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 보여줍니다. 앞 문장의 special artistic ability를 부연하며, 팝 아트의 특징인 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">소재의 \u003c/b>\u003cb class=\"key\">예술화\u003c/b>를 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be able to 동사원형 (과거 능력)\u003c/span> : were able to change = be동사(과거) + able to + 동사원형 : \"~할 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"They, 그들은. were able to, ~할 수 있었다. change common objects, 흔한 대상을 바꾸다. into amazing art, 놀라운 예술로.. 이 문장 전체를 해석하면, 그들은 흔한 대상을 놀라운 예술로 바꿀 수 있었다.","hl":"m"},{"n":32,"text":"이 문장은 팝 아티스트들의 특별한 능력을 구체적으로 설명해요. 흔한 대상을 놀라운 예술로 바꿀 수 있었다는 것은 그들이 평범한 것을 예술로 탈바꿈시키는 변형 능력을 보여준다는 뜻이에요. 팝 아트의 특징인 일상적 소재의 예술화를 드러내는 문장이에요.","hl":"mn"},{"n":33,"text":"이 문장의 어법 포인트는 be able to 동사원형이에요. were able to change에서 were able to는 할 수 있었다는 능력을 나타내고, able to 뒤에는 동사원형 change가 왔어요. be able to는 can과 비슷하지만 시제를 자유롭게 표현할 수 있어서 여기서는 과거 능력을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Andy Warhol은\u003c/span>\u003cspan class=\"en\">Andy Warhol\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 불린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트의 왕이라고.\u003c/span>\u003cspan class=\"en\">the King of Pop Art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Andy Warhol은 팝 아트의 왕이라고 불린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Andy Warhol을 팝 아트의 왕으로 소개합니다. 팝 아트의 왕이라는 별칭은 그가 이 분야에서 가장 유명하고 영향력 있는 인물임을 나타냅니다. 뒤에 이어질 그의 작품과 소재 설명을 위한 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : is called = be동사(is) + 과거분사(called) : \"~라고 불린다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Andy Warhol, Andy Warhol은. is called, ~라고 불린다. the King of Pop Art, 팝 아트의 왕이라고.. 이 문장 전체를 해석하면, Andy Warhol은 팝 아트의 왕이라고 불린다.","hl":"m"},{"n":35,"text":"이 문장은 Andy Warhol을 팝 아트의 왕으로 소개해요. 팝 아트의 왕이라는 별칭은 그가 이 분야에서 가장 유명하고 영향력 있는 인물이라는 뜻이에요. 뒤에 나올 작품 설명을 위한 도입 문장이에요.","hl":"mn"},{"n":36,"text":"이 문장의 어법 포인트는 수동태예요. is called는 be동사 is와 과거분사 called로 이루어진 수동태로, 사람들이 Andy Warhol을 팝 아트의 왕이라고 부른다는 능동태 문장이 수동태로 바뀐 거예요. 행위자가 중요하지 않아서 생략되었어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 소재를 찾았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">subjects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잡지와 상점에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">magazines \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">stores\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 잡지와 상점에서 그의 소재를 찾았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Andy Warhol이 작품 소재를 어디에서 찾았는지 보여줍니다. 잡지와 상점처럼 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">공간\u003c/b>에서 소재를 찾았다는 점이 팝 아트의 특징을 잘 드러냅니다. 고급 예술이 아니라 \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 활용한다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">find A in B 구문\u003c/span> : found his subjects in magazines and stores = find [his subjects] in [magazines and stores] : \"그의 소재를 잡지와 상점에서 찾았다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"He, 그는. found his subjects, 그의 소재를 찾았다. in magazines and stores, 잡지와 상점에서.. 이 문장 전체를 해석하면, 그는 잡지와 상점에서 그의 소재를 찾았다.","hl":"m"},{"n":38,"text":"이 문장은 Andy Warhol이 작품 소재를 어디에서 찾았는지 보여줘요. 잡지와 상점처럼 일상적인 공간에서 소재를 찾았다는 점이 팝 아트의 특징을 잘 드러내요. 고급 예술이 아니라 상업적 이미지를 활용한다는 의미예요.","hl":"mn"},{"n":39,"text":"이 문장의 어법 포인트는 find A in B 구문이에요. found his subjects in magazines and stores에서 found는 찾았다는 타동사이고 his subjects가 목적어, in magazines and stores가 장소를 나타내는 전치사구예요. A를 B에서 찾다로 묶어서 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 유명한 작품 중 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구성되어 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Marilyn Monroe의 사진으로\u003c/span>\u003cspan class=\"en\">pictures of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Marilyn \u003c/span>\u003cspan class=\"tgt\">Monroe, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 배우인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">American \u003c/span>\u003cspan class=\"tgt\">actor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 유명한 작품 중 하나는 미국 배우인 Marilyn Monroe의 사진으로 구성되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앤디 워홀의 대표작 중 하나가 마릴린 먼로의 사진으로 이루어져 있다는 뜻이다. 여기서 the American actor는 마릴린 먼로가 미국 배우라는 것을 덧붙여 설명하는 \u003cb class=\"key\">동격\u003c/b>이다. 흔한 대중문화 속 인물도 예술 작품의 소재가 될 수 있음을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 복수명사\u003c/span> : One of + [복수명사] + [단수동사] : \"그의 유명한 작품 중 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 3c/b>\u003cb class=\"key\">소재\u003c/b>이다. 워홀은 평범한 물건을 예술 작품으로 승화시켰다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">another + 단수명사\u003c/span> : another + [단수명사] : \"또 다른 작품은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3인칭 단수 현재형\u003c/span> : 주어(3인칭 단수) + [동사원형 + -s] : \"보여 준다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Another work, 다른 작품은. shows, 보여 준다. cans of soup, 수프 통조림들을. 이 문장 전체를 해석하면, 다른 작품은 수프 통조림들을 보여 준다.","hl":"m"},{"n":44,"text":"이 문장은 앤디 워홀의 또 다른 대표작이 수프 캔을 그린 작품이라는 뜻이에요. 수프 통조림은 마트에서 흔히 볼 수 있는 일상적인 물건인데, 워홀은 그런 평범한 대상을 작품 소재로 삼았어요. 그래서 흔한 이미지도 예술이 될 수 있다는 팝아트의 특징을 보여 줘요.","hl":"mn"},{"n":45,"text":"첫 번째 어법 포인트는 another예요. another는 또 다른 하나라는 뜻으로 뒤에 단수 명사가 와요. 그래서 another work라고 쓰고 동사도 단수인 shows가 오죠. 두 번째 어법 포인트는 shows예요. 주어가 another work로 단수이기 때문에 동사 show에 s를 붙여서 shows라고 해야 해요. 영어에서는 주어가 삼인칭 단수일 때 동사에 s를 붙인다는 것 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 만들었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 복사본을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">copies \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 작품들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> these works.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 이 작품들의 복사본을 많이 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 워홀이 앞서 소개한 마릴린 먼로 작품과 수프 캔 작품을 여러 개 복제했다는 뜻이다. 그는 원본 하나만 남기지 않고 똑같은 작품을 \u003cb class=\"key\">대량생산\u003c/b>했다. 이 복제 행위에는 예술 작품도 일상의 물건처럼 복제될 수 있다는 메시지가 담겨 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">make copies of\u003c/span> : make + [copies] + of + [대상] : \"~의 복사본을 만들다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"He made, 그는 만들었다. many copies, 많은 복사본을. of these works, 이 작품들의. 이 문장 전체를 해석하면, 그는 이 작품들의 복사본을 많이 만들었다.","hl":"m"},{"n":47,"text":"이 문장은 워홀이 방금 소개한 마릴린 먼로 작품과 수프 캔 작품을 여러 개 복제했다는 뜻이에요. 그가 원본 하나만 남긴 게 아니라 똑같은 작품을 대량으로 찍어냈다는 거예요. 이 복제 행위에는 예술 작품도 일상의 물건처럼 대량 생산될 수 있다는 메시지가 담겨 있어요.","hl":"mn"},{"n":48,"text":"첫 번째 어법 포인트는 make copies of에요. made many copies of에서 make copies of는 어떤 것의 복사본을 만든다는 뜻이고 made는 make의 과거형이에요. 이 문장에서는 뒤에 of these works가 와서 이 작품들의 복사본을 만들었다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 그는 복사본을 만들었을까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> copies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 작품들의?\u003c/span>\u003cspan class=\"en\">of his works?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 왜 그의 작품의 복사본을 만들었을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 바로 앞에서 워홀이 작품을 여러 장 복사했다는 내용을 받아 그 이유를 묻는 의문문이에요. 독자에게 질문을 던져 다음 문장의 답에 집중하게 하는 역할을 해요. \u003cb class=\"key\">Why\u003c/b>는 이유를 묻는 의문사이고, \u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">copies\u003c/b>는 복사본을 만들다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제 의문문 (의문사 Why + did + 주어 + 동사원형)\u003c/span> : Why + did + 주어 + 동사원형 ~? : \"왜 그가 만들었을까?\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Why did he make copies, 왜 그는 복사본을 만들었을까요. of his works?, 그의 작품들의?. 이 문장 전체를 해석하면, 그는 왜 그의 작품의 복사본을 만들었을까?","hl":"m"},{"n":50,"text":"이 문장은 앞에서 워홀이 작품을 여러 장 복사했다는 내용을 받아서, 왜 복사본을 만들었는지 독자에게 질문을 던지는 역할을 해요. Why는 이유를 묻는 의문사이고, make copies는 복사본을 만들다는 뜻이에요. 이 질문을 통해 다음 문장에 나올 답에 집중하게 됩니다.","hl":"mn"},{"n":51,"text":"이 문장은 Why로 시작하는 과거 시제 의문문이에요. 일반동사 과거 의문문은 did를 주어 앞에 쓰고, 동사는 make처럼 원형을 쓰는 것이 포인트예요. Why did he make는 왜 그가 만들었을까로 해석하고, 이유를 물어보는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 보여 주고 싶었어요\u003c/span>\u003cspan class=\"en\">He wanted \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술이 어떤 것이라는 것을\u003c/span>\u003cspan class=\"en\">that art is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 매일 보는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 예술이 당신이 매일 보는 것임을 보여 주고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 워홀이 복사본을 만든 이유, 즉 예술이 일상 속에 있다는 점을 보여 주고 싶었다는 답이에요. 앞선 질문에 대한 직접적인 답이면서 이 글의 핵심 메시지를 담고 있어요. \u003cb class=\"key\">you \u003c/b>\u003cb class=\"key\">see \u003c/b>\u003cb class=\"key\">every \u003c/b>\u003cb class=\"key\">day\u003c/b>가 당신이 매일 보는이라는 뜻으로, 예술이 특별한 것이 아니라 \u003cb class=\"key\">일상적\u003c/b>이라는 의미를 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + to부정사(목적어) : \"보여 주기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 something + (that/which) + 주어 + 동사 : \"당신이 매일 보는 것\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"He wanted to show, 그는 보여 주고 싶었어요. that art is something, 예술이 어떤 것이라는 것을. you see every day, 당신이 매일 보는. 이 문장 전체를 해석하면, 그는 예술이 당신이 매일 보는 것임을 보여 주고 싶었다.","hl":"m"},{"n":53,"text":"이 문장은 바로 앞 질문에 대한 답으로, 워홀이 복사본을 만든 이유를 알려줘요. 예술이 당신이 매일 보는 것이라는 점을 보여 주고 싶었다는 거예요. you see every day는 당신이 매일 보는이라는 뜻으로, 예술이 일상적이라는 메시지를 담고 있어요.","hl":"mn"},{"n":54,"text":"첫 번째 포인트는 to show예요. want는 to부정사를 목적어로 갖는 동사라서, wanted to show는 보여 주기를 원했다로 해석해요. 두 번째 포인트는 something you see every day예요. something 뒤에 목적격 관계대명사 that이나 which가 생략되어 있어요. you see every day가 something을 수식해서 당신이 매일 보는 것이라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>팝아트는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 사용하기 때문에 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보이지만\u003c/b>, 실제로는 \u003cb class=\"key\">의미로 \u003c/b>\u003cb class=\"key\">가득 \u003c/b>\u003cb class=\"key\">차 \u003c/b>\u003cb class=\"key\">있다\u003c/b>.\u003c/li>\u003cli>따라서 팝아트는 \u003cb class=\"key\">주목할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 있다.\u003c/li>\u003cli>앤디 워홀은 \u003cb class=\"key\">잡지\u003c/b>와 \u003cb class=\"key\">상점\u003c/b>의 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">예술\u003c/b>로 바꾸었다.\u003c/li>\u003cli>그가 작품 \u003cb class=\"key\">복사본\u003c/b>을 많이 만든 이유는 예술이 \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것\u003c/b>임을 보여 주기 위한 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Although pop art uses common images, it is worth paying attention to because it is filled with meaning and shows art in everyday objects.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">팝아트는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">이미지\u003c/b> 때문에 \u003cb class=\"key\">평범해 \u003c/b>\u003cb class=\"key\">보이지만\u003c/b> \u003cb class=\"key\">의미로 \u003c/b>\u003cb class=\"key\">가득\u003c/b> 차 있다. \u003cb class=\"key\">앤디 \u003c/b>\u003cb class=\"key\">워홀\u003c/b>은 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">예술\u003c/b>로 바꾸어, 예술이 \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것\u003c/b>임을 보여 주었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 지문을 정리해 볼게요. 팝아트는 흔한 이미지를 사용해서 겉으로는 평범해 보이지만 실제로는 의미로 가득 차 있어요. Andy Warhol은 잡지와 상점에서 흔한 소재를 찾아 놀라운 예술 작품으로 바꾸었고, 복사본을 많이 만들어 예술이 매일 보는 것임을 보여 주었죠. 이처럼 대조 신호어가 나오면 통념과 주장을 구분하고, 예시가 어떤 주장을 뒷받침하는지 함께 읽는 것이 중요해요. 오늘 수고 많았고 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
