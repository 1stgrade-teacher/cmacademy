DPIz39OfXkHg9KU/KDnk7T06kgHHY5GevaiK1W9rrW3mI/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Claes Oldenburg: Making Art Fun with Everyday Objects<small>클레스 올덴버그: 일상적인 사물로 예술을 즐겁게 만들기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 먼저 &#39;팝아트(Pop Art)&#39;라는 예술 사조를 이해하면 훨씬 흥미로울 거예요. 팝아트는 일상적인 소재를 예술로 끌어들여 대중이 미술을 더 쉽고 가깝게 즐길 수 있도록 만든 흐름인데, 마치 우리가 매일 먹는 햄버거나 일상 속 가전제품을 주인공으로 삼아 친숙함을 주는 것과 같답니다. 특히 지문에 등장하는 &#39;클래스 올덴버그(Claes Oldenburg)&#39;는 딱딱한 재료 대신 부드러운 천이나 비닐을 활용한 &#39;소프트 조각(Soft Sculpture)&#39; 기법을 선보여 고정관념을 뒤흔든 예술가로 유명해요. 그는 단순히 미술관 안에 작품을 가두는 대신, 대형 야외 조각이나 직접 운영하는 상점 등을 통해 예술과 일상의 경계를 허무는 시도를 했죠. 이 글을 통해 예술이 어떻게 어렵고 고귀한 것이 아닌, 우리 곁의 즐거운 상품이 될 수 있는지 그 독창적인 시각을 확인해 보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01올덴버그의 예술적 특징</div><ul><li>클레스 올덴버그는 일상적인 물건을 소재로 재미있는 작품을 만든 팝 아티스트입니다.</li><li>일상의 사물을 조각 작품으로 변형</li><li>햄버거, 쿠키, 붓 등 친숙한 소재 사용</li><li>핵심 키워드: 팝 아티스트(pop artist), 조각품(sculptures)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02초기 작품인 부드러운 조각</div><ul><li>활동 초기에는 부드러운 소재를 활용하여 고정관념을 깨는 조각품들을 제작했습니다.</li><li>플라스틱, 종이 등 부드러운 재료 사용</li><li>천(cloth)을 사용하여 변기 조각을 제작</li><li>핵심 키워드: 부드러운 조각(soft sculptures)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03후기 작품의 변화와 확장</div><ul><li>시간이 흐르면서 그는 일상의 물건을 거대한 크기의 조각으로 재탄생시켰습니다.</li><li>아이스크림 콘처럼 일상 사물을 거대하게 제작</li><li>예술의 규모를 키워 대중적인 시각적 재미 제공</li><li>핵심 키워드: 거대한 조각(huge sculptures)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04예술을 대하는 철학</div><ul><li>올덴버그는 자신의 작품이 많은 이들에게 즐거움을 주는 상품처럼 다가가길 원했습니다.</li><li>대중이 쉽게 즐기도록 야외에 작품 전시</li><li>스튜디오 안에 매장을 운영하여 작품 판매</li><li>예술을 즐거운 상품(fun goods)으로 정의</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">everyday</td><td class=\"m\">매일의, 일상의</td></tr><tr><td class=\"w\">in the beginning</td><td class=\"m\">처음에, 당초에</td></tr><tr><td class=\"w\">set up</td><td class=\"m\">~을 설치하다, ~을 마련하다</td></tr><tr><td class=\"w\">run</td><td class=\"m\">운영하다, 경영하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">클래스 올덴버그는</span><span class=\"en\"><b>Claes Oldenburg</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 팝 아트 예술가이다</span><span class=\"en\"><b>is another pop artist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술을 재미있게 만든</span><span class=\"en\"><b><span class=\"grammar-hl\">who made art fun</span>.</b></span></div></div><div class=\"lec-sent-ko\">Claes Oldenburg는 예술을 재미있게 만들었던 또 다른 팝 아트 예술가이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 다른 예술가들에 이어, 올덴버그라는 인물을 소개하며 그가 예술을 대하는 독특한 접근 방식을 제시하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who made art fun (관계대명사): 선행사 a pop artist를 수식하는 주격 관계대명사절. who 뒤에 주어 없이 동사 made가 바로 오는 구조로, made는 5형식(SVOC)으로 쓰여 art(O)를 fun(OC, 형용사)하게 만들었다는 의미를 전달함</div><div class=\"lec-gr-item\">made art fun (5형식(SVOC)): 동사 made가 5형식으로 사용되어 art(O)와 fun(OC, 목적격보어)의 구조를 이룸</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 조각품들을 만들었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">made</span> sculptures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상적인 물건들의</span><span class=\"en\"><b>of everyday items,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">햄버거, 쿠키, 그리고 붓과 같은</span><span class=\"en\"><b>such as a hamburger, cookies, and a brush.</b></span></div></div><div class=\"lec-sent-ko\">그는 햄버거와 쿠키, 붓 같은 일상적인 물건들의 조각품들을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;재미있는 예술&#39;에 대한 구체적인 예시입니다. 낯설고 어려운 예술 소재 대신, 누구나 아는 친숙한 물건을 작품의 대상으로 삼았음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made (관용표현): &#39;make sculptures of ~&#39; 구조로 &#39;~의 조각품을 만들다&#39;라는 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">everyday</td><td class=\"m\">매일의, 일상의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에,</span><span class=\"en\"><b><span class=\"grammar-hl\">In the beginning</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 만들었다</span><span class=\"en\"><b>he created</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부드러운 조각품들을</span><span class=\"en\"><b>soft sculptures.</b></span></div></div><div class=\"lec-sent-ko\">맨 처음에 그는 부드러운 조각품들을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 작품 활동 초기 단계를 설명합니다. 딱딱하고 무거운 기존 조각의 고정관념을 깨고 말랑한 재질을 선택한 그의 창의적 시도를 다룹니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In the beginning (관용표현): &#39;처음에/당초에&#39;를 뜻하는 시간 부사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the beginning</td><td class=\"m\">처음에, 당초에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 만들어졌다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">were made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱, 종이, 그리고 다른 부드러운 재료들로</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> plastic, paper, and other soft materials.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 플라스틱, 종이, 그리고 다른 부드러운 재료들로 만들어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;부드러운 조각&#39;이 어떤 재료로 구성되었는지 상세히 설명하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were made of (수동태): be동사(were)+p.p.(made) 구조. make는 타동사인데 목적어가 없어 수동구조 were made 형태로 쓰임. 기본구조: make A (out) of B(B로 A를 만들다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 천을 사용했다</span><span class=\"en\"><b>he used cloth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변기를 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> toilets.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어서, 그는 변기를 만들기 위해 천을 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단단한 도기 재질인 변기를 부드러운 천으로 재현한 구체적인 사례를 통해, 사물의 속성을 뒤집어 대중에게 즐거움을 주려 한 그의 의도를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make (to부정사): 목적을 나타내는 부사적 용법으로 &#39;~하기 위해&#39;라고 해석하며, 뒤에 목적어 toilets를 취함</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에,</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 거대한 조각품들을 만들었다</span><span class=\"en\"><b>he made huge sculptures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상 물건들의</span><span class=\"en\"><b>of daily items,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이스크림콘과 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> an ice cream cone.</b></span></div></div><div class=\"lec-sent-ko\">나중에 그는 아이스크림콘 같은 일상 물건의 거대한 조각품들을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 초기 활동에서 시간이 흐른 뒤 그의 작업 방식이 어떻게 변모했는지를 보여줍니다. 재질의 변화를 넘어 이제는 사물의 크기를 왜곡하여 새로운 시각적 경험을 제공하려 했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">such as (관용표현): 예시를 나열할 때 쓰는 전치사구로 &#39;~와 같은&#39;을 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 사람들이 그의 예술을 즐기기를 원해서,</span><span class=\"en\"><b><span class=\"grammar-hl\">Wanting everyone to enjoy his art</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그의 작품들을 설치했다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">set up</span> his works</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야외 장소들에</span><span class=\"en\"><b>in outdoor places.</b></span></div></div><div class=\"lec-sent-ko\">모든 사람들이 그의 예술을 즐기기를 원해서, 그는 야외에 그의 작품들을 설치했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 미술관이라는 제한된 공간을 벗어나 대중과 적극적으로 소통하고자 했던 그의 예술관을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Wanting everyone to enjoy his art (분사구문): 현재분사 Wanting으로 시작하는 분사구문으로, &#39;Because he wanted everyone to enjoy his art&#39;라는 절로 변환 가능함. 또한 want는 5형식 동사로 everyone(O) + to enjoy(to부정사, OC) 구조를 취함</div><div class=\"lec-gr-item\">to enjoy (to부정사): 5형식 동사 want의 목적격 보어로 쓰여 &#39;everyone이 ~하기를 원하다&#39;라는 의미를 구성함</div><div class=\"lec-gr-item\">set up (관용표현): &#39;설치하다/세우다&#39;라는 의미의 구동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set up</td><td class=\"m\">~을 설치하다, ~을 마련하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 또한 상점을 운영했다</span><span class=\"en\"><b>He also ran a store</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 작업실 안에</span><span class=\"en\"><b>inside his studio</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 작품들을 팔기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to sell</span> his works.</b></span></div></div><div class=\"lec-sent-ko\">그는 그의 작품들을 팔기 위해 그의 작업실에서 상점도 운영했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술품을 특별한 소유물이나 감상 대상에 머물게 하지 않고, 일상적인 상품처럼 누구나 쉽게 사고 가질 수 있도록 유통했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to sell (to부정사): 목적을 나타내는 부사적 용법으로 &#39;~하기 위해&#39;라고 해석하며, 뒤에 목적어 his works를 취함</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그에게,</span><span class=\"en\"><b>For him,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술적인 작품들은</span><span class=\"en\"><b><span class=\"grammar-hl\">artistic works</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재미있는 상품이었다</span><span class=\"en\"><b>were fun goods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 위한</span><span class=\"en\"><b>for people.</b></span></div></div><div class=\"lec-sent-ko\">그에게 예술적인 작품들은 사람들을 위한 재미있는 제품이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 관통하는 핵심 결론입니다. 예술은 엄숙한 것이 아니라 사람들에게 기쁨을 주는 친근한 물건이어야 한다는 그의 확고한 철학을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">artistic works (현재분사): artistic이 형용사로 works를 수식하고 있으나, 문맥상 &#39;예술적 작품들&#39;이라는 복합명사적 개념으로 쓰임</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>클래스 올덴버그는 일상 사물을 소재로 예술을 재미있게 표현한 팝 아티스트이다.</li><li>초기에는 부드러운 재료로 변기 등을 조각하며 고정관념을 뒤집었다.</li><li>이후에는 일상 사물을 거대하게 제작하여 새로운 시각적 재미를 주었다.</li><li>작품을 야외에 전시하고 직접 판매하며 예술을 대중이 즐기는 상품으로 만들었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Claes Oldenburg created sculptures from everyday items to make art fun, and he displayed them in public spaces so that everyone could enjoy his work.</div>\n              <div class=\"lec-final-sum-ko\">클레스 올덴버그는 예술을 재미있게 만들기 위해 일상적인 물건으로 조각품을 만들었으며, 모두가 그의 작품을 즐길 수 있도록 공공장소에 전시했다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","
