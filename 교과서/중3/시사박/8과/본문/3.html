<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 시사(박) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 8과 본문3","audioDir":"3_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Claes Oldenburg: Making Art Fun with Everyday Objects\u003c/h1>\u003ch2>클래스 올덴버그: 일상의 물건으로 예술을 즐겁게 만들다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>클래스 올덴버그는 햄버거나 아이스크림콘 같은 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">물건\u003c/b>을 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">조각\u003c/b>과 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">조각\u003c/b>으로 만들어 야외에 전시하고 상점에서도 판매했다. 그에게 예술 작품은 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">제품\u003c/b>이었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Claes Oldenburg made fun pop art from everyday objects and shared it with everyone.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 교과서 본문에 나오는 클래스 올덴버그 이야기를 함께 볼게요. 이 글은 팝 아티스트인 클래스 올덴버그가 일상적인 물건을 조각으로 바꾸고 모든 사람이 즐기도록 예술을 만들었다는 내용이에요. 요약하면, 처음에는 부드러운 재료로 일상 사물을 만들었고 나중에는 거대한 조각을 야외에 전시했으며 작품을 상점에서도 팔았다는 거예요. 핵심 요지는 예술을 사람들을 위한 재미있는 제품으로 본다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">팝 아트(Pop Art)는 광고, 만화, \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">소비재\u003c/b> 같은 대중문화 이미지를 미술로 끌어들인 현대 미술 운동이에요. 1960년대 미국에서 앤디 워홀(Andy Warhol), 로이 리히텐슈타인(Roy Lichtenstein) 등이 대표적이며, 클래스 올덴버그는 \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">사물\u003c/b>을 거대하거나 부드러운 조각으로 바꾸어 익숙한 것을 낯설고 재미있게 만들었어요. 'soft sculpture'는 딱딱한 석상 대신 천이나 비닐 같은 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">재료\u003c/b>로 형태를 잡는데, 마치 거대한 봉제 인형처럼 조각이 축 처지거나 변형되기도 해요. 올덴버그는 미술관 안만이 아니라 공원이나 광장 같은 \u003cb class=\"key\">공공장소\u003c/b>에 작품을 설치해 지나가는 모든 사람이 예술을 만나게 했어요. 이는 예술을 어렵고 특별한 것에서 \u003cb class=\"key\">누구나 \u003c/b>\u003cb class=\"key\">즐길 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">제품\u003c/b>으로 보는 시각이에요.\u003c/div>","segs":[{"n":2,"text":"이 작품을 이해하려면 팝 아트라는 미술 흐름을 알면 좋아요. 팝 아트는 Pop Art라고 하는데, 광고나 만화처럼 대중이 매일 보는 이미지를 미술로 끌어들인 현대 미술 운동이에요. 클래스 올덴버그는 햄버거나 아이스크림콘 같은 일상 소비재를 조각으로 바꿔서 익숙한 것을 낯설고 재미있게 만들었죠. soft sculpture는 딱딱한 돌 대신 천이나 비닐 같은 부드러운 재료로 만드는 조각인데, 마치 거대한 봉제 인형처럼 축 처지기도 해요. 그는 미술관 안에만 두지 않고 공원이나 광장 같은 공공장소에 작품을 설치해서 지나가는 모든 사람이 예술을 만나게 했어요. 이건 예술을 어렵고 특별한 것에서 누구나 즐길 수 있는 재미있는 제품으로 보는 시각이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>팝 아티스트와 일상품 조각\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>클래스 올덴버그는 예술을 \u003cb class=\"key\">재미있게\u003c/b> 만든 또 다른 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>이다. 그는 햄버거, 쿠키, 붓 같은 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">물건\u003c/b>들을 조각으로 만들었다. 이 부분은 글의 처음에서 화가의 정체와 \u003cb class=\"key\">작품 \u003c/b>\u003cb class=\"key\">소재\u003c/b>를 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>초기 부드러운 조각\u003csmall>시간 순서 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>처음에는 \u003cb class=\"key\">플라스틱\u003c/b>, 종이, 천 같은 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">재료\u003c/b>로 soft sculptures를 만들었다. 예를 들어 천으로 \u003cb class=\"key\">변기\u003c/b>를 만들기도 했다. 이 시기는 \u003cb class=\"key\">재료\u003c/b>의 특성을 강조한 초기 작업이었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>후기 거대한 조각과 야외 전시\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>나중에는 아이스크림콘 같은 \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">물건\u003c/b>을 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">조각\u003c/b>으로 만들었다. 모든 사람이 \u003cb class=\"key\">즐기기\u003c/b>를 바라며 야외에 작품을 \u003cb class=\"key\">설치\u003c/b>했다. 이 장면은 실내에서 공공장소로 \u003cb class=\"key\">공간\u003c/b>을 넓힌 변화이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>상점 운영과 예술관\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>그는 작업실 안에 \u003cb class=\"key\">상점\u003c/b>을 운영해 작품을 팔았다. 그에게 예술 작품은 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">제품\u003c/b>이었다. 첫 문장의 made art fun과 연결되는 \u003cb class=\"key\">마무리\u003c/b>이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 팝 아티스트와 일상품 조각이에요. 첫 문장에서 클래스 올덴버그를 예술을 재미있게 만든 또 다른 팝 아티스트라고 소개해요. 이어서 햄버거와 쿠키와 붓처럼 일상적인 물건들을 조각으로 만들었다고 말하죠. 여기서 이 글의 핵심 소재가 일상적인 물건이라는 점을 잡아 주세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 초기의 부드러운 조각이에요. 처음에는 플라스틱과 종이와 천 같은 부드러운 재료로 soft sculptures를 만들었어요. 예를 들어 천으로 변기를 만들기도 했죠. 이 대목은 재료의 부드러움이 초기 작업의 특징이라는 것을 보여 줘요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 후기의 거대한 조각과 야외 전시예요. 나중에는 아이스크림콘 같은 일상 물건을 거대한 조각으로 만들었어요. 모든 사람이 예술을 즐기기를 바라서 작품을 야외에 설치했죠. 이렇게 작업 공간이 실내에서 공공장소로 넓어졌다는 것을 기억해 주세요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 상점 운영과 예술관이에요. 그는 작업실 안에 상점을 운영하면서 작품을 팔았어요. 그에게 예술 작품은 사람들을 위한 재미있는 제품이었죠. 첫 문장의 made art fun이라는 표현이 마지막에 fun goods for people로 다시 정리되는 흐름이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 팝 아티스트라는 \u003cb class=\"key\">정체\u003c/b>와 made art fun이라는 핵심을 밝힌 뒤, \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 초기 작업과 후기 작업을 설명하고, 마지막 문장에서 fun goods for people로 다시 \u003cb class=\"key\">주제\u003c/b>를 정리한다. 따라서 두괄식과 미괄식이 결합된 \u003cb class=\"key\">양괄식\u003c/b> 구조로 볼 수 있다. In the beginning과 Later 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">신호어\u003c/b>가 나타나 시간순 전개를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In the beginning (3)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>Later (6)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>such as (6)\u003c/b>\u003cspan>예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">made art fun\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fun goods for people\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>초기 부드러운 조각\u003c/th>\u003cth>후기 거대한 조각\u003c/th>\u003c/tr>\u003ctr>\u003ctd>재료가 부드러움\u003c/td>\u003ctd>크기가 거대함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>천으로 변기를 만듦\u003c/td>\u003ctd>아이스크림콘을 크게 만듦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실내 중심 작업\u003c/td>\u003ctd>야외에 설치해 공유\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순 전개에 양괄식 구조를 더한 글이에요. 첫 문장에서 팝 아티스트라는 정체와 made art fun이라는 주제를 먼저 밝히고, in the beginning과 later 같은 신호어로 초기와 후기 작업을 순서대로 설명해요. 마지막 문장에서 fun goods for people이라고 주제를 한 번 더 정리하죠. 그래서 처음과 끝에 주제가 모두 나타나는 양괄식으로 읽으면 좋아요.","hl":"ty"},{"n":9,"text":"신호어를 확인해 볼게요. in the beginning은 초기 작업의 시작을, later는 후기 작업으로 넘어가는 시간 신호어예요. for example은 변기를 만든 구체적 예시를 끌고 오고, such as도 햄버거나 아이스크림콘 같은 예시를 소개해요. 그리고 made art fun은 마지막에 fun goods for people로 재진술되면서 주제를 강조해요. 초기의 soft sculptures와 후기의 huge sculptures도 대조되는 표현이니 함께 비교하면 더 잘 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>pop artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팝 아티스트\u003c/span>\u003c/div>\u003cdiv>\u003cb>make art fun\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예술을 재미있게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sculpture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각품\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyday item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상적인 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>hamburger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>햄버거\u003c/span>\u003c/div>\u003cdiv>\u003cb>cookie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쿠키\u003c/span>\u003c/div>\u003cdiv>\u003cb>brush\u003c/b>\u003cem>명사\u003c/em>\u003cspan>붓\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the beginning\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>맨 처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soft sculpture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부드러운 조각품\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플라스틱\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이\u003c/span>\u003c/div>\u003cdiv>\u003cb>soft material\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부드러운 재료\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>cloth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천\u003c/span>\u003c/div>\u003cdiv>\u003cb>toilet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변기\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>ice cream cone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아이스크림콘\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set up\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>outdoor place\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야외 장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>run a store\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상점을 운영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>studio\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작업실\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>artistic work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술적인 작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>fun goods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재미있는 제품\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 원문 순서대로 정리해 볼게요. pop artist는 팝 아티스트, make art fun은 예술을 재미있게 만들다라는 뜻이에요. everyday item은 일상적인 물건이고, soft sculpture는 부드러운 조각품을 말해요. be made of는 무엇으로 만들어졌는지를 나타내고, set up은 설치하다, run a store는 상점을 운영하다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fun\u003c/b>\u003cspan class=\"m\">재미있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enjoyable\u003c/span>\u003cspan class=\"s\">entertaining\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">gigantic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outdoor\u003c/b>\u003cspan class=\"m\">야외의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">open-air\u003c/span>\u003cspan class=\"s\">outside\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indoor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sell\u003c/b>\u003cspan class=\"m\">팔다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">market\u003c/span>\u003cspan class=\"s\">vend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">buy\u003c/span>\u003cspan class=\"a\">purchase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">soft\u003c/b>\u003cspan class=\"m\">부드러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tender\u003c/span>\u003cspan class=\"s\">flexible\u003c/span>\u003cspan class=\"s\">pliable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003cspan class=\"a\">stiff\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">daily\u003c/b>\u003cspan class=\"m\">일상의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">everyday\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">routine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 어휘의 동의어와 반의어를 정리할게요. fun은 enjoyable이나 entertaining과 비슷하고 boring이나 dull과 반대예요. huge는 enormous, massive와 비슷하고 tiny, small과 반대이고, soft는 tender나 flexible과 비슷하지만 hard, stiff와 반대예요. enjoy는 appreciate나 like와 비슷하고 dislike와 반대이고, outdoor는 outside, open-air와 비슷하지만 indoor와 반대예요. sell은 market이나 vend와 비슷하고 buy와 반대이며, daily는 everyday와 비슷하고 special과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Claes Oldenburg는\u003c/span>\u003cspan class=\"en\">Claes Oldenburg\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 팝 아트 예술가이다\u003c/span>\u003cspan class=\"en\">is another pop artist\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술을 재미있게 만들었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"tgt\">fun\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Claes Oldenburg는 예술을 재미있게 만들었던 또 다른 팝 아트 예술가이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 주인공인 \u003cb class=\"key\">Claes \u003c/b>\u003cb class=\"key\">Oldenburg\u003c/b>가 예술을 \u003cb class=\"key\">재미있게\u003c/b> 만든 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>임을 소개한다. who made art fun은 앞의 pop artist를 꾸며 주며, '예술을 재미있게 만들었던'이라는 뜻으로 그의 예술관을 드러낸다. 뒤에 이어질 그의 작품 활동을 소개하는 도입부 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(another pop artist) + who + 동사(made) : \"예술을 재미있게 만들었던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 목적보어\u003c/span> : make + [목적어 art] + [목적보어 fun] : \"예술을 재미있게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Claes Oldenburg, Claes Oldenburg는. is another pop artist, 또 다른 팝 아트 예술가이다. who made art fun, 예술을 재미있게 만들었던. 이 문장 전체를 해석하면, Claes Oldenburg는 예술을 재미있게 만들었던 또 다른 팝 아트 예술가이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 주인공인 클래스 올든버그를 소개해요. 그는 예술을 재미있게 만든 또 다른 팝 아티스트라는 뜻이에요. who made art fun은 앞의 팝 아티스트를 꾸며 주면서 그가 어떤 예술가인지 설명해 줘요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 주격 관계대명사 who예요. who는 앞에 있는 another pop artist를 꾸며 주고, 뒤에 동사 made가 와서 형용사절을 만들어요. 두 번째 어법 포인트는 made art fun인데, make가 목적어 art와 목적보어 fun을 취하는 동사예요. 그래서 예술을 재미있게 만든다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 조각품들을 만들었다\u003c/span>\u003cspan class=\"en\">He made sculptures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상적인 물건들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">everyday \u003c/span>\u003cspan class=\"tgt\">items\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">햄버거, 쿠키, 붓\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hamburger, \u003c/span>\u003cspan class=\"tgt\">cookies, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">brush\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 햄버거와 쿠키, 붓 같은 일상적인 물건들의 조각품들을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Oldenburg가 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">물건들\u003c/b>을 주제로 삼아 조각품을 만들었다는 구체적인 사실을 제시한다. such as 뒤에 \u003cb class=\"key\">햄버거\u003c/b>, \u003cb class=\"key\">쿠키\u003c/b>, \u003cb class=\"key\">붓\u003c/b>을 예로 들어 그가 평범한 것을 예술 작품으로 승화시켰음을 보여 준다. 앞 문장의 'made art fun'을 뒷받침하는 예시 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (명사 수식)\u003c/span> : sculptures + of + [명사구 everyday items] : \"일상적인 물건들의 조각품\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as (예시 나열)\u003c/span> : such as + [예시 명사(들)] : \"햄버거, 쿠키, 붓 같은\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He made sculptures, 그는 조각품들을 만들었다. of everyday items, 일상적인 물건들의. such as, ~와 같은. a hamburger, cookies, and a brush, 햄버거, 쿠키, 붓. 이 문장 전체를 해석하면, 그는 햄버거와 쿠키, 붓 같은 일상적인 물건들의 조각품들을 만들었다.","hl":"m"},{"n":16,"text":"이 문장은 올든버그가 햄버거와 쿠키와 붓 같은 일상적인 물건들을 소재로 조각품을 만들었다는 사실을 알려 줘요. such as 뒤에 구체적인 예들이 나오면서 어떤 물건들인지 더 분명하게 보여 줘요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 of everyday items예요. 전치사 of가 뒤의 명사구 everyday items를 이끌어서 앞의 sculptures를 꾸며 줘요. 두 번째 어법 포인트는 such as인데요, such as 뒤에 햄버거와 쿠키와 붓을 나열해서 구체적인 예를 제시해요. 그래서 '~와 같은'이라는 뜻으로 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맨 처음에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beginning\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 만들었다\u003c/span>\u003cspan class=\"en\">he created\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부드러운 조각품들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">soft \u003c/span>\u003cspan class=\"tgt\">sculptures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">맨 처음에 그는 부드러운 조각품들을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Oldenburg가 초기에 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">조각품\u003c/b>을 만들었다는 사실을 알려 준다. 'In the beginning'은 시간 순서상 첫 단계를 나타내며, 뒤에 이어질 later와 대조되는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부사구\u003c/b>이다. 이후 문장에서 부드러운 조각의 재료와 예시를 설명할 것임을 암시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (시간 부사구)\u003c/span> : in + the beginning : \"맨 처음에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : soft(형용사) + sculptures(명사) : \"부드러운 조각품들\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In the beginning, 맨 처음에. he created, 그는 만들었다. soft sculptures, 부드러운 조각품들. 이 문장 전체를 해석하면, 맨 처음에 그는 부드러운 조각품들을 만들었다.","hl":"m"},{"n":19,"text":"이 문장은 올든버그가 작업 초기에 부드러운 조각품들을 만들었다는 사실을 알려 줘요. In the beginning은 시간 순서상 첫 단계를 나타내고, 뒤에 나올 later와 대비되는 표현이에요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 In the beginning이에요. 문장 맨 앞에서 시간을 나타내는 전치사구로 쓰여서 '맨 처음에'라는 뜻을 더해 줘요. 두 번째 어법 포인트는 soft sculptures인데, soft가 명사 sculptures를 앞에서 꾸며 주는 한정적 용법이에요. 그래서 부드러운 조각품들이라는 명사구가 만들어져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 만들어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱, 종이, 그리고 다른 부드러운 재료들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">plastic, \u003c/span>\u003cspan class=\"tgt\">paper, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">soft \u003c/span>\u003cspan class=\"tgt\">materials\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 플라스틱, 종이, 그리고 다른 부드러운 재료들로 만들어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 올덴버그의 초기 소프트 조각품들이 어떤 재료로 만들어졌는지 설명한다. be made of는 재료의 성질이 변하지 않고 그대로 보이는 경우에 쓰는 표현이다. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">made \u003c/b>\u003cb class=\"key\">of\u003c/b>를 통해 작품의 \u003cb class=\"key\">재료\u003c/b>가 \u003cb class=\"key\">부드러운\u003c/b> 것임을 알려 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 - be made of\u003c/span> : be made of + 재료 : \"~로 만들어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 - A, B, and C\u003c/span> : A, B, and C : \"플라스틱, 종이, 그리고 다른 부드러운 재료들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They, 그것들은. were made of, ~로 만들어졌다. plastic, paper, and other soft materials, 플라스틱, 종이, 그리고 다른 부드러운 재료들. 이 문장 전체를 해석하면, 그것들은 플라스틱, 종이, 그리고 다른 부드러운 재료들로 만들어졌다.","hl":"m"},{"n":22,"text":"이 문장은 Claes Oldenburg의 초기 소프트 조각품들이 플라스틱, 종이 같은 부드러운 재료로 만들어졌다는 사실을 설명해요. be made of라는 표현은 재료의 성질이 변하지 않고 그대로 보일 때 써요. 그의 작품이 딱딱하지 않고 부드러운 성질을 가졌다는 점이 포인트예요.","hl":"mn"},{"n":23,"text":"어법 포인트는 두 가지예요. 첫 번째는 수동태 be made of예요. make A of B를 수동태로 바꾸면 A be made of B가 되고, 이때 of는 재료의 성질이 변하지 않을 때 쓴다는 점을 기억하세요. 두 번째는 병렬 구조예요. plastic, paper, and other soft materials처럼 세 개를 나열할 때는 A, B, and C 형식으로 마지막에 and를 넣어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어서,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천을 사용했다\u003c/span>\u003cspan class=\"en\">used cloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변기를 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">toilets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어서, 그는 변기를 만들기 위해 천을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 구체적인 예로, 그가 천이라는 부드러운 재료로 변기를 만들었다는 사실을 보여 준다. 예술 작품의 소재로 \u003cb class=\"key\">천\u003c/b>을 사용해 일상적인 \u003cb class=\"key\">변기\u003c/b>를 만들었다는 점에서 \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">toilets\u003c/b>는 목적을 나타내는 to부정사이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use A to부정사 (A를 ~하기 위해 사용하다) : \"변기를 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, 예를 들어서. he, 그는. used cloth, 천을 사용했다. to make toilets, 변기를 만들기 위해. 이 문장 전체를 해석하면, 예를 들어서, 그는 변기를 만들기 위해 천을 사용했다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 부드러운 재료의 구체적인 예를 들어 주는 문장이에요. 그가 변기를 만들 때 천을 사용했다는 것인데, 예술 작품으로서 변기를 만들었다는 점이 재미있죠. 여기서 to make toilets는 만들기 위해라는 목적을 나타내요.","hl":"mn"},{"n":26,"text":"어법 포인트는 to부정사의 부사적 용법 중 목적이에요. to make toilets가 used cloth를 꾸며 주면서 변기를 만들기 위해라는 목적의 의미를 더해 줘요. use A to 부정사 형태로 A를 어디에 사용하다라는 뜻이 된다는 걸 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 조각품들을 만들었다\u003c/span>\u003cspan class=\"en\">made \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">huge \u003c/span>\u003cspan class=\"tgt\">sculptures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상 물건의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">items\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이스크림콘 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003cspan class=\"tgt\">cream \u003c/span>\u003cspan class=\"tgt\">cone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에 그는 아이스크림콘 같은 일상 물건의 거대한 조각품들을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간이 지나 후기 Oldenburg가 일상 물건을 거대한 조각품으로 만들었다는 변화를 보여 준다. early soft sculptures에서 later huge sculptures로의 전환을 나타내며, such as로 대표적인 예인 아이스크림콘을 제시한다. \u003cb class=\"key\">Later\u003c/b>와 \u003cb class=\"key\">huge\u003c/b>가 이전 문장과 대비되는 \u003cb class=\"key\">변화\u003c/b>를 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 of의 형용사적 용법\u003c/span> : 명사 + of + 명사 (뒤에서 앞 수식) : \"일상 물건의 거대한 조각품들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">예시 표현 such as\u003c/span> : such as + 명사(구) : \"아이스크림콘 같은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Later, 나중에. he, 그는. made huge sculptures, 거대한 조각품들을 만들었다. of daily items, 일상 물건의. such as an ice cream cone, 아이스크림콘 같은. 이 문장 전체를 해석하면, 나중에 그는 아이스크림콘 같은 일상 물건의 거대한 조각품들을 만들었다.","hl":"m"},{"n":28,"text":"이 문장은 시간이 흘러서 올덴버그가 일상적인 물건을 거대한 크기의 조각품으로 만들기 시작했다는 내용을 전해요. 앞서 나온 부드러운 조각품과 대비되는 후기 작품의 특징을 보여 주죠. such as an ice cream cone에서 아이스크림콘은 일상 물건의 대표적인 예로 제시된 거예요.","hl":"mn"},{"n":29,"text":"어법 포인트는 두 가지예요. 첫 번째는 such as an ice cream cone이에요. such as는 뒤에 예시를 덧붙일 때 쓰는 표현으로, 뒤에 명사를 써서 아이스크림콘 같은 이라는 뜻을 만들어요. 두 번째는 huge sculptures of daily items에서 of daily items가 앞의 huge sculptures를 뒤에서 수식해요. 명사 of 명사 구조는 뒤에서 앞을 수식하는 형용사적 용법이라고 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들이 그의 예술을 즐기기를 원해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Wanting \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">art\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그의 작품들을 설치했다\u003c/span>\u003cspan class=\"en\">he set up his works\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야외에.\u003c/span>\u003cspan class=\"en\">in outdoor places.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 사람들이 그의 예술을 즐기기를 원해서, 그는 야외에 그의 작품들을 설치했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 올든버그가 모든 사람이 예술을 즐기기를 바라는 마음에서 작품을 야외에 설치했다는 내용이에요. \u003cb class=\"key\">분사구문\u003c/b>인 Wanting 이하가 이유를 나타내며 주절을 꾸며 줘요. 예술을 모두가 즐기게 하려는 그의 \u003cb class=\"key\">의도\u003c/b>가 야외 전시로 이어지는 흐름을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사구문)\u003c/span> : 부사절 (Because he wanted everyone to enjoy his art) → 분사구문 (Wanting everyone to enjoy his art) : \"모든 사람들이 그의 예술을 즐기기를 원해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어 + to부정사 (5형식)\u003c/span> : want(ing) + 목적어(everyone) + to부정사(to enjoy his art) : \"모든 사람들이 그의 예술을 즐기기를\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Wanting everyone to enjoy his art, 모든 사람들이 그의 예술을 즐기기를 원해서. he set up his works, 그는 그의 작품들을 설치했다. in outdoor places, 야외에.. 이 문장 전체를 해석하면, 모든 사람들이 그의 예술을 즐기기를 원해서, 그는 야외에 그의 작품들을 설치했다.","hl":"m"},{"n":31,"text":"이 문장은 올든버그가 모든 사람이 예술을 즐기기를 바라는 마음에서 작품을 야외에 설치했다는 내용이에요. Wanting 이하는 분사구문이에요. 이유를 나타내면서 뒤의 주절을 꾸며 주죠. 작품을 야외에 설치한 데는 모두가 예술을 즐기게 하려는 의도가 담겨 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 Wanting everyone to enjoy his art 부분이에요. 주어 he가 생략되고 동사가 현재분사로 바뀐 분사구문으로, 부사절로 바꾸면 Because he wanted everyone to enjoy his art가 돼요. 두 번째 포인트는 everyone to enjoy his art 구조인데, want는 목적어 everyone과 to부정사 to enjoy his art를 함께 써서 everyone이 예술을 즐기기를 원한다는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 상점도 운영했다\u003c/span>\u003cspan class=\"en\">He also ran a store\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 작업실 안에서\u003c/span>\u003cspan class=\"en\">inside his studio\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 작품들을 팔기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sell \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그의 작품들을 팔기 위해 그의 작업실에서 상점도 운영했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 올든버그가 작업실 안에 상점을 열어 작품을 직접 팔았다는 내용이에요. \u003cb class=\"key\">to부정사의 \u003c/b>\u003cb class=\"key\">부사적 \u003c/b>\u003cb class=\"key\">용법\u003c/b>인 to sell his works가 ran a store의 \u003cb class=\"key\">목적\u003c/b>을 나타내요. 예술 작품도 팔 수 있는 \u003cb class=\"key\">상품\u003c/b>처럼 여겼다는 태도를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : ran a store + to sell his works (to부정사구, 목적) : \"그의 작품들을 팔기 위해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He also ran a store, 그는 상점도 운영했다. inside his studio, 그의 작업실 안에서. to sell his works, 그의 작품들을 팔기 위해.. 이 문장 전체를 해석하면, 그는 그의 작품들을 팔기 위해 그의 작업실에서 상점도 운영했다.","hl":"m"},{"n":34,"text":"이 문장은 올든버그가 자기 작업실 안에서 직접 상점을 운영하며 작품을 팔았다는 내용이에요. to sell his works는 ran a store의 목적을 나타내는 to부정사예요. 예술 작품도 팔 수 있는 상품처럼 여겼다는 태도를 보여 줘요.","hl":"mn"},{"n":35,"text":"이 문장의 포인트는 to sell his works예요. to부정사가 ran a store를 꾸며 주는 부사적 용법으로, 상점을 운영한 목적이 작품을 팔기 위해서라는 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게는,\u003c/span>\u003cspan class=\"en\">For him,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술적인 작품들은 재미있는 제품이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">artistic \u003c/span>\u003cspan class=\"tgt\">works \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">fun \u003c/span>\u003cspan class=\"tgt\">goods\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 위한.\u003c/span>\u003cspan class=\"en\">for people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그에게 예술적인 작품들은 사람들을 위한 재미있는 제품이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 올든버그가 예술 작품을 사람들을 위한 재미있는 제품으로 정의했음을 보여 주는 요약 문장이에요. artistic works were fun goods는 \u003cb class=\"key\">2형식\u003c/b> 문장으로, fun goods가 주어의 \u003cb class=\"key\">주격보어\u003c/b> 역할을 해요. 예술을 \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>으로 보는 팝아트 정신을 잘 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장 (주어 + be동사 + 주격보어)\u003c/span> : 주어(artistic works) + 동사(were) + 주격보어(fun goods) : \"예술적인 작품들은 재미있는 제품이었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"For him, 그에게는. artistic works were fun goods, 예술적인 작품들은 재미있는 제품이었다. for people, 사람들을 위한.. 이 문장 전체를 해석하면, 그에게 예술적인 작품들은 사람들을 위한 재미있는 제품이었다.","hl":"m"},{"n":37,"text":"이 문장은 올든버그가 예술 작품을 사람들을 위한 재미있는 제품으로 정의했음을 보여 주는 요약 문장이에요. artistic works were fun goods는 fun goods가 주어의 주격보어 역할을 하는 2형식 문장이에요. 예술을 일상의 즐거움으로 보는 팝아트 정신을 잘 나타내요.","hl":"mn"},{"n":38,"text":"이 문장의 포인트는 artistic works were fun goods예요. be동사 were 뒤에 fun goods가 와서 주어 artistic works의 성격을 설명하는 주격보어 역할을 해요. 그에게는 예술 작품이 곧 사람들을 위한 재미있는 상품이라는 의미가 돼요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Claes \u003c/b>\u003cb class=\"key\">Oldenburg\u003c/b>는 예술을 \u003cb class=\"key\">재미있게\u003c/b> 만든 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>이다.\u003c/li>\u003cli>초기에는 \u003cb class=\"key\">플라스틱\u003c/b>, 종이, 천 같은 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">재료\u003c/b>로 \u003cb class=\"key\">변기\u003c/b> 등을 만들었다.\u003c/li>\u003cli>나중에는 \u003cb class=\"key\">아이스크림콘\u003c/b> 같은 일상 물건을 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">조각\u003c/b>으로 만들어 \u003cb class=\"key\">야외\u003c/b>에 설치했다.\u003c/li>\u003cli>그에게 예술 작품은 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">제품\u003c/b>이었고, \u003cb class=\"key\">상점\u003c/b>에서도 팔았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Claes Oldenburg made fun pop art from everyday objects and shared it with everyone.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">클래스 올덴버그는 햄버거나 아이스크림콘 같은 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">물건\u003c/b>을 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">조각\u003c/b>과 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">조각\u003c/b>으로 만들어 야외에 전시하고 상점에서도 판매했다. 그에게 예술 작품은 \u003cb class=\"key\">사람들을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">제품\u003c/b>이었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 내용을 정리하면, 클래스 올덴버그는 일상적인 물건을 부드러운 조각과 거대한 조각으로 만들어 사람들이 예술을 즐기게 한 팝 아티스트예요. 초기에는 천과 플라스틱 같은 부드러운 재료로 변기 같은 작품을 만들었고, 후기에는 아이스크림콘 같은 일상 물건을 크게 만들어 야외에 설치했죠. 작품을 상점에서도 팔았고, 그에게 예술 작품은 사람들을 위한 재미있는 제품이었어요. 이 흐름을 잘 기억해 두면 본문 이해가 쉬울 거예요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
