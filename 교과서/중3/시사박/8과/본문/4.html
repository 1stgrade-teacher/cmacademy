@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 8과 본문4","audioDir":"4_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Roy Lichtenstein and the Lesson of Pop Art\u003c/h1>\u003ch2>로이 리히텐슈타인과 팝 아트의 교훈\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Roy Lichtenstein은 만화를 작품에 사용해 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 \u003cb class=\"key\">대중문화\u003c/b> 사이의 벽을 허물었다. 팝 아트는 \u003cb class=\"key\">예술은 \u003c/b>\u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 믿으며 누구나 \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 창의적으로 사용해 모두를 위한 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 만들 수 있다는 \u003cb class=\"key\">교훈\u003c/b>을 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Pop art teaches us that anyone can create and enjoy art by using daily images creatively.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 시사 박 교과서 여덟째 과 본문 네 번째 지문을 함께 공부해요. 이번 지문은 팝 아트의 중요한 교훈을 Roy Lichtenstein의 사례를 통해 보여 주고 있어요. 요약하면 만화를 예술에 도입해 순수 예술과 대중문화의 벽을 허문 내용이고, 요지는 누구나 일상 이미지를 창의적으로 사용해 예술을 만들고 즐길 수 있다는 거예요. 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">팝 아트(Pop Art)는 이십세기 중반 미국과 영국에서 등장한 미술 운동으로, 광고나 만화 같은 \u003cb class=\"key\">대중문화\u003c/b> 이미지를 작품에 직접 사용했어요. Roy Lichtenstein은 만화의 \u003cb class=\"key\">말풍선\u003c/b>과 인쇄 망점을 확대해 그린 것으로 유명해요. 당시 미술계는 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 대중문화를 엄격히 구분했지만, 팝 아티스트들은 그 경계를 허물고자 했어요. 예를 들어 우리가 매일 쓰는 이모티콘이나 SNS 이미지가 미술관에 걸린다면 어떨까요? 팝 아트는 바로 그런 질문에서 시작됐고, \u003cb class=\"key\">예술은 \u003c/b>\u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 믿었어요.\u003c/div>","segs":[{"n":2,"text":"팝 아트는 Pop Art라고 쓰고요, 이십세기 중반 미국과 영국에서 등장한 미술 운동이에요. 광고나 만화 같은 대중문화 이미지를 작품에 직접 사용했죠. Roy Lichtenstein은 만화의 말풍선과 인쇄 망점을 확대해서 그린 것으로 유명해요. 당시 미술계는 순수 예술과 대중문화를 엄격히 구분했는데, 팝 아티스트들은 그 경계를 허물고자 했어요. 예를 들어 우리가 매일 쓰는 이모티콘이나 SNS 이미지가 미술관에 걸린다면 어떨까요? 팝 아트는 바로 그런 질문에서 시작됐고, 예술은 쉬워야 한다고 믿었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>Roy의 작품 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Roy Lichtenstein은 자신의 작품에 \u003cb class=\"key\">만화\u003c/b>를 사용했습니다. 작품들은 크기가 컸고 \u003cb class=\"key\">생기 \u003c/b>\u003cb class=\"key\">넘치는 \u003c/b>\u003cb class=\"key\">색\u003c/b>들로 그려졌습니다. 그는 그림에 \u003cb class=\"key\">말풍선\u003c/b>까지 포함시켰습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>당시 통념과 Roy의 반박\u003csmall>전환 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>당시에는 \u003cb class=\"key\">만화\u003c/b>가 \u003cb class=\"key\">예술의 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 간주되지 않았습니다. 그러나 Roy Lichtenstein은 다르게 생각했습니다. 그는 왜 만화는 예술이 아니냐고 스스로에게 물었습니다. 그리고 만화를 예술에 첨가하여 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 \u003cb class=\"key\">대중문화\u003c/b> 사이의 벽을 허물었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>팝 아티스트의 신념\u003csmall>주장 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>팝 아트 예술가들은 \u003cb class=\"key\">예술은 \u003c/b>\u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 믿었습니다. 누구라도 예술을 \u003cb class=\"key\">창조\u003c/b>하고 \u003cb class=\"key\">즐길\u003c/b> 수 있다고 보았습니다. 이를 통해 예술의 문턱을 낮추려 했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>적용과 교훈\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>오늘 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아트\u003c/b> 작품 하나를 만들어 보는 것은 어떨까요? \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>들을 창의적인 방법으로 사용하면 모두를 위한 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 만들 수 있습니다. 이것이 팝 아트의 가장 중요한 \u003cb class=\"key\">교훈\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 Roy Lichtenstein의 구체적인 사례를 먼저 제시하고, 당시 통념을 반박한 뒤에 팝 아트의 일반적인 교훈으로 마무리하는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 Roy Lichtenstein의 작품 소개예요. 그는 작품에 만화를 사용했고, 그림이 크고 색이 생기 넘쳤어요. 심지어 그림에 말풍선까지 넣었죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 당시 통념과 Roy의 다른 생각이에요. 그 당시 만화는 예술의 형태로 간주되지 않았어요. 하지만 Roy는 왜 만화는 예술이 아니냐고 스스로에게 물었죠. 결국 그는 만화를 예술에 첨가해서 순수 예술과 대중문화 사이의 벽을 허물었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 팝 아티스트들의 신념이에요. 그들은 예술은 쉬워야 한다고 믿었고, 누구라도 예술을 창조하고 즐길 수 있다고 보았어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 적용과 교훈이에요. 오늘 팝 아트 작품 하나를 만들어 보는 건 어떨까요? 일상의 이미지들을 창의적인 방법으로 사용하면 모두를 위한 예술 작품을 만들 수 있어요. 이것이 팝 아트의 가장 중요한 교훈입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문단은 Roy Lichtenstein의 작품이라는 \u003cb class=\"key\">예시\u003c/b>를 구체적으로 제시합니다. 이어서 당시 만화를 예술로 보지 않던 \u003cb class=\"key\">통념\u003c/b>과 However 이후의 \u003cb class=\"key\">반박\u003c/b>을 대조하며 벽을 허물었음을 보여 줍니다. 마지막 문단은 Pop artists의 생각을 일반화하여 This가 가리키는 \u003cb class=\"key\">교훈\u003c/b>으로 마무리하므로, 핵심 문장은 마지막 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Back then (4)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>However (5)\u003c/b>\u003cspan>반박 전환\u003c/span>\u003cb>This (12)\u003c/b>\u003cspan>결론 지시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cartoons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">speech balloons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">popular culture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">daily images\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>당시 통념\u003c/th>\u003cth>Roy Lichtenstein과 팝 아트\u003c/th>\u003c/tr>\u003ctr>\u003ctd>만화는 예술이 아니다\u003c/td>\u003ctd>만화를 예술에 포함시켰다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>순수 예술과 대중문화를 분리했다\u003c/td>\u003ctd>순수 예술과 대중문화의 벽을 허물었다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식으로 보면 예시에 해당해요. Roy Lichtenstein이라는 구체적 사례를 먼저 보여 주고, 이를 바탕으로 팝 아트의 일반적인 교훈을 이끌어 내죠. 핵심 문장은 마지막 문장인 This is the most important lesson from pop art예요. 그래서 구조는 미괄식이고, 마지막에 주제가 드러나는 글입니다.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. Back then은 당시의 통념을 제시해요. However는 Roy가 다르게 생각했다는 반박의 전환을 알려 주죠. This는 앞에서 말한 일상 이미지로 모두를 위한 예술 작품을 만드는 것을 가리키며 결론을 지시해요. 또 cartoons, speech balloons, popular culture, daily images처럼 예술의 소재가 되는 대중적 이미지를 계속 바꿔 말하고 있다는 점도 함께 잡아 두면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>cartoon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>만화\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>large\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다, 색칠하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lively\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생기 넘치는\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>speech balloon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>말풍선\u003c/span>\u003c/div>\u003cdiv>\u003cb>back then\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그 당시\u003c/span>\u003c/div>\u003cdiv>\u003cb>regard\u003c/b>\u003cem>동사\u003c/em>\u003cspan>간주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>art form\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술의 형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>differently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스스로에게 묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>break down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>허물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벽\u003c/span>\u003c/div>\u003cdiv>\u003cb>high art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순수 예술\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대중문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>첨가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이미지\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>창의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in a creative way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>창의적인 방법으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>lesson\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교훈\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 단어를 짚어 볼게요. regard는 간주하다, break down은 허물다, high art는 순수 예술, popular culture는 대중문화예요. daily는 일상의, image는 이미지, in a creative way는 창의적인 방법으로라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">창조하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">erase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">effortless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">include\u003c/b>\u003cspan class=\"m\">포함하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contain\u003c/span>\u003cspan class=\"s\">involve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">omit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break down\u003c/b>\u003cspan class=\"m\">허물다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tear down\u003c/span>\u003cspan class=\"s\">knock down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">build up\u003c/span>\u003cspan class=\"a\">construct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">large\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lively\u003c/b>\u003cspan class=\"m\">생기 넘치는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vivid\u003c/span>\u003cspan class=\"s\">energetic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">lifeless\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리할게요. create는 make, produce와 바꿔 쓸 수 있고, destroy, erase와 반대예요. enjoy는 appreciate, like와 비슷하고 dislike, hate와 반대죠. easy는 simple, effortless와 비슷하고 difficult, hard와 반대예요. include는 contain, involve와 비슷하고 exclude, omit과 반대고, break down은 tear down, knock down과 비슷하고 build up, construct와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Roy Lichtenstein은\u003c/span>\u003cspan class=\"en\">Roy Lichtenstein\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만화를 사용했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">cartoons\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 작품에\u003c/span>\u003cspan class=\"en\">in his works.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Roy Lichtenstein은 그의 작품에 만화를 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Roy Lichtenstein이 자신의 작품에 만화를 사용했다는 사실을 제시하는 \u003cb class=\"key\">도입\u003c/b> 문장입니다. 앞으로 이어질 내용의 출발점이 되며, 그가 만화를 예술의 영역으로 가져온 인물임을 보여줍니다. \u003cb class=\"key\">used \u003c/b>\u003cb class=\"key\">cartoons \u003c/b>\u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">his \u003c/b>\u003cb class=\"key\">works\u003c/b>는 그의 작품 세계를 나타내는 핵심 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 과거 시제\u003c/span> : 주어 + used(과거형) + cartoons(목적어) : \"만화를 사용했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Roy Lichtenstein, Roy Lichtenstein은. used cartoons, 만화를 사용했다. in his works, 그의 작품에. 이 문장 전체를 해석하면, Roy Lichtenstein은 그의 작품에 만화를 사용했다.","hl":"m"},{"n":13,"text":"이 문장은 Roy Lichtenstein이 자기 작품에 만화를 사용했다는 사실을 먼저 제시하는 도입 문장입니다. 당시에는 만화가 예술로 인정받지 못했지만, 그는 과감하게 만화를 작품 속으로 가져왔어요. used cartoons in his works는 이 글 전체를 이끄는 핵심 특징으로 기억하면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 일반동사의 과거 시제입니다. 여기서 used는 use의 과거형으로, Roy Lichtenstein이 과거에 만화를 사용했다는 사실을 나타냅니다. 주어 Roy Lichtenstein이 삼인칭 단수이지만, 과거 시제에서는 동사에 s를 붙이지 않고 used처럼 과거형을 씁니다. used cartoons는 만화를 사용했다로 해석해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 컸다\u003c/span>\u003cspan class=\"en\">They were large\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그려졌다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">painted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생기 넘치는 색들로\u003c/span>\u003cspan class=\"en\">in lively colors.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 컸고, 생기 넘치는 색들로 그려졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 작품의 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 구체적으로 묘사합니다. 그림이 크고 생기 있는 색으로 그려졌다는 뜻으로, 팝아트의 화려하고 대담한 느낌을 강조합니다. 그려졌다에 해당하는 \u003cb class=\"key\">수동태\u003c/b> 표현이 그림이 그려진 상태를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be 동사 + 과거분사)\u003c/span> : (were) + painted(과거분사) + in lively colors(전치사구) : \"생기 넘치는 색들로 그려졌다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They were large, 그들은 컸다. and painted, 그리고 그려졌다. in lively colors, 생기 넘치는 색들로. 이 문장 전체를 해석하면, 그들은 컸고, 생기 넘치는 색들로 그려졌다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장에서 말한 작품의 시각적 특징을 구체적으로 설명합니다. 그의 작품은 크기가 컸고, 색이 생기 넘치게 그려졌다는 뜻이죠. were painted는 수동태로, 그림이 그려진 상태를 강조하고 팝아트의 화려한 느낌을 살려 줍니다.","hl":"mn"},{"n":17,"text":"이 문장의 어법 포인트는 수동태입니다. were large and painted에서 painted는 were와 함께 쓰여 그려졌다라는 수동태를 만드는 과거분사입니다. and가 앞의 형용사 large와 뒤의 과거분사 painted를 연결하면서 be동사 were를 공유하고 있어요. 그래서 그림이 색으로 그려진 상태라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 심지어 포함했다\u003c/span>\u003cspan class=\"en\">He even \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">included \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말풍선을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">speech \u003c/span>\u003cspan class=\"tgt\">balloons \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 그림에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">paintings\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 심지어 그의 그림에 말풍선을 넣었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Lichtenstein이 그림에 \u003cb class=\"key\">말풍선\u003c/b>까지 넣었다는 점을 덧붙입니다. 앞서 말한 만화 요소에 더해 말풍선을 포함함으로써, 그가 만화의 표현 방식을 직접 차용했음을 보여줍니다. \u003cb class=\"key\">speech \u003c/b>\u003cb class=\"key\">balloons\u003c/b>는 만화의 상징적 장치로, 이 문장은 그의 시도가 더 과감했음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 include A in B\u003c/span> : included + speech balloons(A/목적어) + in his paintings(B/전치사구) : \"그의 그림에 말풍선을 포함했다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He even included, 그는 심지어 포함했다. speech balloons, 말풍선을. in his paintings, 그의 그림에. 이 문장 전체를 해석하면, 그는 심지어 그의 그림에 말풍선을 넣었다.","hl":"m"},{"n":19,"text":"이 문장은 Lichtenstein이 그림에 말풍선까지 넣었다고 덧붙이며, 만화의 표현 방식을 더 직접적으로 차용했음을 보여줍니다. 말풍선은 만화에서 인물의 말을 담는 도구인데, 그것을 예술 작품에 포함했다는 점에서 그의 실험이 더 과감했다는 것을 알 수 있어요. 그래서 이 문장은 앞의 내용보다 한 단계 더 나아간 정보입니다.","hl":"mn"},{"n":20,"text":"여기서는 include A in B 구조를 짚어 둘게요. included speech balloons in his paintings는 말풍선을 그의 그림에 포함했다라는 뜻입니다. include A in B는 A를 B에 포함하다로, A 자리에는 speech balloons 같은 목적어가, B 자리에는 in his paintings 같은 전치사구가 옵니다. 이 구조는 서술형에서 어순 문제로 자주 나오니까 통째로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 당시\u003c/span>\u003cspan class=\"en\">Back then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만화는\u003c/span>\u003cspan class=\"en\">cartoons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간주되지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">regarded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술의 형태로.\u003c/span>\u003cspan class=\"en\">as an art form.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 당시 만화는 예술의 형태로 간주되지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 로이 리히텐슈타인이 등장하기 전, \u003cb class=\"key\">당시 \u003c/b>\u003cb class=\"key\">미술계의 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 보여 줍니다. 만화가 예술의 한 형태로 인정받지 못했다는 사실로 뒤에 나올 \u003cb class=\"key\">생각의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 부각하는 배경 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (과거 시제)\u003c/span> : be동사 + not + 과거분사 : \"간주되지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Back then, 그 당시. cartoons, 만화는. were not regarded, 간주되지 않았다. as an art form, 예술의 형태로.. 이 문장 전체를 해석하면, 그 당시 만화는 예술의 형태로 간주되지 않았다.","hl":"m"},{"n":22,"text":"이 문장은 그 당시 만화가 예술의 형태로 간주되지 않았다는 시대적 인식을 보여 줍니다. not regarded as an art form은 예술 장르로 인정받지 못했다는 의미예요. 뒤에서 로이 리히텐슈타인이 다른 생각을 펼칠 배경을 만드는 역할을 합니다.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. were not regarded는 수동태 과거 시제입니다. 주어 cartoons가 간주하는 주체가 아니라 간주되는 대상이므로 be동사와 과거분사 regarded를 함께 씁니다. 행위 주체는 일반적인 사람들이라 by people 같은 표현은 생략되었어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Roy Lichtenstein은\u003c/span>\u003cspan class=\"en\">Roy Lichtenstein\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르게 생각했다.\u003c/span>\u003cspan class=\"en\">thought \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">differently\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 Roy Lichtenstein은 다르게 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 \u003cb class=\"key\">대조\u003c/b>를 이루며 로이 리히텐슈타인은 기존 인식과 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>을 가졌음을 보여 줍니다. However는 문장을 반전시키는 신호이며, 만화를 예술로 볼 가능성을 열어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속 부사\u003c/span> : However + S + V : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 용법 (방법·상태)\u003c/span> : thought + differently : \"다르게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"However, 하지만. Roy Lichtenstein, Roy Lichtenstein은. thought differently, 다르게 생각했다.. 이 문장 전체를 해석하면, 하지만 Roy Lichtenstein은 다르게 생각했다.","hl":"m"},{"n":25,"text":"앞 문장과 대조를 이루며 로이 리히텐슈타인은 기존 인식과 다른 관점을 가졌음을 보여 줍니다. However는 문장을 반전시키는 신호이고, thought differently는 다르게 생각했다는 뜻으로 만화를 예술로 볼 가능성을 열어 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 However입니다. However는 접속 부사로 앞 문장과 반대되는 내용을 이어 줍니다. 두 번째 포인트는 differently예요. differently는 부사로 동사 thought를 꾸며 줘서 어떻게 생각했는지 설명합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 스스로에게 물었다\u003c/span>\u003cspan class=\"en\">He asked \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'왜 그것들은 아닐까?'\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">'Why \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">not?'\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 ‘왜 만화는 예술로 간주되지 않을까?’라고 스스로에게 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그는 왜 만화가 예술로 간주되지 않는 걸까 하고 \u003cb class=\"key\">스스로에게 \u003c/b>\u003cb class=\"key\">질문\u003c/b>하면서 만화가 예술에서 배제된 이유를 문제 삼습니다. 이 물음은 \u003cb class=\"key\">도전적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>의 시작이며, 뒤에 그가 \u003cb class=\"key\">미술과 \u003c/b>\u003cb class=\"key\">대중문화의 \u003c/b>\u003cb class=\"key\">경계\u003c/b>를 허무는 행동으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사 (목적어)\u003c/span> : ask + himself (주어와 동일인) : \"자신에게 (스스로에게)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접화법 의문문 (Why + be동사 + 주어 + not)\u003c/span> : Why + be동사 + 주어 + not? : \"왜 그것들은 아닐까?\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He asked himself, 그는 스스로에게 물었다. 'Why are they not?', '왜 그것들은 아닐까?'. 이 문장 전체를 해석하면, 그는 ‘왜 만화는 예술로 간주되지 않을까?’라고 스스로에게 물었다.","hl":"m"},{"n":28,"text":"그는 왜 만화가 예술로 간주되지 않는 걸까 하고 스스로에게 질문하면서 만화가 예술에서 배제된 이유를 문제 삼습니다. 이 물음은 도전적 태도의 시작이며 뒤에 미술과 대중문화의 경계를 허무는 행동으로 이어집니다. 직접 인용된 의문문은 그의 생각을 생생하게 전달합니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 himself입니다. 주어 He와 목적어가 같은 사람이므로 재귀대명사 himself를 써서 스스로에게 물었다는 의미를 만듭니다. 두 번째 포인트는 Why are they not?입니다. 직접화법 의문문으로 의문사 Why가 be동사 are 앞에 오는 의문문 어순을 따릅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Roy Lichtenstein은\u003c/span>\u003cspan class=\"en\">Then Roy Lichtenstein\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허물었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">broke \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벽을\u003c/span>\u003cspan class=\"en\">the wall\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순수 예술과 대중문화 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">culture\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만화를 예술에 첨가함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">adding \u003c/span>\u003cspan class=\"tgt\">cartoons \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">art\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 Roy Lichtenstein은 만화를 예술에 첨가해서 순수 예술과 대중문화 사이의 벽을 허물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Roy Lichtenstein이 만화를 예술에 끌어들여 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 \u003cb class=\"key\">대중문화\u003c/b> 사이의 \u003cb class=\"key\">벽\u003c/b>을 허물었음을 보여 줍니다. 앞선 질문에 대한 행동으로 답하며, 이후 팝 아트의 개방적 태도를 예고하는 전환점 역할을 합니다. '벽을 허물다'는 두 영역의 경계를 없앴다는 비유적 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 break down\u003c/span> : broke down [the wall] : \"허물었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 between A and B\u003c/span> : between [high art] and [popular culture] : \"순수 예술과 대중문화 사이에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by [adding cartoons to art] : \"만화를 예술에 첨가함으로써\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Then Roy Lichtenstein, 그리고 Roy Lichtenstein은. broke down, 허물었다. the wall, 벽을. between high art and popular culture, 순수 예술과 대중문화 사이의. by adding cartoons to art, 만화를 예술에 첨가함으로써. 이 문장 전체를 해석하면, 그리고 Roy Lichtenstein은 만화를 예술에 첨가해서 순수 예술과 대중문화 사이의 벽을 허물었다.","hl":"m"},{"n":31,"text":"이 문장은 Roy Lichtenstein이 만화를 예술에 끌어들여서 순수 예술과 대중문화 사이의 벽을 허물었음을 보여 줘요. 앞 문장에서 스스로 던진 질문에 대한 행동으로 답을 하는 거죠. 벽을 허물었다는 표현은 두 영역의 경계를 없앴다는 비유적 표현이에요.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 broke down이에요. break down은 구동사로 여기서는 허물었다는 뜻이고, 뒤에 목적어 the wall이 왔어요. 두 번째는 between high art and popular culture인데 between A and B 형태로 두 대상을 나란히 연결해 줘요. 세 번째는 by adding cartoons to art로 by 뒤에 동명사가 와서 만화를 예술에 첨가함으로써라는 수단과 방법을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트 예술가들은\u003c/span>\u003cspan class=\"en\">Pop artists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술은 쉬워야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">팝 아트 예술가들은 예술은 쉬워야 한다고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트 예술가들의 핵심 신념으로, 예술이 특별한 사람만의 것이 아니라 \u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 생각을 드러냅니다. 앞 문장에서 Roy Lichtenstein이 경계를 허문 행동을 설명하는 원리가 됩니다. 여기서 should는 단순한 제안이 아니라 예술이 지향해야 할 \u003cb class=\"key\">당위\u003c/b>를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 명사절을 이끄는 that 생략\u003c/span> : believed [(that) art should be easy] : \"예술이 쉬워야 한다고 믿었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should + 동사원형\u003c/span> : should [be easy] : \"쉬워야 한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Pop artists, 팝 아트 예술가들은. believed, 믿었다. art should be easy, 예술은 쉬워야 한다고. 이 문장 전체를 해석하면, 팝 아트 예술가들은 예술은 쉬워야 한다고 믿었다.","hl":"m"},{"n":34,"text":"이 문장은 팝 아트 예술가들의 핵심 신념을 보여 줘요. 예술은 특별한 사람만의 것이 아니라 누구에게나 쉬워야 한다고 믿었다는 거죠. 여기서 should는 예술이 마땅히 그래야 한다는 당위를 나타내요.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 believed art should be easy 부분이에요. believe는 목적어로 that절을 가질 수 있는데 여기서는 that이 생략됐어요. art should be easy 전체가 believed의 목적어 역할을 해요. 두 번째는 should be easy로 should는 당위를 나타내는 조동사이고 뒤에 동사원형 be가 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Anyone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창조하고 즐길 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술을\u003c/span>\u003cspan class=\"en\">art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누구라도 예술을 창조하고 즐길 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트의 개방성을 가장 직접적으로 보여 주는 말로, 예술의 창조와 향유가 \u003cb class=\"key\">누구나\u003c/b> 가능하다는 뜻입니다. 앞 문장에서 말한 '예술은 쉬워야 한다'는 신념을 구체화합니다. 특별한 재능이나 훈련 없이도 예술을 \u003cb class=\"key\">창조하고 \u003c/b>\u003cb class=\"key\">즐길 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 민주적 태도를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 anyone\u003c/span> : Anyone [can create and enjoy] : \"누구라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 / 동사 병렬\u003c/span> : can [create] and [enjoy] : \"창조하고 즐길 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Anyone, 누구라도. can create and enjoy, 창조하고 즐길 수 있다. art, 예술을. 이 문장 전체를 해석하면, 누구라도 예술을 창조하고 즐길 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 팝 아트의 개방성을 가장 직접적으로 보여 줘요. 누구라도 예술을 창조하고 즐길 수 있다는 거예요. 특별한 재능이나 훈련이 없어도 예술을 만들고 감상할 수 있다는 민주적인 태도를 강조하는 거죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법은 Anyone이에요. anyone은 누구라도라는 뜻의 부정대명사로 모든 사람을 포함해요. 두 번째는 can create and enjoy인데 can은 가능을 나타내는 조동사이고 뒤에 동사원형이 와요. create와 enjoy는 and로 병렬 연결되어서 둘 다 can의 지배를 받아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하는 게 어때요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만드는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">creating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트 작품 하나\u003c/span>\u003cspan class=\"en\">a work of pop art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘?\u003c/span>\u003cspan class=\"en\">today?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘 팝 아트 작품 하나를 만들어 보는 건 어떨까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트의 특징을 소개한 뒤, 독자에게 직접 \u003cb class=\"key\">팝 \u003c/b>\u003cb class=\"key\">아트 \u003c/b>\u003cb class=\"key\">작품 \u003c/b>\u003cb class=\"key\">만들기\u003c/b>를 해 보라고 권유하는 문장이에요. How about 다음에 동명사를 써서 \u003cb class=\"key\">제안\u003c/b>의 뜻을 나타내요. 딱딱한 명령이 아니라 친근하게 실천을 이끌어내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">How about + 동명사 (제안)\u003c/span> : How about + [creating (동명사구)] : \"~하는 게 어때요?\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"How about, 하는 게 어때요?. creating, 만드는 것. a work of pop art, 팝 아트 작품 하나. today?, 오늘?. 이 문장 전체를 해석하면, 오늘 팝 아트 작품 하나를 만들어 보는 건 어떨까?","hl":"m"},{"n":40,"text":"이 문장은 How about 다음에 동명사를 써서 독자에게 오늘 팝 아트 작품을 만들어 보라고 제안하는 거예요. 가볍게 권유하는 표현이라 딱딱한 명령이 아니라 친근한 느낌을 줘요. 앞에서 팝 아트의 생각을 소개한 뒤 실제로 해 보자고 전환하는 역할을 해요.","hl":"mn"},{"n":41,"text":"문법 포인트는 How about creating이에요. How about은 전치사 about을 포함하니까 뒤에 동사 원형이 아니라 동명사 creating이 와요. 상대방에게 무언가를 해 보라고 제안할 때 How about 다음에 동명사를 쓰는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상의 이미지들을 사용해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">using\u003c/span> daily images\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의적인 방법으로\u003c/span>\u003cspan class=\"en\">in a creative way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 만들 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술 작품 하나를\u003c/span>\u003cspan class=\"en\">a work of art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두를 위한\u003c/span>\u003cspan class=\"en\">for everyone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">창의적인 방법으로 일상의 이미지들을 사용해서 당신은 모두를 위한 예술 작품을 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팝 아트를 만드는 구체적인 방법을 알려주는 문장이에요. \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 창의적으로 사용하면 누구나 모두를 위한 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 만들 수 있다는 거죠. 팝 아트가 특별한 사람만의 것이 아니라 모든 사람에게 열려 있다는 핵심 생각을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사 (수단·방법)\u003c/span> : By + [using (동명사구)] : \"사용해서, 사용함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 (가능)\u003c/span> : can + [make (동사원형)] : \"만들 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"By using daily images, 일상의 이미지들을 사용해서. in a creative way, 창의적인 방법으로. you can make, 당신은 만들 수 있다. a work of art, 예술 작품 하나를. for everyone, 모두를 위한. 이 문장 전체를 해석하면, 창의적인 방법으로 일상의 이미지들을 사용해서 당신은 모두를 위한 예술 작품을 만들 수 있다.","hl":"m"},{"n":43,"text":"이 문장은 팝 아트를 직접 만들어 보는 방법을 구체적으로 알려주는 문장이에요. 일상의 이미지를 창의적으로 사용하면 누구나 모두를 위한 예술 작품을 만들 수 있다는 거죠. 팝 아트가 어렵지 않고 모든 사람에게 열려 있다는 핵심 생각을 보여줘요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 By using이에요. 전치사 by는 수단이나 방법을 나타내서 뒤에 꼭 동명사 using이 옵니다. 그래서 사용해서, 사용함으로써라고 해석해요. 두 번째 포인트는 can make인데, 조동사 can은 가능을 나타내고 뒤에는 반드시 동사 원형 make가 와요. 그래서 만들 수 있다로 해석됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이다\u003c/span>\u003cspan class=\"en\">This is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 교훈\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important\u003c/span> lesson\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팝 아트의\u003c/span>\u003cspan class=\"en\">from pop art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 팝 아트의 가장 중요한 교훈이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 본문 전체를 마무리하면서 팝 아트의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">교훈\u003c/b>을 요약해 주는 문장이에요. This는 앞 문장의 방법, 즉 일상 이미지를 창의적으로 사용해 모두를 위한 예술을 만드는 것을 가리켜요. \u003cb class=\"key\">최상급\u003c/b>을 써서 팝 아트에서 가장 중요한 점을 강조하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 (the + most + 형용사)\u003c/span> : the + [most important (최상급)] + lesson : \"가장 중요한\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"This is, 이것은 ~이다. the most important lesson, 가장 중요한 교훈. from pop art, 팝 아트의. 이 문장 전체를 해석하면, 이것이 팝 아트의 가장 중요한 교훈이다.","hl":"m"},{"n":46,"text":"이 문장은 본문 전체를 마무리하는 문장이에요. 앞에서 말한 팝 아트의 여러 특징을 가장 중요한 교훈으로 정리해 주죠. This가 바로 앞 문장의 방법을 가리키고, 최상급을 써서 강조하고 있어요.","hl":"mn"},{"n":47,"text":"여기서 the most important lesson이 최상급 구문이에요. important처럼 긴 형용사는 more와 most를 써서 비교급과 최상급을 만드는데, 최상급 앞에는 정관사 the가 붙어요. 그래서 가장 중요한 교훈이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Roy Lichtenstein은 작품에 \u003cb class=\"key\">만화\u003c/b>를 사용하고 \u003cb class=\"key\">말풍선\u003c/b>까지 넣었다.\u003c/li>\u003cli>당시에는 만화가 \u003cb class=\"key\">예술의 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 간주되지 않았지만, Roy는 다르게 생각하며 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 \u003cb class=\"key\">대중문화\u003c/b> 사이의 벽을 허물었다.\u003c/li>\u003cli>팝 아트 예술가들은 \u003cb class=\"key\">예술은 \u003c/b>\u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 믿었고 누구나 예술을 \u003cb class=\"key\">창조\u003c/b>하고 \u003cb class=\"key\">즐길\u003c/b> 수 있다고 보았다.\u003c/li>\u003cli>\u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 창의적으로 사용해 모두를 위한 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 만드는 것이 팝 아트의 가장 중요한 \u003cb class=\"key\">교훈\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Pop art teaches us that anyone can create and enjoy art by using daily images creatively.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Roy Lichtenstein은 만화를 작품에 사용해 \u003cb class=\"key\">순수 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 \u003cb class=\"key\">대중문화\u003c/b> 사이의 벽을 허물었다. 팝 아트는 \u003cb class=\"key\">예술은 \u003c/b>\u003cb class=\"key\">쉬워야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 믿으며 누구나 \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>를 창의적으로 사용해 모두를 위한 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 만들 수 있다는 \u003cb class=\"key\">교훈\u003c/b>을 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 지문을 정리하면 Roy Lichtenstein은 만화를 예술에 가져와 순수 예술과 대중문화의 벽을 허물었어요. 팝 아트는 예술은 쉬워야 한다는 믿음 아래 누구나 일상 이미지로 예술을 만들고 즐길 수 있다고 말합니다. 이게 바로 팝 아트의 가장 중요한 교훈이에요. 오늘 내용 잘 복습하고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
