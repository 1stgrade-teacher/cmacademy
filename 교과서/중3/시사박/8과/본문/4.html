3r7/5/wA//qoOOp7UmR6jv3Hbr+Xf0pAynnI59xzj/J469cjjgDfYXnt+v0/PrjP/AOqj3x/n8cYPJH86QMDnkccdRnjrn/6xNG9ecEHBxwR/Tt6/yoAdRTQwIzkd+hzyOD+R69h1OKXco7jk4/E//r/WgBaP6f5/z/8AWpMjjkc9Oev0pN65xnp34x/nn/IoDr9/6Dv8/wCNNYnaSO2T19Bn3/EH3pcqOpHPHJ68Z/l60h4Q7ecKcdxwP159TzRpby/Cwf0j/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Breaking Boundaries: Roy Lichtenstein and the Spirit of Pop Art<small>경계를 허물다: 로이 리히텐슈타인과 팝아트 정신</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전, 먼저 팝 아트(Pop Art)라는 예술 사조를 이해하면 훨씬 흥미로울 거예요. 팝 아트는 1950년대에 등장한 미술 사조로, 당시 사람들이 쉽게 접하던 만화, 광고, 대중 매체의 이미지를 예술 작품의 소재로 과감하게 끌어들인 &#39;대중 문화와 순수 예술의 경계를 허문 혁명적인 예술&#39;이라고 할 수 있어요. 마치 길거리에서 흔히 보는 햄버거나 유명인의 사진을 미술관에 당당하게 전시한 것과 같다고 보면 이해가 빠르죠. 이 시기의 예술가들은 &#39;예술은 소수 엘리트만의 전유물이 아니라 누구나 즐길 수 있어야 한다&#39;는 신념을 가지고 있었어요. 즉, 팝 아트(Pop Art)는 고상한 예술의 문턱을 낮추어 일상과 예술이 하나가 될 수 있음을 보여주었다는 점에서 큰 의의가 있답니다. 자, 이제 이런 맥락을 머릿속에 담고 로이 리히텐슈타인이 왜 만화를 예술로 가져왔는지 그 의미를 함께 살펴보러 가볼까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01리히텐슈타인의 만화 활용</div><ul><li>만화적 요소를 예술 작품에 도입하여 기존의 틀을 깼다.</li><li>생동감 있는 색상(lively colors)과 말풍선(speech balloons) 활용</li><li>당시 예술로 간주되지 않던 만화를 작품의 소재로 채택</li><li>핵심 키워드: 로이 리히텐슈타인(Roy Lichtenstein), 만화(cartoons)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02예술 경계의 파괴</div><ul><li>순수 예술과 대중문화 사이의 장벽을 제거하고자 시도했다.</li><li>고상한 예술(high art)과 대중문화(popular culture)를 통합</li><li>기존 예술 형식에 대한 고정관념을 반문함</li><li>핵심 키워드: 예술의 경계(the wall between art)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03팝아트의 철학과 지향점</div><ul><li>예술은 특별한 것이 아니라 누구나 쉽게 누릴 수 있는 것이어야 한다.</li><li>예술의 접근성과 대중성(easy and enjoyable) 강조</li><li>모든 사람이 창작과 감상에 참여할 수 있다고 믿음</li><li>핵심 키워드: 팝 아티스트(pop artists)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04일상 속 예술 창작</div><ul><li>일상적인 이미지를 활용하여 자신만의 작품을 만들어 볼 것을 제안한다.</li><li>일상 이미지(daily images)를 창의적인 방식으로 재구성</li><li>모든 이를 위한 예술(art for everyone)의 가치 실현</li><li>핵심 키워드: 팝아트의 교훈(lesson from pop art)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regard as</td><td class=\"m\">~으로 간주하다, ~으로 여기다</td></tr><tr><td class=\"w\">break down</td><td class=\"m\">허물다, 무너뜨리다, 부수다</td></tr><tr><td class=\"w\">high art</td><td class=\"m\">고급 예술, 순수 예술</td></tr><tr><td class=\"w\">popular culture</td><td class=\"m\">대중 문화</td></tr><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들어내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로이 리히텐슈타인은</span><span class=\"en\"><b>Roy Lichtenstein</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만화를 사용했다</span><span class=\"en\"><b><span class=\"grammar-hl\">used</span> cartoons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 작품에</span><span class=\"en\"><b>in his works.</b></span></div></div><div class=\"lec-sent-ko\">Roy Lichtenstein은 그의 작품에 만화를 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 팝아트의 대표적 인물인 리히텐슈타인의 예술적 재료와 특징을 먼저 제시하며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used (일반동사): 주어(Roy Lichtenstein)의 과거 행위를 나타내는 서술어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 컸고</span><span class=\"en\"><b>They <span class=\"grammar-hl\">were large</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생기 넘치는 색들로 그려졌다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">painted</span> in lively colors.</b></span></div></div><div class=\"lec-sent-ko\">그들은 컸고, 생기 넘치는 색들로 그려졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 만화가 예술 작품으로서 어떤 시각적 특성을 지녔는지 구체적으로 묘사하여 독자가 작품의 이미지를 떠올리게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were large 2형식 구조: be동사(were)가 보어(large)를 취하여 주어(They)의 상태를 설명합니다.</div><div class=\"lec-gr-item\">painted (과거분사): 앞의 수동태 구조(were painted)의 일부로, &#39;그려진&#39;이라는 수동적 의미를 나타냅니다.</div><div class=\"lec-gr-item\">were... painted (수동태): be동사(were)+p.p.(painted) 구조입니다. paint는 타동사인데 목적어가 없어서 수동구조 were painted 형태로 쓴다. 기본구조: paint + O(대상) + in(색상/방식).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 심지어 말풍선을 포함시켰다</span><span class=\"en\"><b>He even <span class=\"grammar-hl\">included</span> speech balloons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 그림에</span><span class=\"en\"><b>in his paintings.</b></span></div></div><div class=\"lec-sent-ko\">그는 심지어 그의 그림에 말풍선을 넣었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 만화적 요소를 예술의 영역으로 적극적으로 끌어들인 작가의 구체적인 실험 방식을 보여주며, 당시 예술계의 관습과는 차별화되는 지점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">included (일반동사): 주어(He)가 행한 과거의 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 당시에는</span><span class=\"en\"><b>Back then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만화는 간주되지 않았다</span><span class=\"en\"><b>cartoons were not regarded</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술의 한 형태로</span><span class=\"en\"><b>as an art form.</b></span></div></div><div class=\"lec-sent-ko\">그 당시 만화는 예술의 형태로 간주되지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술된 작가의 독특한 작업 방식이 당시 사회의 일반적인 인식과 정면으로 배치되었음을 보여주는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were... regarded (수동태): be동사(were)+p.p.(regarded) 구조입니다. regard는 타동사인데 목적어가 없어서 수동구조 were regarded 형태로 쓴다. 기본구조: regard + O + as + C (O를 C로 간주하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">로이 리히텐슈타인은 다르게 생각했다</span><span class=\"en\"><b>Roy Lichtenstein <span class=\"grammar-hl\">thought</span> differently.</b></span></div></div><div class=\"lec-sent-ko\">하지만 Roy Lichtenstein은 다르게 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중적 인식을 거부하고 자신만의 예술적 소신을 굽히지 않았던 작가의 태도를 드러내며, 이후 전개될 그의 행보에 대한 이유를 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought (일반동사): 주어(Roy Lichtenstein)가 과거에 수행한 사고 과정을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 스스로에게 물었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">asked himself</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;왜 그것들은 그렇지 않은가?&#39;</span><span class=\"en\"><b>'Why <span class=\"grammar-hl\">are they</span> not?'</b></span></div></div><div class=\"lec-sent-ko\">그는 ‘왜 만화는 예술로 간주되지 않을까?’라고 스스로에게 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작가가 가졌던 비판적 의문을 보여주며, 기존 예술계가 정해놓은 경계에 의구심을 던지는 작가의 철학적 고민을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked himself 5형식(SVOC) 구조: 주어(He)가 동사(asked)하고, 목적어(himself)에게 질문하는 구조입니다.</div><div class=\"lec-gr-item\">are they (도치): 의문문 구조를 만들기 위해 주어(they)와 be동사(are)의 위치가 바뀐 도치 현상입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 나서 로이 리히텐슈타인은</span><span class=\"en\"><b>Then Roy Lichtenstein</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽을 허물었다</span><span class=\"en\"><b><span class=\"grammar-hl\">broke down</span> the wall</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">순수 예술과 대중문화 사이의</span><span class=\"en\"><b>between high art and popular culture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만화를 예술에 첨가함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">adding</span> cartoons to art.</b></span></div></div><div class=\"lec-sent-ko\">그리고 Roy Lichtenstein은 만화를 예술에 첨가해서 순수 예술과 대중문화 사이의 벽을 허물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작가의 행동이 예술계에 끼친 역사적 영향력을 서술합니다. 고상한 예술과 저급하다고 치부되던 만화의 경계를 없애고 예술의 범위를 확장했다는 결론을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke down (관용표현): &#39;허물다/무너뜨리다&#39;라는 의미를 가진 구동사(phrasal verb)입니다.</div><div class=\"lec-gr-item\">adding (동명사): 전치사(by)의 목적어 자리에 쓰여 &#39;더하는 것&#39;이라는 행위적 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">high art</td><td class=\"m\">고급 예술, 순수 예술</td></tr><tr><td class=\"w\">popular culture</td><td class=\"m\">대중 문화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">팝 아트 예술가들은 믿었다</span><span class=\"en\"><b>Pop artists <span class=\"grammar-hl\">believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술은 쉬워야 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">art should be easy</span>.</b></span></div></div><div class=\"lec-sent-ko\">팝 아트 예술가들은 예술은 쉬워야 한다고 믿었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 리히텐슈타인 개인의 시도에서 시작된 생각이 팝아트라는 사조 전체의 공유 가치로 확대되는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believed art should be easy 당위성 that절: believe 뒤에 생략된 that절에서 &#39;미술은 쉬워야 한다&#39;는 당위적 내용을 다루며, should(생략 가능)와 동사원형(be)이 쓰인 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누구라도</span><span class=\"en\"><b>Anyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술을 창조하고 즐길 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">create and enjoy</span> art.</b></span></div></div><div class=\"lec-sent-ko\">누구라도 예술을 창조하고 즐길 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술은 소수 엘리트의 전유물이 아니라 모든 대중에게 열려 있는 영역이라는 팝아트의 민주적 성격을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">create and enjoy (to부정사(생략)): 조동사(can) 뒤에 이어지는 동사원형들로, 본래 문맥상 예술을 창조하고 즐길 수 있다는 능력을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들어내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">팝 아트 작품을 하나 만들어 보는 것은 어떨까</span><span class=\"en\"><b>How about <span class=\"grammar-hl\">creating</span> a work of pop art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘?</span><span class=\"en\"><b>today?</b></span></div></div><div class=\"lec-sent-ko\">오늘 팝 아트 작품 하나를 만들어 보는 건 어떨까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 팝아트의 정신을 독자가 직접 실천해보도록 제안하며, 예술에 대한 거리감을 좁히는 친근한 어조로 바뀝니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">creating (동명사): 관용표현 &#39;How about + -ing(~하는 게 어때?)&#39;에서 전치사 about의 목적어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일상의 이미지들을 사용함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">By using</span> daily images</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의적인 방식으로</span><span class=\"en\"><b>in a creative way,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 예술 작품을 만들 수 있다</span><span class=\"en\"><b>you can make a work of art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두를 위한</span><span class=\"en\"><b>for everyone.</b></span></div></div><div class=\"lec-sent-ko\">창의적인 방법으로 일상의 이미지들을 사용해서 당신은 모두를 위한 예술 작품을 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팝아트의 창작 방식을 독자에게 구체적으로 안내하며, 누구나 예술가가 될 수 있다는 긍정적인 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By using (동명사): 전치사(By)의 목적어로 쓰여 수단과 방법을 나타냅니다.</div><div class=\"lec-gr-item\">to make (to부정사): 목적을 나타내는 부사적 용법으로 &#39;~하기 위해서&#39;라고 해석됩니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것이 가장 중요한 교훈이다</span><span class=\"en\"><b>This is <span class=\"grammar-hl\">the most important lesson</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팝 아트로부터 얻는</span><span class=\"en\"><b><span class=\"grammar-hl\">from pop art</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것이 팝 아트의 가장 중요한 교훈이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 모든 내용을 종합하여 팝아트의 핵심 가치가 결국 &#39;예술의 대중화&#39;와 &#39;창의적 시각의 변화&#39;에 있음을 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the most important lesson from pop art (최상급): 형용사(important) 앞에 the most를 붙여 해당 명사(lesson)가 가장 중요함을 나타냅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>로이 리히텐슈타인은 만화를 작품에 도입하여 당시 고급 예술의 경계를 허물었다.</li><li>팝아트는 예술이 특정 계층만의 것이 아니라 누구나 쉽게 즐기고 만들 수 있다는 점을 강조한다.</li><li>일상 속 이미지를 창의적으로 활용하는 것이 팝아트가 우리에게 남긴 핵심 가치이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Roy Lichtenstein incorporated cartoons into fine art to challenge traditional boundaries, and pop art encourages everyone to creatively express daily life as art.</div>\n              <div class=\"lec-final-sum-ko\">로이 리히텐슈타인은 전통적 경계에 도전하고자 만화를 순수 예술에 접목했으며, 팝아트는 누구나 일상을 창의적으로 예술화할 수 있도록 장려한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1
