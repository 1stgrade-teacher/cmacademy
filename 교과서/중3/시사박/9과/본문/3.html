@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 9과 본문3","audioDir":"3_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>9과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Start Small, Change Lives\u003c/h1>\u003ch2>작게 시작해 삶을 바꾸다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>화자는 \u003cb class=\"key\">사업\u003c/b>을 시작해 아프리카 소녀들의 \u003cb class=\"key\">학비\u003c/b>와 교재비를 지원한다. 필요를 보면 \u003cb class=\"key\">행동\u003c/b>하고 \u003cb class=\"key\">작게 \u003c/b>\u003cb class=\"key\">시작\u003c/b>하면 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 삶을 바꿀 수 있다고 조언한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When you see a need, start small and act, and your warm heart can change lives.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 아프리카 소녀들의 교육을 돕기 위해 사업을 시작한 화자의 경험과 충고를 담고 있어요. 요약하면, 화자는 사업을 통해 가난한 소녀들의 학비와 교재비를 지원하고, 우리에게 필요를 보면 행동하고 작게 시작하라고 조언해요. 이 글의 요지는 시작은 작아도 따뜻한 마음이 삶을 바꿀 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아프리카의 많은 \u003cb class=\"key\">개발도상국\u003c/b>에서는 \u003cb class=\"key\">학비\u003c/b> 때문에 학교에 가지 못하는 아이들이 많아요. 이런 문제를 해결하기 위해 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기업\u003c/b>을 운영하는 사람들이 늘고 있는데, 이는 이익을 내면서도 \u003cb class=\"key\">공익\u003c/b>을 추구하는 방식이에요. 케냐와 우간다 같은 나라에서는 교복이나 교과서 비용도 큰 부담이라 \u003cb class=\"key\">교육 \u003c/b>\u003cb class=\"key\">격차\u003c/b>가 심해지기 쉬워요. 작은 지원이 모이면 한 아이의 \u003cb class=\"key\">인생\u003c/b>을 바꿀 수 있다는 점에서, 이 글은 마치 작은 물방울이 바위를 뚫는 것과 같은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">실천\u003c/b>의 힘을 보여 줘요.\u003c/div>","segs":[{"n":2,"text":"아프리카의 많은 개발도상국에서는 학비를 내지 못해 학교에 가지 못하는 아이들이 많아요. 이런 문제를 해결하기 위해 사회적 기업을 운영하는 사람들이 늘고 있어요. 사회적 기업은 이익을 내면서도 공익을 추구하는 방식이에요. 케냐와 우간다 같은 나라에서는 교과서나 교복 비용도 부담이 커서 교육 격차가 심해지기 쉬워요. 작은 지원이 모이면 한 아이의 인생이 바뀔 수 있다는 걸, 작은 물방울이 바위를 뚫는 것처럼 이 글에서 보여 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사업으로 만든 변화\u003csmall>예시 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>화자는 아프리카의 소녀들이 \u003cb class=\"key\">학교에 \u003c/b>\u003cb class=\"key\">갈 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 문제를 해결하려고 \u003cb class=\"key\">사업\u003c/b>을 시작했어요. 사업이 성공하면서 케냐와 우간다의 가난한 소녀들을 위해 \u003cb class=\"key\">학비\u003c/b>를 내 주게 되었어요. 교과서와 교복, 연필 값까지 지원하며 실질적인 도움을 주고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>놀라움의 표현\u003csmall>전환 · 문장 4\u003c/small>\u003c/h4>\u003cp>이런 성과를 돌아보며 'Isn't it amazing?'이라고 물으며 독자의 \u003cb class=\"key\">공감\u003c/b>을 이끌어요. 이 질문은 뒤에 나올 조언으로 자연스럽게 넘어가는 \u003cb class=\"key\">가교\u003c/b> 역할을 해요. 화자는 자신의 경험이 특별한 사람만의 일이 아니라 누구나 할 수 있는 일임을 암시해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>행동하라는 조언\u003csmall>주장 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>핵심 조언은 '그냥 무언가 하라'는 것이에요. 필요를 보면 머뭇거리지 말고 즉시 \u003cb class=\"key\">행동\u003c/b>하라고 말해요. 처음부터 크게 시작할 필요 없이 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 밟아가며 시작하라고 강조해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>따뜻한 마음의 힘\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>마지막으로 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 사람들의 \u003cb class=\"key\">인생\u003c/b>을 바꿀 수 있다고 정리해요. 작은 행동이라도 사랑과 관심에서 비롯되면 큰 변화를 만들 수 있다는 메시지를 전해요. 이 문장은 글 전체의 주제를 다시 한번 강조하는 \u003cb class=\"key\">결론\u003c/b> 역할을 해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 화자의 구체적인 경험에서 시작해 우리에게 주는 조언으로 흘러가요.","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장에서는 화자가 아프리카의 학교에 갈 수 없는 소녀들을 돕기 위해 사업을 시작한 이야기를 해요. 사업이 성공하면서 케냐와 우간다의 가난한 소녀들을 위해 학비를 내 주게 되었어요. 교과서와 교복, 연필 값까지 지원하며 실제로 도움을 주고 있다는 사실을 알 수 있어요.","hl":"f0"},{"n":5,"text":"네 번째 문장에서는 Isn't it amazing? 이라고 물으며 독자의 공감을 이끌어요. 이 질문은 앞의 성과를 돌아보게 하면서 뒤에 나올 조언으로 넘어가는 가교 역할을 해요. 화자는 자신의 경험이 특별한 사람만의 일이 아니라 누구나 할 수 있는 일임을 암시하고 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장부터 일곱 번째 문장에서는 핵심 조언이 나와요. 그냥 무언가 하라는 것이 첫 조언이고, 필요를 보면 머뭇거리지 말고 즉시 행동하라고 말해요. 처음부터 크게 시작할 필요 없이 작은 단계를 밟아가며 시작하라고 강조해요.","hl":"f2"},{"n":7,"text":"여덟 번째 문장은 글 전체를 정리하는 결론이에요. 따뜻한 마음이 사람들의 인생을 바꿀 수 있다고 말해요. 작은 행동이라도 사랑과 관심에서 비롯되면 큰 변화를 만들 수 있다는 메시지를 전해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 화자가 아프리카 소녀들을 도운 \u003cb class=\"key\">사업\u003c/b> 경험을 \u003cb class=\"key\">예시\u003c/b>로 제시하고, 이를 바탕으로 행동하라는 조언을 건넨 뒤 마지막 문장에서 핵심 메시지를 정리하고 있다. 따라서 마지막 문장인 여덟 번째 문장이 주제문이며, 글의 핵심을 끝에 두는 \u003cb class=\"key\">미괄식\u003c/b> 구조이다. 앞부분의 구체적인 사례가 뒷부분의 \u003cb class=\"key\">주장\u003c/b>을 뒷받침하는 역할을 한다. My advice로 시작하는 다섯 번째 문장도 중요하지만, 전체를 아우르는 결론은 여덟 번째 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Thanks to (2)\u003c/b>\u003cspan>인과 관계\u003c/span>\u003cb>also (3)\u003c/b>\u003cspan>첨가\u003c/span>\u003cb>Isn't it amazing? (4)\u003c/b>\u003cspan>수사 의문문\u003c/span>\u003cb>My advice (5)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003cb>When you see a need (6)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>Start small (7)\u003c/b>\u003cspan>방법 제시\u003c/span>\u003cb>Your warm heart (8)\u003c/b>\u003cspan>결론 요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">help girls in Africa who couldn't go to school\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pay the school fees for many poor girls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pay for their textbooks, uniforms, and pencils\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">just do something\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">When you see a need, act\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Start small, taking little steps\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Your warm heart can change lives\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 예시에요. 화자가 아프리카 소녀들을 도운 사업 경험을 예시로 제시하고, 이를 바탕으로 행동하라는 조언을 건넨 뒤 마지막 문장에서 핵심 메시지를 정리하고 있어요. 따라서 마지막 문장이 주제문이고, 글의 핵심을 끝에 두는 미괄식 구조예요. 앞부분의 구체적인 사례가 뒷부분의 주장을 뒷받침하는 역할을 하고 있죠.","hl":"ty"},{"n":9,"text":"이런 구조를 파악할 때 신호어를 보면 좋아요. Thanks to는 원인과 결과를, also는 정보가 첨가되는 것을 나타내고, Isn't it amazing?은 수사 의문문으로 공감을 유도해요. My advice는 주장을 제시하고, When you see a need는 조건을, Start small은 방법을 제시하며, Your warm heart는 결론을 요약해 줘요. 또한 help girls who couldn't go to school에서 pay the school fees, pay for their textbooks, uniforms, and pencils로 도움의 내용이 구체화되다가 just do something, When you see a need, act, Start small, taking little steps 같은 행동 지침으로 다시 표현되고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>business\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사업\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>girl\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소녀\u003c/span>\u003c/div>\u003cdiv>\u003cb>Africa\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아프리카\u003c/span>\u003c/div>\u003cdiv>\u003cb>could\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 수 있었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go to school\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>학교에 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>can\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지불하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>school fee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학비, 수업료\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가난한\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라\u003c/span>\u003c/div>\u003cdiv>\u003cb>Kenya\u003c/b>\u003cem>명사\u003c/em>\u003cspan>케냐\u003c/span>\u003c/div>\u003cdiv>\u003cb>Uganda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우간다\u003c/span>\u003c/div>\u003cdiv>\u003cb>textbook\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교과서\u003c/span>\u003c/div>\u003cdiv>\u003cb>uniform\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교복\u003c/span>\u003c/div>\u003cdiv>\u003cb>pencil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연필\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>advice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충고, 조언\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필요, 욕구\u003c/span>\u003c/div>\u003cdiv>\u003cb>act\u003c/b>\u003cem>동사\u003c/em>\u003cspan>행동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>start small\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>작게 시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>작은, 사소한\u003c/span>\u003c/div>\u003cdiv>\u003cb>step\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단계, 걸음\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>따뜻한\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>life\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인생, 생명\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 단어를 몇 개 짚어 볼게요. start는 시작하다, business는 사업, thanks to는 ~ 덕분에, school fee는 학비라는 뜻이에요. poor는 가난한, amazing은 놀라운, advice는 충고라는 뜻으로 시험에 자주 나와요. need는 필요 또는 욕구, act는 행동하다, start small은 작게 시작하다, warm heart는 따뜻한 마음이라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">block\u003c/span>\u003cspan class=\"a\">obstruct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">success\u003c/b>\u003cspan class=\"m\">성공\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">accomplishment\u003c/span>\u003cspan class=\"s\">prosperity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003cspan class=\"a\">defeat\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">가난한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">needy\u003c/span>\u003cspan class=\"s\">impoverished\u003c/span>\u003cspan class=\"s\">underprivileged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rich\u003c/span>\u003cspan class=\"a\">wealthy\u003c/span>\u003cspan class=\"a\">affluent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"s\">surprising\u003c/span>\u003cspan class=\"s\">incredible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">act\u003c/b>\u003cspan class=\"m\">행동하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">do\u003c/span>\u003cspan class=\"s\">perform\u003c/span>\u003cspan class=\"s\">take action\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">delay\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">change\u003c/b>\u003cspan class=\"m\">바꾸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 둘게요. help는 assist, aid, support가 동의어이고 hinder, block, obstruct이 반대말이며, success는 achievement, accomplishment, prosperity가 동의어이고 failure, defeat가 반대말이에요. poor는 needy, impoverished, underprivileged가 동의어이고 rich, wealthy, affluent가 반대말이며, amazing은 astonishing, surprising, incredible이 동의어이고 ordinary, common, dull이 반대말이에요. act는 do, perform, take action이 동의어이고 hesitate, delay, ignore가 반대말이며, change는 alter, transform, modify가 동의어이고 maintain, keep, preserve가 반대말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 사업을 시작했다\u003c/span>\u003cspan class=\"en\">I started a business\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소녀들을 돕기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">girls\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카에 있는\u003c/span>\u003cspan class=\"en\">in Africa\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에 갈 수 없었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 학교에 갈 수 없는 아프리카의 소녀들을 돕기 위해 사업을 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 화자가 \u003cb class=\"key\">사업\u003c/b>을 시작한 목적이 \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">help \u003c/b>\u003cb class=\"key\">girls\u003c/b>임을 밝히는 도입 문장입니다. 아프리카의 학교에 갈 수 없는 소녀들을 돕기 위한 것이라는 점을 먼저 제시해요. 뒤에 이어질 구체적인 도움 내용의 밑바탕이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : started a business + to help girls (목적) : \"소녀들을 돕기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 who (주격)\u003c/span> : 선행사 girls + who + 불완전한 절 : \"학교에 갈 수 없었던\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"I started a business, 나는 사업을 시작했다. to help girls, 소녀들을 돕기 위해. in Africa, 아프리카에 있는. who couldn't go to school, 학교에 갈 수 없었던. 이 문장 전체를 해석하면, 나는 학교에 갈 수 없는 아프리카의 소녀들을 돕기 위해 사업을 시작했다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 사업을 시작한 목적이 아프리카에서 학교에 갈 수 없는 소녀들을 돕기 위한 것이라고 소개하는 문장입니다. to help girls에서 to부정사가 목적을 나타내고, who couldn't go to school이 앞의 girls를 꾸며 주는 구조예요. 이 문장을 통해 글의 주인공이 왜 사업을 시작했는지가 분명하게 드러납니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 to help girls입니다. 이 to부정사는 started a business의 목적을 나타내서, 소녀들을 돕기 위해라고 해석해요. 두 번째 어법 포인트는 who couldn't go to school입니다. who는 관계대명사로 선행사 girls를 수식하고, 절 안에서 주어 역할을 해요. couldn't는 could not의 축약형으로 과거에 할 수 없었다는 능력의 부정을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 사업의 성공 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thanks \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> the success of my business,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 수업료를 지불할 수 있다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">pay\u003c/span> the school fees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 가난한 소녀들을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003cspan class=\"tgt\">girls \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">케냐와 우간다 같은 나라에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">countries \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">Kenya \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Uganda \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에 가기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 사업의 성공 덕분에 나는 케냐와 우간다 같은 나라에 있는 많은 가난한 소녀들이 학교에 가기 위한 수업료를 지불할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사업의 성공 덕분에 케냐와 우간다 같은 나라의 가난한 소녀들의 \u003cb class=\"key\">수업료\u003c/b>를 내줄 수 있게 되었다는 구체적인 성과를 말합니다. \u003cb class=\"key\">Thanks \u003c/b>\u003cb class=\"key\">to\u003c/b>가 원인을 이끌고, \u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">many \u003c/b>\u003cb class=\"key\">poor \u003c/b>\u003cb class=\"key\">girls \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">go \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">school\u003c/b>은 to부정사의 의미상 주어로 누가 학교에 가는지를 분명히 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (Thanks to)\u003c/span> : Thanks to + 명사구 : \"~덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can (능력)\u003c/span> : can + 동사원형 : \"지불할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어 (for + 목적격)\u003c/span> : for + 목적격 + to부정사 : \"많은 가난한 소녀들이 학교에 가도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Thanks to the success of my business, 내 사업의 성공 덕분에. I can pay the school fees, 나는 수업료를 지불할 수 있다. for many poor girls, 많은 가난한 소녀들을 위해. in countries like Kenya and Uganda, 케냐와 우간다 같은 나라에 있는. to go to school, 학교에 가기 위해. 이 문장 전체를 해석하면, 내 사업의 성공 덕분에 나는 케냐와 우간다 같은 나라에 있는 많은 가난한 소녀들이 학교에 가기 위한 수업료를 지불할 수 있다.","hl":"m"},{"n":16,"text":"두 번째 문장은 사업이 성공해서 케냐와 우간다 같은 나라의 가난한 소녀들의 수업료를 지불할 수 있게 되었다는 구체적인 성과를 말해 줍니다. Thanks to는 덕분에라는 뜻으로 원인을 나타내고, for many poor girls to go to school에서는 to부정사의 의미상 주어가 쓰여서 학교에 가는 주체가 소녀들이라는 걸 분명히 보여 줘요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 Thanks to입니다. Thanks to는 덕분에라는 뜻의 표현으로 뒤에 명사구가 와서 원인이나 이유를 나타내요. 두 번째 어법 포인트는 can pay입니다. can은 능력을 나타내는 조동사라서 뒤에 동사원형 pay가 왔어요. 세 번째 어법 포인트는 for many poor girls in countries like Kenya and Uganda to go to school입니다. 여기서 to go to school의 행동 주체는 문장 주어 I가 아니라 many poor girls라서, for many poor girls로 의미상 주어를 나타낸 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 또한 지불한다\u003c/span>\u003cspan class=\"en\">I also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pay \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 교과서를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> their \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">textbooks, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교복\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">uniforms, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 연필\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pencils\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 또한 그들의 교과서와 교복, 연필을 위한 비용도 지불한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수업료에 이어 교과서, 교복, 연필까지 지원한다는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 제공합니다. \u003cb class=\"key\">also\u003c/b>가 앞 내용에 더해진다는 것을 나타내고, \u003cb class=\"key\">pay \u003c/b>\u003cb class=\"key\">for\u003c/b>는 '~의 비용을 지불하다'라는 뜻으로 쓰였어요. 세 항목을 쉼표와 and로 병렬 연결한 점도 눈여겨볼 만합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 pay for (전치사 for)\u003c/span> : pay for + 명사 : \"~의 비용을 지불하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B, and C)\u003c/span> : A, B, and C : \"교과서, 교복, 연필\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I also pay, 나는 또한 지불한다. for their textbooks, 그들의 교과서를 위해. uniforms, 교복. and pencils, 그리고 연필. 이 문장 전체를 해석하면, 나는 또한 그들의 교과서와 교복, 연필을 위한 비용도 지불한다.","hl":"m"},{"n":19,"text":"세 번째 문장은 수업료뿐만 아니라 교과서와 교복, 연필 비용까지 지불한다는 추가 정보를 주는 문장입니다. also가 앞 문장에 더해진다는 뜻을 나타내고, pay for는 어떤 것을 위해 비용을 지불한다는 표현이에요. textbooks, uniforms, pencils이 쉼표와 and로 병렬 연결되어 있다는 점도 확인하면 좋아요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 pay for입니다. pay는 지불하다라는 뜻이고, for가 붙으면 어떤 것을 위해 비용을 지불한다는 뜻이 돼요. 두 번째 어법 포인트는 textbooks, uniforms, and pencils입니다. 이건 세 개의 명사를 쉼표와 and로 병렬 연결한 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Isn't \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운가요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">amazing\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">놀랍지 않은가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 정말 모르는 것을 묻는 말이 아니라, 아프리카 소녀들의 학비와 교재비를 대신 내주게 된 사실이 놀랍다고 감탄하며 상대방의 동의를 구하는 표현입니다. \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이므로 대답을 기다리기보다는 앞에 나온 성공담을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문\u003c/span> : Isn't it + 형용사? : \"그렇지 않나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 유래 형용사\u003c/span> : amaze + -ing → amazing : \"놀라운\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Isn't it, 그렇지 않나요?. amazing?, 놀라운가요?. 이 문장 전체를 해석하면, 놀랍지 않은가?","hl":"m"},{"n":22,"text":"이 문장은 정말 모르는 것을 묻는 것이 아니라, 내가 아프리카 소녀들의 학비와 교재비를 대신 내주게 된 사실이 놀랍다고 감탄하며 여러분도 그렇다고 느끼길 바라는 표현이에요. 수사 의문문이라서 대답을 기다리지 않고 앞의 내용을 강조합니다.","hl":"mn"},{"n":23,"text":"부정의문문 포인트입니다. Isn't it은 It is의 부정형이지만, 이 자리에서는 상대에게 그렇지 않냐고 동의를 구하는 표현이에요. 여기서는 실제 질문이 아니라 놀라움을 강조하는 수사 의문문으로 쓰였습니다. 그리고 amazing은 amaze에 ing가 붙은 형용사입니다. 부정의문문과 수사 의문문을 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분께 드리는 내 충고는\u003c/span>\u003cspan class=\"en\">My advice \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥 무언가 하라는 것.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분께 드리는 내 충고는 그냥 무언가 하라는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 작가가 하고 싶은 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">조언\u003c/b>을 직접 제시하는 부분입니다. 완벽한 계획을 세우기 전에 일단 작은 일이라도 무언가 시작하라는 뜻이며, just가 부담을 낮춰 줍니다. 앞의 성공 사례를 바탕으로 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">교훈\u003c/b>을 이끌어 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to의 대상 표시\u003c/span> : advice + to + 대상 : \"여러분께 드리는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어)\u003c/span> : My advice to you is + to부정사구 : \"그냥 무언가 하라는 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"My advice to you, 여러분께 드리는 내 충고는. is, ~이다. to just do something, 그냥 무언가 하라는 것.. 이 문장 전체를 해석하면, 여러분께 드리는 내 충고는 그냥 무언가 하라는 것이다.","hl":"m"},{"n":25,"text":"이 문장은 작가가 하고 싶은 핵심 조언을 직접 제시하는 부분이에요. 완벽한 계획을 세우기 전에 일단 작은 일이라도 무언가 시작하라는 뜻입니다. 특히 just가 들어가서 그냥, 단지라는 느낌을 주며 부담을 낮춰 줍니다. 그래서 앞의 사례를 바탕으로 일반적인 교훈을 이끌어 내는 역할을 해요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 to you입니다. 충고가 누구에게 전해지는지 대상을 나타내는 전치사 to가 쓰였어요. 두 번째 포인트는 to just do something에 쓰인 to부정사의 명사적 용법입니다. be동사 is 뒤에서 주어 My advice를 설명하는 주격 보어 자리에 왔습니다. 여기서 just는 to부정사 안에서 동사를 꾸며 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요성이 보일 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행동하라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">act\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">필요성이 보일 때 행동하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 충고를 더 간결하고 직접적인 실천 지침으로 바꾸어 줍니다. 주변에 도움이 필요한 상황이 보이면 망설이지 말고 바로 행동하라는 뜻입니다. 짧은 \u003cb class=\"key\">명령문\u003c/b>을 사용해 행동의 즉시성과 결단력을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : When + 주어 + 동사, 명령문 : \"네가 필요성을 볼 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 + . : \"행동하라\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When you see a need, 필요성이 보일 때. act, 행동하라.. 이 문장 전체를 해석하면, 필요성이 보일 때 행동하라.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 충고를 더 간결하게 실천 지침으로 바꾸고 있어요. 주변에 도움이 필요한 상황이 보이면 생각하거나 망설이지 말고 바로 행동하라는 뜻입니다. 짧은 명령문이라 강한 의지와 행동력을 강조합니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 When you see a need로 시작하는 시간 부사절입니다. 어떤 때 행동해야 하는지를 말해 주고, 미래 일이어도 현재 시제 see를 쓴다는 점을 기억하세요. 두 번째 포인트는 act로 시작하는 명령문입니다. 주어 없이 동사원형으로 시작해서 상대방에게 직접 행동을 명령하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 것부터 시작하라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Start \u003c/span>\u003cspan class=\"tgt\">small\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 단계를 밟아가면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">steps\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작은 단계를 밟아가면서 작은 것부터 시작하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 것부터 시작하고 작은 단계를 밟아가라는 조언입니다. 큰 목표를 한 번에 이루려 하지 말고 쉬운 행동부터 꾸준히 실천하라는 뜻으로, 앞 문장 ‘그냥 무언가를 하라’, ‘필요를 보면 행동하라’의 구체적인 방법을 제시합니다. \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">것부터\u003c/b> \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">단계\u003c/b>가 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (start small)\u003c/span> : start [동사] + small [형용사] → 작게 시작하다 : \"작게 시작하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (동시동작/방법)\u003c/span> : taking [현재분사] + little steps [목적어] : \"작은 단계를 밟아가면서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Start small, 작은 것부터 시작하라. taking little steps, 작은 단계를 밟아가면서.. 이 문장 전체를 해석하면, 작은 단계를 밟아가면서 작은 것부터 시작하라.","hl":"m"},{"n":31,"text":"이 문장은 큰 것을 한꺼번에 시작하려고 부담 갖지 말고 작은 것부터 시작해서 작은 단계를 밟아가라는 조언이에요. 앞에서 말한 just do something이나 When you see a need, act를 구체적으로 실천하는 방법을 알려 주는 문장이죠.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 start small이라는 관용 표현이에요. start는 자동사로 쓰였고 small이 시작하는 방식을 나타내서 작게 시작하다라는 뜻이 돼요. 큰 계획보다 작은 것부터 시작하라는 거죠. 두 번째 어법 포인트는 분사구문 taking little steps예요. 주절 동작과 동시에 일어나는 행동을 나타내고, 의미상 주어는 문장의 주어 you와 같고 능동 관계라서 현재분사 taking을 쓴 거예요. 우리말로는 작은 단계를 밟아가면서라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 따뜻한 마음이\u003c/span>\u003cspan class=\"en\">Your warm heart\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바꿀 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인생을.\u003c/span>\u003cspan class=\"en\">lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 따뜻한 마음이 인생을 바꿀 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 따뜻한 마음만으로도 다른 사람의 인생을 바꿀 수 있다는 격려입니다. 글 전체의 마무리로, 작은 친절과 행동이 큰 변화를 만들 수 있다는 핵심 메시지를 전합니다. \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>과 \u003cb class=\"key\">인생을 \u003c/b>\u003cb class=\"key\">바꿀 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>가 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 (가능/능력)\u003c/span> : can [조동사] + change [동사원형] : \"바꿀 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Your warm heart, 당신의 따뜻한 마음이. can change, 바꿀 수 있다. lives, 인생을.. 이 문장 전체를 해석하면, 당신의 따뜻한 마음이 인생을 바꿀 수 있다.","hl":"m"},{"n":34,"text":"이 문장은 당신의 따뜻한 마음이 다른 사람의 인생을 바꿀 수 있다는 격려예요. 이 글 전체의 마무리로 작은 친절과 행동이 큰 변화를 만들 수 있다는 핵심 메시지를 전해요. warm heart는 남을 돕고자 하는 따뜻한 마음씨를 뜻하죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 can change예요. 조동사 can은 능력이나 가능을 나타내고 뒤에는 반드시 동사원형이 와요. 여기서는 따뜻한 마음이 인생을 변화시킬 수 있다는 가능을 나타내요. 그래서 can change는 바꿀 수 있다로 해석돼요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 학교에 갈 수 없는 아프리카 소녀들을 돕기 위해 \u003cb class=\"key\">사업\u003c/b>을 시작했다.\u003c/li>\u003cli>사업의 성공으로 케냐와 우간다의 가난한 소녀들의 \u003cb class=\"key\">학비\u003c/b>와 교재비를 지원하고 있다.\u003c/li>\u003cli>저자는 필요를 보면 바로 \u003cb class=\"key\">행동\u003c/b>하고 \u003cb class=\"key\">작게 \u003c/b>\u003cb class=\"key\">시작\u003c/b>하라고 조언한다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 사람들의 \u003cb class=\"key\">인생\u003c/b>을 바꿀 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When you see a need, start small and act, and your warm heart can change lives.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">화자는 \u003cb class=\"key\">사업\u003c/b>을 시작해 아프리카 소녀들의 \u003cb class=\"key\">학비\u003c/b>와 교재비를 지원한다. 필요를 보면 \u003cb class=\"key\">행동\u003c/b>하고 \u003cb class=\"key\">작게 \u003c/b>\u003cb class=\"key\">시작\u003c/b>하면 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 삶을 바꿀 수 있다고 조언한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 정리하면, 화자는 아프리카 소녀들을 돕기 위해 사업을 시작했고 그 성공으로 학비와 교재비를 지원하고 있어요. 그리고 필요를 보면 행동하고, 작게 시작하는 것이 중요하다고 조언해요. 따뜻한 마음이 삶을 바꿀 수 있다는 메시지를 기억하면서, 여러분도 오늘 작은 실천 하나를 시작해 보면 좋겠어요. 이상으로 강의를 마칠게요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
