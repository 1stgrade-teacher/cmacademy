@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 9과 본문1","audioDir":"1_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>9과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>A Robotic Hand from a Helpful Mind\u003c/h1>\u003ch2>도우려는 마음에서 만들어진 로봇 손\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>세상을 바꾸는 사람이 되기에 너무 어린 나이는 없으며, \u003cb class=\"key\">Easton \u003c/b>\u003cb class=\"key\">LaChappelle\u003c/b>은 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">프린팅\u003c/b>으로 \u003cb class=\"key\">8만 \u003c/b>\u003cb class=\"key\">달러\u003c/b> 로봇 손을 \u003cb class=\"key\">300달러\u003c/b>로 바꾸고 설계를 \u003cb class=\"key\">무료 \u003c/b>\u003cb class=\"key\">공유\u003c/b>해 함께 더 나은 세상을 만들자고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A teenager used 3D printing to make a cheap, useful robotic hand and shared it freely, showing that we can build a better world by working together.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 3학년 시사 박준언 교과서 9과 본문, A Robotic Hand from a Helpful Mind를 함께 공부해 볼게요. 이 글은 세상을 바꾸는 사람이 되기에 나이가 너무 어리지 않다는 질문으로 시작해, 열네 살 Easton LaChappelle이 로봇 손을 만든 이야기를 들려줘요. 결국 혼자가 아니라 함께 일하면 더 나은 세상을 만들 수 있다는 메시지를 담고 있죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 몸의 손 대신 쓰는 인공 손을 \u003cb class=\"key\">prosthetic \u003c/b>\u003cb class=\"key\">hand\u003c/b>라고 해요. 전통적인 의료용 로봇 손은 섬세한 동작을 만들기 어렵고 부품과 수술 비용이 비싸서, 어린 환자에게는 특히 부담이 컸죠. 이 지문에 나오는 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">printing\u003c/b> 기술은 설계도만 있으면 물건을 겹겹이 쌓아 만들 수 있어 개인 맞춤형 제품을 훨씬 저렴하게 생산할 수 있어요. 게다가 설계도와 소프트웨어를 \u003cb class=\"key\">open \u003c/b>\u003cb class=\"key\">source\u003c/b>로 공개하면 전 세계 사람들이 함께 개선할 수 있어요. 마치 레시피를 공개한 요리처럼, 한 사람의 아이디어를 여러 사람이 더 맛있게 발전시키는 거예요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 우리 몸의 손 대신 쓰는 인공 손을 prosthetic hand라고 해요. 전통적인 의료용 로봇 손은 섬세한 동작을 만들기 어렵고 부품과 수술 비용이 비싸서 어린 환자에게는 특히 부담이 컸죠. 이 지문에 나오는 3D printing 기술은 설계도만 있으면 물건을 겹겹이 쌓아 만들 수 있어서 개인 맞춤형 제품을 훨씬 저렴하게 생산할 수 있어요. 설계도와 소프트웨어를 open source로 공개하면 전 세계 사람들이 함께 개선할 수도 있고요. 마치 레시피를 공개한 요리처럼 한 사람의 아이디어를 여러 사람이 더 발전시키는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문으로 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글쓴이는 먼저 ‘세상을 바꾸는 사람들은 누구인가?’라고 묻고, 너무 어려서 그런 사람이 될 수 없다고 여기는 \u003cb class=\"key\">통념\u003c/b>을 건드립니다. 이 질문은 독자의 관심을 끌고, 십 대 이야기를 기대하게 만드는 장치예요. 실제로는 ‘나도 그 사람들 중 하나가 될 수 있을까?’라는 생각을 하게 하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>세 십 대 소개\u003csmall>예고 · 문장 3\u003c/small>\u003c/h4>\u003cp>이어서 다음 이야기에서 세상을 더 나은 곳으로 만들기 위해 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 사용한 세 명의 십 대들을 만날 것이라고 소개합니다. 이 문장은 뒤에 나올 구체적 사례들을 미리 알려 주는 \u003cb class=\"key\">예고\u003c/b> 역할을 해요. 이제 본문은 그중 한 명인 Easton LaChappelle의 이야기로 들어갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>과학 박람회에서 만난 소녀\u003csmall>문제 제기 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>Easton은 열네 살 때 과학 박람회에서 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">손\u003c/b>을 착용한 소녀를 우연히 만납니다. 그 로봇 손은 여닫기만 가능했는데 가격이 무려 \u003cb class=\"key\">8만 \u003c/b>\u003cb class=\"key\">달러\u003c/b>나 되었어요. Easton은 소녀가 더 나은 로봇 손을 가지길 바라며 직접 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">저렴하고 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">손\u003c/b>을 만들기 시작합니다. 기존 제품의 한계와 비용이 문제로 제시되는 순간이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>3D 프린팅과 무료 공유\u003csmall>해결 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>많은 실패 끝에 Easton은 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">프린팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>로 단 \u003cb class=\"key\">300달러\u003c/b>의 유용한 로봇 손을 완성합니다. 그는 그 디자인과 소프트웨어를 다른 사람들과 \u003cb class=\"key\">무료로 \u003c/b>\u003cb class=\"key\">공유\u003c/b>하기로 결심하죠. 누군가 이 결과를 가져가 또 다른 유용한 일을 할 수 있다고 보았기 때문입니다. 개인의 성공을 넘어 \u003cb class=\"key\">오픈 \u003c/b>\u003cb class=\"key\">소스\u003c/b> 방식의 협력으로 확장되는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>함께 만드는 더 나은 세상\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>마지막으로 글쓴이는 어떤 사람도 혼자서는 세상을 바꿀 수 없지만, 함께 \u003cb class=\"key\">일함\u003c/b>으로써 더 나은 세상을 만들 수 있다고 강조합니다. Easton의 사례를 통해 얻은 \u003cb class=\"key\">교훈\u003c/b>을 일반화한 문장이에요. 이 결론은 처음 질문에 대한 답이기도 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 질문으로 시작하는 도입이에요. 글쓴이는 세상을 바꾸는 사람들은 누구인지, 여러분이 너무 어려서 그런 사람이 될 수 없다고 생각하는지 물어요. 이 질문은 독자의 관심을 끌고 십 대 이야기를 기대하게 만드는 장치예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 명의 십 대를 소개하는 예고예요. 다음 이야기에서 세상을 더 나은 곳으로 만들기 위해 자신의 아이디어를 사용한 세 명의 십 대를 만날 것이라고 말해요. 이제 본문은 그중 한 명인 Easton LaChappelle의 이야기로 들어가요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 과학 박람회에서 만난 소녀와 문제 상황이에요. Easton은 열네 살 때 로봇 손을 착용한 소녀를 우연히 만났고 그 손은 여닫기만 가능한데 팔만 달러나 들었어요. 그래서 소녀가 더 나은 로봇 손을 가지길 바라며 직접 더 저렴하고 더 나은 로봇 손을 만들기 시작했죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결과 공유예요. 많은 실패 끝에 Easton은 3D printing 기술로 단 삼백 달러의 유용한 로봇 손을 완성했어요. 그는 디자인과 소프트웨어를 다른 사람들과 무료로 공유하기로 결심했고 누군가 그 결과를 가져가 또 다른 유용한 일을 할 수 있다고 보았어요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 어떤 사람도 혼자서는 세상을 바꿀 수 없지만 함께 일함으로써 더 나은 세상을 만들 수 있다고 강조해요. Easton의 사례를 통해 얻은 교훈을 일반화한 문장이고 처음 질문에 대한 답이기도 하죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 질문을 던진 뒤, 세상을 바꾼 십 대의 구체적 \u003cb class=\"key\">사례\u003c/b>를 제시하고 마지막에 일반적인 \u003cb class=\"key\">주장\u003c/b>을 남기는 \u003cb class=\"key\">예시\u003c/b> 구조입니다. 끝 문장인 열한 번째 문장에서 ‘혼자가 아니라 함께 일하면 더 나은 세상을 만들 수 있다’는 핵심 메시지를 제시하므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요. 중간에 Easton의 로봇 손 일화는 이 메시지를 뒷받침하는 근거이자 이야기입니다. 따라서 읽을 때는 마지막 문장을 먼저 확인하고, 앞의 사례를 그 메시지에 연결하는 것이 좋아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Who are the people who change the world? (1)\u003c/b>\u003cspan>질문\u003c/span>\u003cb>In the following stories (3)\u003c/b>\u003cspan>예고\u003c/span>\u003cb>One day (4)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>With that (7)\u003c/b>\u003cspan>계기\u003c/span>\u003cb>After many failures, finally (8)\u003c/b>\u003cspan>해결\u003c/span>\u003cb>Maybe (10)\u003c/b>\u003cspan>가능성\u003c/span>\u003cb>No one person can change the world, but (11)\u003c/b>\u003cspan>결론·주장\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">change the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make the world a better place\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">build a better world\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기존 로봇 손 (8만 달러, 여닫기만 가능)\u003c/th>\u003cth>Easton의 3D 로봇 손 (300달러, 유용하고 공유 가능)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>8만 달러\u003c/td>\u003ctd>300달러\u003c/td>\u003c/tr>\u003ctr>\u003ctd>여닫기만 가능\u003c/td>\u003ctd>유용한 동작 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인 소유\u003c/td>\u003ctd>설계·소프트웨어 무료 공유\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 전개 방식으로 보면 예시 구조이고, 문장 배치는 미괄식이에요. 처음에 질문을 던진 뒤 세상을 바꾼 십 대의 구체적 사례를 제시하고 마지막에 일반적인 주장을 남기고 있죠. 열한 번째 문장에서 혼자가 아니라 함께 일하면 더 나은 세상을 만들 수 있다는 핵심 메시지를 제시하니까 미괄식으로 볼 수 있어요. 중간의 Easton 로봇 손 일화는 이 메시지를 뒷받침하는 이야기이자 근거예요.","hl":"ty"},{"n":10,"text":"신호어와 재진술, 대조를 같이 확인해 볼게요. 첫 문장의 Who are the people who change the world는 질문으로 글을 열고, 세 번째 문장의 In the following stories는 뒤에 사례가 나올 것을 예고해요. 네 번째 문장의 One day는 시간 순서를 알리고, 일곱 번째 문장의 With that는 계기를, 여덟 번째 문장의 After many failures, finally는 문제 해결을 알려 줘요. 마지막 문장의 No one person can change the world, but은 결론과 주장을 이끌어 주죠. change the world와 make the world a better place, build a better world는 같은 개념을 바꿔 말한 표현이에요. 또 기존 로봇 손과 Easton의 3D 로봇 손의 가격과 기능이 대조되고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세상\u003c/span>\u003c/div>\u003cdiv>\u003cb>too ~ to ...\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 ~해서 ...할 수 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>one of ~\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 중 하나\u003c/span>\u003c/div>\u003cdiv>\u003cb>teenager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>십 대\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아이디어, 생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>make the world a better place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세상을 더 나은 곳으로 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>robotic hand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로봇 손\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>one day\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어느 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>come across\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우연히 만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>science fair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학 박람회\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(비용이) 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dollar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달러\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다, ~하면 좋겠다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thin 003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">helpful\u003c/b>\u003cspan class=\"m\">도움이 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"s\">supportive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">저렴한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inexpensive\u003c/span>\u003cspan class=\"s\">affordable\u003c/span>\u003cspan class=\"s\">low-cost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">useful\u003c/b>\u003cspan class=\"m\">유용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"s\">practical\u003c/span>\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003cspan class=\"a\">impractical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">free\u003c/b>\u003cspan class=\"m\">무료의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">free of charge\u003c/span>\u003cspan class=\"s\">complimentary\u003c/span>\u003cspan class=\"s\">costless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">paid\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">build\u003c/b>\u003cspan class=\"m\">만들다, 구축하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">construct\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">demolish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">failure\u003c/b>\u003cspan class=\"m\">실패\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defeat\u003c/span>\u003cspan class=\"s\">setback\u003c/span>\u003cspan class=\"s\">loss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">success\u003c/span>\u003cspan class=\"a\">achievement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">공유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. change는 alter, transform과 바꿔 쓸 수 있고 반의어는 maintain, preserve예요. helpful과 useful은 서로 비슷하고 beneficial, practical도 함께 묶을 수 있으며 반대는 useless, harmful이에요. cheap는 inexpensive, affordable가 동의어이고 expensive, costly가 반의어예요. free는 free of charge, complimentary와 비슷하고 paid, costly와 반대예요. build는 create, construct와 통하고 destroy, demolish와 반대이며, failure는 setback, defeat가 비슷하고 success, achievement가 반대예요. share는 distribute, give와 비슷하고 keep, withhold와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 그 사람들인가요\u003c/span>\u003cspan class=\"en\">Who are the people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을 바꾸는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세상을 바꾸는 사람들은 누구입니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 주제를 던지는 질문이에요. \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">바꾸는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 누구인지 물으면서, 뒤에 나올 십 대 이야기로 자연스럽게 연결하는 역할을 해요. who change the world는 앞에 나온 people을 꾸며 주는 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>절이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(the people) + who + 동사(change) ~ : \"세상을 바꾸는 (사람들)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Who are the people, 누가 그 사람들인가요. who change the world?, 세상을 바꾸는. 이 문장 전체를 해석하면, 세상을 바꾸는 사람들은 누구입니까?","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 주제를 던지는 질문이에요. 세상을 바꾸는 사람들이 누구인지 물으면서, 뒤에 나올 십 대 이야기로 자연스럽게 연결해 주는 역할을 해요. who change the world는 앞에 나온 people을 꾸며 주는 주격 관계대명사절이에요.","hl":"mn"},{"n":15,"text":"어법 포인트는 주격 관계대명사 who예요. who change the world에서 who는 선행사 the people을 받아 주어 역할을 하고, 뒤에 동사 change가 왔어요. 이처럼 who가 주어 자리에 쓰이면 주격 관계대명사라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 생각하나요\u003c/span>\u003cspan class=\"en\">Do you think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 너무 어리다고\u003c/span>\u003cspan class=\"en\">you are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 사람들 중 하나가 되기에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 너무 어려서 이런 사람들 중 하나가 될 수 없다고 생각하나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나이가 어리다는 이유로 세상을 바꾸는 일을 포기하지 말라는 의도를 담고 있어요. \u003cb class=\"key\">too \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">구문\u003c/b>은 너무 어려서 그런 사람이 될 수 없다는 \u003cb class=\"key\">부정 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 나타내요. 글쓴이가 독자에게 직접 묻는 형식으로 호기심을 유도하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">too ~ to부정사 구문\u003c/span> : too + 형용사(young) + to + 동사원형(be) ~ : \"너무 어려서 이런 사람들 중 하나가 될 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Do you think, 여러분은 생각하나요. you are too young, 여러분이 너무 어리다고. to be one of these people?, 이런 사람들 중 하나가 되기에는. 이 문장 전체를 해석하면, 여러분은 너무 어려서 이런 사람들 중 하나가 될 수 없다고 생각하나요?","hl":"m"},{"n":17,"text":"이 문장은 나이가 어리다는 이유로 세상을 바꾸는 일을 포기하지 말라는 의도를 담고 있어요. too young to be one of these people은 too to 구문으로, 너무 어려서 그런 사람이 될 수 없다는 뜻이에요. 글쓴이가 독자에게 직접 묻는 형식으로 호기심을 유도하고 있어요.","hl":"mn"},{"n":18,"text":"두 번째 문장의 핵심 어법은 too to 구문이에요. too young to be one of these people에서 too는 정도가 지나침을 나타내고, to부정사가 그 결과로 할 수 없음을 나타내요. 그래서 이 구문은 너무 어려서 될 수 없다는 부정 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 이야기들에서\u003c/span>\u003cspan class=\"en\">In the following stories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 만날 겁니다\u003c/span>\u003cspan class=\"en\">you will meet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 명의 십 대들을\u003c/span>\u003cspan class=\"en\">three teenagers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 아이디어를 사용한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">ideas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 곳으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 이야기들에서 여러분은 세상을 더 나은 곳으로 만들기 위해 자신들의 아이디어를 사용한 세 명의 십 대들을 만날 겁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞으로 소개할 세 명의 십 대들을 예고하는 역할을 해요. \u003cb class=\"key\">십 \u003c/b>\u003cb class=\"key\">대들의 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>로 \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">곳\u003c/b>으로 만든 사람들이라는 점을 강조해서, 뒤에 나올 세 이야기의 공통 주제를 한 문장으로 요약하고 있어요. who used their ideas to make the world a better place가 three teenagers를 꾸며 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(three teenagers) + who + 동사(used) ~ : \"자신들의 아이디어를 사용한 (세 명의 십 대들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : used their ideas + to + 동사원형(make) ~ : \"세상을 더 나은 곳으로 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"In the following stories, 다음 이야기들에서. you will meet, 여러분은 만날 겁니다. three teenagers, 세 명의 십 대들을. who used their ideas, 자신들의 아이디어를 사용한. to make the world, 세상을 만들기 위해. a better place, 더 나은 곳으로. 이 문장 전체를 해석하면, 다음 이야기들에서 여러분은 세상을 더 나은 곳으로 만들기 위해 자신들의 아이디어를 사용한 세 명의 십 대들을 만날 겁니다.","hl":"m"},{"n":20,"text":"이 문장은 앞으로 소개할 세 명의 십 대들을 예고하는 역할을 해요. who used their ideas to make the world a better place가 three teenagers를 꾸며 주면서, 그들이 단순한 십 대가 아니라 아이디어로 세상을 더 나은 곳으로 만든 사람들이라는 점을 강조해요. 뒤에 나올 세 이야기의 공통 주제를 한 문장으로 요약하고 있어요.","hl":"mn"},{"n":21,"text":"여기에는 두 가지 어법이 중요해요. 첫 번째는 주격 관계대명사 who예요. who used their ideas에서 who는 three teenagers를 받아 주어 역할을 하며 뒤에 used라는 동사가 왔어요. 두 번째는 to부정사의 부사적 용법 목적이에요. to make the world a better place는 자신들의 아이디어를 사용한 목적을 나타내요. to부정사가 목적의 의미로 쓰이면 해석은 만들기 위해처럼 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도우려는 마음에서 만들어진 로봇 손\u003c/span>\u003cspan class=\"en\">A Robotic Hand from a Helpful Mind (Easton LaChappelle)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 열네 살이었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">fourteen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 어린 소녀를 우연히 만났다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">across\u003c/span> a little girl\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 과학 박람회에서\u003c/span>\u003cspan class=\"en\">at a science fair.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도우려는 마음에서 만들어진 로봇 손\n내가 열네 살이었을 때, 어느 날 한 과학 박람회에서 나는 어린 소녀를 우연히 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 주제인 로봇 손을 소개하고, 화자가 열네 살 때 과학 박람회에서 어린 소녀를 \u003cb class=\"key\">우연히\u003c/b> 만난 사건을 제시합니다. came across는 계획하지 않고 우연히 만났다는 \u003cb class=\"key\">동사구\u003c/b>입니다. 이 사건이 뒤에 나올 로봇 손 제작의 \u003cb class=\"key\">계기\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 (when)\u003c/span> : when + 주어(I) + 동사(was) : \"내가 열네 살이었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 (phrasal verb)\u003c/span> : come across + 목적어 : \"~을 우연히 만나다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"A Robotic Hand from a Helpful Mind (Easton LaChappelle), 도우려는 마음에서 만들어진 로봇 손. One day, 어느 날. when I was fourteen, 내가 열네 살이었을 때. I came across a little girl, 나는 어린 소녀를 우연히 만났다. at a science fair, 한 과학 박람회에서. 이 문장 전체를 해석하면, 도우려는 마음에서 만들어진 로봇 손\n내가 열네 살이었을 때, 어느 날 한 과학 박람회에서 나는 어린 소녀를 우연히 만났다.","hl":"m"},{"n":23,"text":"이 문장은 이야기의 주제인 로봇 손을 먼저 제시하고, 화자가 열네 살 때 과학 박람회에서 어린 소녀를 우연히 만난 사건을 소개합니다. came across는 우연히 만나다라는 뜻이고, 과학 박람회라는 장소가 뒤에 나올 로봇 손 이야기의 배경이 됩니다.","hl":"mn"},{"n":24,"text":"첫 번째, when I was fourteen는 시간을 나타내는 부사절로 내가 열네 살이었을 때라는 뜻입니다. One day와 함께 과거의 시점을 알려 줍니다. 두 번째, came across는 우연히 만나다라는 동사구인데요, come across 자체를 하나의 표현으로 기억해야 하고 뒤에 만난 대상인 a little girl이 목적어로 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 로봇 손을 착용하고 있었다\u003c/span>\u003cspan class=\"en\">She had \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">robotic \u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 펴고 오므릴 수만 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">open \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">close\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 단지 펴고 오므릴 수만 있는 로봇 손을 착용하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소녀가 가진 로봇 손의 기능이 매우 \u003cb class=\"key\">제한적\u003c/b>임을 보여 주는 문장입니다. \u003cb class=\"key\">관계대명사\u003c/b> that이 선행사 a robotic hand를 수식하여 어떤 로봇 손인지 설명합니다. 이처럼 기능이 단순한 사실이 다음 문장에서 화자가 놀라는 \u003cb class=\"key\">원인\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(사물) + that + 동사(could) : \"단지 펴고 오므릴 수만 있는 로봇 손\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could (능력)\u003c/span> : could + 동사원형(open and close) : \"단지 펴고 오므릴 수만 있었다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"She had a robotic hand, 그녀는 로봇 손을 착용하고 있었다. that could only open and close, 단지 펴고 오므릴 수만 있는. 이 문장 전체를 해석하면, 그녀는 단지 펴고 오므릴 수만 있는 로봇 손을 착용하고 있었다.","hl":"m"},{"n":26,"text":"이 문장은 소녀가 가진 로봇 손이 단지 펴고 오므릴 수만 있었다는 제한적인 기능을 설명합니다. 관계대명사 that이 a robotic hand를 꾸며서 그 로봇 손이 얼마나 단순한지 알려 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째, a robotic hand that could only open and close에서 that은 주격 관계대명사로 선행사 a robotic hand를 수식합니다. that 뒤에 could가 동사로 왔기 때문에 주격 관계대명사라는 것을 알 수 있어요. 두 번째, could는 능력을 나타내는 조동사이고 뒤에 동사원형 open and close가 와서 할 수 있는 동작을 말해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 놀랐다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">surprised \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 그 손에 8만 달러를 지불했다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the hand \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">cost \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">80,000 \u003c/span>\u003cspan class=\"tgt\">dollars\u003c/span>!\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어’\u003c/span>\u003cspan class=\"en\">'\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">robotic \u003c/span>\u003cspan class=\"tgt\">hand\u003c/span>,'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 마음속으로 생각했다.\u003c/span>\u003cspan class=\"en\">I thought to myself.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그녀가 그 손에 8만 달러를 지불했다는 데 놀랐다! ‘나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어.’라고 마음속으로 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 로봇 손의 \u003cb class=\"key\">가격\u003c/b>에 놀랐고, 소녀가 더 나은 로봇 손을 갖기를 바라는 마음을 드러낸 문장입니다. I wish 뒤에 \u003cb class=\"key\">과거형\u003c/b> had가 쓰여 현재 그녀가 더 나은 손을 가지지 못한 사실에 대한 \u003cb class=\"key\">안타까움\u003c/b>을 표현합니다. 이 생각이 이후 저렴한 로봇 손을 만들겠다는 결심으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 형용사/과거분사 뒤 that절\u003c/span> : be surprised + that절 : \"~라는 것에 놀랐다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 (had + p.p.)\u003c/span> : had + cost(과거분사) + 간접목적어(her) + 직접목적어(80,000 dollars) : \"그녀에게 8만 달러가 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">I wish + 가정법 과거\u003c/span> : I wish + 주어(she) + 동사 과거형(had) : \"나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I was surprised, 나는 놀랐다. that the hand had cost her 80,000 dollars!, 그녀가 그 손에 8만 달러를 지불했다는 것. 'I wish she had a better robotic hand,', ‘나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어’. I thought to myself, 라고 마음속으로 생각했다.. 이 문장 전체를 해석하면, 나는 그녀가 그 손에 8만 달러를 지불했다는 데 놀랐다! ‘나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어.’라고 마음속으로 생각했다.","hl":"m"},{"n":29,"text":"화자는 그 손이 무려 8만 달러나 들었다는 사실에 놀랐고, 소녀가 더 나은 로봇 손을 가지기를 바랐습니다. I wish she had a better robotic hand는 현재 사실과 반대되는 소망을 나타내는 가정법 표현입니다. 이 순간이 화자가 더 싸고 좋은 로봇 손을 만들겠다고 결심하는 계기가 됩니다.","hl":"mn"},{"n":30,"text":"첫 번째, I was surprised that에서 that절은 놀란 감정의 이유를 설명합니다. 두 번째, had cost her 80,000 dollars는 과거완료인데, 놀란 시점보다 더 이전에 이미 그 비용이 들었기 때문에 had cost로 쓰였습니다. 세 번째, I wish she had a better robotic hand는 I wish 가정법 과거로, 현재 그녀가 더 나은 로봇 손을 가지고 있지 않다는 사실에 대한 안타까움을 표현합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서\u003c/span>\u003cspan class=\"en\">With that,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만들기 시작했다\u003c/span>\u003cspan class=\"en\">I started \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 저렴하고 더 나은 로봇 손을\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">cheaper \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">better\u003c/span> robotic hand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고는 나는 훨씬 더 저렴하고 더 나은 로봇 손을 만들기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 값비싼 로봇 손을 본 뒤 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">손을 \u003c/b>\u003cb class=\"key\">만들겠다\u003c/b>는 결심을 행동으로 옮긴 대목이다. With that은 ‘그러고 나서’로 앞 내용을 받아 다음 행동으로 자연스럽게 이어 준다. much cheaper and better에서 much는 비교급 cheaper를 강조해 ‘훨씬 더 저렴한’이라는 뜻을 더한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : started + to make (to부정사구/목적어) : \"만들기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조와 병렬\u003c/span> : much + cheaper(비교급) and better(비교급) : \"훨씬 더 저렴하고 더 나은\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"With that, 그러고 나서. I started to make, 나는 만들기 시작했다. a much cheaper and better robotic hand, 훨씬 더 저렴하고 더 나은 로봇 손을. 이 문장 전체를 해석하면, 그러고는 나는 훨씬 더 저렴하고 더 나은 로봇 손을 만들기 시작했다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 소녀의 로봇 손이 너무 비싸고 불편하다는 것을 본 이스턴이 직접 더 나은 로봇 손을 만들기 시작한 장면이에요. With that은 그러고 나서라는 뜻으로 앞 내용을 받아서 행동으로 옮긴다는 흐름을 만들어 줘요. much가 비교급 cheaper를 강조해서 훨씬 더 저렴하다는 뜻을 더해 주는 표현이에요.","hl":"mn"},{"n":33,"text":"어법 포인트를 짚어 볼게요. 첫 번째, started 뒤에 to make가 왔어요. start는 to부정사를 목적어로 취하는 동사라서 만들기 시작했다로 해석되고, to make가 명사처럼 목적어 역할을 해요. 두 번째, much cheaper and better에서 much가 비교급 cheaper를 강조해서 훨씬 더 저렴한이 됩니다. cheaper와 better는 and로 병렬 연결됐어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 실패 후에\u003c/span>\u003cspan class=\"en\">After many failures,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내\u003c/span>\u003cspan class=\"en\">finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3D 프린트 기술을 사용함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">3D \u003c/span>\u003cspan class=\"tgt\">printing \u003c/span>\u003cspan class=\"tgt\">technology\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만들 수 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유용한 로봇 손을\u003c/span>\u003cspan class=\"en\">a useful robotic hand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단 300달러의 가격으로\u003c/span>\u003cspan class=\"en\">for the price of only 300 dollars.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 실패 후에 마침내 나는 3D 프린트 기술을 사용해서 단 300달러짜리의 유용한 로봇 손을 만들 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수많은 \u003cb class=\"key\">시행착오\u003c/b> 끝에 3D 프린트 기술을 활용해 값싸고 유용한 로봇 손을 실제로 만들어 낸 성과를 보여 준다. was able to make는 단순히 ‘할 수 있었다’가 아니라 어려움을 겪은 뒤 \u003cb class=\"key\">결국 \u003c/b>\u003cb class=\"key\">해냈다\u003c/b>는 결과를 강조한다. only 300 dollars는 앞서 80,000 dollars와 극명하게 대비되면서 기술 공유의 의미를 부각한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사(~함으로써)\u003c/span> : by + using (동명사구) : \"3D 프린트 기술을 사용함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to (능력·결과)\u003c/span> : was able to + make (동사원형) : \"만들 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"After many failures, 많은 실패 후에. finally, 마침내. by using 3D printing technology, 3D 프린트 기술을 사용함으로써. I was able to make, 나는 만들 수 있었다. a useful robotic hand, 유용한 로봇 손을. for the price of only 300 dollars, 단 300달러의 가격으로. 이 문장 전체를 해석하면, 많은 실패 후에 마침내 나는 3D 프린트 기술을 사용해서 단 300달러짜리의 유용한 로봇 손을 만들 수 있었다.","hl":"m"},{"n":35,"text":"많은 실패 끝에 마침내 three D 프린트 기술을 이용해서 단 삼백 달러짜리 유용한 로봇 손을 만들었다는 내용이에요. was able to make는 단순히 할 수 있었다가 아니라 어려움을 겪고 나서 결국 해냈다는 결과를 강조해요. 팔만 달러짜리 로봇 손과 비교하면 삼백 달러는 훨씬 저렴해서 이 기술의 가치를 잘 보여 줘요.","hl":"mn"},{"n":36,"text":"첫 번째, by using three D printing technology에서 by는 수단과 방법을 나타내는 전치사이고 뒤에 동명사 using이 왔어요. by 다음에 동명사가 오는 구문은 무엇을 사용함으로써라고 해석해요. 두 번째, was able to make는 과거의 특정 상황에서 실제로 해냈다는 능력을 나타내요. could보다 결과를 강조하는 표현이라서 이 문장에서는 결국 만들어 냈다는 느낌이 살아 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 공유하기로 결심했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">share\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자인과 소프트웨어를\u003c/span>\u003cspan class=\"en\">the designs and software\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 3D 로봇 손의\u003c/span>\u003cspan class=\"en\">for my 3D robotic hand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과\u003c/span>\u003cspan class=\"en\">with others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내 3D 로봇 손의 디자인과 소프트웨어를 다른 사람들과 무료로 공유하기로 결심했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 성과를 독점하지 않고 \u003cb class=\"key\">무료로 \u003c/b>\u003cb class=\"key\">공유\u003c/b>하겠다는 Easton의 핵심 결정을 나타낸다. designs and software는 로봇 손의 \u003cb class=\"key\">설계도와 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 뜻하며, with others for free가 더 나은 세상을 위한 개방적 태도를 보여 준다. 이 문장은 마지막 문장의 협력 메시지와 연결되는 중요한 전환점이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decided + to share (to부정사구/목적어) : \"공유하기로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for가 쓰인 관용 표현\u003c/span> : for + free : \"무료로\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"I decided to share, 나는 공유하기로 결심했다. the designs and software, 디자인과 소프트웨어를. for my 3D robotic hand, 내 3D 로봇 손의. with others, 다른 사람들과. for free, 무료로. 이 문장 전체를 해석하면, 나는 내 3D 로봇 손의 디자인과 소프트웨어를 다른 사람들과 무료로 공유하기로 결심했다.","hl":"m"},{"n":38,"text":"자신이 만든 로봇 손의 디자인과 소프트웨어를 다른 사람들과 무료로 공유하겠다는 결정을 담은 문장이에요. designs and software는 로봇 손의 설계도와 프로그램을 뜻하고, for free는 돈을 받지 않는다는 개방적인 태도를 보여 줘요. 이 문장은 마지막에 나오는 함께 일하자는 메시지와 연결되는 중요한 부분이에요.","hl":"mn"},{"n":39,"text":"첫 번째, decided 뒤에 to share가 왔으니 decide가 to부정사를 목적어로 취한다는 걸 알 수 있어요. to share는 공유하기로라는 명사적 용법으로 쓰였어요. 두 번째, for free는 무료로라는 뜻의 관용 표현이에요. 전치사 for가 대가 없이 그냥 준다는 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 누군가는\u003c/span>\u003cspan class=\"en\">Maybe someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져갈 수 있다\u003c/span>\u003cspan class=\"en\">can take\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 해낸 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 할 수 있다\u003c/span>\u003cspan class=\"en\">and do\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유용한 어떤 일을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">useful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것으로\u003c/span>\u003cspan class=\"en\">with it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아마도 누군가는 내가 해낸 것을 가져가 그것으로 유용한 일을 할 수 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 무료로 디자인을 공유한 Easton의 바람을 드러낸다. \u003cb class=\"key\">내가 \u003c/b>\u003cb class=\"key\">해낸 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">가져가\u003c/b> \u003cb class=\"key\">유용한 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 할 수 있다는 것은 자신의 성과가 다른 사람에게 쓰이기를 바라는 \u003cb class=\"key\">나눔의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + 주어(I) + have done(동사) : \"내가 해낸 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p.(done) : \"해냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 후치수식\u003c/span> : something(부정대명사) + useful(형용사) : \"유용한 어떤 일\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Maybe someone, 아마도 누군가는. can take, 가져갈 수 있다. what I have done, 내가 해낸 것을. and do, 그리고 할 수 있다. something useful, 유용한 어떤 일을. with it, 그것으로. 이 문장 전체를 해석하면, 아마도 누군가는 내가 해낸 것을 가져가 그것으로 유용한 일을 할 수 있을 것이다.","hl":"m"},{"n":41,"text":"이 문장은 Easton이 자신의 로봇 손 디자인과 소프트웨어를 무료로 공유한 이유를 보여 주는 문장이에요. 자신이 만든 것을 다른 누군가가 가져가서 유용한 일에 쓸 수 있기를 바라는 마음, 즉 나눔의 가치를 담고 있어요. 특히 what I have done은 내가 해낸 것을 의미하고, something useful은 유용한 어떤 일을 뜻해요.","hl":"mn"},{"n":42,"text":"첫 번째, what I have done에서 what은 선행사를 포함한 관계대명사예요. 뒤에 I have done을 보면 done이 목적어를 필요로 하는데, 그 목적어 자리에 what이 오는 거죠. 두 번째, have done은 현재완료로, 과거에 이루어 낸 일이 지금까지 이어지는 느낌을 줘요. 세 번째, something useful은 something 같은 부정대명사가 와서 형용사 useful이 뒤에서 수식하는 후치 수식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 한 사람도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바꿀 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 만들 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 세상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 일함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람도 혼자서는 세상을 바꿀 수 없지만, 우리는 함께 일함으로써 더 나은 세상을 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본문 전체를 마무리하는 결론 문장으로, 개인의 힘만으로는 부족하다는 점을 강조한다. 세상을 바꾸는 주체는 혼자가 아니라 \u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">일하는 \u003c/b>\u003cb class=\"key\">우리\u003c/b>이며, \u003cb class=\"key\">협력\u003c/b>이 더 나은 세상을 만든다는 메시지를 전한다. 어려운 문법 없이 대조적 병렬 구조로 핵심을 전달한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어와 조동사 can\u003c/span> : No one person(부정 주어) + can change + the world : \"어떤 사람도 세상을 바꿀 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">but 대조와 조동사 can\u003c/span> : but + 주어(we) + can build + 목적어(a better world) : \"그러나 우리는 더 나은 세상을 만들 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + working together(동명사구) : \"함께 일함으로써\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"No one person, 어떤 한 사람도. can change, 바꿀 수 있다. the world, 세상을. but, 하지만. we can build, 우리는 만들 수 있다. a better world, 더 나은 세상을. by working together, 함께 일함으로써. 이 문장 전체를 해석하면, 어떤 사람도 혼자서는 세상을 바꿀 수 없지만, 우리는 함께 일함으로써 더 나은 세상을 만들 수 있다.","hl":"m"},{"n":44,"text":"이 문장은 본문 전체를 마무리하는 결론 문장이에요. 혼자서는 세상을 바꿀 수 없지만, 함께 일하면 더 나은 세상을 만들 수 있다는 협력의 메시지를 강조해요. 앞에서 소개한 십 대들의 이야기가 결국 함께하는 힘으로 이어진다는 점을 보여 줘요.","hl":"mn"},{"n":45,"text":"첫 번째, No one person은 부정어 no가 one person을 꾸며 주는 표현으로, 단수로 취급되기 때문에 사람이 한 명도 아니다, 즉 어떤 한 사람도 아니라는 뜻이 돼요. can change와 can build는 조동사 can이 가능을 나타내요. 두 번째, but은 앞뒤 문장을 대조해 주고, by working together에서 by는 전치사라서 뒤에 동사가 오면 working처럼 ing 형태를 써야 해요. 이때 by working together는 함께 일함으로써라는 방법을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글은 \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">바꾸는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 되기에 너무 어린 나이는 없다는 문제 제기로 시작한다.\u003c/li>\u003cli>\u003cb class=\"key\">Easton \u003c/b>\u003cb class=\"key\">LaChappelle\u003c/b>은 8만 달러짜리 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">손\u003c/b>의 문제를 보고 더 저렴하고 나은 손을 만들기로 결심한다.\u003c/li>\u003cli>많은 \u003cb class=\"key\">실패\u003c/b> 끝에 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">프린팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>로 300달러짜리 유용한 손을 만들고 설계와 소프트웨어를 \u003cb class=\"key\">무료 \u003c/b>\u003cb class=\"key\">공유\u003c/b>한다.\u003c/li>\u003cli>결론은 혼자가 아니라 함께 \u003cb class=\"key\">일함\u003c/b>으로써 더 나은 세상을 만들 수 있다는 메시지다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A teenager used 3D printing to make a cheap, useful robotic hand and shared it freely, showing that we can build a better world by working together.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">세상을 바꾸는 사람이 되기에 너무 어린 나이는 없으며, \u003cb class=\"key\">Easton \u003c/b>\u003cb class=\"key\">LaChappelle\u003c/b>은 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">프린팅\u003c/b>으로 \u003cb class=\"key\">8만 \u003c/b>\u003cb class=\"key\">달러\u003c/b> 로봇 손을 \u003cb class=\"key\">300달러\u003c/b>로 바꾸고 설계를 \u003cb class=\"key\">무료 \u003c/b>\u003cb class=\"key\">공유\u003c/b>해 함께 더 나은 세상을 만들자고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 배운 내용을 정리해 볼게요. 이 글은 너무 어려서 세상을 바꿀 수 없다는 통념에 의문을 던지고 Easton LaChappelle의 로봇 손 사례를 보여 줬어요. 그는 팔만 달러짜리 불편한 로봇 손을 보고 3D printing으로 삼백 달러짜리 유용한 손을 만들어 무료로 공유했죠. 결국 혼자가 아니라 함께 일할 때 더 나은 세상을 만들 수 있다는 메시지를 기억하면 좋아요. 오늘 수업은 여기까지입니다. 수고 많았어요.","hl":null}]}]});</script></body></html>
