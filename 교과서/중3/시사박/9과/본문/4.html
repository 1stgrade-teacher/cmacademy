@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 9과 본문4","audioDir":"4_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>9과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Useless Corn Cobs as Useful Water Filters\u003c/h1>\u003ch2>유용한 물 여과 장치로 쓰인 쓸모없는 옥수수 속대\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인도 시골 소녀 \u003cb class=\"key\">Lalita \u003c/b>\u003cb class=\"key\">Prasida\u003c/b>가 오염된 물 문제를 해결하기 위해 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>의 작은 구멍을 이용한 \u003cb class=\"key\">여과 \u003c/b>\u003cb class=\"key\">장치\u003c/b>를 만들어 더러운 물질의 70~80%를 제거했다. 그녀는 이 장치가 모든 호수를 \u003cb class=\"key\">깨끗하게\u003c/b> 하기를 희망한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Lalita Prasida built a simple corn-cob filtering system that removed most dirty matter from polluted water, hoping to clean lakes in her village and beyond.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 인도의 한 소녀 Lalita Prasida가 쓴 Useless Corn Cobs as Useful Water Filters라는 글을 함께 읽어 볼게요. 이 글은 쓸모없는 옥수수 속대로 오염된 물을 깨끗하게 만드는 이야기예요. 요약하면, Lalita Prasida가 옥수수 속대의 작은 구멍을 이용해 여과 장치를 만들어 더러운 물질의 칠십 퍼센트에서 팔십 퍼센트를 제거했다는 내용이에요. 핵심 요지는, 주변에서 흔한 재료로도 물을 정화할 수 있다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">물속에 섞인 더러운 물질을 걸러 내는 과정을 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">여과\u003c/b>(water filtration)라고 해. 옥수수 속대(corn cob)는 겉에 작은 구멍이 많아서 물이 지나갈 때 \u003cb class=\"key\">부유 \u003c/b>\u003cb class=\"key\">물질\u003c/b>(suspended solids)을 걸러 낼 수 있어. 개발도상국 시골에서는 정수 시설이 부족해 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>(water pollution)이 심각한 문제가 되고, 주변에서 구하기 쉬운 재료가 큰 도움이 돼. 마치 주방의 체로 국물에서 건더기를 걸러 내듯, 옥수수 속대의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>이 오염 물질을 붙잡는 거야. 라리타 프라시다는 쓸모없이 버려지던 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>를 활용해 값싸고 지속 가능한 여과 장치를 만들었어.\u003c/div>","segs":[{"n":2,"text":"물속의 더러운 물질을 걸러 내는 과정을 water filtration이라고 해요. 이 과정에서 suspended solids 같은 고체 입자를 잡아 내는 게 중요한데, 옥수수 속대에는 작은 구멍이 많아서 물이 지나갈 때 입자를 걸러 낼 수 있어요. 개발도상국의 시골에서는 정수 시설이 부족해서 water pollution이 심각한 문제가 되고, 주변에서 쉽게 구할 수 있는 재료가 큰 도움이 돼요. 마치 주방의 체로 국물에서 건더기를 걸러 내듯이, 옥수수 속대의 작은 구멍이 오염 물질을 붙잡는 거예요. Lalita Prasida는 버려지던 corn cob을 활용해서 값싸고 지속 가능한 여과 장치를 만들었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>오염된 물 문제 인식\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인도 시골에서 자란 소녀 \u003cb class=\"key\">Lalita \u003c/b>\u003cb class=\"key\">Prasida\u003c/b>는 주변의 물이 \u003cb class=\"key\">심각하게 \u003c/b>\u003cb class=\"key\">오염\u003c/b>되어 있다는 사실을 자주 발견했다. 이 문제를 어떻게 해결할 수 있을지 고민한 것이 이야기의 출발점이다. 글의 도입부에서 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이 제시된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>옥수수 속대 착안\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>그녀는 쓸모없는 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>가 마을 어디에나 있다는 데서 아이디어를 얻었다. 옥수수 속대의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>이 오염된 물속에서 더러운 물질을 걸러 낼 수 있다고 생각한 것이다. 이 발상이 글 전체의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>간단한 실험으로 검증\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>길에서 마른 옥수수 속대를 주워 씻은 뒤 \u003cb class=\"key\">더러운 \u003c/b>\u003cb class=\"key\">물\u003c/b>이 담긴 그릇에 넣었다. 잠시 후 확인하니 물이 훨씬 \u003cb class=\"key\">맑게\u003c/b> 보였다. 이 실험으로 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>의 여과 가능성을 직접 확인했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>여과 장치 제작과 효과\u003csmall>주장 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>농부들에게서 모은 옥수수 속대로 \u003cb class=\"key\">여과 \u003c/b>\u003cb class=\"key\">장치\u003c/b>를 만들었다. 이 장치는 물속의 \u003cb class=\"key\">더러운 \u003c/b>\u003cb class=\"key\">물질\u003c/b>을 70~80% 제거하는 성과를 보였다. 이는 간단한 아이디어가 실제로 \u003cb class=\"key\">효과\u003c/b>를 발휘했음을 보여 주는 근거이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>확대 적용 희망\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>그녀는 자신의 여과 장치가 우리 마을뿐 아니라 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">지역\u003c/b>의 호수까지 깨끗하게 하기를 \u003cb class=\"key\">희망\u003c/b>한다. 개인의 문제 해결이 더 넓은 지역을 살리는 \u003cb class=\"key\">미래 \u003c/b>\u003cb class=\"key\">지향적\u003c/b> 메시지로 이어진다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 오염 문제를 발견하고, 옥수수 속대를 떠올리고, 실험으로 확인한 뒤 장치를 만들어 확대 적용을 꿈꾸는 흐름으로 전개돼요.","hl":null},{"n":4,"text":"첫 번째 단계는 오염된 물 문제 인식이에요. 인도 시골에서 자란 Lalita Prasida는 주변의 물이 심각하게 오염되어 있다는 사실을 자주 발견했어요. 그래서 이 문제를 어떻게 해결할 수 있을지 고민했죠. 이 부분은 글의 도입으로 문제 상황을 제시해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 옥수수 속대 착안이에요. 그녀는 쓸모없는 옥수수 속대가 마을 어디에나 있다는 점을 떠올렸어요. 그리고 옥수수 속대의 작은 구멍이 오염된 물속에서 더러운 물질을 걸러 낼 수 있다고 생각했죠. 이 발상이 글 전체의 핵심 아이디어예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 간단한 실험으로 검증하기예요. 길에서 마른 옥수수 속대 몇 개를 주워 씻은 다음 더러운 물이 담긴 그릇에 넣었어요. 잠시 후에 물을 확인했더니 훨씬 더 맑게 보였죠. 이 실험으로 옥수수 속대의 여과 가능성을 확인했어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 여과 장치 제작과 효과 확인이에요. 농부들에게서 모은 옥수수 속대로 여과 장치를 만들었어요. 이 장치는 물속의 더러운 물질을 칠십 퍼센트에서 팔십 퍼센트 제거했어요. 실제 적용 가능성을 보여 준 중요한 근거예요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 확대 적용의 희망이에요. 그녀는 이 여과 장치가 우리 마을뿐만 아니라 다른 지역의 호수까지 깨끗하게 해 줄 수 있기를 희망해요. 개인의 작은 아이디어가 더 넓은 지역을 살리는 꿈으로 이어지는 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b> 문제를 제기하고, 다섯 번째 문장에서 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대의 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>이 더러운 물질을 걸러 낸다는 핵심 아이디어를 제시한다. 이후 실험과 장치 제작으로 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 뒷받침하고, 마지막에 확대 적용의 \u003cb class=\"key\">희망\u003c/b>을 밝힌다. 따라서 문제-해결 구조에 핵심 주장이 중간에 있는 \u003cb class=\"key\">중괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (3)\u003c/b>\u003cspan>전환: 해결 아이디어 제시\u003c/span>\u003cb>I thought that (5)\u003c/b>\u003cspan>주장: 핵심 아이디어 제시\u003c/span>\u003cb>One day (6)\u003c/b>\u003cspan>예시: 실험 시작\u003c/span>\u003cb>After a while (7)\u003c/b>\u003cspan>시간 경과: 결과 확인\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>단계 전환: 장치 제작\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the water around us was seriously polluted\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">polluted water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dirty water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dirty matter\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>쓸모없는 옥수수 속대\u003c/th>\u003cth>유용한 물 여과 장치\u003c/th>\u003c/tr>\u003ctr>\u003ctd>마을 어디에나 흔하게 있음\u003c/td>\u003ctd>오염 물질을 걸러 내 물을 맑게 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>그냥 버려지던 재료\u003c/td>\u003ctd>70~80% 더러운 물질 제거\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 문제 해결 구조예요. 처음에 물이 심각하게 오염되었다는 문제를 제시하고, 옥수수 속대를 활용한 해결 아이디어를 제시한 뒤 실험과 장치 제작으로 해결 과정을 보여 줘요. 글의 중심 문장은 다섯 번째 문장, 곧 작은 구멍이 더러운 물질을 걸러 낼 수 있다는 부분이에요. 그래서 형태는 중괄식으로 볼 수 있어요.","hl":"ty"},{"n":10,"text":"흐름을 알려 주는 신호어도 확인해 볼게요. 세 번째 문장의 Then은 문제에서 해결 아이디어로 넘어가는 전환을 나타내요. 여섯 번째 문장의 One day는 실험 사례를 시작하는 신호이고, 일곱 번째 문장의 After a while는 시간이 지난 뒤 결과를 확인하는 표현이에요. 여덟 번째 문장의 Then은 실험에서 장치 제작으로 나아가는 다음 단계를 알려 줘요. 또 seriously polluted water, dirty water, dirty matter 같은 재진술이 문제의 물 상태를 계속 가리키고 있어서 글의 연결을 도와줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>useless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쓸모없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>corn cob\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옥수수 속대\u003c/span>\u003c/div>\u003cdiv>\u003cb>useful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>water filter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물 여과 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>countryside\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시골\u003c/span>\u003c/div>\u003cdiv>\u003cb>polluted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오염된\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonder\u003c/b>\u003cem>동사\u003c/em>\u003cspan>궁금하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떠올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>village\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>hole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구멍\u003c/span>\u003c/div>\u003cdiv>\u003cb>dirty matter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더러운 물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>filter out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>걸러 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>줍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dried\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>말린\u003c/span>\u003c/div>\u003cdiv>\u003cb>wash\u003c/b>\u003cem>동사\u003c/em>\u003cspan>씻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bowl\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>after a while\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시 후\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맑은\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 건설하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>filtering system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여과 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>percent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼센트\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>희망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깨끗하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호수\u003c/span>\u003c/div>\u003cdiv>\u003cb>not only A but also B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A뿐만 아니라 B도\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번 지문에서 시험에 잘 나오는 단어를 몇 개 짚어 볼게요. hit on은 떠올리다라는 뜻으로 come up with와 바꿔 쓸 수 있어요. filter out은 걸러 내다라는 의미이고, remove는 제거하다예요. after a while는 잠시 후라는 숙어로 시간 순서를 나타낼 때 자주 나와요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">polluted\u003c/b>\u003cspan class=\"m\">오염된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contaminated\u003c/span>\u003cspan class=\"s\">impure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clean\u003c/span>\u003cspan class=\"a\">pure\u003c/span>\u003cspan class=\"a\">unpolluted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">useless\u003c/b>\u003cspan class=\"m\">쓸모없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worthless\u003c/span>\u003cspan class=\"s\">futile\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useful\u003c/span>\u003cspan class=\"a\">valuable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hit on\u003c/b>\u003cspan class=\"m\">떠올리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">come up with\u003c/span>\u003cspan class=\"s\">think of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clear\u003c/b>\u003cspan class=\"m\">맑은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transparent\u003c/span>\u003cspan class=\"s\">clean\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003cspan class=\"a\">muddy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">제거하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"s\">get rid of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">insert\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hope\u003c/b>\u003cspan class=\"m\">희망하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wish\u003c/span>\u003cspan class=\"s\">expect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">despair\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solve\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">aggravate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 둡시다. polluted는 contaminated와 impure와 같은 뜻이고, 반대말은 clean이나 pure예요. useless는 worthless, futile과 비슷하고 useful, valuable과 반대예요. clear는 transparent, clean과 유사하고 dirty, muddy와 반대가 돼요. remove는 eliminate, get rid of와 뜻이 같고 add, insert와 반대예요. hope는 wish, expect와 유사하고 despair, doubt와 반대죠. 이런 짝을 묶어 외우면 독해와 어휘 문제에 모두 도움이 돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유용한 물 여과 장치로 쓰인 쓸모없는 옥수수 속대\u003c/span>\u003cspan class=\"en\">Useless Corn Cobs as Useful Water Filters (Lalita Prasida)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린 소녀로서\u003c/span>\u003cspan class=\"en\">As a young girl\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도의 시골에 살고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">countryside \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">India\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 종종 발견했다\u003c/span>\u003cspan class=\"en\">I often found\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 주변의 물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각하게 오염되어 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">seriously \u003c/span>\u003cspan class=\"tgt\">polluted\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유용한 물 여과 장치로 쓰인 쓸모없는 옥수수 속대 인도의 시골에 살고 있던 어린 소녀로서 나는 종종 우리 주변에 있는 물이 심각하게 오염되어 있는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 제목과 첫 문장으로, 옥수수 속대가 \u003cb class=\"key\">유용한 \u003c/b>\u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">여과 \u003c/b>\u003cb class=\"key\">장치\u003c/b>가 된다는 주제를 보여 준다. 화자가 인도 \u003cb class=\"key\">시골\u003c/b>에 살던 어린 소녀였을 때 주변 물이 \u003cb class=\"key\">심각하게 \u003c/b>\u003cb class=\"key\">오염\u003c/b>되어 있음을 자주 발견했다는 배경을 제시한다. that절이 found의 목적어로 쓰여 발견한 내용을 구체적으로 전달하며, 뒤에 문제 해결 아이디어로 이어지는 도입부 역할이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 한정적 용법 (명사 수식)\u003c/span> : a young girl + [living in the countryside in India] (현재분사구/후치수식) : \"인도의 시골에 살고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : found + [that + 주어 + 동사] (that절/목적어) : \"우리 주변의 물이 심각하게 오염되어 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : be동사(was) + [seriously] + 과거분사(polluted) : \"심각하게 오염되어 있었다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Useless Corn Cobs as Useful Water Filters (Lalita Prasida), 유용한 물 여과 장치로 쓰인 쓸모없는 옥수수 속대. As a young girl, 어린 소녀로서. living in the countryside in India, 인도의 시골에 살고 있는. I often found, 나는 종종 발견했다. that the water around us, 우리 주변의 물이. was seriously polluted, 심각하게 오염되어 있다는 것을. 이 문장 전체를 해석하면, 유용한 물 여과 장치로 쓰인 쓸모없는 옥수수 속대 인도의 시골에 살고 있던 어린 소녀로서 나는 종종 우리 주변에 있는 물이 심각하게 오염되어 있는 것을 발견했다.","hl":"m"},{"n":14,"text":"첫 문장은 글의 제목과 도입 문장이에요. 옥수수 속대가 쓸모없는 것이 아니라 유용한 물 여과 장치로 쓰인다는 주제를 제시하고, 저자가 인도 시골에서 어린 소녀로 살 때 주변 물이 심각하게 오염된 것을 자주 발견했다는 배경을 설명합니다. 여기서 that절은 found의 목적어로 발견한 내용을 구체적으로 전달해요.","hl":"mn"},{"n":15,"text":"첫 번째 문장의 어법 포인트를 짚어 보겠습니다. 첫째, living in the countryside in India는 현재분사로 앞에 있는 a young girl을 뒤에서 수식하는 후치수식입니다. 둘째, that the water around us was seriously polluted는 접속사 that이 이끄는 명사절로 found의 목적어 역할을 합니다. 셋째, was seriously polluted는 수동태로 물이 오염을 당한 상태라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 궁금했다\u003c/span>\u003cspan class=\"en\">I wondered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 어떻게 해결할 수 있을지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">solve \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 문제를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 이 문제를 내가 어떻게 해결할 수 있을지 궁금했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물 오염 문제를 해결하고 싶다는 호기심을 나타내는 문장으로, \u003cb class=\"key\">간접의문문\u003c/b> how I could solve this problem이 wondered의 \u003cb class=\"key\">목적어\u003c/b>로 쓰였다. 이 문장은 문제를 인식한 뒤 해결 방법을 고민하는 단계로 넘어가는 연결고리 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 + 주어 + 동사)\u003c/span> : wondered + [how + 주어(I) + 동사(could solve) + 목적어(this problem)] : \"내가 어떻게 이 문제를 해결할 수 있을지\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"I wondered, 나는 궁금했다. how I could solve, 내가 어떻게 해결할 수 있을지. this problem, 이 문제를. 이 문장 전체를 해석하면, 나는 이 문제를 내가 어떻게 해결할 수 있을지 궁금했다.","hl":"m"},{"n":17,"text":"두 번째 문장은 저자가 물 오염 문제를 어떻게 해결할 수 있을지 궁금해했다는 내용이에요. 여기서 how I could solve this problem은 간접의문문으로 wondered의 목적어 역할을 합니다. 문제를 해결하고 싶다는 호기심이 다음에 나올 옥수수 속대 아이디어로 이어지죠.","hl":"mn"},{"n":18,"text":"두 번째 문장의 어법 포인트는 간접의문문입니다. how I could solve orn cobs, 옥수수 속대를 사용하는. 이 문장 전체를 해석하면, 그때 옥수수 속대를 사용하는 아이디어가 떠올랐다.","hl":"m"},{"n":20,"text":"세 번째 문장은 옥수수 속대를 사용하겠다는 아이디어가 떠올랐다는 핵심 문장이에요. hit on은 아이디어나 해결책을 생각해 내다는 뜻의 관용 표현입니다. to use corn cobs는 앞의 the idea를 뒤에서 수식하는 to부정사의 형용사적 용법이에요.","hl":"mn"},{"n":21,"text":"세 번째 문장의 어법 포인트를 짚어 보겠습니다. 첫째, hit on은 아이디어가 갑자기 떠오르다라는 뜻의 관용 표현이에요. 둘째, to use corn cobs는 the idea를 뒤에서 수식하는 to부정사의 형용사적 용법입니다. 무슨 아이디어인지 구체적으로 설명해 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓸모없는 옥수수 속대는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Useless \u003c/span>\u003cspan class=\"tgt\">corn \u003c/span>\u003cspan class=\"tgt\">cobs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에나 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">everywhere\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 마을에.\u003c/span>\u003cspan class=\"en\">in my village.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쓸모없는 옥수수 속대는 우리 마을 어디에나 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험의 배경이 되는 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>의 흔함을 알려 줍니다. 쓸모없는 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>가 마을 어디에나 있다는 사실이 이후 정수 아이디어로 자연스럽게 연결됩니다. 소재가 \u003cb class=\"key\">쉽게 \u003c/b>\u003cb class=\"key\">구할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는\u003c/b> 재료임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식 (한정적 용법)\u003c/span> : 형용사 + 명사 : \"쓸모없는 옥수수 속대\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사의 과거형 + 장소 부사\u003c/span> : S + was/were + 장소 부사(구) : \"어디에나 있었다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Useless corn cobs, 쓸모없는 옥수수 속대는. were everywhere, 어디에나 있었다. in my village, 우리 마을에.. 이 문장 전체를 해석하면, 쓸모없는 옥수수 속대는 우리 마을 어디에나 있었다.","hl":"m"},{"n":23,"text":"네 번째 문장은 라리타가 사는 마을에 쓸모없는 옥수수 속대가 아주 흔하게 널려 있다는 배경을 설명해요. 이렇게 주변에 많은 재료였기 때문에 정수 실험에 쉽게 활용할 수 있었죠. 쓸모없다는 표현이 오히려 나중에 유용한 재료로 바뀌는 반전을 만들어 주는 중요한 밑밥이에요.","hl":"mn"},{"n":24,"text":"첫 번째 문법 포인트는 Useless corn cobs의 형용사 수식이에요. Useless가 corn cobs를 앞에서 꾸며 주어서 쓸모없는 옥수수 속대라는 뜻을 만들어요. 두 번째 포인트는 were everywhere인데요. be동사 were가 과거 상태를 나타내고 뒤에 everywhere가 장소의 의미를 보충해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각했다\u003c/span>\u003cspan class=\"en\">I thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 작은 구멍들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">holes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥수수 속대의\u003c/span>\u003cspan class=\"en\">in the corn cobs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸러 낼 수 있을 거라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">filter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더러운 물질을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">dirty \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염된 물속에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">polluted \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 옥수수 속대의 작은 구멍들이 오염된 물속에서 더러운 물질을 걸러 낼 수 있을 거라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 라리타가 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>의 작은 구멍에 주목해 \u003cb class=\"key\">오염된 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 걸러 낼 수 있다는 가설을 세운 문장입니다. 단순한 관찰에서 \u003cb class=\"key\">해결책\u003c/b>의 원리를 떠올렸다는 점이 중요합니다. 쓸모없어 보이던 재료의 새로운 기능을 연결한 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : S + thought + that + S' + V' ... : \"그 작은 구멍들이 ...\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could (가능) + 동사원형\u003c/span> : could + 동사원형 : \"걸러 낼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구 filter A out of B\u003c/span> : filter + A + out of + B : \"오염된 물속에서 더러운 물질을 걸러 내다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I thought, 나는 생각했다. that the small holes, 그 작은 구멍들이. in the corn cobs, 옥수수 속대의. could filter, 걸러 낼 수 있을 거라고. dirty matter, 더러운 물질을. out of the polluted water, 오염된 물속에서.. 이 문장 전체를 해석하면, 나는 옥수수 속대의 작은 구멍들이 오염된 물속에서 더러운 물질을 걸러 낼 수 있을 거라고 생각했다.","hl":"m"},{"n":26,"text":"다섯 번째 문장은 라리타가 옥수수 속대의 작은 구멍이 오염된 물에서 더러운 물질을 걸러 낼 수 있을 거라고 생각한 가설입니다. 관찰한 구조를 실제 문제 해결의 원리로 연결한 점이 핵심이에요. 쓸모없어 보이던 재료에서 가능성을 찾아낸 창의적인 발상이 드러나죠.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 that절이에요. I thought 뒤에 that이 이끄는 명사절이 목적어로 와서 생각한 내용을 전달해요. 두 번째 포인트는 조동사 could예요. could는 가능을 나타내고 뒤에 동사원형 filter가 와서 걸러 낼 수 있다는 뜻이 돼요. 세 번째 포인트는 filter A out of B 구문이에요. filter dirty matter out of the pol >어느 날, 나는 길을 따라 가면서 마른 옥수수 속대 몇 개를 주워서 그것들을 씻어 더러운 물이 담긴 그릇에 넣었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실제로 \u003cb class=\"key\">옥수수 \u003c/b>\u003cb class=\"key\">속대\u003c/b>를 모아 씻어 \u003cb class=\"key\">더러운 \u003c/b>\u003cb class=\"key\">물\u003c/b>에 넣는 첫 \u003cb class=\"key\">실험\u003c/b> 장면입니다. 주워서 씻고 넣는 행동이 시간 순서대로 제시되어 실험 과정이 선명하게 드러납니다. 다음 문장의 결과로 이어지는 전환점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사구 병렬\u003c/span> : V1 + ..., V2 + ..., and V3 ... : \"마른 옥수수 속대를 주워서, 씻고, 넣었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : dried + cobs : \"마른 옥수수 속대\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 of + 명사 (내용 표시)\u003c/span> : a bowl of + 명사 : \"더러운 물이 담긴 그릇\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"One day, 어느 날. I picked up, 나는 주웠다. some dried cobs, 마른 옥수수 속대 몇 개를. along the road, 길을 따라 가면서. washed them, 그것들을 씻어. and placed them, 그리고 그것들을 넣었다. in a bowl of dirty water, 더러운 물이 담긴 그릇에.. 이 문장 전체를 해석하면, 어느 날, 나는 길을 따라 가면서 마른 옥수수 속대 몇 개를 주워서 그것들을 씻어 더러운 물이 담긴 그릇에 넣었다.","hl":"m"},{"n":29,"text":"여섯 번째 문장은 라리타가 실제로 실험을 시작하는 장면이에요. 길에서 마른 옥수수 속대를 줍고 씻어서 더러운 물이 담긴 그릇에 넣는 행동이 순서대로 제시되어 있어요. 이 장면은 다음 문장에서 물이 맑아지는 결과로 자연스럽게 이어집니다.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 병렬 구조예요. picked up, washed, placed가 and로 연결되어 세 동작을 시간 순서대로 보여 줘요. 두 번째 포인트는 dried의 과거분사 수식이에요. dried가 cobs를 앞에서 꾸며서 마른 옥수수 속대라는 뜻을 만들어요. 세 번째 포인트는 a bowl of dirty water 표현이에요. a bowl of가 그릇의 내용물을 나타내서 더러운 물이 담긴 그릇이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 후에,\u003c/span>\u003cspan class=\"en\">After a while,\u003c/span>\u003c/div>\u003cdiv clas
