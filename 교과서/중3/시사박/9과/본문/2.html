@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 시사(박) 9과 본문2","audioDir":"2_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>시사(박)\u003cbr>9과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Headbands for Girls' Education\u003c/h1>\u003ch2>소녀들의 교육을 위한 머리띠\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">Mary \u003c/b>\u003cb class=\"key\">Grace \u003c/b>\u003cb class=\"key\">Henry\u003c/b>는 열두 살 때 아프리카 \u003cb class=\"key\">소녀들의 \u003c/b>\u003cb class=\"key\">교육\u003c/b> 문제를 깨닫고, 생일 선물로 받은 \u003cb class=\"key\">재봉틀\u003c/b>로 \u003cb class=\"key\">머리띠\u003c/b>를 만들어 판매하여 한 소녀를 학교에 보낼 \u003cb class=\"key\">기금\u003c/b>을 마련했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mary Grace Henry made and sold headbands to raise money to send an African girl to school.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 시사 박 교과서 본문 Headbands for Girls' Education을 함께 읽어 보겠습니다. Mary Grace Henry의 이야기인데요, 아프리카 소녀들의 교육 문제를 알고 머리띠를 만들어 팔아 기금을 마련한 내용입니다. 글 전체 요지를 먼저 말하면, 그녀는 머리띠를 만들어 판매해서 아프리카 소녀 한 명을 학교에 보냈다는 것입니다. 이제 본격적으로 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">전 세계적으로 \u003cb class=\"key\">교육\u003c/b>은 기본권이지만, 사하라 이남 아프리카에서는 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">형편\u003c/b> 때문에 학교에 가지 못하는 소녀들이 많습니다. 특히 등록금이나 교재비 같은 직접 비용인 school fees를 내기 어려운 경우가 많아요. 이런 문제를 개인이 돕는 방식으로 \u003cb class=\"key\">모금 \u003c/b>\u003cb class=\"key\">활동\u003c/b> fundraising과 \u003cb class=\"key\">기부\u003c/b> donation이 널리 쓰입니다. 이 글의 Mary Grace Henry는 \u003cb class=\"key\">재봉틀\u003c/b>로 \u003cb class=\"key\">머리띠\u003c/b>를 만들어 파는 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">엔터프라이즈\u003c/b> social enterprise의 작은 사례를 보여 줍니다. 마치 우리가 \u003cb class=\"key\">벼룩시장\u003c/b>에서 물건을 팔아 이웃을 돕는 것처럼, 좋아하는 일로 수익을 내어 기부하는 것입니다. 이후에도 그녀는 이 활동을 키워 더 많은 소녀들을 지원했습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 아프리카의 많은 나라에서는 아직도 가정 형편 때문에 학교에 가지 못하는 아이들이 많아요. 특히 소녀들은 등록금이나 교재비인 school fees를 마련하기가 더 어려운 경우가 많죠. 이런 문제를 돕기 위해 fundraising 같은 모금 활동이나 donation 기부가 널리 쓰이고 있어요. Mary Grace Henry는 이 문제를 그냥 지나치지 않고, 좋아하는 재봉틀로 머리띠를 만들어 파는 작은 social enterprise를 시작한 거예요. 마치 우리가 벼룩시장에서 물건을 팔아 이웃을 돕는 것과 비슷하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>교육 기회에 대한 의문\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>화자는 열두 살 때 아프리카의 많은 소녀들이 \u003cb class=\"key\">학교에 \u003c/b>\u003cb class=\"key\">갈 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 이유를 궁금해하며 \u003cb class=\"key\">교육 \u003c/b>\u003cb class=\"key\">기회\u003c/b>의 불평등을 인식한다. 자기 자신은 학교에 다닐 수 있는데도 그들은 그렇지 못하다는 점에서 문제의식을 느낀다. 이 의문은 이후 행동의 출발점이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>원인 인식과 아이디어\u003csmall>전환 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>소녀들이 학교에 가지 못하는 이유가 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">형편\u003c/b> 때문에 학비를 \u003cb class=\"key\">감당할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없기\u003c/b> 때문임을 깨닫는다. 화자는 그 소녀들을 위해 \u003cb class=\"key\">무언가 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있을지\u003c/b> 고민하다가 \u003cb class=\"key\">아이디어\u003c/b>를 떠올린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>머리띠 제작과 판매\u003csmall>실천 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>생일 선물로 \u003cb class=\"key\">재봉틀\u003c/b>을 부탁해 \u003cb class=\"key\">머리띠\u003c/b> 만드는 법을 배우고, 열 개를 만들어 학교에서 \u003cb class=\"key\">판매\u003c/b>한다. 작은 수공예품이지만 직접 만들어 판매함으로써 기부의 실마리를 만든다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기금 마련과 지속 의지\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>머리띠를 판매한 결과 한 소녀를 학교에 보낼 \u003cb class=\"key\">충분한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 모은다. 하지만 화자는 여기서 \u003cb class=\"key\">멈출 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>며 더 큰 도움을 이어가려는 태도를 보인다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어서 살펴볼게요.","hl":null},{"n":4,"text":"첫째, 교육 기회에 대한 의문입니다. 열두 살이었던 Mary Grace Henry는 아프리카의 많은 소녀들이 왜 나처럼 학교에 갈 수 없을까 하고 궁금해했습니다. 자기 자신은 학교에 다닐 수 있는데 그 소녀들은 그렇지 못하다는 점에서 문제의식을 느낀 것이죠. 이 생각이 모든 행동의 출발점이 됩니다.","hl":"f0"},{"n":5,"text":"둘째, 원인을 깨닫고 아이디어를 떠올립니다. 소녀들이 학교에 가지 못하는 이유는 가정 형편 때문에 학비를 감당할 수 없다는 것이었어요. 그 소녀들을 위해 무언가 할 수 있을지 고민하다가, 마침내 아이디어가 떠오른 거예요.","hl":"f1"},{"n":6,"text":"셋째, 머리띠를 만들어 팝니다. 생일 선물로 부모님께 재봉틀을 사 달라고 부탁해서, 머리띠 만드는 법을 배웠어요. 머리띠 열 개를 만들어 학교에서 팔았죠. 작은 수공예품이지만 이게 기부의 실마리가 됩니다.","hl":"f2"},{"n":7,"text":"넷째, 기금을 마련하고 멈추지 않기로 다짐합니다. 머리띠를 판매한 결과 한 소녀를 학교에 보낼 충분한 돈을 모았어요. 그런데 여기서 멈출 수 없다고 말하며 더 큰 도움을 이어가려는 태도를 보인 것이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">앞부분에서는 아프리카 소녀들이 겪는 \u003cb class=\"key\">교육 \u003c/b>\u003cb class=\"key\">기회\u003c/b> 문제를 제기하고, 중간에서는 \u003cb class=\"key\">재봉틀\u003c/b>과 \u003cb class=\"key\">머리띠\u003c/b>라는 해결 방법을 서술합니다. 마지막 부분에서 \u003cb class=\"key\">기금 \u003c/b>\u003cb class=\"key\">마련\u003c/b>이라는 결과와 지속 의지를 드러내므로 미괄식에 가깝습니다. 글 전체가 문제 인식에서 해결, 그리고 결과로 이어지는 \u003cb class=\"key\">문제-해결\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (6)\u003c/b>\u003cspan>아이디어 전환\u003c/span>\u003cb>Soon (10)\u003c/b>\u003cspan>결과·시간 경과\u003c/span>\u003cb>couldn't stop there (11)\u003c/b>\u003cspan>지속 의지\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">many girls in Africa\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">those girls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one girl in Africa\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>아프리카의 많은 소녀들\u003c/th>\u003cth>나(Mary Grace Henry)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>학교에 갈 수 없음\u003c/td>\u003ctd>학교에 다닐 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가정 형편이 어려움\u003c/td>\u003ctd>생일 선물로 재봉틀을 받음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 구조적으로 문제 해결 전개 방식에 해당해요. 앞부분에서는 아프리카 소녀들이 겪는 교육 기회 문제를 제기하고, 중간에서는 재봉틀과 머리띠라는 해결 방법을 서술합니다. 마지막에 기금 마련이라는 결과와 지속 의지를 드러내므로 전체적으로 미괄식 구조로 볼 수 있어요. 문제 해결 구조에서는 문제와 해결 방안, 결과를 구분해 읽는 것이 중요하죠.","hl":"ty"},{"n":9,"text":"신호어를 보면, 여섯 번째 문장의 Then은 아이디어로 전환되는 지점을 알려 줘요. 열 번째 문장의 Soon은 시간이 지나 결과가 나타났음을 보여 주죠. 그리고 마지막 문장의 couldn't stop there는 멈추지 않겠다는 의지를 강조해요. 또 아프리카 소녀들, they, those girls, one girl in Africa처럼 같은 대상을 가리키는 표현이 계속 이어지니 함께 정리해 두면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>headband\u003c/b>\u003cem>명사\u003c/em>\u003cspan>머리띠\u003c/span>\u003c/div>\u003cdiv>\u003cb>education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>Africa\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아프리카\u003c/span>\u003c/div>\u003cdiv>\u003cb>go to school\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>학교에 다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thought\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>realized\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨달았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>families\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족들\u003c/span>\u003c/div>\u003cdiv>\u003cb>afford\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 여유가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wondered\u003c/b>\u003cem>동사\u003c/em>\u003cspan>궁금해했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>do something for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위해 무언가를 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>those girls\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그 소녀들\u003c/span>\u003c/div>\u003cdiv>\u003cb>had an idea\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아이디어가 떠오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>birthday\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생일\u003c/span>\u003c/div>\u003cdiv>\u003cb>asked\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부탁했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>parents\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부모님\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sewing machine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재봉틀\u003c/span>\u003c/div>\u003cdiv>\u003cb>learned\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배웠다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>created\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raised\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다, 모금하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough money\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충분한 돈\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>couldn't stop\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>멈출 수 없었다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 정리해 볼게요. afford는 여유가 있다, 특히 돈을 감당할 수 있다는 뜻이고, couldn't afford는 여유가 없었다고 해석해요. raise는 모으다, 모금하다라는 뜻으로 여기서는 돈을 모았다는 의미로 쓰였죠. sewing machine은 재봉틀, headband는 머리띠라는 뜻이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">realized\u003c/b>\u003cspan class=\"m\">깨달았다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wondered\u003c/b>\u003cspan class=\"m\">궁금해했다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"s\">ponder\u003c/span>\u003cspan class=\"s\">doubt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">know\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">asked\u003c/b>\u003cspan class=\"m\">부탁했다, 물었다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"s\">beg\u003c/span>\u003cspan class=\"s\">inquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">answer\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">learned\u003c/b>\u003cspan class=\"m\">배웠다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">master\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">study\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sold\u003c/b>\u003cspan class=\"m\">팔다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">traded\u003c/span>\u003cspan class=\"s\">marketed\u003c/span>\u003cspan class=\"s\">vended\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bought\u003c/span>\u003cspan class=\"a\">purchased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">raised\u003c/b>\u003cspan class=\"m\">모았다, 모금했다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collected\u003c/span>\u003cspan class=\"s\">gathered\u003c/span>\u003cspan class=\"s\">lifted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">spent\u003c/span>\u003cspan class=\"a\">lowered\u003c/span>\u003cspan class=\"a\">reduced\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 익혀 두면 시험에 도움이 돼요. realized는 깨달았다는 뜻인데 understand, notice, recognize와 바꿔 쓸 수 있고, ignore와 overlook은 반대 개념이에요. wondered는 궁금해했다는 뜻으로 question, ponder와 유사하고요. raised는 collected나 gathered와 비슷하지만 spent나 lowered와는 반대 의미가 됩니다. sold는 팔다인데 bought나 purchased와 반대죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소녀들의 교육을 위한 머리띠\u003c/span>\u003cspan class=\"en\">Headbands for Girls' Education\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메리 그레이스 헨리\u003c/span>\u003cspan class=\"en\">(Mary Grace Henry)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 아프리카의 많은 소녀들은\u003c/span>\u003cspan class=\"en\">'\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">girls \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Africa \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에 갈 수 없을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나처럼?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">can\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소녀들의 교육을 위한 머리띠 ‘아프리카의 많은 소녀들은 왜 나처럼 학교에 갈 수 없을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 제목과 작가의 첫 질문이에요. 작가는 아프리카의 많은 소녀들이 자신과 달리 학교에 갈 수 없는 \u003cb class=\"key\">불평등한 \u003c/b>\u003cb class=\"key\">현실\u003c/b>에 의문을 품어요. 제목의 Headbands for Girls' Education은 앞으로 머리띠로 교육을 돕겠다는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결의 \u003c/b>\u003cb class=\"key\">실마리\u003c/b>를 암시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정과 의문문\u003c/span> : Why + can't (can + not) + S + V원형 : \"왜 많은 아프리카 소녀들이 학교에 갈 수 없을까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as (나처럼)\u003c/span> : as + S + can (본동사 생략) : \"내가 할 수 있는 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Headbands for Girls' Education, 소녀들의 교육을 위한 머리띠. (Mary Grace Henry), 메리 그레이스 헨리. 'Why can't many girls in Africa, 왜 아프리카의 많은 소녀들은. go to school, 학교에 갈 수 없을까. as I can?, 나처럼?. 이 문장 전체를 해석하면, 소녀들의 교육을 위한 머리띠 ‘아프리카의 많은 소녀들은 왜 나처럼 학교에 갈 수 없을까?","hl":"m"},{"n":13,"text":"이 문장은 글의 제목과 작가의 첫 질문이에요. 작가는 아프리카의 많은 소녀들이 자신과 달리 학교에 갈 수 없는 불평등한 현실에 의문을 품고 있어요. 제목에 나온 소녀들의 교육을 위한 머리띠는 앞으로 머리띠로 교육을 돕겠다는 문제 해결의 실마리를 암시해요.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서는 두 가지 어법을 짚어 볼게요. 첫 번째, Why can't many girls in Africa go to school에서 can't는 조동사 can의 부정으로 의문사 Why와 함께 쓰여 왜 학교에 갈 수 없는지 묻는 의문문을 만들어요. can't 뒤에는 반드시 동사원형 go가 와야 해요. 두 번째, as I can은 접속사 as가 나처럼이라는 뜻으로 쓰여서 앞의 내용과 비교를 해 줘요. as 뒤에 주어 I와 조동사 can이 왔고 본동사 go to school은 생략된 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 바란다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 학교에 갈 수 있기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">too.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들도 학교에 갈 수 있으면 좋을 텐데.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작가의 \u003cb class=\"key\">소망\u003c/b>을 드러내는 문장으로, I wish와 가정법 과거를 사용해 그 소녀들도 학교에 갈 수 있으면 좋겠다고 말해요. 이는 실현되기 어려운 현재의 바람이지만 작가의 \u003cb class=\"key\">동기\u003c/b>가 되는 핵심 감정이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">I wish + 가정법 과거\u003c/span> : I wish + S + could + V원형 : \"그들이 학교에 갈 수 있으면 좋겠다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I wish, 나는 바란다. they could go to school, 그들이 학교에 갈 수 있기를. too.', 또한. 이 문장 전체를 해석하면, 그들도 학교에 갈 수 있으면 좋을 텐데.’","hl":"m"},{"n":16,"text":"이 문장은 작가의 소망을 드러내는 문장으로 I wish에 가정법 과거를 써서 그 소녀들도 학교에 갈 수 있으면 좋겠다고 말해요. 실현되기 어려운 현재의 바람이지만 작가가 행동하게 된 동기가 되는 핵심 감정이에요.","hl":"mn"},{"n":17,"text":"여기서 핵심 어법은 I wish they could go to school이에요. I wish 뒤에 주어와 could가 오는 가정법 과거 형태로 현재 일어나지 않는 일에 대한 소망을 나타내요. could는 단순히 can의 과거가 아니라 그럴 수 있으면 좋겠다는 공손한 소망의 의미로 쓰였어요. 그래서 그들도 학교에 갈 수 있으면 좋을 텐데라는 해석이 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 이 생각을 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 열두 살이었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">twelve\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 열두 살 때 이렇게 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작가가 이런 생각을 한 시점을 밝히는 문장이에요. 고작 \u003cb class=\"key\">열두 \u003c/b>\u003cb class=\"key\">살\u003c/b>이라는 어린 나이에 문제의식을 가졌다는 점에서, 어린 학생도 사회 문제에 관심을 가질 수 있다는 \u003cb class=\"key\">메시지\u003c/b>를 전해요. 앞으로 이어질 행동으로 넘어가는 연결고리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순 과거시제\u003c/span> : S + had (have의 과거형) + 목적어 : \"나는 이런 생각을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절 (접속사 when)\u003c/span> : when + S + was + twelve (years old 생략) : \"내가 열두 살이었을 때\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I had this thought, 나는 이 생각을 했다. when I was twelve, 내가 열두 살이었을 때. 이 문장 전체를 해석하면, 나는 열두 살 때 이렇게 생각했다.","hl":"m"},{"n":19,"text":"이 문장은 작가가 이런 생각을 한 시점을 밝히는 문장이에요. 고작 열두 살이라는 어린 나이에 문제의식을 가졌다는 점에서 어린 학생도 사회 문제에 관심을 가질 수 있다는 메시지를 전해요. 앞으로 이어질 행동으로 넘어가는 연결고리 역할을 해요.","hl":"mn"},{"n":20,"text":"첫 번째, I had this thought는 have의 과거형 had를 써서 과거의 사실을 단순 과거로 나타냈어요. 두 번째, when I was twelve를 봐야 해요. when은 접속사로 뒤에 주어 I와 동사 was를 이끌면서 내가 열두 살이었을 때라는 시간의 부사절을 만들어요. twelve는 twelve years old에서 years old가 생략된 나이 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 깨달았다\u003c/span>\u003cspan class=\"en\">I realized\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가족이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">families \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 감당할 수 없다는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">afford \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그들의 가족이 그럴 만한 금전적인 여유가 없다는 것을 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 던진 왜라는 질문에 답하는 이유가 드러나는 문장이다. 화자는 소녀들이 학교에 다니지 못하는 까닭이 가정 형편 때문임을 \u003cb class=\"key\">깨달았다\u003c/b>. 이때 couldn't afford는 \u003cb class=\"key\">금전적 \u003c/b>\u003cb class=\"key\">여유가 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절\u003c/span> : realized + [that + 주어 + 동사] : \"그들의 가족이 그것을 감당할 수 없다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형 afford\u003c/span> : couldn't [조동사] + afford [동사원형] + it [목적어] : \"그것을 감당할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I realized, 나는 깨달았다. that their families, 그들의 가족이. couldn't afford it, 그것을 감당할 수 없다는 것을.. 이 문장 전체를 해석하면, 나는 그들의 가족이 그럴 만한 금전적인 여유가 없다는 것을 깨달았다.","hl":"m"},{"n":22,"text":"이 문장은 소녀들이 학교에 다니지 못하는 이유가 가정 형편 때문이라는 걸 화자가 깨달은 내용이에요. realized는 깨달았다는 뜻이고, couldn't afford는 금전적으로 여유가 없었다는 뜻이죠. 그래서 그 가족들은 학비를 감당할 수 없었던 거예요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 that이 이끄는 명사절인데요. I realized의 뒤에 that their families couldn't afford it이 와서 깨달은 내용을 목적어로 전달해요. that절은 완전한 문장이기 때문에 접속사 that을 쓴 거예요. 두 번째 포인트는 couldn't afford인데요. afford는 보통 can이나 could와 함께 쓰여서 금전적으로 여유가 되다라는 뜻을 나타내요. couldn't는 could not의 줄임말이고, 능력이나 가능을 나타내는 조동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 궁금했다\u003c/span>\u003cspan class=\"en\">I wondered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 무언가를 할 수 있을지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소녀들을 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">girls\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그 소녀들을 위해 내가 무언가를 할 수 있을지 궁금했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 소녀들을 위해 무언가 할 수 있을지 고민하는 마음을 담은 문장이다. 구체적인 계획은 아니지만 \u003cb class=\"key\">wondered \u003c/b>\u003cb class=\"key\">if\u003c/b>가 \u003cb class=\"key\">간접의문문\u003c/b>을 이끌며 막연한 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">의지\u003c/b>를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : wondered + [if + 주어 + 동사] : \"내가 그 소녀들을 위해 무언가를 할 수 있을지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형 do\u003c/span> : could [조동사] + do [동사원형] : \"할 수 있을지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I wondered, 나는 궁금했다. if I could do something, 내가 무언가를 할 수 있을지. for those girls, 그 소녀들을 위해.. 이 문장 전체를 해석하면, 나는 그 소녀들을 위해 내가 무언가를 할 수 있을지 궁금했다.","hl":"m"},{"n":25,"text":"이 문장은 화자가 소녀들을 위해 무언가를 할 수 있을지 고민하는 마음을 담고 있어요. 구체적인 계획은 아니지만 무언가 돕고 싶다는 의지를 보여 주는 문장이죠. if는 ~인지 아닌지라는 뜻이에요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 if가 이끄는 간접의문문이에요. wondered의 목적어로 if I could do something for those girls가 왔는데, 내가 그 소녀들을 위해 무언가를 할 수 있을지라는 뜻이에요. 이때 if는 ~인지 아닌지라는 뜻의 접속사라서 뒤에 의문문이 아닌 평서문 어순이 와요. 두 번째 포인트는 could do인데요. could는 can의 과거형으로 ~할 수 있었다라는 능력이나 가능성을 나타내요. do는 일반동사 원형이라서 could 뒤에 그대로 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아이디어가 떠올랐다.\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 아이디어가 떠올랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 머릿속에 아이디어가 떠오른 순간을 나타내는 문장이다. 앞에서 고민했던 내용이 구체적 행동으로 넘어가는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b> 역할을 한다. \u003cb class=\"key\">have \u003c/b>\u003cb class=\"key\">an \u003c/b>\u003cb class=\"key\">idea\u003c/b>는 '아이디어가 떠오르다'라는 뜻으로 통째로 익혀 두는 것이 좋다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 have an idea\u003c/span> : have [동사] + an idea [명사구] : \"아이디어가 떠올랐다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Then, 그때. I had an idea, 나는 아이디어가 떠올랐다.. 이 문장 전체를 해석하면, 그때 아이디어가 떠올랐다.","hl":"m"},{"n":28,"text":"이 문장은 머릿속에 아이디어가 떠오른 순간을 나타내요. 앞에서 고민했던 내용이 이제 구체적인 행동으로 넘어가는 연결 고리 역할을 하죠. have an idea는 아이디어가 떠오르다라는 의미로 통째로 외워 두면 좋아요.","hl":"mn"},{"n":29,"text":"이 문장에서 주목할 어법은 관용 표현 have an idea인데요. have an idea는 단순히 아이디어를 가지고 있다는 의미보다는 아이디어가 떠오르다라는 뜻으로 쓰여요. 그래서 Then I had an idea는 그때 아이디어가 떠올랐다고 자연스럽게 해석하는 게 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 생일에,\u003c/span>\u003cspan class=\"en\">For my birthday,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 부모님께 부탁했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">parents \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게 재봉틀을 하나 사 달라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sewing \u003c/span>\u003cspan class=\"tgt\">machine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내 생일에 부모님께 재봉틀을 하나 사 달라고 부탁했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 막연한 소망에서 벗어나 부모님께 \u003cb class=\"key\">재봉틀\u003c/b>을 부탁하는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 옮겨 갔음을 보여 줍니다. 생일 선물로 재봉틀을 택한 것은 머리띠를 만들어 소녀 교육을 돕겠다는 실천의 첫 단계입니다. ask my parents to buy는 '부모님께 사 달라고 부탁했다'라는 \u003cb class=\"key\">요청의 \u003c/b>\u003cb class=\"key\">5형식\u003c/b> 구조로도 자주 출제됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">ask + 목적어 + to부정사 (5형식)\u003c/span> : ask + [my parents 목적어] + [to buy me a sewing machine 목적격 보어] : \"부모님께 나에게 재봉틀을 하나 사 달라고 부탁했다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"For my birthday, 내 생일에. I asked my parents, 나는 부모님께 부탁했다. to buy me a sewing machine, 나에게 재봉틀을 하나 사 달라고.. 이 문장 전체를 해석하면, 나는 내 생일에 부모님께 재봉틀을 하나 사 달라고 부탁했다.","hl":"m"},{"n":31,"text":"일곱 번째 문장은 소녀가 그저 바라기만 한 게 아니라 부모님께 재봉틀을 부탁하는 구체적인 행동으로 나아간 장면이에요. 생일 선물로 재봉틀을 택했다는 점에서 머리띠를 만들어 팔겠다는 계획이 행동으로 시작된 거죠. 여기서 ask my parents to buy는 부모님께 사 달라고 부탁했다는 요청의 구조로 문법에서도 중요해요.","hl":"mn"},{"n":32,"text":"이 문장에서 눈여겨볼 핵심 어법은 ask my parents to buy me a sewing machine이에요. ask는 목적어와 목적격 보어로 to부정사를 취하는 오형식 동사인데, my parents가 목적어, to buy가 목적격 보어 역할을 합니다. 뜻은 부모님께 나에게 재봉틀을 하나 사 달라고 부탁했다가 되죠. 이 구조는 시험에 자주 나오니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 내게 재봉틀을 하나 사 주셨고,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bought \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 배웠다\u003c/span>\u003cspan class=\"en\">and I learned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머리띠를 만드는 방법을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">headbands\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 내게 재봉틀을 하나 사 주셨고, 나는 머리띠를 만드는 방법을 배웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 부모님이 재봉틀을 사 주시고 소녀가 직접 머리띠 만드는 \u003cb class=\"key\">기술을 \u003c/b>\u003cb class=\"key\">습득\u003c/b>했음을 나타냅니다. one은 문맥상 a sewing machine을 가리키므로 문장이 반복을 피하면서 자연스럽게 이어집니다. 기금 마련을 위한 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">준비\u003c/b>가 완료되는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 buy\u003c/span> : bought [수여동사] + me [간접목적어] + one [직접목적어] : \"내게 하나(재봉틀)를 사 주셨고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (how to부정사)\u003c/span> : learned [타동사] + [how to make headbands (의문사 + to부정사구/목적어)] : \"머리띠를 만드는 방법을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They bought me one, 그들은 내게 재봉틀을 하나 사 주셨고. and I learned, 그리고 나는 배웠다. how to make headbands, 머리띠를 만드는 방법을.. 이 문장 전체를 해석하면, 그들은 내게 재봉틀을 하나 사 주셨고, 나는 머리띠를 만드는 방법을 배웠다.","hl":"m"},{"n":34,"text":"여덟 번째 문장은 부모님이 재봉틀을 사 주셨고 이제 소녀가 직접 머리띠를 만드는 기술을 배웠다는 내용이에요. one은 재봉틀을 가리키고 how to make headbands가 만드는 방법이라는 뜻이죠. 이렇게 생산을 위한 준비가 완료되는 단계예요.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 bought me one이에요. buy는 목적어를 두 개 취하는 사형식 동사라서 me가 간접목적어, one이 직접목적어로 쓰였어요. one은 앞에 나온 a sewing machine을 대신하는 부정대명사입니다. 두 번째 포인트는 how to make headbands예요. how와 to부정사가 결합해 만드는 방법이라는 뜻의 명사구가 되어 learned의 목적어 자리에 왔어요. 시험에서는 의문사와 to부정사로 자주 출제되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 머리띠 열 개를 만들었고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">created \u003c/span>\u003cspan class=\"tgt\">ten \u003c/span>\u003cspan class=\"tgt\">headbands \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들을 팔았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sold \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 학교에서.\u003c/span>\u003cspan class=\"en\">at my school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 머리띠 열 개를 만들어 학교에서 그것들을 팔았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 머리띠 열 개를 실제로 만들어 학교에서 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">판매\u003c/b>를 한 장면입니다. 작은 수량이지만 직접 생산과 판매를 실행했다는 점에서 \u003cb class=\"key\">실천\u003c/b>의 의미가 큽니다. 뒤이어 한 소녀를 학교에 보낼 돈을 마련했다는 결과로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 동사 병렬\u003c/span> : created ten headbands + and + sold them : \"머리띠 열 개를 만들었고 그것들을 팔았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I created ten headbands, 나는 머리띠 열 개를 만들었고. and sold them, 그리고 그것들을 팔았다. at my school, 우리 학교에서.. 이 문장 전체를 해석하면, 나는 머리띠 열 개를 만들어 학교에서 그것들을 팔았다.","hl":"m"},{"n":37,"text":"아홉 번째 문장은 머리띠 열 개를 실제로 만들어 학교에서 팔았다는 첫 판매 장면이에요. 작은 규모이지만 직접 만들고 팔았다는 점에서 실천의 의미가 커요. 이 판매로 한 소녀를 학교에 보낼 돈을 마련하게 되죠.","hl":"mn"},{"n":38,"text":"이 문장에서 and는 created ten headbands와 sold them을 같은 수준으로 연결하는 등위접속사입니다. 앞뒤에 동사구가 나란히 와서 만들었다와 팔았다라는 두 동작이 이어지는 병렬 구조예요. 이처럼 and가 나오면 앞뒤 구조의 일치를 확인하는 문제가 자주 출제되니까 꼭 살펴보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧, 나는 충분한 돈을 모았다\u003c/span>\u003cspan class=\"en\">Soon, I raised \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">money \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 소녀를 보내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">girl \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Africa \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧 나는 아프리카에 있는 한 소녀를 학교에 보낼 충분한 돈을 모았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 머리띠 판매로 번 돈이 아프리카에 있는 한 소녀를 학교에 보낼 수 있을 만큼 모였다는 내용입니다. 지문 흐름에서 작은 아이디어가 실제 교육 지원으로 이어진 첫 성과를 보여 줍니다. \u003cb class=\"key\">enough \u003c/b>\u003cb class=\"key\">money \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">send\u003c/b>가 ‘보낼 만큼 충분한 돈’이라는 핵심 의미를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">enough + 명사 + to부정사\u003c/span> : enough + [money (명사)] + [to send (to부정사)] : \"보낼 충분한 돈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [raised] [enough money] + [to send one girl in Africa to school (to부정사구)] : \"아프리카에 있는 한 소녀를 학교에 보내기 위해\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Soon, I raised enough money, 곧, 나는 충분한 돈을 모았다. to send one girl, 한 소녀를 보내기 위해. in Africa, 아프리카에 있는. to school, 학교로.. 이 문장 전체를 해석하면, 곧 나는 아프리카에 있는 한 소녀를 학교에 보낼 충분한 돈을 모았다.","hl":"m"},{"n":40,"text":"이 문장은 머리띠를 팔아 모은 돈이 아프리카에 있는 한 소녀를 학교에 보낼 수 있을 만큼 충분했다는 뜻이에요. 작은 아이디어가 실제로 누군가의 교육을 바꾼 첫 번째 성과를 보여 주는 중요한 문장이죠. 여기서 enough money to send는 보낼 만큼 충분한 돈이라는 의미를 꼭 기억하세요.","hl":"mn"},{"n":41,"text":"어법 포인트를 설명해 드릴게요. 첫 번째, enough money to send는 enough가 명사 money를 수식하고 뒤에 to부정사가 와서 보낼 만큼 충분한 돈이라는 뜻을 만들어요. 두 번째, to send one girl in Africa to school은 돈을 모은 목적을 나타내는 to부정사의 부사적 용법이에요. 이 두 가지가 이 문장의 핵심 어법이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 멈출 수 없었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서.\u003c/span>\u003cspan class=\"en\">there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 거기서 멈출 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 한 명을 도운 데서 그치지 않고 계속해서 더 많은 소녀를 돕겠다는 의지를 나타냅니다. 앞 문장의 성과를 이어받아 이야기의 방향을 확장하는 역할을 합니다. \u003cb class=\"key\">couldn't \u003c/b>\u003cb class=\"key\">stop\u003c/b>은 ‘멈출 수 없었다’, 즉 계속해야겠다는 결심을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정 (couldn't + 동사원형)\u003c/span> : couldn't + [stop (동사원형)] : \"멈출 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I couldn't stop, 나는 멈출 수 없었다. there, 거기서.. 이 문장 전체를 해석하면, 나는 거기서 멈출 수 없었다.","hl":"m"},{"n":43,"text":"이 문장은 한 명을 도운 것에서 그치지 않고 계속해서 더 많은 소녀를 돕겠다는 의지를 나타내요. 앞에서 보여 준 성과를 이어받아 이야기를 더 넓게 펼치는 역할을 하죠. couldn't stop은 멈출 수 없었다, 즉 계속하겠다는 결심을 강조하는 표현이에요.","hl":"mn"},{"n":44,"text":"어법 포인트를 설명해 드릴게요. could not의 줄임말인 couldn't는 ~할 수 없었다라는 뜻이고 뒤에는 반드시 동사원형이 와요. 여기서는 couldn't stop이 되어 멈출 수 없었다로 해석됩니다. 조동사의 부정형 형태를 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 아프리카의 많은 소녀들이 \u003cb class=\"key\">학교에 \u003c/b>\u003cb class=\"key\">갈 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 문제를 발견했다.\u003c/li>\u003cli>그 원인은 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">형편\u003c/b>이 어려워 학비를 \u003cb class=\"key\">감당할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없기\u003c/b> 때문이라는 것을 깨달았다.\u003c/li>\u003cli>생일 선물로 받은 \u003cb class=\"key\">재봉틀\u003c/b>로 \u003cb class=\"key\">머리띠\u003c/b>를 만들어 팔아 \u003cb class=\"key\">기금\u003c/b>을 마련했다.\u003c/li>\u003cli>그 기금으로 한 소녀를 \u003cb class=\"key\">학교에 \u003c/b>\u003cb class=\"key\">보냈\u003c/b>고, 도움을 \u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않기\u003c/b>로 다짐했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mary Grace Henry made and sold headbands to raise money to send an African girl to school.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">Mary \u003c/b>\u003cb class=\"key\">Grace \u003c/b>\u003cb class=\"key\">Henry\u003c/b>는 열두 살 때 아프리카 \u003cb class=\"key\">소녀들의 \u003c/b>\u003cb class=\"key\">교육\u003c/b> 문제를 깨닫고, 생일 선물로 받은 \u003cb class=\"key\">재봉틀\u003c/b>로 \u003cb class=\"key\">머리띠\u003c/b>를 만들어 판매하여 한 소녀를 학교에 보낼 \u003cb class=\"key\">기금\u003c/b>을 마련했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 본문을 정리하면요, Mary Grace Henry는 아프리카 소녀들의 교육 문제를 발견하고 머리띠를 만들어 팔아서 기금을 마련했어요. 작은 아이디어와 실천이 한 소녀의 교육 기회를 만들었고, 그녀는 거기서 멈추지 않겠다고 다짐했죠. 여러분도 문제를 발견하면 작은 행동으로 해결해 나가는 태도를 기억해 보세요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
