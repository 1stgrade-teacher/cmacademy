Q59euenP/ANfP0oWmnVWTvp/mF9u+mm+7X5X/ABvZi/p6/wCf/wBf9aO/p/n88c/57n8v8/5zx2p0YO9eOc9+eQeM8jk+mMDPbAzlOS36JXXVv/N9PVFxTbSSbd199+tj/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Teenagers Changing the World with Creative Ideas<small>창의적인 아이디어로 세상을 바꾸는 십 대들</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">세상을 바꾸는 힘은 거창한 것이 아니라, 작은 아이디어에서 시작된다는 사실을 이해하는 것이 이 글의 핵심이에요. 우리 사회를 긍정적으로 변화시키는 활동을 일컬어 사회적 혁신(Social Innovation)이라고 하는데, 이는 기존의 사회 문제를 새로운 방식으로 해결하려는 창의적인 시도를 의미하죠. 청소년들이 주도하는 이러한 변화는 체인지메이커(Changemaker) 정신과 맞닿아 있는데, 이는 단순히 남을 돕는 봉사를 넘어 세상을 더 나은 곳으로 만들겠다는 주체적인 의지를 뜻한답니다. 마치 나비 효과(Butterfly Effect)처럼 작은 날갯짓이 거대한 태풍을 불러오듯, 십 대들의 참신한 아이디어(Fresh Idea)가 우리 사회에 얼마나 큰 울림을 줄 수 있는지 주목하며 지문을 읽어보세요. 이 글을 통해 여러분도 세상을 바꿀 수 있는 잠재력(Potential)을 발견하고, 스스로 무엇을 할 수 있을지 고민해보는 귀한 시간이 되었으면 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01질문 던지기</div><ul><li>세상을 변화시키는 사람들의 특징과 나이에 대한 고정관념에 의문을 제기합니다.</li><li>세상의 변화를 이끄는 주체에 대한 탐구</li><li>어린 나이가 변화의 장벽인지에 대한 자문</li><li>핵심 키워드: 변화(change), 십 대(teenagers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02소개</div><ul><li>자신의 아이디어를 실천하여 세상을 개선한 세 명의 청소년을 소개합니다.</li><li>세상을 더 나은 곳으로 만드는 실천(make the world a better place)</li><li>주인공으로 등장하는 세 명의 십 대들</li><li>핵심 키워드: 아이디어(ideas), 세상(world)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">the world</td><td class=\"m\">세상, 세계</td></tr><tr><td class=\"w\">teenager</td><td class=\"m\">10대, 청소년</td></tr><tr><td class=\"w\">make a better place</td><td class=\"m\">더 나은 곳으로 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누구입니까</span><span class=\"en\"><b><span class=\"grammar-hl\">Who</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">are the people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 바꾸는</span><span class=\"en\"><b>who change the world?</b></span></div></div><div class=\"lec-sent-ko\">세상을 바꾸는 사람들은 누구입니까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 서두에서 독자에게 세상을 바꾸는 인물들에 대한 정의를 질문하며, 앞으로 전개될 이야기의 중심 주제가 &#39;세상을 변화시키는 사람&#39;임을 암시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the people who change the world (관계대명사): who는 선행사 the people을 수식하며, 관계대명사절 내부에서 change의 주어 역할을 하는 주격 관계대명사입니다.</div><div class=\"lec-gr-item\">Who are the people (간접의문문): 문장 전체가 의문문 구조를 띠고 있으며, who가 보어 자리에서 문장 전체의 의문 구조를 이끌고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">the world</td><td class=\"m\">세상, 세계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 생각하나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 너무 어리다고</span><span class=\"en\"><b>you are <span class=\"grammar-hl\">too young</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 사람들 중 하나가 되기에는</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span> one of these people?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 너무 어려서 이런 사람들 중 하나가 될 수 없다고 생각하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 던진 질문을 독자 개인의 상황으로 끌어들여, 나이가 세상을 바꾸는 활동의 걸림돌이 아님을 역설적으로 질문함으로써 독자의 주의를 집중시키고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you think (간접의문문): think 뒤에 생략된 접속사 that절(you are ~ people)이 목적어 역할을 하며, 문장 전체가 의문문 형식을 취하고 있습니다.</div><div class=\"lec-gr-item\">too young to be (to부정사): &#39;too + 형용사 + to부정사&#39; 구조로, &#39;너무 ~해서 ~할 수 없다&#39;는 의미를 나타내는 부사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">to be 수동태/수동구조와 구분되는 일반 상태 보어: be는 앞의 to부정사와 결합하여 주어(you)의 상태를 설명하는 보어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음 이야기들에서</span><span class=\"en\"><b>In the following stories</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 세 명의 십 대들을 만날 겁니다</span><span class=\"en\"><b>you will meet three <span class=\"grammar-hl\">teenagers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 아이디어를 사용한</span><span class=\"en\"><b><span class=\"grammar-hl\">who used</span> their ideas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 더 나은 곳으로 만들기 위해</span><span class=\"en\"><b>to <span class=\"grammar-hl\">make the world a better place</span>.</b></span></div></div><div class=\"lec-sent-ko\">다음 이야기들에서 여러분은 세상을 더 나은 곳으로 만들기 위해 자신들의 아이디어를 사용한 세 명의 십 대들을 만날 겁니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 질문들에 대한 답변을 제시하는 단계로, 본문에서 소개될 주인공들이 평범한 십 대임을 밝히며 그들의 구체적인 활약상을 소개하기 위한 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">teenagers who used (관계대명사): who는 선행사 teenagers를 수식하며, 절 내부에서 used의 주어 역할을 하는 주격 관계대명사입니다.</div><div class=\"lec-gr-item\">used their ideas to make (to부정사): to make는 앞의 목적어(the world)를 보충 설명하는 목적보어 역할의 5형식 구조를 돕거나, &#39;~하기 위해서&#39;라는 의미의 부사적 용법으로 쓰였습니다.</div><div class=\"lec-gr-item\">make the world a better place 5형식(SVOC) 구조: make + the world(목적어) + a better place(목적보어) 구조로, 목적어를 목적보어 상태로 만들다라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the world</td><td class=\"m\">세상, 세계</td></tr><tr><td class=\"w\">teenager</td><td class=\"m\">10대, 청소년</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>세상을 바꾸는 사람들은 특별한 나이 제한이 있지 않다.</li><li>평범한 십 대들도 자신의 창의적인 아이디어를 통해 세상을 개선할 수 있다.</li><li>본문에서는 구체적으로 세상을 변화시킨 세 명의 십 대 사례를 다룰 예정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Teenagers can transform the world through their unique ideas, and they prove that age is not a barrier to making a difference.</div>\n              <div class=\"lec-final-sum-ko\">십 대들은 독창적인 아이디어를 통해 세상을 변화시킬 수 있으며, 그들은 나이가 변화를 만드는 데 걸림돌이 아님을 증명한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"}],[{"audio":"./1_audio/6.mp3","hl":null}],[{"audio":"./1_audio/7.mp3","hl":"main"},{"audio":"./1_audio/8.mp3","hl":"meaning"},{"audio":"./1_audio/9.mp3","hl":"grammar"}],[{"audio":"./1_audio/10.mp3","hl":"main"},{"audio":"./1_audio/11.mp3","hl":"meaning"},{"audio":"./1_audio/12.mp3","hl":"grammar"}],[{"audio":"./1_audio/13.mp3","hl":"main"},{"audio":"./1_audio/14.mp3","hl":"meaning"},{"audio":"./1_audio/15.mp3","hl":"grammar"}],[{"audio":"./1_audio/16.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=docum
