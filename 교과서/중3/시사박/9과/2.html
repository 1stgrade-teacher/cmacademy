fordable Robotic Hands for a Better World<small>공유를 통한 혁신: 더 나은 세상을 위한 저렴한 로봇 손 제작</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 3D 프린팅(3D Printing) 기술이 제조 분야에서 어떤 혁신을 가져왔는지 알면 도움이 돼요. 과거에는 복잡한 부품을 제작하려면 비싼 금형 기계가 필요했지만, 3D 프린팅은 디지털 도면만 있으면 적층 제조(Additive Manufacturing) 방식으로 물건을 직접 출력할 수 있어 비용과 시간을 획기적으로 줄여주죠. 또한, 설계도를 인터넷에 공개해 누구나 수정하고 개선할 수 있게 하는 오픈 소스(Open Source) 문화는 지식과 기술의 공유를 통해 전 세계적인 협업을 가능하게 합니다. 마치 레고 블록을 공유해서 함께 더 멋진 성을 쌓는 것처럼, 기술을 나누는 것만으로도 사회적 가치(Social Value)를 창출할 수 있다는 점을 기억해 보세요. 이러한 기술적 배경은 이스턴 라샤펠이 어떻게 저렴하고 효율적인 로봇 손을 만들 수 있었는지 이해하는 핵심 열쇠가 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제의 발견</div><ul><li>과학 박람회에서 고가의 로봇 의수를 사용하는 소녀를 보고 저렴하고 성능 좋은 의수를 만들기로 결심함.</li><li>소녀의 로봇 의수 가격(cost): 8만 달러</li><li>성능은 제한적이나 매우 비싼 가격에 놀람</li><li>더 나은 의수를 직접 만들기로 다짐함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기술적 성공</div><ul><li>수많은 시행착오 끝에 3D 프린팅 기술을 활용하여 저렴한 가격으로 로봇 의수를 제작함.</li><li>수많은 실패(failures) 끝에 얻은 결실</li><li>3D 프린팅 기술(3D printing technology) 활용</li><li>제작 비용: 300달러로 획기적 절감</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03공유와 협력</div><ul><li>개인의 노력을 넘어 더 나은 세상을 만들기 위해 설계와 소프트웨어를 무료로 공개함.</li><li>설계와 소프트웨어(designs and software) 무료 공유</li><li>타인에게 유용한 도구로 활용되기를 기대함</li><li>함께 노력하여 더 나은 세상(better world)을 만들자는 의지</li><li>핵심 키워드: 공유(sharing), 협력(working together)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come across</td><td class=\"m\">우연히 마주치다, 우연히 발견하다</td></tr><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr><tr><td class=\"w\">failure</td><td class=\"m\">실패, 결함, 낙제</td></tr><tr><td class=\"w\">work together</td><td class=\"m\">협력하다, 힘을 합치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>A Robotic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 열네 살이었을 때,</span><span class=\"en\"><b>Hand from a Helpful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 어린 소녀를 우연히 만났다</span><span class=\"en\"><b>Mind (Easton LaChappelle) One day, <span class=\"grammar-hl\">when</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 과학 박람회에서</span><span class=\"en\"><b><span class=\"grammar-hl\">I was fourteen</span>, I came across a little girl at a science fair.</b></span></div></div><div class=\"lec-sent-ko\">내가 열네 살이었을 때, 어느 날 한 과학 박람회에서 나는 어린 소녀를 우연히 만났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 필자가 로봇 손 개발이라는 문제의식에 도달하게 된 계기인 특정 사건을 시간과 장소를 밝히며 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when I was fourteen (분사구문): 시간의 부사절 &#39;when + 주어(I) + be동사(was) + 보어(fourteen)&#39; 구조를 갖춘 부사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 로봇 손을 가지고 있었다</span><span class=\"en\"><b>She had a robotic hand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 펴고 오므릴 수만 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that could only open and close</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 단지 펴고 오므릴 수만 있는 로봇 손을 착용하고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 소녀를 구체적으로 묘사하여, 당시 기술이 가진 기능적 한계를 독자에게 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that could only open and close (관계대명사): &#39;a robotic hand&#39;를 선행사로 받아 뒤에서 수식하며, 관계대명사 that 뒤에는 주어(the robotic hand)가 생략된 불완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 놀랐다</span><span class=\"en\"><b><span class=\"grammar-hl\">I was surprised</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 손이 그녀에게 8만 달러의 비용이 들었다는 것에</span><span class=\"en\"><b>that the hand had cost her 80,000 dollars!</b></span></div></div><div class=\"lec-sent-ko\">나는 그녀가 그 손에 8만 달러를 지불했다는 데 놀랐다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 필자가 로봇 손 개발이라는 문제의식에 도달하게 된 계기인 특정 사건을 시간과 장소를 밝히며 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was surprised (수동태): be동사(was)+p.p.(surprised) 구조. surprise는 타동사인데 목적어가 없어서 수동구조 was surprised 형태로 쓴다. 기본구조: surprise + O (O를 놀라게 하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;나는 바란다</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">I wish</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 더 나은 로봇 손을 가지기를,&#39;</span><span class=\"en\"><b><span class=\"grammar-hl\">she had a better robotic hand</span>,’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 생각했다</span><span class=\"en\"><b>I thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마음속으로</span><span class=\"en\"><b>to myself.</b></span></div></div><div class=\"lec-sent-ko\">‘나는 그녀가 더 나은 로봇 손을 가지고 있다면 좋겠어.’라고 마음속으로 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비싼 비용과 낮은 성능이라는 문제 상황을 목격한 필자가 변화를 결심하게 되는 내면의 동기를 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I wish she had a better robotic hand 가정법 과거: 현재 사실과 반대되는 소망을 나타내며, wish 뒤에 과거형 동사(had)를 사용하여 현재의 아쉬움을 표현한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 계기로,</span><span class=\"en\"><b>With that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 만들기 시작했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">started to make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 저렴하고 더 나은 로봇 손을</span><span class=\"en\"><b>a much cheaper and better robotic hand.</b></span></div></div><div class=\"lec-sent-ko\">그러고는 나는 훨씬 더 저렴하고 더 나은 로봇 손을 만들기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 단순한 기능에 비해 지나치게 비싼 비용을 지적함으로써, 기술의 접근성이 떨어지는 현실적인 문제를 드러냅니다. 4. ‘I wish she had a better robotic hand,’ I thought to myself. 비싼 비용과 낮은 성능이라는 문제 상황을 목격한 필자가 변화를 결심하게 되는 내면의 동기를 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started to make (to부정사): 동사(started)의 목적어 역할을 하는 명사적 용법의 to부정사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 실패 후에,</span><span class=\"en\"><b>After many failures,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3D 프린팅 기술을 사용하여,</span><span class=\"en\"><b><span class=\"grammar-hl\">by using 3D printing technology</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 만들 수 있었다</span><span class=\"en\"><b>I was able to make</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유용한 로봇 손을</span><span class=\"en\"><b>a useful robotic hand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 300달러라는 가격에</span><span class=\"en\"><b>for the price of only 300 dollars.</b></span></div></div><div class=\"lec-sent-ko\">많은 실패 후에 마침내 나는 3D 프린트 기술을 사용해서 단 300달러짜리의 유용한 로봇 손을 만들 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시행착오를 거쳐 기술적 대안을 찾아냈음을 알리며, 비용 문제를 해결했다는 성과를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by using 3D printing technology (동명사): 전치사(by)의 목적어로 쓰인 명사적 역할의 동명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr><tr><td class=\"w\">failure</td><td class=\"m\">실패, 결함, 낙제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 결심했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">decided</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 3D 로봇 손을 위한 디자인과 소프트웨어를 공유하기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to share</span> the designs and software for my 3D robotic hand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들과</span><span class=\"en\"><b>with others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무료로</span><span class=\"en\"><b>for free.</b></span></div></div><div class=\"lec-sent-ko\">나는 내 3D 로봇 손의 디자인과 소프트웨어를 다른 사람들과 무료로 공유하기로 결심했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 느낀 안타까움을 해결하기 위해 필자가 구체적인 행동, 즉 개발에 착수했음을 나타내는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decided to share (to부정사): 동사(decided)의 목적어 역할을 하는 명사적 용법의 to부정사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">robotic</td><td class=\"m\">로봇의, 자동 인형 같은, 기계적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마도 누군가는 가져가서</span><span class=\"en\"><b>Maybe someone can take</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 해낸 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what I have done</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유용한 일을 할 수 있을 것이다</span><span class=\"en\"><b>and do something useful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것으로</span><span class=\"en\"><b>with it.</b></span></div></div><div class=\"lec-sent-ko\">아마도 누군가는 내가 해낸 것을 가져가 그것으로 유용한 일을 할 수 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 기술 공유가 단순한 기부를 넘어 또 다른 발전과 활용으로 이어지기를 바라는 필자의 기대를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what I have done (관계대명사): 선행사를 포함한 관계대명사 what은 &#39;~하는 것&#39;으로 해석되며, 뒤의 절(I have done)에서 목적어 자리가 비어 있는 불완전한 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 어떤 한 사람도 세상을 바꿀 수는 없다,</span><span class=\"en\"><b>No one person can change the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 더 나은 세상을 만들 수 있다</span><span class=\"en\"><b>but we can build a better world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 일함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by working together</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람도 혼자서는 세상을 바꿀 수 없지만, 우리는 함께 일함으로써 더 나은 세상을 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인이 시작한 작은 기술 혁신이 공동의 협력을 통해 세상에 긍정적인 영향을 미칠 수 있다는 글 전체의 주제를 갈무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by working together (동명사): 전치사(by)의 목적어로 쓰인 명사적 역할의 동명사구이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학 박람회에서 비싸고 기능이 제한적인 로봇 손을 쓴 소녀를 만남.</li><li>필자는 문제를 해결하기 위해 3D 프린팅 기술로 저렴한 로봇 손을 직접 개발함.</li><li>개발한 기술을 무료로 공유하여 더 나은 세상을 만드는 데 기여하고자 함.</li><li>기술 혁신과 협력을 통해 개별적인 성과를 넘어선 사회적 변화를 강조함.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author created an affordable robotic hand using 3D printing technology, and he shared his designs freely to foster global collaboration for a better future.</div>\n              <div class=\"lec-final-sum-ko\">저자는 3D 프린팅 기술을 사용하여 저렴한 로봇 손을 개발했으며, 더 나은 미래를 위한 전 세계적 협력을 도모하고자 자신의 설계도를 자유롭게 공유했다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":
