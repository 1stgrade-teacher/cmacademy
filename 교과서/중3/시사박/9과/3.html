<li>사업의 성공을 바탕으로 더 많은 소녀들에게 교육의 기회를 제공하게 되었다.</li><li>아프리카 소녀들을 돕기 위한 본격적인 사업 시작 (started a business)</li><li>케냐와 우간다 등의 학비 지원 (school fees)</li><li>교재, 교복, 학용품 제공 (textbooks, uniforms)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04나눔의 가치 제언</div><ul><li>작은 실천이 모여 삶을 변화시킬 수 있다는 메시지를 전달한다.</li><li>주위의 필요를 발견하면 즉시 행동할 것을 강조 (act)</li><li>작게 시작하여 단계를 밟아 나감 (start small)</li><li>타인을 향한 따뜻한 마음이 변화를 이끎 (warm heart)</li><li>핵심 키워드: 행동(action)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">afford</td><td class=\"m\">~할 여유가 있다, ~을 감당하다</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">(돈을) 모으다, 기르다</td></tr><tr><td class=\"w\">pay the price</td><td class=\"m\">대가를 치르다, 비용을 지불하다</td></tr><tr><td class=\"w\">take steps</td><td class=\"m\">조치를 취하다, 단계를 밟다</td></tr><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;왜 많은 아프리카의 소녀들은 학교에 갈 수 없을까</span><span class=\"en\"><b>'Why can't many girls in Africa go to school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 할 수 있는 것처럼?</span><span class=\"en\"><b><span class=\"grammar-hl\">as I can</span>?</b></span></div></div><div class=\"lec-sent-ko\">‘아프리카의 많은 소녀들은 왜 나처럼 학교에 갈 수 없을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 열두 살 때 아프리카 소녀들이 처한 교육 격차 문제를 인식하며 품었던 의문과 안타까움을 직접 화법으로 제시하여, 앞으로 전개될 봉사 활동의 동기를 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to go (to부정사): go 앞에 to가 붙어 명사(교육을 받는 행위)의 목적을 나타내는 부사적 용법으로 쓰였습니다.</div><div class=\"lec-gr-item\">as I can (관용표현): &#39;as + 주어 + can&#39; 형태로 &#39;내가 할 수 있는 만큼(교육을 받는 것처럼)&#39;의 비교 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 그들도 학교에 갈 수 있으면 좋겠다</span><span class=\"en\"><b>I wish they <span class=\"grammar-hl\">could go</span> to school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한.&#39;</span><span class=\"en\"><b>too.'</b></span></div></div><div class=\"lec-sent-ko\">그들도 학교에 갈 수 있으면 좋을 텐데.’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 의문이 단순한 호기심을 넘어, 어린 시절의 경험에서 비롯된 문제의식임을 강조하여 글쓴이의 행동이 갑작스러운 것이 아님을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could go 가정법 과거: 현재 사실과 반대되는 소망을 나타내기 위해 &#39;I wish + 주어 + 과거동사(could)&#39; 구조를 사용했습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 이런 생각을 했다</span><span class=\"en\"><b>I had this thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 열두 살이었을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">when I was twelve</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 열두 살 때 이렇게 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 의문이 단순한 호기심을 넘어, 어린 시절의 경험에서 비롯된 문제의식임을 강조하여 글쓴이의 행동이 갑작스러운 것이 아님을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when I was twelve (관계부사(접속사적)): when은 시간의 배경을 나타내는 접속사로, 주어와 동사가 포함된 절을 이끌고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 깨달았다</span><span class=\"en\"><b>I realized</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 가족이 그것을 감당할 여유가 없다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that their families couldn't afford it</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그들의 가족이 그럴 만한 금전적인 여유가 없다는 것을 깨달았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아프리카 소녀들이 학교에 가지 못하는 구체적인 원인이 경제적 어려움에 있다는 사실을 인지했음을 설명하며, 해결해야 할 문제의 핵심을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that their families couldn&#39;t afford it (명사절(that절)): realized라는 타동사의 목적어 역할을 하는 명사절로, 문장 전체의 3형식 구조를 완성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">afford</td><td class=\"m\">~할 여유가 있다, ~을 감당하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 궁금했다</span><span class=\"en\"><b>I wondered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 무언가를 할 수 있을지</span><span class=\"en\"><b><span class=\"grammar-hl\">if I could do</span> something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 소녀들을 위해.</span><span class=\"en\"><b>for those girls.</b></span></div></div><div class=\"lec-sent-ko\">나는 그 소녀들을 위해 내가 무언가를 할 수 있을지 궁금했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제 인식 단계에서 구체적인 행동 단계로 넘어가는 전환점으로, 타인의 문제를 자신의 문제로 받아들이고 책임을 느끼는 심리적 변화를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if I could do (간접의문문): wondered(타동사)의 목적어로 사용된 &#39;if(인지 아닌지) + S + V&#39; 구조의 명사절입니다.</div><div class=\"lec-gr-item\">to do something (to부정사): something을 뒤에서 수식하는 형용사적 용법으로, &#39;할 어떤 일&#39;이라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때 나는 한 가지 생각이 떠올랐다.</span><span class=\"en\"><b>Then I <span class=\"grammar-hl\">had an idea</span>.</b></span></div></div><div class=\"lec-sent-ko\">그때 아이디어가 떠올랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 막연한 고민을 해결하기 위한 구체적인 방법론을 찾게 되었음을 알리는 신호로, 뒤이어 나올 실질적인 행동을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had an idea 기본 문형: 3형식(S+V+O) 문장으로, have라는 일반동사의 목적어로 idea가 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 생일을 위해,</span><span class=\"en\"><b>For my birthday,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 부모님께 부탁했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">asked my parents</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나에게 재봉틀 하나를 사 주시기를.</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy me</span> a sewing machine.</b></span></div></div><div class=\"lec-sent-ko\">나는 내 생일에 부모님께 재봉틀을 하나 사 달라고 부탁했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이디어를 실행에 옮기기 위해 필요한 도구를 마련하는 단계로, 자신의 소망을 구체적인 물적 자본으로 치환하려는 계획적인 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked my parents to buy me 5형식(SVOC) 구조: &#39;ask + O(my parents) + O.C.(to buy~)&#39; 형태로, 목적어에게 목적격 보어(to부정사)를 하도록 요청한다는 의미입니다.</div><div class=\"lec-gr-item\">to buy me (to부정사): 5형식 구조의 목적격 보어로 사용된 원형이며, 수여동사 buy가 쓰여 &#39;나에게 ~를 사주다&#39;라는 4형식 구조를 내포합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 나에게 하나를 사 주셨다,</span><span class=\"en\"><b>They bought me one,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 머리띠 만드는 방법을 배웠다.</span><span class=\"en\"><b>and I learned <span class=\"grammar-hl\">how to make headbands</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 내게 재봉틀을 하나 사 주셨고, 나는 머리띠를 만드는 방법을 배웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 실행 계획인 &#39;머리띠 제작&#39;을 위한 기술 습득 과정을 설명하며, 아이디어를 현실화하는 단계를 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to make headbands (to부정사): &#39;의문사 + to부정사&#39;는 명사구 역할을 하며, learned라는 타동사의 목적어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 머리띠 열 개를 만들었다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">created</span> ten headbands</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들을 내 학교에서 팔았다.</span><span class=\"en\"><b>and sold them at my school.</b></span></div></div><div class=\"lec-sent-ko\">나는 머리띠 열 개를 만들어 학교에서 그것들을 팔았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소규모로 사업을 시작하여 초기 자본을 마련하려는 시도로, 거창한 계획이 아닌 실행 가능한 작은 단위의 행동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">created (병렬구조): I를 공통 주어로 하여 created와 sold라는 두 개의 과거형 동사가 대등하게 연결되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">곧,</span><span class=\"en\"><b>Soon,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 충분한 돈을 모았다</span><span class=\"en\"><b>I raised <span class=\"grammar-hl\">enough money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아프리카의 한 소녀를 학교에 보낼.</span><span class=\"en\"><b><span class=\"grammar-hl\">to send</span> one girl in Africa to school.</b></span></div></div><div class=\"lec-sent-ko\">곧 나는 아프리카에 있는 한 소녀를 학교에 보낼 충분한 돈을 모았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 머리띠 판매라는 작은 행동이 &#39;소녀 한 명의 교육&#39;이라는 구체적인 결과로 이어졌음을 보여주며, 자신의 노력이 결실을 맺었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enough money to send (to부정사): 형용사 enough를 수식하는 명사(money) 뒤에서, 그 돈의 용도를 설명하는 형용사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">raise</td><td class=\"m\">(돈을) 모으다, 기르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 거기서 멈출 수 없었다.</span><span class=\"en\"><b>I <span class=\"grammar-hl\">couldn't stop</span> there.</b></span></div></div><div class=\"lec-sent-ko\">나는 거기서 멈출 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성공에 안주하지 않고 더 큰 변화를 위해 활동을 지속하겠다는 다짐을 드러내며, 일회성 이벤트가 아닌 지속 가능한 활동으로의 확장을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn&#39;t stop 조동사 구문: 조동사 could와 부사 not이 결합하여 부정의 의미를 더하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 사업을 시작했다</span><span class=\"en\"><b>I started a business</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아프리카의 소녀들을 돕기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to help</span> girls in Africa</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에 갈 수 없는.</span><span class=\"en\"><b><span class=\"grammar-hl\">who couldn't go to school</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 학교에 갈 수 없는 아프리카의 소녀들을 돕기 위해 사업을 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 의지를 이어받아, 단순히 기부하는 것을 넘어 구조적으로 문제를 해결하기 위한 사업적 접근을 시도하고 있음을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to help (to부정사): 부사적 용법 중 &#39;목적&#39;을 나타내며, business를 시작한 이유를 설명합니다.</div><div class=\"lec-gr-item\">who couldn&#39;t go to school (관계대명사): 주격 관계대명사 who가 girls를 선행사로 받아 수식하며, 뒤에 주어 없이 동사(couldn&#39;t go)가 바로 이어지는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 사업의 성공 덕분에,</span><span class=\"en\"><b>Thanks to the success of my business,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 학비를 지불할 수 있다</span><span class=\"en\"><b>I can pay the school fees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 가난한 소녀들을 위한</span><span class=\"en\"><b>for many poor girls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케냐와 우간다 같은 나라에 있는</span><span class=\"en\"><b>in countries like Kenya and Uganda</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에 갈.</span><span class=\"en\"><b><span class=\"grammar-hl\">to go to school</span>.</b></span></div></div><div class=\"lec-sent-ko\">내 사업의 성공 덕분에 나는 케냐와 우간다 같은 나라에 있는 많은 가난한 소녀들이 학교에 가기 위한 수업료를 지불할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사업의 결과가 실질적인 경제적 후원으로 이어져 케냐와 우간다의 소녀들에게 교육의 기회를 제공하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to pay (to부정사): &#39;할 수 있다&#39;는 능력 뒤에 수반되는 동작으로, 명사적 역할(가능성 보충)을 수행합니다.</div><div class=\"lec-gr-item\">to go to school (to부정사): poor girls를 수식하는 형용사적 용법으로 쓰여, 그들이 학교에 갈 수 있도록 돕는다는 의미를 완성합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 또한 그들의 교과서, 교복, 그리고 연필 비용을 지불한다.</span><span class=\"en\"><b>I also <span class=\"grammar-hl\">pay for their textbooks</span>, uniforms, and pencils.</b></span></div></div><div class=\"lec-sent-ko\">나는 또한 그들의 교과서와 교복, 연필을 위한 비용도 지불한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교육을 위해 필요한 필수 물품까지 지원하며, 후원의 범위를 단순 학비에서 학습 환경 전반으로 확대했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pay for their textbooks (관용표현): &#39;pay for + 비용&#39;은 ~의 대가를 지불한다는 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀랍지 않은가?</span><span class=\"en\"><b><span class=\"grammar-hl\">Isn't it amazing?</span></b></span></div></div><div class=\"lec-sent-ko\">놀랍지 않은가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들에게 질문을 던짐으로써, 혼자 시작한 작은 일이 이토록 큰 변화를 만들어냈다는 점을 강조하고 감동을 공유하고자 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Isn&#39;t it amazing? 도치/의문문 구조: be동사 is가 주어 it 앞으로 나가면서 의문문 도치가 발생했습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분을 위한 내 충고는</span><span class=\"en\"><b>My advice to you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그냥 무언가를 하라는 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is to just do something</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분께 드리는 내 충고는 그냥 무언가 하라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 교훈을 요약하는 문장으로, 거창한 계획보다 실천이 중요함을 독자에게 강력히 권유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is to just do something (가주어): 진주어 개념의 확장(보어): &#39;주어(My advice) = 보어(to부정사)&#39; 구조로, to부정사가 명사적 용법으로 보어 자리에 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 필요를 볼 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you see a need</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동하라.</span><span class=\"en\"><b>act.</b></span></div></div><div class=\"lec-sent-ko\">필요성이 보일 때 행동하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세상을 향한 관심을 행동으로 연결하는 구체적인 지침을 제시하며, 타인의 결핍을 외면하지 않는 능동적인 태도를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you see a need (관계부사(접속사)): when이 이끄는 절이 조건과 시간의 배경을 나타내는 부사절로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작게 시작하라,</span><span class=\"en\"><b>Start small,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 단계를 밟아가면서.</span><span class=\"en\"><b><span class=\"grammar-hl\">taking little steps</span>.</b></span></div></div><div class=\"lec-sent-ko\">작은 단계를 밟아가면서 작은 것부터 시작하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실천의 문턱을 낮추어 누구나 마음만 먹으면 시작할 수 있다는 점을 조언하며, 행동의 연속성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking little steps (현재분사(분사구문)): 주어의 상태나 동시 동작을 설명하는 분사구문으로, &#39;작은 발걸음을 떼면서&#39;라는 의미로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 19</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 따뜻한 마음이</span><span class=\"en\"><b>Your warm heart</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인생을 바꿀 수 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can change</span> lives.</b></span></div></div><div class=\"lec-sent-ko\">당신의 따뜻한 마음이 인생을 바꿀 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결론 문장으로서, 개개인의 작은 실천이 타인의 삶을 바꿀 수 있는 큰 힘을 가지고 있다는 희망적인 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can change 조동사 구문: can이 일반동사 change와 결합하여 &#39;할 수 있다&#39;라는 가능성을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글쓴이는 어린 시절 아프리카 소녀들의 교육 문제를 접하고, 이를 돕기 위해 머리띠 판매라는 작은 사업을 시작했다.</li><li>이 작고 꾸준한 노력이 성공하면서 많은 소녀들에게 학비와 학용품을 지원하는 규모로 성장했다.</li><li>글쓴이는 거창한 계획보다 &#39;무언가를 시작하는 실천&#39;이 세상을 변화시킬 수 있다고 독자들에게 조언한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mary Grace Henry launched a headband business to fund African girls&#39; education, and she encourages others to create positive change through small, immediate actions.</div>\n              <div class=\"lec-final-sum-ko\">메리 그레이스 헨리는 아프리카 소녀들의 교육 자금을 마련하기 위해 머리띠 사업을 시작했으며, 작고 즉각적인 행동을 통해 긍정적인 변화를 만들라고 조언한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"audio":"./3_audio/25.mp3","hl":"meaning"},{"audio":"./3_audio/26.mp3","hl":"grammar"}],[{"audio":"./3_audio/27.mp3","hl":"main"},{"audio":"./3_audio/28.mp3","hl":"meaning"},{"audio":"./3_audio/29.mp3","hl":"grammar"}],[{"audio":"./3_audio/30.mp3","hl":"main"},{"audio":"./3_audio/31.mp3","hl":"meaning"},{"audio":"./3_audio/32.mp3","hl":"grammar"}],[{"audio":"./3_audio/33.mp3","hl":"main"},{"audio":"./3_audio/34.mp3","hl":"meaning"},{"audio":"./3_audio/35.mp3","hl":"grammar"}],[{"audio":"./3_audio/36.mp3","hl":"main"},{"audio":"./3_audio/37.mp3","hl":"meaning"},{"audio":"./3_audio/38.mp3","hl":"grammar"}],[{"audio":"./3_audio/39.mp3","hl":"main"},{"audio":"./3_audio/40.mp3","hl":"meaning"},{"audio":"./3_audio/41.mp3","hl":"grammar"}],[{
