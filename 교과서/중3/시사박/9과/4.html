g-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 환경 오염을 해결하기 위한 핵심 개념인 흡착(Adsorption)과 여과(Filtration)에 대해 알면 좋습니다. 특히 옥수수 속대와 같은 다공성 물질이 오염 물질을 걸러내는 원리는 마치 스펀지가 물을 빨아들이듯, 미세한 구멍(기공) 속으로 오염 물질이 달라붙어 깨끗한 물만 통과하게 만드는 간단하면서도 강력한 친환경 정수 기술이라고 할 수 있죠. 이러한 연구는 단순히 쓰레기를 재활용하는 차원을 넘어, 저비용으로 수질을 개선하는 지속 가능한 환경 공학적 접근을 보여줍니다. 실제 산업 현장에서도 활성탄(Activated Carbon)과 같은 물질이 비슷한 원리로 공기나 물을 정화하는 데 사용되는데, 옥수수 속대처럼 주변에서 구하기 쉬운 천연 재료를 활용하는 방식은 적정 기술(Appropriate Technology)의 대표적인 사례로 꼽힌답니다. 이 글을 통해 자연의 재료가 어떻게 과학적인 필터로 변신하는지 흥미롭게 살펴보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 인식과 아이디어 발견</div><ul><li>인도 시골 마을에서 수질 오염 문제를 목격하고 이를 해결하기 위한 방법을 고민했다.</li><li>마을에 흔한 옥수수 속대(corn cobs) 활용</li><li>속대의 미세한 구멍(small holes)이 불순물을 걸러낼 수 있을 것이라는 가설 설정</li><li>핵심 키워드: 수질 오염(water pollution), 옥수수 속대(corn cobs)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 및 정화 효과 확인</div><ul><li>직접 수집한 옥수수 속대를 사용해 정화 실험을 진행하고 효과를 눈으로 확인했다.</li><li>말린 속대를 세척 후 오염된 물에 투입</li><li>물이 눈에 띄게 맑아지는 결과를 관찰</li><li>핵심 키워드: 정화(filtering), 불순물(dirty matter)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03정화 시스템 구축 및 기대 효과</div><ul><li>수집한 속대로 시스템을 구축하여 실제 오염 제거 성능을 측정하고 향후 비전을 제시했다.</li><li>농부들에게 받은 속대로 정화 시스템(filtering system) 구축</li><li>오염 물질의 70~80%를 제거하는 성과 달성</li><li>자신의 마을을 넘어 더 넓은 지역의 호수를 정화하려는 희망</li><li>핵심 키워드: 정화 시스템(filtering system), 오염 물질 제거(removed)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hit on</td><td class=\"m\">~을 우연히 발견하다, ~이 문득 떠오르다</td></tr><tr><td class=\"w\">filter out</td><td class=\"m\">~을 여과하여 제거하다, ~을 걸러내다</td></tr><tr><td class=\"w\">clean up</td><td class=\"m\">~을 깨끗이 청소하다, ~을 정화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인도의 시골에 살고 있던 어린 소녀로서</span><span class=\"en\"><b>Useless Corn Cobs as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>Useful Water Filters (Lalita Prasida) As</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 발견했다</span><span class=\"en\"><b>a young girl</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 주변에 있는 물이</span><span class=\"en\"><b><span class=\"grammar-hl\">living in the countryside</span> in</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각하게 오염되어 있는 것을</span><span class=\"en\"><b>India, I often found that the water around us was seriously <span class=\"grammar-hl\">polluted</span>.</b></span></div></div><div class=\"lec-sent-ko\">인도의 시골에 살고 있던 어린 소녀로서 나는 종종 우리 주변에 있는 물이 심각하게 오염되어 있는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 자신이 겪은 환경 문제를 언급하며 왜 정수 장치를 고안하게 되었는지 동기를 제시하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">living in the countryside (현재분사): 문장 내에서 주어인 I의 상태를 부연 설명하는 형용사적 기능의 현재분사구문입니다. (while I was living in the countryside)</div><div class=\"lec-gr-item\">polluted (과거분사): 명사 water의 상태를 수식하는 형용사적 기능의 과거분사입니다. (water that was polluted)</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 궁금했다</span><span class=\"en\"><b>I wondered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 문제를 내가 어떻게 해결할 수 있을지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how I could solve this problem</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 이 문제를 내가 어떻게 해결할 수 있을지 궁금했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 제기된 오염 문제에 대해 글쓴이가 수동적으로 방치하지 않고 직접 해결책을 찾으려 했다는 능동적인 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how I could solve this problem (간접의문문): 의문사(how) + 주어(I) + 동사(could solve) 순서로 구성되어 wonder의 목적어 역할을 하는 명사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이디어가 떠올랐다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">hit on</span> the idea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옥수수 속대를 사용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to use corn cobs</span>.</b></span></div></div><div class=\"lec-sent-ko\">그때 옥수수 속대를 사용하는 아이디어가 떠올랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 고민에 대한 구체적인 해결책을 제시하며 이야기의 본격적인 전환점을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to use corn cobs (to부정사): 앞의 명사 idea를 수식하는 형용사적 용법으로, 어떤 아이디어인지 구체적으로 설명합니다.</div><div class=\"lec-gr-item\">hit on (관용표현): &#39;우연히 발견하다&#39; 혹은 &#39;떠올리다&#39;라는 의미의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hit on</td><td class=\"m\">~을 우연히 발견하다, ~이 문득 떠오르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쓸모없는 옥수수 속대는</span><span class=\"en\"><b><span class=\"grammar-hl\">Useless</span> corn cobs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디에나 있었다</span><span class=\"en\"><b>were everywhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마을</span><span class=\"en\"><b>in my village.</b></span></div></div><div class=\"lec-sent-ko\">쓸모없는 옥수수 속대는 우리 마을 어디에나 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 옥수수 속대를 해결책으로 선택한 이유를 설명하며, 주변에서 쉽게 구할 수 있는 재료라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Useless (과거분사): 명사 corn cobs의 성질을 설명하는 형용사로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생각했다</span><span class=\"en\"><b>I thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옥수수 속대의 작은 구멍들이</span><span class=\"en\"><b>that the small holes <span class=\"grammar-hl\">in the corn cobs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더러운 물질을 걸러 낼 수 있을 거라고</span><span class=\"en\"><b>could filter dirty matter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오염된 물속에서</span><span class=\"en\"><b>out of the polluted water.</b></span></div></div><div class=\"lec-sent-ko\">나는 옥수수 속대의 작은 구멍들이 오염된 물속에서 더러운 물질을 걸러 낼 수 있을 거라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 옥수수 속대의 구조적 특징이 정수 작용을 할 것이라는 글쓴이의 가설을 기술하며 과학적 사고 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the corn cobs (전치사구): 명사 holes를 뒤에서 수식하는 형용사적 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 길을 따라 가면서 마른 옥수수 속대 몇 개를 주워서</span><span class=\"en\"><b>I picked up some <span class=\"grammar-hl\">dried</span> cobs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 씻어</span><span class=\"en\"><b>along the road,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더러운 물이 담긴 그릇에</span><span class=\"en\"><b>washed them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">넣었다</span><span class=\"en\"><b>and placed them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>in a bowl of dirty water.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 나는 길을 따라 가면서 마른 옥수수 속대 몇 개를 주워서 그것들을 씻어 더러운 물이 담긴 그릇에 넣었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가설을 검증하기 위해 글쓴이가 직접 실행에 옮기는 첫 번째 실험 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">dried (과거분사): 명사 cobs의 상태를 수식하는 형용사적 기능의 과거분사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잠시 후에</span><span class=\"en\"><b>After a while,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 그 물을 확인했는데</span><span class=\"en\"><b>I checked the water,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 맑게 보였다.</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">looked</span> much clearer.</b></span></div></div><div class=\"lec-sent-ko\">잠시 후에 나는 그 물을 확인했는데 훨씬 더 맑게 보였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 간단한 실험을 통해 아이디어가 실제로 효과가 있음을 보여주며 실험의 성공 가능성을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked 2형식 구조: &#39;보이다&#39;라는 의미의 연결동사로 뒤에 보어인 형용사(clearer)가 왔습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 농부들로부터 모은 옥수수 속대를 이용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">using corn cobs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여과 장치를</span><span class=\"en\"><b><span class=\"grammar-hl\">that I had collected</span> from farmers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들었다.</span><span class=\"en\"><b>I built a filtering system.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 나는 농부들로부터 모은 옥수수 속대를 이용하여 여과 장치를 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순한 아이디어 차원을 넘어 구체적인 도구인 &#39;정수 시스템&#39;으로 발전시킨 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">using corn cobs (분사구문): 문장 전체를 수식하는 부사적 기능의 현재분사구문입니다. (As I was using corn cobs)</div><div class=\"lec-gr-item\">that I had collected (관계대명사): 목적격 관계대명사 that이 이끄는 절이 앞의 명사 corn cobs를 수식합니다. 관계대명사 뒤에는 주어(I)와 동사(had collected)가 있는 절이 옵니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 만든 장치는</span><span class=\"en\"><b>My system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">70~80 퍼센트의 더러운 물질을 제거했다</span><span class=\"en\"><b><span class=\"grammar-hl\">removed</span> 70 to 80 percent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b>of the dirty matter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>from the water.</b></span></div></div><div class=\"lec-sent-ko\">내가 만든 장치는 물속에서 70~80 퍼센트의 더러운 물질을 제거했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 시도가 성공적인 결과로 이어졌음을 구체적인 수치를 통해 증명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">removed 3형식 구조: 주어(My system) + 동사(removed) + 목적어(70 to 80 percent of the dirty matter)로 이루어진 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 희망한다</span><span class=\"en\"><b>I hope</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 여과 장치가</span><span class=\"en\"><b>my filtering system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨끗하게 해 줄 수 있기를</span><span class=\"en\"><b>can clean up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 호수를</span><span class=\"en\"><b>all the lakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마을뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not only in my village</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 지역에 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">but also in other areas</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 내 여과 장치가 우리 마을뿐만 아니라 다른 지역에 있는 모든 호수를 깨끗하게 해 줄 수 있기를 희망한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 발명을 통해 성취하고자 하는 최종적인 목표와 공익적인 포부를 밝히며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only in my village but also in other areas (관용표현): &#39;A뿐만 아니라 B도 역시&#39;라는 의미의 상관접속사 구문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clean up</td><td class=\"m\">~을 깨끗이 청소하다, ~을 정화하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인도 소녀가 주변의 심각한 수질 오염 문제를 발견하고 이를 해결하고자 고민했다.</li><li>주위에서 흔히 버려지는 옥수수 속대의 구조를 이용해 정수 아이디어를 얻었다.</li><li>직접 실험을 통해 옥수수 속대의 정수 효과를 확인하고 정수 시스템을 제작했다.</li><li>이 시스템은 높은 오염 물질 제거율을 기록했고, 글쓴이는 이를 통해 더 넓은 지역의 환경 개선을 꿈꾼다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Lalita Prasida discovered that corn cobs have natural filtering capabilities, and she developed a system to significantly purify polluted water.</div>\n              <div class=\"lec-final-sum-ko\">랄리타 프라시다(Lalita Prasida)는 옥수수 속대가 천연 정화 능력을 갖추고 있음을 발견하여, 오염된 물을 효과적으로 정화하는 시스템을 개발하였다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":"main"},{"audio":"./4_audio/9.mp3","hl":"meaning"},{"audio":"./4_audio/10.mp3","hl":"grammar"}],[{"audio":"./4_audio/11.mp3","hl":"main"},{"audio":"./4_audio/12.mp3","hl":"meaning"},{"audio":"./4_audio/13.mp3","hl":"grammar"}],[{"audio":"./4_audio/14.mp3","hl":"main"},{"audio":"./4_audio/15.mp3","hl":"meaning"},{"audio":"./4_audio/16.mp3","hl":"grammar"}],[{"audio":"./4_audio/17.mp3","hl":"main"},{"audio":"./4_audio/18.mp3","hl":"meaning"},{"audio":"./4_audio/19.mp3","hl":"grammar"}],[{"audio":"./4_audio/20.mp3","hl":"main"},{"audio":"./4_audio/21.mp3","hl":"meaning"},{"audio":"./4_audio/22.mp3","hl":"grammar"}],[{"audio":"./4_audio/23.mp3","hl":"main"},{"audio":"./4_audio/24.mp3","hl":"meaning"},{"audio":"./4_audio/25.mp3","hl":"grammar"}],[{"audio":"./4_audio/26.mp3","hl":"main"},{"audio":"./4_audio/27.mp3","hl":"meaning"},{"audio":"./4_audio/28.mp3","hl":"grammar"}],[{"audio":"./4_audio/29.mp3","hl":"main"},{"audio":"./4_audio/30.mp3","hl":"meaning"},{"audio":"./4_audio/3
