i><li>인사말 &#39;kia ora&#39; 사용을 권장 (meaning &quot;hi&quot;)</li><li>핵심 키워드: 문화 체험(experience culture)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03하카의 기원과 특징</div><ul><li>하카는 원래 전쟁에서 추던 춤으로, 강렬하고 위협적인 움직임이 특징이다.</li><li>전쟁터에서 추던 춤으로 시작 (war dance)</li><li>큰 소리를 지르며 격렬하게 몸을 움직임 (shout and move wildly)</li><li>핵심 키워드: 하카(haka), 전쟁 춤(war dance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04하카의 현대적 활용과 의미</div><ul><li>오늘날 하카는 다양한 행사에서 행해지며 뉴질랜드를 상징하는 문화가 되었다.</li><li>스포츠 경기, 결혼식 등 중요한 행사에서 수행 (important events)</li><li>럭비 국가대표팀의 경기 전 의식으로 유명 (national rugby team)</li><li>뉴질랜드의 국가적 상징물 (national symbol)</li><li>핵심 키워드: 국가적 상징(national symbol)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">native</td><td class=\"m\">토착의, 원주민의</td></tr><tr><td class=\"w\">culture</td><td class=\"m\">문화</td></tr><tr><td class=\"w\">society</td><td class=\"m\">사회</td></tr><tr><td class=\"w\">teach</td><td class=\"m\">가르치다</td></tr><tr><td class=\"w\">station</td><td class=\"m\">방송국</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다</td></tr><tr><td class=\"w\">villager</td><td class=\"m\">마을 사람</td></tr><tr><td class=\"w\">be glad to</td><td class=\"m\">~해서 기쁘다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scary</td><td class=\"m\">무서운</td></tr><tr><td class=\"w\">wildly</td><td class=\"m\">격렬하게, 거칠게</td></tr><tr><td class=\"w\">war</td><td class=\"m\">전쟁</td></tr><tr><td class=\"w\">match</td><td class=\"m\">경기</td></tr><tr><td class=\"w\">national</td><td class=\"m\">국가의</td></tr><tr><td class=\"w\">probably</td><td class=\"m\">아마도</td></tr><tr><td class=\"w\">rival</td><td class=\"m\">경쟁자</td></tr><tr><td class=\"w\">symbol</td><td class=\"m\">상징</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기해 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">let's talk</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마오리인에 대해</span><span class=\"en\"><b>about the Maori.</b></span></div></div><div class=\"lec-sent-ko\">이제 마오리인에 대해 이야기해 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 서두에서 본격적으로 다룰 소재인 ‘마오리족’을 소개하며 독자의 주의를 환기하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let&#39;s talk (관용표현): Let us + 동사원형 구조로 &#39;~하자&#39;라는 제안을 나타내는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 이다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원주민</span><span class=\"en\"><b>the native people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드의</span><span class=\"en\"><b>of New Zealand.</b></span></div></div><div class=\"lec-sent-ko\">그들은 뉴질랜드의 원주민이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 마오리족이 어떤 사람들인지 그 정체성을 정의하며 글의 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(They) + 동사(are) + 주격보어(the native people)로 이루어진 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">native</td><td class=\"m\">토착의, 원주민의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 갔다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살러</span><span class=\"en\"><b><span class=\"grammar-hl\">to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 섬들에</span><span class=\"en\"><b>on the islands</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 이전에</span><span class=\"en\"><b>long before</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유럽인들이 도착하기</span><span class=\"en\"><b>Europeans arrived.</b></span></div></div><div class=\"lec-sent-ko\">그들은 유럽인들이 도착하기 훨씬 이전에 뉴질랜드에 살러 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마오리족이 뉴질랜드의 역사적 주인이었음을 밝히며, 그들의 토착성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went to live (to부정사): go 뒤에 이어지는 to live는 목적(~하기 위해)을 나타내는 부사적 용법의 to부정사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마오리 문화는</span><span class=\"en\"><b>The Maori culture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 부분</span><span class=\"en\"><b>an important part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 뉴질랜드 사회의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">today's</span> New Zealand society.</b></span></div></div><div class=\"lec-sent-ko\">마오리 문화는 오늘날 뉴질랜드 사회의 중요한 부분이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마오리족의 과거뿐만 아니라 현재 뉴질랜드 사회 속에서 그들의 문화가 여전히 살아있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">today&#39;s (관용표현): 시간 명사에 -&#39;s를 붙여 소유격(오늘날의)을 만드는 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culture</td><td class=\"m\">문화</td></tr><tr><td class=\"w\">society</td><td class=\"m\">사회</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마오리 언어는</span><span class=\"en\"><b>The Maori language</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르쳐진다</span><span class=\"en\"><b><span class=\"grammar-hl\">is taught</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 학교에서</span><span class=\"en\"><b>at some schools</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 있다</span><span class=\"en\"><b>and there are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마오리어 라디오와 TV 방송국들이</span><span class=\"en\"><b>Maori language radio and TV stations.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 학교에서 마오리어를 가르치고, 마오리어로 하는 라디오와 TV 방송국들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 구체적인 예시로, 마오리 문화가 어떻게 현대 사회에 녹아들어 보호되고 있는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is taught (수동태): be동사(is)+p.p.(taught) 구조입니다. teach는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(is taught) 형태로 쓴다. 기본구조: teach + O(목적어) + C/명사 형태.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">station</td><td class=\"m\">방송국</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마오리 마을들이</span><span class=\"en\"><b>Maori villages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 지역들에</span><span class=\"en\"><b>in many parts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 나라의</span><span class=\"en\"><b>of the country.</b></span></div></div><div class=\"lec-sent-ko\">나라의 여러 지역에 마오리 마을이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마오리 문화를 직접 접할 수 있는 물리적인 장소인 마을이 존재함을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문두에 오면서 주어(Maori villages)와 동사(are)의 위치가 바뀐 도치 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 방문할 수 있다</span><span class=\"en\"><b>You can <span class=\"grammar-hl\">visit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마오리 마을들을</span><span class=\"en\"><b>Maori villages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 경험할 수 있다</span><span class=\"en\"><b>and experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마오리 문화를</span><span class=\"en\"><b>Maori culture.</b></span></div></div><div class=\"lec-sent-ko\">당신은 마오리 마을을 방문하고 마오리 문화를 경험할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 마오리 문화를 직접 경험해 볼 것을 제안하며 정보성 내용을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">visit 조동사 can의 영향으로 동사원형이 온 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culture</td><td class=\"m\">문화</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 말한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If you say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;kia ora&quot;라고</span><span class=\"en\"><b>\"kia ora\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마을 사람들에게,</span><span class=\"en\"><b>to the villagers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 기쁠 것이다</span><span class=\"en\"><b>they will be glad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 듣게 되어</span><span class=\"en\"><b>to hear it.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 마을 사람들에게 “kia ora”라고 말한다면 그들은 그것을 듣고 좋아할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마오리족과의 교감을 위한 구체적인 방법(인사말)을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you say (조건절): 접속사 If를 사용하여 조건을 나타내는 부사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">villager</td><td class=\"m\">마을 사람</td></tr><tr><td class=\"w\">be glad to</td><td class=\"m\">~해서 기쁘다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">It means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;안녕하세요&quot;를</span><span class=\"en\"><b>\"hi\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어로</span><span class=\"en\"><b>in English.</b></span></div></div><div class=\"lec-sent-ko\">그것은 영어로 “안녕하세요”를 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 생소할 수 있는 마오리 언어의 의미를 영어와 대조하여 쉽게 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It means 3형식 구조: 주어(It) + 타동사(means) + 목적어(&quot;hi&quot;)로 구성된 기본 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 본 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you ever watched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카를?</span><span class=\"en\"><b>the haka?</b></span></div></div><div class=\"lec-sent-ko\">당신은 하카를 본 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 마오리족의 또 다른 문화적 상징인 &#39;하카&#39;로 주제를 전환하여 독자의 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you ever watched (현재완료): have + p.p. 구조를 사용하여 과거의 경험을 묻는 의문문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하카는</span><span class=\"en\"><b>The haka</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무섭게 보일지도 모른다</span><span class=\"en\"><b>may look scary</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면</span><span class=\"en\"><b><span class=\"grammar-hl\">because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카 무용수들이</span><span class=\"en\"><b><span class=\"grammar-hl\">haka dancers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소리를 지르고</span><span class=\"en\"><b><span class=\"grammar-hl\">shout</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 몸을 움직이기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">and move their bodies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">격렬하게</span><span class=\"en\"><b>wildly.</b></span></div></div><div class=\"lec-sent-ko\">하카를 추는 사람들이 소리를 지르고 그들의 몸을 격렬하게 움직이기 때문에 하카가 무섭게 보일지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하카의 시각적 특징을 묘사하여 왜 하카가 강렬한 인상을 주는지 설명합니다. 여기서 wildly는 사전적으로 &#39;야생적으로&#39;라는 뜻이지만, 여기서는 춤의 동작이 &#39;절제되지 않고 격정적&#39;이라는 의미로 쓰였습니다. 하카의 에너지를 강조하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because haka dancers shout and move their bodies 접속사 because를 사용하여 원인을 나타내는 부사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scary</td><td class=\"m\">무서운</td></tr><tr><td class=\"w\">wildly</td><td class=\"m\">격렬하게, 거칠게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마오리족은</span><span class=\"en\"><b>The Maori people,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 이미 들어 봤겠지만</span><span class=\"en\"><b><span class=\"grammar-hl\">who you've already heard about</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추기 시작했다</span><span class=\"en\"><b>started doing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카를</span><span class=\"en\"><b>the haka</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전쟁 춤으로</span><span class=\"en\"><b>as a war dance.</b></span></div></div><div class=\"lec-sent-ko\">당신은 이미 들어 봤겠지만, 마오리족은 전쟁 춤으로 하카를 추기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 소개한 마오리족과 하카를 연결하며, 하카의 역사적 기원(전쟁 춤)을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who you&#39;ve already heard about (관계대명사): who는 선행사(The Maori people)를 수식하며, 절 내부에서 전치사 about의 목적어 역할을 하는 목적격 관계대명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">war</td><td class=\"m\">전쟁</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날, 하지만,</span><span class=\"en\"><b>Today, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 사람들은</span><span class=\"en\"><b>New Zealanders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한다</span><span class=\"en\"><b>do</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카를</span><span class=\"en\"><b>the haka</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 경기, 결혼식,</span><span class=\"en\"><b>at sport matches, weddings,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 다른 중요한 행사에서</span><span class=\"en\"><b>or other important events.</b></span></div></div><div class=\"lec-sent-ko\">그러나 오늘날 뉴질랜드 사람들은 스포츠 경기, 결혼식, 또는 다른 중요한 행사에서 하카를 춘다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;과거(전쟁 춤)&#39;에서 &#39;현재(축제/행사)&#39;로의 변화를 대조하며 하카의 위상이 어떻게 바뀌었는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doing (동명사): start의 목적어 역할을 하는 동명사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match</td><td class=\"m\">경기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 국가 대표 럭비 팀 선수들은</span><span class=\"en\"><b>New Zealand's national rugby team <span class=\"grammar-hl\">members</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한다</span><span class=\"en\"><b><span class=\"grammar-hl\">do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카를</span><span class=\"en\"><b>the haka</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 경기 전에</span><span class=\"en\"><b>before every match.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어 뉴질랜드의 국가 대표 럭비 팀 선수들은 모든 경기 전에 하카를 춘다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대적인 하카의 활용 사례를 들어 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">members do 3형식 구조: 주어(members) + 타동사(do) + 목적어(the haka)로 이루어진 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match</td><td class=\"m\">경기</td></tr><tr><td class=\"w\">national</td><td class=\"m\">국가의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 유명하다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">is famous</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계적으로</span><span class=\"en\"><b>all over the world.</b></span></div></div><div class=\"lec-sent-ko\">그것은 전 세계적으로 유명하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하카가 단순히 지역적인 문화를 넘어 국제적인 인지도를 가짐을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is famous 2형식 구조: 주어(It) + be동사(is) + 형용사 보어(famous)로 이루어진 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 본다면</span><span class=\"en\"><b>If you see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카를,</span><span class=\"en\"><b>the haka,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마 동의할 것이다</span><span class=\"en\"><b>you will probably agree</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것에</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대 팀이</span><span class=\"en\"><b><span class=\"grammar-hl\">the rival team</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겁먹었음이 틀림없다고</span><span class=\"en\"><b><span class=\"grammar-hl\">must be scared</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 하카를 본다면, 당신은 상대 팀이 분명 겁먹을 것이라는 것에 아마 동의할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하카의 강렬함이 상대방에게 주는 위압감을 설명하며 그 효과를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that the rival team must be scared (명사절): agree의 목적어 역할을 하는 접속사 that이 이끄는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">probably</td><td class=\"m\">아마도</td></tr><tr><td class=\"w\">rival</td><td class=\"m\">경쟁자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">키위새와 같이,</span><span class=\"en\"><b><span class=\"grammar-hl\">Like the kiwi bird</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하카는</span><span class=\"en\"><b>the haka</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국가의 상징</span><span class=\"en\"><b>a national symbol.</b></span></div></div><div class=\"lec-sent-ko\">키위새와 같이 하카는 국가의 상징이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하카가 뉴질랜드의 정체성을 대표하는 중요한 요소임을 정리하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Like the kiwi bird (관용표현): 전치사 Like(~처럼)를 사용한 비유적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">national</td><td class=\"m\">국가의</td></tr><tr><td class=\"w\">symbol</td><td class=\"m\">상징</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>마오리족은 뉴질랜드의 원주민이며, 그들의 문화는 오늘날 뉴질랜드 사회에 깊게 자리 잡고 있다.</li><li>마오리 언어와 마을 방문 등을 통해 마오리 문화를 직접 체험할 수 있다.</li><li>마오리족의 전통 춤인 &#39;하카&#39;는 과거 전쟁 춤에서 유래했으나 현대에는 국가 행사의 상징이 되었다.</li><li>하카는 뉴질랜드의 정체성을 보여주는 중요한 국가적 상징이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Maori are the native people of New Zealand who maintain their cultural identity today, and their traditional war dance called the haka has become a famous national symbol.</div>\n              <div class=\"lec-final-sum-ko\">마오리족은 오늘날까지 자신들의 문화적 정체성을 유지해 온 뉴질랜드의 원주민이며, 그들의 전통 전투 춤인 하카는 유명한 국가적 상징이 되었다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp
