으로 여겨지는 고유종 새의 이름이기도 합니다.</li><li>뉴질랜드 토착 새(native bird)의 명칭</li><li>국가적 상징(symbol of the nation)으로서 뉴질랜드인들에게 특별함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03사람을 부르는 별칭</div><ul><li>키위는 전 세계적으로 뉴질랜드 사람들을 일컫는 별명으로도 쓰입니다.</li><li>뉴질랜드 사람(New Zealanders)을 지칭하는 애칭</li><li>국제적으로 널리 사용되는 명칭</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 주의사항</div><ul><li>키위라는 단어는 문맥에 따라 여러 의미를 지니므로 혼동하지 않도록 주의해야 합니다.</li><li>세 가지 의미(과일, 새, 사람)의 공존</li><li>문맥에 따른 의미 이해(several meanings)의 중요성</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come to one&#39;s mind</td><td class=\"m\">~가 떠오르다</td></tr><tr><td class=\"w\">a couple of</td><td class=\"m\">두어 개의, 몇 개의</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">재배하다, 자라다</td></tr><tr><td class=\"w\">be known as</td><td class=\"m\">~로 알려져 있다</td></tr><tr><td class=\"w\">native</td><td class=\"m\">토착의, 원산지의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한</td></tr><tr><td class=\"w\">symbol</td><td class=\"m\">상징</td></tr><tr><td class=\"w\">nation</td><td class=\"m\">국가, 나라</td></tr><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr><tr><td class=\"w\">throughout</td><td class=\"m\">도처에, ~의 도처에서</td></tr><tr><td class=\"w\">confused</td><td class=\"m\">혼란스러운</td></tr><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 여러 개의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 들을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When you hear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위라는 단어를,</span><span class=\"en\"><b>the word kiwi,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 떠오르는가</span><span class=\"en\"><b>what comes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 마음에?</span><span class=\"en\"><b>to your mind?</b></span></div></div><div class=\"lec-sent-ko\">당신은 키위라는 단어를 들으면 무엇이 마음에 떠오르는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 흥미를 유발하며, &#39;키위&#39;라는 단어가 가진 다의성에 대해 본격적으로 논의할 준비를 시킵니다. 여기서 comes to your mind는 사전적으로 &#39;마음속으로 오다&#39;이지만, 문맥상 &#39;생각나다&#39;나 &#39;떠오르다&#39;라는 의미입니다. 독자의 경험을 환기하여 자연스럽게 주제로 이끌기 위해 이런 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you hear (현재분사(분사구문)): &#39;When you hear&#39;는 접속사 when + 주어(you) + 동사(hear)의 구조로, 시간을 나타내는 부사절 역할을 하는 분사구문과 대응하는 절의 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마도 과일이겠지만,</span><span class=\"en\"><b>Maybe a fruit,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 뉴질랜드에서</span><span class=\"en\"><b>but, in New Zealand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위라는 단어는</span><span class=\"en\"><b>the word kiwi</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있다</span><span class=\"en\"><b>has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 의미를.</span><span class=\"en\"><b><span class=\"grammar-hl\">a couple of</span> meanings.</b></span></div></div><div class=\"lec-sent-ko\">아마도 과일이겠지만, 뉴질랜드에서 키위라는 단어는 몇 가지 뜻을 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 일반적인 답변을 제시하면서, 뉴질랜드라는 특정 지역에서는 이 단어가 더 다양한 뜻으로 쓰인다는 반전을 주어 글의 화제를 전환합니다. a couple of는 사전적으로 &#39;둘의&#39;라는 뜻이지만, 여기서는 &#39;몇 개의&#39;, &#39;두세 개의&#39;라는 의미로 쓰여 단어의 다의성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a couple of (관용표현): &#39;둘의, 두어 개의&#39;라는 의미를 가진 수량 표현으로, 뒤에 가산 명사의 복수형(meanings)과 함께 쓰입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a couple of</td><td class=\"m\">두어 개의, 몇 개의</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우선,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위는 ~이다</span><span class=\"en\"><b>kiwi is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름이다</span><span class=\"en\"><b>the name of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛있는 녹색 과일의.</span><span class=\"en\"><b>a <span class=\"grammar-hl\">delicious, green fruit</span>.</b></span></div></div><div class=\"lec-sent-ko\">우선, 키위는 맛있는 녹색 과일의 이름이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뉴질랜드에서 쓰이는 키위의 첫 번째 의미를 소개합니다. 글 전체의 논리적 순서를 잡기 위해 &#39;First&#39;라는 연결어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">delicious, green fruit 형용사 나열: 두 형용사가 명사(fruit)를 수식하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 키위 과일이</span><span class=\"en\"><b>A lot of kiwi fruit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 재배된다,</span><span class=\"en\"><b><span class=\"grammar-hl\">is grown</span> there,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 뉴질랜드는</span><span class=\"en\"><b>so New Zealand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is known as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위 과일의 나라로.</span><span class=\"en\"><b>the land of kiwi fruit.</b></span></div></div><div class=\"lec-sent-ko\">많은 키위 과일이 그곳에서 자라기 때문에 뉴질랜드는 키위 과일의 나라로 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 과일로서의 키위가 뉴질랜드에서 얼마나 중요한지를 설명하며, 지명도와의 연관성을 제시합니다. is known as는 &#39;～로서 알려지다&#39;라는 뜻으로, 뉴질랜드라는 국가의 대표적인 특성을 명확하게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is grown (수동태): be동사(is)+p.p.(grown) 구조. grow는 타동사인데 목적어가 없어서 수동구조 is grown 형태로 씁니다. 기본구조: grow + O (재배하다)</div><div class=\"lec-gr-item\">is known as (수동태): be동사(is)+p.p.(known) 구조. know는 타동사인데 목적어가 없어서 수동구조 is known as 형태로 씁니다. 기본구조: know + O + as + B (O를 B로 알다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">재배하다, 자라다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">키위는 또한</span><span class=\"en\"><b>Kiwi is also</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름이다</span><span class=\"en\"><b>the name of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드의 ~중 하나의</span><span class=\"en\"><b>one of New Zealand's</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토종 새들의.</span><span class=\"en\"><b><span class=\"grammar-hl\">native</span> birds.</b></span></div></div><div class=\"lec-sent-ko\">키위는 또한 뉴질랜드의 토종 새들 중 하나의 이름이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 키위의 두 번째 의미인 &#39;새&#39;를 소개합니다. &#39;also&#39;를 사용하여 과일 외에 다른 의미가 있음을 추가 정보로 덧붙입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">native 형용사: 명사(birds)를 앞에서 수식하며, &#39;토착의, 고유의&#39;라는 의미로 특정 지역의 생물을 묘사합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">native</td><td class=\"m\">토착의, 원산지의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">키위는 특별하다</span><span class=\"en\"><b>The kiwi is special</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 사람들에게</span><span class=\"en\"><b>to New Zealanders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그것은 ~이기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">because it is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 국가의 상징.</span><span class=\"en\"><b><span class=\"grammar-hl\">the symbol</span> of the nation.</b></span></div></div><div class=\"lec-sent-ko\">키위는 이 나라의 상징이기 때문에 뉴질랜드 사람들에게 특별하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로서의 키위가 뉴질랜드 사람들에게 갖는 문화적 의미를 설명합니다. symbol은 &#39;상징&#39;이라는 뜻으로, 단순한 동물을 넘어 국가의 정체성을 담고 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because it is the symbol (부사절): 접속사 because를 사용하여 앞 문장(The kiwi is special)에 대한 이유를 설명하는 절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한</td></tr><tr><td class=\"w\">symbol</td><td class=\"m\">상징</td></tr><tr><td class=\"w\">nation</td><td class=\"m\">국가, 나라</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위는 ~이다</span><span class=\"en\"><b>kiwi is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 위한 별명</span><span class=\"en\"><b>a nickname for <span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 출신의.</span><span class=\"en\"><b><span class=\"grammar-hl\">from New Zealand</span>.</b></span></div></div><div class=\"lec-sent-ko\">또한, 키위는 뉴질랜드 출신 사람에 대한 별칭이기도 하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 키위의 세 번째 의미인 &#39;사람(뉴질랜드인)&#39;을 소개하며 다의성 설명을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people from New Zealand (전치사구): &#39;from New Zealand&#39;가 앞의 명사(people)를 수식하여 &#39;뉴질랜드 출신의 사람들&#39;이라는 의미를 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드 사람들은</span><span class=\"en\"><b>New Zealanders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">때때로 불린다</span><span class=\"en\"><b><span class=\"grammar-hl\">are sometimes called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위라고</span><span class=\"en\"><b>Kiwis</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계 전역에서.</span><span class=\"en\"><b>throughout the world.</b></span></div></div><div class=\"lec-sent-ko\">오늘날 세계 전역에서 뉴질랜드 사람들은 때때로 키위라고 불리기도 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;사람&#39;이라는 의미가 일상생활에서 어떻게 쓰이는지 보여주며, 이 별명이 전 세계적으로 통용됨을 알립니다. throughout은 &#39;～의 도처에&#39;라는 뜻으로, 뉴질랜드뿐만 아니라 전 세계 어디서나 이 별명을 사용하고 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are sometimes called (수동태): be동사(are)+p.p.(called) 구조. call은 5형식(call+O+C) 동사인데 목적어가 주어로 올라가 수동태가 되고, 목적보어(Kiwis)가 그대로 남은 구조입니다. 기본구조: call + O + C (O를 C라고 부르다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throughout</td><td class=\"m\">도처에, ~의 도처에서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 알고 있다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">know that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위가 ~의 이름이라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">kiwi is</span> the name of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과일, 새,</span><span class=\"en\"><b>a fruit, a bird,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 또한 국민의.</span><span class=\"en\"><b>and also a people.</b></span></div></div><div class=\"lec-sent-ko\">이제 당신은 키위가 과일과 새, 그리고 국민의 명칭이라는 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 언급한 세 가지 의미를 요약 정리하여 독자가 내용을 확실히 이해했는지 확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">know that kiwi is (명사절(that절)): that이 이끄는 절이 동사(know)의 목적어 역할을 하며, 문장의 핵심 내용을 전달합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음번에,</span><span class=\"en\"><b>Next time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼란스러워하지 마라</span><span class=\"en\"><b><span class=\"grammar-hl\">don't become confused</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가가 사용할 때</span><span class=\"en\"><b>when someone uses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키위라는 단어를,</span><span class=\"en\"><b>the word kiwi,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 가지고 있다 몇 가지 의미를.</span><span class=\"en\"><b><span class=\"grammar-hl\">which has several meanings</span>.</b></span></div></div><div class=\"lec-sent-ko\">다음번에 누군가가 키위라는 단어를 사용할 때 혼동하지 마라. 그 단어는 몇 가지 의미를 가지고 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마지막으로서 독자에게 당부의 말을 건넵니다. confused는 &#39;혼란스러운&#39;이라는 뜻으로, 단어의 여러 의미 때문에 헷갈릴 수 있는 상황을 방지하고자 하는 필자의 배려가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don&#39;t become confused (과거분사): &#39;confused&#39;는 주어(you)의 상태를 설명하는 보어로 쓰인 과거분사이며, 감정 동사(confuse)가 사람의 상태를 나타낼 때 쓰입니다.</div><div class=\"lec-gr-item\">which has several meanings (관계대명사): &#39;which&#39;는 선행사(the word kiwi)를 수식하는 주격 관계대명사절을 이끕니다. 관계대명사 뒤에는 동사(has)가 바로 이어지며, 절 내부에서 &#39;which&#39;가 주어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meaning</td><td class=\"m\">의미</td></tr><tr><td class=\"w\">confused</td><td class=\"m\">혼란스러운</td></tr><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 여러 개의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>&#39;키위&#39;라는 단어는 우리가 흔히 아는 과일 이외에도 다른 의미를 지닌다.</li><li>뉴질랜드에서 &#39;키위&#39;는 과일, 토착 새, 그리고 뉴질랜드 사람이라는 세 가지 뜻으로 쓰인다.</li><li>새로서의 키위는 국가적 상징이며, 사람들 사이에서는 별명으로도 쓰인다.</li><li>단어의 다양한 의미를 이해하면 상황에 따라 혼란을 겪지 않을 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The word kiwi signifies a fruit and a native bird in New Zealand, and it also serves as a common nickname for the country&#39;s residents.</div>\n              <div class=\"lec-final-sum-ko\">키위라는 단어는 뉴질랜드의 과일과 토종 새를 의미하며, 그 나라 사람들을 부르는 일반적인 별칭으로도 사용된다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"audio":"./2_audio/30.mp3","hl":"main"},{"audio":"./2_audio/31.mp3","hl":"meaning"}
