적으로 매우 역동적인 나라인데, 특히 북섬과 남섬은 서로 다른 매력을 지닌 지형적 특징(Geographic features)을 보여줍니다. 남섬은 높은 산맥이 발달해 일 년 내내 눈을 볼 수 있는 만년설 지역이 많고, 북섬은 화산 활동의 영향으로 뜨거운 물이 솟아오르는 온천(Hot springs)이 곳곳에 자리 잡고 있죠. 마치 거대한 자연 다큐멘터리 촬영장 같은 이곳의 신비로운 풍경 덕분에 영화 ‘반지의 제왕’ 같은 대작들의 촬영지(Filming location)로도 세계적인 명성을 얻게 되었습니다. 뉴질랜드의 지형은 지각판이 만나는 경계에 위치해 있어 화산과 빙하가 공존하는 독특한 생태계(Unique ecosystem)를 만들어내며, 이 때문에 전 세계 여행객들에게 꾸준히 사랑받고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01뉴질랜드의 자연 경관</div><ul><li>뉴질랜드는 아름다운 호수와 폭포 등 뛰어난 자연 풍경을 가진 나라이다.</li><li>빼어난 자연의 아름다움 (natural beauty)</li><li>호수(lakes)와 폭포(waterfalls)가 곳곳에 존재함</li><li>핵심 키워드: 자연의 아름다움(natural beauty)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02남섬의 특징</div><ul><li>남섬은 일 년 내내 눈으로 덮인 산맥이 있어 환상적인 경치를 자랑한다.</li><li>두 개의 주요 섬 중 하나인 남섬 (South Island)</li><li>일 년 내내 눈이 쌓여 있는 산(mountains)</li><li>놀라운 경관 (fantastic views)</li><li>핵심 키워드: 남섬(South Island)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03북섬의 특징</div><ul><li>북섬은 따뜻한 온천과 푸른 초원이 어우러진 평화로운 자연을 보여준다.</li><li>두 개의 주요 섬 중 하나인 북섬 (North Island)</li><li>온천(hot springs)과 푸른 초원(green grass)이 발달함</li><li>핵심 키워드: 북섬(North Island)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04뉴질랜드의 가치</div><ul><li>뛰어난 자연 환경 덕분에 뉴질랜드는 영화 촬영지로 각광받으며 많은 이들에게 감동을 준다.</li><li>아름다운 경치로 인해 유명 영화(famous movies) 촬영지로 이용됨</li><li>방문객들이 자연의 가치를 깨닫고 즐길 수 있음 (appreciate its nature)</li><li>핵심 키워드: 영화 촬영지(movie locations)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">natural</td><td class=\"m\">자연의, 자연 그대로의</td></tr><tr><td class=\"w\">beauty</td><td class=\"m\">아름다움</td></tr><tr><td class=\"w\">waterfall</td><td class=\"m\">폭포</td></tr><tr><td class=\"w\">main</td><td class= ><div class=\"lec-chunk\"><span class=\"ko\">그것은 가지고 있다</span><span class=\"en\"><b>It has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 아름다운 호수들을</span><span class=\"en\"><b>many <span class=\"grammar-hl\">beautiful</span> lakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 폭포들을</span><span class=\"en\"><b>and waterfalls.</b></span></div></div><div class=\"lec-sent-ko\">그곳엔 많은 아름다운 호수와 폭포가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;자연의 아름다움&#39;을 구체적으로 증명하기 위해, 대표적인 자연 경관인 호수와 폭포를 예로 들고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">beautiful 형용사: 명사(lakes, waterfalls)를 앞에서 수식하여 상태나 성질을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waterfall</td><td class=\"m\">폭포</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드는 가지고 있다</span><span class=\"en\"><b>New Zealand has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 주요 섬들을</span><span class=\"en\"><b>two main islands,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남섬</span><span class=\"en\"><b><span class=\"grammar-hl\">the South Island</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 북섬을</span><span class=\"en\"><b><span class=\"grammar-hl\">and the North Island</span>.</b></span></div></div><div class=\"lec-sent-ko\">뉴질랜드에는 남섬과 북섬, 두 개의 본섬이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뉴질랜드의 지리적 구성을 설명하며, 앞으로 이어질 글이 이 두 섬의 특징을 중심으로 전개될 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the South Island and the North Island (동격): 앞의 목적어(two main islands)와 뒤의 구(the South Island and the North Island)가 같은 대상을 가리키며 보충 설명하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">main</td><td class=\"m\">주된, 주요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남섬에는,</span><span class=\"en\"><b>In the South Island,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산들이 있다</span><span class=\"en\"><b>there are <span class=\"grammar-hl\">mountains</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덮여 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that are covered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈으로</span><span class=\"en\"><b><span class=\"grammar-hl\">with snow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일 년 내내</span><span class=\"en\"><b>all year round.</b></span></div></div><div class=\"lec-sent-ko\">남섬에는 일 년 내내 눈으로 덮인 산들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남섬의 구체적인 특징을 설명합니다. &#39;covered&#39;는 사전적으로 &#39;덮인&#39;이라는 뜻인데, 여기서는 눈이 산 전체를 빈틈없이 덮고 있는 상태를 강조합니다. 이는 단순히 눈이 있다는 표현보다 해당 지역의 웅장하고 차가운 느낌을 효과적으로 전달하기 위해 선택된 단어입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mountains that are covered with snow (관계대명사): that은 선행사(mountains)를 수식하며, 뒤에 주어(that)와 동사(are)가 결합된 관계대명사절로 문장을 연결한다.</div><div class=\"lec-gr-item\">are covered (수동태): be동사(are)+p.p.(covered) 구조이다. cover는 타동사인데 목적어가 없어서 수동구조 are covered 형태로 쓴다. 기본구조: cover + O + with B (~로 O를 덮다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cover</td><td class=\"m\">덮다, 뒤덮다</td></tr><tr><td class=\"w\">all year round</td><td class=\"m\">일 년 내내</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 놀라게 될 것이다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">will be amazed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 환상적인 경관들에 의해</span><span class=\"en\"><b>by the fantastic views.</b></span></div></div><div class=\"lec-sent-ko\">당신은 그 환상적인 경관에 놀라게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남섬의 경치를 직접 경험할 때 느끼게 될 반응을 예측하며, 독자에게 이곳의 매력을 강렬하게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be amazed (수동태): 조동사+be동사(be)+p.p.(amazed) 구조이다. amaze는 타동사인데 목적어가 없어서 수동구조 be amazed 형태로 쓴다. 기본구조: amaze + O (O를 놀라게 하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amaze</td><td class=\"m\">놀라게 하다</td></tr><tr><td class=\"w\">fantastic</td><td class=\"m\">환상적인, 멋진</td></tr><tr><td class=\"w\">view</td><td class=\"m\">경치, 전망</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">북섬에는,</span><span class=\"en\"><b>In the North Island,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 온천들이 있다,</span><span class=\"en\"><b>there are many hot springs,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호수들,</span><span class=\"en\"><b>lakes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 지역들이</span><span class=\"en\"><b>and <span class=\"grammar-hl\">areas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸른 풀이 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">with green grass</span>.</b></span></div></div><div clas
