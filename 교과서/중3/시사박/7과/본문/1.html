어린 사과(Sincere Apology)는 관계를 회복하는 강력한 도구가 됩니다. 단순히 미안하다는 말을 내뱉는 것을 넘어, 상대방의 감정을 존중하고 자신의 행동이 상대에게 어떤 영향을 주었는지 공감(Empathy)하는 태도가 매우 중요해요. 마치 깨진 그릇을 단순히 붙이는 것이 아니라, 조심스럽게 다루어 다시는 깨지지 않게 노력하는 것처럼 사과에도 상호 존중(Mutual Respect)이라는 정성이 필요하답니다. 이번 지문에서는 상대방의 마음을 얻고 갈등을 해결하기 위해 갖춰야 할 진정성(Sincerity)의 의미에 대해 함께 고민해 볼 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사과의 필요성</div><ul><li>인간은 불완전한 존재이기에 살면서 타인에게 의도치 않은 실수를 저지르곤 한다.</li><li>인간관계에서 피할 수 없는 실수(mistakes)와 상처(hurting feelings)</li><li>관계 회복을 위해 반드시 필요한 과정인 사과(apology)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02잘못된 사과 사례</div><ul><li>진정성이 결여된 가벼운 사과는 오히려 상대방에게 더 큰 상처를 줄 수 있다.</li><li>마이크의 경솔한 행동(casual apology)으로 인해 상처받은 준(June)</li><li>사태를 심각하게 여기지 않는 태도가 갈등을 악화시킴</li><li>핵심 키워드: 가벼운 태도(casual attitude)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 사과의 조건</div><ul><li>사과는 단순히 미안하다고 말하는 것을 넘어 상대방을 존중하는 마음을 담아야 한다.</li><li>사과의 핵심은 진정성(sincerity)을 보여주는 것</li><li>상대방의 감정을 배려하고 존중(respect)하는 태도가 필수적임</li><li>핵심 키워드: 진심(sincere), 존중(respect), 우정(friendships)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">proper</td><td class=\"m\">적절한, 제대로 된</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr><tr><td class=\"w\">get along with</td><td class=\"m\">~와 잘 지내다</td></tr><tr><td class=\"w\">hurt</td><td class=\"m\">(감정을) 상하게 하다</td></tr><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">case study</td><td class=\"m\">사례 연구</td></tr><tr><td class=\"w\">trip over</td><td class=\"m\">~에 발이 걸려 넘어지다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upload</td><td class=\"m\">(데이터를) 올리다, 업로드하다</td></tr><tr><td class=\"w\">casual</td><td class=\"m\">무심한, 격식 없는</td></tr><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr><tr><td class=\"w\">guess</td><td class=\"m\">추측하다</td></tr><tr><td class=\"w\">sincere</td><td class=\"m\">진심 어린</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존중하다</td></tr><tr><td class=\"w\">make things right</td><td class=\"m\">상황을 바로잡다</td></tr><tr><td class=\"w\">receive</td><td class=\"m\">받아들여지다, 받다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세 가지</span><span class=\"en\"><b>Three Things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 사과에 관한</span><span class=\"en\"><b>about a Proper Apology <span class=\"grammar-hl\">Because we are human</span>, we all make mistakes.</b></span></div></div><div class=\"lec-sent-ko\">(적절한 사과에 관한 세 가지)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이라는 존재는 완벽할 수 없으며, 살면서 필연적으로 잘못을 저지르게 된다는 사실을 전제로 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Because we are human (분사구문): 접속사(Because) + 주어(we) + 동사(are)의 절 구조로, 이유를 나타내는 부사절임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">proper</td><td class=\"m\">적절한, 제대로 된</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 인간이기 때문에,</span><span class=\"en\"><b><span class=\"grammar-hl\">It is not easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 모두 실수를 합니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to get along with everyone</span> all the time.</b></span></div></div><div class=\"lec-sent-ko\">모든 사람들과 항상 잘 지내기는 쉽지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;실수&#39;라는 개념을 구체화하여, 인간관계에서 갈등이 발생하는 것이 자연스러운 일임을 설명합니다. get along with는 사전적으로 &#39;~와 잘 지내다&#39;인데, 여기서는 서로 다른 사람들이 부딪히지 않고 평화로운 관계를 유지하는 것을 의미합니다. 갈등이 일상적임을 강조하여 우리가 사과해야 할 상황에 자주 놓인다는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is not easy to get along with everyone (가주어): 진주어: It은 가주어이며, to get along... 전체가 진주어로서 문장의 실질적인 주어 역할을 함</div><div class=\"lec-gr-item\">to get along (to부정사): to + 동사원형으로 진주어 위치에 쓰여 명사적 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get along with</td><td class=\"m\">~와 잘 지내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쉽지 않습니다</span><span class=\"en\"><b>Sometimes we hurt people's feelings without <span class=\"grammar-hl\">intending to</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람과 잘 지내는 것은</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">때로는 우리는 의도하지 않게 다른 사람의 감정을 상하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이라는 존재는 완벽할 수 없으며, 살면서 필연적으로 잘못을 저지르게 된다는 사실을 전제로 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">intending to (동명사): 전치사(without) 뒤에 위치하여 명사 역할을 하며, &#39;의도하는 것&#39;이라는 행위를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurt</td><td class=\"m\">(감정을) 상하게 하다</td></tr><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 사람들의 감정을 상하게 합니다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">do something wrong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도치 않게</span><span class=\"en\"><b>and regret it later.</b></span></div></div><div class=\"lec-sent-ko\">때로는 우리는 무언가를 잘못을 하고 나중에 그것을 후회한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 의도하지 않은 실수가 관계를 망칠 수 있다는 점을 언급하며, 사과의 필요성을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do something wrong 5형식(SVOC) 구조: do가 타동사로 사용되어 something(목적어) + wrong(목적격보어, 형용사) 구조를 이룸</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로,</span><span class=\"en\"><b>When that happens, <span class=\"grammar-hl\">what should we do?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 잘못된 행동을 하고</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">나중에 후회합니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그런 일이 일어나면, 우리는 무엇을 해야 할까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 던짐으로써 독자의 주의를 환기하고, 이제 해결책(사과)을 제시하겠다는 예고를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what should we do? (간접의문문): 의문사(what)로 시작하는 질문 구조로, 문장의 주어와 동사가 포함된 절 형태</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 일이 일어나면,</span><span class=\"en\"><b><span class=\"grammar-hl\">We should apologize.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 무엇을 해야 할까요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">우리는 사과해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 질문에 대한 직접적인 대답으로, 이 글의 핵심 주제를 명확히 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We should apologize. (관용표현): should + 동사원형은 당위성을 나타내는 조동사 표현임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 사과해야 합니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Read the following case studies</span> and learn three things about a proper apology.</b></span></div></div><div class=\"lec-sent-ko\">다음 사례 연구들을 읽고, 올바른 사과에 대한 세 가지를 알아보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 예시를 통해 교훈을 전달하겠다는 글의 구조를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Read the following case studies (현재분사): following이 뒤의 명사(case studies)를 수식하는 구조로, &#39;다음에 이어지는&#39;이라는 능동적 동작/상태를 나타냄</div></div>\n b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">uploaded it 5형식(SVOC) 구조: upload가 타동사로 it(목적어)을 가져오는 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upload</td><td class=\"m\">(데이터를) 올리다, 업로드하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 사진을 찍어</span><span class=\"en\"><b>June saw the picture and <span class=\"grammar-hl\">became angry</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">SNS에 올렸습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">June은 그 사진을 보았고 화가 났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Mike의 행동으로 인해 관계에 갈등이 발생했음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became angry 5형식(SVOC) 구조: become이 2형식 동사로 쓰여 주어(June)의 상태(angry)를 보충 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">준은 그 사진을 보고</span><span class=\"en\"><b>Mike said, <span class=\"grammar-hl\">with a</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화가 났습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">laugh</span>, \"Sorry, June!</b></span></div></div><div class=\"lec-sent-ko\">(준은 그 사진을 보고 화가 났습니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Mike의 사과 방식이 얼마나 가벼운지를 보여주는 대목입니다. 여기서 with a laugh는 단순한 웃음이 아니라, 상대의 고통을 가볍게 여기는 태도를 보여주며 사과의 진정성을 훼손하는 핵심적인 행위입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with a laugh (관용표현): with + 명사 형태로 &#39;웃으며&#39;라는 부사적 의미를 전달함</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마이크는 말하고는</span><span class=\"en\"><b>\" and <span class=\"grammar-hl\">deleted it</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웃으면서</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;미안해, 준!&quot;이라고</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 삭제했습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(마이크는 웃으면서 &quot;미안해, 준!&quot;이라고 말하고는 그것을 삭제했습니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> casual은 &#39;격식 없는&#39;이라는 뜻인데, 여기서는 사과를 대충 하거나 성의 없게 하는 것을 의미합니다. 진심 없는 사과가 오히려 독이 될 수 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">deleted it 5형식(SVOC) 구조: delete가 타동사로 it(목적어)을 목적보어 없이 취하는 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 후,</span><span class=\"en\"><b>After that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">준은 훨씬 더 상처를 받았습니다</span><span class=\"en\"><b>June <span class=\"grammar-hl\">felt even more hurt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마이크의 가벼운 사과 때문에.</span><span class=\"en\"><b>because of Mike's casual apology.</b></span></div></div><div class=\"lec-sent-ko\">그 후, June은 Mike의 무심한 사과 때문에 훨씬 더 감정이 상했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> casual은 &#39;격식 없는&#39;이라는 뜻인데, 여기서는 사과를 대충 하거나 성의 없게 하는 것을 의미합니다. 진심 없는 사과가 오히려 독이 될 수 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt even more hurt (과거분사): hurt가 주어의 감정 상태를 설명하는 형용사적 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurt</td><td class=\"m\">(감정을) 상하게 하다</td></tr><tr><td class=\"w\">casual</td><td class=\"m\">무심한, 격식 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">준은 마음에 들지 않았습니다</span><span class=\"en\"><b>June didn't like</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마이크가 행동했던 방식이.</span><span class=\"en\"><b><span class=\"grammar-hl\">how Mike had acted</span>.</b></span></div></div><div class=\"lec-sent-ko\">June은 Mike가 행동했던 방식이 마음에 들지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대방의 행동에 대한 June의 부정적인 감정을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how Mike had acted (간접의문문): 의문사(how) + 주어(Mike) + 동사(had acted)의 절 구조로, 동사(like)의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마이크는 생각하는 것 같았습니다</span><span class=\"en\"><b>Mike <span class=\"grammar-hl\">seemed to think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 심각한 일이 아니라고.</span><span class=\"en\"><b>it was nothing serious.</b></span></div></div><div class=\"lec-sent-ko\">Mike는 이 일이 심각한 것이 아니라고 생각하는 듯 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제의 심각성을 인지하지 못하는 Mike의 태도가 갈등을 악화시켰음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seemed to think (to부정사): seem의 보어로 쓰여 명사적 역할을 수행함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">serious</td><td class=\"m\">심각한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 무엇을 배웠나요</span><span class=\"en\"><b>What <span class=\"grammar-hl\">did you learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 사례로부터?</span><span class=\"en\"><b>from this case?</b></span></div></div><div class=\"lec-sent-ko\">이 사례로부터 당신은 무엇을 배웠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사례를 통해 독자가 스스로 교훈을 도출하도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did you learn (간접의문문): 의문사가 포함된 질문 구조로, 일반동사 learn의 조동사 did가 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네.</span><span class=\"en\"><b><span class=\"grammar-hl\">Yes.</span></b></span></div></div><div class=\"lec-sent-ko\">그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사례를 통해 도출된 첫 번째 교훈을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Yes. (관용표현): 긍정의 대답을 나타내는 감탄사</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 맞혔습니다.</span><span class=\"en\"><b>You <span class=\"grammar-hl\">guessed right</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 바르게 맞췄다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자와의 공감대를 형성하며 이어질 가르침의 중요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">guessed right 5형식(SVOC) 구조: guess가 타동사로 쓰여 &#39;옳게 추측했다&#39;는 결과를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guess</td><td class=\"m\">추측하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 19 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 진심 어린 태도를 보여야 합니다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">should be sincere</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과할 때</span><span class=\"en\"><b>when you apologize.</b></span></div></div><div class=\"lec-sent-ko\">당신은 사과할 때 진실해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사례를 통해 도출된 첫 번째 교훈을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should be sincere (관용표현): 조동사 should + be동사 원형 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">sincere</td><td class=\"m\">진심 어린</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 20 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사과하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Apologizing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">is necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 우정을 쌓기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to build good friendships</span>.</b></span></div></div><div class=\"lec-sent-ko\">사과하는 것은 좋은 교우 관계를 쌓기 위해 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 목적이 관계 회복에 있음을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Apologizing is necessary (동명사): Apologizing이 문장의 주어로 쓰여 명사적 역할을 함</div><div class=\"lec-gr-item\">to build good friendships (to부정사): 앞의 형용사(necessary)를 수식하는 부사적 용법임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 21 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미안하다고 말하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Saying you're sorry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이상입니다</span><span class=\"en\"><b>is more than</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 말 그</span><span class=\"en\"><b>just words.</b></span></div></div><div class=\"lec-sent-ko\">당신이 미안하다고 말하는 것은 단지 말 그 이상이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과라는 행위가 언어적 표현을 넘어선 정서적 교감을 포함해야 함을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Saying you&#39;re sorry (동명사): Saying이 문장의 주어이며, 뒤의 you&#39;re sorry가 명사절처럼 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 보여줄 필요가 있습니다</span><span class=\"en\"><b>You need <span class=\"grammar-hl\">to show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대방을 존중하고</span><span class=\"en\"><b><span class=\"grammar-hl\">that you respect the other person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그나 그녀의 감정을 배려한다는 것을</span><span class=\"en\"><b>and care about his or her feelings.</b></span></div></div><div class=\"lec-sent-ko\">당신이 다른 사람을 존중하고, 다른 사람의 감정에 관심을 가지고 있다는 것을 보여 주어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 올바른 사과의 핵심 요소인 &#39;존중&#39;과 &#39;공감&#39;을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to show (to부정사): 필요성을 나타내는 목적적 부사적 용법</div><div class=\"lec-gr-item\">that you respect the other person 동격의 that: 앞의 show의 목적어로 쓰여 뒤의 that절이 show의 구체적인 내용을 설명하는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">respect</td><td class=\"m\">존중하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 23 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 진정으로 상황을 바로잡고 싶다면</span><span class=\"en\"><b>If you truly want <span class=\"grammar-hl\">to make things right</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진심을 담으세요</span><span class=\"en\"><b>be sincere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과할 때</span><span class=\"en\"><b>in your apology.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 진심으로 일을 바로잡고 싶다면, 당신의 사과에 진심을 다해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;사과&#39;가 단순한 통과 의례가 아니라, 관계를 회복하기 위한 진지한 노력이어야 함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make things right (to부정사): 조건의 부사적 용법으로 해석됨</div><div class=\"lec-gr-item\">make things right 5형식(SVOC) 구조: make + things(목적어) + right(목적격보어, 형용사) 구조로 &#39;상황을 바로잡다&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진심 어린</td></tr><tr><td class=\"w\">make things right</td><td class=\"m\">상황을 바로잡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 24 / 24</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 사과가 진실할수록</span><span class=\"en\"><b><span class=\"grammar-hl\">The more sincere your apology is,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 더 잘 받아들여질 것입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">the better it will be received</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 사과가 더 진실할수록, 그것은 더 잘 받아들여질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;더 비교급, 더 비교급&#39; 구문을 사용하여 사과의 진정성과 회복의 비례 관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more sincere your apology is, the better it will be received (관용표현): The + 비교급, the + 비교급 구조로 &#39;~할수록 더욱 ~하다&#39;를 의미함</div><div class=\"lec-gr-item\">will be received (수동태): be동사(be) + p.p.(received) 형태. receive는 타동사인데 목적어가 없어서 수동구조 be received로 쓴다. 기본구조: receive + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진심 어린</td></tr><tr><td class=\"w\">receive</td><td class=\"m\">받아들여지다, 받다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 누구나 실수를 하기 때문에 올바른 사과 방법을 아는 것이 중요하다.</li><li>성의 없는 사과는 오히려 상대방에게 더 큰 상처를 줄 수 있다.</li><li>올바른 사과를 위해서는 진심 어린 태도가 필수적이다.</li><li>사과는 상대에 대한 존중과 공감을 바탕으로 할 때 비로소 진정한 가치를 갖는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An insincere apology can hurt the other person’s feelings, so you must express genuine care to restore a broken friendship.</div>\n              <div class=\"lec-final-sum-ko\">진심 없는 사과는 상대방의 감정을 더 상하게 할 수 있으므로, 깨진 우정을 회복하기 위해서는 진심 어린 마음을 표현해야 한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio":"./1_audio/26.mp3","hl":"main"},{"audio":"./1_audio/27.mp3","hl":"meaning"},{"audio":"./1_audio/28.mp3","hl":"grammar"}],[{"audio":"./1_audio/29.mp3","hl":"main"},{"audio":"./1_audio/30.mp3","hl":"meaning"},{"audio":"./1_audio/31.mp3","hl":"grammar"}],[{"audio":"./1_audio/32.mp3","hl":"main"},{"audio":"./1_audio/33.mp3","hl":"meaning"},{"audio":"./1_audio/34.mp3","hl":"grammar"}],[{"audio":"./1_audio/35.mp3","hl":"main"},{"audio":"./1_audio/36.mp3","hl":"meaning"},{"audio":"./1_audio/37.mp3","hl":"grammar"}],[{"audio":"./1_audio/38.mp3","hl":"main"},{"audio":"./1_audio/39.mp3","hl":"meaning"},{"audio":"./1_audio/40.mp3","hl":"grammar"}],[{"audio":"./1_audio/41.mp3","
