ec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사과의 적절한 타이밍</div><ul><li>실수로 타인에게 피해를 주었을 때는 즉각적으로 사과하는 것이 중요하다.</li><li>케이트와 호준의 사례: 실수로 음식물을 쏟았으나 사과하지 않음</li><li>즉각적인 사과(quick apology)의 필요성</li><li>핵심 키워드: 즉각적인 사과(at once), 책임감(responsibility)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사과의 긍정적인 효과</div><ul><li>빠른 사과는 상대방의 감정을 풀고 원만한 관계를 유지하게 해준다.</li><li>사과는 자신이 배려심 있는 사람임을 보여줌</li><li>짧은 사과 한마디로 상대의 기분을 회복시킴</li><li>핵심 키워드: 배려하는(thoughtful), 사과(apologize)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가족 관계에서의 사과</div><ul><li>가까운 사이일수록 사과를 소홀히 해서는 안 되며, 이는 갈등의 원인이 된다.</li><li>선민의 사례: 자매 사이에 사과를 생략하여 갈등 발생</li><li>가족이나 가까운 사이(family members and loved ones)에서도 사과는 필수적임</li><li>핵심 키워드: 감정(feelings), 무시하다(ignore)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">case</td><td class=\"m\">사례, 경우</td></tr><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다, 급히 가다</td></tr><tr><td class=\"w\">cafeteria</td><td class=\"m\">구내식당</td></tr><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히, 실수로</td></tr><tr><td class=\"w\">bump into</td><td class=\"m\">~와 부딪치다</td></tr><tr><td class=\"w\">tray</td><td class=\"m\">쟁반</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr><tr><td class=\"w\">at once</td><td class=\"m\">즉시, 곧바로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thoughtful</td><td class=\"m\">사려 깊은, 배려하는</td></tr><tr><td class=\"w\">take responsibility for</td><td class=\"m\">~에 대해 책임을 지다</td></tr><tr><td class=\"w\">action</td><td class=\"m\">행동, 행위</td></tr><tr><td class=\"w\">hurt</td><td class=\"m\">감정이 상한, 마음이 아픈</td></tr><tr><td class=\"w\">think nothing of</td><td class=\"m\">~을 대수롭지 않게 여기다</td></tr><tr><td class=\"w\">laugh off</td><td class=\"m\">웃어넘기다</td></tr><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr><tr><td class=\"w\">after all</td><td class=\"m\">어쨌든, 결국 (생각해보면)</td></tr><tr><td class=\"w\">dislike</td><td class=\"m\">싫어하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">Here is another case</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 사례가.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여기 또 다른 사례가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 글에 이어 다른 예시를 보여주겠다는 뜻으로, 독자에게 새로운 이야기로 넘어감을 알리는 도입 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here is another case (도치): 유도부사 Here가 문두에 와서 동사(is)와 주어(another case)의 위치가 바뀐 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">case</td><td class=\"m\">사례, 경우</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">케이트가 서두르던 중</span><span class=\"en\"><b><span class=\"grammar-hl\">While Kate was hurrying</span> across the cafeteria,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">카페테리아를 가로질러</span><span class=\"en\"><b>she accidentally bumped into Hojun.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 실수로 부딪혔다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">호준과.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Kate가 구내식당을 서둘러 가로질러 가던 중에 우연히 호준이와 부딪혔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;부딪히다&#39;라는 뜻의 bump into는 여기서 &#39;사고가 일어난 시점&#39;을 나타냅니다. 고의가 아닌 실수(accidentally)임을 강조하여 뒤에 이어질 갈등의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">While Kate was hurrying (현재진행): be동사(was) + 현재분사(hurrying)를 사용하여 과거의 특정 시점에 진행 중이었던 동작을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다, 급히 가다</td></tr><tr><td class=\"w\">cafeteria</td><td class=\"m\">구내식당</td></tr><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히, 실수로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호준의 쟁반에 있던 음식은</span><span class=\"en\"><b>Some food <span class=\"grammar-hl\">on Hojun's tray</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">떨어졌다</span><span class=\"en\"><b>fell on his jacket.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 재킷 위로.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">호준이의 식판에 있던 약간의 음식이 그의 재킷에 떨어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상황이 구체적으로 나빠진 것을 보여줍니다. 앞 문장의 &#39;부딪힘&#39;이라는 원인이 &#39;음식이 옷에 묻음&#39;이라는 결과로 이어졌습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on Hojun&#39;s tray (관용표현): 전치사 on을 사용하여 트레이 위에 놓인 상태를 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tray</td><td class=\"m\">쟁반</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">케이트는</span><span class=\"en\"><b>Kate <span class=\"grammar-hl\">didn't apologize</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과하지 않았다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Kate는 사과하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과라는 적절한 대응이 생략된 상황을 제시하여, 대인관계에서 문제가 생길 수 있는 지점을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn&#39;t apologize (대동사): 앞서 언급된 동작을 부정하는 일반동사(apologize)를 보조하기 위해 do동사(did)와 부정어(n&#39;t)를 사용함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호준은</span><span class=\"en\"><b><span class=\"grammar-hl\">Hojun felt bad.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기분이 나빴다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">호준이는 기분이 나빴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과하지 않은 행동이 상대방에게 부정적인 감정을 유발했다는 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hojun felt bad. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 생각했다</span><span class=\"en\"><b>He thought,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그녀는 아무 말도 하지 않지?</span><span class=\"en\"><b>‘Why doesn't she say something?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무 일도 아닐 텐데</span><span class=\"en\"><b><span class=\"grammar-hl\">It would be</span> nothing</b> lass=\"lec-gr-item\">laugh it off (관용표현): &#39;웃어넘기다&#39;라는 의미의 이어동사 구조로, 목적어(it)가 중간에 위치함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurt</td><td class=\"m\">감정이 상한, 마음이 아픈</td></tr><tr><td class=\"w\">think nothing of</td><td class=\"m\">~을 대수롭지 않게 여기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과는 필요하다</span><span class=\"en\"><b>apologies <span class=\"grammar-hl\">are necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원과</span><span class=\"en\"><b>among family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 사람들 사이에서도</span><span class=\"en\"><b>and loved ones,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한.</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로 사과는 가족 구성원들과 사랑하는 사람들 사이에서도 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 적용 범위를 친구 관계에서 더 가까운 관계인 가족으로 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are necessary 수동태 아님: be동사(are)와 형용사(necessary)가 결합하여 보어 구조를 형성함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민은 빌렸다</span><span class=\"en\"><b>Sunmin <span class=\"grammar-hl\">borrowed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 언니가 가장 아끼는 책을.</span><span class=\"en\"><b>her sister's favorite book.</b></span></div></div><div class=\"lec-sent-ko\">어느 날 선민이는 여동생이 가장 좋아하는 책을 빌렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 갈등 상황을 제시하기 위한 배경 설명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">borrowed 동사: 과거 시제 타동사로 뒤에 목적어(her sister&#39;s favorite book)를 취함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">borrow</td><td class=\"m\">빌리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에</span><span class=\"en\"><b><span class=\"grammar-hl\">Later,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 그것을 잃어버렸다.</span><span class=\"en\"><b><span class=\"grammar-hl\">she lost it.</span></b></span></div></div><div class=\"lec-sent-ko\">나중에 그녀는 그것을 잃어버렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 갈등이 발생하게 된 결정적인 사건을 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Later, she lost it. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선민은 사과하지 않았다</span><span class=\"en\"><b>Sunmin didn't apologize</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because she thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 중요하지 않다고.</span><span class=\"en\"><b>it was not important.</b></span></div></div><div class=\"lec-sent-ko\">선민이는 그것이 중요하지 않다고 생각했기 때문에 사과하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족 사이라는 이유로 사과를 생략하는 흔한 오해를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because she thought 접속사: 이유를 나타내는 절을 이끄는 접속사로 뒤에 주어+동사 구조가 옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 생각했다</span><span class=\"en\"><b>She thought, ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 자매라고</span><span class=\"en\"><b>‘We're sisters,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어쨌든.</span><span class=\"en\"><b><span class=\"grammar-hl\">after all</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 ‘우리는 어쨌든 자매니까.’라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;가까우니까 괜찮겠지&#39;라는 안일한 생각이 갈등의 원인임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">after all (관용표현): &#39;결국, 어쨌든&#39;의 의미로 문맥상 강조를 위해 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">after all</td><td class=\"m\">어쨌든, 결국 (생각해보면)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선민의 언니는</span><span class=\"en\"><b>Sunmin's sister</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마음에 들지 않았다</span><span class=\"en\"><b>disliked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민이 자신을 대했던 방식이.</span><span class=\"en\"><b><span class=\"grammar-hl\">how Sunmin had treated her</span>.</b></span></div></div><div class=\"lec-sent-ko\">선민이의 여동생은 선민이가 그녀를 대했던 방식이 마음에 들지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과하지 않은 행동이 결국 상대방에게 불쾌감을 주었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how Sunmin had treated her (간접의문문): 의문사(how) + 주어(Sunmin) + 동사(had treated) 순서의 명사절로, disliked의 목적어 역할</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dislike</td><td class=\"m\">싫어하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 17 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게 친자매가</span><span class=\"en\"><b><span class=\"grammar-hl\">How could her own sister</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 감정을 무시할 수 있었을까?</span><span class=\"en\"><b><span class=\"grammar-hl\">ignore</span> her feelings?</b></span></div></div><div class=\"lec-sent-ko\">어떻게 자신의 언니가 그녀의 감정을 무시할 수 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족 사이에서도 감정적 존중이 사과를 통해 이루어져야 함을 강조하는 의문문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How could her own sister ignore (의문문): 의문사 How로 시작하는 조동사 도치 문장으로, 화자의 감정을 강조함</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이번이 첫 번째는 아니었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">This was not the first time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민이가 사과하지 않은</span><span class=\"en\"><b><span class=\"grammar-hl\">Sunmin hadn't apologized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여동생에게</span><span class=\"en\"><b>to her little sister.</b></span></div></div><div class=\"lec-sent-ko\">선민이가 여동생에게 사과하지 않았던 것은 이번이 처음이 아니었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잘못된 태도가 반복되면 관계에 큰 문제가 생길 수 있음을 암시하며 글을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This was not the first time Sunmin hadn&#39;t apologized (관계부사(생략)): time 뒤에 관계부사 when이 생략되어, 뒤의 절(Sunmin hadn&#39;t apologized...)이 time을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>실수했을 때 즉시 사과하는 것은 자신의 책임감을 보여주고 갈등을 해결하는 가장 빠른 방법이다.</li><li>간단한 사과만으로도 상대방은 불쾌한 감정을 웃어넘길 수 있다.</li><li>가족이나 가까운 사이일수록 &#39;가까우니까 괜찮겠지&#39;라는 생각으로 사과를 생략해서는 안 된다.</li><li>사과하지 않는 태도가 반복되면 소중한 관계에 상처를 입히게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An immediate apology helps prevent negative emotions from growing, while neglecting to say sorry can damage bonds between friends and family members.</div>\n              <div class=\"lec-final-sum-ko\">즉각적인 사과는 부정적인 감정이 커지는 것을 막아주며, 사과하지 않는 태도는 친구나 가족 간의 유대 관계를 해칠 수 있다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8
