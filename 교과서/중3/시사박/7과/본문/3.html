62du/a627CTV0rrfTW2+36bDqQgEYIz7/l/9fpSjB5DA59COB09frnpx6gHCFhkcg5z3/z/AIe+eKiTu0orp0vfS2+mln07tdbIV02uV3vt6aXX4pevToLntjgf57f4dselA6Zx/wDWP+fzpAQeAR+JAx3/AK0hZeDkcnHbqP8A9X4n61K32vrturde/lZ6iTX5adr2t6bry/EdS/5H5/Q/kcUzen94ZwCSP0/TPHYc9M0u9V53AfiOg56H39O5yMHmly3slfW3Tvb8Nbf8Og6Wvf8AHtpe2q1Sb+YvP/6+OOv/ANcetFGQMElefcdu2PXHXg+9JuBOOOvqD3Pv1BHpn2HYSv8ALV+gN721elvPbt01V/8Ahw4B9ue/c8+me/8AnIpG6MARnB/l6UZUckgg+46g9jz09MdenJ5GzhzxjaeRx1A4z3yM+nTrgZNJWs7v/hrdFa+smu9ur65Wcm97tLVdL21enRdT/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Healing Power of Sincere Apology in Relationships<small>관계 속에서 진심 어린 사과가 가지는 치유의 힘</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">사람 관계에서 갈등이 생겼을 때 진심 어린 사과가 왜 중요한지 이해하기 위해선 정서적 계좌(Emotional Bank Account)라는 개념을 알면 좋아요. 미국의 심리학자 스티븐 코비가 만든 이 개념은 우리 마음속에 사랑과 신뢰를 저축하는 통장이 있다고 가정하는데, 평소에 사과 없이 작은 잘못이 계속 쌓이면 이 통장의 잔고가 바닥나 결국 관계가 파탄 나게 되는 것이죠. 가까운 사이일수록 친밀감(Intimacy) 때문에 사과를 소홀히 하기 쉽지만, 사실 사과는 상대방의 상처를 치유하는 심리적 안전망(Psychological safety net) 역할을 합니다. 마치 컴퓨터의 오류 수정(Error correction) 기능처럼, 제때 하는 사과는 관계의 균열을 막고 신뢰를 다시 회복하게 돕는 아주 강력한 힘을 가지고 있답니다. 따라서 소중한 사람과의 관계가 더 깊어지길 원한다면, 사과를 부끄러워하거나 미루지 말고 진정성 있는 태도(Sincere attitude)로 먼저 다가가는 용기가 필요해요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사과의 필요성</div><ul><li>가까운 사이일수록 잘못을 저질렀을 때 반드시 사과해야 합니다.</li><li>가족이나 친구처럼 가까운 관계(close relationship) 사이에서도 사과는 필수적임</li><li>가까운 사람이 주는 상처는 더 쉽게 아픔을 느낌</li><li>핵심 키워드: 사과(apologize), 가까운 사람(family members/loved ones)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사과하지 않을 때의 결과</div><ul><li>사소한 실수라도 사과 없이 방치하면 관계에 큰 상처를 남깁니다.</li><li>가깝다는 이유로 사과를 생략하는 것은 위험함</li><li>작은 실수들이 쌓여 결국 큰 감정적 상처(emotional wounds)가 됨</li><li>핵심 키워드: 감정적 상처(emotional wounds), 실수(mistakes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03사과의 실천</div><ul><li>관계가 깨지기 전에 진심 어린 사과를 즉시 표현해야 합니다.</li><li>&quot;사과하지 않으면 기회도 없다&quot;는 말을 기억해야 함</li><li>실수는 누구나 하지만 그것이 관계를 깨뜨리게 두지 말 것</li><li>빠르고 진심 어린(sincere) 사과는 많은 문제를 해결할 수 있음</li><li>핵심 키워드: 진심 어린 사과(sincere apology), 관계 유지(relationship)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">wrong</td><td class=\"m\">잘못된</td></tr><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">close</td><td class=\"m\">친밀한, 가까운</td></tr><tr><td class=\"w\">hurt</td><td class=\"m\">상처를 주다, 다치게 하다</td></tr><tr><td class=\"w\">easily</td><td class=\"m\">쉽게</td></tr><tr><td class=\"w\">let go</td><td class=\"m\">잊어버리다, 용서하다</td></tr><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">add up to</td><td class=\"m\">결국 ~이 되다, 합계가 ~이다</td></tr><tr><td class=\"w\">emotional</td><td class=\"m\">감정적인</td></tr><tr><td class=\"w\">wound</td><td class=\"m\">상처</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">loved one</td><td class=\"m\">사랑하는 사람</td></tr><tr><td class=\"w\">saying</td><td class=\"m\">격언, 속담</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">기회</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계</td></tr><tr><td class=\"w\">sincere</td><td class=\"m\">진실한, 진심 어린</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과해야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">need to apologize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 잘못했을 때</span><span class=\"en\"><b>when they do something wrong.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그들이 잘못했을 때 사과해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간관계의 가장 기본적이고 당연한 원칙을 제시하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to apologize (to부정사): need는 목적어로 to부정사를 취하는 동사로, 여기서 to apologize는 주어(People)가 필요로 하는 행위의 대상이 되는 명사적 역할(목적어)을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">wrong</td><td class=\"m\">잘못된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 포함한다</span><span class=\"en\"><b>This includes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원이나</span><span class=\"en\"><b>family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을</span><span class=\"en\"><b>and the people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신과 가까운</span><span class=\"en\"><b><span class=\"grammar-hl\">who are close to you</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 가족 구성원이나 당신과 가까운 사람들도 포함한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 말한 &#39;사람들&#39;의 범위를 우리가 가장 소중히 여기는 인간관계로 구체화하여 사과의 중요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are close to you (관계대명사): who는 선행사(the people)를 수식하는 주격 관계대명사이며, 관계대명사절 내부에서 주어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">close</td><td class=\"m\">친밀한, 가까운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상처를 받는다</span><span class=\"en\"><b>get hurt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게</span><span class=\"en\"><b>more easily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 상처가</span><span class=\"en\"><b><span class=\"grammar-hl\">when the hurt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원으로부터 올 때</span><span class=\"en\"><b><span class=\"grammar-hl\">comes from</span> a family member</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 친구로부터</span><span class=\"en\"><b>or a friend.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그 상처가 가족 구성원이나 친구로부터 올 때 더 쉽게 상처를 받는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친밀한 관계일수록 기대치가 높기 때문에, 잘못을 했을 때 발생하는 상처의 깊이가 더 크다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when the hurt comes from (관계부사): when은 부사절을 이끄는 접속사로, 문장에서 시간적 배경을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurt</td><td class=\"m\">상처를 주다, 다치게 하다</td></tr><tr><td class=\"w\">easily</td><td class=\"m\">쉽게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 생각할지도 모른다</span><span class=\"en\"><b>We may think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그냥 넘어갈 것이라는 것을</span><span class=\"en\"><b>that they will let it go</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 우리와 가깝기 때문에</span><span class=\"en\"><b>because they are close to us.</b></span></div></div><div class=\"lec-sent-ko\">우리는 아마도 그들이 우리와 가깝기 때문에 그냥 넘어갈 것이라고 생각할지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> let it go는 사전적으로는 &#39;놓아주다/보내주다&#39;이지만, 여기서는 &#39;실수나 잘못을 문제 삼지 않고 지나가다&#39;라는 뜻입니다. 필자는 사람들이 친밀함을 핑계로 사과를 생략하려는 경향이 있음을 지적하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when they are close to us (관계부사): when은 이유나 배경이 되는 상황을 설명하는 부사절을 유도함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">close</td><td class=\"m\">친밀한, 가까운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기억해라</span><span class=\"en\"><b><span class=\"grammar-hl\">Remember,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b><span class=\"grammar-hl\">however,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 실수들을 하고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> small mistakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과하지 않는 것은</span><span class=\"en\"><b>and no apology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">된다는 것을</span><span class=\"en\"><b>add up to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 감정적인 상처가</span><span class=\"en\"><b>big emotional wounds.</b></span></div></div><div class=\"lec-sent-ko\">하지만 작은 실수들을 하고 사과하지 않는 것은 큰 감정적인 상처가 된다는 것을 기억해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> add up to는 &#39;합계가 ~이 되다&#39;라는 뜻인데, 여기서는 &#39;결국 ~라는 심각한 결과를 초래하다&#39;는 의미입니다. 앞 문장의 안일한 생각을 경고하며, 사과하지 않는 습관이 관계를 망칠 수 있다는 논리로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Remember, however, that (관용표현): 명령문(Remember)과 삽입된 부사(however)가 문장의 시작을 강조함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">however</td><td class=\"m\">그러나</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr><tr><td class=\"w\">add up to</td><td class=\"m\">결국 ~이 되다, 합계가 ~이다</td></tr><tr><td class=\"w\">emotional</td><td class=\"m\">감정적인</td></tr><tr><td class=\"w\">wound</td><td class=\"m\">상처</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 특히 그렇다</span><span class=\"en\"><b>This is especially true</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원들이나</span><span class=\"en\"><b>among family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 사람들 사이에서</span><span class=\"en\"><b>and <span class=\"grammar-hl\">loved ones</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 가족 구성원들이나 사랑하는 사람들 사이에서 특히 그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과가 없는 관계가 얼마나 치명적인지를 다시 한번 강조하며, 2번 문장의 내용을 재확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">loved ones (과거분사(형용사)): loved가 ones를 수식하며, &#39;사랑받는 사람들&#39;이라는 의미로 사용됨. p.p.+N 구조로 수식</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">loved one</td><td class=\"m\">사랑하는 사람</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">들어본 적 있는가</span><span class=\"en\"><b>Have you ever heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">라는 말을</span><span class=\"en\"><b>of the saying, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상 사과하지 않는다면</span><span class=\"en\"><b>“No more apologies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상의 기회도 없다</span><span class=\"en\"><b>no more chances”?</b></span></div></div><div class=\"lec-sent-ko\">당신은 “더 이상 사과하지 않는다면, 더 이상의 기회도 없다.”라는 말을 들어본 적 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과할 타이밍을 놓치면 관계를 회복할 기회 자체가 사라질 수 있음을 격언을 통해 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the saying, “No more apologies, no more chances” 동격의 that(생략형): saying 뒤에 이어지는 따옴표 내부의 내용이 바로 saying의 구체적인 내용임(명사+that절 구조의 확장)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">saying</td><td class=\"m\">격언, 속담</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">기회</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실수를 하지만</span><span class=\"en\"><b>make mistakes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 실수가 못하게 해라</span><span class=\"en\"><b>but don't <span class=\"grammar-hl\">let one mistake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 관계를 깨뜨리지</span><span class=\"en\"><b><span class=\"grammar-hl\">break a beautiful relationship</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 실수를 하지만, 하나의 실수가 아름다운 관계를 깨뜨리지 못하게 해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> break는 사전적으로 &#39;부수다&#39;지만, 여기서는 관계의 결속력을 &#39;끊어버리거나 망가뜨리다&#39;는 뜻입니다. 실수는 누구나 할 수 있지만, 그 뒤처리가 관계의 지속 여부를 결정함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let one mistake break a beautiful relationship 5형식(SVOC) 구조: let은 사역동사로 O(one mistake) + OC(동사원형 break) 구조를 취함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사과하고 싶은가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you want to apologize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> someone?</b></span></div></div><div class=\"lec-sent-ko\">누군가에게 사과하고 싶은가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 질문을 던져 자신의 행동을 돌아보게 하고 다음 행동을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you want to apologize to 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 하려고 노력해라</span><span class=\"en\"><b><span class=\"grammar-hl\">Try to do it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금</span><span class=\"en\"><b><span class=\"grammar-hl\">now</span>.</b></span></div></div><div class=\"lec-sent-ko\">지금 그것을 하려고 노력해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 망설이지 말고 즉시 사과하라는 실천적인 조언을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Try to do it now (to부정사): try toV는 &#39;~하려고 노력하다&#39;라는 의미의 관용표현으로, to do는 동사 try의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빠르고 진실한 “미안해.”가</span><span class=\"en\"><b>A quick and sincere “I’m sorry”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해결할 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can solve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 문제를</span><span class=\"en\"><b>many problems.</b></span></div></div><div class=\"lec-sent-ko\">빠르고 진실한 “미안해.”가 많은 문제를 해결할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며, 사과라는 간단한 행동이 가진 엄청난 치유력을 다시 한번 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can solve 조동사 관용표현: can은 능력이나 가능성을 나타내는 조동사로, 주어의 의지를 보조함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진실한, 진심 어린</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 흔히 가까운 사이일수록 사과를 대수롭지 않게 여긴다.</li><li>하지만 가까운 사람일수록 잘못에 더 쉽게 상처받으며, 사과 없는 실수가 쌓이면 관계가 파괴된다.</li><li>관계를 망치지 않기 위해서는 사과할 기회를 놓치지 말아야 한다.</li><li>빠르고 진심 어린 사과는 관계의 문제들을 해결하는 가장 강력한 도구이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Neglecting to apologize for minor mistakes can accumulate into serious emotional wounds, but offering a prompt and sincere apology can help preserve valuable relationships.</div>\n              <div class=\"lec-final-sum-ko\">작은 실수에 대해 사과하지 않는 것은 심각한 감정적 상처로 쌓일 수 있지만, 신속하고 진심 어린 사과는 소중한 관계를 지키는 데 도움을 준다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.mp3","hl":"meaning"},{"audio":"./3_audio/28.mp3","hl":"grammar"}],[{"audio":"./3_audio/29.mp3","hl":"main"},{"audio":"./3_audio/30.mp3","hl":"meaning"},{"audio":"./3_audio/31.mp3","hl":"grammar"}],[{"audio":"./3_audio/32.mp3","hl":"main"},{"audio":"./3_audio/33.mp3","hl":"meaning"},{"audio":"./3_audio/34.mp3","hl":"grammar"}],[{"audio":"./3_audio/35.mp3","hl":"main"},{"audio":"./3_audio/36.mp3","hl":"meaning"},{"audio":"./3_audio/37.mp3","hl":"grammar"}],[{"audio":"./3_audio/38.mp3","hl":"main"},{"audio":"./3_audio/39.mp3","hl":"me
