wf6UxnUKcD7uD1567jj8Bxn+LBxjoMV3feXkDGCD68Y/r1x24ApChAzgglcjHf04GR/8AW5yBzWinHS2t7W09N1pZev4vQm0eVXerTd9baLr6fof/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Keys to a Proper Apology: Sincerity and Timing<small>올바른 사과의 핵심: 진심과 타이밍</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리는 살면서 의도치 않게 타인에게 실수를 하거나 상처를 주기도 하는데, 이때 진심 어린 사과(Sincere Apology)는 깨어진 관계를 회복하게 돕는 아주 중요한 사회적 기술이에요. 심리학에서는 이를 대인 관계의 윤활유라고 부르기도 하는데, 사과는 단순히 잘못을 인정하는 것을 넘어 상대방의 감정을 존중하고 책임감(Responsibility)을 가지고 있다는 것을 보여주는 행동이기 때문이죠. 특히 가족이나 아주 가까운 친구 사이일수록 &#39;가까우니까 괜찮겠지&#39;라는 안일한 생각으로 사과를 미루기 쉬운데, 이런 사소한 감정의 앙금이 쌓이면 정서적 상처(Emotional wound)가 되어 관계를 멀어지게 만들 수 있어요. 마치 상처 난 부위를 바로 소독하지 않으면 나중에 덧나는 것처럼, 갈등이 생겼을 때 즉각적인 반응(Immediate response)을 보이는 것이 관계를 지키는 핵심이라는 점을 기억하면 좋겠어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사과의 진심</div><ul><li>사과를 할 때는 단순히 말만 하는 것이 아니라 상대방을 존중하는 태도를 보여야 한다.</li><li>장난스러운 태도로 사과하면 상대는 더 큰 상처를 받음</li><li>사과는 관계를 회복하기 위해 상대의 감정을 배려하는 행동임</li><li>핵심 키워드: 진심 어린(sincere), 존중(respect)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사과의 타이밍</div><ul><li>잘못을 저질렀을 때는 변명하지 말고 즉시 사과하는 것이 중요하다.</li><li>즉각적인 사과는 자신이 책임감(responsibility)을 느끼고 있음을 보여줌</li><li>사과를 미루면 상대방은 서운함과 불쾌감을 느낌</li><li>핵심 키워드: 즉시(at once), 배려 깊은(thoughtful)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가까운 관계에서의 사과</div><ul><li>가족이나 친구처럼 가까운 사이일수록 사과를 소홀히 해서는 안 된다.</li><li>가까운 사이일수록 서로의 감정을 더 쉽게 다치게 함</li><li>사과하지 않는 작은 잘못이 쌓이면 큰 상처(emotional wounds)가 됨</li><li>핵심 키워드: 가족(family members), 가까운(close)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04관계 유지를 위한 노력</div><ul><li>사과는 실수를 바로잡고 소중한 관계를 지키는 가장 좋은 방법이다.</li><li>사과를 하지 않는 것은 관계를 끝내는 계기가 될 수 있음</li><li>진심이 담긴 빠른 사과는 많은 갈등을 해결해 줌</li><li>핵심 키워드: 관계(relationship), 실수(mistakes)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">proper</td><td class=\"m\">적절한</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr><tr><td class=\"w\">get along with</td><td class=\"m\">~와 잘 지내다</td></tr><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">trip over</td><td class=\"m\">~에 걸려 넘어지다</td></tr><tr><td class=\"w\">upload</td><td class=\"m\">(데이터를) 올리다</td></tr><tr><td class=\"w\">casual</td><td class=\"m\">무심한, 격식 없는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진실한</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존중하다</td></tr><tr><td class=\"w\">make things right</td><td class=\"m\">상황을 바로잡다</td></tr><tr><td class=\"w\">receive</td><td class=\"m\">받아들여지다</td></tr><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다</td></tr><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히</td></tr><tr><td class=\"w\">bump into</td><td class=\"m\">~와 부딪히다</td></tr><tr><td class=\"w\">at once</td><td class=\"m\">즉시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세 가지</span><span class=\"en\"><b>Three Things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 사과에 관한</span><span class=\"en\"><b>about a Proper Apology <span class=\"grammar-hl\">Because we are human</span>, we all make mistakes.</b></span></div></div><div class=\"lec-sent-ko\">(적절한 사과에 관한 세 가지)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이라는 존재는 불완전하기에 잘못을 저지를 수밖에 없다는 점을 언급하며, 사과의 필요성을 논하기 위한 서론 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Because we are human (분사구문): 접속사(because) + S(we) + V(are) 구조의 절을 포함한 부사절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">proper</td><td class=\"m\">적절한</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 인간이기 때문에,</span><span class=\"en\"><b><span class=\"grammar-hl\">It is not easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 모두 실수를 합니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to get along with</span> everyone all the time.</b></span></div></div><div class=\"lec-sent-ko\">모든 사람들과 항상 잘 지내기는 쉽지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들과의 관계가 매번 원만할 수는 없다는 점을 짚어줌으로써, 인간관계에서 필연적으로 갈등과 실수가 발생함을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is not easy to get along with (가주어): 진주어: It은 가주어, to get along with 이하가 진주어인 구조. &#39;get along with&#39;는 &#39;사이가 좋다/지내다&#39;라는 뜻의 관용표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get along with</td><td class=\"m\">~와 잘 지내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쉽지 않습니다</span><span class=\"en\"><b>Sometimes we hurt people's feelings <span class=\"grammar-hl\">without intending to</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람과 잘 지내는 것은</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">때로는 우리는 의도하지 않게 다른 사람의 감정을 상하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간이라는 존재는 불완전하기에 잘못을 저지를 수밖에 없다는 점을 언급하며, 사과의 필요성을 논하기 위한 서론 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">without intending to (동명사): 전치사(without)의 목적어로 쓰인 동명사(intending). &#39;to&#39;는 뒤에 생략된 동사원형을 대신하는 부정사의 대용구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intend</td><td class=\"m\">의도하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 사람들의 감정을 상하게 합니다</span><span class=\"en\"><b>we do something wrong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도치 않게</span><span class=\"en\"><b>and <span class=\"grammar-hl\">regret it later</span>.</b></span></div></div><div class=\"lec-sent-ko\">때로는 우리는 무언가를 잘못을 하고 나중에 그것을 후회한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실수의 범주를 &#39;고의적이지 않은 상황&#39;으로 한정하여, 우리가 사과를 해야 하는 상황이 어떻게 발생하는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">regret it later (관용표현): &#39;regret + 목적어&#39; 구조로 &#39;후회하다&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regret</td><td class=\"m\">후회하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로,</span><span class=\"en\"><b><span class=\"grammar-hl\">When that happens</span>, what should we do?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 잘못된 행동을 하고</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">나중에 후회합니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그런 일이 일어나면, 우리는 무엇을 해야 할까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 사과의 중요성에 대해 환기하며 자연스럽게 주제로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When that happens (관계부사): 문맥상 when은 시간을 나타내는 관계부사로 쓰여 절을 이끎</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 일이 일어날 때,</span><span class=\"en\"><b>We <span class=\"grammar-hl\">should apologize</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 무엇을 해야 할까요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">우리는 사과해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 직접적인 해결책을 제시하며 글의 핵심 주제를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should apologize (관용표현): 조동사 should를 사용하여 충고나 의무를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 사과해야 합니다.</span><span class=\"en\"><b>Read the following case studies and <span class=\"grammar-hl\">learn three things about</span> a pro ss=\"en\"><b>because of Mike's casual apology.</b></span></div></div><div class=\"lec-sent-ko\">그 후, June은 Mike의 무심한 사과 때문에 훨씬 더 감정이 상했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> casual은 사전적으로 &#39;격식 없는&#39;이지만, 여기서는 상대방의 마음을 배려하지 않은 &#39;성의 없는&#39;이라는 뜻으로 쓰였습니다. 진심 없는 사과가 오히려 역효과를 낸다는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt even more hurt (과거분사(형용사)): hurt가 감정의 상태를 나타내며 보어로 쓰인 과거분사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">casual</td><td class=\"m\">무심한, 격식 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">June은 마음에 들지 않았습니다</span><span class=\"en\"><b>June didn't like</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Mike가 행동했던 방식이.</span><span class=\"en\"><b><span class=\"grammar-hl\">how Mike had acted</span>.</b></span></div></div><div class=\"lec-sent-ko\">June은 Mike가 행동했던 방식이 마음에 들지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과하는 태도가 중요함을 강조하며 첫 번째 교훈으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how Mike had acted (간접의문문): 의문사(how) + 주어(Mike) + 동사(had acted)의 어순으로 구성된 명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Mike는 생각하는 것 같았습니다</span><span class=\"en\"><b>Mike <span class=\"grammar-hl\">seemed to think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 심각한 일이 아니라는 것을.</span><span class=\"en\"><b>it was nothing serious.</b></span></div></div><div class=\"lec-sent-ko\">Mike는 이 일이 심각한 것이 아니라고 생각하는 듯 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잘못을 인지하는 태도가 부족했음을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seemed to think (to부정사): seem의 목적격 보어 자리에 온 명사적 용법의 to부정사</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을 배웠나요</span><span class=\"en\"><b><span class=\"grammar-hl\">What did you learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 사례로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from this case</span>?</b></span></div></div><div class=\"lec-sent-ko\">이 사례로부터 당신은 무엇을 배웠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 스스로 내용을 정리하게 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What did you learn from this case (간접의문문): 의문사가 포함된 직접 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네.</span><span class=\"en\"><b><span class=\"grammar-hl\">Yes</span>.</b></span></div></div><div class=\"lec-sent-ko\">그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 반응을 긍정하는 추임새입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Yes (관용표현): 긍정의 대답</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 맞혔습니다.</span><span class=\"en\"><b>You <span class=\"grammar-hl\">guessed right</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 바르게 맞췄다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자와 소통하며 설명의 흐름을 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">guessed right (관용표현): &#39;guess + 부사&#39; 구조로 &#39;맞히다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 진심이어야 하는데</span><span class=\"en\"><b>You <span class=\"grammar-hl\">should be sincere</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과할 때는.</span><span class=\"en\"><b>when you apologize.</b></span></div></div><div class=\"lec-sent-ko\">당신은 사과할 때 진실해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 핵심 가치인 &#39;진정성(sincerity)&#39;을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should be sincere (관용표현): 조동사 should + be동사 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">sincere</td><td class=\"m\">진실한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 20 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사과하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Apologizing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한데</span><span class=\"en\"><b><span class=\"grammar-hl\">is necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 우정을 쌓기 위해서는.</span><span class=\"en\"><b>to build good friendships.</b></span></div></div><div class=\"lec-sent-ko\">사과하는 것은 좋은 교우 관계를 쌓기 위해 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 목적이 관계 유지에 있음을 분명히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Apologizing is necessary (동명사): 문장의 주어 자리에 위치한 동명사(Apologizing)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 21 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미안하다고 말하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Saying you're sorry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 말 이상의 것이다.</span><span class=\"en\"><b>is more than just words.</b></span></div></div><div class=\"lec-sent-ko\">당신이 미안하다고 말하는 것은 단지 말 그 이상이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과는 형식적인 말하기가 아닌 태도와 마음가짐이 중요함을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Saying you&#39;re sorry (동명사): 문장의 주어 자리에 위치한 동명사(Saying)</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 보여주어야 하는데</span><span class=\"en\"><b>You need to <span class=\"grammar-hl\">show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대방을 존중하고</span><span class=\"en\"><b><span class=\"grammar-hl\">that you respect</span> the other person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람의 감정을 신경 쓰고 있다는 것을.</span><span class=\"en\"><b>and care about his or her feelings.</b></span></div></div><div class=\"lec-sent-ko\">당신이 다른 사람을 존중하고, 다른 사람의 감정에 관심을 가지고 있다는 것을 보여 주어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 진심 어린 사과의 구체적인 구성 요소인 &#39;존중&#39;과 &#39;배려&#39;를 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">show that you respect 동격의 that: 동사 show 뒤의 that절이 목적어 역할을 하며 내용을 구체화함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">respect</td><td class=\"m\">존중하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 23 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 진정으로 상황을 바로잡고 싶다면,</span><span class=\"en\"><b>If you truly want to <span class=\"grammar-hl\">make things right</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과할 때 진심을 담으세요.</span><span class=\"en\"><b>be sincere in your apology.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 진심으로 일을 바로잡고 싶다면, 당신의 사과에 진심을 다해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잘못된 상황을 해결하는 유일한 길은 진실된 사과임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make things right (5형식(SVOC)): make + 목적어(things) + 목적격 보어(right) 구조로 &#39;상황을 올바르게 만들다&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진실한</td></tr><tr><td class=\"w\">make things right</td><td class=\"m\">상황을 바로잡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 24 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사과가 진심일수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">The more sincere your apology is,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 받아들여질 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">the better it will be received</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 사과가 더 진실할수록, 그것은 더 잘 받아들여질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;더 ~할수록 더 ~하다&#39; 구문을 통해 진정성과 수용 가능성 사이의 상관관계를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more sincere your apology is, the better it will be received (수동태): &#39;be received&#39;는 be동사(be) + p.p.(received) 구조. receive는 타동사인데 목적어가 없어서 수동구조. 기본구조: receive O (받다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진실한</td></tr><tr><td class=\"w\">receive</td><td class=\"m\">받아들여지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 25 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기에 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">Here is another case</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사례가.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여기 또 다른 사례가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 교훈을 주기 위한 사례를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here is another case (도치): 유도부사 Here가 문두에 오면서 주어(another case)와 동사(is)가 도치된 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">케이트가 카페테리아를 가로질러 서두르던 중에,</span><span class=\"en\"><b><span class=\"grammar-hl\">While Kate was hurrying</span> across the cafeteria,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 우연히 호준과 부딪혔다.</span><span class=\"en\"><b>she accidentally bumped into Hojun.</b></span></div></div><div class=\"lec-sent-ko\">Kate가 구내식당을 서둘러 가로질러 가던 중에 우연히 호준이와 부딪혔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 사례인 급한 상황에서의 실수를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">While Kate was hurrying (분사구문): 접속사(While) + S(Kate) + V(was hurrying) 구조의 부사절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다</td></tr><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 27 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호준의 쟁반에 있던 음식 일부가</span><span class=\"en\"><b>Some food on Hojun's tray</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 재킷 위로 떨어졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">fell on</span> his jacket.</b></span></div></div><div class=\"lec-sent-ko\">호준이의 식판에 있던 약간의 음식이 그의 재킷에 떨어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과가 즉시 필요한 상황이 발생했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fell on (관용표현): &#39;fall + 전치사&#39; 구조로 &#39;~에 떨어지다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">케이트는</span><span class=\"en\"><b>Kate <span class=\"grammar-hl\">didn't apologize</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과하지 않았다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Kate는 사과하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잘못에 대한 반응이 없을 때 어떤 결과가 초래되는지 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn&#39;t apologize (관용표현): 부정문 형태의 동사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 29 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호준은</span><span class=\"en\"><b>Hojun <span class=\"grammar-hl\">felt bad</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기분이 좋지 않았다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">호준이는 기분이 나빴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 즉각적인 사과가 없자 감정이 상한 Hojun의 상태를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt bad (관용표현): &#39;feel + 형용사&#39; 구조로 &#39;~한 기분이 들다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 생각했는데</span><span class=\"en\"><b>He thought, ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그녀는 아무 말도 하지 않지?</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">Why doesn't she say something</span>?</b></span></div></div><div class=\"lec-sent-ko\">그는 ‘왜 그녀는 아무 말도 하지 않지?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대의 반응을 기다리는 심리를 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why doesn&#39;t she say something (간접의문문): 직접 의문문 형태</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무 일도 아닐 텐데</span><span class=\"en\"><b><span class=\"grammar-hl\">It would be nothing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 그녀가 지금 당장 사과한다면.</span><span class=\"en\"><b>if she apologized right now.</b></span></div></div><div class=\"lec-sent-ko\">그녀가 바로 사과한다면 아무 일도 아닐 텐데.’라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 즉각적인 사과의 영향력을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It would be nothing (관용표현): 가정법 과거 구조(would + be)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 32 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 사례는 보여주며</span><span class=\"en\"><b>This case <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과가 필요할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">that when an apology is necessary</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 즉시 사과해야 한다는 것을.</span><span class=\"en\"><b>you should apologize at once.</b></span></div></div><div class=\"lec-sent-ko\">이 사례는 사과가 필요할 때 당신은 즉시 사과해야 한다는 것을 보여 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 핵심 가치인 &#39;신속함&#39;을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that when an apology is necessary (관계부사): when이 시간을 나타내는 관계부사로 쓰여 절을 이끎</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr><tr><td class=\"w\">at once</td><td class=\"m\">즉시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 33 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빠른 사과는</span><span class=\"en\"><b>A quick apology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여주며</span><span class=\"en\"><b>shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 배려심이 있고</span><span class=\"en\"><b>that you are thoughtful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 행동에 책임을 진다는 것을.</span><span class=\"en\"><b>and take responsibility for your action.</b></span></div></div><div class=\"lec-sent-ko\">빠른 사과는 당신이 사려 깊고, 당신의 행동에 책임을 진다는 것을 보여 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;신속함&#39;이 상대방에게 주는 긍정적인 메시지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is thoughtful (관용표현): &#39;be동사 + 형용사&#39; 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 해야 할 모든 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">All you need to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말하는 것인데</span><span class=\"en\"><b><span class=\"grammar-hl\">is to say</span>, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“미안해.”라고.</span><span class=\"en\"><b>“I'm sorry.</b></span></div></div><div class=\"lec-sent-ko\">당신이 해야 할 한 전부는 “내가 미안해.”라고 말하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 복잡한 변명보다 솔직한 사과 한마디가 중요하다는 것을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">All you need to do is to say (가주어): 진주어: to부정사가 명사적 용법으로 보어 자리에 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면,</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상처받은 친구는</span><span class=\"en\"><b>the hurt friend</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 대수롭지 않게 여기고</span><span class=\"en\"><b>will think nothing of it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웃어넘길 것이다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">laugh it off</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러면 상처 받은 친구는 그것에 대해 아무렇지 않게 생각하고, 그것을 웃어넘길 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> laugh it off는 사전적으로 &#39;웃어서 넘겨버리다&#39;인데, 여기서는 별일 아닌 것처럼 털어버리고 관계를 회복한다는 뜻입니다. 신속한 사과가 갈등을 어떻게 해소하는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">laugh it off (관용표현): &#39;laugh + 목적어 + off&#39; 구조로 &#39;웃어넘기다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 36 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과는 필요한데</span><span class=\"en\"><b>apologies <span class=\"grammar-hl\">are necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원과</span><span class=\"en\"><b>among family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 사람들 사이에서도</span><span class=\"en\"><b>and loved ones,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한.</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로 사과는 가족 구성원들과 사랑하는 사람들 사이에서도 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 대상을 확장하여 세 번째 교훈으로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are necessary (관용표현): &#39;be동사 + 형용사&#39; 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">necessary</td><td class=\"m\">필요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 37 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민이는 빌렸다</span><span class=\"en\"><b>Sunmin <span class=\"grammar-hl\">borrowed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언니가 가장 아끼는 책을</span><span class=\"en\"><b><span class=\"grammar-hl\">her sister's favorite book</span>.</b></span></div></div><div class=\"lec-sent-ko\">어느 날 선민이는 여동생이 가장 좋아하는 책을 빌렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족 간의 갈등 사례를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">borrowed her sister&#39;s favorite book (관용표현): 일반동사 + 목적어 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 38 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에,</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 잃어버렸다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">lost it</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나중에 그녀는 그것을 잃어버렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 갈등의 원인이 되는 사건을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lost it (관용표현): 일반동사 + 목적어 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 39 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선민이는 사과하지 않았다</span><span class=\"en\"><b>Sunmin didn't apologize</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 생각했기 때문에</span><span class=\"en\"><b>because she <span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 중요하지 않다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it was not important</span>.</b></span></div></div><div class=\"lec-sent-ko\">선민이는 그것이 중요하지 않다고 생각했기 때문에 사과하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족이라는 이유로 사과를 생략하는 흔한 착각을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought it was not important (관용표현): &#39;think + 절&#39; 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 40 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 생각했다</span><span class=\"en\"><b>She thought, ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 자매라는 것을</span><span class=\"en\"><b>‘We're sisters,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어쨌든.</span><span class=\"en\"><b><span class=\"grammar-hl\">after all</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 ‘우리는 어쨌든 자매니까.’라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> after all은 사전적으로 &#39;결국&#39;이지만, 여기서는 &#39;가족이니까 이 정도는 당연히 이해해주겠지&#39;라는 안일한 태도를 강조합니다. 필자는 이 표현을 통해 가족 사이의 무례함을 정당화하는 태도를 꼬집고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">after all (관용표현): &#39;결국/어쨌든&#39;을 의미하는 부사구</div></div>\n        ","<div class=\"lec-sent-no\">문장 41 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선민이의 언니는 마음에 들지 않았다</span><span class=\"en\"><b>Sunmin's sister disliked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민이가 자신을 대했던 방식을</span><span class=\"en\"><b><span class=\"grammar-hl\">how Sunmin had treated her</span>.</b></span></div></div><div class=\"lec-sent-ko\">선민이의 여동생은 선민이가 그녀를 대했던 방식이 마음에 들지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족 관계일수록 예의가 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how Sunmin had treated her (간접의문문): 의문사(how) + S(Sunmin) + V(had treated) 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 42 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게 친동생이</span><span class=\"en\"><b><span class=\"grammar-hl\">How could her own sister</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무시할 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">ignore</span> her feelings?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 감정을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">어떻게 자신의 언니가 그녀의 감정을 무시할 수 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족이라서 더 상처받을 수 있다는 점을 반문 형식을 통해 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How could her own sister ignore (간접의문문): 의문사가 포함된 직접 의문문</div></div>\n        ","<div class=\"lec-sent-no\">문장 43 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이번이 첫 번째가 아니었다</span><span class=\"en\"><b><span class=\"grammar-hl\">This was not the first time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선민이가 사과하지 않은 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">Sunmin hadn't apologized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여동생에게</span><span class=\"en\"><b>to her little sister.</b></span></div></div><div class=\"lec-sent-ko\">선민이가 여동생에게 사과하지 않았던 것은 이번이 처음이 아니었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 습관적인 사과 부재가 관계를 얼마나 해칠 수 있는지 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This was not the first time Sunmin hadn&#39;t apologized (관계부사): 관계부사 when이 생략된 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 44 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 사과해야 한다</span><span class=\"en\"><b>People <span class=\"grammar-hl\">need to apologize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 저질렀을 때</span><span class=\"en\"><b>when they do something wrong.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 무언가를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">사람들은 그들이 잘못했을 때 사과해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세 번째 핵심 가치인 &#39;대상 불문&#39;을 다시 한번 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to apologize (to부정사): need의 목적어로 쓰인 명사적 용법</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 45 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 가족 구성원들을 포함하며</span><span class=\"en\"><b>This includes family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사람들을</span><span class=\"en\"><b>and the <span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신과 가까운.</span><span class=\"en\"><b><span class=\"grammar-hl\">who are close to you</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 가족 구성원이나 당신과 가까운 사람들도 포함한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 범위를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people who are close to you (관계대명사): 주격 관계대명사(who) + V(are) 구조로 people을 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 46 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 상처받는다</span><span class=\"en\"><b>People <span class=\"grammar-hl\">get hurt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게</span><span class=\"en\"><b>more easily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상처가 올 때</span><span class=\"en\"><b>when the hurt comes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원으로부터</span><span class=\"en\"><b>from a family member</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 친구로부터</span><span class=\"en\"><b>or a friend.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그 상처가 가족 구성원이나 친구로부터 올 때 더 쉽게 상처를 받는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가까운 사이일수록 마음을 더 크게 다친다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get hurt (수동태): be동사 대신 상태 변화 동사 get + p.p.(hurt) 구조. hurt는 타동사인데 목적어가 없어서 수동구조. 기본구조: hurt O (상처 입히다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 47 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 생각할지도 모른다</span><span class=\"en\"><b>We may think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그냥 넘어갈 것이라는 것을</span><span class=\"en\"><b>that they will <span class=\"grammar-hl\">let it go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 우리와 가깝기 때문에</span><span class=\"en\"><b>because they are close to us.</b></span></div></div><div class=\"lec-sent-ko\">우리는 아마도 그들이 우리와 가깝기 때문에 그냥 넘어갈 것이라고 생각할지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리가 흔히 가지는 오해를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let it go (관용표현): &#39;let + O + 동사원형&#39; 구조로 &#39;내버려 두다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 48 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 기억해라</span><span class=\"en\"><b><span class=\"grammar-hl\">Remember, however,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 실수가</span><span class=\"en\"><b><span class=\"grammar-hl\">that small mistakes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사과하지 않는 것이</span><span class=\"en\"><b>and no apology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쌓여서 된다는 것을</span><span class=\"en\"><b>add up to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 마음의 상처가</span><span class=\"en\"><b>big emotional wounds.</b></span></div></div><div class=\"lec-sent-ko\">하지만 작은 실수들을 하고 사과하지 않는 것은 큰 감정적인 상처가 된다는 것을 기억해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;작은 눈덩이&#39;가 &#39;눈사태&#39;가 되듯, 사과하지 않는 태도가 관계를 파괴할 수 있음을 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Remember, however, that small mistakes (강조구문): that절을 사용하여 명확한 사실을 강조함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 49 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 특히 사실이다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">is especially true</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 구성원들 사이에서</span><span class=\"en\"><b>among family members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사랑하는 사람들 사이에서</span><span class=\"en\"><b>and loved ones.</b></span></div></div><div class=\"lec-sent-ko\">이것은 가족 구성원들이나 사랑하는 사람들 사이에서 특히 그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가까운 사이일수록 진심 어린 사과가 필수적임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is especially true (관용표현): &#39;be동사 + 형용사&#39; 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 50 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 말을 들어본 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you ever heard of</span> the saying, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과도 없고</span><span class=\"en\"><b>“No more apologies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기회도 없다라는</span><span class=\"en\"><b>no more chances”?</b></span></div></div><div class=\"lec-sent-ko\">당신은 “더 이상 사과하지 않는다면, 더 이상의 기회도 없다.”라는 말을 들어본 적 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 명언을 인용하여 사과의 필요성을 강력하게 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you ever heard of (관용표현): &#39;hear of&#39; 구조로 &#39;~에 대해 들어보다&#39;를 의미함</div></div>\n        ","<div class=\"lec-sent-no\">문장 51 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람은 실수를 하지만</span><span class=\"en\"><b>People make mistakes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 단 한 번의 실수가 ~하게 두지 마라</span><span class=\"en\"><b>but don't <span class=\"grammar-hl\">let one mistake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 관계를 깨뜨리도록</span><span class=\"en\"><b><span class=\"grammar-hl\">break</span> a beautiful relationship.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 실수를 하지만, 하나의 실수가 아름다운 관계를 깨뜨리지 못하게 해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실수는 불가피하지만, 대처하는 방식에 따라 관계를 지킬 수 있음을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let one mistake break (5형식(SVOC)): let + 목적어(one mistake) + 목적격 보어(break) 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 52 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 사과하고 싶은가</span><span class=\"en\"><b>Do you <span class=\"grammar-hl\">want to apologize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가에게</span><span class=\"en\"><b>to someone?</b></span></div></div><div class=\"lec-sent-ko\">누군가에게 사과하고 싶은가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 행동 변화를 촉구합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want to apologize (to부정사): want의 목적어로 쓰인 명사적 용법</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 53 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 해보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Try to do it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금</span><span class=\"en\"><b>now.</b></span></div></div><div class=\"lec-sent-ko\">지금 그것을 하려고 노력해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;신속함&#39;의 교훈을 바로 실행하라는 조언입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Try to do it (to부정사): try의 목적어로 쓰인 명사적 용법</div></div>\n        ","<div class=\"lec-sent-no\">문장 54 / 54</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빠르고 진심 어린 &quot;미안해&quot;라는 말은</span><span class=\"en\"><b>A quick and sincere “I’m sorry”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해결할 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can solve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 문제를</span><span class=\"en\"><b><span class=\"grammar-hl\">many problems</span>.</b></span></div></div><div class=\"lec-sent-ko\">빠르고 진실한 “미안해.”가 많은 문제를 해결할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과의 정의를 정리하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can solve many problems (관용표현): 조동사 can을 사용한 능동 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sincere</td><td class=\"m\">진실한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>실수는 인간이라면 누구나 저지르며, 실수를 후회한다면 반드시 사과해야 한다.</li><li>올바른 사과의 첫 번째 조건은 상대의 감정을 존중하고 진심을 담는 것이다.</li><li>두 번째 조건은 미루지 않고 즉시 사과하여 상대의 마음을 풀어주는 것이다.</li><li>세 번째는 가족이나 가까운 사람일수록 사과를 건너뛰지 말아야 한다는 점이다.</li><li>사과하지 않는 작은 실수들이 쌓이면 소중한 관계를 깨뜨릴 수 있으므로, 지금 바로 진심으로 사과해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Sincere and immediate apologies are essential for building trust, and they should be offered to everyone including family members to prevent small mistakes from becoming emotional wounds.</div>\n              <div class=\"lec-final-sum-ko\">진심 어린 즉각적인 사과는 신뢰를 쌓는 데 필수적이며, 작은 실수가 마음의 상처로 커지는 것을 막기 위해 가족을 포함한 모든 이에게 행해져야 한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":n
