span class=\"en\"><b>the rain shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스를</span><span class=\"en\"><b><span class=\"grammar-hl\">the stress</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 그 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">the person who drew the picture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">받고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">is under</span>.</b></span></div></div><div class=\"lec-sent-ko\">첫 번째, 비는 그림을 그린 사람이 받고 있는 스트레스를 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 그림 심리 검사에서 &#39;비&#39;라는 요소가 무엇을 상징하는지 정의하며 글의 서두를 엽니다. 여기서 under는 사전적으로는 &#39;아래에&#39;라는 뜻이지만, 여기서는 &#39;스트레스를 받고 있는 상태&#39;를 의미합니다. 단순히 물리적 위치를 넘어 스트레스라는 무거운 짐을 짊어지고 있다는 느낌을 강조하기 위해 이 전치사를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the stress the person who drew the picture is under (관계대명사(목적격)): &#39;the stress&#39;를 선행사로 하여 &#39;the person... is under&#39; 절이 수식하고 있으며, under 뒤에 목적어가 생략된 구조입니다.</div><div class=\"lec-gr-item\">who drew the picture (관계대명사(주격)): &#39;the person&#39;을 수식하며, who 뒤에 주어 역할을 하는 절이 이어집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빗방울이 더 클수록</span><span class=\"en\"><b>The bigger the drops are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 더 세게</span><span class=\"en\"><b>or the more heavily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비가 내릴수록,</span><span class=\"en\"><b>the rain <span class=\"grammar-hl\">is falling</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그만큼 스트레스는 더 크다.</span><span class=\"en\"><b>the bigger the stress is.</b></span></div></div><div class=\"lec-sent-ko\">빗방울의 크기가 크면 클수록, 혹은 비가 더 세게 내리면 내릴수록 스트레스는 더 큽니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;비&#39;의 구체적인 양상을 통해 스트레스의 정도를 어떻게 파악하는지 설명합니다. &#39;더 ~할수록 더 ~하다&#39;라는 구문을 사용하여 비의 강도와 심리적 압박감 사이의 비례 관계를 명확히 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The bigger... the bigger... (관용표현): &#39;The + 비교급, the + 비교급&#39; 구조로 &#39;~하면 할수록 더 ~하다&#39;라는 의미를 나타냅니다.</div><div class=\"lec-gr-item\">is falling (현재진행): be동사(is) + 현재분사(falling) 구조로, 비가 내리고 있는 동작을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">구름은 의미한다</span><span class=\"en\"><b>The clouds mean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제들을</span><span class=\"en\"><b>problems</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어나기를 기다리는,</span><span class=\"en\"><b><span class=\"grammar-hl\">waiting to happen</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 큰 구름은 보여 준다</span><span class=\"en\"><b>so a big cloud shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리는 사람이</span><span class=\"en\"><b>the drawer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그다지 희망적이지 않음을</span><span class=\"en\"><b>is not very hopeful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래에 대해</span><span class=\"en\"><b>about the future.</b></span></div></div><div class=\"lec-sent-ko\">구름은 앞으로 벌어질 문제를 의미하기 때문에, 큰 구름은 그림을 그린 사람이 미래에 대해 그다지 희망적이지 않다는 것을 나타냅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비와 함께 그려지는 &#39;구름&#39;의 해석을 통해 그림 속 상징을 추가로 설명합니다. waiting to happen은 &#39;일어나기를 기다리는&#39;이라는 직역을 넘어, 곧 닥칠 운명적인 문제들을 의인화하여 표현함으로써 미래에 대한 불안감을 더욱 생생하게 전달하려는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waiting to happen (현재분사(형용사적)): &#39;problems&#39;를 수식하며, &#39;발생하기를 기다리는&#39;이라는 상태를 나타냅니다.</div><div class=\"lec-gr-item\">to happen (to부정사): 앞의 형용사적 현재분사 &#39;waiting&#39;의 동작에 대한 목적이나 대상을 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 번째로,</span><span class=\"en\"><b>Second,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산은 의미한다</span><span class=\"en\"><b>the umbrella means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보호를</span><span class=\"en\"><b><span class=\"grammar-hl\">the protection</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람이 가지고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">the person has</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스가 많은 상황 속에서</span><span class=\"en\"><b>in a stressful situation.</b></span></div></div><div class=\"lec-sent-ko\">두 번째, 우산은 스트레스를 받는 상황에서 그 사람이 가지고 있는 보호 기제를 의미합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 스트레스 요인(비, 구름)에 대응하는 방어 기제인 &#39;우산&#39;에 대해 설명하며 논리를 전개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the protection the person has (관계대명사(목적격)): &#39;the protection&#39; 뒤에 목적격 관계대명사가 생략되어 있으며, 뒤의 &#39;the person has&#39;가 보호라는 명사를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">큰 우산은 보여 준다</span><span class=\"en\"><b>A big umbrella <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the drawer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 계획을 가지고 있다는 것을</span><span class=\"en\"><b>has a lot of plans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 보호 기제를</span><span class=\"en\"><b>or protection.</b></span></div></div><div class=\"lec-sent-ko\">큰 우산은 그림을 그린 사람이 많은 계획이나 보호 기제를 가지고 있음을 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우산의 크기가 구체적으로 무엇을 암시하는지 설명합니다. 심리적인 대비책이 얼마나 든든한지를 &#39;큰 우산&#39;이라는 시각적 이미지로 치환하여 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that 명사절을 이끄는 that: &#39;shows&#39;의 목적어 역할을 하는 절을 연결하는 접속사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우산이 없다면</span><span class=\"en\"><b>If there’s no umbrella</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 그림 속에,</span><span class=\"en\"><b>in the drawing,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람은 가지고 있지 않다</span><span class=\"en\"><b>the drawer does not have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 방법도</span><span class=\"en\"><b>any means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려운 상황들을 다룰</span><span class=\"en\"><b><span class=\"grammar-hl\">to deal with</span> difficult situations.</b></span></div></div><div class=\"lec-sent-ko\">만약 그림에 우산이 없다면, 그 그림을 그린 사람은 어려운 상황을 헤쳐 나갈 어떤 방법도 가지고 있지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우산이 없는 경우를 가정하여, 앞선 내용(보호 수단)이 부재할 때의 의미를 대조적으로 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to deal with (to부정사(형용사적)): 앞의 명사 &#39;means&#39;를 수식하여 &#39;~할 수단(방법)&#39;이라는 의미를 형성합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>그림 심리 검사에서 &#39;비&#39;와 &#39;구름&#39;은 그 사람이 겪는 스트레스와 다가올 문제에 대한 불안을 상징한다.</li><li>비와 구름의 크기는 스트레스와 불안의 강도에 비례한다.</li><li>&#39;우산&#39;은 스트레스 상황을 견뎌낼 보호 수단이나 계획을 의미한다.</li><li>우산이 없는 그림은 어려운 상황에 대처할 능력이 부족하다는 심리적 상태를 반영한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The intensity of the rain represents the level of stress or future anxiety, and the presence of an umbrella indicates the drawer&#39;s ability to cope with difficulties.</div>\n              <div class=\"lec-final-sum-ko\">비의 강도는 스트레스나 미래에 대한 불안의 정도를 나타내며, 우산의 유무는 그 사람이 어려움에 대처할 수 있는 능력을 보여준다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":"main"},{"audio":"./3_audio/4.mp3","hl":"meaning"},{"audio":"./3_audio/5.mp3","hl":"grammar"}],[{"audio":"./3_audio/6.mp3","hl":"main"},{"audio":"./3_audio/7.mp3","hl":"meaning"},{"audio":"./3_audio/8.mp3","hl":"grammar"}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("
