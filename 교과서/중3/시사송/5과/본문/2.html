미</b> 앞선 맥락에서 언급된 심리 검사들 중 하나로 DAPR이라는 구체적인 사례를 소개하며 글을 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">One of those tests (관용표현): One of + 복수명사 구조로, &#39;복수 대상 중 하나&#39;를 의미하며 전체 문장의 주어 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구해 봅시다</span><span class=\"en\"><b><span class=\"grammar-hl\">Study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림들을</span><span class=\"en\"><b>the pictures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래에 있는</span><span class=\"en\"><b>below.</b></span></div></div><div class=\"lec-sent-ko\">아래의 그림들을 연구해 봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 시각적인 자료를 관찰하도록 유도하여 뒤이어 나올 두 그림 간의 차이점에 집중하게 합니다. 여기서 Study는 &#39;공부하다&#39;라는 뜻이 아니라 &#39;면밀히 살피다/관찰하다&#39;라는 의미로 쓰였습니다. 독자가 대충 보는 것이 아니라 분석적으로 그림을 들여다보길 바라는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Study (명령문): 주어 없이 동사원형으로 시작하며, 상대방에게 행동을 요청하는 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b>The person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">A 그림 속의</span><span class=\"en\"><b>in Drawing A</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들고 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">is holding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산을</span><span class=\"en\"><b>an umbrella</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가벼운 빗속에서</span><span class=\"en\"><b>in a light rain.</b></span></div></div><div class=\"lec-sent-ko\">A 그림 속의 사람은 가벼운 빗속에서 우산을 들고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 가지 비교 대상 중 첫 번째 대상인 &#39;그림 A&#39;의 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is holding (현재진행): be동사(is) + 현재분사(-ing) 구조로, 현재 어떤 동작이 진행 중임을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반면에,</span><span class=\"en\"><b><span class=\"grammar-hl\">On the other hand</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b>the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">B 그림 속의</span><span class=\"en\"><b>in Drawing B</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있습니다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거센 빗속에</span><span class=\"en\"><b>in a heavy rain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 가지고 있지 않습니다</span><span class=\"en\"><b>and has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산을</span><span class=\"en\"><b>no umbrella.</b></span></div></div><div class=\"lec-sent-ko\">반면에, B 그림 속의 사람은 거센 빗속에서 우산을 가지고 있지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> On the other hand를 사용하여 그림 A와 대조되는 그림 B의 상황을 제시합니다. 앞 문장과 정반대되는 상황을 배치함으로써 독자가 자연스럽게 두 그림의 차이를 비교하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the other hand (관용표현): 앞선 내용과 대조되는 상황을 전환할 때 사용하는 연결구.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은 구름들이</span><span class=\"en\"><b>dark clouds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람 위에</span><span class=\"en\"><b>above the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">B 그림 속의</span><span class=\"en\"><b>in Drawing B.</b></span></div></div><div class=\"lec-sent-ko\">또한, 검은 구름들이 B 그림의 사람 머리 위에 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림 B의 부정적인 상황(폭우, 우산 없음)을 강화하는 추가적인 단서인 &#39;먹구름&#39;을 언급하며 분석의 깊이를 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): 유도부사 there가 문두에 오면서 주어(dark clouds)와 동사(are)의 위치가 바뀐 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">할 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">can</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 차이들이</span><span class=\"en\"><b><span class=\"grammar-hl\">these differences</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미하는 것?</span><span class=\"en\"><b><span class=\"grammar-hl\">mean?</span></b></span></div></div><div class=\"lec-sent-ko\">이런 차이는 무엇을 의미하는 걸까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 나열한 시각적 차이점들을 바탕으로, 이것이 심리학적으로 어떤 해석(의미)을 갖는지 질문을 던지며 독자의 호기심을 유발하고 다음 내용을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can these differences mean? (간접의문문): 의문사(What)를 포함한 의문문 구조로, 문장의 목적어 역할을 할 수 있는 질문 형태.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>심리 검사의 일종인 &#39;비 오는 날의 사람 그리기(DAPR)&#39; 검사를 소개한다.</li><li>그림 A와 그림 B의 상황(비의 양, 우산 유무, 날씨)을 구체적으로 비교한다.</li><li>시각적으로 드러나는 이러한 차이점들이 심리학적으로 어떤 의미를 담고 있는지 질문을 던진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The DAPR test analyzes drawings of people in the rain, and specific details like umbrellas or weather signify psychological states.</div>\n              <div class=\"lec-final-sum-ko\">DAPR 검사는 빗속의 사람 그림을 분석하며, 우산이나 날씨와 같은 구체적인 세부 사항은 심리적 상태를 의미한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":"main"},{"audio":"./2_audio/4.mp3","hl":"meaning"},{"audio":"./2_audio/5.mp3","hl":"grammar"}],[{"audio":"./2_audio/6.mp3","hl":"main"},{"audio":"./2_audio/7.mp3","hl":"meaning"},{"audio":"./2_audio/8.mp3","hl":"grammar"}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf
