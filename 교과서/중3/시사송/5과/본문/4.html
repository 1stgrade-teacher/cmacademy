/jU84xxhvYDPv3GaaGG4hioIwThx09QM9Pf7pPU0/Ty+/0376+miDll/K/ufl/wPwHntz/9bnp3/wAn8aB6cE+vQfr/AI0gZezKe2Nw6+vXpnnPTtmlLKedy5J/vD8T1xgnv09/U+X+fT+vv+S5ZPo/PR9108/wAAn8OvH/AOvFKfYD/Ofx/n/IUwOpyQyHBxjcPr2JP5e/Tml3L/eUZxgb1PbPr+Ge/wCVK39f16j5Zb2fZaP+mxeo9P6f/X9Pf1pCePpyeBkgdfT29hnjmlBB5DKQOvzL/jkZ+nPboaQlTn5lA7fMOmOuCTx7nK57+jXnt5bitK/wv7n5f1/Wqg59R9etL0x3A5x/n8jTSygZLIOpOGU8g8++OeuCCcdzwBlODuXH+8OhHXvx74IBxSHyy7P7n/kKOM8f1yTn/wCtz2/CikJXJG5eM8b1JBXGc4PbufpxzSGRORuXqO478DqenfPQ9cmnv9y6/L+l0C0v5X9zHAHgdfzPOcep/r2oHccgd/Qn/P8APuc0blzwyf8AfS4/U/8A68j1GWbhnIZSvf5huB4/h64wevIByOvFCW+y/DXT+unrZAoyf2X005XdevzHn/8AV2/z+tIM45//AF0blwDuTnkfMvQDnvnOM9h6etA29Aw4BJG5eOPQEjt2x2x96jp5N79Vbt94lFrSzt2s/wCv6YA56ZHfGOPbP59j6+9BJznqDgfmQMn1/n1z1yAMufvDAOCcgDGcdTgY984oJUfxLgZ7jkDPTn/Ht6ijtfX9UvP8PIfK9uV39H1t+egv05/z/n/OaMnOe/HP0/Dk8f49c0gdMDDKecghgeuCc/QdOccjsRRuUZOVBHPUdOffPbpznjPbKFFc193rb4X7vwpp31fW97dEKR37/rjr07Z/DPB7VE7bhj3OQcHuR24HQ5+uOaduBAb5CDleobGcHj8Tnj35GeY8AA5KjHI5wAOPc8D06k57bQQpp2TSatpJ3Ts7wlrbZrSNr3Tfe6TenHbH4DFOGc8Y45546ZPocfgD9Kble5UgnAG4dfzOR+g9cU4rkOVxwM54K9CATknqB/iRxTi0mm3omvzStpsJRb1S6Xv93Xzumu5//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Understanding Personality Through Human Figure Drawings<small>인물화를 통해 성격 파악하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">심리학 분야에서는 그림을 통해 사람의 내면을 분석하는 투사적 검사(Projective Test)라는 기법을 활용하곤 해요. 이 지문에서 언급하는 인물화 검사(Draw-a-Person Test)는 피검사자가 그린 그림의 세부 사항이나 위치를 통해 그 사람의 심리적 상태나 성격 특성을 파악하는 대표적인 방법 중 하나랍니다. 예를 들어 그림 속 인물의 표정이나 종이 위의 위치 등은 그 사람이 가진 잠재의식이나 현재의 정서적 태도를 반영한다고 해석되죠. 마치 우리가 일기장에 적는 짧은 글귀가 그날의 기분을 보여주듯, 이 그림들도 겉으로 드러나지 않는 개인의 내면을 비추는 거울과 같은 역할을 한다고 생각하면 이해하기 쉬울 거예요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세 번째로,</span><span class=\"en\"><b>Third,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람 그림 속의 세부 사항들은</span><span class=\"en\"><b>the details in the drawing of the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관련이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">have to do with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리는 사람의 태도와</span><span class=\"en\"><b>the drawer’s attitude</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스 상황에서의</span><span class=\"en\"><b>under stress.</b></span></div></div><div class=\"lec-sent-ko\">세 번째, 그림 속 사람의 세부적인 것들은 그 그림을 그린 사람이 스트레스를 받을 때의 태도와 관련이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문단들에서 다룬 심리 분석법에 이어, 세 번째 분석 요소인 &#39;세부 묘사&#39;를 소개하며 전체 글의 흐름을 이어가고 있습니다. 여기서 have to do with는 사전적으로 &#39;~와 관계가 있다&#39;인데, 여기서는 구체적인 그림 요소가 심리 상태라는 추상적 개념과 밀접하게 연결되어 있음을 강조하기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have to do with (관용표현): &#39;~와 관련이 있다&#39;는 뜻의 숙어로, 주어(the details)가 the drawer&#39;s attitude와 연관되어 있음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가는 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">someone who draws a person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼굴이 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">without a face</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원하지 않는다 이끄는 것을</span><span class=\"en\"><b>does not want to <span class=\"grammar-hl\">draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 관심을</span><span class=\"en\"><b><span class=\"grammar-hl\">people’s attention</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 자신에게로</span><span class=\"en\"><b><span class=\"grammar-hl\">to himself or herself</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 얼굴이 없는 사람을 그린 사람은 사람들의 관심을 끌기를 원하지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;세부 사항&#39;의 구체적인 예시를 들어 독자의 이해를 돕습니다. 여기서 draw는 &#39;그리다&#39;라는 뜻과 &#39;끌어당기다&#39;라는 뜻을 동시에 가집니다. 필자는 그림을 그리는 행위(draw a person)와 사람의 시선을 끌어오는 것(draw attention)을 같은 단어로 표현해, 그림이라는 행동이 곧 마음을 투영하는 행위임을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">someone who draws a person without a face (관계대명사): &#39;who&#39;는 선행사 &#39;someone&#39;을 수식하는 주격 관계대명사절을 이끕니다. &#39;someone&#39; 뒤의 &#39;who draws...&#39; 전체가 사람을 수식하는 구조입니다.</div><div class=\"lec-gr-item\">draw people’s attention to himself or herself 5형식(SVOC) 구조: &#39;draw(동사) + people&#39;s attention(목적어) + to himself or herself(부사구/전치사구)&#39; 형태로, 사람들의 관심을 자신에게로 끌어오다는 의미를 전달합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누군가는 그 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">Someone who draws the person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이의 오른쪽에</span><span class=\"en\"><b><span class=\"grammar-hl\">on the right side of the paper</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">준비되어 있다</span><span class=\"en\"><b>is ready to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래를 맞이할</span><span class=\"en\"><b>meet the future.</b></span></div></div><div class=\"lec-sent-ko\">사람을 종이의 오른쪽에 그린 사람은 미래를 맞이할 준비가 되어 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람의 위치라는 또 다른 세부 요소를 통해 심리를 분석합니다. 이 문장은 이어질 &#39;왼쪽&#39;과 대조를 이루기 위한 서술입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Someone who draws the person on the right side of the paper (관계대명사): &#39;who&#39;는 주격 관계대명사로 선행사 &#39;Someone&#39;을 수식하며, 뒤에 이어지는 절 내부에서 주어 역할을 수행합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반면에,</span><span class=\"en\"><b>On the other hand,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가는 그 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">someone who draws the person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왼쪽에</span><span class=\"en\"><b><span class=\"grammar-hl\">on the left side</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걱정하고 있을지도 모른다</span><span class=\"en\"><b>may be worried about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일들에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거에 일어났던</span><span class=\"en\"><b><span class=\"grammar-hl\">that have happened in the past</span>.</b></span></div></div><div class=\"lec-sent-ko\">반면에, 사람을 왼쪽에 그린 사람은 과거에 일어났던 일에 대해 걱정하고 있을 수도 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;오른쪽&#39;과 반대되는 &#39;왼쪽&#39;의 경우를 제시하여 대조 효과를 극대화합니다. On the other hand라는 연결어를 사용하여 심리 분석의 두 가지 방향(미래 지향 vs 과거 지향)을 선명하게 나눕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">someone who draws the person on the left side (관계대명사): &#39;who&#39;는 선행사 &#39;someone&#39;을 수식하는 주격 관계대명사절을 이끌어 어떤 사람인지 구체화합니다.</div><div class=\"lec-gr-item\">things that have happened in the past (관계대명사): &#39;that&#39;은 선행사 &#39;things&#39;를 수식하는 주격 관계대명사로, 뒤에 동사 &#39;have happened&#39;가 이어지며 문장에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것들은 일부이다</span><span class=\"en\"><b><span class=\"grammar-hl\">These are some</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 의미들의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the possible meanings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각 부분에 대한</span><span class=\"en\"><b>of each part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 그림들의</span><span class=\"en\"><b>of the drawings.</b></span></div></div><div class=\"lec-sent-ko\">이것들은 그림 각 부분의 가능한 의미 풀이 중 일부입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 설명한 내용들이 절대적인 정답이 아니라 여러 해석 중 하나임을 명시하며 분석의 성격을 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">These are some of the possible meanings (관용표현): &#39;some of the&#39;는 전체의 일부를 나타내는 표현으로, 명사구 앞에 쓰여 특정 의미들의 일부분임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돌아가서 살펴보라</span><span class=\"en\"><b><span class=\"grammar-hl\">go back and look at</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 두 그림을</span><span class=\"en\"><b>the two drawings.</b></span></div></div><div class=\"lec-sent-ko\">이제, 돌아가서 두 그림을 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 앞서 보았던 그림들을 다시 확인해보라고 행동을 촉구하며 참여를 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">go back and look at (관용표현): &#39;go back&#39;과 &#39;look at&#39;이 결합하여 특정 대상을 다시 확인하라는 명령조의 동사구로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시도해 보라 읽는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">Try reading</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을</span><span class=\"en\"><b><span class=\"grammar-hl\">them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로</span><span class=\"en\"><b><span class=\"grammar-hl\">yourself</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 그림들을 스스로 읽으려고 시도해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 reading은 사전적으로 &#39;읽다&#39;이지만, 문맥상 그림 속에 담긴 심리적 의미를 &#39;해석하다(interpret)&#39;는 뜻입니다. 그림이라는 비언어적 자료를 언어처럼 파악해 보라는 의미에서 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Try reading them yourself (현재분사): &#39;reading&#39;은 &#39;Try&#39;라는 동사의 목적어로 쓰인 동명사입니다. (반복되는 그림의 해석 활동을 명사적으로 나타냄)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 이해할 수 있는가</span><span class=\"en\"><b>Can you understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 종류의 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">what kind of person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렸는지</span><span class=\"en\"><b><span class=\"grammar-hl\">drew</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각의 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">each one</span>?</b></span></div></div><div class=\"lec-sent-ko\">당신은 각 그림을 그린 사람이 어떤 사람인지 알 수 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 직접 앞의 이론을 적용해 분석해보도록 질문을 던져 호기심을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what kind of person drew each one (간접의문문): &#39;what kind of person(의문사절의 주어) + drew(동사) + each one(목적어)&#39;의 구조가 &#39;understand&#39;라는 타동사의 목적어 자리에 위치한 명사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇인가</span><span class=\"en\"><b><span class=\"grammar-hl\">What’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 의견은?</span><span class=\"en\"><b><span class=\"grammar-hl\">your opinion?</span></b></span></div></div><div class=\"lec-sent-ko\">당신의 의견은 어떤가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 능동적인 생각을 물으며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What’s your opinion? (관용표현): &#39;What is your opinion&#39;은 상대방의 의견을 묻는 정형화된 질문 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람을 그린 그림의 세부 사항(얼굴 유무, 위치 등)을 통해 그린 사람의 심리 상태를 알 수 있다.</li><li>얼굴을 그리지 않는 것은 관심을 피하고 싶음을, 오른쪽은 미래 지향, 왼쪽은 과거에 대한 걱정을 의미한다.</li><li>이러한 해석은 하나의 가능성일 뿐이며, 독자 스스로 그림의 의미를 읽어보고 판단해볼 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Drawing details reveal a person&#39;s attitude toward stress, and specific placement can indicate their focus on the past or the future.</div>\n              <div class=\"lec-final-sum-ko\">그림의 세부 사항은 스트레스에 대한 태도를 드러내며, 위치는 과거 또는 미래에 대한 관심을 나타낸다.</div></div></div>"],"segs":[[{"audi
