>당신에 대해서</span><span class=\"en\"><b>about you.</b></span></div></div><div class=\"lec-sent-ko\">당신이 하는 모든 행동은 당신에 대해 말해 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람이 일상적으로 하는 모든 행위는 그 사람의 내면을 드러내는 단서가 된다는 글의 도입부입니다. 여기서 says는 단순히 &#39;말하다&#39;라는 사전적 의미를 넘어, 어떤 행동이 정보를 &#39;전달하거나 드러낸다&#39;는 문맥적 의미를 지닙니다. 필자는 우리 행동이 의도치 않게 우리를 정의한다는 사실을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Drawing the Mind (동명사): 문장의 서두에 위치하여 &#39;마음을 그리는 것&#39;이라는 명사적 의미의 주어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 사용하는 언어는,</span><span class=\"en\"><b><span class=\"grammar-hl\">The language you use</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 입는 옷은,</span><span class=\"en\"><b><span class=\"grammar-hl\">the clothes you wear</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 심지어 당신이 기르는 애완동물까지도</span><span class=\"en\"><b>and even <span class=\"grammar-hl\">the pets you raise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게든 보여준다</span><span class=\"en\"><b>somehow show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 종류의 사람인지 당신이</span><span class=\"en\"><b><span class=\"grammar-hl\">what kind of person you are</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 사용하는 언어, 당신이 입는 옷, 그리고 당신이 기르는 애완동물까지도 당신이 어떤 종류의 사람인지 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;행동&#39;의 구체적인 예시들을 열거합니다. somehow는 &#39;어떻게든&#39;이라는 뜻인데, 우리가 의식하지 않아도 무의식적으로 우리 성격이 드러난다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The language you use (관계대명사): 목적격 관계대명사(that/which 생략)가 뒤의 절 &#39;you use&#39;와 결합하여 앞의 명사 &#39;The language&#39;를 수식하며, 뒤의 절에서 use의 목적어 자리가 비어 있음</div><div class=\"lec-gr-item\">the clothes you wear (관계대명사): 목적격 관계대명사(that/which 생략)가 뒤의 절 &#39;you wear&#39;와 결합하여 앞의 명사 &#39;the clothes&#39;를 수식하며, 뒤의 절에서 wear의 목적어 자리가 비어 있음</div><div class=\"lec-gr-item\">the pets you raise (관계대명사): 목적격 관계대명사(that/which 생략)가 뒤의 절 &#39;you raise&#39;와 결합하여 앞의 명사 &#39;the pets&#39;를 수식하며, 뒤의 절에서 raise의 목적어 자리가 비어 있음</div><div class=\"lec-gr-item\">what kind of person you are (간접의문문): 의문사절(what kind of person) + S(you) + V(are) 구조로, show 동사의 목적어 역할을 하는 명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 그리는 것들은</span><span class=\"en\"><b><span class=\"grammar-hl\">The things you draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니다</span><span class=\"en\"><b>are not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많이 다르지</span><span class=\"en\"><b>much different.</b></span></div></div><div class=\"lec-sent-ko\">당신이 그리는 그림도 마찬가지입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 예시(언어, 옷, 반려동물)와 마찬가지로, &#39;그림&#39; 또한 개인의 성격을 드러내는 또 하나의 지표라는 점을 논리적으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The things you draw (관계대명사): 목적격 관계대명사(that/which 생략)가 뒤의 절 &#39;you draw&#39;와 결합하여 앞의 명사 &#39;The things&#39;를 수식하며, 뒤의 절에서 draw의 목적어 자리가 비어 있음</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 무엇을 그리는지와</span><span class=\"en\"><b><span class=\"grammar-hl\">What you draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 어떻게 그리는지는</span><span class=\"en\"><b>and <span class=\"grammar-hl\">how you draw it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관련이 있다</span><span class=\"en\"><b>are related to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 성격과</span><span class=\"en\"><b>your personality.</b></span></div></div><div class=\"lec-sent-ko\">당신이 그리는 것과 그것을 그려내는 방식은 당신의 성격과 관련이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림의 &#39;소재(무엇)&#39;와 &#39;표현 방식(어떻게)&#39;이 성격과 밀접한 연관이 있다는 이 글의 핵심 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What you draw (관계대명사): &#39;what&#39;은 선행사를 포함한 관계대명사로 &#39;~하는 것&#39;이라는 뜻을 가지며 문장의 주어 역할을 함</div><div class=\"lec-gr-item\">how you draw it (간접의문문): 의문사(how) + S(you) + V(draw) + O(it)의 구조로, 명사구 역할을 하여 문장의 주어 자리에 위치함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">의사들은</span><span class=\"en\"><b>Doctors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용해 오고 있다</span><span class=\"en\"><b>have been using</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 그림 그리기 검사를</span><span class=\"en\"><b>various drawing tests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 이해하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to better understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을</span><span class=\"en\"><b>people.</b></span></div></div><div class=\"lec-sent-ko\">의사들은 사람들을 더 잘 이해하기 위해 다양한 그림 그리기 검사를 사용해 오고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 논리를 실제 의학적·심리학적 현장(그림 검사)에 적용하고 있음을 보여주며 글을 마무리합니다. understand는 단순히 정보를 아는 것이 아니라, 사람의 심리적 상태나 내면의 성향을 &#39;파악하다&#39;라는 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to better understand (to부정사): 부사적 용법으로 &#39;이해하기 위해서&#39;라는 목적을 나타내며, 동사 understand를 수식함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리가 선택하는 일상의 모든 것(언어, 옷, 동물 등)은 우리 자신을 드러낸다.</li><li>그림을 그리는 행위 또한 개인의 성격과 밀접하게 연관되어 있다.</li><li>이러한 원리를 바탕으로 전문가들은 심리 파악을 위해 그림 검사를 활용한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">What and how you draw reveals your personality, so doctors use drawing tests to better understand individuals.</div>\n              <div class=\"lec-final-sum-ko\">당신이 무엇을 어떻게 그리는지는 당신의 성격을 드러내므로, 의사들은 개인을 더 잘 이해하기 위해 그림 검사를 사용한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meaning"},{"audio":"./1_audio/5.mp3","hl":"grammar"}],[{"audio":"./1_audio/6.mp3","hl":"main"},{"audio":"./1_audio/7.mp3","hl":"meaning"},{"audio":"./1_audio/8.mp3","hl":"grammar"}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clea
