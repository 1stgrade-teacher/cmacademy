ass=\"lec-stage-head\">03연락 없는 기다림과 게시물 누락</div><ul><li>기다림에도 불구하고 아무런 응답이 없으며 게시물이 다른 글에 밀려나기 시작함.</li><li>하루가 지나도록 단 한 통의 문자(texts)도 받지 못함</li><li>다른 사람들의 새로운 게시물(new postings)에 의해 목록 아래로 밀려남</li><li>핵심 키워드: 목록 아래로 밀려남(pushed down the list)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기대의 좌절과 실망</div><ul><li>자전거가 팔리지 않는 상황을 깨닫고 심리적으로 크게 낙담함.</li><li>아무도 자신의 자전거를 원하지 않는다는 사실을 깨달음</li><li>기대가 무너지며 실망감을 느낌</li><li>핵심 키워드: 낙담하다(heart began to sink)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">post</td><td class=\"m\">게시하다, 올리다</td></tr><tr><td class=\"w\">comment</td><td class=\"m\">논평, 언급, 의견</td></tr><tr><td class=\"w\">excellent</td><td class=\"m\">탁월한, 아주 훌륭한</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">상태, 상황</td></tr><tr><td class=\"w\">text</td><td class=\"m\">문자를 보내다</td></tr><tr><td class=\"w\">cannot wait to</td><td class=\"m\">~하기를 몹시 기다리다, 빨리 ~하고 싶어 하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advertisement</td><td class=\"m\">광고, 선전</td></tr><tr><td class=\"w\">number of hits</td><td class=\"m\">조회수, 방문 횟수</td></tr><tr><td class=\"w\">go up</td><td class=\"m\">오르다, 상승하다</td></tr><tr><td class=\"w\">expectation</td><td class=\"m\">기대, 예상</td></tr><tr><td class=\"w\">push down</td><td class=\"m\">~을 밀어내다, 아래로 누르다</td></tr><tr><td class=\"w\">one&#39;s heart sink</td><td class=\"m\">낙담하다, 가슴이 철렁 내려앉다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 빠르게 행동했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">He acted fast</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 빠르게 행동했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 중고 자전거를 팔기로 마음먹자마자 지체 없이 실행에 옮기는 상황을 보여주며 이야기의 시작을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He acted fast 1형식 문장: 주어(He)와 자동사(acted)로 이루어진 완전한 문장이며, fast는 부사로서 동사 acted를 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 자신의 자전거 사진을 찍었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">took a photo of</span> his bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스마트폰으로</span><span class=\"en\"><b>with his smartphone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 사진을 게시했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">posted the picture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짧은 설명과 함께</span><span class=\"en\"><b>with a short comment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온라인 장터에:</span><span class=\"en\"><b>on an online market:</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;빠른 행동&#39;이 구체적으로 무엇인지 설명합니다. posted the picture는 물건을 팔기 위해 온라인 플랫폼에 상품 정보를 등록하는 과정을 나타내며, Used bike in excellent condition은 구매자의 관심을 끌기 위해 자신의 물건이 중고임에도 품질이 우수하다는 점을 강조하는 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took a photo of (관용표현): &#39;~의 사진을 찍다&#39;라는 뜻의 숙어 표현이다.</div><div class=\"lec-gr-item\">posted the picture (타동사): post는 &#39;~을 게시하다&#39;라는 의미의 타동사로, 뒤에 목적어(the picture)를 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">post</td><td class=\"m\">게시하다, 올리다</td></tr><tr><td class=\"w\">comment</td><td class=\"m\">논평, 언급, 의견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“훌륭한 상태의 중고 자전거.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Used bike</span> in excellent condition.</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재 자전거를 파는 목적이 새로운 자전거를 사기 위한 자금을 마련하는 데 있음을 보여줍니다. the bike he planned to buy는 헌 자전거를 판 돈으로 곧 소유하게 될 새로운 목표물을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Used bike (과거분사(형용사)): 과거분사 used가 명사 bike를 앞에서 수식하여 &#39;중고 자전거(사용된 자전거)&#39;라는 수동의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">excellent</td><td class=\"m\">탁월한, 아주 훌륭한</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">상태, 상황</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단돈 십만 원.</span><span class=\"en\"><b><span class=\"grammar-hl\">Only 100,000 won</span>.</b></span></div></div><div class=\"lec-sent-ko\">단돈 십만 원.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;들뜬 마음&#39;이 구체적인 시각적 상상으로 이어지는 장면입니다. could see himself riding은 아직 일어나지 않은 미래의 일을 마치 현실처럼 생생하게 머릿속으로 그려보며 즐거워하고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Only 100,000 won (명사구): 광고 문구에서 주로 사용되는 형태이며, 부사 only가 수치 명사구를 수식하고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문자 주세요.”</span><span class=\"en\"><b>Please <span class=\"grammar-hl\">text me</span>.”</b></span></div></div><div class=\"lec-sent-ko\">문자 주세요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새 자전거를 갖고 싶은 열망 때문에 현재 진행 중인 중고 거래가 한시라도 빨리 성사되기를 바라는 조급함을 나타냅니다. could not wait to는 몹시 기다려져서 안달이 난 주인공의 심리 상태를 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">text me (타동사): text는 &#39;~에게 문자를 보내다&#39;라는 의미의 타동사로 쓰였으며, 뒤에 직접 목적어(me)가 온 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">text</td><td class=\"m\">문자를 보내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 신이 났다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">was excited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 자전거에 대해 생각하며</span><span class=\"en\"><b><span class=\"grammar-hl\">thinking about the bike</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 구입하려고 계획한</span><span class=\"en\"><b>he planned <span class=\"grammar-hl\">to buy</span>.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 자신이 구입하려고 계획한 자전거에 대해 생각하며 신이 났습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재 자전거를 파는 목적이 새로운 자전거를 사기 위한 자금을 마련하는 데 있음을 보여줍니다. the bike he planned to buy는 헌 자전거를 판 돈으로 곧 소유하게 될 새로운 목표물을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was excited (수동태): be동사(was)+p.p.(excited) 구조. excite는 타동사(…을 흥분시키다/들뜨게 하다)인데 목적어가 없어서 수동구조 was excited 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">thinking about the bike (분사구문): 현재분사 thinking이 이끄는 분사구문으로, 주절의 동작과 동시에 일어나는 동작을 나타낸다. 원래 절인 while he was thinking about the bike로 바꿀 수 있다.</div><div class=\"lec-gr-item\">the bike he planned (관계대명사): 명사(the bike)와 절(he planned) 사이에 목적격 관계대명사(which/that)가 생략된 구조이며, planned의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">to buy (to부정사): 타동사 plan의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 자기 자신이 보였다</span><span class=\"en\"><b>He could <span class=\"grammar-hl\">see himself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛나는 새 자전거를 타고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">riding</span> the shiny new bike.</b></span></div></div><div class=\"lec-sent-ko\">그는 자신이 빛나는 새 자전거를 타고 있는 것을 상상할 수 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;들뜬 마음&#39;이 구체적인 시각적 상상으로 이어지는 장면입니다. could see himself riding은 아직 일어나지 않은 미래의 일을 마치 현실처럼 생생하게 머릿속으로 그려보며 즐거워하고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">see himself riding 5형식(SVOC) 구조: 지각동사(see) + 목적어(himself) + 목적격 보어(riding) 구조이다. 목적어와 보어의 관계가 능동이므로 현재분사 riding을 목적격 보어로 썼다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 기다릴 수 없었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">could not wait</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">답장을 받는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> get a reply</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 온라인 광고에 대한</span><span class=\"en\"><b>to his online advertisement.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 자신의 온라인 광고에 대한 대답이 오는 것을 무척 기다렸습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새 자전거를 갖고 싶은 열망 때문에 현재 진행 중인 중고 거래가 한시라도 빨리 성사되기를 바라는 조급함을 나타냅니다. could not wait to는 몹시 기다려져서 안달이 난 주인공의 심리 상태를 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could not wait to (관용표현): &#39;...하고 싶어 못 견디다&#39;, &#39;...하는 것을 몹시 기다리다&#39;라는 의미의 숙어이다.</div><div class=\"lec-gr-item\">wait to get (to부정사): 자동사 wait 뒤에 쓰여 목적이나 결과를 나타내는 부사적 용법 또는 wait와 결합하여 미래의 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advertisement</td><td class=\"m\">광고, 선전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇 분마다</span><span class=\"en\"><b>Every few minutes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 조회 수를 확인했다.</span><span class=\"en\"><b>he checked <span class=\"grammar-hl\">the number of</span> hits.</b></span></div></div><div class=\"lec-sent-ko\">몇 분마다 그는 조회 수를 체크했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기대와 조급함을 행동으로 옮기는 모습입니다. checked the number of hits는 얼마나 많은 사람이 내 게시물을 클릭했는지 수시로 확인하며 판매 성공 가능성을 가늠해보는 행동입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the number of (관용표현): &#39;~의 수&#39;라는 의미의 표현이며, &#39;많은&#39;이라는 뜻의 a number of와는 의미와 문법적 쓰임이 다르다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">number of hits</td><td class=\"m\">조회수, 방문 횟수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">조회 수가 올라감에 따라</span><span class=\"en\"><b>As the number of hits <span class=\"grammar-hl\">went up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 기대도 덩달아 올라갔다.</span><span class=\"en\"><b>his expectations <span class=\"grammar-hl\">went up</span> too.</b></span></div></div><div class=\"lec-sent-ko\">숫자가 올라갈수록 그의 기대도 덩달아 올라갔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조회수라는 객관적인 수치가 늘어나자, 주인공은 이것이 곧 실제 판매로 이어질 것이라고 확신하며 기분이 고조됩니다. expectations went up은 물건이 금방 팔릴 것이라는 희망이 부풀어 오르는 상태를 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went up (관용표현): &#39;올라가다&#39;, &#39;상승하다&#39;라는 의미를 가진 구동사(phrasal verb)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">number of hits</td><td class=\"m\">조회수, 방문 횟수</td></tr><tr><td class=\"w\">expectation</td><td class=\"m\">기대, 예상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 시간이 지났고</span><span class=\"en\"><b>One hour passed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그다음은 두 시간</span><span class=\"en\"><b>then two</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 마침내 하루 온종일이</span><span class=\"en\"><b>and finally a whole day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 어떤 문자도 받지 못했다.</span><span class=\"en\"><b>but he <span class=\"grammar-hl\">received no texts</span>.</b></span></div></div><div class=\"lec-sent-ko\">한 시간이 지나고, 두 시간이 지나고, 마침내 하루가 지났지만 세윤이는 문자를 받지 못했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기대감이 최고조에 달했던 앞 문장과 대비되는 반전의 시작입니다. received no texts는 조회수와 상관없이 실제로 물건을 사겠다고 연락해 온 사람이 단 한 명도 없음을 의미하며, 시간이 흐를수록 상황이 좋지 않게 흘러가고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">received no texts (타동사): receive는 &#39;~을 받다&#39;라는 의미의 타동사이며, 부정의 형용사 no가 명사(texts)를 수식하여 문장 전체를 부정문으로 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">text</td><td class=\"m\">문자를 보내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무도 그의 자전거를 원하는 것 같지 않았다.</span><span class=\"en\"><b>Nobody <span class=\"grammar-hl\">seemed to want</span> his bike.</b></span></div></div><div class=\"lec-sent-ko\">아무도 그의 자전거를 원하지 않는 것처럼 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연락이 오지 않는 현실을 마주하며 주인공이 내린 비관적인 결론입니다. Nobody seemed to want는 많은 사람이 클릭은 해봤지만 정작 돈을 내고 살 만큼 매력을 느끼지는 못했다는 냉혹한 시장의 반응을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seemed to want (to부정사): seem의 주격 보어 역할을 하는 명사적 용법으로, &#39;~하는 것처럼 보이다&#39;라는 상태를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에 의한 새 게시물들이</span><span class=\"en\"><b><span class=\"grammar-hl\">New postings</span> by other people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 게시물을 밀어냈다</span><span class=\"en\"><b><span class=\"grammar-hl\">pushed his post</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목록 아래로.</span><span class=\"en\"><b><span class=\"grammar-hl\">down</span> the list.</b></span></div></div><div class=\"lec-sent-ko\">다른 사람들의 새 게시물이 그의 게시물을 리스트에서 밀어냈습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물건이 팔리지 않는 기술적인 배경을 설명합니다. pushed his post down the list는 새로운 판매 글이 계속 올라오는 온라인 마켓의 특성상, 시간이 흐르면서 자신의 글이 뒷페이지로 밀려나 사람들의 시야에서 완전히 사라지게 되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">New postings (동명사): post(게시하다)에 -ing가 붙어 &#39;게시물&#39;이라는 행위의 결과물을 나타내는 명사적 개념으로 쓰였다.</div><div class=\"lec-gr-item\">pushed his post down (관용표현): push A down은 &#39;A를 아래로 밀어내다&#39;라는 의미를 갖는 구동사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">post</td><td class=\"m\">게시하다, 올리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 가슴이 가라앉기 시작했다.</span><span class=\"en\"><b>His <span class=\"grammar-hl\">heart began to sink</span>.</b></span></div></div><div class=\"lec-sent-ko\">세윤이의 가슴이 내려앉기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 감정적 결말입니다. heart began to sink는 처음에 가졌던 부푼 기대와 희망이 완전히 꺾이고, 그 자리에 깊은 실망감과 낙담이 찾아왔다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">began to sink (to부정사): 타동사 begin의 목적어로 쓰인 명사적 용법이다.</div><div class=\"lec-gr-item\">heart began to sink (관용표현): &#39;낙담하다&#39; 또는 &#39;기운이 빠지다&#39;라는 의미의 비유적 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>주인공은 새 자전거를 사기 위해 기존 자전거를 온라인 중고 시장에 빠르게 매물로 올렸다.</li><li>새 자전거를 탈 생각에 부풀어 수시로 조회수를 확인하며 금방 팔릴 것이라는 큰 기대를 품었다.</li><li>그러나 시간이 흘러도 구매 문의 문자는 전혀 오지 않았고, 시장의 반응은 차가웠다.</li><li>결국 게시물마저 뒤로 밀려나자 주인공은 큰 실망감에 빠지게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The character posted a bike advertisement with great expectation but felt his heart sink because no inquiries were made despite many views.</div>\n              <div class=
