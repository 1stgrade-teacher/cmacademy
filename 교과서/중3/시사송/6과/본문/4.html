nd Growing Up<small>씁쓸하고도 달콤한 작별: 자전거 판매와 성장</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 이야기는 중고 거래 과정에서 겪는 경제적 선택과 그에 따른 심리적 변화를 다루고 있어요. 우선 내가 가진 물건에 더 높은 가치를 부여하는 보유 효과(Endowment Effect)를 이해하면 좋은데, 주인공이 자전거를 팔 때 느끼는 아쉬움은 바로 이 심리에서 비롯된 것이랍니다. 또한, 구매자와 가격을 조율하는 가격 협상(Price Negotiation)은 시장 경제의 기본 원리를 배우는 과정이며, 이를 통해 주인공은 스스로 결정을 내리고 책임지는 경제적 사회화(Economic Socialization) 단계를 거치게 되죠. 마치 아끼던 물건을 떠나보내고 새 시작을 준비하듯, 물건의 교환 가치(Exchange Value)를 직접 실현해보는 경험은 성숙한 경제 주체로 성장하는 소중한 밑거름이 된답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01가격 협상과 갈등</div><ul><li>자전거를 팔기 위해 연락을 받았으나 예상보다 낮은 가격 제안에 직면한다.</li><li>낮은 가격(lower price)을 요구하는 여러 건의 문자 메시지를 받음</li><li>처음에는 낮은 가격을 수용하기 어려워함(hard to accept)</li><li>핵심 키워드: 협상(negotiation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02거래 완료와 목표 달성</div><ul><li>결국 제안을 받아들이고 구매자를 만나 자전거를 판매하여 필요한 돈을 마련한다.</li><li>70,000원에 자전거를 판매(sold)하기로 결정함</li><li>구매자를 만나 자전거를 건네주고 대금을 받음</li><li>새 자전거를 살 수 있는 자금(money he needed)을 확보함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03복합적인 감정과 성찰</div><ul><li>익숙한 물건을 떠나보내는 슬픔과 성취에 따른 기쁨을 동시에 느낀다.</li><li>오래된 자전거와의 이별에 대한 슬픔(sad)</li><li>스스로 해냈다는 사실에 대한 기쁨(happy)</li><li>핵심 키워드: 복합적인 감정(mixed emotions)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04경험을 통한 성장</div><ul><li>이번 거래 과정을 통해 지혜를 얻고 한층 더 성숙해졌음을 깨닫는다.</li><li>판매 과정을 통해 많은 것을 배움(learned a lot)</li><li>일련의 경험을 통해 정신적으로 성장함(grown up)</li><li>핵심 키워드: 개인적 성장(personal growth)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 여러 개의</td></tr><tr><td class=\"w\">ask for</td><td class=\"m\">~을 요구하다, ~을 요청하다</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">수락하다, 받아들이다</td></tr><tr><td class=\"w\">at first</td><td class=\"m\">처음에는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hand over</td><td class=\"m\">~을 넘겨주다, ~을 건네주다</td></tr><tr><td class=\"w\">happy with</td><td class=\"m\">~에 만족하는, ~이 마음에 드는</td></tr><tr><td class=\"w\">grow up</td><td class=\"m\">성장하다, 철이 들다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이번에</span><span class=\"en\"><b>This time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 여러 통의 문자 메시지를 받았다.</span><span class=\"en\"><b>he <span class=\"grammar-hl\">got several texts</span>.</b></span></div></div><div class=\"lec-sent-ko\">이번에 그는 여러 통의 문자 메시지를 받았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 시도에서는 반응이 없었으나, This time이라는 표현을 통해 이번에는 구매 희망자들에게서 연락이 오는 진전이 있었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got several texts 3형식 구조: 주어(he) + 동사(got) + 목적어(several texts)로 이루어진 완전한 문장 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 여러 개의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">애석하게도,</span><span class=\"en\"><b>Sadly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 모두 요청했다</span><span class=\"en\"><b>they all <span class=\"grammar-hl\">asked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 낮은 가격을.</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> a lower price.</b></span></div></div><div class=\"lec-sent-ko\">애석하게도, 그들은 모두 더 낮은 가격을 요청했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연락은 많이 왔지만 구매자들이 가격을 깎아달라고 요청하면서, 주인공이 기대했던 수익과는 차이가 생겨 실망스러운 상황이 이어지고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked for (관용표현): &#39;ask for&#39;는 &#39;~을 요청하다&#39; 또는 &#39;~을 구하다&#39;라는 의미로 쓰이는 동사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 받아들이기 어려웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was hard to accept</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에는</span><span class=\"en\"><b><span class=\"grammar-hl\">at first</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 마침내</span><span class=\"en\"><b>but finally</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 자신의 자전거를 팔았다</span><span class=\"en\"><b>he sold his bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">칠만 원에.</span><span class=\"en\"><b>for 70,000 won.</b></span></div></div><div class=\"lec-sent-ko\">처음에는 받아들이기 어려웠지만, 마침내 그는 자신의 자전거를 칠만 원에 팔았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> hard to accept는 자신이 아끼던 물건의 가치를 낮게 평가받는 것에 대한 정서적 거부감을 나타내며, 결과적으로는 현실을 받아들여 거래를 성사시켰음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was hard to accept (가주어): 진주어: 문장의 주어 자리에 형식적인 주어인 가주어 It을 쓰고, 실제 주어인 진주어 to accept 이하를 문장 뒤로 보낸 구조다.</div><div class=\"lec-gr-item\">to accept (to부정사): 명사적 용법으로 쓰여 이 문장에서 실제 주어(진주어) 역할을 수행한다.</div><div class=\"lec-gr-item\">at first (관용표현): &#39;처음에는&#39;이라는 뜻을 가진 부사구로 쓰였다.</div></div>\n        <div
