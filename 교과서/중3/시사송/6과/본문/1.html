일 자전거로 등교하며 평소 자신의 자전거를 아끼고 좋아한다.</li><li>매일 자전거(bike)를 타고 등교함</li><li>현재 자전거에 대한 애정(like)</li><li>핵심 키워드: 일상(every day)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02신체 변화와 문제</div><ul><li>세윤이가 성장하면서 기존 자전거가 체격에 비해 너무 작아지는 문제가 발생한다.</li><li>키가 커지고 힘이 세짐(taller and stronger)</li><li>자전거가 너무 작아짐(too small)</li><li>크고 빠른(bigger, faster) 새 자전거를 원함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03경제적 제약</div><ul><li>새 자전거를 사고 싶어 하지만 현재 가진 돈으로는 구매가 불가능한 상황이다.</li><li>예금 계좌(savings account)의 잔액이 충분하지 않음</li><li>해결 방안에 대한 고민</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04해결책 구상</div><ul><li>기존 자전거의 상태가 좋다는 점을 이용해 이를 판매하여 자금을 마련하기로 한다.</li><li>기존 자전거 상태가 새것과 다름없음(as good as new)</li><li>자전거를 판매(sell)하기로 결심함</li><li>판매 수익을 구매 비용에 보태기(add the money)로 함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sale</td><td class=\"m\">판매, 매출</td></tr><tr><td class=\"w\">savings account</td><td class=\"m\">저축 예금 계좌</td></tr><tr><td class=\"w\">enough</td><td class=\"m\">충분한</td></tr><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기, 느닷없이</td></tr><tr><td class=\"w\">be as good as</td><td class=\"m\">~와 다름없다, ~만큼 좋다</td></tr><tr><td class=\"w\">add</td><td class=\"m\">추가하다, 더하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세윤이는</span><span class=\"en\"><b>Seyun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 자전거를 탄다</span><span class=\"en\"><b><span class=\"grammar-hl\">rides</span> his bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교까지</span><span class=\"en\"><b>to school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일.</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 매일 학교에 자전거를 타고 갑니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 세윤이의 일상적인 습관을 소개하며 이야기를 시작합니다. 자전거가 세윤이에게 없어서는 안 될 중요한 이동 수단임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rides 3인칭 단수 현재형: 주어 Seyun이 3인칭 단수이므로 일반동사 ride 뒤에 -s를 붙인 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 자신의 자전거를 좋아한다</span><span class=\"en\"><b>He likes his bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 키가 더 크고 힘이 더 세졌다</span><span class=\"en\"><b>but he is <span class=\"grammar-hl\">taller and stronger</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">올해.</span><span class=\"en\"><b>this year.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 자신의 자전거를 좋아하지만, 그는 올해 키가 더 크고 힘도 더 세졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 세윤이의 일상적인 습관을 소개하며 이야기를 시작합니다. 자전거가 세윤이에게 없어서는 안 될 중요한 이동 수단임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taller and stronger (비교급): 형용사 tall과 strong 뒤에 -er을 붙여 &#39;더 ~한&#39;이라는 의미를 나타내는 비교급 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 자전거는</span><span class=\"en\"><b>His bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 작아졌다</span><span class=\"en\"><b>has become too small</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게</span><span class=\"en\"><b>for him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 사기를 원한다</span><span class=\"en\"><b>so he wants <span class=\"grammar-hl\">to buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 크고 더 빠른 자전거를.</span><span class=\"en\"><b>a bigger, faster <span class=\"grammar-hl\">one</span>.</b></span></div></div><div class=\"lec-sent-ko\">그의 자전거는 그에게 너무 작아져서, 그는 더 크고 더 빠른 자전거를 사기를 원합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 자전거에 대한 애정을 드러내는 동시에, &#39;but&#39;을 사용하여 변화된 상황을 제시합니다. taller and stronger는 세윤이가 성장함에 따라 기존 자전거가 신체 조건에 더 이상 맞지 않게 되었음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): 타동사 wants의 목적어 역할을 하는 명사적 용법으로 쓰인 구조.</div><div class=\"lec-gr-item\">one (부정대명사): 앞서 언급된 명사 bike를 반복하지 않기 위해 대신 사용하는 대명사.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 충분한 돈을 가지고 있지 않다</span><span class=\"en\"><b>he does not have <span class=\"grammar-hl\">enough money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 예금 계좌에.</span><span class=\"en\"><b>in his <span class=\"grammar-hl\">savings account</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그는 자신의 예금 계좌에 충분한 돈을 가지고 있지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자전거를 사고 싶어 하는 마음과 대조되는 현실적인 제약인 자금 부족 문제를 던집니다. enough money는 새로운 자전거를 즉시 구매하기에는 현재 모아둔 돈이 부족한 상태라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">savings account (동명사): savings(저축/명사적 개념) + account(계좌) 구조로, 계좌의 용도나 활동을 나타내는 명사적 개념으로 쓰여 현재분사가 아닌 동명사로 본다.</div><div class=\"lec-gr-item\">enough money 형용사 enough의 위치: enough가 명사를 수식할 때는 명사(money) 앞에 위치하여 &#39;충분한 돈&#39;이라는 의미를 형성.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">savings account</td><td class=\"m\">저축 예금 계좌</td></tr><tr><td class=\"w\">enough</td><td class=\"m\">충분한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 무엇을 할 수 있을까?</span><span class=\"en\"><b><span class=\"grammar-hl\">What can he do</span>?</b></span></div></div><div class=\"lec-sent-ko\">그가 무엇을 할 수 있을까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세윤이가 마주한 난관을 강조하며, 독자에게 질문을 던져 이후에 나올 해결책에 대한 궁금증을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can he do (의문문): 의문사(What) + 조동사(can) + 주어(he) + 동사원형(do)의 어순을 가진 직접의문문 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기</span><span class=\"en\"><b>Suddenly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세윤이는 아이디어가 떠올랐다.</span><span class=\"en\"><b>Seyun <span class=\"grammar-hl\">had</span> an idea.</b></span></div></div><div class=\"lec-sent-ko\">갑자기, 세윤이는 아이디어가 떠올랐습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고민하던 상황에서 반전이 일어나는 지점입니다. had an idea는 문제 해결을 위한 창의적인 실마리를 찾았음을 의미하며 글의 분위기를 긍정적으로 바꿉니다. 7. “My old bike is almost as good as a new one. 세윤이가 떠올린 아이디어의 타당성을 뒷받침하는 근거입니다. almost as good as a new one은 비록 중고 자전거이긴 하지만 관리가 매우 잘 되어 상품 가치가 충분하다고 판단하는 대목입니다. 8. Maybe I can sell it and add the money to buy a new one.” 이야기의 결론이자 구체적인 해결 방안입니다. sell it and add the money는 부족한 예산을 중고 판매 수익으로 충당하여 경제적 문제를 스스로 해결하겠다는 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had (과거시제): 과거의 특정 시점에 일어난 일을 설명하기 위해 have의 과거형인 had를 사용한 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기, 느닷없이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“내 오래된 자전거는</span><span class=\"en\"><b>“My old bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 새것만큼 좋다.</span><span class=\"en\"><b>is almost <span class=\"grammar-hl\">as good as</span> a new <span class=\"grammar-hl\">one</span>.</b></span></div></div><div class=\"lec-sent-ko\">“내 오래된 자전거는 거의 새것과 다름없이 좋아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세윤이가 떠올린 아이디어의 타당성을 뒷받침하는 근거입니다. almost as good as a new one은 비록 중고 자전거이긴 하지만 관리가 매우 잘 되어 상품 가치가 충분하다고 판단하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as good as (관용표현): 「as + 형용사/부사의 원급 + as」 구조로 &#39;~만큼 ...한&#39;이라는 의미를 나타내는 원급 비교 표현.</div><div class=\"lec-gr-item\">one (부정대명사): 앞에 나온 a new bike의 반복을 피하기 위해 쓰인 대명사.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마</span><span class=\"en\"><b>Maybe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 그것을 팔 수 있을 것이다</span><span class=\"en\"><b>I can sell it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 돈을 보탤 수 있을 것이다</span><span class=\"en\"><b>and add the money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새것을 사기 위해.”</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy</span> a new <span class=\"grammar-hl\">one</span>.”</
