s=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 인식</div><ul><li>자전거가 팔리지 않자 자신의 게시물에 문제가 있음을 깨닫고 해결책을 찾는다.</li><li>판매 게시물(posting)이 매력적이지 않다는 의구심을 가짐</li><li>인터넷 검색을 통해 온라인 판매 요령(tips)을 찾아봄</li><li>핵심 키워드: 매력적인(attractive)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실패 원인 분석</div><ul><li>기존 게시물의 문제점인 정보 부족과 높은 가격을 객관적으로 파악한다.</li><li>성급함(hasty)과 지나친 욕심(greedy)이 원인이었음을 깨달음</li><li>잠재적 구매자에게 충분한 정보(information)를 주지 않음</li><li>경쟁 매물 대비 가격(price)이 너무 높게 책정됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03게시물 개선 작업</div><ul><li>분석한 내용을 바탕으로 시각 자료와 설명을 보강하여 새 글을 준비한다.</li><li>자전거에 대한 더 상세한 설명(description)을 작성함</li><li>다양한 각도(angles)에서 찍은 사진(photos)을 추가함</li><li>핵심 키워드: 새로운 게시물(new posting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04상세 정보와 적정 가격 제시</div><ul><li>구매자가 신뢰할 수 있는 구체적인 사양과 합리적인 가격을 최종 공지한다.</li><li>자전거의 우수한 상태(excellent condition)와 보관 장소 명시</li><li>적정 사용 연령대와 80,000원이라는 구체적인 가격(price) 제시</li><li>핵심 키워드: 구체적인 정보(details)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">posting</td><td class=\"m\">게시물, 포스팅</td></tr><tr><td class=\"w\">attractive</td><td class=\"m\">매력적인, 눈길을 끄는</td></tr><tr><td class=\"w\">search for</td><td class=\"m\">~을 찾다, ~을 검색하다</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr><tr><td class=\"w\">hasty</td><td class=\"m\">성급한, 서두르는</td></tr><tr><td class=\"w\">greedy</td><td class=\"m\">탐욕스러운, 욕심 많은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">compared to</td><td class=\"m\">~와 비교하여</td></tr><tr><td class=\"w\">description</td><td class=\"m\">설명, 묘사</td></tr><tr><td class=\"w\">angle</td><td class=\"m\">각도, 관점</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">상태, 조건</td></tr><tr><td class=\"w\">just like</td><td class=\"m\">꼭 ~처럼, ~과 흡사한</td></tr><tr><td class=\"w\">scratch</td><td class=\"m\">흠집, 긁힌 자국</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“무엇이 잘못되었지</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What’s wrong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 게시물에?</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> my <span class=\"grammar-hl\">posting</span>?</b></span></div></div><div class=\"lec-sent-ko\">‘내 포스팅에 무슨 문제가 있지?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 시작 부분으로, 온라인 장터에 올린 자전거가 팔리지 않아 고민하는 주인공의 심정을 보여줍니다. What’s wrong with는 자전거 자체가 아니라 자신이 올린 판매글의 형식이나 내용에 문제가 있음을 직감하고 원인을 찾으려는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What’s wrong with (관용표현): &#39;~에 무엇이 잘못되었나/문제가 있나&#39;라는 의미로 상태나 문제점을 물을 때 사용하는 숙어.</div><div class=\"lec-gr-item\">posting (동명사): 전치사(with)의 목적어로 사용되어 &#39;게시물&#39; 또는 &#39;게시하는 것&#39;이라는 명사적 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">posting</td><td class=\"m\">게시물, 포스팅</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 자전거가</span><span class=\"en\"><b>Is my bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분히 매력적이지 않은가?”</span><span class=\"en\"><b>not <span class=\"grammar-hl\">attractive enough</span>?”</b></span></div></div><div class=\"lec-sent-ko\">내 자전거가 충분히 매력적이지 못한가?’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 가졌던 의문을 해결하기 위해 구체적인 행동에 나서는 단계입니다. tips on how to sell online은 단순히 물건을 올리는 법이 아니라, 구매자의 마음을 사로잡는 효과적인 판매 전략을 찾아보았음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">attractive enough (관용표현): &#39;형용사 + enough&#39; 구조로 &#39;충분히 ~한&#39;이라는 의미를 나타내며, enough가 부사로서 형용사 attractive를 뒤에서 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attractive</td><td class=\"m\">매력적인, 눈길을 끄는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 검색했다</span><span class=\"en\"><b>He searched</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인터넷에서</span><span class=\"en\"><b>on the Internet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조언을 위해</span><span class=\"en\"><b>for tips</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온라인에서 판매하는 방법에 대한</span><span class=\"en\"><b>on <span class=\"grammar-hl\">how to sell</span> online.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 온라인에서 판매하는 방법에 대한 조언을 찾기 위해 인터넷을 검색했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 가졌던 의문을 해결하기 위해 구체적인 행동에 나서는 단계입니다. tips on how to sell online은 단순히 물건을 올리는 법이 아니라, 구매자의 마음을 사로잡는 효과적인 판매 전략을 찾아보았음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to sell (관용표현): 의문사 + to부정사 구조로 &#39;~하는 방법&#39; 또는 &#39;어떻게 ~할지&#39;라는 의미의 명사구 역할을 하며 전치사 on의 목적어로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 깨달았다</span><span class=\"en\"><b>he realized</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 무엇을 잘못했는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">what he had done wrong</span>.</b></span></div></div><div class=\"lec-sent-ko\">곧 그는 자신의 잘못을 깨달았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정보를 찾아본 결과, 자신의 이전 방식에 문제가 있었음을 인지하는 전환점입니다. realized what he had done wrong은 인터넷에서 찾은 성공적인 판매 사례들과 자신의 게시물을 비교해 보고 객관적인 문제점을 찾아냈다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what he had done wrong (간접의문문): 의문사(what) + 주어(he) + 동사(had done) 어순의 명사절로 realized의 목적어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 ~한 상태였다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">had been</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 성급하고 너무 욕심이 많은</span><span class=\"en\"><b>too hasty and too greedy.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 너무 성급했고 너무 욕심이 많았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신이 범한 실수의 근본적인 원인을 성격과 태도 측면에서 분석하는 문장입니다. too hasty and too greedy는 정성 들여 글을 쓰기보다 빨리 팔아버리려는 조급함과, 물건의 가치에 비해 높은 가격을 받으려 했던 마음을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had been (과거완료): had + p.p. 형태로, 깨달은 시점(realized)보다 더 이전의 상태를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hasty</td><td class=\"m\">성급한, 서두르는</td></tr><tr><td class=\"w\">greedy</td><td class=\"m\">탐욕스러운, 욕심 많은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 주지 않았다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">had not given</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분한 정보를</span><span class=\"en\"><b><span class=\"grammar-hl\">enough information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구매 가능성이 있는 사람들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> the possible buyers.</b></span></div></div><div class=\"lec-sent-ko\">그는 구매 가능성이 있는 사람들에게 충분한 정보를 주지 않았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;서둘렀다&#39;는 표현에 대한 구체적인 근거입니다. not given enough information은 구매자가 자전거의 상태를 판단하는 데 필요한 세부 사항들을 귀찮아서 생략해버렸음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had not given enough information to (관용표현): &#39;give + 목적어 + to + 대상&#39;의 3형식 구조로, 4형식(give A B)을 전치사 to를 이용해 전환한 형태임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 자전거들과 비교했을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when compared</span> to other bicycles,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 가격은 너무 높았다.</span><span class=\"en\"><b>his price was too high.</b></span></div></div><div class=\"lec-sent-ko\">또한, 다른 자전거들과 비교했을 때 그의 가격은 너무 높았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;욕심을 부렸다&#39;는 표현에 대한 구체적인 근거입니다. compared to other bicycles는 시장 조사를 하지 않아 비슷한 사양의 다른 중고 자전거보다 비싸게 가격을 책정했음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when compared (분사구문): 접속사(when)를 명시한 과거분사 구문으로, 주절의 주어(his price)가 비교되는 대상이므로 수동 의미의 과거분사를 씀. (원래 절: when it was compared to other bicycles)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">compared to</td><td class=\"m\">~와 비교하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 새 게시물을 작성했다</span><span class=\"en\"><b>He wrote a new <span class=\"grammar-hl\">posting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자전거에 대한 더 긴 묘사가 있는</span><span class=\"en\"><b>with a longer description of the bike.</b></span></div></div><div class=\"lec-sent-ko\">세윤이는 자신의 자전거에 대한 더 긴 묘사가 있는 새 게시물을 작성했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 깨달은 바를 바탕으로 문제를 수정하는 과정입니다. longer description은 단순히 글자 수가 많아진 것이 아니라, 구매자가 궁금해할 만한 관리 상태나 특징을 상세히 적었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">posting (동명사): 문장에서 &#39;게시물&#39;이라는 의미의 명사로 사용되었으며, 동사 write의 목적어인 a new posting의 핵심 요소임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">posting</td><td class=\"m\">게시물, 포스팅</td></tr><tr><td class=\"w\">description</td><td class=\"m\">설명, 묘사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 더 많은 사진들을 첨부했다</span><span class=\"en\"><b>He added more photos</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 자전거를 보여 주기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to show</span> his bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 각도에서</span><span class=\"en\"><b>from different angles.</b></span></div></div><div class=\"lec-sent-ko\">그는 자신의 자전거를 다른 각도에서 보여 주기 위해서 더 많은 사진들을 첨부했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시각적인 정보를 보강하는 구체적인 개선책입니다. from different angles는 자전거의 전체적인 모습뿐만 아니라 구매자가 꼼꼼히 확인하고 싶어 할 세부 부위까지 투명하게 공개하여 신뢰를 높이려 했다는 뜻입니다. 9. “Twenty-four inch bicycle. Excellent condition. Always kept indoors. Rides just like new. Very few scratches. Good for someone 12-14 years old. 80,000 won.” 개선된 판매글의 실제 내용이며 글의 결론에 해당합니다. Always kept indoors나 Rides just like new 같은 표현은 구매자가 매력을 느낄 만한 구체적인 장점을 강조한 것이며, 마지막에 적절한 가격을 제시함으로써 판매 확률을 높였음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to show (to부정사): 부사적 용법(목적)으로 &#39;~하기 위하여&#39;라는 의미로 해석되며 동사 added의 목적을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">angle</td><td class=\"m\">각도, 관점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“24인치 자전거.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Twenty-four inch bicycle</span>.</b></span></div></div><div class=\"lec-sent-ko\">“24인치 자전거.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Twenty-four inch bicycle (관용표현): &#39;숫자-단위명사(단수)-명사&#39; 구조로 쓰여 bicycle을 수식하는 형용사적 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">훌륭한 상태.</span><span class=\"en\"><b><span class=\"grammar-hl\">Excellent condition</span>.</b></span></div></div><di
