발견</li><li>보기스는 속마음을 숨기고 가짜라고 거짓말함</li><li>핵심 키워드: 18세기 가구(eighteenth-century furniture), 거짓말(lie)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03거래와 보기스의 착각</div><ul><li>보기스는 가구의 다리만 필요하다며 주인과 낮은 가격에 협상을 시도했다.</li><li>복제품(reproduction)이라며 가치를 낮게 평가함</li><li>테이블을 자동차에 싣기 어렵다는 문제 발생</li><li>핵심 키워드: 협상(negotiation), 복제품(reproduction)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04예기치 못한 결말</div><ul><li>주인은 보기스의 의도를 오해하여 가구의 다리를 직접 잘라버렸다.</li><li>주인의 호의로 가구 다리가 잘림(cut off the legs)</li><li>보물이었던 가구의 가치가 순식간에 사라짐</li><li>핵심 키워드: 톱(saw), 호의(favor)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">antique</td><td class=\"m\">골동품의, 옛날의</td></tr><tr><td class=\"w\">dealer</td><td class=\"m\">상인, 중개인</td></tr><tr><td class=\"w\">be known for</td><td class=\"m\">~로 유명하다</td></tr><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 귀중한</td></tr><tr><td class=\"w\">take advantage of</td><td class=\"m\">~을 이용해 먹다, 악용하다</td></tr><tr><td class=\"w\">priceless</td><td class=\"m\">매우 귀중한, 값을 매길 수 없는</td></tr><tr><td class=\"w\">reproduction</td><td class=\"m\">복제품</td></tr><tr><td class=\"w\">be worth</td><td class=\"m\">~의 가치가 있다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attach</td><td class=\"m\">붙이다, 첨부하다</td></tr><tr><td class=\"w\">I’m afraid</td><td class=\"m\">유감스럽게도 (~하다)</td></tr><tr><td class=\"w\">can’t help -ing</td><td class=\"m\">~하지 않을 수 없다</td></tr><tr><td class=\"w\">what if</td><td class=\"m\">~하면 어쩌지?</td></tr><tr><td class=\"w\">saw</td><td class=\"m\">톱</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">호의, 친절</td></tr><tr><td class=\"w\">charge</td><td class=\"m\">(요금을) 청구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 운 좋은 일요일에,</span><span class=\"en\"><b><span class=\"grammar-hl\">One Lucky Sunday</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시릴 보기스는</span><span class=\"en\"><b><span class=\"grammar-hl\">Cyril Boggis</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">골동품 가구 상인이</span><span class=\"en\"><b>an antique furniture dealer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던의.</span><span class=\"en\"><b>in London.</b></span></div></div><div class=\"lec-sent-ko\">(어느 운 좋은 일요일에, 시릴 보기스는 런던의 골동품 가구 상인이었다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 시릴 보기스의 직업을 소개하며 이야기가 시작됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">One Lucky Sunday Cyril Boggis was 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">antique</td><td class=\"m\">골동품의, 옛날의</td></tr><tr><td class=\"w\">dealer</td><td class=\"m\">상인, 중개인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was known for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 물건을 사는 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">buying good things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮은 가격에</span><span class=\"en\"><b>at a low price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그다음</span><span class=\"en\"><b>and then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 파는 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">selling them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 가격에.</span><span class=\"en\"><b>at a high price.</b></span></div></div><div class=\"lec-sent-ko\">그는 좋은 물건을 낮은 가격에 사서 높은 가격에 파는 것으로 유명했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 장사 방식을 설명합니다. 이는 이후 그가 사람들의 무지를 이용해 이득을 취하는 행위의 배경이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was known for (수동태): be동사(was)+p.p.(known) 구조. know는 타동사(기본구조: know + O)인데 목적어가 없어서 수동구조 was known으로 쓴다.</div><div class=\"lec-gr-item\">buying good things (동명사): 전치사(for)의 목적어 자리에 쓰인 동명사(buying)이다.</div><div class=\"lec-gr-item\">selling them (동명사): 전치사(for)의 목적어 자리에 병렬로 연결된 동명사(selling)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게 물었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">asked him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 가구를 어디서 구했는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">where he had got the furniture</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지</span><span class=\"en\"><b>just</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다,</span><span class=\"en\"><b>said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“비밀이에요.”라고.</span><span class=\"en\"><b>“It’s a secret.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그에게 가구를 어디에서 구했는지 물었지만, 그는 “그건 비밀이에요.”라고만 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> secret은 사전적으로 &#39;비밀&#39;이라는 뜻이지만, 여기서는 자신의 부당한 이득 취득 방식이 알려질까 봐 숨기는 비겁한 태도를 의미합니다. 자신의 이익을 지키기 위해 정보를 철저히 감추는 그의 성격을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked him (5형식(SVOC)): ask + O + toV 구조에서 발전하여, 여기서는 ask + O + 간접의문문 구조로 쓰였다.</div><div class=\"lec-gr-item\">where he had got the furniture (간접의문문): 의문사(where) + 주어(he) + 동사(had got)의 어순을 갖추어 asked의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보기스 씨의 비밀은</span><span class=\"en\"><b><span class=\"grammar-hl\">Mr. Boggis’ secret</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간단했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">simple.</span></b></span></div></div><div class=\"lec-sent-ko\">Boggis 씨의 비밀은 단순했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 그의 비밀스러운 영업 방식이 무엇인지 구체적으로 밝히기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Mr. Boggis’ secret was simple. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b><span class=\"grammar-hl\">He</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가서</span><span class=\"en\"><b><span class=\"grammar-hl\">went to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 마을들에</span><span class=\"en\"><b><span class=\"grammar-hl\">small towns</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매주 일요일마다</span><span class=\"en\"><b><span class=\"grammar-hl\">every</span> Sunday</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b>and</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두드렸다</span><span class=\"en\"><b>knocked on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문을.</span><span class=\"en\"><b>doors.</b></span></div></div><div class=\"lec-sent-ko\">그는 매주 일요일에 작은 마을들을 방문해서 문을 두드렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대도시보다 정보가 부족한 시골 마을을 표적으로 삼는 그의 치밀함을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He went to small towns every 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 말했다</span><span class=\"en\"><b>told people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 가구 상인이라는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that he was a furniture dealer</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 사람들에게 자신이 가구 판매상이라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 직업을 밝혀 상대를 안심시킨 뒤, 상대의 가구에 대한 평가를 왜곡하려는 의도가 깔려 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that he was a furniture dealer (명사절(that절)): told(수여동사)의 직접목적어로 쓰인 that절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dealer</td><td class=\"m\">상인, 중개인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몰랐는데</span><span class=\"en\"><b>didn’t know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들의 물건이 얼마나 가치 있는지라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">how valuable their things were</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>so</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보기스 씨는</span><span class=\"en\"><b>Mr. Boggis</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이용했다</span><span class=\"en\"><b>took advantage of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을.</span><span class=\"en\"><b>them.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 자신들의 물건이 얼마나 값진 것인지 몰랐으므로 Boggis 씨는 그들을 이용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> take advantage of는 사전적으로 &#39;이용하다&#39;이지만, 여기서는 정보의 불균형을 악용하여 상대의 소중한 재산을 헐값에 가로채는 부도덕한 행위를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how valuable their things were (간접의문문): 의문사구(how valuable) + 주어(their things) + 동사(were)의 어순으로 know의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 귀중한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수 있었다</span><span class -gr-item\">had been cut off (수동태): 과거완료 수동태(had been+p.p.) 구조. cut은 타동사(기본구조: cut + O)인데 목적어가 없어서 수동구조 had been cut으로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">favor</td><td class=\"m\">호의, 친절</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 52 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;이것에 대해서는 비용을 청구하지 않겠네,&quot; / 라고</span><span class=\"en\"><b><span class=\"grammar-hl\">I won’t charge you for this,”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">러민스는 말했다.</span><span class=\"en\"><b>said Rummins.</b></span></div></div><div class=\"lec-sent-ko\">“이것에 대해 비용을 청구하지는 않을게요.&quot; Rummins가 말했다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I won’t charge you for this,” 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">charge</td><td class=\"m\">(요금을) 청구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 53 / 53</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보기스 씨는</span><span class=\"en\"><b><span class=\"grammar-hl\">Mr. Boggis</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 충격을 받아서</span><span class=\"en\"><b><span class=\"grammar-hl\">was so shocked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무 말도 할 수 없었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> he couldn’t say anything.</b></span></div></div><div class=\"lec-sent-ko\">Boggis 씨는 너무 충격을 받아서 아무 말도 할 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사기꾼이 자신의 거짓말에 스스로 당하는 권선징악의 결말을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Mr. Boggis was so shocked that 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>골동품 상인 보기스는 시골 마을을 돌며 무지한 사람들의 가구를 헐값에 사들이는 사기꾼이다.</li><li>어느 날, 가치가 엄청난 18세기 탁자를 발견하고는 복제품이라고 속여 헐값에 사려고 한다.</li><li>보기스는 자신이 그 탁자의 다리만 필요하다며 거짓말을 한다.</li><li>주인인 럼민스는 그 거짓말을 역이용하여 탁자의 다리를 미리 잘라버린다.</li><li>결과적으로 보기스는 귀한 탁자를 망친 채 아무 말도 하지 못하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The dealer attempts to buy a priceless table by lying about its value, yet he fails to get what he wanted because the owners mistakenly cut the legs off.</div>\n              <div class=\"lec-final-sum-ko\">상인은 탁자의 가치를 속여 비싼 물건을 싸게 사려 하지만, 주인이 다리를 잘라버리는 바람에 원하는 결과를 얻지 못한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"audio":"./full_audio/9.mp3","hl":"main"},{"audio":"./full_audio/10.mp3","hl":"meaning"},{"audio":"./full_audio/11.mp3","hl":"grammar"}],[{"audio":"./full_audio/12.mp3","hl":"main"},{"audio":"./full_audio/13.mp3","hl":"meaning"},{"audio":"./full_audio/14.mp3","hl":"grammar"}],[{"audio":"./full_audio/15.mp3","hl":"main"},{"audio":"./full_audio/16.mp3","hl":"meaning"},{"audio":"./full_audio/17.mp3","hl":"grammar"}],[{"audio":"./full_audio/18.mp3","hl":"main"},{"audio":"./full_audio/19.mp3","hl":"meaning"},{"audio":"./full_audio/20.mp3","hl":"grammar"}],[{"audio":"./full_audio/21.mp3","hl":"main"},{"audio":"./full_audio/22.mp3","hl":"meaning"},{"audio":"./ful
