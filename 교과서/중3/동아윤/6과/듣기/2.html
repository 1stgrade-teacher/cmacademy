lecturePlayer(document.getElementById("app"),{"brand":"C. Listen and Check","title":"중3 동아(윤) 6과 대화문 해설 강의","audioDir":"2_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">추천 요청하기와 선호에 대해 묻고 답하기\u003c/div>\u003ch1>중3 동아(윤) 6과 대화문 해설 강의\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>한 학생이 곱슬머리를 펴고 싶어 좋은 미용실을 추천받고, Styles Studio와 Hair Castle 두 곳의 장점을 비교한 뒤 더 선호하는 곳을 묻고 답하는 상황입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 동아 윤정미 교과서 육과 대화문을 함께 공부해 볼 거예요. 한 학생이 머리 스타일을 바꾸고 싶어서 좋은 미용실을 추천받고, 두 곳 중 어느 곳을 더 선호하는지 이야기하는 상황이에요. 오늘은 추천을 요청하는 표현과 선호를 묻고 답하는 표현을 자세히 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G1\u003c/span>\u003cdiv class=\"d-en\">I think my hair is too curly. I want to straighten my hair. Can you recommend a good place?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">G2\u003c/span>\u003cdiv class=\"d-en\">Sure. I know two places, Styles Studio and Hair Castle.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G1\u003c/span>\u003cdiv class=\"d-en\">Is there any difference between the two?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">G2\u003c/span>\u003cdiv class=\"d-en\">Well, Styles Studio provides free treatment to keep your hair healthy.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G1\u003c/span>\u003cdiv class=\"d-en\">That's great. What about Hair Castle?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">G2\u003c/span>\u003cdiv class=\"d-en\">Hair Castle doesn't provide treatment for free, but they give student discounts.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">G1\u003c/span>\u003cdiv class=\"d-en\">Okay. Which do you prefer?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">G2\u003c/span>\u003cdiv class=\"d-en\">I prefer Styles Studio to Hair Castle. It's important for me to get hair treatment regularly.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"I think my hair is too curly. I want to straighten my hair. Can you recommend a good place?","hl":"r-0"},{"n":3,"text":"Sure. I know two places, Styles Studio and Hair Castle.","hl":"r-1"},{"n":4,"text":"Is there any difference between the two?","hl":"r-2"},{"n":5,"text":"Well, Styles Studio provides free treatment to keep your hair healthy.","hl":"r-3"},{"n":6,"text":"That's great. What about Hair Castle?","hl":"r-4"},{"n":7,"text":"Hair Castle doesn't provide treatment for free, but they give student discounts.","hl":"r-5"},{"n":8,"text":"Okay. Which do you prefer?","hl":"r-6"},{"n":9,"text":"I prefer Styles Studio to Hair Castle. It's important for me to get hair treatment regularly.","hl":"r-7"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">추천 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you recommend + 명사?\u003c/div>\u003cdiv class=\"d-mean\">~을 추천해 줄 수 있니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I think my hair is too curly. I want to straighten my hair. Can you recommend a good place?\u003c/div>\u003cdiv class=\"d-exp\">상대에게 어떤 장소나 물건을 추천해 달라고 할 때 쓰는 표현이에요. \u003cb class=\"key\">Can you recommend\u003c/b> 뒤에는 추천받고 싶은 대상이 오고, 공손하게 말할 때는 \u003cb class=\"key\">Could you recommend\u003c/b>를 써요. 대답으로는 \u003cb class=\"key\">I'd recommend\u003c/b>를 사용할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you recommend + 명사?\u003c/li>\u003cli>Can you suggest + 명사?\u003c/li>\u003cli>Do you know a good place for + 명사?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. I know + 명사.\u003c/li>\u003cli>I'd recommend + 명사.\u003c/li>\u003cli>How about + 명사?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"추천을 요청할 때는 Can you recommend a good place?라고 말해요. 뜻은 좋은 곳을 추천해 줄 수 있냐는 거예요. Can you recommend 뒤에 추천받고 싶은 대상을 붙이면 된다는 점을 기억해 주세요.","hl":"key"},{"n":11,"text":"같은 뜻으로 Could you recommend a good place?라고 더 공손하게 말할 수 있어요. Can you suggest a good place?도 같은 의도예요. Do you know a good place for that?처럼 길게 말할 수도 있어요.","hl":"alts"},{"n":12,"text":"대답으로는 Sure. I know two places.처럼 말할 수 있어요. I'd recommend Styles Studio.라고 추천할 수도 있고, How about Styles Studio?라고 물어볼 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">선호에 대해 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Which do you prefer, A or B?\u003c/div>\u003cdiv class=\"d-mean\">A와 B 중에서 어느 것을 더 선호하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Okay. Which do you prefer?\u003c/div>\u003cdiv class=\"d-exp\">두 가지 선택지 중 더 좋아하는 것을 물을 때 \u003cb class=\"key\">Which do you prefer\u003c/b>를 사용해요. 정해진 범위 A와 B 둘 중에서의 선호를 묻는 표현이며, \u003cb class=\"key\">prefer A to B\u003c/b>는 A를 B보다 더 선호한다는 뜻이에요. 답할 때는 \u003cb class=\"key\">I like A better\u003c/b>나 I think A is better than B도 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which do you like better, A or B?\u003c/li>\u003cli>Which would you choose, A or B?\u003c/li>\u003cli>Do you like A better than B?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I prefer A to B.\u003c/li>\u003cli>I like A better.\u003c/li>\u003cli>I think A is better than B.\u003c/li>\u003cli>I'd prefer A.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"선호를 물을 때는 Which do you prefer, Styles Studio or Hair Castle?이라고 말해요. 뜻은 Styles Studio와 Hair Castle 중에서 어느 것을 더 선호하냐는 거예요. 정해진 두 가지 중에서 더 좋아하는 것을 고르게 하는 질문이에요.","hl":"key"},{"n":14,"text":"Which do you like better, Styles Studio or Hair Castle?도 같은 뜻이에요. Which would you choose, Styles Studio or Hair Castle?처럼 선택을 묻는 말로 바꿀 수 있어요. Do you like Styles Studio better than Hair Castle?이라고 물어도 자연스러워요.","hl":"alts"},{"n":15,"text":"대답은 I prefer Styles Studio to Hair Castle.이라고 할 수 있어요. I like Styles Studio better.나 I think Styles Studio is better than Hair Castle.도 좋아요. I'd prefer Styles Studio.처럼 짧게 답할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 8\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G1\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">I think my hair is too curly. I want to straighten my hair. \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Can you recommend a good place?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">내 머리가 너무 곱슬거리는 것 같아. 머리를 펴고 싶어. 좋은 곳을 추천해 줄 수 있니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>상대에게 좋은 장소를 추천해 달라고 할 때 쓰는 표현이에요. \u003cb class=\"key\">Can you recommend\u003c/b> 뒤에 추천받고 싶은 대상을 붙여요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Could you recommend a good place?\u003c/span>\u003cspan>Can you suggest a good place?\u003c/span>\u003cspan>Do you know a good place for that?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G2\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I know two places\u003c/span>, Styles Studio and Hair Castle.\u003c/div>\u003cdiv class=\"d-ko\">물론이지. 나는 두 곳을 알아. Styles Studio와 Hair Castle이야.\u003c/div>\ 4\u003c/span>\u003cspan class=\"tgt\">to keep your hair healthy\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">음, Styles Studio는 머리를 건강하게 유지해 주는 무료 트리트먼트를 제공해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">to부정사의 형용사적 용법\u003c/b>으로, to keep은 앞의 명사 treatment를 수식해요. keep은 \u003cb class=\"key\">keep+목적어+형용사\u003c/b> 형태로 쓰여 ‘~을 ...한 상태로 유지하다’라는 뜻을 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"세 번째 문장은 Is there any difference between the two?예요. 그 두 곳 사이에 어떤 차이가 있냐고 묻는 말이에요. Is there는 이 있니라는 뜻이고, difference는 차이라는 뜻이에요. What's the difference between the two?라고 바꿔 말할 수도 있어요.","hl":"l-0"},{"n":19,"text":"네 번째 문장은 Well, Styles Studio provides free treatment to keep your hair healthy.예요. Styles Studio는 머리를 건강하게 유지해 주는 무료 트리트먼트를 제공한다는 뜻이에요. 여기서 to keep your hair healthy는 앞의 treatment를 꾸며 주는 to부정사의 형용사적 용법이고, keep은 목적어 다음에 형용사를 써서 그 상태를 유지하다는 뜻을 나타내요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 8\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G1\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">That's great. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">What about Hair Castle?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그거 좋네. Hair Castle은 어때?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">What about ~?\u003c/b>은 ‘~은 어때?’라고 다른 대상에 대해 물을 때 쓰는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G2\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Hair Castle doesn't provide treatment \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">for free\u003c/span>, but they give \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">student discounts\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">Hair Castle은 무료로 트리트먼트를 제공하지 않아. 하지만 학생 할인을 해 줘.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">for free\u003c/b>는 ‘공짜로, 무료로’라는 뜻이에요. doesn't provide treatment for free는 ‘트리트먼트를 무료로 제공하지 않는다’는 말이 됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">student discount\u003c/b>는 ‘학생 할인’이라는 뜻이에요. give student discounts는 ‘학생 할인을 해 주다’로 기억해 두세요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"다섯 번째 문장은 That's great. What about Hair Castle?이에요. 그거 좋다며 Hair Castle은 어떠냐고 묻는 말이에요. What about 다음에 다른 대상을 붙이면 그 대상은 어떠냐고 물을 수 있어요.","hl":"l-0"},{"n":21,"text":"여섯 번째 문장은 Hair Castle doesn't provide treatment for free, but they give student discounts.예요. Hair Castle은 트리트먼트를 무료로 제공하지 않지만 학생 할인을 해 준다는 뜻이에요. for free는 공짜로, 무료로라는 뜻이고, student discounts는 학생 할인이라는 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 8\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G1\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Okay. \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Which do you prefer?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">알겠어. 어느 쪽을 더 선호해?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>두 가지 중 더 좋아하는 것을 물을 때 쓰는 표현이에요. \u003cb class=\"key\">Which do you prefer\u003c/b>는 ‘어느 것을 더 선호하니?’라는 뜻으로, 선택 가능한 것들 중 더 선호하는 것을 물어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which do you like better?\u003c/span>\u003cspan>Which would you choose?\u003c/span>\u003cspan>Do you prefer Styles Studio or Hair Castle?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G2\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">I prefer Styles Studio to Hair Castle.\u003c/span> \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">It's important for me to get hair treatment regularly.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나는 Hair Castle보다 Styles Studio를 더 선호해. 나는 정기적으로 머리 트리트먼트를 받는 것이 중요해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">prefer A to B\u003c/b>는 ‘A를 B보다 더 선호하다’라는 뜻이에요. 여기서는 Styles Studio를 Hair Castle보다 더 좋아한다는 의미예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">가주어\u003c/b> It과 \u003cb class=\"key\">진주어\u003c/b> to get 이하가 쓰인 구문이에요. 진주어인 to부정사가 길어서 뒤로 보내고 주어 자리에 가주어 It을 두며, It은 따로 해석하지 않아요. 이때 to부정사의 의미상의 주어는 \u003cb class=\"key\">for+목적격\u003c/b>으로 표시해요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like Styles Studio better than Hair Castle.\u003c/span>\u003cspan>I'd choose Styles Studio over Hair Castle.\u003c/span>\u003cspan>For me, Styles Studio is better than Hair Castle.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"일곱 번째 문장은 Okay. Which do you prefer?예요. 알겠다며 어느 쪽을 더 선호하냐고 묻는 말이에요. Which do you prefer?는 두 가지 중 어느 것을 더 좋아하냐는 뜻이고, Which do you like better?나 Which would you choose?로도 말할 수 있어요.","hl":"l-0"},{"n":23,"text":"여덟 번째 문장은 I prefer Styles Studio to Hair Castle. It's important for me to get hair treatment regularly.예요. 나는 Hair Castle보다 Styles Studio를 더 선호하고, 정기적으로 머리 트리트먼트를 받는 것이 중요하다는 뜻이에요. prefer A to B는 A를 B보다 더 선호하다는 뜻이고, It's important for me to get hair treatment regularly에서는 It이 가주어, to get 이하가 진주어예요. It은 따로 해석하지 않고, for me는 to부정사의 의미상의 주어로 이해하면 돼요. I like Styles Studio better than Hair Castle.이나 I'd choose Styles Studio over Hair Castle.처럼 같은 의도로 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 표현과 같은 의도로 쓰인 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Can you recommend a good place?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Could you recommend a good place?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Do you know how to get to a good place?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Are you good at this place?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Can you visit a good place?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Could you recommend a good place?\u003c/span>\u003cdiv class=\"g-exp\">[[Can you recommend]]는 ‘추천해 줄 수 있니?’라는 뜻이에요. 공손하게 말할 때는 [[Could you recommend]]를 써서 같은 의도를 나타낼 수 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"다음 표현과 같은 의도로 쓰인 보기를 골라 보세요. 문장은 Can you recommend a good place?입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 첫 번째 보기예요. Could you recommend a good place?는 Can you recommend a good place?를 더 공손하게 바꾼 표현이에요. 나머지 보기는 추천을 요청하는 뜻이 아니에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Which do you ____, Styles Studio or Hair Castle?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>prefer\u003c/button>\ eatment 다음에 빈칸이 있고, keep your hair healthy가 이어집니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 첫 번째 보기 to예요. to keep은 앞의 treatment를 꾸며 주는 to부정사의 형용사적 용법이에요. 그래서 머리를 건강하게 유지해 주는 트리트먼트라는 뜻이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화를 자연스러운 순서로 배열하세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">A. Is there any difference between the two? / B. I think my hair is too curly. I want to straighten my hair. Can you recommend a good place? / C. Well, Styles Studio provides free treatment to keep your hair healthy. / D. Sure. I know two places, Styles Studio and Hair Castle.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">B-D-A-C\u003c/span>\u003cdiv class=\"g-exp\">먼저 추천을 요청하고, 두 곳을 안다는 대답을 들은 뒤 두 곳의 차이를 묻고, Styles Studio의 장점을 듣는 순서가 자연스러워요. 따라서 B-D-A-C의 순서예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"다음 대화를 자연스러운 순서로 배열해 보세요. 첫 번째 보기는 Is there any difference between the two?이고, 두 번째 보기는 I think my hair is too curly. I want to straighten my hair. Can you recommend a good place?예요. 세 번째 보기는 Well, Styles Studio provides free treatment to keep your hair healthy.이고, 네 번째 보기는 Sure. I know two places, Styles Studio and Hair Castle.입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 두 번째 보기, 네 번째 보기, 첫 번째 보기, 세 번째 보기 순서예요. 먼저 추천을 요청하고, 두 곳을 안다는 대답을 들은 뒤 두 곳의 차이를 묻고, Styles Studio의 장점을 듣는 흐름이 자연스럽기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Styles Studio provides free treatment.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Hair Castle provides free treatment.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Styles Studio gives student discounts.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Hair Castle doesn't give student discounts.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Both places provide free treatment.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Styles Studio provides free treatment.\u003c/span>\u003cdiv class=\"g-exp\">대화에서 Styles Studio는 [[free treatment]]를 제공한다고 했어요. Hair Castle은 무료 트리트먼트 대신 [[student discounts]]를 준다고 했으므로 다른 보기는 내용과 맞지 않아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"대화의 내용과 일치하는 보기를 골라 보세요. 첫 번째 보기는 Styles Studio provides free treatment. 두 번째 보기는 Hair Castle provides free treatment. 세 번째 보기는 Styles Studio gives student discounts. 네 번째 보기는 Hair Castle doesn't give student discounts. 다섯 번째 보기는 Both places provide free treatment.입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":6},{"n":38,"text":"정답은 첫 번째 보기예요. 대화에서 Styles Studio provides free treatment to keep your hair healthy.라고 했어요. Hair Castle은 무료 트리트먼트를 제공하지 않고 학생 할인을 준다고 했으므로 나머지 보기는 맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">추천 요청하기와 선호에 대해 묻고 답하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">Can you recommend + 명사?\u003c/b>는 상대에게 추천을 요청할 때 쓰는 표현이에요.\u003c/li>\u003cli>\u003cb class=\"key\">Which do you prefer, A or B?\u003c/b>는 두 가지 중 더 선호하는 것을 묻는 표현이에요.\u003c/li>\u003cli>\u003cb class=\"key\">prefer A to B\u003c/b>는 A를 B보다 더 선호하다는 뜻이고, \u003cb class=\"key\">for free\u003c/b>는 ‘무료로’라는 뜻이에요.\u003c/li>\u003cli>\u003cb class=\"key\">It's important for me to ...\u003c/b>는 가주어 It과 진주어 to부정사를 사용한 표현이에요.\u003c/li>\u003c/ul>","segs":[{"n":39,"text":"오늘은 추천을 요청하는 표현과 선호를 묻고 답하는 표현을 배웠어요. Can you recommend a good place?는 좋은 곳을 추천해 달라는 뜻이고, Which do you prefer?는 두 가지 중 더 선호하는 것을 묻는 말이에요. prefer A to B와 for free, 그리고 가주어 It과 진주어 to부정사 구문도 꼭 복습해 주세요. 오늘 수업 수고했어요.","hl":"sum"}]}]});</script></body></html>
