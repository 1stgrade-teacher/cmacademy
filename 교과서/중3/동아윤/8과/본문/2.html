<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 8과 본문2","audioDir":"2_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Symbolic Meaning of Carp in Munjado\u003c/h1>\u003ch2>문자도 속 잉어의 상징적 의미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">문자도\u003c/b>의 사물은 단순히 장식이 아니라 상징적 의미를 지니며, 특히 \u003cb class=\"key\">효\u003c/b> 그림의 잉어는 병든 어머니를 위해 겨울에 물고기를 구한 아들의 \u003cb class=\"key\">효심\u003c/b>을 상징합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The carp in Munjado's 'hyo' paintings symbolizes filial piety, originating from a story about a devoted son and his sick mother.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 삼학년 동아 윤정미 팔과 본문의 두 번째 파트를 함께 공부할 거예요. 이번 시간에는 한국의 전통 민화인 문자도 속에 숨겨진 특별한 의미를 찾아볼 텐데요. 특히 왜 효를 강조하는 그림에 잉어가 등장하는지, 그 감동적인 요지와 요약을 중심으로 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">문자도(Munjado)\u003c/b>는 유교적 덕목을 글자와 그림의 형태로 결합하여 표현한 조선 시대의 \u003cb class=\"key\">민화(Folk \u003c/b>\u003cb class=\"key\">Painting)\u003c/b>입니다. 이는 단순히 글자를 예쁘게 꾸미는 것을 넘어, 각 글자가 상징하는 유교적 가르침을 시각적으로 강조하는 역할을 합니다. 마치 서양에서 \u003cb class=\"key\">올리브 \u003c/b>\u003cb class=\"key\">가지\u003c/b>가 평화를 상징하는 것처럼, 문자도 속 동식물들도 고유의 이야기를 품고 있습니다. 특히 \u003cb class=\"key\">효(Filial \u003c/b>\u003cb class=\"key\">Piety)\u003c/b> 자에는 잉어가 자주 등장하는데, 이는 불가능한 상황에서도 부모님을 봉양하려는 \u003cb class=\"key\">지극한 \u003c/b>\u003cb class=\"key\">정성\u003c/b>이 기적을 부른다는 교훈을 담고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 좀 쌓아볼까요? 문자도는 유교의 핵심 가치를 그림으로 표현한 예술이에요. 조선 시대 사람들은 글자의 의미를 더 잘 전달하기 위해 글자 안에 상징물을 그려 넣었죠. 예를 들어 평화를 상징하는 비둘기처럼, 우리 조상들은 부모님께 효도하는 마음인 효를 표현할 때 잉어를 사용했답니다. 이건 단순히 상상을 넘어 아주 유명한 설화에서 유래된 것이기도 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상징성 도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>문자도에 등장하는 대상들이 단순히 시각적 \u003cb class=\"key\">장식(decoration)\u003c/b>이 아니라 특정한 의미를 담은 \u003cb class=\"key\">상징(symbol)\u003c/b>임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>잉어의 사례\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>'효' 그림 속 \u003cb class=\"key\">잉어(carp)\u003c/b>가 부모님에 대한 \u003cb class=\"key\">공경(respect)\u003c/b>을 상징한다는 점을 언급하며 관련 설화를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아들의 시련\u003csmall>근거 · 문장 5–11\u003c/small>\u003c/h4>\u003cp>한겨울 병든 어머니를 위해 \u003cb class=\"key\">신선한 \u003c/b>\u003cb class=\"key\">물고기\u003c/b>를 구하려 했으나 \u003cb class=\"key\">얼어붙은 \u003c/b>\u003cb class=\"key\">강물\u003c/b> 앞에서 좌절하며 하늘에 도움을 청하는 장면입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기적과 결말\u003csmall>결론 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>하늘의 응답으로 얼음이 녹아 \u003cb class=\"key\">잉어 \u003c/b>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">마리\u003c/b>가 나타났고, 이를 드신 어머니의 \u003cb class=\"key\">병이 \u003c/b>\u003cb class=\"key\">완쾌\u003c/b>되었다는 이야기의 마무리입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"전체적인 글의 흐름을 보면, 상징에 대한 일반적인 설명에서 시작해 구체적인 잉어 이야기로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 문자도의 구성 요소들이 단순히 예쁘게 보이려는 decorations가 아니라, 깊은 뜻을 담은 symbolic한 존재라는 점을 선언하며 시작해요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 구체적인 예시로 carp, 즉 잉어를 들고 있어요. 잉어가 왜 parents에 대한 respect를 상징하게 되었는지, 그 유래가 되는 이야기를 들려주겠다고 예고하죠.","hl":"f1"},{"n":6,"text":"다섯 번째부터 열한 번째 문장까지는 이야기의 위기 부분이에요. 추운 겨울에 병든 어머니가 생선을 드시고 싶어 하시는데, 강물이 다 얼어버려 impossible한 상황에 처한 아들의 간절함을 보여줍니다.","hl":"f2"},{"n":7,"text":"마지막 열두 번째부터 열네 번째 문장에서는 기적이 일어나요. 아들의 효심에 감동해 얼음이 녹고 세 마리의 잉어가 튀어나왔고, 결국 어머니가 get well, 즉 병이 나았다는 해피엔딩으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시와 인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 문자도 속 사물의 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">성격\u003c/b>을 주제로 제시한 뒤, '효' 그림 속 \u003cb class=\"key\">잉어\u003c/b>를 구체적인 사례로 들어 설명합니다. 잉어가 상징이 된 배경을 시간 순서에 따른 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 서술하여 설득력을 높였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (3)\u003c/b>\u003cspan>구체적인 사례 도입\u003c/span>\u003cb>because of (3)\u003c/b>\u003cspan>상징의 원인 제시\u003c/span>\u003cb>The story goes as follows (4)\u003c/b>\u003cspan>설화 내용 전개 예고\u003c/span>\u003cb>Then (12)\u003c/b>\u003cspan>사건의 전환과 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">animals or objects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbolic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">carp\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fresh fish\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">three carp\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the fish\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 주제를 던지고 뒤에서 상세하게 설명하는 전형적인 두괄식 구조를 가지고 있어요. 전개 방식 면에서는 잉어가 상징이 된 이유를 시간 순서대로 설명하는 인과 구조와 예시 기법을 사용하고 있죠.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 숨어 있어요. 세 번째 문장의 For example은 구체적인 사례인 잉어를 끌어오는 신호탄이고요. 열두 번째 문장의 Then은 아들의 간절한 기도 뒤에 일어난 극적인 변화를 연결하는 아주 중요한 연결어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물체, 사물\u003c/span>\u003c/div>\u003cdiv>\u003cb>decoration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장식\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상징적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>carp\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잉어\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>respect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공경, 존경\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다, 뒤따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>once upon a time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>옛날 옛적에\u003c/span>\u003c/div>\u003cdiv>\u003cb>become ill\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>병이 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>아무것도\u003c/span>\u003c/div>\u003cdiv>\u003cb>fresh\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신선한\u003c/span>\u003c/div>\u003cdiv>\u003cb>frozen\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얼어붙은\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappointed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실망한, 낙담한\u003c/span>\u003c/div>\u003cdiv>\u003cb>cry out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>외치다, 울부짖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>melt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>녹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>get well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>병이 낫다, 회복하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 짚어볼까요? symbolic은 상징적인이라는 뜻으로 이 글의 핵심 키워드예요. 그리고 잉어를 뜻하는 carp와 공경을 뜻하는 respect도 꼭 기억해야 합니다. 병이 낫다는 표현인 get well도 자주 쓰이는 숙어니까 눈여겨보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">symbolic\u003c/b>\u003cspan class=\"m\">상징적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">representative\u003c/span>\u003cspan class=\"s\">figurative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">literal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">respect\u003c/b>\u003cspan class=\"m\">공경, 존중\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">honor\u003c/span>\u003cspan class=\"s\">admiration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disrespect\u003c/span>\u003cspan class=\"a\">contempt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frozen\u003c/b>\u003cspan class=\"m\">얼어붙은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">icy\u003c/span>\u003cspan class=\"s\">chilled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">melted\u003c/span>\u003cspan class=\"a\">liquid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impossible\u003c/b>\u003cspan class=\"m\">불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfeasible\u003c/span>\u003cspan class=\"s\">hopeless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">possible\u003c/span>\u003cspan class=\"a\">feasible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappointed\u003c/b>\u003cspan class=\"m\">낙담한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discouraged\u003c/span>\u003cspan class=\"s\">let down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003c/div>\u003c/div>\u003c/ 서 동사 원형을 썼어요. 두 번째로 because of는 뒤에 주어와 동사가 없는 명사구가 올 때 사용한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이야기는 진행된다\u003c/span>\u003cspan class=\"en\">The story \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">goes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음과 같이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">follows\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이야기는 다음과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 \u003cb class=\"key\">잉어\u003c/b>의 상징성에 대한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">근거\u003c/b>인 설화를 소개하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 시제\u003c/span> : 주어(3인칭 단수) + 동사-s : \"진행된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : as follows : \"다음과 같이\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The story goes, 그 이야기는 진행된다. as follows, 다음과 같이.. 이 문장 전체를 해석하면, 그 이야기는 다음과 같다.","hl":"m"},{"n":22,"text":"문자도 속 잉어가 왜 효도를 상징하게 되었는지 그 배경이 되는 설화를 본격적으로 시작하는 도입부예요.","hl":"mn"},{"n":23,"text":"첫 번째로 주어가 삼인칭 단수인 story이므로 동사 go 뒤에 es를 붙여 현재 시제로 썼어요. 두 번째로 as follows는 통째로 외워두면 좋은 관용 표현으로 뒤에 구체적인 내용이 나올 것임을 알려줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날 옛적에,\u003c/span>\u003cspan class=\"en\">Once upon a time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 남자가 살았다\u003c/span>\u003cspan class=\"en\">a man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lived\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 나이 든 어머니와 함께.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with\u003c/span> his old mother.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날 옛적에 한 남자가 나이 든 어머니와 살고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 설화의 시작을 알리는 전형적인 배경 설정으로, \u003cb class=\"key\">효도\u003c/b>의 주인공인 아들과 그 대상인 \u003cb class=\"key\">노모\u003c/b>를 등장시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제\u003c/span> : 주어 + 동사-ed : \"살았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : lived + with + 대상 : \"~와 함께\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Once upon a time, 옛날 옛적에. a man lived, 한 남자가 살았다. with his old mother, 그의 나이 든 어머니와 함께.. 이 문장 전체를 해석하면, 옛날 옛적에 한 남자가 나이 든 어머니와 살고 있었다.","hl":"m"},{"n":25,"text":"아주 먼 과거의 일을 이야기하는 전래동화의 전형적인 시작 방식이죠. 효의 가치를 보여줄 주인공 아들과 어머니가 등장해요.","hl":"mn"},{"n":26,"text":"첫 번째로 옛날 이야기를 들려주는 상황이라 과거 시제인 lived를 사용했어요. 두 번째로 누구와 함께 살았는지를 나타내기 위해 전치사 with를 쓴 점도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 겨울,\u003c/span>\u003cspan class=\"en\">One winter,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자의 어머니는 병이 들었다\u003c/span>\u003cspan class=\"en\">the man's mother \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">ill\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아무 것도 먹을 수 없었다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">anything\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 겨울, 남자의 어머니는 병이 들어서 아무 것도 먹을 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사건의 \u003cb class=\"key\">발단\u003c/b>이 되는 부분으로, 어머니의 발병을 통해 아들이 해결해야 할 \u003cb class=\"key\">갈등 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사\u003c/span> : become + 형용사(보어) : \"병이 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 부정문\u003c/span> : could not + 동사원형 + anything : \"아무 것도 먹을 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"One winter, 어느 겨울. the man's mother became ill, 남자의 어머니는 병이 들었다. and couldn't eat anything, 그리고 아무 것도 먹을 수 없었다.. 이 문장 전체를 해석하면, 어느 겨울, 남자의 어머니는 병이 들어서 아무 것도 먹을 수 없었다.","hl":"m"},{"n":28,"text":"어머니가 편찮으셔서 식사를 전혀 못 하시게 된 위기 상황을 보여주고 있어요. 이 고난이 나중에 잉어의 기적으로 이어지는 계기가 되죠.","hl":"mn"},{"n":29,"text":"첫 번째로 어떤 상태가 되었는지를 말할 때 become 뒤에 형용사 ill을 쓴 점을 보세요. 두 번째로 부정문에서는 something 대신 anything을 써서 아무것도 먹지 못했다는 점을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무척 추운 어느 날,\u003c/span>\u003cspan class=\"en\">On one very cold day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어머니는 남자에게 말했다.\u003c/span>\u003cspan class=\"en\">the mother said to the man,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“정말 좋겠구나\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">wonderful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신선한 물고기를 먹을 수 있다면.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span> fresh fish.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무척 추운 어느 날, 어머니는 남자에게 말했다. “신선한 물고기를 먹을 수 있다면 정말 좋겠구나.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어머니의 불가능한 소망이 제시되며 이야기의 \u003cb class=\"key\">갈등\u003c/b>이 시작되는 부분입니다. 현재 실현되기 어려운 상황을 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거\u003c/b>를 사용하여 표현하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + 주어 + 과거동사(could eat), 주어 + 조동사 과거형(would) + 동사원형 : \"내가 먹을 수 있다면 정말 좋을 텐데\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"On one very cold day, 무척 추운 어느 날. the mother said to the man, 어머니는 남자에게 말했다.. \"It would be wonderful, “정말 좋겠구나. if I could eat fresh fish.\", 신선한 물고기를 먹을 수 있다면.”. 이 문장 전체를 해석하면, 무척 추운 어느 날, 어머니는 남자에게 말했다. “신선한 물고기를 먹을 수 있다면 정말 좋겠구나.”","hl":"m"},{"n":31,"text":"추운 겨울날 신선한 물고기를 먹고 싶다는 어머니의 말로 이야기가 본격적으로 시작돼요. 이 말은 효심 깊은 아들에게 커다란 시련이자 도전 과제가 됩니다.","hl":"mn"},{"n":32,"text":"이 문장은 서술형 대비가 꼭 필요한 가정법 과거 구문입니다. if절에 과거형인 could eat을 썼고 주절에 조동사 과거형 would를 썼죠. 현재 사실과는 반대되는 간절한 소망을 나타낼 때 사용하는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자는 나갔다\u003c/span>\u003cspan class=\"en\">The man went out\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강으로,\u003c/span>\u003cspan class=\"en\">to the river,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 ~였다\u003c/span>\u003cspan class=\"en\">but it was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 얼어붙은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">completely \u003c/span>\u003cspan class=\"tgt\">frozen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자는 강으로 나갔지만, 강은 완전히 얼어붙어 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어머니의 소망을 들어주려 노력하지만 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">장애물\u003c/b>에 부딪힌 상황입니다. \u003cb class=\"key\">대조\u003c/b>를 나타내는 접속사 but을 통해 절망적인 분위기를 조성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법과 부사 수식\u003c/span> : 부사(completely) + 과거분사(frozen) : \"완전히 얼어붙은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The man went out, 남자는 나갔다. to the river, 강으로. but it was, 하지만 그것은 ~였다. completely frozen, 완전히 얼어붙은.. 이 문장 전체를 해석하면, 남자는 강으로 나갔지만, 강은 완전히 얼어붙어 있었다.","hl":"m"},{"n":34,"text":"아들이 행동에 나섰지만 강이 꽁꽁 얼어붙어 있는 절망적인 상황을 보여줍니다. 완전히 얼어붙었다는 표현으로 아들이 처한 어려움을 강조하고 있어요.","hl":"mn"},{"n":35,"text":"여기서 frozen은 얼어붙은 상태를 나타내는 과거분사예요. 이 형용사 같은 분사를 completely라는 부사가 앞에서 꾸며주면서 상황의 심각성을 더해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불가능했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">impossible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 물고기라도 잡는 것은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">catch\u003c/span> any fish.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 어떤 물고기라도 잡는 것은 불가능했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들의 힘으로는 해결할 수 없는 \u003cb class=\"key\">한계\u003c/b> 상황을 명확히 제시합니다. 이 문장은 나중에 일어날 \u003cb class=\"key\">기적\u003c/b>과 극적인 대비를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어·진주어 및 의미상 주어\u003c/span> : It(가주어) + be동사 + 형용사 + for 목적격(의미상 주어) + to부정사(진주어) : \"그가 잡는 것은 불가능했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It was impossible, 불가능했다. for him, 그가. to catch any fish, 어떤 물고기라도 잡는 것은.. 이 문장 전체를 해석하면, 그가 어떤 물고기라도 잡는 것은 불가능했다.","hl":"m"},{"n":37,"text":"자신의 힘으로는 도저히 물고기를 잡을 수 없다는 것을 깨닫는 장면이에요. 이런 불가능한 상황이 강조되어야 나중에 하늘이 돕는 장면이 더 감동적으로 다가옵니다.","hl":"mn"},{"n":38,"text":"이번 과의 핵심 문법인 it for to 구문이 나왔네요. 첫 번째로 가짜 주어 It을 먼저 말하고, 두 번째로 물고기를 잡는 주체인 아들을 표현하기 위해 의미상 주어 for him을 썼어요. 마지막으로 진짜 주어인 to catch를 뒤에 배치한 완벽한 문장 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자는\u003c/span>\u003cspan class=\"en\">The man was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몹시 낙담해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">disappointed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 외쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> he cried out\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘에 대고\u003c/span>\u003cspan class=\"en\">to the sky,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;제가 어떻게 해야 하나요?\u003c/span>\u003cspan class=\"en\">&quot;What should I do?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자는 몹시 낙담해서 하늘에 대고 외쳤다. “제가 어떻게 해야 하나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물고기를 잡을 수 없는 절망적인 상황에서 남자가 느끼는 \u003cb class=\"key\">절박한 \u003c/b>\u003cb class=\"key\">심정\u003c/b>을 나타내며, 곧 일어날 신비로운 사건의 \u003cb class=\"key\">갈등의 \u003c/b>\u003cb class=\"key\">정점\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문 (결과)\u003c/span> : so + 형용사 + that + 주어 + 동사 : \"매우 낙담해서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사\u003c/span> : 주어 + be동사 + 과거분사(p.p.) : \"낙담한\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The man was, 그 남자는. so disappointed, 몹시 낙담해서. that he cried out, 그는 외쳤다. to the sky, 하늘에 대고. \"What should I do?, \"제가 어떻게 해야 하나요?. 이 문장 전체를 해석하면, 남자는 몹시 낙담해서 하늘에 대고 외쳤다. “제가 어떻게 해야 하나요?","hl":"m"},{"n":40,"text":"물고기를 잡을 수 없는 절망적인 상황에서 남자가 느끼는 절박한 심정을 나타내요. 이 간절한 외침은 곧 일어날 신비로운 사건의 갈등의 정점이라고 할 수 있죠.","hl":"mn"},{"n":41,"text":"첫 번째로 so disappointed that은 아주 중요한 구문인데요. 너무 실망해서 그 결과 외쳤다는 의미로 결과를 나타내는 so that 구문이에요. 두 번째로 disappointed는 남자가 실망을 느끼는 상태이므로 과거분사 형태를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제발\u003c/span>\u003cspan class=\"en\">Please\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저를 도와주세요.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help\u003c/span> me.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제발 저를 도와주세요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문제 해결을 위한 간절한 \u003cb class=\"key\">도움 \u003c/b>\u003cb class=\"key\">요청\u003c/b>으로, 하늘을 감동시켜 이후 일어날 \u003cb class=\"key\">기적\u003c/b>의 직접적인 복선 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 ~ : \"도와주세요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Please, 제발. help me.\", 저를 도와주세요.\". 이 문장 전체를 해석하면, 제발 저를 도와주세요.”","hl":"m"},{"n":43,"text":"어머니를 위해 물고기를 구해야 하는 남자의 간절한 도움 요청이에요. 이 기도가 하늘을 감동시켜서 기적이 일어나는 계기가 된답니다.","hl":"mn"},{"n":44,"text":"첫 번째로 문장이 동사원형인 help로 시작하고 있죠. 상대방에게 정중하게 부탁하거나 요청을 할 때 쓰는 명령문 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자 얼음이 녹았고,\u003c/span>\u003cspan class=\"en\">Then the ice \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">melted\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잉어 세 마리가\u003c/span>\u003cspan class=\"en\">and three carp\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 나왔다\u003c/span>\u003cspan class=\"en\">suddenly \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물 밖으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 얼음이 녹았고, 잉어 세 마리가 갑자기 물 밖으로 나왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자의 지극한 효심에 하늘이 응답하여 \u003cb class=\"key\">기적\u003c/b>이 일어나는 장면으로, 효도의 가치를 강조하는 \u003cb class=\"key\">전래 \u003c/b>\u003cb class=\"key\">동화\u003c/b>의 전형적 특징을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : 동사원형 + -(e)d : \"녹았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사\u003c/span> : come + out of + 명사 : \"~에서 나오다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Then the ice melted, 그러자 얼음이 녹았고. and three carp, 잉어 세 마리가. suddenly came out, 갑자기 나왔다. of the water, 물 밖으로. 이 문장 전체를 해석하면, 그러자 얼음이 녹았고, 잉어 세 마리가 갑자기 물 밖으로 나왔다.","hl":"m"},{"n":46,"text":"남자의 지극한 효심에 하늘이 응답하여 기적이 일어나는 장면이에요. 전래 동화에서 흔히 볼 수 있는 효도의 가치를 강조하는 대목이죠.","hl":"mn"},{"n":47,"text":"첫 번째로 melted는 얼음이 녹았다는 과거의 완료된 사건을 나타내기 위해 과거시제를 썼어요. 두 번째로 came out of는 어디로부터 나오다라는 뜻으로 장소의 이동을 표현하는 중요한 구동사 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자는 집으로 돌아갔다\u003c/span>\u003cspan class=\"en\">The man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">home \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 물고기들을 요리했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cooked \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어머니를 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">mother\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자는 집으로 돌아가서 어머니에게 그 물고기들을 요리해 드렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들이 기적적으로 얻은 물고기를 정성껏 준비하는 장면으로, \u003cb class=\"key\">효\u003c/b>의 구체적인 실천을 보여줍니다. 그림 속 \u003cb class=\"key\">잉어\u003c/b>가 왜 효도의 상징이 되었는지 설명하는 이야기의 핵심 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : 주어 + 과거동사1(went) + and + 과거동사2(cooked) : \"집으로 돌아가서 요리했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식을 3형식으로 전환\u003c/span> : 동사(cook) + 목적어(fish) + 전치사(for) + 대상(mother) : \"어머니를 위해 물고기를 요리했다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The man went back home, 남자는 집으로 돌아갔다. and cooked the fish, 그리고 그 물고기들을 요리했다. for his mother, 어머니를 위해서. 이 문장 전체를 해석하면, 남자는 집으로 돌아가서 어머니에게 그 물고기들을 요리해 드렸다.","hl":"m"},{"n":49,"text":"아들이 기적적으로 구한 물고기를 들고 집으로 돌아와 정성껏 음식을 만드는 장면이에요. 그림 속 잉어가 왜 부모님에 대한 효를 상징하게 되었는지 그 이유를 잘 보여주는 대목이죠.","hl":"mn"},{"n":50,"text":"첫 번째 문법 포인트는 went와 cooked가 and로 묶인 병렬 구조라는 점이에요. 두 과거 동작이 순서대로 일어났음을 보여주죠. 두 번째는 요리해 주다라는 표현인데, 수여 동사 중에서도 정성이 들어가는 cook은 전치사 for를 써서 삼형식으로 만든답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 어머니는\u003c/span>\u003cspan class=\"en\">his mother\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">병이 나았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 그의 어머니는 병이 나았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들의 지극한 정성으로 어머니의 병이 완쾌되는 \u003cb class=\"key\">해피엔딩\u003c/b>을 맞이합니다. \u003cb class=\"key\">효심\u003c/b>이 있으면 하늘도 돕고 기적이 일어날 수 있다는 교훈을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태 변화 동사(get) + 형용사 보어\u003c/span> : get + 형용사(well) : \"건강해졌다(병이 나았다)\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Then, 그러자. his mother, 그의 어머니는. got well, 병이 나았다. 이 문장 전체를 해석하면, 그러자 그의 어머니는 병이 나았다.","hl":"m"},{"n":52,"text":"이야기의 마지막 결론이에요. 아들의 간절한 기도와 노력이 결국 어머니의 건강 회복이라는 결과로 이어졌죠. 효의 가치를 다시 한번 강조하는 부분이에요.","hl":"mn"},{"n":53,"text":"여기서 get은 어떠한 상태가 되다라는 뜻을 가진 이형식 동사로 쓰였어요. 그래서 뒤에는 주어인 어머니의 상태를 설명해 줄 수 있는 보어가 필요한데, 건강한이라는 뜻의 형용사 well이 그 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">문자도\u003c/b>에 그려진 대상들은 단순한 \u003cb class=\"key\">장식\u003c/b>을 넘어선 깊은 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 담고 있습니다.\u003c/li>\u003cli>특히 '효'라는 글자 옆에 그려진 \u003cb class=\"key\">잉어\u003c/b>는 부모님에 대한 \u003cb class=\"key\">공경\u003c/b>을 뜻하는 대표적 소재입니다.\u003c/li>\u003cli>잉어가 상징이 된 이유는 한겨울 어머니를 위해 \u003cb class=\"key\">물고기\u003c/b>를 구하려 했던 아들의 \u003cb class=\"key\">지극한 \u003c/b>\u003cb class=\"key\">효성\u003c/b> 때문입니다.\u003c/li>\u003cli>얼음이 녹고 기적처럼 나타난 \u003cb class=\"key\">잉어 \u003c/b>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">마리\u003c/b> 덕분에 어머니가 건강을 되찾았다는 \u003cb class=\"key\">설화\u003c/b>가 핵심입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The carp in Munjado's 'hyo' paintings symbolizes filial piety, originating from a story about a devoted son and his sick mother.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">문자도\u003c/b>의 사물은 단순히 장식이 아니라 상징적 의미를 지니며, 특히 \u003cb class=\"key\">효\u003c/b> 그림의 잉어는 병든 어머니를 위해 겨울에 물고기를 구한 아들의 \u003cb class=\"key\">효심\u003c/b>을 상징합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 문자도 속 잉어가 왜 효도의 상징이 되었는지 그 아름다운 이야기를 통해 배웠습니다. 부모님을 향한 정성이 기적을 만든다는 교훈을 가슴에 새기며 오늘 수업 마칠게요. 복습 잊지 마세요, 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
