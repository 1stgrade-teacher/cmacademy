 사물들의 상징성 (예: 잉어, 거문고, 부채)</li><li>핵심 키워드: 한자(Chinese character), 가치(values)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문자도의 사회적 의미</div><ul><li>문자도는 조선 시대 사람들이 지켜야 했던 중요한 가치관을 담고 있습니다.</li><li>그림에 담긴 유교적 덕목 표현</li><li>당시 사람들의 삶과 철학을 엿볼 수 있는 매개체</li><li>핵심 키워드: 가치관(values), 유교적 덕목(Confucian values)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">window</td><td class=\"m\">창문, (정보를 얻는) 창구</td></tr><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림</td></tr><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr><tr><td class=\"w\">carp</td><td class=\"m\">잉어</td></tr><tr><td class=\"w\">folk</td><td class=\"m\">민속의</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">대중적인, 인기 있는</td></tr><tr><td class=\"w\">late</td><td class=\"m\">후기의, 늦은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">usually</td><td class=\"m\">보통, 대개</td></tr><tr><td class=\"w\">animal</td><td class=\"m\">동물</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 물체</td></tr><tr><td class=\"w\">appear</td><td class=\"m\">나타나다, 등장하다</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 대표하다</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보라</span><span class=\"en\"><b>Look at</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 그림을</span><span class=\"en\"><b>the painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오른쪽에 있는</span><span class=\"en\"><b>on the right.</b></span></div></div><div class=\"lec-sent-ko\">오른쪽에 있는 그림을 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서 독자의 시선을 그림으로 이끌며, 앞으로 설명할 &#39;문자도&#39;라는 구체적인 소재를 관찰하게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Munjado, a Window into the Joseon Dynasty (동격): 명사(Munjado)와 명사구(a Window into the Joseon Dynasty)가 쉼표를 통해 나란히 나열되어, 뒤의 어구가 앞의 명사를 보충 설명하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">painting</td><td class=\"m\">그림</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보이는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 한자가</span><span class=\"en\"><b>the Chinese character,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">효(孝)가</span><span class=\"en\"><b>hyo (孝)?</b></span></div></div><div class=\"lec-sent-ko\">한자 효(孝)가 보이는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 문장에서 유도한 관찰을 바탕으로, 그림 속에 포함된 핵심 요소인 &#39;한자&#39;를 찾아보게 하여 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you see (의문문): 조동사 do를 문장 맨 앞에 배치하여 주어(you)와 동사(see)의 순서로 구성한 일반동사 의문문 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한 보이는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you also see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잉어</span><span class=\"en\"><b>a carp,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거문고</span><span class=\"en\"><b>a geomungo,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 부채가</span><span class=\"en\"><b>and a fan?</b></span></div></div><div class=\"lec-sent-ko\">잉어, 거문고, 그리고 부채도 보이는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한자 외에 그림에 포함된 다른 요소들을 언급하며, 문자도가 단순한 글자가 아닌 여러 사물이 결합된 형태임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you also see (의문문): 조동사 do가 주어(you) 앞에 위치하여 질문을 만드는 일반동사 의문문 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carp</td><td class=\"m\">잉어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 종류의 그림은</span><span class=\"en\"><b>This kind of painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불린다</span><span class=\"en\"><b><span class=\"grammar-hl\">is called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문자도라고</span><span class=\"en\"><b>Munjado*,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 ~이다</span><span class=\"en\"><b>and it is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">민화의 한 종류</span><span class=\"en\"><b>a type of folk painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있었던</span><span class=\"en\"><b><span class=\"grammar-hl\">that was popular</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조선 시대 후기에</span><span class=\"en\"><b>in the late Joseon dynasty.</b></span></div></div><div class=\"lec-sent-ko\">이런 종류의 그림을 문자도라고 하며, 그것은 조선 시대 후기에 인기 있었던 민화의 한 종류이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문들에 대한 답변을 제시하며, &#39;문자도&#39;의 정의와 시대적 배경(조선 후기)을 명확하게 설명합니다. 여기서 folk painting은 사전적으로 &#39;민속 그림&#39;이지만, 여기서는 전문 화가가 아닌 민중이 즐기고 그렸던 &#39;민화&#39;라는 뜻으로 쓰였습니다. 이는 당시 문화의 주류가 서민층까지 확산했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is called (수동태): be동사(is)+p.p.(called) 구조. call은 타동사인데 목적어가 없어서 수동구조 is called 형태로 씁니다. 기본구조: call A B (A를 B라고 부르다/A를 B라고 칭하다)</div><div class=\"lec-gr-item\">that was popular (관계대명사): that절이 선행사(a type of folk painting)를 수식하는 주격 관계대명사절입니다. 관계대명사 뒤에는 주어 역할을 하는 that이 빠져 있고, was popular라는 서술부가 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림</td></tr><tr><td class=\"w\">folk</td><td class=\"m\">민속의</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">대중적인, 인기 있는</td></tr><tr><td class=\"w\">late</td><td class=\"m\">후기의, 늦은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문자도 안에는</span><span class=\"en\"><b>In Munjado,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보통 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there is</span> usually</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한자 하나가</span><span class=\"en\"><b>a Chinese character</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약간의 동물들과</span><span class=\"en\"><b>with some animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 사물들을 가진</span><span class=\"en\"><b>or objects.</b></span></div></div><div class=\"lec-sent-ko\">문자도에는 보통 한자 하나가 동물이나 사물들과 함께 나온다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문자도의 일반적인 구성 방식을 정리하며, 앞서 언급한 잉어, 거문고 등이 왜 그림에 등장하는지를 논리적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there is (도치): 유도부사 there가 문장 맨 앞에 오면서 주어(a Chinese character)와 동사(is)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr><tr><td class=\"w\">usually</td><td class=\"m\">보통, 대개</td></tr><tr><td class=\"w\">animal</td><td class=\"m\">동물</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 물체</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여덟 개의 한자 중 하나가</span><span class=\"en\"><b><span class=\"grammar-hl\">One of eight Chinese characters</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나타난다</span><span class=\"en\"><b>appears</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문자도에</span><span class=\"en\"><b>in Munjado.</b></span></div></div><div class=\"lec-sent-ko\">문자도에는 여덟 개의 한자 중 하나가 나온다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문자도의 소재가 무작위가 아니라, 여덟 가지의 특정 한자로 제한되어 있다는 점을 밝히며 범위를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">One of eight Chinese characters (관용표현): &#39;One of + 복수명사&#39; 구조로, 여러 개 중에서 하나를 가리키는 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr><tr><td class=\"w\">appear</td><td class=\"m\">나타나다, 등장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 이다</span><span class=\"en\"><b>They are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">효, 제, 충</span><span class=\"en\"><b>hyo (孝), je (悌), chung (忠),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신, 예, 의</span><span class=\"en\"><b>sin (信), ye (禮), ui (義),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">염, 그리고 치</span><span class=\"en\"><b>yeom (廉), and chi (恥),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 나타낸다</span><span class=\"en\"><b>and they represent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 가치들을</span><span class=\"en\"><b>the values</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요했던</span><span class=\"en\"><b><span class=\"grammar-hl\">that were important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게</span><span class=\"en\"><b>to people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조선 시대의</span><span class=\"en\"><b>of the Joseon dynasty.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 효(孝), 제(悌), 충(忠), 신(信), 예(禮), 의(義), 염(廉), 치(恥)이고, 조선 시대 사람들에게 중요했던 가치들을 나타낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여덟 개의 한자를 나열하고, 이것이 단순히 글자가 아니라 조선 시대의 &#39;핵심 가치(유교적 윤리)&#39;를 상징한다는 점을 강조합니다. represent는 사전적으로 &#39;대표하다&#39;이지만, 여기서는 그림 속 사물들이 특정 가치를 담고 있음을 나타내므로 &#39;상징하다&#39;라는 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that were important (관계대명사): that절이 선행사(the values)를 수식하는 주격 관계대명사절입니다. 관계대명사 뒤에는 주어 역할을 하는 that이 빠져 있고, were important라는 서술부가 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 대표하다</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문자도는 조선 후기에 유행한 민화로, 한자와 사물을 결합해 그리는 방식이다.</li><li>문자도에는 8가지 주요 한자가 쓰인다.</li><li>이 한자들은 조선 시대 사람들이 가장 중요하게 생각했던 유교적 가치들을 상징한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Munjado combines Chinese characters with symbolic objects to represent the core moral values of the people living in the late Joseon dynasty.</div>\n              <div class=\"lec-final-sum-ko\">문자도는 조선 후기 사람들이 중요하게 여겼던 핵심 도덕 가치를 나타내기 위해 한자와 상징적인 사물을 결합한 그림이다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio":"./2_audio/10.mp3","hl":"grammar"}],[{"audio":"./2_audio/11.mp3","hl":"main"},{"audio":"./2_audio/12.mp3","hl":"meaning"},{"audio":"./2_audio/13.mp3","hl":"grammar"}],[{"audio":"./2_audio/14.mp3","hl":"main"},{"audio":"./2_audio/15.mp3","hl":"meaning"},{"audio":"./2_audio/16.mp3","hl":"grammar"}],[{"audio":"./2_audio/17.mp3","hl":"main"},{"audio":"./2_audio/18.mp3","hl":"meaning"},{"audio":"./2_audio/19.mp3","hl":"grammar"}],[{"audio":"./2_audio/20.mp3","hl":"main"},{"audio":"./2_audio/21.mp3","hl":"meaning"},{"audio":"./2_audio/22.mp3","hl":"grammar"}],[{"audio":"./2_audio/23.mp3","hl":"main"},{"audio":"./2_audio/24.mp3","hl":"meaning"},{"audio":"./2_audio/25.mp3","hl":"grammar"}],[{"audio":"./2_audio/26.mp3","hl":"main"},{"audio":"./2_audio/27.mp3","hl":"meaning"},{"audio":"./2_audio/28.mp3","hl":"grammar"}],[{"audio":"./2_audio/29.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;v
