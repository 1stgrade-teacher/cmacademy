<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 8과 본문1","audioDir":"1_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Munjado: Reflecting Joseon’s Spirit Through Art\u003c/h1>\u003ch2>조선의 정신을 담은 예술, 문자도\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>조선 시대 후기에 유행한 \u003cb class=\"key\">민화\u003c/b>의 한 종류인 \u003cb class=\"key\">문자도\u003c/b>는 한자와 사물을 결합하여 당시 사람들이 중요시했던 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 담아냈습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Munjado is a unique form of folk painting that visually represents the core moral values of the Joseon dynasty by combining Chinese characters with symbolic objects.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 조선 시대의 독특한 예술 세계인 문자도에 대해 함께 알아보겠습니다. 이번 시간에는 문자도가 무엇인지, 그리고 그 안에 어떤 깊은 의미가 담겨 있는지 요약과 요지를 통해 명확하게 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">조선 시대 후기에 서민들 사이에서 큰 인기를 끌었던 \u003cb class=\"key\">민화\u003c/b>(Folk Painting)는 정통 회화와 달리 파격적이고 자유로운 표현이 특징입니다. 그중에서도 \u003cb class=\"key\">문자도\u003c/b>(Munjado)는 글자의 의미와 관련된 그림을 한 화면에 담아내는 독특한 양식인데, 이는 현대의 \u003cb class=\"key\">타이포그래피\u003c/b>(Typography) 디자인과 매우 유사합니다. 마치 우리가 브랜드 로고를 보고 그 기업의 철학을 떠올리듯, 조선 시대 사람들은 문자도를 보며 유교적인 도덕 지침을 상식처럼 익혔습니다. 당시 사람들은 이 그림을 \u003cb class=\"key\">병풍\u003c/b>으로 제작하여 집안을 장식했으며, 이를 통해 일상 속에서 \u003cb class=\"key\">올바른 \u003c/b>\u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 되새기고자 노력했습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 시작하기 전에 배경지식을 조금 쌓아 볼까요? 조선 후기에는 서민들의 삶이 투영된 민화가 아주 유행했습니다. 그중에서도 문자도는 한자와 그림을 결합한 일종의 타이포그래피라고 할 수 있어요. 당시 사람들은 글자에 담긴 유교적인 가르침을 그림으로 그려 집안을 장식하며 일상 속에서 그 가치를 실천하려 노력했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 관찰\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>독자에게 그림 속 \u003cb class=\"key\">효(孝)\u003c/b>자와 잉어, 거문고, 부채 등의 소재를 찾아보게 하며 \u003cb class=\"key\">흥미를 \u003c/b>\u003cb class=\"key\">유발\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문자도의 정의\u003csmall>주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>이 그림이 조선 후기에 유행했던 \u003cb class=\"key\">민화\u003c/b>의 일종인 \u003cb class=\"key\">문자도\u003c/b>임을 명확히 정의합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>문자도의 특징\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>문자도에는 보통 하나의 \u003cb class=\"key\">한자\u003c/b>와 그에 연관된 \u003cb class=\"key\">동물이나 \u003c/b>\u003cb class=\"key\">사물\u003c/b>이 함께 나타난다는 구성을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>의미와 가치\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>문자도에 쓰인 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">한자\u003c/b>를 나열하고, 그것이 조선 시대의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 상징함을 밝힙니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 흐름을 따라가며 문자도의 특징을 하나씩 짚어 보겠습니다.","hl":null},{"n":4,"text":"첫 번째부터 세 번째 문장까지는 도입부입니다. 오른쪽에 있는 그림을 보면서 한자 hyo와 함께 잉어, 거문고, 부채가 보이는지 질문하며 우리의 관심을 이끌어내고 있죠.","hl":"f0"},{"n":5,"text":"네 번째 문장이 아주 중요한데요. 이런 형태의 그림을 문자도라고 정의하며, 이것이 조선 후기에 큰 인기를 끌었던 민화의 한 종류라는 핵심 정보를 전달하고 있습니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 문자도의 구체적인 구성을 설명합니다. 보통 하나의 한자가 있고, 그 옆에 동물이나 사물이 함께 그려진다는 점을 강조하고 있네요.","hl":"f2"},{"n":7,"text":"마지막으로 여섯 번째와 일곱 번째 문장에서는 문자도에 쓰이는 여덟 가지 한자를 소개하며, 이 글자들이 조선 시대 사람들에게 얼마나 중요한 가치들을 상징했는지 결론을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 정의\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 질문을 통해 독자의 \u003cb class=\"key\">관심을 \u003c/b>\u003cb class=\"key\">유도\u003c/b>한 뒤, 4번 문장에서 핵심 소재인 \u003cb class=\"key\">문자도\u003c/b>를 정의하고 있습니다. 이후에는 문자도의 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>과 그 속에 담긴 \u003cb class=\"key\">철학적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 차례로 설명하는 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Look at (1)\u003c/b>\u003cspan>명령문을 통한 주의 집중\u003c/span>\u003cb>Do you see (2)\u003c/b>\u003cspan>질문을 통한 소재 확인\u003c/span>\u003cb>This kind of painting (4)\u003c/b>\u003cspan>지시어를 통한 개념 정의\u003c/span>\u003cb>Usually (5)\u003c/b>\u003cspan>일반적인 특징 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">painting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Munjado\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">folk painting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Chinese character\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eight Chinese characters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">values\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 질문을 던져서 독자의 시선을 끈 다음에 정답을 알려주는 질문 답변 구조를 가지고 있습니다. 또한 문자도의 정의를 먼저 내리고 상세 설명을 덧붙이는 전형적인 두괄식 패턴을 보여주고 있어요.","hl":"ty"},{"n":9,"text":"문장 속 신호어들을 살펴볼까요? 네 번째 문장에 This kind of painting이라는 지시어가 앞의 질문들에 나온 그림을 하나로 묶어주고 있죠. 그리고 일곱 번째 문장의 They는 앞에 나온 여덟 개의 한자를 가리키며 내용의 연결성을 높여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림, 회화\u003c/span>\u003c/div>\u003cdiv>\u003cb>Chinese character\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한자\u003c/span>\u003c/div>\u003cdiv>\u003cb>carp\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잉어\u003c/span>\u003c/div>\u003cdiv>\u003cb>geomungo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거문고\u003c/span>\u003c/div>\u003cdiv>\u003cb>fan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부채\u003c/span>\u003c/div>\u003cdiv>\u003cb>folk painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>민화\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>late\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>후기의, 늦은\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynasty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕조, 시대\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통, 대개\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사물, 물체\u003c/span>\u003c/div>\u003cdiv>\u003cb>appear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>represent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>hyo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효\u003c/span>\u003c/div>\u003cdiv>\u003cb>je\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제 (공경)\u003c/span>\u003c/div>\u003cdiv>\u003cb>chung\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충 (충성)\u003c/span>\u003c/div>\u003cdiv>\u003cb>sin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신 (믿음)\u003c/span>\u003c/div>\u003cdiv>\u003cb>ye\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예 (예절)\u003c/span>\u003c/div>\u003cdiv>\u003cb>ui\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의 (의리)\u003c/span>\u003c/div>\u003cdiv>\u003cb>yeom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>염 (청렴)\u003c/span>\u003c/div>\u003cdiv>\u003cb>chi\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치 (부끄러움)\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 기억해야 할 단어는 민화를 뜻하는 folk painting과 상징하다라는 뜻의 represent입니다. 특히 dynasty라는 단어는 시대를 나타낼 때 자주 쓰이니 꼭 익혀두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fashionable\u003c/span>\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">late\u003c/b>\u003cspan class=\"m\">후기의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">final\u003c/span>\u003cspan class=\"s\">closing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">early\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">represent\u003c/b>\u003cspan class=\"m\">나타내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">symbolize\u003c/span>\u003cspan class=\"s\">stand for\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">usually\u003c/b>\u003cspan class=\"m\">보통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">normally\u003c/span>\u003cspan class=\"s\">commonly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 체크해 봅시다. 인기 있는이라는 뜻의 popular는 fashionable로 바꿔 쓸 수 있고, 중요한이라는 뜻의 important는 crucial이나 essential과 같은 의미입니다. 반대로 late의 반대말인 early도 함께 기억해 두면 좋겠죠?","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림을\u003c/span>\u003cspan class=\"en\">the painting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오른쪽에 있는\u003c/span>\u003cspan class=\"en\">on the right.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오른쪽에 있는 그림을 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자의 시선을 본문에서 다룰 \u003cb class=\"key\">그림\u003c/b>으로 유도하며 글을 시작하는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사 원형] + ~ : \"보라\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Look at, 보라. the painting, 그림을. on the right, 오른쪽에 있는. 이 문장 전체를 해석하면, 오른쪽에 있는 그림을 보라.","hl":"m"},{"n":13,"text":"본문에서 설명할 민화의 세계로 독자를 초대하며 시선을 집중시키는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 Look at은 문장에 주어가 없이 동사 원형으로 시작하고 있죠. 상대방에게 무엇을 하라고 말하는 명령문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이는가\u003c/span>\u003cspan class=\"en\">Do you see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Chinese \u003c/span>\u003cspan class=\"tgt\">character, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효(孝)가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hyo \u003c/span>\u003cspan class=\"tgt\">(孝)\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한자 효(孝)가 보이는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림의 핵심 소재인 \u003cb class=\"key\">한자\u003c/b>를 구체적으로 언급하며 본격적인 주제를 소개합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격\u003c/span> : [명사] , [명사] : \"한자 효(孝)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Do you see, 보이는가. the Chinese character, 한자. hyo (孝)?, 효(孝)가. 이 문장 전체를 해석하면, 한자 효(孝)가 보이는가?","hl":"m"},{"n":16,"text":"그림 속에 그려진 특정한 한자를 찾아보게 함으로써 독자의 호기심을 자극하고 있어요.","hl":"mn"},{"n":17,"text":"두 번째 문장에서 the Chinese character와 hyo 사이의 콤마는 두 단어가 서로 같음을 나타내는 동격의 표현이에요. 즉, 한자가 무엇인지 구체적으로 부연 설명하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 보이는가\u003c/span>\u003cspan class=\"en\">Do you also see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잉어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">carp, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거문고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">geomungo, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 부채도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fan\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잉어, 거문고, 그리고 부채도 보이는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한자 외에 그림 속에 나타난 다양한 \u003cb class=\"key\">상징물\u003c/b>들을 나열하여 세부적인 묘사를 이어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : A, B, and C : \"잉어, 거문고, 그리고 부채\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Do you also see, 또한 보이는가. a carp, 잉어. a geomungo, 거문고. and a fan?, 그리고 부채도. 이 문장 전체를 해석하면, 잉어, 거문고, 그리고 부채도 보이는가?","hl":"m"},{"n":19,"text":"한자 주변에 그려진 여러 가지 상징물들을 언급하며 그림의 특징을 더 자세히 보여주고 있어요.","hl":"mn"},{"n":20,"text":"세 번째 문장에서는 and라는 등위 접속사가 쓰였는데요. 잉어와 거문고, 그리고 부채라는 세 가지 명사를 하나로 묶어주는 병렬 구조가 활용되었답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 그림을 \u003c/span>\u003cspan class=\"en\">This kind of painting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도라고 하며, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">called\u003c/span> Munjado*,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 민화의 한 종류이다 \u003c/span>\u003cspan class=\"en\">and it is a type of folk painting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기 있었던 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">popular\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조선 시대 후기에\u003c/span>\u003cspan class=\"en\">in the late Joseon dynasty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 종류의 그림을 문자도라고 하며, 그것은 조선 시대 후기에 인기 있었던 민화의 한 종류이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도의 \u003cb class=\"key\">정의\u003c/b>와 발생 시기를 설명하는 문장입니다. \u003cb class=\"key\">민화\u003c/b>의 한 갈래임을 명시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : be + called (동사구) : \"~라고 불린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : folk painting (선행사) + that (주격 관계대명사) + was (동사) : \"인기 있었던\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This kind of painting, 이런 종류의 그림을. is called Munjado*, 문자도라고 하며. and it is a type of folk painting, 그것은 민화의 한 종류이다. that was popular, 인기 있었던. in the late Joseon dynasty, 조선 시대 후기에. 이 문장 전체를 해석하면, 이런 종류의 그림을 문자도라고 하며, 그것은 조선 시대 후기에 인기 있었던 민화의 한 종류이다.","hl":"m"},{"n":22,"text":"이 문장은 문자도가 무엇인지 정의하는 부분이에요. 조선 후기 백성들의 삶이 담긴 민화라는 점이 핵심이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 is called 부분을 보세요. 그림이 스스로를 부르는 게 아니라 사람들에 의해 불리는 것이니까 수동태를 썼어요. 두 번째로 that was popular는 앞에 있는 민화를 꾸며주는 주격 관계대명사절이에요. 관계대명사 뒤에 바로 동사가 나오니 주어 역할을 대신하고 있다는 걸 알 수 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도에는 \u003c/span>\u003cspan class=\"en\">In Munjado,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 있다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> usually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한자 하나가 \u003c/span>\u003cspan class=\"en\">a Chinese character\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물이나 사물들과 함께\u003c/span>\u003cspan class=\"en\">with some animals or objects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문자도에는 보통 한자 하나가 동물이나 사물들과 함께 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도의 시각적 \u003cb class=\"key\">구성 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 설명합니다. 한자와 \u003cb class=\"key\">동식물\u003c/b>이 어우러진 특징을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문\u003c/span> : There is + 단수 주어 (a Chinese character) : \"~가 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In Munjado, 문자도에는. there is usually, 보통 있다. a Chinese character, 한자 하나가. with some animals or objects, 동물이나 사물들과 함께. 이 문장 전체를 해석하면, 문자도에는 보통 한자 하나가 동물이나 사물들과 함께 나온다.","hl":"m"},{"n":25,"text":"문자도라는 그림이 구체적으로 어떻게 생겼는지 묘사하고 있어요. 글자와 그림이 합쳐진 형태죠.","hl":"mn"},{"n":26,"text":"여기서 There is 구문은 주어가 뒤에 온다는 점에 주의해야 해요. 주어인 a Chinese character가 단수이기 때문에 동사도 단수인 is를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여덟 개의 중 하나가 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">eight \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한자 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Chinese \u003c/span>\u003cspan class=\"tgt\">characters \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도에는 나온다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">appears\u003c/span> in Munjado.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문자도에는 여덟 개의 한자 중 하나가 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도에 사용되는 한자의 \u003cb class=\"key\">개수\u003c/b>와 선택 방식을 다룹니다. \u003cb class=\"key\">특정된 \u003c/b>\u003cb class=\"key\">8자\u003c/b> 중 하나가 그려짐을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">One of + 복수명사 + 단수동사\u003c/span> : One (주어) of + 복수명사 + appears (단수동사) : \"여덟 개의 한자 중 하나가 나타난다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"One of eight, 여덟 개의 중 하나가. Chinese characters, 한자. appears in Munjado, 문자도에는 나온다.. 이 문장 전체를 해석하면, 문자도에는 여덟 개의 한자 중 하나가 나온다.","hl":"m"},{"n":28,"text":"아무 글자나 그리는 게 아니라 정해진 여덟 글자가 있다는 정보를 주네요.","hl":"mn"},{"n":29,"text":"이 문장은 수 일치 문제가 자주 나와요. 주어의 진짜 핵심은 characters가 아니라 가장 앞에 있는 One이거든요. 그래서 동사에 s가 붙은 단수 형태인 appears를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 효(孝), 제(悌), 충(忠), 신(信), 예(禮), 의(義), 염(廉), 치(恥)이고,\u003c/span>\u003cspan class=\"en\">They are hyo (孝), je (悌), chung (忠), sin (信), ye (禮), ui (義), yeom (廉), and chi (恥),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들은 가치들을 나타낸다\u003c/span>\u003cspan class=\"en\">and they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">represent\u003c/span> the values\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조선 시대 사람들에게 중요했던.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> people of the Joseon dynasty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 효(孝), 제(悌), 충(忠), 신(信), 예(禮), 의(義), 염(廉), 치(恥)이고, 조선 시대 사람들에게 중요했던 가치들을 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도에 등장하는 여덟 가지 \u003cb class=\"key\">한자\u003c/b>가 무엇인지 구체적으로 나열하며 그 의미를 정의합니다. 이 글자들이 당시 사회에서 어떤 \u003cb class=\"key\">상징성\u003c/b>을 가졌으며, 조선 시대의 핵심 \u003cb class=\"key\">가치관\u003c/b>을 담고 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사의 현재형\u003c/span> : 주어(they) + represent [현재 시제 동사] + 목적어(the values) : \"나타낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(the values) + that [주격 관계대명사] + were [동사] : \"~에게 중요했던\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They are hyo (孝), je (悌), chung (忠), sin (信), ye (禮), ui (義), yeom (廉), and chi (恥), 그것들은 효(孝), 제(悌), 충(忠), 신(信), 예(禮), 의(義), 염(廉), 치(恥)이고. and they represent the values, 그리고 그것들은 가치들을 나타낸다. that were important to people of the Joseon dynasty, 조선 시대 사람들에게 중요했던.. 이 문장 전체를 해석하면, 그것들은 효(孝), 제(悌), 충(忠), 신(信), 예(禮), 의(義), 염(廉), 치(恥)이고, 조선 시대 사람들에게 중요했던 가치들을 나타낸다.","hl":"m"},{"n":31,"text":"이 문장은 문자도에 그려지는 여덟 글자가 각각 무엇인지 하나씩 짚어줍니다. 그리고 이 글자들이 단순히 한자가 아니라 조선 사회를 지탱하던 정신적 근간을 상징한다는 사실을 강조하며 글을 마무리하고 있어요.","hl":"mn"},{"n":32,"text":"어법 포인트를 두 가지 짚어 드릴게요. 첫 번째로 represent라는 동사는 앞에 나온 여덟 글자가 어떤 가치를 상징하는지 현재 시제로 설명합니다. 두 번째로 that were important to 부분은 주격 관계대명사절로 앞에 있는 values를 꾸며줍니다. 이때 선행사인 values가 복수이기 때문에 뒤따르는 비동사로 was가 아닌 were를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">문자도\u003c/b>는 한자와 관련 사물이 조화를 이루는 조선 후기의 \u003cb class=\"key\">민화\u003c/b>입니다.\u003c/li>\u003cli>잉어, 거문고, 부채 등은 \u003cb class=\"key\">효(孝)\u003c/b>라는 글자와 함께 등장하는 대표적인 소재입니다.\u003c/li>\u003cli>문자도에는 유교적 가르침을 담은 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">한자\u003c/b> 중 하나가 주로 쓰입니다.\u003c/li>\u003cli>이 그림들은 조선 시대 사람들이 가장 소중히 여겼던 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 상징합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Munjado is a unique form of folk painting that visually represents the core moral values of the Joseon dynasty by combining Chinese characters with symbolic objects.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">조선 시대 후기에 유행한 \u003cb class=\"key\">민화\u003c/b>의 한 종류인 \u003cb class=\"key\">문자도\u003c/b>는 한자와 사물을 결합하여 당시 사람들이 중요시했던 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 담아냈습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘은 조선의 가치관이 담긴 예술, 문자도에 대해 공부했습니다. 한자와 그림이 어우러진 이 특별한 민화가 당시 사람들에게 어떤 의미였는지 잘 이해하셨나요? 오늘 배운 핵심 내용을 다시 한번 복습하며 마무리하겠습니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
