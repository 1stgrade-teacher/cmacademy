iv><ul><li>문자도를 통해 아이들은 공동체 내에서의 올바른 관계 맺기를 배웠습니다.</li><li>가족(family) 간의 화합 중요성 학습</li><li>사회(society) 내에서 지켜야 할 조화와 예절 습득</li><li>핵심 키워드: 조화(harmony)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">munjado</td><td class=\"m\">문자도</td></tr><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr><tr><td class=\"w\">remind</td><td class=\"m\">상기시키다, 기억나게 하다</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attitude</td><td class=\"m\">태도</td></tr><tr><td class=\"w\">in particular</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">tool</td><td class=\"m\">도구</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr><tr><td class=\"w\">importance</td><td class=\"m\">중요성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문자도는</span><span class=\"en\"><b><span class=\"grammar-hl\">Munjado</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 이상의 것이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was much more</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than</span> a painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게</span><span class=\"en\"><b>to people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조선 시대의</span><span class=\"en\"><b>of the Joseon dynasty.</b></span></div></div><div class=\"lec-sent-ko\">문자도는 조선 시대 사람들에게 그림 그 훨씬 이상의 것이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문자도가 단순히 감상하는 그림이 아니라, 조선 시대 사람들의 삶에 깊숙이 관여하는 중요한 의미를 지녔음을 밝히며 글을 시작합니다. more than은 사전적으로 &#39;~이상&#39;이라는 뜻이지만, 여기서는 단순한 예술 작품의 범주를 넘어 실용적이고 교육적인 기능까지 수행했다는 점을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Munjado was much more than (관용표현): more than (~이상이다/단지 ~가 아니다)라는 의미의 관용구로, 여기서 much는 비교급 more를 강조하는 부사로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">munjado</td><td class=\"m\">문자도</td></tr><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 그들에게 상기시켰다</span><span class=\"en\"><b>It reminded them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 가치들을</span><span class=\"en\"><b>of important values</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크게 영향을 미친</span><span class=\"en\"><b><span class=\"grammar-hl\">that greatly influenced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 행동과</span><span class=\"en\"><b>their behaviors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태도에</span><span class=\"en\"><b>and attitudes.</b></span></div></div><div class=\"lec-sent-ko\">그것은 그들에게 자신들의 행동과 태도에 큰 영향을 미치는 중요한 가치를 상기시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;단순한 그림 이상의 것&#39;이 무엇인지 구체적으로 설명합니다. 문자도가 단순히 가르치는 교재를 넘어, 사람들의 일상적인 행동과 마음가짐을 올바르게 이끄는 &#39;가치관의 나침반&#39; 역할을 했음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that greatly influenced (관계대명사): that은 앞의 명사구(important values)를 선행사로 받는 주격 관계대명사입니다. 관계대명사 뒤에는 동사(influenced)가 바로 이어져 주어 역할을 수행하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">remind</td><td class=\"m\">상기시키다, 기억나게 하다</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다</td></tr><tr><td class=\"w\">behavior</td><td class=\"m\">행동</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">특히,</span><span class=\"en\"><b>In particular,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들에게는,</span><span class=\"en\"><b>for children,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문자도는</span><span class=\"en\"><b><span class=\"grammar-hl\">Munjado</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습 도구</span><span class=\"en\"><b><span class=\"grammar-hl\">a study tool</span>.</b></span></div></div><div class=\"lec-sent-ko\">특히 아이들에게 문자도는 학습 도구였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서는 일반적인 사람들에 대해 언급했다면, 이제 &#39;아이들&#39;이라는 구체적인 대상을 좁혀 문자도의 교육적 기능을 명시합니다. 이를 통해 문자도가 조선 시대의 교양 교육 현장에서 핵심적인 역할을 했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Munjado was a study tool 5형식(SVOC) 구조: 문장의 기본 구조로서, Munjado(주어) + was(동사) + a study tool(보어)로 이루어진 2형식 문장입니다. 명사 보어가 주어의 정체를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">munjado</td><td class=\"m\">문자도</td></tr><tr><td class=\"w\">in particular</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">tool</td><td class=\"m\">도구</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 통해,</span><span class=\"en\"><b><span class=\"grammar-hl\">Through it</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들은</span><span class=\"en\"><b>children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조선 시대의</span><span class=\"en\"><b>in the Joseon dynasty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배울 수 있었다</span><span class=\"en\"><b>could learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요성을</span><span class=\"en\"><b>the importance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조화의</span><span class=\"en\"><b>of harmony</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족과 사회에서 의</span><span class=\"en\"><b>in family and society.</b></span></div></div><div class=\"lec-sent-ko\">그것을 통해 조선 시대의 아이들은 가족과 사회에서 조화의 중요성을 배울 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;학습 도구&#39;의 구체적인 내용입니다. 문자도가 단순히 글자를 배우는 것이 아니라, 유교적 가치인 &#39;가정과 사회의 화합&#39;이라는 추상적인 덕목을 체득하게 하는 매개체였음을 설명하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Through it (관용표현): 전치사구로서 &#39;그것(문자도)을 통해서&#39;라는 의미로, 문장 전체를 수식하는 부사구 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dynasty</td><td class=\"m\">왕조</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr><tr><td class=\"w\">importance</td><td class=\"m\">중요성</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문자도는 조선 시대 사람들에게 단순한 그림을 넘어 삶의 가치를 일깨워주는 중요한 매체였다.</li><li>특히 문자도는 아이들에게 유교적 가치관을 가르치는 일종의 학습 도구로 활용되었다.</li><li>아이들은 문자도를 보며 가정과 사회에서 조화를 이루는 법을 배우며 성장했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Munjado functioned as a guide for moral behavior in the Joseon dynasty, and it helped children learn the importance of family and social harmony.</div>\n              <div class=\"lec-final-sum-ko\">문자도는 조선 시대에 도덕적 행동을 위한 지침서 역할을 했으며, 아이들이 가족과 사회의 조화를 배우도록 도왔다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=M
