, 문자에 담긴 이런 상징적 의미들이 우리 문화에서 어떤 중요한 역할을 하는지 미리 생각해보면 내용을 훨씬 더 재미있게 이해할 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문자도의 상징적 대상</div><ul><li>문자도(Munjado)에는 특정 글자와 관련된 상징적인 사물들이 등장한다.</li><li>충(忠) 자에 그려진 대나무(bamboo)</li><li>의(義) 자에 그려진 연꽃(lotus flowers)</li><li>핵심 키워드: 상징적 사물(symbolic objects)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02대나무의 상징성</div><ul><li>대나무가 가진 자연적 특성은 왕에 대한 충성심을 의미하게 되었다.</li><li>휘어지지 않는 성질(does not bend)</li><li>어떤 날씨에도 푸름을 유지함(stays green)</li><li>핵심 키워드: 충성(loyalty)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03연꽃의 상징성</div><ul><li>연꽃은 척박한 환경 속에서도 아름답게 피어나 정의를 상징한다.</li><li>진흙투성이 연못(muddy ponds)에서 자라남</li><li>어려움 속에서도 피어나는 아름다움(bloom beautifully)</li><li>고난에도 굴하지 않는 정의로운 의지(will to fight for justice)</li><li>핵심 키워드: 정의(justice)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 대상</td></tr><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr><tr><td class=\"w\">lotus</td><td class=\"m\">연꽃</td></tr><tr><td class=\"w\">bend</td><td class=\"m\">구부러지다, 휘다</td></tr><tr><td class=\"w\">stay</td><td class=\"m\">유지하다, 머무르다</td></tr><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr><tr><td class=\"w\">reason</td><td class=\"m\">이유, 근거</td></tr><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">loyalty</td><td class=\"m\">충성</td></tr><tr><td class=\"w\">in the case of</td><td class=\"m\">~의 경우(에는)</td></tr><tr><td class=\"w\">muddy</td><td class=\"m\">진흙투성이의, 진흙의</td></tr><tr><td class=\"w\">pond</td><td class=\"m\">연못</td></tr><tr><td class=\"w\">bloom</td><td class=\"m\">꽃이 피다</td></tr><tr><td class=\"w\">beautifully</td><td class=\"m\">아름답게</td></tr><tr><td class=\"w\">thus</td><td class=\"m\">따라서, 그러므로</td></tr><tr><td class=\"w\">will</td><td class=\"m\">의지</td></tr><tr><td class=\"w\">justice</td><td class=\"m\">정의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 예들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span> other examples</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징적인 사물들의</span><span class=\"en\"><b>of symbolic objects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문자도 속에는</span><span class=\"en\"><b>in Munjado.</b></span></div></div><div class=\"lec-sent-ko\">문자도에 있는 상징적인 사물의 또 다른 예가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 사례들 외에도 문자도에 담긴 또 다른 상징적 의미들을 소개하며 글의 범위를 확장하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문장 앞에 오면서 주어(other examples)와 동사(are)가 도치된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물건, 대상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 대나무이다</span><span class=\"en\"><b>They are bamboo</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림들 속에 있는</span><span class=\"en\"><b>in <span class=\"grammar-hl\">the paintings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;충(忠)&#39; 글자의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the character chung (忠)</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 연꽃이다</span><span class=\"en\"><b>and lotus flowers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;의(義)&#39; 그림 속에 있는</span><span class=\"en\"><b>in the <span class=\"grammar-hl\">paintings of ui (義)</span>.</b></span></div></div><div class=\"lec-sent-ko\">글자 &#39;충(忠)&#39; 그림에 있는 대나무와 &#39;의(義)&#39; 그림에 있는 연꽃이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 예고한 구체적인 사례를 나열합니다. 여기서 character는 사전적으로 &#39;성격, 인물&#39;이라는 뜻이지만, 여기서는 한자 글자 자체를 의미합니다. 시각적 그림 속에서 문자의 의미를 전달하는 핵심 소재임을 명확히 하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the paintings of the character chung (忠) (전치사구): 명사(paintings)를 수식하는 형용사구로, 어떤 그림인지 구체화한다.</div><div class=\"lec-gr-item\">paintings of ui (義) (전치사구): 앞의 paintings를 수식하며, 관용적으로 &#39;의(義)를 나타내는 그림&#39;이라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">character</td><td class=\"m\">글자, 문자</td></tr><tr><td class=\"w\">lotus</td><td class=\"m\">연꽃</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대나무는</span><span class=\"en\"><b>Bamboo</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구부러지지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">does not bend</span>.</b></span></div></div><div class=\"lec-sent-ko\">대나무는 구부러지지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대나무의 물리적 성질을 언급하며, 이것이 왜 충성이라는 상징으로 이어지는지에 대한 논리적 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">does not bend 일반동사의 부정: 일반동사(bend)의 부정형으로, 조동사 do의 3인칭 단수형(does) + not + 동사원형 구조를 사용한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bend</td><td class=\"m\">구부러지다, 휘다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 푸르게 머무른다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">stays green</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 종류의</span><span class=\"en\"><b>in all kinds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨 속에서도</span><span class=\"en\"><b>of weather.</b></span></div></div><div class=\"lec-sent-ko\">그것은 어떤 날씨에서도 푸르름을 유지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에 이어 대나무의 또 다른 특징을 설명합니다. stays는 &#39;머무르다&#39;라는 뜻이지만, 여기서는 &#39;어떠한 상태를 그대로 유지하다&#39;라는 의미로 쓰였습니다. 변치 않는 대나무의 모습을 강조하여 &#39;충성&#39;이라는 덕목과 연결 짓기 위해 선택된 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stays green 2형식 구조: 주어(It) + 동사(stays) + 보어(green, 형용사) 구조로, 주어의 상태가 지속됨을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay</td><td class=\"m\">유지하다, 머무르다</td></tr><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 이유들 때문에,</span><span class=\"en\"><b><span class=\"grammar-hl\">For these reasons</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대나무는 상징하게 되었다</span><span class=\"en\"><b>bamboo came <span class=\"grammar-hl\">to symbolize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충성심을</span><span class=\"en\"><b>loyalty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왕에 대한</span><span class=\"en\"><b>to the king.</b></span></div></div><div class=\"lec-sent-ko\">이런 이유로, 대나무는 왕에 대한 충성심을 상징하게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 대나무의 &#39;강인함&#39;과 &#39;변치 않음&#39;이라는 특징이 어떻게 &#39;충(忠)&#39;이라는 사회적 덕목으로 치환되는지 인과관계로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For these reasons (관용표현): &#39;이러한 이유들로&#39;라는 의미의 전치사구로, 앞 문장 내용을 근거로 제시하는 부사적 역할을 한다.</div><div class=\"lec-gr-item\">to symbolize (to부정사): 동사(came) 뒤에서 목적을 나타내는 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reason</td><td class=\"m\">이유, 근거</td></tr><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다</td></tr><tr><td class=\"w\">loyalty</td><td class=\"m\">충성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경우에 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">In the case</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연꽃들의,</span><span class=\"en\"><b><span class=\"grammar-hl\">of lotus flowers</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 자란다</span><span class=\"en\"><b><span class=\"grammar-hl\">they grow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진흙투성이 연못에서</span><span class=\"en\"><b>in muddy ponds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 여전히 꽃을 피운다</span><span class=\"en\"><b>but still bloom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름답게</span><span class=\"en\"><b>beautifully.</b></span></div></div><div class=\"lec-sent-ko\">연꽃의 경우, 그것들은 진흙투성이의 연못에서 자라지만 그럼에도 아름답게 꽃을 피운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화제를 &#39;의(義)&#39;를 상징하는 연꽃으로 전환합니다. &#39;진흙&#39;이라는 열악한 환경과 &#39;아름다운 꽃&#39;이라는 결과를 대조시켜 연꽃의 특별함을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In the case of lotus flowers (관용표현): &#39;~의 경우에 있어서&#39;라는 의미로, 화제를 전환하거나 특정 대상을 제시할 때 사용하는 전치사구다.</div><div class=\"lec-gr-item\">they grow 1형식 구조: 주어(they) + 자동사(grow) 구조로 목적어 없이 완전한 문장을 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lotus</td><td class=\"m\">연꽃</td></tr><tr><td class=\"w\">in the case of</td><td class=\"m\">~의 경우(에는)</td></tr><tr><td class=\"w\">muddy</td><td class=\"m\">진흙투성이의, 진흙의</td></tr><tr><td class=\"w\">pond</td><td class=\"m\">연못</td></tr><tr><td class=\"w\">bloom</td><td class=\"m\">꽃이 피다</td></tr><tr><td class=\"w\">beautifully</td><td class=\"m\">아름답게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 그래서 되었다</span><span class=\"en\"><b>They thus became</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징이</span><span class=\"en\"><b>a symbol</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 사람의 의지에 대한</span><span class=\"en\"><b>of <span class=\"grammar-hl\">a person’s will</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정의를 위해 싸우려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to fight for justice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려움들에도 불구하고</span><span class=\"en\"><b>despite difficulties.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그 꽃들은 어려움에도 불구하고 정의를 위해 싸우는 한 사람의 의지를 상징하게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연꽃의 생태적 특징을 인간의 의지라는 추상적 개념으로 연결하며 글을 마무리합니다. 여기서 will은 &#39;할 것이다&#39;라는 조동사가 아니라, &#39;굳은 의지&#39;라는 명사로 쓰였습니다. 연꽃의 생명력을 인간의 도덕적 결단력과 일치시켜 상징의 의미를 확고히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a person’s will to fight for justice (to부정사): 명사(will)를 뒤에서 수식하는 형용사적 용법으로, &#39;정의를 위해 싸우려는 의지&#39;라는 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thus</td><td class=\"m\">따라서, 그러므로</td></tr><tr><td class=\"w\">will</td><td class=\"m\">의지</td></tr><tr><td class=\"w\">justice</td><td class=\"m\">정의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문자도에는 &#39;충&#39;과 &#39;의&#39;를 상징하는 사물들이 등장한다.</li><li>대나무는 굽히지 않고 변치 않는 성질 때문에 &#39;왕에 대한 충성&#39;을 의미한다.</li><li>연꽃은 진흙 속에서도 아름답게 피어나기에 &#39;어려움 속에서 정의를 추구하는 의지&#39;를 상징한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Bamboo symbolizes loyalty because it remains green and strong in any weather, while the lotus represents the will to fight for justice as it blooms beautifully even in mud.</div>\n              <div class=\"lec-final-sum-ko\">대나무는 어떤 날씨에도 푸르고 강인하여 충성을 상징하며, 연꽃은 진흙 속에서도 아름답게 피어나 정의를 위해 싸우려는 의지를 상징한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":"main"},{"audio":"./4_audio/9.mp3","hl":"meaning"},{"audio":"./4_audio/10.mp3","hl":"grammar"}],[{"audio":"./4_audio/11.mp3","hl":"main"},{"audio":"./4_audio/12.mp3","hl":"meaning"},{"audio":"./4_audio/13.mp3","hl":"grammar"}],[{"audio":"./4_audi
