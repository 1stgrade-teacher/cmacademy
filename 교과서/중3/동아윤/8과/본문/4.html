@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 8과 본문4","audioDir":"4_audio","preview":false,"count":23,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Munjado: More Than Just Art in the Joseon Dynasty\u003c/h1>\u003ch2>문자도: 조선 시대, 단순한 예술 그 이상의 의미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>조선 시대 \u003cb class=\"key\">문자도\u003c/b>는 단순한 그림을 넘어 사람들의 행동과 태도에 영향을 주는 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 가르치는 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">도구\u003c/b>이자 지침서였습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Munjado served as an essential educational medium to instill moral values and promote social harmony during the Joseon dynasty.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 조선 시대의 특별한 예술이자 교육 도구였던 문자도에 대해 함께 알아보겠습니다. 이 지문은 문자도가 단순한 그림을 넘어 사람들의 가치관과 행동에 어떤 영향을 주었는지 잘 보여주고 있죠. 문자도를 통해 우리 조상들이 중요하게 생각했던 가치가 무엇인지 요지와 함께 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">문자도는 유교의 핵심 덕목인 효(孝), 제(悌), 충(忠) 등 여덟 글자를 그림으로 표현한 \u003cb class=\"key\">유교적 \u003c/b>\u003cb class=\"key\">채색화\u003c/b>입니다. 각 글자의 획 속에 그 의미와 관련된 고사나 상징물을 그려 넣어, 글자를 모르는 사람들도 그 뜻을 쉽게 이해할 수 있게 했습니다. 이는 오늘날 정보를 시각적으로 전달하는 \u003cb class=\"key\">인포그래픽(Infographic)\u003c/b>과 매우 유사한 기능을 수행했습니다. 조선 시대 사람들은 이 그림을 병풍으로 제작해 일상 공간에 두며 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">지침\u003c/b>으로 삼았습니다. 마치 현대인들이 거실에 가족사진이나 \u003cb class=\"key\">가훈\u003c/b>을 걸어두고 가족의 화목을 다짐하는 것과 비슷한 풍습이라고 볼 수 있습니다. 결국 문자도는 생활 공간을 꾸미는 예술품인 동시에 공동체의 질서를 유지하는 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">매체\u003c/b>였습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 쌓아볼까요? 문자도는 유교의 도덕적 덕목을 글자와 그림으로 합쳐 만든 유교적 채색화예요. 글자의 모양 속에 그 뜻과 관련된 이야기를 담았기 때문에, 마치 오늘날의 인포그래픽처럼 정보를 시각적으로 전달하는 역할을 했죠. 사람들은 이 그림을 보며 올바른 삶의 태도를 배웠는데, 이는 우리 집에 걸린 가훈이나 가족사진이 주는 메시지와 비슷하다고 이해하면 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문자도의 본질적 정의\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>문자도가 단순한 예술 작품을 넘어 조선 시대 사람들에게 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">의미\u003c/b>가 있었음을 제시합니다. 단순히 보는 즐거움을 주는 \u003cb class=\"key\">그림 \u003c/b>\u003cb class=\"key\">이상의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 지녔음을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가치관 형성의 매개체\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>문자도가 사람들에게 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 상기시키는 역할을 했음을 설명합니다. 이러한 가치들이 사람들의 실제 \u003cb class=\"key\">행동과 \u003c/b>\u003cb class=\"key\">태도\u003c/b>에 깊은 영향을 미쳤음을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아이들을 위한 교육적 활용\u003csmall>예시 및 결론 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>특히 아이들에게는 효과적인 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로 쓰였음을 밝힙니다. 이를 통해 가족과 사회의 \u003cb class=\"key\">조화와 \u003c/b>\u003cb class=\"key\">협력\u003c/b>이라는 핵심 가치를 자연스럽게 학습하게 되었음을 설명하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 문자도의 정의에서 시작해 구체적인 교육적 활용으로 이어지는 짜임새 있는 구성을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장은 문자도의 정의를 내리며 시작해요. 조선 시대 사람들에게 문자도는 단순한 그림 그 이상의 가치를 가진 존재였다고 강조하며 독자의 관심을 집중시키고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 그 구체적인 기능을 설명합니다. 사람들에게 중요한 가치를 상기시키고, 그것이 실제 행동과 태도에 큰 영향을 미쳤다는 점을 짚어주고 있어요.","hl":"f1"},{"n":6,"text":"마지막 세 번째와 네 번째 문장에서는 교육적 활용 사례를 들고 있어요. 특히 아이들에게는 학습 도구가 되어 가족과 사회의 조화라는 중요한 가치를 가르치는 매개체가 되었다고 마무리합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 문자도가 그림 그 이상의 가치를 지녔다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 먼저 제시합니다. 이후 문장들에서 그 가치가 무엇인지, 어떤 영향을 주었는지에 대한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 설명하는 구조입니다. 특히 후반부에서는 아이들의 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 통해 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>much more than (1)\u003c/b>\u003cspan>비교를 통한 강조\u003c/span>\u003cb>In particular (3)\u003c/b>\u003cspan>구체적 사례 도입\u003c/span>\u003cb>Through it (4)\u003c/b>\u003cspan>수단과 결과 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">much more than a painting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">important values\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">study tool\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">importance of harmony\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 지문의 전개 방식은 전형적인 주장과 근거의 형태를 띠고 있어요. 첫 번째 문장에서 핵심 주장을 먼저 던지는 두괄식 패턴을 사용하고 있죠. 이렇게 결론을 먼저 말하면 글의 중심 내용을 파악하기가 훨씬 수월해집니다.","hl":"ty"},{"n":8,"text":"글의 신호어를 살펴보면, 첫 번째 문장의 much more than이라는 표현이 문자도의 중요성을 강조하고 있어요. 그리고 세 번째 문장의 In particular는 구체적인 예시인 아이들의 경우로 범위를 좁혀주는 역할을 하죠. 마지막 문장의 Through it은 앞서 말한 학습 도구라는 수단을 결과와 연결해 주는 중요한 연결 고리입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>much more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 훨씬 더 많은/이상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>Joseon dynasty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조선 시대\u003c/span>\u003c/div>\u003cdiv>\u003cb>remind A of B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게 B를 상기시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>greatly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>크게, 대단히\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>attitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>in particular\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>study tool\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학습 도구\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>importance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중요성\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조화\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>remind\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상기시키다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 꼭 기억해야 할 단어는 remind A of B라는 표현이에요. A에게 B를 상기시키다라는 뜻으로 수능에서도 자주 나오죠. 그리고 influence는 영향을 미치다라는 동사로, behavior 행동이나 attitude 태도와 함께 쓰여서 실천적인 변화를 의미하고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">value\u003c/b>\u003cspan class=\"m\">가치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">principle\u003c/span>\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthlessness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">behavior\u003c/b>\u003cspan class=\"m\">행동\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conduct\u003c/span>\u003cspan class=\"s\">action\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmony\u003c/b>\u003cspan class=\"m\">조화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unity\u003c/span>\u003cspan class=\"s\">accord\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conflict\u003c/span>\u003cspan class=\"a\">discord\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remind\u003c/b>\u003cspan class=\"m\">상기시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prompt\u003c/span>\u003cspan class=\"s\">jog memory\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 챙겨볼까요? 가치를 뜻하는 value는 standard나 principle로 바꿔 쓸 수 있어요. 조화를 뜻하는 harmony는 unity나 accord와 비슷한 의미지만, 반대로 갈등을 뜻하는 conflict나 discord와는 대조되는 개념이니 꼭 함께 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도는 ~였다\u003c/span>\u003cspan class=\"en\">Munjado was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 훨씬 이상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림\u003c/span>\u003cspan class=\"en\">a painting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조선 시대 사람들에게\u003c/span>\u003cspan class=\"en\">to people of the Joseon dynasty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문자도는 조선 시대 사람들에게 그림 그 훨씬 이상의 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도가 단순히 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">감상\u003c/b>의 대상일 뿐만 아니라 조선 사회의 중요한 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 담고 있었음을 소개하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : much [부사] + more [비교급] + than [접속사/전치사] : \"그 훨씬 이상의\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Munjado was, 문자도는 ~였다. much more than, 그 훨씬 이상. a painting, 그림. to people of the Joseon dynasty, 조선 시대 사람들에게. 이 문장 전체를 해석하면, 문자도는 조선 시대 사람들에게 그림 그 훨씬 이상의 것이었다.","hl":"m"},{"n":12,"text":"문자도가 조선 사람들에게 어떤 의미였는지 알려주는 첫 문장이에요. 단순히 감상하는 그림을 넘어 더 깊은 가치가 있었다는 점을 알려주죠.","hl":"mn"},{"n":13,"text":"여기서 much는 more라는 비교급을 강조해서 훨씬 더라는 뜻으로 쓰였어요. 시험에서 very로 바꿔 나오면 틀린다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 그들에게 상기시켰다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reminded \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 가치를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> important values\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 영향을 미치는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">greatly \u003c/span>\u003cspan class=\"tgt\">influenced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 행동과 태도에\u003c/span>\u003cspan class=\"en\">their behaviors and attitudes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 그들에게 자신들의 행동과 태도에 큰 영향을 미치는 중요한 가치를 상기시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도가 사람들의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">규범\u003c/b>과 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 결정하는 기준 역할을 했음을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">remind A of B\u003c/span> : remind [동사] + A [목적어] + of [전치사] + B [명사구] : \"그들에게 ~을 상기시켰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : values [선행사] + that [주격 관계대명사] + influenced [동사] : \"큰 영향을 미치는 가치\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"It reminded them, 그것은 그들에게 상기시켰다. of important values, 중요한 가치를. that greatly influenced, 큰 영향을 미치는. their behaviors and attitudes, 자신들의 행동과 태도에. 이 문장 전체를 해석하면, 그것은 그들에게 자신들의 행동과 태도에 큰 영향을 미치는 중요한 가치를 상기시켰다.","hl":"m"},{"n":15,"text":"문자도가 단순히 벽에 걸린 장식이 아니라, 사람들의 일상적인 행동 하나하나에 영향을 주는 도덕적 나침반이었다는 설명이에요.","hl":"mn"},{"n":16,"text":"중요한 어법이 두 개나 있어요. 첫 번째로 remind A of B 구조를 써서 그들에게 가치를 상기시켰다고 표현했고, 두 번째로 그 가치가 어떤 것인지 that이라는 주격 관계대명사로 길게 설명해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">particular\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들에게\u003c/span>\u003cspan class=\"en\">for children,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도는 ~였다\u003c/span>\u003cspan class=\"en\">Munjado was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습 도구\u003c/span>\u003cspan class=\"en\">a study tool.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">특히 아이들에게 문자도는 학습 도구였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 성인뿐만 아니라 \u003cb class=\"key\">아이들\u003c/b>에게도 문자도가 교육적인 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">수단\u003c/b>으로 활용되었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(부사적 용법)\u003c/span> : In + particular [형용사] : \"특히\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"In particular, 특히. for children, 아이들에게. Munjado was, 문자도는 ~였다. a study tool, 학습 도구. 이 문장 전체를 해석하면, 특히 아이들에게 문자도는 학습 도구였다.","hl":"m"},{"n":18,"text":"아이들의 사례를 들어 문자도의 교육적 기능을 더 구체적으로 보여주는 문장입니다. 아이들에겐 교과서 같은 역할을 했나 봐요.","hl":"mn"},{"n":19,"text":"첫 번째에 나오는 In particular는 문장 전체를 수식하며 특히라는 뜻으로 범위를 좁혀주는 역할을 해요. 뒤에 나오는 children을 강조하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 통해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Through \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조선 시대의 아이들은\u003c/span>\u003cspan class=\"en\">children in the Joseon dynasty\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배울 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조화의 중요성을\u003c/span>\u003cspan class=\"en\">the importance of harmony\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족과 사회에서.\u003c/span>\u003cspan class=\"en\">in family and society.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 통해 조선 시대의 아이들은 가족과 사회에서 조화의 중요성을 배울 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도가 조선 시대 아이들에게 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로서 기능했음을 설명합니다. 가족과 공동체 전체의 안녕을 위해 필수적인 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>인 조화의 중요성을 전달하는 역할을 했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 through와 대명사\u003c/span> : Through [전치사] + it [대명사/목적어] : \"그것을 통해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 과거형\u003c/span> : could [조동사 과거] + learn [동사원형] : \"배울 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Through it, 그것을 통해. children in the Joseon dynasty, 조선 시대의 아이들은. could learn, 배울 수 있었다. the importance of harmony, 조화의 중요성을. in family and society, 가족과 사회에서.. 이 문장 전체를 해석하면, 그것을 통해 조선 시대의 아이들은 가족과 사회에서 조화의 중요성을 배울 수 있었다.","hl":"m"},{"n":21,"text":"이 문장은 문자도가 아이들에게 구체적으로 어떤 역할을 했는지 설명하고 있어요. 단순히 그림을 감상하는 것을 넘어 가족과 사회의 조화라는 공동체의 핵심 가치를 가르치는 교육적인 도구로 쓰였다는 점을 강조하죠.","hl":"mn"},{"n":22,"text":"첫 번째로 Through it에서 it은 앞에 나온 문자도를 가리키는 대명사예요. 전치사 Through와 함께 쓰여서 무엇을 통해라는 수단의 의미를 나타내죠. 두 번째로 could learn은 과거의 가능성이나 능력을 나타내는 조동사 표현이에요. 문장의 시제가 조선 시대라는 과거를 배경으로 하고 있어서 can 대신 could를 사용했습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>문자도는 조선 시대 사람들에게 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">예술품\u003c/b> 이상의 실용적인 가치를 지니고 있었습니다.\u003c/li>\u003cli>이 그림은 사람들에게 일상 속에서 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 끊임없이 환기해 주는 역할을 했습니다.\u003c/li>\u003cli>특히 아이들에게는 교육적 목적의 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로 활용되어 핵심 가치를 전달했습니다.\u003c/li>\u003cli>이를 통해 조선 사회의 근간인 \u003cb class=\"key\">가족과 \u003c/b>\u003cb class=\"key\">사회의 \u003c/b>\u003cb class=\"key\">조화\u003c/b>를 배우고 실천하게 했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Munjado served as an essential educational medium to instill moral values and promote social harmony during the Joseon dynasty.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">조선 시대 \u003cb class=\"key\">문자도\u003c/b>는 단순한 그림을 넘어 사람들의 행동과 태도에 영향을 주는 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 가르치는 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">도구\u003c/b>이자 지침서였습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"자, 오늘은 문자도가 조선 시대 사람들에게 가치관의 지침서이자 아이들의 학습 도구였다는 점을 공부했습니다. 가족과 사회의 조화를 중요시했던 우리 조상들의 지혜가 담긴 그림이었네요. 오늘 배운 중요한 단어들과 구조를 다시 한번 복습하면서 여러분의 것으로 만드길 바랍니다. 수고하셨어요.","hl":null}]}]});</script></body></html>
