8Gs5bP0v9+33jsmkmr+8rvyVtPy7W2R/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Symbolic Significance of Carp in Munjado<small>문자도 속 잉어가 가진 상징적 의미</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">민화의 한 종류인 문자도(Munjado)는 글자 안에 그와 관련된 그림을 함께 그려 넣어 글자의 의미를 시각적으로 전달하는 한국의 전통 회화 양식이에요. 이 글에 등장하는 효(hyo)는 유교 사회에서 가장 중요하게 여겼던 가장 근본적인 도덕 가치인 효도를 뜻하는데, 우리 조상들은 부모님을 향한 깊은 사랑을 표현하기 위해 일상 속 사물이나 동물의 상징성을 적극적으로 활용했답니다. 특히 잉어는 고전 설화 속에서 부모님의 병을 낫게 해주는 기적적인 존재로 묘사되곤 하는데, 이는 단순히 물고기를 넘어 부모를 위한 지극한 정성과 헌신을 상징하게 되었어요. 즉, 문자도는 단순히 예쁜 그림이 아니라 그 당시 사람들이 중요하게 생각했던 가치관과 철학을 예술이라는 도구로 표현한 소통의 방식이라고 이해하면 지문을 훨씬 쉽게 읽을 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문자도의 특징</div><ul><li>문자도에 등장하는 동물이나 사물은 단순한 장식이 아니라 특별한 의미를 담고 있다.</li><li>그림 속 대상의 상징성 (symbolic meaning)</li><li>효(hyo) 그림 속 잉어의 의미: 부모님에 대한 공경 (respect)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02효 이야기의 시작</div><ul><li>병든 어머니를 모시던 한 남자의 간절한 이야기가 전해진다.</li><li>어머니를 극진히 모시는 아들 (man and his old mother)</li><li>추운 겨울 어머니의 병환과 신선한 생선에 대한 갈망 (wish for fresh fish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기적적인 상황</div><ul><li>강이 얼어 물고기를 잡을 수 없던 남자가 하늘에 도움을 간청한다.</li><li>꽁꽁 얼어붙은 강물 (frozen river)로 인한 좌절</li><li>하늘을 향한 간절한 기도 (cried out to the sky)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결과와 회복</div><ul><li>하늘의 도움으로 잉어를 얻게 된 남자는 어머니의 병을 낫게 한다.</li><li>얼음이 녹으며 나타난 세 마리의 잉어 (carp)</li><li>잉어 요리를 통한 어머니의 병환 완치 (got well)</li><li>핵심 키워드: 효(hyo), 상징(symbolic), 기적(miracle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">animal</td><td class=\"m\">동물</td></tr><tr><td class=\"w\">object</td><td class=\"m\">사물</td></tr><tr><td class=\"w\">decoration</td><td class=\"m\">장식(품)</td></tr><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인</td></tr><tr><td class=\"w\">carp</td><td class=\"m\">잉어</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림, 회화</td></tr><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존경</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">따르다, (이야기 등이) 이어지다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">once upon a time</td><td class=\"m\">옛날 옛적에</td></tr><tr><td class=\"w\">ill</td><td class=\"m\">아픈</td></tr><tr><td class=\"w\">wonderful</td><td class=\"m\">아주 좋은, 멋진</td></tr><tr><td class=\"w\">fresh</td><td class=\"m\">신선한</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr><tr><td class=\"w\">frozen</td><td class=\"m\">얼어붙은</td></tr><tr><td class=\"w\">impossible</td><td class=\"m\">불가능한</td></tr><tr><td class=\"w\">catch</td><td class=\"m\">잡다</td></tr><tr><td class=\"w\">disappointed</td><td class=\"m\">실망한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문자도에 있는 동물이나 사물은</span><span class=\"en\"><b>The animals or objects in Munjado</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순히 장식이 아니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> not just decorations.</b></span></div></div><div class=\"lec-sent-ko\">문자도에 있는 동물이나 사물은 단순히 장식이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 문자도에 대한 일반적인 정의를 내린 후, 그것이 단순한 그림 이상의 의미를 지닌다는 주제를 제시하며 글을 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(The animals or objects) + be동사(are) + 보어(decorations) 구조로, 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">animal</td><td class=\"m\">동물</td></tr><tr><td class=\"w\">object</td><td class=\"m\">사물</td></tr><tr><td class=\"w\">decoration</td><td class=\"m\">장식(품)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 종종</span><span class=\"en\"><b>They often <span class=\"grammar-hl\">are</span> symbolic.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징적이다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것들은 종종 상징적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 앞 문장에서 &#39;단순한 장식이 아니다&#39;라고 한 이유를 &#39;상징적&#39;이라는 개념을 통해 구체적으로 보충 설명합니다. 여기서 symbolic은 사전적으로 &#39;상징의&#39;라는 뜻이지만, 문맥상 그림 속 소재들이 어떤 가치나 교훈을 대신해서 보여주는 ‘함축적 의미’를 담고 있음을 강조합니다. 필자는 이 단어를 선택함으로써 문자도가 단순히 예쁘게 보이려고 그린 것이 아니라 깊은 뜻을 전하려는 목적이 있음을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(They) + be동사(are) + 보어(symbolic) 구조로, 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;효&#39; 그림에 있는 잉어는</span><span class=\"en\"><b>carp <span class=\"grammar-hl\">in the paintings of hyo</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징한다</span><span class=\"en\"><b>symbolize respect for parents</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부모님에 대한 공경을</span><span class=\"en\"><b>because of an old story.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 옛이야기로 인해</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">예를 들어, &#39;효&#39; 그림에 있는 잉어는 한 옛이야기로 인해 부모님에 대한 공경을 상징한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: &#39;상징적&#39;이라는 앞 문장의 내용을 &#39;효도 그림 속 잉어&#39;라는 구체적인 사례를 통해 증명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the paintings of hyo (전치사구): 명사(carp)를 뒤에서 수식하는 형용사구 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carp</td><td class=\"m\">잉어</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림, 회화</td></tr><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이야기는 흘러간다</span><span class=\"en\"><b>The story <span class=\"grammar-hl\">goes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음과 같다.</span><span class=\"en\"><b>as follows.</b></span></div></div><div class=\"lec-sent-ko\">그 이야기는 다음과 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: &#39;옛날이야기&#39;에 대한 구체적인 내용을 본격적으로 시작하기 위해 독자의 주의를 환기하는 안내 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">goes 1형식 구조: 주어(The story) + 동사(goes)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">따르다, (이야기 등이) 이어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">옛날 옛적에</span><span class=\"en\"><b>Once upon a time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 남자가 살고 있었다</span><span class=\"en\"><b>a man <span class=\"grammar-hl\">lived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나이 든 어머니와</span><span class=\"en\"><b><span class=\"grammar-hl\">with his old mother</span>.</b></span></div></div><div class=\"lec-sent-ko\">옛날 옛적에 한 남자가 나이 든 어머니와 살고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 이야기의 도입부로, 주요 등장인물인 아들과 어머니를 소개하며 서사를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lived with his old mother 1형식 구조: 주어(a man) + 동사(lived) + 부사구(with his old mother)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">once upon a time</td><td class=\"m\">옛날 옛적에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 겨울,</span><span class=\"en\"><b>One winter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남자의 어머니는</span><span class=\"en\"><b>the man’s mother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">병이 들어서</span><span class=\"en\"><b>became ill</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무 것도 먹을 수 없었다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">couldn’t eat</span> anything.</b></span></div></div><div class=\"lec-sent-ko\">어느 겨울, 남자의 어머니는 병이 들어서 아무 것도 먹을 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 이야기가 전개되는 배경인 &#39;겨울&#39;과 문제 상황인 &#39;어머니의 병&#39;을 제시하여 갈등의 실마리를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn’t eat 조동사 구문: 조동사(could)와 부정어(n&#39;t)가 결합하여 동사원형(eat)을 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ill</td><td class=\"m\">아픈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무척 추운 어느 날,</span><span class=\"en\"><b>On one very cold day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어머니는</span><span class=\"en\"><b>the mother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남자에게 말했다</span><span class=\"en\"><b>said to the man, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“정말 좋겠구나</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It would be wonderful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신선한 물고기를 먹을 수 있다면.</span><span class=\"en\"><b><span class=\"grammar-hl\">if I could eat fresh fish</span>.</b></span></div></div><div class=\"lec-sent-ko\">무척 추운 어느 날, 어머니는 남자에게 말했다. “신선한 물고기를 먹을 수 있다면 정말 좋겠구나.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 어머니의 간절한 소망을 직접 화법으로 전달하여, 아들이 물고기를 구하러 가야 하는 정당성과 감정적 동기를 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It would be wonderful if I could eat fresh fish (가주어): 진주어: 가주어(It)가 문장 맨 앞에 쓰였고, 뒤의 절(if I could eat fresh fish)이 진주어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wonderful</td><td class=\"m\">아주 좋은, 멋진</td></tr><tr><td class=\"w\">fresh</td><td class=\"m\">신선한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자는</span><span class=\"en\"><b>The man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강으로 나갔지만,</span><span class=\"en\"><b>went out to the river,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강은</span><span class=\"en\"><b>but it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 얼어붙어 있었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was completely frozen</span>.</b></span></div></div><div class=\"lec-sent-ko\">남자는 강으로 나갔지만, 강은 완전히 얼어붙어 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 물고기를 구하려는 아들의 노력과 이를 가로막는 &#39;꽁꽁 언 강&#39;이라는 장애물을 대립시켜 긴장감을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was completely frozen (수동태): be동사(was)+p.p.(frozen) 구조입니다. freeze는 타동사인데 목적어가 없어서 수동구조 was frozen 형태로 쓴다. 기본구조: freeze + O (얼리다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr><tr><td class=\"w\">frozen</td><td class=\"m\">얼어붙은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불가능했다</span><span class=\"en\"><b><span class=\"grammar-hl\">was impossible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가</span><span class=\"en\"><b><span class=\"grammar-hl\">for him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 물고기라도 잡는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to catch any fish</span>.</b></span></div></div><div class=\"lec-sent-ko\">그가 어떤 물고기라도 잡는 것은 불가능했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 앞 문장의 상황을 부연하여, 아들의 노력이 한계에 부딪혔음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was impossible for him to catch any fish (가주어): 진주어: 가주어(It)가 문장 맨 앞에 쓰였고, 뒤의 to부정사구(to catch any fish)가 진주어 역할을 합니다. 의미상 주어(for him)가 포함되어 있습니다.</div><div class=\"lec-gr-item\">to catch (to부정사): 진주어 구문 내부에서 명사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impossible</td><td class=\"m\">불가능한</td></tr><tr><td class=\"w\">catch</td><td class=\"m\">잡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자는</span><span class=\"en\"><b>The man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몹시 낙담해서</span><span class=\"en\"><b><span class=\"grammar-hl\">was so disappointed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에 대고 외쳤다</span><span class=\"en\"><b><span class=\"grammar-hl\">that he cried out</span> to the sky,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“제가 어떻게 해야 하나요?</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What should I do?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제발 저를 도와주세요.”</span><span class=\"en\"><b>Please help me.”</b></span></div></div><div class=\"lec-sent-ko\">남자는 몹시 낙담해서 하늘에 대고 외쳤다. “제가 어떻게 해야 하나요? 제발 저를 도와주세요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 인간적인 노력이 실패했을 때의 절망감을 표현하며, 이야기가 초자연적인 해결책으로 전환되는 계기를 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was so disappointed that he cried out 관용표현(so ~ that ~): &#39;매우 ~해서 그 결과 ~하다&#39;라는 결과를 나타내는 부사절 구조입니다.</div><div class=\"lec-gr-item\">disappointed (과거분사): 주어(The man)의 상태를 설명하는 보어로 쓰였습니다.</div><div class=\"lec-gr-item\">cried out (관용표현(구동사)): &#39;소리치다&#39;라는 의미를 가진 하나의 동사처럼 기능합니다.</div><div class=\"lec-gr-item\">What should I do? (간접의문문): 의문사(What)를 포함한 질문 형태가 인용절로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disappointed</td><td class=\"m\">실망한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러자</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼음이 녹았고,</span><span class=\"en\"><b>the ice <span class=\"grammar-hl\">melted</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잉어 세 마리가</span><span class=\"en\"><b>and three carp</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 물 밖으로 나왔다.</span><span class=\"en\"><b>suddenly came out of the water.</b></span></div></div><div class=\"lec-sent-ko\">그러자 얼음이 녹았고, 잉어 세 마리가 갑자기 물 밖으로 나왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 아들의 효심에 감동한 하늘이 도움을 주는 기적적인 해결 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">melted 1형식 구조: 주어(the ice) + 동사(melted)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carp</td><td class=\"m\">잉어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자는</span><span class=\"en\"><b>The man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집으로 돌아가서</span><span class=\"en\"><b><span class=\"grammar-hl\">went back</span> home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 물고기들을 요리해 드렸다</span><span class=\"en\"><b>and cooked the fish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어머니에게</span><span class=\"en\"><b>for his mother.</b></span></div></div><div class=\"lec-sent-ko\">남자는 집으로 돌아가서 어머니에게 그 물고기들을 요리해 드렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 목표를 달성한 아들이 어머니를 정성껏 돌보는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went back 1형식 구조: 주어(The man) + 동사(went) + 부사(back)의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러자</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 어머니는</span><span class=\"en\"><b>his mother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">병이 나았다.</span><span class=\"en\"><b><span class=\"grammar-hl\">got well</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러자 그의 어머니는 병이 나았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과의 관계: 결말 부분으로, 효심이 낳은 긍정적인 결과를 보여주며 잉어가 왜 &#39;효&#39;의 상징이 되었는지에 대한 근거를 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got well 2형식 구조: 주어(his mother) + 동사(got) + 보어(well)의 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문자도는 단순한 장식화가 아니라 특정 가치를 담고 있는 상징적인 그림이다.</li><li>효(孝)를 상징하는 잉어는 병든 어머니를 위해 얼어붙은 강에서 기적적으로 물고기를 구한 아들의 설화에서 유래했다.</li><li>이처럼 문자도는 옛이야기를 통해 우리 조상들의 정신적 가치와 교훈을 전달하는 매개체 역할을 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The carp in Munjado symbolizes respect for parents because of a legend where a man caught fish for his sick mother through divine help.</div>\n              <div class=\"lec-final-sum-ko\">문자도 속의 잉어는 한 남자가 하늘의 도움으로 아픈 어머니를 위해 물고기를 잡았다는 전설 덕분에 부모에 대한 존경을 상징한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"audio":"./3_audio/25.mp3","hl":"meaning"},{"audio":"./3_audio/26.mp3","hl":"grammar"}],[{"audio":"./3_audio/27.mp3","hl":"main"},{"audio":"./3_audio/28.mp3","hl":"meaning"},{"audio":"./3_audio/29.mp3","hl":"grammar"}],[{"audio":"./3_audio/30.mp3","hl":"main"},{"audio":"./3_audio/31.mp3","hl":"meaning"},{"audio":"./3_audio/32.mp3","hl":"grammar"}],[{"audio":"./3_audio/33.mp3","hl":"main"},{"audio":"./3_audio/34.mp3","hl":"meaning"},{"audio":"./3_audio/35.mp3","hl":"grammar"}],[{"audio":"./3_audio/36.mp3","hl":"main"},{"audio":"./3_audio/37.mp3","hl":"meaning"},{"audio":"./3_a
