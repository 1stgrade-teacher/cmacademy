<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 8과 본문3","audioDir":"3_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Symbolic Meanings of Bamboo and Lotus in Munjado\u003c/h1>\u003ch2>문자도 속 대나무와 연꽃의 상징적 의미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">문자도\u003c/b> 속 대나무는 왕에 대한 \u003cb class=\"key\">충성심\u003c/b>을, 연꽃은 어려움 속에서도 \u003cb class=\"key\">정의\u003c/b>를 지키려는 의지를 상징합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Bamboo and lotus flowers in Munjado represent loyalty to the king and the will for justice, respectively.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 중학교 삼 학년 동아 윤 팔 과 본문 세 번째 시간을 함께 공부할 거예요. 이번 시간에는 문자도에 등장하는 대나무와 연꽃이 각각 어떤 깊은 의미를 담고 있는지 살펴볼게요. 지문을 통해 충성심과 정의라는 가치가 어떻게 시각적으로 표현되었는지 확인해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">문자도\u003c/b>는 조선 시대 후기에 유행한 민화의 한 종류로, 유교적 덕목을 상징하는 사물과 글자를 결합한 예술입니다. 마치 현대의 \u003cb class=\"key\">타이포그래피\u003c/b>처럼 글자의 의미를 시각적으로 전달하는 것이 특징이죠. 특히 \u003cb class=\"key\">사군자\u003c/b> 중 하나인 대나무는 선비의 \u003cb class=\"key\">지조\u003c/b>를 상징하며, 연꽃은 불교와 유교에서 공통적으로 \u003cb class=\"key\">청결\u003c/b>과 군자의 덕을 나타냅니다. 일상에 비유하자면, 마치 \u003cb class=\"key\">로고 \u003c/b>\u003cb class=\"key\">디자인\u003c/b>에서 특정 색깔이나 모양이 기업의 정신을 나타내는 것과 같습니다.\u003c/div>","segs":[{"n":2,"text":"문자도는 조선 시대 후기에 유행한 민화의 한 종류로, 유교적 덕목을 상징하는 사물과 글자를 결합한 예술입니다. 마치 현대의 타이포그래피처럼 글자의 의미를 시각적으로 전달하는 것이 특징이죠. 특히 사군자 중 하나인 대나무는 선비의 지조를 상징하며, 연꽃은 불교와 유교에서 공통적으로 청결과 군자의 덕을 나타냅니다. 일상에 비유하자면, 마치 로고 디자인에서 특정 색깔이나 모양이 기업의 정신을 나타내는 것과 같습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상징물 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>문자도 속의 또 다른 상징적 사물들로 \u003cb class=\"key\">대나무\u003c/b>와 \u003cb class=\"key\">연꽃\u003c/b>을 소개하며 글을 시작합니다. '충' 자에는 대나무가, '의' 자에는 연꽃이 그려진다는 \u003cb class=\"key\">대응 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 명시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>대나무의 상징성\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>대나무가 구부러지지 않고 사계절 내내 \u003cb class=\"key\">푸르름\u003c/b>을 유지한다는 자연적 특성을 설명합니다. 이러한 이유로 대나무가 왕에 대한 \u003cb class=\"key\">충성심\u003c/b>을 상징하게 되었음을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>연꽃의 상징성\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>진흙 속에서 피어나는 연꽃의 생태적 특징을 \u003cb class=\"key\">정의\u003c/b>를 위해 싸우는 인간의 의지에 비유합니다. 어려움에도 불구하고 \u003cb class=\"key\">옳은 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 가려는 선비의 정신을 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 문자도 속의 대나무와 연꽃이 갖는 상징적 의미를 단계별로 설명하고 있어요.","hl":null},{"n":4,"text":"먼저 첫 번째와 두 번째 문장에서는 문자도에 나오는 또 다른 상징물들을 소개하고 있어요. 글자 충에는 대나무가, 글자 의에는 연꽃이 그려져 있다는 사실을 먼저 머릿속에 넣어 두세요.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장까지는 대나무에 집중합니다. 대나무는 쉽게 구부러지지 않고 사계절 내내 푸르름을 유지하는 성질이 있어서 왕에 대한 변치 않는 충성심을 상징하게 되었다고 설명하죠.","hl":"f1"},{"n":6,"text":"마지막으로 여섯 번째와 일곱 번째 문장에서는 연꽃의 경우를 이야기해요. 진흙 속에서 자라지만 아름답게 꽃을 피우는 연꽃을 통해 어려움 속에서도 정의를 위해 싸우는 숭고한 의지를 보여주고 있습니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">문자도에 등장하는 두 가지 핵심 사물인 \u003cb class=\"key\">대나무\u003c/b>와 \u003cb class=\"key\">연꽃\u003c/b>을 각각 제시하고 그 의미를 설명합니다. 각 사물이 가진 \u003cb class=\"key\">자연적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>이 어떻게 유교적 가치관으로 연결되는지 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 풀어나가고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>other examples (1)\u003c/b>\u003cspan>추가 소재 도입\u003c/span>\u003cb>For these reasons (5)\u003c/b>\u003cspan>인과 관계 도출\u003c/span>\u003cb>In the case of (6)\u003c/b>\u003cspan>화제 전환\u003c/span>\u003cb>thus (7)\u003c/b>\u003cspan>결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">symbolic objects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bamboo\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lotus flowers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbolize loyalty\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbol of a person's will\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>대나무 (Bamboo)\u003c/th>\u003cth>연꽃 (Lotus)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>구부러지지 않고 늘 푸름\u003c/td>\u003ctd>진흙에서도 아름답게 피어남\u003c/td>\u003c/tr>\u003ctr>\u003ctd>왕에 대한 충성 (忠)\u003c/td>\u003ctd>정의를 향한 의지 (義)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 대나무와 연꽃이라는 두 대상을 예시로 들어 설명하는 비교 대조와 예시의 구조를 취하고 있어요. 글의 앞부분에서 소재를 던지고 각각의 특징을 순차적으로 나열하는 방식입니다.","hl":"ty"},{"n":8,"text":"문장 속 신호어를 보면 for these reasons 처럼 인과 관계를 나타내는 표현이나 in the case of 처럼 화제를 전환하는 표현들이 아주 중요하게 쓰였어요. 이러한 신호어들을 잘 따라가면 글의 흐름을 놓치지 않을 수 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상징적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사물\u003c/span>\u003c/div>\u003cdiv>\u003cb>bamboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>character\u003c/b>\u003cem>명사\u003c/em>\u003cspan>글자\u003c/span>\u003c/div>\u003cdiv>\u003cb>lotus flower\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연꽃\u003c/span>\u003c/div>\u003cdiv>\u003cb>bend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구부러지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>green\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>푸른\u003c/span>\u003c/div>\u003cdiv>\u003cb>weather\u003c/b>\u003cem>명사\u003c/em>\u003cspan>날씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loyalty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충성심\u003c/span>\u003c/div>\u003cdiv>\u003cb>king\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕\u003c/span>\u003c/div>\u003cdiv>\u003cb>case\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경우\u003c/span>\u003c/div>\u003cdiv>\u003cb>muddy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진흙투성이의\u003c/span>\u003c/div>\u003cdiv>\u003cb>pond\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연못\u003c/span>\u003c/div>\u003cdiv>\u003cb>bloom\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽃이 피다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beautifully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아름답게\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상징\u003c/span>\u003c/div>\u003cdiv>\u003cb>will\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의지\u003c/span>\u003c/div>\u003cdiv>\u003cb>justice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficulty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어려움\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"특히 loyalty 라는 단어는 충성심을 뜻하는데 왕을 모시던 유교 사회에서 아주 핵심적인 가치였다는 점을 기억하세요. 또한 bloom 은 꽃이 피다라는 뜻으로 연꽃의 생명력을 잘 보여줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">symbolic\u003c/b>\u003cspan class=\"m\">상징적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">representative\u003c/span>\u003cspan class=\"s\">emblematic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bend\u003c/b>\u003cspan class=\"m\">구부러지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">curve\u003c/span>\u003cspan class=\"s\">flex\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">straighten\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loyalty\u003c/b>\u003cspan class=\"m\">충성심\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">faithfulness\u003c/span>\u003cspan class=\"s\">devotion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">betrayal\u003c/span>\u003cspan class=\"a\">treachery\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bloom\u003c/b>\u003cspan class=\"m\">꽃이 피다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">blossom\u003c/span>\u003cspan class=\"s\">flower\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wither\u003c/span>\u003cspan class=\"a\">fade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">justice\u003c/b>\u003cspan class=\"m\">정의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fairness\u003c/span>\u003cspan class=\"s\">righteousness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">injustice\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"loyalty 의 반대말인 betrayal 이나 justice 의 반대말인 injustice 도 시험에 자주 나오니까 이번 기회에 꼭 함께 외워 두면 좋겠네요. bloom 과 비슷한 단어로는 blossom 도 자주 쓰인답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 예가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">other\u003c/span> examples\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상징적인 사물의\u003c/span>\u003cspan class=\"en\">of symbolic objects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자도에 있는\u003c/span>\u003cspan class=\"en\">in Munjado.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문자도에 있는 상징적인 사물의 또 다른 예가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자도 속의 새로운 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">사물\u003c/b>을 추가로 도입하며 글의 내용을 구체적으로 \u003cb class=\"key\">확장\u003c/b>하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There + be동사 (존재 구문)\u003c/span> : There [유도부사] + are [동사] + other examples [복수 주어] : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정형용사 other\u003c/span> : other [형용사] + examples [복수 명사] : \"다른\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"There are, 있다. other examples, 또 다른 예가. of symbolic objects, 상징적인 사물의. in Munjado, 문자도에 있는. 이 문장 전체를 해석하면, 문자도에 있는 상징적인 사물의 또 다른 예가 있다.","hl":"m"},{"n":12,"text":"문자도 안에는 우리가 앞에서 본 것들 말고도 상징적인 의미를 담은 사물들이 더 있다는 것을 알려주는 문장이에요.","hl":"mn"},{"n":13,"text":"첫 번째로 There are 구문을 보세요. 주어가 뒤에 있는 examples이기 때문에 복수형 동사 are를 쓴 것이 핵심이에요. 두 번째로 other는 뒤에 복수 명사를 데려오기 때문에 example에 s가 붙어 있는 것도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003 앞 문장의 복수 주어인 examples를 대신하고 있어요. 두 번째로 character는 여기에서 사람의 성격이 아니라 글자라는 뜻으로 쓰였다는 점에 유의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대나무는\u003c/span>\u003cspan class=\"en\">Bamboo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구부러지지 않는다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">bend\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대나무는 구부러지지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대나무의 생태적 특성인 \u003cb class=\"key\">직립성\u003c/b>을 언급하여, 이것이 후에 \u003cb class=\"key\">충절\u003c/b>과 연결될 것임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 부정문\u003c/span> : Bamboo [3인칭 단수 주어] + does not [조동사] + bend [동사원형] : \"구부러지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Bamboo, 대나무는. does not bend, 구부러지지 않는다.. 이 문장 전체를 해석하면, 대나무는 구부러지지 않는다.","hl":"m"},{"n":18,"text":"대나무의 가장 큰 특징을 설명하고 있어요. 대나무는 곧게 뻗어 있고 절대 휘거나 굽지 않는다는 성질을 강조하는 문장입니다.","hl":"mn"},{"n":19,"text":"이 문장에서는 주어 Bamboo가 삼인칭 단수라는 점이 중요해요. 그래서 부정문을 만들 때 do not이 아니라 does not을 사용했고 그 뒤에는 동사원형 bend가 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 푸르름을 유지한다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stays \u003c/span>\u003cspan class=\"tgt\">green\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 날씨에서도\u003c/span>\u003cspan class=\"en\">in all kinds of weather.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 어떤 날씨에서도 푸르름을 유지한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대나무가 가진 \u003cb class=\"key\">불변성\u003c/b>의 특징을 설명합니다. 어떤 시련에도 변하지 않는 \u003cb class=\"key\">강인함\u003c/b>을 강조하며 다음 문장의 충성심과 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 상태 유지 동사\u003c/span> : stay [상태 동사] + green [형용사 보어] : \"푸른 상태를 유지한다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"It stays green, 그것은 푸르름을 유지한다. in all kinds of weather, 어떤 날씨에서도. 이 문장 전체를 해석하면, 그것은 어떤 날씨에서도 푸르름을 유지한다.","hl":"m"},{"n":21,"text":"대나무는 사계절 내내 변하지 않고 푸른 빛을 띠죠. 이 문장은 대나무가 가진 불변성과 강인함이라는 속성을 잘 보여주는 문장이에요.","hl":"mn"},{"n":22,"text":"첫 번째로 stays green 부분을 볼게요. 동사 stay는 뒤에 형용사 보어를 써서 어떤 상태를 유지한다는 뜻을 만들어요. 그래서 부사가 아닌 형용사 green이 쓰였다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 이유로,\u003c/span>\u003cspan class=\"en\">For these reasons,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대나무는 상징하게 되었다\u003c/span>\u003cspan class=\"en\">bamboo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">symbolize\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕에 대한 충성심을\u003c/span>\u003cspan class=\"en\">loyalty to the king.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 이유로, 대나무는 왕에 대한 충성심을 상징하게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 대나무의 성질이 \u003cb class=\"key\">충성심\u003c/b>이라는 상징으로 연결되는 결론입니다. 유교적 가치인 \u003cb class=\"key\">충\u003c/b>을 시각화한 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">come to-v(동사원형)\u003c/span> : come [동사] + to symbolize [to부정사] : \"상징하게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"For these reasons, 이런 이유로. bamboo came to symbolize, 대나무는 상징하게 되었다. loyalty to the king, 왕에 대한 충성심을. 이 문장 전체를 해석하면, 이런 이유로, 대나무는 왕에 대한 충성심을 상징하게 되었다.","hl":"m"},{"n":24,"text":"대나무가 왜 왕에 대한 충성을 상징하는지 그 논리적인 근거를 정리하는 핵심 문장입니다. 시험에 서술형으로 나오기 정말 좋으니 별표를 쳐 두세요.","hl":"mn"},{"n":25,"text":"두 번째로 came to symbolize를 봅시다. 동사 come 뒤에 to부정사를 쓰면 자연스럽게 무엇무엇 하게 되다라는 변화를 뜻해요. 그리고 loyalty 뒤에 전치사 to를 써서 누구에 대한 충성인지 연결하는 점도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연꽃의 경우,\u003c/span>\u003cspan class=\"en\">In the case of lotus flowers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 진흙투성이의 연못에서 자라지만\u003c/span>\u003cspan class=\"en\">they grow in muddy ponds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼에도 아름답게 꽃을 피운다\u003c/span>\u003cspan class=\"en\">but still \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bloom \u003c/span>\u003cspan class=\"tgt\">beautifully\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연꽃의 경우, 그것들은 진흙투성이의 연못에서 자라지만 그럼에도 아름답게 꽃을 피운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소재가 연꽃으로 전환되며, 열악한 환경에서도 잃지 않는 \u003cb class=\"key\">순수함\u003c/b>을 보여줍니다. \u003cb class=\"key\">대조\u003c/b>적인 환경 설정을 통해 연꽃의 가치를 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : bloom [동사] + beautifully [부사] : \"아름답게 꽃을 피운다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"In the case of lotus flowers, 연꽃의 경우. they grow in muddy ponds, 그것들은 진흙투성이의 연못에서 자라지만. but still bloom beautifully, 그럼에도 아름답게 꽃을 피운다. 이 문장 전체를 해석하면, 연꽃의 경우, 그것들은 진흙투성이의 연못에서 자라지만 그럼에도 아름답게 꽃을 피운다.","hl":"m"},{"n":27,"text":"이제 설명하는 대상이 연꽃으로 바뀌었네요. 연꽃은 더러운 진흙 속에서도 예쁜 꽃을 피우는데, 이건 어려운 상황에서도 꺾이지 않는 의지를 상징해요.","hl":"mn"},{"n":28,"text":"세 번째로 bloom beautifully 부분을 볼게요. 여기서는 꽃을 피우다라는 동사 bloom을 수식해야 하니까 형용사 beautiful이 아니라 부사인 beautifully가 와야 한다는 게 핵심 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 그래서 되었다\u003c/span>\u003cspan class=\"en\">They thus became\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람의 의지의 상징이\u003c/span>\u003cspan class=\"en\">a symbol of a person's will\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정의를 위해 싸우는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fight\u003c/span> for justice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려움에도 불구하고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">despite\u003c/span> difficulties.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그 꽃들은 어려움에도 불구하고 정의를 위해 싸우는 한 사람의 의지를 상징하게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연꽃의 생태적 특징을 인간의 \u003cb class=\"key\">정의\u003c/b>로운 \u003cb class=\"key\">의지\u003c/b>와 연결하여 상징성을 설명합니다. 어떤 \u003cb class=\"key\">역경\u003c/b> 속에서도 굴하지 않는 고결한 정신을 강조하며 단락을 마무리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : will [명사] + [to fight (to부정사)] : \"싸우는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 despite\u003c/span> : despite [전치사] + [difficulties (명사구)] : \"~에도 불구하고\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"They thus became, 그것들은 그래서 되었다. a symbol of a person's will, 한 사람의 의지의 상징이. to fight for justice, 정의를 위해 싸우는. despite difficulties, 어려움에도 불구하고.. 이 문장 전체를 해석하면, 그래서 그 꽃들은 어려움에도 불구하고 정의를 위해 싸우는 한 사람의 의지를 상징하게 되었다.","hl":"m"},{"n":30,"text":"앞 문장에서 연꽃이 진흙 속에서도 아름답게 피어난다고 했죠? 그 특징을 바탕으로 연꽃이 어떻게 정의를 향한 굳은 의지의 상징이 되었는지 마무리하는 문장이에요. 힘든 환경을 이겨내는 연꽃의 모습이 불의에 맞서는 인간의 정신과 연결된다는 점이 핵심이죠.","hl":"mn"},{"n":31,"text":"첫 번째로 to fight는 앞에 있는 명사인 will을 뒤에서 꾸며주는 형용사적 용법으로 쓰였어요. 단순히 싸우는 것이 아니라 싸우려는 의지라는 뜻을 만들어 주죠. 두 번째로 despite는 전치사라는 점이 아주 중요해요. 뒤에 difficulties라는 명사가 왔으니 접속사인 although를 쓰지 않도록 주의해야 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>문자도에는 유교적 가치관을 시각적으로 전달하는 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">사물\u003c/b>들이 등장합니다.\u003c/li>\u003cli>대나무는 어떤 날씨에도 \u003cb class=\"key\">푸르름\u003c/b>을 유지하며 구부러지지 않는 특성으로 \u003cb class=\"key\">충성심\u003c/b>을 상징합니다.\u003c/li>\u003cli>연꽃은 \u003cb class=\"key\">진흙투성이 \u003c/b>\u003cb class=\"key\">연못\u003c/b>에서도 아름답게 피어나는 성질로 \u003cb class=\"key\">정의\u003c/b>에 대한 의지를 상징합니다.\u003c/li>\u003cli>이처럼 사물의 \u003cb class=\"key\">자연적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>은 인간이 지켜야 할 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">덕목\u003c/b>과 밀접하게 연결됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Bamboo and lotus flowers in Munjado represent loyalty to the king and the will for justice, respectively.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">문자도\u003c/b> 속 대나무는 왕에 대한 \u003cb class=\"key\">충성심\u003c/b>을, 연꽃은 어려움 속에서도 \u003cb class=\"key\">정의\u003c/b>를 지키려는 의지를 상징합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 이렇게 해서 문자도 속 대나무와 연꽃의 상징성에 대해 모두 알아보았습니다. 각 사물의 자연적 특징이 유교적 가치와 어떻게 연결되는지 잘 정리해 두길 바라요. 오늘 배운 핵심 어휘들도 복습하는 거 잊지 마세요. 다음 시간에도 더 재미있는 내용으로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
