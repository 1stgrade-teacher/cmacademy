  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

s=\"d-keyexp\">Which do you prefer?\u003c/div>\u003cdiv class=\"d-mean\">어느 것을 더 좋아하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: We can have Bibimbap or Galbitang. Which do you prefer?\u003c/div>\u003cdiv class=\"d-exp\">두 가지 중에서 하나를 고르게 할 때 쓰는 \u003cb class=\"key\">선호\u003c/b>를 묻는 표현이에요. Which one do you prefer, A or B?라고 물으면 \u003cb class=\"key\">A와 B 중\u003c/b> 어느 것을 더 좋아하는지 묻는 뜻이 돼요. 답할 때는 \u003cb class=\"key\">I prefer ~.\u003c/b>나 I like ~ more[bȩtter].로 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which one do you prefer, A or B?\u003c/li>\u003cli>Which do you like more?\u003c/li>\u003cli>Which would you rather have?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I prefer Bibimbap.\u003c/li>\u003cli>I like Bibimbap more.\u003c/li>\u003cli>I like Bibimbap better.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"먼저 선호를 묻는 표현을 배워 볼게요. Which do you prefer? 라고 하면 어느 것을 더 좋아하니, 라는 뜻이에요. 두 가지 중에서 하나를 고르게 할 때 아주 자주 쓰는 표현이죠.","hl":"key"},{"n":7,"text":"같은 뜻으로는 Which one do you prefer, A or B? 라고 물을 수 있어요. 이때는 A와 B 중 둘 중 어느 것을 더 좋아하는지를 묻는 거예요. Which do you like more? 라고 해도 같은 뜻이 된답니다.","hl":"alts"},{"n":8,"text":"대답할 때는 I prefer Bibimbap. 처럼 말하면 돼요. 나는 비빔밥을 더 좋아해, 라는 뜻이죠. I like Bibimbap more. 라고 해도 똑같은 뜻이에요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">의견 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">It seems to me that ~.\u003c/div>\u003cdiv class=\"d-mean\">내 생각에는 ~인 것 같다.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I prefer Bibimbap. It seems to me that it's the healthier choice.\u003c/div>\u003cdiv class=\"d-exp\">자신의 \u003cb class=\"key\">의견\u003c/b>을 부드럽게 말할 때 쓰는 표현이에요. It seems to me that 뒤에 완전한 문장을 붙여서 \u003cb class=\"key\">내 생각\u003c/b>을 전달해요. 상대 의견에 \u003cb class=\"key\">동의\u003c/b>할 때는 I think so, too.나 I agree with you.로 답해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I think (that) ~.\u003c/li>\u003cli>In my opinion, ~.\u003c/li>\u003cli>To me, ~.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I think so, too.\u003c/li>\u003cli>I agree (with you).\u003c/li>\u003cli>That's what I think, too.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"다음은 의견을 말하는 표현이에요. It seems to me that it's the healthier choice. 는 내 생각에는 그것이 더 건강한 선택인 것 같아, 라는 뜻이에요. It seems to me that 뒤에 문장을 붙여서 내 의견을 부드럽게 말할 수 있답니다.","hl":"key"},{"n":10,"text":"I think it's the healthier choice. 라고 해도 같은 뜻이에요. In my opinion, 이나 To me, 로 시작해도 내 생각에는 이라는 의미를 전달할 수 있어요.","hl":"alts"},{"n":11,"text":"상대 의견에 동의할 때는 I think so, too. 라고 해요. 나도 그렇게 생각해, 라는 뜻이죠. I agree with you. 라고 해도 좋아요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 4\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">We can have Bibimbap or Galbitang. \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Which do you prefer?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">우리는 비빔밥이나 갈비탕을 먹을 수 있어. 어느 것을 더 좋아하니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">선호\u003c/b>를 묻는 표현이에요. '어느 것을 더 좋아하니?'라는 뜻으로, Which one do you prefer, A or B?라고 하면 \u003cb class=\"key\">A와 B 중\u003c/b> 어느 것을 더 좋아하는지를 묻는 표현이 돼요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which one do you prefer, Bibimbap or Galbitang?\u003c/span>\u003cspan>Which do you like more, Bibimbap or Galbitang?\u003c/span>\u003cspan>Which would you rather have?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I prefer Bibimbap.\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">It seems to me that it's the healthier choice.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나는 비빔밥을 더 좋아해. 내 생각에는 그것이 더 건강한 선택인 것 같아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">선호\u003c/b>를 나타내는 표현이에요. I prefer ~.는 '나는 ~을 더 좋아한다, 선호한다.'라는 뜻으로 자신의 선호를 나타낼 때 사용하는 표현이고, I like ~ more[bȩtter].라고도 말할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">의견\u003c/b>을 말하는 표현이에요. It seems to me that ~.은 '~인 것 같다.'라는 뜻으로 자신의 의견을 말할 때 사용해요. healthier는 healthy의 \u003cb class=\"key\">비교급\u003c/b>이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like Bibimbap more.\u003c/span>\u003cspan>I think it's the healthier choice.\u003c/span>\u003cspan>It seems to me that Bibimbap is the healthier choice.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"첫 번째 줄이에요. We can have Bibimbap or Galbitang. Which do you prefer? 우리는 비빔밥이나 갈비탕을 먹을 수 있어, 어느 것을 더 좋아하니, 라는 뜻이에요. Which do you prefer? 는 선호를 묻는 표현이고, 두 가지 중 하나를 고를 때 쓴답니다. Which one do you prefer, Bibimbap or Galbitang? 이라고 물어도 같은 뜻이에요.","hl":"l-0"},{"n":13,"text":"두 번째 줄이에요. I prefer Bibimbap. It seems to me that it's the healthier choice. 나는 비빔밥을 더 좋아해, 내 생각에는 그것이 더 건강한 선택인 것 같아, 라는 뜻이죠. I prefer 뒤에 좋아하는 것을 넣으면 선호를 나타낼 수 있어요. I like Bibimbap more. 라고 해도 같은 뜻이에요. 그리고 It seems to me that 은 내 의견을 부드럽게 말하는 표현이랍니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 4\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I think so, too.\u003c/span> \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">I also like Bibimbap more.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나도 그렇게 생각해. 나도 비빔밥이 더 좋아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>상대방의 생각과 자신의 생각이 같을 때 \u003cb class=\"key\">동의\u003c/b>하는 표현이에요. I agree (with you).라고도 말할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>like ~ more는 '~을 더 좋아하다'라는 뜻으로 \u003cb class=\"key\">선호\u003c/b>를 나타내요. also는 '또한'이라는 뜻의 \u003cb class=\"key\">부사\u003c/b>이고, I like Bibimbap bȩtter.라고도 해요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I agree with you.\u003c/span>\u003cspan>I think so, as well.\u003c/span>\u003cspan>That's what I think, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">Let's order, then.\u003c/span> \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">I'm very hungry.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그럼 주문하자. 나는 매우 배고파.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>Let's + 동사원형은 '~하자'라고 \u003cb class=\"key\">제안\u003c/b>할 때 쓰는 표현이에요. then은 '그러면, 그럼'이라는 뜻으로 \u003cb class=\"key\">앞의 내용\u003c/b>을 받아 이어 말할 때 써요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>hungry는 '\u003cb class=\"key\">배고픈\u003c/b>'이라는 뜻의 형용사예요. very는 형용사를 꾸며 '매우'라는 뜻을 더해 줘요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Why don't we order, then?\u003c/span>\u003cspan>Shall we order, then?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"세 번째 줄이에요. I think so, too. I also like Bibimbap more. 나도 그렇게 생각해, 나도 비빔밥이 더 좋아, 라는 뜻이에요. I think so, too. 는 상대방 생각과 내 생각이 같을 때 동의하는 표현이고, I agree with you. 라고 해도 똑같아요.","hl":"l-0"},{"n":15,"text":"네 번째 줄이에요. Let's order, then. I'm very hungry. 그럼 주문하자, 나는 매우 배고파, 라는 뜻이죠. Let's 뒤에 동사원형을 쓰면 하자, 라고 제안하는 표현이 돼요. then은 그러면, 그럼 이라는 뜻이에요. Why don't we order, then? 이라고 해도 같은 뜻이랍니다.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">I prefer Bibimbap.과 같은 의미로 쓸 수 있는 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">I prefer Bibimbap.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>I like Bibimbap more.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I don't like Bibimbap.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>I like Bibimbap very much.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Bibimbap is not my favorite.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>I think Bibimbap is healthy.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I like Bibimbap more.\u003c/span>\u003cdiv class=\"g-exp\">prefer는 '더 좋아하다, 선호하다'라는 뜻이에요. 따라서 [[I like ~ more.]]로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"먼저 대체 표현 문제예요. I prefer Bibimbap. 과 같은 의미로 쓸 수 있는 표현을 골라 보세요. 잠시 멈추고 직접 풀어 볼까요?","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 첫 번째 보기예요. I like Bibimbap more. 는 나는 비빔밥을 더 좋아해, 라는 뜻으로 prefer와 같은 의미를 나타내요. 나머지 보기는 모두 뜻이 다르답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Which do you ____, Bibimbap or Galbitang?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">prefer\u003c/span>\u003cdiv class=\"g-exp\">두 가지 중 하나를 고르게 할 때는 [[Which do you prefer?]]라고 물어요. '어느 것을 더 좋아하니?'라는 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"이번에는 빈칸 문제예요. Which do you blank, Bibimbap or Galbitang? 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 prefer예요. Which do you prefer? 는 어느 것을 더 좋아하니, 라는 뜻으로 선호를 묻는 표현이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">It seems to me that it's the healthier choice.와 가장 가까운 뜻의 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">It seems to me that it's the healthier choice.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>I think it's the healthier choice.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I don't think it's healthy at all.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>I'm sure it's not a healthy choice.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I want to choose Galbitang instead.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I think it's the healthier choice.\u003c/span>\u003cdiv class=\"g-exp\">It seems to me that ~.은 자신의 [[의견]]을 말하는 표현으로, I think (that) ~.와 같은 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"이번에는 뜻이 가장 비슷한 문장을 골라 보세요. It seems to me that it's the healthier choice. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 첫 번째 보기예요. I think it's the healthier choice. 는 내 생각에는 그것이 더 건강한 선택인 것 같아, 라는 뜻으로 같은 의견을 나타내요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화를 자연스러운 순서로 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) I think so, too. I also like Bibimbap more. (B) We can have Bibimbap or Galbitang. Which do you prefer? (C) Let's order, then. I'm very hungry. (D) I prefer Bibimbap. It seems to me that it's the healthier choice.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>(B)-(D)-(A)-(C)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>(B)-(A)-(D)-(C)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>(D)-(B)-(C)-(A)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>(B)-(D)-(C)-(A)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(B)-(D)-(A)-(C)\u003c/span>\u003cdiv class=\"g-exp\">먼저 [[선호]]를 묻고, 상대가 선호와 [[의견]]을 말한 뒤, 동의하고, 마지막으로 [[제안]]하며 대화를 맺어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"이번에는 대화의 순서를 맞춰 보세요. 보기에 네 개의 문장이 있어요. 먼저 선호를 묻는 말이 나오고, 대답과 동의가 이어지고, 마지막에 제안이 온다고 생각하면 쉬워요. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 첫 번째 보기예요. 먼저 Which do you prefer? 로 선호를 묻고, I prefer Bibimbap. 으로 답한 뒤, I think so, too. 로 동의하고, 마지막에 Let's order, then. 으로 제안한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>여자는 갈비탕을 더 좋아한다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>두 사람은 지금 배가 부르다.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>남자는 비빔밥이 더 건강한 선택이라고 생각한다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>여자는 남자의 의견에 동의하지 않는다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>두 사람은 아직 주문하지 않을 것이다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">남자는 비빔밥이 더 건강한 선택이라고 생각한다.\u003c/span>\u003cdiv class=\"g-exp\">남자는 It seems to me that it's the healthier choice.라고 말하며 비빔밥이 더 [[건강한 선택]]이라고 했어요. 여자도 [[동의]]했고, 두 사람은 [[주문]]하려고 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"마지막은 내용 일치 문제예요. 대화의 내용과 같은 것을 골라 보세요. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 세 번째 보기예요. 남자는 It seems to me that it's the healthier choice. 라고 말했어요. 내 생각에는 그것이 더 건강한 선택인 것 같다는 뜻이죠. 여자도 I think so, too. 로 동의했고, 두 사람은 이제 주문하려고 한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">선호 묻고 답하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>선호를 물을 때는 \u003cb class=\"key\">Which do you prefer?\u003c/b>를 쓰고, 답할 때는 \u003cb class=\"key\">I prefer ~.\u003c/b> 또는 I like ~ more.로 말해요.\u003c/li>\u003cli>자신의 의견은 \u003cb class=\"key\">It seems to me that ~.\u003c/b>으로 부드럽게 말할 수 있어요.\u003c/li>\u003cli>상대 의견에 동의할 때는 \u003cb class=\"key\">I think so, too.\u003c/b> 또는 I agree with you.라고 해요.\u003c/li>\u003cli>함께 하자고 할 때는 \u003cb class=\"key\">Let's + 동사원형\u003c/b>을 사용해요.\u003c/li>\u003c/ul>","segs":[{"n":31,"text":"오늘은 선호를 묻고 답하는 표현과 의견을 말하는 표현을 배웠어요. 선호를 물을 때는 Which do you prefer? 라고 하고, 답할 때는 I prefer Bibimbap. 처럼 말하면 돼요. 의견을 말할 때는 It seems to me that 으로 시작하고, 동의할 때는 I think so, too. 라고 한답니다. 오늘 배운 표현들을 꼭 소리 내어 연습해 보세요. 수고했어요, 여러분.","hl":"sum"}]}]});</script></body></html>
