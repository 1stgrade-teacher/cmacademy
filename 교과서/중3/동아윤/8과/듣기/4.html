  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"C. In Conversation","title":"중3 동아(윤) 8과 대화문 A. Listen and Talk — 선호 묻고 답하기 & 의견 말하기","audioDir":"4_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">선호 묻고 답하기 · 의견 표현하고 확인하기\u003c/div>\u003ch1>중3 동아(윤) 8과 대화문 해설 강의 - 전시회와 탈춤 공연, 무엇을 먼저 볼까?\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>수미와 에릭이 두 개의 전시회 중 어느 것을 볼지 고르고, 포스터를 보며 탈춤 공연의 시간과 장소를 확인한 뒤 관람 순서를 정하는 대화입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중삼 동아윤 교과서 8과의 대화문인 'In Conversation'을 학습하겠습니다. 두 개의 전시회 중에서 무엇을 볼지 고르는 대화를 함께 공부해요. 수미와 에릭이 포스터를 보면서 탈춤 공연 시간과 장소를 확인하고, 관람 순서를 정하는 상황이에요. 오늘 배울 표현은 선호를 묻고 답하기, 그리고 자기 의견을 말하고 확인하기입니다. 그럼 대화를 한 줄씩 같이 읽어 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">There are two exhibitions we can go to. Which one do you want to see more, Eric?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">I prefer the Korean mask exhibition. Is that OK, Somi?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Of course. And it seems to me that the mask exhibition will be much more interesting.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Do you think so?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yes. Look at this poster. There isn't just an exhibition. There's also a mask dance show at 4:00 and 6:00.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Great! I've never seen a mask dance show before.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Well, I've seen a show before. I'm sure you'll like it.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">So where is the show?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">It's in Dasom Hall, next to the exhibition room.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-9\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">It's 4:30 now, so let's watch the 6 o'clock show.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-10\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">OK. Let's go see the exhibition first.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"There are two exhibitions we can go to. Which one do you want to see more, Eric?","hl":"r-0"},{"n":3,"text":"I prefer the Korean mask exhibition. Is that OK, Somi?","hl":"r-1"},{"n":4,"text":"Of course. And it seems to me that the mask exhibition will be much more interesting.","hl":"r-2"},{"n":5,"text":"Do you think so?","hl":"r-3"},{"n":6,"text":"Yes. Look at this poster. There isn't just an exhibition. There's also a mask dance show at 4:00 and 6:00.","hl":"r-4"},{"n":7,"text":"Great! I've never seen a mask dance show before.","hl":"r-5"},{"n":8,"text":"Well, I've seen a show before. I'm sure you'll like it.","hl":"r-6"},{"n":9,"text":"So where is the show?","hl":"r-7"},{"n":10,"text":"It's in Dasom Hall, next to the exhibition room.","hl":"r-8"},{"n":11,"text":"It's 4:30 now, so let's watch the 6 o'clock show.","hl":"r-9"},{"n":12,"text":"OK. Let's go see the exhibition first.","hl":"r-10"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">선호 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Which one do you want to see more?\u003c/div>\u003cdiv class=\"d-mean\">어느 것을 더 보고 싶니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: There are two exhibitions we can go to. Which one do you want to see more, Eric?\u003c/div>\u003cdiv class=\"d-exp\">두 개 이상의 것 중에서 더 좋아하는 것을 물을 때 쓰는 \u003cb class=\"key\">선호\u003c/b> 표현입니다. \u003cb class=\"key\">Which one\u003c/b>은 '어느 것'이라는 뜻으로 앞에 나온 명사(exhibition)를 가리키고, 답할 때는 \u003cb class=\"key\">I prefer\u003c/b> + 명사 형태로 말합니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which one would you like to see more?\u003c/li>\u003cli>Which one do you like better?\u003c/li>\u003cli>Which do you prefer to see?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I prefer + 명사.\u003c/li>\u003cli>I like + 명사 + better.\u003c/li>\u003cli>I'd rather see + 명사.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"이번 대화의 첫 번째 기능은 선호를 묻고 답하는 거예요. 여러 개 중에서 어느 것을 더 좋아하는지 물을 때는 Which one do you want to see more?라고 합니다. 여기서 which one은 두 개 중 어느 것이라는 뜻이고, see more는 더 보고 싶다는 뜻이에요.","hl":"key"},{"n":14,"text":"같은 뜻으로는 Which one would you like to see more?라고 해도 되고, Which one do you like better?라고 해도 됩니다. Which do you prefer to see?처럼 prefer를 써서 묻는 방법도 있어요.","hl":"alts"},{"n":15,"text":"이렇게 물으면 I prefer the Korean mask exhibition처럼 I prefer 다음에 명사를 붙여 답해요. I like the Korean mask exhibition better라고 해도 되고, I'd rather see the Korean mask exhibition이라고 해도 같은 뜻이 된답니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">의견 표현하고 확인하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">It seems to me (that) ~.\u003c/div>\u003cdiv class=\"d-mean\">내가 보기에 ~할 것 같다\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Of course. And it seems to me that the mask exhibition will be much more interesting.\u003c/div>\u003cdiv class=\"d-exp\">자신의 \u003cb class=\"key\">의견\u003c/b>을 부드럽게 말할 때 \u003cb class=\"key\">It seems to me that\u003c/b> ~.을 씁니다. '내가 보기에 ~할 것 같다'라는 뜻으로, 접속사 that은 주로 생략되고 주어 It도 생략할 수 있습니다. 상대의 생각이 궁금할 때는 \u003cb class=\"key\">Do you think so?\u003c/b>로 확인합니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>In my opinion, ~.\u003c/li>\u003cli>I think (that) ~.\u003c/li>\u003cli>To me, it seems that ~.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I agree with you.\u003c/li>\u003cli>You're right.\u003c/li>\u003cli>Yes, I think so.\u003c/li>\u003cli>Do you think so?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"두 번째 기능은 자기 의견을 말하고 상대의 생각을 확인하는 거예요. 내가 보기에 어떤 것 같다고 부드럽게 말할 때는 It seems to me that을 씁니다. 뒤에 주어와 동사를 붙여서 It seems to me that the mask exhibition will be much more interesting처럼 말하면 돼요.","hl":"key"},{"n":17,"text":"같은 뜻으로는 In my opinion, the mask exhibition will be interesting이라고 해도 되고, I think the mask exhibition will be interesting이라고 해도 됩니다. To me, it seems that the mask exhibition will be interesting처럼 말할 수도 있어요.","hl":"alts"},{"n":18,"text":"상대가 이런 의견을 말하면 I agree with you라고 동의해 주거나 You're right라고 해 주면 좋아요. Yes, I think so라고 맞장구를 쳐도 되고, 상대 생각을 다시 확인하고 싶을 때는 Do you think so?라고 되물어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There are two exhibitions\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we can go to\u003c/span>. \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Which one do you want to see more\u003c/span>, Eric?\u003c/div>\u003cdiv class=\"d-ko\">두 개의 전시회가 우리가 갈 수 있는 게 있어. 어느 것을 더 보고 싶니, 에릭?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>There are 뒤에는 \u003cb class=\"key\">복수명사\u003c/b>(exhibitions)가 와서 '~이 있다'라는 뜻을 나타냅니다. There isn't 뒤에는 단수명사가 오지만 뜻은 같습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>선행사 two exhibitions를 수식하는 절(we can go to) 앞에는 \u003cb class=\"key\">목적격 관계대명사\u003c/b> that/which가 생략되어 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>'어느 것을 더 보고 싶니'라는 뜻으로, one은 exhibition을 가리킵니다. 두 전시회 중에서 더 \u003cb class=\"key\">선호\u003c/b>하는 것을 묻는 표현입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which one would you like to see more?\u003c/span>\u003cspan>Which one do you like better?\u003c/span>\u003cspan>Which do you prefer to see?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I prefer\u003c/span> the Korean mask exhibition. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Is that OK\u003c/span>, Somi?\u003c/div>\u003cdiv class=\"d-ko\">나는 한국 가면 전시회가 더 좋아. 괜찮아, 수미야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">선호\u003c/b>를 나타낼 때 I prefer + 명사로 '나는 ~이 더 좋아'라고 말합니다. 선호를 묻는 말에 대한 답으로 쓰였습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>상대의 \u003cb class=\"key\">허락\u003c/b>이나 \u003cb class=\"key\">동의\u003c/b>를 구하는 표현으로 '그래도 괜찮아?'라는 뜻입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like the Korean mask exhibition better.\u003c/span>\u003cspan>I'd rather see the Korean mask exhibition.\u003c/span>\u003cspan>The Korean mask exhibition is my choice.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"먼저 첫 번째 줄이에요. 수미가 말합니다. There are two exhibitions we can go to. Which one do you want to see more, Eric? 우리말로는 두 개의 전시회가 우리가 갈 수 있는 게 있어, 어느 것을 더 보고 싶니, 에릭? 이렇게 해석해요. There are 뒤에는 복수명사가 와서 ~이 있다는 뜻을 나타내고, we can go to 앞에는 목적격 관계대명사 that이나 which가 생략되어 two exhibitions를 꾸며 줍니다. 어느 것을 더 보고 싶은지 물을 때는 Which one do you want to see more라고 하면 되고, Which one do you like better나 Which one would you like to see more라고도 같은 뜻으로 말할 수 있어요.","hl":"l-0"},{"n":20,"text":"두 번째 줄, 에릭이 답합니다. I prefer the Korean mask exhibition. Is that OK, Somi? 나는 한국 가면 전시회가 더 좋아, 괜찮아 수미야? 라는 뜻이에요. 선호를 말할 때는 I prefer 다음에 명사를 붙여 주면 되고, 같은 뜻으로 I like the Korean mask exhibition better라고 해도 됩니다. I'd rather see the Korean mask exhibition이라고 해도 좋아요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Of course. And \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">it seems to me that\u003c/span> the mask exhibition will be \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">much more interesting\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">물론이지. 그리고 내가 보기에는 가면 전시회가 훨씬 더 흥미로울 것 같아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>'내가 보기에 ~할 것 같다'라는 뜻으로 자신의 \u003cb class=\"key\">의견\u003c/b>을 나타낼 때 사용하는 표현입니다. 접속사 that은 주로 생략되며, 주어로 쓰인 It도 생략해서 말할 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>much는 \u003cb class=\"key\">비교급\u003c/b> more interesting을 강조하여 '훨씬, 더'의 의미를 나타냅니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>In my opinion, the mask exhibition will be much more interesting.\u003c/span>\u003cspan>To me, the mask exhibition seems much more interesting.\u003c/span>\u003cspan>I think the mask exhibition will be much more interesting.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Do you think so?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">너도 그렇게 생각해?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>상대방의 \u003cb class=\"key\">생각을 확인\u003c/b>하는 표현으로 '너는 그렇게 생각하니?'라는 뜻입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Do you agree?\u003c/span>\u003cspan>Is that what you think?\u003c/span>\u003cspan>Really, do you think that way?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"세 번째 줄입니다. Of course. And it seems to me that the mask exhibition will be much more interesting. 물론이지, 그리고 내가 보기에는 가면 전시회가 훨씬 더 흥미로울 것 같아. 여기서 it seems to me that은 내가 보기에 ~할 것 같다는 뜻으로 자기 의견을 부드럽게 말할 때 써요. that은 보통 생략하고 맨 앞의 It도 생략해서 말할 수 있고, much는 비교급 more interesting을 강조해서 훨씬이라는 뜻을 더해 줍니다. 같은 뜻으로 In my opinion, the mask exhibition will be much more interesting이라고 해도 됩니다.","hl":"l-0"},{"n":22,"text":"네 번째 줄, 에릭이 되묻습니다. Do you think so? 너도 그렇게 생각해? 라는 뜻으로 상대방의 생각을 확인하는 표현이에요. Do you agree?나 Is that what you think?라고도 말할 수 있습니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes. Look at this poster. \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">There isn't just an exhibition\u003c/span>. There's also a mask dance show at 4:00 and 6:00.\u003c/div>\u003cdiv class=\"d-ko\">응. 이 포스터를 봐. 전시회만 있는 게 아니야. 4시와 6시에는 탈춤 공연도 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>There isn't 다음에는 \u003cb class=\"key\">단수명사\u003c/b>(an exhibition)가 오며, '~이 있다'라는 뜻은 There are와 같습니다. just는 '단지, 오직'의 의미입니다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Great! \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">I've never seen\u003c/span> a mask dance show \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">before\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">좋아! 나는 전에 탈춤 공연을 본 적이 없어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>자신의 경험을 나타내는 표현으로 \u003cb class=\"key\">현재완료\u003c/b>(have/has + p.p.)를 사용합니다. never는 '한 번도 ~않다'는 뜻으로 '나는 전에 ~해 본 적이 없어'를 나타냅니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>before는 '전에, 이전에'라는 뜻으로 경험을 나타내는 \u003cb class=\"key\">현재완료\u003c/b> 문장과 함께 자주 쓰입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I have never watched a mask dance show before.\u003c/span>\u003cspan>This is my first time seeing a mask dance show.\u003c/span>\u003cspan>I've never been to a mask dance show before.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"다섯 번째 줄이에요. Yes. Look at this poster. There isn't just an exhibition. There's also a mask dance show at four and six. 응, 이 포스터를 봐, 전시회만 있는 게 아니야, 네 시와 여섯 시에는 탈춤 공연도 있어. 여기서 There isn't 다음에는 단수명사가 오고 뜻은 There are와 같다는 점을 꼭 기억하세요.","hl":"l-0"},{"n":24,"text":"여섯 번째 줄, 에릭이 좋아한다고 말합니다. I've never seen a mask dance show before. 나는 전에 탈춤 공연을 본 적이 없어. 경험을 말할 때는 현재완료를 써서 I've never seen이라고 하고 before를 붙여 주면 자연스러워요. This is my first time seeing a mask dance show라고 해도 같은 뜻이 됩니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Well, \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">I've seen a show before\u003c/span>. \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">I'm sure\u003c/span> you'll like it.\u003c/div>\u003cdiv class=\"d-ko\">음, 나는 전에 공연을 본 적이 있어. 분명히 너도 좋아할 거야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>현재완료로 \u003cb class=\"key\">경험\u003c/b>을 나타내 '나는 전에 ~해 본 적이 있다'라고 말합니다. 'I've + 과거분사 ~ before.' 형태로 표현할 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>\u003cb class=\"key\">강한 확신\u003c/b>을 나타내는 표현으로 '분명히 ~할 거야'라는 뜻입니다. I'm certain (that) ~.이나 I bet (that) ~. 등으로도 말할 수 있습니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'm certain you'll like it.\u003c/span>\u003cspan>I bet you'll like it.\u003c/span>\u003cspan>I'm sure that you will enjoy it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">So \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">where is the show\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">그럼 공연은 어디에서 해?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">14\u003c/span>\u003cspan>장소를 묻는 \u003cb class=\"key\">의문사\u003c/b> where를 사용한 표현으로 '공연이 어디에 있니?'라는 뜻입니다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"일곱 번째 줄입니다. Well, I've seen a show before. I'm sure you'll like it. 음, 나는 전에 공연을 본 적이 있어, 분명히 너도 좋아할 거야. 경험을 말할 때는 I've 다음에 과거분사를 쓰고 before를 붙여서 전에 해 본 적이 있다고 해요. I'm sure는 분명히 그럴 거라고 강하게 확신할 때 쓰고, I'm certain you'll like it이나 I bet you'll like it으로 바꿔 말할 수 있습니다.","hl":"l-0"},{"n":26,"text":"여덟 번째 줄, So where is the show? 그럼 공연은 어디에서 해? 장소를 묻는 의문사 where를 써서 이렇게 묻습니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">It's in Dasom Hall, \u003cspan class=\"mk\">15\u003c/span>\u003cspan class=\"tgt\">next to\u003c/span> the exhibition room.\u003c/div>\u003cdiv class=\"d-ko\">다솜홀에서 해, 전시실 옆에 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan>next to는 '~옆에'라는 뜻의 \u003cb class=\"key\">전치사\u003c/b> 표현으로 위치를 설명할 때 씁니다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">It's 4:30 now, \u003cspan class=\"mk\">16\u003c/span>\u003cspan class=\"tgt\">so let's watch\u003c/span> \u003cspan class=\"mk\">17\u003c/span>\u003cspan class=\"tgt\">the 6 o'clock show\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">지금 4시 30분이니까, 6시 공연을 보자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">16\u003c/span>\u003cspan>let's + \u003cb class=\"key\">동사원형\u003c/b>은 '~하자'라고 제안할 때 쓰는 표현입니다. so는 앞의 내용이 이유가 되어 '그래서'라는 뜻을 나타냅니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">17\u003c/span>\u003cspan>시간 뒤에 \u003cb class=\"key\">o'clock\u003c/b>을 붙여 '6시 공연'처럼 명사를 꾸며 말할 수 있습니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>It's 4:30 now, so why don't we watch the 6 o'clock show?\u003c/span>\u003cspan>It's 4:30 now, so how about watching the 6 o'clock show?\u003c/span>\u003cspan>It's 4:30 now, so shall we watch the 6 o'clock show?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"아홉 번째 줄이에요. It's in Dasom Hall, next to the exhibition room. 다솜홀에서 해, 전시실 옆에 있어. next to는 바로 옆에라는 뜻으로 위치를 설명할 때 꼭 필요한 표현이에요.","hl":"l-0"},{"n":28,"text":"열 번째 줄, It's four thirty now, so let's watch the six o'clock show. 지금 네 시 삼십 분이니까 여섯 시 공연을 보자. 제안할 때는 let's 다음에 동사원형을 쓰고, 시간 뒤에 o'clock을 붙여 여섯 시 공연처럼 말해요. Shall we watch the six o'clock show나 Why don't we watch the six o'clock show라고 해도 같은 뜻입니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 11 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">11\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">OK. \u003cspan class=\"mk\">18\u003c/span>\u003cspan class=\"tgt\">Let's go see\u003c/span> the exhibition first.\u003c/div>\u003cdiv class=\"d-ko\">좋아. 먼저 전시회를 보러 가자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">18\u003c/span>\u003cspan>let's + 동사원형으로 \u003cb class=\"key\">제안\u003c/b>하는 표현입니다. go see는 '보러 가다'라는 뜻으로 go and see가 줄어든 형태입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>OK. How about seeing the exhibition first?\u003c/span>\u003cspan>OK. Why don't we see the exhibition first?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"마지막 줄입니다. OK. Let's go see the exhibition first. 좋아, 먼저 전시회를 보러 가자. 여기서도 let's가 제안하는 표현이에요. How about seeing the exhibition first나 Why don't we see the exhibition first라고도 말할 수 있습니다. 자, 여기까지 대화를 한 줄씩 다 읽어 봤어요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Eric wants to see the Korean mask exhibition.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Somi has never seen a show before.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The mask dance show is only at six o'clock.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Dasom Hall is far from the exhibition room.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>They will watch the four o'clock show.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Eric wants to see the Korean mask exhibition.\u003c/span>\u003cdiv class=\"g-exp\">에릭은 I prefer the Korean mask exhibition.이라고 말했으므로 한국 가면 전시회를 더 보고 싶어 합니다. 수미는 전에 공연을 본 적이 있고, 탈춤 공연은 네 시와 여섯 시에 있으며, 다솜홀은 전시실 옆에 있고, 두 사람은 여섯 시 공연을 보기로 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"첫 번째 문제입니다. 대화의 내용과 일치하는 것을 고르세요. 보기를 하나씩 읽어 보면서 대화 내용과 비교해 보고 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 첫 번째 보기예요. 에릭이 한국 가면 전시회를 더 보고 싶다고 말했으니 에릭은 한국 가면 전시회를 보고 싶어 한다는 내용이 맞아요. 수미는 전에 공연을 본 적이 있고, 공연은 네 시와 여섯 시에 하며, 다솜홀은 전시실 바로 옆에 있어요. 두 사람은 여섯 시 공연을 보기로 했답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 불일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하지 않는 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The mask dance show is at four and six.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Eric has never seen a mask dance show before.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>Somi has never seen a show before.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>It is four thirty now.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>They decide to see the exhibition first.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Somi has never seen a show before.\u003c/span>\u003cdiv class=\"g-exp\">수미는 I've seen a show before.라고 말했으므로 전에 공연을 본 적이 있습니다. 따라서 '수미는 전에 공연을 본 적이 없다.'는 내용은 일치하지 않습니다. 나머지는 모두 대화 내용과 일치합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"두 번째 문제입니다. 대화의 내용과 일치하지 않는 것을 고르세요. 다섯 개의 보기 중에서 대화와 다른 내용을 찾으면 됩니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 세 번째 보기예요. 수미는 전에 공연을 본 적이 있다고 말했기 때문에 수미가 전에 공연을 본 적이 없다는 말은 틀려요. 탈춤 공연은 네 시와 여섯 시에 있고, 에릭은 전에 탈춤 공연을 본 적이 없으며, 지금은 네 시 삼십 분이고, 두 사람은 전시회를 먼저 보기로 했어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>There is only an exhibition on the poster.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>The mask dance show is in Dasom Hall.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Eric prefers the four o'clock show.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Somi thinks the mask exhibition will be boring.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Eric has seen a mask dance show before.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The mask dance show is in Dasom Hall.\u003c/span>\u003cdiv class=\"g-exp\">수미는 공연 장소가 다솜홀이라고 말했습니다. 포스터에는 전시회뿐 아니라 탈춤 공연도 있고, 에릭은 탈춤 공연을 본 적이 없으며, 수미는 가면 전시회가 훨씬 더 흥미로울 것 같다고 말했습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"세 번째 문제입니다. 대화의 내용과 일치하는 것을 고르세요. 장소와 시간, 인물의 생각을 잘 비교해 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":6},{"n":38,"text":"정답은 두 번째 보기예요. 수미가 공연은 다솜홀에서 한다고 말했으니까 탈춤 공연이 다솜홀에서 열린다는 내용이 맞아요. 포스터에는 전시회만 있는 게 아니라 탈춤 공연도 있고, 에릭은 탈춤 공연을 본 적이 없으며, 수미는 가면 전시회가 훨씬 더 흥미로울 것 같다고 했어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 불일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하지 않는 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>There are two exhibitions they can go to.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Eric prefers the Korean mask exhibition.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The mask dance show is at four and six.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Somi has seen a show before.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>⑤\u003c/b>Eric is sure that Somi will like the show.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Eric is sure that Somi will like the show.\u003c/span>\u003cdiv class=\"g-exp\">분명히 너도 좋아할 거야라고 말한 사람은 수미입니다. 에릭은 Do you think so?라고 되물었을 뿐입니다. 나머지는 모두 대화 내용과 일치합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":39,"text":"네 번째 문제입니다. 대화의 내용과 일치하지 않는 것을 고르세요. 누가 어떤 말을 했는지 잘 생각하면서 풀어 보세요.","hl":"q"},{"n":40,"text":"","hl":"q","pause":6},{"n":41,"text":"정답은 다섯 번째 보기예요. 분명히 너도 좋아할 거야라고 말한 사람은 수미예요. 에릭은 그렇게 생각하냐고 되물었을 뿐이죠. 나머지 보기는 모두 대화 내용과 같아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 것을 고르시오.\ fore.로, 강한 확신은 \u003cb class=\"key\">I'm sure\u003c/b> ~.로 나타냅니다.\u003c/li>\u003c/ul>","segs":[{"n":45,"text":"오늘은 두 개의 전시회 중에서 무엇을 볼지 고르는 대화를 공부했어요. 더 좋아하는 것을 물을 때는 Which one do you want to see more?라고 하고, 답할 때는 I prefer 다음에 명사를 붙여 주면 됩니다. 자기 의견은 It seems to me that으로 부드럽게 말하고, 상대 생각이 궁금하면 Do you think so?라고 되물어 보세요. 경험은 I've never seen before로, 확신은 I'm sure로 표현하는 것도 꼭 기억해 두고요. 오늘 배운 표현들을 소리 내어 여러 번 연습해 보세요. 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
