</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"8과 문법2 to부정사의 의미상 주어","title":"중3 동아(윤) 8과 문법2 가정법과거","audioDir":"2_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가정법 과거\u003c/div>\u003ch1>가정법 과거 — '~라면 …할 텐데'로 상상 표현하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가정법 과거의 쓰임과 형태를 익히고, 조건을 나타내는 if절과 구별할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 가정법 과거를 함께 공부해 볼 거예요. 가정법 과거는 지금 사실과 반대되는 상황을 상상할 때 쓰는 표현이에요. '~라면 …할 텐데'라는 뜻을 영어로 어떻게 말하는지 오늘 확실히 익혀 봐요. 예문을 하나씩 읽으면서 천천히 이해해 보도록 해요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">가정법 과거는 언제 쓸까?\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">지금 \u003cb class=\"key\">현재의 사실\u003c/b>과 반대되는 상황을 가정할 때 가정법 과거를 써요. 현재에 일어나지 않을 것 같은 일을 \u003cb class=\"key\">소망\u003c/b>할 때도 쓰고요. 해석은 '~라면 …할 텐데'로 해요. 예문 뒤에는 그와 반대되는 \u003cb class=\"key\">현재의 사실\u003c/b>이 숨어 있다는 것도 기억해요.\u003cdiv>\u003cspan class=\"g-formula\">현재 사실의 반대를 상상하기 = '~라면 …할 텐데'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If you were here, you \u003cspan class=\"fx\">could see\u003c/span> my beautiful dress.\u003c/div>\u003cdiv class=\"g-ko\">네가 여기 있다면 내 예쁜 드레스를 볼 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">실제로는 네가 여기 없어서 볼 수 없다는 현재의 사실이 반대로 숨어 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가정법 과거는 현재 이야기인데도 동사를 \u003cb class=\"key\">과거형\u003c/b>으로 써요. 해석이 '~라면 …할 텐데'로 끝나면 가정법 과거라고 생각하면 돼요.\u003c/div>","segs":[{"n":2,"text":"가정법 과거는 지금 일어나고 있는 사실과 반대되는 상황을 상상할 때 쓰는 문법이에요. 이를테면 지금 네가 여기 없다는 사실과 반대로, 네가 여기 있다면 어떻게 될지를 상상하는 거죠. 현재에 일어나지 않을 것 같은 일을 소망할 때도 가정법 과거를 써요. 해석은 항상 '~라면 …할 텐데'로 해 주시고요. 예문 뒤에는 꼭 반대되는 현재의 사실이 숨어 있다는 점도 함께 기억해 주세요.","hl":"rule"},{"n":3,"text":"If you were here, you could see my beautiful dress. 네가 여기 있다면 내 예쁜 드레스를 볼 수 있을 텐데, 라는 뜻이에요. 그런데 실제로는 네가 여기 없기 때문에 내 드레스를 볼 수 없죠. 이렇게 지금 사실과 반대되는 상황을 상상할 때 가정법 과거를 써요.","hl":"ex-0"},{"n":4,"text":"헷갈리기 쉬운 부분이 있어요. 가정법 과거는 지금 현재 일을 말하는데도 동사는 과거형으로 써요. 그래서 해석이 '~라면 …할 텐데'로 끝나면 가정법 과거라고 생각하시면 된답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">가정법 과거의 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if절에는 \u003cb class=\"key\">동사의 과거형\u003c/b>을, 주절에는 \u003cb class=\"key\">조동사의 과거형\u003c/b> + \u003cb class=\"key\">동사원형\u003c/b>을 써요. 주절의 조동사는 보통 would나 could를 사용해요.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + 동사의 과거형 ~, 주어 + 조동사의 과거형 + 동사원형 …\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If he \u003cspan class=\"fx\">helped\u003c/span> me, I could succeed.\u003c/div>\u003cdiv class=\"g-ko\">그가 나를 도와준다면 나는 성공할 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">if절은 과거형 helped, 주절은 could + 동사원형 succeed예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">If I \u003cspan class=\"fx\">had\u003c/span> more time, I would read more books.\u003c/div>\u003cdiv class=\"g-ko\">내게 시간이 더 있다면 책을 더 많이 읽을 텐데.\u003c/div>\u003cdiv class=\"g-note\">if절 동사는 과거형 had, 주절은 would + 동사원형 read예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 조동사 뒤에는 반드시 \u003cb class=\"key\">동사원형\u003c/b>이 와요. \u003cb class=\"key\">과거형\u003c/b> 동사를 또 쓰지 않도록 조심하세요.\u003c/div>","segs":[{"n":5,"text":"이제 형태를 볼까요. if절에는 주어 다음에 동사의 과거형이 오고, 주절에는 조동사의 과거형 다음에 동사원형이 와요. 주절에는 would나 could 같은 조동사의 과거형을 쓴답니다. 공식으로 정리하면 If 다음에 주어와 동사의 과거형, 그다음 주어와 조동사의 과거형 그리고 동사원형, 이렇게 기억해 두세요.","hl":"rule"},{"n":6,"text":"If he helped me, I could succeed. 그가 나를 도와준다면 나는 성공할 수 있을 텐데, 라는 뜻이에요. if절에는 동사의 과거형인 helped가, 주절에는 could 다음에 동사원형 succeed가 왔죠. 지금 그는 나를 도와주지 않지만, 만약 도와준다면 성공할 수 있을 거라고 상상하는 문장이에요.","hl":"ex-0"},{"n":7,"text":"If I had more time, I would read more books. 내게 시간이 더 있다면 책을 더 많이 읽을 텐데, 라는 뜻이에요. 여기서도 if절에는 과거형 had를, 주절에는 would 다음에 동사원형 read를 썼답니다.","hl":"ex-1"},{"n":8,"text":"조동사 뒤에는 언제나 동사원형이 와요. would나 could 다음에 동사를 또 과거형으로 쓰는 실수를 많이 하니까, 조동사 뒤는 무조건 동사원형이라고 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">if절에서 be동사는 were\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거의 if절에서 be동사는 주어의 \u003cb class=\"key\">수\u003c/b>나 \u003cb class=\"key\">인칭\u003c/b>에 상관없이 주로 \u003cb class=\"key\">were\u003c/b>를 써요. I나 he, she 뒤에도 were를 쓰는 것이 보통이에요.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + were ~, 주어 + 조동사의 과거형 + 동사원형 …\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If she \u003cspan class=\"fx\">were\u003c/span> in my situation, she would do the same thing.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 내 입장이라면 그녀는 똑같은 것을 했을 텐데.\u003c/div>\u003cdiv class=\"g-note\">주어가 she여도 be동사는 were를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">If he \u003cspan class=\"fx\">were\u003c/span> here, he would help us.\u003c/div>\u003cdiv class=\"g-ko\">그가 여기 있다면 우리를 도와줄 텐데.\u003c/div>\u003cdiv class=\"g-note\">주어가 he여도 be동사는 were예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가정법 과거에서는 If I \u003cb class=\"key\">were\u003c/b>, If he \u003cb class=\"key\">were\u003c/b>처럼 \u003cb class=\"key\">were\u003c/b>를 쓰는 것이 자연스러워요.\u003c/div>","segs":[{"n":9,"text":"가정법 과거의 if절에서는 be동사가 조금 특별해요. 주어가 I든 he든 she든 상관없이 be동사는 주로 were를 씁니다. 보통은 I 다음에 was를 쓰지만, 가정법에서는 If I were라고 하는 것이 자연스러워요. 주어의 수나 인칭을 따지지 않는다는 점이 핵심이에요.","hl":"rule"},{"n":10,"text":"If she were in my situation, she would do the same thing. 그녀가 내 입장이라면 그녀는 똑같은 것을 했을 텐데, 라는 뜻이에요. 주어가 she인데도 be동사를 was가 아니라 were로 썼죠. 이렇게 가정법 과거의 if절에서는 주어와 상관없이 were를 쓴답니다.","hl":"ex-0"},{"n":11,"text":"If he were here, he would help us. 그가 여기 있다면 우리를 도와줄 텐데, 라는 뜻이에요. 여기도 주어가 he지만 be동사는 were를 썼어요. 주어의 수나 인칭에 상관없이 were를 쓴다는 것, 꼭 기억해 두세요.","hl":"ex-1"},{"n":12,"text":"시험에서 정말 자주 나오는 부분이에요. 가정법 과거에서는 If I were, If he were처럼 주어가 무엇이든 were를 쓴다고 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">조건을 나타내는 if절과 구별하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법과 달리 '만약 ~라면 …하겠다'는 \u003cb class=\"key\">조건\u003c/b>을 나타내는 if절에서는 동사를 \u003cb class=\"key\">현재형\u003c/b>으로 써요. 주절에는 will이나 can 같은 \u003cb class=\"key\">현재\u003c/b> 조동사를 써요.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + 동사의 현재형 ~, 주어 + will + 동사원형 …\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If we \u003cspan class=\"fx\">miss\u003c/span> the last train, we'll have to walk home.\u003c/div>\u003cdiv class=\"g-ko\">우리가 마지막 기차를 놓친다면 우리는 집에 걸어서 가야 할 것이다.\u003c/div>\u003cdiv class=\"g-note\">실제로 일어날 수 있는 조건이라 if절에 현재형 miss를 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">If it \u003cspan class=\"fx\">rains\u003c/span> tomorrow, we will stay home.\u003c/div>\u003cdiv class=\"g-ko\">내일 비가 온다면 우리는 집에 있을 것이다.\u003c/div>\u003cdiv class=\"g-note\">조건의 if절이라 현재형 rains를 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>실제로 일어날 수 있는 \u003cb class=\"key\">조건\u003c/b>이면 if절에 \u003cb class=\"key\">현재형\u003c/b>을, 사실과 반대되는 \u003cb class=\"key\">상상\u003c/b>이면 if절에 \u003cb class=\"key\">과거형\u003c/b>을 써요.\u003c/div>","segs":[{"n":13,"text":"마지막으로 조건을 나타내는 if절을 구별해 볼게요. 가정법은 사실과 반대되는 상상을 하지만, 조건을 나타내는 if절은 실제로 일어날 수 있는 일을 말해요. 이때는 if절에 동사의 현재형을 쓰고, 주절에는 will 같은 현재 조동사를 쓴답니다. 뜻은 '만약 ~라면 …하겠다'로 해석해요.","hl":"rule"},{"n":14,"text":"If we miss the last train, we'll have to walk home. 우리가 마지막 기차를 놓친다면 우리는 집에 걸어서 가야 할 것이다, 라는 뜻이에요. 실제로 일어날 수 있는 일이기 때문에 if절에 현재형 miss를 썼고, 주절에는 will이 들어갔죠. 이렇게 조건을 나타내는 if절은 가정법 과거와 다르게 현재형을 쓴답니다.","hl":"ex-0"},{"n":15,"text":"If it rains tomorrow, we will stay home. 내일 비가 온다면 우리는 집에 있을 것이다, 라는 뜻이에요. 내일 실제로 비가 올 수도 있는 조건이니까 if절에 현재형 rains를 쓰고 주절에는 will을 썼어요.","hl":"ex-1"},{"n":16,"text":"이 둘을 구별하는 방법은 간단해요. 실제로 일어날 수 있는 일이면 조건의 if절이라서 현재형을 쓰고, 사실과 반대되는 상상이면 가정법 과거라서 과거형을 쓴답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I am you, I would see a doctor.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I were you, I would see a doctor.\u003c/div>\u003cdiv class=\"g-why\">가정법 과거의 if절에서 be동사는 주어와 상관없이 were를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If you didn't help me, I can't solve the problem.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If you didn't help me, I couldn't solve the problem.\u003c/div>\u003cdiv class=\"g-why\">if절에 과거형이 쓰였으니 주절도 조동사의 과거형 couldn't를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If we miss the last train, we would have to walk home.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If we miss the last train, we'll have to walk home.\u003c/div>\u003cdiv class=\"g-why\">실제로 일어날 수 있는 조건의 if절이므로 주절에 will을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"If I am you, I would see a doctor, 라고 하면 틀린 문장이에요. 뒤에 would see가 왔으니 이건 가정법 과거 문장이죠. 가정법 과거의 if절에서는 be동사를 were로 써서 If I were you라고 해야 해요.","hl":"mk-0"},{"n":18,"text":"If you didn't help me, I can't solve the problem, 이 문장은 시제가 서로 맞지 않아요. if절에 과거형 didn't가 쓰였으니 주절도 조동사의 과거형인 couldn't로 맞춰 줘야 합니다. 그래서 If you didn't help me, I couldn't solve the problem이라고 해야 맞아요.","hl":"mk-1"},{"n":19,"text":"If we miss the last train, we would have to walk home, 이 문장은 조건의 if절에 가정법 형태를 섞어서 틀렸어요. 실제로 일어날 수 있는 조건이니까 주절에는 will을 써서 we'll have to walk home이라고 해야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 골라 가정법 과거 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">If I were you, I ( would see / saw ) a doctor.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>would see\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>saw\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would see\u003c/span>\u003cdiv class=\"g-exp\">가정법 과거의 주절에는 조동사의 과거형 would + 동사원형이 와요. 따라서 would see가 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"자, 첫 번째 문제예요. If I were you, I would see a doctor. 여기서 괄호 안의 두 표현 중에 알맞은 것을 골라 주세요. would see 일까요, saw 일까요? 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 would see예요. If I were you는 내가 너라면이라는 뜻의 가정법 과거 표현이죠. 가정법 과거에서는 주절에 조동사의 과거형인 would를 쓰고 그 뒤에는 동사원형이 와요. 그래서 I would see a doctor, 즉 의사에게 진찰을 받을 텐데라고 말하는 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 골라 가정법 과거 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">If I had enough money, I ( can / could ) buy the car.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>can\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>could\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">could\u003c/span>\u003cdiv class=\"g-exp\">if절에 과거형 had가 쓰였으므로 주절에는 조동사의 과거형 could를 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"두 번째 문제예요. 가정법 과거 문장 If I had enough money 다음에 이어지는 말로 can과 could 중에서 알맞은 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 could예요. if절에 과거형 had가 쓰였으니 주절도 조동사의 과거형인 could를 써야 해요. If I had enough money, I could buy the car, 이렇게 말하면 돈이 충분히 있다면 그 차를 살 수 있을 텐데라는 뜻이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 골라 가정법 과거 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">If I ( don't / didn't ) take the bus, I would be late today.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>don't\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>didn't\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">didn't\u003c/span>\u003cdiv class=\"g-exp\">주절이 I would be late라는 가정법 과거이므로 if절도 과거형 didn't를 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"세 번째 문제예요. If I don't take the bus, I would be late today. 여기서 괄호 안에 don't와 didn't가 나와 있어요. 어느 것이 알맞을까요? 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 didn't예요. 뒤에 오는 주절이 I would be late today, 즉 would를 쓴 가정법 과거이기 때문에 if절도 과거형인 didn't를 써야 해요. 버스를 타지 않는다면 오늘 지각할 텐데, 라고 상상하는 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 골라 가정법 과거 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">If I found a thief breaking in my house, I ( would / will ) call the police.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>would\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>will\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would\u003c/span>\u003cdiv class=\"g-exp\">if절에 과거형 found가 쓰였으므로 주절에는 조동사의 과거형 would를 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"네 번째 문제예요. If I found a thief breaking in my house, I would call the police, 에서 괄호 안의 would와 will 중에 알맞은 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 would예요. if절에 found라는 과거형이 쓰였으니 주절에는 조동사의 과거형 would를 써요. 도둑이 집에 침입하는 것을 발견한다면 경찰을 부를 텐데, 라고 상상하는 가정법 과거 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 뜻이 같도록 빈칸에 알맞은 말을 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">그가 나이가 충분히 들었다면 자동차를 운전할 수 있을 텐데. → If he ____ old enough, he ____ ____ a car.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were, could drive\u003c/span>\u003cdiv class=\"g-exp\">if절의 be동사는 주어 he와 상관없이 were를 쓰고, 주절은 could + 동사원형 drive로 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"다섯 번째 문제는 빈칸 채우기예요. 그가 나이가 충분히 들었다면 자동차를 운전할 수 있을 텐데, 라는 우리말을 영어로 옮긴 문장에서 세 군데 빈칸을 채워 주세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 were, could, drive예요. 여기서 be동사는 주어 he와 상관없이 were를 쓰고, 주절에는 조동사의 과거형 could 다음에 동사원형 drive를 써요. 뒤에 a car가 있으니 drive a car, 즉 자동차를 운전하다가 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 뜻이 같도록 빈칸에 알맞은 말을 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">오늘 날씨가 좋다면 우리가 같이 소풍을 갈 수 있을 텐데. → If it ____ sunny today, we ____ ____ on a picnic together.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were, could go\u003c/span>\u003cdiv class=\"g-exp\">날씨를 말하는 it 뒤에도 가정법 과거에서는 were를 쓰고, 주절은 could + 동사원형 go로 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"마지막 문제예요. 오늘 날씨가 좋다면 우리가 같이 소풍을 갈 수 있을 텐데, 라는 우리말을 영어로 옮긴 문장의 빈칸을 채워 주세요. 날씨를 말할 때 쓰는 be동사에 주의하면서 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 were, could, go예요. 날씨를 말하는 it 뒤에도 가정법 과거에서는 were를 써요. 그리고 주절에는 could 다음에 동사원형 go를 써서 we could go on a picnic together, 즉 함께 소풍을 갈 수 있을 텐데라고 말한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 과거\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>가정법 과거는 \u003cb class=\"key\">현재의 사실\u003c/b>과 반대되는 상황을 가정하며 '~라면 …할 텐데'로 해석해요.\u003c/li>\u003cli>형태는 If + 주어 + \u003cb class=\"key\">동사의 과거형\u003c/b> ~, 주어 + \u003cb class=\"key\">조동사의 과거형\u003c/b> + 동사원형이에요.\u003c/li>\u003cli>가정법 과거의 if절에서 be동사는 주어의 수나 인칭에 상관없이 주로 \u003cb class=\"key\">were\u003c/b>를 써요.\u003c/li>\u003cli>실제로 일어날 수 있는 \u003cb class=\"key\">조건\u003c/b>의 if절에서는 동사를 \u003cb class=\"key\">현재형\u003c/b>으로 쓰고 주절에는 will을 써요.\u003c/li>\u003c/ul>","segs":[{"n":38,"text":"오늘은 가정법 과거를 공부했어요. 가정법 과거는 현재 사실과 반대되는 상황을 상상하면서 '~라면 …할 텐데'라고 말할 때 쓴다는 것, 기억나죠? if절에는 동사의 과거형을, 주절에는 조동사의 과거형 다음에 동사원형을 썼고, be동사는 주어와 상관없이 주로 were를 썼어요. 실제로 일어날 수 있는 조건의 if절은 현재형을 쓴다는 점도 꼭 구별해 두세요. 오늘 배운 내용 잘 복습하고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
