</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01피트 크루의 정의</div><ul><li>자동차 경주에서 드라이버를 뒤에서 돕는 핵심 팀을 소개합니다.</li><li>경기 중 드라이버를 지원하는 피트 크루(pit crew)</li><li>경주 트랙 옆에 위치한 정비 구역인 피트(pit)</li><li>핵심 키워드: 피트 크루(pit crew), 피트(pit)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02피트 크루의 역할</div><ul><li>경주차의 상태를 점검하고 성능을 유지하기 위한 작업을 수행합니다.</li><li>차량 상태 점검(check the car)</li><li>마모되기 쉬운 타이어 교체(change the tires)</li><li>핵심 키워드: 타이어 교체(changing the tires)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03효율적인 협업</div><ul><li>짧은 시간 안에 최고의 성과를 내기 위해 팀워크가 필수적입니다.</li><li>2초 내외의 매우 짧은 피트 스톱(pit stop) 시간</li><li>약 20명의 팀원이 완벽한 조화(perfect harmony)를 이룸</li><li>핵심 키워드: 협업(harmony), 팀원(members)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04승리의 결정적 요인</div><ul><li>피트 크루의 활약이 경주 전체의 승패를 결정짓습니다.</li><li>드라이버보다 피트에서의 작업이 승리에 중요함</li><li>경주는 피트에서 승패가 결정된다는 격언(Races are won in the pits)</li><li>핵심 키워드: 승리(won), 피트(pits)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pit crew</td><td class=\"m\">피트 크루(자동차 경주에서 정비와 급유를 담당하는 팀)</td></tr><tr><td class=\"w\">track</td><td class=\"m\">(경주용) 트랙, 경주로</td></tr><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 몇 번의</td></tr><tr><td class=\"w\">main</td><td class=\"m\">주요한, 주된</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wear out</td><td class=\"m\">닳아 없어지다, 해어지다</td></tr><tr><td class=\"w\">pit stop</td><td class=\"m\">피트 스톱(경주 중 정비와 급유를 위해 정차하는 것)</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">관심, 주목</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마도 오직 볼 것이다</span><span class=\"en\"><b>You may only see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차와 레이서를</span><span class=\"en\"><b>the car and the driver</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 자동차 경주 동안에,</span><span class=\"en\"><b>during most car races,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 팀이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">but</span> there is a team</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">레이서 뒤에 있는</span><span class=\"en\"><b>behind the driver.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 대부분의 자동차 경주에서 자동차와 레이서만 볼지도 모르겠지만, 그 레이서 뒤에는 팀이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경주를 볼 때 눈에 띄는 것은 선수와 차뿐이지만, 실제로는 보이지 않는 곳에서 팀이 그들을 뒷받침하고 있다는 사실을 언급하며 글을 시작합니다. behind는 단순히 &#39;뒤에&#39;라는 위치적 의미를 넘어, 주인공이 경기를 성공적으로 치를 수 있게 지원하는 &#39;배후의 존재&#39;라는 맥락에서 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">but (등위접속사): 대조의 의미를 나타내며 두 절(You may only see... / there is a team...)을 대등하게 연결함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 팀은</span><span class=\"en\"><b>This team</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불린다</span><span class=\"en\"><b><span class=\"grammar-hl\">is called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피트 크루라고</span><span class=\"en\"><b>a pit crew.</b></span></div></div><div class=\"lec-sent-ko\">이 팀은 피트 크루라고 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 보이지 않는 지원군인 &#39;팀&#39;의 정확한 명칭을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is called (수동태): be동사(is) + p.p.(called) 구조. call은 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: call A B (A를 B라고 부르다) 또는 call A (A를 부르다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pit crew</td><td class=\"m\">피트 크루(자동차 경주에서 정비와 급유를 담당하는 팀)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">피트는</span><span class=\"en\"><b>A pit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공간이다</span><span class=\"en\"><b>is a place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경주 트랙 옆에 있는,</span><span class=\"en\"><b><span class=\"grammar-hl\">on the side of the race track</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 레이서들은 그곳에 멈춘다</span><span class=\"en\"><b>and drivers stop there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 번</span><span class=\"en\"><b>several times</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경주 도중에</span><span class=\"en\"><b>during a race.</b></span></div></div><div class=\"lec-sent-ko\">피트는 경주 트랙의 옆에 있는 공간으로, 레이서들이 경주 도중에 그곳에 여러 번 정지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경주 중 반드시 들러야 하는 장소인 &#39;피트&#39;의 정의와 역할을 설명하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on the side of the race track (관용표현): 전치사구로, 장소적 위치(~의 옆에)를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">track</td><td class=\"m\">(경주용) 트랙, 경주로</td></tr><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 몇 번의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주요 역할은</span><span class=\"en\"><b>The main job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피트 크루의</span><span class=\"en\"><b>of the pit crew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차를 점검하는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to check the car</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 타이어를 교체하는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">and change the tires</span>.</b></span></div></div><div class=\"lec-sent-ko\">피트 크루가 하는 주요 역할은 자동차를 점검하고 타이어를 교체하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 소개한 피트 크루가 그곳에서 구체적으로 어떤 일을 하는지 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to check the car and change the tires (to부정사): be동사(is)의 보어 역할(명사적 용법)을 수행하며, pit crew의 역할을 구체적으로 명시함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pit crew</td><td class=\"m\">피트 크루(자동차 경주에서 정비와 급유를 담당하는 팀)</td></tr><tr><td class=\"w\">main</td><td class=\"m\">주요한, 주된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">타이어를 교체하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Changing the tires</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 중요하다</span><span class=\"en\"><b>is especially important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 타이어가 쉽게 마모되기 때문에</span><span class=\"en\"><b>because the tires wear out easily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠른 속도의 경주에서</span><span class=\"en\"><b>in <span class=\"grammar-hl\">a high speed race</span>.</b></span></div></div><div class=\"lec-sent-ko\">빠른 속도의 경주에서는 타이어가 쉽게 마모되기 때문에 타이어를 교체하는 것이 특히 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타이어 교체 작업의 중요성을 강조합니다. 여기서 wear out은 사전적으로 &#39;닳아서 해지다&#39;인데, 고속 주행 시 발생하는 마찰과 열기로 타이어의 성능이 빠르게 소진됨을 뜻합니다. 단순히 &#39;닳다&#39;고 표현하기보다 &#39;소모된다&#39;는 느낌을 주어 작업의 시급성을 강조하려 이 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Changing the tires (동명사): 문장에서 주어 역할을 하며, -ing(Changing)가 명사적 개념(타이어 교체하기)으로 쓰임</div><div class=\"lec-gr-item\">a high speed race (관용표현): 고속 레이스라는 명사구로, race를 수식하는 복합적 의미의 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">wear out</td><td class=\"m\">닳아 없어지다, 해어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">피트에서의 정지는</span><span class=\"en\"><b>A pit stop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~만큼 짧을 수 있다</span><span class=\"en\"><b>can be <span class=\"grammar-hl\">as short as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2초,</span><span class=\"en\"><b><span class=\"grammar-hl\">2 seconds</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 있다</span><span class=\"en\"><b>and there are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많게는 20명에 이르는 구성원이</span><span class=\"en\"><b>as many as 20 members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크루에</span><span class=\"en\"><b>on a crew.</b></span></div></div><div class=\"lec-sent-ko\">피트에서의 정지는 짧게는 2초 정도가 될 수 있고, 한 크루에 많게는 20명에 이르는 구성원이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 피트 스톱이 매우 짧은 시간에 이루어짐을 강조하여, 작업의 신속함과 인원 규모의 거대함을 대조시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as short as 2 seconds (관용표현): as + 형용사 + as 구조로, 비교급의 원급을 사용하여 정도를 강조함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pit stop</td><td class=\"m\">피트 스톱(경주 중 정비와 급유를 위해 정차하는 것)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피트 크루는</span><span class=\"en\"><b>the pit crew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일해야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">has to work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완벽한 조화를 이루며</span><span class=\"en\"><b>in perfect harmony.</b></span></div></div><div class=\"lec-sent-ko\">그러므로 피트 크루는 완벽한 조화를 이루며 일해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 20명이라는 많은 인원이 2초라는 짧은 시간 안에 움직여야 하므로, 개개인의 실력보다 팀워크가 무엇보다 중요하다는 결론을 도출합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has to work (관용표현): 의무를 나타내는 &#39;have to&#39;가 3인칭 단수 주어(the pit crew)에 맞춰 has to로 활용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pit crew</td><td class=\"m\">피트 크루(자동차 경주에서 정비와 급유를 담당하는 팀)</td></tr><tr><td class=\"w\">harmony</td><td class=\"m\">조화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">레이서는</span><span class=\"en\"><b>The driver</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">받을지도 모른다</span><span class=\"en\"><b>may get</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 주목을,</span><span class=\"en\"><b>all the attention,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 사람들이 말하는 것처럼,</span><span class=\"en\"><b>but as people say,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“경주는 우승된다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Races are won</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피트에서.”</span><span class=\"en\"><b>in the pits.”</b></span></div></div><div class=\"lec-sent-ko\">레이서만 모든 주목을 받을지 모르지만 사람들이 말하는 것처럼, “경주의 우승은 피트에서 이루어진다.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보이는 사람(운전자)과 보이지 않는 사람(피트 크루)의 대비를 통해, 실제 승리의 열쇠가 어디에 있는지 강조합니다. won은 사전적으로 &#39;승리하다&#39;인데, 여기서는 경주의 결과가 결정되는 곳이 결승선이 아니라 피트라는 사실을 강조합니다. 승패가 갈리는 핵심적인 순간이 바로 피트에서 발생함을 나타내기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Races are won (수동태): be동사(are) + p.p.(won) 구조. win은 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: win the race (경주에서 우승하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attention</td><td class=\"m\">관심, 주목</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자동차 경주에서 운전자만 주목받지만, 사실 피트 크루라는 팀이 그 뒤에서 중요한 역할을 한다.</li><li>피트 크루는 짧은 시간 안에 차를 점검하고 타이어를 교체하여 경주를 지원한다.</li><li>20명이 2초라는 짧은 시간 안에 움직여야 하므로 완벽한 팀워크가 필수적이다.</li><li>경주의 진정한 승패는 운전자가 아닌, 피트에서의 작업으로 결정된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Pit crews perform crucial maintenance tasks like changing tires, and they must work in perfect harmony to support the driver during short stops.</div>\n              <div class=\"lec-final-sum-ko\">피트 크루는 타이어 교체와 같은 중요한 정비 작업을 수행하며, 짧은 정지 시간 동안 운전자를 돕기 위해 완벽한 조화를 이루어야 한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"audio":"./2_audio/30.mp3","hl":"main"},{"audio":"./2_audio/31.mp3","hl":"meaning"},{"audio":"./2_audio/32.mp3","hl":"grammar"}],[{"audio":"./2_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}func
