만들어내는 활동이라고 볼 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01스포츠 속 숨겨진 조력자들</div><ul><li>운동 경기에서 선수들 뒤에는 주목받지 못하지만 필수적인 역할을 하는 사람들이 있다.</li><li>경기에서 상을 받는 것은 선수들이지만, 혼자서 이기는 것은 아님</li><li>숨겨진 조력자(hidden people)들은 선수만큼이나 중요함</li><li>핵심 키워드: 조력자(helpers), 관심(attention)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마라톤의 페이서 정의</div><ul><li>페이서는 마라톤에서 다른 선수들과 함께 달리며 경기를 이끄는 숙련된 주자들이다.</li><li>페이서(pacers)의 역할: 선수들이 레이스를 잘 관리하도록 돕는 것</li><li>한 경기에는 다양한 속도로 달리는 여러 명의 페이서가 존재함</li><li>핵심 키워드: 숙련된 주자(experienced runners), 속도(speeds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03페이서 식별 방법</div><ul><li>참가자들은 자신이 원하는 목표 기록에 따라 적절한 페이서를 선택할 수 있다.</li><li>페이서는 자신의 완주 목표 시간을 보여주는 깃발이나 풍선을 소지함</li><li>주자들은 자신의 목표 시간에 맞는 페이서를 따라 달림</li><li>핵심 키워드: 목표 시간(target finish time), 완주(finishing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04페이서의 가치</div><ul><li>페이서는 승리를 위해 달리는 것이 아니라 타인의 목표 달성을 위해 달린다.</li><li>페이서가 시간을 확인해주기 때문에 선수들은 목표 기록을 더 쉽게 달성함</li><li>페이서의 본질은 경쟁이 아닌 타인을 위한 달리기임</li><li>핵심 키워드: 조력(support), 목표 달성(achieve goal)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hidden</td><td class=\"m\">숨겨진</td></tr><tr><td class=\"w\">trophy</td><td class=\"m\">트로피</td></tr><tr><td class=\"w\">on one&#39;s own</td><td class=\"m\">혼자 힘으로</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">관심, 주목</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">example</td><td class=\"m\">사례, 예</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, 인도하다</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 숙련된</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">manage</td><td class=\"m\">관리하다, 잘 해내다</td></tr><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 몇 개의</td></tr><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr><tr><td class=\"w\">balloon</td><td class=\"m\">풍선</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 따라 결정하다, 의존하다</td></tr><tr><td class=\"w\">target</td><td class=\"m\">목표</td></tr><tr><td class=\"w\">keep track of</td><td class=\"m\">~을 기록하다, ~의 상태를 계속 파악하다</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스포츠에서는,</span><span class=\"en\"><b>In sports,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 선수들만이</span><span class=\"en\"><b>only the players</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">트로피나 메달을 받는다,</span><span class=\"en\"><b>get a trophy or medal,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들은 우승하지 못한다</span><span class=\"en\"><b>but they don’t win</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 스스로의 힘으로는.</span><span class=\"en\"><b>on their own.</b></span></div></div><div class=\"lec-sent-ko\">스포츠에서는 선수들만 트로피나 메달을 받지만, 그들이 혼자 힘으로 우승하는 것은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스포츠 경기에서 겉으로 드러나는 주인공은 선수들이지만, 결과적으로 승리를 거두기까지는 선수 혼자만의 힘이 아닌 보이지 않는 도움이 작용했음을 밝히며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hidden People (과거분사): 과거분사(hidden)가 명사(People)를 수식하는 구조. &#39;p.p. + N&#39; 형태로 &#39;과거분사된 N&#39;을 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trophy</td><td class=\"m\">트로피</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 있다</span><span class=\"en\"><b>There are <span class=\"grammar-hl\">people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕는</span><span class=\"en\"><b><span class=\"grammar-hl\">who help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 선수들을.</span><span class=\"en\"><b><span class=\"grammar-hl\">the players</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 선수들을 돕는 사람들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;혼자 승리하는 것이 아니다&#39;라는 말의 근거로, 선수들의 뒤에서 보이지 않는 조력자들의 존재를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people who help the players (관계대명사): 주격 관계대명사(who)가 이끄는 절이 앞의 명사(people)를 수식하는 구조. 관계대명사 뒤에는 주어 없이 바로 동사(help)가 오는 불완전한 문장이 옴</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 사람들은</span><span class=\"en\"><b>These people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 숨겨져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are often hidden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 받지 못한다</span><span class=\"en\"><b>and don’t get</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주목을.</span><span class=\"en\"><b>attention.</b></span></div></div><div class=\"lec-sent-ko\">이 사람들은 종종 숨겨져 있고 주목을 받지 못한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조력자들의 일반적인 특성을 설명합니다. 여기서 hidden은 사전적으로 &#39;숨겨진&#39;인데, 여기서는 대중의 눈에 띄지 않거나 주목받는 무대 뒤에 있다는 뜻입니다. 조연으로서의 존재감을 부각하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are often hidden (수동태): be동사(are)+p.p.(hidden) 구조. hide는 타동사인데 뒤에 목적어가 없어서 수동구조 are hidden 형태로 씀. 기본구조: hide O (O를 숨기다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hidden</td><td class=\"m\">숨겨진</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">관심, 주목</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 중요하다</span><span class=\"en\"><b>they are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똑같이</span><span class=\"en\"><b><span class=\"grammar-hl\">as important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들만큼.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the players.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그들은 선수들만큼 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 겉으로 드러나지 않는다고 해서 가치가 떨어지는 것은 아님을 강조하는 문장입니다. 앞 문장과의 역접 관계를 통해 조력자들의 진정한 가치를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as important as (관용표현): 원급 비교 구조(as + 형용사/부사 + as)로, 뒤의 대상과 같은 수준임을 나타내는 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기</span><span class=\"en\"><b><span class=\"grammar-hl\">Here</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 예들이.</span><span class=\"en\"><b><span class=\"grammar-hl\">some examples</span>.</b></span></div></div><div class=\"lec-sent-ko\">여기 몇 가지 예가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;보이지 않는 조력자&#39;들에 대한 구체적인 사례를 소개할 것임을 나타내며 글의 다음 단락으로 자연스럽게 이어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here are some examples (도치): 장소부사(Here)가 문두로 나오면서 주어(some examples)와 동사(are)의 위치가 바뀐 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">example</td><td class=\"m\">사례, 예</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">페이서들은</span><span class=\"en\"><b>Pacers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 선수들과 함께 달린다</span><span class=\"en\"><b>run with other runners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들을 이끈다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">lead them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마라톤에서.</span><span class=\"en\"><b>in a marathon.</b></span></div></div><div class=\"lec-sent-ko\">페이서들은 마라톤에서 다른 선수들과 함께 달리며 그들을 이끈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤의 조력자인 &#39;페이스메이커(Pacers)&#39;를 소개하며 그들의 역할을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lead them 동사구 구조: 주어(Pacers)가 공통인 병렬 구조. Pacers run... and (Pacers) lead...</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, 인도하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">페이서들은 경험이 많은 선수들이다,</span><span class=\"en\"><b>Pacers are experienced runners,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 역할은</span><span class=\"en\"><b>and <span class=\"grammar-hl\">their job</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is to help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 선수들이</span><span class=\"en\"><b><span class=\"grammar-hl\">other runners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 경주를 더 잘 운영하도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">manage their race better</span>.</b></span></div></div><div class=\"lec-sent-ko\">페이서들은 경험이 많은 선수들이며, 그들의 역할은 다른 선수들이 경주를 더 잘 운영하도록 돕는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤의 조력자인 &#39;페이스메이커(Pacers)&#39;를 소개하며 그들의 역할을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">their job is to help other runners manage their race better (to부정사): 보어 역할을 하는 to부정사(to help)로, &#39;주어의 상태/내용&#39;을 보충 설명함. 또한 help는 5형식 구조로 쓰여 help(V) + other runners(O) + manage(OC, 동사원형)의 형태를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 숙련된</td></tr><tr><td class=\"w\">manage</td><td class=\"m\">관리하다, 잘 해내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있을 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There can be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 명의 페이서들이</span><span class=\"en\"><b>several pacers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 경주에는.</span><span class=\"en\"><b>in a race.</b></span></div></div><div class=\"lec-sent-ko\">한 경주에는 여러 명의 페이서들이 있을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 페이스메이커가 단 한 명이 아니라 다양한 목표를 위해 여러 명 존재함을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There can be (도치): 유도부사(There) 구문으로, 주어(several pacers)가 동사(be) 뒤에 위치하는 도치 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">several</td><td class=\"m\">몇몇의, 몇 개의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각각의 페이서는</span><span class=\"en\"><b>Each pacer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 속도로 달린다</span><span class=\"en\"><b>runs at different speeds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 경주를 마친다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">finishes</span> the race</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 시간대에.</span><span class=\"en\"><b>in different times.</b></span></div></div><div class=\"lec-sent-ko\">각각의 페이서는 다른 속도로 달리고 다른 시간대에 경주를 마친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다양한 주자의 요구를 맞추기 위해 페이스메이커들이 각기 다른 속도로 배정됨을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">finishes 동사구 구조: 주어(Each pacer)가 단수이므로 동사에 -es가 붙은 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">페이서들은 보통 가지고 있다</span><span class=\"en\"><b>Pacers usually have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깃발이나 풍선을</span><span class=\"en\"><b>flags or balloons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여주는</span><span class=\"en\"><b><span class=\"grammar-hl\">showing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 완주 시간을.</span><span class=\"en\"><b><span class=\"grammar-hl\">their finish time</span>.</b></span></div></div><div class=\"lec-sent-ko\">페이서들은 보통 자신들의 완주 시간을 나타내는 깃발이나 풍선을 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주자들이 자신에게 맞는 페이스메이커를 쉽게 찾을 수 있도록 돕는 구체적인 식별 수단을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">showing their finish time (현재분사): 현재분사(showing)가 앞의 명사(flags or balloons)를 수식하는 구조. &#39;N + -ing&#39; 형태로 &#39;N that is -ing&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr><tr><td class=\"w\">balloon</td><td class=\"m\">풍선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선수들은 선택할 수 있다</span><span class=\"en\"><b>Runners can choose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">페이서를</span><span class=\"en\"><b>a pacer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">depending on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 목표 완주 시간.</span><span class=\"en\"><b>their target finish time.</b></span></div></div><div class=\"lec-sent-ko\">선수들은 자신들의 목표 완주 시간에 따라 페이서를 선택할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 페이스메이커를 활용하는 주자의 입장에서 선택 기준을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">depending on (관용표현): 분사구문에서 유래한 전치사적 표현(~에 따라)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr><tr><td class=\"w\">target</td><td class=\"m\">목표</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 한 선수가 원한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if a runner wants</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경주를 마치기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to finish</span> the race</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">4시간 안에,</span><span class=\"en\"><b>in four hours,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 선수는 따라갈 것이다</span><span class=\"en\"><b>the runner will follow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">4시간 페이서를.</span><span class=\"en\"><b>the four-hour pacer.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 한 선수가 4시간 안에 경주를 마치고 싶다면, 그 선수는 4시간 페이서를 따라갈 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 구체적인 예를 들어 독자가 쉽게 이해하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if a runner wants to finish (to부정사): 동사(want)의 목적어 역할을 하는 to부정사(to finish) 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">example</td><td class=\"m\">사례, 예</td></tr><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">페이서가</span><span class=\"en\"><b>Since the pacer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 계속 파악하기 때문에,</span><span class=\"en\"><b>keeps track of the time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수는 달성할 수 있다</span><span class=\"en\"><b>the runner can <span class=\"grammar-hl\">achieve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 목표를</span><span class=\"en\"><b><span class=\"grammar-hl\">his or her goal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마라톤을 완주하려는</span><span class=\"en\"><b><span class=\"grammar-hl\">of finishing the marathon</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 시간 안에</span><span class=\"en\"><b>in a particular time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게.</span><span class=\"en\"><b>more easily.</b></span></div></div><div class=\"lec-sent-ko\">페이서가 시간을 계속해서 파악하기 때문에, 선수는 특정 시간 안에 마라톤을 완주하려는 자신의 목표를 더 쉽게 달성할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 페이스메이커의 실질적인 도움(시간 관리)이 주자의 목표 달성에 어떻게 기여하는지 결과를 보여줍니다. 여기서 keeps track of는 사전적으로 &#39;기록을 유지하다&#39;인데, 여기서는 경기 내내 시간 변화를 놓치지 않고 계속 신경 쓴다는 뜻입니다. 주자의 페이스를 조절하는 핵심적인 역할을 강조하기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">achieve his or her goal of finishing the marathon (동명사): 전치사(of)의 목적어로 쓰인 동명사(finishing) 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">finish</td><td class=\"m\">끝내다, 완주하다</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요컨대,</span><span class=\"en\"><b>In short,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">페이서들은 달린다</span><span class=\"en\"><b>pacers run</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들은 달리지 않는다</span><span class=\"en\"><b>but they <span class=\"grammar-hl\">don’t run</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우승하기 위해서는.</span><span class=\"en\"><b><span class=\"grammar-hl\">to win</span>.</b></span></div></div><div class=\"lec-sent-ko\">요컨대, 페이서들은 달리기는 하지만 우승을 하기 위해 달리는 것은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 페이스메이커의 독특한 위치를 정리합니다. 자신의 우승이 아닌 &#39;타인의 도움&#39;이 목적인 그들의 성격을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t run to win (to부정사): 목적을 나타내는 부사적 용법의 to부정사(~하기 위해서)</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 달린다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">run</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 이들을 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">for others</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 다른 이들을 위해 달린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주제를 관통하는 핵심 문장입니다. 자신의 이익이 아닌 타인을 향한 헌신이 페이스메이커의 존재 이유임을 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">run for others (기본구조): 일반동사 run의 자동사적 활용</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스포츠에는 선수 외에도 관심을 받지 못하는 조력자들이 존재한다.</li><li>마라톤의 페이스메이커는 다른 주자들이 목표한 시간에 완주하도록 돕는 역할을 한다.</li><li>페이스메이커는 우승을 위해 달리는 것이 아니라 타인을 위해 달린다.</li><li>보이지 않는 곳에서 헌신하는 이들은 선수만큼이나 중요한 역할을 수행한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Pacers lead runners during a race to help them manage their speed, and they dedicate their efforts to support others rather than winning for themselves.</div>\n              <div class=\"lec-final-sum-ko\">페이서들은 주자들이 속도를 조절하도록 경기 중에 그들을 이끌며, 자신을 위해 우승하기보다 다른 이들을 돕기 위해 노력한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"}
