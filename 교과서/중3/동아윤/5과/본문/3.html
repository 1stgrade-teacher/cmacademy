fMvO4nkDknH90A8EYODnjGMCgp2yuMDHOMjgce4659BnOapNdXta93rrbfXd/mNSTsr3066a6L73+O/YjJAIB5Pr6e/+e1O+nXkcnGcg98Nj67WIHY9KCFK9OcfMeOAT9e3XoeenSjbx0yMH5h8wQgE85JA9cHPHBxg4F/n+Hbf16afcN6ppWel9LvdX1tr6/gf/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Sherpas: The Unsung Heroes of Mount Everest<small>셰르파: 에베레스트의 숨은 영웅들</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 히말라야 산맥에 사는 셰르파(Sherpas)라는 부족에 대해 다루고 있는데, 이들은 고산 지대 적응력(High-altitude adaptation)이 매우 뛰어나기로 유명해요. 셰르파들은 수천 년 동안 높은 산에서 살아오면서 낮은 산소 농도에서도 신체 기능을 효율적으로 유지하는 유전적 특성을 가지게 되었답니다. 등반가들이 에베레스트 같은 8,000미터가 넘는 고봉을 오를 때, 이들은 길을 안내하거나 장비를 운반하는 등 등반 보조(Climbing support) 역할을 수행하며 없어서는 안 될 핵심 파트너가 되어 주죠. 마치 낯선 외국 여행지에서 현지 지리를 아주 잘 아는 든든한 가이드를 만나는 것과 비슷하다고 생각하면 돼요. 흔히 등반가 개인의 성취에만 주목하지만, 사실 셰르파들의 희생과 노력이 있었기에 원정 성공(Expedition success)이 가능하다는 점을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01셰르파의 배경과 신체적 강점</div><ul><li>네팔 동부에 거주하는 셰르파족은 뛰어난 등반 능력과 고산 적응력을 갖추고 있습니다.</li><li>네팔 동부(eastern part of Nepal)에 사는 부족</li><li>높은 산에서도 숨 쉬는 데 어려움이 없음</li><li>핵심 키워드: 셰르파(Sherpa), 등반 기술(climbing skills)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02산악 등반의 조력자 역할</div><ul><li>셰르파들은 전문적인 등반 기술을 바탕으로 산악인들의 등반 과정을 돕습니다.</li><li>정상까지 가는 길을 안내함</li><li>등반에 필요한 텐트 설치 및 짐 운반</li><li>핵심 키워드: 조력자(support), 안내자(lead)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가려진 영웅의 모습</div><ul><li>셰르파들은 묵묵히 등반을 돕지만, 대중에게 그들의 노고는 잘 드러나지 않는 경우가 많습니다.</li><li>정상 사진에는 등반가들만 주로 보임</li><li>보이지 않는 사람들(invisible people)이라는 별칭으로 불림</li><li>핵심 키워드: 가려진 존재(invisible), 노고(effort)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">tribe</td><td class=\"m\">부족</td></tr><tr><td class=\"w\">eastern</td><td class=\"m\">동쪽의, 동부의</td></tr><tr><td class=\"w\">climbing</td><td class=\"m\">등반</td></tr><tr><td class=\"w\">skill</td><td class=\"m\">기술, 능력</td></tr><tr><td class=\"w\">know one&#39;s way around</td><td class=\"m\">~에 밝다, ~의 지리를 잘 알다</td></tr><tr><td class=\"w\">difficulty</td><td class=\"m\">어려움, 고충</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">breathe</td><td class=\"m\">호흡하다, 숨 쉬다</td></tr><tr><td class=\"w\">therefore</td><td class=\"m\">그러므로, 그 결과</td></tr><tr><td class=\"w\">hire</td><td class=\"m\">고용하다</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, 안내하다</td></tr><tr><td class=\"w\">support</td><td class=\"m\">돕다, 지원하다</td></tr><tr><td class=\"w\">put up</td><td class=\"m\">설치하다, 세우다</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">셰르파라는 단어는</span><span class=\"en\"><b>The word Sherpa</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셰르파 부족으로부터 유래한다,</span><span class=\"en\"><b>comes from the Sherpa tribe,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 부족은 산다</span><span class=\"en\"><b><span class=\"grammar-hl\">which lives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동쪽 지역에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the eastern part</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네팔의</span><span class=\"en\"><b><span class=\"grammar-hl\">of Nepal</span>.</b></span></div></div><div class=\"lec-sent-ko\">Sherpa라는 단어는 셰르파족에서 유래되었는데, 셰르파족은 네팔의 동쪽 지역에 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파라는 명칭의 기원을 설명하며 글의 소재를 소개하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which lives in the eastern part of Nepal (관계대명사): which는 선행사 &#39;the Sherpa tribe&#39;를 수식하며 절 내부에서 주어 역할을 하는 주격 관계대명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">tribe</td><td class=\"m\">부족</td></tr><tr><td class=\"w\">eastern</td><td class=\"m\">동쪽의, 동부의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">셰르파들은 가지고 있다</span><span class=\"en\"><b>Sherpas have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 등반 기술들을</span><span class=\"en\"><b>good climbing skills</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 알고 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산 주변의 길을</span><span class=\"en\"><b><span class=\"grammar-hl\">their way around the mountains</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘</span><span class=\"en\"><b>well.</b></span></div></div><div class=\"lec-sent-ko\">셰르파는 훌륭한 등반 기술을 가졌으며 산의 지리에 밝다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파들이 고산 등반에 적합한 신체적, 환경적 능력을 갖추고 있음을 보여주며, 왜 그들이 등반을 돕게 되었는지에 대한 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">know their way around the mountains (관용표현): &#39;know one&#39;s way around ~&#39;는 &#39;~의 지리를 잘 알다/익숙하다&#39;라는 의미로 쓰이는 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">climbing</td><td class=\"m\">등반</td></tr><tr><td class=\"w\">skill</td><td class=\"m\">기술, 능력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 가지고 있다</span><span class=\"en\"><b>They also <span class=\"grammar-hl\">have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 없는 어려움을</span><span class=\"en\"><b><span class=\"grammar-hl\">little difficulty</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호흡하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">breathing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 곳에서</span><span class=\"en\"><b>high up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산의</span><span class=\"en\"><b>in the mountains.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 산의 높은 곳에서 호흡하는 데 어려움이 거의 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고산 지대라는 특수한 환경에 적응된 그들의 생물학적 강점을 설명합니다. 여기서 little은 부정어와 결합하여 &#39;거의 없다&#39;는 의미로 쓰였는데, 이는 셰르파가 고산 지대에서 겪는 호흡 곤란이 사실상 제로에 가깝다는 점을 강조하여 그들의 독보적인 능력을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have little difficulty breathing (관용표현): &#39;have difficulty (in) -ing&#39; 구문으로 &#39;~하는 데 어려움을 겪다&#39;라는 의미이며, little이 붙어 &#39;어려움이 거의 없다&#39;는 뜻입니다. 여기서 breathing은 동명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">difficulty</td><td class=\"m\">어려움, 고충</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">등산가들은 시작했다</span><span class=\"en\"><b>mountain climbers <span class=\"grammar-hl\">started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셰르파들을 고용하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to hire</span> Sherpas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 돕기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to help them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에베레스트산을 오르는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">climb</span> Mount Everest.</b></span></div></div><div class=\"lec-sent-ko\">그래서 등산가들은 자신들이 에베레스트산을 등반하는 것을 돕는 셰르파를 고용하기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 셰르파의 능력(등반 기술, 지리적 지식, 고산 적응력)이 원인이 되어 그들이 고용되었다는 인과관계를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started to hire (to부정사): start의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">to help them climb (to부정사): help가 5형식(help+O+동사원형)으로 쓰여, climb(목적보어)을 돕기 위한 목적을 나타내는 부사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">therefore</td><td class=\"m\">그러므로, 그 결과</td></tr><tr><td class=\"w\">hire</td><td class=\"m\">고용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">셰르파들은 이끈다</span><span class=\"en\"><b>Sherpas <span class=\"grammar-hl\">lead</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">등산가들을</span><span class=\"en\"><b><span class=\"grammar-hl\">mountain climbers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정상으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to the top</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the mountain</span>.</b></span></div></div><div class=\"lec-sent-ko\">셰르파는 등산가들을 산 정상까지 이끈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파가 등반 과정에서 수행하는 핵심적인 역할인 &#39;가이드&#39; 역할을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lead mountain climbers to the top of the mountain 5형식(SVOC) 구조: 주어(Sherpas) + 동사(lead) + 목적어(mountain climbers) + 전치사구(to the top of the mountain)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, 안내하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 지원한다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">support</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">등산가들을</span><span class=\"en\"><b><span class=\"grammar-hl\">climbers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 방식으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in many ways</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 여러 방식으로 등산가들을 지원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파의 역할이 단지 길을 안내하는 것에 그치지 않고 훨씬 광범위함을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">support climbers in many ways (기본구조): 주어(They) + 동사(support) + 목적어(climbers)의 3형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">support</td><td class=\"m\">돕다, 지원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 설치한다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">put up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텐트를</span><span class=\"en\"><b><span class=\"grammar-hl\">tents</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 운반한다</span><span class=\"en\"><b>and carry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">등산가들의 가방을</span><span class=\"en\"><b>climbers’ bags.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 그들은 텐트를 치고 등산가들의 가방을 운반한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파가 제공하는 실질적인 지원 사례를 나열하여 앞 문장의 내용을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">put up tents (관용표현): &#39;put up&#39;은 &#39;세우다/설치하다&#39;라는 의미의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">put up</td><td class=\"m\">설치하다, 세우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">셰르파들은 종종 불린다</span><span class=\"en\"><b>Sherpas <span class=\"grammar-hl\">are often called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보이지 않는 사람들로</span><span class=\"en\"><b>the <span class=\"grammar-hl\">invisible</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에베레스트산의</span><span class=\"en\"><b>of Mount Everest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 사람들은 흔히 보기 때문이다</span><span class=\"en\"><b>because people often see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을</span><span class=\"en\"><b>a picture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">등산가들만이 찍힌</span><span class=\"en\"><b>of only the climbers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정상에 있는</span><span class=\"en\"><b>at the top</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산의</span><span class=\"en\"><b>of the mountain.</b></span></div></div><div class=\"lec-sent-ko\">셰르파는 종종 에베레스트산의 보이지 않는 사람들로 불리는데, 왜냐하면 사람들은 흔히 산 정상에서 등산가들만 찍힌 사진을 보기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셰르파의 헌신적인 노고에도 불구하고 대중에게는 잘 드러나지 않는 현실을 지적합니다. 여기서 invisible은 &#39;눈에 보이지 않는&#39;이라는 뜻인데, 실제 그들이 투명 인간이라는 뜻이 아니라, 등반의 성공 과정에서 결정적인 기여를 함에도 불구하고 그들의 존재가 대중의 주목을 받지 못하는 상황을 비유적으로 표현하여 안타까움을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are often called (수동태): be동사(are)+p.p.(called) 구조입니다. call은 타동사인데 목적어가 없어서 수동구조 are called 형태로 씁니다. 기본구조: call A B (A를 B라고 부르다)의 수동태로 A가 주어로 나가고 B(the invisible people...)가 보어로 남은 형태입니다.</div><div class=\"lec-gr-item\">invisible 형용사: 명사 &#39;the people&#39;을 수식하며 &#39;보이지 않는&#39;이라는 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">Sherpa</td><td class=\"m\">셰르파(네팔 동부 산악 지대에 사는 부족)</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>&#39;셰르파&#39;는 네팔의 특정 부족에서 유래했으며, 뛰어난 고산 등반 능력을 갖추고 있다.</li><li>신체적·기술적 강점 덕분에 셰르파는 에베레스트 등반가들을 돕는 필수적인 조력자가 되었다.</li><li>이들은 길 안내뿐만 아니라 짐 운반 등 실질적인 지원을 제공한다.</li><li>하지만 정작 정상에 오른 등반가들만 사진에 남겨지기에, 셰르파는 &#39;보이지 않는 사람들&#39;이라 불린다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Sherpas provide crucial support to climbers by utilizing their climbing skills and high-altitude endurance, yet they remain largely invisible in public recognition.</div>\n              <div class=\"lec-final-sum-ko\">셰르파들은 등반 기술과 고산지대 적응력을 활용해 등반가를 지원하지만, 대중적인 인지도는 여전히 낮은 편이다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.mp3","hl":"meaning"},{"audio":"./3_audio/28.mp3","hl":"grammar"}],[{"audio":"./3_audio/29.mp3","hl":"main"},{"audio":"./3_audio/30.mp3","hl":"meaning"},{"audio":"./3_audio/31.mp3","hl":"grammar"}],[{"audio":"./3_audio/32.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){r
