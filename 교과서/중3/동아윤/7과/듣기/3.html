  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"Listen and Order2","title":"중3 동아(윤) Lesson7 대화문 Listen and Order2","audioDir":"3_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">방법·절차 묻고 답하기\u003c/div>\u003ch1>중3 동아(윤) 7과 대화문 해설 — 간식 자판기 사용법 묻고 답하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>편의점에서 남학생이 간식을 사고 싶지만 간식 자판기 사용법을 몰라 여학생에게 어떻게 쓰는지 묻습니다. 여학생은 first, then 같은 순서 표현을 써서 간식 고르기, 돈 넣기, 간식 꺼내기 순서로 친절하게 알려 줍니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 삼 학년 동아 교과서 칠 과 대화문을 함께 공부해 볼 거예요. 편의점에서 남학생이 간식 자판기를 쓰고 싶은데 사용법을 몰라서 여학생에게 묻는 상황이에요. 여학생이 순서대로 차근차근 알려 주니까, 오늘 표현만 잘 익히면 여러분도 자판기 앞에서 당당하게 쓸 수 있을 거예요. 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">I want to buy a snack. Do you know how to① use this snack machine?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yeah. First, choose the snack ②you want.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">I already did. What's next?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Just put in the money. Then take the snack out.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">④Got it. Thanks.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"I want to buy a snack. Do you know how to첫 번째 use this snack machine?","hl":"r-0"},{"n":3,"text":"Yeah. First, choose the snack 두 번째you want.","hl":"r-1"},{"n":4,"text":"I already did. What's next?","hl":"r-2"},{"n":5,"text":"Just put in the money. Then take the snack out.","hl":"r-3"},{"n":6,"text":"네 번째Got it. Thanks.","hl":"r-4"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">방법·절차 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Do you know how to + 동사원형?\u003c/div>\u003cdiv class=\"d-mean\">~하는 방법을 아니? / ~하는 방법 좀 알려 줄래?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I want to buy a snack. Do you know how to① use this snack machine?\u003c/div>\u003cdiv class=\"d-exp\">\u003cb class=\"key\">how to + 동사원형\u003c/b>은 '~하는 방법'이라는 뜻이에요. 상대방에게 어떤 방법이나 절차를 물을 때는 \u003cb class=\"key\">Can you tell me how to ~?\u003c/b>를 쓰고, \u003cb class=\"key\">Do you know how to ~?\u003c/b>라고도 물을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Can you tell me how to + 동사원형?\u003c/li>\u003cli>Could you show me how to + 동사원형?\u003c/li>\u003cli>How do I + 동사원형?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>First, + 동사원형. Then, + 동사원형.\u003c/li>\u003cli>Just + 동사원형.\u003c/li>\u003cli>Sure. It's easy. Let me show you.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"먼저 대화의 첫 번째 줄을 볼까요? 남학생이 이렇게 말해요. Do you know how to use this snack machine? 이 간식 자판기 어떻게 사용하는지 알아? 라는 뜻이에요. 이때 how to 다음에는 동사원형이 온다는 점, 꼭 기억해 두세요. 상대방에게 방법이나 절차를 물을 때는 Can you tell me how to 다음에 동사원형을 붙여서 말해도 된답니다.","hl":"key"},{"n":8,"text":"같은 뜻으로 이렇게도 물을 수 있어요. Can you tell me how to use this snack machine? 이 간식 자판기 어떻게 쓰는지 알려 줄래요? 라고 하는 거예요. 또 Could you show me how to use this snack machine? 라고 하면 사용법을 보여 달라는 뜻이 되고, How do I use this snack machine? 은 어떻게 사용하나요? 라는 뜻이에요.","hl":"alts"},{"n":9,"text":"그럼 대답은 어떻게 할까요? First, choose the snack you want. 처럼 먼저 무엇을 하라고 알려 주면 돼요. 그다음에 Just put in the money. 라고 하거나 Then take the snack out. 처럼 이어서 할 일을 말해 주면 된답니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">절차 설명하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">First, + 명령문. Then, + 명령문.\u003c/div>\u003cdiv class=\"d-mean\">먼저 ~하세요. 그다음에 ~하세요.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Yeah. First, choose the snack ②you want.\u003c/div>\u003cdiv class=\"d-exp\">방법이나 절차를 설명할 때는 \u003cb class=\"key\">first\u003c/b>, \u003cb class=\"key\">then\u003c/b> 같은 순서를 나타내는 연결어를 사용하여 일의 순서를 알려 줄 수 있어요. 명령문 앞에 first를 붙이면 '먼저 ~하세요', then을 붙이면 '그다음에 ~하세요'라는 뜻이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>To begin with, + 명령문. After that, + 명령문.\u003c/li>\u003cli>First of all, + 명령문. Next, + 명령문.\u003c/li>\u003cli>You should + 동사원형 first.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Okay, I got it.\u003c/li>\u003cli>Thanks. Anything else?\u003c/li>\u003cli>Sounds easy.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 순서를 알려 주는 표현을 배워 볼게요. 방법이나 절차를 설명할 때는 first, then 같은 순서를 나타내는 연결어를 사용해요. First, choose the snack you want. 는 먼저 네가 원하는 간식을 고르라는 뜻이고, Then take the snack out. 은 그다음에 간식을 꺼내라는 뜻이에요.","hl":"key"},{"n":11,"text":"조금 다르게도 말할 수 있어요. To begin with, choose the snack you want. 라고 하면 먼저 간식을 고르라는 뜻이 되고, After that, take the snack out. 은 그 후에 간식을 꺼내라는 뜻이에요. First of all, put in the money. 처럼 first of all을 써도 같은 느낌이랍니다.","hl":"alts"},{"n":12,"text":"이렇게 순서를 알려 주면 듣는 사람은 이렇게 반응해요. Okay, I got it. 은 알았어, 이해했어 라는 뜻이고, Thanks. Anything else? 는 고마워, 더 할 일 있어? 라는 뜻이에요. Sounds easy. 라고 하면 쉬운 것 같다고 말하는 거예요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I want to buy a snack\u003c/span>. \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Do you know how to\u003c/span>① use this snack machine?\u003c/div>\u003cdiv class=\"d-ko\">간식을 사고 싶어. 이 간식 자판기 어떻게 사용하는지 알아?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">want to + 동사원형\u003c/b>은 '~하고 싶다'는 뜻이에요. buy a snack은 '간식을 사다'라는 뜻이고요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">how to + 동사원형\u003c/b>은 '~하는 방법'이라는 뜻이에요. \u003cb class=\"key\">Do you know how to ~?\u003c/b>는 상대방에게 방법이나 절차를 묻는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Can you tell me how to use this snack machine?\u003c/span>\u003cspan>Could you show me how to use this snack machine?\u003c/span>\u003cspan>How do I use this snack machine?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yeah. \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">First, choose the snack\u003c/span> ②\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">you want\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">응. 먼저, 네가 원하는 간식을 골라.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">First\u003c/b>는 일의 순서를 나타내는 연결어로 '먼저'라는 뜻이에요. 이렇게 명령문 앞에 붙여서 순서를 알려 줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>선행사 the snack을 수식하는 각각의 절 앞에는 \u003cb class=\"key\">목적격 관계대명사\u003c/b> \u003cb class=\"key\">that/which\u003c/b>가 생략되어 있어요. 즉 the snack (that/which) you want의 구조입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>First, pick the snack you want.\u003c/span>\u003cspan>First of all, select the snack that you want.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"첫 번째 줄이에요. I want to buy a snack. Do you know how to use this snack machine? 라고 남학생이 말해요. 뜻은 간식을 사고 싶은데, 이 간식 자판기 어떻게 사용하는지 아느냐는 거예요. want to 다음에는 동사원형이 오고, how to 다음에도 동사원형이 온다는 점을 꼭 기억해 주세요. 이 문장은 Can you tell me how to use this snack machine? 이렇게도 물을 수 있답니다.","hl":"l-0"},{"n":14,"text":"두 번째 줄이에요. 여학생이 Yeah. First, choose the snack you want. 라고 대답해요. 응, 먼저 네가 원하는 간식을 골라, 라는 뜻이죠. 이때 First는 순서를 알려 주는 연결어이고, the snack you want에서 the snack 뒤에는 목적격 관계대명사 that이나 which가 생략되어 있어요. First, pick the snack you want. 라고 해도 같은 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">I already did.\u003c/span> \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">What's next?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나 이미 그렇게 했어. 다음은 뭐야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>already는 '이미'라는 뜻이고, did는 앞에 나온 choose the snack you want를 대신하는 \u003cb class=\"key\">대동사\u003c/b>예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">What's next?\u003c/b>는 '다음은 뭐야?'라는 뜻으로, 다음 순서를 물을 때 쓰는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What should I do next?\u003c/span>\u003cspan>What do I do after that?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Just \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">put in the money\u003c/span>. \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Then take the snack out\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">그냥 돈을 넣어. 그다음에 간식을 꺼내.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">put in\u003c/b>은 '돈을 넣다'라는 뜻이에요. put the money in이라고 해도 같은 뜻입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">Then\u003c/b>은 '그다음에'라는 뜻으로 순서를 이어 주는 연결어예요. \u003cb class=\"key\">take out\u003c/b>은 '꺼내다'라는 뜻으로 take the snack out처럼 목적어를 사이에 넣어 쓸 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Just insert the money. Then take out the snack.\u003c/span>\u003cspan>All you have to do is put in the money and take the snack out.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"세 번째 줄이에요. 남학생이 I already did. What's next? 라고 말해요. 나는 이미 그렇게 했고, 다음은 뭐야? 라는 뜻이에요. already는 이미, did는 앞에 나온 choose를 대신하는 말이에요. 같은 뜻으로 What should I do next? 라고도 말할 수 있어요.","hl":"l-0"},{"n":16,"text":"네 번째 줄이에요. 여학생이 Just put in the money. Then take the snack out. 이라고 알려 줘요. 그냥 돈을 넣고, 그다음에 간식을 꺼내, 라는 뜻이에요. put in은 돈을 넣다, take out은 꺼내다라는 뜻이고, Then은 순서를 이어 주는 연결어예요. Just insert the money. Then take out the snack. 이렇게 바꿔 말해도 된답니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">④\u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">Got it\u003c/span>. Thanks.\u003c/div>\u003cdiv class=\"d-ko\">알았어. 고마워.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">(I) got it.\u003c/b>은 '알았어, 이해했어'라는 뜻이에요. 주어 I를 생략한 구어체 표현입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I see. Thanks.\u003c/span>\u003cspan>Okay, I understand. Thank you.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"다섯 번째 줄이에요. 남학생이 Got it. Thanks. 라고 말해요. 알았어, 고마워, 라는 뜻이죠. Got it은 I got it에서 주어를 줄인 말로 알았어, 이해했어라는 뜻이에요. 같은 뜻으로 I see. Thanks. 라고 하거나 Okay, I understand. Thank you. 라고 해도 자연스러워요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장과 같은 의미로 쓸 수 있는 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Do you know how to use this snack machine?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Can you tell me how to use this snack machine?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Do you know where this snack machine is?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>How much is this snack machine?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Do you know who made this snack machine?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Can you tell me how to use this snack machine?\u003c/span>\u003cdiv class=\"g-exp\">[[Do you know how to + 동사원형?]]은 '~하는 방법을 아니?'라는 뜻이에요. [[Can you tell me how to + 동사원형?]]도 방법이나 절차를 묻는 같은 기능의 표현입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제는 같은 의미의 표현을 고르는 문제예요. Do you know how to use this snack machine? 다시 한번 들어 보세요. Do you know how to use this snack machine? 이 문장과 같은 뜻으로 쓸 수 있는 보기를 골라 보세요. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 첫 번째 보기예요. Can you tell me how to use this snack machine? 은 이 간식 자판기 어떻게 쓰는지 알려 줄래요? 라는 뜻이거든요. 나머지 보기들은 위치나 가격, 만든 사람을 묻는 표현이라 뜻이 달라요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">First, choose the snack ____ you want.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that (또는 which)\u003c/span>\u003cdiv class=\"g-exp\">선행사 the snack을 수식하는 절 앞에는 [[목적격 관계대명사]] [[that/which]]가 오며, 회화에서는 이 관계대명사를 생략할 수 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제는 빈칸 채우기예요. First, choose the snack 빈칸 you want. 여기서 빈칸에 들어갈 말은 무엇일까요? 잠시 멈추고 생각해 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 that 또는 which 예요. the snack을 꾸며 주는 절 앞에는 목적격 관계대명사 that이나 which가 오고, 회화에서는 이 관계대명사를 생략하는 경우가 많아요. 그래서 그냥 the snack you want라고 말해도 자연스럽답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화가 자연스럽게 이어지도록 (A)~(D)를 순서대로 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) Yeah. First, choose the snack you want. (B) Just put in the money. Then take the snack out. (C) I want to buy a snack. Do you know how to use this snack machine? (D) I already did. What's next?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>(C)-(A)-(D)-(B)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>(C)-(D)-(A)-(B)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>(A)-(C)-(B)-(D)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>(C)-(A)-(B)-(D)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(C)-(A)-(D)-(B)\u003c/span>\u003cdiv class=\"g-exp\">먼저 남학생이 사용법을 묻고 (C), 여학생이 먼저 간식을 고르라고 답한 뒤 (A), 남학생이 이미 골랐다며 다음을 묻고 (D), 여학생이 돈을 넣고 꺼내라고 마무리합니다 (B).\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제는 대화 순서 배열이에요. 남학생이 간식을 사고 싶다며 자판기 사용법을 묻는 문장, 여학생이 먼저 원하는 간식을 고르라고 답하는 문장, 남학생이 이미 골랐다며 다음 할 일을 묻는 문장, 여학생이 돈을 넣고 간식을 꺼내라고 알려 주는 문장이 있어요. 어떤 순서가 자연스러울지 잠시 생각해 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 첫 번째 보기예요. 사용법을 묻는 문장이 먼저 나오고, 그다음에 먼저 간식을 고르라는 대답이 와요. 이어서 이미 골랐다며 다음을 묻고, 마지막으로 돈을 넣고 꺼내라는 말로 끝나죠. 그래서 사용법을 묻는 문장, 간식을 고르라는 문장, 다음을 묻는 문장, 돈을 넣으라는 문장 순서가 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하지 않는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>남학생은 간식을 사고 싶어 한다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>여학생은 먼저 원하는 간식을 고르라고 말한다.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>남학생은 아직 간식을 고르지 못했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>여학생은 돈을 넣은 뒤 간식을 꺼내라고 말한다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">남학생은 아직 간식을 고르지 못했다.\u003c/span>\u003cdiv class=\"g-exp\">남학생이 I already did.라고 말했으므로 이미 간식을 골랐어요. 따라서 세 번째 보기는 대화의 내용과 일치하지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 내용 일치 문제예요. 대화의 내용과 일치하지 않는 보기를 골라 보세요. 남학생이 간식을 골랐는지, 여학생이 어떤 순서로 알려 줬는지 잘 생각해 보시고 잠시 멈춰 주세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 세 번째 보기예요. 남학생은 I already did. 라고 말했죠. 이미 간식을 골랐다는 뜻이에요. 그러니까 아직 고르지 못했다는 말은 대화의 내용과 맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 부분과 바꿔 쓸 수 없는 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">B: Got it. Thanks.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I see.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I understand.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Okay, I got it.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>I have no idea.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I have no idea.\u003c/span>\u003cdiv class=\"g-exp\">[[Got it.]]은 '알았어, 이해했어'라는 뜻이에요. I see나 I understand로 바꿔 쓸 수 있지만, I have no idea는 '전혀 모르겠어'라는 뜻이라 반대입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제는 대체 표현 문제예요. 남학생이 Got it. Thanks. 라고 말했죠. 여기서 Got it과 바꿔 쓸 수 없는 보기를 골라 보세요. 잠시 멈추고 풀어 볼까요?","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 네 번째 보기예요. Got it은 알았어, 이해했어라는 뜻이라서 I see나 I understand로 바꿔 쓸 수 있어요. 하지만 I have no idea는 전혀 모르겠다는 뜻이라서 반대말이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">방법·절차 묻고 답하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>방법이나 절차를 물을 때는 \u003cb class=\"key\">Do you know how to + 동사원형?\u003c/b> 또는 \u003cb class=\"key\">Can you tell me how to + 동사원형?\u003c/b>을 써요.\u003c/li>\u003cli>순서를 알려 줄 때는 \u003cb class=\"key\">first\u003c/b>, \u003cb class=\"key\">then\u003c/b> 같은 연결어를 사용해요.\u003c/li>\u003cli>선행사 뒤에서 \u003cb class=\"key\">목적격 관계대명사\u003c/b> that/which는 생략할 수 있어요.\u003c/li>\u003cli>\u003cb class=\"key\">Got it.\u003c/b>은 '알았어, 이해했어'라는 뜻이에요.\u003c/li>\u003c/ul>","segs":[{"n":33,"text":"오늘은 방법과 절차를 묻고 답하는 표현을 배웠어요. 방법을 물을 때는 Do you know how to 다음에 동사원형을 붙여서 말하면 되고, Can you tell me how to 라고 해도 같은 뜻이에요. 순서를 알려 줄 때는 first, then 같은 연결어를 사용한다는 것도 잊지 마세요. 오늘 배운 표현들 꼭 소리 내어 연습해 보고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
