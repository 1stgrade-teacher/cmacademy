    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

c/div>\u003cdiv class=\"d-exp\">\u003cb class=\"key\">I really appreciate\u003c/b> ~.는 진심으로 감사의 마음을 전하는 표현으로 '나는 ~에 정말로 감사드린다.'라는 뜻이에요. \u003cb class=\"key\">격식을 차려야 하는 공식적인 상황\u003c/b>에서 정중하게 감사 인사를 할 때 알맞고, 가볍게 말할 때는 \u003cb class=\"key\">Thanks.\u003c/b>를 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Thank you so much for + 명사(구).\u003c/li>\u003cli>I'm really grateful for + 명사(구).\u003c/li>\u003cli>Thanks a lot for + 명사(구).\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>You're welcome.\u003c/li>\u003cli>No problem.\u003c/li>\u003cli>My pleasure.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"마지막으로 감사 표현이에요. I really appreciate your help. 는 도와주셔서 정말 감사드려요. 라는 뜻이에요. 격식을 차려야 하는 상황에서 진심으로 감사하다는 마음을 전할 때 아주 좋은 표현이죠.","hl":"key"},{"n":14,"text":"Thank you so much for your help. 라고 해도 되고요. I'm really grateful for your help. 도 같은 뜻이에요. Thanks a lot for your help. 는 조금 더 가볍게 쓸 수 있는 감사 표현이에요.","hl":"alts"},{"n":15,"text":"이런 감사 인사에는 You're welcome. 이라고 답해요. No problem. 이라고 해도 되고 My pleasure. 라고 답하면 아주 멋진 응답이 된답니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Excuse me. \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I want to rent a bike\u003c/span>. \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Can you tell me how to\u003c/span>① use this application?\u003c/div>\u003cdiv class=\"d-ko\">실례합니다. 저는 자전거를 빌리고 싶어요. 이 애플리케이션을 어떻게 사용하는지 알려 주시겠어요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">want to + 동사원형\u003c/b>은 '~하고 싶다'라는 뜻으로, 동사 want의 목적어로 \u003cb class=\"key\">to부정사\u003c/b>를 쓴 형태예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>Can you tell me + \u003cb class=\"key\">how to부정어\u003c/b>는 '~하는 방법을 알려 줄 수 있나요?'라고 정중하게 묻는 \u003cb class=\"key\">간접의문문\u003c/b> 표현이에요. how to 뒤에는 동사원형 use가 와요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Could you tell me how to use this application?\u003c/span>\u003cspan>Can you show me how to use this application?\u003c/span>\u003cspan>Do you know how to use this application?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">M\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">First, log in to the application.\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">Then find the RENT button and touch it.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">물론이죠. 먼저 애플리케이션에 로그인하세요. 그다음 RENT 버튼을 찾아서 누르세요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">log in to\u003c/b>는 '~에 로그인하다'라는 뜻의 구동사예요. 전치사 to 뒤에는 로그인하는 대상인 the application이 와요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">Then\u003c/b>은 순서를 이어 줄 때 '그다음에'라는 뜻으로 쓰는 부사예요. find와 touch는 주어 없이 동사원형으로 시작하는 \u003cb class=\"key\">명령문\u003c/b>이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>First, sign in to the application. Then find the RENT button and tap it.\u003c/span>\u003cspan>First of all, log in to the application. After that, find the RENT button and press it.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"첫 번째 줄이에요. Excuse me. I want to rent a bike. Can you tell me how to use this application? 라고 여학생이 말해요. 뜻은 실례합니다. 저는 자전거를 빌리고 싶어요. 이 애플리케이션을 어떻게 사용하는지 알려 주시겠어요? 예요. Can you tell me how to 에 동사원형을 붙이면 방법을 묻는 공손한 표현이 되고요, want to rent처럼 want to 뒤에는 동사원형이 와요. 같은 뜻으로는 Could you tell me how to use this application? 이라고 해도 됩니다.","hl":"l-0"},{"n":17,"text":"두 번째 줄이에요. Sure. First, log in to the application. Then find the RENT button and touch it. 라고 남학생이 설명해요. 뜻은 물론이죠. 먼저 애플리케이션에 로그인하세요. 그다음 렌트 버튼을 찾아서 누르세요. 예요. log in to는 로그인하다라는 뜻이고, find와 touch는 주어 없이 동사원형으로 시작하는 명령문이에요. First, sign in to the application. Then find the RENT button and tap it. 처럼 바꿔 말할 수도 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Then what?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그다음에는요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">Then what?\u003c/b>은 상대의 설명이 끝난 뒤 '그다음엔 어떻게 하죠?'라고 다음 \u003cb class=\"key\">절차\u003c/b>를 재촉하며 되묻는 짧은 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">M\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Then the application will \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">give⑤ you a number\u003c/span> \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">to unlock\u003c/span>⑥ a bike with.\u003c/div>\u003cdiv class=\"d-ko\">그러면 애플리케이션이 자전거의 잠금을 해제할 수 있는 번호를 당신에게 줄 거예요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">give + 간접목적어(you) + 직접목적어(a number)\u003c/b>는 '~에게 …을 주다'라는 뜻의 \u003cb class=\"key\">4형식\u003c/b> 문장이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">to부정사의 형용사적 용법\u003c/b>: to unlock a bike with는 앞의 명사 a number를 수식하여 '자전거의 잠금을 해제할 수 있는 번호'라는 의미를 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Then you will get a number from the application to unlock a bike with.\u003c/span>\u003cspan>Then the application will give a number to you to unlock a bike with.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"세 번째 줄이에요. Then what? 이라고 여학생이 되물어요. 뜻은 그다음에는요? 예요. 설명을 듣고 다음 단계가 궁금할 때 짧게 던지는 말이에요.","hl":"l-0"},{"n":19,"text":"네 번째 줄이에요. Then the application will give you a number to unlock a bike with. 라고 남학생이 말해요. 뜻은 그러면 애플리케이션이 자전거의 잠금을 해제할 수 있는 번호를 당신에게 줄 거예요. 예요. give you a number는 간접목적어 you와 직접목적어 a number를 가진 문장이고, to unlock은 앞의 명사 a number를 꾸며 주는 형용사 역할을 해요. Then you will get a number from the application to unlock a bike with. 라고 바꿔 말할 수도 있습니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Thank you. \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">I really appreciate\u003c/span>⑦ your help.\u003c/div>\u003cdiv class=\"d-ko\">감사합니다. 도와주셔서 정말 감사드려요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">감사 표현하기\u003c/b>: I really appreciate ~.는 진심으로 감사의 마음을 전하고 싶을 때 쓰는 표현으로 '나는 ~에 정말로 감사드린다.'라는 뜻이에요. 특히 \u003cb class=\"key\">격식을 차려야 하는 공식적인 상황\u003c/b>에서 정중하게 감사 인사를 하고 싶을 때 쓸 수 있고, Thanks.는 이보다 좀 더 가볍게 쓸 수 있는 감사 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Thank you so much for your help.\u003c/span>\u003cspan>I'm really grateful for your help.\u003c/span>\u003cspan>Thanks a lot for your help.\u003c/span>\u003c/div>\u003c/div> 이션을 어떻게 사용하는지 보여 줄 수 있나요? 라는 뜻으로, 방법을 묻는 표현이에요. tell me how to와 show me how to는 같은 뜻으로 쓸 수 있어요. 나머지 보기들은 누가 쓰는지, 언제 쓰는지, 무엇인지를 묻는 문장이라 뜻이 달라요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Then the application will give you a number ____ a bike with.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>to unlock\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>unlock\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>unlocking\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>unlocked\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to unlock\u003c/span>\u003cdiv class=\"g-exp\">앞에 있는 명사 a number를 꾸며 주어야 하므로 [[to부정사의 형용사적 용법]]을 써야 해요. '자전거의 잠금을 해제할 수 있는 번호'라는 뜻이 되니 [[to unlock]]이 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"두 번째 문제는 빈칸 채우기예요. Then the application will give you a number ... a bike with. 빈칸에 들어갈 말로 알맞은 것을 골라 보세요. 보기는 to unlock, unlock, unlocking, unlocked 예요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 첫 번째 보기 to unlock 이에요. 앞에 있는 명사 a number를 꾸며 주어야 하니까 to부정사의 형용사적 용법을 써야 해요. 자전거의 잠금을 해제할 수 있는 번호, 라는 뜻이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화가 자연스럽게 이어지도록 주어진 문장을 바르게 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) Then what? (B) Sure. First, log in to the application. Then find the RENT button and touch it. (C) Excuse me. I want to rent a bike. Can you tell me how to use this application? (D) Then the application will give you a number to unlock a bike with. (E) Thank you. I really appreciate your help.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>C - B - A - D - E\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>C - A - B - D - E\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>B - C - A - D - E\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>C - B - D - A - E\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">C - B - A - D - E\u003c/span>\u003cdiv class=\"g-exp\">방법을 묻는 (C) 다음에 순서를 설명하는 (B)가 와요. Then what?으로 되묻는 (A) 뒤에 번호 설명 (D)가 이어지고, 마지막은 감사 인사 (E)예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"세 번째 문제는 대화 순서 배열이에요. 다섯 개의 문장을 읽고 자연스럽게 이어지는 순서를 골라 보세요. 방법을 묻는 말, 순서를 설명하는 말, 되묻는 말, 번호에 대한 설명, 감사 인사가 어떤 차례로 이어져야 하는지 생각하면 돼요. 보기에는 서로 다른 순서가 나와 있으니 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 첫 번째 보기예요. 먼저 방법을 묻는 씨 문장이 나오고, 그다음 순서를 설명하는 비 문장이 와요. 이어서 Then what? 으로 되묻는 에이 문장 다음에 번호를 설명하는 디 문장이 오고, 마지막은 감사 인사인 이 문장이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하지 않는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The girl wants to rent a bike.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The girl asks how to use the application.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The boy tells her to touch the RENT button.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb> preciate your help.]]는 '도와주셔서 정말 감사드려요.'라는 격식 있는 [[감사 표현]]이에요. sorry는 사과할 때 쓰는 말이라 감사 표현과 바꿔 쓸 수 없어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"다섯 번째 문제는 대체 표현 고르기예요. Thank you. I really appreciate your help. 와 바꿔 쓸 수 없는 것을 골라 보세요. 첫 번째는 Thanks a lot for your help. 두 번째는 I'm really grateful for your help. 세 번째는 Thank you so much for your help. 네 번째는 I'm really sorry for your help. 예요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 네 번째 보기예요. I'm really sorry for your help. 의 sorry는 사과할 때 쓰는 말이라 감사 표현이 될 수 없어요. Thanks a lot for your help. 와 I'm really grateful for your help. 그리고 Thank you so much for your help. 는 모두 I really appreciate your help. 와 같은 뜻으로 바꿔 쓸 수 있답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">방법 묻고 절차 설명하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>방법을 물을 때는 \u003cb class=\"key\">Can you tell me how to + 동사원형\u003c/b>을 써요.\u003c/li>\u003cli>순서를 설명할 때는 \u003cb class=\"key\">First\u003c/b>와 \u003cb class=\"key\">Then\u003c/b>으로 단계를 이어 줘요.\u003c/li>\u003cli>give는 \u003cb class=\"key\">give + 간접목적어 + 직접목적어\u003c/b> 형태로 '~에게 …을 주다'라는 뜻이에요.\u003c/li>\u003cli>명사 뒤의 \u003cb class=\"key\">to부정사\u003c/b>는 형용사처럼 명사를 꾸며 줄 수 있어요.\u003c/li>\u003cli>격식 있는 감사 인사로는 \u003cb class=\"key\">I really appreciate your help.\u003c/b>를 기억해요.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 자전거를 빌리는 상황에서 쓰는 표현들을 배웠어요. 방법을 물을 때는 Can you tell me how to use this application? 처럼 말하고, 순서를 설명할 때는 First와 Then으로 차례대로 알려 주면 됩니다. 명사 뒤에 오는 to부정사는 명사를 꾸며 준다는 것도 꼭 기억해 두세요. 마지막으로 I really appreciate your help. 는 격식 있게 감사할 때 쓰는 표현이에요. 오늘 배운 표현들을 꼭 소리 내어 연습해 보고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
