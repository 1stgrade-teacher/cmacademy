</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"7과 문법1","title":"as 하나로 끝내기: 시간·비례·이유·양태","audioDir":"중3_비상_문법1_종속접속사_as_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">종속접속사 as (시간·비례·이유·양태)\u003c/div>\u003ch1>as 하나로 끝내기: 시간·비례·이유·양태\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>접속사 as의 여러 의미를 예문으로 구별하고, 비례의 as 구문을 직접 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 종속접속사 as의 여러 가지 뜻을 예문과 함께 정리해 볼 거예요. as는 뜻이 정말 많아서 해석할 때 문맥을 잘 봐야 하는 접속사죠. 오늘 강의를 끝까지 들으면 as가 나올 때 어떤 뜻인지 스스로 판단할 수 있게 될 거예요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">종속접속사 as가 가진 여러 얼굴\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">종속접속사는 명사절, 형용사절, \u003cb class=\"key\">부사절\u003c/b>을 이끌어 문장의 의미를 더 명확하고 풍부하게 합니다. 그중 as는 절을 이끌면서 \u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">비례\u003c/b>, 이유, 양태의 뜻을 나타내는 접속사입니다. as는 접속사 외에도 전치사, 부사 등 다양한 품사로 쓰이므로 주의해야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">as + 주어 + 동사 = 시간·비례·이유·양태의 부사절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As I entered the room\u003c/span>, I turned the light on.\u003c/div>\u003cdiv class=\"g-ko\">내가 방에 들어가면서, 나는 불을 켰다.\u003c/div>\u003cdiv class=\"g-note\">as가 시간(~하면서)의 의미로 쓰인 예문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I asked Jane to come with me, \u003cspan class=\"fx\">as she knew the road\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 제인에게 나와 함께 가자고 부탁했다, 그녀가 그 길을 알고 있었기 때문에.\u003c/div>\u003cdiv class=\"g-note\">as가 이유(~해서, ~이므로)의 의미로 쓰인 예문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>같은 as라도 \u003cb class=\"key\">문맥\u003c/b>에 따라 뜻이 달라지므로, 앞뒤 내용을 보고 \u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">비례\u003c/b>, 이유, 양태 중 무엇인지 판단해야 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 종속접속사가 무엇인지 짚고 갈게요. 종속접속사는 명사절이나 형용사절, 부사절을 이끌어서 문장의 의미를 더 명확하고 풍부하게 만들어 주는 역할을 해요. 그중 as는 절을 이끌면서 시간, 비례, 이유, 양태라는 여러 가지 뜻을 나타내는 아주 재미있는 접속사랍니다. 그리고 as는 접속사 말고도 전치사나 부사로도 쓰이니까 품사를 꼭 확인해야 해요.","hl":"rule"},{"n":3,"text":"As I entered the room, I turned the light on. 이 문장은 내가 방에 들어가면서 불을 켰다는 뜻이에요. 여기서 as는 내가 방에 들어갔을 때라는 시간의 의미로 쓰였죠. as 뒤에 주어와 동사가 함께 온다는 점도 눈여겨보세요.","hl":"ex-0"},{"n":4,"text":"I asked Jane to come with me, as she knew the road. 이번에는 내가 제인에게 같이 가자고 부탁했어요, 왜냐하면 그녀가 길을 알고 있었기 때문이죠. 이렇게 as는 이유를 나타낼 때도 자주 쓰여요.","hl":"ex-1"},{"n":5,"text":"중요한 포인트가 하나 있어요. as는 같은 단어인데도 문맥에 따라 뜻이 완전히 달라져요. 그러니까 무조건 하나로 외우지 말고, 앞뒤 내용을 보고 시간인지 비례인지 이유인지 양태인지 판단하는 습관을 길러야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">비례의 as: ~함에 따라, ~할수록\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as는 '\u003cb class=\"key\">~함에 따라\u003c/b>, \u003cb class=\"key\">~할수록\u003c/b>'이라는 비례의 의미로 쓰이며, 하나가 변하면 다른 하나도 함께 변한다는 뜻을 담습니다. 이때는 「\u003cb class=\"key\">As+주어+동사\u003c/b> ~, 주어+동사」의 형태로 씁니다. 뒤 문장에는 비교급이 오는 경우가 많아 '점점 더'라는 느낌을 살려 줍니다.\u003cdiv>\u003cspan class=\"g-formula\">As + 주어 + 동사 ~, 주어 + 동사 (비교급) …\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As she grew older\u003c/span>, she became wiser.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나이가 들어감에 따라 더 지혜로워졌다.\u003c/div>\u003cdiv class=\"g-note\">as절 뒤에 주어+동사, 뒷문장에 비교급 wiser가 온 비례 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As I took more tests\u003c/span>, I could get better results.\u003c/div>\u003cdiv class=\"g-ko\">나는 시험을 더 많이 볼수록 더 좋은 결과를 얻을 수 있었다.\u003c/div>\u003cdiv class=\"g-note\">more tests와 better results처럼 비교급이 짝을 이루는 비례 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As the sun rises\u003c/span>, it gets brighter.\u003c/div>\u003cdiv class=\"g-ko\">해가 뜰수록 더 밝아진다.\u003c/div>\u003cdiv class=\"g-note\">해가 뜨는 변화에 따라 밝아진다는 비례의 기본 형태입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As time goes by\u003c/span>, the work becomes more difficult.\u003c/div>\u003cdiv class=\"g-ko\">시간이 흐를수록 일은 더 어려워진다.\u003c/div>\u003cdiv class=\"g-note\">주어 time이 단수이므로 동사가 goes로 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비례의 as는 뒷문장에 \u003cb class=\"key\">비교급\u003c/b>이 오는 경우가 많고, as절과 뒷절의 \u003cb class=\"key\">시제\u003c/b>가 자연스럽게 이어지는지도 확인해야 합니다.\u003c/div>","segs":[{"n":6,"text":"이제 as의 가장 중요한 쓰임인 비례를 볼게요. 비례는 한쪽이 변하면 다른 쪽도 같이 변한다는 뜻이고, 우리말로는 함에 따라, 또는 할수록이라고 해요. 형태는 as 뒤에 주어와 동사가 오고, 쉼표 다음에 또 주어와 동사가 이어지는 모양이에요. 그리고 뒤쪽에는 보통 비교급이 와서 점점 더 그렇게 된다는 느낌을 만들어 줍니다.","hl":"rule"},{"n":7,"text":"As she grew older, she became wiser. 그녀가 나이가 들어감에 따라 더 지혜로워졌다는 뜻이에요. as절에 주어와 동사가 오고, 뒤에서는 wiser라는 비교급이 와서 점점 더 그렇게 된다는 느낌을 줍니다.","hl":"ex-0"},{"n":8,"text":"As I took more tests, I could get better results. 나는 시험을 더 많이 볼수록 더 좋은 결과를 얻을 수 있었다는 뜻이에요. 앞에는 more tests, 뒤에는 better results라는 비교급이 나란히 쓰였죠. 이렇게 비교급이 함께 나오면 비례의 as라고 생각하면 됩니다.","hl":"ex-1"},{"n":9,"text":"As the sun rises, it gets brighter. 해가 뜰수록 더 밝아진다는 뜻이에요. as 뒤에 the sun rises라는 주어와 동사가 오고, 뒤에는 brighter라는 비교급이 왔죠. 아주 전형적인 비례의 형태입니다.","hl":"ex-2"},{"n":10,"text":"As time goes by, the work becomes more difficult. 시간이 흐를수록 일이 더 어려워진다는 뜻이에요. 여기서 주어인 time이 단수라서 동사가 goes로 쓰인 점을 꼭 기억하세요. 뒤에는 more difficult라는 비교급이 왔습니다.","hl":"ex-3"},{"n":11,"text":"한 가지만 기억하세요. 비례의 as 뒤에는 꼭 주어와 동사가 오고, 뒷문장에는 비교급이 오는 경우가 많아요. 그리고 두 절의 시제가 자연스럽게 이어지는지도 꼭 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">그 외 용법: 시간, 이유, 양태, 방식\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as는 '\u003cb class=\"key\">~할 때\u003c/b>, ~하면서'의 시간, '~해서, ~이므로'의 이유, '\u003cb class=\"key\">~대로\u003c/b>'의 양태, '~하는 것처럼'의 방식으로도 쓰입니다. 따라서 해석할 때는 \u003cb class=\"key\">문맥\u003c/b>에 맞는 정확한 의미를 파악하는 것이 중요합니다.\u003cdiv>\u003cspan class=\"g-formula\">as + 주어 + 동사 = ~할 때 / ~이므로 / ~대로 / ~하는 것처럼\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Leave the documents \u003cspan class=\"fx\">as they are\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">서류들을 있는 그대로 두어라.\u003c/div>\u003cdiv class=\"g-note\">as가 양태(~대로)의 의미로 쓰인 예문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As the result shows\u003c/span>, the policy is not effective.\u003c/div>\u003cdiv class=\"g-ko\">결과가 보여 주는 것처럼, 그 정책은 효과가 없다.\u003c/div>\u003cdiv class=\"g-note\">as가 방식(~하는 것처럼)의 의미로 쓰인 예문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Do \u003cspan class=\"fx\">as I say\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내가 말하는 대로 해라.\u003c/div>\u003cdiv class=\"g-note\">양태(~대로)의 as가 짧은 문장에서 쓰인 보충 예문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>해석이 애매할 때는 as를 '~하면서', '~이므로', '~대로'로 각각 넣어 보고 \u003cb class=\"key\">문맥\u003c/b>에 자연스러운 것을 고르세요.\u003c/div>","segs":[{"n":12,"text":"as는 비례 말고도 여러 얼굴을 가지고 있어요. 할 때라든지 하면서라는 시간, 해서라든지 이므로라는 이유, 대로라는 양태, 하는 것처럼이라는 방식으로도 쓰입니다. 그래서 as를 해석할 때는 무조건 하나로 정해 놓지 말고, 문장의 맥락에 맞는 정확한 의미를 찾아야 해요.","hl":"rule"},{"n":13,"text":"Leave the documents as they are. 서류들을 있는 그대로 두어라라는 뜻이에요. 여기서 as는 있는 그대로, 즉 대로라는 양태의 의미로 쓰였습니다.","hl":"ex-0"},{"n":14,"text":"As the result shows, the policy is not effective. 결과가 보여 주는 것처럼 그 정책은 효과가 없다는 뜻이에요. 이때 as는 하는 것처럼이라는 방식의 의미로 쓰였죠. 문맥을 보면 뜻이 자연스럽게 잡힙니다.","hl":"ex-1"},{"n":15,"text":"Do as I say. 내가 말하는 대로 해라라는 뜻이에요. 짧은 문장이지만 as 뒤에 I say라는 주어와 동사가 와서 대로라는 양태의 의미를 만들고 있죠. 이런 짧은 표현도 자주 나오니까 익숙해지면 좋아요.","hl":"ex-2"},{"n":16,"text":"해석이 애매할 때는 as 자리에 하면서, 이므로, 대로를 하나씩 넣어 보세요. 그중에서 문맥에 가장 자연스러운 것이 정답이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 as와 접속사 as 구별하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 as는 '\u003cb class=\"key\">~같이\u003c/b>'라는 의미나 '\u003cb class=\"key\">~로서\u003c/b>'라는 자격의 의미를 나타내며, 뒤에 \u003cb class=\"key\">명사(구)\u003c/b>가 옵니다. 반면 접속사 as 뒤에는 「주어+동사」가 와서 절을 이끕니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 as + 명사(구) / 접속사 as + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I'd like to give you advice \u003cspan class=\"fx\">as your friend\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 너의 친구로서 너에게 조언을 해 주고 싶다.\u003c/div>\u003cdiv class=\"g-note\">as 뒤에 명사구 your friend가 온 전치사 as입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As it was getting darker\u003c/span>, we soon went back.\u003c/div>\u003cdiv class=\"g-ko\">날이 점점 어두워지고 있었기 때문에, 우리는 곧 돌아갔다.\u003c/div>\u003cdiv class=\"g-note\">as 뒤에 주어+동사가 온 접속사 as입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as 뒤에 \u003cb class=\"key\">주어+동사\u003c/b>가 있으면 접속사, \u003cb class=\"key\">명사\u003c/b>만 있으면 전치사로 판단하세요.\u003c/div>","segs":[{"n":17,"text":"마지막으로 as의 품사를 구별하는 방법을 볼게요. as가 전치사로 쓰이면 같이라는 의미나 로서라는 자격의 의미를 나타내고, 뒤에는 명사나 명사구가 옵니다. 그런데 접속사 as 뒤에는 주어와 동사가 함께 와서 절을 이끌어요. 그래서 as 뒤를 보고 품사를 판단하면 됩니다.","hl":"rule"},{"n":18,"text":"I'd like to give you advice as your friend. 나는 너의 친구로서 너에게 조언을 해 주고 싶다는 뜻이에요. as 뒤에 your friend라는 명사구가 왔으니 전치사 as이고, 로서라는 자격의 의미를 나타냅니다.","hl":"ex-0"},{"n":19,"text":"As it was getting darker, we soon went back. 날이 점점 어두워지고 있었기 때문에 우리는 곧 돌아갔다는 뜻이에요. as 뒤에 it was getting darker처럼 주어와 동사가 함께 왔으니 접속사 as입니다.","hl":"ex-1"},{"n":20,"text":"정리하면 아주 간단해요. as 뒤에 주어와 동사가 보이면 접속사, 명사만 보이면 전치사예요. 이 기준 하나면 헷갈리지 않습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>As time go by, the work becomes more difficult.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ As time goes by, the work becomes more difficult.\u003c/div>\u003cdiv class=\"g-why\">as절의 주어 time이 단수이므로 동사에 -s를 붙여 goes로 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>As it getting darker, we soon went back.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ As it was getting darker, we soon went back.\u003c/div>\u003cdiv class=\"g-why\">접속사 as 뒤에는 주어와 동사가 모두 있어야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>As she grew older, she became wise.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ As she grew older, she became wiser.\u003c/div>\u003cdiv class=\"g-why\">비례의 as는 '점점 더'라는 의미이므로 뒷문장에 비교급이 와야 자연스럽습니다.\u003c/div>\u003c/div>","segs":[{"n":21,"text":"As time go by, the work becomes more difficult. 이 문장에서 주어는 time인데 동사가 go라서 어색하죠. time은 단수이기 때문에 동사에 s를 붙여 As time goes by라고 해야 합니다.","hl":"mk-0"},{"n":22,"text":"As it getting darker, we soon went back. as는 접속사이기 때문에 뒤에 주어와 동사가 다 있어야 해요. 그래서 be동사를 넣어 As it was getting darker라고 고쳐야 합니다.","hl":"mk-1"},{"n":23,"text":"As she grew older, she became wise. 비례의 as는 점점 더 변한다는 뜻이라서 뒤 문장에 비교급이 오는 것이 자연스러워요. 그래서 wise를 wiser로 고쳐야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 as의 의미로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">As she grew older, she became wiser.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>~할 때\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>~함에 따라\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>~때문에\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>~대로\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">~함에 따라\u003c/span>\u003cdiv class=\"g-exp\">나이가 들어감에 따라 더 지혜로워졌다는 비례의 의미입니다. 뒤에 비교급 wiser가 온 것도 비례의 표시입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"첫 번째 문제는 해석 문제예요. As she grew older, she became wiser. 이 문장에서 as의 의미로 알맞은 보기를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 두 번째 보기인 함에 따라예요. 그녀가 나이가 들어감에 따라 더 지혜로워졌다는 뜻이니까 비례의 as죠. 뒤에 wiser라는 비교급이 온 것도 비례의 표시랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">As time ____ by, the work becomes more difficult.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">goes\u003c/span>\u003cdiv class=\"g-exp\">주어 time이 단수이므로 동사 go에 -s를 붙여 goes를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"이번에는 빈칸 문제예요. As time blank by, the work becomes more difficult. 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 goes예요. 주어인 time이 단수라서 동사 go에 s를 붙여 goes by라고 해야 합니다. 시간이 흐를수록 일이 더 어려워진다는 비례의 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 as의 쓰임으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I asked Jane to come with me, as she knew the road.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>시간 (~하면서)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>비례 (~할수록)\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>이유 (~이므로)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>양태 (~대로)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>방식 (~하는 것처럼)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">이유 (~이므로)\u003c/span>\u003cdiv class=\"g-exp\">제인이 길을 알고 있었기 때문에 함께 가자고 부탁했다는 뜻이므로 이유의 as입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"세 번째 문제는 as의 쓰임을 고르는 문제예요. I asked Jane to come with me, as she knew the road. 여기서 as는 어떤 의미로 쓰였을까요? 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 세 번째 보기인 이유예요. 그녀가 길을 알고 있었기 때문에 같이 가자고 부탁했다는 뜻이니까요. 뒤 문장이 앞 문장의 이유가 되는 구조를 잘 보세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">As the sun rises, it get brighter.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">it gets brighter\u003c/span>\u003cdiv class=\"g-exp\">주어 it이 삼인칭 단수이므로 동사에 -s를 붙여 gets로 써야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"네 번째 문제는 틀린 부분을 고치는 문제예요. As the sun rises, it get brighter. 어디가 잘못됐을까요? 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 it gets brighter예요. 주어 it이 삼인칭 단수라서 동사에 s를 붙여야 하죠. 해가 뜰수록 더 밝아진다는 비례의 의미도 함께 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cd 003cli>비례의 as는 '\u003cb class=\"key\">~함에 따라\u003c/b>, ~할수록'의 뜻으로 「As+주어+동사 ~, 주어+동사」 형태로 씁니다.\u003c/li>\u003cli>전치사 as 뒤에는 \u003cb class=\"key\">명사(구)\u003c/b>, 접속사 as 뒤에는 \u003cb class=\"key\">주어+동사\u003c/b>가 옵니다.\u003c/li>\u003cli>as는 뜻이 여러 가지이므로 \u003cb class=\"key\">문맥\u003c/b>에 맞는 의미를 파악하는 것이 중요합니다.\u003c/li>\u003c/ul>","segs":[{"n":42,"text":"오늘은 종속접속사 as를 자세히 살펴봤어요. as는 시간, 비례, 이유, 양태 등 여러 가지 뜻을 가지고 있고, 특히 함에 따라라는 비례의 뜻으로 많이 나온다는 것을 기억하세요. 그리고 전치사 as 뒤에는 명사가, 접속사 as 뒤에는 주어와 동사가 온다는 차이도 꼭 챙겨 두시고요. 오늘 배운 예문들을 소리 내어 여러 번 읽으면서 익혀 보세요. 수고했어요, 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
