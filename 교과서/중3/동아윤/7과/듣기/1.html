\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Yes. Then, the robot will find the book and take it to the front desk.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">So I can just go to the front desk and get the book?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-9\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Right. It's so easy, ⑥isn't it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-10\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yes, it's really amazing. Thank you.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Excuse me, but what's this robot for?","hl":"r-0"},{"n":3,"text":"Oh, it's a robot that finds books for you.","hl":"r-1"},{"n":4,"text":"Really? Can you tell me how to use it?","hl":"r-2"},{"n":5,"text":"Sure. First, place your library card on the robot's screen.","hl":"r-3"},{"n":6,"text":"OK.","hl":"r-4"},{"n":7,"text":"Second, type네 번째 the title of the book you're looking for and then press ENTER.","hl":"r-5"},{"n":8,"text":"Is that all?","hl":"r-6"},{"n":9,"text":"Yes. Then, the robot will find the book and take it to the front desk.","hl":"r-7"},{"n":10,"text":"So I can just go to the front desk and get the book?","hl":"r-8"},{"n":11,"text":"Right. It's so easy, isn't it?","hl":"r-9"},{"n":12,"text":"Yes, it's really amazing. Thank you.","hl":"r-10"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">용도 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What's + 대상 + for?\u003c/div>\u003cdiv class=\"d-mean\">이 ~은 용도가 뭔가요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Excuse me, but what's this robot for?①\u003c/div>\u003cdiv class=\"d-exp\">상대방이 가리키는 물건의 \u003cb class=\"key\">용도\u003c/b>를 물을 때 쓰는 표현이에요. \u003cb class=\"key\">What's + 대상 + for?\u003c/b>는 그 물건이 무엇을 하는 데 쓰이는지 묻는 말이에요. 대답은 \u003cb class=\"key\">It's for + 동명사\u003c/b>나 It's used to + 동사원형으로 할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What is + 대상 + used for?\u003c/li>\u003cli>What do you use + 대상 + for?\u003c/li>\u003cli>What's the purpose of + 대상?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>It's for + 동사-ing.\u003c/li>\u003cli>It's used to + 동사원형.\u003c/li>\u003cli>You use it to + 동사원형.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"먼저 용도를 묻는 표현을 배워 볼게요. What's this robot for?는 이 로봇은 용도가 무엇인가요라는 뜻이에요. What's 다음에 궁금한 물건을 넣고 for를 붙이면 그 물건의 쓰임을 묻는 문장이 돼요.","hl":"key"},{"n":14,"text":"같은 뜻으로 What is this robot used for?라고 할 수 있어요. What do you use this robot for?도 자연스럽고, What's the purpose of this robot?처럼 목적을 묻는 표현도 가능해요.","hl":"alts"},{"n":15,"text":"대답할 때는 It's for finding books라고 해요. It's used to find books나 You use it to find books처럼 말할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">방법·절차 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you tell me how to + 동사원형?\u003c/div>\u003cdiv class=\"d-mean\">~하는 법을 알려줄 수 있나요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Really? Can you tell me how to③ use it?\u003c/div>\u003cdiv class=\"d-exp\">물건의 사용법이나 \u003cb class=\"key\">방법·절차\u003c/b>를 정중하게 물을 때 쓰는 표현이에요. \u003cb class=\"key\">how to + 동사원형\u003c/b>은 ‘~하는 방법’이라는 뜻이에요. 대답할 때는 \u003cb class=\"key\">순서\u003c/b>를 나타내는 First, Second 등을 활용해 차례대로 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you tell me how to + 동사원형?\u003c/li>\u003cli>Can you show me how to + 동사원형?\u003c/li>\u003cli>Do you know how to + 동사원형?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. First, + 명령문.\u003c/li>\u003cli>Of course. You should + 동사원형.\u003c/li>\u003cli>Yes. All you have to do is + 동사원형.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"이번에는 방법과 절차를 묻는 표현을 배워 볼게요. Can you tell me how to use it?는 그것을 어떻게 사용하는지 알려 줄 수 있나요라는 뜻이에요. how to 다음에는 동사원형을 넣어서 무엇을 하는 방법인지 말해요.","hl":"key"},{"n":17,"text":"Could you tell me how to use it?라고 공손하게 말할 수 있어요. Can you show me how to use it?는 보여 주면서 알려 달라는 느낌이고, Do you know how to use it?는 사용법을 아는지 묻는 표현이에요.","hl":"alts"},{"n":18,"text":"대답은 Sure. First, place your library card on the robot's screen처럼 순서대로 말해요. Of course. You should type the title first나 Yes. All you have to do is press ENTER처럼 대답할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Excuse me, but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what's this robot for\u003c/span>?①\u003c/div>\u003cdiv class=\"d-ko\">실례지만, 이 로봇은 용도가 무엇인가요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">What's ~ for?\u003c/b>는 ‘이 ~은 용도가 뭔가요?’라고 물건의 \u003cb class=\"key\">용도\u003c/b>를 묻는 표현이에요. Excuse me, but은 대화를 정중하게 시작할 때 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Excuse me, what is this robot used for?\u003c/span>\u003cspan>Could you tell me what this robot is for?\u003c/span>\u003cspan>What do you use this robot for?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Oh, it's \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a robot that\u003c/span>② finds books for you.\u003c/div>\u003cdiv class=\"d-ko\">아, 그것은 당신을 위해 책을 찾아 주는 로봇이에요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">주격 관계대명사\u003c/b> that은 선행사 a robot을 수식하는 절을 이끌어요. ‘책을 찾아 주는 로봇’처럼 \u003cb class=\"key\">선행사\u003c/b>를 뒤에서 설명해요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"첫 번째 문장은 Excuse me, but what's this robot for?라는 문장이에요. 뜻은 실례지만 이 로봇은 용도가 무엇인가요라는 뜻이에요. 여기서 What's this robot for?는 물건의 용도를 묻는 핵심 표현이에요. Excuse me, what is this robot used for?처럼 같은 뜻으로 바꿔 말할 수 있어요.","hl":"l-0"},{"n":20,"text":"두 번째 문장은 Oh, it's a robot that finds books for you라는 문장이에요. 뜻은 아, 그것은 당신을 위해 책을 찾아 주는 로봇이에요라는 뜻이에요. a robot 뒤의 that은 주격 관계대명사로 로봇을 설명하는 절을 이끌어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Really? Can you tell me \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how to\u003c/span>③ use it?\u003c/div>\u003cdiv class=\"d-ko\">정말요? 사용하는 법을 알려 줄 수 있나요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">how to + 동사원형\u003c/b>은 ‘~하는 방법’이라는 뜻이에요. \u003cb class=\"key\">Can you tell me how to ~?\u003c/b>는 방법이나 절차를 정중하게 묻는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Could you tell me how to use it?\u003c/span>\u003cspan>Can you show me how to use it?\u003c/span>\u003cspan>Do you know how to use it?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. First, \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">place your library card on the robot's screen\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">물론이죠. 먼저, 도서관 카드를 로봇 화면 위에 올려놓으세요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">명령문\u003c/b>은 주어 없이 동사원형으로 시작해 ‘~하세요’라는 뜻을 나타내요. \u003cb class=\"key\">First\u003c/b>는 절차를 순서대로 말할 때 쓰는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"세 번째 문장은 Really? Can you tell me how to use it?라는 문장이에요. 뜻은 정말요? 사용하는 법을 알려 줄 수 있나요라는 뜻이에요. Can you tell me how to 다음에 동사원형을 넣으면 방법을 묻는 문장이 돼요. Could you tell me how to use it?나 Can you show me how to use it?처럼 같은 뜻으로 말할 수 있어요.","hl":"l-0"},{"n":22,"text":"네 번째 문장은 Sure. First, place your library card on the robot's screen이라는 문장이에요. 뜻은 물론이죠. 먼저 도서관 카드를 로봇 화면 위에 올려놓으세요라는 뜻이에요. place처럼 동사원형으로 시작하면 상대에게 행동을 지시하는 명령문이 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">OK\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">네.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">OK\u003c/b>는 상대의 설명을 이해했거나 동의할 때 쓰는 짧은 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Second, \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">type\u003c/span>④ the title of \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">the book you're looking for\u003c/span>⑤ and then press④ ENTER.\u003c/div>\u003cdiv class=\"d-ko\">둘째, 찾고 있는 책의 제목을 입력한 다음 엔터를 누르세요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">병렬구조\u003c/b>로 type과 press가 and로 연결된 \u003cb class=\"key\">동사원형\u003c/b> 명령문이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>선행사 the book을 수식하는 절을 이끄는 \u003cb class=\"key\">목적격 관계대명사\u003c/b> that/which가 \u003cb class=\"key\">생략\u003c/b>되어 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Second, enter the title of the book you want and then press ENTER.\u003c/span>\u003cspan>Second, type in the title of the book you're looking for and press ENTER.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"다섯 번째 문장은 OK라는 문장이에요. 뜻은 네라는 뜻이에요. 짧게 맞장구를 치며 설명을 잘 듣고 있다는 것을 보여 줘요.","hl":"l-0"},{"n":24,"text":"여섯 번째 문장은 Second, type the title of the book you're looking for and then press ENTER라는 문장이에요. 뜻은 둘째, 찾고 있는 책의 제목을 입력한 다음 엔터를 누르세요라는 뜻이에요. type과 press는 and로 연결된 동사원형 명령문이라 병렬구조를 이뤄요. the book you're looking for에서는 목적격 관계대명사 that이나 which가 생략되어 있어요. Second, enter the title of the book you want and then press ENTER처럼 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Is that all?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그게 전부인가요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">Is that all?\u003c/b>은 ‘그게 전부인가요?’라고 추가 설명이 더 있는지 확인하는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Is that everything?\u003c/span>\u003cspan>Is there anything else?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes. Then, the robot will find the book and \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">take it to the front desk\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">네. 그러면 로봇이 책을 찾아서 앞쪽 데스크로 가져다줄 거예요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">take + 목적어 + to + 장소\u003c/b>는 ‘~을 …로 가져가다’라는 뜻이에요. 여기서는 로봇이 책을 앞쪽 데스크로 가져간다는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"일곱 번째 문장은 Is that all?이라는 문장이에요. 뜻은 그게 전부인가요라는 뜻이에요. 설명이 더 필요한지 확인할 때 쓰는 표현이에요. Is that everything?이나 Is there anything else?처럼 같은 뜻으로 말할 수 있어요.","hl":"l-0"},{"n":26,"text":"여덟 번째 문장은 Yes. Then, the robot will find the book and take it to the front desk라는 문장이에요. 뜻은 네. 그러면 로봇이 책을 찾아서 앞쪽 데스크로 가져다줄 거예요라는 뜻이에요. take it to the front desk는 그것을 앞쪽 데스크로 가져가다는 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">So I can \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">just\u003c/span> go to the front desk and get the book?\u003c/div>\u003cdiv class=\"d-ko\">그러면 제가 그냥 앞쪽 데스크로 가서 책을 받으면 되는 건가요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">just\u003c/b>는 ‘그냥, 단지’라는 뜻으로 과정이 간단하다는 느낌을 줘요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>So I can simply go to the front desk and get the book?\u003c/span>\u003cspan>So all I have to do is go to the front desk and get the book?\u003c/span>\u003cspan>So I just need to go to the front desk and get the book?\u003c/span>\u003c/div>\u003c/div>\u003cdiv cla azing. Thank you라는 문장이에요. 뜻은 네, 정말 놀라워요. 고마워요라는 뜻이에요. amazing은 놀랍고 대단하다는 느낌을 전하는 표현이에요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 ‘Can you tell me how to use it?’와 같은 의도의 표현으로 가장 알맞은 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Can you tell me how to use it?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Can you show me how to use it?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>What's this robot for?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Is that all?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>It's so easy, isn't it?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Can you show me how to use it?\u003c/span>\u003cdiv class=\"g-exp\">방법이나 절차를 묻는 표현이에요. [[Can you tell me how to + 동사원형?]]은 ‘~하는 법을 알려 줄 수 있나요?’라는 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다음 문제입니다. Can you tell me how to use it?라는 말과 같은 의도의 표현을 골라 보세요. 보기를 잘 듣고 답을 골라 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 첫 번째 보기예요. Can you show me how to use it?라는 표현은 사용법을 보여 달라고 하면서 방법을 묻는 말이에요. 나머지는 용도나 확인을 묻는 표현이라 알맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">It's a robot ____ finds books for you.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>that\u003c/button>\u003c
