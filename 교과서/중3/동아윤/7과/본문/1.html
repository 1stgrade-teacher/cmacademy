<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 7과 본문1","audioDir":"1_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Secret Behind Online Recommendations: Big Data\u003c/h1>\u003ch2>온라인 추천 뒤의 비밀: 빅데이터\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리가 온라인 활동을 통해 남기는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">흔적\u003c/b>이 모여 \u003cb class=\"key\">빅데이터\u003c/b>를 형성하며, 전문가는 이를 분석하여 미래를 \u003cb class=\"key\">예측\u003c/b>하고 의사결정에 활용한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Big data, generated from our online traces, provides valuable insights for the future through expert analysis.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 일상에서 흔히 경험하는 온라인 서점의 추천 시스템 뒤에 숨겨진 거대한 비밀, 바로 Big Data에 대해 함께 공부해보겠습니다. 이 글의 요지는 우리가 온라인에서 남기는 흔적들이 빅데이터가 되고, 이것이 전문가의 분석을 거쳐 미래를 예측하는 소중한 자산이 된다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">빅데이터는 단순히 양이 많은 것을 넘어, 생성 속도가 빠르고 형태가 다양한 \u003cb class=\"key\">3V \u003c/b>\u003cb class=\"key\">(Volume, \u003c/b>\u003cb class=\"key\">Velocity, \u003c/b>\u003cb class=\"key\">Variety)\u003c/b>의 특징을 가집니다. 현대 사회의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">통신 \u003c/b>\u003cb class=\"key\">기술(ICT)\u003c/b>이 비약적으로 발달하면서 우리가 생성하는 데이터의 양은 전례 없이 폭발적으로 증가하고 있죠. 우리가 인터넷을 사용하는 과정은 마치 눈 위를 걷는 것과 같아서, 모든 행동이 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">발자국(Digital \u003c/b>\u003cb class=\"key\">Footprint)\u003c/b>이라는 흔적을 남깁니다. 이 방대한 흔적들은 가공되지 않은 \u003cb class=\"key\">원석\u003c/b>과 같아서 전문가의 정교한 분석 없이는 그 가치를 발휘하기 어렵습니다. 따라서 데이터 과학자와 같은 전문가들이 이를 분석하여 기업의 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이나 국가 정책 수립에 결정적인 도움을 줍니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요? 빅데이터는 단순히 양이 많은 것뿐만 아니라 변화 속도가 빠르고 그 형태도 매우 다양하다는 특징이 있어요. 이를 정보 통신 기술, 즉 ICT의 발달 덕분에 우리가 감당할 수 있게 된 거죠. 우리가 인터넷에서 하는 모든 행동은 Digital Footprint라고 부르는 흔적을 남기는데, 이건 마치 가공되지 않은 원석과 같습니다. 이 원석을 잘 깎아서 보석으로 만드는 과정이 바로 데이터 분석인 셈이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>추천의 의문\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>온라인 서점의 \u003cb class=\"key\">도서 \u003c/b>\u003cb class=\"key\">추천\u003c/b> 시스템에 대해 언급하며, 서점이 사용자의 \u003cb class=\"key\">취향\u003c/b>을 어떻게 아는지 질문을 던져 호기심을 유발합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개념 정의\u003csmall>주제 제시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>모든 것이 \u003cb class=\"key\">빅데이터\u003c/b> 덕분에 가능함을 밝히고, 빅데이터를 매우 크고 \u003cb class=\"key\">복잡한\u003c/b> 데이터의 집합으로 정의합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>형성 원인\u003csmall>근거 및 예시 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">통신 \u003c/b>\u003cb class=\"key\">기술\u003c/b>의 발달로 온라인상의 모든 행동이 \u003cb class=\"key\">흔적\u003c/b>을 남기게 되어 데이터의 양이 방대해졌음을 설명하고, 블로그 사진이나 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">기록\u003c/b>을 예로 듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>분석과 활용\u003csmall>결론 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>단순한 수집을 넘어 전문가의 \u003cb class=\"key\">분석\u003c/b>이 필수적이며, 도출된 결과가 \u003cb class=\"key\">의사결정\u003c/b>과 미래 예측에 사용된다고 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 단계별로 하나씩 짚어보겠습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 세 번째 문장까지는 도입부입니다. 온라인 서점에서 나도 모르는 내 취향을 딱 맞춰 추천해주는 책들을 보고 놀란 적이 있는지 물어보며 독자의 호기심을 자극하고 있네요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장부터 여섯 번째 문장에서는 드디어 주인공인 Big Data가 등장합니다. 이 모든 신기한 일이 빅데이터 덕분이라고 설명하며, 빅데이터란 아주 크고 복잡한 데이터의 집합이라는 정의를 내려줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 일곱 번째 문장부터 아홉 번째 문장에서는 빅데이터가 어떻게 만들어지는지 그 원인을 다룹니다. 우리가 온라인에서 하는 거의 모든 활동이 Trace, 즉 흔적을 남기기 때문에 데이터의 양이 예전보다 훨씬 많아졌다고 설명하며 블로그 사진이나 구매 기록을 예로 들고 있어요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 열 번째 문장부터 열세 번째 문장에서는 분석의 중요성을 강조합니다. 데이터를 모으는 것만으로는 부족하고, 반드시 Experts, 즉 전문가들이 이를 분석해야만 비로소 의사결정이나 미래 예측에 쓰일 수 있는 의미 있는 결과가 나온다는 결론을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 질문을 통해 \u003cb class=\"key\">빅데이터\u003c/b>라는 핵심 소재를 도입한 뒤, 중반부(네 번째 문장)에서 이 모든 현상의 \u003cb class=\"key\">원인\u003c/b>이 빅데이터임을 밝힙니다. 이후 빅데이터가 생성되는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">이유\u003c/b>와 그것이 어떻게 가공되어 \u003cb class=\"key\">결과\u003c/b>를 만들어내는지 순차적으로 설명하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (3)\u003c/b>\u003cspan>앞서 언급한 상황에 대한 인과적 질문\u003c/span>\u003cb>because of (4)\u003c/b>\u003cspan>현상의 원인 제시\u003c/span>\u003cb>As (7)\u003c/b>\u003cspan>상황의 변화에 따른 동시 상황(비례)\u003c/span>\u003cb>For example (9)\u003c/b>\u003cspan>온라인 흔적에 대한 구체적 사례\u003c/span>\u003cb>however (10)\u003c/b>\u003cspan>수집의 한계와 분석의 필요성 강조를 위한 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">books that the store recommended\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">big data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">data sets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the amount of data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a trace\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">meaningful results\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 질문을 던지고 그에 대한 답을 찾아가는 질문 답변 구조와, 어떤 원인으로 인해 결과가 발생하는지 보여주는 인과 구조가 섞여 있어요. 주제문이 글 중간인 네 번째 문장에 명확히 드러나는 중괄식 패턴을 보여주고 있습니다.","hl":"ty"},{"n":9,"text":"신호어들을 살펴보면 문맥을 잡기 쉬워요. 세 번째 문장의 So는 질문을 유도하고, 네 번째 문장의 because of는 원인을 직접적으로 밝혀주죠. 열 번째 문장의 however는 단순히 모으는 것만으로는 안 된다는 내용의 반전을 주면서 전문가 분석이라는 핵심 주제로 연결해주는 아주 중요한 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>bookstore\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서점\u003c/span>\u003c/div>\u003cdiv>\u003cb>recommend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추천하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>big data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빅데이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>data set\u003c/b>\u003cem>명사\u003c/em>\u003cspan>데이터 집합\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>information and communication technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보 통신 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>amount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양\u003c/span>\u003c/div>\u003cdiv>\u003cb>greater\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 많은 (great의 비교급)\u003c/span>\u003c/div>\u003cdiv>\u003cb>mainly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>almost\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>trace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흔적\u003c/span>\u003c/div>\u003cdiv>\u003cb>upload\u003c/b>\u003cem>동사\u003c/em>\u003cspan>올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매\u003c/span>\u003c/div>\u003cdiv>\u003cb>record\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기록\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단순히\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수집하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>method\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도출하다, 끌어내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaningful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의미 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>result\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어 몇 개만 볼게요. Analyze는 분석하다라는 뜻으로 이 글의 핵심 과정이고, Meaningful은 의미 있는이라는 형용사로 분석 후에 얻게 되는 결과의 가치를 수식합니다. 그리고 Predict는 미래를 예측한다는 아주 중요한 동사니까 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰, 거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complex\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complicated\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trace\u003c/b>\u003cspan class=\"m\">흔적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mark\u003c/span>\u003cspan class=\"s\">track\u003c/span>\u003cspan class=\"s\">record\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">analyze\u003c/b>\u003cspan class=\"m\">분석하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">examine\u003c/span>\u003cspan class=\"s\">investigate\u003c/span>\u003cspan class=\"s\">scrutinize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predict\u003c/b>\u003cspan class=\"m\">예측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foresee\u003c/span>\u003cspan class=\"s\">forecast\u003c/span>\u003cspan class=\"s\">anticipate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expert\u003c/b>\u003cspan class=\"m\">전문가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specialist\u003c/span>\u003cspan class=\"s\">professional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">amateur\u003c/span>\u003cspan class=\"a\">novice\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해볼까요? Big은 huge나 massive로 바꿔 쓸 수 있고, Complex는 복잡하다는 뜻의 complicated와 비슷합니다. Predict는 미래를 내다보는 것이니 foresee나 forecast와 같은 뜻이죠. 반대로 Expert인 전문가의 반대말은 초보자를 뜻하는 amateur나 novice가 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방문해 본 적이 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">visited\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온라인 서점을\u003c/span>\u003cspan class=\"en\">an online bookstore\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 놀란 적이 있는가\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 책들에 의해\u003c/span>\u003cspan class=\"en\">by the books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 서점이 추천한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003cspan class=\"tgt\">recommended\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 위해\u003c/span>\u003cspan class=\"en\">for you?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 온라인 서점을 방문해서 그 서점이 당신에게 추천한 책들을 보고 놀란 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자가 일상에서 겪었을 법한 경험을 질문하며 \u003cb class=\"key\">빅데이터\u003c/b> 기술이 적용된 사례를 소개하고 있습니다. 추천 시스템의 \u003cb class=\"key\">정확성\u003c/b>을 언급하며 글의 주제로 자연스럽게 유도하는 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 경험\u003c/span> : Have + 주어 + ever + [과거분사(p.p.)]? : \"방문해 본 적이 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 수동태 및 병렬 구조\u003c/span> : Have + 주어 + [been + 과거분사(p.p.)]? : \"놀라게 되었는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 선행사(books) + [that + 주어 + 동사] : \"서점이 추천한 (책들)\"\u003c/div>\u003c/div>","se 의 관심을 끌 만큼 매력적이었다는 점을 확인시켜 주는 문장이에요.","hl":"mn"},{"n":17,"text":"여기서 중요한 건 looked interesting 부분입니다. look은 대표적인 감각동사라 뒤에 형용사나 분사가 보어로 와야 해요. 책이 우리에게 흥미를 주는 주체니까 과거분사가 아닌 현재분사 형용사인 interesting을 쓴다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 서점은 어떻게 알았을까\u003c/span>\u003cspan class=\"en\">how did the bookstore know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 무엇을 좋아하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">liked\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 서점은 당신이 무엇을 좋아하는지 어떻게 알았을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 상황에 대해 의문을 제기하며 독자의 \u003cb class=\"key\">관심\u003c/b>을 집중시킵니다. 이 질문에 대한 답이 바로 이 글의 핵심인 \u003cb class=\"key\">빅데이터\u003c/b>임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(what) + 주어(you) + 동사(liked) : \"당신이 무엇을 좋아했는지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"So, 그래서. how did the bookstore know, 그 서점은 어떻게 알았을까. what you liked?, 당신이 무엇을 좋아하는지. 이 문장 전체를 해석하면, 그 서점은 당신이 무엇을 좋아하는지 어떻게 알았을까?","hl":"m"},{"n":19,"text":"서점이 내 마음을 어떻게 그렇게 잘 아는지 독자에게 질문을 던지며 다음 내용에 대한 궁금증을 유발하고 있어요.","hl":"mn"},{"n":20,"text":"마지막 문장에서 주목할 부분은 know의 목적어로 쓰인 what you liked 입니다. 의문사 what이 이끄는 간접의문문인데요. 의문사 다음에 주어와 동사가 차례대로 나오는 의문사 주어 동사 어순이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv cl -ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문\u003c/span> : What [의문대명사] + is [be동사] + 주어? : \"~은 무엇인가요?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"What, 무엇인가. is big data?, 빅데이터는?. 이 문장 전체를 해석하면, 빅데이터는 무엇인가?","hl":"m"},{"n":25,"text":"이제 본격적으로 빅데이터가 정확히 무엇인지 설명하기 위해 질문을 던지며 독자의 관심을 끌고 있네요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트로 의문사 What을 문장 앞에 써서 궁금한 내용을 묻고 있습니다. 주어인 big data에 맞춰서 be동사는 is를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빅데이터는 데이터의 집합이다\u003c/span>\u003cspan class=\"en\">Big data is data sets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 크고 복잡한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> very big and complex.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빅데이터는 매우 크고 복잡한 데이터의 집합이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빅데이터의 학술적인 \u003cb class=\"key\">정의\u003c/b>를 내리는 문장으로, 그 특징인 거대한 \u003cb class=\"key\">규모\u003c/b>와 난해한 \u003cb class=\"key\">복잡성\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(data sets) + that [주격 관계대명사] + are [동사] : \"~한 (데이터 집합)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : data sets (복수 선행사) → are (복수 동사) : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Big data is data sets, 빅데이터는 데이터의 집합이다. that are very big and complex, 매우 크고 복잡한. 이 문장 전체를 해석하면, 빅데이터는 매우 크고 복잡한 데이터의 집합이다.","hl":"m"},{"n":28,"text":"빅데이터가 단순한 데이터가 아니라 아주 덩치가 크고 복잡하게 얽혀 있는 자료들의 모임이라는 것을 알려줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 that은 주격 관계대명사로 쓰여서 앞에 있는 데이터 집합을 꾸며주고 있어요. 두 번째로 선행사인 data sets가 복수 형태이기 때문에 동사 자리에 is가 아닌 are를 써야 한다는 점이 시험에 아주 잘 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보 통신 기술이 발달함에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> information and communication technology develops,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">데이터의 양이\u003c/span>\u003cspan class=\"en\">the amount of data\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 갖고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많아지고 있다\u003c/span>\u003cspan class=\"en\">is getting \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">greater\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전보다.\u003c/span>\u003cspan class=\"en\">than before.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정보 통신 기술이 발달함에 따라 우리가 갖고 있는 데이터의 양이 이전보다 훨씬 더 많아지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기술 발달로 인해 데이터가 급증한 \u003cb class=\"key\">빅데이터의 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명하며, 그 양이 과거에 비해 \u003cb class=\"key\">방대해짐\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (~함에 따라)\u003c/span> : As + 주어 + 동사 : \"~함에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 명사(data) + [that/which 생략] + 주어 + 동사 : \"우리가 가진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : much + 비교급(greater) : \"훨씬 더 많은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"As information and communication technology develops, 정보 통신 기술이 발달함에 따라. the amount of data, 데이터의 양이. we have, 우리가 갖고 있는. is getting much greater, 훨씬 더 많아지고 있다. than before, 이전보다.. 이 문장 전체를 해석하면, 정보 통신 기술이 발달함에 따라 우리가 갖고 있는 데이터의 양이 이전보다 훨씬 더 많아지고 있다.","hl":"m"},{"n":31,"text":"기술이 발전하면서 우리 주변의 데이터 양이 급격히 늘어났다는 빅데이터의 배경을 설명하는 문장이에요. 과거와는 비교할 수 없을 정도로 데이터가 방대해짐을 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 As는 상황의 변화를 나타내는 접속사로 쓰였습니다. 두 번째로 data 뒤에는 목적격 관계대명사가 생략되어 우리가 가진 데이터라고 해석하고요. 세 번째로 greater 앞의 much는 훨씬이라는 뜻으로 비교급을 강조합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것의 주된 이유는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">mainly \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 모든 것들이\u003c/span>\u003cspan class=\"en\">almost everything\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 온라인상에서 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">online\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔적을 남기기 때문이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leaves\u003c/span> a trace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것의 주된 이유는 우리가 온라인상에서 하는 거의 모든 것들이 흔적을 남기기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 데이터가 많아진 구체적인 \u003cb class=\"key\">주요 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 밝히며, 모든 온라인 활동이 디지털 \u003cb class=\"key\">기록\u003c/b>이 된다는 점을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원인 분석 구문\u003c/span> : This is because + 주어 + 동사 : \"이것은 주로 ~이기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that\u003c/span> : everything(선행사) + that + 주어 + 동사 : \"우리가 온라인상에서 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : everything(단수 주어) + leaves(단수 동사) : \"남긴다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This is mainly because, 이것의 주된 이유는. almost everything, 거의 모든 것들이. that we do online, 우리가 온라인상에서 하는. leaves a trace, 흔적을 남기기 때문이다.. 이 문장 전체를 해석하면, 이것의 주된 이유는 우리가 온라인상에서 하는 거의 모든 것들이 흔적을 남기기 때문이다.","hl":"m"},{"n":34,"text":"왜 데이터가 많아졌는지 그 주요 원인을 설명하는 부분이에요. 우리가 인터넷에서 하는 모든 행동이 하나하나 기록으로 남는다는 점이 핵심이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 This is because 구문은 뒤에 주요 원인을 나타내는 절이 옵니다. 두 번째로 everything을 수식할 때는 관계대명사 that을 주로 사용하죠. 세 번째로 everything은 항상 단수 취급하기 때문에 동사 leave에 s를 붙여야 한다는 점 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 블로그에 올린 사진들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">photos \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">upload\u003c/span> on your blog\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온라인 상점에서의 구매 기록들이\u003c/span>\u003cspan class=\"en\">and the records of your purchases at online stores\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 빅데이터의 일부이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> all part of big data.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 당신이 블로그에 올린 사진들과 온라인 상점에서의 구매 기록들이 모두 빅데이터의 일부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빅데이터의 구체적인 \u003cb class=\"key\">사례\u003c/b>를 제시하여, 우리의 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">활동\u003c/b>이 모두 데이터로 변환됨을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 명사(photos) + [that/which 생략] + 주어 + 동사 : \"당신이 올린 사진들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : A(photos) and B(records) + are : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"For example, 예를 들어. the photos you upload on your blog, 당신이 블로그에 올린 사진들과. and the records of your purchases at online stores, 온라인 상점에서의 구매 기록들이. are all part of big data, 모두 빅데이터의 일부이다.. 이 문장 전체를 해석하면, 예를 들어, 당신이 블로그에 올린 사진들과 온라인 상점에서의 구매 기록들이 모두 빅데이터의 일부이다.","hl":"m"},{"n":37,"text":"빅데이터가 무엇인지 구체적인 사례를 들어 설명합니다. 사진이나 쇼핑 기록처럼 우리의 일상적인 활동이 모두 데이터가 된다는 점을 보여주고 있어요.","hl":"mn"},{"n":38,"text":"첫 번째로 photos 뒤에는 수식을 해주는 관계대명사가 생략되어 있습니다. 두 번째로 주어가 사진들과 기록들 두 가지가 합쳐진 복수 주어이기 때문에 동사는 are를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 데이터를 수집하는 것만으로는,\u003c/span>\u003cspan class=\"en\">Simply \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">collecting \u003c/span>\u003cspan class=\"tgt\">data\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분하지 않다.\u003c/span>\u003cspan class=\"en\">is not enough.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 단순히 데이터를 수집하는 것만으로는 충분하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 데이터를 모으는 것만으로는 가치가 없으며, 이를 어떻게 \u003cb class=\"key\">활용\u003c/b>하느냐가 더 중요함을 시사합니다. 글의 흐름이 단순 나열에서 \u003cb class=\"key\">분석\u003c/b>의 필요성으로 전환되는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : collecting [동명사] + data [목적어] : \"데이터를 수집하는 것\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Simply collecting data, 단순히 데이터를 수집하는 것만으로는. however, 하지만. is not enough, 충분하지 않다.. 이 문장 전체를 해석하면, 하지만 단순히 데이터를 수집하는 것만으로는 충분하지 않다.","hl":"m"},{"n":40,"text":"데이터를 그냥 모으기만 한다고 해서 바로 답이 나오는 건 아니겠죠. 이제 그 데이터를 어떻게 요리해야 할지 즉 분석의 필요성을 말하려는 단계예요.","hl":"mn"},{"n":41,"text":"첫 번째로 주어 자리에 쓰인 collecting data를 주목하세요. 이렇게 동명사 덩어리가 주어가 되면 뒤에 나오는 동사는 반드시 단수 형태인 is를 써야 한다는 점이 시험에 아주 자주 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빅데이터는\u003c/span>\u003cspan class=\"en\">Big data\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분석되어야 하는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">analyzed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan clas
