<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>온라인 서점의 개인별 맞춤 추천은 빅데이터의 기술 덕분에 가능합니다.</li><li>사용자의 취향을 파악하는 추천 시스템</li><li>빅데이터(Big data)의 실생활 활용 사례 제시</li><li>핵심 키워드: 빅데이터(Big data)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02빅데이터의 정의와 생성</div><ul><li>빅데이터는 정보 통신 기술의 발달로 인해 양적으로 거대해지고 복잡해진 데이터 집합입니다.</li><li>온라인상에서 발생하는 모든 활동의 흔적(trace)</li><li>블로그 사진이나 온라인 쇼핑 기록 등이 데이터의 일부</li><li>핵심 키워드: 정보 통신 기술(Information and communication technology)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03데이터 분석과 가치 창출</div><ul><li>단순히 데이터를 수집하는 것을 넘어, 전문가들이 이를 분석하여 의미 있는 정보를 도출합니다.</li><li>빅데이터 전문가(Big data experts)에 의한 체계적인 분석</li><li>분석된 결과를 의사 결정이나 미래 예측(predict the future)에 활용</li><li>핵심 키워드: 분석(Analyze)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visit</td><td class=\"m\">방문하다</td></tr><tr><td class=\"w\">recommend</td><td class=\"m\">추천하다</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">because of</td><td class=\"m\">~때문에</td></tr><tr><td class=\"w\">data set</td><td class=\"m\">데이터 세트 (데이터 집합)</td></tr><tr><td class=\"w\">complex</td><td class=\"m\">복잡한</td></tr><tr><td class=\"w\">information and communication technology</td><td class=\"m\">정보 통신 기술</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">발달하다, 성장하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr><tr><td class=\"w\">mainly</td><td class=\"m\">주로</td></tr><tr><td class=\"w\">trace</td><td class=\"m\">흔적</td></tr><tr><td class=\"w\">upload</td><td class=\"m\">업로드하다 (올리다)</td></tr><tr><td class=\"w\">purchase</td><td class=\"m\">구매</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">수집하다</td></tr><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">expert</td><td class=\"m\">전문가</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 온라인 서점을 방문해서</span><span class=\"en\"><b><span class=\"grammar-hl\">Living</span> with Big Data <span class=\"grammar-hl\">Have you ever</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 책들을 보고 놀란 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">visited</span> an online bookstore and <span class=\"grammar-hl\">been</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 서점이 당신에게 추천한</span><span class=\"en\"><b><span class=\"grammar-hl\">surprised</span> by the books <span class=\"grammar-hl\">that the store recommended</span> for you?</b></span></div></div><div class=\"lec-sent-ko\">당신은 온라인 서점을 방문해서 그 서점이 당신에게 추천한 책들을 보고 놀란 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 경험을 묻는 질문으로, 글의 주제인 &#39;빅데이터&#39;가 우리 일상에 어떻게 활용되는지 흥미를 유발하며 자연스럽게 본론으로 안내하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Living (동명사): 문장의 주어 역할을 하며 &#39;빅데이터와 함께 살기&#39;라는 행위를 명사적으로 표현함</div><div class=\"lec-gr-item\">have you ever visited (현재완료): &#39;have+p.p.&#39; 구조로 과거부터 현재까지의 경험을 묻는 시제</div><div class=\"lec-gr-item\">been surprised (수동태): be동사(been)+p.p.(surprised) 구조. surprise는 타동사(A를 놀라게 하다)인데 목적어가 없어서 수동구조 be surprised(놀라게 되다)를 쓴다. 기본구조: surprise+O(누구를 놀라게 하다)</div><div class=\"lec-gr-item\">that the store recommended (관계대명사): &#39;that&#39;은 목적격 관계대명사로 선행사 &#39;the books&#39;를 수식하며, 뒤에 &#39;recommended&#39;의 목적어가 생략된 불완전한 절이 옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visit</td><td class=\"m\">방문하다</td></tr><tr><td class=\"w\">recommend</td><td class=\"m\">추천하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 책들 중 다수가</span><span class=\"en\"><b>Many of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 흥미로워 보였다.</span><span class=\"en\"><b><span class=\"grammar-hl\">looked interesting</span> to you.</b></span></div></div><div class=\"lec-sent-ko\">그 책들 중 다수가 당신에게 흥미로워 보였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;추천받은 책&#39;에 대한 구체적인 반응을 언급하며, 시스템이 추천하는 방식이 매우 정확하고 개인화되어 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked interesting 5형식(SVOC) 구조: &#39;look+형용사(interesting)&#39;로 주어의 상태를 설명하는 보어 자리</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 서점은 어떻게 알았을까</span><span class=\"en\"><b>So how did the bookstore know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 무엇을 좋아하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what you liked</span>?</b></span></div></div><div class=\"lec-sent-ko\">그 서점은 당신이 무엇을 좋아하는지 어떻게 알았을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 현상에 대한 의문을 제기하여, 독자가 그 정답인 &#39;빅데이터&#39;라는 핵심 소재를 자연스럽게 생각해보도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what you liked (간접의문문): &#39;의문사(what)+주어(you)+동사(liked)&#39; 순서로 쓰여 &#39;know&#39; 동사의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 모두 가능하다</span><span class=\"en\"><b>This is all <span class=\"grammar-hl\">possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 때문에.</span><span class=\"en\"><b>because of big data.</b></span></div></div><div class=\"lec-sent-ko\">이것은 모두 빅데이터 때문에 가능하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 의문에 대한 해답을 제시하며, 이 글 전체를 관통하는 핵심 개념인 &#39;빅데이터&#39;를 명시적으로 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">possible 형용사 보어: &#39;This(S) is(V) possible(C)&#39;의 2형식 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">possible</td><td class=\"m\">가능한</td></tr><tr><td class=\"w\">because of</td><td class=\"m\">~때문에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇인가</span><span class=\"en\"><b><span class=\"grammar-hl\">What is big data?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">빅데이터는 무엇인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던진 뒤 바로 정의를 설명함으로써 글의 논리적인 구조를 체계적으로 잡아주는 전환점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What is big data? (의문문): 의문사 &#39;What&#39;이 보어 자리에 위치한 문장</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"><b>Big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데이터의 집합이다</span><span class=\"en\"><b>is data sets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 크고 복잡한</span><span class=\"en\"><b><span class=\"grammar-hl\">that are very big and complex</span>.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 매우 크고 복잡한 데이터의 집합이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빅데이터의 사전적 정의를 제시합니다. complex는 사전적으로는 &#39;복합적인&#39;이지만, 여기서는 단순히 양만 많은 것이 아니라 데이터의 종류나 형태가 얽혀 있어 사람이 다루기 힘든 수준임을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that are very big and complex (관계대명사): &#39;that&#39;은 주격 관계대명사로 선행사 &#39;data sets&#39;를 수식하며, 뒤에 바로 동사 &#39;are&#39;가 오는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">data set</td><td class=\"m\">데이터 세트 (데이터 집합)</td></tr><tr><td class=\"w\">complex</td><td class=\"m\">복잡한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정보 통신 기술이 발달함에 따라</span><span class=\"en\"><b>As information and communication technology develops,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 갖고 있는 데이터의 양이</span><span class=\"en\"><b>the amount of <span class=\"grammar-hl\">data we have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 많아지고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is getting</span> much greater</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이전보다.</span><span class=\"en\"><b>than before.</b></span></div></div><div class=\"lec-sent-ko\">정보 통신 기술이 발달함에 따라 우리가 갖고 있는 데이터의 양이 이전보다 훨씬 더 많아지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술 발달이 데이터 폭발의 근본적인 원인임을 밝히며, 현상에 대한 논리적 인과관계를 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is getting (현재진행): be동사(is)+현재분사(getting) 구조로 &#39;점점 ~해지고 있다&#39;는 변화를 나타냄</div><div class=\"lec-gr-item\">data we have 관계대명사 생략: &#39;data&#39;와 &#39;we&#39; 사이에 목적격 관계대명사 that/which가 생략되어 앞의 data를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">information and communication technology</td><td class=\"m\">정보 통신 기술</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">발달하다, 성장하다</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것의 주된 이유는 ~기 때문이다</span><span class=\"en\"><b>This is mainly because</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 모든 것들이</span><span class=\"en\"><b>almost everything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 온라인상에서 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that we do</span> online</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔적을 남기기.</span><span class=\"en\"><b>leaves a trace.</b></span></div></div><div class=\"lec-sent-ko\">이것의 주된 이유는 우리가 온라인상에서 하는 거의 모든 것들이 흔적을 남기기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 데이터가 왜 많아지는지 그 이유를 구체적으로 설명합니다. 여기서 trace는 &#39;흔적&#39;이라는 뜻인데, 디지털 환경에서 생성되는 모든 클릭과 기록이 사라지지 않고 데이터로 저장되는 현상을 비유적으로 표현하여 우리가 무심코 하는 행동이 가치 있는 자원이 됨을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that we do (관계대명사): &#39;that&#39;은 목적격 관계대명사로 선행사 &#39;everything&#39;을 수식하며, 뒤에 &#39;do&#39;의 목적어가 생략됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mainly</td><td class=\"m\">주로</td></tr><tr><td class=\"w\">trace</td><td class=\"m\">흔적</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진들과</span><span class=\"en\"><b>the photos</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 블로그에 올린</span><span class=\"en\"><b><span class=\"grammar-hl\">you upload</span> on your blog</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온라인 상점에서의 구매 기록들이</span><span class=\"en\"><b>and the records of your purchases at online stores</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두 빅데이터의 일부이다.</span><span class=\"en\"><b>are all part of big data.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 당신이 블로그에 올린 사진들과 온라인 상점에서의 구매 기록들이 모두 빅데이터의 일부이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 언급한 &#39;온라인 행동의 흔적&#39;이 무엇인지 구체적인 사례를 들어 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you upload 관계대명사 생략: &#39;photos&#39; 뒤에 목적격 관계대명사 that/which가 생략되어 &#39;you upload&#39;가 &#39;photos&#39;를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upload</td><td class=\"m\">업로드하다 (올리다)</td></tr><tr><td class=\"w\">purchase</td><td class=\"m\">구매</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단순히 데이터를 수집하는 것만으로는</span><span class=\"en\"><b>Simply <span class=\"grammar-hl\">collecting data</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분하지 않다.</span><span class=\"en\"><b>is not enough.</b></span></div></div><div class=\"lec-sent-ko\">하지만 단순히 데이터를 수집하는 것만으로는 충분하지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수집 단계에서 나아가 다음 단계의 필요성을 역설하며, 논리의 흐름을 &#39;데이터의 확보&#39;에서 &#39;데이터의 가공&#39;으로 이동시키는 연결어(however)를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">collecting data (동명사): &#39;collecting&#39;이 &#39;data&#39;를 목적어로 취해 문장의 주어(S) 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">collect</td><td class=\"m\">수집하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"><b>Big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분석되어야 하는데,</span><span class=\"en\"><b><span class=\"grammar-hl\">has to be analyzed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은 이루어진다</span><span class=\"en\"><b>and this <span class=\"grammar-hl\">is done</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 전문가들에 의해서.</span><span class=\"en\"><b>by big data experts.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 분석되어야 하는데, 이것은 빅데이터 전문가들에 의해서 이루어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 데이터 자체는 원석에 불과하므로 가공하는 전문가의 역할이 필수적임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has to be analyzed (수동태): &#39;be동사(be)+p.p.(analyzed)&#39; 구조. analyze는 타동사인데 목적어가 없어서 수동구조 be analyzed 형태로 쓴다. 기본구조: analyze+O(무엇을 분석하다)</div><div class=\"lec-gr-item\">is done (수동태): &#39;be동사(is)+p.p.(done)&#39; 구조. do는 타동사인데 목적어가 없어서 수동구조 is done 형태로 쓴다. 기본구조: do+O(무엇을 하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">expert</td><td class=\"m\">전문가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다양한 방법들을 사용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">Using various methods</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전문가들은 빅데이터를 분석하고,</span><span class=\"en\"><b>experts analyze big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것으로부터 의미 있는 결과들을 도출한다.</span><span class=\"en\"><b>and draw meaningful results from it.</b></span></div></div><div class=\"lec-sent-ko\">전문가들은 다양한 방법들을 사용하여 빅데이터를 분석하고, 그것으로부터 의미 있는 결과들을 도출한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가들이 하는 구체적인 작업을 설명합니다. draw는 사전적으로 &#39;끌어당기다, 그리다&#39;이지만 여기서는 방대한 데이터 속에서 가치 있는 정보만을 추출해낸다는 의미로 쓰였습니다. 단순히 분석하는 것에 그치지 않고 최종적인 결과물을 만들어낸다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Using various methods (분사구문): &#39;-ing&#39;가 부사적 기능으로 쓰였으며, 원문으로 변환 시 &#39;While they use various methods&#39;로 해석 가능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">expert</td><td class=\"m\">전문가</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 다음, 이런 결과들은</span><span class=\"en\"><b>These results then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용될 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can be used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사결정을 하거나</span><span class=\"en\"><b><span class=\"grammar-hl\">to make decisions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래를 예측하는 데.</span><span class=\"en\"><b>or <span class=\"grammar-hl\">to predict</span> the future.</b></span></div></div><div class=\"lec-sent-ko\">그런 다음, 이런 결과들은 의사결정을 하거나 미래를 예측하는 데 사용될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빅데이터 분석의 최종적인 목적과 효용성을 언급하며, 독자에게 빅데이터가 왜 중요한 기술인지를 정리하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be used (수동태): 조동사+be동사+p.p.(used) 구조. use는 타동사인데 목적어가 없어서 수동구조 be used 형태로 쓴다. 기본구조: use+O(무엇을 사용하다)</div><div class=\"lec-gr-item\">to make decisions (to부정사): &#39;be used to+동사원형&#39; 구조에서 &#39;~하기 위해 사용되다&#39;라는 목적의 부사적 용법으로 쓰임</div><div class=\"lec-gr-item\">to predict (to부정사): 앞의 &#39;to make&#39;와 병렬 구조를 이루며 &#39;decisions&#39;를 만들거나 &#39;미래를 예측하기 위해&#39; 사용된다는 목적을 나타냄</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>온라인 서점의 정확한 추천은 &#39;빅데이터&#39;라는 기술 덕분이다.</li><li>빅데이터는 온라인상에서 발생하는 모든 행동의 흔적들이 모인 거대한 정보 집합이다.</li><li>단순히 데이터를 모으는 것에 그치지 않고, 전문가가 이를 분석해야 의미 있는 결과를 얻을 수 있다.</li><li>이렇게 도출된 결과물은 의사 결정이나 미래 예측과 같은 유용한 곳에 활용된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Big data consists of massive and complex information from our online traces, and it provides valuable insights for predicting the future through professional analysis.</div>\n              <div class=\"lec-final-sum-ko\">빅데이터는 우리의 온라인 흔적에서 비롯된 거대하고 복잡한 정보로 구성되며, 전문적인 분석을 통해 미래를 예측하는 가치 있는 통찰을 제공한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio":"./1_audio/26.mp3","hl":"main"},{"audio":"./1_audio/27.mp3","hl":"meaning"},{"audio":"./1_audio/28.mp3","hl":"grammar"}],[{"audio":"./1_audio/29.mp3","hl":"main"},{"audio":"./1_audio/30.mp3","hl":"meaning"},{"audio":"./1_audio/31.mp3","hl":"grammar"}],[{"audio":"./1_audio/32.mp3","hl":"main"},{"audio":"./1_audio/33.mp3","hl":"meaning"},{"audio":"./1_audio/34.mp3","hl":"grammar"}],[{"audio":"./1_audio/35.mp3","hl":"main"},{"audio":"./1_audio/36.mp3","hl":"meaning"},{"audio":"./1_audio/37.mp3","hl":"grammar"}],[{"audio":"./1_audio/38.mp3","hl":"main"},{"audio":"./1_audio/39.mp3","hl":"meaning"},{"audio":"./1_audio/40.mp3","hl":"
