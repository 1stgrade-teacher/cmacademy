<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 7과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 7과 본문3","audioDir":"3_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>How Big Data Revolutionized Sports Performance: The Case of Germany\u003c/h1>\u003ch2>빅데이터가 스포츠 경기력을 혁신하는 방법: 독일 축구팀 사례\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">빅데이터\u003c/b>가 선수들의 경기력을 향상시켜 스포츠를 더욱 흥미진진하게 만들며, \u003cb class=\"key\">독일 \u003c/b>\u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">대표 \u003c/b>\u003cb class=\"key\">축구팀\u003c/b>이 이를 통해 2014년 월드컵에서 우승한 사례를 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Big data contributes significantly to improving athletic performance, as demonstrated by the success of the German national soccer team.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 스포츠의 세계가 정보 기술과 만나 어떻게 변하고 있는지 알아볼 거예요. 특히 빅데이터가 독일 축구팀의 우승을 어떻게 도왔는지 그 흥미로운 과정을 살펴볼 텐데요. 핵심 요지는 빅데이터 분석이 실제 경기 성과를 높이는 데 결정적인 역할을 한다는 점입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">오늘날 스포츠는 단순히 기술의 대결을 넘어 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">분석\u003c/b>의 장이 되었습니다. 선수들의 움직임, 체력, 전술적 위치 등을 수치화하여 분석하는 것을 \u003cb class=\"key\">스포츠 \u003c/b>\u003cb class=\"key\">애널리틱스\u003c/b>(Sports Analytics)라고 합니다. 마치 요리사가 신선한 재료를 모아 최고의 맛을 내듯, 데이터 분석가는 수집된 정보를 바탕으로 \u003cb class=\"key\">최적의 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 짭니다. 이 지문에서는 \u003cb class=\"key\">빅데이터\u003c/b>(Big Data) 기술이 어떻게 실제 경기 결과에 결정적인 영향을 미치는지 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"최근 스포츠계에서는 스포츠 애널리틱스라는 분야가 아주 중요해졌어요. 마치 요리사가 요리하기 전에 최상의 재료를 고르는 것처럼, 감독들도 데이터를 모아 최상의 전략을 짜는 거죠. 선수들의 활동량이나 공을 가지고 있는 시간 같은 모든 움직임이 숫자로 기록됩니다. 오늘 지문을 통해 빅데이터라는 기술이 스포츠 현장에서 어떻게 승리의 마법을 부리는지 확인해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 화제 제시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>스포츠 팬들에게 질문을 던지며 \u003cb class=\"key\">빅데이터\u003c/b>가 스포츠 경기력을 향상시키고 있음을 언급합니다. 빅데이터가 스포츠를 더 \u003cb class=\"key\">흥미진진하게\u003c/b> 만드는 역할을 한다고 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 사례 소개\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">독일 \u003c/b>\u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">대표 \u003c/b>\u003cb class=\"key\">축구팀\u003c/b>의 사례를 들어, 방대한 데이터를 수집하고 분석하여 \u003cb class=\"key\">데이터베이스\u003c/b>를 구축했음을 설명합니다. 구체적으로 선수들의 활동량과 \u003cb class=\"key\">볼 \u003c/b>\u003cb class=\"key\">점유 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 등이 분석 대상에 포함되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>결과와 성과\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>구축된 데이터베이스 덕분에 독일 팀은 \u003cb class=\"key\">경기력\u003c/b>을 개선할 수 있었고, 최종적으로 \u003cb class=\"key\">2014년 \u003c/b>\u003cb class=\"key\">월드컵\u003c/b>에서 우승을 차지했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 질문을 통한 화제 도입에서 시작해서 독일 팀의 구체적 사례를 거쳐 우승이라는 결과로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 질문을 통해 우리의 관심을 끌고 있어요. 빅데이터가 선수들의 경기력을 높이고 스포츠를 훨씬 흥미진진하게 만들고 있다는 핵심 내용을 먼저 던져줍니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 구체적인 예시로 독일 국가 대표 축구팀을 소개합니다. 이 팀은 선수들에 대한 엄청난 양의 데이터를 수집하고 분석해서 자기들만의 데이터베이스를 구축했죠. 구체적으로는 선수 개개인이 얼마나 뛰었는지, 공을 얼마나 오래 가졌는지 같은 세밀한 정보를 포함하고 있었어요.","hl":"f1"},{"n":6,"text":"마지막 여섯 번째 문장에서는 그 결과를 보여줍니다. 이 데이터베이스의 도움으로 독일 팀은 경기력을 높일 수 있었고, 결국 이천십사년 월드컵 우승이라는 영광을 안게 되었다는 내용으로 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">두 번째 문장에서 \u003cb class=\"key\">빅데이터가 \u003c/b>\u003cb class=\"key\">경기력을 \u003c/b>\u003cb class=\"key\">향상시킨다\u003c/b>는 핵심 주장을 먼저 제시합니다. 그 뒤를 이어 \u003cb class=\"key\">독일 \u003c/b>\u003cb class=\"key\">축구팀\u003c/b>이라는 구체적인 사례를 통해 내용을 뒷받침합니다. \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">성공 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 통해 주장의 타당성을 입증하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Well, (2)\u003c/b>\u003cspan>화제 전환 및 강조\u003c/span>\u003cb>A famous example is (3)\u003c/b>\u003cspan>예시 시작\u003c/span>\u003cb>For example, (5)\u003c/b>\u003cspan>세부 예시 추가\u003c/span>\u003cb>With the help of (6)\u003c/b>\u003cspan>원인과 결과 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">big data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a database\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this database\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 핵심 주장을 먼저 말하고 예시를 드는 두괄식 구조를 취하고 있어요. 전개 방식으로는 예시를 활용하고 있는데, 빅데이터의 장점이라는 추상적인 개념을 독일 축구팀이라는 구체적인 사례로 증명하고 있습니다.","hl":"ty"},{"n":8,"text":"신호어를 살펴보면 두 번째 문장의 Well을 통해 분위기를 전환하며 주제를 강조하고 있고, 세 번째 문장의 A famous example is를 통해 본격적으로 사례를 시작합니다. 또한 다섯 번째 문장의 For example은 더 구체적인 분석 내용을 보여주고, 마지막 문장의 With the help of는 데이터가 우승의 원인이 되었음을 명확히 보여주죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경기력, 성과\u003c/span>\u003c/div>\u003cdiv>\u003cb ss=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">엄청난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">vast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collect\u003c/b>\u003cspan class=\"m\">수집하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">accumulate\u003c/span>\u003cspan class=\"s\">assemble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">distribute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exciting\u003c/b>\u003cspan class=\"m\">흥미진진한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilling\u003c/span>\u003cspan class=\"s\">exhilarating\u003c/span>\u003cspan class=\"s\">interesting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">performance\u003c/b>\u003cspan class=\"m\">경기력/실적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">execution\u003c/span>\u003cspan class=\"s\">feat\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어도 정리해 볼까요? 향상시키다라는 뜻의 improve는 enhance나 boost로 바꿔 쓸 수 있어요. 엄청난이라는 뜻의 huge는 enormous 또는 massive와
