 모아 분석하는 것을 말해요. 마치 비가 오기 전에 습도가 높아지는 징후를 보고 일기예보를 하듯이, 사람들이 약국에서 감기약을 사거나 인터넷에 증상을 검색하는 데이터 패턴(Data pattern)을 분석하면 질병의 확산을 미리 예측할 수 있답니다. 이렇게 방대한 자료를 활용하는 데이터 분석(Data analysis) 기술은 오늘날 우리 사회의 보건과 안전을 지키는 데 아주 중요한 역할을 하고 있어요. 결국 우리가 인터넷에서 무심코 남기는 정보들이 모여 질병 예측(Disease forecast)이라는 놀라운 과학적 성과를 만들어내는 셈이죠!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01질병 예측의 등장</div><ul><li>날씨를 예보하듯이 이제는 빅데이터를 활용해 질병을 미리 예측할 수 있게 되었다.</li><li>전문가들은 날씨 예보와 유사한 방식으로 질병을 예측함</li><li>예측의 핵심 도구: 빅데이터(big data)</li><li>핵심 키워드: 질병 예측(disease forecast)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02데이터 수집의 과정</div><ul><li>사람들의 일상적인 행동이 예측을 위한 유용한 자료로 활용된다.</li><li>독감 유행 시기에는 약국에서 독감약 판매량이 증가함</li><li>인터넷 검색창을 통해 독감 증상을 알아보는 사람들이 많아짐</li><li>핵심 키워드: 증상(symptoms)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03빅데이터의 활용 효과</div><ul><li>수집된 자료를 지혜롭게 분석하면 질병의 확산을 미리 파악할 수 있다.</li><li>축적된 데이터를 분석하여 미래 상황을 예측함</li><li>독감의 확산(spread) 정도를 미리 계산 가능</li><li>핵심 키워드: 분석(analyzed)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forecast</td><td class=\"m\">예측하다</td></tr><tr><td class=\"w\">health professional</td><td class=\"m\">보건 전문가</td></tr><tr><td class=\"w\">weather expert</td><td class=\"m\">기상 전문가</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">big data</td><td class=\"m\">빅데이터</td></tr><tr><td class=\"w\">flu</td><td class=\"m\">독감</td></tr><tr><td class=\"w\">season</td><td class=\"m\">시기, 계절</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">medicine</td><td class=\"m\">약</td></tr><tr><td class=\"w\">search</td><td class=\"m\">검색하다</td></tr><tr><td class=\"w\">symptom</td><td class=\"m\">증상</td></tr><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">wisely</td><td class=\"m\">지혜롭게, 현명하게</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">확산, 퍼짐</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 알고 있었는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건강 전문가들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> health professionals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제 질병을 예측할 수 있다는 것을</span><span class=\"en\"><b>can now forecast a disease</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨 전문가들이 ~하는 것과 똑같이</span><span class=\"en\"><b>just as weather experts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨를 예측하는</span><span class=\"en\"><b>forecast the weather?</b></span></div></div><div class=\"lec-sent-ko\">당신은 날씨 전문가들이 날씨를 예측하는 것과 같이 현재 건강 전문가들이 질병을 예측할 수 있다는 것을 알고 있었는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 질병 예보라는 새로운 개념을 독자들에게 소개합니다. forecast는 사전적으로 &#39;예보하다&#39;라는 뜻인데, 여기서는 단순히 추측하는 것이 아니라 기상 예보처럼 데이터를 기반으로 미래 상황을 미리 파악한다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you know that (간접의문문): &#39;Did you know&#39;와 같이 질문을 던지는 주절 뒤에, 의문사(의문사절)나 명사절이 연결되어 문장 성분으로 쓰이는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forecast</td><td class=\"m\">예측하다</td></tr><tr><td class=\"w\">health professional</td><td class=\"m\">보건 전문가</td></tr><tr><td class=\"w\">weather expert</td><td class=\"m\">기상 전문가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 가능하다</span><span class=\"en\"><b>This is <span class=\"grammar-hl\">possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 덕분에</span><span class=\"en\"><b>thanks to big data.</b></span></div></div><div class=\"lec-sent-ko\">이것은 빅데이터 덕분에 가능하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 &#39;질병 예보&#39;가 실현 가능한 이유를 밝힙니다. thanks to는 &#39;~덕분에&#39;라는 긍정적인 의미인데, 기술의 발전이 인류에게 주는 유익함을 나타내기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">possible 5형식(SVOC) 구조: &#39;This is possible(보어) thanks to(전치사구)&#39; 형태로, 형용사 possible이 주격 보어 역할을 하여 주어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">big data</td><td class=\"m\">빅데이터</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독감의 계절이 오면,</span><span class=\"en\"><b><span class=\"grammar-hl\">when the flu season comes</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 구입할 것이다</span><span class=\"en\"><b>people will buy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 독감 약을</span><span class=\"en\"><b>more flu medicine.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 독감의 계절이 오면 사람들은 독감 약을 더 많이 구입할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빅데이터가 구체적으로 어떻게 작동하는지 보여주는 첫 번째 사례입니다. 2번 문장의 &#39;빅데이터&#39;라는 추상적 개념을 실생활 속 소비 행동이라는 구체적 예시로 풀어내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when the flu season comes 현재분사(분사구문 아님/절): &#39;when&#39;은 접속사로, &#39;the flu season(주어) comes(동사)&#39;로 이루어진 시간의 부사절을 이끕니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flu</td><td class=\"m\">독감</td></tr><tr><td class=\"w\">season</td><td class=\"m\">시기, 계절</td></tr><tr><td class=\"w\">medicine</td><td class=\"m\">약</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 온라인에서 검색할 것이다</span><span class=\"en\"><b>They will also <span class=\"grammar-hl\">search online</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독감 증상에 대해</span><span class=\"en\"><b>about flu symptoms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많이</span><span class=\"en\"><b>more.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 온라인상에서 독감 증상에 대해 더 많이 검색해 볼 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빅데이터를 구성하는 두 번째 사례를 제시합니다. 구매 데이터뿐만 아니라 온라인 검색 데이터도 질병 확산을 예측하는 중요한 근거가 됨을 보여주며 앞 문장과 내용을 이어가고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">search online (관용표현): &#39;search online&#39;은 인터넷상에서 정보를 찾거나 검색하는 행위를 나타내는 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flu</td><td class=\"m\">독감</td></tr><tr><td class=\"w\">search</td><td class=\"m\">검색하다</td></tr><tr><td class=\"w\">symptom</td><td class=\"m\">증상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 이런 종류의 데이터가</span><span class=\"en\"><b>If this kind of data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명하게 분석된다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">is analyzed</span> wisely,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독감의 확산은</span><span class=\"en\"><b>the spread of the flu</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측될 수 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can be predicted</span>.</b></span></div></div><div class=\"lec-sent-ko\">이런 종류의 데이터가 현명하게 분석된다면, 독감의 확산을 예측할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 사례들을 종합하여 결론을 내립니다. wisely는 사전적으로 &#39;현명하게&#39;라는 뜻인데, 여기서는 데이터 자체가 아니라 데이터를 어떻게 해석하고 활용하느냐가 핵심임을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is analyzed (수동태): be동사(is)+p.p.(analyzed) 구조. analyze는 타동사인데 목적어가 없어서 수동구조 is analyzed 형태로 쓴다. 기본구조: V + O(목적어).</div><div class=\"lec-gr-item\">can be predicted (수동태): be동사(be)+p.p.(predicted) 구조. predict는 타동사인데 목적어가 없어서 수동구조 be predicted 형태로 쓴다. 기본구조: V + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flu</td><td class=\"m\">독감</td></tr><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">wisely</td><td class=\"m\">지혜롭게, 현명하게</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">확산, 퍼짐</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>이제는 기상 예보처럼 빅데이터를 활용해 질병을 미리 예측할 수 있다.</li><li>독감 유행 시기에는 약 구매량이나 온라인 검색량이 늘어난다.</li><li>이러한 데이터를 스마트하게 분석하면 질병의 확산 경로를 미리 파악할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Health experts forecast disease outbreaks by analyzing big data, because patterns in online searches and medicine purchases provide valuable information.</div>\n              <div class=\"lec-final-sum-ko\">온라인 검색과 의약품 구매 패턴이 유용한 정보를 제공하기 때문에, 보건 전문가들은 빅데이터를 분석하여 질병 발생을 예측한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}functio
