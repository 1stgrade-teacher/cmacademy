@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 7과 본문4","audioDir":"4_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>7과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Big Data: A New Shield for Crime Prevention\u003c/h1>\u003ch2>빅데이터: 범죄 예방을 위한 새로운 방패\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">빅데이터\u003c/b>를 활용하여 범죄 발생 가능성을 미리 \u003cb class=\"key\">예측\u003c/b>하고 지도를 제작함으로써, 효과적으로 범죄를 \u003cb class=\"key\">예방\u003c/b>하고 안전한 미래를 만들 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>By analyzing big data to predict and prevent crimes, we can significantly enhance public safety and witness the growing influence of data in our future lives.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 우리는 빅데이터가 우리 사회를 어떻게 더 안전하게 지켜주는지, 그리고 그 미래는 어떠할지 함께 살펴볼 거예요. 이번 지문은 빅데이터 분석을 통한 범죄 예방이라는 아주 흥미로운 사례를 다루고 있죠. 데이터가 어떻게 범죄를 예측하고 우리 삶을 변화시키는지 그 요지를 잘 파악해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">빅데이터\u003c/b>는 단순한 정보의 집합을 넘어, 방대한 양의 데이터에서 유의미한 패턴을 찾아내는 기술을 의미합니다. 과거에는 범죄가 발생한 후에 수사를 시작했지만, 이제는 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">분석\u003c/b>(data-driven analysis)을 통해 범죄 발생 가능성을 미리 차단합니다. 이는 마치 일기예보가 과거 기상 데이터를 바탕으로 내일의 날씨를 맞히는 것과 비슷한 원리입니다. 경찰은 이러한 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">치안\u003c/b>(predictive policing)을 통해 한정된 인력을 효율적으로 배치할 수 있습니다. 현대 사회에서 데이터는 '21세기의 \u003cb class=\"key\">원유\u003c/b>'라고 불릴 만큼 강력한 힘을 발휘하며 사회 전반을 변화시키고 있습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 일기예보가 어떻게 내일 비가 올지 아는지 궁금해 본 적 있나요? 바로 과거의 수많은 날씨 데이터를 분석해서 일정한 패턴을 찾아내기 때문이에요. 빅데이터도 마찬가지로 엄청난 양의 정보를 분석해서 다음에 일어날 일을 미리 알려주는 현대판 예언자 같은 역할을 한답니다. 특히 경찰이 사용하는 예측 치안 기술은 범죄를 사전에 차단하는 데 아주 큰 도움을 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>범죄 예측의 도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>빅데이터 덕분에 경찰이 범죄 발생 전에 이를 \u003cb class=\"key\">예측\u003c/b>할 수 있게 되었음을 밝힙니다. 구체적으로 범죄의 유형, 시간, 장소 데이터를 분석하여 \u003cb class=\"key\">범죄 \u003c/b>\u003cb class=\"key\">다발 \u003c/b>\u003cb class=\"key\">지역\u003c/b> 지도를 제작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>예측 지도의 활용\u003csmall>원리 및 적용 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이 지도가 범죄 발생 가능성이 높은 \u003cb class=\"key\">시간과 \u003c/b>\u003cb class=\"key\">장소\u003c/b>를 식별해 줍니다. 경찰은 지도가 예측한 특정 영역에 \u003cb class=\"key\">수사력을 \u003c/b>\u003cb class=\"key\">집중\u003c/b>함으로써 추가 범죄를 예방합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>미래에 대한 전망\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>빅데이터가 이미 세상을 크게 변화시켰으며, 앞으로 \u003cb class=\"key\">산업의 \u003c/b>\u003cb class=\"key\">방향\u003c/b>에 대해 질문을 던집니다. 전문가들은 빅데이터가 우리 삶에서 \u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 할 것이라고 확신합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 보면, 빅데이터가 범죄를 예측하는 구체적인 방법에서 시작해서 미래의 비전까지 자연스럽게 이어지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 빅데이터 덕분에 경찰이 범죄 발생 전 예측이 가능해졌음을 말해요. 범죄의 유형과 시간, 장소를 분석해서 소위 핫스팟이라고 불리는 범죄 다발 지역 지도를 만든다는 점이 핵심이죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 이 지도가 실제로 어떻게 쓰이는지 보여줘요. 지도가 알려주는 시간과 장소에 경찰력을 집중 배치함으로써 추가적인 범죄를 효과적으로 예방하는 과정을 설명하고 있습니다.","hl":"f1"},{"n":6,"text":"마지막 다섯 번째부터 일곱 번째 문장에서는 시야를 넓혀 빅데이터 산업 전체를 바라봐요. 이미 세상을 크게 바꾼 빅데이터가 앞으로 우리 삶에서 점점 더 중요한 역할을 하게 될 것이라는 전문가들의 의견으로 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 및 전망\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부에서는 범죄라는 사회적 문제를 빅데이터로 해결하는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 제시합니다. 후반부에서는 이러한 성공적인 사례를 바탕으로 빅데이터가 미래에 가질 \u003cb class=\"key\">영향력과 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 강조하고 있습니다. 따라서 초반의 핵심 주제가 후반부의 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">전망\u003c/b>으로 확장되는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Thanks to (1)\u003c/b>\u003cspan>원인과 결과의 시작\u003c/span>\u003cb>Through (2)\u003c/b>\u003cspan>수단과 방법 제시\u003c/span>\u003cb>So where (6)\u003c/b>\u003cspan>화제 전환을 위한 질문\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">big data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the analysis of big data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">map of crime hot spots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this map\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">big data industry\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 빅데이터라는 수단이 범죄 예방이라는 문제를 해결하는 과정을 보여주는 문제 해결 구조를 취하고 있어요. 전반부에서 구체적인 사례를 들고 후반부에서 전체적인 결론을 내리는 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"첫 번째 문장에 나오는 Thanks to big data라는 표현은 빅데이터가 모든 변화의 원인임을 알려주는 신호예요. 그리고 여섯 번째 문장의 질문인 So where will the big data industry go from here는 글의 화제를 구체적 사례에서 미래의 전망으로 전환하는 아주 중요한 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>prevention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예방\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u00  빅데이터 덕분에. police can now predict crime, 경찰은 이제 범죄를 예측할 수 있다. before it happens, 그것이 발생하기 전에.. 이 문장 전체를 해석하면, 범죄 예방 빅데이터 덕분에 경찰은 이제 범죄가 발생하기 전에 그 범죄를 예측할 수 있다.","hl":"m"},{"n":12,"text":"빅데이터가 우리 삶을 어떻게 바꾸고 있는지 보여주는 첫 번째 구체적인 예시예요. 바로 범죄 예방 분야에서 경찰이 미리 범죄를 예측할 수 있게 되었다는 점을 강조하고 있죠.","hl":"mn"},{"n":13,"text":"첫 번째로 Thanks to는 전치사구로 뒤에 명사가 오며 긍정적인 이유를 나타내요. 두 번째로 before it happens에서 it은 단수 명사인 crime을 가리키는 대명사라는 점에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빅데이터 분석을 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Through\u003c/span> the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">analysis\u003c/span> of big data\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">범죄의 유형, 시간 및 장소에 관한,\u003c/span>\u003cspan class=\"en\">about the type, time and place of crime,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경찰은 지도를 만들 수 있다\u003c/span>\u003cspan class=\"en\">police can make a map\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">범죄 다발 지역의.\u003c/span>\u003cspan class=\"en\">of crime hot spots.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">범죄의 유형, 시간 및 장소에 관한 빅데이터 분석을 통해, 경찰은 범죄 다발 지역의 지도를 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경찰이 범죄를 예측하기 위해 구체적으로 어떤 \u003cb class=\"key\">데이터\u003c/b>를 활용하며, 그 결과물로 무엇을 만드는지 \u003cb class=\"key\">과정\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수단·방법의 전치사\u003c/span> : Through + [명사(구)] : \"~을 통해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사구 구조\u003c/span> : the [analysi lass=\"ko\">우리 삶에서.\u003c/span>\u003cspan class=\"en\">in our lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누구도 확실히 알지는 못하지만, 전문가들은 빅데이터가 우리 삶에서 더욱 더 중요한 역할을 할 것이라는 데에는 동의한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빅데이터의 구체적인 미래를 단정할 수는 없지만, 사회 전반에서 그 \u003cb class=\"key\">영향력\u003c/b>이 계속해서 \u003cb class=\"key\">확대\u003c/b>될 것임을 시사하며 글을 마무리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절\u003c/span> : agree [동사] + that [접속사] + S + V [목적어 역할 명사절] : \"~라는 점에 동의한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : [비교급] + and + [비교급] : \"더욱 더 중요한\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Nobody knows for sure, 누구도 확실히 알지는 못하지만. but experts agree, 전문가들은 동의한다. that big data will play, 빅데이터가 할 것이라는 점에. a more and more important role, 더욱 더 중요한 역할을. in our lives, 우리 삶에서.. 이 문장 전체를 해석하면, 누구도 확실히 알지는 못하지만, 전문가들은 빅데이터가 우리 삶에서 더욱 더 중요한 역할을 할 것이라는 데에는 동의한다.","hl":"m"},{"n":30,"text":"미래의 빅데이터 산업이 어디까지 갈지는 아무도 장담할 수 없어요. 하지만 전문가들의 공통된 의견은 우리 일상에서 빅데이터가 차지하는 비중이 날이 갈수록 커질 것이라는 점이죠.","hl":"mn"},{"n":31,"text":"첫 번째로 동사 agree 뒤에 나온 that을 살펴볼까요? 이 that은 명사절을 이끄는 접속사로 뒤에 오는 긴 문장 전체를 하나의 목적어 덩어리로 만들어 줍니다. 두 번째로 more and more important라는 표현은 비교급 두 개를 나란히 써서 중요성이 점점 더 커지고 있음을 강하게 보여주는 강조 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>경찰은 \u003cb class=\"key\">빅데이터 \u003c/b>\u003cb class=\"key\">분석\u003c/b>을 통해 범죄가 발생하기 전 시점과 장소를 미리 \u003cb class=\"key\">예측\u003c/b>할 수 있습니다.\u003c/li>\u003cli>과거 범죄 데이터를 기반으로 제작된 \u003cb class=\"key\">핫스팟 \u003c/b>\u003cb class=\"key\">지도\u003c/b>는 범죄 예방을 위한 핵심적인 도구로 활용됩니다.\u003c/li>\u003cli>예측된 지역과 시간에 맞춰 치안 활동을 \u003cb class=\"key\">집중\u003c/b>함으로써 추가적인 범죄 발생을 효과적으로 \u003cb class=\"key\">차단\u003c/b>합니다.\u003c/li>\u003cli>빅데이터는 이미 세상을 크게 바꾸었으며, 미래에는 우리 삶에서 \u003cb class=\"key\">더욱 \u003c/b>\u003cb class=\"key\">핵심적인 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 담당하게 될 것입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>By analyzing big data to predict and prevent crimes, we can significantly enhance public safety and witness the growing influence of data in our future lives.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">빅데이터\u003c/b>를 활용하여 범죄 발생 가능성을 미리 \u003cb class=\"key\">예측\u003c/b>하고 지도를 제작함으로써, 효과적으로 범죄를 \u003cb class=\"key\">예방\u003c/b>하고 안전한 미래를 만들 수 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"오늘 배운 것처럼 빅데이터는 단순한 정보의 더미가 아니라 우리 삶을 안전하게 지켜주는 든든한 방패 역할을 하고 있어요. 앞으로 이 분야가 얼마나 더 발전할지 기대하며, 오늘 배운 핵심 표현들과 지문의 흐름을 꼭 복습해 보길 바라요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
