준답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01빅데이터의 등장</div><ul><li>빅데이터 기술이 스포츠 분야에 도입되어 선수들의 기량을 높이고 경기를 더욱 흥미롭게 만들고 있다.</li><li>스포츠(sports)와 데이터의 결합</li><li>선수들의 경기력 향상(improving performance)</li><li>핵심 키워드: 빅데이터(big data)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02독일 축구팀의 사례</div><ul><li>독일 국가대표 축구팀은 방대한 데이터를 수집하고 분석하여 구체적인 데이터베이스를 구축했다.</li><li>선수들에 관한 엄청난 양의 정보(huge amount of data) 수집</li><li>각 선수의 이동 거리 및 공 소유 시간(ball possession) 기록</li><li>핵심 키워드: 데이터베이스(database)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03성과 및 결과</div><ul><li>데이터 분석을 통해 얻은 전략적 도움으로 독일 대표팀은 실제 경기에서 우수한 성과를 거두었다.</li><li>데이터 기반의 경기력(performance) 개선</li><li>2014년 월드컵 우승(World Cup) 달성</li><li>핵심 키워드: 승리(win)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">향상시키다, 개선하다</td></tr><tr><td class=\"w\">performance</td><td class=\"m\">경기력, 수행</td></tr><tr><td class=\"w\">big data</td><td class=\"m\">빅데이터</td></tr><tr><td class=\"w\">exciting</td><td class=\"m\">흥미진진한</td></tr><tr><td class=\"w\">example</td><td class=\"m\">예, 사례</td></tr><tr><td class=\"w\">national</td><td class=\"m\">국가의, 전국적인</td></tr><tr><td class=\"w\">build</td><td class=\"m\">구축하다, 만들다</td></tr><tr><td class=\"w\">database</td><td class=\"m\">데이터베이스</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">collect</td><td class=\"m\">수집하다, 모으다</td></tr><tr><td class=\"w\">analyze</td><td class=\"m\">분석하다</td></tr><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 막대한</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr><tr><td class=\"w\">include</td><td class=\"m\">포함하다</td></tr><tr><td class=\"w\">information</td><td class=\"m\">정보</td></tr><tr><td class=\"w\">with the help of</td><td class=\"m\">~의 도움으로</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경기력 향상을</span><span class=\"en\"><b><span class=\"grammar-hl\">Improving</span> Performance in Sports</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠에서의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(스포츠에서의 경기력 향상)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 글의 주제인 스포츠에 대한 관심을 환기하며 자연스럽게 본론으로 이끄는 도입부 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Improving (동명사): 문장의 맨 앞에서 &#39;향상시키는 것&#39;이라는 의미로 주어 역할을 수행하는 명사적 개념의 -ing 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">performance</td><td class=\"m\">경기력, 수행</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 ~인가</span><span class=\"en\"><b><span class=\"grammar-hl\">Are you a sports fan?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 팬인가?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">당신은 스포츠 팬인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 글의 주제인 스포츠에 대한 관심을 환기하며 자연스럽게 본론으로 이끄는 도입부 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Are you a sports fan? (의문문): be동사(Are)가 주어(you) 앞으로 도치되어 질문을 형성하는 기본 의문문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"><b>big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">향상하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is improving</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들의 경기력을</span><span class=\"en\"><b>the performance of players,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠를 ~하게 만들면서</span><span class=\"en\"><b><span class=\"grammar-hl\">making sports</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 흥미진진하게</span><span class=\"en\"><b><span class=\"grammar-hl\">more exciting</span>.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 스포츠를 더 흥미진진하게 만들면서 선수들의 경기력을 향상하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주제를 제시합니다. improving은 사전적으로는 &#39;개선하다&#39;인데, 여기서는 스포츠 경기 결과나 선수들의 기량을 수치적으로 증명하고 효율을 높여가는 과정을 의미합니다. 단순히 더 좋아지는 것을 넘어, 데이터를 통해 체계적인 발전을 꾀한다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is improving (현재진행): be동사(is) + -ing(improving)의 형태로 &#39;향상시키고 있는 중이다&#39;라는 동작의 진행을 나타내는 구조입니다.</div><div class=\"lec-gr-item\">making (현재분사): 분사구문으로 쓰여 &#39;스포츠를 더 흥미롭게 만들면서&#39;와 같은 동시동작을 나타냅니다. 원래 절로 바꾸면 &#39;as it makes&#39;로 변환 가능합니다.</div><div class=\"lec-gr-item\">making sports more exciting 5형식(SVOC) 구조: make(동사) + sports(목적어) + more exciting(목적보어) 구조로, 목적어의 상태를 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">performance</td><td class=\"m\">경기력, 수행</td></tr><tr><td class=\"w\">big data</td><td class=\"m\">빅데이터</td></tr><tr><td class=\"w\">exciting</td><td class=\"m\">흥미진진한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 유명한 사례가 독일 국가 대표 축구팀이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">A famous example</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>Germany’s national soccer team.</b></span></div></div><div class=\"lec-sent-ko\">한 유명한 사례가 독일 국가 대표 축구팀이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;빅데이터가 경기력을 향상시킨다&#39;는 일반적인 주장을 뒷받침하기 위해 구체적인 사례(독일 대표팀)를 도입하는 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A famous example (관용표현): &#39;유명한 사례&#39;라는 뜻의 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">example</td><td class=\"m\">예, 사례</td></tr><tr><td class=\"w\">national</td><td class=\"m\">국가의, 전국적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 팀은</span><span class=\"en\"><b>The team</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데이터베이스를 구축했다</span><span class=\"en\"><b>built a database</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모으고 분석함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">collecting and analyzing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄청난 양의 데이터를</span><span class=\"en\"><b>a huge amount of data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들에 관한</span><span class=\"en\"><b>on players.</b></span></div></div><div class=\"lec-sent-ko\">그 팀은 선수들에 관한 엄청난 양의 데이터를 모으고 분석함으로써 데이터베이스를 구축했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독일 팀이 실제로 어떤 방식을 취했는지 구체적인 방법을 설명합니다. built는 사전적으로는 &#39;건물을 짓다&#39;이지만, 여기서는 보이지 않는 정보를 체계적으로 모아 활용 가능한 시스템으로 만들었다는 뜻입니다. 정보가 흩어져 있으면 의미가 없기에, 이를 &#39;기반(base)&#39;으로 만들었다는 의도를 담아 표현했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">collecting and analyzing (동명사): 전치사(by)의 목적어로 쓰인 -ing 형태이며, &#39;데이터를 수집하고 분석하는 것&#39;이라는 행위를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">database</td><td class=\"m\">데이터베이스</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">수집하다, 모으다</td></tr><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 막대한</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 데이터는</span><span class=\"en\"><b>the data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포함했다</span><span class=\"en\"><b>included</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를 ~에 관한</span><span class=\"en\"><b><span class=\"grammar-hl\">information about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각의 선수들이 얼마나 많이 달렸고</span><span class=\"en\"><b><span class=\"grammar-hl\">how much each player ran</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 얼마나 오랫동안</span><span class=\"en\"><b>and <span class=\"grammar-hl\">how long</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 공을 갖고 있었는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">he had the ball</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 그 데이터는 각각의 선수들이 얼마나 많이 달렸고, 얼마나 오랫동안 공을
