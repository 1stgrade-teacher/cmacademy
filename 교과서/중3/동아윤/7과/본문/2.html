구체적으로 어떻게 우리 삶에 녹아들어 있는지 확인해 볼까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01빅데이터의 영향력</div><ul><li>빅데이터는 현대 사회의 거의 모든 영역에 깊숙이 관여하고 있습니다.</li><li>우리 삶의 전반적인 부분에 영향을 미침 (influence)</li><li>일상생활의 광범위한 영역에 걸쳐 존재함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기업의 활용</div><ul><li>기업은 빅데이터를 분석하여 마케팅과 매출 증대 전략을 세웁니다.</li><li>고객의 요구 사항을 더 잘 이해함 (understand customers&#39; needs)</li><li>상품 판매량을 늘리는 데 도움을 줌 (sell more products)</li><li>핵심 키워드: 빅데이터(big data), 기업(companies)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03개인의 활용</div><ul><li>개인들은 빅데이터를 통해 일상 속에서 편의를 얻을 수 있습니다.</li><li>교통 체증을 피하는 데 유용함 (avoid heavy traffic)</li><li>일상적인 불편함을 해결하는 실질적 도구로 사용됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04무한한 가능성</div><ul><li>빅데이터의 활용 범위는 앞으로도 계속 확대될 것입니다.</li><li>사용 범위가 무궁무진함 (endless)</li><li>앞으로 다양한 흥미로운 사례가 등장할 것임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다</td></tr><tr><td class=\"w\">almost</td><td class=\"m\">거의</td></tr><tr><td class=\"w\">company</td><td class=\"m\">회사, 기업</td></tr><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">customer</td><td class=\"m\">고객</td></tr><tr><td class=\"w\">need</td><td class=\"m\">필요(성), 요구</td></tr><tr><td class=\"w\">product</td><td class=\"m\">상품, 제품</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">heavy</td><td class=\"m\">많은, 심한 (교통량 등이)</td></tr><tr><td class=\"w\">traffic</td><td class=\"m\">교통(량)</td></tr><tr><td class=\"w\">use</td><td class=\"m\">용도, 사용</td></tr><tr><td class=\"w\">endless</td><td class=\"m\">끝없는, 무한한</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr><tr><td class=\"w\">example</td><td class=\"m\">예시, 사례</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게 빅데이터는</span><span class=\"en\"><b><span class=\"grammar-hl\">How is big data</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미치고 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">influencing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 삶에?</span><span class=\"en\"><b>our lives?</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 우리 삶에 어떻게 영향을 미치고 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 독자에게 질문을 던져 빅데이터가 우리 일상과 얼마나 밀접한 관련이 있는지 주의를 환기합니다. 여기서 influencing은 사전적으로는 &#39;영향을 주다&#39;이지만, 문맥상 &#39;변화를 주도하고 작용하다&#39;는 능동적인 의미로 쓰였습니다. 단순히 스쳐 지나가는 영향이 아니라 우리 삶의 방식을 바꾸고 있다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How is big data influencing (간접의문문): 의문사(How) + be동사(is) + 주어(big data) + 현재진행(-ing) 구조의 의문문입니다. 진행형은 be동사 + 현재분사(-ing) 형태로 &#39;~하는 중이다&#39;라는 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"><b>Big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미치고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is influencing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 모든 부분에</span><span class=\"en\"><b>almost all parts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 삶의</span><span class=\"en\"><b>of our lives.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 우리 삶의 거의 모든 부분에 영향을 미치고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 핵심 답변입니다. &#39;거의 모든 부분&#39;이라는 표현을 통해 빅데이터의 광범위한 영향력을 강조하며, 앞으로 이어질 구체적인 사례들의 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is influencing (현재진행): be동사(is) + 현재분사(influencing) 구조로, 현재 어떤 동작이 진행 중임을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">almost</td><td class=\"m\">거의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 회사들이 돕는다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">helps companies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 고객의 필요를</span><span class=\"en\"><b>their customers’ needs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘</span><span class=\"en\"><b>better</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들을 돕는다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">helps them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 상품을 팔도록</span><span class=\"en\"><b><span class=\"grammar-hl\">sell</span> more products.</b></span></div></div><div class=\"lec-sent-ko\">그것은 회사들이 소비자들이 필요로 하는 것을 더 잘 이해하고 더 많은 상품을 팔도록 도와준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빅데이터가 구체적으로 어떻게 활용되는지 첫 번째 사례를 제시합니다. &#39;고객의 요구&#39;를 파악하는 것이 곧 매출 증대라는 결과로 이어진다는 논리적 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps companies understand 5형식(SVOC) 구조: help + 목적어(companies) + 목적보어(understand)의 형태입니다. help는 목적보어 자리에 동사원형이나 to부정사를 취하며, 여기서는 동사원형 understand를 사용했습니다.</div><div class=\"lec-gr-item\">helps them sell 5형식(SVOC) 구조: help + 목적어(them) + 목적보어(sell)의 형태입니다. 앞선 문장과 마찬가지로 help가 목적보어로 동사원형을 취하는 5형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">understand</td><td class=\"m\">이해하다</td></tr><tr><td class=\"w\">customer</td><td class=\"m\">고객</td></tr><tr><td class=\"w\">need</td><td class=\"m\">필요(성), 요구</td></tr><tr><td class=\"w\">product</td><td class=\"m\">상품, 제품</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 사람들이 돕는다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">helps people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">avoid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심한 교통 체증을</span><span class=\"en\"><b>heavy traffic.</b></span></div></div><div class=\"lec-sent-ko\">그것은 사람들이 교통 체증을 피하도록 도와준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상생활에서의 두 번째 활용 사례를 제시합니다. 여기서 heavy는 사전적으로 &#39;무거운&#39;이라는 뜻이지만, 교통량과 관련해서는 &#39;정체가 심한&#39;이라는 의미로 사용되었습니다. 도로에 차량이 가득 차서 움직이기 어려운 상황을 &#39;무겁다&#39;는 비유를 통해 효과적으로 전달하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps people avoid 5형식(SVOC) 구조: help + 목적어(people) + 목적보어(avoid)의 형태입니다. help는 목적보어로 동사원형을 취할 수 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">avoid</td><td class=\"m\">피하다</td></tr><tr><td class=\"w\">heavy</td><td class=\"m\">많은, 심한 (교통량 등이)</td></tr><tr><td class=\"w\">traffic</td><td class=\"m\">교통(량)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것의 쓰임은</span><span class=\"en\"><b>Its uses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끝이 없다,</span><span class=\"en\"><b>are endless,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 여기에</span><span class=\"en\"><b>and here</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다 몇 가지 흥미로운 예들이</span><span class=\"en\"><b>are some <span class=\"grammar-hl\">interesting examples</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것의 쓰임은 끝이 없는데, 여기 몇 가지 흥미로운 예들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 언급한 사례 외에도 활용 분야가 매우 넓음을 강조하며, 앞으로 이어질 내용에 대해 독자의 흥미를 유발하며 글을 전개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">interesting examples (현재분사(형용사)): interesting이 명사 examples를 수식합니다. examples가 사람들에게 흥미를 주는 상태임을 나타내며, &#39;-ing + 명사&#39;가 &#39;…하는(상태인) N&#39;으로 해석되는 현재분사의 수식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">use</td><td class=\"m\">용도, 사용</td></tr><tr><td class=\"w\">endless</td><td class=\"m\">끝없는, 무한한</td></tr><tr><td class=\"w\">interesting</td><td class=\"m\">흥미로운</td></tr><tr><td class=\"w\">example</td><td class=\"m\">예시, 사례</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>빅데이터는 우리 삶 전반에 걸쳐 강력한 영향을 미치고 있다.</li><li>기업들은 빅데이터를 활용해 고객의 니즈를 파악하고 매출을 올린다.</li><li>일반인들은 빅데이터를 이용해 교통 체증 같은 불편함을 피할 수 있다.</li><li>빅데이터의 활용 범위는 무궁무진하며 우리 일상 곳곳에 녹아 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Big data influences nearly every aspect of our lives by helping companies improve sales, and it assists people in navigating their daily routines more efficiently.</div>\n              <div class=\"lec-final-sum-ko\">빅데이터는 기업의 매출 증대를 도움으로써 우리 삶의 거의 모든 부분에 영향을 미치며, 사람들이 일상을 더 효율적으로 운영하도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){
