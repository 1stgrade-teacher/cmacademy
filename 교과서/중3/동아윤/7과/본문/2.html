<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 동아(윤) 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 동아(윤) 7과 본문2","audioDir":"2_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중3\u003cbr>동아(윤)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Power of Big Data: From Business to Disease Forecasting\u003c/h1>\u003ch2>빅데이터의 힘: 비즈니스에서 질병 예측까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">빅데이터\u003c/b>는 기업 마케팅과 교통 정보뿐만 아니라, 약 구매 및 검색 데이터를 통해 \u003cb class=\"key\">질병의 \u003c/b>\u003cb class=\"key\">확산\u003c/b>을 예측하는 등 우리 삶 전반에 걸쳐 광범위한 영향을 미칩니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Big data significantly influences various aspects of our lives, ranging from improving business efficiency to predicting disease outbreaks through systematic data analysis.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리 시대의 가장 강력한 도구인 빅데이터가 우리 삶을 어떻게 바꾸고 있는지 함께 알아보겠습니다. 이 글은 빅데이터의 광범위한 영향력과 특히 질병 예측에서의 놀라운 성과를 다루고 있어요. 빅데이터가 단순히 정보의 나열이 아니라 어떻게 우리의 생명과 안전을 지키는지 요지를 파악하며 따라오세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">빅데이터는 단순히 양이 많은 정보가 아니라, 복잡한 데이터 속에서 가치 있는 정보를 추출하는 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">과학(Data \u003c/b>\u003cb class=\"key\">Science)\u003c/b>의 핵심 도구입니다. 디지털 기기를 사용하며 남기는 모든 흔적인 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">발자국(Digital \u003c/b>\u003cb class=\"key\">Footprint)\u003c/b>은 개인의 행동 패턴을 보여주는 중요한 자료가 됩니다. 일상에 비유하자면, 도서관의 수만 권 대출 기록을 분석해 최근 사람들의 최대 관심사를 알아내는 것과 같습니다. 고등 과정에서는 이처럼 파편화된 \u003cb class=\"key\">비정형 \u003c/b>\u003cb class=\"key\">데이터(Unstructured \u003c/b>\u003cb class=\"key\">Data)\u003c/b>를 가공하여 미래의 사회적 현상을 통찰하는 능력이 핵심 역량으로 다뤄집니다.\u003c/div>","segs":[{"n":2,"text":"강의에 앞서 배경지식을 좀 쌓아볼까요? 빅데이터는 데이터 과학의 핵심입니다. 우리가 인터넷에서 클릭 한 번, 물건 하나를 살 때마다 디지털 발자국이 남는데, 이걸 모으면 엄청난 정보 집합체가 됩니다. 마치 마트 영수증만 보고도 그 집 식탁에 뭐가 올라오는지 맞히는 것과 비슷하죠. 고등 영어 독해에서도 이런 데이터 분석을 통한 통찰력을 다루는 지문이 자주 나오니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>빅데이터의 영향력\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>질문을 통해 \u003cb class=\"key\">빅데이터\u003c/b>가 우리 삶 전반에 깊숙이 스며들어 있다는 사실을 강조하며 독자의 관심을 유도합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>비즈니스와 일상에서의 활용\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>기업의 \u003cb class=\"key\">이윤 \u003c/b>\u003cb class=\"key\">창출\u003c/b>을 위한 고객 이해와 교통 체증 회피 등 빅데이터가 제공하는 실제적인 도움을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>질병 예측 사례 제시\u003csmall>핵심 사례 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>기상 예보처럼 건강 전문가들이 \u003cb class=\"key\">질병을 \u003c/b>\u003cb class=\"key\">예측\u003c/b>할 수 있게 된 혁신적인 사례를 구체적으로 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>데이터 분석의 원리\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>독감 약 구매나 증상 검색과 같은 데이터를 \u003cb class=\"key\">현명하게 \u003c/b>\u003cb class=\"key\">분석\u003c/b>하면 질병의 확산을 미리 알 수 있다는 원리로 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 빅데이터의 다양한 쓰임을 보여준 뒤, 질병 예측이라는 아주 구체적인 사례로 마무리되는 흐름을 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 질문을 던지며 독자의 관심을 끕니다. 빅데이터가 우리 삶의 거의 모든 부분에 영향을 미치고 있다는 핵심 내용을 바로 선언하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 구체적인 근거를 댑니다. 기업들이 물건을 더 잘 팔게 도와주거나, 우리가 꽉 막힌 도로를 피할 수 있게 해준다는 점을 강조하며 그 쓰임이 끝이 없다고 설명합니다.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장에서는 가장 흥미로운 사례인 질병 예측으로 넘어갑니다. 날씨 전문가처럼 건강 전문가들도 이제 질병을 미리 알 수 있는데, 이게 다 빅데이터 덕분이라는 것이죠.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째 문장부터 열 번째 문장까지는 그 원리를 보여줍니다. 독감 시즌에 사람들이 약을 사고 증상을 검색하는 행동 데이터를 현명하게 분석하면, 독감이 어디로 퍼질지 미리 알 수 있다는 논리적인 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 질문을 던지고, 두 번째 문장에서 빅데이터가 삶의 모든 부분에 영향을 미친다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 바로 제시합니다. 이후 기업, 교통, 질병 예측이라는 세 가지 구체적인 \u003cb class=\"key\">사례(Examples)\u003c/b>를 통해 주장을 논리적으로 뒷받침합니다. 마지막 부분에서는 데이터 분석을 통한 미래 예측이라는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 보여줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>How is (1)\u003c/b>\u003cspan>화제 제시 질문\u003c/span>\u003cb>For example (8)\u003c/b>\u003cspan>구체적 예시 시작\u003c/span>\u003cb>If (10)\u003c/b>\u003cspan>조건을 통한 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Big data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">It\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Its uses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this kind of data\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문에 답하는 형식으로 시작해서 구체적인 사례들을 나열하는 방식입니다. 주제문이 앞부분에 나오는 전형적인 두괄식 구조를 취하고 있어요.","hl":"ty"},{"n":9,"text":"문장 속 신호어를 찾아볼까요? 첫 번째 문장의 How is라는 의문문은 필자가 하고 싶은 이야기를 꺼내는 신호예요. 여덟 번째 문장의 For example은 질병 예측의 원리를 아주 구체적으로 보여주겠다는 약속이죠. 마지막 문장의 If는 조건과 결과를 연결해서 글을 깔끔하게 마무리하는 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>almost\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>company\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회사\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비자, 고객\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필요, 요구\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heavy traffic\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>교통 체증\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰임, 용도\u003c/span>\u003c/div>\u003cdiv>\u003cb>endless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끝없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예, 사례\u003c/span>\u003c/div>\u003cdiv>\u003cb>disease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>forecast\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>health professional\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건강 전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>flu\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독감\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약\u003c/span>\u003c/div>\u003cdiv>\u003cb>search\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검색하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>symptom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증상\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wisely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>현명하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확산\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼게요. influence는 영향을 미치다라는 뜻으로 아주 자주 나옵니다. forecast와 predict는 둘 다 예측하다라는 의미로 이 지문의 핵심 키워드예요. 증상을 뜻하는 symptom과 확산을 뜻하는 spread도 꼭 외워두셔야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forecast\u003c/b>\u003cspan class=\"m\">예측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">predict\u003c/span>\u003cspan class=\"s\">foretell\u003c/span>\u003cspan class=\"s\">anticipate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">endless\u003c/b>\u003cspan class=\"m\">끝없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">infinite\u003c/span>\u003cspan class=\"s\">limitless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">finite\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wisely\u003c/b>\u003cspan class=\"m\">현명하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smartly\u003c/span>\u003cspan class=\"s\">sensibly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolishly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\ div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빅데이터는 ~이다 \u003c/span>\u003cspan class=\"en\">Big data \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 미치고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">influencing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 모든 부분에 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">all\u003c/span> parts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 삶의\u003c/span>\u003cspan class=\"en\">of our lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빅데이터는 우리 삶의 거의 모든 부분에 영향을 미치고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빅데이터가 특정 영역이 아니라 우리 삶의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">부분\u003c/b>에 깊숙이 들어와 있음을 강조합니다. 앞으로 나올 상세 내용의 \u003cb class=\"key\">전제\u003c/b>가 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사(is) + 현재분사(influencing) : \"영향을 미치고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사와 형용사의 수식\u003c/span> : almost(부사) + all(형용사/부정대명사) : \"거의 모든\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Big data is, 빅데이터는 ~이다. influencing, 영향을 미치고. almost all parts, 거의 모든 부분에. of our lives, 우리 삶의. 이 문장 전체를 해석하면, 빅데이터는 우리 삶의 거의 모든 부분에 영향을 미치고 있다.","hl":"m"},{"n":16,"text":"빅데이터가 단순히 기술적인 영역을 넘어서 우리 일상의 아주 사소한 부분까지 모두 연결되어 있다는 점을 말해주고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째로 is influencing은 지금 현재 일어나는 일을 설명하는 현재진행형 시제예요. 두 번째로 almost는 부사로 쓰여서 뒤에 오는 모든이라는 뜻의 all을 꾸며주고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 1 ts, 더 많은 상품을 팔도록. 이 문장 전체를 해석하면, 그것은 회사들이 소비자들이 필요로 하는 것을 더 잘 이해하고 더 많은 상품을 팔도록 도와준다.","hl":"m"},{"n":19,"text":"빅데이터가 실제 비즈니스 현장에서 어떻게 쓰이는지 보여주는 아주 중요한 예시예요. 고객의 마음을 읽어서 물건을 더 많이 팔게 해준다는 뜻이죠.","hl":"mn"},{"n":20,"text":"첫 번째로 help 뒤에 목적어 companies가 나오고 그 뒤에 understand라는 동사원형이 나온 점에 주의하세요. help는 목적격 보어로 동사원형을 쓰는 대표적인 단어입니다. 두 번째로 and 뒤에 다시 나오는 helps는 앞의 첫 번째 helps와 나란히 연결된 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도와준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통 체증을 피하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">avoid\u003c/span> heavy traffic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람들이 교통 체증을 피하도록 도와준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">빅데이터\u003c/b>가 실생활의 문제를 해결하는 구체적인 사례를 보여줍니다. 특히 \u003cb class=\"key\">교통\u003c/b> 분야에서 사람들의 편의를 높여주는 역할을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help + 목적어(people) + 목적격 보어(avoid/to avoid) : \"사람들이 피하도록 도와준다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It, 그것은.  helps, 도와준다. people, 사람들이. avoid heavy traffic, 교통 체증을 피하도록. 이 문장 전체를 해석하면, 그것은 사람들이 교통 체증을 피하도록 도와준다.","hl":"m"},{"n":22,"text":"앞선 문장에 이어 빅데이터가 우리 삶에 주는 구체적인 도움을 설명하고 있어요. 여기서는 빅데이터를 이용해 교통 문제를 해결할 ss=\"key\">패턴\u003c/b> 변화가 데이터로서 가치가 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : when [접속사] + the flu season [주어] + comes [현재시제 동사] : \"독감의 계절이 오면\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For example, 예를 들어. when the flu season comes, 독감의 계절이 오면. people will buy, 사람들은 구입할 것이다. more flu medicine, 더 많이 독감 약을.. 이 문장 전체를 해석하면, 예를 들어, 독감의 계절이 오면 사람들은 독감 약을 더 많이 구입할 것이다.","hl":"m"},{"n":34,"text":"빅데이터를 활용한 질병 예측의 구체적인 예시로 사람들의 소비 패턴이 어떻게 변하는지 보여주는 문장입니다.","hl":"mn"},{"n":35,"text":"첫 번째로 접속사 when이 이끄는 시간의 부사절에서는 미래의 의미일지라도 미래 시제 대신 현재 시제를 써야 하므로 comes라고 표현한 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 온라인상에서 검색할 것이다\u003c/span>\u003cspan class=\"en\">They will also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">search \u003c/span>\u003cspan class=\"tgt\">online\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독감 증상에 대해 더 많이.\u003c/span>\u003cspan class=\"en\">about flu \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">symptoms\u003c/span> more.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 온라인상에서 독감 증상에 대해 더 많이 검색해 볼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 약 구매 데이터 외에 추가적인 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">소스\u003c/b>인 검색 기록을 언급합니다. 사람들의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">탐색\u003c/b> 행동이 질병 예측의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구 수식\u003c/span> : search [동사] + online [부사] : \"온라인상에서 검색하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\ \" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(현재형)\u003c/span> : be (is) + analyzed (과거분사) : \"분석된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : 조동사(can) + be + predicted (과거분사) : \"예측될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"If this kind of data, 만약 이런 종류의 데이터가. is analyzed wisely, 현명하게 분석된다면. the spread of the flu, 독감의 확산은. can be predicted, 예측될 수 있다.. 이 문장 전체를 해석하면, 이런 종류의 데이터가 현명하게 분석된다면, 독감의 확산을 예측할 수 있다.","hl":"m"},{"n":40,"text":"빅데이터가 단순히 모이는 것에서 끝나는 게 아니라 어떻게 우리 삶에 실질적인 도움을 주는지 보여주는 문장이에요. 독감 유행 시기에 검색량이나 약 판매량 같은 데이터를 분석해서 질병의 확산을 미리 알아낼 수 있다는 핵심 사례를 마무리하고 있죠.","hl":"mn"},{"n":41,"text":"이 문장에는 중요한 수동태 표현이 두 번이나 나오는데요. 첫 번째로 is analyzed는 주어인 데이터가 분석되는 대상임을 나타내는 수동태입니다. 두 번째로 can be predicted는 조동사 can 뒤에 수동태의 원형인 be predicted를 붙여서 확산이 예측될 수 있다는 의미를 완성하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">빅데이터\u003c/b>는 기업 마케팅과 교통 정보 등 우리 일상 거의 모든 영역에 지대한 영향을 주고 있습니다.\u003c/li>\u003cli>회사는 빅데이터를 통해 고객의 \u003cb class=\"key\">요구 \u003c/b>\u003cb class=\"key\">사항\u003c/b>을 정확히 파악하고 더 많은 제품을 판매할 전략을 세웁니다.\u003c/li>\u003cli>건강 전문가들은 기상 전문가처럼 빅데이터를 활용하여 특정 \u003cb class=\"key\">질병의 \u003c/b>\u003cb class=\"key\">발생\u003c/b>을 예측할 수 있게 되었습니다.\u003c/li>\u003cli>독감 약 구매나 증상 검색 기록을 \u003cb class=\"key\">현명하게 \u003c/b>\u003cb class=\"key\">분석\u003c/b>함으로써 전염병의 확산을 미리 방지할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Big data significantly influences various aspects of our lives, ranging from improving business efficiency to predicting disease outbreaks through systematic data analysis.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">빅데이터\u003c/b>는 기업 마케팅과 교통 정보뿐만 아니라, 약 구매 및 검색 데이터를 통해 \u003cb class=\"key\">질병의 \u003c/b>\u003cb class=\"key\">확산\u003c/b>을 예측하는 등 우리 삶 전반에 걸쳐 광범위한 영향을 미칩니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 빅데이터가 우리 삶을 어떻게 스마트하게 만드는지 배웠습니다. 기업의 마케팅부터 생명을 구하는 질병 예측까지, 데이터 분석의 힘이 정말 대단하죠? 오늘 배운 분석 노트와 단어들을 다시 한번 복습하면서 여러분의 실력으로 만드시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
