JGAR1/zz+n0o65wQT6gg88575LL1x6jng5pdhALBcjBYgc9RnP1Gc/hx0OBW+62lr379v60uJW0W+m+nSz899Pz7M//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Predicting Crime: How Big Data Shapes Our Future<small>범죄 예측: 빅데이터가 미래를 만드는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 요즘 범죄 예방에 활용되는 예측 치안(Predictive Policing)이라는 개념을 들어본 적 있나요? 이는 과거의 범죄 기록을 빅데이터(Big Data)로 분석하여, 범죄가 일어날 확률이 높은 지역과 시간을 미리 예측하는 과학적인 수사 기법이에요. 마치 일기예보를 통해 비가 올 것을 대비하듯, 범죄 발생 가능성이 높은 장소를 범죄 핫스팟(Crime Hot Spots)으로 지정해 순찰을 강화하는 방식이죠. 데이터 기반 의사결정(Data-driven Decision Making)이 단순히 비즈니스 분야를 넘어, 이제는 우리의 안전을 지키는 사회 시스템 전반에 깊숙이 자리 잡고 있답니다. 이처럼 방대한 정보를 분석해 미래를 대비하는 기술이 앞으로 우리 삶을 어떻게 더 안전하게 바꿀지 기대하며 지문을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01범죄 예측의 새로운 방식</div><ul><li>빅데이터 분석을 통해 경찰은 범죄가 발생하기 전에 미리 예측할 수 있게 되었습니다.</li><li>범죄의 유형, 시간, 장소에 대한 데이터 분석 (analysis of big data)</li><li>범죄가 일어날 가능성이 높은 장소 지도 작성 (crime hot spots)</li><li>핵심 키워드: 빅데이터(Big data), 범죄 예방(Crime prevention)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02효율적인 경찰 대응</div><ul><li>지도를 활용하면 경찰이 특정 시간과 장소에 집중하여 범죄를 사전에 방지할 수 있습니다.</li><li>지도를 통해 범죄 발생 빈도가 높은 곳과 시간 파악</li><li>해당 구역과 시간대에 집중적인 순찰 실시</li><li>핵심 키워드: 범죄 지도(Map), 효율적 대응(Focusing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03빅데이터의 미래 전망</div><ul><li>이미 세상을 크게 변화시킨 빅데이터는 앞으로 우리 삶에서 더욱 중요한 역할을 할 것입니다.</li><li>현재까지 빅데이터가 가져온 커다란 변화 (changed the world)</li><li>전문가들이 예측하는 빅데이터의 미래 역할 (important role)</li><li>핵심 키워드: 산업(Industry), 전문가(Experts)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~ 덕분에</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다</td></tr><tr><td class=\"w\">analysis</td><td class=\"m\">분석</td></tr><tr><td class=\"w\">hot spot</td><td class=\"m\">범죄 다발 지역, 주요 지점</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 찾다</td></tr><tr><td class=\"w\">likely</td><td class=\"m\">~할 가능성이 있는</td></tr><tr><td class=\"w\">prevent</td><td class=\"m\">예방하다, 막다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">further</td><td class=\"m\">추가적인, 더 이상의</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">greatly</td><td class=\"m\">크게, 대단히</td></tr><tr><td class=\"w\">industry</td><td class=\"m\">산업</td></tr><tr><td class=\"w\">for sure</td><td class=\"m\">확실히</td></tr><tr><td class=\"w\">expert</td><td class=\"m\">전문가</td></tr><tr><td class=\"w\">play a role</td><td class=\"m\">역할을 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 덕분에,</span><span class=\"en\"><b>Thanks to big data,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경찰은 이제 예측할 수 있다</span><span class=\"en\"><b>police can now predict</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범죄를</span><span class=\"en\"><b>crime</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 일어나기 전에.</span><span class=\"en\"><b><span class=\"grammar-hl\">before it happens</span>.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터 덕분에 경찰은 이제 범죄가 발생하기 전에 그 범죄를 예측할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Thanks to는 사전적으로 &#39;~에 감사하며&#39;라는 뜻이지만, 여기서는 어떤 결과가 생겨난 &#39;원인&#39;을 나타내는 &#39;~덕분에&#39;로 쓰였습니다. 빅데이터라는 기술적 도구가 경찰의 업무 방식을 획기적으로 바꿨음을 강조하기 위해 이 표현을 사용했습니다. 앞 문장은 범죄 예방이라는 전체 주제를 소개하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to predict (to부정사): can(조동사)+predict(동사원형) 구조에서 predict의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">before it happens (관계부사): before는 시간의 관계부사로서 뒤에 주어(it)와 동사(happens)가 갖춰진 완전한 절을 이끌어 앞의 시점(time)을 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~ 덕분에</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 분석을 통해</span><span class=\"en\"><b><span class=\"grammar-hl\">Through the analysis of big data</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범죄의 유형, 시간 및 장소에 관한</span><span class=\"en\"><b><span class=\"grammar-hl\">about the type, time and place of crime</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경찰은</span><span class=\"en\"><b>police</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지도를 만들 수 있으며</span><span class=\"en\"><b>can <span class=\"grammar-hl\">make a map</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범죄 다발 지역의.</span><span class=\"en\"><b><span class=\"grammar-hl\">of crime hot spots</span>.</b></span></div></div><div class=\"lec-sent-ko\">범죄의 유형, 시간 및 장소에 관한 빅데이터 분석을 통해, 경찰은 범죄 다발 지역의 지도를 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;예측&#39;이 구체적으로 어떤 과정을 통해 이루어지는지 설명하는 문장입니다. hot spots은 사전적으로 &#39;뜨거운 지점&#39;이지만, 여기서는 &#39;범죄가 집중적으로 발생하는 위험 지역&#39;을 뜻합니다. 단순히 위험하다고 말하는 것보다 시각적인 &#39;지도(map)&#39;의 개념과 결합해 범죄 발생 장소를 직관적으로 표현했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Through the analysis of big data about the type, time and place of crime (관용표현): 전치사 Through와 명사구(the analysis ~)가 결합하여 문장 전체의 배경이나 수단을 나타내는 부사구로 쓰였습니다.</div><div class=\"lec-gr-item\">make a map of crime hot spots 5형식(SVOC) 구조와 유사한 목적어 확장: make는 타동사로서 &#39;a map of crime hot spots&#39;라는 목적어(O)를 취하여, 범죄 지도를 만드는 행위를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">analysis</td><td class=\"m\">분석</td></tr><tr><td class=\"w\">hot spot</td><td class=\"m\">범죄 다발 지역, 주요 지점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 지도는</span><span class=\"en\"><b>This map</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인해 준다</span><span class=\"en\"><b>identifies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언제 그리고 어디에서</span><span class=\"en\"><b><span class=\"grammar-hl\">when and where</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범죄가 가장 가능성이 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">crime is most likely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어날.</span><span class=\"en\"><b><span class=\"grammar-hl\">to happen</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 지도는 범죄가 언제, 어디에서 가장 발생할 것 같은지 알려 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번에서 만든 지도가 수행하는 구체적인 기능을 설명합니다. identifies는 &#39;신원을 확인하다&#39;라는 뜻도 있지만, 여기서는 데이터 속에서 범죄 가능성이 높은 시간과 장소를 &#39;찾아내다/식별하다&#39;라는 의미입니다. 지도가 단순히 정보를 담은 종이가 아니라, 실질적인 범죄 예측의 도구임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when and where crime is most likely to happen (간접의문문): when과 where가 이끄는 의문사절이 identify의 목적어 역할을 합니다. 의문사+주어(crime)+동사(is) 구조의 명사절입니다.</div><div class=\"lec-gr-item\">is most likely to happen (to부정사): be likely to V는 &#39;~할 가능성이 있다&#39;는 관용적 표현으로, 여기서 to happen은 형용사 likely를 수식하는 부사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">likely</td><td class=\"m\">~할 가능성이 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경찰은 예방할 수 있다</span><span class=\"en\"><b>Police can prevent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추가적인 범죄를</span><span class=\"en\"><b>further crime</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집중함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by focusing on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지역들과 시간들에</span><span class=\"en\"><b><span class=\"grammar-hl\">the areas and the times</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 지도가 예측하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">this map predicts</span>.</b></span></div></div><div class=\"lec-sent-ko\">경찰은 이 지도가 예측하는 지역과 시간대에 집중함으로써 추가 범죄를 예방할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예측을 넘어 실질적인 &#39;예방&#39;으로 이어지는 결과를 보여줍니다. 범죄를 막기 위한 구체적인 전략(집중 순찰 등)이 무엇인지, 앞 문장의 데이터를 어떻게 활용하는지 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by focusing on the areas and the times (동명사): 전치사 by의 목적어로 쓰인 명사적 역할의 동명사입니다.</div><div class=\"lec-gr-item\">this map predicts (관계대명사(생략)): the areas and the times와 this map 사이에는 목적격 관계대명사(that/which)가 생략되어 있으며, 뒤의 predicts의 목적어 자리가 비어 있는 수식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predict</td><td class=\"m\">예측하다</td></tr><tr><td class=\"w\">prevent</td><td class=\"m\">예방하다, 막다</td></tr><tr><td class=\"w\">further</td><td class=\"m\">추가적인, 더 이상의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빅데이터는</span><span class=\"en\"><b>Big data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이미 변화시켰다</span><span class=\"en\"><b><span class=\"grammar-hl\">has already changed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계를</span><span class=\"en\"><b>the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크게.</span><span class=\"en\"><b>greatly.</b></span></div></div><div class=\"lec-sent-ko\">빅데이터는 이미 세계를 크게 변화시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범죄 예방이라는 구체적인 사례를 넘어, 빅데이터가 가진 포괄적인 영향력을 언급하며 화제를 확장하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has already changed (현재완료): 조동사 have+p.p.(changed) 구조로, 과거의 사건이 현재까지 영향을 미치고 있음을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greatly</td><td class=\"m\">크게, 대단히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 어디로</span><span class=\"en\"><b>So <span class=\"grammar-hl\">where</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터 산업은</span><span class=\"en\"><b><span class=\"grammar-hl\">will the big data industry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가게 될까</span><span class=\"en\"><b><span class=\"grammar-hl\">go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기로부터?</span><span class=\"en\"><b>from here?</b></span></div></div><div class=\"lec-sent-ko\">그러면 빅데이터 산업은 여기에서부터 어디로 가게 될까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화제를 미래의 방향성으로 전환하며 독자의 호기심을 자극하는 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where will the big data industry go (간접의문문): 문장 전체의 의문문 구조 속에 의문사 where를 포함한 절이 직접적으로 쓰여 산업의 향방을 묻고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">industry</td><td class=\"m\">산업</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무도 모른다</span><span class=\"en\"><b>Nobody knows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확실히,</span><span class=\"en\"><b>for sure,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 전문가들은 동의한다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">experts agree</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빅데이터가</span><span class=\"en\"><b><span class=\"grammar-hl\">that big data</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하게 될 것이라는 점에</span><span class=\"en\"><b><span class=\"grammar-hl\">will play</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 중요한 역할을</span><span class=\"en\"><b>a <span class=\"grammar-hl\">more and more</span> important role</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 삶 속에서.</span><span class=\"en\"><b>in our lives.</b></span></div></div><div class=\"lec-sent-ko\">누구도 확실히 알지는 못하지만, 전문가들은 빅데이터가 우리 삶에서 더욱 더 중요한 역할을 할 것이라는 데에는 동의한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 질문에 대한 답을 제시합니다. play a role은 &#39;역할을 연기하다&#39;가 아니라 &#39;역할을 하다/기능하다&#39;라는 뜻의 숙어입니다. more and more를 사용해 앞으로 빅데이터의 영향력이 점진적으로, 그리고 지속적으로 커질 것임을 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">experts agree that big data will play (명사절(that)): agree의 목적어 역할을 하는 that절입니다. 관계대명사와 달리 내부 구조가 완전한 절을 이룹니다.</div><div class=\"lec-gr-item\">more and more (관용표현): &#39;점점 더&#39;라는 의미로 비교급 and 비교급 구조를 사용하여 정도가 심화됨을 강조합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for sure</td><td class=\"m\">확실히</td></tr><tr><td class=\"w\">expert</td><td class=\"m\">전문가</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>빅데이터를 활용한 분석으로 경찰이 범죄 발생 가능성을 미리 예측할 수 있게 되었다.</li><li>범죄 다발 지역 지도를 통해 경찰은 특정 시간과 장소에 집중하여 범죄를 사전에 예방한다.</li><li>빅데이터는 이미 세상을 크게 바꾸었으며, 앞으로 우리 삶에서 더욱 중요한 역할을 할 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Police use big data to identify high-risk crime areas, and this technology is expected to play an increasingly significant role in our lives.</div>\n              <div class=\"lec-final-sum-ko\">경찰은 빅데이터를 활용하여 위험 지역을 파악하며, 이 기술은 앞으로 우리 삶에서 더욱 중요한 역할을 할 것으로 예상된다.</div></div></div>"],"segs":[[{"audio":"./5_audio/1.mp3","hl":null}],[{"audio":"./5_audio/2.mp3","hl":null}],[{"audio":"./5_audio/3.mp3","hl":null},{"audio":"./5_audio/4.mp3","hl":"stage-0"},{"audio":"./5_audio/5.mp3","hl":"stage-1"},{"audio":"./5_audio/6.mp3","hl":"stage-2"}],[{"audio":"./5_audio/7.mp3","hl":null}],[{"audio":"./5_audio/8.mp3","hl":"main"},{"audio":"./5_audio/9.mp3","hl":"meaning"},{"audio":"./5_audio/10.mp3","hl":"grammar"}],[{"audio":"./5_audio/11.mp3","hl":"main"},{"audio":"./5_audio/12.mp3","hl":"meaning"},{"audio":"./5_audio/13.mp3","hl":"grammar"}],[{"audio":"./5_audio/14.mp3","hl":"main"},{"audio":"./5_audio/15.mp3","hl":"meaning"},{"audio":"./5_audio/16.mp3","hl":"grammar"}],[{"audio":"./5_audio/17.mp3","hl":"main"},{"audio":"./5_audio/18.mp3","hl":"meaning"},{"audio":"./5_audio/19.mp3","hl":"grammar"}],[{"audio":"./5_audio/20.mp3","hl":"main"},{"aud
