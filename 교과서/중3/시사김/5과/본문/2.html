\"stage-1\"><div class=\"lec-stage-head\">02그림 A의 묘사</div><ul><li>상대적으로 안정적이고 보호 수단이 갖춰진 상황을 설명함.</li><li>인물이 우산(umbrella)을 들고 있음</li><li>날씨: 가벼운 비(light rain)가 내리는 중</li><li>외부 스트레스에 대한 방어 기제가 존재함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03그림 B의 묘사</div><ul><li>보호 수단 없이 열악한 환경에 처한 상황을 설명함.</li><li>폭우(heavy rain)가 내리지만 우산이 없음</li><li>인물 머리 위에 먹구름(dark clouds)이 존재함</li><li>외부의 어려움에 그대로 노출된 상태</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04차이점의 의미</div><ul><li>두 그림의 시각적 차이가 상징하는 심리적 의미에 대해 의문을 제기함.</li><li>그림 간의 구체적인 차이점(differences) 확인</li><li>이러한 묘사의 차이가 무엇을 의미(mean)하는지 고찰</li><li>환경적 스트레스와 대처 능력의 상관관계 암시</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">study</td><td class=\"m\">조사하다, 살피다, 검토하다</td></tr><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 소묘</td></tr><tr><td class=\"w\">light</td><td class=\"m\">(비 등이) 약한, 가벼운</td></tr><tr><td class=\"w\">on the other hand</td><td class=\"m\">반면에, 다른 한편으로는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">heavy</td><td class=\"m\">(비 등이) 심한, 거센</td></tr><tr><td class=\"w\">difference</td><td class=\"m\">차이, 다름</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다, 나타내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 검사들 중 하나는</span><span class=\"en\"><b><span class=\"grammar-hl\">One of those tests</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;빗속의 사람 그리기&#39;(DAPR) 검사</span><span class=\"en\"><b>the Draw-a-Person-in-the-Rain (DAPR) test.</b></span></div></div><div class=\"lec-sent-ko\">이런 검사들 중 하나는 빗속의 사람 그리기 검사입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> One of those tests는 앞에서 언급되었을 여러 심리 검사들 중 하나로 이 글의 핵심 소재를 소개하는 역할을 합니다. Draw-a-Person-in-the-Rain (DAPR)은 피검사자가 그림을 통해 자신의 내면이나 스트레스 대처 방식을 드러내게 하는 투사적 검사 기법을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">One of those tests is 주어 구조: &#39;One of + 복수명사(tests)&#39; 구문이 주어 자리에 올 경우, 문법적인 핵심 주어는 단수인 One이므로 동사를 단수형인 is로 일치시킨 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구해 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">Study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래의 그림들을.</span><span class=\"en\"><b>the pictures below.</b></span></div></div><div class=\"lec-sent-ko\">아래의 그림들을 연구해 봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Study the pictures는 독자에게 실제 사례를 관찰하게 하여 이어질 구체적인 비교 분석 내용에 집중하게 만드는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Study (명령문): 주어인 You를 생략하고 동사원형 Study로 문장을 시작하여 지시나 요청을 나타내는 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">study</td><td class=\"m\">조사하다, 살피다, 검토하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">A 그림 속의 사람은</span><span class=\"en\"><b>The person in <span class=\"grammar-hl\">Drawing A</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산을 들고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is holding</span> an umbrella</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가벼운 빗속에서.</span><span class=\"en\"><b>in a light rain.</b></span></div></div><div class=\"lec-sent-ko\">A 그림 속의 사람은 가벼운 빗속에서 우산을 들고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> holding an umbrella는 외부의 압박이나 시련으로부터 자신을 보호할 수 있는 대처 자원이나 능력이 있음을 보여줍니다. light rain은 현재 이 사람이 느끼는 스트레스의 양이 그리 위협적이지 않은 상태임을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is holding (현재진행): be동사(is)와 현재분사(-ing)가 결합하여 현재 시점에서 동작이 진행 중임을 나타내는 서술부다.</div><div class=\"lec-gr-item\">Drawing A (동명사): 전치사 in의 목적어 역할을 하며, 명사적 기능을 수행하여 &#39;그림&#39;이라는 대상을 지칭한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 소묘</td></tr><tr><td class=\"w\">light</td><td class=\"m\">(비 등이) 약한, 가벼운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반면에,</span><span class=\"en\"><b><span class=\"grammar-hl\">On the other hand</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">B 그림 속의 사람은</span><span class=\"en\"><b>the person in <span class=\"grammar-hl\">Drawing B</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거센 빗속에</span><span class=\"en\"><b>in a heavy rain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우산을 가지고 있지 않다.</span><span class=\"en\"><b>and has no umbrella.</b></span></div></div><div class=\"lec-sent-ko\">반면에, B 그림 속의 사람은 거센 빗속에서 우산을 가지고 있지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> On the other hand는 앞선 그림 A의 안정적인 상황과 대조되는 위기 상황을 부각합니다. has no umbrella는 쏟아지는 시련을 막아낼 방어 기제나 주변의 도움 없이 홀로 고통을 감내하고 있는 심리적 무방비 상태를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the other hand (관용표현): 앞서 언급된 내용과 대조되는 상황을 제시할 때 사용하는 연결어구로 &#39;반면에&#39;라는 의미로 쓰인다.</div><div class=\"lec-gr-item\">Drawing B (동명사): 전치사 in의 목적어로 쓰인 -ing 형태로, 명사적 성격이 강해진 용어다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 소묘</td></tr><tr><td class=\"w\">on the other hand</td><td class=\"m\">반면에, 다른 한편으로는</td></tr><tr><td class=\"w\">heavy</td><td class=\"m\">(비 등이) 심한, 거센</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은 구름들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span> dark clouds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">B 그림 속의 사람 머리 위에.</span><span class=\"en\"><b>above the person in <span class=\"grammar-hl\">Drawing B</span>.</b></span></div></div><div class=\"lec-sent-ko\">또한, 검은 구름들이 B 그림의 사람 머리 위에 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> dark clouds는 현재 처한 폭우라는 문제 외에도 인물이 느끼는 미래에 대한 불안감이나 우울감이 매우 깊다는 것을 덧붙여 설명합니다. 앞 문장의 &#39;폭우&#39;와 &#39;우산 없음&#39;에 더해 심리적 압박이 가중되고 있음을 보여주는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): 유도부사 There가 문장 앞에 오면서 &#39;be동사(are) + 주어(dark clouds)&#39; 순서로 주어와 동사의 위치가 바뀐 구조다.</div><div class=\"lec-gr-item\">Drawing B (동명사): 전치사 in의 목적어 역할을 수행하는 -ing 형태의 명사적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 소묘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 차이들이 의미할 수 있을까?</span><span class=\"en\"><b><span class=\"grammar-hl\">can these differences mean</span>?</b></span></div></div><div class=\"lec-sent-ko\">이런 차이는 무엇을 의미하는 걸까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> these differences는 그림 속의 비의 양, 우산 유무, 구름의 존재 등을 통칭하며, 이러한 시각적 요소의 차이가 실제 인간의 심리 분석에서 어떤 진단 결과로 이어지는지 질문을 던져 독자의 호기심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can these differences mean (의문문): 의문사 What으로 시작하여 &#39;조동사(can) + 주어(these differences) + 동사원형(mean)&#39;의 어순을 취하는 직접의문문 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">difference</td><td class=\"m\">차이, 다름</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다, 나타내다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스트레스 대처 능력을 파악하는 DAPR(빗속의 사람 그리기) 테스트를 소개한다.</li><li>그림 A는 적은 비와 우산을 통해 적절한 대처 능력이 있는 안정된 상태를 보여준다.</li><li>그림 B는 폭우, 우산의 부재, 먹구름을 통해 심각한 스트레스와 무방비 상태를 보여준다.</li><li>이러한 그림 속 장치들의 차이가 심리학적으로 어떤 의미가 있는지 화두를 던진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The DAPR test identifies psychological differences by examining environmental factors and protective tools shown in a person&#39;s drawing.</div>\n              <div class=\"lec-final-sum-ko\">DAPR 검사는 한 사람의 그림에 나타난 환경적 요인과 보호 도구를 조사함으로써 심리적 차이를 식별한다.</div></div></div>"],"segs":[[{"audio
