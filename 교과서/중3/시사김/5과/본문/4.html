9f8KTIyfXH8v8M849eaAR2I9T0/X+tLf57f0wFx2/lx/KikyvqO/OR26n8O/p3oyMdRjp1GPpTC/T+un+YtFJuUfxDv3Hbk/l39O9JuXbnII6dvp3x+tAX/EX/PT/AD/nH4r3/D+f4e3r9R0ppYDqR0PGfTqfoM88eg64BN64zkfmM+nr/nvQAv6c+nf/AOv/APW60tIGUjOR3POOMdc/Tv6UmVJ6jg8cnr/L8s+vegP6+8dRSbh6jv3Hbr37d/TvSBlPce/QY780B0/XoOoJxTdy8fMOSQORzjrjnn1+lG4Z+8OeByOuQP6jHGPXtQJNPYXrnOP8+v8AUf44pf05/wDr9v8AP1pCRnqO/f06jHsD68HHFG4E4BB4zwQenB+mDj+VAX1t6/p/mLkevt+PpR/n/P8An+VN3DOPQH6cdR9R3HalBB5BHPvn09/p09fegYtFJuXpkZJOBkZ+Xr0Pbv6dD1o3L6jggHkdTR+X66W/r0D+v6+8Wj/P+f8APr+LdwyRnkf06/l39KCyjqR1x1HP05/+v7UAOoP0z/j2/wA9qTI9R+nGOv5d/T+Sbl65HI/z/Pv+FAC9f89f89sEUDkc/wCH9cj+dIGU9COpHX06/l39KXcvPI4oAWim7l45HQnj2xngZ6Z5HOKCyjqR+Y4/z+dADqP8/wCen+e1Jkeo/OjcOmfT8c+lAC01s7Tj0/z/APq7jjvS5HbBPOOn19R3H5/nSNgKzDB+U+/QH9PYUrrfoH5/1/mf/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Reading the Mind: What Drawing Details Reveal About One’s Attitude<small>마음 읽기: 그림의 세부 묘사가 드러내는 심리적 태도</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 심리학에서 내면의 상태를 파악하기 위해 활용하는 투사 검사(Projective Test) 중 하나인 인물화 검사(Draw-A-Person Test)의 원리를 다루고 있습니다. 마치 거울에 비친 모습처럼, 그림이라는 도구를 통해 개인의 무의식(Subconsciousness) 속에 숨겨진 감정이나 스트레스가 밖으로 드러난다는 이론에 기반하고 있죠. 특히 종이의 왼쪽과 오른쪽을 과거와 미래로 나누어 해석하는 방식은 공간 상징(Spatial Symbolism) 이론과 연결되는데, 이는 우리가 공간을 인식하는 방식이 심리적 태도와 밀접한 관련이 있다고 보는 관점입니다. 따라서 그림에서 얼굴을 생략하거나 특정 위치에 치우치게 그리는 행위는 단순한 습관이 아니라, 사회적 불안(Social Anxiety)이나 미래를 향한 준비도와 같은 복합적인 심리적 지표(Psychological Indicator)를 보여주는 중요한 단서가 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01스트레스와 인물화의 상관관계</div><ul><li>인물화의 세부적인 특징들은 스트레스 상황에서 그리는 사람의 태도를 반영한다.</li><li>그림의 세부 사항(details)과 심리의 연결</li><li>스트레스(stress) 상황에서의 태도(attitude) 투영</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02얼굴 생략과 관심 회피</div><ul><li>인물을 그릴 때 얼굴을 생략하는 것은 타인의 주목을 피하고자 하는 심리를 나타낸다.</li><li>얼굴 없는 인물(a person without a face)</li><li>자신에게 향하는 타인의 관심(attention)을 원치 않음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03좌우 위치에 따른 심리 상태</div><ul><li>종이의 어느 쪽에 인물을 배치하느냐에 따라 과거에 대한 불안이나 미래에 대한 태도가 드러난다.</li><li>오른쪽(right side): 미래(future)를 맞이할 준비가 된 상태</li><li>왼쪽(left side): 과거(past)의 사건들에 대한 걱정</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실제 적용 및 분석 제안</div><ul><li>제시된 해석 기준들을 바탕으로 실제 그림을 직접 분석해 보고 자신의 의견을 정리한다.</li><li>각 부분의 가능한 의미(possible meanings) 확인</li><li>그림을 직접 읽어보기(reading them yourself)</li><li>분석 결과에 대한 개인적 의견(opinion) 제시</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have to do with</td><td class=\"m\">~와 관련이 있다</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr><tr><td class=\"w\">under stress</td><td class=\"m\">스트레스를 받는, 압박감을 느끼는</td></tr><tr><td class=\"w\">draw attention to</td><td class=\"m\">~에 관심을 끌다, ~에 주목하게 하다</td></tr><tr><td class=\"w\">be ready to</td><td class=\"m\">~할 준비가 되다, 기꺼이 ~하다</td></tr><tr><td class=\"w\">on the other hand</td><td class=\"m\">반면에, 다른 한편으로는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be worried about</td><td class=\"m\">~에 대해 걱정하다, ~에 대해 불안해하다</td></tr><tr><td class=\"w\">happen</td><td class=\"m\">일어나다, 발생하다</td></tr><tr><td class=\"w\">go back</td><td class=\"m\">돌아가다, 되돌아가다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 살피다</td></tr><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세 번째로,</span><span class=\"en\"><b>Third,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세부 사항들은</span><span class=\"en\"><b>the details</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을 그린 그림 속의</span><span class=\"en\"><b>in the <span class=\"grammar-hl\">drawing</span> of the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그린 사람의 태도와 관련이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">have to do with</span> the drawer’s attitude</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스 하에서의.</span><span class=\"en\"><b>under stress.</b></span></div></div><div class=\"lec-sent-ko\">세 번째, 그림 속 사람의 세부적인 것들은 그 그림을 그린 사람이 스트레스를 받을 때의 태도와 관련이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Third라는 표현을 통해 앞서 언급된 다른 분석 기준들에 이어 세 번째 기준을 제시하며 화제를 전환합니다. have to do with는 그림에 나타난 작은 요소들이 단순히 우연이 아니라 그 사람의 심리적 상태를 반영한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">drawing (동명사): 명사적 성격을 가져 관사(the)의 수식을 받으며 &#39;그림&#39;이라는 구체적 대상을 나타낸다. 여기서는 전치사 in의 목적어로 쓰였다.</div><div class=\"lec-gr-item\">have to do with (관용표현): &#39;~와 관계가 있다&#39;라는 의미로 쓰여 주어(the details)와 목적어(the drawer&#39;s attitude) 사이의 관계를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have to do with</td><td class=\"m\">~와 관련이 있다</td></tr><tr><td class=\"w\">attitude</td><td class=\"m\">태도, 사고방식</td></tr><tr><td class=\"w\">under stress</td><td class=\"m\">스트레스를 받는, 압박감을 느끼는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람은</span><span class=\"en\"><b>someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼굴이 없는 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">who draws a person</span> without a face</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 관심을 끌기를 원하지 않는다</span><span class=\"en\"><b>does not want <span class=\"grammar-hl\">to draw</span> people’s attention</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 자신에게로.</span><span class=\"en\"><b>to himself or herself.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 얼굴이 없는 사람을 그린 사람은 사람들의 관심을 끌기를 원하지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> For example을 사용해 앞 문장의 추상적인 설명을 구체적인 사례로 뒷받침합니다. draw people’s attention은 남들의 시선을 받는 것이 부담스러워 자신을 숨기고 싶어 하는 소극적인 심리를 그림의 생략된 부분으로 표현했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who draws a person (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 someone을 수식하며, 관계대명사절 내에서 주어 역할을 수행하므로 뒤에 주어가 빠진 불완전한 절이 이어진다.</div><div class=\"lec-gr-item\">to draw (to부정사): 명사적 용법으로 쓰여 타동사 want의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람은</span><span class=\"en\"><b>Someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이의 오른쪽에 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">who draws the person</span> on the right side of the paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">준비가 되어 있다</span><span class=\"en\"><b>is ready</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래를 맞이할.</span><span class=\"en\"><b><span class=\"grammar-hl\">to meet</span> the future.</b></span></div></div><div class=\"lec-sent-ko\">사람을 종이의 오른쪽에 그린 사람은 미래를 맞이할 준비가 되어 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 예시에 이어 그림의 위치에 따른 심리 분석을 추가로 제시합니다. ready to meet the future는 지면의 오른쪽 공간을 긍정적이고 진취적인 에너지가 향하는 방향으로 설정하여, 그 사람의 개방적인 태도를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who draws the person (관계대명사): 주격 관계대명사 who가 선행사 someone을 수식하는 형용사절을 이끌며, 뒤에 주어가 생략된 불완전한 문장 구조를 취한다.</div><div class=\"lec-gr-item\">to meet (to부정사): 형용사 ready를 수식하는 부사적 용법(형용사 수식)으로 쓰여 &#39;~할 준비가 된&#39;이라는 의미를 형성한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반면에,</span><span class=\"en\"><b><span class=\"grammar-hl\">On the other hand</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람은</span><span class=\"en\"><b>someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왼쪽에 사람을 그리는</span><span class=\"en\"><b><span class=\"grammar-hl\">who draws the person</span> on the left side</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일들에 대해 걱정하고 있을지도 모른다</span><span class=\"en\"><b>may <span class=\"grammar-hl\">be worried</span> about things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거에 일어났던.</span><span class=\"en\"><b><span class=\"grammar-hl\">that have happened</span> in the past.</b></span></div></div><div class=\"lec-sent-ko\">반면에, 사람을 왼쪽에 그린 사람은 과거에 일어났던 일에 대해 걱정하고 있을 수도 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> On the other hand를 사용하여 오른쪽 그림과 대비되는 왼쪽 그림의 의미를 설명합니다. worried about things that have happened in the past는 시선이나 위치가 왼쪽으로 쏠린 것을 지나간 일에 얽매여 있거나 후회하는 심리 상태로 연결 지어 해석합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the other hand (관용표현): &#39;반면에&#39;라는 뜻으로, 앞 문장의 내용과 대조되는 상황을 도입할 때 사용하는 연결어구다.</div><div class=\"lec-gr-item\">who draws the person (관계대명사): 주격 관계대명사 who가 선행사 someone을 수식하며, 관계절 내부에서 주어 역할을 담당한다.</div><div class=\"lec-gr-item\">be worried (수동태): be동사(be)+p.p.(worried) 구조. worry는 타동사(목적어를 취하는 동사)인데 뒤에 목적어가 없어서 수동구조 be worried 형태로 쓴다. 기본구조: worry + O (~를 걱정시키다)</div><div class=\"lec-gr-item\">that have happened (관계대명사): 주격 관계대명사 that이 선행사 things를 수식하며, 뒤에 주어가 없는 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on the other hand</td><td class=\"m\">반면에, 다른 한편으로는</td></tr><tr><td class=\"w\">be worried about</td><td class=\"m\">~에 대해 걱정하다, ~에 대해 불안해하다</td></tr><tr><td class=\"w\">happen</td><td class=\"m\">일어나다, 발생하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것들은 일부이다</span><span class=\"en\"><b>These are some</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 의미들 중</span><span class=\"en\"><b>of the possible meanings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림의 각 부분에 대한.</span><span class=\"en\"><b>of each part of <span class=\"grammar-hl\">the drawings</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것들은 그림 각 부분의 가능한 의미 풀이 중 일부입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> possible meanings라는 표현을 통해 지금까지 나열한 해석들이 절대적인 정답이 아니라 하나의 가능성임을 시사하며 본문의 분석 내용을 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the drawings (동명사): 명사적 용법으로 쓰여 &#39;그림들&#39;이라는 의미를 나타내며, 전치사 of의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돌아가서</span><span class=\"en\"><b>go back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 그림을 보세요.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">look at</span> the two <span class=\"grammar-hl\">drawings</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제, 돌아가서 두 그림을 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> go back and look은 독자에게 앞서 배운 지식을 실제 그림에 적용해 보도록 유도하며 이론 설명에서 실천 단계로 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look at (관용표현): &#39;~을 보다&#39;라는 의미의 구동사로, 명령문의 동사원형 형태로 쓰였다.</div><div class=\"lec-gr-item\">drawings (동명사): 명사화된 표현으로 &#39;그려진 작품&#39; 혹은 &#39;그림&#39;이라는 의미로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go back</td><td class=\"m\">돌아가다, 되돌아가다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 살피다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들을 읽어보려고 노력하세요</span><span class=\"en\"><b>Try <span class=\"grammar-hl\">reading</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로.</span><span class=\"en\"><b>yourself.</b></span></div></div><div class=\"lec-sent-ko\">그 그림들을 스스로 읽으려고 시도해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> reading them은 그림을 단순한 이미지가 아니라 숨은 뜻을 파악해야 할 하나의 상징 체계나 텍스트로 간주하여 분석해 보라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reading (동명사): 타동사 try의 목적어로 쓰였으며, try 뒤에 동명사가 오면 &#39;시험 삼아 ~해 보다&#39;라는 의미를 전달한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 이해할 수 있나요</span><span class=\"en\"><b>Can you understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 종류의 사람이</span><span class=\"en\"><b><span class=\"grammar-hl\">what kind of person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각의 그림을 그렸는지?</span><span class=\"en\"><b><span class=\"grammar-hl\">drew each one</span>?</b></span></div></div><div class=\"lec-sent-ko\">당신은 각 그림을 그린 사람이 어떤 사람인지 알 수 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> understand what kind of person은 학습한 분석 기준을 토대로 그림 뒤에 숨겨진 작성자의 성격이나 심리 상태를 추론할 수 있는지 독자에게 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what kind of person drew each one (간접의문문): 의문사구(what kind of person)가 해당 절의 주어 역할을 겸하고 있으며, 전체 문장에서 타동사 understand의 목적어(명사절) 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 의견은 무엇입니까?</span><span class=\"en\"><b><span class=\"grammar-hl\">What’s your opinion?</span></b></span></div></div><div class=\"lec-sent-ko\">당신의 의견은 어떤가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> What’s your opinion?은 글을 마무리하며 독자 스스로 내린 결론이나 분석 결과에 대해 생각해보게 함으로써 독자의 능동적인 참여를 끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What’s your opinion? (의문문): 의문사 What이 주격 보어(C) 역할을 하며 be동사(is)가 주어(your opinion) 앞에 위치한 형태의 의문문이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람 그림의 세부 묘사는 그린 이의 스트레스 하에서의 심리 상태를 반영한다.</li><li>얼굴을 생략하거나 그림을 배치하는 위치(왼쪽/오른쪽)에 따라 각기 다른 심리적 의미가 있다.</li><li>제시된 분석 기준들은 절대적인 것이 아닌 가능성 있는 해석들이다.</li><li>배운 기준을 바탕으로 실제 그림을 분석하고 추론해 보는 경험을 독자에게 제안한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The details in a drawing of a person reflect the drawer’s psychological attitude under stress, thus enabling an understanding of their personality.</div>\n              <div class=\"lec-final-sum-ko\">사람 그림의 세부 사항은 스트레스 하에서 그리는 이의 심리적 태도를 반영하므로, 이를 통해 그들의 성격을 이해할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/1.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/2.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/3.mp3","hl":null},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/8.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/9.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/10.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/12.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/13.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/15.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/16.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/18.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/19.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/21.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/22.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/24.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문4_강의_audio/25.mp3","hl":"me
