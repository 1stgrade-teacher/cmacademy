큰 우산은 많은 계획이나 충분한 보호(protection) 수단이 있음을 의미</li><li>핵심 키워드: 보호 수단(protection)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대처 능력의 부족</div><ul><li>그림에 우산이 없는 경우 어려운 상황에 대처할 힘이 부족함을 나타낸다.</li><li>우산이 없다는 것은 어려운 상황을 다룰 수단이 없음을 의미</li><li>이는 심리적으로 무방비 상태이거나 대처 방식(means to deal with)이 부재함을 시사</li><li>핵심 키워드: 어려운 상황(difficult situations)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be under stress</td><td class=\"m\">스트레스를 받다, 압박을 받다</td></tr><tr><td class=\"w\">heavily</td><td class=\"m\">세차게, 심하게, 대량으로</td></tr><tr><td class=\"w\">wait to happen</td><td class=\"m\">곧 발생하려고 하다, 일어날 것 같다</td></tr><tr><td class=\"w\">hopeful</td><td class=\"m\">희망적인, 낙관적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protection</td><td class=\"m\">보호, 방어물, 보전</td></tr><tr><td class=\"w\">stressful</td><td class=\"m\">스트레스가 많은, 긴장을 주는</td></tr><tr><td class=\"w\">means</td><td class=\"m\">수단, 방법</td></tr><tr><td class=\"w\">deal with</td><td class=\"m\">~을 다루다, ~에 대처하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫 번째로,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비는 스트레스를 보여 줍니다</span><span class=\"en\"><b>the rain shows the stress</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람이 받고 있는</span><span class=\"en\"><b>the person <span class=\"grammar-hl\">who drew the picture</span> is under.</b></span></div></div><div class=\"lec-sent-ko\">첫 번째, 비는 그림을 그린 사람이 받고 있는 스트레스를 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체에서 그림의 구성 요소를 분석하는 첫 번째 순서임을 알리고 있습니다. the stress the person who drew the picture is under는 그림을 그린 사람이 현재 일상생활에서 겪고 있는 심리적인 압박감이나 괴로움을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who drew the picture (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사인 the person을 수식한다. who 뒤에 바로 동사 drew가 이어지는 구조다.</div><div class=\"lec-gr-item\">the stress the person ... is under (관계대명사): 선행사 the stress와 뒤의 주어 the person 사이에 목적격 관계대명사(that/which)가 생략되어 있다. stress는 전치사 under의 목적어 역할을 하며, 관계대명사절이 선행사의 내용을 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빗방울의 크기가 크면 클수록</span><span class=\"en\"><b>The bigger the drops are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 비가 더 세게 내리면 내릴수록</span><span class=\"en\"><b>or the more heavily the rain <span class=\"grammar-hl\">is falling</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스는 더 큽니다.</span><span class=\"en\"><b>the bigger the stress is.</b></span></div></div><div class=\"lec-sent-ko\">빗방울의 크기가 크면 클수록, 혹은 비가 더 세게 내리면 내릴수록 스트레스는 더 큽니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;비&#39;라는 소재를 구체화하여 설명합니다. The bigger the drops are or the more heavily the rain is falling은 그림 속에 묘사된 비의 양과 세기가 그 사람이 체감하는 고통의 정도와 비례한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The bigger ... the more heavily ... the bigger (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로, 앞의 상태나 정도가 심해짐에 따라 뒤의 결과도 비례해서 커진다는 의미를 나타낸다. (~할수록 더 ...하다)</div><div class=\"lec-gr-item\">is falling (현재진행): be동사(is) + 현재분사(-ing)가 결합하여 비가 내리고 있는 동작의 진행 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">heavily</td><td class=\"m\">세차게, 심하게, 대량으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">구름은 앞으로 벌어질 문제를 의미합니다</span><span class=\"en\"><b>The clouds mean <span class=\"grammar-hl\">problems waiting</span> <span class=\"grammar-hl\">to happen</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 큰 구름은 보여 줍니다</span><span class=\"en\"><b>so a big cloud <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람이 그다지 희망적이지 않다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">the drawer is</span> not very hopeful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래에 대해.</span><span class=\"en\"><b>about the future.</b></span></div></div><div class=\"lec-sent-ko\">구름은 앞으로 벌어질 문제를 의미하기 때문에, 큰 구름은 그림을 그린 사람이 미래에 대해 그다지 희망적이지 않다는 것을 나타냅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스트레스(비)의 원인이 되는 또 다른 요소인 &#39;구름&#39;을 소개합니다. problems waiting to happen은 아직 닥치지는 않았지만 조만간 터질 것 같은 잠재적인 걱정거리들을 뜻하며, not very hopeful about the future는 앞으로의 상황이 좋아질 것이라고 믿지 못하는 비관적인 심리 상태를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">problems waiting (현재분사(형용사)): waiting이 앞의 명사 problems를 수식하는 구조다. (= problems that are waiting / &#39;기다리고 있는 문제들&#39;)</div><div class=\"lec-gr-item\">to happen (to부정사): 형용사적 용법으로, 앞의 waiting과 연결되어 &#39;발생하기를 (기다리는)&#39;이라는 구체적인 동작을 설명한다.</div><div class=\"lec-gr-item\">shows the drawer is 명사절 접속사: 동사 shows의 목적어 역할을 하는 명사절에서 접속사 that이 생략된 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hopeful</td><td class=\"m\">희망적인, 낙관적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 번째로,</span><span class=\"en\"><b>Second,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산은 그 사람이 가지고 있는 보호 기제를 의미합니다</span><span class=\"en\"><b>the umbrella means <span class=\"grammar-hl\">the protection the person has</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스를 받는 상황에서.</span><span class=\"en\"><b>in a stressful situation.</b></span></div></div><div class=\"lec-sent-ko\">두 번째, 우산은 스트레스를 받는 상황에서 그 사람이 가지고 있는 보호 기제를 의미합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스트레스 요인(비, 구름)에 이어, 이에 대응하는 수단인 &#39;우산&#39;으로 화제를 전환합니다. the protection the person has는 어려운 일이 생겼을 때 나를 도와줄 주변 사람이나 경제적 여유, 혹은 스스로를 지킬 수 있는 마음의 힘이 있음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the protection the person has (관계대명사): 선행사 the protection 뒤에 목적격 관계대명사(that/which)가 생략되어 있다. person has 뒤에 목적어가 비어 있는 불완전한 절이 선행사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protection</td><td class=\"m\">보호, 방어물, 보전</td></tr><tr><td class=\"w\">stressful</td><td class=\"m\">스트레스가 많은, 긴장을 주는</td></tr><tr><td class=\"w\">means</td><td class=\"m\">수단, 방법</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">큰 우산은 보여 줍니다</span><span class=\"en\"><b>A big umbrella <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람이 많은 계획이나 보호 기제를 가지고 있음을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the drawer has <span class=\"grammar-hl\">a lot of</span> plans or protection.</b></span></div></div><div class=\"lec-sent-ko\">큰 우산은 그림을 그린 사람이 많은 계획이나 보호 기제를 가지고 있음을 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우산의 크기에 따른 구체적인 해석을 덧붙입니다. has a lot of plans or protection은 위기가 닥쳤을 때 어떻게 대처할지에 대한 구체적인 해결책이 미리 준비되어 있거나, 자신을 지켜줄 든든한 지원군이 많다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that 명사절 접속사: 접속사 that이 이끄는 절이 동사 shows의 목적어 역할을 하는 완전한 문장 구조다.</div><div class=\"lec-gr-item\">a lot of (관용표현): &#39;많은&#39;이라는 의미의 형용사구로, 뒤에 오는 명사들(plans, protection)을 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protection</td><td class=\"m\">보호, 방어물, 보전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우산이 없다면</span><span class=\"en\"><b>If there’s no umbrella</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림 속에는</span><span class=\"en\"><b>in the drawing,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그린 사람은 어떤 방법도 가지고 있지 않습니다</span><span class=\"en\"><b>the drawer does not have any <span class=\"grammar-hl\">means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려운 상황을 헤쳐 나갈.</span><span class=\"en\"><b><span class=\"grammar-hl\">to deal with</span> difficult situations.</b></span></div></div><div class=\"lec-sent-ko\">만약 그림에 우산이 없다면, 그 그림을 그린 사람은 어려운 상황을 헤쳐 나갈 어떤 방법도 가지고 있지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 대조되는 상황을 제시하며 글을 마무리합니다. does not have any means to deal with difficult situations는 비를 맨몸으로 맞고 있는 것처럼, 현실의 문제를 해결하거나 버텨낼 방어 기제가 부족하여 무방비 상태에 놓여 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">means to deal with (to부정사): 형용사적 용법으로 명사 means(수단)를 수식하여 &#39;~을 처리할 수단&#39;이라는 의미를 만든다.</div><div class=\"lec-gr-item\">deal with (관용표현): &#39;~을 다루다&#39;, &#39;~을
