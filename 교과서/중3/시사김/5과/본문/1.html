하나에도 그 사람만의 독특한 개성(Personality)이 녹아있다는 점을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일상의 자기표현</div><ul><li>인간의 모든 행동과 선택은 그 사람이 어떤 사람인지를 보여주는 지표가 된다.</li><li>사용하는 언어(language)와 의복(clothes)의 영향</li><li>기르는 반려동물(pets)을 통해 드러나는 개인의 특성</li><li>핵심 키워드: 자기표현(self-expression)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02그림의 상징성</div><ul><li>그림을 그리는 행위도 다른 일상적 선택과 마찬가지로 내면을 투영한다.</li><li>무엇을 그리는지(what you draw)가 중요함</li><li>어떻게 그리는지(how you draw)에 담긴 개인의 양식</li><li>핵심 키워드: 성격(personality)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전문가의 활용</div><ul><li>의학계에서는 사람의 심리를 깊이 있게 파악하기 위해 그림을 도구로 사용한다.</li><li>의사(doctors)들이 환자를 이해하기 위한 수단</li><li>임상에서 활용되는 다양한 그림 검사(drawing tests)</li><li>핵심 키워드: 이해(understand)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">say something about</td><td class=\"m\">~에 대해 무엇인가를 나타내다, ~에 대해 시사하다</td></tr><tr><td class=\"w\">raise</td><td class=\"m\">(동물 등을) 기르다, 사육하다</td></tr><tr><td class=\"w\">somehow</td><td class=\"m\">왠지, 어쩐지, 어떻게든</td></tr><tr><td class=\"w\">be related to</td><td class=\"m\">~와 관련이 있다, ~와 연관되다</td></tr><tr><td class=\"w\">personality</td><td class=\"m\">성격, 인격, 개성</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마음 그리기</span><span class=\"en\"><b><span class=\"grammar-hl\">Drawing</span> the Mind</b></span></div></div><div class=\"lec-sent-ko\">마음 그리기</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 인간의 모든 행동에는 그 사람의 정체성이 담겨 있다는 핵심 전제를 제시합니다. Everything you do는 일상의 아주 사소한 습관부터 중요한 결정까지 모든 활동을 포괄하며, says something about you는 그러한 겉모습이 개인의 성격이나 성향을 드러내는 지표가 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Drawing (동명사): 명사구의 핵심 요소로 쓰여 &#39;그리는 것&#39; 또는 &#39;그리기&#39;라는 행위 개념을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 하는 모든 행동은</span><span class=\"en\"><b><span class=\"grammar-hl\">Everything you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가를 말해 준다</span><span class=\"en\"><b>says something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에 대해.</span><span class=\"en\"><b>about you.</b></span></div></div><div class=\"lec-sent-ko\">당신이 하는 모든 행동은 당신에 대해 말해 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 인간의 모든 행동에는 그 사람의 정체성이 담겨 있다는 핵심 전제를 제시합니다. Everything you do는 일상의 아주 사소한 습관부터 중요한 결정까지 모든 활동을 포괄하며, says something about you는 그러한 겉모습이 개인의 성격이나 성향을 드러내는 지표가 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Everything you do (관계대명사): 명사 Everything과 주어+동사(you do) 사이에 목적격 관계대명사(that)가 생략된 구조이며, 절 내부의 타동사 do의 목적어가 비어 있는 상태로 앞의 명사를 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 사용하는 언어, 당신이 입는 옷,</span><span class=\"en\"><b><span class=\"grammar-hl\">The language you use, the clothes you wear,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신이 기르는 애완동물조차도</span><span class=\"en\"><b><span class=\"grammar-hl\">and even the pets you raise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왠지 보여 준다</span><span class=\"en\"><b>somehow show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 어떤 종류의 사람인지를.</span><span class=\"en\"><b><span class=\"grammar-hl\">what kind of person you are</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 사용하는 언어, 당신이 입는 옷, 그리고 당신이 기르는 애완동물까지도 당신이 어떤 종류의 사람인지 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 추상적인 내용을 구체적인 사례(언어, 의복, 반려동물)를 들어 뒷받침합니다. show what kind of person you are는 우리가 무심코 선택하는 것들이 사실은 우리의 내면세계를 타인에게 전달하는 메시지 역할을 하고 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The language you use, the clothes you wear, and even the pets you raise (관계대명사): 명사들(language, clothes, pets) 뒤에 각각 목적격 관계대명사가 생략된 형용사절이 이어져 수식하는 구조다. use, wear, raise는 타동사이나 뒤에 목적어가 생략되어 있다.</div><div class=\"lec-gr-item\">what kind of person you are (간접의문문): 의문사구(what kind of person) + 주어(you) + 동사(are)의 어순으로 구성되어 동사 show의 목적어 역할을 하는 명사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">raise</td><td class=\"m\">(동물 등을) 기르다, 사육하다</td></tr><tr><td class=\"w\">somehow</td><td class=\"m\">왠지, 어쩐지, 어떻게든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 그리는 것들도</span><span class=\"en\"><b><span class=\"grammar-hl\">The things you draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">별로 다르지 않다.</span><span class=\"en\"><b>are not much different.</b></span></div></div><div class=\"lec-sent-ko\">당신이 그리는 그림도 마찬가지입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 행동 사례들에서 이 글의 본론인 &#39;그림&#39;으로 화제를 전환하는 연결 고리 역할을 합니다. not much different는 그림을 그리는 행위 역시 앞서 언급한 옷차림이나 언어 습관처럼 개인의 특성을 고스란히 반영하는 영역이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The things you draw (관계대명사): 명사 The things와 주어+동사(you draw) 사이에 목적격 관계대명사가 생략된 구조로, draw의 목적어가 빠진 상태에서 앞의 명사를 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 무엇을 그리는지와 그것을 어떻게 그리는지는</span><span class=\"en\"><b><span class=\"grammar-hl\">What you draw</span> and <span class=\"grammar-hl\">how you draw it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관련이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are related</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 성격과.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> your personality.</b></span></div></div><div class=\"lec-sent-ko\">당신이 그리는 것과 그것을 그려내는 방식은 당신의 성격과 관련이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장을 구체화하여 그림의 어떤 요소가 성격과 연결되는지 설명합니다. What you draw and how you draw it은 그림의 소재(대상)뿐만 아니라 선의 강약, 크기, 위치와 같은 표현 방식 모두가 personality, 즉 개인의 심리적 기질이나 내면 상태를 투영한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What you draw (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 명사절로, 문장에서 주어 역할을 하며 &#39;~하는 것&#39;으로 해석된다.</div><div class=\"lec-gr-item\">how you draw it (간접의문문): 의문사(how) + 주어(you) + 동사(draw) 어순의 명사절로, &#39;What you draw&#39;와 함께 and로 연결되어 복합 주어를 형성한다.</div><div class=\"lec-gr-item\">are related to (수동태): be동사(are)+p.p.(related) 구조. relate는 타동사인데 뒤에 목적어가 없어서 수동구조 are related 형태로 쓴다. 기본구조: relate A to B (A를 B와 관련시키다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personality</td><td class=\"m\">성격, 인격, 개성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">의사들은</span><span class=\"en\"><b>Doctors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 그림 그리기 검사를 사용해 오고 있다</span><span class=\"en\"><b>have been using various <span class=\"grammar-hl\">drawing tests</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 더 잘 이해하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to better understand</span> people.</b></span></div></div><div class=\"lec-sent-ko\">의사들은 사람들을 더 잘 이해하기 위해 다양한 그림 그리기 검사를 사용해 오고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림과 성격의 상관관계에 대한 원론적인 이야기를 넘어, 이것이 실제 의료 현장에서 어떻게 응용되는지 결론을 맺습니다. various drawing tests는 환자가 말로 다 표현하지 못하는 무의식이나 심리적 문제를 파악하기 위해 그림을 전문적인 진단 도구로 활용하고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">drawing tests (동명사): drawing이 &#39;그림 그리기&#39;라는 활동/용도의 의미로 쓰여 tests를 수식하는 명사+명사 결합의 형태다.</div><div class=\"lec-gr-item\">to better understand (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~을 더 잘 이해하기 위해서&#39;라는 의미를 나타내며, understand의 목적어로 people을 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간의 모든 행동과 선택에는 그 사람의 성격과 정체성이 반영된다.</li><li>언어, 옷, 반려동물처럼 우리가 그리는 그림 또한 우리의 내면을 보여주는 지표가 된다.</li><li>그림의 소재와 표현 방식은 개인의 심리 상태 및 기질과 깊은 관련이 있다.</li><li>이러한 원리를 바탕으로 의료 현장에서는 사람의 심리를 파악하기 위한 도구로 그림 검사를 활용한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Drawing reflects an individual’s personality, so medical professionals use drawing tests to better understand people&#39;s minds.</div>\n              <div class=\"lec-final-sum-ko\">그림은 개인의 성격을 반영하므로 의료 전문가들은 사람들의 마음을 더 잘 이해하기 위해 그림 검사를 활용한다.</div></div></div>"],"segs":[[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/1.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/2.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/3.mp3","hl":null},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/7.mp3","hl":null}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/8.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/11.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/14.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/17.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/20.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/21.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/22.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/23.mp3","hl":"main"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/24.mp3","hl":"meaning"},{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/25.mp3","hl":"grammar"}],[{"audio":"./중3 YBM(송) 5과 본문1_강의_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.
