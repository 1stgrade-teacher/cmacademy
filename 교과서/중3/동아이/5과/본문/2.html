대한 쓰레기 매립지 위에 세워진 마을로, 이곳 사람들에게는 악기를 구매할 경제적 여유가 없었기에 버려진 쓰레기를 재료로 악기를 만드는 업사이클링(Upcycling) 활동이 시작되었답니다. 이는 단순한 악기 제작을 넘어, &#39;쓰레기에서 희망을 연주한다&#39;는 상징적인 의미를 담고 있어요. 마치 우리가 낡고 버려진 물건에 새로운 가치를 불어넣어 멋진 예술 작품으로 재탄생시키듯, 이들은 열악한 환경을 창의적인 방식으로 극복하며 지역 사회에 새로운 꿈을 심어주고 있는 것이죠. 이러한 맥락을 이해하고 글을 읽으시면, 이들이 들려주는 음악이 단순한 연주 이상의 큰 감동과 울림으로 다가올 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01오케스트라 소개</div><ul><li>연주자 안드레아가 속한 &#39;재활용 오케스트라&#39;의 이름과 유래를 설명한다.</li><li>안드레아(Andrea)의 소속 단체 소개</li><li>악기 재료: 쓰레기 매립지에서 가져온 물건(objects from a landfill)</li><li>별칭: 랜드필 하모닉 오케스트라(Landfill Harmonic Orchestra)</li><li>핵심 키워드: 재활용 오케스트라(Recycled Orchestra)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02카테우라 마을의 배경</div><ul><li>오케스트라 단원들이 살고 있는 마을의 열악한 환경을 묘사한다.</li><li>파라과이의 작은 마을 카테우라(Cateura, Paraguay) 출신</li><li>거대한 쓰레기 매립지(huge landfill)가 마을에 존재</li><li>마을 전체가 쓰레기장으로 비유됨</li><li>핵심 키워드: 매립지(Landfill)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03변화의 시작</div><ul><li>어려운 환경 속에서 희망을 잃고 살던 마을에 찾아온 새로운 계기를 언급한다.</li><li>단원들 대부분이 가난한 환경에 처함</li><li>마을에 희망과 꿈(hopes and dreams)이 부족했음</li><li>파비오 차베스(Favio Chávez)를 만나며 상황이 변화하기 시작함</li><li>핵심 키워드: 변화(Change)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">violinist</td><td class=\"m\">바이올린 연주자, 바이올리니스트</td></tr><tr><td class=\"w\">be made of</td><td class=\"m\">~로 만들어지다, ~로 구성되다</td></tr><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 하치장</td></tr><tr><td class=\"w\">be known as</td><td class=\"m\">~로 알려지다, ~라는 이름으로 불리다</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한, 매우 큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 이름은 Andrea이다</span><span class=\"en\"><b>My name is Andrea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 바이올린 연주자이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">I’m a violinist</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Recycled Orchestra의</span><span class=\"en\"><b>in the Recycled Orchestra.</b></span></div></div><div class=\"lec-sent-ko\">내 이름은 Andrea이고 나는 Recycled Orchestra(재활용 오케스트라)의 바이올린 연주자이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 자기소개를 하며 자신이 속한 단체인 &#39;리사이클 오케스트라&#39;를 독자들에게 처음으로 소개하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m a violinist 2형식 구조: 주어(I) + be동사(’m) + 보어(a violinist)로 구성된 기본 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">violinist</td><td class=\"m\">바이올린 연주자, 바이올리니스트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜 그것은 불리는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Why is it called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Recycled Orchestra라고?</span><span class=\"en\"><b>the Recycled Orchestra?</b></span></div></div><div class=\"lec-sent-ko\">오케스트라가 왜 재활용 오케스트라로 불리냐고?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 단체 이름에 대한 독자들의 호기심을 유도하며, 이어질 문장에서 그 명칭이 붙게 된 구체적인 이유를 밝히기 위한 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is it called (수동태): be동사(is) + p.p.(called) 구조입니다. call은 타동사로 &#39;call + O + O/C(O를 O/C라고 부르다)&#39; 형태인데 목적어가 주어로 올라가 수동태가 되었으며, 뒤에 남은 보어(the Recycled Orchestra)가 그대로 위치합니다.</div><div class=\"lec-gr-item\">Why is it called (간접의문문): 의문사(Why)로 시작하는 의문문 구조로, 주어와 동사의 위치가 바뀐 도치(주어 it + be동사 is)가 발생한 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 때문이다</span><span class=\"en\"><b>It’s because</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 악기들이</span><span class=\"en\"><b>our musical instruments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들어져 있기</span><span class=\"en\"><b><span class=\"grammar-hl\">are made of</span> objects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기 매립지에서 나온 물건들로</span><span class=\"en\"><b>from a landfill.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우리의 악기들이 쓰레기 매립지에서 나온 물건들로 만들어져 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;리사이클&#39;이라는 명칭의 기원을 설명하는 대목입니다. 쓰레기 매립지의 물건을 악기로 재활용했다는 독특한 제작 방식을 통해 단체의 정체성을 분명히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are made of (수동태): be동사(are) + p.p.(made) 구조입니다. make는 타동사인데 뒤에 목적어가 없어서 수동구조(are made)를 씁니다. 기본구조: make + O(물건) + of(재료)로, 재료가 주어로 나간 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 하치장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 이유이다</span><span class=\"en\"><b>That’s why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 또한 알려져 있는</span><span class=\"en\"><b>it’s also known as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Landfill Harmonic Orchestra라고</span><span class=\"en\"><b>the Landfill Harmonic Orchestra.</b></span></div></div><div class=\"lec-sent-ko\">그것이 오케스트라가 Landfill Harmonic Orchestra로도 알려진 이유이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 악기의 출처를 언급한 앞 내용을 바탕으로, 이 오케스트라가 대중에게 불리는 또 다른 명칭을 소개하며 단체의 상징성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is also known as (수동태): be동사(is) + p.p.(known) 구조입니다. know는 타동사인데 목적어가 없어 수동구조(is known)를 씁니다. 기본구조: know + O + as + B(O를 B로 알다)에서 목적어가 주어로 올라가고 as B가 남은 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 하치장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오케스트라의 우리들 대부분은</span><span class=\"en\"><b><span class=\"grammar-hl\">Most of us in the orchestra</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Cateura 출신이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> from Cateura,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파라과이의 작은 마을인</span><span class=\"en\"><b>a small town in Paraguay.</b></span></div></div><div class=\"lec-sent-ko\">오케스트라의 우리들 대부분은 파라과이의 작은 마을인 카테우라 출신이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오케스트라의 배경이 되는 장소와 단원들의 출신지를 밝히며 독자들에게 이들의 삶의 터전을 구체적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most of us in the orchestra are 2형식 구조: 주어(Most of us in the orchestra) + be동사(are) + 보어(from Cateura)로 구성된 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">거대한 쓰레기 매립지가 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There is a huge landfill</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마을에는</span><span class=\"en\"><b>in our town.</b></span></div></div><div class=\"lec-sent-ko\">우리 마을에는 거대한 쓰레기 매립지가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 카테우라라는 마을의 환경적 특징을 설명합니다. 오케스트라가 악기를 얻게 된 원천이자, 마을이 처한 현실을 드러내는 핵심 장소입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There is a huge landfill (도치): 유도부사 There로 시작하여 주어(a huge landfill)와 동사(is)의 순서가 바뀐 도치 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 하치장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 사람들은</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 말한다</span><span class=\"en\"><b>even <span class=\"grammar-hl\">say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Cateura 자체가</span><span class=\"en\"><b><span class=\"grammar-hl\">that Cateura itself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대한 쓰레기 매립지라고</span><span class=\"en\"><b><span class=\"grammar-hl\">is a giant landfill</span>.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 사람들은 심지어 카테우라 자체가 거대한 쓰레기 매립지라고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마을의 빈곤함과 열악한 환경을 강조하기 위해 마을을 매립지 그 자체에 비유한 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">say that Cateura itself is a giant landfill (명사절(that절)): 타동사 say의 목적어 역할을 하는 that절입니다. 관계대명사와 달리 뒤에 완전한 문장(Cateura(S) is(V) a giant landfill(C))이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 하치장</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한, 매우 큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리들 중 많은 이들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Many of us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가난하다</span><span class=\"en\"><b><span class=\"grammar-hl\">are poor</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리들 중 많은 이들이 가난하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마을의 환경적 측면에 이어 경제적 빈곤이라는 단원들의 개인적인 상황을 직접적으로 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Many of us are poor 2형식 구조: 주어(Many of us) + be동사(are) + 형용사 보어(poor)로 구성된 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">없었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There weren’t</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 희망과 꿈이</span><span class=\"en\"><b><span class=\"grammar-hl\">many hopes and dreams</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 마을에는</span><span class=\"en\"><b>in our town.</b></span></div></div><div class=\"lec-sent-ko\">우리 마을에는 꿈과 희망이 많지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빈곤한 환경 때문에 마을 사람들이 미래에 대한 기대를 갖기 어려운 암울한 분위기였음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There weren’t many hopes and dreams (도치): 유도부사 There로 시작하여 주어(many hopes and dreams)와 동사(weren’t)의 순서가 바뀐 도치 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 것이 바뀌기 시작했다</span><span class=\"en\"><b>Everything <span class=\"grammar-hl\">began to change</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 Favio Chávez를 만났을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we met Favio Chávez</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 우리가 Favio Chávez 선생님을 만났을 때 모든 것이 바뀌기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술한 마을의 열악한 현실을 뒤집는 &#39;전환점&#39;을 제시합니다. 파비오 차베스라는 인물의 등장이 마을의 분위기를 긍정적으로 변화시켰음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">began to change (to부정사): 타동사 began의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">when we met Favio Chávez (관계부사(시간)): &#39;when + 주어(we) + 동사(met) + 목적어(Favio Chávez)&#39;로, 앞의 시점(time)을 부연 설명하는 절입니다. 뒤에 완전한 문장이 옵니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>파라과이의 가난한 마을 카테우라에는 거대한 쓰레기 매립지가 있다.</li><li>이 마을의 아이들은 쓰레기 매립지의 물건으로 악기를 만들어 &#39;리사이클 오케스트라&#39;를 결성했다.</li><li>희망이 없던 마을의 아이들에게 파비오 차베스라는 인물이 나타나 변화의 계기를 마련해 주었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Recycled Orchestra uses instruments made from landfill waste, and it has brought new hope to the impoverished town of Cateura through the guidance of Favio Chávez.</div>\n              <div class=\"lec-final-sum-ko\">재활용 오케스트라는 매립지 쓰레기로 만든 악기를 사용하며, 파비오 차베스의 지도 아래 가난한 마을 카테우라에 새로운 희망을 가져다주었다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio":"./2_audio/10.mp3","hl":"grammar"}],[{"audio":"./2_audio/11.mp3","hl":"main"},{"audio":"./2_audio/12.mp3","hl":"meaning"},{"audio":"./2_audio/13.mp3","hl":"grammar"}],[{"audio":"./2_audio/14.mp3","hl":"main"},{"audio":"./2_audio/15.mp3","hl":"meaning"},{"audio":"./2_audio/16.mp3","hl":"grammar"}],[{"audio":"./2_audio/17.mp3","hl":"main"},{"audio":"./2_audio/18.mp3","hl":"meaning"},{"audio":"./2_audio/19.mp3","hl":"grammar"}],[{"audio":"./2_audio/20.mp3","hl":"main"},{"audio":"./2_audio/21.mp3","hl":"meaning"},{"audio":"./2_audio/22.mp3","hl":"grammar"}],[{"audio":"./2_audio/23.mp3","hl":"main"},{"audio":"./2_audio/24.mp3","hl":"meaning"},{"audio":"./2_audio/25.mp3","hl":"grammar"}],[{"audio":"./2_audio/26.mp3","hl":"main"},{"audio":"./2_audio/27.mp3","hl":"meaning"},{"audio":"./2_audio/28.mp3","hl":"grammar"}],[{"audio":"./2_audio/29.mp3","hl":"main"},{"audio":"./2_audio/30.mp3","hl":"meaning"},{"audio":"./2_audio/31.mp3","hl":"grammar"}],[{"audio":"./2_audio/32.mp3","hl":"main"},{"audio":"./2_audio/33.mp3","hl":"meaning"},{"audio":"./2_audio/34.mp3","hl":"grammar"}],[{"audio":"./2_audio/35.mp3","hl":"main"},{"audio":"./2_audio/36.mp3","hl":"meaning"},{"audio":"./2_audio/37.mp3","hl":"grammar"}],[{"audio":"./2_audio/38.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementByI
