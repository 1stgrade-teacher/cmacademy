div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황과 문제 인식</div><ul><li>음악 교육을 원했던 파비오는 악기 부족이라는 현실적인 난관에 직면했다.</li><li>파비오의 직업: 환경 교육자(environmental educator)이자 음악가(musician)</li><li>마을의 문제: 악기가 거의 없으며 새로 살 여유가 없음(couldn’t afford)</li><li>핵심 키워드: 악기 부족(lack of musical instruments)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02창의적 대안 제시</div><ul><li>파비오는 포기하는 대신 매립지(landfill)의 물건들을 활용해 악기를 만들자는 아이디어를 냈다.</li><li>포기하지 않는 태도(didn’t give up)</li><li>매립지(landfill)에 버려진 재료 활용</li><li>핵심 키워드: 재활용 악기(recycled instruments)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03아이디어의 실행</div><ul><li>재능 있는 니콜라스는 파비오의 아이디어를 실천에 옮겨 쓸모없는 재료들을 실제 악기로 탈바꿈시켰다.</li><li>니콜라스의 실천: 아이디어를 현실로 구현(put into practice)</li><li>폐품 활용: 기름통을 바이올린으로 제작(violins from oil drums)</li><li>폐품 활용: 수도관을 플루트로 변형(water pipes into flutes)</li><li>핵심 키워드: 혁신(innovation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmental</td><td class=\"m\">환경의, 환경과 관련된</td></tr><tr><td class=\"w\">educator</td><td class=\"m\">교육자, 교사</td></tr><tr><td class=\"w\">afford</td><td class=\"m\">~할 여유가 있다, ~할 형편이 되다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 처리장</td></tr><tr><td class=\"w\">talented</td><td class=\"m\">재능 있는, 유능한</td></tr><tr><td class=\"w\">put into practice</td><td class=\"m\">실행하다, 실천하다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~으로 바꾸다, ~으로 변하게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Favio는</span><span class=\"en\"><b><span class=\"grammar-hl\">Favio</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 교육가이자 음악가</span><span class=\"en\"><b>an environmental educator and a musician.</b></span></div></div><div class=\"lec-sent-ko\">Favio 선생님은 환경 교육가이자 음악가였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 마을의 음악 교육을 이끌어갈 핵심 인물인 파비오의 신분을 소개하며 앞으로 벌어질 사건의 주체를 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Favio was (2형식): &#39;주어(Favio) + be동사(was) + 보어(an environmental educator and a musician)&#39; 구조로, 주어의 신분이나 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmental</td><td class=\"m\">환경의, 환경과 관련된</td></tr><tr><td class=\"w\">educator</td><td class=\"m\">교육자, 교사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 음악을 가르치고 싶어 했다,</span><span class=\"en\"><b>wanted <span class=\"grammar-hl\">to teach</span> us music,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 큰 문제가 있었다</span><span class=\"en\"><b>but there was a big problem.</b></span></div></div><div class=\"lec-sent-ko\">그는 우리에게 음악을 가르치고 싶어 했지만, 큰 문제가 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 파비오가 가진 교육적 열망과 그것을 실현하기에 앞서 닥친 현실적인 장벽을 대조하여 이후 전개될 해결 과정에 대한 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach (to부정사): &#39;want + 목적어(to부정사)&#39; 형태로, teach가 명사적 용법으로 쓰여 want의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 몇 개의 악기만이</span><span class=\"en\"><b>only a few musical instruments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온 마을에</span><span class=\"en\"><b>in the whole town.</b></span></div></div><div class=\"lec-sent-ko\">온 마을에 악기가 단지 몇 개뿐이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;큰 문제&#39;가 구체적으로 무엇인지 밝히며, 마을의 열악한 환경을 객관적인 상황으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were 유도부사 구문: &#39;There + be동사 + 주어&#39; 구조로, 주어(a few musical instruments)의 존재를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여유가 없었다</span><span class=\"en\"><b>couldn’t afford</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새 악기들을 살</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy</span> new ones.</b></span></div></div><div class=\"lec-sent-ko\">우리는 새 악기를 살 형편이 안 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경제적인 이유로 인해 악기를 구하는 것이 불가능하다는 점을 강조하여 상황이 매우 어려움을 재차 확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): &#39;afford + to부정사&#39; 형태로, 동사 afford의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">afford</td><td class=\"m\">~할 여유가 있다, ~할 형편이 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 Favio는</span><span class=\"en\"><b>But Favio</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포기하지 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">didn’t give up</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 Favio 선생님은 포기하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 난관에 부딪혔음에도 불구하고 주인공이 태도를 전환하여 해결책을 찾으려 함을 보여주며 이야기의 전환점을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t give up (관용표현): &#39;give up&#39;은 &#39;포기하다&#39;라는 의미의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다</span><span class=\"en\"><b>said</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 악기를 만들 수 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that we could make</span> musical instruments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기 매립지에서 나온 물건들로</span><span class=\"en\"><b>with objects from the landfill.</b></span></div></div><div class=\"lec-sent-ko\">그는 우리가 쓰레기 매립지에서 나온 물건들로 악기를 만들 수 있다고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 &#39;구매&#39; 방식이 아닌 &#39;재활용&#39;이라는 새로운 관점을 제시하며, 앞선 문제 상황을 해결할 실마리를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that we could make 명사절(접속사 that): &#39;said&#39;라는 타동사의 목적어 역할을 하는 명사절을 이끄는 접속사 that입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">landfill</td><td class=\"m\">쓰레기 매립지, 쓰레기 처리장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Nicholas라는 이름의 재주가 뛰어난 한 남자가</span><span class=\"en\"><b>A talented man <span class=\"grammar-hl\">named Nicholas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 생각을 옮길 수 있었다</span><span class=\"en\"><b>was able to put this idea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실행 속으로</span><span class=\"en\"><b>into practice.</b></span></div></div><div class=\"lec-sent-ko\">재주가 뛰어난 Nicholas 아저씨가 이 생각을 실행에 옮길 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 파비오의 추상적인 아이디어가 실질적인 행동으로 이어지도록 돕는 협력자를 등장시켜 목표 달성에 한 걸음 더 다가갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named Nicholas (과거분사(형용사)): &#39;named&#39;가 앞의 명사(man)를 수식합니다. 명사(man) + p.p.(named) 구조는 &#39;…라고 이름 붙여진 N&#39;으로 해석됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">talented</td><td class=\"m\">재능 있는, 유능한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b><span class=\"grammar-hl\">He</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바이올린을 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made violins</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기름통들로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from oil drums</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 기름통으로 바이올린을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이디어를 실천한 구체적인 사례를 제시하여 쓰레기가 가치 있는 악기로 변모했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He made violins from oil drums (3형식): &#39;주어(He) + 동사(made) + 목적어(violins) + 부사구(from oil drums)&#39; 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수도관들을 바꾸었다</span><span class=\"en\"><b><span class=\"grammar-hl\">turned water pipes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플루트로</span><span class=\"en\"><b><span class=\"grammar-hl\">into flutes</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 수도관을 플루트로 바꾸었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 버려진 물건을 악기로 재탄생시킨 또 다른 사례를 통해, 창의적인 태도가 자원 부족이라는 문제를 어떻게 극복하는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turned water pipes into flutes (관용표현): &#39;turn A into B&#39; 구조로, &#39;A를 B로 바꾸다&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>파비오는 마을 아이들에게 음악을 가르치려 했으나 악기 부족이라는 난관에 봉착했다.</li><li>새 악기를 살 형편이 안 되는 상황에서 그는 쓰레기 매립지의 물건을 활용하기로 했다.</li><li>니콜라스가 이 아이디어를 실행에 옮겨 버려진 기름통과 수도관으로 악기를 만들었다.</li><li>덕분에 열악한 환경 속에서도 음악 교육이라는 목표를 성취할 수 있었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The town lacked the funds to purchase new musical instruments, so they created functional violins and flutes using discarded waste from a landfill.</div>\n              <div class=\"lec-final-sum-ko\">마을은 새 악기를 구매할 자금이 부족했기에, 매립지에서 버려진 폐기물을 활용하여 실용적인 바이올린과 플루트를 제작했다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.mp3","hl":"meaning"},{"audio":"./3_audio/28.mp3","hl":"grammar"}],[{"audio":"./3_audio/29.mp3","hl":"main"},{"audio":"./3_audio/30.mp3","hl":"meaning"},{"audio":"./3_audio/31.mp3","hl":"grammar"}],[{"audio":"./3_audio/32.mp3","hl":"main"},{"audio":"./3_audio/33.mp3","hl":"meaning"},{"audio":"./3_audio/34.mp3","hl":"grammar"}],[{"audio":"./3_audio/35.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementB
