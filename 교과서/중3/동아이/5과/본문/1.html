여 보내는 열렬한 박수(big hand)</li><li>핵심 키워드: 오케스트라(orchestra), 박수(applause)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03긴 여정의 결실</div><ul><li>오늘의 성공적인 공연은 모두가 꿈꾸지 못했던 긴 과정 끝에 얻은 결과이다.</li><li>아무도 예상치 못했던 오늘(this day)의 성과</li><li>쉽지 않았던 지난날의 고된 여정(long journey)</li><li>핵심 키워드: 여정(journey), 기대(expect)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thrilled</td><td class=\"m\">아주 흥분한, 가슴이 벅찬</td></tr><tr><td class=\"w\">orchestra</td><td class=\"m\">오케스트라, 관현악단</td></tr><tr><td class=\"w\">give a hand</td><td class=\"m\">박수갈채를 보내다, 도움을 주다</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr><tr><td class=\"w\">journey</td><td class=\"m\">여행, 여정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기쁨의 눈물이</span><span class=\"en\"><b>Tears of joy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흘러내리고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are rolling</span> down</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 볼에</span><span class=\"en\"><b>my cheeks.</b></span></div></div><div class=\"lec-sent-ko\">기쁨의 눈물이 내 볼에 흘러내리고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 주인공이 처한 현재의 감정 상태를 시각적으로 묘사하여 공연이 성공적으로 끝났음을 암시하며 독자의 주의를 끕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are rolling (현재진행): be동사(are) + 현재분사(rolling)의 결합으로, 주어의 동작이 현재 일어나고 있음을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 정말 기쁘다</span><span class=\"en\"><b>I’m so happy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 황홀하다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">thrilled</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 정말 기쁘고 황홀하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 눈물의 구체적인 이유를 밝히며, 공연 직후 느끼는 주인공의 고양된 심리 상태를 직접적으로 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thrilled (과거분사): 주어(I)의 감정 상태를 설명하는 형용사적 보어 역할을 하며, 감정을 느끼는 주체임을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thrilled</td><td class=\"m\">아주 흥분한, 가슴이 벅찬</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 새라면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If I were a bird,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 날아오를 텐데</span><span class=\"en\"><b><span class=\"grammar-hl\">I would fly.</span></b></span></div></div><div class=\"lec-sent-ko\">내가 새라면, 날아오를 텐데.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 현재 느끼는 극도의 기쁨과 자유로움을 가정법을 통해 비유적으로 나타내며, 인간의 몸으로는 다 담을 수 없는 벅찬 감정을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If I were a bird, I would fly. 가정법 과거: 현재 사실과 반대되는 상황을 가정하는 문장입니다. if절의 be동사는 주어와 관계없이 과거형인 were를 쓰며, 주절에는 조동사 과거형(would) + 동사원형(fly)이 옵니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 주위를 둘러본다</span><span class=\"en\"><b><span class=\"grammar-hl\">I look around.</span></b></span></div></div><div class=\"lec-sent-ko\">나는 주위를 둘러본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자의 시선이 내부의 감정에서 외부의 상황으로 이동하고 있음을 나타내며, 다음 문장에서 나올 오케스트라 단원들과의 장면을 준비하는 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I look around. 기본 구조: 주어(I) + 자동사(look)로 이루어진 1형식 문장입니다. around는 방향을 나타내는 부사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 오케스트라의 다른 단원들은</span><span class=\"en\"><b>The other members in my orchestra</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">껴안고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are hugging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를</span><span class=\"en\"><b>one another.</b></span></div></div><div class=\"lec-sent-ko\">우리 오케스트라의 다른 단원들이 서로 껴안고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 혼자 느끼는 감정을 넘어, 함께 고생했던 동료들과 성공의 기쁨을 나누는 공동체의 모습을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are hugging (현재진행): be동사(are) + 현재분사(hugging)의 결합으로, 오케스트라 단원들이 서로 안고 있는 현재 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">orchestra</td><td class=\"m\">오케스트라, 관현악단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 연주회가</span><span class=\"en\"><b>Our concert</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제 막 끝났고</span><span class=\"en\"><b><span class=\"grammar-hl\">has just finished</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람들이</span><span class=\"en\"><b>and everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어서서</span><span class=\"en\"><b><span class=\"grammar-hl\">is standing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 큰 박수를 보내고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">and giving</span> us a big hand.</b></span></div></div><div class=\"lec-sent-ko\">우리의 연주회가 이제 막 끝났고 모든 사람들이 일어서서 우리에게 큰 박수를 보내고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공연이 대성공이었음을 구체적인 관객의 반응을 통해 증명하며, 주인공들이 느꼈던 감정의 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has just finished (현재완료): have + 과거분사(finished) 구조로, 동작이 막 완료되었음을 나타내는 완료 용법입니다.</div><div class=\"lec-gr-item\">is standing and giving (현재진행): be동사(is)가 공통으로 걸려 있는 현재분사(standing, giving) 병렬 구조입니다. 모두가 서서 손뼉을 치고 있는 동작의 상태를 보여줍니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 중 아무도</span><span class=\"en\"><b>None of us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상하지 못했다</span><span class=\"en\"><b>ever <span class=\"grammar-hl\">expected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 날이 올 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that this day would come</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리 중 아무도 이런 날이 올 거라고 예상하지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 성공의 장면과 대비되는 과거의 불확실했던 상황을 환기하며, 이 성취가 단순히 평범한 결과가 아니라 어려운 과정을 극복한 결과물임을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">expected that this day would come (목적어절): 타동사 expected의 목적어 역할을 하는 that절입니다. that은 명사절 접속사로, 완전한 문장을 이끌고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It has been</span> a long journey.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴 여정</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 긴 여정이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 모든 과정을 회상하며, 이번 공연을 완성하기까지 수많은 난관과 시간이 필요했음을 요약하고 그 노력의 가치를 되새깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It has been (현재완료): have + 과거분사(been) 구조로, 과거부터 지금까지의 상태를 나타내는 계속 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">journey</td><td class=\"m\">여행, 여정</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>오케스트라 공연이 대성공을 거두어 주인공은 벅찬 기쁨을 느낀다.</li><li>단원들과 기쁨을 나누고 관객의 환호를 받으며 지난 시간을 회상한다.</li><li>불확실했던 과거의 노력 끝에 드디어 결실을 보았음을 고백한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The orchestra members feel overwhelmed with joy because they successfully completed a concert despite their difficult journey.</div>\n              <div class=\"lec-final-sum-ko\">오케스트라 단원들은 힘든 여정 끝에 공연을 성공적으로 마쳤기에 기쁨을 주체하지 못하고 있다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{
