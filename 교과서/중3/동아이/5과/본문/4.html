의미를 찾는 활동을 &#39;문화적 회복탄력성(Cultural Resilience)&#39;이라고 부르는데, 이는 재활용 쓰레기로 악기를 만드는 행위처럼 부정적인 상황을 창의적으로 전복시키는 힘을 뜻해요. 마치 버려진 물건에서 보석 같은 선율을 찾아내듯, 예술이 개인의 삶과 공동체에 어떻게 긍정적인 변화를 일으키는지 주목하며 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시작과 배움</div><ul><li>악기 연주법과 악보를 몰랐던 아이들이 파비오의 도움으로 음악을 배우기 시작했다.</li><li>악기 연주와 악보 읽기에 대한 무지 (musical instruments, read music)</li><li>파비오의 끈기 있는 가르침 (patience)</li><li>단계적인 소리 내기 연습 시작</li><li>핵심 키워드: 인내(patience), 악기(musical instruments)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02첫 번째 성취</div><ul><li>어설픈 첫 연주였지만 아이들은 음악을 통해 새로운 희망을 발견했다.</li><li>짧고 음정이 맞지 않았던 첫 연주 (out of tune)</li><li>아이들에게 가장 아름답게 느껴졌던 음악</li><li>마음속에 피어난 새로운 희망 (hope)</li><li>핵심 키워드: 희망(hope), 불협화음(out of tune)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03연습과 기회</div><ul><li>매일 꾸준한 연습 끝에 아이들은 꿈에 그리던 실제 연주회를 앞두게 되었다.</li><li>매일 모여 진행한 꾸준한 연습 (practice)</li><li>파비오가 전해준 깜짝 소식 (great news)</li><li>실제 연주회(concert) 개최라는 기회 획득</li><li>핵심 키워드: 연습(practice), 콘서트(concert)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화된 결과</div><ul><li>세상이 보내준 쓰레기를 음악으로 승화시켜 관객들에게 큰 감동을 전하고 있다.</li><li>수백 명의 관객 앞에 선 현재의 모습</li><li>관객들의 뜨거운 호응과 사랑</li><li>세상의 쓰레기를 음악으로 되돌려주는 변화</li><li>핵심 키워드: 쓰레기(trash), 음악(music)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">musical instrument</td><td class=\"m\">악기</td></tr><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr><tr><td class=\"w\">step by step</td><td class=\"m\">단계적으로, 차근차근</td></tr><tr><td class=\"w\">out of tune</td><td class=\"m\">음정이 맞지 않는, 조화되지 않는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">from then on</td><td class=\"m\">그때부터, 그 이후로</td></tr><tr><td class=\"w\">in front of</td><td class=\"m\">~의 앞에</td></tr><tr><td class=\"w\">trash</td><td class=\"m\">쓰레기, 폐기물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 가지고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">We had</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 문제를</span><span class=\"en\"><b><span class=\"grammar-hl\">another problem.</span></b></span></div></div><div class=\"lec-sent-ko\">우리에게는 또 다른 문제가 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 어려움에 이어, 악기 연주법을 모른다는 새로운 장애물이 등장했음을 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We had another problem. (기본구조): 주어(We) + 타동사(had) + 목적어(another problem)의 3형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무도 몰랐다</span><span class=\"en\"><b>No one knew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악기 연주하는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to play</span> musical instruments.</b></span></div></div><div class=\"lec-sent-ko\">아무도 악기를 연주하는 법을 몰랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;문제&#39;가 구체적으로 무엇인지 설명하며, 주인공들이 음악적 지식이 전혀 없는 상태였음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to play (to부정사): &#39;의문사+to부정사&#39; 구조로, 명사구 역할을 하여 타동사 knew의 목적어로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">musical instrument</td><td class=\"m\">악기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 심지어 알지 못했다</span><span class=\"en\"><b>We didn’t even know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악보 읽는 법도</span><span class=\"en\"><b><span class=\"grammar-hl\">how to read</span> music.</b></span></div></div><div class=\"lec-sent-ko\">우리는 심지어 악보를 읽는 법도 알지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연주뿐만 아니라 음악의 기초인 악보 읽기조차 불가능했다는 점을 덧붙여, 당시 그들이 처한 열악한 상황을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to read (to부정사): &#39;의문사+to부정사&#39; 구조로, 명사구 역할을 하여 타동사 know의 목적어로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Favio는 가르쳤다 우리를</span><span class=\"en\"><b>Favio <span class=\"grammar-hl\">taught</span> us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄청난 인내심을 가지고</span><span class=\"en\"><b>with great patience.</b></span></div></div><div class=\"lec-sent-ko\">Favio 선생님은 엄청난 인내심을 가지고 우리를 가르쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아무것도 모르는 상태를 해결하기 위해 스승인 Favio가 헌신적인 노력을 기울였음을 보여주며, 이후의 변화를 이끄는 원동력을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taught (기본구조): 주어(Favio) + 타동사(taught) + 목적어(us) + 전치사구(with great patience)의 3형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">차근차근,</span><span class=\"en\"><b>Step by step,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 시작했다 어떤 소리들을 만들어 내기를</span><span class=\"en\"><b>we began <span class=\"grammar-hl\">to make</span> some sounds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 악기로</span><span class=\"en\"><b>on our instruments.</b></span></div></div><div class=\"lec-sent-ko\">점차로, 우리는 악기로 어떤 소리를 만들어 내기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 가르침 덕분에 주인공들이 아주 기초적인 단계부터 음악을 배우기 시작했음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make (to부정사): 타동사 began의 목적어 역할을 하는 명사적 용법의 to부정사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">step by step</td><td class=\"m\">단계적으로, 차근차근</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 아직 기억한다</span><span class=\"en\"><b>I still remember</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫 번째 곡을</span><span class=\"en\"><b>the first piece of music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 연주했던</span><span class=\"en\"><b><span class=\"grammar-hl\">that we played</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 아직도 우리가 연주했던 첫 곡을 기억한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 서툴렀던 시작의 순간을 회상하며, 그 경험이 주인공들에게 얼마나 특별한 의미를 지니는지 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that we played (관계대명사): that절이 앞의 선행사 the first piece of music를 수식하는 관계대명사절이다. played의 목적어가 생략된 목적격 관계대명사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 매우 짧았다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was very short</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 대부분 음이 맞지 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">and mostly out of tune.</span></b></span></div></div><div class=\"lec-sent-ko\">그 곡은 매우 짧고 대부분은 음이 맞지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 연주가 객관적으로는 미숙하고 완성도가 낮았음을 솔직하게 고백하며 이후에 나올 반전의 감동을 준비합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was very short and mostly out of tune. (기본구조): 주어(It) + be동사(was) + 보어(short, out of tune)로 구성된 2형식 문장이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">out of tune</td><td class=\"m\">음정이 맞지 않는, 조화되지 않는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 ~였다</span><span class=\"en\"><b>But it was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 아름다운 음악</span><span class=\"en\"><b>the most beautiful music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게는</span><span class=\"en\"><b><span class=\"grammar-hl\">to us</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그것은 우리에게는 가장 아름다운 곡이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장의 미숙함에도 불구하고, 노력의 결실을 맺었다는 점에서 주인공들이 느낀 성취감과 감동을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to us (관용표현): 형용사(beautiful) 뒤에서 대상이나 관점을 나타내는 전치사구로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 느꼈다</span><span class=\"en\"><b><span class=\"grammar-hl\">We felt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 희망을</span><span class=\"en\"><b><span class=\"grammar-hl\">a new hope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마음속에</span><span class=\"en\"><b><span class=\"grammar-hl\">in our hearts.</span></b></span></div></div><div class=\"lec-sent-ko\">우리는 마음속에 새로운 희망을 느꼈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 음악을 통해 단순한 소리를 넘어, 더 나은 미래를 꿈꿀 수 있게 되었다는 내면의 변화를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We felt a new hope in our hearts. (기본구조): 주어(We) + 타동사(felt) + 목적어(a new hope)의 3형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때부터,</span><span class=\"en\"><b>From then on,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 모였다</span><span class=\"en\"><b>we gathered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연습하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to practice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">그때부터, 우리는 매일 연습을 하기 위해 모였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 희망을 품은 뒤, 그 목표를 현실로 만들기 위해 주인공들이 얼마나 꾸준하고 성실하게 노력했는지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to practice (to부정사): 모인 목적을 나타내는 부사적 용법(목적)의 to부정사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">from then on</td><td class=\"m\">그때부터, 그 이후로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Favio는 말했다 우리에게</span><span class=\"en\"><b>Favio <span class=\"grammar-hl\">told</span> us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄청난 소식을</span><span class=\"en\"><b>some great news.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, Favio 선생님은 우리에게 엄청난 소식을 말해 줬다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상적인 연습의 결과로 드디어 공연이라는 구체적인 목표가 생겼음을 암시하며 분위기를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">told (기본구조): 주어(Favio) + 수여동사(told) + 간접목적어(us) + 직접목적어(some great news)의 4형식 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 공연을 하게 될 것이었다,</span><span class=\"en\"><b>We were going <span class=\"grammar-hl\">to have</span> a concert,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진짜 공연을!</span><span class=\"en\"><b>a real concert!</b></span></div></div><div class=\"lec-sent-ko\">우리는 공연을, 진짜 공연을 하게 될 것이었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 꿈에 그리던 무대에 서게 되었다는 사실에 주인공들이 느끼는 설렘과 놀라움을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to have (to부정사): 미래의 예정이나 계획을 나타내는 be+to부정사 구문으로 보어로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 지금 여기 있다</span><span class=\"en\"><b>And <span class=\"grammar-hl\">here we are</span> now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 명의 사람들 앞에</span><span class=\"en\"><b>in front of hundreds of people.</b></span></div></div><div class=\"lec-sent-ko\">그리고 우리는 지금 여기 수백 명의 사람들 앞에 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거의 연습 과정을 지나 현재는 당당히 무대에 올라선 시점임을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">here we are (도치): 부사구(here)가 문장 앞으로 오면서 주어(we)와 동사(are)의 위치가 바뀐 도치 구문이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in front of</td><td class=\"m\">~의 앞에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 사랑한다</span><span class=\"en\"><b><span class=\"grammar-hl\">They love</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 음악을</span><span class=\"en\"><b><span class=\"grammar-hl\">our music.</span></b></span></div></div><div class=\"lec-sent-ko\">그들은 우리의 음악을 사랑한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무대에 선 주인공들의 연주가 관객들에게 성공적으로 전달되었음을 짧고 명확하게 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They love our music. (기본구조): 주어(They) + 타동사(love) + 목적어(our music)의 3형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세상은 우리에게 보내지만 쓰레기를,</span><span class=\"en\"><b><span class=\"grammar-hl\">The world sends us trash</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 돌려보낸다 음악을!</span><span class=\"en\"><b>but we send back music!</b></span></div></div><div class=\"lec-sent-ko\">세상은 우리에게 쓰레기를 보내지만, 우리는 음악을 돌려보낸다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재활용 쓰레기로 만든 악기를 사용한다는 배경을 바탕으로, 척박한 환경을 아름다운 예술로 승화시킨 주인공들의 의지를 강렬하게 선포하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The world sends us trash (기본구조): 주어(The world) + 수여동사(sends) + 간접목적어(us) + 직접목적어(trash)의 4형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trash</td><td class=\"m\">쓰레기, 폐기물</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>악기 연주와 악보 읽기조차 몰랐던 아이들이 스승의 도움으로 음악을 배우기 시작했다.</li><li>서툴고 미숙한 첫 연주였지만, 아이들은 그 안에서 희망을 발견하고 매일 연습에 매진했다.</li><li>마침내 관객 앞 무대에 서게 되었고, 쓰레기를 음악으로 바꾸는 기적을 이뤄냈다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The group learned to play music with Favio&#39;s dedicated guidance, and they eventually transformed their humble beginnings into a source of pride for the audience.</div>\n              <div class=\"lec-final-sum-ko\">그들은 Favio의 헌신적인 지도 아래 악기 연주를 배웠으며, 결국 미약했던 시작을 청중을 위한 자부심의 원천으로 바꾸었다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl
