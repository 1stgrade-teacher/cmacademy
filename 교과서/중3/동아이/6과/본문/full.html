e-1\"><div class=\"lec-stage-head\">02가우디의 사그라다 파밀리아</div><ul><li>건축가들은 자연의 구조를 건축물 내부로 가져와 조화롭게 구현했습니다.</li><li>스페인의 사그라다 파밀리아(Sagrada Familia) 교회</li><li>내부 기둥을 나무(trees)의 모습으로 형상화</li><li>핵심 키워드: 안토니 가우디(Antoni Gaudi)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03시드니 오페라 하우스의 반전</div><ul><li>때로는 자연의 모티브가 직관적이지 않을 수 있으며, 건축가의 상상력이 더해집니다.</li><li>겉으로 드러나지 않는 독창적인 영감(imagination)</li><li>파도나 돛단배가 아닌 오렌지 껍질(orange peels)에서 유래</li><li>핵심 키워드: 이외른 웃존(Jørn Utzon)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04동대문 디자인 플라자(DDP)</div><ul><li>도심 속에서 자연의 곡선을 활용하여 시민들에게 심미적 즐거움을 제공합니다.</li><li>우주선처럼 보이지만 자연의 곡선(curved lines)을 차용</li><li>도시인들에게 자연의 아름다움을 선사함</li><li>핵심 키워드: 자하 하디드(Zaha Hadid)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>건축은 자연과 도시가 만나는 지점이며 인간의 창의성을 보여줍니다.</li><li>자연과 도시의 결합(Nature meets city)</li><li>건축 디자인에 반영된 자연의 미(beauty of nature)</li><li>자연에서 영감을 받는 건축가의 역할(architect)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imitate</td><td class=\"m\">모방하다, 흉내 내다</td></tr><tr><td class=\"w\">inspiration</td><td class=\"m\">영감, 고무적인 것</td></tr><tr><td class=\"w\">pleasing</td><td class=\"m\">즐거운, 만족스러운</td></tr><tr><td class=\"w\">delicate</td><td class=\"m\">섬세한, 연약한</td></tr><tr><td class=\"w\">exist</td><td class=\"m\">존재하다, 살아가다</td></tr><tr><td class=\"w\">architect</td><td class=\"m\">건축가, 설계자</td></tr><tr><td class=\"w\">column</td><td class=\"m\">기둥, 원주</td></tr><tr><td class=\"w\">bring ~ indoors</td><td class=\"m\">~을 실내로 들여오다</td></tr><tr><td class=\"w\">obvious</td><td class=\"m\">분명한, 명백한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">add</td><td class=\"m\">추가하다, 더하다</td></tr><tr><td class=\"w\">interestingly</td><td class=\"m\">흥미롭게도, 재미있게도</td></tr><tr><td class=\"w\">peel</td><td class=\"m\">껍질</td></tr><tr><td class=\"w\">shine</td><td class=\"m\">비추다, 빛나다</td></tr><tr><td class=\"w\">curved</td><td class=\"m\">곡선의, 굽은</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">attraction</td><td class=\"m\">명소, 매력</td></tr><tr><td class=\"w\">capture</td><td class=\"m\">포착하다, 사로잡다</td></tr><tr><td class=\"w\">meet</td><td class=\"m\">만나다, 접하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연,</span><span class=\"en\"><b><span class=\"grammar-hl\">Nature Meets City</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만나다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(자연, 도시를 만나다)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 자연이 예술적 영감의 원천이 된다는 보편적인 통념을 제시하며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Nature Meets City 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meet</td><td class=\"m\">만나다, 접하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 들어본 적이 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you heard</span> of the expression, “Art imitates nature”?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 표현을,</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;예술은 자연을 모방한다&quot;라는</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">‘예술이 자연을 모방한다&#39;라는 표현을 들어 본 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 자연이 예술적 영감의 원천이 된다는 보편적인 통념을 제시하며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you heard (현재완료): 과거의 경험이 현재까지 영향을 미침을 나타내는 구조(have + p.p.)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imitate</td><td class=\"m\">모방하다, 흉내 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 예술가들은</span><span class=\"en\"><b>Many artists get their ideas and inspirations from the world <span class=\"grammar-hl\">around them</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얻습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 아이디어와 영감을</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 주변의 세계로부터</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">많은 예술가들이 아이디어와 영감을 그들 주변의 세상에서 얻는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 표현을 구체적인 예술가들의 작업 방식으로 연결하여 자연이 창작의 재료임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">around them (전치사구): around가 them을 목적어로 취하여 앞의 명사 the world를 수식하는 형용사적 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inspiration</td><td class=\"m\">영감, 고무적인 것</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~하기 때문입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">This is because</span> the natural world is a beautiful place.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연 세계가</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 곳</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이는 자연계가 아름다운 곳이기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술가들이 왜 자연에서 영감을 얻는지에 대한 근본적인 이유를 제시하며, 이어질 자연의 심미적 가치에 대한 논의의 기반을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is because (관용표현): This is because + S + V(결과에 대한 이유를 설명하는 구문)</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연 속의 형태들은</span><span class=\"en\"><b>The shapes in nature are very <span class=\"grammar-hl\">pleasing</span> to the eye.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 즐겁습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">보기에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">자연의 형태는 보기에 매우 좋다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 ‘아름다운 장소’라는 추상적 개념을 ‘눈을 즐겁게 하는 형태’라는 시각적 요소로 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pleasing (현재분사): 주어 The shapes의 상태를 설명하는 보어로 쓰인 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pleasing</td><td class=\"m\">즐거운, 만족스러운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example, <span class=\"gramma mar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that the building looks like 명사절 접속사: think의 목적어로 쓰여 뒤의 that절 내용을 이끔</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그 건축가는,</span><span class=\"en\"><b>But the architect,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자하 하디드는</span><span class=\"en\"><b>Zaha Hadid,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연에서 곡선들을 따왔다</span><span class=\"en\"><b>took the curved lines from nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">so that city people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 즐길 수 있도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">could enjoy them</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 건축가인 Zaha Hadid는 도시 사람들이 즐길 수 있도록 자연에서 곡선을 가져왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중이 우주선으로 오해했던 곡선미가 사실은 자연에서 온 것임을 밝히며 작가의 의도를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so that city people could enjoy them (접속사(목적)): so that + S + V는 &#39;~하기 위해서&#39;라는 부사적 목적을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가, 설계자</td></tr><tr><td class=\"w\">curved</td><td class=\"m\">곡선의, 굽은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 특별한 디자인 덕분에,</span><span class=\"en\"><b>Thanks to its special design,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 되었다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">has become</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 관광 명소가</span><span class=\"en\"><b>a popular tourist attraction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서울의.</span><span class=\"en\"><b>in Seoul.</b></span></div></div><div class=\"lec-sent-ko\">이 특별한 디자인 덕분에, 동대문 디자인 플라자는 서울의 인기 있는 관광 명소가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연적 미감을 건축에 접목한 결과가 도시의 문화적 활력으로 이어졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has become (현재완료): 과거에 시작된 변화가 현재 상태에 이르렀음을 나타냄(have + p.p.)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">attraction</td><td class=\"m\">명소, 매력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 32 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보시다시피,</span><span class=\"en\"><b><span class=\"grammar-hl\">As you can see</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 건물들이 담으려고 노력한다</span><span class=\"en\"><b>many buildings try to capture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연의 아름다움을</span><span class=\"en\"><b>the beauty of nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디자인 속에.</span><span class=\"en\"><b>in their design.</b></span></div></div><div class=\"lec-sent-ko\">보는 바와 같이, 많은 건물들이 디자인에 자연의 아름다움을 담아내려고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다양한 사례를 통해 건축이 자연을 모방하고 형상화하려는 시도를 총괄적으로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As you can see 접속사: &#39;~하는 것처럼&#39;의 의미를 가진 절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capture</td><td class=\"m\">포착하다, 사로잡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 33 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 완벽한 예시이다</span><span class=\"en\"><b><span class=\"grammar-hl\">They are perfect examples</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;자연과 도시의 만남&quot;의.</span><span class=\"en\"><b><span class=\"grammar-hl\">of “Nature</span> meets city.”</b></span></div></div><div class=\"lec-sent-ko\">이 건물들은 &#39;자연이 도시를 만나다&#39;의 완벽한 예이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건축 속에 녹아든 자연이 결국 도시와 공존하는 모습을 보여주며 글의 핵심 주제를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They are perfect examples of “Nature 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meet</td><td class=\"m\">만나다, 접하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 34 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 건축가라면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If you were an architect</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 선택하겠습니까</span><span class=\"en\"><b>what would you choose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연에서</span><span class=\"en\"><b>from nature?</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 건축가라면, 자연에서 무엇을 선택할 텐가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 스스로 자연과 건축의 관계를 고민하게 하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you were an architect 가정법 과거: 현재 사실과 반대되는 가정(If + S + 과거동사, S + 조동사과거 + V)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">architect</td><td class=\"m\">건축가, 설계자</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자연은 아름다운 형태를 지니고 있어 많은 건축가에게 영감을 준다.</li><li>사그라다 파밀리아는 나무의 형태를 실내에 구현해 자연의 아름다움을 표현했다.</li><li>시드니 오페라 하우스는 오렌지 껍질의 형상을 현대적으로 재해석하여 완성했다.</li><li>동대문 디자인 플라자는 자연의 곡선을 담아 도시인들에게 심미적 경험을 선사한다.</li><li>건축은 자연의 요소를 디자인에 녹여내어 &#39;자연과 도시의 만남&#39;을 구현한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Architects draw inspiration from natural elements to create unique structures, as these designs successfully integrate the beauty of nature into modern city buildings.</div>\n              <div class=\"lec-final-sum-ko\">건축가들은 자연 요소에서 영감을 받아 독특한 구조물을 창조하며, 이러한 디자인은 자연의 아름다움을 현대 도시 건물에 성공적으로 통합한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],
