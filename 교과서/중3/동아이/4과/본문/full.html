 속에서 소년들이 겪는 변화와 예상치 못한 모험을 따라가다 보면, 왜 이 글의 제목이 단순하게 &#39;구멍들&#39;인지를 자연스럽게 깨닫게 되실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01캠프 그린 레이크의 고된 일상</div><ul><li>스탠리는 가혹한 환경의 캠프 그린 레이크에서 힘겨운 노동을 강요받고 있다.</li><li>캠프 그린 레이크(Camp Green Lake)의 열악한 환경과 무의미한 노동</li><li>미스터 서(Mr. Sir)의 가혹한 지시와 신체적 고통</li><li>핵심 키워드: 그린 레이크 캠프(Camp Green Lake), 노동(Digging)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02스탠리의 억울한 사연</div><ul><li>스탠리는 잘못된 시간과 장소에 있었던 탓에 운동화 절도범으로 오해받아 이곳에 왔다.</li><li>유명 야구 선수 클라이드 리빙스턴(Clyde Livingstone)의 운동화 사건</li><li>하늘에서 떨어진 운동화를 줍게 된 불운</li><li>핵심 키워드: 누명(Wrongly accused), 운동화(Sneakers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03수용소 생활과 규칙</div><ul><li>스탠리는 D그룹에 배정되어 인격 수양이라는 명목 아래 매일 정해진 크기의 구덩이를 판다.</li><li>매일 150cm 깊이와 너비의 구덩이를 파야 하는 규칙</li><li>엑스레이, 제로 등 독특한 별명을 가진 동료들</li><li>핵심 키워드: 인격 수양(Build character), 그룹 D(Group D)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04뜻밖의 발견</div><ul><li>노동 중이던 스탠리는 땅속에서 의문의 금색 물체를 발견하며 사건의 새로운 국면을 맞이한다.</li><li>구덩이를 파던 중 발견한 빛나는 금색 튜브(Gold tube)</li><li>발견자에게 주어지는 휴식 기회에 대한 기대</li><li>튜브 바닥에 새겨진 의문의 이니셜 KB</li><li>핵심 키워드: 금색 튜브(Gold tube), 이니셜(Initials)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dig harder</td><td class=\"m\">더 열심히 파다, 힘내어 파다</td></tr><tr><td class=\"w\">the harder ~ the faster ~</td><td class=\"m\">~할수록 더 빨리 ~하다</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로는</td></tr><tr><td class=\"w\">wrong place at the wrong time</td><td class=\"m\">잘못된 장소, 잘못된 시기</td></tr><tr><td class=\"w\">belong to</td><td class=\"m\">~의 소유이다, ~에게 속하다</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다, 결국 ~에 처하게 되다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be assigned to</td><td class=\"m\">~에 배정되다, ~에 배치되다</td></tr><tr><td class=\"w\">build character</td><td class=\"m\">인격을 형성하다, 성격을 함양하다</td></tr><tr><td class=\"w\">take the day off</td><td class=\"m\">하루 휴가를 내다, 하루 쉬다</td></tr><tr><td class=\"w\">brush off</td><td class=\"m\">털어내다, 무시해 버리다</td></tr><tr><td class=\"w\">stand for</td><td class=\"m\">~을 의미하다, ~을 상징하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;더 열심히 파라, 스탠리!</span><span class=\"en\"><b>“Dig harder, Stanley!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 열심히 팔수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">The harder you dig,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 빨리 끝낼 것이다!&quot; 라고</span><span class=\"en\"><b><span class=\"grammar-hl\">the faster you’ll finish</span>!”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미스터 서가 소리쳤다.</span><span class=\"en\"><b>yelled Mr. Sir.</b></span></div></div><div class=\"lec-sent-ko\">( &quot;더 열심히 파라, 스탠리! 더 열심히 팔수록, 더 빨리 끝낼 것이다!&quot; 미스터 서가 소리쳤다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 주인공 스탠리가 처한 가혹한 환경을 암시하며, 앞으로 이어질 고된 노동의 시작을 알리는 대사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The harder you dig, the faster you’ll finish (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로 &#39;~하면 할수록 더 ~하다&#39;라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dig harder</td><td class=\"m\">더 열심히 파다, 힘내어 파다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리 옐네츠는</span><span class=\"en\"><b>Stanley Yelnats couldn’t dig any harder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상 열심히 팔 수 없었는데</span><span class=\"en\"><b>since every single muscle hurt.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 근육이 아팠기 때문에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Stanley Yelnats는 모든 근육 하나하나가 아팠기 때문에 더 열심히 팔 수가 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 미스터 서가 독촉한 상황에 대해 스탠리가 신체적인 한계에 다다랐음을 보여주며, 그가 겪는 고통을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn&#39;t dig (to부정사): dig은 타동사로 뒤에 부사(harder)가 왔으며, 조동사 couldn&#39;t 뒤에 동사원형으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 목이 말랐고</span><span class=\"en\"><b><span class=\"grammar-hl\">He was thirsty</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배가 고팠다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and hungry.</span></b></span></div></div><div class=\"lec-sent-ko\">그는 목이 마르고 배가 고팠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고된 노동으로 인해 스탠리가 겪는 생리적인 결핍을 서술하여 그가 처한 상황의 비참함을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He was thirsty and hungry. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 원했는데</span><span class=\"en\"><b>He wanted <span class=\"grammar-hl\">to go</span> home.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 가기를.</span> </div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장에서 호수가 없다고 한 이유를 뒷받침하며, 그곳이 사람이 지내기에 얼마나 척박한 환경인지를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Camp Green Lake was hot and 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b><span class=\"grammar-hl\">In fact</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳은 캠프조차 아니었다.</span><span class=\"en\"><b>it wasn’t even a camp.</b></span></div></div><div class=\"lec-sent-ko\">사실 그곳은 캠프도 아니었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 흔히 생각하는 &#39;캠프&#39;라는 즐거운 이미지와 완전히 상반된 장소임을 강조하며 독자의 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In fact (관용표현): &#39;사실은&#39;이라는 의미로 앞의 내용을 부연하거나 강조할 때 쓰는 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳은 장소였는데</span><span class=\"en\"><b>It was <span class=\"grammar-hl\">a place</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나쁜 소년들을 위한.</span><span class=\"en\"><b><span class=\"grammar-hl\">for bad boys</span>.</b></span></div></div><div class=\"lec-sent-ko\">그곳은 나쁜 소년들을 위한 곳이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠프의 진정한 목적을 밝히며, 왜 스탠리가 그곳에 있는지에 대한 단서를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a place for bad boys 5형식(SVOC) 구조와 유사하게, &#39;place&#39;라는 명사 뒤에 &#39;bad boys&#39;가 전치사 for를 매개로 연결되어 내용을 구체화합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스탠리 같은 착한 소년이 무엇을</span><span class=\"en\"><b>what was a good boy like Stanley</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기서 하고 있었던 것일까?</span><span class=\"en\"><b>doing here?</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 Stanley 같이 착한 소년이 여기서 무엇을 하고 있었을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 스탠리가 이곳에 오게 된 배경에 의문을 갖게 하고 다음 이야기로 자연스럽게 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was doing (현재진행): be동사(was) + 현재분사(doing) 형태로 과거의 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 보내졌는데</span><span class=\"en\"><b>He <span class=\"grammar-hl\">was sent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 캠프로</span><span class=\"en\"><b>to the camp</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동화 한 켤레를 훔친 죄로.</span><span class=\"en\"><b>for stealing a pair of sneakers.</b></span></div></div><div class=\"lec-sent-ko\">그는 운동화 한 켤레를 훔쳤다는 이유로 그 캠프에 보내졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리가 왜 &#39;나쁜 소년&#39;들의 장소에 있게 되었는지 그 이유를 명확하게 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was sent (수동태): be동사(was)+p.p.(sent) 구조. send는 타동사인데 목적어가 없어서 수동구조 was sent 형태로 씁니다. 기본구조: send + O(사람) + to(장소) (O를 장소로 보내다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리는</span><span class=\"en\"><b><span class=\"grammar-hl\">Stanley didn’t really steal a pair</span> of sneakers.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 훔친 것이 아니었는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동화 한 켤레를.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Stanley가 정말로 운동화 한 켤레를 훔친 것은 아니었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시된 범죄 사실을 반박하며, 사건의 진상이 우리가 아는 것과 다를 수 있음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Stanley didn’t really steal a pair 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그저 잘못된 장소에 있었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">He was just in the wrong</span> place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 시간에.</span><span class=\"en\"><b>at the wrong time.</b></span></div></div><div class=\"lec-sent-ko\">그는 그저 잘못된 시간에 잘못된 장소에 있었을 뿐이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리가 억울한 상황에 처했음을 암시하며, 그가 범죄자가 아님을 옹호하는 설명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He was just in the wrong 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wrong place at the wrong time</td><td class=\"m\">잘못된 장소, 잘못된 시기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 집으로 걸어오고 있었는데</span><span class=\"en\"><b>he <span class=\"grammar-hl\">was walking</span> home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에서.</span><span class=\"en\"><b>from school.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 그는 학교에서 집으로 걸어가고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평범한 일상 중에 사건의 발단이 되는 상황으로 독자를 안내합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was walking (현재진행): be동사(was) + 현재분사(walking) 구조로 과거의 특정 시점에 진행 중이던 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기,</span><span class=\"en\"><b><span class=\"grammar-hl\">Suddenly,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낡은 운동화 한 켤레가</span><span class=\"en\"><b><span class=\"grammar-hl\">a pair of old sneakers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에서 떨어졌다.</span><span class=\"en\"><b>fell from the sky.</b></span></div></div><div class=\"lec-sent-ko\">갑자기, 낡은 운동화 한 켤레가 하늘에서 떨어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비현실적인 사건의 시작을 알리며, 스탠리가 어떻게 운동화와 엮이게 되었는지 사건의 결정적 순간을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Suddenly, a pair of old sneakers 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 운동화는</span><span class=\"en\"><b><span class=\"grammar-hl\">The sneakers hit him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 때렸는데</span><span class=\"en\"><b><span class=\"grammar-hl\">on the</span> head.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">머리에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그 운동화는 그의 머리에 맞았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 운동화가 우연히 스탠리에게 전달된 상황을 구체화하여, 그가 의도하지 않은 사건의 휘말림을 생생하게 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The sneakers hit him on the 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 달리기 시작했다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">started running</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동화를 신고</span><span class=\"en\"><b>with the sneakers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지께 말씀드리기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to tell</span> his father</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무슨 일이 일어났는지를.</span><span class=\"en\"><b>what happened.</b></span></div></div><div class=\"lec-sent-ko\">그는 그의 아버지에게 무슨 일이 일어났는지 말하려고 운동화를 가지고 달리기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리가 운동화를 훔친 것이 아니라, 단순히 상황을 알리려 했다는 무고함을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started running (현재분사): start라는 동사의 목적어로서 동작의 상태를 강조하며, &#39;달리는 것을 시작했다&#39;는 의미를 나타냅니다.</div><div class=\"lec-gr-item\">to tell (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇 분 후,</span><span class=\"en\"><b>A few minutes later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경찰이 스탠리를 멈춰 세우고</span><span class=\"en\"><b>the police stopped Stanley</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게 물었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">asked him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그가 달리고 있었는지를.</span><span class=\"en\"><b><span class=\"grammar-hl\">why he was running</span>.</b></span></div></div><div class=\"lec-sent-ko\">몇 분 후에, 경찰이 Stanley를 멈춰 세웠고 그가 왜 달리고 있었을지를 그에게 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오해가 발생하는 직접적인 계기를 보여주며, 상황이 스탠리에게 불리하게 돌아가고 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked him why he was running (간접의문문): &#39;의문사(why) + S(he) + V(was running)&#39;의 어순으로, asked의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리에게 불행하게도,</span><span class=\"en\"><b>Unfortunately for Stanley,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 운동화는 ~의 것이었다</span><span class=\"en\"><b>the sneakers <span class=\"grammar-hl\">belonged to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 야구 선수인 클라이드 리빙스턴의</span><span class=\"en\"><b>a famous baseball player, Clyde Livingstone.</b></span></div></div><div class=\"lec-sent-ko\">Stanley에게는 불행히도, 그 운동화는 유명한 야구 선수인 Clyde Livingstone의 것이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건의 심각성을 증폭시키는 핵심 정보로, 왜 스탠리가 절도범으로 오해받았는지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">belonged to (관용표현): &#39;~에 속하다&#39;라는 의미의 자동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 ~한 이유였다</span><span class=\"en\"><b>That was why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스탠리가 오게 된</span><span class=\"en\"><b>Stanley <span class=\"grammar-hl\">ended up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠프 그린 레이크에.</span><span class=\"en\"><b>at Camp Green Lake.</b></span></div></div><div class=\"lec-sent-ko\">그것이 Stanley가 그린레이크 캠프에 오게 된 이유였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리의 억울한 누명과 그 결과로 캠프에 오게 된 인과관계를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ended up (관용표현): &#39;결국 ~하게 되다&#39;라는 의미의 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리는 배정되었다</span><span class=\"en\"><b>Stanley <span class=\"grammar-hl\">was assigned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">D 그룹에</span><span class=\"en\"><b>to Group D</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠프의.</span><span class=\"en\"><b>in the camp.</b></span></div></div><div class=\"lec-sent-ko\">Stanley는 캠프에서 D 그룹에 배치되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠프 내에서의 스탠리의 소속을 밝히며, 새로운 환경에서의 생활이 시작됨을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was assigned (수동태): be동사(was)+p.p.(assigned) 구조. assign은 타동사인데 목적어가 없어서 수동구조 was assigned 형태로 씁니다. 기본구조: assign + O + to(장소/그룹) (O를 ~에 배정하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">6명의 다른 소년들이 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were six other boys</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스탠리의 그룹에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in</span> Stanley’s group.</b></span></div></div><div class=\"lec-sent-ko\">Stanley의 그룹에는 6명의 다른 소년들이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠프의 공동체 상황을 보여주며, 앞으로의 이야기에서 이들이 어떤 역할을 할지 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were six other boys in 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 모두 멋진 이름을 가지고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">They all had cool names</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엑스레이, 지그재그, 제로와 같은.</span><span class=\"en\"><b><span class=\"grammar-hl\">like</span> X-Ray, Zigzag and Zero.</b></span></div></div><div class=\"lec-sent-ko\">그들은 모두 X-Ray, Zigzag, Zero와 같은 멋진 이름을 가지고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이들의 별명을 통해 캠프 내의 문화나 각 인물의 개성을 독자에게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They all had cool names like 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 소년은</span><span class=\"en\"><b>Each boy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구멍 하나를 파야 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">had to dig</span> one hole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일.</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">각 소년은 매일 구덩이를 하나씩 파야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 캠프가 소년들에게 강요하는 고된 노동의 실체를 구체적으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to dig (to부정사): dig은 타동사로 had to(의무)의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~여야 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">It had to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깊이 약 150cm</span><span class=\"en\"><b>about 150cm deep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 폭 150cm.</span><span class=\"en\"><b>and 150cm wide.</b></span></div></div><div class=\"lec-sent-ko\">그것은 150cm 정도 깊이와 150cm 정도 너비여야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구덩이 파기 노동의 규모를 수치로 제시하여, 그 일이 신체적으로 얼마나 힘든지를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It had to be (to부정사): be동사가 의무 표현(had to) 뒤에 동사원형으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미스터 써는 말했다,</span><span class=\"en\"><b>Mr. Sir said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희는 파는 것이다</span><span class=\"en\"><b>“You <span class=\"grammar-hl\">are digging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인격을 형성하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to build</span> character.”</b></span></div></div><div class=\"lec-sent-ko\">Sir 씨는 “너희들은 인격을 수양하기 위해 구덩이를 파고 있는 거야.”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠프 운영진의 기만적인 명분을 보여주며, 노동의 고통과 명분 사이의 괴리를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are digging (현재진행): be동사(are) + 현재분사(digging) 구조입니다.</div><div class=\"lec-gr-item\">to build (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;의 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">build character</td><td class=\"m\">인격을 형성하다, 성격을 함양하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리는 더 많이 팔수록</span><span class=\"en\"><b><span class=\"grammar-hl\">The more Stanley dug,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 강해졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">the stronger he became</span>.</b></span></div></div><div class=\"lec-sent-ko\">Stanley는 많이 파면 팔수록, 더 힘이 세져 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고통스러운 노동이 스탠리에게 미친 뜻밖의 긍정적인 신체적 변화를 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more Stanley dug, the stronger he became (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로 &#39;~하면 할수록 더 ~하다&#39;라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 덜 걸렸다</span><span class=\"en\"><b><span class=\"grammar-hl\">It took less time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 구멍을 끝내는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to finish</span> his hole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일.</span><span class=\"en\"><b>each day.</b></span></div></div><div class=\"lec-sent-ko\">하루하루 구덩이를 끝내는 데 시간이 덜 걸렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리의 숙련도와 체력이 향상되었음을 보여주는 결과입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It took less time to finish (가주어): 진주어: It이 가주어이고 to finish 이하의 to부정사구가 진주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2주 차에,</span><span class=\"en\"><b>In his second week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스탠리가 구멍을 다 파갈 때쯤,</span><span class=\"en\"><b><span class=\"grammar-hl\">as Stanley was finishing his hole</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 반짝이는 무언가를 보았다</span><span class=\"en\"><b>he saw something shiny</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흙 속에서.</span><span class=\"en\"><b>in the dirt.</b></span></div></div><div class=\"lec-sent-ko\">그가 온 지 두 번째 주에, Stanley가 자기 구덩이를 끝내 가고 있었을 때, 그는 흙 속에서 빛나는 뭔가를 봤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순한 노동의 일상에 사건의 전환점이 되는 물건이 등장하며 긴장감을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as Stanley was finishing his hole (분사구문): 접속사 as가 이끄는 절로 &#39;~할 때&#39;의 의미입니다.</div><div class=\"lec-gr-item\">was finishing (현재진행): be동사(was) + 현재분사(finishing) 구조로 과거의 특정 시점에 진행 중이던 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스탠리의 심장이</span><span class=\"en\"><b><span class=\"grammar-hl\">Stanley’s heart</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 빨리 뛰었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">beat faster.</span></b></span></div></div><div class=\"lec-sent-ko\">Stanley의 심장은 더 빨리 뛰었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 발견한 물건이 예사롭지 않음을 직감한 스탠리의 심리 상태를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Stanley’s heart beat faster. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 ~라는 소리를 들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">He heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 것을 발견하는 사람은 누구나</span><span class=\"en\"><b><span class=\"grammar-hl\">that anyone who found something interesting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 휴가를 얻을 것이라는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">would be given the day off</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 흥미로운 뭔가를 발견한 사람은 그 날을 쉬게 된다고 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 물건이 스탠리에게 어떤 기회가 될 수 있는지, 그가 왜 물건에 집착하게 되는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He heard that anyone who found something interesting would be given the day off (관계대명사): &#39;anyone who found...&#39;에서 who는 선행사 anyone을 수식하는 주격 관계대명사절을 이끕니다. &#39;동격의 that&#39;이 아닌 명사절을 이끄는 접속사 that이 사용되었습니다.</div><div class=\"lec-gr-item\">would be given (수동태): be동사(be)+p.p.(given) 구조. give는 4형식(give+IO+DO) 동사인데 목적어가 주어로 올라가 수동태가 되었으며, 뒤에 DO(the day off)가 남은 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 조심스럽게 집어 들고</span><span class=\"en\"><b>He carefully <span class=\"grammar-hl\">picked up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반짝이는 물건을</span><span class=\"en\"><b>the shiny object</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">털어냈다</span><span class=\"en\"><b>and brushed off</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흙을.</span><span class=\"en\"><b>the dirt.</b></span></div></div><div class=\"lec-sent-ko\">그는 조심스럽게 그 빛나는 물체를 집어 흙을 털어 냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스탠리가 물건을 확인하는 긴박한 동작을 묘사하여 독자의 몰입을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">picked up (관용표현): &#39;집어 들다&#39;라는 의미의 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was a small gold tube.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 금색 튜브.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 작은 금색 통이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 발견된 물건의 정체를 밝히며 이것이 과연 무엇인지에 대한 궁금증을 자아냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was a small gold tube. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 진짜 금일 리가 없었다</span><span class=\"en\"><b><span class=\"grammar-hl\">But it couldn’t be real gold</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 너무 가벼웠기 때문에.</span><span class=\"en\"><b>since it was too light.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그것은 너무 가벼웠기 때문에 진짜 금일 리가 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물건의 가치에 대해 의구심을 갖게 하여, 이것이 보물인지 아니면 별것 아닌 것인지 독자로 하여금 추측하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">But it couldn’t be real gold 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 36 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 글자 KB가 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were two letters, KB,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">튜브 바닥에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> the bottom of the tube.</b></span></div></div><div class=\"lec-sent-ko\">그 통의 바닥에는 KB라는 두 글자가 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 미스터리 요소인 &#39;KB&#39;를 등장시켜 이야기에 깊이를 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were two letters, KB, at 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 37 / 38</div>\n        <div data-h
