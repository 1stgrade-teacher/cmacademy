+Hr9DkfU8YoOPVf8Avtf8f8+tP+r63Vu23l+GwLy/4bbS3TToIPTnA6fpz/T/ADwHPHGQeCPTPf0P5fjigMpGQRwe5Az7j1H+cdaU8ccYHGMj/wBBz3A4Azn6c0f8D/g/19wwo6DH057/AE5/Inr7+oMcjIJAHQ5HUd/TnrxzS5AHUbu/IyBjkYzn9OKQtNr7efa3/Av+IYPsQOOPxP8An/64puPfjnI6+2P/ANX45zwpYHuPfkHnP9T/ADI6dW7kBPIA4zyOp/DHpz700m9ioWv71rWel11Svfz13S3s+jFOOnPPp1GT14/nS8YOOv5ge56E/TjjvR8uMkjrjg89zjOeOgz1/QigJnO0EjBBOTlQFwD+BwSdwwMkk0R1ce10+6t1066dOuxs7NP0tpr/AFu9P0P/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Wormholes: The Ultimate Shortcut for Space Travel<small>웜홀: 우주 여행을 위한 최고의 지름길</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 우주 공간을 효율적으로 이동하는 방법을 설명하기 위해 웜홀(Wormhole)이라는 개념을 다루고 있어요. 웜홀은 아인슈타인의 일반 상대성 이론에서 예측된 우주 공간의 두 지점을 잇는 지름길(Shortcut) 같은 통로를 말해요. 마치 사과 표면을 따라 빙 둘러가는 대신 사과 속을 파고들어 반대편으로 빠르게 이동하는 것과 비슷하죠. 실제로 우주가 거대한 종이처럼 구부러질 수 있다고 가정하면, 시공간(Space-time)의 먼 거리를 단숨에 연결하는 이 통로는 우주 여행의 혁신적인 해결책으로 자주 언급된답니다. 물론 아직은 영화나 공상과학 소설 속 이야기처럼 느껴지겠지만, 물리 법칙 안에서 우주를 횡단하는 가장 흥미로운 방법 중 하나예요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">120년이요? 우아, 그건 정말 긴 시간이네요! 우주를 여행하는 더 빠른 방법이 있나요?</span><span class=\"en\"><b>Sci Teen: 120 years?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>Wow,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>that’s a long time!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>Is there a faster way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">to travel</span> through space?</b></span></div></div><div class=\"lec-sent-ko\">(120년이요? 우아, 그건 정말 긴 시간이네요! 우주를 여행하는 더 빠른 방법이 있나요?)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주 여행에 걸리는 긴 시간을 언급하며, 이를 단축할 수 있는 다른 방법이 존재하는지 질문을 던짐으로써 글의 주제인 &#39;우주 여행의 지름길(웜홀)&#39;에 대한 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to travel (to부정사): 형용사적 용법으로, 앞의 명사 way를 뒤에서 수식하여 &#39;~할 (방법)&#39;이라는 의미를 만듭니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">글쎄요, 그 질문에 답하기 위해서 여러분들이 이 사과에 대해 잠깐 생각해 보기 바랍니다.</span><span class=\"en\"><b>Dr. Sci: Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">in order to answer</span> that question,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>I’d <span class=\"grammar-hl\">like you to think</span> about this apple</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>for a second.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 글쎄요, 그 질문에 답하기 위해서 여러분들이 이 사과에 대해 잠깐 생각해 보기 바랍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 나온 빠른 이동 방법에 대한 질문에 답하기 위해, 학생의 이해를 돕고자 사과라는 구체적인 비유 대상을 제시하여 설명을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in order to answer (to부정사): 부사적 용법(목적)으로, &#39;~하기 위해서&#39;라는 의미로 쓰여 문장 전체의 목적을 나타냅니다.</div><div class=\"lec-gr-item\">like you to think 5형식(SVOC) 구조: like+O+toV 구조로, O(you)가 toV(think)라는 동작을 하기를 원한다는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상상해 보세요</span><span class=\"en\"><b>Imagine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 마리 벌레가</span><span class=\"en\"><b>a worm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 사과 위에 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> on this apple.</b></span></div></div><div class=\"lec-sent-ko\">한 마리 벌레가 이 사과 위에 있다고 상상해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과 표면을 이동하는 벌레를 상황 설정의 핵심 인물로 등장시켜, 우주 공간에서의 이동을 시각적으로 설명하기 위한 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is (간접의문문): &#39;a worm is on this apple&#39; 전체가 Imagine의 목적어 역할을 하는 명사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 달콤한 무언가를 감지하고</span><span class=\"en\"><b>It detects something sweet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맨 아래에 있는</span><span class=\"en\"><b>at the bottom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이동하기를 원하며</span><span class=\"en\"><b>and wants <span class=\"grammar-hl\">to move</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맨 위에서 아래로</span><span class=\"en\"><b>from the top to the bottom.</b></span></div></div><div class=\"lec-sent-ko\">그것은 맨 아래에 있는 달콤한 무언가를 감지하고 맨 위에서 아래로 이동하기를 원합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> detect는 사전적으로 &#39;탐지하다&#39;인데, 여기서는 벌레가 냄새를 맡거나 맛을 느끼는 감각적 인지를 뜻합니다. 필자는 벌레의 본능적인 움직임을 설명하여, 우리가 우주에서 더 효율적인 경로를 찾으려는 것과 같은 동기를 부여하려고 이 단어를 골랐습니다. 앞 문장에서 벌레를 소개한 뒤, 그 벌레가 왜 이동해야 하는지 이유를 설명하여 논리를 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to move (to부정사): wants의 목적어 역할을 하는 명사적 용법으로, &#39;~하는 것을&#39; 원한다는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 벌레에게</span><span class=\"en\"><b>For the worm,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과의 표면은</span><span class=\"en\"><b>the <span class=\"grammar-hl\">apple’s surface</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광대합니다</span><span class=\"en\"><b>is as vast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 우주만큼이나</span><span class=\"en\"><b>as our universe.</b></span></div></div><div class=\"lec-sent-ko\">그 벌레에게 사과의 표면은 우리의 우주만큼이나 광대합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> vast는 &#39;광대한, 거대한&#39;이라는 뜻으로, 여기서는 인간이 우주를 여행할 때 느끼는 거리의 체감과 사과 표면을 기어가는 벌레의 체감을 동일시하기 위해 사용되었습니다. 인간에게는 작은 사과가 벌레에게는 우주만큼 크다는 비유를 통해, 시점의 차이를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">apple’s surface (관용표현): &#39;A&#39;s B&#39; 구조의 소유격으로, 사물(apple)에도 소유격인 &#39;s를 붙여 표기하는 영어의 일반적인 표현 방식입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 벌레는</span><span class=\"en\"><b>the worm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바깥 표면의 껍질을 돌아서 이동하거나</span><span class=\"en\"><b>can either move around <span class=\"grammar-hl\">the outer layer</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벌레 구멍 아래로 이동할 수 있습니다.</span><span class=\"en\"><b>or down a wormhole.</b></span></div></div><div class=\"lec-sent-ko\">이제 그 벌레는 바깥 표면의 껍질을 돌아서 이동하거나 벌레 구멍 아래로 이동할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사과 겉면을 도는 것과 웜홀을 통과하는 두 가지 경로를 대조하며, 우주 여행에서 우리가 고민해야 할 선택지를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the outer layer (관용표현): outer layer는 &#39;외부 층/겉면&#39;을 뜻하는 명사구로, 여기서는 벌레가 이동할 수 있는 경로를 지칭합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">Which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각하십니까</span><span class=\"en\"><b><span class=\"grammar-hl\">do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벌레가 선택할 거라고</span><span class=\"en\"><b><span class=\"grammar-hl\">it will choose</span>?</b></span></div></div><div class=\"lec-sent-ko\">벌레가 어떤 것을 선택할 거라고 생각하십니까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자(학생)에게 질문을 던져 집중력을 높이고, 바로 뒤에 이어질 정답에 대해 스스로 생각해보게 만드는 유도 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Which do you think it will choose (간접의문문): &#39;think&#39;와 같은 사고 동사가 삽입된 의문문으로, 의문사(Which)가 문장 맨 앞으로 도치된 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벌레 구멍을 선택할 것인데</span><span class=\"en\"><b>it <span class=\"grammar-hl\">would choose</span> the wormhole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그것이 지름길이기 때문입니다.</span><span class=\"en\"><b>because it is a shortcut.</b></span></div></div><div class=\"lec-sent-ko\">음, 벌레 구멍을 선택할 것인데 왜냐하면 그것이 지름길이기 때문입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 답을 제공합니다. shortcut은 &#39;지름길&#39;을 의미하는데, 이는 글 전체의 핵심 개념인 &#39;시간을 단축하는 효율적인 경로&#39;를 나타내는 비유적 표현입니다. 앞선 예시를 통해 우주 여행의 빠른 길을 이해하기 쉽게 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would choose (관용표현): 가정법 과거의 주절 형태로, 현실 가능성이 낮은 상황을 가정할 때 &#39;will&#39; 대신 &#39;would&#39;를 사용하여 표현합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우주 여행의 긴 시간을 단축할 수 있는 방법이 있는지에 대한 의문을 제기함.</li><li>사과 위를 이동하는 벌레를 비유로 들어 공간을 이동하는 두 가지 경로를 설명함.</li><li>겉면을 따라가는 긴 경로보다 지름길인 웜홀이 훨씬 효율적임을 제시함.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Space travel could be faster by using a wormhole, as it provides a shortcut compared to traveling across the vast outer surface.</div>\n              <div class=\"lec-final-sum-ko\">우주 여행은 웜홀을 이용하면 더 빨라질 수 있는데, 이는 거대한 외부 표면을 이동하는 것보다 지름길을 제공하기 때문이다.</div></div></div>"],"segs":[[],[],[],[],[],[],[],[],[],[],[]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
