</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"7과 문법1","title":"중3 비상 7과 문법1 접속사 as","audioDir":"1_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">접속사 as / 전치사 as\u003c/div>\u003ch1>as 하나로 다섯 가지 뜻? 접속사 as와 전치사 as 끝내기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>접속사 as의 여러 가지 의미를 예문으로 구별하고, 전치사 as의 쓰임까지 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 영문법 공부해 볼까요? 오늘은 아주 짧은 단어지만 뜻이 정말 많은 as를 배워 볼 거예요. 접속사 as는 때에 따라 '~할 때', '~때문에', '~듯이', '~함에 따라', '~대로'처럼 다섯 가지로 해석되고, 전치사로 쓰이면 '~처럼'이나 '~로서'가 됩니다. 처음에는 좀 헷갈릴 수 있지만, 예문 속에서 앞뒤 상황을 보면 답이 보여요. 오늘 예문 몇 개만 제대로 익혀 두면 시험 문제는 어렵지 않을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">접속사 as ① ~할 때\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사 as는 뒤에 \u003cb class=\"key\">주어 + 동사\u003c/b>를 데리고 와서 부사절을 만든다. 이때 두 가지 일이 거의 같은 시점에 일어나면 as를 \u003cb class=\"key\">~할 때\u003c/b>로 해석한다.\u003cdiv>\u003cspan class=\"g-formula\">as + 주어 + 동사, 주어 + 동사 = ~할 때\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As we walked along the street\u003c/span>, he told us stories.\u003c/div>\u003cdiv class=\"g-ko\">우리가 길을 따라 걸었을 때 그는 우리에게 이야기를 해 주었다.\u003c/div>\u003cdiv class=\"g-note\">길을 걷는 일과 이야기를 듣는 일이 동시에 일어나므로 '~할 때'로 해석한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I saw Kelly \u003cspan class=\"fx\">as I went to the shopping mall\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 쇼핑몰에 갔을 때 켈리를 보았다.\u003c/div>\u003cdiv class=\"g-note\">쇼핑몰에 가던 순간에 켈리를 보았으므로 '~할 때'이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as절이 문장 앞에 오면 뒤에 \u003cb class=\"key\">쉼표\u003c/b>를 찍고, 문장 뒤에 오면 쉼표 없이 쓴다.\u003c/div>","segs":[{"n":2,"text":"먼저 접속사 as부터 볼게요. as는 뒤에 주어와 동사가 있는 문장을 데리고 와서 부사절을 만들어요. 그중에서 두 가지 일이 거의 같은 시점에 일어날 때 as는 '~할 때'라는 뜻이 돼요. 우리말로는 '~하면서'나 '~할 때' 정도로 자연스럽게 옮기면 됩니다. 뒤에 나오는 예문에서 두 일이 동시에 일어나는지 꼭 확인해 보세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. As we walked along the street, he told us stories. 우리가 길을 따라 걸었을 때 그는 우리에게 이야기를 해 주었다는 뜻이에요. 걷는 일과 이야기를 들려주는 일이 같은 순간에 일어나고 있죠. 그래서 여기서 as는 '~할 때'로 해석해요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문도 같이 볼게요. I saw Kelly as I went to the shopping mall. 나는 쇼핑몰에 갔을 때 켈리를 보았다는 뜻이에요. 쇼핑몰에 가고 있는 그 순간에 켈리를 만난 거니까 as는 '~할 때'예요. 이렇게 사건이 겹쳐 일어나면 편하게 '~할 때'로 잡아 주세요.","hl":"ex-1"},{"n":5,"text":"하나만 더 기억해요. as절이 문장 앞에 나오면 뒤에 쉼표를 찍고, 뒤에 나오면 쉼표 없이 이어 씁니다. 작은 차이지만 서술형에서 감점이 되니까 꼭 챙겨 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">접속사 as ② ~때문에\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as절이 \u003cb class=\"key\">이유\u003c/b>를 나타내면 as를 \u003cb class=\"key\">~때문에\u003c/b>로 해석한다. because와 비슷하게 쓰이지만, as는 이유를 가볍게 덧붙이는 느낌이다.\u003cdiv>\u003cspan class=\"g-formula\">as + 주어 + 동사 = ~때문에\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We'll have to stay home \u003cspan class=\"fx\">as it's raining again\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">비가 또 오니까 우리는 집에 있어야 할 거야.\u003c/div>\u003cdiv class=\"g-note\">비가 오는 것이 집에 있어야 하는 이유이므로 '~때문에'이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I ran very fast \u003cspan class=\"fx\">as I was late for school\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 학교에 늦었기 때문에 아주 빨리 뛰었다.\u003c/div>\u003cdiv class=\"g-note\">학교에 늦은 것이 빨리 뛴 이유이므로 '~때문에'이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as가 \u003cb class=\"key\">이유\u003c/b>로 쓰이면 as절 안에 \u003cb class=\"key\">because\u003c/b>를 또 넣지 않는다.\u003c/div>","segs":[{"n":6,"text":"이번에는 이유를 나타내는 as예요. as 뒤에 오는 내용이 앞 문장의 원인이 되면 '~때문에'로 해석합니다. because와 거의 같은 뜻이지만 as가 좀 더 부드럽게 이유를 덧붙이는 느낌이에요. 해석할 때는 as를 '왜냐하면'으로 바꿔 넣어 보면 자연스러운지 금방 알 수 있어요.","hl":"rule"},{"n":7,"text":"예문 읽어 볼게요. We'll have to stay home as it's raining again. 비가 또 오니까 우리는 집에 있어야 할 거야, 라는 뜻이에요. 비가 오는 것이 집에 머무는 이유가 되죠. 그래서 as를 '~때문에'로 해석합니다.","hl":"ex-0"},{"n":8,"text":"이 문장도 볼게요. I ran very fast as I was late for school. 나는 학교에 늦었기 때문에 아주 빨리 뛰었다는 뜻이에요. 늦었다는 사실이 빨리 뛴 이유가 되니까 여기서도 as는 '~때문에'예요. 앞뒤가 원인과 결과로 이어지면 이유의 as라고 생각하면 됩니다.","hl":"ex-1"},{"n":9,"text":"주의할 점이 하나 있어요. 이미 as로 이유를 말하고 있으니까 as절 안에 because를 또 넣으면 안 됩니다. 접속사는 한 절에 하나만 쓴다고 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">접속사 as ③ ~듯이, ~함에 따라, ~대로\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as는 상황에 따라 \u003cb class=\"key\">~듯이\u003c/b>나 \u003cb class=\"key\">~함에 따라\u003c/b>, \u003cb class=\"key\">~대로\u003c/b>로도 해석된다. 앞뒤 내용의 관계를 보고 가장 자연스러운 뜻을 고르면 된다.\u003cdiv>\u003cspan class=\"g-formula\">As + 주어 + 동사 = ~듯이 / ~함에 따라 / ~대로\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As I was saying\u003c/span>, we expect next year to be a good year.\u003c/div>\u003cdiv class=\"g-ko\">내가 말했듯이 우리는 내년이 좋은 해가 될 것으로 기대한다.\u003c/div>\u003cdiv class=\"g-note\">앞에서 하던 말을 다시 꺼내므로 '~듯이'로 해석한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">As people use cars more often\u003c/span>, the Earth gets warmer.\u003c/div>\u003cdiv class=\"g-ko\">사람들이 차를 더 자주 사용함에 따라 지구는 더 더워진다.\u003c/div>\u003cdiv class=\"g-note\">한쪽이 변하면서 다른 쪽도 변하므로 '~함에 따라'이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Leave everything \u003cspan class=\"fx\">just as you found it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">모든 것을 발견한 그대로 둬.\u003c/div>\u003cdiv class=\"g-note\">발견한 상태 그대로 두라는 뜻이므로 '~대로'이다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as의 뜻이 여러 개라서, 해석이 \u003cb class=\"key\">자연스러운지\u003c/b> 먼저 확인하는 습관이 중요하다.\u003c/div>","segs":[{"n":10,"text":"as는 여기서 끝이 아니에요. '내가 말했듯이'처럼 이미 알고 있는 내용을 다시 말할 때는 '~듯이'가 됩니다. 또 한쪽이 변하면서 다른 쪽도 함께 변하면 '~함에 따라'로 해석해요. 그리고 이미 있는 상태 그대로 두라는 문장에서는 '~대로'가 됩니다. 결국 앞뒤 문장의 관계를 보고 뜻을 골라야 해요.","hl":"rule"},{"n":11,"text":"예문 하나씩 볼게요. As I was saying, we expect next year to be a good year. 내가 말했듯이 우리는 내년이 좋은 해가 될 것으로 기대한다는 뜻이에요. 앞에서 하던 이야기를 다시 이어 가는 상황이라 as가 '~듯이'가 됐어요.","hl":"ex-0"},{"n":12,"text":"다음 문장이에요. As people use cars more often, the Earth gets warmer. 사람들이 차를 더 자주 사용함에 따라 지구는 더 더워진다, 라는 뜻이에요. 차를 많이 쓸수록 지구가 따뜻해지는 변화가 함께 일어나죠. 이럴 때 as는 '~함에 따라'로 해석해요.","hl":"ex-1"},{"n":13,"text":"마지막으로 이 문장 볼게요. Leave everything just as you found it. 모든 것을 발견한 그대로 둬, 라는 뜻이에요. 원래 있던 상태를 바꾸지 말라는 말이니까 as는 '~대로'가 됩니다. 이렇게 as는 문장 분위기에 따라 뜻이 조금씩 달라져요.","hl":"ex-2"},{"n":14,"text":"as는 뜻이 많아서 단어만 보고는 알 수 없어요. 그래서 문장을 끝까지 읽고 우리말로 옮겨 봤을 때 자연스러운 뜻을 고르는 습관이 제일 중요합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 as — ~처럼, ~로서\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 as는 뒤에 \u003cb class=\"key\">명사\u003c/b>가 와서 \u003cb class=\"key\">~처럼\u003c/b> 또는 \u003cb class=\"key\">~로서\u003c/b>라는 뜻을 나타낸다. 역할이나 자격을 말할 때는 '~로서'로 해석한다.\u003cdiv>\u003cspan class=\"g-formula\">as + 명사 = ~처럼 / ~로서\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He went to the costume party dressed \u003cspan class=\"fx\">as a banana\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 바나나 복장을 하고 분장 파티에 갔다.\u003c/div>\u003cdiv class=\"g-note\">as 뒤에 명사 a banana가 와서 '~처럼'의 전치사로 쓰였다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I like her \u003cspan class=\"fx\">both as a poet and as a novelist\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 시인으로서나 소설가로서나 양쪽 모두 그녀를 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">역할과 자격을 나타내므로 '~로서'로 해석한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>as 뒤에 \u003cb class=\"key\">명사\u003c/b>가 오면 전치사, \u003cb class=\"key\">주어 + 동사\u003c/b>가 오면 접속사로 구별한다.\u003c/div>","segs":[{"n":15,"text":"이제 접속사가 아닌 전치사 as를 볼게요. 전치사 as는 뒤에 주어와 동사가 아니라 명사가 옵니다. 이때 '~처럼'이라는 뜻으로 분장이나 모습을 말할 수 있어요. 또 '~로서'라는 뜻으로 어떤 역할이나 자격을 나타내기도 합니다. 뒤에 명사가 오는지 동사가 오는지 보면 접속사인지 전치사인지 바로 구별돼요.","hl":"rule"},{"n":16,"text":"예문 볼게요. He went to the costume party dressed as a banana. 그는 바나나 복장을 하고 분장 파티에 갔다, 라는 뜻이에요. as 뒤에 명사 a banana가 왔죠. 이렇게 뒤에 명사가 오면 전치사 as이고 '~처럼'으로 해석해요.","hl":"ex-0"},{"n":17,"text":"이 문장도 읽어 볼게요. I like her both as a poet and as a novelist. 나는 시인으로서나 소설가로서나 양쪽 모두 그녀를 좋아한다는 뜻이에요. 여기서 as는 그녀의 역할과 자격을 말하고 있으니 '~로서'로 해석합니다. 이렇게 as 뒤에 명사가 오면 전치사라고 기억해 주세요.","hl":"ex-1"},{"n":18,"text":"정리하면 아주 간단해요. as 바로 뒤에 명사가 오면 전치사, 주어와 동사가 오면 접속사입니다. 문제를 볼 때 as 뒤만 살짝 확인해도 절반은 풀린 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>As it was raining, so we stayed home.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ As it was raining, we stayed home.\u003c/div>\u003cdiv class=\"g-why\">as가 이미 이유를 이끄는 접속사이므로 so를 또 쓰면 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>As she was young, she works for a bank.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ As she was young, she worked for a bank.\u003c/div>\u003cdiv class=\"g-why\">as절이 과거이므로 주절의 동사도 과거형으로 맞춰야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Anna sometimes listens to music as she take a bath.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Anna sometimes listens to music as she takes a bath.\u003c/div>\u003cdiv class=\"g-why\">as절의 주어 she에 맞춰 동사에 -s를 붙여야 한다.\u003c/div>\u003c/div>","segs":[{"n":19,"text":"학생들이 자주 하는 실수예요. as로 이유를 말했는데 뒤에 so까지 붙이면 접속사가 두 개가 되어버려요. As it was raining, we stayed home. 처럼 하나만 써야 합니다.","hl":"mk-0"},{"n":20,"text":"두 번째 실수는 시제예요. as절에서 was라고 과거를 썼는데 뒤에서 works라고 하면 앞뒤 시제가 어긋나죠. As she was young, she worked for a bank. 처럼 뒤도 과거로 맞춰 주세요.","hl":"mk-1"},{"n":21,"text":"세 번째는 동사 모양이에요. as절 안의 주어가 she니까 동사에 s를 붙여서 takes라고 해야 합니다. Anna sometimes listens to music as she takes a bath. 이렇게 쓰는 게 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 as의 의미로 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">He was very disappointed as he didn't get any chocolate.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>~ 때문에\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>~ 대로\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>~할 때\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>~함에 따라\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">~ 때문에\u003c/span>\u003cdiv class=\"g-exp\">초콜릿을 받지 못한 것이 실망한 이유이므로 as는 '~ 때문에'로 해석한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"첫 번째 문제는 as의 뜻을 고르는 문제예요. He was very disappointed as he didn't get any chocolate. 여기서 as는 어떤 의미일까요? 잠시 멈추고 직접 골라 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 첫 번째 보기, '~ 때문에'예요. 초콜릿을 하나도 받지 못했기 때문에 아주 실망했다는 뜻이니까 as가 이유를 이끌고 있죠. 그래서 '~ 때문에'로 해석합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 as의 의미로 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">As you can see, I'm not a good cook.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>~ 때문에\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>~듯이\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>~로서\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>~함에 따라\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">~듯이\u003c/span>\u003cdiv class=\"g-exp\">'네가 볼 수 있듯이'라는 뜻으로, 앞의 내용을 다시 확인해 주는 표현이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"두 번째 문제예요. As you can see, I'm not a good cook. 여기서 as의 뜻은 무엇일까요? 잠시 멈추고 답을 골라 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 두 번째 보기, '~듯이'예요. 네가 볼 수 있듯이, 라는 뜻으로 이미 알고 있는 사실을 다시 확인해 주는 표현이죠. 그래서 '~함에 따라'가 아니라 '~듯이'로 해석합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 우리말에 알맞게 괄호 안의 단어를 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">Anna sometimes listens to music ____. (as, takes, a bath, she)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">as she takes a bath\u003c/span>\u003cdiv class=\"g-exp\">as가 '~하면서'라는 뜻으로 쓰였고, as절의 주어 she에 맞춰 동사는 takes로 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"세 번째는 배열 문제예요. Anna는 목욕하면서 때때로 음악을 듣는다, 를 영어로 만들어야 해요. 주어진 단어 as, takes, a bath, she를 알맞게 늘어놓아 보세요. 잠시 멈추고 직접 해 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 as she takes a bath예요. as가 '~하면서'라는 뜻으로 뒤에 주어와 동사가 오죠. 주어가 she니까 동사는 s를 붙인 takes로 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 우리말에 알맞게 괄호 안의 단어를 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">____, I ate all of the food up. (I, as, so, was, hungry)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">As I was so hungry\u003c/span>\u003cdiv class=\"g-exp\">as절이 문장 앞에 오면 쉼표를 찍고, as는 '~때문에'로 해석한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"네 번째 문제예요. 나는 무척 배가 고팠기 때문에 그 음식을 모두 먹어 치웠다, 를 완성해 보세요. 주어진 단어 I, as, so, was, hungry를 잘 늘어놓으면 됩니다. 잠시 멈추고 직접 해 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 As I was so hungry예요. as가 이유를 이끌면서 문장 앞에 나왔으니까 뒤에 쉼표를 찍어 줍니다. 여기서 so는 hungry를 꾸며 주는 '무척'이라는 뜻이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 우리말에 알맞게 괄호 안의 단어를 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">____, I missed the bus. (late, I, got, as, up)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">As I got up late\u003c/span>\u003cdiv class=\"g-exp\">as절이 이유를 나타내며 문장 앞에 오므로 As I got up late로 시작하고 쉼표를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다섯 번째 문제예요. 늦게 일어났기 때문에 버스를 놓쳤다, 를 영어로 만들어 봅시다. late, I, got, as, up을 알맞게 배열해 보세요. 잠시 멈추고 직접 해 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 As I got up late예요. 늦게 일어난 것이 버스를 놓친 이유이니까 as가 '~때문에'로 쓰였어요. as절이 앞에 왔으니 쉼표를 잊지 말고 찍어 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">He went to the costume party dressed ____ a banana.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">as\u003c/span>\u003cdiv class=\"g-exp\">여기서 as는 전치사로 '~처럼'이라는 뜻이며, 뒤에 명사 a banana가 왔다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"마지막 문제는 빈칸 채우기예요. He went to the costume party dressed 빈칸 a banana. 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 as예요. 여기서 as는 전치사로 '~처럼'이라는 뜻이고 뒤에 명사 a banana가 왔죠. 바나나처럼 분장했다는 뜻이니까 dressed as a banana라고 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">접속사 as / 전치사 as\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>접속사 as는 뒤에 \u003cb class=\"key\">주어 + 동사\u003c/b>를 데리고 오고, 문맥에 따라 '~할 때', '~때문에', '~듯이', '~함에 따라', '~대로'로 해석한다.\u003c/li>\u003cli>as절이 \u003cb class=\"key\">이유\u003c/b>를 나타내면 '~때문에'로 해석하고, 이때 so를 함께 쓰지 않는다.\u003c/li>\u003cli>전치사 as는 뒤에 \u003cb class=\"key\">명사\u003c/b>가 와서 '~처럼'이나 '~로서'라는 뜻을 나타낸다.\u003c/li>\u003cli>as 뒤에 명사가 오면 \u003cb class=\"key\">전치사\u003c/b>, 주어와 동사가 오면 \u003cb class=\"key\">접속사\u003c/b>로 구별한다.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘은 as 하나로 정말 많은 걸 배웠어요. 접속사 as는 뒤에 주어와 동사를 데리고 오면서 '~할 때', '~때문에', '~듯이', '~함에 따라', '~대로'로 해석된다는 것, 기억나죠? 전치사 as는 뒤에 명사가 와서 '~처럼'이나 '~로서'가 된다는 것도 꼭 챙겨 두세요. 문제를 풀 때는 as 뒤에 무엇이 오는지, 그리고 우리말로 옮겼을 때 자연스러운지 를 먼저 확인하면 됩니다. 오늘 배운 내용 복습 잘 해 두고, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script></body></html>
