</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"8과 문법1","title":"중3 비상 7과 문법2 수의 일치","audioDir":"2_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">수의 일치 (주어와 동사의 일치)\u003c/div>\u003ch1>of 뒤 명사를 보면 동사가 보인다! 주어와 동사의 수 일치\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>of가 들어간 주어와 every, each, a number of 뒤에서 알맞은 동사의 수를 골라 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 수의 일치라는 문법을 배워 볼 거예요. 수의 일치는 주어의 수에 맞춰서 동사의 모양을 바꿔 주는 아주 중요한 규칙이에요. 특히 오늘은 most나 some, half처럼 of와 함께 자주 나오는 표현들을 집중적으로 다뤄 볼 거죠. 겁먹지 말고 예문 하나씩 같이 읽으면서 감을 잡아 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">of 뒤 명사가 동사를 결정해요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「most, all, some, half, percent, 분수 + of + 명사」에서는 of 뒤에 오는 \u003cb class=\"key\">명사\u003c/b>의 수에 따라 동사의 수를 맞춰요. of 뒤 명사가 \u003cb class=\"key\">단수\u003c/b>면 단수 동사, \u003cb class=\"key\">복수\u003c/b>면 복수 동사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">most / all / some / half / percent / 분수 + of + 단수 명사 + 단수 동사 / most / all / some / half / percent / 분수 + of + 복수 명사 + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Most of my classmates like\u003c/span> playing soccer.\u003c/div>\u003cdiv class=\"g-ko\">내 반 친구들 대부분은 축구하는 것을 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">classmates가 복수 명사라서 복수 동사 like를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">All of their songs are\u003c/span> on chart now.\u003c/div>\u003cdiv class=\"g-ko\">그들의 노래 모두가 지금 차트에 있다.\u003c/div>\u003cdiv class=\"g-note\">songs가 복수 명사라 복수 동사 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Some of the milk was\u003c/span> spilled.\u003c/div>\u003cdiv class=\"g-ko\">우유 얼마간이 쏟아졌다.\u003c/div>\u003cdiv class=\"g-note\">milk가 단수 명사라 단수 동사 was를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Two thirds of the bread in the bakery was\u003c/span> baked early in the morning.\u003c/div>\u003cdiv class=\"g-ko\">그 빵집 빵의 삼분의 이가 이른 아침에 구워졌다.\u003c/div>\u003cdiv class=\"g-note\">분수가 앞에 있어도 of 뒤 bread가 단수라 단수 동사 was를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동사를 고르기 전에 of 바로 뒤의 \u003cb class=\"key\">명사\u003c/b>를 먼저 찾으세요. 앞에 보이는 \u003cb class=\"key\">percent\u003c/b>나 \u003cb class=\"key\">분수\u003c/b>에 동사를 맞추면 틀려요.\u003c/div>","segs":[{"n":2,"text":"여러분, 오늘 배울 규칙의 첫 번째는 of 뒤 명사를 보는 거예요. most나 all, some, half, percent, 그리고 분수가 of와 함께 나오면, 동사는 앞에 있는 양이 아니라 of 뒤에 있는 명사를 보고 결정해요. of 뒤 명사가 단수면 단수 동사를, 복수면 복수 동사를 쓰면 됩니다. 앞에 있는 표현에 흔들리지 말고 of 뒤만 딱 보세요.","hl":"rule"},{"n":3,"text":"Most of my classmates like playing soccer. 내 반 친구들 대부분은 축구하는 것을 좋아한다는 뜻이에요. 여기서 of 뒤에 있는 classmates가 복수 명사죠. 그래서 동사도 like, 복수 형태가 온 거예요.","hl":"ex-0"},{"n":4,"text":"All of their songs are on chart now. 그들의 노래 모두가 지금 차트에 있다는 뜻이에요. of 뒤에 songs라는 복수 명사가 있으니까 동사는 are를 썼습니다. all이 앞에 있어도 동사는 songs를 따라간다는 점, 잘 보이죠?","hl":"ex-1"},{"n":5,"text":"Some of the milk was spilled. 우유 얼마간이 쏟아졌다는 뜻이에요. milk는 셀 수 없는 단수 명사라서 동사는 was, 단수형이 왔어요. some이 앞에 있다고 해서 복수 동사를 쓰면 안 되겠죠.","hl":"ex-2"},{"n":6,"text":"Two thirds of the bread in the bakery was baked early in the morning. 그 빵집 빵의 삼분의 이가 이른 아침에 구워졌다는 뜻이에요. 앞에 분수가 나와서 복수 같아 보이지만, of 뒤에 있는 bread가 단수라서 동사는 was를 씁니다.","hl":"ex-3"},{"n":7,"text":"시험에서 자주 틀리는 이유가 바로 앞에 보이는 숫자에 동사를 맞추기 때문이에요. 동사를 정하기 전에 꼭 of 뒤의 명사를 먼저 확인하는 습관을 들여요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">none of 뒤에는 어떤 동사가 올까요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「none of + 단수 명사」에는 \u003cb class=\"key\">단수 동사\u003c/b>를 써요. 「none of + 복수 명사」에는 단수 동사와 복수 동사를 모두 쓸 수 있는데, 강조하는 \u003cb class=\"key\">의미\u003c/b>에 따라 달라져요.\u003cdiv>\u003cspan class=\"g-formula\">none of + 단수 명사 + 단수 동사 / none of + 복수 명사 + 단수 동사〔복수 동사〕\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">None of this money is\u003c/span> yours.\u003c/div>\u003cdiv class=\"g-ko\">이 돈은 하나도 네 것이 아니다.\u003c/div>\u003cdiv class=\"g-note\">money가 단수 명사라 단수 동사 is를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">None of the passengers were\u003c/span> hurt.\u003c/div>\u003cdiv class=\"g-ko\">승객들 중 아무도 다치지 않았다.\u003c/div>\u003cdiv class=\"g-note\">passengers가 복수라 복수 동사 were도, 단수 동사 was도 가능합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">None of the books is\u003c/span> worth reading.\u003c/div>\u003cdiv class=\"g-ko\">그 책들 중 어떤 것도 읽을 가치가 없다.\u003c/div>\u003cdiv class=\"g-note\">책 전체를 하나의 집합으로 강조해 단수 동사 is를 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>복수 명사 뒤에서는 단수와 복수 동사가 모두 가능하지만, \u003cb class=\"key\">문맥\u003c/b>과 \u003cb class=\"key\">강조\u003c/b>하려는 의미를 생각해서 골라야 해요.\u003c/div>","segs":[{"n":8,"text":"이번에는 none of를 살펴볼게요. none of 뒤에 단수 명사가 오면 동사는 단수로 씁니다. 그런데 뒤에 복수 명사가 오면 단수 동사도 되고 복수 동사도 돼요. 책 전체를 하나의 덩어리로 강조하면 단수, 가치 없는 책이 여러 개라는 점을 강조하면 복수로 쓰는 거예요. 그래서 문맥을 함께 보는 게 중요합니다.","hl":"rule"},{"n":9,"text":"None of this money is yours. 이 돈은 하나도 네 것이 아니라는 뜻이에요. of 뒤에 money라는 단수 명사가 있으니 동사는 단수인 is를 썼습니다.","hl":"ex-0"},{"n":10,"text":"None of the passengers were hurt. 승객들 중 아무도 다치지 않았다는 뜻이에요. passengers가 복수 명사라서 복수 동사 were를 썼는데, 이때는 단수 동사 was도 가능하다는 점을 기억해요.","hl":"ex-1"},{"n":11,"text":"None of the books is worth reading. 그 책들 중 어떤 것도 읽을 가치가 없다는 뜻이에요. 여기서는 책 전체를 하나의 집합처럼 강조했기 때문에 단수 동사 is를 쓴 거예요.","hl":"ex-2"},{"n":12,"text":"그래서 문제를 풀 때는 뒤에 어떤 동사가 있는지, 어떤 의미를 강조하는지를 함께 판단하는 게 중요해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">a number of와 the number of는 완전히 달라요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「a number of + 복수 명사」는 '많은'이라는 뜻으로 \u003cb class=\"key\">복수 동사\u003c/b>를 써요. 「the number of + 복수 명사」는 '~의 수'라는 뜻으로 \u003cb class=\"key\">단수 동사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">a number of + 복수 명사 + 복수 동사 (많은) / the number of + 복수 명사 + 단수 동사 (~의 수)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A number of people are\u003c/span> gathering to see the boy band.\u003c/div>\u003cdiv class=\"g-ko\">많은 사람들이 그 보이 밴드를 보려고 모이고 있다.\u003c/div>\u003cdiv class=\"g-note\">a number of는 '많은'이라는 뜻이라 복수 동사 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The number of students in our class is\u003c/span> twenty.\u003c/div>\u003cdiv class=\"g-ko\">우리 반 학생 수는 스무 명이다.\u003c/div>\u003cdiv class=\"g-note\">the number of는 '~의 수'라는 뜻이라 단수 동사 is를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">a\u003c/b>가 붙으면 '많은'이라 복수 동사, \u003cb class=\"key\">the\u003c/b>가 붙으면 '~의 수'라 단수 동사라고 기억하세요.\u003c/div>","segs":[{"n":13,"text":"a number of와 the number of는 한 글자 차이지만 뜻과 동사가 완전히 달라요. a number of는 많은이라는 뜻이라서 뒤에 복수 명사가 오고 동사도 복수로 씁니다. 반대로 the number of는 무언가의 수, 즉 하나의 숫자를 말하니까 동사는 단수로 써요. 관사 하나로 동사가 바뀐다는 게 신기하죠?","hl":"rule"},{"n":14,"text":"A number of people are gathering to see the boy band. 많은 사람들이 그 보이 밴드를 보려고 모이고 있다는 뜻이에요. a number of는 많은이라는 뜻이라 동사가 복수인 are로 온 거예요.","hl":"ex-0"},{"n":15,"text":"The number of students in our class is twenty. 우리 반 학생 수는 스무 명이라는 뜻이에요. the number of는 학생 수라는 하나의 숫자를 말하니까 동사는 단수인 is를 씁니다.","hl":"ex-1"},{"n":16,"text":"관사 하나로 동사가 바뀌니까 꼭 구분해서 외워 두세요. 시험에도 정말 자주 나오는 부분이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">every와 each 뒤에는 항상 단수 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「every + 단수 명사」와 「each + 단수 명사」는 하나하나를 따로 보는 말이라 동사도 \u003cb class=\"key\">단수 동사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">every / each + 단수 명사 + 단수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Every rule has\u003c/span> its exception.\u003c/div>\u003cdiv class=\"g-ko\">모든 규칙에는 예외가 있다.\u003c/div>\u003cdiv class=\"g-note\">every 뒤에 단수 명사 rule이 와서 단수 동사 has를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Each member in the group has\u003c/span> a nickname.\u003c/div>\u003cdiv class=\"g-ko\">그 그룹의 각 구성원은 별명이 있다.\u003c/div>\u003cdiv class=\"g-note\">each 뒤에 단수 명사 member가 와서 단수 동사 has를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>every나 each 뒤에 복수 명사를 쓰거나 복수 동사를 쓰면 \u003cb class=\"key\">틀린 문장\u003c/b>이 되니 주의하세요.\u003c/div>","segs":[{"n":17,"text":"마지막으로 every와 each를 볼게요. 이 둘은 뒤에 오는 명사가 여러 개를 가리키는 것처럼 느껴져도 항상 단수 명사를 데리고 와요. 그리고 동사도 단수 동사를 씁니다. 여러 개를 하나하나 따로 보는 말이기 때문이에요.","hl":"rule"},{"n":18,"text":"Every rule has its exception. 모든 규칙에는 예외가 있다는 뜻이에요. every 뒤에 단수 명사 rule이 왔고, 그래서 동사도 단수인 has를 썼습니다.","hl":"ex-0"},{"n":19,"text":"Each member in the group has a nickname. 그 그룹의 각 구성원은 별명이 있다는 뜻이에요. each 뒤에 단수 명사 member가 왔으니 동사는 단수인 has가 맞아요.","hl":"ex-1"},{"n":20,"text":"뜻은 여러 개인데 문법은 단수라는 점, 이 차이를 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Some of the milk were spilled.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Some of the milk was spilled.\u003c/div>\u003cdiv class=\"g-why\">of 뒤 milk가 단수 명사라 단수 동사 was를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003 ss=\"g-exp\">every 뒤에는 단수 명사 rule이 오고 동사도 단수 has를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"다섯 번째 문제는 단어 배열이에요. every, has, rule, its, exception 이 단어들을 알맞게 배열해서 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":6},{"n":38,"text":"정답은 Every rule has its exception입니다. 모든 규칙에는 예외가 있다는 뜻이죠. every 뒤에는 단수 명사 rule이 오고, 동사도 단수인 has를 쓴다는 점을 확인해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">None of this money ____ yours.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>are\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>is\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>were\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>be\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is\u003c/span>\u003cdiv class=\"g-exp\">none of 뒤에 단수 명사 money가 왔으므로 단수 동사 is를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":39,"text":"마지막 문제예요. None of this money 빈칸 yours. 빈칸에 알맞은 동사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":40,"text":"","hl":"q","pause":6},{"n":41,"text":"정답은 두 번째 보기인 is예요. none of 뒤에 있는 money가 단수 명사라서 단수 동사 is를 씁니다. None of this money is yours, 이 돈은 하나도 네 것이 아니라는 뜻이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">수의 일치 (주어와 동사의 일치)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>「most, all, some, half, percent, 분수 + of + 명사」에서는 of 뒤 \u003cb class=\"key\">명사\u003c/b>의 수에 동사를 맞춘다.\u003c/li>\u003cli>「none of + 단수 명사」는 단수 동사, 「none of + 복수 명사」는 \u003cb class=\"key\">단수 동사\u003c/b>와 복수 동사를 모두 쓸 수 있다.\u003c/li>\u003cli>\u003cb class=\"key\">a number of\u003c/b>는 '많은'이라 복수 동사, \u003cb class=\"key\">the number of\u003c/b>는 '~의 수'라 단수 동사를 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">every\u003c/b>와 \u003cb class=\"key\">each\u003c/b> 뒤에는 단수 명사와 단수 동사를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":42,"text":"오늘은 수의 일치를 배웠어요. most나 some, half, percent, 분수가 of와 함께 나오면 of 뒤 명사를 보고 동사를 정한다는 점, 꼭 기억하세요. none of는 뒤 명사의 수에 따라 달라지고, a number of는 복수 동사, the number of는 단수 동사를 쓴다는 것도 정리했죠. 마지막으로 every와 each 뒤에는 항상 단수 명사와 단수 동사가 온다는 것까지 챙겨 두세요. 오늘 배운 규칙으로 예문을 다시 한 번 소리 내어 읽어 보면 훨씬 오래 남을 거예요. 수고했어요, 여러분!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
