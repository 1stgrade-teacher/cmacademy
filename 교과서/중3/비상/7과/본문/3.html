<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 7과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 7과 본문3","audioDir":"3_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 7과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Diderot Effect: Why One Purchase Leads to Another\u003c/h1>\u003ch2>디드로 효과: 하나의 구매가 또 다른 구매를 부르는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새 물품을 구매한 후 그에 어울리는 다른 물품들을 연쇄적으로 사게 되는 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>에 대해 설명하며, 리사와 \u003cb class=\"key\">드니 \u003c/b>\u003cb class=\"key\">디드로\u003c/b>의 사례를 통해 \u003cb class=\"key\">계획되지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">구매\u003c/b>의 발생 원인을 보여줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Diderot effect explains how purchasing a new item often triggers a chain reaction of unplanned complementary purchases.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 우리가 쇼핑을 할 때 왜 하나를 사면 자꾸 다른 것까지 사게 되는지, 그 심리적 이유를 다룬 지문을 함께 공부할 거예요. 이번 시간에는 디드로 효과라는 흥미로운 개념과 그 사례를 통해 글의 요지를 파악해 보겠습니다. 이 글의 요지는 새로운 물건을 사는 것이 흔히 계획에 없던 추가 구매로 이어진다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과(Diderot \u003c/b>\u003cb class=\"key\">Effect)\u003c/b>는 18세기 프랑스 철학자 드니 디드로가 쓴 에세이에서 유래한 용어로, 하나의 물건을 새로 사면 그에 맞춰 \u003cb class=\"key\">조화(harmony)\u003c/b>를 이루기 위해 주변의 다른 물건들까지 바꾸게 되는 현상을 말합니다. 경제학적으로는 \u003cb class=\"key\">연쇄 \u003c/b>\u003cb class=\"key\">소비\u003c/b>의 일종으로 분류됩니다. 예를 들어, 거실에 아주 비싼 \u003cb class=\"key\">명품 \u003c/b>\u003cb class=\"key\">소파\u003c/b> 하나를 들여놓았는데, 갑자기 낡은 카펫과 커튼이 거슬려 전부 새로 사게 되는 상황과 같습니다. 이 효과는 소비자가 자신의 \u003cb class=\"key\">정체성\u003c/b>을 물건의 조화로 유지하려는 심리에서 비롯됩니다.\u003c/div>","segs":[{"n":2,"text":"디드로 효과라는 말을 들어본 적 있나요? 이 용어는 십팔 세기 프랑스의 철학자 드니 디드로의 이름에서 따온 거예요. 그는 아주 멋진 가운을 선물 받았는데, 그 가운이 너무 예쁘다 보니 원래 쓰던 낡은 책상과 의자가 갑자기 너무 초라해 보였대요. 결국 가운에 어울리는 새로운 가구들로 집안을 다 바꿔버렸죠. 우리 일상에서도 새 신발을 사면 그에 어울리는 양말과 바지를 새로 사는 것과 같은 현상을 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>리사의 연쇄 쇼핑\u003csmall>예시 도입 · 문장 1–7\u003c/small>\u003c/h4>\u003cp>리사가 새 코트를 산 후, 바지와 가방을 \u003cb class=\"key\">연쇄적으로\u003c/b> 구매하는 과정을 보여줍니다. 이는 새 코트와 기존 물건들이 \u003cb class=\"key\">어울리지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>고 느끼기 때문에 발생하는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">지출\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>디드로 효과의 소개\u003csmall>개념 제시 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>리사가 왜 그런 행동을 했는지 질문하며 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 용어를 도입합니다. 이 현상을 설명할 수 있는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이 등장하는 전환점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>디드로의 실화\u003csmall>상세 예시 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>용어의 유래가 된 프랑스 작가 \u003cb class=\"key\">드니 \u003c/b>\u003cb class=\"key\">디드로\u003c/b>의 일화를 소개합니다. 새 가운을 선물 받은 뒤 그와 어울리지 않는 가구들을 모두 \u003cb class=\"key\">교체하게 \u003c/b>\u003cb class=\"key\">된\u003c/b> 실제 사례입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>개념의 정의\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>디드로 효과가 무엇인지 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">정의\u003c/b>합니다. 새로운 물품의 구입이 \u003cb class=\"key\">계획에 \u003c/b>\u003cb class=\"key\">없던\u003c/b> 구매로 이어진다는 점을 명시하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 리사의 일상적인 쇼핑 사례로 시작해서 역사적 유래를 거쳐 개념 정의로 마무리되는 구조를 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 일곱 번째 문장까지는 리사의 사례입니다. 새 코트를 산 리사가 바지가 코트와 어울리지 않는다는 것을 알고 바지를 사고, 또 가방까지 사게 되는 연쇄적인 소비 과정을 보여주고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 여덟 번째와 아홉 번째 문장에서는 질문을 던지며 분위기를 전환합니다. 리사가 왜 즉시 새로운 물건들을 찾게 되었는지 궁금해하며 디드로 효과라는 용어를 처음으로 소개합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 열 번째 문장부터 열두 번째 문장까지는 이 용어의 주인공인 프랑스 작가 드니 디드로의 일화가 나옵니다. 새 가운을 선물 받은 후 주변 가구들을 모두 바꾸게 된 실제 경험담을 통해 개념을 구체화합니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 열세 번째 문장은 글의 결론입니다. 디드로 효과를 새로운 물품 구매가 계획에 없던 더 많은 구매로 이어진다는 개념이라고 명확하게 정의하며 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시-정의\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">리사와 디드로의 구체적인 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 먼저 제시하여 독자의 호기심을 유발합니다. 이후 질문을 통해 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 핵심 용어를 도입하고, 마지막 문장에서 이 현상의 핵심 내용을 \u003cb class=\"key\">일반화(generalization)\u003c/b>하여 정의하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (4)\u003c/b>\u003cspan>인과관계의 결과 제시\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>추가적인 문제 발생 알림\u003c/span>\u003cb>The &quot;Diderot effect&quot; (9)\u003c/b>\u003cspan>핵심 개념어 도입\u003c/span>\u003cb>therefore (13)\u003c/b>\u003cspan>최종 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">new coat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new items\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new look\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new gown\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more unplanned purchases\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 구체적인 사례를 먼저 보여주고 마지막에 그 원리를 설명하는 미괄식 구조입니다. 전개 방식은 예시와 정의를 결합한 형태인데, 독자가 공감할 수 있는 이야기를 먼저 배치해서 집중력을 높이고 있어요.","hl":"ty"},{"n":9,"text":"문장 곳곳에 인과관계를 나타내는 So나 결론을 이끄는 Therefore 같은 신호어들이 보이죠. 특히 아홉 번째 문장에서 Diderot effect라는 핵심 용어가 등장하면서 글의 중심 소재가 명확해집니다. 마지막 문장에서 unplanned purchases라는 표현으로 소비의 성격을 다시 한번 짚어주는 재진술도 중요합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>a pair of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 쌍의\u003c/span>\u003c/div>\u003cdiv>\u003cb>pants\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바지\u003c/span>\u003c/div>\u003cdiv>\u003cb>coat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코트\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>immediately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉시\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>어울리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfectly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완벽하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>go with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 어울리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>none of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 중 아무도 ~않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clothes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 (돈을) 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complete\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모습, 외양\u003c/span>\u003c/div>\u003cdiv>\u003cb>search for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>writer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작가\u003c/s pent [be동사 + 과거분사] : \"쓰인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + complete [동사원형] : \"완성하기 위하여\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Most of her money, 그녀의 돈 대부분이. is spent on buying, 사는 데 쓰인다. the new items, 새로운 물품들을. to complete her new look, 그녀의 새로운 모습을 완성하기 위하여.. 이 문장 전체를 해석하면, 그녀의 돈 대부분이 그녀의 새로운 모습을 완성하기 위하여 새로운 물품을 사는 데 쓰인다.","hl":"m"},{"n":31,"text":"리사가 새로운 옷차림의 조화를 맞추려고 계속 물건을 사다 보니 결국 대부분의 돈을 다 써버리게 된 상황을 보여줍니다. 이렇게 하나의 구매가 다른 구매로 이어지는 연쇄 소비의 전형적인 모습이죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 is spent예요. 주어인 돈은 쓰여지는 대상이기 때문에 비동사와 과거분사를 결합한 수동태를 썼습니다. 주어가 셀 수 없는 명사의 대부분을 뜻하므로 단수 동사 is를 쓴 것도 기억하세요. 두 번째는 to complete입니다. 물건을 왜 사는지 그 목적을 설명하는 투부정사의 부사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 Lisa를 ~하게 했나\u003c/span>\u003cspan class=\"en\">What \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">Lisa \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 물품을 찾도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">search\u003c/span> for new items\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직후에\u003c/span>\u003cspan class=\"en\">immediately \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 코트를 산?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">buying\u003c/span> a new coat?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무엇이 Lisa로 하여금 새 코트를 산 후 즉시 새로운 물품을 찾게 했을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리사의 구체적인 행동 사례에 대해 의문을 제기하며 독자의 호기심을 자극합니다. 개별 사례에서 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">이론\u003c/b>으로 내용을 넘기는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 + 목적어 + 동사원형\u003c/span> : made [사역동사] + Lisa [목적어] + search [동사원형] : \"리사가 찾게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사\u003c/span> : after [전치사] + buying [동명사] : \"산 후에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"What made Lisa, 무엇이 Lisa를 ~하게 했나. search for new items, 새로운 물품을 찾도록. immediately after, 직후에. buying a new coat?, 새 코트를 산?. 이 문장 전체를 해석하면, 무엇이 Lisa로 하여금 새 코트를 산 후 즉시 새로운 물품을 찾게 했을까?","hl":"m"},{"n":34,"text":"리사의 행동 뒤에 어떤 심리학적 이유가 있는지 질문을 던지는 문장입니다. 리사 개인의 이야기에서 이제 일반적인 이론인 디드로 효과로 넘어가는 중요한 전환점이죠.","hl":"mn"},{"n":35,"text":"첫 번째 문법은 made Lisa search입니다. 메이크가 사역동사로 쓰여서 목적어인 리사가 하는 동작을 동사원형인 서치로 표현했어요. 두 번째는 after buying입니다. 전치사 뒤에 명사 성질이 필요해서 동명사 바잉을 썼고 코트를 사고 난 후라는 시간적 전후 관계를 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘디드로 효과’가\u003c/span>\u003cspan class=\"en\">The &quot;Diderot effect&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 설명해 줄지도 모른다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">explain\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘디드로 효과’가 그것을 설명해 줄지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 리사의 행동에 대한 과학적 근거를 제시합니다. 이 글의 핵심 키워드인 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 본격적으로 도입하는 \u003cb class=\"key\">주제문\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 동사원형\u003c/span> : may [조동사] + explain [동사원형] : \"설명해 줄지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The \"Diderot effect\", ‘디드로 효과’가. may explain it, 그것을 설명해 줄지도 모른다.. 이 문장 전체를 해석하면, ‘디드로 효과’가 그것을 설명해 줄지도 모른다.","hl":"m"},{"n":37,"text":"리사가 왜 계속 물건을 샀는지에 대한 해답으로 디드로 효과를 제시합니다. 이 지문의 가장 핵심적인 용어인 디드로 효과를 소개하는 주제문 성격의 문장이에요.","hl":"mn"},{"n":38,"text":"여기서는 may explain 부분만 주의하면 돼요. 메이는 추측을 나타내는 조동사로 쓰였고 뒤에는 반드시 익스플레인처럼 동사원형이 와야 합니다. 확신하기보다는 가능성을 열어두고 설명할 수도 있다는 의미를 전달하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Denis Diderot는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Denis \u003c/span>\u003cspan class=\"tgt\">Diderot, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스 작가인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">French \u003c/span>\u003cspan class=\"tgt\">writer,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 가운을 받았다\u003c/span>\u003cspan class=\"en\">received a new gown\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로.\u003c/span>\u003cspan class=\"en\">as a gift.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">프랑스 작가인 Denis Diderot는 선물로 새 가운을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디드로 효과라는 명칭이 유래된 역사적인 \u003cb class=\"key\">인물\u003c/b>을 소개하는 문장입니다. 새로운 \u003cb class=\"key\">가운\u003c/b>이 생기면서 이어지는 모든 사건의 발단이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : 명사(A), 명사구(B), : \"프랑스 작가인 Denis Diderot\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Denis Diderot, Denis Diderot는. a French writer, 프랑스 작가인. received a new gown, 새 가운을 받았다. as a gift, 선물로.. 이 문장 전체를 해석하면, 프랑스 작가인 Denis Diderot는 선물로 새 가운을 받았다.","hl":"m"},{"n":40,"text":"이 문장은 디드로 효과의 이름이 어디서 왔는지 보여주기 위해 프랑스의 작가 디드로를 등장시키고 있어요. 선물로 받은 새 가운이 나중에 어떤 일을 벌일지 궁금해지죠?","hl":"mn"},{"n":41,"text":"첫 번째로 Denis Diderot 뒤에 있는 콤마를 보세요. 이 콤마는 문장에서 동격의 역할을 하는데요, 앞의 인물과 뒤에 나오는 프랑스 작가라는 말이 서로 같은 사람임을 나타내 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 후에\u003c/span>\u003cspan class=\"en\">Soon \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선물을 받은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">receiving\u003c/span> the gift,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 알아챘다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">noticed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 모든 가구가 ~하다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> all of his furniture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어울리지 않는다는 것을\u003c/span>\u003cspan class=\"en\">did not go well with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 새로운 가운과.\u003c/span>\u003cspan class=\"en\">his new gown.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 선물을 받은 후에 곧 그는 그의 모든 가구가 새로운 가운과 어울리지 않는다는 것을 알아챘다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 물건이 들어오면서 기존 물건들과의 \u003cb class=\"key\">부조화\u003c/b>를 인식하게 되는 과정입니다. 이러한 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 불필요한 추가 구매로 이어지는 핵심 원인입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : 전치사 + V-ing : \"받은 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : noticed [동사] + that [접속사] + S + V [목적어절] : \"~라는 점을 알아챘다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Soon after, 곧 후에. receiving the gift, 그 선물을 받은. he noticed, 그는 알아챘다. that all of his furniture, 그의 모든 가구가 ~하다는 것을. did not go well with, 어울리지 않는다는 것을. his new gown, 그의 새로운 가운과.. 이 문장 전체를 해석하면, 그 선물을 받은 후에 곧 그는 그의 모든 가구가 새로운 가운과 어울리지 않는다는 것을 알아챘다.","hl":"m"},{"n":43,"text":"새 가운을 입어보니 원래 잘 쓰던 가구들이 갑자기 가운과 격이 맞지 않는 것처럼 보이기 시작한 거예요. 이것이 바로 디드로 효과의 시작인 부조화의 인식 단계입니다.","hl":"mn"},{"n":44,"text":"첫 번째로 after receiving 부분을 보세요. 전치사 뒤에 동사를 쓰고 싶을 때는 이렇게 동명사 형태로 바꿔야 합니다. 두 번째는 noticed 뒤의 that이에요. 이건 뒤에 나오는 문장 전체를 하나로 묶어서 목적어로 만들어주는 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 결국 ~하게 되었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ended \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바꾸고 말았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">replacing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 대부분을.\u003c/span>\u003cspan class=\"en\">most of it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그는 결국 대부분의 가구를 바꾸고 말았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조화를 맞추기 위해 원래 계획에 없던 \u003cb class=\"key\">대규모 \u003c/b>\u003cb class=\"key\">교체\u003c/b>를 감행한 결과입니다. \u003cb class=\"key\">충동적인 \u003c/b>\u003cb class=\"key\">소비\u003c/b>의 연쇄 반응이 일어났음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 관용표현\u003c/span> : end up + V-ing : \"결국 바꾸게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So, 그래서. he ended up, 그는 결국 ~하게 되었다. replacing, 바꾸고 말았다. most of it, 그것의 대부분을.. 이 문장 전체를 해석하면, 그래서 그는 결국 대부분의 가구를 바꾸고 말았다.","hl":"m"},{"n":46,"text":"가운 하나 때문에 가구를 싹 다 바꿔버렸대요. 정말 배보다 배꼽이 더 큰 상황이죠? 이것이 바로 우리가 배우고 있는 디드로 효과의 결론적인 행동을 보여줍니다.","hl":"mn"},{"n":47,"text":"여기서 꼭 외워야 할 표현은 바로 ended up 뒤에 동명사가 오는 구조예요. 결국 어떤 행동을 하게 되었다는 의미를 전달할 때 replacing처럼 꼭 ing 형태를 써야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로 디드로 효과는,\u003c/span>\u003cspan class=\"en\">The Diderot effect, therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개념이다\u003c/span>\u003cspan class=\"en\">is the \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">concept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 물품을 구입하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">purchasing\u003c/span> a new item\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔히 ~로 이어진다는\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leads \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 계획에 없던 구매로.\u003c/span>\u003cspan class=\"en\">more unplanned purchases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 디드로 효과는 새로운 물품을 구입하는 것이 흔히 계획에 없던 더 많은 구매로 이어진다는 개념이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리사와 디드로의 일화를 바탕으로 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>의 최종 정의를 내리는 핵심 문장입니다. 하나의 물건을 사면 그에 어울리는 다른 물건들을 계속 사게 되는 \u003cb class=\"key\">연쇄 \u003c/b>\u003cb class=\"key\">소비\u003c/b> 현상을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : the concept [명사] + that [접속사] + [완전한 문장] : \"~라는 개념\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : purchasing [동명사/주어] + ... + leads [단수 동사] : \"구입하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인과관계 표현\u003c/span> : A [원인] + lead to + B [결과] : \"~로 이어지다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The Diderot effect, therefore, 그러므로 디드로 효과는. is the concept, 개념이다. that purchasing a new item, 새로운 물품을 구입하는 것이. often leads to, 흔히 ~로 이어진다는. more unplanned purchases, 더 많은 계획에 없던 구매로.. 이 문장 전체를 해석하면, 그러므로 디드로 효과는 새로운 물품을 구입하는 것이 흔히 계획에 없던 더 많은 구매로 이어진다는 개념이다.","hl":"m"},{"n":49,"text":"이 문장은 앞에서 본 리사와 디드로의 이야기를 정리하며 디드로 효과의 정의를 내려주고 있어요. 하나의 소비가 꼬리에 꼬리를 물고 계획에 없던 추가 구매를 부르는 현상을 요약한 결론 부분입니다.","hl":"mn"},{"n":50,"text":"첫 번째로 concept 뒤의 that은 동격의 접속사예요. 뒤에 완벽한 문장이 와서 개념의 구체적인 내용을 설명해주죠. 두 번째로 purchasing은 that절 안의 주어로 쓰인 동명사예요. 동명사가 주어일 때는 단수 취급을 하기 때문에 동사 leads에 s가 붙어 있다는 점을 꼭 확인하세요. 세 번째로 leads to는 어떤 원인이 결과로 이어진다는 아주 중요한 수거입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>리사는 새 코트를 구입한 후 바지와 가방을 \u003cb class=\"key\">연쇄적으로\u003c/b> 구매했습니다.\u003c/li>\u003cli>이러한 현상은 심리학 및 경제학 용어로 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라고 불립니다.\u003c/li>\u003cli>프랑스 작가 \u003cb class=\"key\">드니 \u003c/b>\u003cb class=\"key\">디드로\u003c/b>도 가운을 선물 받은 뒤 가구를 모두 바꾼 경험이 있습니다.\u003c/li>\u003cli>새로운 물건의 구매가 \u003cb class=\"key\">계획되지 \u003c/b>\u003cb class=\"key\">않은\u003c/b> 추가 구매로 이어지는 것이 이 효과의 정의입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Diderot effect explains how purchasing a new item often triggers a chain reaction of unplanned complementary purchases.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새 물품을 구매한 후 그에 어울리는 다른 물품들을 연쇄적으로 사게 되는 \u003cb class=\"key\">디드로 \u003c/b>\u003cb class=\"key\">효과\u003c/b>에 대해 설명하며, 리사와 \u003cb class=\"key\">드니 \u003c/b>\u003cb class=\"key\">디드로\u003c/b>의 사례를 통해 \u003cb class=\"key\">계획되지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">구매\u003c/b>의 발생 원인을 보여줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 하나의 소비가 꼬리에 꼬리를 무는 디드로 효과에 대해 배웠습니다. 글의 마지막 문장이 전체 내용을 관통하는 주제문이라는 점을 잊지 마세요. 여러분도 무언가 새로 샀을 때 리사처럼 행동하지 않았는지 생각해보면 지문이 더 잘 기억날 거예요. 수고하셨습니다.","hl":null}]}]});</script></body></html>
