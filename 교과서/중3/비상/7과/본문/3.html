ve bought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새 코트를</span><span class=\"en\"><b>a new coat?</b></span></div></div><div class=\"lec-sent-ko\">나는 왜 새 코트를 구입한 후에 바지와 가방을 사는 걸까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 핵심 소재인 &#39;소비의 연쇄 반응&#39;에 대해 독자에게 질문을 던지며 글을 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why do I buy (간접의문문): 의문사(Why)로 시작하는 의문문 구조로, 주어와 동사의 순서가 도치된 기본 의문문 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">리사는 코트를 산다</span><span class=\"en\"><b>Lisa buys a coat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 정말로 사랑하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that she really loves</span>.</b></span></div></div><div class=\"lec-sent-ko\">Lisa는 정말 마음에 드는 코트를 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;디드로 효과&#39;를 설명하기 위한 가상의 인물 리사를 도입하여 일상적인 소비 상황을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that she really loves (관계대명사): 목적격 관계대명사 that이 이끄는 절이 앞의 명사(a coat)를 수식하며, 뒤의 loves라는 타동사의 목적어 자리가 비어 있는 불완전한 절이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즉시, 그녀는 알아차린다</span><span class=\"en\"><b>Immediately, she <span class=\"grammar-hl\">realizes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 바지가</span><span class=\"en\"><b><span class=\"grammar-hl\">that her pants</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어울리지 않는다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">do not match</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 새 코트와</span><span class=\"en\"><b>her new coat.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그녀의 바지가 새 코트와 어울리지 않는다는 것을 즉시 알아차린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Immediately는 &#39;즉시&#39;라는 뜻이지만, 여기서는 고민할 틈도 없이 새로운 소비의 욕구가 곧바로 뒤따른다는 점을 강조하여 충동의 속도감을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">realizes that her pants do not match 명사절 that: realizes라는 타동사의 목적어 역할을 하는 명사절을 이끄는 접속사 that으로, 완전한 문장이 뒤따른다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 그녀는 새 바지를 산다</span><span class=\"en\"><b>So, she buys new pants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완벽하게 어울리는</span><span class=\"en\"><b><span class=\"grammar-hl\">that go perfectly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 새 코트와</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> her new coat.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그녀는 새 코트와 완벽하게 어울리는 새 바지를 구입한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 깨달음(문제 발생)에 대한 결과로 새로운 소비(해결책)가 이어지는 인과 관계를 보여줍니다. go는 단순히 &#39;가다&#39;가 아니라 &#39;어울리다&#39;라는 뜻으로, 물건들이 서로 조화를 이루는 상태를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that go perfectly with (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 명사(new pants)를 수식하며, 관계대명사 that이 절 내에서 주어 역할을 수행한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그녀는 알게 된다</span><span class=\"en\"><b>But she sees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 가방 중 어느 것도</span><span class=\"en\"><b><span class=\"grammar-hl\">that none of her bags</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어울리지 않는다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">match</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 새 옷들과</span><span class=\"en\"><b>her new clothes.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그녀는 자신의 가방 중 어느 것도 새로운 옷들과 어울리지 않는다는 것을 알게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 산 코트와 바지에 맞춰 가방까지 어울리지 않는다고 느끼며 소비의 범위가 계속 확장되는 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that none of her bags match 명사절 that: sees라는 타동사의 목적어 역할을 하는 명사절로, 완전한 문장이 결합되어 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 그녀는 산다</span><span class=\"en\"><b><span class=\"grammar-hl\">So, she buys</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새 가방을</span><span class=\"en\"><b><span class=\"grammar-hl\">a new bag.</span></b></span></div></div><div class=\"lec-sent-ko\">그래서 그녀는 새 가방을 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 문제를 해결하기 위해 또다시 소비를 하는 모습으로, 상황이 반복됨을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">So, she buys a new bag. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 돈 대부분은</span><span class=\"en\"><b>Most of her money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰인다</span><span class=\"en\"><b><span class=\"grammar-hl\">is spent</span> <span class=\"grammar-hl\">on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 물품들을 사는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">buying</span> the new items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 새로운 모습을 완성하기 위하여</span><span class=\"en\"><b><span class=\"grammar-hl\">to complete</span> her new look.</b></span></div></div><div class=\"lec-sent-ko\">그녀의 돈 대부분이 그녀의 새로운 모습을 완성하기 위하여 새로운 물품을 사는 데 쓰인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> complete는 &#39;완성하다&#39;라는 뜻인데, 여기서는 단순히 물건을 갖추는 것을 넘어 &#39;완벽한 스타일&#39;을 만들겠다는 심리적 만족감을 추구한다는 의미를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is spent (수동태): be동사(is) + p.p.(spent) 구조. spend는 타동사(기본구조: spend + O + on B(B에 O를 쓰다))인데 목적어가 주어로 나가면서 수동구조가 되었다.</div><div class=\"lec-gr-item\">on buying (동명사): 전치사(on) 뒤에 위치하여 명사적 기능을 하며, &#39;구매하는 것&#39;이라는 행위를 나타낸다.</div><div class=\"lec-gr-item\">to complete (to부정사): 앞의 the new items를 목적(…하기 위해)의 의미로 수식하는 형용사적 용법의 to부정사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇이 리사로 하여금 찾게 만들었나</span><span class=\"en\"><b><span class=\"grammar-hl\">What made Lisa search</span> for</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 물품들을</span><span class=\"en\"><b>new items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직후에</span><span class=\"en\"><b>immediately <span class=\"grammar-hl\">after</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새 코트를 산</span><span class=\"en\"><b><span class=\"grammar-hl\">buying</span> a new coat?</b></span></div></div><div class=\"lec-sent-ko\">무엇이 Lisa로 하여금 새 코트를 산 후 즉시 새로운 물품을 찾게 했을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 사례를 학술적인 개념으로 연결하기 위해 다시 한번 질문을 던지며 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What made Lisa search 5형식(SVOC) 구조: make(사역동사) + 목적어(Lisa) + 목적보어(search/동사원형)의 구조로, 목적어가 ~하게 만들다라는 의미를 가진다.</div><div class=\"lec-gr-item\">after buying (동명사): 전치사(after)의 목적어 자리에 위치한 동명사로, &#39;구매한 이후&#39;라는 명사적 개념을 표현한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘디드로 효과’가</span><span class=\"en\"><b><span class=\"grammar-hl\">The “Diderot effect”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명해 줄지도 모른다</span><span class=\"en\"><b><span class=\"grammar-hl\">may explain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it.</span></b></span></div></div><div class=\"lec-sent-ko\">‘디드로 효과’가 그것을 설명해 줄지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현상을 설명할 핵심 이론인 &#39;디드로 효과&#39;를 처음으로 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The “Diderot effect” may explain it. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">드니 디드로가,</span><span class=\"en\"><b><span class=\"grammar-hl\">Denis Diderot,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프랑스 작가인,</span><span class=\"en\"><b><span class=\"grammar-hl\">a French writer,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새 가운을 받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">received</span> a new gown</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선물로</span><span class=\"en\"><b>as a gift.</b></span></div></div><div class=\"lec-sent-ko\">프랑스 작가인 Denis Diderot는 선물로 새 가운을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;디드로 효과&#39;라는 명칭의 유래가 된 인물과 구체적인 일화를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Denis Diderot, a French writer, received 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선물을 받은 직후에,</span><span class=\"en\"><b>Soon after <span class=\"grammar-hl\">receiving</span> the gift,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 알아챘다</span><span class=\"en\"><b>he noticed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 모든 가구가</span><span class=\"en\"><b><span class=\"grammar-hl\">that all of his furniture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 어울리지 않는다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">did not go</span> well</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 새 가운과</span><span class=\"en\"><b>with his new gown.</b></span></div></div><div class=\"lec-sent-ko\">그 선물을 받은 후에 곧 그는 그의 모든 가구가 새로운 가운과 어울리지 않는다는 것을 알아챘다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 리사의 사례와 마찬가지로, 새로운 물건이 기존의 물건들과 조화를 이루지 못한다고 느끼는 심리적 변화를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">receiving (동명사): 전치사(after)의 목적어로 사용된 동명사이며, &#39;선물을 받는 것&#39;이라는 동작을 명사화했다.</div><div class=\"lec-gr-item\">that all of his furniture did not go 명사절 that: noticed라는 타동사의 목적어 역할을 하며 완전한 문장이 뒤따르는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 그는 결국 ~하게 되었다</span><span class=\"en\"><b>So, he <span class=\"grammar-hl\">ended up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꾸는 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">replacing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 대부분을</span><span class=\"en\"><b>most of it.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그는 결국 대부분의 가구를 바꾸고 말았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> ended up은 사전적으로 &#39;결국 ~하게 되다&#39;인데, 단순히 결과를 뜻하는 것이 아니라 애초에 계획하지 않았던 소비가 연쇄적으로 일어난 결말을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ended up replacing (관용표현): end up + -ing(결국 ~하게 되다) 구문으로, 전치사 up 뒤의 동명사 replacing이 행위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디드로 효과는, 그러므로,</span><span class=\"en\"><b>The Diderot effect, therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개념이다</span><span class=\"en\"><b>is the concept</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 물품을 구입하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that purchasing a new item</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔히 이어진다는</span><span class=\"en\"><b><span class=\"grammar-hl\">often leads</span> to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 계획에 없던 구매로</span><span class=\"en\"><b>more unplanned purchases.</b></span></div></div><div class=\"lec-sent-ko\">그러므로 디드로 효과는 새로운 물품을 구입하는 것이 흔히 계획에 없던 더 많은 구매로 이어진다는 개념이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 두 사례를 종합하여 &#39;디드로 효과&#39;의 정의를 내리는 결론 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that purchasing a new item often leads 동격의 that: 앞의 추상명사(the concept)와 that절이 같은 내용을 담고 있으며, 명사의 내용을 구체적으로 설명하는 동격의 that이다.</div><div class=\"lec-gr-item\">purchasing (동명사): that절 내부에서 주어 역할을 하며, &#39;물건을 구매하는 것&#39;이라는 명사적 행위를 나타낸다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>리사가 코트를 산 후 바지와 가방까지 연달아 사는 상황을 제시한다.</li><li>이는 새로운 물건이 기존 물건과 조화를 이루지 못해 발생하는 현상이다.</li><li>프랑스 작가 디드로의 일화에서도 같은 현상이 확인된다.</li><li>이처럼 하나의 물건을 사면 계속해서 추가 소비를 하게 되는 현상을 &#39;디드로 효과&#39;라고 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Diderot effect explains how buying a new item makes people feel dissatisfied with their old belongings, and it results in a cycle of unplanned purchases.</div>\n              <div class=\"lec-final-sum-ko\">디드로 효과는 새로운 물건을 사는 것이 어떻게 사람들이 기존 소유물에 불만족을 느끼게 만드는지 설명하며, 이는 계획에 없던 구매의 악순환을 초래한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":"main"},{"audio":"./3_audio/4.mp3","hl":"meaning"},{"audio":"./3_audio/5.mp3","hl":"grammar"}],[{"audio":"./3_audio/6.mp3","hl":"main"},{"audio":"./3_audio/7.mp3","hl":"meaning"},{"audio":"./3_audio/8.mp3","hl":"grammar"}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main
