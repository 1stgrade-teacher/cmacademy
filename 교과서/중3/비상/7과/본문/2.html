<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 7과 본문2","audioDir":"2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 7과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Bandwagon Effect: Why We Follow the Crowd\u003c/h1>\u003ch2>밴드 왜건 효과: 우리가 군중을 따르는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>남들이 사면 나도 사고 싶어지는 \u003cb class=\"key\">밴드 \u003c/b>\u003cb class=\"key\">왜건 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 설명하며, Jeff의 사례를 통해 사람들이 \u003cb class=\"key\">타인의 \u003c/b>\u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 모방하는 경향을 보여준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The bandwagon effect explains the psychological tendency of individuals to follow others' purchasing behaviors to fit in.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요! 오늘은 우리가 왜 유행을 따라가는지, 그 심리적 배경을 다룬 지문을 함께 공부할 거예요. Jeff라는 친구의 축구화 쇼핑 이야기를 통해 밴드 왜건 효과의 개념을 배워볼 텐데요. 핵심은 우리가 물건을 살 때 필요보다는 타인의 시선이나 행동에 큰 영향을 받는다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">동조 \u003c/b>\u003cb class=\"key\">현상\u003c/b>(conformity)의 일종인 밴드 왜건 효과는 서부 개척 시대의 \u003cb class=\"key\">악대차\u003c/b>(bandwagon)에서 유래했습니다. 축제나 퍼레이드에서 악대차가 음악을 연주하며 지나가면 사람들이 그 즐거운 분위기에 이끌려 차 위로 올라타는 모습에 비유한 것입니다. 경제학적으로는 \u003cb class=\"key\">편승 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라고도 불리며, 특정 상품에 대한 수요가 다른 사람들의 구매 여부에 따라 영향을 받는 현상을 의미합니다. 예를 들어, 친구들이 모두 특정 브랜드의 신발을 신으면 나도 소외되지 않기 위해 따라 사는 것이 전형적인 사례입니다. 고등 과정에서는 이를 소비자의 \u003cb class=\"key\">의사결정\u003c/b> 과정에 영향을 미치는 외부적 요인으로 다룹니다.\u003c/div>","segs":[{"n":2,"text":"본문에 들어가기 전에 밴드 왜건 효과라는 용어를 알아야 해요. 서부 개척 시대에 악대차인 bandwagon이 연주하며 지나가면 사람들이 신나서 뒤따라가거나 차에 올라탔거든요. 여기서 유래해서 어떤 선택이 유행하면 대중이 무비판적으로 따르는 현상을 뜻하게 되었죠. 여러분도 반 친구들 사이에서 유행하는 아이템을 보고 괜히 사고 싶었던 적이 있다면, 바로 이 동조 현상을 경험한 것이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>흥미 유발\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>타인의 구매를 \u003cb class=\"key\">모방\u003c/b>하고자 하는 욕구에 대해 질문하며 독자의 관심을 끕니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 사례\u003csmall>예시 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>축구화가 이미 많음에도 팀원들을 따라 새 신발을 사는 \u003cb class=\"key\">Jeff의 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>개념 정의\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>Jeff의 행동을 \u003cb class=\"key\">밴드 \u003c/b>\u003cb class=\"key\">왜건 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 용어로 정의하고 그 유래를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현상 요약\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>더 많은 사람이 참여할수록 \u003cb class=\"key\">동조\u003c/b>가 강해지며, 타인의 소유 여부가 구매 이유가 된다고 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 구체적인 사례를 보여준 뒤, 전문 용어로 그 원인을 정리해 주는 구조로 되어 있어요.","hl":null},{"n":4,"text":"첫 번째 문장에서 필자는 왜 친구들이 산 것을 사고 싶어 하는지 의문을 던지며 시작합니다. 독자들의 흥미를 유발하면서 자연스럽게 주제로 유도하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째부터 네 번째 문장까지는 Jeff의 사례가 나옵니다. 이미 축구화가 많으면서도 팀원들을 따라 새 신발을 결국 사버리고 마는 Jeff의 상황을 묘사하며 실제 생활에서 일어나는 일을 보여줍니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 이런 Jeff의 행동을 설명하는 밴드 왜건 효과의 정의를 내립니다. 그리고 악대차라는 의미의 밴드 왜건이 퍼레이드에서 사람들을 끌어모으는 비유적 표현임을 설명해 줍니다.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째와 여덟 번째 문장에서는 남을 따라 하는 경향이 어떻게 강화되는지 설명합니다. 단지 남들이 샀다는 이유만으로 물건을 사게 되는 결론을 내리며 동조의 특성을 정리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입부에서 질문을 던진 뒤, Jeff라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 통해 현상을 보여줍니다. 이후 밴드 왜건 효과라는 개념을 정의하고, 마지막에 사람들이 타인을 따라 사는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 결론으로 도출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why (1)\u003c/b>\u003cspan>의문 제기\u003c/span>\u003cb>Jeff (2)\u003c/b>\u003cspan>예시 시작\u003c/span>\u003cb>use the bandwagon effect (5)\u003c/b>\u003cspan>개념 제시\u003c/span>\u003cb>In this way (8)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">what my friends bought\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a pair of soccer shoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another new pair\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bandwagon effect\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">something\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문을 던지고 그에 대한 답을 예시와 개념 설명으로 풀어나가는 질문과 답변 구조예요. 특히 마지막 문장에서 사람들의 일반적인 구매 경향을 정리하고 있으므로 주제가 뒤에 나오는 미괄식 구성이라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"첫 번째 문장의 Why라는 질문이 글의 동기를 부여하고, 다섯 번째 문장의 use the bandwagon effect가 답변의 핵심 열쇠가 됩니다. 마지막 여덟 번째 문장의 In this way는 앞의 예시와 설명을 모아 최종 결론을 유도하는 아주 중요한 신호어랍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>want\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>what\u003c/b>\u003cem>접속사\ div class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 새 켤레를\u003c/span>\u003cspan class=\"en\">another new pair.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이미 그에게는 축구화가 많이 있지만 결국 그는 또 새 켤레를 사 버리고 만다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이미 충분한 물건이 있음에도 불구하고, 주변 분위기에 휩쓸려 \u003cb class=\"key\">불필요한 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 하는 모습을 보여줍니다. 이 문장은 제프의 행동을 통해 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>의 모순을 지적합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Although [접속사] + 주어 + 동사 : \"비록 ~이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 관용 표현\u003c/span> : end up + [동사원형-ing (동명사)] : \"결국 ~하게 되다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Although he already has, 비록 그가 이미 가지고 있지만. many pairs of soccer shoes, 많은 축구화들을. he ends up buying, 그는 결국 사 버리고 만다. another new pair, 또 다른 새 켤레를. 이 문장 전체를 해석하면, 이미 그에게는 축구화가 많이 있지만 결국 그는 또 새 켤레를 사 버리고 만다.","hl":"m"},{"n":22,"text":"제프는 이미 축구화가 많은데도 또 신발을 샀어요. 자기 필요가 아니라 남들이 신으니까 사고 싶어 하는 마음을 잘 보여주는 문장입니다. 결국 불필요한 소비를 하게 된 상황이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 Although는 비록 무엇무엇이지만 이라는 뜻의 양보 접속사예요. 뒤에 주어와 동사가 꼭 와야 하죠. 두 번째로 end up buying은 결국 사게 된다는 뜻이에요. end up 뒤에는 반드시 동사원형에 ing를 붙인 동명사 형태를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이용할 수 있다\u003c/span>\u003cspan class=\"en\">We can use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘밴드 왜건 효과’를\u003c/span>\u003cspan class=\"en\">the &quot;bandwagon effect&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jeff의 행동을 설명하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">explain\u003c/span> Jeff's behavior.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 Jeff의 행동을 설명하기 위해 ‘밴드 왜건 효과’를 이용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제프의 구체적인 행동을 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">용어\u003c/b>인 밴드 왜건 효과로 정의하는 단계입니다. 이 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>인 밴드 왜건 효과가 처음 등장합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : can use [동사] + ... + to explain [to부정사] : \"설명하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"We can use, 우리는 이용할 수 있다. the \"bandwagon effect\", ‘밴드 왜건 효과’를. to explain Jeff's behavior, Jeff의 행동을 설명하기 위해. 이 문장 전체를 해석하면, 우리는 Jeff의 행동을 설명하기 위해 ‘밴드 왜건 효과’를 이용할 수 있다.","hl":"m"},{"n":25,"text":"앞서 제프가 신발을 또 샀던 이상한 행동이 있었죠. 그 행동을 설명해 주는 전문 용어가 바로 bandwagon effect라고 소개하는 문장입니다.","hl":"mn"},{"n":26,"text":"여기서 to explain은 to부정사의 부사적 용법 중에서도 목적을 나타내요. 제프의 행동을 설명하려는 목적으로 이 효과를 이용한다는 뜻이라서 무엇무엇 하기 위해라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밴드 왜건은 사륜마차이다\u003c/span>\u003cspan class=\"en\">A bandwagon is a wagon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼레이드에 있는\u003c/span>\u003cspan class=\"en\">in a parade\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 ~하게끔 부추기는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">encourages \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올라타서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">jump\u003c/span> aboard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악을 즐기게끔\u003c/span>\u003cspan class=\"en\">and enjoy the music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밴드 왜건(악대차)은 사람들이 올라타서 음악을 즐기게끔 부추기는 퍼레이드에 있는 사륜마차이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밴드 왜건의 \u003cb class=\"key\">어원\u003c/b>을 설명하는 문장입니다. 축제에서 악대차가 지나가면 사람들이 \u003cb class=\"key\">흥미\u003c/b>를 느끼고 따라가는 물리적 상황을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a wagon [선행사] + that [관계대명사] + encourages [동사] : \"~하는 (사륜마차)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장(목적격 보어로 to부정사)\u003c/span> : encourage [동사] + people [목적어] + to jump [목적격 보어] : \"사람들이 올라타도록 부추기다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"A bandwagon is a wagon, 밴드 왜건은 사륜마차이다. in a parade, 퍼레이드에 있는. that encourages people, 사람들이 ~하게끔 부추기는. to jump aboard, 올라타서. and enjoy the music, 음악을 즐기게끔. 이 문장 전체를 해석하면, 밴드 왜건(악대차)은 사람들이 올라타서 음악을 즐기게끔 부추기는 퍼레이드에 있는 사륜마차이다.","hl":"m"},{"n":28,"text":"밴드 왜건이 원래 무엇인지 설명하고 있어요. 퍼레이드에서 신나는 음악을 연주하며 가는 마차인데, 사람들이 그 흥겨운 소리에 이끌려 자기도 모르게 올라타게 만드는 역할을 한다는 거죠.","hl":"mn"},{"n":29,"text":"첫 번째로 that은 앞의 wagon을 꾸며주는 주격 관계대명사예요. 선행사가 사물이고 뒤에 바로 동사가 나오죠. 두 번째로 encourage라는 동사는 목적어인 people 다음에 목적격 보어로 to jump라는 to부정사를 써요. 목적어가 무엇을 하도록 부추긴다는 5형식 문장 구조를 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밴드 왜건에 올라탈수록,\u003c/span>\u003cspan class=\"en\">get on the bandwagon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들이 더욱 ~하기 쉽다\u003c/span>\u003cspan class=\"en\">others \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 올라타거나 그것을 따라가려\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> get on or follow it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 많은 사람들이 밴드 왜건에 올라탈수록 다른 사람들이 더욱 그것에 올라타거나 그것을 따라가려 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밴드 왜건에 사람이 많아질수록 그 흐름에 \u003cb class=\"key\">동참\u003c/b>하려는 욕구가 커지는 \u003cb class=\"key\">편승 \u003c/b>\u003cb class=\"key\">효과\u003c/b>의 원리를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~함에 따라, ~할수록)\u003c/span> : As + [주어] + [동사] : \"~할수록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : [비교급] + and + [비교급] : \"점점 더 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be likely to (가능성)\u003c/span> : be + likely + to + [동사원형] : \"더욱 ~하기 쉽다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"As more and more people, 더 많은 사람들이. get on the bandwagon, 밴드 왜건에 올라탈수록. others are more likely, 다른 사람들이 더욱 ~하기 쉽다. to get on or follow it, 그것에 올라타거나 그것을 따라가려. 이 문장 전체를 해석하면, 더 많은 사람들이 밴드 왜건에 올라탈수록 다른 사람들이 더욱 그것에 올라타거나 그것을 따라가려 한다.","hl":"m"},{"n":31,"text":"이 문장은 밴드 왜건 효과의 핵심을 보여줍니다. 유행에 참여하는 사람이 늘어날수록 나도 참여해야겠다는 심리적 압박이나 유혹이 강해진다는 편승 효과의 원리를 설명하고 있어요.","hl":"mn"},{"n":32,"text":"세 가지 points를 볼게요. 첫 번째 As는 문장 앞에서 비례를 나타내는 접속사로 쓰여서 뭐뭐 할수록이라고 해석해요. 두 번째 more and more는 비교급 and 비교급 구조로 점점 더 많은이라는 강조의 의미를 담고 있죠. 세 번째 are more likely to는 뭐뭐 할 가능성이 더 높다는 뜻으로 뒤에 동사원형인 get on과 follow가 병렬로 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 식으로,\u003c/span>\u003cspan class=\"en\">In this way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 어떤 것을 구매하는 경향이 있다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span> something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 ~라는 이유만으로\u003c/span>\u003cspan class=\"en\">just because\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들이 그것을 샀다는\u003c/span>\u003cspan class=\"en\">other people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">bought\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 식으로, 사람들은 단지 다른 사람들이 어떤 것을 샀다는 이유만으로 그것을 구매하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 합리적인 필요가 아니라 남을 따라 하는 \u003cb class=\"key\">모방 \u003c/b>\u003cb class=\"key\">소비\u003c/b>가 발생하는 구체적인 \u003cb class=\"key\">양상\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to (경향)\u003c/span> : tend + [to부정사] : \"구매하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 (완료/경험)\u003c/span> : have + [과거분사(p.p.)] : \"샀다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In this way, 이런 식으로. people tend to buy something, 사람들은 어떤 것을 구매하는 경향이 있다. just because, 단지 ~라는 이유만으로. other people have bought it, 다른 사람들이 그것을 샀다는. 이 문장 전체를 해석하면, 이런 식으로, 사람들은 단지 다른 사람들이 어떤 것을 샀다는 이유만으로 그것을 구매하는 경향이 있다.","hl":"m"},{"n":34,"text":"결국 밴드 왜건 효과 때문에 생기는 소비 행태를 정리하는 문장이에요. 물건이 진짜 필요해서가 아니라 단지 남들이 샀으니까 나도 산다는 모방 소비의 심리를 꼬집고 있습니다.","hl":"mn"},{"n":35,"text":"두 가지 주요 어법을 챙기세요. 첫 번째 tend to는 뒤에 동사원형 buy를 데려와서 뭐뭐 하는 경향이 있다는 의미를 만듭니다. 두 번째 have bought는 현재완료 시제예요. 다른 사람들이 이전에 샀던 행동이 현재 사람들의 구매 결정에 영향을 주고 있다는 느낌을 잘 살려주고 있죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>친구들이 산 것을 사고 싶어 하는 마음은 \u003cb class=\"key\">밴드 \u003c/b>\u003cb class=\"key\">왜건 \u003c/b>\u003cb class=\"key\">효과\u003c/b>로 설명된다.\u003c/li>\u003cli>Jeff는 팀원들이 신는 \u003cb class=\"key\">축구화\u003c/b>를 보고 이미 있음에도 또 구매한다.\u003c/li>\u003cli>밴드 왜건은 사람들이 퍼레이드에 \u003cb class=\"key\">참여\u003c/b>하도록 유도하는 악대차를 뜻한다.\u003c/li>\u003cli>사람들은 단지 \u003cb class=\"key\">남들이 \u003c/b>\u003cb class=\"key\">샀다\u003c/b>는 이유만으로 물건을 사는 경향이 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The bandwagon effect explains the psychological tendency of individuals to follow others' purchasing behaviors to fit in.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">남들이 사면 나도 사고 싶어지는 \u003cb class=\"key\">밴드 \u003c/b>\u003cb class=\"key\">왜건 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 설명하며, Jeff의 사례를 통해 사람들이 \u003cb class=\"key\">타인의 \u003c/b>\u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 모방하는 경향을 보여준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘은 Jeff의 사례를 통해 편승 효과라고도 불리는 밴드 왜건 효과를 공부했습니다. 우리는 소비를 할 때 스스로의 필요보다 타인의 영향력을 더 많이 받을 때가 있다는 점을 배웠네요. 오늘 배운 어휘와 문장 구조를 다시 한번 복습하면서 여러분의 것으로 만드세요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
