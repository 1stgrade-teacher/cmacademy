49+Pf1GMGgiU23bRK23V7NN79GndPr2tYyOwxyfbPPXHP+fzKH7px2BxjtwQcdenpjnkcUm4DqwxgYwRgc459OMcZHc4o+VQT/eBOcjkY9T1znv1HfGMOLV16qz36q2nX00vtsQ/00+e2rvvp3v5n/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Bandwagon Effect: Why We Follow the Crowd in Shopping<small>밴드왜건 효과: 우리가 쇼핑할 때 무리를 따르는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리는 살면서 때때로 필요하지 않은 물건임에도 주변 사람들이 많이 가지고 있다는 이유만으로 구매하고 싶어질 때가 있는데, 심리학에서는 이를 편승 효과(Bandwagon Effect)라고 부릅니다. 이 개념은 마치 축제 행렬의 맨 앞에 있는 악대차(bandwagon)를 따라 사람들이 무리 지어 몰려드는 모습에서 유래했는데, 남들이 하니까 나도 뒤처지면 안 된다는 심리가 구매 결정에 큰 영향을 미치는 현상을 말해요. 쉽게 말해 우리가 맛집 앞에서 긴 줄을 보면 &#39;저곳은 분명 맛있을 거야&#39;라고 생각하며 덩달아 줄을 서게 되는 것과 같은 원리랍니다. 이러한 군중 심리(Mob Mentality)는 마케팅에서 매우 중요하게 활용되는데, 제품의 인기를 강조하여 소비자의 소유 욕구를 자극하는 전략으로 주로 사용되곤 하죠. 따라서 우리는 소비할 때 자신의 진짜 필요를 먼저 돌아보는 비판적인 사고(Critical Thinking)를 갖추는 것이 무엇보다 중요합니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b><span class=\"grammar-hl\">Why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 구매하는가</span><span class=\"en\"><b><span class=\"grammar-hl\">We Buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">What We Buy</span></b></span></div></div><div class=\"lec-sent-ko\">(우리는 우리가 사는 것을 왜 구매하는가)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소비자들이 자신의 의지와 상관없이 물건을 구매하는 현상에 대해 독자에게 질문을 던지며, 이 글이 다룰 주제인 &#39;소비 심리&#39;에 대한 호기심을 유발하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why We Buy (간접의문문): 의문사(Why)+주어(We)+동사(Buy)의 어순으로 구성되어 하나의 명사절 역할을 함</div><div class=\"lec-gr-item\">What We Buy (관계대명사): what은 선행사를 포함하는 관계대명사로 &#39;~하는 것&#39;의 의미이며 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 궁금해한 적이 있는가</span><span class=\"en\"><b>Have you ever wondered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 왜 물건들을 구매했는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">why you’ve bought</span> <span class=\"grammar-hl\">things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원하거나 필요로 하지도 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">that you don’t even want or need</span>?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 원하거나 필요로 하지도 않는 것들을 자신이 왜 구매했는지 궁금해한 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소비자들이 자신의 의지와 상관없이 물건을 구매하는 현상에 대해 독자에게 질문을 던지며, 이 글이 다룰 주제인 &#39;소비 심리&#39;에 대한 호기심을 유발하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">why you’ve bought (간접의문문): 의문사(why)+주어(you)+동사(have bought) 어순으로 문장의 목적어 역할을 함</div><div class=\"lec-gr-item\">things that you don’t even want or need (관계대명사): that은 선행사 things를 수식하며 뒤에 주어(you)와 동사(want or need)가 오는 목적격 관계대명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">생각해 보자</span><span class=\"en\"><b>Let’s consider</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 우리에게 영향을 주는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what affects us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건들을 구매하는 것에 관하여</span><span class=\"en\"><b><span class=\"grammar-hl\">when it comes to buying things</span>.</b></span></div></div><div class=\"lec-sent-ko\">물건들을 구매하는 것에 관하여 무엇이 우리에게 영향을 주는지 생각해 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> when it comes to는 사전적으로 &#39;~에 관해서는&#39;이라는 뜻인데, 여기서는 소비 상황을 특정하여 그 원인을 분석해 보자는 제안의 의미입니다. 단순히 &#39;~에 대해&#39;라고 하기보다 특정 상황을 강조하기 위해 이 숙어를 골랐습니다. 앞 문장의 의문점에 대한 분석을 시작하겠다는 신호입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what affects us (관계대명사): what은 선행사를 포함하여 &#39;~하는 것&#39;으로 해석되며, 뒤의 절에서 주어 역할을 함</div><div class=\"lec-gr-item\">when it comes to buying things (관용표현): when it comes to는 &#39;~에 관해서는&#39;이라는 의미의 숙어로, 뒤에 동명사(buying)를 목적어로 취함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 왜 사고 싶은 걸까</span><span class=\"en\"><b>Why do I want <span class=\"grammar-hl\">to buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들이 산 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">what my friends bought</span>?</b></span></div></div><div class=\"lec-sent-ko\">나는 왜 친구들이 산 것을 사고 싶은 걸까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기한 소비의 의문을 친구 관계라는 구체적인 상황으로 좁혀서 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): want의 목적어로 쓰인 명사적 용법</div><div class=\"lec-gr-item\">what my friends bought (관계대명사): what이 선행사를 포함한 관계대명사로 buy의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jeff는 쇼핑센터에 가서</span><span class=\"en\"><b>Jeff goes to the shopping center</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축구화 한 켤레를 보게 된다</span><span class=\"en\"><b>and sees a pair of soccer shoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진열되어 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">on display</span>.</b></span></div></div><div class=\"lec-sent-ko\">Jeff는 쇼핑센터에 가서 진열되어 있는 축구화 한 켤레를 보게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 구체적인 인물 &#39;제프&#39;를 등장시켜, 친구의 소비 습관이 어떻게 전염되는지 보여주기 위한 사례를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on display (관용표현): &#39;전시 중인&#39;이라는 상태를 나타내는 부사구</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그 신발을 한눈에 알아본다</span><span class=\"en\"><b>He recognizes the shoes at a glance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 축구팀에 있는 소년들의 반 이상이</span><span class=\"en\"><b><span class=\"grammar-hl\">because more than half of the boys on his soccer team</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 축구화를 신기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">wear them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그의 축구팀에 있는 소년들의 반 이상이 그 축구화를 신기 때문에 그는 그 신발을 한눈에 알아본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> at a glance는 &#39;한눈에&#39;라는 뜻으로, 제프가 그 신발을 매우 익숙하게 느끼고 있음을 강조합니다. 이는 친구들이 신발을 신었다는 사실이 제프의 구매 욕구에 강력한 자극제임을 나타내는 논리적 원인이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because more than half of the boys on his soccer team wear them (관계부사): 문맥상 이유를 설명하는 부사절로, more than half of the boys는 주어, wear는 동사로 구성됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이미 그에게는 축구화가 많이 있지만</span><span class=\"en\"><b>Although he already has <span class=\"grammar-hl\">many pairs of soccer shoes</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결국 그는 사 버리고 만다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">ends up buying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 새 켤레를</span><span class=\"en\"><b>another new pair.</b></span></div></div><div class=\"lec-sent-ko\">이미 그에게는 축구화가 많이 있지만 결국 그는 또 새 켤레를 사 버리고 만다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;많이 가지고 있다&#39;는 상황과 &#39;또 산다&#39;는 결과 사이의 대조를 통해, 이 소비가 필요에 의한 것이 아니라 외부 영향에 의한 비합리적 행동임을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">many pairs of soccer shoes (관용표현): 단위 명사(pair)를 사용하여 &#39;여러 켤레의 신발&#39;을 표현함</div><div class=\"lec-gr-item\">ends up buying (관용표현): end up + -ing는 &#39;결국 ~하게 되다&#39;라는 뜻의 숙어</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이용할 수 있다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">can use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘밴드 왜건 효과’를</span><span class=\"en\"><b>the “bandwagon effect”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jeff의 행동을 설명하기 위해</span><span class=\"en\"><b>to explain Jeff’s behavior.</b></span></div></div><div class=\"lec-sent-ko\">우리는 Jeff의 행동을 설명하기 위해 ‘밴드 왜건 효과’를 이용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 제프의 행동을 설명할 수 있는 심리학적 용어인 &#39;밴드왜건 효과&#39;를 도입하여 이론적인 분석으로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can use (to부정사): 앞의 use를 보조하는 조동사 구문으로, 문장 전체의 목적을 나타내는 부사적 용법의 to부정사(to explain)로 이어짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">밴드 왜건(악대차)은 퍼레이드에 있는 사륜마차이다</span><span class=\"en\"><b>A bandwagon is <span class=\"grammar-hl\">a wagon in a parade</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 부추기는</span><span class=\"en\"><b><span class=\"grammar-hl\">that encourages people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">올라타서 음악을 즐기게끔</span><span class=\"en\"><b><span class=\"grammar-hl\">to jump aboard and enjoy the music</span>.</b></span></div></div><div class=\"lec-sent-ko\">밴드 왜건(악대차)은 사람들이 올라타서 음악을 즐기게끔 부추기는 퍼레이드에 있는 사륜마차이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;밴드왜건&#39;이라는 낱말의 어원을 설명합니다. jump aboard는 직역하면 &#39;올라타다&#39;이지만, 여기서는 유행에 편승하는 심리적 행위를 비유적으로 표현합니다. 사람들이 대세를 따르는 모습을 퍼레이드 마차에 올라타는 모습으로 그려내어 독자가 이해하기 쉽게 돕고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a wagon in a parade that encourages people to jump aboard and enjoy the music (관계대명사): that절이 선행사 wagon을 수식하며, encourages(5형식 동사)+people(목적어)+to jump(목적보어) 구조를 포함함</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 많은 사람들이 밴드 왜건에 올라탈수록</span><span class=\"en\"><b><span class=\"grammar-hl\">As more and more people get on</span> the bandwagon,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들이 더욱 올라타거나</span><span class=\"en\"><b>others <span class=\"grammar-hl\">are more likely to get on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 따라가려 한다</span><span class=\"en\"><b>or follow it.</b></span></div></div><div class=\"lec-sent-ko\">더 많은 사람들이 밴드 왜건에 올라탈수록 다른 사람들이 더욱 그것에 올라타거나 그것을 따라가려 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 설명한 비유가 실제 인간 심리에 어떻게 적용되는지를 인과관계로 정리하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As more and more people get on (현재분사): more and more는 &#39;점점 더 많은&#39;이라는 뜻으로 분사구문이나 진행 상황을 묘사하는 강조 표현</div><div class=\"lec-gr-item\">are more likely to get on (관용표현): be likely to + 동사원형은 &#39;~할 가능성이 있다&#39;는 의미의 숙어</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 식으로</span><span class=\"en\"><b>In this way,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 어떤 것을 구매하는 경향이 있다</span><span class=\"en\"><b>people <span class=\"grammar-hl\">tend to buy</span> something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 다른 사람들이 그것을 샀다는 이유만으로</span><span class=\"en\"><b>just because other people have bought it.</b></span></div></div><div class=\"lec-sent-ko\">이런 식으로, 사람들은 단지 다른 사람들이 어떤 것을 샀다는 이유만으로 그것을 구매하는 경향이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론부로, 개인의 소비가 타인의 소비에 의해 결정되는 사회적 모방 현상을 요약하며 전체 내용을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tend to buy (to부정사): tend의 목적어로 쓰인 명사적 용법의 to부정사 구조</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 필요 없는 물건을 사는 경우가 있는데, 그 이유를 분석해 볼 필요가 있다.</li><li>제프의 사례처럼 주변 사람들이 많이 사용하는 제품은 본인에게 필요 없어도 구매하게 된다.</li><li>이를 &#39;밴드왜건 효과&#39;라고 하며, 퍼레이드 마차를 따라 타듯 남들을 따라 소비하는 심리를 뜻한다.</li><li>결론적으로 타인의 선택이 나의 소비 결정에 강력한 영향을 미친다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Consumers often buy unnecessary items because of the bandwagon effect, since they tend to follow the shopping choices of the people around them.</div>\n              <div class=\"lec-final-sum-ko\">소비자들은 주변 사람들의 쇼핑 선택을 따르는 경향이 있기 때문에, 밴드왜건 효과로 인해 불필요한 물건을 자주 구매한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":"main"},{"audio":"./2_audio/4.mp3","hl":"meaning"},{"audio":"./2_audio/5.mp3","hl":"grammar"}],[{"audio":"./2_audio/6.mp3","hl":"main"},{"audio":"./2_audio/7.mp3","hl":"meaning"},{"audio":"./2_audio/8.mp3","hl":"grammar"}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"audio":"./2_audio/30.mp3","hl":"main"},{"audio":"./2_audio/31.mp3","hl":"meaning"},{"audio":"./2_audio/32.mp3","hl":"grammar"}],[{"audio":"./2_audio/33.mp3","hl":"main"},{"audio":"./2_audio/34.mp3","hl":"meaning"},{"audio":"./2_audio/35.mp3","hl":"grammar"}],[{"audio":"./2_audio/36.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=do
