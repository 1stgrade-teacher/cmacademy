<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 7과 본문5 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 7과 본문5","audioDir":"5_audio","preview":false,"count":20,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 7과\u003cbr>본문5\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Think Before You Click: The Secret Behind Our Purchases\u003c/h1>\u003ch2>클릭 전 생각하기: 우리 구매 뒤에 숨겨진 비밀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리는 왜 물건을 사는지 \u003cb class=\"key\">진지하게\u003c/b> 고려하지 않는 경향이 있지만, 다양한 요인이 구매에 영향을 미치므로 결정 전 \u003cb class=\"key\">잠시 \u003c/b>\u003cb class=\"key\">생각하는\u003c/b> 태도가 필요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Before making a purchase, it is essential to pause and reflect on the reasons behind it to avoid being blindly influenced by external factors.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 삼학년 비상 칠단원의 마지막 본문 내용을 함께 살펴보겠습니다. 우리가 평소에 쇼핑을 할 때 정말 필요한 걸 사고 있는지, 아니면 무언가에 홀린 듯 사고 있는지 생각해 본 적 있나요? 이번 지문은 무의식적인 소비 습관을 지적하며 현명한 구매를 위해 잠시 멈춤과 생각하기가 얼마나 중요한지를 강조하는 아주 유익한 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 쇼핑할 때 자신도 모르게 지갑을 여는 이유는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">경제학\u003c/b>(Behavioral Economics)의 관점에서 설명할 수 있습니다. 마케팅 세상에는 소비자의 결정을 교묘하게 유도하는 \u003cb class=\"key\">넛지\u003c/b>(Nudge) 전략이 가득하며, 우리는 종종 다른 사람을 따라 사는 \u003cb class=\"key\">밴드왜건 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(Bandwagon Effect)에 노출되기도 합니다. 친구가 샀으니까 나도 산다는 식의 감정적 소비는 \u003cb class=\"key\">기회비용\u003c/b>(Opportunity Cost)을 간과하게 만듭니다. 마치 마트에 들어갔을 때 배고픈 상태라면 계획에 없던 과자를 담게 되는 것과 비슷합니다. 따라서 이 글은 외부의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>(Psychological Influence)에 휘둘리지 말고 주체적인 소비자가 되라고 조언합니다.\u003c/div>","segs":[{"n":2,"text":"혹시 마트에서 시식 코너를 지나다가 나도 모르게 장바구니에 냉동식품을 담은 적이 있나요? 이건 여러분의 의지일 수도 있지만, 마케팅에서 말하는 넛지 전략에 반응한 것일 수도 있어요. 심리학에서는 남들이 사니까 나도 사는 현상을 밴드왜건 효과라고 부르는데, 오늘 지문은 바로 이런 외부 요인들을 경계해야 한다고 말합니다. 무심코 돈을 쓰는 대신 내가 진짜 이 물건을 왜 원하는지 심리적 배경을 들여다볼 필요가 있다는 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>무의식적 구매 경향\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>Jeff와 친구들의 사례처럼 우리가 물건을 살 때 왜 사는지 \u003cb class=\"key\">진지한 \u003c/b>\u003cb class=\"key\">고려\u003c/b>를 하지 않는다는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구매에 미치는 영향\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>앞서 언급된 여러 효과들처럼 수많은 요인이 우리의 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">행위\u003c/b>에 실질적인 \u003cb class=\"key\">영향력\u003c/b>을 행사하고 있음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>현명한 소비 제안\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>다음 구매 시에는 반드시 그 물건을 왜 사려고 하는지 \u003cb class=\"key\">잠시 \u003c/b>\u003cb class=\"key\">동안\u003c/b> 스스로에게 \u003cb class=\"key\">질문하며 \u003c/b>\u003cb class=\"key\">생각\u003c/b>해 볼 것을 권고합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 우리의 평소 습관을 보여주고 그 원인을 짚어준 뒤, 우리가 가져야 할 올바른 자세를 제안하는 순서로 이어집니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 Jeff와 그 친구들의 예시를 들어서, 우리 대부분이 물건을 왜 사는지 진지한 고려 없이 구매하는 경향이 있다는 보편적 습관을 언급하며 시작합니다.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 지금까지 본문에서 다루었던 여러 효과들이 증명했듯이, 실제로 수많은 것들이 우리도 모르는 사이에 우리의 구매 결정에 큰 영향력을 미치고 있음을 확인시켜 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 문장은 이 글의 결론이자 필자의 강력한 주장입니다. 다음에 무언가를 사기로 결정했다면, 그 즉시 결제하기보다 잠시 동안이라도 내가 이걸 왜 사는지 스스로 생각해 보라는 명쾌한 해결책을 제시하죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">우리가 생각 없이 물건을 사는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 먼저 제시하고, 그 배후에 여러 영향력이 있음을 밝힌 뒤 마지막 문장에서 \u003cb class=\"key\">신중한 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이라는 해결책을 제시하는 구조입니다. 소비자로서의 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 강조하며 글을 맺고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Just like (1)\u003c/b>\u003cspan>사례 연결\u003c/span>\u003cb>As these effects have shown (2)\u003c/b>\u003cspan>앞 내용 요약 및 근거 제시\u003c/span>\u003cb>The next time (3)\u003c/b>\u003cspan>실행 제안 시점\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">buy things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">buying them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">purchases\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">buy something\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">buying it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 지문은 우리가 겪고 있는 문제점을 먼저 보여주고 그에 대한 대안을 제시하는 문제 해결 구조로 되어 있습니다. 특히 마지막 문장에서 독자에게 구체적인 행동을 지시하는 명령문을 사용하고 있어서, 주제가 글의 뒷부분에 명확히 드러나는 미괄식 구성을 취하고 있네요.","hl":"ty"},{"n":8,"text":"첫 번째 문장의 Just like는 앞서 나온 Jeff의 사례가 우리 모두의 이야기임을 연결해 주는 연결 고리 역할을 합니다. 두 번째 문장의 As these effects have shown은 지금까지 배운 내용을 근거로 요약해 주죠. 마지막으로 The next time이라는 표현을 통해 미래에 우리가 실천해야 할 행동 지침을 강조하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>just like\u003c/b>\u003cem>전치사구\u003c/em>\u003cspan>~와 마찬가지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다, 구입하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~하지 않고\u003c/span>\u003c/div>\u003cdiv>\u003cb>seriously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>진지하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>why\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜\u003c/span>\u003c/div>\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하듯이, ~함에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효과, 영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매, 구입\u003c/span>\u003c/div>\u003cdiv>\u003cb>next time\u003c/b>\u003cem>접속사구\u003c/em>\u003cspan>다음번에 ~할 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a moment\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>잠시 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>thing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>것, 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>many\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide to\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하기로 결정하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 tend to라는 표현은 무엇을 하는 경향이 있다는 뜻으로 자주 쓰이니 꼭 기억하세요. 그리고 purchase는 동사로는 사다, 명사로는 구매라는 뜻으로 buy와 바꿔 쓸 수 있는 중요한 단어입니다. seriously라는 부사는 진지하게라는 뜻으로, 고려하다라는 뜻의 consider를 꾸며주고 있네요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">consider\u003c/b>\u003cspan class=\"m\">고려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contemplate\u003c/span>\u003cspan class=\"s\">ponder\u003c/span>\u003cspan class=\"s\">deliberate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003cspan class=\"s\">sway\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">purchase\u003c/b>\u003cspan class=\"m\">구매\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">buying\u003c/span>\u003cspan class=\"s\">acquisition\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sale\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">seriously\u003c/b>\u003cspan class=\"m\">진지하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">earnest\u003c/span>\u003cspan class=\"s\">thoughtfully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lightly\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"consider라는 단어는 신중히 생각하다라는 뜻의 contemplate나 ponder로 바꿔 쓸 수 있지만, 반대로 무시하다라는 뜻의 ignore와는 반대되는 개념입니다. influence는 영향을 미치다라는 뜻으로 affect와 같은 의미로 쓰이고요. seriously는 가볍게를 뜻하는 lightly와 반대되는 개념이라는 점을 기억하며 문맥을 파악해 보세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 3\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jeff와 그의 친구들처럼,\u003c/span>\u003cspan class=\"en\">Just like Jeff and his friends,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 물건들을 구입하는 경향이 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span> things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진지하게 고려하지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">seriously \u003c/span>\u003cspan class=\"tgt\">considering\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 왜 그것들을 사는지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">buying \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jeff와 그의 친구들처럼, 우리는 우리가 왜 물건들을 사는지 진지하게 고려하지 않고 그것들을 구입하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 Jeff의 사례를 일반화하여 우리 모두의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 설명합니다. 소비자가 \u003cb class=\"key\">충동구매\u003c/b>를 하게 되는 보편적인 습관에 대해 주의를 환기하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to + 동사원형\u003c/span> : tend [자동사] + [to buy (to부정사구/보어)] : \"구입하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : without [전치사] + [seriously (부사)] + [considering (동명사)] : \"진지하게 고려하지 않고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : why [의문사] + we [주어] + are buying [동사] : \"우리가 왜 그것들을 사는지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Just like Jeff and his friends, Jeff와 그의 친구들처럼. we tend to buy things, 우리는 물건들을 구입하는 경향이 있다. without seriously considering, 진지하게 고려하지 않고. why we are buying them, 우리가 왜 그것들을 사는지.. 이 문장 전체를 해석하면, Jeff와 그의 친구들처럼, 우리는 우리가 왜 물건들을 사는지 진지하게 고려하지 않고 그것들을 구입하는 경향이 있다.","hl":"m"},{"n":12,"text":"이 문장은 제프의 사례가 단순히 그만의 문제가 아니라, 우리 모두의 일반적인 심리적 경향이라는 점을 짚어주고 있어요. 우리가 얼마나 자주 충동구매를 하는지 반성하게 만드는 문장이죠.","hl":"mn"},{"n":13,"text":"첫 번째로 tend to buy는 동사원형을 사용하여 일반적인 성향을 나타내는 표현이에요. 두 번째로 전치사 without 뒤에 동명사 considering이 왔는데, 그 사이에 부사 seriously가 끼어들어 의미를 풍부하게 해주고 있죠. 세 번째로 why로 시작하는 절은 간접의문문으로, 의문사 주어 동사의 어순이 가장 중요한 시험 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 3\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 효과들이 보여 주듯이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> these effects \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 것들이\u003c/span>\u003cspan class=\"en\">many things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 구매에 영향을 미친다.\u003c/span>\u003cspan class=\"en\">influence our purchases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 효과들이 보여 주듯이, 많은 것들이 우리의 구매에 영향을 미친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 설명한 밴드왜건 효과 등 다양한 마케팅 효과를 갈무리하며, 소비가 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 의해 좌우됨을 강조합니다. 우리의 구매 결정이 \u003cb class=\"key\">비이성적\u003c/b>일 수 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~하듯이)\u003c/span> : As [접속사] + these effects [주어] + have shown [동사] : \"보여 주듯이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have [조동사] + shown [과거분사] : \"보여 주었다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"As these effects have shown, 이러한 효과들이 보여 주듯이. many things, 많은 것들이. influence our purchases, 우리의 구매에 영향을 미친다.. 이 문장 전체를 해석하면, 이러한 효과들이 보여 주듯이, 많은 것들이 우리의 구매에 영향을 미친다.","hl":"m"},{"n":15,"text":"지금까지 배운 여러 가지 마케팅 효과들을 요약하는 문장이에요. 우리가 물건을 살 때 스스로 결정하는 것 같지만, 실제로는 많은 외부 요인의 영향을 받는다는 걸 설명하고 있죠.","hl":"mn"},{"n":16,"text":"첫 번째로 접속사 As는 여기서 ~하듯이 또는 ~처럼이라는 의미로 쓰여서 뒤의 문장을 이끌고 있어요. 두 번째로 have shown은 현재완료 시제로, 과거부터 언급되어 온 효과들이 지금까지 명확한 사실을 보여주고 있음을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 3\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음번에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 어떤 것을 구매하려고 결정할 때에는,\u003c/span>\u003cspan class=\"en\">you decide to buy something,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 동안 생각해 보아라\u003c/span>\u003cspan class=\"en\">think for a moment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 그것을 왜 사려는지.\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">buying \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음번에 여러분이 어떤 것을 구매하려고 결정할 때에는, 자신이 그것을 왜 사려는지 잠시 동안 생각해 보아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 직접적인 조언을 건네며 글을 마무리합니다. 무분별한 소비 대신 \u003cb class=\"key\">합리적 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 위해 스스로에게 질문을 던지는 \u003cb class=\"key\">반성적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 촉구합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 역할을 하는 명사구\u003c/span> : The next time [접속사 대용] + you [주어] + decide [동사] : \"다음번에 ~할 때에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : why [의문사] + you [주어] + are buying [동사] : \"왜 그것을 사려는지\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The next time, 다음번에. you decide to buy something, 여러분이 어떤 것을 구매하려고 결정할 때에는. think for a moment, 잠시 동안 생각해 보아라. about why you are buying it, 자신이 그것을 왜 사려는지.. 이 문장 전체를 해석하면, 다음번에 여러분이 어떤 것을 구매하려고 결정할 때에는, 자신이 그것을 왜 사려는지 잠시 동안 생각해 보아라.","hl":"m"},{"n":18,"text":"마지막으로 여러분에게 실질적인 조언을 해주는 문장이에요. 물건을 사기 전에 잠시만 멈춰서 진짜 이유를 생각해보면 더 합리적인 소비를 할 수 있다는 뜻이죠.","hl":"mn"},{"n":19,"text":"첫 번째로 The next time은 그 자체로 접속사처럼 쓰여서 다음번에 ~할 때라는 의미의 절을 연결해요. 두 번째는 think로 시작하는 명령문 문장이라는 점에 주목하세요. 세 번째로 why you are buying it 부분은 다시 한번 간접의문문 어순이 쓰였으니 꼭 의문사 주어 동사 순서를 확인하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Jeff와 친구들처럼 사람들은 물건을 살 때 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 깊이 생각하지 않는 경향이 있습니다.\u003c/li>\u003cli>우리의 모든 구매 결정에는 우리가 인지하지 못하는 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">효과\u003c/b>와 요인들이 작용합니다.\u003c/li>\u003cli>물건을 사기 전에는 반드시 외부의 영향인지 자신의 필요인지 \u003cb class=\"key\">잠시 \u003c/b>\u003cb class=\"key\">숙고\u003c/b>해야 합니다.\u003c/li>\u003cli>스스로에게 \u003cb class=\"key\">질문하는 \u003c/b>\u003cb class=\"key\">습관\u003c/b>을 통해 더 현명하고 주체적인 소비자로 거듭날 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Before making a purchase, it is essential to pause and reflect on the reasons behind it to avoid being blindly influenced by external factors.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 왜 물건을 사는지 \u003cb class=\"key\">진지하게\u003c/b> 고려하지 않는 경향이 있지만, 다양한 요인이 구매에 영향을 미치므로 결정 전 \u003cb class=\"key\">잠시 \u003c/b>\u003cb class=\"key\">생각하는\u003c/b> 태도가 필요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"결국 이 글이 하고 싶은 말은 쇼핑이라는 행위 앞에 비판적 사고를 두라는 것입니다. 남의 시선이나 마케팅 기법에 휘둘리지 않고 내가 왜 구매하는지 스스로 답할 수 있을 때 진짜 현명한 소비자가 될 수 있습니다. 오늘 배운 내용을 복습하면서 여러분의 최근 소비 습관도 한 번 돌아보는 시간을 가지면 좋겠네요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
