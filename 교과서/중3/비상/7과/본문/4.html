/AD9f85xx2/Oimh0PG9QB33DB7568+n4YpSyjPzDj3o67X8v6d9+z/wAhjv8AP+eP8+9Hv+Qx+vpTN6D+NemfvD8e/alLKozuHsQeMZx9ev447Hsa+ev4/wCYfoDZUFhkfnwcZ+baD0/IntnGITngZ468frgcYwWHX1x71OGThiVI4H38d+QSM4xwcZPODjpiFsEsQwwTnAIwMYAAHHrg8dzySaOm23Xtd31/HfuxdV6P9L6f8F/5tooyOmQfxB/kT+tLtyCeeASem3IHGc8Ht1HHpzkFvXXZ/dftotf8+oenTRf107fI/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Anchoring Effect: How First Impressions Shape Our Spending<small>앵커링 효과: 첫인상이 우리의 소비를 결정하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 세일 문구만 보면 충동구매를 하게 된 경험이 있나요? 이 글에서 다루는 닻 내림 효과(anchoring effect)는 우리가 처음 본 정보를 기준으로 이후의 판단을 내리는 심리적 현상을 말해요. 마치 배가 닻을 내리면 그 근처에서만 움직일 수 있는 것처럼, 처음 접한 정보가 우리의 사고를 한곳에 고정해 버리는 것이죠. 예를 들어 비싼 정가(anchor)를 먼저 보면, 할인된 가격이 실제로는 비싸더라도 상대적으로 저렴하다고 착각하게 됩니다. 이처럼 우리 뇌는 완벽한 논리보다는 처음에 주어진 숫자나 정보에 큰 영향을 받기 때문에, 쇼핑할 때 마케팅 전략에 휘둘리지 않으려면 이런 심리적 특성을 미리 잘 알아두는 것이 좋아요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜 나는 사는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Why do I buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건들을</span><span class=\"en\"><b>things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 ~라는 이유로</span><span class=\"en\"><b><span class=\"grammar-hl\">just because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 할인 중인</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are on sale</span>?</b></span></div></div><div class=\"lec-sent-ko\">나는 왜 단지 할인 중이라는 이유로 물건을 구입하는 걸까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 사람들이 할인에 현혹되는 자신의 소비 습관에 대해 의문을 던지며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why do I buy (간접의문문): 의문사(Why)로 시작하는 문장 구조로, 화자가 구매하는 이유에 대해 스스로 묻는 상황을 나타냅니다.</div><div class=\"lec-gr-item\">just because (관용표현): &#39;단지 ~라는 이유만으로&#39;라는 의미로, 어떤 행위의 주된 근거를 강조할 때 쓰입니다.</div><div class=\"lec-gr-item\">are on sale (관용표현): &#39;할인 중인&#39;이라는 상태를 나타내는 숙어로, be동사와 결합하여 주어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Nathan은 구경을 하러 간다</span><span class=\"en\"><b>Nathan goes <span class=\"grammar-hl\">window shopping</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 본다</span><span class=\"en\"><b>and sees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헤드폰 한 쌍을</span><span class=\"en\"><b>a pair of headphones.</b></span></div></div><div class=\"lec-sent-ko\">Nathan은 진열된 상품을 구경하러 가서 헤드폰을 하나 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 네이선이라는 구체적인 인물을 등장시켜, 독자가 공감하기 쉬운 실생활 사례를 제시하며 본격적인 설명을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">window shopping (동명사): &#39;아이쇼핑하기&#39;라는 행위를 나타내는 명사적 표현으로, 문장에서 주어 Nathan의 활동을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 가격을 확인한다</span><span class=\"en\"><b>He checks the price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 알아낸다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">finds out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 200달러라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that they are $200</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 가격을 확인하고 그것이 200달러임을 알게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제품의 &#39;기준 가격&#39;을 설정하는 과정입니다. 여기서 checks는 단순히 확인하는 것을 넘어, 소비자가 가치를 판단하기 위해 정보를 탐색하는 행위를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">finds out that they are $200 (명사절): find out 뒤의 that절은 타동사의 목적어 역할을 하는 명사절로, 확인된 사실의 내용을 기술합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 생각한다</span><span class=\"en\"><b><span class=\"grammar-hl\">He thinks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 헤드폰이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the headphones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 비싸다고</span><span class=\"en\"><b>are too expensive.</b></span></div></div><div class=\"lec-sent-ko\">그는 그 헤드폰이 너무 비싸다고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 처음에 접한 200달러라는 가격에 대해 소비자가 느끼는 주관적인 반응을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He thinks that (명사절): 타동사 think의 목적어로 쓰인 that절은 주어 He의 생각 내용을 명사구처럼 포함하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">점원이</span><span class=\"en\"><b>The sales person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게 다가와</span><span class=\"en\"><b>approaches him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말한다,</span><span class=\"en\"><b>and says,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“당신은 받을 수 있어요</span><span class=\"en\"><b>“<span class=\"grammar-hl\">You can get</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">20퍼센트 할인을</span><span class=\"en\"><b><span class=\"grammar-hl\">a 20 percent discount</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 헤드폰들에 대해.”</span><span class=\"en\"><b><span class=\"grammar-hl\">on those headphones</span>.”</b></span></div></div><div class=\"lec-sent-ko\">점원이 그에게 다가와 “이 헤드폰에 20퍼센트 할인을 받을 수 있어요.”라고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 가격 인식을 흔들기 위한 외부 정보(할인 제안)가 개입되는 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You can get a 20 percent discount on those headphones 5형식(SVOC) 구조: get은 여기에서 &#39;얻게 하다/받게 하다&#39;의 의미로 쓰이며, 목적어와 목적보어를 동반하거나 특정 상태를 유도하는 구조로 이해될 수 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 ~이지만</span><span class=\"en\"><b><span class=\"grammar-hl\">Even though</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">할인된 가격이</span><span class=\"en\"><b>the discounted price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 매우 낮지는 않다,</span><span class=\"en\"><b>is still not very low,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Nathan은 결심한다</span><span class=\"en\"><b>Nathan <span class=\"grammar-hl\">decides</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 헤드폰을 사기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy</span> the headphones.</b></span></div></div><div class=\"lec-sent-ko\">비록 할인된 가격이 여전히 별로 낮지는 않지만 Nathan은 그 헤드폰을 사기로 결심한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 200달러라는 가격 정보 때문에 실제 지불해야 할 금액이 여전히 비쌈에도 불구하고 구매를 결정하는 모순적인 행동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Even though (관용표현): 양보를 나타내는 접속사로, &#39;비록 ~일지라도&#39;라는 의미로 절 전체를 이끕니다.</div><div class=\"lec-gr-item\">decides to buy (to부정사): decide라는 타동사의 목적어 역할을 하며, 앞으로 할 일에 대한 계획이나 결정을 나타내는 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 상황은</span><span class=\"en\"><b>The situation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위에 기술된</span><span class=\"en\"><b><span class=\"grammar-hl\">described above</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 예이다</span><span class=\"en\"><b>is an example</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘앵커링 효과’의</span><span class=\"en\"><b>of the “anchoring effect.”</b></span></div></div><div class=\"lec-sent-ko\">위에 기술된 상황은 ‘앵커링 효과’의 한 예이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 사례를 심리학적 개념인 &#39;닻 내림 효과&#39;로 정의합니다. 여기서 anchor는 배를 고정하는 닻을 뜻하는데, 여기서는 첫 가격 정보가 소비자의 마음을 특정 지점에 딱 고정시킨다는 의미로 비유적으로 쓰였습니다. 필자는 첫 정보의 강한 영향력을 &#39;닻&#39;이라는 구체적인 사물에 빗대어 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">described above (과거분사): situation을 수식하며, &#39;위에 묘사된(상황)&#39;이라는 의미로 명사 뒤에서 과거분사구가 명사를 수식하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가격은</span><span class=\"en\"><b>The price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에 언급된</span><span class=\"en\"><b><span class=\"grammar-hl\">mentioned first</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미친다</span><span class=\"en\"><b>affects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 의견에</span><span class=\"en\"><b>our opinion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가격들에 대한</span><span class=\"en\"><b>of <span class=\"grammar-hl\">prices</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이후에 언급되는</span><span class=\"en\"><b><span class=\"grammar-hl\">mentioned afterwards</span>.</b></span></div></div><div class=\"lec-sent-ko\">처음에 언급된 가격이 이후에 언급되는 가격에 대한 우리의 의견에 영향을 미친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 닻 내림 효과의 핵심 원리를 설명합니다. &#39;첫인상&#39;이 이후의 판단 기준을 결정한다는 논리적 인과관계를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mentioned first (과거분사): price를 수식하는 구조로, &#39;처음에 언급된(가격)&#39;이라는 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">prices mentioned afterwards (과거분사): prices를 수식하며 &#39;나중에 언급된(가격)&#39;이라는 의미를 나타내는 과거분사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 시작한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if we start</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">200달러로,</span><span class=\"en\"><b>with $200,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 160달러는</span><span class=\"en\"><b>then $160</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저렴해 보일 것이다</span><span class=\"en\"><b>will seem cheap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비교해 볼 때</span><span class=\"en\"><b>in comparison.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 만약 우리가 200달러로 시작한다면, 비교해 볼 때 160달러는 저렴해 보일 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 개념을 구체적인 숫자로 입증하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if we start (가정법): if절을 사용한 조건문으로, 현재의 상황을 가정한 예시를 제시합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그뿐만 아니라,</span><span class=\"en\"><b>Furthermore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차이가</span><span class=\"en\"><b><span class=\"grammar-hl\">as the difference</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 가격의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the two prices</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 커질수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">becomes bigger</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 효과는</span><span class=\"en\"><b>the effect</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 강력해질 것이다</span><span class=\"en\"><b>will be more powerful.</b></span></div></div><div class=\"lec-sent-ko\">그뿐만 아니라, 두 가격의 차이가 커질수록 그 효과는 더욱 강력해질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 닻 내림 효과가 조건에 따라 어떻게 심화되는지를 설명하는 부연 설명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as the difference of the two prices becomes bigger (현재분사(분사구문)): as절은 &#39;~함에 따라&#39;라는 비례를 나타내는 부사절로, 문맥상 상황의 진행을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이와 같이,</span><span class=\"en\"><b>As such,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가격은</span><span class=\"en\"><b>the price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에 언급된</span><span class=\"en\"><b><span class=\"grammar-hl\">mentioned first</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작동한다</span><span class=\"en\"><b>acts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘닻’으로서</span><span class=\"en\"><b>as an “anchor”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 생각을 고정하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that fixes our thoughts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가격에 대한</span><span class=\"en\"><b>about the price</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건의</span><span class=\"en\"><b>of an item.</b></span></div></div><div class=\"lec-sent-ko\">이와 같이 처음에 언급된 가격이 물건의 가격에 대한 우리의 생각을 고정하는 ‘닻’으로서 작동한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며 첫 가격 정보가 가진 절대적인 기준점으로서의 역할을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mentioned first (과거분사): price를 수식하며 &#39;처음에 언급된&#39;이라는 의미를 갖는 형용사적 기능을 합니다.</div><div class=\"lec-gr-item\">that fixes our thoughts (관계대명사): 주격 관계대명사 that이 anchor를 선행사로 받아 뒤에서 절의 형태로 수식하며, 문장 안에서 anchor의 기능을 구체적으로 설명합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 할인 정보에 따라 합리적이지 않은 소비를 하는 경향이 있다.</li><li>이는 처음에 접한 가격이 기준점이 되어 이후의 판단에 영향을 주는 &#39;닻 내림 효과&#39; 때문이다.</li><li>첫 가격 정보는 마음속에 강력하게 고정되어, 실제 가격이 비싸더라도 상대적으로 싸게 느끼게 만든다.</li><li>가격 차이가 클수록 이러한 닻 내림 효과는 더욱 강력하게 작용한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The first price acts as an anchor that shapes our perception of value, so a discount makes subsequent prices seem more affordable.</div>\n              <div class=\"lec-final-sum-ko\">최초 가격은 가치에 대한 인식을 형성하는 기준점이 되며, 이로 인해 할인된 가격은 상대적으로 저렴해 보이게 된다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":n
