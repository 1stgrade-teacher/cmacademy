@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 7과 본문4","audioDir":"4_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 7과\u003cbr>본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Anchoring Effect: Why the First Price Matters\u003c/h1>\u003ch2>앵커링 효과: 초기 가격이 중요한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>처음에 제시된 가격이 기준점이 되어 이후의 판단에 영향을 미치는 \u003cb class=\"key\">앵커링 \u003c/b>\u003cb class=\"key\">효과\u003c/b>의 개념과 작동 원리를 Nathan의 헤드폰 구매 \u003cb class=\"key\">예시\u003c/b>를 통해 설명하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The first price we encounter serves as a psychological anchor that influences our judgment of whether later prices are reasonable or not.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 물건을 살 때 왜 가끔 비논리적인 선택을 하는지, 그 비밀을 알려주는 흥미로운 지문을 공부해 볼 거예요. 이번 시간의 핵심 주제는 앵커링 효과이고요, 요지는 처음에 제시된 가격이 우리 머릿속에 기준점으로 박혀서 이후의 판단에 큰 영향을 미친다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">앵커링 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(Anchoring Effect)는 행동 경제학에서 매우 중요한 개념입니다. 배가 닻(\u003cb class=\"key\">anchor\u003c/b>)을 내리면 그 근처에 머물게 되듯이, 우리 뇌도 처음 접한 정보에 박혀 사고의 범위가 제한되는 현상을 말하죠. 예를 들어, 원래 100만 원인 가방을 '80퍼센트 세일해서 20만 원'이라고 하면, 20만 원이 객관적으로 비싸더라도 처음에 본 100만 원이라는 \u003cb class=\"key\">기준점\u003c/b> 때문에 싸게 느껴집니다. 대형 마트의 '1인당 10개 한정' 같은 문구도 우리 머릿속에 '10'이라는 숫자를 박아두는 일종의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">전략\u003c/b>입니다. 우리는 이 지문을 통해 소비자가 어떻게 비논리적인 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내리게 되는지 배울 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 알아볼까요? 앵커링 효과에서 앵커는 배를 고정할 때 쓰는 닻이라는 뜻이에요. 배가 닻을 내리면 그 주변을 벗어나지 못하듯이, 우리 뇌도 처음 접한 정보라는 닻에 걸리면 거기서 멀리 벗어나지 못하게 된답니다. 대형 마트에서 원래 가격을 크게 써놓고 그 옆에 할인 가격을 적어두는 게 바로 이 심리적 전략을 이용한 거예요. 우리는 처음에 본 높은 가격이라는 기준점 때문에 물건을 더 싸게 느끼게 되는 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입부의 질문\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>단순히 \u003cb class=\"key\">할인\u003c/b> 중이라는 이유로 물건을 사는 우리의 보편적인 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">행태\u003c/b>에 대해 질문을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Nathan의 사례\u003csmall>예시 · 문장 2–6\u003c/small>\u003c/h4>\u003cp>Nathan이 200달러짜리 헤드폰을 보고 비싸다고 느꼈지만, 20퍼센트 \u003cb class=\"key\">할인 \u003c/b>\u003cb class=\"key\">제안\u003c/b>을 받자 구매를 결정하는 구체적인 \u003cb class=\"key\">상황\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>용어 정의\u003csmall>전환 · 문장 7\u003c/small>\u003c/h4>\u003cp>Nathan의 사례를 \u003cb class=\"key\">앵커링 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 전문적인 심리학 \u003cb class=\"key\">용어\u003c/b>로 명명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>작동 원리와 결론\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>처음 언급된 가격이 \u003cb class=\"key\">닻\u003c/b>처럼 작용하여 이후의 \u003cb class=\"key\">가격 \u003c/b>\u003cb class=\"key\">판단\u003c/b>에 강력한 영향을 미친다는 핵심 원리를 설명합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 하나의 재미있는 사례에서 시작해서 일반적인 과학적 원리로 나아가는 구조를 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 왜 우리가 단순히 세일한다는 이유만으로 물건을 사는지 질문을 던지며 독자의 주의를 끕니다. 이어서 두 번째부터 여섯 번째 문장까지는 Nathan이라는 학생이 헤드폰을 사는 구체적인 상황을 예시로 보여주죠. 처음에는 200달러가 비싸다고 생각했지만, 20퍼센트 할인을 제안받자 결국 지갑을 열게 되는 과정을 묘사합니다.","hl":"f0"},{"n":5,"text":"일곱 번째 문장은 이 글의 전환점이에요. Nathan이 겪은 이 상황을 앵커링 효과라는 전문 용어로 정의하며 설명의 깊이를 더합니다.","hl":"f1"},{"n":6,"text":"여덟 번째부터 열 번째 문장에서는 이 효과의 구체적인 작동 원리를 설명해요. 처음에 언급된 가격이 나중에 나오는 가격에 대한 우리의 의견에 영향을 미친다는 것과, 가격 차이가 클수록 그 효과가 더 강력해진다는 사실을 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 열한 번째 문장에서는 이 모든 내용을 정리하며 결론을 내립니다. 처음 언급된 가격이 우리 생각을 고정하는 닻으로서 작동한다는 핵심 비유를 사용하며 글을 마무리하고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시-정의\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부에서 Nathan의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 먼저 보여준 뒤, 후반부에서 그 현상을 설명하는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 도출하는 귀납적 구조입니다. 특히 마지막 문장에서 'anchor'라는 비유를 통해 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 완성하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Even though (6)\u003c/b>\u003cspan>양보의 접속사로 할인 가격도 싸지 않음을 강조\u003c/span>\u003cb>For example (9)\u003c/b>\u003cspan>원리를 설명하기 위한 구체적 수치 제시\u003c/span>\u003cb>Furthermore (10)\u003c/b>\u003cspan>효과가 강화되는 조건 추가\u003c/span>\u003cb>As such (11)\u003c/b>\u003cspan>앞선 내용을 요약하며 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">200 dollars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The situation described above\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the anchoring effect\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The price mentioned first\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an anchor\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 먼저 구체적인 예시를 보여준 다음에 그로부터 일반적인 원리를 이끌어내는 예시와 정의의 구조로 되어 있어요. 마지막에 주제를 강조하는 미괄식 패턴을 취하고 있죠. 특히 마지막 문장이 이 글의 핵심을 가장 잘 담고 있는 주제문이라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 보여주는 신호어들을 잘 보세요. 여섯 번째 문장의 Even though는 할인 가격도 사실은 낮지 않다는 점을 강조해주고, 아홉 번째 문장의 For example은 원리를 설명하기 위해 구체적인 수치를 다시 가져옵니다. 그리고 열 번째 문장의 Furthermore는 효과가 더 커지는 조건을 추가하며 내용을 확장하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>just because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>단지 ~라는 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>on sale\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>할인 판매 중인\u003c/span>\u003c/div>\u003cdiv>\u003cb>window shopping\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진열된 상품 구경\u003c/span>\u003c/div>\u003cdiv>\u003cb>a pair of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 쌍의\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>sales person\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점원\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다가가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>할인\u003c/span>\u003c/div>\u003cdiv>\u003cb>even though\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>discounted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>할인된\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기로 결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다, 기술하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anchoring effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>앵커링 효과, 정박 효과\u003c/span>\u003c/div>\u003cdiv>\u003cb>mention\u003c/b>\u003cem>동사\u003c/em>\u003cspan>언급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>affect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>afterwards\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에, 그 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>comparison\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비교\u003c/span>\u003c/div>\u003cdiv>\u003cb>furthermore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가, 더욱이\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>powerful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강력한\u003c/span>\u003c/div>\u003cdiv>\u003cb>act as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로서 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anchor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>닻\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고정시키다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 몇 개 짚어볼까요? window shopping은 물건을 직접 사지 않고 구경만 하는 것을 말하고요, anchoring effect는 오늘 공부한 가장 중요한 용어인 앵커링 효과입니다. 그리고 fix라는 단어는 여기에서 생각을 고정시킨다는 아주 중요한 의미로 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">high-priced\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">affect\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">influence\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">afterwards\u003c/b>\u003cspan class=\"m\">나중에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">later\u003c/span>\u003cspan class=\"s\">subsequently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">beforehand\u003c/span>\u003cspan class=\"a\">previously\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">powerful\u003c/ u003c/span>\u003cspan class=\"en\">then $160 will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seem \u003c/span>\u003cspan class=\"tgt\">cheap\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비교해 볼 때.\u003c/span>\u003cspan class=\"en\">in comparison.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 만약 우리가 200달러로 시작한다면, 비교해 볼 때 160달러는 저렴해 보일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추상적인 원리를 숫자 예시를 통해 구체화하여 \u003cb class=\"key\">비교 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 따라 160달러라는 절대적인 가격이 \u003cb class=\"key\">상대적으로\u003c/b> 저렴하게 느껴질 수 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : [If (접속사)] + [주어] + [현재동사] : \"만약 우리가 ~로 시작한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상태 유지/변화 동사(2형식)\u003c/span> : [seem] + [형용사 보어 (cheap)] : \"저렴해 보일 것이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"For example, 예를 들어. if we start with $200, 만약 우리가 200달러로 시작한다면. then $160 will seem cheap, 그러면 160달러는 저렴해 보일 것이다. in comparison, 비교해 볼 때.. 이 문장 전체를 해석하면, 예를 들어, 만약 우리가 200달러로 시작한다면, 비교해 볼 때 160달러는 저렴해 보일 것이다.","hl":"m"},{"n":37,"text":"앵커링 효과를 숫자로 쉽게 설명하는 부분이에요. 200달러라는 높은 가격을 먼저 보면 그 다음에 보는 160달러가 원래 가격과는 상관없이 상대적으로 싸게 느껴진다는 뜻이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 if가 이끄는 문장을 보세요. 앞으로 일어날 일이지만 조건절 안에서는 미래 대신 현재 시제 start를 쓴다는 게 중요해요. 두 번째로 seem cheap인데요 seem 뒤에는 형용사가 와야 해서 부사인 cheaply를 쓰면 안 된다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그뿐만 아니라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Furthermore,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 가격의 차이가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> the difference of the two prices\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커질수록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">becomes \u003c/span>\u003cspan class=\"tgt\">bigger\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 효과는 더욱 강력해질 것이다.\u003c/span>\u003cspan class=\"en\">the effect will be more powerful.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그뿐만 아니라, 두 가격의 차이가 커질수록 그 효과는 더욱 강력해질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앵커링 효과의 강도를 설명하는 문장입니다. 기준점과 비교 대상의 \u003cb class=\"key\">차이\u003c/b>가 커질수록 소비자가 느끼는 심리적 \u003cb class=\"key\">파급력\u003c/b>이 커진다는 원리를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사(첨가)\u003c/span> : Furthermore + [주어+동사] : \"그뿐만 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사(비례/변화)\u003c/span> : as + [주어] + [동사] : \"~함에 따라/할수록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 형용사 비교급\u003c/span> : become + [형용사의 비교급] : \"더 커지다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Furthermore, 그뿐만 아니라. as the difference of the two prices, 두 가격의 차이가. becomes bigger, 커질수록. the effect will be more powerful, 그 효과는 더욱 강력해질 것이다.. 이 문장 전체를 해석하면, 그뿐만 아니라, 두 가격의 차이가 커질수록 그 효과는 더욱 강력해질 것이다.","hl":"m"},{"n":40,"text":"앞선 내용에 살을 붙여서 앵커링 효과가 언제 더 강해지는지 설명하고 있어요. 처음에 본 가격과 나중에 본 가격의 차이가 벌어지면 벌어질수록 우리가 느끼는 심리적 효과가 더 강력해진다는 점을 강조하고 있죠.","hl":"mn"},{"n":41,"text":"첫 번째로 문장 맨 앞에 나온 Furthermore는 새로운 정보를 추가할 때 쓰는 접속부사예요. 두 번째로 나온 as는 무엇 무엇 함에 따라라는 비례의 의미를 가진 접속사죠. 세 번째로 becomes bigger는 비교급을 사용해서 상태가 점점 더 커지는 변화를 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이와 같이,\u003c/span>\u003cspan class=\"en\">As such,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에 언급된 가격이\u003c/span>\u003cspan class=\"en\">the price \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">mentioned\u003c/span> first\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘닻’으로서 작동한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">acts \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> an &quot;anchor&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 생각을 고정하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">fixes\u003c/span> our thoughts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물건의 가격에 대한.\u003c/span>\u003cspan class=\"en\">about the price of an item.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이와 같이 처음에 언급된 가격이 물건의 가격에 대한 우리의 생각을 고정하는 ‘닻’으로서 작동한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단락 전체의 결론으로, 앵커링 효과의 명칭이 왜 붙었는지 비유를 통해 설명합니다. 처음의 정보가 \u003cb class=\"key\">기준점\u003c/b>이 되어 사람의 사고를 \u003cb class=\"key\">제한\u003c/b>한다는 핵심 요지입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(the price) + [과거분사(mentioned)] : \"언급된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구(역할)\u003c/span> : act as + [명사] : \"~로서 작동하다/역할을 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(anchor) + [that] + [동사] : \"고정하는\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"As such, 이와 같이. the price mentioned first, 처음에 언급된 가격이. acts as an \"anchor\", ‘닻’으로서 작동한다. that fixes our thoughts, 우리의 생각을 고정하는. about the price of an item, 물건의 가격에 대한.. 이 문장 전체를 해석하면, 이와 같이 처음에 언급된 가격이 물건의 가격에 대한 우리의 생각을 고정하는 ‘닻’으로서 작동한다.","hl":"m"},{"n":43,"text":"이 글의 최종 결론이에요. 처음에 들은 가격이 배를 꼼짝 못 하게 하는 닻처럼 우리 머릿속에 박혀서 기준이 된다는 뜻이죠. 그래서 우리가 물건값을 판단할 때 그 처음 가격에 묶여 있게 된다는 설명입니다.","hl":"mn"},{"n":44,"text":"첫 번째로 mentioned는 앞에 있는 price를 꾸며주는 과거분사예요. 가격 입장에서는 언급되는 것이니까 수동의 의미인 과거분사로 쓴 점이 중요합니다. 두 번째로 acts as는 무엇 무엇의 역할을 하다라는 뜻의 숙어예요. 마지막 세 번째로 that fixes는 주격 관계대명사인데 선행사인 anchor가 단수이기 때문에 동사 뒤에 s를 꼭 붙여야 한다는 점 주의하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 단지 \u003cb class=\"key\">할인\u003c/b> 중이라는 이유만으로 필요 이상의 소비를 하곤 합니다.\u003c/li>\u003cli>Nathan은 처음에 본 200달러를 \u003cb class=\"key\">기준\u003c/b>으로 삼아 160달러를 저렴하다고 착각했습니다.\u003c/li>\u003cli>이러한 심리적 현상을 \u003cb class=\"key\">앵커링 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라고 하며, 처음 가격이 이후의 판단을 지배합니다.\u003c/li>\u003cli>두 가격의 \u003cb class=\"key\">차이\u003c/b>가 커질수록 소비자가 느끼는 앵커링 효과는 더욱 \u003cb class=\"key\">강력\u003c/b>해집니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The first price we encounter serves as a psychological anchor that influences our judgment of whether later prices are reasonable or not.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">처음에 제시된 가격이 기준점이 되어 이후의 판단에 영향을 미치는 \u003cb class=\"key\">앵커링 \u003c/b>\u003cb class=\"key\">효과\u003c/b>의 개념과 작동 원리를 Nathan의 헤드폰 구매 \u003cb class=\"key\">예시\u003c/b>를 통해 설명하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"자, 오늘 우리는 앵커링 효과가 우리의 소비 습관에 어떤 영향을 주는지 Nathan의 사례를 통해 알아봤어요. 앞으로 여러분도 쇼핑할 때 처음 본 가격이라는 닻에 걸려 충동구매를 하고 있지는 않은지 한 번쯤 생각해보면 좋겠네요. 오늘 배운 핵심 표현들과 글의 구조를 꼭 복습하시고요, 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
