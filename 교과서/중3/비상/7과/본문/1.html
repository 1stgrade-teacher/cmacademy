<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 7과 본문1","audioDir":"1_audio","preview":false,"count":17,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 7과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Uncovering the Secrets Behind Our Spending Habits\u003c/h1>\u003ch2>우리의 소비 습관 뒤에 숨겨진 비밀 파헤치기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리가 왜 필요하지 않은 물건을 구매하는지에 대한 \u003cb class=\"key\">의문\u003c/b>을 제기하고, 소비에 영향을 미치는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>들을 탐구해 볼 것을 제안하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>This text encourages readers to examine the various factors that lead to irrational consumption of unnecessary items.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 삼학년 비상 교과서 칠 단원의 첫 번째 본문을 함께 공부할 거예요. 혹시 쇼핑을 하고 나서 내가 이걸 왜 샀지 하고 후회해 본 적 있나요? 이번 시간에는 우리의 불필요한 소비 습관과 그 뒤에 숨겨진 요인들에 대해 알아보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 자신이 매우 이성적으로 쇼핑을 한다고 생각하지만, 실제로는 다양한 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">기제\u003c/b>(Psychological mechanisms)에 의해 조종되기도 합니다. 이러한 현상을 연구하는 분야를 \u003cb class=\"key\">행동경제학\u003c/b>(Behavioral Economics)이라고 하며, 인간이 항상 합리적이지는 않다는 점에 주목합니다. 예를 들어, 배가 고플 때 마트에 가면 계획에 없던 간식을 더 많이 사게 되는 \u003cb class=\"key\">충동구매\u003c/b>(Impulse buying)가 대표적인 사례입니다. 이 지문은 우리의 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>(Spending patterns)을 결정짓는 숨겨진 변수들을 분석하기 위한 \u003cb class=\"key\">도입부\u003c/b>(Introductory part) 역할을 합니다.\u003c/div>","segs":[{"n":2,"text":"우리는 스스로를 합리적인 소비자라고 믿고 싶어 하지만, 실제로는 심리적 기제에 휘말려 비합리적인 소비를 할 때가 많아요. 이걸 연구하는 학문을 행동경제학이라고 부르는데요. 우리가 무의식중에 가지는 소비 패턴을 이해하면 조금 더 현명한 경제생활을 할 수 있답니다. 오늘은 그 탐구를 시작하는 도입 부분을 배워볼게요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>의문 제기\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>독자들에게 원하지도 필요하지도 않은 물건을 샀던 \u003cb class=\"key\">경험\u003c/b>이 있는지 물으며 \u003cb class=\"key\">공감\u003c/b>을 유도합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>비합리성 인식\u003csmall>전환 · 문장 1\u003c/small>\u003c/h4>\u003cp>스스로의 소비 행태가 항상 \u003cb class=\"key\">이성적\u003c/b>이지만은 않았음을 깨닫게 하는 \u003cb class=\"key\">질문\u003c/b>을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>탐구 주제 제시\u003csmall>주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>물건을 살 때 우리에게 영향을 주는 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">요인\u003c/b>과 \u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">요인\u003c/b>을 본격적으로 살펴보자고 제안합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 짧지만 아주 명확한 흐름을 가지고 있어요. 질문으로 시작해서 우리가 공부할 주제를 던져주는 식이죠.","hl":null},{"n":4,"text":"첫 번째 단계에서는 여러분의 경험을 묻습니다. 첫 번째 문장에서 Have you ever wondered라는 표현을 써서, 원하지도 않는 물건을 왜 샀는지 그 이유를 궁금해해 본 적이 있는지 물으며 공감을 유도하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 우리가 가진 비합리성을 슬쩍 꼬집어요. 내가 원하거나 필요로 하지 않는 것조차 구매하게 만드는 힘이 무엇인지 생각해보게 해서 독자의 주의를 집중시킵니다.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계에서는 이 글의 핵심 주제를 제시해요. 두 번째 문장의 Let's consider를 통해, 물건을 살 때 우리에게 어떤 것들이 영향을 주는지 본격적으로 알아보자고 제안하며 본론을 예고합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 독자의 \u003cb class=\"key\">경험\u003c/b>을 묻는 질문으로 시작하여 호기심을 유발합니다. 이어지는 두 번째 문장에서 글의 \u003cb class=\"key\">목적\u003c/b>이자 핵심 주제인 '소비에 영향을 주는 요인'을 명확히 제시하는 \u003cb class=\"key\">도입부\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Have you ever wondered why (1)\u003c/b>\u003cspan>독자의 관심을 끄는 질문 시작\u003c/span>\u003cb>Let's consider (2)\u003c/b>\u003cspan>본격적인 분석과 제안\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">bought things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">buying things\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 질문 답변 구조를 취하고 있어요. 글의 시작 부분에서 메인 문장인 두 번째 문장을 이끌어내기 위해 첫 번째 문장에서 질문을 던지는 두괄식 구성을 보여주고 있습니다.","hl":"ty"},{"n":8,"text":"신호어를 살펴볼까요? 첫 번째 문장의 Have you ever wondered why는 독자의 호기심을 자극하는 아주 중요한 표현이고요. 두 번째 문장의 Let's consider는 이제부터 무엇을 중점적으로 볼 것인지를 알려주는 아주 강력한 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wonder\u003c/b>\u003cem>동사\u003c/em>\u003cspan>궁금해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bought\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구매했다 (buy의 과거분사)\u003c/span>\u003c/div>\u003cdiv>\u003cb>thing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건, 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>~조차, 심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>want\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>let's\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하자\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>affect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>when it comes to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 관하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>buying\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매, 사는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>have ever wondered\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>궁금해한 적이 있다 (현재완료 경험)\u003c/span>\u003c/div>\u003cdiv>\u003cb>you've\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>you have의 축약형\u003c/span>\u003c/div>\u003cdiv>\u003cb>don't\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>do not의 축약형\u003c/span>\u003c/div>\u003cdiv>\u003cb>what\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>무엇이 (의문사)\u003c/span>\u003c/div>\u003cdiv>\u003cb>us\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>우리를\u003c/span>\u003c/div>\u003cdiv>\u003cb>why\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜 (의문사)\u003c/span>\u003c/div>\u003cdiv>\u003cb>or\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>또는\u003c/span>\u003c/div>\u003cdiv>\u003cb>that\u003c/b>\u003cem>관계대명사\u003c/em>\u003cspan>~하는 (주격 관계대명사)\u003c/span>\u003c/div>\u003cdiv>\u003cb>ever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>지금까지, 이전에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어들도 챙겨볼까요? 궁금해하다라는 뜻의 wonder와 영향을 미치다라는 의미의 affect는 꼭 기억하세요. 특히 when it comes to라는 숙어는 무엇에 관하여라는 뜻으로 독해에서 정말 자주 나온답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wonder\u003c/b>\u003cspan class=\"m\">궁금해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inquire\u003c/span>\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">know\u003c/span>\u003cspan class=\"a\">answer\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">buy\u003c/b>\u003cspan class=\"m\">사다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">purchase\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sell\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consider\u003c/b>\u003cspan class=\"m\">고려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contemplate\u003c/span>\u003cspan class=\"s\">ponder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">affect\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">influence\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">need\u003c/b>\u003cspan class=\"m\">필요로 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">require\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어 공부도 해볼까요? wonder는 inquire나 question으로 바꿔 쓸 수 있고, affect는 influence나 impact와 같은 의미예요. 물건을 사다라는 뜻의 buy 대신 purchase라는 단어를 써도 아주 자연스럽죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 2\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 궁금해한 적이 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">wondered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 왜 구매했는지 것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">you've \u003c/span>\u003cspan class=\"tgt\">bought \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원하거나 필요로 하지도 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 원하거나 필요로 하지도 않는 것들을 자신이 왜 구매했는지 궁금해한 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 평소 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">습관\u003c/b>에 대한 의문을 제기하며 글의 도입을 엽니다. 자신이 원하지 않는 물건을 사는 \u003cb class=\"key\">비합리적 \u003c/b>\u003cb class=\"key\">소비\u003c/b>의 이유를 생각해보게 유도합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 경험\u003c/span> : have + 주어 + ever + p.p.(과거분사)? : \"궁금해한 적이 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(why) + 주어(you) + 동사(have bought) : \"왜 자신이 것들을 구매했는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 선행사(things) + that + 주어 + 동사 : \"원하거나 필요로 하지도 않는 (것들)\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Have you ever wondered, 여러분은 궁금해한 적이 있는가. why you've bought things, 자신이 왜 구매했는지 것들을. that you don't even want or need?, 원하거나 필요로 하지도 않는. 이 문장 전체를 해석하면, 여러분은 원하거나 필요로 하지도 않는 것들을 자신이 왜 구매했는지 궁금해한 적이 있는가?","hl":"m"},{"n":12,"text":"이 문장은 독자들에게 평소 자신의 소비 습관을 되돌아보게 만드는 질문이에요. 필요하지 않은 물건을 왜 샀는지 충동구매의 경험을 떠올리게 하며 글의 주제를 던지고 있습니다.","hl":"mn"},{"n":13,"text":"첫 번째로 Have you ever wondered는 현재완료의 경험을 묻는 표현이에요. 두 번째로 why 이하는 wondered의 목적어로 쓰인 간접의문문인데 의문사 주어 동사의 어순을 주의해야 하죠. 마지막으로 that은 things를 꾸미는 목적격 관계대명사로 뒤에 목적어가 빠진 불완전한 문장이 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 2\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보자\u003c/span>\u003cspan class=\"en\">Let's consider\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 우리에게 영향을 주는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">affects \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물건들을 구매하는 것에 관하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buying\u003c/span> things.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물건들을 구매하는 것에 관하여 무엇이 우리에게 영향을 주는지 생각해 보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구매 행위에 영향을 미치는 다양한 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>들을 본격적으로 살펴보겠다는 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사가 주어인 경우)\u003c/span> : 의문사(what, 주어 역할) + 동사(affects) : \"무엇이 우리에게 영향을 주는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to의 쓰임\u003c/span> : when it comes to + 동명사(V-ing) : \"구매하는 것에 관하여\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Let's consider, 생각해 보자. what affects us, 무엇이 우리에게 영향을 주는지. when it comes to buying things, 물건들을 구매하는 것에 관하여. 이 문장 전체를 해석하면, 물건들을 구매하는 것에 관하여 무엇이 우리에게 영향을 주는지 생각해 보자.","hl":"m"},{"n":15,"text":"이제 본격적으로 구매 결정에 영향을 미치는 여러 가지 요인들을 알아보자는 글의 방향을 제시하고 있어요. 우리 마음속에 어떤 심리가 작동하는지 살펴보자는 것이죠.","hl":"mn"},{"n":16,"text":"첫 번째로 what affects us는 간접의문문인데 what이 의문사이자 동시에 주어 역할을 해서 바로 뒤에 동사 affects가 왔어요. 두 번째로 when it comes to는 관용 표현인데 이때 to는 전치사라는 점이 아주 중요해요. 그래서 뒤에 buy가 아니라 동명사인 buying이 온 것입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자신에게 불필요한 물건을 왜 샀는지에 대해 \u003cb class=\"key\">의문\u003c/b>을 던지며 시작합니다.\u003c/li>\u003cli>우리의 소비 결정이 항상 \u003cb class=\"key\">필요\u003c/b>에 의해서만 이루어지지 않음을 시사합니다.\u003c/li>\u003cli>물건 구매 시 우리에게 영향을 미치는 다양한 \u003cb class=\"key\">요인\u003c/b>들을 분석하고자 합니다.\u003c/li>\u003cli>현명한 소비를 위해 자신의 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 돌아보는 계기를 제공합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>This text encourages readers to examine the various factors that lead to irrational consumption of unnecessary items.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리가 왜 필요하지 않은 물건을 구매하는지에 대한 \u003cb class=\"key\">의문\u003c/b>을 제기하고, 소비에 영향을 미치는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>들을 탐구해 볼 것을 제안하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"자, 이렇게 해서 오늘 짧지만 강렬한 도입부를 살펴보았습니다. 우리가 왜 불필요한 물건을 사게 되는지, 그 비밀은 다음 시간에 더 자세히 풀릴 거예요. 오늘 배운 문장들을 꼭 소리 내어 읽어보시고, 특히 현재완료의 경험 용법도 다시 한번 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
