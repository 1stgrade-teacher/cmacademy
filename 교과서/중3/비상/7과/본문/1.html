\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 물건을 살 때 무심코 지갑을 여는 현상 뒤에는 소비자 심리(Consumer Psychology)라는 재미있는 분야가 숨어 있어요. 보통 사람들은 자신의 선택이 온전히 스스로의 의지라고 믿지만, 사실 우리는 주변 환경이나 상황적 요인에 의해 알게 모르게 영향을 받곤 하죠. 예를 들어, 가게에서 들려오는 음악이나 상품의 배치처럼 우리가 의식하지 못하는 잠재의식(Subconscious)이 구매 결정을 좌우하기도 한답니다. 이런 현상을 충동구매(Impulse Buying)라고 부르는데, 이는 마치 할인 문구가 적힌 표지판을 보고 왠지 사야 할 것 같은 기분을 느끼는 것과 비슷해요. 따라서 합리적인 소비를 위해서는 우리가 왜 물건을 사고 싶어 하는지 스스로 되돌아보는 비판적 사고(Critical Thinking)가 무엇보다 중요하답니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jeff와 마찬가지로</span><span class=\"en\"><b>Just like Jeff</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그의 친구들처럼,</span><span class=\"en\"><b>and his friends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 물건을 사는 경향이 있다</span><span class=\"en\"><b>we tend <span class=\"grammar-hl\">to buy</span> things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진지하게 고려하지 않고</span><span class=\"en\"><b>without seriously <span class=\"grammar-hl\">considering</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것들을 왜 사는지</span><span class=\"en\"><b><span class=\"grammar-hl\">why we are buying them</span>.</b></span></div></div><div class=\"lec-sent-ko\">Jeff와 그의 친구들처럼, 우리는 우리가 왜 물건들을 사는지 진지하게 고려하지 않고 그것들을 구입하는 경향이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 글에서 다룬 &#39;제프와 친구들의 사례&#39;를 일반적인 우리들의 행동으로 확장하는 문장입니다. 여기서 **tend to**는 사전적으로는 &#39;향하다&#39;라는 뜻이지만, 여기서는 반복되는 습관이나 경향을 나타내어 우리도 모르게 당연하게 물건을 구매한다는 점을 강조하기 위해 선택되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): tend의 목적어 역할을 하는 명사적 용법의 to부정사 구조임</div><div class=\"lec-gr-item\">considering (현재분사): 전치사 without의 목적어 자리에서 동사 consider의 동작을 나타내는 동명사(명사적) 역할</div><div class=\"lec-gr-item\">why we are buying them (간접의문문): 의문사(why) + 주어(we) + 동사(are buying) 순서로 구성된 명사절로, 타동사 considering의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 효과들이</span><span class=\"en\"><b>As these effects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여 주듯이,</span><span class=\"en\"><b><span class=\"grammar-hl\">have shown</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 것들이</span><span class=\"en\"><b>many things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미친다</span><span class=\"en\"><b>influence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 구매에</span><span class=\"en\"><b>our purchases.</b></span></div></div><div class=\"lec-sent-ko\">이러한 효과들이 보여 주듯이, 많은 것들이 우리의 구매에 영향을 미친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 행동(생각 없이 구매함)이 왜 일어나는지에 대한 원인을 제시합니다. 여기서 **influence**는 &#39;영향을 주다&#39;라는 뜻인데, 단순히 어떤 결과를 만드는 것을 넘어 우리들의 소비 심리를 외부 요인이 흔들고 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have shown (현재완료): 조동사 have + 과거분사(shown) 구조로, 과거부터 현재까지의 영향을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음번에</span><span class=\"en\"><b>The next time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 무언가를 사기로 결정할 때는,</span><span class=\"en\"><b>you decide <span class=\"grammar-hl\">to buy</span> something,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠시 동안 생각해 보아라</span><span class=\"en\"><b>think for a moment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 ~인지에 대해서</span><span class=\"en\"><b>about <span class=\"grammar-hl\">why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 그것을 사고 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">you are buying it</span>.</b></span></div></div><div class=\"lec-sent-ko\">다음번에 여러분이 어떤 것을 구매하려고 결정할 때에는, 자신이 그것을 왜 사려는지 잠시 동안 생각해 보아라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 내용들을 바탕으로 필자가 독자에게 주는 실질적인 조언입니다. 2번 문장의 문제점(외부 요인에 휘둘림)을 해결하기 위한 구체적인 방법으로, 감정적인 소비 대신 &#39;잠시 멈춰 생각하는 과정&#39;을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): decide의 목적어 역할을 하는 명사적 용법의 to부정사 구조임</div><div class=\"lec-gr-item\">why you are buying it (간접의문문): 의문사(why) + 주어(you) + 동사(are buying) 순서로 구성된 명사절로, 전치사 about의 목적어 역할을 함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 무의식적으로 물건을 구매하는 경향이 있다.</li><li>우리의 구매 결정에는 알게 모르게 영향을 미치는 외부 요인들이 많다.</li><li>따라서 소비를 하기 전에 자신이 왜 그것을 사려는지 한 번쯤 생각해보는 태도가 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">We often make impulsive purchases without considering the reason, yet we should pause to reflect on our motivations before buying something.</div>\n              <div class=\"lec-final-sum-ko\">우리는 종종 이유를 고려하지 않고 충동적으로 구매하지만, 무언가를 사기 전에 잠시 멈추어 동기를 되돌아보아야 한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meaning"},{"audio":"./1_audio/5.mp3","hl":"grammar"}],[{"audio":"./1_audio/6.mp3","hl":"main"},{"audio":"./1_audio/7.mp3","hl":"meaning"},{"audio":"./1_audio/8.mp3","hl":"grammar"}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"aud
