cBhzgDHQdOcZ54PqaRiuT9wkkcZXsDwRjG3vgHbgAdaOZdGtfTv0/ry0LTW9tlrte90l2stbN6X66jCCCMsCW68jPB6kD7ucg9O5OOaTB+pG3PPsPQ8Dpn29M1IdvUhfpu5JPQ5AxnBx1Iye46tO3LAFAQefmBODgKOfr27sMHin2u9Wl1+6219LbaWew1JNpbaap8tlstbvZXt8/IZ6f54OO3t/wDWNDEgZHVeRyR05PQHr2GMZ6g5JpeBnlen95fbjr1H8XcDP4qVIyCf4WIIOQMDOcjjA69ex7c0rr8vx2v11Kun1T7Wt5fLqrH/2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Literal vs. Metaphorical Wisdom: The Path to True Prosperity<small>문자 그대로의 지혜 대 비유적인 지혜: 진정한 번영에 이르는 길<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">조언이나 교훈을 대할 때 우리가 가장 주의해야 할 점은 문자주의(Literalism), 즉 단어의 표면적인 의미에만 매몰되지 않는 것입니다. 아리스토텔레스가 강조한 실천적 지혜(Phronesis)에 따르면, 아무리 훌륭한 가르침이라도 구체적인 상황과 맥락에 맞춰 유연하게 적용될 때 비로소 진정한 가치를 지니게 됩니다. 마치 요리책의 &#39;간을 알맞게 맞추라&#39;는 지시를 문자 그대로가 아니라 재료의 상태와 먹는 사람의 취향이라는 상황 맥락(Context)에 따라 해석해야 하는 것과 같은 이치입니다. 지문에 등장하는 교훈처럼 은유(Metaphor)가 섞인 가르침을 깊은 고민 없이 글자 그대로 받아들이면 본래 의도와는 정반대의 결과를 초래할 수 있으므로, 말 뒤에 숨겨진 본질적인 의도(Intent)를 꿰뚫어 보는 통찰력이 무엇보다 중요합니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01형제의 재회와 대화<\/div><ul><li>푸네트가 동생 푸루를 반갑게 맞이하고, 두 형제는 저녁 식사 후 대화를 나눈다.<\/li><li>푸네트(Puneet)의 따뜻한 환영<\/li><li>푸루가 며칠 동안 고민해온 질문(question)<\/li><li>핵심 키워드: 대화(chat), 질문(question)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02아버지 조언의 문자적 실천<\/div><ul><li>푸루는 아버지의 가르침을 글자 그대로 해석하여 호화로운 생활을 유지하려 노력했다.<\/li><li>모든 도시에 집을 짓고 관리인(people)을 고용함<\/li><li>전문가의 침대와 요리사(chef)가 준비한 식사 향유<\/li><li>돈 걱정 없이 부자처럼 소비(spend)하는 태도<\/li><li>핵심 키워드: 아버지의 조언(father’s advice), 실천(follow)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03잘못된 해석의 비참한 결과<\/div><ul><li>아버지를 따랐음에도 불구하고 푸루는 현재 행복하지 않으며 경제적 파산을 겪는다.<\/li><li>많은 노력에도 불구하고 행복(happy)하지 않은 상태<\/li><li>현재 모든 재산을 잃고 빈털터리(empty-handed)가 됨<\/li><li>핵심 키워드: 불행(not happy), 빈털터리(empty-handed)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04형의 성공 비결에 대한 의문<\/div><ul><li>푸루는 같은 조언을 들었을 형이 어떻게 부자가 될 수 있었는지 궁금해한다.<\/li><li>아버지의 지혜(wisdom)를 형도 따랐는지에 대한 확인<\/li><li>형이 부유(rich)해진 비결에 대한 질문<\/li><li>핵심 키워드: 지혜(wisdom), 부유함(rich)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">with open arms<\/td><td class=\"m\">아주 기쁘게, 두 팔을 벌려<\/td><\/tr><tr><td class=\"w\">sit down<\/td><td class=\"m\">앉다<\/td><\/tr><tr><td class=\"w\">be on one&#39;s mind<\/td><td class=\"m\">~의 염두에 있다, ~가 계속 생각나다<\/td><\/tr><tr><td class=\"w\">look after<\/td><td class=\"m\">~을 돌보다, ~을 관리하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expert<\/td><td class=\"m\">전문가<\/td><\/tr><tr><td class=\"w\">look at<\/td><td class=\"m\">~을 보다, (현재의 상태를) 살피다<\/td><\/tr><tr><td class=\"w\">empty-handed<\/td><td class=\"m\">빈손인, 아무것도 가진 것이 없는<\/td><\/tr><tr><td class=\"w\">wisdom<\/td><td class=\"m\">지혜<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Puneet<\/b><\/span><span class=\"ko\">Puneet은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>welcomed Puru<\/b><\/span><span class=\"ko\">Puru를 환영했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with open arms<\/span>.<\/b><\/span><span class=\"ko\">두 팔 벌려.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Puneet은 Puru를 두 팔 벌려 환영했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 형제간의 우애가 깊음을 보여주며, 두 사람이 오랜만에 만나 대화를 시작하게 되는 배경을 제시합니다. with open arms는 진심으로 기쁘게 반기는 모습을 생생하게 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">with open arms (관용표현): &#39;두 팔을 벌려/진심으로 환영하며&#39;라는 의미로, 주어의 환대하는 태도를 나타내는 부사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">with open arms<\/td><td class=\"m\">아주 기쁘게, 두 팔을 벌려<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>That night,<\/b><\/span><span class=\"ko\">그날 밤,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when the brothers sat down<\/b><\/span><span class=\"ko\">형제가 앉았을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to chat<\/span><\/b><\/span><span class=\"ko\">이야기를 나누기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after dinner,<\/b><\/span><span class=\"ko\">저녁 식사 후,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Puru asked <span class=\"grammar-hl\">the question<\/span><\/b><\/span><span class=\"ko\">Puru는 질문을 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that had been on his mind<\/span> for days.<\/b><\/span><span class=\"ko\">며칠간 자신의 마음에 있었던.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그날 밤, 형제가 저녁 식사 후 이야기를 하려고 앉았을 때, Puru는 며칠간 자신의 마음에 있었던 그 질문을 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 환대의 분위기에서 깊은 대화로 전환되는 지점입니다. Puru가 겉으로는 잘 지내는 듯 보였으나 속으로는 오랫동안 해결되지 않은 고민을 안고 있었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to chat (to부정사(부사적): 목적): &#39;이야기하기 위해&#39;라는 의미로, sat down 뒤에서 동작의 목적을 나타내며 &#39;in order to chat&#39;으로 바꿔 쓸 수 있다.<\/div><div class=\"lec-gr-item\">the question that had been on his mind (관계대명사): that은 선행사인 the question을 수식하는 주격 관계대명사이며, 뒤에 주어가 빠진 불완전한 절이 이어지는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sit down<\/td><td class=\"m\">앉다<\/td><\/tr><tr><td class=\"w\">be on one&#39;s mind<\/td><td class=\"m\">~의 염두에 있다, ~가 계속 생각나다<\/td><\/tr><tr><td class=\"w\">look after<\/td><td class=\"m\">~을 돌보다, ~을 관리하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">It was our father’s advice that I followed<\/span>,<\/b><\/span><span class=\"ko\">“내가 따른 건 바로 우리 아버지의 조언이었지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but I am not happy.<\/b><\/span><span class=\"ko\">나는 행복하지 않아.<\/span><\/div><\/div><div class=\"lec-sent-ko\">“내가 따른 건 바로 우리 아버지의 조언이었지만, 나는 행복하지 않아.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Puru가 처한 모순적인 상황을 드러냅니다. 지혜로운 아버지의 말씀을 충실히 지켰음에도 결과가 좋지 않아 당혹스러워하는 심경이 담겨 있으며, 이어지는 하소연의 시작점이 됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It was our father’s advice that I followed (강조구문): &#39;It was ~ that&#39; 구조를 사용하여 문장의 목적어인 our father’s advice를 강조하며, &#39;내가 따른 것은 바로 우리 아버지의 조언이었다&#39;라고 해석한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">built<\/span> a house<\/b><\/span><span class=\"ko\">나는 집을 지었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in every city.<\/b><\/span><span class=\"ko\">모든 도시에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 모든 도시에 집을 지었어.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아버지가 하신 말씀 중 하나를 Puru가 문자 그대로 받아들여 실행한 첫 번째 사례입니다. built a house는 나중에 밝혀질 조언의 비유적 의미와 대비되는 Puru의 융통성 없는 실천을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">built (서술어): 타동사 build의 과거형으로 뒤에 목적어 a house를 취하여 &#39;집을 지었다&#39;는 의미의 3형식 문장을 만든다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">그러나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because I could not always stay there,<\/b><\/span><span class=\"ko\">내가 그곳에 항상 머물 수 없었기 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I hired people<\/b><\/span><span class=\"ko\">나는 사람들을 고용했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">had the house looked after<\/span>.<\/b><\/span><span class=\"ko\">그리고 그 집을 돌보게 했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 나는 그곳에 항상 머물 수 없었으므로 사람들을 고용하여 집을 돌보게 했지.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 지은 집들이 Puru에게는 오히려 관리비용과 인건비가 나가는 짐이 되었음을 설명합니다. had the house looked after는 집을 유지하기 위해 불필요한 지출이 계속해서 발생했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">had the house looked after 5형식(SVOC) 구조: 사역동사 had + 목적어(the house) + 목적격보어(looked after) 구조로, 목적어와 보어의 관계가 수동(&#39;집이 돌보아지다&#39;)이므로 과거분사를 사용했다.<\/div><div class=\"lec-gr-item\">looked after (과거분사(형용사적)): looked after가 목적어인 the house를 수식하며 &#39;돌보아지는&#39;이라는 수동의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look after<\/td><td class=\"m\">~을 돌보다, ~을 관리하다<\/td><\/tr><tr><td class=\"w\">look at<\/td><td class=\"m\">~을 보다, (현재의 상태를) 살피다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Father said<\/b><\/span><span class=\"ko\">아버지께서 말씀하셨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we should sleep comfortably<\/b><\/span><span class=\"ko\">우리가 편안하게 자야 한다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and enjoy our food,<\/b><\/span><span class=\"ko\">그리고 음식을 즐겨야 한다고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so I <span class=\"grammar-hl\">had my bed designed<\/span><\/b><\/span><span class=\"ko\">그래서 나는 내 침대를 설계되게 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by experts<\/b><\/span><span class=\"ko\">전문가들에 의해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">my meals prepared<\/span><\/b><\/span><span class=\"ko\">그리고 내 식사를 준비되게 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by a great chef.<\/b><\/span><span class=\"ko\">훌륭한 요리사에 의해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아버지께서 우리는 편하게 자고 음식을 즐겨야 한다고 말씀하셔서 나는 내 침대를 전문가들에 의해 설계되게 했고, 내 식사는 훌륭한 요리사에 의해 준비되도록 했단다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아버지의 조언을 물질적인 사치로 해석한 두 번째 사례입니다. designed by experts와 prepared by a great chef는 Puru가 본질적인 즐거움보다 외적인 화려함에 돈을 썼음을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">had my bed designed 5형식(SVOC) 구조: 사역동사 had + 목적어(my bed) + 목적격보어(designed) 구조로, 침대가 디자인되는 수동의 관계이므로 목적격보어 자리에 과거분사 designed를 썼다.<\/div><div class=\"lec-gr-item\">designed (과거분사(형용사적)): designed가 목적어 my bed를 수식하며 &#39;디자인된&#39;이라는 수동의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">my meals prepared 5형식(SVOC) 구조: 앞의 동사 had에 연결되는 목적어(my meals)와 목적격보어(prepared) 구조로, 식사가 준비되는 수동의 관계이므로 과거분사를 사용했다.<\/div><div class=\"lec-gr-item\">prepared (과거분사(형용사적)): prepared가 목적어 my meals를 수식하며 &#39;준비된&#39;이라는 수동의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expert<\/td><td class=\"m\">전문가<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He <span class=\"grammar-hl\">told us<\/span><\/b><\/span><span class=\"ko\">그는 우리에게 말씀하셨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to spend<\/span><\/b><\/span><span class=\"ko\">쓰라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like a rich man,<\/b><\/span><span class=\"ko\">부자처럼,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so I bought <span class=\"grammar-hl\">what I wanted<\/span><\/b><\/span><span class=\"ko\">그래서 나는 내가 원하는 것을 샀다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">worrying<\/span> about money.<\/b><\/span><span class=\"ko\">돈 걱정을 하지 않고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 우리에게 부자처럼 돈을 쓰라고 했으므로, 나는 돈 걱정을 하지 않고 내가 원하는 것을 샀지.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 세 번째 사례로, 아버지가 말씀하신 &#39;부자처럼 쓰는 법&#39;을 단순히 낭비하는 것으로 이해했음을 뜻합니다. without worrying about money는 미래를 생각하지 않는 무분별한 소비 습관을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">told us to spend 5형식(SVOC) 구조: tell + 목적어(us) + 목적격보어(to spend) 구조로, 목적어에게 특정 행동을 하라고 말하는 구조를 만든다.<\/div><div class=\"lec-gr-item\">to spend (목적격보어(to부정사)): tell + O + to V 구조에서 목적어 us의 동작을 설명하기 위해 쓰인 목적격보어다.<\/div><div class=\"lec-gr-item\">what I wanted (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 명사절로, 동사 bought의 목적어 역할을 하며 &#39;~한 것&#39;으로 해석한다.<\/div><div class=\"lec-gr-item\">worrying (동명사): -ing가 전치사 without의 목적어 역할을 하는 명사로 쓰여 &#39;걱정하는 것&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">그렇지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">look at<\/span> me<\/b><\/span><span class=\"ko\">나를 봐<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>now!<\/b><\/span><span class=\"ko\">지금!<\/span><\/div><\/div><div class=\"lec-sent-ko\">그렇지만 지금 나를 봐!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신이 행한 일들과 현재의 초라한 결과 사이의 극명한 대비를 강조합니다. 자신의 노력이 실패로 돌아갔음을 형에게 확인시켜 주는 절박한 표현입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">look at (관용표현): &#39;~을 보다&#39;라는 의미의 구동사이며, 문장 맨 앞에 동사원형이 위치하여 명령문을 구성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at<\/td><td class=\"m\">~을 보다, (현재의 상태를) 살피다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I am <span class=\"grammar-hl\">empty-handed<\/span>.<\/b><\/span><span class=\"ko\">나는 빈털터리야.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 빈털터리야.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 무분별한 해석과 행동의 결과로 모든 재산을 탕진했다는 구체적인 결말을 나타냅니다. empty-handed는 아버지가 물려주신 유산이나 그동안 번 돈이 하나도 남지 않은 경제적 파산 상태를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">empty-handed (주격보어): 주어 I의 상태를 보충 설명하는 형용사구로, &#39;빈손인/빈털터리인&#39;이라는 의미의 2형식 구조를 완성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">empty-handed<\/td><td class=\"m\">빈손인, 아무것도 가진 것이 없는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Did you not follow<\/span><\/b><\/span><span class=\"ko\">너는 따르지 않았니<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>our father’s wisdom?<\/b><\/span><span class=\"ko\">우리 아버지의 지혜를?<\/span><\/div><\/div><div class=\"lec-sent-ko\">너는 우리 아버지의 지혜를 따르지 않았니?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신과 달리 부유해 보이는 형을 보며, 형은 아버지의 말씀을 어겼기에 돈을 지킬 수 있었던 것인지 의구심을 갖는 장면입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Did you not follow 일반동사 의문문: 일반동사 follow의 부정 의문문을 만들기 위해 조동사 Did가 주어 앞으로 나간 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wisdom<\/td><td class=\"m\">지혜<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Tell me, brother,<\/b><\/span><span class=\"ko\">나에게 말해 보렴, 형제야,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>how did you <span class=\"grammar-hl\">get<\/span><\/b><\/span><span class=\"ko\">너는 어떻게 되었니<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">so rich<\/span>?”<\/b><\/span><span class=\"ko\">그렇게 부유하게?”<\/span><\/div><\/div><div class=\"lec-sent-ko\">나에게 말해 보렴, 형제야, 너는 어떻게 그렇게 부유해졌니?”<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Puru의 마지막 질문으로, 같은 조언을 들었음에도 정반대의 결과를 낸 형의 비결을 묻고 있습니다. 이는 아버지의 조언에 담긴 &#39;진짜 의미&#39;가 무엇인지 파악하고자 하는 글의 핵심적인 물음입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">get so rich 2형식 구조: 상태의 변화를 나타내는 불완전 자동사 get 뒤에 주격보어 역할을 하는 형용사 rich가 결합하여 &#39;~하게 되다&#39;라는 의미를 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>형제인 Puneet와 Puru는 아버지로부터 똑같은 삶의 지혜를 전수받았다.<\/li><li>동생 Puru는 아버지의 조언을 문자 그대로 해석하여 도시마다 집을 짓고 사치스러운 생활을 하며 재산을 탕진했다.<\/li><li>결국 빈털터리가 된 Puru는 부유하게 살고 있는 형 Puneet를 찾아가 조언을 어떻게 실천했는지 묻는다.<\/li><li>이 글은 같은 가르침이라도 그것을 해석하고 적용하는 방식에 따라 결과가 완전히 달라질 수 있음을 시사한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Puru ended up empty-handed despite following his father’s instructions because he mistook metaphorical wisdom for literal materialistic actions.<\/div>\n              <div class=\"lec-final-sum-ko\">Puru는 아버지의 가르침을 따랐음에도 불구하고 비유적인 지혜를 문자 그대로의 물질적 행동으로 착각하여 결국 빈털터리가 되었다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],
