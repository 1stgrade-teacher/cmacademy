prdbbvt3a7dz//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Wisdom Beyond Words: A Lesson in Understanding<small>단어 그 이상의 지혜: 이해에 관한 교훈</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 고정관념에서 벗어나 사물의 본질을 꿰뚫어 보는 지혜(wisdom)에 대해 다루고 있습니다. 우리는 흔히 부자가 되는 법을 물질적인 풍요와 직접 연결 짓곤 하는데, 이는 마치 &#39;금수저&#39;가 되는 것이 곧 성공이라는 편향된 사고(biased thinking)와 비슷합니다. 하지만 이 이야기에서 아버지가 강조한 것은 단순히 돈을 쓰는 법이 아니라, 관점의 전환(shifting perspective)을 통해 세상을 다르게 해석하는 힘입니다. 즉, 진정한 부란 단순히 많은 재산을 소유하는 것이 아니라, 어떤 상황에서도 문제를 합리적으로 해결(rational problem-solving)하고 자원을 효율적으로 관리하는 능력에서 나옵니다. 여러분도 이번 글을 읽으며, 남들이 정해놓은 뻔한 정답 대신 나만의 통찰력(insight)으로 상황을 다르게 해석하는 연습을 해보시길 바랍니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부유하고 지혜로운 아버지는</span><span class=\"en\"><b><span class=\"grammar-hl\">A rich and wise father</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 아들을 두었는데,</span><span class=\"en\"><b><span class=\"grammar-hl\">had two sons</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸루와 푸니트를.</span><span class=\"en\"><b>Puru and Puneet.</b></span></div></div><div class=\"lec-sent-ko\">부유하고 지혜로운 아버지에게 두 아들, Puru와 Puneet이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 주인공인 아버지와 두 아들을 소개하며, 앞으로 펼쳐질 사건의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A rich and wise father had two sons 기본 문장 구조: S(A rich and wise father) + V(had) + O(two sons)의 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 세상을 떠나기 전에,</span><span class=\"en\"><b>Before he passed away,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 두 아들을 불러</span><span class=\"en\"><b>he called his two sons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 해주었다</span><span class=\"en\"><b><span class=\"grammar-hl\">to give</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마지막 조언을.</span><span class=\"en\"><b>some last words of advice.</b></span></div></div><div class=\"lec-sent-ko\">아버지는 돌아가시기 전에, 마지막 충고의 말을 하기 위해 그의 두 아들을 불렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 passed away는 사전적으로 &#39;지나가 버리다&#39;이지만, 문맥상 &#39;죽다&#39;를 완곡하게 표현한 것입니다. 직접적인 죽음이라는 단어 대신 정중하고 부드러운 표현을 사용하여 아버지의 엄숙한 마지막 순간을 강조합니다. 3. “Listen carefully, my dear sons. Live by these words throughout your life, and you will be happy,” he said. 아버지가 유언을 통해 자식들에게 삶의 지침을 제시하고 있으며, 이는 이후 두 아들의 인생이 갈라지는 원인이 됩니다. 4. “Build a house in every city. Sleep comfortably. Enjoy your food. Lastly, spend money like a rich man... .” 아버지의 조언은 비유적이고 함축적이라서, 이를 어떻게 해석하느냐에 따라 결과가 완전히 달라질 수 있는 여지를 남깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to give (to부정사): 부사적 용법(목적)으로, &#39;~하기 위해서&#39;라는 의미로 앞에 온 동사(called)의 목적을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잘 들어라,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Listen carefully</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 아들들아.</span><span class=\"en\"><b>my dear sons.</b></span></div></div><div class=\"lec-sent-ko\">“주의 깊게 듣거라, 사랑하는 아들들아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지가 유언을 통해 자식들에게 삶의 지침을 제시하고 있으며, 이는 이후 두 아들의 인생이 갈라지는 원인이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Listen carefully (명령문): 주어 없이 동사원형으로 시작하며, 상대방에게 동작을 지시하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 말대로 살아라</span><span class=\"en\"><b><span class=\"grammar-hl\">Live by these words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평생,</span><span class=\"en\"><b>throughout your life,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희는 행복할 것이다,”라고</span><span class=\"en\"><b>and you will be happy,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 말했다.</span><span class=\"en\"><b>he said.</b></span></div></div><div class=\"lec-sent-ko\">너희의 일생 동안 이 말대로 살면, 행복해질 것이다.” 그는 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 조언은 비유적이고 함축적이라서, 이를 어떻게 해석하느냐에 따라 결과가 완전히 달라질 수 있는 여지를 남깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Live by these words (관용표현): &#39;Live by ~&#39;는 &#39;~에 따라 살다(생활 방식을 고수하다)&#39;라는 의미의 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">집을 지어라</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Build a house</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 도시에.</span><span class=\"en\"><b>in every city.</b></span></div></div><div class=\"lec-sent-ko\">“모든 도시에 집을 지어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 조언이 구체적인 설명 없이 남겨졌기 때문에, 아들들이 이 말을 각자 자신의 방식으로 해석하게 만드는 결정적인 계기가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Build a house (명령문): 동사원형으로 시작하며, 청자에게 특정한 행위를 하도록 요청하는 5형식 기반의 명시적 지시입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">편안하게 잠을 자라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Sleep comfortably</span>.</b></span></div></div><div class=\"lec-sent-ko\">편하게 자거라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 유산을 바탕으로 각자의 삶을 시작하며 비교 대상이 되는 두 인물의 대조적인 행보가 시작됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Sleep comfortably (명령문): 부사를 사용하여 동작(sleep)을 어떻게 수행해야 하는지 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음식을 즐겨라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Enjoy your food</span>.</b></span></div></div><div class=\"lec-sent-ko\">음식을 즐기거라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간이 지남에 따라 두 아들의 삶의 결과가 어떻게 달라졌는지 보여주기 위한 시간적 배경입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Enjoy your food (명령문): 일반동사 Enjoy를 사용하여 특정 행위를 권장하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Lastly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 써라</span><span class=\"en\"><b><span class=\"grammar-hl\">spend money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부자처럼.</span><span class=\"en\"><b><span class=\"grammar-hl\">like a rich man</span>... .</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, 돈을 부자처럼 쓰거라….”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸루가 아버지의 말을 문자 그대로 해석했음을 보여주며, 그 결과가 실패였음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spend money like a rich man (관용표현): &#39;~처럼(like)&#39;을 사용한 비유적 표현으로, 부유한 사람의 소비 방식을 따르라는 의미의 명령 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 설명을 덧붙이기도 전에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Before he could explain himself</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 세상을 떠났다.</span><span class=\"en\"><b>he passed away.</b></span></div></div><div class=\"lec-sent-ko\">아버지는 그 말을 설명하기도 전에 돌아가셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 조언이 구체적인 설명 없이 남겨졌기 때문에, 아들들이 이 말을 각자 자신의 방식으로 해석하게 만드는 결정적인 계기가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Before he could explain himself 간접의문문 또는 명사절: 접속사절 내에서 주어+동사의 어순을 갖춘 절의 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 죽은 후,</span><span class=\"en\"><b>After his death,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 아들은 아버지의 재산을 나누어 가지고</span><span class=\"en\"><b>the two sons took their share of the father’s wealth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각자 다른 도시에 정착했다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">settled</span> in different cities.</b></span></div></div><div class=\"lec-sent-ko\">그의 죽음 후에, 두 아들은 아버지의 재산 중 자신들의 몫을 가지고 다른 도시에 정착했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아버지의 유산을 바탕으로 각자의 삶을 시작하며 비교 대상이 되는 두 인물의 대조적인 행보가 시작됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">settled (과거시제): 과거에 발생하여 완료된 동작을 나타내며, 문맥상 the two sons가 주어인 병렬 구조의 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">5년이 흘렀다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Five years passed</span>.</b></span></div></div><div class=\"lec-sent-ko\">5년이 지났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간이 지남에 따라 두 아들의 삶의 결과가 어떻게 달라졌는지 보여주기 위한 시간적 배경입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Five years passed 1형식 구조: 주어(Five years)와 자동사(passed)로 이루어진 완전한 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">푸루는,</span><span class=\"en\"><b>Puru,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지의 말씀을 충실히 따랐던</span><span class=\"en\"><b><span class=\"grammar-hl\">who had been following his father’s words</span> carefully,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈이 한 푼도 남지 않았다.</span><span class=\"en\"><b>had no money left.</b></span></div></div><div class=\"lec-sent-ko\">아버지의 말을 신중히 따라온 Puru는 남은 돈이 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸루가 아버지의 말을 문자 그대로 해석했음을 보여주며, 그 결과가 실패였음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who had been following his father’s words (관계대명사): 주격 관계대명사 who가 앞의 명사(Puru)를 수식하며, 절 내부에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그의 형제는</span><span class=\"en\"><b>But his brother</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 어느 때보다 부유했다.</span><span class=\"en\"><b>was <span class=\"grammar-hl\">richer than ever</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그의 형제는 그 어느 때보다 더 부자가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸닛은 푸루와 다른 방식으로 아버지의 말을 해석했음을 짐작하게 하며, 독자로 하여금 궁금증을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">richer than ever (비교급): 형용사 rich의 비교급 richer를 사용하여 과거보다 더 부유해진 상태를 강조합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">푸루는</span><span class=\"en\"><b>Puru</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 잘못되었는지 의아해서,</span><span class=\"en\"><b>was puzzled about <span class=\"grammar-hl\">where he had gone wrong</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 푸니트를 찾아갔다</span><span class=\"en\"><b>so he visited Puneet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 알아내기 위해.</span><span class=\"en\"><b>to find out.</b></span></div></div><div class=\"lec-sent-ko\">Puru는 그가 어디서부터 잘못했는지 어리둥절했고, 그래서 그는 (그것을) 알아내기 위해 Puneet을 방문했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 실패 원인을 찾으려는 푸루와 이를 해결해 줄 푸닛의 만남을 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where he had gone wrong (간접의문문): 의문사(where)+주어(he)+동사(had gone)의 어순으로 구성된 명사절이 전치사 about의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">푸니트는</span><span class=\"en\"><b>Puneet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸루를 환영했다</span><span class=\"en\"><b><span class=\"grammar-hl\">welcomed</span> Puru</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 팔 벌려.</span><span class=\"en\"><b>with open arms.</b></span></div></div><div class=\"lec-sent-ko\">Puneet은 Puru를 두 팔 벌려 환영했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> with open arms는 사전적으로 &#39;두 팔을 벌리고&#39;이지만, 여기서는 &#39;기쁜 마음으로 흔쾌히&#39;라는 뜻입니다. 형제간의 우애와 푸닛의 관대한 성격을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">welcomed (일반동사): 주어(Puneet)가 목적어(Puru)를 대상으로 수행하는 동작을 나타내는 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그날 밤,</span><span class=\"en\"><b>That night,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형제들이 앉아 이야기를 나눌 때,</span><span class=\"en\"><b>when the brothers sat down to chat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저녁 식사 후</span><span class=\"en\"><b>after dinner,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸루는 질문을 했다</span><span class=\"en\"><b>Puru asked the question</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마음속에 담아두었던</span><span class=\"en\"><b><span class=\"grammar-hl\">that had been on his mind</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">며칠 동안.</span><span class=\"en\"><b>for days.</b></span></div></div><div class=\"lec-sent-ko\">그날 밤, 형제가 저녁 식사 후 이야기를 하려고 앉았을 때, Puru는 며칠간 자신의 마음에 있었던 그 질문을 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 갈등의 핵심인 아버지의 조언을 다시 꺼내는 장면입니다. 13. “It was our father’s advice that I followed, but I am not happy.” 푸루의 불행과 자신의 해석이 틀렸음을 고백하는 내용입니다. 14. “I built a house in every city. But because I could not always stay there, I hired people and had the house looked after.” 아버지의 말을 겉모습만 따랐을 때 발생하는 경제적 비효율과 현실적인 어려움을 설명합니다. 15. “Father said we should sleep comfortably and enjoy our food, so I had my bed designed by experts and my meals prepared by a great chef.” 푸루는 &#39;편안함&#39;과 &#39;즐거움&#39;을 사치스럽고 외부적인 조건으로만 해석하는 오류를 범했습니다. 16. “He told us to spend like a rich man, so I bought what I wanted without worrying about money. But look at me now! I am empty-handed.” 소비를 단순한 지출로 이해한 푸루의 시행착오를 보여줍니다. 17. “Did you not follow our father’s wisdom? Tell me, brother, how did you get so rich?” 자신의 실패와 대비되는 푸닛의 성공 비결을 간절히 묻고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that had been on his mind (관계대명사): 주격 관계대명사 that이 앞의 명사(question)를 수식하며, 절 내에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아버지의 조언이었다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It was our father’s advice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 따른 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that I followed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 행복하지 않다.</span><span class=\"en\"><b>but I am not happy.</b></span></div></div><div class=\"lec-sent-ko\">“내가 따른 건 바로 우리 아버지의 조언이었지만, 나는 행복하지 않아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 실패와 대비되는 푸닛의 성공 비결을 간절히 묻고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was our father’s advice that I followed (강조구문): &#39;It is/was + 강조 대상 + that절&#39; 형태로, 주절의 목적어인 advice를 강조하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 집을 지었다</span><span class=\"en\"><b><span class=\"grammar-hl\">I built a house</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 도시에.</span><span class=\"en\"><b>in every city.</b></span></div></div><div class=\"lec-sent-ko\">나는 모든 도시에 집을 지었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성공의 열쇠가 &#39;똑같은 조언&#39;이 아닌 &#39;지혜로운 해석&#39;에 있음을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I built a house 3형식 구조: S(I) + V(built) + O(a house)로, 과거에 수행한 행위를 서술합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 저는 항상 그곳에 머물 수 없었기 때문에,</span><span class=\"en\"><b>But because I could not always stay there,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 고용하여</span><span class=\"en\"><b>I hired people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 집을 돌보게 했습니다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">had the house looked after</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 나는 그곳에 항상 머물 수 없었으므로 사람들을 고용하여 집을 돌보게 했지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸닛은 &#39;집&#39;을 건물이라는 물건이 아닌, &#39;머물 수 있는 관계&#39;라는 추상적 의미로 해석했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had the house looked after (5형식(사역/수동)): &#39;have + 목적어 + p.p.&#39; 구조로, 목적어(the house)와 과거분사(looked after)가 수동 관계(집이 돌봐지게 함)입니다. Look after는 타동사구로, 수동구조의 형태를 취합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아버지는 말씀하셨기에</span><span class=\"en\"><b>Father said</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 편안하게 자고</span><span class=\"en\"><b>we should sleep comfortably</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식을 즐겨야 한다고</span><span class=\"en\"><b>and enjoy our food,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 전문가에게 침대를 설계하게 하고</span><span class=\"en\"><b>so <span class=\"grammar-hl\">I had my bed designed by experts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훌륭한 요리사에게 식사를 준비하게 했습니다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">my meals prepared by a great chef</span>.</b></span></div></div><div class=\"lec-sent-ko\">아버지께서 우리는 편하게 자고 음식을 즐겨야 한다고 말씀하셔서 나는 내 침대를 전문가들에 의해 설계되게 했고, 내 식사는 훌륭한 요리사에 의해 준비되도록 했단다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관계를 통해 경제적 비용은 줄이고 효율은 높인 푸닛의 현명함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I had my bed designed by experts (5형식(사역/수동)): &#39;have + 목적어(my bed) + p.p.(designed)&#39; 구조입니다. Design은 타동사인데, 목적어(my bed)가 행위의 대상이 되어 수동 관계(침대가 디자인되게 함)를 나타냅니다.</div><div class=\"lec-gr-item\">my meals prepared by a great chef 5형식 구조의 축약: &#39;have + 목적어(my meals) + p.p.(prepared)&#39; 구조로 앞의 had와 연결됩니다. Prepare는 타동사이며, 수동 관계(식사가 준비되게 함)를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그분은 우리에게 ~하라고 하셨기에</span><span class=\"en\"><b><span class=\"grammar-hl\">He told us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부자처럼 쓰라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to spend</span> like a rich man,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 제가 원하는 것을 샀습니다</span><span class=\"en\"><b>so I bought what I wanted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈 걱정 없이.</span><span class=\"en\"><b>without worrying about money.</b></span></div></div><div class=\"lec-sent-ko\">그는 우리에게 부자처럼 돈을 쓰라고 했으므로, 나는 돈 걱정을 하지 않고 내가 원하는 것을 샀지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> comfortably는 사전적으로 &#39;안락하게&#39;이지만, 여기서는 마음이 편안한 상태를 의미합니다. 푸닛은 외적인 조건이 아닌 내면의 만족으로 &#39;편안함&#39;을 재정의했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He told us to spend 5형식 구조: S(He) + V(told) + O(us) + OC(to spend) 형태로, 목적어에게 to부정사하도록 요청하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But <span class=\"grammar-hl\">look at me</span> now!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 저를 보십시오!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그렇지만 지금 나를 봐!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;음식을 즐기는 것&#39;이 사치스러운 식단이 아니라 배고픔이라는 본질적인 욕구와 연결됨을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look at me (관용표현): &#39;look at ~&#39;는 &#39;~를 보다&#39;라는 의미의 자동사+전치사 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 ~입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I am empty-handed</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빈털터리가 되었습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 빈털터리야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸루가 가장 오해했던 지점을 짚어주며 반전을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am empty-handed 2형식 구조: S(I) + V(am) + 보어(empty-handed) 형태의 상태 서술입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 따르지 않았느냐</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you not follow</span> our father’s wisdom?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 아버지의 지혜를?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">너는 우리 아버지의 지혜를 따르지 않았니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;부자처럼 쓰라&#39;는 말의 핵심이 소비가 아닌 &#39;투자&#39;임을 깨닫게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you not follow (의문문): 조동사 did를 사용한 일반동사의 부정 의문문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">형제여, 나에게 말해 다오,</span><span class=\"en\"><b>Tell me, brother,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 그렇게 부자가 되었느냐?</span><span class=\"en\"><b><span class=\"grammar-hl\">how did you get so rich</span>?</b></span></div></div><div class=\"lec-sent-ko\">나에게 말해 보렴, 형제야, 너는 어떻게 그렇게 부유해졌니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문맥상 wisdom은 단순히 &#39;지식&#39;이 아니라 삶을 꿰뚫어 보는 &#39;통찰력&#39;을 의미하며, 아버지가 유산보다 값진 가르침을 남겼음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how did you get so rich (간접의문문): 의문사(how)+조동사(did)+주어(you)+동사(get)의 어순을 가진 문장으로, 구체적인 방법이나 상태를 묻습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">푸닛은 미소를 지으며</span><span class=\"en\"><b>Puneet smiled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했습니다.</span><span class=\"en\"><b>and said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 형제여,</span><span class=\"en\"><b>“My dear brother,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나도 우리 아버지의 지혜를 따랐다.</span><span class=\"en\"><b><span class=\"grammar-hl\">I also followed our father’s wisdom</span>.</b></span></div></div><div class=\"lec-sent-ko\">Puneet은 웃으며 말했다, “친애하는 형님, 저 또한 우리 아버지의 지혜를 따랐습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성공의 열쇠가 &#39;똑같은 조언&#39;이 아닌 &#39;지혜로운 해석&#39;에 있음을 밝힙니다. 19. “When he said ‘build a house in every city,’ I took it as having a place to stay all around the world.” 푸닛은 &#39;집&#39;을 건물이라는 물건이 아닌, &#39;머물 수 있는 관계&#39;라는 추상적 의미로 해석했습니다. 20. “So I made friends in every city and I stayed at their houses when I visited those cities.” 관계를 통해 경제적 비용은 줄이고 효율은 높인 푸닛의 현명함을 보여줍니다. 21. “Also, I slept comfortably each night because I would be tired after a hard day’s work, and it did not matter if I was sleeping on a bed or on the hard floor.” comfortably는 사전적으로 &#39;안락하게&#39;이지만, 여기서는 마음이 편안한 상태를 의미합니다. 푸닛은 외적인 조건이 아닌 내면의 만족으로 &#39;편안함&#39;을 재정의했습니다. 22. “I ate only when I was hungry, so even a simple meal tasted great.” &#39;음식을 즐기는 것&#39;이 사치스러운 식단이 아니라 배고픔이라는 본질적인 욕구와 연결됨을 강조합니다. 23. “Spend money like a rich man?” continued Puneet. (&quot;부자처럼 돈을 쓰라고?&quot;) 푸닛이 말을 이었다. 푸루가 가장 오해했던 지점을 짚어주며 반전을 예고합니다. 24. “A rich man knows how to make money grow. So, I tried to spend money on something that would bring me back more money rather than on luxurious things.” &#39;부자처럼 쓰라&#39;는 말의 핵심이 소비가 아닌 &#39;투자&#39;임을 깨닫게 합니다. 25. “For me, it was this wisdom that our father tried to explain.” 문맥상 wisdom은 단순히 &#39;지식&#39;이 아니라 삶을 꿰뚫어 보는 &#39;통찰력&#39;을 의미하며, 아버지가 유산보다 값진 가르침을 남겼음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I also followed our father’s wisdom 3형식 구조: S(I) + V(followed) + O(wisdom)으로, 앞선 화자의 행동을 확인하는 진술입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 그것을 이해했다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">I understood it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약간 다르게.</span><span class=\"en\"><b><span class=\"grammar-hl\">a bit differently</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 조금 다르게 이해했지요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸루의 성장을 보여주며 이야기가 교훈적으로 마무리됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I understood it a bit differently 5형식 변형 구조: S(I) + V(understood) + O(it) + O.C.(differently/부사보어) 형태로, 목적어의 상태나 방식을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그분이 &#39;모든 도시에 집을 지어라&#39;라고 말씀하셨을 때,</span><span class=\"en\"><b>When he said ‘build a house in every city,’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 그것을 머물 곳을 두는 것으로 받아들였다</span><span class=\"en\"><b><span class=\"grammar-hl\">I took it as having a place to stay</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계 어디에나.</span><span class=\"en\"><b>all around the world.</b></span></div></div><div class=\"lec-sent-ko\">아버지가 ‘모든 도시에 집을 지어라’라고 말했을 때, 저는 그것을 전 세계에 머물 수 있는 장소를 가지는 것으로 여겼지요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I took it as having a place to stay (동명사): &#39;having&#39;은 전치사 as의 목적어 역할을 하는 명사적 용법의 동명사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 나는 모든 도시에 친구들을 사귀었고</span><span class=\"en\"><b>So <span class=\"grammar-hl\">I made friends in every city</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 집에서 머물렀다</span><span class=\"en\"><b>and I stayed at their houses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 도시들을 방문할 때마다.</span><span class=\"en\"><b>when I visited those cities.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 모든 도시에서 친구를 사귀었고 그 도시들을 방문했을 때 그들의 집에 머물렀어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I made friends in every city 3형식 구조: S(I) + V(made) + O(friends)로, 인간관계를 형성했다는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 매일 밤 편안하게 잤다</span><span class=\"en\"><b>I slept comfortably each night</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피곤했기 때문에</span><span class=\"en\"><b>because I would be tired</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘든 하루 일과 후에는</span><span class=\"en\"><b>after a hard day’s work,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상관이 없었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">it did not matter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침대에서 자든</span><span class=\"en\"><b>if I was sleeping on a bed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">딱딱한 바닥에서 자든.</span><span class=\"en\"><b>or on the hard floor.</b></span></div></div><div class=\"lec-sent-ko\">또한, 저는 하루 종일 열심히 일하고 나서 피곤해지곤 했기 때문에 침대에서 자든 딱딱한 바닥에서 자든 상관없이 매일 밤 편안하게 잠을 잤지요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it did not matter (대동사): 앞에 언급된 상황을 받는 가주어 it을 포함한 구문으로, 동사 matter가 서술부의 핵심입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 먹었다</span><span class=\"en\"><b><span class=\"grammar-hl\">I ate only</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배가 고플 때만</span><span class=\"en\"><b><span class=\"grammar-hl\">when I was hungry</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 간단한 식사도</span><span class=\"en\"><b>so even a simple meal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훌륭한 맛이 났다.&quot;</span><span class=\"en\"><b>tasted great.</b></span></div></div><div class=\"lec-sent-ko\">저는 배고플 때만 먹었기 때문에 간단한 식사마저도 훌륭한 맛이 났습니다.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I ate only when I was hungry (부사절): when이 이끄는 시간의 부사절이 주절(I ate)을 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부자처럼 돈을 쓰라고?</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Spend money like a rich man</span>?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸닛이 말을 이었습니다.</span><span class=\"en\"><b>continued Puneet.</b></span></div></div><div class=\"lec-sent-ko\">“부자처럼 돈을 쓰라고요?” Puneet은 계속했다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Spend money like a rich man (관용표현): 직접 인용구를 통한 강조이며, &#39;like a rich man&#39;은 부자처럼 행동하는 방식을 나타내는 수식구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부자는</span><span class=\"en\"><b>“<span class=\"grammar-hl\">A rich man</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 불리는 방법을 안다.</span><span class=\"en\"><b><span class=\"grammar-hl\">knows how to make money grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">“부자는 돈을 불리는 방법을 알고 있어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A rich man knows how to make money grow 5형식 구조: &#39;make + 목적어(money) + 동사원형(grow)&#39;의 사역동사 구조로, 돈이 불어나게 하는 능력을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 돈을 쓰려고 노력했다</span><span class=\"en\"><b>I tried to spend money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것에</span><span class=\"en\"><b>on <span class=\"grammar-hl\">something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나에게 더 많은 돈을 다시 벌어다 줄</span><span class=\"en\"><b><span class=\"grammar-hl\">that would bring me back more money</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사치스러운 물건보다는.</span><span class=\"en\"><b>rather than on luxurious things.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 사치스러운 물건에 돈을 쓰는 것보다는 저에게 더 많은 돈을 돌려줄 수 있는 것에 돈을 쓰려고 노력했지요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something that would bring me back more money (관계대명사): 주격 관계대명사 that이 something을 수식하며, &#39;would bring&#39;은 미래지향적 의미를 담은 서술입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나에게는,</span><span class=\"en\"><b>For me,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 지혜였다</span><span class=\"en\"><b><span class=\"grammar-hl\">it was this wisdom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 아버지가 설명하고자 했던.</span><span class=\"en\"><b><span class=\"grammar-hl\">that our father tried to explain</span>.</b></span></div></div><div class=\"lec-sent-ko\">저에게는 이게 우리의 아버지가 설명하려고 하셨던 바로 그 지혜입니다.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was this wisdom that our father tried to explain (강조구문): &#39;It was + this wisdom + that절&#39; 구조로, 아버지의 조언 중 핵심인 &#39;wisdom&#39;을 강조하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 36 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸루는 깨달았다</span><span class=\"en\"><b>Puru realized</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼마나 어리석었는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how foolish</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이</span><span class=\"en\"><b><span class=\"grammar-hl\">he had been</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제 Puru는 그가 얼마나 어리석었었는지를 깨달았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 깨달음을 통해 푸루가 변화할 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how foolish he had been (간접의문문): 의문사(how)+보어(foolish)+주어(he)+동사(had been)의 어순으로, 과거의 상태에 대한 깨달음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 37 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 지혜를 마음에 새기고,</span><span class=\"en\"><b><span class=\"grammar-hl\">With this wisdom in mind</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">푸루는 시작했다</span><span class=\"en\"><b>Puru started</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 삶을</span><span class=\"en\"><b>a new life.</b></span></div></div><div class=\"lec-sent-ko\">이 지혜를 마음에 새기고, Puru는 새로운 삶을 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 푸루의 성장을 보여주며 이야기가 교훈적으로 마무리됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">With this wisdom in mind (관용표현): &#39;have ~ in mind(~를 마음에 두다)&#39;라는 의미를 담은 부사구입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>부유하고 지혜로운 아버지가 두 아들에게 의미심장한 유언을 남기고 세상을 떠난다.</li><li>푸루는 아버지의 말씀을 문자 그대로 해석해 사치스러운 소비를 하다가 빈털터리가 된다.</li><li>푸닛은 아버지의 조언을 지혜롭게 재해석하여 대인관계를 넓히고 현명하게 투자해 부자가 된다.</li><li>푸루는 형 푸닛에게서 진정한 부자의 마인드를 배우고 깨달음을 얻어 새 출발을 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While Puru wasted his wealth by following his father’s words literally, Puneet achieved success because he understood the practical meaning behind the advice.</div>\n              <div class=\"lec-final-sum-ko\">푸루는 아버지의 말씀을 문자 그대로 따라 재산을 낭비한 반면, 푸닛은 그 조언의 실질적인 의미를 이해했기에 성공을 거두었다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3"
