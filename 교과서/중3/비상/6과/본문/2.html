xL9fX/P4Uw019NPXT/gidfp/P8A+tj+fYikJYDP14x6Z5H/ANfrjt0Lsj+8v/fS8j8/pRkeq/8AfS/4/X6Y9KAv93b8/v8A+GG9Tg54wc8jJ4PI9fbn8KUcDHp6fp+lAIyfmXIxn5l/xpeBnlf++lPfPHNL9P8AgPv+f5brXr/X9Kwhz/n/AOsf8PXNKST9O/J9Se59/Xpx0NHH95f++l/xpOM9V9D8y8+nfn6/nTDy/r5/cGf/AK/XuTz05yR/X6o5OxiP4eeDg+uPXkDP4e5yuF9V/wC+l4/XtnilKH5jgHCkkkjCgDg8Bh78nnHQAHDSbv5W9en3vttfZdR/0r7X8/Lc/9k=\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Following Advice: Two Brothers&#39; Different Paths to Wealth and Poverty<small>조언 따르기: 부와 빈곤으로 갈린 두 형제의 서로 다른 길<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전, 조언이나 지시를 곧이곧대로 받아들이는 문자 그대로의 해석(Literal Interpretation)과 그 이면의 의도를 파악하는 맥락적 이해(Contextual Understanding)의 차이를 아는 것이 중요해요. 마치 요리법에 &#39;소금 약간&#39;이라고 적혀 있을 때, 자신의 입맛이나 재료의 상태에 맞춰 양을 조절하는 유연한 사고(Flexible Thinking)가 필요한 것과 비슷하답니다. 특히 부모님의 유산을 관리하는 상황에서는 단순히 돈을 지키는 것을 넘어, 자원을 어떻게 효율적으로 운용하고 불릴 것인지에 대한 금융 문해력(Financial Literacy)이 핵심적인 역할을 하기도 하죠. 이 이야기는 지혜를 글자 그대로만 실천하는 것보다, 그 안에 담긴 본질적인 교훈(Essential Lesson)을 변화하는 상황에 맞게 어떻게 적용하느냐가 삶의 결과를 바꿀 수 있음을 잘 보여줍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01유산 상속과 정착<\/div><ul><li>아버지의 죽음 이후 두 아들은 재산을 나누어 각자의 길을 떠났다.<\/li><li>유산의 분배 (share of wealth)<\/li><li>서로 다른 도시로의 이주 및 정착 (settled in different cities)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">025년 후의 상반된 결과<\/div><ul><li>5년의 세월이 흐른 뒤 두 형제의 경제적 형편은 정반대의 모습이 되었다.<\/li><li>푸루(Puru): 아버지의 말씀을 충실히 따랐으나 남은 돈이 없음 (no money left)<\/li><li>형제(Brother): 이전보다 훨씬 더 부유해짐 (richer than ever)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의문과 진실 규명<\/div><ul><li>자신의 실패 원인을 이해하지 못한 푸루는 형제를 찾아가 이유를 확인하려 했다.<\/li><li>자신의 잘못에 대한 의구심 (puzzled about where he had gone wrong)<\/li><li>원인을 찾기 위해 푸니트(Puneet)를 방문함 (visited to find out)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">몫, 지분<\/td><\/tr><tr><td class=\"w\">wealth<\/td><td class=\"m\">재산, 부<\/td><\/tr><tr><td class=\"w\">settle in<\/td><td class=\"m\">~에 정착하다, ~에 자리를 잡다<\/td><\/tr><tr><td class=\"w\">pass<\/td><td class=\"m\">(시간이) 흐르다, 경과하다<\/td><\/tr><tr><td class=\"w\">word<\/td><td class=\"m\">말, 가르침, 조언<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have no money left<\/td><td class=\"m\">돈이 하나도 남지 않다, 돈이 다 떨어지다<\/td><\/tr><tr><td class=\"w\">puzzled<\/td><td class=\"m\">어리둥절한, 당혹스러운<\/td><\/tr><tr><td class=\"w\">go wrong<\/td><td class=\"m\">잘못되다, 실수를 저지르다<\/td><\/tr><tr><td class=\"w\">find out<\/td><td class=\"m\">알아내다, 확인하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>After his death,<\/b><\/span><span class=\"ko\">그의 죽음 후에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the two sons<\/b><\/span><span class=\"ko\">두 아들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">took their share<\/span><\/b><\/span><span class=\"ko\">자신들의 몫을 챙겼다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">of the father’s wealth<\/span><\/b><\/span><span class=\"ko\">아버지의 재산의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and settled<\/span><\/b><\/span><span class=\"ko\">그리고 정착했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in different cities<\/span>.<\/b><\/span><span class=\"ko\">다른 도시들에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그의 죽음 후에, 두 아들은 아버지의 재산 중 자신들의 몫을 가지고 다른 도시에 정착했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이야기의 배경을 설정하는 문장으로, 아버지가 남긴 유산을 통해 두 형제가 경제적으로 독립하여 각자의 삶을 시작했음을 보여줍니다. took their share of the father’s wealth는 정해진 몫에 따라 유산을 분배받아 각자 자립할 수 있는 초기 자금을 마련했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">took their share of the father’s wealth and settled in different cities 병렬 구조: 등위접속사 and를 통해 두 개의 과거형 동사 took과 settled가 병렬로 연결되어 주어인 the two sons에 공통으로 걸리는 술어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">몫, 지분<\/td><\/tr><tr><td class=\"w\">wealth<\/td><td class=\"m\">재산, 부<\/td><\/tr><tr><td class=\"w\">settle in<\/td><td class=\"m\">~에 정착하다, ~에 자리를 잡다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Five years <span class=\"grammar-hl\">passed<\/span>.<\/b><\/span><span class=\"ko\">5년이 지났다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">5년이 지났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 독립 이후 결과가 나타나기에 충분한 시간이 흘렀음을 암시하며, 두 형제의 서로 다른 행보가 극명하게 갈리는 전환점 역할을 합니다. Five years passed는 일시적인 상황이 아니라 장기적인 생활 방식이나 선택이 굳어져 그 결실이나 대가가 드러날 시점이 되었음을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">passed (자동사): &#39;시간이 흐르다&#39;라는 의미의 완전자동사로 쓰여 별도의 목적어나 보어 없이 주어(Five years)와 함께 1형식 문장 구조를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass<\/td><td class=\"m\">(시간이) 흐르다, 경과하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Puru,<\/b><\/span><span class=\"ko\">Puru는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who had been following his father’s words carefully<\/span>,<\/b><\/span><span class=\"ko\">아버지의 말을 신중히 따르고 있었던,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">had no money left<\/span>.<\/b><\/span><span class=\"ko\">남은 돈이 없었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아버지의 말을 신중히 따라온 Puru는 남은 돈이 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 착하고 성실하게 살았던 인물이 경제적 곤경에 처했다는 의외의 결과를 제시하며 독자의 궁금증을 자아냅니다. following his father’s words carefully는 푸루가 아버지의 가르침을 글자 그대로 믿고 실천하는 도덕적이고 순종적인 삶을 살았음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who had been following his father’s words carefully (관계대명사): 주격 관계대명사 who가 선행사 Puru를 부연 설명하는 계속적 용법으로 쓰였다. 관계대명사 뒤에는 주어가 빠진 불완전한 절이 이어지며 선행사를 수식한다.<\/div><div class=\"lec-gr-item\">had been following (과거완료진행): had been + -ing 형태로 과거의 특정 기준 시점 이전부터 그 시점까지 동작이 계속해서 진행되었음을 나타낸다.<\/div><div class=\"lec-gr-item\">had no money left 5형식(SVOC) 구조: 동사(had) + 목적어(no money) + 목적격보어(left) 구조다. 목적어인 money와 보어인 left가 &#39;돈이 남겨지다&#39;라는 수동 관계이므로 과거분사(p.p.) 형태인 left가 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">word<\/td><td class=\"m\">말, 가르침, 조언<\/td><\/tr><tr><td class=\"w\">have no money left<\/td><td class=\"m\">돈이 하나도 남지 않다, 돈이 다 떨어지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But his brother<\/b><\/span><span class=\"ko\">그러나 그의 형제는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>was <span class=\"grammar-hl\">richer<\/span><\/b><\/span><span class=\"ko\">더 부유했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">than ever<\/span>.<\/b><\/span><span class=\"ko\">그 어느 때보다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 그의 형제는 그 어느 때보다 더 부자가 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 푸루의 빈곤과 형의 성공을 극명하게 대비시켜 형제 사이에 삶을 대하는 방식이나 가르침을 해석하는 방식에 차이가 있었음을 암시합니다. richer than ever는 형이 단순히 재산을 유지하는 수준을 넘어, 아버지가 물려준 자산을 활용해 엄청난 부의 증식을 이루어냈음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">richer than ever (비교급): 형용사 rich의 비교급 richer와 than ever(그 어느 때보다)가 결합되어 최상급의 의미를 강조하는 비교 표현이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Puru<\/b><\/span><span class=\"ko\">Puru는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">was puzzled<\/span><\/b><\/span><span class=\"ko\">어리둥절했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about <span class=\"grammar-hl\">where he had gone wrong<\/span>,<\/b><\/span><span class=\"ko\">그가 어디서 잘못했는지에 대해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so he visited Puneet<\/b><\/span><span class=\"ko\">그래서 그는 Puneet을 방문했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to find out<\/span>.<\/b><\/span><span class=\"ko\">알아내기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Puru는 그가 어디서부터 잘못했는지 어리둥절했고, 그래서 그는 (그것을) 알아내기 위해 Puneet을 방문했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신의 도덕적 신념과 현실의 실패 사이에서 오는 괴리를 해결하기 위해 조력자를 찾아가는 장면입니다. puzzled about where he had gone wrong은 가르침대로 살았음에도 실패한 상황에 대해 깊은 혼란을 느끼고 있으며, 자신의 판단이나 실천 방식에 근본적인 오류가 있었음을 직감하고 조언을 구하려 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was puzzled (수동태): be동사(was)+p.p.(puzzled) 구조. puzzle은 &#39;당황하게 하다&#39;라는 뜻의 타동사인데 뒤에 목적어가 없어서 수동구조 was puzzled 형태로 쓴다. 기본구조: puzzle + O<\/div><div class=\"lec-gr-item\">where he had gone wrong (간접의문문): [의문사(where) + 주어(he) + 동사(had gone)] 어순의 명사절로, 전치사 about의 목적어 역할을 하는 구조다.<\/div><div class=\"lec-gr-item\">to find out (to부정사(부사적): 목적): &#39;~하기 위해서&#39;라는 목적의 의미를 나타내며, in order to find out으로 바꾸어 쓸 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">puzzled<\/td><td class=\"m\">어리둥절한, 당혹스러운<\/td><\/tr><tr><td class=\"w\">go wrong<\/td><td class=\"m\">잘못되다, 실수를 저지르다<\/td><\/tr><tr><td class=\"w\">find out<\/td><td class=\"m\">알아내다, 확인하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>아버지가 사망한 후 두 아들은 유산을 나누어 각자 다른 도시로 떠나 정착했다.<\/li><li>5년의 세월이 흐른 뒤, 아버지의 유훈을 성실히 지킨 푸루는 전 재산을 잃었다.<\/li><li>반면, 푸루의 형은 이전보다 훨씬 더 큰 부를 쌓으며 성공적인 삶을 살고 있었다.<\/li><li>자신의 실패에 의문을 품은 푸루는 원인을 찾기 위해 지혜로운 인물인 푸니트를 방문했다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Although Puru became penniless by strictly following his father’s advice, his brother Puneet grew significantly wealthier during the same period.<\/div>\n              <div class=\"lec-final-sum-ko\">푸루는 아버지의 조언을 엄격히 지키다 전재산을 잃었지만, 그의 형제 푸닛은 같은 기간 동안 훨씬 더 큰 부를 축적했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio"
