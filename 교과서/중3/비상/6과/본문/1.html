RgDGPz/AK8e9HTHue4HH15I+pPA7Glzx7/gws33b6/hq/LVf0tQ8kn/ADj9fxPrjJPFJ6fh/k/Xv0/Cl7DIPp16HPOPzH5ng0hIPA9jyP8A9ePz7c+xzR7/ANaf5/n2FZ6b7afht83/AFqGRz0449cH9Px9OnbNNYZVumcZGfp39+3fj24pR+GO2OO5/T+f06ocDJHU/T1+o68g/TPJzWNWa6d9NOml+ib7X9LLQunBykkr2ur/AHp/JXd72t6n/9k=\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">A Father’s Final Wisdom: Cryptic Words for Happiness<small>아버지의 마지막 지혜: 행복을 위한 수수께끼 같은 말들<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 이야기는 비유(Metaphor)를 통해 삶의 지혜를 전달하는 전형적인 지혜 문학(Wisdom Literature)의 형식을 취하고 있습니다. 지문을 제대로 이해하기 위해서는 겉으로 드러난 문장을 문자 그대로의 해석(Literal Interpretation)으로 받아들이기보다, 그 속에 숨겨진 함축적 의미(Implicit Meaning)를 파악하는 태도가 무엇보다 중요합니다. 예를 들어, 모든 도시에 집을 지으라는 말은 실제 부동산을 사라는 뜻이 아니라 어디서든 환영받을 수 있도록 인적 네트워크(Human Network)를 잘 형성하라는 의미로 풀이될 수 있는데, 이는 현대 사회의 사회적 자본(Social Capital) 개념과도 맞닿아 있습니다. 마치 수수께끼를 풀듯 단어 너머의 진정한 의도를 고민하며 읽어본다면, 겉으로 보이는 경제적 가치(Economic Value)보다 훨씬 더 깊은 인생의 통찰(Life Insight)을 발견하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01임종 전의 소집<\/div><ul><li>지혜롭고 부유한 아버지가 죽음을 앞두고 두 아들에게 마지막 가르침을 주고자 한다.<\/li><li>등장인물: 아버지와 두 아들 푸루(Puru)와 푸닛(Puneet)<\/li><li>목적: 일생 동안 행복(happy)하게 살기 위한 조언 전달<\/li><li>핵심 키워드: 마지막 조언(last words of advice)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수수께끼 같은 지침<\/div><ul><li>아버지는 아들들이 평생 실천해야 할 네 가지 구체적인 행동 지침을 일러준다.<\/li><li>모든 도시에 집을 짓고(Build a house) 편안하게 잠잘 것<\/li><li>음식을 즐기고 부자처럼 돈을 쓸 것(Spend money like a rich man)<\/li><li>핵심 키워드: 네 가지 지침(four instructions)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03설명 없는 마무리<\/div><ul><li>조언에 담긴 속뜻을 충분히 설명하지 못한 상태에서 아버지는 갑자기 숨을 거둔다.<\/li><li>조언의 의미를 설명(explain)하기 직전에 사망함<\/li><li>아들들에게 남겨진 해석의 여지<\/li><li>핵심 키워드: 갑작스러운 죽음(passed away)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise<\/td><td class=\"m\">지혜로운<\/td><\/tr><tr><td class=\"w\">pass away<\/td><td class=\"m\">돌아가시다, 죽다<\/td><\/tr><tr><td class=\"w\">advice<\/td><td class=\"m\">조언, 충고<\/td><\/tr><tr><td class=\"w\">live by<\/td><td class=\"m\">~에 따라 살다, ~을 생활 신조로 삼다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">word<\/td><td class=\"m\">(약속·명령·유언 등의) 말, 좌우명<\/td><\/tr><tr><td class=\"w\">comfortably<\/td><td class=\"m\">편안하게<\/td><\/tr><tr><td class=\"w\">lastly<\/td><td class=\"m\">마지막으로<\/td><\/tr><tr><td class=\"w\">explain oneself<\/td><td class=\"m\">(자신의 말의) 뜻을 해명하다, 설명하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A rich and wise father<\/b><\/span><span class=\"ko\">부유하고 지혜로운 아버지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>had two sons,<\/b><\/span><span class=\"ko\">두 아들이 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Puru and Puneet<\/span>.<\/b><\/span><span class=\"ko\">Puru와 Puneet이라는<\/span><\/div><\/div><div class=\"lec-sent-ko\">부유하고 지혜로운 아버지에게 두 아들, Puru와 Puneet이 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이야기의 시작으로 인물들의 특징과 관계를 설정합니다. 아버지가 rich and wise하다는 설정은 뒤에 이어질 조언들이 단순한 금전적 지침을 넘어선 삶의 통찰을 담고 있음을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Puru and Puneet (동격): 명사(two sons) 뒤에서 쉼표(,)를 통해 해당 명사가 구체적으로 누구인지를 보충 설명하는 명사구이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise<\/td><td class=\"m\">지혜로운<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Before he <span class=\"grammar-hl\">passed away<\/span>,<\/b><\/span><span class=\"ko\">그가 돌아가시기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he called his two sons<\/b><\/span><span class=\"ko\">그는 그의 두 아들을 불렀다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to give<\/span> them some last words of advice.<\/b><\/span><span class=\"ko\">그들에게 몇 마디 마지막 충고의 말을 해주기 위해<\/span><\/div><\/div><div class=\"lec-sent-ko\">아버지는 돌아가시기 전에, 마지막 충고의 말을 하기 위해 그의 두 아들을 불렀다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아버지의 죽음이 임박했음을 알리며 긴박함을 더합니다. 여기서 last words of advice는 아들들에게 남기는 가장 정제되고 중요한 인생의 지침이라는 무게감을 가집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">passed away (관용표현): &#39;죽다&#39; 혹은 &#39;세상을 떠나다&#39;라는 의미를 가진 구동사(phrasal verb)로, die의 완곡한 표현이다.<\/div><div class=\"lec-gr-item\">to give (to부정사(부사적): 목적): &#39;주기 위해서&#39;라는 의미로 해석되며, in order to give로 바꾸어 써도 문맥상 뜻이 통하므로 부사적 용법 중 목적에 해당한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass away<\/td><td class=\"m\">돌아가시다, 죽다<\/td><\/tr><tr><td class=\"w\">advice<\/td><td class=\"m\">조언, 충고<\/td><\/tr><tr><td class=\"w\">word<\/td><td class=\"m\">(약속·명령·유언 등의) 말, 좌우명<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">Listen carefully<\/span>,<\/b><\/span><span class=\"ko\">“주의 깊게 들어라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>my dear sons.<\/b><\/span><span class=\"ko\">사랑하는 내 아들들아.<\/span><\/div><\/div><div class=\"lec-sent-ko\">“주의 깊게 듣거라, 사랑하는 아들들아.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이어질 내용에 대해 아들들의 주의를 집중시키는 도입부입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Listen carefully (명령문): 동사원형(Listen)으로 시작하여 상대방에게 주의를 기울일 것을 요구하는 문장 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Live by<\/span> these words<\/b><\/span><span class=\"ko\">이 말들에 따라 살아라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>throughout your life,<\/b><\/span><span class=\"ko\">너희의 일생 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and you will be happy,”<\/b><\/span><span class=\"ko\">그러면 너희는 행복해질 것이다,”<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he said.<\/b><\/span><span class=\"ko\">그가 말했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">너희의 일생 동안 이 말대로 살면, 행복해질 것이다.” 그는 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아버지의 가르침이 아들들의 throughout your life, 즉 전 생애를 관통하는 핵심 원칙이 되어야 함을 강조하며, 그 결과로 행복이 따를 것임을 약속합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Live by (관용표현): &#39;~을 지키며 살다&#39; 혹은 &#39;~에 따라 살다&#39;라는 의미로, 특정 원칙이나 조언을 준수함을 뜻한다.<\/div><div class=\"lec-gr-item\">Live ... and 명령문 + and: &#39;A해라, 그러면 B할 것이다&#39;라는 조건을 나타내는 구조로, &#39;이 말들을 지키며 살면 행복해질 것이다&#39;라는 의미를 만든다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">live by<\/td><td class=\"m\">~에 따라 살다, ~을 생활 신조로 삼다<\/td><\/tr><tr><td class=\"w\">word<\/td><td class=\"m\">(약속·명령·유언 등의) 말, 좌우명<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">Build a house<\/span><\/b><\/span><span class=\"ko\">“집을 지어라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in every city.<\/b><\/span><span class=\"ko\">모든 도시에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">“모든 도시에 집을 지어라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 첫 번째 조언입니다. Build a house in every city는 실제로 건물을 지으라는 뜻이 아니라, 어디를 가든 환영받을 수 있도록 도처에 많은 친구와 조력자를 만들라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Build a house (명령문): 주어 없이 동사원형(Build)으로 문장을 시작하여 지시나 조언을 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Sleep comfortably<\/span>.<\/b><\/span><span class=\"ko\">편안하게 자거라.<\/span><\/div><\/div><div class=\"lec-sent-ko\">편하게 자거라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 번째 조언입니다. Sleep comfortably는 좋은 침대를 쓰라는 뜻이 아니라, 하루를 양심껏 성실하게 보내어 마음 편히 깊은 잠에 들 수 있는 상태를 유지하라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Sleep comfortably (명령문): 동사원형(Sleep)을 문두에 두어 편안하게 자라는 권유나 명령의 의미를 전달한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">comfortably<\/td><td class=\"m\">편안하게<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Enjoy your food<\/span>.<\/b><\/span><span class=\"ko\">너희의 음식을 즐겨라.<\/span><\/div><\/div><div class=\"lec-sent-ko\">음식을 즐기거라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 세 번째 조언입니다. Enjoy your food는 값비싼 진미를 찾아다니라는 것이 아니라, 배가 고플 때까지 기다렸다 먹음으로써 어떤 음식이든 감사하고 맛있게 대하라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Enjoy your food (명령문): 동사원형(Enjoy)으로 시작하여 음식을 즐기라는 조언을 나타내는 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Lastly,<\/b><\/span><span class=\"ko\">마지막으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">spend money<\/span><\/b><\/span><span class=\"ko\">돈을 써라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like a rich man... .”<\/b><\/span><span class=\"ko\">부자처럼... .”<\/span><\/div><\/div><div class=\"lec-sent-ko\">마지막으로, 돈을 부자처럼 쓰거라….”<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막 조언입니다. spend money like a rich man은 사치를 부리라는 의미가 아니라, 꼭 필요한 곳과 가치 있는 곳에 품위 있게 돈을 쓸 줄 알아야 한다는 의미입니다. 말줄임표를 통해 설명이 더 이어질 것임을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">spend money (명령문): 동사원형(spend)을 사용하여 돈을 쓰라는 지시를 나타내는 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lastly<\/td><td class=\"m\">마지막으로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Before he could <span class=\"grammar-hl\">explain himself<\/span>,<\/b><\/span><span class=\"ko\">그가 직접 설명할 수 있기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he <span class=\"grammar-hl\">passed away<\/span>.<\/b><\/span><span class=\"ko\">그는 돌아가셨다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아버지는 그 말을 설명하기도 전에 돌아가셨다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이야기의 갈등을 유발하는 결정적인 문장입니다. explain himself, 즉 비유적인 표현들의 진짜 의도를 풀어서 설명해주지 못하고 아버지가 사망함으로써, 아들들이 조언의 의미를 스스로 깨우쳐야 하는 숙제를 남깁니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">explain himself (재귀대명사): 타동사 explain의 목적어로 주어(he)와 동일한 대상을 가리키는 himself가 쓰였으며, &#39;자신의 의도를 설명하다&#39;라는 의미로 해석된다.<\/div><div class=\"lec-gr-item\">passed away (관용표현): &#39;세상을 떠나다&#39;라는 의미의 완곡한 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass away<\/td><td class=\"m\">돌아가시다, 죽다<\/td><\/tr><tr><td class=\"w\">explain oneself<\/td><td class=\"m\">(자신의 말의) 뜻을 해명하다, 설명하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>부유하고 지혜로운 아버지가 죽기 전 두 아들에게 네 가지 함축적인 조언을 남긴다.<\/li><li>조언의 내용은 모든 도시에 집 짓기, 편안한 잠, 음식 즐기기, 부자처럼 돈 쓰기이다.<\/li><li>아버지는 각 조언에 담긴 실제 의미를 설명하지 못한 채 갑작스럽게 세상을 떠난다.<\/li><li>이 글은 아버지가 던진 비유적인 지침과 그 속에 담긴 지혜를 아들들이 어떻게 받아들일지에 대한 궁금증을 자아낸다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">A wise father leaves his sons with metaphorical instructions for a happy life but passes away before clarifying the true intention of his words.<\/div>\n              <div class=\"lec-final-sum-ko\">지혜로운 아버지가 아들들에게 행복한 삶을 위한 은유적인 지침을 남기지만 그 말의 진정한 의미를 설명하기 전에 숨을 거둔다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_aud
