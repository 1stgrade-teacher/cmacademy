 풍요로움은 소유가 아닌 관계와 태도에서 비롯된다는 인문학적 통찰을 제공합니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지혜의 재해석<\/div><ul><li>푸닛은 아버지의 가르침을 형과는 다른 관점으로 이해하고 실천했음을 밝힌다.<\/li><li>아버지의 지혜(father’s wisdom)를 계승함<\/li><li>자신만의 방식(differently)으로 가르침을 이해함<\/li><li>핵심 키워드: 이해(understand)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02진정한 우정의 집<\/div><ul><li>모든 도시에 집을 짓는 대신, 진정한 친구를 사귀어 머물 곳을 마련했다.<\/li><li>집 짓기(build a house)를 인간관계 형성으로 해석함<\/li><li>모든 도시에서 친구(friends)를 사귐<\/li><li>방문 시 친구의 집(houses)에 머물며 환대받음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03노력 끝의 편안한 잠<\/div><ul><li>힘든 노동 후에 얻는 휴식이 무엇보다 편안한 잠자리가 됨을 강조한다.<\/li><li>고된 하루의 일(hard day’s work)을 마친 뒤의 피로<\/li><li>장소에 상관없이 편안히 숙면(sleep comfortably)함<\/li><li>침대나 딱딱한 바닥(hard floor) 등의 환경에 구애받지 않음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04배고픔이라는 최고의 소스<\/div><ul><li>진정한 식사의 즐거움은 화려한 음식이 아닌 절제와 배고픔에서 온다.<\/li><li>배가 고플 때만(only when hungry) 식사함<\/li><li>소박한 식사(simple meal)에서도 훌륭한 맛을 느낌<\/li><li>핵심 키워드: 맛(taste)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wisdom<\/td><td class=\"m\">지혜, 현명함<\/td><\/tr><tr><td class=\"w\">take ... as<\/td><td class=\"m\">~을 ...라고 이해하다, ~을 ...로 받아들이다<\/td><\/tr><tr><td class=\"w\">all around the world<\/td><td class=\"m\">전 세계에, 세계 도처에<\/td><\/tr><tr><td class=\"w\">make friends<\/td><td class=\"m\">친구를 사귀다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay at<\/td><td class=\"m\">~에 머무르다, ~에 숙박하다<\/td><\/tr><tr><td class=\"w\">comfortably<\/td><td class=\"m\">편안하게<\/td><\/tr><tr><td class=\"w\">hard day&#39;s work<\/td><td class=\"m\">고된 하루의 일<\/td><\/tr><tr><td class=\"w\">it does not matter<\/td><td class=\"m\">상관없다, 중요하지 않다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Puneet <span class=\"grammar-hl\">smiled and said<\/span>,<\/b><\/span><span class=\"ko\">Puneet은 웃으며 말했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“My dear brother,<\/b><\/span><span class=\"ko\">“친애하는 형님<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I also followed<\/b><\/span><span class=\"ko\">저 또한 따랐습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>our father’s wisdom.<\/b><\/span><span class=\"ko\">우리 아버지의 지혜를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Puneet은 웃으며 말했다, “친애하는 형님, 저 또한 우리 아버지의 지혜를 따랐습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 형이 자신의 방식대로 아버지의 유언을 실천한 이야기를 마친 상황에서, Puneet이 대화를 이어받는 장면입니다. followed our father’s wisdom은 아버지가 남긴 수수께끼 같은 조언을 문자 그대로 받아들인 것이 아니라 그 속에 담긴 참뜻을 찾아내어 삶에 적용했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">smiled and said 병렬 구조: 등위접속사 and를 사용하여 주어 Puneet의 동작을 나타내는 두 과거 동사 smiled와 said를 대등하게 연결하고 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wisdom<\/td><td class=\"m\">지혜, 현명함<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But I <span class=\"grammar-hl\">understood it<\/span><\/b><\/span><span class=\"ko\">하지만 저는 그것을 이해했습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">a bit differently<\/span>.<\/b><\/span><span class=\"ko\">조금 다르게.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 저는 조금 다르게 이해했지요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 형의 방식과 자신의 방식이 근본적으로 차이가 있음을 예고하며 대화의 흐름을 전환합니다. understood it a bit differently는 아버지가 전해준 지혜를 해석하는 관점이 형과는 달랐음을 강조하며, 이후 이어질 Puneet만의 현명한 통찰을 기대하게 만듭니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">understood it a bit differently 부사의 수식: 부사 differently가 동사 understood를 수식하며, a bit은 부사구로서 부사 differently를 수식하여 &#39;약간 다르게&#39;라는 의미를 만든다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When he said<\/b><\/span><span class=\"ko\">아버지가 말씀하셨을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>‘build a house in every city,’<\/b><\/span><span class=\"ko\">‘모든 도시에 집을 지어라’라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I took it<\/b><\/span><span class=\"ko\">저는 그것을 여겼습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as <span class=\"grammar-hl\">having<\/span> <span class=\"grammar-hl\">a place to stay<\/span><\/b><\/span><span class=\"ko\">머물 수 있는 장소를 가지는 것으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>all around the world.<\/b><\/span><span class=\"ko\">전 세계에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아버지가 ‘모든 도시에 집을 지어라’라고 말했을 때, 저는 그것을 전 세계에 머물 수 있는 장소를 가지는 것으로 여겼지요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아버지의 조언 중 첫 번째 항목에 대한 Puneet의 구체적인 해석을 보여줍니다. took it as having a place to stay는 실제로 모든 도시에 건물을 짓는 토목 공사를 하라는 뜻이 아니라, 어디를 가든 나를 환영해 줄 사람이나 환경을 미리 만들어 두라는 비유적인 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">having (동명사): 전치사 as의 목적어 자리에서 &#39;가지는 것&#39;이라는 명사 역할을 수행한다.<\/div><div class=\"lec-gr-item\">a place to stay (to부정사(형용사적)): 명사 a place 뒤에서 이를 수식하며, &#39;머무를 장소&#39;라는 의미를 나타낸다. &#39;a place that I can stay in&#39;과 같이 관계사절로 전환 가능하므로 형용사적 용법에 해당한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all around the world<\/td><td class=\"m\">전 세계에, 세계 도처에<\/td><\/tr><tr><td class=\"w\">stay at<\/td><td class=\"m\">~에 머무르다, ~에 숙박하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>So I <span class=\"grammar-hl\">made friends<\/span><\/b><\/span><span class=\"ko\">그래서 저는 친구들을 사귀었습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in every city<\/b><\/span><span class=\"ko\">모든 도시에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and I stayed<\/b><\/span><span class=\"ko\">그리고 저는 머물렀습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at their houses<\/b><\/span><span class=\"ko\">그들의 집에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when I visited those cities.<\/b><\/span><span class=\"ko\">제가 그 도시들을 방문했을 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그래서 저는 모든 도시에서 친구를 사귀었고 그 도시들을 방문했을 때 그들의 집에 머물렀어요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 해석을 바탕으로 실천한 구체적인 행동을 설명합니다. made friends in every city는 막대한 돈과 시간을 들여 부동산을 소유하는 대신, 진실한 인간관계를 맺음으로써 실질적인 거처를 확보했다는 지혜로운 대처를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">made friends (관용표현): &#39;친구를 사귀다&#39;라는 뜻의 숙어로, make라는 동사와 friends라는 명사가 결합하여 굳어진 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make friends<\/td><td class=\"m\">친구를 사귀다<\/td><\/tr><tr><td class=\"w\">stay at<\/td><td class=\"m\">~에 머무르다, ~에 숙박하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Also, I slept comfortably<\/b><\/span><span class=\"ko\">또한, 저는 편안하게 잠을 잤습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>each night<\/b><\/span><span class=\"ko\">매일 밤<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because I would be tired<\/b><\/span><span class=\"ko\">제가 피곤해지곤 했기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after a hard day’s work,<\/b><\/span><span class=\"ko\">하루 종일 열심히 일하고 나서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">it did not matter<\/span><\/b><\/span><span class=\"ko\">그리고 그것은 상관없었습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">if I was sleeping<\/span><\/b><\/span><span class=\"ko\">제가 자고 있는지 아닌지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on a bed or on the hard floor.<\/b><\/span><span class=\"ko\">침대에서 혹은 딱딱한 바닥에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">또한, 저는 하루 종일 열심히 일하고 나서 피곤해지곤 했기 때문에 침대에서 자든 딱딱한 바닥에서 자든 상관없이 매일 밤 편안하게 잠을 잤지요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> &#39;매일 밤 편안한 잠자리를 마련하라&#39;는 아버지의 또 다른 가르침을 어떻게 실천했는지 설명합니다. did not matter if I was sleeping on a bed or on the hard floor는 잠자리의 안락함이 값비싼 가구나 환경에 있는 것이 아니라, 정직하고 성실한 노동 뒤에 찾아오는 자연스러운 휴식에 달려 있다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">it did not matter if I was sleeping (가주어): 진주어: 대명사 it이 가주어 자리에 쓰였으며, 접속사 if가 이끄는 절(if I was sleeping...)이 문장의 진짜 주어인 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">was sleeping (과거진행): be동사(was) + 현재분사의 결합으로, 과거의 특정 시점에 진행 중이었던 동작을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">comfortably<\/td><td class=\"m\">편안하게<\/td><\/tr><tr><td class=\"w\">hard day&#39;s work<\/td><td class=\"m\">고된 하루의 일<\/td><\/tr><tr><td class=\"w\">it does not matter<\/td><td class=\"m\">상관없다, 중요하지 않다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I ate<\/b><\/span><span class=\"ko\">저는 먹었습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>only when I was hungry,<\/b><\/span><span class=\"ko\">오직 제가 배고플 때만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so even a simple meal<\/b><\/span><span class=\"ko\">그래서 간단한 식사마저도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">tasted great<\/span>.”<\/b><\/span><span class=\"ko\">훌륭한 맛이 났습니다.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">저는 배고플 때만 먹었기 때문에 간단한 식사마저도 훌륭한 맛이 났습니다.”<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> &#39;항상 맛있는 음식을 먹으라&#39;는 조언에 대한 해석으로 이야기를 마무리합니다. even a simple meal tasted great은 비싼 산해진미를 찾아다니는 노력이 아니라, 절제와 시장기라는 본연의 감각을 통해 일상의 평범한 음식에서도 최고의 만족과 기쁨을 느낄 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">tasted great 2형식(SVOC) 구조: 감각동사 taste 뒤에 형용사 great가 주격 보어로 쓰인 구조다. 주어(a simple meal)의 상태를 설명하며 &#39;훌륭한 맛이 났다&#39;는 의미를 형성한다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>Puneet은 아버지의 유언을 형과는 다른 비유적이고 지혜로운 관점에서 해석했다.<\/li><li>&#39;도시마다 집을 지으라&#39;는 조언을 건물을 세우는 대신 &#39;어디서든 환영받는 인간관계&#39;를 맺는 것으로 실천했다.<\/li><li>&#39;편안한 잠자리&#39;는 비싼 침대가 아니라 &#39;하루의 성실한 노동&#39; 끝에 얻는 숙면임을 보여주었다.<\/li><li>&#39;맛있는 음식&#39;은 값비싼 재료가 아니라 &#39;배고픔과 절제&#39;를 통해 느낄 수 있는 소박한 즐거움임을 깨달았다.<\/li><li>결국 진정한 유산은 물질적인 풍요가 아니라 사물을 바라보는 지혜로운 태도에 있음을 시사한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Puneet fulfilled his father’s advice by prioritizing human connections and physical discipline over the pursuit of material possessions.<\/div>\n              <div class=\"lec-final-sum-ko\">푸니트는 물질적 소유를 추구하는 대신 인간관계와 신체적 단련을 우선시함으로써 아버지의 조언을 이행했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":"main"},{"audio":"./4_audio/13.mp3","hl":"meaning"},{"audio":"./4_audio/14.mp3","hl":"grammar"}],[{"audio":"./4_audio/15.mp3","hl":"main"},{"audio":"./4_audio/16.mp3","hl":"meaning"},{"audio":"./4_audio/17.mp3","hl":"grammar"}],[{"audio":"./4_audio/18.mp3","hl":"main"},{"audio":"./4_audio/19.mp3","hl":"meaning"},{"audio":"./4_audio/20.mp3","hl":"grammar"}],[{"audio":"./4_audio/21.mp3","hl":"main"},{"audio":"./4_audio/22.mp3","hl":"meaning"},{"audio":"./4_audio/23.mp3","hl":"grammar"}],[{"audio":"./4_audio/24.mp3","hl":"main"},{"audio":"./4_audio/25.mp3","hl":"meaning"},{"audio":"./4_audio/26.mp3","hl":"grammar"}],[{"audio":"./4_audio/27.mp3","hl":null}]],"fileName":"중3 비상_중3 비상(홍)_6과 본문4_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"중3 비상 / 중3 비상(홍) / 6과 본문4","titleEn":"True Wealth: Puneet’s Practical Interpretation of Wisdom","titleKo":"진정한 부: 지혜에 대한 푸니트의 실천적 해석","imageUrl":"__enpImg__","stages":[{"label":"01지혜의 재해석","items":["푸닛은 아버지의 가르침을 형과는 다른 관점으로 이해하고 실천했음을 밝힌다.","아버지의 지혜(father’s wisdom)를 계승함","자신만의 방식(differently)으로 가르침을 이해함","핵심 키워드: 이해(understand)"]},{"label":"02진정한 우정의 집","items":["모든 도시에 집을 짓는 대신, 진정한 친구를 사귀어 머물 곳을 마련했다.","집 짓기(build a house)를 인간관계 형성으로 해석함","모든 도시에서 친구(friends)를 사귐","방문 시 친구의 집(houses)에 머물며 환대받음"]},{"label":"03노력 끝의 편안한 잠","items":["힘든 노동 후에 얻는 휴식이 무엇보다 편안한 잠자리가 됨을 강조한다.","고된 하루의 일(hard day’s work)을 마친 뒤의 피로","장소에 상관없이 편안히 숙면(sleep comfortably)함","침대나 딱딱한 바닥(hard floor) 등의 환경에 구애받지 않음"]},{"label":"04배고픔이라는 최고의 소스","items":["진정한 식사의 즐거움은 화려한 음식이 아닌 절제와 배고픔에서 온다.","배가 고플 때만(only when hungry) 식사함","소박한 식사(simple meal)에서도 훌륭한 맛을 느낌","핵심 키워드: 맛(taste)"]}],"bkg":"이 지문은 지혜로운 조언을 문자 그대로 받아들이지 않고 삶의 철학으로 재해석하는 비유적 사고(Metaphorical Thinking)의 중요성을 잘 보여줍니다. 푸닛이 도시마다 친구를 사귀어 머물 곳을 마련한 전략은 현대 사회의 사회적 자본(Social Capital) 개념과 연결되는데, 이는 물질적 자산보다 사람 사이의 신뢰와 네트워크가 더 큰 가치를 발휘할 수 있음을 시사합니다. 또한 배가 고플 때 음식이 가장 맛있다는 깨달음은 시장이 반찬(Hunger is the best sauce)이라는 격언처럼, 우리의 신체적 상태가 외부 자극을 받아들이는 방식에 영향을 주는 감각 적응(Sensory Adaptation) 원리와도 맞닿아 있습니다. 결국 같은 상황도 어떻게 정의하느냐에 따라 삶의 질이 달라진다는 인지적 프레이밍(Cognitive Framing) 효과를 통해, 진정한 풍요로움은 소유가 아닌 관계와 태도에서 비롯된다는 인문학적 통찰을 제공합니다.","ttsText":"이 지문은 지혜로운 조언을 문자 그대로 받아들이지 않고 삶의 철학으로 재해석하는 비유적 사고(Metaphorical Thinking)의 중요성을 잘 보여줍니다. 푸닛이 도시마다 친구를 사귀어 머물 곳을 마련한 전략은 현대 사회의 사회적 자본(Social Capital) 개념과 연결되는데, 이는 물질적 자산보다 사람 사이의 신뢰와 네트워크가 더 큰 가치를 발휘할 수 있음을 시사합니다. 또한 배가 고플 때 음식이 가장 맛있다는 깨달음은 시장이 반찬(Hunger is the best sauce)이라는 격언처럼, 우리의 신체적 상태가 외부 자극을 받아들이는 방식에 영향을 주는 감각 적응(Sensory Adaptation) 원리와도 맞닿아 있습니다. 결국 같은 상황도 어떻게 정의하느냐에 따라 삶의 질이 달라진다는 인지적 프레이밍(Cognitive Framing) 효과를 통해, 진정한 풍요로움은 소유가 아닌 관계와 태도에서 비롯된다는 인문학적 통찰을 제공합니다.","__passage":"중3 비상 / 중3 비상(홍) / 6과 본문4","__sourcePassage":"중3 비상 / 중3 비상(홍) / 6과 본문4","__script":"자, 오늘 우리가 함께 공부할 지문은 '중3 비상 / 중3 비상(홍) / 6과 본문4' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"중3 비상 / 중3 비상(홍) / 6과 본문4","titleEn":"True Wealth: Puneet’s Practical Interpretation of Wisdom","titleKo":"진정한 부: 지혜에 대한 푸니트의 실천적 해석","imageUrl"
