<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 8과 본문1","audioDir":"1_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 8과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Vastness of Space: Why Light Speed Isn't Enough\u003c/h1>\u003ch2>우주의 광활함: 빛의 속도만으론 부족한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우주에서 가장 빠른 \u003cb class=\"key\">빛의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 이동하더라도, 우주가 너무나 \u003cb class=\"key\">광활하기\u003c/b> 때문에 다른 행성에 도달하는 데는 여전히 긴 시간이 걸립니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Despite the extreme speed of light, the immense scale of the universe makes interstellar travel a time-consuming journey.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 3학년 비상 교과서 8과의 첫 번째 본문을 함께 공부해보겠습니다. 이번 지문은 우리가 꿈꾸는 우주여행과 그 뒤에 숨겨진 차가운 과학적 현실에 대해 이야기하고 있어요. 우주에서 가장 빠른 빛의 속도로 여행하면 어떤 일이 벌어질지, 그리고 왜 우리가 생각만큼 빨리 다른 행성에 갈 수 없는지 그 요지를 파악하는 것이 핵심입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우주는 우리가 상상하는 것보다 훨씬 더 \u003cb class=\"key\">광활한 \u003c/b>\u003cb class=\"key\">공간\u003c/b> (vast space)입니다. 빛은 초당 약 30만 킬로미터를 이동하며 물리적으로 \u003cb class=\"key\">우주의 \u003c/b>\u003cb class=\"key\">한계 \u003c/b>\u003cb class=\"key\">속도\u003c/b> (universal speed limit)라고 불리지만, 행성 간의 거리는 이 속도로도 메우기 힘들 만큼 멉니다. 이것은 마치 아주 빠른 \u003cb class=\"key\">치타\u003c/b>가 지구를 한 바퀴 도는 것과, 개미가 거대한 사막을 건너는 속도 차이와 비슷합니다. 영화 \u003cb class=\"key\">패신저스\u003c/b> (Passengers)는 이러한 천문학적 거리를 극복하기 위해 승객들이 \u003cb class=\"key\">동면\u003c/b> (hibernation) 상태로 여행하는 현실적인 고민을 담고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 알아볼까요? 우주는 영어로 Vast space, 즉 정말 광활한 공간입니다. 우주의 한계 속도라고 불리는 Speed of light, 빛의 속도는 초당 30만 킬로미터나 되지만, 우주적인 관점에서는 이조차도 아주 느리게 느껴질 수 있어요. 마치 아주 빠른 치타가 사막을 건너는 것과 같죠. 오늘 지문에 나오는 영화 Passengers, 패신저스도 이런 먼 거리를 이동하기 위해 인간이 잠을 자야만 하는 현실을 잘 보여준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우주여행의 도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>독자들에게 과학 팬이라 인사하며 오늘 다룰 주제인 \u003cb class=\"key\">우주여행\u003c/b> (space travel)을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>빛의 속도와 기대\u003csmall>통념 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>우주에서 가장 빠른 \u003cb class=\"key\">빛의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 여행한다면 다른 행성에 매우 빨리 도착할 것이라는 \u003cb class=\"key\">기대감\u003c/b>을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>현실적인 한계\u003csmall>반박 · 문장 5\u003c/small>\u003c/h4>\u003cp>우주가 너무나 \u003cb class=\"key\">광활하다\u003c/b> (vast)는 물리적 사실을 언급하며 앞선 상상이 불가능함을 \u003cb class=\"key\">지적\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영화 속의 예시\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>영화 속 우주선이 빛의 절반 속도로 가도 \u003cb class=\"key\">120년\u003c/b>이나 걸린다는 구체적인 \u003cb class=\"key\">사례\u003c/b>를 통해 우주의 크기를 실감하게 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 순서로 전개되는지 문장별로 차근차근 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 사이 틴이라는 화자가 과학 팬들에게 인사하며 오늘 우리가 이야기할 주제인 Space travel, 즉 우주여행을 소개하며 시작합니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 우리가 흔히 생각하는 기대를 언급해요. 우주에서 빛보다 빠른 것은 없으니, 만약 우리가 빛의 속도로 여행한다면 In the blink of an eye, 눈 깜박할 사이에 다른 행성에 갈 수 있지 않을까 하고 묻습니다.","hl":"f1"},{"n":6,"text":"하지만 다섯 번째 문장에서 닥터 사이가 분위기를 반전시킵니다. 우주가 So vast, 너무 광활해서 그것이 불가능하다고 딱 잘라 말하죠. 여기서 우주의 엄청난 크기가 강조됩니다.","hl":"f2"},{"n":7,"text":"마지막으로 여섯 번째부터 여덟 번째 문장은 구체적인 예시를 들어줍니다. 영화 속 우주선이 빛의 절반 속도로 이동하지만, 실제로는 백이십 년이나 걸려서 승객들이 잠을 자야 한다는 현실적인 사례를 보여주며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반에는 빛의 속도로 빠르게 이동할 수 있을 것이라는 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">상상\u003c/b>을 제시합니다. 그러나 다섯 번째 문장에서 'but'을 사용하여 우주가 너무 \u003cb class=\"key\">광활하다\u003c/b>는 사실을 강조하며 논조를 뒤집습니다. 이후 영화 사례를 통해 그 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">거리감\u003c/b>을 증명하는 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (4)\u003c/b>\u003cspan>앞의 전제에 따른 결과 유추\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>기존 통념에 대한 반전\u003c/span>\u003cb>so ... that (5)\u003c/b>\u003cspan>원인과 결과 강조\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>이론적 예측과 실제 상황의 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">light\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">speed of light\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one-half the speed of light\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">120 years\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>빛의 속도에 대한 기대\u003c/th>\u003cth>우주의 실제 물리적 거리\u003c/th>\u003c/tr>\u003ctr>\u003ctd>눈 깜박할 사이에 도착\u003c/td>\u003ctd>120년 동안 잠을 자야 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 구조는 우리가 흔히 알고 있는 생각에 대해 반박하는 통념 반박 구조를 가지고 있습니다. 특히 글 중간에 핵심 문장이 들어있는 중괄식 패턴을 보여주는데요. 다섯 번째 문장이 바로 이 글의 주인공인 주제문이라고 할 수 있습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 바꿔주는 신호어들을 잘 보세요. 네 번째 문장의 So는 앞의 전제에 대한 결론을 이끌어내고, 다섯 번째 문장의 That would be nice, but은 분위기를 확 반전시키는 역할을 합니다. 또한 so vast that 이라는 표현을 통해 우주가 너무 광활해서 불가능하다는 원인과 결과를 강력하게 연결하고 있죠.","hl":"sg"}]},{"html":"\u003cspan \u003c/div>","segs":[{"n":10,"text":"중요한 단어들도 짚어봅시다. Vast는 광활하다는 뜻으로 우주의 크기를 묘사할 때 필수적인 단어예요. In the blink of an eye는 눈 깜박할 사이라는 아주 짧은 시간을 나타내는 멋진 숙어니 꼭 외워두세요. 그리고 Be expected to는 무엇이 예상된다는 뜻으로 현실적인 예측을 나타낼 때 쓰입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">vast\u003c/b>\u003cspan class=\"m\">광활한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">immense\u003c/span>\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feasible\u003c/span>\u003cspan class=\"s\">achievable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">빨리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expected\u003c/b>\u003cspan class=\"m\">예상되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anticipated\u003c/span>\u003cspan class=\"s\">predicted\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해볼까요? Vast는 Immense나 Enormous와 바꿔 쓸 수 있지만, Tiny나 Narrow와는 반 ..한 것은 아무것도 없다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"As we all know, 우리가 모두 알다시피. there is nothing, 아무것도 없습니다. faster than light, 빛보다 더 빠른 것이. in the universe, 우주에서.. 이 문장 전체를 해석하면, 우리가 모두 알다시피, 우주에서 빛보다 더 빠른 것은 없습니다.","hl":"m"},{"n":18,"text":"모든 사람이 알고 있는 상식을 바탕으로 대화의 전제를 깔고 있어요. 최상급의 의미를 부정어와 비교급을 사용해 강조하는 표현이죠.","hl":"mn"},{"n":19,"text":"어법을 보면, 첫 번째로 As는 우리가 모두 알다시피처럼 상대방도 아는 사실을 언급할 때 쓰는 양태의 접속사예요. 두 번째로 nothing faster than은 직역하면 빛보다 빠른 것이 아무것도 없다는 뜻이지만, 사실상 빛이 우주에서 가장 빠르다는 최상급의 의미를 전달한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 만약 우리가 여행을 한다면\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">travel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛의 속도로\u003c/span>\u003cspan class=\"en\">at the speed of light,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 도달할 수 있어야 해요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> get\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 행성에\u003c/span>\u003cspan class=\"en\">to another planet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈 깜박할 사이에, 그렇죠?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">blink \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">eye\u003c/span>, right?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 만약 우리가 빛의 속도로 여행을 한다면, 우리는 다른 행성에 눈 깜박할 사이에 도달할 수 있어야 해요, 그렇죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빛의 속도로 이동할 때의 \u003cb class=\"key\">장점\u003c/b>을 가정하며 우주여행에 대한 학생의 기대를 드러냅니다. \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 비유적으로 표현하여 호기심을 유발하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : if + 주어 + 현재시제 동사 : \"만약 우리가 여행한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 결합\u003c/span> : should + be able to + 동사원형 : \"~할 수 있어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : in + the blink + of an eye : \"눈 깜박할 사이에\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"So, if we travel, 그래서 만약 우리가 여행을 한다면. at the speed of light, 빛의 속도로. we should be able to get, 우리는 도달할 수 있어야 해요. to another planet, 다른 행성에. in the blink of an eye, right?, 눈 깜박할 사이에, 그렇죠?. 이 문장 전체를 해석하면, 그래서 만약 우리가 빛의 속도로 여행을 한다면, 우리는 다른 행성에 눈 깜박할 사이에 도달할 수 있어야 해요, 그렇죠?","hl":"m"},{"n":21,"text":"이 문장은 빛의 속도로 여행하는 상황을 가정하고 있어요. 눈 깜박할 사이라는 재미있는 비유를 써서 우주여행이 아주 빠를 거라는 기대를 보여주는 장면이죠.","hl":"mn"},{"n":22,"text":"첫 번째로 if we travel 부분은 현재 시제를 사용해서 조건을 걸어주고 있어요. 두 번째로 should be able to는 두 개의 조동사 의미가 합쳐진 형태인데 도달할 수 있어야 한다는 강한 추측을 담고 있습니다. 세 번째로 in the blink of an eye는 아주 짧은 시간을 뜻하는 통째로 외워둘 숙어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dr. Sci: 그렇다면 좋겠지만\u003c/span>\u003cspan class=\"en\">Dr. Sci: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"t 합니다. 이 문장 전체를 해석하면, 영화 \u003c패신저스>에서 다른 행성으로 향하는 우주선이 빛의 속도의 절반으로 이동합니다.","hl":"m"},{"n":27,"text":"영화 속의 예시를 들어서 설명을 더 쉽고 흥미롭게 만들고 있어요. 빛의 절반 속도로 움직이는 우주선이라는 구체적인 상황을 제시하고 있죠.","hl":"mn"},{"n":28,"text":"첫 번째로 a spaceship을 뒤에서 꾸며주는 headed는 어디로 향하는 이라는 뜻의 과거분사입니다. 두 번째로 주어가 우주선 한 대인 단수이기 때문에 travels라는 단수 동사를 썼습니다. 세 번째로 one-half는 절반이라는 뜻으로 그 뒤의 명사의 양을 정해주는 배수 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 \u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주선은 도달해야겠지요 \u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 행성에 \u003c/span>\u003cspan class=\"en\">another planet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 빨리, \u003c/span>\u003cspan class=\"en\">very quickly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇죠?\u003c/span>\u003cspan class=\"en\">right?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 우주선은 다른 행성에 매우 빨리 도달해야겠지요, 그렇죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 빛의 속도 절반으로 이동할 때 독자가 예상할 법한 \u003cb class=\"key\">당연한 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 제시합니다. 상대방에게 \u003cb class=\"key\">동의\u003c/b>를 구하는 부가 의문문을 사용해 다음 문장의 반전 효과를 높입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 추측/기대\u003c/span> : should + [동사원형 (get)] : \"~해야 할 것이다(기대)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어동사(구동사)\u003c/span> : get + [to (전치사)] + [장소] : \"~에 도달하다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"So, 그러면. it should get to, 우주선은 도달해야겠지요. another planet, 다른 행성에. very quickly, 매우 빨리. right?, 그렇죠?. 이 문장 전체를 해석하면, 그러면 우주선은 다른 행성에 매우 빨리 도달해야겠지요, 그렇죠?","hl":"m"},{"n":30,"text":"이 문장은 앞서 나온 빛의 속도 절반이라는 조건이 주어졌을 때 우리가 당연히 기대하게 되는 결과를 말하고 있어요. 독자의 동의를 구하면서 다음 내용에 나올 반전의 궁금증을 자아내는 역할을 하죠.","hl":"mn"},{"n":31,"text":"어법을 보면 첫 번째로 should가 쓰였는데 여기서는 해야 한다는 의무가 아니라 당연히 그럴 것이라는 추측이나 기대를 나타내요. 두 번째로 get to는 어디에 도달하다라는 뜻으로 장소를 나타내는 전치사 to와 함께 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 승객들은 잠을 자게 되는데 \u003c/span>\u003cspan class=\"en\">But, the passengers sleep\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">120년 동안 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for\u003c/span> 120 years\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 예상되기 때문입니다 \u003c/span>\u003cspan class=\"en\">because \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">expected \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그만큼 많은 시간이 걸리는 것으로 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 행성에 도달하는 데.\u003c/span>\u003cspan class=\"en\">to get to a different planet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 승객들은 120년 동안 잠을 자게 되는데, 왜냐하면 다른 행성에 도달하는 데 그만큼 많은 시간이 걸릴 것으로 예상되기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빠른 속도로 가더라도 우주가 너무 넓어 엄청난 시간이 걸린다는 \u003cb class=\"key\">반전\u003c/b>의 사실을 제시합니다. 우주 여행의 \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 구체적인 숫자를 통해 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">기간을 나타내는 전치사\u003c/span> : for + [숫자 포함 기간 (120 years)] : \"~동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 가주어 진주어 구문\u003c/span> : it (가주어) + is expected (수동태) + [to-v (진주어)] : \"~할 것으로 예상되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 소요를 나타내는 take\u003c/span> : take + [시간/노력] : \"그만큼 많은 시간이 걸리다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"But, the passengers sleep, 하지만 승객들은 잠을 자게 되는데. for 120 years, 120년 동안. because it is expected, 왜냐하면 예상되기 때문입니다. to take that much time, 그만큼 많은 시간이 걸리는 것으로. to get to a different planet, 다른 행성에 도달하는 데.. 이 문장 전체를 해석하면, 하지만 승객들은 120년 동안 잠을 자게 되는데, 왜냐하면 다른 행성에 도달하는 데 그만큼 많은 시간이 걸릴 것으로 예상되기 때문입니다.","hl":"m"},{"n":33,"text":"빛의 속도 절반으로 가도 우주가 너무 광활해서 엄청난 시간이 걸린다는 반전의 사실을 보여줘요. 백이십 년이라는 구체적인 숫자를 써서 우주 여행의 현실적 한계를 설명하고 있습니다.","hl":"mn"},{"n":34,"text":"중요한 어법이 많네요. 첫 번째로 숫자 기간인 120 years 앞에는 전치사 for를 써야 합니다. 두 번째로 it is expected to 구문은 가주어 it을 사용해서 무엇인가가 예상된다는 수동태 표현을 만들었어요. 마지막 세 번째로 동사 take는 시간이 걸리다라는 의미로 쓰였고 그 앞의 that much는 그만큼 많은이라는 뜻으로 걸리는 시간을 강조하고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우주에서 \u003cb class=\"key\">빛\u003c/b>보다 더 빠른 존재는 없다는 과학적 사실을 전제로 합니다.\u003c/li>\u003cli>빛의 속도로 이동하면 행성 간 여행이 \u003cb class=\"key\">순식간\u003c/b>에 끝날 것이라 기대하기 쉽습니다.\u003c/li>\u003cli>하지만 우주의 규모가 너무 \u003cb class=\"key\">광활하기\u003c/b> 때문에 빛의 속도로도 이동에 한계가 있습니다.\u003c/li>\u003cli>영화 사례처럼 빛의 절반 속도로 가도 \u003cb class=\"key\">백이십 \u003c/b>\u003cb class=\"key\">년\u003c/b>이나 걸릴 만큼 우주는 매우 멉니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Despite the extreme speed of light, the immense scale of the universe makes interstellar travel a time-consuming journey.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우주에서 가장 빠른 \u003cb class=\"key\">빛의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 이동하더라도, 우주가 너무나 \u003cb class=\"key\">광활하기\u003c/b> 때문에 다른 행성에 도달하는 데는 여전히 긴 시간이 걸립니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자, 오늘 우리는 우주여행이 빛의 속도로도 왜 그렇게 오래 걸리는지 그 이유를 공부했습니다. 핵심은 바로 우주의 광활함이었죠. 오늘 배운 문법 구조와 어휘들을 다시 한번 복습하면서, 여러분의 머릿속에도 우주만큼 넓은 지식이 쌓이길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
