y?</span></b></span></div></div><div class=\"lec-sent-ko\">웜홀: 실제일까, 이론일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학 전문 매체인 &#39;Sci Teen&#39;이 청중에게 친근하게 인사를 건네며 대화를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Wormholes: Fact or Theory? (명사구): Wormholes라는 명사 뒤에 &#39;Fact or Theory?&#39;라는 보충적 명사구가 결합된 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Sci Teen: 안녕하세요, 과학 팬 여러분.</span><span class=\"en\"><b>Sci Teen:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>Hi,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">science fans</span>.</b></span></div></div><div class=\"lec-sent-ko\">Sci Teen: 안녕하세요, 과학 팬 여러분.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학 전문 매체인 &#39;Sci Teen&#39;이 청중에게 친근하게 인사를 건네며 대화를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">science fans 명사 수식: science가 뒤의 명사 fans를 수식하여 &#39;과학 애호가들&#39;이라는 의미를 형성합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 이야기할 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">we’re going to talk</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주여행에 대해.</span><span class=\"en\"><b><span class=\"grammar-hl\">about</span> <span class=\"grammar-hl\">space travel</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘 우리는 우주여행에 대해 이야기할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 다룰 주제가 &#39;우주 여행&#39;임을 명확히 밝히며 독자의 관심을 집중시키고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we’re going to talk about (관용표현): be going to V는 &#39;~할 예정이다&#39;라는 미래의 계획을 나타내는 관용적 구조입니다.</div><div class=\"lec-gr-item\">space travel (명사구): space(공간)가 travel(여행)을 수식하여 &#39;우주 여행&#39;이라는 명사적 개념을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 모두 알다시피,</span><span class=\"en\"><b><span class=\"grammar-hl\">As we all know</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛보다 더 빠른 것은 없습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">there is nothing faster than light</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서.</span><span class=\"en\"><b>in the universe.</b></span></div></div><div class=\"lec-sent-ko\">우리가 모두 알다시피, 우주에서 빛보다 더 빠른 것은 없습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주 물리학의 기본 원칙을 언급하여, 이후 나올 내용의 논리적 기준점인 &#39;광속&#39;을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As we all know (분사구문(대용)): as가 접속사로 사용되어 &#39;우리가 모두 아는 바와 같이&#39;라는 의미로 절 전체를 이끌고 있습니다.</div><div class=\"lec-gr-item\">there is nothing faster than light (비교구문): -thing으로 끝나는 대명사는 형용사가 뒤에서 수식하며, 비교급 표현인 &#39;faster than&#39;과 결합되어 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 여행을 한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if we travel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛의 속도로</span><span class=\"en\"><b>at the speed of light,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 다른 행성에 도달할 수 있어야 해요</span><span class=\"en\"><b>we <span class=\"grammar-hl\">should be able to get to</span> another planet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈 깜박할 사이에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the blink of an eye</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇죠?</span><span class=\"en\"><b>right?</b></span></div></div><div class=\"lec-sent-ko\">그래서 만약 우리가 빛의 속도로 여행을 한다면, 우리는 다른 행성에 눈 깜박할 사이에 도달할 수 있어야 해요, 그렇죠?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> blink of an eye는 사전적으로 &#39;눈을 한 번 깜박이는 것&#39;인데, 여기서는 &#39;매우 짧은 순간&#39;을 의미합니다. 단순히 &#39;빠르다&#39;라고 하지 않고 신체적인 행동을 비유로 사용하여, 인간이 느끼기에 아주 찰나의 순간임을 강조하기 위해 이 표현을 썼습니다. 앞 문장의 광속 개념을 바탕으로 &#39;빠른 이동&#39;이라는 가설을 제시하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if we travel (조건절): 접속사 if를 사용하여 &#39;만약 ~한다면&#39;이라는 조건의 의미를 나타내는 부사절입니다.</div><div class=\"lec-gr-item\">should be able to get to (관용표현): be able to V는 can과 유사한 의미를 가진 조동사구 표현입니다.</div><div class=\"lec-gr-item\">in the blink of an eye (관용표현): &#39;눈 깜짝할 사이에&#39;라는 의미를 가진 전치사구 이디엄입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Dr. Sci: 그렇다면 좋겠지만, 우주는 너무 광활해서 그건 불가능하답니다.</span><span class=\"en\"><b>Dr. Sci:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>That would be nice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>but space is so vast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>that <span class=\"grammar-hl\">it is not possible</span>.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 그렇다면 좋겠지만, 우주는 너무 광활해서 그건 불가능하답니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시된 가설에 대해 전문가인 &#39;Dr. Sci&#39;가 반론을 제기하며, 우주의 거대함이라는 현실적인 장벽을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is not possible (가주어): 진주어: it이 가주어로 쓰였고, 뒤의 문맥(space is so vast)이 진주어 역할을 하여 전체 상황을 설명합니다.</div><div class=\"lec-gr-item\">so ... that (관용표현): so + 형용사/부사 + that절 구조로, &#39;너무 ~해서 ~하다&#39;라는 결과를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영화</span><span class=\"en\"><b>In the movie,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&lt;패신저스&gt;에서</span><span class=\"en\"><b>Passengers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주선이</span><span class=\"en\"><b>a spaceship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 행성으로 향하는</span><span class=\"en\"><b><span class=\"grammar-hl\">headed to a different planet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이동합니다</span><span class=\"en\"><b>travels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛의 속도의 절반으로.</span><span class=\"en\"><b>at one-half the speed of light.</b></span></div></div><div class=\"lec-sent-ko\">영화 &lt;패신저스&gt;에서 다른 행성으로 향하는 우주선이 빛의 속도의 절반으로 이동합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화 속 사례를 구체적으로 제시하여, 우주 여행이 결코 간단하지 않음을 독자가 이해하기 쉽게 설명하는 예시 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">headed to a different planet (과거분사(형용사)): headed가 앞에 있는 명사 a spaceship을 수식합니다. &#39;다른 행성으로 향하는(향해진) 우주선&#39;이라는 의미로 축약 관계절(which is headed to)의 기능을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주선은 다른 행성에 도달해야겠지요</span><span class=\"en\"><b>it <span class=\"grammar-hl\">should get to</span> another planet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 빨리</span><span class=\"en\"><b>very quickly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇죠?</span><span class=\"en\"><b>right?</b></span></div></div><div class=\"lec-sent-ko\">그러면 우주선은 다른 행성에 매우 빨리 도달해야겠지요, 그렇죠?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화 속 우주선의 속도가 매우 빠르다는 점을 환기하며, 일반적인 상식으로 기대할 법한 결과를 확인 질문 형식으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should get to (조동사): should가 사용되어 &#39;당연히 ~할 것이다&#39;라는 강한 추측의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승객들은 잠을 자게 되는데,</span><span class=\"en\"><b>the passengers sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">120년 동안</span><span class=\"en\"><b>for 120 years</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 예상되기 때문입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">because it is expected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그만큼 많은 시간이 걸릴 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to take</span> that much time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 행성에 도달하는 데.</span><span class=\"en\"><b>to get to a different planet.</b></span></div></div><div class=\"lec-sent-ko\">하지만 승객들은 120년 동안 잠을 자게 되는데, 왜냐하면 다른 행성에 도달하는 데 그만큼 많은 시간이 걸릴 것으로 예상되기 때문입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 반전을 주며, 실제 우주의 거리가 우리가 생각하는 것보다 훨씬 멀다는 사실을 드러내어 우주 여행의 어려움을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because it is expected to take (수동태): be동사(is)+p.p.(expected) 구조입니다. expect는 5형식(expect + O + to V) 구조로 쓰일 수 있는데, 목적어가 주어로 올라가 수동구조 is expected가 되었고, to부정사는 그대로 남은 구조입니다. 기본구조: expect + O + to V(목적어가 ~할 것을 예상하다).</div><div class=\"lec-gr-item\">to take that much time (to부정사): it is expected to take 구조에서 주어 it의 진주어적 성격을 띠며 &#39;시간이 걸리다&#39;는 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학 프로그램에서 빛의 속도와 우주 여행의 거리에 대해 논의함.</li><li>이론적으로 빛의 속도라면 순식간에 이동할 것 같지만, 실제 우주는 상상 이상으로 거대함.</li><li>영화 &#39;패신저스&#39;의 사례를 통해 광속의 절반으로 가도 수십 년이 걸릴 만큼 우주 여행이 어렵다는 점을 보여줌.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Space is too vast for human travel despite high speeds, so reaching distant planets requires a significant amount of time.</div>\n              <div class=\"lec-final-sum-ko\">광활한 우주 공간 탓에 빠른 속도로 이동하더라도, 먼 행성에 도달하기까지는 엄청난 시간이 걸린다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meaning"},{"audio":"./1_audio/5.mp3","hl":"grammar"}],[{"audio":"./1_audio/6.mp3","hl":"main"},{"audio":"./1_audio/7.mp3","hl":"meaning"},{"audio":"./1_audio/8.mp3","hl":"grammar"}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[],[],[],[],[]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
