<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 기말 중3 비상 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 8과 본문3","audioDir":"3_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 8과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>The Secret of Space-Time: Understanding Wormholes\u003c/h1>\u003ch2>시공간의 비밀: 웜홀 이해하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아인슈타인의 \u003cb class=\"key\">시공간\u003c/b> 이론을 통해 공간이 \u003cb class=\"key\">구부러질\u003c/b> 수 있음을 설명하고, 종이 접기 \u003cb class=\"key\">비유\u003c/b>를 통해 우주의 지름길인 \u003cb class=\"key\">웜홀\u003c/b>의 원리를 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Wormholes can serve as cosmic shortcuts because space-time is flexible and can be bent to connect two distant points.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우주 여행의 꿈을 실현해 줄 아주 흥미로운 개념인 웜홀에 대해 배워볼 거예요. 우주에도 과연 지름길이 있을까요? 아인슈타인의 이론을 바탕으로 공간이 어떻게 휘어지고 웜홀이 어떻게 형성되는지 핵심 내용을 함께 파헤쳐 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아인슈타인은 시간과 공간이 서로 분리된 것이 아니라 하나로 얽혀 있다는 \u003cb class=\"key\">시공간\u003c/b>(space-time) 개념을 제시했습니다. 이 시공간은 고정된 판이 아니라, 거대한 질량에 의해 마치 \u003cb class=\"key\">트램펄린\u003c/b> 위에 무거운 공을 놓은 것처럼 \u003cb class=\"key\">휘어질\u003c/b>(bend) 수 있는 유연한 성질을 가집니다. 이렇게 공간이 극단적으로 휘어져서 멀리 떨어진 두 지점이 맞닿게 되면, 그 사이를 관통하는 통로인 \u003cb class=\"key\">웜홀\u003c/b>(wormhole)이 생겨날 수 있습니다. 이는 아주 먼 거리를 빛보다 빠르게 이동할 수 있게 해주는 이론상의 \u003cb class=\"key\">지름길\u003c/b>(shortcut)로 간주됩니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 쌓아볼까요? 아인슈타인은 시간과 공간을 별개로 보지 않고 space-time, 즉 시공간이라는 하나의 천으로 보았어요. 이 시공간은 마치 팽팽한 트램펄린처럼 유연해서 구부러질 수 있는 성질을 가집니다. 우리가 종이를 접듯이 시공간이 휘어지면 엄청나게 먼 거리도 순식간에 이동할 수 있는 통로가 생기는데, 이것이 오늘 배울 shortcut, 바로 우주의 지름길입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우주 지름길에 대한 의문\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우주에 \u003cb class=\"key\">지름길\u003c/b>이 존재하는지에 대한 질문과 연구 결과에 따른 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">답변\u003c/b>으로 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>아인슈타인의 시공간 이론\u003csmall>핵심 원리 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>공간과 시간이 연결된 \u003cb class=\"key\">시공간\u003c/b> 개념과 그것이 \u003cb class=\"key\">구부러질\u003c/b> 수 있어 먼 지점들이 가까워질 수 있음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>종이 접기를 통한 비유\u003csmall>예시 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>종이의 양 끝에 점을 찍고 \u003cb class=\"key\">접어서 \u003c/b>\u003cb class=\"key\">구멍을 \u003c/b>\u003cb class=\"key\">뚫는\u003c/b> 행위를 통해 \u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 시각적으로 비유합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>웜홀의 구조적 정의\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>앞선 비유를 바탕으로 \u003cb class=\"key\">웜홀\u003c/b>이 두 개의 입과 이를 잇는 \u003cb class=\"key\">목구멍\u003c/b>으로 구성되어 있음을 정의합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 과학적 원리 설명과 비유를 거쳐 최종 결론에 이르는 아주 논리적인 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 우주의 지름길에 대한 궁금증을 던지고, 연구자들의 답변을 통해 그 존재 가능성을 긍정하며 독자의 흥미를 유발합니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 아인슈타인이 발견한 space-time의 개념을 설명해요. 시공간이 실제로 bent, 즉 구부러질 수 있으며 이로 인해 멀리 있던 부분들이 가까워진다는 핵심 원리를 제시하죠.","hl":"f1"},{"n":6,"text":"여섯 번째부터 아홉 번째 문장까지는 이 어려운 원리를 쉽게 설명하기 위해 종이 한 장을 예로 듭니다. 종이 양 끝의 점을 접어서 구멍을 뚫으면 instantly, 즉 즉각적으로 연결된다는 비유를 사용하고 있네요.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장에서는 이 비유를 우주에 적용하여 wormholes가 두 개의 입구와 이를 잇는 throat, 즉 목구멍 형태의 통로를 가지고 있다는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유와 예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">우주의 \u003cb class=\"key\">지름길\u003c/b>이라는 추상적인 개념을 설명하기 위해 \u003cb class=\"key\">종이 \u003c/b>\u003cb class=\"key\">접기\u003c/b>라는 일상적인 예시를 사용했습니다. 독자가 이해하기 쉬운 비유를 먼저 제시한 후, 마지막 문장에서 \u003cb class=\"key\">웜홀\u003c/b>의 구체적인 형태를 정의하며 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>According to (2)\u003c/b>\u003cspan>출처 제시\u003c/span>\u003cb>To understand this (6)\u003c/b>\u003cspan>비유적 예시 시작\u003c/span>\u003cb>Now (8)\u003c/b>\u003cspan>단계적 설명 전환\u003c/span>\u003cb>Like this (10)\u003c/b>\u003cspan>비유를 통한 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">shortcut\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">space-time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bent\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fold it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">connected\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wormholes\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문에 답하는 형식과 함께 비유의 기법을 사용하고 있습니다. 특히 마지막 문장에서 전체 내용을 정리하며 주제를 드러내는 미괄식 구조를 취하고 있어요.","hl":"ty"},{"n":9,"text":"글의 흐름을 돕는 신호어들을 잘 보세요. 두 번째 문장의 According to는 근거를 제시하고, 여섯 번째 문장의 To understand this는 비유의 시작을 알립니다. 마지막 문장의 Like this는 비유와 실제 과학 현상을 연결해 주는 아주 중요한 연결고리 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>shortcut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지름길\u003c/span>\u003c/div>\u003cdiv>\u003cb>universe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주\u003c/span>\u003c/div>\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구자\u003c/span>\u003c/div>\u003cdiv>\u003cb>figure out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각해 내다, 이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>connected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연결된\u003c/span>\u003c/div>\u003cdiv>\u003cb>space-time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>bent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>구부러진\u003c/span>\u003c/div>\u003cdiv>\u003cb>each other\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>closer\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 가까운\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sheet of paper\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>종이 한 장\u003c/span>\u003c/div>\u003cdiv>\u003cb>dot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점\u003c/span>\u003c/div>\u003cdiv>\u003cb>flat\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평평한\u003c/span>\u003c/div>\u003cdiv>\u003cb>one another\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>접다\u003c/span>\u003c/div>\u003cdiv>\u003cb>match up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>punch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뚫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉시\u003c/span>\u003c/div>\u003cdiv>\u003cb>wormhole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웜홀\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 지니고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mouth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입, 입구\u003c/span>\u003c/div>\u003cdiv>\u003cb>throat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목구멍, 통로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 figure out은 무언가를 계산해 내거나 생각해 냈을 때 쓰는 표현이에요. 또한 flat은 평평한 종이 상태를 의미하며, 웜홀의 구조를 설명할 때 쓰인 contain은 어떤 특징을 지니고 있다는 뜻으로 해석하면 자연스럽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">shortcut\u003c/b>\u003cspan class=\"m\">지름길\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bypass\u003c/span>\u003cspan class=\"s\">crosscut\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">detour\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">connected\u003c/b>\u003cspan class=\"m\">연결된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">linked\u003c/span>\u003cspan class=\"s\">joined\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separated\u003c/span>\u003cspan class=\"a\">detached\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bent\u003c/b>\u003cspan class=\"m\">구부러진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">curved\u003c/span>\u003cspan class=\"s\">twisted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">straight\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flat\u003c/b>\u003cspan class=\"m\">평평한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">level\u003c/span>\u003cspan class=\"s\">smooth\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uneven\u003c/span>\u003cspan class=\"a\">bumpy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">instantly\u003c/b>\u003cspan class=\"m\">즉시\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">immediately\u003c/span>\u003cspan class=\"s\">at once\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 볼까요? shortcut은 우회로를 뜻하는 bypass와 비슷하고, bent는 구부러진 상태인 curved와 유의어예요. 반대로 평평한 상태인 flat은 울퉁불퉁한 bumpy와 반대되는 개념이라는 점도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sci Teen: 있나요\u003c/span>\u003cspan class=\"en\">Sci Teen: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Is \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 지름길이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">shortcut\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에?\u003c/span>\u003cspan class=\"en\">in the universe?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Sci Teen: 우주에 그런 지름길이 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적인 이야기에 앞서 우주에 존재하는 \u003cb class=\"key\">지름길\u003c/b>에 대해 질문하며 독자의 \u003cb class=\"key\">호기심\u003c/b>을 자극하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 의문문\u003c/span> : Is [동사] + there + such a shortcut [주어] ~? : \"있나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such의 어순\u003c/span> : such [형용사] + a [관사] + shortcut [명사] : \"그런 지름길\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Sci Teen: Is there, Sci Teen: 있나요. such a shortcut, 그런 지름길이. in the universe?, 우주에?. 이 문장 전체를 해석하면, Sci Teen: 우주에 그런 지름길이 있나요?","hl":"m"},{"n":13,"text":"과학 잡지 Sci Teen이 박사님께 질문을 던지는 장면이에요. 우주에 지름길이라는 것이 실제로 존재하는지 물어보며 전체 이야기의 핵심 소재인 웜홀을 끌어내고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트는 Is there로 시작하는 의문문이에요. 주어가 뒤에 나오는 such a shortcut이므로 단수 동사 Is를 썼지요. 두 번째 포인트는 such a 명사 어순이에요. such a shortcut 순서대로 단어가 나열된다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dr. Sci: 따르면\u003c/span>\u003cspan class=\"en\">Dr. Sci: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">According \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 연구자들에\u003c/span>\u003cspan class=\"en\">some researchers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇습니다.\u003c/span>\u003cspan class=\"en\">yes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Dr. Sci: 몇몇 연구자들에 따르면, 그렇습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학생의 질문에 대한 답변으로, 과학적인 \u003cb class=\"key\">근거\u003c/b>가 있음을 암시하며 \u003cb class=\"key\">신뢰성\u003c/b>을 부여합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : According to [전치사구] + some researchers [명사] : \"~에 따르면\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Dr. Sci: According to, Dr. Sci: 따르면. some researchers, 몇몇 연구자들에. yes, 그렇습니다.. 이 문장 전체를 해석하면, Dr. Sci: 몇몇 연구자들에 따르면, 그렇습니다.","hl":"m"},{"n":16,"text":"박사님이 대답을 시작하시네요. 본인의 주장이 아니라 몇몇 연구자들의 의견을 빌려와서 답변에 신뢰도를 높이고 있어요. 뒤에 생략된 말은 지름길이 있다는 뜻이겠죠.","hl":"mn"},{"n":17,"text":"여기서는 According to라는 전치사구를 잘 봐두세요. 뒤에 some researchers라는 명사가 와서 누구의 말에 따르면 인지를 나타내고 있어요. 문장 전체를 수식하는 부사구 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아인슈타인은 생각해 냈고\u003c/span>\u003cspan class=\"en\">Einstein \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">figured \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp 19,"text":"아인슈타인이 알아낸 놀라운 사실을 설명하고 있어요. 공간과 시간은 따로 떨어진 게 아니라 서로 연결되어 있어서 박사님은 이걸 시공간이라는 하나의 단어로 불렀다는 내용입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 figured out 뒤에 나오는 that은 명사절 접속사예요. 뒤에 오는 전체 문장을 목적어로 만들어 줍니다. 두 번째로 are connected는 수동태로 공간과 시간이 연결된 상태를 보여주죠. 세 번째는 called it space-time인데, 목적어 it을 목적격 보어인 space-time이라고 부른다는 오형식 문장입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각했습니다\u003c/span>\u003cspan class=\"en\">He thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시공간이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> space-time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 구부러질 수 있다고\u003c/span>\u003cspan class=\"en\">could actually \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">bent\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 시공간이 실제로 구부러질 수 있다고 생각했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아인슈타인이 주장한 \u003cb class=\"key\">시공간 \u003c/b>\u003cb class=\"key\">왜곡\u003c/b>의 개념을 소개하는 문장입니다. 우주에 \u003cb class=\"key\">지름길\u003c/b>이 존재할 수 있다는 이론적 근거를 제시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (목적어절)\u003c/span> : thought [타동사] + that [접속사] + S + V : \"~라고 / ~라는 점을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (조동사 + be p.p.)\u003c/span> : could [조동사] + be bent [be + 과거분사] : \"구부러질 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He thought, 그는 생각했습니다. that space-time, 시공간이. could actually be bent, 실제로 구부러질 수 있다고. 이 문장 전체를 해석하면, 그는 시공간이 실제로 구부러질 수 있다고 생각했습니다.","hl":"m"},{"n":22,"text":"이 문장은 아인슈타인의 시공간 왜곡 이론을 설명하고 있어요. 웜홀이라는 지름길이 어떻게 가능한지 그 원리를 보여주는 중요한 시작점입니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 접속사 that입니다. 생각한 내용 전체를 묶어서 목적어 마디로 만들어 주는데, 뒤에는 완전한 문장이 이어집니다. 두 번째는 be bent 수동태예요. 시공간이 구부러지는 수동의 의미를 나타내기 위해 조동사 could 뒤에 be 과거분사 형태를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 구부러질 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> it is bent,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부분들이\u003c/span>\u003cspan class=\"en\">parts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 멀리 떨어져 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> far away from each other\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 더 가까워집니다.\u003c/span>\u003cspan class=\"en\">are suddenly closer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 구부러질 때 서로 멀리 떨어져 있는 부분들이 갑자기 더 가까워집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">굴곡\u003c/b>이 발생했을 때 나타나는 현상을 설명합니다. 평면에서는 멀었던 두 지점이 휘어짐을 통해 \u003cb class=\"key\">곡률\u003c/b>이 생기면 물리적 거리가 단축됨을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : When [접속사] + S + V, S' + V' : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : parts [선행사] + that [주격 관계대명사] + are [동사] : \"~한 (부분들)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When it is bent, 그것이 구부러질 때. parts, 부분들이. that are far away from each other, 서로 멀리 떨어져 있는. are suddenly closer, 갑자기 더 가까워집니다.. 이 문장 전체를 해석하면, 그것이 구부러질 때 서로 멀리 떨어져 있는 부분들이 갑자기 더 가까워집니다.","hl":"m"},{"n":25,"text":"공간의 굴곡이 생기면 어떤 일이 벌어지는지 보여주는 문장이에요. 휘어진 공간 덕분에 곡률이 생겨서 멀리 있던 두 지점이 맞닿게 된다는 뜻이죠.","hl":"mn"},{"n":26,"text":"첫 번째로 접속사 when은 시공간이 구부러지는 시점을 나타내는 부사절을 이끌고 있어요. 두 번째는 parts를 뒤에서 꾸며주는 주격 관계대명사 that입니다. 선행사가 복수니까 관계사절의 동사로 are를 쓴 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 이해하기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span> this,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이를 한 장 갖고 와서\u003c/span>\u003cspan class=\"en\">take a sheet of paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 점을 찍으세요\u003c/span>\u003cspan class=\"en\">and make a small dot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 종이의 윗부분에\u003c/span>\u003cspan class=\"en\">at the top of the paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 또 다른 점을\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">another\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 종이의 아랫부분에\u003c/span>\u003cspan class=\"en\">at the bottom of the paper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것을 이해하기 위해서, 종이를 한 장 갖고 와서 그 종이의 윗부분에 작은 점을 찍고 또 다른 점을 그 종이의 아랫부분에 찍어 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀의 원리를 설명하기 위해 \u003cb class=\"key\">종이 \u003c/b>\u003cb class=\"key\">접기\u003c/b>를 활용한 비유를 시작하는 문장입니다. 독자가 쉽게 이해할 수 있도록 돕는 \u003cb class=\"key\">실험적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시합니다. =\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 (서로)\u003c/span> : [one another] : \"서로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"On a flat sheet of paper, 펼쳐 놓은 종이에서. the dots are far away, 그 점들은 멀리 떨어져 있습니다. from one another, 서로.. 이 문장 전체를 해석하면, 펼쳐 놓은 종이에서 그 점들은 서로 멀리 떨어져 있습니다.","hl":"m"},{"n":31,"text":"종이가 평평하게 펴져 있을 때는 두 점 사이의 물리적 거리가 멀다는 것을 보여줍니다. 이것은 우주 공간이 구부러지기 전의 일반적인 상태를 비유한 표현이에요.","hl":"mn"},{"n":32,"text":"여기서 주목할 표현은 one another입니다. 서로라는 뜻으로, 보통 셋 이상일 때 쓴다고 배우지만 실제 문장에서는 each other와 섞어서 자주 사용되니 의미를 잘 익혀두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 그 종이를 들고\u003c/span>\u003cspan class=\"en\">Now, take the paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 접으세요\u003c/span>\u003cspan class=\"en\">and fold it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점들이 맞춰지도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dots \u003c/span>\u003cspan class=\"tgt\">matched \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 그 종이를 들고 점들이 맞춰지도록 그것을 접으세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 평면이었던 종이를 접음으로써 멀리 있던 두 지점을 맞닿게 만드는 과정으로, \u003cb class=\"key\">시공간의 \u003c/b>\u003cb class=\"key\">굴곡\u003c/b>을 시각화하여 \u003cb class=\"key\">지름길\u003c/b>의 원리를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : [with] + [the dots (목적어)] + [matched up (과거분사)] : \"점들이 맞춰진 채로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Now, take the paper, 이제 그 종이를 들고. and fold it, 그것을 접으세요. with the dots matched up, 점들이 맞춰지도록.. 이 문장 전체를 해석하면, 이제 그 종이를 들고 점들이 맞춰지도록 그것을 접으세요.","hl":"m"},{"n":34,"text":"종이를 접어서 두 점을 만나게 하는 과정은 우주 공간이 구부러지는 것을 의미해요. 이렇게 하면 멀리 있던 두 지점이 아주 가까워지게 되죠.","hl":"mn"},{"n":35,"text":"문장 끝의 with the dots matched up 부분을 잘 보세요. with 다음에 목적어와 분사가 나오는 구문인데, 점들이 맞춰지는 수동의 관계니까 과거분사인 matched up을 쓴 것이 핵심 포인트입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이에 구멍을 뚫으면\u003c/span>\u003cspan class=\"en\">Punch a hole in the paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 점들이 일 것입니다\u003c/span>\u003cspan class=\"en\">and the dots \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉시 연결될.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">instantly \u003c/span>\u003cspan class=\"tgt\">connected\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">종이에 구멍을 뚫으면 그 점들이 즉시 연결될 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 접힌 종이에 구멍을 뚫는 행위는 \u003cb class=\"key\">웜홀\u003c/b>의 생성을 비유하며, 이를 통해 멀리 떨어진 두 지점이 \u003cb class=\"key\">즉각적\u003c/b>으로 연결됨을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (미래 시제)\u003c/span> : [will be] + [connected (과거분사)] : \"연결될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명령문 + and\u003c/span> : [Punch (명령문)] + [...] + [and (그러면)] : \"뚫어라, 그러면 ~할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Punch a hole in the paper, 종이에 구멍을 뚫으면. and the dots will be, 그 점들이 일 것입니다. instantly connected, 즉시 연결될.. 이 문장 전체를 해석하면, 종이에 구멍을 뚫으면 그 점들이 즉시 연결될 것입니다.","hl":"m"},{"n":37,"text":"구멍을 뚫는 것은 웜홀이라는 통로를 만드는 것을 의미해요. 이 통로 덕분에 엄청나게 먼 거리도 순식간에 이동할 수 있게 된다는 논리입니다.","hl":"mn"},{"n":38,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 명령문 뒤에 접속사 and가 오면 그러면 이라고 해석해야 조건의 의미가 살아납니다. 두 번째로 주어인 점들이 연결되는 상태를 나타내기 위해 미래형 수동태인 will be connected를 썼다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이와 마찬가지로,\u003c/span>\u003cspan class=\"en\">Like this,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주의 웜홀은\u003c/span>\u003cspan class=\"en\">wormholes in space\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 개의 입을 지니고 있을 것입니다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">contain\u003c/span> two mouths,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목구멍을 (지니고 있을 것입니다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">throat \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 둘을 연결하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">connecting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">two\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이와 마찬가지로 우주의 웜홀은 두 개의 입과 그 둘을 연결하는 목구멍을 지니고 있을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 설명한 종이 접기 비유를 마무리하며, \u003cb class=\"key\">웜홀\u003c/b>의 구조가 입구 역할을 하는 두 개의 \u003cb class=\"key\">입(mouths)\u003c/b>과 그 사이를 잇는 \u003cb class=\"key\">통로(throat)\u003c/b>로 이루어져 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may (약한 추측)\u003c/span> : may + [동사원형 (contain)] : \"지니고 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 명사 + 분사 (부대상황)\u003c/span> : with + [a throat (명사)] + [connecting (현재분사)] : \"그 둘을 연결하는 목구멍과 함께\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Like this, 이와 마찬가지로. wormholes in space, 우주의 웜홀은. may contain two mouths, 두 개의 입을 지니고 있을 것입니다. with a throat, 목구멍을 (지니고 있을 것입니다). connecting the two, 그 둘을 연결하는. 이 문장 전체를 해석하면, 이와 마찬가지로 우주의 웜홀은 두 개의 입과 그 둘을 연결하는 목구멍을 지니고 있을 것입니다.","hl":"m"},{"n":40,"text":"앞에서 종이를 접어서 구멍을 뚫었던 비유 기억나죠? 그 비유를 실제 우주에 적용해서 웜홀의 구조를 설명하는 문장이에요. 웜홀은 두 개의 입과 그것을 잇는 통로로 구성된다는 것이 핵심 내용입니다.","hl":"mn"},{"n":41,"text":"어법을 살펴볼까요? 첫 번째로 may contain은 조동사 may를 사용해서 약한 추측을 나타내고 있어요. 웜홀의 구조가 이럴지도 모른다는 가능성을 말하죠. 두 번째로 이 문장에서 가장 중요한 부분인 with a throat connecting the two를 보세요. 전치사 with 뒤에 명사가 오고 그 뒤에 현재분사 connecting이 온 형태예요. 목구멍이 두 입을 직접 연결하고 있는 능동의 상태를 설명하는 현재분사 구문입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아인슈타인은 시간과 공간이 연결된 \u003cb class=\"key\">시공간\u003c/b> 개념을 정립했습니다.\u003c/li>\u003cli>\u003cb class=\"key\">시공간\u003c/b>은 실제로 \u003cb class=\"key\">구부러질\u003c/b> 수 있으며, 이는 멀리 떨어진 지점을 가깝게 만듭니다.\u003c/li>\u003cli>\u003cb class=\"key\">종이 \u003c/b>\u003cb class=\"key\">접기\u003c/b> 실험을 통해 공간이 접혔을 때 생기는 \u003cb class=\"key\">구멍\u003c/b>의 원리를 시각화할 수 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">웜홀\u003c/b>은 두 개의 입과 이를 잇는 통로로 구성된 우주의 \u003cb class=\"key\">지름길\u003c/b>입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Wormholes can serve as cosmic shortcuts because space-time is flexible and can be bent to connect two distant points.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아인슈타인의 \u003cb class=\"key\">시공간\u003c/b> 이론을 통해 공간이 \u003cb class=\"key\">구부러질\u003c/b> 수 있음을 설명하고, 종이 접기 \u003cb class=\"key\">비유\u003c/b>를 통해 우주의 지름길인 \u003cb class=\"key\">웜홀\u003c/b>의 원리를 소개합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 아인슈타인의 시공간 개념과 웜홀이 형성되는 원리를 종이 접기 비유를 통해 배워봤습니다. 시공간이 구부러질 수 있다는 점이 웜홀 탄생의 열쇠라는 사실, 잊지 마세요! 오늘 배운 핵심 어휘와 구조를 다시 한번 복습하면서 마무리하겠습니다. 수고하셨어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
