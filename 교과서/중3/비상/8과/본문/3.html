\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Is there such a shortcut in the universe? (도치): 유도부사 &#39;There&#39;가 문장 앞에 오면서 &#39;be동사(is) + 주어(such a shortcut)&#39; 순서로 주어와 동사의 위치가 바뀐 도치 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학 박사:</span><span class=\"en\"><b>Dr. Sci:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 따르면</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 연구자들,</span><span class=\"en\"><b>some researchers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇습니다.</span><span class=\"en\"><b>yes.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 몇몇 연구자들에 따르면, 그렇습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장의 질문에 대해 과학적 근거를 바탕으로 긍정적인 답변을 하며, 뒤이어 나올 구체적인 과학 이론을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">According to (관용표현): &#39;~에 따르면&#39;이라는 뜻의 전치사구로, 문장 전체를 수식하는 부사적 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아인슈타인은</span><span class=\"en\"><b>Einstein</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아냈습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">figured out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공간과 시간이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> space and time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연결되어 있다는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">are connected</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 그것을 불렀습니다</span><span class=\"en\"><b>and he <span class=\"grammar-hl\">called it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시공간이라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">space-time</span>.</b></span></div></div><div class=\"lec-sent-ko\">아인슈타인은 공간과 시간이 연결되어 있다는 것을 생각해 냈고, 그것을 시공간이라고 불렀습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> figured out은 사전적으로 &#39;계산해내다&#39;이지만 여기서는 &#39;복잡한 원리를 깊이 연구하여 깨달음을 얻다&#39;는 뜻입니다. 이 단어를 쓴 이유는 단순히 정보를 습득한 것이 아니라, 새로운 물리적 개념을 통찰해낸 아인슈타인의 발견을 강조하기 위해서입니다. 이는 시공간이라는 개념을 도입하여 이후 설명할 &#39;웜홀&#39;의 논리적 배경이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">figured out that 동격의 that: &#39;that절&#39;이 앞의 일반동사 &#39;figured out&#39;의 목적어 역할을 하는 명사절로 쓰였으나, that절 내부에서 &#39;space and time&#39;이 &#39;connected&#39;의 주어 역할을 하며 주어+동사+보어의 완전한 구조를 갖추고 있다.</div><div class=\"lec-gr-item\">are connected (수동태): be동사(are)+p.p.(connected) 구조. connect는 타동사인데 목적어가 없어서 수동구조 are connected 형태로 쓴다. 기본구조: connect A (A를 연결하다).</div><div class=\"lec-gr-item\">called it space-time 5형식(SVOC) 구조: &#39;call + O + O.C.&#39; 형태이며, O(it)를 O.C.(space-time)라고 부르다라는 의미의 5형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 생각했습니다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시공간이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> space-time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로</span><span class=\"en\"><b><span class=\"grammar-hl\">could actually</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구부러질 수 있다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">be bent</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 시공간이 실제로 구부러질 수 있다고 생각했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 정의한 &#39;시공간&#39;이라는 개념이 고정된 것이 아니라 물리적 힘에 의해 변형될 수 있음을 제시하며, 웜홀의 핵심 원리인 &#39;공간의 왜곡&#39;을 설명하기 위한 전제 조건을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought that 명사절(접속사 that): &#39;that절&#39;이 주어(He)의 생각(thought)의 내용을 설명하는 목적어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">could actually be bent (수동태): be동사(be)+p.p.(bent) 구조. bend는 타동사인데 목적어가 없어서 수동구조 be bent 형태로 쓴다. 기본구조: bend O (O를 구부리다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 구부러질 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When it is bent</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부분들은</span><span class=\"en\"><b><span class=\"grammar-hl\">parts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멀리 떨어져 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that are far away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from each other</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기</span><span class=\"en\"><b>are suddenly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 가까워집니다.</span><span class=\"en\"><b>closer.</b></span></div></div><div class=\"lec-sent-ko\">그것이 구부러질 때 서로 멀리 떨어져 있는 부분들이 갑자기 더 가까워집니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 &#39;휘어짐&#39;이 구체적으로 어떤 결과를 만드는지 설명합니다. 공간이 구부러짐으로써 기존의 거리 개념이 무의미해지는 상황을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When it is bent (수동태): be동사(is)+p.p.(bent) 구조. bend는 타동사인데 목적어가 없어서 수동구조 is bent 형태로 쓴다. 기본구조: bend O (O를 구부리다).</div><div class=\"lec-gr-item\">parts that are far away from each other (관계대명사): &#39;that&#39;은 주격 관계대명사로, 선행사 &#39;parts&#39;를 수식하며 절 내부에서 주어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 이해하기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To understand this</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가져오세요</span><span class=\"en\"><b>take</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이 한 장을</span><span class=\"en\"><b>a sheet of paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 만드세요</span><span class=\"en\"><b>and make</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 점 하나를</span><span class=\"en\"><b>a small dot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 종이의 꼭대기에</span><span class=\"en\"><b>at the top of the paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 또 다른 점을</span><span class=\"en\"><b>and another</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아랫부분에</span><span class=\"en\"><b>at the bottom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 종이의.</span><span class=\"en\"><b>of the paper.</b></span></div></div><div class=\"lec-sent-ko\">이것을 이해하기 위해서, 종이를 한 장 갖고 와서 그 종이의 윗부분에 작은 점을 찍고 또 다른 점을 그 종이의 아랫부분에 찍어 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 추상적인 물리 개념을 독자가 쉽게 이해할 수 있도록 종이와 점이라는 구체적인 비유(비유적 사고 실험)를 제안하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To understand this (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;라는 의미로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">평평한 장 위에서</span><span class=\"en\"><b>On a flat sheet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이의,</span><span class=\"en\"><b>of paper,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 점들은</span><span class=\"en\"><b>the dots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멀리 떨어져 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">are far away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로로부터.</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> one another.</b></span></div></div><div class=\"lec-sent-ko\">펼쳐 놓은 종이에서 그 점들은 서로 멀리 떨어져 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휘어지지 않은 상태의 평범한 공간 상태를 설명하여, 다음에 올 &#39;휘어진 상태&#39;와 대비시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are far away from (관용표현): &#39;~에서 멀리 떨어진&#39;이라는 의미의 형용사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 종이를 들고</span><span class=\"en\"><b>take the paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 접으세요</span><span class=\"en\"><b>and fold it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점들이</span><span class=\"en\"><b><span class=\"grammar-hl\">with the dots</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맞춰지도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">matched up</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제 그 종이를 들고 점들이 맞춰지도록 그것을 접으세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에서 언급한 &#39;공간의 휘어짐&#39;을 종이 접기라는 행동을 통해 시각적으로 구체화하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with the dots matched up (과거분사): &#39;with + O + O.C.&#39; 구조에서 O.C. 자리에 쓰인 과거분사로, &#39;dots&#39;와 &#39;match&#39;가 수동 관계(점들이 맞춰진 상태)임을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">구멍을 뚫으세요</span><span class=\"en\"><b>Punch a hole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 종이에</span><span class=\"en\"><b>in the paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 그 점들이</span><span class=\"en\"><b>and the dots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">will be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉시 연결되게.</span><span class=\"en\"><b><span class=\"grammar-hl\">instantly connected</span>.</b></span></div></div><div class=\"lec-sent-ko\">종이에 구멍을 뚫으면 그 점들이 즉시 연결될 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> punch는 사전적으로 &#39;주먹으로 치다, 세게 때리다&#39;이지만 여기서는 &#39;도구를 사용해 구멍을 뚫다&#39;라는 뜻입니다. 종이의 두 지점을 물리적으로 잇는 행위를 직관적으로 보여주어 웜홀의 개념을 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be instantly connected (수동태): be동사(be)+p.p.(connected) 구조. connect는 타동사인데 목적어가 없어서 수동구조 be connected 형태로 쓴다. 기본구조: connect A (A를 연결하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이와 같이,</span><span class=\"en\"><b>Like this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웜홀들은</span><span class=\"en\"><b>wormholes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주 안의</span><span class=\"en\"><b>in space</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포함할지도 모릅니다</span><span class=\"en\"><b>may contain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 입을,</span><span class=\"en\"><b>two mouths,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목구멍과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with a throat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연결하는</span><span class=\"en\"><b><span class=\"grammar-hl\">connecting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 둘을.</span><span class=\"en\"><b><span class=\"grammar-hl\">the two</span>.</b></span></div></div><div class=\"lec-sent-ko\">이와 마찬가지로 우주의 웜홀은 두 개의 입과 그 둘을 연결하는 목구멍을 지니고 있을 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 종이 실험의 비유를 우주의 실제 현상으로 가져와 웜홀의 구조(입구와 통로)를 정의하며 내용을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with a throat connecting the two (현재분사): &#39;throat&#39;를 의미상 주어로 하여, 그 동작(두 점을 연결하는 상태)을 설명하는 &#39;with + O + V-ing&#39; 구조의 현재분사이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우주 공간을 단축할 수 있는 지름길(웜홀)에 대해 질문한다.</li><li>아인슈타인의 시공간 개념과 그것이 휘어질 수 있다는 이론을 소개한다.</li><li>종이 접기 비유를 통해 멀리 떨어진 공간이 어떻게 연결되는지 쉽게 설명한다.</li><li>웜홀은 두 개의 입구와 그것을 잇는 통로로 이루어져 있다는 결론을 낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Einstein explained that space-time can be bent to bring distant points closer, and this concept suggests that wormholes act as tunnels connecting two separate locations.</div>\n              <div class=\"lec-final-sum-ko\">아인슈타인은 먼 지점들을 가깝게 만들기 위해 시공간이 휘어질 수 있다고 설명했으며, 이 개념은 웜홀이 두 떨어진 위치를 연결하는 통로 역할을 한다는 것을 시사한다.</div></div></div>"],"segs":[[],[],[],[],[],[],[],[],[],[],[],[],[]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
