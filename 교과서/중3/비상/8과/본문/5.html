@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 8과 본문5","audioDir":"5_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 8과\u003cbr>본문5\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Wormhole Travel: From Theory to Reality\u003c/h1>\u003ch2>웜홀 여행: 이론에서 현실로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>웜홀 여행이 \u003cb class=\"key\">이론\u003c/b>에만 존재할 것이라는 비관적인 전망에 대해, 과거의 \u003cb class=\"key\">불가능\u003c/b>했던 성취를 근거로 미래의 실현 가능성을 제시하며 독자를 격려하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Despite current theoretical limitations, persistent research and our history of overcoming the impossible suggest that wormhole travel could become a reality in the future.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 비상 중학교 삼학년 영어 팔 단원의 마지막 본문인 다섯 번째 이야기를 함께 공부해보겠습니다. 이 글은 웜홀 여행이라는 신비로운 주제를 통해 과학적 탐구 정신과 미래에 대한 희망을 노래하고 있어요. 웜홀 여행이 단지 이론적인 꿈일지, 아니면 우리가 이뤄낼 수 있는 현실일지 박사님의 멋진 대답을 통해 확인해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">웜홀(wormhole)은 우주의 서로 다른 두 지점을 연결하는 \u003cb class=\"key\">지름길\u003c/b>과 같은 통로를 의미하는 물리학 용어입니다. 아인슈타인의 \u003cb class=\"key\">상대성 \u003c/b>\u003cb class=\"key\">이론(Relativity \u003c/b>\u003cb class=\"key\">Theory)\u003c/b>에서 유도된 개념이지만, 아직 실제로 관측되지는 않아 \u003cb class=\"key\">이론상(in \u003c/b>\u003cb class=\"key\">theory)\u003c/b>의 존재로 남아 있습니다. 마치 사과의 겉면을 기어가는 벌레가 사과 속을 파서 반대편으로 \u003cb class=\"key\">지름길\u003c/b>을 만드는 것과 같아 웜홀이라 불립니다. 과거에 비행기나 컴퓨터가 불가능해 보였던 것처럼, 과학의 발전은 늘 상상을 현실로 만들어 왔습니다. 고등학생 수준에서는 시공간의 \u003cb class=\"key\">곡률(curvature)\u003c/b>을 이용한 이동 수단으로 이해할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"웜홀이라는 용어는 원래 벌레가 사과 속을 파서 만든 구멍이라는 뜻에서 유래했어요. 우주 공간의 두 점을 아주 빠르게 연결해 주는 일종의 지름길 같은 개념이죠. 아인슈타인의 상대성 이론에서 처음 제시되었지만, 아직 실제로 발견되지는 않아서 여전히 이론상으로만 존재합니다. 하지만 과거에 우리가 불가능하다고 여겼던 많은 것들이 오늘날 현실이 된 것처럼, 웜홀도 과학적 도전의 대상이 되고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>비관적 전망\u003csmall>도입/질문 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>웜홀 여행이 이론 속에만 존재하는 것이며 인류가 \u003cb class=\"key\">가망\u003c/b>이 없는 상태인지에 대해 \u003cb class=\"key\">의문\u003c/b>을 제기합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>박사의 낙관\u003csmall>반박/주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>웜홀에 대한 \u003cb class=\"key\">논쟁\u003c/b>은 계속되고 있지만, 지속적인 \u003cb class=\"key\">탐구\u003c/b>를 통해 결국 방법을 찾아낼 것이라고 믿음을 표합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>역사의 교훈\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>인류는 과거에도 처음에는 \u003cb class=\"key\">불가능\u003c/b>해 보였던 수많은 일들을 \u003cb class=\"key\">달성\u003c/b>해 왔음을 상기시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>독자 격려\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>독자 중 누군가가 그 \u003cb class=\"key\">해답\u003c/b>을 찾을 주인공이 될 수 있다며 \u003cb class=\"key\">희망\u003c/b>적인 메시지로 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문과 답변을 통해 회의적인 시각에서 희망적인 확신으로 나아가는 흐름을 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 웜홀 여행이 이론상으로만 존재하는 것이라 우리가 절망적인 상황인지 묻는 질문을 던집니다. 학생의 목소리로 우울한 광경이라며 hopelessness를 언급하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 박사님이 등장하여 그렇게 말하지 않겠다고 단호하게 반박합니다. 현재 논쟁은 진행 중이지만, persistent exploration 즉 끊임없는 탐구를 통해 결국 방법을 알아낼 것이라는 강력한 믿음을 보입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 우리 인류의 역사를 돌아보라고 조언합니다. 처음에는 impossible 즉 불가능해 보였던 수많은 일들을 우리가 이미 achieved 달성해 왔다는 사실을 증거로 제시하고 있어요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 격려의 마무리입니다. 누가 알겠냐는 Who knows라는 질문과 함께, 바로 여러분이 그 answer 즉 해답을 찾을 주인공이 될 수 있다고 독자의 열정을 일깨워 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">학생의 \u003cb class=\"key\">의구심\u003c/b> 섞인 질문에 대해 과학자가 역사적 \u003cb class=\"key\">근거\u003c/b>와 미래에 대한 \u003cb class=\"key\">확신\u003c/b>을 담아 답변하는 구조입니다. 초반의 비관적인 질문을 지나 후반부에 인류의 \u003cb class=\"key\">잠재력\u003c/b>과 미래의 성공 가능성을 강조하며 끝을 맺습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So, are we...? (3)\u003c/b>\u003cspan>질문을 통한 화제 전환\u003c/span>\u003cb>but (6)\u003c/b>\u003cspan>논쟁적 상황과 개인적 확신의 대조\u003c/span>\u003cb>Who knows? (9)\u003c/b>\u003cspan>독자의 참여와 미래 가능성 암시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wormhole\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">idea that only exists in theory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ongoing debate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">impossible things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the answer\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 학생의 질문에 박사님이 답하는 질문과 답변 형식을 취하고 있습니다. 특히 글의 후반부에 박사님의 주장과 격려가 집중되어 있는 미괄식 구조를 띄고 있어 독자에게 강한 인상을 남깁니다.","hl":"ty"},{"n":9,"text":"대조를 나타내는 but을 통해 현재의 논쟁적인 상황보다 박사님의 믿음이 더 중요함을 강조하고 있어요. 또한 look back at history라는 명령문을 통해 논리적인 근거를 과거의 경험에서 찾으라고 유도합니다. 마지막의 who knows는 수사 의문문으로 미래의 무궁무진한 가능성을 열어두는 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ouch\u003c/b>\u003cem>감탄사\u003c/em>\u003cspan>어이쿠, 아야\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좋은, 예쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광경, 상황, 사진\u003c/span>\u003c/div>\u003cdiv>\u003cb>hopeless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가망 없는, 절망적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여행하다, 이동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주, 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>wormhole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웜홀\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 단순히\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아이디어, 생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>in theory\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이론상으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>debate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>논쟁, 토론\u003c/span>\u003c/div>\u003cdiv>\u003cb>ongoing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진행 중인\u003c/span>\u003c/div>\u003cdiv>\u003cb>persistent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끊임없는, 지속적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>exploration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐구, 탐사\u003c/span>\u003c/div>\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>eventually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn how to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 법을 배우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look back at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌아보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역사\u003c/span>\u003c/div>\u003cdiv>\u003cb>achieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>달성하다, 성취하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>who knows\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>누가 알겠는가(아무도 모른다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>maybe\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어쩌면, 아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해답, 대답\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? hopeless는 가망 없는이라는 뜻으로 절망적인 기분을 나타낼 때 쓰입니다. ongoing은 현재 진행 중인이라는 뜻으로 debate와 함께 쓰여 논쟁이 계속되고 있음을 보여주죠. persistent는 끊임없는이라는 뜻인데 박사님이 강조하는 가장 중요한 태도입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">hopeless\u003c/b>\u003cspan class=\"m\">가망 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">desperate\u003c/span>\u003cspan class=\"s\">pessimistic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hopeful\u003c/span>\u003cspan class=\"a\">promising\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">persistent\u003c/b>\u003cspan class=\"m\">끊임없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">constant\u003c/span>\u003cspan class=\"s\">continuous\u003c/span>\u003cspan class=\"s\">unrelenting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ceasing\u003c/span>\u003cspan class=\"a\">temporary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">achieve\u003c/b>\u003cspan class=\"m\">달성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accomplish\u003c/span>\u003cspan class=\"s\">fulfill\u003c/span>\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impossible\u003c/b>\u003cspan class=\"m\">불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unachievable\u003c/span>\u003cspan class=\"s\">unfeasible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">possible\u003c/span>\u003cspan class=\"a\">feasible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exploration\u003c/b>\u003cspan class=\"m\">탐구\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">investigation\u003c/span>\u003cspan class=\"s\">examination\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"유의어를 정리해 볼게요. hopeless와 비슷한 말로는 desperate나 pessimistic이 있고, 반대말은 hopeful입니다. 성취하다라는 뜻의 achieve는 accomplish나 attain으로 바꿔 쓸 수 있어요. 불가능한이라는 뜻의 impossible의 반의어인 possible은 다들 잘 알고 계시죠?","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어이쿠!\u003c/span>\u003cspan class=\"en\">Sci Teen: Ouch!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어이쿠!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상황이 좋지 않음을 깨달았을 때 내뱉는 \u003cb class=\"key\">감탄사\u003c/b>입니다. 웜홀 여행의 위험성이나 어려움에 대해 \u003cb class=\"key\">반응\u003c/b>하는 말입니다.\u003c/div>","segs":[{"n":12,"text":"Ouch!, 어이쿠!. 이 문장 전체를 해석하면, 어이쿠!","hl":"m"},{"n":13,"text":"이 표현은 웜홀 여행이 쉽지 않다는 설명을 듣고 내뱉는 짧은 감탄사예요. 상황이 좋지 않다는 것을 깨달았을 때 쓰는 반응이죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그건 ~이 아니네요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> not\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 광경이\u003c/span>\u003cspan class=\"en\">a pretty picture.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그건 좋은 광경이 아니네요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문자 그대로의 그림이 아니라, 눈앞에 그려지는 \u003cb class=\"key\">상황\u003c/b>이 좋지 않음을 뜻하는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다. 웜홀 여행의 암담한 현실을 비유하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 주어와 동사의 축약형\u003c/span> : That [주어] + is [동사] : \"그것은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"That's not, 그건 ~이 아니네요. a pretty picture, 좋은 광경이. 이 문장 전체를 해석하면, 그건 좋은 광경이 아니네요.","hl":"m"},{"n":15,"text":"직역하면 예쁜 그림이 아니라는 뜻이지만 사실은 상황이 좋지 않다는 비유적인 표현이에요. 웜홀을 통과하는 것이 매우 어렵다는 사실을 이렇게 말하고 있죠.","hl":"mn"},{"n":16,"text":"첫 번째로 That is의 줄임말인 That is가 쓰였어요. 지시대명사 That은 앞에서 말한 힘든 상황을 가리킵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~인가요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">we\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가망이 없는\u003c/span>\u003cspan class=\"en\">hopeless?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼 우리는 가망이 없는 건가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 비관적인 상황을 듣고 \u003cb class=\"key\">가능성\u003c/b>에 대해 묻는 질문입니다. 웜홀 여행이 아예 불가능한 것인지 \u003cb class=\"key\">의문\u003c/b>을 제기하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 어순\u003c/span> : Be동사(are) + 주어(we) + 형용사(hopeless) : \"우리는 ~인가요?\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"So, 그럼. are we, 우리는 ~인가요?. hopeless?, 가망이 없는. 이 문장 전체를 해석하면, 그럼 우리는 가망이 없는 건가요?","hl":"m"},{"n":18,"text":"앞의 이야기를 듣고 나서 이제 우리는 아예 희망이 없는 것인지 묻는 문장이에요. 웜홀 여행의 가능성을 다시 한번 확인하고 싶어 하는 질문이죠.","hl":"mn"},{"n":19,"text":"첫 번째로 주어 we와 Be동사 are의 자리가 바뀐 의문문 구조를 보세요. 마지막에 쓰인 hopeless는 가망이 없는이라는 뜻의 형용사로 주어의 상태를 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여행하는 것은 \u003c/span>\u003cspan class=\"en\">Is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">traveling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에서 웜홀을 통해 \u003c/span>\u003cspan class=\"en\">in space through a wormhole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 아이디어인가요 \u003c/span>\u003cspan class=\"en\">simply an idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이론상으로만 존재하는?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">exists\u003c/span> in theory?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주에서 웜홀을 통해 여행을 하는 것은 단지 이론상으로만 존재하는 아이디어인가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀 여행이 실현 불가능한 단순한 \u003cb class=\"key\">상상\u003c/b>에 불과한지 묻고 있습니다. 과학적 가능성에 대해 의구심을 품는 \u003cb class=\"key\">회의적\u003c/b> 시각을 대변하는 질문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Traveling [동명사] + is [단수동사] : \"여행하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : an idea [선행사] + that [관계대명사] + exists [동사] : \"단지 존재하는\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Is traveling, 여행하는 것은. in space through a wormhole, 우주에서 웜홀을 통해. simply an idea, 단지 아이디어인가요. that only exists in theory?, 이론상으로만 존재하는?. 이 문장 전체를 해석하면, 우주에서 웜홀을 통해 여행을 하는 것은 단지 이론상으로만 존재하는 아이디어인가요?","hl":"m"},{"n":21,"text":"이 문장은 웜홀을 통한 우주 여행이 과연 실제로 가능한 것인지, 아니면 그냥 머릿속 상상에 불과한 것인지를 묻고 있어요. 불가능해 보이는 일에 대한 회의적인 질문을 던지며 다음 답변을 유도하는 역할이죠.","hl":"mn"},{"n":22,"text":"첫 번째 포인트는 traveling입니다. 문장 맨 앞에서 주어 역할을 하는 동명사예요. 동명사 주어는 항상 단수 취급하기 때문에 문장의 첫 단어가 Is로 시작된 것이죠. 두 번째는 that only exists입니다. 주격 관계대명사 that이 앞에 있는 an idea를 꾸며주며 이론 속에서만 존재하는 아이디어라는 뜻을 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~하지 않겠어요 \u003c/span>\u003cspan class=\"en\">Dr. Sci: I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wouldn't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 말하지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">say\u003c/span> so.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 말하지는 않겠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 질문의 내용에 대해 \u003cb class=\"key\">부정\u003c/b>하며 다른 의견이 있음을 시사합니다. 웜홀 여행이 이론에만 그치지 않을 것이라는 \u003cb class=\"key\">희망\u003c/b>과 확신을 완곡하게 표현합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사를 이용한 완곡한 거절\u003c/span> : would [조동사] + not + say [동사원형] : \"그렇게 말하지는 않겠다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"I wouldn't, 나는 ~하지 않겠어요. say so, 그렇게 말하지.. 이 문장 전체를 해석하면, 그렇게 말하지는 않겠어요.","hl":"m"},{"n":24,"text":"박사님의 답변이죠. 웜홀 여행이 불가능하다는 앞 사람의 말에 동의하지 않는다는 뜻입니다. 앞으로 나올 긍정적인 전망을 암시하는 징검다리 같은 문장이에요.","hl":"mn"},{"n":25,"text":"여기서 wouldn't say를 주목해 보세요. I don't say라고 직설적으로 말하기보다는 would라는 조동사를 사용해서 자신의 의견을 조금 더 조심스럽고 완곡하게 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웜홀에 대한 논쟁은 \u003c/span>\u003cspan class=\"en\">The debate about wormholes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 진행 중이긴 하지만, \u003c/span>\u003cspan class=\"en\">is still \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ongoing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끊임없는 탐구와 연구로, \u003c/span>\u003cspan class=\"en\">but with persistent exploration and research,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 믿습니다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 결국 하나를 찾아낼 것이라고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">will\u003c/span> eventually find one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 통해 여행하는 법을 배울 것이라고.\u003c/span>\u003cspan class=\"en\">and learn \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">travel\u003c/span> through it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">웜홀에 대한 논쟁은 여전히 진행 중이긴 하지만, 끊임없는 탐구와 연구로 우리가 결국 하나를 찾아 그것을 통해 여행하는 법을 배울 수 있을 거라고 믿습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현재는 논쟁 중이지만 미래에는 반드시 \u003cb class=\"key\">실현\u003c/b>될 것이라는 긍정적 전망입니다. 인류의 \u003cb class=\"key\">끈기\u003c/b> 있는 연구가 결과를 낼 것임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사(진행 중인)\u003c/span> : is [be동사] + ongoing [보어/형용사] : \"진행 중인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that의 생략\u003c/span> : believe [동사] + (that) [생략된 접속사] + we will [주어+동사] : \"우리가 할 것이라고 믿는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : how [의문사] + to travel [to부정사] : \"여행하는 법\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"The debate about wormholes, 웜홀에 대한 논쟁은. is still ongoing, 여전히 진행 중이긴 하지만. but with persistent exploration and research, 끊임없는 탐구와 연구로. I believe, 나는 믿습니다. we will eventually find one, 우리가 결국 하나를 찾아낼 것이라고. and learn how to travel through it, 그리고 그것을 통해 여행하는 법을 배울 것이라고.. 이 문장 전체를 해석하면, 웜홀에 대한 논쟁은 여전히 진행 중이긴 하지만, 끊임없는 탐구와 연구로 우리가 결국 하나를 찾아 그것을 통해 여행하는 법을 배울 수 있을 거라고 믿습니다.","hl":"m"},{"n":27,"text":"아직 과학계에서 논란은 많지만, 우리가 계속 노력한다면 결국 웜홀을 찾아내고 여행까지 하게 될 거라는 아주 희망적인 메시지를 전달하고 있어요. 인간의 끈기 있는 탐구 정신을 강조하는 핵심적인 문장입니다.","hl":"mn"},{"n":28,"text":"첫 번째로 ongoing은 현재 진행 중이라는 상태를 말해요. 두 번째로 believe와 we 사이에는 목적어절을 이끄는 접속사 that이 생략되어 있습니다. 세 번째로 how to travel은 의문사 뒤에 to부정사가 붙어서 여행하는 방법이라는 뜻의 명사 덩어리가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌아보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 역사를.\u003c/span>\u003cspan class=\"en\">at our history.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 역사를 돌아보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거 인류가 이룬 성취를 근거로 들기 위해 화제를 전환하며 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 제시하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형(Look) + ~ : \"돌아보세요\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Look back, 돌아보세요.  at our history, 우리의 역사를.. 이 문장 전체를 해석하면, 우리의 역사를 돌아보세요.","hl":"m"},{"n":30,"text":"우리가 과거에 어떤 일들을 이루어냈는지 떠올려 보라는 뜻이에요. 이를 통해 미래의 가능성을 제시하는 전환점 역할을 하는 문장입니다.","hl":"mn"},{"n":31,"text":"동사원형으로 시작하는 명령문이에요. 원래 주어인 You가 생략된 상태로 쓰여서 독자에게 부드러운 권유를 나타내고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 달성해 왔습니다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We've \u003c/span>\u003cspan class=\"tgt\">achieved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 많은 것들을 \u003c/span>\u003cspan class=\"en\">so many \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불가능해 보였던 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">seemed\u003c/span> impossible\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에는.\u003c/span>\u003cspan class=\"en\">at first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 처음에는 불가능해보였던 아주 많은 것들을 달성해 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 불가능이 현재의 \u003cb class=\"key\">성공\u003c/b>이 된 사례들을 언급하며, \u003cb class=\"key\">웜홀 \u003c/b>\u003cb class=\"key\">여행\u003c/b> 또한 충분히 실현 가능하다는 논리를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(계속/완료)\u003c/span> : have + 과거분사(achieved) : \"달성해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(things) + that + 동사(seemed) : \"보였던 것들\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"We've achieved, 우리는 달성해 왔습니다. so many things, 아주 많은 것들을. that seemed impossible, 불가능해 보였던. at first, 처음에는.. 이 문장 전체를 해석하면, 우리는 처음에는 불가능해보였던 아주 많은 것들을 달성해 왔습니다.","hl":"m"},{"n":33,"text":"처음엔 안 될 것 같았던 일들도 인류는 결국 해냈다는 의미예요. 웜홀 탐구도 지금은 불가능해 보이지만 충분히 성공할 수 있다는 강력한 근거가 됩니다.","hl":"mn"},{"n":34,"text":"첫 번째로 We've achieved는 현재완료 시제예요. 과거부터 지금까지 쌓아온 업적을 강조하고 있어요. 두 번째로 that seemed는 주격 관계대명사예요. 앞에 나온 명사인 things를 뒤에서 자세하게 꾸며주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Who \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알겠어요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">knows\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누가 알겠어요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미래를 장담할 수는 없지만, 누구도 \u003cb class=\"key\">부정\u003c/b>할 수 없는 \u003cb class=\"key\">반전의 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 열어두는 수사 의문문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수사 의문문\u003c/span> : 의문사(Who) + 동사(knows)? : \"누가 알겠는가?\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Who, 누가. knows?, 알겠어요?. 이 문장 전체를 해석하면, 누가 알겠어요?","hl":"m"},{"n":36,"text":"정말 궁금해서 묻는 게 아니라, 아무도 미래는 모른다는 뜻이에요. 즉, 예상치 못한 긍정적인 결과가 나올 수도 있다는 설득력 있는 표현이죠.","hl":"mn"},{"n":37,"text":"이 문장은 수사 의문문이라고 해요. 답을 몰라서 묻는 게 아니라 아무도 모른다는 사실을 강조해서 미래의 반전 가능성을 암시하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쩌면\u003c/span>\u003cspan class=\"en\">Maybe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그 사람이 될 수 있다\u003c/span>\u003cspan class=\"en\">you can be the one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 답을 찾아내는!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어쩌면 여러분이 그 답을 찾아내는 그 사람이 될 수 있을지도요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학적 난제를 해결할 주인공이 바로 독자인 학생 본인이 될 수 있다는 \u003cb class=\"key\">희망\u003c/b>과 \u003cb class=\"key\">동기부여\u003c/b>를 주는 문장입니다. 미래의 가능성을 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">세대\u003c/b>의 역할로 강조하며 글을 마무리하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the one [명사/대명사] + [to find (to부정사구/수식)] : \"그 답을 찾아내는 (사람)\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"Maybe, 어쩌면. you can be the one, 여러분이 그 사람이 될 수 있다. to find the answer!, 그 답을 찾아내는!. 이 문장 전체를 해석하면, 어쩌면 여러분이 그 답을 찾아내는 그 사람이 될 수 있을지도요!","hl":"m"},{"n":39,"text":"이 문장은 전체 대화를 훈훈하게 마무리하며 여러분에게 큰 희망을 주는 역할을 해요. 아직 밝혀지지 않은 우주의 신비를 풀 주인공이 바로 여러분이라는 동기부여를 담고 있죠.","hl":"mn"},{"n":40,"text":"중요한 어법을 살펴볼까요? 문장 끝부분의 to find는 앞에 있는 대명사인 the one을 꾸며주고 있어요. 명사를 꾸며주는 형용사처럼 쓰였다고 해서 to부정사의 형용사적 용법이라고 부릅니다. 그 답을 찾아내는 사람이라고 해석하면 완벽해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인류가 웜홀을 통한 우주 여행에 있어 \u003cb class=\"key\">가망\u003c/b>이 없는 상태인지에 대한 질문으로 시작합니다.\u003c/li>\u003cli>과학자는 웜홀 논쟁이 진행 중이지만 지속적인 \u003cb class=\"key\">탐구\u003c/b>로 실현 가능하다고 답변합니다.\u003c/li>\u003cli>과거의 \u003cb class=\"key\">불가능\u003c/b>해 보였던 수많은 성취들을 언급하며 근거를 뒷받침합니다.\u003c/li>\u003cli>독자 중 누군가가 미래의 \u003cb class=\"key\">해답\u003c/b>을 찾을 주인공이 될 수 있다며 격려합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Despite current theoretical limitations, persistent research and our history of overcoming the impossible suggest that wormhole travel could become a reality in the future.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">웜홀 여행이 \u003cb class=\"key\">이론\u003c/b>에만 존재할 것이라는 비관적인 전망에 대해, 과거의 \u003cb class=\"key\">불가능\u003c/b>했던 성취를 근거로 미래의 실현 가능성을 제시하며 독자를 격려하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 본문을 통해 우리는 과학이 단순히 지식의 습득이 아니라, 불가능에 도전하는 과정이라는 것을 배웠습니다. 여러분도 박사님의 말씀처럼 미래의 해답을 찾는 주인공이 될 수 있다는 자신감을 가지세요. 오늘 배운 웜홀에 관한 표현들과 박사님의 논리적인 답변 구조를 잘 복습해 보길 바랍니다. 수고 많으셨어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
