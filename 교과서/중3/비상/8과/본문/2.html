</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 8과 본문2","audioDir":"2_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 8과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Wormholes: The Shortcut to Faster Space Travel\u003c/h1>\u003ch2>웜홀: 더 빠른 우주 여행을 위한 지름길\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우주 여행 시간을 단축하기 위해 \u003cb class=\"key\">사과\u003c/b>와 \u003cb class=\"key\">벌레\u003c/b>의 비유를 들어, 시공간의 통로인 \u003cb class=\"key\">웜홀\u003c/b>이 갖는 \u003cb class=\"key\">지름길\u003c/b>로서의 특징을 설명하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Wormholes provide a cosmic shortcut for faster space travel, much like a hole through an apple offers a shorter path for a worm.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우주의 신비로운 지름길, 웜홀에 대해 배워볼 거예요. 제목은 Wormholes: The Shortcut to Faster Space Travel입니다. 우리가 광대한 우주를 어떻게 하면 더 빨리 여행할 수 있을지에 대한 흥미로운 비유가 담긴 글이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우주 여행에서 엄청난 거리를 이동하기 위해 제안된 \u003cb class=\"key\">웜홀(Wormhole)\u003c/b>은 시공간의 두 지점을 잇는 가상의 통로입니다. 이는 아인슈타인의 \u003cb class=\"key\">상대성 \u003c/b>\u003cb class=\"key\">이론(Relativity \u003c/b>\u003cb class=\"key\">Theory)\u003c/b>을 바탕으로 시공간이 휠 수 있다는 가설에서 출발합니다. 마치 2차원 종이를 반으로 접어 두 점을 맞닿게 만드는 것과 같은 원리인데, 본문에서는 이를 \u003cb class=\"key\">사과(Apple)\u003c/b>에 비유하여 설명합니다. \u003cb class=\"key\">빛의 \u003c/b>\u003cb class=\"key\">속도(Speed \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Light)\u003c/b>로도 수만 년이 걸리는 먼 거리를 단축할 수 있는 수학적 가능성을 보여주는 흥미로운 \u003cb class=\"key\">천문학(Astronomy)\u003c/b> 개념입니다.\u003c/div>","segs":[{"n":2,"text":"우주는 너무 넓어서 빛의 속도로 가도 수만 년이 걸리는 곳이 많아요. 그래서 과학자들은 시공간을 접어서 이동하는 웜홀이라는 개념을 생각했죠. 이걸 이해하기 쉽게 사과에 비유한 것이 오늘 지문의 핵심이에요. 아인슈타인의 상대성 이론에서 파생된 이 상상은 공상과학 영화에서도 자주 등장한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우주 여행의 한계\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>120년이라는 긴 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">여행 \u003c/b>\u003cb class=\"key\">시간\u003c/b>에 놀라며, 이를 단축할 수 있는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 있는지 질문을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사과와 벌레 비유\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>질문에 답하기 위해 사과 위를 이동하는 벌레의 상황을 \u003cb class=\"key\">비유\u003c/b>로 설정하여 우주의 \u003cb class=\"key\">광대함\u003c/b>을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>지름길로서의 웜홀\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>벌레가 껍질을 도는 대신 \u003cb class=\"key\">벌레 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 선택하듯, 웜홀이 우주 여행의 \u003cb class=\"key\">지름길\u003c/b>이 됨을 설명합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 먼저 짚어볼게요. 질문으로 시작해서 비유를 거쳐 명쾌한 결론으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 백이십 년이라는 긴 시간에 놀라며 우주 여행의 한계를 언급해요. 그리고 세 번째 문장에서 더 빠른 방법이 없는지 우주 여행 시간의 의구심을 던지며 독자의 호기심을 자극합니다.","hl":"f0"},{"n":5,"text":"네 번째부터 일곱 번째 문장까지는 사과 표면을 기어가는 벌레를 우주에 비유해요. 벌레에게 사과 껍질이 우주만큼 광대함을 느끼게 하는 상황을 설정해서 문제의 본질을 보여줍니다.","hl":"f1"},{"n":6,"text":"마지막 여덟 번째부터 열 번째 문장에서는 벌레가 껍질을 도는 대신 벌레 구멍을 통과한다는 해결책을 제시해요. 결국 웜홀이 가장 빠른 효율성을 가진 지름길이라는 점을 강조하며 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">우주 여행의 속도 문제를 해결하기 위해 사과와 벌레라는 \u003cb class=\"key\">친숙한 \u003c/b>\u003cb class=\"key\">소재\u003c/b>를 비유로 활용합니다. 표면을 도는 방식과 구멍을 통과하는 방식을 \u003cb class=\"key\">대조\u003c/b>하여 설명의 이해도를 높입니다. 최종적으로 웜홀이 \u003cb class=\"key\">지름길(shortcut)\u003c/b>임을 밝히며 핵심 주제를 전달하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>in order to answer (4)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>Imagine (5)\u003c/b>\u003cspan>비유 시작\u003c/span>\u003cb>Now (8)\u003c/b>\u003cspan>대안 제시\u003c/span>\u003cb>because (10)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">faster way\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wormhole\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shortcut\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Outer Layer (Surface)\u003c/th>\u003cth>Wormhole\u003c/th>\u003c/tr>\u003ctr>\u003ctd>vast as the universe\u003c/td>\u003ctd>shortcut\u003c/td>\u003c/tr>\u003ctr>\u003ctd>takes a long time\u003c/td>\u003ctd>faster way\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 비유와 대조의 방식을 취하고 있어요. 사과라는 친숙한 소재를 가져와서 마지막에 주제를 밝히는 미괄식 구조를 보여주고 있네요.","hl":"ty"},{"n":8,"text":"네 번째 문장의 in order to answer는 답변을 시작하겠다는 신호예요. 다섯 번째 문장의 Imagine은 비유의 시작을 알리고, 열 번째 문장의 because는 웜홀을 선택한 이유를 명확히 설명해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Sci\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학(Science의 약어)\u003c/span>\u003c/div>\u003cdiv>\u003cb>long time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오랜 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>faster\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법, 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통과하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주, 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>in order to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기 위하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>question\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질문\u003c/span>\u003c/div>\u003cdiv>\u003cb>would like you to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>당신이 ~하면 좋겠다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a second\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌레\u003c/span>\u003c/div>\u003cdiv>\u003cb>detect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감지하다, 찾아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sweet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>달콤한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bottom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바닥, 아래\u003c/span>\u003c/div>\u003cdiv>\u003cb>surface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표면\u003c/span>\u003c/div>\u003cdiv>\u003cb>vast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>광대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>universe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주\u003c/span>\u003c/div>\u003cdiv>\u003cb>either A or B\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>A 혹은 B 둘 중 하나\u003c/span>\u003c/div>\u003cdiv>\u003cb>outer layer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겉면, 바깥 층\u003c/span>\u003c/div>\u003cdiv>\u003cb>wormhole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웜홀, 벌레 구멍\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shortcut\u003c/b>\u003cem>명사\u0 lp-chunk\">\u003cspan class=\"ko\">맨 위에서 아래로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">top \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bottom\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 맨 아래에 있는 달콤한 무언가를 감지하고 맨 위에서 아래로 이동하기를 원합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 벌레가 이동하려는 명확한 \u003cb class=\"key\">목적지\u003c/b>를 설정합니다. 이 문장은 나중에 벌레가 선택하게 될 두 가지 \u003cb class=\"key\">경로\u003c/b>를 비교하기 위한 기초가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [-thing/body/one] + [형용사] : \"달콤한 무언가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B 구문\u003c/span> : from [A] to [B] : \"맨 위에서 아래로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : [동사1] + and + [동사2] : \"감지하고 원한다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"It detects something sweet, 그것은 달콤한 무언가를 감지합니다. at the bottom, 맨 아래에 있는. and wants to move, 그리고 이동하기를 원합니다. from the top to the bottom, 맨 위에서 아래로. 이 문장 전체를 해석하면, 그것은 맨 아래에 있는 달콤한 무언가를 감지하고 맨 위에서 아래로 이동하기를 원합니다.","hl":"m"},{"n":27,"text":"벌레가 사과 아래쪽의 단맛을 느끼고 위에서 아래로 가고 싶어 하는 상황을 설정했어요. 이것은 우주에서 한 목적지로 이동하고 싶어 하는 동기를 설명합니다.","hl":"mn"},{"n":28,"text":"첫 번째로 something sweet처럼 -thing으로 끝나는 말은 형용사가 뒤에서 꾸며준다는 점이 아주 중요해요. 두 번째로 detects와 wants는 주어 It에 맞춰 나란히 연결된 병렬 구조이고, 세 번째로 from A to B는 시작과 도착점을 나타내는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 벌레에게, \u003c/span>\u003cspan class=\"en\">For the worm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과의 표면은 \u003c/span>\u003cspan class=\"en\">the apple's surface\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만큼이나 광대합니다 \u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">vast \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 우주\u003c/span>\u003cspan class=\"en\">our universe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 벌레에게 사과의 표면은 우리의 우주만큼이나 광대합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과를 벌레가 사는 \u003cb class=\"key\">우주\u003c/b>에 비유하여 벌레가 느끼는 거리감을 설명합니다. 벌레의 시점에서 사과 표면이 이동하기 매우 \u003cb class=\"key\">광대한\u003c/b> 공간임을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급 비교 (as + 형용사/부사 + as)\u003c/span> : as + [vast (형용사 원급)] + as + [대상] : \"우주만큼이나 광대한\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"For the worm, 그 벌레에게. the apple's surface, 사과의 표면은. is as vast as, 만큼이나 광대합니다. our universe, 우리의 우주. 이 문장 전체를 해석하면, 그 벌레에게 사과의 표면은 우리의 우주만큼이나 광대합니다.","hl":"m"},{"n":30,"text":"이 문장은 벌레의 입장에서 사과 표면이 얼마나 넓은지를 우리 우주에 빗대어 설명하고 있어요. 벌레가 사과 끝에서 끝으로 가는 것이 마치 우리가 우주를 여행하는 것만큼 큰 일이라는 비유적인 상황을 보여줍니다.","hl":"mn"},{"n":31,"text":"중요한 어법은 as vast as 부분입니다. 첫 번째 as와 두 번째 as 사이에 형용사 원급인 vast를 써서 원급 비교를 만들었죠. 사과 표면이 우리 우주만큼이나 아주 넓다는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 그 벌레는 \u003c/span>\u003cspan class=\"en\">Now the worm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이동하거나 \u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바깥 표면의 껍질을 돌아서 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">outer \u003c/span>\u003cspan class=\"tgt\">layer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌레 구멍 아래로 이동할 수 있습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">wormhole\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 그 벌레는 바깥 표면의 껍질을 돌아서 이동하거나 벌레 구멍 아래로 이동할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 벌레가 목표 지점에 도달하기 위해 선택할 수 있는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 제시합니다. 사과의 \u003cb class=\"key\">겉면\u003c/b>을 도는 방식과 사과를 가로지르는 \u003cb class=\"key\">웜홀\u003c/b> 방식을 대조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 either A or B\u003c/span> : either + [A (move around ~)] + or + [B (down a wormhole)] : \"바깥 껍질을 돌아서 이동하거나 벌레 구멍 아래로 이동하거나\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Now the worm, 이제 그 벌레는. can either move, 이동하거나. around the outer layer, 바깥 표면의 껍질을 돌아서. or down a wormhole, 벌레 구멍 아래로 이동할 수 있습니다.. 이 문장 전체를 해석하면, 이제 그 벌레는 바깥 표면의 껍질을 돌아서 이동하거나 벌레 구멍 아래로 이동할 수 있습니다.","hl":"m"},{"n":33,"text":"벌레가 사과 아래쪽으로 가기 위한 두 가지 선택지를 말하고 있어요. 겉면을 따라 길게 돌아갈지, 아니면 사과 속을 뚫고 지름길로 갈지를 설명하는 부분입니다.","hl":"mn"},{"n":34,"text":"첫 번째 포인트는 either A or B 구문입니다. either 뒤에 나오는 겉면으로 돌기라는 선택지와 or 뒤에 나오는 웜홀로 가기라는 선택지를 연결하고 있죠. 두 가지 중 하나를 할 수 있다는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Which \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각하십니까 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌레가 선택할 거라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">choose?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">벌레가 어떤 것을 선택할 거라고 생각하십니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자의 참여를 유도하며 벌레의 합리적인 선택이 무엇일지 \u003cb class=\"key\">질문\u003c/b>을 던집니다. 이어지는 문장에서 \u003cb class=\"key\">웜홀의 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 설명하기 위한 도입부 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생각/추측 동사가 쓰인 간접의문문\u003c/span> : [의문사 Which] + do you think + [주어 it] + [동사 will choose] : \"어느 것을 벌레가 선택할 것이라고 생각하니?\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Which, 어떤 것을. do you think, 생각하십니까. it will choose?, 벌레가 선택할 거라고. 이 문장 전체를 해석하면, 벌레가 어떤 것을 선택할 거라고 생각하십니까?","hl":"m"},{"n":36,"text":"앞서 말한 두 가지 길 중에서 벌레가 과연 무엇을 고를지 여러분에게 질문을 던지고 있어요. 당연히 더 빠른 길을 고르겠죠?","hl":"mn"},{"n":37,"text":"이 문장은 시험에 정말 자주 나옵니다. 원래 do you think와 which it will choose가 합쳐진 형태인데요. think처럼 머릿속으로 생각하는 동사가 오면 which라는 의문사가 문장 맨 앞으로 튀어나와야 합니다. 그래서 Which do you think 순서가 된 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음, 그것은 선택할 것입니다\u003c/span>\u003cspan class=\"en\">Well, it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">choose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌레 구멍을\u003c/span>\u003cspan class=\"en\">the wormhole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것이 지름길이기 때문입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> it is a shortcut.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음, 벌레 구멍을 선택할 것인데 왜냐하면 그것이 지름길이기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과 비유를 통해 \u003cb class=\"key\">웜홀\u003c/b>의 핵심 원리를 설명하는 문장입니다. 벌레가 사과 표면을 따라 길게 돌아가는 대신 내부를 관통하는 것처럼, 우주 여행에서 \u003cb class=\"key\">지름길\u003c/b> 역할을 하는 공간이 존재함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would (추측/가정)\u003c/span> : would [조동사] + choose [동사원형] : \"선택할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사\u003c/span> : because [접속사] + it [주어] + is [동사] : \"왜냐하면 ~이기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"Well, it would choose, 음, 그것은 선택할 것입니다. the wormhole, 벌레 구멍을. because it is a shortcut, 왜냐하면 그것이 지름길이기 때문입니다.. 이 문장 전체를 해석하면, 음, 벌레 구멍을 선택할 것인데 왜냐하면 그것이 지름길이기 때문입니다.","hl":"m"},{"n":39,"text":"벌레가 사과 껍질 위를 길게 돌아가는 것보다 사과를 관통해서 가는 게 훨씬 빠르겠죠. 여기서 wormhole은 광대한 우주를 빠르게 통과할 수 있게 해주는 지름길의 역할을 비유적으로 나타내고 있어요.","hl":"mn"},{"n":40,"text":"첫 번째로 살펴볼 부분은 would choose입니다. 앞 문장에서 던진 질문에 대해 벌레가 할 법한 행동을 가정하고 추측하는 표현이에요. 두 번째 포인트는 because입니다. 뒤에 it is라는 주어와 동사가 있는 완전한 문장이 이어지는 접속사로 쓰여서 구체적인 이유를 설명해주고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>120년이라는 긴 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">여행\u003c/b> 시간을 단축할 수 있는 방법에 대해 질문합니다.\u003c/li>\u003cli>사과와 벌레의 관계를 통해 \u003cb class=\"key\">시공간\u003c/b>의 이동 경로를 비유적으로 제시합니다.\u003c/li>\u003cli>벌레가 사과 표면을 도는 것보다 \u003cb class=\"key\">벌레 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 통과하는 것이 더 빠릅니다.\u003c/li>\u003cli>웜홀은 우주의 먼 거리를 잇는 효율적인 \u003cb class=\"key\">지름길\u003c/b> 역할을 수행합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Wormholes provide a cosmic shortcut for faster space travel, much like a hole through an apple offers a shorter path for a worm.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우주 여행 시간을 단축하기 위해 \u003cb class=\"key\">사과\u003c/b>와 \u003cb class=\"key\">벌레\u003c/b>의 비유를 들어, 시공간의 통로인 \u003cb class=\"key\">웜홀\u003c/b>이 갖는 \u003cb class=\"key\">지름길\u003c/b>로서의 특징을 설명하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"자, 오늘은 사과와 벌레를 통해 우주의 지름길인 웜홀을 이해해 보았습니다. 시공간을 가로지르는 이런 과학적 상상력이 미래의 우주 여행을 가능하게 할지도 몰라요. 오늘 배운 비유의 구조를 잘 복습하고 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
