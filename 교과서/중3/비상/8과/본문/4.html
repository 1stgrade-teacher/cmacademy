@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중3 기말 중3 비상 8과 본문4","audioDir":"4_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중3\u003cbr>비상 8과\u003cbr>본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중3 기말\u003c/div>\u003ch1>Wormholes: Theoretical Shortcuts vs. Practical Dangers\u003c/h1>\u003ch2>웜홀의 꿈과 현실: 이론적 지름길과 실제적 위험\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 웜홀은 우주 여행의 \u003cb class=\"key\">지름길\u003c/b>로 여겨지지만, 현재는 \u003cb class=\"key\">이론상\u003c/b>으로만 존재하며 실제로는 매우 \u003cb class=\"key\">불안정\u003c/b>하여 위험할 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>While wormholes offer a theoretical shortcut through space, they remain unproven and pose significant physical dangers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 중학교 삼학년 비상 팔과의 본문 네 번째 이야기를 함께 살펴볼 거예요. 이 지문은 우주 여행의 꿈인 웜홀에 대한 환상과 그 뒤에 숨겨진 차가운 현실을 다루고 있답니다. 웜홀이 과연 우리를 우주 끝까지 데려다줄 수 있을지 요지와 요약을 통해 먼저 확인해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">상대성 \u003c/b>\u003cb class=\"key\">이론\u003c/b>에서 유도된 웜홀(Wormhole)은 시공간의 두 지점을 잇는 통로로, 사과 표면을 기어가는 벌레가 속을 파서 반대편으로 가는 \u003cb class=\"key\">벌레 \u003c/b>\u003cb class=\"key\">구멍\u003c/b> 비유에서 이름이 유래했습니다. 이론적으로는 \u003cb class=\"key\">빛의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>보다 빠르게 우주를 여행하게 해주지만, 실제 존재 여부는 아직 밝혀지지 않았습니다. 만약 존재하더라도 웜홀을 유지하기 위해 엄청난 양의 \u003cb class=\"key\">에너지\u003c/b>가 필요하며, 중력의 영향으로 순식간에 닫힐 수 있습니다. 마치 종이를 접어 구멍을 뚫는 것처럼 시공간을 \u003cb class=\"key\">압축\u003c/b>하는 개념이지만, 실제로는 우주선을 파괴할 만큼 강력한 \u003cb class=\"key\">중력장\u003c/b>을 가질 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"웜홀이라는 단어는 사과를 뚫고 지나가는 벌레 구멍에서 따온 이름이에요. 과학적으로는 상대성 이론에서 가능성을 제시한 시공간의 통로를 말하죠. 마치 종이를 접어서 구멍을 뚫으면 멀리 떨어진 두 점이 바로 만나는 것과 같은 원리랍니다. 하지만 영화에서 보는 것처럼 안전한 길은 아니에요. 엄청난 중력이 작용해서 순식간에 닫힐 수도 있고 사람이 통과하기엔 너무 작을 수도 있거든요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>지름길로서의 웜홀\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">벌레 \u003c/b>\u003cb class=\"key\">구멍\u003c/b> 비유를 통해 웜홀이 우주 여행의 시간을 단축해 줄 수 있다는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">전망\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이론적 한계 지적\u003csmall>반전 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>박사님이 웜홀이 현재 \u003cb class=\"key\">이론상\u003c/b>으로만 존재할 뿐 실제 증명된 것이 아님을 밝히며 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">제약\u003c/b>을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>물리적 위험 경고\u003csmall>결론 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>설령 웜홀을 발견하더라도 그 구조가 매우 \u003cb class=\"key\">불안정\u003c/b>하여 우주선이 \u003cb class=\"key\">파괴\u003c/b>될 수 있다는 치명적인 위험성을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 웜홀의 장점부터 위험성까지 글의 흐름을 하나씩 짚어볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 웜홀의 개념과 매력을 소개하고 있어요. 사과에 난 벌레 구멍처럼 우주의 아주 먼 곳을 빠르게 연결해 주는 환상적인 지름길로 묘사되고 있죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 분위기가 바뀝니다. 박사님은 너무 일찍 기뻐하지 말라며 경고하시는데 웜홀이 현재는 실제가 아닌 이론상으로만 존재한다는 사실을 짚어줍니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장부터 마지막 여덟 번째 문장까지는 실제 위험성을 경고해요. 웜홀을 찾더라도 구조가 매우 불안정해서 우주선이 들어가는 순간 산산조각이 날 수도 있다는 아주 무서운 이야기로 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">웜홀의 이점(도입)에서 시작하여 \u003cb class=\"key\">이론적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 지적하고, 마지막에 실제 여행 시 발생할 수 있는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">위험성\u003c/b>을 강조하며 마무리하는 구조입니다. 학생의 호기심 어린 질문에 박사님이 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 바탕으로 답하며 주의를 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Yes, but (3)\u003c/b>\u003cspan>긍정 후 반전\u003c/span>\u003cb>Even if (6)\u003c/b>\u003cspan>양보의 조건\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wormhole\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">such wormholes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>이론적 웜홀\u003c/th>\u003cth>실제적 웜홀\u003c/th>\u003c/tr>\u003ctr>\u003ctd>수십억 광년을 빠르게 이동\u003c/td>\u003ctd>매우 불안정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>벌레 구멍 같은 통로\u003c/td>\u003ctd>우주선이 파손될 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 웜홀에 대한 호기심 어린 질문에 박사님이 답해주는 질문 답변 구조로 되어 있어요. 처음에는 긍정적인 기대를 보여주다가 뒤로 갈수록 경고와 위험을 강조하는 미괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":8,"text":"세 번째 문장에서 반전을 나타내는 Yes, but 이라는 표현이 아주 중요해요. 또한 여섯 번째 문장의 Even if 는 우리가 웜홀을 발견하는 상황을 가정하며 그 뒤에 올 위험성을 예고하는 신호 역할을 하고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wormhole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웜홀\u003c/span>\u003c/div>\u003cdiv>\u003cb>just like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>apple\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사과\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주\u003c/span>\u003c/div>\u003cdiv>\u003cb>billion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>10억\u003c/span>\u003c/div>\u003cdiv>\u003cb>light-year\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광년\u003c/span>\u003c/div>\u003cdiv>\u003cb>away\u003c/b>\u003cem>부사\u003c/em>\u003cspan>떨어져서\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축하하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>only\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오직\u003c/span>\u003c/div>\u003cdiv>\u003cb>need to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 필요가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even if\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>before\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>go through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 통과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unstable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불안정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>spaceship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주선\u003c/span>\u003c/div>\u003cdiv>\u003cb>fly into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~안으로 날아가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>might\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~일지도 모른다\u003c/span>\u003c/div>\u003cdiv>\u003cb>crush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>으스러뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>broken into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 조각나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 billion 은 십억이라는 큰 단위이고 light-year 는 빛이 일 년 동안 가는 거리인 광년을 뜻해요. 그리고 unstable 은 안정이 되지 않은 불안정한 상태를 말하는데 웜홀의 특징을 아주 잘 설명해 주는 단어예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">exist\u003c/b>\u003cspan class=\"m\">존재하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">occur\u003c/span>\u003cspan class=\"s\">live\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003cspan class=\"a\">perish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">theory\u003c/b>\u003cspan class=\"m\">이론\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hypothesis\u003c/span>\u003cspan class=\"s\">notion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fact\u003c/span>\u003cspan class=\"a\">reality\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">빨리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unstable\u003c/b>\u003cspan class=\"m\">불안정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shaky\u003c/span>\u003cspan class=\"s\">insecure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stable\u003c/span>\u003cspan class=\"a\">steady\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">crush\u003c/b>\u003cspan class=\"m\">으스러뜨리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smash\u003c/span>\u003cspan class=\"s\">shatter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">restore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어를 더 깊게 공부해 볼까요? 존재하다라는 뜻의 exist 는 occur 와 비슷하지만 사라지다라는 뜻의 perish 와는 반대되는 개념이에요. 이론이라는 theory 는 사실을 뜻하는 fact 와 대조되며 불안정한 상태인 unstable 은 stable 과 반대라는 점을 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마치 ~처럼\u003c/span>\u003cspan class=\"en\">Sci Teen: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웜홀\u003c/span>\u003cspan class=\"en\">a wormhole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과에 있는\u003c/span>\u003cspan class=\"en\">in the apple,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇죠?\u003c/span>\u003cspan class=\"en\">right?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사과에 있는 벌레 구멍처럼요, 그렇죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추상적인 우주의 웜홀을 일상적인 사과의 벌레 구멍에 \u003cb class=\"key\">비유\u003c/b>하여 이해를 돕고 있습니다. 상대방의 설명이 맞는지 확인하며 \u003cb class=\"key\">동의\u003c/b>를 구하는 대화의 시작입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like의 강조\u003c/span> : just [부사] + like [전치사] + 명사 : \"마치 ~와 똑같이\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Just like, 마치 ~처럼. a wormhole, 웜홀. in the apple, 사과에 있는. right?, 그렇죠?. 이 문장 전체를 해석하면, 사과에 있는 벌레 구멍처럼요, 그렇죠?","hl":"m"},{"n":12,"text":"학생인 Sci Teen이 앞에서 설명한 내용을 사과 속의 벌레 구멍이라는 비유를 들어서 다시 한번 확인하는 장면이에요. 어려운 우주 개념을 일상적인 사과에 빗대어 비유하고 있네요.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 Just like입니다. 전치사 like는 뭐뭐처럼이라는 뜻인데 그 앞에 just를 써서 유사성을 더 강조했어요. 뒤에 나오는 명사구 a wormhole과 연결되어 마치 벌레 구멍과 똑같다는 느낌을 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그런 웜홀들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">wormholes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에 존재한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">existed \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">space, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 장소들에 도달할 수 있을 텐데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">get\u003c/span> to places\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수십억 광년 떨어져 있는\u003c/span>\u003cspan class=\"en\">billions of light-years away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게!\u003c/span>\u003cspan class=\"en\">quickly!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 웜홀이 우주에 존재한다면 우리는 수십억 광년 떨어져 있는 곳에 빠르게 도달할 수 있을 텐데요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실제로는 존재 여부를 알 수 없는 상황을 \u003cb class=\"key\">가정\u003c/b>하여 그 이점을 설명합니다. 엄청난 거리를 순식간에 이동하는 \u003cb class=\"key\">초고속 \u003c/b>\u003cb class=\"key\">여행\u003c/b>의 가능성을 언급합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + 주어 + 과거동사(existed), 주어 + 조동사 과거(could) + 동사원형(get) : \"만약 ~한다면, ~할 수 있을 텐데\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"If such wormholes, 만약 그런 웜홀들이. existed in space, 우주에 존재한다면. we could get to places, 우리는 장소들에 도달할 수 있을 텐데. billions of light-years away, 수십억 광년 떨어져 있는. quickly!, 빠르게!. 이 문장 전체를 해석하면, 그런 웜홀이 우주에 존재한다면 우리는 수십억 광년 떨어져 있는 곳에 빠르게 도달할 수 있을 텐데요!","hl":"m"},{"n":15,"text":"현재 우주에 그런 웜홀이 실제로 있는지 모르지만, 만약 있다면 아주 먼 거리를 빠르게 갈 수 있을 거라고 상상하는 문장이에요. 가정법을 사용해서 초고속 여행에 대한 기대를 보여줍니다.","hl":"mn"},{"n":16,"text":"이 문장은 별표 세 개짜리 중요한 가정법 과거 문장입니다. 첫 번째로 If 절의 동사 existed가 과거형이고, 두 번째로 주절에 조동사 과거형 could가 쓰인 것을 확인하세요. 현재 우주에 존재하지 않는 상황을 가정하는 것이라 형태는 과거지만 해석은 존재한다면, 갈 수 있을 텐데라고 현재로 해석해야 합니다. 실현 가능성이 낮은 일을 말할 때 쓰는 핵심 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박사님:\u003c/span>\u003cspan class=\"en\">Dr. Sci:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇죠, 하지만\u003c/span>\u003cspan class=\"en\">Yes, but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 이릅니다\u003c/span>\u003cspan class=\"en\">it's \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">early \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축하하기에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">celebrate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇죠, 하지만 축하하기에는 너무 이릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긍정적인 가정 뒤에 \u003cb class=\"key\">반전\u003c/b>을 제시하며 현실적인 한계를 지적합니다. 아직 해결해야 할 문제가 많다는 \u003cb class=\"key\">경고\u003c/b>의 메시지를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">too ~ to ... 용법\u003c/span> : too + 형용사(early) + to부정사(to celebrate) : \"축하하기에는 너무 이른 (너무 ~해서 ...할 수 없다)\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Dr. Sci, 박사님:. Yes, but, 그렇죠, 하지만. it's too early, 너무 이릅니다. to celebrate, 축하하기에는. 이 문장 전체를 해석하면, 그렇죠, 하지만 축하하기에는 너무 이릅니다.","hl":"m"},{"n":18,"text":"앞서 말한 희망적인 이야기에 대해 박사님이 신중한 태도를 보이는 장면이에요. 아직은 기뻐하기보다 해결해야 할 현실적인 장벽이 많다는 의미로 반전을 주고 있죠.","hl":"mn"},{"n":19,"text":"여기서 핵심은 too와 to부정사가 연결된 구조입니다. 너무 일러서 축하할 수 없다, 즉 시기상조라는 뜻이죠. 형용사 early를 사이에 두고 너무 뭐뭐해서 뭐뭐할 수 없다는 부사적 용법의 의미를 정확히 파악해야 합니다. 시험에서 아주 자주 나오는 구문이니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웜홀은\u003c/span>\u003cspan class=\"en\">Wormholes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">exist\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이론상에서만요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">theory \u003c/span>\u003cspan class=\"tgt\">only\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">웜홀은 이론상에서만 존재합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀이 아직 실제로 발견되거나 증명된 대상이 아니라, 과학적 \u003cb class=\"key\">가설\u003c/b> 단계임을 설명합니다. 현실에서의 실현 가능성보다는 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">계산\u003c/b>이나 이론적인 가능성에 머물러 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">1형식 자동사\u003c/span> : S(주어) + V(완전 자동사) : \"존재한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(부사구)\u003c/span> : in [전치사] + theory [명사] + only [부사] : \"이론상에서만\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Wormholes, 웜홀은. exist, 존재합니다. in theory only, 이론상에서만요.. 이 문장 전체를 해석하면, 웜홀은 이론상에서만 존재합니다.","hl":"m"},{"n":21,"text":"웜홀이 아직 실제로 발견된 게 아니라는 뜻이에요. 과학적인 가설 속에서만 가능한 이야기라는 점을 박사님이 강조하고 있죠.","hl":"mn"},{"n":22,"text":"첫 번째로 exist는 존재하다라는 뜻의 자동사로 뒤에 목적어가 오지 않아요. 두 번째로 in theory only는 이론상에서만이라는 뜻의 전치사구로 문장 끝에서 동사를 수식해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Sci Teen: So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 해야 할 모든 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 찾는 거네요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> one,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇죠?\u003c/span>\u003cspan class=\"en\">right?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 우리가 해야 할 것이라고는 그것을 찾는 거네요, 그렇죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학생이 웜홀 이용의 해결책을 매우 \u003cb class=\"key\">단순\u003c/b>하게 생각하며, 찾는 것만이 유일한 \u003cb class=\"key\">과제\u003c/b>라고 박사에게 되묻는 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사가 생략된 명사절 주어\u003c/span> : all [선행사] + (that) [목적격 관계대명사 생략] + we [S'] + need to do [V'] : \"우리가 해야 할 모든 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to가 생략된 보어\u003c/span> : is [be동사] + (to) [보어자리 to생략] + find [동사원형] : \"찾는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"So, 그러면. all we need to do, 우리가 해야 할 모든 것은. is find one, 그것을 찾는 거네요. right?, 그렇죠?. 이 문장 전체를 해석하면, 그러면 우리가 해야 할 것이라고는 그것을 찾는 거네요, 그렇죠?","hl":"m"},{"n":24,"text":"웜홀이 이론적으로 가능하다니 찾기만 하면 된다고 낙관적으로 생각하는 장면이에요. 문장에서 all은 우리가 해야 할 유일한 일을 의미해요.","hl":"mn"},{"n":25,"text":"첫 번째로 all we need to do는 관계대명사 that이 생략된 형태로 우리가 해야 하는 모든 것이라는 주어 역할을 해요. 두 번째로 is find 부분은 원래 is to find인데 주어에 all이나 do 동사가 들어있을 때 to를 생략하고 동사원형만 쓰기도 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것을 찾는다고 하더라도,\u003c/span>\u003cspan class=\"en\">Dr. Sci: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> we find one,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 것들이 있습니다\u003c/span>\u003cspan class=\"en\">there are many \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고려해야 할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 그것을 통과하여 가기 전에요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">through\u003c/span> one.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 그것을 찾는다고 하더라도 실제로 그것을 통과하여 가기 전에 고려해야 할 것들이 많이 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀을 찾는 것보다 훨씬 더 큰 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">문제\u003c/b>들이 있음을 시사하며, 웜홀 여행의 \u003cb class=\"key\">위험성\u003c/b>에 대해 경고하는 맥락입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Even if [접속사] + S + V : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : things [명사] + to consider [to부정사] : \"고려해야 할 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사+동명사 구문\u003c/span> : before [전치사] + going [동명사] : \"실제로 통과하기 전에\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Even if we find one, 우리가 그것을 찾는다고 하더라도. there are many things, 많은 것들이 있습니다. to consider, 고려해야 할. before actually going through one, 실제로 그것을 통과하여 가기 전에요.. 이 문장 전체를 해석하면, 우리가 그것을 찾는다고 하더라도 실제로 그것을 통과하여 가기 전에 고려해야 할 것들이 많이 있습니다.","hl":"m"},{"n":27,"text":"단순히 찾는 것이 끝이 아니라 안전과 같은 여러 요소를 고려해야 한다는 조언이에요. 웜홀 여행이 결코 쉽지 않음을 암시하고 있어요.","hl":"mn"},{"n":28,"text":"첫 번째로 Even if는 비록 ~일지라도라는 양보의 의미를 나타내는 접속사예요. 두 번째로 to consider는 앞에 있는 things를 꾸며주는 형용사적 용법의 to부정사입니다. 세 번째로 going through는 전치사 before 뒤에 온 동명사 형태로 통과하는 것이라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웜홀은\u003c/span>\u003cspan class=\"en\">A wormhole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 불안정한\u003c/span>\u003cspan class=\"en\">very unstable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">웜홀은 매우 불안정할 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀의 이론적 매력 뒤에 숨겨진 실제적인 \u003cb class=\"key\">위험성\u003c/b>을 제시하는 문장입니다. 상태가 유지되지 않고 변하기 쉬운 \u003cb class=\"key\">불안정성\u003c/b>을 강조하여 웜홀 여행의 어려움을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 과거형(추측)\u003c/span> : would [조동사] + be [동사원형] : \"일 것이다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"A wormhole, 웜홀은. would be, 일 것입니다. very unstable, 매우 불안정한. 이 문장 전체를 해석하면, 웜홀은 매우 불안정할 것입니다.","hl":"m"},{"n":30,"text":"이 문장은 웜홀이 이론적으로는 멋지지만 실제로는 아주 위험할 수 있다는 점을 알려줘요. 여기서 핵심은 웜홀의 불안정성이라는 특징이 여행을 방해하는 요소가 된다는 것이죠.","hl":"mn"},{"n":31,"text":"첫 번째로 짚어볼 포인트는 would be 입니다. 여기서는 확실한 사실이 아니라 그럴 수도 있다는 추측을 나타내기 위해 조동사의 과거형인 would를 사용했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우주선이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">spaceship \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 안으로 날아가게 되면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">flew \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">one, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 부서질 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">crushed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 산산조각이 날 수도 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">broken\u003c/span> into pieces.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우주선이 그 안으로 날아가게 되면, 그것은 부서지거나 산산조각이 날 수도 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웜홀에 들어갔을 때 벌어질 수 있는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">파괴\u003c/b>를 생생하게 묘사합니다. \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거\u003c/b>를 사용하여 현재 일어나기 힘든 가상의 상황을 가정하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + 주어 + 동사의 과거형, 주어 + 조동사의 과거형 + 동사원형 : \"만약 ~한다면, ~할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 병렬 구조\u003c/span> : be + [과거분사1(crushed)] + or + [과거분사2(broken)] : \"부서지거나 깨지다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"If a spaceship, 만약 우주선이. flew into one, 그 안으로 날아가게 되면. it might be crushed, 그것은 부서질 수도 있다. or broken into pieces, 혹은 산산조각이 날 수도 있다.. 이 문장 전체를 해석하면, 만약 우주선이 그 안으로 날아가게 되면, 그것은 부서지거나 산산조각이 날 수도 있습니다.","hl":"m"},{"n":33,"text":"우주선이 웜홀에 들어갔을 때 겪게 될 끔찍한 물리적 파괴 상황을 설명하는 문장이에요. 실제로 일어난 일은 아니지만 만약 그렇다면 어떻게 될지 상상해 보는 것이죠.","hl":"mn"},{"n":34,"text":"첫 번째로 if절의 동사 flew와 주절의 might be를 보세요. 현재 상황을 가정하는 가정법 과거 형식을 취하고 있어요. 두 번째로는 be 동사 뒤에 crushed와 broken이 나란히 온 것을 확인하세요. 우주선이 부서지는 수동의 의미를 나타내는 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>웜홀은 사과의 벌레 구멍처럼 우주를 \u003cb class=\"key\">빠르게\u003c/b> 연결하는 통로입니다.\u003c/li>\u003cli>현재 웜홀은 실제로 증명된 것이 아니라 \u003cb class=\"key\">이론\u003c/b> 속에만 존재합니다.\u003c/li>\u003cli>웜홀은 구조적으로 매우 \u003cb class=\"key\">불안정\u003c/b>하여 유지하기 어렵습니다.\u003c/li>\u003cli>우주선이 통과할 때 \u003cb class=\"key\">파손\u003c/b>되거나 부서질 위험이 매우 큽니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>While wormholes offer a theoretical shortcut through space, they remain unproven and pose significant physical dangers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 웜홀은 우주 여행의 \u003cb class=\"key\">지름길\u003c/b>로 여겨지지만, 현재는 \u003cb class=\"key\">이론상\u003c/b>으로만 존재하며 실제로는 매우 \u003cb class=\"key\">불안정\u003c/b>하여 위험할 수 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자 오늘 공부한 내용을 정리해 볼게요. 웜홀은 매력적인 이론이지만 실제로는 매우 불안정하고 위험할 수 있다는 점이 핵심이었죠. 우주 과학의 신비와 함께 문법적인 포인트들도 잘 복습하시길 바라요. 오늘 수업은 여기서 마칠게요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
