</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"8과 문법2","title":"중3 비상 7과 문법1 접속사 as","audioDir":"중3_비상_8과_문법2_with+명사+분사_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">with + 명사 + 분사 (분사구문)\u003c/div>\u003ch1>with + 명사 + 분사, 장면을 그리는 마법의 표현\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>「with+명사+분사」를 이용해 ‘~이 …한 채, ~하면서’라는 동시 상황을 능동·수동에 맞게 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 문장에 장면 하나를 살짝 덧붙여 주는 아주 멋진 표현을 배울 거예요. 바로 with 다음에 명사와 분사를 붙여서 ‘~이 …한 채’라든가 ‘~이 …하면서’라는 뜻을 만드는 방법이에요. 이 표현 하나만 잘 익히면 여러분이 쓴 문장이 훨씬 그림처럼 생생해진답니다. 오늘 예문들을 같이 읽으면서 능동일 때와 수동일 때 분사를 어떻게 골라 쓰는지 꼭 잡아 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">의미: ‘~이 …한 채, ~이 …하면서’\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「with+명사+분사」는 ‘~이 …한 채, ~이 …하면서’라는 뜻으로, \u003cb class=\"key\">동시 동작\u003c/b>이나 \u003cb class=\"key\">부가적인 상황\u003c/b>을 생생하게 표현할 때 사용합니다. 주절의 동작에 곁들여지는 또 하나의 장면을 덧붙인다고 생각하면 쉬워요.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사 + 분사 = ~이 …한 채, ~이 …하면서\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The girl ran \u003cspan class=\"fx\">with her hair blowing in the wind\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 소녀는 머리카락이 바람에 날리는 채로 달렸다.\u003c/div>\u003cdiv class=\"g-note\">소녀가 달리는 동작과 머리카락이 날리는 상황이 동시에 일어나는 장면을 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Jason thought about the film \u003cspan class=\"fx\">with his eyes closed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">제이슨은 눈을 감은 채로 그 영화에 대해 생각했다.\u003c/div>\u003cdiv class=\"g-note\">생각하는 동작에 ‘눈을 감은 상태’라는 부가적인 상황을 덧붙였다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>해석할 때는 \u003cb class=\"key\">주절의 동작\u003c/b>을 먼저 읽고, with 이하를 ‘~한 채’로 자연스럽게 붙여 주면 됩니다.\u003c/div>","segs":[{"n":2,"text":"오늘 배울 표현은 with 다음에 명사, 그다음에 분사가 오는 형태예요. 뜻은 ‘~이 …한 채’ 또는 ‘~이 …하면서’라고 해석하면 됩니다. 주절에서 어떤 동작이 일어날 때 그와 동시에 벌어지는 다른 상황을 덧붙여 말할 때 쓰는 표현이죠. 그래서 이 표현을 쓰면 문장이 훨씬 그림처럼 생생하게 느껴진답니다. 먼저 예문 두 개를 같이 읽어 볼게요.","hl":"rule"},{"n":3,"text":"The girl ran with her hair blowing in the wind. 이 문장은 그 소녀는 머리카락이 바람에 날리는 채로 달렸다라는 뜻이에요. 소녀가 달리고 있는데 그 순간 머리카락도 바람에 날리고 있죠. 이렇게 동시에 벌어지는 장면을 with 명사 분사로 붙여 주면 문장이 아주 생생해진답니다.","hl":"ex-0"},{"n":4,"text":"Jason thought about the film with his eyes closed. 이 문장은 제이슨은 눈을 감은 채로 그 영화에 대해 생각했다라는 뜻이에요. 영화에 대해 생각하는 동작에 눈을 감고 있었다는 상황이 살짝 덧붙여져 있죠. 이렇게 주된 동작에 곁들이는 상황을 with 명사 분사로 표현한다고 기억해 두세요.","hl":"ex-1"},{"n":5,"text":"해석할 때는 주절의 동작을 먼저 읽고 with 이하를 ‘~한 채’로 붙여 주면 자연스러워요. 소녀가 달렸다, 머리카락이 날리는 채로, 이런 순서로 읽으면 된답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">형태: 능동이면 현재분사, 수동이면 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「with+명사+분사」에서 명사와 분사가 \u003cb class=\"key\">능동\u003c/b> 관계이면 \u003cb class=\"key\">현재분사\u003c/b>, \u003cb class=\"key\">수동\u003c/b> 관계이면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다. 즉 명사가 분사의 동작을 ‘하는’ 쪽이면 ing, ‘당하는’ 쪽이면 p.p.예요.\u003cdiv>\u003cspan class=\"g-formula\">능동: with + 명사 + 현재분사(-ing) / 수동: with + 명사 + 과거분사(p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I ran across the yard \u003cspan class=\"fx\">with my dog following me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 개가 나를 따라오고 있는 채로 마당을 가로질러 달렸다.\u003c/div>\u003cdiv class=\"g-note\">개가 나를 따라오고 있으므로 개와 follow는 능동 관계 → 현재분사 following\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She always studies \u003cspan class=\"fx\">with the TV turned on\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 항상 TV가 켜져 있는 채로 공부한다.\u003c/div>\u003cdiv class=\"g-note\">TV는 켜짐을 당한 상태이므로 수동 관계 → 과거분사 turned\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>수동 관계에서 쓰인 과거분사는 본래 \u003cb class=\"key\">with+명사+(being)+과거분사\u003c/b>에서 \u003cb class=\"key\">being\u003c/b>이 생략된 형태로 볼 수 있습니다.\u003c/div>","segs":[{"n":6,"text":"이제 가장 중요한 부분이에요. with 뒤에 오는 명사와 분사의 관계를 잘 살펴봐야 합니다. 명사가 그 동작을 직접 하는 쪽이면 능동 관계라서 현재분사를 쓰고, 명사가 그 동작을 당하는 쪽이면 수동 관계라서 과거분사를 써요. 그러니까 명사가 ‘하는’ 쪽인지 ‘당하는’ 쪽인지만 판단하면 분사가 저절로 정해진답니다. 예문으로 확인해 볼게요.","hl":"rule"},{"n":7,"text":"I ran across the yard with my dog following me. 이 문장은 나는 개가 나를 따라오고 있는 채로 마당을 가로질러 달렸다라는 뜻이에요. 여기서 개는 나를 따라오고 있는 쪽이죠. 개가 따라오는 것은 개가 직접 하는 동작이니까 능동 관계예요. 그래서 현재분사 following을 쓴 겁니다.","hl":"ex-0"},{"n":8,"text":"She always studies with the TV turned on. 이 문장은 그녀는 항상 TV가 켜져 있는 채로 공부한다라는 뜻이에요. TV는 스스로 켜지는 게 아니라 누군가에 의해 켜지는 거죠. 그래서 TV는 켜짐을 당한 상태이고 수동 관계예요. 이럴 때는 과거분사 turned를 씁니다.","hl":"ex-1"},{"n":9,"text":"재미있는 점이 하나 있어요. 수동 관계에서 쓰인 과거분사는 원래 그 사이에 being이 있었는데 그것이 생략된 형태로 볼 수 있어요. 그래서 Lisa was talking to Mike with her arms folded 같은 문장은 with her arms being folded에서 being이 빠진 것이라고 이해하면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">쓰임: 명사가 분사의 의미상 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「with+명사+분사」에서 분사 앞의 \u003cb class=\"key\">명사\u003c/b>가 분사의 \u003cb class=\"key\">의미상 주어\u003c/b> 역할을 합니다. 즉 ‘그 명사가 그렇게 하고 있는/되어 있는’ 상태를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">with + (분사의 의미상 주어) 명사 + 분사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My kids listened to me \u003cspan class=\"fx\">with their eyes shining\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 아이들은 눈을 반짝이며 내 말을 들었다.\u003c/div>\u003cdiv class=\"g-note\">their eyes가 shining의 의미상 주어이며, 눈이 반짝이는 것은 능동 관계이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The man was sitting on the bench \u003cspan class=\"fx\">with his legs crossed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 남자는 다리를 꼬고 벤치에 앉아 있었다.\u003c/div>\u003cdiv class=\"g-note\">his legs가 crossed의 의미상 주어이며, 다리는 꼬아진 상태이므로 수동 관계이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Mozart was playing the piano \u003cspan class=\"fx\">with his eyes closed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">모차르트는 눈을 감은 채로 피아노를 연주하고 있었다.\u003c/div>\u003cdiv class=\"g-note\">his eyes가 closed의 의미상 주어이며, 눈은 감긴 상태이므로 과거분사를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>명사와 분사 사이에 \u003cb class=\"key\">동사\u003c/b>를 넣어 ‘명사가 ~한다/명사가 ~된다’로 확인해 보면 능동과 수동이 쉽게 구별됩니다.\u003c/div>","segs":[{"n":10,"text":"마지막으로 이 표현이 문장 안에서 어떻게 쓰이는지 볼게요. with 뒤에 오는 명사는 그 뒤에 오는 분사의 의미상 주어 역할을 합니다. 다시 말해 그 명사가 그 동작을 하고 있거나 그런 상태에 있다는 뜻이에요. 그래서 명사와 분사가 짝을 이루어 하나의 작은 장면을 만들어 낸다고 생각하면 됩니다. 예문으로 확인해 볼게요.","hl":"rule"},{"n":11,"text":"My kids listened to me with their eyes shining. 이 문장은 내 아이들은 눈을 반짝이며 내 말을 들었다라는 뜻이에요. 여기서 their eyes가 shining의 의미상 주어가 됩니다. 눈이 반짝이고 있는 것은 능동이니까 현재분사 shining을 쓴 거예요.","hl":"ex-0"},{"n":12,"text":"The man was sitting on the bench with his legs crossed. 이 문장은 그 남자는 다리를 꼬고 벤치에 앉아 있었다라는 뜻이에요. his legs가 crossed의 의미상 주어이고, 다리는 스스로 꼬는 게 아니라 꼬아진 상태니까 수동 관계예요. 그래서 과거분사 crossed를 씁니다.","hl":"ex-1"},{"n":13,"text":"Mozart was playing the piano with his eyes closed. 이 문장은 모차르트는 눈을 감은 채로 피아노를 연주하고 있었다라는 뜻이에요. his eyes가 closed의 의미상 주어이고 눈은 감기는 대상이니까 과거분사를 썼죠. 이렇게 명사가 분사의 의미상 주어라는 점만 잡으면 해석이 아주 쉬워집니다.","hl":"ex-2"},{"n":14,"text":"헷갈릴 때는 명사와 분사 사이에 동사를 넣어서 생각해 보세요. 눈이 반짝인다처럼 명사가 직접 하는 느낌이면 현재분사, 다리가 꼬아진다처럼 당하는 느낌이면 과거분사예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The girl ran with her hair blown in the wind.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The girl ran with her hair blowing in the wind.\u003c/div>\u003cdiv class=\"g-why\">머리카락이 바람에 날리는 것은 머리카락이 직접 하는 동작이므로 능동 관계이고, 현재분사 blowing을 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She always studies with the TV turning on.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She always studies with the TV turned on.\u003c/div>\u003cdiv class=\"g-why\">TV는 스스로 켜지는 것이 아니라 켜짐을 당하는 대상이므로 수동 관계이고, 과거분사 turned를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I ran across the yard with my dog followed me.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I ran across the yard with my dog following me.\u003c/div>\u003cdiv class=\"g-why\">with 뒤에는 ‘명사+분사’가 와야 하는데 동사 followed me를 그대로 써서 틀렸고, 개가 따라오는 능동 관계이므로 following이 맞다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"첫 번째로 자주 나오는 실수예요. 머리카락이 바람에 날리는 것은 머리카락이 직접 하는 동작이죠. 그러니까 능동 관계라서 현재분사 blowing을 써야 합니다. blown이라고 쓰면 머리카락이 누군가에게 날려진 것처럼 들려서 어색해져요.","hl":"mk-0"},{"n":16,"text":"두 번째 실수도 아주 많아요. TV는 스스로 켜지는 게 아니라 누군가에 의해 켜지는 대상이에요. 그래서 수동 관계이고 과거분사 turned를 써야 합니다. turning on이라고 하면 TV가 스스로 켜고 있는 것처럼 되어 버려요.","hl":"mk-1"},{"n":17,"text":"세 번째는 with 뒤에 동사를 그대로 쓴 경우예요. with 다음에는 명사와 분사가 와야 하는데 followed me처럼 동사 형태를 쓰면 문장이 무너집니다. 개가 나를 따라오고 있으니 능동 관계로 보고 following me라고 써야 해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The girl ran with her hair ____ in the wind.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>blowing\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>blown\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>blow\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>to blow\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">blowing\u003c/span>\u003cdiv class=\"g-exp\">머리카락이 바람에 날리는 것은 머리카락이 직접 하는 동작이므로 능동 관계이다. 따라서 현재분사 blowing이 알맞다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제예요. 빈칸에 들어갈 말로 알맞은 것을 고르면 됩니다. The girl ran with her hair, 빈칸, in the wind. 머리카락과 날리다의 관계를 잘 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 첫 번째 보기 blowing이에요. 머리카락이 바람에 날리는 것은 머리카락이 직접 하는 동작이죠. 그래서 능동 관계이고 현재분사 blowing을 씁니다. blown을 쓰면 머리카락이 누군가에게 날려진 것처럼 들려요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She always studies with the TV ____ on.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>turning\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>turned\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>turns\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>to turn\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">turned\u003c/span>\u003cdiv class=\"g-exp\">TV는 스스로 켜지는 것이 아니라 켜짐을 당하는 대상이므로 수동 관계이다. 따라서 과거분사 turned가 알맞다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제예요. She always studies with the TV, 빈칸, on. TV가 켜져 있는 상황인데요, TV는 스스로 켜는 쪽일까요, 켜지는 쪽일까요? 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 두 번째 보기 turned예요. TV는 스스로 켜지는 게 아니라 누군가에 의해 켜지는 대상이에요. 그래서 수동 관계이고 과거분사 turned를 씁니다. turning을 고르면 TV가 스스로 켜고 있는 것처럼 되어 버려요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 동사를 알맞은 분사 형태로 바꿔 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">Jason thought about the film with his eyes ____. (close)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">closed\u003c/span>\u003cdiv class=\"g-exp\">눈은 감기는 대상이므로 수동 관계이고, 과거분사 closed를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제는 빈칸 채우기예요. Jason thought about the film with his eyes, 빈칸. 괄호 안의 close를 알맞은 분사 형태로 바꿔 주시면 됩니다. 눈이 하는 쪽인지 당하는 쪽인지 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 closed예요. 눈은 스스로 감는 게 아니라 감기는 대상이죠. 그래서 수동 관계이고 과거분사 closed를 씁니다. with his eyes closed, 이렇게 쓰면 눈을 감은 채로라는 뜻이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">My kids listened to me with their eyes shone.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">My kids listened to me with their eyes shining.\u003c/span>\u003cdiv class=\"g-exp\">눈이 반짝이고 있는 것은 능동 관계이므로 과거분사 shone이 아니라 현재분사 shining을 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 틀린 부분을 고치는 문제예요. My kids listened to me with their eyes shone. 이 문장에서 어색한 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 shone을 shining으로 고치는 거예요. 눈이 반짝이고 있는 것은 눈이 직접 하는 동작이죠. 그래서 능동 관계이고 현재분사 shining을 씁니다. My kids listened to me with their eyes shining, 이렇게 고치면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">with / his legs / The man / was sitting / on the bench / crossed\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The man was sitting on the bench with his legs crossed.\u003c/span>\u003cdiv class=\"g-exp\">주절 The man was sitting on the bench 뒤에 with his legs crossed를 붙인다. 다리는 꼬아진 상태이므로 과거분사 crossed를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제는 단어 배열이에요. with, his legs, The man, was sitting, on the bench, crossed 이 단어들을 모두 사용해서 문장을 만들어 보세요. with 이하가 뒤에 붙는다는 점을 기억하면 쉽습니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 The man was sitting on the bench with his legs crossed예요. 먼저 주절인 The man was sitting on the bench를 쓰고 뒤에 with his legs crossed를 붙이면 됩니다. 다리는 꼬아진 상태니까 수동 관계로 보고 과거분사 crossed를 쓴 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말을 보고 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">나는 개가 나를 따라오고 있는 채로 마당을 가로질러 달렸다. → I ran across the yard with ____.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">my dog following me\u003c/span>\u003cdiv class=\"g-exp\">개가 나를 따라오고 있으므로 능동 관계이고, 「with+명사+현재분사」 형태로 my dog following me를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제는 영작이에요. 우리말은 나는 개가 나를 따라오고 있는 채로 마당을 가로질러 달렸다입니다. 영어 문장은 I ran across the yard with까지 나와 있어요. 뒤에 들어갈 말을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 my dog following me예요. 개가 나를 따라오고 있는 것은 개가 직접 하는 동작이니까 능동 관계죠. 그래서 with my dog following me처럼 명사 다음에 현재분사를 씁니다. 이렇게 하면 개가 따라오는 장면이 문장에 살아나요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">with + 명사 + 분사 (분사구문)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>「with+명사+분사」는 ‘~이 …한 채, ~이 …하면서’라는 뜻으로 \u003cb class=\"key\">동시 동작\u003c/b>이나 \u003cb class=\"key\">부가적인 상황\u003c/b>을 생생하게 표현한다.\u003c/li>\u003cli>명사와 분사가 \u003cb class=\"key\">능동\u003c/b> 관계이면 \u003cb class=\"key\">현재분사\u003c/b>, \u003cb class=\"key\">수동\u003c/b> 관계이면 \u003cb class=\"key\">과거분사\u003c/b>를 쓴다.\u003c/li>\u003cli>with 뒤의 명사는 분사의 \u003cb class=\"key\">의미상 주어\u003c/b> 역할을 한다.\u003c/li>\u003cli>수동 관계의 과거분사는 \u003cb class=\"key\">being\u003c/b>이 생략된 형태로 이해할 수 있다.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 with 다음에 명사와 분사가 오는 표현을 배웠어요. 뜻은 ‘~이 …한 채, ~이 …하면서’이고, 명사가 동작을 하는 쪽이면 현재분사, 당하는 쪽이면 과거분사를 쓴다는 점이 핵심이었죠. 그리고 with 뒤의 명사가 분사의 의미상 주어 역할을 한다는 것도 꼭 기억해 주세요. 오늘 배운 표현으로 여러분 주변의 장면을 영어로 하나씩 그려 보면 실력이 쑥 늘 거예요. 수고했어요, 다음 시간에 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
