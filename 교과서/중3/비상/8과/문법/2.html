</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"8과 문법2","title":"중3 비상 8과 문법2 with분사구문","audioDir":"2_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">with + 명사 + 분사\u003c/div>\u003ch1>with + 명사 + 분사로 장면을 그려요\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>with+명사+분사 구조를 이해하고, 능동·수동 관계에 맞는 분사를 골라 상황을 생생하게 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 삼학년 비상 교과서의 with 표현을 배워요. with 다음에 명사와 분사가 오면 어떤 사람이나 사물이 어떤 상태인 채라는 뜻으로 동시에 일어나는 상황을 생생하게 나타낼 수 있어요. 예문을 통해 능동과 수동에 따라 분사가 어떻게 달라지는지 함께 알아봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">의미: 동시 동작과 부가 상황을 생생하게\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「with+명사+분사」는 ‘\u003cb class=\"key\">~이 …한 채\u003c/b>’, ‘\u003cb class=\"key\">~이 …하면서\u003c/b>’라는 뜻으로 \u003cb class=\"key\">동시 동작\u003c/b>이나 부가적인 상황을 생생하게 표현할 때 씁니다. 장면 속 두 상황이 함께 일어날 때 유용합니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사 + 분사 = ‘~이 …한 채, ~이 …하면서’\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The girl ran \u003cspan class=\"fx\">with her hair blowing in the wind\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 소녀는 머리카락이 바람에 날리는 채 달렸다.\u003c/div>\u003cdiv class=\"g-note\">머리카락이 바람에 날리는 상황을 덧붙여 장면을 생생하게 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Jason thought about the film \u003cspan class=\"fx\">with his eyes closed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Jason은 눈을 감은 채 그 영화에 대해 생각했다.\u003c/div>\u003cdiv class=\"g-note\">눈을 감은 상태가 영화를 생각하는 장면에 함께 붙어 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>with 뒤에는 반드시 \u003cb class=\"key\">명사\u003c/b>가 먼저 오고, 그 명사와 분사의 관계를 먼저 확인하세요.\u003c/div>","segs":[{"n":2,"text":"이 표현은 어떤 사람이나 사물이 어떤 상태인 채, 또는 어떤 동작을 하면서라는 뜻을 담아요. 그래서 두 가지 상황이 동시에 일어나거나 부가적인 상황을 생생하게 보여 줄 때 자주 써요. 오늘은 이 표현이 어떤 장면을 얼마나 생생하게 만들어 주는지 예문으로 확인해 볼게요.","hl":"rule"},{"n":3,"text":"The girl ran with her hair blowing in the wind. 이 문장은 그 소녀가 머리카락이 바람에 날리는 채 달렸다는 뜻이에요. 머리카락이 바람에 날리는 상황을 덧붙여 장면을 생생하게 보여 주죠.","hl":"ex-0"},{"n":4,"text":"Jason thought about the film with his eyes closed. Jason은 눈을 감은 채 그 영화에 대해 생각했다는 뜻이에요. 눈을 감은 상태가 영화를 생각하는 장면에 함께 붙어 있어요.","hl":"ex-1"},{"n":5,"text":"with 뒤에는 명사가 먼저 오고 그다음에 분사가 와요. 그래서 명사와 분사가 어떤 관계인지 먼저 확인하는 습관이 중요해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">형태: 능동이면 현재분사, 수동이면 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">형태는 \u003cb class=\"key\">with+명사+분사\u003c/b>이고, 명사와 분사가 능동 관계이면 \u003cb class=\"key\">현재분사\u003c/b>, 수동 관계이면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다. 수동 관계의 과거분사는 with+명사+being+과거분사에서 being이 생략된 형태로 볼 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사 + 현재분사(능동) / 과거분사(수동)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I ran across the yard \u003cspan class=\"fx\">with my dog following me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 개가 나를 따라오는 채 마당을 가로질러 달렸다.\u003c/div>\u003cdiv class=\"g-note\">개가 나를 따라오는 능동 관계라서 현재분사 following을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She always studies \u003cspan class=\"fx\">with the TV turned on\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 항상 TV가 켜져 있는 채로 공부한다.\u003c/div>\u003cdiv class=\"g-note\">TV가 켜진 상태는 수동 관계라서 과거분사 turned를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>분사 앞의 명사가 동작을 직접 하는지, 동작을 당하는지 생각하면 \u003cb class=\"key\">현재분사\u003c/b>와 \u003cb class=\"key\">과거분사\u003c/b>를 쉽게 고를 수 있어요.\u003c/div>","segs":[{"n":6,"text":"형태는 with 다음에 명사와 분사가 차례로 오는 모양이에요. 명사와 분사가 능동 관계이면 현재분사를 쓰고 수동 관계이면 과거분사를 써요. 수동 관계에서는 being이 생략된 형태로 볼 수 있다는 점도 기억해 두세요.","hl":"rule"},{"n":7,"text":"I ran across the yard with my dog following me. 이 문장은 내가 개가 나를 따라오는 채 마당을 가로질러 달렸다는 뜻이에요. 개가 나를 따라오는 능동 관계라서 현재분사 following을 썼어요.","hl":"ex-0"},{"n":8,"text":"She always studies with the TV turned on. 이 문장은 그녀가 항상 TV가 켜져 있는 채로 공부한다는 뜻이에요. TV가 켜진 상태는 수동 관계라서 과거분사 turned를 썼어요.","hl":"ex-1"},{"n":9,"text":"분사 앞의 명사가 동작을 직접 하는지 아니면 동작을 당하는지 생각해 보세요. 직접 하면 현재분사, 당하면 과거분사를 고르면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">쓰임: 명사는 분사의 의미상 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">이 표현에서 명사는 분사의 \u003cb class=\"key\">의미상 주어\u003c/b> 역할을 합니다. 즉 분사가 나타내는 동작이나 상태의 주체가 바로 그 명사입니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사(의미상 주어) + 분사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My kids listened to me \u003cspan class=\"fx\">with their eyes shining\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 아이들은 눈을 반짝이며 내 말을 들었다.\u003c/div>\u003cdiv class=\"g-note\">their eyes가 shining의 의미상 주어 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The man was sitting on the bench \u003cspan class=\"fx\">with his legs crossed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 남자는 다리를 꼰 채 벤치에 앉아 있었다.\u003c/div>\u003cdiv class=\"g-note\">his legs가 crossed의 의미상 주어 역할을 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>해석할 때 ‘\u003cb class=\"key\">~한 채\u003c/b>’로 자연스럽게 풀어 보면 명사가 분사의 의미상 주어임을 확인하기 쉬워요.\u003c/div>","segs":[{"n":10,"text":"이 표현에서 명사는 분사의 의미상 주어 역할을 해요. 다시 말해 분사가 나타내는 동작이나 상태의 주체가 바로 그 명사라는 뜻이에요. 그래서 명사와 분사가 자연스럽게 이어지는지 확인하면 문장을 이해하기 쉬워요.","hl":"rule"},{"n":11,"text":"My kids listened to me with their eyes shining. 이 문장은 내 아이들이 눈을 반짝이며 내 말을 들었다는 뜻이에요. their eyes가 shining의 의미상 주어 역할을 해요.","hl":"ex-0"},{"n":12,"text":"The man was sitting on the bench with his legs crossed. 이 문장은 그 남자가 다리를 꼰 채 벤치에 앉아 있었다는 뜻이에요. his legs가 crossed의 의미상 주어 역할을 해요.","hl":"ex-1"},{"n":13,"text":"해석할 때 어떤 사람이나 사물이 어떤 상태인 채로라고 자연스럽게 풀어 보세요. 그러면 명사가 분사의 의미상 주어라는 점이 더 잘 보여요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I ran across the yard with my dog followed me.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I ran across the yard with my dog following me.\u003c/div>\u003cdiv class=\"g-why\">개가 나를 따라오는 능동 관계인데 과거분사 followed를 썼기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She always studies with the TV turning on.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She always studies with the TV turned on.\u003c/div>\u003cdiv class=\"g-why\">TV가 켜진 상태는 수동 관계인데 현재분사 turning을 썼기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Drake walked for a long time with his eyes fixing upon the floor.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Drake walked for a long time with his eyes fixed upon the floor.\u003c/div>\u003cdiv class=\"g-why\">눈이 바닥에 고정되는 수동 관계인데 현재분사 fixing을 썼기 때문입니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"여기서는 개가 나를 따라오는 능동 관계예요. 그래서 과거분사 followed가 아니라 현재분사 following을 써야 해요. with my dog following me라고 해야 자연스러워요.","hl":"mk-0"},{"n":15,"text":"TV는 스스로 켜지는 것이 아니라 켜진 상태가 되는 것이에요. 그래서 현재분사 turning이 아니라 과거분사 turned를 써서 with the TV turned on이라고 해요.","hl":"mk-1"},{"n":16,"text":"눈은 바닥에 고정되는 대상이라서 수동 관계예요. 그래서 fixing이 아니라 과거분사 fixed를 써요. with his eyes fixed upon the floor라고 해야 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The girl ran with her hair ____ in the wind.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutto
