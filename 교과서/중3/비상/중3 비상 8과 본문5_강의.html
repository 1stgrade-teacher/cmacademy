실로 만들어 왔기에, 미래의 인류가 웜홀을 발견하고 우주 여행의 꿈을 이룰 가능성도 완전히 배제할 수 없는 것입니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Sci Teen: 어이쿠! 그건 좋은 광경이 아니네요.</span><span class=\"en\"><b>Sci Teen: Ouch!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">That’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>not a pretty picture.</b></span></div></div><div class=\"lec-sent-ko\">(Sci Teen: 어이쿠! 그건 좋은 광경이 아니네요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 대화에서 웜홀 여행의 위험성이나 부정적인 결과가 언급되었음을 짐작할 수 있습니다. pretty picture는 사전적으로 &#39;예쁜 그림&#39;이지만, 여기서는 &#39;상황이 좋거나 낙관적인 모습&#39;을 뜻합니다. 단순히 예쁘다는 뜻을 넘어, 어떤 일이 전개되는 &#39;바람직한 결과&#39;를 시각적인 이미지에 빗대어 표현함으로써, 현재 상황이 매우 비관적임을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s (관용표현): That is의 축약형으로, 앞서 언급된 상황을 가리키는 지시 대명사 주어+be동사 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그럼</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 ~인가요?</span><span class=\"en\"><b><span class=\"grammar-hl\">are we</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가망이 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">hopeless</span>?</b></span></div></div><div class=\"lec-sent-ko\">그럼 우리는 가망이 없는 건가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 부정적인 상황(not a pretty picture)을 바탕으로, 웜홀 여행이 아예 불가능한 것인지에 대해 질문을 던지며 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are we hopeless (도치): 의문문 구조로, 주어(we)와 be동사(are)의 위치가 바뀐 도치 현상입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주에서 웜홀을 통해 여행을 하는 것은 ~인가요?</span><span class=\"en\"><b>Is <span class=\"grammar-hl\">traveling in space</span> through a wormhole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 아이디어</span><span class=\"en\"><b>simply <span class=\"grammar-hl\">an idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이론상으로만 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that only exists in theory</span>?</b></span></div></div><div class=\"lec-sent-ko\">우주에서 웜홀을 통해 여행을 하는 것은 단지 이론상으로만 존재하는 아이디어인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 질문을 구체화한 내용입니다. 웜홀 여행이 현실성이 없는 공상에 불과한지 묻고 있으며, 이는 과학적 탐구의 타당성에 대한 의문으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">traveling in space (동명사): 문장의 주어 역할을 하며 &#39;~하는 것&#39;으로 해석되는 명사적 구조입니다.</div><div class=\"lec-gr-item\">an idea that only exists in theory (관계대명사): that 이하의 절(only exists in theory)에서 주어가 빠진 주격 관계대명사절로, 선행사(an idea)를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Dr. Sci: 그렇게 말하지는 않겠어요.</span><span class=\"en\"><b>Dr. Sci: I <span class=\"grammar-hl\">wouldn’t</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">say so</span>.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 그렇게 말하지는 않겠어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 학생의 부정적인 추측을 강하게 반박하며, 웜홀 여행의 가능성을 긍정적으로 바라보는 전문가의 견해를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wouldn’t say so (대동사): say so는 앞 문장의 내용(wormholes being just an idea)을 반복하지 않기 위해 쓴 표현이며, say는 일반동사로 여기서는 조동사의 부정형(would not)과 함께 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">웜홀에 대한 논쟁은 여전히 진행 중이긴 하지만, 끊임없는 탐구와 연구로 우리가 결국 하나를 찾아 그것을 통해 여행하는 법을 배울 수 있을 거라고 믿습니다.</span><span class=\"en\"><b>The debate about wormholes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>is still <span class=\"grammar-hl\">ongoing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>but with persistent exploration and research,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">I believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">we will eventually find one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>and learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">how to travel through it</span>.</b></span></div></div><div class=\"lec-sent-ko\">웜홀에 대한 논쟁은 여전히 진행 중이긴 하지만, 끊임없는 탐구와 연구로 우리가 결국 하나를 찾아 그것을 통해 여행하는 법을 배울 수 있을 거라고 믿습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 근거를 제시합니다. &#39;논쟁이 진행 중&#39;이라는 점을 통해 아직 과학적 결론이 나지 않았음을 인정하되, &#39;끈기 있는 연구&#39;라는 조건을 붙여 미래의 성공 가능성을 긍정적으로 전망합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ongoing (현재분사): 진행 중인 상태를 나타내는 형용사적 기능으로 쓰였습니다.</div><div class=\"lec-gr-item\">I believe we will eventually find one 간접의문문과 유사한 목적절: believe 뒤에 접속사 that(생략됨)이 이끄는 명사절로, 주어(we)와 동사(will find)를 갖춘 완전한 문장 구조입니다.</div><div class=\"lec-gr-item\">how to travel through it (to부정사): 의문사(how)+to부정사 형태로, learn의 목적어 역할을 하며 &#39;~하는 방법&#39;으로 해석됩니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">돌아보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Look back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 역사를</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> our history.</b></span></div></div><div class=\"lec-sent-ko\">우리의 역사를 돌아보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 역사를 돌아보라는 권유를 통해, 현재 불가능해 보이는 것도 과거에는 불가능해 보였음을 깨닫게 하려는 논리적 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look back at (관용표현): &#39;~를 돌아보다&#39;라는 의미의 구동사(phrasal verb)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 달성해 왔습니다</span><span class=\"en\"><b>We’ve achieved</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 많은 것들을</span><span class=\"en\"><b>so many <span class=\"grammar-hl\">things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불가능해보였던</span><span class=\"en\"><b><span class=\"grammar-hl\">that seemed impossible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에는</span><span class=\"en\"><b><span class=\"grammar-hl\">at first</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 처음에는 불가능해보였던 아주 많은 것들을 달성해 왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장의 증거입니다. 과거의 성공 사례들을 일반화하여, 웜홀 여행 역시 현재는 불가능해 보이지만 미래에는 성취할 수 있는 영역임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">things that seemed impossible at first (관계대명사): that 이하의 절(seemed impossible at first)에서 주어가 빠진 주격 관계대명사절로, 선행사(things)를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누가 알겠어요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Who knows?</span></b></span></div></div><div class=\"lec-sent-ko\">누가 알겠어요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 미래의 가능성은 누구도 단정 지을 수 없다는 점을 시사하며, 앞선 긍정적인 전망에 힘을 실어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who knows? (관용표현): &#39;누가 알겠어?&#39;라는 의미로 쓰이는 수사 의문문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어쩌면</span><span class=\"en\"><b>Maybe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그 사람이 될 수 있을지도요</span><span class=\"en\"><b>you can be <span class=\"grammar-hl\">the one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 답을 찾아내는</span><span class=\"en\"><b><span class=\"grammar-hl\">to find the answer</span>!</b></span></div></div><div class=\"lec-sent-ko\">어쩌면 여러분이 그 답을 찾아내는 그 사람이 될 수 있을지도요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 희망과 도전 의식을 심어주며 글을 마무리합니다. 이는 단순한 정보 전달을 넘어, 다음 세대의 과학적 관심을 촉구하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the one to find the answer (to부정사): 앞의 명사(the one)를 수식하는 형용사적 용법으로, &#39;~할 사람&#39;이라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학생은 웜홀 여행의 부정적인 측면 때문에 그것이 단지 이론에 불과한지 의문을 제기한다.</li><li>Dr. Sci는 웜홀 연구가 아직 진행 중이며 충분히 가능성 있는 미래라고 답한다.</li><li>역사적으로 불가능해 보이던 일들도 결국 성취해냈음을 강조한다.</li><li>독자에게 미래의 과학적 발견에 기여할 가능성이 있음을 제시하며 희망적으로 끝맺는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Wormhole travel remains theoretical for now, but persistent research could eventually turn these scientific possibilities into reality.</div>\n              <div class=\"lec-final-sum-ko\">웜홀 여행은 현재까지는 이론적인 상태로 남아있지만, 지속적인 연구가 결국 이러한 과학적 가능성을 현실로 바꿀 수 있다.</div></div></div>"],"segs":[[],[],[],[],[],[],[],[],[],[],[],[]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
