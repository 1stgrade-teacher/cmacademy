ent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">슬라브인이</span><span class=\"en\"><b>SLAV <span class=\"grammar-hl\">SHOOTS</span> A FRIEND IN ARGUMENT</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쏘다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구에게</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">언쟁 중에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">슬라브인이 언쟁 중에 친구에게 총을 쏘다</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기사의 도입부로, 사건의 주인공인 피해자와 가해자, 그리고 발생 시간과 장소라는 핵심 정보를 요약하여 독자에게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">SHOOTS (일반동사): 주어(SLAV)의 동작을 나타내는 3인칭 단수 현재형 동사로, 뒤에 목적어(a friend)를 취하는 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Mejk Swenekafew가</span><span class=\"en\"><b>Mejk Swenekafew,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">슬라브인 노동자</span><span class=\"en\"><b><span class=\"grammar-hl\">a Slav worker</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컬럼비아 광산 소속의</span><span class=\"en\"><b><span class=\"grammar-hl\">at the Columbia Coal Mine</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">총상을 입어</span><span class=\"en\"><b><span class=\"grammar-hl\">was shot</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각하게 다쳤는데</span><span class=\"en\"><b><span class=\"grammar-hl\">and seriously wounded</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">John Pecitello에 의해</span><span class=\"en\"><b>by John Pecitello</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채굴 야영지 근처에서</span><span class=\"en\"><b>near the mining camp</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목요일 저녁</span><span class=\"en\"><b>Thursday evening.</b></span></div></div><div class=\"lec-sent-ko\">목요일 저녁 채굴 야영지 근처에서, 컬럼비아 광산 소속의 슬라브인 노동자 Mejk Swenekafew가 John Pecitello에 의해 총상을 입어 심각하게 다쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기사의 도입부로, 사건의 주인공인 피해자와 가해자, 그리고 발생 시간과 장소라는 핵심 정보를 요약하여 독자에게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a Slav worker at the Columbia Coal Mine (동격): 주어(Mejk Swenekafew)와 뒤의 명사구(a Slav worker...)가 동일한 대상을 가리키며 주어를 보충 설명합니다.</div><div class=\"lec-gr-item\">was shot and seriously wounded (수동태): be동사(was)+p.p.(shot, wounded) 구조입니다. shoot과 wound는 타동사인데 목적어가 없어 수동구조 was shot/wounded 형태로 씁니다. 기본구조: shoot/wound + O(목적어) + (with/by 등).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 두 사람은</span><span class=\"en\"><b>The two men</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언쟁을 벌였다</span><span class=\"en\"><b><span class=\"grammar-hl\">had</span> an argument</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의 중에</span><span class=\"en\"><b>during a meeting.</b></span></div></div><div class=\"lec-sent-ko\">그 두 사람은 회의 중에 언쟁을 벌였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 총격 사건의 **발단**을 설명합니다. &#39;argument&#39;는 단순히 의견 차이가 아니라 물리적 충돌로 번질 수 있는 심각한 말다툼을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had (일반동사): 주어(The two men)의 상태나 소유를 나타내는 과거형 동사로, 뒤에 목적어(an argument)를 취합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언쟁이</span><span class=\"en\"><b>The argument</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">싸움으로 번졌고</span><span class=\"en\"><b><span class=\"grammar-hl\">led to</span> a fight,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Pecitello가</span><span class=\"en\"><b>and Pecitello</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Swenekafew에게 총을 쏘았다</span><span class=\"en\"><b><span class=\"grammar-hl\">shot</span> Swenekafew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 번</span><span class=\"en\"><b>twice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가슴과 다리에</span><span class=\"en\"><b>in the chest and leg.</b></span></div></div><div class=\"lec-sent-ko\">언쟁이 싸움으로 번졌고, Pecitello가 Swenekafew의 가슴과 다리에 두 번 총을 쏘았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 말다툼이 어떻게 물리적 폭력으로 격화되었는지 그 인과관계를 보여줍니다. &#39;led to&#39;는 사건이 단계적으로 악화되었음을 보여주는 연결 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">led to (관용표현): &#39;결과적으로 ~을 초래하다/이끌다&#39;라는 의미의 자동사구로, 뒤에 전치사 to와 목적어(a fight)가 결합합니다.</div><div class=\"lec-gr-item\">shot (일반동사): 주어(Pecitello)가 목적어(Swenekafew)에게 행한 동작을 나타내는 3형식 과거형 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현재 입원 중이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> now at the hospital</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위독한 상태로</span><span class=\"en\"><b>in critical condition.</b></span></div></div><div class=\"lec-sent-ko\">현재 그는 위독한 상태로 입원 중이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건의 결과를 보여줍니다. &#39;critical&#39;은 사전적으로 &#39;비판적인&#39;이라는 뜻이지만, 여기서는 환자의 상태가 매우 나빠서 죽을 수도 있는 위태로운 상황임을 뜻합니다. 상황의 심각성을 강조하기 위해 필자가 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is (be동사): 현재 상태를 나타내며, 주어(He)와 보어(at the hospital)를 연결하는 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Pecitello는</span><span class=\"en\"><b>Pecitello</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도주했다</span><span class=\"en\"><b><span class=\"grammar-hl\">ran away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">총격 이후</span><span class=\"en\"><b><span class=\"grammar-hl\">after the shooting</span>.</b></span></div></div><div class=\"lec-sent-ko\">Pecitello는 총격 이후 도주했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가해자의 현재 상태를 알려주며, 이어지는 경찰의 추격 예고를 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ran away (관용표현): &#39;도망치다&#39;라는 의미의 자동사구(run away)로, 동작의 방향을 나타내는 부사적 의미를 포함합니다.</div><div class=\"lec-gr-item\">after the shooting (동명사): 전치사(after)의 목적어 자리에 위치하며, &#39;총을 쏘는 행위&#39;라는 명사적 개념을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경찰이</span><span class=\"en\"><b>The police</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 찾고 있으며</span><span class=\"en\"><b><span class=\"grammar-hl\">are searching for</span> him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금</span><span class=\"en\"><b>now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시민들에게 경고하고 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">are warning</span> citizens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가</span><span class=\"en\"><b><span class=\"grammar-hl\">that he</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">극히 위험하다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is extremely dangerous</span>.</b></span></div></div><div class=\"lec-sent-ko\">경찰이 지금 그를 찾고 있으며, 그가 극히 위험하다고 시민들에게 경고하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건 이후의 상황을 설명하며, 독자들에게 경각심을 주는 마무리 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are searching for (현재진행): be동사(are)+현재분사(searching) 구조로, 주어(The police)가 현재 진행 중인 동작을 나타냅니다.</div><div class=\"lec-gr-item\">are warning (현재진행): be동사(are)+현재분사(warning) 구조로, 주어(The police)의 현재 지속적인 경고 동작을 나타냅니다.</div><div class=\"lec-gr-item\">that he is extremely dangerous (명사절): 타동사(warning)의 목적어 역할을 하는 명사절로, 문장의 핵심 내용을 구체화합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>컬럼비아 탄광에서 노동자 간의 다툼이 총격 사건으로 번졌다.</li><li>피해자는 심각한 부상을 입고 위독한 상태이다.</li><li>가해자는 사건 직후 도주했으며, 경찰은 그를 추적하며 시민들에게 주의를 당부하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The police are currently searching for John Pecitello, who fled after shooting his coworker during an argument at a coal mine.</div>\n              <div class=\"lec-final-sum-ko\">경찰은 탄광에서 말다툼 중 동료에게 총을 쏜 뒤 도주한 존 페치텔로를 현재 수색하고 있다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":"main"},{"audio":"./3_audio/4.mp3","hl":"meaning"},{"audio":"./3_audio/5.mp3","hl":"gra
