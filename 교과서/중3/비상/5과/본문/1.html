TXT1WkdNfPXTt62XK/wCV/cQ4/wAfSk6fTv7e/wDn61MY5SACjkgFj8rcg9CRj8Ceg/SnpGdpzHJkHrt9fQNwOOwLYIPvUXS36/5rzX/D2W7Q+SX3W7X6aafj089CAAnp6Z69s4/DnP5UBCcZBwTypA9QcnHP59sZ97AVugRhxwAB0A64znHcnnqT6Au8mTPzIwGP5+oIIxjOe/bjmhPr/S/4KBwa6Nrul2t2/pjEyCCAOGAJz0AyQecZwB+I554FWB+fUj8ck9O3f07+tCxtgAIwBOPunnbwSQOSOMHHUA49aljhlLxgROSSoA2n1Ax0x9fz9KpOzXXVb9bNaddNOmv5E8suz23s/L/h3t031t//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Dangers of Fake News and Its Hidden Motives<small>가짜 뉴스의 위험성과 그 숨겨진 의도</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 매일 접하는 정보 중에는 의도적으로 꾸며낸 가짜 뉴스(Fake News)가 섞여 있을 수 있는데, 이는 대중의 판단을 흐리게 만드는 사회적 문제가 되곤 합니다. 보통 가짜 뉴스는 단순히 재미를 위해 만들어지기도 하지만, 특정 집단의 이익을 챙기거나 사람들의 의견을 한쪽으로 몰아가려는 숨겨진 동기(Hidden Motives)를 가지고 생산되는 경우가 많아요. 이는 마치 &#39;진짜인 척하는 가짜 물건&#39;이 시장을 어지럽히는 것과 비슷해서, 정보를 비판적으로 바라보는 미디어 리터러시(Media Literacy) 능력이 우리에겐 꼭 필요합니다. 따라서 뉴스를 볼 때 이 정보가 어떤 목적으로 작성되었는지 스스로 질문해보는 과정은 우리가 현명한 정보 소비자로 성장하는 데 아주 중요한 밑거름이 된답니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 알아챌 수 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Can you spot</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가짜 뉴스를?</span><span class=\"en\"><b>fake news?</b></span></div></div><div class=\"lec-sent-ko\">당신은 가짜 뉴스임을 알아챌 수 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로서, 독자에게 가짜 뉴스를 식별할 수 있는지 질문을 던져 흥미를 유발하고 글의 주제가 &#39;가짜 뉴스&#39;임을 밝히고 있습니다. 여기서 spot은 사전적으로는 &#39;점&#39;이나 &#39;얼룩&#39;을 뜻하지만, 여기서는 &#39;발견하다&#39; 또는 &#39;알아채다&#39;라는 의미입니다. 단순히 보는 것을 넘어 숨겨진 거짓을 꿰뚫어 보는 능력을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can You Spot (조동사): 조동사 Can이 문장 맨 앞에 위치하여 의문문을 형성하는 도치 구조로, 주어 You와 동사원형 Spot을 이끕니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>Every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 보거나, 듣거나, 읽는다</span><span class=\"en\"><b>we watch, hear, or read</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 뉴스를.</span><span class=\"en\"><b><span class=\"grammar-hl\">interesting news</span>.</b></span></div></div><div class=\"lec-sent-ko\">매일 우리는 흥미로운 뉴스를 보거나 듣고, 읽는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리 일상에서 뉴스를 접하는 것이 얼마나 자연스러운 일인지 설명합니다. 다음 문장에서 나올 &#39;가짜 뉴스&#39;라는 문제 상황을 제기하기 전에, 우리가 평소 뉴스를 어떻게 소비하는지 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">interesting news (현재분사): interesting이 뒤의 명사 news를 수식하며, &#39;흥미를 일으키는 소식&#39;이라는 능동적 동작/상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 심각하게 고려해 본 적이 있는가</span><span class=\"en\"><b>have you ever seriously considered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기사가</span><span class=\"en\"><b><span class=\"grammar-hl\">whether an article</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말로 진실인지?</span><span class=\"en\"><b><span class=\"grammar-hl\">is really true</span>?</b></span></div></div><div class=\"lec-sent-ko\">그러나 당신은 뉴스 기사가 정말로 진실인지 심각하게 고려해 본 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;흥미로운 뉴스&#39; 소비 습관에 의문을 제기하며 화제를 전환합니다. considered는 단순히 &#39;생각하다&#39;를 넘어 &#39;숙고하다/검토하다&#39;라는 뜻으로, 우리가 뉴스 정보를 비판적으로 수용해야 할 필요성을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whether an article is really true (간접의문문): 명사절 접속사 whether가 이끄는 절로, consider의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 사람은 좋아한다</span><span class=\"en\"><b>Everyone likes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 뉴스 기사를</span><span class=\"en\"><b>an <span class=\"grammar-hl\">interesting news story</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 만약 ~라면 어떻게 할 것인가</span><span class=\"en\"><b>but what if</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 완전히 지어낸 것이?</span><span class=\"en\"><b>it <span class=\"grammar-hl\">is completely made up</span>?</b></span></div></div><div class=\"lec-sent-ko\">모든 사람들이 흥미로운 뉴스 기사를 좋아하지만, 만약 그것이 완전히 지어낸 것이라면 어떻게 할 것인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 뉴스의 &#39;흥미로움&#39;에만 집중하는 경향을 지적하며, 내용이 사실이 아닐 수도 있다는 위험성을 경고합니다. made up은 사전적으로 &#39;화장하다&#39; 또는 &#39;보충하다&#39;는 뜻이지만, 여기서는 &#39;날조된/지어낸&#39;이라는 의미입니다. 가짜 뉴스가 사실을 정교하게 꾸며낸 것임을 강조하기 위해 이 구동사를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">interesting news story (현재분사): interesting이 뒤의 명사 story를 수식하며, &#39;흥미를 유발하는 이야기&#39;라는 의미를 가집니다.</div><div class=\"lec-gr-item\">is completely made up (수동태): be동사(is)+p.p.(made) 구조입니다. make는 타동사(make+O)인데, 뒤에 목적어가 없어서 수동구조(be made) 형태로 씁니다. 기본구조: make O (O를 만들다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가짜 뉴스는</span><span class=\"en\"><b>Fake news</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 해로울 수 있다</span><span class=\"en\"><b>can be very harmful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 점에서 그것이 사람들을 만들 수 있다는</span><span class=\"en\"><b><span class=\"grammar-hl\">in that</span> it can <span class=\"grammar-hl\">make people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를 부족하게</span><span class=\"en\"><b><span class=\"grammar-hl\">less informed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 심지어 잘못 이끌도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">or even misled</span>.</b></span></div></div><div class=\"lec-sent-ko\">가짜 뉴스는 사람들에게 정보를 부족하게 제공하거나 사람들을 잘못 이끌 수 있다는 점에서 매우 해로울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가짜 뉴스의 위험성을 구체적으로 설명합니다. in that은 &#39;～라는 점에서&#39;라는 뜻의 관용구입니다. 또한, misled는 &#39;잘못 인도된&#39;이라는 뜻으로, 단순한 무지에서 더 나아가 잘못된 판단을 내리게 만드는 가짜 뉴스의 파괴적인 영향을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in that (관용표현): &#39;…라는 점에서&#39;라는 뜻을 가진 접속사적 표현으로, 뒤에 주어+동사로 이루어진 완전한 절을 이끕니다.</div><div class=\"lec-gr-item\">make people less informed or even misled 5형식(SVOC) 구조: make + 목적어(people) + 목적보어(less informed or even misled)의 구조입니다. 목적보어 자리에 과거분사(p.p.) 형태가 쓰여 목적어인 people이 느끼거나 당하는 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그럼에도 불구하고,</span><span class=\"en\"><b>Nevertheless,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">존재해 왔다</span><span class=\"en\"><b>there have been</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 가짜 뉴스 보도들이</span><span class=\"en\"><b>various <span class=\"grammar-hl\">fake news reports</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역사를 통틀어.</span><span class=\"en\"><b>throughout history.</b></span></div></div><div class=\"lec-sent-ko\">그럼에도 불구하고, 역사를 통틀어 다양한 가짜 뉴스 보도들이 존재해 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가짜 뉴스가 최근에만 발생하는 문제가 아니라 인류 역사 내내 있어온 보편적인 문제임을 시사합니다. 앞 문장의 위험성 경고와는 대조적으로, 가짜 뉴스가 사라지지 않는 &#39;현상&#39;임을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fake news reports 명사 수식: fake가 명사 news를 수식하고, news가 다시 reports를 수식하는 명사 결합 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b>Why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 써 왔던 것일까</span><span class=\"en\"><b><span class=\"grammar-hl\">have some people written</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 거짓 정보를?</span><span class=\"en\"><b>such false information?</b></span></div></div><div class=\"lec-sent-ko\">왜 어떤 사람들은 그러한 거짓 정보를 써 왔던 것일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가짜 뉴스를 생산하는 &#39;사람&#39;에게 초점을 옮깁니다. 이제 독자로 하여금 기사를 쓴 이들의 &#39;의도&#39;에 대해 고민해 보도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have some people written (도치): 의문사 Why가 문장 앞에 위치하며, 주어(some people) 앞에 조동사(have)가 나가는 의문문 도치 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴보자</span><span class=\"en\"><b>Let’s look into</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 기사를</span><span class=\"en\"><b>some articles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">thinking about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숨겨진 동기를</span><span class=\"en\"><b>the <span class=\"grammar-hl\">hidden motives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 뒤에 있는.</span><span class=\"en\"><b>behind them.</b></span></div></div><div class=\"lec-sent-ko\">그 뒤에 숨겨진 동기를 생각하면서 몇 가지 뉴스 기사를 살펴보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 목적을 제시하며 본론으로 들어갑니다. look into는 &#39;조사하다/자세히 살펴보다&#39;라는 뜻으로, 단순히 읽는 것을 넘어 그 기사가 가진 이면의 목적을 파헤쳐보자는 독려의 의미를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thinking about (분사구문): 주절의 주어와 동일한 주체가 생각하는 능동적 동작을 나타내며, 원래 절은 &#39;while we think about&#39;으로 변환할 수 있습니다.</div><div class=\"lec-gr-item\">hidden motives (과거분사): hidden이 motives를 수식하며, &#39;숨겨진 동기&#39;라는 수동적 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>매일 뉴스를 접하지만, 그것이 사실인지 의심해 본 적은 드물다.</li><li>가짜 뉴스는 사람들을 잘못된 정보로 현혹하여 큰 해를 끼칠 수 있다.</li><li>가짜 뉴스는 역사 속에서 계속 존재해 왔으며, 왜 생산되는지 고민해 볼 필요가 있다.</li><li>기사 뒤에 숨겨진 의도를 파악하며 가짜 뉴스에 대해 비판적으로 살펴봐야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Fake news can cause serious harm by misleading the public, so readers should critically evaluate news articles to identify the creators&#39; hidden motives.</div>\n              <div class=\"lec-final-sum-ko\">가짜 뉴스는 대중을 오도하여 심각한 해를 끼칠 수 있으므로, 독자들은 제작자의 숨겨진 의도를 파악하기 위해 뉴스 기사를 비판적으로 평가해야 한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meaning"},{"audio":"./1_audio/5.mp3","hl":"grammar"}],[{"audio":"./1_audio/6.mp3","hl":"main"},{"audio":"./1_audio/7.mp3","hl":"meaning"},{"audio":"./1_audio/8.mp3","hl":"grammar"}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"},{"audio":"./1_audio/23.mp3","hl":"grammar"}],[{"audio":"./1_audio/24.mp3","hl":"main"},{"audio":"./1_audio/25.mp3","hl":"meaning"},{"audio":"./1_audio/26.mp3","hl":"grammar"}],[{"audio":"./1_audio/27.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
