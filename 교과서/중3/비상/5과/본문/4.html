e (도치): 의문문 구조를 만들기 위해 유도부사 there 뒤의 be동사(is)가 주어(anything) 앞으로 이동한 도치 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 슬라브인의 이름을</span><span class=\"en\"><b><span class=\"grammar-hl\">Read</span> the Slav’s name</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거꾸로 읽어 보아라.</span><span class=\"en\"><b>backwards;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 철자는 “우리는 뉴스를 조작한다.”가 된다.</span><span class=\"en\"><b><span class=\"grammar-hl\">it spells</span> “we-fake-news.</b></span></div></div><div class=\"lec-sent-ko\">그 슬라브인의 이름을 거꾸로 읽어 보아라. 그것의 철자는 “우리는 뉴스를 조작한다.”가 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 구체적인 증거를 제시합니다. 여기서 spells는 사전적으로 &#39;철자를 쓰다&#39;라는 뜻이지만, 여기서는 특정 글자 조합이 어떤 의미를 &#39;나타내다&#39;라는 의미로 쓰였습니다. 독자들에게 기사가 조작되었음을 확실하게 인지시키기 위해 이 표현을 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Read 5형식(SVOC) 구조: 명령문 구조로, (you) Read + O(the Slav’s name) + O.C.(backwards, 부사보어)의 형태로 목적어의 상태나 동작 방향을 기술합니다.</div><div class=\"lec-gr-item\">it spells 5형식(SVOC) 구조: 주어(it) + 동사(spells) + O(the Slav’s name, 생략됨) + O.C.(“we-fake-news”)로, 목적어를 보어라고 칭함을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누가 이것을 썼고</span><span class=\"en\"><b><span class=\"grammar-hl\">Who wrote this</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그랬을까?</span><span class=\"en\"><b><span class=\"grammar-hl\">and why</span>?</b></span></div></div><div class=\"lec-sent-ko\">누가 이것을 썼고 왜 그랬을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기사 내용이 가짜임이 드러난 상황에서, 사건의 배후와 의도를 질문함으로써 이어질 사건의 동기(원인)를 밝히려는 연결 고리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who wrote this and why (간접의문문): 의문사 who와 why가 이끄는 명사절이 문장의 주어/목적어 역할을 하는 구조입니다. 여기서는 &#39;누가/왜 썼는지&#39;라는 의미의 의문사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">데일리 텔레그램 사는 이 거짓 기사를 발행했는데</span><span class=\"en\"><b>The Daily Telegram published this fake article</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증명하기 위해서</span><span class=\"en\"><b>so that they could <span class=\"grammar-hl\">prove</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데일리 뉴스 사가</span><span class=\"en\"><b><span class=\"grammar-hl\">if The Daily News,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 경쟁자인</span><span class=\"en\"><b><span class=\"grammar-hl\">their competitor,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 기사를 훔치는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">was stealing their articles</span>.</b></span></div></div><div class=\"lec-sent-ko\">데일리 텔레그램 사는 그들의 경쟁자인 데일리 뉴스 사가 그들의 기사를 훔치는지를 증명하기 위해서 이 거짓 기사를 발행했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 던진 질문에 대한 해답입니다. &#39;경쟁사&#39;라는 관계를 통해 stealing이라는 단어를 사용했는데, 이는 단순히 무언가를 가져가는 것을 넘어 타인의 저작물(기사)을 무단으로 도용하는 비도덕적 행위를 강조하기 위해 선택된 어휘입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">prove if The Daily News, their competitor, was stealing their articles (간접의문문): &#39;whether/if + S + V&#39; 구조로, prove의 목적어 자리에 명사절이 위치하여 &#39;…인지 아닌지&#39;라는 의미를 전달합니다.</div><div class=\"lec-gr-item\">their competitor (동격): 명사(The Daily News) 뒤에 콤마와 함께 명사구(their competitor)를 배치하여 앞의 명사를 구체적으로 설명하는 동격 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">데일리 뉴스 사는 동일한 기사를 발행했고</span><span class=\"en\"><b>The Daily News published the same article</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘Swenekafew’에 대한</span><span class=\"en\"><b>about “Swenekafew”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 다음 날</span><span class=\"en\"><b>the next day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 훔친 것이 발각되었다.</span><span class=\"en\"><b>and thus <span class=\"grammar-hl\">got caught stealing</span>.</b></span></div></div><div class=\"lec-sent-ko\">데일리 뉴스 사는 그 다음 날 ‘Swenekafew’에 대한 동일한 기사를 발행했고 그래서 훔친 것이 발각되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 계획이 실행되어 결과적으로 경쟁사가 덫에 걸려들었음을 보여주는 &#39;원인과 결과&#39;의 논리 구조입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got caught stealing (수동태): be동사 대신 상태 변화를 나타내는 get을 사용한 수동구조입니다. catch는 &#39;catch + O + -ing&#39;의 능동 구조(O가 -ing 하는 것을 잡다)를 가지는데, 목적어가 주어로 나가면서 &#39;be/get + p.p.(caught) + -ing(현재분사)&#39; 형태로 쓰였습니다.</div><div class=\"lec-gr-item\">stealing (현재분사): &#39;got caught&#39; 뒤에서 &#39;훔치고 있는 상태&#39;를 보충 설명하는 현재분사 보어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">데일리 뉴스 사의 사람들은</span><span class=\"en\"><b>The people at The Daily News</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 행동을 인정해야만 했고</span><span class=\"en\"><b><span class=\"grammar-hl\">had to admit</span> their act</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹독한 비난을 받았는데</span><span class=\"en\"><b>and <span class=\"grammar-hl\">were harshly criticized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중으로부터</span><span class=\"en\"><b>by the public.</b></span></div></div><div class=\"lec-sent-ko\">데일리 뉴스 사의 사람들은 그들의 행동을 인정해야만 했고 대중으로부터 혹독한 비난을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도용에 대한 최종적인 대가와 사회적 파장을 서술하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to admit (관용표현): &#39;have to + 동사원형&#39;은 &#39;~해야 한다&#39;는 의무를 나타내는 관용적인 조동사 표현입니다.</div><div class=\"lec-gr-item\">were harshly criticized (수동태): be동사(were)+p.p.(criticized) 구조입니다. criticize는 타동사인데 목적어가 없어서 수동구조 were criticized 형태로 씁니다. 기본구조: criticize + O (O를 비판하다).</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>The Daily Telegram은 경쟁사가 기사를 베끼는지 확인하려고 가짜 기사를 실었다.</li><li>경쟁사인 The Daily News가 그 기사를 그대로 베껴 실었다가 덜미를 잡혔다.</li><li>결국 The Daily News는 잘못을 인정하고 대중의 비난을 받았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Daily Telegram published a fake story to catch its competitor stealing content, and The Daily News suffered severe public criticism after being exposed for copying it.</div>\n              <div class=\"lec-final-sum-ko\">데일리 텔레그램은 경쟁사의 기사 도용을 적발하기 위해 가짜 기사를 게시했으며, 이를 베꼈다가 들통난 데일리 뉴스는 대중의 거센 비판을 받았다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":"main"},{"audio":"./4_audio/4.mp3","hl":"meaning"},{"audio":"./4_audio/5.mp3","hl":"grammar"}],[{"audio":"./4_audio/6.mp3","hl":"main"},{"audio":"./4_audio/7.mp3","hl":"meaning"},{"audio":"./4_audio/8.mp3","hl":"grammar"}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":". "src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
