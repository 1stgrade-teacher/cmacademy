화가 난 코뿔소 떼가</span><span class=\"en\"><b>an angry group of rhinoceroses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽을 부수었다</span><span class=\"en\"><b><span class=\"grammar-hl\">broke down</span> the walls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의</span><span class=\"en\"><b>of the cage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에 있는</span><span class=\"en\"><b>at the zoo</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 탈출했다.</span><span class=\"en\"><b>and escaped.</b></span></div></div><div class=\"lec-sent-ko\">어젯밤, 화가 난 코뿔소 떼가 동물원 우리의 벽을 부수고 도망쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 마치 실제 사건인 것처럼 코뿔소 탈출이라는 충격적인 상황을 가정하여 독자의 주의를 끕니다. 여기서 broke down은 사전적으로 &#39;고장 나다&#39;라는 뜻도 있지만, 여기서는 물리적인 힘을 가해 &#39;벽을 허물어뜨리다&#39;라는 의미로 쓰여 상황의 긴박함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke down (관용표현): &#39;허물다/부수다&#39;라는 뜻의 구동사(phrasal verb)로, broke(동사)와 down(부사)이 결합하여 하나의 타동사구처럼 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한</span><span class=\"en\"><b>They also</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽을 부수었다</span><span class=\"en\"><b><span class=\"grammar-hl\">broke down</span> the walls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 야생 동물 우리들의</span><span class=\"en\"><b>of the other wild animals’ cages.</b></span></div></div><div class=\"lec-sent-ko\">그 코뿔소들은 또한 다른 야생 동물 우리의 벽도 부수었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 시작된 코뿔소의 난동이 다른 동물들까지 이어졌음을 보여주며, 상황이 걷잡을 수 없이 커지고 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke down (관용표현): &#39;허물다/부수다&#39;를 의미하며, 뒤에 목적어(the walls of the other wild animals’ cages)를 취하는 타동사구 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 동물들은</span><span class=\"en\"><b>These animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거리를 뛰어다녔다</span><span class=\"en\"><b><span class=\"grammar-hl\">ran down</span> the streets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 부상을 입혔다</span><span class=\"en\"><b>and injured</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 명의 사람들에게</span><span class=\"en\"><b>hundreds of people.</b></span></div></div><div class=\"lec-sent-ko\">이 동물들은 거리를 뛰어다니며 수백 명의 사람들에게 부상을 입혔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 코뿔소의 탈출이 단순히 우리를 부수는 것에 그치지 않고 시민들에게 직접적인 피해를 입히는 재난 상황으로 확대되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ran down (관용표현): &#39;따라 내려가다/달려 내려가다&#39;라는 뜻으로, 이동의 방향을 나타내는 부사와 함께 쓰인 구동사</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">열두 마리의 동물들이</span><span class=\"en\"><b>Twelve of the animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 있다</span><span class=\"en\"><b>are still</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잡히지 않은 상태로</span><span class=\"en\"><b><span class=\"grammar-hl\">on the loose</span>.</b></span></div></div><div class=\"lec-sent-ko\">그중 열두 마리의 동물들이 아직 잡히지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> on the loose는 사전적으로 &#39;풀려난, 자유로운&#39; 상태를 의미하지만, 문맥상으로는 범죄자나 위험한 동물이 &#39;잡히지 않고 돌아다니는&#39; 상태를 뜻합니다. 위협이 아직 끝나지 않았음을 암시하여 독자의 불안감을 고조시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on the loose (관용표현): &#39;도망친/풀려난&#39; 상태를 의미하는 형용사구로, be동사 뒤에서 보어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시민들은</span><span class=\"en\"><b>Citizens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실내에 머물러야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">should stay</span> indoors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추후 안내가 있을 때까지</span><span class=\"en\"><b>until further notice.</b></span></div></div><div class=\"lec-sent-ko\">시민들은 추후 안내가 있을 때까지 집 안에 머물러야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재난 상황에서 흔히 쓰이는 공고문을 인용하여, 이 글이 마치 사실처럼 보이도록 정교하게 구성했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should stay 당위성 표현: 조동사 should를 사용하여 의무나 권고의 상황을 나타내며, stay(동사원형)가 뒤따름</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단 하나의 행동도</span><span class=\"en\"><b><span class=\"grammar-hl\">Not a single act</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 사건도</span><span class=\"en\"><b><span class=\"grammar-hl\">or incident</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위에 기술된</span><span class=\"en\"><b><span class=\"grammar-hl\">described above</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어나지 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">has taken place</span>.</b></span></div></div><div class=\"lec-sent-ko\">위에 기술된 어떤 행동이나 사건도 일어나지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 내용이 모두 가짜였음을 밝히며 글의 반전을 이끕니다. take place는 보통 &#39;일어나다&#39;라는 뜻이지만, 여기서는 앞선 가상의 사건들이 실제 현실과는 연결되지 않음을 명확히 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Not a single act or incident (도치): 부정어구(Not)가 문장 앞으로 나오면서 강조된 구조로, 뒤에 동사(has taken)가 이어짐</div><div class=\"lec-gr-item\">described above (과거분사(형용사)): described가 앞에 있는 명사(act or incident)를 수식함. N + p.p. 구조로 &#39;...위에 서술된 N&#39;이라는 의미</div><div class=\"lec-gr-item\">has taken place (관용표현): &#39;일어나다/발생하다&#39;라는 뜻의 자동사구(take place)를 현재완료형으로 사용함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 당시에,</span><span class=\"en\"><b>At that time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 기사를 주의 깊게 읽었던</span><span class=\"en\"><b><span class=\"grammar-hl\">who read the article carefully</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크게 웃었다</span><span class=\"en\"><b>laughed out loud.</b></span></div></div><div class=\"lec-sent-ko\">그 당시 이 기사를 주의 깊게 읽었던 사람들은 크게 웃었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기사의 끝까지 읽어 거짓임을 파악한 사람들과 그렇지 못한 사람들을 대비시키며, 정보 수용자의 태도에 따른 반응 차이를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">those who read the article carefully (관계대명사): who는 주격 관계대명사로, 선행사(those)를 수식하며 who 뒤에는 주어 역할을 하는 관계대명사절(who read the article carefully)이 이어짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 읽지 않은</span><span class=\"en\"><b><span class=\"grammar-hl\">who didn’t read it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끝까지</span><span class=\"en\"><b><span class=\"grammar-hl\">to the end</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말로 걱정하였다</span><span class=\"en\"><b>got really worried.</b></span></div></div><div class=\"lec-sent-ko\">그것을 끝까지 읽지 않은 사람들은 정말로 걱정하였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장과 대조를 이루며, 문맥을 끝까지 파악하지 않는 것이 얼마나 쉽게 오해를 불러일으킬 수 있는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Those who didn’t read it to the end (관계대명사): who는 주격 관계대명사로, 선행사(Those)를 수식하며 뒤에 주어 역할이 포함된 완전하지 않은 절이 이어짐</div><div class=\"lec-gr-item\">to the end (관용표현): &#39;끝까지&#39;라는 의미의 전치사구로, 동작의 범위를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알지 못했기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">Not knowing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 뉴스가 거짓이라는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">the news was false</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람이</span><span class=\"en\"><b>many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겁에 질려 어쩔 줄 몰랐다</span><span class=\"en\"><b>panicked.</b></span></div></div><div class=\"lec-sent-ko\">그 기사가 거짓이라는 것을 알지 못했기 때문에 많은 사람이 겁에 질려 어쩔 줄 몰랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가짜 뉴스에 속아 사람들이 비이성적으로 반응하게 되었음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Not knowing the news was false (분사구문): 현재분사(knowing)로 시작하며 주절의 주어(many people)와 의미상 주어가 일치함. 의미는 이유(because they did not know...)를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b>Some</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탈출하려고 했다</span><span class=\"en\"><b>tried <span class=\"grammar-hl\">to escape</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시를</span><span class=\"en\"><b>the city</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면 다른 사람들은</span><span class=\"en\"><b>while others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공원으로 들어갔다</span><span class=\"en\"><b>went into the parks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">총을 들고</span><span class=\"en\"><b>with guns</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물들을 사냥하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to hunt</span> the animals.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 도시를 빠져나가려고 했고 다른 사람들은 그 동물들을 사냥하기 위해 총을 들고 공원으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가짜 뉴스가 실제로 사람들을 잘못된 행동으로 이끄는 구체적인 사례를 나열합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to escape (to부정사): 부사적 용법(목적)으로, &#39;탈출하기 위해&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">to hunt (to부정사): 부사적 용법(목적)으로, &#39;사냥하기 위해&#39;라는 의미를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 왜</span><span class=\"en\"><b>So why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헤럴드 사는</span><span class=\"en\"><b><span class=\"grammar-hl\">did The Herald</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지어냈는가</span><span class=\"en\"><b><span class=\"grammar-hl\">make up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 뉴스를?</span><span class=\"en\"><b>such news?</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 왜 헤럴드 사는 이러한 뉴스를 만들어 냈을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사건들의 원인을 묻는 질문을 던짐으로써 글의 목적(의도)을 설명하기 위한 전환점을 만듭니다. 여기서 make up은 사전적으로 &#39;화장하다, 구성하다&#39;라는 뜻도 있지만, 여기서는 사실이 아닌 것을 꾸며내는 &#39;날조하다(지어내다)&#39;라는 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did The Herald make up 간접의문문과 관련된 의문문 구조: 조동사(did)를 사용한 의문문이며, make up은 &#39;지어내다&#39;라는 뜻의 관용표현</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에,</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 고백했다</span><span class=\"en\"><b>they confessed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그것을 지어냈다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that they made it up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 끌 수 있도록</span><span class=\"en\"><b><span class=\"grammar-hl\">so that they could draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독자들의 관심을</span><span class=\"en\"><b>the readers’ attention</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전하지 않은 상태로</span><span class=\"en\"><b>to the unsafe conditions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에 있는</span><span class=\"en\"><b>at the zoo.</b></span></div></div><div class=\"lec-sent-ko\">나중에 그들은 동물원의 안전하지 않은 상태에 대해 독자들의 주의를 끌기 위해 그 기사를 지어냈다고 고백했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기사가 거짓임을 밝히며, 그 이면에 있는 언론의 사회적 목적(동물원 안전 문제 제기)을 드러냅니다. 여기서 draw attention to는 단순히 &#39;주의를 당기다&#39;라는 뜻인데, 사회적 문제에 대해 공론화를 유도하고 경각심을 주려는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that they made it up (명사절): 접속사 that이 이끄는 명사절로, 동사(confessed)의 목적어 역할을 함</div><div class=\"lec-gr-item\">made it up (관용표현): &#39;지어내다/날조하다&#39;라는 의미의 구동사</div><div class=\"lec-gr-item\">so that they could draw (to부정사/부사절): so that은 목적을 나타내는 접속사이며, draw(동사원형)는 조동사 could 뒤에 이어짐</div><div class=\"lec-gr-item\">draw the readers’ attention to 5형식(SVOC) 구조와 유사한 목적보어적 해석: draw(동사) + A(목적어) + to B(전치사구)의 형태로, A의 주의를 B로 끌다라는 의미</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>신문사가 코뿔소 탈출이라는 가짜 뉴스를 만들어 사람들을 혼란에 빠뜨렸다.</li><li>기사를 끝까지 읽지 않은 사람들은 공포에 질려 비이성적으로 행동했다.</li><li>알고 보니 이는 동물원 안전 문제에 대한 사람들의 관심을 유도하려는 의도였다.</li><li>가짜 뉴스를 통한 경각심 유발이 정당한지에 대해 생각하게 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The newspaper invented a fake story to warn the public about zoo safety, but the report caused widespread panic because readers believed it was true.</div>\n              <div class=\"lec-final-sum-ko\">신문사는 동물원 안전에 대해 경고하려고 가짜 이야기를 지어냈지만, 독자들이 이를 사실로 믿으면서 그 보도는 광범위한 공포를 불러일으켰다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":"main"},{"audio":"./2_audio/4.mp3","hl":"meaning"},{"audio":"./2_audio/5.mp3","hl":"grammar"}],[{"audio":"./2_audio/6.mp3","hl":"main"},{"audio":"./2_audio/7.mp3","hl":"meaning"},{"audio"
