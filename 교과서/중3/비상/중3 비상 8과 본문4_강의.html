neXj+CXt1T1PPGPpxn1zgdVq9rrXy81/wf89hfLXv9179vv6ddCHHft344B+o/T69+tKVwwByA3p24GOvOMnp1656ZqcCRcgpJ1JztbuD7Zz9cnPPc07aeDskGR/d/iPJ4xxj68de4wr6623std3eNn0Wj+7XtcG2noui011V49nv1erSvp5VcEY4985x6fyz7fj2Q8jnp+P8v8nNWmjcAEo7K3ovbIyO5zzzwPoOtRGNsnbG+OuccfoOp5Pb19hV+nq/yv8AoStd4rWzv9ya9Vrp5Ws+sOOMAcY4/H8D+uev1pORg9R0PbkHr9Ov1465qXy5MZ2N/wB8n8+nT36UeXJ/zzf/AL5b/Ci67g4tap+t9rvr5Xdtvk9hlAU5zz09CejKwGQD9e59QRUyqRxsc5A/hzwduSOBxx3OADjg5JdtYZIjcY7YGeo57ck9+OBzjFK6vb+rq2n4pf8ABI27uzettOmj19VbZ38yIoRgjBOVx145BJOcqcEEcc4HcGnqpAwcckH36j+WOnf2HWQJIQD5bAH/AGeB27dB6dB9KURucAowz3Ibg+nHGe+Cc+nOMHXvbT77BZuy5bbK9n5K/b+vMYF7D0wB6Ae/bjjOfTv1nCjkKDkle+e/YYHHpzzyMmlWJxwFY5AH3CclevXd0OOQenYVLHFIZEHlvksoBKt3YdMDPt0/M0LXVar5+Vnt0enk/O6Eo3tpfr2TSts3br9x/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Wormholes: Theoretical Possibilities and Practical Risks<small>웜홀: 이론적 가능성과 실질적인 위험</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 영화에서 보는 웜홀(Wormhole)은 우주 공간의 두 지점을 연결하는 지름길과 같은 통로를 말하며, 아인슈타인의 일반 상대성 이론(General Theory of Relativity)을 바탕으로 수학적으로 존재 가능성이 처음 제시되었습니다. 하지만 웜홀이 실제로 존재한다 하더라도, 엄청난 중력의 변화로 인해 통로가 순식간에 닫히거나 우주선을 찌그러뜨릴 만큼 매우 불안정한 상태라는 것이 과학계의 정설이에요. 이를 쉽게 비유하자면, 튼튼한 다리를 건너는 것이 아니라 형태를 유지하지 못하고 계속 출렁거리는 비눗방울 속으로 뛰어드는 것과 비슷하답니다. 따라서 과학자들은 웜홀을 안정적으로 유지하기 위해 &#39;이질적인 물질(Exotic Matter)&#39;과 같이 에너지를 제어할 수 있는 가상의 물질이 필요할 것이라고 추측하며, 아직은 이를 기술적으로 실현할 방법이 없는 상태예요. 즉, 웜홀은 현재로서는 공상과학(SF)적인 상상력을 자극하는 흥미로운 이론적 개념에 머물러 있는 것이죠.</div></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">벌레 구멍처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">Just like</span> a wormhole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과 안에 있는,</span><span class=\"en\"><b>in the apple,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지 않나요?</span><span class=\"en\"><b>right?</b></span></div></div><div class=\"lec-sent-ko\">Sci Teen: 사과에 있는 벌레 구멍처럼요, 그렇죠?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 대화에서 사과를 예로 들어 설명했던 &#39;웜홀&#39; 개념을 확인하고 있습니다. 여기서 wormhole은 사전적으로 &#39;벌레가 파먹은 구멍&#39;이지만, 여기서는 우주 공간의 서로 떨어진 두 지점을 잇는 &#39;지름길&#39;을 의미합니다. 어려운 과학 개념을 친숙한 사과에 빗대어 이해하려는 학생의 모습을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Just like (관용표현): &#39;~와 똑같이&#39;라는 의미의 전치사구로, 뒤에 명사구(a wormhole)를 취해 부사구 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그런 웜홀들이</span><span class=\"en\"><b>If such wormholes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에 존재한다면,</span><span class=\"en\"><b>existed in space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 장소들에 도달할 수 있을 텐데</span><span class=\"en\"><b>we could get to places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수십억 광년 떨어진</span><span class=\"en\"><b><span class=\"grammar-hl\">billions of light-years away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠르게!</span><span class=\"en\"><b>quickly!</b></span></div></div><div class=\"lec-sent-ko\">그런 웜홀이 우주에 존재한다면 우리는 수십억 광년 떨어져 있는 곳에 빠르게 도달할 수 있을 텐데요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 웜홀의 기능을 구체적으로 설명합니다. get to는 사전적으로는 &#39;도착하다&#39;인데, 여기서는 엄청나게 먼 거리라는 공간적 제약을 뛰어넘어 목적지에 도달한다는 &#39;이동&#39;의 의미를 강조합니다. 인간의 상상력이 과학 기술로 구현되었을 때의 기대감을 드러내는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">billions of light-years away (관용표현): &#39;수십억 광년 떨어진&#39;이라는 의미로, 형용사 away가 앞의 거리를 나타내는 명사구와 결합하여 부사적 의미를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇지만,</span><span class=\"en\"><b>Yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 이르다</span><span class=\"en\"><b>but it’s <span class=\"grammar-hl\">too early</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축하하기에는.</span><span class=\"en\"><b><span class=\"grammar-hl\">to celebrate</span>.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 그렇죠, 하지만 축하하기에는 너무 이릅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학 꿈나무의 낙관적인 생각에 제동을 거는 문장입니다. 여기서 celebrate는 사전적으로 &#39;축하하다&#39;인데, 여기서는 웜홀을 이용한 우주 여행이 이미 성공한 것처럼 기뻐하는 태도를 경계하는 의미입니다. 기대와 현실 사이의 간극을 짚어주는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too early to celebrate (to부정사): &#39;to celebrate&#39;가 앞의 형용사 &#39;early&#39;를 수식하는 형용사적 용법의 부사적 보충으로, &#39;~하기에는 이르다&#39;라는 의미를 구성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">웜홀들은</span><span class=\"en\"><b>Wormholes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">존재한다</span><span class=\"en\"><b>exist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이론상으로만.</span><span class=\"en\"><b><span class=\"grammar-hl\">in theory</span> only.</b></span></div></div><div class=\"lec-sent-ko\">웜홀은 이론상에서만 존재합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 왜 아직 축하할 때가 아닌지 그 이유를 설명합니다. theory는 &#39;이론&#39;이지만, 여기서는 &#39;실제로 증명되지 않은 공상이나 가정&#39;을 뜻합니다. 과학적 가능성은 열려 있으나 현실화하기엔 아직 먼 미래의 일임을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in theory (관용표현): &#39;이론상으로는&#39;이라는 의미를 가진 전치사구로, 문장 전체를 수식하는 부사구로 사용됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니 우리가 해야 할 모든 것은</span><span class=\"en\"><b>So <span class=\"grammar-hl\">all we need to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나를 찾는 것이다,</span><span class=\"en\"><b><span class=\"grammar-hl\">is find one</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지?</span><span class=\"en\"><b>right?</b></span></div></div><div class=\"lec-sent-ko\">Sci Teen: 그러면 우리가 해야 할 것이라고는 그것을 찾는 거네요, 그렇죠?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박사의 말을 듣고 여전히 웜홀의 존재를 긍정적으로 받아들이며, 다음 단계인 &#39;발견&#39;에 초점을 맞추는 학생의 호기심을 나타냅니다. find라는 행동에 모든 해결책이 있다고 믿는 단순하고 희망적인 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">all we need to do is find one to부정사/5형식(SVOC): &#39;all&#39;을 수식하는 관계대명사절(we need to do)이 주어로 쓰였으며, 보어 자리의 &#39;find&#39;는 원형부정사로 사용되어 &#39;해야 할 유일한 일은 찾는 것이다&#39;라는 구조를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 우리가 하나를 찾는다 해도,</span><span class=\"en\"><b>Even if we find one,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 것들이 있다</span><span class=\"en\"><b>there are many <span class=\"grammar-hl\">things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고려해야 할</span><span class=\"en\"><b><span class=\"grammar-hl\">to consider</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 그것을 통과하기 전에.</span><span class=\"en\"><b><span class=\"grammar-hl\">before actually going through</span> one.</b></span></div></div><div class=\"lec-sent-ko\">Dr. Sci: 우리가 그것을 찾는다고 하더라도 실제로 그것을 통과하여 가기 전에 고려해야 할 것들이 많이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 학생의 질문에 대해 단순히 찾는 것만이 문제가 아님을 명시합니다. consider는 &#39;고려하다&#39;라는 뜻인데, 여기서는 우주 여행의 안전성과 관련된 복잡하고 치명적인 변수들을 깊이 생각해보라는 경고의 의미를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">things to consider (to부정사): &#39;to consider&#39;가 앞의 명사 &#39;things&#39;를 뒤에서 수식하는 형용사적 용법으로, &#39;~해야 할 것들&#39;이라는 의미를 만듦</div><div class=\"lec-gr-item\">before actually going through (동명사): 전치사 &#39;before&#39;의 목적어로 쓰인 &#39;going&#39;은 동명사로, &#39;~하기 전에&#39;라는 시간적 의미를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">웜홀은</span><span class=\"en\"><b><span class=\"grammar-hl\">A wormhole</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일 것이다</span><span class=\"en\"><b>would be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 불안정한.</span><span class=\"en\"><b>very unstable.</b></span></div></div><div class=\"lec-sent-ko\">웜홀은 매우 불안정할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장에서 언급한 &#39;고려해야 할 많은 것&#39; 중 가장 중요한 이유를 제시합니다. unstable은 &#39;불안정한&#39;이라는 뜻으로, 웜홀이라는 구조 자체가 형태를 유지하지 못하고 쉽게 사라지거나 변할 수 있음을 나타내어 여행의 위험성을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A wormhole 문장의 핵심 주어로서, 가정의 상황을 나타내는 조동사 &#39;would&#39;와 결합하여 이론적인 상태를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우주선이</span><span class=\"en\"><b>If a spaceship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안으로 날아간다면,</span><span class=\"en\"><b>flew into one,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 으스러질 수도 있다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">might be crushed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 조각조각 부서질 수도 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">or broken</span> into pieces.</b></span></div></div><div class=\"lec-sent-ko\">만약 우주선이 그 안으로 날아가게 되면, 그것은 부서지거나 산산조각이 날 수도 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 불안정한 웜홀을 통과했을 때 일어날 수 있는 구체적인 비극적 결과를 묘사합니다. crushed는 &#39;찌그러뜨리다&#39;인데, 여기서는 거대한 우주 공간의 힘에 의해 우주선이 압도당해 형태가 망가지는 모습을 생생하게 표현하려고 이 단어를 썼습니다. 과학적 상상력에 따르는 위험성을 보여주며 대화를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might be crushed or broken (수동태): be동사(be) + p.p.(crushed/broken) 구조. crush와 break는 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: crush/break + O(목적어)</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학생은 사과 속 벌레 구멍을 예로 들어 웜홀을 통한 빠른 우주 여행의 가능성에 들떠 있다.</li><li>박사는 웜홀이 현재는 이론상의 개념일 뿐임을 지적하며 냉정함을 유지한다.</li><li>설령 웜홀을 발견하더라도 그 불안정성 때문에 우주선이 파괴될 위험이 있음을 경고한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Wormholes are theoretically useful for fast space travel, yet they are too unstable for a spaceship to pass through safely.</div>\n              <div class=\"lec-final-sum-ko\">웜홀은 빠른 우주 여행에 이론적으로 유용하지만, 우주선이 안전하게 통과하기에는 너무 불안정하다.</div></div></div>"],"segs":[[],[],[],[],[],[],[],[],[],[],[]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
