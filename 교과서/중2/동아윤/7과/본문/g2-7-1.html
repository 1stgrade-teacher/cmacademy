</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"중2 동아(윤) 7과 본문1","audioDir":"g2-7-1_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>The Fallas Festival: Welcoming Spring in Valencia\u003c/h1>\u003ch2>발렌시아의 Fallas 축제: 봄을 맞이하는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>스페인 발렌시아에서 \u003cb class=\"key\">봄\u003c/b>의 시작을 기념하기 위해 열리는 \u003cb class=\"key\">Fallas \u003c/b>\u003cb class=\"key\">축제\u003c/b>의 시기와 활동, 그리고 거대 조각상을 \u003cb class=\"key\">불태우는\u003c/b> 전통의 상징적 의미를 소개하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Fallas festival in Valencia celebrates the arrival of spring by creating and burning giant wooden statues to symbolize a fresh start.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 스페인 발렌시아에서 열리는 아주 뜨겁고 화려한 축제인 Fallas Festival에 대해 함께 공부해 보겠습니다. 이 글은 봄을 맞이하는 발렌시아 사람들의 독특한 축제 문화와 그 핵심인 거대 조각상의 상징적 의미를 담고 있어요. 자, 그럼 발렌시아로 떠나볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스페인의 \u003cb class=\"key\">Fallas \u003c/b>\u003cb class=\"key\">축제\u003c/b>는 중세 시대 목수들이 겨울이 끝나고 봄이 오면 불필요해진 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">지지대(parots)\u003c/b>를 태웠던 풍습에서 유래했습니다. 이 축제는 현재 유네스코 \u003cb class=\"key\">인류 \u003c/b>\u003cb class=\"key\">무형 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">유산\u003c/b>으로 등재될 만큼 스페인을 대표하는 문화적 가치가 매우 높습니다. 마치 우리가 새해를 맞이하며 \u003cb class=\"key\">묵은 \u003c/b>\u003cb class=\"key\">때\u003c/b>를 벗겨내듯, 스페인 사람들도 과거의 나쁜 기운을 불로 태워 없애고 \u003cb class=\"key\">희망찬 \u003c/b>\u003cb class=\"key\">시작\u003c/b>을 염원하는 것입니다. 축제 기간 동안 발렌시아 도시 전역은 거대한 야외 전시장으로 변하며, 마지막 날의 \u003cb class=\"key\">화형식\u003c/b>은 축제의 절정을 이룹니다.\u003c/div>","segs":[{"n":2,"text":"스페인의 Fallas 축제는 아주 오랜 역사를 가지고 있어요. 과거 중세 시대에 목수들이 겨울 동안 밤을 밝히기 위해 썼던 나무 지지대를 봄이 오면 필요가 없어져서 불태웠던 것에서 시작되었죠. 지금은 유네스코 인류 무형 문화 유산으로 지정될 만큼 전 세계적으로 유명한 축제가 되었습니다. 마치 우리가 새해에 묵은 때를 벗겨내는 것처럼, 이들도 불꽃을 통해 과거를 청산하고 희망찬 시작을 염원하는 마음을 담는답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>축제의 시기와 활동\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>발렌시아 사람들이 \u003cb class=\"key\">봄\u003c/b>을 맞이하며 개최하는 \u003cb class=\"key\">Fallas \u003c/b>\u003cb class=\"key\">축제\u003c/b>의 기본 정보인 개최 시기와 주요 활동인 \u003cb class=\"key\">퍼레이드\u003c/b> 및 불꽃놀이를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>축제의 주인공 파야\u003csmall>상세 설명 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>축제의 핵심 요소인 \u003cb class=\"key\">거대 \u003c/b>\u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">조각상(fallas)\u003c/b>을 소개하며, 도시 전역에서 \u003cb class=\"key\">수백 \u003c/b>\u003cb class=\"key\">개\u003c/b>의 조각상을 볼 수 있다는 점을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>화형식과 상징성\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>축제 마지막 날 조각상을 \u003cb class=\"key\">불태우는\u003c/b> 행위가 단순히 끝을 의미하는 것이 아니라 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">시작\u003c/b>을 맞이한다는 \u003cb class=\"key\">상징성\u003c/b>을 담고 있음을 설명합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 축제의 기본 정보에서 시작해 주인공인 파야를 거쳐 그 상징적 의미로 마무리되는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째부터 세 번째 문장까지는 축제의 도입부예요. 발렌시아 사람들이 봄이 오는 것을 기념하기 위해 삼월 중순에 이 축제를 열고, 그 기간 동안 퍼레이드와 불꽃놀이를 즐긴다는 사실을 알려줍니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 축제의 하이라이트인 거대 나무 조각상 Fallas를 소개해요. 도시 곳곳에서 수백 개의 거대한 작품들을 만날 수 있다는 점이 정말 인상적이죠.","hl":"f1"},{"n":6,"text":"여섯 번째와 마지막 일곱 번째 문장에서는 축제의 결말을 보여줍니다. 놀랍게도 이 예쁜 조각상들을 마지막 날에 모두 태워버리는데, 이것은 낡은 것들을 보내고 새로운 시작을 환영한다는 깊은 뜻이 담겨 있어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순 및 묘사\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 첫 문장에서 축제의 \u003cb class=\"key\">명칭과 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 제시하며 주제를 명확히 밝히는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 이후 축제의 시점부터 마지막 날의 이벤트까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 축제의 특징을 묘사하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>During the festival (3)\u003c/b>\u003cspan>특정 기간 동안의 활동 연결\u003c/span>\u003cb>on the last day (6)\u003c/b>\u003cspan>시간적 흐름에 따른 절정 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Fallas Festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fallas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">giant wooden statues\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hundreds of them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Burning them\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 첫 문장에서 바로 축제의 이름과 목적을 언급하는 전형적인 두괄식 구조를 취하고 있습니다. 또한 축제의 시작부터 마지막 날까지의 일정을 보여주는 시간의 흐름에 따른 전개 방식을 사용하고 있어요.","hl":"ty"},{"n":8,"text":"세 번째 문장의 During the festival은 축제 기간 중의 활동을 연결해주고 있고, 여섯 번째 문장의 on the last day는 시간의 흐름에 따른 축제의 절정을 보여주는 중요한 신호어 역할을 합니다. 또한 Fallas라는 단어가 조각상과 그것들을 태우는 행위로 계속 이어지며 글의 통일성을 유지하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기념하다, 축하하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coming\u003c/b>\u003cem>
