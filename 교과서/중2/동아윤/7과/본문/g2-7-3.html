</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;

  a.onloadeddata=function(){okBase=true;};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

}
lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"중2 동아(윤) 7과 본문3","audioDir":"g2-7-3_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Mexico's Joyful Remembrance: Day of the Dead Festival\u003c/h1>\u003ch2>멕시코의 즐거운 추모: Day of the Dead 축제\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>멕시코 사람들은 죽은 이들을 기리기 위해 \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">자들의 \u003c/b>\u003cb class=\"key\">날\u003c/b> 축제를 열며, 제단을 차리거나 해골 복장을 하는 등 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">분위기\u003c/b> 속에서 고인을 기억합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mexicans celebrate the Day of the Dead to honor and remember their deceased loved ones through festive activities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 멕시코의 아주 특별하고 독특한 축제에 대해 배워볼 거예요. 이번 지문의 제목은 멕시코의 Day of the Dead 축제입니다. 우리는 이 글을 통해 죽음을 슬퍼하기보다 기쁘게 기억하는 멕시코 사람들의 따뜻한 문화를 살펴보고, 죽은 자를 기억하는 것이 얼마나 중요한지 확인해 볼 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">멕시코의 '죽은 자들의 날(Día de los Muertos)'은 유네스코 \u003cb class=\"key\">인류 \u003c/b>\u003cb class=\"key\">무형 \u003c/b>\u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">유산(Cultural \u003c/b>\u003cb class=\"key\">Heritage \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Humanity)\u003c/b>으로 지정된 중요한 명절입니다. 죽음을 슬픔으로만 보지 않고, 고인의 영혼이 이승을 방문하는 \u003cb class=\"key\">축제(Celebration)\u003c/b>로 여겨 기쁘게 맞이하는 것이 특징입니다. 이는 마치 멀리 떠나 있던 가족이 오랜만에 집에 돌아오는 \u003cb class=\"key\">명절 \u003c/b>\u003cb class=\"key\">연휴\u003c/b>를 준비하며 온 가족이 들뜨는 모습과 비슷합니다. 아즈텍 문명의 전통과 가톨릭 신앙이 결합하여 만들어진 독특한 문화이며, 주황색 \u003cb class=\"key\">금잔화(Marigold)\u003c/b> 꽃길을 깔아 죽은 이들을 인도한다고 믿습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 애니메이션 영화 코코를 본 적 있나요? 거기서 나오는 화려한 주황색 꽃들과 해골들이 바로 오늘 배울 Day of the Dead의 모습입니다. 멕시코 사람들은 죽음이 끝이 아니라 다른 세계로의 여행이라고 믿거든요. 그래서 일 년에 한 번 고인들이 이승의 가족을 보러 온다고 생각하고, 마치 명절에 귀성객을 맞이하듯 기쁘게 준비한답니다. 이것은 고인을 영원히 잊지 않겠다는 사랑의 약속과도 같아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>축제의 유래와 명칭\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>멕시코 사람들이 죽은 이들이 일 년에 한 번 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">돌아온다\u003c/b>고 믿는 전통적인 신념과 이 날을 부르는 \u003cb class=\"key\">공식 \u003c/b>\u003cb class=\"key\">명칭\u003c/b>을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>축제의 시기와 목적\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>11월 초에 축제를 여는 구체적인 이유가 죽은 자들을 \u003cb class=\"key\">맞이하고 \u003c/b>\u003cb class=\"key\">기억하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 중요하다고 믿기 때문임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>다양한 축제 모습\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>집안의 \u003cb class=\"key\">제단(altar)\u003c/b> 설치, 묘지 파티, 해골 복장 및 \u003cb class=\"key\">퍼레이드\u003c/b> 등 축제를 즐기는 구체적인 방식들을 나열합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 축제의 의미부터 시작해서 시기, 그리고 구체적인 행사 모습까지 순서대로 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 축제의 배경이 되는 멕시코 사람들의 믿음을 소개해요. 죽은 사람들이 일 년에 한 번 가족을 만나러 온다고 믿기 때문에 이 날을 Day of the Dead라고 부른다고 설명하죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 축제의 날짜와 핵심 목적을 밝히고 있어요. 십일월 일일과 이일에 축제를 여는 이유는 죽은 사람들을 기억하는 것이 아주 중요하다고 믿기 때문입니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 축제를 어떻게 즐기는지 보여줘요. 집에 제단을 차리고 묘지에서 파티를 열거나, 해골 복장을 하고 퍼레이드를 벌이는 등 아주 활기찬 모습들이 나열되어 있네요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 중반부에서 죽은 사람들을 \u003cb class=\"key\">기억하는 \u003c/b>\u003cb class=\"key\">것(remember)\u003c/b>의 중요성을 언급하며 축제의 핵심 가치를 제시합니다. 그 뒤로 사람들이 그 가치를 실현하기 위해 행하는 다양한 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">활동\u003c/b>들을 나열하는 방식으로 전개됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>To welcome (3)\u003c/b>\u003cspan>축제의 목적을 나타내는 부사적 용법\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>믿음(원인)에 따른 행동(결과)을 연결하는 인과 접속사\u003c/span>\u003cb>In some areas (6)\u003c/b>\u003cspan>추가적인 사례를 제시하는 장소 표현\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">dead people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dead people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it(to remember dead people)\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dead people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">skeletons\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 네 번째 문장에서 죽은 사람들을 기억하는 것이 중요하다는 주제를 던지는 중괄식 구조를 취하고 있어요. 그 주제를 뒷받침하기 위해 앞부분에서는 믿음을, 뒷부분에서는 구체적인 예시들을 배치했죠. 전반적으로 멕시코 사람들이 축제를 즐기는 다양한 방식을 예시로 들어 설명하는 전개 방식입니다.","hl":"ty"},{"n":8,"text":"문장 사이의 연결을 보면 아주 재미있어요. 세 번째 문장의 To welcome은 축제의 목적을 나타내고, 다섯 번째 문장의 So는 믿음이라는 원인 때문에 제단을 차린다는 결과로 이어지는 신호어입니다. 마지막 문장의 In some areas는 축제의 또 다른 풍경을 추가로 보여주는 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>once a year\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일 년에 한 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>dead\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>죽은\u003c/span>\u003c/div>\u003cdiv>\u003cb>come back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Day of the Dead\u003c/b>\u003cem>명사\u003c/em>\u003cspan>죽은 자들의 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맞이하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다, 개최하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>festival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>November\u003c/b>\u003cem>명사\u003c/em>\u003cspan>11월\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>차리다, 설치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>altar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제단\u003c/span>\u003c/div>\u003cdiv>\u003cb>cemetery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>묘지\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>dress up like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 복장을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skeleton\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해골\u003c/span>\u003c/div>\u003cdiv>\u003cb>parade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼레이드\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 핵심 단어는 believe와 remember입니다. 멕시코 사람들의 믿음이 행동으로 이어진다는 점을 기억하세요. 또한 altar나 cemetery, skeleton 같은 단어들은 축제 분위기를 생생하게 전달해 주는 핵심 명사들입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dead\u003c/b>\u003cspan class=\"m\">죽은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deceased\u003c/span>\u003cspan class=\"s\">lifeless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alive\u003c/span>\u003cspan class=\"a\">living\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hold\u003c/b>\u003cspan class=\"m\">열다, 개최하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">host\u003c/span>\u003cspan class=\"s\">organize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 더 깊이 볼까요? remember는 단순히 떠올리는 것을 넘어 기념하다라는 뜻의 commemorate와 바꿔 쓸 수 있어요. 반대로 잊어버리다는 forget이죠. 또한 dead는 죽은 이라는 뜻인데, 더 정중한 표현으로는 deceased라는 단어가 있다는 것도 알아두면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코의 Day of the Dead 축제\u003c/span>\u003cspan class=\"en\">Day of the Dead Festival in Mexico\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 멕시코 사람들은 믿는다\u003c/span>\u003cspan class=\"en\">Many Mexicans believe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 년에 한 번이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> once a year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽은 사람들이 집으로 돌아온다고\u003c/span>\u003cspan class=\"en\">dead people come back home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만나기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가족과 친구들을\u003c/span>\u003cspan class=\"en\">their family and friends.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">멕시코의 Day of the Dead 축제 많은 멕시코 사람들은 일 년에 한 번, 죽은 사람들이 가족과 친구들을 만나기 위해 집으로 돌아온다고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 멕시코의 독특한 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">배경\u003c/b>과 죽은 이들이 돌아온다는 사람들의 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">세계관\u003c/b>을 소개하는 도입부 문장입니다. 축제가 단순히 즐기는 것이 아니라 \u003cb class=\"key\">가족과의 \u003c/b>\u003cb class=\"key\">재회\u003c/b>라는 의미가 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believe [타동사] + that [접속사] + 주어 + 동사 : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : come back [동사] + to meet [to부정사구] : \"만나기 위해\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Day of the Dead Festival in Mexico, 멕시코의 Day of the Dead 축제. Many Mexicans believe, 많은 멕시코 사람들은 믿는다. that once a year, 일 년에 한 번이라는 것을. dead people come back home, 죽은 사람들이 집으로 돌아온다고. to meet, 만나기 위해. their family and friends, 그들의 가족과 친구들을. 이 문장 전체를 해석하면, 멕시코의 Day of the Dead 축제 많은 멕시코 사람들은 일 년에 한 번, 죽은 사람들이 가족과 친구들을 만나기 위해 집으로 돌아온다고 믿는다.","hl":"m"},{"n":12,"text":"이 문장은 멕시코 사람들이 가진 특별한 믿음에 대해 설명하고 있어요. 죽은 사람들이 일 년에 한 번 가족을 보러 돌아온다는 따뜻한 정서가 담긴 축제 배경을 소개하죠.","hl":"mn"},{"n":13,"text":"첫 번째로 체크할 어법은 believe 뒤에 나오는 접속사 that입니다. 이 친구는 명사절 접속사라고 불리며 믿는 내용 전체를 하나의 덩어리로 묶어주는 역할을 해요. 두 번째로 to meet은 돌아오는 이유, 즉 목적을 나타내는 to부정사의 부사적 용법이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 부른다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이날을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Day of the Dead라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Day \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Dead\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 이날을 Day of the Dead라고 부른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 핵심 소재인 \u003cb class=\"key\">축제의 \u003c/b>\u003cb class=\"key\">명칭\u003c/b>을 정확히 명시하는 역할을 합니다. 앞 문장에서 설명한 믿음이 담긴 \u003cb class=\"key\">공식 \u003c/b>\u003cb class=\"key\">이름\u003c/b>을 정의합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형 (call A B)\u003c/span> : call [동사] + this day [목적어] + the Day of the Dead [목적격 보어] : \"이날을 Day of the Dead라고 부르다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"They call, 그들은 부른다. this day, 이날을. the Day of the Dead, Day of the Dead라고. 이 문장 전체를 해석하면, 그들은 이날을 Day of the Dead라고 부른다.","hl":"m"},{"n":15,"text":"앞서 설명한 믿음이 있는 그 날을 멕시코 사람들이 무엇이라고 부르는지 그 명칭을 알려주고 있습니다.","hl":"mn"},{"n":16,"text":"이 문장은 5형식 문장으로 아주 중요해요. call A B 구조는 A를 B라고 부른다는 뜻인데요. 여기서 this day가 목적어, 뒤에 나오는 축제 이름이 목적격 보어가 되어 둘이 서로 같은 대상을 가리키게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽은 자들을 맞이하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">welcome\u003c/span> dead people,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코 사람들은 축제를 연다\u003c/span>\u003cspan class=\"en\">Mexicans hold a festival\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">11월 1일과 2일에\u003c/span>\u003cspan class=\"en\">on November 1 and 2.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">죽은 자들을 맞이하기 위해, 멕시코 사람들은 11월 1일과 2일에 축제를 연다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제의 구체적인 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">목적\u003c/b>과 \u003cb class=\"key\">개최 \u003c/b>\u003cb class=\"key\">시기\u003c/b>를 구체적으로 전달합니다. 사람들의 믿음이 \u003cb class=\"key\">축제\u003c/b>라는 실제 행동으로 이어짐을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + 동사원형 (welcome) : \"맞이하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"To welcome dead people, 죽은 자들을 맞이하기 위해. Mexicans hold a festival, 멕시코 사람들은 축제를 연다. on November 1 and 2, 11월 1일과 2일에. 이 문장 전체를 해석하면, 죽은 자들을 맞이하기 위해, 멕시코 사람들은 11월 1일과 2일에 축제를 연다.","hl":"m"},{"n":18,"text":"멕시코 사람들이 왜 11월 초에 축제를 여는지 그 이유를 설명하고 있어요. 죽은 사람들을 따뜻하게 맞이하려는 마음이 담겨 있죠.","hl":"mn"},{"n":19,"text":"문장 제일 처음에 나온 To welcome을 주목해 보세요. 축제를 여는 목적을 나타내는 to부정사의 부사적 용법입니다. 문장 앞에 나와서 내용을 강조해주고 있어요. 그리고 축제를 열다라는 뜻의 동사 hold도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 믿는다\u003c/span>\u003cspan class=\"en\">They believe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 중요하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽은 사람들을 기억하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remember\u003c/span> dead people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 죽은 사람들을 기억하는 것이 중요하다고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 멕시코 사람들이 죽은 이들을 기리는 마음가짐을 설명하며, 이 축제의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 무엇인지 보여줍니다. 축제의 목적이 단순히 즐기는 것만이 아니라 고인을 \u003cb class=\"key\">추모\u003c/b>하는 데 있음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 진주어 to부정사\u003c/span> : it (가주어) + is [동사] + important [형용사] + to remember (진주어) : \"기억하는 것이 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"They believe, 그들은 믿는다. it is important, 그것이 중요하다고. to remember dead people, 죽은 사람들을 기억하는 것이. 이 문장 전체를 해석하면, 그들은 죽은 사람들을 기억하는 것이 중요하다고 믿는다.","hl":"m"},{"n":21,"text":"멕시코 사람들이 왜 이런 축제를 여는지 그 근본적인 이유가 담겨 있어요. 죽은 사람들을 단순히 슬퍼하는 게 아니라 잊지 않고 기억하는 게 가장 중요한 가치라는 뜻이죠.","hl":"mn"},{"n":22,"text":"여기서 가장 중요한 포인트는 가주어 it과 진주어 to remember예요. 문장의 진짜 주어인 to remember dead people 부분이 너무 길어서 가짜 주어 it을 그 자리에 대신 세워두고 진짜 주어는 뒤로 보낸 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 사람들은 제단을 차린다\u003c/span>\u003cspan class=\"en\">So, people set up altars\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 집에\u003c/span>\u003cspan class=\"en\">in their homes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 큰 파티를 연다\u003c/span>\u003cspan class=\"en\">and have big parties\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">묘지에서\u003c/span>\u003cspan class=\"en\">in cemeteries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 사람들은 집에 제단을 차리고, 묘지에서 큰 파티를 연다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 죽은 이들을 기억해야 한다는 믿음이 실제 \u003cb class=\"key\">제단\u003c/b> 설치와 \u003cb class=\"key\">묘지 \u003c/b>\u003cb class=\"key\">파티\u003c/b>라는 구체적인 행동으로 이어집니다. 고인을 슬프게만 대하는 것이 아니라 즐겁게 환영하는 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어 + 동사1 (set up) + ... + and + 동사2 (have) : \"차리고 ... 연다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"So, people set up altars, 그래서 사람들은 제단을 차린다. in their homes, 그들의 집에. and have big parties, 그리고 큰 파티를 연다. in cemeteries, 묘지에서. 이 문장 전체를 해석하면, 그래서 사람들은 집에 제단을 차리고, 묘지에서 큰 파티를 연다.","hl":"m"},{"n":24,"text":"죽은 분들을 기억하기 위해 구체적으로 무엇을 하는지 설명하고 있어요. 집에는 정성껏 제단을 만들고, 심지어 묘지에서도 다 같이 모여 파티를 열며 고인을 맞이한답니다.","hl":"mn"},{"n":25,"text":"이 문장에서는 and를 중심으로 한 병렬 구조를 확인해야 해요. 첫 번째 동사 set up과 두 번째 동사 have가 나란히 연결되어 있어서, 사람들이 제단을 차리고 그리고 파티를 연다는 두 가지 동작을 차례대로 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 지역에서는\u003c/span>\u003cspan class=\"en\">In some areas,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 해골 복장을 하고\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dress \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">skeletons\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 퍼레이드를 벌인다\u003c/span>\u003cspan class=\"en\">and hold big parades.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일부 지역에서는 사람들이 해골 복장을 하고 큰 퍼레이드를 벌인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지역별로 축제를 즐기는 다양한 방식을 소개하며, 특히 \u003cb class=\"key\">해골\u003c/b> 분장과 \u003cb class=\"key\">퍼레이드\u003c/b>라는 시각적인 요소를 강조합니다. 죽음을 두려워하기보다 \u003cb class=\"key\">축제의 \u003c/b>\u003cb class=\"key\">일부\u003c/b>로 즐기는 멕시코의 독특한 정서를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : dress up (동사구) + like (~처럼) + skeletons (명사) : \"해골처럼 복장을 하다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"In some areas, 일부 지역에서는. people dress up like skeletons, 사람들이 해골 복장을 하고. and hold big parades, 큰 퍼레이드를 벌인다. 이 문장 전체를 해석하면, 일부 지역에서는 사람들이 해골 복장을 하고 큰 퍼레이드를 벌인다.","hl":"m"},{"n":27,"text":"이 축제의 아주 상징적인 장면을 묘사하고 있어요. 무서운 죽음의 상징인 해골로 분장하고 거리로 나와 다 함께 행진하며 축제 분위기를 한껏 띄우는 모습입니다.","hl":"mn"},{"n":28,"text":"여기서 like는 좋아하다라는 동사가 아니라 전치사로 쓰였어요. 그래서 해골처럼이라는 뜻으로 뒤에 오는 skeletons를 연결해 주죠. 또한 dress up과 hold라는 두 동사가 and로 연결된 병렬 구조라는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>멕시코 사람들은 일 년에 한 번 \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">이들이 \u003c/b>\u003cb class=\"key\">귀가한다\u003c/b>고 믿어 축제를 개최합니다.\u003c/li>\u003cli>\u003cb class=\"key\">Day \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">Dead\u003c/b> 축제는 매년 11월 1일과 2일에 열립니다.\u003c/li>\u003cli>죽은 이들을 \u003cb class=\"key\">기억하는 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 중요하게 여기며 집안에 제단을 차립니다.\u003c/li>\u003cli>묘지에서 파티를 열거나 \u003cb class=\"key\">해골 \u003c/b>\u003cb class=\"key\">복장\u003c/b>으로 퍼레이드를 하며 축제를 즐깁니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mexicans celebrate the Day of the Dead to honor and remember their deceased loved ones through festive activities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">멕시코 사람들은 죽은 이들을 기리기 위해 \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">자들의 \u003c/b>\u003cb class=\"key\">날\u003c/b> 축제를 열며, 제단을 차리거나 해골 복장을 하는 등 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">분위기\u003c/b> 속에서 고인을 기억합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"오늘은 멕시코의 Day of the Dead 축제에 대해 알아보았습니다. 죽음을 슬픔이 아닌 기억과 만남의 시간으로 바꾸는 멕시코 사람들의 마음이 잘 느껴지나요? 오늘 배운 내용 중 제단을 차리고 해골 복장을 하는 등의 구체적인 활동들을 잘 정리해 두세요. 고생 많으셨습니다!","hl":null}]}]});</script></body></html>
