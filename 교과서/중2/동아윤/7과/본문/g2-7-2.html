<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 동아(윤) 7과 본문2 — 청명학원 영어과</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"중2 동아(윤) 7과 본문2","audioDir":"g2-7-2_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Midsummer Festival: Sweden's Radiant Celebration of Summer\u003c/h1>\u003ch2>미드서머 축제: 스웨덴의 빛나는 여름 축제\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>스웨덴 사람들은 길고 어두운 겨울을 보낸 뒤, 한 해 중 낮이 가장 긴 날을 기념하는 \u003cb class=\"key\">Midsummer \u003c/b>\u003cb class=\"key\">축제\u003c/b>를 열어 전통 춤과 화려한 장식을 즐깁니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Swedish people celebrate the longest day of the year with the Midsummer festival to welcome the arrival of summer.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 북유럽의 아름다운 나라 스웨덴으로 떠나볼 거예요. 스웨덴의 독특한 기후가 만들어낸 아주 특별한 축제, Midsummer festival에 대해 알아볼 건데요. 이 글은 스웨덴 사람들이 왜 여름을 환영하는지, 그리고 그들이 가장 긴 낮을 어떻게 기념하는지를 잘 보여줍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스웨덴은 북유럽 고위도에 위치하여 겨울에는 해가 아주 짧고 어둡지만, 여름에는 해가 지지 않는 \u003cb class=\"key\">백야(Midnight \u003c/b>\u003cb class=\"key\">Sun)\u003c/b> 현상이 나타납니다. 이러한 지리적 특성 때문에 스웨덴 사람들에게 여름의 시작은 매우 특별한 의미를 가집니다. 마치 어두운 터널을 지나 환한 빛을 만나는 것처럼, 이들은 \u003cb class=\"key\">동계(Winter)\u003c/b>의 우울함을 털어내고 생명력을 축하합니다. 이 축제는 스웨덴의 가장 큰 명절 중 하나로, 자연과 인간의 조화를 상징하는 \u003cb class=\"key\">메이폴(Maypole)\u003c/b>을 세우고 축제를 즐깁니다. 일상에 비유하자면, 시험 기간의 긴 공부 끝에 찾아온 \u003cb class=\"key\">여름방학\u003c/b> 첫날을 온 동네 사람들과 함께 파티를 여는 것과 비슷합니다. 스웨덴 사람들에게 미드서머는 단순한 휴일 이상의 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">상징\u003c/b>입니다.\u003c/div>","segs":[{"n":2,"text":"스웨덴은 지리적 위치 때문에 겨울이 굉장히 길고 어두워요. 반면에 여름에는 해가 지지 않는 백야 현상이 나타나기도 하죠. 이렇게 극단적인 기후를 가진 곳이라 사람들에게 여름은 단순한 계절 이상의 큰 의미가 있습니다. 마치 긴 어둠을 뚫고 나온 생명의 빛과 같아서, 온 마을 사람들이 모여 축제를 여는 것이죠. 마치 우리 학생들이 긴 시험 기간을 끝내고 맞이하는 여름방학 첫날의 설렘과 비슷하다고 생각하면 이해가 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>배경 설명\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>스웨덴의 \u003cb class=\"key\">지리적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>인 길고 어두운 겨울을 언급하며, 왜 사람들이 여름을 그토록 \u003cb class=\"key\">환영\u003c/b>하는지 그 이유를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>축제 소개\u003csmall>주제 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>한 해 중 낮이 가장 긴 날을 기념하는 \u003cb class=\"key\">Midsummer \u003c/b>\u003cb class=\"key\">축제\u003c/b>의 명칭과 개최 목적을 명확히 소개하는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>축제 내용\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>축제가 열리는 구체적인 \u003cb class=\"key\">날짜 \u003c/b>\u003cb class=\"key\">범위\u003c/b>와 꽃을 활용한 \u003cb class=\"key\">장식 \u003c/b>\u003cb class=\"key\">풍습\u003c/b> 및 전통 춤을 즐기는 모습을 상세히 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>축제 특징\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>해가 지지 않는 \u003cb class=\"key\">백야 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 인해 축제가 밤새도록 이어지는 스웨덴만의 독특한 \u003cb class=\"key\">특징\u003c/b>을 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 배경 설명부터 축제의 구체적인 모습과 독특한 특징까지 자연스러운 흐름으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 스웨덴의 겨울이 길고 어두워서 사람들이 여름을 특히 환영한다는 배경을 먼저 설명해 줍니다. 지리적 조건이 축제가 만들어진 근본적인 이유라는 것을 알 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장에서는 일 년 중 가장 낮이 긴 날을 축하하기 위해 열리는 특별한 축제의 이름인 Midsummer festival을 공식적으로 소개하고 있습니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장에서는 축제가 열리는 정확한 시기와 함께, 긴 기둥을 꽃과 잎사귀로 장식하고 전통 춤을 추는 구체적인 축제 활동들을 자세하게 묘사해 줍니다.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장에서는 스웨덴의 여름에 나타나는 특별한 현상인 백야를 언급하며, 해가 거의 지지 않기 때문에 밤새도록 축제를 즐길 수 있다는 점을 강조하며 글을 마칩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 스웨덴의 지리적 배경에서 시작하여 \u003cb class=\"key\">축제\u003c/b>의 절차와 특징으로 이어지는 전형적인 설명문의 형태를 띱니다. 축제의 이유와 \u003cb class=\"key\">시기\u003c/b>, 그리고 구체적인 \u003cb class=\"key\">풍습\u003c/b>을 차례대로 언급하여 독자가 정보를 쉽게 파악할 수 있도록 구성되었습니다. 특히 마지막 문장에서 \u003cb class=\"key\">인과관계\u003c/b>를 나타내는 접속사 Because를 사용하여 축제의 이색적인 분위기를 자연스럽게 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>so (1)\u003c/b>\u003cspan>결과 유도\u003c/span>\u003cb>To celebrate (2)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>During (5)\u003c/b>\u003cspan>시간적 배경\u003c/span>\u003cb>Because (6)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Midsummer Festival in Sweden\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">summer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the longest day of the year\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">special festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this time of year\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Winter in Sweden\u003c/th>\u003cth>Midsummer (Summer)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Long and dark\u003c/td>\u003ctd>Longest day, sun hardly sets\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 설명문의 구조를 가지고 있어요. 처음에 배경을 깔고 주제인 축제를 소개한 뒤에 구체적인 내용을 덧붙이는 두괄식 구성을 취하고 있죠. 독자가 스웨덴의 문화를 순차적으로 이해할 수 있게 도와주는 아주 친절한 글입니다.","hl":"ty"},{"n":9,"text":"문장 사이사이에 인과관계를 나타내는 so나 Because 같은 접속사들이 있어서 글의 논리가 아주 명확해요. 또한 the longest day of the year와 같은 표현들이 축제의 시기와 의미를 반복해서 강조해 주는 역할을 하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Midsummer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한여름, 하지(夏至)\u003c/span>\u003c/div>\u003cdiv>\u003cb>festival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>Sweden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스웨덴\u003c/span>\u003c/div>\u003cdiv>\u003cb>winter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겨울\u003c/span>\u003c/div>\u003cdiv>\u003cb>long\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>dark\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어두운\u003c/span>\u003c/div>\u003cdiv>\u003cb>especially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>환영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>summer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여름\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축하하다, 기념하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>longest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>end\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끝나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>decorate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tall\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>높은, 긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>pole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기둥\u003c/span>\u003c/div>\u003cdiv>\u003cb>flower\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꽃\u003c/span>\u003c/div>\u003cdiv>\u003cb>green\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>초록색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎 (복수형 leaves)\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>traditional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전통적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 주위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>hardly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 ~않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(해 등이) 지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at this time of year\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일 년 중 이 시기에\u003c/span>\u003c/div>\u003cdiv>\u003cb>all night long\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밤새도록\u003c/span>\u003c/div>\u003cdiv>\u003cb>so\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그래서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 살펴볼까요. 장식하다라는 뜻의 decorate 그리고 거의 무엇무엇 하지 않다라는 뜻의 부정 부사 hardly는 꼭 기억해야 합니다. 특히 hardly sets는 해가 거의 지지 않는다는 백야 현상을 설명하는 핵심 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">especially\u003c/b>\u003cspan class=\"m\">특히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particularly\u003c/span>\u003cspan class=\"s\">unusually\u003c/span>\u003cspan class=\"s\">notably\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">commonly\u003c/span>\u003cspan class=\"a\">normally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">celebrate\u003c/b>\u003cspan class=\"m\">기념하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hardly\u003c/b>\u003cspan class=\"m\">거의 ~않다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rarely\u003c/span>\u003cspan class=\"s\">seldom\u003c/span>\u003cspan class=\"s\">scarcely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">often\u003c/span>\u003cspan class=\"a\">frequently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">traditional\u003c/b>\u003cspan class=\"m\">전통적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conventional\u003c/span>\u003cspan class=\"s\">customary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">innovative\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">welcome\u003c/b>\u003cspan class=\"m\">환영하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">greet\u003c/span>\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. 특히를 의미하는 especially는 particularly와 바꿔 쓸 수 있고, 기념하다라는 celebrate는 commemorate라는 단어로도 표현할 수 있습니다. 거의 않다라는 hardly는 rarely나 seldom과 친구라는 점도 잊지 마세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴의 Midsummer 축제\u003c/span>\u003cspan class=\"en\">Midsummer Festival in Sweden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴의 겨울은\u003c/span>\u003cspan class=\"en\">Winter in Sweden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길고 어두워서,\u003c/span>\u003cspan class=\"en\">is long and dark,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> the people there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름을 특히 환영한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">especially\u003c/span> welcome summer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스웨덴의 Midsummer 축제 스웨덴의 겨울은 길고 어두워서, 그곳 사람들은 여름을 특히 환영한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스웨덴 사람들이 여름 축제를 소중히 여기는 \u003cb class=\"key\">배경\u003c/b>을 설명하는 도입부입니다. 겨울이 길고 어둡다는 환경적 요인 때문에 여름을 \u003cb class=\"key\">환영하는\u003c/b> 정서가 생겼음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 (인과관계)\u003c/span> : 원인 (Winter is long and dark) + so [접속사] + 결과 (people welcome summer) : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : especially [부사] + welcome [동사] : \"특히\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Midsummer Festival in Sweden, 스웨덴의 Midsummer 축제. Winter in Sweden, 스웨덴의 겨울은. is long and dark, 길고 어두워서. so the people there, 그곳 사람들은. especially welcome summer, 여름을 특히 환영한다.. 이 문장 전체를 해석하면, 스웨덴의 Midsummer 축제 스웨덴의 겨울은 길고 어두워서, 그곳 사람들은 여름을 특히 환영한다.","hl":"m"},{"n":13,"text":"이 문장은 스웨덴 사람들이 왜 그렇게 여름 축제에 열광하는지 그 이유를 설명하고 있어요. 북유럽 특유의 길고 어두운 겨울이 원인이 되어 여름을 아주 특별하게 환영하는 문화가 생긴 것이죠.","hl":"mn"},{"n":14,"text":"첫 번째로 so는 원인과 결과를 이어주는 접속사예요. 겨울이 어두운 것이 원인이고, 그래서 여름을 환영한다는 결과로 이어지죠. 두 번째로 especially는 부사로서 뒤에 오는 동사인 welcome을 강조하며 특히 더 환영한다는 느낌을 살려줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기념하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">celebrate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 긴 낮을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">longest\u003c/span> day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 해 중\u003c/span>\u003cspan class=\"en\">of the year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 연다\u003c/span>\u003cspan class=\"en\">they have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 축제를.\u003c/span>\u003cspan class=\"en\">a special festival.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 해 중 가장 긴 낮을 기념하기 위해 그들은 특별한 축제를 연다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제가 열리는 \u003cb class=\"key\">목적\u003c/b>과 시기를 설명하고 있습니다. 일 년 중 낮이 가장 긴 날인 \u003cb class=\"key\">하지\u003c/b>를 기념하기 위한 행사임을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : To [to부정사] + celebrate [동사원형] : \"기념하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 최상급\u003c/span> : the + long [원급] + -est : \"가장 긴\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"To celebrate, 기념하기 위해. the longest day, 가장 긴 낮을. of the year, 한 해 중. they have, 그들은 연다. a special festival, 특별한 축제를.. 이 문장 전체를 해석하면, 한 해 중 가장 긴 낮을 기념하기 위해 그들은 특별한 축제를 연다.","hl":"m"},{"n":16,"text":"축제를 왜 여는지 그 목적을 말해주고 있네요. 바로 1년 중에서 해가 떠 있는 시간이 가장 긴 날을 축하하기 위해서 특별한 축제를 연다는 내용입니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트인 To celebrate는 to부정사가 문장 앞에서 목적으로 쓰여서 기념하기 위해라고 해석합니다. 두 번째로 the longest는 long의 최상급 표현으로 뒤에 est를 붙여서 가장 길다는 의미를 만들었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 부른다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 축제를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Midsummer 축제라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Midsummer \u003c/span>\u003cspan class=\"tgt\">festival\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 이 축제를 Midsummer 축제라고 부른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 특별한 축제의 \u003cb class=\"key\">공식 \u003c/b>\u003cb class=\"key\">명칭\u003c/b>을 소개합니다. 여기서 it은 앞 문장의 a special festival을 가리키는 \u003cb class=\"key\">대명사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (call A B)\u003c/span> : call [동사] + it [목적어] + the Midsummer festival [목적격 보어] : \"그것을 Midsummer 축제라고 부르다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They call, 그들은 부른다. it, 이 축제를. the Midsummer festival, Midsummer 축제라고.. 이 문장 전체를 해석하면, 그들은 이 축제를 Midsummer 축제라고 부른다.","hl":"m"},{"n":19,"text":"앞 문장에서 말한 그 특별한 축제에 이름을 붙여주는 문장이에요. 이제부터 이 축제의 이름은 Midsummer 축제라고 기억하면 됩니다.","hl":"mn"},{"n":20,"text":"이 문장은 5형식 구조인데요. call 뒤에 목적어 it이 오고 그 뒤에 목적어의 이름인 the Midsummer festival이 보어로 왔어요. it을 Midsummer 축제라고 부른다는 구조를 잘 봐두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축제는 시작합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">festival \u003c/span>\u003cspan class=\"tgt\">starts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금요일 저녁에\u003c/span>\u003cspan class=\"en\">on the Friday evening\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">6월 19일과 25일 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">June \u003c/span>\u003cspan class=\"tgt\">19 \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">25\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 일요일에 끝난다.\u003c/span>\u003cspan class=\"en\">and ends on the Sunday.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">축제는 6월 19일과 25일 사이의 금요일 저녁에 시작해서 일요일에 끝난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스웨덴 하지 축제가 열리는 정확한 \u003cb class=\"key\">기간\u003c/b>과 요일을 명시하고 있습니다. 축제의 \u003cb class=\"key\">시작과 \u003c/b>\u003cb class=\"key\">끝\u003c/b>을 구체적인 날짜 범위를 통해 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : The festival [단수 주어] + starts [단수 동사] : \"축제는 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 between A and B\u003c/span> : between [A] and [B] : \"6월 19일과 25일 사이에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The festival starts, 축제는 시작합니다. on the Friday evening, 금요일 저녁에. between June 19 and 25, 6월 19일과 25일 사이의. and ends on the Sunday, 그리고 일요일에 끝난다.. 이 문장 전체를 해석하면, 축제는 6월 19일과 25일 사이의 금요일 저녁에 시작해서 일요일에 끝난다.","hl":"m"},{"n":22,"text":"이 문장은 스웨덴 하지 축제가 구체적으로 언제 열리는지 알려주는 문장이에요. 축제가 열리는 정확한 기간과 요일을 설명하며 글의 내용을 더 구체적으로 만들어주고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 주어인 The festival에 맞춰서 동사 starts와 ends의 형태를 주의 깊게 봐야 해요. 주어가 3인칭 단수라서 동사 뒤에 모두 s를 붙여서 수 일치를 시켜주었죠. 두 번째로 between A and B 표현은 6월 19일과 25일 사이라는 범위를 나타내는 전치사구로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축제 기간 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During\u003c/span> the festival,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 긴 기둥을 장식한다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decorate \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tall \u003c/span>\u003cspan class=\"tgt\">pole \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃과 녹색 잎사귀로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> flowers and green leaves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 전통 춤을 즐긴다\u003c/span>\u003cspan class=\"en\">and enjoy traditional dances\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 기둥 주위에서.\u003c/span>\u003cspan class=\"en\">around it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">축제 기간 동안 사람들은 꽃과 녹색 잎사귀로 긴 기둥을 장식하고, 그 기둥 주위에서 전통 춤을 즐긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제에서 행해지는 주요 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">활동\u003c/b> 두 가지를 묘사합니다. 기둥을 장식하는 \u003cb class=\"key\">도구\u003c/b>와 춤을 추는 \u003cb class=\"key\">장소\u003c/b>를 상세히 알려줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 During\u003c/span> : During + [특정 기간 명사] : \"동안에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">decorate A with B\u003c/span> : decorate [대상] + with [재료] : \"긴 기둥을 ~로 장식하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"During the festival, 축제 기간 동안. people decorate a tall pole, 사람들은 긴 기둥을 장식한다. with flowers and green leaves, 꽃과 녹색 잎사귀로. and enjoy traditional dances, 그리고 전통 춤을 즐긴다. around it, 그 기둥 주위에서.. 이 문장 전체를 해석하면, 축제 기간 동안 사람들은 꽃과 녹색 잎사귀로 긴 기둥을 장식하고, 그 기둥 주위에서 전통 춤을 즐긴다.","hl":"m"},{"n":25,"text":"축제 기간에 사람들이 무엇을 하며 시간을 보내는지 보여주는 문장이에요. 예쁜 꽃과 잎사귀로 기둥을 꾸미고 춤을 추는 전통 활동을 묘사해서 축제의 분위기를 생생하게 전달하고 있죠.","hl":"mn"},{"n":26,"text":"첫 번째로 전치사 During은 축제 기간이라는 이름이 있는 특정 기간 명사와 함께 쓰였어요. 두 번째로 decorate A with B 구문은 A를 B로 장식하다라는 뜻인데 여기서 전치사 with는 수단이나 재료를 나타내죠. 세 번째로 decorate와 enjoy는 주어 people에 연결되어 나란히 이어지는 동사들의 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해가 거의 지지 않기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because\u003c/span> the sun \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hardly \u003c/span>\u003cspan class=\"tgt\">sets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 시기에는\u003c/span>\u003cspan class=\"en\">at this time of year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴에서,\u003c/span>\u003cspan class=\"en\">in Sweden,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 축제를 즐길 수 있다\u003c/span>\u003cspan class=\"en\">people can enjoy the festival\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤새 축제를.\u003c/span>\u003cspan class=\"en\">all night long.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 시기에는 스웨덴에서 해가 거의 지지 않기 때문에, 사람들은 밤새 축제를 즐길 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스웨덴의 지리적 특성인 \u003cb class=\"key\">백야 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 축제 방식에 끼친 영향을 설명합니다. 해가 지지 않는 \u003cb class=\"key\">원인\u003c/b>과 밤새 축제를 즐기는 \u003cb class=\"key\">결과\u003c/b>가 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 Because\u003c/span> : Because + [주어 + 동사] : \"때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정의 의미를 가진 빈도부사\u003c/span> : hardly [부사] + sets [동사] : \"거의 지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Because the sun hardly sets, 해가 거의 지지 않기 때문에. at this time of year, 이 시기에는. in Sweden, 스웨덴에서. people can enjoy the festival, 사람들은 축제를 즐길 수 있다. all night long, 밤새 축제를.. 이 문장 전체를 해석하면, 이 시기에는 스웨덴에서 해가 거의 지지 않기 때문에, 사람들은 밤새 축제를 즐길 수 있다.","hl":"m"},{"n":28,"text":"스웨덴의 여름에 나타나는 백야 현상 때문에 밤늦게까지 축제가 이어지는 이유를 설명하고 있어요. 자연 현상이 축제 문화에 어떤 영향을 주는지 인과 관계를 명확히 보여주는 문장입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 접속사 Because 뒤에는 주어와 동사가 있는 완벽한 문장이 와서 이유를 나타내요. 두 번째로 아주 중요한 단어인 hardly는 거의 하지 않는다는 부정의 뜻을 가진 부사라서 문장을 부정문으로 해석해야 해요. 마지막으로 all night long은 밤새도록이라는 뜻으로 축제를 즐기는 시간이 매우 길다는 점을 강조하는 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>스웨덴의 겨울은 길고 어두워서 사람들은 \u003cb class=\"key\">여름\u003c/b>의 도래를 간절히 기다리며 환영합니다.\u003c/li>\u003cli>한 해 중 낮이 가장 긴 날을 기념하기 위해 \u003cb class=\"key\">Midsummer \u003c/b>\u003cb class=\"key\">축제\u003c/b>라는 특별한 행사를 엽니다.\u003c/li>\u003cli>축제 기간에는 기둥을 꽃과 잎으로 \u003cb class=\"key\">장식\u003c/b>하고 그 주위에서 전통 춤을 추며 즐거운 시간을 보냅니다.\u003c/li>\u003cli>해가 지지 않는 \u003cb class=\"key\">백야\u003c/b> 현상 덕분에 사람들은 밤새도록 축제 분위기를 만끽할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Swedish people celebrate the longest day of the year with the Midsummer festival to welcome the arrival of summer.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">스웨덴 사람들은 길고 어두운 겨울을 보낸 뒤, 한 해 중 낮이 가장 긴 날을 기념하는 \u003cb class=\"key\">Midsummer \u003c/b>\u003cb class=\"key\">축제\u003c/b>를 열어 전통 춤과 화려한 장식을 즐깁니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘은 스웨덴의 미드서머 축제에 대해 공부했습니다. 축제의 배경부터 특징까지 잘 이해가 되었나요? 문법적으로는 decorate A with B 표현과 부정 부사 hardly의 위치를 다시 한번 복습해 보시길 바랍니다. 그럼 다음 시간에 더 흥미로운 지문으로 만나요. 수고하셨습니다.","hl":null}]}]});</script></body></html>
