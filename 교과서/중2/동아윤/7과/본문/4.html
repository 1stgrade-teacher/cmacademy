</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"중2 동아(윤) 7과 본문4","audioDir":"g2-7-4_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Fur Rondy Festival: Alaska’s Winter Joy\u003c/h1>\u003ch2>Fur Rondy 축제: 알래스카의 겨울 즐거움\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">알래스카\u003c/b>에서 열리는 세계 최대 규모의 겨울 축제인 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b>와 그곳에서 즐기는 독특한 \u003cb class=\"key\">순록 \u003c/b>\u003cb class=\"key\">경주\u003c/b>에 대해 소개하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Fur Rondy festival in Alaska offers various winter sports and a unique, fun reindeer race regardless of the outcome.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"자 이제 7과의 마지막 4번째 본문입니다. 조금 더 집중해서 들어주세요! 네번째 본문에서 우리는 알래스카로 떠나 세계에서 가장 큰 겨울 축제 중 하나를 만나볼 거예요. 바로 Fur Rondy 축제에 대한 지문인데요. 이 글은 축제의 다양한 즐길 거리와 특히 순록 경주라는 아주 흥미로운 이벤트를 소개하며, 축제의 진정한 의미가 무엇인지 우리에게 알려줍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">알래스카의 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b> 축제는 1935년에 시작된 유서 깊은 행사로, 공식 명칭은 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rendezvous\u003c/b>입니다. 과거 사냥꾼과 모피 상인들이 모여 거래하던 만남의 장에서 유래하여, 지금은 세계적인 겨울 축제(Winter Festival)로 자리 잡았습니다. 이 축제의 백미인 순록 경주(Running of the Reindeer)는 스페인의 \u003cb class=\"key\">황소 \u003c/b>\u003cb class=\"key\">달리기\u003c/b>에서 영감을 얻은 것으로, 실제 순록과 함께 거리를 달리는 진귀한 경험을 제공합니다. 마치 학교 운동회에서 승패보다 친구들과의 \u003cb class=\"key\">코스튬\u003c/b> 분장에 더 열광하는 것처럼, 이 축제도 기록보다는 모두가 함께 웃고 즐기는 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">정신\u003c/b>을 강조합니다.\u003c/div>","segs":[{"n":2,"text":"알래스카의 Fur Rondy 축제는 원래 모피 사냥꾼들이 모여 물건을 주고받던 모피 시장에서 시작되었어요. 영어로는 Fur Rendezvous라고 하는데, 여기서 Rendezvous는 만남이라는 뜻이죠. 마치 우리가 추운 겨울에 따뜻한 붕어빵 가게 앞에 모여서 수다를 떨며 즐거워하는 것처럼, 이 축제도 알래스카의 추위를 즐거움으로 승화시킨 행사예요. 특히 오늘 지문에 나오는 순록 경주, Running of the Reindeer는 정말 인기가 많답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>축제 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>알래스카에서 열리는 세계 최대 규모의 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b> 축제에 대해 언급하며, 방문객들이 즐길 수 있는 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">게임\u003c/b>과 스포츠를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>순록 경주\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>축제의 특별한 이벤트인 \u003cb class=\"key\">순록 \u003c/b>\u003cb class=\"key\">경주\u003c/b>를 상세히 설명하며, 참가자들이 재미있는 \u003cb class=\"key\">의상\u003c/b>을 입고 순록과 달리는 모습을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>축제의 본질\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>순록보다 빨리 달리는 것은 어렵지만, 중요한 것은 결과가 아니라 모두가 함께 \u003cb class=\"key\">즐거움\u003c/b>을 느끼는 것이라는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 전달합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 축제의 전반적인 소개에서 시작해서 특별한 이벤트의 상세 묘사, 그리고 축제의 교훈으로 마무리되는 구조를 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 축제의 시기와 규모를 설명합니다. 2월 말 알래스카에서 열리는 이 축제는 세계 최대 규모이며, 방문객들이 다양한 스포츠와 전통 게임을 즐길 수 있다는 점을 강조하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 이 축제의 꽃인 순록 경주를 소개해요. 참가자들이 단순하게 달리는 것이 아니라, 재미있는 의상인 costume을 입고 순록보다 빨리 달리려고 노력하는 생생한 장면을 묘사하고 있습니다.","hl":"f1"},{"n":6,"text":"마지막 다섯 번째부터 일곱 번째 문장에서는 질문과 답변을 통해 주제를 전달합니다. 순록보다 빨리 달리는 것이 가능한지 묻고, 사실 그렇지 않지만 모두가 즐거워하고 있다는 점을 통해 즐거움이라는 가치를 결론으로 제시합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b> 축제라는 중심 소재를 제시하고, 이후 구체적인 \u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">내용\u003c/b>과 이벤트 예시를 나열하는 구조입니다. 특히 \u003cb class=\"key\">순록 \u003c/b>\u003cb class=\"key\">경주\u003c/b>라는 구체적인 사례를 통해 축제의 활기찬 분위기를 뒷받침하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>one of the biggest winter festivals (1)\u003c/b>\u003cspan>소재의 중요성 강조\u003c/span>\u003cb>such as (3)\u003c/b>\u003cspan>구체적인 예시 도입\u003c/span>\u003cb>Not really (6)\u003c/b>\u003cspan>질문에 대한 답변 및 반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the Fur Rondy festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one of the biggest winter festivals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this festival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">many special events\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Running of the Reindeer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this race\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 첫 문장에서 핵심 소재인 축제를 먼저 제시하는 두괄식 구조를 취하고 있어요. 또한, 여러 활동 중에서도 순록 경주라는 구체적인 사례를 들어 설명하는 예시 위주의 전개 방식을 보여줍니다.","hl":"ty"},{"n":8,"text":"문장 속에서 such as라는 표현을 통해 순록 경주라는 예시를 자연스럽게 끌어왔고요. 다섯 번째 문장의 질문 Is it possible to do so?와 여섯 번째 문장의 답변 Not really는 독자의 궁금증을 자아낸 뒤에 반전을 주는 아주 효과적인 장치입니다. race와 event 같은 단어들이 반복되며 글의 통일성을 유지하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>end\u003c/b>\u003cem>명사\u003c/em>\u003cspan>말, 끝\u003c/span>\u003 03c/b> 축제의 이색 행사인 '순록과 달리기' 경주의 모습을 구체적으로 묘사하고 있습니다. 단순히 뛰는 것이 아니라 \u003cb class=\"key\">의상\u003c/b>을 갖춰 입고 즐기는 \u003cb class=\"key\">축제\u003c/b>의 활기찬 분위기를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(People) + [who(관계대명사) + V(participate)] : \"이 경주에 참가하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 비교급\u003c/span> : faster(부사의 비교급) + than : \"보다 더 빨리 달리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : S(People) + V1(wear) + and + V2(try) : \"입고 ... 한다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"People who participate in this race, 이 경주에 참가하는 사람들은. wear fun costumes, 재미있는 복장을 입고. and try to run faster, 더 빨리 달리려고 한다. than reindeer, 순록보다.. 이 문장 전체를 해석하면, 이 경주에 참가하는 사람들은 재미있는 복장을 입고 순록보다 더 빨리 달리려고 한다.","hl":"m"},{"n":21,"text":"순록과 함께 달리는 이색적인 경주 장면을 설명하는 문장이에요. 사람들이 단순한 운동복이 아니라 재미있는 의상을 입고 참가한다는 점에서 축제의 즐거운 분위기를 느낄 수 있죠.","hl":"mn"},{"n":22,"text":"첫 번째로 who participate in this race 부분은 주어인 People을 꾸며주는 주격 관계대명사 절이에요. 두 번째로 wear와 try라는 두 동사가 and로 연결되어 주어에 걸리는 병렬 구조를 이루고 있습니다. 마지막으로 faster than은 순록보다 더 빨리라는 뜻의 비교급 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능할까\u003c/span>\u003cspan class=\"en\">Is it possible\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 하는 것이?\u003c/span>\u003cspan class=\"en\">to do so?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 하는 것이 가능할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 '순록보다 더 빨리 달리는 것'에 대해 의문을 던지며 \u003cb class=\"key\">독자의 \u003c/b>\u003cb class=\"key\">호기심\u003c/b>을 자극합니다. 질문을 통해 이어질 내용에 대한 \u003cb class=\"key\">관심\u003c/b>을 유도하는 역할입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">가주어 it과 진주어 to부정사\u003c/span> : Is + it(가주어) + 형용사 + to do so(진주어)? : \"그렇게 하는 것이 가능한가요?\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Is it possible, 가능할까. to do so?, 그렇게 하는 것이?. 이 문장 전체를 해석하면, 그렇게 하는 것이 가능할까?","hl":"m"},{"n":24,"text":"사람이 정말 순록보다 더 빨리 달릴 수 있을까 하는 의구심을 표현하며 글에 재미를 더하는 질문이에요. 여기서 그렇게 한다는 건 앞 문장의 내용인 순록을 앞지르는 것을 말해요.","hl":"mn"},{"n":25,"text":"이 문장에서는 it이 가짜 주어인 가주어로 쓰였고, 뒤에 나오는 to do so가 진짜 주어인 진주어예요. 영어는 주어가 긴 것을 싫어해서 진짜 주어를 뒤로 보내는 특징이 있다는 걸 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실 그렇지 않지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Not \u003c/span>\u003cspan class=\"tgt\">really\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이건 중요하지 않다.\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">matter\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 그렇지 않지만, 이건 중요하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 순록보다 빨리 달리는 것이 현실적으로 불가능함을 인정하면서도, 축제의 본질은 \u003cb class=\"key\">승리\u003c/b>가 아니라 \u003cb class=\"key\">즐거움\u003c/b>에 있음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의 대답 (생략 구문)\u003c/span> : Not really (possible). : \"사실 그렇지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 matter\u003c/span> : S + doesn't + matter(V) : \"중요하지 않다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Not really, 사실 그렇지 않지만. but, 그러나. it doesn't matter, 이건 중요하지 않다.. 이 문장 전체를 해석하면, 사실 그렇지 않지만, 이건 중요하지 않다.","hl":"m"},{"n":27,"text":"실제로 순록을 이기는 건 어렵다는 대답이죠. 하지만 이 축제의 진짜 목적은 이기는 것이 아니라 다 같이 즐기는 것이기 때문에 결과는 상관없다는 뜻이에요.","hl":"mn"},{"n":28,"text":"첫 번째로 Not really는 질문에 대해 부드럽게 부정하는 표현이에요. 두 번째로 matter라는 단어는 여기서 동사로 쓰여서 중요하다라는 뜻을 가집니다. 그래서 it doesn't matter라고 하면 그것은 중요하지 않아요라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Everyone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그저 즐기고 있을 뿐이다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">fun\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두가 그저 즐기고 있을 뿐이다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 순록 경주에서 이기는 것보다 축제에 참여하여 다 같이 어울리는 \u003cb class=\"key\">즐거움\u003c/b> 자체가 중요하다는 것을 강조합니다. 결과에 상관없이 모두가 행복한 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 전달하며 본문을 마무리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사의 수 일치\u003c/span> : Everyone [단수 부정대명사] + 단수 동사 [is] : \"모든 사람 (단수 취급)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 (am/are/is) + [v-ing (현재분사)] : \"그저 즐기고 있는 중이다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Everyone, 모두가. is just having fun!, 그저 즐기고 있을 뿐이다!. 이 문장 전체를 해석하면, 모두가 그저 즐기고 있을 뿐이다!","hl":"m"},{"n":30,"text":"앞선 문장에서 순록보다 빨리 달리는 게 사실상 불가능하다는 이야기를 했죠. 하지만 이 문장은 결과가 어떻든 상관없이 축제에 참여한 모든 사람이 느끼는 즐거움이 가장 중요하다는 점을 강조하고 있습니다.","hl":"mn"},{"n":31,"text":"첫 번째로 주어인 Everyone을 살펴볼게요. 우리말로는 모두라는 뜻이라 여러 명처럼 느껴지지만 영어에서는 반드시 단수 취급을 해야 하는 단어입니다. 그래서 동사 자리에 are를 쓰지 않고 단수형인 is를 쓴 것이 아주 중요한 포인트예요. 두 번째로 비동사 is와 having이 합쳐진 형태를 보세요. 지금 축제를 신나게 즐기고 있는 진행 중인 상황을 생생하게 표현하기 위해서 현재진행형 시제를 썼습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>2월 말 \u003cb class=\"key\">알래스카\u003c/b>에서 세계적인 규모의 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b> 축제가 개최됩니다.\u003c/li>\u003cli>축제 기간 동안 다양한 겨울 스포츠와 알래스카 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 즐길 수 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">순록 \u003c/b>\u003cb class=\"key\">경주\u003c/b>에 참가하는 사람들은 독특한 의상을 입고 \u003cb class=\"key\">순록\u003c/b>과 속도를 겨룹니다.\u003c/li>\u003cli>순록보다 빨리 달리는 것보다 모두가 함께 \u003cb class=\"key\">즐거움\u003c/b>을 느끼는 것이 축제의 진정한 의미입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Fur Rondy festival in Alaska offers various winter sports and a unique, fun reindeer race regardless of the outcome.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">알래스카\u003c/b>에서 열리는 세계 최대 규모의 겨울 축제인 \u003cb class=\"key\">Fur \u003c/b>\u003cb class=\"key\">Rondy\u003c/b>와 그곳에서 즐기는 독특한 \u003cb class=\"key\">순록 \u003c/b>\u003cb class=\"key\">경주\u003c/b>에 대해 소개하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 오늘은 알래스카의 열기 가득한 축제 현장을 글로 만나봤습니다. 단순히 정보를 전달하는 것을 넘어 축제의 행복한 분위기가 느껴지는 지문이었죠? 오늘 배운 표현들 특히 순록 경주와 관련된 생동감 넘치는 묘사들을 복습하면서 여러분만의 것으로 만드시길 바랍니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
