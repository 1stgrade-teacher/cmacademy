    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"Watch and Talk C","title":"중2 동아(윤) 7과 Watch and Talk C","audioDir":"5_audio","preview":false,"count":59,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">선호 묻고 답하기 / 이유 묻고 답하기\u003c/div>\u003ch1>중2 동아(윤) 7과 대화문 해설 — 선호 묻고 답하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>엠마와 지한이 불꽃놀이 축제 현장에서 우연히 만나, 올해 참가하는 나라와 불꽃놀이 시작 시간을 이야기한다. 두 사람은 불꽃놀이가 시작되는 오후 7시까지 함께 보트를 타러 가기로 정한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중2 동아 윤 선생님 7과 대화문을 함께 공부해 볼게요. 엠마와 지한이가 불꽃놀이 축제에서 만나서 무엇을 할지 이야기하는 상황이에요. 두 사람이 서로의 선호를 어떻게 묻고 어떻게 대답하는지에 집중해서 들어 보세요. 그럼 대화 속으로 들어가 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Hi, Jihan. ➊What a surprise!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Hey, Emma. Are you here ➋ to see the fireworks, too?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yes. ➌I hear China, Italy, and the USA are participating\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cdiv class=\"d-en\">this year.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Don't forget Korea.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">➍Of course, Korea, too. So, the fireworks start at 7\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cdiv class=\"d-en\">p.m. ➎Right?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Yeah. Let's do something together ➏until then.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I guess we can ride bikes or go for a boat ride. Which\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-9\">\u003cdiv class=\"d-en\">do you like more?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-10\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">➐Going for a boat ride. ➑ I think it'll be more fun.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-11\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Then, let's go for a boat ride.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Hi, Jihan. What a surprise!","hl":"r-0"},{"n":3,"text":"Hey, Emma. Are you here to see the fireworks, too?","hl":"r-1"},{"n":4,"text":"Yes. I hear China, Italy, and the USA are participating this year.","hl":"r-2"},{"n":5,"text":".","hl":"r-3"},{"n":6,"text":"Don't forget Korea.","hl":"r-4"},{"n":7,"text":"Of course, Korea, too. So, the fireworks start at 7 p.m. Right?","hl":"r-5"},{"n":8,"text":".","hl":"r-6"},{"n":9,"text":"Yeah. Let's do something together until then.","hl":"r-7"},{"n":10,"text":"I guess we can ride bikes or go for a boat ride. Which","hl":"r-8"},{"n":11,"text":"do you like more?","hl":"r-9"},{"n":12,"text":"Going for a boat ride. I think it'll be more fun.","hl":"r-10"},{"n":13,"text":"Then, let's go for a boat ride.","hl":"r-11"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">선호 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Which do you like more〔better〕, A or B?\u003c/div>\u003cdiv class=\"d-mean\">A와 B 중에서 어느 것을 더 좋아하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: do you like more?\u003c/div>\u003cdiv class=\"d-exp\">둘 중에서 어느 것을 더 \u003cb class=\"key\">선호\u003c/b>하는지 물을 때는 Which do you like more〔better〕, A or B?라고 표현해요. 이때 A와 B는 \u003cb class=\"key\">동일한 문법 형태\u003c/b>와 구조를 가져야 해요. 대답으로는 I like ~ more〔better〕. 또는 I prefer ~.를 써서 자신의 \u003cb class=\"key\">선호\u003c/b>를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which of the two do you like more?\u003c/li>\u003cli>Which do you like better, A or B?\u003c/li>\u003cli>Which one do you prefer, A or B?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I like ~ (much) more.\u003c/li>\u003cli>I like ~ (much) better.\u003c/li>\u003cli>I prefer ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"먼저 두 가지 중에서 어떤 것을 더 좋아하는지 물어보는 표현을 배워 볼게요. Which do you like more, A or B? 라고 하면 에이와 비 중에서 어느 것을 더 좋아하니라는 뜻이에요. 대화에서는 Which do you like more? 라고 이미 두 가지를 알고 있는 상태에서 묻고 있죠. 뒤에 비교하는 대상을 A or B 형태로 붙여 주면 더 정확한 질문이 돼요.","hl":"key"},{"n":15,"text":"같은 뜻으로는 Which do you like better, A or B? 라고 말할 수 있어요. more 대신 better를 써도 똑같이 선호를 묻는 표현이에요. 또 Which of the two do you like more? 라고 하면 둘 중에서 어느 것을 더 좋아하니라는 뜻이죠. Which one do you prefer, A or B? 도 같은 의도로 쓸 수 있어요.","hl":"alts"},{"n":16,"text":"대답할 때는 I like going for a boat ride more. 처럼 I like 다음에 좋아하는 것을 넣고 뒤에 more를 붙여요. I like riding bikes better. 처럼 better를 써도 같은 뜻이에요. I prefer going for a boat ride. 라고 하면 나는 보트 타는 것을 더 선호해라는 뜻이 됩니다. 대답할 때는 고른 것 하나만 말해도 충분해요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">이유 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Why do you ~?\u003c/div>\u003cdiv class=\"d-mean\">왜 ~하니?\u003c/div>\u003cdiv class=\"d-exp\">상대방의 의견이나 행동에 대한 \u003cb class=\"key\">이유\u003c/b>를 물을 때는 Why do you ~?라고 표현해요. 이에 대한 대답으로 (It's because) I ~.를 써서 자신의 의견이나 행동에 대한 \u003cb class=\"key\">이유\u003c/b>를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How come you ~?\u003c/li>\u003cli>What makes you ~?\u003c/li>\u003cli>Is there a reason you ~?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>(It's because) I ~.\u003c/li>\u003cli>Because ~.\u003c/li>\u003cli>The reason is that ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"다음은 이유를 물어보는 표현이에요. Why do you like going for a boat ride? 라고 하면 왜 보트 타러 가는 것을 좋아하니라고 이유를 묻는 말이 돼요. 상대방의 의견이나 행동에 이유가 궁금할 때 Why do you 다음에 궁금한 내용을 붙여 주면 됩니다.","hl":"key"},{"n":18,"text":"조금 더 편하게는 How come you like going for a boat ride? 라고 물어볼 수 있어요. What makes you choose a boat ride? 처럼 무엇이 너를 그렇게 만들었니라고 물어도 이유를 묻는 표현이에요.","hl":"alts"},{"n":19,"text":"대답은 It's because I think it'll be more fun. 처럼 It's because 다음에 이유를 말하면 돼요. 그냥 Because it's more fun. 이라고 해도 자연스러워요. The reason is that it's more fun. 이라고 해도 같은 뜻이 됩니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Hi, Jihan. ➊\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What a surprise!\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">안녕, 지한아. 어쩐 일이야!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>‘놀라운데!, 어쩐 일이야!’라는 의미로, 예상하지 못한 일이나 상황에 놀라서 쓰는 \u003cb class=\"key\">감탄\u003c/b>의 표현이에요. What a 뒤에 명사를 넣으면 이런 \u003cb class=\"key\">감탄문\u003c/b>이 돼요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What a surprise to see you here!\u003c/span>\u003cspan>Fancy seeing you here!\u003c/span>\u003cspan>What brings you here?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Hey, Emma. Are you here ➋ \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to see the fireworks\u003c/span>, too?\u003c/div>\u003cdiv class=\"d-ko\">안녕, 엠마. 너도 불꽃놀이를 보러 온 거야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>‘불꽃놀이를 보기 위해’라는 뜻으로, \u003cb class=\"key\">목적\u003c/b>을 나타내는 \u003cb class=\"key\">부사적 용법\u003c/b>의 to부정사구예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Are you here to watch the fireworks, too?\u003c/span>\u003cspan>Did you come here to see the fireworks, too?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 줄이에요. 엠마가 Hi, Jihan. What a surprise! 라고 말하죠. 뜻은 안녕, 지한아, 어쩐 일이야 하는 거예요. What a surprise는 예상하지 못한 상황에서 놀랐을 때 쓰는 감탄 표현이에요. 같은 뜻으로 What brings you here? 라고도 말할 수 있어요.","hl":"l-0"},{"n":21,"text":"두 번째 줄, 지한이 Hey, Emma. Are you here to see the fireworks, too? 라고 말해요. 뜻은 안녕, 엠마, 너도 불꽃놀이를 보러 온 거야 예요. 여기서 to see는 불꽃놀이를 보기 위해라는 목적을 나타내는 부사적 용법의 to부정사예요. 같은 뜻으로 Did you come here to see the fireworks, too? 라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes. ➌\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I hear\u003c/span> China, Italy, and the USA are participating\u003c/div>\u003cdiv class=\"d-ko\">응. 중국, 이탈리아, 미국이 올해 참가한다고 들었어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>I hear 뒤에 \u003cb class=\"key\">목적어\u003c/b> 역할을 하는 \u003cb class=\"key\">명사절\u003c/b>을 이끄는 접속사 that이 생략되어 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I've heard that China, Italy, and the USA are taking part this year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">this year\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">올해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>‘올해’라는 뜻의 \u003cb class=\"key\">부사구\u003c/b>로, 앞 줄의 are participating과 이어져 ‘올해 참가한다’는 뜻을 완성해요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"세 번째 줄이에요. 엠마가 Yes. I hear China, Italy, and the USA are participating this year. 라고 해요. 뜻은 응, 중국과 이탈리아, 미국이 올해 참가한다고 들었어 예요. I hear 뒤에는 접속사 that이 생략되어 있고, 그 절이 목적어 역할을 하고 있어요. 이어지는 this year는 다음 줄로 연결됩니다.","hl":"l-0"},{"n":23,"text":"네 번째 줄은 this year, 올해라는 말이에요. 앞 줄의 are participating과 이어져서 올해 참가한다는 뜻을 완성해요. 연도나 시기를 말할 때는 전치사 없이 this year라고 그냥 씁니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Don't forget Korea.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">한국도 잊지 마.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>‘~을 잊지 마’라는 뜻의 \u003cb class=\"key\">부정 명령문\u003c/b>이에요. 잊지 말고 한국도 말해야 한다고 \u003cb class=\"key\">당부\u003c/b>하는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>You shouldn't forget Korea.\u003c/span>\u003cspan>Korea, too!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➍\u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">Of course, Korea, too.\u003c/span> So, \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">the fireworks start at 7\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">물론 한국도 참가해. 그래서 불꽃놀이는 7시에 시작해\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>Of course, Korea is participating this year, too.(물론 한국도 올해 참가해.)의 의미예요. \u003cb class=\"key\">Of course\u003c/b>는 ‘물론’이라는 뜻의 \u003cb class=\"key\">동의\u003c/b> 표현이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>‘불꽃놀이는 7시에 시작해’라는 뜻으로, 특정 \u003cb class=\"key\">시각\u003c/b> 앞에는 전치사 \u003cb class=\"key\">at\u003c/b>을 써요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"다섯 번째 줄, 지한이 Don't forget Korea. 라고 해요. 뜻은 한국도 잊지 마 예요. Don't forget은 잊지 마라며 부정 명령문으로 당부할 때 써요. You shouldn't forget Korea. 라고 해도 같은 뜻이에요.","hl":"l-0"},{"n":25,"text":"여섯 번째 줄이에요. 엠마가 Of course, Korea, too. So, the fireworks start at seven p.m. Right? 라고 말해요. Of course, Korea, too는 물론 한국도 참가한다는 뜻이에요. So는 그래서라는 뜻으로 앞 내용을 이어 주고, start at seven p.m.은 오후 일곱 시에 시작한다는 말이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">p.m. ➎\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Right?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">오후 7시. 맞지?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>‘맞지?, 그렇지?’라는 의미로, 상대방에게 자신이 한 말이 맞는지 \u003cb class=\"key\">확인\u003c/b>하는 말이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>The fireworks start at 7 p.m., don't they?\u003c/span>\u003cspan>The fireworks start at 7 p.m., correct?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yeah. Let's do something together ➏\u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">until then\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">응. 그때까지 같이 뭐 좀 하자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>‘그때까지’의 의미로, 이 대화에서는 불꽃놀이가 시작되는 ‘오후 7시까지’를 말해요. \u003cb class=\"key\">전치사 until\u003c/b>은 ‘~까지(계속)’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Let's do something together in the meantime.\u003c/span>\u003cspan>Let's hang out together until the fireworks start.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"일곱 번째 줄은 p.m.과 Right? 예요. p.m.은 오후라는 뜻이고, Right?는 맞지, 그렇지라며 상대방에게 확인하는 말이에요. 올라가는 억양으로 말하면 더 자연스러워요. 같은 뜻으로 The fireworks start at seven p.m., don't they? 라고도 확인할 수 있어요.","hl":"l-0"},{"n":27,"text":"여덟 번째 줄, 지한이 Yeah. Let's do something together until then. 이라고 해요. 뜻은 응, 그때까지 같이 뭐 좀 하자 예요. until then은 그때까지라는 뜻으로, 여기서는 불꽃놀이가 시작되는 오후 일곱 시까지를 말해요. in the meantime을 써서 같은 뜻을 표현할 수도 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">I guess\u003c/span> we can ride bikes or \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">go for a boat ride\u003c/span>. Which\u003c/div>\u003cdiv class=\"d-ko\">자전거를 타거나 보트를 타러 가면 될 것 같아. 어느 쪽이\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>‘~인 것 같아’라는 뜻으로, 자신의 생각을 \u003cb class=\"key\">부드럽게\u003c/b> 말할 때 쓰는 표현이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>‘보트를 타러 가다’라는 뜻으로, \u003cb class=\"key\">go for a + 명사\u003c/b> 형태로 ‘~하러 가다’를 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">do you like more?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">더 좋아해?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>앞 줄의 Which와 이어져 둘 중에서 어느 것을 더 \u003cb class=\"key\">선호\u003c/b>하는지 묻는 표현이에요. more 대신 \u003cb class=\"key\">better\u003c/b>를 써도 같은 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which do you like better?\u003c/span>\u003cspan>Which of the two do you like more?\u003c/span>\u003cspan>Which one do you prefer?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":28,"text":"아홉 번째 줄이에요. 엠마가 I guess we can ride bikes or go for a boat ride. Which do you like more? 라고 말해요. 뜻은 자전거를 타거나 보트를 타러 가면 될 것 같아, 어느 쪽을 더 좋아해 예요. I guess는 나는 이럴 것 같아라며 생각을 부드럽게 말할 때 쓰고, go for a boat ride는 보트를 타러 가다라는 뜻이에요.","hl":"l-0"},{"n":29,"text":"열 번째 줄은 do you like more? 예요. 앞 줄의 Which와 이어져서 둘 중에 어느 것을 더 좋아하니라고 묻는 표현이 완성돼요. more 대신 better를 써도 같은 뜻이고, Which of the two do you like more? 라고 해도 됩니다. Which one do you prefer? 도 같은 의도를 담고 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 11–12 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">11\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➐\u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">Going for a boat ride.\u003c/span> ➑ I think \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>'ll be more fun.\u003c/div>\u003cdiv class=\"d-ko\">보트를 타러 가는 게 좋아. 더 재미있을 것 같아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>I like going for a boat ride more.(나는 보트 타러 가는 것이 더 좋아.)의 의미로, 앞 질문에 대한 \u003cb class=\"key\">대답\u003c/b>이에요. \u003cb class=\"key\">동명사\u003c/b> 주어 Going이 쓰였어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">14\u003c/span>\u003cspan>it은 (going for) a boat ride를 가리키는 \u003cb class=\"key\">대명사\u003c/b>예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like going for a boat ride more.\u003c/span>\u003cspan>I prefer going for a boat ride.\u003c/span>\u003cspan>I'd rather go for a boat ride.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">12\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Then, \u003cspan class=\"mk\">15\u003c/span>\u003cspan class=\"tgt\">let's go for a boat ride\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">그럼, 보트 타러 가자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan>「Then, let's ~」는 ‘그럼, ~하자’라며 \u003cb class=\"key\">제안\u003c/b>할 때 쓰는 표현이에요. let's 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 와요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Then, why don't we go for a boat ride?\u003c/span>\u003cspan>Then, how about going for a boat ride?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"열한 번째 줄, 지한이 Going for a boat ride. I think it'll be more fun. 이라고 해요. 뜻은 보트 타러 가는 게 좋아, 더 재미있을 것 같아 예요. 앞에 나온 I like가 생략된 대답으로, I like going for a boat ride more. 라는 뜻이에요. it은 going for a boat ride를 가리키고요, I prefer going for a boat ride. 라고 해도 같은 뜻이에요.","hl":"l-0"},{"n":31,"text":"마지막 줄, 엠마가 Then, let's go for a boat ride. 라고 해요. 뜻은 그럼 보트 타러 가자 예요. Then은 그럼이라며 앞의 대답을 받아 결정할 때 쓰고, let's는 함께 하자고 제안하는 표현이에요. Why don't we go for a boat ride? 라고 해도 똑같이 제안하는 말이 됩니다.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">A: Are you here ____ to see the fireworks, too?\nB: Yes, I am.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>see\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>to see\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>seeing\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>saw\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to see\u003c/span>\u003cdiv class=\"g-exp\">‘불꽃놀이를 보기 위해’라는 목적을 나타내므로 to부정사 to see가 들어가요. be동사 뒤에 to부정사를 붙여 ‘~하러 왔다’는 뜻을 만들어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"첫 번째 문제는 빈칸 채우기예요. Are you here, 빈칸, to see the fireworks, too? 에서 빈칸에 알맞은 말을 고르세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 두 번째 보기, to see예요. 불꽃놀이를 보기 위해라는 목적을 나타내니까 to부정사를 써야 해요. 그래서 Are you here to see the fireworks, too? 가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 9\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화를 자연스러운 순서로 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(가) Don't forget Korea.\n(나) Yes. I hear China, Italy, and the USA are participating this year.\n(다) Are you here to see the fireworks, too?\n(라) Of course, Korea, too. So, the fireworks start at 7 p.m. Right?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>(다)-(나)-(가)-(라)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>(다)-(가)-(나)-(라)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>(나)-(다)-(라)-(가)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>(가)-(다)-(나)-(라)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(다)-(나)-(가)-(라)\u003c/span>\u003cdiv class=\"g-exp\">먼저 불꽃놀이를 보러 왔는지 묻고(다), 참가하는 나라를 말한 뒤(나), 한국을 잊지 말라고 하고(가), 물론 한국도 참가한다고 답하며 시간을 확인해요(라).\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"두 번째 문제는 대화 순서 맞추기예요. 첫 번째 보기는 다, 나, 가, 라 순서이고요. 두 번째 보기는 다, 가, 나, 라 순서, 세 번째 보기는 나, 다, 라, 가 순서, 네 번째 보기는 가, 다, 나, 라 순서입니다. 잠시 멈추고 가장 자연스러운 순서를 골라 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 첫 번째 보기예요. 먼저 Are you here to see the fireworks, too? 라고 묻고, Yes. I hear China, Italy, and the USA are participating this year. 라고 대답해요. 그다음 Don't forget Korea. 라고 말하고, Of course, Korea, too. So, the fireworks start at seven p.m. Right? 로 이어지는 것이 자연스럽습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 9\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하는 영문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Emma and Jihan are at the fireworks festival to see the fireworks.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The fireworks start at eight p.m.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Jihan wants to ride bikes more than a boat.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>China, Italy, and the USA are not participating this year.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>They will go for a boat ride after the fireworks are over.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Emma and Jihan are at the fireworks festival to see the fireworks.\u003c/span>\u003cdiv class=\"g-exp\">엠마와 지한은 불꽃놀이를 보러 축제에 왔어요. 불꽃놀이는 오후 7시에 시작하고, 지한은 보트 타는 것을 더 좋아하며, 두 사람은 불꽃놀이가 시작되기 전까지 보트를 타러 가기로 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"세 번째 문제는 내용 일치예요. 대화의 내용과 일치하는 영문장을 고르세요. 첫 번째 보기, Emma and Jihan are at the fireworks festival to see the fireworks. 두 번째 보기, The fireworks start at eight p.m. 세 번째 보기, Jihan wants to ride bikes more than a boat. 네 번째 보기, China, Italy, and the USA are not participating this year. 다섯 번째 보기, They will go for a boat ride after the fireworks are over. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 첫 번째 보기예요. 엠마와 지한은 불꽃놀이를 보러 축제에 왔어요. 불꽃놀이는 오후 일곱 시에 시작하고, 지한은 보트 타는 것을 더 좋아해요. 두 사람은 불꽃놀이가 시작되기 전까지 보트를 타러 가기로 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 9\u003c/span>\u003cspan class=\"g-kind\">내용 불일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 내용과 일치하지 않는 영문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Emma and Jihan meet at the fireworks festival.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Korea is participating in the fireworks festival this year.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The fireworks start at seven p.m.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Jihan likes going for a boat ride more than riding bikes.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>⑤\u003c/b>They will meet again after the fireworks.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">They will meet again after the fireworks.\u003c/span>\u003cdiv class=\"g-exp\">두 사람은 이미 만나 있고, 불꽃놀이가 시작되는 오후 7시까지 함께 보트를 타러 가기로 했어요. 그러므로 불꽃놀이가 끝난 뒤에 다시 만난다는 말은 대화 내용과 달라요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"네 번째 문제는 내용 불일치예요. 대화의 내용과 일치하지 않는 영문장을 고르세요. 첫 번째 보기, Emma and Jihan meet at the fireworks festival. 두 번째 보기, Korea is participating in the fireworks festival this year. 세 번째 보기, The fireworks start at seven p.m. 네 번째 보기, Jihan likes going for a boat ride more than riding bikes. 다섯 번째 보기, They will meet again after the fireworks. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":6},{"n":43,"text":"정답은 다섯 번째 보기예요. 두 사람은 이미 만나 있고, 불꽃놀이가 시작되는 오후 일곱 시까지 함께 보트를 타러 가기로 했어요. 그러니까 불꽃놀이가 끝난 뒤에 다시 만난다는 말은 대화 내용과 다릅니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 9\u003c/span>\u003cspan class=\"g-kind\">의도\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 What a surprise!의 의도로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">G: Hi, Jihan. What a surprise!\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>예상하지 못한 상황에서 놀라움을 나타내려고\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>상대방에게 함께 가자고 제안하려고\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>자신이 한 말이 맞는지 확인하려고\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>상대방의 행동에 대한 이유를 물으려고\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>고마움을 표현하려고\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">예상하지 못한 상황에서 놀라움을 나타내려고\u003c/span>\u003cdiv class=\"g-exp\">What a surprise!는 예상하지 못한 일이나 상황에 놀라서 쓰는 감탄의 표현이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":44,"text":"다섯 번째 문제는 밑줄 친 말의 의도예요. 대화에서 What a surprise!의 의도로 알맞은 것을 고르세요. 첫 번째 보기, 예상하지 못한 상황에서 놀라움을 나타내려고. 두 번째 보기, 상대방에게 함께 가자고 제안하려고. 세 번째 보기, 자신이 한 말이 맞는지 확인하려고. 네 번째 보기, 상대방의 행동에 대한 이유를 물으려고. 다섯 번째 보기, 고마움을 표현하려고. 잠시 멈추고 풀어 보세요.","hl":"q"},
