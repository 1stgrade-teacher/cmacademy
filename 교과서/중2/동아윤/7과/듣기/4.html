  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};

  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

lecturePlayer(document.getElementById("app"),{"brand":"Watch and Talk A-4","title":"중2 동아(윤) 7과 Watch and Talk A-4","audioDir":"4_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">더 좋아하는 것 묻고 답하기\u003c/div>\u003ch1>중2 동아(윤) 7과 대화문 해설 — 더 좋아하는 것 묻고 답하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>축제 기념품 가게에서 두 친구가 무엇을 살지 이야기한다. 한 친구가 티셔츠와 모자 중에서 티셔츠를 더 좋아한다고 말하고, 그 이유로 티셔츠에 있는 멋진 축제 그림을 이야기한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 동아 윤정미 교과서 일곱 번째 과 대화문을 함께 공부해 볼 거예요. 두 친구가 축제 기념품 가게에서 티셔츠와 모자 중 무엇을 살지 이야기하고 있죠. 오늘 배울 표현은 둘 중에 더 좋아하는 것을 묻고 답하기, 그리고 그 이유를 묻고 말하기예요. 그럼 대화를 한 줄씩 같이 읽어 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Let's get a souvenir.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Which do you like better, the T-shirt or the cap?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I like the T-shirt better.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Why?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">There is a nice picture of the festival on it.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Let's get a souvenir.","hl":"r-0"},{"n":3,"text":"Which do you like better, the T-shirt or the cap?","hl":"r-1"},{"n":4,"text":"I like the T-shirt better.","hl":"r-2"},{"n":5,"text":"Why?","hl":"r-3"},{"n":6,"text":"There is a nice picture of the festival on it.","hl":"r-4"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">더 좋아하는 것 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Which do you like better, A or B?\u003c/div>\u003cdiv class=\"d-mean\">A와 B 중에서 어느 것을 더 좋아하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Which do you like better, the T-shirt or the cap?\u003c/div>\u003cdiv class=\"d-exp\">둘 중에서 어느 것을 더 선호하는지 물을 때 쓰는 표현이에요. \u003cb class=\"key\">Which do you like better, A or B?\u003c/b> 뒤에는 동일한 문법 형태의 두 대상을 \u003cb class=\"key\">A or B\u003c/b> 형태로 넣어 말하고, 대답은 \u003cb class=\"key\">I like ~ better.\u003c/b>나 I prefer ~.로 해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which do you like more, A or B?\u003c/li>\u003cli>Which of the two do you like better?\u003c/li>\u003cli>Which do you prefer, A or B?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I like ~ better.\u003c/li>\u003cli>I like ~ more.\u003c/li>\u003cli>I prefer ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"먼저 둘 중에서 더 좋아하는 것을 묻는 표현을 배워 볼게요. Which do you like better, A or B? 라고 하면 두 가지 중에서 어느 것을 더 좋아하니라는 뜻이에요. 여기서 better 는 더 좋아한다는 뜻을 나타내는 비교급 표현이죠. 두 대상은 꼭 A or B 형태로 넣어서 말해 주세요.","hl":"key"},{"n":8,"text":"같은 의미의 표현도 함께 익혀 볼게요. Which do you like more, A or B? 는 Which do you like better, A or B? 와 같은 뜻이에요. Which of the two do you like better? 라고 해도 두 가지 중 어느 것을 더 좋아하는지 묻는 말이 됩니다. 마지막으로 Which do you prefer, A or B? 도 함께 기억해 두세요.","hl":"alts"},{"n":9,"text":"이렇게 물었을 때는 I like the T-shirt better. 처럼 I like 와 대상을 말하고 better 를 붙여서 대답해요. 조금 더 좋아한다는 뜻으로 I like the T-shirt more. 라고 해도 됩니다. 다른 사람과 취향을 말할 때는 I prefer the T-shirt. 처럼 prefer 를 쓸 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">이유 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Why do you ~?\u003c/div>\u003cdiv class=\"d-mean\">왜 ~하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Why?\u003c/div>\u003cdiv class=\"d-exp\">상대방의 의견이나 행동에 대한 이유를 물을 때는 \u003cb class=\"key\">Why do you ~?\u003c/b>를 써요. 대화에서는 \u003cb class=\"key\">Why?\u003c/b>만으로 짧게 물었고, 대답은 \u003cb class=\"key\">(It's because) I ~.\u003c/b>로 이유를 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Why do you like the T-shirt better?\u003c/li>\u003cli>Why is that?\u003c/li>\u003cli>What makes you like it better?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>(It's because) I ~.\u003c/li>\u003cli>Because ~.\u003c/li>\u003cli>The reason is that ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 이유를 묻는 표현을 배워 볼게요. Why do you like the T-shirt better? 라고 하면 왜 티셔츠를 더 좋아하니라고 이유를 묻는 말이에요. 대화에서는 Why? 라고 짧게 묻기만 했죠. 이렇게 Why 하나만으로도 충분히 이유를 물을 수 있어요.","hl":"key"},{"n":11,"text":"이유를 물을 때는 Why do you like the T-shirt better? 처럼 뒤에 좋아하는 대상을 붙여서 길게 물을 수 있어요. 조금 편하게는 Why is that? 이라고 물어도 같은 뜻이 됩니다. What makes you like it better? 도 이유를 묻는 표현이에요.","hl":"alts"},{"n":12,"text":"대답할 때는 It's because I like the picture. 처럼 It's because 로 시작하면 이유를 자연스럽게 말할 수 있어요. Because there is a nice picture on it. 처럼 Because 만 써도 괜찮아요. 격식 있는 자리에서는 The reason is that I like the design. 처럼 말하기도 합니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's get\u003c/span> a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">souvenir\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">기념품 하나 사자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">Let's\u003c/b>는 '~하자'라는 제안을 나타내는 표현으로 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 와요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">souvenir\u003c/b>는 '기념품'이라는 뜻의 명사예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Why don't we get a souvenir?\u003c/span>\u003cspan>Shall we get a souvenir?\u003c/span>\u003cspan>How about getting a souvenir?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Which do you like better\u003c/span>, \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the T-shirt or the cap\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">티셔츠와 모자 중에서 어느 것을 더 좋아하니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>상대방에게 A와 B 중에 어느 것을 더 좋아하는지 묻는 표현이에요. \u003cb class=\"key\">better\u003c/b>는 '더 좋아하다'를 나타내는 비교급이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>선호를 묻는 표현에서 두 대상을 \u003cb class=\"key\">A or B\u003c/b> 형태로 넣어 말하며, 이때 A와 B는 \u003cb class=\"key\">동일한 문법 형태\u003c/b>와 구조를 가져야 해요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which do you like more, the T-shirt or the cap?\u003c/span>\u003cspan>Which of the two do you like better?\u003c/span>\u003cspan>Which do you prefer, the T-shirt or the cap?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"첫 번째 문장입니다. Let's get a souvenir. 라고 읽고, 뜻은 기념품 하나 사자예요. Let's 는 뒤에 동사원형을 붙여서 함께 무엇을 하자고 제안할 때 쓰는 표현이에요. souvenir 는 기념품이라는 뜻이죠. 같은 뜻으로 Why don't we get a souvenir? 나 Shall we get a souvenir? 라고 말할 수도 있어요.","hl":"l-0"},{"n":14,"text":"두 번째 문장입니다. Which do you like better, the T-shirt or the cap? 이라고 읽고, 티셔츠와 모자 중에서 어느 것을 더 좋아하니라는 뜻이에요. Which do you like better, A or B? 형태로 두 대상 중 더 좋아하는 것을 물을 때 쓰는 표현이죠. the T-shirt or the cap 처럼 두 대상은 꼭 같은 형태로 넣어 주세요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">I like the T-shirt better\u003c/span>\u003cspan class=\"mk\">6\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">나는 티셔츠를 더 좋아해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>둘 중에 하나를 선택해 선호를 나타내는 대답으로, \u003cb class=\"key\">I like ~ better.\u003c/b> 형태로 말해요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>여기서 \u003cb class=\"key\">better\u003c/b>는 '더 좋아하다'라는 뜻으로, 선호를 나타낼 때 쓰는 비교급이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like the T-shirt more.\u003c/span>\u003cspan>I prefer the T-shirt.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">Why\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">왜?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>이유를 묻는 말로, \u003cb class=\"key\">Why do you like the T-shirt better?\u003c/b>의 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Why do you like the T-shirt better?\u003c/span>\u003cspan>Why is that?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"세 번째 문장입니다. I like the T-shirt better. 라고 읽고, 나는 티셔츠를 더 좋아해라는 뜻이에요. 방금 들은 질
