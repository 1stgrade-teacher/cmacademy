window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"8과 대화문 A","title":"중2 동아(윤) 8과 A. Listen and Match (1)","audioDir":"1_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">경험 묻고 답하기와 기대 표현하기\u003c/div>\u003ch1>중2 동아(윤) 8과 A. Listen and Match (1)\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>Alex가 Gina에게 얼음 낚시를 해 본 적이 있는지 묻고, Gina는 지난겨울 경험을 말합니다. 이어서 Alex는 가족과 이번 겨울에 얼음 낚시를 갈 계획을 말하며 기대를 나타냅니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 영어를 함께 공부하는 선생님이에요. 오늘은 동아 윤정미 이학년 이번 단원의 Listen and Match 첫 번째 대화를 함께 공부해 볼 거예요. Alex와 Gina가 얼음 낚시 경험과 이번 겨울 계획에 대해 이야기해요. 경험을 묻는 표현과 기대를 나타내는 표현을 자연스럽게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Have you ever tried ice fishing?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yes, I have, Alex. I went to an ice festival last winter and tried ice fishing there.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">That's great! My family is planning to go ice fishing this winter.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Oh, you're going to love it. It's really exciting.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Yeah. I'm looking forward to fishing on the icy river.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Have you ever tried ice fishing?","hl":"r-0"},{"n":3,"text":"Yes, I have, Alex. I went to an ice festival last winter and tried ice fishing there.","hl":"r-1"},{"n":4,"text":"That's great! My fa "g-q\">다음 문장과 같은 뜻으로 쓸 수 있는 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">I'm looking forward to fishing on the icy river.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>I can't wait to fish on the icy river.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I'm looking forward to fish on the icy river.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>I can't wait fishing on the icy river.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I'm going to look forward to fish on the icy river.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I can't wait to fish on the icy river.\u003c/span>\u003cdiv class=\"g-exp\">‘나는 ~을 기대하고 있어.’는 I'm looking forward to + (동)명사로 나타내며, I can't wait to + 동사원형으로도 같은 뜻을 나타냅니다. 따라서 I can't wait to fish on the icy river.가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제예요. 다음 문장과 같은 뜻으로 쓸 수 있는 표현을 고르세요. I'm looking forward to fishing on the icy river. 나는 얼음이 언 강에서 낚시하는 것을 기대하고 있어. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 첫 번째 보기예요. I can't wait to fish on the icy river. 나는 얼음이 언 강에서 낚시하기를 기다릴 수 없을 만큼 기대돼. I'm looking forward to 뒤에는 동명사가 오고, I can't wait to 뒤에는 동사원형이 와요. 그래서 can't wait to fish가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">경험 묻고 답하기와 기대 표현하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>경험을 물을 때는 \u003cb class=\"key\">Have you ever + 과거분사\u003c/b> ~?를 써서 ‘너는 ~해 본 적 있니?’라고 말해요.\u003c/li>\u003cli>경험을 했다는 긍정의 대답은 \u003cb class=\"key\">Yes, I have.\u003c/b>로 하고, 경험이 없다는 부정의 대답은 \u003cb class=\"key\">No, I haven't.\u003c/b>로 해요. 구체적인 경험은 \u003cb class=\"key\">과거시제\u003c/b>로 말할 수 있어요.\u003c/li>\u003cli>계획은 \u003cb class=\"key\">plan to + 동사원형\u003c/b>으로, ‘~하러 가다’는 \u003cb class=\"key\">go + -ing\u003c/b>로 표현해요.\u003c/li>\u003cli>기대는 \u003cb class=\"key\">I'm looking forward to + (동)명사\u003c/b>로 말하고, \u003cb class=\"key\">I can't wait to + 동사원형\u003c/b>이나 \u003cb class=\"key\">I can't wait for + 명사\u003c/b>로 바꿔 쓸 수 있어요.\u003c/li>\u003cli>\u003cb class=\"key\">I'm excited about + (동)명사\u003c/b>도 기대를 나타내며, looking forward to 뒤에는 (대)명사나 \u003cb class=\"key\">동명사\u003c/b>가 온다는 점을 기억해요.\u003c/li>\u003c/ul>","segs":[{"n":33,"text":"오늘은 경험을 묻고 답하는 표현과 기대를 나타내는 표현을 배웠어요. Have you ever tried ice fishing?은 너는 얼음 낚시를 해 본 적 있니?라는 뜻으로 경험을 묻는 표현이에요. 이때 ever는 경험을 강조하는 부사라서 빼고 말할 수도 있어요. 경험이 있다면 Yes, I have.라고 하고, 없다면 No, I haven't.라고 대답해요. 계획을 말할 때는 plan to와 go 뒤에 동명사 형태를 붙인 표현을 사용하고, 기대를 말할 때는 I'm looking forward to 뒤에 명사나 동명사를 써요. I can't wait to 뒤에는 동사원형이 오고, I can't wait for 뒤에는 명사가 와요. I'm excited about 뒤에는 동명사가 온다는 것도 기억해요. 오늘 배운 표현을 소리 내어 여러 번 연습해 보고 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
