window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Topic 2 > A","title":"중2 동아(윤) 8과 Topic 2 A","audioDir":"4_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">장소 추천과 경험 묻고 답하기\u003c/div>\u003ch1>중2 동아(윤) 8과 Topic 2 &gt; A 대화문 해설 강의\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>Lucy는 이번 주말 서울에 오는 친구 Emily를 어디로 데려갈지 고민하다가, Giho에게 한양도성을 추천받고 그곳에서 할 수 있는 활동을 묻습니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Lucy와 Giho가 서울에서 친구를 어디로 데려갈지 이야기하는 대화를 공부해요. Lucy는 이번 주말 서울에 오는 친구 Emily를 위해 좋은 장소를 찾고 있어요. Giho가 추천한 곳은 한양도성이에요. 그럼 대화를 한 줄씩 읽으면서 장소 추천을 묻는 표현과 경험을 묻는 표현을 함께 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">Lucy\u003c/span>\u003cdiv class=\"d-en\">My friend Emily is visiting Seoul this weekend. Where can I take her?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">Giho\u003c/span>\u003cdiv class=\"d-en\">Well, Lucy, have you ever visited Hanyangdoseong before?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">Lucy\u003c/span>\u003cdiv class=\"d-en\">No, I haven't. What's that?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">Giho\u003c/span>\u003cdiv class=\"d-en\">It's an ancient wall surrounding Seoul.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">Lucy\u003c/span>\u003cdiv class=\"d-en\">That sounds interesting. What can we do there?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">Giho\u003c/span>\u003cdiv class=\"d-en\">You can walk along the wall and enjoy the beautiful view. You can also participate in  a stamp tour.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">Lucy\u003c/span>\u003cdiv class=\"d-en\">That's perfect. Emily likes walking. And she'll love the stamp tour.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">Giho\u003c/span>\u003cdiv class=\"d-en\">I hope you have a great time at Hanyangdoseong.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">Lucy\u003c/span>\u003cdiv class=\"d-en\">Thanks. I'm really looking forward to walking around the city with Emily.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"My friend Emily is visiting Seoul this weekend. Where can I take her?","hl":"r-0"},{"n":3,"text":"Well, Lucy, have you ever visited Hanyangdoseong before?","hl":"r-1"},{"n":4,"text":"No, I haven't. What's that?","hl":"r-2"},{"n":5,"text":"It's an ancient wall surrounding Seoul.","hl":"r-3"},{"n":6,"text":"That sounds interesting. What can we do there?","hl":"r-4"},{"n":7,"text":"You can walk along the wall and enjoy the beautiful view. You can also participate in a stamp tour.","hl":"r-5"},{"n":8,"text":"That's perfect. Emily likes walking. And she'll love the stamp tour.","hl":"r-6"},{"n":9,"text":"I hope you have a great time at Hanyangdoseong.","hl":"r-7"},{"n":10,"text":"Thanks. I'm really looking forward to walking around the city with Emily.","hl":"r-8"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">장소 추천 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Where can I take + 사람?\u003c/div>\u003cdiv class=\"d-mean\">~을 어디로 데려갈 수 있나요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: My friend Emily is visiting Seoul this weekend. Where can I take her?\u003c/div>\u003cdiv class=\"d-exp\">상대에게 갈 만한 \u003cb class=\"key\">장소 추천\u003c/b>을 부탁할 때 쓰는 표현입니다. \u003cb class=\"key\">Where can I take + 사람?\u003c/b>은 내가 ~을 어디로 데려갈 수 있을까요라는 뜻으로, 친구나 손님을 데려갈 곳을 물을 때 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-bo
