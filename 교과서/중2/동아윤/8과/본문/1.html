<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(윤) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(윤) 8과 본문1","audioDir":"1_audio","preview":false,"count":53,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Eckels Enters Time Travel Office\u003c/h1>\u003ch2>타임 트래블 사무실에 들어선 에클스\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">에클스\u003c/b>는 과거로의 시간 여행을 상품으로 제공하는 \u003cb class=\"key\">타임 \u003c/b>\u003cb class=\"key\">트래블\u003c/b> 사무실을 방문하여 6천만 년 전 \u003cb class=\"key\">공룡\u003c/b>을 보는 여행을 예약한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Eckels visits Time Travel to book a journey to see dinosaurs 60 million years ago.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간엔 타임슬립을 주제로 한 재미있는 소설 본문을 함께 살펴볼게요. 에클스가 시간 여행 사무실에 방문해서 벌어지는 일들을 담고 있어요. 글 전체의 요약과 요지를 탄탄하게 정리해 드릴게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시): 시간 여행은 과거로 돌아가거나 미래로 가는 \u003cb class=\"key\">타임 \u003c/b>\u003cb class=\"key\">트래블(Time \u003c/b>\u003cb class=\"key\">Travel)\u003c/b> 개념으로, SF 영화의 단골 소재입니다. 마치 \u003cb class=\"key\">타임머신(Time \u003c/b>\u003cb class=\"key\">Machine)\u003c/b>이라는 마법의 엘리베이터를 타고 전혀 다른 시대의 \u003cb class=\"key\">정글(Jungle)\u003c/b>로 바로 이동하는 것과 같습니다. 이러한 상상 속의 여행을 안전하게 즐기려면 전문가의 엄격한 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">지침(Safety \u003c/b>\u003cb class=\"key\">Instructions)\u003c/b>을 반드시 따라야 합니다. 과거의 작은 변화가 현재를 바꾸는 나비효과처럼, 철저한 \u003cb class=\"key\">준비(Preparation)\u003c/b>와 통제가 필수적이기 때문입니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 넓혀볼까요. 시간 여행이라는 것은 SF 영화에 자주 등장하는 개념이에요. 마치 타임머신이라는 마법의 엘리베이터를 타고 정글로 이동하는 것과 같죠. 하지만 과거를 바꿀 수 있는 만큼 철저한 안전 지침이 필수로 따라온답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사무실 방문과 광고\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>에클스는 \u003cb class=\"key\">타임 \u003c/b>\u003cb class=\"key\">트래블\u003c/b> 사무실로 걸어 들어간다. 벽에 걸린 큰 간판에는 과거의 어느 연도든 말하면 그곳으로 데려다준다는 광고가 적혀 있다. 또한 벽에 부착된 텔레비전에서는 새 대통령인 키스 씨가 \u003cb class=\"key\">뉴스\u003c/b>에 나오고 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>공룡 여행 문의\u003csmall>전개 · 문장 5–11\u003c/small>\u003c/h4>\u003cp>설립자인 파커 씨가 무엇을 도와드릴까요 하고 묻자 에클스는 항상 공룡을 보고 싶었다며 가능하냐고 질문한다. 파커 씨는 \u003cb class=\"key\">6천만 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">전\u003c/b>의 정글로 데려다줄 수 있다고 확답한다. 에클스는 기뻐하며 지금 바로 데려다줄 수 있는지 거듭 묻는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예약 확정과 안내원 소개\u003csmall>결론 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>운이 좋게도 10분 후에 출발하는 \u003cb class=\"key\">타임머신\u003c/b>이 있다고 파커 씨가 안내한다. 이어서 여행 안내원인 \u003cb class=\"key\">트래비스\u003c/b>를 소개하며 안전을 위해 그의 \u003cb class=\"key\">지시\u003c/b>를 반드시 따라야 한다고 강조한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글이 어떤 순서로 전개되는지 첫 번째 단계부터 차근차근 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 에클스가 타임 트래블 사무실에 들어가는 모습이 나와요. 벽에 걸린 간판에는 과거 어디든 데려다준다는 광고가 적혀 있고 TV에서는 뉴스 화면이 나오고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 에클스가 공룡을 보고 싶다고 질문해요. 파커 씨는 6천만 년 전 정글로 갈 수 있다고 답하고 에클스는 지금 바로 갈 수 있는지 묻는답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 10분 뒤에 출발하는 타임머신이 있다고 알려줘요. 마지막으로 여행 안내원인 트래비스를 소개하면서 안전을 위해 지시사항을 꼭 따라야 한다고 당부하며 이야기가 마무리돼요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 에클스가 \u003cb class=\"key\">타임 \u003c/b>\u003cb class=\"key\">트래블\u003c/b> 사무실에 들어서는 첫 문장으로 시작하여 시간 순서에 따라 대화가 자연스럽게 전개된다. 사무실 방문부터 공룡 여행 문의, 타임머신 탑승 안내 및 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">지침\u003c/b> 당부까지 순차적으로 이어진다. 따라서 독자는 전체 상황을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 쉽게 파악할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>There was (4)\u003c/b>\u003cspan>존재 알림\u003c/span>\u003cb>Sure (8)\u003c/b>\u003cspan>동의와 확신\u003c/span>\u003cb>continued (14)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Time Travel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the jungle of 60 million years ago\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a time machine\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Travis\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이번 글의 전개방식을 분석해 드릴게요. 이 글은 시간순 구조를 띠고 있어요. 에클스의 사무실 방문부터 대화, 그리고 출발 안내까지 사건이 일어난 시간 순서 그대로 이야기가 흘러간답니다.","hl":"ty"},{"n":8,"text":"글 속에서 흐름을 잡아주는 표현들도 눈여겨봐야 해요. 존재를 알리는 표현이나 대답을 나타내는 표현들이 대화의 맥락을 아주 자연스럽게 이어주고 있거든요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>walk into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 걸어 들어오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간판, 표지판\u003c/span>\u003c/div>\u003cdiv>\u003cb>president\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대통령\u003c/span>\u003c/div>\u003cdiv>\u003cb>founder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설립자\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>jungle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정글\u003c/span>\u003c/div>\u00
