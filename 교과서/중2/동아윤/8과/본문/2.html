<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(윤) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(윤) 8과 본문2","audioDir":"2_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>A Journey to the Past\u003c/h1>\u003ch2>과거로의 여행\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>타임머신을 타고 \u003cb class=\"key\">6천만 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">정글\u003c/b>에 도착한 여행자들은 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">벗어나지 \u003c/b>\u003cb class=\"key\">말고\u003c/b> 아무것도 만지지 말라는 엄격한 주의를 받는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Travelers in a time machine are strictly warned not to leave the path or touch anything in the prehistoric jungle.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 이번 시간엔 타임머신을 타고 과거로 간 여행자들의 이야기를 함께 공부할게요. 글 전체의 요약은 타임머신을 타고 6천만 년 전 정글에 도착한 여행자들이 엄격한 주의를 받는 내용이고요. 요지는 시간 여행 중에는 길을 벗어나거나 아무것도 만지면 안 된다는 경고예요. 자, 집중해서 지문을 같이 살펴볼까요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">시간 여행 \u003cb class=\"key\">time \u003c/b>\u003cb class=\"key\">travel\u003c/b>은 영화나 소설에서 자주 다루는 흥미로운 주제이지만, 과학적으로는 아직 상상의 영역에 머물러 있어요. 과학계에서는 과거로 돌아가 작은 변화를 일으키면 미래 전체가 완전히 바뀌어 버릴 수 있다는 \u003cb class=\"key\">나비 \u003c/b>\u003cb class=\"key\">효과\u003c/b> \u003cb class=\"key\">butterfly \u003c/b>\u003cb class=\"key\">effect\u003c/b>라는 개념을 이야기해요. 마치 스마트폰의 작은 설정 하나가 전체 시스템에 오류를 일으키는 것처럼, 사소한 행동도 엄청난 결과를 낳을 수 있다는 것이죠. 우리가 일상생활에서 매 순간의 선택을 신중하게 해야 하는 이유도 이와 비슷해요. 이 지문 역시 과거의 작은 실수가 미래에 미칠 수 있는 \u003cb class=\"key\">엄격한 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>의 중요성을 잘 보여 주고 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 가볍게 채워볼게요. 시간 여행은 소설이나 영화에 자주 나오는 흥미로운 주제인데요. 과학계에서는 과거의 작은 변화가 미래 전체를 바꿀 수 있다는 나비 효과라는 개념을 이야기해요. 마치 스마트폰의 작은 설정 하나가 전체 시스템에 오류를 일으키는 것처럼 사소한 행동도 큰 결과를 낳을 수 있죠. 이 지문 역시 과거의 작은 실수가 미래에 미칠 수 있는 엄격한 규칙의 중요성을 잘 보여 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>타임머신 내부\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>타임머신 안에는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">여행자 \u003c/b>\u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">명\u003c/b>이 함께 타고 있었고, Eckels는 자리에 앉아 눈을 감았어요. 그는 발밑에서 \u003cb class=\"key\">타임머신이 \u003c/b>\u003cb class=\"key\">움직이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 느끼며 긴장된 분위기를 형성해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정글 도착과 경고\u003csmall>주장 및 근거 · 문장 4–10\u003c/small>\u003c/h4>\u003cp>불과 몇 분 지나지 않아 머신이 멈추고 \u003cb class=\"key\">6천만 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">정글\u003c/b>에 도착하자마자 Travis는 엄격한 경고를 해요. 길을 절대 벗어나지 말고 \u003cb class=\"key\">아무것도 \u003c/b>\u003cb class=\"key\">만지지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>며 실수로 무언가를 죽이면 미래에 \u003cb class=\"key\">상상할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">일\u003c/b>이 벌어진다고 강조해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 타임머신이 과거에 도착해 경고를 듣는 과정을 시간순으로 보여 주고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째부터 세 번째 문장에서는 타임머신 안의 모습이 그려져요. 타임머신 안에는 다른 여행자 두 명이 함께 있었고 Eckels는 자리에 앉아 눈을 감았죠. 그는 발밑에서 타임머신이 움직이는 것을 느끼며 긴장감을 자아내요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째부터 열 번째 문장에서는 본격적인 사건이 펼쳐져요. 불과 몇 분 지나지 않아 머신이 멈추고 6천만 년 전 정글에 도착하자 Travis는 아주 엄격한 경고를 던져요. 길을 절대 벗어나지 말고 아무것도 만지지 말라며 실수로 무언가를 죽이면 미래에 상상할 수 없는 일이 벌어진다고 강조하죠.","hl":"f1"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 타임머신이 멈추고 과거 정글에 도착한 시점부터 \u003cb class=\"key\">엄격한 \u003c/b>\u003cb class=\"key\">주의사항\u003c/b>을 전달하는 과정을 시간 흐름에 따라 전개하고 있어요. 특히 마지막 10번 문장에서 \u003cb class=\"key\">미래에 \u003c/b>\u003cb class=\"key\">미칠 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 경고하며 주제를 강조하는 미괄식 구조를 취하고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After only a few minutes (4)\u003c/b>\u003cspan>시간 경과를 나타내는 표현\u003c/span>\u003cb>over there (6)\u003c/b>\u003cspan>공간적 위치를 가리키는 표현\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the machine\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">jungle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">path\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">change\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the future\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"이 글은 타임머신이 멈추고 과거 정글에 도착한 시점부터 주의사항을 전달하는 과정을 시간 흐름에 따라 전개하고 있어요. 특히 마지막 문장에서 미래에 미칠 영향을 경고하며 주제를 강조하는 미괄식 구조를 띠고 있답니다.","hl":"ty"},{"n":7,"text":"문장 속의 신호어를 살펴보면 네 번째 문장의 After only a few minutes라는 표현으로 시간이 흘렀음을 알 수 있어요. 또한 여섯 번째 문장의 over there 같은 표현으로 공간적 위치를 생생하게 짚어 주고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>inside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>traveler\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행자\u003c/span>\u003c/div>\u003cdiv>\u003cb>close\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감다, 닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u00 class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 벗어나면\u003c/span>\u003cspan class=\"en\">leave it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 경우에도\u003c/span>\u003cspan class=\"en\">at any time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 경우에도 저 길을 절대 벗어나면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간 여행 중 과거의 역사를 바꾸지 않기 위한 \u003cb class=\"key\">절대적인 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 강조하는 문장이에요. must not은 강한 금지를 나타내는 \u003cb class=\"key\">조동사\u003c/b> 표현이랍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 부정 (금지)\u003c/span> : 주어 + must not + 동사원형 : \"~해서는 안 된다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"You must not, 절대 ~하면 안 된다. leave it, 그것을 벗어나면. at any time, 어떤 경우에도. 이 문장 전체를 해석하면, 어떤 경우에도 저 길을 절대 벗어나면 안 됩니다.","hl":"m"},{"n":29,"text":"과거 세계에서 지켜야 할 엄격한 규칙을 강조하는 문장이에요. 길을 벗어나지 말라는 당부를 담고 있죠.","hl":"mn"},{"n":30,"text":"첫 번째 어법 포인트는 조동사 must와 not이 합쳐진 금지 표현이에요. must not은 ~해서는 안 된다는 뜻으로 아주 강한 금지를 나타내니까 동사원형과 함께 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지 마라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만지지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">touch\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도\u003c/span>\u003cspan class=\"en\">anything.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아무것도 만지지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 작은 접촉이 미래에 엄청난 변화를 가져올 수 있으므로 모든 사물과의 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">접촉\u003c/b>을 금지하는 경고예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문의 부정\u003c/span> : Do not + 동사원형 : \"~하지 마라\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Do not, 하지 마라. touch, 만지지. anything, 아무것도. 이 문장 전체를 해석하면, 아무것도 만지지 마세요.","hl":"m"},{"n":32,"text":"시간 여행에서 가장 중요한 수칙 중 하나인 무단 접촉 금지를 경고하는 의미예요.","hl":"mn"},{"n":33,"text":"첫 번째 어법 포인트는 부정명령문이에요. 동사원형 앞에 Do not을 붙여서 상대방에게 ~하지 말라고 강하게 지시하는 문장을 만들 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수도 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽일\u003c/span>\u003cspan class=\"en\">kill\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를\u003c/span>\u003cspan class=\"en\">something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실수로\u003c/span>\u003cspan class=\"en\">by accident.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 실수로 무언가를 죽일 수도 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 경고를 어겼을 때 생길 수 있는 \u003cb class=\"key\">잠재적인 \u003c/b>\u003cb class=\"key\">위험\u003c/b>과 그 원인을 설명해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 추측\u003c/span> : 주어 + 조동사(might) + 동사원형 : \"~할지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"You might, 수도 있다. kill, 죽일. something, 무언가를. by accident, 실수로. 이 문장 전체를 해석하면, 여러분이 실수로 무언가를 죽일 수도 있습니다.","hl":"m"},{"n":35,"text":"사소한 행동이 생태계에 미칠 수 있는 위험성을 경고하는 대사랍니다.","hl":"mn"},{"n":36,"text":"첫 번째 어법 포인트는 조동사 might예요. might는 ~일지도 모른다는 약한 추측을 나타내며, 뒤에는 반드시 동사원형이 와야 한다는 점을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이곳에서의 작은 변화가\u003c/span>\u003cspan class=\"en\">A little change here\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초래할 수 있다\u003c/span>\u003cspan class=\"en\">can cause\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상할 수 없는 일을\u003c/span>\u003cspan class=\"en\">something \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">unthinkable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래에\u003c/span>\u003cspan class=\"en\">in the future.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이곳에서의 작은 변화가 미래에 상상할 수 없는 일을 초래할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 사소한 행동이 미래에 엄청난 변화를 일으킬 수 있다는 \u003cb class=\"key\">나비효과\u003c/b>를 경고하는 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">주제문\u003c/b>이에요. 시간 여행에서 절대 사소한 것도 가볍게 여겨서는 안 된다는 메시지를 전달하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : something [불특정 대명사] + unthinkable [형용사] : \"상상할 수 없는\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"A little change here, 이곳에서의 작은 변화가. can cause, 초래할 수 있다. something unthinkable, 상상할 수 없는 일을. in the future, 미래에. 이 문장 전체를 해석하면, 이곳에서의 작은 변화가 미래에 상상할 수 없는 일을 초래할 수 있다.","hl":"m"},{"n":38,"text":"이번 문장은 과거의 사소한 행동이 미래에 엄청난 변화를 일으킬 수 있다는 나비효과를 경고하는 중요한 주제문이에요. 시간 여행에서 절대 사소한 것도 가볍게 여겨서는 안 된다는 메시지를 전달하고 있죠.","hl":"mn"},{"n":39,"text":"첫 번째 어법 포인트는 형용사의 후치 수식이에요. -thing으로 끝나는 불특정 대명사는 형용사가 뒤에서 앞으로 수식해요. 따라서 unthinkable something이 아니라 something unthinkable로 써야 하니 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>타임머신을 타고 \u003cb class=\"key\">6천만 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">정글\u003c/b>에 도착한 여행자들\u003c/li>\u003cli>Eckels는 자리에 앉아 \u003cb class=\"key\">발밑의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 느낌\u003c/li>\u003cli>Travis는 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">벗어나지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>고 경고함\u003c/li>\u003cli>작은 변화가 \u003cb class=\"key\">미래에 \u003c/b>\u003cb class=\"key\">상상할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 초래할 수 있음\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Travelers in a time machine are strictly warned not to leave the path or touch anything in the prehistoric jungle.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">타임머신을 타고 \u003cb class=\"key\">6천만 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">정글\u003c/b>에 도착한 여행자들은 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">벗어나지 \u003c/b>\u003cb class=\"key\">말고\u003c/b> 아무것도 만지지 말라는 엄격한 주의를 받는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 배운 내용은 타임머신 속에서 과거 정글의 규칙을 엄격하게 당부하는 장면이었어요. 시간 순서에 따라 인물의 행동과 대사가 전개되는 구조를 잘 기억해 두세요. 수고 많았어요 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
