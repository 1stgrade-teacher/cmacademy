<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(윤) 8과 본문4 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(윤) 8과 본문4","audioDir":"2dongyoon8-4_audio","preview":false,"count":80,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The T. rex Encounter in Time\u003c/h1>\u003ch2>시간 속의 티라노사우루스 조우\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>타임머신을 타고 과거로 간 \u003cb class=\"key\">Eckels\u003c/b>는 거대한 \u003cb class=\"key\">T. \u003c/b>\u003cb class=\"key\">rex\u003c/b>를 마주하고 극심한 공포에 빠져 \u003cb class=\"key\">길\u003c/b>을 벗어나는 실수를 저지르고 만다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Eckels panics upon encountering a T. rex and makes a fatal mistake by leaving the path.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 영어 독해 시간을 함께 해볼게요. 이번 지문은 타임머신을 타고 과거로 간 인물들이 공룡을 만나 벌어지는 긴장감 넘치는 이야기예요. 지문의 전체적인 요약과 요지를 함께 살펴보면서 내용 파악을 시작해볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">시간 여행을 다루는 SF 소설에서는 과거의 아주 작은 변화나 사소한 실수가 미래 전체를 바꾸어 놓을 수 있다는 \u003cb class=\"key\">나비 \u003c/b>\u003cb class=\"key\">효과 \u003c/b>\u003cb class=\"key\">(Butterfly \u003c/b>\u003cb class=\"key\">Effect)\u003c/b> 개념이 자주 등장합니다. 이는 마치 롤러코스터를 타기 전 안전바를 꼭 잡아야 하는 것처럼 \u003cb class=\"key\">엄격한 \u003c/b>\u003cb class=\"key\">규칙 \u003c/b>\u003cb class=\"key\">(Strict \u003c/b>\u003cb class=\"key\">rules)\u003c/b>을 반드시 지켜야 하는 이유를 설명해 줍니다. 이번 지문에서도 공룡을 보러 간 여행객들이 반드시 지켜야 할 \u003cb class=\"key\">안전선 \u003c/b>\u003cb class=\"key\">(Safety \u003c/b>\u003cb class=\"key\">path)\u003c/b>을 이탈하면서 엄청난 위기를 맞이하게 됩니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 지문 독해에 앞서 배경지식을 먼저 알아볼게요. 시간 여행을 다루는 SF 소설에서는 과거의 작은 변화가 미래를 바꾼다는 나비 효과 개념이 자주 등장해요. 철저한 규칙 속에서 안전선을 지켜야 하는 이유가 바로 여기에 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>티라노사우루스의 등장\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Travis는 Eckels에게 저 멀리 나타나는 \u003cb class=\"key\">T. \u003c/b>\u003cb class=\"key\">rex\u003c/b>를 조용히 보라고 속삭입니다. 백 미터 떨어진 곳에서 엄청난 크기의 공룡이 서서히 모습을 드러냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Eckels의 극심한 공포\u003csmall>전개 · 문장 4–12\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">Eckels\u003c/b>는 공룡의 엄청난 크기에 압도되어 숨도 제대로 쉬지 못할 정도로 극심한 공포를 느낍니다. Travis는 공룡에게 들키지 않도록 \u003cb class=\"key\">조용히 \u003c/b>\u003cb class=\"key\">하라\u003c/b>고 화를 내며 경고합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>패닉과 실수\u003csmall>위기 · 문장 13–20\u003c/small>\u003c/h4>\u003cp>패닉에 빠진 Eckels는 당장 여기서 나가게 해달라고 애원하며 타임머신으로 뛰어가기 시작합니다. 그는 너무 겁에 질린 나머지 실수로 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">벗어나고\u003c/b> 맙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>추격과 위기\u003csmall>결론 · 문장 21–25\u003c/small>\u003c/h4>\u003cp>Travis의 외침을 들은 T. rex가 고개를 돌려 여행자들을 바라보고는 큰 포효와 함께 달려오기 시작합니다. 결국 Travis는 모두에게 빨리 \u003cb class=\"key\">뛰라고 \u003c/b>\u003cb class=\"key\">외칩니다\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 부분부터 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 Travis가 속삭이며 티라노사우루스의 등장을 알리는 장면이에요. 백 미터 떨어진 곳에서 거대한 공룡이 서서히 나타나는 모습이 묘사되고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Eckels가 공룡의 크기에 압도되어 극심한 공포를 느끼는 장면이에요. 숨도 쉬지 못하는 Eckels에게 Travis는 공룡에게 들키지 않게 조용히 하라고 화를 내며 경고해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 패닉에 빠진 Eckels가 도망치다 실수를 저지르는 위기 상황이 펼쳐져요. 겁에 질린 Eckels가 타임머신으로 뛰어가다가 실수로 길을 벗어나고 말아요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 T. rex가 소리를 듣고 여행자들을 향해 달려오는 결론 부분이에요. 잠시 정적이 흐른 뒤 거대한 포효와 함께 달려오는 공룡을 향해 Travis가 모두에게 뛰라고 외치고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 과거 시간 여행 속에서 공룡을 마주한 인물들이 겪는 상황을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서대로\u003c/b> 생생하게 전개하고 있습니다. 공룡의 등장부터 Eckels의 공포, 그리고 길을 이탈하는 실수를 거쳐 위기로 치닫는 과정이 \u003cb class=\"key\">순차적\u003c/b>으로 서술되어 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (23)\u003c/b>\u003cspan>시간 흐름\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">T. rex\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a huge thing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the T. rex\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이번 글은 시간 여행 속에서 벌어지는 사건들을 시간 순서대로 전개하고 있어요. 인물들의 행동과 상황의 변화가 순차적으로 이어지면서 긴장감을 극대화하는 전개방식을 취하고 있답니다.","hl":"ty"},{"n":9,"text":"문장 속에서 사건의 흐름을 이어주는 다양한 신호어들을 찾아볼 수 있어요. 특히 갑자기 일어난 일을 보여주는 표현들이 긴장감을 더욱 높여주는 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>whisper\u003c/b>\u003cem>동사\u003c/em>\u003cspan>속삭이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>scared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무서워하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>quiet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>angrily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>화를 내며\u003c/span>\u003c/div>\u003cdiv>\u003cb>breathe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨을 쉬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>panic\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겁먹다, 당황하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아서다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrified\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>겁에 질린\u003c/span>\u003c/div>\u003cdiv>\u003cb>by accident\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실수로, 우연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>traveler\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행자\u003c/span>\u003c/div>\u003cdiv>\u003cb>silence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정적, 침묵\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>roar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포효, 으르렁거림\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에 나온 중요 어휘들을 짚어볼게요. 속삭이다라는 뜻의 whisper와 거대한이라는 뜻의 huge, 그리고 실수로라는 뜻의숙어 by accident는 시험에 자주 나오는 표현이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">giant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scared\u003c/b>\u003cspan class=\"m\">무서워하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">frightened\u003c/span>\u003cspan class=\"s\">terrified\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quiet\u003c/b>\u003cspan class=\"m\">조용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">silent\u003c/span>\u003cspan class=\"s\">still\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noisy\u003c/span>\u003cspan class=\"a\">loud\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">panic\u003c/b>\u003cspan class=\"m\">겁먹다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">freak out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suddenly\u003c/b>\u003cspan class=\"m\">갑자기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all of a sudden\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 함께 정리해 볼게요. huge의 동의어로는 enormous나 giant가 있고 반의어로는 tiny나 small이 있어요. 그리고 scared의 동의어인 terrified나 frightened도 함께 외워두면 아주 좋답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마 후,\u003c/span>\u003cspan class=\"en\">After some time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Travis가 속삭였다.\u003c/span>\u003cspan class=\"en\">Travis whispered,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저기 봐요.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look\u003c/span> over there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">얼마 후, Travis가 속삭였다. “저기 봐요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 타임머신에서 내려 \u003cb class=\"key\">시간\u003c/b>이 흐른 뒤, Travis가 \u003cb class=\"key\">Eckels\u003c/b>에게 주의를 기울이며 경고를 시작하는 장면이에요. \u003cb class=\"key\">whispered\u003c/b>라는 표현을 통해 긴장감 넘치는 분위기를 조성하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan lass=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : start + [to부정사] : \"~하기 시작하다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Eckels turned around, Eckels는 돌아서서. and, 그리고. started to run, 뛰기 시작했다. 이 문장 전체를 해석하면, Eckels는 돌아서서 뛰기 시작했다.","hl":"m"},{"n":55,"text":"Travis의 말을 들은 Eckels가 두려움을 이기지 못하고 결국 도망치는 행동을 보여주는 장면이에요. 이 행동이 나중에 아주 위험한 실수를 불러일으키게 되죠.","hl":"mn"},{"n":56,"text":"이 문장의 어법 포인트는 to부정사를 목적어로 취하는 동사예요. start는 목적어로 to부정사와 동명사 모두 쓸 수 있는 동사라서, 여기서는 started 뒤에 to run이 왔답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 너무 겁에 질려\u003c/span>\u003cspan class=\"en\">He was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">terrified \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을 벗어나고 말았다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">left\u003c/span> the path\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실수로\u003c/span>\u003cspan class=\"en\">by accident.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 너무 겁에 질려 실수로 길을 벗어나고 말았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 티라노사우루스의 압도적인 크기와 공포에 압도된 \u003cb class=\"key\">Eckels\u003c/b>가 정해진 길을 이탈하는 결정적인 실수를 저지르는 장면이에요. 타임 여행에서 길을 벗어나지 말아야 한다는 규칙을 깨뜨리며 긴장감이 최고조에 달해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소대 구문\u003c/span> : so + [형용사/부사] + that + 주어 + 동사 : \"너무 ~해서 …하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 동사\u003c/span> : 주어 + [과거동사] : \"떠났다, 벗어났다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"He was so terrified, 그는 너무 겁에 질려. that, 결국. he left the path, 길을 벗어나고 말았다. by accident, 실수로. 이 문장 전체를 해석하면, 그는 너무 겁에 질려 실수로 길을 벗어나고 말았다.","hl":"m"},{"n":58,"text":"공포에 압도된 Eckels가 정해진 길을 이탈하는 결정적인 실수를 저지르는 장면이에요. 타임 여행 규칙을 깨뜨리면서 이야기의 긴장감이 최고조로 올라가게 되죠.","hl":"mn"},{"n":59,"text":"이 문장의 핵심 어법 포인트는 소대 구문이에요. so와 that을 함께 써서 너무 겁에 질린 원인과 결국 길을 벗어났다는 결과를 자연스럽게 연결해 주고 있어요. 특히 서술형으로 아주 자주 출제되는 구문이니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Eckels!”\u003c/span>\u003cspan class=\"en\">&quot;Eckels!&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Travis가 외쳤다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shouted \u003c/span>\u003cspan class=\"tgt\">Travis\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“Eckels!” Travis가 외쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공룡이 있는 위험한 장소에서 \u003cb class=\"key\">Eckels\u003c/b>가 길을 벗어나자, Travis가 다급하게 이름을 부르며 \u003cb class=\"key\">경고\u003c/b>하는 장면입니다. 주어와 동사가 도치된 문장 구조를 통해 긴박한 상황을 생생하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어·동사 도치\u003c/span> : [동사 (shouted)] + [주어 (Travis)] : \"Travis가 외쳤다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"\"Eckels!\", “Eckels!”. shouted Travis, Travis가 외쳤다.. 이 문장 전체를 해석하면, “Eckels!” Travis가 외쳤다.","hl":"m"},{"n":61,"text":"이 문장은 Eckels가 길을 벗어나자 Travis가 다급하게 이름을 부르며 경고하는 장면이에요. 긴박한 상황을 아주 생생하게 전달하고 있죠.","hl":"mn"},{"n":62,"text":"첫 번째 어법 포인트는 주어와 동사의 도치예요. 인용구 뒤에서 shouted라는 동사가 주어인 Travis보다 앞으로 나와서 현장감을 더해주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“벗어나지 말아요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을!”\u003c/span>\u003cspan class=\"en\">the path!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“길을 벗어나지 말아요!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간 여행에서 가장 중요한 규칙인 \u003cb class=\"key\">길\u003c/b>을 이탈하지 말라는 Travis의 강력한 \u003cb class=\"key\">명령문\u003c/b>입니다. 이 실수가 앞으로 일어날 엄청난 사건의 도화선이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : [Don't] + [동사원형 (leave)] : \"~하지 말아라\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"\"Don't leave, “벗어나지 말아요. the path!\", 길을!”. 이 문장 전체를 해석하면, “길을 벗어나지 말아요!”","hl":"m"},{"n":64,"text":"이 문장은 시간 여행에서 가장 중요한 규칙인 길을 이탈하지 말라는 Travis의 강력한 명령문이에요. 이 실수가 나중에 엄청난 결과를 불러오게 되죠.","hl":"mn"},{"n":65,"text":"첫 번째 어법 포인트는 부정 명령문이에요. 상대방에게 금지하는 내용을 전달하려고 Don't 뒤에 동사원형인 leave를 사용했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">티라노사우루스가\u003c/span>\u003cspan class=\"en\">The T. rex\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Travis의 소리를 듣고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003cspan class=\"tgt\">Travis \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고개를 돌렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">head\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그와 다른 여행자들을 향해\u003c/span>\u003cspan class=\"en\">toward him and the other travelers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">티라노사우루스가 Travis의 소리를 듣고 그와 다른 여행자들을 향해 고개를 돌렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Travis의 큰 소리 때문에 티라노사우루스가 일행을 인식하고 \u003cb class=\"key\">위협적\u003c/b>인 행동을 시작하는 긴장감 넘치는 상황입니다. 하나의 주어에 두 개의 동사가 \u003cb class=\"key\">병렬구조\u003c/b>로 연결되어 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 병렬구조\u003c/span> : [주어] + [heard (과거동사)] + ~ + [and] + [turned (과거동사)] : \"들었고 그리고 고개를 돌렸다\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"The T. rex, 티라노사우루스가. heard Travis, Travis의 소리를 듣고. and, 그리고. turned its head, 고개를 돌렸다. toward him and the other travelers, 그와 다른 여행자들을 향해. 이 문장 전체를 해석하면, 티라노사우루스가 Travis의 소리를 듣고 그와 다른 여행자들을 향해 고개를 돌렸다.","hl":"m"},{"n":67,"text":"이 문장은 Travis의 소리 때문에 티라노사우루스가 일행을 눈치채고 위협적인 행동을 시작하는 아주 긴장감 넘치는 상황을 보여줘요.","hl":"mn"},{"n":68,"text":"첫 번째 어법 포인트는 동사의 병렬구조예요. 주어인 The T. rex가 한 두 가지 행동인 heard와 turned가 등위접속사 and로 자연스럽게 연결되어 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">There was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 정적이\u003c/span>\u003cspan class=\"en\">a moment of silence.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잠시 정적이 흐뤘다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 티라노사우루스가 \u003cb class=\"key\">소리\u003c/b>를 듣고 고개를 돌린 직후, 긴장감이 최고조에 달하는 \u003cb class=\"key\">순간\u003c/b>을 묘사하여 극적인 분위기를 고조시키는 역할을 해요.\u003c/div>","segs":[{"n":69,"text":"There was, 있었다. a moment of silence, 잠시 정적이. 이 문장 전체를 해석하면, 잠시 정적이 흐뤘다.","hl":"m"},{"n":70,"text":"이 문장은 티라노사우루스가 소리를 듣고 고개를 돌린 직후에 갑자기 찾아온 긴장되는 순간을 나타내고 있어요. 바로 직전의 긴박한 상황에서 잠시 숨을 죽이는 정적의 분위기를 보여주는 거죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 시작했다\u003c/span>\u003cspan class=\"en\">it suddenly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 향해 달려오기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run\u003c/span> toward them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 포효와 함께\u003c/span>\u003cspan class=\"en\">with a loud roar.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 갑자기 티라노사우루스가 큰 포효와 함께 그들을 향해 달려오기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잠깐의 정적 뒤에 티라노사우루스가 \u003cb class=\"key\">포효\u003c/b>하며 달려오는 장면으로, \u003cb class=\"key\">위기 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이 절정으로 치닫는 결정적인 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : start [타동사] + [to run (to부정사구/목적어)] : \"달려오기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":71,"text":"Then, 그리고. it suddenly started, 갑자기 시작했다. to run toward them, 그들을 향해 달려오기. with a loud roar, 큰 포효와 함께. 이 문장 전체를 해석하면, 그리고 갑자기 티라노사우루스가 큰 포효와 함께 그들을 향해 달려오기 시작했다.","hl":"m"},{"n":72,"text":"앞서 흐르던 짧은 정적이 깨지고 티라노사우루스가 엄청난 소리를 내며 달려드는 아주 급박한 상황을 생생하게 보여주고 있어요.","hl":"mn"},{"n":73,"text":"첫 번째 어법 포인트는 동사 start예요. start는 뒤에 to부정사인 to run을 목적어로 쓸 수도 있고 동명사인 running을 쓸 수도 있으니까 두 가지 형태 모두 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 24 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 뛰어요! 뛰어!\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Run\u003c/span>, everybody!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“모두 뛰어요! 뛰어!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공룡이 달려오는 절체절명의 순간에 Travis가 다급하게 \u003cb class=\"key\">명령\u003c/b>하여 도망치도록 외치는 대사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 [Run] + [목적어/부사구 생략] : \"뛰어라\"\u003c/div>\u003c/div>","segs":[{"n":74,"text":"\"Run, everybody!, 모두 뛰어요!. Run!\", 뛰어!. 이 문장 전체를 해석하면, “모두 뛰어요! 뛰어!”","hl":"m"},{"n":75,"text":"티라노사우루스가 다가오는 위험한 상황에서 트래비스가 당장 도망치라고 사람들에게 급하게 소리치는 장면이에요.","hl":"mn"},{"n":76,"text":"여기서는 주어 없이 동사원형으로 바로 시작하는 명령문이 쓰였어요. 상대방에게 지금 당장 빨리 행동하라고 지시할 때 쓰는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 25 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 뛰어요! 뛰어! Travis가 외쳤다.\u003c/span>\u003cspan class=\"en\">Run!&quot; \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shouted \u003c/span>\u003cspan class=\"tgt\">Travis\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“모두 뛰어요! 뛰어!” Travis가 외쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">Travis\u003c/b>의 외침을 통해 공포 분위기가 극에 달했음을 보여줍니다. 긴박한 상황에서 모두가 달아나야 하는 생명의 위협을 강조하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 도치\u003c/span> : [동사 (shouted)] + [주어 (Travis)] : \"Travis가 외쳤다\"\u003c/div>\u003c/div>","segs":[{"n":77,"text":"\"Run, everybody!, 모두 뛰어요!. Run!\", 뛰어!. shouted Travis, Travis가 외쳤다.. 이 문장 전체를 해석하면, “모두 뛰어요! 뛰어!” Travis가 외쳤다.","hl":"m"},{"n":78,"text":"이 문장은 Travis가 공포에 질린 여행자들에게 다급하게 도망치라고 소리치는 장면이에요. 티라노사우루스가 다가오는 절체절명의 위기 속에서 극도의 긴장감을 전달하고 있어요.","hl":"mn"},{"n":79,"text":"어법 포인트를 살펴볼까요. 마지막 부분의 shouted Travis를 보면 동사인 shouted가 주어인 Travis보다 앞에 나와 있죠. 이렇게 직접화법 뒤에서 주어와 동사가 바뀌는 주어 동사 도치 현상이 쓰여서 생생한 현장감을 더해주고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Travis와 \u003cb class=\"key\">Eckels\u003c/b>는 타임머신을 타고 과거로 가서 거대한 \u003cb class=\"key\">T. \u003c/b>\u003cb class=\"key\">rex\u003c/b>를 마주합니다.\u003c/li>\u003cli>Eckels는 엄청난 공포에 휩싸여 숨을 쉬지 못하고 \u003cb class=\"key\">패닉 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 빠집니다.\u003c/li>\u003cli>그는 공포를 이기지 못하고 타임머신으로 도망치다가 실수로 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">길\u003c/b>을 벗어납니다.\u003c/li>\u003cli>결국 T. rex는 소리를 듣고 이들을 향해 \u003cb class=\"key\">포효하며\u003c/b> 달려오기 시작합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Eckels panics upon encountering a T. rex and makes a fatal mistake by leaving the path.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">타임머신을 타고 과거로 간 \u003cb class=\"key\">Eckels\u003c/b>는 거대한 \u003cb class=\"key\">T. \u003c/b>\u003cb class=\"key\">rex\u003c/b>를 마주하고 극심한 공포에 빠져 \u003cb class=\"key\">길\u003c/b>을 벗어나는 실수를 저지르고 만다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":80,"text":"오늘도 수고 많았어요. 긴장감 넘치는 상황 속에서 인물들이 겪는 행동 변화와 흐름을 잘 복습해 보세요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
