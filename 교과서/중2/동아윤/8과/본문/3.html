<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(윤) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(윤) 8과 본문3","audioDir":"3_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Stepping Out of the Time Machine: A Warning and a Fool\u003c/h1>\u003ch2>타임머신에서 내리다: 경고와 바보\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 일행이 타임머신에서 내려 \u003cb class=\"key\">안개\u003c/b> 낀 고요한 정글에 도착한 뒤, Travis는 배고픈 공룡을 경계하며 침착하라고 \u003cb class=\"key\">경고\u003c/b>하지만, Eckels는 자신은 \u003cb class=\"key\">바보\u003c/b>가 아니라며 걱정 말라고 답하고 모두 길을 걷기 시작한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Travis warns Eckels to stay calm and not do anything foolish in the quiet, foggy jungle, but Eckels insists that he is not a fool.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 중학교 이 학년 동아 윤정미 교과서 여덟 번째 과 본문 세 번째예요. 타임머신을 타고 공룡 사냥을 떠난 사람들의 이야기이고요, 짧은 장면이지만 인물들의 태도 차이가 아주 선명하게 드러나요. 내용을 정리하면, 일행이 타임머신에서 내려 안개 낀 고요한 정글에 도착한 뒤 Travis는 배고픈 공룡을 경계하며 침착하라고 경고하고, Eckels는 자신은 바보가 아니라며 걱정 말라고 답한 다음 모두 길을 걷기 시작한다는 거예요. 핵심 요지는 위험한 곳에서 조심하라는 경고와 그것을 가볍게 넘기는 자신감이 대비된다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 미국 작가 \u003cb class=\"key\">레이 \u003c/b>\u003cb class=\"key\">브래드버리\u003c/b>의 단편 소설 '천둥소리(A Sound of Thunder)'를 각색한 장면이에요. 배경은 \u003cb class=\"key\">타임머신\u003c/b>(time machine)을 타고 공룡 사냥을 떠난 선사 시대의 정글입니다. 이 작품의 세계에서는 미래의 사냥 회사가 시간여행 사파리(safari)를 상품으로 팔아요. 이 소설의 핵심 개념은 \u003cb class=\"key\">나비 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(the butterfly effect)로, 작은 행동 하나가 미래 전체를 바꿀 수 있다는 뜻이죠. 그래서 안내자 Travis는 규칙을 지키라고 거듭 경고합니다. 일상 비유로 말하면, 시험 전날 친구가 '답을 함부로 고치지 마'라고 조언하는데도 자신만만한 친구가 '걱정 마, 나 바보 아니야'라고 답하는 상황과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 이 지문은 미국 작가 레이 브래드버리의 단편 소설 천둥소리, A Sound of Thunder를 각색한 장면이에요. 배경은 타임머신, 즉 time machine을 타고 공룡 사냥을 하러 간 선사 시대의 정글이죠. 이 작품의 세계에서는 미래의 사냥 회사가 시간여행 사파리, safari를 상품으로 팔아요. 그리고 이 소설의 핵심 개념이 바로 나비 효과, the butterfly effect예요. 작은 행동 하나가 미래 전체를 바꿀 수 있다는 뜻이죠. 그래서 안내자 Travis는 규칙을 지키라고 거듭 경고하는 거예요. 일상 비유로 말하면, 시험 전날 친구가 답을 함부로 고치지 말라고 조언하는데도 자신만만한 친구가 걱정 말라면서 자신은 바보가 아니라고 답하는 상황과 비슷해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정글에 도착\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>모두가 \u003cb class=\"key\">타임머신\u003c/b>에서 천천히 내리고, 정글은 \u003cb class=\"key\">안개\u003c/b>로 뒤덮여 있으며 그곳은 무척 고요해요. 장소와 분위기를 먼저 보여 주는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Eckels의 흥분\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>Eckels가 'I'm so excited'라고 말하며 \u003cb class=\"key\">흥분\u003c/b>을 드러내요. 고요한 정글의 분위기와 대비되는 \u003cb class=\"key\">감정\u003c/b> 표현입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Travis의 경고\u003csmall>전환 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>Travis는 몇몇 공룡들이 배가 고플 수도 있다며 \u003cb class=\"key\">조심\u003c/b>하라고 말해요. 이어서 침착하라고 당부하고, 어리석은 어떤 행동도 하지 않기를 바란다고 \u003cb class=\"key\">경고\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>Eckels의 대답\u003csmall>반응 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>Eckels는 걱정하지 말라고 \u003cb class=\"key\">응수\u003c/b>하면서 자신은 \u003cb class=\"key\">바보\u003c/b>가 아니라고 말해요. Travis의 경고를 가볍게 넘기는 \u003cb class=\"key\">자신감\u003c/b>이 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>길을 걷기 시작\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>그들은 모두 \u003cb class=\"key\">길\u003c/b>을 걷기 시작해요. 경고와 대답이 끝나고 실제 \u003cb class=\"key\">여정\u003c/b>이 시작되는 마무리 단계입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문을 다섯 단계로 나눠서 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 정글에 도착하는 장면이에요. 모두가 타임머신에서 천천히 내리고, 정글은 안개로 뒤덮여 있고, 그곳은 무척 고요해요. 사건이 벌어지기 전에 장소와 분위기를 먼저 깔아 주는 배경 제시 부분이죠. 이 고요함이 오히려 긴장감을 만들어 준다는 점도 눈여겨보세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 Eckels가 I'm so excited라고 말해요. 정글의 고요함과 아주 대비되는 흥분이죠. 이 한마디가 뒤에서 벌어질 경고와 대답의 출발점이 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 Travis의 경고예요. Travis는 몇몇 공룡들이 배가 고플 수도 있다며 조심하라고 하고, 이어서 침착하라고 당부해요. 그리고 어리석은 어떤 행동도 하지 않기를 바란다고 말하죠. 안내자로서 가장 중요한 규칙을 전달하는 부분이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 Eckels의 대답이에요. Eckels는 걱정하지 말라고 응수하면서 자신은 바보가 아니라고 말해요. Travis의 경고를 가볍게 넘기는 자신감이 그대로 드러나죠. 여기서 두 사람의 태도가 뚜렷하게 갈려요.","hl":"f3"},{"n":8,"text":"마지막 단계에서 그들은 모두 길을 걷기 시작해요. 경고와 대답이 끝나고 실제 여정이 시작되는 대목이에요. 이제부터 정글 안에서 무슨 일이 벌어질지 궁금하게 만드는 마무리죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 타임머신에서 내리는 장면에서 시작해 길을 걷는 장면으로 끝나는 \u003cb class=\"key\">시간순\u003c/b> 서사예요. 사건이 일어난 순서대로 문장이 이어지죠. 다만 글의 중심이 되는 말은 Travis의 'I don't want you to do anything \u003cb class=\"key\">foolish\u003c/b>'라는 경고로, 이것이 뒤에 오는 Eckels의 대답과 \u003cb class=\"key\">대비\u003c/b>를 만들며 주제를 완성해요. 그래서 중심 내용이 뒤에서 드러나는 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Slowly (1)\u003c/b>\u003cspan>장면 시작\u003c/span>\u003cb>I'm so excited (4)\u003c/b>\u003cspan>감정 표현\u003c/span>\u003cb>Be careful (5)\u003c/b>\u003cspan>경고\u003c/span>\u003cb>Just stay calm (7)\u003c/b>\u003cspan>당부\u003c/span>\u003cb>began to (11)\u003c/b>\u003cspan>행동 시작\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Be careful\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Just stay calm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Don't worry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I'm not a fool\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Travis의 경고\u003c/th>\u003cth>Eckels의 자신감\u003c/th>\u003c/tr>\u003ctr>\u003ctd>배고픈 공룡을 경계함\u003c/td>\u003ctd>자신은 바보가 아니라고 장담함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>침착하게 행동하라고 당부함\u003c/td>\u003ctd>걱정하지 말라고 응수함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순이에요. 타임머신에서 내리는 장면에서 시작해서 길을 걷는 장면으로 끝나니까, 사건이 일어난 순서대로 문장이 이어지죠. 그런데 글의 중심이 되는 말은 Travis의 경고, I don't want you to do anything foolish예요. 중심 내용이 뒤에서 드러나고 앞의 경고와 뒤의 대답이 대비를 이루니까, 구조로 보면 미괄식이라고 할 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 Slowly는 장면이 시작된다는 신호이고, I'm so excited는 Eckels의 감정을 보여 주는 표현이에요. 다섯 번째 문장의 Be careful과 일곱 번째 문장의 Just stay calm은 경고와 당부를 알려 주는 신호어죠. 그리고 마지막 문장의 began to는 행동이 실제로 시작된다는 신호예요. 또 Be careful, Just stay calm, Don't worry, I'm not a fool처럼 같은 개념을 바꿔 말하는 표현들이 이어지면서 경고와 응수가 짝을 이룬다는 것도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>천천히\u003c/span>\u003c/div>\u003cdiv>\u003cb>get out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 내리다, 나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 사람, 모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>time machine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>타임머신, 시간 여행 기계\u003c/span>\u003c/div>\u003cdiv>\u003cb>jungle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정글, 밀림\u003c/span>\u003c/div>\u003cdiv>\u003cb>be covered in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 뒤덮여 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fog\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안개\u003c/span>\u003c/div>\u003cdiv>\u003cb>very\u003c/b>\u003cem>부사\u003c/em>\u003cspan>매우, 무척\u003c/span>\u003c/div>\u003cdiv>\u003cb>quiet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고요한, 조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>excited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신이 난, 흥분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>say\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>so\u003c/b>\u003cem>부사\u003c/em>\u003cspan>매우, 정말\u003c/span>\u003c/div>\u003cdiv>\u003cb>careful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조심하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>some of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~중 몇몇의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dinosaur\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공룡\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(~한 상태로) 있다, 머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>침착한, 차분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>want\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다, 바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>어떤 것(도)\u003c/span>\u003c/div>\u003cdiv>\u003cb>foolish\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어리석은, 바보 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fool\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바보\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걷다\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길, 오솔길\u003c/span>\u003c/div>\u003cdiv>\u003cb>all\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모두, 전부\u003c/span>\u003c/div>\u003cdiv>\u003cb>do\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하다, 행동하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚어 볼게요. be covered in은 로 뒤덮여 있다는 뜻이고, foolish는 어리석은, fool은 바보라는 뜻이에요. stay calm은 침착함을 유지하다는 표현이고, get out of는 에서 내리다는 뜻이죠. path는 길이나 오솔길을 가리키는 단어예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">quiet\u003c/b>\u003cspan class=\"m\">고요한, 조용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">silent\u003c/span>\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">still\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noisy\u003c/span>\u003cspan class=\"a\">loud\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">excited\u003c/b>\u003cspan class=\"m\">신이 난, 흥분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilled\u003c/span>\u003cspan class=\"s\">eager\u003c/span>\u003cspan class=\"s\">enthusiastic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bored\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">careful\u003c/b>\u003cspan class=\"m\">조심하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautious\u003c/span>\u003cspan class=\"s\">watchful\u003c/span>\u003cspan class=\"s\">attentive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">careless\u003c/span>\u003cspan class=\"a\">reckless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calm\u003c/b>\u003cspan class=\"m\">침착한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">relaxed\u003c/span>\u003cspan class=\"s\">composed\u003c/span>\u003cspan class=\"s\">peaceful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nervous\u003c/span>\u003cspan class=\"a\">anxious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">foolish\u003c/b>\u003cspan class=\"m\">어리석은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stupid\u003c/span>\u003cspan class=\"s\">silly\u003c/span>\u003cspan class=\"s\">unwise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wise\u003c/span>\u003cspan class=\"a\">smart\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"s\">famished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worry\u003c/b>\u003cspan class=\"m\">걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concern\u003c/span>\u003cspan class=\"s\">fear\u003c/span>\u003cspan class=\"s\">fret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003cspan class=\"a\">reassure\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 어휘를 동의어와 반의어로 정리해 볼게요. quiet는 조용한이라는 뜻이고 silent, calm, still이 동의어이며 noisy, loud가 반의어예요. excited는 신이 난이라는 뜻으로 thrilled, eager가 동의어이고 bored가 반의어죠. careful은 조심하는이라는 뜻이고 cautious, watchful이 동의어, careless, reckless가 반의어예요. calm은 침착한이라는 뜻으로 composed, relaxed가 동의어이고 nervous, anxious가 반의어예요. foolish는 어리석은이라는 뜻이고 stupid, unwise가 동의어, wise, smart가 반의어예요. 그리고 worry는 걱정하다라는 뜻으로 concern, fret이 동의어이고 reassure, relax가 반의어랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Slowly,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가 내렸어요\u003c/span>\u003cspan class=\"en\">everyone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타임머신에서\u003c/span>\u003cspan class=\"en\">the time machine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두 타임머신에서 천천히 내렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 타임머신 여행이 끝나고 모두가 밖으로 나오는 장면을 여는 문장이에요. 부사 \u003cb class=\"key\">Slowly\u003c/b>가 문장 맨 앞에 놓여 장면이 아주 느리게 시작되는 분위기를 만들어 주고, \u003cb class=\"key\">get \u003c/b>\u003cb class=\"key\">out \u003c/b>\u003cb class=\"key\">of\u003c/b>는 '~에서 나오다·내리다'라는 뜻의 구동사예요. 다음 문장부터 정글의 모습이 묘사되므로 이 문장은 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 알리는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 문두 배치(강조)\u003c/span> : [부사] + [주어] + [동사] ... : \"천천히,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(이어동사) get out of\u003c/span> : get out of + [명사] (~에서 나가다·내리다) : \"~에서 내렸다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Slowly, 천천히. everyone got out of, 모두가 내렸어요. the time machine, 타임머신에서. 이 문장 전체를 해석하면, 모두 타임머신에서 천천히 내렸다.","hl":"m"},{"n":14,"text":"이 문장은 타임머신 여행이 끝나고 모두가 밖으로 나오는 장면을 여는 문장이에요. Slowly가 문장 맨 앞에 놓여서 장면이 아주 느리게 시작되는 분위기를 만들어 주죠. 그리고 get out of는 하나로 묶여서 내리다라는 뜻을 가진 구동사라는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 첫 번째 어법 포인트는 부사의 문두 배치예요. Slowly처럼 부사가 문장 맨 앞에 오면 그 동작이 얼마나 천천히 일어나는지 강조하는 효과가 있어요. 두 번째는 구동사 got out of인데요, get out of는 하나로 묶여서 내리다라는 뜻을 가진 이어동사예요. 그래서 the time machine이 그 뒤에 목적어처럼 붙는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정글은\u003c/span>\u003cspan class=\"en\">The jungle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒤덮여 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">covered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안개로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">fog\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정글은 안개로 뒤덮여 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모두가 타임머신에서 내린 뒤 눈앞에 펼쳐진 \u003cb class=\"key\">정글\u003c/b>의 상태를 묘사하는 문장이에요. 정글은 스스로를 덮는 것이 아니라 안개에 의해 덮이는 \u003cb class=\"key\">대상\u003c/b>이므로 수동태 be covered를 썼어요. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">covered \u003c/b>\u003cb class=\"key\">in\u003c/b>은 '~로 뒤덮이다'라는 뜻으로, 앞으로 이어질 장면의 으스스한 분위기를 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어] + be + [과거분사] (~되다, ~당하다) : \"뒤덮여 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 뒤의 전치사 in (재료·수단)\u003c/span> : be covered in + [명사] (~로 뒤덮이다) : \"안개로\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The jungle, 정글은. was covered, 뒤덮여 있었어요. in fog, 안개로. 이 문장 전체를 해석하면, 정글은 안개로 뒤덮여 있었다.","hl":"m"},{"n":17,"text":"이 문장은 모두가 타임머신에서 내린 뒤 눈앞에 펼쳐진 정글의 모습을 보여 줘요. 정글은 스스로를 덮는 게 아니라 안개에 의해 덮이는 대상이기 때문에 수동태를 쓴 거예요. be covered in은 ~로 뒤덮이다라는 뜻으로, 앞으로 이어질 장면의 으스스한 분위기를 만들어 줍니다.","hl":"mn"},{"n":18,"text":"먼저 첫 번째 어법 포인트는 수동태예요. be동사 was와 과거분사 covered가 만나서 뒤덮여 있었다라는 수동의 뜻을 만들어요. 정글은 덮는 쪽이 아니라 안개에 의해 덮이는 대상이니까 수동태를 꼭 써야 하는 거죠. 두 번째는 covered 뒤에 오는 전치사 in이에요. in은 ~로 덮여 있다라는 관용 표현을 만들고, 여기서는 안개로라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무척 고요했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">quiet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳은 무척 고요했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짧지만 분위기를 결정하는 문장이에요. 여기서 \u003cb class=\"key\">It\u003c/b>은 날씨나 시간처럼 특별한 것을 가리키지 않는 \u003cb class=\"key\">비인칭 \u003c/b>\u003cb class=\"key\">대명사\u003c/b>로, 바로 앞에 나온 정글의 상황 전체를 가리켜요. 소리 하나 없는 \u003cb class=\"key\">고요함\u003c/b>을 강조해, 곧 무슨 일이 일어날지 모르는 긴장감을 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 대명사 it (상황·장소 지시)\u003c/span> : It + be + [형용사] (날씨·시간·상황 묘사) : \"그곳은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어] + be + [형용사(주격보어)] : \"무척 고요했다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"It, 그곳은. was very quiet, 무척 고요했어요. 이 문장 전체를 해석하면, 그곳은 무척 고요했다.","hl":"m"},{"n":20,"text":"짧은 문장이지만 분위기를 결정하는 아주 중요한 문장이에요. 여기서 It은 날씨나 시간처럼 특별한 것을 가리키지 않는 비인칭 대명사로, 바로 앞에 나온 정글의 상황 전체를 가리켜요. 소리 하나 없는 고요함을 강조해서, 곧 무슨 일이 일어날지 모르는 긴장감을 만들어 줍니다.","hl":"mn"},{"n":21,"text":"먼저 첫 번째 어법 포인트는 비인칭 대명사 It이에요. It은 날씨나 시간, 거리처럼 특정 대상을 가리키지 않고 상황 전체를 나타낼 때 쓰여요. 여기서는 앞 문장에 나온 정글과 그 주변 상황을 가리킨다고 보면 됩니다. 두 번째는 be동사 뒤에 형용사가 오는 구조예요. was very quiet처럼 be동사 뒤에 형용사가 오면 주어의 상태를 설명하는 문장이 되고, quiet은 주어를 보충 설명하는 주격보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">&quot;I'm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 신나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">excited\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Eckels가 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Eckels\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“정말 신나요.” Eckels가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Eckels가 타임머신에서 내린 뒤 \u003cb class=\"key\">들뜬 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 그대로 드러내는 대사예요. 바로 뒤에 오는 Travis의 경고와 대비되면서, Eckels가 상황의 \u003cb class=\"key\">위험\u003c/b>을 아직 실감하지 못했다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so + 형용사 (감정 강조)\u003c/span> : [so] + [형용사] → '정말 ~한' : \"정말 신나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : [인용문] + [said] + [주어] : \"Eckels가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"\"I'm, 나는. so excited,\", 정말 신나요. said Eckels, Eckels가 말했다. 이 문장 전체를 해석하면, “정말 신나요.” Eckels가 말했다.","hl":"m"},{"n":23,"text":"Eckels가 타임머신에서 막 내린 뒤 들뜬 마음을 그대로 드러내는 대사예요. 바로 뒤에 오는 Travis의 경고와 나란히 놓이면서, Eckels가 상황의 위험을 아직 실감하지 못했다는 걸 보여 주는 거죠.","hl":"mn"},{"n":24,"text":"이 문장에서 첫 번째로 봐야 할 건 so excited예요. so는 형용사 앞에서 강조의 뜻을 더해서 '정말 신나는'이라고 해석해요. 두 번째는 said Eckels인데요. 인용문이 앞에 오면 said가 주어보다 먼저 나오는 도치가 일어나요. 그래서 'Eckels가 말했다'라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해라\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조심하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">careful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“조심하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Travis가 Eckels에게 처음으로 \u003cb class=\"key\">주의\u003c/b>를 주는 명령문이에요. 바로 다음 문장에서 그 이유가 이어지기 때문에, 이 대사는 곧 나올 \u003cb class=\"key\">경고\u003c/b>의 시작을 알리는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : [Be] + [형용사] → '~해라' : \"조심하세요\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"\"Be, 해라. careful, 조심하세요. 이 문장 전체를 해석하면, “조심하세요.","hl":"m"},{"n":26,"text":"Travis가 Eckels에게 주는 첫 번째 주의예요. 바로 다음 문장에서 그 이유를 말해 주기 때문에, 이 대사는 경고의 시작이라고 보면 됩니다.","hl":"mn"},{"n":27,"text":"이 문장은 명령문이에요. 명령문은 동사원형으로 시작하죠. Be동사는 원형 그대로 Be를 써서 '~해라'라는 뜻을 만들어요. 그래서 Be careful은 '조심하세요'라는 명령이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 공룡들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dinosaurs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배가 고플 수도 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> hungry,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Travis가 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Travis\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“몇몇 공룡들이 배가 고플 수도 있습니다.” Travis가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Travis가 앞의 '조심하세요'에 대한 \u003cb class=\"key\">이유\u003c/b>를 밝히는 문장이에요. 공룡들 중 \u003cb class=\"key\">일부\u003c/b>가 배고픈 상태라는 뜻으로, 정글에서의 \u003cb class=\"key\">위험\u003c/b>을 구체적으로 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치 (부분 표현 some of)\u003c/span> : [Some of] + [the 복수명사] + [복수동사] : \"몇몇 공룡들이 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : [인용문] + [said] + [주어] : \"Travis가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Some of the dinosaurs, 몇몇 공룡들이. are hungry,\", 배가 고플 수도 있습니다. said Travis, Travis가 말했다. 이 문장 전체를 해석하면, “몇몇 공룡들이 배가 고플 수도 있습니다.” Travis가 말했다.","hl":"m"},{"n":29,"text":"이 문장은 Travis가 앞에서 한 조심하라는 말의 이유를 밝히는 거예요. 공룡들 가운데 일부가 배고픈 상태라는 뜻이고요, 그래서 정글이 위험하다는 걸 구체적으로 알려 주는 거죠.","hl":"mn"},{"n":30,"text":"먼저 주어-동사 수 일치를 보세요. Some of 뒤에 복수명사 dinosaurs가 왔으니 주어는 복수로 보고 동사도 are를 씁니다. 두 번째는 said Travis인데요, 인용문이 앞에 오면 said가 주어보다 먼저 나오는 도치가 일어나요. 그래서 'Travis가 말했다'라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침착한 상태로 있으세요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">calm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">침착하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Travis가 Eckels에게 공룡들이 배가 고플 수도 있는 위험한 상황에서 흔들리지 말라고 \u003cb class=\"key\">당부\u003c/b>하는 말이에요. 짧은 \u003cb class=\"key\">명령문\u003c/b>으로 '침착함을 유지하라'는 \u003cb class=\"key\">경고\u003c/b>의 뜻을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : (You) + [동사원형 stay] + [형용사 calm] : \"(당신은) 침착한 상태로 있으세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 형용사(주격보어)\u003c/span> : stay [2형식 동사] + [calm (형용사/주격보어)] : \"침착한 상태를 유지하세요\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Just, 그냥. stay calm, 침착한 상태로 있으세요.. 이 문장 전체를 해석하면, 침착하세요.","hl":"m"},{"n":32,"text":"이 문장은 Travis가 Eckels에게 흔들리지 말라고 당부하는 말이에요. 짧은 명령문으로 침착함을 유지하라는 경고의 뜻을 담고 있죠.","hl":"mn"},{"n":33,"text":"먼저, 이 문장은 명령문이에요. 명령문은 주어 You를 생략하고 동사원형으로 시작한다는 점, 꼭 기억해 두세요. 그리고 stay는 2형식 동사로, 뒤에 형용사 calm이 와서 주어의 상태를 설명하는 주격보어 역할을 해요. 그래서 stay calm은 침착한 상태를 유지하다라는 뜻이 되고, 상대방에게 침착함을 유지하라고 지시하는 느낌을 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원하지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 어리석은 것도.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003cspan class=\"tgt\">foolish\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 어리석은 어떤 행동도 하지 않기를 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Travis가 Eckels에게 어리석은 행동을 하지 않기를 \u003cb class=\"key\">바라는\u003c/b> 문장이에요. want를 써서 상대방의 행동을 미리 \u003cb class=\"key\">제한\u003c/b>하려는 당부가 담겨 있고, not과 anything을 함께 써서 '어떤 어리석은 행동도'라는 뜻을 \u003cb class=\"key\">강조\u003c/b>하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제의 부정 (do not + 동사원형)\u003c/span> : [do not (don't)] + [동사원형 want] : \"원하지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 want + 목적어 + to부정사(목적격보어)\u003c/span> : want + [목적어 you] + [to부정사 to do (목적격보어)] : \"당신이 하기를 원하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">-thing 대명사를 뒤에서 수식하는 형용사(후치수식)\u003c/span> : [anything (대명사)] + [foolish (형용사/후치수식)] : \"어떤 어리석은 것도\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I, 나는. don't want, 원하지 않아요. you to do, 당신이 하기를. anything foolish, 어떤 어리석은 것도.. 이 문장 전체를 해석하면, 당신이 어리석은 어떤 행동도 하지 않기를 바랍니다.","hl":"m"},{"n":35,"text":"이 문장은 Travis가 Eckels에게 어리석은 행동을 하지 않기를 바라는 말이에요. want를 써서 상대방의 행동을 미리 제한하려는 당부가 담겨 있고, not과 anything을 함께 써서 어떤 어리석은 행동도 하지 말라는 뜻을 강조하고 있죠.","hl":"mn"},{"n":36,"text":"먼저, don't want는 일반동사 want의 부정이에요. 조동사 do not을 앞에 놓고 뒤에는 반드시 동사원형 want를 쓴다는 점, 그리고 회화에서는 don't로 축약한다는 점을 기억하세요. 두 번째, want는 목적어 뒤에 to부정사를 목적격보어로 취하는 5형식 동사예요. want you to do에서 to do를 하는 주체가 목적어 you라는 게 해석의 핵심이죠. 세 번째, anything처럼 -thing으로 끝나는 대명사는 형용사가 뒤에서 꾸며 주는 후치수식을 해요. 그래서 anything foolish가 어떤 어리석은 것도라는 뜻이 되요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지 마세요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">worry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">걱정하지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Eckels가 Travis의 걱정에 대한 \u003cb class=\"key\">대답\u003c/b>으로, 자신은 바보가 아니라고 \u003cb class=\"key\">안심\u003c/b>시키는 말이에요. '걱정하지 마세요'라는 \u003cb class=\"key\">부정 \u003c/b>\u003cb class=\"key\">명령문\u003c/b>으로 자신감을 보여 주는 짧은 응답이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문 (Don't + 동사원형)\u003c/span> : [Don't (do not)] + [동사원형 worry] : \"걱정하지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Don't, 하지 마세요. worry, 걱정을. 이 문장 전체를 해석하면, 걱정하지 마세요.","hl":"m"},{"n":38,"text":"이 문장은 Eckels가 Travis의 걱정에 대한 대답으로, 자신은 바보가 아니라고 안심시키는 말이에요. 걱정하지 마세요라는 부정 명령문으로 자신감을 보여 주는 짧은 응답이죠.","hl":"mn"},{"n":39,"text":"명령문을 부정할 때는 조동사 do not을 줄인 Don't를 문장 앞에 놓고, 뒤에는 동사원형 worry를 쓴다는 점이 핵심이에요. 그래서 이 문장은 걱정하는 행동을 하지 말라고 금지하는 뜻이 되죠. 앞에서 Travis가 조심하라고 당부했으니, 여기서는 그 당부를 받아들이는 Eckels의 자신감이 드러난다고 보면 되요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 ~이에요 바보가 아니에요, Eckels가 말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fool\u003c/span>,&quot; \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Eckels\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“저는 바보가 아니에요.” Eckels가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Eckels가 Travis의 걱정에 '저는 바보가 아니에요'라고 답하며 자신감을 보이는 문장이에요. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">fool\u003c/b>이라는 표현으로 자신이 어리석은 행동을 하지 않을 것이라고 장담하는 거죠. 바로 앞에서 Travis가 '어리석은 어떤 행동도 하지 않기를 바란다'고 했기 때문에, 이 말은 그 걱정을 정면으로 받아치는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 부정문\u003c/span> : 주어 + be동사(am) + not + 명사(fool) : \"저는 바보가 아니에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : &quot;인용문,&quot; + said + 주어 : \"Eckels가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"\"I'm, 저는 ~이에요. not a fool,\", 바보가 아니에요. said Eckels, Eckels가 말했다.. 이 문장 전체를 해석하면, “저는 바보가 아니에요.” Eckels가 말했다.","hl":"m"},{"n":41,"text":"이 문장은 Eckels가 자신이 바보가 아니라고 말하면서 자신감을 드러내는 부분이에요. 바로 앞에서 Travis가 어리석은 행동을 하지 말라고 했죠. 그래서 Eckels는 not a fool이라는 표현으로 그 걱정을 받아치고 있는 거예요. 두 사람 사이의 긴장감을 보여 주는 문장이라고 보면 됩니다.","hl":"mn"},{"n":42,"text":"어법 포인트 두 가지를 짚어 볼게요. 첫 번째는 be동사의 부정문이에요. I'm not a fool에서 not은 be동사 am 뒤에 붙어서 바보가 아니다라는 부정문을 만들어 줍니다. 두 번째는 인용문 뒤 도치예요. 인용문이 앞에 오면 said가 주어 앞으로 나와서 said Eckels 순서가 됩니다. 원래는 Eckels said인데 도치가 일어난 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걷기 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을\u003c/span>\u003cspan class=\"en\">on the path.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 모두 길을 걷기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 대화를 마치고 일행이 실제로 움직이기 시작하는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b>의 문장이에요. \u003cb class=\"key\">began \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">walk\u003c/b>는 '걷기 시작했다'라는 뜻으로, 이야기가 이제 본격적으로 전개된다는 신호가 됩니다. on the path는 그들이 정글 속 길을 따라 이동한다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">all의 위치(주어와 동사 사이)\u003c/span> : [주어] + all + [동사] : \"그들은 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : began [타동사] + to walk [to부정사구/목적어] : \"걷기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"They all, 그들은 모두. began to walk, 걷기 시작했다. on the path, 길을. 이 문장 전체를 해석하면, 그들은 모두 길을 걷기 시작했다.","hl":"m"},{"n":44,"text":"이 문장은 대화가 끝나고 일행이 실제로 움직이기 시작하는 장면 전환을 보여 줘요. began to walk는 걷기 시작했다는 뜻이고, on the path는 그들이 정글 속 길을 따라 간다는 걸 알려 줍니다. 이야기가 본격적으로 전개되는 신호라고 보면 됩니다.","hl":"mn"},{"n":45,"text":"어법 포인트 두 가지예요. 첫 번째는 all의 위치인데요. all이 주어 뒤, 동사 앞에 오면 그들은 모두라는 뜻으로 주어를 강조합니다. They all이라고 하면 그들 모두가 되는 거죠. 두 번째는 to부정사의 명사적 용법이에요. begin은 뒤에 to부정사를 목적어로 데려와서 ~하기 시작하다라는 뜻을 만들어요. began은 begin의 과거형이라 시작했다로 해석합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>일행은 타임머신에서 천천히 내려 \u003cb class=\"key\">안개\u003c/b>로 뒤덮인 고요한 정글에 도착한다.\u003c/li>\u003cli>Eckels는 'I'm so excited'라며 \u003cb class=\"key\">흥분\u003c/b>을 드러낸다.\u003c/li>\u003cli>Travis는 몇몇 공룡들이 배가 고플 수 있다며 \u003cb class=\"key\">조심\u003c/b>하라고 하고, 침착하게 행동하라고 \u003cb class=\"key\">경고\u003c/b>한다.\u003c/li>\u003cli>Eckels는 자신은 \u003cb class=\"key\">바보\u003c/b>가 아니라고 답하고, 그들은 모두 길을 걷기 시작한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Travis warns Eckels to stay calm and not do anything foolish in the quiet, foggy jungle, but Eckels insists that he is not a fool.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 일행이 타임머신에서 내려 \u003cb class=\"key\">안개\u003c/b> 낀 고요한 정글에 도착한 뒤, Travis는 배고픈 공룡을 경계하며 침착하라고 \u003cb class=\"key\">경고\u003c/b>하지만, Eckels는 자신은 \u003cb class=\"key\">바보\u003c/b>가 아니라며 걱정 말라고 답하고 모두 길을 걷기 시작한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 지문은 여기까지예요. 타임머신에서 내려 안개 낀 고요한 정글에 도착한 일행이, 조심하라는 Travis의 경고와 자신은 바보가 아니라는 Eckels의 대답을 주고받은 뒤 길을 걷기 시작한다는 내용이었죠. 시간순으로 이어지는 서사이니 사건의 순서를 머릿속에 그려 두고, 경고와 대답이 어떻게 대비되는지도 함께 기억해 두세요. 그럼 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
