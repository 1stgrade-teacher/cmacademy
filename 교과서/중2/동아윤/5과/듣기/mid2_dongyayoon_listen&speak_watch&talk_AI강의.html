</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

    if(s.pause){pause(s.pause);return;}

    a.src=encodeURI(D.audioDir)+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;warn.hidden=false;warn.textContent="음성 파일("+D.audioDir+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

lecturePlayer(document.getElementById("app"),{"brand":"Watch and Talk C","title":"중2 동아 윤 5과 Watch and Talk C 대화문 완벽 분석","audioDir":"mid2_dongyayoon_listen&speak_watch&talk_audio","preview":false,"count":31,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">길 묻고 답하기 및 계획 말하기\u003c/div>\u003ch1>중2 동아 윤 5과 Watch and Talk C 대화문 완벽 분석\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>리암이 세빛 공원에 가는 길을 솜이에게 묻고, 솜이가 가는 방법을 안내한 뒤 함께 미술 장터에 가기로 약속하는 상황입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 중2 동아윤 오과 Watch and Talk 대화문 해설 강의를 시작하겠습니다. 이번 시간에는 길을 묻고 답하는 방법과 주말 계획을 이야기하는 표현을 자세히 배워볼게요. 대화 속에 숨은 핵심 문법과 유용한 표현들을 꼼꼼하게 정리해볼께요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능\u003c/span>\u003ch2 class=\"g-h\">길 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What's the best way to get to + 장소?\u003c/div>\u003cdiv class=\"d-mean\">~로 가는 가장 좋은 방법이 무엇인가요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Somi, I need help. What's the best way to get to Sebit Park from here?\u003c/div>\u003cdiv class=\"d-exp\">상대방에게 특정 장소로 가는 길을 물어볼 때 쓰는 \u003cb class=\"key\">표현\u003c/b>이에요. 가장 좋은 방법을 묻기 위해 \u003cb class=\"key\">best way\u003c/b>라는 표현을 함께 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How can I get to + 장소?\u003c/li>\u003cli>Could you tell me the way to + 장소?\u003c/li>\u003cli>Do you know how to get to + 장소?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>You can get there by bus or by subway.\u003c/li>\u003cli>Take line 3, and get off at Sebit Station.\u003c/li>\u003cli>Go straight and turn left.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 길을 묻는 표현을 배워볼게요. What is the best way to get to 장소 라고 하면 장소로 가는 가장 좋은 방법이 무엇인가요 라는 뜻이 돼요.","hl":"key"},{"n":3,"text":"이 표현은 How can I get to 장소 나 Could you tell me the way to 장소로 바꿔서 말할 수 있어요.","hl":"alts"},{"n":4,"text":"이에 대한 응답으로는 You can get there by bus 처럼 교통수단을 말해주거나 Take line 3 처럼 구체적인 안내를 해줄 수 있답니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Somi, I need help. \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What's the best way to get to Sebit Park from here?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">솜이야, 나 도움이 필요해. 여기서 세빛 공원에 가는 가장 좋은 방법이 뭐야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>상대방에게 길을 물어볼 때 사용하는 \u003cb class=\"key\">핵심 표현\u003c/b>으로 세빛 공원으로 가는 가장 좋은 방법을 묻고 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How can I get to Sebit Park from here?\u003c/span>\u003cspan>Could you tell me the way to Sebit Park from here?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sebit Park? Well, you can get there by bus or by subway, but the subway is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">better\u003c/span>. \u003cspan class=\"mk\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">세빛 공원? 글쎄, 너는 버스나 지하철을 타고 갈 수 있지만, 지하철이 더 나아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>‘A이거나 B’의 의미로, or는 \u003cb class=\"key\">선택\u003c/b>을 나타내는 접속사이다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>better 뒤에 \u003cb class=\"key\">than the bus\u003c/b>가 생략되어 있다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":5,"text":"첫 번째 줄을 읽어볼게요. 리암이 말합니다. Somi, I need help. What is the best way to get to Sebit Park from here? 솜이야 나 도움이 필요해. 여기서 세빛 공원에 가는 가장 좋은 방법이뭐야 라는 뜻이에요. 여기서 What is the best way to get to 라는 표현은 길을 물어볼 때 쓰는 아주 중요한 패턴이랍니다.","hl":"l-0"},{"n":6,"text":"두 번째 줄입니다. 소미가 말합니다. Sebit Park? Well, you can get there by bus or by subway, but the subway is better. 세빛 공원? 글쎄 버스나 지하철을 타고 갈 수 있지만 지하철이 더 나아 라는 말이에요. 여기서 A or B는 A이거나 B라는 뜻이고 or는 선택을 나타내요. 그리고 better 뒤에는 than the bus가 생략되어 있답니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">OK. Which \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">line\u003c/span> should I take?\u003c/div>\u003cdiv class=\"d-ko\">알겠어. 몇 호선을 타야 하지?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>지하철의 \u003cb class=\"key\">노선\u003c/b>을 의미하고, should는 ‘~해야 한다’라는 의미를 나타낸다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which line do I need to take?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Take line 3, and get off \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">at\u003c/span> Sebit Station.\u003c/div>\u003cdiv class=\"d-ko\">3호선을 타고, 세빛역에서 내려.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>역 앞에 \u003cb class=\"key\">at\u003c/b>을 붙여 ‘~역에서’라는 의미를 나타낸다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Get on line 3 and exit at Sebit Station.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"세 번째 줄이에요. 리암이 말합니다. OK. Which line should I take? 알겠어. 몇 호선을 타야 하지? 라는 뜻이죠. 여기서 line은 지하철의 노선을 의미하고 should는 ~해야 한다는 의미를 나타내요.","hl":"l-0"},{"n":8,"text":"네 번째 줄입니다. 소미가 말합니다. Take line 3, and get off at Sebit Station. 3호선을 타고 세빛역에서 내려 라는 말이에요. 역 이름 앞에는 전치사 at을 붙여서 어디어디역에서 라는 의미를 나타낸답니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Line 3 and get off at Sebit Station. \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">How long will it take?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">3호선 타고 세빛역에서 내리기. 얼마나 오래 걸릴까?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>시간이 얼마나 걸릴지 물어볼 때 사용하는 \u003cb class=\"key\">시간 묻기 표현\u003c/b>이다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How much time will it take?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">It'll take about 40 minutes.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">대략 40분쯤 걸릴 거야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>소요 시간을 대답할 때 사용하는 문장으로 about은 \u003cb class=\"key\">약, 대략\u003c/b>이라는 뜻이다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>It will require about 40 minutes.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"다섯 번째 줄이에요. 리암이 말합니다. Line 3 and get off at Sebit Station. How long will it take? 3호선 타고 세빛역에서 내려~! 얼마나 오래 걸릴까? 라는 뜻이죠. 시간이 얼마나 걸릴지 묻는 아주 유용한 표현이에요.","hl":"l-0"},{"n":10,"text":"여섯 번째 줄입니다. 다시 소미가 말합니다. It will take about 40 minutes. 대략 40분쯤 걸릴 거야 라는 뜻이에요. about은 대략 이라는 뜻으로 시간을 어림잡아 말할 때 쓴답니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Is it \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> far?\u003c/div>\u003cdiv class=\"d-ko\">그렇게 멀어?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>‘그렇게’라는 뜻의 부사로, \u003cb class=\"key\">far\u003c/b>를 강조하는 말이다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Is it so far?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes. \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">Anyway\u003c/span>, why are you going to Sebit Park, Liam?\u003c/div>\u003cdiv class=\"d-ko\">응. 그나저나, 리암, 너 왜 세빛 공원에 가는 거야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>대화의 주제를 \u003cb class=\"key\">화제 전환\u003c/b>하거나 그나저나 라고 말할 때 쓰는 부사이다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>By the way, why are you going to Sebit Park, Liam?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"일곱 번째 줄이에요. 리암이 말합니다. Is it that far? 그렇게 멀어? 라는 뜻이죠. 여기서 that은 그렇게 라는 뜻의 부사로 far를 강조하고 있어요.","hl":"l-0"},{"n":12,"text":"여덟 번째 줄입니다. 소미가 말합니다. Yes. Anyway, why are you going to Sebit Park, Liam? 응. 그나저나 리암 너 왜 세빛 공원에 가는 거야? 라는 뜻이에요. anyway는 화제를 바꿀 때 쓰는 표현이랍니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Oh, \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">there is\u003c/span> an art fair this Saturday. You \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">can\u003c/span> come with me if you want.\u003c/div>\u003cdiv class=\"d-ko\">아, 이번 토요일에 미술 장터가 있어. 네가 원한다면 나와 함께 와도 돼.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>「there is + 단수 명사」는 ‘~이 있다’라는 뜻으로, is 뒤에 있는 \u003cb class=\"key\">an art fair\u003c/b>가 문장의 주어이다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>‘~해도 된다’는 뜻의 \u003cb class=\"key\">허락\u003c/b>의 의미를 나타내는 조동사이고, want 다음에는 to come이 생략되었다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>You are welcome to come with me if you'd like.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Really? \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">I'm free\u003c/span> this Saturday. Let's go together.\u003c/div>\u003cdiv class=\"d-ko\">정말? 나 이번 토요일에 한가해. 같이 가자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>‘나는 한가해’라는 의미로 다른 계획이나 약속이 없는 상태를 나타내며 \u003cb class=\"key\">I have time\u003c/b>, \u003cb class=\"key\">I'm not busy\u003c/b> 등으로 바꿔 말할 수 있다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I have time this Saturday. Let's go together.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"아홉 번째 줄이에요. 리암이 말합니다. Oh, there is an art fair this Saturday. You can come with me if you want. 아 이번 토요일에 미술 장터가 있어. 네가 원한다면 나와 함께 와도 돼 라는 뜻이죠. there is는 ~이 있다는 뜻이고 can은 허락을 나타내요. want 다음에는 to come이 생략되었답니다.","hl":"l-0"},{"n":14,"text":"열 번째 줄입니다. 소미가 말합니다. Really? I am free this Saturday. Let's go together. 정말? 나 이번 토요일에 한가해. 같이 가자 라는 뜻이에요. I am free는 나는 한가하다는 뜻으로 I have time이나 I am not busy로 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 11 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">11\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Perfect. Let's meet here \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">at\u003c/span> 10.\u003c/div>\u003cdiv class=\"d-ko\">완벽해. 10시에 여기서 만나자.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>약속을 정하는 표현으로 「장소 + 시간」의 순서로 말하며, 만날 시각 앞에는 전치사 \u003cb class=\"key\">at\u003c/b>을 써서 말한다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Great. Let's meet here at 10 o'clock.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"열한 번째 줄이에요. 리암이 말합니다. Perfect. Let's meet here at 10. 완벽해. 10시에 여기서 만나자 라는 뜻이죠. 약속을 정할 때는 장소와 시간을 말하고 만날 시각 앞에는 전치사 at을 쓴다는 것 잊지 마세요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 표현과 바꿔 쓸 수 없는 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">G: I'm free this Saturday.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I have time this Saturday.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I'm not busy this Saturday.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>I have no time this Saturday.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I am available this Saturday.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan clas  class=\"key\">or\u003c/b>와 소요 시간을 묻는 \u003cb class=\"key\">How long will it take?\u003c/b>를 꼭 기억하세요.\u003c/li>\u003cli>시간이 있고 한가할 때는 \u003cb class=\"key\">I'm free\u003c/b>나 \u003cb class=\"key\">I have time\u003c/b>으로 말할 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":31,"text":"오늘 배운 내용을 깔끔하게 정리해 볼게요. 길을 묻고 답하는 표현부터 주말 계획을 말하는 표현까지 정말 중요한 내용들이 많았죠. 복습 열심히 하시고 우리는 다음 강의에서 또 만나요. 수고하셨어요!","hl":"sum"}]}]});</script></body></html>
