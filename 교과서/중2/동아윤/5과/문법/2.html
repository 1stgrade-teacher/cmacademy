</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"grammar2","title":"중2 영어 조동사 used to 마스터하기","audioDir":"2_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중2 동아(윤) 5과 문법\u003c/div>\u003ch1>중2 영어 조동사 used to 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>과거의 상태와 습관을 나타내는 조동사 used to의 형태, 의미, 그리고 시험에 자주 나오는 표현을 완벽하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 중학교 이학년 영어에서 아주 중요하게 다루는 조동사 used to 표현을 함께 공부해 볼 거예요. 과거에는 그랬지만 지금은 그렇지 않다는 의미를 나타낼 때 쓰는 아주 유용한 표현이랍니다. 선생님과 함께 예문을 읽고 차근차근 배워서 시험에 나오는 문제까지 완벽하게 풀어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">used to의 의미와 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">used to\u003c/b>는 동사원형과 함께 쓰여 과거의 상태나 습관을 나타내며, 형태는 \u003cb class=\"key\">used to+동사원형\u003c/b>으로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">used to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Poor workers \u003cspan class=\"fx\">used to live\u003c/span> in this area.\u003c/div>\u003cdiv class=\"g-ko\">가난한 노동자들이 이 지역에 살았었다.\u003c/div>\u003cdiv class=\"g-note\">읽기 본문 예문으로 과거의 상태를 나타냄\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">used to play\u003c/span> tennis a lot, but now they don’t.\u003c/div>\u003cdiv class=\"g-ko\">그들은 테니스를 많이 쳤지만, 지금은 치지 않는다.\u003c/div>\u003cdiv class=\"g-note\">과거의 습관을 나타내는 대표 예문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The girl \u003cspan class=\"fx\">used to have\u003c/span> long hair, but she has short hair now.\u003c/div>\u003cdiv class=\"g-ko\">그 소녀는 예전에는 긴 머리였지만, 지금은 짧은 머리이다.\u003c/div>\u003cdiv class=\"g-note\">형태 설명 예문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재형태인 use to로 쓰지 않도록 \u003cb class=\"key\">used to\u003c/b> 형태로 정확히 써야 해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 used to의 형태와 의미예요. used to는 뒤에 반드시 동사원형을 써서 예전에 ~이거나 ~하곤 했다는 의미를 나타내요. 현재에는 더 이상 존재하지 않는 과거의 상태나 지금은 하지 않는 과거의 습관을 말할 때 쓴답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. Poor workers used to live in this area. 가난한 노동자들이 이 지역에 살았었다라는 뜻이에요. used to live가 쓰여서 예전에 살았다는 과거의 상태를 보여 주고 있어요.","hl":"ex-0"},{"n":4,"text":"대표 예문 하나 더 볼까요. They used to play tennis a lot, but now they don't. 그들은 테니스를 많이 쳤지만, 지금은 치지 않는다는 뜻이에요. 예전에는 테니스를 자주 쳤지만 지금은 안 친다는 과거의 습관을 나타내고 있죠.","hl":"ex-1"},{"n":5,"text":"이번에는 The girl used to have long hair, but she has short hair now. 문장을 볼게요. 그 소녀는 예전에는 긴 머리였지만 지금은 짧은 머리라는 뜻이에요. used 뒤에 to가 붙고 그 뒤에 동사원형 have가 온 형태를 꼭 기억해 주세요.","hl":"ex-2"},{"n":6,"text":"주의할 점은 항상 used to 과거형태로 써야 한다는 거예요. 현재형인 use to로 쓰지 않도록 조심하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">과거의 상태와 과거의 습관\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재에는 더 이상 존재하지 않는 과거의 \u003cb class=\"key\">상태\u003c/b>나 예전에는 종종 했지만 지금은 하지 않는 과거의 \u003cb class=\"key\">습관\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My son \u003cspan class=\"fx\">used to be\u003c/span> very shy when he was a child.\u003c/div>\u003cdiv class=\"g-ko\">내 아들은 어렸을 때 매우 수줍음이 많았다.\u003c/div>\u003cdiv class=\"g-note\">과거의 상태를 나타내는 예문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We \u003cspan class=\"fx\">used to walk\u003c/span> to school together every day.\u003c/div>\u003cdiv class=\"g-ko\">우리는 매일 함께 학교에 걸어가곤 했다.\u003c/div>\u003cdiv class=\"g-note\">과거의 습관을 나타내는 예문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재에도 계속되는 일에는 used to를 쓸 수 없어요.\u003c/div>","segs":[{"n":7,"text":"두 번째 개념은 used to가 구체적으로 어떤 의미로 쓰이는지 살펴보는 거예요. 과거의 상태나 습관을 나타낼 때 쓴다고 했죠. 예문을 통해 어떻게 쓰이는지 자세히 알아볼게요.","hl":"rule"},{"n":8,"text":"첫 번째 예문이에요. My son used to be very shy when he was a child. 내 아들은 어렸을 때 매우 수줍음이 많았다는 뜻이에요. 지금은 수줍음이 없지만 어렸을 때는 그랬다는 과거의 상태를 나타내고 있어요.","hl":"ex-0"},{"n":9,"text":"다음 예문은 We used to walk to school together every day. 우리는 매일 함께 학교에 걸어가곤 했다는 뜻이에요. 예전에는 매일 걸어갔다는 과거의 반복적인 습관을 나타내고 있죠.","hl":"ex-1"},{"n":10,"text":"used to는 지금은 안 하고 과거에만 그랬다는 점이 아주 중요해요. 지금도 계속하고 있는 일에는 used to를 쓸 수 없다는 것을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">시험 Point 혼동 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">be used to+동사원형\u003c/b>은 '~하기 위해 사용되다'이고, \u003cb class=\"key\">be used to+v-ing\u003c/b>는 '~하는 데 익숙하다'라는 뜻입니다.\u003cdiv>\u003cspan class=\"g-formula\">be used to + 동사원형 vs be used to + v-ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This tool \u003cspan class=\"fx\">is used to cut\u003c/span> wood.\u003c/div>\u003cdiv class=\"g-ko\">이 도구는 나무를 자르는 데 사용된다.\u003c/div>\u003cdiv class=\"g-note\">수동태 표현 시험 포인트\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">is used to working\u003c/span> late at night.\u003c/div>\u003cdiv class=\"g-ko\">그는 밤늦게 일하는 데 익숙하다.\u003c/div>\u003cdiv class=\"g-note\">익숙하다 표현 시험 포인트\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>뒤에 동사원형이 오는지 ing가 오는지 \u003cb class=\"key\">전치사 to\u003c/b> 인지 잘 확인하세요.\u003c/div>","segs":[{"n":11,"text":"세 번째 개념은 시험에 정말 자주 나오는 중요 포인트예요. 비슷하게 생겼지만 뜻이 완전히 다른 두 가지 표현을 비교해 볼 건데요. be used to 뒤에 동사원형이 오느냐, 동명사가 오느냐에 따라 뜻이 완전히 달라진답니다.","hl":"rule"},{"n":12,"text":"첫 번째 예문은 This tool is used to cut wood. 이 도구는 나무를 자르는 데 사용된다는 뜻이에요. be used to 뒤에 동사원형인 cut이 와서 ~하기 위해 사용된다라는 수동태 의미가 되었어요.","hl":"ex-0"},{"n":13,"text":"두 번째 예문은 He is used to working late at night. 그는 밤늦게 일하는 데 익숙하다는 뜻이에요. 여기서는 be used to 뒤에 동명사 working이 와서 ~하는 데 익숙하다라는 의미로 쓰였어요. 두 표현의 차이를 꼭 구별할 수 있어야 해요.","hl":"ex-1"},{"n":14,"text":"여기서 to가 부정사의 투인지 전치사의 투인지가 아주 중요해요. 헷갈리기 쉬우니까 예문을 눈여겨보고 꼭 암기해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">used to의 부정문과 의문문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부정문은 \u003cb class=\"key\">didn't use to+동사원형\u003c/b>, 의문문은 \u003cb class=\"key\">Did+주어+use to+동사원형 ~?\u003c/b>의 형태로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">didn't use to + 동사원형 / Did + 주어 + use to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There \u003cspan class=\"fx\">didn’t use to be\u003c/span> many buildings here.\u003c/div>\u003cdiv class=\"g-ko\">예전에는 이곳에 건물이 많지 않았다.\u003c/div>\u003cdiv class=\"g-note\">부정문 예문\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Did your family use to camp\u003c/span> a lot?\u003c/div>\u003cdiv class=\"g-ko\">네 가족은 예전에 캠핑을 많이 하곤 했니?\u003c/div>\u003cdiv class=\"g-note\">의문문 예문\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부정과 의문문 만들 때 \u003cb class=\"key\">d를 뺀 use to\u003c/b> 형태를 쓴다는 점을 주의하세요.\u003c/div>","segs":[{"n":15,"text":"마지막 개념은 used to의 부정문과 의문문 만들기예요. 부정문은 didn't use to 뒤에 동사원형을 쓰고, 의문문은 문장 맨 앞에 Did를 쓰고 주어 다음에 use to와 동사원형을 쓴답니다.","hl":"rule"},{"n":16,"text":"부정문 예문을 볼게요. There didn't use to be many buildings here. 예전에는 이곳에 건물이 많지 않았다는 뜻이에요. didn't 뒤에 use to가 원형으로 쓰인 것을 잘 보세요.","hl":"ex-0"},{"n":17,"text":"이번에는 의문문 예문이에요. Did your family use to camp a lot? 네 가족은 예전에 캠핑을 많이 하곤 했니라는 뜻이에요. 문장 맨 앞에 Did가 오고 주어 다음에 use to가 원형으로 쓰였다는 점을 잊지 마세요.","hl":"ex-1"},{"n":18,"text":"여기서 아주 중요한 팁이 있어요. 부정문과 의문문에서는 didn't와 Did가 이미 과거를 나타내기 때문에 used가 아니라 d를 뺀 use로 쓴답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wron
