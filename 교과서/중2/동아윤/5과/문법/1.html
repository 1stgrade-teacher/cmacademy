  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);

  var bases=null,bi=0,okBase=false,att=0;

    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"grammar1","title":"목적격 관계대명사 완벽 마스터하기","audioDir":"1_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중2 동아(윤) 5과 문법\u003c/div>\u003ch1>목적격 관계대명사 완벽 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적격 관계대명사의 개념과 쓰임, 생략과 전치사 규칙을 완벽하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 우리 5과에서 가장 중요한 문법인 목적격 관계대명사에 대해 배워볼 거예요. 관계대명사라는 이름이 조금 어렵게 느껴질 수 있지만 오늘 선생님과 함께 차근차근 살펴보면 아주 쉽게 이해할 수 있을 거예요. 자, 그럼 오늘의 첫 번째 개념부터 출발해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">목적격 관계대명사의 역할과 생략\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적격 \u003cb class=\"key\">관계대명사\u003c/b>는 \u003cb class=\"key\">선행사\u003c/b>를 수식하는 절을 이끌며, 문장에서 생략할 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + (목적격 관계대명사) + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The place \u003cspan class=\"fx\">that we are going to visit\u003c/span> is Shoreditch.\u003c/div>\u003cdiv class=\"g-ko\">우리가 방문할 장소는 Shoreditch이다.\u003c/div>\u003cdiv class=\"g-note\">that we are going to visit이 선행사 The place를 수식합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The food \u003cspan class=\"fx\">that we ate\u003c/span> was very spicy.\u003c/div>\u003cdiv class=\"g-ko\">우리가 먹은 음식은 매우 매웠다.\u003c/div>\u003cdiv class=\"g-note\">목적격 관계대명사 that이 이끄는 절이 선행사 The food를 수식합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The spaghetti \u003cspan class=\"fx\">my uncle made\u003c/span> was delicious.\u003c/div>\u003cdiv class=\"g-ko\">내 삼촌이 만든 스파게티는 맛있었다.\u003c/div>\u003cdiv class=\"g-note\">목적격 관계대명사가 생략된 형태로 선행사 바로 뒤에 주어+동사가 옵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적격 관계대명사가 생략되면 선행사 바로 뒤에 \u003cb class=\"key\">주어+동사\u003c/b> 형태가 옵니다.\u003c/div>","segs":[{"n":2,"text":"목적격 관계대명사는 선행사를 수식하는 관계대명사절을 이끌고 관계대명사절 안에서 동사나 전치사의 목적어 역할을 해요. 특히 목적격 관계대명사는 문장에서 생략할 수 있다는 아주 중요한 특징이 있답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. The place that we are going to visit is Shoreditch. 여기서 that we are going to visit은 목적격 관계대명사절로 선행사 The place를 수식해 줘요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. The food that we ate was very spicy. 우리가 먹은 음식은 매우 매웠다는 뜻이죠. 여기서 that we ate가 선행사 The food를 꾸며 주고 있어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 들어 볼까요. The spaghetti my uncle made was delicious. 내 삼촌이 만든 스파게티는 맛있었다는 뜻인데요, 목적격 관계대명사가 생략되어서 선행사 바로 뒤에 주어와 동사 형태가 바로 이어지고 있어요.","hl":"ex-2"},{"n":6,"text":"목적격 관계대명사가 생략된 관계대명사절은 선행사 바로 뒤에 주어와 동사 형태로 온다는 점을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">목적격 관계대명사의 종류\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 사람일 때는 \u003cb class=\"key\">whom\u003c/b>이나 \u003cb class=\"key\">who\u003c/b>, 사물이나 동물일 때는 \u003cb class=\"key\">which\u003c/b>, 사람과 사물 모두 \u003cb class=\"key\">that\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사(사람/사물) + whom/which/that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I like the dress \u003cspan class=\"fx\">which/that Emma is wearing\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 Emma가 입고 있는 원피스가 마음에 든다.\u003c/div>\u003cdiv class=\"g-note\">선행사가 사물이므로 which나 that을 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The movie \u003cspan class=\"fx\">which/that Ted watched yesterday\u003c/span> was fun.\u003c/div>\u003cdiv class=\"g-ko\">Ted가 어제 본 영화는 재미있었다.\u003c/div>\u003cdiv class=\"g-note\">선행사 The movie를 수식하는 목적격 관계대명사 which나 that입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Henri Matisse is the painter \u003cspan class=\"fx\">whom/who/that I like the most\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Henri Matisse는 내가 가장 좋아하는 화가이다.\u003c/div>\u003cdiv class=\"g-note\">선행사가 사람이므로 whom, who, that 모두 쓸 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적격 관계대명사 \u003cb class=\"key\">that\u003c/b>은 사람과 사물 구분 없이 모두 쓸 수 있습니다.\u003c/div>","segs":[{"n":7,"text":"목적격 관계대명사는 선행사의 종류에 따라 알맞은 것을 골라 써야 해요. 선행사가 사람일 때는 whom이나 who를 쓰고, 사물이나 동물일 때는 which를 써요. 그리고 that은 사람과 사물 모두에 쓸 수 있답니다.","hl":"rule"},{"n":8,"text":"첫 번째 예문을 볼까요. I like the dress which Emma is wearing, 또는 I like the dress that Emma is wearing이라고 할 수 있어요. 선행사가 사물인 dress니까 which나 that을 쓴답니다.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. The movie which Ted watched yesterday was fun. Ted가 어제 본 영화는 재미있었다는 뜻이죠. 여기서는 사물인 영화를 수식하니까 which나 that을 사용했어요.","hl":"ex-1"},{"n":10,"text":"세 번째 예문을 들어 볼게요. Henri Matisse is the painter whom I like the most. 선행사가 사람인 painter니까 whom이나 who, 또는 that을 쓸 수 있어요.","hl":"ex-2"},{"n":11,"text":"that은 사람과 사물에 모두 쓸 수 있어서 아주 유용하지만, 앞에 콤마가 있거나 전치사가 바로 앞을 때 등 몇 가지 예외가 있으니 주의해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">전치사와 함께 쓰이는 목적격 관계대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적격 관계대명사가 \u003cb class=\"key\">전치사\u003c/b>의 목적어일 때, 전치사는 절 끝이나 관계대명사 앞에 올 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + [[whom/which]] (생략 불가)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Is this the pen \u003cspan class=\"fx\">which/that you are looking for\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">이것이 네가 찾고 있는 펜이니?\u003c/div>\u003cdiv class=\"g-note\">전치사 for의 목적어가 앞으로 간 목적격 관계대명사 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The woman \u003cspan class=\"fx\">who(m)/that Jack works with\u003c/span> is very kind.\u003c/div>\u003cdiv class=\"g-ko\">Jack과 함께 일하는 여자는 매우 친절하다.\u003c/div>\u003cdiv class=\"g-note\">전치사 with가 절 끝에 있으며 생략이 가능합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The woman \u003cspan class=\"fx\">with whom\u003c/span> Jack works is very kind.\u003c/div>\u003cdiv class=\"g-ko\">Jack과 함께 일하는 여자는 매우 친절하다.\u003c/div>\u003cdiv class=\"g-note\">전치사가 관계대명사 앞에 오면 whom을 써야 하며 생략할 수 없습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사가 관계대명사 앞에 올 때는 \u003cb class=\"key\">whom\u003c/b>이나 \u003cb class=\"key\">which\u003c/b>만 써야 하며 생략할 수 없습니다.\u003c/div>","segs":[{"n":12,"text":"목적격 관계대명사가 전치사의 목적어일 때가 있어요. 이때 전치사는 관계대명사절 끝에 쓰거나 관계대명사 바로 앞에 쓸 수 있답니다. 특히 전치사 바로 뒤에 올 때는 whom이나 which만 써야 하고 생략할 수 없어요.","hl":"rule"},{"n":13,"text":"첫 번째 예문을 봅시다. Is this the pen which you are looking for? 이것이 네가 찾고 있는 펜이니 라는 뜻이에요. 문장 끝에 전치사 for가 남아 있는 것을 볼 수 있죠.","hl":"ex-0"},{"n":14,"text":"두 번째 예문이에요. The woman who Jack works with is very kind. Jack과 함께 일하는 여자는 매우 친절하다는 뜻이죠. 여기서는 with가 뒤에 있고 관계대명사는 생략할 수 있어요.","hl":"ex-1"},{"n":15,"text":"세 번째 예문을 보면 The woman with whom Jack works is very kind라고 되어 있죠. 전치사 with가 관계대명사 앞으로 오면서 whom만 쓸 수 있고 생략할 수도 없게 되었어요.","hl":"ex-2"},{"n":16,"text":"전치사가 관계대명사 앞치고 나올 때는 who나 that을 쓸 수 없고 반드시 사람일 때는 whom, 사물일 때는 which를 써야 한다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Shakespeare is the author who I like him the most.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Shakespeare is the author who I like the most.\u003c/div>\u003cdiv class=\"g-why\">관계대명사가 선행사를 대신하므로 목적어 자리에 대명사를 중복해서 쓰면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The woman with who Jack works is very kind.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The woman with whom Jack works is very kind.\u003c/div>\u003cdiv class=\"g-why\">전치사 바로 뒤에 오는 목적격 관계대명사는 who를 쓸 수 없고 whom을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"학생들이 자주 하는 실수예요. Shakespeare is the author who I like him the most라고 쓰면 틀려요. 이미 who가 선행사를 대신하고 있으므로 뒤에 목적어인 him을 또 쓰면 안 된답니다.","hl":"mk-0"},{"n":18,"text":"두 번째 자주 틀리는 부분이에요. The woman with who Jack works라고 쓰면 안 돼요. 전치사 바로 뒤에는 격을 갖춘 목적격 관계대명사 whom만 쓸 수 있거든요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞지 않은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I like the dress ____ Emma is wearing.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>which\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>whom\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>생략 가능\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whom\u003c/span>\u003cdiv class=\"g-exp\">선행사 the dress는 사물이므로 사람에게 쓰는 목적격 관계대명사 whom은 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"다음 빈칸에 알맞지 않은 것을 고르는 문제예요. 문장을 잘 읽고 네 개의 보기 중에서 정답을 골라 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 세 번째 보기에요. 선행사가 사물인 원피스이므로 사람에게 쓰는 whom은 쓸 수 없답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>The place that we are going to visit is Shoreditch.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The food what we ate was very spicy.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Shakespeare is the author who I like him the most.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The woman with who Jack works is very kind.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The place that we are going to visit is Shoreditch.\u003c/span>\u003cdiv class=\"g-exp\">나머지 문장은 what을 썼거나, 목적어를 중복해서 썼거나, 전치사 뒤에 who를 써서 틀렸습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"다음 네 개의 문장 중에서 어법상 올바른 문장을 하나 골라 보세요. 잠시 멈추고 정답을 생각해 볼까요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 첫 번째 보기예요. 나머지 문장들은 목적어 중복이나 전치사 뒤의 격 오류 등이 있어서 틀렸답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The woman with who Jack works is very kind.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who -&gt; whom\u003c/span>\u003cdiv class=\"g-exp\">전치사 with 바로 뒤에 있으므로 who를 목적격 관계대명사 whom으로 고쳐야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 쓰는 문제예요. 잠시 멈추고 직접 고쳐 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 who를 whom으로 고치는 거예요. 전치사 바로 뒤에는 whom을 써야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 알맞게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">(ted / the movie / watched / yesterday / which / was / fun)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The movie which Ted watched yesterday was fun.\u003c/span>\u003cdiv class=\"g-exp\">선행사 the movie 뒤에 목적격 관계대명사절 which Ted watched yesterday가 이어지고 동사 was fun이 온다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"괄호 안의 단어들을 알맞게 배열해서 문장을 완성해 보는 문제예요. 화면을 보며 직접 순서를 맞춰 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 The movie which Ted watched yesterday was fun 이에요. 순서대로 잘 배열했나요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'우리가 초대한 손님은 늦게 도착했다.'를 영어로 영작하세요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The guest whom we invited arrived late.\u003c/span>\u003cdiv class=\"g-exp\">선행사 the guest와 목적격 관계대명사 whom, 주어동사 we invited를 쓰고 동사 arrived late를 연결합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"이번에는 우리말 뜻을 보고 직접 영어로 문장을 만들어 보는 영작 문제예요. 공책에 적어 보면서 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 The guest whom we invited arrived late예요. 목적격 관계대명사 whom을 활용해서 잘 만들었네요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Is this the pen ____ you are looking for?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>whom\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>who\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>which\u003c/button>\u003cbut
