</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson05","title":"중2 동아(윤) 중2 동아(윤) 5과 본문2","audioDir":"2_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>5과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Banksy's Green Tree: A Cry for Nature\u003c/h1>\u003ch2>뱅크시의 초록색 나무: 자연을 위한 외침\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>뱅크시는 잎이 없는 나무 뒤 벽에 초록색 페인트를 칠해 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전달하며, 위기에 처한 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">보호\u003c/b>의 필요성을 강조합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Banksy uses his street art to convey a message about the environmental crisis and the importance of caring for nature.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 영국의 전설적인 거리 예술가 뱅크시의 작품을 통해 사회적 메시지를 읽어볼 거예요. 핀즈베리 공원의 명물인 초록 나무 그림이 우리에게 어떤 이야기를 건네는지 요약과 요지를 통해 먼저 확인해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">뱅크시(Banksy)는 얼굴 없는 \u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>(Street Artist)로 유명하며, 주로 정치적, 사회적 풍자가 담긴 \u003cb class=\"key\">그래피티\u003c/b>(Graffiti)를 남깁니다. 그의 작품은 박물관이 아닌 일상적인 거리 벽면에 그려져 대중에게 강렬한 메시지를 전달합니다. 이번 작품인 핀즈베리 공원의 나무는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">파괴\u003c/b>(Environmental Destruction)를 시각적으로 비판하고 있습니다. 마치 죽어가는 식물에게 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>을 하는 것 같은 이 그림은 우리의 관심을 촉구합니다. 이는 예술이 단순히 아름다움을 넘어 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 이끌어낼 수 있음을 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"뱅크시는 전 세계적으로 유명하지만 얼굴은 알려지지 않은 신비로운 예술가예요. 주로 밤에 몰래 나타나 벽면에 그래피티를 그리곤 하는데, 그 그림 속에는 날카로운 사회 비판이 들어있습니다. 마치 우리가 평범하게 지나치던 담벼락이 갑자기 말을 거는 것 같은 느낌을 주죠. 오늘은 환경 파괴라는 아주 중요한 주제를 다룹니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>작품 및 작가 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>핀즈베리 공원에 있는 \u003cb class=\"key\">뱅크시\u003c/b>의 작품을 소개하며, 그의 작품이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 담고 있다는 특징을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>그림의 시각적 묘사\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">잎이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">나무\u003c/b> 뒤 벽에 초록 페인트를 칠한 기법과 \u003cb class=\"key\">분무기\u003c/b>를 든 사람의 모습을 구체적으로 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>메시지 해석 및 결론\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>그림을 통해 자연이 \u003cb class=\"key\">힘든 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 보내고 있음을 알리고, 우리가 \u003cb class=\"key\">자연을 \u003c/b>\u003cb class=\"key\">보호\u003c/b>해야 한다는 교훈을 전달합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 뱅크시의 작품을 소개하고 상세하게 묘사한 다음, 마지막에 그 의미를 분석하는 순서로 되어 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 핀즈베리 공원에 있는 뱅크시의 작품을 소개합니다. 이 작품은 단순한 그림이 아니라 사회적 메시지를 담고 있는 아주 좋은 예시라고 설명하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 그림의 상세한 모습을 묘사합니다. 잎이 다 떨어진 실제 나무 뒤에 초록색 페인트를 칠해 마치 나무에 잎이 무성한 것처럼 보이게 한 기법과 분무기를 든 사람에 대해 말하고 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째부터 일곱 번째 문장까지는 이 그림이 주는 교훈을 정리합니다. 자연이 현재 고통받고 있으며, 우리가 더 잘 돌봐야 한다는 결론에 도달하게 됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">뱅크시의 특정 작품을 \u003cb class=\"key\">시각적으로 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>한 뒤, 그 뒤에 숨겨진 \u003cb class=\"key\">의도와 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 설명하는 구조입니다. 다섯 번째 문장의 \u003cb class=\"key\">질문\u003c/b>을 통해 독자의 주의를 환기하고 마지막 부분에서 그 \u003cb class=\"key\">해답\u003c/b>이자 글의 핵심 주장을 제시합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What message does Banksy want to give us (5)\u003c/b>\u003cspan>독자의 관심을 끄는 질문\u003c/span>\u003cb>In many people's opinion (6)\u003c/b>\u003cspan>일반적인 해석 제시\u003c/span>\u003cb>They think (7)\u003c/b>\u003cspan>구체적인 주제 의식 전달\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Banksy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an internationally famous street artist\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Banksy's artworks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the green tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this painting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nature\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 작품을 묘사하며 시작해서 질문을 던지고 그에 대한 대답을 하는 질문 답변 구조를 가지고 있어요. 특히 마지막 부분에 핵심 주장이 나오는 미괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":8,"text":"다섯 번째 문장에서 What message로 시작하는 질문이 아주 중요한 신호입니다. 그 뒤에 많은 사람의 의견이라는 표현을 써서 객관적인 해석을 덧붙이고 They think로 결론을 맺고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>internationally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>국제적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>street artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리 예술가\u003c/span>\u003c/div>\ 의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">artwork\u003c/b>\u003cspan class=\"m\">예술 작품\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">masterpiece\u003c/span>\u003cspan class=\"s\">piece\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">carry\u003c/b>\u003cspan class=\"m\">담다, 전달하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"s\">transmit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opinion\u003c/b>\u003cspan class=\"m\">의견\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">view\u003c/span>\u003cspan class=\"s\">perspective\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"famous는 well-known이나 renowned로 바꿔 쓸 수 있고 반대말은 unknown입니다. 또한 artwork는 예술적 가치가 높은 작품을 뜻할 때 masterpiece와도 연결해서 외워두면 시험 대비에 아주 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이제 핀즈베리 공원에 있습니다\u003c/span>\u003cspan class=\"en\">We are now in Finsbury Park\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림을 보기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> a painting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Banksy의\u003c/span>\u003cspan class=\"en\">by \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Banksy, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국제적으로 유명한 거리 예술가인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an\u003c/span> internationally famous street artist.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로 독자들을 특정 \u003cb class=\"key\">장소\u003c/b>로 안내하며, 오늘 알아볼 중심 \u003cb class=\"key\">대상\u003c/b>인 Banksy를 소개하고 있습니다. Banksy가 세계적으로 유명한 \u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>라는 점을 강조하며 호기심을 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [see (동사원형)] : \"보기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : [Banksy (명사)] + , + [an... artist (명사구)] : \"Banksy인, 즉 ~한 예술가\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"We are now in Finsbury Park, 우리는 이제 핀즈베리 공원에 있습니다. to see a painting, 그림을 보기 위해. by Banksy, Banksy의. an internationally famous street artist, 국제적으로 유명한 거리 예술가인. 이 문장 전체를 해석하면, 우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다.","hl":"m"},{"n":12,"text":"여러분, 우리는 지금 핀즈베리 공원이라는 장소에 와 있어요. 바로 세계적으로 정말 유명한 거리 예술가 Banksy의 작품을 직접 확인해 보기 위해서죠.","hl":"mn"},{"n":13,"text":"이 문장에는 두 가지 포인트가 있어요. 첫 번째로 to see는 공원에 왜 왔는지 그 목적을 나타내는 to부정사의 부사적 용법이에요. 두 번째로 Banksy 뒤에 찍힌 콤마는 동격을 나타내서 Banksy가 국제적으로 유명한 예술가라는 것을 설명해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Banksy의 예술 작품들은\u003c/span>\u003cspan class=\"en\">Banksy's artworks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 사회적 메시지를 담고 있는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">carry\u003c/span> social messages,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 초록색 나무가\u003c/span>\u003cspan class=\"en\">and the green \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tree \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저쪽에 보이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> over there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 예입니다.\u003c/span>\u003cspan class=\"en\">is a good example.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Banksy 작품의 일반적인 \u003cb class=\"key\">특징\u003c/b>이 사회적 메시지를 전달하는 것임을 밝히고, 눈앞의 나무를 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 제시하고 있습니다. 독자가 작품의 \u003cb class=\"key\">의미\u003c/b>를 생각해보게끔 유도하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [often (빈도부사)] + [carry (일반동사)] : \"종종 담고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [the green tree (선행사)] + [(which/that)] + [you (주어)] + [see (동사)] : \"당신이 보는 나무\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Banksy's artworks, Banksy의 예술 작품들은. often carry social messages, 종종 사회적 메시지를 담고 있는데. and the green tree, 그리고 초록색 나무가. you see over there, 저쪽에 보이는. is a good example, 좋은 예입니다.. 이 문장 전체를 해석하면, Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다.","hl":"m"},{"n":15,"text":"Banksy는 단순히 예쁜 그림만 그리는 게 아니라 우리 사회에 중요한 메시지를 던지곤 해요. 지금 우리 눈앞에 보이는 저 초록색 나무가 그 메시지를 아주 잘 보여주는 예시죠.","hl":"mn"},{"n":16,"text":"문법을 살펴볼까요? 첫 번째로 빈도부사 often은 carry라는 일반동사 앞에 잘 위치해 있네요. 두 번째로 tree와 you 사이에는 목적격 관계대명사가 숨어 있어요. 그래서 여러분이 보는 나무라고 해석하며 tree를 꾸며주게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보시다시피\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> you can see,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 초록색 나무를 만들었습니다\u003c/span>\u003cspan class=\"en\">he created a green tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초록색 페인트를 뿌려서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">spraying\u003c/span> green paint\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벽에\u003c/span>\u003cspan class=\"en\">on a wall\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잎이 없는 나무 뒤쪽\u003c/span>\u003cspan class=\"en\">behind a \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leafless\u003c/span> tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Banksy가 실제 나무와 벽면의 페인트를 어떻게 \u003cb class=\"key\">조합\u003c/b>했는지 그 \u003cb class=\"key\">창작 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 묘사합니다. 죽어가는 \u003cb class=\"key\">잎 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">나무\u003c/b> 뒤에 페인트를 뿌려 마치 잎이 무성한 것처럼 보이게 한 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">장치\u003c/b>를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~하듯이/하다시피)\u003c/span> : [As (접속사)] + [you can see (주어+동사)] : \"보시다시피\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">by + -ing (방법/수단)\u003c/span> : by + [spraying (동명사)] : \"뿌림으로써 (뿌려서)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 파생 접미사 -less\u003c/span> : [leaf (명사)] + [-less (접미사)] : \"잎이 없는\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"As you can see, 보시다시피. he created a green tree, 그는 초록색 나무를 만들었습니다. by spraying green paint, 초록색 페인트를 뿌려서. on a wall, 벽에. behind a leafless tree, 잎이 없는 나무 뒤쪽. 이 문장 전체를 해석하면, 보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다.","hl":"m"},{"n":18,"text":"여러분도 보시는 것처럼 Banksy는 아주 독특한 방법으로 나무를 만들었어요. 잎이 하나도 없는 앙상한 나무 뒤쪽 벽에다가 초록색 페인트를 막 뿌려서 마치 풍성한 나무처럼 보이게 만든 거예요.","hl":"mn"},{"n":19,"text":"주요 어법을 세 가지 짚어볼게요. 첫 번째로 접속사 As는 여러분이 지금 보고 있는 상황을 말할 때 써요. 두 번째로 by spraying은 페인트를 뿌리는 방법을 통해 나무를 만들었다는 수단을 나타냅니다. 마지막으로 leafless는 명사 뒤에 접미사 less가 붙어서 잎이 없다는 뜻의 형용사가 된 단어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무 옆에는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Next \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람이 있습니다\u003c/span>\u003cspan class=\"en\">there is a person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분무기를 들고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">holding\u003c/span> a sprayer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무 바로 옆에 그려진 한 인물을 묘사하며, 이 인물이 가짜 잎(페인트)을 만든 주인공임을 암시합니다. \u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">부사구\u003c/b>가 앞에 나오고 사람을 꾸미는 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>가 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 부사구\u003c/span> : Next to [전치사] + the tree [명사] : \"그 나무 옆에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 (진행형)\u003c/span> : person [선행사] + who [주격 관계대명사] + is holding [동사] : \"들고 있는\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Next to the tree, 그 나무 옆에는. there is a person, 한 사람이 있습니다. who is holding a sprayer, 분무기를 들고 있는. 이 문장 전체를 해석하면, 그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다.","hl":"m"},{"n":21,"text":"이 문장은 그림 속에 나타난 인물의 위치와 모습을 아주 구체적으로 묘사하고 있어요. 장소 부사구와 주격 관계대명사라는 두 가지 중요한 문법이 사용된 문장입니다.","hl":"mn"},{"n":22,"text":"첫 번째로 문장 맨 앞에 나온 Next to the tree는 위치를 알려주는 장소 부사구예요. 두 번째로 나오는 who is holding 부분은 앞에 있는 명사를 수식하는 주격 관계대명사인데요. 사람이 지금 무언가를 하고 있는 상태임을 나타내기 위해 진행형을 함께 썼다는 점이 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 메시지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">message\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Banksy는 우리에게 주고 싶은 걸까요\u003c/span>\u003cspan class=\"en\">does Banksy want to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 그림을 통해\u003c/span>\u003cspan class=\"en\">through this painting?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림의 표면적인 모습을 넘어 그 안에 담긴 \u003cb class=\"key\">예술가의 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 독자에게 질문하며 흥미를 유발합니다. \u003cb class=\"key\">의문 \u003c/b>\u003cb class=\"key\">형용사\u003c/b> What이 명사를 수식하며 문장을 이끕니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문 형용사\u003c/span> : What [의문 형용사] + message [명사] : \"어떤 메시지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 동사의 수여 구조\u003c/span> : give [동사] + us [간접 목적어] : \"우리에게 주다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"What message, 어떤 메시지를. does Banksy want to give us, Banksy는 우리에게 주고 싶은 걸까요. through this painting?, 이 그림을 통해. 이 문장 전체를 해석하면, Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요?","hl":"m"},{"n":24,"text":"벽화 속에 담긴 Banksy의 진짜 속마음을 물어보는 질문이에요. 이 그림이 그냥 낙서가 아니라 우리에게 전달하려는 교훈이 있다는 걸 암시하죠.","hl":"mn"},{"n":25,"text":"첫 번째로 What message는 어떤 메시지라는 뜻의 의문 형용사 덩어리입니다. 두 번째로 give us 부분은 우리에게라는 대상이 먼저 나오는 사형식 구조의 일부라는 점을 기억하며 해석해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들의 의견에 따르면,\u003c/span>\u003cspan class=\"en\">In many people's opinion,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 우리에게 말하고 있습니다\u003c/span>\u003cspan class=\"en\">he is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">telling \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연이 힘든 시간을 보내고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> nature \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림에 대한 대중적인 해석을 제시합니다. 잎 없는 나무와 녹색 페인트는 자연의 \u003cb class=\"key\">고통\u003c/b>과 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">회복\u003c/b>을 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 동사와 명사절 접속사\u003c/span> : tell [동사] + us [간접 목적어] + that [접속사] + S + V [직접 목적어] : \"우리에게 ~라는 것을 말하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형 관용 표현\u003c/span> : be + having + a hard time : \"힘든 시간을 보내고 있다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"In many people's opinion, 많은 사람들의 의견에 따르면. he is telling us, 그는 우리에게 말하고 있습니다. that nature is having a hard time, 자연이 힘든 시간을 보내고 있다는 것을. 이 문장 전체를 해석하면, 많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다.","hl":"m"},{"n":27,"text":"사람들이 이 그림을 보고 느낀 점을 설명하고 있어요. 잎이 다 떨어진 나무는 고통받는 자연을 상징한다는 내용입니다.","hl":"mn"},{"n":28,"text":"첫 번째로 telling us that 부분을 보세요. 우리에게 무엇을 말하는지 그 내용을 명사절 접속사 that이 길게 연결해 주고 있어요. 두 번째는 is having a hard time인데요. 힘든 시간을 보내는 중이라는 의미를 생생하게 전달하기 위해 진행형을 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 우리가 ~하기를 원한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">he\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wants \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 더 잘 보살피기를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> better care of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뱅크시의 벽화를 본 사람들이 작가의 의도를 해석하는 부분입니다. 그림을 통해 우리가 \u003cb class=\"key\">자연\u003c/b>을 더 소중히 여기고 보호해야 한다는 \u003cb class=\"key\">교훈\u003c/b>을 전달하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think + [(that) 주어 + 동사 (목적어절)] : \"그들은 ~라고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장 (want + 목적어 + to부정사)\u003c/span> : want + [목적어] + [to부정사 (목적격 보어)] : \"우리가 ~하기를 원한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대명사의 지칭\u003c/span> : it = nature : \"그것(자연)을\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"They think, 그들은 생각합니다. he wants us, 그가 우리가 ~하기를 원한다고. to take better care of it, 그것을 더 잘 보살피기를.. 이 문장 전체를 해석하면, 그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.","hl":"m"},{"n":30,"text":"이 문장은 사람들이 뱅크시의 그림에서 읽어낸 핵심 메시지를 보여줘요. 작가가 그림을 통해 우리에게 자연을 더 아끼고 보살피라는 교훈을 주고 있다는 점을 강조하고 있죠.","hl":"mn"},{"n":31,"text":"첫 번째 포인트로 They think 다음에는 접속사 that이 생략되어 있어요. 그래서 뒤에 새로운 주어 he와 동사가 바로 나올 수 있는 것이죠. 두 번째로 wants us to take 부분은 아주 중요한 오형식 구조예요. want는 목적어 뒤에 목적격 보어로 반드시 to부정사를 써야 하거든요. 마지막으로 여기서 it은 앞에 나온 자연, 즉 nature를 가리키는 대명사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>핀즈베리 공원에는 \u003cb class=\"key\">국제적 \u003c/b>\u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>인 뱅크시의 벽화가 있습니다.\u003c/li>\u003cli>뱅크시는 \u003cb class=\"key\">잎이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">나무\u003c/b> 뒤에 초록색 페인트를 칠해 작품을 완성했습니다.\u003c/li>\u003cli>이 그림은 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">고통\u003c/b>이라는 시각적이고 사회적인 메시지를 담고 있습니다.\u003c/li>\u003cli>작가는 우리가 \u003cb class=\"key\">자연을 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">돌보아야\u003c/b> 한다는 점을 강조하고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Banksy uses his street art to convey a message about the environmental crisis and the importance of caring for nature.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">뱅크시는 잎이 없는 나무 뒤 벽에 초록색 페인트를 칠해 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전달하며, 위기에 처한 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">보호\u003c/b>의 필요성을 강조합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"뱅크시는 예술을 통해 우리에게 환경에 대한 책임감을 일깨워주고 있습니다. 오늘 배운 묘사 표현과 메시지 전달 방식을 잘 기억하면서 복습해 보세요. 여러분도 자연을 돌보는 마음을 가졌으면 좋겠네요. 수고 많았습니다!","hl":null}]}]});</script></body></html>
