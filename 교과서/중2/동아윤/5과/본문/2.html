9enPf8AHvS5l3X3oTlOWllFaXsnpey10vr+b2d7CAg+3bn8vQd+3580pOR64yefX8f50hx3IwTjqOoznOD0wBk9BjnikwdrgYJ5A79QOTnPPJJwPcgD5qiU9tbbSa6STtZL72+itotyUpP4ei72+Wu9+vU//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Banksy&#39;s Street Art: A Call to Protect Nature<small>뱅크시의 거리 예술: 자연을 보호하라는 외침</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 더 깊이 이해하시려면 먼저 거리 예술(Street Art)과 세계적인 익명 아티스트인 뱅크시(Banksy)에 대한 배경을 알아두시면 좋습니다. 뱅크시는 마치 사람들이 붐비는 광장에 커다란 대자보를 붙여 모두의 이목을 끄는 것처럼, 미술관이 아닌 길거리 벽이나 공공장소를 활용해 대중에게 강력한 사회적 메시지(Social Message)를 던지는 것으로 아주 유명하죠. 그는 주로 모양을 파낸 판을 대고 스프레이를 뿌리는 스텐실 기법(Stencil Technique)을 사용하는데, 이를 통해 환경 파괴(Environmental Destruction)나 자본주의 같은 무거운 주제를 누구나 알기 쉽게 풍자적으로 표현합니다. 따라서 지문에 등장하는 잎이 다 떨어진 실제 나무와 페인트로 그려진 초록색 잎의 대비 역시 단순한 길거리 낙서가 아니라, 마치 우리에게 아파하는 자연을 지켜달라고 호소하는 한 편의 환경 보호(Environmental Protection) 공익광고처럼 생각하고 읽어보시면 글의 숨은 의도가 훨씬 선명하게 다가올 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01작품 소개</div><ul><li>세계적인 거리 예술가 뱅크시의 작품과 그 특징을 소개한다.</li><li>유명한 거리 예술가(street artist) 뱅크시의 핀즈버리 공원 벽화</li><li>뱅크시의 예술 작품(artworks)은 종종 사회적 메시지(social messages)를 담고 있음</li><li>핵심 키워드: 사회적 메시지(social messages)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02벽화 묘사</div><ul><li>잎이 없는 나무와 녹색 페인트를 활용한 벽화의 구체적인 모습을 묘사한다.</li><li>잎이 없는 나무(leafless tree) 뒤의 벽에 녹색 페인트를 뿌려(spraying) 나무를 표현함</li><li>나무 옆에 분무기(sprayer)를 들고 있는 사람의 모습이 그려져 있음</li><li>핵심 키워드: 잎이 없는 나무(leafless tree)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03작품의 의미</div><ul><li>벽화에 담긴 뱅크시의 의도와 대중이 해석하는 환경 보호 메시지를 설명한다.</li><li>자연(nature)이 어려움을 겪고 있다는 것을 시각적으로 전달함</li><li>사람들이 자연을 더 잘 돌보기를(take better care of) 원한다는 의견을 제시함</li><li>핵심 키워드: 자연(nature)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">internationally</td><td class=\"m\">국제적으로, 세계적으로</td></tr><tr><td class=\"w\">artwork</td><td class=\"m\">예술품, 미술품</td></tr><tr><td class=\"w\">carry</td><td class=\"m\">전달하다, 지니다, 나르다</td></tr><tr><td class=\"w\">over there</td><td class=\"m\">저쪽에, 저기에</td></tr><tr><td class=\"w\">spray</td><td class=\"m\">뿌리다, 분사하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">leafless</td><td class=\"m\">잎이 없는</td></tr><tr><td class=\"w\">sprayer</td><td class=\"m\">분무기, 스프레이</td></tr><tr><td class=\"w\">in one&#39;s opinion</td><td class=\"m\">~의 의견으로는, ~의 생각에는</td></tr><tr><td class=\"w\">have a hard time</td><td class=\"m\">힘든 시간을 보내다, 어려움을 겪다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, 보살피다, 처리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이제 핀즈베리 공원에 있습니다</span><span class=\"en\"><b>We are now in Finsbury Park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Banksy의 그림을 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> a painting by Banksy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국제적으로 유명한 거리 예술가인</span><span class=\"en\"><b>an internationally famous street artist.</b></span></div></div><div class=\"lec-sent-ko\">우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글은 마치 가이드가 관람객에게 설명하는 것처럼 현장감 있게 시작하며 앞으로 다룰 중심 소재인 뱅크시의 벽화를 소개합니다. internationally famous street artist는 뱅크시가 어떤 인물인지 배경지식을 제공하여, 그의 작품이 전 세계적으로 주목받는 영향력 있는 예술임을 알려 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적). 구조: to + 동사원형. 문장에서 &#39;~하기 위해서&#39;라는 목적을 나타내는 부사 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">internationally</td><td class=\"m\">국제적으로, 세계적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있습니다</span><span class=\"en\"><b>Banksy’s artworks often carry social messages,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 저쪽에 보이는 초록색 나무가</span><span class=\"en\"><b>and the green <span class=\"grammar-hl\">tree you see</span> over there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 예입니다</span><span class=\"en\"><b>is a good example.</b></span></div></div><div class=\"lec-sent-ko\">Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 뱅크시가 단순히 그림만 그리는 것이 아니라, carry social messages, 즉 작품 속에 현실 사회에 대해 생각할 거리를 던져 준다는 점을 설명합니다. 그리고 관람객의 시선을 &#39;초록색 나무&#39; 작품으로 이끌며 본격적인 작품 해설로 자연스럽게 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tree you see (관계대명사(생략)): 명사(선행사)인 tree와 주어+동사인 you see 사이에 목적격 관계대명사(that 또는 which)가 생략된 구조이다. 뒤의 절이 앞의 명사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artwork</td><td class=\"m\">예술품, 미술품</td></tr><tr><td class=\"w\">carry</td><td class=\"m\">전달하다, 지니다, 나르다</td></tr><tr><td class=\"w\">over there</td><td class=\"m\">저쪽에, 저기에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보시다시피</span><span class=\"en\"><b><span class=\"grammar-hl\">As</span> you can see,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 초록색 나무를 만들었습니다</span><span class=\"en\"><b>he created a green tree</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초록색 페인트를 뿌려서</span><span class=\"en\"><b><span class=\"grammar-hl\">by spraying</span> green paint</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎이 없는 나무 뒤쪽 벽에</span><span class=\"en\"><b>on a wall behind a leafless tree.</b></span></div></div><div class=\"lec-sent-ko\">보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 &#39;초록색 나무&#39; 작품이 구체적으로 어떻게 생겼는지 시각적으로 묘사하는 문장입니다. by spraying green paint on a wall behind a leafless tree는 실제로는 잎이 다 떨어져 앙상하게 메마른 진짜 나무가 있고, 그 뒤편 담벼락에 초록 잎을 그려 넣어 멀리서 보면 마치 생명력 있는 나무처럼 착시 효과를 냈다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As 접속사: &#39;~하다시피&#39;, &#39;~처럼&#39;의 의미를 가진 접속사로 쓰여 뒤에 주어와 동사(you can see)가 갖춰진 절을 이끈다.</div><div class=\"lec-gr-item\">by spraying (관용표현(동명사)): 전치사(by) + 동명사(-ing) 구조. 전치사 by의 목적어로 명사 역할을 하는 동명사 spraying이 쓰였으며, &#39;~함으로써&#39;라는 방법이나 수단을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spray</td><td class=\"m\">뿌리다, 분사하다</td></tr><tr><td class=\"w\">leafless</td><td class=\"m\">잎이 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 나무 옆에는</span><span class=\"en\"><b>Next to the tree,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람이 한 명 있습니다</span><span class=\"en\"><b>there is a person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분무기를 들고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> <span class=\"grammar-hl\">is holding</span> a sprayer.</b></span></div></div><div class=\"lec-sent-ko\">그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 작품의 세부 묘사를 추가하고 있습니다. a person who is holding a sprayer는 담벼락에 가짜 잎사귀를 그려 넣은 주체마저도 작품 속에 함께 그려져 있음을 보여 주며, 이 초록색이 자연적인 생명력이 아니라 인간이 인위적으로 만들어 낸 색칠에 불과함을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사. 앞의 명사(선행사) a person을 수식하는 관계대명사절을 이끌며, 절 내부에서 주어 역할을 하므로 바로 뒤에 동사(is holding)가 이어진다.</div><div class=\"lec-gr-item\">is holding (현재진행): be동사(is) + -ing(holding) 구조로, 진행 중인 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spray</td><td class=\"m\">뿌리다, 분사하다</td></tr><tr><td class=\"w\">sprayer</td><td class=\"m\">분무기, 스프레이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Banksy는 우리에게 어떤 메시지를 전하고 싶은 걸까요</span><span class=\"en\"><b><span class=\"grammar-hl\">What message</span> does Banksy want <span class=\"grammar-hl\">to give</span> us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 그림을 통해</span><span class=\"en\"><b>through this painting?</b></span></div></div><div class=\"lec-sent-ko\">Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 작품 겉모습 묘사에서 벗어나, 두 번째 문장에서 언급했던 &#39;사회적 메시지&#39;가 구체적으로 무엇인지 질문을 던지며 글의 흐름을 전환합니다. 청자의 호기심을 유발하고 다음 문장에서 나올 해석에 집중하게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What message (의문형용사): 의문사 What이 뒤의 명사 message를 수식하여 하나의 목적어 덩어리를 이루며, 의문문 구조에 따라 문장의 맨 앞으로 이동했다.</div><div class=\"lec-gr-item\">to give (to부정사): 명사적 용법. 구조: to + 동사원형. 문장에서 타동사 want의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들의 의견에 따르면</span><span class=\"en\"><b>In many people’s opinion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 우리에게 말하고 있습니다</span><span class=\"en\"><b>he is <span class=\"grammar-hl\">telling us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연이 힘든 시간을 보내고 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> nature <span class=\"grammar-hl\">is having</span> a hard time.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 사람들의 보편적인 해석을 답변으로 제시합니다. nature is having a hard time을 직역하면 자연이 힘든 시간을 보낸다는 뜻으로, 쉽게 말해 인간의 행동 때문에 실제 자연 환경이 생명력을 잃고 심각하게 훼손되어 고통받고 있는 현실을 빗대어 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">telling us that 4형식 구조 및 명사절 접속사: 수여동사 tell + 간접목적어(us) + 직접목적어(that절) 구조이다. that은 직접목적어 역할을 하는 명사절(완전한 절)을 이끄는 접속사이다.</div><div class=\"lec-gr-item\">is having (현재진행): be동사(is) + -ing(having) 구조로, 현재 진행 중인 상태나 동작을 나타낸다.</div><div class=\"lec-gr-item\">have a hard time (관용표현): &#39;어려움을 겪다&#39; 또는 &#39;힘든 시간을 보내다&#39;라는 의미로 쓰이는 동사구 숙어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각합니다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 우리가 자연을 더 잘 보살피기를 원한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">he wants</span> us <span class=\"grammar-hl\">to take</span> better care of it.</b></span></div></div><div class=\"lec-sent-ko\">그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론부에 해당하며, 작품의 메시지를 통해 우리가 궁극적으로 어떤 행동을 취해야 하는지 보여 줍니다. take better care of it은 죽어가는 나무 옆에 페인트칠로 흉내만 내는 방식을 넘어, 앙상해진 진짜 자연을 우리가 앞장서서 아끼고 보호해야 한다는 의미를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">think he wants 명사절 접속사(생략): 동사 think의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 think와 he 사이에 생략된 구조이다.</div><div class=\"lec-gr-item\">wants us to take 5형식(SVOC) 구조: 주어 + 동사(wants) + 목적어(us) + 목적격보어(to take)로 이루어진 5형식 구조이다. 동사 want는 목적어의 동작을 설명하는 목적격보어로 to부정사를 취한다.</div><div class=\"lec-gr-item\">to take (to부정사): 5형식 문형에서 동사 want의 목적격보어 자리에 쓰인 to부정사(to + 동사원형)이다.</div><div class=\"lec-gr-item\">take better care of (관용표현): &#39;~을 돌보다&#39;라는 의미의 숙어 &#39;take care of&#39;에 비교급 형용사 better가 더해져 &#39;~을 더 잘 돌보다&#39;라는 의미를 구성한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>핀즈베리 공원에 있는 유명 거리 예술가 뱅크시의 벽화를 감상하는 상황으로 글이 시작된다.</li><li>뱅크시는 평소 사회적 메시지를 던지는 것으로 유명하며, 이번 &#39;초록색 나무&#39; 작품 역시 그 연장선에 있다.</li><li>앙상하게 메마른 실제 나무 뒤 벽에 페인트를 뿌려 억지로 초록색 나무처럼 보이게 만든 작품의 형태를 묘사한다.</li><li>사람들은 이를 통해 뱅크시가 현재 고통받고 있는 자연의 현실을 꼬집으며, 우리가 환경을 더 적극적으로 돌봐야 한다는 메시지를 전하고 있다고 해석한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Banksy highlights the crisis of nature through his street art, and he urges people to take better care of the environment.</div>\n              <div class=\"lec-final-sum-ko\">뱅크시는 거리 예술을 통해 자연의 위기를 강조하며, 사람들에게 환경을 더 잘 돌볼 것을 촉구한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"
