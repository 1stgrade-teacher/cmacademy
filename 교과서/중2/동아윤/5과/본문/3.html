@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson05","title":"중2 동아(윤) 중2 동아(윤) 5과 본문3","audioDir":"3_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>5과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Tiny Art, Big Joy: Ben Wilson's Gum Paintings\u003c/h1>\u003ch2>작은 예술, 큰 기쁨: 벤 윌슨의 껌 그림들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>길에 버려진 껌에 그림을 그려 사람들의 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전달하고 \u003cb class=\"key\">기쁨\u003c/b>을 주는 예술가 Ben Wilson의 독특한 거리 예술을 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ben Wilson creates meaningful tiny artworks on discarded chewing gum to bring happiness to people.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 런던의 Muswell Hill로 떠나서 아주 특별하고 귀여운 예술을 만나볼 거예요. 이번 지문에서는 버려진 쓰레기가 어떻게 따뜻한 예술 작품이 되는지, 그 요지와 핵심 내용을 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 \u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술\u003c/b> (Street Art)의 한 종류인 껌 그림을 다룹니다. 보통 거리 예술이라고 하면 벽에 그리는 커다란 \u003cb class=\"key\">그라피티\u003c/b> (Graffiti)를 떠올리기 쉽지만, Ben Wilson은 발밑의 아주 작은 쓰레기에 주목했습니다. 이는 버려지는 물건에 가치를 더해 새로운 작품으로 만드는 \u003cb class=\"key\">업사이클링\u003c/b> (Upcycling)의 한 형태라고 볼 수 있습니다. 마치 회색빛 도시의 갈라진 틈 사이로 피어난 작은 \u003cb class=\"key\">채송화\u003c/b>를 발견했을 때처럼, 예상치 못한 장소에서 만나는 이 작은 예술은 일상에 지친 사람들에게 따뜻한 위로를 건넵니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 길바닥에 붙어 있는 시커먼 껌을 보고 눈살을 찌푸린 적 있나요? 보통은 지저분하다고 생각하지만, Ben Wilson이라는 예술가는 이 껌을 세상에 하나뿐인 캔버스로 삼았어요. 이것을 거리 예술의 한 종류인 껌 그림이라고 하는데, 도시의 흉물을 예술로 바꾸는 업사이클링의 가치를 담고 있죠. 마치 삭막한 보도블록 사이에서 발견한 네잎클로버처럼 우리에게 소소한 행복을 준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>투어의 마지막 장소\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>오늘 투어의 마지막 장소인 \u003cb class=\"key\">머스웰 \u003c/b>\u003cb class=\"key\">힐\u003c/b>에 도착하여, 주변을 자세히 보라고 권하며 \u003cb class=\"key\">주의\u003c/b>를 집중시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>껌 그림과 작가 소개\u003csmall>주제 소개 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>작은 \u003cb class=\"key\">껌 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 발견했는지 묻고, 이것이 예술가 \u003cb class=\"key\">Ben \u003c/b>\u003cb class=\"key\">Wilson\u003c/b>의 작품임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작업의 특징과 예시\u003csmall>상세 설명 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>길에 버려진 껌에 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 담아 그리는 방식과 생일 축하 메시지 같은 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>예술의 가치와 마무리\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>비록 크기는 \u003cb class=\"key\">작지만\u003c/b> 많은 사람에게 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>을 준다는 가치를 전달하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 여행지의 마지막 장소를 소개하며 독자들을 발밑의 신비로운 예술 세계로 안내하는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째부터 세 번째 문장까지는 투어의 마지막 코스인 Muswell Hill에 도착해서 주변을 자세히 살펴보라고 권하며 호기심을 유발합니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 바닥에 있는 작은 껌 그림들을 발견했는지 물으며, 이것이 Ben Wilson이라는 작가의 작품임을 소개하죠.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장에서는 사람들이 무심코 버린 껌 위에 사람들의 사연을 담는 작가의 독특한 작업 방식과 생일 축하 메시지 같은 구체적인 예시를 보여줍니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째 문장에서는 이 그림들이 비록 크기는 아주 작지만, 많은 사람들에게 큰 기쁨을 준다는 정서적 가치를 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글 전체가 Ben Wilson이라는 특정 예술가의 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 중심으로 전개됩니다. 도입부에서 호기심을 유발한 뒤 예시를 통해 내용을 구체화하고, 마지막 문장에서 이 활동의 \u003cb class=\"key\">궁극적인 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 요약하는 구조를 취하고 있습니다. 버려진 껌이라는 사소한 소재가 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>로 승화되는 과정을 보여줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (8)\u003c/b>\u003cspan>구체적인 메시지의 사례를 제시함\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">street artworks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the little chewing gum paintings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">gum paintings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the one over here\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Wilson's gum paintings\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문을 던지고 답을 하는 방식으로 시작해서 구체적인 사례를 나열하는 예시 중심의 구조를 가지고 있어요. 특히 마지막 문장에서 전체 내용을 정리하며 주제를 드러내는 미괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":9,"text":"여덟 번째 문장의 For example이라는 연결어를 통해 앞서 말한 개인적인 메시지의 구체적인 사례가 나옴을 알 수 있어요. 또한 street artworks에서 chewing gum paintings로 이어지는 재진술 표현들을 따라가면 글의 핵심 소재를 쉽게 파악할 수 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>final\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마지막의\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소, 정거장\u003c/span>\u003c/div>\u003cdiv>\u003cb>tour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행, 투어\u003c/span>\u003c/div>\u003cdiv>\u003cb>Muswell Hill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>머스웰 힐 (지명)\u 지 \u003cb class=\"key\">사례\u003c/b>를 들어 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사\u003c/span> : the one = the gum painting : \"그 그림\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : loved [과거분사] + one [명사] : \"사랑받는 (사랑하는)\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For example, 예를 들어. the one over here, 여기 있는 그림은. is a happy birthday wish, 생일 축하 메시지입니다. for a loved one, 사랑하는 사람을 위한. 이 문장 전체를 해석하면, 예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.","hl":"m"},{"n":34,"text":"앞 문장에서 말한 개인적인 메시지의 구체적인 예시를 보여주고 있어요. 여기 있는 껌 그림 하나가 누군가에게는 소중한 생일 축하 선물이 된 것이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 the one은 앞에 나온 gum painting을 대신하는 부정대명사예요. 두 번째로 loved는 사랑받는이라는 수동의 의미를 가진 과거분사로 뒤의 명사를 수식하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Wilson의 껌 그림들은\u003c/span>\u003cspan class=\"en\">Wilson's gum paintings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 작지만,\u003c/span>\u003cspan class=\"en\">are tiny,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들에게 줍니다\u003c/span>\u003cspan class=\"en\">but they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 기쁨을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">pleasure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림의 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">크기\u003c/b>와 그것이 주는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 대조하며 글을 마무리합니다. 작은 예술이 주는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식을 3형식으로 전환\u003c/span> : give [동사] + great pleasure [직접목적어] + to [전치사] + many people [간접목적어] : \"많은 사람에게 큰 기쁨을 주다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Wilson's gum paintings, Wilson의 껌 그림들은. are tiny, 아주 작지만. but they give, 많은 사람들에게 줍니다. great pleasure, 큰 기쁨을. to many people. 이 문장 전체를 해석하면, Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.","hl":"m"},{"n":37,"text":"이 지문의 결론이에요. 껌 그림은 비록 크기는 아주 작지만, 그 속에 담긴 따뜻한 마음 덕분에 많은 사람에게 큰 행복을 준다는 감동적인 마무리입니다.","hl":"mn"},{"n":38,"text":"마지막 부분의 give great pleasure to many people을 잘 봐두세요. 주다라는 동사 give 뒤에 사물 목적어가 먼저 오고 전치사 to와 사람이 뒤에 오는 삼형식 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">머스웰 \u003c/b>\u003cb class=\"key\">힐\u003c/b> 투어의 마지막 정거장에서 발견할 수 있는 독특한 거리 예술을 소개합니다.\u003c/li>\u003cli>예술가 \u003cb class=\"key\">Ben \u003c/b>\u003cb class=\"key\">Wilson\u003c/b>은 사람들이 길에 버린 \u003cb class=\"key\">껌\u003c/b> 위에 그림을 그리는 것으로 유명합니다.\u003c/li>\u003cli>그의 껌 그림들은 길에서 만난 사람들의 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>나 축하를 담고 있습니다.\u003c/li>\u003cli>껌 그림은 비록 \u003cb class=\"key\">작지만\u003c/b> 많은 사람들에게 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>과 감동을 전달합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ben Wilson creates meaningful tiny artworks on discarded chewing gum to bring happiness to people.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">길에 버려진 껌에 그림을 그려 사람들의 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전달하고 \u003cb class=\"key\">기쁨\u003c/b>을 주는 예술가 Ben Wilson의 독특한 거리 예술을 소개합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 오늘 우리는 벤 윌슨의 껌 그림을 통해 작고 사소한 것에서도 큰 기쁨을 찾을 수 있다는 것을 배웠어요. 여러분도 오늘 하굣길에는 주변을 조금 더 자세히 살펴보며 소소한 행복을 발견해 보길 바랍니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
