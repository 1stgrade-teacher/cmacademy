을 소개한다.</li><li>예술가 벤 윌슨(Ben Wilson)의 작품임</li><li>사람들이 길에 버린 껌(gum) 위에 그림을 그리는 것으로 유명함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03껌 페인팅의 특징과 예시</div><ul><li>그의 작품은 길에서 만난 사람들의 사연과 메시지를 담고 있다.</li><li>사람들의 개인적 메시지(personal messages)를 작품에 담음</li><li>예시: 사랑하는 사람을 위한 생일 축하(happy birthday wish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04작품의 의의와 가치</div><ul><li>벤 윌슨의 껌 페인팅은 크기가 작아도 사람들에게 큰 감동을 준다.</li><li>작품의 크기는 매우 작음(tiny)</li><li>많은 사람에게 큰 기쁨(great pleasure)을 선사함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artwork</td><td class=\"m\">예술품, 미술품</td></tr><tr><td class=\"w\">look down</td><td class=\"m\">아래를 내려다보다, 밑을 보다</td></tr><tr><td class=\"w\">look closely</td><td class=\"m\">자세히 보다, 주의 깊게 살피다</td></tr><tr><td class=\"w\">be well known for</td><td class=\"m\">~로 잘 알려지다, ~로 유명하다</td></tr><tr><td class=\"w\">drop</td><td class=\"m\">떨어뜨리다, 흘리다, 무심코 버리다</td></tr><tr><td class=\"w\">carry</td><td class=\"m\">(메시지 등을) 지니다, 담다, 전하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">personal</td><td class=\"m\">개인적인, 사적인, 개인의</td></tr><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">loved one</td><td class=\"m\">사랑하는 사람, 가족</td></tr><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 조그마한</td></tr><tr><td class=\"w\">pleasure</td><td class=\"m\">기쁨, 즐거움, 만족감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘 우리 투어의 마지막 장소는</span><span class=\"en\"><b><span class=\"grammar-hl\">The final stop of our tour today</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">머스웰 힐입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> Muswell Hill.</b></span></div></div><div class=\"lec-sent-ko\">오늘 우리 투어의 마지막 장소는 머스웰 힐입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 투어 가이드가 관광객들에게 투어의 마지막 장소를 안내하며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The final stop of our tour today 명사구 주어: 전치사구(of our tour)와 부사(today)가 핵심 명사(stop)를 수식하여 긴 주어부를 형성한다.</div><div class=\"lec-gr-item\">is 2형식 동사: 주어(The final stop)와 주격 보어(Muswell Hill)를 연결하는 불완전 자동사(be동사)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 거리 예술 작품도 보이지 않나요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Can’t see</span> <span class=\"grammar-hl\">any</span> street artworks?</b></span></div></div><div class=\"lec-sent-ko\">어떤 거리 예술 작품도 보이지 않나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 도착한 장소에서 보통 기대할 법한 크고 눈에 띄는 길거리 예술 작품이 없다는 점을 짚어 주며, 관광객들의 호기심을 유도하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can’t see 주어 생략 의문문: 구어체에서 주어(You)가 생략되고 조동사부정(Can&#39;t)과 동사원형(see)으로 시작하는 구조이다.</div><div class=\"lec-gr-item\">any 수량 형용사: 의문문이나 부정문에서 주로 쓰여 명사(street artworks)를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artwork</td><td class=\"m\">예술품, 미술품</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래를 내려다보고 자세히 살펴보세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">look down and look closely</span>.</b></span></div></div><div class=\"lec-sent-ko\">그렇다면, 아래를 내려다보고 자세히 살펴보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 큰 벽화 같은 것을 찾고 있는 관광객들에게 시선을 발밑으로 향하게 하여, 작품이 예상치 못한 곳에 숨어 있음을 알려주는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look down and look closely 명령문 및 병렬구조: 주어(You)가 생략된 동사원형(look)으로 시작하는 명령문이며, 접속사 and가 두 동사구를 대등하게 연결한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look down</td><td class=\"m\">아래를 내려다보다, 밑을 보다</td></tr><tr><td class=\"w\">look closely</td><td class=\"m\">자세히 보다, 주의 깊게 살피다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작은 껌 그림들이 보이나요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you see</span> the little <span class=\"grammar-hl\">chewing</span> gum paintings?</b></span></div></div><div class=\"lec-sent-ko\">작은 껌 그림들이 보이나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the little chewing gum paintings는 바닥에 납작하게 들러붙어 있는 껌딱지 위에 그려진 아주 작은 그림들을 가리킵니다. 관광객들의 시선을 아래로 이끈 뒤, 본격적으로 이번 장소의 핵심 볼거리를 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you see 일반동사 의문문: 조동사 Do + 주어(you) + 일반동사 원형(see) 형태의 구조이다.</div><div class=\"lec-gr-item\">chewing (동명사(명사적)): -ing가 &#39;씹기 위한&#39;이라는 용도의 명사적 개념으로 명사(gum)를 꾸미는 복합명사(chewing gum) 구조를 이룬다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것들은 예술가 Ben Wilson의 작품입니다.</span><span class=\"en\"><b>They are by <span class=\"grammar-hl\">the artist Ben Wilson</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것들은 예술가 Ben Wilson의 작품입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 발견한 껌 그림을 누가 그렸는지 작가의 이름을 소개하며 상세한 배경 설명을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the artist Ben Wilson (동격): 명사구(the artist)와 고유명사(Ben Wilson)가 나란히 위치하여 동일한 대상을 설명하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Wilson은 잘 알려져 있습니다</span><span class=\"en\"><b>Wilson <span class=\"grammar-hl\">is well known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">껌에 그림을 그리는 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">for painting</span> pictures on gum</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 버리는</span><span class=\"en\"><b><span class=\"grammar-hl\">that people drop</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길에</span><span class=\"en\"><b>on the street.</b></span></div></div><div class=\"lec-sent-ko\">Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> painting pictures on gum that people drop on the street는 누군가 뱉어 버린 지저분한 껌딱지를 도화지 삼아 예술 작품을 만들어내는 작가의 독특한 작업 방식을 보여 줍니다. 이 작가가 왜 유명한지 그 구체적인 이유를 뒷받침해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is well known (수동태): be동사(is) + p.p.(known) 구조. know는 타동사인데 뒤에 목적어가 없어서 수동구조 is known 형태로 쓴다. 기본구조: know + O(목적어) + for B (O를 B로/때문에 알다).</div><div class=\"lec-gr-item\">for painting (동명사): -ing가 명사 역할을 하여 전치사 for의 목적어로 쓰인 구조이다.</div><div class=\"lec-gr-item\">that people drop (관계대명사): that이 이끄는 목적격 관계대명사절. that절이 앞 명사(gum)를 수식하며, 절 내부에서 타동사 drop의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drop</td><td class=\"m\">떨어뜨리다, 흘리다, 무심코 버리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 껌 그림들은 종종 개인적인 메시지를 담고 있습니다</span><span class=\"en\"><b>His gum paintings <span class=\"grammar-hl\">often carry</span> personal messages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 만나는 사람들의</span><span class=\"en\"><b>from <span class=\"grammar-hl\">people he meets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길에서</span><span class=\"en\"><b>on the street.</b></span></div></div><div class=\"lec-sent-ko\">그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작가가 단지 그림만 그리는 것이 아니라, 작업 중에 마주치는 평범한 행인들의 사연이나 이야기를 작품 속에 녹여낸다는 점을 설명하여 작품이 가지는 의미를 한층 확장하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">often carry 빈도부사 위치: 빈도를 나타내는 부사(often)가 일반동사(carry) 바로 앞에 위치한 구조이다.</div><div class=\"lec-gr-item\">people he meets 목적격 관계대명사 생략: 선행사 people과 주어 he 사이에 목적격 관계대명사(whom/that)가 생략된 구조로, 관계사절(he meets on the street)이 앞 명사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carry</td><td class=\"m\">(메시지 등을) 지니다, 담다, 전하다</td></tr><tr><td class=\"w\">personal</td><td class=\"m\">개인적인, 사적인, 개인의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기 있는 그림은</span><span class=\"en\"><b><span class=\"grammar-hl\">the one</span> over here</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생일 축하 메시지입니다</span><span class=\"en\"><b>is a happy birthday wish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑하는 사람을 위한</span><span class=\"en\"><b>for a <span class=\"grammar-hl\">loved one</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 말한 행인들의 사연이 담긴 메시지의 구체적인 사례를 보여 주는 문장입니다. 길을 가던 누군가가 사랑하는 사람의 생일을 축하해 달라고 부탁한 내용을 껌 그림으로 표현한 장면을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the one (부정대명사): 앞에 나온 명사구(gum painting)와 같은 종류의 불특정한 단수 명사를 대신하여 쓰인 대명사이다.</div><div class=\"lec-gr-item\">loved one (과거분사(형용사)): p.p.(loved)가 뒤의 명사(one)를 수식하여 &#39;사랑받는 사람&#39;이라는 의미를 나타낸다. p.p. + N 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">loved one</td><td class=\"m\">사랑하는 사람, 가족</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Wilson의 껌 그림들은 아주 작지만,</span><span class=\"en\"><b>Wilson’s gum paintings are tiny,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 기쁨을 줍니다</span><span class=\"en\"><b>but they <span class=\"grammar-hl\">give great pleasure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to many people</span>.</b></span></div></div><div class=\"lec-sent-ko\">Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하면서, 버려진 작은 껌딱지에 불과하지만 그 위에 담긴 따뜻한 메시지와 예술성 덕분에 길을 지나는 사람들에게 소소하고도 큰 행복을 전해 준다는 주제를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give great pleasure to many people 3형식 전환 구조: 기본구조인 4형식(수여동사 give + 간접목적어 + 직접목적어)에서, 직접목적어(great pleasure)가 먼저 오고 간접목적어(many people) 앞에 전치사 to를 붙여 3형식으로 전환한 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 조그마한</td></tr><tr><td class=\"w\">pleasure</td><td class=\"m\">기쁨, 즐거움, 만족감</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>투어 가이드가 마지막 목적지인 머스웰 힐에서 볼 수 있는 특별한 거리 예술을 소개한다.</li><li>예술가 벤 윌슨은 길바닥에 버려진 작은 껌딱지 위에 그림을 그린다.</li><li>이 그림들에는 지나가는 사람들의 소소하고 개인적인 사연이 담겨 있다.</li><li>길거리에 버려진 껌에 그려진 아주 작은 그림들이지만, 사람들에게는 큰 기쁨과 감동을 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ben Wilson creates miniature paintings on dropped chewing gum, and these tiny artworks bring great pleasure to the public.</div>\n              <div class=\"lec-final-sum-ko\">벤 윌슨은 버려진 껌 위에 미니어처 그림을 그리고, 이 작은 예술 작품들은 대중에게 큰 기쁨을 준다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/
