@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson05","title":"중2 동아(윤) 중2 동아(윤) 5과 본문1","audioDir":"1_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(윤)\u003cbr>5과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Street Art in Shoreditch: A Journey Through Time with STIK\u003c/h1>\u003ch2>쇼어디치의 거리 예술: STIK과 함께하는 시간 여행\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>런던 \u003cb class=\"key\">쇼어디치\u003c/b>의 현대 \u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 화가 \u003cb class=\"key\">STIK\u003c/b>의 작품에 담긴 의미를 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Modern street art in Shoreditch reflects the area's transformation and history through unique artistic expressions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 런던의 거리를 화려하게 수놓은 현대 예술의 세계로 떠나볼 거예요. 쇼어디치라는 아주 특별한 장소에서 만나는 거리 예술의 매력을 요약과 요지를 통해 먼저 확인해 봅시다. 이 글은 단순히 그림을 소개하는 것을 넘어, 도시의 변화와 예술적 상징을 다루고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">런던의 \u003cb class=\"key\">쇼어디치(Shoreditch)\u003c/b>는 과거 가난한 노동자들이 거주하던 낙후된 지역이었으나, 현재는 예술가들의 성지로 탈바꿈한 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생(Urban \u003c/b>\u003cb class=\"key\">Regeneration)\u003c/b>의 대표 사례입니다. 이곳의 건물 외벽에 그려진 \u003cb class=\"key\">그라피티(Graffiti)\u003c/b>는 단순한 낙서가 아니라 지역의 정체성을 담은 \u003cb class=\"key\">공공 \u003c/b>\u003cb class=\"key\">미술(Public \u003c/b>\u003cb class=\"key\">Art)\u003c/b>로 인정받습니다. 거리 예술가 STIK은 인체를 선과 점으로만 단순하게 표현하는 \u003cb class=\"key\">미니멀리즘(Minimalism)\u003c/b> 기법을 사용하며, 사회적인 메시지를 담아내는 것으로 유명합니다. 이 글은 마치 오래된 헌 집을 개조해 세련된 갤러리로 만드는 과정처럼, 도시의 변화를 예술을 통해 설명하고 있습니다. 거리 예술은 도시의 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">활력\u003c/b>을 높일 뿐만 아니라 과거와 현재를 잇는 역사적 단서가 되기도 합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 쇼어디치라는 동네를 알아야 해요. 이곳은 원래 가난한 노동자들이 모여 살던 곳이었지만, 지금은 도시 재생을 통해 가장 힙한 예술 거리로 탈바꿈했습니다. 거리 예술은 이렇게 낙후된 공간에 시각적 활력을 불어넣는 역할을 하죠. 특히 오늘 만나볼 작가 STIK은 선과 점만으로 인간의 감정을 표현하는 미니멀리즘의 대가입니다. 마치 오래된 가구에 세련된 손잡이 하나를 달아 완전히 새롭게 보이게 만드는 것과 같다고 이해하면 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현대 거리 예술의 도입\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>현대 거리 예술의 다양한 형태와 도시에서의 역할을 언급하며 탐방지인 \u003cb class=\"key\">쇼어디치\u003c/b>를 소개합니다. 거리 예술이 도시를 \u003cb class=\"key\">다채롭고 \u003c/b>\u003cb class=\"key\">활기차게\u003c/b> 만든다는 점을 강조합니다. 독자를 런던의 구체적인 장소로 \u003cb class=\"key\">안내\u003c/b>하며 흥미를 유발합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>쇼어디치의 과거와 현재\u003csmall>배경 설명 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>가난한 노동자들이 살던 과거에서 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">힙한 \u003c/b>\u003cb class=\"key\">지역\u003c/b>으로 변모한 쇼어디치의 \u003cb class=\"key\">대조적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 보여줍니다. 이러한 변화 덕분에 이곳에서 많은 \u003cb class=\"key\">멋진 \u003c/b>\u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">작품\u003c/b>을 찾을 수 있음을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작가 STIK의 특징\u003csmall>상세 예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>구체적인 작품 하나를 지목하며 예술가 \u003cb class=\"key\">STIK\u003c/b>을 소개합니다. 그는 \u003cb class=\"key\">선과 \u003c/b>\u003cb class=\"key\">점\u003c/b>만을 사용하여 인체를 그리는 아주 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">화풍\u003c/b>으로 유명하다는 정보를 제공합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>작품 속 상징과 단서\u003csmall>해석 및 결론 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>작품 속 세 인물이 각각 \u003cb class=\"key\">과거, \u003c/b>\u003cb class=\"key\">현재, \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 상징한다는 심층적 의미를 설명합니다. 인물들의 \u003cb class=\"key\">눈\u003c/b>이 어떤 시점을 나타내는지 알아내는 \u003cb class=\"key\">단서\u003c/b>가 된다는 점을 알려주며 끝을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 이제 지문이 어떤 순서로 이야기를 들려주는지 전체적인 흐름을 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 세 번째 문장까지는 현대 거리 예술이 도시를 활기차게 만든다는 점을 짚으며 우리가 방문할 쇼어디치를 소개합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째와 다섯 번째 문장에서는 쇼어디치의 과거와 현재를 대조하며 이곳이 왜 예술 작품들로 가득 차게 되었는지 배경을 설명해 줘요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째 문장부터 여덟 번째 문장에서는 작가 STIK의 독특한 화풍에 주목합니다. 선과 점만으로 인체를 그린다는 특징을 꼭 기억하세요.","hl":"f2"},{"n":7,"text":"마지막 단계인 아홉 번째 문장부터 끝까지는 작품 속 인물들이 상징하는 과거, 현재, 미래의 의미를 찾고, 눈이라는 단서를 통해 이를 구별하는 법을 알려줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 및 설명\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술\u003c/b>의 일반적인 정의와 긍정적인 효과를 먼저 제시합니다. 이후 런던의 \u003cb class=\"key\">쇼어디치\u003c/b>라는 구체적인 장소와 STIK이라는 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>를 사례로 들어 글을 전개합니다. 독자에게 질문을 던지고 답을 찾아보게 하는 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">투어\u003c/b> 형식을 활용하여 정보를 입체적으로 전달하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Today (2)\u003c/b>\u003cspan>현재 시점으로의 전환\u003c/span>\u003cb>but now (4)\u003c/b>\u003cspan>과거와 현재의 대조\u003c/span>\u003cb>According to (9)\u003c/b>\u003cspan>해석의 근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Modern street art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">well-known street artworks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the place\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">great pieces of street art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the painting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his paintings\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Past (과거)\u003c/th>\u003cth>Present (현재)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Poor workers used to live (가난한 노동자 거주)\u003c/td>\u003ctd>One of the hippest areas (가장 힙한 지역 중 하나)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 먼저 현대 거리 예술이라는 일반적인 사실을 던진 후, 쇼어디치와 STIK이라는 구체적인 사례를 보여주는 두괄식 구조를 가지고 있어요. 예시와 설명을 덧붙이며 독자를 자연스럽게 예술의 세계로 인도하는 전개 방식을 취하고 있죠.","hl":"ty"},{"n":9,"text":"신호어들을 찾아볼까요? 네 번째 문장의 but now는 과거와 현재의 대조를 명확히 보여줍니다. 아홉 번째 문장의 According to는 작가의 의도를 설명하는 근거가 되죠. 또한 Street art가 Artwork와 Painting으로 반복되어 쓰이며 글의 중심 소재를 계속 강조하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>modern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>street art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리 예술\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다채로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>lively\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>활기찬\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-known\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>artwork\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술 작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>visit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가난한\u003c/span>\u003c/div>\u003cdiv>\u003cb>worker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노동자\u003c/span>\u003c/div>\u003cdiv>\u003cb>used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하곤 했다(과거의 상태)\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>hippest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 힙한(유행에 첨단인)\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>be famous for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~으로 유명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선\u003c/span>\u003c/div>\u003cdiv>\u003cb>dot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점\u003c/span>\u003c/div>\u003cdiv>\u003cb>human body\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인체\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>figure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인물, 형체\u003c/span>\u003c/div>\u003cdiv>\u003cb>represent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>past\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과거\u003c/span>\u003c/div>\u003cdiv>\u003cb>present\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현재\u003c/span>\u003c/div>\u003cdiv>\u003cb>future\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미래\u003c/span>\u003c/div>\u003cdiv>\u003cb>closely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자세히, 면밀히\u003c/span>\u003c/div>\u003cdiv>\u003cb>clue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 핵심 단어 몇 가지를 볼게요. Lively는 도시가 활기차다는 느낌을 주고, Hippest는 쇼어디치가 얼마나 유행에 앞서 있는지를 보여줍니다. Represent는 상징하다라는 뜻으로 작품의 의미를 파악할 때 아주 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">modern\u003c/b>\u003cspan class=\"m\">현대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contemporary\u003c/span>\u003cspan class=\"s\">current\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ancient\u003c/span>\u003cspan class=\"a\">traditional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">well-known\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">famous\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">represent\u003c/b>\u003cspan class=\"m\">나타내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">symbolize\u003c/span>\u003cspan class=\"s\">stand for\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lively\u003c/b>\u003cspan class=\"m\">활기찬\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">energetic\u003c/span>\u003cspan class=\"s\">vibrant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">lifeless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">closely\u003c/b>\u003cspan class=\"m\">자세히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">carefully\u003c/span>\u003cspan class=\"s\">intently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 봅시다. Well-known은 유명하다는 뜻으로 famous나 renowned와 바꿔 쓸 수 있습니다. Represent는 symbolize와 같은 의미로 기억해 두세요. 반대로 modern의 반대말은 ancient나 traditional이 될 수 있겠죠?","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대 거리 예술은\u003c/span>\u003cspan class=\"en\">Modern street art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 다양한 형태로\u003c/span>\u003cspan class=\"en\">many different forms,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 만듭니다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">cities \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다채롭고 활기차게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">colorful \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술\u003c/b>의 특징과 도시 환경에 미치는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 설명하며 글을 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : Modern street art [단수 주어] + comes in [단수 동사] : \"존재한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문형\u003c/span> : make [동사] + cities [목적어] + colorful and lively [목적격 보어(형용사)] : \"도시를 다채롭고 활기차게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Modern street art, 현대 거리 예술은. comes in, 존재하며. many different forms, 여러 다양한 형태로. and it makes, 그리고 그것은 만듭니다. cities, 도시를. colorful and lively, 다채롭고 활기차게. 이 문장 전체를 해석하면, 현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다.","hl":"m"},{"n":13,"text":"현대 거리 예술이 우리 주변에서 어떤 모습으로 나타나는지, 그리고 도시 분위기를 어떻게 바꾸는지 설명하는 문장입니다. 예술이 단순히 미술관에만 있는 게 아니라 도시를 활기차게 만든다는 점을 강조하고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 수 일치입니다. 주어 Modern street art가 단수라서 동사에 s가 붙은 comes in이 쓰였어요. 두 번째는 makes 뒤에 목적어와 보어가 오는 오형식 구조입니다. 보어 자리에 형용사인 colorful과 lively가 나란히 왔죠. 특히 lively는 모양은 부사 같지만 뜻은 활기찬이라는 형용사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘,\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 살펴볼 것입니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 유명한\u003c/span>\u003cspan class=\"en\">some \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">well-known\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거리 예술 작품들을\u003c/span>\u003cspan class=\"en\">street artworks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">런던에 있는\u003c/span>\u003cspan class=\"en\">in London.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이번 단원에서 다룰 구체적인 \u003cb class=\"key\">장소\u003c/b>와 \u003cb class=\"key\">소재\u003c/b>를 제시하며 독자의 흥미를 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래 표현\u003c/span> : be going to [조동사] + see [동사원형] : \"살펴볼 것이다\"\u003c/div>\u003cdiv class= cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">using\u003c/span> only lines and dots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 인체 그림에서\u003c/span>\u003cspan class=\"en\">in his paintings of human bodies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작가 STIK의 독특한 \u003cb class=\"key\">화풍\u003c/b>을 설명하며, 인체를 선과 점으로만 단순하게 표현하는 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : for [전치사] + using [동명사/목적어] : \"사용하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">숙어 be famous for\u003c/span> : [주어] + be famous for + [유명한 이유(명사/동명사)] : \"~으로 유명하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He is famous for, 그는 ~으로 유명합니다. using only lines and dots, 오직 선과 점만을 사용하는 것으로. in his paintings of human bodies, 그의 인체 그림에서. 이 문장 전체를 해석하면, 그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.","hl":"m"},{"n":34,"text":"STIK이 세계적으로 유명해진 이유를 설명하고 있어요. 복잡하고 화려한 기교 대신, 아주 단순한 선과 점만으로 사람의 몸을 표현한다는 게 이 작가만의 특별한 개성입니다.","hl":"mn"},{"n":35,"text":"두 가지 포인트를 잡아야 해요. 첫 번째로 be famous for는 뒤에 유명한 이유가 나올 때 쓰는 숙어예요. 두 번째로 전치사 for 다음에는 명사가 와야 하기 때문에 use를 동명사 형태인 using으로 바꿔서 썼다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">STIK에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">According \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> STIK,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저 세 인물은 나타냅니다\u003c/span>\u003cspan class=\"en\">the three figures \u003 n>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타낼까요\u003c/span>\u003cspan class=\"en\">represents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 인물이 어떤 것을 나타낼까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 세 인물 중 \u003cb class=\"key\">과거, \u003c/b>\u003cb class=\"key\">현재, \u003c/b>\u003cb class=\"key\">미래\u003c/b>가 각각 누구인지를 묻는 질문입니다. 독자의 \u003cb class=\"key\">호기심\u003c/b>을 자극하여 다음 내용을 주의 깊게 읽도록 유도하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문형용사\u003c/span> : Which [의문형용사] + figure [명사] : \"어떤 인물이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문대명사\u003c/span> : represents [타동사] + which [의문대명사/목적어] : \"어떤 것을\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Which figure, 어떤 인물이. represents, 나타낼까요. which?, 어떤 것을?. 이 문장 전체를 해석하면, 어떤 인물이 어떤 것을 나타낼까요?","hl":"m"},{"n":40,"text":"앞 문장에서 과거와 현재 그리고 미래라는 세 가지 시간이 나왔죠. 그중에서 그림 속의 어떤 사람이 각각 어떤 시간을 의미하는지 묻는 질문이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 Which figure에서 Which는 뒤에 있는 명사를 꾸며주는 의문형용사예요. 두 번째로 문장 끝에 나온 which는 앞에 나온 시간들을 대신하는 의문대명사로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자세히 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">closely \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈을\u003c/span>\u003cspan class=\"en\">the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eyes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 인물의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">figures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자, 세 인물의 눈을 자세히 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 질문에 대한 답을 찾기 위해 그림의 구체적인 부분인 \u003cb class=\"key\">눈\u003c/b>에 집중하라고 지시합니다. 문제 해결의 \u003cb class=\"key\">실마리\u003c/b>가 어디에 있는지 명확히 짚어주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : Look [동사원형] + closely [부사] + at [전치사] : \"자세히 보세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A of B 구조\u003c/span> : the eyes [A] + of [전치사] + the three figures [B] : \"세 인물의 눈\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Well, 자. look closely at, 자세히 보세요. the eyes, 눈을. of the three figures, 세 인물의.. 이 문장 전체를 해석하면, 자, 세 인물의 눈을 자세히 보세요.","hl":"m"},{"n":43,"text":"정답이 궁금하시죠? 작가는 아주 친절하게도 세 명의 인물 중에서 특히 눈을 꼼꼼하게 보라고 힌트를 주고 있어요.","hl":"mn"},{"n":44,"text":"첫 번째로 look이라는 동사원형으로 문장이 시작됐죠. 이건 주어가 생략된 명령문으로 무엇을 하라는 권유의 표현이에요. 두 번째로 A of B 구조가 쓰였는데 우리말로는 거꾸로 해석해서 세 인물의 눈이라고 읽어주면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 그저 점이지만,\u003c/span>\u003cspan class=\"en\">They are just dots,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 줄 겁니다\u003c/span>\u003cspan class=\"en\">they will \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단서를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">clue\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순해 보이는 \u003cb class=\"key\">눈(점)\u003c/b>이 작품의 의미를 파악하는 결정적인 \u003cb class=\"key\">단서\u003c/b>임을 강조합니다. 겉모습은 단순하지만 그 안에 \u003cb class=\"key\">정보\u003c/b>가 담겨 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사\u003c/span> : give [동사] + you [간접목적어] + a clue [직접목적어] : \"여러분에게 단서를 주다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"They are just dots, 그것들은 그저 점이지만. but, 하지만. they will give, 그것들은 줄 겁니다. you, 여러분에게. a clue, 단서를.. 이 문장 전체를 해석하면, 그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.","hl":"m"},{"n":46,"text":"그림 속 인물의 눈은 아주 단순한 점처럼 생겼어요. 하지만 그 점의 위치나 모양이 과거, 현재, 미래를 구분하는 아주 중요한 열쇠가 될 거예요.","hl":"mn"},{"n":47,"text":"첫 번째로 여기서 They가 가리키는 건 바로 앞 문장에 나온 인물들의 눈을 의미해요. 두 번째로 give you a clue 부분은 누구에게 무엇을 주다라는 사형식 문장이에요. 여러분에게 단서를 준다는 의미가 되죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>현대 거리 예술은 도시를 \u003cb class=\"key\">다채롭고 \u003c/b>\u003cb class=\"key\">활기차게\u003c/b> 만드는 다양한 형태로 존재합니다.\u003c/li>\u003cli>런던의 \u003cb class=\"key\">쇼어디치\u003c/b>는 과거 노동자의 지역에서 현재 가장 \u003cb class=\"key\">힙한 \u003c/b>\u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">구역\u003c/b>으로 변모했습니다.\u003c/li>\u003cli>예술가 \u003cb class=\"key\">STIK\u003c/b>은 선과 점만을 이용해 인체를 그리는 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">화법\u003c/b>으로 유명합니다.\u003c/li>\u003cli>작품 속 세 인물은 \u003cb class=\"key\">과거, \u003c/b>\u003cb class=\"key\">현재, \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 상징하며, 그들의 \u003cb class=\"key\">눈\u003c/b>이 중요한 단서가 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Modern street art in Shoreditch reflects the area's transformation and history through unique artistic expressions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">런던 \u003cb class=\"key\">쇼어디치\u003c/b>의 현대 \u003cb class=\"key\">거리 \u003c/b>\u003cb class=\"key\">예술\u003c/b>과 화가 \u003cb class=\"key\">STIK\u003c/b>의 작품에 담긴 의미를 소개합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 쇼어디치의 거리 예술을 통해 도시의 역사와 예술의 힘을 함께 공부했습니다. STIK의 그림 속 인물들처럼, 우리도 과거를 기억하고 현재를 즐기며 미래를 바라보는 눈을 가졌으면 좋겠네요. 오늘 배운 핵심 단어와 상징들을 다시 한번 복습하면서 수업 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
