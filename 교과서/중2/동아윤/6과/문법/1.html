</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"grammar1","title":"지각동사와 목적격 보어의 비밀","audioDir":"1_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중 동아(윤) 6과\u003c/div>\u003ch1>지각동사와 목적격 보어의 비밀\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>지각동사 뒤에 목적어와 목적격 보어로 동사원형이나 -ing가 오는 문장 구조를 완벽하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘 우리는 중등 동아 윤 6과에서 정말 중요한 문법인 지각동사와 목적격 보어에 대해 공부해 볼 거예요. 보고 듣고 느끼는 감각을 나타내는 동사 뒤에 목적어가 무엇을 하고 있는지 설명해 주는 아주 재미있는 문법이랍니다. 오늘 저와 함께 차근차근 배워서 시험에 나오는 문제들도 척척 맞춰봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">지각동사의 의미와 종류\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">보고 듣고 냄새 맡고 느끼는 것과 같이 감각으로 행동을 알아차리는 동사를 \u003cb class=\"key\">지각동사\u003c/b>라고 해요. 지각동사에는 \u003cb class=\"key\">see\u003c/b>, \u003cb class=\"key\">hear\u003c/b>, watch, feel, smell 등이 있답니다.\u003cdiv>\u003cspan class=\"g-formula\">지각동사 (see, hear 등) + 목적어 + 동사원형 또는 -ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I saw a man \u003cspan class=\"fx\">running\u003c/span> down the street.\u003c/div>\u003cdiv class=\"g-ko\">나는 한 남자가 거리를 달리고 있는 것을 보았다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 see 뒤에 목적어 a man과 목적격 보어 running이 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They saw lots of birds \u003cspan class=\"fx\">flying\u003c/span> in the sky.\u003c/div>\u003cdiv class=\"g-ko\">그들은 많은 새들이 하늘에서 날고 있는 것을 보았다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 see 뒤에 목적어와 -ing 형태가 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I heard the baby \u003cspan class=\"fx\">crying\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 아기가 울고 있는 소리를 들었다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 hear 뒤에 목적어와 -ing가 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Dr. Schofield heard people \u003cspan class=\"fx\">shouting\u003c/span> for Korean independence.\u003c/div>\u003cdiv class=\"g-ko\">Schofield 박사는 사람들이 한국의 독립을 외치는 소리를 들었다.\u003c/div>\u003cdiv class=\"g-note\">읽기 본문 예문으로 지각동사 뒤에 목적어와 -ing가 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>지각동사를 사용한 5형식 문장에서 목적격 보어로 쓰이는 현재분사 -ing와 동사원형은 의미상 큰 차이는 없지만, \u003cb class=\"key\">현재분사\u003c/b>를 쓸 경우에는 \u003cb class=\"key\">진행\u003c/b>의 의미가 강조돼요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 지각동사의 뜻과 종류를 알아볼게요. 보고 듣고 냄새 맡고 느끼는 것과 같이 감각으로 행동을 알아차리는 동사를 지각동사라고 해요. 지각동사에는 see, hear, watch, feel, smell 등이 있답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 함께 볼까요. I saw a man running down the street는 나는 한 남자가 거리를 달리고 있는 것을 보았다라는 뜻이에요. see라는 지각동사 뒤에 목적어 a man이 오고 그 뒤에 running이라는 현재분사가 목적격 보어로 쓰였어요","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. They saw lots of birds flying in the sky는 그들은 많은 새들이 하늘에서 날고 있는 것을 보았다라는 뜻이에요. 새들이 하늘에서 날고 있는 상태를 직접 눈으로 본 것을 나타내고 있어요","hl":"ex-1"},{"n":5,"text":"세 번째 예문도 볼게요. I heard the baby crying은 나는 아기가 울고 있는 소리를 들었다라는 뜻이에요. hear라는 지각동사 뒤에 목적어인 the baby와 목적격 보어인 crying이 잘 연결되어 있죠","hl":"ex-2"},{"n":6,"text":"네 번째는 우리 읽기 본문에 나온 아주 중요한 예문이에요. Dr. Schofield heard people shouting for Korean independence는 Schofield 박사는 사람들이 한국의 독립을 외치는 소리를 들었다라는 뜻이에요. heard라는 지각동사 뒤에 people이라는 목적어와 shouting이라는 현재분사가 멋지게 쓰였네요","hl":"ex-3"},{"n":7,"text":"여기서 잠깐 팁을 하나 드릴게요. 목적격 보어로 동사원형이나 현재분사를 쓸 때 의미는 비슷하지만 현재분사를 쓰면 지금 하고 있다는 진행의 의미가 훨씬 더 강조된다는 점을 꼭 기억해 두세요","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">지각동사의 형태와 목적격 보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">지각동사 다음에 목적어가 나오고 그 목적어가 무엇을 하는지 설명할 때 \u003cb class=\"key\">목적격 보어\u003c/b>로 동사원형이나 \u003cb class=\"key\">현재분사\u003c/b>를 쓴답니다.\u003cdiv>\u003cspan class=\"g-formula\">지각동사 + 목적어 + 동사원형 / -ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Mom saw me \u003cspan class=\"fx\">doing\u003c/span> my homework.\u003c/div>\u003cdiv class=\"g-ko\">엄마는 내가 숙제하고 있는 것을 보셨다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 saw 뒤에 목적어 me와 목적격 보어 doing이 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Eunho heard the birds \u003cspan class=\"fx\">sing\u003c/span> early in the morning.\u003c/div>\u003cdiv class=\"g-ko\">은호는 새들이 아침 일찍 노래하는 소리를 들었다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 heard 뒤에 목적어 the birds와 목적격 보어 동사원형 sing이 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">We smelled something \u003cspan class=\"fx\">burning\u003c/span> in the kitchen.\u003c/div>\u003cdiv class=\"g-ko\">우리는 주방에서 무언가가 타고 있는 냄새를 맡았다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 smelled 뒤에 목적어와 -ing가 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>지각동사무장 5형식 문장에서 목적격 보어 자리에 \u003cb class=\"key\">to부정사\u003c/b>를 쓰면 절대 안 된다는 것을 꼭 기억하세요.\u003c/div>","segs":[{"n":8,"text":"두 번째로 지각동사의 형태와 목적격 보어에 대해 알아볼게요. 지각동사 다음에 목적어가 나오고 그 목적어가 무엇을 하는지 설명할 때 목적격 보어로 동사원형이나 현재분사를 쓴답니다.","hl":"rule"},{"n":9,"text":"첫 번째 예문을 살펴볼까요. Mom saw me doing my homework는 엄마는 내가 숙제하고 있는 것을 보셨다라는 뜻이에요. saw 뒤에 me가 목적어로 오고 내가 숙제하는 것을 보았다니까 doing이 목적격 보어로 왔어요","hl":"ex-0"},{"n":10,"text":"두 번째 예문이에요. Eunho heard the birds sing early in the morning은 은호는 새들이 아침 일찍 노래하는 소리를 들었다라는 뜻이에요. 이번에는 목적격 보어로 동사원형 sing이 쓰인 걸 볼 수 있죠","hl":"ex-1"},{"n":11,"text":"세 번째 예문도 볼까요. We smelled something burning in the kitchen은 우리는 주방에서 무언가가 타고 있는 냄새를 맡았다라는 뜻이에요. 냄새를 맡는 지각동사 뒤에 목적어와 burning이 와서 타고 있는 진행 상황을 보여주고 있어요","hl":"ex-2"},{"n":12,"text":"여기서 아주 중요한 주의점이 있어요. 지각동사가 쓰인 5형식 문장에서 목적격 보어 자리에 절대 to부정사를 쓰면 안 된다는 것을 꼭 기억해 주세요","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">목적격 보어의 형태 구분 시험 Point\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">want나 ask 같은 일반동사는 목적격 보어로 \u003cb class=\"key\">to부정사\u003c/b>를 쓰지만, see나 hear 같은 \u003cb class=\"key\">지각동사\u003c/b>는 목적격 보어로 동사원형이나 -ing를 쓴다는 것을 시험에서 자주 물어봐요.\u003cdiv>\u003cspan class=\"g-formula\">want/ask 등 + 목적어 + to부정사 / see/hear 등 + 목적어 + 동사원형/-ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The teacher told me \u003cspan class=\"fx\">to wait\u003c/span> outside.\u003c/div>\u003cdiv class=\"g-ko\">선생님은 내게 밖에서 기다리라고 말씀하셨다.\u003c/div>\u003cdiv class=\"g-note\">일반동사 told 뒤에 목적어와 목적격 보어로 to부정사가 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I felt someone \u003cspan class=\"fx\">touching\u003c/span> my shoulder.\u003c/div>\u003cdiv class=\"g-ko\">나는 누군가 내 어깨를 만지는 것을 느꼈다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 felt 뒤에 목적어와 -ing가 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시험에서 목적격 보어 자리에 동사원형이나 ing를 써야 할지 to부정사를 써야 할지 묻는 문제가 정말 많이 출제돼요.\u003c/div>","segs":[{"n":13,"text":"세 번째로 시험에 아주 잘 나오는 목적격 보어 형태 구분법을 알아볼게요. want나 ask 같은 일반동사는 목적격 보어로 to부정사를 쓰지만 see나 hear 같은 지각동사는 목적격 보어로 동사원형이나 ing를 쓴다는 것을 시험에서 자주 물어봐요.","hl":"rule"},{"n":14,"text":"첫 번째 예문을 볼게요. The teacher told me to wait outside는 선생님은 내게 밖에서 기다리라고 말씀하셨다라는 뜻이에요. told는 지각동사가 아니라서 목적격 보어로 to wait라는 to부정사를 썼어요","hl":"ex-0"},{"n":15,"text":"두 번째 예문이에요. I felt someone touching my shoulder는 나는 누군가 내 어깨를 만지는 것을 느꼈다라는 뜻이에요. felt는 지각동사니까 목적격 보어로 touching이라는 현재분사를 썼답니다","hl":"ex-1"},{"n":16,"text":"시험 문제를 풀 때 앞에 있는 동사가 지각동사인지 일반동사인지 먼저 확인하는 습관을 들여야 해요","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">지각동사와 목적격 보어의 수동 관계 한 단계 더\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">지각동사의 목적어가 어떤 행동을 \u003cb class=\"key\">당하는\u003c/b> 수동의 의미일 때는 목적격 보어로 \u003cb class=\"key\">과거분사\u003c/b>를 쓴답니다.\u003cdiv>\u003cspan class=\"g-formula\">지각동사 + 목적어 + 과거분사 (p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My sister saw her name \u003cspan class=\"fx\">written\u003c/span> on the board.\u003c/div>\u003cdiv class=\"g-ko\">내 여동생은 칠판에 자신의 이름이 쓰인 것을 보았다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 saw 뒤에 목적어 her name이 쓰였고 이름이 쓰는 게 아니라 쓰이는 수동이므로 과거분사 written이 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어가 직접 행동을 하면 동사원형이나 ing를 쓰고 행동을 당하면 \u003cb class=\"key\">과거분사\u003c/b>를 쓴다는 것을 잊지 마세요.\u003c/div>","segs":[{"n":17,"text":"네 번째로 조금 더 어려운 한 단계 더 코너예요. 지각동사의 목적어가 어떤 행동을 당하는 수동의 의미일 때는 목적격 보어로 과거분사를 쓴답니다.","hl":"rule"},{"n":18,"text":"예문을 함께 살펴볼까요. My sister saw her name written on the board는 내 여동생은 칠판에 자신의 이름이 쓰인 것을 보았다라는 뜻이에요. 이름이 스스로 쓰는 것이 아니라 칠판에 쓰여지는 것이므로 목적격 보어로 과거분사 written이 쓰였어요","hl":"ex-0"},{"n":19,"text":"목적어가 직접 행동을 하면 동사원형이나 ing를 쓰고 목적어가 행동을 당하면 과거분사를 쓴다는 점을 꼭 기억해 두세요","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I saw a man ran down the street.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I saw a man running down the street.\u003c/div>\u003cdiv class=\"g-why\">지각동사 see의 목적격 보어로는 동사원형이나 현재분사를 써야 하므로 과거형 ran은 쓸 수 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The teacher told me waiting outside.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The teacher told me to wait outside.\u003c/div>\u003cdiv class=\"g-why\">일반동사 told는 목적격 보어로 to부정사를 써야 하므로 -ing 형태를 쓸 수 없어요.\u003c/div>\u003c/div>","segs":[{"n":20,"text":"학생들이 자주 틀리는 문장을 살펴볼게요. I saw a man ran down the street라는 문장이 틀린 이유는 무엇일까요. 지각동사 see의 목적격 보어로는 동사원형이나 현재분사를 써야 하므로 과거형 ran은 쓸 수 없고 running이나 run을 써야 맞아요","hl":"mk-0"},{"n":21,"text":"두 번째로 자주 틀리는 문장이에요. The teacher told me waiting outside라는 문장은 왜 틀렸을까요. 일반동사 told는 목적격 보어로 to부정사를 써야 하므로 waiting이 아니라 to wait를 써야 한답니다","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 지각동사가 아닌 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>see\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>hear\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>want\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>feel\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>watch\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">want\u003c/span>\u003cdiv class=\"g-exp\">want는 일반동사로 목적격 보어로 to부정사를 취하며, see, hear, feel, watch는 지각동사입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"첫 번째 문제입니다. 다음 중 지각동사가 아닌 것을 고르는 문제예요. 네 개의 보기 중에서 잘 생각해 보고 정답을 골라보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 세 번째 보기인 want예요. want는 일반동사이고 나머지는 모두 지각동사랍니다","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 빈칸에 들어갈 알맞은 말을 고르세요. (I saw a man _______ down the street.)\u003c/div>\u003cdiv class=\"g-qs\">I saw a man _______ down the street.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>to run\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>ran\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>running\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>runs\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">running\u003c/span>\u003cdiv class=\"g-exp\">지각동
