</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"grammar2","title":"너무 ~해서 ~하다와 목적을 나타내는 so that 구문 정복하기","audioDir":"2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중 동아 윤 6과\u003c/div>\u003ch1>너무 ~해서 ~하다와 목적을 나타내는 so that 구문 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>so that 구문의 의미와 부정 표현, too to 구문과의 전환을 완벽하게 이해한다\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 중 동아 윤 여섯 번째 단원에서 정말 중요한 문법인 so that 구문을 함께 배워 볼 거예요. 너무 ~해서 ~하다는 원인과 결과의 의미부터 목적을 나타내는 표현까지 꼼꼼하게 정리해 볼게요. 끝까지 집중해서 선생님과 함께 영문법 마스터가 되어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">원인과 결과를 나타내는 so that 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">so 형용사 부사 that 주어 동사\u003c/b> 구문은 너무 매우 ~해서 그 결과 ~하다라는 원인과 결과의 의미를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">so + 형용사/부사 + that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He studied \u003cspan class=\"fx\">so hard that he was able to teach in Korean\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 매우 열심히 공부해서 한국어로 가르칠 수 있었다.\u003c/div>\u003cdiv class=\"g-note\">열심히 공부한 원인과 한국어로 가르칠 수 있었던 결과의 관계를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I was \u003cspan class=\"fx\">so hungry that I ate the whole cake\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 너무 배고파서 케이크를 다 먹었다.\u003c/div>\u003cdiv class=\"g-note\">배고픔이라는 원인과 케이크를 다 먹은 결과입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The movie was \u003cspan class=\"fx\">so sad that everyone cried\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 영화는 너무 슬퍼서 모든 사람이 울었다.\u003c/div>\u003cdiv class=\"g-note\">영화가 슬펐던 원인과 사람들이 울었던 결과입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The dog ran \u003cspan class=\"fx\">so fast that I couldn’t catch it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">개가 너무 빨리 달려서 나는 잡을 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">개가 빨리 달린 원인과 잡을 수 없었던 결과입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>so that 구문에서 문장의 주어가 that절에서 목적어로 쓰이면 반드시 \u003cb class=\"key\">대명사\u003c/b>로 써야 해요.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 배울 개념은 so 형용사 부사 that 주어 동사 구문이에요. 이 표현은 너무나도 ~해서 그 결과 ~하다라는 원인과 결과의 뜻을 나타낸답니다. 예문을 보면서 어떻게 쓰이는지 자세히 알아볼까요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. He studied so hard that he was able to teach in Korean. 그는 매우 열심히 공부해서 한국어로 가르칠 수 있었다라는 뜻이죠. 열심히 공부한 원인과 한국어로 가르칠 수 있었던 결과가 잘 드러나 있어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. I was so hungry that I ate the whole cake. 나는 너무 배고파서 케이크를 다 먹었다라는 의미예요. 배가 고팠던 원인과 케이크를 전부 먹은 결과가 연결되어 있죠.","hl":"ex-1"},{"n":5,"text":"세 번째 예문이에요. The movie was so sad that everyone cried. 그 영화는 너무 슬퍼서 모든 사람이 울었다는 뜻이에요. 영화가 무척 슬펐던 원인 때문에 모두가 울게 되었다는 결과를 나타내요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. The dog ran so fast that I couldn’t catch it. 개가 너무 빨리 달려서 나는 잡을 수 없었다라는 의미예요. 개가 빠르게 달린 원인과 내가 잡지 못한 결과가 잘 나타나요.","hl":"ex-3"},{"n":7,"text":"여기서 중요한 팁을 하나 알려 줄게요. so that 구문에서 앞 문장의 주어가 that절 안에서 목적어로 다시 쓰일 때는 반드시 대명사로 받아주어야 한다는 점을 꼭 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">부정 표현과 too to 구문 전환\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">so 형용사 부사 that 주어 cannot 동사원형\u003c/b> 구문은 너무 ~해서 ~할 수 없다는 부정의 의미를 나타내고 \u003cb class=\"key\">too 형용사 부사 to부정사\u003c/b> 구문으로 바꿔 쓸 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">so + 형용사/부사 + that + 주어 + cannot + 동사원형 = too + 형용사/부사 + to부정사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She was \u003cspan class=\"fx\">so nervous that she couldn't say anything\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 너무 긴장해서 아무 말도 할 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">so that cannot 구문으로 부정의 원인과 결과를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She was \u003cspan class=\"fx\">too nervous to say anything\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 너무 긴장해서 아무 말도 할 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">too to 구문으로 바꾸어 쓴 형태입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>too to 구문으로 바꿀 때 that절의 주어가 앞 문장의 주어와 같아야 해요.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 so that 구문의 부정 표현이에요. so 형용사 부사 that 주어 cannot 동사원형을 쓰면 너무 ~해서 ~할 수 없다는 뜻이 되는데요. 이 표현은 뜻이 똑같은 too 형용사 부사 to부정사 구문으로 바꿔 쓸 수 있어요. 예문을 통해 확실하게 살펴봐요.","hl":"rule"},{"n":9,"text":"첫 번째 예문이에요. She was so nervous that she couldn't say anything. 그녀는 너무 긴장해서 아무 말도 할 수 없었다라는 뜻이에요. 너무 긴장했던 원인과 아무 말도 못 했다는 결과가 잘 보여요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문이에요. She was too nervous to say anything. 이 문장은 방금 본 문장을 too to 구문으로 바꿔 쓴 형태예요. 뜻은 똑같이 그녀는 너무 긴장해서 아무 말도 할 수 없었다라는 의미랍니다.","hl":"ex-1"},{"n":11,"text":"too to 구문으로 바꿀 때 주의할 점은 that절의 주어가 앞 문장의 주어와 똑같아야 바꿀 수 있다는 거예요. 이 규칙을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">목적을 나타내는 so that 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">so that 주어 동사\u003c/b>는 ~하도록 ~하다라는 의미로 목적을 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">so that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Suji studied hard \u003cspan class=\"fx\">so that she could pass the exam\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">수지는 시험을 통과할 수 있도록 열심히 공부했다.\u003c/div>\u003cdiv class=\"g-note\">시험을 통과하려는 목적을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>so that 뒤에 \u003cb class=\"key\">조동사\u003c/b> could나 may 등이 자주 함께 쓰여요.\u003c/div>","segs":[{"n":12,"text":"마지막 한 단계 더 코너예요. 이번에는 so that 주어 동사 표현을 배워 볼 건데요. 앞서 배운 so와 that 사이에 아무것도 없으면 너무 ~해서가 아니라 ~하도록 이라는 목적을 나타내요. 예문으로 확인해 볼까요.","hl":"rule"},{"n":13,"text":"예문을 함께 읽어 봐요. Suji studied hard so that she could pass the exam. 수지는 시험을 통과할 수 있도록 열심히 공부했다라는 뜻이에요. 여기서 so that은 열심히 공부한 목적이 시험 통과라는 것을 알려 주고 있어요.","hl":"ex-0"},{"n":14,"text":"so that이 목적을 나타낼 때는 뒤에 주로 could나 may 같은 조동사가 함께 짝을 이루어 쓰인다는 것도 기억해 두면 좋겠죠.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The bag was so heavy that he couldn't lift the bag.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The bag was so heavy that he couldn't lift it.\u003c/div>\u003cdiv class=\"g-why\">that절 안에서 문장의 주어인 the bag을 목적어로 다시 쓸 때는 명사 대신 반드시 대명사 it을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She was so tired that she can't walk.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She was so tired that she couldn't walk.\u003c/div>\u003cdiv class=\"g-why\">앞절의 동사가 과거형 was이므로 that절의 조동사도 과거형인 couldn't를 써야 시제가 일치해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He is too rich so he can buy a car.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He is too rich to buy a car.\u003c/div>\u003cdiv class=\"g-why\">too ~ to 구문은 too 뒤에 형용사나 부사를 쓰고 바로 to부정사를 연결해야 해요.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 자주 틀리는 첫 번째 문장이에요. The bag was so heavy that he couldn't lift the bag이라고 쓰면 틀려요. 앞 문장의 주어인 the bag을 that절의 목적어로 쓸 때는 반드시 대명사 it으로 바꾸어 써야 맞답니다.","hl":"mk-0"},{"n":16,"text":"두 번째로 자주 틀리는 문장을 살펴볼까요. She was so tired that she can't walk이라고 쓰면 안 돼요. 앞 문장의 동사가 과거형 was이므로 뒤쪽의 조동사도 과거형인 couldn't로 써서 시제를 맞춰 주어야 해요.","hl":"mk-1"},{"n":17,"text":"세 번째로 자주 하는 실수예요. He is too rich so he can buy a car라고 쓰면 틀린 문장이 돼요. too to 구문은 so를 쓰지 않고 형용사 뒤에 바로 to부정사를 연결해야 한다는 것을 꼭 기억해 주세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 쓰임이 나머지와 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">① The book was so interesting that I read it in one day.\n② Ryan is so kind that everybody likes him.\n③ Suji studied hard so that she could pass the exam.\n④ The movie was so sad that everyone cried.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>첫 번째 보기\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>두 번째 보기\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>세 번째 보기\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>네 번째 보기\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>다섯 번째 보기\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">세 번째 보기\u003c/span>\u003cdiv class=\"g-exp\">①, ②, ④번은 너무 ~해서 ~하다라는 원인과 결과의 so ~ that 구문이지만, ③번은 ~하도록이라는 목적을 나타내는 so that 구문입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제예요. 다음 중 밑줄 친 부분의 쓰임이 나머지와 다른 하나를 찾아보는 문제네요. 화면에 나오는 다섯 개의 보기 중에서 정답을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 세 번째 보기예요. 첫 번째와 두 번째 그리고 네 번째 보기는 너무 ~해서 ~하다라는 원인과 결과를 나타내지만, 세 번째 보기는 ~하도록이라는 목적을 나타내므로 쓰임이 달라요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The dog ran ____ fast that I couldn’t catch it.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">so\u003c/span>\u003cdiv class=\"g-exp\">so ~ that 구문에서 형용사나 부사 앞에 so를 써서 너무 ~하다는 의미를 완성합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제예요. 빈칸에 알맞은 말을 쓰는 문제네요. 문장을 잘 읽고 빈칸에 들어갈 말을 생각해서 적어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 so예요. so fast that 구문이 되어 개가 너무 빨리 달려서 잡을 수 없었다는 의미를 완성할 수 있죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">어법상 틀린 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">She was so nervous that she can't say anything.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">couldn't\u003c/span>\u003cdiv class=\"g-exp\">앞절의 동사가 was로 과거형이므로 that절의 조동사 역시 과거형인 couldn't로 써야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제는 어법상 틀린 부분을 찾아 고치는 문제예요. She was so nervous that she can't say anything이라는 문장에서 틀린 곳을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 couldn't예요. 앞 문장의 동사가 과거형인 was이므로 뒤쪽의 조동사도 과거형인 couldn't로 써야 시제가 알맞게 일치한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 단어들을 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">I ( hungry / was / so / that ) I ate the whole cake.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">was so hungry that\u003c/span>\u003cdiv class=\"g-exp\">so ~ that 구문의 어순에 맞게 주어 다음 동사 was, 그리고 so hungry that 순서로 배열합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 괄호 안의 단어를 바르게 배열하는 문제네요. I 다음에 올 알맞은 어순을 생각해서 문장을 완성해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 was so hungry that이에요. I 뒤에 동사 was를 쓰고 so와 형용사 hungry 그리고 접속사 that을 차례대로 배열하면 완벽한 문장이 돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말과 같은 뜻이 되도록 주어진 표현을 이용하여 영작하세요. (너무 ~해서 ~할 수 없다)\u003c/div>\u003cdiv class=\"g-qs\">그녀는 너무 긴장해서 아무 말도 할 수 없었다. ( too 구문 이용 )\nShe was _______ to say anything.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">too nervous\u003c/span>\u003cdiv class=\"g-exp\">too ~ 형용사/부사 + to부정사 구문을 사용하여 너무 ~해서 ~할 수 없다는 의미를 나타냅니다. too nervous를 빈칸에 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"여섯 번째 문제는 영작 문제예요. 주어진 우리말 뜻에 맞게 빈칸에 들어갈 알맞은 영단어를 적어 보세요. too 구문을 이용해야 한다는 것을 잊지 마세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 too nervous예요. too 형용사 to부정사 구문을 사용해서 She was too nervous to say anything이라고 쓰면 너무 긴장해서 아무 말도 할 수 없었다는 뜻이 완성돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장과 바꿔 쓸 수 있는 문장을 고르세요.\nShe was so nervous that she couldn't say anything.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>She was too nervous to say anything.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>She was so nervous to say anything.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She is too nervous to say anything.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>She was very nervous that she couldn't say anything.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">첫 번째 보기\u003c/span>\u003cdiv class=\"g-exp\">so ~ that cannot 구문은 too ~ to부정사 구문으로 바꿔 쓸 수 있으며, 시제가 과거이므로 was를 유지해야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 여섯 번째 문제예요. 제시된 문장과 바꿔 쓸 수 있는 문장을 보기에서 고르는 문제네요. 꼼꼼히 읽고 알맞은 보기를 선택해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 첫 번째 보기예요. so ~ that cannot 구문은 too ~ to부정사 구문으로 바꿔 쓸 수 있고 과거 시제도 그대로 유지해야 하므로 첫 번째 보기가 바른 정답이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">중 동아 윤 6과\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>오늘 우리는 너무 ~해서 ~하다는 의미의 \u003cb class=\"key\">so that 구문\u003c/b>, 부정 표현과 \u003cb class=\"key\">too to 구문\u003c/b> 전환, 그리고 목적을 나타내는 \u003cb class=\"key\">so that 주어 동사\u003c/b> 표현을 공부했어요.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘 배운 내용을 깔끔하게 정리해 볼까요. 오늘은 너무 ~해서 ~하다는 의미의 so that 구문과 부정 표현, 그리고 too to 구문으로의 전환까지 아주 중요한 내용들을 함께 공부했어요. 오늘 배운 문법 규칙들을 꼭 기억하고 복습하면서 완전한 내 것으로 만들어 봐요. 오늘 수업도 정말 수고 많았어요.","hl":"sum"}]}]});</script></body></html>
