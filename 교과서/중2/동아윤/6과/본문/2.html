<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 동아(윤) 6과 본문2 — Lesson06</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"중2 동아(윤) 6과 본문2","audioDir":"2_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">6과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Dr. Schofield: A Lifelong Advocate for Korean Independence\u003c/h1>\u003ch2>스코필드 박사: 한국 독립을 위한 평생의 헌신\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Schofield 박사는 3·1운동의 현장을 \u003cb class=\"key\">사진과 \u003c/b>\u003cb class=\"key\">기사\u003c/b>로 전파하고, 일제의 감시 속에서도 평생을 \u003cb class=\"key\">한국의 \u003c/b>\u003cb class=\"key\">독립\u003c/b>과 사회적 약자를 위해 헌신했습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Dr. Schofield dedicated his life to documenting Korea's struggle for independence and supporting Koreans even after the colonial period.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 한국의 독립을 위해 평생을 헌신한 푸른 눈의 이방인, 스코필드 박사님에 대해 배워볼 거예요. 이 글은 박사님이 3·1운동을 목격한 순간부터 그가 한국 땅에 묻히기까지의 감동적인 일대기를 다루고 있습니다. 우리는 이 지문을 통해 진정한 인류애와 정의가 무엇인지 생각해보는 시간을 가질 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">프랭크 스코필드 박사는 '34번째 민족대표'로 불릴 만큼 한국 독립에 깊이 관여한 영국계 캐나다인 선교사입니다. 당시 일제 강점기(Japanese colonial period)의 억압적인 상황 속에서, 그는 제암리 학살 사건 등 일제의 만행을 전 세계에 알린 \u003cb class=\"key\">푸른 \u003c/b>\u003cb class=\"key\">눈의 \u003c/b>\u003cb class=\"key\">독립운동가\u003c/b>였습니다. 외국인이라는 신분은 국제사회에 목소리를 낼 수 있는 중요한 \u003cb class=\"key\">창구\u003c/b>가 되었으며, 이는 오늘날의 \u003cb class=\"key\">종군 \u003c/b>\u003cb class=\"key\">기자\u003c/b>와 유사한 역할을 수행한 것입니다. 그는 단순히 사건을 기록하는 데 그치지 않고 한국인들과 고통을 함께 나누었으며, 그 공로를 인정받아 외국인 최초로 \u003cb class=\"key\">국립서울현충원\u003c/b>에 안장되었습니다.\u003c/div>","segs":[{"n":2,"text":"스코필드 박사님은 단순한 선교사가 아니었습니다. 그는 일제의 만행을 전 세계에 알린 독립운동가였죠. 당시 한국은 일본의 강압적인 통치 아래 있었기 때문에, 외부 세계에 도움을 요청하는 것이 무척 힘들었습니다. 이때 외국인인 스코필드 박사님이 카메라와 펜을 들고 일종의 종군 기자 같은 역할을 해주셨던 거예요. 마치 어둠 속에서 빛을 비추는 전등처럼 말이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>3·1운동의 기록\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>스코필드 박사가 탑골공원에서 \u003cb class=\"key\">3·1운동\u003c/b>을 목격하고, 이를 \u003cb class=\"key\">사진과 \u003c/b>\u003cb class=\"key\">기사\u003c/b>로 기록하여 외국의 신문사에 보내 세계에 알린 과정을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>지속된 투쟁과 망명\u003csmall>전개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>3·1운동 이후에도 한국의 \u003cb class=\"key\">참혹한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 계속 알리던 중, 일본 경찰의 \u003cb class=\"key\">감시\u003c/b>를 피해 캐나다로 돌아가게 된 긴박한 상황을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>귀환과 영원한 안식\u003csmall>결론 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>정부의 초청으로 한국에 돌아와 \u003cb class=\"key\">학생들을 \u003c/b>\u003cb class=\"key\">지원\u003c/b>하며 여생을 보낸 뒤, 사후 \u003cb class=\"key\">국립서울현충원\u003c/b>에 안장된 그의 업적을 기리며 마무리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간의 흐름에 따라 박사님의 행적을 세 단계로 나누어 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서 세 번째 문장은 3·1운동의 기록과 전파 과정을 보여줍니다. 탑골공원에서 울려 퍼진 독립의 함성을 직접 듣고, 카메라로 그 순간을 찍어 외국 신문사에 보냈던 박사님의 용기를 느낄 수 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장에서 여섯 번째 문장은 시련과 멈추지 않는 투쟁에 대한 이야기예요. 일본 경찰의 엄격한 감시 속에서도 한국의 참혹한 상황을 계속 글로 써서 알리셨고, 결국 잠시 캐나다로 떠나야만 했던 긴박한 상황이 그려집니다.","hl":"f1"},{"n":6,"text":"마지막 단계인 일곱 번째 문장에서 아홉 번째 문장은 한국으로의 귀환과 마지막 헌신을 다룹니다. 1958년에 다시 돌아와 여생을 가난한 학생들을 돕는 데 바치셨고, 지금은 서울 국립현충원에 잠들어 계시다는 마무리가 큰 울림을 줍니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글 전체가 1919년부터 1970년까지의 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 스코필드 박사의 행적을 서술하고 있습니다. 특히 네 번째 문장은 그의 투쟁이 일시적이지 않고 \u003cb class=\"key\">지속성\u003c/b>을 가졌음을 강조하는 핵심적인 연결고리 역할을 합니다. 마지막에는 그의 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">안장\u003c/b>을 언급하며 글의 완결성을 높이고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On March 1, 1919 (1)\u003c/b>\u003cspan>시간적 배경 설정\u003c/span>\u003cb>Then (3)\u003c/b>\u003cspan>순차적 동작 연결\u003c/span>\u003cb>Even after (4)\u003c/b>\u003cspan>지속성 강조\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>인과 관계 도출\u003c/span>\u003cb>In 1958 (7)\u003c/b>\u003cspan>특정 시점의 변화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Dr. Schofield\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Dr. Schofield's fight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Dr. Schofield\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 시간의 순서대로 전개되는 전개방식을 취하고 있습니다. 글의 중반부인 네 번째 문장에서 그의 투쟁이 계속되었다는 점을 강조하며 전반부와 후반부를 자연스럽게 연결해주는 중괄식 구조에 가깝습니다.","hl":"ty"},{"n":8,"text":"글의 흐름을 알려주는 신호어들에 주목해 보세요. 첫 번째 문장의 On March 1, 1919와 일곱 번째 문장의 In 1958은 시간의 큰 변화를 보여줍니다. 또한 여섯 번째 문장의 연결어 So는 박사님이 캐나다로 떠나야 했던 이유를 인과 관계로 잘 보여주고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>independence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독립\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위해 외치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take pictures of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 사진을 찍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>article\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기사\u003c/span>\u003c/div>\u003cdiv>\u003cb>historic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>역사적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>foreign\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외국의\u003c/span>\u003c/div>\u003cdiv>\u003cb>newspaper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신문\u003c/span>\u003c/div>\u003cdiv>\u003cb>fight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>투쟁, 싸움\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속해서 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>참혹한, 끔찍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>under the watchful eye of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 감시를 받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>police\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>invitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초청, 초대\u003c/span>\u003c/div>\u003cdiv>\u003cb>government\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정부\u003c/span>\u003c/div>\u003cdiv>\u003cb>rest of his life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그의 여생\u003c/span>\u003c/div>\u003cdiv>\u003cb>especially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가난한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bury\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안장하다, 묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cemetery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>묘지\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어들을 살펴볼까요? 독립을 뜻하는 independence와 참혹한 상황을 나타내는 terrible situation은 꼭 기억해야 합니다. 또한 감시를 받는다는 의미의 under the watchful eye of라는 표현도 시험에 자주 나오니 잘 익혀두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">independence\u003c/b>\u003cspan class=\"m\">독립\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">freedom\u003c/span>\u003cspan class=\"s\">liberty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">historic\u003c/b>\u003cspan class=\"m\">역사적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">momentous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">참혹한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">excellent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">continue\u003c/b>\u003cspan class=\"m\">계속하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">carry on\u003c/span>\u003cspan class=\"s\">keep on\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">discontinue\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">foreign\u003c/b>\u003cspan class=\"m\">외국의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overseas\u003c/span>\u003cspan class=\"s\">international\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">domestic\u003c/span>\u003cspan class=\"a\">native\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 정리해봅시다. 독립을 뜻하는 independence는 liberty나 freedom으로 바꿔 쓸 수 있고, 반대말은 dependence입니다. 참혹하다는 뜻의 terrible은 horrible이나 awful과 비슷하지만, wonderful과는 반대되는 뜻이에요. 계속하다는 continue는 carry on으로도 표현할 수 있다는 점 잊지 마세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1919년 3월 1일에,\u003c/span>\u003cspan class=\"en\">On March 1, 1919,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사는 들었다\u003c/span>\u003cspan class=\"en\">Dr. Schofield \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 외치는 소리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">shouting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의 독립을 위해\u003c/span>\u003cspan class=\"en\">for Korean independence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탑골 공원에서.\u003c/span>\u003cspan class=\"en\">in Tapgol Park.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Schofield 박사가 \u003cb class=\"key\">3.1 \u003c/b>\u003cb class=\"key\">운동\u003c/b>의 현장에 직접 있었음을 보여주며, 그가 목격한 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">순간\u003c/b>을 생생하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 현재분사\u003c/span> : heard [지각동사] + people [목적어] + shouting [현재분사(목적격 보어)] : \"사람들이 외치고 있는 것을 들었다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"On March 1, 1919, 1919년 3월 1일에. Dr. Schofield heard, Schofield 박사는 들었다. people shouting, 사람들이 외치는 소리를. for Korean independence, 한국의 독립을 위해. in Tapgol Park, 탑골 공원에서.. 이 문장 전체를 해석하면, 1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.","hl":"m"},{"n":12,"text":"이 문장은 Schofield 박사가 우리 민족의 역사적인 3.1 운동 현장을 직접 목격했다는 것을 알려줍니다. 독립을 향한 뜨거운 외침이 들리는 듯한 현장감이 느껴지죠.","hl":"mn"},{"n":13,"text":"첫 번째로 볼 문법 포인트는 지각동사인 heard입니다. 목적어인 people 뒤에 현재분사인 shouting을 써서 사람들이 외치고 있는 생생한 동작을 강조하고 있어요. 이 자리에는 동사원형인 shout도 올 수 있지만, 진행의 의미를 살리기 위해 현재분사를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 사진을 찍었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">pictures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사건의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the event\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 카메라로.\u003c/span>\u003cspan class=\"en\">with his camera.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 카메라로 그 사건의 사진을 찍었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순한 관찰을 넘어 역사적 사실을 남기려는 Schofield 박사의 \u003cb class=\"key\">적극적인 \u003c/b>\u003cb class=\"key\">태도\u003c/b>와 \u003cb class=\"key\">기록자\u003c/b>로서의 면모를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사진을 찍다 숙어\u003c/span> : take pictures of + [명사/대상] : \"~의 사진을 찍다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"He took pictures, 그는 사진을 찍었다. of the event, 그 사건의. with his camera, 그의 카메라로.. 이 문장 전체를 해석하면, 그는 카메라로 그 사건의 사진을 찍었다.","hl":"m"},{"n":15,"text":"박사님은 눈으로만 본 게 아니라 카메라를 꺼내서 그 현장을 기록하셨어요. 나중에 이 사진들이 세계에 진실을 알리는 중요한 증거가 됩니다.","hl":"mn"},{"n":16,"text":"두 번째 문장에서는 take pictures of라는 표현을 기억해 두세요. 무엇의 사진을 찍는지 말할 때 전치사 of를 사용해서 뒤에 대상을 연결합니다. 여기서는 3.1 운동이라는 그 사건을 찍었다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후 그는 기사를 썼다\u003c/span>\u003cspan class=\"en\">He then wrote an article\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사적인 사건에 대한\u003c/span>\u003cspan class=\"en\">about the historic event\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 보냈다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sent \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외국 신문사들에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> foreign newspapers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 사진과 함께.\u003c/span>\u003cspan class=\"en\">with his pictures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한국 내부의 상황을 전 세계에 알리는 \u003cb class=\"key\">가교 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 했음을 알 수 있으며, \u003cb class=\"key\">국제적 \u003c/b>\u003cb class=\"key\">공론화\u003c/b>를 위한 노력이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식을 3형식으로 전환한 구조\u003c/span> : send [동사] + it [직접목적어] + to [전치사] + foreign newspapers [간접목적어] : \"그것을 외국 신문사에 보내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거형 동사의 병렬 구조\u003c/span> : 主 + wrote [과거동사 1] + ... + and + sent [과거동사 2] : \"기사를 썼고 (그것을) 보냈다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"He then wrote an article, 그 후 그는 기사를 썼다. about the historic event, 역사적인 사건에 대한. and sent it, 그리고 그것을 보냈다. to foreign newspapers, 외국 신문사들에. with his pictures, 그의 사진과 함께.. 이 문장 전체를 해석하면, 그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.","hl":"m"},{"n":18,"text":"박사님은 사진만 찍은 게 아니라 기사까지 직접 써서 전 세계에 알렸어요. 한국의 독립 의지를 외국에 알리는 아주 중요한 다리 역할을 하신 거죠.","hl":"mn"},{"n":19,"text":"세 번째 문장에는 동사가 두 개 나옵니다. wrote와 sent가 and로 연결되어 있죠? 주어가 한 과거 행동들이니까 시제를 똑같이 과거로 맞춰주는 병렬 구조가 중요합니다. 그리고 sent it to 부분을 보세요. 그것을 어디로 보냈다고 할 때 대명사 it이 목적어면 이렇게 send it to의 순서로 쓴답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사의 투쟁은\u003c/span>\u003cspan class=\"en\">Dr. Schofield's fight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국 독립을 위한\u003c/span>\u003cspan class=\"en\">for Korean independence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈추지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3·1운동 이후에도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">after\u003c/span> the March 1st Movement.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 3·1운동의 기록에 그치지 않고 박사님의 활동이 계속되었음을 나타내는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다. 그의 \u003cb class=\"key\">헌신\u003c/b>이 일회성이 아니었음을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 과거 부정문\u003c/span> : did + not + [동사원형(stop)] : \"멈추지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 강조\u003c/span> : even [부사] + after [전치사] + 명사구 : \"~이후에도\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Dr. Schofield's fight, Schofield 박사의 투쟁은. for Korean independence, 한국 독립을 위한. didn't stop, 멈추지 않았다. even after the March 1st Movement, 3·1운동 이후에도. 이 문장 전체를 해석하면, 한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.","hl":"m"},{"n":21,"text":"Schofield 박사님이 3·1운동 당시 사진을 찍고 기사를 쓴 것에서 멈추지 않았다는 내용이에요. 박사님의 한국 독립을 향한 의지가 얼마나 지속적이고 강했는지 보여주는 아주 중요한 대목이죠.","hl":"mn"},{"n":22,"text":"첫 번째 포인트로 didn't stop을 봐주세요. 과거의 일을 부정할 때는 did not 줄여서 didn't를 쓰고 뒤에 stop처럼 동사원형을 써야 합니다. 두 번째는 even after예요. 전치사 after 앞에 even을 써서 3·1운동이라는 큰 사건이 끝난 바로 그 시점 이후에도 여전히 멈추지 않았다는 점을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 계속했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">continued \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글을 쓰는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">write\u003c/span> about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의 참혹한 상황에 대해\u003c/span>\u003cspan class=\"en\">the terrible situation in Korea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외국 신문에\u003c/span>\u003cspan class=\"en\">for foreign newspapers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 박사님이 해외에 한국의 실상을 알리는 \u003cb class=\"key\">메신저\u003c/b> 역할을 지속했음을 보여줍니다. 당시 일제의 탄압이 \u003cb class=\"key\">참혹한\u003c/b> 수준이었음을 짐작하게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">continue의 목적어 (to부정사)\u003c/span> : continue [동사] + [to-v (목적어)] : \"계속해서 글을 썼다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"He continued, 그는 계속했다. to write about, 글을 쓰는 것을. the terrible situation in Korea, 한국의 참혹한 상황에 대해. for foreign newspapers, 외국 신문에. 이 문장 전체를 해석하면, 그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.","hl":"m"},{"n":24,"text":"Schofield 박사님이 펜을 멈추지 않고 전 세계에 한국의 아픔을 알렸다는 뜻입니다. 당시 한국 사람들이 겪던 고통을 terrible이라는 단어로 표현하며 그 심각성을 드러내고 있어요.","hl":"mn"},{"n":25,"text":"여기서 핵심은 continued to write입니다. continue라는 동사는 뒤에 to write 같은 to부정사나 writing 같은 동명사 둘 다 올 수 있어요. 계속해서 무엇을 하다라는 의미로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 감시를 받게 되었다\u003c/span>\u003cspan class=\"en\">He was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">watchful \u003c/span>\u003cspan class=\"tgt\">eye \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일본 경찰의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the Japanese police,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그는 돌아가야 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> he \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go\u003c/span> back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캐나다로\u003c/span>\u003cspan class=\"en\">to Canada\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1920년에\u003c/span>\u003cspan class=\"en\">in 1920.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 박사님의 활동이 일제에게 큰 \u003cb class=\"key\">위협\u003c/b>이 되었음을 알 수 있습니다. 이 문장은 그가 한국을 떠나게 된 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 명확히 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용 표현\u003c/span> : under the watchful eye of + 대상 : \"~의 감시를 받는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 (결과)\u003c/span> : 원인 [절] + , so [접속사] + 결과 [절] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">must의 과거형\u003c/span> : had to [조동사 과거] + [동사원형(go)] : \"돌아가야 했다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"He was under the watchful eye, 그는 감시를 받게 되었다. of the Japanese police, 일본 경찰의. so he had to go back, 그래서 그는 돌아가야 했다. to Canada, 캐나다로. in 1920, 1920년에. 이 문장 전체를 해석하면, 그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.","hl":"m"},{"n":27,"text":"일본 경찰이 박사님을 아주 매섭게 감시했다는 뜻이에요. 그 감시가 너무 심해서 결국 본국인 캐나다로 돌아갈 수밖에 없었던 안타까운 상황을 설명하고 있습니다.","hl":"mn"},{"n":28,"text":"첫 번째로 under the watchful eye of라는 표현은 누구의 감시를 받는다는 뜻의 덩어리 표현이니 꼭 외워두세요. 두 번째로 접속사 so가 쓰여서 앞의 감시가 원인이 되어 뒤의 결과가 이어집니다. 마지막 세 번째 포인트인 had to go는 must의 과거형으로, 상황상 어쩔 수 없이 돌아가야만 했던 강한 의무를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1958년,\u003c/span>\u003cspan class=\"en\">In 1958,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 한국으로 돌아와서\u003c/span>\u003cspan class=\"en\">he returned to Korea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국 정부의 초청으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">invitation \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> the Korean government\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시는 떠나지 않았다.\u003c/span>\u003cspan class=\"en\">and never left again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스코필드 박사의 공로가 \u003cb class=\"key\">한국 \u003c/b>\u003cb class=\"key\">정부\u003c/b>로부터 공식적으로 인정받았음을 나타내며, 이후 한국에서 \u003cb class=\"key\">여생\u003c/b>을 보낼 것임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 관용 표현\u003c/span> : at the invitation of + 명사(초청인) : \"~의 초청으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : 주어(he) + 동사1(returned) ... + and + 동사2(left) : \"돌아와서 ... 떠나지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"In 1958, 1958년. he returned to Korea, 그는 한국으로 돌아와서. at the invitation of the Korean government, 한국 정부의 초청으로. and never left again, 다시는 떠나지 않았다.. 이 문장 전체를 해석하면, 1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.","hl":"m"},{"n":30,"text":"스코필드 박사님이 독립운동에 기여한 공로를 인정받아 한국 정부의 초청으로 다시 돌아오셨다는 내용이에요. 이제 한국을 아주 떠나지 않고 평생을 여기서 보내시기로 결심했다는 점이 중요하죠.","hl":"mn"},{"n":31,"text":"이 문장에는 두 가지 포인트가 있어요. 첫 번째로 returned와 left가 and로 연결되어 주어인 he의 행동을 순서대로 설명하는 병렬 구조를 이루고 있죠. 두 번째로 at the invitation of는 누구의 초청으로라는 뜻의 유용한 표현이니 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 여생 동안\u003c/span>\u003cspan class=\"en\">For \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rest \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> his life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열심히 일했다\u003c/span>\u003cspan class=\"en\">he worked hard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국인들을 돕기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> Koreans,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 가난한 학생들을\u003c/span>\u003cspan class=\"en\">especially poor students.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 열심히 일했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한국으로 돌아온 후 그가 실천한 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">공헌\u003c/b> 활동을 설명하며, 교육을 통해 한국의 \u003cb class=\"key\">미래\u003c/b>를 도우려 했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량/범위 표현\u003c/span> : the rest of + 명사 : \"~의 나머지, 여생\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 동사(worked) + to + 동사원형(help) : \"돕기 위해\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"For the rest of his life, 그는 여생 동안. he worked hard, 열심히 일했다. to help Koreans, 한국인들을 돕기 위해. especially poor students, 특히 가난한 학생들을. 이 문장 전체를 해석하면, 그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 열심히 일했다.","hl":"m"},{"n":33,"text":"박사님이 한국에 돌아와서 남은 인생을 어떻게 보내셨는지 보여주는 문장이에요. 단순히 머무는 것에 그치지 않고 가난한 학생들을 돕는 교육과 복지 활동에 전념하셨다는 것을 알 수 있죠.","hl":"mn"},{"n":34,"text":"문장의 핵심 어법은 to help입니다. 스코필드 박사님이 왜 열심히 일했는지 그 목적을 나타내는 to부정사의 부사적 용법으로 쓰였어요. 또한 the rest of는 그의 인생에서 남은 부분, 즉 여생을 뜻하는 표현으로 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사는 1970년 4월에 세상을 떠났고,\u003c/span>\u003cspan class=\"en\">Dr. Schofield died in April 1970,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안장되었다\u003c/span>\u003cspan class=\"en\">and he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">buried\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국립서울현충원에\u003c/span>\u003cspan class=\"en\">in Seoul National Cemetery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스코필드 박사의 죽음과 안장지를 언급하며, 외국인임에도 현충원에 모셔질 만큼 \u003cb class=\"key\">국가적 \u003c/b>\u003cb class=\"key\">영웅\u003c/b>으로 대우받았음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(was) + 과거분사(buried) : \"안장되었다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Dr. Schofield died in April 1970, Schofield 박사는 1970년 4월에 세상을 떠났고. and he was buried, 안장되었다. in Seoul National Cemetery, 국립서울현충원에. 이 문장 전체를 해석하면, Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다.","hl":"m"},{"n":36,"text":"박사님의 생애 마지막을 마무리하는 문장입니다. 외국인임에도 불구하고 한국의 국립서울현충원에 안장되셨다는 사실은 한국 정부와 국민이 그분께 드리는 최고의 예우와 감사를 의미합니다.","hl":"mn"},{"n":37,"text":"여기서 중요한 표현은 was buried입니다. 비 동사 was와 과거분사 buried가 합쳐진 수동태 문장이죠. 박사님이 돌아가신 후 묘지에 묻힌 상태를 나타내기 때문에 능동태가 아닌 수동태를 써야 한다는 점을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Schofield 박사는 1919년 \u003cb class=\"key\">3·1운동\u003c/b>을 목격하고 사진과 기사로 이를 전 세계에 알렸습니다.\u003c/li>\u003cli>일본 경찰의 \u003cb class=\"key\">감시\u003c/b>로 인해 잠시 떠났지만, 한국의 상황을 외국 신문에 기고하는 \u003cb class=\"key\">투쟁\u003c/b>을 멈추지 않았습니다.\u003c/li>\u003cli>1958년 정부의 초청으로 돌아온 후 가난한 학생들을 도우며 한국에서 \u003cb class=\"key\">평생\u003c/b>을 보냈습니다.\u003c/li>\u003cli>1970년에 서거한 그는 한국 독립에 대한 공헌을 인정받아 \u003cb class=\"key\">국립서울현충원\u003c/b>에 안장되었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Dr. Schofield dedicated his life to documenting Korea's struggle for independence and supporting Koreans even after the colonial period.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Schofield 박사는 3·1운동의 현장을 \u003cb class=\"key\">사진과 \u003c/b>\u003cb class=\"key\">기사\u003c/b>로 전파하고, 일제의 감시 속에서도 평생을 \u003cb class=\"key\">한국의 \u003c/b>\u003cb class=\"key\">독립\u003c/b>과 사회적 약자를 위해 헌신했습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"스코필드 박사님의 삶은 우리에게 역사에 대한 책임감과 용기를 가르쳐줍니다. 오늘 배운 문장들을 다시 한번 읽어보면서, 시간을 나타내는 표현과 그가 했던 구체적인 일들을 연결해서 복습해보세요. 여러분도 박사님처럼 정의로운 사람이 되길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
