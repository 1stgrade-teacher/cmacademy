 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 영어 이름은</span><span class=\"en\"><b>His English name</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프랭크 W. 스코필드였다,</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> Frank W. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그는 사랑했다</span><span class=\"en\"><b>but he loved</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 한국 이름을.</span><span class=\"en\"><b>his Korean name.</b></span></div></div><div class=\"lec-sent-ko\">그의 영어 이름은 Frank W. Schofield였지만, 그는 자신의 한국 이름을 사랑했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본명과 한국 이름 사이의 대비를 보여줍니다. loved는 사전적으로는 &#39;사랑했다&#39;는 뜻이지만, 여기서는 단순한 애정을 넘어 자신이 정착한 나라에 대한 깊은 존중과 소속감을 드러내기 위해 필자가 선택한 단어입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was (be동사): 주어 His English name의 상태를 서술하는 2형식 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 비슷하게 들렸다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">sounded</span> similar</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 본명과,</span><span class=\"en\"><b>to his real name,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 또한 가졌다</span><span class=\"en\"><b>and it also had</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 의미를.</span><span class=\"en\"><b>a good meaning.</b></span></div></div><div class=\"lec-sent-ko\">그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 언급한 한국 이름을 그가 왜 좋아했는지 구체적인 이유(발음의 유사성과 의미의 가치)를 덧붙여 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sounded 2형식 동사: 감각동사로서 뒤에 형용사 보어(similar)를 취하여 주어(It)의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스코필드 박사는</span><span class=\"en\"><b>Dr. Schofield</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캐나다인 의사였다,</span><span class=\"en\"><b>was a Canadian doctor,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 처음 왔다</span><span class=\"en\"><b>and he first came</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국에 1916년에</span><span class=\"en\"><b>to Korea in 1916</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의학을 가르치기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to teach</span> medicine.</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그가 한국에 오게 된 배경을 설명하며, 그가 교육자이자 의료인으로서 한국과 첫 인연을 맺었음을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach to부정사(부사적 용법): 목적(~하기 위해서)을 나타내며, 앞에 온 came이라는 동사를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 가르치기를 원했다</span><span class=\"en\"><b>He wanted <span class=\"grammar-hl\">to teach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국어로,</span><span class=\"en\"><b>in Korean,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 시작했다</span><span class=\"en\"><b>so he began</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국어를 배우는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to learn</span> Korean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧바로.</span><span class=\"en\"><b>right away.</b></span></div></div><div class=\"lec-sent-ko\">그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 의술을 전하는 것을 넘어 현지인과 소통하려는 그의 의지를 보여줍니다. right away는 &#39;즉시&#39;라는 뜻인데, 그의 열정과 실행력을 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach to부정사(명사적 용법): want라는 타동사의 목적어 자리에 위치하여 &#39;가르치는 것&#39;이라는 의미를 갖습니다.</div><div class=\"lec-gr-item\">to learn to부정사(명사적 용법): began이라는 타동사의 목적어 자리에 위치하여 &#39;배우는 것을 시작했다&#39;는 의미를 갖습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 공부했다</span><span class=\"en\"><b>He studied</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 열심히</span><span class=\"en\"><b>so hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 할 수 있었다</span><span class=\"en\"><b>that he was able</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르치는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to teach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국어로</span><span class=\"en\"><b>in Korean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겨우 몇 년 후에.</span><span class=\"en\"><b>after only a few years.</b></span></div></div><div class=\"lec-sent-ko\">그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 노력이 맺은 결실을 보여주며, 그가 한국 사회에 빠르게 녹아들었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so... that (관용표현): 원인과 결과를 나타내는 구문으로, so 뒤에는 형용사/부사가 오고 that 뒤에는 결과에 해당하는 절이 이어집니다.</div><div class=\"lec-gr-item\">to teach to부정사(부사적 용법): 형용사 able을 수식하여 &#39;~할 수 있는&#39;이라는 의미의 근거를 보충합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 믿었다</span><span class=\"en\"><b>He believed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 나라는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> every country</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">권리를 가지고 있다고</span><span class=\"en\"><b>has the right</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독립적일</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span> independent,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 도왔다</span><span class=\"en\"><b>so he helped</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립운동을.</span><span class=\"en\"><b>the Korean independence movement.</b></span></div></div><div class=\"lec-sent-ko\">그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그가 단순히 의학을 가르치는 사람을 넘어, 한국의 시대적 아픔에 공감하고 실질적인 행동에 나선 결말부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that 명사절을 이끄는 접속사: believed라는 동사의 목적어 역할을 하는 절 전체를 이끕니다.</div><div class=\"lec-gr-item\">to be to부정사(형용사적 용법): 앞에 있는 명사 the right를 뒤에서 수식하여 &#39;~할 권리&#39;라는 의미를 만듭니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>석호필은 본래 프랭크 스코필드라는 캐나다인 의사였으나 한국을 깊이 사랑했다.</li><li>그는 한국인과 소통하기 위해 한국어를 빠르게 습득했고 의학을 한국어로 가르쳤다.</li><li>한국의 독립을 자신의 신념으로 여겨 독립운동을 도운 고마운 인물이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield came to Korea to teach medicine and learned the Korean language, and he eventually supported the Korean independence movement because he valued national freedom.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 의학을 가르치기 위해 한국에 와서 한국어를 배웠으며, 국가의 자유를 소중히 여겼기에 결국 한국의 독립운동을 지원했다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":"main"},{"audio":"./2_audio/4.mp3","hl":"meaning"},{"audio":"./2_audio/5.mp3","hl":"grammar"}],[{"audio":"./2_audio/6.mp3","hl":"main"},{"audio":"./2_audio/7.mp3","hl":"meaning"},{"audio":"./2_audio/8.mp3","hl":"grammar"}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||
