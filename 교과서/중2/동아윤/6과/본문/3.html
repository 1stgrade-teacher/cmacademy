 만세 운동인데, 이때 활약한 프랭크 스코필드(Frank Schofield) 박사님은 사실 캐나다에서 온 선교사이자 수의사였습니다. 당시 일제는 자신들의 만행을 감추기 위해 심각한 언론 통제(Press Censorship)를 하고 있었기 때문에, 그의 활동은 마치 오늘날 억울한 사건 현장을 스마트폰으로 몰래 찍어 전 세계 SNS에 폭로하는 시민 저널리즘(Citizen Journalism)과 같은 엄청난 용기가 필요한 일이었습니다. 스코필드 박사님은 당시 외국인에게 주어지던 특권인 치외법권(Extraterritoriality)을 어느 정도 활용해 일본 경찰의 눈을 피해 해외로 사진과 기사를 보낼 수 있었지만, 결국 일제의 집요한 감시와 압박을 견디지 못하고 한국을 떠나야만 했던 가슴 아픈 역사적 맥락이 이 글의 이면에 담겨 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">013.1 운동 목격과 기록</div><ul><li>스코필드 박사는 탑골공원에서 일어난 독립운동을 목격하고 이를 사진으로 기록했다.</li><li>1919년 3월 1일 탑골공원에서 한국의 독립(Korean independence) 만세 소리를 들음</li><li>카메라를 이용해 그 사건의 사진(pictures)을 촬영함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02해외 언론 보도</div><ul><li>그는 자신이 목격한 역사적인 사건을 기사로 작성해 해외에 알렸다.</li><li>역사적 사건(historic event)에 대한 기사(article)를 작성함</li><li>작성한 기사와 사진을 외국 신문(foreign newspapers)에 보냄</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03지속적인 독립운동 지원</div><ul><li>3.1 운동 이후에도 그는 한국의 참혹한 현실을 외부에 알리는 일을 멈추지 않았다.</li><li>3.1 운동 이후에도 독립을 위한 투쟁(fight)을 계속함</li><li>한국의 끔찍한 상황(terrible situation)을 지속적으로 보도함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04일제의 감시와 귀국</div><ul><li>일본 경찰의 지속적인 감시를 받게 된 그는 결국 한국을 떠나야만 했다.</li><li>일본 경찰(Japanese police)의 철저한 감시(watchful eye) 아래에 놓임</li><li>1920년 어쩔 수 없이 캐나다(Canada)로 귀국함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shout for</td><td class=\"m\">~을 요구하며 외치다, ~을 위해 소리치다</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">take pictures of</td><td class=\"m\">~의 사진을 찍다</td></tr><tr><td class=\"w\">article</td><td class=\"m\">기사, 글, 품목</td></tr><tr><td class=\"w\">historic</td><td class=\"m\">역사적인, 역사적으로 중요한</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">운동, 움직임, 이동</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continue</td><td class=\"m\">계속하다, 지속하다</td></tr><tr><td class=\"w\">terrible</td><td class=\"m\">끔찍한, 형편없는, 무서운</td></tr><tr><td class=\"w\">situation</td><td class=\"m\">상황, 처지, 환경</td></tr><tr><td class=\"w\">under the watchful eye of</td><td class=\"m\">~의 감시 아래, ~의 주도면밀한 시선 아래</td></tr><tr><td class=\"w\">go back to</td><td class=\"m\">~로 돌아가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1919년 3월 1일,</span><span class=\"en\"><b>On March 1, 1919,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는 사람들이 외치는 소리를 들었다</span><span class=\"en\"><b>Dr. Schofield <span class=\"grammar-hl\">heard people shouting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립을</span><span class=\"en\"><b>for Korean independence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탑골 공원에서</span><span class=\"en\"><b>in Tapgol Park.</b></span></div></div><div class=\"lec-sent-ko\">1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 배경과 출발점이 되는 문장입니다. 스코필드 박사가 3.1 운동 현장을 처음 접하게 된 순간을 보여주며, 당시 조선 사람들이 일제의 지배에 맞서 독립 만세를 부르던 역사적 현장에 그가 있었음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">heard people shouting 5형식(SVOC) 구조 및 현재분사: 지각동사(heard) + 목적어(people) + 목적격 보어(현재분사 shouting) 구조이다. 지각동사는 목적격 보어로 동사원형이나 현재분사를 취하며, 목적어와 보어의 관계가 능동이면서 진행 중인 동작을 나타낼 때 현재분사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그 사건의 사진을 찍었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">took pictures of</span> the event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">카메라로</span><span class=\"en\"><b>with his camera.</b></span></div></div><div class=\"lec-sent-ko\">그는 카메라로 그 사건의 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 목격한 만세 운동 현장을 그가 어떻게 기록했는지 이어받습니다. took pictures of the event는 단순히 셔터를 누르는 것을 넘어, 일제의 탄압 속에서 한국인들의 저항을 잊히지 않도록 증거로 남기려 한 그의 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took pictures of (관용표현): 동사 take와 명사 pictures, 전치사 of가 결합하여 &#39;~의 사진을 찍다&#39;라는 의미를 나타내는 관용 동사구 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 후 그는 이 역사적인 사건에 대한 기사를 썼다</span><span class=\"en\"><b>He then wrote an article about the historic event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 보냈다</span><span class=\"en\"><b>and sent it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외국 신문사에</span><span class=\"en\"><b>to foreign newspapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진과 함께</span><span class=\"en\"><b>with his pictures.</b></span></div></div><div class=\"lec-sent-ko\">그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 기록에서 한 걸음 더 나아가, 그가 이를 외부 세계에 알리는 구체적인 행동을 취했음을 보여줍니다. sent it to foreign newspapers는 일본 제국주의의 감시와 통제를 피해 한국의 현실을 국제 사회에 폭로하여 세계 여론을 움직이려 했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wrote an article ... and sent it 병렬 구조: 등위접속사 and를 중심으로 주어 He에 공통으로 연결되는 두 개의 과거형 동사구(wrote ~와 sent ~)가 문법적으로 대등하게 연결된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">article</td><td class=\"m\">기사, 글, 품목</td></tr><tr><td class=\"w\">historic</td><td class=\"m\">역사적인, 역사적으로 중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한국 독립을 위한 Schofield 박사의 투쟁은</span><span class=\"en\"><b>Dr. Schofield’s fight for Korean independence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추지 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">didn’t stop</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3·1운동 이후에도</span><span class=\"en\"><b>even after the March 1st Movement.</b></span></div></div><div class=\"lec-sent-ko\">한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용(3.1 운동 당일의 활동)에서 시점을 그 이후로 전환하며 글의 흐름을 이어갑니다. 글쓴이는 didn&#39;t stop even after를 통해 그의 활동이 일회성에 그치지 않고, 계속해서 한국인들의 편에 서서 일제에 맞서 싸우는 장기적인 헌신으로 이어졌음을 힘주어 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t stop 일반동사의 과거 부정문: 일반동사(stop)의 과거 시제 부정형을 만들기 위해 조동사 did 뒤에 not을 붙이고 본동사는 동사원형(stop) 형태로 쓴 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">운동, 움직임, 이동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 계속해서 글을 썼다</span><span class=\"en\"><b>He continued <span class=\"grammar-hl\">to write</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 참혹한 상황에 대해</span><span class=\"en\"><b>about the terrible situation in Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외국 신문에</span><span class=\"en\"><b>for foreign newspapers.</b></span></div></div><div class=\"lec-sent-ko\">그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;멈추지 않은 투쟁&#39;이 구체적으로 어떤 행동이었는지 설명합니다. the terrible situation in Korea는 3.1 운동 이후 일제가 벌인 잔혹한 보복과 억압, 그리고 고통받는 한국인들의 참상을 뜻하며, 이를 지속적으로 해외에 알렸음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to write (to부정사): 타동사 continued의 목적어 역할을 하는 명사적 용법의 to부정사이다. 동사 continue는 목적어로 to부정사와 동명사를 모두 취할 수 있는 동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continue</td><td class=\"m\">계속하다, 지속하다</td></tr><tr><td class=\"w\">terrible</td><td class=\"m\">끔찍한, 형편없는, 무서운</td></tr><tr><td class=\"w\">situation</td><td class=\"m\">상황, 처지, 환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 일본 경찰의 감시를 받게 되었다,</span><span class=\"en\"><b>He was <span class=\"grammar-hl\">under the watchful eye of</span> the Japanese police,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 돌아가야 했다</span><span class=\"en\"><b>so he had to go back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캐나다로</span><span class=\"en\"><b>to Canada</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1920년에</span><span class=\"en\"><b>in 1920.</b></span></div></div><div class=\"lec-sent-ko\">그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그가 지속적인 고발 활동을 펼친 결과로 맞이한 결말을 제시합니다. under the watchful eye of the Japanese police는 일제 경찰의 삼엄한 통제와 압박 속에 놓여 생명의 위협이나 추방의 위기에 처해 있었다는 의미입니다. 결국 이로 인해 본국으로 돌아갈 수밖에 없었던 안타까운 상황을 설명하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">under the watchful eye of (관용표현): &#39;전치사(under) + 명사구 + 전치사(of)&#39; 형태로 이루어진 이디엄으로, &#39;~의 감시 아래에&#39;라는 의미를 지니며 be동사 뒤에서 주어의 상태나 상황을 나타내는 전치사구 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">under the watchful eye of</td><td class=\"m\">~의 감시 아래, ~의 주도면밀한 시선 아래</td></tr><tr><td class=\"w\">go back to</td><td class=\"m\">~로 돌아가다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>1919년 3월 1일, 스코필드 박사는 탑골공원에서 일어난 한국의 독립 만세 운동을 목격하고 이를 사진으로 기록했다.</li><li>그는 이 역사적 사건과 사진을 해외 신문에 보내 국제 사회에 한국의 상황을 알렸다.</li><li>3.1 운동 이후에도 일제의 억압적인 상황을 계속해서 고발하는 글을 썼다.</li><li>결국 일제 경찰의 감시와 압박으로 인해 1920년 어쩔 수 없이 캐나다로 돌아가야만 했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield actively reported the Korean independence movement to the world, but he had to leave Korea due to Japanese surveillance.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 한국의 독립운동을 세계에 적극적으로 알렸지만, 일본의 감시로 인해 한국을 떠나야만 했다.</div></div></div>"],"segs":[[{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/3.mp3","hl":null},{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 동아(윤정미) 6과 본문3_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중
