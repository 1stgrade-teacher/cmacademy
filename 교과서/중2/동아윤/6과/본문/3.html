조력자였습니다. 오늘날 그는 외국인 최초로 국립현충원에 안장될 만큼, 우리 역사에서 자유와 정의(freedom and justice)를 몸소 실천한 인물로 기억되고 있습니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1919년 3월 1일에</span><span class=\"en\"><b>On March 1, 1919,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는 들었다</span><span class=\"en\"><b>Dr. Schofield heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 외치는 것을</span><span class=\"en\"><b>people <span class=\"grammar-hl\">shouting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립을 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">for Korean independence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탑골 공원에서</span><span class=\"en\"><b>in Tapgol Park.</b></span></div></div><div class=\"lec-sent-ko\">1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3.1 운동 당시의 구체적인 시간과 장소를 언급하며, 스코필드 박사가 한국의 독립운동과 처음으로 연결되는 계기를 제시합니다. 여기서 shouting은 단순히 소리를 지르는 것을 넘어, 억압에 저항하여 자신의 목소리를 내는 능동적인 의지 표현으로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shouting (현재분사): 5형식 구조의 목적보어(OC)로 쓰여, 목적어(people)가 행하는 동작(외치는 중인 상태)을 설명함.</div><div class=\"lec-gr-item\">shouting for Korean independence 5형식(SVOC) 구조: heard(지각동사) + people(목적어) + shouting~(목적보어). 지각동사 뒤에 목적어와 목적보어(현재분사)를 배치하여 목적어의 동작을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 사진들을 찍었다</span><span class=\"en\"><b><span class=\"grammar-hl\">He took pictures</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사건의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the event</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 카메라로</span><span class=\"en\"><b>with his camera.</b></span></div></div><div class=\"lec-sent-ko\">그는 카메라로 그 사건의 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 목격담에 이어, 그가 사건을 기록하기 위해 구체적인 행동(사진 촬영)에 나섰음을 보여주며 화자의 관찰자적 역할을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He took pictures of the event 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그 다음에 썼다</span><span class=\"en\"><b><span class=\"grammar-hl\">He then wrote</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기사를</span><span class=\"en\"><b><span class=\"grammar-hl\">an article</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 역사적인 사건에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">about</span> the historic event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 보냈다</span><span class=\"en\"><b>and sent it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외국 신문사들로</span><span class=\"en\"><b>to foreign newspapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 사진들과 함께</span><span class=\"en\"><b>with his pictures.</b></span></div></div><div class=\"lec-sent-ko\">그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 현장을 목격하는 데 그치지 않고, 그 사실을 세계에 알리기 위해 &#39;기사&#39;와 &#39;사진&#39;이라는 수단을 사용했음을 보여줍니다. historic은 사전적으로 &#39;역사적인&#39;인데, 여기서는 훗날 역사의 흐름을 바꿀 만큼 중요한 사건임을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He then wrote an article about 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사의 투쟁은</span><span class=\"en\"><b><span class=\"grammar-hl\">Dr. Schofield’s fight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국 독립을 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for Korean independence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추지 않았다</span><span class=\"en\"><b>didn’t stop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 ~후에도</span><span class=\"en\"><b>even after</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3·1운동</span><span class=\"en\"><b>the March 1st Movement.</b></span></div></div><div class=\"lec-sent-ko\">한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름(3.1 운동 이후)에도 불구하고 그의 활동이 지속되었음을 보여주며, 그의 헌신이 일회성이 아님을 강조합니다. fight는 사전적으로는 &#39;싸움&#39;이지만, 여기서는 물리적 충돌보다는 신념을 지키기 위한 끊임없는 노력과 저항이라는 의미로 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Dr. Schofield’s fight for Korean independence 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 계속해서 썼다</span><span class=\"en\"><b>He continued <span class=\"grammar-hl\">to write</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참혹한 상황에 대해</span><span class=\"en\"><b>about the terrible situation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의</span><span class=\"en\"><b>in Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외국 신문들을 위해</span><span class=\"en\"><b>for foreign newspapers.</b></span></div></div><div class=\"lec-sent-ko\">그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;멈추지 않은 투쟁&#39;이 구체적으로 어떤 행동(글쓰기)으로 이어졌는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to write (to부정사): continue의 목적어 역할을 하는 명사적 용법임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 ~상태였다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감시의 눈 아래에</span><span class=\"en\"><b><span class=\"grammar-hl\">under</span> the watchful eye</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일본 경찰의</span><span class=\"en\"><b>of the Japanese police,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 돌아가야 했다</span><span class=\"en\"><b>so he <span class=\"grammar-hl\">had to go</span> back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캐나다로</span><span class=\"en\"><b>to Canada</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1920년에</span><span class=\"en\"><b>in 1920.</b></span></div></div><div class=\"lec-sent-ko\">그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 활동이 결국 외부의 탄압을 불러왔고, 그 결과 그가 한국을 떠날 수밖에 없었던 인과관계를 설명합니다. watchful eye는 사전적으로 &#39;지켜보는 눈&#39;이지만, 여기서는 피감시자의 일거수일투족을 쫓는 &#39;살벌한 감시&#39;를 뜻합니다. 단순히 보는 행위가 아니라 위험을 수반하는 상황임을 효과적으로 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was under 수동태/수동구조는 아니지만, be동사가 상태를 나타내는 1형식 구조로 쓰임.</div><div class=\"lec-gr-item\">had to go (관용표현): have to + 동사원형(~해야 한다) 구조로 의무를 나타냄.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스코필드 박사는 3.1 운동 현장을 목격하고 기록하여 세계에 알렸다.</li><li>그는 3.1 운동 이후에도 한국의 비극적인 상황을 외국에 알리는 활동을 지속했다.</li><li>일본 경찰의 탄압으로 인해 그는 어쩔 수 없이 캐나다로 귀국하게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield captured the March 1st Movement on camera and reported the situation, but he eventually returned to Canada due to Japanese surveillance.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 3·1 운동을 카메라에 담아 상황을 보도했으나, 일본의 감시로 인해 결국 캐나다로 돌아갔다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":"main"},{"audio":"./3_audio/4.mp3","hl":"meaning"},{"audio":"./3_audio/5.mp3","hl":"grammar"}],[{"audio":"./3_audio/6.mp3","hl":"main"},{"audio":"./3_audio/7.mp3","hl":"meaning"},{"audio":"./3_audio/8.mp3","hl":"grammar"}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k
