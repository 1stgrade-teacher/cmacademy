 다양한 형태</li><li>도시를 화려하고 생기 있게(lively) 만드는 긍정적 역할</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02장소 소개</div><ul><li>방문할 장소인 쇼디치는 과거 빈민가에서 현재 가장 유행에 앞서가는 지역으로 변모했다.</li><li>과거 가난한 노동자(poor workers)들의 거주지</li><li>현재 런던에서 가장 힙한(hippest) 구역 중 하나</li><li>훌륭한 거리 예술 작품들의 밀집지</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03예술가 스틱</div><ul><li>이곳에서 선과 점만을 사용하여 인체를 독특하게 표현하는 유명 예술가 스틱의 작품을 볼 수 있다.</li><li>예술가 스틱(STIK)의 작품 소개</li><li>선(lines)과 점(dots)만으로 인체를 묘사하는 화풍</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04작품의 상징</div><ul><li>작품 속 세 인물은 쇼디치의 역사를 상징하며, 인물들의 눈을 통해 그 의미를 유추할 수 있다.</li><li>세 인물(three figures)이 쇼디치의 과거, 현재, 미래를 상징(represent)</li><li>점으로 표현된 눈(eyes)이 의미를 파악하는 단서(clue)를 제공함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come in</td><td class=\"m\">(어떤 형태로) 나오다, 나타나다</td></tr><tr><td class=\"w\">colorful</td><td class=\"m\">다채로운, 화려한</td></tr><tr><td class=\"w\">lively</td><td class=\"m\">활기찬, 생동감 넘치는</td></tr><tr><td class=\"w\">well-known</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">artwork</td><td class=\"m\">예술 작품, 미술품</td></tr><tr><td class=\"w\">used to</td><td class=\"m\">~하곤 했다, 과거에 ~였다</td></tr><tr><td class=\"w\">hip</td><td class=\"m\">유행에 밝은, 멋진</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">작품, 한 점, 조각</td></tr><tr><td class=\"w\">over there</td><td class=\"m\">저기에, 저쪽에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be famous for</td><td class=\"m\">~로 유명하다</td></tr><tr><td class=\"w\">dot</td><td class=\"m\">점, 둥근 점</td></tr><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면, ~에 의하면</td></tr><tr><td class=\"w\">figure</td><td class=\"m\">인물, 형상, 모양</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 대표하다, 상징하다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 살피다</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">자세히, 면밀히</td></tr><tr><td class=\"w\">clue</td><td class=\"m\">단서, 실마리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">거리 예술</span><span class=\"en\"><b>Street Art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던의</span><span class=\"en\"><b><span class=\"grammar-hl\">in London</span></b></span></div></div><div class=\"lec-sent-ko\">런던의 거리 예술</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도입부로서 거리 미술의 전반적인 특징과 긍정적인 효과를 제시합니다. comes in many different forms는 벽화, 스티커, 조각 등 거리에 표현되는 예술의 종류가 아주 다양하다는 것을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in London (전치사구): 전치사 in이 이끄는 구가 앞의 명사 Street Art를 뒤에서 수식하여 &#39;런던에 있는 거리 예술&#39;이라는 장소의 의미를 한정합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">현대 거리 예술은 나타난다</span><span class=\"en\"><b>Modern street art comes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 다양한 형태로,</span><span class=\"en\"><b>in many different forms,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 도시를 다채롭고 생기 있게 만든다.</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">makes cities colorful and lively</span>.</b></span></div></div><div class=\"lec-sent-ko\">현대 거리 예술은 다양한 형태로 나타나며, 도시를 다채롭고 활기차게 만듭니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도입부로서 거리 미술의 전반적인 특징과 긍정적인 효과를 제시합니다. comes in many different forms는 벽화, 스티커, 조각 등 거리에 표현되는 예술의 종류가 아주 다양하다는 것을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes cities colorful and lively 5형식(SVOC) 구조: 동사 make + 목적어(cities) + 목적격 보어(colorful and lively) 구조입니다. 목적어를 목적격 보어(형용사) 상태로 &#39;만들다&#39;라는 의미를 나타내며, 보어 자리에 형용사가 병렬로 연결되어 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">colorful</td><td class=\"m\">다채로운, 화려한</td></tr><tr><td class=\"w\">lively</td><td class=\"m\">활기찬, 생동감 넘치는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 몇몇 유명한 거리 예술 작품들을 볼 것이다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">are going to see</span> some <span class=\"grammar-hl\">well-known</span> street artworks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던에서.</span><span class=\"en\"><b>in London.</b></span></div></div><div class=\"lec-sent-ko\">오늘 우리는 런던에 있는 잘 알려진 거리 예술 작품들을 살펴볼 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 거리 미술의 무대를 런던으로 구체화하여, 앞으로 이 글에서 다룰 핵심 주제를 안내합니다. 독자를 런던의 예술 현장으로 초대하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are going to see (관용표현): be going to + 동사원형 구조로, &#39;~할 예정이다, ~할 것이다&#39;라는 미래의 계획이나 의도를 나타냅니다.</div><div class=\"lec-gr-item\">well-known (과거분사(형용사)): 과거분사형태인 well-known이 뒤에 오는 명사 street artworks를 수식합니다. p.p. + N 구조로 명사 기준에서 &#39;잘 알려진&#39;이라는 수동 및 상태의 의미를 더해줍니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">well-known</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">artwork</td><td class=\"m\">예술 작품, 미술품</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 방문할 장소는</span><span class=\"en\"><b>The place <span class=\"grammar-hl\">that</span> we <span class=\"grammar-hl\">are going to visit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쇼디치이다.</span><span class=\"en\"><b>is Shoreditch.</b></span></div></div><div class=\"lec-sent-ko\">우리가 방문할 곳은 쇼디치(Shoreditch)입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 런던 중에서도 구체적으로 어느 동네를 살펴볼 것인지 장소를 특정합니다. 앞으로 전개될 이야기의 배경이 설정되는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that (관계대명사): 목적격 관계대명사 that이 이끄는 절(that we are going to visit)이 앞의 선행사 The place를 수식합니다. 관계대명사 뒤에는 타동사 visit의 목적어가 빠져 있는 불완전한 문장이 이어집니다.</div><div class=\"lec-gr-item\">are going to visit (관용표현): be going to + 동사원형 구조로, 가까운 미래의 확정된 계획을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가난한 노동자들이 살곤 했다</span><span class=\"en\"><b>Poor workers <span class=\"grammar-hl\">used to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 지역에,</span><span class=\"en\"><b>in this area,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 지금 그곳은 가장 유행을 앞서가는 지역들 중 하나이다</span><span class=\"en\"><b>but now it is <span class=\"grammar-hl\">one of the hippest areas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던에서.</span><span class=\"en\"><b>in London.</b></span></div></div><div class=\"lec-sent-ko\">예전에는 가난한 노동자들이 이 지역에 살았지만, 지금은 런던에서 가장 유행을 앞서가는 지역 중 하나가 되었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쇼디치라는 동네가 가진 역사적 배경과 현재의 위상을 대비해서 보여 줍니다. used to live in this area는 과거에는 소외되고 가난한 동네였음을 알려 주며, 지금은 문화와 예술이 넘치는 최신 유행의 중심지로 완전히 탈바꿈했음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used to live (관용표현): used to + 동사원형 구조는 과거의 지속적인 상태나 규칙적인 습관을 나타내어, &#39;과거에 ~하곤 했다(그러나 지금은 아니다)&#39;라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">one of the hippest areas (관용표현): one of the + 최상급(hippest) + 복수명사(areas) 구조입니다. &#39;가장 ~한 것들 중 하나&#39;라는 의미를 나타내며, 반드시 뒤에 복수명사가 와야 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">used to</td><td class=\"m\">~하곤 했다, 과거에 ~였다</td></tr><tr><td class=\"w\">hip</td><td class=\"m\">유행에 밝은, 멋진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 아주 많은 훌륭한 거리 예술 작품들을 찾을 수 있다</span><span class=\"en\"><b>We can find so many great <span class=\"grammar-hl\">pieces of</span> street art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이곳에서.</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">우리는 이곳에서 정말 많은 훌륭한 거리 예술 작품들을 찾아볼 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쇼디치가 왜 현재 유행에 밝은 곳이 되었는지 그 배경을 뒷받침합니다. 거리에 널린 다양한 예술 작품들이 이 지역의 분위기를 매력적으로 바꿔놓았음을 알려 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pieces of (관용표현): 셀 수 없는 명사(street art)의 수량을 나타낼 때 사용하는 조수사 구조로, 복수형인 pieces를 사용하여 &#39;여러 점의~&#39;라는 의미를 만듭니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">piece</td><td class=\"m\">작품, 한 점, 조각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그림이 보이나요</span><span class=\"en\"><b>Do you see the painting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저기 있는?</span><span class=\"en\"><b><span class=\"grammar-hl\">over there</span>?</b></span></div></div><div class=\"lec-sent-ko\">저기 있는 그림이 보이나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 말을 건네며 주의를 환기합니다. 거리에 있는 여러 작품 중 특정 작품 하나를 콕 집어서 자세히 설명하기 위해 독자의 시선을 유도하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">over there (관용표현): &#39;저기에, 저쪽에&#39;라는 의미를 가지는 부사구로 쓰여 문장 내에서 장소를 지칭합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">over there</td><td class=\"m\">저기에, 저쪽에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 예술가 STIK의 작품이다.</span><span class=\"en\"><b>It is <span class=\"grammar-hl\">by the artist STIK</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 예술가 STIK의 작품입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 시선을 유도한 그림을 그린 주체가 누구인지 밝힙니다. 이제부터 스틱이라는 특정 화가와 그의 작품 세계에 대한 설명이 이어질 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by the artist STIK (전치사구): 전치사 by는 행위자나 창조자를 나타내는 역할을 하여, 해당 그림이 &#39;예술가 STIK에 의해 만들어진 작품&#39;임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 유명하다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">is famous</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 선과 점만을 사용하는 것으로</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> <span class=\"grammar-hl\">using</span> only lines and dots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인체를 그린 그의 그림에서.</span><span class=\"en\"><b>in his paintings of human bodies.</b></span></div></div><div class=\"lec-sent-ko\">그는 인물을 그릴 때 오직 선과 점만 사용하는 것으로 유명합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스틱이라는 화가가 가진 고유한 화풍을 설명합니다. using only lines and dots는 복잡한 묘사를 배제하고 아주 단순한 형태로 사람의 특징을 표현해 내는 그의 독창적인 방식을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is famous for (관용표현): be famous for 구조로 &#39;~로 유명하다&#39;라는 의미를 나타내며, 전치사 for 뒤에는 유명해진 이유나 특징이 이어집니다.</div><div class=\"lec-gr-item\">using (동명사): 전치사 for의 목적어 역할을 하기 위해 동사 use에 -ing가 결합한 동명사입니다. &#39;사용하는 것&#39;이라는 명사적 개념으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dot</td><td class=\"m\">점, 둥근 점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">STIK에 따르면,</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span> STIK,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 세 인물은 쇼디치의 과거, 현재, 그리고 미래를 나타낸다.</span><span class=\"en\"><b>the three figures represent the past, present, and future of Shoreditch.</b></span></div></div><div class=\"lec-sent-ko\">STIK에 따르면, 이 세 인물은 쇼디치의 과거, 현재, 미래를 나타냅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림 속에 등장하는 인물들이 단순한 사람을 넘어 이 지역의 시간적 변화를 담고 있다는 것을 설명합니다. 작가의 의도를 직접 빌려와 작품이 품고 있는 상징적 의미를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">According to (관용표현): According to + 명사(대명사) 구조로 &#39;~에 따르면&#39;이라는 의미를 가지며, 정보의 출처를 밝히는 전치사구 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따르면, ~에 의하면</td></tr><tr><td class=\"w\">figure</td><td class=\"m\">인물, 형상, 모양</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 대표하다, 상징하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 인물이 어떤 것을 나타낼까요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Which figure</span> <span class=\"grammar-hl\">represents which</span>?</b></span></div></div><div class=\"lec-sent-ko\">어떤 인물이 각각 어떤 시대를 나타낼까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 다시 질문을 던져 호기심을 유발합니다. 그려진 세 명의 인물 중 누가 과거이고 현재이며 미래인지 스스로 생각하고 맞춰보게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Which figure 의문사 구조: 첫 번째 Which는 의문형용사로 쓰여 뒤의 명사 figure를 수식(&#39;어느 인물&#39;)하며 주어 역할을 합니다.</div><div class=\"lec-gr-item\">represents which 의문사 구조: 두 번째 which는 의문대명사로 쓰여 타동사 represents의 목적어(&#39;어느 것을&#39;) 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">figure</td><td class=\"m\">인물, 형상, 모양</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 대표하다, 상징하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 세 인물의 눈을 자세히 보세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">look closely at</span> the eyes of the three figures.</b></span></div></div><div class=\"lec-sent-ko\">자, 세 인물의 눈을 자세히 살펴보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 힌트를 제시하기 위해 관찰해야 할 지점을 구체적으로 짚어 줍니다. look closely at the eyes는 작품을 감상할 때 눈동자의 방향이나 모양에 작가가 숨겨둔 의도가 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look closely at (명령문/관용표현): 주어(You)가 생략되고 동사원형 look으로 시작하는 명령문입니다. look at(~을 보다) 구조 사이에 부사 closely가 들어가 &#39;자세히 보다&#39;라는 동사구를 이룹니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">figure</td><td class=\"m\">인물, 형상, 모양</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">자세히, 면밀히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 단지 점들이다,</span><span class=\"en\"><b>They are just dots,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것들은 여러분에게 단서를 줄 것이다.</span><span class=\"en\"><b>but they will <span class=\"grammar-hl\">give you a clue</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 단지 점에 불과하지만, 여러분에게 단서를 제공할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스틱의 그림에서 눈은 비록 단순한 점에 불과하지만, 그 점의 미세한 차이가 과거, 현재, 미래를 구분하는 핵심 열쇠가 된다고 결론을 내립니다. 작품을 능동적으로 감상하는 방법을 알려 주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give you a clue 4형식(SVOO) 구조: 수여동사 give + 간접목적어(you) + 직접목적어(a clue) 구조입니다. &#39;~에게 ...을 주다&#39;라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dot</td><td class=\"m\">점, 둥근 점</td></tr><tr><td class=\"w\">clue</td><td class=\"m\">단서, 실마리</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class
