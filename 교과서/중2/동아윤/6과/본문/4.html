정부의 초청(invitation)</li><li>1958년 한국(Korea)으로 귀환(returned)</li><li>이후 다시는 떠나지 않음(never left again)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02여생의 헌신</div><ul><li>그는 남은 평생을 한국인과 가난한 학생들을 돕는 데 바쳤다.</li><li>여생(the rest of his life) 동안 헌신함</li><li>한국인을 돕기 위해 열심히 노력함(worked hard)</li><li>특히 가난한 학생들(poor students)을 지원함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03서거 및 안장</div><ul><li>1970년에 서거하여 서울 국립 현충원에 안장되었다.</li><li>1970년 4월 스코필드 박사 서거(died)</li><li>국립 서울 현충원(Seoul National Cemetery)에 안장됨(buried)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">return to</td><td class=\"m\">~로 돌아가다, ~에 복귀하다</td></tr><tr><td class=\"w\">at the invitation of</td><td class=\"m\">~의 초청으로, ~의 초대를 받아</td></tr><tr><td class=\"w\">government</td><td class=\"m\">정부, 정권</td></tr><tr><td class=\"w\">for the rest of one&#39;s life</td><td class=\"m\">남은 평생 동안, 여생 동안</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">especially</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">bury</td><td class=\"m\">매장하다, 묻다</td></tr><tr><td class=\"w\">cemetery</td><td class=\"m\">묘지, 공동묘지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1958년,</span><span class=\"en\"><b>In 1958,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 한국으로 돌아왔다</span><span class=\"en\"><b>he returned to Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국 정부의 초청으로</span><span class=\"en\"><b><span class=\"grammar-hl\">at the invitation of</span> the Korean government</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다시는 떠나지 않았다.</span><span class=\"en\"><b>and never left again.</b></span></div></div><div class=\"lec-sent-ko\">1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 한국을 떠났던 그가 다시 돌아오게 된 배경을 설명하는 문장입니다. at the invitation of the Korean government는 개인적인 방문을 넘어 한국 정부가 그의 과거 공로를 인정하여 공식적으로 예우를 갖춰 모셔 왔다는 의미입니다. never left again은 그가 남은 생애 동안 한국에 뼈를 묻겠다는 확고한 결심을 하고 이를 실천했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at the invitation of (관용표현): &#39;~의 초청으로&#39;라는 의미를 나타내는 전치사구 관용 표현이다.</div><div class=\"lec-gr-item\">returned ... and never left (병렬구조): 등위접속사 and를 중심으로 과거 시제 동사 returned와 (never) left가 병렬로 연결되어 주어 he에 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at the invitation of</td><td class=\"m\">~의 초청으로, ~의 초대를 받아</td></tr><tr><td class=\"w\">government</td><td class=\"m\">정부, 정권</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여생 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">For the rest of his life</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 열심히 일했다</span><span class=\"en\"><b>he worked hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국인들을 돕기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">to help</span> Koreans,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 가난한 학생들을.</span><span class=\"en\"><b>especially poor students.</b></span></div></div><div class=\"lec-sent-ko\">그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 열심히 일했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 다시는 떠나지 않겠다고 한 그가 한국에서 구체적으로 어떤 삶을 살았는지 행적을 밝히는 문장입니다. For the rest of his life를 통해 일시적인 선행이 아니라 생을 마감할 때까지 이어진 한결같은 헌신임을 알려줍니다. 특히 경제적으로 어려운 환경에 놓인 학생들의 교육과 자립을 돕기 위해 스스로 발 벗고 나섰음을 알 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For the rest of his life (관용표현): &#39;그의 남은 평생 동안&#39;이라는 의미로, 시간의 길이를 나타내는 전치사 for와 함께 쓰인 표현이다.</div><div class=\"lec-gr-item\">to help (to부정사): 부사적 기능(목적). 주어와 동사(he worked hard)가 있는 완전한 절 뒤에 덧붙어 앞선 행위의 목적(~하기 위해서)을 나타내는 수식어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">especially</td><td class=\"m\">특히, 특별히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는 세상을 떠났다</span><span class=\"en\"><b>Dr. Schofield died</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1970년 4월에,</span><span class=\"en\"><b>in April 1970,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 안장되었다</span><span class=\"en\"><b>and he <span class=\"grammar-hl\">was buried</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국립서울현충원에.</span><span class=\"en\"><b>in Seoul National Cemetery.</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 헌신적인 생애를 마무리하고 사후의 결과를 보여주는 결론 문장입니다. Seoul National Cemetery는 국가를 위해 큰 공헌을 한 국가 유공자들을 모시는 곳입니다. 따라서 이 대목은 그가 비록 외국인이지만 평생에 걸친 헌신과 사랑을 한국 사회가 높이 평가하여 국가적 영웅에 준하는 최고의 예우를 다했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was buried (수동태): be동사(was) + p.p.(buried) 구조. bury는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) was buried 형태로 쓴다. 기본구조: bury + O + 전치사구 (O를 ~에 묻다/안장하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cemetery</td><td class=\"m\">묘지, 공동묘지</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스코필드 박사는 1958년 한국 정부의 초청을 받아 한국으로 돌아온 후 영주하게 되었다.</li><li>그는 남은 평생을 가난한 한국 학생들을 돕는 데 헌신하며 살았다.</li><li>1970년 세상을 떠난 후, 외국인임에도 그의 헌신과 공로를 인정받아 서울 국립현충원에 안장되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield dedicated his later life to supporting Koreans, so he was honored with a burial at the national cemetery.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 노년을 한국인을 지원하는 데 헌신했으며, 그 결과 국립묘지에 안장되는 예우를 받았다.</div></div></div>"],"segs":[[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/3.mp3","hl":null},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 동아(윤정미) 6과 본문4_강의_audio/17.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.g
