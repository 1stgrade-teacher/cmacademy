국을 자신의 제2의 고향으로 여겨 평생을 헌신하겠다는 의지를 보여주는 역사적 맥락을 담고 있습니다. 특히 그가 국립서울현충원(Seoul National Cemetery)에 안장된 것은 외국인으로서는 매우 이례적인 일인데, 이는 그가 한국인들에게 얼마나 존경받는 인물이었는지를 잘 나타내 줍니다. 마치 우리나라를 위해 헌신한 든든한 조력자를 기억하듯이, 이 글을 읽을 때 그가 한국 사회에 남긴 박애 정신을 떠올려 보면 내용을 더 깊이 이해할 수 있을 거예요.</div></div>","<div class=\"lec-sent-no\">문장 1 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1958년에,</span><span class=\"en\"><b>In 1958,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 돌아왔다</span><span class=\"en\"><b>he returned</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국으로</span><span class=\"en\"><b>to Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초청을 받아</span><span class=\"en\"><b><span class=\"grammar-hl\">at the invitation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국 정부의</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> the Korean government</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다시는 떠나지 않았다.</span><span class=\"en\"><b>and never left again.</b></span></div></div><div class=\"lec-sent-ko\">1958년, 그는 한국 정부의 초청으로 한국으로 돌아와서 다시는 떠나지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 글의 내용에서 이어져, 그가 한국과 맺은 인연이 일시적인 것이 아니라 영구적인 결합으로 바뀌었음을 보여줍니다. invitation은 사전적으로는 &#39;초대&#39;를 의미하지만, 여기서는 국가적 차원에서 그를 필요로 했기에 이루어진 &#39;공식적인 요청&#39;이라는 뜻으로 쓰였습니다. 그가 단순히 방문한 것이 아니라 한국을 위해 헌신하러 왔다는 의지를 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at the invitation of (관용표현): &#39;~의 초청으로&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나머지를 위해</span><span class=\"en\"><b>For the rest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 삶의,</span><span class=\"en\"><b>of his life,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 열심히 일했다</span><span class=\"en\"><b>he worked hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국인들을 돕기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">to help</span> Koreans,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 가난한 학생들을.</span><span class=\"en\"><b>especially <span class=\"grammar-hl\">poor students</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 여생 동안 한국인들, 특히 가난한 학생들을 돕기 위해 열심히 일했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 그가 한국을 떠나지 않았던 이유를 설명합니다. 1번 문장의 결과로, 그가 남은 삶을 어떻게 보냈는지 구체적인 행동을 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to help (to부정사): hard(부사)를 수식하는 부사적 용법의 to부정사로, &#39;~하기 위해&#39;라는 목적을 나타냅니다.</div><div class=\"lec-gr-item\">poor students 현재분사 없음(해당없음). 형용사 poor가 명사 students를 수식하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 3</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스코필드 박사는 사망했다</span><span class=\"en\"><b>Dr. Schofield died</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1970년 4월에,</span><span class=\"en\"><b>in April 1970,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 안장되었다</span><span class=\"en\"><b>and he <span class=\"grammar-hl\">was buried</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국립서울현충원에.</span><span class=\"en\"><b>in Seoul National Cemetery.</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사는 1970년 4월에 세상을 떠났고, 국립서울현충원에 안장되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 헌신적인 삶이 마무리되었음을 알리는 문장입니다. 단순히 죽음을 알리는 것을 넘어, 한국을 사랑했던 그의 공로를 인정받아 국립현충원에 묻혔다는 사실을 통해 그가 한국 역사에서 어떤 대우를 받는 인물인지 함축적으로 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was buried (수동태): be동사(was)+p.p.(buried) 구조입니다. bury는 타동사인데 목적어가 없어서 수동구조 was buried 형태로 씁니다. 기본구조: bury + O (O를 매장하다/묻다).</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스코필드 박사는 1958년 한국 정부의 초청을 계기로 영구 귀국하였다.</li><li>남은 평생을 한국인, 특히 가난한 학생들을 돕는 데 헌신하였다.</li><li>1970년 세상을 떠난 후, 그 공로를 인정받아 국립현충원에 안장되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield returned to Korea to support those in need, and he remained committed to helping others until his death.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 어려운 사람들을 돕기 위해 한국으로 돌아왔으며, 세상을 떠날 때까지 이들을 돕는 일에 전념했다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":"main"},{"audio":"./4_audio/4.mp3","hl":"meaning"},{"audio":"./4_audio/5.mp3","hl":"grammar"}],[{"audio":"./4_audio/6.mp3","hl":"main"},{"audio":"./4_audio/7.mp3","hl":"meaning"},{"audio":"./4_audio/8.mp3","hl":"grammar"}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.cl
