</li><li>핵심 키워드: 의미(meaning)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02방한 배경</div><ul><li>캐나다 출신 의사인 그는 의학을 가르치기 위해 한국에 처음 왔습니다.</li><li>신분: 캐나다인 의사(Canadian doctor)</li><li>방문 시기와 목적: 1916년에 의학(medicine)을 가르치기 위해 방문함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03한국어 학습 열정</div><ul><li>학생들을 한국어로 가르치고 싶어 언어를 즉시 배우기 시작했습니다.</li><li>동기: 한국어로 가르치기를 원함(teach in Korean)</li><li>성과: 수년 만에 강의가 가능할 정도로 열심히 공부함(studied so hard)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04독립운동 지원</div><ul><li>모든 나라의 독립 권리를 굳게 믿었기에 한국의 독립을 적극적으로 도왔습니다.</li><li>신념: 모든 국가는 독립(independent)할 권리가 있음</li><li>활동: 한국의 독립운동(independence movement)을 지원함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">similar</td><td class=\"m\">비슷한, 유사한</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr><tr><td class=\"w\">medicine</td><td class=\"m\">의학, 약</td></tr><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 곧바로</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다, ~할 능력이 있다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right</td><td class=\"m\">권리, 정당함</td></tr><tr><td class=\"w\">independent</td><td class=\"m\">독립된, 자립적인</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">운동, 움직임</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 석호필을 아는가?</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you know</span> Seok Hopil?</b></span></div></div><div class=\"lec-sent-ko\">당신은 석호필을 아는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던지며 글의 주인공인 &#39;석호필&#39;에 대한 호기심을 불러일으키며 글을 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you know 일반동사의 의문문: 조동사(Do) + 주어(you) + 동사원형(know) 구조로 일반동사의 의문문을 만듦.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 영어 이름은 Frank W. Schofield였다</span><span class=\"en\"><b>His English name <span class=\"grammar-hl\">was</span> Frank W. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 자신의 한국 이름을 사랑했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">but</span> he loved his Korean name.</b></span></div></div><div class=\"lec-sent-ko\">그의 영어 이름은 Frank W. Schofield였지만, 그는 자신의 한국 이름을 사랑했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 질문한 &#39;석호필&#39;의 정체가 외국인임을 밝혀줍니다. 외국인이면서도 한국식으로 지은 이름을 각별히 아꼈다는 점을 짚어주어 그가 한국에 깊은 애정을 가졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was (2형식): be동사가 쓰여 주어(His English name)의 상태를 설명하는 주격 보어(Frank W. Schofield)를 연결함.</div><div class=\"lec-gr-item\">but (등위접속사): 앞절과 뒷절을 대조적인 의미로 대등하게 연결함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이름은 그의 본명과 비슷하게 들렸다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">sounded similar</span> to his real name,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 좋은 의미도 가지고 있었다.</span><span class=\"en\"><b>and it also had a good meaning.</b></span></div></div><div class=\"lec-sent-ko\">그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어, 그가 왜 자신의 한국어 이름을 좋아했는지 두 가지 이유를 들어 구체적으로 설명합니다. sounded similar to his real name은 &#39;스코필드(Schofield)&#39;라는 본래 성과 &#39;석호필&#39;의 발음이 아주 유사하여 친숙하게 느꼈음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sounded similar (2형식(감각동사)): 감각동사(sound) 뒤에 부사가 아닌 형용사(similar)가 주격 보어로 쓰인 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">similar</td><td class=\"m\">비슷한, 유사한</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는 캐나다 의사였다</span><span class=\"en\"><b>Dr. Schofield was a Canadian doctor,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 한국에 처음 왔다</span><span class=\"en\"><b>and he first came to Korea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1916년에</span><span class=\"en\"><b>in 1916</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의학을 가르치기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to teach</span> medicine.</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 주인공에 대한 구체적인 배경 정보를 제공합니다. 그가 어느 나라 출신이고 직업은 무엇이며, 언제 어떤 목적으로 한국에 오게 되었는지 설명하여 글의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach (to부정사): 부사적 역할(목적)로 쓰여 &#39;~하기 위해서&#39;라는 의미로 동사를 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">medicine</td><td class=\"m\">의학, 약</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 가르치고 싶었다</span><span class=\"en\"><b>He wanted <span class=\"grammar-hl\">to teach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국어로</span><span class=\"en\"><b>in Korean,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 한국어를 배우기 시작했다</span><span class=\"en\"><b>so he began <span class=\"grammar-hl\">to learn</span> Korean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧바로.</span><span class=\"en\"><b><span class=\"grammar-hl\">right away</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국 학생들에게 그들의 모국어로 지식을 전달하겠다는 그의 굳은 의지를 보여줍니다. began to learn Korean right away는 한국에 오자마자 지체 없이 언어 공부에 뛰어들 정도로 그의 열정이 남달랐다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach (to부정사): 명사적 역할로 쓰여 타동사 want의 목적어 자리에 옴.</div><div class=\"lec-gr-item\">to learn (to부정사): 명사적 역할로 쓰여 타동사 began의 목적어 자리에 옴.</div><div class=\"lec-gr-item\">right away (관용표현): &#39;즉시, 바로&#39;라는 의미를 나타내는 부사구 형태의 숙어.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 곧바로</td></tr><tr><td class=\"w\">right</td><td class=\"m\">권리, 정당함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 매우 열심히 공부했다</span><span class=\"en\"><b>He studied <span class=\"grammar-hl\">so hard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 가르칠 수 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> he <span class=\"grammar-hl\">was able to teach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국어로</span><span class=\"en\"><b>in Korean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단 몇 년 만에.</span><span class=\"en\"><b>after only a few years.</b></span></div></div><div class=\"lec-sent-ko\">그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 그의 결심과 노력이 어떤 결실을 맺었는지 보여주는 문장입니다. 외국인이 짧은 기간 안에 의학이라는 고도의 전문 지식을 한국어로 가르칠 수준에 도달했다는 것은 그가 얼마나 피나는 노력을 했는지 짐작하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so hard that so ~ that 구문: &#39;so + 부사(hard) + that절&#39; 형태로 &#39;너무 ~해서 그 결과 ...하다&#39;라는 원인과 결과를 나타내는 구조.</div><div class=\"lec-gr-item\">was able to teach (관용표현/to부정사): &#39;be able to + 동사원형(to부정사)&#39; 형태로 &#39;~할 수 있다&#39;는 능력을 나타내며 조동사 could와 같은 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 믿었다</span><span class=\"en\"><b>He believed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 나라는 독립할 권리가 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> every country has the right <span class=\"grammar-hl\">to be independent</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는 한국의 독립운동을 도왔다.</span><span class=\"en\"><b>so he helped the Korean independence movement.</b></span></div></div><div class=\"lec-sent-ko\">그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며 그가 언어와 교육을 넘어 한국 역사에 깊이 관여하게 된 결정적인 이유를 밝힙니다. 그가 한국에 온 1910년대는 일제강점기였습니다. helped the Korean independence movement는 외국인이라는 안전한 신분에 머물지 않고, 핍박받는 한국인들의 편에 서서 억압에 맞서는 활동을 직접적으로 지원했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that 명사절 접속사: 타동사(believed)의 목적어 역할을 하는 완전한 절을 이끄는 접속사.</div><div class=\"lec-gr-item\">to be independent (to부정사): 형용사적 역할로 쓰여 바로 앞의 명사(the right)를 뒤에서 수식하는 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right</td><td class=\"m\">권리, 정당함</td></tr><tr><td class=\"w\">independent</td><td class=\"m\">독립된, 자립적인</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">운동, 움직임</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>프랭크 W. 스코필드는 &#39;석호필&#39;이라는 한국어 이름을 사랑하고 아꼈던 캐나다 출신 의사였다.</li><li>그는 한국 학생들을 위해 한국어를 배워 단 몇 년 만에 모국어가 아닌 한국어로 의학 수업을 해냈다.</li><li>더 나아가 모든 국가의 주권을 존중하는 굳은 신념을 바탕으로 일제강점기 한국의 독립운동을 적극적으로 도우며 헌신했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Frank W. Schofield originally came to Korea to teach medicine, but he actively supported the Korean independence movement due to his strong belief in national sovereignty.</div>\n              <div class=\"lec-final-sum-ko\">프랭크 W. 스코필드는 원래 의학을 가르치기 위해 한국에 왔지만, 국가 주권에 대한 강한 신념 때문에 한국의 독립운동을 적극적으로 지원했다.</div></div></div>"],"segs":[[{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/3.mp3","hl":null},{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/9.mp3","hl":"main"},{"audio":"./중2 동아(윤정미) 6과 본문2_강의_audio/10.mp3","hl":"meaning"},{"a
