<b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 지문을 더 깊이 이해하시려면 먼저 1919년 3월 1일에 일어난 3.1 운동(March 1st Movement)이라는 역사적 사건을 알아두시면 좋아요. 당시 한국은 일본의 가혹한 식민 지배를 받고 있었고, 수많은 민중이 독립(Independence)을 평화적으로 외치며 거리로 나섰답니다. 지문에 등장하는 프랭크 스코필드(Frank W. Schofield) 박사는 캐나다 출신의 선교사이자 의학자로, 마치 오늘날 숨겨진 진실이나 억울한 사건을 스마트폰으로 찍어 전 세계 SNS에 폭로하는 시민 기자처럼 당시의 긴박하고 위험한 상황을 카메라에 담아 국제 사회에 알리는 역할을 했습니다. 일본 경찰의 엄격한 감시를 피해 목숨을 걸고 남긴 그의 기록들 덕분에 일본의 무자비한 탄압이 세상에 드러날 수 있었으며, 이로 인해 그는 한국인들에게 &#39;제34인의 민족대표(The 34th National Representative)&#39;라고 불릴 만큼 큰 존경을 받고 있습니다. 이러한 역사적 배경과 일제의 탄압이라는 시대적 상황을 떠올리며 글을 읽으시면, 그가 왜 건물에 몰래 숨어서 셔터를 눌러야만 했는지 그날의 긴장감이 훨씬 생생하게 와닿으실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01특별한 부탁</div><ul><li>1919년 2월 28일, 한 남자가 스코필드 박사에게 찾아와 역사적인 부탁을 한다.</li><li>한 남자가 방문하여 특별한 부탁(special favor)을 함</li><li>한국의 독립(independence)을 위해 모이는 사람들의 사진 촬영을 요청함</li><li>촬영한 사진을 전 세계(world)와 공유해 달라고 당부함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02역사의 현장 기록</div><ul><li>3월 1일 오후 2시, 스코필드 박사는 건물에 숨어서 사람들이 모인 현장을 사진으로 남긴다.</li><li>스코필드 박사가 건물에 숨어(hiding) 밖을 관찰함</li><li>밖으로 모여드는 수많은 사람들의 무리(large group)를 목격함</li><li>역사적 현장의 사진을 찍기(take pictures) 시작함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03세상에 알리려는 소망</div><ul><li>스코필드 박사는 엄청난 군중의 모습에 놀라며 이 사건이 세계에 알려지기를 바란다.</li><li>수많은 인파에 믿을 수 없다(Unbelievable)며 감탄함</li><li>자신의 사진을 통해 세상이 이 중요한 사건(important event)을 알게 되기를 희망함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">foreigner</td><td class=\"m\">외국인, 타관 사람</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">부탁, 호의, 친절</td></tr><tr><td class=\"w\">be going to</td><td class=\"m\">~할 예정이다, ~할 것이다</td></tr><tr><td class=\"w\">gather</td><td class=\"m\">모이다, 모으다</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take pictures of</td><td class=\"m\">~의 사진을 찍다, 촬영하다</td></tr><tr><td class=\"w\">share with</td><td class=\"m\">~와 공유하다, ~와 나누다</td></tr><tr><td class=\"w\">hide</td><td class=\"m\">숨다, 숨기다, 은닉하다</td></tr><tr><td class=\"w\">unbelievable</td><td class=\"m\">믿을 수 없는, 놀라운</td></tr><tr><td class=\"w\">learn about</td><td class=\"m\">~에 대해 알게 되다, ~에 관해 배우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사,</span><span class=\"en\"><b>Dr. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국을 사랑한 외국인</span><span class=\"en\"><b>a Foreigner <span class=\"grammar-hl\">Who</span> Loved Korea</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사, 한국을 사랑한 외국인</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 제목으로, 앞으로 한국의 독립운동과 깊은 관련이 있는 외국인 스코필드 박사의 일화가 전개될 것임을 알려줍니다. a Foreigner Who Loved Korea는 스코필드 박사가 어떤 인물인지를 부연 설명해 주는 동격 표현으로 쓰였습니다. 3.1 운동이 일어나기 하루 전날의 상황을 제시하며 이야기를 시작합니다. 역사적인 사건이 일어나기 직전의 구체적인 날짜를 밝혀 묘한 긴장감을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who (관계대명사): 선행사 a Foreigner를 수식하는 주격 관계대명사이다. 관계대명사절 내에서 주어 역할을 하며 바로 뒤에 동사 Loved가 이어지는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">foreigner</td><td class=\"m\">외국인, 타관 사람</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1919년 2월 28일,</span><span class=\"en\"><b>On February 28, 1919,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 남자가 왔다</span><span class=\"en\"><b>a man <span class=\"grammar-hl\">came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사의 집에</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> Dr. Schofield’s house.</b></span></div></div><div class=\"lec-sent-ko\">1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3.1 운동이 일어나기 하루 전날의 상황을 제시하며 이야기를 시작합니다. 역사적인 사건이 일어나기 직전의 구체적인 날짜를 밝혀 묘한 긴장감을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came to (전치사구): 자동사 came 뒤에 방향과 목적지를 나타내는 전치사 to가 이어져 명사구(Dr. Schofield’s house)와 함께 부사구를 형성하는 1형식 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자: Schofield 박사님,</span><span class=\"en\"><b>A man: Dr. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 특별한 부탁이 있습니다</span><span class=\"en\"><b>I have a special favor</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 드릴</span><span class=\"en\"><b><span class=\"grammar-hl\">to ask</span> you.</b></span></div></div><div class=\"lec-sent-ko\">남자: Schofield 박사님, 특별한 부탁이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 찾아온 남자가 스코필드 박사에게 방문 목적을 밝히는 부분입니다. have a special favor to ask는 누군가에게 중요하고 예외적인 부탁을 할 때 흔히 쓰이는 표현입니다. 평범한 일상적 부탁이 아니라, 이어질 역사적 사건과 관련된 중대한 요청임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to ask (to부정사): 형용사적 용법. to ask가 앞의 명사 a special favor를 수식하는 구조이다. ask는 4형식(ask + 간접목적어 + 직접목적어) 동사로, 여기서는 직접목적어가 수식을 받는 명사(a special favor)로 빠져나가고 간접목적어(you)만 남아 있는 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">favor</td><td class=\"m\">부탁, 호의, 친절</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사: 제가 무엇을 해 드릴까요?</span><span class=\"en\"><b>Dr. Schofield: <span class=\"grammar-hl\">What can I do</span> for you?</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사: 제가 무엇을 해 드릴까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남자의 요청에 대한 스코필드 박사의 호의적인 반응을 보여줍니다. 상대방의 부탁을 기꺼이 들어주려는 열린 태도가 잘 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can I do 의문문 구조: 의문대명사 What이 문장의 목적어 역할을 하며 맨 앞으로 이동하고, 조동사(can) + 주어(I) + 동사원형(do)의 어순으로 도치된 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자: 많은 사람들이 내일 모일 예정입니다</span><span class=\"en\"><b>A man: Many people <span class=\"grammar-hl\">are going to gather</span> tomorrow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립을 위해</span><span class=\"en\"><b>for the independence of Korea.</b></span></div></div><div class=\"lec-sent-ko\">남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 내일(3월 1일) 있을 거대한 시위, 즉 3.1 운동의 계획을 미리 알려주는 문장입니다. for the independence of Korea라는 어구를 통해 사람들이 모이는 핵심 목적이 일제 치하에서 벗어나기 위한 만세 운동임을 분명히 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are going to gather (관용표현): be going to + 동사원형 구조로 미래의 계획이나 의도를 나타낸다. 조동사 will과 유사한 역할을 하며 뒤에 동사원형 gather가 결합되었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gather</td><td class=\"m\">모이다, 모으다</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 사건의 사진을 찍어서</span><span class=\"en\"><b>Could you take pictures of the event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 공유해(알려) 주실 수 있으세요</span><span class=\"en\"><b>and <span class=\"grammar-hl\">share</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계와?</span><span class=\"en\"><b>with the world?</b></span></div></div><div class=\"lec-sent-ko\">그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 거국적인 만세 운동과 관련하여 외국인인 스코필드 박사가 해 주기를 바라는 구체적인 임무입니다. take pictures of the event and share them은 일제의 탄압을 피해 이 평화적인 독립운동의 실상을 객관적인 시각 자료로 남겨 국제 사회에 알려 달라는 절박한 요청을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">share (병렬구조): 등위접속사 and에 의해 앞의 동사원형 take와 뒤의 동사원형 share가 병렬 구조를 이루고 있다. 두 동사 모두 조동사 Could you에 공통으로 연결된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take pictures of</td><td class=\"m\">~의 사진을 찍다, 촬영하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">3월 1일 오후 2시,</span><span class=\"en\"><b>At 2 p.m. on March 1,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는 숨어 있었다</span><span class=\"en\"><b>Dr. Schofield was hiding</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 건물에</span><span class=\"en\"><b>in a building</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 많은 사람들을 보았다</span><span class=\"en\"><b>and saw a large group of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밖에 모여드는</span><span class=\"en\"><b><span class=\"grammar-hl\">gathering</span> outside.</b></span></div></div><div class=\"lec-sent-ko\">3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간이 흘러 남자가 말했던 당일(3.1 운동)의 현장 상황으로 전환됩니다. was hiding in a building이라는 묘사는 당시 일본 경찰의 감시를 피해야 했던 급박하고 위험한 시대적 분위기를 생생하게 전달해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gathering 5형식(SVOC) 구조 / 현재분사: 지각동사(saw) + 목적어(a large group of people) + 목적격보어(-ing) 구조이다. 목적어와 목적격보어의 관계가 능동 및 진행이므로 목적격보어 자리에 현재분사 gathering이 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gather</td><td class=\"m\">모이다, 모으다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 사진을 찍기 시작했다.</span><span class=\"en\"><b>He began <span class=\"grammar-hl\">to take</span> pictures.</b></span></div></div><div class=\"lec-sent-ko\">그는 사진을 찍기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 거대한 군중을 확인한 스코필드 박사가 남자의 부탁대로 자신이 맡은 역할을 수행하기 시작하는 모습입니다. 위험을 무릅쓰고 역사의 현장을 기록하는 행동을 간결하고 힘 있게 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take (to부정사): 명사적 용법. to take가 타동사 began의 목적어 역할을 하여 명사처럼 쓰인 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사: 믿을 수 없어!</span><span class=\"en\"><b>Dr. Schofield: <span class=\"grammar-hl\">Unbelievable</span>!</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사: 믿을 수 없어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사진을 찍으며 현장의 규모를 직접 목격한 스코필드 박사의 놀라움을 나타냅니다. 독립을 향한 한국인들의 엄청난 열망과 자발적인 참여 규모에 감탄하는 감정이 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Unbelievable 형용사: 주어와 동사(It is 등)가 생략되고 감정을 나타내는 형용사 단독으로 쓰여 감탄문 역할을 하는 축약된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unbelievable</td><td class=\"m\">믿을 수 없는, 놀라운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말 많은 사람들이 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span> so many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기엔.</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">여기엔 정말 많은 사람들이 있어.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문장 맨 앞에 오면서 동사(are) + 주어(so many people)의 어순으로 도치된 구조이다. 진짜 주어가 복수명사이므로 복수형 be동사 are가 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 바란다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">hope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계가 알게 되기를</span><span class=\"en\"><b><span class=\"grammar-hl\">the world</span> will learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 중요한 사건에 대해</span><span class=\"en\"><b>about this important event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 사진을 통해.</span><span class=\"en\"><b>through my pictures.</b></span></div></div><div class=\"lec-sent-ko\">내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남자의 부탁을 수락한 스코필드 박사의 최종적인 목표이자 진심이 담긴 결론입니다. learn about this important event는 단순히 소식을 듣는 것을 넘어, 일제 강점기 한국인들의 독립 의지가 얼마나 강렬한지 국제 사회가 제대로 인식하고 공감하게 되기를 간절히 바라는 마음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hope the world 명사절 접속사 생략: 타동사 hope와 주어 the world 사이에 목적어 역할을 하는 명사절을 이끄는 접속사 that이 생략된 구조이다. (hope + [that] + S + V)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learn about</td><td class=\"m\">~에 대해 알게 되다, ~에 관해 배우다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>1919년 2월 28일, 한 남자가 스코필드 박사를 찾아와 다음 날 열릴 독립 만세 운동 현장을 사진으로 찍어 세계에 알려 달라고 부탁한다.</li><li>스코필드 박사는 이 중요하고 위험한 부탁을 흔쾌히 수락한다.</li><li>3월 1일, 건물에 숨어 거대한 군중을 목격한 스코필드 박사는 한국인들의 엄청난 참여에 크게 놀라며 사진을 찍는다.</li><li>그는 자신이 기록한 사진을 통해 한국의 독립 의지가 전 세계에 널리 알려지기를 간절히 바란다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield accepted the request to photograph the Korean independence movement, and he planned to share the historic event with the world.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 한국의 독립운동을 촬영해 달라는 요청을 수락했으며, 그 역사적인 사건을 전 세계와 공유하고자 했다.</div></div></div>"],"segs":[[{"audio":"./중2 동아(윤정미) 6과 본문1_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문1_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 동아(윤정미) 6과 본문1_강의_audio/3.mp3","hl":null},{"audio":"./중2 동아(윤정미) 6과 본문1_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 동아(윤정미) 6과 본문1_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 동아(윤정미
