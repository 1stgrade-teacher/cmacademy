<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 동아(윤) 6과 본문1 — Lesson06</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"중2 동아(윤) 6과 본문1","audioDir":"1_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">6과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 동아(윤)\u003c/div>\u003ch1>Dr. Schofield: The Eye that Documented Korea's Fight for Freedom\u003c/h1>\u003ch2>독립을 향한 푸른 눈의 목격자, 석호필 박사\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>캐나다인 의사 \u003cb class=\"key\">Schofield \u003c/b>\u003cb class=\"key\">박사\u003c/b>가 1919년 \u003cb class=\"key\">3·1 \u003c/b>\u003cb class=\"key\">운동\u003c/b> 현장을 사진으로 기록하고, 자신의 한국 이름 \u003cb class=\"key\">석호필\u003c/b>처럼 한국의 독립을 진심으로 도운 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Dr. Schofield supported and publicized the Korean independence movement by documenting the historic March 1st event through his photography.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리 역사에서 빼놓을 수 없는 아주 특별한 외국인, 석호필 박사님의 이야기를 함께 배워볼 거예요. 이 글은 캐나다 의사였던 스코필드 박사님이 어떻게 한국의 독립운동을 도왔는지, 그리고 그가 얼마나 한국을 사랑했는지를 보여주는 감동적인 글입니다. 우리 민족의 아픔과 함께했던 그의 발자취를 따라가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">1919년 \u003cb class=\"key\">3·1 \u003c/b>\u003cb class=\"key\">운동\u003c/b>은 일제 강점기 우리 민족이 전 세계에 독립 의지를 알린 최대 규모의 평화 시위입니다. 당시 일제는 정보를 엄격히 통제했기에, 외국인의 \u003cb class=\"key\">객관적인 \u003c/b>\u003cb class=\"key\">기록\u003c/b>과 증언은 국제 사회의 지지를 얻는 데 매우 결정적인 역할을 했습니다. 마치 오늘날의 \u003cb class=\"key\">종군 \u003c/b>\u003cb class=\"key\">기자\u003c/b>처럼 위험한 현장에 뛰어들어 진실을 알린 셈이죠. Schofield 박사는 제암리 학살 사건 등 일제의 만행을 세계에 폭로한 공로를 인정받아, 외국인으로서는 유일하게 \u003cb class=\"key\">국립서울현충원\u003c/b> 애국지사 묘역에 안장되었습니다. 그는 한국인들에게 \u003cb class=\"key\">석호필\u003c/b>이라는 친근한 이름으로 기억되며 여전히 존경받고 있습니다.\u003c/div>","segs":[{"n":2,"text":"삼일운동은 우리 민족이 일제의 압제에 맞서 평화적으로 독립을 외친 역사적인 사건이에요. 하지만 당시 일본은 이 사실이 세계에 알려지는 걸 막기 위해 언론을 통제했죠. 이때 스코필드 박사님 같은 외국인의 시선과 기록은 한국의 상황을 세계에 알리는 유일한 통로였습니다. 박사님은 위험을 무릅쓰고 사진을 찍었는데, 이는 오늘날 우리가 당시의 생생한 모습을 볼 수 있는 귀중한 자료가 되었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특별한 부탁\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>천구백십구 년 삼일절 전날, 한 남자가 \u003cb class=\"key\">Schofield \u003c/b>\u003cb class=\"key\">박사\u003c/b>를 찾아와 역사적인 현장을 사진으로 남겨 \u003cb class=\"key\">세계에 \u003c/b>\u003cb class=\"key\">홍보\u003c/b>해달라는 간곡한 부탁을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>역사의 목격\u003csmall>예시 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>박사는 건물에 숨어 \u003cb class=\"key\">3·1 \u003c/b>\u003cb class=\"key\">운동\u003c/b>의 거대한 인파를 촬영하며, 이 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">사건\u003c/b>이 자신의 사진을 통해 전 세계에 알려지기를 간절히 소망합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>석호필의 정체\u003csmall>전환 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>그는 Frank W. Schofield라는 본명 대신, 발음이 비슷하고 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 가진 한국 이름 \u003cb class=\"key\">석호필\u003c/b>을 사용할 정도로 한국을 깊이 사랑했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>신념과 헌신\u003csmall>결론 · 문장 15–18\u003c/small>\u003c/h4>\u003cp>캐나다 의사로서 의학을 가르치러 온 그는 모든 나라의 \u003cb class=\"key\">독립할 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 믿었기에, 열정적으로 \u003cb class=\"key\">한국어\u003c/b>를 배우며 독립운동을 전폭적으로 도왔습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 긴박했던 삼일운동 전야의 부탁에서 시작해서 박사님의 신념으로 이어지는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계는 천구백십구 년 이 월 이십팔 일에 있었던 만남입니다. 한 남자가 스코필드 박사님의 집을 찾아와 독립운동 현장을 사진으로 찍어 세계에 알려달라는 특별한 부탁을 하는 장면이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 실제 삼일절 당일의 모습입니다. 박사님은 오후 두 시에 건물 안에 숨어서 밖으로 모여드는 수많은 사람을 목격하게 돼요. 그리고 이 사진들을 통해 세계가 이 중요한 사건을 알게 되길 간절히 희망하며 셔터를 누릅니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 박사님의 정체를 더 깊이 알아봅니다. 그는 석호필이라는 한국 이름을 가졌는데, 단순히 발음만 비슷한 게 아니라 의미까지 좋아서 이 이름을 아주 소중히 여겼다고 해요.","hl":"f2"},{"n":7,"text":"마지막 단계는 그의 헌신과 신념입니다. 천구백십육 년에 한국에 온 그는 한국어로 의학을 가르칠 만큼 열정적으로 공부했고, 모든 나라는 독립할 권리가 있다는 숭고한 믿음으로 우리 독립운동을 도왔습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순/일대기\u003c/span>\u003cspan class=\"lp-pill\">혼합식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분은 특정 날짜와 시간의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사건\u003c/b>을 묘사하는 에피소드 방식으로 시작됩니다. 이후 인물의 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>와 이름의 유래를 설명하며, 마지막에 박사가 독립운동을 도운 근본적인 \u003cb class=\"key\">신념과 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 제시하며 마무리됩니다. 전형적인 인물 소개의 \u003cb class=\"key\">연대기적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 따르고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On February 28, 1919 (1)\u003c/b>\u003cspan>시간적 배경 설정\u003c/span>\u003cb>At 2 p.m. on March 1 (6)\u003c/b>\u003cspan>사건의 전개\u003c/span>\u003cb>He wanted to..., so... (16)\u003c/b>\u003cspan>인과관계 설명\u003c/span>\u003cb>He believed that..., so... (18)\u003c/b>\u003cspan>최종 결론 및 행동의 근거\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Dr. Schofield\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Frank W. Schofield\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Seok Hopil\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a Canadian doctor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간의 흐름에 따라 이야기가 전개되는 연대기적 구성입니다. 처음에는 삼일운동 당시의 구체적인 에피소드를 보여주고, 나중에는 박사님의 과거 배경과 신념을 설명하는 방식으로 독자의 흥미와 감동을 동시에 잡고 있어요.","hl":"ty"},{"n":9,"text":"신호어들을 살펴보면 시간의 흐름이 잘 보이죠. On February 28이나 At 2 p.m. on March 1 같은 표현들이 사건의 전개를 알려줍니다. 또한 so hard that 구문을 사용해서 박사님이 얼마나 열심히 공부했는지 그 결과를 강조하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>special favor\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>특별한 부탁\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask a favor\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>부탁하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>independence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독립\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사건, 행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다, 알리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unbelievable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>믿을 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>real name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본명\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의학, 약\u003c/span>\u003c/div>\u003cdiv>\u003cb>right away\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>즉시, 곧바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>so ~ that ...\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>매우 ~해서 ...하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right to be\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>~할 권리\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 favor는 호의나 부탁이라는 뜻이고, independence는 독립이라는 핵심 단어예요. 그리고 through my pictures에서 through는 무엇을 통하여라는 수단을 나타내는 중요한 전치사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gather\u003c/b>\u003cspan class=\"m\">모이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assemble\u003c/span>\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unbelievable\u003c/b>\u003cspan class=\"m\">믿을 수 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incredible\u003c/span>\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">believable\u003c/span>\u003cspan class=\"a\">plausible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">비슷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\ + 장소(명사) : \"~로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"On February 28, 1919, 1919년 2월 28일에. a man, 한 남자가. came, 왔다. to Dr. Schofield's house, Schofield 박사의 집으로.. 이 문장 전체를 해석하면, 1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.","hl":"m"},{"n":13,"text":"이 문장은 이야기가 시작되는 시간적 배경을 제시하고 있어요. 삼일절 바로 전날 한 남자가 박사님을 찾아오면서 중요한 사건이 시작되는 도입부입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 동사 came은 현재형인 come의 과거형으로 이미 일어난 과거의 일을 설명하고 있어요. 두 번째로 전치사 to는 방향을 나타내어 어디로 이동했는지를 나타내는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자: \u003c/span>\u003cspan class=\"en\">A man:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사님, \u003c/span>\u003cspan class=\"en\">Dr. Schofield,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 가지고 있습니다 \u003c/span>\u003cspan class=\"en\">I have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 부탁을 \u003c/span>\u003cspan class=\"en\">a special favor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 할.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자: Schofield 박사님, 특별한 부탁이 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자가 박사님을 찾아온 핵심 \u003cb class=\"key\">목적\u003c/b>이 드러나는 부분입니다. 박사님이 독립운동을 돕게 되는 결정적인 \u003cb class=\"key\">계기\u003c/b>가 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a special favor [명사] + to ask you [to부정사구] : \"당신에게 할 (부탁)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A man, 남자:. Dr. Schofield, Schofield 박사님. I have, 저는 가지고 있습니다. a special favor, 특별한 부탁을. to ask you, 당신에게 할.. 이 문장 전체를 해석하면, 남자: Schofield 박사님, 특별한 부탁이 있습니다.","hl":"m"},{"n":16,"text":"남자가 박사님에게 부탁을 하러 온 목적이 드러나는 부분이에요. 이 부탁으로 인해 박사님이 한국의 역사적 사건에서 중요한 역할을 맡게 될 것임을 암시합니다.","hl":"mn"},{"n":17,"text":"여기서 to ask you는 앞에 있는 명사인 favor를 뒤에서 꾸며주는 to부정사의 형용사적 용법이에요. 무엇을 할 부탁인지 구체적으로 수식해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사: \u003c/span>\u003cspan class=\"en\">Dr. Schofield:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 \u003c/span>\u003cspan class=\"en\">What\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 할 수 있을까요 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 위해서?\u003c/span>\u003cspan class=\"en\">for you?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Schofield 박사: 제가 무엇을 해 드릴까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 낯선 사람의 요청에 기꺼이 응답하는 박사님의 \u003cb class=\"key\">친절함\u003c/b>과 열린 \u003cb class=\"key\">태도\u003c/b>를 보여줍니다. 대화의 흐름을 이어가는 \u003cb class=\"key\">반응\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 의문문\u003c/span> : What [의문사] + can [조동사] + I [주어] + do [동사원형] : \"제가 무엇을 할 수 있을까요?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Dr. Schofield, Schofield 박사:. What, 무엇을. can I do, 제가 할 수 있을까요. for you?, 당신을 위해서?. 이 문장 전체를 해석하면, Schofield 박사: 제가 무엇을 해 드릴까요?","hl":"m"},{"n":19,"text":"상대방의 요청에 기꺼이 응답하려는 박사님의 친절함이 느껴지는 표현이에요. 도움을 주겠다는 의지를 나타내는 전형적인 질문입니다.","hl":"mn"},{"n":20,"text":"의문사 What이 문장 맨 앞에 나오고 조동사 can이 주어 앞에 위치한 의문문 형태예요. 조동사 뒤에는 반드시 do와 같은 동사원형을 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">A man: Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모일 예정입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">gather\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내일\u003c/span>\u003cspan class=\"en\">tomorrow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의 독립을 위해.\u003c/span>\u003cspan class=\"en\">for the independence of Korea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 3.1 운동 전날 밤, 남자가 스코필드 박사를 찾아와 내일 있을 \u003cb class=\"key\">독립운동\u003c/b>의 계획을 알리는 장면입니다. 화자의 \u003cb class=\"key\">미래 \u003c/b>\u003cb class=\"key\">계획\u003c/b>을 나타내기 위해 특정한 표현을 사용하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래를 나타내는 be going to\u003c/span> : be going to + [동사원형 (gather)] : \"모일 예정이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Many people, 많은 사람들이. are going to gather, 모일 예정입니다. tomorrow, 내일. for the independence of Korea, 한국의 독립을 위해.. 이 문장 전체를 해석하면, 남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.","hl":"m"},{"n":22,"text":"내일 있을 3.1 독립운동 계획을 스코필드 박사에게 미리 알려주는 장면이에요. 곧 일어날 구체적인 미래 계획을 말하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 미래를 나타내는 are going to gather 예요. 이미 정해진 미래의 계획을 나타낼 때 쓰는 표현이죠. 주어인 Many people이 복수이기 때문에 비동사는 are를 써야 한다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진을 찍어 주실 수 있으세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Could \u003c/span>\u003cspan class=\"tgt\">you\u003c/span> take pictures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사건의\u003c/span>\u003cspan class=\"en\">of the event\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들을 공유해 주실 수 있으세요\u003c/span>\u003cspan class=\"en\">and share them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계와?\u003c/span>\u003cspan class=\"en\">with the world?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독립운동 현장을 \u003cb class=\"key\">기록\u003c/b>하여 전 세계에 \u003cb class=\"key\">알려달라\u003c/b>고 정중하게 요청하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">정중한 요청의 조동사\u003c/span> : Could you + [동사원형] ~? : \"해주실 수 있으세요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사원형의 병렬 구조\u003c/span> : [take (V1)] + and + [share (V2)] : \"찍고 공유하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Could you take pictures, 사진을 찍어 주실 수 있으세요. of the event, 그 사건의. and share them, 그리고 그것들을 공유해 주실 수 있으세요. with the world?, 세계와?. 이 문장 전체를 해석하면, 그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?","hl":"m"},{"n":25,"text":"역사적인 독립운동 현장을 사진으로 기록해서 세상에 널리 알려달라고 간절하고 정중하게 부탁하는 내용이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 Could you는 상대방에게 정중하게 요청할 때 쓰는 표현입니다. 두 번째는 병렬 구조인데요, 조동사 뒤에 동사원형 take와 share가 and로 묶여서 연결되어 있어요. 이때 share 자리에 다른 형태를 쓰지 않도록 조심해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3월 1일 오후 2시,\u003c/span>\u003cspan class=\"en\">At 2 p.m. on March 1,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스코필드 박사는 숨어 있었다\u003c/span>\u003cspan class=\"en\">Dr. Schofield \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">hiding\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 건물 안에\u003c/span>\u003cspan class=\"en\">in a building\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 보았다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들의 무리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">group \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밖에서 모여드는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">gathering\u003c/span> outside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 3.1 운동의 긴박한 현장에서 박사가 사람들의 모임을 \u003cb class=\"key\">목격\u003c/b>하는 장면입니다. \u003cb class=\"key\">지각동사\u003c/b>를 활용해 생생한 상황을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was/were + [동사원형-ing] : \"숨어 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사의 목적격 보어(현재분사)\u003c/span> : saw [지각동사] + [목적어] + [gathering (현재분사/목적격 보어)] : \"사람들이 모여드는 것을 보았다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"At 2 p.m. on March 1, 3월 1일 오후 2시. Dr. Schofield was hiding, 스코필드 박사는 숨어 있었다. in a building, 한 건물 안에. and saw, 그리고 보았다. a large group of people, 많은 사람들의 무리가. gathering outside, 밖에서 모여드는 것을.. 이 문장 전체를 해석하면, 3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.","hl":"m"},{"n":28,"text":"드디어 약속한 3월 1일이 되었고, 스코필드 박사가 건물 안에서 몰래 독립운동 대열을 지켜보는 긴장감 넘치는 장면입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 was hiding은 과거진행형으로 당시 숨어 있던 동작을 생생하게 보여줍니다. 두 번째가 아주 중요한데요, 지각동사인 saw 뒤에 목적어와 현재분사인 gathering이 나왔어요. 사람들이 모여들고 있는 능동적인 진행의 느낌을 강조하기 위해 현재분사 형태를 쓴 것이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작했다\u003c/span>\u003cspan class=\"en\">He began\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진을 찍기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> pictures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 사진을 찍기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Schofield 박사가 3.1 운동의 역사적인 현장을 기록으로 남기기 위해 \u003cb class=\"key\">사진 \u003c/b>\u003cb class=\"key\">촬영\u003c/b>을 시작하는 행동을 묘사합니다. 당시 현장의 긴박함과 기록의 중요성을 보여주는 \u003cb class=\"key\">결정적 \u003c/b>\u003cb class=\"key\">동작\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin [타동사] + [to take (to부정사구/목적어)] : \"찍는 것을 (찍기)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He began, 그는 시작했다. to take pictures, 사진을 찍기. 이 문장 전체를 해석하면, 그는 사진을 찍기 시작했다.","hl":"m"},{"n":31,"text":"박사님이 역사적인 3.1 운동 현장을 기록하기 위해 사진을 찍기 시작하는 장면이에요. 우리 독립 운동의 소중한 순간을 카메라에 담기 시작한 거죠.","hl":"mn"},{"n":32,"text":"첫 번째로 begin이라는 동사 뒤에 나오는 to take를 주목해 보세요. 여기서 to부정사는 명사처럼 쓰여서 시작하다의 목적어 역할을 하고 있어요. 참고로 begin은 to부정사 대신 동명사인 taking을 써도 의미가 똑같답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Schofield 박사:\u003c/span>\u003cspan class=\"en\">Dr. Schofield:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿을 수 없어!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Unbelievable!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Schofield 박사: 믿을 수 없어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현장에 모인 엄청난 인파와 뜨거운 열기를 목격한 박사의 \u003cb class=\"key\">놀라움\u003c/b>을 표현합니다. 한국인들의 강렬한 \u003cb class=\"key\">독립 \u003c/b>\u003cb class=\"key\">열망\u003c/b>에 감동한 마음이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사를 이용한 감탄\u003c/span> : [형용사]! (It is가 생략된 형태) : \"믿을 수 없어!\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Dr. Schofield, Schofield 박사:. Unbelievable!, 믿을 수 없어!. 이 문장 전체를 해석하면, Schofield 박사: 믿을 수 없어!","hl":"m"},{"n":34,"text":"박사님이 창밖으로 모여든 수많은 사람을 보고 내뱉은 감탄사예요. 예상했던 것보다 훨씬 더 큰 규모의 독립 운동을 보고 깊은 인상을 받은 거죠.","hl":"mn"},{"n":35,"text":"여기서는 Unbelievable이라는 단어 하나만 쓰였는데요. 원래는 It is unbelievable이라는 문장에서 주어와 동사를 생략하고 형용사만 써서 놀란 기분을 아주 짧고 강하게 표현한 것이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 많은 사람들이\u003c/span>\u003cspan class=\"en\">so many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기에.\u003c/span>\u003cspan class=\"en\">here.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기엔 정말 많은 사람들이 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현장의 인원 규모를 구체적으로 언급하며 \u003cb class=\"key\">독립 \u003c/b>\u003cb class=\"key\">운동\u003c/b>의 열기가 얼마나 뜨거운지 강조합니다. 이 문장은 박사가 이 사실을 \u003cb class=\"key\">세계에 \u003c/b>\u003cb class=\"key\">전파\u003c/b>하겠다는 의지를 다지는 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문\u003c/span> : There [유도부사] + are [복수 동사] + so many people [복수 주어] : \"~들이 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"There are, ~이 있어. so many people, 정말 많은 사람들이. here, 여기에.. 이 문장 전체를 해석하면, 여기엔 정말 많은 사람들이 있어.","hl":"m"},{"n":37,"text":"지금 박사님이 보고 있는 현장에 사람들이 얼마나 많이 모였는지 설명하는 문장이에요. 이 많은 사람들이 모두 독립을 외치기 위해 모였다는 것이 핵심이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 There are 구문을 보세요. 이 문장에서 진짜 주어는 동사 뒤에 있는 people이에요. 주어인 people이 복수이기 때문에 동사를 단수형인 is가 아닌 복수형 are로 썼다는 것을 꼭 확인해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 바라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계가 알게 되기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span> will learn\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 중요한 사건에 대해\u003c/span>\u003c 를 배우기 시작했다.","hl":"m"},{"n":58,"text":"스코필드 박사님이 한국인들에게 의학을 더 잘 전달하기 위해 한국어를 배우기로 결심한 장면이에요. 단순한 지식 전달을 넘어 진심으로 다가가려 했던 그의 열정을 보여줍니다.","hl":"mn"},{"n":59,"text":"첫 번째로 want는 to부정사를 목적어로 취하는 동사예요. 그래서 to teach 형태가 왔죠. 두 번째로 begin도 뒤에 to learn처럼 to부정사를 쓸 수 있는데 동명사인 learning으로 바꿔 써도 의미는 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 매우 열심히 공부해서\u003c/span>\u003cspan class=\"en\">He studied \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가르칠 수 있게 되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> teach\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국어로\u003c/span>\u003cspan class=\"en\">in Korean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 년 만에.\u003c/span>\u003cspan class=\"en\">after only a few years.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 매우 열심히 공부한 끝에 단기간에 한국어로 강의할 수준이 되었다는 \u003cb class=\"key\">결과\u003c/b>를 설명합니다. \u003cb class=\"key\">so \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">that\u003c/b> 구문을 사용해 공부의 정도와 그에 따른 성취를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so + 형용사/부사 + that 절 (인과관계)\u003c/span> : so + [부사] + that + [주어 + 동사] : \"매우 열심히 해서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거의 능력 표현\u003c/span> : be able to + v [동사원형] : \"가르칠 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"He studied so hard, 그는 매우 열심히 공부해서. that he was able to teach, 그는 가르칠 수 있게 되었다. in Korean, 한국어로. after only a few years, 몇 년 만에.. 이 문장 전체를 해석하면, 그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.","hl":"m"},{"n":61,"text":"매우 열심히 공부해서 단기간에 한국어 강의가 가능해졌다는 결과적 상황을 설명합니다. 인과관계를 나타내는 구문을 통해 그의 노력이 얼마나 대단했는지 강조하죠.","hl":"mn"},{"n":62,"text":"첫 번째로 so hard that 구문은 매우 뭐뭐해서 그 결과 뭐뭐하다라는 결과의 의미를 나타내요. 두 번째로 was able to는 과거의 능력을 나타내는데 조동사 could로 바꿔 쓸 수도 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 믿었다\u003c/span>\u003cspan class=\"en\">He believed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 나라는 ~라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">권리가 있다고\u003c/span>\u003cspan class=\"en\">has the right\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독립할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">independent\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿었기에 그는 도왔다\u003c/span>\u003cspan class=\"en\">so he helped\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의 독립운동을.\u003c/span>\u003cspan class=\"en\">the Korean independence movement.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 국가의 독립은 당연한 권리라는 박사의 확고한 \u003cb class=\"key\">신념\u003c/b>이 한국을 돕게 된 근본 원인임을 보여줍니다. 그의 행동이 보편적 \u003cb class=\"key\">정의감\u003c/b>에 기반했음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believe + that [접속사] + [완전한 문장] : \"모든 나라가 ~하다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the right [명사] + to-v [to부정사구] : \"독립할 권리\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"He believed, 그는 믿었다. that every country, 모든 나라는 ~라고. has the right, 권리가 있다고. to be independent, 독립할. so he helped, 믿었기에 그는 도왔다. the Korean independence movement, 한국의 독립운동을.. 이 문장 전체를 해석하면, 그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.","hl":"m"},{"n":64,"text":"모든 국가가 독립의 권리를 가진다는 그의 확고한 신념이 한국을 돕게 된 계기였음을 밝힙니다. 단순한 호의가 아니라 보편적인 정의감에 기반한 행동이었음을 알 수 있어요.","hl":"mn"},{"n":65,"text":"첫 번째로 believed 뒤에 나오는 that은 명사절 접속사로 목적어 역할을 하는 절을 이끌어요. 두 번째로 the right 뒤의 to be independent는 앞의 명사를 꾸며주는 형용사적 용법의 to부정사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Schofield \u003c/b>\u003cb class=\"key\">박사\u003c/b>는 천구백십구 년 삼일절 전날 역사적인 사진 촬영을 부탁받았습니다.\u003c/li>\u003cli>그는 위험을 무릅쓰고 \u003cb class=\"key\">삼일운동\u003c/b> 현장을 사진으로 기록해 세계에 알리고자 했습니다.\u003c/li>\u003cli>\u003cb class=\"key\">석호필\u003c/b>이라는 한국 이름을 가졌던 그는 한국어 습득과 교육에 매우 열정적이었습니다.\u003c/li>\u003cli>모든 국가의 \u003cb class=\"key\">독립할 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 믿었던 그는 진심으로 한국의 독립운동을 도왔습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Dr. Schofield supported and publicized the Korean independence movement by documenting the historic March 1st event through his photography.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">캐나다인 의사 \u003cb class=\"key\">Schofield \u003c/b>\u003cb class=\"key\">박사\u003c/b>가 1919년 \u003cb class=\"key\">3·1 \u003c/b>\u003cb class=\"key\">운동\u003c/b> 현장을 사진으로 기록하고, 자신의 한국 이름 \u003cb class=\"key\">석호필\u003c/b>처럼 한국의 독립을 진심으로 도운 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"스코필드 박사님의 이야기는 우리에게 정의와 인류애가 국경을 초월한다는 것을 가르쳐 줍니다. 한국을 진심으로 사랑했던 푸른 눈의 독립운동가, 석호필 박사님을 꼭 기억해 주세요. 오늘 배운 중요한 문법 표현들도 복습 잊지 마시고요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
