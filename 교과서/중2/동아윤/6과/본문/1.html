다. 당시 한국의 비극적인 상황을 목격한 스코필드 박사는 위험을 무릅쓰고 현장을 직접 촬영하여 그 기록을 해외에 전파했는데, 마치 오늘날 언론인이 현장을 취재하여 진실을 보도하는 것과 같은 결정적인 역할을 했습니다. 그의 활동은 한국의 독립 의지를 국제 사회에 널리 알리는 계기가 되었으며, 덕분에 그는 외국인임에도 불구하고 &#39;민족대표 34인&#39;으로 불릴 만큼 한국인들에게 큰 존경을 받고 있답니다.</div></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사,</span><span class=\"en\"><b>Dr. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외국인</span><span class=\"en\"><b><span class=\"grammar-hl\">a Foreigner</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국을 사랑한</span><span class=\"en\"><b><span class=\"grammar-hl\">Who Loved Korea</span></b></span></div></div><div class=\"lec-sent-ko\">(Schofield 박사, 한국을 사랑한 외국인)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 본격적인 사건이 시작되는 배경을 설명합니다. 박사가 한국의 독립운동을 기록하게 된 결정적인 계기를 제공하는 인물의 등장을 알리며, 글 전체의 시간적 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a Foreigner Who Loved Korea (관계대명사): Who는 선행사 a Foreigner를 수식하는 주격 관계대명사로, 뒤에 동사 Loved가 이어지는 관계대명사절을 이끕니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1919년 2월 28일,</span><span class=\"en\"><b>On February 28, 1919,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 남자가</span><span class=\"en\"><b>a man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사의 집에.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> Dr. Schofield’s house.</b></span></div></div><div class=\"lec-sent-ko\">1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 본격적인 사건이 시작되는 배경을 설명합니다. 박사가 한국의 독립운동을 기록하게 된 결정적인 계기를 제공하는 인물의 등장을 알리며, 글 전체의 시간적 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came to (관용표현): come to는 &#39;~에 오다/도착하다&#39;라는 의미의 자동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자:</span><span class=\"en\"><b>A man:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사님,</span><span class=\"en\"><b>Dr. Schofield,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있는데</span><span class=\"en\"><b>I have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 부탁을</span><span class=\"en\"><b><span class=\"grammar-hl\">a special favor</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 요청할.</span><span class=\"en\"><b><span class=\"grammar-hl\">to ask you</span>.</b></span></div></div><div class=\"lec-sent-ko\">남자: Schofield 박사님, 특별한 부탁이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남자가 박사에게 도움을 요청하는 대화문입니다. 여기서 **favor**는 사전적으로는 &#39;호의&#39;나 &#39;친절&#39;을 의미하지만, 문맥상으로는 &#39;부탁&#39;이나 &#39;도움&#39;을 뜻합니다. 단순히 친절을 베풀어 달라는 것이 아니라, 위험할 수도 있는 행동을 요청하고 있음을 강조하기 위해 이 단어를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a special favor to ask you (to부정사): 형용사적 용법으로, to ask you가 앞의 명사 a special favor를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사:</span><span class=\"en\"><b>Dr. Schofield:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b>What</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 할 수 있을지</span><span class=\"en\"><b><span class=\"grammar-hl\">can I do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">for you</span>?</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사: 제가 무엇을 해 드릴까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박사가 남자의 요청을 수용할 의사가 있음을 보여줍니다. 앞 문장에서 남자가 &#39;특별한 부탁&#39;을 언급했으므로, 이에 대해 박사가 능동적으로 대답하며 본격적인 협력 관계가 시작됨을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can I do for you (간접의문문): 의문사 What이 문장 앞으로 나간 의문문 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">남자:</span><span class=\"en\"><b>A man:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이</span><span class=\"en\"><b>Many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내일 모일 예정이며</span><span class=\"en\"><b><span class=\"grammar-hl\">are going to gather</span> tomorrow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립을 위해.</span><span class=\"en\"><b>for the independence of Korea.</b></span></div></div><div class=\"lec-sent-ko\">남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 남자가 도움을 요청한 이유를 설명합니다. 3.1 운동이라는 역사적 사건의 전날 상황을 구체적으로 설명하며, 박사가 해야 할 일의 목적과 중요성을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are going to gather (현재진행): be동사(are) + -ing(going) 구조로 미래의 예정된 계획을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">할 수 있으세요</span><span class=\"en\"><b>Could you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 찍어</span><span class=\"en\"><b><span class=\"grammar-hl\">take pictures</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사건의</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> the event</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 공유하며</span><span class=\"en\"><b>and <span class=\"grammar-hl\">share them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계에.</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> the world?</b></span></div></div><div class=\"lec-sent-ko\">그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박사에게 구체적인 행동을 요청합니다. 단순히 현장에 있는 것을 넘어, 그 사실을 세계에 알리는 &#39;기록자&#39;이자 &#39;전달자&#39;로서의 역할을 박사에게 부여하는 중요한 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take pictures of (관용표현): take pictures of는 &#39;~의 사진을 찍다&#39;라는 의미의 숙어입니다.</div><div class=\"lec-gr-item\">share them with (관용표현): share A with B는 &#39;A를 B와 공유하다&#39;라는 의미의 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오후 2시,</span><span class=\"en\"><b>At 2 p.m.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3월 1일,</span><span class=\"en\"><b>on March 1,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사는</span><span class=\"en\"><b>Dr. Schofield</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숨어 있었고</span><span class=\"en\"><b><span class=\"grammar-hl\">was hiding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 건물에</span><span class=\"en\"><b>in a building</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보았는데</span><span class=\"en\"><b>and <span class=\"grammar-hl\">saw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">a large group of people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밖에 모여드는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">gathering outside</span>.</b></span></div></div><div class=\"lec-sent-ko\">3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 약속된 시간이 되어 사건이 벌어지는 현장 상황을 묘사합니다. 여기서 **hiding**은 사전적으로 &#39;숨어 있는&#39;인데, 여기서는 단순히 몸을 숨기는 것을 넘어 일제의 감시를 피해 독립운동을 기록해야 하는 박사의 긴박하고 위험한 처지를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was hiding (과거진행): be동사(was) + -ing(hiding) 구조로 과거의 특정 시점에 진행 중이던 동작을 나타냅니다.</div><div class=\"lec-gr-item\">saw a large group of people gathering outside 5형식(SVOC) 구조: see(지각동사) + O(a large group of people) + OC(현재분사 gathering)의 형태입니다. 현재분사 gathering은 목적어인 people이 하는 동작을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">began</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 찍기.</span><span class=\"en\"><b><span class=\"grammar-hl\">to take</span> pictures.</b></span></div></div><div class=\"lec-sent-ko\">그는 사진을 찍기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박사가 요청받은 일을 실행에 옮기는 장면입니다. 박사의 행동이 결심에서 실천으로 이어졌음을 보여주며, 역사적 현장을 기록하는 박사의 사명감이 강조됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">began to take (to부정사): begin 동사의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Schofield 박사:</span><span class=\"en\"><b>Dr. Schofield:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿을 수 없어!</span><span class=\"en\"><b><span class=\"grammar-hl\">Unbelievable</span>!</b></span></div></div><div class=\"lec-sent-ko\">Schofield 박사: 믿을 수 없어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박사가 현장에서 느끼는 놀라움과 감동을 표현합니다. 이는 한국 독립에 대한 사람들의 강력한 열망을 목격한 증인으로서의 박사의 감정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Unbelievable (관용표현): 형용사 단독으로 쓰여 &#39;믿을 수 없다&#39;는 감탄의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 많은 사람들이</span><span class=\"en\"><b>so many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기엔.</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">여기엔 정말 많은 사람들이 있어.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문두에 오면서 주어(so many people)와 동사(are)의 위치가 바뀐 도치 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바라는데</span><span class=\"en\"><b>I <span class=\"grammar-hl\">hope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계가</span><span class=\"en\"><b><span class=\"grammar-hl\">the world</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 중요한 사건에 대해 알게 되기를</span><span class=\"en\"><b><span class=\"grammar-hl\">will learn about this important event</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 사진을 통해.</span><span class=\"en\"><b>through my pictures.</b></span></div></div><div class=\"lec-sent-ko\">내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주제 의식을 담고 있습니다. 박사가 사진을 찍는 이유가 단순한 기록이 아니라, 한국의 독립 의지를 국제 사회에 알리려는 정의로운 목적임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hope the world will learn about this important event (to부정사): hope의 목적어절에 주어+동사 형태가 쓰였으며, learn about은 &#39;~에 대해 배우다/알게 되다&#39;라는 관용표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>1919년 2월 말, 한 남자가 스코필드 박사에게 한국 독립운동을 세상에 알려달라고 부탁한다.</li><li>박사는 3월 1일 위험을 무릅쓰고 현장에서 독립운동 현장을 카메라에 담는다.</li><li>박사는 자신의 사진을 통해 한국의 독립운동이 세계에 널리 알려지기를 소망한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dr. Schofield captured photographs of the March 1st Independence Movement to share Korea&#39;s desire for freedom with the international community.</div>\n              <div class=\"lec-final-sum-ko\">스코필드 박사는 한국의 자유를 향한 열망을 국제 사회에 공유하기 위해 3·1 독립 운동의 모습을 사진으로 남겼다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meaning"},{"audio":"./1_audio/5.mp3","hl":"gra
