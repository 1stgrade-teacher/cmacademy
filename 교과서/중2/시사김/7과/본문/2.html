@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 7과 본문2","audioDir":"2_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Save the Turtle Campaign: Brainstorming Solutions Together\u003c/h1>\u003ch2>바다거북 구하기 캠페인: 함께 해결책을 떠올리다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 한 학생이 반 친구들에게 \u003cb class=\"key\">가엾은 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들의 이야기를 전하자 모두 안쓰럽게 느꼈고, 우리는 \u003cb class=\"key\">캠페인 \u003c/b>\u003cb class=\"key\">모임\u003c/b>을 만들어 무엇을 해야 할지 \u003cb class=\"key\">확신\u003c/b>이 없어 함께 \u003cb class=\"key\">해결책\u003c/b>을 떠올린 뒤 이웃을 마을 회의에 초대하자는 제안에 동의했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Students who feel sorry for the poor turtles form a campaign group and brainstorm solutions together, finally suggesting a town meeting.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이 학년 시사 김 선생님 교과서 본문 두 번째 지문을 함께 읽어 볼 거예요. 이 글은 한 학생이 반 친구들에게 가엾은 바다거북 이야기를 전하고, 친구들과 함께 캠페인 모임을 만들어 해결책을 찾아가는 과정을 담고 있어요. 요지는 바다거북을 안쓰럽게 여긴 학생들이 캠페인 모임을 만들고 함께 해결책을 떠올린다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">바다거북(sea turtle)은 플라스틱 쓰레기와 어업 활동 때문에 개체 수가 빠르게 줄고 있는 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기 \u003c/b>\u003cb class=\"key\">동물\u003c/b>(endangered species)이에요. 이렇게 어떤 생물이 사라질 위기에 놓이면 사람들은 보전을 위한 \u003cb class=\"key\">보전 \u003c/b>\u003cb class=\"key\">활동\u003c/b>(conservation)을 시작하는데, 그 출발점은 대개 문제를 많은 사람에게 알리는 것이에요. \u003cb class=\"key\">캠페인\u003c/b>(campaign)은 서명 운동, 모금, 마을 회의(town meeting)처럼 사람들의 관심과 참여를 모으는 활동을 말하죠. 이는 마치 반 전체가 청소 구역을 정할 때 먼저 문제를 공유하고 모두의 의견을 모으는 것과 비슷해요. 이 지문의 학생들도 거창한 계획보다 먼저 \u003cb class=\"key\">브레인스토밍\u003c/b>(brainstorming)으로 가능한 방법을 쏟아 내고 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 바다거북은 영어로 sea turtle이라고 하는데, 플라스틱 쓰레기와 어업 활동 때문에 개체 수가 빠르게 줄고 있는 멸종 위기 동물이에요. 이렇게 어떤 생물이 사라질 위기에 놓이면 사람들은 보전 활동, 즉 conservation을 시작하죠. 그 출발점은 대개 문제를 많은 사람에게 알리는 거예요. 캠페인, campaign은 서명 운동이나 모금, 마을 회의처럼 사람들의 관심과 참여를 모으는 활동을 말해요. 이건 마치 반 전체가 청소 구역을 정할 때 먼저 문제를 공유하고 모두의 의견을 모으는 것과 비슷하죠. 이 지문의 학생들도 거창한 계획보다 먼저 브레인스토밍, brainstorming으로 가능한 방법을 쏟아 내고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>거북이 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째 문장에서 나는 다음 주 월요일에 학교에서 반 친구들에게 \u003cb class=\"key\">가엾은 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들의 이야기를 들려줬다. 이어서 두 번째 문장에서 반 친구들이 모두 바다거북을 \u003cb class=\"key\">안쓰럽게\u003c/b> 느꼈다는 반응이 나온다. 즉 이 단계는 문제를 알리고 공감을 만드는 출발점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>캠페인 결성\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장에서 우리는 바다거북 구하기 \u003cb class=\"key\">캠페인 \u003c/b>\u003cb class=\"key\">모임\u003c/b>을 만들었다. 마음속 안타까움에 머물지 않고 실제 행동을 시작한 장면이다. 이 문장이 뒤에 이어질 활동의 토대가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결책 탐색\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>네 번째 문장에서 우리 모임은 무엇을 해야 할지 \u003cb class=\"key\">확신\u003c/b>이 없어서 함께 \u003cb class=\"key\">해결책\u003c/b>을 떠올려 보았다. 다섯 번째 문장에서 나는 사람들이 이 \u003cb class=\"key\">문제\u003c/b>를 알아야 한다고 말했다. 방향은 세웠지만 아직 구체적인 방법은 정하지 못한 상태이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>제안과 동의\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>여섯 번째 문장에서 Samson이 이웃들을 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>에 초대하는 게 어떻겠냐고 \u003cb class=\"key\">제안\u003c/b>했다. 마지막 문장에서 Rebecca가 좋은 생각이라며 \u003cb class=\"key\">동의\u003c/b>했다. 이렇게 구체적인 해결 아이디어와 그에 대한 동의로 글이 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 첫 번째 문장에서 나는 다음 주 월요일에 학교에서 반 친구들에게 가엾은 바다거북 이야기를 들려줬어요. 그리고 두 번째 문장에서 반 친구들은 모두 바다거북을 안쓰럽게 느꼈죠. 이야기를 듣는 것만으로도 공감이 생긴 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 모임이 만들어져요. 세 번째 문장에서 우리는 바다거북 구하기 캠페인 모임을 만들었죠. 마음속에 있던 안타까움이 실제 행동으로 넘어가는 순간이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 해결책을 찾는 과정이에요. 네 번째 문장에서 우리 모임은 무엇을 해야 할지 확신이 없어서 함께 해결책을 떠올려 보았어요. 다섯 번째 문장에서 나는 사람들이 이 문제를 알아야 한다고 말했죠. 방향은 정했지만 아직 구체적인 방법은 없는 상태예요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 구체적인 제안이 나와요. 여섯 번째 문장에서 Samson이 이웃들을 마을 회의에 초대하는 게 어떻겠냐고 제안했어요. 그리고 일곱 번째 문장에서 Rebecca가 좋은 생각이라며 동의했죠. 이렇게 글은 제안과 동의로 마무리돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1~3번에서 바다거북이 처한 \u003cb class=\"key\">문제\u003c/b>과 그에 대한 공감, 모임 결성을 차례로 제시한다. 4번에서 무엇을 해야 할지 \u003cb class=\"key\">확신\u003c/b>이 없어 함께 해결책을 떠올렸다고 밝히며 중심 내용이 등장하고, 5~7번에서 구체적인 \u003cb class=\"key\">해결책\u003c/b>이 이어진다. 핵심이 되는 해결 방향이 글의 뒷부분에 몰려 있으므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Next Monday (1)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>so (4)\u003c/b>\u003cspan>원인-결과\u003c/span>\u003cb>Why don't we (6)\u003c/b>\u003cspan>제안 표현\u003c/span>\u003cb>suggested (6)\u003c/b>\u003cspan>제안\u003c/span>\u003cb>agreed (7)\u003c/b>\u003cspan>동의\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the poor turtles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the problem\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">solutions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a town meeting\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결이에요. 바다거북이 처한 문제와 그에 대한 공감이 앞부분에 나오고, 그 문제를 풀 해결책이 뒷부분에 몰려 있어서 미괄식이라고 볼 수 있죠. 글의 중심이 되는 문장은 무엇을 해야 할지 확신이 없어 함께 해결책을 떠올렸다는 네 번째 문장이에요.","hl":"ty"},{"n":9,"text":"신호어도 꼭 짚어 볼게요. 첫 번째 문장의 Next Monday는 사건이 시간 순서대로 흘러간다는 신호예요. 그리고 네 번째 문장의 so는 확신이 없었기 때문에 해결책을 떠올렸다는 원인과 결과를 이어 주는 접속사죠. 여섯 번째 문장의 Why don't we는 제안하는 표현이고, 일곱 번째 문장의 agreed는 제안에 동의한다는 신호예요. 또 the poor turtles가 them과 the problem으로 바뀌면서 같은 대상을 가리키고 있다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>class\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반, 학급\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가엾은, 불쌍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>turtle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거북, 바다거북\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel sorry for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 안쓰럽게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>campaign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠페인, 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모임, 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>be certain about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 확신하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>what to do\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무엇을 해야 할지\u003c/span>\u003c/div>\u003cdiv>\u003cb>brainstorm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>브레인스토밍하다, 아이디어를 짜내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해결책\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>should\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>know about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>invite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>초대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>town\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을, 읍\u003c/span>\u003c/div>\u003cdiv>\u003cb>meeting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회의\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 아이디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>Next Monday\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다음 주 월요일\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. feel sorry for는 안쓰럽게 여기다, be certain about은 확신하다는 뜻이에요. brainstorm은 함께 해결책을 떠올리다, solution은 해결책이라는 뜻이고요. suggest는 제안하다, agree는 동의하다로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">가엾은, 불쌍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pitiful\u003c/span>\u003cspan class=\"s\">unfortunate\u003c/span>\u003cspan class=\"s\">miserable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lucky\u003c/span>\u003cspan class=\"a\">fortunate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">certain\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sure\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"s\">convinced\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsure\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003cspan class=\"a\">uncertain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"s\">advise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">approve\u003c/span>\u003cspan class=\"s\">concur\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">problem\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">issue\u003c/span>\u003cspan class=\"s\">trouble\u003c/span>\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">solution\u003c/span>\u003cspan class=\"a\">answer\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">invite\u003c/b>\u003cspan class=\"m\">초대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask\u003c/span>\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"s\">call\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. poor는 가엾은이라는 뜻으로 pitiful, unfortunate와 비슷하고 lucky, fortunate와 반대돼요. certain은 확신하는이라는 뜻으로 sure, confident와 가깝고 unsure, doubtful와 반대죠. suggest는 propose, recommend와 비슷하고 oppose와 반대돼요. agree는 consent, approve와 가깝고 disagree, oppose와 반대라는 점도 함께 기억해 주세요. problem은 issue, trouble과 비슷하고 solution, answer와 반대라는 것도 챙겨 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 주 월요일에 학교에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Next \u003c/span>\u003cspan class=\"tgt\">Monday \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 반 친구들에게 말했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">class \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가엾은 바다거북들에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003cspan class=\"tgt\">turtles\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 주 월요일에 학교에서 저는 가엾은 바다거북들의 이야기를 반 친구들에게 들려줬어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 반 친구들에게 가엾은 바다거북들에 대해 이야기했다는 뜻이에요. told 뒤에 \u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">친구들\u003c/b>이, about 뒤에 화제인 \u003cb class=\"key\">바다거북들\u003c/b>이 와서 누구에게 무엇을 알려 줬는지 또렷하게 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간·장소 부사구의 문두 배치\u003c/span> : [시간 부사구 Next Monday] + [장소 부사구 at school] + 주어 + 동사 : \"다음 주 월요일에 학교에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">tell + 목적어 + about 전치사구 (tell A about B)\u003c/span> : tell + [목적어 A] + about + [명사 B] : \"반 친구들에게 가엾은 바다거북들에 대해 말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">the + 형용사 + 명사 (정관사의 특정 지칭)\u003c/span> : [the] + [형용사 poor] + [명사 turtles] : \"가엾은 바다거북들\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Next Monday at school, 다음 주 월요일에 학교에서. I told the class, 저는 반 친구들에게 말했어요. about the poor turtles, 가엾은 바다거북들에 대해. 이 문장 전체를 해석하면, 다음 주 월요일에 학교에서 저는 가엾은 바다거북들의 이야기를 반 친구들에게 들려줬어요.","hl":"m"},{"n":13,"text":"이 문장은 화자가 반 친구들에게 가엾은 바다거북들에 대한 이야기를 전했다는 뜻이에요. told the class about the poor turtles에서 about이 있어야 「그 바다거북들에 대해」라는 전치사구가 완성되고, 시간과 장소를 먼저 말해서 언제 어디서 있었던 일인지 알려 주죠.","hl":"mn"},{"n":14,"text":"먼저 맨 앞의 Next Monday at school을 보세요. 시간과 장소를 나타내는 말을 문장 앞에 놓아서 배경을 먼저 깔아 주는 거예요. 그다음 told the class about the poor turtles에서 tell은 목적어 뒤에 about을 붙여 무엇에 대해 말하는지 알려 주는 구조라서, 이 about이 있어야 전치사구가 완성돼요. 마지막으로 the poor turtles에서 the는 이미 알려진 특정 바다거북들을 가리키는 정관사이고, poor가 그 바다거북들을 꾸며 주는 형용사라는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 반 친구들은\u003c/span>\u003cspan class=\"en\">My classmates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 안쓰럽게 느꼈어요\u003c/span>\u003cspan class=\"en\">all \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">sorry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">친구들은 모두 바다거북들을 안쓰럽게 느꼈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 모두 바다거북들을 안쓰럽게 여겼다는 뜻이에요. feel은 \u003cb class=\"key\">감각동사\u003c/b>라서 뒤에 \u003cb class=\"key\">형용사\u003c/b>가 와서 주어의 상태를 설명하고, 감정의 대상은 for them으로 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 형용사 보어 (2형식)\u003c/span> : feel + [형용사 sorry] (+ for + 대상) : \"그들을 안쓰럽게 느꼈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 목적격 (감정의 대상)\u003c/span> : for + [목적격 them] : \"그들에 대해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"My classmates, 내 반 친구들은. all felt sorry, 모두 안쓰럽게 느꼈어요. for them, 그들을. 이 문장 전체를 해석하면, 친구들은 모두 바다거북들을 안쓰럽게 느꼈어요.","hl":"m"},{"n":16,"text":"친구들이 모두 바다거북들을 안쓰럽게 여겼다는 뜻이에요. feel은 감각동사라서 뒤에 형용사가 와서 주어의 상태를 설명하고, 안쓰러움의 대상은 for them으로 이어 준다는 점이 핵심이에요.","hl":"mn"},{"n":17,"text":"felt sorry for them을 뜯어 볼게요. feel은 감각동사라서 뒤에 형용사 보어가 와서 주어가 어떤 상태인지 말해 줘요. 그래서 sorry라는 형용사가 그대로 오는 거예요. 그리고 전치사 뒤에는 목적격이 와야 하니까 they가 them으로 바뀐 것이고, feel sorry for는 「안쓰럽게 여기다」라는 관용 표현으로 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 만들었어요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘바다거북 구하기 캠페인’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">&quot;Save \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Turtle \u003c/span>\u003cspan class=\"tgt\">Campaign&quot; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모임을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">group\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 ‘바다거북 구하기 캠페인’ 모임을 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 바다거북을 구하는 캠페인 모임을 만들었다는 뜻이에요. 여기서 make는 「만들다」라는 \u003cb class=\"key\">일반동사\u003c/b>로 \u003cb class=\"key\">목적어\u003c/b> 하나만 필요로 하고, \u003cb class=\"key\">사역동사\u003c/b>로 쓰이는 make와는 쓰임이 달라요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">make의 3형식 (만들다) — 사역동사 make와 구별\u003c/span> : make + [목적어 a &quot;Save the Turtle Campaign&quot; group] : \"‘바다거북 구하기 캠페인’ 모임을 만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수식어구가 명사 group을 앞에서 꾸미는 구조\u003c/span> : [수식어구 a &quot;Save the Turtle Campaign&quot;] + [핵심 명사 group] : \"‘바다거북 구하기 캠페인’ 모임\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We made, 우리는 만들었어요. a \"Save the Turtle Campaign\", ‘바다거북 구하기 캠페인’. group, 모임을. 이 문장 전체를 해석하면, 우리는 ‘바다거북 구하기 캠페인’ 모임을 만들었어요.","hl":"m"},{"n":19,"text":"우리가 바다거북을 구하는 캠페인 모임을 만들었다는 뜻이에요. 여기서 make는 「만들다」라는 일반동사라서 목적어 하나만 필요로 하고, 목적어 뒤에 동사원형을 데려오는 사역동사와는 쓰임이 다르다는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":20,"text":"made a Save the Turtle Campaign group을 보세요. 여기서 make는 「만들다」라는 뜻의 일반동사라서 목적어 하나만 있으면 문장이 완성돼요. 만약 사역동사로 쓰이면 목적어 뒤에 동사원형이 오는 목적격 보어가 필요하죠. 그런데 이 문장에는 그런 동사원형이 없으니 일반동사로 본 거예요. 그리고 a Save the Turtle Campaign group에서 핵심 명사는 group이고, 앞의 따옴표 부분이 어떤 모임인지 수식해 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모임은\u003c/span>\u003cspan class=\"en\">Our group\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확신이 없었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 해야 할지에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 우리는 해결책을 떠올려 보았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">brainstormed \u003c/span>\u003cspan class=\"tgt\">solutions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 모임은 무엇을 해야 할지 확신이 없어서, 함께 해결책을 떠올려 보았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 모임이 뚜렷한 계획 없이 출발했음을 보여 주면서, 함께 머리를 맞대고 \u003cb class=\"key\">해결책\u003c/b>을 찾아 가는 흐름을 이어 줍니다. be not certain about은 '~에 대해 \u003cb class=\"key\">확신\u003c/b>이 없다'라는 뜻이고, brainstorm은 떠오르는 대로 아이디어를 쏟아 내는 \u003cb class=\"key\">브레인스토밍\u003c/b>을 말해요. 그래서 캠페인의 방법이 구체적으로 만들어지는 출발점이 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사 + 전치사 (상태 표현)\u003c/span> : 주어 + be not + [certain (형용사)] + about + [명사구] : \"~에 대해 확신이 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (명사구)\u003c/span> : 전치사 about + [what + to do] : \"무엇을 해야 할지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 so (원인과 결과)\u003c/span> : [원인 문장], so + [결과 문장] : \"그래서 우리는 해결책을 떠올려 보았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Our group, 우리 모임은. was not certain, 확신이 없었어요. about what to do, 무엇을 해야 할지에 대해. so we brainstormed solutions, 그래서 우리는 해결책을 떠올려 보았어요. 이 문장 전체를 해석하면, 우리 모임은 무엇을 해야 할지 확신이 없어서, 함께 해결책을 떠올려 보았어요.","hl":"m"},{"n":22,"text":"이 문장은 우리 모임이 무엇을 해야 할지 확신이 없는 상태에서 출발했다는 걸 보여 줘요. 그래서 함께 머리를 맞대고 해결책을 떠올리는 브레인스토밍을 했다는 거죠. 바로 이 부분이 캠페인 활동이 구체적으로 만들어지는 출발점이에요.","hl":"mn"},{"n":23,"text":"어법 포인트, 첫 번째는 be not certain about이에요. certain은 확신하는이라는 형용사라서 be동사 뒤에 놓여 주어의 상태를 나타내고, 무엇에 대해 확신하는지는 전치사 about 뒤에 붙여 줍니다. 두 번째는 what to do인데요, 의문사 what과 to부정사가 만나서 하나의 명사구가 되고, 여기서는 전치사 about의 목적어 역할을 해요. 세 번째는 so인데, 앞 문장의 원인을 받아서 뒤 문장의 결과를 이어 주는 등위접속사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이\u003c/span>\u003cspan class=\"en\">&quot;People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아야 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">know \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 문제에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 저는 말했어요\u003c/span>\u003cspan class=\"en\">I said.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 “사람들이 이 문제를 알아야 해.”라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 캠페인에서 가장 먼저 세운 목표가 사람들에게 \u003cb class=\"key\">문제\u003c/b>를 알리는 것임을 보여 줍니다. should가 '~해야 한다'는 \u003cb class=\"key\">당위\u003c/b>로 쓰여서, 화자가 이 일이 꼭 필요하다고 생각한다는 점이 드러나요. 그리고 이 발언이 바로 다음 문장의 \u003cb class=\"key\">제안\u003c/b>으로 이어지는 흐름의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should의 당위적 용법\u003c/span> : 주어 + [should + 동사원형] : \"알아야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">know + 전치사 about (대상에 관한 정보)\u003c/span> : know + about + [대상] : \"그 문제에 대해 알다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"People, 사람들이. should know, 알아야 해요. about the problem,\", 이 문제에 대해. I said, 라고 저는 말했어요. 이 문장 전체를 해석하면, 저는 “사람들이 이 문제를 알아야 해.”라고 말했어요.","hl":"m"},{"n":25,"text":"이 문장은 캠페인의 첫 목표가 사람들에게 문제를 알리는 것이라는 걸 보여 줘요. should가 여기서는 꼭 해야 한다는 당위의 뜻으로 쓰여서, 화자가 이 일이 정말 필요하다고 생각한다는 게 드러나죠. 그리고 이 말이 바로 다음 문장의 제안으로 이어지는 출발점이 된답니다.","hl":"mn"},{"n":26,"text":"어법 포인트, 첫 번째는 should know예요. should는 조동사라서 뒤에 항상 동사원형이 오고, 여기서는 꼭 해야 한다는 당위의 뜻을 나타내죠. 두 번째는 know about the problem인데요, know에 전치사 about을 붙이면 그 대상에 관한 정보를 알고 있다는 뜻이 돼요. 그래서 여기서는 문제의 존재와 내용을 사람들이 알게 해야 한다는 의미가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Samson이 제안했어요\u003c/span>\u003cspan class=\"en\">Samson suggested,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이웃들을 초대하는 게 어때요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">invite \u003c/span>\u003cspan class=\"tgt\">neighbors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을 회의에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">town \u003c/span>\u003cspan class=\"tgt\">meeting\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Samson이 “이웃들을 마을 회의에 초대하는 게 어때?”라고 제안했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Samson이 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>를 열자고 제안하면서 캠페인의 구체적인 행동이 정해지는 장면이에요. Why don't we ~?는 '우리 ~하는 게 어때?'라는 \u003cb class=\"key\">제안\u003c/b> 표현이라서, 앞 문장의 '사람들이 알아야 해'라는 문제의식을 실제 \u003cb class=\"key\">해결책\u003c/b>으로 옮겨 줍니다. 그래서 다음 문장에서 Rebecca가 동의하는 흐름으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현 Why don't we + 동사원형?\u003c/span> : Why don't we + [동사원형] ~? : \"우리가 ~하는 게 어때?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">invite + 목적어 + to + 장소\u003c/span> : invite + [목적어(사람)] + to + [장소/행사] : \"이웃들을 마을 회의에 초대하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Samson suggested, Samson이 제안했어요. \"Why don't we invite neighbors, 이웃들을 초대하는 게 어때요. to a town meeting?\", 마을 회의에. 이 문장 전체를 해석하면, Samson이 “이웃들을 마을 회의에 초대하는 게 어때?”라고 제안했어요.","hl":"m"},{"n":28,"text":"Samson이 마을 회의를 열자고 제안하면서 캠페인의 구체적인 행동이 정해지는 장면이에요. Why don't we는 우리가 이렇게 하는 게 어때라고 제안하는 표현이라서, 앞에서 나온 문제의식을 실제 해결책으로 옮겨 주죠. 그래서 다음 문장에서 Rebecca가 좋은 생각이라며 동의하는 흐름으로 이어져요.","hl":"mn"},{"n":29,"text":"어법 포인트, 첫 번째는 Why don't we invite예요. 이 표현은 부정 의문문 모양이지만 상대에게 제안하고 권유할 때 쓰는 표현이고, 뒤에는 항상 동사원형이 와요. 두 번째는 invite neighbors to a town meeting인데요, invite는 목적어로 사람을 먼저 두고, 전치사 to 뒤에 장소나 행사를 붙여서 어디로 초대하는지를 나타내요. 그래서 to 뒤에는 동사원형이 아니라 명사구가 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Rebecca가\u003c/span>\u003cspan class=\"en\">Rebecca\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의했어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agreed,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“그건\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">&quot;That's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 생각이야!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">idea!&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Rebecca가 “좋은 생각이야!”라고 동의했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Rebecca가 Samson의 제안에 \u003cb class=\"key\">동의\u003c/b>하며 분위기를 북돋아 주는 문장이에요. 바로 앞에서 Samson이 마을 회의를 제안했고, Rebecca가 “좋은 생각이야!”라고 말해 그 \u003cb class=\"key\">제안\u003c/b>이 받아들여지는 흐름을 만들어요. That's는 That is의 \u003cb class=\"key\">축약형\u003c/b>으로, “그건 좋은 생각이야!”라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거시제(규칙 변화)\u003c/span> : agree + -d → agreed / reporting clause + , : \"동의했어요,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접화법(인용문)과 That's 축약형\u003c/span> : 주어 + 동사 + , + &quot;인용문&quot; / That + is → That's : \"“좋은 생각이야!”\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Rebecca, Rebecca가. agreed, 동의했어요. \"That's, “그건. a good idea!\", 좋은 생각이야!”. 이 문장 전체를 해석하면, Rebecca가 “좋은 생각이야!”라고 동의했어요.","hl":"m"},{"n":31,"text":"이 문장은 Rebecca가 Samson의 제안에 동의하는 장면이에요. 바로 앞에서 Samson이 마을 회의를 제안했죠. Rebecca가 좋은 생각이야라고 말하면서 그 제안이 받아들여지는 흐름을 만들어요. 또 That's는 That is의 축약형이라서 그건 좋은 생각이야라는 뜻이 돼요.","hl":"mn"},{"n":32,"text":"어법 포인트를 짚어 볼게요. 첫 번째, agreed는 규칙 동사 agree에 과거형이 붙은 과거시제예요. 그래서 동의했어요라고 해석해요. 두 번째, 따옴표 안에 말을 그대로 넣은 직접화법이에요. 그리고 That's는 That is의 축약형이라서 그건이라고 해석해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>다음 주 월요일 학교에서 나는 반 친구들에게 \u003cb class=\"key\">가엾은 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들의 이야기를 들려줬다.\u003c/li>\u003cli>친구들은 모두 바다거북을 \u003cb class=\"key\">안쓰럽게\u003c/b> 느꼈고, 우리는 ‘바다거북 구하기 캠페인’ \u003cb class=\"key\">모임\u003c/b>을 만들었다.\u003c/li>\u003cli>우리 모임은 무엇을 해야 할지 \u003cb class=\"key\">확신\u003c/b>이 없어서 함께 \u003cb class=\"key\">해결책\u003c/b>을 떠올려 보았다.\u003c/li>\u003cli>나는 사람들이 문제를 알아야 한다고 말했고, Samson이 이웃을 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>에 초대하자고 제안하자 Rebecca가 동의했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Students who feel sorry for the poor turtles form a campaign group and brainstorm solutions together, finally suggesting a town meeting.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 한 학생이 반 친구들에게 \u003cb class=\"key\">가엾은 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들의 이야기를 전하자 모두 안쓰럽게 느꼈고, 우리는 \u003cb class=\"key\">캠페인 \u003c/b>\u003cb class=\"key\">모임\u003c/b>을 만들어 무엇을 해야 할지 \u003cb class=\"key\">확신\u003c/b>이 없어 함께 \u003cb class=\"key\">해결책\u003c/b>을 떠올린 뒤 이웃을 마을 회의에 초대하자는 제안에 동의했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"정리해 볼게요. 학생들은 가엾은 바다거북을 안쓰럽게 여기며 캠페인 모임을 만들었고, 무엇을 해야 할지 확신이 없어서 함께 해결책을 떠올렸어요. 그래서 사람들이 문제를 알아야 한다는 의견, 이웃을 마을 회의에 초대하자는 제안, 그리고 그에 대한 동의로 글이 마무리되죠. 오늘 배운 문제와 해결의 흐름과 suggest, agree 같은 핵심 단어를 꼭 챙겨 가세요. 오늘 수업 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
