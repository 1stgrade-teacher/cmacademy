</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 7과 본문4","audioDir":"4_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>7과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>A Magical Night with Baby Turtles\u003c/h1>\u003ch2>아기 거북들과 함께한 마법 같은 밤\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>학생들은 자원봉사자들과 함께 바다거북을 보호하기 위해 해변을 순찰하며 달빛 아래서 바다로 향하는 아기 거북들을 지켜보았다. 핵심어 \u003cb class=\"key\">바다거북\u003c/b>, \u003cb class=\"key\">해변 \u003c/b>\u003cb class=\"key\">순찰\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Students participated in a turtle patrol and watched baby turtles safely head to the sea under the moonlight.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 중학교 영어 교과서 본문 가운데 바다거북 보호 활동을 다룬 내용을 함께 살펴볼게요. 이번 시간의 요약은 자원봉사자들과 함께 해변을 순찰하며 바다로 향하는 아기 거북들을 지켜본 이야기예요. 요지는 학생들이 거북 순찰에 참여하여 아기 거북들이 안전하게 바다로 가는 모습을 관찰했다는 내용이랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">바다거북은 부화한 후 인공 불빛을 피해 바다로 찾아가야 생존할 수 있는 본능 \u003cb class=\"key\">instinct\u003c/b>을 가지고 있습니다. 해변의 밝은 가로등이나 상업 시설의 조명은 아기 거북들이 바다 \u003cb class=\"key\">sea\u003c/b>가 아닌 육지로 잘못 향하게 만들어 \u003cb class=\"key\">habitat \u003c/b>\u003cb class=\"key\">destruction\u003c/b> 위기에 처하게 합니다. 마치 깜깜한 밤에 우리가 스마트폰 화면만 보고 길을 잃는 것처럼, 인공 불빛은 야간 생태계에 큰 혼란을 줍니다. 따라서 \u003cb class=\"key\">turtle \u003c/b>\u003cb class=\"key\">patrol\u003c/b>과 같은 자원봉사 활동을 통해 해변의 불빛을 \u003cb class=\"key\">light \u003c/b>\u003cb class=\"key\">pollution\u003c/b>으로부터 줄여주는 노력이 반드시 필요합니다.\u003c/div>","segs":[{"n":2,"text":"배경지식으로 바다거북의 생태를 잠깐 짚어볼게요. 아기 거북들은 부화한 후에 인공 불빛을 피해 바다로 찾아가야 생존할 수 있는 본능을 가지고 있어요. 하지만 해변의 밝은 가로등이나 조명은 거북들이 바다가 아닌 육지로 잘못 향하게 만들어 위험에 빠지게 하죠. 마치 우리가 어두운 밤에 스마트폰 화면만 보다가 길을 잃는 것처럼 인공 불빛은 생태계에 큰 혼란을 준답니다. 그래서 거북 순찰 같은 자원봉사 활동을 통해 불빛을 줄여주는 노력이 꼭 필요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>순찰 시작\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>필자는 반 친구들과 자원봉사자들과 함께 \u003cb class=\"key\">바다거북\u003c/b>을 위한 순찰에 나섰다고 말합니다. 이 활동은 보호 \u003cb class=\"key\">protection\u003c/b> 활동의 시작을 알리는 도입부입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>불빛 소등\u003csmall>전개 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>해변가의 불빛이 하나씩 꺼지자 모두가 미소를 짓고 \u003cb class=\"key\">은처럼 \u003c/b>\u003cb class=\"key\">밝은\u003c/b> 달빛이 비쳤습니다. 인공 불빛이 사라진 환경이 조성되는 과정입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거북의 이동과 마무리\u003csmall>결론 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>곧 작은 바다거북들이 둥지에서 기어 나와 모래 위를 지나 바다로 사라졌습니다. 필자 \u003cb class=\"key\">우리\u003c/b>는 경이감 속에서 달빛을 따라 집으로 돌아가며 활동을 마칩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글이 어떤 순서로 전개되는지 단계별로 알아볼게요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서는 필자가 반 친구들과 자원봉사자들과 함께 바다거북을 위한 순찰에 나섰다고 말하며 보호 활동의 시작을 알리는 도입 역할을 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 두 번째와 세 번째 문장에서는 해변가의 불빛이 하나씩 꺼지고 은처럼 밝은 달빛이 비치며 자연스러운 환경이 만들어지는 전개 과정을 보여 줘요.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계인 네 번째부터 여섯 번째 문장까지는 작은 거북들이 둥지에서 나와 바다로 사라지고 우리도 경이감 속에서 달빛을 따라 집으로 돌아가는 결론을 맺고 있어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 바다거북 순찰 \u003cb class=\"key\">turtle \u003c/b>\u003cb class=\"key\">patrol\u003c/b>에 참여하여 아기 거북들이 바다로 가는 과정을 시간 \u003cb class=\"key\">time\u003c/b>의 흐름에 따라 순서대로 서술하고 있습니다. 첫 부분의 준비부터 불빛이 꺼지고 거북들이 이동한 뒤 마지막에 집으로 돌아오는 흐름을 가집니다. 따라서 마지막 문장에서 자연스럽게 전체 활동의 \u003cb class=\"key\">경이로운 \u003c/b>\u003cb class=\"key\">감정\u003c/b>과 마무리 \u003cb class=\"key\">conclusion\u003c/b>를 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Soon (4)\u003c/b>\u003cspan>시간 흐름\u003c/span>\u003cb>Then (5)\u003c/b>\u003cspan>순차 진행\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">turtle patrol\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lights along the beach went out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tiny turtles crawled out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">moved slowly over the sand and disappeared into the sea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">followed the moon home\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이번 글은 시간의 흐름에 따라 사건이 차례대로 전개되는 구조로 되어 있어요. 첫 준비 과정부터 불빛이 꺼지고 거북이 이동하는 과정을 거쳐 마지막 귀가까지 시간순으로 짜여 있답니다. 글의 중심 내용이 마지막 문장에 자연스럽게 어우러지는 미괄식 형태의 특징을 보여 주죠.","hl":"ty"},{"n":8,"text":"문장 사이를 이어주는 연결고리도 잘 살펴봐야 해요. 네 번째 문장의 Soon 이나 다섯 번째 문장의 Then 같은 시간 표현들이 사건의 순서를 자연스럽게 이어주는 중요한 신호어 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>go on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하러 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>patrol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>volunteer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원봉사자\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>along\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>beach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해변\u003c/span>\u003c/div>\u003cdiv>\u003cb>go out\u003c/b>\u003cem>숙어 b>just like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼, 마치 ~와 같이\u003c/span>\u003c/div>\u003cdiv>\u003cb>home\u003c/b>\u003cem>부사\u003c/em>\u003cspan>집으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"주요 단어들을 몇 개 짚어볼게요. patrol 은 순찰 이라는 뜻이고 volunteer 는 자원봉사자 라는 의미예요. 그리고 disappear 는 사라지다 라는 동사인데 반대말인 appear 도 함께 알아두면 좋겠죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">bright\u003c/b>\u003cspan class=\"m\">밝은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shining\u003c/span>\u003cspan class=\"s\">light\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dark\u003c/span>\u003cspan class=\"a\">dim\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tiny\u003c/b>\u003cspan class=\"m\">아주 작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">small\u003c/span>\u003cspan class=\"s\">little\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">big\u003c/span>\u003cspan class=\"a\">huge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slowly\u003c/b>\u003cspan class=\"m\">천천히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gradually\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quickly\u003c/span>\u003cspan class=\"a\">fast\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappear\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">silent\u003c/b>\u003cspan class=\"m\">조용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"s\">noiseless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noisy\u003c/span>\u003cspan class=\"a\">loud\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 핵심 어휘들을 동의어와 반의어와 함께 정리해 볼게요. bright 의 동의어는 shining 이고 반의어는 dark 가 있어요. tiny 의 동의어는 small 이고 반의어는 big 이에요. slowly 의 반의어는 quickly 이고 disappear 의 반의어는 appear 라는 점도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바다거북을 위한 순찰에 나섰어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">turtle \u003c/span>\u003cspan class=\"tgt\">patrol\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반 친구들과 자원봉사자들과 함께\u003c/span>\u003cspan class=\"en\">with my classmates and volunteers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 반 친구들과 자원봉사자들과 함께 바다거북을 위한 순찰에 나섰어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 \u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">친구들\u003c/b> 및 자원봉사자들과 함께 \u003cb class=\"key\">바다거북 \u003c/b>\u003cb class=\"key\">순찰\u003c/b> 활동에 참여하게 된 첫 번째 상황을 소개하는 도입 문장입니다. 앞으로 일어날 흥미진진한 생태 체험을 기대하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사 및 숙어 표현\u003c/span> : [go] + [on] + [명사구] : \"~에 나서다, ~를 하러 가다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"I went on a turtle patrol, 저는 바다거북을 위한 순찰에 나섰어요. with my classmates and volunteers, 반 친구들과 자원봉사자들과 함께. 이 문장 전체를 해석하면, 저는 반 친구들과 자원봉사자들과 함께 바다거북을 위한 순찰에 나섰어요.","hl":"m"},{"n":12,"text":"이 문장은 글쓴이가 친구들, 자원봉사자들과 함께 바다거북 순찰에 나선 상황을 설명하는 도입부예요. 앞으로 밤 해변에서 어떤 일이 벌어질지 호기심을 불러일으키죠.","hl":"mn"},{"n":13,"text":"첫 번째 문장에서 살펴볼 어법은 went on a turtle patrol이에요. go on은 어떤 활동을 하러 간다는 뜻의 숙어 표현으로, 뒤에 명사와 함께 쓰여서 순찰에 나섰다는 의미를 완성해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 미소를 지었어요\u003c/span>\u003cspan class=\"en\">Everyone smiled\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해변가의 불빛이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> the lights along the beach\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나씩 꺼지자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> one by one.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해변가의 불빛이 하나씩 꺼지자 모두 미소를 지었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이들이 안심하고 해변으로 올라올 수 있도록 \u003cb class=\"key\">해변가의 \u003c/b>\u003cb class=\"key\">불빛\u003c/b>이 하나씩 꺼지는 상황을 묘사합니다. 사람들이 거북이를 보호하기 위해 협동하며 \u003cb class=\"key\">미소\u003c/b> 짓는 따뜻한 분위기를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사\u003c/span> : [because] + [주어] + [동사] : \"~ 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어동사 go out의 과거형\u003c/span> : [go out] (꺼지다) 의 과거형 [went out] : \"꺼졌다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Everyone smiled, 모두 미소를 지었어요. because the lights along the beach, 해변가의 불빛이. went out one by one, 하나씩 꺼지자. 이 문장 전체를 해석하면, 해변가의 불빛이 하나씩 꺼지자 모두 미소를 지었어요.","hl":"m"},{"n":15,"text":"이 문장은 거북이를 보호하기 위해 해변의 불빛들이 차례대로 꺼지고 사람들이 미소 짓는 평화로운 순간을 담고 있어요. 모두가 같은 목적을 가지고 참여하고 있음을 알 수 있죠.","hl":"mn"},{"n":16,"text":"두 번째 문장의 핵심 어법은 because와 went out이에요. because는 이유를 나타내는 접속사라서 뒤에 주어와 동사가 오고요, went out은 불빛 등이 꺼진다는 의미를 가진 동사구의 과거형이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛나는 달은\u003c/span>\u003cspan class=\"en\">The \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shining\u003c/span> moon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝았어요\u003c/span>\u003cspan class=\"en\">was bright\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">silver\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빛나는 달은 은처럼 밝았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밤 해변의 분위기를 \u003cb class=\"key\">은빛\u003c/b>에 비유하여 시각적으로 아름답게 묘사하고 있습니다. \u003cb class=\"key\">빛나는 \u003c/b>\u003cb class=\"key\">달\u003c/b>의 밝은 빛이 앞으로 전개될 거북이와의 만남을 더욱 신비롭게 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 한정적 수식\u003c/span> : [shining (현재분사)] + [moon (명사)] : \"빛나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like를 이용한 비유\u003c/span> : [like] + [명사 (silver)] : \"은처럼\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The shining moon, 빛나는 달은. was bright, 밝았어요. like silver, 은처럼. 이 문장 전체를 해석하면, 빛나는 달은 은처럼 밝았어요.","hl":"m"},{"n":18,"text":"이 문장은 밤 해변을 비추는 달의 모습을 은에 비유해서 아름답고 신비로운 분위기를 극대화하고 있어요. 거북이를 관찰하기 좋은 환한 밤의 정경을 잘 보여 주죠.","hl":"mn"},{"n":19,"text":"세 번째 문장에서는 shining과 like silver를 기억해야 해요. shining은 현재분사로 쓰여서 달을 꾸며주고 있고, like는 ~처럼이라는 뜻으로 달의 밝기를 비유할 때 쓰인 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧,\u003c/span>\u003cspan class=\"en\">Soon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 바다거북들이\u003c/span>\u003cspan class=\"en\">tiny turtles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에서 기어 나왔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">crawled\u003c/span> out of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둥지\u003c/span>\u003cspan class=\"en\">the nests.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧, 작은 바다거북들이 둥지에서 기어 나왔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이 알이 부화하여 새끼 거북들이 모래 둥지 밖으로 나오는 극적인 순간을 묘사하고 있어요. \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">거북\u003c/b>들의 탄생과 \u003cb class=\"key\">바다로의 \u003c/b>\u003cb class=\"key\">여정\u003c/b>이 시작되는 중요한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제 동사\u003c/span> : 주어 + 과거동사 ~ : \"기어 나왔다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Soon, 곧. tiny turtles, 작은 바다거북들이. crawled out of, ~에서 기어 나왔어요. the nests, 둥지. 이 문장 전체를 해석하면, 곧, 작은 바다거북들이 둥지에서 기어 나왔어요.","hl":"m"},{"n":21,"text":"이번 문장은 알에서 부화한 작은 거북들이 드디어 둥지 밖으로 기어 나오는 순간을 보여주고 있어요. 거북이들의 본격적인 여정이 시작되는 아주 흥미로운 장면이죠.","hl":"mn"},{"n":22,"text":"어법 포인트는 동사의 형태예요. 과거에 일어난 일을 말하고 있으니까 동사 crawl에 ed를 붙여서 과거 시제로 썼다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">the turtles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히 움직이며\u003c/span>\u003cspan class=\"en\">moved slowly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모래 위에서\u003c/span>\u003cspan class=\"en\">over the sand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다로 사라졌어요\u003c/span>\u003cspan class=\"en\">disappeared into the sea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후 그들은 모래 위에서 천천히 움직이며 바다로 사라졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이들이 둥지를 나와 모래사장을 지나 밤바다 속으로 들어가는 모습을 순서대로 보여주고 있어요. 두 개의 동작이 \u003cb class=\"key\">등위접속사 \u003c/b>\u003cb class=\"key\">and\u003c/b>로 자연스럽게 이어져 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사구 병렬구조\u003c/span> : 주어 + 과거동사1 (~), and 과거동사2 (~) : \"움직였고 그리고 사라졌다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Then, 그 후. the turtles, 그들은. moved slowly, 천천히 움직이며. over the sand, 모래 위에서. and, 그리고. disappeared into the sea, 바다로 사라졌어요. 이 문장 전체를 해석하면, 그 후 그들은 모래 위에서 천천히 움직이며 바다로 사라졌어요.","hl":"m"},{"n":24,"text":"거북이들이 모래사장을 지나 마침내 바다 속으로 완전히 사라지는 모습을 담고 있어요. 거북이들이 자연의 품으로 돌아가는 감동적인 순간이죠.","hl":"mn"},{"n":25,"text":"이번 문장에서 가장 중요한 어법은 병렬구조예요. 거북이가 움직인 것과 바다로 사라진 것 두 가지 행동을 연결해야 하니까 and 앞의 moved와 뒤의 disappeared 모두 과거형 동사로 맞춰 주어야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~한 채로 있었다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">remained \u003c/span>\u003cspan class=\"tgt\">silent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경이감으로 할 말을 잊은 채\u003c/span>\u003cspan class=\"en\">with wonder\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달빛을 따라 집으로 돌아갔어요\u003c/span>\u003cspan class=\"en\">followed the moon home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다거북들처럼\u003c/span>\u003cspan class=\"en\">just like the turtles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 경이감으로 할 말을 잊은 채 바다거북들처럼 달빛을 따라 집으로 돌아갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이들의 신비로운 귀환을 지켜본 후 자원봉사자들과 학생들이 느낀 깊은 감동을 표현하고 있어요. 거북이가 \u003cb class=\"key\">달빛\u003c/b>을 따라 바다로 간 것처럼 우리도 달빛을 따라 집으로 돌아간다는 비유적 표현이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불완전자동사 + 형용사 보어\u003c/span> : 주어 + remain (상태 유지 동사) + 형용사보어 : \"침묵을 유지했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">전치사구(~처럼)\u003c/span> : just like + 명사(구) : \"바다거북들처럼 정확히\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"We remained silent, 우리는 ~한 채로 있었다. with wonder, 경이감으로 할 말을 잊은 채. and, 그리고. followed the moon home, 달빛을 따라 집으로 돌아갔어요. just like the turtles, 바다거북들처럼. 이 문장 전체를 해석하면, 우리는 경이감으로 할 말을 잊은 채 바다거북들처럼 달빛을 따라 집으로 돌아갔어요.","hl":"m"},{"n":27,"text":"거북이들의 여정을 지켜보면서 학생들과 자원봉사자들이 느낀 벅찬 감동을 잘 보여주고 있어요. 거북이들이 달빛을 보고 바다로 찾아간 것처럼 사람들도 그 달빛을 의지해 집으로 향하는 아름다운 마무리에요.","hl":"mn"},{"n":28,"text":"첫 번째 어법 포인트는 remain 뒤에 형용사 보어가 온다는 점이에요. 상태를 나타내는 동사 뒤에는 부사가 아니라 형용사 silent가 와야 한다는 것을 기억하세요. 두 번째로는 just like라는 표현인데요, 거북이들과 똑같이 행동했다는 점을 강조하려고 like 앞에 just를 붙여서 바다거북들처럼이라고 정확하게 빗대어 표현하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>필자는 친구들과 함께 바다거북 순찰 \u003cb class=\"key\">turtle \u003c/b>\u003cb class=\"key\">patrol\u003c/b>에 참여했다.\u003c/li>\u003cli>해변의 불빛 \u003cb class=\"key\">beach \u003c/b>\u003cb class=\"key\">lights\u003c/b>이 꺼지고 은빛 달빛이 밝게 비쳤다.\u003c/li>\u003cli>작은 거북들이 둥지에서 나와 바다로 \u003cb class=\"key\">sea\u003c/b> 사라졌다.\u003c/li>\u003cli>우리는 경이로움을 느끼며 달빛을 따라 \u003cb class=\"key\">follow \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">moon\u003c/b> 집으로 돌아왔다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Students participated in a turtle patrol and watched baby turtles safely head to the sea under the moonlight.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">학생들은 자원봉사자들과 함께 바다거북을 보호하기 위해 해변을 순찰하며 달빛 아래서 바다로 향하는 아기 거북들을 지켜보았다. 핵심어 \u003cb class=\"key\">바다거북\u003c/b>, \u003cb class=\"key\">해변 \u003c/b>\u003cb class=\"key\">순찰\u003c/b>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"오늘 우리는 바다거북 순찰 이야기를 통해 자연을 보호하는 아름다운 순간을 함께 만나보았어요. 시간 흐름에 따른 내용 전개와 핵심 단어들을 꼼꼼하게 복습하면서 이번 지문을 완벽하게 내 것으로 만들어 보기를 바랄게요. 수고하셨어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
