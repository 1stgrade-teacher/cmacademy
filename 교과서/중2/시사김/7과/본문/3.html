</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 7과 본문3","audioDir":"3_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>A Community Effort to Save Baby Turtles\u003c/h1>\u003ch2>아기 거북을 구하기 위한 지역 사회의 노력\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 주민들은 각자 맡은 일을 분담해 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>를 준비했고, 회의에서 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>을 구하기 위한 \u003cb class=\"key\">불 \u003c/b>\u003cb class=\"key\">끄기 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>과 해변 순찰에 동의했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Community members worked together to prepare for a town meeting and decided to save baby turtles by turning off lights and patrolling the beach.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간은 중학교 영어 지문을 함께 분석해 보는 시간이에요. 모임을 위해 사람들이 각자 맡은 일을 하고 마을 회의를 통해 거북이를 구하는 이야기를 다루고 있죠. 글 전체의 요약과 요지를 탄탄하게 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시)\u003c/div>","segs":[{"n":2,"text":"배경지식으로 해양 생물 보호와 생태계에 대해 알아볼게요. 야생 동물들은 인간이 만든 인공 불빛에 큰 영향을 받아요. 예를 들어 밤에 켜진 밝은 전등은 해변의 거북이들에게 혼란을 주죠. 이번 지문은 이런 문제를 주민들이 함께 해결하는 멋진 사례를 보여 줘요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>회의 준비\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>모임에 속한 모든 사람들이 회의를 준비하면서 \u003cb class=\"key\">각자 \u003c/b>\u003cb class=\"key\">맡은 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 해냈습니다. Rebecca와 Samson, Max 그리고 글쓴이는 포스터 제작과 \u003cb class=\"key\">인터넷 \u003c/b>\u003cb class=\"key\">홍보\u003c/b>, 신문 기고 등 다양한 방식으로 \u003cb class=\"key\">회의 \u003c/b>\u003cb class=\"key\">준비\u003c/b>를 완수했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>회의 개최와 원인 파악\u003csmall>전개 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>회의가 열린 날 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회관\u003c/b>은 이웃들로 가득 찼고, 사람들은 거북이가 길을 잃는 이유를 알게 되었습니다. \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들이 집에서 나오는 \u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">불빛\u003c/b> 때문에 방향을 잃는다는 사실을 우리 그룹이 설명했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결 방안 실천\u003csmall>결론 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>주민들은 거북이를 구하는 방법에 대해 서로 \u003cb class=\"key\">의견을 \u003c/b>\u003cb class=\"key\">나누었\u003c/b>습니다. 밤에 \u003cb class=\"key\">불 \u003c/b>\u003cb class=\"key\">끄기 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>을 시작하고 해변을 순찰하며 둥지를 지키기로 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">동의\u003c/b>했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 주민들이 회의를 준비하는 단계부터 해결책을 실천하는 단계까지 자연스럽게 이어져요.","hl":null},{"n":4,"text":"첫 번째 단계는 회의 준비 과정이에요. 그룹 멤버들이 각자 맡은 일을 해내며 포스터 제작과 홍보를 분담했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 회의 개최와 원인 파악이에요. 마을 회관에 모인 주민들에게 아기 거북들이 밝은 불빛 때문에 길을 잃는다는 점을 설명했죠.","hl":"f1"},{"n":6,"text":"마지막 단계는 해결 방안의 실천이에요. 주민들이 불 끄기 캠페인과 해변 순찰에 자발적으로 동의하며 뜻을 모았어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 주민들이 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>를 준비하는 협력적인 모습으로 시작하여, \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>이 길을 잃는 원인을 파악하고 이를 해결하기 위한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 도출하는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결\u003c/b> 구조로 전개됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On the meeting day (5)\u003c/b>\u003cspan>시간 배경 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">did their part\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">made posters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">put them up\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spread the word\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wrote about\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">explained\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">talked about\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">volunteered\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">agreed to\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"글의 전개 방식을 살펴볼까요. 이 글은 첫 문장부터 주된 내용을 보여 주는 두괄식 구조를 띠고 있어요. 주민들이 겪은 문제에 대해 원인을 분석하고 해결 방안을 찾아가는 문제 해결 구조로 짜여 있답니다.","hl":"ty"},{"n":8,"text":"문장 속 연결고리도 놓치지 말아야 해요. 회의 당일이라는 시점을 나타내는 표현이 등장하며 이야기의 국면이 자연스럽게 전환되죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무리, 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할, 부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meeting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회의, 모임\u003c/span>\u003c/div>\u003cdiv>\u003cb>poster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포스터\u003c/  class=\"ko\">밤에 불 끄기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">lights \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">night\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 밤에 불 끄기 캠페인을 시작하자고 자원했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이들을 구하기 위해 많은 주민들이 자발적으로 \u003cb class=\"key\">밤에 \u003c/b>\u003cb class=\"key\">불 \u003c/b>\u003cb class=\"key\">끄기 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>에 참여하겠다고 나선 상황입니다. to부정사의 \u003cb class=\"key\">형용사적 \u003c/b>\u003cb class=\"key\">용법\u003c/b>이 campaign을 꾸며주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 (동명사)\u003c/span> : 전치사(for) + 동명사 [동사원형 start에 -ing] : \"시작하는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(a campaign) + [to부정사(to turn off...)] : \"밤에 불 끄기\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Many, 많은 사람들이. volunteered, 자원했어요. for starting, 시작하는 것을. a campaign, 캠페인을. to turn off lights at night, 밤에 불 끄기. 이 문장 전체를 해석하면, 많은 사람들이 밤에 불 끄기 캠페인을 시작하자고 자원했어요.","hl":"m"},{"n":33,"text":"거북이들을 구하기 위해 많은 주민들이 자발적으로 밤에 불 끄기 캠페인에 참여하겠다고 나선 상황이에요. to부정사가 campaign을 꾸며주면서 구체적인 내용을 설명하고 있답니다.","hl":"mn"},{"n":34,"text":"첫 번째 어법 포인트는 전치사 뒤에 오는 동명사예요. 전치사 for 뒤에는 반드시 명사가 와야 해서 동사 start에 ing를 붙인 동명사 starting이 쓰였어요. 두 번째 어법 포인트는 to부정사의 형용사적 용법이에요. to turn off lights at night이 앞의 a campaign을 꾸며주어서 어떤 캠페인인지 자세히 설명해 주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이웃들은\u003c/span>\u003cspan class=\"en\">Others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agreed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순찰하며\u003c/span>\u003cspan class=\"en\">to patrol\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해변을\u003c/span>\u003cspan class=\"en\">the beach\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께\u003c/span>\u003cspan class=\"en\">together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지키자는 데\u003c/span>\u003cspan class=\"en\">and protect\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둥지를\u003c/span>\u003cspan class=\"en\">the nests.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 이웃들은 함께 해변을 순찰하며 둥지를 지키자는 데 동의했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불 끄기 캠페인 외에도 또 다른 주민들은 직접 해변을 돌며 거북이의 둥지를 \u003cb class=\"key\">보호하기로 \u003c/b>\u003cb class=\"key\">결정\u003c/b>한 모습을 보여줍니다. to부정사 병렬구조인 \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">patrol \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">protect\u003c/b>가 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적어로 to부정사를 취하는 동사\u003c/span> : 주어(Others) + 동사(agreed) + [to부정사구(목적어)] : \"동의했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">to부정사의 병렬구조\u003c/span> : to + [동사원형 patrol] + and + [동사원형 protect] : \"순찰하며 ... 지키자는 데\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Others, 다른 이웃들은. agreed, 동의했어요. to patrol, 순찰하며. the beach, 해변을. together, 함께. and protect, 지키자는 데. the nests, 둥지를. 이 문장 전체를 해석하면, 다른 이웃들은 함께 해변을 순찰하며 둥지를 지키자는 데 동의했어요.","hl":"m"},{"n":36,"text":"불 끄기 캠페인 외에도 또 다른 주민들은 직접 해변을 돌며 거북이의 둥지를 보호하기로 결정한 모습을 보여주고 있어요. 서로 역할을 나누어 아기 바다거북을 돕는 따뜻한 모습이 드러나죠.","hl":"mn"},{"n":37,"text":"첫 번째 어법 포인트는 목적어로 to부정사를 취하는 agree예요. agree는 뒤에 동명사가 아니라 반드시 to부정사를 목적어로 가져와야 해요. 두 번째 어법 포인트는 to부정사의 병렬구조예요. and를 사이에 두고 to patrol과 protect가 연결되어 있는데, 앞에 있는 to의 영향으로 protect 앞에도 to가 생략된 채 동사원형만 쓰였다는 것을 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>그룹 멤버들이 각자 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">분담\u003c/b>을 하여 회의 준비를 마쳤다.\u003c/li>\u003cli>\u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b> 당일 많은 이웃들이 회의장에 모였다.\u003c/li>\u003cli>아기 거북들이 \u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">불빛\u003c/b> 때문에 길을 잃는다는 점을 설명했다.\u003c/li>\u003cli>주민들이 밤에 \u003cb class=\"key\">불 \u003c/b>\u003cb class=\"key\">끄기 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>과 해변 순찰에 동의했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Community members worked together to prepare for a town meeting and decided to save baby turtles by turning off lights and patrolling the beach.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 주민들은 각자 맡은 일을 분담해 \u003cb class=\"key\">마을 \u003c/b>\u003cb class=\"key\">회의\u003c/b>를 준비했고, 회의에서 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>을 구하기 위한 \u003cb class=\"key\">불 \u003c/b>\u003cb class=\"key\">끄기 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>과 해변 순찰에 동의했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"오늘 배운 내용을 깔끔하게 마무리해 볼게요. 주민들이 협력하여 거북이를 구하는 과정이 아주 감동적인 지문이었어요. 복습을 철저히 하고 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
