<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 시사(김) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 7과 본문1","audioDir":"1_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Saving Baby Turtles from Bright Lights\u003c/h1>\u003ch2>밝은 불빛으로부터 아기 바다거북 구하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>주인공 비비안은 해변 근처로 이사한 후, 밝은 불빛 때문에 길을 잃고 위험에 처한 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들을 발견하고 돕고 싶어 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Vivian wants to help baby turtles that are confused and lost because of bright lights from beach houses.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간엔 Follow the Moon Home이라는 책의 내용을 바탕으로 한 본문을 함께 공부해 볼게요. 주인공 비비안이 해변에서 아기 바다거북을 만나 겪게 되는 이야기예요. 글 전체의 요약과 요지를 함께 살펴보죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자연에서 갓 태어난 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들은 본능적으로 밤하늘의 달빛과 별빛이 바다 수면에 반사되는 \u003cb class=\"key\">자연광(natural \u003c/b>\u003cb class=\"key\">light)\u003c/b>을 따라 바다로 향합니다. 하지만 현대 도시화로 인해 해변가 건물에서 나오는 강력한 \u003cb class=\"key\">인공조명(artificial \u003c/b>\u003cb class=\"key\">light)\u003c/b>이 바다 쪽 빛보다 더 밝게 빛나면서 거북이들의 방향 감각을 흐리게 만듭니다. 이는 마치 어두운 밤길에서 자동차의 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">헤드라이트(high \u003c/b>\u003cb class=\"key\">beam)\u003c/b> 불빛을 정면으로 받아 눈이 멀어 방향을 잃는 상황과 비슷합니다. 결국 바다를 찾아가지 못한 거북이들은 탈수나 포식자에게 노출되어 생명을 잃는 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">위기(critical \u003c/b>\u003cb class=\"key\">danger)\u003c/b>에 처하게 됩니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 알아볼까요. 자연에서 아기 바다거북은 밤하늘의 달빛과 별빛 같은 자연광을 따라 바다로 향해요. 하지만 해변가의 밝은 인공조명이 더 밝게 빛나면 거북이들은 방향을 잃게 되죠. 마치 우리가 어두운 밤에 강한 헤드라이트 불빛을 보며 눈이 멀어 방향을 잃는 것과 같아요. 결국 바다를 찾지 못한 거북이들은 위험에 처하게 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>책 소개와 배경\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째와 두 번째 문장에서는 \u003cb class=\"key\">논픽션 \u003c/b>\u003cb class=\"key\">책\u003c/b> Follow the Moon Home을 소개하며, 아기 거북을 돕는 아이들의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 바탕으로 책이 쓰였음을 알려 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>주인공의 등장\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>세 번째부터 다섯 번째 문장까지는 주인공 비비안이 바닷가 근처 마을로 이사한 뒤, 엄마와 함께 어느 토요일 밤 해변을 \u003cb class=\"key\">산책한 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 들려줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거북이들의 위기\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>여섯 번째부터 여덟 번째 문장에서는 모래 속 둥지에서 기어 나오는 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들을 발견하고, 그들이 길을 잃고 \u003cb class=\"key\">혼란스러워하는 \u003c/b>\u003cb class=\"key\">모습\u003c/b>을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>원인과 결과\u003csmall>근거 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>아홉 번째부터 열한 번째 문장에서는 엄마의 설명을 통해 거북이들이 달빛 대신 \u003cb class=\"key\">해변가 \u003c/b>\u003cb class=\"key\">집들의 \u003c/b>\u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">불빛\u003c/b> 때문에 잘못된 길로 가며, 결국 \u003cb class=\"key\">죽게 \u003c/b>\u003cb class=\"key\">된다\u003c/b>는 사실을 알려 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>도움의 마음\u003csmall>결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>마지막 열두 번째와 열세 번째 문장에서는 슬픔을 느낀 비비안이 \u003cb class=\"key\">바다거북들을 \u003c/b>\u003cb class=\"key\">돕고 \u003c/b>\u003cb class=\"key\">싶어 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 드러내며 이야기가 마무리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글이 어떤 순서로 전개되는지 전체 흐름을 짚어 드릴게요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 논픽션 책을 소개하며 아기 거북을 돕는 아이들의 실제 이야기를 바탕으로 한다는 배경을 알려 줘요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째부터 다섯 번째 문장에서는 주인공 비비안이 바닷가 마을로 이사한 뒤 어느 토요일 밤에 해변을 산책한 경험을 들려주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째부터 여덟 번째 문장에서는 모래 속 둥지에서 기어 나오는 아기 바다거북들을 발견하고 그들이 혼란스러워하는 모습을 보여 줘요.","hl":"f2"},{"n":7,"text":"네 번째 단계인 아홉 번째부터 열한 번째 문장에서는 엄마의 설명을 통해 거북이들이 달빛 대신 해변가 집들의 밝은 불빛 때문에 잘못된 길로 가며 죽게 된다는 사실을 전해 줘요.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계인 열두 번째와 열세 번째 문장에서는 슬픔을 느낀 비비안이 바다거북들을 돕고 싶어 하는 마음을 드러내며 이야기가 마무리돼요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 아기 바다거북을 돕기 위한 캠페인이라는 전체 배경을 먼저 제시한 뒤, 주인공 비비안이 해변에서 길을 잃은 거북이들을 마주하고 \u003cb class=\"key\">안타까운 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 겪는 과정을 순서대로 보여 줍니다. \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황의 \u003c/b>\u003cb class=\"key\">발견\u003c/b>부터 원인 설명, 그리고 주인공의 다짐으로 이어지는 \u003cb class=\"key\">시간순 \u003c/b>\u003cb class=\"key\">전개 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (8)\u003c/b>\u003cspan>앞서 나아가는 거북이들의 행동과 혼란스러운 상태를 대조하는 역접 신호\u003c/span>\u003cb>because of (10)\u003c/b>\u003cspan>거북이들이 잘못된 길로 가는 원인을 밝히는 전치사구\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Follow the Moon Home\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a non-fiction book\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class= , 저 귀여운 아기 바다거북들이. trying to find their way to the sea?, 바다로 가는 길을 찾고 있는 거예요?. 이 문장 전체를 해석하면, 저는 엄마에게 물었어요. “저 귀여운 아기 바다거북들이 바다로 가는 길을 찾고 있는 거예요?","hl":"m"},{"n":31,"text":"주인공 비비안이 해변에서 만난 아기 바다거북들의 행동에 대해 의문을 품고 엄마에게 질문하는 장면이에요. 현재진행형을 사용해 거북이들이 지금 막 바다를 찾아가는 중임을 생생하게 보여주고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 are와 함께 쓰인 trying이에요. be동사 뒤에 ing 형태를 붙여서 거북이들이 지금 무언가를 하고 있는 중임을 나타내는 현재진행형을 만들고 있죠. 두 번째 어법은 try 뒤에 나온 to find예요. try 동사의 목적어 자리에서 길을 찾는 것을 애쓴다는 의미를 완성해 주는 to부정사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데\u003c/span>\u003cspan class=\"en\">But they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seem\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼란스러워하고 길을 잃은 것 같아 보여요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">confused\u003c/span> and lost.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 혼란스러워하고 길을 잃은 것 같아 보여요.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거북이들이 보통과 다르게 방향을 잡지 못하고 우왕좌왕하는 모습을 비비안이 걱정스러운 눈으로 관찰하며 말하고 있어요. \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">분사\u003c/b>를 사용하여 거북이들이 처한 혼란스러운 상태를 잘 드러내고 있답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 연결동사\u003c/span> : seem [연결동사] + [confused and lost (형용사 보어)] : \"~처럼 보이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 (감정 분사)\u003c/span> : seem + [confused (과거분사 보어)] : \"혼란스러운\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But they seem, 그런데. confused and lost.\", 혼란스러워하고 길을 잃은 것 같아 보여요.. 이 문장 전체를 해석하면, 그런데 혼란스러워하고 길을 잃은 것 같아 보여요.\"","hl":"m"},{"n":34,"text":"거 른다는 목적을 밝히고 있답니다.","hl":"mn"},{"n":38,"text":"이번 문장의 핵심 어법은 문장 끝에 있는 to go예요. 앞의 행동을 하는 이유를 설명하면서 ~하기 위하여라고 해석되는 to부정사의 부사적 용법 중 목적을 나타내고 있죠. 바다로 가기 위해서 달빛을 따른다는 의미를 자연스럽게 만들어 주는 중요한 요소예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 해변가 집들의 밝은 불빛 때문에\u003c/span>\u003cspan class=\"en\">But they are going the wrong way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길을 잘못 가고 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> the bright lights from the beach houses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 해변가 집들의 밝은 불빛 때문에 길을 잘못 가고 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 바다거북들이 달빛 대신 인공 불빛을 따라가면서 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잘못 \u003c/b>\u003cb class=\"key\">들게 \u003c/b>\u003cb class=\"key\">된 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여주는 문장이에요. 이 문장은 자연스러운 본능이 인간이 만든 \u003cb class=\"key\">인공적인 \u003c/b>\u003cb class=\"key\">불빛\u003c/b> 때문에 방해받고 있음을 강조하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : because of + [명사(구)] : \"~ 때문에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"But they are going the wrong way, 그런데 해변가 집들의 밝은 불빛 때문에. because of the bright lights from the beach houses, 길을 잘못 가고 있어. 이 문장 전체를 해석하면, 그런데 해변가 집들의 밝은 불빛 때문에 길을 잘못 가고 있어.","hl":"m"},{"n":40,"text":"아기 바다거북들이 달빛 대신 인공 불빛을 따라가면서 길을 잘못 들게 된 상황을 보여주는 문장이에요. 이 문장은 자연스러운 본능이 인간이 만든 인공적인 불빛 때문에 방해받고 있음을 강조하고 있어요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 because of예요. because는 뒤에 주어와 동사가 오지만, because of는 뒤에 명사구가 와요. 여기서는 뒤에 the bright lights라는 명사구가 왔으므로 because of를 써야 한다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다로 가는 길을 찾지 못하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> their way to the sea,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽게 되지\u003c/span>\u003cspan class=\"en\">they die.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바다로 가는 길을 찾지 못하면 죽게 되지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불빛 때문에 방향을 잃은 거북이들이 처한 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 경고하는 문장이에요. 이 문장은 인공 조명이 아기 바다거북들의 생명까지 위협하는 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">문제\u003c/b>임을 잘 보여주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : When + [주어] + [동사] : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When they cannot find their way to the sea, 바다로 가는 길을 찾지 못하면. they die, 죽게 되지. 이 문장 전체를 해석하면, 바다로 가는 길을 찾지 못하면 죽게 되지.","hl":"m"},{"n":43,"text":"불빛 때문에 방향을 잃은 거북이들이 처한 위험한 상황을 경고하는 문장이에요. 이 문장은 인공 조명이 아기 바다거북들의 생명까지 위협하는 심각한 문제임을 잘 보여주고 있어요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 When이에요. When은 '~할 때'라는 의미를 나타내는 접속사로 뒤에 주어와 동사를 이끌어 문장을 연결해 줘요. 여기서 시간이나 조건을 나타내는 부사절에서는 미래 대신 현재시제를 쓴다는 문법 규칙도 함께 떠올려 보면 좋겠죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 너무 슬펐어요.\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt\u003c/span> so sad.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 너무 슬펐어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위험에 처한 아기 바다거북들의 이야기를 듣고 화자가 느낀 \u003cb class=\"key\">슬픈 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 솔직하게 표현한 문장이에요. 이 감정은 뒤에서 거북이들을 돕기로 결심하는 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">계기\u003c/b>가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 표현 동사(불규칙 과거)\u003c/span> : [주어] + felt [형용사] : \"느꼈다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"I felt so sad, 저는 너무 슬펐어요.. 이 문장 전체를 해석하면, 저는 너무 슬펐어요.","hl":"m"},{"n":46,"text":"위험에 처한 아기 바다거북들의 이야기를 듣고 화자가 느낀 슬픈 감정을 솔직하게 표현한 문장이에요. 이 감정은 뒤에서 거북이들을 돕기로 결심하는 중요한 계기가 돼요.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 felt예요. feel의 과거형인 felt를 사용해서 과거의 감정을 표현하고 있죠. 감정 상태를 나타내기 위해서 뒤에 형용사 보어인 sad가 온다는 것도 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 원했다\u003c/span>\u003cspan class=\"en\">I wanted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돕는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다거북들을\u003c/span>\u003cspan class=\"en\">the turtles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 바다거북들을 돕고 싶었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공인 \u003cb class=\"key\">Vivian\u003c/b>이 앞서 알게 된 바다거북들의 안타까운 상황에 깊이 공감하고, 직접 행동으로 나서고자 하는 의지를 보여주는 문장이에요. 이 글 전체의 주제인 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북 \u003c/b>\u003cb class=\"key\">돕기\u003c/b> 캠페인과 행동의 시작점이 되는 중요한 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want [타동사] + [to부정사 (명사적 용법 / 목적어)] : \"돕는 것을\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"I wanted, 나는 원했다. to help, 돕는 것을. the turtles, 바다거북들을. 이 문장 전체를 해석하면, 저는 바다거북들을 돕고 싶었어요.","hl":"m"},{"n":49,"text":"이번 문장은 주인공인 Vivian이 앞서 알게 된 바다거북들의 안타까운 상황에 깊이 공감하고, 직접 행동으로 나서고자 하는 마음을 표현한 문장이에요. 이 글의 주제인 아기 바다거북 돕기 캠페인과 행동의 시작점이 되는 아주 중요한 역할을 하죠.","hl":"mn"},{"n":50,"text":"어법 포인트 살펴볼게요. 여기서는 want 동사 뒤에 쓰인 to help를 꼭 기억해야 해요. want는 목적어로 to부정사를 취하는 동사라서, 동사 want 뒤에서 ~하는 것을 이라는 목적어 역할을 깔끔하게 해내고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 일치/불일치\u003c/span>\u003cspan class=\"lp-pill\">정답 아기 바다거북은 해변가 집들의 밝은 불빛 때문에 길을 잃고 죽을 위기에 처한다.\u003c/span>\u003cdiv style=\"margin-top:8px\">지문에서 아기 바다거북은 달빛을 따라 바다로 가야 하지만, 해변가 집들의 밝은 불빛 때문에 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">길\u003c/b>로 가고 결국 길을 찾지 못하면 \u003cb class=\"key\">죽게 \u003c/b>\u003cb class=\"key\">된다\u003c/b>고 엄마가 설명하고 있습니다. 따라서 밝은 불빛이 거북이들에게 위험한 원인이 된다는 내용이 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">본문 \u003c/b>\u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>아기 바다거북은 해변가의 밝은 불빛을 따라 바다로 안전하게 찾아간다.\u003c/li>\u003cli>비비안은 낮에 엄마와 함께 해변을 산책하다가 거북이를 발견했다.\u003c/li>\u003cli>아기 바다거북들은 달빛을 피해 해변가 집 안으로 기어 들어간다.\u003c/li>\u003cli>비비안은 거북이들을 보고도 아무런 감정을 느끼지 못했다.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":51,"text":"이번 지문과 관련된 문제를 풀어 볼까요. 정답은 아기 바다거북은 해변가 집들의 밝은 불빛 때문에 길을 잃고 죽을 위기에 처한다 예요. 엄마의 설명에 따르면 거북이들은 인공 불빛 때문에 방향을 잃고 위험해진다고 했으므로 이 내용이 정확한 정답의 근거가 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>비비안은 바닷가 근처 마을로 이사한 후 엄마와 해변을 산책했다.\u003c/li>\u003cli>해변 모래 속 둥지에서 아기 바다거북들이 기어 나오고 있었다.\u003c/li>\u003cli>거북이들은 달빛 대신 해변가 집들의 밝은 불빛 때문에 길을 잃고 있었다.\u003c/li>\u003cli>비비안은 길을 잃은 거북이들이 죽을 수도 있다는 사실을 알고 돕고 싶어 했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Vivian wants to help baby turtles that are confused and lost because of bright lights from beach houses.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">주인공 비비안은 해변 근처로 이사한 후, 밝은 불빛 때문에 길을 잃고 위험에 처한 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">바다거북\u003c/b>들을 발견하고 돕고 싶어 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 배운 내용을 잘 복습하고, 아기 바다거북을 돕고 싶어 하는 비비안의 마음을 기억해 주세요. 모두 수고하셨어요.","hl":null}]}]});</script></body></html>
