F+vJqI7iGyeoOMADHr2/LnP07OJUjAxnHTIOTUcjqiHB+ZV3ErzjksD2wTgewGGOMYL/wCGf4enf+mJNvSz1as9NtOz8+mn3M//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Life in Zero Gravity: A Lunar Field Trip<small>무중력에서의 삶: 달 현장 학습</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 먼저 알아두면 좋을 개념은 바로 무중력(Zero gravity) 상태예요. 보통 우리가 지구에 있을 때는 중력이라는 힘이 아래로 잡아당기고 있어서 발을 딛고 서 있을 수 있지만, 우주 공간처럼 중력이 거의 느껴지지 않는 곳에서는 물체를 붙잡아줄 힘이 없어서 둥둥 떠다니게 되는 것이죠. 마치 수영장에 몸을 띄웠을 때처럼, 우주에서는 위와 아래의 구분이 사라져서 천장에 거꾸로 매달려 있는 것도 전혀 이상하지 않답니다. 이처럼 우주선 안에서 마치 마법처럼 몸이 떠오르는 현상은 지구의 중력으로부터 벗어나 자유낙하 상태가 되기 때문에 발생하는 자연스러운 원리예요. 이 배경지식을 떠올리며 글을 읽어보시면, 주인공들이 우주선 안에서 경험하는 신기하고 자유로운 상황을 훨씬 더 생생하게 이해하실 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01우주 여행의 시작</div><ul><li>호현이의 학교는 달로 현장학습을 떠나게 되었다.</li><li>달로 떠나는 현장학습(field trip to the Moon)</li><li>우주선이 우주에 도달함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02무중력 상태의 경험</div><ul><li>우주선 내부에서 학생들이 무중력을 경험하며 몸이 둥둥 떠다니기 시작했다.</li><li>무중력(zero gravity) 상태에서의 부유</li><li>호현이 유찬을 밀자 유찬이 기내를 떠다님</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신기한 우주선 풍경</div><ul><li>학생들은 공간의 경계 없이 벽이나 천장에 자유롭게 위치했다.</li><li>천장에 거꾸로 서 있는 규진(stood upside down on the ceiling)</li><li>벽에 서 있는 시현</li><li>위와 아래의 구분이 없음(no up or down)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04무중력의 편안함</div><ul><li>학생들은 방향성에 구애받지 않는 독특한 우주 공간에 적응하며 편안함을 느꼈다.</li><li>우주 공간에서의 안락함(comfortable)</li><li>공간적 제약이 사라진 자유로운 환경</li><li>핵심 키워드: 무중력(zero gravity)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go on</td><td class=\"m\">~을 하러 가다, 시작하다</td></tr><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 견학</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">~에 도달하다, 도착하다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">zero gravity</td><td class=\"m\">무중력 상태</td></tr><tr><td class=\"w\">float</td><td class=\"m\">뜨다, 떠다니다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sail</td><td class=\"m\">나아가다, 활공하다</td></tr><tr><td class=\"w\">cabin</td><td class=\"m\">선실, 객실</td></tr><tr><td class=\"w\">upside down</td><td class=\"m\">거꾸로, 뒤집혀</td></tr><tr><td class=\"w\">ceiling</td><td class=\"m\">천장</td></tr><tr><td class=\"w\">comfortable</td><td class=\"m\">편안한, 안락한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2099년 10월 25일</span><span class=\"en\"><b><span class=\"grammar-hl\">October 25, 2099</span></b></span></div></div><div class=\"lec-sent-ko\">2099년 10월 25일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 배경이 되는 시점을 제시하며, 앞으로 펼쳐질 이야기가 미래의 어느 시점에 발생한 사건임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">October 25, 2099 (관용표현): 날짜와 연도를 나타내는 관용적인 표현으로, 전치사 없이 명사구만으로 특정 시점을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호현이의 학교는</span><span class=\"en\"><b>Hohyun’s school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체험 학습을 갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">went on a field trip</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달로</span><span class=\"en\"><b>to the Moon.</b></span></div></div><div class=\"lec-sent-ko\">호현이의 학교는 달로 체험 학습을 갔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 호현과 그 일행이 어떤 목적으로 어디로 이동 중인지를 알려주는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went on a field trip (관용표현): &#39;go on a ~&#39; 구문으로 &#39;~에 가다/참여하다&#39;라는 의미를 나타내며, 여기서 field trip은 전치사구의 목적어로 쓰인 명사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 견학</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선이 우주에 도달했을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the spaceship reached space</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두가 무중력 상태를 경험했다</span><span class=\"en\"><b>everyone experienced zero gravity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 떠다니기 시작했다</span><span class=\"en\"><b>and began <span class=\"grammar-hl\">to float</span>.</b></span></div></div><div class=\"lec-sent-ko\">우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 이동 상황을 이어받아, 우주 공간이라는 특수한 환경에 진입했을 때 학생들이 겪는 신체적 변화를 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the spaceship reached space (관계부사(시간)): when이 접속사로 쓰여 &#39;when + S + V&#39; 구조로 시간의 부사절을 이끌고 있습니다.</div><div class=\"lec-gr-item\">to float (to부정사): began의 목적어로 쓰인 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reach</td><td class=\"m\">~에 도달하다, 도착하다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">zero gravity</td><td class=\"m\">무중력 상태</td></tr><tr><td class=\"w\">float</td><td class=\"m\">뜨다, 떠다니다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호현이는 유찬이를 밀었다</span><span class=\"en\"><b>Hohyun pushed Yuchan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 손가락으로,</span><span class=\"en\"><b>with his finger,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유찬이는 날아갔다</span><span class=\"en\"><b>and Yuchan went <span class=\"grammar-hl\">sailing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선실을 가로질러</span><span class=\"en\"><b>through the cabin!</b></span></div></div><div class=\"lec-sent-ko\">호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무중력 상태가 가져온 변화를 보여주는 구체적인 사례입니다. 호현의 작은 힘만으로도 유찬의 몸이 공중에서 쉽게 이동하는 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sailing (현재분사): 문장의 보어 역할을 하며, 목적어인 Yuchan의 동작 상태를 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sail</td><td class=\"m\">나아가다, 활공하다</td></tr><tr><td class=\"w\">cabin</td><td class=\"m\">선실, 객실</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">규진이는 거꾸로 서 있었다</span><span class=\"en\"><b>Kyujin <span class=\"grammar-hl\">stood upside down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천장에</span><span class=\"en\"><b>on the ceiling.</b></span></div></div><div class=\"lec-sent-ko\">규진이는 천장에 거꾸로 섰습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에 이어 무중력 상황에서 인간이 중력의 법칙을 벗어나 자유롭게 위치를 잡을 수 있음을 보여주는 또 다른 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stood upside down (관용표현): &#39;stand upside down&#39;은 &#39;거꾸로 서 있다&#39;라는 뜻의 숙어로, 상태를 나타내는 동사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upside down</td><td class=\"m\">거꾸로, 뒤집혀</td></tr><tr><td class=\"w\">ceiling</td><td class=\"m\">천장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시현이는 서 있었다</span><span class=\"en\"><b>Sihyun <span class=\"grammar-hl\">was standing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽에</span><span class=\"en\"><b>on the wall.</b></span></div></div><div class=\"lec-sent-ko\">시현이는 벽에 서 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 마찬가지로, 천장이나 벽 등 위치와 상관없이 어디든 발을 딛고 설 수 있는 우주 공간의 독특한 환경을 나열합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was standing (현재진행): &#39;be동사(was) + 현재분사(standing)&#39; 구조로 과거의 특정 시점에 진행 중이었던 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가 편안함을 느꼈다</span><span class=\"en\"><b>Everyone felt comfortable</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위나 아래가 없기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because there is no up or down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서는</span><span class=\"en\"><b>in space.</b></span></div></div><div class=\"lec-sent-ko\">우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학생들이 거꾸로 서 있거나 벽에 붙어 있는 행동을 자연스럽게 받아들이는 이유를 밝히며, 무중력 공간의 근본적인 특징을 정리하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because there is no up or down (관계부사(장소/상태)): 여기서 there is 구문은 존재를 나타내며, 뒤에 이어진 up or down은 공간적 상태를 설명하는 명사 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">comfortable</td><td class=\"m\">편안한, 안락한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>2099년 미래, 호현이네 학교가 달로 현장학습을 떠난다.</li><li>우주선이 우주에 도달하자 학생들이 무중력 상태를 경험하며 공중에 떠오른다.</li><li>아이들은 천장이나 벽에 서는 등 지구에서는 불가능한 움직임을 보이며 즐거워한다.</li><li>우주에는 위와 아래라는 기준이 없기에 학생들은 이러한 상황을 편안하게 받아들인다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students on a school trip to the Moon experienced zero gravity, and they floated freely throughout the cabin as there was no orientation of up or down.</div>\n              <div class=\"lec-final-sum-ko\">달로 현장 학습을 떠난 학생들은 무중력 상태를 경험했으며, 위아래의 구분이 없어 기내를 자유롭게 떠다녔다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문1_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문1_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문1_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문1_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문1_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문1_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 시사김 6과 본문1_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 시사김 6과 본문1_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문1_강의_audio/9.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문1_강의_audio/10.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문1_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문1_강의_audio/12.mp3","hl":"main"},{"audio":"./중2 시
