</li><li>영상 통화(video call)를 통한 소통</li><li>핵심 키워드: 영상 통화(Video call)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03지구 관찰 및 기대감</div><ul><li>호현은 달에서 보는 지구의 모습에 감탄하며 내일의 일정을 고대한다.</li><li>달에서 본 지구(Earth)의 모습 묘사</li><li>더 크고 밝게 보이는 지구의 시각적 특징</li><li>내일 일정(tomorrow’s activities)에 대한 설렘</li><li>핵심 키워드: 지구(Earth), 기대감(Expectation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay</td><td class=\"m\">머무르다, 체류하다</td></tr><tr><td class=\"w\">go to bed</td><td class=\"m\">잠자리에 들다</td></tr><tr><td class=\"w\">video call</td><td class=\"m\">화상 통화</td></tr><tr><td class=\"w\">large</td><td class=\"m\">큰, 넓은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 빛나는</td></tr><tr><td class=\"w\">can&#39;t wait for</td><td class=\"m\">~을 매우 고대하다</td></tr><tr><td class=\"w\">activity</td><td class=\"m\">활동, 움직임</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두는</span><span class=\"en\"><b>Everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">머물렀다</span><span class=\"en\"><b><span class=\"grammar-hl\">stayed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에 있는 호텔에서</span><span class=\"en\"><b>at a hotel on the Moon.</b></span></div></div><div class=\"lec-sent-ko\">모두 달에 있는 호텔에서 묵었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도입부로서, 인류가 달에서 숙박할 수 있는 미래의 어느 시점에 이야기가 시작되고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed (일반동사): 문장의 서술어로서 주어 Everyone의 과거 상태를 나타내는 자동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay</td><td class=\"m\">머무르다, 체류하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호현이가 잠자리에 들기 전에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Before Hohyun went to bed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 영상 통화를 했다</span><span class=\"en\"><b>he had a video call</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구에 있는 그의 부모님과</span><span class=\"en\"><b>with his parents on the Earth.</b></span></div></div><div class=\"lec-sent-ko\">호현이는 잠자리에 들기 전에 지구에 있는 부모님과 영상 통화를 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 시간적 배경을 구체화하며, 주인공이 달에 머물고 있고 부모님은 지구에 있는 거리감을 기술하여 두 장소가 떨어져 있음을 강조합니다. 3. “The Earth looks larger and brighter than a full moon!” 호현이가 부모님께 현재 보고 있는 풍경을 전달하는 대사입니다. 달에서 지구를 바라보는 상황을 통해, 평소 우리가 보던 보름달과 비교하여 지구의 존재감을 드러내는 장면입니다. 4. “I can’t wait for tomorrow’s activities.” 호현이가 달에서의 일상을 매우 긍정적으로 느끼고 있음을 보여줍니다. 새로운 환경에 대한 설렘을 표현하며, 달 여행이 단순한 방문을 넘어 다양한 활동이 이루어지는 공간임을 암시하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Before Hohyun went to bed (부사절): 접속사 Before가 이끄는 시간의 부사절로, 주절의 동작(had)이 일어나기 전의 시점을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">video call</td><td class=\"m\">화상 통화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“지구는 보인다</span><span class=\"en\"><b>“The Earth looks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 크고 더 밝게</span><span class=\"en\"><b><span class=\"grammar-hl\">larger and brighter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보름달보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than</span> a full moon!</b></span></div></div><div class=\"lec-sent-ko\">“지구가 보름달보다 더 크고 더 밝게 보여요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호현이가 부모님께 현재 보고 있는 풍경을 전달하는 대사입니다. 달에서 지구를 바라보는 상황을 통해, 평소 우리가 보던 보름달과 비교하여 지구의 존재감을 드러내는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">larger and brighter than (비교급): 형용사 large와 bright 뒤에 -er을 붙이고 than을 사용하여 두 대상을 비교하는 비교급 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">large</td><td class=\"m\">큰, 넓은</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 빛나는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 기다릴 수 없다</span><span class=\"en\"><b>I can’t wait for</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내일의 활동들을”</span><span class=\"en\"><b>tomorrow’s activities.”</b></span></div></div><div class=\"lec-sent-ko\">내일 활동이 너무 기대돼요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 호현이가 달에서의 일상을 매우 긍정적으로 느끼고 있음을 보여줍니다. 새로운 환경에 대한 설렘을 표현하며, 달 여행이 단순한 방문을 넘어 다양한 활동이 이루어지는 공간임을 암시하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can&#39;t wait for (관용표현): &#39;몹시 기다리다&#39;라는 의미의 숙어로, 뒤에 목적어(tomorrow&#39;s activities)를 동반합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>미래 사회에서 주인공 호현은 달 호텔에 머물고 있다.</li><li>호현은 지구에 있는 부모님께 달에서 본 지구의 경이로운 모습을 전한다.</li><li>달에서 경험할 내일의 일정에 대해 설렘과 기대를 드러내고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Hohyun calls his parents from a lunar hotel to express his admiration for the Earth, while sharing his excitement for upcoming lunar activities.</div>\n              <div class=\"lec-final-sum-ko\">호현은 달 호텔에서 부모님께 지구에 대한 감탄을 전하며, 다가올 달에서의 활동에 대한 기대감을 나눈다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문5_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문5_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문5_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문5_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문5_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문5_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문5_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문5_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문5_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문5_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/17.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문5_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문5_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문5_강의_audio/20.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.pare
