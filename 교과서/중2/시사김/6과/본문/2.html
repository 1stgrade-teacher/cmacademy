><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한, 특수한</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">고정하다, 설치하다</td></tr><tr><td class=\"w\">float away</td><td class=\"m\">떠내려가다, 둥둥 떠서 사라지다</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">점심은</span><span class=\"en\"><b>Lunch</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수프와 감자였다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> soup and potatoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 포장 용기에 담긴</span><span class=\"en\"><b>in special packages.</b></span></div></div><div class=\"lec-sent-ko\">점심은 특별한 포장 용기에 담긴 수프와 감자였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주라는 특수한 환경에서의 식사 풍경을 제시하며 글을 시작합니다. 중력이 없는 공간이기에 일반적인 그릇 대신 내용물이 쏟아지지 않는 전용 용기를 사용해야 한다는 배경을 깔고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was (be동사): 주어 Lunch의 상태를 설명하는 2형식 문장의 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한, 특수한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">접시는</span><span class=\"en\"><b>Plates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용되지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">are not used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서는,</span><span class=\"en\"><b>in space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 모두가 먹었다</span><span class=\"en\"><b>so everyone ate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직접 그 포장 용기에서</span><span class=\"en\"><b>directly from the packages.</b></span></div></div><div class=\"lec-sent-ko\">우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;특수 포장&#39;에 대한 구체적인 이유를 밝힙니다. 식기가 떠다닐 위험이 있는 무중력 상태라는 제약 때문에 식사 방식이 지상과 완전히 다르다는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not used (수동태): be동사(are)+p.p.(used) 구조입니다. use는 타동사인데 목적어가 없어서 수동구조 are not used 형태로 씁니다. 기본구조: use + O(목적어) (~를 사용하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가능했다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 포장 용기를 고정하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix</span> the package</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">테이블 위에</span><span class=\"en\"><b>on the table</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 자석들이 있었기 때문이다</span><span class=\"en\"><b>because there were magnets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포장 용기와 테이블 양쪽 모두에</span><span class=\"en\"><b>on both the package and the table.</b></span></div></div><div class=\"lec-sent-ko\">포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 용기 사용의 불편함을 해결하는 방법을 설명합니다. 자석이라는 도구를 통해 무중력 환경에서도 음식을 안정적으로 두고 먹을 수 있는 기술적 장치를 소개합니다. 4. “Keep your food on the table magnet, everyone,” said Ms. Lee, the homeroom teacher. 이 선생님의 당부를 통해 무중력 공간에서의 행동 수칙을 강조합니다. 앞선 자석의 원리를 학생들이 식사 중에 실제로 어떻게 실천해야 하는지 행동 지침으로 보여줍니다. 5. “If it floats away, it may damage the spaceship.” 왜 음식물을 자석에 고정해야 하는지 그 결정적인 이유를 설명하며 경각심을 줍니다. 떠다니는 이물질이 정밀한 우주선 기기에 부딪혀 발생할 수 있는 위험 상황을 경고하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was possible to fix (가주어): 진주어: It은 가주어이고, to fix the package on the table이 진주어입니다. 문장의 주어 자리에 긴 부정사구를 대신하여 it을 사용했습니다.</div><div class=\"lec-gr-item\">to fix (to부정사): 앞의 형용사 possible을 수식하는 형용사적 용법의 보충 설명 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fix</td><td class=\"m\">고정하다, 설치하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;여러분의 음식을 두세요</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Keep your food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">테이블 자석 위에,</span><span class=\"en\"><b><span class=\"grammar-hl\">on the table magnet</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분,&quot;</span><span class=\"en\"><b>everyone,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말씀하셨다,</span><span class=\"en\"><b>said <span class=\"grammar-hl\">Ms. Lee,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">담임 선생님인</span><span class=\"en\"><b><span class=\"grammar-hl\">the homeroom teacher</span>.</b></span></div></div><div class=\"lec-sent-ko\">“모두 테이블 자석 위에 음식을 올려 두세요,”라고 담임 선생님인 이 선생님이 말씀하셨습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 선생님의 당부를 통해 무중력 공간에서의 행동 수칙을 강조합니다. 앞선 자석의 원리를 학생들이 식사 중에 실제로 어떻게 실천해야 하는지 행동 지침으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Keep your food on the table magnet (5형식(명령문)): Keep(동사) + your food(목적어) + on the table magnet(전치사구, 목적보어) 구조로, 목적어의 위치를 유지하게끔 지시하는 5형식 구조입니다.</div><div class=\"lec-gr-item\">Ms. Lee, the homeroom teacher (동격): 쉼표를 통해 Ms. Lee와 the homeroom teacher가 동일 인물임을 나타내는 동격 관계입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;만약 그것이 떠다니면,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">If it floats away</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 손상을 줄지도 모른다</span><span class=\"en\"><b>it may damage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주선에.&quot;</span><span class=\"en\"><b>the spaceship.”</b></span></div></div><div class=\"lec-sent-ko\">“음식이 떠다니면 우주선에 손상을 줄 수도 있어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 음식물을 자석에 고정해야 하는지 그 결정적인 이유를 설명하며 경각심을 줍니다. 떠다니는 이물질이 정밀한 우주선 기기에 부딪혀 발생할 수 있는 위험 상황을 경고하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If it floats away (분사구문(대용)): 접속사 If를 포함한 조건 부사절입니다. floats away는 자동사구로 쓰여 주어의 상태 변화를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우주에서는 무중력 환경 때문에 접시 대신 특수 포장 용기를 사용한다.</li><li>용기와 식탁에 달린 자석을 이용해 음식을 고정한다.</li><li>이 선생님은 음식물이 떠다니면 우주선이 고장 날 수 있다고 주의를 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Astronauts eat directly from magnetic packages to secure their food, because floating items can potentially damage the spacecraft.</div>\n              <div class=\"lec-final-sum-ko\">우주인들은 음식이 떠다녀 우주선을 손상시킬 수 있기 때문에, 음식을 고정하기 위해 자석이 달린 포장지에서 직접 식사한다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문2_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문2_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문2_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문2_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문2_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문2_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문2_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문2_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문2_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문2_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/17.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문2_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문2_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/20.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문2_강의_audio/21.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문2_강의_audio/22.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문2_강의_audio/23.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p
