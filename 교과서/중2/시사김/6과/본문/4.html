 고스란히 기록되어 있죠. 이처럼 달은 공기와 물이 없는 척박한 곳이지만, 외부의 침식으로부터 자유로워 우주의 타임캡슐과 같은 역할을 수행합니다. 따라서 달의 표면을 관찰하는 것은 과거 태양계가 겪어온 충돌의 역사를 생생하게 들여다보는 귀중한 학습 과정이 될 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01월진의 발생</div><ul><li>갑작스러운 진동과 함께 달에서 지진 현상이 나타났다.</li><li>갑작스러운 지면의 흔들림 (ground shake)</li><li>시현이 지진(earthquake)이라고 소리침</li><li>핵심 키워드: 월진(moonquake)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02침착한 대응</div><ul><li>이선생님의 지시에 따라 모두가 안전하게 상황을 대처했다.</li><li>이선생님이 모두를 안심시킴 (calm down)</li><li>다행히 강도가 약한 월진임</li><li>가만히 있으면 안전하다는 판단 (keep still)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03크레이터 탐험</div><ul><li>월진이 멈춘 후, 달 표면의 특징인 크레이터를 관찰하러 이동했다.</li><li>우주 암석이 달에 충돌하여 생성됨 (space rocks crash)</li><li>크레이터(craters) 탐사 시작</li><li>핵심 키워드: 크레이터(craters)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04달 지형의 보존성</div><ul><li>달은 공기가 없기 때문에 발자국이나 크레이터가 오랫동안 변하지 않는다.</li><li>달에는 공기가 없음 (no air)</li><li>발자국(footprints)과 크레이터의 형태가 유지됨</li><li>지형 변화가 거의 없음 (don’t change)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calm down</td><td class=\"m\">진정하다, 가라앉다</td></tr><tr><td class=\"w\">keep still</td><td class=\"m\">가만히 있다, 움직이지 않다</td></tr><tr><td class=\"w\">go away</td><td class=\"m\">사라지다, 떠나가다</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐험하다, 답사하다</td></tr><tr><td class=\"w\">crater</td><td class=\"m\">분화구, 구멍</td></tr><tr><td class=\"w\">crash into</td><td class=\"m\">~에 충돌하다, ~에 부딪히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때 갑자기,</span><span class=\"en\"><b>Then suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅이</span><span class=\"en\"><b>the ground</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔들리기 시작했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">began to shake</span>.</b></span></div></div><div class=\"lec-sent-ko\">그때 갑자기 땅이 흔들리기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 탐사 활동 중에 갑작스러운 지각 변동이 발생하며, 긴장감이 감도는 상황을 제시합니다. 2. “An earthquake!” shouted Sihyun. 땅이 흔들리는 현상을 목격한 시현이가 지상에서 겪는 익숙한 재난 상황으로 받아들이고 있음을 보여줍니다. 3. “Calm down, everyone,” said Ms. Lee. 당황하는 학생들을 리더인 이 선생님이 다독이며 다음 행동을 위한 질서를 잡는 과정입니다. 4. “It’s actually a moonquake. Luckily, it’s not very strong. We will be okay if we keep still.” moonquake는 달에서 일어나는 지각 진동을 의미하며, 시현이의 당혹감을 해소하고 학생들이 안전을 유지하도록 구체적인 행동 지침을 주는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">began to shake (to부정사): begin은 목적어로 to부정사를 취하는 동사로, 여기서는 &#39;흔들리기 시작했다&#39;는 행위를 명사적으로 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“지진이야!”</span><span class=\"en\"><b>“An earthquake!”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시현이가 외쳤다.</span><span class=\"en\"><b><span class=\"grammar-hl\">shouted Sihyun</span>.</b></span></div></div><div class=\"lec-sent-ko\">“지진이야!” 시현이가 외쳤습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 땅이 흔들리는 현상을 목격한 시현이가 지상에서 겪는 익숙한 재난 상황으로 받아들이고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shouted Sihyun (도치): 직접 화법 문장에서 주어(Sihyun)와 동사(shouted)의 위치가 바뀐 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“진정하세요,</span><span class=\"en\"><b>“Calm down,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분,”</span><span class=\"en\"><b>everyone,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">said Ms. Lee</span>.</b></span></div></div><div class=\"lec-sent-ko\">“진정하세요, 여러분,” 이 선생님이 말했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당황하는 학생들을 리더인 이 선생님이 다독이며 다음 행동을 위한 질서를 잡는 과정입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">said Ms. Lee (도치): 직접 화법 문장에서 주어(Ms. Lee)와 동사(said)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calm down</td><td class=\"m\">진정하다, 가라앉다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그건 사실</span><span class=\"en\"><b><span class=\"grammar-hl\">“It’s actually</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">월진이에요.</span><span class=\"en\"><b><span class=\"grammar-hl\">a moonquake.</span></b></span></div></div><div class=\"lec-sent-ko\">“그건 사실 월진이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> moonquake는 달에서 일어나는 지각 진동을 의미하며, 시현이의 당혹감을 해소하고 학생들이 안전을 유지하도록 구체적인 행동 지침을 주는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“It’s actually a moonquake. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히,</span><span class=\"en\"><b><span class=\"grammar-hl\">Luckily,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 그리 강하지 않아요.</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s not very strong.</span></b></span></div></div><div class=\"lec-sent-ko\">다행히 그리 강하지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 선생님이 예상한 대로 상황이 통제되고 안정되었음을 확인해 주는 서술입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Luckily, it’s not very strong. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 괜찮을 거예요</span><span class=\"en\"><b>We will be okay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 가만히 있는다면.”</span><span class=\"en\"><b>if we <span class=\"grammar-hl\">keep still</span>.”</b></span></div></div><div class=\"lec-sent-ko\">가만히 있으면 괜찮을 거예요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긴박했던 상황이 종료되었음을 알리며 다시 탐사 활동을 이어갈 수 있는 환경이 되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep still (관용표현): keep + 형용사(still) 구조로, &#39;~한 상태를 유지하다&#39;라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep still</td><td class=\"m\">가만히 있다, 움직이지 않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선생님이 옳았다.</span><span class=\"en\"><b><span class=\"grammar-hl\">She was right.</span></b></span></div></div><div class=\"lec-sent-ko\">선생님이 옳았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 선생님이 예상한 대로 상황이 통제되고 안정되었음을 확인해 주는 서술입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">She was right. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">월진은</span><span class=\"en\"><b><span class=\"grammar-hl\">The moonquake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧 사라졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">soon went away.</span></b></span></div></div><div class=\"lec-sent-ko\">월진은 곧 사라졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긴박했던 상황이 종료되었음을 알리며 다시 탐사 활동을 이어갈 수 있는 환경이 되었음을 나타냅니다. 7. “Now, let’s go and explore the craters,” said Ms. Lee. 지진 상황이 마무리된 후, 원래 목적이었던 달 탐사 일정으로 자연스럽게 전환하는 계기를 만듭니다. 8. “Craters are made when space rocks crash into the Moon.” 달 표면의 특징인 craters가 형성되는 물리적 원인을 설명하여 학생들에게 학습 정보를 제공합니다. 9. “Like the footprints, the craters don’t change much because the Moon has no air.” 달의 환경적 특성이 지형을 보존하는 이유를 제시하며, 앞서 언급된 발자국 사례와 지형을 연결해 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The moonquake soon went away. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“이제,</span><span class=\"en\"><b>“Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가서 탐험합시다</span><span class=\"en\"><b><span class=\"grammar-hl\">let’s go and explore</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분화구들을,”</span><span class=\"en\"><b>the craters,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말했다.</span><span class=\"en\"><b>said Ms. Lee.</b></span></div></div><div class=\"lec-sent-ko\">“이제 분화구를 탐험하러 갑시다,” 이 선생님이 말했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 달의 환경적 특성이 지형을 보존하는 이유를 제시하며, 앞서 언급된 발자국 사례와 지형을 연결해 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let’s go and explore (관용표현): let us의 축약형으로, 뒤에 동사원형을 사용하여 제안을 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explore</td><td class=\"m\">탐험하다, 답사하다</td></tr><tr><td class=\"w\">crater</td><td class=\"m\">분화구, 구멍</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“분화구는 만들어진다</span><span class=\"en\"><b>“Craters <span class=\"grammar-hl\">are made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주 암석이 달에 충돌할 때.</span><span class=\"en\"><b>when space rocks crash into the Moon.</b></span></div></div><div class=\"lec-sent-ko\">“분화구는 우주 암석이 달에 충돌할 때 만들어져요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are made (수동태): be동사(are)+p.p.(made) 구조입니다. make는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are made 형태로 씁니다. 기본구조: make + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crater</td><td class=\"m\">분화구, 구멍</td></tr><tr><td class=\"w\">crash into</td><td class=\"m\">~에 충돌하다, ~에 부딪히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">발자국들처럼,</span><span class=\"en\"><b>Like the footprints,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분화구들은 많이 변하지 않는다</span><span class=\"en\"><b>the craters don’t change much</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에는 공기가 없기 때문에.”</span><span class=\"en\"><b><span class=\"grammar-hl\">because the Moon has no air</span>.”</b></span></div></div><div class=\"lec-sent-ko\">발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because the Moon has no air (관계부사): 문맥상 이유를 나타내는 접속사로 쓰였으나, 관계부사절(why)이 생략된 문장 구조와 유사하게 부사적 기능을 수행하며 문장 전체의 이유를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crater</td><td class=\"m\">분화구, 구멍</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>달 탐사 중 갑작스러운 흔들림이 발생했으나 선생님의 안내로 무사히 넘어갔다.</li><li>상황이 진정되자 탐사대는 달의 지형인 분화구를 관찰하러 이동했다.</li><li>달에는 공기가 없어 발자국이나 분화구 같은 흔적이 오랫동안 변하지 않고 유지된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Visitors should remain calm during moonquakes for safety, and they can observe craters that stay unchanged due to the absence of air.</div>\n              <div class=\"lec-final-sum-ko\">방문객들은 안전을 위해 월진 동안 침착함을 유지해야 하며, 대기가 없어 변하지 않는 크레이터를 관찰할 수 있다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문4_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문4_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문4_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문4_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문4_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문4_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 시사김 6과 본문4_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 시사김 6과 본문4_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문4_강의_audio/9.mp3","hl":"m
