nets), 우주선(spaceship)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03달 표면 탐사와 낮은 중력</div><ul><li>달에 도착한 학생들은 낮은 중력 덕분에 평소보다 훨씬 높이 점프하며 즐거운 시간을 보낸다.</li><li>낮은 중력으로 인해 높게 점프 가능 (low gravity)</li><li>서로 부딪혀 다치지 않도록 주의가 필요함</li><li>핵심 키워드: 낮은 중력(low gravity), 달(Moon)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04달의 환경적 특징 관찰</div><ul><li>바람이나 비가 없는 달의 환경으로 인해 과거의 흔적들이 그대로 보존되어 있다.</li><li>100년이 넘은 아폴로 우주비행사의 발자국(footprints) 확인</li><li>바람이나 비가 없어 풍화 작용이 거의 없음</li><li>핵심 키워드: 발자국(footprints), 기상 현상 없음(no wind or rain)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05달의 지질 현상과 분화구</div><ul><li>달에서 발생하는 지진과 운석 충돌로 만들어진 지형을 학습한다.</li><li>달에서 발생하는 지진인 월진(moonquake) 경험</li><li>우주 암석이 충돌해 만들어진 분화구(craters) 탐구</li><li>핵심 키워드: 월진(moonquake), 분화구(craters)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06하루의 마무리</div><ul><li>달에서의 일정을 마친 후 지구에 있는 가족과 안부를 나누며 하루를 정리한다.</li><li>달 호텔에서 숙박하며 지구와 영상 통화(video call)를 함</li><li>지구의 밝고 큰 모습을 보며 다음 날 활동을 기대함</li><li>핵심 키워드: 영상 통화(video call), 지구(Earth)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 소풍</td></tr><tr><td class=\"w\">zero gravity</td><td class=\"m\">무중력</td></tr><tr><td class=\"w\">take a look at</td><td class=\"m\">~을 살펴보다, ~을 자세히 보다</td></tr><tr><td class=\"w\">calm down</td><td class=\"m\">진정하다, 차분해지다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep still</td><td class=\"m\">가만히 있다, 움직이지 않다</td></tr><tr><td class=\"w\">go away</td><td class=\"m\">사라지다, 없어지다</td></tr><tr><td class=\"w\">crash into</td><td class=\"m\">~와 충돌하다, ~에 들이받다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2099년 10월 25일</span><span class=\"en\"><b>October 25, 2099</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호현이의 학교는</span><span class=\"en\"><b>Hohyun’s school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체험 학습을 갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">went on</span> a field trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달로</span><span class=\"en\"><b>to the Moon.</b></span></div></div><div class=\"lec-sent-ko\">(2099년 10월 25일, 호현이네 학교는 달로 현장학습을 갔다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 앞으로 이어질 달 탐사 여행이라는 전체적인 상황을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went on (관용표현): go on a field trip(~로 현장 학습을 가다) 형태의 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 소풍</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선이 우주에 도달했을 때,</span><span class=\"en\"><b>When the spaceship reached space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두가 무중력을 경험했다</span><span class=\"en\"><b>everyone experienced zero gravity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 떠다니기 시작했다</span><span class=\"en\"><b>and began <span class=\"grammar-hl\">to float</span>.</b></span></div></div><div class=\"lec-sent-ko\">우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 현장 학습이 시작되었으며, 지구와는 완전히 다른 환경인 무중력 상태가 펼쳐졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to float (to부정사): began의 목적어 역할을 하는 명사적 용법의 to부정사 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">zero gravity</td><td class=\"m\">무중력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호현이는 유찬이를 밀었다</span><span class=\"en\"><b>Hohyun pushed Yuchan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 손가락으로,</span><span class=\"en\"><b>with his finger,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유찬이는 떠다니게 되었다</span><span class=\"en\"><b>and Yuchan went <span class=\"grammar-hl\">sailing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선실을 가로질러</span><span class=\"en\"><b>through the cabin!</b></span></div></div><div class=\"lec-sent-ko\">호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무중력 상태에서 물체가 어떻게 움직이는지를 보여주는 구체적인 상황 묘사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sailing (현재분사): 문장의 서술부에서 동작의 상태를 보충 설명하는 현재분사 구문(보어 역할)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">규진이는 거꾸로 섰다</span><span class=\"en\"><b>Kyujin stood <span class=\"grammar-hl\">upside down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천장에</span><span class=\"en\"><b>on the ceiling.</b></span></div></div><div class=\"lec-sent-ko\">규진이는 천장에 거꾸로 섰습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위와 아래의 구분이 없는 우주 공간의 특성을 시각적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">upside down (관용표현): 거꾸로라는 의미를 가진 부사적 관용구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시현이는 서 있었다</span><span class=\"en\"><b>Sihyun <span class=\"grammar-hl\">was standing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽에</span><span class=\"en\"><b>on the wall.</b></span></div></div><div class=\"lec-sent-ko\">시현이는 벽에 서 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장에 이어, 방향성에 구애받지 않는 우주 공간의 환경을 추가로 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was standing (현재진행): be동사(was)+현재분사(standing)가 결합하여 과거의 동작 진행을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가 편안함을 느꼈다</span><span class=\"en\"><b>Everyone felt <span class=\"grammar-hl\">comfortable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위나 아래가 없기 때문에</span><span class=\"en\"><b>because there is no up or down</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서는</span><span class=\"en\"><b>in space.</b></span></div></div><div class=\"lec-sent-ko\">우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 묘사들을 정리하며, 등장인물들이 생소한 우주 환경에 잘 적응하고 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">comfortable 5형식(SVOC) 구조: felt(감각동사) + 목적어(everyone) + 보어(comfortable)가 결합하여 2형식 구조로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">점심은 수프와 감자였다</span><span class=\"en\"><b>Lunch was <span class=\"grammar-hl\">soup and potatoes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 포장 용기에 든</span><span class=\"en\"><b>in special packages.</b></span></div></div><div class=\"lec-sent-ko\">점심은 특별한 포장 용기에 담긴 수프와 감자였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주라는 특수한 공간에서 음식을 섭취하는 구체적인 방식을 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">soup and potatoes (관용표현): lunch(점심 식사)의 내용을 설명하는 구체적인 명사구다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">접시는 사용되지 않는다</span><span class=\"en\"><b>Plates <span class=\"grammar-hl\">are not used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서는,</span><span class=\"en\"><b>in space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 모두가 먹었다</span><span class=\"en\"><b>so everyone ate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포장 용기에서 바로</span><span class=\"en\"><b>directly from the packages.</b></span></div></div><div class=\"lec-sent-ko\">우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장에서 언급한 특수 포장의 필요성을 설명하며 우주 생활의 실용적인 면모를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not used (수동태): be동사(are)+p.p.(used) 구조다. use는 타동사인데 목적어가 없어서 수동구조 are not used 형태로 쓴다. 기본구조: use + O(목적어)</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가능했다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포장 용기를 고정하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix</span> the package</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">테이블 위에</span><span class=\"en\"><b>on the table</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자석들이 있었기 때문에</span><span class=\"en\"><b>because there were magnets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포장 용기와 테이블 양쪽 모두에</span><span class=\"en\"><b>on both the package and the table.</b></span></div></div><div class=\"lec-sent-ko\">포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장처럼 음식이 떠다니지 않게 하는 구체적인 과학적 해결책을 제시합니다. 10. “Keep your food on the table magnet, everyone,” said Ms. Lee, the homeroom teacher. 학생들의 안전한 식사를 돕기 위한 교사의 지시 사항을 전달합니다. 11. “If it floats away, it may damage the spaceship.” 10번 지시 사항의 이유를 설명하며, 우주 공간에서 사소한 움직임도 큰 위험이 될 수 있다는 경고를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was possible to fix (가주어): 진주어: It이 가주어, to fix the package on the table이 진주어인 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;여러분의 음식을 두세요</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Keep your food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">테이블 자석 위에,</span><span class=\"en\"><b><span class=\"grammar-hl\">on the table</span> magnet,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분,&quot;</span><span class=\"en\"><b>everyone,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말씀하셨다,</span><span class=\"en\"><b>said Ms. Lee,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">담임 선생님인</span><span class=\"en\"><b>the homeroom teacher.</b></span></div></div><div class=\"lec-sent-ko\">“모두 테이블 자석 위에 음식을 올려 두세요,”라고 담임 선생님인 이 선생님이 말씀하셨습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학생들의 안전한 식사를 돕기 위한 교사의 지시 사항을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Keep your food on the table (관용표현): 목적어(your food)를 특정 상태/위치(on the table magnet)에 두라는 명령문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;만약 그것이 떠다니면,</span><span class=\"en\"><b>“If it <span class=\"grammar-hl\">floats away</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 손상을 줄지도 모른다</span><span class=\"en\"><b>it may damage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주선에.&quot;</span><span class=\"en\"><b>the spaceship.”</b></span></div></div><div class=\"lec-sent-ko\">“음식이 떠다니면 우주선에 손상을 줄 수도 있어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 10번 지시 사항의 이유를 설명하며, 우주 공간에서 사소한 움직임도 큰 위험이 될 수 있다는 경고를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">floats away (관용표현): 부사 away가 결합하여 떠서 멀어지다라는 의미를 만든다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선이 착륙했다</span><span class=\"en\"><b>The spaceship <span class=\"grammar-hl\">landed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에</span><span class=\"en\"><b>on the Moon.</b></span></div></div><div class=\"lec-sent-ko\">우주선이 달에 착륙했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이동 과정에서 목적지인 달로 배경이 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">landed (과거시제): 주어(The spaceship)의 과거 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가 밖으로 뛰어나갔다</span><span class=\"en\"><b>Everyone <span class=\"grammar-hl\">jumped out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 천천히 착지했다</span><span class=\"en\"><b>and landed slowly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달은 낮은 중력을 가지고 있기 때문에</span><span class=\"en\"><b>because the Moon has low gravity.</b></span></div></div><div class=\"lec-sent-ko\">달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 달의 물리적 특성인 낮은 중력이 인간의 움직임에 어떤 영향을 주는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">jumped out (관용표현): 밖으로 뛰어 나오다라는 의미의 동사+부사 구문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쉬웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높이 점프하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to jump</span> high</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에서는</span><span class=\"en\"><b>on the Moon.</b></span></div></div><div class=\"lec-sent-ko\">달에서는 높이 점프하는 것이 쉬웠습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 13번의 낮은 중력이라는 원인이 가져온 구체적인 결과를 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was easy to jump (가주어): 진주어: It이 가주어, to jump high on the Moon이 진주어인 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시현이가 점프했을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When Sihyun jumped</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 넘어갔다 규진이의 머리 위로</span><span class=\"en\"><b>she went over Kyujin’s head!</b></span></div></div><div class=\"lec-sent-ko\">시현이는 점프하면서 규진이의 머리 위로 날아갔습니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 낮은 중력으로 인한 신체 활동의 변화를 보여주는 생생한 사례입니다. 16. “Be careful,” said Ms. Lee. 자유로운 움직임 뒤에 따를 수 있는 잠재적 위험에 대해 경고합니다. 17. “It’s fun to jump in low gravity, but you can get hurt if you bump into each other.” 16번 경고의 근거를 밝히며 학생들의 안전을 강조합니다. 18. “Now, everyone, come here and let’s take a look at the footprints of the Apollo astronauts!” 달의 역사적인 현장으로 학생들을 이끌며 새로운 학습 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When Sihyun jumped (관계부사): 문장 내에서 시간을 나타내는 접속사(When) 절로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;조심하세요,&quot;</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Be careful</span>,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말씀하셨다.</span><span class=\"en\"><b>said Ms. Lee.</b></span></div></div><div class=\"lec-sent-ko\">“조심하세요,” 이 선생님이 말했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자유로운 움직임 뒤에 따를 수 있는 잠재적 위험에 대해 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Be careful (관용표현): 형용사(careful)를 보어로 취하는 명령문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;재미있지만</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점프하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to jump</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮은 중력에서,</span><span class=\"en\"><b>in low gravity,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다칠 수 있어요</span><span class=\"en\"><b>but you can get hurt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 서로 부딪히면</span><span class=\"en\"><b>if you bump into each other.</b></span></div></div><div class=\"lec-sent-ko\">“낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 16번 경고의 근거를 밝히며 학생들의 안전을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s fun to jump (가주어): 진주어: It이 가주어, to jump in low gravity가 진주어인 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자, 여러분,</span><span class=\"en\"><b>Now, everyone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이리로 오세요</span><span class=\"en\"><b>come here</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 살펴봅시다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">let’s take a look at</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아폴로 우주 비행사들의 발자국을!&quot;</span><span class=\"en\"><b>the footprints of the Apollo astronauts!”</b></span></div></div><div class=\"lec-sent-ko\">자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 달의 역사적인 현장으로 학생들을 이끌며 새로운 학습 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let’s take a look at (관용표현): ~를 살펴보다라는 의미의 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a look at</td><td class=\"m\">~을 살펴보다, ~을 자세히 보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 19 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 발자국들은</span><span class=\"en\"><b>The footprints <span class=\"grammar-hl\">were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">100년이 넘었다,</span><span class=\"en\"><b><span class=\"grammar-hl\">over 100 years old</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것들은 여전히 완벽해 보였다</span><span class=\"en\"><b>but they still looked perfect.</b></span></div></div><div class=\"lec-sent-ko\">그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지구와는 다른 달의 환경이 유물을 보존하는 능력을 놀라움으로 표현합니다. 20. “It’s because there’s no wind or rain on the Moon,” Ms. Lee explained. 19번에서 언급한 보존의 원인을 과학적으로 풀이합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were over 100 years old (관용표현): 나이/기간을 나타내는 명사구와 형용사구가 결합된 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;그것은 ~이기 때문이다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바람이나 비가 없기</span><span class=\"en\"><b>there’s no wind or rain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에는,&quot;</span><span class=\"en\"><b>on the Moon,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 설명하셨다.</span><span class=\"en\"><b>Ms. Lee explained.</b></span></div></div><div class=\"lec-sent-ko\">“그건 달에 바람이나 비가 없기 때문이에요,” 이 선생님이 설명했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 19번에서 언급한 보존의 원인을 과학적으로 풀이합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s because (관용표현): 이유를 설명하는 전치사구+명사절 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때 갑자기,</span><span class=\"en\"><b>Then suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅이 흔들리기 시작했다</span><span class=\"en\"><b>the ground <span class=\"grammar-hl\">began to shake</span>.</b></span></div></div><div class=\"lec-sent-ko\">그때 갑자기 땅이 흔들리기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평온한 탐사 도중 발생한 예상치 못한 상황으로 긴장감을 높입니다. 22. “An earthquake!” shouted Sihyun. 21번의 현상을 지구에서 겪는 익숙한 재난으로 오해하는 장면입니다. 23. “Calm down, everyone,” said Ms. Lee. 당황한 학생들을 진정시키며 상황을 통제하려는 교사의 역할을 보여줍니다. 24. “It’s actually a moonquake. Luckily, it’s not very strong. We will be okay if we keep still.” &#39;지진&#39;과 &#39;월진&#39;의 차이를 짚어주며 학생들에게 대처 방법을 안내합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">began to shake (to부정사): began의 목적어 역할을 하는 명사적 용법의 to부정사 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;지진이야!&quot;</span><span class=\"en\"><b>“<span class=\"grammar-hl\">An earthquake!</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시현이가 외쳤다.</span><span class=\"en\"><b>shouted Sihyun.</b></span></div></div><div class=\"lec-sent-ko\">“지진이야!” 시현이가 외쳤습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 21번의 현상을 지구에서 겪는 익숙한 재난으로 오해하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">An earthquake! (관용표현): 감정을 나타내는 감탄문 형태의 명사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;진정하세요,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Calm down</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분,&quot;</span><span class=\"en\"><b>everyone,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말씀하셨다.</span><span class=\"en\"><b>said Ms. Lee.</b></span></div></div><div class=\"lec-sent-ko\">“진정하세요, 여러분,” 이 선생님이 말했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당황한 학생들을 진정시키며 상황을 통제하려는 교사의 역할을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Calm down (관용표현): 진정하다라는 의미의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">calm down</td><td class=\"m\">진정하다, 차분해지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 24 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;그것은 사실 월진이다.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s actually</span> a moonquake.</b></span></div></div><div class=\"lec-sent-ko\">“그건 사실 월진이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;지진&#39;과 &#39;월진&#39;의 차이를 짚어주며 학생들에게 대처 방법을 안내합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s actually (관용표현): 강조를 위해 쓰이는 부사(actually)가 포함된 구문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히,</span><span class=\"en\"><b>Luckily,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 매우 강하지 않다.</span><span class=\"en\"><b>it’s <span class=\"grammar-hl\">not very strong</span>.</b></span></div></div><div class=\"lec-sent-ko\">다행히 그리 강하지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교사의 지도가 정확했음을 확인해 주며 위기 상황이 해소되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not very strong (관용표현): 부사(very)와 형용사(strong)를 부정하는 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 괜찮을 것이다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">will be okay</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 가만히 있으면.&quot;</span><span class=\"en\"><b>if we keep still.”</b></span></div></div><div class=\"lec-sent-ko\">가만히 있으면 괜찮을 거예요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 24번에서 예고한 대로 상황이 종료되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be okay (미래시제): 조동사 will과 be동사가 결합한 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep still</td><td class=\"m\">가만히 있다, 움직이지 않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 27 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 말이 맞았다.</span><span class=\"en\"><b>She <span class=\"grammar-hl\">was right</span>.</b></span></div></div><div class=\"lec-sent-ko\">선생님이 옳았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교사의 지도가 정확했음을 확인해 주며 위기 상황이 해소되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was right (관용표현): 옳다라는 의미의 형용사 보어를 가진 2형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">월진은 곧 사라졌다.</span><span class=\"en\"><b>The moonquake soon <span class=\"grammar-hl\">went away</span>.</b></span></div></div><div class=\"lec-sent-ko\">월진은 곧 사라졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 24번에서 예고한 대로 상황이 종료되었음을 나타냅니다. 27. “Now, let’s go and explore the craters,” said Ms. Lee. 위기 이후 다시 원래의 교육적인 목적인 탐사 활동으로 돌아갑니다. 28. “Craters are made when space rocks crash into the Moon.” 지질학적 지식을 학생들에게 전달합니다. 29. “Like the footprints, the craters don’t change much because the Moon has no air.” 20번에서 언급했던 대기가 없는 환경의 특성을 다른 사례(크레이터)에 적용합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went away (관용표현): 사라지다라는 의미의 구동사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;이제, 갑시다</span><span class=\"en\"><b>“Now, <span class=\"grammar-hl\">let’s go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 탐험합시다 분화구들을,&quot;</span><span class=\"en\"><b><span class=\"grammar-hl\">and explore</span> the craters,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 말씀하셨다.</span><span class=\"en\"><b>said Ms. Lee.</b></span></div></div><div class=\"lec-sent-ko\">“이제 분화구를 탐험하러 갑시다,” 이 선생님이 말했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 20번에서 언급했던 대기가 없는 환경의 특성을 다른 사례(크레이터)에 적용합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let’s go and explore (관용표현): go와 explore가 병렬로 연결된 권유문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;분화구는 만들어진다</span><span class=\"en\"><b>“Craters <span class=\"grammar-hl\">are made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주 암석들이 충돌할 때</span><span class=\"en\"><b>when space rocks crash</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에.</span><span class=\"en\"><b>into the Moon.</b></span></div></div><div class=\"lec-sent-ko\">“분화구는 우주 암석이 달에 충돌할 때 만들어져요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긴 탐사 일정을 마치고 휴식 시간으로 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are made (수동태): be동사(are)+p.p.(made) 구조다. make는 타동사인데 목적어가 없어서 수동구조 are made 형태로 쓴다. 기본구조: make + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crash into</td><td class=\"m\">~와 충돌하다, ~에 들이받다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">발자국들처럼,</span><span class=\"en\"><b><span class=\"grammar-hl\">Like the footprints</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분화구들은 많이 변하지 않는다</span><span class=\"en\"><b>the craters don’t change much</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달은 공기가 없기 때문에.&quot;</span><span class=\"en\"><b>because the Moon has no air.”</b></span></div></div><div class=\"lec-sent-ko\">발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 달과 지구라는 물리적 거리감을 디지털 연결을 통해 극복하는 미래의 일상을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Like the footprints (관용표현): ~처럼이라는 의미의 전치사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두는 머물렀다</span><span class=\"en\"><b>Everyone <span class=\"grammar-hl\">stayed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호텔에</span><span class=\"en\"><b><span class=\"grammar-hl\">at a hotel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에 있는</span><span class=\"en\"><b>on the Moon.</b></span></div></div><div class=\"lec-sent-ko\">모두 달에 있는 호텔에서 묵었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긴 탐사 일정을 마치고 휴식 시간으로 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed at a hotel (관용표현): 장소를 나타내는 전치사 at과 함께 쓰인 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호현이가 잠자리에 들기 전에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Before Hohyun went to bed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 영상 통화를 했다</span><span class=\"en\"><b>he had a video call</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 부모님과</span><span class=\"en\"><b>with his parents</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구에 있는</span><span class=\"en\"><b>on the Earth.</b></span></div></div><div class=\"lec-sent-ko\">호현이는 잠자리에 들기 전에 지구에 있는 부모님과 영상 통화를 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 달과 지구라는 물리적 거리감을 디지털 연결을 통해 극복하는 미래의 일상을 보여줍니다. 32. “The Earth looks larger and brighter than a full moon! I can’t wait for tomorrow’s activities.” 달에서 지구를 바라보는 특별한 경험을 공유하며 앞으로의 설렘을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Before Hohyun went to bed (관계부사): 시간을 나타내는 접속사(Before) 절로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;지구가 보인다</span><span class=\"en\"><b>“The Earth <span class=\"grammar-hl\">looks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 크고 더 밝게</span><span class=\"en\"><b><span class=\"grammar-hl\">larger and brighter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보름달보다</span><span class=\"en\"><b>than a full moon!</b></span></div></div><div class=\"lec-sent-ko\">“지구가 보름달보다 더 크고 더 밝게 보여요!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looks larger and brighter 5형식(SVOC) 구조: look(감각동사) + 보어(형용사)가 결합하여 2형식 구조로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 기다릴 수 없다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can’t wait for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내일의 활동들을.&quot;</span><span class=\"en\"><b>tomorrow’s activities.”</b></span></div></div><div class=\"lec-sent-ko\">내일 활동이 너무 기대돼요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t wait for (관용표현): ~를 간절히 기다리다라는 의미의 숙어적 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>호현이네 학교는 달로 현장 학습을 떠나 무중력과 낮은 중력을 직접 체험한다.</li><li>우주선과 달 기지에서 특수 자석 식기 등을 사용하며 우주 특수 환경에 적응한다.</li><li>선생님의 지도 아래 아폴로 발자국과 크레이터를 관찰하며 달의 지질학적 특성을 배운다.</li><li>갑작스러운 월진을 겪지만 침착하게 대처하며 무사히 일정을 소화한다.</li><li>호현이는 숙소에서 지구를 바라보며 특별한 경험에 대한 만족감과 내일의 기대를 드러낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students experienced the unique physical conditions of space during their moon trip, and they safely explored the lunar surface under their teacher’s guidance.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 달 여행 중 우주의 독특한 물리적 환경을 경험했으며, 교사의 지도하에 달 표면을 안전하게 탐험했다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/8.mp3","hl":"stage-4"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/9.mp3","hl":"stage-5"}],[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/10.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문 전체_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문 전체_강의_audio/14
