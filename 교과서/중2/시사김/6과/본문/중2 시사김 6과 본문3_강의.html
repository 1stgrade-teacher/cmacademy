 바람이 불거나 비가 내리지 않는다는 점도 매우 important한 특징이에요. 덕분에 아폴로 11호 우주비행사들이 남긴 발자국(Footprints)과 같은 흔적들이 외부 요인에 의해 깎이지 않고 수십 년이 지난 지금까지도 선명하게 보존될 수 있는 것이죠. 이런 달의 환경을 미리 머릿속에 그려보면서, 달에 착륙한 주인공들이 어떤 모험을 하게 될지 함께 살펴볼까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01달에 도착한 우주선</div><ul><li>우주선이 달에 착륙하여 탐사대원들이 밖으로 나가는 장면이다.</li><li>달의 낮은 중력(low gravity)으로 인해 높이 점프함</li><li>시현(Sihyun)이 규진(Kyujin)의 머리 위로 뛰어넘음</li><li>핵심 키워드: 달(Moon), 중력(gravity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02안전 주의 사항</div><ul><li>이선 선생님께서 낮은 중력 환경에서의 안전을 당부하신다.</li><li>점프하는 것은 재미있지만 부딪히면 위험함</li><li>대원들에게 주의(be careful)할 것을 강조함</li><li>핵심 키워드: 안전(safety), 주의(caution)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03아폴로 발자국 발견</div><ul><li>선생님은 대원들과 함께 아폴로 우주비행사들의 발자국을 관찰한다.</li><li>100년이 넘은 오래된 발자국(footprints) 확인</li><li>발자국이 여전히 완벽한 상태를 유지함</li><li>핵심 키워드: 아폴로 우주비행사(Apollo astronauts)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04발자국 보존의 이유</div><ul><li>달의 환경적 특성 덕분에 발자국이 오랫동안 보존될 수 있었다.</li><li>달에는 바람(wind)이나 비(rain)가 없음</li><li>외부 침식 요인이 없어 형태가 유지됨</li><li>핵심 키워드: 보존(preservation), 환경(environment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spaceship</td><td class=\"m\">우주선</td></tr><tr><td class=\"w\">gravity</td><td class=\"m\">중력, 심각성</td></tr><tr><td class=\"w\">be careful</td><td class=\"m\">조심하다, 주의하다</td></tr><tr><td class=\"w\">get hurt</td><td class=\"m\">다치다, 상처를 입다</td></tr><tr><td class=\"w\">bump into</td><td class=\"m\">~와 부딪히다, ~와 우연히 마주치다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a look at</td><td class=\"m\">~을 살펴보다, ~을 구경하다</td></tr><tr><td class=\"w\">footprint</td><td class=\"m\">발자국, 자취</td></tr><tr><td class=\"w\">astronaut</td><td class=\"m\">우주비행사</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한, 온전한</td></tr><tr><td class=\"w\">explain</td><td class=\"m\">설명하다, 해명하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선이</span><span class=\"en\"><b>The spaceship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">착륙했다</span><span class=\"en\"><b><span class=\"grammar-hl\">landed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에</span><span class=\"en\"><b>on the Moon.</b></span></div></div><div class=\"lec-sent-ko\">우주선이 달에 착륙했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경을 설정하는 문장으로, 인물들이 달이라는 새로운 장소에 도착했음을 알리며 앞으로 펼쳐질 활동의 시작을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">landed (일반동사): 주어(The spaceship)의 과거 동작을 나타내는 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spaceship</td><td class=\"m\">우주선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두는</span><span class=\"en\"><b>Everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밖으로 뛰어나갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">jumped out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 천천히 착지했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">landed</span> slowly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달은 낮은 중력을 가지고 있기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because</span> the Moon has low gravity.</b></span></div></div><div class=\"lec-sent-ko\">달은 ent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그것은 재미있다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮은 중력에서 점프하는 것은,</span><span class=\"en\"><b><span class=\"grammar-hl\">to jump</span> in low gravity,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 여러분은 다칠 수 있다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">you can get hurt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 서로 부딪힌다면</span><span class=\"en\"><b><span class=\"grammar-hl\">if</span> you bump into each other.</b></span></div></div><div class=\"lec-sent-ko\">“낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 선생님의 주의 사항을 부연 설명합니다. 낮은 중력이 가진 재미라는 장점과 그로 인해 발생할 수 있는 위험이라는 현실적인 조언을 대비시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s fun to jump (가주어): 진주어: It은 가주어이며, to부정사구(to jump)가 진주어로서 문장의 의미상 주체가 됩니다.</div><div class=\"lec-gr-item\">to jump (to부정사): 가주어 It의 내용을 보충 설명하는 명사적 용법입니다.</div><div class=\"lec-gr-item\">you can get hurt (수동태): be동사(get은 be동사 대용) + p.p.(hurt) 구조입니다. 기본구조: hurt O (누구를 다치게 하다). 타동사인 hurt의 목적어가 주어로 올라가 수동구조로 쓰였습니다.</div><div class=\"lec-gr-item\">if 접속사: 조건을 나타내는 부사절을 이끌어 주절의 상황에 대한 가정을 제시합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gravity</td><td class=\"m\">중력, 심각성</td></tr><tr><td class=\"w\">get hurt</td><td class=\"m\">다치다, 상처를 입다</td></tr><tr><td class=\"w\">bump into</td><td class=\"m\">~와 부딪히다, ~와 우연히 마주치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자, 여러분,</span><span class=\"en\"><b>Now, everyone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이리로 오세요</span><span class=\"en\"><b>come here</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 살펴봅시다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">let’s take a look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아폴로 우주 비행사들의 발자국을!”</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> the footprints of the Apollo astronauts!”</b></span></div></div><div class=\"lec-sent-ko\">자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 안전에 대한 주의를 마친 후, 본격적인 탐구 대상인 &#39;우주비행사의 발자국&#39;으로 시선을 옮기며 대화의 중심 주제를 이동시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let’s take a look at (관용표현): &#39;~을 살펴보다/보다&#39;라는 의미의 이디엄입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a look at</td><td class=\"m\">~을 살펴보다, ~을 구경하다</td></tr><tr><td class=\"w\">footprint</td><td class=\"m\">발자국, 자취</td></tr><tr><td class=\"w\">astronaut</td><td class=\"m\">우주비행사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 발자국들은</span><span class=\"en\"><b><span class=\"grammar-hl\">The footprints</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">100년이 넘었다,</span><span class=\"en\"><b><span class=\"grammar-hl\">were over 100 years old</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것들은 여전히 완벽해 보였다</span><span class=\"en\"><b>but they still looked perfect.</b></span></div></div><div class=\"lec-sent-ko\">그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오랜 시간이 지났음에도 발자국이 선명하게 남아있다는 놀라운 사실을 제시하여, 달의 환경이 지구와 얼마나 다른지 독자의 호기심을 자극합니다. 9. “It’s because there’s no wind or rain on the Moon,” Ms. Lee explained. 앞 문장의 현상에 대한 원인을 밝히며, 달에 기상 현상이 존재하지 않는다는 과학적 사실을 교육적으로 전달하는 결론적인 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The footprints were over 100 years old (수동태): 엄밀히 말하면 be동사+보어 형태이나, 상태 유지를 나타내는 구조로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">footprint</td><td class=\"m\">발자국, 자취</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한, 온전한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그것은 ~이기 때문이다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바람이나 비가 없다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">there’s no wind or rain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달에는,”</span><span class=\"en\"><b>on the Moon,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 선생님이 설명했다</span><span class=\"en\"><b>Ms. Lee explained.</b></span></div></div><div class=\"lec-sent-ko\">“그건 달에 바람이나 비가 없기 때문이에요,” 이 선생님이 설명했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 현상에 대한 원인을 밝히며, 달에 기상 현상이 존재하지 않는다는 과학적 사실을 교육적으로 전달하는 결론적인 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s because there’s no wind or rain (관용표현): &#39;그것은 ~ 때문이다&#39;라는 이유를 밝히는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explain</td><td class=\"m\">설명하다, 해명하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우주선이 달에 착륙했고, 낮은 중력 덕분에 인물들은 높이 점프하며 즐거운 시간을 보냅니다.</li><li>선생님은 아이들이 다칠까 봐 주의를 주며 안전한 탐구 활동으로 유도합니다.</li><li>달에는 바람이나 비가 없기 때문에 100년 전의 우주비행사 발자국이 그대로 보존되어 있습니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Low gravity on the Moon facilitates high jumping despite the risk of collision, and the lack of wind or rain keeps historical footprints intact.</div>\n              <div class=\"lec-final-sum-ko\">달의 낮은 중력은 충돌 위험에도 불구하고 높이 뛰기를 가능하게 하며, 바람이나 비가 없어 역사적인 발자국을 온전하게 유지한다.</div></div></div>"],"segs":[[{"audio":"./중2 시사김 6과 본문3_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/3.mp3","hl":null},{"audio":"./중2 시사김 6과 본문3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 시사김 6과 본문3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 시사김 6과 본문3_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 시사김 6과 본문3_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/9.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문3_강의_audio/10.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문3_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/12.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문3_강의_audio/13.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문3_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/15.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문3_강의_audio/16.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문3_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/18.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문3_강의_audio/19.mp3","hl":"meaning"},{"audio":"./중2 시사김 6과 본문3_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./중2 시사김 6과 본문3_강의_audio/21.mp3","hl":"main"},{"audio":"./중2 시사김 6과 본문3_강의_audio/22.
