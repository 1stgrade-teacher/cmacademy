\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02영향력의 범위</div><ul><li>우리가 선택한 단어들은 우리의 내면과 외부 세계를 형성하는 중요한 요소가 된다.</li><li>개인의 생각(thoughts)과 감정(emotions) 형성</li><li>친구 관계(friendships)의 질과 방향을 결정</li><li>핵심 키워드: 언어적 선택(Word choice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문제 해결을 위한 탐구</div><ul><li>학생들이 일상에서 겪는 갈등을 언어적 관점에서 분석하여 더 깊은 이해를 도모한다.</li><li>학생들이 직면하는 공통적인 문제(common problems) 탐색</li><li>언어의 놀라운 힘을 이해하고 올바르게 활용하기</li><li>핵심 키워드: 학생들의 문제(Students&#39; problems)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 조사하다</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말에는</span><span class=\"en\"><b><span class=\"grammar-hl\">The Power of Words</span> Words have power.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘이 있습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">말에는 힘이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 던지는 도입부입니다. 우리가 매일 사용하는 언어라는 도구가 단순히 정보를 전달하는 그릇에 그치지 않고, 우리 삶에 실질적인 영향을 끼치는 강력한 자원임을 선포하며 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Power of Words (명사구): The(관사) + Power(명사) + of(전치사) + Words(명사)의 구조로, 명사를 전치사구가 수식하여 &#39;~의 ~&#39;라는 의미를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말은</span><span class=\"en\"><b>They can <span class=\"grammar-hl\">make us feel</span> good or bad.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들 수 있는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">기분 좋거나 나쁘게.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 &#39;힘&#39;의 구체적인 예시를 제시합니다. 언어가 인간의 감정 상태를 즉각적으로 변화시킬 수 있는 내면적인 통제력을 가졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make us feel (5형식(SVOC)): make(사역동사) + us(목적어) + feel(동사원형/목적격보어) 구조. 사역동사는 목적어가 ~하도록 만들다/시키다는 의미를 가지며 목적격보어 자리에 동사원형을 취함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 선택하는 말은</span><span class=\"en\"><b>The words <span class=\"grammar-hl\">which we choose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미칠 수 있으며</span><span class=\"en\"><b>can influence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 생각, 감정, 그리고 우정에.</span><span class=\"en\"><b>our thoughts, emotions, and friendships.</b></span></div></div><div class=\"lec-sent-ko\">우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단어의 영향력이 미치는 범위를 개인의 내면(생각, 감정)에서 외부 관계(우정)로 확장합니다. 단순히 기분을 좌우하는 것을 넘어, 사고방식과 인간관계의 질까지 결정한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which we choose (관계대명사): which는 선행사 Words를 수식하며, 절 내부에서 choose의 목적어 역할을 하는 목적격 관계대명사임. 관계대명사 뒤에는 목적어가 빠진 불완전한 절(we choose)이 옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">함께 살펴봅시다</span><span class=\"en\"><b>Let’s explore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일반적인 문제들을</span><span class=\"en\"><b>some common problems</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 흔히 겪는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that students usually face</span>.</b></span></div></div><div class=\"lec-sent-ko\">학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술한 언어의 영향력을 전제로, 이제 구체적인 적용 사례로 독자를 안내하는 전환점입니다. 독자가 실생활에서 겪는 갈등 상황을 예로 들어 논의를 구체화하겠다는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that students usually face (관계대명사): that은 선행사 problems를 수식하며, 절 내부에서 face의 목적어 역할을 하는 목적격 관계대명사임. 관계대명사 뒤에는 목적어가 빠진 불완전한 절(students usually face)이 옴</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 조사하다</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 이해하게 될 것입니다</span><span class=\"en\"><b>You will understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말의 놀라운 힘을.</span><span class=\"en\"><b>the <span class=\"grammar-hl\">amazing</span> power of words.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 말의 놀라운 힘을 이해하게 될 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 목적을 밝히는 결론적 예고입니다. 학생들이 일상에서 겪는 문제들을 분석하는 과정을 거치고 나면, 왜 단어가 삶을 바꾸는 결정적인 도구가 되는지 깨닫게 될 것임을 확신하며 글을 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing (현재분사(형용사)): amazing이 명사 power를 수식(= &#39;놀라운 힘&#39;)하는 구조로, 명사의 성질을 설명하는 형용사적 역할을 함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>단어는 인간의 감정과 사고, 그리고 인간관계까지 변화시키는 강력한 힘을 지닌다.</li><li>학생들의 일상적인 사례를 통해 언어가 우리 삶에 어떻게 영향을 미치는지 살펴볼 수 있다.</li><li>이 과정을 통해 언어가 가진 놀라운 영향력을 깨닫고 제대로 사용하는 방법을 배울 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Words possess the power to influence our thoughts and emotions, and they significantly affect the quality of our friendships.</div>\n              <div class=\"lec-final-sum-ko\">단어는 우리의 생각과 감정에 영향을 미칠 힘을 가지고 있으며, 우리의 우정의 질에도 상당한 영향을 미친다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3
