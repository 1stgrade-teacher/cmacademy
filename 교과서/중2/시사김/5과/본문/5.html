div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01언어의 영향력</div><ul><li>언어는 우리의 생각과 행동, 그리고 타인과의 관계를 변화시키는 강력한 힘을 가지고 있습니다.</li><li>언어의 힘(power of words)이 미치는 세 가지 영역</li><li>의견(opinions), 행동(actions), 관계(relationships)에 변화를 줌</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02부정적 감정의 해소</div><ul><li>자신이나 주변 사람들에 대해 부정적인 감정을 느낄 때, 긍정적인 언어를 사용하는 것이 해결책입니다.</li><li>불편한 감정(upset)을 다루는 방법</li><li>긍정적인 단어(positive words) 선택의 중요성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03언어의 긍정적 결과</div><ul><li>긍정적인 말을 사용함으로써 우리는 개인적인 성장과 더 깊은 이해를 얻을 수 있습니다.</li><li>학습(learn)과 성장(grow)을 통한 발전</li><li>상황에 대한 이해력(understanding) 향상</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04자아와 세계의 형성</div><ul><li>우리가 사용하는 언어는 궁극적으로 우리의 삶의 모습과 세상을 만들어 나갑니다.</li><li>언어와 세계관의 연결</li><li>핵심 키워드: 세상(world), 형성하다(shape)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">power</td><td class=\"m\">힘, 영향력, 능력</td></tr><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해, 생각</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한, 화난</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인, 확실한, 건설적인</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 모양을 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결국,</span><span class=\"en\"><b>In the end,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말은 힘을 가지고 있다</span><span class=\"en\"><b>words have the power</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 의견, 행동, 그리고 관계를 바꿀 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">to change</span> our opinions, actions, and relationships.</b></span></div></div><div class=\"lec-sent-ko\">결국, 말은 우리의 의견, 행동, 그리고 관계를 바꿀 수 있는 힘을 가지고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 내용들을 종합하여 글쓴이가 전달하고자 하는 핵심 결론을 제시합니다. 언어는 단순히 정보를 전달하는 도구를 넘어, 우리가 세상을 바라보는 관점과 타인과 맺는 관계의 질을 결정짓는 강력한 영향력을 행사한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to change (to부정사): power라는 명사를 뒤에서 수식하는 형용사적 용법으로, ~할 힘(power)이라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">power</td><td class=\"m\">힘, 영향력, 능력</td></tr><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해, 생각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 속상함을 느낄 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When you feel upset</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신이나 당신 주변 사람들에 대해,</span><span class=\"en\"><b><span class=\"grammar-hl\">about yourself or the people around you,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말을 사용하라.</span><span class=\"en\"><b>use positive words.</b></span></div></div><div class=\"lec-sent-ko\">자신이나 주변 사람들 때문에 기분이 상할 때, 긍정적인 말을 사용하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 결론을 바탕으로 독자에게 구체적인 실천 지침을 제공합니다. 부정적인 감정에 매몰되기 쉬운 상황에서 의식적으로 사용하는 언어가 상황을 반전시키는 열쇠가 된다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you feel upset about yourself or the people around you, (현재분사): around you(너의 주변에 있는 사람들)와 같이 명사 뒤에서 명사를 수식하는 형용사적 역할을 하며, 축약된 관계절(people who are around you)의 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한, 화난</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인, 확실한, 건설적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 배우고, 성장하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">You can learn, grow,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 이해할 수 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and understand better.</span></b></span></div></div><div class=\"lec-sent-ko\">여러분은 배우고, 성장하고, 더 잘 이해할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적인 언어 사용이 가져올 긍정적인 결과를 열거합니다. 단순히 감정을 해소하는 수준을 넘어, 언어의 변화가 개인의 인지적, 정서적 성숙을 이끌어내는 과정임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You can learn, grow, and understand better. (관용표현): 동사 원형들이 나열되어 있으며, 조동사 can에 병렬로 연결되어 능력이나 가능성을 나타내는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 말은</span><span class=\"en\"><b><span class=\"grammar-hl\">Your words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형성한다</span><span class=\"en\"><b><span class=\"grammar-hl\">shape</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 세상을.</span><span class=\"en\"><b><span class=\"grammar-hl\">your world.</span></b></span></div></div><div class=\"lec-sent-ko\">여러분의 말이 여러분의 세상을 만듭니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 메시지를 관통하는 마지막 문장으로, 언어와 현실의 관계를 정의합니다. 외부 환경이 우리를 만드는 것이 아니라, 우리가 내뱉는 언어가 스스로의 세계를 설계하고 창조해 나가는 주체적인 과정이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Your words shape your world. 5형식(SVOC) 구조는 아니며, S(Your words) + V(shape) + O(your world)의 기본 3형식 문장 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 모양을 만들다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>언어는 사람의 생각과 행동, 인간관계를 변화시키는 강력한 힘을 지닌다.</li><li>부정적인 상황일수록 긍정적인 언어를 사용해야 한다.</li><li>언어를 바꾸는 것은 개인의 배움과 성장, 그리고 깊은 이해로 이어진다.</li><li>결국 우리가 사용하는 언어가 우리 삶의 모습 그 자체를 결정한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Words have the power to alter our perceptions and relationships, so choosing positive language helps us grow and improve our lives.</div>\n              <div class=\"lec-final-sum-ko\">언어는 우리의 인식과 관계를 변화시킬 힘을 지니고 있으므로, 긍정적인 언어를 선택하는 것은 우리가 성장하고 삶을 개선하도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./5_audio/1.mp3","hl":null}],[{"audio":"./5_audio/2.mp3","hl":null}],[{"audio":"./5_audio/3.mp3","hl":null},{"audio":"./5_audio/4.mp3","hl":"stage-0"},{"audio":"./5_audio/5.mp3","hl":"stage-1"},{"audio":"./5_audio/6.mp3","hl":"stage-2"},{"audio":"./5_audio/7.mp3","hl":"stage-3"}],[{"audio":"./5_audio/8.mp3","hl":null}],[{"audio":"./5_audio/9.mp3","hl":"main"},{"audio":"./5_audio/10.mp3","hl":"meaning"},{"audio":"./5_audio/11.mp3","hl":"grammar"}],[{"audio":"./5_audio/12.mp3","hl":"main"},{"audio":"./5_audio/13.mp3","hl":"meaning"},{"audio":"./5_audio/14.mp3","hl":"grammar"}],[{"audio":"./5_audio/15.mp3","hl":"main"},{"audio":"./5_audio/16.mp3","hl":"meaning"},{"audio":"./5_audio/17.mp3","hl":"grammar"}],[{"audio":"./5_audio/18.mp3","hl":"main"},{"audio":"./5_audio/19.mp3","hl":"meaning"},{"audio":"./5_audio/20.mp3","hl":"grammar"}],[{"audio":"./5_audio/21.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
