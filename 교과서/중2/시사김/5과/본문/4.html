 class=\"lec-cover-title\">From Blame to Support: Building Stronger Teamwork<small>비난에서 지지로: 더 강한 팀워크 구축하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 인간관계에서 소통의 방식이 미치는 영향에 대해 먼저 알아볼까요? 심리학에서 말하는 비난(Blame)은 상대방을 방어적으로 만들고 관계를 단절시키지만, 긍정적인 피드백을 건네는 협력적 의사소통(Collaborative Communication)은 서로의 신뢰를 쌓고 더 나은 성과를 내게 하는 &#39;심리적 안전감(Psychological Safety)&#39;을 만들어줍니다. 마치 팀 운동에서 동료의 실수를 지적하는 대신 &quot;다음에 잘하면 돼!&quot;라고 응원하는 것이 &#39;회복 탄력성(Resilience)&#39;을 높여 실력을 발휘하게 만드는 원리와 같죠. 즉, 우리가 주고받는 말 한마디가 단순한 대화를 넘어 공동체의 목표 달성에 얼마나 큰 영향을 미치는지 이해한다면, 본문의 메시지가 왜 중요한지 쉽게 파악할 수 있을 거예요. 우리가 무심코 던지는 부정적인 언어 습관이 사실은 &#39;팀워크(Teamwork)&#39;의 가능성을 갉아먹고 있는 것은 아닐지 이 글을 통해 함께 고민해 보면 좋겠습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 제기</div><ul><li>일이 잘못되었을 때 타인을 탓하는 행동이 관계에 미치는 부정적인 영향을 언급합니다.</li><li>패배의 원인을 상대방의 탓으로 돌리는 상황</li><li>비난하는 말(blame)이 감정을 상하게 하고 우정을 손상함</li><li>핵심 키워드: 비난(blame), 관계 손상(damage friendship)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02대안 제시</div><ul><li>비난 대신 지지와 격려의 말을 건네는 것이 중요함을 강조합니다.</li><li>실수를 지적하기보다는 지지(support)를 표현함</li><li>상대방을 응원(cheer up)하여 사기를 높임</li><li>핵심 키워드: 지지(support), 격려(cheer up)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기대 효과</div><ul><li>긍정적인 대화가 팀의 발전에 기여하는 긍정적 결과를 설명합니다.</li><li>긍정적인 말(positive words)이 팀워크를 강화함</li><li>다음 경기에서 더 나은 성과(better performance)를 냄</li><li>핵심 키워드: 팀워크(teamwork), 성과(performance)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실천 방법</div><ul><li>신뢰와 협력을 강조하는 구체적인 표현 방식을 제안합니다.</li><li>신뢰하는 동료임을 확인하는 언어 사용</li><li>함께 최선을 다하자는 미래 지향적인 태도</li><li>핵심 키워드: 신뢰(trust), 협력(doing our best)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blame</td><td class=\"m\">~을 탓하다, ~에게 책임이 있다고 하다</td></tr><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 문제가 생기다</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr><tr><td class=\"w\">cheer up</td><td class=\"m\">~의 기운을 북돋우다, ~을 응원하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop</td><td class=\"m\">발전시키다, 기르다</td></tr><tr><td class=\"w\">teamwork</td><td class=\"m\">협동, 팀워크</td></tr><tr><td class=\"w\">do one&#39;s best</td><td class=\"m\">최선을 다하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 게임에서 졌는데</span><span class=\"en\"><b>“We lost the game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 실수 때문에.</span><span class=\"en\"><b><span class=\"grammar-hl\">because of</span> your mistake.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 잘못이야.</span><span class=\"en\"><b>It’s your fault.”</b></span></div></div><div class=\"lec-sent-ko\">(“우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 일이 잘못되었을 때 상대방을 직접적으로 비난하는 전형적인 상황을 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because of (관용표현): 전치사구로 뒤에 명사(구)를 동반하여 ‘~때문에’라는 원인과 이유를 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일이 잘못되었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When things go wrong</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 가끔 다른 사람을 비난하기도 합니다.</span><span class=\"en\"><b>we sometimes blame others.</b></span></div></div><div class=\"lec-sent-ko\">일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 구체적인 상황을 일반화하여, 인간이 흔히 겪는 부정적인 대처 방식을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When things go wrong 분사구문(의미상 축약절): 접속사 When이 이끄는 부사절로, ‘일들이 잘못될 때’라는 시간적 배경을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blame</td><td class=\"m\">~을 탓하다, ~에게 책임이 있다고 하다</td></tr><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 문제가 생기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 말은</span><span class=\"en\"><b>negative words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“네 잘못이야”와 같은</span><span class=\"en\"><b>like “<span class=\"grammar-hl\">It’s your fault</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대방의 감정을 상하게 하고</span><span class=\"en\"><b>can hurt their feelings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우정을 해칠 수 있습니다.</span><span class=\"en\"><b>and damage your friendship.</b></span></div></div><div class=\"lec-sent-ko\">하지만 “네 잘못이야”와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 행동이 가진 문제점을 지적하며, 비난이 초래하는 정서적·관계적 악영향을 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s your fault (관용표현): ‘그것은 너의 잘못이다’라는 표현으로, blame의 대상이나 책임을 지적할 때 사용됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지지를 보내고</span><span class=\"en\"><b>show your support</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 응원해 주세요.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">cheer them up</span>.</b></span></div></div><div class=\"lec-sent-ko\">대신 지지를 보내고 그들을 응원해 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비난이라는 잘못된 대응을 멈추고, 관계 회복과 팀워크를 위해 취해야 할 구체적인 대안적 행동을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cheer them up (관용표현): 이어동사(phrasal verb) 구조로, ‘cheer + 목적어 + up’ 형태를 취하여 ‘그들을 응원하다/기운 나게 하다’라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말은</span><span class=\"en\"><b>Positive words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 팀이 ~하게 할 것입니다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">make your team</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강한 팀워크를 키우고</span><span class=\"en\"><b><span class=\"grammar-hl\">develop</span> strong teamwork</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘할 수 있게</span><span class=\"en\"><b>and perform better</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음에는</span><span class=\"en\"><b>next time.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제안한 응원의 태도가 팀의 역량을 향상시키고 미래의 성과로 이어진다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make your team develop 5형식(SVOC) 구조: &#39;make(사역동사) + 목적어(your team) + 목적보어(develop, 동사원형)&#39;의 형태입니다. 사역동사는 목적보어로 동사원형을 취하여 목적어가 ~하게 만들다라는 의미를 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop</td><td class=\"m\">발전시키다, 기르다</td></tr><tr><td class=\"w\">teamwork</td><td class=\"m\">협동, 팀워크</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해 보세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">Say It!</span></b></span></div></div><div class=\"lec-sent-ko\">말해 보세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 강조한 긍정적 의사소통의 실제 사례를 제공함으로써 독자가 즉시 실천할 수 있는 가이드를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Say It! (명령문): 주어 없이 동사원형으로 시작하며, 상대방에게 행동을 요구하는 1형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 팀원이야</span><span class=\"en\"><b>“You’re a team member</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 믿는</span><span class=\"en\"><b><span class=\"grammar-hl\">whom I trust</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 계속 최선을 다하면</span><span class=\"en\"><b>Let’s keep <span class=\"grammar-hl\">doing</span> our best together,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 게임에서 이길 수 있을 거야.</span><span class=\"en\"><b>and we’ll win the next game.”</b></span></div></div><div class=\"lec-sent-ko\">(“너는 내가 믿는 팀원이야. 함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 강조한 긍정적 의사소통의 실제 사례를 제공함으로써 독자가 즉시 실천할 수 있는 가이드를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whom I trust (관계대명사): 목적격 관계대명사(whom)가 이끄는 절이 앞의 선행사(a team member)를 수식합니다. 절 내부에서 I(주어) + trust(동사) 뒤의 목적어 자리가 비어 있는 불완전한 문장 구조입니다.</div><div class=\"lec-gr-item\">doing (동명사): &#39;keep + -ing&#39; 구문에서 keep의 목적어 역할을 하며, ‘계속해서 ~하다’라는 동작의 지속을 나타냅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>일이 잘못되었을 때 타인을 비난하는 것은 관계를 망치는 지름길이다.</li><li>비난 대신 지지와 응원의 언어를 사용해야 한다.</li><li>긍정적인 소통 방식은 팀워크를 강화하고 더 나은 성과를 만든다.</li><li>신뢰와 격려가 담긴 구체적인 말 한마디가 팀의 승리를 돕는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Negative blame damages friendships and hinders teamwork, but positive support encourages teammates and improves future performance.</div>\n              <div class=\"lec-final-sum-ko\">부정적인 비난은 우정을 해치고 팀워크를 저해하지만, 긍정적인 지지는 팀원을 격려하고 향후 성과를 향상시킨다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":"main"},{"audio":"./4_audio/13.mp3","hl":"meaning"},{"audio":"./4_audio/14.mp3","hl":"grammar"}],[{"audio":"./4_audio/15.mp3","hl":"main"},{"audio":"./4_audio/16.mp3","hl":"meaning"},{"audio":"./4
