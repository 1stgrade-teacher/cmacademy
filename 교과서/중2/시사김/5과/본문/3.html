ya19La9fy66Cjp0wB69v55/PGKQ/wB7qOAACDzng+vPHTv64FKGUjgjj357DB+n4k5/GkLLxyMdAMgdz6n+Q9wDSSu76vS35atW0d9PuC9n1eut9Hun8n53HDkA+o6fX/PP19qMY759PzP+eeefrTd6gDkew3D6d+PT2PAB5BpSyr1I5/Hr/wDW/wA5ofXX/hn3Wq+dtvmFv1/Df7kLjpnqAcdO/wD9bp36Y60Y/nn6/wCf89iDIABJGPrn0x36dBntTdykkZBAPXI5x/I+xp29dF5/18w387L7v6vcd+QJ9vr9B7kfypG6H6H+Xv3/AEoyCfvKQR6gA9PX1zxzyO3emsSofocKxGCO6gjgAg9upxkc4ANLRfdpfqutu/na/wCA0k767W1VvLe7T+dndn//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">From Jealousy to Growth: The Power of Positive Language<small>질투에서 성장으로: 긍정적인 언어의 힘</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 타인의 성공을 볼 때 느끼는 질투심은 심리학에서 상향 사회 비교(Upward Social Comparison)라는 개념으로 설명할 수 있는데, 이는 자신보다 나은 상황에 있는 사람과 스스로를 비교하며 느끼는 복잡한 감정이에요. 이런 감정이 들 때 단순히 상대를 깎아내리는 것은 자신의 성장을 저해하는 자기방어 기제(Defense Mechanism)로 작용하기 쉽죠. 마치 운동 경기에서 실력 차이를 인정하지 않고 &quot;운이 좋았을 뿐&quot;이라고 말하는 것과 같아서, 정작 자신의 실력을 키울 기회를 놓치게 만드는 거예요. 반대로 타인의 성취를 인정하고 배우려는 자세를 가지면 성장 마인드셋(Growth Mindset)을 키울 수 있는데, 이는 지능이나 능력이 고정된 것이 아니라 노력으로 발전할 수 있다고 믿는 태도를 말해요. 긍정적인 언어를 사용하는 것은 단순히 예의를 지키는 것을 넘어, 자신의 에너지를 타인에 대한 시기심에서 나 자신의 발전을 위한 동기부여로 전환하는 아주 현명한 전략이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01질투의 표현</div><ul><li>타인의 성공을 마주했을 때 우리는 부정적인 언어로 질투심을 표출하곤 한다.</li><li>성준의 우승에 대해 운이 좋았을 뿐이라고 폄하함</li><li>타인을 시기하는 부정적인 말(negative words)을 쉽게 사용함</li><li>핵심 키워드: 질투(jealousy), 부정적인 말(negative words)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02부정적 태도의 한계</div><ul><li>남을 깎아내리는 태도는 자신의 발전을 가로막는 장애물이 된다.</li><li>부정적인 언어 습관은 개인의 성장을 방해함</li><li>타인의 성공을 인정하지 않는 태도는 스스로를 고립시킴</li><li>핵심 키워드: 성장(growth)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태도 변화의 필요성</div><ul><li>타인의 노력을 존중하고 축하하는 마음으로 전환하는 것이 중요하다.</li><li>친구의 성공을 함께 기뻐하고(happy for others) 노력을 존중함</li><li>긍정적인 언어를 통해 배우고(learn from others) 관계를 개선함</li><li>핵심 키워드: 존중(respect), 긍정적인 말(positive words)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실천적 다짐</div><ul><li>실질적인 변화를 위해 자신의 성장에 집중하는 긍정적 언어를 사용한다.</li><li>상대방의 성취를 진심으로 칭찬함</li><li>나 자신의 목표와 노력(try hard)에 집중함</li><li>핵심 키워드: 성취(great job), 실천(say it)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contest</td><td class=\"m\">대회, 경연</td></tr><tr><td class=\"w\">jealous</td><td class=\"m\">질투하는, 시샘하는</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존중하다, 존경하다</td></tr><tr><td class=\"w\">get along</td><td class=\"m\">사이좋게 지내다, 잘 지내다</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&quot;성준이가 대회에서 1등을 했다고?</span><span class=\"en\"><b>“Seongjun <span class=\"grammar-hl\">won</span> first place in the contest?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그냥 운이 너무 좋을 뿐이야.&quot;</span><span class=\"en\"><b>He’s just too lucky.”</b></span></div></div><div class=\"lec-sent-ko\">(성준이가 대회에서 1등을 했다고? 그냥 운이 너무 좋네.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인의 성취를 깎아내리는 상황을 예시로 제시하며, 우리가 질투를 느낄 때 흔히 범하는 심리적 방어 기제를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">won (일반동사): 주어(Seongjun)의 과거 동작(contest에서 1등을 차지함)을 나타내는 문장의 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contest</td><td class=\"m\">대회, 경연</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 쉽게 부정적인 말을 한다</span><span class=\"en\"><b>We easily say negative things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에 관해</span><span class=\"en\"><b>about others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 질투를 느낄 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we feel jealous</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 대화 사례를 일반화하여, 질투라는 감정이 타인을 향한 비난으로 이어지는 보편적인 인간의 습성을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when we feel jealous (관계부사(접속사적)): when은 시간의 의미를 나타내는 부사절을 이끄는 접속사로, 주어(we)와 동사(feel)를 포함한 절이 문장 전체를 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jealous</td><td class=\"m\">질투하는, 시샘하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 부정적인 말을 사용하는 것은</span><span class=\"en\"><b>But <span class=\"grammar-hl\">using negative words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;그냥 운이 너무 좋을 뿐이야&quot;와 같은</span><span class=\"en\"><b>like “He’s just too lucky”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 성장하게 내버려 두지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">doesn’t let you grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 “그냥 운이 너무 좋네”와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부정적인 언어 습관이 개인의 발전에 저해가 된다는 점을 명시하며, 글쓴이의 본격적인 문제 제기를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">using negative words (동명사): 문장에서 주어 역할을 하며, &#39;부정적인 말을 사용하는 것&#39;이라는 명사적 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">doesn’t let you grow 5형식(SVOC) 구조: let(사역동사) + 목적어(you) + 목적보어(원형부정사 grow) 구조입니다. 목적어인 you가 동작인 grow를 하게끔 허락하거나 상태를 유지하게 한다는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들을 위해 기뻐하려고 노력하라</span><span class=\"en\"><b>try <span class=\"grammar-hl\">to be happy</span> for others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 노력을 존중하라</span><span class=\"en\"><b>and respect their efforts.</b></span></div></div><div class=\"lec-sent-ko\">대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 부정적 태도에 대한 대안으로, 타인의 성공을 긍정적으로 수용하고 그 바탕에 있는 수고를 인정하는 태도를 권합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be happy (to부정사): try의 목적어로 쓰인 명사적 용법으로, &#39;행복해지는 것&#39;이라는 행위를 시도하라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">respect</td><td class=\"m\">존중하다, 존경하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말들로,</span><span class=\"en\"><b>With positive words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 친구들로부터 배울 수 있고,</span><span class=\"en\"><b>you can learn from your friends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 지낼 수 있고,</span><span class=\"en\"><b><span class=\"grammar-hl\">get along better</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자신의 성장에 집중할 수 있다</span><span class=\"en\"><b>and focus on your own growth.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적 언어 사용이 가져오는 구체적인 이점들로, 인간관계의 개선과 자기 발전이라는 긍정적인 결과를 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get along better (관용표현): get along with(~와 잘 지내다)에서 파생된 표현으로, 친구들과 원만한 관계를 유지한다는 의미의 이디엄입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get along</td><td class=\"m\">사이좋게 지내다, 잘 지내다</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해 보라!</span><span class=\"en\"><b>Say It!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;그는 대단한 일을 해냈어.</span><span class=\"en\"><b>“He <span class=\"grammar-hl\">did</span> a great job.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게 잘된 일이야!</span><span class=\"en\"><b><span class=\"grammar-hl\">Good for him</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나도 열심히 할 거야!&quot;</span><span class=\"en\"><b>I’ll try hard, too!”</b></span></div></div><div class=\"lec-sent-ko\">(말해 보세요! “그가 정말 잘했어. 잘됐다! 나도 열심히 할 거야!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 실생활에서 바로 실천할 수 있는 구체적인 언어 모델을 제시함으로써 글의 교훈을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did (일반동사): 주어(He)가 행한 과거의 행위를 서술하며, 뒤에 나오는 great job(목적어)과 함께 행동의 완수를 나타냅니다.</div><div class=\"lec-gr-item\">Good for him (관용표현): 타인의 성공이나 행운을 진심으로 축하할 때 쓰는 관용구로, 그에게 좋은 일이라는 의미를 담고 있습니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>타인의 성공에 질투를 느껴 부정적으로 말하는 것은 자신의 성장에 방해가 된다.</li><li>부정적인 태도 대신 타인의 노력을 인정하고 축하해 주는 긍정적인 태도가 필요하다.</li><li>이러한 긍정적인 언어 습관은 대인관계를 원만하게 하고 본인의 성장을 돕는다.</li><li>질투를 느낄 때 비난 대신 축하와 다짐의 말을 하는 것이 바람직하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Negative expressions regarding others&#39; success hinder personal development, so choosing positive language enables one to learn from others and focus on individual growth.</div>\n              <div class=\"lec-final-sum-ko\">타인의 성공에 대한 부정적인 표현은 개인의 발전을 저해하므로, 긍정적인 언어를 선택하는 것은 타인에게서 배우고 자신의 성장에 집중할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"aud
