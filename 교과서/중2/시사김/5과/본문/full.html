dnkDtyf0+nOcDof0pGIPRh3798dCMdOvfk/hQSMggoN2ejKASCOARk8Yz2/vZ9WHbgkEc4I+ZcEnIwDgcfMB/tYB6nFVppbTrfd3W9+2my9G32E21aztby6Wj+F+qf6DdxAwCcKBxk4GMnPHbk+/YnjAXe2AfmGMnOcHp7Dt2HUA4owrdCvTHLLyeOB7nqR0x6dggAdVz04bkgDhcevfnqT14OVfVW11Xr00/y0/wAh316dF8m1+N1/w2obzxz07HkdCBx2H0/UcVKpGCMg475zz+IJwQcjJ4wOM5qEbTxle/8AEvOegHXn65/Du8NjptzweGHJPQAY7ZGDxwevzNRq+lru66b/AKfgJrXTq76K3WN9fNb/AMzux7HGcMA3qT+vrz/+vFRtnJGc89Ce4GOhA+gOM8euKeCOGO09ychskYyABzhcjv6Z6mmMFGQNuSRjDDOMcgDjPqeh4xjPAPLr56b/AKfduwvd2aa0vo7a6aea11/DuMz7dO/r/wDq9x+dB5BHA/zjr1/AH8qUD0II5+6VPTrxnnb3H/1qNjAHAyArdMkDgnPGcnPIBxk9+TQl38n023/y6PS+jYPSyirtLS3Raav+um61P//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Power of Positive Words: Shaping Your Perspective and Relationships<small>긍정적인 말의 힘: 당신의 관점과 관계를 형성하는 법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 사용하는 언어가 사고방식과 감정에 영향을 미친다는 점을 심리학에서는 언어적 결정론(Linguistic Determinism)의 일종으로 보기도 하는데, 이는 우리가 세상을 어떻게 인식하느냐가 사용하는 언어의 틀에 의해 크게 좌우된다는 개념이에요. 마치 안경에 색깔 있는 렌즈를 끼면 세상이 그 색으로 보이는 것처럼, 긍정적인 언어를 선택하는 것은 인지적 재구성(Cognitive Restructuring)을 통해 상황을 더 객관적이고 발전적으로 바라보게 돕는 훌륭한 전략이죠. 특히 타인과의 관계에서 사용하는 말은 자기 충족적 예언(Self-fulfilling Prophecy)처럼 우리가 상대방을 대하는 태도를 결정하고, 결과적으로 그 관계의 미래까지 바꾸는 힘을 지니고 있답니다. 우리가 무심코 던진 말 한마디가 단순히 정보를 전달하는 것을 넘어, 뇌의 신경 가소성(Neuroplasticity)을 자극하여 우리의 습관과 성격까지 긍정적으로 변화시킬 수 있다는 사실을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01서론</div><ul><li>단어는 우리의 사고와 감정, 그리고 인간관계에 지대한 영향을 미친다.</li><li>언어가 가진 놀라운 힘(power of words)에 대한 탐구</li><li>선택한 단어가 사고(thoughts)와 감정(emotions)을 결정함</li><li>핵심 키워드: 단어의 힘(power of words)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02자신을 향한 언어</div><ul><li>자신에게 부정적인 말을 하는 대신 긍정적인 격려를 통해 성장의 발판을 마련해야 한다.</li><li>습관적인 부정적 표현은 의욕을 꺾음(mess up)</li><li>실수를 통해 배우고 개선하려는 긍정적 사고(positive thinking)</li><li>핵심 키워드: 자기 격려(self-encouragement)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03타인을 향한 언어</div><ul><li>타인의 성공을 질투하기보다 긍정적인 말로 존중할 때 개인의 성장이 가능하다.</li><li>질투(jealousy)로 인한 부정적 평가의 위험성</li><li>타인의 노력을 인정하고 친구로부터 배우는 태도</li><li>핵심 키워드: 존중(respect)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04관계를 위한 언어</div><ul><li>실패의 책임을 남에게 돌리는 비난보다는 서로를 격려하는 말이 팀워크를 강화한다.</li><li>비난(blame)은 상대에게 상처를 주고 관계를 손상함</li><li>팀워크(teamwork) 발전을 위한 지지와 응원</li><li>핵심 키워드: 팀워크(teamwork)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>우리가 선택한 단어는 세상을 변화시키고 나 자신의 성장을 이끄는 힘이 된다.</li><li>언어는 행동과 관계를 바꾸는 도구임</li><li>긍정적인 단어 선택(positive words)을 통한 삶의 개선</li><li>핵심 키워드: 언어가 만드는 세상(your words shape your world)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다, 좌우하다</td></tr><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr><tr><td class=\"w\">feel down</td><td class=\"m\">우울하다, 기분이 가라앉다</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉진하다</td></tr><tr><td class=\"w\">positively</td><td class=\"m\">긍정적으로, 확신을 가지고</td></tr><tr><td class=\"w\">jealous</td><td class=\"m\">질투하는, 시기하는</td></tr><tr><td class=\"w\">respect</td><td class=\"m\">존중하다, 존경하다</td></tr><tr><td class=\"w\">get along</td><td class=\"m\">사이좋게 지내다, 어울리다</td></tr><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 문제가 생기다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blame</td><td class=\"m\">비난하다, ~의 탓으로 돌리다</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr><tr><td class=\"w\">cheer up</td><td class=\"m\">~을 기운 나게 하다, ~을 응원하다</td></tr><tr><td class=\"w\">teamwork</td><td class=\"m\">팀워크, 협동</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 구체화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어는</span><span class=\"en\"><b><span class=\"grammar-hl\">Words</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘을 가지고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">have power.</span></b></span></div></div><div class=\"lec-sent-ko\">말에는 힘이 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 제시하는 문장으로, 우리가 사용하는 언어가 단순히 소통의 도구를 넘어 삶에 실질적인 영향력을 행사한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Words have power. (기본구조): S+V(3형식). 주어 Words와 타동사 have, 목적어 power로 이루어진 기본 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 ~하도록 만들 수 있는데</span><span class=\"en\"><b>can <span class=\"grammar-hl\">make us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기분이 좋거나 나쁘게 느끼도록</span><span class=\"en\"><b><span class=\"grammar-hl\">feel</span> good or bad.</b></span></div></div><div class=\"lec-sent-ko\">말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 &#39;언어의 힘&#39;이 우리의 감정 상태를 어떻게 좌우하는지 구체적인 예시로 범위를 좁혀 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make us feel 5형식(SVOC) 구조: make(사역동사)+O(us)+OC(동사원형 feel). 사역동사 make는 목적보어로 동사원형을 취하며, &#39;우리로 하여금 느끼게 하다&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어들은</span><span class=\"en\"><b>The words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 선택하는</span><span class=\"en\"><b><span class=\"grammar-hl\">which we choose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향을 미칠 수 있는데</span><span class=\"en\"><b>can influence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 생각, 감정, 그리고 우정에</span><span class=\"en\"><b>our thoughts, emotions, and friendships.</b></span></div></div><div class=\"lec-sent-ko\">우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 언어가 가진 영향력이 단지 일시적인 기분 변화에 그치지 않고, 사고방식과 대인관계 전반에 걸쳐 지속적인 결과를 만들어낸다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which we choose (관계대명사): which가 목적격 관계대명사로 쓰여 앞의 선행사 the words를 수식합니다. 관계대명사 뒤에는 choose의 목적어가 빠진 불완전한 절이 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence</td><td class=\"m\">영향을 주다, 좌우하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴보자</span><span class=\"en\"><b>Let’s explore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 일반적인 문제들을</span><span class=\"en\"><b>some common problems</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 보통 직면하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that students usually face</span>.</b></span></div></div><div class=\"lec-sent-ko\">학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞까지는 언어의 일반적인 속성을 설명했다면, 이제부터는 독자인 학생들이 공감할 만한 구체적인 사례를 제시하겠다는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that students usually face (관계대명사): that이 목적격 관계대명사로 쓰여 앞의 선행사 common problems를 수식합니다. 관계대명사 뒤에는 face의 목적어가 빠진 불완전한 절이 이어집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은</span><span class=\"en\"><b>You</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해하게 될 것이다</span><span class=\"en\"><b>will understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단어의 놀라운 힘을</span><span class=\"en\"><b>the <span class=\"grammar-hl\">amazing power</span> of words.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 말의 놀라운 힘을 이해하게 될 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 목적을 밝히는 문장으로, 구체적인 사례를 통해 언어가 가진 긍정적 잠재력을 깨닫게 될 것임을 독자에게 예고합니다. 6. “I didn’t do well during dance practice. I always mess up.” 학생들이 스스로를 비하할 때 자주 사용하는 부정적인 언어 습관의 구체적인 예시를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing power (현재분사(형용사)): amazing이 명사 power를 수식하며, &#39;놀라운 힘&#39;이라는 의미로 현재분사가 명사의 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 잘하지 못했어</span><span class=\"en\"><b>“I didn’t do well <span class=\"grammar-hl\">during dance practice</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">댄스 연습 동안.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“나는 춤 연습을 잘 못했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학생들이 스스로를 비하할 때 자주 사용하는 부정적인 언어 습관의 구체적인 예시를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">during dance practice (관용표현): dance practice는 &#39;춤 연습&#39;이라는 활동의 의미로 쓰인 명사적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 항상</span><span class=\"en\"><b>I always <span class=\"grammar-hl\">mess up</span>.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">망쳐.”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">난 항상 망쳐.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 자기 비하 발언이 개인의 의욕을 어떻게 꺾어놓는지 그 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mess up (관용표현): &#39;실수하다&#39; 또는 &#39;망치다&#39;라는 의미를 가진 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부정적인 단어들은</span><span class=\"en\"><b>Negative words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“나는 항상 망쳐”와 같은</span><span class=\"en\"><b>like “I always mess up”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 ~하게 만들 수 있는데</span><span class=\"en\"><b>can <span class=\"grammar-hl\">make you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우울함을 느끼고</span><span class=\"en\"><b><span class=\"grammar-hl\">feel down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시도하는 것을 멈추고 싶게</span><span class=\"en\"><b><span class=\"grammar-hl\">and want to stop</span> trying.</b></span></div></div><div class=\"lec-sent-ko\">“난 항상 망쳐”와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 자기 비하 발언이 개인의 의욕을 어떻게 꺾어놓는지 그 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make you feel down and want to stop 5형식(SVOC) 구조: make(사역동사)+O(you)+OC(동사원형 feel, want). 사역동사 make의 목적보어로 원형부정사 feel과 want가 병렬로 연결되었습니다.</div><div class=\"lec-gr-item\">want to stop (to부정사): want의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr><tr><td class=\"w\">feel down</td><td class=\"m\">우울하다, 기분이 가라앉다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로를 격려하라</span><span class=\"en\"><b><span class=\"grammar-hl\">encourage</span> yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 단어들로.</span><span class=\"en\"><b>with positive words.</b></span></div></div><div class=\"lec-sent-ko\">대신 긍정적인 말로 자신을 격려해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부정적인 언어 사용으로 인한 문제점을 해결하기 위해, 사고방식을 전환하는 구체적인 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">encourage (관용표현): &#39;격려하다&#39;라는 의미의 동사로, 문장의 명령문 구조에서 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉진하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 긍정적으로 생각할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you think positively</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은</span><span class=\"en\"><b>you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실수로부터 배우고</span><span class=\"en\"><b>can learn from your mistakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기술을 향상시킬 수 있다.</span><span class=\"en\"><b>and improve your skills.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스스로를 격려하는 언어 선택이 단순히 기분 전환을 넘어 실제 실력 향상이라는 실질적인 결과를 가져온다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you think positively 분사구문(의미상 절): 여기서는 접속사 When을 포함한 부사절 구조로, &#39;당신이 긍정적으로 생각할 때&#39;라는 시간을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">positively</td><td class=\"m\">긍정적으로, 확신을 가지고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해보자!</span><span class=\"en\"><b><span class=\"grammar-hl\">Say It!</span></b></span></div></div><div class=\"lec-sent-ko\">말해 보세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질투심을 느낄 때 타인의 성취를 깎아내리려는 심리가 담긴 부정적인 언어 표현의 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Say It! (관용표현): 명령문 형태로 어떤 대화나 말을 하라는 권유의 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이번에는 춤을 잘 추지 못했지만,</span><span class=\"en\"><b>“I didn’t dance well this time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속 연습해서</span><span class=\"en\"><b>but I’ll <span class=\"grammar-hl\">keep practicing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 나아질 거야.”</span><span class=\"en\"><b>and get better.”</b></span></div></div><div class=\"lec-sent-ko\">“이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 이론적 조언을 실제 일상에서 바로 적용할 수 있도록 구체적인 대화의 모델을 제시합니다. 11. “Seongjun won first place in the contest? He’s just too lucky.” 질투심을 느낄 때 타인의 성취를 깎아내리려는 심리가 담긴 부정적인 언어 표현의 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep practicing (동명사): keep 뒤에 목적어로 쓰여 &#39;연습을 계속하다&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">성준이가 1등을 했다고</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Seongjun won first place</span> in the contest?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대회에서?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“성준이가 대회에서 1등을 했다고?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인을 깎아내리는 말이 상대방에게 피해를 줄 뿐만 아니라, 화자 본인의 성장을 가로막는 장애물이 된다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Seongjun won first place (관용표현): &#39;일등을 차지하다/상을 타다&#39;라는 의미의 이디엄적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 ~일 뿐이야</span><span class=\"en\"><b>He’s just <span class=\"grammar-hl\">too lucky</span>.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 운이 좋을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그냥 운이 너무 좋네.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인의 성공을 대하는 건강한 태도와 그에 적합한 언어 선택이 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too lucky (관용표현): 정도부사 too와 형용사 lucky가 결합하여 &#39;지나치게 운이 좋은&#39;이라는 의미를 만듭니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 말들을 쉽게 하는데</span><span class=\"en\"><b>easily say negative things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에 대해</span><span class=\"en\"><b>about others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">질투심을 느낄 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we feel jealous</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 질투를 느낄 때 다른 사람에 대해 부정적인 말을 쉽게 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질투라는 인간의 보편적인 감정이 왜 부정적인 언어 사용으로 이어지는지 그 심리적 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when we feel jealous (관계부사): when이 시간의 부사절을 이끄는 접속사로 사용되어 &#39;우리가 질투를 느낄 때&#39;라는 의미를 구성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jealous</td><td class=\"m\">질투하는, 시기하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 단어를 사용하는 것은</span><span class=\"en\"><b>using negative words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“그는 정말 운이 좋을 뿐이야”와 같은</span><span class=\"en\"><b>like “He’s just too lucky”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 성장하지 못하게 한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">doesn’t let you grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 “그냥 운이 너무 좋네”와 같은 부정적인 말을 하는 건 여러분이 성장하지 못하게 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인을 깎아내리는 말이 상대방에게 피해를 줄 뿐만 아니라, 화자 본인의 성장을 가로막는 장애물이 된다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doesn’t let you grow 5형식(SVOC) 구조: let(사역동사)+O(you)+OC(동사원형 grow). &#39;당신이 성장하게 내버려두지 않다&#39;라는 의미로 사역동사 구조가 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들을 위해 기뻐하고</span><span class=\"en\"><b><span class=\"grammar-hl\">try to be happy</span> for others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 노력을 존중하려고 노력하라.</span><span class=\"en\"><b>and respect their efforts.</b></span></div></div><div class=\"lec-sent-ko\">대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인의 성공을 대하는 건강한 태도와 그에 적합한 언어 선택이 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">try to be happy (to부정사): try의 목적어로 쓰인 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">respect</td><td class=\"m\">존중하다, 존경하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 18 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 단어들과 함께,</span><span class=\"en\"><b>With positive words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은</span><span class=\"en\"><b>you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들로부터 배우고,</span><span class=\"en\"><b>can learn from your friends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 지내며,</span><span class=\"en\"><b><span class=\"grammar-hl\">get along better</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 성장에 집중할 수 있다.</span><span class=\"en\"><b>and focus on your own growth.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인을 존중하는 언어 습관이 개인의 발전과 원만한 대인관계라는 두 마리 토끼를 잡게 해준다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get along better (관용표현): &#39;더 잘 지내다&#39;라는 의미의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get along</td><td class=\"m\">사이좋게 지내다, 어울리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 19 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해보세요!</span><span class=\"en\"><b>Say It! “He <span class=\"grammar-hl\">did a great job</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 해냈는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">훌륭한 일을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(말해보세요! “그는 훌륭한 일을 해냈어.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타인의 성공을 축하하며 자신의 의욕을 고취하는 긍정적인 화법의 구체적인 예시입니다. 17. “We lost the game because of your mistake. It’s your fault.” 갈등 상황에서 책임을 타인에게 전가할 때 나오는 비난 섞인 언어 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did a great job (관용표현): &#39;잘했다&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잘됐어!</span><span class=\"en\"><b><span class=\"grammar-hl\">Good for him!</span></b></span></div></div><div class=\"lec-sent-ko\">잘됐다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비난 대신 협력을 선택하는 것이 갈등 해결의 핵심임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Good for him! (관용표현): &#39;잘됐네/다행이다&#39;라는 의미로 상대방의 성공을 축하할 때 쓰는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나도 열심히 노력할</span><span class=\"en\"><b>I’ll <span class=\"grammar-hl\">try hard</span>, too!”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거야!”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나도 열심히 할 거야!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 격려의 언어가 팀 전체의 결속력을 다지고 미래의 성과를 이끌어내는 힘이 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">try hard (관용표현): &#39;열심히 노력하다&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 졌는데</span><span class=\"en\"><b>“We lost the game <span class=\"grammar-hl\">because of your mistake</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경기에서</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 실수 때문에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“우리는 네 실수 때문에 게임에서 졌어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팀의 결속을 다지고 미래지향적인 목표를 설정하는 건강한 의사소통 방식입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because of your mistake (관용표현): 전치사구 because of를 사용하여 &#39;~때문에&#39;라는 이유를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그건</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s your fault.</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 잘못이야.”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">네 잘못이야.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 세 가지 사례(자기 비하, 질투, 비난)를 종합하여 언어가 가진 변화의 힘을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s your fault. (관용표현): &#39;당신의 잘못이다&#39;라는 의미를 나타내는 정형화된 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일이 잘못될 때,</span><span class=\"en\"><b>When things go wrong,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 가끔 탓하는데</span><span class=\"en\"><b>we sometimes <span class=\"grammar-hl\">blame others</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실패라는 불쾌한 상황에서 책임 회피를 위해 타인을 공격하는 인간의 흔한 반응을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">blame others (관용표현): &#39;남을 탓하다&#39;라는 의미의 타동사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 문제가 생기다</td></tr><tr><td class=\"w\">blame</td><td class=\"m\">비난하다, ~의 탓으로 돌리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 25 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그건 네 잘못이야와 같은 부정적인 말들은</span><span class=\"en\"><b>negative words like “It’s your fault”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상하게 할 수 있으며</span><span class=\"en\"><b>can <span class=\"grammar-hl\">hurt their feelings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 감정을</span><span class=\"en\"><b>and damage your friendship.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해칠 수 있다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우정을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">하지만 “네 잘못이야”와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비난의 언어가 상대와의 관계를 파괴하고 팀워크를 무너뜨린다는 부작용을 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hurt their feelings (관용표현): &#39;그들의 감정을 상하게 하다&#39;라는 의미의 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 해를 입히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 26 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여주고</span><span class=\"en\"><b>show your support</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지지를</span><span class=\"en\"><b>and <span class=\"grammar-hl\">cheer them up</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">응원하라</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">대신 지지를 보내고 그들을 응원해 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비난 대신 협력을 선택하는 것이 갈등 해결의 핵심임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cheer them up (관용표현): &#39;그들을 기운 나게 하다/응원하다&#39;라는 의미의 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말들은</span><span class=\"en\"><b>Positive words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들 것이다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">make your team develop</span> strong teamwork</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 팀이</span><span class=\"en\"><b>and perform better next time.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강한 팀워크를 기르도록</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 수행하도록</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음번에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 격려의 언어가 팀 전체의 결속력을 다지고 미래의 성과를 이끌어내는 힘이 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make your team develop 5형식(SVOC) 구조: make(사역동사)+O(your team)+OC(동사원형 develop). &#39;팀이 발전하게 만들다&#39;라는 의미의 사역동사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">teamwork</td><td class=\"m\">팀워크, 협동</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해보세요!</span><span class=\"en\"><b>Say It! “You’re a team member <span class=\"grammar-hl\">whom I trust</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">팀원인데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 신뢰하는.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(말해보세요! “너는 내가 신뢰하는 팀원이야.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 팀의 결속을 다지고 미래지향적인 목표를 설정하는 건강한 의사소통 방식입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whom I trust (관계대명사): whom이 목적격 관계대명사로 선행사 a team member를 수식합니다. 관계대명사 뒤에는 trust의 목적어가 빠진 불완전한 절이 이어집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">계속하자</span><span class=\"en\"><b>Let’s <span class=\"grammar-hl\">keep doing our best</span> together,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최선을</span><span class=\"en\"><b>and we’ll win the next game.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께,</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 우리는 이길 것인데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 경기에서.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep doing our best (동명사): keep의 목적어로 쓰여 &#39;최선을 다하는 것을 계속하다&#39;라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결국,</span><span class=\"en\"><b>In the end,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말은 가지고 있는데</span><span class=\"en\"><b>words have the <span class=\"grammar-hl\">power</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘을</span><span class=\"en\"><b><span class=\"grammar-hl\">to change</span> our opinions, actions, and relationships.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바꿀</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 의견, 행동, 그리고 관계를.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">결국, 말은 우리의 의견, 행동, 그리고 관계를 바꿀 수 있는 힘을 가지고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 세 가지 사례(자기 비하, 질투, 비난)를 종합하여 언어가 가진 변화의 힘을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">power to change (to부정사): 앞의 명사 power를 수식하는 형용사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">속상할 때</span><span class=\"en\"><b>When you feel upset about yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 자신에 대해</span><span class=\"en\"><b>or the <span class=\"grammar-hl\">people around you</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 주변 사람들에 대해,</span><span class=\"en\"><b>use positive words.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용하라</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">자신이나 주변 사람들 때문에 기분이 상할 때, 긍정적인 말을 사용하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제 상황을 마주했을 때 구체적으로 어떤 언어 전략을 사용해야 하는지 결론적으로 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people around you (관용표현): &#39;당신 주변의 사람들&#39;이라는 의미를 나타내는 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 32 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 배우고,</span><span class=\"en\"><b>You can <span class=\"grammar-hl\">learn, grow,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성장하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">and understand</span> better.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 이해할 수 있다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여러분은 배우고, 성장하고, 더 잘 이해할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적인 언어 선택이 가져올 최종적인 긍정적 효과들을 나열합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learn, grow, and understand (기본구조): 병렬 구조로 동사들이 나열되어 있으며, 각각 목적어를 가질 수 있는 3형식 기반의 자동사/타동사 활용입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 33</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 말이</span><span class=\"en\"><b>Your words <span class=\"grammar-hl\">shape your world</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형성한다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 세상을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여러분의 말이 여러분의 세상을 만듭니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 언어가 단순히 외부와 소통하는 수단을 넘어, 우리가 사는 환경과 미래를 스스로 창조해 나가는 핵심 요소임을 강조하며 글을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shape your world (기본구조): S+V+O의 3형식 구조로, &#39;당신의 세계를 형성하다&#39;라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 구체화하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>언어는 인간의 생각, 감정, 관계에 직접적인 영향을 미치는 강력한 도구이다.</li><li>스스로를 비하하거나 타인을 비난하는 부정적 언어는 자신의 성장을 저해하고 관계를 망친다.</li><li>반면, 격려와 존중의 긍정적 언어는 실력을 높이고 관계를 발전시키며 문제를 해결하게 한다.</li><li>따라서 어떤 언어를 선택하느냐에 따라 우리의 삶과 세상이 달라질 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Negative language hinders personal progress and damages connections, while positive expressions foster self-improvement and stronger teamwork.</div>\n              <div class=\"lec-final-sum-ko\">부정적인 언어는 개인의 발전을 저해하고 관계를 손상시키는 반면, 긍정적인 표현은 자기 계발과 더 나은 팀워크를 촉진한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],[{"audio":"./full_audio/19.mp3","hl":"main"},{"audio":"./full_audio/20.mp3","hl":"meaning"},{"audio":"./full_audio/21.mp3","hl":"grammar"}],[{"audio":"./full_audio/22.mp3","hl":"main"},{"audio":"./full_audio/23.mp3","hl":"meaning"},{"audio":"./full_audio/24.mp3","hl":"grammar"}],[{"audio":"./full_audio/25.mp3","hl":"main"},{"audio":"./full_audio/26.mp3","hl":"meaning"},{"audio":"./full_audio/27.mp3","hl":"grammar"}],[{"audio":"./full_audio/28.mp3","hl":"main"},{"audio":"./full_audio/29.mp3","hl":"meaning"},{"audio":"./full_audio/30.mp3","hl":"grammar"}],[{"audio":"./full_audio/31.mp3","hl":"main"},{"audio":"./full_audio/32.mp3","hl":"meaning"},{"audio":"./full_audio/33.mp3","hl":"grammar"}],[{"aud
