1xnkcAE8UcrdrJ67abh037ed7/57DgvU9+/vwf8PT6kdw/T/PYd/wDH603emMh14PTI54PQ56568fzo3KcfMBnvuHt6H3HTP6jJZ3Wj+6+3l1sl9wK1279UvnZK39f5jqQgenT9eO2Pyx6cdKAVJIDA4xnBBxngDrjPPQmkyCSuR9cg9fbr68Y7dOaX6ahpfzt+H9MdnOD6+nb/AD09fWj+X6/n/wDW/wAabvTj5l78hl9OM8/09R9F3Jx8yknjqByOOucEfj/jTs+z1203X6h621/y1/XsLjsf8aXk9/wz1Pb9B/TuBTDImeWTnjhl9gDxjv6Aj370u4YPI4I7g8kZHQ+mffPGKLPs++39XDb8/N2/pC/59aOh49Tjp9Qe/f6n+dJ5in+JMf7w4/yR3PGPTIppdcjDL7/MMY/XsOxHUfgWemm+39f1pqCfy8utvP8AUdjv39/88fh+OaOxzyR6ZGev6njp0NJuU9HGOcfMO2c/Xj2x3oDIOAy9/wCIfX1oXnra1/Rb766LSy9dkCt69vLbb7vvF5Ixkjr+fsfTGPc9sHIpDkHP9QBg/Udcgd+voOKA6noy9fUE+vTIOfr/AC5oLqB94HnHUHGeD6/5x7ULddf6Wl/l8h+X9f1oO9Bzgev6/wCe9L0/TGD0/L/PT3zH5icfOozyPmX275/x9vZzMo7jPTqOc9On/wBf2znFK23nsL+vN2trp+Ivftn+np/k0D3Hfntn+fXHekDKRkEen5dfXp39PoaNynjPH1x+PbuO3bHPNP8Ay+7+r/iP+v6/rqLx6Y69Onr/AI8/16ox+ViMcDpn2/P/ADyc0ZXHDKSckfMCOBu9eo7jqOPrS8fMR6E5zxwCMZA57YwyknIB9RNJpt2s079tV+n4iTW6d+2/kvX5v77H/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">From Negative Thoughts to Growth: The Power of Positive Self-Talk<small>부정적 생각에서 성장의 기회로: 긍정적 자기 대화의 힘</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 긍정적인 자기 대화의 힘을 이해하기 위해 자기 자비(Self-Compassion)라는 개념을 알면 좋아요. 이는 마치 친한 친구가 힘든 일을 겪었을 때 따뜻하게 위로해 주는 것처럼, 자기 자신에게도 비판 대신 너그러운 태도를 갖는 것을 의미하죠. 심리학적으로 우리가 자신에게 던지는 부정적인 말은 뇌에 큰 스트레스를 주지만, &#39;성장할 수 있다&#39;는 성장 마인드셋(Growth Mindset)을 가지고 긍정적인 언어를 사용하면 뇌는 실패를 좌절이 아닌 &#39;배움의 기회&#39;로 인식하게 됩니다. 마치 식물에게 좋은 말을 해주면 더 잘 자라는 것처럼, 우리 스스로에게 희망적인 언어를 건네는 습관만으로도 실력을 향상시키고 목표를 끝까지 달성할 수 있는 놀라운 회복 탄력성을 얻게 된답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 상황 인식</div><ul><li>자신의 실수에 대해 부정적으로 생각하는 것은 의욕을 꺾는 원인이 됩니다.</li><li>춤 연습 등에서의 실수에 대한 자책</li><li>부정적 언어(Negative words) 사용의 위험성</li><li>핵심 키워드: 부정적 자기 대화(Negative self-talk)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02대안적 사고 전환</div><ul><li>부정적인 생각 대신 긍정적인 자기 격려를 통해 태도를 바꾸어야 합니다.</li><li>실수에 갇히지 않고 긍정적으로 생각하기(Thinking positively)</li><li>실수를 배움의 기회로 활용</li><li>핵심 키워드: 긍정적 격려(Positive encouragement)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천적 개선</div><ul><li>구체적인 긍정적 문장으로 바꾸어 말함으로써 실력을 향상시킬 수 있습니다.</li><li>현재의 부족함을 인정하되 미래의 발전을 기대하기</li><li>지속적인 연습(Keep practicing) 의지 표명</li><li>핵심 키워드: 자기 확언(Self-affirmation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr><tr><td class=\"w\">feel down</td><td class=\"m\">우울하다, 기분이 가라앉다</td></tr><tr><td class=\"w\">stop trying</td><td class=\"m\">시도를 멈추다, 포기하다</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉진하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">positively</td><td class=\"m\">긍정적으로, 확신을 가지고</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수, 잘못</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">향상시키다, 개선하다</td></tr><tr><td class=\"w\">keep practicing</td><td class=\"m\">계속 연습하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 잘 못했어</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">didn’t</span> do well</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">춤 연습을.</span><span class=\"en\"><b>during dance practice.</b></span></div></div><div class=\"lec-sent-ko\">&quot;나는 춤 연습을 잘 못했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스스로의 실수를 지적하며 자책하는 상황을 제시합니다. 앞부분의 구체적인 실패 경험을 바탕으로 뒤에서 그 태도가 감정에 미치는 영향을 논하기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t (대동사): 앞에 언급된 일반동사 동작을 부정할 때 사용하는 표현이다. 앞의 동사가 일반동사이면 do[does, did]를 쓴다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">난 항상</span><span class=\"en\"><b>I always <span class=\"grammar-hl\">mess up</span>.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">망쳐.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">난 항상 망쳐.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 부정적인 독백이 개인의 심리와 행동에 끼치는 부정적인 결과에 주목합니다. 스스로를 몰아세우는 언어 습관이 결국 발전의 동력을 꺾는다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mess up (관용표현): &#39;실수하다&#39; 또는 &#39;일을 망치다&#39;라는 의미를 가진 구동사(Phrasal verb)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부정적인 말은</span><span class=\"en\"><b>Negative words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“난 항상 망쳐”와 같은</span><span class=\"en\"><b>like “I always mess up”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기분을 우울하게 하고</span><span class=\"en\"><b><span class=\"grammar-hl\">can make you feel down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시도하는 걸 멈추고 싶게 만들 수 있습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and want to stop trying</span>.</b></span></div></div><div class=\"lec-sent-ko\">“난 항상 망쳐”와 같은 부정적인 말은 기분을 우울하게 하고 시도하는 걸 멈추고 싶게 만들 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 부정적인 독백이 개인의 심리와 행동에 끼치는 부정적인 결과에 주목합니다. 스스로를 몰아세우는 언어 습관이 결국 발전의 동력을 꺾는다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can make you feel down and want to stop trying 5형식(SVOC) 구조: make(사역동사) + O(you) + OC(feel / want) 형태이다. 목적격보어로 동사원형 feel과 want가 병렬로 연결되어, 목적어가 어떤 상태를 느끼거나 어떤 행동을 하고 싶게 만드는 구조를 이룬다.</div><div class=\"lec-gr-item\">to stop trying (to부정사): stop의 목적어 역할을 하는 명사적 용법의 to부정사구이다.</div><div class=\"lec-gr-item\">trying (동명사): stop의 목적어인 to부정사와 의미적으로 긴밀하게 연결되어, &#39;시도하는 것을 멈추다&#39;라는 의미의 행위를 나타내는 동명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 실수하다</td></tr><tr><td class=\"w\">feel down</td><td class=\"m\">우울하다, 기분이 가라앉다</td></tr><tr><td class=\"w\">stop trying</td><td class=\"m\">시도를 멈추다, 포기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 격려해 보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">encourage</span> yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 말로.</span><span class=\"en\"><b>with positive words.</b></span></div></div><div class=\"lec-sent-ko\">대신 긍정적인 말로 자신을 격려해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 문제 상황을 해결하기 위한 대안을 제시합니다. 자신의 태도를 변화시키기 위해 언어의 방향을 부정에서 긍정으로 바꾸어야 한다는 제안입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">encourage (관용표현): &#39;스스로를 격려하다&#39;라는 의미로 encourage oneself 형태가 사용되어 주어의 행동이 자신에게로 향함을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉진하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 사고를 할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you think positively</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실수에서 배우고</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">learn from your mistakes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실력을 향상할 수 있습니다.</span><span class=\"en\"><b>and improve your skills.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 사고를 할 때, 실수에서 배우고 실력을 향상할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적인 언어 습관을 가졌을 때 얻게 되는 구체적인 이점을 설명합니다. 실수를 실패로만 보지 않고 성장의 발판으로 삼는 사고의 전환이 실력 향상으로 이어진다는 인과관계를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you think positively (분사구문(축약절)): 접속사 when을 포함한 부사절로, 주어 you가 특정 상태(think positively)일 때 일어나는 상황을 설명한다.</div><div class=\"lec-gr-item\">learn from your mistakes (관용표현): &#39;실수로부터 배우다&#39;라는 의미를 나타내는 구문이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">positively</td><td class=\"m\">긍정적으로, 확신을 가지고</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수, 잘못</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">향상시키다, 개선하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말해 보세요!</span><span class=\"en\"><b>Say It!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“이번에는 춤을 잘 못 췄지만,</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">didn’t</span> dance well this time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속 연습해서</span><span class=\"en\"><b>but I’ll <span class=\"grammar-hl\">keep practicing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘할 거야.”</span><span class=\"en\"><b>and <span class=\"grammar-hl\">get better</span>.”</b></span></div></div><div class=\"lec-sent-ko\">(말해 보세요! “이번에는 춤을 잘 못 췄지만, 계속 연습해서 더 잘할 거야.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 긍정적 사고방식을 실생활에서 바로 적용할 수 있는 구체적인 행동 지침을 제공합니다. 앞의 이론적 제안을 현실적인 대화법으로 실천하는 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t (대동사): 앞에서 언급된 일반동사의 동작을 부정하기 위해 사용되었다. 앞의 동사가 일반동사이면 do[does, did]를 쓴다.</div><div class=\"lec-gr-item\">keep practicing (동명사): keep + -ing 구조로, &#39;계속해서 ~하다&#39;라는 의미를 나타내며, practicing은 동작을 지속하는 상태를 나타내는 동명사이다.</div><div class=\"lec-gr-item\">get better (관용표현): 상태 변화를 나타내는 get + 형용사 구조로, &#39;더 나아지다&#39; 또는 &#39;향상되다&#39;라는 의미이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep practicing</td><td class=\"m\">계속 연습하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스스로의 실수에 부정적인 말을 내뱉으면 의욕이 꺾이고 포기하게 된다.</li><li>부정적인 태도 대신 긍정적인 말로 스스로를 격려하는 것이 중요하다.</li><li>긍정적인 생각은 실수를 배움의 기회로 바꾸고 실력을 향상하게 돕는다.</li><li>실패를 인정하되 더 나아질 것임을 다짐하는 말하기 방식이 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Negative self-talk hinders progress, but positive encouragement allows individuals to learn from their mistakes and achieve improvement.</div>\n              <div class=\"lec-final-sum-ko\">부정적인 자기 대화는 발전을 저해하지만, 긍정적인 격려는 실수를 통해 배우고 개선을 이룰 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2
