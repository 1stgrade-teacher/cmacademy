<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 시사(김) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 8과 본문1","audioDir":"1_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Mystery of the Missing Diamond\u003c/h1>\u003ch2>사라진 다이아몬드의 미스터리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 부유한 노부인 Frigga의 성에서 \u003cb class=\"key\">다이아몬드\u003c/b>가 사라지는 \u003cb class=\"key\">사건\u003c/b>이 발생하여, 최고 탐정인 내가 \u003cb class=\"key\">단서\u003c/b>를 찾아 나선다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A detective investigates the case of a missing diamond in a castle.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 영어 독해 지문 속 흥미진진한 탐정 이야기를 함께 공부해 볼 거예요. 부유한 노부인의 성에서 다이아몬드가 사라지는 사건이 발생하고 탐정이 이를 해결하는 내용을 다루고 있답니다. 전체 글의 요약과 요지를 머릿속에 떠올리며 첫 번째 문장부터 차근차근 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시)\u003c/div>","segs":[{"n":2,"text":"배경지식 설명 부분입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>배경 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>큰 성에 사는 부유한 \u003cb class=\"key\">노부인\u003c/b> Frigga가 거대한 \u003cb class=\"key\">다이아몬드\u003c/b>를 금고에 보관하고 있는 \u003cb class=\"key\">상황\u003c/b>을 제시하며 \u003cb class=\"key\">이야기\u003c/b>를 시작한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사건 발생\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>어느 날 Frigga가 나에게 \u003cb class=\"key\">전화\u003c/b>를 걸어 다이아몬드가 \u003cb class=\"key\">사라졌다\u003c/b>며 \u003cb class=\"key\">미스터리\u003c/b>를 해결해 달라고 \u003cb class=\"key\">요청\u003c/b>한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>현장 조사\u003csmall>근거 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>나는 그녀의 집으로 \u003cb class=\"key\">달려가\u003c/b> 방을 \u003cb class=\"key\">조사\u003c/b>한 뒤, 부러진 \u003cb class=\"key\">손톱\u003c/b>과 비누 \u003cb class=\"key\">냄새\u003c/b> 및 \u003cb class=\"key\">발자국\u003c/b> 같은 \u003cb class=\"key\">단서\u003c/b>를 빠르게 찾아낸다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 배경 소개부터 사건 발생, 현장 조사까지 시간의 흐름에 따라 자연스럽게 전개돼요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 커다란 성에 사는 부유한 노부인 Frigga가 금고에 거대한 다이아몬드를 보관하고 있다는 배경 상황을 소개해 주고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 어느 날 Frigga가 나에게 전화를 걸어 다이아몬드가 사라졌으니 미스터리를 해결해 달라고 간곡히 부탁하는 사건이 일어난답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 내가 그녀의 집으로 곧바로 달려가 방을 살펴보고 부러진 손톱과 비누 냄새 그리고 더러운 발자국 같은 단서들을 빠르게 찾아내며 마무리돼요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 부유한 \u003cb class=\"key\">노부인\u003c/b>의 성에서 시작된 \u003cb class=\"key\">사건\u003c/b>이 \u003cb class=\"key\">전화\u003c/b>를 통해 주인공에게 \u003cb class=\"key\">전달\u003c/b>되고, 현장 \u003cb class=\"key\">조사\u003c/b>를 거쳐 \u003cb class=\"key\">단서\u003c/b>를 발견하는 \u003cb class=\"key\">시간순\u003c/b>으로 전개된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (3)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>When (7)\u003c/b>\u003cspan>시간 조건\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">rich old lady\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Frigga\u003c/span>\u class=\"ko\">큰 성에\u003c/span>\u003cspan class=\"en\">in a big castle.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Frigga라는 부유한 노부인이 큰 성에 살고 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경과 주인공을 소개하는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 과거의 일을 생생하게 전달하기 위해 \u003cb class=\"key\">과거시제\u003c/b>를 사용해 사건이 시작되는 공간과 인물을 묘사하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사 + [named (과거분사구)] + 수식어 : \"Frigga라는\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"A rich old lady, 부유한 노부인이. named Frigga, Frigga라는. lived, 살고 있었어요. in a big castle, 큰 성에. 이 문장 전체를 해석하면, Frigga라는 부유한 노부인이 큰 성에 살고 있었어요.","hl":"m"},{"n":12,"text":"첫 번째 문장이에요. 이야기의 배경과 주인공을 소개하는 문장인데 부유한 노부인이 큰 성에 살고 있었다는 걸 과거시제로 차근차근 설명해 주고 있어요.","hl":"mn"},{"n":13,"text":"어법 포인트를 짚어볼게요. 첫 번째로 명사 바로 뒤에 나오는 과거분사구인 named Frigga를 눈여겨봐야 해요. 이 표현은 앞에 있는 부유한 노부인을 뒤에서 꾸며주면서 Frigga라는 이름을 가진 사람이라는 걸 자연스럽게 설명해 주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 보관하고 있었죠\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 다이아몬드를\u003c/span>\u003cspan class=\"en\">her giant diamond\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금고에\u003c/span>\u003cspan class=\"en\">in a safe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 거대한 다이아몬드를 금고에 보관하고 있었죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사건의 핵심 소재인 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">다이아몬드\u003c/b>가 어디에 있었는지를 알려주는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 앞으로 벌어질 사건의 중요한 배경이 되는 보물의 위치를 독자에게 미리 알려주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : 주어 + [kept (과거동사)] + 목적어 + 전치사구 : \"보관하고 있었죠\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"She kept, 그녀는 보관하고 있었죠. her giant diamond, 거대한 다이아몬드를. in a safe, 금고에. 이 문장 전체를 해석하면, 그녀는 거대한 다이아몬드를 금고에 보관하고 있었죠.","hl":"m"},{"n":15,"text":"두 번째 문장이에요. 사건의 핵심 소재인 거대한 다이아몬드가 금고에 보관되어 있었다는 사실을 알려주면서 앞으로 벌어질 미스터리의 복선을 깔아주고 있어요.","hl":"mn"},{"n":16,"text":"어법 포인트를 살펴볼게요. 첫 번째로 문장의 동사인 kept를 주의 깊게 봐야 해요. 과거에 계속해서 보관하고 있던 상태를 나타내기 위해서 keep의 과거동사 형태를 사용해 문장을 이끌어가고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 나에게 전화를 걸어\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Lily Holmes,\u003c/span>\u003cspan class=\"en\">&quot;Lily Holmes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 다이아몬드가 없어졌어요!\u003c/span>\u003cspan class=\"en\">my diamond \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">missing\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 그녀가 나에게 전화를 걸어 말했어요. “Lily Holmes, 내 다이아몬드가 없어졌어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 평화로운 일상에 \u003cb class=\"key\">사건이 \u003c/b>\u003cb class=\"key\">발생\u003c/b>했음을 알리는 중요한 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 주인공 탐정에게 직접 연락하여 다이아몬드가 사라졌다는 다급한 상황을 전달하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬구조\u003c/span> : 주어 + [called (과거동사)] + 목적어 + and + [said (과거동사)] : \"전화를 걸어 말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법\u003c/span> : 주어 + be동사 + [missing (현재분사/형용사)] : \"없어진\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"One day, 어느 날. she called me, 그가 나에게 전화를 걸어. and said, 말했어요. \"Lily Holmes, Lily Holmes. my diamond is missing!, 내 다이아몬드가 없어졌어요!. 이 문장 전체를 해석하면, 어느 날, 그녀가 나에게 전화를 걸어 말했어요. “Lily Holmes, 내 다이아몬드가 없어졌어요!","hl":"m"},{"n":18,"text":"세 번째 문장이에요. 평화롭던 일상에 갑자기 사건이 일어났음을 알려주는 문장으로 탐정에게 연락해 다이아몬드가 사라졌다고 다급하게 말하는 장면이에요.","hl":"mn"},{"n":19,"text":"어법 포인트를 짚어볼게요. 첫 번째로 and를 중심으로 called와 said가 나란히 연결된 병렬구조를 볼 수 있어요. 두 번째로 is missing에서 missing은 현재분사 형태로 물건이 사라진 상태를 나타내고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제발\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Please \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">와서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">come \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해결해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">solve\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줘요\u003c/span>\u003cspan class=\"en\">this mystery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">와서 이 미스터리를 해결해 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부유한 노부인 Frigga가 \u003cb class=\"key\">탐정\u003c/b>인 주인공에게 다이아몬드가 사라진 \u003cb class=\"key\">사건\u003c/b>을 해결해 달라고 직접적으로 요청하는 대사입니다. 동사원형으로 시작하는 명령문을 통해 \u003cb class=\"key\">간절함\u003c/b>과 다급한 상황을 생생하게 전달하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문과 동사구 병렬\u003c/span> : Please + [동사원형1] + and + [동사원형2] : \"와서 ~해 주세요\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Please, 제발. come, 와서. and, 그리고. solve, 해결해. this mystery, 줘요. 이 문장 전체를 해석하면, 와서 이 미스터리를 해결해 줘요.","hl":"m"},{"n":21,"text":"이번 문장은 Frigga가 탐정인 나에게 다이아몬드를 찾아 달라고 간절하게 부탁하는 장면이에요. 동사원형으로 시작하는 명령문을 써서 사건의 다급함을 강조하고 있어요.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 명령문과 동사구 병렬이에요. 주어를 따로 쓰지 않고 동사원형인 come으로 시작해서 Please를 붙여 공손한 요청을 만들었죠. 그리고 and 뒤에도 동사원형인 solve를 써서 와서 해결해 달라는 두 가지 동작을 나란히 연결했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You're\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을 최고의 탐정이\u003c/span>\u003cspan class=\"en\">the best detective\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잖아요\u003c/span>\u003cspan class=\"en\">in town!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 마을 최고의 탐정이잖아요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공에게 사건 해결을 부탁하며 그가 마을에서 가장 유능한 \u003cb class=\"key\">탐정\u003c/b>이라는 점을 치켜세우는 대사입니다. 상대방을 \u003cb class=\"key\">칭찬\u003c/b>하며 사건을 꼭 해결해 달라는 강한 \u003cb class=\"key\">기대감\u003c/b>을 드러내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 축약형\u003c/span> : You + are의 축약형 [You're] : \"당신은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"You're, 당신은. the best detective, 마을 최고의 탐정이. in town!, 잖아요. 이 문장 전체를 해석하면, 당신은 마을 최고의 탐정이잖아요!","hl":"m"},{"n":24,"text":"이 문장은 Frigga가 주인공을 칭찬하면서 왜 이 사건을 맡아 달라고 하는지 이유를 덧붙이는 대사예요. 마을에서 제일 뛰어난 탐정이니까 내 사건도 잘 해결해 줄 거라는 믿음을 표현하고 있죠.","hl":"mn"},{"n":25,"text":"어법 포인트는 be동사 축약형이에요. 주어 You 뒤에 are를 그대로 쓰는 대신 You're로 줄여서 말했어요. 회화에서 이렇게 줄임말을 쓰면 훨씬 자연스럽고 친근한 느낌을 줄 수 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ran\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 집으로 달려갔어요\u003c/span>\u003cspan class=\"en\">to her house.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그녀의 집으로 달려갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부인의 다급한 전화를 받은 주인공이 곧바로 행동에 옮겨 사건 현장인 \u003cb class=\"key\">집\u003c/b>으로 빠르게 이동하는 상황을 보여줍니다. 이야기의 \u003cb class=\"key\">전개 \u003c/b>\u003cb class=\"key\">속도\u003c/b>를 높이고 긴장감을 더해주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 과거 동사\u003c/span> : run [현재] -&gt; ran [과거] : \"달려갔다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"I ran, 나는. to her house, 그녀의 집으로 달려갔어요. 이 문장 전체를 해석하면, 나는 그녀의 집으로 달려갔어요.","hl":"m"},{"n":27,"text":"이번 문장은 의뢰를 받은 주인공이 곧바로 사건 현장으로 출동하는 모습을 담고 있어요. 다급한 전화 한 통에 바로 움직이는 탐정의 발빠른 행동력을 보여주는 대목이죠.","hl" gga가 자신의 방으로 안내하며 본격적인 수사가 시작되는 상황을 보여 주는 문장이에요. 시간 접속사 when이 이끄는 절과 주절이 자연스럽게 이어지고 있어요.","hl":"mn"},{"n":31,"text":"첫 번째 어법 포인트는 시간의 접속사 when이에요. 어떤 일이 일어난 시간을 나타낼 때 쓰는 접속사로 여기서는 내가 도착한 시점을 나타내고 있어요. 두 번째 어법 포인트는 수요동사 show예요. show는 ~에게 …을 보여 주다라는 의미로 간접목적어와 직접목적어를 차례로 취하는 4형식 동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 빠르게\u003c/span>\u003cspan class=\"en\">I quickly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 단서를 찾고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> some clues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메모를 했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> made a note.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 빠르게 몇 가지 단서를 찾고 메모를 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 방에 도착한 탐정인 내가 뛰어난 관찰력으로 \u003cb class=\"key\">단서\u003c/b>를 빠르게 발견하고 기록하는 모습을 나타내고 있어요. \u003cb class=\"key\">등위접속사\u003c/b> and를 사용해 두 개의 동사구를 매끄럽게 연결하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : [주어] + [동사의 과거형] : \"찾았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : [동사구1] + [and] + [동사구2] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"I quickly, 나는 빠르게. found some clues, 몇 가지 단서를 찾고. and made a note, 메모를 했어요.. 이 문장 전체를 해석하면, 나는 빠르게 몇 가지 단서를 찾고 메모를 했어요.","hl":"m"},{"n":33,"text":"방에 도착한 탐정인 내가 뛰어난 관찰력으로 단서를 빠르게 발견하고 기록하는 모습을 나타내고 있어요. 등위접속사 and를 사용해 두 개의 동사구를 매끄럽게 연결하고 있어요.","hl":"mn"},{"n":34,"text":"첫 번째 어법 포인트는 동사의 과거형 이에요. 과거에 일어난 일을 설명하기 위해 과거 시제 동사 찾다의 과거형인
