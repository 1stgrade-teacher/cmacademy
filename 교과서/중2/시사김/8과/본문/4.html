</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 시사(김) 8과 본문4","audioDir":"4_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>시사(김)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Investigation of the Incident at Frigga's House\u003c/h1>\u003ch2>Frigga의 집에서 벌어진 사건 조사\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Frigga의 집에서 일어난 \u003cb class=\"key\">사건\u003c/b>을 해결하기 위해 \u003cb class=\"key\">증언\u003c/b>을 모으는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Witness statements are gathered to investigate the unexpected incident at Frigga's house.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간에는 Frigga의 집에서 벌어진 사건과 관련된 이야기를 함께 살펴볼게요. 사촌인 John이 집에 오게 된 배경부터 당시의 상황까지 차근차근 알아보도록 하죠. 전체 글의 요약과 요지를 머릿속에 떠올리며 집중해 주세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 마치 집에서 열쇠를 잃어버렸을 때 \u003cb class=\"key\">탐정\u003c/b>이 \u003cb class=\"key\">단서\u003c/b>를 모으는 것처럼 사건의 진실을 밝히기 위해 사람들의 \u003cb class=\"key\">증언 \u003c/b>\u003cb class=\"key\">testimony\u003c/b>을 교차 검증하는 과정이 필요합니다. 이러한 \u003cb class=\"key\">조사 \u003c/b>\u003cb class=\"key\">investigation\u003c/b> 과정에서는 각 인물의 \u003cb class=\"key\">알리바이 \u003c/b>\u003cb class=\"key\">alibi\u003c/b>와 행동 패턴을 꼼꼼히 분석하는 것이 중요합니다.)\u003c/div>","segs":[{"n":2,"text":"본격적인 지문 독해에 앞서 배경지식을 먼저 정리해 볼게요. 마치 집에서 물건을 잃어버렸을 때 탐정이 단서를 모으는 것처럼 사건의 진실을 밝히기 위해 사람들의 증언을 교차 검증하는 과정이 필요해요. 이러한 조사 과정에서는 각 인물의 알리바이와 행동 패턴을 꼼꼼히 분석하는 것이 중요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사촌의 전입\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>Frigga의 사촌인 John은 작년에 직장과 집을 잃은 후 Frigga의 집으로 이사했습니다. 이 문장은 사건의 배경이 되는 인물의 \u003cb class=\"key\">소개\u003c/b>와 거주 \u003cb class=\"key\">이동\u003c/b> 과정을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인물의 차림새\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>그는 남성용 신발을 신고 있었는데, 이는 그의 \u003cb class=\"key\">차림새\u003c/b>와 관련된 구체적인 \u003cb class=\"key\">특징\u003c/b>을 나타냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>방에서의 행동과 왕래\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>John은 오후 내내 방에서 책을 읽었지만 매시간 비누로 손을 씻느라 화장실을 계속 왔다 갔다 했습니다. 그럴 때마다 거실에서 일하는 Jessica를 보게 되는 \u003cb class=\"key\">상황\u003c/b>이 반복되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>비명과 목격\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>Frigga의 비명소리를 듣고 그녀의 방으로 달려갔을 때, 창문이 열려 있고 Frigga가 겁먹은 표정으로 있는 것을 \u003cb class=\"key\">발견\u003c/b>했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 John이 집에 살게 된 순간부터 사건을 목격하기까지의 흐름으로 이루어져 있어요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 Frigga의 사촌인 John이 직장과 집을 잃은 뒤 집으로 이사 온 소개를 다루고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그가 남성용 신발을 신고 있었다는 차림새의 특징을 보여 주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 오후 내내 방에서 책을 읽으면서 비누로 손을 씻기 위해 화장실을 왔다 갔다 하다가 거실의 Jessica를 보게 되는 상황이 반복돼요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 비명 소리를 듣고 달려가 열린 창문과 겁먹은 Frigga를 발견하는 장면으로 마무리돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 John이 집에 살게 된 배경부터 시작하여 사건 당시의 행동과 목격한 \u003cb class=\"key\">상황\u003c/b>을 시간 순서대로 전개하고 있습니다. 인물의 \u003cb class=\"key\">행동\u003c/b>과 주변 상황을 차례대로 나열하며 마지막에 결정적인 \u003cb class=\"key\">장면\u003c/b>을 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>역접\u003c/span>\u003cb>Each time (5)\u003c/b>\u003cspan>반복\u003c/span>\u003cb>When (6)\u003c/b>\u003cspan>시간\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">John\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cousin\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식 면에서 사건이 일어난 시간순에 따라 내용을 서술하고 있어요. 인물의 행동과 주변 상황을 차례대로 나열하며 마지막에 결정적인 장면을 보여 주는 미괄식 구조를 취하고 있답니다.","hl":"ty"},{"n":9,"text":"문장 사이를 이어 주는 신호어들도 잘 살펴봐야 해요. 네 번째 문장의 But은 앞뒤 내용을 뒤집는 역접의 역할을 하고 다섯 번째 문장의 Each time은 반복되는 상황을 나타내며 여섯 번째 문장의 When은 시간을 가리키는 표현으로 글의 흐름을 매끄럽게 만들어 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>cousin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사촌\u003c/span>\u003c/div>\u003cdiv>\u003cb>move into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>job\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직장\u003c/span>\u003c/div>\u003cdiv>\u003cb>home\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입다, 신고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>men's\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>남성용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>shoe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신발\u003c/span>\u003c/div>\u003cdiv>\u003cb>read\u003c/b>\u003cem>동사\u003c/em>\u003cspan>읽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>room\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방\u003c/span>\u003c/div>\u003cdiv>\u003cb>after 3c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">soil\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scream\u003c/b>\u003cspan class=\"m\">비명을 지르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shout\u003c/span>\u003cspan class=\"s\">yell\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">whisper\u003c/span>\u003cspan class=\"a\">mute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">open\u003c/b>\u003cspan class=\"m\">열린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unlocked\u003c/span>\u003cspan class=\"s\">ajar\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">closed\u003c/span>\u003cspan class=\"a\">shut\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">afraid\u003c/b>\u003cspan class=\"m\">겁먹은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scared\u003c/span>\u003cspan class=\"s\">frightened\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 핵심 어휘들의 동의어와 반의어도 함께 정리해 둘게요. lose의 동의어로는 mislay가 있고 반의어로는 find가 있어요. wash는 clean과 비슷하고 open은 closed와 반대되는 뜻이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Frigga의 사촌인 John은\u003c/span>\u003cspan class=\"en\">John, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Frigga's\u003c/span> cousin,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작년에 그녀의 집으로 이사했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moved \u003c/span>\u003cspan class=\"tgt\">into\u003c/span> her house last year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직장과 집을 잃은 후\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">lost \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Frigga의 사촌인 John은 작년에 직장과 집을 잃은 후 Frigga의 집으로 이사했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사건의 \u003cb class=\"key\">배경\u003c/b>을 소개하는 도입부로, John이 왜 Frigga의 집에 머물게 되었는지 \u003cb class=\"key\">이유\u003c/b>를 설명해요. 주어와 동사 사이에 동격의 콤마가 쓰여 \u003cb class=\"key\">인물 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 명확히 보여주는 핵심 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 명사\u003c/span> : 명사 + 's + 명사 : \"Frigga의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어동사 (구동사)\u003c/span> : 동사 + 전치사 : \"~로 이사하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간·접속사절\u003c/span> : after + 주어 + 동사 : \"그가 직장과 집을 잃은 후에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"John, Frigga's cousin, Frigga의 사촌인 John은. moved into her house last year, 작년에 그녀의 집으로 이사했어요. after he lost his job and home, 직장과 집을 잃은 후. 이 문장 전체를 해석하면, Frigga의 사촌인 John은 작년에 직장과 집을 잃은 후 Frigga의 집으로 이사했어요.","hl":"m"},{"n":13,"text":"첫 번째 문장은 John이 왜 Frigga의 집에 오게 되었는지 배경을 설명하는 문장이에요. 직장과 집을 잃고 난 뒤에 이사 온 상황을 잘 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서 첫 번째 어법 포인트는 Frigga's예요. 사람 이름 뒤에 apostrophe s를 붙여서 소유격을 만들고 있죠. 두 번째 어법 포인트는 after he lost his job and home에서 쓰인 접속사 after예요. 어떤 일 이후인지를 나타내는 시간을 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 신고 있었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">wearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남성용 신발을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">men's\u003c/span> shoes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 남성용 신발을 신고 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 John이 당시 의외의 물건을 가지고 있었음을 보여주는 \u003cb class=\"key\">단서\u003c/b>예요. 이후 사건의 \u003cb class=\"key\">미스터리\u003c/b>를 풀어가는 중요한 열쇠가 되는 묘사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(was) + 동사-ing : \"입고[신고] 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복수 명사의 소유격\u003c/span> : 복수명사(men) + 's : \"남성용의\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He was wearing, 그는 신고 있었어요. men's shoes, 남성용 신발을. 이 문장 전체를 해석하면, 그는 남성용 신발을 신고 있었어요.","hl":"m"},{"n":16,"text":"두 번째 문장은 John이 남성용 신발을 신고 있었다는 독특한 상황을 보여줘요. 이 신발이 앞으로 어떤 사건과 관련이 있을지 추리해 볼 수 있는 단서가 되죠.","hl":"mn"},{"n":17,"text":"두 번째 문장의 첫 번째 어법 포인트는 was wearing이에요. 과거진행형을 써서 그때 무언가를 입거나 신고 있던 진행 중인 상황을 강조하고 있어요. 두 번째는 men's라는 복수 소유격 형태도 눈여겨봐야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 읽었어요\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">read\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책을\u003c/span>\u003cspan class=\"en\">books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"
