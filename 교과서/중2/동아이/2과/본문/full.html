g4OM9MYP8xg/pz1DS1XqvnqYq6srO9r2s/s27Jd1230R//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Family Puzzle: Finding Unity and What Truly Matters<small>가족 퍼즐: 화합과 진정한 가치 찾기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 문제 해결 과정에서 개별적인 사고보다 집단이 힘을 합쳤을 때 더 큰 성과를 낼 수 있다는 협동(Cooperation)의 중요성을 다루고 있어요. 흔히 ‘백지장도 맞들면 낫다’는 말처럼, 서로의 아이디어를 보태어 시너지를 내는 집단 지성(Collective Intelligence)이 어떻게 창의적인 해결책을 이끌어내는지를 보여주죠. 특히 이번 이야기처럼 기존의 고정관념에서 벗어나 사물을 다각도로 바라보는 발상의 전환(Lateral Thinking)은 복잡한 난제를 풀 때 매우 유용한 사고 기법이랍니다. 단순히 물건으로 방을 채우려던 시도가 빛이라는 추상적인 개념으로 확장된 것처럼, 문제를 바라보는 관점을 바꾸는 것만으로도 해결의 실마리를 찾을 수 있다는 점을 기억하면 지문을 훨씬 깊이 있게 이해하실 수 있을 거예요. 마지막으로, 구성원 간의 소통과 화합은 공동체의 문제를 해결하는 가장 든든한 근간(Foundation)이 된다는 점도 함께 생각해보면 좋겠네요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과제의 부여</div><ul><li>소원해진 세 남매에게 부모님은 방을 가득 채우라는 미션을 제시한다.</li><li>가족의 소원해짐 (grew apart)</li><li>미션: 은화 세 개로 방을 가득 채워라 (fill the room)</li><li>협동의 필요성 강조 (work together)</li><li>핵심 키워드: 화합(unity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시행착오와 독단적 행동</div><ul><li>남매들은 각자의 방식으로 방을 채우려 하지만 번번이 실패한다.</li><li>패트릭의 독단적인 깃털 구매 (feathers)</li><li>남매들의 의견 조율과 지푸라기 구매 (straw)</li><li>물리적인 물체로는 방을 채우기 부족함</li><li>핵심 키워드: 시행착오(trial and error)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03관점의 전환과 성공</div><ul><li>남매들은 발상을 전환하여 물리적인 물건 대신 빛을 선택한다.</li><li>물리적 대상에서 추상적 대상으로의 발상 전환 (think differently)</li><li>촛불을 활용하여 방 전체를 빛으로 채움 (candlelight)</li><li>숨겨져 있던 어린 시절의 벽화를 발견함</li><li>핵심 키워드: 발상의 전환(change of perspective)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04깨달음과 보상</div><ul><li>남매들은 함께 퍼즐을 풀며 가족의 소중함을 다시 확인한다.</li><li>가족애의 재확인 (family bond)</li><li>가장 큰 보상은 바로 가족임을 깨달음 (greatest reward)</li><li>갈등 해소와 관계 회복</li><li>핵심 키워드: 가족애(family love)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow apart</td><td class=\"m\">사이가 멀어지다, 소원해지다</td></tr><tr><td class=\"w\">fill with</td><td class=\"m\">~으로 채우다, ~으로 가득 차게 하다</td></tr><tr><td class=\"w\">do one&#39;s best</td><td class=\"m\">최선을 다하다</td></tr><tr><td class=\"w\">figure out</td><td class=\"m\">해결하다, 이해하다, 알아내다</td></tr><tr><td class=\"w\">three heads are better than one</td><td class=\"m\">백지장도 맞들면 낫다, 여럿이 함께하면 더 낫다</td></tr><tr><td class=\"w\">act on one&#39;s own</td><td class=\"m\">독단적으로 행동하다, 혼자 결정하다</td></tr><tr><td class=\"w\">take up</td><td class=\"m\">(공간·시간을) 차지하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">play it safe</td><td class=\"m\">위험을 피하다, 신중을 기하다</td></tr><tr><td class=\"w\">bundle</td><td class=\"m\">다발, 묶음</td></tr><tr><td class=\"w\">leak out</td><td class=\"m\">(액체 등이) 새어 나오다, (비밀이) 알려지다</td></tr><tr><td class=\"w\">after all</td><td class=\"m\">결국, 어쨌든, 놀랍게도</td></tr><tr><td class=\"w\">light</td><td class=\"m\">불을 붙이다, 비추다</td></tr><tr><td class=\"w\">solve</td><td class=\"m\">해결하다, 풀다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가족 퍼즐</span><span class=\"en\"><b><span class=\"grammar-hl\">The Family Puzzle</span></b></span></div></div><div class=\"lec-sent-ko\">(가족 퍼즐)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경을 설정합니다. 화목했던 과거의 한 가족을 도입하여 이후 그들이 겪을 변화와 갈등의 출발점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Family Puzzle 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">옛날에 있었습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">There once was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑스러운 가족이</span><span class=\"en\"><b>a lovely family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 자녀를 둔</span><span class=\"en\"><b>with three children.</b></span></div></div><div class=\"lec-sent-ko\">옛날에 세 아이가 있는 사랑스러운 가족이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경을 설정합니다. 화목했던 과거의 한 가족을 도입하여 이후 그들이 겪을 변화와 갈등의 출발점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There once was (도치): 유도부사 There가 문두에 올 때, 주어(a lovely family)와 동사(was)의 위치가 바뀌는 도치 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 아이들은</span><span class=\"en\"><b><span class=\"grammar-hl\">The children</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 사이가 좋았습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">were very close.</span></b></span></div></div><div class=\"lec-sent-ko\">아이들은 매우 가까웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 가족 구성원들이 과거에 얼마나 친밀했는지를 구체적으로 묘사하여, 뒤이어 나올 소원해진 관계와의 대조를 준비합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The children were very close. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들이 나이가 들면서,</span><span class=\"en\"><b>But <span class=\"grammar-hl\">as they got older</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 서서히 멀어졌습니다.</span><span class=\"en\"><b>they slowly grew apart.</b></span></div></div><div class=\"lec-sent-ko\">하지만 나이가 들면서, 그들은 서서히 사이가 멀어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름에 따라 가족 관계가 변화했음을 알립니다. 친밀했던 과거와 달리 지금은 소통이 단절된 현재의 문제 상황을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as they got older (관계부사): 문맥상 시간의 흐름을 나타내는 접속사 as(~할 때)로, 주어(they)+동사(got)가 갖춰진 절을 이끈다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b><span class=\"grammar-hl\">One day,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부모님은</span><span class=\"en\"><b><span class=\"grammar-hl\">the parents</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들을 불러 모았습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">called the</span> children together.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 부모님이 아이들을 함께 불렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족 관계의 변화를 감지한 부모가 이를 해결하기 위해 개입하는 장면입니다. 5. “Do you remember this room? You used to play here. It was always filled with happiness,” said the father. 부모가 과거의 행복한 기억을 환기하며 아이들에게 가족의 의미를 다시 생각해보도록 유도하는 발화입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">One day, the parents called the 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“이 방을 기억하니?</span><span class=\"en\"><b>“Do you remember this room?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희들은 여기서 놀곤 했지.</span><span class=\"en\"><b>You <span class=\"grammar-hl\">used to play</span> here.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이곳은 항상 행복으로 가득 차 있었단다,”</span><span class=\"en\"><b>It <span class=\"grammar-hl\">was always filled with</span> happiness,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아버지께서 말씀하셨습니다.</span><span class=\"en\"><b>said the father.</b></span></div></div><div class=\"lec-sent-ko\">(아버지께서 말씀하셨습니다. “이 방을 기억하니? 너희들은 여기서 놀곤 했지. 이곳은 항상 행복으로 가득 차 있었단다.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 아버지가 추억을 공유한 것에 이어, 어머니는 현재 단절된 가족 간의 소통 문제를 직설적으로 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used to play (관용표현): &#39;과거에는 ~하곤 했다&#39;라는 의미로, 과거의 습관이나 상태를 나타내는 조동사적 표현이다.</div><div class=\"lec-gr-item\">was always filled with (수동태): be동사(was)+p.p.(filled) 구조. fill은 타동사로 &#39;fill A with B(A를 B로 채우다)&#39;라는 기본 구조를 가지는데, 목적어가 주어로 올라가면서 수동태가 된 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어머니께서 이어서 말씀하셨습니다,</span><span class=\"en\"><b><span class=\"grammar-hl\">The mother continued, “</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“하지만 지금은,</span><span class=\"en\"><b><span class=\"grammar-hl\">“But now,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희들은 서로 말조차 하지 않는구나.</span><span class=\"en\"><b>you don’t even talk to each other.</b></span></div></div><div class=\"lec-sent-ko\">어머니가 이어 말했다, “하지만 이제, 너희는 서로 대화조차 하지 않는구나.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 아버지가 추억을 공유한 것에 이어, 어머니는 현재 단절된 가족 간의 소통 문제를 직설적으로 지적합니다. 7. “So, we made a puzzle for you.” 문제를 해결하기 위한 구체적인 방법으로 퍼즐이라는 과제를 제시하는 전환점입니다. 8. “Here are three silver coins. Go to the market and buy something to fill this room completely.” 퍼즐의 구체적인 수행 규칙을 설명합니다. 불가능해 보이는 과제를 통해 아이들이 공동의 목표를 갖게 하려는 의도입니다. 9. “If you succeed, you will get a big reward.” 아이들이 협력할 동기를 부여하며, 이후의 전개를 이끄는 보상을 약속합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The mother continued, “ “But now, 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b><span class=\"grammar-hl\">So,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 너희들을 위해 퍼즐 하나를 만들었단다.</span><span class=\"en\"><b><span class=\"grammar-hl\">we made a puzzle for</span> you.</b></span></div></div><div class=\"lec-sent-ko\">그래서 우리는 너희를 위한 수수께끼 하나를 만들었단다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퍼즐의 구체적인 수행 규칙을 설명합니다. 불가능해 보이는 과제를 통해 아이들이 공동의 목표를 갖게 하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">So, we made a puzzle for 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">Here are three silver coins.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">은화 세 닢이.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여기 은화 세 개가 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이들이 협력할 동기를 부여하며, 이후의 전개를 이끄는 보상을 약속합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here are three silver coins. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시장에 가서</span><span class=\"en\"><b>Go to the market</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가를 사 오렴</span><span class=\"en\"><b>and buy <span class=\"grammar-hl\">something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 방을 완전히 채울.</span><span class=\"en\"><b><span class=\"grammar-hl\">to fill</span> this room completely.</b></span></div></div><div class=\"lec-sent-ko\">시장에 가서 이 방을 완전히 채울 무언가를 사렴.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부모의 제안을 받아들이며 갈등 해결의 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something to fill (to부정사): 앞의 명사(something)를 뒤에서 수식하는 형용사적 용법으로, &#39;~할&#39;이라는 의미를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너희가 성공한다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If you succeed,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 보상을 받게 될 것이다.”</span><span class=\"en\"><b><span class=\"grammar-hl\">you will get</span> a big reward.”</b></span></div></div><div class=\"lec-sent-ko\">만약 너희가 성공한다면, 너희는 큰 보상을 받을 거야.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 방을 다 채우기에는 자원이 턱없이 부족함을 직관적으로 깨닫는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you succeed, you will get 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이선이</span><span class=\"en\"><b>Ethan,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫째 아이인</span><span class=\"en\"><b><span class=\"grammar-hl\">the eldest child</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했습니다,</span><span class=\"en\"><b>said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“저희가 최선을 다할게요.”</span><span class=\"en\"><b>“We will do our best.”</b></span></div></div><div class=\"lec-sent-ko\">첫째인 Ethan이 “우리는 최선을 다할게요.”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부모의 제안을 받아들이며 갈등 해결의 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the eldest child (관계대명사(생략)): 명사(Ethan) 뒤에 삽입된 동격의 수식어구로, 앞의 명사를 보충 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가족의 막내인</span><span class=\"en\"><b><span class=\"grammar-hl\">The youngest of the family</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">애니는</span><span class=\"en\"><b>Annie,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어리둥절했습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was puzzled</span>.</b></span></div></div><div class=\"lec-sent-ko\">가족의 막내인 Annie는 혼란스러웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 방을 다 채우기에는 자원이 턱없이 부족함을 직관적으로 깨닫는 장면입니다. 12. “Three silver coins aren’t enough to fill this room!” 퍼즐의 난관을 처음으로 언급하며, 이어질 시행착오의 과정을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The youngest lass=\"lec-chunk\"><span class=\"ko\">나는 이해한다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“이제 알겠어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“Now I understand. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 49 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세상에서 가장 큰 보상은</span><span class=\"en\"><b><span class=\"grammar-hl\">The greatest reward in the world</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 가족이다.</span><span class=\"en\"><b>is my family.”</b></span></div></div><div class=\"lec-sent-ko\">세상에서 가장 훌륭한 보상은 우리 가족이군요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The greatest reward in the world 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소원해진 세 남매에게 부모는 방을 채우라는 퍼즐 과제를 내준다.</li><li>첫째의 독단적인 행동은 실패를 낳았지만, 아이들은 협력의 중요성을 배운다.</li><li>아이들은 시행착오 끝에 물리적인 물건이 아닌 빛을 사용하여 방을 가득 채운다.</li><li>그 빛 속에서 가족의 소중한 추억을 발견하며, 이들은 진정한 가족의 가치를 되찾는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Siblings initially fail by acting alone, but they ultimately succeed by working together to light up the room and rediscover their familial bonds.</div>\n              <div class=\"lec-final-sum-ko\">형제들은 처음에는 각자 행동하여 실패하지만, 협력하여 방을 빛으로 가득 채움으로써 가족의 유대를 되찾는다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.
