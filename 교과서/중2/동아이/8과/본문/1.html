<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(이) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 8과 본문1","audioDir":"1_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Welcome to the Quebec Winter Carnival\u003c/h1>\u003ch2>퀘벡 윈터 카니발에 오신 것을 환영합니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">퀘벡 \u003c/b>\u003cb class=\"key\">윈터 \u003c/b>\u003cb class=\"key\">카니발\u003c/b>의 마스코트인 \u003cb class=\"key\">Bonhomme\u003c/b>이 축제의 특징을 소개하고 방문객들을 안내하는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Bonhomme welcomes visitors to the Quebec Winter Carnival and invites them to follow along for an unforgettable experience.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 퀘벡 윈터 카니발의 본문을 함께 공부해 볼 거예요. 축제의 마스코트가 직접 등장해서 자신을 소개하는 흥미로운 내용이랍니다. 이번 시간에도 핵심 내용을 꼼꼼하게 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세계적인 겨울 축제인 \u003cb class=\"key\">퀘벡 \u003c/b>\u003cb class=\"key\">윈터 \u003c/b>\u003cb class=\"key\">카니발(Quebec \u003c/b>\u003cb class=\"key\">Winter \u003c/b>\u003cb class=\"key\">Carnival)\u003c/b>은 캐나다의 추운 겨울을 즐겁게 보내기 위해 시작된 대표적인 \u003cb class=\"key\">계절 \u003c/b>\u003cb class=\"key\">축제(seasonal \u003c/b>\u003cb class=\"key\">festival)\u003c/b>입니다. 마치 우리가 겨울에 눈사람을 만들고 놀듯이, 이 축제에서도 눈과 얼음을 활용한 다양한 볼거리를 제공합니다. 축제의 상징인 마스코트 \u003cb class=\"key\">Bonhomme\u003c/b>은 프랑스어로 좋은 사람을 뜻하며, 방문객들에게 친근하게 다가갑니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 살펴볼게요. 세계적인 겨울 축제인 퀘벡 윈터 카니발은 캐나다의 추운 겨울을 즐겁게 보내기 위해 시작된 대표적인 계절 축제예요. 마치 우리가 겨울에 눈사람을 만들고 놀듯이, 이 축제에서도 눈과 얼음을 활용한 다양한 볼거리를 제공한답니다. 축제의 상징인 마스코트 본홈은 프랑스어로 좋은 사람을 뜻하며 방문객들에게 친근하게 다가간다는 점을 기억해 주세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인사와 소개\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>첫 번째 단계에서는 \u003cb class=\"key\">인사말\u003c/b>과 함께 퀘벡 윈터 카니발의 \u003cb class=\"key\">마스코트\u003c/b>인 Bonhomme이 자신의 정체를 소개합니다. 그는 자신을 커다란 \u003cb class=\"key\">눈사람\u003c/b>이라고 설명하며 축제의 분위기를 띄웁니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>차림새와 초대\u003csmall>전개 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>두 번째 단계에서는 빨간 모자와 특별한 허리띠를 한 자신의 \u003cb class=\"key\">차림새\u003c/b>를 보여 줍니다. 이어 방문객들에게 잊지 못할 \u003cb class=\"key\">추억\u003c/b>을 가져갈 것인지 묻고 자신을 \u003cb class=\"key\">따라오라\u003c/b>고 안내합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부가 정보\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>세 번째 단계에서는 \u003cb class=\"key\">배경지식\u003c/b> 코너를 통해 Bonhomme의 이름 뜻과 축제의 \u003cb class=\"key\">개최 \u003c/b>\u003cb class=\"key\">시기\u003c/b> 및 장소에 대한 유용한 정보를 제공합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 마스코트의 인사와 소개, 차림새와 안내, 그리고 부가 정보의 흐름으로 이어져요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 인사말과 함께 퀘벡 윈터 카니발의 마스코트인 Bonhomme이 자신의 정체를 소개해요. 그는 자신을 커다란 눈사람이라고 설명하며 축제의 분위기를 띄운답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 빨간 모자와 특별한 허리띠를 한 자신의 차림새를 보여 줘요. 이어 방문객들에게 잊지 못할 추억을 가져갈 것인지 묻고 자신을 따라오라고 안내해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 배경지식 코너를 통해 Bonhomme의 이름 뜻과 축제의 개최 시기 및 장소에 대한 유용한 정보를 제공한답니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 축제 장소로 초대하는 \u003cb class=\"key\">인사말\u003c/b>을 건넨 뒤, 마스코트가 직접 등장하여 자신의 \u003cb class=\"key\">특징\u003c/b>과 축제 참여 방법을 설명하는 \u003cb class=\"key\">두괄식\u003c/b> 구조로 되어 있습니다. 독자에게 직접 말을 건네는 \u003cb class=\"key\">대화체\u003c/b>를 사용하여 친근감을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As you can see (5)\u003c/b>\u003cspan>상황 제시\u003c/span>\u003cb>Follow me (7)\u003c/b>\u003cspan>행동 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Quebec Winter Carnival\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Bonhomme\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mascot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">snowman\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 먼저 축제 장소로 초대하는 인사말을 건넨 뒤, 마스코트가 직접 등장하여 자신의 특징과 축제 참여 방법을 설명하는 두괄식 구조로 되어 있어요. 독자에게 직접 말을 건네는 대화체를 사용하여 친근감을 준답니다.","hl":"ty"},{"n":8,"text":"문장 속에서 As you can see 표현은 현재의 상황을 시각적으로 보여 줄 때 쓰이고, Follow me는 방문객의 행동을 유도하는 신호어로 아주 중요해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>환영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mascot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마스코트\u003c/span>\u003c/div>\u003cdiv>\u003cb>snowman\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>belt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허리띠\u003c/span>\u003c/div>\u003cdiv>\u003cb>take home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집으로 가져가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unforgettable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잊지 못할\u003c/span>\u003c/div>\u003cdiv>\u003cb>memory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추억\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따라오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>hold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(행사를) 열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"주요 단어들을 짚어 볼게요. mascot은 마스코트라는 뜻이고, unforgettable은 잊지 못할이라는 중요한 형용사예요. 그리고 hold는 행사를 열다라는 뜻으로 수동태 형태로 자주 쓰인다는 점을 기억해 주세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unforgettable\u003c/b>\u003cspan class=\"m\">잊지 못할\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">memorable\u003c/span>\u003cspan class=\"s\">unfading\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forgettable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">exceptional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mean\u003c/b>\u003cspan class=\"m\">의미하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">signify\u003c/span>\u003cspan class=\"s\">indicate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 동의어와 반의어를 정리해 볼게요. unforgettable의 동의어로는 memorable이 있고, 반의어로는 forgettable이 있어요. special의 동의어는 unique고 반의어는 ordinary나 common이 된답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요!\u003c/span>\u003cspan class=\"en\">Hello!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 시작하면서 독자에게 밝고 친근하게 \u003cb class=\"key\">인사\u003c/b>를 건네는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 카니발의 마스코트가 직접 말을 건네는 듯한 현장감을 부여하는 역할을 해요.\u003c/div>","segs":[{"n":11,"text":"Hello!, 안녕하세요!. 이 문장 전체를 해석하면, 안녕하세요!","hl":"m"},{"n":12,"text":"첫 번째 문장이에요. 글을 시작하면서 독자에게 밝고 친근하게 인사를 건네는 역할을 하죠. 마스코트가 직접 말을 건네는 듯한 느낌을 줘요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 오신 것을 환영합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Welcome \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퀘벡 윈터 카니발에\u003c/span>\u003cspan class=\"en\">the Quebec Winter Carnival.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">퀘벡 윈터 카니발에 오신 것을 환영합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제의 장소인 \u003cb class=\"key\">퀘벡 \u003c/b>\u003cb class=\"key\">윈터 \u003c/b>\u003cb class=\"key\">카니발\u003c/b>로 독자들을 초대하는 \u003cb class=\"key\">환영 \u003c/b>\u003cb class=\"key\">인사\u003c/b>예요. 앞으로 전개될 축제 소개의 배경을 안내하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to를 동반하는 환영 표현\u003c/span> : Welcome [자동사] + to [전치사] + 명사구 : \"~에 오신 것을 환영합니다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Welcome to, ~에 오신 것을 환영합니다. the Quebec Winter Carnival, 퀘벡 윈터 카니발에. 이 문장 전체를 해석하면, 퀘벡 윈터 카니발에 오신 것을 환영합니다.","hl":"m"},{"n":14,"text":"두 번째 문장이에요. 축제의 장소인 퀘벡 윈터 카니발로 독자들을 초대하는 환영 인사를 전하고 있죠.","hl":"mn"},{"n":15,"text":"여기서는 Welcome to라는 표현을 살펴봐야 해요. 도착 지점을 나타내는 전치사 to를 써서 어디에 환영하는지 나타내는 숙어 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 Bonhomme이에요\u003c/span>\u003cspan class=\"en\">I am \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Bonhomme, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카니발의 마스코트인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mascot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">carnival\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 카니발의 마스코트인 Bonhomme이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신이 카니발의 상징인 \u003cb class=\"key\">마스코트\u003c/b> Bonhomme이라는 것을 \u003cb class=\"key\">자기소개\u003c/b>하는 문장이에요. 명사와 명사가 콤마로 연결되는 동격 구조를 포함하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 동격구\u003c/span> : 명사 A, [명사구 B (A와 B는 동일 대상을 지칭)] : \"Bonhomme, 카니발의 마스코트\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"I am Bonhomme, 저는 Bonhomme이에요. the mascot of the carnival, 카니발의 마스코트인. 이 문장 전체를 해석하면, 저는 카니발의 마스코트인 Bonhomme이에요.","hl":"m"},{"n":17,"text":"세 번째 문장이에요. 자신이 카니발의 상징인 마스코트 Bonhomme이라는 것을 자기소개하는 내용이죠.","hl":"mn"},{"n":18,"text":"여기서 꼭 알아야 할 어법은 콤마 뒤에 나오는 동격 구조예요. Bonhomme과 the mascot of the carnival이 같은 대상을 가리킨다는 것을 콤마로 연결해 설명하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">am\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란 눈사람이에요.\u003c/span>\u003cspan class=\"en\">a big snowman.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 커다란 눈사람이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카니발의 마스코트인 \u003cb class=\"key\">Bonhomme\u003c/b>이 자신의 정체를 소개하는 문장입니다. \u003cb class=\"key\">대명사 \u003c/b>\u003cb class=\"key\">I\u003c/b>와 \u003cb class=\"key\">be동사 \u003c/b>\u003cb class=\"key\">am\u003c/b>을 사용해 자신의 모습을 직관적으로 드러내며 글의 흥미를 높입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 수 일치\u003c/span> : 주어(I) + be동사(am) : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"I am, 저는. a big snowman, 커다란 눈사람이에요.. 이 문장 전체를 해석하면, 저는 커다란 눈사람이에요.","hl":"m"},{"n":20,"text":"네 번째 문장이에요. 마스코트인 Bonhomme이 자신이 어떤 모습인지 직접 소개하고 있죠. 커다란 눈사람이라는 정체를 밝히면서 독자에게 친근하게 다가가고 있어요.","hl":"mn"},{"n":21,"text":"어법을 살펴볼까요. 주어가 첫 번째 사람을 나타내는 I니까 be동사는 am을 써서 I am이라고 연결해야 해요. 주어와 동사의 짝을 맞추는 수 일치 개념이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 보는 것처럼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> you can see,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 쓰고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">wearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.\u003c/span>\u003cspan class=\"en\">a big red hat and a special belt.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 보는 것처럼, 저는 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마스코트의 외양을 \u003cb class=\"key\">현재진행형\u003c/b>을 통해 생생하게 묘사하는 문장입니다. 접속사 \u003cb class=\"key\">As\u003c/b>를 활용해 독자가 눈앞에서 보듯 카니발 마스코트의 차림새를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~처럼)\u003c/span> : As + 주어(you) + 동사(can see) : \"~가 보는 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : 주어(I) + be동사(am) + 현재분사(wearing) : \"입고 있다, 착용하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"As you can see, 당신이 보는 것처럼. I'm wearing, 저는 쓰고 있어요. a big red hat and a special belt, 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.. 이 문장 전체를 해석하면, 당신이 보는 것처럼, 저는 크고 빨간 모자를 쓰고 특별한 허리띠를 하고 있어요.","hl":"m"},{"n":23,"text":"다섯 번째 문장이에요. 접속사 As를 써서 여러분이 보시다시피 라는 의미를 더하고 있죠. 지금 현재 모자를 쓰고 허리띠를 두르고 있는 모습을 생생하게 설명하고 있어요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 접속사 As예요. 뒤에 주어 동사가 와서 ~처럼이라는 뜻을 나타내죠. 두 번째는 I'm wearing이라는 현재진행형이에요. 지금 이 순간에 입고 있는 동작을 나타낼 때 be동사 am에 ing를 붙여서 쓴다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 원하나요\u003c/span>\u003cspan class=\"en\">Do you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집으로 가져가고\u003c/span>\u003cspan class=\"en\">to take home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잊지 못할 추억을\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">unforgettable\u003c/span> memory\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카니발에서\u003c/span>\u003cspan class=\"en\">from the carnival?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 카니발에서 잊지 못할 추억을 집으로 가져가고 싶나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 카니발 참여를 유도하는 \u003cb class=\"key\">의문문\u003c/b>입니다. \u003cb class=\"key\">to부정사\u003c/b>를 목적어로 취하는 동사 want의 쓰임과 분사 형태의 \u003cb class=\"key\">unforgettable\u003c/b> 표현이 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : 주어 + want + to부정사(to take) : \"~하고 싶어 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 파생 형용사\u003c/span> : 접두사(un-) + 동사(forget) + 접미사(-able) : \"잊을 수 없는, 잊지 못할\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Do you want, 당신은 원하나요. to take home, 집으로 가져가고. an unforgettable memory, 잊지 못할 추억을. from the carnival?, 카니발에서. 이 문장 전체를 해석하면, 당신은 카니발에서 잊지 못할 추억을 집으로 가져가고 싶나요?","hl":"m"},{"n":26,"text":"여섯 번째 문장이에요. 카니발에 온 사람들에게 잊지 못할 추억을 집으로 가져가고 싶냐고 질문을 던지고 있죠. 독자의 참여를 이끌어내는 다정한 질문이에요.","hl":"mn"},{"n":27,"text":"어법 포인트를 짚어볼게요. 동사 want는 목적어로 to take 같은 to부정사를 데리고 와서 ~하고 싶다라는 뜻을 만들어요. 그리고 memory를 꾸며주는 unforgettable은 잊을 수 없는 이라는 뜻의 형용사라는 것도 잘 알아두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저를 따라오세요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Follow \u003c/span>\u003cspan class=\"tgt\">me, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 보여 드릴게요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I'll\u003c/span> show you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이곳에서 무엇을 해야 할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">here\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저를 따라오세요, 그러면 이곳에서 무엇을 해야 할지 당신에게 보여 줄게요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마스코트 Bonhomme이 카니발을 안내하겠다는 의도를 나타내는 문장이에요. \u003cb class=\"key\">명령어 \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">주어 \u003c/b>\u003cb class=\"key\">will\u003c/b> 구조를 통해 앞의 행동을 하면 뒤의 결과가 일어난다는 점을 자연스럽게 \u003cb class=\"key\">연결\u003c/b>하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 and 주어 will\u003c/span> : 명령문 [동사원형~] + and + [주어] + will + [동사원형] : \"따라오세요, 그러면 ~해 줄게요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사+to부정사\u003c/span> : 의문사 [what] + to부정사 [to do] : \"무엇을 해야 할지\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Follow me, 저를 따라오세요. and, 그리고. I'll show you, 제가 보여 드릴게요. what to do here, 이곳에서 무엇을 해야 할지. 이 문장 전체를 해석하면, 저를 따라오세요, 그러면 이곳에서 무엇을 해야 할지 당신에게 보여 줄게요.","hl":"m"},{"n":29,"text":"이번 문장은 마스코트인 Bonhomme이 카니발 구경을 시켜주겠다고 권유하는 대목이에요. 명령문 뒤에 and가 붙어서 독자의 흥미를 유발하고 자연스럽게 안내로 이어지도록 돕는 역할을 하죠.","hl":"mn"},{"n":30,"text":"첫 번째 어법 포인트는 Follow me, and I'll 문장이에요. 명령문 뒤에 and가 오면 ~해라, 그러면이라는 뜻을 나타내는 명령문 and 주어 will 구문이 되죠. 두 번째 어법 포인트는 what to do here 구문이에요. 의문사 what과 to부정사가 만나서 무엇을 해야 할지라는 뜻의 명사구를 만들고 show 동사의 목적어로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고 있었나요?\u003c/span>\u003cspan class=\"en\">Did You Know?\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">• Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요.\u003c/span>\u003cspan class=\"en\">• Bonhomme means &quot;good man&quot; in French.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">• 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.\u003c/span>\u003cspan class=\"en\">• The Quebec Winter Carnival \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003cspan class=\"tgt\">held\u003c/span> for 10 days between January and February in Quebec, Canada.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알고 있었나요? • Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요. • 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카니발에 대한 흥미로운 상식 정보를 전달하는 읽을거리 코너예요. 마스코트 이름의 어원과 축제가 열리는 시기 및 장소를 \u003cb class=\"key\">객관적 \u003c/b>\u003cb class=\"key\">정보\u003c/b>로 깔끔하게 정리해 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 + be동사 [is] + 과거분사 [held] : \"열린다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Did You Know?, 알고 있었나요?. • Bonhomme means \"good man\" in French, • Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요.. • The Quebec Winter Carnival is usually held for 10 days between January and February in Quebec, Canada, • 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.. 이 문장 전체를 해석하면, 알고 있었나요? • Bonhomme은 프랑스어로 ‘좋은 사람’을 의미해요. • 퀘벡 윈터 카니발은 캐나다 퀘벡에서 보통 1월과 2월 사이에 10일 동안 열려요.","hl":"m"},{"n":32,"text":"마지막 문장에서는 퀘벡 윈터 카니발과 마스코트에 얽힌 유익한 상식을 전달하고 있어요. 축제가 언제 어디서 열리는지 핵심 정보를 객관적으로 짚어주는 내용이에요.","hl":"mn"},{"n":33,"text":"이번 문장의 핵심 어법은 is usually held 표현이에요. 카니발이 개최되는 대상이므로 수동태를 써야 하고 빈도부사 usually의 위치도 함께 기억해 두면 좋답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>퀘벡 윈터 카니발의 \u003cb class=\"key\">마스코트\u003c/b>인 Bonhomme이 환영 인사를 건넵니다.\u003c/li>\u003cli>자신을 커다란 \u003cb class=\"key\">눈사람\u003c/b>으로 소개하며 빨간 모자와 허리띠를 \u003cb class=\"key\">착용\u003c/b>하고 있음을 보여 줍니다.\u003c/li>\u003cli>방문객들에게 \u003cb class=\"key\">잊지 \u003c/b>\u003cb class=\"key\">못할 \u003c/b>\u003cb class=\"key\">추억\u003c/b>을 위해 자신을 \u003cb class=\"key\">따라오라\u003c/b>고 말합니다.\u003c/li>\u003cli>Bonhomme은 좋은 사람을 뜻하며 축제는 캐나다 퀘벡에서 1월과 2월 사이에 \u003cb class=\"key\">개최\u003c/b>됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Bonhomme welcomes visitors to the Quebec Winter Carnival and invites them to follow along for an unforgettable experience.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">퀘벡 \u003c/b>\u003cb class=\"key\">윈터 \u003c/b>\u003cb class=\"key\">카니발\u003c/b>의 마스코트인 \u003cb class=\"key\">Bonhomme\u003c/b>이 축제의 특징을 소개하고 방문객들을 안내하는 내용입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 이렇게 퀘벡 윈터 카니발 본문을 함께 공부해 보았어요. 마스코트가 직접 안내하는 글의 전개 방식을 잘 기억하고 복습해 주세요. 수고하셨어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
