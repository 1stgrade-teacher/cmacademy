@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 8과 본문3","audioDir":"3_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Toboggan Slide: Fast Fun and Great Views at the Carnival\u003c/h1>\u003ch2>터보건 활강장: 카니발의 빠른 즐거움과 멋진 경관\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>카니발에서 할 수 있는 흥미로운 활동 중 하나인 \u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>은 1884년에 지어졌고 길이가 200미터이며, \u003cb class=\"key\">터보건\u003c/b>은 길고 좁은 썰매이다. 속도를 좋아하는 사람이 이 썰매를 타면 \u003cb class=\"key\">롤러코스터\u003c/b>에 탄 것처럼 빠르게 느껴지고, 미끄러져 내려가는 동안 \u003cb class=\"key\">퀘벡\u003c/b>의 놀라운 경관을 즐길 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The toboggan slide at the carnival gives you a fast, roller-coaster-like ride and lets you enjoy amazing views of Quebec.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 카니발에서 즐길 수 있는 아주 특별한 활동을 소개하는 지문을 함께 읽어 볼 거예요. 제목은 Toboggan Slide, 우리말로는 터보건 활강장이에요. 카니발에는 흥미로운 활동이 정말 많은데, 그중 하나가 바로 이 터보건 활강장이라는 거죠. 이 글의 요지는 터보건을 타면 아주 빠른 속도와 퀘벡의 멋진 경관을 동시에 즐길 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">터보건(toboggan)\u003c/b>은 눈이나 얼음 위를 미끄러져 내려가는 길고 좁은 썰매로, 캐나다 퀘벡(Quebec)의 겨울 축제인 \u003cb class=\"key\">카니발(carnival)\u003c/b>에서 대표적인 체험 활동이에요. 이 활강장(slide)은 1884년에 세워진 아주 오래된 시설이고, 길이가 200미터에 이르러 오랫동안 많은 사람이 찾는 명소가 되었죠. 눈으로 덮인 긴 활강로를 빠르게 내려오면 속도감(speed)이 크게 느껴져서, 놀이공원의 \u003cb class=\"key\">롤러코스터(roller \u003c/b>\u003cb class=\"key\">coaster)\u003c/b>를 타는 듯한 짜릿함을 준답니다. 일상에 비유하면, 자전거로 완만한 언덕을 천천히 내려갈 때보다 급경사 길을 바람을 가르며 내려갈 때 훨씬 강한 스릴을 느끼는 것과 같아요. 게다가 활강장 주변에는 성(castle)과 얼음 강(icy river) 같은 랜드마크(landmark)가 있어서, 미끄러져 내려가는 동안 \u003cb class=\"key\">경관(view)\u003c/b>까지 함께 감상할 수 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알고 가면 훨씬 이해가 쉬워요. toboggan, 즉 터보건은 눈이나 얼음 위를 미끄러져 내려가는 길고 좁은 썰매를 말해요. 캐나다 퀘벡에서는 겨울마다 큰 축제인 카니발이 열리고, 그때 이 터보건 활강장이 대표적인 체험 시설로 등장하죠. 이 활강장은 천팔백팔십사 년에 세워진 아주 오래된 시설이고, 길이가 이백 미터나 돼요. 우리 일상에 비유하면, 자전거로 완만한 언덕을 천천히 내려갈 때보다 급경사 길을 바람을 가르며 내려갈 때 훨씬 큰 스릴을 느끼는 것과 같아요. 게다가 활강장 주변에는 성과 얼음 강 같은 랜드마크가 있어서, 내려가는 동안 눈도 즐거워진답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>카니발 소개\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 카니발에서 할 수 있는 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">활동\u003c/b>이 아주 많다고 말하며 시작한다. 그중에서도 필자가 주목해 소개하는 활동이 바로 \u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>이다. 첫 문장이 글 전체의 화제를 여는 도입부 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>활강장 정체\u003csmall>근거 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>은 1884년에 지어졌고 길이가 200미터라고 소개한다. 이어서 \u003cb class=\"key\">터보건\u003c/b>이 길고 좁은 \u003cb class=\"key\">썰매\u003c/b>라고 정의하며, 낯선 단어의 뜻을 바로 풀어 준다. 즉 이 단계는 활강장의 역사와 길이, 그리고 타는 도구의 정체를 알려 주는 부분이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>속도 체험\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>속도를 좋아하는 사람에게 \u003cb class=\"key\">터보건\u003c/b>을 타 보라고 권한다. 그 이유는 그것이 너무 빨라서 \u003cb class=\"key\">롤러코스터\u003c/b>에 탄 것처럼 느껴지기 때문이라고 설명한다. so ~ that 구문으로 속도가 만들어 내는 감각을 강조하는 대목이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>경관 감상\u003csmall>결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>미끄러져 내려가는 동안 \u003cb class=\"key\">퀘벡\u003c/b>의 놀라운 경관을 즐길 수 있다고 말한다. 왼쪽에서는 거대한 유명한 \u003cb class=\"key\">성\u003c/b>이, 오른쪽에서는 얼음에 뒤덮인 아름다운 \u003cb class=\"key\">강\u003c/b>이 보인다고 좌우 위치를 나누어 제시한다. 이렇게 활강장 체험의 마지막 매력으로 주변 경관을 정리하며 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 글은 카니발에서 여러분이 할 수 있는 흥미로운 활동이 아주 많다고 말하면서 시작해요. 그 많은 활동 중에서 필자가 골라 소개하는 것이 바로 터보건 활강장이죠. 그래서 첫 문장이 글 전체의 화제를 여는 역할을 한답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 활강장의 정체를 알려 줘요. 터보건 활강장은 천팔백팔십사 년에 지어졌고 길이가 이백 미터라고 설명하죠. 이어서 터보건이란 길고 좁은 썰매라고 정의해 주니까, 낯선 단어의 뜻이 바로 풀려요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 속도 체험이에요. 속도를 좋아한다면 터보건을 타 보라고 권하면서, 그 이유를 바로 뒤에서 설명해요. 너무 빨라서 롤러코스터에 탄 것처럼 느껴진다고 하니까, 속도가 얼마나 대단한지 짐작할 수 있죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 경관 감상이에요. 미끄러져 내려가는 동안 퀘벡의 놀라운 경관을 즐길 수 있다고 말해요. 왼쪽에서는 거대한 유명한 성이 보이고, 오른쪽에서는 얼음에 뒤덮인 아름다운 강이 보인다고 좌우를 나누어 설명하면서 글을 마무리하죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 카니발에서 할 수 있는 흥미로운 활동이 많다는 \u003cb class=\"key\">총론\u003c/b>을 먼저 제시하고, 곧바로 그중 하나인 \u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>을 예로 들어 설명한다. 이후 문장들은 활강장의 역사와 길이, 썰매의 정의, 타는 방법, 주변 경관 같은 구체적인 세부 정보를 덧붙인다. 그래서 이 글은 소개에서 구체적 \u003cb class=\"key\">예시\u003c/b>로, 다시 세부 설명으로 이어지는 전개 방식이며, 주제가 처음에 나오는 두괄식 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":8,"text":"이 글은 예시를 활용한 설명문이에요. 카니발에는 흥미로운 활동이 많다는 큰 주제를 먼저 던지고, 그중 하나인 터보건 활강장을 구체적인 예로 들어 자세히 설명하죠. 주제가 처음에 나오고 세부 내용이 뒤따르니까 두괄식 구조로 볼 수 있어요. 그래서 첫 문장을 읽을 때 글 전체가 어디로 흘러갈지 미리 잡아 두는 게 중요해요.","hl":"ty"},{"n":9,"text":"신호어도 함께 봐요. 첫 문장의 also는 앞에 다른 활동들도 있었고 여기에 하나를 더 추가한다는 표시예요. 네 번째 문장의 If는 조건을 제시하면서 독자에게 권하는 역할을 하고, 여섯 번째 문장의 While은 미끄러져 내려가는 동안이라는 동시 상황을 이끌어 줘요. 또 toboggan slide가 toboggan, sled로 이어지면서 같은 대상을 다른 말로 다시 표현하는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한, 역시\u003c/span>\u003c/div>\u003cdiv>\u003cb>toboggan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>터보건, 눈썰매\u003c/span>\u003c/div>\u003cdiv>\u003cb>slide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활강장, 미끄럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>carnival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>카니발, 축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다, 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미터\u003c/span>\u003c/div>\u003cdiv>\u003cb>long\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좁은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sled\u003c/b>\u003cem>명사\u003c/em>\u003cspan>썰매\u003c/span>\u003c/div>\u003cdiv>\u003cb>speed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속도\u003c/span>\u003c/div>\u003cdiv>\u003cb>get on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 타다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>so ~ that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 ~해서 …하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 느껴지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>roller coaster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>롤러코스터\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>slide down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>미끄러져 내려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>view\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경관, 경치\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>castle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성\u003c/span>\u003c/div>\u003cdiv>\u003cb>left\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왼쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오른쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>beautiful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아름다운\u003c/span>\u003c/div>\u003cdiv>\u003cb>icy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얼음에 뒤덮인, 얼음 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>river\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. toboggan은 터보건, 즉 눈 위에서 타는 썰매이고, slide는 활강장이나 미끄러지는 행동을 뜻해요. narrow는 좁은, huge는 거대한, icy는 얼음에 뒤덮인이라는 뜻이니 장소를 묘사할 때 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">interesting\u003c/b>\u003cspan class=\"m\">흥미로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exciting\u003c/span>\u003cspan class=\"s\">engaging\u003c/span>\u003cspan class=\"s\">fascinating\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">narrow\u003c/b>\u003cspan class=\"m\">좁은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thin\u003c/span>\u003cspan class=\"s\">slim\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wide\u003c/span>\u003cspan class=\"a\">broad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">rapid\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"s\">relish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"s\">incredible\u003c/span>\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">giant\u003c/span>\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"s\">gorgeous\u003c/span>\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. interesting은 exciting, fascinating과 뜻이 가깝고 boring과는 반대예요. narrow는 thin과 비슷하지만 wide, broad와는 반대죠. fast는 quick, rapid와 같은 뜻이고 slow와 반대돼요. huge는 enormous, massive와 가깝고 tiny, small과 반대이며, famous는 well-known, renowned와 가깝고 unknown과는 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">터보건 활강장\u003c/span>\u003cspan class=\"en\">Toboggan Slide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 많은 흥미로운 활동들이 또한 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> also \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">interesting \u003c/span>\u003cspan class=\"tgt\">activities\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카니발에서\u003c/span>\u003cspan class=\"en\">at the carnival.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">터보건 활강장 카니발에서 당신이 할 수 있는 정말 많은 흥미로운 활동들도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카니발에서 할 수 있는 활동들을 소개하는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. \u003cb class=\"key\">also\u003c/b>가 앞에서 언급한 활동에 이어 또 다른 활동을 알려 주는 신호이고, \u003cb class=\"key\">so \u003c/b>\u003cb class=\"key\">many\u003c/b>로 흥미로운 활동이 아주 많다는 점을 강조해요. 바로 다음 문장에서 터보건 활강장을 본격적으로 소개하도록 흐름을 잇는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [진주어 명사구] : \"정말 많은 흥미로운 활동들이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">so many + 복수명사(수량 강조)\u003c/span> : so many + [셀 수 있는 복수명사] : \"정말 많은 흥미로운 활동들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사] + (which/that) + [주어] + [동사] : \"당신이 할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Toboggan Slide, 터보건 활강장. There are also so many interesting activities, 정말 많은 흥미로운 활동들이 또한 있어요. you can do, 당신이 할 수 있는. at the carnival, 카니발에서. 이 문장 전체를 해석하면, 터보건 활강장 카니발에서 당신이 할 수 있는 정말 많은 흥미로운 활동들도 있어요.","hl":"m"},{"n":13,"text":"이 문장은 카니발에서 할 수 있는 활동들을 소개하는 도입 문장이에요. also가 들어 있어서 앞에서 소개한 활동에 이어 또 다른 활동이 있다는 걸 알려 주고, so many로 흥미로운 활동이 아주 많다는 점을 강조하고 있죠. 그래서 다음 문장에서 터보건 활강장을 본격적으로 소개할 준비를 하는 역할을 합니다.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어 볼게요. 첫 번째, There are는 '~이 있다'라는 뜻으로 뒤에 오는 명사가 진짜 주어인 유도부사 구문이에요. 두 번째, so many interesting activities에서 so many는 '정말 많은'이라는 뜻으로 셀 수 있는 복수명사를 강조하는 표현이죠. 세 번째, you can do는 앞에 있는 activities를 꾸며 주는 목적격 관계대명사가 생략된 자리예요. 원래는 which나 that이 들어가는데 목적격일 때는 생략할 수 있어서 주어 you가 바로 이어지는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">터보건 활강장은\u003c/span>\u003cspan class=\"en\">The toboggan slide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1884년에 지어졌고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">built\u003c/span> in 1884\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길이가 200미터예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">200 \u003c/span>\u003cspan class=\"tgt\">meters \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">터보건 활강장은 1884년에 지어졌고 길이가 200미터예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 터보건 활강장의 \u003cb class=\"key\">역사\u003c/b>와 \u003cb class=\"key\">규모\u003c/b>를 숫자로 알려 주는 문장이에요. \u003cb class=\"key\">수동태\u003c/b> was built로 '지어졌다'는 사실을 표현하고, and로 길이 정보까지 한 문장에 담았어요. 구체적인 숫자가 들어가서 설명이 훨씬 사실적으로 느껴지는 \u003cb class=\"key\">정보\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거시제)\u003c/span> : [주어] + was/were + [과거분사] : \"지어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and + 동사구 병렬\u003c/span> : [주어] + was built ~ and (주어 생략) + is ~ : \"그리고 길이가 200미터예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수량 표현(길이)\u003c/span> : [숫자] + [단위] + long : \"길이가 200미터인\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The toboggan slide, 터보건 활강장은. was built in 1884, 1884년에 지어졌고. and is 200 meters long, 길이가 200미터예요. 이 문장 전체를 해석하면, 터보건 활강장은 1884년에 지어졌고 길이가 200미터예요.","hl":"m"},{"n":16,"text":"이 문장은 터보건 활강장이 언제 만들어졌고 얼마나 긴지 숫자로 알려 주는 문장이에요. 천팔백팔십사 년에 지어졌다는 역사와 이백 미터라는 규모가 함께 나오니까, 이 활강장이 오래되고 큰 시설이라는 걸 한 번에 알 수 있죠. 구체적인 숫자가 들어가면 설명이 훨씬 사실적으로 느껴집니다.","hl":"mn"},{"n":17,"text":"어법 포인트 볼게요. 첫 번째, was built는 수동태예요. 주어인 The toboggan slide가 사람에게 지어지는 대상이기 때문에 '지어졌다'라고 수동으로 표현한 거죠. 두 번째, and is two hundred meters long에서 and는 was built와 is를 나란히 연결하는 등위접속사예요. 앞에 이미 주어가 있으니까 뒤에서는 주어를 반복하지 않고 동사만 이어 줍니다. 세 번째, 숫자와 단위 뒤에 long을 붙이면 '길이가 얼마인'이라는 뜻이 된다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">터보건은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">toboggan\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길고 좁은 썰매예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">narrow \u003c/span>\u003cspan class=\"tgt\">sled\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">터보건은 길고 좁은 썰매예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> toboggan이 무엇인지 \u003cb class=\"key\">정의\u003c/b>해 주는 문장이에요. \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">보어\u003c/b> a long narrow sled로 '길고 좁은 썰매'라는 뜻을 풀어 주죠. 이렇게 개념을 먼저 잡아 두면 다음에 나오는 활강장 설명을 이해하는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">지식\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정관사 a의 총칭 용법\u003c/span> : a/an + [셀 수 있는 단수명사] : \"터보건은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어(2형식)\u003c/span> : [주어] + be동사 + [주격 보어 명사구] : \"길고 좁은 썰매예요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A toboggan, 터보건은. is a long narrow sled, 길고 좁은 썰매예요. 이 문장 전체를 해석하면, 터보건은 길고 좁은 썰매예요.","hl":"m"},{"n":19,"text":"이 문장은 toboggan이 무엇인지 정의해 주는 문장이에요. 길고 좁은 썰매라고 아주 간단하게 설명해 주죠. 이렇게 개념을 먼저 잡아 두면 다음에 나오는 활강장 설명이 훨씬 잘 이해됩니다.","hl":"mn"},{"n":20,"text":"어법 포인트 짚어 볼게요. 첫 번째, A toboggan에서 부정관사 a는 '어떤 하나의'라는 뜻이지만, 여기서는 터보건이라는 것 전체를 가리키는 총칭 용법이에요. 두 번째, is a long narrow sled에서 a long narrow sled는 주어를 설명해 주는 주격 보어 자리예요. 이렇게 주어와 보어를 be동사로 연결하는 문장을 이 형식이라고 부른다는 것도 함께 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 속도를 좋아한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">speed,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">터보건을 타 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">toboggan.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 속도를 좋아한다면, 터보건을 타 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 속도를 좋아하는 사람에게 터보건 슬라이드를 권하는 \u003cb class=\"key\">권유\u003c/b> 문장이에요. if로 조건을 먼저 제시하고, 주어 없이 동사원형으로 시작하는 \u003cb class=\"key\">명령문\u003c/b>으로 '그 조건이면 이렇게 하라'는 뜻을 전달하죠. 글 전체에서는 터보건 체험을 직접적으로 이끄는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">유도\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : If + [주어 + 동사], [주어 + 동사 / 명령문] : \"당신이 속도를 좋아한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + ~. : \"터보건을 타 보세요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If you like speed, 당신이 속도를 좋아한다면. get on the toboggan, 터보건을 타 보세요. 이 문장 전체를 해석하면, 당신이 속도를 좋아한다면, 터보건을 타 보세요.","hl":"m"},{"n":22,"text":"이 문장은 속도를 좋아하는 사람에게 터보건 슬라이드를 권하는 권유 문장이에요. 조건을 먼저 말하고 명령문으로 행동을 유도하는 방식이죠. 글 전체에서는 터보건 체험을 적극적으로 추천하는 역할을 합니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 두 가지예요. 첫 번째, If you like speed에서 if는 조건을 나타내는 접속사예요. 이 조건이 맞으면 뒤의 내용을 하라는 거죠. 두 번째, get on the toboggan은 주어 없이 동사원형으로 시작하는 명령문이에요. 그래서 터보건을 타 보세요, 라고 권유하는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 너무 빨라서\u003c/span>\u003cspan class=\"en\">It is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">fast \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 ~처럼 느낄 정도예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 롤러코스터에 탄 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> on a roller coaster.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 너무 빨라서 마치 당신이 롤러코스터에 탄 것처럼 느낄 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> so ~ that 구문으로 '너무 ~해서 …하다'라는 \u003cb class=\"key\">결과\u003c/b>를 나타내는 문장이에요. 빨라서 롤러코스터에 탄 느낌이 들 정도라는 \u003cb class=\"key\">비유\u003c/b>로 속도를 생생하게 전달하죠. 앞 문장의 터보건 권유를 이유와 함께 뒷받침하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 결과 구문\u003c/span> : so + [형용사/부사] + that + [주어 + 동사] : \"너무 빨라서 ~할 정도예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">미래시제 will\u003c/span> : will + [동사원형] : \"느낄 거예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 like + 절\u003c/span> : feel like + [주어 + 동사] : \"당신이 ~인 것처럼 느끼다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It is so fast, 그것은 너무 빨라서. that you will feel like, 당신이 ~처럼 느낄 정도예요. you are on a roller coaster, 당신이 롤러코스터에 탄 것처럼. 이 문장 전체를 해석하면, 그것은 너무 빨라서 마치 당신이 롤러코스터에 탄 것처럼 느낄 거예요.","hl":"m"},{"n":25,"text":"이 문장은 너무 빨라서 롤러코스터에 탄 것 같은 느낌이 들 정도라는 뜻이에요. 속도를 비유로 생생하게 전달하면서 앞에서 한 터보건 권유를 뒷받침해 주죠.","hl":"mn"},{"n":26,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, so fast that은 너무 빨라서 그 결과가 이어진다는 결과 구문이에요. 두 번째, feel like you are에서 like는 마치 그런 것처럼이라는 뜻으로 절을 이끄는 접속사로 쓰였어요. 그래서 롤러코스터에 탄 것처럼 느낀다는 비유가 됩니다. 세 번째, will feel은 미래에 그렇게 느껴질 거라는 예상을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 미끄러져 내려가는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">sliding \u003c/span>\u003cspan class=\"tgt\">down,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 즐길 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퀘벡의 놀라운 경관을\u003c/span>\u003cspan class=\"en\">amazing \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">views \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Quebec\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 미끄러져 내려가는 동안, 당신은 퀘벡의 놀라운 경관을 즐길 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> While로 '미끄러져 내려가는 동안'이라는 \u003cb class=\"key\">시간\u003c/b>을 제시하고, 그 상황에서 경관을 즐길 수 있다고 말하는 문장이에요. 터보건을 타는 동안 누릴 수 있는 \u003cb class=\"key\">즐거움\u003c/b>을 구체적으로 알려 주죠. 바로 뒤에서 성과 강을 하나씩 소개하는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl lass=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 왼쪽에서 거대한 유명한 성을 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미끄럼틀을 타고 내려가는 사람의 시점에서 왼쪽 풍경을 알려 주는 문장이에요. 바로 앞 문장에서 시선을 \u003cb class=\"key\">왼쪽\u003c/b>으로 돌리고, 다음 문장에서는 오른쪽으로 돌리는 방식으로 좌우 풍경을 짝지어 보여 줘서 \u003cb class=\"key\">현장감\u003c/b>을 살려 줘요. on your left는 '당신의 왼쪽에'라는 뜻의 \u003cb class=\"key\">전치사구\u003c/b>로 위치를 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + can + [동사원형] : \"볼 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬 수식\u003c/span> : [관사] + [형용사] + [형용사] + [명사] : \"거대한 유명한 성을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(위치)\u003c/span> : on + [소유격] + [명사] : \"당신의 왼쪽에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You can see, 당신은 볼 수 있어요. a huge famous castle, 거대한 유명한 성을. on your left, 당신의 왼쪽에서. 이 문장 전체를 해석하면, 당신의 왼쪽에서 거대한 유명한 성을 볼 수 있어요.","hl":"m"},{"n":31,"text":"이 문장은 미끄럼틀을 타고 내려가면서 왼쪽을 봤을 때 눈에 들어오는 풍경을 알려 주는 문장이에요. 바로 앞에서 왼쪽 이야기를 하고, 다음 문장에서는 오른쪽 이야기를 하니까 좌우를 짝지어 보여 주면서 현장감을 살리는 거죠. on your left는 당신의 왼쪽에라는 뜻의 전치사구이고요.","hl":"mn"},{"n":32,"text":"첫 번째로 can see를 보세요. can은 할 수 있다라는 능력을 나타내는 조동사라서 뒤에 반드시 동사원형 see가 와요. 두 번째로 a huge famous castle을 보면 huge와 famous가 둘 다 castle을 꾸며 주는 형용사라서 명사 앞에 나란히 놓인 병렬 구조예요. 세 번째로 on your left에서 on은 표면에 닿은 위치를 나타내는 전치사이고, your left처럼 소유격 뒤에 방향 명사가 오면 당신의 왼쪽이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 오른쪽에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class= 나죠. icy는 얼음으로 뒤덮인이라는 뜻으로 겨울 퀘벡의 계절감을 전해 줘요.","hl":"mn"},{"n":35,"text":"첫 번째로 On your right를 보세요. 원래 문장 끝에 오던 전치사구를 문장 앞으로 끌어내서 오른쪽이라는 위치를 강조한 구조이고, 주어와 동사의 자리는 그대로 유지돼요. 두 번째로 you can see에서는 can이 할 수 있다라는 가능성을 나타내는 조동사라서 뒤에 동사원형 see가 옵니다. 세 번째로 a beautiful icy river를 보면 beautiful과 icy가 둘 다 river를 꾸미는 형용사라서 명사 앞에 나란히 놓인 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>카니발에는 당신이 할 수 있는 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">활동\u003c/b>이 아주 많다.\u003c/li>\u003cli>\u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>은 1884년에 지어졌고 길이가 200미터이며, \u003cb class=\"key\">터보건\u003c/b>은 길고 좁은 썰매이다.\u003c/li>\u003cli>속도를 좋아한다면 \u003cb class=\"key\">터보건\u003c/b>을 타 보라. 너무 빨라서 \u003cb class=\"key\">롤러코스터\u003c/b>에 탄 것처럼 느껴진다.\u003c/li>\u003cli>미끄러져 내려가는 동안 \u003cb class=\"key\">퀘벡\u003c/b>의 놀라운 경관을 즐길 수 있고, 왼쪽에는 성이, 오른쪽에는 얼음 강이 보인다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The toboggan slide at the carnival gives you a fast, roller-coaster-like ride and lets you enjoy amazing views of Quebec.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">카니발에서 할 수 있는 흥미로운 활동 중 하나인 \u003cb class=\"key\">터보건 \u003c/b>\u003cb class=\"key\">활강장\u003c/b>은 1884년에 지어졌고 길이가 200미터이며, \u003cb class=\"key\">터보건\u003c/b>은 길고 좁은 썰매이다. 속도를 좋아하는 사람이 이 썰매를 타면 \u003cb class=\"key\">롤러코스터\u003c/b>에 탄 것처럼 빠르게 느껴지고, 미끄러져 내려가는 동안 \u003cb class=\"key\">퀘벡\u003c/b>의 놀라운 경관을 즐길 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 배운 내용을 정리해 볼게요. 카니발의 여러 활동 중 하나인 터보건 활강장은 천팔백팔십사 년에 지어진 이백 미터 길이의 시설이었죠. 길고 좁은 썰매인 터보건을 타면 롤러코스터처럼 빠른 속도를 느낄 수 있고, 내려가는 동안 왼쪽의 성과 오른쪽의 얼음 강까지 즐길 수 있어요. 오늘도 수고 많았고, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
