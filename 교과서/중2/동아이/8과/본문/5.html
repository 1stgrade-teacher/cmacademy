@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 8과 본문5","audioDir":"5_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>8과 본문5\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Delicious Treats at the Carnival\u003c/h1>\u003ch2>카니발의 맛있는 간식거리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>카니발에서 \u003cb class=\"key\">핫초코\u003c/b>와 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">태피\u003c/b> 같은 맛있는 간식을 즐길 수 있다. 특히 눈 위에 뜨거운 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>을 붓고 막대로 재빨리 말면 맛있는 메이플 태피가 완성된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>At the carnival you can enjoy delicious treats like hot chocolate and maple taffy, and you can make maple taffy by pouring hot maple syrup on the snow and rolling it with a stick.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중2 동아 이 교과서 8과 본문, Delicious Treats를 함께 읽어 볼게요. 카니발에서 먹을 수 있는 맛있는 간식거리에 대한 글이고, 핫초코와 메이플 태피를 소개한 뒤 메이플 태피를 만드는 방법까지 알려 주는 글이에요. 요약하면 카니발에는 맛있는 간식이 많고, 눈 위에 뜨거운 메이플 시럽을 부어 막대로 말면 메이플 태피가 완성된다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">메이플 태피(maple taffy)는 캐나다 퀘벡 지역의 대표적인 겨울 간식이에요. 단풍나무 수액을 졸여 만든 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>(maple syrup)을 뜨거운 상태로 눈 위에 붓고, 막대로 재빨리 말아 굳히면 완성되죠. 뜨거운 시럽이 차가운 눈과 만나면 \u003cb class=\"key\">온도\u003c/b>가 급격히 떨어지면서 설탕 성분이 굳는 결정화(crystallization)가 일어나요. 마치 뜨거운 물엿을 차가운 접시에 떨어뜨리면 순식간에 딱딱해지는 것과 같은 원리예요. 이렇게 만들어진 태피는 쫀득하고 달콤해서 아이스크림처럼 즐겨 먹고, 카니발이나 겨울 축제에서 자주 만날 수 있어요.\u003c/div>","segs":[{"n":2,"text":"본문을 이해하려면 메이플 태피가 무엇인지 먼저 알아 두면 좋아요. 메이플 태피는 캐나다 퀘벡 지역의 대표적인 겨울 간식이에요. 단풍나무 수액을 졸여 만든 메이플 시럽을 뜨거운 상태로 눈 위에 붓고, 막대로 재빨리 말아 굳히면 완성되죠. 뜨거운 시럽이 차가운 눈과 만나면 온도가 급격히 떨어지면서 설탕 성분이 굳는 결정화가 일어나요. 뜨거운 물엿을 차가운 접시에 떨어뜨리면 순식간에 딱딱해지는 것과 같은 원리예요. 이렇게 만든 태피는 쫀득하고 달콤해서 겨울 축제나 카니발에서 자주 만날 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>배고픔과 간식 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자는 이 모든 \u003cb class=\"key\">활동\u003c/b>을 마친 뒤 정말 \u003cb class=\"key\">배고픔\u003c/b>을 느낀다고 말해요. 그리고 카니발에는 먹을 \u003cb class=\"key\">간식\u003c/b>이 많이 있다며 글의 주제를 앞부분에서 먼저 제시해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>핫초코 추천\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>첫 번째 간식으로 \u003cb class=\"key\">핫초코\u003c/b> 한 잔을 제안해요. 그리고 그것이 추운 날씨에 항상 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">음료\u003c/b>라고 그 이유를 덧붙여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>메이플 태피 소개\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>이제 화자는 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">태피\u003c/b>도 맛봐야 한다며 두 번째 간식으로 넘어가요. 그것이 이곳에서 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">방법\u003c/b>으로 만들어진다고 말한 뒤, 어떻게 만드는지 함께 배워 보자고 \u003cb class=\"key\">전환\u003c/b>해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>만드는 과정\u003csmall>과정 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>만드는 방법을 \u003cb class=\"key\">순서\u003c/b>대로 알려 줘요. 눈 위에 뜨거운 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>을 붓고, 그 시럽 위에 막대를 놓아 재빨리 돌돌 말아요. 그러면 이제 맛있는 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">태피\u003c/b>가 완성돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>초대와 안내\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>마지막으로 화자는 카니발에 와서 자신을 만나길 바란다고 말해요. 그리고 더 많은 정보를 원하면 \u003cb class=\"key\">웹사이트\u003c/b>를 확인하라고 \u003cb class=\"key\">당부\u003c/b>하며 인사로 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지금부터 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 화자는 이 모든 활동을 마친 뒤 정말 배고픔을 느낀다고 말해요. 그리고 카니발에는 먹을 간식이 많이 있다며 글의 주제를 앞부분에서 먼저 꺼내죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 첫 번째 간식으로 핫초코 한 잔을 제안해요. 그리고 그것이 추운 날씨에 항상 완벽한 음료라고 그 이유를 덧붙여요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 화자는 메이플 태피도 맛봐야 한다며 두 번째 간식으로 넘어가요. 그것이 이곳에서 특별한 방법으로 만들어진다고 말한 뒤, 어떻게 만드는지 함께 배워 보자고 전환하죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 만드는 과정이에요. 눈 위에 뜨거운 메이플 시럽을 붓고, 그 시럽 위에 막대를 놓아 재빨리 돌돌 말아요. 그러면 이제 맛있는 메이플 태피가 완성돼요.","hl":"f3"},{"n":8,"text":"마지막 단계에서 화자는 카니발에 와서 자신을 만나길 바란다고 말해요. 그리고 더 많은 정보를 원하면 웹사이트를 확인하라고 당부하며 인사로 글을 맺어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 배고픔을 말한 뒤, 두 번째 문장에서 카니발의 맛있는 \u003cb class=\"key\">간식\u003c/b>이라는 글의 \u003cb class=\"key\">주제\u003c/b>를 먼저 꺼내요. 그다음 핫초코와 메이플 태피를 \u003cb class=\"key\">예시\u003c/b>로 들고, 메이플 태피를 만드는 방법을 순서대로 보여 줘요. 핵심 내용이 앞부분에 먼저 나오는 \u003cb class=\"key\">두괄식\u003c/b> 구성이고, 본문은 시간의 흐름에 따라 \u003cb class=\"key\">과정\u003c/b>을 설명하는 방식이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>How about (3)\u003c/b>\u003cspan>제안\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>Then (9)\u003c/b>\u003cspan>순서(시간)\u003c/span>\u003cb>Now (10)\u003c/b>\u003cspan>결과·마무리\u003c/span>\u003cb>don't forget (12)\u003c/b>\u003cspan>당부·안내\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">delicious treats\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a cup of hot chocolate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">maple taffy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">delicious maple taffy\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 시간의 흐름에 따라 과정을 설명하는 시간순 전개 방식이에요. 그리고 첫 부분에서 카니발의 맛있는 간식이라는 주제를 먼저 제시하고, 뒤에서 예시와 과정을 풀어 내는 두괄식 구조죠. 주제문은 두 번째 문장이에요. 카니발에는 먹을 맛있는 간식이 많이 있다는 문장이 글 전체를 이끄는 중심 문장이라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 보면, 세 번째 문장의 How about은 제안을 나타내고, 다섯 번째 문장의 also는 두 번째 간식을 추가하는 표현이에요. 아홉 번째 문장의 Then은 순서를 이어 주는 시간 신호어이고, 열 번째 문장의 Now는 과정이 끝나고 결과가 나왔음을 보여 줘요. 열두 번째 문장의 don't forget은 정보를 확인하라는 당부의 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미진진한, 신나는\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>treat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간식, 별미\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carnival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>카니발, 축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>cup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잔, 컵\u003c/span>\u003c/div>\u003cdiv>\u003cb>hot chocolate\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>핫초코\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>drink\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음료\u003c/span>\u003c/div>\u003cdiv>\u003cb>weather\u003c/b>\u003cem>명사\u003c/em>\u003cspan>날씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맛보다, 시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>maple taffy\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>메이플 태피\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pour\u003c/b>\u003cem>동사\u003c/em>\u003cspan>붓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>syrup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시럽\u003c/span>\u003c/div>\u003cdiv>\u003cb>snow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓다, 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>막대기\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>재빨리\u003c/span>\u003c/div>\u003cdiv>\u003cb>roll\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말다, 돌돌 말다\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>부사\u003c/em>\u003cspan>둘레에, 빙 둘러\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊다\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>website\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웹사이트\u003c/span>\u003c/div>\u003cdiv>\u003cb>information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어부터 짚어 볼게요. treat는 간식이나 별미라는 뜻이고, pour는 액체를 붓다, roll은 돌돌 말다라는 뜻이에요. syrup은 시럽, snow는 눈, quickly는 재빨리라는 뜻이죠. check는 확인하다, information은 정보라는 뜻도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">yummy\u003c/span>\u003cspan class=\"s\">appetizing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tasteless\u003c/span>\u003cspan class=\"a\">disgusting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"s\">famished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"s\">flawless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imperfect\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">재빨리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forget\u003c/b>\u003cspan class=\"m\">잊다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overlook\u003c/span>\u003cspan class=\"s\">neglect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remember\u003c/span>\u003cspan class=\"a\">recall\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">try\u003c/b>\u003cspan class=\"m\">시도하다, 맛보다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attempt\u003c/span>\u003cspan class=\"s\">taste\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. delicious는 맛있는이라는 뜻으로 tasty, yummy와 비슷하고 반대말은 tasteless예요. hungry는 배고픈이라는 뜻으로 starving과 가깝고 반대말은 full이죠. perfect는 완벽한이라는 뜻으로 ideal과 비슷하고 반대말은 imperfect예요. special은 특별한이라는 뜻으로 unique와 가깝고 반대말은 ordinary이고, quickly는 재빨리라는 뜻으로 rapidly와 비슷하고 반대말은 slowly예요. forget은 잊다라는 뜻으로 overlook과 가깝고 반대말은 remember라는 것도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 간식거리\u003c/span>\u003cspan class=\"en\">Delicious Treats\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 모든 흥미진진한 활동들 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">exciting \u003c/span>\u003cspan class=\"tgt\">activities\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 정말 배가 고파요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">hungry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">맛있는 간식거리 이 모든 흥미진진한 활동들 후, 저는 정말 배가 고파요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 제목인 \u003cb class=\"key\">Delicious \u003c/b>\u003cb class=\"key\">Treats\u003c/b>, 즉 맛있는 간식거리를 먼저 던진 뒤, 화자가 모든 \u003cb class=\"key\">활동\u003c/b>을 마치고 배가 고프다고 말하는 문장이에요. 그래서 바로 다음에 이어질 카니발 \u003cb class=\"key\">간식\u003c/b> 이야기를 자연스럽게 예고하는 다리 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : [After + 명사구] → '~후에'라는 시간 부사구 : \"이 모든 흥미진진한 활동들 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 주격보어\u003c/span> : [주어 I] + [be동사 am] + [형용사 hungry (주격보어)] : \"저는 정말 배가 고파요\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Delicious Treats, 맛있는 간식거리. After all these exciting activities, 이 모든 흥미진진한 활동들 후에. I'm really hungry, 저는 정말 배가 고파요. 이 문장 전체를 해석하면, 맛있는 간식거리 이 모든 흥미진진한 활동들 후, 저는 정말 배가 고파요.","hl":"m"},{"n":14,"text":"이 문장은 글의 제목인 Delicious Treats를 먼저 던지고, 화자가 모든 활동을 마친 뒤 배가 고프다고 말하고 있어요. 그래서 바로 다음에 이어질 카니발 간식 이야기를 자연스럽게 예고하는 역할을 하죠.","hl":"mn"},{"n":15,"text":"여기서 눈여겨볼 건 두 가지예요. 첫째, after는 전치사라서 뒤에 명사구가 오고, 그러면 시간을 나타내는 부사구가 됩니다. After all these exciting activities가 바로 그런 경우예요. 둘째, am은 주어 I에 맞춘 be동사이고, 뒤에 hungry라는 형용사가 와서 주어의 상태를 설명하는 주격보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 맛있는 간식들이\u003c/span>\u003cspan class=\"en\">many delicious \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">treats \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카니발에는\u003c/span>\u003cspan class=\"en\">at the carnival.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">카니발에는 먹을 맛있는 간식들이 많이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">are\u003c/b> 구문으로 카니발에 맛있는 간식들이 많이 있다는 사실을 알려 주는 문장이에요. 앞 문장에서 배가 고프다고 했으니, 그 기대를 채워 주는 \u003cb class=\"key\">간식\u003c/b> 정보를 제시하는 거죠. to eat은 '먹을'이라는 뜻으로 뒤에서 treats를 꾸며 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There be 구문(존재 표현)\u003c/span> : There + be동사 + [주어] → '~이 있다' : \"~이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 treats] + [to부정사 to eat] → '먹을 간식들' : \"먹을 간식들\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"There are, 있어요. many delicious treats, 많은 맛있는 간식들이. to eat, 먹을. at the carnival, 카니발에는. 이 문장 전체를 해석하면, 카니발에는 먹을 맛있는 간식들이 많이 있어요.","hl":"m"},{"n":17,"text":"There are 구문은 무엇이 있다는 존재를 알려 주는 표현이에요. 앞에서 배가 고프다고 했으니, 그 기대를 채워 주는 간식 정보를 바로 제시하는 거죠. to eat은 뒤에서 treats를 꾸며 먹을 간식들라는 뜻을 만들어요.","hl":"mn"},{"n":18,"text":"먼저 There are는 유도부사 there를 문장 앞에 두고 be동사 뒤에 주어를 놓아 무엇이 있다는 존재를 나타내는 구문이에요. 여기서는 treats가 복수라서 are를 썼다는 점도 기억해 두세요. 그리고 to eat은 목적을 나타내는 게 아니라 앞에 있는 명사 treats를 뒤에서 꾸며 주는 형용사 역할을 해요. 그래서 먹기 위해가 아니라 먹을 간식들로 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어때요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핫초코 한 잔\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cup \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">hot \u003c/span>\u003cspan class=\"tgt\">chocolate\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">핫초코 한 잔 어때요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003c 3cb>의미\u003c/b> 앞 문장에서 제안한 hot chocolate을 It이 받아, 추운 날씨에 딱 맞는 음료라는 점을 강조해요. 카니발에서 먹거리를 권하는 흐름 속에서 \u003cb class=\"key\">추천\u003c/b>의 이유를 보태 주는 \u003cb class=\"key\">역할\u003c/b>을 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 It의 문맥 지시\u003c/span> : It [대명사] + is [be동사] + [보어 the perfect drink] : \"그것은 ~예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사 the perfect drink] + [전치사구 in cold weather] : \"추운 날씨에 (완벽한) 음료\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It's always, 그것은 항상. the perfect drink, 완벽한 음료예요. in cold weather, 추운 날씨에. 이 문장 전체를 해석하면, 그것은 추운 날씨에 항상 완벽한 음료예요.","hl":"m"},{"n":23,"text":"여기서 It은 바로 앞 문장에 나온 hot chocolate을 가리켜요. 추운 날씨에 핫초코가 얼마나 잘 어울리는지 강조하면서, 앞에서 한 추천에 이유를 붙여 주는 문장이에요. 이렇게 이유를 붙여 주는 역할 덕분에 앞 문장의 제안이 훨씬 설득력 있게 들리죠.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 It's의 It이에요. 앞에 나온 hot chocolate을 그대로 받는 지시대명사라서, hot chocolate을 다시 쓰지 않고 It으로 짧게 표현한 거예요. 두 번째 포인트는 in cold weather인데, 이 전치사구가 앞에 있는 명사 drink를 뒤에서 꾸며 주는 형용사 역할을 해요. 그래서 추운 날씨에 마시는 완벽한 음료라는 뜻이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 또한\u003c/span>\u003cspan class=\"en\">You also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛봐야 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메이플 태피를\u003c/span>\u003cspan class=\"en\">maple taffy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 메이플 태피도 맛봐야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> also 덕분에 앞에서 권한 hot chocolate에 maple taffy를 하나 더 얹는 느낌이에요. have to는 '꼭 해야 한다'는 \u003cb class=\"key\">의무\u003c/b> 표현이지만, 여기서는 메이플 태피를 꼭 맛보라는 \u003cb class=\"key\">권유\u003c/b>의 말투로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준조동사 have to(의무)\u003c/span> : [주어] + have to + [동사원형] : \"~해야 해요\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"You also, 당신은 또한. have to try, 맛봐야 해요. maple taffy, 메이플 태피를. 이 문장 전체를 해석하면, 당신은 메이플 태피도 맛봐야 해요.","hl":"m"},{"n":26,"text":"also 덕분에 앞에서 권한 핫초코에 메이플 태피를 하나 더 얹는 느낌이에요. have to는 꼭 해야 한다는 의무 표현이지만, 여기서는 메이플 태피를 꼭 맛봐야 해요라고 권하는 권유의 말투로 쓰였어요.","hl":"mn"},{"n":27,"text":"핵심은 have to 뒤에는 반드시 동사원형이 온다는 거예요. 그래서 try가 tries나 trying이 아니라 원형 그대로 쓰였죠. 그리고 주어가 삼인칭 단수로 바뀌면 has to가 된다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들어져요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 방법으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기서\u003c/span>\u003cspan class=\"en\">here.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 여기서 특별한 방법으로 만들어져요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메이플 태피가 이곳에서만의 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">방법\u003c/b>으로 만들어진다는 걸 알려 주는 문장이에요. 그래서 바로 다음 문장에서 그 만드는 방법을 배우자고 자연스럽게 이어지죠. 앞으로 만들기 설명이 나온다는 신호를 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : It + is + made [be동사 + 과거분사] : \"그것은 만들어져요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(방법)\u003c/span> : [동사 made] + [전치사구 in a special way] : \"특별한 방법으로\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"It's made, 그것은 만들어져요. in a special way, 특별한 방법으로. here, 여기서. 이 문장 전체를 해석하면, 그것은 여기서 특별한 방법으로 만들어져요.","hl":"m"},{"n":29,"text":"이 문장은 메이플 태피가 여기서만의 특별한 방법으로 만들어진다는 걸 알려 줘요. 그래서 바로 다음 문장에서 그 만드는 방법을 배우자고 자연스럽게 이어지는 거죠. 앞으로 만들기 설명이 나올 것이라는 신호를 주는 문장이에요.","hl":"mn"},{"n":30,"text":"먼저 It's made를 보세요. be동사 뒤에 과거분사가 붙은 수동태예요. 주어 It이 만드는 사람이 아니라 만들어지는 대상이기 때문에 수동태로 쓴 거죠. 그리고 in a special way는 어떤 방법으로라는 뜻으로 동사 made를 꾸며 주는 부사 역할을 하고요. 그래서 특별한 방법으로 만들어진다는 뜻이 완성돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배워봐요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 어떻게 만드는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 어떻게 만드는지 배워봐요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메이플 태피를 여기서는 특별한 방법으로 만든다고 했으니, 이제 그 \u003cb class=\"key\">방법\u003c/b>을 함께 배워 보자고 이끄는 문장이에요. how to make it은 '그것을 어떻게 만드는지'라는 뜻으로, 만드는 \u003cb class=\"key\">방법\u003c/b> 전체를 하나로 묶은 \u003cb class=\"key\">명사구\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 (Let's + 동사원형)\u003c/span> : Let's + [동사원형 learn] → '~하자, ~해요' : \"배워봐요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (명사구)\u003c/span> : [의문사 how] + [to부정사 make] + [목적어 it] → '어떻게 ~할지' : \"그것을 어떻게 만드는지\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Let's learn, 배워봐요. how to make it, 그것을 어떻게 만드는지. 이 문장 전체를 해석하면, 그것을 어떻게 만드는지 배워봐요.","hl":"m"},{"n":32,"text":"앞에서 메이플 태피가 여기서는 특별한 방법으로 만들어진다고 했죠. 그래서 그 방법을 우리 함께 배워 보자는 청유의 말이에요. how to make it은 그것을 어떻게 만드는지, 즉 만드는 방법을 통째로 가리키는 명사 덩어리라고 보면 돼요.","hl":"mn"},{"n":33,"text":"먼저 첫 번째 포인트, Let's learn이에요. Let's는 Let us의 줄임말로 상대방에게 함께 하자고 권하는 청유 표현이에요. 그래서 Let's 뒤에는 항상 동사원형이 와서 우리 같이 배우자라는 뜻을 만들어요. 두 번째 포인트, how to make it이에요. how 같은 의문사 뒤에 to부정사가 오면 어떻게 할지라는 하나의 명사구가 되는데, 여기서는 learn의 목적어 자리에 들어가 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Pour \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뜨거운 메이플 시럽을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hot \u003c/span>\u003cspan class=\"tgt\">maple \u003c/span>\u003cspan class=\"tgt\">syrup\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈 위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">snow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">눈 위에 뜨거운 메이플 시럽을 부어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메이플 태피를 만드는 첫 번째 단계예요. 뜨거운 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>을 차가운 \u003cb class=\"key\">눈\u003c/b> 위에 붓는 장면으로, 만드는 순서를 알려 주는 \u003cb class=\"key\">지시\u003c/b>의 말이에요. 뜨거운 시럽이 찬 눈을 만나면서 굳기 시작하는 게 태피의 원리예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : [동사원형 Pour] + [목적어 hot maple syrup] : \"뜨거운 메이플 시럽을 부어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (장소)\u003c/span> : pour + [목적어] + [on + 장소] → '~ 위에 붓다' : \"눈 위에\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Pour, 부어요. hot maple syrup, 뜨거운 메이플 시럽을. on the snow, 눈 위에. 이 문장 전체를 해석하면, 눈 위에 뜨거운 메이플 시럽을 부어요.","hl":"m"},{"n":35,"text":"이 문장부터 메이플 태피 만드는 순서가 시작돼요. 눈 위에 뜨거운 메이플 시럽을 붓는 첫 번째 단계를 알려 주는 말이죠. 뜨거운 시럽이 차가운 눈을 만나 굳으면서 태피가 만들어지기 시작해요.","hl":"mn"},{"n":36,"text":"첫 번째 포인트, 동사원형 Pour로 문장이 시작하는 명령문이에요. 주어 없이 동사원형으로 시작하면 해라, 해요라는 명령이나 지시가 돼요. 두 번째 포인트, on the snow예요. pour는 무엇을 어디에 붓다라고 할 때 pour A on B 형태를 쓰는데, 여기서 A는 hot maple syrup, B는 the snow가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음 그 시럽 위에 막대를 놓고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">stick \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">syrup\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재빨리 돌돌 말아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">roll \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">around\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 그 시럽 위에 막대를 놓고 재빨리 돌돌 말아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 만드는 두 번째 단계로, 시럽 위에 \u003cb class=\"key\">막대\u003c/b>를 놓고 재빨리 돌돌 말라고 알려 줘요. 두 동작을 and로 이어서 '놓고, 그리고 말아라'라는 \u003cb class=\"key\">순서\u003c/b>를 자연스럽게 보여 줘요. 빨리 말아야 시럽이 굳기 전에 막대에 붙어 \u003cb class=\"key\">태피\u003c/b>가 완성돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형 place)\u003c/span> : [동사원형 place] + [목적어 a stick] + [전치사구 on the syrup] : \"그런 다음 그 시럽 위에 막대를 놓고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and로 연결된 병렬 명령문\u003c/span> : [명령문 place ~] + and + [명령문 roll ~] : \"그리고 재빨리 그것을 돌돌 말아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 + 목적어 + 부사 (roll it around)\u003c/span> : roll + [목적어 it] + [부사 around] : \"그것을 돌돌 말아요\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Then place a stick on the syrup, 그런 다음 그 시럽 위에 막대를 놓고. and quickly roll it around, 재빨리 돌돌 말아요. 이 문장 전체를 해석하면, 그런 다음 그 시럽 위에 막대를 놓고 재빨리 돌돌 말아요.","hl":"m"},{"n":38,"text":"바로 앞에서 눈 위에 시럽을 부었죠. 이제 그 시럽 위에 막대를 놓고 재빨리 돌돌 말라는 두 번째 단계예요. 두 동작을 and로 이어 줘서 놓고 그리고 말아라라는 순서를 자연스럽게 보여 줘요. 빨리 말아야 시럽이 굳기 전에 막대에 붙어서 태피가 완성돼요.","hl":"mn"},{"n":39,"text":"첫 번째 포인트, 여기도 동사원형 place로 시작하는 명령문이에요. place는 놓다라는 뜻으로, 막대를 시럽 위에 놓으라는 동작을 지시해요. 두 번째 포인트, and가 두 명령문을 이어 주는 병렬 구조라는 거예요. 앞의 place와 뒤의 roll이 나란히 연결돼서 놓고, 그리고 말아라라는 두 동작이 돼요. 세 번째 포인트, roll it around예요. it은 앞에 나온 시럽을 가리키고, around는 빙빙, 둘레로라는 부사로 막대에 시럽을 돌돌 감는 모양을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Now\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 메이플 태피가!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">delicious \u003c/span>\u003cspan class=\"tgt\">maple \u003c/span>\u003cspan class=\"tgt\">taffy\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 당신에게 맛있는 메이플 태피가 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 메이플 태피를 만드는 방법을 쭉 설명한 뒤, 그 결과로 완성된 것을 보여 주며 마무리하는 문장이에요. \u003cb class=\"key\">have\u003c/b>는 여기서 '가지다'보다 '~에게 있다'로 옮기는 게 자연스럽고, \u003cb class=\"key\">Now\u003c/b>는 과정이 끝나고 결과가 나왔다는 느낌을 살려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사(시간·전환)\u003c/span> : Now, + 주어 + 동사 ~ : \"이제\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유의 have\u003c/span> : 주어 + have + 목적어 : \"당신에게 맛있는 메이플 태피가 있어요\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Now, 이제. you have, 당신에게 있어요. delicious maple taffy!, 맛있는 메이플 태피가!. 이 문장 전체를 해석하면, 이제, 당신에게 맛있는 메이플 태피가 있어요!","hl":"m"},{"n":41,"text":"이 문장은 메이플 태피 만드는 방법을 다 설명한 다음에 완성된 결과를 보여 주는 문장이에요. have는 여기서 '가지다'보다 '있다'로 옮기는 게 자연스럽고, Now는 '이제'라는 결과의 느낌을 살려 줘요.","hl":"mn"},{"n":42,"text":"첫 번째로 문장 맨 앞의 Now는 문장 부사예요. 앞의 과정을 마무리하고 결과로 넘어가는 전환 표지로 쓰였죠. 두 번째로 you have delicious maple taffy는 소유의 have를 쓴 문장이에요. 사람 주어와 함께 쓰이면 우리말로는 '당신에게 맛있는 메이플 태피가 있어요'처럼 '에게 있다'로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바라요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 와서 저를 만나길\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카니발에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">carnival\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 카니발에 와서 저를 만나길 바라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카니발로 초대하는 글의 마무리 인사로, \u003cb class=\"key\">hope\u003c/b> 뒤에 내가 바라는 내용을 통째로 목적어처럼 이어 붙인 문장이에요. 접속사 that이 생략된 구조이고, come and see처럼 동작 두 개를 and로 묶어 '와서 만나다'라는 하나의 흐름으로 표현해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(명사절 목적어)\u003c/span> : I hope (that) + 주어 + 동사 ~ : \"당신이 와서 저를 만나길 바라요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and로 연결된 동사 병렬\u003c/span> : 동사원형 + and + 동사원형 : \"와서 만나다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : at + 장소 명사 : \"카니발에서\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I hope, 저는 바라요. you come and see me, 당신이 와서 저를 만나길. at the carnival, 카니발에서.. 이 문장 전체를 해석하면, 당신이 카니발에 와서 저를 만나길 바라요.","hl":"m"},{"n":44,"text":"이 문장은 카니발에 초대하는 글의 마지막 인사말이에요. hope 뒤에 내가 바라는 내용이 통째로 목적어로 들어간 구조라서 '당신이 와서 저를 만나길 바라요'라고 해석해요.","hl":"mn"},{"n":45,"text":"먼저 I hope 뒤에 오는 you come and see me는 명사절이에요. 이때 접속사 that은 회화에서 자주 생략돼서 그냥 이어 붙여 말해요. 그리고 come and see는 두 동작을 and로 이어 놓은 병렬 구조로, '와서 만나다'라는 순차 동작을 나타내요. 마지막으로 at the carnival에서 at은 특정 장소를 가리키는 전치사로, 만남이 이루어지는 장소를 덧붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오,\u003c/span>\u003cspan class=\"en\">Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잊지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 웹사이트를 확인하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">check \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">website\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 정보를 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">information\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오, 더 많은 정보를 원한다면 우리 웹사이트를 확인하는 것 잊지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정보를 안내하면서 글을 맺는 \u003cb class=\"key\">당부\u003c/b> 표현이에요. forget 뒤에 \u003cb class=\"key\">to부정사\u003c/b>를 쓰면 '앞으로 할 일을 잊다', 즉 '~하는 것을 잊지 마라'라는 뜻이 되고, for는 웹사이트를 확인하는 이유인 \u003cb class=\"key\">목적\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Don't + 동사원형 ~ : \"잊지 마세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : forget + [to check ~ (to부정사구/목적어)] : \"우리 웹사이트를 확인하는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for(목적·용도)\u003c/span> : for + 명사(목적·용도) : \"더 많은 정보를 위해\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Oh, 오. don't forget, 잊지 마세요. to check our website, 우리 웹사이트를 확인하는 것을. for more information, 더 많은 정보를 위해.. 이 문장 전체를 해석하면, 오, 더 많은 정보를 원한다면 우리 웹사이트를 확인하는 것 잊지 마세요.","hl":"m"},{"n":47,"text":"이 문장은 정보를 안내하면서 글을 맺는 당부 표현이에요. don't forget 뒤에 to부정사가 오면 '앞으로 할 일을 잊지 마라'라는 뜻이 되고, for는 그 이유인 목적을 나타내요.","hl":"mn"},{"n":48,"text":"먼저 don't forget은 상대에게 하지 말라고 당부하는 부정 명령문이에요. Don't를 문장 앞에 두면 '하지 마세요'라는 뜻이 되죠. 두 번째로 to check our website는 to부정사의 명사적 용법으로 forget의 목적어 역할을 해요. 그래서 '우리 웹사이트를 확인하는 것을 잊지 마세요'가 돼요. 세 번째로 for more information에서 for는 '을 위해'라는 목적을 나타내서, 웹사이트를 확인하는 이유를 덧붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Bye!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 방송이나 발표를 끝내는 \u003cb class=\"key\">작별 \u003c/b>\u003cb class=\"key\">인사\u003c/b>예요. 앞에서 카니발 소개와 안내를 마친 뒤 청자를 친근하게 \u003cb class=\"key\">배웅\u003c/b>하는 역할을 해요. 별다른 비유 없이 그대로 \u003cb class=\"key\">헤어짐\u003c/b>을 알리는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(작별 인사)\u003c/span> : Bye! = 헤어질 때 쓰는 작별 인사 : \"안녕!\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Bye!, 안녕!. 이 문장 전체를 해석하면, 안녕!","hl":"m"},{"n":50,"text":"이 문장은 방송이나 발표를 끝내는 작별 인사예요. 앞에서 카니발 소개와 안내를 마친 뒤 청자를 친근하게 배웅하는 역할을 하죠. 별다른 비유 없이 그대로 헤어짐을 알리는 표현이에요.","hl":"mn"},{"n":51,"text":"이 표현은 문장 성분이 따로 필요 없는 감탄사로, 친근하게 헤어질 때 쓰는 관용 표현이에요. 그래서 문법 구조를 따지기보다는 통째로 작별 인사로 익히면 됩니다. 시험에는 거의 나오지 않지만, 전체 글을 마무리하는 인사라는 점만 기억해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 카니발의 \u003cb class=\"key\">활동\u003c/b>을 마치고 \u003cb class=\"key\">배고픔\u003c/b>을 느껴, 카니발에 먹을 맛있는 \u003cb class=\"key\">간식\u003c/b>이 많다고 소개해요.\u003c/li>\u003cli>\u003cb class=\"key\">핫초코\u003c/b>는 추운 날씨에 항상 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">음료\u003c/b>로 추천되는 첫 번째 간식이에요.\u003c/li>\u003cli>\u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">태피\u003c/b>는 이곳에서 특별한 방법으로 만들어지는데, 눈 위에 뜨거운 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>을 붓고 막대로 재빨리 말아 완성해요.\u003c/li>\u003cli>화자는 카니발에 와서 자신을 만나길 바라고, 더 많은 정보를 원하면 \u003cb class=\"key\">웹사이트\u003c/b>를 확인하라고 \u003cb class=\"key\">당부\u003c/b>해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>At the carnival you can enjoy delicious treats like hot chocolate and maple taffy, and you can make maple taffy by pouring hot maple syrup on the snow and rolling it with a stick.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">카니발에서 \u003cb class=\"key\">핫초코\u003c/b>와 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">태피\u003c/b> 같은 맛있는 간식을 즐길 수 있다. 특히 눈 위에 뜨거운 \u003cb class=\"key\">메이플 \u003c/b>\u003cb class=\"key\">시럽\u003c/b>을 붓고 막대로 재빨리 말면 맛있는 메이플 태피가 완성된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글은 카니발의 맛있는 간식거리, 그중에서도 핫초코와 메이플 태피를 소개하고 만드는 방법까지 알려 주는 글이었어요. 주제문이 앞에 나오는 두괄식 구조와 Then, Now 같은 순서 신호어를 잘 기억해 두세요. 다음 시간에도 좋은 지문으로 찾아올게요. 열심히 공부한 여러분, 정말 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
