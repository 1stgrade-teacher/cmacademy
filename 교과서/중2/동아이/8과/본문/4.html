@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 8과 본문4","audioDir":"4_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Thrilling Winter Adventure: Ice Canoe Race\u003c/h1>\u003ch2>스릴 넘치는 겨울 모험: 아이스 카누 경주\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>캐나다 카니발의 하이라이트인 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">카누 \u003c/b>\u003cb class=\"key\">경주\u003c/b>는 선수들이 얼음과 강물을 헤치며 결승선까지 달리는 \u003cb class=\"key\">스릴 \u003c/b>\u003cb class=\"key\">넘치는 \u003c/b>\u003cb class=\"key\">모험\u003c/b>입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The ice canoe race is an exciting and challenging winter event where teams navigate through icy rivers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 중학교 영어 지문 중에서 겨울철 축제의 생생한 현장을 담은 아이스 카누 경주 이야기를 함께 살펴볼게요. 이 글의 요약은 카니발의 하이라이트인 경주를 통해 선수들이 추위를 이겨내는 스릴 넘치는 모험이고요, 요지는 아이스 카누 경주가 얼음과 강물을 헤치며 완주하는 매우 흥미진진한 겨울 이벤트라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">겨울철 추위를 이겨내기 위한 축제 문화는 세계 곳곳에 존재하며, 캐나다의 윈터 카니발(Winter Carnival) \u003cb class=\"key\">겨울 \u003c/b>\u003cb class=\"key\">축제\u003c/b>가 대표적입니다. 이 축제의 꽃인 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">카누 \u003c/b>\u003cb class=\"key\">경주\u003c/b>는 흐르는 얼음(floating ice)과 강물(water)을 동시에 극복해야 하는 독특한 \u003cb class=\"key\">극한 \u003c/b>\u003cb class=\"key\">스포츠\u003c/b>입니다. 마치 일상에서 예상치 못한 \u003cb class=\"key\">장애물\u003c/b>을 만나 헤쳐나가는 것과 비슷하게, 선수들은 카누를 밀며 온몸으로 자연과 맞섭니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 지문 공부에 앞서 배경지식을 넓혀볼게요. 세계 곳곳에는 추위를 이겨내기 위한 겨울 축제들이 있는데요, 대표적으로 캐나다의 윈터 카니발이 있어요. 그 축제의 꽃이 바로 오늘 배우는 얼음 위와 강물을 오가는 극한 스포츠인 아이스 카누 경주랍니다. 일상에서 예상치 못한 장애물을 만나 헤쳐나가는 것처럼, 선수들도 온몸으로 자연에 맞서는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경주 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>강가에 모인 많은 군중을 통해 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">카누 \u003c/b>\u003cb class=\"key\">경주\u003c/b>를 볼 시간이 되었음을 알리며, 카니발에서 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">놓쳐서는 \u003c/b>\u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">되는\u003c/b> 최고의 볼거리라고 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경기 규칙\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>팀원들은 얼음으로 뒤덮인 강을 따라 약 3킬로미터를 \u003cb class=\"key\">경주해야 \u003c/b>\u003cb class=\"key\">하며\u003c/b>, 보통 다섯 명의 남녀 \u003cb class=\"key\">혼성 \u003c/b>\u003cb class=\"key\">팀\u003c/b>으로 구성됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>현장 중계\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>얼음에 갇혀 움직이지 못하는 팀이 \u003cb class=\"key\">카누를 \u003c/b>\u003cb class=\"key\">밀어\u003c/b> 물가로 이동해야 하는박진감 넘치는 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>완주 기원과 마무리\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>다시 물속으로 들어간 선수들이 \u003cb class=\"key\">결승선\u003c/b>까지 무사히 가기를 바라며, 경주의 \u003cb class=\"key\">흥미진진함\u003c/b> 때문에 추위조차 잊게 된다고 말합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 경주 소개부터 경기 규칙, 현장 중계와 완주 기원으로 이어지는 전개 과정을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 구간에서는 첫 번째 문장과 두 번째 문장을 볼게요. 강가에 모인 군중을 보며 아이스 카누 경주를 볼 시간이라고 말하고, 이 경주가 카니발 최고의 볼거리라서 절대 놓쳐서는 안 된다고 강조하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 구간인 세 번째와 네 번째 문장에서는 경기 규칙을 설명해요. 팀원들은 얼어붙은 강을 따라 약 삼 킬로미터를 경주해야 하고, 남녀 모두 참여할 수 있는 혼성 팀으로 다섯 명이 한 팀을 이룬다고 했어요.","hl":"f1"},{"n":6,"text":"세 번째 구간인 다섯 번째부터 일곱 번째 문장에서는 마치 눈앞에서 경기를 보는 듯한 현장 상황을 생생하게 보여줘요. 한 팀이 얼음에 갇혀 움직이지 못하자, 팀원들이 카누를 밀어 물가로 가야 하는 긴박한 순간이 펼쳐져요.","hl":"f2"},{"n":7,"text":"네 번째 구간인 여덟 번째부터 마지막 열한 번째 문장에서는 위기를 넘긴 선수들을 응원해요. 다시 물속으로 들어간 선수들이 결승선까지 무사히 가기를 바라고, 경기가 너무 재미있어서 추위를 잊게 될 거라고 마무리하고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>인 카니발 최고의 경주를 놓치지 말라는 내용이 앞부분에 나오고, 곧바로 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>과 현장 중계라는 \u003cb class=\"key\">생생한 \u003c/b>\u003cb class=\"key\">예시\u003c/b>가 이어지기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If (1)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>and (2)\u003c/b>\u003cspan>내용 첨가\u003c/span>\u003cb>Look (5)\u003c/b>\u003cspan>시선 집중\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Ice Canoe Race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Canoe teams\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Teams\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">One team\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The members\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The race\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이번 글의 전개방식은 예시 구조예요. 카니발에서 꼭 봐야 할 경주라는 핵심 주장을 먼저 말한 뒤에, 실제 팀들이 어 3c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 경주는 카니발의 최고의 부분 중 하나라서, 당신은 그것을 놓쳐서는 안 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이스 카누 경주가 카니발에서 가장 재밌고 중요한 행사라는 점을 강조하고 있어요. 독자에게 직접 \u003cb class=\"key\">권유\u003c/b>하는 표현을 써서 꼭 보러 가라고 당부하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 최상급 + 복수명사\u003c/span> : [one of the] + [최상급] + [복수명사] : \"가장 ~한 것들 중 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 부정문\u003c/span> : [조동사 should] + [not] + [동사원형] : \"놓쳐서는 안 돼요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This race is one of the best parts of the carnival, 이 경주는 카니발의 최고의 부분 중 하나라서. and you shouldn't miss it, 당신은 그것을 놓쳐서는 안 돼요.. 이 문장 전체를 해석하면, 이 경주는 카니발의 최고의 부분 중 하나라서, 당신은 그것을 놓쳐서는 안 돼요.","hl":"m"},{"n":16,"text":"이 문장은 아이스 카누 경주가 카니발에서 얼마나 대단한 행사인지 알려주고 있어요. 절대로 놓치지 말라는 말을 통해 경주의 흥미로움을 한층 더 강조하고 있답니다.","hl":"mn"},{"n":17,"text":"이번 문장에서 꼭 알아야 할 어법은 두 가지예요. 첫 번째는 one of 최상급 복수명사 구문이에요. one of the best parts에서 보듯이 뒤에 반드시 복수명사인 parts가 와야 한다는 점을 잊지 마세요. 두 번째는 조동사 should에 낫이 붙은 shouldn't예요. 조동사 뒤에는 동사원형 miss가 와서 놓쳐서는 안 된다는 뜻을 만들어줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카누 팀들은 얼음에 뒤덮인 강을 거쳐 경주해야 해요.\u003c/span>\u003cspan class=\"en\">Canoe teams \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">race\u003c/span> through the icy river\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 3킬로미터를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003c ss=\"ko\">남성과 여성 모두\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">men \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">women\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팀에 들어갈 수 있어요.\u003c/span>\u003cspan class=\"en\">can join the team.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">팀들은 보통 다섯 명의 팀원으로 구성되고, 남성과 여성 모두 팀에 들어갈 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이스 카누 \u003cb class=\"key\">대회\u003c/b>에 참가하는 팀의 \u003cb class=\"key\">구성원\u003c/b> 조건과 성별 제한이 없음을 설명하는 문장입니다. \u003cb class=\"key\">수동태\u003c/b> 표현인 are made up of를 사용해 팀이 어떻게 이루어져 있는지 나타내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 [be동사] + [p.p. (과거분사)] + [전치사구] : \"~로 구성되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사\u003c/span> : both [A] and [B] : \"A와 B 둘 다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Teams are usually made up of, 팀들은 보통. five members, 다섯 명의 팀원으로 구성되고. and both men and women, 남성과 여성 모두. can join the team, 팀에 들어갈 수 있어요.. 이 문장 전체를 해석하면, 팀들은 보통 다섯 명의 팀원으로 구성되고, 남성과 여성 모두 팀에 들어갈 수 있어요.","hl":"m"},{"n":22,"text":"네 번째 문장은 아이스 카누 레이스에 참가하는 팀의 구성 방식을 설명하고 있어요. 남녀 구분 없이 다섯 명의 팀원으로 자유롭게 참여할 수 있다는 점을 강조하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 수동태예요. 팀이 스스로를 구성하는 게 아니라 구성되는 대상이니까 are made up of 형태의 수동태를 썼어요. 두 번째 어법 포인트는 both A and B 상관접속사예요. 남성과 여성 둘 다 참여할 수 있다는 것을 both men and women으로 짝을 지어 표현했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보세요!\u003c/span>\u003cspan class=\"en\">Look!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보세요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들의 \u003cb class=\"key\">시선\u003c/b>을 현장으로 집중시켜 경기의 생생한 \u003cb class=\"key\">상황\u003c/b>을 바로 보여주려는 의도의 문장입니다.\u003c/div>","segs":[{"n":24,"text":"Look!, 보세요!. 이 문장 전체를 해석하면, 보세요!","hl":"m"},{"n":25,"text":"다섯 번째 문장은 독자의 시선을 경기 현장으로 훅 끌어당기는 역할을 해요. 바로 눈앞에서 벌어지는 생생한 상황을 같이 보자는 의미죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 팀이 얼음에 갇혀서\u003c/span>\u003cspan class=\"en\">One team \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">stuck \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직일 수 없어요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 팀이 얼음에 갇혀서 움직일 수 없어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경기를 관람하는 현장에서 어떤 팀이 위기에 처한 \u003cb class=\"key\">돌발 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 생생하게 묘사하고 있습니다. be stuck in 표현으로 얼음에 옴짝달싹 못 하는 \u003cb class=\"key\">상태\u003c/b>를 잘 나타내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태를 나타내는 수동태 표현\u003c/span> : 주어 [be동사] + [stuck (과거분사)] + [전치사구] : \"~에 갇혀 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 병렬구조\u003c/span> : [동사구 1] and [동사구 2] : \"갇혀서 움직일 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"One team is stuck in the ice, 한 팀이 얼음에 갇혀서. and can't move!, 움직일 수 없어요!. 이 문장 전체를 해석하면, 한 팀이 얼음에 갇혀서 움직일 수 없어요!","hl":"m"},{"n":27,"text":"여섯 번째 문장은 경기를 보던 중 한 팀이 얼음판에 꽉 껴서 옴짝달싹 못 하게 된 긴박한 순간을 보여줘요. 긴장감을 높여주는 아주 실감나는 표현이죠.","hl":"mn"},{"n":28,"text":"첫 번째 어법 포인트는 is stuck이에요. 갇혀 있는 상태를 나타내기 위해 수동태 표현을 사용했죠. 두 번째 어법 포인트는 and로 연결된 병렬구조예요. 주어인 One team에 이어지는 동사구인 is stuck과 조동사 표현인 can't move가 자연스럽게 이어지고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 팀원들은\u003c/span>\u003cspan class=\"en\">The members\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀어야 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">push\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 카누를\u003c/span>\u003cspan class=\"en\">their canoe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼음 위에 있는\u003c/span>\u003cspan class=\"en\">on the ice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도착하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강물 쪽에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 팀원들은 강물 쪽에 도착하기 위해 얼음 위에 있는 카누를 밀어야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 얼음 속에 갇힌 팀원들이 다시 물로 나아가기 위해 \u003cb class=\"key\">카누를 \u003c/b>\u003cb class=\"key\">밀어내는\u003c/b> 긴박한 행동을 묘사하는 문장이에요. 이 문장은 \u003cb class=\"key\">ice \u003c/b>\u003cb class=\"key\">canoe \u003c/b>\u003cb class=\"key\">race\u003c/b>의 생생한 현장감을 전달하는 핵심적인 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 have to (~해야 한다)\u003c/span> : have to + [동사원형 (push)] : \"밀어야 해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [동사원형 (get)] : \"도착하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"The members, 그 팀원들은. have to push, 밀어야 해요. their canoe, 그들의 카누를. on the ice, 얼음 위에 있는. to get to, 도착하기 위해. the water, 강물 쪽에. 이 문장 전체를 해석하면, 그 팀원들은 강물 쪽에 도착하기 위해 얼음 위에 있는 카누를 밀어야 해요.","hl":"m"},{"n":30,"text":"얼음 속에 갇힌 팀원들이 물로 나아가기 위해 카누를 밀어내는 긴박한 행동을 묘사하는 문장이에요. 이 문장은 ice canoe race의 현장감을 생생하게 전달하는 역할을 하죠.","hl":"mn"},{"n":31,"text":"첫 번째 어법은 조동사 have to예요. 의무를 나타내는 표현으로 주어가 복수라서 have to를 쓰고 뒤에 동사원형 push를 연결했어요. 두 번째 어법은 to부정사의 부사적 용법 중 목적이에요. to get으로 쓰여서 강물에 도착하기 위해라는 의미를 더해주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴!\u003c/span>\u003cspan class=\"en\">Phew!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">휴!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위험한 고비를 넘긴 후 안도하는 \u003cb class=\"key\">감탄사\u003c/b>로, \u003cb class=\"key\">긴장감\u003c/b>을 잠시 덜어내는 생생한 표현이에요.\u003c/div>","segs":[{"n":32,"text":"Phew!, 휴!. 이 문장 전체를 해석하면, 휴!","hl":"m"},{"n":33,"text":"위험한 고비를 넘긴 후 안도하는 감탄사로, 긴장감을 잠시 덜어내는 생생한 표현이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강물 속에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시\u003c/span>\u003cspan class=\"en\">again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 다시 강물 속에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카누를 밀어 마침내 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">물속으로\u003c/b> 들어간 팀의 상황을 보여주는 문장이에요. 위기를 극복하고 \u003cb class=\"key\">레이스를 \u003c/b>\u003cb class=\"key\">계속\u003c/b> 이어가는 장면을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 (존재/위치)\u003c/span> : 주어 (They) + [be동사 (are)] + [전치사구 (in the water)] : \"강물 속에 있어요\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"They, 그들은. are, 있어요. in the water, 강물 속에. again, 다시. 이 문장 전체를 해석하면, 그들은 다시 강물 속에 있어요.","hl":"m"},{"n":35,"text":"카누를 밀어 마침내 다시 물속으로 들어간 팀의 상황을 보여주는 문장이에요. 위기를 극복하고 레이스를 계속 이어가는 장면을 나타내죠.","hl":"mn"},{"n":36,"text":"여기서는 주어의 위치를 나타내는 be동사 are가 쓰였어요. They가 복수 주어니까 are를 쓰고 뒤에 전치사구인 in the water를 연결해서 어디에 있는지 나타내고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바라요 그들이 해낼 수 있기를 결승선까지\u003c/span>\u003cspan class=\"en\">I hope they can make it to the finish line.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 그들이 결승선까지 도착할 수 있기를 바라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 얼어붙은 강을 건너는 \u003cb class=\"key\">Canoe \u003c/b>\u003cb class=\"key\">teams\u003c/b>를 응원하는 필자의 따뜻한 마음을 나타내는 문장이에요. \u003cb class=\"key\">hope\u003c/b> 다음에 접속사 that이 생략된 구조로, 뒤에 완전한 절이 이어져 목적어 역할을 하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명사절을 이끄는 접속사 that 생략\u003c/span> : [hope] + [that] + [주어] + [동사] : \"그들이 결승선까지 도착할 수 있다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"I hope, 저는 바라요. that they can make it, 그들이 해낼 수 있기를. to the finish line, 결승선까지. 이 문장 전체를 해석하면, 저는 그들이 결승선까지 도착할 수 있기를 바라요.","hl":"m"},{"n":38,"text":"얼어붙은 강을 헤쳐 나가는 팀을 향한 응원의 메시지를 담은 문장이에요. 필자가 경주 팀의 무사 완주를 간절히 바라는 마음을 표현하고 있어요.","hl":"mn"},{"n":39,"text":"이번 문장에서는 동사 hope 뒤에 목적어 절을 이끄는 접속사 that이 생략된 구조를 살펴봐야 해요. that 뒤에 주어와 동사가 완벽하게 갖춰진 절이 이어져서 목적어 역할을 톡톡히 하고 있죠. 접속사 that은 생략이 가능해서 원문처럼 바로 주어 동사가 나올 수도 있다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경주가 너무 흥미진진해서\u003c/span>\u003cspan class=\"en\">The race is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">exciting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 잊게 될 거예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추위를\u003c/span>\u003cspan class=\"en\">about the cold.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경주가 너무 흥미진진해서 당신은 추위를 잊게 될 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">Ice \u003c/b>\u003cb class=\"key\">Canoe \u003c/b>\u003cb class=\"key\">Race\u003c/b>의 박진감 넘치는 매력 덕분에 \u003cb class=\"key\">추위\u003c/b>마저 잊고 경기에 몰입하게 된다는 것을 강조하는 문장이에요. \u003cb class=\"key\">소구문\u003c/b>인 so 형용사/부사 that 주어 동사 구문을 사용하여 그 정도가 매우 심함을 나타내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문\u003c/span> : [so] + [형용사/부사] + [that] + [주어] + [동사] : \"너무 ~해서 ~하다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"The race is so exciting, 경주가 너무 흥미진진해서. that you will forget, 당신은 잊게 될 거예요. about the cold, 추위를. 이 문장 전체를 해석하면, 경주가 너무 흥미진진해서 당신은 추위를 잊게 될 거예요.","hl":"m"},{"n":41,"text":"아이스 카누 경주가 가진 엄청난 몰입감과 재미를 생생하게 전달하는 문장이에요. 추위마저 잊어버릴 정도로 경기가 흥미진진하다는 점을 강조하고 있어요. 운동 경기나 축제의 매력을 나타낼 때 아주 유용하게 쓸 수 있는 표현이에요.","hl":"mn"},{"n":42,"text":"여기서는 so 형용사 that 주어 동사 구문을 집중해서 봐두어야 해요. so exciting 바로 다음에 that이 이어져서 너무 흥미진진해서 그 결과 추위를 잊게 된다는 인과 관계를 아주 명확하게 보여주고 있죠. 시험 단골 출제 포인트니까 so와 that의 짝꿍 구조를 정확하게 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>강가에 많은 군중이 모여 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">카누 \u003c/b>\u003cb class=\"key\">경주\u003c/b>를 구경하기 시작합니다.\u003c/li>\u003cli>카누 팀들은 얼음이 가득한 강에서 \u003cb class=\"key\">약 \u003c/b>\u003cb class=\"key\">3킬로미터\u003c/b>를 경주합니다.\u003c/li>\u003cli>얼음에 갇힌 팀원들은 카누를 밀어 \u003cb class=\"key\">강물 \u003c/b>\u003cb class=\"key\">쪽으로\u003c/b> 이동합니다.\u003c/li>\u003cli>경기가 너무 흥미진진해서 관중들은 \u003cb class=\"key\">추위를 \u003c/b>\u003cb class=\"key\">잊게\u003c/b> 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The ice canoe race is an exciting and challenging winter event where teams navigate through icy rivers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">캐나다 카니발의 하이라이트인 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">카누 \u003c/b>\u003cb class=\"key\">경주\u003c/b>는 선수들이 얼음과 강물을 헤치며 결승선까지 달리는 \u003cb class=\"key\">스릴 \u003c/b>\u003cb class=\"key\">넘치는 \u003c/b>\u003cb class=\"key\">모험\u003c/b>입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 배운 아이스 카누 경주 지문은 생생한 묘사와 현장감이 살아있는 멋진 글이었어요. 배운 단어와 내용을 다시 한번 복습하고, 다음 시간에 더 재미있는 지문으로 만나요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
