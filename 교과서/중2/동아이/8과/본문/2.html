<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(이) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 8과 본문2","audioDir":"2_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Bonhomme's Magical Ice Palace\u003c/h1>\u003ch2>본홈의 마법 같은 얼음 궁전\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 매년 카니발을 위해 새로 지어지는 \u003cb class=\"key\">본홈의 \u003c/b>\u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">궁전\u003c/b>과 그 안에서 볼 수 있는 \u003cb class=\"key\">환상적인 \u003c/b>\u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">정원\u003c/b>을 소개하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Bonhomme introduces his magical ice palace and fantastic ice garden built for the carnival every year.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 동아 이 8과 본문 두 번째 시간을 함께 공부할게요. 이번 지문은 본홈의 얼음 궁전이라는 제목으로, 축제를 위해 지어진 얼음 궁전의 모습과 즐길 거리를 소개하는 글이에요. 글 전체의 요약과 요지를 머릿속에 넣고 본문으로 들어가 보죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">겨울 축제인 \u003cb class=\"key\">윈터 \u003c/b>\u003cb class=\"key\">카니발(Winter \u003c/b>\u003cb class=\"key\">Carnival)\u003c/b>에서는 얼음과 눈을 재료로 사용하여 거대한 건축물을 만드는 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">스컬프처(Ice \u003c/b>\u003cb class=\"key\">Sculpture)\u003c/b> 예술이 발달해 있습니다. 마치 겨울왕국의 성처럼 영하의 날씨 속에서 물을 뿌려가며 거대한 \u003cb class=\"key\">아이스 \u003c/b>\u003cb class=\"key\">팰리스(Ice \u003c/b>\u003cb class=\"key\">Palace)\u003c/b>를 짓는 것은 전 세계 겨울 축제의 하이라이트랍니다. 우리가 겨울에 눈사람을 만들고 놀듯이, 캐나다의 퀘벡시 등에서는 매년 겨울 거대한 얼음 궁전을 지어 사람들에게 볼거리를 제공해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 살피면서 내용을 이해해 볼게요. 겨울 축제인 윈터 카니발에서는 얼음과 눈을 재료로 사용하여 거대한 건축물을 만드는 아이스 스컬프처 예술이 발달해 있어요. 마치 겨울왕국의 성처럼 영하의 날씨 속에서 물을 뿌려가며 거대한 아이스 팰리스를 짓는 것은 전 세계 겨울 축제의 하이라이트랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>궁전 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>본홈은 매년 카니발을 위해 새로운 얼음 궁전이 \u003cb class=\"key\">지어진다\u003c/b>고 말하며, 자신은 매년 새로운 \u003cb class=\"key\">집\u003c/b>을 가지게 된다고 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>궁전의 모습\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>얼음과 눈으로 만들어진 궁전은 낮에는 \u003cb class=\"key\">아름답게 \u003c/b>\u003cb class=\"key\">빛나고\u003c/b>, 밤에는 많은 불빛들로 \u003cb class=\"key\">훨씬 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">아름답다\u003c/b>고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>정원과 즐길 거리\u003csmall>예시 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>환상적인 얼음 정원에서는 나무와 꽃, 동물의 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 볼 수 있고, 신나는 콘서트와 공연을 즐기며 \u003cb class=\"key\">춤추는 \u003c/b>\u003cb class=\"key\">법\u003c/b>을 배울 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글이 어떤 순서로 전개되는지 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째부터 세 번째 문장까지는 본홈이 자신의 얼음 궁전을 소개하고 매년 새로운 집을 가지게 된다고 말해요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째와 다섯 번째 문장에서는 얼음과 눈으로 만들어진 궁전이 낮과 밤에 어떻게 아름답게 빛나는지 설명하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째부터 열 번째 문장까지는 환상적인 얼음 정원의 조각들과 콘서트, 그리고 춤을 가르쳐 준다는 내용을 보여 주어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 자신의 \u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">궁전\u003c/b>을 직접 소개한 뒤, 궁전의 외관 특징과 정원 및 즐길 거리를 차례대로 \u003cb class=\"key\">열거\u003c/b>하며 설명하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Every year (2)\u003c/b>\u003cspan>시간\u003c/span>\u003cb>So (3)\u003c/b>\u003cspan>인과\u003c/span>\u003cb>Because (4)\u003c/b>\u003cspan>이유\u003c/span>\u003cb>At night (5)\u003c/b>\u003cspan>시간\u003c/span>\u003cb>also (8)\u003c/b>\u003cspan>첨가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ice palace\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new home\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">palace\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ice garden\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ice sculptures\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이번 글은 첫 문장에서 자신의 얼음 궁전을 직접 소개한 뒤, 궁전의 외관 특징과 정원 및 즐길 거리를 차례대로 열거하며 설명하는 두괄식 구조를 취하고 있어요.","hl":"ty"},{"n":8,"text":"문장마다 등장하는 연결고리들을 보면, 매년을 뜻하는 every year와 인과 관계를 나타내는 so, 이유를 이끄는 because, 시간을 나타내는 at night, 그리고 추가를 뜻하는 also가 아주 깔끔하게 글을 엮어 주고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>palace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>궁전\u003c/span>\u003c/div>\u003cdiv>\u003cb>every\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매~, 모든\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다, 건설하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carnival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>카니발, 축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>each\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>각각의, 매\u003c/span>\u003c/div>\u003cdiv>\u003cb>made of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>shine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빛나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beautifully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아름답게\ rrible\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exciting\u003c/b>\u003cspan class=\"m\">신나는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilling\u003c/span>\u003cspan class=\"s\">stimulating\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 볼게요. 먼저 build의 동의어로는 construct나 make가 있고, 반의어로는 destroy가 있어요. 그리고 fantastic의 동의어로는 wonderful이나 amazing을 쓸 수 있고, exciting의 반의어로는 boring을 기억해 두면 좋답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bonhomme의 얼음 궁전\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Bonhomme's \u003c/span>\u003cspan class=\"tgt\">Ice \u003c/span>\u003cspan class=\"tgt\">Palace\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 얼음 궁전이에요.\u003c/span>\u003cspan class=\"en\">my ice palace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bonhomme의 얼음 궁전 이것은 제 얼음 궁전이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본옴의 \u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">궁전\u003c/b>을 처음 소개하는 도입 문장이에요. 지문의 화자이자 안내자인 \u003cb class=\"key\">Bonhomme\u003c/b>이 자신의 거처를 직접 보여주며 이야기를 시작하는 \u003cb class=\"key\">역할\u003c/b>을 해요.\u003c/div>\u003cdiv class=\"  포인트는 like 뒤에 온 to dance예요. 동사 like는 목적어로 to부정사를 취해서 춤추는 것을 좋아하다라는 뜻을 만든다는 점을 잘 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 당신에게 가르쳐 줄 수 있어요\u003c/span>\u003cspan class=\"en\">I can teach you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 춤추는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">dance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떻게 저처럼 춤추는지 제가 당신에게 가르쳐 줄 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본문 \u003cb class=\"key\">아이스팰리스\u003c/b>의 주인인 Bonhomme이 방문객에게 친근하게 말을 건네는 부분이에요. 아이스 가든에서 즐거운 시간을 보내는 \u003cb class=\"key\">독자\u003c/b>에게 직접 \u003cb class=\"key\">춤\u003c/b>을 가르쳐 주겠다고 제안하며 축제의 흥겨운 분위기를 더 강화하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : 의문사 [how] + [to부정사구 (to dance)] : \"어떻게 춤추는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : 전치사 [like] + [대명사 (me)] : \"저처럼\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"I can teach you, 제가 당신에게 가르쳐 줄 수 있어요. how to dance, 어떻게 춤추는지. like me, 저처럼. 이 문장 전체를 해석하면, 어떻게 저처럼 춤추는지 제가 당신에게 가르쳐 줄 수 있어요.","hl":"m"},{"n":39,"text":"이 문장은 아이스 팰리스의 주인이 방문객에게 친근하게 말을 건네는 장면이에요. 축제를 즐기는 사람들에게 직접 춤을 가르쳐 주겠다고 제안하며 흥겨운 분위기를 더 강조하고 있어요.","hl":"mn"},{"n":40,"text":"첫 번째 어법 포인트는 의문사 to부정사예요. how to dance는 어떻게 춤추는지라는 뜻으로 teach 동사의 목적어 자리에 쓰였어요. 두 번째 어법 포인트는 전치사 like예요. like me라고 쓰여서 저처럼이라는 의미를 자연스럽게 만들어 주고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>매년 카니발을 위해 새로운 \u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">궁전\u003c/b>이 지어집니다.\u003c/li>\u003cli>궁전은 얼음과 눈으로 만들어져 낮과 밤에 \u003cb class=\"key\">아름답게 \u003c/b>\u003cb class=\"key\">빛납니다\u003c/b>.\u003c/li>\u003cli>정원에서는 나무와 동물의 놀라운 \u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 볼 수 있습니다.\u003c/li>\u003cli>신나는 콘서트와 공연을 즐기며 \u003cb class=\"key\">춤추는 \u003c/b>\u003cb class=\"key\">법\u003c/b>을 배울 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Bonhomme introduces his magical ice palace and fantastic ice garden built for the carnival every year.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 매년 카니발을 위해 새로 지어지는 \u003cb class=\"key\">본홈의 \u003c/b>\u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">궁전\u003c/b>과 그 안에서 볼 수 있는 \u003cb class=\"key\">환상적인 \u003c/b>\u003cb class=\"key\">얼음 \u003c/b>\u003cb class=\"key\">정원\u003c/b>을 소개하고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 배운 지문은 본홈의 얼음 궁전의 모습과 그 안에서의 즐거움을 다룬 아주 재미있는 내용이었어요. 복습을 꼼꼼히 하시고, 우리는 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
