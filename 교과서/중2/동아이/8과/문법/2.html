    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘","title":"so ~ that ... : 너무 ~해서 …하다 (Lesson 8 Point B)","audioDir":"문법_Lesson_8_-_Point_B_so_~_that_..._audio","preview":false,"count":22,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Lesson 8 - Point B: so ~ that ...\u003c/div>\u003ch1>so ~ that ... : 너무 ~해서 …하다 (Lesson 8 Point B)\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>so + 형용사/부사 + that ... 구문으로 '너무 ~해서 …하다'라는 결과를 말하고, so that(목적)과 구분할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 so와 that을 함께 쓰는 표현을 배워 볼 거예요. 어떤 일이 너무 심해서 그 결과 어떻게 되었다는 말을 영어로 아주 쉽게 만들 수 있답니다. 오늘은 예문 몇 개만 같이 소리 내어 읽어 보면 바로 감이 올 거예요. 자, 그럼 힘차게 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">so + 형용사/부사 + that ... 의 형태와 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「so + 형용사/부사 + that ...」는 '매우/너무 ~해서 …하다'라는 \u003cb class=\"key\">결과\u003c/b>의 의미를 나타냅니다. so 뒤에는 \u003cb class=\"key\">형용사\u003c/b>나 \u003cb class=\"key\">부사\u003c/b>가 오고, that 뒤에는 주어와 동사가 있는 \u003cb class=\"key\">완전한 절\u003c/b>이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">so + 형용사/부사 + that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I was \u003cspan class=\"fx\">so happy that\u003c/span> I laughed loudly.\u003c/div>\u003cdiv class=\"g-ko\">나는 너무 행복해서 크게 웃었다.\u003c/div>\u003cdiv class=\"g-note\">so 뒤에 형용사 happy, that 뒤에 완전한 절이 온 가장 기본 형태입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The girl was \u003cspan class=\"fx\">so happy that she yelled excitedly\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 소녀는 매우 행복해서 신나게 소리쳤다.\u003c/div>\u003cdiv class=\"g-note\">that 뒤에는 그 결과로 실제 일어난 일을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The line was \u003cspan class=\"fx\">so long that\u003c/span> we had to wait for 40 minutes.\u003c/div>\u003cdiv class=\"g-ko\">줄이 너무 길어서 우리는 40분 동안 기다려야만 했다.\u003c/div>\u003cdiv class=\"g-note\">so long이 원인, that 이하가 그 결과입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">She was \u003cspan class=\"fx\">so tired that\u003c/span> she fell asleep right away.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 너무 피곤해서 바로 잠들었다.\u003c/div>\u003cdiv class=\"g-note\">tired처럼 감정이나 상태를 나타내는 형용사와 잘 어울립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>so와 that 사이에 \u003cb class=\"key\">형용사\u003c/b>나 \u003cb class=\"key\">부사\u003c/b>가 들어가면 결과의 의미이고, that 뒤에는 \u003cb class=\"key\">주어 + 동사\u003c/b>를 꼭 넣어야 합니다.\u003c/div>","segs":[{"n":2,"text":"오늘 배울 표현은 so와 that을 같이 쓰는 문장이에요. so 뒤에 형용사나 부사를 넣고 that 뒤에 문장을 붙이면, 너무 어떠해서 그 결과 어떻게 되었다는 뜻이 됩니다. 예를 들어 I was so happy that I laughed loudly라고 하면 나는 너무 행복해서 크게 웃었다는 뜻이에요. 이때 that 뒤에는 주어와 동사가 다 들어 있는 완전한 문장이 와야 한다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"I was so happy that I laughed loudly. 나는 너무 행복해서 크게 웃었다는 뜻이에요. so 뒤에 happy라는 형용사가 오고, that 뒤에는 I laughed loudly라는 문장이 통째로 들어와 있죠.","hl":"ex-0"},{"n":4,"text":"The girl was so happy that she yelled excitedly. 그 소녀는 매우 행복해서 신나게 소리쳤다는 뜻이에요. 행복해서 소리쳤다는 결과가 that 뒤에 그대로 이어지고 있죠.","hl":"ex-1"},{"n":5,"text":"The line was so long that we had to wait for 40 minutes. 줄이 너무 길어서 우리는 사십 분 동안 기다려야만 했다는 뜻이에요. 줄이 길다는 원인 뒤에 기다려야 했다는 결과가 따라오는 구조예요.","hl":"ex-2"},{"n":6,"text":"She was so tired that she fell asleep right away. 그녀는 너무 피곤해서 바로 잠들었다는 뜻이에요. 피곤하다는 상태와 바로 잠들었다는 결과가 아주 자연스럽게 이어지죠.","hl":"ex-3"},{"n":7,"text":"여기서 많이 틀리는 부분이 that 뒤에 주어를 빼먹는 경우예요. that 뒤에는 반드시 주어와 동사가 함께 있는 문장이 와야 자연스러워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">so 뒤에는 형용사도 부사도 올 수 있다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">so 뒤에는 \u003cb class=\"key\">형용사\u003c/b>뿐만 아니라 \u003cb class=\"key\">부사\u003c/b>도 올 수 있습니다. be동사 뒤에서 상태를 말할 때는 \u003cb class=\"key\">형용사\u003c/b>를, 동작을 꾸밀 때는 \u003cb class=\"key\">부사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">so + 형용사 + that ... / so + 부사 + that ...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The problem was \u003cspan class=\"fx\">so difficult that\u003c/span> I couldn't solve it.\u003c/div>\u003cdiv class=\"g-ko\">그 문제는 너무 어려워서 나는 그것을 풀 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">be동사 뒤의 형용사 difficult가 so와 함께 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">David runs \u003cspan class=\"fx\">so fast that\u003c/span> no one can catch him.\u003c/div>\u003cdiv class=\"g-ko\">David는 매우 빨리 달려서 아무도 그를 잡을 수 없다.\u003c/div>\u003cdiv class=\"g-note\">동사 runs를 꾸미는 부사 fast가 so 뒤에 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The race is \u003cspan class=\"fx\">so exciting that\u003c/span> you will forget about the cold.\u003c/div>\u003cdiv class=\"g-ko\">경주는 너무 흥미진진해서 당신은 추위에 관해 잊게 될 것이다.\u003c/div>\u003cdiv class=\"g-note\">so exciting이 원인, you will forget이 결과입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The weather was \u003cspan class=\"fx\">so hot that\u003c/span> the game was canceled.\u003c/div>\u003cdiv class=\"g-ko\">날씨가 너무 더워서 그 경기는 취소되었다.\u003c/div>\u003cdiv class=\"g-note\">앞 절과 뒤 절의 시제를 같게 맞춰야 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>be동사 뒤에서 상태를 말할 때는 \u003cb class=\"key\">형용사\u003c/b>, run이나 speak 같은 동작을 꾸밀 때는 \u003cb class=\"key\">부사\u003c/b>를 so 뒤에 씁니다.\u003c/div>","segs":[{"n":8,"text":"so 뒤에 꼭 형용사만 오는 건 아니에요. 동작을 꾸며 줄 때는 부사가 와도 된답니다. David runs so fast that no one can catch him처럼 달리는 동작을 꾸미면 부사 fast가 so 뒤에 오죠. 반대로 The problem was so difficult처럼 상태를 말할 때는 형용사가 옵니다.","hl":"rule"},{"n":9,"text":"The problem was so difficult that I couldn't solve it. 그 문제는 너무 어려워서 나는 그것을 풀 수 없었다는 뜻이에요. difficult라는 형용사가 so 뒤에 와서 상태를 설명하고 있어요.","hl":"ex-0"},{"n":10,"text":"David runs so fast that no one can catch him. David는 매우 빨리 달려서 아무도 그를 잡을 수 없다는 뜻이에요. 여기서는 달리는 동작을 꾸미니까 so 뒤에 부사 fast가 온 거예요.","hl":"ex-1"},{"n":11,"text":"The race is so exciting that you will forget about the cold. 경주는 너무 흥미진진해서 당신은 추위에 관해 잊게 될 것이라는 뜻이에요. 흥미진진하다는 형용사 뒤에 추위를 잊는다는 결과가 이어지죠.","hl":"ex-2"},{"n":12,"text":"The weather was so hot that the game was canceled. 날씨가 너무 더워서 그 경기는 취소되었다는 뜻이에요. 앞에서 was를 썼으니 뒤에서도 was canceled로 시제를 맞춰 준 것도 눈여겨봐 주세요.","hl":"ex-3"},{"n":13,"text":"so 뒤에 무엇이 오는지 헷갈릴 때는 그 단어가 무엇을 꾸미는지 먼저 생각해 보세요. 상태를 꾸미면 형용사, 동작을 꾸미면 부사예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">so that은 목적, so ~ that은 결과\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">so that을 나란히 붙여 쓰면 '~하기 위해서'라는 \u003cb class=\"key\">목적\u003c/b>의 의미입니다. 반대로 so와 that 사이에 형용사나 부사가 들어가면 '너무 ~해서 …하다'라는 \u003cb class=\"key\">결과\u003c/b>의 의미입니다.\u003cdiv>\u003cspan class=\"g-formula\">so that + 주어 + can/could + 동사 = ~하기 위해서\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I spoke slowly \u003cspan class=\"fx\">so that everybody could understand\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 모두가 이해할 수 있게 하기 위해서 천천히 말했다.\u003c/div>\u003cdiv class=\"g-note\">so that이 붙어 있어 '~하기 위해서'라는 목적을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I got up early \u003cspan class=\"fx\">so that I could see the sunrise\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 해돋이를 보기 위해서 일찍 일어났다.\u003c/div>\u003cdiv class=\"g-note\">so that 뒤에 주어와 could가 와서 목적을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I was \u003cspan class=\"fx\">so tired that\u003c/span> I got up late.\u003c/div>\u003cdiv class=\"g-ko\">나는 너무 피곤해서 늦게 일어났다.\u003c/div>\u003cdiv class=\"g-note\">so와 that 사이에 형용사 tired가 있어 결과의 의미입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>so 뒤에 형용사나 부사가 끼어 있으면 \u003cb class=\"key\">결과\u003c/b>, so that이 붙어 있으면 \u003cb class=\"key\">목적\u003c/b>입니다. 목적의 so that 뒤에는 주로 \u003cb class=\"key\">can\u003c/b>이나 \u003cb class=\"key\">could\u003c/b>가 옵니다.\u003c/div>","segs":[{"n":14,"text":"이제 아주 중요한 구분을 하나 해 볼게요. so that이 나란히 붙어 있으면 무언가를 하기 위해서라는 목적의 뜻이 됩니다. 예를 들어 I got up early so that I could see the sunrise는 해돋이를 보기 위해서 일찍 일어났다는 뜻이에요. 반대로 so와 that 사이에 형용사가 들어 있으면 너무 어떠해서라는 결과의 뜻이 된답니다.","hl":"rule"},{"n":15,"text":"I spoke slowly so that everybody could understand. 나는 모두가 이해할 수 있게 하기 위해서 천천히 말했다는 뜻이에요. so that이 붙어 있으니 목적을 나타내는 표현이에요.","hl":"ex-0"},{"n":16,"text":"I got up early so that I could see the sunrise. 나는 해돋이를 보기 위해서 일찍 일어났다는 뜻이에요. so that 뒤에 I could가 와서 목적을 나타내고 있죠.","hl":"ex-1"},{"n":17,"text":"I was so tired that I got up late. 나는 너무 피곤해서 늦게 일어났다는 뜻이에요. 같은 tired라도 이번에는 so와 that 사이에 들어가서 결과를 말하고 있어요. 목적과 결과가 이렇게 갈린다는 점이 핵심이에요.","hl":"ex-2"},{"n":18,"text":"시험에서 정말 자주 나오는 구분이에요. so와 that 사이를 한번 들여다보고, 사이에 낀 단어가 있으면 결과, 없으면 목적이라고 정리해 두면 헷갈리지 않아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was so happy so that I laughed loudly.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I was so happy that I laughed loudly.\u003c/div>\u003cdiv class=\"g-why\">결과의 의미는 so ~ that으로 쓰고, so that은 목적의 의미로만 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I got up early so that see the sunrise.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I got up early so that I could see the sunrise.\u003c/div>\u003cdiv class=\"g-why\">so that 뒤에는 주어와 동사가 있는 완전한 절이 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The weather was so hot that the game is canceled.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The weather was so hot that the game was canceled.\u003c/div>\u003cdiv class=\"g-why\">앞 절이 과거이므로 that 뒤의 동사도 과거형으로 시제를 맞춰야 합니다.\u003c/div>\u003c/div>","segs":[{"n":19,"text":"결과를 말할 때 so that을 쓰면 목적처럼 들려서 어색해요. 이때는 so와 that 사이에 happy를 넣어서 I was so happy that I laughed loudly라고 해야 합니다. 사이에 형용사나 부사가 있으면 결과, 붙어 있으면 목적이라고 기억해 주세요.","hl":"mk-0"},{"n":20,"text":"so that 뒤에는 동사 원형만 덩그러니 올 수 없어요. 주어와 조동사가 함께 있는 문장이 와야 합니다. 그래서 I got up early so that I could see the sunrise처럼 I could를 넣어 줘야 자연스러워요.","hl":"mk-1"},{"n":21,"text":"so that 문장은 앞과 뒤가 한 문장처럼 이어지기 때문에 시제도 맞춰 줘야 해요. 앞에서 was라고 했으니 뒤에서도 is가 아니라 was canceled가 되어야 합니다. The weather was so hot that the game was canceled, 이렇게 말이죠.","hl":"mk-2"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Lesson 8 - Point B: so ~ that ...\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>「so + 형용사/부사 + that ...」은 '너무 ~해서 …하다'라는 \u003cb class=\"key\">결과\u003c/b>의 의미입니다.\u003c/li>\u003cli>that 뒤에는 \u003cb class=\"key\">주어 + 동사\u003c/b>가 있는 완전한 절이 옵니다.\u003c/li>\u003cli>so 뒤에는 \u003cb class=\"key\">형용사\u003c/b>와 \u003cb class=\"key\">부사\u003c/b>가 모두 올 수 있습니다.\u003c/li>\u003cli>so that이 붙어 있으면 '~하기 위해서'라는 \u003cb class=\"key\">목적\u003c/b>의 의미입니다.\u003c/li>\u003c/ul>","segs":[{"n":22,"text":"오늘은 so와 that을 이용해서 너무 어떠해서 그 결과 어떻게 되었다는 말을 배웠어요. so와 that 사이에 형용사나 부사가 들어가면 결과, so that이 붙어 있으면 목적이라는 점이 가장 중요했죠. that 뒤에는 꼭 주어와 동사가 있는 완전한 문장을 넣어 주세요. 오늘 배운 표현으로 여러분도 문장을 하나씩 만들어 보면 훨씬 오래 기억에 남을 거예요. 수고 많았습니다!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
