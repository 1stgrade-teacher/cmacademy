해 쉽고 일상적인 주제로 대화를 시작한다.</li><li>날씨나 취미 같은 쉬운 주제(easy topic)로 대화 시작</li><li>가벼운 대화(small talk)는 흥미로운 후속 주제로 이어짐</li><li>핵심 키워드: 잡담(small talk)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02적극적인 경청</div><ul><li>말하는 사람에게 집중하고 있다는 반응을 행동으로 보여준다.</li><li>눈 맞춤(eye contact) 유지하기</li><li>고개를 끄덕이거나 맞장구치기(responding)</li><li>핵심 키워드: 적극적인 경청(active listening)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신체 언어 활용</div><ul><li>표정과 제스처를 통해 전달하고자 하는 메시지를 더욱 효과적으로 강조한다.</li><li>어깨나 손을 사용한 몸짓(gestures) 활용</li><li>눈썹이나 입술을 이용한 표정(facial expressions) 사용</li><li>핵심 키워드: 신체 언어(body language)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04개인적 경험 공유</div><ul><li>자신의 이야기를 먼저 솔직하게 털어놓아 상대방과의 유대감을 형성한다.</li><li>어린 시절 이야기 등 개인적인 내용(personal story) 나누기</li><li>마음을 열면(opening up) 상대방도 대화에 적극적으로 참여함</li><li>핵심 키워드: 자기 개방(self-disclosure)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05상호 존중 유지</div><ul><li>다양한 의견을 가진 상대방을 존중하며 대화를 건강하게 마무리한다.</li><li>다른 사람의 의견(opinions)을 존중하는 태도 보이기</li><li>반대 의견은 예의 바르게 표현하기(showing respect)</li><li>핵심 키워드: 존중(respect)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have trouble</td><td class=\"m\">~하는 데 어려움을 겪다, ~하느라 고생하다</td></tr><tr><td class=\"w\">small talk</td><td class=\"m\">잡담, 한담</td></tr><tr><td class=\"w\">sit still</td><td class=\"m\">가만히 앉아 있다, 움직이지 않다</td></tr><tr><td class=\"w\">from time to time</td><td class=\"m\">때때로, 가끔</td></tr><tr><td class=\"w\">body language</td><td class=\"m\">신체 언어, 몸짓</td></tr><tr><td class=\"w\">open up</td><td class=\"m\">마음을 터놓다, 공개하다</td></tr><tr><td class=\"w\">topic</td><td class=\"m\">주제, 화제</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actively</td><td class=\"m\">적극적으로, 활발히</td></tr><tr><td class=\"w\">gesture</td><td class=\"m\">제스처, 몸짓</td></tr><tr><td class=\"w\">facial</td><td class=\"m\">얼굴의, 얼굴 표정의</td></tr><tr><td class=\"w\">expression</td><td class=\"m\">표현, 표정</td></tr><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는, 중요한</td></tr><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해</td></tr><tr><td class=\"w\">disagree</td><td class=\"m\">동의하지 않다, 의견을 달리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즐겁게 대화하세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">Have a Good Talk!</span></b></span></div></div><div class=\"lec-sent-ko\">좋은 대화를 나눠라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 배경을 설정하며, 학생들이 새로운 친구들을 만나 대화를 시작해야 하는 상황이 되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have a Good Talk! (관용표현): &#39;좋은 대화를 나누다&#39;라는 의미의 관용적 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새 학년이</span><span class=\"en\"><b>The new school year <span class=\"grammar-hl\">is here</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작되었습니다!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">새 학년이 되었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 배경을 설정하며, 학생들이 새로운 친구들을 만나 대화를 시작해야 하는 상황이 되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is here (관용표현): &#39;(시간/상황이) 다가오다/도래하다&#39;라는 의미로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긴장되나요</span><span class=\"en\"><b>Do you get nervous</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 학생들과 이야기할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when you talk to other students</span>?</b></span></div></div><div class=\"lec-sent-ko\">당신은 다른 학생들과 대화할 때 긴장되는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 겪을 법한 보편적인 불안감을 질문으로 던져, 글의 주제인 &#39;대화법&#39;에 관심을 가지도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when you talk to other students (관계부사(시간)): 접속사 when이 이끄는 부사절로, &#39;학생들과 대화할 때&#39;라는 시간을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어려움이 있나요</span><span class=\"en\"><b>Do you <span class=\"grammar-hl\">have trouble</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대화를 시작하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">starting conversations</span>?</b></span></div></div><div class=\"lec-sent-ko\">당신은 대화를 시작하는 데 어려움이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문을 구체화하여, 대화의 &#39;시작&#39;이라는 구체적인 문제 상황을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have trouble starting conversations (관용표현): &#39;have trouble + -ing(동명사)&#39; 구조로, &#39;~하는 데 어려움을 겪다&#39;라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have trouble</td><td class=\"m\">~하는 데 어려움을 겪다, ~하느라 고생하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">좋은 대화를 나누는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Having a good conversation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽지 않습니다.</span><span class=\"en\"><b>is not easy.</b></span></div></div><div class=\"lec-sent-ko\">대화를 잘하는 것은 쉽지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대화가 어렵다는 점을 인정하며, 독자가 느끼는 고충에 공감하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Having a good conversation (동명사): 문장에서 주어 역할을 하는 -ing 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But <span class=\"grammar-hl\">don’t worry</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걱정하지 마세요.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">하지만 걱정하지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대화의 어려움을 해결할 수 있다는 희망을 제시하며 다음 내용으로 자연스럽게 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t worry (관용표현): 부정 명령문으로, 상태를 나타내는 동사 worry와 함께 사용됩니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 조언이 여기 있습니다</span><span class=\"en\"><b>Here are some <span class=\"grammar-hl\">tips</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 대화를 나누기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">to have a good conversation</span>.</b></span></div></div><div class=\"lec-sent-ko\">여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 나올 구체적인 조언들이 문제 해결을 위한 전략임을 명시합니다. 7. 1. Start with small talk. 첫 번째 전략으로 대화의 물꼬를 트는 쉬운 방법을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tips to have a good conversation (to부정사): 앞의 명사 tips를 수식하는 형용사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1. 시작하세요</span><span class=\"en\"><b>1. <span class=\"grammar-hl\">Start with</span> small talk.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가벼운 대화로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">1. 가벼운 대화로 시작해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가벼운 대화를 실천하기 위한 구체적인 방법론을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Start with (관용표현): &#39;~로 시작하다&#39;라는 의미의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">small talk</td><td class=\"m\">잡담, 한담</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대화를 시작하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Begin conversations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉬운 주제로</span><span class=\"en\"><b>with an easy topic.</b></span></div></div><div class=\"lec-sent-ko\">쉬운 주제로 대화를 시작해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가벼운 대화를 실천하기 위한 구체적인 방법론을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Begin conversations 5형식(SVOC) 구조: 본 문장은 명령문이며, &#39;대화를 시작하라&#39;는 의미의 동사-목적어 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">topic</td><td class=\"m\">주제, 화제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이야기해 보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Talk about</span> the weather or hobbies.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨나 취미에 대해</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">날씨나 취미에 관해 말해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 화제를 예시로 들어 실천 가능성을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Talk about (관용표현): &#39;~에 대해 이야기하다&#39;라는 의미의 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말해 보세요</span><span class=\"en\"><b>say, “The weather is so nice today, <span class=\"grammar-hl\">isn’t it?</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“오늘 날씨가 참 좋죠, 그렇지 않나요?”라고</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">예를 들면, “오늘 날씨가 아주 좋아, 그렇지 않니?”라고 말해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 날씨를 언급하는 구체적인 대사 예시를 통해 독자가 바로 적용하게 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">isn’t it? (관용표현): 부가의문문으로, 앞 문장의 긍정 내용을 확인/동의를 구하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면 상대방이</span><span class=\"en\"><b>Then the other person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 대답할 수 있습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can answer</span> easily.</b></span></div></div><div class=\"lec-sent-ko\">그러면 상대방은 쉽게 대답할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가벼운 주제가 상대방의 부담을 줄여 대화를 원활하게 만든다는 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can answer 조동사 구문: 능력과 가능성을 나타내는 조동사 can과 동사원형 answer가 결합된 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가벼운 대화는</span><span class=\"en\"><b>Small talk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 재미있는 주제로 이어질 수 있습니다</span><span class=\"en\"><b>can lead to other fun <span class=\"grammar-hl\">topics</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기할</span><span class=\"en\"><b><span class=\"grammar-hl\">to talk about</span>.</b></span></div></div><div class=\"lec-sent-ko\">가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가벼운 대화가 대화의 확장성을 높여준다는 점을 강조합니다. 13. 2. Listen actively. 대화의 두 번째 핵심 요소로 &#39;듣기&#39;를 제시하며 능동적인 태도를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">topics to talk about (to부정사): 앞의 명사 topics를 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">small talk</td><td class=\"m\">잡담, 한담</td></tr><tr><td class=\"w\">topic</td><td class=\"m\">주제, 화제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2. 들으세요</span><span class=\"en\"><b>2. <span class=\"grammar-hl\">Listen actively</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적극적으로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">2. 적극적으로 들어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 능동적 태도가 대화의 질을 결정한다는 글쓴이의 중심 생각을 반복합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Listen actively (관용표현): 명령문 구조로, 부사 actively가 동사 listen을 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actively</td><td class=\"m\">적극적으로, 활발히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그냥 가만히 앉아서</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t just sit still</span> and listen.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">듣기만 하지 마세요.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그저 가만히 앉아서 듣지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소극적인 듣기를 지양해야 함을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t just sit still (관용표현): 부정 명령문으로, sit still은 &#39;가만히 앉아 있다&#39;는 뜻의 형용사 보어를 취하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sit still</td><td class=\"m\">가만히 앉아 있다, 움직이지 않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">적극적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">Actively listen</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들으세요.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">적극적으로 들어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경청을 실천하는 첫 번째 방법으로 시각적 소통의 중요성을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Actively listen (관용표현): 명령문 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actively</td><td class=\"m\">적극적으로, 활발히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 17 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">눈을 맞춰라</span><span class=\"en\"><b><span class=\"grammar-hl\">Make eye contact</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화자와.</span><span class=\"en\"><b>with the speaker.</b></span></div></div><div class=\"lec-sent-ko\">화자와 눈을 맞춰라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경청을 실천하는 첫 번째 방법으로 시각적 소통의 중요성을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Make eye contact (관용표현): &#39;눈을 맞추다&#39;라는 의미의 명사 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고개를 끄덕여라</span><span class=\"en\"><b>Nod your head</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가끔씩.</span><span class=\"en\"><b><span class=\"grammar-hl\">from time to time</span>.</b></span></div></div><div class=\"lec-sent-ko\">때때로 당신의 고개를 끄덕여라.</div></div>\n td class=\"w\">body language</td><td class=\"m\">신체 언어, 몸짓</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 27 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">4. 여러분의 이야기를 공유하라.</span><span class=\"en\"><b>4. <span class=\"grammar-hl\">Share your story</span>.</b></span></div></div><div class=\"lec-sent-ko\">4. 당신의 이야기를 공유해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자기 공개가 어느 정도의 용기를 필요로 한다는 점을 인정하며 실행을 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Share your story (관용표현): 명령문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">용기를 내어</span><span class=\"en\"><b><span class=\"grammar-hl\">Be brave</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 개인적인 이야기를 하라.</span><span class=\"en\"><b>and tell your personal story.</b></span></div></div><div class=\"lec-sent-ko\">용기를 내어 당신의 개인적인 이야기를 말해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자기 공개가 어느 정도의 용기를 필요로 한다는 점을 인정하며 실행을 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Be brave (관용표현): 형용사 brave를 보어로 취하는 명령문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 어린 시절에 대해 이야기할 수 있다.</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">talk about your childhood</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들면, 당신은 어린 시절에 관해 말할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친밀감을 형성하기 쉬운 보편적인 화제를 예시로 듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talk about your childhood (관용표현): &#39;~에 대해 이야기하다&#39;라는 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 말할 수 있다</span><span class=\"en\"><b>You can say, “When I was 10,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“제가 10살이었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">I was the slowest runner</span> in my class.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 우리 반에서 가장 달리기 느린 사람이었어요,”라고.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">당신은 “내가 10살이었을 때, 나는 반에서 달리기가 가장 느린 주자였어.”라고 말할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 자기 고백의 예시를 통해 대화의 문턱을 낮춰줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was the slowest runner (관용표현): 최상급 형용사(slowest)를 사용한 명사 수식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 마음을 열면</span><span class=\"en\"><b>When you <span class=\"grammar-hl\">open up</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대방도</span><span class=\"en\"><b>the other person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똑같이 할 것이다.</span><span class=\"en\"><b>will do the same.</b></span></div></div><div class=\"lec-sent-ko\">당신이 마음을 열 때, 상대방도 똑같이 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상호 교환의 원리를 설명하며, 자신의 개방이 상대방의 참여를 유도한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">open up (관용표현): &#39;마음을 열다&#39;라는 의미의 자동사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">open up</td><td class=\"m\">마음을 터놓다, 공개하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 32 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~로 이어질 수 있다</span><span class=\"en\"><b>This can lead to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 의미 있는 대화.</span><span class=\"en\"><b>a more meaningful conversation.</b></span></div></div><div class=\"lec-sent-ko\">이것은 더 의미 있는 대화로 이어질 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자기 공유가 얕은 대화에서 깊은 대화로 나아가는 동력이 됨을 설명합니다. 32. 5. Respect others. 대화의 기본 전제로서 상대방에 대한 존중을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do the same (대동사): do가 앞의 open up(일반동사) 내용을 대신하여 반복을 피하는 대동사로 쓰였습니다. 앞의 동사가 일반동사이므로 do를 씁니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meaningful</td><td class=\"m\">의미 있는, 중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 33 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">존중하세요</span><span class=\"en\"><b>Respect others.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">5. 다른 사람들을 존중해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대화에서 갈등이 생기는 근본적인 이유를 설명합니다.</div>\ \"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">와 같은 말을 하세요</span><span class=\"en\"><b>Say things like, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“정말 흥미롭네요.”</span><span class=\"en\"><b>“That’s really interesting.”</b></span></div></div><div class=\"lec-sent-ko\">“그것은 정말 흥미롭구나.”와 같은 것들을 말해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 존중을 표현하는 구체적인 대화 전략을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to respect others’ ideas (to부정사): 동사 need의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 37 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">의견이 다를 때는</span><span class=\"en\"><b>When you disagree,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말할 수 있는데</span><span class=\"en\"><b>you can say, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“좋은 지적이지만,</span><span class=\"en\"><b>“That’s a good point,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 의견이 달라요”라고.</span><span class=\"en\"><b>but I have a different opinion.”</b></span></div></div><div class=\"lec-sent-ko\">당신이 동의하지 않을 때는, “좋은 지적이야, 하지만 나는 다른 의견이 있어.”라고 말할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 갈등 상황에서도 존중을 유지하며 자신의 견해를 밝히는 기술을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Say things like (관용표현): &#39;~와 같은 것을 말하라&#39;는 명령문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opinion</td><td class=\"m\">의견, 견해</td></tr><tr><td class=\"w\">disagree</td><td class=\"m\">동의하지 않다, 의견을 달리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 38 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들에게 존중을 보여주면</span><span class=\"en\"><b>Show respect to others,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들도 여러분에게 존중을 보여줄 것입니다.</span><span class=\"en\"><b>and they will show respect to you.</b></span></div></div><div class=\"lec-sent-ko\">다른 사람들에게 존중을 보여라, 그러면 그들은 당신에게 존중을 보여줄 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대화의 상호 존중이 결국 나에게 돌아온다는 보상을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">disagree (관용표현): 의견이 다름을 나타내는 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 39 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 조언들을 따르면</span><span class=\"en\"><b>Follow these tips,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두가</span><span class=\"en\"><b>and everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분과 대화하고 싶어 할 것입니다.</span><span class=\"en\"><b>will want to talk with you.</b></span></div></div><div class=\"lec-sent-ko\">이 조언들을 따라라, 그러면 모든 사람이 당신과 이야기하고 싶어 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 조언을 따르면 얻게 될 긍정적인 결론을 이야기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Show respect to others (관용표현): 명령문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 40 / 40</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 될 것입니다</span><span class=\"en\"><b>You will be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 훌륭한 대화 상대가</span><span class=\"en\"><b>the greatest talker</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학급에서.</span><span class=\"en\"><b>in the class.</b></span></div></div><div class=\"lec-sent-ko\">당신은 반에서 가장 대화를 잘하는 사람이 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 얻게 될 최종 성취를 언급하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Follow these tips (관용표현): 명령문 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>새 학년을 맞아 대화를 힘들어하는 학생들을 위한 5가지 대화법을 제안한다.</li><li>가벼운 대화로 시작해 적극적으로 경청하고 몸짓 언어를 활용한다.</li><li>자신의 이야기를 공유하고 상대방을 존중하는 태도를 갖춘다.</li><li>이러한 대화 전략을 활용하면 누구나 대화의 달인이 될 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Following basic techniques like small talk and active listening helps bridge connections, while respecting others fosters more meaningful interactions.</div>\n              <div class=\"lec-final-sum-ko\">스몰 토크나 적극적 경청 같은 기본 기술을 따르는 것은 관계의 가교 역할을 하며, 타인을 존중하는 태도는 더 의미 있는 상호작용을 촉진한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/
