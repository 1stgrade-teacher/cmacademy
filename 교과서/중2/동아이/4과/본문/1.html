훨씬 더 생생하게 이야기를 즐기실 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지하철 이동</div><ul><li>런던에서 지하철을 타며 아멜리아와 나눈 대화가 시작된다.</li><li>아멜리아가 제안한 이동 수단: 튜브(tube)</li><li>런던에서 지하철을 튜브라고 부르는 이유 확인</li><li>핵심 키워드: 지하철(subway), 튜브(tube)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02명칭의 유래</div><ul><li>지하철 터널의 모양이 튜브와 유사하기 때문에 붙여진 이름이다.</li><li>터널(tunnels)의 모양이 둥글다는 점 강조</li><li>튜브(tube)와 같은 형태적 특징 설명</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03빨간색의 탐색</div><ul><li>런던을 상징하는 특별한 색인 빨간색에 대해 이야기한다.</li><li>런던에서 빨간색(red)의 특별한 의미</li><li>도시 곳곳에서 빨간 사물들을 찾아보는 활동 제안</li><li>핵심 키워드: 빨간색(red), 특별한 색(special color)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">it is time to</td><td class=\"m\">~할 시간이다, ~할 때이다</td></tr><tr><td class=\"w\">take</td><td class=\"m\">(교통수단을) 이용하다, 타다</td></tr><tr><td class=\"w\">subway</td><td class=\"m\">지하철, 지하도</td></tr><tr><td class=\"w\">round</td><td class=\"m\">둥근, 원형의</td></tr><tr><td class=\"w\">certainly</td><td class=\"m\">확실히, 틀림없이</td></tr><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지하에서의</span><span class=\"en\"><b><span class=\"grammar-hl\">Traveling</span> Underground</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여행</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(지하에서의 여행)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 주인공과 아멜리아가 일정을 마치고 이동을 시작하는 상황을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Traveling (동명사): 문장의 제목에서 -ing가 &#39;여행하기&#39;라는 행위/활동을 나타내는 명사적 기능으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">round</td><td class=\"m\">둥근, 원형의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span> was time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 갈</span><span class=\"en\"><b><span class=\"grammar-hl\">to go</span> home.</b></span></div></div><div class=\"lec-sent-ko\">집에 갈 시간이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 주인공과 아멜리아가 일정을 마치고 이동을 시작하는 상황을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It (가주어): 진주어: 문장 맨 앞의 It은 가주어이며, 뒤의 to go home(집에 갈 시간)이 진주어 역할을 합니다.</div><div class=\"lec-gr-item\">to go (to부정사): 가주어 It의 진주어로 쓰여 &#39;집에 가는 것&#39;이라는 명사적 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Amelia는</span><span class=\"en\"><b>Amelia said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“튜브를 타자.”라고 말했다.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Let’s</span> take the tube.”</b></span></div></div><div class=\"lec-sent-ko\">Amelia는 “튜브를 타자.”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 상황에서 집으로 가기 위해 지하철을 이용하자는 아멜리아의 제안을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s (관용표현): Let us의 줄임말로,         <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">call the subway the tube 5형식(SVOC) 구조: &#39;주어(we) + 동사(call) + 목적어(the subway) + 목적보어(the tube)&#39; 형태로, 목적어를 목적보어라고 부른다는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subway</td><td class=\"m\">지하철, 지하도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~기 때문이야.</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지하철 터널들이</span><span class=\"en\"><b>the subway tunnels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원형인</span><span class=\"en\"><b>are round</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관처럼</span><span class=\"en\"><b>like a tube.”</b></span></div></div><div class=\"lec-sent-ko\">그것은 지하철 터널들이 관[통]처럼 원형이기 때문이야.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지하철을 타고 이동하는 중에 대화의 주제를 런던의 상징색인 &#39;빨간색&#39;으로 전환하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s because (관용표현): &#39;그것은 ~하기 때문이다&#39;라는 의미로 원인이나 이유를 설명할 때 쓰는 관용구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subway</td><td class=\"m\">지하철, 지하도</td></tr><tr><td class=\"w\">round</td><td class=\"m\">둥근, 원형의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">튜브에서,</span><span class=\"en\"><b><span class=\"grammar-hl\">On the tube</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Amelia가 내게 물었다,</span><span c
