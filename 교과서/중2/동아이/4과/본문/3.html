든 마켓 방문</div><ul><li>런던의 명소인 캠든 마켓을 찾아가 세계 각국의 음식을 접하게 된다.</li><li>방문 장소: 캠든 마켓(Camden Market)</li><li>특징: 세계 각지의 다양한 음식(food from around the world)이 유명함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02영국식 식문화 체험</div><ul><li>영국의 대표 음식인 피시 앤 칩스를 주문하며 문화적 차이를 경험한다.</li><li>추천 음식: 피시 앤 칩스(fish and chips)</li><li>문화적 발견: 영국에서 감자튀김을 칩스(chips)라고 부름</li><li>핵심 키워드: 문화적 차이(cultural difference)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03마켓 둘러보기 및 추억 남기기</div><ul><li>식사 후 시장을 구경하며 상징적인 영국 문화를 사진으로 기록한다.</li><li>관광 활동: 시장 산책(walked around)</li><li>주요 촬영지: 붉은 공중전화 부스(red phone booth)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기념품 구매 및 마무리</div><ul><li>여행의 마지막으로 가족을 위한 선물을 사며 즐거운 하루를 정리한다.</li><li>쇼핑: 어머니를 위한 예쁜 접시(pretty plate) 구매</li><li>소감: 매우 즐거운 하루(a fun day)였음을 느낌</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known for</td><td class=\"m\">~로 유명한, ~로 잘 알려진</td></tr><tr><td class=\"w\">strange</td><td class=\"m\">이상한, 낯선</td></tr><tr><td class=\"w\">yummy</td><td class=\"m\">맛있는, 아주 맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음으로,</span><span class=\"en\"><b>Yummy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 갔다</span><span class=\"en\"><b>Meal <span class=\"grammar-hl\">Next, we went to Camden Market.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠던 마켓에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">다음으로, 우리는 캠던 마켓에 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 일정에서 장소를 이동하여 새로운 장소인 캠든 마켓에 도착했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Next, we went to Camden Market. (부사구): 문장 처음에 위치한 Next가 시간적 순서를 나타내는 부사 역할을 하며 문장 전체를 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">yummy</td><td class=\"m\">맛있는, 아주 맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 시장은</span><span class=\"en\"><b>This market</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is known for</span> its food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계 곳곳에서 온 음식으로</span><span class=\"en\"><b>from around the world.</b></span></div></div><div class=\"lec-sent-ko\">이 시장은 세계 곳곳의 음식으로 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 캠든 마켓이 어떤 곳인지 부연 설명하며, 방문자가 왜 이곳을 찾았는지 그 이유를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is known for (수동태): be동사(is)+p.p.(known) 구조입니다. know는 타동사인데 목적어가 없어서 수동구조 is known 형태로 씁니다. 기본구조: know + O(목적어) + for B(~로 ~를 알다) 형태이며, 목적어가 주어로 올라가 수동태가 되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known for</td><td class=\"m\">~로 유명한, ~로 잘 알려진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아멜리아는</span><span class=\"en\"><b>Amelia</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나에게 말했다</span><span class=\"en\"><b><span class=\"grammar-hl\">told me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피시앤칩스를 먹어 보라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to try</span> the fish and chips.</b></span></div></div><div class=\"lec-sent-ko\">Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행 동행인인 아멜리아의 권유를 통해 본격적인 시장 체험이 시작됨을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">told me to try 5형식(SVOC) 구조: tell + O(me) + toV(to try) 형태의 5형식 문장입니다. 목적어인 me가 보어인 to부정사를 하도록 지시하거나 요청하는 의미를 가집니다.</div><div class=\"lec-gr-item\">to try (to부정사): 5형식 문장에서 목적어(me)의 행동을 보충 설명하는 목적격 보어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생각했다,</span><span class=\"en\"><b>I thought,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;얼마나 이상한가!</span><span class=\"en\"><b>\"<span class=\"grammar-hl\">How strange!</span></b></span></div></div><div class=\"lec-sent-ko\">나는 생각했다, “이상하네!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 피시 앤 칩스라는 메뉴 이름을 들었을 때 작성자가 예상했던 것과 실제가 다를 것이라는 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How strange! (감탄문): &#39;How + 형용사!&#39; 구조로, 감정을 강조하여 표현하는 문장 패턴입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">strange</td><td class=\"m\">이상한, 낯선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생선을 먹어 왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">I have eaten</span> fish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 번</span><span class=\"en\"><b>many times.</b></span></div></div><div class=\"lec-sent-ko\">나는 생선을 여러 번 먹어 봤어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;피시&#39;라는 단어에 대한 작성자의 기존 경험을 언급하여, 왜 그가 이 음식 이름을 이상하게 느꼈는지 이유를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I have eaten (현재완료): have + p.p.(eaten) 구조로, 과거부터 현재까지 반복된 경험이나 상태를 나타낼 때 사용합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 그것을 먹어 본 적이 없다</span><span class=\"en\"><b>I've never tried it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감자칩과 함께.&quot;</span><span class=\"en\"><b>with potato chips.\"</b></span></div></div><div class=\"lec-sent-ko\">하지만 나는 감자칩과 함께 먹어 본 적은 없어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;칩스&#39;를 우리가 흔히 아는 얇은 감자 과자로 오해하여 발생한 작성자의 의구심을 구체적으로 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have never tried (현재완료): have + p.p.(tried) 구조로, 과거부터 현재까지 특정 행위를 경험하지 않았음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식이 나왔을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when the food came out</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 알게 되었다</span><span class=\"en\"><b>I found out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 프렌치프라이를 &#39;칩스&#39;라고 부른다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that they call French fries \"chips\"</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던에서는!</span><span class=\"en\"><b>in London!</b></span></div></div><div class=\"lec-sent-ko\">그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 ‘칩스’라고 부른다는 것을 알게 되었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 발생했던 음식 이름에 대한 오해가 풀리는 장면으로, 문화적 차이에서 오는 재미있는 발견을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when the food came out (분사구문(대조)): when + S(the food) + V(came) 형태로, 특정 시점을 나타내는 부사절입니다.</div><div class=\"lec-gr-item\">that they call French fries &quot;chips&quot; 5형식(SVOC) 구조: call + O(French fries) + C(chips) 형태입니다. 목적어인 French fries를 chips라고 부른다는 목적보어 관계가 성립합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">맛있는 영국 음식을 먹은 후,</span><span class=\"en\"><b><span class=\"grammar-hl\">After a yummy British meal</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 돌아다녔다</span><span class=\"en\"><b>we walked around the market.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시장을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식사라는 목적을 달성한 후, 시장 구경이라는 다음 활동으로 자연스럽게 이야기가 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After a yummy British meal (전치사구): After가 뒤의 명사구(a yummy British meal)와 결합하여 전체 문장의 시간적 배경을 설명하는 부사 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">yummy</td><td class=\"m\">맛있는, 아주 맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 유명한 빨간색 공중전화 부스를 보았고</span><span class=\"en\"><b>We saw the <span class=\"grammar-hl\">famous</span> red phone booth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 사진을 찍었다</span><span class=\"en\"><b>and took more pictures.</b></span></div></div><div class=\"lec-sent-ko\">우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시장을 둘러보며 관광지에서 흔히 볼 수 있는 풍경을 즐기는 여행자의 모습을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">famous 형용사: 명사 phone booth를 수식하며 사물의 상태나 성질을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 예쁜 접시를 하나 샀다</span><span class=\"en\"><b>I bought <span class=\"grammar-hl\">a pretty plate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마를 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">for my mom</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 마무리에 기념품을 구매하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a pretty plate for my mom (전치사구): for my mom이 앞의 명사구인 a pretty plate를 수식하여 &#39;누구를 위한 것인지&#39; 대상을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말 즐거운 하루인가!</span><span class=\"en\"><b><span class=\"grammar-hl\">What a fun day!</span></b></span></div></div><div class=\"lec-sent-ko\">정말 재밌는 하루였다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 여행 일정을 마무리하며 느낀 감정을 요약하는 결론적인 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What a fun day! (감탄문): &#39;What + a(n) + 형용사 + 명사!&#39; 구조로, 하루에 대한 감상을 강조할 때 쓰는 구문입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>캠든 마켓을 방문하여 전 세계의 음식을 구경했다.</li><li>&#39;피시 앤 칩스&#39;라는 이름에 대한 오해를 통해 영국식 표현을 배우게 되었다.</li><li>식사 후 시장을 둘러보고 기념품을 사며 즐거운 여행의 마무리를 했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author explored Camden Market to taste British food, and they enjoyed taking photos and shopping for souvenirs.</div>\n              <div class=\"lec-final-sum-ko\">저자는 영국 음식을 맛보기 위해 캠든 마켓을 탐험했으며, 사진 촬영과 기념품 쇼핑을 즐겼다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meani
