상징과도 같은 &#39;버킹엄 궁전(Buckingham Palace)&#39;과 그곳을 지키는 &#39;근위병(King&#39;s Guard)&#39;에 대해 알아두면 훨씬 흥미로울 거예요. 영국 왕실의 공식 거주지인 버킹엄 궁전은 영국을 대표하는 랜드마크인데, 이곳 앞을 지키는 근위병들은 감정을 드러내지 않고 부동자세를 유지하는 것으로 매우 유명하죠. 마치 마네킹이나 살아있는 조각상처럼 꼼짝도 하지 않는 이들의 모습은 엄격한 군기에서 비롯된 전통인데, 실제로는 외부의 방해에도 흔들리지 않고 왕실을 보호하겠다는 강한 의지가 담겨 있답니다. 이런 독특한 문화적 맥락을 이해하고 글을 읽는다면, 수빈이가 목격한 근위병들의 모습이 왜 그토록 신기하고 인상 깊었는지 훨씬 생생하게 공감하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행의 시작</div><ul><li>런던으로의 긴 비행을 마치고 오랜 친구 아멜리아와 재회하며 여행이 시작되었다.</li><li>인천에서 런던까지 15시간의 비행(flight)</li><li>10살 때부터 알고 지낸 친구 아멜리아(Amelia)와의 만남</li><li>핵심 키워드: 여행(trip), 재회(reunion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02런던의 랜드마크 방문</div><ul><li>런던의 상징인 빨간 버스를 타고 영국 왕실의 상징인 버킹엄 궁전을 방문했다.</li><li>명물인 빨간 버스(red bus) 탑승</li><li>버킹엄 궁전(Buckingham Palace) 관람</li><li>핵심 키워드: 국왕(King), 왕실 가족(Royal family)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03근위병 관람</div><ul><li>궁전 앞에서 움직이지 않고 절도 있게 서 있는 근위병들의 모습을 구경했다.</li><li>붉은 재킷(red jackets)과 검은 모자(tall black hats)를 쓴 근위병</li><li>감정을 드러내지 않고 동상처럼 움직이지 않는 모습</li><li>핵심 키워드: 근위병(King&#39;s Guard), 동상(statues)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">can&#39;t wait to</td><td class=\"m\">~하기를 몹시 기다리다, 빨리 ~하고 싶다</td></tr><tr><td class=\"w\">get on</td><td class=\"m\">~에 타다, 탑승하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 기다릴 수 없다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can’t wait</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너에게 말해주기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> tell you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 런던 여행에 대해</span><span class=\"en\"><b>about my trip to London.</b></span></div></div><div class=\"lec-sent-ko\">런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 펼쳐질 여행기 전체를 소개하기 위해 글쓴이가 독자에게 기대감을 전달하며 화두를 던지는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to tell (to부정사): wait(기다리다) 뒤에서 목적어 역할을 하는 명사적 용법의 to부정사(tell+O) 구조입니다.</div><div class=\"lec-gr-item\">can’t wait to (관용표현): &#39;cannot wait to V(~하기를 몹시 기다리다/고대하다)&#39; 형태의 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비행은</span><span class=\"en\"><b>The flight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">15시간이 걸렸다</span><span class=\"en\"><b><span class=\"grammar-hl\">took</span> 15 hours</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인천으로부터</span><span class=\"en\"><b>from Incheon.</b></span></div></div><div class=\"lec-sent-ko\">비행은 인천에서부터 15시간이 걸렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본격적인 시작을 알리는 도입부로서, 장거리 이동을 통해 독자들에게 여행의 규모와 현장감을 체감하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took 5형식(SVOC) 구조와 유사한 관용적 쓰임: &#39;take + 시간 + from A to B(A에서 B까지 시간이 걸리다)&#39; 패턴에서, 여기서는 거리/시간을 나타내는 3형식 구조로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 내 친구 아멜리아를 만났을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When I met my friend Amelia</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공항에서</span><span class=\"en\"><b>at the airport,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 매우 신이 났다</span><span class=\"en\"><b>I was so excited.</b></span></div></div><div class=\"lec-sent-ko\">내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행지에서 반가운 사람을 만난 사건을 서술하여 글의 분위기를 활기차게 전환하고 독자의 흥미를 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When I met my friend Amelia (현재분사/분사구문): 이 문장은 접속사 when이 이끄는 부사절 구조입니다. 분사구문으로 전환 시 &#39;Meeting my friend Amelia at the airport, I was so excited&#39;가 되며, 원래 구조는 &#39;When + I + met(과거형)&#39;입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 그녀를 알고 지내왔다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">have known</span> her</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 10살이었을 때부터</span><span class=\"en\"><b>since I was 10 years old.</b></span></div></div><div class=\"lec-sent-ko\">내가 10살이었을 때부터 나는 그녀와 알고 지냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 아멜리아라는 인물과의 관계를 설명하며, 왜 그 만남이 글쓴이에게 특별하고 기쁜 일인지에 대한 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have known (현재완료): have + p.p. 구조로 과거부터 현재까지 지속되는 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 나를 데려갔다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">took</span> me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 장소들로</span><span class=\"en\"><b>to many places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던의</span><span class=\"en\"><b>in London.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 나를 런던의 많은 곳에 데려가 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본격적인 일정이 시작됨을 알리며, 이어질 구체적인 장소 소개를 위한 징검다리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took 5형식(SVOC) 구조: &#39;take + O + to + 장소&#39; 패턴으로, 목적어(me)를 장소로 데려가다라는 의미의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나와 함께 가자</span><span class=\"en\"><b>Come with me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 굉장한 여행에</span><span class=\"en\"><b>on my <span class=\"grammar-hl\">amazing</span> trip!</b></span></div></div><div class=\"lec-sent-ko\">나의 굉장한 여행에 나와 함께 가 봐!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들을 자신의 여행 경험으로 초대하여, 이제부터 펼쳐질 관광지 소개에 집중하도록 유도하는 권유문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing (현재분사): amazing이 trip을 수식하는 형용사적 기능으로, &#39;놀라운 여행&#39;이라는 의미를 만듭니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 탔다</span><span class=\"en\"><b>We got on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 유명한 빨간색 버스를</span><span class=\"en\"><b>the <span class=\"grammar-hl\">famous red bus</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 첫 번째 정류장은</span><span class=\"en\"><b>and the first stop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">버킹엄 궁전이었다</span><span class=\"en\"><b>was Buckingham Palace.</b></span></div></div><div class=\"lec-sent-ko\">우리는 유명한 빨간색 버스에 올라탔고 첫 번째 정류장은 버킹엄 궁전이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행 일정의 첫 번째 장소로 이동하는 과정을 상세히 묘사하여 공간적 배경을 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">famous red bus (관용표현): &#39;get on(~에 타다)&#39;은 교통수단을 이용할 때 쓰는 관용적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왕과 그의 가족은</span><span class=\"en\"><b>The King and his family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산다</span><span class=\"en\"><b><span class=\"grammar-hl\">live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에</span><span class=\"en\"><b>there.</b></span></div></div><div class=\"lec-sent-ko\">왕과 그의 가족이 그곳에 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 버킹엄 궁전이라는 공간의 성격을 독자에게 간략히 설명하여 장소의 중요성을 인지하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">live (기본구조): 주어(The King and his family) + 동사(live) + 부사(there)로 구성된 1형식 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 보았다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">saw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국왕 근위대를</span><span class=\"en\"><b>the King's Guard.</b></span></div></div><div class=\"lec-sent-ko\">우리는 국왕 근위대를 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 궁전에서 볼 수 있는 구체적인 볼거리를 제시하며 관찰 대상을 상세화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw 5형식(SVOC) 구조: &#39;saw + O(the King&#39;s Guard)&#39; 형태로, 주어(We)가 목적어를 지각하는 3형식 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">근위병들은</span><span class=\"en\"><b>The guards</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were wearing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빨간색 재킷들과 높은 검은색 모자들을</span><span class=\"en\"><b>red jackets and tall black hats.</b></span></div></div><div class=\"lec-sent-ko\">근위병들은 빨간색 재킷과 높은 검은색 모자를 쓰고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 근위대의 모습을 시각적으로 묘사하여 현장의 생생함을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were wearing (현재진행): be동사(were) + -ing(wearing) 구조로, 과거의 특정 시점에 진행 중이었던 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 사진을 찍었다</span><span class=\"en\"><b>We took pictures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 근처에서</span><span class=\"en\"><b>near them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그들은 웃거나 움직이지 않았다</span><span class=\"en\"><b>but they <span class=\"grammar-hl\">didn't smile</span> or move.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 근위대와 함께한 경험을 서술하며, 그들의 경직된 태도가 대조적인 상황을 만들어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn&#39;t smile (대동사): 앞에 나온 동작(smile, move)을 부정할 때 일반동사의 부정문에서 do(did)를 사용하는 대동사 구조입니다. 앞의 동사가 일반동사이면 do[does, did]를 씁니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~와 같았다</span><span class=\"en\"><b>were <span class=\"grammar-hl\">like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조각상들</span><span class=\"en\"><b><span class=\"grammar-hl\">statues</span>!</b></span></div></div><div class=\"lec-sent-ko\">그들은 조각상들 같았다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 근위대의 움직임 없는 모습을 비유적으로 표현하여, 그들의 절도 있고 엄격한 분위기를 독자에게 확실히 각인시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">like statues (관용표현): 전치사 like를 사용하여 &#39;~처럼(비유)&#39;의 의미를 나타내는 관용구입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글쓴이는 런던 여행에 대한 기대감과 친구 아멜리아와의 재회를 서술합니다.</li><li>런던의 주요 명소인 버킹엄 궁전을 방문하여 왕실 근위대를 구경합니다.</li><li>근위대의 독특한 복장과 조각상처럼 움직이지 않는 절도 있는 모습을 경험합니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Subin traveled to London to visit her childhood friend, and they explored famous landmarks including Buckingham Palace together.</div>\n              <div class=\"lec-final-sum-ko\">수빈은 어린 시절 친구를 만나기 위해 런던으로 여행을 떠났으며, 그들은 함께 버킹엄 궁전을 포함한 유명 명소들을 둘러보았다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio
