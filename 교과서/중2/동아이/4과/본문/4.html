앤 K. 롤링의 판타지 소설이자 영화인 &#39;해리 포터(Harry Potter)&#39; 시리즈에서 주인공들이 마법 학교인 호그와트로 떠나기 위해 마법 열차를 타는 &#39;9와 4분의 3 승강장(Platform 9¾)&#39;이 위치한 상징적인 장소랍니다. 실제 영화 촬영지로 유명해진 이곳은 전 세계 팬들이 마법 세계를 간접적으로 체험하고 싶어 하는 &#39;성지순례(Pilgrimage)&#39; 명소가 되었죠. 벽을 통과해 마법 세계로 들어가는 영화 속 장면을 현실에서 재현해보는 경험은 팬들에게 마치 현실과 가상의 경계가 허물어지는 듯한 &#39;마법 같은 순간&#39;을 선사하곤 한답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01런던의 날씨와 문화</div><ul><li>영국의 궂은 날씨에도 불구하고 우산을 잘 쓰지 않는 현지인들의 습관을 소개한다.</li><li>런던의 비 오는 날씨(rainy weather)</li><li>비가 와도 우산을 쓰지 않는 런던 사람들(Londoners)</li><li>핵심 키워드: 런던 날씨(London weather), 우산(umbrella)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02킹스크로스역 방문</div><ul><li>영화 해리포터 시리즈의 주요 촬영지인 킹스크로스역을 찾아간다.</li><li>해리포터 영화 촬영지(filmed at King’s Cross Station)</li><li>주인공이 언급한 마법 학교 배경지 확인</li><li>핵심 키워드: 킹스크로스역(King’s Cross Station), 해리포터(Harry Potter)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03영화 속 장면 재현</div><ul><li>역 내에 있는 영화 속 명소에서 직접 주인공이 된 듯한 경험을 즐긴다.</li><li>9와 4분의 3 승강장(Platform 9¾) 발견</li><li>영화 속 장면을 흉내 내며 사진 촬영(selfies)</li><li>핵심 키워드: 9와 4분의 3 승강장(Platform 9¾), 마법 학교(Hogwarts)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprised</td><td class=\"m\">놀란, 당황한</td></tr><tr><td class=\"w\">take someone to</td><td class=\"m\">~를 ~로 데려가다, ~를 ~로 안내하다</td></tr><tr><td class=\"w\">film</td><td class=\"m\">촬영하다, 영화로 만들다</td></tr><tr><td class=\"w\">look</td><td class=\"m\">봐, 보라</td></tr><tr><td class=\"w\">pretend</td><td class=\"m\">~인 척하다, 가상하다</td></tr><tr><td class=\"w\">secret</td><td class=\"m\">비밀의, 남모르는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">런던은</span><span class=\"en\"><b>Magical</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자주 온다 / 비가</span><span class=\"en\"><b>Experience <span class=\"grammar-hl\">London</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비가</span><span class=\"en\"><b><span class=\"grammar-hl\">often has rainy weather.</span></b></span></div></div><div class=\"lec-sent-ko\">런던은 비가 자주 온다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어지는 문장에서 아멜리아가 우산을 쓰지 않는 이유를 설명하기 위해, 런던의 일반적인 기후 특성을 먼저 언급하는 도입부 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">London often has rainy weather. (기본구조): 주어(London) + 동사(has) + 목적어(rainy weather)의 3형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘은 비가 조금 내렸지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">It rained a little today,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Amelia는</span><span class=\"en\"><b>but Amelia</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있지 않았다</span><span class=\"en\"><b>didn’t have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산을</span><span class=\"en\"><b>an umbrella.</b></span></div></div><div class=\"lec-sent-ko\">오늘은 비가 조금 내렸지만, Amelia는 우산을 가지고 있지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 런던 날씨를 구체적인 사례로 연결하면서, 비가 오는데도 우산이 없는 인물의 상황을 제시하여 독자의 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It rained a little today, 비인칭 주어(It): 날씨를 나타낼 때 구체적인 대상 없이 사용하는 주어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 말했다</span><span class=\"en\"><b>She said</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 런던 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that most Londoners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우산을 사용한다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">use umbrellas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">폭우에만</span><span class=\"en\"><b><span class=\"grammar-hl\">only for heavy rain.</span></b></span></div></div><div class=\"lec-sent-ko\">그녀는 대부분의 런던 사람들이 폭우에만 우산을 사용한다고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 상황에 대한 의문을 해소해 주는 대목입니다. 비가 와도 우산을 쓰지 않는 런던 사람들의 실질적인 행동 양식을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that most Londoners use umbrellas only for heavy rain. (명사절): 접속사 that이 이끄는 절이 said의 목적어 역할을 하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 놀랐는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I was surprised</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 말을 듣고</span><span class=\"en\"><b><span class=\"grammar-hl\">to hear that.</span></b></span></div></div><div class=\"lec-sent-ko\">나는 그 말을 듣고 놀랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 런던의 문화나 사람들의 습관을 처음 접하며 느끼는 심리적 반응을 드러내어, 글의 분위기를 개인적인 경험의 영역으로 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was surprised (수동태): be동사(was) + 과거분사(surprised) 구조이다. surprise는 타동사(놀라게 하다)인데 목적어가 없어서 수동구조 be+p.p.로 쓰였으며, 기본구조는 &#39;surprise + O(목적어)&#39;이다.</div><div class=\"lec-gr-item\">to hear that. (to부정사): 감정의 원인을 나타내는 부사적 용법으로 쓰였으며, surprised라는 감정의 이유를 보충 설명한다.</div><div class=\"lec-gr-item\">to hear that. (가주어): 진주어(의미상): 앞선 &#39;It(앞 문장의 내용)&#39;이 진주어 역할을 하고, I was surprised to hear(감정의 결과)가 이어지는 구조로 파악할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprised</td><td class=\"m\">놀란, 당황한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 Amelia에게 부탁했다</span><span class=\"en\"><b><span class=\"grammar-hl\">I asked Amelia</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 데려가 달라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to take me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">킹스 크로스 역으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to King’s Cross Station.</span></b></span></div></div><div class=\"lec-sent-ko\">나는 Amelia에게 나를 킹스 크로스 역으로 데려가 달라고 부탁했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 다음 행선지로 이동하는 장면으로, 글의 내용이 날씨 이야기에서 장소 탐방으로 자연스럽게 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I asked Amelia to take me to King’s Cross Station. (5형식(SVOC)): ask + 목적어(Amelia) + 목적보어(to take~) 구조이다. 5형식 문장에서 ask는 목적보어로 to부정사를 취한다.</div><div class=\"lec-gr-item\">to take (to부정사): 5형식 구조의 목적보어로 쓰였으며, 목적어인 Amelia가 해야 할 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 보고 싶었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I wanted to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 기차역을</span><span class=\"en\"><b><span class=\"grammar-hl\">this train station</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘해리 포터’ 영화 때문에</span><span class=\"en\"><b>because of the Harry Potter movies.</b></span></div></div><div class=\"lec-sent-ko\">나는 ‘해리 포터’ 영화 때문에 이 기차역을 보고 싶었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번에서 언급한 장소로 이동하는 이유를 설명합니다. 이 역이 단순한 교통 시설이 아니라 유명 영화의 배경지라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I wanted to see this train station (to부정사): 동사 want의 목적어 역할을 하는 명사적 용법이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 촬영되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">They were filmed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 역에서</span><span class=\"en\"><b>at this station.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 이 역에서 촬영되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장에서 언급한 영화와 역의 연결 고리를 사실 확인 차원에서 보충 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They were filmed (수동태): be동사(were) + 과거분사(filmed) 구조이다. film은 타동사(촬영하다)인데 뒤에 목적어가 없어서 수동구조 were filmed 형태로 쓴다. 기본구조: film + O(촬영하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">film</td><td class=\"m\">촬영하다, 영화로 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">봐라!</span><span class=\"en\"><b><span class=\"grammar-hl\">Look!</span></b></span></div></div><div class=\"lec-sent-ko\">봐라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화 속 공간을 실제로 발견했을 때의 흥분된 감정을 전달하며 독자의 시선을 해당 장소로 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look! (명령문): 주어(you)가 생략된 동사원형 시작 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look</td><td class=\"m\">봐, 보라</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 찾았다</span><span class=\"en\"><b><span class=\"grammar-hl\">We found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">9와 3/4 승강장을</span><span class=\"en\"><b><span class=\"grammar-hl\">Platform 93⁄4!</span></b></span></div></div><div class=\"lec-sent-ko\">우리는 9와 3/4 승강장을 찾았다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화 속 공간을 실제로 발견했을 때의 흥분된 감정을 전달하며 독자의 시선을 해당 장소로 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We found Platform 93⁄4! (기본구조): 주어(We) + 동사(found) + 목적어(Platform 9 3/4)의 3형식 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Amelia와 나는</span><span class=\"en\"><b>Amelia and I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">척했다</span><span class=\"en\"><b>pretended</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 영화 속에 나오는</span><span class=\"en\"><b><span class=\"grammar-hl\">we were in the movies.</span></b></span></div></div><div class=\"lec-sent-ko\">Amelia와 나는 우리가 영화 속에 나오는 척했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 찾은 장소를 단순히 구경하는 것에 그치지 않고, 그 공간 안에서 즐거움을 느끼기 위해 놀이에 몰입하는 상황을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we were in the movies. 명사절(생략된 접속사 that): pretended의 목적어 역할을 하는 절이며, 접속사 that이 생략된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pretend</td><td class=\"m\">~인 척하다, 가상하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 찍었다</span><span class=\"en\"><b><span class=\"grammar-hl\">We took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 셀카를</span><span class=\"en\"><b><span class=\"grammar-hl\">lots of selfies.</span></b></span></div></div><div class=\"lec-sent-ko\">우리는 많은 셀카를 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화 속 주인공처럼 행동했던 경험을 기억하기 위해 남긴 구체적인 활동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We took lots of selfies. (관용표현): take + 명사(selvies/picture)는 &#39;~을 찍다&#39;라는 의미의 관용적 표현으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 찾을 수 있니</span><span class=\"en\"><b><span class=\"grammar-hl\">Can you find</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비밀 통로를</span><span class=\"en\"><b><span class=\"grammar-hl\">the secret way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호그와트로 가는</span><span class=\"en\"><b><span class=\"grammar-hl\">to Hogwarts?</span></b></span></div></div><div class=\"lec-sent-ko\">너는 호그와트로 가는 비밀 통로를 찾을 수 있니?</div></div>\n        <div class=\"lec-g
