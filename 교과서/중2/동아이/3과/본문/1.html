Natural Selection)의 결과로 환경에서 살아남기 위해 진화한 놀라운 생존의 기술입니다. 글에서 다룰 산토끼처럼 특정 환경에 완벽히 녹아드는 동물들의 사례를 통해, 동물이 어떻게 주변과 하나가 되어 위험으로부터 자신을 보호하는지 흥미롭게 관찰해 보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01위장술의 개념</div><ul><li>야생 동물들은 포식자로부터 스스로를 보호하기 위해 독특한 위장 기술을 사용한다.</li><li>위장(camouflage)을 통해 포식자로부터 안전 확보</li><li>하늘, 땅, 바다 등 다양한 서식지에 존재</li><li>핵심 키워드: 위장(camouflage), 포식자(predators)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02산토끼의 계절별 변화</div><ul><li>산토끼는 계절에 따라 털색을 바꾸어 주변 환경에 자신을 숨긴다.</li><li>여름철에는 바위와 풀의 색인 회갈색으로 변화</li><li>겨울철에는 눈 속에서 보이지 않도록 흰색으로 변화</li><li>포식자에게 들키지 않는 은폐(invisible) 효과</li><li>핵심 키워드: 산토끼(Mountain hare), 위장(camouflage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03산토끼의 신체적 특징</div><ul><li>산토끼는 독특한 신체 구조를 활용하여 포식자의 위협에서 벗어난다.</li><li>눈 위를 쉽게 뛰어다닐 수 있는 큰 발(big feet)</li><li>깊은 눈 속에서 포식자를 따돌리는 이동 능력</li><li>핵심 키워드: 큰 발(big feet), 탈출(escape)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 보호색</td></tr><tr><td class=\"w\">be good at</td><td class=\"m\">~에 능숙하다, ~을 잘하다</td></tr><tr><td class=\"w\">keep ~ safe from</td><td class=\"m\">~을 ~로부터 안전하게 지키다</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">guide ~ through</td><td class=\"m\">~에게 ~을 안내하다, ~을 자세히 설명하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따라, ~에 의하면</td></tr><tr><td class=\"w\">match</td><td class=\"m\">~와 어울리다, ~와 조화를 이루다</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는, 볼 수 없는</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">escape from</td><td class=\"m\">~에서 탈출하다, ~에서 벗어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들을</span><span class=\"en\"><b><span class=\"grammar-hl\">Can You Spot Them?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견할</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">수 있니?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그들을 발견할 수 있니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제목을 통해 독자에게 질문을 던지며, 이 글에서 다룰 &#39;보호색으로 숨어 있는 동물들&#39;에 대한 호기심을 유발하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can You Spot Them? 간접의문문과 유사한 형태의 의문문 구조: 조동사 Can이 주어 앞으로 이동한 도치 형태의 의문문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은</span><span class=\"en\"><b>Are you <span class=\"grammar-hl\">good at</span> <span class=\"grammar-hl\">hide and seek</span>?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘하는가</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">숨바꼭질을?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">당신은 숨바꼭질을 잘하는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 친숙한 놀이를 언급하며 앞으로 설명할 동물들의 생존 전략인 &#39;위장술&#39;을 일상적인 상황과 연결해 흥미를 돋우는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">good at (관용표현): &#39;~에 능숙한&#39;이라는 의미의 숙어로, 전치사 at 뒤에 명사나 동명사(~ing)를 목적어로 취합니다.</div><div class=\"lec-gr-item\">hide and seek (관용표현): &#39;숨바꼭질&#39;이라는 의미의 고정된 명사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 동물들은</span><span class=\"en\"><b>Some animals <span class=\"grammar-hl\">which live in the wild</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서 사는</span><span class=\"en\"><b>are very good at camouflage.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 잘한다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">위장을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">야생에서 사는 몇몇 동물들은 위장을 매우 잘한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 숨바꼭질 개념을 자연계의 생존 방식으로 확장하며, 이 글의 핵심 주제인 &#39;동물의 보호색&#39;을 본격적으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">which live in the wild (관계대명사): 주격 관계대명사 which가 앞의 선행사 Some animals를 수식합니다. 절 내부에서 주어 역할을 하므로 뒤에 동사 live가 이어지는 완전하지 않은 절이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 보호색</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 그들을 볼 수 있다</span><span class=\"en\"><b>You can see them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에서,</span><span class=\"en\"><b><span class=\"grammar-hl\">in the air,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅에서,</span><span class=\"en\"><b><span class=\"grammar-hl\">on land,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 바다에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">and in the sea</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위장술을 사용하는 동물이 특정 환경에 국한되지 않고 지구상의 모든 영역에 널리 퍼져 있음을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the air, on land, and in the sea (관용표현): 장소를 나타내는 전치사구들이 병렬 구조로 나열되어 위치 정보를 제공합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 특별한 생김새나 능력은</span><span class=\"en\"><b>Their special looks or abilities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 안전하게 지킨다</span><span class=\"en\"><b><span class=\"grammar-hl\">keep them safe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물로부터.</span><span class=\"en\"><b>from predators.</b></span></div></div><div class=\"lec-sent-ko\">그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보호색이라는 위장 전략이 단순한 변장이 아니라, 포식자의 눈을 피해 생존하기 위한 필수적인 방어 수단임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep them safe 5형식(SVOC) 구조: &#39;keep + 목적어(them) + 목적보어(safe)&#39; 형태입니다. 목적어인 그들의 상태를 보어인 안전한 상태로 유지한다는 의미를 전달합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 당신을 안내하겠다</span><span class=\"en\"><b><span class=\"grammar-hl\">Let me guide you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물 위장의 세계로.</span><span class=\"en\"><b>through the world of animal camouflage.</b></span></div></div><div class=\"lec-sent-ko\">내가 당신을 동  style=\"color:#ffd9a0;\">의미</b> 위장술의 구체적인 첫 번째 사례로 산토끼를 소개하며, 일반적인 토끼와 구별되는 신체적 특징을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are bigger and have longer legs (비교급): 비교 대상인 rabbits와의 차이를 설명하기 위해 형용사 뒤에 -er을 붙인 비교급 표현을 사용했습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They are very <span class=\"grammar-hl\">stylish</span> animals.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 멋진 동물이다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그들은 매우 멋진 동물이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 산토끼가 단순히 생존만 하는 것이 아니라 계절마다 털색을 바꾸는 독특한 외형적 변화를 겪는다는 점을 &#39;스타일리시하다&#39;는 표현으로 비유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stylish 형용사: 명사인 animals의 상태를 설명하는 서술적 기능을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고산토끼는 색을 바꾼다</span><span class=\"en\"><b>Mountain hares change colors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계절에 따라.</span><span class=\"en\"><b><span class=\"grammar-hl\">according to</span> season.</b></span></div></div><div class=\"lec-sent-ko\">고산토끼는 계절에 따라 색을 바꾼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장에서 언급한 &#39;멋진 외형 변화&#39;가 구체적으로 어떻게 일어나는지, 그 원인이 계절에 있음을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">according to (관용표현): &#39;~에 따라&#39;라는 의미를 가진 전치사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">according to</td><td class=\"m\">~에 따라, ~에 의하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여름에,</span><span class=\"en\"><b>In summer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 회갈색으로 변한다</span><span class=\"en\"><b>they turn gray-brown</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바위와 풀에 맞추기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to match the rocks and grass</span>.</b></span></div></div><div class=\"lec-sent-ko\">여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주변 환경에 맞춰 보호색을 띠는 여름철의 구체적인 생존 전략을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to match the rocks and grass (to부정사): 부사적 용법으로, 색깔이 변하는 목적(~하기 위해서)을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match</td><td class=\"m\">~와 어울리다, ~와 조화를 이루다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">겨울에,</span><span class=\"en\"><b>In winter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 흰색으로 변한다</span><span class=\"en\"><b>they turn white</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들을 위장하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to camouflage</span> themselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈 속에.</span><span class=\"en\"><b>in the snow.</b></span></div></div><div class=\"lec-sent-ko\">겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 계절적 변화에 맞춰 눈 덮인 겨울 배경에 녹아들기 위한 산토끼의 대응 방식을 대조적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to camouflage (to부정사): 부사적 용법으로, 색깔을 바꾸는 행동의 목적(~하기 위해서)을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 보호색</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">색을 바꾸는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Changing colors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 거의 보이지 않게 만든다</span><span class=\"en\"><b>makes them nearly invisible</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물들에게</span><span class=\"en\"><b>to predators</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들개와 독수리 같은.</span><span class=\"en\"><b>like wild dogs and eagles.</b></span></div></div><div class=\"lec-sent-ko\">색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 계절별 변색이 결국 포식자의 시야를 교란하여 생존 확률을 높이는 효과적인 방법임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Changing colors (동명사): 문장에서 주어 역할을 하는 행위(~하는 것)로 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는, 볼 수 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알고</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you know?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있었나요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">알고 있었나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 큰 발이라는 신체적 특징이 겨울철의 환경적 제약을 극복하고 포식자로부터의 탈출을 돕는 구체적인 수단임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you know? 도치/의문문 구조: 일반동사 know에 대한 의문문을 만들기 위해 조동사 Did가 주어 앞으로 이동한 도치 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고산토끼는</span><span class=\"en\"><b>Mountain hares have <span class=\"grammar-hl\">really big</span> feet.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 큰 발을 가지고 있다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">고산토끼는 정말 큰 발을 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위장술 외에 산토끼가 생존을 위해 가진 또 다른 신체적 특징을 추가로 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">really big (부사+형용사): 부사 really가 형용사 big을 수식하여 정도를 강조합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들 덕분에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Thanks to</span> them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고산토끼는 깊은 눈 속에서 깡충깡충 뛰어</span><span class=\"en\"><b>mountain hares <span class=\"grammar-hl\">can hop</span> in deep snow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물로부터 도망칠 수 있다.</span><span class=\"en\"><b>and escape from predators.</b></span></div></div><div class=\"lec-sent-ko\">그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 큰 발이라는 신체적 특징이 겨울철의 환경적 제약을 극복하고 포식자로부터의 탈출을 돕는 구체적인 수단임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thanks to (관용표현): &#39;~덕분에&#39;라는 의미의 원인/이유를 나타내는 전치사구입니다.</div><div class=\"lec-gr-item\">can hop (조동사): 가능을 나타내는 조동사 can과 동사원형 hop이 결합한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">escape from</td><td class=\"m\">~에서 탈출하다, ~에서 벗어나다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>야생 동물들은 포식자로부터 살아남기 위해 보호색이라는 위장술을 활용한다.</li><li>산토끼는 계절에 따라 털 색깔을 바꿔 주변 환경에 몸을 숨긴다.</li><li>변색 능력뿐만 아니라 큰 발과 같은 신체적 특징도 혹독한 환경에서 생존하는 데 도움을 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mountain hares change their fur color according to the season to hide from predators, and they use their large feet to move quickly through deep snow.</div>\n              <div class=\"lec-final-sum-ko\">산토끼는 포식자를 피하기 위해 계절에 따라 털 색깔을 바꾸며, 큰 발을 이용해 깊은 눈 속을 빠르게 이동한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audi
