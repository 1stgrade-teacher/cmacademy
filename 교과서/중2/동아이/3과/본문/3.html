ss=\"lec-cover-title\">The Remarkable Survival Adaptations of Owls<small>올빼미의 놀라운 생존 적응력</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">올빼미는 자연 속에서 살아남기 위해 위장(Camouflage)이라는 놀라운 생존 전략을 사용하는데, 이는 주변 환경과 자신의 모습을 똑같이 만들어 포식자나 먹잇감의 눈에 띄지 않게 하는 일종의 &#39;생물학적 투명 망토&#39;와 같습니다. 이와 더불어 올빼미가 가진 독특한 신체 구조인 목의 유연성(Neck flexibility)은 뼈 구조 덕분에 머리를 거의 270도 가까이 돌릴 수 있게 해주며, 덕분에 몸을 움직여 소리를 내지 않고도 주변 상황을 360도에 가깝게 관찰(Scanning)할 수 있죠. 우리가 흔히 올빼미를 지혜의 상징으로 여기는 이유도 이처럼 환경 적응력(Environmental adaptation)이 뛰어나고, 정적인 자세로 상황을 면밀히 파악하는 특성에서 비롯되었다고 볼 수 있습니다. 마치 탐정이 돋보기를 들고 현장을 세밀하게 살피는 것처럼, 올빼미는 이러한 신체적 특징을 활용해 야생에서 최상의 사냥꾼(Apex predator)이자 전략가로 군림하고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01올빼미의 지혜로운 위장</div><ul><li>올빼미는 천적으로부터 몸을 보호하기 위해 환경과 조화를 이루는 위장술을 사용합니다.</li><li>자연환경과 일치하는 깃털의 색상과 무늬 (colors and patterns)</li><li>나뭇가지 위에 있을 때 나무의 일부처럼 보이는 은폐 효과</li><li>핵심 키워드: 위장(camouflage), 포식자(predators)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02야생에서의 생존 이점</div><ul><li>위장술을 통해 올빼미는 다른 동물들 눈에 띄지 않게 하여 생존에 큰 이점을 얻습니다.</li><li>주변 환경에 숨어 눈에 띄지 않게 됨 (invisible)</li><li>야생 환경에서 생존에 필요한 강력한 도구가 됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올빼미의 놀라운 신체 능력</div><ul><li>올빼미는 고개를 거의 끝까지 돌릴 수 있는 특별한 능력을 갖추고 있습니다.</li><li>머리를 회전시켜 주변 환경을 자유롭게 관찰 (scan)</li><li>소리를 내지 않고도 위험이나 먹이를 신속하게 발견 가능</li><li>핵심 키워드: 신체 능력(ability), 주변 환경(surroundings)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culture</td><td class=\"m\">문화, 교양</td></tr><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 보호색</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 포식 동물</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경, 자연환경</td></tr><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는, 볼 수 없는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advantage</td><td class=\"m\">이점, 유리함</td></tr><tr><td class=\"w\">ability</td><td class=\"m\">능력, 재능</td></tr><tr><td class=\"w\">scan</td><td class=\"m\">훑어보다, 자세히 조사하다</td></tr><tr><td class=\"w\">surroundings</td><td class=\"m\">주변, 환경</td></tr><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 문화에서,</span><span class=\"en\"><b>In many cultures,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엉이는</span><span class=\"en\"><b>owls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are known</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명하고 똑똑한 새로</span><span class=\"en\"><b>as wise and smart birds.</b></span></div></div><div class=\"lec-sent-ko\">많은 문화에서, 부엉이는 현명하고 똑똑한 새로 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 사람들이 부엉이에 대해 일반적으로 가지고 있는 통념을 제시하며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are known (수동태): be동사(are) + p.p.(known) 구조. know는 타동사인데 목적어가 없어서 수동구조 are known 형태로 쓴다. 기본구조: know + O(목적어) + as B(O를 B라고 알다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">culture</td><td class=\"m\">문화, 교양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확실히 사용한다</span><span class=\"en\"><b>certainly <span class=\"grammar-hl\">use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 위장을</span><span class=\"en\"><b><span class=\"grammar-hl\">their camouflage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명한 방법으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in a wise way</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 확실히 현명한 방법으로 그들의 위장을 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 &#39;지혜롭다&#39;는 통념을 받아, 부엉이가 실제로 생존을 위해 어떻게 영리하게 행동하는지 구체적인 예시로 넘어가는 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">use their camouflage in a wise way 5형식(SVOC) 구조와 유사한 목적어+부사구 패턴. use는 타동사로 use + O + 전치사구(O를 ~방식으로 사용하다)의 3형식 구조를 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 보호색</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부엉이의 특별한 깃털은</span><span class=\"en\"><b>The special feathers of owls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 보호한다</span><span class=\"en\"><b><span class=\"grammar-hl\">protect them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from predators</span>.</b></span></div></div><div class=\"lec-sent-ko\">부엉이의 특별한 깃털은 그들을 포식 동물로부터 보호한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위장의 핵심 수단인 깃털의 구체적인 기능을 설명하며, 부엉이가 왜 생존에 유리한지 논리적인 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">protect them from predators (관용표현): protect A from B(A를 B로부터 보호하다) 구조가 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 포식 동물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 깃털 색과 무늬는</span><span class=\"en\"><b>The colors and patterns of their feathers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어울린다</span><span class=\"en\"><b><span class=\"grammar-hl\">match</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 자연환경과</span><span class=\"en\"><b><span class=\"grammar-hl\">their natural environment</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들의 깃털 색과 무늬는 그들의 자연환경과 어울린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 깃털이 어떻게 포식자를 피할 수 있는지 그 원리를 시각적인 요소(색깔, 무늬)를 통해 상세히 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">match their natural environment (기본구조): match는 타동사로서 match + O(목적어) 구조를 취하여 환경과 일치하다는 의미를 전달한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environment</td><td class=\"m\">환경, 자연환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 앉아 있을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when they sit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무에,</span><span class=\"en\"><b><span class=\"grammar-hl\">in a tree</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 보인다</span><span class=\"en\"><b>they look</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼭 그 나무의 일부처럼</span><span class=\"en\"><b>just like part of the tree.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 그들이 나무에 앉아 있을 때, 그들은 꼭 그 나무의 일부처럼 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 환경과 일치하는 깃털 덕분에 발생하는 구체적인 시각적 효과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when they sit in a tree (분사구문): 문맥상 시간을 나타내는 절이다. 원리상 &#39;while sitting in a tree&#39;와 같이 분사구문으로 전환할 수 있으며, 이때 분사는 &#39;while + they + be + -ing&#39;의 축약 형태를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">된다</span><span class=\"en\"><b>become</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 보이지 않게</span><span class=\"en\"><b>almost <span class=\"grammar-hl\">invisible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 동물에게</span><span class=\"en\"><b>to other animals.</b></span></div></div><div class=\"lec-sent-ko\">그들은 다른 동물에게 거의 보이지 않게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 나무와 비슷해 보임으로써 얻게 되는 생존상의 직접적인 결과인 &#39;은폐&#39;를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">invisible 5형식(SVOC) 구조: become + O(보어)의 2형식 구조이나, 형용사 보어(invisible)가 주어의 상태를 설명하는 보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invisible</td><td class=\"m\">보이지 않는, 볼 수 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">준다</span><span class=\"en\"><b><span class=\"grammar-hl\">gives</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄청난 이점을</span><span class=\"en\"><b><span class=\"grammar-hl\">a huge advantage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생에서</span><span class=\"en\"><b>in the wild!</b></span></div></div><div class=\"lec-sent-ko\">이는 야생에서 그들에게 엄청난 이점을 준다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부엉이가 위장을 통해 얻는 생존의 유리함을 결론짓는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gives them a huge advantage 5형식(SVOC) 구조의 변형인 4형식(S + V + I.O + D.O): give + 간접목적어(them) + 직접목적어(a huge advantage) 구조로, 주어가 대상에게 이점을 제공하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advantage</td><td class=\"m\">이점, 유리함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 알고 있었나요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you know?</span></b></span></div></div><div class=\"lec-sent-ko\">알고 있었나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본문의 일반적인 설명에서 벗어나, 독자의 호기심을 자극하며 새로운 흥미로운 정보로 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you know? (간접의문문): 문장 전체는 의문문이지만, 다음에 올 명사절을 이끄는 도치 없는 구조를 취하고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부엉이는</span><span class=\"en\"><b>Owls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있다</span><span class=\"en\"><b>have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 능력을</span><span class=\"en\"><b>the amazing ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 머리를 돌리는</span><span class=\"en\"><b><span class=\"grammar-hl\">to turn their heads</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 완전히</span><span class=\"en\"><b>almost all the way around.</b></span></div></div><div class=\"lec-sent-ko\">부엉이는 그들의 머리를 거의 완전히 돌릴 수 있는 놀라운 능력이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부엉이의 또 다른 생존 전략인 &#39;머리 회전&#39;이라는 신체적 특징을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to turn their heads (to부정사): 앞의 명사(ability)를 수식하는 형용사적 용법으로, 능력을 구체화하여 &#39;고개를 돌리는 능력&#39;이라는 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ability</td><td class=\"m\">능력, 재능</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살필 수 있다</span><span class=\"en\"><b>can scan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 주변 환경을</span><span class=\"en\"><b>their surroundings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 머리를 움직이는 것만으로</span><span class=\"en\"><b>by only <span class=\"grammar-hl\">moving their heads</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그들의 머리를 움직이는 것만으로 그들의 주변 환경을 살필 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 놀라운 능력이 실질적으로 사냥과 경계에 어떻게 쓰이는지 그 효용성을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">moving their heads (동명사): 전치사(by)의 목적어로 쓰인 동명사(moving)이다. -ing 형태가 명사적 역할로 &#39;움직이는 것&#39;이라는 활동을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scan</td><td class=\"m\">훑어보다, 자세히 조사하다</td></tr><tr><td class=\"w\">surroundings</td><td class=\"m\">주변, 환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕는다 그들이</span><span class=\"en\"><b><span class=\"grammar-hl\">helps them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험이나 먹이를 발견하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to spot</span> danger or food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조용히</span><span class=\"en\"><b>quietly.</b></span></div></div><div class=\"lec-sent-ko\">이는 그들이 조용히 위험이나 먹이를 발견하도록 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 머리 회전이라는 신체 능력이 결과적으로 먹이 획득과 안전 확보라는 생존 목표를 달성하게 함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps them to spot 5형식(SVOC) 구조: help + O(them) + to부정사(to spot) 구조이다. 목적어인 them이 보어인 to spot하는 동작을 하도록 돕는다는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 찾다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>부엉이는 많은 문화권에서 지혜의 상징으로 여겨진다.</li><li>부엉이는 주변 환경과 조화를 이루는 깃털로 몸을 숨겨 천적으로부터 자신을 보호한다.</li><li>또한 머리를 자유롭게 돌리는 능력으로 조용히 주변을 살피며 먹이를 찾거나 위험을 감지한다.</li><li>이러한 신체적 특성들은 야생에서 부엉이가 살아남는 데 큰 이점이 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Owls use camouflage to hide from predators, and they rotate their heads to scan their surroundings for food or danger.</div>\n              <div class=\"lec-final-sum-ko\">올빼미는 포식자로부터 숨기 위해 위장술을 사용하며, 먹이나 위험을 살피기 위해 머리를 회전시킨다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.mp3","hl":"meaning"},{"audio":"./3_audio/28.mp3","hl":"grammar"}],[{"audio":"./3_audio/29.mp3","hl":"main"},{"audio":"./3_audio/30.mp3","hl":"meaning"},{"audio":"./3_audio/31.mp3","hl":"g
