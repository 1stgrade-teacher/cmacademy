s=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">문어의 놀라운 생존 전략을 이해하려면 먼저 이들이 사용하는 위장술(Camouflage)이라는 개념을 알면 좋은데, 이는 주변 환경과 자신의 색깔이나 질감을 똑같이 만들어 포식자의 눈을 피하는 일종의 &#39;생체 마법&#39; 같은 기술이에요. 마치 우리가 숨바꼭질할 때 주변 사물과 비슷하게 몸을 웅크려 숨는 것과 비슷하죠. 또한 문어는 위협을 느낄 때 먹물 분사(Ink ejection)라는 방어 기제를 사용하는데, 이는 단순히 도망가는 것이 아니라 먹물로 짙은 안개를 만들어 적의 시야를 일시적으로 차단하는 전술적 탈출(Tactical escape) 방식이에요. 이러한 능력들은 문어가 뼈가 없는 연체동물임에도 불구하고 바닷속에서 포식자들로부터 안전하게 살아남을 수 있게 해주는 생존 본능(Survival instinct)의 핵심 요소랍니다. 이 글을 읽기 전에 문어가 가진 이 두 가지 방어 전략을 머릿속에 떠올려보시면, 왜 문어가 &#39;바다의 변신 천재&#39;라고 불리는지 훨씬 쉽게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문어의 신체적 특징</div><ul><li>문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물입니다.</li><li>둥근 몸체(rounded bodies)와 여덟 개의 긴 팔(eight long arms)</li><li>바닷속 바위처럼 보일 수 있는 독특한 외형적 특징</li><li>핵심 키워드: 문어(Octopus)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02위장술을 통한 은폐</div><ul><li>문어는 주변 환경과 비슷하게 변신하여 포식자를 속입니다.</li><li>주변 환경에 맞춰 색깔과 무늬(colors and patterns)를 즉각적으로 변화시킴</li><li>해조류나 산호초(coral reefs) 근처에서 그들과 유사한 모습으로 위장</li><li>조개껍데기(shells)를 몸에 붙여 바위처럼 위장하는 기술 사용</li><li>핵심 키워드: 위장술(camouflage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03먹물 분사를 이용한 탈출</div><ul><li>위협을 느끼면 먹물을 뿜어 시야를 차단하고 도망칩니다.</li><li>포식자의 시야를 가리는 어두운 먹물 구름(dark cloud) 형성</li><li>포식자의 공격을 피할 수 있는 충분한 도망 시간(time to escape) 확보</li><li>핵심 키워드: 먹물(ink)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look closely at</td><td class=\"m\">~을 자세히 살펴보다, ~을 주의 깊게 보다</td></tr><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 변장</td></tr><tr><td class=\"w\">surroundings</td><td class=\"m\">환경, 주변</td></tr><tr><td class=\"w\">coral reef</td><td class=\"m\">산호초</td></tr><tr><td class=\"w\">stick</td><td class=\"m\">붙이다, 고수하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fool</td><td class=\"m\">속이다, 기만하다</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">펼치다, 퍼뜨리다</td></tr><tr><td class=\"w\">block</td><td class=\"m\">막다, 차단하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자세히 보아라</span><span class=\"en\"><b><span class=\"grammar-hl\">Look closely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바위를</span><span class=\"en\"><b>at a rock</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바닷속</span><span class=\"en\"><b>under the sea.</b></span></div></div><div class=\"lec-sent-ko\">바닷속 바위를 자세히 보아라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문어에 대한 호기심을 유발하기 위해 독자에게 주의 깊게 관찰할 것을 권유하며 이야기를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look closely (관용표현): 명령문 구조로, Look at A(~를 보다)의 의미에서 부사 closely가 동사 Look을 수식하여 &#39;자세히 들여다보아라&#39;라는 의미를 만듦.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look closely at</td><td class=\"m\">~을 자세히 살펴보다, ~을 주의 깊게 보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그것이 움직인다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If it moves</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~일지도 모른다</span><span class=\"en\"><b>it might be an octopus.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문어</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">만약 그것이 움직인다면, 그것은 문어일지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 바위가 사실은 문어일 수 있다는 점을 지적하며, 문어의 뛰어난 은폐 능력을 암시하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If it moves (조건절): 접속사 If를 사용한 조건의 부사절이며, 현재시제(moves)가 미래의 의미나 일반적인 사실을 포함한 가정을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문어는 해양 동물이다</span><span class=\"en\"><b>Octopuses are sea animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">둥근 몸과</span><span class=\"en\"><b>with <span class=\"grammar-hl\">rounded</span> bodies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여덟 개의 긴 팔을 가진</span><span class=\"en\"><b>and eight long arms.</b></span></div></div><div class=\"lec-sent-ko\">문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문어의 생물학적 특징을 설명하여 문어가 무엇인지 기본적인 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rounded (과거분사(형용사)): rounded가 뒤의 명사 bodies를 수식하며, &#39;둥글게 만들어진&#39;이라는 상태를 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문어는 위험을 느낄 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When octopuses feel danger</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 사용한다</span><span class=\"en\"><b>they use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 특별한 위장 기술을</span><span class=\"en\"><b>their special camouflage skill.</b></span></div></div><div class=\"lec-sent-ko\">문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 문어의 외형 정보에서 나아가, 생존을 위한 문어의 구체적인 방어 기제로 논리를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When octopuses feel danger (분사구문(절)): 시간의 접속사 When을 사용하여 &#39;문어들이 위험을 느낄 때&#39;라는 상황을 설정하는 부사절임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">camouflage</td><td class=\"m\">위장, 변장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문어는 색과 무늬를 바꿀 수 있다</span><span class=\"en\"><b>Octopuses can change colors and patterns</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맞추기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to match</span> their surroundings.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 주변 환경에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 위장 기술이 무엇인지 구체적인 방법을 설명하며, 환경에 적응하는 능력을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to match (to부정사): 부사적 용법으로, 앞에 나온 동사 change와 그 결과를 목적의 의미로 보충 설명하여 &#39;주변 환경과 일치시키기 위해서&#39;라는 목적을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surroundings</td><td class=\"m\">환경, 주변</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 해초 가까이에 있으면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If they’re near sea plants</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 ~처럼 보인다</span><span class=\"en\"><b>they look like sea plants.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해초</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위장 기술의 예시를 들어 문어가 주변 사물과 얼마나 완벽하게 동화되는지를 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If they’re near sea plants (조건절): 접속사 If로 시작하는 조건의 부사절이며, 주어(they)와 be동사(’re)가 결합된 상태의 가정임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 산호초 가까이에 있으면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If they’re near coral reefs</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 ~처럼 보인다</span><span class=\"en\"><b>they look like coral reefs.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산호초</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 또 다른 환경에서의 위장 사례를 나열함으로써 문어의 뛰어난 적응력을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If they’re near coral reefs (조건절): 접속사 If로 시작하는 조건의 부사절이며, they(문어들)가 특정 환경에 있을 경우를 가정함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coral reef</td><td class=\"m\">산호초</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 조개껍데기를 붙일 수 있다</span><span class=\"en\"><b>They can also stick shells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 몸에</span><span class=\"en\"><b>on their bodies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바위처럼 보이기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to look like a rock</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 몸의 색과 무늬를 바꾸는 것을 넘어, 외부 도구까지 활용해 주변 환경에 완벽히 숨는 지능적인 생존 방식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to look like a rock (to부정사): 부사적 용법으로, 문장 앞부분의 행동(stick shells)을 하는 목적을 나타내어 &#39;바위처럼 보이기 위해&#39;라고 해석함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stick</td><td class=\"m\">붙이다, 고수하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는</span><span class=\"en\"><b>This <span class=\"grammar-hl\">can fool</span> predators completely.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">속일 수 있다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물을 완전히</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이는 포식 동물을 완전히 속일 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 모든 위장 행동들이 결과적으로 천적을 어떻게 방어하는지에 대한 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can fool 조동사 구문: can이 동사 fool을 수식하여 &#39;속일 수 있다&#39;는 가능의 의미를 형성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fool</td><td class=\"m\">속이다, 기만하다</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문어는</span><span class=\"en\"><b>Octopuses <span class=\"grammar-hl\">can spread</span> ink.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼뜨릴 수 있다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹물을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">문어는 먹물을 퍼뜨릴 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문어의 두 번째 방어 기제인 먹물에 대한 핵심 정보를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can spread 조동사 구문: can이 동사 spread를 수식하여 &#39;먹물을 내뿜을 수 있다&#39;는 능력을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spread</td><td class=\"m\">펼치다, 퍼뜨리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 만들어 낸다</span><span class=\"en\"><b>It creates a dark cloud</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹구름을</span><span class=\"en\"><b><span class=\"grammar-hl\">that blocks the view</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시야를 가리는</span><span class=\"en\"><b><span class=\"grammar-hl\">of predators</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포식 동물의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문어가 뿜은 먹물이 포식자에게 어떤 영향을 미치는지 구체적인 기전과 효과를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that blocks the view of predators (관계대명사): 주격 관계대명사 that이 선행사 a dark cloud를 수식하며, 절 내에서 that은 주어 역할을 수행함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">block</td><td class=\"m\">막다, 차단하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는 준다</span><span class=\"en\"><b>This gives them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게</span><span class=\"en\"><b>enough time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분한 시간을</span><span class=\"en\"><b><span class=\"grammar-hl\">to escape</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도망칠</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이는 그들에게 도망칠 충분한 시간을 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 먹물이라는 방어 기제가 결국 문어의 생존을 어떻게 보장하는지 최종적인 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to escape (to부정사): 형용사적 용법으로, 앞의 명사 time을 수식하여 &#39;탈출할 (시간)&#39;이라는 의미를 만듦.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문어는 바닷속에서 바위처럼 보일 정도로 주변 환경에 완벽하게 동화된다.</li><li>문어는 위험을 피하기 위해 색깔과 무늬를 바꾸거나 사물을 몸에 붙이는 위장술을 쓴다.</li><li>위장술 외에도 먹물을 뿜어 포식자의 시야를 가리는 방법으로 위기에서 탈출한다.</li><li>이러한 생존 전략 덕분에 문어는 포식자로부터 자신의 몸을 보호한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Octopuses camouflage themselves to blend into their environment, while using ink to creat
