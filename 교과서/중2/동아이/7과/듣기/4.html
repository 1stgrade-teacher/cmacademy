  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

lecturePlayer(document.getElementById("app"),{"brand":"Topic 1 > B","title":"중2 동아(이) 7과 Topic 1 > B","audioDir":"4_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">반복 요청하고 추가 설명 요청하기\u003c/div>\u003ch1>중2 동아(이) 7과 대화문 해설 - 지퍼 이야기로 배우는 반복 요청과 추가 설명 요청\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>G가 첫 지퍼가 신발에 사용되었다는 이야기를 꺼내고, B가 다시 말해 달라고 한 뒤 지퍼에 대해 더 설명해 달라고 요청하는 상황입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 동아 출판 칠 과 대화문을 함께 공부해요. 소녀가 첫 지퍼가 신발에 사용되었다는 흥미로운 이야기를 꺼내고, 소년이 다시 말해 달라고 하면서 대화가 시작돼요. 오늘은 반복을 요청하는 표현과 추가 설명을 요청하는 표현을 집중해서 들어 보세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">➊Did you know that the first zipper was used on a shoe?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">What did you say?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I said, &quot;The first zipper was used on a shoe.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">That's interesting. Can you tell me more about ➋ it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">➌Sure. A man wanted to ➍put on his shoes quickly, so he\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cdiv class=\"d-en\">made zippers for them.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Wow! ➎What a great idea!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Yeah. Now, we use zippers on many things ➏ like jackets\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cdiv class=\"d-en\">and bags.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"➊Did you know that the first zipper was used on a shoe?","hl":"r-0"},{"n":3,"text":"What did you say?","hl":"r-1"},{"n":4,"text":"I said, \"The first zipper was used on a shoe.\"","hl":"r-2"},{"n":5,"text":"That's interesting. Can you tell me more about ➋ it?","hl":"r-3"},{"n":6,"text":"➌Sure. A man wanted to ➍put on his shoes quickly, so he","hl":"r-4"},{"n":7,"text":"made zippers for them.","hl":"r-5"},{"n":8,"text":"Wow! ➎What a great idea!","hl":"r-6"},{"n":9,"text":"Yeah. Now, we use zippers on many things ➏ like jackets","hl":"r-7"},{"n":10,"text":"and bags.","hl":"r-8"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">반복 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What did you say?\u003c/div>\u003cdiv class=\"d-mean\">뭐라고 했니? / 다시 말해 줄래?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: What did you say?\u003c/div>\u003cdiv class=\"d-exp\">상대방이 한 말을 잘 알아듣지 못했을 때 \u003cb class=\"key\">다시 말해 달라\u003c/b>고 요청하는 표현이에요. \u003cb class=\"key\">What did you say?\u003c/b>는 짧고 친근하게 쓸 수 있고, 답할 때는 \u003cb class=\"key\">I said ~.\u003c/b>로 자신이 한 말을 다시 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Can you repeat that?\u003c/li>\u003cli>Could you say that again?\u003c/li>\u003cli>Pardon?\u003c/li>\u003cli>I didn’t get that.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I said ~.\u003c/li>\u003cli>I was saying ~.\u003c/li>\u003cli>I said that ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"첫 번째 기능은 반복 요청하기예요. 상대방이 한 말을 잘 못 알아들었을 때 What did you say?라고 말해요. 뜻은 뭐라고 했니이고, 다시 말해 달라는 요청이에요.","hl":"key"},{"n":12,"text":"같은 뜻으로 Can you repeat that?이라고 할 수 있어요. Could you say that again?도 같은 표현이고, Pardon?이나 I didn’t get that.처럼 짧게 말할 수도 있어요.","hl":"alts"},{"n":13,"text":"이 요청에 답할 때는 I said 다음에 자신이 한 말을 다시 말해요. I was saying이라고 해도 되고, I said that으로 시작해도 자연스러워요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">추가 설명 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you tell me more about + 대상?\u003c/div>\u003cdiv class=\"d-mean\">그것에 관해 더 말해 줄 수 있어?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: That's interesting. Can you tell me more about ➋ it?\u003c/div>\u003cdiv class=\"d-exp\">앞서 언급된 대상에 대해 \u003cb class=\"key\">추가 설명\u003c/b>을 요청할 때 쓰는 표현이에요. \u003cb class=\"key\">Can you tell me more about it?\u003c/b>은 그것에 관해 더 말해 줄 수 있어라는 뜻이고, 요청을 받으면 \u003cb class=\"key\">Sure.\u003c/b>나 Of course.로 수락한 뒤 구체적으로 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Please tell me more about it.\u003c/li>\u003cli>I’d like to know more about it.\u003c/li>\u003cli>Can you give me more information about it?\u003c/li>\u003cli>Can you explain it to me?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. It means ~.\u003c/li>\u003cli>Of course. Let me explain.\u003c/li>\u003cli>Okay. I’ll tell you more about it.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"두 번째 기능은 추가 설명 요청하기예요. 앞에 나온 대상에 대해 더 알고 싶을 때 Can you tell me more about it?이라고 말해요. 뜻은 그것에 관해 더 말해 줄 수 있어예요.","hl":"key"},{"n":15,"text":"같은 뜻으로 Please tell me more about it.이라고 할 수 있어요. I’d like to know more about it.이나 Can you give me more information about it?도 자연스럽고, Can you explain it to me?라고도 말해요.","hl":"alts"},{"n":16,"text":"설명을 요청받으면 Sure.나 Of course.로 먼저 수락해요. 그다음 It means로 뜻을 설명하거나 Let me explain이라고 하면서 자세히 알려 주면 돼요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➊\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Did you know that\u003c/span> the first zipper \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was used\u003c/span> on a shoe?\u003c/div>\u003cdiv class=\"d-ko\">첫 번째 지퍼가 신발에 사용되었다는 것을 알고 있었니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>「Did you know that + 주어 + 동사 ~?」는 ‘~라는 것을 알고 있었니?’라고 묻는 \u003cb class=\"key\">의문문\u003c/b>이에요. 여기서 that은 ‘~라는 것’을 이끄는 \u003cb class=\"key\">명사절 접속사\u003c/b>입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>「was used」는 ‘사용되었다’라는 뜻의 \u003cb class=\"key\">수동태\u003c/b>로, 지퍼가 사람들에 의해 사용된 대상임을 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Did you know the first zipper was used on a shoe?\u003c/span>\u003cspan>Have you heard that the first zipper was used on a shoe?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">What did you say?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">뭐라고 했니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>상대방이 한 말을 잘 알아듣지 못했을 때 \u003cb class=\"key\">다시 말해 달라\u003c/b>고 요청하는 표현이에요. \u003cb class=\"key\">What did you say?\u003c/b>는 ‘뭐라고 했니?’라는 뜻으로, 짧게 Pardon?이나 Sorry?로도 말할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Can you repeat that?\u003c/span>\u003cspan>Could you say that again?\u003c/span>\u003cspan>Pardon?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"첫 번째 줄은 Did you know that the first zipper was used on a shoe?라는 문장이에요. 뜻은 첫 지퍼가 신발에 사용되었다는 것을 알고 있었니라는 말이죠. 여기서 Did you know that은 라는 것을 알고 있었니라고 묻는 표현이고, was used는 사용되었다라는 수동태예요. 비슷하게 Have you heard that the first zipper was used on a shoe?라고도 말할 수 있어요.","hl":"l-0"},{"n":18,"text":"두 번째 줄은 What did you say?라는 문장이에요. 뜻은 뭐라고 했니이고, 상대방의 말을 잘 못 알아들었을 때 다시 말해 달라고 요청하는 표현이에요. Can you repeat that?이나 Could you say that again?이라고도 할 수 있고, 짧게 Pardon?이나 Sorry?라고도 해요. 답할 때는 I said로 시작해서 자신이 한 말을 다시 말해 주면 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I said\u003c/span>, &quot;\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">The first zipper was used on a shoe.\u003c/span>&quot;\u003c/div>\u003cdiv class=\"d-ko\">나는 ‘첫 지퍼가 신발에 사용되었다’고 말했어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>반복 요청에 답할 때 \u003cb class=\"key\">I said\u003c/b> 뒤에 자신이 한 말을 다시 말해 줄 수 있어요. 여기서는 말한 내용을 그대로 다시 전달하는 \u003cb class=\"key\">직접 인용\u003c/b>이 이어집니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>「was used」는 ‘사용되었다’라는 뜻의 \u003cb class=\"key\">수동태\u003c/b>이고, on a shoe는 ‘신발에’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I said that the first zipper was used on a shoe.\u003c/span>\u003cspan>I told you that the first zipper was used on a shoe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">That's interesting. Can you tell me more about ➋ \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>? \u003cspan class=\"mk\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">흥미롭네. 그것에 관해 더 말해 줄 수 있어?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>앞서 언급된 대상에 대해 \u003cb class=\"key\">추가 설명\u003c/b>을 요청하는 표현이에요. 「Can you tell me more about + 대상?」 형태로 써요. \u003cb class=\"key\">Can you tell me more about it?\u003c/b>은 ‘그것에 관해 더 말해 줄 수 있어?’라는 뜻입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>여기서 \u003cb class=\"key\">it\u003c/b>은 앞에 나온 \u003cb class=\"key\">the first zipper\u003c/b>를 가리키는 대명사예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Please tell me more about it.\u003c/span>\u003cspan>I’d like to know more about it.\u003c/span>\u003cspan>Can you give me more information about it?\u003c/span>\u003cspan>Can you explain it to me?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"세 번째 줄은 I said, the first zipper was used on a shoe.라는 문장이에요. 뜻은 나는 첫 지퍼가 신발에 사용되었다고 말했어라는 말이죠. 반복 요청에 답할 때는 I said 뒤에 자신이 한 말을 다시 말해요. I said that the first zipper was used on a shoe.처럼 that을 넣어 말할 수도 있어요.","hl":"l-0"},{"n":20,"text":"네 번째 줄은 That’s interesting. Can you tell me more about it?라는 문장이에요. 뜻은 흥미롭네. 그것에 관해 더 말해 줄 수 있어라는 말이죠. Can you tell me more about it?은 앞에 나온 대상에 대해 추가 설명을 요청하는 표현이에요. Please tell me more about it.이나 Can you explain it to me?라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➌\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Sure.\u003c/span> A man wanted to ➍put on his shoes quickly, \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">so he\u003c/span> \u003cspan class=\"mk\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">물론이지. 한 남자가 신발을 빨리 신고 싶어 했어, 그래서 그는\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>설명을 요청받았을 때 \u003cb class=\"key\">Sure.\u003c/b>는 ‘물론이지’라는 뜻으로 요청을 \u003cb class=\"key\">수락\u003c/b>하는 말이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>「want to + 동사원형」은 ‘~하고 싶어 하다’이고, \u003cb class=\"key\">put on\u003c/b>은 ‘신다, 입다’라는 뜻의 \u003cb class=\"key\">구동사\u003c/b>예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">so\u003c/b>는 ‘그래서’라는 뜻으로 앞의 이유에 이어 \u003cb class=\"key\">결과\u003c/b>를 나타내는 접속사예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">made zippers for them\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">그 신발들을 위해 지퍼를 만들었어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">make\u003c/b>는 ‘만들다’라는 뜻이고, for는 ‘~을 위해’라는 뜻이에요. \u003cb class=\"key\">them\u003c/b>은 앞에 나온 his shoes를 가리켜요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"다섯 번째 줄은 Sure. A man wanted to put on his shoes quickly, so he라는 문장이에요. 뜻은 물론이지. 한 남자가 신발을 빨리 신고 싶어 했어, 그래서 그는이라는 말이죠. Sure.는 설명을 요청받았을 때 수락하는 말이고, put on은 신다, 입다라는 뜻이에요. so는 그래서라는 뜻으로 뒤에 결과가 이어져요.","hl":"l-0"},{"n":22,"text":"여섯 번째 줄은 made zippers for them.이라는 문장이에요. 뜻은 그 신발들을 위해 지퍼를 만들었어라는 말이죠. make something for someone은 누군가를 위해 무엇을 만들다라는 뜻이고, them은 앞에 나온 his shoes를 가리켜요. 그래서 한 남자가 신발을 빨리 신기 위해 지퍼를 만든 거예요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Wow! ➎\u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">What a great idea!\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">와! 정말 멋진 생각이야!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>「What a + 형용사 + 명사!」는 ‘정말 ~한 명사구나!’라는 뜻의 \u003cb class=\"key\">감탄문\u003c/b>이에요. \u003cb class=\"key\">What a great idea!\u003c/b>는 ‘정말 멋진 생각이야!’라고 감탄할 때 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That’s a great idea!\u003c/span>\u003cspan>What a wonderful idea!\u003c/span>\u003cspan>How great that idea is!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yeah. Now, we use zippers \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">on many things\u003c/span> ➏ \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> jackets\u003c/div>\u003cdiv class=\"d-ko\">응. 이제 우리는 재킷 같은 많은 물건에 지퍼를 사용해\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>여기서 \u003cb class=\"key\">like\u003c/b>는 ‘~와 같은’이라는 뜻으로, 앞에 나온 many things의 \u003cb class=\"key\">예\u003c/b>를 들 때 쓰는 전치사예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">14\u003c/span>\u003cspan>\u003cb class=\"key\">on many things\u003c/b>는 ‘많은 물건에’라는 뜻으로, 지퍼가 붙어 있는 대상을 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"일곱 번째 줄은 Wow! What a great idea!라는 문장이에요. 뜻은 와! 정말 멋진 생각이야라는 말이죠. What a great idea!는 What a와 형용사 great, 명사 idea가 함께 쓰인 감탄문이에요. 비슷하게 That’s a great idea!나 What a wonderful idea!라고도 말할 수 있어요.","hl":"l-0"},{"n":24,"text":"여덟 번째 줄은 Yeah. Now, we use zippers on many things like jackets라는 문장이에요. 뜻은 응. 이제 우리는 재킷 같은 많은 물건에 지퍼를 사용해라는 말이죠. 여기서 like는 와 같은이라는 뜻으로 예를 들 때 쓰는 전치사예요. on many things는 많은 물건에라는 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan class=\"tgt\">and bags\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">그리고 가방에도.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan>\u003cb class=\"key\">and\u003c/b>는 ‘그리고’라는 뜻으로 두 가지 \u003cb class=\"key\">예\u003c/b>를 연결해요. jackets and bags는 앞에 나온 many things의 예를 이어서 보여 주는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"아홉 번째 줄은 and bags.라는 표현이에요. 뜻은 그리고 가방에도라는 말이죠. jackets and bags는 앞에 나온 many things의 예를 이어서 보여 주는 표현이에요. and는 그리고라는 뜻으로 두 가지 예를 자연스럽게 연결해 줘요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 What did you say?와 같은 의도로 상대방에게 다시 말해 달라고 요청하는 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">B: ____\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Can you repeat that?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>What did you do?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>How about you?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Nice to meet you.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Can you repeat that?\u003c/span>\u003cdiv class=\"g-exp\">What did you say?는 상대방의 말을 못 알아들었을 때 다시 말해 달라는 표현이에요. Can you repeat that?도 같은 의도로 쓸 수 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"상대방에게 다시 말해 달라고 요청하는 표현을 고르는 문제예요. 첫 번째 보기는 Can you repeat that?, 두 번째 보기는 What did you do?, 세 번째 보기는 How about you?, 네 번째 보기는 Nice to meet you.예요. 잠시 멈추고 답을 골라 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 첫 번째 보기예요. Can you repeat that?은 다시 말해 줄 수 있어요라는 뜻으로, What did you say?와 같은 의도로 반복을 요청할 때 써요. What did you do?는 무엇을 했어요라는 뜻이라서 답이 아니에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Can you tell me more ____ it?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>about\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>for\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>with\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>to\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">about\u003c/span>\u003cdiv class=\"g-exp\">「Can you tell me more about + 대상?」은 ‘그것에 관해 더 말해 줄 수 있어?’라는 뜻이에요. 대상에 대해 추가 설명을 요청할 때 about을 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"빈칸에 들어갈 말을 고르는 문제예요. 문장은 Can you tell me more blank it?이고, 첫 번째 보기는 about, 두 번째 보기는 for, 세 번째 보기는 with, 네 번째 보기는 to예요. 잠시 멈추고 답을 골라 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 첫 번째 보기인 about이에요. Can you tell me more about it?은 그것에 관해 더 말해 줄 수 있어라는 뜻으로, 추가 설명을 요청할 때 about을 써요. for나 with, to는 이 표현에 알맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/spa 003c/span>\u003cdiv class=\"g-exp\">B는 Can you tell me more about it?이라고 말하며 지퍼에 대한 추가 설명을 요청했어요. 첫 지퍼는 신발에 사용되었고, 오늘날에는 재킷과 가방 등 여러 물건에 쓰여요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"대화 내용과 일치하는 보기를 고르는 문제예요. 첫 번째 보기는 첫 지퍼는 가방에 처음 사용되었다, 두 번째 보기는 B는 G의 말을 한 번에 모두 이해했다, 세 번째 보기는 오늘날 지퍼는 신발에만 사용된다, 네 번째 보기는 B는 지퍼에 대해 더 알고 싶어 했다예요. 잠시 멈추고 답을 골라 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 네 번째 보기예요. B가 Can you tell me more about it?이라고 말했으니까 지퍼에 대해 더 알고 싶어 한 것이 맞아요. 첫 지퍼는 신발에 사용되었고, 오늘날 지퍼는 재킷과 가방 같은 여러 물건에 쓰여요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 「What a + 형용사 + 명사!」 형태의 감탄문으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>What a great idea!\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>What did you say?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Can you tell me more about it?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The first zipper was used on a shoe.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">What a great idea!\u003c/span>\u003cdiv class=\"g-exp\">「What a + 형용사 + 명사!」는 ‘정말 ~한 명사구나!’라는 뜻의 감탄문이에요. What a great idea!는 ‘정말 멋진 생각이야!’라는 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"감탄문으로 알맞은 표현을 고르는 문제예요. 첫 번째 보기는 What a great idea!, 두 번째 보기는 What did you say?, 세 번째 보기는 Can you tell me more about it?, 네 번째 보기는 The first zipper was used on a shoe.예요. 잠시 멈추고 답을 골라 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 첫 번째 보기예요. What a great idea!는 What a 다음에 형용사 great와 명사 idea가
