lecturePlayer(document.getElementById("app"),{"brand":"Topic 2 > A","title":"중2 동아(이) 7과 Topic 2 > A","audioDir":"5_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">설명 요청하고 답하기\u003c/div>\u003ch1>중2 동아(이) 7과 대화문 해설 강의\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>제이크와 하나가 공원에서 큰 조각 작품을 보고 public art에 대해 이야기합니다. 하나가 말을 되묻고 더 설명해 달라고 하자 제이크가 public art의 뜻과 예를 설명합니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 동아 이 교과서의 일곱 번째 과 대화문을 함께 공부해 볼게요. 제이크와 하나가 공원에서 큰 조각 작품을 보고 public art, 즉 공공 예술에 대해 이야기해요. 하나가 제이크의 말을 다시 묻고, 제이크는 public art가 무엇인지 친절하게 설명해 줍니다. 그럼 대화를 한 줄씩 자세히 살펴볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">Jake\u003c/span>\u003cdiv class=\"d-en\">Wow! Look at the big sculpture ➊over there.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">Hana\u003c/span>\u003cdiv class=\"d-en\">➋ It's beautiful. The word &quot;love&quot; is in big red\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cdiv class=\"d-en\">➌ letters.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">Jake\u003c/span>\u003cdiv class=\"d-en\">➋ It's a great example of public art.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">Hana\u003c/span>\u003cdiv class=\"d-en\">What did you say?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">Jake\u003c/span>\u003cdiv class=\"d-en\">I said &quot;public art.&quot; ➍ It's art for everyone.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">Hana\u003c/span>\u003cdiv class=\"d-en\">I like that idea. Can you tell me more about ➍ it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub =\"key\">What did you say?\u003c/b>라고 되물어요. 처음 못 들었거나 다시 확인할 때는 \u003cb class=\"key\">Could you say that again?\u003c/b>처럼 공손하게 말할 수 있어요. 답할 때는 \u003cb class=\"key\">I said + 내용\u003c/b>으로 방금 한 말을 다시 전해 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you say that again?\u003c/li>\u003cli>I'm sorry, what did you say?\u003c/li>\u003cli>Could you repeat that?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I said + 내용.\u003c/li>\u003cli>What I said was + 내용.\u003c/li>\u003cli>I was talking about + 내용.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"여러분, 상대가 한 말을 못 알아들었을 때 어떻게 하죠? 그때 What did you say?라고 해요. 뜻은 뭐라고 말했어요?예요. 방금 들은 말을 다시 확인하는 표현이에요.","hl":"key"},{"n":15,"text":"조금 더 공손하게는 Could you say that again?이라고 해요. 뜻은 다시 한번 말해 줄 수 있어요?예요. I'm sorry, what did you say?라고 하면 미안하지만 뭐라고 말했어요?라는 느낌이고, Could you repeat that?도 같은 뜻으로 쓸 수 있어요.","hl":"alts"},{"n":16,"text":"대답은 I said 뒤에 다시 말할 내용을 붙여요. 예를 들어 I said public art.라고 하면 public art라고 말했어요라는 뜻이에요. What I said was public art.처럼 말할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">설명을 더 요청하고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you tell me more about + 대상?\u003c/div>\u003cdiv class=\"d-mean\">~에 대해 더 말해 줄 수 있어요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I like that idea. Can you tell me more about ➍ it?\u003c/div>\u003cdiv class=\"d-exp\">설명을 더 요청할 때는 \u003cb class=\"key\">Can you tell me more about + 대상?\u003c/b>이라고 해요. 대답할 때는 \u003cb class=\"key\">Sure.\u003c/b>나 Of course.로 수락한 뒤 \u003cb class=\"key\">It means ~.\u003c/b> 등으로 구체적으로 설명해요. 수락하는 말 없이 바로 설명해 줄 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you explain more about + 대상?\u003c/li>\u003cli>I'd like to know more about + 대상.\u003c/li>\u003cli>Can you give me more details about + 대상?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. It's + 설명.\u003c/li>\u003cli>Of course. It means + 설명.\u003c/li>\u003cli>Sure. Let me explain.\u003c/li>\u003cli>Of course. It's art in public spaces like parks and streets.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이번에는 설명을 더 요청하는 표현을 배워 볼게요. 하나가 Can you tell me more about it?이라고 말하죠. 뜻은 그것에 대해 더 말해 줄 수 있어요?예요. 모르는 것이나 궁금한 것에 대해 더 자세히 알고 싶을 때 쓰는 표현이에요.","hl":"key"},{"n":18,"text":"Could you explain more about it?이라고 하면 그것에 대해 더 설명해 줄 수 있어요?라는 뜻이에요. I'd like to know more about it.은 그것에 대해 더 알고 싶어요라는 뜻이고, Can you give me more details about it?은 더 자세한 내용을 말해 줄 수 있어요?라는 뜻이에요.","hl":"alts"},{"n":19,"text":"설명을 요청받으면 Sure나 Of course로 먼저 수락해요. 그다음 It means 같은 표현으로 구체적으로 설명해 주면 돼요. 수락하는 말 없이 바로 설명해 줄 수도 있어요. 예를 들어 Sure. It's art in public spaces like parks and streets.라고 말할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Jake\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Wow! \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look at\u003c/span> the big sculpture ➊\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">over there\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">와! 저쪽에 있는 큰 조각 작품을 봐.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">look at + 목적어\u003c/b>는 '~을 봐'라는 뜻으로, 상대의 주의를 끌 때 써요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">over there\u003c/b>는 '저쪽에'라는 뜻이에요. 여기서는 조각 작품이 있는 위치를 가리켜요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Check out the big sculpture over there.\u003c/span>\u003cspan>Do you see the big sculpture over there?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">Hana\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➋ \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> beautiful. The word &quot;love&quot; is \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">in big red\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">예쁘네. 'love'라는 단어가 큰 빨간\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">It\u003c/b>은 앞에 나온 the big sculpture를 가리켜요. It's는 It is의 줄임말이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">in + 색깔 + letters\u003c/b>는 '~색 글자로'라는 뜻이에요. 다음 줄의 letters와 이어져요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That's beautiful.\u003c/span>\u003cspan>It looks beautiful.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 줄이에요. 제이크가 Wow! Look at the big sculpture over there.라고 말해요. 뜻은 와! 저쪽에 있는 큰 조각 작품을 봐.예요. 여기서 over there는 저쪽에라는 뜻으로 위치를 가리켜요. 비슷한 말로 Check out the big sculpture over there라고 하면 저쪽에 있는 큰 조각 작품을 한번 봐라는 느낌이에요.","hl":"l-0"},{"n":21,"text":"두 번째 줄이에요. 하나가 It's beautiful. The word love is in big red라고 말해요. 뜻은 예쁘네. love라는 단어가 큰 빨간이에요. It은 앞에 나온 the big sculpture를 가리키고, It's는 It is의 줄임말이에요. 다음 줄의 letters와 이어서 큰 빨간 글자로라는 뜻이 된다는 것도 기억해요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➌ \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">letters\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">글자로.\
