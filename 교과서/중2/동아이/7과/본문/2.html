@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 7과 본문2","audioDir":"2_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Origin of the Phrase Spill the Beans\u003c/h1>\u003ch2>‘콩을 쏟다’라는 어구의 유래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 비밀을 드러낸다는 뜻을 가진 \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>라는 어구가 고대 그리스의 \u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방법\u003c/b>에서 유래 \u003cb class=\"key\">유래\u003c/b>했음을 설명하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The phrase spill the beans means to reveal a secret, and it originated from an ancient Greek voting method.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 영어 교과서에 나오는 재미있는 관용구의 유래를 함께 살펴볼게요. 이번 시간 지문에서는 비밀을 드러낸다는 뜻을 가진 표현의 배경을 다루고 있답니다. 글 전체의 요약과 요지를 탄탄하게 정리해 보도록 할게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 일상에서 자주 쓰는 관용구는 저마다 흥미로운 역사적 \u003cb class=\"key\">배경지식\u003c/b>을 가지고 있어요. 영어에서는 \u003cb class=\"key\">idiom\u003c/b>이라고 부르는 이런 표현들은 단어의 원래 뜻만으로는 이해하기 어렵기 때문에 그 유래를 함께 알아두면 아주 유용해요. 마치 우리가 엎지른 물을 담을 수 없듯이 말이죠. 오늘 살펴볼 \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b> 역시 고대 그리스 시대의 \u003cb class=\"key\">투표\u003c/b> 문화에서 시작된 아주 재미있는 표현이랍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 넓혀볼까요. 우리가 쓰는 관용구인 idiom은 일상 속 비유에서 시작된 경우가 많아요. 엎지른 물을 담을 수 없듯이 말이죠. 오늘 배울 내용 역시 고대의 흥미로운 투표 문화에서 유래된 표현이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>비밀 파티 준비와 위기\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Tommy와 Lisa는 하나를 위한 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">파티\u003c/b>를 준비하고 있었어요. 하지만 Tommy는 비밀을 잘 지키지 못하는 성격이라 Lisa가 그에게 \u003cb class=\"key\">비밀\u003c/b>을 누설하지 말라고 경고했답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>약속과 파티의 성공\u003csmall>전개 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>Tommy는 하나에게 \u003cb class=\"key\">비밀\u003c/b>을 말하지 않겠다고 \u003cb class=\"key\">약속\u003c/b>했어요. 결국 Tommy는 그 약속을 잘 지켰고 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">파티\u003c/b>는 대성공을 거두었으며 하나는 완전히 깜짝 놀랐죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>어구의 의미와 유래\u003csmall>질문-답변 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>지문은 \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>라는 어구가 무슨 뜻인지 질문을 던져요. 그것은 \u003cb class=\"key\">비밀을 \u003c/b>\u003cb class=\"key\">드러내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 의미하며 고대 그리스의 \u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방법\u003c/b>에서 유래했음을 밝혀줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>투표 방식과 확장된 의미\u003csmall>결론 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>고대 그리스인들은 투표할 때 큰 항아리에 흰색이나 검은색 콩을 넣었고 투표가 끝나면 콩을 \u003cb class=\"key\">쏟아 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 드러냈어요. 그때부터 사람들은 이 어구를 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">의미\u003c/b>로 사용하기 시작했답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 파티 일화에서 시작해 관용구의 뜻과 유래를 밝히는 흐름으로 전개돼요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서 세 번째 문장까지를 보면 Tommy와 Lisa가 하나를 위한 깜짝 파티를 준비하는 장면이 나와요. 하지만 Tommy는 비밀을 잘 지키지 못하는 성격이라 Lisa가 그에게 비밀을 쏟지 말라고 경고하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장에서 일곱 번째 문장까지는 약속과 파티의 결과가 나와요. Tommy는 비밀을 말하지 않겠다고 약속했고 그 약속을 잘 지켜서 깜짝 파티는 대성공을 거두었으며 하나는 완전히 깜짝 놀라게 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여덟 번째 문장에서 열한 번째 문장까지는 핵심 어구에 대한 질문과 답변이에요. 지문은 spill the beans가 무슨 뜻인지 묻고 그것이 비밀을 드러내는 것을 의미하며 고대 그리스의 투표 방법에서 유래했다고 설명해요.","hl":"f2"},{"n":7,"text":"네 번째 단계인 열두 번째 문장에서 열네 번째 문장까지는 구체적인 유래와 결론이에요. 고대 그리스인들은 항아리에 콩을 넣고 투표가 끝나면 콩을 쏟아 결과를 드러냈고 그때부터 사람들은 이 어구를 새로운 의미로 사용하기 시작했답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">파티\u003c/b> 일화로 흥미를 유발한 뒤 핵심 어구의 의미를 묻는 질문을 던지고 그에 대한 \u003cb class=\"key\">답변\u003c/b>으로 \u003cb class=\"key\">어구의 \u003c/b>\u003cb class=\"key\">유래\u003c/b>를 설명하는 \u003cb class=\"key\">질문-답변\u003c/b> 구조를 취하고 있어요. 중간에 던진 질문이 글 전체의 중심 내용을 이끌어가는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">축\u003c/b> 역할을 하죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>역접\u003c/span>\u003cb>So (3)\u003c/b>\u003cspan>인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">spill the beans\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reveal a secret\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bean\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">voting\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문을 던지고 그에 대한 답을 풀어내는 질문-답변 구조로 되어 있어요. 글의 중간에 등장하는 질문이 전체 내용을 이끌어가는 중심축 역할을 톡톡히 하고 있답니다.","hl":"ty"},{"n":9,"text":"문장 속 연결고리도 잘 살펴봐야 해요. 두 번째 문장에서는 반대 상황을 이끄는 But이 나오고 세 번째 문장에서는 그에 따른 결과를 나타내는 So가 등장해서 글의 흐름을 매끄럽게 이어주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u 의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">secret\u003c/b>\u003cspan class=\"m\">비밀\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">confidential\u003c/span>\u003cspan class=\"s\">mystery\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">openness\u003c/span>\u003cspan class=\"a\">public\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reveal\u003c/b>\u003cspan class=\"m\">드러내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disclose\u003c/span>\u003cspan class=\"s\">expose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">success\u003c/b>\u003cspan class=\"m\">성공\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ancient\u003c/b>\u003cspan class=\"m\">고대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">antique\u003c/span>\u003cspan class=\"s\">old\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">recent\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들의 동의어와 반의어도 함께 외워볼게요. 비밀을 뜻하는 secret은 mystery와 비슷하고 반대로 공개나 공개된 상태를 뜻하는 public과는 반대말이 되죠. 또 드러내다라는 뜻의 reveal은 disclose와 동의어이고 숨기다라는 뜻의 hide와는 반의어가 된답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콩을 쏟다\u003c/span>\u003cspan class=\"en\">Spill the Beans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tommy와 Lisa는 준비하고 있었다\u003c/span>\u003cspan class=\"en\">Tommy and Lisa \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">preparing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나를 위한 깜짝 파티를\u003c/span>\u003cspan class=\"en\">a surprise party for Hana.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">콩을 쏟다 Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본문의 제목이자 전체 이야기의 핵심 소재인 \u003cb class=\"key\">비유적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 제시하며, 주인공인 Tommy와 Lisa가 Hana의 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">파티\u003c/b>를 준비하는 상황을 설명하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : 주어 [Tommy and Lisa] + [be동사 과거형(were) + -ing(preparing)] : \"~하고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Spill the Beans, 콩을 쏟다. Tommy and Lisa were preparing, Tommy와 Lisa는 준비하고 있었다. a surprise party for Hana, 하나를 위한 깜짝 파티를. 이 문장 전체를 해석하면, 콩을 쏟다 Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 이번과의 핵심 소재인 비유적 표현을 보여주며, 토마스와 리사가 하나를 위해 깜짝 파티를 준비하고 있는 상황을 시작하고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 과거진행형이에요. 토마스와 리사 두 사람이라 복수 주어니까 be동사는 were를 쓰고 뒤에 ing를 붙여서 과거진행형을 만든다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 Tommy는 ~을 잘하지 못했다\u003c/span>\u003cspan class=\"en\">But Tommy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비밀을 지키는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keeping\u003c/span> secrets.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 Tommy는 비밀을 지키는 것을 잘하지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 파티를 준비하는 상황과 대조되게, Tommy가 \u003cb class=\"key\">비밀을 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">지키지 \u003c/b>\u003cb class=\"key\">못한다\u003c/b>는 성향을 보여주어 앞으로 일어날 갈등을 암시하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be good at ~\u003c/span> : 주어 [Tommy] + [be동사(was) + not + good at + 명사/동명사] : \"~을 잘하지 못한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : 전치사 [at] + [동명사(keeping)] : \"지키는 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But Tommy was not good at, 그러나 Tommy는 ~을 잘하지 못했다. keeping secrets, 비밀을 지키는 것. 이 문장 전체를 해석하면, 그러나 Tommy는 비밀을 지키는 것을 잘하지 못했다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 파티 준비 상황과 반대로 토마스가 비밀을 잘 지키지 못하는 성격이라는 것을 보여주며 긴장감을 높여주고 있어요.","hl":"mn"},{"n":17,"text":"두 번째 어법 포인트는 전치사 뒤에 오는 동명사예요. at은 전치사니까 뒤에 반드시 명사나 동명사 형태인 keeping이 와야 한다는 것을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Lisa는 그에게 말했다\u003c/span>\u003cspan class=\"en\">Lisa \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“콩을 쏟지 마.”라고\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">spill\u003c/span> the beans.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cd 요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : [동사 mean] + [to부정사(to + 동사원형)] : \"비밀을 드러내는 것을\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It means, 그것은 의미한다. to reveal a secret, 비밀을 드러내는 것을. 이 문장 전체를 해석하면, 그것은 비밀을 드러내는 것을 의미한다.","hl":"m"},{"n":37,"text":"이 문장은 앞선 질문에 대한 답으로 spill the beans라는 표현이 비밀을 누설하다라는 뜻을 가지고 있음을 명확하게 설명해 주는 문장이에요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 to부정사의 명사적 용법이에요. 타동사 mean의 목적어 자리에서 비밀을 드러내는 것이라고 해석되는 to reveal 형태의 to부정사구가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에서\u003c/span>\u003cspan class=\"en\">Where \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">does\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 어구는\u003c/span>\u003cspan class=\"en\">this phrase\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유래한 것일까?\u003c/span>\u003cspan class=\"en\">come from?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 어구는 어디에서 유래한 것일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">비유적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>인 spill the beans가 어떻게 만들어졌는지에 대한 호기심을 유발하며, \u003cb class=\"key\">어원의 \u003c/b>\u003cb class=\"key\">유래\u003c/b>를 본격적으로 설명하기 시작하는 \u003cb class=\"key\">역할\u003c/b>을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 Do/Does/Did 조동사 사용\u003c/span> : Does [조동사] + 주어 + 동사원형 : \"~하는가?\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Where does, 어디에서. this phrase, 이 어구는. come from?, 유래한 것일까?. 이 문장 전체를 해석하면, 이 어구는 어디에서 유래한 것일까?","hl":"m"},{"n":40,"text":"이 문장은 spill the beans라는 어구의 유래를 묻고 있어요. 앞으로 이 표현이 어디서 시작되었는지 이야기의 흥미를 이끌어내고 있죠.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 조동사 does의 사용이에요. 주어가 3인칭 단수이고 현재시제라서 일반동사 앞에 does를 쓰고 뒤에는 동사원형을 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~에서 유래한 것이다\u003c/span>\u003cspan class=\"en\">It comes from\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 그리스의\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ancient\u003c/span> Greek\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투표 방법에서\u003c/span>\u003cspan class=\"en\">way of voting.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 고대 그리스의 투표 방법에서 유래한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>라는 표현이 \u003cb class=\"key\">고대 \u003c/b>\u003cb class=\"key\">그리스의 \u003c/b>\u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에서 비롯되었다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 직접적으로 전달해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : 형용사 + 명사 : \"고대의\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It comes from, 그것은 ~에서 유래한 것이다. an ancient Greek, 고대 그리스의. way of voting, 투표 방법에서. 이 문장 전체를 해석하면, 그것은 고대 그리스의 투표 방법에서 유래한 것이다.","hl":"m"},{"n":43,"text":"이 문장은 spill the beans가 고대 그리스의 독특한 투표 방법에서 시작되었다는 사실을 알려주고 있어요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 형용사의 수식이에요. ancient라는 형용사가 Greek을 꾸며주어 고대 그리스라는 의미를 정확하게 더해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리스인들이 투표할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> Greeks voted,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 넣었다\u003c/span>\u003cspan class=\"en\">they put\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흰색이나 검은색 콩을\u003c/span>\u003cspan class=\"en\">a white or black bean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 항아리에\u003c/span>\u003cspan class=\"en\">in a big jar.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리스인들이 투표할 때, 그들은 흰색이나 검은색 콩을 큰 항아리에 넣었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 그리스인들이 투표할 때 \u003cb class=\"key\">흰색이나 \u003c/b>\u003cb class=\"key\">검은색 \u003c/b>\u003cb class=\"key\">콩\u003c/b>을 사용해 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">항아리\u003c/b>에 넣었다는 구체적인 \u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 설명해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : When + 주어 + 동사, 주절 : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"When Greeks voted, 그리스인들이 투표할 때. they put, 그들은 넣었다. a white or black bean, 흰색이나 검은색 콩을. in a big jar, 큰 항아리에. 이 문장 전체를 해석하면, 그리스인들이 투표할 때, 그들은 흰색이나 검은색 콩을 큰 항아리에 넣었다.","hl":"m"},{"n":46,"text":"이 문장은 고대 그리스인들이 투표를 할 때 어떤 방식으로 참여했는지 그 과정을 구체적으로 보여주고 있어요.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 시간의 부사절 접속사 when이에요. 그리스인들이 투표를 하던 때를 나타내기 위해서 문장 앞에 when을 써서 배경을 설명하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투표가\u003c/span>\u003cspan class=\"en\">When the voting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완료되었을 때,\u003c/span>\u003cspan class=\"en\">was completed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 콩들은\u003c/span>\u003cspan class=\"en\">the beans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쏟아졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">spilled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과를 드러내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reveal \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">results\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 그리스 투표 방식에서 \u003cb class=\"key\">투표\u003c/b>가 끝난 후 콩을 쏟아 \u003cb class=\"key\">결과\u003c/b>를 밝히던 역사적 사실을 설명하는 문장입니다. \u003cb class=\"key\">수동태\u003c/b>와 to부정사의 부사적 용법이 함께 쓰여 문장의 뼈대를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 + be동사 + 과거분사 [[were spilled]] : \"쏟아졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 [[to reveal]] + 목적어 : \"결과를 드러내기 위해\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"When the voting, 투표가. was completed, 완료되었을 때. the beans, 그 콩들은. were spilled, 쏟아졌다. to reveal the results, 결과를 드러내기 위해. 이 문장 전체를 해석하면, 투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다.","hl":"m"},{"n":49,"text":"이 문장은 콩을 담은 항아리를 쏟아서 투표 결과를 확인하던 고대의 실제 방식을 설명하고 있어요. 왜 콩을 쏟았는지 그 이유와 역사적 유래가 잘 드러나는 중요한 문장이에요.","hl":"mn"},{"n":50,"text":"첫 번째 어법 포인트는 were spilled 인데요. 주어인 그 콩들이 직접 행동을 하는 게 아니라 쏟아지는 대상이므로 be동사 뒤에 과거분사를 쓰는 수동태를 사용했어요. 두 번째 어법 포인트는 to reveal 인데요. 동사원형 앞에 to를 붙여서 결과를 드러내기 위해서라는 목적의 의미를 더해주는 to부정사의 부사적 용법으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때부터,\u003c/span>\u003cspan class=\"en\">From then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 시작했다\u003c/span>\u003cspan class=\"en\">people began\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 어구를 사용하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> this phrase\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 의미로\u003c/span>\u003cspan class=\"en\">with a new meaning.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때부터, 사람들은 이 어구를 새로운 의미로 사용하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대의 투표 방식에서 유래한 \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>라는 표현이 오랜 시간이 지난 후 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">의미\u003c/b>인 비밀을 누설하다는 뜻으로 쓰이게 되었다는 결론을 보여주는 문장입니다. \u003cb class=\"key\">begin\u003c/b> 동사의 목적어로 to부정사가 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + [[to use]] (to부정사구/목적어) : \"사용하기를\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"From then, 그때부터. people began, 사람들은 시작했다. to use this phrase, 이 어구를 사용하기를. with a new meaning, 새로운 의미로. 이 문장 전체를 해석하면, 그때부터, 사람들은 이 어구를 새로운 의미로 사용하기 시작했다.","hl":"m"},{"n":52,"text":"이 문장은 고대 그리스의 투표 풍습에서 시작된 말 이 오늘날까지 어떻게 이어져서 비밀을 누설하다는 새로운 의미로 쓰이게 되었는지 그 변화의 과정을 깔끔하게 정리해 주고 있어요.","hl":"mn"},{"n":53,"text":"이 문장의 어법 포인트는 to use 인데요. 사람들은 시작했다 라는 말 뒤에 무엇을 시작했는지 그 내용을 채워주는 목적어 자리예요. 그래서 동사 begin 뒤에서 to부정사가 와서 이 어구를 사용하기를 이라는 명사적 용법으로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Tommy와 Lisa는 하나를 위한 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">파티\u003c/b>를 준비했다.\u003c/li>\u003cli>Tommy가 약속을 잘 지켜 파티는 대성공을 거두었다.\u003c/li>\u003cli>\u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>는 비밀을 드러낸다는 뜻을 가진 어구이다.\u003c/li>\u003cli>이 표현은 고대 그리스의 \u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방법\u003c/b>에서 유래했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The phrase spill the beans means to reveal a secret, and it originated from an ancient Greek voting method.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 비밀을 드러낸다는 뜻을 가진 \u003cb class=\"key\">spill \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beans\u003c/b>라는 어구가 고대 그리스의 \u003cb class=\"key\">투표 \u003c/b>\u003cb class=\"key\">방법\u003c/b>에서 유래 \u003cb class=\"key\">유래\u003c/b>했음을 설명하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 spill the beans라는 표현이 어떻게 만들어졌는지 그 유래와 글의 구조를 함께 공부했어요. 수능과 내신 독해의 기본은 이렇게 문맥의 흐름을 정확히 읽어내는 것이랍니다. 여러분 고생 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
