<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 동아(이) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 7과 본문1","audioDir":"1_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Origin of Break a Leg\u003c/h1>\u003ch2>다리 부러지세요의 유래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>비록 \u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">부러지세요\u003c/b>라는 표현은 나쁜 뜻처럼 들리지만, 공연자에게 \u003cb class=\"key\">행운\u003c/b>을 빌어주는 유래 깊은 말이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The phrase Break a leg actually means good luck, originating from a belief that wishing bad luck would make it go away.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 함께 공부할 지문은 우리가 일상에서 종종 접하는 흥미로운 영어 관용구의 유래에 관한 내용이에요. 첫 번째 문장부터 마지막 문장까지 꼼꼼히 살펴보며 내용과 구조를 완벽하게 정복해 봐요. 글 전체의 요지와 핵심 내용을 쉽고 명쾌하게 정리해 드릴게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 쓰는 영어 표현 중에는 겉보기와는 완전히 반대되는 뜻을 가진 \u003cb class=\"key\">관용구\u003c/b>들이 있어요. 예를 들어 공연을 앞둔 사람에게 건네는 \u003cb class=\"key\">Break \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">leg\u003c/b>라는 말은 문자 그대로 해석하면 다리가 부러지라는 저주처럼 들리지만, 실제로는 행운을 빌어주는 따뜻한 응원의 말이랍니다. 일상에서 시험을 앞둔 친구에게 오히려 긴장하지 말고 망하라고 장난스레 농담을 건네는 것과 비슷한 맥락이에요. 영어에서는 이를 \u003cb class=\"key\">idiom\u003c/b> 또는 \u003cb class=\"key\">expression\u003c/b>이라고 불러요. 문화적 배경에 따라 언어가 만들어진 독특한 \u003cb class=\"key\">origin\u003c/b>을 이해하면 외국어를 훨씬 재미있게 배울 수 있답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 넓혀볼까요. 우리가 사용하는 언어 속에는 겉보기와는 완전히 반대되는 뜻을 가진 관용구들이 있어요. 공연을 앞둔 사람에게 건네는 Break a leg라는 말은 직역하면 다리가 부러지라는 저주 같지만, 실제로는 행운을 빌어주는 따뜻한 응원의 말이랍니다. 영어에서는 이를 idiom 또는 expression이라고 불러요. 문화적 배경에 따라 언어가 만들어진 독특한 origin을 이해하면 외국어를 훨씬 재미있게 배울 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>연극 준비와 긴장\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>학교 \u003cb class=\"key\">연극\u003c/b> 당일 \u003cb class=\"key\">Lily\u003c/b>는 오랫동안 연습을 거듭했고 커튼이 올라가려는 순간 \u003cb class=\"key\">긴장감\u003c/b>을 느꼈어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>친구의 응원과 성공\u003csmall>전개 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>친구가 건네준 \u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">부러져\u003c/b>라는 독특한 인사 덕분에 \u003cb class=\"key\">Lily\u003c/b>는 무대에 올라 성공적으로 \u003cb class=\"key\">공연\u003c/b>을 마쳤어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>표현의 진짜 의미\u003csmall>반전 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>나쁜 말처럼 들리지만 사실 \u003cb class=\"key\">행운\u003c/b>을 뜻하며 과거 미국에 온 독일 배우들이 불운을 피하려는 \u003cb class=\"key\">믿음\u003c/b>에서 시작되었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>오늘날의 쓰임\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>이 \u003cb class=\"key\">표현\u003c/b>은 오늘날에도 여전히 \u003cb class=\"key\">공연자\u003c/b>들에게 행운을 빌기 위해 널리 쓰이고 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 학교 연극을 앞둔 상황에서 시작해 특별한 표현의 유래와 의미를 설명하는 구조로 전개돼요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 학교 연극 당일 오랜 기간 연습을 거듭한 Lily가 커튼이 올라가려는 순간 느끼는 긴장감을 보여줘요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 친구가 건네준 다리 부러져라는 독특한 인사 덕분에 무대에 올라 성공적으로 공연을 마치는 모습이 나와요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 나쁜 말처럼 들리지만 실제로는 행운을 뜻하며 과거 미국에 온 독일 배우들의 믿음에서 시작되었다는 반전이 등장해요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 이 표현이 오늘날에도 여전히 공연자들에게 행운을 빌기 위해 널리 쓰이고 있다는 결론을 맺어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에 다리 부러지라는 독특한 표현이 등장하는 \u003cb class=\"key\">일화\u003c/b>를 보여준 뒤, 글의 중반부에서 그것이 나쁜 뜻이 아니라 \u003cb class=\"key\">행운\u003c/b>을 의미한다는 \u003cb class=\"key\">반전\u003c/b>을 제시해요. 마지막 문장에서 이 표현이 오늘날에도 쓰인다는 점을 다시 한번 \u003cb class=\"key\">강요\u003c/b>하며 글을 깔끔하게 마무리하고 있답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Although (8)\u003c/b>\u003cspan>대조와 양보\u003c/span>\u003cb>actually (8)\u003c/b>\u003cspan>강조와 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Break a leg\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bad thing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Good luck\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bad luck\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This expression\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>겉보기 의미\u003c/th>\u003cth>실제 의미\u003c/th>\u003c/tr>\u003ctr>\u003ctd>나쁜 일이나 부상\u003c/td>\u003ctd>행운과 성공\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 독특한 일화를 보여준 뒤 핵심 표현의 진정한 의미를 반전으로 제시하는 양괄식 구조로 이루어져 있어요. 글의 전반부와 후반부가 유기적으로 연결되어 주제를 확실하게 전달하고 있죠.","hl":"ty"},{"n":9,"text":"여기서 Although라는 접속사가 나와서 겉보기의 부정적인 느낌과 실제의 긍정적인 의미를 서로 대조해 주고 있어요. 이어서 actually라는 부사를 통해 진짜 의미를 확실하게 강조해 주는 흐름을 짚어두면 독해할 때 아주 유리하답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부러뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>play\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연극\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연습하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>curtain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>커튼, 막\ 3c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">successfully\u003c/b>\u003cspan class=\"m\">성공적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">victoriously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsuccessfully\u003c/span>\u003cspan class=\"a\">poorly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">actually\u003c/b>\u003cspan class=\"m\">실제로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">really\u003c/span>\u003cspan class=\"s\">in fact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mean\u003c/b>\u003cspan class=\"m\">의미하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">signify\u003c/span>\u003cspan class=\"s\">stand for\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. nervous의 동의어로는 anxious가 있고 반의어로는 calm이나 relaxed가 있어요. successfully의 반의어로는 unsuccessfully가 있고 actually는 really나 in fact로 바꿔 쓸 수 있으니 함께 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다리 부러지세요\u003c/span>\u003cspan class=\"en\">Break a Leg\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날\u003c/span>\u003cspan class=\"en\">the day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan  class=\"lp-ko\">그녀는 무대에 올랐고 성공적으로 공연했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공 Lily가 무대에 올라 성공적으로 연기를 마쳤음을 보여주는 문장이에요. \u003cb class=\"key\">이어지는 \u003c/b>\u003cb class=\"key\">동사구\u003c/b>를 통해 무대에 오른 동작과 공연한 동작이 자연스럽게 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>로 연결되고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : 주어 + 과거동사 ~ : \"올랐다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 수식\u003c/span> : 동사 + 부사 : \"성공적으로 공연했다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"She got on, 그는 올랐고. the stage, 무대에. and performed, 공연했다. successfully, 성공적으로. 이 문장 전체를 해석하면, 그녀는 무대에 올랐고 성공적으로 공연했다.","hl":"m"},{"n":30,"text":"릴리가 드디어 무대에 올라서 연기를 아주 잘 끝마쳤다는 것을 나타내는 문장이에요. 주어인 She 뒤에 과거 동사들이 자연스럽게 이어지고 있죠.","hl":"mn"},{"n":31,"text":"첫 번째 어법 포인트는 과거에 발생한 일이니까 get의 과거형인 got을 썼다는 점이에요. 두 번째 포인트는 동사 performed를 꾸며주는 부사 successfully의 쓰임이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 “다리 부러지세요!”가 들릴 수 있지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although\u003c/span> &quot;Break a leg!&quot; \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나쁜 것처럼\u003c/span>\u003cspan class=\"en\">like a bad thing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 사실 의미한다\u003c/span>\u003cspan class=\"en\">it actually means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“행운을 빌어요!”를\u003c/span>\u003cspan class=\"en\">&quot;Good luck!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 “다리 부러지세요!”가 나쁜 것처럼 들릴 수 있지만, 그것은 사실 “행운을 빌어요!”를 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Break a leg라는 표현의 겉보기 뜻과 실제 의미 사이의 반전 \u003cb class=\"key\">양보의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 전달하는 핵심 문장이에요. \u003cb class=\"key\">Although\u003c/b> 접속사를 통해 의미의 대비를 명확하게 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Although + 주어 + 동사 ~, 주어 + 동사 ... : \"비록 ~이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 의미\u003c/span> : 조동사 may + 동사원형 : \"~처럼 들릴 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Although \"Break a leg!\" may sound, 비록 “다리 부러지세요!”가 들릴 수 있지만. like a bad thing, 나쁜 것처럼. it actually means, 그것은 사실 의미한다. \"Good luck!\", “행운을 빌어요!”를. 이 문장 전체를 해석하면, 비록 “다리 부러지세요!”가 나쁜 것처럼 들릴 수 있지만, 그것은 사실 “행운을 빌어요!”를 의미한다.","hl":"m"},{"n":33,"text":"이 문장은 표현의 겉모습과 진짜 뜻이 다르다는 반전을 아주 잘 보여주고 있어요. 비록 나쁜 말처럼 들려도 실제로는 좋은 뜻이라는 거죠.","hl":"mn"},{"n":34,"text":"첫 번째 어법 포인트는 비록 ~이지만이라는 뜻을 가진 양보의 접속사 Although예요. 두 번째 포인트는 추측을 나타내는 조동사 may 뒤에 동사원형 sound가 온 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일 배우들이\u003c/span>\u003cspan class=\"en\">German actors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">United \u003c/span>\u003cspan class=\"tgt\">States\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">20세기 초에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">early \u003c/span>\u003cspan class=\"tgt\">20th \u003c/span>\u003cspan class=\"tgt\">century\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 어구를 처음 사용했다.\u003c/span>\u003cspan class=\"en\">first used this phrase.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Break a leg라는 독특한 표현의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">기원\u003c/b>을 설명하는 문장이에요. 주어인 독일 배우들을 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b> 절이 뒤에서 수식하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : 선행사(사람) + who + 동사 ~ : \"미국에 온\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 전치사구\u003c/span> : in + the early + 서수 + century : \"20세기 초에\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"German actors, 독일 배우들이. who came to the United States, 미국에 온. in the early 20th century, 20세기 초에. first used this phrase, 이 어구를 처음 사용했다.. 이 문장 전체를 해석하면, 20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다.","hl":"m"},{"n":36,"text":"이 문장은 브레이크 어 레그라는 표현이 어디서 처음 시작되었는지 그 유래를 알려주고 있어요. 미국으로 건너온 독일 배우들이 그 시작이었다고 하죠.","hl":"mn"},{"n":37,"text":"첫 번째 어법 포인트는 사람 선행사 뒤에서 주어 역할을 하며 배우들을 꾸며주는 주격 관계대명사 who예요. 두 번째 포인트는 세기나 긴 시간 앞에 쓰이는 전치사 in의 쓰임이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로에게 ~을 빎으로써,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">wishing\u003c/span> each other\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불운을\u003c/span>\u003cspan class=\"en\">bad luck,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 믿었다\u003c/span>\u003cspan class=\"en\">they believed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 없어질 거라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">서로에게 불운을 빎으로써, 그들은 그것이 없어질 거라고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독일 배우들이 \u003cb class=\"key\">불운\u003c/b>을 빌면 오히려 행운이 온다고 믿었던 \u003cb class=\"key\">역설적\u003c/b>인 유래를 설명하는 문장입니다. \u003cb class=\"key\">that절\u003c/b>이 believed의 목적어로 쓰여 주절의 내용을 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사+동명사\u003c/span> : By [전치사] + wishing [동명사] : \"~함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believed [타동사] + that절 [명사절/목적어] : \"~할 거라고\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"By wishing each other, 서로에게 ~을 빎으로써. bad luck, 불운을. they believed, 그들은 믿었다. that it would go away, 그것이 없어질 거라고. 이 문장 전체를 해석하면, 서로에게 불운을 빎으로써, 그들은 그것이 없어질 거라고 믿었다.","hl":"m"},{"n":39,"text":"열 번째 문장이에요. 독일 배우들이 왜 그런 말을 썼는지 그 독특한 믿음을 보여주는 문장이지요. 불운을 빌어주면 오히려 나쁜 운이 멀리 사라진다고 생각했던 옛사람들의 마음을 담고 있어요.","hl":"mn"},{"n":40,"text":"첫 번째 어법 포인트는 By wishing이에요. 전치사 by 뒤에 동명사 wishing이 와서 수단을 나타내고 있죠. 두 번째 어법 포인트는 that it would go away예요. believed 뒤에서 목적어 역할을 하는 명사절 접속사 that이 사용되었답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 표현은\u003c/span>\u003cspan class=\"en\">This expression\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날에도\u003c/span>\u003cspan class=\"en\">today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 표현은 오늘날에도 여전히 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에 시작된 \u003cb class=\"key\">Break \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">leg\u003c/b>라는 표현이 현대에도 여전히 널리 쓰이고 있음을 강조하는 문장입니다. \u003cb class=\"key\">수동태\u003c/b>를 사용하여 표현이 사람들에 의해 사용된다는 점을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제 수동태\u003c/span> : 주어 + be동사(is) + 부사(still) + 과거분사(used) : \"여전히 사용된다\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"This expression, 이 표현은. is still, 여전히. used, 사용된다. today, 오늘날에도. 이 문장 전체를 해석하면, 이 표현은 오늘날에도 여전히 사용된다.","hl":"m"},{"n":42,"text":"열한 번째 문장입니다. 과거 독일 배우들의 말에서 시작된 이 독특한 표현이 지금까지도 이어져 내려오고 있음을 알려주는 내용이에요.","hl":"mn"},{"n":43,"text":"어법 포인트를 짚어볼게요. 표현 입장에서 사용되는 것이므로 be동사 is와 과거분사 used가 합쳐진 수동태가 쓰였어요. 그 사이에 여전히라는 뜻의 부사 still이 쏙 들어가 있는 모습을 확인할 수 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘다리 부러지세요’는\u003c/span>\u003cspan class=\"en\">&quot;Break a leg&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어구이다\u003c/span>\u003cspan class=\"en\">is a phrase\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 말하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공연자들에게 행운을 빌기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span> performers good luck\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공연 전에\u003c/span>\u003cspan class=\"en\">before a show.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘다리 부러지세요’는 사람들이 공연 전에 공연자들에게 행운을 빌기 위해 말하는 어구이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 주제인 Break a leg의 정확한 \u003cb class=\"key\">정의\u003c/b>와 쓰임새를 정리하는 결론 문장입니다. \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사절\u003c/b>이 선행사 a phrase를 꾸며주고, to부정사의 \u003cb class=\"key\">부사적 \u003c/b>\u003cb class=\"key\">용법(목적)\u003c/b>이 행운을 비는 이유를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 또는 목적격 관계대명사절\u003c/span> : 선행사(a phrase) + 관대한(that) + 주어(people) + 타동사(say) : \"사람들이 말하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형(wish) : \"행운을 빌기 위해\"\u003c/div>\u003c/div>","segs":[{"n":44,"text":"\"Break a leg\", ‘다리 부러지세요’는. is a phrase, 어구이다. that people say, 사람들이 말하는. to wish performers good luck, 공연자들에게 행운을 빌기 위해. before a show, 공연 전에. 이 문장 전체를 해석하면, ‘다리 부러지세요’는 사람들이 공연 전에 공연자들에게 행운을 빌기 위해 말하는 어구이다.","hl":"m"},{"n":45,"text":"열두 번째, 마지막 문장이에요. 이 글 전체의 핵심을 요약하면서 Break a leg가 공연 전에 행운을 빌어주는 인사라는 점을 깔끔하게 정리해 주고 있답니다.","hl":"mn"},{"n":46,"text":"첫 번째 어법 포인트는 that people say예요. 선행사 a phrase를 수식하는 관계대명사절이죠. 두 번째 어법 포인트는 to wish인데요, 행운을 빈다는 목적을 나타내는 to부정사의 부사적 용법으로 사용되었어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Lily는 연극 무대를 앞두고 \u003cb class=\"key\">긴장\u003c/b>했어요.\u003c/li>\u003cli>친구는 Lily에게 \u003cb class=\"key\">Break \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">leg\u003c/b>이라는 인사를 건넸어요.\u003c/li>\u003cli>이 표현은 나쁜 뜻처럼 들리지만 \u003cb class=\"key\">행운\u003c/b>을 의미해요.\u003c/li>\u003cli>과거 독일 배우들의 \u003cb class=\"key\">믿음\u003c/b>에서 유래하여 오늘날까지 쓰여요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The phrase Break a leg actually means good luck, originating from a belief that wishing bad luck would make it go away.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">비록 \u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">부러지세요\u003c/b>라는 표현은 나쁜 뜻처럼 들리지만, 공연자에게 \u003cb class=\"key\">행운\u003c/b>을 빌어주는 유래 깊은 말이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":47,"text":"오늘 이렇게 Break a leg라는 표현의 유래와 글의 전개 방식을 함께 알아보았어요. 복습을 철저히 하고 다음 강의에서 더 알찬 내용으로 만나요. 여러분 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
