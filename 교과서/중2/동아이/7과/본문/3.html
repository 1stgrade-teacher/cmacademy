</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 동아(이) 7과 본문3","audioDir":"3_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>동아(이)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Take a Rain Check: Meaning and Origin\u003c/h1>\u003ch2>우천 교환권을 받는다: 그 의미와 유래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Emily가 가장 친한 친구 Sarah의 영화 제안을 \u003cb class=\"key\">우천 \u003c/b>\u003cb class=\"key\">교환권을 \u003c/b>\u003cb class=\"key\">받는다\u003c/b>는 표현으로 정중하게 거절하고, 이 표현은 \u003cb class=\"key\">제안을 \u003c/b>\u003cb class=\"key\">정중하게 \u003c/b>\u003cb class=\"key\">거절하지만 \u003c/b>\u003cb class=\"key\">나중에 \u003c/b>\u003cb class=\"key\">하고 \u003c/b>\u003cb class=\"key\">싶어 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 뜻이며 1880년대 \u003cb class=\"key\">야구 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 유래했다는 것을 설명하는 글이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>&quot;Take a rain check&quot; means to refuse an offer politely but wish to do it later, and the phrase originated from baseball games in the 1880s.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 중학교 2학년 동아 이 7과 본문 세 번째 지문을 함께 읽어 볼 거예요. 이 글은 take a rain check라는 표현이 무슨 뜻이고 어디서 생겨났는지 알려 주는 글이에요. Emily가 친구의 영화 제안을 정중하게 거절하면서 이 표현을 쓰고, 글은 그 의미와 유래를 차근차근 설명해 줍니다. 핵심은 이 표현이 제안을 정중하게 거절하지만 나중에 하고 싶다는 뜻이라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미국에서는 야구 같은 스포츠 경기가 \u003cb class=\"key\">비\u003c/b> 때문에 취소되면, 관람객에게 나중에 열리는 경기를 볼 수 있는 표를 나눠 줍니다. 바로 이 표를 rain check라고 불러요. 원래는 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">경기\u003c/b>를 위한 진짜 표였던 거죠. 우리가 쓰는 쿠폰이나 교환권과 비슷한 개념이라고 생각하면 이해하기 쉬워요. 이렇게 실제 표로 쓰이던 말이 사람들 사이에서 '지금은 안 되지만 나중에 하자'는 뜻으로 옮겨 간 것입니다. Baseball은 미국에서 가장 인기 있는 스포츠였기 때문에 이런 표현이 자연스럽게 퍼질 수 있었어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 미국에서는 야구 같은 스포츠 경기가 비 때문에 취소되면, 관람객에게 나중에 열리는 경기를 볼 수 있는 표를 나눠 줍니다. 바로 이 표를 rain check라고 불러요. 원래는 미래의 경기를 위한 진짜 표였던 거죠. 우리가 쓰는 쿠폰이나 교환권 같은 개념이라고 생각하면 이해하기 쉬워요. 이런 실제 표가 사람들 사이에서 지금은 안 되지만 나중에 하자는 뜻으로 옮겨 간 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>영화 제안과 거절\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>Sarah는 가장 친한 친구 Emily와 영화를 보고 싶어서 오늘 같이 보자고 \u003cb class=\"key\">제안\u003c/b>했어요. 그런데 Emily는 미안하다며 오늘은 할머니 댁에 가야 해서 \u003cb class=\"key\">우천 \u003c/b>\u003cb class=\"key\">교환권을 \u003c/b>\u003cb class=\"key\">받아야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 답했죠. 여기서 take a rain check가 곧 \u003cb class=\"key\">정중한 \u003c/b>\u003cb class=\"key\">거절\u003c/b>의 표현으로 등장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이해와 수용\u003csmall>반응 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>Sarah는 괜찮다며 다음에 보자고 말하고, 조금 \u003cb class=\"key\">실망\u003c/b>했지만 Emily의 \u003cb class=\"key\">상황\u003c/b>을 이해했어요. 이 부분이 이 표현이 실제 대화에서 어떻게 쓰이는지 자연스럽게 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의미 묻고 답하기\u003csmall>질문-답변 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>글은 곧바로 take a rain check가 무엇을 의미하는지 \u003cb class=\"key\">질문\u003c/b>을 던져요. 그리고 그것은 제안을 \u003cb class=\"key\">정중하게 \u003c/b>\u003cb class=\"key\">거절\u003c/b>하지만 나중에 하고 싶어 한다는 뜻이라고 \u003cb class=\"key\">정의\u003c/b>해 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>야구에서 시작된 유래\u003csmall>근거 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>이 표현은 1880년대 \u003cb class=\"key\">야구 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 처음 쓰였어요. 비 때문에 경기가 \u003cb class=\"key\">취소\u003c/b>되면 사람들이 다음 경기를 위해 받은 표가 바로 rain check였고, 이후 다른 스포츠 행사로 퍼졌죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>오늘날의 쓰임\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>시간이 흐르면서 take a rain check는 지금은 어떤 일을 할 수 없고 나중에 하고 싶다고 말할 때 \u003cb class=\"key\">널리\u003c/b> 쓰이는 표현이 되었어요. 이 문장이 글 전체를 정리하는 마지막 결론입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 영화 제안과 거절이에요. Sarah는 가장 친한 친구 Emily와 영화를 보고 싶어서 오늘 같이 보자고 제안합니다. 그런데 Emily는 미안하다며 오늘은 할머니 댁에 가야 해서 우천 교환권을 받아야 한다고 답해요. 여기서 take a rain check가 정중한 거절의 표현으로 등장합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Sarah의 반응이에요. Sarah는 괜찮다며 다음에 보자고 말하고, 조금 실망했지만 Emily의 상황을 이해합니다. 이 장면이 이 표현이 실제 대화에서 어떻게 쓰이는지 자연스럽게 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 의미를 묻고 답하는 부분이에요. 글은 take a rain check가 무엇을 의미하는지 질문을 던집니다. 그리고 그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 뜻이라고 정의해 줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 유래예요. 이 표현은 1880년대 야구 경기에서 처음 쓰였습니다. 비 때문에 경기가 취소되면 사람들이 다음 경기를 위해 받은 표가 바로 rain check였고, 이후에 다른 스포츠 행사로 퍼져 나갔어요.","hl":"f3"},{"n":8,"text":"마지막 단계는 오늘날의 쓰임이에요. 시간이 흐르면서 take a rain check는 지금은 어떤 일을 할 수 없고 나중에 하고 싶다고 말할 때 널리 쓰이는 표현이 되었습니다. 이 문장이 글 전체를 정리하는 결론 역할을 해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 앞부분에서 Sarah와 Emily의 \u003cb class=\"key\">대화 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 먼저 보여 주고, 중간에서 take a rain check가 무엇을 의미하는지 \u003cb class=\"key\">질문\u003c/b>을 던진 뒤 바로 답을 줍니다. 핵심이 되는 주제문이 글의 앞이 아니라 중간에 나오기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요. 또한 예시로 시작해 \u003cb class=\"key\">정의\u003c/b>로 핵심을 밝히고, 유래와 결론으로 확장하는 질문-답변 전개 방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>앞 상황의 결과 연결\u003c/span>\u003cb>but (3)\u003c/b>\u003cspan>제안과 거절의 대조\u003c/span>\u003cb>Although (7)\u003c/b>\u003cspan>양보\u003c/span>\u003cb>What does &quot;take a rain check&quot; mean? (8)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>It means (9)\u003c/b>\u003cspan>정의 제시\u003c/span>\u003cb>Later (12)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>Over time (13)\u003c/b>\u003cspan>확장·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">take a rain check\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">refuse an offer politely but wish to do it later\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">you can't do something now and want to do it later\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문과 답변으로 핵심을 풀어 가는 구조예요. 앞부분에서 대화 예시를 보여 주고, 중간에서 의미를 묻는 질문을 던진 뒤 바로 답을 줍니다. 그래서 주제문이 글의 중간에 나오는 미괄식 구조라고 볼 수 있어요. 예시로 시작해서 정의로 핵심을 밝히고, 유래와 결론으로 마무리하는 흐름입니다.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨야 해요. 두 번째 문장의 So는 앞의 상황이 다음 행동으로 이어진다는 걸 보여 주고, 세 번째 문장의 but은 제안과 거절이 대조된다는 신호예요. 여덟 번째 문장의 질문 표현은 글의 방향을 의미 설명으로 돌리는 역할을 하고, It means가 바로 정의를 시작하죠. Later와 Over time은 시간이 흐르며 표현이 확장된다는 걸 알려 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>take a rain check\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우천 교환권을 받다, 다음에 하기로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>see a movie\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>영화를 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>best friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장 친한 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>have to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandmother\u003c/b>\u003cem>명사\u003c/em>\u003cspan>할머니\u003c/span>\u003c/div>\u003cdiv>\u0 em>부사\u003c/em>\u003cspan>널리\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. refuse는 거절하다, politely는 정중하게라는 뜻이라서 이 표현의 정의를 이해할 때 꼭 필요해요. cancel은 취소하다, widely는 널리, phrase는 어구라는 뜻이에요. 이런 단어들이 문장에서 어떻게 쓰이는지 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">refuse\u003c/b>\u003cspan class=\"m\">거절하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">reject\u003c/span>\u003cspan class=\"s\">turn down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappointed\u003c/b>\u003cspan class=\"m\">실망한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">saddened\u003c/span>\u003cspan class=\"s\">discouraged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cancel\u003c/b>\u003cspan class=\"m\">취소하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">call off\u003c/span>\u003cspan class=\"s\">abolish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">schedule\u003c/span>\u003cspan class=\"a\">confirm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">politely\u003c/b>\u003cspan class=\"m\">정중하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">courteously\u003c/span>\u003cspan class=\"s\">kind u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우천 교환권을 받는다 Sarah는 그녀의 가장 친한 친구 Emily와 영화를 보러 가고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제목과 함께 Sarah가 가장 친한 친구 Emily와 영화를 보고 싶어 했던 상황을 열어 주는 문장이에요. \u003cb class=\"key\">want \u003c/b>\u003cb class=\"key\">to\u003c/b> 뒤에 동사원형을 써서 '~하고 싶다'는 \u003cb class=\"key\">바람\u003c/b>을 나타내고, 콤마 뒤에 이름을 붙이는 \u003cb class=\"key\">동격\u003c/b> 표현으로 친구가 Emily임을 분명히 밝혀 줘요. 뒤에 나올 take a rain check 이야기의 배경을 만들어 주는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">want + to부정사(목적어)\u003c/span> : want + [to see (to부정사구/목적어)] : \"보고 싶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(콤마로 이름 덧붙이기)\u003c/span> : [명사구] + , + [같은 대상을 가리키는 명사] : \"그녀의 가장 친한 친구 Emily와\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Take a Rain Check, 우천 교환권을 받는다. Sarah wanted to see a movie, Sarah는 영화를 보러 가고 싶었다. with her best friend, Emily, 그녀의 가장 친한 친구 Emily와.. 이 문장 전체를 해석하면, 우천 교환권을 받는다 Sarah는 그녀의 가장 친한 친구 Emily와 영화를 보러 가고 싶었다.","hl":"m"},{"n":14,"text":"이 문장은 제목과 함께 Sarah가 가장 친한 친구 Emily와 영화를 보고 싶어 했던 상황을 열어 주는 문장이에요. want to 뒤에 동사원형을 쓰면 하고 싶다는 바람이 되고, 콤마 뒤에 이름을 붙이는 동격 표현으로 친구가 Emily라는 걸 분명히 알려 주죠. 이렇게 해서 뒤에 나올 take a rain check 이야기의 배경을 만들어 주는 거예요.","hl":"mn"},{"n":15,"text":"첫 번째로 wanted to see를 보세요. want는 뒤에 to부정사를 목적어로 데려와서 바람을 나타내는 동사예요. 그래서 wanted to see는 그냥 봤다가 아니라 보고 싶었다로 해석한답니다. 두 번째로 with her best friend, Emily를 보세요. 콤마 뒤의 Emily는 앞에 있는 her best friend와 동격 관계로, 같은 사람을 가리키면서 누구인지 콕 집어 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 Emily에게 물었다,\u003c/span>\u003cspan "So, 그래서. she asked Emily, 그녀는 Emily에게 물었다. \"Do you want to see a movie, “영화 볼래. with me today?\", 오늘 나랑?”. 이 문장 전체를 해석하면, 그래서 그녀는 Emily에게 물었다, “오늘 나랑 영화 볼래?”","hl":"m"},{"n":17,"text":"이 문장은 Sarah가 Emily에게 오늘 영화를 같이 보자고 직접 물어보는 장면이에요. 큰따옴표 안의 Do you want to는 너는 하고 싶니라고 상대의 의향을 묻는 직접의문문이죠. 여기에 with me와 today가 붙어서 누구와 언제 영화를 볼 건지까지 알려 주고, 이 질문에 대한 Emily의 대답이 바로 뒤 문장의 take a rain check로 이어져요.","hl":"mn"},{"n":18,"text":"첫 번째로 she asked Emily를 보세요. ask는 에게 묻다라는 뜻이라서 뒤에 사람이 오고, 그 뒤에 직접의문문이 이어지는 구조예요. 두 번째로 Do you want to see를 보세요. 일반동사 의문문은 Do를 문장 맨 앞에 세워서 만들고, want 뒤에는 to부정사를 써서 보고 싶다는 의향을 물어요. 세 번째로 with me today를 보세요. with는 와 함께라는 전치사이고, today는 시간을 나타내는 부사로 문장 끝에 놓여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily는 대답했다,\u003c/span>\u003cspan class=\"en\">Emily replied,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“미안하지만,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">sorry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">난 우천 교환권을 받아야만 해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> a rain check.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Emily가 오늘은 함께 영화를 볼 수 없다고 정중하게 거절하는 문장이에요. 먼저 미안하다고 말한 뒤 \u003cb class=\"key\">but\u003c/b>으로 이유를 이어 가는데, \u003cb class=\"key\">take \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">rain \u003c/b>\u003cb class=\"key\">check\u003c/b>는 '오늘은 안 되지만 다음에 하자'는 뜻의 관용 표현이에요. 이 표현의 진짜 \u003cb class=\"key\">의미\u003c/b>가 바로 다음 문장부터 설명되기 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">I am의 축약형\u003c/span> : I + am → I'm : \"미안하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but\u003c/span> : [문장] + but + [문장] : \"그런데, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">have to + 동사원형(의무)\u003c/span> : have to + [take (동사원형)] : \"받아야만 해\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Emily replied, Emily는 대답했다. \"I'm sorry, “미안하지만. but I have to take a rain check, 난 우천 교환권을 받아야만 해.. 이 문장 전체를 해석하면, Emily는 대답했다, “미안하지만, 난 우천 교환권을 받아야만 해.","hl":"m"},{"n":20,"text":"이 문장은 Emily가 오늘은 함께 영화를 볼 수 없다고 정중하게 거절하는 문장이에요. 미안하다고 먼저 말한 다음 but으로 이유를 이어 가는데, take a rain check는 오늘은 안 되지만 다음에 하자는 뜻의 관용 표현이죠. 이 표현의 진짜 의미가 바로 다음 문장부터 설명되기 시작한답니다.","hl":"mn"},{"n":21,"text":"첫 번째로 I'm sorry를 보세요. I am이 줄어든 축약형이고, 거절할 때 정중하게 먼저 꺼내는 표현이에요. 두 번째로 have to take를 보세요. have to는 해야 한다는 의무를 나타내고, 뒤에는 반드시 동사원형이 와요. 세 번째로 but을 보세요. but은 미안하다는 말과 그 이유를 이어 주는 등위접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 가야 해\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">go\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할머니 댁에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">grandmother's \u003c/span>\u003cspan class=\"tgt\">house\u003c/span> 가 다음에 다시 영화를 보자고 \u003cb class=\"key\">제안\u003c/b>하는 문장이에요. 앞에서 Emily가 \u003cb class=\"key\">take \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">rain \u003c/b>\u003cb class=\"key\">check\u003c/b>를 썼는데, 그 뜻이 바로 '나중에 하자'였기 때문에 두 사람의 대화가 아주 자연스럽게 마무리되죠. \u003cb class=\"key\">Let's\u003c/b>는 함께 하자고 권하는 청유 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's (Let us의 축약)\u003c/span> : Let's + [동사원형(do)] : \"우리 ~하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : [said + 주어(Sarah)] : \"Sarah가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Let's do it, 우리 그걸 하자. another time,\", 다음에. said Sarah, Sarah가 말했다. 이 문장 전체를 해석하면, 다음에 보자.”라고 Sarah가 말했다.","hl":"m"},{"n":29,"text":"Sarah가 다음에 다시 영화를 보자고 제안하는 문장이에요. 앞에서 Emily가 take a rain check를 썼는데, 그 뜻이 바로 나중에 하자였기 때문에 두 사람의 대화가 아주 자연스럽게 마무리되죠. Let's는 함께 하자고 권하는 청유 표현이에요.","hl":"mn"},{"n":30,"text":"첫 번째로 Let's do를 볼게요. Let's는 Let us를 줄인 말로, 우리 같이 하자고 제안하거나 청유할 때 쓰는 표현이에요. 그래서 뒤에는 동사원형이 와요. 두 번째로 said Sarah를 볼게요. 따옴표로 묶인 인용문 뒤에서는 말했다라는 동사가 주어보다 먼저 나오는 도치가 일어나요. 그래서 Sarah가 말했다로 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 Sarah는 조금 실망했지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">Sarah \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">disappointed,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 이해했다\u003c/span>\u003cspan class=\"en\">she understood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily의 상황을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Emily's \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 Sarah는 조금 실망했지만, 그녀는 Emily의 상황을 이해했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Sarah가 친구의 거절에도 \u003cb class=\"key\">실망\u003c/b>을 크게 티 내지 않고 Emily의 \u003cb class=\"key\">상황\u003c/b>을 헤아렸다는 뜻이에요. \u003cb class=\"key\">양보\u003c/b>의 접속사 Although가 '실망했지만'과 '이해했다'를 대비시켜 두 사람의 관계가 좋다는 것을 보여 주죠. 바로 다음 문장에서 take a rain check의 뜻을 묻는 흐름으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 although\u003c/span> : Although + [주어 + 동사] , [주어 + 동사] : \"비록 Sarah는 조금 실망했지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태형 형용사 (과거분사)\u003c/span> : [be동사 was] + [a little] + [disappointed (과거분사 형용사)] : \"조금 실망했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격\u003c/span> : [Emily's] + [situation] : \"Emily의 상황\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Although Sarah was a little disappointed, 비록 Sarah는 조금 실망했지만. she understood, 그녀는 이해했다. Emily's situation, Emily의 상황을. 이 문장 전체를 해석하면, 비록 Sarah는 조금 실망했지만, 그녀는 Emily의 상황을 이해했다.","hl":"m"},{"n":32,"text":"이 문장은 Sarah가 조금 실망은 했지만 Emily의 상황을 이해했다는 거예요. 양보의 접속사 although가 실망했지만과 이해했다를 대비시켜 주죠. 그래서 두 친구 사이가 좋다는 걸 자연스럽게 보여 줍니다.","hl":"mn"},{"n":33,"text":"첫 번째로 although는 비록 ~일지라도라는 양보의 접속사예요. 그래서 비록 Sarah는 조금 실망했지만이라는 뜻이 되죠. 두 번째로 disappointed는 disappoint라는 타동사의 과거분사가 형용사로 굳어진 표현이에요. 사람이 실망한 상태는 disappointed로 쓴다는 것, 꼭 기억해 두세요. 세 번째로 Emily's situation은 소유격 Emily's가 뒤의 명사 situation을 꾸미는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 ~하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">does\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'take a rain check'가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">&quot;take \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">rain \u003c/span>\u003cspan class=\"tgt\">check&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미하는 것은?\u003c/span>\u003cspan class=\"en\">mean?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘우천 교환권을 받는다’가 무엇을 의미할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본문에 나온 표현의 \u003cb class=\"key\">뜻\u003c/b>을 독자에게 직접 물어보는 문장이에요. 이 질문 바로 다음 문장에서 \u003cb class=\"key\">정의\u003c/b>가 이어지죠. 인용 부호 안의 take a rain check가 이 질문의 \u003cb class=\"key\">주제\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문 도치 (의문사 + 조동사)\u003c/span> : What + [does] + [주어] + [동사원형]? : \"무엇을 ~하나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용 표현 (따옴표로 묶인 어구)\u003c/span> : [따옴표] + [어구] + [따옴표] : \"'take a rain check'가\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"What does, 무엇을 ~하나요. \"take a rain check\", 'take a rain check'가. mean?, 의미하는 것은?. 이 문장 전체를 해석하면, ‘우천 교환권을 받는다’가 무엇을 의미할까?","hl":"m"},{"n":35,"text":"이 문장은 본문에 나온 표현 take a rain check의 뜻을 독자에게 직접 물어보는 질문이에요. 이 질문 바로 다음에 정의가 나오니까 글의 흐름을 이어 주는 역할을 하죠. 인용 부호 안에 들어 있는 take a rain check가 이 질문의 주제라고 보면 됩니다.","hl":"mn"},{"n":36,"text":"첫 번째로 의문사 What이 문장 맨 앞에 나오면서 도치가 일어나요. 그래서 조동사 does가 주어 앞에 오고, 본동사는 동사원형 mean을 쓴다는 것, 꼭 기억해 두세요. 두 번째로 take a rain check는 따옴표로 묶여서 질문의 주어처럼 하나의 덩어리로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제안을 정중하게 거절하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">refuse \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">offer \u003c/span>\u003cspan class=\"tgt\">politely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 바라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 나중에 하기를\u003c/span>\u003cspan class=\"en\">to do it later.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> take a rain check의 \u003cb class=\"key\">뜻\u003c/b>을 풀어서 알려 주는 정의 문장이에요. 제안을 \u003cb class=\"key\">정중하게\u003c/b> 거절하되 나중에 하고 싶다는 마음을 담았다는 거죠. 앞의 질문에 대한 답이면서 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 정리해 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : mean [타동사] + [to부정사구 (목적어)] : \"거절하는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사구의 병렬 (but)\u003c/span> : [to부정사구] + but + [(to)동사원형] : \"제안을 정중하게 거절하지만 ... 바라는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 + 목적어 + 부사\u003c/span> : refuse + [목적어 an offer] + [부사 politely] : \"제안을 정중하게 거절하다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It means, 그것은 의미한다. to refuse an offer politely, 제안을 정중하게 거절하는 것을. but wish, 그러나 바라는 것을. to do it later, 그것을 나중에 하기를. 이 문장 전체를 해석하면, 그것은 제안을 정중하게 거절하지만 나중에 하고 싶어 한다는 것을 의미한다.","hl":"m"},{"n":38,"text":"이 문장은 take a rain check의 뜻을 풀어서 알려 주는 정의 문장이에요. 제안을 정중하게 거절하지만 나중에 하고 싶다는 마음을 담았다는 거죠. 그래서 앞의 질문에 대한 답이 되는 아주 중요한 문장입니다.","hl":"mn"},{"n":39,"text":"첫 번째로 mean은 여기서 타동사로 쓰여서, 뒤에 오는 to부정사구가 목적어가 돼요. 그래서 ~하는 것을 의미하다라고 해석하죠. 두 번째로 to refuse와 wish가 but으로 연결된 병렬 구조예요. 뒤에 오는 to는 반복을 피하려고 생략된 거니까, 거절하지만 바라다로 이어진다고 보면 됩니다. 세 번째로 politely는 부사로서 동사 refuse를 꾸며 정중하게라는 방법을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어구 ‘우천 교환권’은\u003c/span>\u003cspan class=\"en\">The phrase &quot;rain check&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음 사용되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야구 경기에서\u003c/span>\u003cspan class=\"en\">at a baseball game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1880년대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1880s\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어구 ‘우천 교환권’은 1880년대에 야구 경기에서 처음 사용되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 ‘take a rain check’라는 표현의 \u003cb class=\"key\">유래\u003c/b>를 소개하는 도입부예요. ‘rain check’가 \u003cb class=\"key\">1880년대\u003c/b> \u003cb class=\"key\">야구 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 처음 쓰였다는 사실을 먼저 알려 주죠. 뒤 문장에서 그때의 rain check가 무엇이었는지 구체적으로 설명하니, 여기서는 \u003cb class=\"key\">시간\u003c/b>과 \u003cb class=\"key\">장소\u003c/b>를 기억해 두면 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + [was] + [first] + [used (과거분사)] : \"처음 사용되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시점을 나타내는 전치사구(in + 연대)\u003c/span> : in + [the] + [연대 복수형(~s)] : \"1880년대에\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"The phrase \"rain check\", 어구 ‘우천 교환권’은. was first used, 처음 사용되었다. at a baseball game, 야구 경기에서. in the 1880s, 1880년대에. 이 문장 전체를 해석하면, 어구 ‘우천 교환권’은 1880년대에 야구 경기에서 처음 사용되었다.","hl":"m"},{"n":41,"text":"이 문장은 take a rain check라는 표현의 유래를 알려 주는 첫 안내문이에요. rain check가 처음 쓰인 곳이 야구 경기였고, 그 시기가 천팔백팔십 년대라는 점을 기억해 주세요. 그래서 바로 다음 문장에서 그때의 rain check가 무엇이었는지 설명해 주는 거죠.","hl":"mn"},{"n":42,"text":"어법 포인트 첫 번째, was first used를 보세요. 주어인 The phrase rain check는 무언가를 사용하는 쪽이 아니라 사용되는 쪽이에요. 그래서 능동태가 아니라 수동태, be동사에 과거분사를 쓴 거죠. 두 번째, first는 처음으로라는 부사인데 be동사와 과거분사 사이에 쏙 들어갔어요. 세 번째, in the 1880s처럼 연대를 말할 때는 the를 붙이고 복수형으로 쓴다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우천 교환권은\u003c/span>\u003cspan class=\"en\">A rain check\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표였다\u003c/span>\u003cspan class=\"en\">was a ticket\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 받는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">got\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래의 경기를 위해\u003c/span>\u003cspan class=\"en\">for a future game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야구 경기가 취소되었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">baseball \u003c/span>\u003cspan class=\"tgt\">game \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">canceled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">rain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우천 교환권은 비 때문에 야구 경기가 취소되었을 때 사람들이 미래의 경기를 위해 받는 표였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 rain check가 구체적으로 무엇이었는지 설명해 줘요. 비 때문에 야구 경기가 \u003cb class=\"key\">취소\u003c/b>되면 사람들이 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">경기\u003c/b>를 위해 받은 \u003cb class=\"key\">표\u003c/b>가 바로 rain check였다는 거죠. 그래서 오늘날 ‘take a rain check’가 ‘나중에 하자’라는 뜻을 갖게 된 \u003cb class=\"key\">배경\u003c/b>이 여기에 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사(a ticket) + [that(목적격 관계대명사)] + [people(주어)] + [got(동사)] : \"사람들이 받는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 부사절(시간)\u003c/span> : [when + 주어 + 동사] : \"야구 경기가 취소되었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어(a baseball game) + [was] + [canceled (과거분사)] : \"취소되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 전치사구\u003c/span> : [because of] + [명사(rain)] : \"비 때문에\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"A rain check, 우천 교환권은. was a ticket, 표였다. that people got, 사람들이 받는. for a future game, 미래의 경기를 위해. when a baseball game was canceled, 야구 경기가 취소되었을 때. because of rain, 비 때문에. 이 문장 전체를 해석하면, 우천 교환권은 비 때문에 야구 경기가 취소되었을 때 사람들이 미래의 경기를 위해 받는 표였다.","hl":"m"},{"n":44,"text":"이 문장은 앞에서 말한 rain check가 구체적으로 무엇이었는지 설명해 줘요. 비 때문에 야구 경기가 취소되면 사람들이 미래의 경기를 위해 받은 표가 바로 rain check였다는 거죠. 그래서 오늘날 take a rain check가 나중에 하자라는 뜻을 갖게 된 배경이 여기에 담겨 있어요.","hl":"mn"},{"n":45,"text":"어법 포인트 첫 번째, that people got을 보세요. 앞에 있는 a ticket을 뒤에서 설명하는 관계대명사 that이에요. that 뒤에 주어 people과 동사 got이 있으니 목적격이고, 목적격 관계대명사는 생략할 수 있다는 것도 같이 기억해 두세요. 두 번째, was canceled는 수동태예요. 경기는 스스로 취소되는 게 아니라 취소되는 대상이니까 be동사에 과거분사를 쓴 거죠. 세 번째, when a baseball game was canceled는 when이 이끄는 부사절로 언제 표를 받는지 알려 줘요. 네 번째, because of rain에서 because of는 뒤에 명사가 오는 전치사구이고, because는 뒤에 절이 온다는 차이를 꼭 구별해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이후에,\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우천 교환권들이\u003c/span>\u003cspan class=\"en\">rain checks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 스포츠 행사들에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">sporting \u003c/span>\u003cspan class=\"tgt\">events\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이후에, 우천 교환권들이 다른 스포츠 행사들에서 주어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 rain check의 쓰임이 \u003cb class=\"key\">야구\u003c/b>를 넘어 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">스포츠 \u003c/b>\u003cb class=\"key\">행사\u003c/b>로 넓어졌다는 흐름을 이어 줘요. ‘이후에’라는 \u003cb class=\"key\">Later\u003c/b>가 시간의 확장을 표시하고, 주어가 복수라서 \u003cb class=\"key\">were \u003c/b>\u003cb class=\"key\">given\u003c/b>으로 받은 점이 눈에 띄죠. 이렇게 범위가 넓어진 덕분에 지금은 일상 표현으로까지 쓰이게 된 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(복수 주어 + be동사 + 과거분사)\u003c/span> : 복수 주어(rain checks) + [were] + [given(과거분사)] : \"주어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·행사를 나타내는 전치사 at\u003c/span> : [at] + [other] + [복수명사(sporting events)] : \"다른 스포츠 행사들에서\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Later, 이후에. rain checks, 우천 교환권들이. were given, 주어졌다. at other sporting events, 다른 스포츠 행사들에서. 이 문장 전체를 해석하면, 이후에, 우천 교환권들이 다른 스포츠 행사들에서 주어졌다.","hl":"m"},{"n":47,"text":"이 문장은 rain check의 쓰임이 야구를 넘어 다른 스포츠 행사로 넓어졌다는 흐름을 이어 줘요. 이후에라는 Later가 시간의 확장을 표시하고, 주어가 복수라서 were given으로 받은 점이 눈에 들어오죠. 이렇게 범위가 넓어진 덕분에 지금은 일상 표현으로까지 쓰이게 된 거예요.","hl":"mn"},{"n":48,"text":"어법 포인트 첫 번째, were given을 보세요. 주어 rain checks가 복수라서 be동사가 were로 왔어요. 그리고 우천 교환권은 주는 쪽이 아니라 주어지는 대상이니까 수동태를 쓴 거죠. 두 번째, at other sporting events에서 at은 행사나 장소 앞에서 ~에서라는 뜻을 나타내고, other 뒤에는 sporting events처럼 복수명사가 온다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흐르면서,\u003c/span>\u003cspan class=\"en\">Over time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘우천 교환권을 받는다’는\u003c/span>\u003cspan class=\"en\">&quot;take a rain check&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">널리 사용되어 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">widely \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 지금은 어떤 일을 할 수 없고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에 그것을 하고 싶다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 흐르면서, ‘우천 교환권을 받는다’는 당신이 지금은 어떤 일을 할 수 없고 나중에 그것을 하고 싶다고 말하기 위해 널리 사용되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 ‘take a rain check’라는 표현의 뜻과 쓰임이 시간이 흐르면서 어떻게 자리 잡았는지 정리하는 글의 마무리 문장이에요. \u003cb class=\"key\">시간이 \u003c/b>\u003cb class=\"key\">흐르면서\u003c/b>라는 over time을 기준으로, 이 표현이 널리 쓰이게 된 결과를 말하고 있죠. 핵심은 지금은 어떤 일을 못 하고 \u003cb class=\"key\">나중에\u003c/b> 하겠다는 뜻을 전할 때 이 표현을 쓴다는 점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : [주어] + has been + [과거분사(used)] : \"널리 사용되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [be used] + to say (to부정사구) : \"말하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절과 병렬 구조\u003c/span> : say + [that + 주어 + 동사 ~] / [can't do] and [want to do]의 병렬 : \"당신이 지금은 어떤 일을 할 수 없고 나중에 그것을 하고 싶다고\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Over time, 시간이 흐르면서. \"take a rain check\", ‘우천 교환권을 받는다’는. has been widely used, 널리 사용되어 왔다. to say, 말하기 위해. that you can't do something now, 당신이 지금은 어떤 일을 할 수 없고. and want to do it later, 나중에 그것을 하고 싶다고. 이 문장 전체를 해석하면, 시간이 흐르면서, ‘우천 교환권을 받는다’는 당신이 지금은 어떤 일을 할 수 없고 나중에 그것을 하고 싶다고 말하기 위해 널리 사용되어 왔다.","hl":"m"},{"n":50,"text":"이 문장은 take a rain check라는 표현이 시간이 흐르면서 어떻게 널리 쓰이게 되었는지 정리하는 마무리 문장이에요. over time은 시간이 흐르면서라는 뜻으로, 표현의 변화와 정착을 이끄는 말이죠. 결국 이 표현은 지금은 어떤 일을 할 수 없고 나중에 하고 싶다고 말할 때 널리 쓰인다는 뜻이에요.","hl":"mn"},{"n":51,"text":"먼저 has been widely used를 볼게요. 이건 현재완료 수동태예요. take a rain check라는 표현이 스스로 사용하는 게 아니라 사람들에 의해 사용되는 대상이니까 수동태로 쓰였고, 과거부터 지금까지 이어져 온 결과를 말하니까 has been이 붙은 거죠. 두 번째로 to say는 목적을 나타내는 to부정사예요. 무엇을 말하기 위해 널리 쓰여 왔는지를 이어 주는 역할을 해요. 세 번째로 that you can't do something now and want to do it later에서 that은 say의 목적어 자리에 온 명사절을 이끌고, 그 안에서 can't do와 want to가 and로 연결된 병렬 구조라는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Sarah는 가장 친한 친구 Emily에게 오늘 영화를 보자고 \u003cb class=\"key\">제안\u003c/b>했지만, Emily는 할머니 댁에 가야 해서 \u003cb class=\"key\">우천 \u003c/b>\u003cb class=\"key\">교환권을 \u003c/b>\u003cb class=\"key\">받아야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>고 답했다.\u003c/li>\u003cli>Sarah는 조금 \u003cb class=\"key\">실망\u003c/b>했지만 Emily의 \u003cb class=\"key\">상황\u003c/b>을 이해하고 다음에 보자고 말했다.\u003c/li>\u003cli>take a rain check는 제안을 \u003cb class=\"key\">정중하게 \u003c/b>\u003cb class=\"key\">거절\u003c/b>하지만 \u003cb class=\"key\">나중에 \u003c/b>\u003cb class=\"key\">하고 \u003c/b>\u003cb class=\"key\">싶어 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 뜻이다.\u003c/li>\u003cli>이 표현은 1880년대 \u003cb class=\"key\">야구 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 비 때문에 경기가 취소되었을 때 미래의 경기를 위해 받던 표에서 시작되어 오늘날 \u003cb class=\"key\">널리\u003c/b> 쓰인다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>&quot;Take a rain check&quot; means to refuse an offer politely but wish to do it later, and the phrase originated from baseball games in the 1880s.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Emily가 가장 친한 친구 Sarah의 영화 제안을 \u003cb class=\"key\">우천 \u003c/b>\u003cb class=\"key\">교환권을 \u003c/b>\u003cb class=\"key\">받는다\u003c/b>는 표현으로 정중하게 거절하고, 이 표현은 \u003cb class=\"key\">제안을 \u003c/b>\u003cb class=\"key\">정중하게 \u003c/b>\u003cb class=\"key\">거절하지만 \u003c/b>\u003cb class=\"key\">나중에 \u003c/b>\u003cb class=\"key\">하고 \u003c/b>\u003cb class=\"key\">싶어 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 뜻이며 1880년대 \u003cb class=\"key\">야구 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 유래했다는 것을 설명하는 글이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 배운 내용을 정리해 볼게요. take a rain check는 제안을 정중하게 거절하지만 나중에 하고 싶다는 뜻이고, 1880년대 야구 경기에서 비 때문에 취소된 경기를 대신 볼 수 있게 해 준 표에서 시작된 표현이에요. 이제 이 표현이 나오면 정중한 거절과 미래의 약속이라는 두 가지 느낌을 함께 떠올리면 됩니다. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
