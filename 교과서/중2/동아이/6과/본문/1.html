yDtqla2iVtGrd91ey06eunkGvz/rz2P//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Fly High: Bringing Energy and Spirit to Our School<small>Fly High: 우리 학교에 에너지를 불어넣는 활력소</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 스포츠 경기에서 선수들이 지치고 힘들 때 응원단이 보내는 에너지가 얼마나 큰지 느껴본 적 있나요? 이 글은 치어리딩(Cheerleading)이 단순히 춤을 추는 활동을 넘어, 공동체 의식(Sense of Community)과 팀워크(Teamwork)를 바탕으로 사람들에게 긍정적인 에너지를 전달하는 과정에 대해 다루고 있어요. 특히 치어리딩에서 중요한 상호 신뢰(Mutual Trust)는 멤버들이 공중에서 회전하거나 사람 탑을 쌓는 고난도 동작을 안전하게 성공시키기 위한 필수 요소랍니다. 마치 우리가 혼자일 때보다 함께할 때 더 큰 힘을 발휘하는 것처럼, 이들은 서로를 믿고 격려하며 경기장의 분위기를 바꾸는 심리적 촉매제(Psychological Catalyst) 역할을 하죠. 오늘 지문을 읽으면서 치어리딩이 경기와 관객에게 어떤 힘을 실어주는지, 그 속에 담긴 &#39;함께하는 가치&#39;에 집중해서 살펴보면 좋겠습니다!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01동아리 소개</div><ul><li>2년 전 한 학생의 아이디어로 시작된 우리 학교 응원단 Fly High를 소개합니다.</li><li>현재 10명의 여학생과 6명의 남학생으로 구성</li><li>모든 구성원이 저마다의 특별한 에너지(energy)를 지님</li><li>핵심 키워드: 응원단(cheerleading club)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02경기장에서의 활약</div><ul><li>농구 경기 중 위기 상황에서 Fly High의 공연이 팀의 분위기를 반전시켰습니다.</li><li>경기 중 20점 차로 뒤지던 우리 팀</li><li>하프타임(halftime) 동안 공중제비와 인간 피라미드 공연</li><li>&quot;포기하지 마!&quot;라는 응원으로 팀의 역전승 유도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03단장 인터뷰</div><ul><li>단장인 지나는 응원 활동을 통해 느끼는 신뢰와 자부심을 공유했습니다.</li><li>단원들 사이의 상호 신뢰(trust) 덕분에 어려운 동작 가능</li><li>관중들의 함성을 들으며 큰 자부심(proud)을 느낌</li><li>핵심 키워드: 단장(captain)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04향후 활동 안내</div><ul><li>다음 주 학교 축제에서 Fly High의 활기찬 공연을 직접 관람할 수 있습니다.</li><li>학교 축제(school festival)에서 공연 예정</li><li>학생들에게 응원단의 에너지를 직접 느낄 것을 권유함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spread</td><td class=\"m\">퍼뜨리다, 전파하다</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호, 응원</td></tr><tr><td class=\"w\">cheerleading</td><td class=\"m\">치어리딩</td></tr><tr><td class=\"w\">member</td><td class=\"m\">일원, 구성원</td></tr><tr><td class=\"w\">special</td><td class=\"m\">특별한</td></tr><tr><td class=\"w\">recent</td><td class=\"m\">최근의</td></tr><tr><td class=\"w\">quarter</td><td class=\"m\">4분의 1, (경기 등의) 4쿼터</td></tr><tr><td class=\"w\">lose</td><td class=\"m\">지다, 패하다</td></tr><tr><td class=\"w\">halftime</td><td class=\"m\">하프타임(전반전과 후반전 사이의 휴식 시간)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">court</td><td class=\"m\">(경기용) 코트, 경기장</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">공연하다, 수행하다</td></tr><tr><td class=\"w\">wonderfully</td><td class=\"m\">훌륭하게, 아주 멋지게</td></tr><tr><td class=\"w\">flip</td><td class=\"m\">공중제비를 돌다, 홱 뒤집다</td></tr><tr><td class=\"w\">pyramid</td><td class=\"m\">피라미드 (사람들이 층을 이뤄 만든 형태)</td></tr><tr><td class=\"w\">shout</td><td class=\"m\">외치다</td></tr><tr><td class=\"w\">in the end</td><td class=\"m\">마침내, 결국</td></tr><tr><td class=\"w\">captain</td><td class=\"m\">주장, 대장</td></tr><tr><td class=\"w\">trust</td><td class=\"m\">신뢰하다, 믿다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">응원을 퍼뜨림</span><span class=\"en\"><b><span class=\"grammar-hl\">Spreading</span> Cheer Everywhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기저기</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">응원을 여기저기 퍼뜨림</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 앞으로 소개할 동아리 &#39;Fly High&#39;의 명칭을 밝히며 독자의 관심을 유도하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</
