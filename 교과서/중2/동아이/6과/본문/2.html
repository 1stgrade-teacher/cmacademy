1xncP++h+XXv8AkfpTiwC9Rg57jPv6ZwOcj8ORgP8Ar/P7g/r/ADF5x9Pz55/HpSEZHIB78dfyPTn1yOmTzik3rxl1P/Ah27df5fzpQy9QV6HqRznp+WQcf/Wov/l/X3gtk+j2ff8ArqLzk9vToPQcY/P86T6/5/nTRIpx8646dR2Ppn279e9OyOeRx19vr/nt2paX8/63/T8OoCEgEDHU9u2c8/z/AFoPRsdgf5c9PY98Um9P7y9ccMP8fz/LmkZlCsQQcggHPcZPbPbPfj9QxN21/rex/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Spending Habits: Are You Managing Your Money Wisely?<small>소비 습관: 당신은 돈을 현명하게 관리하고 있는가?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 혹시 용돈을 받을 때마다 계획 없이 바로 써버리진 않나요? 이번 글에서 다루는 &#39;소비 계획(spending plan)&#39;은 흔히 말하는 가계부 작성이나 예산 세우기와 같은 개념으로, 자신의 수입과 지출을 관리하여 경제적 자립심을 키우는 첫걸음이랍니다. 흔히 &#39;돈은 나무에서 열리지 않는다(Money doesn’t grow on trees)&#39;는 표현은 돈을 벌기 어렵다는 뜻인데, 그만큼 한정된 자원을 효율적으로 사용하는 습관(spending habits)이 중요하다는 사실을 강조하죠. 특히 학생 시절부터 자신의 소비 패턴을 파악하면 충동구매를 줄이고 꼭 필요한 곳에 돈을 쓰는 합리적인 태도를 기를 수 있어요. 이제 본문을 통해 우리 학교 친구들은 돈을 어떻게 관리하고 있는지 살펴보고, 나만의 건강한 경제 습관을 세울 준비를 해볼까요?</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01설문 조사 배경</div><ul><li>학생들의 돈 관리 습관을 알아보기 위해 본교 학생 100명을 대상으로 설문 조사를 실시했다.</li><li>조사 대상: 우리 학교 학생 100명(100 students)</li><li>조사 내용: 저축 여부와 지출 계획(spending plan) 유무</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02주요 조사 결과</div><ul><li>조사 결과, 체계적인 지출 계획을 가진 학생은 적었으며, 주로 식비로 돈을 많이 쓰는 것으로 나타났다.</li><li>계획적 소비: 지출 계획이 있는 학생은 15명뿐임</li><li>지출 항목: 식비(food)가 가장 많고 교통비(transportation)가 그 뒤를 이음</li><li>학년별 차이: 3학년(80%)과 1학년(30%)의 저축률 차이가 큼</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03교장 선생님의 메시지</div><ul><li>돈의 소중함을 강조하며 올바른 소비 습관 형성을 위한 학교의 방침을 전달했다.</li><li>조언: 돈은 쉽게 얻어지는 것이 아님(Money doesn’t grow on trees)</li><li>중요성: 계획적인 소비 습관(spending habits)의 필요성 강조</li><li>후속 조치: 다음 주 전교생에게 용돈 기입장(money diary) 배부 예정</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">saver</td><td class=\"m\">저축하는 사람</td></tr><tr><td class=\"w\">spender</td><td class=\"m\">돈을 쓰는 사람</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">(순서상으로) 뒤를 잇다, 따라오다</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도</td></tr><tr><td class=\"w\">survey</td><td class=\"m\">설문조사</td></tr><tr><td class=\"w\">show</td><td class=\"m\">보여주다, 나타내다</td></tr><tr><td class=\"w\">spending plan</td><td class=\"m\">지출 계획</td></tr><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">large</td><td class=\"m\">큰, 많은</td></tr><tr><td class=\"w\">transportation</td><td class=\"m\">교통수단</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">뒤를 잇다</td></tr><tr><td class=\"w\">percent</td><td class=\"m\">퍼센트, 백분율</td></tr><tr><td class=\"w\">principal</td><td class=\"m\">교장</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 재배되다 (여기서는 &#39;생겨나다&#39;의 의미)</td></tr><tr><td class=\"w\">habit</td><td class=\"m\">습관</td></tr><tr><td class=\"w\">diary</td><td class=\"m\">일기장 (여기서는 가계부의 의미)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 ~인가요</span><span class=\"en\"><b><span class=\"grammar-hl\">Are You a Saver or a Spender?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저축하는 사람인가요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 소비하는 사람인가요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">당신은 저축하는 사람인가요 아니면 소비하는 사람인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자들에게 돈 관리 방식에 대해 질문을 던져 경제 습관에 대한 호기심을 유발하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Are You a Saver or a Spender? (관용표현): A or B 구조로 선택 의문문을 구성함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">saver</td><td class=\"m\">저축하는 사람</td></tr><tr><td class=\"w\">spender</td><td class=\"m\">돈을 쓰는 사람</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이세미 작성</span><span class=\"en\"><b><span class=\"grammar-hl\">by Lee Semi</span></b></span></div></div><div class=\"lec-sent-ko\">이세미 작성</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 던진 질문을 구체화하여 독자가 스스로 자신의 성향을 &#39;저축가&#39;와 &#39;지출가&#39; 중 하나로 생각해보게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by Lee Semi 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">20XX년 9월 8일</span><span class=\"en\"><b><span class=\"grammar-hl\">September 8th, 20XX</span></b></span></div></div><div class=\"lec-sent-ko\">20XX년 9월 8일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설문조사의 대상과 규모를 밝혀 이어질 결과의 신뢰성을 확보하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">September 8th, 20XX 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 무엇을 하나요</span><span class=\"en\"><b><span class=\"grammar-hl\">What do you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 돈으로</span><span class=\"en\"><b>with your money?</b></span></div></div><div class=\"lec-sent-ko\">당신은 당신의 돈으로 무엇을 하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자들에게 돈 관리 방식에 대해 질문을 던져 경제 습관에 대한 호기심을 유발하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What do you do (간접의문문): 의문사(What)로 시작하여 질문을 구성하는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 저축하나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you save</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 소비하나요?</span><span class=\"en\"><b>or spend it?</b></span></div></div><div class=\"lec-sent-ko\">그것을 저축하나요 아니면 소비하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 던진 질문을 구체화하여 독자가 스스로 자신의 성향을 &#39;저축가&#39;와 &#39;지출가&#39; 중 하나로 생각해보게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you save (의문문): 조동사 do를 문두에 위치시켜 주어와 동사를 도치한 일반동사 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 다음의 질문을 했습니다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">asked</span> the following questions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">100명에게</span><span class=\"en\"><b>to 100 students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 학교 학생</span><span class=\"en\"><b>from our school.</b></span></div></div><div class=\"lec-sent-ko\">우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설문조사의 대상과 규모를 밝혀 이어질 결과의 신뢰성을 확보하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked (3형식): 주어(We) + 동사(asked) + 목적어(questions) + 전치사구(to 100 students...) 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">(순서상으로) 뒤를 잇다, 따라오다</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">뒤를 잇다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴봅시다</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s look at</span> the results.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그 결과를 살펴봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 설문조사의 데이터를 제시하기 위해 독자의 주의를 집중시키는 전환 문구입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s look at (관용표현): Let us의 축약형으로 제안을 나타내는 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀랍게도,</span><span class=\"en\"><b>Surprisingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 설문 조사는 보여 주었으며</span><span class=\"en\"><b><span class=\"grammar-hl\">the survey showed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">100명의 학생들 중 오직 15명만이</span><span class=\"en\"><b><span class=\"grammar-hl\">that only 15 out of 100 students</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지출 계획을 가지고 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">had a spending plan</span>.</b></span></div></div><div class=\"lec-sent-ko\">놀랍게도, 그 설문 조사는 100명의 학생들 중 오직 15명만이 지출 계획을 가지고 있다는 것을 보여 주었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설문 결과의 핵심을 강조합니다. 여기서 Surprisingly는 사전적으로는 &#39;놀랍게도&#39;인데, 여기서는 계획적인 소비가 흔치 않다는 점을 강조하기 위해 사용되었습니다. 필자는 학생들이 계획적인 소비를 거의 하지 않는다는 사실이 예상 밖의 일임을 드러내어 문제의식을 느끼게 하려고 이 부사를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the survey showed that only 15 out of 100 students had a spending plan (명사절): that절이 동사(showed)의 목적어 역할을 하며, spending은 &#39;소비&#39;라는 명사적 개념을 나타내는 동명사로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도</td></tr><tr><td class=\"w\">survey</td><td class=\"m\">설문조사</td></tr><tr><td class=\"w\">show</td><td class=\"m\">보여주다, 나타내다</td></tr><tr><td class=\"w\">spending plan</td><td class=\"m\">지출 계획</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 설문 조사는 또한 보여 주었으며</span><span class=\"en\"><b>The survey also showed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 학생들이 무엇에 가장 많은 돈을 소비하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what the students spent the most money on</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 설문 조사는 또한 그 학생들이 무엇에 가장 많은 돈을 소비하는지 보여 주었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지출 계획의 부재를 언급한 뒤, 실제로 돈이 어디에 쓰이는지 세부 항목으로 내용을 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what the students spent the most money on (간접의문문): 의문사(what) + 주어(the students) + 동사(spent) 어순으로 명사절을 형성하여 showed의 목적어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survey</td><td class=\"m\">설문조사</td></tr><tr><td class=\"w\">show</td><td class=\"m\">보여주다, 나타내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음식이</span><span class=\"en\"><b>Food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택을 받았으며</span><span class=\"en\"><b><span class=\"grammar-hl\">was chosen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 많은 수의 학생들의</span><span class=\"en\"><b>by the largest number of students.</b></span></div></div><div class=\"lec-sent-ko\">음식이 가장 많은 수의 학생들의 선택을 받았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학생들이 가장 많이 지출하는 항목이 &#39;식비&#39;임을 밝히는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was chosen (수동태): be동사(was)+p.p.(chosen) 구조. 기본구조: choose A (A를 선택하다). 타동사(choose)인데 뒤에 목적어가 없어서 수동구조 was chosen 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">large</td><td class=\"m\">큰, 많은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">교통이</span><span class=\"en\"><b><span class=\"grammar-hl\">Transportation followed food.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식의 뒤를 이었다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">교통이 음식의 뒤를 이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> followed는 사전적으로 &#39;따라가다&#39;인데, 여기서는 지출 순위에서 그다음으로 높다는 뜻입니다. 필자는 순위를 직접 설명하는 대신 &#39;뒤를 잇다&#39;라는 표현을 사용하여 자연스러운 지출 우선순위 흐름을 보여주려고 이 동사를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Transportation followed food. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">(순서상으로) 뒤를 잇다, 따라오다</td></tr><tr><td class=\"w\">transportation</td><td class=\"m\">교통수단</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">뒤를 잇다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3학년 학생의 80%는 돈을 저축했지만,</span><span class=\"en\"><b>80 percent of <span class=\"grammar-hl\">3rd-year students</span> saved money,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1학년 학생의 겨우 30%만이</span><span class=\"en\"><b>but only 30 percent of 1st-year students saved money.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 저축했다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">또한, 3학년 학생의 80%는 돈을 저축했지만, 1학년 학생의 겨우 30%만이 돈을 저축했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학년별 저축 성향을 대비하여, 저축 습관이 학년(연령)에 따라 큰 차이를 보인다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">3rd-year students (복합명사): 수사와 명사가 결합하여 형용사처럼 뒤의 명사를 수식하는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percent</td><td class=\"m\">퍼센트, 백분율</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">특별한 메시지</span><span class=\"en\"><b><span class=\"grammar-hl\">A Special Message</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교장 선생님으로부터의</span><span class=\"en\"><b><span class=\"grammar-hl\">from the Principal</span></b></span></div></div><div class=\"lec-sent-ko\">교장 선생님으로부터의 특별한 메시지</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제 제기에서 끝나는 것이 아니라, 해결 방안(용돈 기입장)을 제시하며 실질적인 변화를 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A Special Message from the Principal 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principal</td><td class=\"m\">교장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">돈은</span><span class=\"en\"><b>Money <span class=\"grammar-hl\">doesn’t grow</span> on trees.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자라지 않습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">돈은 나무에서 자라지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 돈은 귀하고 얻기 힘들다는 것을 강조하는 관용구입니다. 여기서는 돈의 소중함을 깨닫고 함부로 쓰지 말아야 한다는 교훈적인 태도를 전달하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doesn’t grow 일반동사의 부정문: 조동사 does + not + 동사원형 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 재배되다 (여기서는 &#39;생겨나다&#39;의 의미)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 소비를 계획하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Planning your spending</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 중요합니다!</span><span class=\"en\"><b>is very important!</b></span></div></div><div class=\"lec-sent-ko\">여러분의 소비를 계획하는 것은 매우 중요합니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설문 결과를 바탕으로 필자가 도출한 핵심 결론이자 학생들에게 전달하고자 하는 메시지입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Planning your spending (동명사): 문장의 주어 자리에서 &#39;계획하기&#39;라는 행위를 나타내는 명사적 기능</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">Everyone needs good spending habits.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요하지요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 지출 습관이</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">모든 사람은 좋은 지출 습관이 필요하지요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 올바른 소비 습관의 필요성을 보편적인 가치로 확산시키며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Everyone needs good spending habits. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">habit</td><td class=\"m\">습관</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <d
