fe)을 위한 노력</li><li>학생들에게 친근한 인사(say hello) 독려</li><li>핵심 키워드: 강 선생님(Ms. Kang)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthcare</td><td class=\"m\">건강 관리, 의료</td></tr><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">nurse</td><td class=\"m\">간호사</td></tr><tr><td class=\"w\">office</td><td class=\"m\">사무실, (학교 등의) 보건실</td></tr><tr><td class=\"w\">check</td><td class=\"m\">확인하다, 점검하다</td></tr><tr><td class=\"w\">health</td><td class=\"m\">건강</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">상태</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advice</td><td class=\"m\">조언, 충고</td></tr><tr><td class=\"w\">work hard</td><td class=\"m\">열심히 일하다, 노력하다</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">healthy</td><td class=\"m\">건강한</td></tr><tr><td class=\"w\">safe</td><td class=\"m\">안전한</td></tr><tr><td class=\"w\">shy</td><td class=\"m\">수줍어하는, 부끄러워하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만나다</span><span class=\"en\"><b><span class=\"grammar-hl\">Meet</span> Our New Healthcare Robot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 새로운 건강 관리 로봇을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">우리의 새로운 건강 관리 로봇을 만나다</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 제목으로, 독자들에게 학교에 도입된 새로운 보건용 로봇인 &#39;케어봇&#39;을 소개하고 관심을 유도하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Meet (명령문): 주어(You)가 생략되고 동사원형으로 시작하여 상대방에게 행동을 요청하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthcare</td><td class=\"m\">건강 관리, 의료</td></tr><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">health</td><td class=\"m\">건강</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작성</span><span class=\"en\"><b><span class=\"grammar-hl\">by Go Woori</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고우리에 의해</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">고우리 작성</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들에게 케어봇이 있는 구체적인 장소(보건실)를 알려주며, 로봇의 정체를 명확히 밝히고 방문을 독려하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by Go Woori (전치사구): 전치사 by가 행위자나 작성자를 나타내며 명사 Go Woori를 수식하는 부사구로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">9월 8일,</span><span class=\"en\"><b><span class=\"grammar-hl\">September 8th, 20XX</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">20XX년</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">20XX년 9월 8일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 던짐으로써 독자의 호기심을 유발하고, 다음에 이어질 로봇의 기능에 대한 설명을 자연스럽게 이끌어내는 전환점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">September 8th, 20XX (명사구): 날짜를 나타내는 표현으로 문장에서 부사적인 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오셔서 Carebot을 만나 보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Come and meet</span> Carebot,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 새로운 인공 지능 건강 관리 로봇인</span><span class=\"en\"><b><span class=\"grammar-hl\">our new AI healthcare robot</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교 보건실에서</span><span class=\"en\"><b>in the school nurse’s office.</b></span></div></div><div class=\"lec-sent-ko\">오셔서 학교 보건실에서 우리의 새로운 인공 지능 건강 관리 로봇인 Carebot을 만나 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들에게 케어봇이 있는 구체적인 장소(보건실)를 알려주며, 로봇의 정체를 명확히 밝히고 방문을 독려하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Come and meet (명령문): 두 개의 동사원형(Come, meet)이 접속사 and로 연결되어 상대방에게 행동을 요청합니다.</div><div class=\"lec-gr-item\">our new AI healthcare robot (동격): Carebot과 our new AI healthcare robot이 동일한 대상을 지칭하며, 앞의 명사를 보충 설명하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthcare</td><td class=\"m\">건강 관리, 의료</td></tr><tr><td class=\"w\">robot</td><td class=\"m\">로봇</td></tr><tr><td class=\"w\">nurse</td><td class=\"m\">간호사</td></tr><tr><td class=\"w\">office</td><td class=\"m\">사무실, (학교 등의) 보건실</td></tr><tr><td class=\"w\">health</td><td class=\"m\">건강</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What can Carebot do?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Carebot이 할 수 있을까요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Carebot이 무엇을 할 수 있을까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 던짐으로써 독자의 호기심을 유발하고, 다음에 이어질 로봇의 기능에 대한 설명을 자연스럽게 이끌어내는 전환점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can Carebot do? (의문문): 조동사 can이 주어 앞으로 이동하여 의문문을 형성하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인하고</span><span class=\"en\"><b>can <span class=\"grammar-hl\">check</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들의 건강 상태를</span><span class=\"en\"><b><span class=\"grammar-hl\">the students’ health condition</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해 줄 수 있습니다</span><span class=\"en\"><b>and give</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 조언을</span><span class=\"en\"><b>them advice.</b></span></div></div><div class=\"lec-sent-ko\">그것은 학생들의 건강 상태를 확인하고 그들에게 조언을 해 줄 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 직접적인 답변입니다. 여기서 check는 사전적으로는 &#39;확인하다&#39;이지만, 여기서는 로봇이 학생들의 몸 상태를 진단하고 체크한다는 의미로 쓰였습니다. 로봇이 단순한 기계가 아니라 학생들의 건강을 관리하는 역할을 수행한다는 점을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">check the students’ health condition (동사구): 조동사 can의 지배를 받는 동사원형으로, 뒤에 목적어(health condition)를 취하는 타동사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">check</td><td class=\"m\">확인하다, 점검하다</td></tr><tr><td class=\"w\">health</td><td class=\"m\">건강</td></tr><tr><td class=\"w\">condition</td><td class=\"m\">상태</td></tr><tr><td class=\"w\">advice</td><td class=\"m\">조언, 충고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 보건 선생님인</span><span class=\"en\"><b>Our school nurse,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강 선생님은</span><span class=\"en\"><b><span class=\"grammar-hl\">Ms. Kang</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말씀하십니다,</span><span class=\"en\"><b>says,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Carebot은 열심히 일하고 있습니다</span><span class=\"en\"><b>“Carebot <span class=\"grammar-hl\">is working</span> hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두를 건강하고 안전하게 하고자</span><span class=\"en\"><b><span class=\"grammar-hl\">to keep</span> <span class=\"grammar-hl\">everyone healthy and safe</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 보건 선생님인 강 선생님은 말씀하십니다, “Carebot은 모두를 건강하고 안전하게 하고자 열심히 일하고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보건 선생님의 말을 인용하여 로봇의 신뢰성을 높이고 있습니다. 여기서 working hard는 기계가 쉬지 않고 작동한다는 사전적 의미를 넘어, 마치 사람처럼 열정적으로 학생들을 돌보고 있다는 의인화된 느낌을 줍니다. 로봇을 친근한 존재로 인식시키려는 필자의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ms. Kang (동격): 우리 학교 보건 선생님인 Ms. Kang이 동일한 인물임을 나타내기 위해 콤마로 연결한 구조입니다.</div><div class=\"lec-gr-item\">is working (현재진행): be동사(is) + 현재분사(working)의 형태로, 주어(Carebot)가 현재 하고 있는 동작을 나타냅니다.</div><div class=\"lec-gr-item\">to keep (to부정사): 부사적 용법(목적)으로, Carebot이 열심히 일하는 이유(모두를 건강하게 유지하기 위해)를 설명합니다.</div><div class=\"lec-gr-item\">everyone healthy and safe 5형식(SVOC) 구조: keep + 목적어(everyone) + 목적보어(healthy and safe)로, 목적어의 상태를 설명하는 형용사가 목적보어로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nurse</td><td class=\"m\">간호사</td></tr><tr><td class=\"w\">health</td><td class=\"m\">건강</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">~한 상태를 유지하다</td></tr><tr><td class=\"w\">healthy</td><td class=\"m\">건강한</td></tr><tr><td class=\"w\">safe</td><td class=\"m\">안전한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 Carebot을 본다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">if you see Carebot</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수줍어하지 말고</span><span class=\"en\"><b><span class=\"grammar-hl\">don’t be shy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인사해 주세요.”</span><span class=\"en\"><b>and say hello.</b></span></div></div><div class=\"lec-sent-ko\">그러니, 만약 여러분이 Carebot을 본다면, 수줍어하지 말고 인사해 주세요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 독자들에게 케어봇과 상호작용할 것을 권하며, 로봇을 무서워하거나 어색해하지 말고 학교의 구성원으로 받아들이라는 당부의 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if you see Carebot 분사구문(대체 가능한 절): if절을 사용하여 조건을 나타내며, 미래의 상황을 현재형으로 표현한 부사절 구조입니다.</div><div class=\"lec-gr-item\">don’t be shy (명령문): 부정 명령문으로 &#39;do not + 동사원형&#39; 구조를 사용하며, be동사 뒤에 형용사(shy)를 보어로 취합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shy</td><td class=\"m\">수줍어하는, 부끄러워하는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학교 보건실에 학생들의 건강을 관리하는 새로운 AI 로봇 &#39;케어봇&#39;이 도입되었다.</li><li>케어봇은 학생들의 건강 상태를 체크하고 적절한 조언을 제공한다.</li><li>보건 선생님은 케어봇이 학생들의 건강과 안전을 위해 노력 중이라며 긍정적으로 평가한다.</li><li>학생들이 케어봇을 친근하게 느끼고 먼저 다가가 인사하기를 권장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The school has introduced an AI healthcare robot named Carebot, and it helps students by checking their health and giving advice.</div>\n              <div class=\"lec-final-sum-ko\">학교는 &#39;케어봇&#39;이라는 AI 헬스케어 로봇을 도입했으며, 이것은 학생들의 건강을 확인하고 조언을 제공함으로써 도움을 준다.</div></div></div>"],"segs":[[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/3.mp3","hl":null},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/17.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/20.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/21.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/22.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/23.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/24.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/25.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의_audio/26.mp3","hl":"main"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/27.mp3","hl":"meaning"},{"audio":"./중2 동아(이) 6과 본문3_강의_audio/28.mp3","hl":"grammar"}],[{"audio":"./중2 동아(이) 6과 본문3_강의
