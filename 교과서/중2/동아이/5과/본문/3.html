 속에서 탄소 발자국을 줄이는 사소한 행동들이 모이면 지구 온도를 낮추고 베네치아와 같은 소중한 도시들을 지키는 거대한 변화(Making a difference)를 만들어낼 수 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 인식</div><ul><li>한국의 수인이가 베네치아의 홍수 소식을 듣고 느끼는 공감과 우려.</li><li>매년 여름 한국의 잦은 홍수(floods) 경험</li><li>베네치아의 홍수 상황에 대한 안타까움과 걱정</li><li>핵심 키워드: 홍수(floods), 베네치아(Venice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02해결책 모색</div><ul><li>친구들과 함께 베네치아를 돕기 위해 시작한 실천 캠페인.</li><li>베네치아를 돕고자 하는 마음에서 시작</li><li>3R 캠페인(3R campaign)을 통한 환경 보호 실천</li><li>핵심 키워드: 3R 운동(3R campaign), 재활용(Recycle), 재사용(Reuse), 줄이기(Reduce)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천과 확산</div><ul><li>학교 내로 확산된 환경 보호 활동과 협력의 중요성 강조.</li><li>학교 학생들의 일상적인 3R 실천 참여</li><li>베네치아를 위해 각자의 역할(do our part)을 수행하는 것의 중요성</li><li>함께 노력하면 변화를 만들 수 있다는 희망(make a difference)</li><li>핵심 키워드: 변화(difference), 역할(part)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황, 사태</td></tr><tr><td class=\"w\">do one&#39;s part</td><td class=\"m\">자기 역할을 하다, 본분을 다하다</td></tr><tr><td class=\"w\">make a difference</td><td class=\"m\">영향을 주다, 변화를 가져오다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕,</span><span class=\"en\"><b>Hello,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 수인이야</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Suin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국에서 온</span><span class=\"en\"><b>from Korea.</b></span></div></div><div class=\"lec-sent-ko\">안녕, 나는 한국의 수인이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 수신자인 베네치아 친구들에게 자신의 정체를 밝히고 친근감을 형성하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Suin (주격보어): 주어(I)의 신분을 보충 설명하는 명사(Suin)가 be동사 뒤에 위치한 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매년 여름에,</span><span class=\"en\"><b>Every summer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비가 많이 와</span><span class=\"en\"><b><span class=\"grammar-hl\">it rains</span> a lot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기는</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">매년 여름에 여기는 비가 많이 와.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 거주하는 한국의 기후적 특성을 언급하며, 뒤에 이어질 홍수 문제에 대한 공감대를 형성하기 위한 밑바탕입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it rains (비인칭주어): 날씨를 나타낼 때 사용하는 it으로, 구체적인 대상 없이 문장의 형식을 갖추기 위해 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로,</span><span class=\"en\"><b>Sometimes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 홍수를 겪어</span><span class=\"en\"><b>we have floods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 정말 무서워</span><span class=\"en\"><b>and <span class=\"grammar-hl\">they are really scary</span>.</b></span></div></div><div class=\"lec-sent-ko\">때때로, 우리는 홍수를 겪고 그것들은 정말 무서워.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 비라는 자연 현상이 극단적으로 변했을 때 발생하는 재난 상황을 설명하며, 이 글의 핵심 주제인 홍수의 위험성을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">they are really scary (현재분사): 주격보어 자리에 쓰인 scary는 분사형 형용사로, 주어(they=floods)가 유발하는 감정 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아의 상황은</span><span class=\"en\"><b><span class=\"grammar-hl\">The situation in Venice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무서울 게 틀림없어,</span><span class=\"en\"><b><span class=\"grammar-hl\">must be scary</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">베네치아의 상황도 무서울 게 틀림없어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국의 홍수 경험을 토대로 베네치아의 홍수 피해에 대해 화자가 깊이 공감하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The situation in Venice must be scary 조동사 구문: must be는 &#39;~임에 틀림없다&#39;라는 강한 추측을 나타내며, be동사를 활용하여 상태를 서술합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황, 사태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 가 본 적이 없어</span><span class=\"en\"><b><span class=\"grammar-hl\">I’ve never been</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아에,</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> Venice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 본 적이 있어</span><span class=\"en\"><b>but I <span class=\"grammar-hl\">have seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 아름다운 사진들을</span><span class=\"en\"><b>many beautiful pictures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의</span><span class=\"en\"><b>of it.</b></span></div></div><div class=\"lec-sent-ko\">나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 직접 가보지 못한 곳이지만 사진을 통해 그 도시의 아름다움을 잘 알고 있다는 점을 밝히며, 베네치아라는 공간에 대한 애착을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’ve never been to (현재완료): &#39;have + p.p.&#39; 구조로, 과거부터 현재까지의 경험(가본 적이 없다)을 나타냅니다.</div><div class=\"lec-gr-item\">have seen (현재완료): &#39;have + p.p.&#39; 구조로, 과거에 경험한 행위가 현재까지 영향을 미침을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 내 친구들에게 이야기했어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">talked to my friends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">홍수에 관해</span><span class=\"en\"><b>about the floods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희 도시의</span><span class=\"en\"><b>in your city.</b></span></div></div><div class=\"lec-sent-ko\">나는 너희 도시의 홍수에 관해 친구들과 이야기했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베네치아의 문제를 개인의 고민에서 학교 친구들과 공유하는 공동의 관심사로 확장하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked to my friends (관용표현): &#39;talk to + 사람&#39;은 특정 대상과 대화하다라는 의미의 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 베네치아를 돕고 싶었어,</span><span class=\"en\"><b>We <span class=\"grammar-hl\">wanted to help</span> Venice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 우리는 시작했어</span><span class=\"en\"><b>so we started</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3R 캠페인을</span><span class=\"en\"><b>the 3R campaign.</b></span></div></div><div class=\"lec-sent-ko\">우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공감에서 그치지 않고, 환경 보호라는 구체적인 실천 행동으로 나아가게 된 동기를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wanted to help (to부정사): 동사 want의 목적어 역할을 하는 명사적 용법으로, to+동사원형 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">3R은 재활용하기, 재사용하기, 그리고 줄이기야.</span><span class=\"en\"><b>The 3Rs are <span class=\"grammar-hl\">Recycle, Reuse, and Reduce</span>.</b></span></div></div><div class=\"lec-sent-ko\">3R은 ‘재활용하다’, ‘재사용하다’, 그리고 ‘줄이다’야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장에서 언급한 3R 캠페인의 구체적인 활동 내용을 정의하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Recycle, Reuse, and Reduce (동명사(명사적)): 문장에서 세 가지 활동을 나열할 때 각각의 행위 개념을 나타내는 명사적 용법으로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지금,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 학교의 많은 학생들은</span><span class=\"en\"><b>many students at my school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 세 가지 것들을 하고 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">are doing</span> these three things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠페인이 일회성 구호에 그치지 않고 일상적인 습관으로 정착되었음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are doing (현재진행): &#39;be동사 + -ing&#39; 구조로, 현재 학생들이 지속적으로 실천하고 있는 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 중요해</span><span class=\"en\"><b><span class=\"grammar-hl\">It is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 역할을 하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> our part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아를 위해</span><span class=\"en\"><b>for Venice.</b></span></div></div><div class=\"lec-sent-ko\">베네치아를 위해 우리의 역할을 하는 것이 중요해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호 실천이 왜 필요한지에 대한 가치관을 밝히며, 독자들에게 실천의 당위성을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is important to do (가주어): 진주어: It이 문장의 주어 자리를 채우고, 진짜 주어인 to부정사구(to do our part for Venice)가 뒤로 이동한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">함께,</span><span class=\"en\"><b>Together,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 만들 수 있어</span><span class=\"en\"><b>we can <span class=\"grammar-hl\">make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변화를!</span><span class=\"en\"><b><span class=\"grammar-hl\">a difference</span>!</b></span></div></div><div class=\"lec-sent-ko\">함께, 우리는 변화를 만들 수 있어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글의 결론으로, 개인의 노력이 모이면 기후 위기 극복이라는 커다란 변화를 일으킬 수 있다는 희망적인 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make a difference (관용표현): &#39;make a difference&#39;는 &#39;변화를 만들다/영향을 주다&#39;라는 의미의 관용구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make a difference</td><td class=\"m\">영향을 주다, 변화를 가져오다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한국의 수인은 자신의 홍수 경험을 통해 베네치아의 피해에 공감한다.</li><li>친구들과 함께 베네치아를 돕기 위해 3R 환경 캠페인을 시작했다.</li><li>환경 보호 실천이 기후 변화를 막고 세상을 바꿀 수 있다고 믿는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students launched the 3R campaign to address the environmental crisis in Venice, and they encourage collective action to make a positive impact.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 베네치아의 환경 위기를 해결하기 위해 3R 캠페인을 시작했으며, 긍정적인 변화를 만들기 위해 공동의 행동을 촉구한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"aud
