bkg-txt\">베네치아(Venice)가 처한 위기를 이해하려면 먼저 지구 온난화(Global Warming)와 해수면 상승(Sea Level Rise)의 개념을 알아두는 것이 중요해요. 온실가스 배출로 인해 지구 기온이 오르면 극지방의 빙하가 녹고 바닷물의 부피가 팽창하면서 해수면이 높아지는데, 이것이 바다 위에 세워진 베네치아와 같은 해안 도시들에 큰 위협이 되는 것이죠. 특히 베네치아에서 발생하는 잦은 침수 현상을 &#39;아쿠아 알타(Acqua Alta)&#39;라고 부르는데, 이는 단순한 밀물보다 훨씬 높은 수준의 홍수를 의미해요. 마치 욕조에 물을 계속 틀어놓으면 결국 밖으로 넘치는 것처럼, 해수면이 높아질수록 도시 전체가 가라앉을 수 있다는 기후 위기의 심각성을 상징하는 현상으로 이해하면 쉽습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01베니스 소개</div><ul><li>이탈리아의 수상 도시인 베니스의 아름다움과 주요 특징을 설명한다.</li><li>물 위에 세워진 아름다운 도시 베니스(Venice)</li><li>운하(canals)와 역사적인 건물들로 유명함</li><li>매년 많은 관광객(tourists)이 방문함</li><li>핵심 키워드: 베니스(Venice), 운하(canals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02당면한 위기</div><ul><li>지구 온난화로 인해 발생한 심각한 침수 문제를 겪고 있다.</li><li>지난주 거리 침수(flooded) 발생으로 일상생활 마비</li><li>부모님의 빵집 영업 중단 및 학교 등교 불가능</li><li>이동을 위해 긴 장화(rain boots) 착용 필수</li><li>핵심 키워드: 침수(flooded), 장화(rain boots)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문제의 원인과 요청</div><ul><li>지구 온난화가 베니스를 위협하고 있으며 외부의 도움이 절실한 상황이다.</li><li>지구 온난화로 인한 해수면 상승(water rises)</li><li>도시가 물속에 잠길(underwater) 위험성 증가</li><li>도시를 구하기 위한 도움(help) 요청</li><li>핵심 키워드: 지구 온난화(global warming), 해수면 상승(water rises)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have heard of</td><td class=\"m\">~에 대해 들어본 적이 있다, ~을 알고 있다</td></tr><tr><td class=\"w\">famous for</td><td class=\"m\">~로 유명한, ~로 잘 알려진</td></tr><tr><td class=\"w\">historic</td><td class=\"m\">역사적으로 중요한, 역사적인</td></tr><tr><td class=\"w\">be flooded</td><td class=\"m\">침수되다, 물에 잠기다</td></tr><tr><td class=\"w\">worried</td><td class=\"m\">걱정하는, 염려하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">구하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Save</span> the City on the Water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시를</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 위의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(물 위의 도시를 구하라)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이인 모니카가 독자들에게 친근하게 인사를 건네며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Save (명령문): 동사원형으로 시작하여 상대방에게 행동을 요구하는 2형식 구조의 변형</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hello, friends!</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">안녕, 친구들!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이인 모니카가 독자들에게 친근하게 인사를 건네며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hello, friends! (감탄사): 대화의 시작을 알리는 인사 표현</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 이름은</span><span class=\"en\"><b><span class=\"grammar-hl\">My name is Monica,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Monica이고,</span><span class=\"en\"><b><span class=\"grammar-hl\">and I live in Venice.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 살고 있어</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">내 이름은 Monica이고, 나는 베네치아에서 살고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 건넨 인사에 이어, 글을 쓰는 주체가 누구이며 어떤 장소를 배경으로 하고 있는지 명확히 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My name is Monica, and I live in Venice. (등위접속사): and를 사용하여 두 개의 독립적인 절을 대등하게 연결함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">들어 본 적 있니</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you heard of</span> Venice?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아에 대해</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">베네치아에 대해 들어 본 적 있니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 베니스라는 도시에 대해 알고 있는지 질문을 던져, 다음 문장에서 나올 베니스에 대한 소개로 자연스럽게 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you heard of (관용표현): &#39;hear of&#39;는 &#39;~에 대해 들어보다&#39;라는 의미의 숙어로, 현재완료(have+p.p.) 시제와 결합하여 경험을 묻는 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~야</span><span class=\"en\"><b><span class=\"grammar-hl\">It is</span> a beautiful city</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 도시</span><span class=\"en\"><b>on the water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 위에 있는</span><span class=\"en\"><b>in Italy.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이탈리아의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 이탈리아의 물 위에 있는 아름다운 도시야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 대답으로 베니스의 지리적 위치와 그 도시가 가진 매력적인 특징을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is (기본구조): 주어(It)+동사(is)+보어(a beautiful city)의 2형식 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아는 ~로 유명해</span><span class=\"en\"><b>Venice is <span class=\"grammar-hl\">famous for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 운하와 역사적인 건물들</span><span class=\"en\"><b>its canals and historic buildings.</b></span></div></div><div class=\"lec-sent-ko\">베네치아는 운하와 역사적인 건물들로 유명해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베니스가 왜 매력적인지 구체적인 볼거리를 언급하여, 앞서 말한 &#39;아름다운 도시&#39;라는 수식어를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">famous for (관용표현): &#39;~로 유명한&#39;이라는 의미의 형용사구로, 뒤에 전치사 for의 목적어인 명사구(its canals and historic buildings)가 이어짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">famous for</td><td class=\"m\">~로 유명한, ~로 잘 알려진</td></tr><tr><td class=\"w\">historic</td><td class=\"m\">역사적으로 중요한, 역사적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 여행객들이</span><span class=\"en\"><b>Many tourists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 보러 와</span><span class=\"en\"><b>come <span class=\"grammar-hl\">to see</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b>every year.</b></span></div></div><div class=\"lec-sent-ko\">많은 여행객들이 매년 그것들을 보러 와.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베니스의 명성이 실제 관광객의 방문으로 이어지고 있음을 보여주며, 이 도시가 많은 사람에게 사랑받는 장소임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 동사(come)의 목적이나 결과를 나타내는 부사적 용법으로, 뒤에 목적어(them)를 취하는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런데 지금,</span><span class=\"en\"><b><span class=\"grammar-hl\">But now,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 겪고 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">we have a big problem.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그런데 지금, 우리는 큰 문제를 겪고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평화롭던 베니스의 소개에서 &#39;하지만&#39;이라는 접속사를 사용하여, 지금부터는 도시가 직면한 심각한 위기 상황으로 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">But now, we have a big problem. (기본구조): 주어(we)+타동사(have)+목적어(a big problem)의 3형식 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주에,</span><span class=\"en\"><b>Last week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거리가</span><span class=\"en\"><b>the streets <span class=\"grammar-hl\">were flooded</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침수됐어.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">지난주에, 거리가 침수됐어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;큰 문제&#39;가 구체적으로 무엇인지, 최근에 발생한 침수 피해 사례를 들어 독자가 상황을 실감하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were flooded (수동태): be동사(were)+p.p.(flooded) 구조. flood는 타동사(침수시키다)인데 목적어가 없어서 수동구조 were flooded(침수되었다) 형태로 쓴다. 기본구조: flood+O(목적어)</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 갈 수 없었고</span><span class=\"en\"><b>I <span class=\"grammar-hl\">couldn’t go</span> to school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에</span><span class=\"en\"><b>and my parents’ bakery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리 부모님의 빵집은</span><span class=\"en\"><b><span class=\"grammar-hl\">had to close</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문을 닫아야 했어.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 홍수가 개인의 일상과 가족의 생계에 직접적으로 어떤 영향을 끼쳤는지 구체적인 피해 내용을 나열합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn’t go (조동사): can의 과거형인 could에 not이 결합하여 부정의 의미를 나타냄</div><div class=\"lec-gr-item\">had to close (관용표현): have to+동사원형(해야 한다) 구조로, 주어(bakery)가 닫히게 되는 상황을 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 신어야 했어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">had to wear</span> tall rain boots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴 장화를</span><span class=\"en\"><b>all the time.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄곧</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 줄곧 긴 장화를 신어야 했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 침수된 거리의 상태를 &#39;장화를 신어야 했다&#39;는 경험을 통해 묘사함으로써, 당시의 불편한 상황을 구체적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to wear (관용표현): have to+동사원형(해야 한다) 구조로, wear는 타동사로서 뒤에 목적어(tall rain boots)를 취함</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 ~야</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m really worried.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 걱정</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 정말 걱정이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 피해 경험을 서술한 뒤, 이러한 상황에 대한 글쓴이의 심리 상태를 드러내어 독자의 공감을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m really worried. (현재분사): 형용사적으로 쓰여 주어(I)의 상태를 설명하며, worry라는 감정 동사의 분사 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worried</td><td class=\"m\">걱정하는, 염려하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구가 더 더워질수록</span><span class=\"en\"><b><span class=\"grammar-hl\">The warmer the Earth gets,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아의 수위는 더 상승해.</span><span class=\"en\"><b><span class=\"grammar-hl\">the higher the water in Venice rises.</span></b></span></div></div><div class=\"lec-sent-ko\">지구가 더 더워질수록 베네치아의 수위는 더 상승해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베니스가 침수되는 근본적인 원인을 기후 변화와 연결 지어 설명하며, 환경 문제의 심각성을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The warmer the Earth gets, the higher the water in Venice rises. (도치/관용표현): &#39;The 비교급+S+V, the 비교급+S+V&#39; 구문으로, 원인과 결과를 대비시킴. 문법적으로는 비교급이 강조되어 문두로 도치된 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아는</span><span class=\"en\"><b>Venice <span class=\"grammar-hl\">could be</span> underwater soon.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물에 잠길 수도 있어</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">베네치아는 곧 물에 잠길 수도 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재의 침수 피해가 일시적인 현상에 그치지 않고 도시 전체가 사라질 수 있다는 미래의 위기감을 고조시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could be (조동사): 조동사 could가 be동사와 결합하여 미래의 가능성을 추측함</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나의 도시는</span><span class=\"en\"><b>My city</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요해</span><span class=\"en\"><b><span class=\"grammar-hl\">needs</span> your help!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희들의 도움을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나의 도시는 너희들의 도움이 필요해!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 모든 내용을 바탕으로, 문제를 해결하기 위해 독자들의 관심과 행동을 촉구하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">needs (기본구조): 주어(My city)+타동사(needs)+목적어(your help)의 3형식 구조</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>물의 도시 베니스는 아름다운 운하와 건물로 유명한 이탈리아의 관광지이다.</li><li>최근 심각한 홍수로 인해 거주민들이 일상생활에 큰 어려움을 겪고 있다.</li><li>지구 온난화로 인한 해수면 상승이 도시를 가라앉게 만들 위험에 처해 있다.</li><li>글쓴이는 베니스를 구하기 위한 독자들의 도움과 관심을 호소하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Rising water levels from global warming threaten the historic city of Venice, and its residents are calling for urgent help to address this crisis.</div>\n              <div class=\"lec-final-sum-ko\">지구 온난화로 인한 해수면 상승이 역사적인 도시 베네치아를 위협하고 있으며, 주민들은 이 위기를 해결하기 위한 긴급한 도움을 요청하고 있다.</div></div></div>"],"segs":[[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/1.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/2.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/3.mp3","hl":null},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/7.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/8.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/9.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/11.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/12.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문1_강의_audio/14.mp3","hl":"main"},{"audio"
