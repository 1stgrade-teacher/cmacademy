EuW6V3KVldN2tt31enq303VojuJ5A5A/wBk4HTjpjB4xjA9hTf84/z+FT4JHPrjIxxnPbntxTCgxhd2c5wdo6AHAUcZ5OMc4GBknNHOmrXi9no1vpbbTaytbqLd7NbLVt2elt1putdd/JIhLAZBBP4e38vX6Gmw586LHXzU9/4xx1/Lr+NS7SDyMqQR7Zwck7sYHI/HoDmpII2a4h+VcebHk9c5lT5c9M4GcYPcc4qZVIqEtmnG+iu0nqtHv6O+++xcYqTjrb3opa3vd+Vu6Xl1Vz//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Saving Venice: A City Threatened by Rising Sea Levels<small>베니스 구하기: 해수면 상승으로 위협받는 도시</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 이해하기 위해서는 우선 지구 온난화로 인한 해수면 상승(Sea level rise)이라는 현상에 대해 알 필요가 있어요. 지구의 기온이 올라가면 빙하가 녹고 바닷물의 부피가 팽창하면서, 베네치아처럼 해안가에 위치한 저지대 도시들이 침수될 위험에 처하게 되거든요. 베네치아는 원래 갯벌 위에 나무 말뚝을 박아 세워진 도시라 지반이 매우 약한데, 여기에 물이 차오르는 아쿠아 알타(Acqua alta)라는 정기적인 홍수 현상까지 겹치면서 도시 전체가 큰 위협을 받고 있답니다. 마치 욕조에 물을 계속 틀어놓으면 결국 밖으로 넘쳐흐르는 것과 비슷한 원리라고 생각하면 이해하기 쉬워요. 이러한 환경 변화는 단순히 도시의 경관을 해치는 것을 넘어, 주민들의 일상과 소중한 문화유산을 파괴하는 지구촌 공통의 기후 위기 문제임을 기억하며 글을 읽어보시면 좋겠습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01베네치아 소개</div><ul><li>이탈리아에 위치한 물의 도시 베네치아의 특징을 소개한다.</li><li>운하(canals)와 역사적 건물로 유명한 관광지</li><li>매년 많은 관광객(tourists)이 방문함</li><li>핵심 키워드: 베네치아(Venice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02발생한 문제</div><ul><li>지구 온난화로 인해 베네치아가 침수 피해를 겪고 있다.</li><li>최근 거리 전체가 침수되는 문제 발생</li><li>일상생활 마비: 학교 등교 불가 및 빵집 영업 중단</li><li>핵심 키워드: 침수(flooded)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03근본 원인과 위기</div><ul><li>지구 온난화가 베네치아의 해수면 상승을 가속화하고 있다.</li><li>지구 온도가 올라갈수록 해수면(water)도 상승함</li><li>미래에 도시 전체가 물에 잠길 수 있는 위험(underwater)에 직면</li><li>핵심 키워드: 지구 온난화(global warming)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04도움 요청</div><ul><li>베네치아를 구하기 위해 세상의 관심과 도움이 절실한 상황이다.</li><li>거주민인 모니카의 현실적인 걱정과 불안</li><li>도시를 보호하기 위한 외부의 도움(help) 촉구</li><li>핵심 키워드: 환경 위기(environmental crisis)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hear of</td><td class=\"m\">~에 대해 들어보다, ~의 이름을 들어보다</td></tr><tr><td class=\"w\">be famous for</td><td class=\"m\">~로 유명하다</td></tr><tr><td class=\"w\">historic</td><td class=\"m\">역사적인, 역사상 중요한</td></tr><tr><td class=\"w\">be flooded</td><td class=\"m\">침수되다, 물에 잠기다</td></tr><tr><td class=\"w\">worried</td><td class=\"m\">걱정하는, 불안해하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">구하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Save</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시를</span><span class=\"en\"><b>the City</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 위의</span><span class=\"en\"><b>on the Water</b></span></div></div><div class=\"lec-sent-ko\">(물 위의 도시를 구하라)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이인 모니카가 독자들에게 친근하게 인사를 건네며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Save (명령문): 주어(you)가 생략된 동사원형으로 시작하여 요청이나 명령을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hello,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들!</span><span class=\"en\"><b><span class=\"grammar-hl\">friends!</span></b></span></div></div><div class=\"lec-sent-ko\">안녕, 친구들!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이인 모니카가 독자들에게 친근하게 인사를 건네며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hello, friends! 감탄사 및 호격: 대화의 시작을 알리는 인사말과 청자를 지칭하는 명사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 이름은 Monica이고,</span><span class=\"en\"><b><span class=\"grammar-hl\">My name is Monica,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 베네치아에서 살고 있어.</span><span class=\"en\"><b><span class=\"grammar-hl\">and I live in Venice.</span></b></span></div></div><div class=\"lec-sent-ko\">내 이름은 Monica이고, 나는 베네치아에서 살고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 신분과 거주지를 밝힘으로써, 앞으로 펼쳐질 문제 상황이 자신과 직접적으로 관련되어 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My name is Monica, and I live in Venice. (등위접속사): and를 사용하여 두 개의 독립적인 절을 연결하는 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">들어 본 적 있니</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you heard of</span> Venice?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아에 대해</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">베네치아에 대해 들어 본 적 있니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들의 주의를 환기하고 친숙한 장소로 대화를 이끌어내기 위한 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you heard of (관용표현): hear of(~에 대해 듣다/알고 있다)라는 숙어 표현이 현재완료(have+p.p.) 의문문 형태로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 아름다운 도시야</span><span class=\"en\"><b><span class=\"grammar-hl\">It is a beautiful city</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 위에 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">on the water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이탈리아의</span><span class=\"en\"><b><span class=\"grammar-hl\">in Italy.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 이탈리아의 물 위에 있는 아름다운 도시야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 답변으로서, 베네치아가 가진 지리적 특성과 긍정적인 이미지를 먼저 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is a beautiful city on the water in Italy. 명사구 수식: 전치사구(on the water, in Italy)가 앞의 명사(city)를 뒤에서 수식하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아는 유명해</span><span class=\"en\"><b>Venice is <span class=\"grammar-hl\">famous for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운하와</span><span class=\"en\"><b>its canals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역사적인 건물들로</span><span class=\"en\"><b>and historic buildings.</b></span></div></div><div class=\"lec-sent-ko\">베네치아는 운하와 역사적인 건물들로 유명해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 도시의 대표적인 특징을 열거하여 왜 많은 사람이 이곳을 찾는지 구체적인 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">famous for (관용표현): be famous for(~로 유명하다)는 상태를 나타내는 형용사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">historic</td><td class=\"m\">역사적인, 역사상 중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 여행객들이 와</span><span class=\"en\"><b>Many tourists come</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 보러</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b>every year.</b></span></div></div><div class=\"lec-sent-ko\">많은 여행객들이 매년 그것들을 보러 와.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 명소들이 외부 사람들에게도 인기가 많음을 보여주며 문단의 도입을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법으로 쓰여 앞에 있는 동사(come)의 목적(…하기 위해서)을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런데 지금,</span><span class=\"en\"><b>But now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 큰 문제를 겪고 있어.</span><span class=\"en\"><b><span class=\"grammar-hl\">we have a big problem</span>.</b></span></div></div><div class=\"lec-sent-ko\">그런데 지금, 우리는 큰 문제를 겪고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술한 아름답고 유명한 도시의 모습에서 분위기를 반전시켜, 본격적으로 해결해야 할 과제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we have a big problem (기본구조): 주어(we) + 동사(have) + 목적어(a big problem)로 이루어진 3형식 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주에,</span><span class=\"en\"><b>Last week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거리가 침수됐어.</span><span class=\"en\"><b>the streets <span class=\"grammar-hl\">were flooded</span>.</b></span></div></div><div class=\"lec-sent-ko\">지난주에, 거리가 침수됐어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베네치아가 겪고 있는 문제의 실체를 구체적인 사례를 통해 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were flooded (수동태): be동사(were)+p.p.(flooded) 구조입니다. flood는 타동사인데 목적어가 없어서 수동구조 were flooded 형태로 쓴다. 기본구조: flood + O (A가 B를 침수시키다/범람시키다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 학교에 갈 수 없었고,</span><span class=\"en\"><b>I <span class=\"grammar-hl\">couldn’t go to school</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 부모님의 빵집은 문을 닫아야 했어.</span><span class=\"en\"><b>and my parents’ bakery had to close.</b></span></div></div><div class=\"lec-sent-ko\">나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 침수 피해가 단순히 도로에 그치지 않고, 주민들의 일상생활과 경제 활동까지 마비시켰음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn’t go to school (조동사): 부정형 조동사(could not)와 동사원형(go)이 결합된 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 긴 장화를 신어야 했어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">had to wear</span> tall rain boots</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄곧</span><span class=\"en\"><b>all the time.</b></span></div></div><div class=\"lec-sent-ko\">나는 줄곧 긴 장화를 신어야 했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 거주민으로서 겪는 불편함을 생생하게 전달하여 상황의 심각성을 체감하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to wear (관용표현): have to + 동사원형(~해야 한다)은 의무를 나타내는 숙어 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 정말 걱정이야.</span><span class=\"en\"><b>I’m <span class=\"grammar-hl\">really worried</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 정말 걱정이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 피해 현장을 직접 겪는 당사자로서 느끼는 불안함을 드러내며 독자의 공감을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">really worried (현재분사): 형용사 역할을 하는 과거분사(worried)가 주어의 감정 상태를 설명하는 보어로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worried</td><td class=\"m\">걱정하는, 불안해하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구가 더 더워질수록</span><span class=\"en\"><b><span class=\"grammar-hl\">The warmer the Earth gets,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아의 수위는 더 상승해.</span><span class=\"en\"><b><span class=\"grammar-hl\">the higher the water in Venice rises.</span></b></span></div></div><div class=\"lec-sent-ko\">지구가 더 더워질수록 베네치아의 수위는 더 상승해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지구가 더워지는 환경적 변화와 도시의 침수가 직접적인 인과관계에 있음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The warmer the Earth gets, the higher the water in Venice rises. (관용표현): The + 비교급, the + 비교급(~할수록 더욱 ~하다) 구문으로 비례 관계를 강조합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아는 물에 잠길 수도 있어</span><span class=\"en\"><b>Venice <span class=\"grammar-hl\">could be underwater</span> soon.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">베네치아는 곧 물에 잠길 수도 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재의 침수 문제가 일시적 현상이 아니라 도시 전체가 사라질 수 있는 위기임을 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could be underwater (조동사): 조동사(could)와 be동사가 결합하여 미래의 가능성이나 추측을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나의 도시는</span><span class=\"en\"><b>My city <span class=\"grammar-hl\">needs your help</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희들의 도움이 필요해!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나의 도시는 너희들의 도움이 필요해!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 목적인 도움 요청을 직접적으로 표명하며, 문제 해결을 위해 독자의 관심을 촉구하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">needs your help (기본구조): 주어(My city) + 동사(needs) + 목적어(your help)로 이루어진 3형식 문장입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아름다운 수상 도시 베네치아에 사는 모니카가 도시를 소개한다.</li><li>최근 심각한 침수 피해로 인해 일상생활이 마비되는 어려움을 겪고 있다.</li><li>지구 온난화로 인한 해수면 상승이 도시를 위협하는 심각한 상황이다.</li><li>베네치아를 지키기 위해 사람들의 관심과 도움이 절실하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Rising sea levels due to global warming are flooding Venice, and the city requires urgent attention to prevent it from going underwater.</div>\n              <div class=\"lec-final-sum-ko\">지구 온난화로 인한 해수면 상승이 베니스를 침수시키고 있으며, 도시가 물에 잠기는 것을 막기 위해 즉각적인 관심이 필요하다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"},{"audio":"./1_audio/23.mp3","hl":"grammar"}],[{"audio":"./1_audio/24.mp3","hl":"main"},{"audio":"./1_audio/25.mp3","hl":"meaning"},{"audio":"./1_audio/26.mp3","hl":"grammar"}],[{"audio":"./1_audio/27.mp3","hl":"main"},{"audio":"./1_audio/28.mp3","hl":"meaning"},{"audio":"./1_audio/29.mp3","hl":"grammar"}],[{"audio":"./1_audio/30.mp3","hl":"main"},{"audio":"./1_audio/31.mp3","hl":"meaning"},{"audio":"./1_audio/32.mp3","hl":"grammar"}],[{"audio":"./1_audio/33.mp3","hl":"main"},{"audio":"./
