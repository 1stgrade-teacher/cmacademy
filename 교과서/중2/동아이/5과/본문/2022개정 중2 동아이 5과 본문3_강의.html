 class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여름철 홍수와 베니스에 대한 관심</div><ul><li>한국의 여름철 홍수 경험을 통해 베니스의 홍수 상황에 공감하며 이야기를 시작한다.</li><li>한국의 여름철 홍수(floods) 경험</li><li>사진으로 접한 아름답지만 위태로운 베니스의 모습</li><li>핵심 키워드: 홍수(floods), 베니스(Venice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02환경 보호를 위한 3R 캠페인 시작</div><ul><li>베니스를 돕기 위해 학교 친구들과 함께 구체적인 환경 운동을 시작한다.</li><li>베니스를 돕기 위한 공감대 형성</li><li>3R 캠페인(Recycle, Reuse, Reduce)의 도입</li><li>핵심 키워드: 3R 캠페인(3R campaign), 재활용(Recycle), 재사용(Reuse), 줄이기(Reduce)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천과 희망의 메시지</div><ul><li>개인의 작은 실천이 모여 긍정적인 변화를 만들 수 있음을 강조한다.</li><li>학교 학생들의 일상적인 캠페인 참여</li><li>베니스를 위한 개인의 책임과 역할</li><li>환경 개선을 위한 공동의 노력(make a difference)</li><li>핵심 키워드: 실천(doing our part), 변화(make a difference)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flood</td><td class=\"m\">홍수, 침수</td></tr><tr><td class=\"w\">situation</td><td class=\"m\">상황, 사태</td></tr><tr><td class=\"w\">do one&#39;s part</td><td class=\"m\">제 역할을 하다, 본분을 다하다</td></tr><tr><td class=\"w\">make a difference</td><td class=\"m\">변화를 가져오다, 영향을 주다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕,</span><span class=\"en\"><b>Hello,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 수인이야</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Suin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국에서 온</span><span class=\"en\"><b>from Korea.</b></span></div></div><div class=\"lec-sent-ko\">안녕, 나는 한국의 수인이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 수신자인 베네치아 친구들에게 자신의 정체를 밝히고 친근감을 형성하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Suin (주격보어): I(주어) + am(동사) + Suin(보어)의 2형식 구조로, 주어의 신분을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매년 여름에,</span><span class=\"en\"><b>Every summer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비가 많이 와</span><span class=\"en\"><b><span class=\"grammar-hl\">it rains</span> a lot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기는</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">매년 여름에 여기는 비가 많이 와.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 소개한 한국의 환경적 특성을 언급하며, 뒤에 나올 &#39;홍수&#39;라는 공통적인 문제 상황을 꺼내기 위한 배경 설명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it rains 비인칭 주어: 날씨를 나타내는 문장에서 주어 it은 특별한 의미 없이 형식적인 주어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로,</span><span class=\"en\"><b>Sometimes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 홍수를 겪어</span><span class=\"en\"><b>we have floods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 정말 무서워</span><span class=\"en\"><b>and <span class=\"grammar-hl\">they are really scary</span>.</b></span></div></div><div class=\"lec-sent-ko\">때때로, 우리는 홍수를 겪고 그것들은 정말 무서워.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국에서도 홍수가 발생함을 알리며, 베네치아의 홍수 피해에 공감할 수 있는 정서적 토대를 마련하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">they are really scary (현재분사): scary가 보어로 쓰여 floods(홍수)의 상태를 설명합니다. 여기서 scary는 홍수가 유발하는 &#39;두려운&#39; 상태를 나타내는 형용사적 의미로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flood</td><td class=\"m\">홍수, 침수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">베네치아의 상황은</span><span class=\"en\"><b>The situation in Venice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무서울 게 틀림없어,</span><span class=\"en\"><b><span class=\"grammar-hl\">must be</span> scary,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">베네치아의 상황도 무서울 게 틀림없어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 자신이 겪은 홍수의 공포를 베네치아의 상황에 투영하여, 상대방이 처한 어려움을 깊이 이해하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must be (조동사): must는 강한 추측을 나타내며, be동사와 결합하여 상황이 어떠할 것임을 표현합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">situation</td><td class=\"m\">상황, 사태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 가 본 적이 없어</span><span class=\"en\"><b>I’ve never been</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아에,</span><span class=\"en\"><b>to Venice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 본 적이 있어</span><span class=\"en\"><b>but I <span class=\"grammar-hl\">have seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 많은 아름다운 사진들을</span><span class=\"en\"><b>many beautiful pictures of it.</b></span></div></div><div class=\"lec-sent-ko\">나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 직접 가보지는 못했어도 베네치아라는 도시에 대해 평소 관심과 애정을 가지고 있었음을 드러내어 이어질 도움의 행동에 진정성을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have seen (현재완료): have + p.p. 구조로, 과거부터 현재까지의 경험을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 내 친구들에게 이야기했어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">talked to my friends</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">홍수에 관하여</span><span class=\"en\"><b>about the floods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희 도시의</span><span class=\"en\"><b>in your city.</b></span></div></div><div class=\"lec-sent-ko\">나는 너희 도시의 홍수에 관해 친구들과 이야기했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 공감을 넘어, 문제 해결을 위해 주변 사람들과 소통하며 연대하는 행동으로 나아가는 과정입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked to my friends (관용표현): talk to는 &#39;~와 이야기하다&#39;라는 의미의 자동사+전치사 관용구로, 뒤에 대화의 대상이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flood</td><td class=\"m\">홍수, 침수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 베네치아를 돕고 싶었어,</span><span class=\"en\"><b>We <span class=\"grammar-hl\">wanted to help</span> Venice,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 우리는 시작했어</span><span class=\"en\"><b>so we started</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3R 캠페인을</span><span class=\"en\"><b>the 3R campaign.</b></span></div></div><div class=\"lec-sent-ko\">우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친구들과 함께 나눈 고민이 구체적인 실천 방안인 &#39;3R 캠페인&#39;으로 발전했음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wanted to help (to부정사): want는 목적어로 to부정사를 취하는 동사로, help(돕다)가 to부정사(to help) 형태로 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">3R은 ~이야</span><span class=\"en\"><b><span class=\"grammar-hl\">The 3Rs are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용하기, 재사용하기, 그리고 줄이기</span><span class=\"en\"><b><span class=\"grammar-hl\">Recycle, Reuse, and Reduce</span>.</b></span></div></div><div class=\"lec-sent-ko\">3R은 ‘재활용하다’, ‘재사용하다’, 그리고 ‘줄이다’야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3R 캠페인의 구체적인 활동 내용을 나열하여, 독자가 캠페인의 핵심 의도를 정확히 파악하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The 3Rs are Recycle, Reuse, and Reduce (주격보어): 주어(The 3Rs)와 보어(Recycle, Reuse, and Reduce)가 동등한 관계를 나타내는 2형식 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지금,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 학교의 많은 학생들이</span><span class=\"en\"><b>many students at my school</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 세 가지를 하고 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">are doing</span> these three things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day.</b></span></div></div><div class=\"lec-sent-ko\">지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠페인이 소수의 제안에서 그치지 않고, 학교 전체의 일상적인 참여로 확장되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are doing (현재진행): be동사(are) + -ing(doing) 구조로, 현재 학생들이 이 활동을 수행하고 있는 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 중요해</span><span class=\"en\"><b><span class=\"grammar-hl\">It is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 역할을 하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> our part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베네치아를 위해</span><span class=\"en\"><b>for Venice.</b></span></div></div><div class=\"lec-sent-ko\">베네치아를 위해 우리의 역할을 하는 것이 중요해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호라는 작은 실천이 지구 반대편의 문제를 해결하는 데 기여할 수 있다는 가치관을 강조하는 결론부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is important to do (가주어): 진주어: It이 가주어로 쓰였고, to do our part for Venice가 진주어로 문장의 진짜 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">함께,</span><span class=\"en\"><b>Together,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 변화를 만들 수 있어!</span><span class=\"en\"><b>we can <span class=\"grammar-hl\">make a difference</span>!</b></span></div></div><div class=\"lec-sent-ko\">함께, 우리는 변화를 만들 수 있어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인의 실천이 모여 긍정적인 결과를 가져올 수 있다는 희망적인 메시지를 전달하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make a difference (관용표현): &#39;차이를 만들다&#39; 즉, &#39;중요한 변화를 일으키다/영향을 미치다&#39;라는 뜻의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make a difference</td><td class=\"m\">변화를 가져오다, 영향을 주다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한국에 사는 수인이 베네치아의 홍수 소식을 듣고 안타까움을 느낍니다.</li><li>홍수라는 공통의 문제에 공감하며, 수인과 친구들은 3R 캠페인을 시작합니다.</li><li>학생들은 재활용, 재사용, 줄이기를 일상에서 실천하며 베네치아를 돕고자 합니다.</li><li>작은 실천이 모이면 큰 변화를 만들 수 있다는 믿음으로 서로를 응원합니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students launched the 3R campaign to combat flooding, and they are actively practicing these habits to make a positive impact on the environment.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 홍수 문제에 대응하기 위해 3R 캠페인을 시작했으며, 환경에 긍정적인 영향을 미치기 위해 이러한 습관을 적극적으로 실천하고 있다.</div></div></div>"],"segs":[[{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/1.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/2.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/3.mp3","hl":null},{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/7.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문3_강의_audio/8.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문
