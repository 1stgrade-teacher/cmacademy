없애고 소와 같은 가축이 배출하는 메탄(Methane) 가스를 발생시키는데, 이는 이산화탄소보다 훨씬 강력하게 지구의 열을 가두는 온실가스(Greenhouse Gases)의 주범이 된답니다. 마치 두꺼운 이불을 여러 겹 덮고 있는 것처럼, 이러한 가스들이 지구의 온도를 높이는 온실 효과(Greenhouse Effect)를 일으켜 기후 위기를 가속화하는 것이죠. 우리가 고기 섭취를 줄이는 것만으로도 거대한 숲을 보호하고 가축 사육을 줄여 지구를 식힐 수 있다는 식습관의 변화가 환경 보호에 미치는 영향을 생각해보며 글을 읽어보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 공유와 공감</div><ul><li>티모시가 과거 베네치아 여행의 추억을 회상하며 환경 문제에 대해 공감을 표한다.</li><li>베네치아 방문 경험(visited Venice)과 좋은 기억</li><li>환경을 돕고 싶다는 자발적인 의지(want to help) 피력</li><li>핵심 키워드: 환경 보호(environmental protection)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02육류 소비와 환경의 연관성</div><ul><li>육류를 많이 소비할수록 지구가 더 뜨거워진다는 사실을 지적한다.</li><li>축산업을 위한 무분별한 벌목(trees are cut down)</li><li>벌목으로 인한 온실가스(greenhouse gases) 증가</li><li>핵심 키워드: 육류 소비(meat consumption)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가축과 온실가스 배출</div><ul><li>소와 같은 가축이 배출하는 가스가 지구 온난화를 심화시키는 주범임을 설명한다.</li><li>가축의 가스 배출이 온실가스 농도를 높임</li><li>가스가 지구를 뜨겁게 만드는 원인이 됨</li><li>핵심 키워드: 온실가스(greenhouse gases)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실천과 다짐</div><ul><li>지구 온난화를 늦추기 위해 식습관을 바꾸려는 노력을 다짐한다.</li><li>고기 섭취를 줄여 지구 온난화(global warming)를 완화함</li><li>식습관 변화의 어려움 인정과 꾸준한 노력</li><li>핵심 키워드: 식습관(eating habits)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">do one&#39;s part</td><td class=\"m\">자기 역할을 하다, 본분을 다하다</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">~을 알아내다, ~을 발견하다</td></tr><tr><td class=\"w\">cut down</td><td class=\"m\">~을 베어 넘어뜨리다, ~을 줄이다</td></tr><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr><tr><td class=\"w\">global warming</td><td class=\"m\">지구 온난화</td></tr><tr><td class=\"w\">do one&#39;s best</td><td class=\"m\">최선을 다하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕, Monica!</span><span class=\"en\"><b><span class=\"grammar-hl\">Hi,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">Monica!</span></b></span></div></div><div class=\"lec-sent-ko\">안녕, Monica!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 편지를 시작하며 발신자가 누구인지 밝히고 상대방과 인사를 나누는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hi, Monica! (관용표현): 상대방의 이름을 부르며 인사를 건네는 관용적 대화 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 Timothy야</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Timothy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국에서 온</span><span class=\"en\"><b><span class=\"grammar-hl\">from the United States.</span></b></span></div></div><div class=\"lec-sent-ko\">나는 미국의 Timothy야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 편지를 시작하며 발신자가 누구인지 밝히고 상대방과 인사를 나누는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Timothy from the United States. (관용표현): 출신지나 소속을 밝힐 때 전치사 from을 사용하여 명사구(the United States)와 결합하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 가족은 베네치아를 방문했다</span><span class=\"en\"><b><span class=\"grammar-hl\">My family visited Venice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3년 전에</span><span class=\"en\"><b><span class=\"grammar-hl\">three years ago</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 그것을 아주 좋아했다</span><span class=\"en\"><b>and we loved it!</b></span></div></div><div class=\"lec-sent-ko\">우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베네치아라는 도시에 대한 좋은 기억을 공유함으로써 모니카와 유대감을 형성하고, 뒤이어 나올 도시를 돕고 싶다는 말의 동기를 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My family visited Venice three years ago (관용표현): ago는 과거의 특정 시점(three years)을 나타내는 부사구로, 과거시제 동사(visited)와 함께 사용합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 놀랐고 슬프다</span><span class=\"en\"><b>I am surprised and sad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 소식을 들으니</span><span class=\"en\"><b><span class=\"grammar-hl\">to hear your news</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 네 소식을 듣고 놀랐고 슬퍼.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 긍정적인 기억과 대조적으로, 현재 베네치아가 처한 어려운 상황에 대해 안타까움을 표현하며 대화의 주제를 환경 문제로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to hear your news (to부정사): 감정의 원인을 나타내는 부사적 용법으로, 앞에 위치한 감정 형용사(surprised and sad)가 발생한 이유를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 나의 역할을 하고 싶다</span><span class=\"en\"><b>I want <span class=\"grammar-hl\">to do my part</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 도시와 지구를 돕기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to help your city and the Earth</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신이 얻은 환경 관련 정보를 통해 지구와 모니카의 도시를 돕겠다는 구체적인 의지를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to do my part (to부정사): 목적을 나타내는 부사적 용법으로, 주어의 의도(~하기 위해)를 설명합니다.</div><div class=\"lec-gr-item\">to help your city and the Earth (to부정사): 앞의 목적(~하기 위해)을 보충 설명하는 형용사적 용법으로, &#39;나의 역할(part)&#39;을 구체화합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 최근에 알게 되었다</span><span class=\"en\"><b>I recently found out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">something interesting</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 최근에 재미있는 것을 알게 됐어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 문제와 육식 사이의 관계를 설명하기 위한 도입으로, 독자의 주의를 환기하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something interesting (현재분사): interesting이 something(대명사)을 뒤에서 수식하는 형용사적 기능으로, &#39;흥미를 유발하는 어떤 것&#39;이라는 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 더 많은 고기를 먹을수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">The more meat we eat,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 행성은 더 뜨거워진다</span><span class=\"en\"><b><span class=\"grammar-hl\">the hotter our planet gets.</span></b></span></div></div><div class=\"lec-sent-ko\">우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 예고한 &#39;흥미로운 사실&#39;을 제시하며, 육식과 지구 온난화 사이의 직접적인 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more meat we eat, the hotter our planet gets. (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로, 원인과 결과의 비례적 관계를 나타내는 강조구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 많은 나무들이 베어지기 때문이다</span><span class=\"en\"><b>This is because lots of trees <span class=\"grammar-hl\">are cut down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물 농장을 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to make animal farms</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 육식이 지구를 뜨겁게 만드는지 그 구체적인 원인 중 하나인 삼림 파괴 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are cut down (수동태): be동사(are)+p.p.(cut down) 구조. cut은 타동사인데 목적어가 없어서 수동구조 are cut down 형태로 쓴다. 기본구조: cut O down (O를 베어내다/줄이다).</div><div class=\"lec-gr-item\">to make animal farms (to부정사): 목적(~하기 위해서)을 나타내는 부사적 용법으로, 나무가 베어지는 이유를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut down</td><td class=\"m\">~을 베어 넘어뜨리다, ~을 줄이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">This increases greenhouse gases.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증가시켜</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">온실가스를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이것은 온실가스를 증가시켜.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나무가 사라지면서 발생하는 결과로, 지구 온난화를 심화시키는 환경적 요인을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This increases greenhouse gases. 5형식(SVOC) 구조와 유사한 일반적인 주어+동사+목적어의 3형식 문장 구조로, 행위의 대상(greenhouse gases)을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소들은 많은 가스를 배출한다</span><span class=\"en\"><b><span class=\"grammar-hl\">cows pass a lot of gas.</span></b></span></div></div><div class=\"lec-sent-ko\">또한, 소는 많은 가스를 배출해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 온실가스 증가의 또 다른 원인으로 가축인 소가 배출하는 가스를 지목하며 독자가 이해하기 쉽게 구체적인 예를 듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cows pass a lot of gas. (관용표현): &#39;많은 양의&#39;라는 의미로 명사(gas)를 수식하는 수량 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고약한 냄새!</span><span class=\"en\"><b><span class=\"grammar-hl\">Smelly!</span></b></span></div></div><div class=\"lec-sent-ko\">고약한 냄새가 나!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;소의 방귀&#39;라는 내용을 재치 있게 받아치며 대화의 분위기를 유연하게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Smelly! (관용표현): 문장에서 주어와 동사를 생략하고 형용사만 사용하여 감정을 강조하는 구어체 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이것이 최악인 부분은 아니다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">this is not the worst part.</span></b></span></div></div><div class=\"lec-sent-ko\">그런데 이것이 최악인 부분은 아니야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소의 배설 가스가 환경에 미치는 영향이 생각보다 심각하다는 점을 강조하며 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">this is not the worst part. (관용표현): 최상급(the worst)을 사용하여 상황의 정도를 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소에게서 나온 가스는</span><span class=\"en\"><b>The gas from cows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 온실가스를 더한다</span><span class=\"en\"><b>also <span class=\"grammar-hl\">adds to greenhouse gases.</span></b></span></div></div><div class=\"lec-sent-ko\">소에게서 나온 가스는 또한 온실가스에 추가돼.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 소의 방귀가 단순히 냄새나는 현상을 넘어 실질적인 환경 파괴 요소임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">adds to greenhouse gases. (관용표현): &#39;add to 명사&#39; 구조로, &#39;~에 더하다/증가시키다&#39;라는 의미를 가진 구동사 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">온실가스는</span><span class=\"en\"><b>Greenhouse gases</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 만들어</span><span class=\"en\"><b><span class=\"grammar-hl\">make the Earth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 뜨겁게</span><span class=\"en\"><b><span class=\"grammar-hl\">hotter.</span></b></span></div></div><div class=\"lec-sent-ko\">온실가스는 지구를 더 뜨겁게 만들어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 언급한 여러 요인들이 최종적으로 지구 온난화라는 결과로 이어짐을 요약하여 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make the Earth hotter. 5형식(SVOC) 구조: make(사역동사)+O(the Earth)+C(hotter/형용사보어). 목적어가 어떤 상태(더 뜨거운)가 되도록 만드는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 고기를 덜 먹으려고 노력하고 있다</span><span class=\"en\"><b>I’m trying <span class=\"grammar-hl\">to eat less meat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구 온난화를 늦추기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to slow down global warming</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 원인과 결과를 파악한 후, 자신이 직접 실천할 수 있는 행동을 대안으로 제시하는 결론부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to eat less meat (to부정사): 목적(~하기 위해)을 나타내는 부사적 용법으로, 주어의 노력을 설명합니다.</div><div class=\"lec-gr-item\">to slow down global warming (to부정사): 앞의 목적(~하기 위해)을 보충 설명하는 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global warming</td><td class=\"m\">지구 온난화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 쉽지 않다</span><span class=\"en\"><b><span class=\"grammar-hl\">It isn’t easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 식습관을 바꾸는 것은,</span><span class=\"en\"><b><span class=\"grammar-hl\">to change my eating habits</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 최선을 다하고 있다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">I’m doing my best.</span></b></span></div></div><div class=\"lec-sent-ko\">나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 습관을 바꾸는 것이 어렵다는 현실적인 고충을 인정하면서도, 끝까지 포기하지 않겠다는 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It isn’t easy to change my eating habits (가주어): 진주어: It이 가주어 역할을 하고, 뒤의 to change my eating habits가 진주어 역할을 하여 문장의 핵심 의미를 전달합니다.</div><div class=\"lec-gr-item\">eating habits (동명사(명사적)): &#39;먹는 것&#39;이라는 행위/용도를 나타내며, 뒤의 명사(habits)를 수식하여 &#39;식습관&#39;이라는 복합 명사적 개념을 만듭니다.</div><div class=\"lec-gr-item\">I’m doing my best. (관용표현): &#39;do one&#39;s best&#39;는 &#39;최선을 다하다&#39;라는 관용적 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>티모시는 베네치아의 어려운 소식을 듣고 안타까워하며 환경 보호에 관심을 갖게 된다.</li><li>육식은 가축 농장을 위한 삼림 파괴와 소의 가스 배출을 통해 온실가스를 늘린다.</li><li>온실가스는 지구 온난화의 주범이 된다.</li><li>티모시는 지구 온난화를 막기 위해 육식을 줄이는 실천을 시작한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Increased meat consumption leads to higher greenhouse gas emissions through deforestation and livestock farming, so eating less meat helps slow down global warming.</div>\n              <div class=\"lec-final-sum-ko\">육류 소비의 증가는 삼림 벌채와 축산업을 통해 온실가스 배출을 증가시키므로, 육류 섭취를 줄이는 것은 지구 온난화의 속도를 늦추는 데 도움이 된다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"
