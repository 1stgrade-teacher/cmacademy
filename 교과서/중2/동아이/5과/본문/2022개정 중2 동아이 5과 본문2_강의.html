g Meat Consumption to Combat Global Warming<small>지구 온난화를 막기 위한 육류 소비 줄이기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 기후 위기의 주요 원인인 온실효과(Greenhouse Effect)에 대해 알아두면 이해가 훨씬 빨라요. 온실효과란 마치 지구가 두꺼운 담요를 덮은 것처럼 열이 밖으로 나가지 못해 온도가 높아지는 현상을 말하는데, 특히 우리가 먹는 고기를 생산하는 과정에서 발생하는 메탄(Methane) 같은 가스들이 이 담요를 더 두껍게 만든답니다. 또한, 가축을 기를 넓은 땅을 마련하기 위해 숲을 없애는 산림 벌채(Deforestation)가 진행되면, 탄소를 흡수해 줄 지구의 허파가 사라져 지구 온난화(Global Warming)를 더욱 가속화하게 되죠. 즉, 우리가 무심코 먹는 식단이 환경에 직접적인 영향을 미치는 만큼, 육류 소비를 줄이는 것이 지구의 열을 식히는 실천적인 방법이 될 수 있다는 점을 기억하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01베니스 방문 경험과 공감</div><ul><li>티모시가 과거 베니스 방문을 추억하며 현지의 환경 위기에 대해 깊은 공감을 표함.</li><li>3년 전 베니스를 방문했던 좋은 기억 공유</li><li>도시에 닥친 위기 소식에 놀람과 슬픔을 표현</li><li>핵심 키워드: 베니스(Venice), 공감(Empathy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02육식과 지구 온난화의 관계</div><ul><li>육류 소비가 증가할수록 지구가 뜨거워지는 구체적인 환경적 원인을 분석함.</li><li>축산 농장 조성을 위한 무분별한 벌목(deforestation)</li><li>온실가스(greenhouse gases) 배출량의 증가</li><li>핵심 키워드: 지구 온난화(Global warming), 온실가스(Greenhouse gases)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03소와 온실가스의 연관성</div><ul><li>소의 생리 현상조차 지구 기온 상승에 영향을 미친다는 사실을 지적함.</li><li>소의 가스 배출로 인한 환경 영향</li><li>가스가 대기 중에 머물며 지구를 뜨겁게 만듦</li><li>핵심 키워드: 소(Cows), 가스 배출(Gas emissions)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실천 다짐과 노력</div><ul><li>지구 온난화를 늦추기 위해 식습관을 개선하려는 개인적인 노력을 다짐함.</li><li>육류 섭취를 줄여 기후 변화에 대응하려는 노력</li><li>쉽지 않은 변화지만 최선을 다하겠다는 의지</li><li>핵심 키워드: 식습관(Eating habits), 변화(Change)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">do one&#39;s part</td><td class=\"m\">자기 역할을 하다, 자신의 몫을 다하다</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 발견하다</td></tr><tr><td class=\"w\">cut down</td><td class=\"m\">베어 쓰러뜨리다, 줄이다</td></tr><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr><tr><td class=\"w\">global warming</td><td class=\"m\">지구 온난화</td></tr><tr><td class=\"w\">do one&#39;s best</td><td class=\"m\">최선을 다하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕, Monica!</span><span class=\"en\"><b><span class=\"grammar-hl\">Hi,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">Monica!</span></b></span></div></div><div class=\"lec-sent-ko\">안녕, Monica!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 수신인에게 자신의 이름과 출신을 밝히며 대화를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hi, Monica! (관용표현): 인사말로 상대방의 이름을 불러 대화를 시작하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 Timothy야</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Timothy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국에서 온</span><span class=\"en\"><b><span class=\"grammar-hl\">from the United States.</span></b></span></div></div><div class=\"lec-sent-ko\">나는 미국의 Timothy야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 수신인에게 자신의 이름과 출신을 밝히며 대화를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Timothy from the United States. (be동사): 주어(I)의 상태나 정체(Timothy)를 연결하는 연결동사(linking verb) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 가족은 3년 전에 베네치아를 방문했다</span><span class=\"en\"><b>My family <span class=\"grammar-hl\">visited</span> Venice three years ago</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 그곳을 아주 좋아했다</span><span class=\"en\"><b>and we loved it!</b></span></div></div><div class=\"lec-sent-ko\">우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 베네치아와 맺은 긍정적인 과거의 인연을 언급함으로써, 뒤이어 나올 도시의 위기에 대한 안타까움을 강조하는 밑바탕이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">visited (과거시제): 과거 특정 시점(three years ago)에 일어난 일을 서술하는 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 놀랍고 슬프다</span><span class=\"en\"><b>I am <span class=\"grammar-hl\">surprised</span> and sad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 소식을 들으니</span><span class=\"en\"><b><span class=\"grammar-hl\">to hear</span> your news.</b></span></div></div><div class=\"lec-sent-ko\">나는 네 소식을 듣고 놀랐고 슬퍼.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 긍정적인 기억과 대비되는 부정적인 소식을 접한 필자의 감정을 드러내며, 문제 상황에 대한 공감을 표하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">surprised (과거분사): 주어(I)의 감정 상태를 설명하는 형용사적 보어입니다.</div><div class=\"lec-gr-item\">to hear (to부정사): 감정을 나타내는 형용사(surprised, sad) 뒤에서 그 감정의 원인을 나타내는 부사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 내 역할을 하고 싶다</span><span class=\"en\"><b>I want <span class=\"grammar-hl\">to do</span> my part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 도시와 지구를 돕기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to help</span> your city and the Earth.</b></span></div></div><div class=\"lec-sent-ko\">나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 감정에서 나아가, 문제 해결을 위해 자신이 직접 행동에 나서겠다는 필자의 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to do (to부정사): 앞의 동사 want의 목적어 역할을 하는 명사적 용법입니다.</div><div class=\"lec-gr-item\">to help (to부정사): 자신의 역할(my part)이 무엇인지 구체적으로 설명하는 형용사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 최근에 알게 되었다</span><span class=\"en\"><b>I recently found out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 무언가를</span><span class=\"en\"><b><span class=\"grammar-hl\">something interesting</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 최근에 재미있는 것을 알게 됐어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 육식과 지구 온난화 사이의 관계를 제시하기 전에 독자의 주의를 환기하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something interesting (현재분사): interesting이 something(명사)을 뒤에서 수식하는 구조입니다. something이 흥미를 불러일으키는(능동적 상태) 동작을 나타내므로 현재분사를 사용했습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 고기를 더 많이 먹을수록,</span><span class=\"en\"><b><span class=\"grammar-hl\">The more meat we eat,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 행성은 더 뜨거워진다</span><span class=\"en\"><b><span class=\"grammar-hl\">the hotter our planet gets.</span></b></span></div></div><div class=\"lec-sent-ko\">우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고기 소비와 지구 온난화가 정비례한다는 글의 핵심 논제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more meat we eat, the hotter our planet gets. (관용표현): 더 비교급 A, 더 비교급 B 구조입니다. &#39;~할수록 더 ~하다&#39;라는 비례의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 ~하기 때문이다</span><span class=\"en\"><b>This is because</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 나무들이 베어진다</span><span class=\"en\"><b>lots of trees <span class=\"grammar-hl\">are cut down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물 농장을 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> animal farms.</b></span></div></div><div class=\"lec-sent-ko\">이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 육식이 지구 온난화를 유발하는 첫 번째 구체적인 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are cut down (수동태): be동사(are)+p.p.(cut down) 구조입니다. cut down(베어내다)은 타동사인데 목적어가 없어서 수동구조 are cut down 형태로 씁니다. 기본구조: cut down O(목적어).</div><div class=\"lec-gr-item\">to make (to부정사): 목적(농장을 만들기 위해서)을 나타내는 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut down</td><td class=\"m\">베어 쓰러뜨리다, 줄이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 온실가스를 증가시킨다.</span><span class=\"en\"><b><span class=\"grammar-hl\">This increases greenhouse gases.</span></b></span></div></div><div class=\"lec-sent-ko\">이것은 온실가스를 증가시켜.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나무가 사라지면서 발생하는 결과로서 온실가스 농도가 높아지는 현상을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This increases greenhouse gases. (3형식): 주어(This) + 동사(increases) + 목적어(greenhouse gases) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소는 많은 가스를 배출한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">cows pass</span> a lot of gas.</b></span></div></div><div class=\"lec-sent-ko\">또한, 소는 많은 가스를 배출해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 육식과 관련된 또 다른 온난화의 원인을 제시하며 이야기를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cows pass (현재시제): 일반적인 사실이나 습관을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고약한 냄새!</span><span class=\"en\"><b><span class=\"grammar-hl\">Smelly!</span></b></span></div></div><div class=\"lec-sent-ko\">고약한 냄새가 나!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소의 생리 현상에 대한 필자의 사적인 감상을 덧붙여 글의 분위기를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Smelly! (관용표현): 형용사만 사용하여 감탄이나 상태를 강하게 표현하는 생략 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이것이 최악인 부분은 아니다.</span><span class=\"en\"><b>But this is not the <span class=\"grammar-hl\">worst</span> part.</b></span></div></div><div class=\"lec-sent-ko\">그런데 이것이 최악인 부분은 아니야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 소의 방귀보다 더 심각한 문제가 있음을 암시하며 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">worst (최상급): 세 개 이상의 대상 중 가장 정도가 심함을 나타내는 형용사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소에게서 나오는 가스는</span><span class=\"en\"><b><span class=\"grammar-hl\">The gas from cows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 온실가스에 더해진다.</span><span class=\"en\"><b>also adds to greenhouse gases.</b></span></div></div><div class=\"lec-sent-ko\">소에게서 나온 가스는 또한 온실가스에 추가돼.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소의 방귀가 단순히 냄새나는 현상을 넘어 실질적으로 환경을 오염시키는 온실가스임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The gas from cows (전치사구): from cows가 주어(The gas)를 수식하는 형용사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">온실가스는 지구를 더 뜨겁게 만든다.</span><span class=\"en\"><b>Greenhouse gases <span class=\"grammar-hl\">make</span> the Earth hotter.</b></span></div></div><div class=\"lec-sent-ko\">온실가스는 지구를 더 뜨겁게 만들어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장들에서 언급된 온실가스의 작용을 정리하여 지구 온난화의 인과관계를 다시 한번 확정 짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make (5형식(SVOC)): make + O(the Earth) + C(hotter) 구조입니다. 목적어인 지구의 상태를 목적격 보어(더 뜨겁게)로 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenhouse gas</td><td class=\"m\">온실가스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 고기를 덜 먹으려고 노력하고 있다</span><span class=\"en\"><b>I’m trying <span class=\"grammar-hl\">to eat</span> less meat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구 온난화를 늦추기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to slow down</span> global warming.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 밝혀낸 과학적 사실을 바탕으로 필자가 실천하고 있는 구체적인 해결 방안입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to eat (to부정사): 앞의 동사 try의 목적어 역할을 하는 명사적 용법입니다.</div><div class=\"lec-gr-item\">to slow down (to부정사): &#39;~하기 위해서&#39;라는 목적을 나타내는 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global warming</td><td class=\"m\">지구 온난화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 쉽지 않다</span><span class=\"en\"><b><span class=\"grammar-hl\">It isn’t easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 식습관을 바꾸는 것은,</span><span class=\"en\"><b><span class=\"grammar-hl\">to change my eating habits</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 최선을 다하고 있다.</span><span class=\"en\"><b>but I’m doing my best.</b></span></div></div><div class=\"lec-sent-ko\">나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 변화의 어려움을 인정하면서도, 문제 해결을 위해 지속적인 노력을 기울이겠다는 필자의 다짐으로 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It isn’t easy to change my eating habits (가주어): 진주어: It이 가주어이고, to change my eating habits가 진주어입니다. 문장의 주어가 길어서 문장 뒤로 보낸 구조입니다.</div><div class=\"lec-gr-item\">eating habits (동명사(명사적)): eating(먹기/식사)이 습관(habits)의 용도를 나타내며 명사처럼 쓰인 동명사입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>필자는 베네치아의 소식을 듣고 지구 환경 보호를 위해 육식을 줄이기로 마음먹었다.</li><li>고기를 많이 먹으면 농장 조성을 위한 벌목과 가축의 가스로 인해 온실가스가 늘어난다.</li><li>이는 곧 지구 온난화라는 결과로 이어진다.</li><li>필자는 이러한 문제를 인식하고 식습관을 바꾸기 위해 노력 중이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Animal farming contributes to global warming through deforestation and greenhouse gas emissions, so reducing meat consumption is an effective way to protect the planet.</div>\n              <div class=\"lec-final-sum-ko\">축산업은 삼림 파괴와 온실가스 배출을 통해 지구 온난화에 기여하므로, 육류 소비를 줄이는 것은 지구를 보호하는 효과적인 방법이다.</div></div></div>"],"segs":[[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/1.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/2.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/3.mp3","hl":null},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/8.mp3","hl":null}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/9.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/10.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/12.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/13.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/15.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/16.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/18.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/19.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/21.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/22.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/24.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/25.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/27.mp3","hl":"main"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/28.mp3","hl":"meaning"},{"audio":"./2022개정 중2 동아이 5과 본문2_강의_audio/29.mp3","
