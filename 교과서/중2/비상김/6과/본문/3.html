(angle)</li><li>돌의 모양(shape of the stone)이 중요함</li><li>핵심 키워드: 가라앉다(sink), 각도(angle)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실전 적용 및 선택</div><ul><li>아빠의 조언에 따라 아들이 직접 적합한 돌과 던질 각도를 결정함.</li><li>납작한 돌(flat stone)을 골라냄</li><li>약 20도의 각도(angle of 20 degrees)로 설정함</li><li>핵심 키워드: 선택(choose), 칭찬(Great choice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04즐거운 오후 시간</div><ul><li>선택한 방식대로 물수제비를 뜨며 호수에서 가족과 함께 시간을 보냄.</li><li>오후 내내(all afternoon) 활동이 이어짐</li><li>물수제비와 수영(swimming)을 함께 즐김</li><li>핵심 키워드: 즐기다(enjoyed)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set up</td><td class=\"m\">설치하다, 세우다</td></tr><tr><td class=\"w\">skip</td><td class=\"m\">물수제비를 뜨다, 수면 위를 튀기며 가다</td></tr><tr><td class=\"w\">be good at</td><td class=\"m\">~을 잘하다, ~에 능숙하다</td></tr><tr><td class=\"w\">sink</td><td class=\"m\">가라앉다, 침몰하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">angle</td><td class=\"m\">각도, 각</td></tr><tr><td class=\"w\">flat</td><td class=\"m\">평평한, 납작한</td></tr><tr><td class=\"w\">degree</td><td class=\"m\">(각도의 단위) 도, 정도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 텐트를 세운 후에</span><span class=\"en\"><b>After we <span class=\"grammar-hl\">set up</span> the tent,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 갔다</span><span class=\"en\"><b>we went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호수로</span><span class=\"en\"><b>to the lake.</b></span></div></div><div class=\"lec-sent-ko\">우리는 텐트를 세운 후에, 호수로 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> After we set up the tent는 캠핑의 가장 기본적인 준비 작업을 마쳤음을 나타내며, 이후의 활동인 호수로의 이동이 본격적인 휴식의 시작임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">set up (관용표현): &#39;설치하다&#39;, &#39;준비하다&#39;라는 의미를 가진 구동사(Phrasal Verb)로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set up</td><td class=\"m\">설치하다, 세우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 아빠를 보았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">saw Dad</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물수제비 뜨는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">skipping</span> stones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 가로질러서</span><span class=\"en\"><b>across the water.</b></span></div></div><div class=\"lec-sent-ko\">나는 아빠가 물을 가로질러서 물수제비 뜨는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> skipping stones는 한국어로 &#39;물수제비 뜨기&#39;라고 하며, 이 문장은 글의 핵심 소재인 물수제비 활동을 도입하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw Dad skipping 5형식(SVOC) 구조: 지각동사(saw) + 목적어(Dad) + 목적격보어(skipping) 구조로, 목적어가 ~하는 동작을 하는 것을 보았음을 나타낸다.</div><div class=\"lec-gr-item\">skipping (현재분사): 지각동사의 목적격보어로 쓰여 목적어인 Dad가 돌을 튀기고 있는 &#39;능동&#39;과 &#39;진행&#39;의 상태를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skip</td><td class=\"m\">물수제비를 뜨다, 수면 위를 튀기며 가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 정말 잘했다</span><span class=\"en\"><b>He was very <span class=\"grammar-hl\">good</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> it.</b></span></div></div><div class=\"lec-sent-ko\">아빠는 그것을 정말 잘하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> He was very good at it은 아빠의 숙련된 솜씨를 강조하며, 이를 지켜보는 아이가 아빠의 기술에 호기심을 갖게 되는 계기를 마련합니다. 4. “How did you do that, Dad?” 앞 문장에서 본 아빠의 뛰어난 기술에 대해 아이가 구체적인 방법론을 묻는 질문으로, 이어지는 아빠의 설명을 이끌어내는 전환점입니다. 5. “Most stones sink in water. Most stones sink는 일반적인 물리 법칙을 먼저 언급함으로써, 물수제비가 일어나는 현상이 특별한 조건 하에서 발생하는 예외적인 상황임을 암시합니다. 6. But if you throw a stone with the right speed and at the right angle, it can skip and go far. the right speed and at the right angle은 물수제비가 성공하기 위해 필요한 물리적 조건을 설명하며, 단순히 힘으로만 하는 것이 아니라 기술이 필요함을 강조합니다. 7. The shape of the stone is important, too. 던지는 방법(속도, 각도) 외에 물체 자체의 특성인 &#39;모양&#39;이라는 또 다른 필수 요소를 추가하여 설명을 보충합니다. 8. Can you choose a better stone and find a better angle?” 아빠가 설명한 원리를 아이가 스스로 적용해 보도록 유도하며 체험적인 학습을 제안하는 문장입니다. 9. I said, “I will choose this flat stone and throw it at about an angle of 20 degrees.” flat stone과 angle of 20 degrees는 아빠의 가르침을 바탕으로 아이가 내린 구체적인 결론이며, 원리를 실천에 옮기는 장면을 묘사합니다. 10. “Great choice!” Dad answered. 아이가 선택한 조건(납작한 돌, 20도 각도)이 적절함을 인정하며 아빠가 칭찬과 격려를 건네는 대목입니다. 11. We enjoyed skipping stones and swimming all afternoon. all afternoon은 캠핑지에서 보낸 즐거운 시간의 지속성을 나타내며, 아빠와 아이가 기술적인 배움을 넘어 정서적 교감을 나누었음을 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">good at (관용표현): be good at (~에 능숙하다) 형태의 숙어로, 전치사 at 뒤에는 명사나 동명사가 온다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“어떻게 그것을 하셨나요</span><span class=\"en\"><b>“<span class=\"grammar-hl\">How did you do</span> that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠?”</span><span class=\"en\"><b>Dad?”</b></span></div></div><div class=\"lec-sent-ko\">“그거 어떻게 하셨어요. 아빠?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 본 아빠의 뛰어난 기술에 대해 아이가 구체적인 방법론을 묻는 질문으로, 이어지는 아빠의 설명을 이끌어내는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How did you do 의문문 구조: 의문사(How) + 조동사(did) + 주어(you) + 동사원형(do) 순서의 일반동사 과거형 의문문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“대부분의 돌은 가라앉는다</span><span class=\"en\"><b>“Most stones <span class=\"grammar-hl\">sink</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서.</span><span class=\"en\"><b>in water.</b></span></div></div><div class=\"lec-sent-ko\">“대부분의 돌은 물에 가라앉지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Most stones sink는 일반적인 물리 법칙을 먼저 언급함으로써, 물수제비가 일어나는 현상이 특별한 조건 하에서 발생하는 예외적인 상황임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sink 기본 문장 구조: 주어(Most stones) 뒤에 오는 자동사로, &#39;가라앉다&#39;라는 일반적인 사실을 현재 시제로 표현했다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sink</td><td class=\"m\">가라앉다, 침몰하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 만약 네가 돌을 던지면</span><span class=\"en\"><b>But if you throw a stone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 속도와 적절한 각도로</span><span class=\"en\"><b>with the right speed and at the right angle,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 튕겨서 멀리 갈 수 있다.</span><span class=\"en\"><b>it <span class=\"grammar-hl\">can skip and go</span> far.</b></span></div></div><div class=\"lec-sent-ko\">하지만 네가 돌을 적절한 속도와 각도로 던지면, 돌은 튕기면서 멀리 갈 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the right speed and at the right angle은 물수제비가 성공하기 위해 필요한 물리적 조건을 설명하며, 단순히 힘으로만 하는 것이 아니라 기술이 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can skip and go 병렬 구조: 조동사 can에 동사원형 skip과 go가 접속사 and로 연결되어 주어 it의 가능성을 함께 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skip</td><td class=\"m\">물수제비를 뜨다, 수면 위를 튀기며 가다</td></tr><tr><td class=\"w\">angle</td><td class=\"m\">각도, 각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">돌의 모양은</span><span class=\"en\"><b>The shape of the stone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역시 중요하다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> important, too.</b></span></div></div><div class=\"lec-sent-ko\">돌의 모양도 중요하단다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 던지는 방법(속도, 각도) 외에 물체 자체의 특성인 &#39;모양&#39;이라는 또 다른 필수 요소를 추가하여 설명을 보충합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 기본 문장 구조: 주어인 &#39;The shape of the stone&#39;에서 핵심 명사가 단수(shape)이므로 단수 비동사 is를 사용했다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 좋은 돌을 고르고</span><span class=\"en\"><b>Can you <span class=\"grammar-hl\">choose a better stone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 나은 각도를 찾을 수 있겠니?”</span><span class=\"en\"><b><span class=\"grammar-hl\">and find a better angle</span>?”</b></span></div></div><div class=\"lec-sent-ko\">더 좋은 돌을 고르고 더 나은 각도를 찾을 수 있겠니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 설명한 원리를 아이가 스스로 적용해 보도록 유도하며 체험적인 학습을 제안하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">choose a better stone and find a better angle 병렬 구조: 조동사 Can에 걸리는 동사원형 choose와 find가 접속사 and를 통해 대등하게 연결되어 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">angle</td><td class=\"m\">각도, 각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Q2. 어느 것이 물수제비를 뜨기에 더 좋은 각도인가요?</span><span class=\"en\"><b>Q2. Which is the better angle <span class=\"grammar-hl\">to skip</span> stones?</b></span></div></div><div class=\"lec-sent-ko\">Q2. 물수제비를 뜨기에 더 좋은 각도는 어느 것인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> flat stone과 angle of 20 degrees는 아빠의 가르침을 바탕으로 아이가 내린 구체적인 결론이며, 원리를 실천에 옮기는 장면을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to skip (to부정사): 명사 angle을 뒤에서 수식하는 형용사적 용법으로 쓰였으며, &#39;~할&#39; 또는 &#39;~하기 위한&#39;으로 해석된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skip</td><td class=\"m\">물수제비를 뜨다, 수면 위를 튀기며 가다</td></tr><tr><td class=\"w\">angle</td><td class=\"m\">각도, 각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 말했다</span><span class=\"en\"><b>I said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“나는 이 납작한 돌을 골라서</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">will choose this flat stone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 던질 거예요</span><span class=\"en\"><b><span class=\"grammar-hl\">and throw</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 20도의 각도로.”</span><span class=\"en\"><b>at about an angle of 20 degrees.”</b></span></div></div><div class=\"lec-sent-ko\">나는 “이 납작한 돌을 골라서 약 20도 각도로 던져 볼게요.”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이가 선택한 조건(납작한 돌, 20도 각도)이 적절함을 인정하며 아빠가 칭찬과 격려를 건네는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will choose this flat stone and throw 병렬 구조: 미래 시제를 나타내는 조동사 will에 동사원형 choose와 throw가 and로 연결되어 주어의 의지를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">angle</td><td class=\"m\">각도, 각</td></tr><tr><td class=\"w\">flat</td><td class=\"m\">평평한, 납작한</td></tr><tr><td class=\"w\">degree</td><td class=\"m\">(각도의 단위) 도, 정도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“좋은 선택이야!”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Great choice</span>!”</b></span></div></div><div class=\"lec-sent-ko\">“좋은 선택이야!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> all afternoon은 캠핑지에서 보낸 즐거운 시간의 지속성을 나타내며, 아빠와 아이가 기술적인 배움을 넘어 정서적 교감을 나누었음을 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Great choice 감탄 표현: 주어와 동사(That is)가 생략된 형태의 명사구 감탄문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠가 대답하셨다.</span><span class=\"en\"><b>Dad <span class=\"grammar-hl\">answered</span>.</b></span></div></div><div class=\"lec-sent-ko\">아빠가 대답하셨다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">answered 기본 문장 구조: 주어(Dad) 뒤에 과거 시제 동사(answered)가 온 단순 과거 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 물수제비 뜨기와 수영을 즐겼다</span><span class=\"en\"><b>We enjoyed <span class=\"grammar-hl\">skipping stones and swimming</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 내내.</span><span class=\"en\"><b>all afternoon.</b></span></div></div><div class=\"lec-sent-ko\">우리는 오후 내내 물수제비 뜨기와 수영을 즐겼다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">skipping stones and swimming (동명사): 타동사 enjoyed의 목적어 역할을 하는 명사적 성격의 -ing 형태이며, 두 동명사가 and로 병렬 연결되어 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skip</td><td class=\"m\">물수제비를 뜨다, 수면 위를 튀기며 가다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>캠핑 중 호숫가에서 아빠가 물수제비 뜨는 것을 보고 아이가 호기심을 갖는다.</li><li>아빠는 물수제비가 성공하기 위해 필요한 조건인 속도, 각도, 돌의 모양을 설명해 준다.</li><li>아이는 아빠의 설명을 듣고 납작한 돌과 20도라는 각도를 선택해 직접 시도해 본다.</li><li>아빠와 아이는 물수제비와 수영을 하며 즐거운 오후 시간을 함께 보낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The child learns the physical principles of skipping stones from his father while they enjoy outdoor activities together.</div>\n              <div class=\"lec-final-sum-ko\">아이는 아버지로부터 물수제비의 물리적 원리를 배우는 동시에 함께 야외 활동을 즐긴다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"audio":"./3_audio/25.mp3","hl":"meaning"},{"audio":"./3_audio/26.mp3","hl":"grammar"}],[{"audio":"./3_audio/27.mp3","hl":"main"},{"audio":"./3_audio/28.mp3","hl":"meaning"},{"audio":"./3_audio/29.mp3","hl":"grammar"}],[{"audio":"./3_audio/30.mp3","hl":"main"},{"audio":"./3_audio/31.mp3","hl":"meaning"},{"audio":"./3_audio/32.mp3","hl":"grammar"}],[{"audio":"./3_audio/33.mp3","hl":"main"},{"audio":"./3_audio/34.mp3","hl":"meaning"},{"audio":"./3_audio/35.mp3","hl":"grammar"}],[{"audio":"./3_audio/36.mp3","hl":"main"},{"audio":"./3_audio/37.mp3","hl":"meaning"},{"audio":"./3_audio/38.mp3","hl":"grammar"}],[{"audio":"./3_audio/39.mp3","hl":"main"},{"audio":"./3_audio/40.mp3","hl":"meaning"},{"audio":"./3_audio/41.mp3","hl":"grammar"}],[{"audio":"./3_audio/42.mp3","hl":"main"},{"audio":"./3_audio/43.mp3","hl"
