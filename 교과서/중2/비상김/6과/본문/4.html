: 자연과 캠핑에서 배우는 과학</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">캠핑의 꽃인 모닥불을 피울 때 가장 중요한 과학적 원리는 연소(Combustion)의 핵심 요소인 산소가 연료에 얼마나 잘 공급되느냐에 달려 있습니다. 나무를 우물 정(井)자 모양으로 쌓는 격자무늬(Criss-cross pattern) 방식은 나무 사이사이에 넉넉한 공간을 만들어 공기 순환(Air circulation)을 돕고, 산소가 불꽃과 만나는 표면적(Surface area)을 극대화하는 아주 효율적인 방법이지요. 마치 꽉 막힌 방보다 창문을 열어둔 방에서 공기가 더 잘 통하는 것처럼, 이 구조는 뜨거운 공기가 위로 올라가며 신선한 산소를 계속 끌어들이는 대류 현상(Convection)을 촉진하여 불이 더 잘 타오르게 합니다. 이처럼 단순히 나무를 쌓는 작은 행동 하나에도 자연의 법칙을 활용해 에너지를 효율적으로 얻는 놀라운 과학적 원리(Scientific principles)가 숨어 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01바비큐 준비</div><ul><li>캠핑장에서 바비큐를 준비하며 기대감에 부푼다.</li><li>캠핑장(campsite)에서 식사 준비 시작</li><li>바비큐(barbecue)에 대한 기대와 흥분</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02불 피우기 도전</div><ul><li>불이 잘 붙을 수 있도록 나무를 쌓는 최적의 방법을 고민한다.</li><li>핵심 요소: 공기가 통할 충분한 공간(space) 확보</li><li>다양한 방식의 나무 쌓기(pile up the wood) 시도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과학적 원리 발견</div><ul><li>격자무늬로 나무를 쌓는 것이 공기 순환에 가장 유리함을 배운다.</li><li>해결책: 격자무늬 패턴(criss-cross pattern) 활용</li><li>효과: 공기를 위한 더 많은 공간(room for air) 생성</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04일상 속 과학의 체감</div><ul><li>자연을 관찰하며 과학이 우리 주변 어디에나 있음을 깨닫는다.</li><li>밤하늘에 빛나는 수많은 별(stars) 관찰</li><li>깨달음: 모든 곳에 존재하는 과학(science is everywhere)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get ready for</td><td class=\"m\">~을 위해 준비하다, ~할 채비를 하다</td></tr><tr><td class=\"w\">pile up</td><td class=\"m\">~을 쌓다, 쌓아 올리다</td></tr><tr><td class=\"w\">pattern</td><td class=\"m\">양식, 형태, 본보기</td></tr><tr><td class=\"w\">criss-cross</td><td class=\"m\">격자무늬의, 십자로 교차하는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make room for</td><td class=\"m\">~을 위한 공간을 만들다, ~을 위해 자리를 내주다</td></tr><tr><td class=\"w\">well done</td><td class=\"m\">잘했어, 훌륭해</td></tr><tr><td class=\"w\">be full of</td><td class=\"m\">~으로 가득 차다, ~이 아주 많다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 바라보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">캠핑장으로 돌아와서</span><span class=\"en\"><b>Back at the campsite</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 준비를 했다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">got ready</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바비큐를 위한.</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> a barbecue.</b></span></div></div><div class=\"lec-sent-ko\">캠핑장으로 돌아와서, 우리는 바비큐 준비를 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 활동을 마치고 장소를 이동하여 새로운 사건인 바비큐 요리가 시작됨을 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got ready for (관용표현): &#39;get ready for + 명사&#39; 형태로 &#39;~을 준비하다&#39;라는 의미를 나타내는 표현임</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 정말 신이 났다.</span><span class=\"en\"><b>I was very <span class=\"grammar-hl\">excited</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 정말 신이 났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바비큐를 한다는 사실에 대한 필자의 감정 상태를 직접적으로 나타내어 글의 분위기를 즐겁게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">excited (과거분사(형용사적)): excite는 &#39;흥분시키다&#39;라는 타동사이나, 주어 I가 느끼는 감정 상태를 설명하기 위해 과거분사 형태로 쓰여 형용사 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“봐, 민호야.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Look</span>, Minho.</b></span></div></div><div class=\"lec-sent-ko\">“봐, 민호야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 민호의 주의를 집중시키며 무언가 가르쳐주거나 질문하려는 상황을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look (명령문): 동사원형으로 시작하여 주어 없이 상대방에게 특정한 행동을 지시하거나 주의를 끄는 문장 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 네가 공기가 들어갈 충분한 공간을 만든다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If you make</span> enough space for air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 불을 잘 붙일 수 있을 거야.</span><span class=\"en\"><b>you will get a good fire.</b></span></div></div><div class=\"lec-sent-ko\">공기가 들어갈 충분한 공간을 만들면, 너는 불을 잘 붙일 수 있을 거야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> make enough space for air는 불이 타오르는 데 필수적인 산소가 잘 공급될 수 있는 환경을 만들어야 한다는 과학적 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you make 조건의 부사절: 접속사 if가 이끄는 절이 주절의 조건이 되며, &#39;if + 주어 + 현재시제&#39; 구조를 통해 미래의 상황을 가정함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇이 가장 좋은 방법일까</span><span class=\"en\"><b>What is the best way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무를 쌓는?”</span><span class=\"en\"><b><span class=\"grammar-hl\">to pile up</span> the wood?”</b></span></div></div><div class=\"lec-sent-ko\">나무를 쌓는 가장 좋은 방법은 뭘까?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠가 민호에게 스스로 생각해보게 함으로써, 과학적 원리를 실제 상황에 적용해보라는 과제를 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to pile up (to부정사): 형용사적 용법으로 명사 way를 뒤에서 수식하여 &#39;쌓아 올리는 (방법)&#39;이라는 의미를 나타내는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pile up</td><td class=\"m\">~을 쌓다, 쌓아 올리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 여러 가지 모양을 시도했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">tried many patterns</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 마침내 가장 좋은 모양을 만들었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and finally made</span> the best pattern.</b></span></div></div><div class=\"lec-sent-ko\">나는 여러 가지 모양을 시도해 보고 마침내 가장 좋은 모양을 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> tried many patterns는 아빠의 질문에 답을 찾기 위해 민호가 직접 나무를 이리저리 쌓아보며 시행착오를 겪는 실험 과정을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried many patterns and finally made 병렬 구조: 등위접속사 and를 중심으로 과거동사 tried와 made가 대등하게 연결되어 주어 I의 연속된 동작을 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">양식, 형태, 본보기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“아빠, 이건 어때요?”</span><span class=\"en\"><b>“Dad, <span class=\"grammar-hl\">how about</span> this?”</b></span></div></div><div class=\"lec-sent-ko\">“아빠, 이건 어때요?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신이 찾아낸 해결책이 맞는지 아빠에게 확인을 요청하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how about (관용표현): &#39;How about + 명사/동명사?&#39; 형태로 상대방에게 제안을 하거나 의견을 물을 때 사용하는 관용적 표현임</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Q3. 무엇이 가장 좋은 방법인가요</span><span class=\"en\"><b>Q3. What is the best way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무를 쌓는?</span><span class=\"en\"><b><span class=\"grammar-hl\">to pile up</span> the wood?</b></span></div></div><div class=\"lec-sent-ko\">Q3. 나무를 쌓는 가장 좋은 방법은 무엇인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자로 하여금 글의 내용을 바탕으로 정답을 유추하게 만드는 읽기 이해 확인 문항입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to pile up (to부정사): 형용사적 용법으로 앞의 명사 way를 수식하여 구체적인 용도나 내용을 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pile up</td><td class=\"m\">~을 쌓다, 쌓아 올리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그래,</span><span class=\"en\"><b>“Yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십자형의 모양이 공기를 위한 더 많은 공간을 만든단다.</span><span class=\"en\"><b>the criss-cross pattern <span class=\"grammar-hl\">makes more room</span> for air.</b></span></div></div><div class=\"lec-sent-ko\">“그래, 십자형의 모양이 공기를 위한 보다 많은 공간을 만든단다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the criss-cross pattern은 나무를 우물 정(井)자 모양으로 엇갈리게 쌓는 구체적인 방식을 말하며, 이것이 왜 효율적인지 이유를 확인해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes more room 3형식 구조: 주어(the criss-cross pattern) + 타동사(makes) + 목적어(more room)로 이루어진 완전한 문장 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">양식, 형태, 본보기</td></tr><tr><td class=\"w\">criss-cross</td><td class=\"m\">격자무늬의, 십자로 교차하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잘했어.”</span><span class=\"en\"><b>Well <span class=\"grammar-hl\">done</span>.”</b></span></div></div><div class=\"lec-sent-ko\">잘했어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 민호가 스스로 과학적 원리를 찾아낸 것에 대한 아빠의 칭찬입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">done (과거분사(형용사적)): &#39;It is well done&#39;에서 주어와 be동사가 생략된 관용적 표현으로, 완료된 상태나 결과에 대한 칭찬을 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">well done</td><td class=\"m\">잘했어, 훌륭해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">밤에</span><span class=\"en\"><b>At night</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 수백 개의 별들을 보았다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">watched hundreds of stars</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에서 빛나고 있는.</span><span class=\"en\"><b><span class=\"grammar-hl\">shining</span> in the sky.</b></span></div></div><div class=\"lec-sent-ko\">밤에 우리는 하늘에서 수백 개의 별들이 빛나는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 낮의 바비큐 활동에서 밤의 별 관찰로 시간이 흐르며, 또 다른 자연 현상을 마주하게 되는 장면 전환입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">watched hundreds of stars shining 5형식(SVOC) 구조: 지각동사 watch + 목적어(hundreds of stars) + 목적격보어(shining) 구조로 목적어의 동작을 묘사함</div><div class=\"lec-gr-item\">shining (현재분사): 5형식 문장의 목적격보어로 쓰였으며, 수식받는 명사(stars)가 직접 하고 있는 진행 중인 동작을 나타냄 (≈ stars that were shining)</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연은 놀라움으로 가득 차 있었다</span><span class=\"en\"><b>Nature <span class=\"grammar-hl\">was full of</span> surprises</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 과학은 내가 그것들을 이해하는 데 도움을 주었다.</span><span class=\"en\"><b>and science <span class=\"grammar-hl\">helped me understand</span> them.</b></span></div></div><div class=\"lec-sent-ko\">자연은 놀라움으로 가득 차 있었고 과학은 내가 그것들을 이해하는 데 도움을 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Nature was full of surprises는 자연 속의 신비로운 현상들을 의미하며, science helped me understand them은 과학적 지식이 막연한 경이로움을 명확한 이해로 바꾸어 주었다는 필자의 깨달음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was full of (관용표현): &#39;be full of + 명사&#39; 구조로 &#39;~으로 가득 차 있다&#39;라는 상태를 나타냄</div><div class=\"lec-gr-item\">helped me understand 5형식(SVOC) 구조: 준사역동사 help + 목적어(me) + 목적격보어(understand) 구조이며, help의 목적격보어로는 동사원형 또는 to부정사가 올 수 있음</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“아빠, 과학은 어디에나 있어요.”</span><span class=\"en\"><b>“Dad, <span class=\"grammar-hl\">science is everywhere</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“아빠, 과학은 어디에나 있어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> science is everywhere는 과학이 실험실에만 있는 것이 아니라 불 피우기나 별 관찰처럼 일상의 모든 순간에 존재한다는 최종적인 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">science is everywhere 2형식 구조: 주어(science)와 주어를 보충 설명하는 보어 자리에 부사(everywhere)가 와서 존재나 상태를 나타내는 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아빠는 나를 바라보셨다</span><span class=\"en\"><b>Dad <span class=\"grammar-hl\">looked at</span> me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환한 미소로.</span><span class=\"en\"><b>with a big smile.</b></span></div></div><div class=\"lec-sent-ko\">아빠는 환한 미소로 나를 바라보셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아들의 성장을 대견해하는 아빠의 모습으로 글을 따뜻하게 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked at (관용표현): 자동사 look이 전치사 at과 결합하여 &#39;~을 보다&#39;라는 의미의 타동사구처럼 쓰인 구조</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>캠핑장에서 바비큐를 준비하며 공기가 잘 통해야 불이 잘 붙는다는 과학적 원리를 배운다.</li><li>민호는 시행착오 끝에 &#39;엇갈려 쌓기(criss-cross)&#39;가 불을 피우는 최적의 방법임을 스스로 발견한다.</li><li>밤하늘의 별을 보며 자연의 신비로움을 느끼고, 과학이 그 신비로움을 이해하는 도구임을 깨닫는다.</li><li>과학은 멀리 있는 것이 아니라 우리 주변 모든 곳에 존재한다는 교훈을 얻는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Minho understands the omnipresence of science because he applies scientific methods to make a fire and observes the natural world.</div>\n              <div class=\"lec-final-sum-ko\">민호는 불을 지피는 방식에 과학적 방법을 적용하고 자연 세계를 관찰함으로써 과학이 어디에나 존재함을 이해한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":"main"},{"audio":"./4_audio/13.mp3","hl":"meaning"},{"audio":"./4_audio/14.mp3","hl":"grammar"}],[{"audio":"./4_audio/15.mp3","hl":"main"},{"audio":"./4_audio/16.mp3","hl":"meaning"},{"audio":"./4_audio/17.mp3","hl":"grammar"}],[{"audio":"./4_audio/18.mp3","hl":"main"},{"audio":"./4_audio/19.mp3","hl":"meaning"},{"audio":"./4_audio/20.mp3","hl":"grammar"}],[{"audio":"./4_audio/21.mp3","hl":"main"},{"audio":"./4_audio/22.mp3","hl":"meaning"},{"audio":"./4_audio/23.mp3","hl":"grammar"}],[{"audio":"./4_audio/24.mp3","hl":"main"},{"audio":"./4_audio/25.mp3","hl":"meaning"},{"audio":"./4_audio/26.mp3","hl":"grammar"}],[{"audio":"./4_audio/27.mp3","hl":"main"},{"audio":"./4_audio/28.mp3","hl":"meaning"},{"audio":"./4_audio/29.mp3","hl":"grammar"}],[{"audio":"./4_audio/30.mp3","hl":"main"},{"audio":"./4_audio/31.mp3","hl":"meaning"},{"audio":"./4_audio/32.mp3","hl":"grammar"}],[{"audio":"./4_audio/33.mp3","hl":"main"},{"audio":"./4_audio/34.mp3","hl":"meaning"},{"audio":"./4_audio/35.mp3","hl":"grammar"}],[{"audio":"./4_audio/36.mp3","hl":"main"},{"audio":"./4_audio/37.mp3","hl":"meaning"},{"audio":"./4_audio/38.mp3","hl":"grammar"}],[{"audio":"./
