Wik3KehHOccjt1/LvRkeo/MUALRSZHqO/cduv5d6Mj1HPTkc0ALRSbl/vDnOORzjr+Xf0oyD0I/MUALRSbl/vDnOORzjr+Xf0oyPUfmKAFopNy/3hznHI5x1/Lv6UZHqPzFAC0Um5T0Yc5xyO3X8u9AZT0IP0IoAWik3Lx8w56cjnHXH0oyD0I/MUALRSblPRhznHI7dfy70BlPRgc9MEUALRSbl/vDnOORzjr+Xf0oyD0I/MUALRSbl9R+Y7dfywaMj1H5igBaKTcv95eenI5oyPUfmKAFopMg9CD+Pp1/KlyPUUAFFJkeo/OjI9R+dAC0UmR6j86Mj1H50ALRSZHqPzoyPUfnQAtFGR6jnp70ZHqKACikyPUfn6daXI9RQAUHgGkyD0IP4+nX8qRiArHrwT65wCffPSgD/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Smart Way to Set Up a Tent: Understanding Sun and Shadow<small>텐트를 설치하는 똑똑한 방법: 태양과 그림자의 이해</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">지구가 서쪽에서 동쪽으로 스스로 도는 지구의 자전(Rotation of the Earth) 때문에, 우리 눈에는 태양이 동쪽에서 떠서 서쪽으로 이동하는 것처럼 보이는 태양의 일주 운동(Diurnal Motion of the Sun)이 나타납니다. 이때 태양과 정반대 방향으로 생기는 그림자(Shadow)는 서쪽에서 시작해 동쪽으로 움직이게 되는데, 이러한 원리를 알면 캠핑장에서 시간이 흐른 뒤 어디에 그늘이 생길지 미리 예측할 수 있습니다. 마치 우리가 해시계(Sundial)를 보며 시간을 확인하듯, 태양의 위치 변화를 통해 공간의 온도(Spatial Temperature)를 조절하는 지혜가 필요한 것이죠. 따라서 오후의 뜨거운 햇볕을 피하려면 현재 태양의 위치뿐만 아니라 태양의 궤적(Sun Path)에 따른 그림자의 이동 경로를 미리 계산하여 텐트를 설치하는 것이 가장 현명한 방법입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01텐트 설치 준비</div><ul><li>더운 날씨를 고려하여 텐트를 칠 적절한 장소를 찾기 시작한다.</li><li>가방에서 텐트(tent)를 꺼내고 주변을 살핌</li><li>오후의 무더운 날씨(hot)에 대비해야 함</li><li>핵심 키워드: 장소 찾기(looking for a place)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02환경 변화 예측</div><ul><li>호수에서 돌아올 미래의 시간과 태양의 움직임을 함께 고려한다.</li><li>4시간 뒤(4 hours later) 호수에서 돌아올 상황을 계산함</li><li>태양의 이동(movement of the sun)을 미리 예측하여 계획함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과학적 원리 적용</div><ul><li>태양과 그림자의 이동 방향이 반대라는 원리를 이용해 위치를 분석한다.</li><li>태양은 동쪽에서 서쪽(east to west)으로 이동함</li><li>그림자(shadow)는 반대로 서쪽에서 동쪽으로 이동함을 파악함</li><li>나무 그늘이 생길 정확한 지점을 선정함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04최적의 장소 선정</div><ul><li>아빠의 칭찬과 함께 자연의 원리를 이해하는 즐거움을 경험한다.</li><li>논리적인 위치 선정에 대한 아빠의 인정(Correct!)</li><li>자연을 이해하는 첫 번째 열쇠(first key)를 얻음</li><li>핵심 키워드: 자연으로 향하는 창(window into nature)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pull out</td><td class=\"m\">꺼내다, 뽑다</td></tr><tr><td class=\"w\">look around</td><td class=\"m\">둘러보다, 주위를 살피다</td></tr><tr><td class=\"w\">look for</td><td class=\"m\">~을 찾다, 구하다</td></tr><tr><td class=\"w\">be back</td><td class=\"m\">돌아오다, 복귀하다</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 이동, 변화</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set up</td><td class=\"m\">설치하다, 세우다, 준비하다</td></tr><tr><td class=\"w\">shadow</td><td class=\"m\">그림자, 그늘</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">정확한, 옳은, 맞는</td></tr><tr><td class=\"w\">open the window into</td><td class=\"m\">~을 들여다보는 창을 열다, ~을 이해하는 계기가 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 텐트를 꺼냈고</span><span class=\"en\"><b>We pulled the tent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가방에서</span><span class=\"en\"><b>out of its bag,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠는 주위를 둘러보셨다.</span><span class=\"en\"><b>and Dad <span class=\"grammar-hl\">looked around</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠핑지에 도착해 본격적으로 캠핑을 준비하는 시작 상황을 보여줍니다. looked around는 단순히 경치를 감상하는 것이 아니라 텐트를 설치하기에 가장 적당한 위치를 탐색하는 신중한 행동을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pull the tent out of its bag (관용표현): pull A out of B (A를 B에서 꺼내다) 구조가 사용되었다.</div><div class=\"lec-gr-item\">looked around (관용표현): 주변을 둘러보다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“무엇을 하고 계세요</span><span class=\"en\"><b>“What <span class=\"grammar-hl\">are you doing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠?”</span><span class=\"en\"><b>Dad?”</b></span></div></div><div class=\"lec-sent-ko\">“아빠, 뭐 하세요?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠의 탐색 행동에 대해 질문을 던짐으로써, 텐트 자리를 선정하는 기준에 대해 독자가 궁금증을 갖도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are you doing (현재진행): be동사(are) + -ing 형태로 현재 진행 중인 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“나는 찾고 있단다</span><span class=\"en\"><b>“I’m looking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텐트를 칠 장소를.”</span><span class=\"en\"><b>for a place for the tent.”</b></span></div></div><div class=\"lec-sent-ko\">“텐트를 칠 장소를 찾고 있단다.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아빠의 대답을 통해 이 글의 중심 소재가 &#39;적절한 텐트 설치 장소 찾기&#39;임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">am looking for (현재진행): be동사(am) + -ing 형태로 진행 중인 동작을 나타낸다. 또한 look for는 &#39;~을 찾다&#39;라는 의미의 관용표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“매우 더울 거예요</span><span class=\"en\"><b>“<span class=\"grammar-hl\">It’s going to be</span> very hot</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후에는,”</span><span class=\"en\"><b>in the afternoon,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">라고 내가 말했다.</span><span class=\"en\"><b>I said.</b></span></div></div><div class=\"lec-sent-ko\">“오후에는 매우 더울 거예요.”라고 내가 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 텐트 자리를 고를 때 가장 먼저 고려해야 할 제약 조건인 &#39;오후의 열기&#39;를 언급하며 대화의 방향을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s going to be (관용표현): be going to + 동사원형 구조로 미래의 상태나 계획을 나타낸다. 여기서 It은 날씨를 나타내는 비인칭 주어로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“맞아.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Right</span>.</b></span></div></div><div class=\"lec-sent-ko\">“맞아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 더위 문제를 해결하기 위한 구체적인 방법론을 제시합니다. the movement of the sun은 시간이 흐름에 따라 태양의 위치가 바뀌고 그에 따라 그림자의 위치도 바뀐다는 과학적 원리를 활용하겠다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Right (관용표현): 상대방의 의견에 동의하거나 긍정할 때 사용하는 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 돌아올 거란다</span><span class=\"en\"><b>We will <span class=\"grammar-hl\">be back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호수에서</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> the lake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 4시간 후에.</span><span class=\"en\"><b>about 4 hours later.</b></span></div></div><div class=\"lec-sent-ko\">우리는 약 4시간 후에 호수에서 돌아올 거란다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 대화의 내용을 바탕으로 독자에게 논리적 추론을 유도하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be back from (관용표현): ~에서 돌아오다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be back</td><td class=\"m\">돌아오다, 복귀하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">생각해 보자</span><span class=\"en\"><b>Let’s think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태양의 움직임에 대해</span><span class=\"en\"><b>about the movement of the sun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텐트를 세우기 위해.”</span><span class=\"en\"><b><span class=\"grammar-hl\">to set up</span> the tent.”</b></span></div></div><div class=\"lec-sent-ko\">텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the shadow moves from west to east는 태양과 그림자가 반대 방향으로 움직이는 원리를 정확히 파악하고 있음을 보여줍니다. 결과적으로 then(4시간 뒤 오후 시간)에 햇빛을 피해 나무 그늘이 생길 위치를 정확히 예측하여 장소를 선정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to set up (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위하여&#39;라고 해석한다. set up은 &#39;(텐트 등을) 치다/설치하다&#39;라는 의미의 관용표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 이동, 변화</td></tr><tr><td class=\"w\">set up</td><td class=\"m\">설치하다, 세우다, 준비하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"
