 지식이 아니라 우리를 둘러싼 생태계(Ecosystem)의 질서를 이해하고 자연과 깊이 소통하기 위해 반드시 필요한 도구라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01첫 캠핑의 시작</div><ul><li>민호는 아버지와 함께 처음으로 캠핑을 떠나 자연 속에서 시간을 보내게 된다.</li><li>생애 첫 캠핑(first time camping) 경험</li><li>대자연의 지붕(nature&#39;s roof) 아래에서 하루를 보낼 준비</li><li>핵심 키워드: 캠핑(camping)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02자연을 여는 열쇠</div><ul><li>아버지는 자연을 제대로 이해하기 위해 특별한 도구가 필요함을 언급한다.</li><li>자연에 대한 이해(understand nature)의 중요성 강조</li><li>추상적인 개념인 특별한 열쇠(special key)를 제시함</li><li>민호의 호기심 유발</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과학의 역할 제시</div><ul><li>아버지는 자연을 이해하는 결정적인 열쇠가 바로 과학임을 알려준다.</li><li>핵심 답변: 과학(Science)</li><li>과학을 통해 자연의 원리를 파악할 수 있음을 시사함</li><li>아버지가 보여주는 과학에 대한 긍정적 태도(big smile)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">science</td><td class=\"m\">과학, 학문</td></tr><tr><td class=\"w\">key</td><td class=\"m\">비결, 해결책, 핵심</td></tr><tr><td class=\"w\">go camping</td><td class=\"m\">캠핑을 가다, 야영하다</td></tr><tr><td class=\"w\">for the first time</td><td class=\"m\">처음으로, 최초로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 천성</td></tr><tr><td class=\"w\">special</td><td class=\"m\">특별한, 특수한</td></tr><tr><td class=\"w\">with a smile</td><td class=\"m\">미소를 지으며, 웃으며</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학은 열쇠이다</span><span class=\"en\"><b><span class=\"grammar-hl\">Science Is the Key</span></b></span></div></div><div class=\"lec-sent-ko\">과학은 열쇠이다</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> went camping with Dad for the first time은 이 글의 전체적인 배경을 설정하는 문장입니다. 주인공인 민호가 이전에는 해본 적 없는 새로운 경험을 시작하게 되었음을 알리며, 뒤이어 나올 아빠와의 대화가 자연스러운 맥락에서 이루어지도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Science Is the Key 2형식(SVC) 구조: 주어(Science)와 be동사(Is), 그리고 주어를 보충 설명하는 명사 보어(the Key)로 이루어진 구조이다.</div><div class=\"lec-gr-item\">went camping (동명사): go + -ing 관용구에서 camping은 &#39;캠핑하기&#39;라는 활동/행위를 의미하는 명사적 성격의 동명사로 쓰였다.</div><div class=\"lec-gr-item\">for the first time (관용표현): &#39;처음으로&#39;라는 의미를 가진 전치사구 기반의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">science</td><td class=\"m\">과학, 학문</td></tr><tr><td class=\"w\">key</td><td class=\"m\">비결, 해결책, 핵심</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 캠핑을 갔다</span><span class=\"en\"><b>I went camping</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠와</span><span class=\"en\"><b>with Dad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음으로</span><span class=\"en\"><b>for the first time.</b></span></div></div><div class=\"lec-sent-ko\">나는 처음으로 아빠와 캠핑을 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> under nature’s roof는 인공적인 건물을 벗어나 탁 트인 야외 공간에서 생활하게 됨을 비유적으로 표현한 것입니다. 앞 문장에서 언급한 &#39;캠핑&#39;이 구체적으로 어떤 환경에서 이루어지는 활동인지를 묘사하며 현장감을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We’re going to spend (관용표현): be going to + 동사원형 구조로, 가까운 미래에 예정된 일이나 계획을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for the first time</td><td class=\"m\">처음으로, 최초로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“우리는 하루를 보낼 거야</span><span class=\"en\"><b>“We’re going to spend the day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연의 지붕 아래에서.</span><span class=\"en\"><b>under nature’s roof.</b></span></div></div><div class=\"lec-sent-ko\">“우리는 자연의 지붕 아래에서 하루를 보낼 거야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> understand nature with a special key는 자연 속에 머무는 동안 마주하게 될 여러 현상의 원리를 파악하자는 제안입니다. So라는 접속사를 사용하여, 자연이라는 낯선 환경에 들어왔으니 그곳의 법칙을 아는 것이 중요하다는 논리적 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we should understand (조동사): 조동사(should) 뒤에 동사원형(understand)이 온 구조로, 당위나 권고의 의미를 나타낸다.</div><div class=\"lec-gr-item\">Dad said 1형식 구조: 주어(Dad)와 동사(said)로 이루어진 문장으로, 앞에 나온 직접 인용구가 실질적인 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 천성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 우리는 자연을 이해해야 해</span><span class=\"en\"><b>So, we should understand nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 열쇠로,”</span><span class=\"en\"><b>with a special key,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠가 말씀하셨다.</span><span class=\"en\"><b>Dad said.</b></span></div></div><div class=\"lec-sent-ko\">그래서 우리는 특별한 열쇠로 자연을 이해해야 해.” 아빠가 말씀하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> What’s the key?는 아빠가 던진 비유적인 표현인 &#39;열쇠&#39;에 대해 민호가 즉각적으로 반응하며 호기심을 보이는 대목입니다. 질문 형식을 통해 독자의 시선을 집중시키며, 다음 문장에서 이 글의 핵심 주제가 자연스럽게 드러나도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What’s the key (의문문): 의문사 What이 보어 역할을 하며, be동사가 주어(the key) 앞에 위치한 의문문 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">비결, 해결책, 핵심</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연, 천성</td></tr><tr><td class=\"w\">special</td><td class=\"m\">특별한, 특수한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그 열쇠가 뭐예요?”</span><span class=\"en\"><b>“What’s the key?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 물었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">I asked</span>.</b></span></div></div><div class=\"lec-sent-ko\">“그 열쇠가 뭐예요?” 내가 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Science는 아빠가 말한 &#39;특별한 열쇠&#39;의 정체이며, 이 글 전체를 관통하는 핵심 소재입니다. with a big smile은 아빠가 민호에게 과학이라는 도구가 딱딱한 공부가 아니라 세상을 이해하는 즐거운 방법임을 전달하려는 따뜻한 분위기를 형성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I asked 1형식 구조: 주어(I)와 자동사(asked)로 구성된 가장 기본적인 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">key</td><td class=\"m\">비결, 해결책, 핵심</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“과학이란다, 민호야,”</span><span class=\"en\"><b>“Science, Minho,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠가 대답하셨다</span><span class=\"en\"><b><span class=\"grammar-hl\">Dad answered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환하게 웃으며.</span><span class=\"en\"><b><span class=\"grammar-hl\">with a big smile</span>.</b></span></div></div><div class=\"lec-sent-ko\">“과학이란다, 민호야.” 아빠가 환하게 웃으며 대답하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> went camping with Dad for the first time은 이 글의 전체적인 배경을 설정하는 문장입니다. 주인공인 민호가 이전에는 해본 적 없는 새로운 경험을 시작하게 되었음을 알리며, 뒤이어 나올 아빠와의 대화가 자연스러운 맥락에서 이루어지도록 돕습니다. 2. “We’re going to spend the day under nature’s roof. under nature’s roof는 인공적인 건물을 벗어나 탁 트인 야외 공간에서 생활하게 됨을 비유적으로 표현한 것입니다. 앞 문장에서 언급한 &#39;캠핑&#39;이 구체적으로 어떤 환경에서 이루어지는 활동인지를 묘사하며 현장감을 더합니다. 3. So, we should understand nature with a special key,” Dad said. understand nature with a special key는 자연 속에 머무는 동안 마주하게 될 여러 현상의 원리를 파악하자는 제안입니다. So라는 접속사를 사용하여, 자연이라는 낯선 환경에 들어왔으니 그곳의 법칙을 아는 것이 중요하다는 논리적 근거를 제시합니다. 4. “What’s the key?” I asked. What’s the key?는 아빠가 던진 비유적인 표현인 &#39;열쇠&#39;에 대해 민호가 즉각적으로 반응하며 호기심을 보이는 대목입니다. 질문 형식을 통해 독자의 시선을 집중시키며, 다음 문장에서 이 글의 핵심 주제가 자연스럽게 드러나도록 유도합니다. 5. “Science, Minho,” Dad answered with a big smile. Science는 아빠가 말한 &#39;특별한 열쇠&#39;의 정체이며, 이 글 전체를 관통하는 핵심 소재입니다. with a big smile은 아빠가 민호에게 과학이라는 도구가 딱딱한 공부가 아니라 세상을 이해하는 즐거운 방법임을 전달하려는 따뜻한 분위기를 형성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Dad answered 1형식 구조: 주어(Dad)와 동사(answered)로 이루어진 구조이며, 뒤에 전치사구(with a big smile)가 수식어로 결합되어 있다.</div><div class=\"lec-gr-item\">with a big smile (관용표현): &#39;활짝 웃으며/환한 미소를 지으며&#39;라는 의미로, 전치사 with가 상태를 나타내는 부사구 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">science</td><td class=\"m\">과학, 학문</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>민호는 아빠와 처음으로 캠핑을 떠나 자연 속에서 하루를 보내게 된다.</li><li>아빠는 자연을 제대로 이해하기 위해 &#39;특별한 열쇠&#39;가 필요하다고 언급하며 민호의 호기심을 자극한다.</li><li>아빠가 제시한 그 열쇠는 바로 &#39;과학&#39;이며, 이는 캠핑 중 마주할 자연 현상을 과학적 원리로 풀어나갈 것임을 암시한다.</li><li>과학적 사고를 통해 주변 세상을 탐구하려는 긍정적인 태도를 강조하며 글을 시작한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Minho’s father introduces science as a special key to understanding nature while they spend time together outdoors.</div>\n              <div class=\"lec-final-sum-ko\">민호의 아버지는 야외에서 함께 시간을 보내는 동안 자연을 이해하기 위한 특별한 열쇠로 과학을 소개한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio":"./1_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");f
