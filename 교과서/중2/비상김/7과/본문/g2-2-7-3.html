</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 비상(황) 7과 본문3","audioDir":"g2-2-7-3_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>비상(황)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Why I Love Singapore's Hawker Culture\u003c/h1>\u003ch2>내가 싱가포르의 호커 문화를 사랑하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>싱가포르의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>는 길거리 음식 장수들이 만든 거대한 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>로, 온갖 음식과 다양한 사람들이 모여 모두가 좋아하는 음식을 함께 즐길 수 있는 곳이에요. 서로 다른 나라 출신의 친구들도 낯선 사람과 친구가 되는 이곳의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 화자는 사랑한다고 말해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Singapore's hawker centers are a huge, diverse food community where everyone can find food they like and even make friends, which is why the speaker loves the hawker culture.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 싱가포르의 호커 센터 이야기를 함께 읽어 볼 거예요. 이 글은 화자 Vivian이 자신이 사랑하는 호커 문화를 소개하는 글이에요. 길거리 음식 장수인 호커들이 만든 호커 센터가 어떻게 거대한 음식 공동체가 되었는지, 그리고 왜 화자가 이 문화를 좋아하는지가 핵심이에요. 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">싱가포르는 중국계, 말레이계, 인도계 등 여러 민족이 함께 사는 다문화 사회예요. 그래서 다양한 음식 문화가 자연스럽게 발달했죠. 길거리에서 음식을 파는 사람들을 \u003cb class=\"key\">호커(hawker)\u003c/b>라고 부르고, 이들이 모여 만든 공간이 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터(hawker \u003c/b>\u003cb class=\"key\">center)\u003c/b>예요. 호커 센터는 값싸고 맛있는 음식을 한곳에서 먹을 수 있는 공공 식당가로, 유네스코 인류무형문화유산(UNESCO Intangible Cultural Heritage)으로 등재될 만큼 세계적으로 인정받았어요. 우리나라로 치면 광장시장 같은 전통 시장의 먹자골목과 비슷하다고 보면 이해하기 쉬워요. 이렇게 여러 사람이 한 공간에서 음식을 나눠 먹는 경험은 자연스럽게 \u003cb class=\"key\">공동체 \u003c/b>\u003cb class=\"key\">의식(community \u003c/b>\u003cb class=\"key\">spirit)\u003c/b>으로 이어져요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 싱가포르는 중국계, 말레이계, 인도계 등 여러 민족이 함께 사는 다문화 사회예요. 그래서 다양한 음식 문화가 자연스럽게 발달했죠. 길거리에서 음식을 파는 사람들을 호커라고 부르고, 이들이 모여 만든 공간이 호커 센터예요. 호커 센터는 값싸고 맛있는 음식을 한곳에서 먹을 수 있는 공공 식당가로, 유네스코 인류무형문화유산으로 등재될 만큼 세계적으로 인정받았어요. 우리나라로 치면 광장시장 같은 전통 시장의 먹자골목과 비슷하다고 보면 이해하기 쉬워요. 이렇게 여러 사람이 한 공간에서 음식을 나눠 먹는 경험은 자연스럽게 공동체 의식으로 이어져요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입과 질문\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자인 Vivian이 자신을 소개하며 글을 시작해요. 이어서 독자에게 싱가포르의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>에 대해 들어 본 적이 있는지 \u003cb class=\"key\">질문\u003c/b>을 던져요. 이 질문은 글 전체에서 다룰 주제를 자연스럽게 끌어내는 역할을 해요. 독자는 이 질문 덕분에 앞으로 호커 센터에 대한 설명이 이어지리라는 것을 예상할 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정의와 특징\u003csmall>설명 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>먼저 \u003cb class=\"key\">호커\u003c/b>가 길거리에서 음식을 파는 사람들이라고 정의해요. 그들이 모여 만든 호커 센터가 거대한 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>가 되었다고 설명하죠. 이 센터는 사람들로 가득 찰 만큼 인기가 많고, 중국식 국수부터 인도네시아 사테까지 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 있다는 점을 예를 들어 보여 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>다름을 넘는 공통점\u003csmall>전환 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>이제 화자 자신의 경험으로 초점이 옮겨가요. 친구들과 화자는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">나라\u003c/b> 출신이고 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">취향\u003c/b>도 모두 달라요. 하지만 호커 센터에서는 언제나 \u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">음식\u003c/b>을 찾을 수 있다고 말하며, 다름이 문제가 되지 않는다는 점을 강조해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>교류와 결론\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>때때로 낯선 사람과 테이블을 함께 쓰다가 \u003cb class=\"key\">친구\u003c/b>가 되기도 한다고 해요. 좋은 사람들과 음식을 즐기는 \u003cb class=\"key\">즐거움\u003c/b>을 전하고, 그래서 자신이 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 사랑한다는 결론으로 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 도입 부분이에요. 화자 Vivian이 자신을 소개하며 글을 열고, 독자에게 싱가포르의 호커 센터에 대해 들어 본 적이 있는지 질문을 던져요. 이 질문은 앞으로 다룰 주제를 자연스럽게 끌어내는 역할을 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 정의와 특징이 나와요. 호커가 길거리에서 음식을 파는 사람들이라고 정의하고, 그들이 만든 호커 센터가 거대한 음식 공동체가 되었다고 설명해요. 또 사람들로 가득 찰 만큼 인기가 많고, 중국식 국수부터 인도네시아 사테까지 다양한 음식이 있다는 점을 예로 들어 보여 주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전환이에요. 친구들과 화자는 서로 다른 나라 출신이고 음식 취향도 모두 달라요. 그런데도 호커 센터에서는 언제나 좋아하는 음식을 찾을 수 있다고 말하면서, 다름이 문제가 되지 않는다는 점을 강조해요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 때때로 낯선 사람과 테이블을 함께 쓰다가 친구가 되기도 한다고 해요. 좋은 사람들과 음식을 즐기는 즐거움을 전하고, 그래서 자신이 호커 문화를 사랑한다는 말로 글을 맺어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 두 번째 문장에서 호커 센터에 대해 들어 본 적이 있는지 \u003cb class=\"key\">질문\u003c/b>을 던지고, 그다음부터 정의와 구체적 예시로 답을 풀어 가는 질문-답변 구조예요. 호커의 정의, 센터의 인기, 다양한 음식 같은 예가 이어지다가 마지막 문장에서 그래서 내가 이 호커 문화를 사랑한다는 \u003cb class=\"key\">결론\u003c/b>이 나와요. 따라서 핵심 주장이 글의 끝에 제시되는 \u003cb class=\"key\">미괄식\u003c/b> 구성이라고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Have you heard of (2)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>so ~ that (5)\u003c/b>\u003cspan>인과·강조\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>That's why (12)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">hawker centers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these centers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the hawker centers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this hawker culture\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>서로 다른 우리\u003c/th>\u003cth>하나로 이어 주는 호커 센터\u003c/th>\u003c/tr>\u003ctr>\u003ctd>친구들과 나는 서로 다른 나라 출신\u003c/td>\u003ctd>중국식 국수부터 인도네시아 사테까지 온갖 음식\u003c/td>\u003c/tr>\u003ctr>\u003ctd>우리는 모두 음식 취향이 다름\u003c/td>\u003ctd>우리가 좋아하는 것을 항상 찾을 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답변 구조예요. 두 번째 문장에서 호커 센터에 대해 들어 본 적이 있는지 질문을 던지고, 그다음부터 정의와 예시로 답을 풀어 가죠. 그리고 마지막 문장에서 내가 이 호커 문화를 사랑한다는 결론이 나와요. 그래서 핵심 주장이 글의 끝에 제시되는 미괄식 구성이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 하나씩 짚어 볼게요. 두 번째 문장의 Have you heard of는 질문을 던지며 주제를 꺼내는 신호예요. 다섯 번째 문장의 so와 that은 인기 있는 정도를 강조하는 표현이죠. 그리고 아홉 번째 문장의 But은 앞의 내용을 뒤집는 전환이고, 마지막 문장의 That's why는 결론을 이끄는 신호예요. 또 hawker centers를 these centers, the hawker centers, this hawker culture처럼 바꿔 가며 같은 대상을 다시 가리키는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hear of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 들어 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hawker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길거리 음식 장수\u003c/span>\u003c/div>\u003cdiv>\u003cb>center\u003c/b>\u003cem>명사\u003c/em>\u003cspan>센터, 중심지\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>street\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리, 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 아주 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u0 -tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">famous\u003c/span>\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">disliked\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">giant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"s\">relish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">form\u003c/b>\u003cspan class=\"m\">형성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stranger\u003c/b>\u003cspan class=\"m\">낯선 사람\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outsider\u003c/span>\u003cspan class=\"s\">unknown person\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">friend\u003c/span>\u003cspan class=\"a\">acquaintance\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 동의어와 반의어를 정리해 볼게요. popular는 인기 있는이라는 뜻으로 famous, well-liked와 비슷하고, 반대말은 unpopular예요. huge는 거대한이라는 뜻으로 enormous, massive와 가깝고, 반대말은 tiny나 small이에요. different는 다른이라는 뜻으로 various, diverse와 비슷하고, 반대말은 same이나 similar죠. enjoy는 즐기다라는 뜻으로 like, love와 가깝고, 반대말은 dislike나 hate예요. 이렇게 짝을 지어 외우면 시험에서 바꿔 쓰기 문제가 나와도 흔들리지 않아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 ~이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vivian이에요!\u003c/span>\u003cspan class=\"en\">Vivian!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 Vivian이에요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 자신의 이름을 밝히며 이야기를 시작하는 \u003cb class=\"key\">도입부\u003c/b>예요. 처음에 자기소개를 하고 나서 뒤에서 싱가포르 호커 센터 이야기를 꺼내게 되죠. 자기소개로 \u003cb class=\"key\">화제\u003c/b>를 여는 아주 전형적인 방식이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 축약형 (I am → I'm)\u003c/span> : 주어 I + be동사 am → I'm : \"저는 ~이에요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"I'm, 저는 ~이에요. Vivian!, Vivian이에요!. 이 문장 전체를 해석하면, 저는 Vivian이에요!","hl":"m"},{"n":13,"text":"이 문장은 글쓴이가 자기 이름을 밝히면서 이야기를 시작하는 도입부예요. 먼저 자신을 소개하고 나서, 뒤에서 싱가포르의 호커 센터 이야기를 꺼내게 되죠. 이렇게 자기소개로 화제를 여는 건 아주 전형적인 방식이에요.","hl":"mn"},{"n":14,"text":"여기서 I'm은 I am이 줄어든 축약형이에요. be동사 am이 주어 I 뒤에서 붙어서 I'm이 된 거죠. 회화에서는 I am이라고 또박또박 말하기보다 I'm이라고 줄여서 말하는 게 훨씬 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 ~한 적 있나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대해 들어 본\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호커 센터를\u003c/span>\u003cspan class=\"en\">hawker centers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">싱가포르에 있는?\u003c/span>\u003cspan class=\"en\">in Singapore?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 싱가포르에 있는 호커 센터에 대해 들어 본 적 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 질문을 던져 \u003cb class=\"key\">흥미\u003c/b>를 끄는 문장이에요. 낯선 개념인 호커 센터를 먼저 꺼내면서 앞으로 설명할 \u003cb class=\"key\">주제\u003c/b>를 제시하죠. 바로 다음 문장에서 호커가 무엇인지 정의해 주니, 다음 내용을 예고하는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 의문문 (경험 용법)\u003c/span> : Have + 주어 + 과거분사(heard) ~? : \"~해 본 적 있나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 hear of\u003c/span> : hear of + 명사 (of는 전치사) : \"~에 대해 들어 보다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Have you, 여러분은 ~한 적 있나요. heard of, ~에 대해 들어 본. hawker centers, 호커 센터를. in Singapore?, 싱가포르에 있는?. 이 문장 전체를 해석하면, 여러분은 싱가포르에 있는 호커 센터에 대해 들어 본 적 있나요?","hl":"m"},{"n":16,"text":"이 문장은 독자에게 질문을 던져서 흥미를 끄는 문장이에요. 낯선 개념인 호커 센터를 먼저 꺼내 놓고, 앞으로 그게 뭔지 설명하겠다는 신호를 주는 거죠. 그래서 이 문장은 글 전체의 주제를 여는 역할을 해요.","hl":"mn"},{"n":17,"text":"여기서 Have you heard는 현재완료를 쓴 의문문이에요. 과거에 들어서 지금 알고 있는 경험을 물을 때 현재완료를 써서 지금까지 들어 본 적이 있냐는 뜻을 만들어요. 그리고 heard of는 hear of라는 구동사인데, ~의 존재를 들어서 알다는 뜻으로 전치사 of 뒤에 목적어가 오는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호커는\u003c/span>\u003cspan class=\"en\">Hawkers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 말해요\u003c/span>\u003cspan class=\"en\">are people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 파는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">sell \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길거리에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">street\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">호커는 길거리에서 음식을 파는 사람들을 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 호커가 무엇인지 \u003cb class=\"key\">정의\u003c/b>해 주는 문장이에요. 앞 문장의 질문에 답하듯 낯선 단어의 뜻을 풀어 주죠. \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">who\u003c/b>가 people을 꾸며 '길거리에서 음식을 파는 사람들'이라는 뜻을 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 who (주격)\u003c/span> : 선행사(people) + who + 동사(sell) + 목적어(food) : \"음식을 파는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 역할\u003c/span> : sell + 목적어(food) + [on the street (전치사구/장소)] : \"길거리에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Hawkers, 호커는. are people, 사람들을 말해요. who sell food, 음식을 파는. on the street, 길거리에서.. 이 문장 전체를 해석하면, 호커는 길거리에서 음식을 파는 사람들을 말해요.","hl":"m"},{"n":19,"text":"이 문장은 호커가 무엇인지 정의해 주는 문장이에요. 앞에서 던진 질문에 답하듯이 낯선 단어의 뜻을 풀어 주는 거죠. 사람을 가리키는 people 뒤에 관계대명사 who가 붙어서 길거리에서 음식을 파는 사람들이라는 뜻을 완성해요.","hl":"mn"},{"n":20,"text":"먼저 who sell food에서 who는 주격 관계대명사예요. 사람을 가리키는 선행사 people을 대신해서 주어 역할을 하면서 뒤에 오는 절을 이끌어 주죠. 그래서 who가 people을 대신하니까 동사도 복수 형태인 sell을 써요. 그리고 on the street는 전치사구로, 동사 sell을 꾸며서 어디서 파는지를 알려 주는 장소의 부사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 만들었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">formed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호커 센터를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hawker \u003c/span>\u003cspan class=\"tgt\">centers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이 센터들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> these centers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 음식 공동체가\u003c/span>\u003cspan class=\"en\">a huge food community.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 호커 센터를 만들었고, 이 센터들이 거대한 음식 공동체가 되었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 호커들이 모여 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>를 만들었다는 사실을 먼저 말하고, 그렇게 만들어진 센터들이 지금은 거대한 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>가 되었다는 뜻이에요. 과거에 만든 일과 지금까지 이어진 결과를 \u003cb class=\"key\">현재완료\u003c/b>로 나누어 보여 주는 문장이에요. 앞 문장에서 호커가 길에서 음식을 파는 사람들이라고 했으니, 그 사람들이 뭉쳐 만든 공간이 지금은 큰 음식 공동체가 되었다는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순과거(과거시제)\u003c/span> : [주어] + [동사 과거형] + [목적어] : \"그들이 호커 센터를 만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : [절] + and + [절] : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료(완료·결과)\u003c/span> : have/has + [과거분사] : \"되어 (지금은 ...이 되었어요)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They formed, 그들이 만들었어요. the hawker centers, 호커 센터를. and these centers, 그리고 이 센터들이. have become, 되어. a huge food community, 거대한 음식 공동체가. 이 문장 전체를 해석하면, 그들이 호커 센터를 만들었고, 이 센터들이 거대한 음식 공동체가 되었어요.","hl":"m"},{"n":22,"text":"이 문장은 과거와 현재를 한 번에 보여 줘요. 호커들이 모여서 호커 센터를 만들었고, 그렇게 만들어진 센터들이 지금은 거대한 음식 공동체가 되었다는 거죠. 그래서 앞부분은 과거의 일, 뒷부분은 현재까지 이어진 결과를 현재완료로 보여 주고 있어요.","hl":"mn"},{"n":23,"text":"먼저 They formed the hawker centers를 보세요. 동사 form의 과거형 formed를 써서 이미 지나간 일을 나타내는 과거형이에요. 지금 상태가 아니라 만들었다는 과거의 사실만 말하는 단순과거죠. 두 번째로 and는 두 개의 절을 대등하게 이어 주는 등위접속사예요. 세 번째로 have become은 현재완료인데, 과거에 시작된 일이 지금 와서 거대한 음식 공동체가 되어 있다는 결과를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 센터들은\u003c/span>\u003cspan class=\"en\">These centers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 인기 있어서\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"l hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 종류의 음식들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">kinds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국식 국수부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">Chinese \u003c/span>\u003cspan class=\"tgt\">noodles \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말레이시아식 카레,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Malaysian \u003c/span>\u003cspan class=\"tgt\">curry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도네시아식 사테까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Indonesian \u003c/span>\u003cspan class=\"tgt\">satay\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국식 국수부터 말레이시아식 카레, 인도네시아식 사테까지 모든 종류의 음식들이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 호커 센터에는 정말 다양한 음식이 있다는 것을 \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">are\u003c/b>로 먼저 알려 주고, 그 예를 \u003cb class=\"key\">from \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">B\u003c/b> 표현으로 이어서 보여 줘요. 중국식 국수에서 시작해 말레이시아식 카레, 인도네시아식 사테까지 나라별 음식을 죽 늘어놓아서 '모든 종류'라는 말을 구체적으로 뒷받침해요. 여러 나라 음식이 한곳에 모여 있다는 \u003cb class=\"key\">다양성\u003c/b>을 강조하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(존재 구문)\u003c/span> : There + be동사 + [명사] : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B (범위 표현)\u003c/span> : from + [시작] + to + [끝] : \"A부터 B까지\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"There are, 있어요. all kinds of food, 모든 종류의 음식들이. from Chinese noodles, 중국식 국수부터. to Malaysian curry, 말레이시아식 카레. to Indonesian satay, 인도네시아식 사테까지. 이 문장 전체를 해석하면, 중국식 국수부터 말레이시아식 카레, 인도네시아식 사테까지 모든 종류의 음식들이 있어요.","hl":"m"},{"n":28,"text":"이 문장은 호커 센터에 얼마나 다양한 음식이 있는지 보여 줘요. There are로 모든 종류의 음식이 있다고 먼저 말하고, from A to B로 그 예를 중국식 국수부터 인도네시아식 사테까지 죽 이어서 보여 주는 거죠. 여러 나라 음식이 한곳에 모여 있다는 다양성을 강조하는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 There are all kinds of food를 보세요. 무엇이 있다고 말할 때 주어 자리에 There를 세우고 be동사를 쓰는 존재 구문이에요. 뒤에 오는 명사가 복수라서 be동사도 are가 되었어요. 두 번째로 from Chinese noodles to Malaysian curry to Indonesian satay는 from과 to로 시작과 끝을 묶어 범위를 나타내는 표현이에요. 여기서는 to를 한 번 더 써서 예를 나열하면서 이것부터 저것까지 전부라는 느낌을 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 친구들과 저는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">friends \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">출신이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 나라\u003c/span>\u003cspan class=\"en\">different countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제 친구들과 저는 서로 다른 나라 출신이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들과 Vivian이 각각 다른 나라 \u003cb class=\"key\">출신\u003c/b>임을 밝히는 문장이에요. 서로 다른 나라에서 왔다는 정보가 바로 뒤에 나오는 음식 취향 차이의 \u003cb class=\"key\">배경\u003c/b>이 되어 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 인칭대명사의 병렬(주어)\u003c/span> : [My friends (명사구)] + and + [I (주격대명사)] → 문장의 주어 : \"제 친구들과 저는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 전치사 from(출신 표현)\u003c/span> : [주어] + be동사 + from + [출신지] : \"출신이에요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"My friends and I, 제 친구들과 저는. are from, 출신이에요. different countries, 서로 다른 나라. 이 문장 전체를 해석하면, 제 친구들과 저는 서로 다른 나라 출신이에요.","hl":"m"},{"n":31,"text":"이 문장은 친구들과 Vivian이 각각 다른 나라 출신임을 알려 줘요. 서로 다른 나라에서 왔다는 정보가 뒤에 나오는 음식 취향 차이의 배경이 되어 준답니다.","hl":"mn"},{"n":32,"text":"어법 포인트 하나, My friends and I처럼 주어를 and로 병렬로 연결할 때는 뒤에 오는 대명사도 주격 형태인 I를 써야 해요. 어법 포인트 둘, are from은 be동사 뒤에 전치사 from을 붙여 출신을 나타내는 표현이에요. 주어가 복수라서 be동사는 are가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 음식 취향을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">tastes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 모두 음식 취향이 달라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 모두가 서로 다른 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">취향\u003c/b>을 가지고 있다는 뜻이에요. 앞 문장에서 국적이 다르다고 했으니, 자연스럽게 취향도 \u003cb class=\"key\">각자 \u003c/b>\u003cb class=\"key\">다르다\u003c/b>는 흐름으로 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">all의 위치(주어 강조)\u003c/span> : [주어] + all + [일반동사] : \"우리 모두는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">have + 목적어(소유 표현)\u003c/span> : [주어] + have + [목적어] : \"서로 다른 음식 취향을 가지고 있어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We all, 우리 모두는. have, 가지고 있어요. different food tastes, 서로 다른 음식 취향을. 이 문장 전체를 해석하면, 우리는 모두 음식 취향이 달라요.","hl":"m"},{"n":34,"text":"이 문장은 우리 모두가 서로 다른 음식 취향을 가지고 있다는 뜻이에요. 앞 문장에서 국적이 다르다고 했으니 자연스럽게 취향도 각자 다르다는 흐름으로 이어지죠.","hl":"mn"},{"n":35,"text":"어법 포인트 하나, all이 주어를 강조할 때는 일반동사 앞에 놓여요. 그래서 We all have 순서가 되죠. 어법 포인트 둘, have는 가지다라는 뜻의 일반동사이고 뒤에 목적어 different food tastes가 와요. taste는 여기서 취향이라는 뜻의 셀 수 있는 명사라서 복수형 tastes로 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호커 센터에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hawker \u003c/span>\u003cspan class=\"tgt\">centers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 항상 찾을 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 좋아하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 호커 센터에서 우리는 항상 우리가 좋아하는 것을 찾을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But으로 시작해서 앞의 '취향이 다르다'는 내용을 \u003cb class=\"key\">역접\u003c/b>으로 뒤집는 문장이에요. 취향이 달라도 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>에서는 누구나 좋아하는 음식을 찾을 수 있다는 뜻이죠. 그래서 이 문장이 글 전체에서 \u003cb class=\"key\">핵심\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : at + [장소 명사] → 문장 앞에서 장소를 나타내는 부사구 : \"호커 센터에서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 always의 위치\u003c/span> : [주어] + can + [빈도부사 always] + [동사원형] : \"우리는 항상 찾을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사 something] + [(that/which) + 주어 + 동사] (목적격 관계대명사 생략) : \"우리가 좋아하는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But, 하지만. at the hawker centers, 호커 센터에서는. we can always find, 우리는 항상 찾을 수 있어요. something we like, 우리가 좋아하는 것을. 이 문장 전체를 해석하면, 하지만 호커 센터에서 우리는 항상 우리가 좋아하는 것을 찾을 수 있어요.","hl":"m"},{"n":37,"text":"이 문장은 But으로 시작해서 앞에서 말한 취향이 다르다는 내용을 역접으로 뒤집어 줘요. 취향이 달라도 호커 센터에서는 누구나 좋아하는 음식을 찾을 수 있다는 뜻이죠. 그래서 이 문장이 글 전체에서 핵심이 되는 문장이랍니다.","hl":"mn"},{"n":38,"text":"어법 포인트 하나, at the hawker centers처럼 전치사구가 문장 앞에 나오면 호커 센터에서는이라는 뜻으로 뒤 문장 전체를 꾸며 줘요. 어법 포인트 둘, 조동사 can이 있으면 빈도부사 always는 can과 동사원형 find 사이에 들어가요. 어법 포인트 셋, something we like에서 something은 선행사이고 목적격 관계대명사는 생략할 수 있어서 바로 we like가 이어진답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로,\u003c/span>\u003cspan class=\"en\">Sometimes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 테이블을 함께 쓰다가\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">share \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tables \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낯선 사람들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">strangers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 결국\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구가 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">becoming\u003c/span> friends.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 우리는 낯선 사람들과 테이블을 함께 쓰다가 친구가 되기도 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자는 낯선 사람들과 같은 테이블을 함께 쓰는 상황을 말하며, 그 만남이 \u003cb class=\"key\">친구\u003c/b>가 되는 계기로 이어진다고 해요. 'end up becoming'은 우연한 결과로 '결국 ~하게 되다'라는 뜻으로 \u003cb class=\"key\">결과\u003c/b>의 흐름을 나타내요. 낯선 사람과의 만남이 좋은 \u003cb class=\"key\">관계\u003c/b>로 이어진다는 따뜻한 분위기를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">share A with B (A를 B와 함께 쓰다)\u003c/span> : share [목적어 A] + with + [상대 B] : \"낯선 사람들과 테이블을 함께 쓰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">end up + 동명사(결국 ~하게 되다)\u003c/span> : end up + [동명사(-ing)] : \"결국 친구가 되다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Sometimes, 때때로. we share the tables, 우리는 테이블을 함께 쓰다가. with strangers, 낯선 사람들과. and end up, 그리고 결국. becoming friends, 친구가 되는. 이 문장 전체를 해석하면, 때때로 우리는 낯선 사람들과 테이블을 함께 쓰다가 친구가 되기도 해요.","hl":"m"},{"n":40,"text":"이 문장은 낯선 사람들과 같은 테이블을 함께 쓰는 상황을 말해요. 그리고 그 만남이 우연히 친구가 되는 결과로 이어진다는 거죠. 여기서 end up becoming은 결국 어떻게 되다, 라는 결과의 흐름을 나타내는 표현이에요. 낯선 사람과의 만남이 관계로 이어진다는 따뜻한 분위기를 잘 보여 주는 문장입니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법은 share A with B입니다. share는 타동사라서 함께 쓰는 대상이 목적어로 오고, 함께하는 상대는 with 뒤에 옵니다. 그래서 share the tables with strangers는 낯선 사람들과 테이블을 함께 쓴다는 뜻이 돼요. 두 번째는 end up becoming friends인데, end up 뒤에는 동명사가 와서 결국 어떻게 되다, 라는 뜻을 만들어요. to부정사가 아니라 동명사가 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 재미있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">fun \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 즐기는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 사람들과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">좋은 사람들과 함께 음식을 즐기는 건 재미있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉으로 보면 It이 주어 같지만 실제 주어는 뒤에 있는 \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">enjoy\u003c/b>이고, It은 \u003cb class=\"key\">가주어\u003c/b>예요. 그래서 '좋은 사람들과 음식을 즐기는 것'이 \u003cb class=\"key\">재미있다\u003c/b>는 뜻이 되죠. 함께 먹는 즐거움이 호커 문화의 매력이라는 흐름을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It is [형용사] + [to부정사(진주어)] : \"음식을 즐기는 것은 재미있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with(~와 함께)\u003c/span> : with + [사람/사물] : \"좋은 사람들과 함께\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It is fun, 그것은 재미있어요. to enjoy the food, 음식을 즐기는 것은. with good people, 좋은 사람들과 함께. 이 문장 전체를 해석하면, 좋은 사람들과 함께 음식을 즐기는 건 재미있어요.","hl":"m"},{"n":43,"text":"이 문장은 겉으로 보면 It이 주어인 것 같지만, 사실 진짜 주어는 뒤에 있는 to enjoy 이하예요. 앞의 It은 가주어라고 해서 진주어 자리를 대신 채워 주는 역할을 하죠. 그래서 좋은 사람들과 함께 음식을 즐기는 것이 재미있다는 뜻이 되고, 함께 먹는 즐거움이 호커 문화의 매력이라는 흐름으로 이어집니다.","hl":"mn"},{"n":44,"text":"첫 번째 어법은 가주어 it과 진주어 to부정사입니다. 문장이 It is fun to enjoy the food로 시작하는데, It은 진주어인 to enjoy the food를 뒤로 보내고 그 자리를 채우는 가주어예요. 두 번째는 with good people인데, 여기서 with는 함께라는 뜻으로 상대를 나타냅니다. 해석할 때는 뒤의 to부정사부터 우리말로 옮겨서 음식을 즐기는 것이 재미있다, 라고 읽으면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그게 바로 ~한 이유예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003cspan class=\"tgt\">why\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 사랑하는\u003c/span>\u003cspan class=\"en\">I love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 호커 문화를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">hawker \u003c/span>\u003cspan class=\"tgt\">culture\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그게 제가 이 호커 문화를 사랑하는 이유예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> That은 바로 앞 문장의 \u003cb class=\"key\">내용\u003c/b> 전체를 가리키고, why는 '~하는 \u003cb class=\"key\">이유\u003c/b>'를 이끌어요. 그래서 '그게 바로 내가 이 호커 문화를 사랑하는 이유'라는 뜻이에요. 지문 전체를 \u003cb class=\"key\">마무리\u003c/b>하며 화자의 애정을 정리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 why(이유) / That = 앞 내용\u003c/span> : That's why + [주어 + 동사(완전한 절)] : \"그게 바로 ~한 이유예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 this(바로 이)\u003c/span> : this + [단수명사] : \"바로 이 호커 문화\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"That's why, 그게 바로 ~한 이유예요. I love, 내가 사랑하는. this hawker culture, 이 호커 문화를. 이 문장 전체를 해석하면, 그게 제가 이 호커 문화를 사랑하는 이유예요.","hl":"m"},{"n":46,"text":"여기서 That은 바로 앞 문장의 내용 전체를 가리키는 말이에요. why는 이유를 이끄는 말이고요. 그래서 그게 바로 내가 이 호커 문화를 사랑하는 이유라는 뜻이 됩니다. 지문 전체를 마무리하면서 화자의 애정을 정리하는 문장이에요.","hl":"mn"},{"n":47,"text":"첫 번째 어법은 That's why입니다. 여기서 That은 앞 문장의 내용 전체를 받는 지시대명사이고, why는 이유를 이끄는 관계부사예요. That's why 뒤에는 주어와 동사가 다 있는 완전한 절이 와서 그게 바로 어떻게 하는 이유야, 라는 뜻을 만들어요. 두 번째는 this hawker culture인데, this는 바로 이라고 가까운 대상을 가리키는 지시형용사예요. 그래서 바로 이 호커 문화라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자 Vivian은 싱가포르의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>에 대해 소개하며 글을 시작해요.\u003c/li>\u003cli>\u003cb class=\"key\">호커\u003c/b>는 길거리에서 음식을 파는 사람들이고, 이들이 만든 호커 센터는 사람들로 가득 찬 거대한 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>가 되었어요.\u003c/li>\u003cli>친구들은 서로 다른 나라 출신에 음식 취향도 다르지만, 호커 센터에서는 언제나 \u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">음식\u003c/b>을 찾을 수 있어요.\u003c/li>\u003cli>낯선 사람과 테이블을 함께 쓰다 친구가 되기도 하는 이곳에서, 화자는 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 사랑한다고 말하며 글을 맺어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Singapore's hawker centers are a huge, diverse food community where everyone can find food they like and even make friends, which is why the speaker loves the hawker culture.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">싱가포르의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">센터\u003c/b>는 길거리 음식 장수들이 만든 거대한 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>로, 온갖 음식과 다양한 사람들이 모여 모두가 좋아하는 음식을 함께 즐길 수 있는 곳이에요. 서로 다른 나라 출신의 친구들도 낯선 사람과 친구가 되는 이곳의 \u003cb class=\"key\">호커 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 화자는 사랑한다고 말해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 글을 정리해 볼게요. 이 글은 싱가포르의 호커 센터와 호커 문화를 소개하면서, 다양한 음식과 사람들이 어우러지는 공간의 매력을 전해요. 서로 다른 나라 출신이고 취향도 다른 친구들이 한 테이블에서 낯선 사람과 친구가 되는 모습이 인상적이죠. 핵심은 다양한 음식과 사람을 하나로 이어 주는 호커 문화라는 점이에요. 오늘도 수고 많았어요, 다음 시간에 또 만나요!","hl":null}]}]});</script></body></html>
