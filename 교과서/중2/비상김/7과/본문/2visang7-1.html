@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 비상(황) 7과 본문1","audioDir":"2visang7-1_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>비상(황)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Minchan's Family Gimjang Story\u003c/h1>\u003ch2>민찬이네 가족의 김장 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 겨울을 앞두고 온 가족이 모여 \u003cb class=\"key\">김장\u003c/b>을 통해 한국의 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">전통\u003c/b>과 \u003cb class=\"key\">가족의 \u003c/b>\u003cb class=\"key\">유대감\u003c/b>을 나누는 모습을 소개하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Gimjang is a Korean cultural tradition that brings family members together to make kimchi and share special time.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 중학교 비상 황 7과 첫 번째 본문 내용을 함께 공부할 거예요. 민찬이가 소개하는 한국의 대표적인 전통인 김장에 관한 이야기죠. 글 전체의 요약과 요지를 짚어보며 내용을 차근차근 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">김장은 한국에서 겨울을 대비해 대량의 김치를 담그는 전통 행사이자 공동체 문화입니다. 영어로는 \u003cb class=\"key\">making \u003c/b>\u003cb class=\"key\">kimchi\u003c/b>로 단순 번역되기도 하지만, 단순한 요리 \u003cb class=\"key\">cooking\u003c/b>을 넘어 가족과 이웃이 함께 모여 협력하는 \u003cb class=\"key\">community \u003c/b>\u003cb class=\"key\">cooperation\u003c/b>의 의미를 담고 있습니다. 이는 마치 서양의 추수감사절 디너 준비 \u003cb class=\"key\">Thanksgiving \u003c/b>\u003cb class=\"key\">dinner \u003c/b>\u003cb class=\"key\">preparation\u003c/b>처럼 가족이 결속을 다지는 소중한 시간입니다. 이러한 \u003cb class=\"key\">cultural \u003c/b>\u003cb class=\"key\">heritage\u003c/b>는 세대를 이어 전해지며 한국인의 정체성을 형성합니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 지문 독해에 앞서 배경지식을 먼저 살펴볼게요. 김장은 단순한 요리가 아니라 공동체 협력과 가족의 유대를 다지는 중요한 문화적 유산이에요. 서양의 추수감사절 준비처럼 우리에게는 김장이 가족을 하나로 묶어주는 소중한 시간이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입과 현장 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>말하기 주체인 민찬이가 자신을 소개하고, 겨울을 앞두고 \u003cb class=\"key\">할머니 \u003c/b>\u003cb class=\"key\">댁\u003c/b>에 모여 \u003cb class=\"key\">가족\u003c/b>과 함께 \u003cb class=\"key\">김장\u003c/b>을 하고 있는 현재 상황을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>김장의 정의와 전통\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>질문을 던진 뒤 \u003cb class=\"key\">김장\u003c/b>이 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">전통\u003c/b>이라고 설명하며 개념을 구체화합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>김장의 확장된 의미\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">김장\u003c/b>은 단순히 김치를 만드는 것을 넘어 \u003cb class=\"key\">가족과 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 보내는 의미를 지니며, 함께 모이는 것이 늘 좋다는 점을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>독자 참여 유도\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>독자들에게도 비슷한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">전통\u003c/b>이 있는지 묻는 질문으로 글을 마무리하며 공감을 이끌어냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 문장부터 마지막 문장까지 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 민찬이가 자신을 소개하고 할머니 댁에서 가족과 함께 김장을 하고 있는 현재 상황을 보여줘요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 김장이 무엇인지 질문을 던지고 겨울이 오기 전에 김치를 담그는 한국의 문화적 전통이라고 설명해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 김장이 김치를 만드는 것 이상이며 가족과 시간을 보내는 소중한 의미를 지닌다고 강조해요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 독자들에게도 특별한 음식 전통이 있는지 묻는 질문으로 따뜻하게 글을 마무리해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 민찬이의 인사와 현장 방문으로 시작해 \u003cb class=\"key\">What \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">gimjang?\u003c/b>이라는 질문을 던지고, 바로 다음 문장에서 정의를 내려줍니다. 이후 김장이 가진 더 깊은 의미인 \u003cb class=\"key\">가족과의 \u003c/b>\u003cb class=\"key\">시간\u003c/b>으로 내용을 확장하며 독자에게 질문을 던지는 \u003cb class=\"key\">두괄식 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What is (3)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>It is (4)\u003c/b>\u003cspan>정의 설명\u003c/span>\u003cb>more than (5)\u003c/b>\u003cspan>의미 확장\u003c/span>\u003cb>Also (6)\u003c/b>\u003cspan>추가 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">gimjang\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Korean cultural tradition\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">making kimchi\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spending time with family\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이번 지문은 질문을 던지고 바로 답변을 한 뒤 의미를 확장하는 두괄식 구조로 되어 있어요. 민찬이가 김장이 무엇인지 묻고 그 정의와 추가적인 의미를 차례대로 풀어내는 방식이죠.","hl":"ty"},{"n":9,"text":"문장 속 신호어들을 살펴보면 What is라는 질문 제기와 It is라는 정의 표현이 잘 나타나 있어요. 또한 more than과 also를 통해 김장의 의미가 단순한 음식 만들기를 넘어 가족과의 시간으로 확장된다는 점을 명확히 보여주고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandmother\u003c/b>\u003cem>명사\u003c/em>\u003cspan>할머니\u003c/span>\u003c/div>\u003cdiv>\u003cb>house\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집\u003c/span>\u003c/div>\u003cdiv>\u003cb>do\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gimjang\u003c/b>\u003cem>명사\u003c/em>\u003cspan>김장\u003c/span>\u003c/div>\u003cdiv>\u003cb>what\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>무엇\u003c/span>\u003c/div>\u003cdiv>\u003cb>is\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Korean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>한국의\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문화적\u003c/span>\u003c/div>\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>get together\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>많음\u003c/span>\u003c/div>\u003cdiv>\u003cb>kimchi\u003c/b>\u003cem>명사\u003c/em>\u003cspan>김치\u003c/span>\u003c/div>\u003cdiv>\u003cb>before\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~ 전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>winter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겨울\u003c/span>\u003c/div>\u003cdiv>\u003cb>come\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 이상인\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>good\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좋은\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>food\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에 나온 중요 단어들을 짚어볼게요. tradition은 전통이라는 뜻이고 special은 특별한이라는 의미예요. get together는 함께 모이다라는 숙어로 아주 자주 쓰이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tradition\u003c/b>\u003cspan class=\"m\">전통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">custom\u003c/span>\u003cspan class=\"s\">heritage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">good\u003c/b>\u003cspan class=\"m\">좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">great\u003c/span>\u003cspan class=\"s\">nice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bad\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lot\u003c/b>\u003cspan class=\"m\">많음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plenty\u003c/span>\u003cspan class=\"s\">mass\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 핵심 어휘들의 동의어와 반의어도 함께 정리해 볼게요. tradition의 동의어로는 custom이나 heritage가 있어요. special의 동의어로는 unique가 있고 반의어로는 ordinary나 common이 있다는 것도 함께 알아두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요,\u003c/span>\u003cspan class=\"en\">Hello,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 민찬이에요!\u003c/span>\u003cspan class=\"en\">I'm Minchan!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요, 저는 민찬이에요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">시작\u003c/b>을 알리며 주인공인 민찬이가 자신을 소개하는 \u003cb class=\"key\">첫인사\u003c/b> 문장이에요. 앞으로 전개될 글의 화자가 누구인지 명확하게 알려주는 역할을 해요.\u003c/div>","segs":[{"n":12,"text":"Hello, 안녕하세요. I'm Minchan!, 저는 민찬이에요!. 이 문장 전체를 해석하면, 안녕하세요, 저는 민찬이에요!","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 시작을 알리며 주인공인 민찬이가 자신을 소개하는 첫인사 문장이에요. 앞으로 전개될 글의 화자가 누구인지 명확하게 알려주는 역할을 하죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 가족과 저는\u003c/span>\u003cspan class=\"en\">my family and I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할머니 댁에 있어요\u003c/span>\u003cspan class=\"en\">are at my grandmother's house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">김장을 하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> gimjang.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘 저희 가족과 저는 김장을 하기 위해 할머니 댁에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 민찬이네 가족이 오늘 어디에 왜 모였는지 \u003cb class=\"key\">방문 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 설명하는 문장이에요. \u003cb class=\"key\">김장\u003c/b>이라는 한국의 전통문화를 소개하기 위한 배경을 자연스럽게 열어줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사] + [to do (to부정사구/목적)] : \"김장을 하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Today, 오늘. my family and I, 저희 가족과 저는. are at my grandmother's house, 할머니 댁에 있어요. to do gimjang, 김장을 하기 위해. 이 문장 전체를 해석하면, 오늘 저희 가족과 저는 김장을 하기 위해 할머니 댁에 있어요.","hl":"m"},{"n":15,"text":"두 번째 문장은 민찬이네 가족이 오늘 어디에 왜 모였는지 방문 목적을 설명하는 문장이에요. 김장이라는 한국의 전통문화를 소개하기 위한 배경을 자연스럽게 열어주죠.","hl":"mn"},{"n":16,"text":"첫 번째 어법 포인트는 to do예요. to부정사가 동사 뒤에 와서 '~하기 위해'라는 목적을 나타내는 부사적 용법으로 쓰였어요. 여기서는 할머니 댁에 간 이유를 명확하게 설명해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">김장은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">gimjang\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">김장은 무엇일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 직접 \u003cb class=\"key\">질문\u003c/b>을 던지는 \u003cb class=\"key\">의문문\u003c/b> 형태로, 다음에 이어질 김장에 대한 자세한 설명을 효과적으로 이끌어내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접의문문\u003c/span> : [의문사 What] + [동사 is] + [주어 gimjang]? : \"김장은 무엇일까요?\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"What, 무엇일까요?. is. gimjang?, 김장은. 이 문장 전체를 해석하면, 김장은 무엇일까요?","hl":"m"},{"n":18,"text":"세 번째 문장은 독자들에게 직접 질문을 던지는 의문문 형태로, 다음에 이어질 김장에 대한 자세한 설명을 효과적으로 이끌어내는 역할을 해요.","hl":"mn"},{"n":19,"text":"어법 포인트는 직접의문문 구조예요. 의문사 What이 문장 맨 앞에 오고 동사와 주어의 순서가 바뀐다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의 문화적 전통이에요\u003c/span>\u003cspan class=\"en\">a Korean cultural tradition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 모여 많은 김치를 만드는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">together \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">kimchi\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨울이 오기 전에\u003c/span>\u003cspan class=\"en\">before winter comes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 질문한 김장이란 무엇인지에 대한 구체적인 정의를 내려주는 핵심 문장입니다. \u003cb class=\"key\">가주어 \u003c/b>\u003cb class=\"key\">to부정사 \u003c/b>\u003cb class=\"key\">진주어\u003c/b> 구문을 사용하여 김장을 하는 시기와 목적을 자연스럽게 설명하며 글의 배경 지식을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어\u003c/span> : It [가주어] + be동사 + 명사구 + [to부정사 (진주어)] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 진주어\u003c/span> : to + 동사원형 [get, make] + 목적어 : \"함께 모여 많은 김치를 만드는\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"It is, 그것은. a Korean cultural tradition, 한국의 문화적 전통이에요. to get together and make a lot of kimchi, 함께 모여 많은 김치를 만드는. before winter comes, 겨울이 오기 전에. 이 문장 전체를 해석하면, 그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요.","hl":"m"},{"n":21,"text":"이번 문장은 김장이 무엇인지 뜻을 풀어서 자세히 알려주는 중요한 문장이에요. 가주어와 진주어 구문을 써서 겨울이 오기 전에 모여서 김치를 담그는 전통이라는 점을 명확하게 설명하고 있죠.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 문장 맨 앞의 It이에요. 해석하지 않는 가주어 역할을 하고 있죠. 두 번째 어법 포인트는 뒤에 이어지는 to부정사구예요. 진짜 주어 자리에 온 진주어이며, and를 사이에 두고 get together와 make가 나란히 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">김장은\u003c/span>\u003cspan class=\"en\">Gimjang is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이상이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">김치를 만드는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">kimchi\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">김장은 김치를 만드는 것 이상이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 김장이 단순히 음식을 준비하는 노동에 그치지 않고 더 깊은 가치를 담고 있음을 강조하는 문장입니다. \u003cb class=\"key\">more \u003c/b>\u003cb class=\"key\">than\u003c/b> 표현을 통해 김장의 진정한 의미로 화제를 자연스럽게 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 관용표현\u003c/span> : more [비교급] + than [전치사/접속사] : \"~이상이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구\u003c/span> : 전치사 than + [동명사 (making) + 목적어 (kimchi)] : \"김치를 만드는 것\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Gimjang is, 김장은. more than, ~이상이에요. making kimchi, 김치를 만드는 것. 이 문장 전체를 해석하면, 김장은 김치를 만드는 것 이상이에요.","hl":"m"},{"n":24,"text":"이 문장은 김장이 단순히 음식을 만드는 일에만 그치지 않는다는 점을 짚어주고 있어요. 다음 문장으로 이야기를 부드럽게 이어주는 다리 역할을 하는 문장이지요.","hl":"mn"},{"n":25,"text":"어법 포인트는 more than 표현과 동명사예요. 전치사 뒤에 오는 자리라서 동사원형에 ing를 붙인 동명사 making이 쓰였다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 ~에 관한 것이에요\u003c/span>\u003cspan class=\"en\">It's also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간을 보내는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spending \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과족과\u003c/span>\u003cspan class=\"en\">with family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 가족과 시간을 보내는 것에 관한 것이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 김장의 진짜 가치가 가족이 함께 모여 유대감을 쌓는 데 있다는 저자의 생각을 직접적으로 전달합니다. 이전 문장의 \u003cb class=\"key\">more \u003c/b>\u003cb class=\"key\">than\u003c/b> 내용을 구체화하며 가족 중심의 전통이라는 본질을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : be동사 + 전치사 [about] + [동명사구] : \"~에 관한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 목적어\u003c/span> : 전치사 (about) + [spend (동명사) + 목적어 (time)] : \"시간을 보내는 것\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"It's also about, 그것은 또한 ~에 관한 것이에요. spending time, 시간을 보내는 것. with family, 과족과. 이 문장 전체를 해석하면, 그것은 또한 가족과 시간을 보내는 것에 관한 것이에요.","hl":"m"},{"n":27,"text":"앞 문장에서 김장이 김치 만드는 것 그 이상이라고 했잖아요. 이 문장은 그 진짜 이유가 바로 가족과 함께 시간을 보내는 데 있다는 것을 따뜻하게 설명해 주고 있어요.","hl":"mn"},{"n":28,"text":"어법 포인트는 전치사 뒤에 쓰인 동명사예요. about이라는 전치사 뒤에 명사 역할을 하는 동명사 spending이 와서 가족과 시간을 보낸다는 의미를 완성하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형
