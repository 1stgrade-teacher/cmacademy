</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 비상(황) 7과 본문2","audioDir":"2visang7-2_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>비상(황)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Azerbaijani Wedding Tradition with Flatbread\u003c/h1>\u003ch2>플랫브레드와 함께하는 아제르바이잔의 결혼식 전통\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 아제르바이잔에서는 이모 결혼식에서 \u003cb class=\"key\">플랫브레드\u003c/b>를 어깨에 얹어 \u003cb class=\"key\">행운\u003c/b>을 빌고, 공동체가 함께 빵을 구우며 \u003cb class=\"key\">공동체 \u003c/b>\u003cb class=\"key\">의식\u003c/b>을 단단하게 만든다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sharing a giant flatbread at weddings strengthens community bonds in Azerbaijan.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 이번 시간에는 아제르바이잔의 독특한 문화적 전통이 담긴 지문을 함께 공부해 볼 거예요. 필자인 Emil이 이모 결혼식에서 본 특별한 빵에 대해 소개해 주는 내용이죠. 이 글을 통해 세계 여러 나라의 재미있는 풍습과 공동체의 의미를 배울 수 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시): 세계 여러 문화권에서는 결혼식이나 축제 같은 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">날\u003c/b>에 \u003cb class=\"key\">음식\u003c/b>을 나누며 복을 기원하는 풍습이 있다. 예를 들어 마치 우리나라에서 잔치국수를 먹으며 \u003cb class=\"key\">장수\u003c/b>를 기원하는 것과 비슷하다. 아제르바이잔에서도 결혼식 때 커다란 \u003cb class=\"key\">플랫브레드\u003c/b>를 어깨에 얹는 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">전통\u003c/b>이 있다. 이러한 행위는 단순한 의식을 넘어, 온 \u003cb class=\"key\">공동체\u003c/b>가 함께 모여 \u003cb class=\"key\">음식\u003c/b>을 준비함으로써 유대감을 높이는 역할을 한다.\u003c/div>","segs":[{"n":2,"text":"배경지식으로 세계의 다양한 결혼식 풍습을 떠올려 보면 이해하기 쉬워요. 마치 우리가 잔치국수를 먹으며 장수를 기원하는 것처럼, 아제르바이잔에서도 특별한 날에 음식을 통해 복을 빌어요. 이 지문에서는 커다란 플랫브레드를 어깨에 얹는 전통을 통해 공동체의 유대감을 보여 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>필자인 Emil이 \u003cb class=\"key\">아제르바이잔\u003c/b>의 독특한 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">전통\u003c/b>을 소개하며, 이모 \u003cb class=\"key\">결혼식 \u003c/b>\u003cb class=\"key\">사진\u003c/b> 속 플랫브레드를 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전통의 의미\u003csmall>근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>어깨를 덮을 정도로 커다란 \u003cb class=\"key\">플랫브레드\u003c/b>를 어깨에 올려두는 것은 \u003cb class=\"key\">행운\u003c/b>을 가져온다는 믿음에서 비롯된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>공동체적 가치\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>밀가루, 소금, 물로 만드는 이 빵을 특별한 날에 더 크게 만들어 함께 굽음으로써 \u003cb class=\"key\">공동체\u003c/b>를 더욱 \u003cb class=\"key\">단단하게\u003c/b> 만든다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 아제르바이잔의 전통 소개부터 빵을 만드는 이유와 공동체의 결속까지 자연스럽게 이어지고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 Emil이 자신을 소개하고 아제르바이잔의 문화적 전통을 언급해요. 이모 결혼식 사진을 보여 주며 어깨 위에 있는 물건에 대한 궁금증을 자아내죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그 물건이 바로 플랫브레드라는 것을 설명해요. 어깨를 덮을 만큼 커다란 이 빵을 올려두는 것이 행운을 가져다준다는 믿음을 전하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 밀가루와 소금, 물로 만드는 이 빵을 특별한 날에 더 크게 만든다고 말해요. 공동체 모든 사람이 함께 모여 돕고 빵을 구우며 관계를 더욱 단단하게 만든다는 결론을 맺어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 \u003cb class=\"key\">두괄식\u003c/b> 구조를 통해 아제르바이잔의 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">전통\u003c/b>이라는 핵심 주제를 먼저 밝힌다. 이어서 \u003cb class=\"key\">이모 \u003c/b>\u003cb class=\"key\">결혼식\u003c/b> 사진과 플랫브레드에  \u003cb class=\"key\">행운\u003c/b>을 담는 믿음을 \u003cb class=\"key\">근거\u003c/b>로 제시한다. 마지막에는 \u003cb class=\"key\">공동체\u003c/b>가 함께 빵을 구우며 유대감을 강화한다는 \u003cb class=\"key\">결론\u003c/b>으로 이어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Also (2)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cultural tradition\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flatbread\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this bread\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 두괄식 구조로 쓰였어요. 아제르바이잔에 문화적 전통이 있다는 핵심 주제를 먼저 던진 뒤, 결혼식 사진 속 플랫브레드라는 구체적인 사례를 근거로 들어 설명하고 있죠.","hl":"ty"},{"n":8,"text":"문장 속 연결어들을 살펴보는 것도 중요해요. 또한이라는 뜻의 also가 아제르바이잔의 전통을 추가로 설명하고 있고, 그래서라는 뜻의 so가 공동체가 함께 모여 돕는다는 결과를 자연스럽게 이끌어 내고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>cultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문화의\u003c/span>\u003c/div>\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>shoulder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어깨\u003c/span>\u003c/div>\u003cdiv>\u003cb>flatbread\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플랫브레드\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>덮다\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>luck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행운\u003c/span>\u003c/div>\u003cdiv>\u003cb>flour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밀가루\u003c/span>\u003c/div>\u003cdiv>\u003cb>salt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소금\u003c/span>\u003c/div>\u003cdiv>\u003cb>water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물\u003c/span>\u003c/div>\u003cdiv>\u003cb>meal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식사\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공동체\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>help out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>baking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>굽기\u003c/span>\u003c/div>\u003cdiv>\u003cb>stronger\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 강한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에 나온 핵심 단어들도 꼼꼼히 챙겨야 해요. 문화적 전통을 뜻하는 cultural tradition과 어깨를 뜻하는 shoulder, 그리고 행운을 뜻하는 luck 같은 단어들은 시험에 자주 나오니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tradition\u003c/b>\u003cspan class=\"m\">전통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">custom\u003c/span>\u003cspan class=\"s\">heritage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">together\u003c/b>\u003cspan class=\"m\">함께\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">jointly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alone\u003c/span>\u003cspan class=\"a\">separately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stronger\u003c/b>\u003cspan class=\"m\">더 강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tighter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weaker\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"주요 어휘의 동의어와 반의어도 함께 정리해 볼게요. tradition의 동의어로는 custom이나 heritage가 있고, special의 반의어로는 ordinary나 common이 있어요. 반대로 짝을 이루는 단어들을 함께 외우면 어휘력이 훨씬 풍부해질 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요,\u003c/span>\u003cspan class=\"en\">Hi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는\u003c/span>\u003cspan class=\"en\">I'm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emil이에요!\u003c/span>\u003cspan class=\"en\">Emil!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요, 저는 Emil이에요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 독자들에게 자신을 친근하게 소개하며 아제르바이잔의 독특한 문화적 전통을 이야기하기 시작하는 도입부의 역할을 해요. 주인공의 이름인 \u003cb class=\"key\">Emil\u003c/b>을 밝히며 앞으로 전개될 이야기의 흥미를 유발하죠.\u003c/div>","segs":[{"n":11,"text":"Hi, 안녕하세요. I'm, 저는. Emil!, Emil이에요!. 이 문장 전체를 해석하면, 안녕하세요, 저는 Emil이에요!","hl":"m"},{"n":12,"text":"첫 번째 문장은 글쓴이가 독자들에게 자신을 소개하는 인사예요. 앞으로 아제르바이잔의 흥미로운 전통을 들려주기 위해 먼저 이름을 밝히고 있죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 또한 가지고 있어요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also\u003c/span> have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 문화적 전통을\u003c/span>\u003cspan class=\"en\">this kind of cultural tradition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아제르바이잔에도\u003c/span>\u003cspan class=\"en\">in Azerbaijan.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아제르바이잔에도 이런 종류의 문화적 전통이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다른 나라에도 특정한 문화적 전통이 있듯이 아제르바이잔에도 독특한 전통이 존재함을 소개하는 문장이에요. \u003cb class=\"key\">cultural \u003c/b>\u003cb class=\"key\">tradition\u003c/b>이라는 핵심 소재를 통해 앞으로 설명할 결혼식 풍습에 대한 기대감을 높여주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 위치\u003c/span> : [일반동사 앞] 또는 [be동사/조동사 뒤] : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"We also have, 우리는 또한 가지고 있어요. this kind of cultural tradition, 이런 종류의 문화적 전통을. in Azerbaijan, 아제르바이잔에도. 이 문장 전체를 해석하면, 아제르바이잔에도 이런 종류의 문화적 전통이 있어요.","hl":"m"},{"n":14,"text":"두 번째 문장은 다른 곳과 마찬가지로 아제르바이잔에도 독특한 문화적 전통이 있다는 것을 알려주는 내용이에요. 이 문장을 통해 다음 장면에 등장할 결혼식 풍습에 주목하게 만들죠.","hl":"mn"},{"n":15,"text":"두 번째 문장에서 기억해야 할 어법 포인트는 부사인 also의 위치예요. 일반동사 have 앞에 also를 써서 우리도 그런 전통이 있다는 점을 자연스럽게 강조하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 ~가 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진이\u003c/span>\u003cspan class=\"en\">a picture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 이모 결혼식\u003c/span>\u003cspan class=\"en\">from my \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">aunt's\u003c/span> wedding.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기 제 이모 결혼식 사진이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 자신의 가족인 이모의 결혼식 \u003cb class=\"key\">picture\u003c/b>를 직접 보여주며 독자의 이해를 돕는 역할을 해요. 시각 자료를 제시함으로써 아제르바이잔의 전통을 더 생생하게 전달하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 구문\u003c/span> : [Here] + [is (단수 주어)] : \"여기 ~가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사의 소유격\u003c/span> : [명사] + ['s] + [명사] : \"이모의\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Here's, 여기 ~가 있어요. a picture, 사진이. from my aunt's wedding, 제 이모 결혼식. 이 문장 전체를 해석하면, 여기 제 이모 결혼식 사진이 있어요.","hl":"m"},{"n":17,"text":"세 번째 문장은 이모의 결혼식 사진을 보여주며 앞으로 설명할 전통이 실제 어디서 일어나는지 시각적으로 안내하는 역할을 해요. 생생한 사진을 통해 독자의 몰입감을 높여주죠.","hl":"mn"},{"n":18,"text":"세 번째 문장에서는 두 가지 어법을 살펴볼 수 있어요. 첫째로 단수 주어 a picture 앞에 Here's를 써서 무언가를 제시하고 있고, 둘째로 결혼식의 주인을 밝히려고 aunt 뒤에 소유격을 붙여서 이모의 결혼식이라는 것을 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물건이\u003c/span>\u003cspan class=\"en\">the thing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 어깨 위에 있는\u003c/span>\u003cspan class=\"en\">on her shoulder?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 어깨 위에 있는 물건이 보이나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방의 \u003cb class=\"key\">주의를 \u003c/b>\u003cb class=\"key\">환기\u003c/b>시키며 \u003cb class=\"key\">결혼식 \u003c/b>\u003cb class=\"key\">사진\u003c/b> 속에 등장하는 독특한 전통 음식에 대해 질문하는 문장이에요. \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">thing\u003c/b>이라는 표현을 통해 고모의 어깨 위에 올려진 플랫브레드를 an class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">putting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bread \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">shoulder \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져온다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">brings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행운을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">luck\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그 빵을 어깨 위에 올려두는 것이 행운을 가져온다고 믿어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아제르바이잔 문화에서 결혼식 하객들이 신부의 어깨에 플랫브레드를 올려놓는 \u003cb class=\"key\">행동의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 설명하는 문장이에요. 접속사 \u003cb class=\"key\">that절\u003c/b>이 주어와 동사 뒤에서 목적어 역할을 하며, 동명사구 주어가 단수 취급되어 동사에 \u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">일치\u003c/b>가 일어난 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : believe [타동사] + [that절 (주어 + 동사)] : \"빵을 어깨 위에 올려두는 것이 행운을 가져온다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : putting [동명사] + [목적어] + [전치사구] : \"빵을 어깨 위에 올려두는 것은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"We believe, 우리는 믿어요. that putting the bread over the shoulder, 빵을 어깨 위에 올려두는 것이. brings, 가져온다고. good luck, 행운을. 이 문장 전체를 해석하면, 우리는 그 빵을 어깨 위에 올려두는 것이 행운을 가져온다고 믿어요.","hl":"m"},{"n":28,"text":"이 문장은 빵을 어깨에 올리는 전통이 행운을 가져다준다는 믿음을 말하고 있어요. 글의 흐름상 아제르바이잔 문화의 독특한 풍습을 구체적으로 설명하는 핵심 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 that이에요. 동사 believe 뒤에서 목적어 역할을 하는 명사절을 이끌고 있죠. 두 번째 어법 포인트는 putting으로 시작하는 동명사구 주어예요. 동명사 주어는 단수 취급하므로 동사 brings에 s가 붙는다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플랫브레드는\u003c/span>\u003cspan class=\"en\">A flatbread\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어져요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로만\u003c/span>\u003cspan class=\"en\">only from\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀가루, 소금, 물로\u003c/span>\u003cspan class=\"en\">flour, salt, and water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">플랫브레드는 밀가루, 소금, 물로만 만들어져요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아제르바이잔에서 먹는 플랫브레드가 아주 단순한 재료로 만들어진다는 것을 설명하는 문장이에요. 주어가 직접 만드는 것이 아니라 재료로 만들어지는 것이므로 \u003cb class=\"key\">수동태\u003c/b> 표현이 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 + be동사(is) + 과거분사(made) : \"만들어진다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"A flatbread, 플랫브레드는. is made, 만들어져요. only from, ~로만. flour, salt, and water, 밀가루, 소금, 물로. 이 문장 전체를 해석하면, 플랫브레드는 밀가루, 소금, 물로만 만들어져요.","hl":"m"},{"n":31,"text":"이 문장은 전통 플랫브레드가 오직 밀가루와 소금, 물 같은 단순한 재료로만 만들어진다는 것을 알려주고 있어요.","hl":"mn"},{"n":32,"text":"이번 문장의 어법 포인트는 수동태예요. 주어인 플랫브레드가 만드는 대상이 아니라 만들어지는 대상이기 때문에 is made라는 수동태 형태를 썼어요. 재료를 나타낼 때는 전치사 from을 쓴다는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 먹어요\u003c/span>\u003cspan class=\"en\">We eat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 빵을\u003c/span>\u003cspan class=\"en\">this bread\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매 끼니에\u003c/span>\u003cspan class=\"en\">at every meal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 크게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">bigger\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 날에는\u003c/span>\u003cspan class=\"en\">on special days.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 매 끼니에 이 빵을 먹지만, 특별한 날에는 더 크게 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 평소에도 늘 먹는 친숙한 빵이지만 특별한 날에는 더 크게 만든다는 대조적인 내용을 담고 있어요. 평범한 일상과 특별한 행사가 연결되는 \u003cb class=\"key\">문맥의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 보여주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사\u003c/span> : make [동사] + it [목적어] + bigger [목적격 보어(형용사 비교급)] : \"그것을 더 크게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We eat, 우리는 먹어요. this bread, 이 빵을. at every meal, 매 끼니에. but, 하지만. we make, 만들어요. it, 그것을. bigger, 더 크게. on special days, 특별한 날에는. 이 문장 전체를 해석하면, 우리는 매 끼니에 이 빵을 먹지만, 특별한 날에는 더 크게 만들어요.","hl":"m"},{"n":34,"text":"이 문장은 평소 매 끼니마다 이 빵을 먹지만 결혼식 같은 특별한 날에는 크기를 더 크게 만든다는 내용을 대조해서 보여주고 있어요.","hl":"mn"},{"n":35,"text":"이 문장의 어법 포인트는 5형식 문장 구조예요. make 동사 뒤에 목적어인 it과 목적격 보어인 bigger가 차례대로 나와서 빵을 더 크게 만든다는 상태를 설명하고 있어요. 보어 자리에 형용사 비교급이 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공동체에 있는 모든 사람이\u003c/span>\u003cspan class=\"en\">everyone in the community\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 모여서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gets \u003c/span>\u003cspan class=\"tgt\">together \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도와줘요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 공동체에 있는 모든 사람이 함께 모여서 도와줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아제르바이잔에서 특별한 날에 엄청나게 큰 플랫브레드를 만들기 때문에, \u003cb class=\"key\">공동체\u003c/b>의 모든 사람들이 함께 모여 서로를 돕는 \u003cb class=\"key\">협동\u003c/b>의 모습을 보여주는 문장입니다. 앞 문장에서 빵을 더 크게 만든다는 내용에 이어, 왜 함께 모이게 되었는지 그 이유와 결과를 \u003cb class=\"key\">인과관계\u003c/b>로 연결하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : 단수 명사 주어 [everyone] + 단수 동사 [gets] : \"함께 모여서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : 주어 + 동사구 1 [gets together] + 등위접속사 [and] + 동사구 2 [helps out] : \"함께 모여서 도와줘요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"So, 그래서. everyone in the community, 공동체에 있는 모든 사람이. gets together, 함께 모여서. and helps out, 도와줘요.. 이 문장 전체를 해석하면, 그래서 공동체에 있는 모든 사람이 함께 모여서 도와줘요.","hl":"m"},{"n":37,"text":"이 문장은 빵을 더 크게 만드는 특별한 날에 마을 사람들이 다 같이 모여서 서로 돕는다는 내용을 담고 있어요. 공동체 주민들이 협동하는 모습을 잘 보여주는 대목이죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 주어와 동사의 수 일치예요. 주어로 쓰인 everyone은 단수 취급하기 때문에 뒤에 오는 동사 gets와 helps에 s가 붙는다는 점을 꼭 기억해 두세요. 두 번째 포인트는 병렬 구조예요. and라는 등위접속사가 everyone이 하는 두 가지 행동인 gets together와 helps out을 자연스럽게 연결해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 빵을 굽는 일은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Baking \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bread \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하게 만들어 줘요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 공동체를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">community \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱 단단하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">stronger\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">함께 빵을 굽는 일은 우리 공동체를 더욱 단단하게 만들어 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마을 사람들이 함께 모여 빵을 만드는 활동이 단순히 음식을 만드는 것을 넘어, 주민들 사이의 \u003cb class=\"key\">유대감\u003c/b>을 깊게 하고 공동체를 더욱 \u003cb class=\"key\">결속력\u003c/b> 있게 만들어 준다는 핵심 주제를 전달하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : 동명사구 [Baking the bread together] (주어) + 단수 동사 [makes] : \"함께 빵을 굽는 일은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장 구조\u003c/span> : 주어 + 동사 [makes] + 목적어 [our community] + 목적격 보어 [stronger (형용사)] : \"우리 공동체를 더욱 단단하게 만들어 줘요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Baking the bread together, 함께 빵을 굽는 일은. makes, ~하게 만들어 줘요. our community, 우리 공동체를. stronger, 더욱 단단하게. 이 문장 전체를 해석하면, 함께 빵을 굽는 일은 우리 공동체를 더욱 단단하게 만들어 줘요.","hl":"m"},{"n":40,"text":"마을 사람들이 함께 모여서 빵을 만드는 활동이 결국 우리 공동체를 더욱 끈끈하고 단단하게 만들어 준다는 이 글의 핵심 주제를 담고 있어요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 동명사 주어예요. 문장 맨 앞에 나온 Baking the bread together가 '~하는 것'이라는 뜻의 주어로 쓰였고, 동명사구는 단수 취급하므로 동사로 makes가 왔어요. 두 번째 포인트는 5형식 문장 구조예요. makes 뒤에 목적어인 our community가 오고, 그 뒤에 목적어의 상태를 설명해 주는 목적격 보어로 형용사 비교급인 stronger가 쓰였다는 것을 잘 기억해 두세요. 보어 자리에는 부사를 쓸 수 없다는 것도 꼭 함께 알아두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아제르바이잔에는 결혼식 때 \u003cb class=\"key\">플랫브레드\u003c/b>를 어깨에 올리는 문화적 전통이 있다.\u003c/li>\u003cli>이 빵을 어깨에 두는 것은 \u003cb class=\"key\">행운\u003c/b>을 가져온다고 믿어진다.\u003c/li>\u003cli>특별한 날에는 이 빵을 더 크게 만들어 \u003cb class=\"key\">공동체\u003c/b> 사람들이 함께 모여 돕는다.\u003c/li>\u003cli>함께 빵을 굽는 과정을 통해 \u003cb class=\"key\">공동체\u003c/b>의 유대감이 더욱 단단해진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sharing a giant flatbread at weddings strengthens community bonds in Azerbaijan.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 아제르바이잔에서는 이모 결혼식에서 \u003cb class=\"key\">플랫브레드\u003c/b>를 어깨에 얹어 \u003cb class=\"key\">행운\u003c/b>을 빌고, 공동체가 함께 빵을 구우며 \u003cb class=\"key\">공동체 \u003c/b>\u003cb class=\"key\">의식\u003c/b>을 단단하게 만든다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 배운 내용을 바탕으로 아제르바이잔의 결혼식 전통과 플랫브레드가 가지는 의미를 잘 정리해 두세요. 복습 열심히 하고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
