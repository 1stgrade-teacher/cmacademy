  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});

}
lecturePlayer(document.getElementById("app"),{"brand":"중2 비상(황) 7과 문법2","title":"가주어 it 완벽 정복","audioDir":"2_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가주어 it\u003c/div>\u003ch1>가주어 it 완벽 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가주어 it과 진주어 to부정사의 구조를 이해하고, to부정사의 의미상 주어 for와 of를 구별해 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 영어 문장을 훨씬 자연스럽게 만들어 주는 가주어 it을 배워 볼 거예요. 주어가 너무 길어질 때 영어는 짧은 it을 주어 자리에 대신 놓고 진짜 주어는 뒤로 보낸다는 사실, 알고 있었나요? 오늘 이 규칙 하나만 확실히 잡으면 영작이 정말 쉬워져요. 그리고 누가 그 일을 하는지 알려 주는 for와 of도 함께 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">가주어 it과 진주어 to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「to + 동사원형」 형태의 to부정사가 '~하는 것은'이라는 의미로 문장에서 주어 역할을 하면 주어가 너무 길어져요. 그래서 보통 주어 자리에는 \u003cb class=\"key\">가주어\u003c/b> it을 쓰고, 진짜 주어인 \u003cb class=\"key\">진주어\u003c/b> to부정사는 문장 뒤로 보내요. 이때 가주어 it은 \u003cb class=\"key\">해석하지 않아요\u003c/b>.\u003cdiv>\u003cspan class=\"g-formula\">It + be동사 + 형용사 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To study hard\u003c/span> is important.\u003c/div>\u003cdiv class=\"g-ko\">열심히 공부하는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">to부정사가 주어 자리에 그대로 온 문장이라서 주어가 길고 무거워요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It is important to study hard\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">열심히 공부하는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">가주어 it을 주어 자리에 두고 진주어 to study hard를 뒤로 보낸 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It is fun to play baseball\u003c/span> with my friends.\u003c/div>\u003cdiv class=\"g-ko\">내 친구들과 야구를 하는 것은 재미있다.\u003c/div>\u003cdiv class=\"g-note\">가주어 it과 진주어 to play baseball이 쓰인 쉬운 예문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가주어 it은 \u003cb class=\"key\">해석하지 않는다\u003c/b>는 점을 꼭 기억하세요. 진주어 to부정사는 언제나 \u003cb class=\"key\">동사원형\u003c/b>으로 시작해요.\u003c/div>","segs":[{"n":2,"text":"자, 오늘은 가주어 it을 배워 볼게요. 먼저 To study hard is important라는 문장을 보세요. 여기서 주어는 To study hard인데, 주어가 너무 길어서 문장이 무거워 보이죠. 영어는 이렇게 긴 주어를 별로 좋아하지 않아요. 그래서 주어 자리에는 짧은 it을 대신 놓고, 진짜 주어인 to부정사는 문장 뒤로 보내요. 그러면 It is important to study hard가 되는데, 이때 it은 그것이라고 해석하지 않는다는 것, 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"먼저 To study hard is important를 읽어 볼게요. 뜻은 열심히 공부하는 것은 중요하다예요. 여기서 주어는 To study hard, 즉 to부정사 덩어리죠. 주어가 길어서 문장이 조금 어색하게 들리지 않나요?","hl":"ex-0"},{"n":4,"text":"이번에는 It is important to study hard를 읽어 볼게요. 뜻은 아까와 똑같이 열심히 공부하는 것은 중요하다예요. 주어 자리에는 가주어 it이 짧게 앉아 있고, 진짜 주어인 to study hard가 뒤로 갔어요. 이렇게 하면 문장이 훨씬 자연스러워요.","hl":"ex-1"},{"n":5,"text":"한 가지 예문을 더 볼게요. It is fun to play baseball with my friends, 뜻은 내 친구들과 야구를 하는 것은 재미있다예요. 여기서도 it은 해석하지 않고, 진짜 주어는 뒤에 있는 to play baseball이에요.","hl":"ex-2"},{"n":6,"text":"한 가지 더 강조할게요. 가주어 it은 절대로 그것이라고 해석하지 않아요. 그리고 진주어 to부정사는 꼭 동사원형으로 시작해야 한다는 점도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">to부정사의 의미상 주어: for와 of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사의 의미상 주어, 즉 그 일을 하는 사람을 나타낼 때는 to부정사 앞에 \u003cb class=\"key\">for + 목적격\u003c/b>을 써요. 그런데 kind, nice, smart처럼 사람의 \u003cb class=\"key\">성격\u003c/b>이나 \u003cb class=\"key\">태도\u003c/b>를 나타내는 형용사가 앞에 오면 \u003cb class=\"key\">of + 목적격\u003c/b>을 써요.\u003cdiv>\u003cspan class=\"g-formula\">It + be동사 + 형용사 + for/of + 목적격 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is important \u003cspan class=\"fx\">for you to get enough sleep\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너가 충분한 잠을 자는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">의미상 주어 you 앞에 for를 써서 '네가 자는 것'을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It is difficult \u003cspan class=\"fx\">for children to sit still\u003c/span> for a long time.\u003c/div>\u003cdiv class=\"g-ko\">아이들이 오랫동안 가만히 앉아 있는 것은 어렵다.\u003c/div>\u003cdiv class=\"g-note\">여기서도 의미상 주어 children 앞에 for를 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">It was \u003cspan class=\"fx\">kind of you\u003c/span> to help me.\u003c/div>\u003cdiv class=\"g-ko\">나를 도와주다니 너는 친절했다.\u003c/div>\u003cdiv class=\"g-note\">kind는 사람의 성격을 나타내므로 of를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">It is \u003cspan class=\"fx\">smart of you\u003c/span> to bring an umbrella on a cloudy day.\u003c/div>\u003cdiv class=\"g-ko\">흐린 날에 우산을 가져오다니 너는 똑똑하다.\u003c/div>\u003cdiv class=\"g-note\">smart도 사람의 성격을 나타내므로 of를 써요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>사람의 성격이나 태도를 나타내는 형용사 뒤에는 \u003cb class=\"key\">of\u003c/b>를, 그 밖의 형용사 뒤에는 \u003cb class=\"key\">for\u003c/b>를 써요.\u003c/div>","segs":[{"n":7,"text":"이번에는 그 일을 하는 사람, 즉 의미상 주어를 살펴볼게요. It is important for you to get enough sleep에서 you가 바로 그 to부정사를 하는 사람이에요. 이렇게 to부정사의 의미상 주어는 for 다음에 목적격을 써서 표현해요. 그런데 It was kind of you to help me처럼 kind, nice, smart 같이 사람의 성격이나 태도를 나타내는 형용사가 오면 for 대신에 of를 써요. 사람의 성격을 칭찬하는 말이니까 of you라고 하는 거예요.","hl":"rule"},{"n":8,"text":"It is important for you to get enough sleep를 읽어 볼게요. 뜻은 너가 충분한 잠을 자는 것은 중요하다예요. 잠을 자는 사람이 바로 you이기 때문에 for you라고 써 줬어요.","hl":"ex-0"},{"n":9,"text":"다음은 It is difficult for children to sit still for a long time이에요. 뜻은 아이들이 오랫동안 가만히 앉아 있는 것은 어렵다예요. 여기서도 가만히 앉아 있는 사람이 children이니까 for children이라고 했어요.","hl":"ex-1"},{"n":10,"text":"이번에는 It was kind of you to help me를 읽어 볼게요. 뜻은 나를 도와주다니 너는 친절했다예요. kind는 사람의 성격을 칭찬하는 형용사라서 for가 아니라 of you를 쓴다는 점이 중요해요.","hl":"ex-2"},{"n":11,"text":"마지막으로 It is smart of you to bring an umbrella on a cloudy day를 읽어 볼게요. 뜻은 흐린 날에 우산을 가져오다니 너는 똑똑하다예요. smart도 사람의 성격을 나타내니까 여기서도 of you를 썼어요.","hl":"ex-3"},{"n":12,"text":"정리하면 성격이나 태도를 나타내는 형용사 뒤에는 of, 그 밖의 형용사 뒤에는 for예요. 헷갈릴 때는 그 형용사가 사람을 칭찬하는 말인지 생각해 보면 쉬워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It is necessary study for the exam.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It is necessary to study for the exam.\u003c/div>\u003cdiv class=\"g-why\">진주어 자리에는 동사원형이 아니라 to부정사가 와야 하기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It not is easy to wake up early.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It is not easy to wake up early.\u003c/div>\u003cdiv class=\"g-why\">not은 be동사 뒤에 와야 하기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It is kind for you to help me.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It is kind of you to help me.\u003c/div>\u003cdiv class=\"g-why\">kind는 사람의 성격을 나타내는 형용사라서 for가 아니라 of를 써야 하기 때문이에요.\u003c/div>\u003c/div>","segs":[{"n":13,"text":"첫 번째로 자주 나오는 실수예요. It is necessary study for the exam라고 쓰면 틀린 문장이에요. 진주어 자리에는 꼭 to부정사가 와야 하니까 to study라고 고쳐 줘야 해요.","hl":"mk-0"},{"n":14,"text":"두 번째 실수도 정말 많아요. It not is easy to wake up early라고 하면 어색하죠. not은 be동사 뒤에 붙여서 is not easy라고 써야 해요.","hl":"mk-1"},{"n":15,"text":"세 번째는 for와 of를 헷갈리는 실수예요. It is kind for you to help me라고 하면 틀려요. kind는 사람의 성격을 나타내니까 of you라고 고쳐야 해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 뜻이 같도록 &lt;보기&gt;에서 알맞은 말을 골라 문장을 완성해 봅시다.\u003c/div>\u003cdiv class=\"g-qs\">The box was so heavy ____________________.\u003c/div>
