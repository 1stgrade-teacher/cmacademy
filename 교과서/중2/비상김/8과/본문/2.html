@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 비상(황) 8과 본문2","audioDir":"2_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>비상(황)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Rules and Preparation for the Adventure Race\u003c/h1>\u003ch2>어드벤처 레이스의 규칙과 준비\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">어드벤처 \u003c/b>\u003cb class=\"key\">레이스\u003c/b>에 참가하려면 남녀 구성, 건강 증명, 기술 테스트 등의 \u003cb class=\"key\">엄격한 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 통과해야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Teams must follow strict rules and pass skill tests to participate in the tough adventure race.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 중학교 영어 독해 지문 중에서 어드벤처 레이스의 규칙을 다룬 내용을 함께 공부해 볼 거예요. 첫 번째 문장부터 마지막 문장까지 어떤 엄격한 규칙들이 있는지, 그리고 왜 그런 조건이 필요한지 요약과 요지를 짚어 가며 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시): 극한의 환경에서 팀을 이루어 오랫동안 경쟁하는 스포츠를 \u003cb class=\"key\">어드벤처 \u003c/b>\u003cb class=\"key\">레이스(Adventure \u003c/b>\u003cb class=\"key\">Race)\u003c/b>라고 불러요. 마치 거대한 방탈출 게임이나 마라톤을 여러 명이 함께 온갖 장애물을 뚫고 나가는 것과 비슷하죠. 이런 대회에서는 체력뿐만 아니라 \u003cb class=\"key\">협동심(Teamwork)\u003c/b>과 다양한 생존 기술이 필수적으로 요구돼요. 그래서 주최 측에서는 안전사고를 막기 위해 참가자들에게 \u003cb class=\"key\">철저한 \u003c/b>\u003cb class=\"key\">검증(Strict \u003c/b>\u003cb class=\"key\">verification)\u003c/b> 과정을 거치도록 해요.\u003c/div>","segs":[{"n":2,"text":"배경지식으로 어드벤처 레이스에 대해 잠깐 설명해 드릴게요. 극한의 환경에서 팀을 이루어 여러 장애물을 뚫고 나가는 스포츠로, 협동심과 생존 기술이 아주 중요해요. 안전사고를 막기 위해서 주최 측이 철저한 검증 과정을 거치도록 만든다는 것을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>참가 규칙 도입\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 번째 단계에서는 \u003cb class=\"key\">어드벤처 \u003c/b>\u003cb class=\"key\">레이스의 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 묻는 질문으로 흥미를 유발하고, 참가하는 팀들이 반드시 따라야 하는 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 제시해요. 예를 들어 4명으로 이루어진 팀은 최소 한 명의 남녀를 포함해야 한다는 조건이 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>건강 및 기술 검증\u003csmall>근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>두 번째 단계에서는 모든 팀원이 건강하다는 것을 증명해야 하며, 로프, 지도, 응급 처치와 관련된 \u003cb class=\"key\">기술 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>를 통과해야 한다고 강조해요. 이는 경주가 매우 \u003cb class=\"key\">힘든 \u003c/b>\u003cb class=\"key\">과정(Tough \u003c/b>\u003cb class=\"key\">race)\u003c/b>이기 때문에 모두가 철저히 준비되어야 하기 때문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>완주와 승리\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>마지막 세 번째 단계에서는 경주를 끝내기 위해 모든 \u003cb class=\"key\">체크포인트\u003c/b>에 도달해야 한다는 조건을 설명해요. 결국 가장 먼저 결승선을 통과하는 \u003cb class=\"key\">우승 \u003c/b>\u003cb class=\"key\">팀(Winning \u003c/b>\u003cb class=\"key\">team)\u003c/b>이 결정되는 과정을 보여줘요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 규칙 제시부터 검증 과정, 완주 조건까지 자연스럽게 이어지고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 어드벤처 레이스의 규칙을 묻는 질문으로 시작해서, 팀들이 따라야 하는 기본 규칙들을 제시하고 있어요. 남녀 혼성 구성 조건이 바로 그 예시죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 근거 부분에서는 모든 팀원이 건강하다는 것을 증명해야 하고, 로프나 지도, 응급 처치 관련 기술 테스트를 통과해야 한다고 강조해요. 경기가 매우 힘든 과정이기 때문에 이런 준비가 필수적이라는 것을 설명하고 있죠.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계에서는 모든 체크포인트에 도달해야 경주를 끝낼 수 있고, 가장 먼저 결승선을 통과하는 우승 팀이 정해진다는 결론을 보여줘요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">참가 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 지켜야 한다는 중심 주장을 먼저 제시한 뒤, 구체적인 예시와 그 이유를 덧붙이는 구조예요. 팀 구성, 건강 증명, 기술 테스트라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 통해 주장의 타당성을 뒷받침하고 있어요. 마지막에는 완주 조건과 승리 기준을 밝히며 글을 깔끔하게 마무리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (3)\u003c/b>\u003cspan>예시 연결사\u003c/span>\u003cb>Also (5)\u003c/b>\u003cspan>추가 연결사\u003c/span>\u003cb>because (6)\u003c/b>\u003cspan>이유 연결사\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">rules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a few rules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tests\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">challenges\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">checkpoint\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 참가 규칙을 지켜야 한다는 중심 주장을 첫 부분에 먼저 제시하고, 구체적인 테스트 종류와 이유를 뒷받침으로 덧붙이는 두괄식 구조로 되어 있어요.","hl":"ty"},{"n":8,"text":"중간에 나오는 연결사들을 잘 봐야 하죠. 예를 들거나 추가할 때 쓰는 For example과 Also, 그리고 이유를 나타내는 because 같은 신호어들이 글의 전개 방향을 아주 잘 보여 주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행사, 사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>at least\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적어도, 최소한\u003c/span>\u003c/div>\u003cd 쓰임을 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tough\u003c/b>\u003cspan class=\"m\">힘든, 단단한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">healthy\u003c/b>\u003cspan class=\"m\">건강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fit\u003c/span>\u003cspan class=\"s\">well\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unhealthy\u003c/span>\u003cspan class=\"a\">sick\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">follow\u003c/b>\u003cspan class=\"m\">따르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obey\u003c/span>\u003cspan class=\"s\">adhere to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disobey\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reach\u003c/b>\u003cspan class=\"m\">도달하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arrive at\u003c/span>\u003cspan class=\"s\">get to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">depart from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">win\u003c/b>\u003cspan class=\"m\">이기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"s\">succeed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 핵심 어휘도 정리해 볼게요. tough의 동의어로는 difficult나 hard가 있고, 반의어로는 easy가 있어요. 그리고 reach는 arrive at과 같은 뜻이라는 점도 함께 알아두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\ 를 들어, 4명으로 구성된 팀에는 적어도 한 명의 남자와 한 명의 여자가 있어야 합니다.","hl":"m"},{"n":18,"text":"세 번째 문장은 앞서 말한 여러 가지 규칙 중 첫 번째 구체적 예시를 들어 설명하는 문장이에요. 성별 구성 조건을 통해 팀의 다양성과 협동심을 강조하고 있답니다.","hl":"mn"},{"n":19,"text":"세 번째 문장에서는 첫 번째로 전치사 of가 앞의 a team을 꾸며주는 수식 구조를 보셔야 해요. 그리고 두 번째로 수량 앞에 쓰여 최소한을 뜻하는 표현까지 함께 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 팀원은\u003c/span>\u003cspan class=\"en\">Every member\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여줘야 합니다\u003c/span>\u003cspan class=\"en\">must show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 건강하다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> they are healthy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 팀원은 그들이 건강하다는 것을 보여줘야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 참가 선수들이 극한의 경주를 버틸 수 있는 기본 체력을 갖추고 있어야 함을 강조해요. \u003cb class=\"key\">접속사 \u003c/b>\u003cb class=\"key\">that\u003c/b>을 사용하여 건강하다는 사실을 명확하게 전달하는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 인도하는 접속사 that\u003c/span> : 동사 [show] + [that절 (주어 + 동사 + 보어)] : \"~라는 것\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Every member, 모든 팀원은. must show, 보여줘야 합니다. that they are healthy, 그들이 건강하다는 것을. 이 문장 전체를 해석하면, 모든 팀원은 그들이 건강하다는 것을 보여줘야 합니다.","hl":"m"},{"n":21,"text":"이 문장은 선수들이 힘든 경기를 치르기 위해 반드시 체력이 탄탄해야 한다는 점을 짚어주고 있어요. show 뒤에 나온 that절이 무엇을 보여줘야 하는지 목적어 역할을 깔끔하게 해주고 있죠.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 that이에요. show라는 동사 뒤에서 명사절을 이끌며 완전한 문장을 연결해 주는 역할을 하죠. 이때 that은 생략할 수도 있으니 눈여겨봐 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 팀은 몇 가지 테스트를 통과해야 합니다\u003c/span>\u003cspan class=\"en\">each team must pass some tests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술들을 확인하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">check \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로프 사용하기, 지도 읽기, 응급 처치하기에서의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">ropes, \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">maps, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">giving \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">aid\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 각 팀은 로프 사용하기, 지도 읽기, 응급 처치하기에서의 기술들을 확인하는 몇 가지 테스트를 통과해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 체력뿐만 아니라 야외 활동에 필요한 실질적인 기술까지 검증받아야 한다는 규칙을 설명하고 있어요. \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">that\u003c/b>과 \u003cb class=\"key\">전치사 \u003c/b>\u003cb class=\"key\">in\u003c/b> 뒤의 동명사 병렬 구조가 핵심인 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사 [some tests] + [that] + [동사 [check]] : \"~하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사 병렬 구조\u003c/span> : 전치사 [in] + [동명사1(using)] + [, 동명사2(reading)] + [and 동명사3(giving)] : \"~하는 것에서\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Also, 또한. each team must pass some tests, 각 팀은 몇 가지 테스트를 통과해야 합니다. that check their skills, 기술들을 확인하는. in using ropes, reading maps, and giving first aid, 로프 사용하기, 지도 읽기, 응급 처치하기에서의. 이 문장 전체를 해석하면, 또한, 각 팀은 로프 사용하기, 지도 읽기, 응급 처치하기에서의 기술들을 확인하는 몇 가지 테스트를 통과해야 합니다.","hl":"m"},{"n":24,"text":"이 문장에서는 단순한 체력 확인을 넘어 로프 타기나 지도 읽기 같은 실제 생존 기술 검증이 필요하다고 말하고 있어요. 여러 가지 능력을 꼼꼼하게 평가받는다는 것을 강조하죠.","hl":"mn"},{"n":25,"text":"첫 번째 어법 포인트는 that이에요. some tests라는 선행사를 받아주는 주격 관계대명사로 쓰여 뒤에서 꾸며주고 있죠. 두 번째 포인트는 전치사 in 뒤에 이어지는 using, reading, giving 같은 동명사들이에요. 콤마와 and로 연결된 병렬 구조 형태를 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 중요한데\u003c/span>\u003cspan class=\"en\">This is important\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 경주가 매우 힘들어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> the race is very tough,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람이 도전에 준비되어 있어야 하기 때문입니다.\u003c/span>\u003cspan class=\"en\">and everyone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> ready for the challenges.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 중요한데 왜냐하면 경주가 매우 힘들어서 모든 사람이 도전에 준비되어 있어야 하기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 철저한 사전 테스트가 왜 필수적인지 이유를 밝혀주는 문장이에요. \u003cb class=\"key\">접속사 \u003c/b>\u003cb class=\"key\">because\u003c/b>를 활용해 레이스의 난이도와 철저한 준비의 필요성을 설득력 있게 전달하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사\u003c/span> : 주절 [This is important] + [because] + [부사절 (주어 + 동사)] : \"~이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : 주어 [everyone] + [needs (타동사)] + [to부정사구 (to be ready)] : \"~할 필요가 있다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"This is important, 이것은 중요한데. because the race is very tough, 왜냐하면 경주가 매우 힘들어서. and everyone needs to be ready for the challenges, 모든 사람이 도전에 준비되어 있어야 하기 때문입니다.. 이 문장 전체를 해석하면, 이것은 중요한데 왜냐하면 경주가 매우 힘들어서 모든 사람이 도전에 준비되어 있어야 하기 때문입니다.","hl":"m"},{"n":27,"text":"앞서 말한 까다로운 테스트들을 왜 반드시 거쳐야 하는지 그 이유를 명확하게 짚어주는 대목이에요. 경주 코스가 너무 험하기 때문에 누구나 철저하게 각오를 다져야 한다는 뜻이죠.","hl":"mn"},{"n":28,"text":"첫 번째 어법 포인트는 because예요. 앞 문장 전체의 상황에 대해 이유를 설명해 주는 부사절을 이끌고 있죠. 두 번째 포인트는 need 뒤에 쓰인 to부정사에요. everyone이 주어일 때 단수 취급하므로 needs로 알맞게 수 일치 시켜 준 것도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경주를 끝내기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">finish\u003c/span> the race,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 팀은\u003c/span>\u003cspan class=\"en\">each team\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도달해야 합니다\u003c/span>\u003cspan class=\"en\">must reach\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 체크포인트에\u003c/span>\u003cspan class=\"en\">every checkpoint.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경주를 끝내기 위해, 각 팀은 모든 체크포인트에 도달해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 팀 \u003cb class=\"key\">모험가들\u003c/b>이 완주하기 위해 반드시 지켜야 할 엄격한 규칙을 설명하고 있어요. 단순히 빨리 달리는 것뿐만 아니라 코스에 있는 모든 \u003cb class=\"key\">체크포인트\u003c/b>를 빠짐없이 거쳐야 한다는 점을 강조하는 핵심 문맥이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To [동사원형(finish)] + [목적어(the race)] : \"경주를 끝내기 위해\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"To finish the race, 경주를 끝내기 위해. each team, 각 팀은. must reach, 도달해야 합니다. every checkpoint, 모든 체크포인트에. 이 문장 전체를 해석하면, 경주를 끝내기 위해, 각 팀은 모든 체크포인트에 도달해야 합니다.","hl":"m"},{"n":30,"text":"이번 문장은 팀이 완주하기 위해 지켜야 할 필수 조건을 말하고 있어요. 모든 체크포인트를 꼭 거쳐야 한다는 점을 나타내죠.","hl":"mn"},{"n":31,"text":"첫 번째 어법 포인트는 문장 맨 앞에 나온 To finish예요. 이것은 목적을 나타내는 부사적 용법의 to부정사로 쓰여서 경주를 끝내기 위해라고 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 먼저 ~하는 팀\u003c/span>\u003cspan class=\"en\">The first team\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경주를 마치는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">finish \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">승리합니다\u003c/span>\u003cspan class=\"en\">wins.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 먼저 경주를 마치는 팀이 승리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">어드벤처 \u003c/b>\u003cb class=\"key\">레이스\u003c/b>의 최종 승리 조건이 무엇인지 명확하게 보여줘요. 가장 먼저 결승점에 도착하는 팀이 이긴다는 \u003cb class=\"key\">우승 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 간결하게 전달하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사(The first tea
