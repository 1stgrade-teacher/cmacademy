<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 비상(황) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 비상(황) 8과 본문1","audioDir":"1_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>비상(황)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Last Wild Race in Patagonia\u003c/h1>\u003ch2>파타고니아의 마지막 야생 경주\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 칠레 남부 파타고니아에서 열리는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">도전적인 \u003c/b>\u003cb class=\"key\">경주\u003c/b>는 체력과 \u003cb class=\"key\">팀워크\u003c/b>뿐만 아니라 \u003cb class=\"key\">자연환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>까지 요구합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Last Wild Race in Patagonia requires not only physical and teamwork skills but also a strong commitment to protecting nature.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간에는 칠레 남부 파타고니아에서 열리는 특별한 모험에 대해 함께 알아볼게요. 이 글은 세계에서 가장 도전적인 경주를 소개하면서 자연을 보호해야 한다는 메시지를 전하고 있어요. 전체 내용과 핵심 표현을 꼼꼼하게 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 마치 스마트폰을 처음 켜면 기본 설정이 보이듯, 극한의 \u003cb class=\"key\">익스트림 \u003c/b>\u003cb class=\"key\">레이스(extreme \u003c/b>\u003cb class=\"key\">race)\u003c/b> 역시 철저한 \u003cb class=\"key\">생태계 \u003c/b>\u003cb class=\"key\">보존(ecosystem \u003c/b>\u003cb class=\"key\">conservation)\u003c/b> 원칙을 기본으로 탑재해야 비로소 시작될 수 있습니다. 이러한 \u003cb class=\"key\">지속 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">모험(sustainable \u003c/b>\u003cb class=\"key\">adventure)\u003c/b>은 단순한 경쟁을 넘어 자연과 인간이 공존하는 방식을 우리에게 보여줍니다.)\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 살펴볼까요. 마치 스마트폰을 처음 켜면 기본 설정이 보이듯이 극한의 익스트림 레이스 역시 철저한 생태계 보존 원칙을 기본으로 탑재해야 비로소 시작될 수 있어요. 이러한 지속 가능한 모험은 단순한 경쟁을 넘어 자연과 인간이 공존하는 방식을 우리에게 보여준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경주 소개\u003csmall>도입 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>필자는 독자들에게 세상에서 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">도전적인 \u003c/b>\u003cb class=\"key\">경주\u003c/b>인 The Last Wild Race를 소개하며, 이 경주에 참여하려면 힘뿐만 아니라 \u003cb class=\"key\">팀워크\u003c/b>도 필요하다고 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경주의 특징\u003csmall>전개 · 문장 7–12\u003c/small>\u003c/h4>\u003cp>경주 코스는 매년 바뀌며 참가자들은 경주 하루 전에야 코스를 알게 되고, 걷기, 자전거 타기, 배 젓기 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">활동\u003c/b>으로 야생을 통과합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>환경 보호\u003csmall>결론 · 문장 13–16\u003c/small>\u003c/h4>\u003cp>이 경주는 단순한 스포츠가 아니라 \u003cb class=\"key\">자연환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>가 중요한 요소이며, 불을 피우거나 쓰레기를 남기지 말아야 한다는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 경주 소개부터 환경 보호까지 자연스럽게 이어지는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 첫 번째 문장부터 여섯 번째 문장까지 살펴볼게요. 필자는 독자들에게 세상에서 가장 도전적인 경주인 The Last Wild Race를 소개하며, 이 경주에 참여하려면 힘뿐만 아니라 팀워크도 필요하다고 강조하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 일곱 번째 문장부터 열두 번째 문장까지의 내용이에요. 경주 코스는 매년 바뀌고 참가자들은 경주 하루 전에야 코스를 알게 되며, 걷기나 자전거 타기 그리고 배 젓기 같은 다양한 활동으로 야생을 통과한다고 설명하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 열세 번째 문장부터 마지막 열여섯 번째 문장까지 정리해 볼게요. 이 경주는 단순한 스포츠가 아니라 자연환경 보호가 매우 중요한 요소이며, 불을 피우거나 쓰레기를 남기지 말아야 한다는 환경 규칙을 강조하고 있어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 질문을 던진 뒤 그에 대한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">답변과 \u003c/b>\u003cb class=\"key\">설명\u003c/b>을 이어가는 방식을 취하고 있습니다. 첫 문장의 질문으로 독자의 \u003cb class=\"key\">호기심을 \u003c/b>\u003cb class=\"key\">유발\u003c/b>한 뒤 본문 내용을 전개합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Do you know (1)\u003c/b>\u003cspan>질문을 통한 도입\u003c/span>\u003cb>It is (2)\u003c/b>\u003cspan>답변 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the most challenging race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The Last Wild Race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The race course\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The race\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이번 지문은 질문을 던진 뒤 그에 대한 구체적인 답변과 설명을 이어가는 방식을 취하고 있어요. 첫 문장의 질문으로 독자의 호기심을 유발한 뒤 본문 내용을 전개하는 두괄식 구조랍니다.","hl":"ty"},{"n":8,"text":"글의 전개 속에서 Do you know 같은 표현을 통해 질문을 던지고, It is 같은 표현으로 답변을 제시하는 신호어들을 잘 살펴봐야 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>challenging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도전적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Southern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>남부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>Earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>team\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팀\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/ "lp-sa\">\u003cdiv>\u003cb class=\"w\">challenging\u003c/b>\u003cspan class=\"m\">도전적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">demanding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">join\u003c/b>\u003cspan class=\"m\">참여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">participate in\u003c/span>\u003cspan class=\"s\">take part in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rough\u003c/b>\u003cspan class=\"m\">거친\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uneven\u003c/span>\u003cspan class=\"s\">rugged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">smooth\u003c/span>\u003cspan class=\"a\">even\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 동의어와 반의어 정리 시간이에요. challenging의 동의어로는 difficult나 demanding이 있고 반의어로는 easy나 simple이 있어요. protect의 동의어는 guard나 preserve이고 반의어는 destroy나 harm이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 아시나요\u003c/span>\u003cspan class=\"en\">Do you know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 도전적인 경주가 무엇인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">challenging \u003c/span>\u003cspan class=\"tgt\">race \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 세상에서 가장 도전적인 경주가 무엇인지 아시나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부에서 독자의 \u003cb class=\"key\">호기심\u003c/b>을 유발하는 역할을 해요. 세상에서 가장 도전적인 경주가 무엇인지 질문을 던지며 \u003cb class=\"key\">The \u003c/b>\u003cb class=\"key\">Last \u003c/b>\u003cb class=\"key\">Wild \u003c/b>\u003cb class=\"key\">Race\u003c/b>라는 앞으로의 핵심 소재를 자연스럽게 소개하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 [what] + 주어 [the most challenging race in the world] + 동사 [is] : \"가장 도전적인 경주가 무엇인지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Do you know, 여러분은 아시나요. what the most challenging race, 가장 도전적인 경주가 무엇인지. in the world is?, 세상에서. 이 문장 전체를 해석하면, 여러분은 세상에서 가장 도전적인 경주가 무엇인지 아시나요?","hl":"m"},{"n":12,"text":"이 문장은 글의 시작 부분에서 독자의 호기심을 이끌어내는 역할을 해요. 세상에서 가장 도전적인 경주가 무엇인지 질문을 던지며 이 글의 핵심 소재인 The Last Wild Race를 자연스럽게 소개하고 있답니다.","hl":"mn"},{"n":13,"text":"첫 번째 어법 포인트는 간접의문문이에요. 문장 안에 다른 문장이 의문사로 들어갈 때는 어순이 의문사, 주어, 동사의 순서가 되어야 해요. 그래서 주어인 the most challenging race in the world 뒤에 동사 is가 온다는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입니다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘마지막 야생 경주(The Last Wild Race)’\u003c/span>\u003cspan class=\"en\">&quot;The Last Wild Race&quot;!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 ‘마지막 야생 경주(The Last Wild Race)’입니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장에서 던진 질문에 대한 정답을 직접적으로 말해주는 문장이에요. 이 경주의 공식 명칭인 \u003cb class=\"key\">The \u003c/b>\u003cb class=\"key\">Last \u003c/b>\u003cb class=\"key\">Wild \u003c/b>\u003cb class=\"key\">Race\u003c/b>를 밝히며 독자의 \u003cb class=\"key\">관심\u003c/b>을 집중시키고 있어요.\u003c/div>","segs":[{"n":14,"text":"It, 그것은. is, 입니다. \"The Last Wild Race\"!, ‘마지막 야생 경주(The Last Wild Race)’. 이 문장 전체를 해석하면, 그것은 ‘마지막 야생 경주(The Last Wild Race)’입니다!","hl":"m"},{"n":15,"text":"첫 번째 문장에서 던진 질문에 대한 정답을 직접적으로 알려주는 문장이에요. 이 경주의 이름인 The Last Wild Race를 밝히며 우리의 관심을 꽉 잡아두고 있죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 우리와 함께하셔야 합니다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">join\u003c/span> us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남부 파타고니아에서\u003c/span>\u003cspan class=\"en\">in Southern Patagonia,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">칠레의\u003c/span>\u003cspan class=\"en\">Chile.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 칠레의 남부 파타고니아에서 우리와 함께하셔야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 이 경주가 열리는 장소를 알려주며 \u003cb class=\"key\">참여\u003c/b>를 권유하는 문장이에요. 대자연이 살아 숨 쉬는 \u003cb class=\"key\">Southern \u003c/b>\u003cb class=\"key\">Patagonia\u003c/b>이라는 구체적 배경을 제시하고 있어요.\u003c p-chunk\">\u003cspan class=\"ko\">자전거를 타며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">ride \u003c/span>\u003cspan class=\"tgt\">bikes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">험한 길에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">tough \u003c/span>\u003cspan class=\"tgt\">roads, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배를 젓습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">row \u003c/span>\u003cspan class=\"tgt\">boats\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">속도가 빠른 물 위에서\u003c/span>\u003cspan class=\"en\">on rapid water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 거친 땅을 걷고, 험한 길에서 자전거를 타며, 속도가 빠른 물 위에서 배를 젓습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 11번 문장에서 언급한 '다양한 활동들'이 구체적으로 어떤 것인지 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 나열하여 설명하고 있어요. 걷기, 자전거 타기, 배 젓기라는 역동적인 활동이 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [walk] ..., [ride] ..., and [row] ... : \"걷고, 자전거를 타며, 배를 젓습니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They walk, 그들은. on rough ground, 거친 땅을 걷고. ride bikes, 자전거를 타며. on tough roads, 험한 길에서. and row boats, 배를 젓습니다. on rapid water, 속도가 빠른 물 위에서. 이 문장 전체를 해석하면, 그들은 거친 땅을 걷고, 험한 길에서 자전거를 타며, 속도가 빠른 물 위에서 배를 젓습니다.","hl":"m"},{"n":43,"text":"이번 문장은 앞서 말한 다양한 활동이 무엇인지 구체적인 예시를 들어주는 역할을 해요. 걷고, 자전거를 타고, 배를 젓는 활동을 차례대로 보여주고 있죠.","hl":"mn"},{"n":44,"text":"이번 문장의 핵심 어법은 바로 병렬 구조예요. 주어 They에 이어지는 walk, ride, row라는 세 개의 동사가 등위접속사 and와 함께 쓰여서 모두 같은 동사원형 형태를 유지하고 있다는 것을 꼭 확인해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 경주는\u003c/span>\u003cspan class=\"en\">The race\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 ~가 아닙니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스포츠에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> sports.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 경주는 단지 스포츠에 관한 것만은 아닙니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 경주가 단순히 체력 경쟁을 넘어 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>와 같은 더 큰 가치를 담고 있음을 강조합니다. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">just \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">but \u003c/b>\u003cb class=\"key\">also \u003c/b>\u003cb class=\"key\">B\u003c/b> 구문의 앞부분으로서 \u003cb class=\"key\">스포츠\u003c/b> 이상의 의미를 가진다는 맥락을 전달해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">not just A but also B 구문의 축소형 및 부분 부정 표현\u003c/span> : [be동사] + not just [전치사구] : \"단지 ~에 관한 것만은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The race, 그 경주는. is not just, 단지 ~가 아닙니다. about sports, 스포츠에 관한. 이 문장 전체를 해석하면, 그 경주는 단지 스포츠에 관한 것만은 아닙니다.","hl":"m"},{"n":46,"text":"이번 문장은 경주가 단순히 이기고 지는 스포츠 경쟁만을 뜻하는 게 아니라는 점을 말해줘요. 환경 보호라는 더 중요한 목적이 숨어 있다는 걸 알려주는 문장이죠.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 not just about 표현이에요. 단순한 스포츠가 아니라는 걸 강조하려고 not just를 쓴 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u00 class=\"lp-sno\">문장 15 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~해서는 안 된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불을 피우거나\u003c/span>\u003cspan class=\"en\">make fires\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남기지 말아야 합니다\u003c/span>\u003cspan class=\"en\">or leave\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를\u003c/span>\u003cspan class=\"en\">trash behind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경주 중에\u003c/span>\u003cspan class=\"en\">during the race.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 경주 중에 불을 피우거나 쓰레기를 남기지 말아야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 \u003cb class=\"key\">자연을 \u003c/b>\u003cb class=\"key\">돌볼 \u003c/b>\u003cb class=\"key\">필요가 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 방침을 구체적인 행동 수칙으로 설명합니다. \u003cb class=\"key\">불을 \u003c/b>\u003cb class=\"key\">피우거나 \u003c/b>\u003cb class=\"key\">쓰레기를 \u003c/b>\u003cb class=\"key\">남기지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 실천을 통해 자연을 보호해야 함을 엄격하게 경고해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must의 부정형(금지)\u003c/span> : [조동사 must] + not + [동사원형] : \"~해서는 안 된다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"They, 그들은. must not, ~해서는 안 된다. make fires, 불을 피우거나. or leave, 남기지 말아야 합니다. trash behind, 쓰레기를. during the race, 경주 중에. 이 문장 전체를 해석하면, 그들은 경주 중에 불을 피우거나 쓰레기를 남기지 말아야 합니다.","hl":"m"},{"n":52,"text":"이번 문장은 자연 보호를 위해 참가자들이 지켜야 할 구체적인 행동을 알려줘요. 경주를 하는 동안 불을 피우거나 쓰레기를 남기지 말아야 한다는 점을 거듭 강조하고 있죠.","hl":"mn"},{"n":53,"text":"첫 번째 어법 포인트는 must not 조동사예요. 강한 금지를 뜻하는 must not 뒤에 동사원형을 써서 절대 하지 말아야 할 행동을 명확하게 지시하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가\u003c/span>\u003cspan class=\"en\">Everyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보호해야 합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">protect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연환경을\u003c/span>\u003cspan class=\"en\">the natural environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남부 파타고니아의\u003c/span>\u003cspan class=\"en\">of Southern Patagonia.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두가 남부 파타고니아의 자연환경을 보호해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">대회 \u003c/b>\u003cb class=\"key\">참가자들\u003c/b>뿐만 아니라 우리 모두 \u003cb class=\"key\">자연을 \u003c/b>\u003cb class=\"key\">보호해야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 강조하는 마지막 문장입니다. \u003cb class=\"key\">Southern \u003c/b>\u003cb class=\"key\">Patagonia의 \u003c/b>\u003cb class=\"key\">아름다운 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 지키기 위한 \u003cb class=\"key\">당부의 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전달하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 의미\u003c/span> : 주어 + should + [동사원형 (protect)] : \"보호해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Everyone, 모두가. should protect, 보호해야 합니다. the natural environment, 자연환경을. of Southern Patagonia, 남부 파타고니아의. 이 문장 전체를 해석하면, 모두가 남부 파타고니아의 자연환경을 보호해야 합니다.","hl":"m"},{"n":55,"text":"이 문장은 대회 참가자들뿐만 아니라 우리 모두 자연을 보호해야 한다는 글의 핵심 주제를 강조하는 마지막 문장이랍니다. Southern Patagonia의 아름다운 환경을 지키기 위한 당부의 메시지를 전달하고 있어요.","hl":"mn"},{"n":56,"text":"첫 번째 어법 포인트는 조동사 should예요. 조동사 should는 ~해야 한다는 의무의 뜻을 나타내며, 뒤에는 반드시 동사원형이 와야 해요. 그래서 protect에 s나 ed가 붙지 않은 원형 형태 그대로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>칠레 남부 파타고니아에서 열리는 \u003cb class=\"key\">The \u003c/b>\u003cb class=\"key\">Last \u003c/b>\u003cb class=\"key\">Wild \u003c/b>\u003cb class=\"key\">Race\u003c/b>는 세계에서 가장 도전적인 경주입니다.\u003c/li>\u003cli>참가자들은 체력뿐만 아니라 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">팀워크\u003c/b>를 발휘해야 합니다.\u003c/li>\u003cli>경주 코스는 매년 바뀌며 \u003cb class=\"key\">경주 \u003c/b>\u003cb class=\"key\">하루 \u003c/b>\u003cb class=\"key\">전\u003c/b>에야 공개됩니다.\u003c/li>\u003cli>참가자들은 자연을 훼손하지 않기 위해 \u003cb class=\"key\">불을 \u003c/b>\u003cb class=\"key\">피우거나 \u003c/b>\u003cb class=\"key\">쓰레기를 \u003c/b>\u003cb class=\"key\">남기지 \u003c/b>\u003cb class=\"key\">말아야\u003c/b> 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Last Wild Race in Patagonia requires not only physical and teamwork skills but also a strong commitment to protecting nature.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 칠레 남부 파타고니아에서 열리는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">도전적인 \u003c/b>\u003cb class=\"key\">경주\u003c/b>는 체력과 \u003cb class=\"key\">팀워크\u003c/b>뿐만 아니라 \u003cb class=\"key\">자연환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>까지 요구합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 배운 내용을 바탕으로 지문의 흐름을 다시 한번 복습해 보세요. 수고 많았고 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
