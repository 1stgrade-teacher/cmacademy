  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"문법2","title":"간접의문문 완전 정복","audioDir":"2_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">간접의문문\u003c/div>\u003ch1>간접의문문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>간접의문문의 형태와 쓰임을 이해하고 직접의문문을 간접의문문으로 바꿀 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중2 비상 8과의 핵심 문법인 간접의문문을 함께 공부해 볼 거예요. 누군가에게 Where is she?라고 직접 묻는 대신 Do you know where she is?라고 물어보는 표현, 많이 들어 봤죠? 오늘 이 간접의문문의 형태와 쓰임을 확실하게 정리해 볼게요. 어렵지 않으니까 끝까지 잘 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">간접의문문이란?\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">다른 문장에서 \u003cb class=\"key\">주어\u003c/b>, \u003cb class=\"key\">목적어\u003c/b>, \u003cb class=\"key\">보어\u003c/b> 등의 역할을 하는 의문문을 \u003cb class=\"key\">간접의문문\u003c/b>이라고 해요. 두 문장이 하나로 합쳐지면서 의문문이 큰 문장의 한 부분이 되는 거예요.\u003cdiv>\u003cspan class=\"g-formula\">Do you know? + Where is she? = Do you know where she is?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Do you know \u003cspan class=\"fx\">where she is\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">그녀가 어디에 있는지 아니?\u003c/div>\u003cdiv class=\"g-note\">Do you know?와 Where is she?가 합쳐진 간접의문문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Can you tell me \u003cspan class=\"fx\">where the post office is\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">우체국이 어디에 있는지 알려 줄래요?\u003c/div>\u003cdiv class=\"g-note\">간접의문문이 tell me 뒤 목적어 자리에 온 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Do you know \u003cspan class=\"fx\">why the baby is crying\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">아기가 왜 울고 있는지 아니?\u003c/div>\u003cdiv class=\"g-note\">why가 이끄는 간접의문문이 목적어로 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Do you know \u003cspan class=\"fx\">when the teams find out the course\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">팀들이 코스를 언제 알게 되는지 아니?\u003c/div>\u003cdiv class=\"g-note\">when이 이끄는 간접의문문도 목적어 역할을 해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>간접의문문은 \u003cb class=\"key\">목적어\u003c/b> 자리에 자주 오고, 의문사가 이끄는 \u003cb class=\"key\">절\u003c/b> 전체가 하나의 덩어리로 쓰여요.\u003c/div>","segs":[{"n":2,"text":"자, 오늘 첫 번째로 배울 것은 간접의문문이 무엇인지예요. 간접의문문은 다른 문장 속에서 주어나 목적어, 또는 보어 역할을 하는 의문문을 말해요. 두 문장이 하나로 합쳐지면서 의문문이 문장의 일부가 되는 거죠. 예를 들어 Do you know?와 Where is she?가 만나서 Do you know where she is?가 되는 거예요. 이때 where she is가 know의 목적어 역할을 한답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. Do you know where she is?라고 읽어요. 뜻은 그녀가 어디에 있는지 아니? 예요. 아까 배운 대로 두 문장이 하나로 합쳐지면서 where she is가 know의 목적어 자리에 들어간 모습이에요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. Can you tell me where the post office is?라고 읽어요. 뜻은 우체국이 어디에 있는지 알려 줄래요? 예요. 여기서도 where the post office is가 tell me 뒤에서 목적어 역할을 하고 있어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문이에요. Do you know why the baby is crying?이라고 읽어요. 뜻은 아기가 왜 울고 있는지 아니? 예요. why가 이끄는 절 전체가 know의 목적어가 된 문장이에요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. Do you know when the teams find out the course?라고 읽어요. 뜻은 팀들이 코스를 언제 알게 되는지 아니? 예요. 여기서도 when이 이끄는 부분이 문장의 목적어로 쓰였어요.","hl":"ex-3"},{"n":7,"text":"간접의문문은 보통 know나 tell 같은 동사 뒤 목적어 자리에 자주 온다는 점도 함께 기억해 두면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">간접의문문의 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">간접의문문은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b>의 어순으로 써요. 직접의문문과 다르게 \u003cb class=\"key\">도치\u003c/b>를 하지 않고 \u003cb class=\"key\">평서문\u003c/b> 어순을 유지해요.\u003cdiv>\u003cspan class=\"g-formula\">의문사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">What time \u003cspan class=\"fx\">does the movie start\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">영화가 몇 시에 시작하니?\u003c/div>\u003cdiv class=\"g-note\">직접의문문이라 조동사 does가 주어 앞에 왔어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Do you know \u003cspan class=\"fx\">what time the movie starts\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">영화가 몇 시에 시작하는지 아니?\u003c/div>\u003cdiv class=\"g-note\">간접의문문은 주어 the movie가 동사 앞에 오는 평서문 어순이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I don't know \u003cspan class=\"fx\">where he lives\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 어디에 사는지 몰라요.\u003c/div>\u003cdiv class=\"g-note\">의문사 뒤에 주어 he, 동사 lives가 오는 어순이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>직접의문문을 간접의문문으로 바꿀 때 \u003cb class=\"key\">조동사\u003c/b> do, does, did는 사라지고 \u003cb class=\"key\">동사\u003c/b> 모양이 바뀌어요.\u003c/div>","segs":[{"n":8,"text":"이제 형태를 살펴볼게요. 간접의문문은 의문사 다음에 주어, 그다음 동사가 오는 어순으로 써요. 직접의문문에서는 does나 did 같은 조동사가 주어 앞으로 나가는데, 간접의문문에서는 그런 도치를 하지 않고 평서문 어순을 그대로 유지해요. 그래서 What time does the movie start?는 Do you know what time the movie starts?로 바뀌는 거예요. 조동사 does가 사라지고 동사 starts 모양으로 바뀐 것도 꼭 기억해 두세요.","hl":"rule"},{"n":9,"text":"첫 번째 예문은 직접의문문이에요. What time does the movie start?라고 읽어요. 뜻은 영화가 몇 시에 시작하니? 예요. 이 문장에서는 조동사 does가 주어 the movie 앞에 나와 있죠.","hl":"ex-0"},{"n":10,"text":"두 번째 예문은 그 문장을 간접의문문으로 바꾼 것이에요. Do you know what time the movie starts?라고 읽어요. 뜻은 영화가 몇 시에 시작하는지 아니? 예요. 주어 the movie 다음에 동사 starts가 오는 평서문 어순이 된 것을 잘 봐 두세요.","hl":"ex-1"},{"n":11,"text":"세 번째 예문은 오늘 배운 어순을 연습하기 위해 준비했어요. I don't know where he lives.라고 읽어요. 뜻은 나는 그가 어디에 사는지 몰라요. 예요. 여기서도 의문사 where 다음에 주어 he, 동사 lives 순서가 그대로 지켜지고 있어요.","hl":"ex-2"},{"n":12,"text":"특히 조동사 do나 does, did가 들어 있던 문장을 바꿀 때는 그 조동사가 사라지고 뒤 동사의 모양이 달라진다는 걸 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">의문사가 없을 때: if / whether\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">의문사가 없을 때는 \u003cb class=\"key\">if\u003c/b>나 \u003cb class=\"key\">whether\u003c/b>로 간접의문문을 이끌어요. 이때도 어순은 \u003cb class=\"key\">주어 + 동사\u003c/b> 평서문 순서 그대로예요.\u003cdiv>\u003cspan class=\"g-formula\">if / whether + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Did she call\u003c/span> you?\u003c/div>\u003cdiv class=\"g-ko\">그녀가 너에게 전화했니?\u003c/div>\u003cdiv class=\"g-note\">의문사가 없는 직접의문문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Can you tell me \u003cspan class=\"fx\">if she called you\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">그녀가 너에게 전화했는지 알려 줄래요?\u003c/div>\u003cdiv class=\"g-note\">의문사 대신 if가 간접의문문을 이끌었어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I wonder \u003cspan class=\"fx\">whether he is busy\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 바쁜지 아닌지 궁금해요.\u003c/div>\u003cdiv class=\"g-note\">whether도 if와 같은 역할을 해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>if와 whether는 뜻이 \u003cb class=\"key\">~인지 아닌지\u003c/b>로 같지만, \u003cb class=\"key\">whether\u003c/b>가 조금 더 격식 있는 표현이에요.\u003c/div>","segs":[{"n":13,"text":"마지막으로 의문사가 없을 때를 배워 볼게요. 의문사가 없는 의문문을 간접의문문으로 만들 때는 if나 whether로 문장을 이끌어요. 이때도 어순은 주어 다음에 동사가 오는 순서 그대로예요. Did she call you?는 Can you tell me if she called you?가 되는데, 이때 did가 사라지고 called로 바뀐 점을 눈여겨보세요.","hl":"rule"},{"n":14,"text":"첫 번째 예문은 의문사가 없는 직접의문문이에요. Did she call you?라고 읽어요. 뜻은 그녀가 너에게 전화했니? 예요. 의문사가 없기 때문에 이것만으로는 간접의문문이 될 수 없어요.","hl":"ex-0"},{"n":15,"text":"두 번째 예문은 그 문장을 간접의문문으로 바꾼 것이에요. Can you tell me if she called you?라고 읽어요. 뜻은 그녀가 너에게 전화했는지 알려 줄래요? 예요. 의문사 대신 if가 앞에 오고, did가 사라져서 called가 된 것을 확인해 보세요.","hl":"ex-1"},{"n":16,"text":"세 번째 예문은 whether를 연습하기 위해 준비했어요. I wonder whether he is busy.라고 읽어요. 뜻은 나는 그가 바쁜지 아닌지 궁금해요. 예요. if 대신 whether를 써도 같은 뜻이 된답니다.","hl":"ex-2"},{"n":17,"text":"if와 whether는 뜻이 같아서 둘 다 쓸 수 있지만, 격식 있는 글에서는 whether를 더 자주 쓴다는 것도 알아 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Do you know where is she?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Do you know where she is?\u003c/div>\u003cdiv class=\"g-why\">간접의문문에서는 도치를 하지 않고 주어 다음에 동사가 와요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Can you tell me where is the post office?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Can you tell me where the post office is?\u003c/div>\u003cdiv class=\"g-why\">간접의문문은 평서문 어순이라 주어 the post office 뒤에 is가 와요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Can you tell me if did she call you?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Can you tell me if she called you?\u003c/div>\u003cdiv class=\"g-why\">if 뒤에는 조동사 did 없이 평서문 어순으로 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":18,"text":"첫 번째로 자주 나오는 실수예요. Do you know where is she?라고 쓰면 틀려요. 간접의문문은 의문사 다음에 주어가 오고 그다음 동사가 와야 하니까 Do you know where she is?가 맞아요. 직접의문문처럼 주어와 동사를 바꾸면 안 된답니다.","hl":"mk-0"},{"n":19,"text":"두 번째 실수는 우체국 문장이에요. Can you tell me where is the post office?라고 하면 틀리고, 주어 the post office 다음에 is가 와서 Can you tell me where the post office is?가 되어야 해요. 주어가 길어져도 순서는 똑같다는 걸 기억하세요.","hl":"mk-1"},{"n":20,"text":"세 번째는 if 뒤의 어순이에요. Can you tell me if did she call you?라고 쓰면 틀리고, if 뒤에는 평서문 어순이 와서 Can you tell me if she called you?가 맞아요. did는 사라지고 call이 called로 바뀐 것도 함께 기억해 두세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">간접의문문의 어순으로 알맞은 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Do you know where is she?\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Do you know where she is?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Do you know where does she live?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Do you know where is she live?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Do you know where she is?\u003c/span>\u003cdiv class=\"g-exp\">간접의문문은 의문사 다음에 주어, 그다음 동사 순서로 쓰기 때문에 where she is가 맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"이번엔 어순 문제예요. 간접의문문의 어순으로 알맞은 문장을 고르세요. 첫 번째, Do you know where is she? 두 번째, Do you know where she is? 세 번째, Do you know where does she live? 네 번째, Do you know where is she live? 잠시 멈추고 직접 골라 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 두 번째 보기예요. 간접의문문은 의문사 다음에 주어가 오고 그다음 동사가 와요. 그래서 Do you know where she is?가 맞고, 나머지는 주어와 동사의 순서가 뒤바뀌어 있거나 조동사가 잘못 들어가 있어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Do you know why the baby ____ crying?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is\u003c/span>\u003cdiv class=\"g-exp\">간접의문문은 의문사 다음에 주어, 동사 순서이므로 the baby 뒤에 is가 와요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"이번에는 빈칸 채우기예요. Do you know why the baby 빈칸 crying? 빈칸에 알맞은 말을 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 is예요. 왜냐하면 간접의문문은 의문사 다음에 주어, 그다음 동사 순
