</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"문법2","title":"not only A but also B 완벽 정복","audioDir":"1_audio","preview":false,"count":77,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">not only ~ but also ...\u003c/div>\u003ch1>not only A but also B 완벽 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>not only ~ but also ...의 의미와 쓰임, 병렬구조, 도치를 예문으로 익히고 문제에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 not only A but also B 표현을 배워 볼 거예요. 이 표현은 A뿐만 아니라 B도라는 뜻으로, 두 가지 정보를 함께 강조할 때 써요. 예문과 문제를 통해 자연스럽게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">not only ~ but also ...의 의미와 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">not only ~ but also ...\u003c/b>는 ‘~뿐만 아니라 …도’라는 의미로 두 가지 이상의 정보를 함께 제시할 때 사용해요. 첫 번째뿐만 아니라 \u003cb class=\"key\">두 번째 정보\u003c/b>도 해당됨을 강조할 때 사용하는 표현이에요.\u003cdiv>\u003cspan class=\"g-formula\">not only + A + but also + B\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You need \u003cspan class=\"fx\">not only strength but also teamwork\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 힘뿐만 아니라 팀워크도 필요하다.\u003c/div>\u003cdiv class=\"g-note\">두 가지 필요한 것을 함께 강조해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The soup is \u003cspan class=\"fx\">not only delicious but also healthy\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 수프는 맛있을 뿐만 아니라 건강에도 좋다.\u003c/div>\u003cdiv class=\"g-note\">수프의 두 가지 좋은 점을 함께 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I like \u003cspan class=\"fx\">not only reading books but also writing stories\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 책을 읽는 것뿐만 아니라 이야기를 쓰는 것도 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">좋아하는 두 가지 행동을 함께 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">She visited \u003cspan class=\"fx\">not only the park but also the museum\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 공원뿐만 아니라 박물관도 방문했다.\u003c/div>\u003cdiv class=\"g-note\">방문한 두 장소를 함께 말해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>not only 뒤에는 첫 번째 정보, but also 뒤에는 \u003cb class=\"key\">두 번째 정보\u003c/b>가 온다는 순서를 기억하세요. 두 정보 모두 실제로 해당된다는 뜻을 담고 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 not only A but also B의 뜻부터 볼게요. 이 표현은 우리말로 하면 A뿐만 아니라 B도라는 뜻이에요. 두 가지 정보를 함께 말하면서, 첫 번째 정보뿐 아니라 두 번째 정보도 중요하다는 걸 강조할 때 써요. 그래서 일상 대화나 글쓰기에서 아주 자주 만날 수 있는 표현이랍니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. You need not only strength but also teamwork. 이 문장은 너는 힘뿐만 아니라 팀워크도 필요하다는 뜻이에요. strength와 teamwork, 두 가지가 모두 필요하다는 점을 강조하고 있죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. The soup is not only delicious but also healthy. 이 문장은 그 수프가 맛있을 뿐만 아니라 건강에도 좋다는 뜻이에요. delicious와 healthy, 두 가지 장점을 모두 강조하고 있죠.","hl":"ex-1"},{"n":5,"text":"세 번째 예문입니다. I like not only reading books but also writing stories. 이 문장은 나는 책을 읽는 것뿐만 아니라 이야기를 쓰는 것도 좋아한다는 뜻이에요. reading books와 writing stories, 두 가지 행동을 모두 좋아한다는 걸 알 수 있어요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문입니다. She visited not only the park but also the museum. 이 문장은 그녀가 공원뿐만 아니라 박물관도 방문했다는 뜻이에요. the park와 the museum, 두 장소를 함께 강조하고 있죠.","hl":"ex-3"},{"n":7,"text":"순서를 기억하면 쉬워요. not only 뒤에는 첫 번째 정보가 오고, but also 뒤에는 두 번째 정보가 와요. 그리고 두 정보 모두 실제로 해당된다는 뜻을 담고 있다는 점도 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">not only ~ but also ...의 병렬구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">not only ~ but also ...\u003c/b>로 연결되는 두 요소는 문법적 형태가 \u003cb class=\"key\">일치\u003c/b>해야 해요. 즉 명사는 명사끼리, 동사는 동사끼리, 구는 구끼리 연결해야 자연스러운 문장이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">not only + (A와 같은 형태) + but also + (A와 같은 형태)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">not only plays the guitar but also writes songs\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 기타를 칠 뿐만 아니라 노래도 쓴다.\u003c/div>\u003cdiv class=\"g-note\">plays와 writes가 모두 현재형 동사로 형태가 같아요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>not only 뒤에 동사가 오면 but also 뒤에도 \u003cb class=\"key\">같은 형태의 동사\u003c/b>가 와야 해요. 명사와 동사를 섞어 연결하면 틀린 문장이 됩니다.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 병렬구조예요. He not only plays the guitar but also writes songs. 이 문장은 그는 기타를 칠 뿐만 아니라 노래도 쓴다는 뜻이에요. not only 뒤의 plays와 but also 뒤의 writes가 둘 다 현재형 동사로 형태가 같죠. 이렇게 연결되는 두 요소의 문법 형태를 맞춰 주는 것이 중요해요.","hl":"rule"},{"n":9,"text":"병렬구조 예문입니다. He not only plays the guitar but also writes songs. 이 문장은 그는 기타를 칠 뿐만 아니라 노래도 쓴다는 뜻이에요. plays와 writes가 둘 다 현재형 동사로 형태가 맞춰져 있죠. 이렇게 형태를 같게 연결하는 것이 핵심이에요.","hl":"ex-0"},{"n":10,"text":"형태를 맞추는 게 핵심이에요. not only 뒤에 동사가 오면 but also 뒤에도 같은 형태의 동사가 와야 해요. 명사와 동사를 섞어 연결하면 어색한 문장이 되니 주의해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">not only가 문두에 올 때의 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">강조를 위해 \u003cb class=\"key\">not only\u003c/b>가 문두에 올 경우, 주어와 동사의 순서가 바뀌는 \u003cb class=\"key\">도치\u003c/b>가 일어나요. 이때 not only 뒤에는 조동사나 be동사가 주어 앞에 오고, but also 뒤에는 주어와 동사가 이어집니다.\u003cdiv>\u003cspan class=\"g-formula\">Not only + 조동사 + 주어 + 동사 ~, but + 주어 + also + 동사 ...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Not only did she win the race, but she also broke the record\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 경주에서 이겼을 뿐만 아니라 기록도 깼다.\u003c/div>\u003cdiv class=\"g-note\">not only가 문두에 와서 did가 주어 앞으로 도치되었어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>도치 문장에서는 not only 뒤에 \u003cb class=\"key\">조동사\u003c/b>가 주어 앞에 온다는 점을 기억하세요. 자료의 예문처럼 but 뒤에 주어와 also가 이어지는 형태도 함께 확인해 두세요.\u003c/div>","segs":[{"n":11,"text":"이번에는 강조를 위해 not only를 문장 맨 앞에 쓰는 경우를 배워 볼게요. 이때는 주어와 동사의 순서가 바뀌는 도치가 일어나요. 그래서 Not only did she win the race, but she also broke the record.처럼 did가 주어 앞에 오게 됩니다. 어순이 달라지는 만큼 문장을 자주 소리 내어 익혀 두면 좋아요.","hl":"rule"},{"n":12,"text":"도치 예문입니다. Not only did she win the race, but she also broke the record. 이 문장은 그녀는 경주에서 이겼을 뿐만 아니라 기록도 깼다는 뜻이에요. not only가 문두에 왔기 때문에 did가 she 앞으로 나온 도치가 일어났죠. but 뒤에서는 she also broke the record 순서로 이어진다는 점도 눈여겨보세요.","hl":"ex-0"},{"n":13,"text":"도치에서는 not only 뒤에 조동사가 주어 앞에 와요. 그리고 but 뒤에서는 주어와 also, 동사 순서로 이어지는 형태를 자료의 예문처럼 확인해 두면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She not only visited the park but also the museum.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She visited not only the park but also the museum.\u003c/div>\u003cdiv class=\"g-why\">not only 뒤에는 동사구가, but also 뒤에는 명사구가 와서 병렬구조가 맞지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He not only plays the guitar but also write songs.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He not only plays the guitar but also writes songs.\u003c/div>\u003cdiv class=\"g-why\">병렬구조에서 plays와 writes의 형태를 맞춰야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Not only she won the race, but she also broke the record.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Not only did she win the race, but she also broke the record.\u003c/div>\u003cdiv class=\"g-why\">not only가 문두에 오면 도치가 일어나 조동사 did가 주어 앞에 와야 해요.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"여기서 많이 틀려요. She not only visited the park but also the museum. 이 문장은 not only 뒤에 visited the park라는 동사구가 오고 but also 뒤에 the museum이라는 명사구가 와서 형태가 맞지 않아요. 그래서 She vi
