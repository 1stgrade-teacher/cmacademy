완두콩들이 한 공간에서 함께 살아가며 세상 밖을 꿈꾼다.</li><li>생활 공간: 완두콩 꼬투리(pod)</li><li>등장인물: 다섯 알의 작은 완두콩들(five little peas)</li><li>핵심 키워드: 공동체(together)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02큰 완두콩의 원대한 포부</div><ul><li>가장 큰 완두콩은 넓은 세상에 대한 호기심과 위대한 일을 하고 싶다는 열망을 드러낸다.</li><li>세상(world)의 모습에 대한 궁금증</li><li>목표: 세상을 위해 위대한 일(great work)을 수행함</li><li>상태: 밖으로 나가기를 간절히 기다림(can&#39;t wait)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03작은 완두콩의 자기 의구심</div><ul><li>반면 가장 작은 완두콩은 자신의 작은 크기 때문에 무엇을 할 수 있을지 걱정한다.</li><li>한계 인식: 스스로를 너무 작다(too small)고 느낌</li><li>의문: 자신이 할 수 있는 역할(What can I do?)에 대한 회의감</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04동료들의 지지와 희망</div><ul><li>나머지 완두콩들은 막내를 진심으로 응원하며 분명히 가치 있는 일을 찾을 것이라 격려한다.</li><li>반응: 다른 콩들의 환호와 격려(cheered)</li><li>희망의 메시지: 할 수 있는 무언가(something that you can do)가 있을 것이라는 확신</li><li>핵심 키워드: 발견(find)과 가능성</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pod</td><td class=\"m\">(콩의) 꼬투리, 피막</td></tr><tr><td class=\"w\">be like</td><td class=\"m\">~은 어떠한가, ~와 비슷하다</td></tr><tr><td class=\"w\">great work</td><td class=\"m\">훌륭한 일, 대업</td></tr><tr><td class=\"w\">can&#39;t wait to</td><td class=\"m\">~하는 것이 몹시 기다려지다, 빨리 ~하고 싶다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get out of</td><td class=\"m\">~에서 나가다, ~에서 벗어나다</td></tr><tr><td class=\"w\">good for you</td><td class=\"m\">잘됐구나, 장하다, 축하해</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다, 격려하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다섯 개의 작은 완두콩이</span><span class=\"en\"><b>Five little peas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 살았다</span><span class=\"en\"><b><span class=\"grammar-hl\">lived together</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼬투리 속에서.</span><span class=\"en\"><b>in a pod.</b></span></div></div><div class=\"lec-sent-ko\">다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> lived together in a pod는 완두콩들이 좁고 한정된 공간에서 공동체 생활을 하고 있는 초기 상태를 보여줍니다. 동화의 도입부로서, 이후 각기 다른 운명을 맞이하게 될 캐릭터들의 공통된 출발점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lived together 1형식(S+V) 구조: 주어(Five little peas)와 자동사(lived)로 이루어진 완전한 문장 구조이며, together와 in a pod은 동사를 수식하는 부사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pod</td><td class=\"m\">(콩의) 꼬투리, 피막</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 큰 완두콩이</span><span class=\"en\"><b>The biggest pea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다,</span><span class=\"en\"><b>said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“무엇과</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상은 같은가?</span><span class=\"en\"><b><span class=\"grammar-hl\">is the world like?</span></b></span></div></div><div class=\"lec-sent-ko\">가장 큰 완두콩이 말했다. “세상은 어떤 것 같아?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> What is the world like?는 꼬투리라는 좁은 공간을 벗어나 더 넓은 세상에 대해 호기심과 동경을 품기 시작했다는 의미입니다. 앞 문장의 평온한 공생 상태에서 개별적인 욕구와 탐구심이 생겨나는 변화의 시작을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What is the world like? (관용표현): What is A like?는 &#39;A는 어떠한가?&#39;라는 뜻으로, 대상의 상태나 성질을 물을 때 쓰는 표현이다. like는 전치사로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 훌륭한 일을 하고 싶어</span><span class=\"en\"><b>I want <span class=\"grammar-hl\">to do</span> great work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 위해.</span><span class=\"en\"><b>for the world.</b></span></div></div><div class=\"lec-sent-ko\">난 세상을 위해 훌륭한 일을 하고 싶어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> do great work for the world는 단순히 밖으로 나가는 것을 넘어, 자신의 가치를 증명하고 사회에 기여하겠다는 큰 포부를 드러내는 장면입니다. 이 문장은 가장 큰 완두콩의 성격이 야심 차고 적극적임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to do (to부정사): 명사적 용법. 타동사 want의 목적어 자리에 쓰여 &#39;~하는 것&#39;이라는 행위를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">great work</td><td class=\"m\">훌륭한 일, 대업</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 빨리 하고 싶어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can’t wait</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기서 나가는 것을.”</span><span class=\"en\"><b><span class=\"grammar-hl\">to get out of</span> here.”</b></span></div></div><div class=\"lec-sent-ko\">나는 빨리 여기서 나가고 싶어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> can’t wait to get out은 현재의 안정적인 환경을 답답하게 여기고 있으며, 하루빨리 미지의 세계로 뛰어들고 싶은 조급함과 기대를 강조하여 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t wait to get out of (관용표현): can&#39;t wait toV는 &#39;~하기를 몹시 고대하다/기다릴 수 없다&#39;는 의미로, to부정사(to get)가 결합되어 미래의 행위에 대한 기대감을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get out of</td><td class=\"m\">~에서 나가다, ~에서 벗어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 작은 완두콩이</span><span class=\"en\"><b>The smallest pea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다,</span><span class=\"en\"><b>said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“잘됐다</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Good</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너에게.</span><span class=\"en\"><b><span class=\"grammar-hl\">for you</span>.</b></span></div></div><div class=\"lec-sent-ko\">가장 작은 완두콩이 말했다. “좋겠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Good for you는 큰 형제의 야심을 시기하지 않고 진심으로 축하해 주는 태도를 보여주며, 가장 작은 완두콩의 순수하고 이타적인 성품을 짐작하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Good for you (관용표현): 상대방의 말이나 행동에 대해 &#39;잘됐다&#39; 혹은 &#39;다행이다&#39;라며 칭찬이나 격려를 보낼 때 쓰는 관용구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">good for you</td><td class=\"m\">잘됐구나, 장하다, 축하해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">난 너무 작아.</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m too small</span>.</b></span></div></div><div class=\"lec-sent-ko\">난 너무 작아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I’m too small은 앞서 언급된 &#39;가장 큰 완두
