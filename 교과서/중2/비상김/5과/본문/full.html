"lec-stage-head\">01꿈과 소망</div><ul><li>꼬투리 안의 다섯 완두콩들이 세상에 나가 각자의 역할을 다하길 꿈꾼다.</li><li>큰 완두콩들의 포부와 작은 완두콩의 걱정</li><li>세상으로 나갈 준비를 하는 완두콩들 (get out of here)</li><li>핵심 키워드: 완두콩 꼬투리(pod)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02새로운 시작</div><ul><li>꼬투리가 터지면서 가장 작은 완두콩이 바람에 실려 어느 집 창가에 정착한다.</li><li>바람에 날려 창가 틈의 흙 속으로 들어감 (soil)</li><li>예상치 못한 장소에서 시작된 생명력 (tiny space)</li><li>핵심 키워드: 작은 완두콩(smallest pea)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03운명적 만남</div><ul><li>병상에 누워 지내던 한 소녀가 창가에서 자라나는 작은 식물을 발견한다.</li><li>하루 종일 침대에 누워 지내는 아픈 소녀 (sick girl)</li><li>아기 손가락만 한 초록 식물을 보며 호기심을 느낌 (pea plant)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성장의 기쁨</div><ul><li>완두콩이 자랄수록 그것을 지켜보는 소녀의 몸과 마음도 함께 건강해진다.</li><li>매일 식물을 관찰하며 기운을 차리는 소녀 (stronger and healthier)</li><li>식물의 성장이 소녀에게 전하는 희망과 위안 (happier)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05진정한 결실</div><ul><li>완두콩이 꽃을 피우고 작은 완두콩은 마침내 자신의 존재 가치를 깨닫는다.</li><li>아름다운 분홍색 꽃의 개화 (blossomed)</li><li>소녀의 소중한 친구가 되어 꿈을 이룬 완두콩 (friend)</li><li>핵심 키워드: 자신의 역할 (something you can do)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pod</td><td class=\"m\">꼬투리, 콩깍지</td></tr><tr><td class=\"w\">get out of</td><td class=\"m\">~에서 나가다, 벗어나다</td></tr><tr><td class=\"w\">good for you</td><td class=\"m\">잘됐다, 잘했어</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">응원하다, 환호하다</td></tr><tr><td class=\"w\">break open</td><td class=\"m\">(터져서) 열리다, 갈라지다</td></tr><tr><td class=\"w\">land on</td><td class=\"m\">~에 내려앉다, 착륙하다</td></tr><tr><td class=\"w\">build up</td><td class=\"m\">쌓이다, 강화하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sink into</td><td class=\"m\">~ 속으로 가라앉다, 스며들다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, 살피다</td></tr><tr><td class=\"w\">in wonder</td><td class=\"m\">경이로움에 차서, 놀라며</td></tr><tr><td class=\"w\">day by day</td><td class=\"m\">나날이, 매일매일</td></tr><tr><td class=\"w\">blossom</td><td class=\"m\">꽃이 피다, 번창하다</td></tr><tr><td class=\"w\">wait for</td><td class=\"m\">~을 기다리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다섯 개의 작은 완두콩이</span><span class=\"en\"><b>Five little peas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 살았다</span><span class=\"en\"><b><span class=\"grammar-hl\">lived together</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼬투리 속에서.</span><span class=\"en\"><b>in a pod.</b></span></div></div><div class=\"lec-sent-ko\">다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경을 설정하며, 좁고 한정된 공간인 꼬투리 속에서 다섯 형제가 공동체 생활을 하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lived together (관용표현): &#39;함께 살았다&#39;는 의미로 자동사 live와 부사 together가 결합된 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pod</td><td class=\"m\">꼬투리, 콩깍지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 큰 완두콩이 말했다</span><span class=\"en\"><b>The biggest pea said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“세상은 어떤 것 같아?</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What is the world like?</span></b></span></div></div><div class=\"lec-sent-ko\">가장 큰 완두콩이 말했다. “세상은 어떤 것 같아?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\" ss=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too small 형용사 수식: 부사 too가 형용사 small을 수식하여 &#39;너무 ~한&#39;이라는 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 무엇을 할 수 있겠어?”</span><span class=\"en\"><b><span class=\"grammar-hl\">What can I do?</span>”</b></span></div></div><div class=\"lec-sent-ko\">내가 무엇을 할 수 있겠어?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완두콩이 정착할 장소를 찾았습니다. tiny space는 비록 넓은 들판은 아니지만, 이 작은 콩이 생명을 틔우고 누군가에게 영향을 줄 수 있는 운명적인 장소를 발견했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can I do? (의문문): 의문사(What) + 조동사(can) + 주어(I) + 동사원형(do) 어순의 직접 의문문 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 콩들이 응원했다</span><span class=\"en\"><b>The others cheered,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“무언가가 있을 거야</span><span class=\"en\"><b>“There will be <span class=\"grammar-hl\">something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네가 할 수 있는!</span><span class=\"en\"><b><span class=\"grammar-hl\">that you can do</span>!</b></span></div></div><div class=\"lec-sent-ko\">다른 콩들이 응원했다. “네가 할 수 있는 일이 있을 거야!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작은 완두콩의 불안감을 해소해 주는 형제들의 격려입니다. find it은 지금은 비록 보잘것없어 보여도 세상 밖으로 나가면 각자의 가치를 실현할 기회가 반드시 올 것이라는 긍정적인 믿음을 심어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something that you can do (관계대명사): something(선행사) + 관계대명사(that) + 주어(you) + 동사(can do) 구조로, do의 목적어가 생략된 불완전한 절이 선행사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheer</td><td class=\"m\">응원하다, 환호하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">넌 그것을 찾을 거야.”</span><span class=\"en\"><b><span class=\"grammar-hl\">You’ll find</span> it.”</b></span></div></div><div class=\"lec-sent-ko\">넌 그것을 찾을 거야.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 등장인물을 소개하며 이야기의 초점을 완두콩에서 인간의 삶으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You’ll find (조동사): 미래를 나타내는 조동사 will의 축약형(&#39;ll)과 동사원형 find가 결합된 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 꼬투리가 터져 열렸다.</span><span class=\"en\"><b>the pod <span class=\"grammar-hl\">broke open</span>.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 그 꼬투리가 터져 열렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건의 전환점입니다. 안전하지만 좁았던 보호막을 벗어나 드디어 각자의 운명을 개척해야 하는 넓은 세상으로 나가는 변화의 순간을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke open 5형식(SVOC) 구조: 본래 break the pod open(꼬투리를 열어 젖히다)의 능동 구조에서 목적어가 주어로 쓰인 자동사적 용법으로, open은 결과 상태를 나타내는 형용사 보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pod</td><td class=\"m\">꼬투리, 콩깍지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바람이 가장 작은 완두콩을 날려 보냈다</span><span class=\"en\"><b>The wind <span class=\"grammar-hl\">blew the smallest pea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공중으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">up into</span> the air.</b></span></div></div><div class=\"lec-sent-ko\">바람이 가장 작은 완두콩을 공중으로 날려 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완두콩의 의지가 아닌 자연의 힘에 의해 이동이 시작됩니다. into the air는 작은 완두콩이 자신의 계획과는 무관하게 예상치 못한 곳으로 여행을 떠나게 되었음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">blew the smallest pea up into (관용표현): blow A up into B는 &#39;A를 B 안으로 날려 보내다&#39;라는 의미의 동사구 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 날아서 내려앉았다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">flew and landed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 공간에</span><span class=\"en\"><b>on a tiny space</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 집의 창문 옆에 있는.</span><span class=\"en\"><b>by the window of a house.</b></span></div></div><div class=\"lec-sent-ko\">그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완두콩이 정착할 장소를 찾았습니다. tiny space는 비록 넓은 들판은 아니지만, 이 작은 콩이 생명을 틔우고 누군가에게 영향을 줄 수 있는 운명적인 장소를 발견했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flew and landed (병렬구조): 등위접속사 and를 통해 과거형 동사 flew와 landed가 동일한 주어(It)에 연결되어 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흙이 쌓이자</span><span class=\"en\"><b>Soil <span class=\"grammar-hl\">built up</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 작은 완두콩은 그 속으로 가라앉았다.</span><span class=\"en\"><b>and the tiny pea sank into it.</b></span></div></div><div class=\"lec-sent-ko\">흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성장을 위한 본격적인 준비 단계입니다. sank into it은 콩이 단순히 흙 위에 놓인 것이 아니라, 뿌리를 내리고 싹을 틔우기 위해 흙속에 깊이 자리 잡았음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">built up (관용표현): &#39;쌓이다&#39;라는 의미로 쓰인 구동사 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 어린 소녀가 살았다</span><span class=\"en\"><b>A young girl <span class=\"grammar-hl\">lived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 어머니와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> her mom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 집에서.</span><span class=\"en\"><b>in the house.</b></span></div></div><div class=\"lec-sent-ko\">그 집에는 한 어린 소녀가 어머니와 함께 살고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 등장인물을 소개하며 이야기의 초점을 완두콩에서 인간의 삶으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lived with (동사구): 자동사 live와 전치사 with가 결합하여 &#39;~와 함께 살다&#39;라는 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 어머니는 일해야 했다</span><span class=\"en\"><b>Her mom <span class=\"grammar-hl\">had to work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이른 아침부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from early morning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">늦은 저녁까지.</span><span class=\"en\"><b><span class=\"grammar-hl\">to late evening</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀의 어머니는 이른 아침부터 늦은 저녁까지 일해야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소녀의 어려운 가정 환경을 설명합니다. work from early morning to late evening은 엄마가 생계를 꾸리느라 너무 바빠서 아픈 딸을 온종일 곁에서 돌봐주기 힘든 상황임을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to work (관용표현): 의무를 나타내는 조동사 must의 대용 표현인 have to의 과거형으로 뒤에 동사원형이 온다.</div><div class=\"lec-gr-item\">from early morning to late evening (관용표현): from A to B 구조로 &#39;A에서 B까지&#39;라는 시간의 범위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소녀는 매우 아팠다</span><span class=\"en\"><b>The girl was very sick</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 침대에 누워 있었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">stayed in bed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 종일.</span><span class=\"en\"><b>all day.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 매우 아파서 하루 종일 침대에 누워 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소녀의 무기력한 상태를 보여줍니다. stayed in bed all day는 병세가 깊어 외부 활동이 불가능하며 정서적으로도 매우 고립되고 우울한 상태에 놓여 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed in bed (관용표현): &#39;아파서 누워 있다/침대에 머물다&#39;라는 의미로 쓰이는 숙어적 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀가 물었다</span><span class=\"en\"><b>the girl asked,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“엄마, 저 창문 옆에 있는 초록색 물건은 무엇인가요?”</span><span class=\"en\"><b>“Mom, <span class=\"grammar-hl\">what is the green thing</span> by the window?”</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 소녀가 “엄마, 창문 옆에 있는 저 초록색 물건이 뭐예요?”라고 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무기력하던 소녀가 외부 세상에 관심을 갖기 시작하는 첫 신호입니다. green thing은 삭막했던 소녀의 일상에 갑자기 나타난 생명력을 상징합니다. 13. “Oh, it’s a pea plant! It is as little as a baby’s finger. Where did it come from?” asked Mom. 식물의 정체가 밝혀집니다. as little as a baby’s finger는 식물이 아직은 매우 연약하고 작지만, 소녀처럼 누군가의 보호와 관심이 필요한 소중한 존재임을 보여줍니다. 14. The girl looked at the little plant in wonder. 식물을 대하는 소녀의 정서적 변화를 나타냅니다. in wonder는 무채색이었던 소녀의 마음에 호기심과 설렘, 그리고 삶에 대한 기대감이 피어나기 시작했다는 의미입니다. 15. Every day, the girl went to the window to see the plant. 식물이 소녀를 움직이게 만드는 동력이 되었음을 보여줍니다. went to the window는 침대에만 누워있던 소녀가 스스로 몸을 일으켜 세상과 소통하려는 의지를 갖게 되었다는 중요한 변화를 뜻합니다. 16. It grew taller and taller. 식물의 성장은 곧 소녀의 건강 회복을 암시하는 복선 역할을 합니다. 17. It became as tall as a small tree after a few weeks. 시간이 흐름에 따라 식물이 강인해졌음을 보여줍니다. as tall as a small tree는 연약했던 새싹이 이제는 스스로를 지탱할 수 있을 만큼 튼튼한 생명체로 성장했음을 강조합니다. 18. “How pretty and healthy you are! When I sit in the sun to see you, I feel healthier, too!” 식물과 소녀의 정서적 교감을 직접적으로 표현합니다. feel healthier는 식물이 건강하게 자라는 모습에서 소녀가 생명의 에너지를 얻고, 실제로 병마를 이겨낼 희망과 힘을 얻고 있음을 의미합니다. 19. The girl became stronger and happier day by day. 식물의 성장이 가져온 긍정적인 결과를 명확히 제시합니다. stronger and happier는 소녀가 육체적인 질병뿐만 아니라 마음의 병까지 치유하며 활기찬 일상을 되찾았음을 나타냅니다. 20. One evening, the girl shouted, “You must see this, Mom! It’s the most wonderful thing!” 이야기의 절정으로, 벅찬 감동을 드러냅니다. most wonderful thing은 단순히 꽃이 핀 현상을 넘어, 죽어가는 듯했던 생명들이 함께 살아난 기적 같은 순간을 표현합니다. 21. A little flower blossomed on the pea plant. 성장의 최종 결실을 맺는 장면입니다. blossomed는 좁은 틈새라는 척박한 환경을 견뎌낸 완두콩이 자신의 아름다움을 세상에 드러내는 순간을 묘사합니다. 22. It was a beautiful pink flower. 꽃의 색채를 구체적으로 묘사하여 소녀의 삶이 다시 밝고 아름답게 물들었음을 시각적으로 보여줍니다. 23. “Thank you, little plant. You are the friend I have waited for!” 소녀가 식물에게 느끼는 깊은 유대감을 드러냅니다. friend I have waited for는 외롭고 고통스러운 투병 기간 동안 이 식물이 소녀에게 유일한 위로이자 삶을 지탱해 준 소중한 동반자였음을 의미합니다. 24. The little pea was as happy as the girl. 완두콩을 의인화하여 표현합니다. 자신의 성장이 타인에게 큰 기쁨과 치유가 되었다는 사실에 완두콩 또한 깊은 만족감을 느끼고 있음을 보여줍니다. 25. It finally found the thing which it could do. 이야기의 주제를 완성하는 결론입니다. found the thing은 처음에 &quot;내가 무엇을 할 수 있을까?&quot;라고 회의감을 가졌던 작은 완두콩이, 결국 누군가의 생명을 구하고 희망을 주는 가장 고귀한 사명을 완수했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is the green thing (의문문): 의문사(what)가 주격 보어 역할을 하며 [의문사 + 동사 + 주어] 어순을 취하는 직접 의문문 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“오, 이건 완두콩 식물이네!</span><span class=\"en\"><b>“Oh, <span class=\"grammar-hl\">it’s a pea plant</span>!</b></span></div></div><div class=\"lec-sent-ko\">“오, 이건 완두콩 식물이네!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물과 소녀의 정서적 교감을 직접적으로 표현합니다. feel healthier는 식물이 건강하게 자라는 모습에서 소녀가 생명의 에너지를 얻고, 실제로 병마를 이겨낼 희망과 힘을 얻고 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s a pea plant 2형식(SVC) 구조: 주어(it) + be동사(is) + 명사 보어(a pea plant)로 이루어진 문장 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~만큼 작구나</span><span class=\"en\"><b>It is <span class=\"grammar-hl\">as little</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아기의 손가락만큼.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> a baby’s finger.</b></span></div></div><div class=\"lec-sent-ko\">그건 아기의 손가락만큼이나 작구나.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 성장이 가져온 긍정적인 결과를 명확히 제시합니다. stronger and happier는 소녀가 육체적인 질병뿐만 아니라 마음의 병까지 치유하며 활기찬 일상을 되찾았음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as little as (관용표현): as + 형용사 + as 구조의 원급 비교로 &#39;~만큼 작은&#39;이라는 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이게 어디에서 온 것일까?”</span><span class=\"en\"><b><span class=\"grammar-hl\">Where did it come from?</span>”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마가 물으셨다.</span><span class=\"en\"><b><span class=\"grammar-hl\">asked Mom</span>.</b></span></div></div><div class=\"lec-sent-ko\">이게 어디에서 온 것일까?” 엄마가 물으셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 절정으로, 벅찬 감동을 드러냅니다. most wonderful thing은 단순히 꽃이 핀 현상을 넘어, 죽어가는 듯했던 생명들이 함께 살아난 기적 같은 순간을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where did it come from? (관용표현): &#39;어디에서 왔는가&#39;를 묻는 의문문으로 come from(~출신이다/유래하다) 구조를 사용한다.</div><div class=\"lec-gr-item\">asked Mom (도치): 직접 인용구가 문장 앞에 위치할 때, 주어가 대명사가 아닌 일반 명사(Mom)이면 [동사 + 주어] 어순으로 도치될 수 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소녀는 그 작은 식물을 바라보았다</span><span class=\"en\"><b>The girl <span class=\"grammar-hl\">looked at</span> the little plant</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경이롭게.</span><span class=\"en\"><b><span class=\"grammar-hl\">in wonder</span>.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 경이롭게 그 작은 식물을 바라보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성장의 최종 결실을 맺는 장면입니다. blossomed는 좁은 틈새라는 척박한 환경을 견뎌낸 완두콩이 자신의 아름다움을 세상에 드러내는 순간을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked at (관용표현): &#39;~을 보다&#39;라는 의미로 타동사구처럼 쓰이는 [자동사+전치사] 구조다.</div><div class=\"lec-gr-item\">in wonder (관용표현): &#39;경이로움 속에서/감탄하며&#39;라는 의미를 나타내는 전치사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in wonder</td><td class=\"m\">경이로움에 차서, 놀라며</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 22 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>Every day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀는 갔다</span><span class=\"en\"><b>the girl went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창문으로</span><span class=\"en\"><b>to the window</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 식물을 보기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> the plant.</b></span></div></div><div class=\"lec-sent-ko\">매일 소녀는 그 식물을 보기 위해 창문으로 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 꽃의 색채를 구체적으로 묘사하여 소녀의 삶이 다시 밝고 아름답게 물들었음을 시각적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적). &#39;~하기 위해서&#39;라는 의미로 앞의 동사 went의 목적을 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 자랐다</span><span class=\"en\"><b>It grew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 키가.</span><span class=\"en\"><b><span class=\"grammar-hl\">taller and taller</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 점점 더 키가 자랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소녀가 식물에게 느끼는 깊은 유대감을 드러냅니다. friend I have waited for는 외롭고 고통스러운 투병 기간 동안 이 식물이 소녀에게 유일한 위로이자 삶을 지탱해 준 소중한 동반자였음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taller and taller (관용표현): [비교급 + and + 비교급] 구조로 &#39;점점 더 ~한&#39;이라는 의미의 강조 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~만큼 키가 커졌다</span><span class=\"en\"><b>It became <span class=\"grammar-hl\">as tall</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 나무만큼</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> a small tree</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 주 후에.</span><span class=\"en\"><b>after a few weeks.</b></span></div></div><div class=\"lec-sent-ko\">몇 주가 지나자 그것은 작은 나무만큼 키가 커졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완두콩을 의인화하여 표현합니다. 자신의 성장이 타인에게 큰 기쁨과 치유가 되었다는 사실에 완두콩 또한 깊은 만족감을 느끼고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as tall as (관용표현): as + 형용사 + as 구조의 원급 비교로 &#39;~만큼 키가 큰&#39;이라는 동등 비교를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 정말 예쁘고 건강하구나!</span><span class=\"en\"><b>“<span class=\"grammar-hl\">How pretty and healthy you are</span>!</b></span></div></div><div class=\"lec-sent-ko\">“너는 정말 예쁘고 건강하구나!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 주제를 완성하는 결론입니다. found the thing은 처음에 &quot;내가 무엇을 할 수 있을까?&quot;라고 회의감을 가졌던 작은 완두콩이, 결국 누군가의 생명을 구하고 희망을 주는 가장 고귀한 사명을 완수했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How pretty and healthy you are (감탄문): [How + 형용사 + 주어 + 동사] 구조의 감탄문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 앉아 있을 때</span><span class=\"en\"><b>When I sit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">햇볕 아래</span><span class=\"en\"><b>in the sun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너를 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> you,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나도 더 건강해지는 것 같아!”</span><span class=\"en\"><b>I <span class=\"grammar-hl\">feel healthier</span>, too!”</b></span></div></div><div class=\"lec-sent-ko\">너를 보기 위해 햇볕에 앉아 있을 때, 나도 더 건강해지는 것 같아!”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적). &#39;~하기 위해서&#39;라는 의미로 sit의 목적을 설명한다.</div><div class=\"lec-gr-item\">feel healthier 2형식(SVC) 구조: 감각동사(feel) 뒤에 주어의 상태를 설명하는 형용사 보어의 비교급(healthier)이 온 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소녀는 더 강해지고 행복해졌다</span><span class=\"en\"><b>The girl became stronger and happier</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날이 갈수록.</span><span class=\"en\"><b><span class=\"grammar-hl\">day by day</span>.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 날이 갈수록 더 강해지고 행복해졌다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">day by day (관용표현): &#39;나날이/매일매일&#39;이라는 의미로 점진적인 변화를 나타내는 부사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">day by day</td><td class=\"m\">나날이, 매일매일</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날 저녁</span><span class=\"en\"><b>One evening,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀가 외쳤다</span><span class=\"en\"><b>the girl shouted,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“엄마, 이걸 꼭 봐야 해요!</span><span class=\"en\"><b>“You <span class=\"grammar-hl\">must see</span> this, Mom!</b></span></div></div><div class=\"lec-sent-ko\">어느 날 저녁, 소녀가 외쳤다. “엄마, 이거를 꼭 봐야 해요!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must see (조동사): 강한 의무나 권유를 나타내는 조동사 must 뒤에 동사원형 see가 온 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 가장 멋진 거예요!”</span><span class=\"en\"><b>It’s <span class=\"grammar-hl\">the most wonderful</span> thing!”</b></span></div></div><div class=\"lec-sent-ko\">그것은 가장 멋진 거예요!”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the most wonderful (최상급): 형용사 wonderful의 최상급 형태로 [the most + 형용사] 구조를 사용한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작은 꽃이 피어 있었다</span><span class=\"en\"><b>A little flower <span class=\"grammar-hl\">blossomed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완두콩 식물에.</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> the pea plant.</b></span></div></div><div class=\"lec-sent-ko\">작은 꽃이 완두콩 식물에 피어 있었다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">blossomed on (자동사): blossom은 자동사로 쓰여 전치사구(on the pea plant)의 수식을 받는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blossom</td><td class=\"m\">꽃이 피다, 번창하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 아름다운 분홍색 꽃이었다.</span><span class=\"en\"><b>It was a <span class=\"grammar-hl\">beautiful pink flower</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 아름다운 분홍색 꽃이었다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">beautiful pink flower (명사구): 여러 개의 형용사(beautiful, pink)가 하나의 명사(flower)를 앞에서 차례로 수식하는 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“고마워</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Thank you</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼬마 식물아.</span><span class=\"en\"><b>little plant.</b></span></div></div><div class=\"lec-sent-ko\">“고마워, 꼬마 식물아.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thank you (관용표현): 상대방에게 고마움을 표하는 정형화된 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네가 바로 그 친구야</span><span class=\"en\"><b>You are <span class=\"grammar-hl\">the friend</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 기다려 왔던!”</span><span class=\"en\"><b><span class=\"grammar-hl\">I have waited for</span>!”</b></span></div></div><div class=\"lec-sent-ko\">네가 바로 내가 기다려 왔던 친구야!”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the friend I have waited for (관계대명사): 선행사(the friend) 뒤에 목적격 관계대명사(whom/that)가 생략된 구조다. 전치사 for의 목적어가 비어 있는 불완전한 절이 이어진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작은 완두콩은 ~만큼 행복했다</span><span class=\"en\"><b>The little pea was <span class=\"grammar-hl\">as happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀만큼.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the girl.</b></span></div></div><div class=\"lec-sent-ko\">작은 완두콩은 소녀만큼 행복했다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as happy as (관용표현): as + 형용사 + as 구조의 원급 비교로 &#39;~만큼 행복한&#39;이라는 의미다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 마침내 그 일을 찾았다</span><span class=\"en\"><b>It finally found <span class=\"grammar-hl\">the thing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 할 수 있는.</span><span class=\"en\"><b><span class=\"grammar-hl\">which it could do</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 마침내 자신이 할 수 있는 일을 찾았다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the thing which it could do (관계대명사): 선행사(the thing) + 목적격 관계대명사(which) + 주어(it) + 동사(could do) 구조로, do의 목적어가 비어 있는 불완전한 절이 선행사를 수식한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>꼬투리 안의 큰 완두콩은 야망이 컸지만, 작은 완두콩은 자신의 가치에 의문을 가졌다.</li><li>꼬투리가 터진 후, 작은 완두콩은 가난하고 병든 소녀가 사는 집 창가 틈에 정착했다.</li><li>작은 완두콩이 자라나는 모습을 보며 소녀는 삶의 희망을 얻고 건강을 회복했다.</li><li>결국 완두콩은 예쁜 꽃을 피웠고, 아픈 소녀를 치유하는 자신의 진정한 사명을 완수하며 행복을 찾았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A tiny pea discovers its true purpose as it grows near a sick girl&#39;s window while providing the vital hope necessary for her recovery.</div>\n              <div class=\"lec-final-sum-ko\">작은 완두콩이 아픈 소녀의 창가에서 자라나며 그녀의 회복에 필수적인 희망을 제공함과 동시에 자신의 진정한 목적을 발견한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],[{"audio":"./full_audio/19.mp3","hl":"main"},{"audio":"./full_audio/20.mp3","hl":"meaning"},{"audio":"./full_audio/21.mp3","hl":"grammar"}],[{"audio":"./full_audio/22.mp3","hl":"main"},{"audio":"./full_audio/23.mp3","hl":"meaning"},{"audio":"./full_audio/24.mp3","hl":"gra
