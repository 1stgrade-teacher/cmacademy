u2o7LR76rdNrmtbVvfz3IpUo072v53t5a6N7v01+Q/HTtj6dB2+nf/A0emep4yO2ffjHYfXHXrTTLGP41/MHr0/xoDqeAw+g64Hbg9T1HfpxVLX/g/wCW/wB/+Zovz139NvL+uo7nOOw9uufQ59ueKQnHP6ccfU/p/Q00SoSQGXIJHB3Z68jB5A4+v44Vd6nOGHXHb398dcDqDyDgBhg6fp1BtLdpevyX6of1pOc+3r/9b/Pv601XU8blx83BK8AduCfY577hwM4Diwz1HU9x0HA5yO2MfyHZenrfp0/PoLmT+0tH3Xa/6iNxg+mOP049+T+npyvXkY9/pg4/x/8A10m5cKSy89gwJGOOgOfT8wO4pN6twCO2c4PHrzjqccc4GOAWzTBPu1/notV5Xf4r5qCD2I5xjGDnP/6yf192yH5Dj655xnO7rg9cHoD9DjFIzrk/Mh6n0+7nnOfTA4xyeuKgkcBSchjhzwCTwrH6DOB3Ax15BNJvZPZvz01Xbq+mq21ZcUm9b9PJtNxWmnS93dd0ux//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Blossom of Friendship: Finding Joy and Purpose in a Small Plant<small>우정의 꽃: 작은 식물에서 찾는 기쁨과 삶의 목적</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 이야기는 안데르센의 동화 &#39;완두콩 다섯 알&#39;의 일부로, 작은 식물이 인간의 심리적 회복탄력성(Resilience)에 얼마나 큰 영향을 미칠 수 있는지를 잘 보여줍니다. 실제로 식물을 가꾸며 정서적 안정을 찾는 식물 매개 치료(Horticultural Therapy)는 환자의 우울감을 줄이고 삶의 의지를 북돋는 데 탁월한 효과가 있다는 연구 결과가 많아요. 작품 속 소녀는 식물에 감정을 이입하는 의인화(Personification) 과정을 통해 외로움을 극복하고, 마치 친구를 대하듯 깊은 정서적 유대감(Emotional Bond)을 형성하게 됩니다. 척박한 환경에서도 꽃을 피워내는 완두콩의 강인한 생명력(Vitality)은 절망적인 상황에 놓인 사람들에게 긍정적인 변화를 이끌어내는 강력한 심리적 기제(Psychological Mechanism)로 작용하곤 하죠. 따라서 이 지문을 읽을 때는 단순한 식물의 성장을 넘어, 생명 간의 교감(Communion)이 만들어내는 기적 같은 치유의 힘에 주목해 보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01놀라운 발견</div><ul><li>소녀는 완두콩 식물에서 일어난 놀라운 변화를 보고 어머니를 급히 부른다.</li><li>소녀의 외침: &quot;엄마, 이것 좀 보세요!&quot; (shouted)</li><li>세상에서 가장 멋진 일(the most wonderful thing)의 목격</li><li>핵심 키워드: 발견(discovery)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02분홍빛 꽃의 개화</div><ul><li>완두콩 식물에서 작고 아름다운 분홍색 꽃이 마침내 피어난다.</li><li>작은 꽃(little flower)이 꽃을 피움(blossomed)</li><li>꽃의 색상: 아름다운 분홍색(beautiful pink)</li><li>핵심 키워드: 개화(blossom)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03식물을 향한 감사</div><ul><li>소녀는 오랫동안 기다려온 친구라며 식물에게 진심 어린 감사를 전한다.</li><li>식물에게 건네는 감사(Thank you)의 인사</li><li>기다려온 친구(the friend I have waited for)로 정의함</li><li>핵심 키워드: 우정(friendship)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04완두콩의 행복과 보람</div><ul><li>완두콩 역시 소녀만큼 행복해하며 자신이 할 수 있는 일을 찾았음에 기뻐한다.</li><li>소녀만큼 행복한(as happy as the girl) 완두콩</li><li>자신이 할 수 있는 일(the thing which it could do)의 발견</li><li>핵심 키워드: 성취감(sense of achievement)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shout</td><td class=\"m\">소리치다, 외치다</td></tr><tr><td class=\"w\">wonderful</td><td class=\"m\">멋진, 경이로운, 훌륭한</td></tr><tr><td class=\"w\">blossom</td><td class=\"m\">꽃이 피다, 번영하다, 개화하다</td></tr><tr><td class=\"w\">pea</td><td class=\"m\">완두콩</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wait for</td><td class=\"m\">~을 기다리다</td></tr><tr><td class=\"w\">finally</td><td class=\"m\">마침내, 결국</td></tr><tr><td class=\"w\">find</td><td class=\"m\">찾다, 발견하다, 알아내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날 저녁,</span><span class=\"en\"><b>One evening,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀가 외쳤다,</span><span class=\"en\"><b>the girl shouted,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“이거를 꼭 봐야 해요,</span><span class=\"en\"><b>“You <span class=\"grammar-hl\">must see</span> this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마!</span><span class=\"en\"><b>Mom!</b></span></div></div><div class=\"lec-sent-ko\">어느 날 저녁, 소녀가 외쳤다. “엄마, 이거를 꼭 봐야 해요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> shouted, “You must see this, Mom!은 소녀가 무언가를 발견하고 벅찬 감동과 흥분에 휩싸여 있음을 보여줍니다. 이야기의 도입부에서 독자에게 소녀가 아주 특별하고 긍정적인 변화를 목격했음을 알려주며 궁금증을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must see (관용표현): must + 동사원형 구조로, &#39;반드시 ~해야 한다&#39;는 강한 의무를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shout</td><td class=\"m\">소리치다, 외치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It’s</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 멋진 거예요!”</span><span class=\"en\"><b><span class=\"grammar-hl\">the most wonderful</span> thing!”</b></span></div></div><div class=\"lec-sent-ko\">그것은 가장 멋진 거예요!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> A little flower blossomed는 앞 문장에서 소녀가 그토록 소리 높여 외쳤던 &#39;멋진 일&#39;이 무엇인지 구체적으로 설명합니다. 오랫동안 기다려온 생명력이 마침내 결실을 보았음을 나타내는 핵심적인 사건입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the most wonderful (관용표현): &#39;the most + 형용사&#39; 형태로 &#39;가장 ~한&#39;이라는 의미를 가진 최상급 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wonderful</td><td class=\"m\">멋진, 경이로운, 훌륭한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작은 꽃이 피었다</span><span class=\"en\"><b>A little flower <span class=\"grammar-hl\">blossomed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완두콩 식물에.</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> the pea plant.</b></span></div></div><div class=\"lec-sent-ko\">작은 꽃이 완두콩 식물에 피어 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> A little flower blossomed는 앞 문장에서 소녀가 그토록 소리 높여 외쳤던 &#39;멋진 일&#39;이 무엇인지 구체적으로 설명합니다. 오랫동안 기다려온 생명력이 마침내 결실을 보았음을 나타내는 핵심적인 사건입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">blossomed on 자동사 구조: blossom은 &#39;꽃이 피다&#39;라는 의미의 자동사로 쓰였으며, 뒤에 전치사구(on the pea plant)가 장소의 부사구로 연결된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blossom</td><td class=\"m\">꽃이 피다, 번영하다, 개화하다</td></tr><tr><td class=\"w\">pea</td><td class=\"m\">완두콩</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 분홍색 꽃이었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">a beautiful pink flower</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 아름다운 분홍색 꽃이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> a beautiful pink flower는 꽃의 색깔과 외양을 묘사하여 소녀가 느끼는 시각적인 즐거움과 감동을 더 구체화합니다. 앞 문장에서 언급된 꽃의 등장을 구체적인 이미지로 강조하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was a beautiful pink flower 2형식(SVC) 구조: 주어(It), 동사(was), 주격보어(a beautiful pink flower)로 이루어져 주어의 상태나 정체를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“고마워,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Thank you</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼬마 식물아.</span><span class=\"en\"><b>little plant.</b></span></div></div><div class=\"lec-sent-ko\">“고마워, 꼬마 식물아.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thank you (관용표현): 상대방에게 감사를 표할 때 사용하는 고정된 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는</span><span class=\"en\"><b>You are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 친구야</span><span class=\"en\"><b><span class=\"grammar-hl\">the friend</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 기다려 왔던!”</span><span class=\"en\"><b><span class=\"grammar-hl\">I have waited for</span>!”</b></span></div></div><div class=\"lec-sent-ko\">네가 바로 내가 기다려 왔던 친구야!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 소녀가 이 식물을 단순한 관찰 대상이 아니라 자신의 외로움을 달래주고 정서적으로 교감하는 소중한 동반자로 여기고 있음을 보여줍니다. 꽃의 개화가 소녀에게 정서적으로 얼마나 큰 의미인지를 직접적인 대사로 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the friend I have waited for (관계대명사): 선행사 the friend 뒤에 목적격 관계대명사(whom/that)가 생략되어 있다. 뒤의 관계대명사절(I have waited for)에서 전치사 for의 목적어가 빠져 있는 불완전한 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">작은 완두콩은</span><span class=\"en\"><b>The little pea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그만큼 행복했다</span><span class=\"en\"><b>was <span class=\"grammar-hl\">as happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀만큼.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the girl.</b></span></div></div><div class=\"lec-sent-ko\">작은 완두콩은 소녀만큼 행복했다. ▶ as happy as the girl은 식물을 의인화하여 소녀의 기쁨이 완두콩에게도 그대로
