(Phototropism)이라고 하는데, 이는 식물이 에너지를 얻기 위해 본능적으로 빛을 향하는 생존 전략입니다. 실제 환경 심리학(Environmental Psychology) 분야의 연구에 따르면, 아픈 사람이 살아있는 식물을 관찰하는 것만으로도 정서적 안정감을 얻고 실제 치유 과정에 긍정적인 도움을 받는다고 해요. 좁은 틈새에서도 싹을 틔우는 강인한 생명력은 환자에게 &quot;나도 회복할 수 있다&quot;는 심리적 동기부여를 제공하는 희망의 상징이 되기도 합니다. 이처럼 식물의 성장과 인간의 마음가짐(Mindset) 사이의 깊은 유대감을 이해한다면, 소녀가 느낀 경이로움을 더욱 생생하게 공감할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01배경 설정</div><ul><li>아픈 소녀와 일로 바쁜 어머니가 함께 사는 고단한 상황을 제시한다.</li><li>아침부터 밤늦게까지 일하는 어머니(Mom)</li><li>하루 종일 침대에 누워 지내는 매우 아픈 소녀(very sick)</li><li>핵심 키워드: 일상(daily life)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02새로운 발견</div><ul><li>어느 날 소녀가 창문 곁에서 무언가 새로운 것을 발견한다.</li><li>창문 옆에 있는 초록색 물체(green thing)를 발견함</li><li>궁금해하며 어머니에게 질문을 던지는 소녀</li><li>핵심 장소: 창가(by the window)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03정체 확인</div><ul><li>어머니는 그 물체가 아주 작은 식물임을 확인한다.</li><li>정체는 작은 완두콩 싹(pea plant)임이 밝혀짐</li><li>아기의 손가락(baby’s finger)만큼 아주 작음</li><li>핵심 특징: 작음(little)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04경이로움</div><ul><li>갑자기 나타난 생명체에 대해 호기심과 경이로움을 느낀다.</li><li>식물이 어디서 왔는지 궁금해하는 어머니의 질문</li><li>작은 식물을 경이롭게(in wonder) 바라보는 소녀</li><li>핵심 감정: 경이로움(wonder)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay in bed</td><td class=\"m\">자리에 누워 있다, 요양하다</td></tr><tr><td class=\"w\">pea plant</td><td class=\"m\">완두콩 식물, 완두</td></tr><tr><td class=\"w\">as little as</td><td class=\"m\">~만큼 작은, 겨우 ~에 불과한</td></tr><tr><td class=\"w\">come from</td><td class=\"m\">~에서 나오다, ~에서 비롯되다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 바라보다, ~을 살피다</td></tr><tr><td class=\"w\">in wonder</td><td class=\"m\">경이로움 속에, 감탄하며</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 어린 소녀가 살았다</span><span class=\"en\"><b>A young girl <span class=\"grammar-hl\">lived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 엄마와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> her mom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 집에서.</span><span class=\"en\"><b>in the house.</b></span></div></div><div class=\"lec-sent-ko\">그 집에는 한 어린 소녀가 어머니와 함께 살고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 주인공과 배경을 소개하며 시작합니다. 엄마와 딸이 함께 지내는 평범한 가정의 모습을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lived with (관용표현): &#39;...와 함께 살다&#39;라는 의미의 동사구 구조로, 주어 A young girl의 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 엄마는 일해야 했다</span><span class=\"en\"><b>Her mom <span class=\"grammar-hl\">had to</span> work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이른 아침부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from early morning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">늦은 저녁까지.</span><span class=\"en\"><b><span class=\"grammar-hl\">to late evening</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀의 어머니는 이른 아침부터 늦은 저녁까지 일해야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 설정에 이어 가족의 경제적 상황과 일상을 설명합니다. from early morning to late evening은 엄마가 생계를 위해 집을 비우는 시간이 매우 길며, 그만큼 소녀가 혼자 보내는 시간이 많음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had to (관용표현): &#39;...해야 했다&#39;라는 의무를 나타내며, 조동사 must의 과거 대용어로 뒤에 동사원형 work가 이어진다.</div><div class=\"lec-gr-item\">from early morning to late evening (관용표현): &#39;from A to B&#39; 구조로 &#39;A부터 B까지&#39;라는 시간적 범위를 나타내는 부사구다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 소녀는 매우 아팠다</span><span class=\"en\"><b>The girl was very sick</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 침대에 누워 있었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">stayed in bed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 종일.</span><span class=\"en\"><b>all day.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 매우 아파서 하루 종일 침대에 누워 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 홀로 남겨진 소녀의 건강 상태를 덧붙여 안타까운 상황을 강조합니다. stayed in bed all day는 소녀의 활동 반경이 침대 위로 극도로 제한되어 있어 외부 세계와의 접촉이 거의 없음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed in bed (관용표현): &#39;누워 있다/휴식을 취하다&#39;라는 의미로, 아픈 상태를 유지함을 나타내는 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 소녀는 물었다</span><span class=\"en\"><b>the girl asked,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“엄마,</span><span class=\"en\"><b>“Mom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창문 옆에 있는 저 초록색 물건이 뭐예요?”</span><span class=\"en\"><b><span class=\"grammar-hl\">what is the green thing</span> by the window?”</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 소녀가 “엄마, 창문 옆에 있는 저 초록색 물건이 뭐예요?”라고 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정적인 일상에 새로운 사건이 발생했음을 알리는 전환점입니다. the green thing은 단조로운 방 안 풍경 속에서 소녀의 시선을 사로잡은 새로운 생명력을 상징합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is the green thing (직접의문문): &#39;의문사(what) + be동사(is) + 주어(the green thing)&#39; 어순으로 이루어진 의문문 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“오,</span><span class=\"en\"><b>“Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이건 완두콩 식물이네!</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s a pea plant</span>!</b></span></div></div><div class=\"lec-sent-ko\">“오, 이건 완두콩 식물이네!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 딸의 질문에 대한 엄마의 확인과 반응입니다. as little as a baby’s finger는 이제 막 자라나기 시작한 식물의 연약하고 귀여운 모습을 묘사하며, 아픈 소녀처럼 보호가 필요한 존재임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s a pea plant 2형식(SVOC) 구조: 주어(it) + 동사(is) + 주격보어(a pea plant)로 이루어진 &#39;S=C&#39; 관계의 문장 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pea plant</td><td class=\"m\">완두콩 식물, 완두</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 그만큼 작구나</span><span class=\"en\"><b>It is <span class=\"grammar-hl\">as little</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아기의 손가락만큼.</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> a baby’s finger.</b></span></div></div><div class=\"lec-sent-ko\">그건 아기의 손가락만큼이나 작구나.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 출처를 모르는 엄마의 궁금증을 나타냅니다. 의도적으로 심은 것이 아님에도 창가에 나타났다는 점을 통해, 이 식물의 등장이 예기치 못한 선물이나 희망 같은 존재임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as little as (관용표현): &#39;as + 형용사/부사 + as&#39; 구조의 원급 비교로, &#39;...만큼 ~한&#39;이라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as little as</td><td class=\"m\">~만큼 작은, 겨우 ~에 불과한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이게 어디에서 온 것일까?”</span><span class=\"en\"><b>Where did it <span class=\"grammar-hl\">come from</span>?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마가 물으셨다.</span><span class=\"en\"><b><span class=\"grammar-hl\">asked Mom</span>.</b></span></div></div><div class=\"lec-sent-ko\">이게 어디에서 온 것일까?” 엄마가 물으셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물을 발견한 소녀의 최종적인 반응입니다. in wonder는 아픔 때문에 무기력했던 소녀가 작은 생명을 통해 삶의 활기와 신비로움을 느끼기 시작했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked Mom (도치): 인용문이 문장 앞에 나올 때 주어(Mom)와 동사(asked)의 위치가 바뀐 구조다.</div><div class=\"lec-gr-item\">come from (관용표현): &#39;...에서 오다/유래하다&#39;라는 의미의 동사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come from</td><td class=\"m\">~에서 나오다, ~에서 비롯되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 소녀는 그 작은 식물을 바라보았다</span><span class=\"en\"><b>The girl <span class=\"grammar-hl\">looked at</span> the little plant</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경이롭게.</span><span class=\"en\"><b><span class=\"grammar-hl\">in wonder</span>.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 경이롭게 그 작은 식물을 바라보았다. ▶ The girl looked at the little plant in wonder. 식물을 발견한 소녀의 최종적인 반응입니다. in wonder는 아픔 때문에 무기력했던 소녀가 작은 생명을 통해 삶의 활기와 신비로움을 느끼기 시작했음을 의미합니다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked at (관용표현): &#39;...을 보다&#39;라는 의미로, 자동사 look이 전치사 at과 결합하여 목적어를 취하는 구조다.</div><div class=\"lec-gr-item\">in wonder (관용표현): &#39;경이로움 속에서/놀라움에 찬&#39;이라는 의미로 상태를 나타내는 부사구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in wonder</td><td class=\"m\">경이로움 속에, 감탄하며</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아픈 소녀가 일하러 나간 엄마를 기다리며 홀로 집을 지키고 있다.</li><li>어느 날 소녀는 창가에서 처음 보는 초록색 식물을 발견한다.</li><li>엄마는 그것이 아주 작은 완두콩 식물임을 알려주며 신기해한다.</li><li>소녀는 생각지도 못한 작은 생명의 등장에 희망과 경이로움을 느낀다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A sick girl finds a tiny pea plant by her window although she is confined to her bed all day.</div>\n              <div class=\"lec-final-sum-ko\">소녀는 하루 종일 침대에 누워 지내지만 창가에서 자라나는 작은 완두콩 식물을 발견한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl
