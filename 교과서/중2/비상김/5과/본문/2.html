15jXzv+Wq3f8AXQ//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Smallest Pea’s New Home by the Window<small>창가 옆에 마련된 작은 완두콩의 새 보금자리</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">식물이 종족을 보존하기 위해 씨앗을 멀리 퍼뜨리는 과정을 종자 산포(Seed dispersal)라고 하는데, 이 지문처럼 바람의 힘을 빌려 이동하는 방식을 풍성 산포(Anemochory)라고 부릅니다. 마치 작은 낙하산을 타고 여행하는 것처럼, 아주 가벼운 씨앗들은 바람에 실려 창틀 사이 같은 좁은 틈새까지도 이동하여 새로운 터전을 잡기도 하죠. 이렇게 멈춘 씨앗이 싹을 틔우는 발아(Germination) 과정을 거치려면 아주 적은 양이라도 수분을 머금은 흙과 적절한 온도가 갖춰져야 하는 환경적 요인(Environmental factors)이 필수적입니다. 이 지문은 안데르센의 동화인 &#39;다섯 알의 완두콩&#39;의 일부로, 척박한 환경 속에서도 생명력을 유지하며 성장하는 식물의 회복탄력성(Resilience)이라는 생물학적 원리를 문학적으로 잘 보여주고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01탄생의 순간</div><ul><li>완두콩 꼬투리가 열리며 작은 콩의 여정이 시작된다.</li><li>콩꼬투리(pod)가 터져서 열림</li><li>가장 작은 완두콩(smallest pea)이 밖으로 나옴</li><li>핵심 키워드: 열리다(broke open)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02바람을 탄 이동</div><ul><li>바람이 불어와 아주 작은 완두콩을 공중으로 날려 보낸다.</li><li>바람(wind)이 콩을 공중(air)으로 불어 올림</li><li>완두콩이 공중을 날아감(flew)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 장소 안착</div><ul><li>완두콩이 어느 집 창가의 아주 작은 틈새에 내려앉는다.</li><li>창문(window) 근처의 아주 좁은 공간에 착륙(landed)</li><li>우연히 생존을 위한 자리를 찾음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04흙 속으로의 정착</div><ul><li>내려앉은 자리에 흙이 쌓이며 완두콩이 그 안에 자리를 잡는다.</li><li>흙(soil)이 그 위에 쌓임</li><li>완두콩이 흙 속으로 가라앉음(sank)</li><li>핵심 키워드: 정착하다(settle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">one day</td><td class=\"m\">어느 날, 언젠가</td></tr><tr><td class=\"w\">pod</td><td class=\"m\">(콩의) 꼬투리, 피막</td></tr><tr><td class=\"w\">break open</td><td class=\"m\">터지다, 억지로 열다</td></tr><tr><td class=\"w\">blow up</td><td class=\"m\">~을 위로 날려 보내다, 부풀리다</td></tr><tr><td class=\"w\">land on</td><td class=\"m\">~에 내려앉다, 착륙하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 미세한</td></tr><tr><td class=\"w\">soil</td><td class=\"m\">흙, 토양</td></tr><tr><td class=\"w\">build up</td><td class=\"m\">쌓이다, 강화하다</td></tr><tr><td class=\"w\">sink</td><td class=\"m\">가라앉다, 빠지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 꼬투리가 터져 열렸다.</span><span class=\"en\"><b>the pod <span class=\"grammar-hl\">broke open</span>.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 그 꼬투리가 터져 열렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the pod broke open은 콩들을 감싸고 있던 껍질이 열리면서 그 안에 있던 콩들이 세상 밖으로 나갈 준비가 되었음을 나타냅니다. 이야기의 발단이 되는 부분으로, 닫혀 있던 공간에서 외부 세계로의 전환을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke open (관용표현): &#39;터져서 열리다&#39;라는 의미의 어구로, 동사 broke와 형용사 open이 결합하여 주어(the pod)의 상태 변화를 나타내는 구조로 사용되었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">one day</td><td class=\"m\">어느 날, 언젠가</td></tr><tr><td class=\"w\">pod</td><td class=\"m\">(콩의) 꼬투리, 피막</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바람이</span><span class=\"en\"><b>The wind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 작은 완두콩을 날려 보냈다</span><span class=\"en\"><b><span class=\"grammar-hl\">blew the smallest pea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공중으로</span><span class=\"en\"><b><span class=\"grammar-hl\">up</span> into the air.</b></span></div></div><div class=\"lec-sent-ko\">바람이 가장 작은 완두콩을 공중으로 날려 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> The wind blew는 완두콩이 자신의 힘이 아닌 외부의 힘에 이끌려 이동하기 시작했음을 의미합니다. 앞 문장에서 꼬투리가 열린 사건에 이어, 여러 콩 중에서 주인공이 되는 &#39;가장 작은 완두콩&#39;이 본격적인 여행을 시작하는 논리적 연결을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">blew the smallest pea up (관용표현): blow ... up은 &#39;...을 위로 날려 보내다&#39;라는 의미의 구동사로, 타동사(blew)와 부사(up) 사이에 목적어(the smallest pea)가 위치한 타동사구 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 날아서 내려앉았다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">flew and landed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 공간에</span><span class=\"en\"><b>on a tiny space</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 집 창문 옆의</span><span class=\"en\"><b>by the window of a house.</b></span></div></div><div class=\"lec-sent-ko\">그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> landed on a tiny space는 바람을 타고 날아가던 완두콩이 우연히 새로운 정착지를 찾게 되었음을 의미합니다. 앞 문장의 이동이 멈추고, 앞으로 새로운 이야기가 펼쳐질 구체적인 장소인 &#39;어느 집 창가&#39;로 배경이 좁혀지는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flew and landed 동사구 구조: 등위접속사 and를 사용하여 과거 시제의 두 자동사 flew와 landed를 병렬로 연결함으로써 주어 It의 연속적인 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 미세한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 4</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흙이 쌓였다</span><span class=\"en\"><b>Soil <span class=\"grammar-hl\">built up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 작은 완두콩은</span><span class=\"en\"><b>and the tiny pea</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 속으로 가라앉았다.</span><span class=\"en\"><b><span class=\"grammar-hl\">sank into it</span>.</b></span></div></div><div class=\"lec-sent-ko\">흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> sank into it은 완두콩이 단순히 표면에 얹혀 있는 상태를 지나 싹을 틔울 수 있도록 흙 속에 자리를 잡았다는 의미입니다. 앞 문장에서 도착한 장소에서 생명이 자라나기 위한 최소한의 토대가 마련되었음을 보여주는 마무리 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">built up (관용표현): build up은 &#39;쌓이다&#39; 혹은 &#39;축적되다&#39;라는 의미의 구동사로, 여기서는 흙(Soil)이 서서히 모여 층을 이루는 상태를 나타내는 자동사적 표현으로 쓰였다.</div><div class=\"lec-gr-item\">sank into it (관용표현): sink into는 &#39;...속으로 가라앉다/빠지다&#39;라는 의미로, 동사 sank와 전치사 into가 결합하여 주어(the tiny pea)가 목적어 it(soil) 내부로 들어가는 동작의 결과와 방향을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 미세한</td></tr><tr><td class=\"w\">soil</td><td class=\"m\">흙, 토양</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>완두콩 꼬투리가 열리며 이야기가 시작된다.</li><li>바람이 불어와 가장 작은 완두콩을 공중으로 날려 보낸다.</li><li>완두콩은 우연히 어느 집 창가 틈새에 자리를 잡게 된다.</li><li>그곳에 흙이 쌓이고 완두콩이 파묻히며 성장을 위한 준비를 마친다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The tiny pea is carried by the wind and settles into a small space to beg
