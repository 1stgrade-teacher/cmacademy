piness hormone)인 세로토닌 분비를 촉진해 실제 신체적 회복까지 이끌어내기도 하죠. 이처럼 자연과의 상호작용이 인간의 전반적인 안녕에 미치는 긍정적 영향(Positive impact)은 현대 심리학과 의학계에서도 환자의 치유 속도를 높이는 중요한 요소로 주목받고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지속적인 관찰과 관심</div><ul><li>소녀는 창가에서 매일 식물을 세심하게 관찰하며 시간을 보낸다.</li><li>매일(Every day) 창가로 향하는 규칙적인 행동</li><li>식물을 지켜보는 꾸준한 정성</li><li>핵심 키워드: 창가(window), 식물(plant)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02식물의 비약적인 성장</div><ul><li>시간이 지나면서 식물은 아주 높고 튼튼하게 자라난다.</li><li>점점 더 높이 자라남(grew taller and taller)</li><li>몇 주 후 작은 나무(small tree)만큼 커짐</li><li>핵심 키워드: 성장(grew), 몇 주 후(after a few weeks)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03상호 작용과 긍정적 변화</div><ul><li>식물의 성장을 지켜보며 소녀의 심신에 긍정적인 변화가 나타난다.</li><li>식물의 건강함(healthy)이 소녀에게 정서적 위안을 줌</li><li>햇빛(sun) 아래에서 함께 느끼는 건강함</li><li>핵심 키워드: 예쁘고 건강한(pretty and healthy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04동반 성장과 행복</div><ul><li>식물이 자라남에 따라 소녀도 나날이 몸과 마음이 튼튼해진다.</li><li>나날이 더 강해짐(stronger day by day)</li><li>정서적인 행복감 증진(happier)</li><li>핵심 키워드: 더 강하고 행복한(stronger and happier)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다, 커지다</td></tr><tr><td class=\"w\">healthy</td><td class=\"m\">건강한, 몸에 좋은, 강건한</td></tr><tr><td class=\"w\">strong</td><td class=\"m\">강한, 튼튼한, 힘센</td></tr><tr><td class=\"w\">happy</td><td class=\"m\">행복한, 기쁜, 즐거운</td></tr><tr><td class=\"w\">day by day</td><td class=\"m\">나날이, 매일매일, 점차적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>Every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소녀는 갔다</span><span class=\"en\"><b>the girl went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창문으로</span><span class=\"en\"><b>to the window</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 식물을 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> the plant.</b></span></div></div><div class=\"lec-sent-ko\">매일 소녀는 그 식물을 보기 위해 창문으로 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 주인공인 소녀가 식물에게 지속적인 관심과 애정을 쏟고 있음을 보여줍니다. went to the window는 소녀가 몸이 불편하거나 외출이 자유롭지 못한 상황일 수도 있음을 암시하며, 창밖의 식물이 소녀에게 유일하고 중요한 관찰 대상임을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적). &#39;...하기 위해서&#39;라는 의미로 쓰여 앞선 동사 went의 목적을 나타내는 수식어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 점점 더 키가 자랐다.</span><span class=\"en\"><b>It grew <span class=\"grammar-hl\">taller and taller</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 점점 더 키가 자랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 보여준 소녀의 관심에 부응하듯 식물이 생명력을 발휘하며 성장하는 모습입니다. taller and taller는 시간이 흐름에 따라 식물의 상태가 눈에 띄게 좋아지고 있음을 강조하며, 앞으로 일어날 변화의 기초를 닦는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taller and taller (관용표현): &#39;비교급 + and + 비교급&#39; 구조로, 어떤 상태나 성질이 &#39;점점 더 ~한&#39;이라는 의미로 점진적인 변화를 강조할 때 사용한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 작은 나무만큼 키가 커졌다</span><span class=\"en\"><b>It became <span class=\"grammar-hl\">as tall as</span> a small tree</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 주가 지나자</span><span class=\"en\"><b>after a few weeks.</b></span></div></div><div class=\"lec-sent-ko\">몇 주가 지나자 그것은 작은 나무만큼 키가 커졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 성장 속도와 크기를 구체적으로 묘사하여 독자가 변화의 정도를 실감하게 합니다. as tall as a small tree는 식물이 단순한 풀의 단계를 넘어 소녀가 우러러볼 만큼 웅장하고 튼튼하게 변했음을 의미하며, 이 성장이 예사롭지 않음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as tall as (관용표현): 원급 비교 구조. &#39;as + 형용사/부사 원형 + as&#39; 형태를 통해 비교 대상인 a small tree와 정도가 대등함을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 정말 예쁘고 건강하구나!</span><span class=\"en\"><b>“<span class=\"grammar-hl\">How pretty and healthy you are</span>!</b></span></div></div><div class=\"lec-sent-ko\">“너는 정말 예쁘고 건강하구나!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 성장을 지켜보던 소녀의 직접적인 감탄사가 나옵니다. feel healthier, too는 식물의 생명 에너지가 소녀에게 전이되고 있음을 보여줍니다. 또한, 식물을 보기 위해 햇볕 아래 앉아 있는 행위 자체가 소녀의 건강에 긍정적인 영향을 미치는 물리적, 심리적 계기가 되었음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How pretty and healthy you are (강조구문): &#39;How + 형용사 + 주어 + 동사&#39; 형태의 감탄문 구조다. 주어(you)의 상태를 나타내는 보어 pretty와 healthy를 문장 앞으로 보내어 강조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthy</td><td class=\"m\">건강한, 몸에 좋은, 강건한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 앉아 있을 때</span><span class=\"en\"><b>When I sit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">햇볕에</span><span class=\"en\"><b>in the sun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너를 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span> you,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나도 더 건강해지는 것 같아!”</span><span class=\"en\"><b>I feel healthier, too!”</b></span></div></div><div class=\"lec-sent-ko\">너를 보기 위해 햇볕에 앉아 있을 때, 나도 더 건강해지는 것 같아!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로, 식물의 성장이 소녀의 회복과 완벽하게 평행을 이루고 있음을 보여줍니다. stronger and happier는 식물이 건강해진 것처럼 소녀 또한 신체적 강인함과 정신적 즐거움을 동시에 얻었음을 의미하며, 자연과의 교감이 주는 치유의 힘을 강조하며 마무리됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 부사적 용법(목적). &#39;...하기 위해서&#39;라는 의미로 절 안의 동사 sit의 목적을 설명하는 수식어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소녀는 더 강해지고 행복해졌다</span><span class=\"en\"><b>The girl <span class=\"grammar-hl\">became stronger and happier</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날이 갈수록</span><span class=\"en\"><b>day by day.</b></span></div></div><div class=\"lec-sent-ko\">소녀는 날이 갈수록 더 강해지고 행복해졌다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became stronger and happier 2형식(SVC) 구조: become은 주어의 상태 변화를 나타내는 불완전 자동사이며, 뒤에 주어를 보충 설명하는 주격보어(C)로 형용사의 비교급인 stronger와 happier가 병렬로 연결된 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">strong</td><td class=\"m\">강한, 튼튼한, 힘센</td></tr><tr><td class=\"w\">day by day</td><td class=\"m\">나날이, 매일매일, 점차적으로</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한 소녀가 매일 창가에서 식물이 자라는 과정을 지켜본다.</li><li>식물은 몇 주 만에 작은 나무만큼 자랄 정도로 강한 생명력을 보여준다.</li><li>소녀는 건강하게 자란 식물을 보며 기쁨을 느끼고, 함께 햇볕을 쬐며 자신도 건강해짐을 느낀다.</li><li>결국 식물의 성장과 함께 소녀도 신체적, 정신적으로 모두 회복된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The girl experiences physical and emotional recovery because of her daily observation of the plant&#39;s healthy development.</div>\n              <div class=\"lec-final-sum-ko\">소녀는 매일 식물의 건강한 발달을 관찰하기 때문에 신체적 그리고 정서적 회복을 경험한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"},{"audio":"./4_audio/7.mp3","hl":"stage-3"}],[{"audio":"./4_audio/8.mp3","hl":null}],[{"audio":"./4_audio/9.mp3","hl":"main"},{"audio":"./4_audio/10.mp3","hl":"meaning"},{"audio":"./4_audio/11.mp3","hl":"grammar"}],[{"audio":"./4_audio/12.mp3","hl":"main"},{"audio":"./4_audio/13.mp3","hl":"meaning"},{"audio":"./4_audio/14.mp3","hl":"grammar"}],[{"audio":"./4_audio/15.mp3","hl":"main"},{"audio":"./4_audio/16.mp3","hl":"meaning"},{"audio":"./4_audio/17.mp3","hl":"grammar"}],[{"audio":"./4_audio/18.mp3","hl":"main"},{"audio":"./4_audio/19.mp3","hl":"meaning"},{"audio":"./4_audio/20.mp3","hl":"grammar"}],[{"audio":"./4_audio/21.mp3","hl":"main"},{"audio":"./4_audio/22.mp3","hl":"meaning"},{"audio":"./4_audio/23.mp3","hl":"grammar"}],[{"audio":"./4_audio/24.mp3","hl":"main"},{"audio":"./4_audio/25.mp3","hl":"grammar"}],[{"audio":"./4_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.g
