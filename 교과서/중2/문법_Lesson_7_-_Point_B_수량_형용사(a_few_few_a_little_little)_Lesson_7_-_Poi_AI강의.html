lecturePlayer(document.getElementById("app"),{"brand":"일등급샘","title":"a few? few? a little? little? - 수량 형용사 한 번에 정리하기","audioDir":"문법_Lesson_7_-_Point_B_수량_형용사(a_few_few_a_little_little)_Lesson_7_-_Poi_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Lesson 7 - Point B: 수량 형용사 (a few / few / a little / little)\u003c/div>\u003ch1>a few? few? a little? little? - 수량 형용사 한 번에 정리하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>셀 수 있는 명사와 셀 수 없는 명사에 알맞은 수량 형용사를 골라 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 Lesson Seven, Point B에서 수량 형용사를 배워 볼 거예요. 수량 형용사는 명사의 수나 양을 나타내는 말인데, 명사가 셀 수 있는지 없는지에 따라 골라 쓰는 말이 달라집니다. 오늘은 a few, few, a little, little 이 네 친구를 확실하게 구분해 볼 거예요. 예문을 함께 읽고 문제도 풀어 보면서 어렵지 않게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">셀 수 있는 명사 앞: a few / few\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">셀 수 있는 명사의 \u003cb class=\"key\">복수형\u003c/b> 앞에는 \u003cb class=\"key\">a few\u003c/b>나 \u003cb class=\"key\">few\u003c/b>를 씁니다. a few는 '약간의, 조금 있는'이라는 뜻이고, few는 '거의 없는'이라는 뜻입니다. 즉 명사가 몇 개 있는지 셀 수 있을 때 쓰는 수량 형용사입니다.\u003cdiv>\u003cspan class=\"g-formula\">a few / few + 셀 수 있는 명사의 복수형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A few students\u003c/span> passed the exam.\u003c/div>\u003cdiv class=\"g-ko\">몇몇 학생들이 시험에 합격했다.\u003c/div>\u003cdiv class=\"g-note\">a few는 '몇몇의, 조금 있는'이라는 긍정의 느낌을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Few students\u003c/span> passed the exam.\u003c/div>\u003cdiv class=\"g-ko\">시험에 합격한 학생들이 거의 없었다.\u003c/div>\u003cdiv class=\"g-note\">a가 빠지면 '거의 없는'이라는 부정의 뜻이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">a few\u003c/b>는 '조금 있다'는 긍정, \u003cb class=\"key\">few\u003c/b>는 '거의 없다'는 부정의 느낌이라는 차이를 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 셀 수 있는 명사부터 볼게요. 셀 수 있는 명사의 복수형 앞에는 a few 아니면 few를 씁니다. a few는 약간의, 조금 있는이라는 뜻이고요, few는 거의 없는이라는 뜻이에요. 그래서 같은 students라도 a few students면 몇몇 학생들이 있다는 뜻이고, few students면 학생이 거의 없다는 뜻이 됩니다. 이 차이를 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. A few students passed the exam. 몇몇 학생들이 시험에 합격했다는 뜻이에요. 여기서 a few students는 학생이 조금 있다는 긍정의 느낌을 줍니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. Few students passed the exam. 시험에 합격한 학생들이 거의 없었다는 뜻이에요. 방금 예문에서 a 하나만 빠졌을 뿐인데 뜻이 정반대가 되었죠? few는 거의 없다는 부정의 느낌입니다.","hl":"ex-1"},{"n":5,"text":"여기서 중요한 포인트! a few는 조금 있다는 긍정의 느낌이고, few는 거의 없다는 부정의 느낌이에요. 뜻이 정반대이니까 a가 붙었는지 안 붙었는지 꼭 확인하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">셀 수 없는 명사 앞: a little / little\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">셀 수 없는 명사 앞에는 \u003cb class=\"key\">a little\u003c/b>이나 \u003cb class=\"key\">little\u003c/b>을 씁니다. a little은 '약간의, 조금 있는'이라는 뜻이고, little은 '거의 없는'이라는 뜻입니다. 물이나 돈처럼 하나둘 세어 셀 수 없는 명사에 쓰는 표현입니다.\u003cdiv>\u003cspan class=\"g-formula\">a little / little + 셀 수 없는 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There is \u003cspan class=\"fx\">a little water\u003c/span> in the bottle.\u003c/div>\u003cdiv class=\"g-ko\">병에 약간의 물이 있다.\u003c/div>\u003cdiv class=\"g-note\">water는 셀 수 없는 명사라서 a little을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">There is \u003cspan class=\"fx\">little water\u003c/span> in the bottle.\u003c/div>\u003cdiv class=\"g-ko\">병에 거의 물이 없다.\u003c/div>\u003cdiv class=\"g-note\">a가 빠지면 '거의 없는'이라는 부정의 뜻이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>water, money, time, information처럼 \u003cb class=\"key\">셀 수 없는 명사\u003c/b>에는 few가 아니라 \u003cb class=\"key\">little\u003c/b>을 씁니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 셀 수 없는 명사입니다. 셀 수 없는 명사 앞에는 a little 아니면 little을 써요. a little은 약간의, 조금 있다는 뜻이고, little은 거의 없다는 뜻입니다. 물이나 돈, 시간처럼 하나둘 세어 셀 수 없는 명사에는 few가 아니라 little을 쓴다는 점, 꼭 기억해 두세요.","hl":"rule"},{"n":7,"text":"첫 번째 예문입니다. There is a little water in the bottle. 병에 약간의 물이 있다는 뜻이에요. water는 셀 수 없는 명사라서 a little water라고 말합니다.","hl":"ex-0"},{"n":8,"text":"두 번째 예문입니다. There is little water in the bottle. 병에 거의 물이 없다는 뜻이에요. 아까 예문에서 a만 빠졌는데 물이 조금 있다가 거의 없다로 뜻이 완전히 바뀌었죠? 이게 바로 a의 힘이에요.","hl":"ex-1"},{"n":9,"text":"주의하세요! water, money, time, information처럼 셀 수 없는 명사에는 few가 아니라 little을 써야 합니다. 명사를 먼저 보고 셀 수 있는지 확인하는 습관을 들여 봐요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">a가 붙으면 긍정, a가 없으면 부정\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">a few\u003c/b>와 \u003cb class=\"key\">a little\u003c/b>은 '조금 있다'는 긍정의 뜻이고, a가 빠진 \u003cb class=\"key\">few\u003c/b>와 \u003cb class=\"key\">little\u003c/b>은 '거의 없다'는 부정의 뜻입니다. 양이 비슷해 보여도 말하는 사람의 느낌은 정반대가 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">a + few/little = 조금 있음 / few/little = 거의 없음\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">There are \u003cspan class=\"fx\">a few cookies\u003c/span> left.\u003c/div>\u003cdiv class=\"g-ko\">쿠키가 몇 개 남아 있다.\u003c/div>\u003cdiv class=\"g-note\">a few는 '조금 남아 있다'는 긍정의 느낌을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">There is \u003cspan class=\"fx\">little milk\u003c/span> in the fridge.\u003c/div>\u003cdiv class=\"g-ko\">냉장고에 우유가 거의 없다.\u003c/div>\u003cdiv class=\"g-note\">little은 '거의 없다'는 부정의 느낌을 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>같은 명사라도 \u003cb class=\"key\">a few\u003c/b>면 '조금 있다', \u003cb class=\"key\">few\u003c/b>면 '거의 없다'로 뜻이 반대가 되니 a의 유무를 꼭 확인하세요.\u003c/div>","segs":[{"n":10,"text":"이제 이 네 표현의 가장 중요한 차이를 정리해 볼게요. a few와 a little은 조금 있다는 긍정의 뜻이고요, a가 빠진 few와 little은 거의 없다는 부정의 뜻입니다. 양은 비슷해 보여도 말하는 사람의 느낌은 정반대가 되는 거예요. 그래서 문장을 읽을 때 a가 있는지 없는지를 먼저 확인하는 습관이 중요합니다.","hl":"rule"},{"n":11,"text":"There are a few cookies left. 쿠키가 몇 개 남아 있다는 뜻이에요. a few cookies라고 하면 남은 쿠키가 조금 있다는 긍정의 느낌이죠.","hl":"ex-0"},{"n":12,"text":"There is little milk in the fridge. 냉장고에 우유가 거의 없다는 뜻이에요. little milk라고 하면 우유가 거의 없다는 부정의 느낌이 됩니다.","hl":"ex-1"},{"n":13,"text":"정리하면, 같은 명사라도 a few면 조금 있다, few면 거의 없다로 뜻이 반대가 됩니다. 문제를 풀 때 a가 있는지 없는지를 꼭 확인하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>We have few money.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ We have little money.\u003c/div>\u003cdiv class=\"g-why\">money는 셀 수 없는 명사라서 few가 아니라 little을 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Can I ask a little questions?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Can I ask a few questions?\u003c/div>\u003cdiv class=\"g-why\">questions는 셀 수 있는 복수 명사라서 a few를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I have a few time.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I have a little time.\u003c/div>\u003cdiv class=\"g-why\">time은 셀 수 없는 명사라서 a little을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"첫 번째로 자주 나오는 실수예요. We have few money라고 쓰면 틀립니다. money는 셀 수 없는 명사라서 few가 아니라 little을 써서 We have little money라고 해야 해요.","hl":"mk-0"},{"n":15,"text":"두 번째 실수입니다. Can I ask a little questions라고 하면 어색하죠. questions는 셀 수 있는 복수 명사라서 a few questions라고 해야 합니다.","hl":"mk-1"},{"n":16,"text":"세 번째 실수예요. I have a few time이라고 쓰면 틀립니다. 여기서 time은 셀 수 없는 명사라서 a little time이라고 해야 자연스러워요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 말을 골라 봅시다. 빈칸에 들어갈 수 있는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">We have few ____ .\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>apples\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>money\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>waters\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>time\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">apples\u003c/span>\u003cdiv class=\"g-exp\">few는 셀 수 있는 명사의 복수형 앞에 씁니다. money, water, time은 셀 수 없는 명사라서 few와 함께 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제입니다. We have few, 빈칸. 빈칸에 들어갈 말을 골라 보세요. apples, money, waters, time 중에서 직접 골라 볼까요? 잠시 멈추고 생각해 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 첫 번째 보기, apples예요. few는 셀 수 있는 명사의 복수형 앞에 쓰니까요. money와 time은 셀 수 없는 명사라서 few와는 어울리지 않습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 말을 골라 봅시다.\u003c/div>\u003cdiv class=\"g-qs\">Can I ask ____ questions?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>a few\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>a little\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>few\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>little\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">a few\u003c/span>\u003cdiv class=\"g-exp\">questions는 셀 수 있는 복수 명사이고, 질문을 조금 하겠다는 긍정의 뜻이므로 a few를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제입니다. Can I ask, 빈칸, questions? 빈칸에 들어갈 말을 골라 보세요. 잠시 멈추고 직접 풀어 볼까요?","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 첫 번째 보기, a few예요. questions는 셀 수 있는 복수 명사이고, 질문을 조금 해도 될까요라고 묻는 긍정의 뜻이니까 a few questions라고 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 말을 골라 봅시다.\u003c/div>\u003cdiv class=\"g-qs\">She added ____ sugar to the coffee.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>a few\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>a little\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>few\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>little\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">a little\u003c/span>\u003cdiv class=\"g-exp\">sugar는 셀 수 없는 명사이고, 설탕을 조금 넣었다는 긍정의 뜻이므로 a little을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"세 번째 문제입니다. She added, 빈칸, sugar to the coffee. 빈칸에 들어갈 말을 골라 보세요. 잠시 멈추고 생각해 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 두 번째 보기, a little입니다. sugar는 셀 수 없는 명사이고, 커피에 설탕을 조금 넣었다는 긍정의 뜻이니까 a little sugar라고 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 일치하도록 a few, a little, few, little 중에서 알맞은 것을 빈칸에 써 봅시다. (진실을 아는 사람이 거의 없다.)\u003c/div>\u003cdiv class=\"g-qs\">____
