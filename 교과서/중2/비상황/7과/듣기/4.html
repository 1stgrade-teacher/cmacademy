    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"Watch & Guess","title":"중2 비상(황) 7과 Watch & Guess","audioDir":"4_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">원하는 것 말하고 경험 묻기\u003c/div>\u003ch1>중2 비상(황) 7과 대화문 해설 - 원데이 클래스 신청하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>문화 센터에서 남학생이 원데이 클래스를 신청하려고 한다. 여자 선생님이 이전에 들어 본 적이 있는지, 무엇을 배우고 싶은지 묻고, 남학생은 외국 문화 체험에 관심이 있다며 베트남 모자 만들기 수업을 고른다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 비상 황 선생님 교과서 일곱 번째 과의 대화문을 함께 공부할 거예요. 상황은 한 남학생이 문화 센터에 원데이 클래스를 신청하러 온 장면이에요. 여자 선생님이 전에 들어 본 적이 있는지 묻고, 무엇을 배우고 싶은지 물어보는 대화를 같이 살펴봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cdiv class=\"d-en\">M Excuse me, I'd like to sign up for a one-day class.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-1\">\u003cdiv class=\"d-en\">W Have you taken a one-day class here before?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cdiv class=\"d-en\">M No, this is my first time.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cdiv class=\"d-en\">W Okay, I'll help you. What do you want to learn?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cdiv class=\"d-en\">M I'm interested in experiencing foreign cultures.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cdiv class=\"d-en\">W Then, we have two Vietnamese culture classes.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cdiv class=\"d-en\">One is hat-making and the other is traditional cooking.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-7\">\u003cdiv class=\"d-en\">M Oh, I'd love to make a Vietnamese hat.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cdiv class=\"d-en\">W That's a great choice! The hat-making class is a lot of fun.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"M Excuse me, I'd like to sign up for a one-day class.","hl":"r-0"},{"n":3,"text":"W Have you taken a one-day class here before?","hl":"r-1"},{"n":4,"text":"M No, this is my first time.","hl":"r-2"},{"n":5,"text":"W Okay, I'll help you. What do you want to learn?","hl":"r-3"},{"n":6,"text":"M I'm interested in experiencing foreign cultures.","hl":"r-4"},{"n":7,"text":"W Then, we have two Vietnamese culture classes.","hl":"r-5"},{"n":8,"text":"One is hat-making and the other is traditional cooking.","hl":"r-6"},{"n":9,"text":"M Oh, I'd love to make a Vietnamese hat.","hl":"r-7"},{"n":10,"text":"W That's a great choice! The hat-making class is a lot of fun.","hl":"r-8"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">희망·신청 말하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I'd like to + 동사원형\u003c/div>\u003cdiv class=\"d-mean\">~하고 싶습니다(자신이 원하는 일을 정중하게 말하기)\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: M Excuse me, I'd like to sign up for a one-day class.\u003c/div>\u003cdiv class=\"d-exp\">자신이 원하는 일을 \u003cb class=\"key\">정중하게\u003c/b> 말할 때 \u003cb class=\"key\">I'd like to\u003c/b>+동사원형을 씁니다. 여기서는 \u003cb class=\"key\">sign up for\u003c/b>(~을 신청하다)와 함께 써서 원데이 클래스를 신청하고 싶다고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I want to sign up for a one-day class.\u003c/li>\u003cli>I'd like to register for a one-day class.\u003c/li>\u003cli>Can I sign up for a one-day class?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure. What do you want to learn?\u003c/li>\u003cli>Of course. I'll help you.\u003c/li>\u003cli>Okay. Have you taken one before?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"먼저 첫 번째 기능이에요. 하고 싶은 일을 정중하게 말할 때는 I'd like to 다음에 동사원형을 붙여요. 뜻은 하고 싶습니다 예요. 대화에서는 I'd like to sign up for a one-day class. 라고 해서 원데이 클래스를 신청하고 싶다고 말했어요. sign up for는 신청하다라는 뜻이에요.","hl":"key"},{"n":12,"text":"같은 뜻으로는 I want to sign up for a one-day class. 라고 해도 돼요. 조금 더 정중하게는 I'd like to register for a one-day class. 라고 할 수 있고, Can I sign up for a one-day class? 라고 물어봐도 같은 뜻이에요.","hl":"alts"},{"n":13,"text":"이렇게 말했을 때 상대는 Sure. What do you want to learn? 이라고 답할 수 있어요. 뜻은 물론이죠, 무엇을 배우고 싶으세요 예요. Of course. I'll help you. 라고 답해도 좋아요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">경험 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Have you + 과거분사(p.p.) ~ before?\u003c/div>\u003cdiv class=\"d-mean\">~해 본 적이 있나요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: W Have you taken a one-day class here before?\u003c/div>\u003cdiv class=\"d-exp\">\u003cb class=\"key\">Have you\u003c/b>+\u003cb class=\"key\">과거분사\u003c/b> ~?는 상대가 과거부터 지금까지 어떤 일을 해 본 적이 있는지 \u003cb class=\"key\">경험\u003c/b>을 물을 때 씁니다. 대답은 Yes, I have. 나 No, this is my first time.처럼 해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Have you ever taken a one-day class here?\u003c/li>\u003cli>Did you take a one-day class here before?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>No, this is my first time.\u003c/li>\u003cli>Yes, I have. It was fun.\u003c/li>\u003cli>No, I've never taken one.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"두 번째 기능은 경험을 묻는 표현이에요. Have you 다음에 과거분사를 넣고 before를 붙이면 해 본 적이 있나요라는 뜻이 돼요. 대화에서는 Have you taken a one-day class here before? 라고 해서 여기서 원데이 클래스를 들어 본 적이 있는지 물었어요.","hl":"key"},{"n":15,"text":"Have you ever taken a one-day class here? 라고 해도 같은 뜻이에요. Did you take a one-day class here before? 라고 물어도 자연스러워요.","hl":"alts"},{"n":16,"text":"경험이 없을 때는 No, this is my first time. 이라고 답해요. 처음이에요라는 뜻이죠. Yes, I have. 라고 하거나 No, I've never taken one. 이라고도 답할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">M \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Excuse me\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'd like to sign up for a one-day class\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">실례합니다, 저는 원데이 클래스를 신청하고 싶어요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>낯선 사람에게 정중하게 말을 걸 때 쓰는 표현으로, 여기서는 \u003cb class=\"key\">실례합니다\u003c/b>라는 뜻이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">I'd like to\u003c/b>+동사원형은 \u003cb class=\"key\">~하고 싶다\u003c/b>라는 뜻으로 자신이 원하는 일을 정중하게 말할 때 써요. \u003cb class=\"key\">sign up for\u003c/b>는 ~을 신청하다라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I want to sign up for a one-day class.\u003c/span>\u003cspan>I'd like to register for a one-day class.\u003c/span>\u003cspan>Can I sign up for a one-day class?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">W \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Have you taken\u003c/span> a one-day class here before?\u003c/div>\u003cdiv class=\"d-ko\">여기서 전에 원데이 클래스를 들어본 적 있으세요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">Have you\u003c/b>+\u003cb class=\"key\">과거분사\u003c/b> ~?는 \u003cb class=\"key\">~해 본 적이 있나요?\u003c/b>라는 뜻으로 경험을 물을 때 써요. taken은 take의 과거분사예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\" pan>\u003cspan>I'd like to experience foreign cultures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">W \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">Then\u003c/span>, we have \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">two Vietnamese culture classes\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">그러면 베트남 문화 수업이 두 가지가 있어요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">Then\u003c/b>은 \u003cb class=\"key\">그러면\u003c/b>이라는 뜻으로 앞의 말을 이어 주는 접속부사예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>‘두 가지 수업’처럼 \u003cb class=\"key\">수량\u003c/b>을 말할 때는 숫자 표현이 명사 앞에 와요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"다섯 번째 줄입니다. 남자가 I'm interested in experiencing foreign cultures. 라고 해요. 뜻은 저는 외국 문화를 체험하는 데 관심이 있어요 예요. be interested in은 관심이 있다는 뜻이고, in은 전치사라서 뒤에 동명사 experiencing이 왔어요. I want to experience foreign cultures. 라고 해도 비슷한 뜻이에요.","hl":"l-0"},{"n":22,"text":"여섯 번째 줄이에요. 여자가 Then, we have two Vietnamese culture classes. 라고 말합니다. 뜻은 그러면 베트남 문화 수업이 두 가지가 있어요 예요. Then은 그러면이라는 뜻으로 앞의 말을 자연스럽게 이어 줘요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">One is hat-making and the other is traditional cooking\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">하나는 모자 만들기이고, 다른 하나는 전통 요리예요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">one ~, the other ...\u003c/b>는 \u003cb class=\"key\">둘 중 하나는 ~이고 다른 하나는 …\u003c/b>이라는 뜻이에요. 두 사람이나 사물을 하나씩 나누어 말할 때 써요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">M Oh, \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">I'd love to make\u003c/span> a Vietnamese hat.\u003c/div>\u003cdiv class=\"d-ko\">오, 저는 베트남 모자를 만들어 보고 싶어요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>\u003cb class=\"key\">I'd love to\u003c/b>+동사원형은 \u003cb class=\"key\">~하고 싶다\u003c/b>라는 뜻으로, I'd like to보다 더 강한 희망을 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'd like to make a Vietnamese hat.\u003c/span>\u003cspan>I really want to make a Vietnamese hat.\u003c/span>\u003cspan>I'm interested in making a Vietnamese hat.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"일곱 번째 줄이에요. One is hat-making and the other is traditional cooking. 뜻은 하나는 모자 만들기이고 다른 하나는 전통 요리예요 예요. one 과 the other를 짝으로 쓰면 둘 중 하나와 나머지 하나를 나누어 말할 수 있어요.","hl":"l-0"},{"n":24,"text":"여덟 번째 줄입니다. 남자가 Oh, I'd love to make a Vietnamese hat. 이라고 해요. 뜻은 오, 저는 베트남 모자를 만들어 보고 싶어요 예요. I'd love to는 I'd like to보다 더 강하게 하고 싶다는 뜻이에요. I'd like to make a Vietnamese hat. 이라고 해도 같은 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">W \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">That's a great choice\u003c/span>! The hat-making class is \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">a lot of fun\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">좋은 선택이에요! 모자 만들기 수업은 매우 재미있어요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>\u003cb class=\"key\">That's a great choice\u003c/b>는 \u003cb class=\"key\">좋은 선택이에
