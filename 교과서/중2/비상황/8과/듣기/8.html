window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"C Watch & Present","title":"중2 비상(황) Everyday Communication 2 C Watch & Present","audioDir":"8_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">허락 요청하기와 알고 있는지 확인하기\u003c/div>\u003ch1>중2 비상(황) Everyday Communication 2 C Watch &amp; Present 대화문 해설\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>여학생이 아빠에게 이번 금요일 테니스 경기를 친구들과 보러 가도 되는지 허락을 구하고, 아빠가 누가 경기하는지와 시작 시간을 묻고 경기 중 관람 예절을 확인하는 대화이다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중2 비상 황 교과서 Everyday Communication 2 C Watch and Present 대화문을 함께 공부해 볼 거예요. 여학생이 아빠에게 이번 금요일 테니스 경기를 친구들과 보러 가도 되는지 물어보는 상황이에요. 아빠는 누가 경기하는지, 언제 시작하는지 물어보고 경기 중에는 조용히 해야 한다는 것도 확인합니다. 오늘 배울 두 가지 기능, 허락 요청하기와 알고 있는지 확인하기를 꼭 기억해 두세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">Dad, there is a tennis match this Friday at the sports enter.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">Wow! Who's playing?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">My favorite player, Sunny Kim. Is it okay to go and atch it with my friends?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">Sure. When does it start?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">It starts at 2 p.m.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">You know that you need to be quiet during the play, ight?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">Yes, Dad. Of course.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Dad, there is a tennis match this Friday at the sports enter.","hl":"r-0"},{"n":3,"text":"Wow! Who's playing?","hl":"r-1"},{"n":4,"text":"My favorite player, Sunny Kim. Is it okay to go and atch it with my friends?","hl":"r-2"},{"n":5,"text":"Sure. When does it start?","hl":"r-3"},{"n":6,"text":"It starts at 2 p.m.","hl":"r-4"},{"n":7,"text":"You know that you need to be quiet during the play, ight?","hl":"r-5"},{"n":8,"text":"Yes, Dad. Of course.","hl":"r-6"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">허락 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Is it okay to + 동사원형?\u003c/div>\u003cdiv class=\"d-mean\">~해도 괜찮을까요? / ~해도 될까요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: My favorite player, Sunny Kim. Is it okay to go and atch it with my friends?\u003c/div>\u003cdiv class=\"d-exp\">상대방에게 어떤 행동을 해도 되는지 \u003cb class=\"key\">허락\u003c/b>을 요청할 때 쓰는 표현이에요. Is it okay to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오고, go와 watch처럼 두 동작은 and로 \u003cb class=\"key\">병렬\u003c/b> 구조를 이뤄 이어 줍니다. 가볍게 물을 때는 Can I, 조금 더 공손하게는 May I 나 Would it be okay if I 로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Can I + 동사원형 ~?\u003c/li>\u003cli>May I + 동사원형 ~?\u003c/li>\u003cli>Would it be okay if I + 주어 + 동사 ~?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure.\u003c/li>\u003cli>Of course.\u003c/li>\u003cli>Yes, you can.\u003c/li>\u003cli>I'm afraid not.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"허락을 구할 때는 Is it okay to 다음에 동사원형을 붙여서 Is it okay to go and watch it with my friends? 처럼 말해요. 뜻은 친구들과 가서 봐도 될까요 예요. 여기서 go와 watch는 and로 나란히 이어지고, it은 테니스 경기를 가리킵니다.","hl":"key"},{"n":10,"text":"같은 뜻으로 Can I go and watch it with my friends? 라고 할 수 있어요. 조금 더 공손하게는 May I go and watch it with my friends? 라고 하고, Would it be okay if I go and watch it with my friends? 처럼 길게 물어도 됩니다.","hl":"alts"},{"n":11,"text":"허락을 받을 때는 Sure. 라고 하거나 Of course. 라고 답해요. Yes, you can. 도 자연스럽고, 안 된다면 I'm afraid not. 처럼 정중하게 거절할 수 있습니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">알고 있는지 확인하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">You know that + 주어 + 동사 ~, right?\u003c/div>\u003cdiv class=\"d-mean\">~라는 것을 알고 있지, 그렇지?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: You know that you need to be quiet during the play, ight?\u003c/div>\u003cdiv class=\"d-exp\">상대방이 이미 알고 있을 것으로 생각하는 사실을 다시 \u003cb class=\"key\">확인\u003c/b>할 때 쓰는 표현이에요. You know that 뒤에는 \u003cb class=\"key\">that절\u003c/b>이 오고, 문장 끝에 right? 를 붙여 동의를 구합니다. 상대가 모를 수도 있을 때는 Don't forget that 처럼 잊지 말라고 부드럽게 말하기도 해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>You know that + 주어 + 동사 ~, don't you?\u003c/li>\u003cli>Don't forget that + 주어 + 동사 ~, okay?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Yes, I know.\u003c/li>\u003cli>Of course.\u003c/li>\u003cli>Sure.\u003c/li>\u003cli>Oh, I didn't know that.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"상대가 이미 알고 있을 거라고 생각하는 사실을 다시 확인할 때는 You know that 다음에 주어와 동사를 붙이고 마지막에 right? 를 붙여요. 우리 대화에서는 You know that you need to be quiet during the play, right? 라고 했죠. 경기 중에는 조용히 해야 하는 거 알지, 그렇지? 라는 뜻이에요.","hl":"key"},{"n":13,"text":"right 대신에 don't you 를 붙여 You know that you need to be quiet during the play, don't you? 라고 할 수 있어요. Don't forget that you need to be quiet during the play, okay? 처럼 잊지 말라고 말할 수도 있습니다.","hl":"alts"},{"n":14,"text":"알고 있다고 답할 때는 Yes, I know. 라고 해 를 따로 쓰지 않아요.","hl":"l-0"},{"n":16,"text":"두 번째 줄이에요. 아빠가 Wow! Who's playing? 이라고 놀라며 묻습니다. 와, 누가 경기하니? 라는 뜻이죠. Who's는 Who is를 줄여 쓴 말이고, be동사에 ing를 붙인 현재진행형으로 누가 경기하는지를 물어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 7\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">W\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">My favorite player, Sunny Kim. \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">Is it okay to\u003c/span> go and atch it with my friends?\u003c/div>\u003cdiv class=\"d-ko\">여: 제가 가장 좋아하는 선수, Sunny Kim이요. 친구들과 가서 봐도 될까요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">Is it okay to + 동사원형\u003c/b>은 ~해도 괜찮을까요라는 뜻으로, 상대방에게 \u003cb class=\"key\">허락\u003c/b>을 요청할 때 쓴다. 동사원형 go와 watch가 접속사 and로 \u003cb class=\"key\">병렬\u003c/b> 구조를 이루고, a tennis match를 가리키는 it을 공통의 목적어로 취한다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Can I go and watch it with my friends?\u003c/span>\u003cspan>May I go and watch it with my friends?\u003c/span>\u003cspan>Would it be okay if I go and watch it with my friends?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">M\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">When does it start?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">남: 물론이지. 언제 시작하니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>의문사 When 뒤에 \u003cb class=\"key\">do/does\u003c/b>를 쓰고 주어와 \u003cb class=\"key\">동사원형\u003c/b>을 붙여 언제 하는지 묻는다. 주어 it이 3인칭 단수라서 does를 썼다.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"세 번째 줄이에요. 여학생이 My favo
