<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 능률(김) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 능률(김) 8과 본문2","audioDir":"2_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>능률(김)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>How AI Learns and Works Like Us\u003c/h1>\u003ch2>AI가 학습하고 작동하는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">인공지능(AI)\u003c/b>이 \u003cb class=\"key\">반려견\u003c/b>의 학습 방식과 유사하게 \u003cb class=\"key\">정보와 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 통해 학습하며, 일상생활 속 \u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">추천\u003c/b>과 \u003cb class=\"key\">안면 \u003c/b>\u003cb class=\"key\">인식\u003c/b> 등에 활용됨을 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>AI learns from information and experiences just like a pet dog and is used in various everyday situations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간에는 인공지능이 어떻게 학습하고 우리 일상에서 쓰이는지 함께 살펴볼게요. 글의 전체 요약과 요지를 머릿속에 떠올리면서 집중해 보세요. AI가 반려동물처럼 정보를 통해 학습한다는 점이 핵심이랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인공지능 \u003cb class=\"key\">Artificial \u003c/b>\u003cb class=\"key\">Intelligence\u003c/b>은 컴퓨터가 인간처럼 사고하고 학습할 수 있도록 만드는 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">과학\u003c/b> 기술 분야를 말해요. 마치 우리가 자전거 타기를 배우거나 새로운 외국어를 익힐 때 수많은 연습과 \u003cb class=\"key\">경험\u003c/b>을 쌓는 것과 아주 비슷하답니다. AI 역시 엄청난 양의 데이터 \u003cb class=\"key\">Data\u003c/b>를 바탕으로 스스로 패턴을 찾아내며 똑똑해져요. 반려동물 \u003cb class=\"key\">Pet\u003c/b>을 훈련할 때 보상으로 \u003cb class=\"key\">간식\u003c/b>을 주며 가르치듯, AI는 디지털 환경 속에서 \u003cb class=\"key\">정보\u003c/b>를 처리하며 성장하지요. 오늘날 우리는 스마트폰 잠금 해제나 \u003cb class=\"key\">추천 \u003c/b>\u003cb class=\"key\">알고리즘\u003c/b> 같은 기술을 통해 이 \u003cb class=\"key\">인공지능\u003c/b>을 매일 자연스럽게 경험하고 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 탄탄하게 다져볼까요. 인공지능은 컴퓨터가 인간처럼 생각하고 학습하도록 만드는 컴퓨터 과학 기술 분야예요. 우리가 새로운 것을 배울 때 경험을 쌓듯 AI도 데이터를 통해 성장한답니다. 오늘 배우는 지문 속 AI의 개념을 떠올리며 배경을 이해해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이해를 돕는 질문\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>사용자는 \u003cb class=\"key\">설명\u003c/b>을 이해하기 어렵다며 \u003cb class=\"key\">예시\u003c/b>를 요청하고, 앤니는 흔쾌히 이를 수락해요. 이 도입부는 추상적인 개념인 \u003cb class=\"key\">AI\u003c/b>를 친숙한 비유로 설명하기 위한 대화의 시작점 역할을 한답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반려견과의 비유\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>새로운 \u003cb class=\"key\">반려견\u003c/b>에게 앉고 머무는 법을 가르치는 상황을 떠올리게 하며 \u003cb class=\"key\">정보와 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 통해 배운다는 점을 강조해요. \u003cb class=\"key\">AI\u003c/b> 역시 이와 비슷하게 작동하지만, \u003cb class=\"key\">반려견\u003c/b>과 달리 \u003cb class=\"key\">간식\u003c/b>을 줄 필요는 없다는 차이점이 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일상 속 AI 활용\u003csmall>예시 · 문장 8–14\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">AI\u003c/b>가 \u003cb class=\"key\">일상생활\u003c/b>의 다양한 상황에서 어떻게 쓰이는지 구체적인 \u003cb class=\"key\">예시\u003c/b>를 들어 설명해요. 사용자가 좋아할 만한 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">추천\u003c/b>은 물론이고, \u003cb class=\"key\">안면 \u003c/b>\u003cb class=\"key\">인식\u003c/b> 기술을 통해 얼굴을 학습하여 머리 모양이 바뀌거나 마스크를 써도 스마트폰 \u003cb class=\"key\">잠금 \u003c/b>\u003cb class=\"key\">해제\u003c/b>를 더 잘하게 되지요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 전체적인 흐름을 세 단계로 나누어 차근차근 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 사용자가 설명이 어렵다며 예시를 부탁하고 앤니가 이를 수락하는 내용이 나와요. 추상적인 AI 개념을 쉽게 풀어나가기 위한 자연스러운 도입부 역할을 하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 반려견 훈련 비유가 등장해요. 반려견이 정보와 경험으로 배우듯 AI도 비슷하게 학습하지만 간식을 줄 필요는 없다는 점이 아주 재미있는 포인트랍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 일상 속 AI 활용 예시가 구체적으로 나와요. 영상 추천 기능이나 안면 인식을 통한 스마트폰 잠금 해제처럼 우리 삶 속에서 AI가 어떻게 쓰이는지 잘 보여주고 있어요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유 및 예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 \u003cb class=\"key\">AI\u003c/b>와 \u003cb class=\"key\">반려견\u003c/b>의 학습 방식을 \u003cb class=\"key\">비유\u003c/b>를 통해 알기 쉽게 설명한 뒤, 일상 속에서 \u003cb class=\"key\">AI\u003c/b>가 쓰이는 구체적인 \u003cb class=\"key\">예시\u003c/b>들을 차례대로 제시하고 있어요. 독자들이 추상적인 기술 개념을 쉽게 이해할 수 있도록 \u003cb class=\"key\">질문과 \u003c/b>\u003cb class=\"key\">답변\u003c/b> 형식 및 친근한 \u003cb class=\"key\">비유\u003c/b> 구조를 취하고 있답니다. 따라서 중심 문장인 AI도 비슷하다는 내용이 앞부분에 제시되는 \u003cb class=\"key\">두괄식\u003c/b> 구조를 이루고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (10)\u003c/b>\u003cspan>구체적 예시 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">information and experiences\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI is similar\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI is used in many situations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recommend new videos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recognize your face\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>반려견 훈련\u003c/th>\u003cth>AI 학습\u003c/th>\u003c/tr>\u003ctr>\u003ctd>정보와 경험으로 학습\u003c/td>\u003ctd>정보와 경험으로 학습\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보상으로 간식이 필요함\u003c/td>\u003ctd>간식이 필요 없음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이번 지문은 비유와 예시라는 전개방식을 사용하고 있어요. AI의 학습 방식을 반려견에 빗대어 설명한 뒤 구체적인 일상 예시를 붙여주는 구조랍니다. 중심 문장이 앞쪽에 놓이는 두괄식 형태를 띠고 있어서 전체 내용을 파악하기 아주 좋아요.","hl":"ty"},{"n":8,"text":"글을 읽을 때 도움을 주는 신호어와 재진술 표현들을 눈여겨봐야 해요. 예를 들어 첫 번째 예시를 시작할 때 등장하는 for example 같은 표현은 뒤에 구체적인 상황이 이어짐을 알려주는 중요한 길잡이 역할을 한답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hard\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운, 힘든\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explanation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예시, 보기\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet dog\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반려견\u003c/span>\u003c/div>\u003cdiv>\u003cb>teach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가르치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>snack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간식\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyday life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일상생활\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>recommend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추천하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시청하다, 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unlock\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잠금을 해제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>over time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 흐르면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>mask\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마스크\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에 나온 중요한 단어와 숙어들을 꼼꼼히 챙겨봐야 해요. 이해하다라는 뜻의 understand나 비슷한이라는 뜻의 similar 같은 필수 어휘들은 시험에 자주 나오니까 반드시 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">비슷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recommend\u003c/b>\u003cspan class=\"m\">추천하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suggest\u003c/span>\u003cspan class=\"s\">advise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recognize\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"s\">acknowledge\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 단골로 출제되는 핵심 어휘의 동의어도 함께 정리해 둘게요. understand의 동의어로는 comprehend나 grasp가 있고, similar의 동의어로는 alike를 쓸 수 있어요. 반의어도 함께 외워두면 실력 탄탄해질 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\ lass=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사\u003c/span> : 전치사 [at] + 동명사 [recognizing] : \"인식하는 것에 더 능숙해지는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 부사절 (even if)\u003c/span> : even if [비록 ~일지라도] + 주어 [you] + 동사 [change / wear] : \"네가 머리를 바꾸거나 마스크를 쓰더라도\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Over time, 시간이 흐르면서. it gets better at recognizing you, 그건 너를 인식하는 것에 더 능숙해져. even if, 비록 ~하더라도. you change your hair or wear a mask, 네가 머리를 바꾸거나 마스크를 쓰더라도. 이 문장 전체를 해석하면, 시간이 흐르면서, 그건 네가 머리를 바꾸거나 마스크를 쓰더라도 너를 인식하는 것에 더 능숙해져.","hl":"m"},{"n":50,"text":"시간이 지날수록 인공지능이 헤어스타일 변화나 마스크 착용 같은 변수 속에서도 사용자를 더 잘 알아본다는 내용이에요. 데이터가 쌓일수록 실력이 느는 AI의 특징을 아주 잘 보여주고 있죠.","hl":"mn"},{"n":51,"text":"첫 번째 어법 포인트는 전치사 at 뒤에 온 recognizing이에요. 전치사 뒤에는 동명사를 써야 하므로 동사 recognize에 ing를 붙였다는 것을 꼭 기억해 두세요. 두 번째 어법 포인트는 비록 ~일지라도라는 뜻을 가진 even if예요. 이 표현 뒤에는 주어와 동사가 오고, 안에서 change와 wear가 and나 or로 이어지는 병렬구조를 이루고 있다는 점도 함께 챙겨 가세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사용자가 AI \u003cb class=\"key\">설명\u003c/b>을 이해하기 어려워하자 앤니가 \u003cb class=\"key\">반려견\u003c/b>을 예로 들어 설명한다.\u003c/li>\u003cli>반려견이 \u003cb class=\"key\">정보와 \u003c/b>\u003cb class=\"key\">경험\u003c/b>으로 배우듯 \u003cb class=\"key\">AI\u003c/b>도 비슷하게 학습하지만 간식은 필요 없다.\u003c/li>\u003cli>\u003cb class=\"key\">AI\u003c/b>는 사용자가 좋아할 만한 새 \u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">추천\u003c/b>을 위해 시청 기록을 학습하고 결정한다.\u003c/li>\u003cli>또한 \u003cb class=\"key\">안면 \u003c/b>\u003cb class=\"key\">인식\u003c/b> 기술을 통해 얼굴을 학습하여 시간이 흐를수록 더 정확히 \u003cb class=\"key\">잠금 \u003c/b>\u003cb class=\"key\">해제\u003c/b>를 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>AI learns from information and experiences just like a pet dog and is used in various everyday situations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">인공지능(AI)\u003c/b>이 \u003cb class=\"key\">반려견\u003c/b>의 학습 방식과 유사하게 \u003cb class=\"key\">정보와 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 통해 학습하며, 일상생활 속 \u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">추천\u003c/b>과 \u003cb class=\"key\">안면 \u003c/b>\u003cb class=\"key\">인식\u003c/b> 등에 활용됨을 설명한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 우리는 AI가 정보와 경험을 통해 학습하는 방식과 일상 속 활용 모습을 함께 공부했어요. 비유와 예시를 통해 개념을 쉽게 풀어낸 글의 구조를 다시 한번 복습해 보세요. 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
