<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 능률(김) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 능률(김) 8과 본문1","audioDir":"1_audio","preview":false,"count":50,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>능률(김)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>What is AI?\u003c/h1>\u003ch2>AI란 무엇인가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">챗봇\u003c/b>과의 대화를 통해 \u003cb class=\"key\">인공지능\u003c/b>의 정의와 인간처럼 언어를 이해하고 학습하는 능력을 설명합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Artificial Intelligence is a computer system that can understand language, learn from experiences, and make decisions like humans.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 우리가 함께 공부할 영어 지문은 인공지능에 대한 흥미로운 대화 내용이에요. 글 전체의 요약과 요지를 살펴보면, AI 챗봇과의 대화를 통해 인공지능의 정의와 능력을 배운다는 내용이죠. 인공지능은 인간처럼 언어를 이해하고 학습하는 컴퓨터 시스템이라는 점을 기억하며 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인공지능 \u003cb class=\"key\">Artificial \u003c/b>\u003cb class=\"key\">Intelligence\u003c/b> 줄여서 \u003cb class=\"key\">AI\u003c/b>는 인간의 학습 능력과 추론 능력을 컴퓨터를 통해 구현한 기술입니다. 마치 우리가 어렸을 때부터 경험을 통해 배우고 언어를 익히듯, \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">시스템\u003c/b> 역시 수많은 데이터를 바탕으로 스스로 학습할 수 있습니다. 일상생활에서 스마트폰의 음성 비서나 추천 알고리즘처럼 이미 우리 곁에 깊숙이 들어와 있는 대표적인 \u003cb class=\"key\">첨단 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이라고 볼 수 있죠.\u003c/div>","segs":[{"n":2,"text":"배경지식 설명을 먼저 해드릴게요. 인공지능은 영어로 Artificial Intelligence라고 하며 줄여서 AI라고 불러요. 인간의 학습 능력과 추론 능력을 컴퓨터를 통해 구현한 첨단 기술이죠. 마치 우리가 어렸을 때부터 경험을 통해 배우고 언어를 익히듯, 컴퓨터 시스템 역시 수많은 데이터를 바탕으로 스스로 학습할 수 있어요. 일상생활에서 스마트폰의 음성 비서처럼 이미 우리 곁에 깊숙이 들어와 있는 개념이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입과 대화\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 부분에서는 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">챗봇\u003c/b>과 직접 대화하고 질문을 던져보며, 학급 친구들과 대화 내용을 공유하는 \u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">안내\u003c/b>로 수업을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인사와 소개\u003csmall>예시 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>유저와 \u003cb class=\"key\">ANNIE\u003c/b>라는 AI 친구가 서로 인사를 나누며, 자신을 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">친구\u003c/b>로 소개하고 어떤 질문이든 답할 수 있다고 말합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>AI의 정의\u003csmall>결론 · 문장 9–14\u003c/small>\u003c/h4>\u003cp>유저의 질문에 이어 \u003cb class=\"key\">ANNIE\u003c/b>는 AI가 \u003cb class=\"key\">인공지능\u003c/b>을 의미하며, 언어를 이해하고 경험에서 배우며 \u003cb class=\"key\">의사결정\u003c/b>을 하는 컴퓨터 시스템이라고 설명합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 AI 챗봇과의 대화 흐름에 따라 세 단계로 나누어 볼 수 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입 부분에서는 AI 챗봇과 직접 대화하고 질문을 던져보며 학급 친구들과 대화 내용을 공유하는 활동 안내로 수업이 시작돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 전개 부분에서는 유저와 ANNIE라는 AI 친구가 서로 인사를 나누며 자신을 AI 친구로 소개하고 어떤 질문이든 답할 수 있다고 말해요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 결론 부분에서는 유저의 질문에 이어 ANNIE가 AI는 인공지능을 의미하며 언어를 이해하고 경험에서 배우며 의사결정을 하는 컴퓨터 시스템이라고 설명해요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">질문-답변\u003c/b> 구조를 사용하여 독자가 궁금해할 만한 AI의 개념을 자연스럽게 이끌어냅니다. 유저가 무엇이냐고 물어보면 \u003cb class=\"key\">ANNIE\u003c/b>가 그에 대한 명확한 정의를 내려주는 방식을 취하고 있죠. 따라서 중심 내용인 \u003cb class=\"key\">AI의 \u003c/b>\u003cb class=\"key\">정의\u003c/b>가 답변 부분에 뚜렷하게 드러나는 \u003cb class=\"key\">두괄식\u003c/b> 형태의 글입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What is AI? (12)\u003c/b>\u003cspan>핵심 질문 제기\u003c/span>\u003cb>stands for (13)\u003c/b>\u003cspan>개념 정의 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">AI\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Artificial Intelligence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">computer system\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 질문과 답변이 오가는 구조를 띠고 있어요. 독자가 궁금해할 만한 AI의 개념을 자연스럽게 이끌어내기 위해 질문-답변 방식을 사용했죠. 따라서 중심 내용인 AI의 정의가 답변 부분에 뚜렷하게 드러나는 두괄식 형태의 글이라고 볼 수 있어요.","hl":"ty"},{"n":8,"text":"글 속에서 신호어와 전개 방식을 살펴보면, 열두 번째 문장의 What is AI라는 표현이 핵심 질문을 제기하고 있어요. 이어서 열세 번째 문장의 stands for 표현을 통해 개념의 정의를 명확하게 설명해 주고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>chat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡담하다, 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chatbot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>챗봇\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>급친구, 학급 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>question\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질문\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도프다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sure\u003c/b>\u003cem>부사\u003c/em>\u003cspan>물론\u003c/span>\u003c/div>\u003cdiv> 게 되어 기뻐!","hl":"m"},{"n":39,"text":"조동사의 축약형과 투부정사가 함께 쓰여 질문에 기꺼이 답하겠다는 친근한 태도를 보여줘요. 상대방의 궁금증을 반갑게 받아주는 ANNIE의 성격을 잘 드러낸답니다.","hl":"mn"},{"n":40,"text":"첫 번째 어법 포인트는 I'd예요. I would의 줄임말인데, 부드러운 어조로 기쁜 마음을 나타내죠. 두 번째 어법 포인트는 to answer예요. 감정을 나타내는 형용사 happy 뒤에서 그 감정의 원인을 설명하며 ~하게 되어 기쁘다는 뜻을 완성한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">User:\u003c/span>\u003cspan class=\"en\">User:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 첫 질문은,\u003c/span>\u003cspan class=\"en\">My first question is:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 뭐야?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">AI?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">User: 내 첫 질문은, AI가 뭐야?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사용자가 본격적으로 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>인 인공지능에 대해 물어보는 문장이에요. \u003cb class=\"key\">의문사 \u003c/b>\u003cb class=\"key\">what\u003c/b>을 사용해 궁금한 점을 직접적으로 묻고 있답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접의문문\u003c/span> : 의문사(What) + 동사(is) + 주어(AI) : \"AI가 뭐야?\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"User, User:. My first question is, 내 첫 질문은. What is AI?, AI가 뭐야?. 이 문장 전체를 해석하면, User: 내 첫 질문은, AI가 뭐야?","hl":"m"},{"n":42,"text":"사용자가 본격적으로 핵심 주제인 인공지능에 대해 물어보는 문장이에요. 의문사 what을 사용해 궁금한 점을 직접적으로 묻고 있답니다.","hl":"mn"},{"n":43,"text":"여기서는 What is AI?라는 직접의문문을 살펴볼게요. 의문사가 문장 맨 앞에 나와서 모르는 정보를 직접 묻고 있죠. 이때 비동사와 주어의 어순이 바뀌어 있다는 점을 잘 봐두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-h \u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험으로부터 배우며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">experiences, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사결정을 해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span> like humans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그건 일종의 컴퓨터 시스템이야.AI는 인간처럼 언어를 이해하고, 경험으로부터 배우며, 의사결정을 해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 단순한 기계가 아니라 인간처럼 생각하고 행동할 수 있는 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>이라는 점을 강조하고 있어요. 세 가지 동작이 \u003cb class=\"key\">병렬구조\u003c/b>로 연결되어 AI의 능력을 구체적으로 보여준답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬구조\u003c/span> : 조동사 can + 동사원형①, 동사원형②, and 동사원형③ : \"이해하고, 배우며, 의사결정을 한다\"\u003c/div>\u003c/div>","segs":[{"n":47,"text":"It is a kind of computer system, 그건 일종의 컴퓨터 시스템이야.. AI can understand language, AI는 인간처럼 언어를 이해하고. learn from experiences, 경험으로부터 배우며. and make decisions like humans, 의사결정을 해.. 이 문장 전체를 해석하면, 그건 일종의 컴퓨터 시스템이야.AI는 인간처럼 언어를 이해하고, 경험으로부터 배우며, 의사결정을 해.","hl":"m"},{"n":48,"text":"이번 문장은 AI가 구체적으로 어떤 일을 할 수 있는지 설명해 주는 중요한 내용이에요. 인간처럼 언어를 이해하고 경험을 통해 배우며 스스로 결정을 내린다는 점을 잘 기억해 두세요.","hl":"mn"},{"n":49,"text":"첫 번째 어법 포인트는 조동사 can 뒤에 이어지는 병렬구조예요. understand와 learn 그리고 make가 모두 콤마와 and로 예쁘게 연결되어 있으니까 서술형 영작 대비로 형태를 꼭 써보도록 하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>학생들은 AI 챗봇과 대화하고 질문을 나누는 \u003cb class=\"key\">활동\u003c/b>을 합니다.\u003c/li>\u003cli>ANNIE는 자신의 정체를 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">친구\u003c/b>라고 소개합니다.\u003c/li>\u003cli>유저의 첫 번째 질문은 \u003cb class=\"key\">AI의 \u003c/b>\u003cb class=\"key\">정의\u003c/b>에 관한 것입니다.\u003c/li>\u003cli>AI는 언어를 이해하고 경험에서 배우며 \u003cb class=\"key\">의사결정\u003c/b>을 하는 컴퓨터 시스템입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Artificial Intelligence is a computer system that can understand language, learn from experiences, and make decisions like humans.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">챗봇\u003c/b>과의 대화를 통해 \u003cb class=\"key\">인공지능\u003c/b>의 정의와 인간처럼 언어를 이해하고 학습하는 능력을 설명합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":50,"text":"오늘 우리는 AI가 무엇인지 챗봇과의 대화를 통해 알아보는 지문을 함께 공부했어요. 인공지능이 인간처럼 언어를 이해하고 학습하는 컴퓨터 시스템이라는 점을 잘 기억해 두기로 해요. 수고 많았어요, 여러분!","hl":null}]}]});</script></body></html>
