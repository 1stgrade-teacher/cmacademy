</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 능률(김) 7과 본문3","audioDir":"3_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>능률(김)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>A Free Backpack That Taught Me to Share\u003c/h1>\u003ch2>나눔을 가르쳐 준 공짜 백팩\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>화자는 어떤 사람에게서 멋진 \u003cb class=\"key\">백팩\u003c/b>을 돈을 들이지 않고 얻고, 그 상태와 색깔에 만족하며 학교에서 쓰기를 기대했어요. 그날의 훌륭한 \u003cb class=\"key\">경험\u003c/b>은 저 역시 다른 사람들과 제 것을 \u003cb class=\"key\">공유\u003c/b>해야겠다는 생각을 하게 만들었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A backpack I got for free taught me that I should share my things with others, too.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 능률 김 선생님 교과서 일곱 번째 과, 본문 세 번째 지문을 함께 읽어 볼 거예요. 이 글은 어떤 사람에게서 백팩을 받은 뒤 집으로 돌아온 화자의 경험을 담고 있어요. 화자는 돈을 한 푼도 쓰지 않고 멋진 백팩을 얻었고, 그 경험을 통해 다른 사람들과 자기 것을 나눠야겠다고 생각하게 됩니다. 자, 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 주변에는 물건을 사고파는 것 말고도, 필요한 사람에게 그냥 주는 \u003cb class=\"key\">나눔\u003c/b> 문화가 있어요. 이런 방식을 영어로 sharing economy 또는 freecycling이라고 부르는데, 안 쓰는 물건을 무료로 주고받는 활동을 말하죠. 이는 자원을 아끼고 \u003cb class=\"key\">환경\u003c/b>을 보호한다는 점에서도 중요해요. 예를 들어 안 입는 옷이나 다 읽은 책을 이웃에게 주면, 받는 사람은 돈을 들이지 않고 물건을 얻고 주는 사람은 공간을 정리할 수 있어요. 마치 친구끼리 간식을 나눠 먹으면 더 즐거운 것처럼, 물건을 나누면 사람 사이의 \u003cb class=\"key\">관계\u003c/b>도 더 따뜻해진답니다. 이 글의 화자도 이웃에게서 백팩을 무료로 받으며 그 가치를 직접 느껴요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 좀 알고 가면 좋아요. 우리 주변에는 물건을 사고파는 것 말고도, 필요한 사람에게 그냥 주는 나눔 문화가 있어요. 이런 걸 영어로 sharing economy, 또는 freecycling이라고 불러요. 안 쓰는 옷이나 책을 이웃에게 무료로 주는 거죠. 이건 자원을 아끼고 환경을 보호한다는 점에서도 중요해요. 친구끼리 간식을 나눠 먹으면 더 즐거운 것처럼, 물건을 나누면 사람 사이의 관계도 더 따뜻해진답니다. 이 글의 화자도 바로 이런 나눔을 경험하게 돼요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>백팩을 받다\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자는 어떤 사람에게서 \u003cb class=\"key\">백팩\u003c/b>을 받은 후 집으로 돌아갔어요. 백팩은 예전의 제 것만큼 크지는 않았지만, \u003cb class=\"key\">상태\u003c/b>가 아주 좋았어요. 여기서 not as big as는 예전 것과 크기를 비교하는 \u003cb class=\"key\">비교급\u003c/b> 표현이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>색깔과 기대\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>화자는 백팩의 \u003cb class=\"key\">색깔\u003c/b>이 정말 맘에 들었어요. 그리고 학교 갈 때 \u003cb class=\"key\">사용하기를 \u003c/b>\u003cb class=\"key\">기대\u003c/b>했어요. look forward to는 '~을 기대하다'라는 뜻의 \u003cb class=\"key\">숙어\u003c/b>예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>훌륭한 경험\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>화자는 그날을 훌륭한 \u003cb class=\"key\">경험\u003c/b>으로 표현해요. 돈을 전혀 \u003cb class=\"key\">쓰지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 멋진 백팩을 구했다는 점을 강조하고 있죠. without spending any money가 바로 그 핵심 표현이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>나눔의 깨달음\u003csmall>주장 · 문장 7\u003c/small>\u003c/h4>\u003cp>이 경험은 화자에게 중요한 \u003cb class=\"key\">깨달음\u003c/b>을 줬어요. 바로 저 역시도 다른 사람들과 제 것을 \u003cb class=\"key\">공유\u003c/b>해야겠다는 생각이에요. 글의 \u003cb class=\"key\">주제\u003c/b>가 마지막에 나오는 구조라는 점을 기억해 두세요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 화자는 어떤 사람에게서 백팩을 받은 후 집으로 돌아갔어요. 백팩은 예전의 제 것만큼 크지는 않았지만 상태가 아주 좋았어요. 여기서 not as big as는 예전 것과 크기를 비교하는 비교급 표현이라는 것도 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계로 넘어가 볼게요. 화자는 백팩의 색깔이 정말 맘에 들었어요. 그리고 학교 갈 때 사용하기를 기대했죠. look forward to는 기대하다라는 뜻의 숙어예요.","hl":"f1"},{"n":6,"text":"세 번째 단계예요. 화자는 그날을 훌륭한 경험으로 표현해요. 돈을 전혀 쓰지 않고 멋진 백팩을 구했다는 점을 강조하고 있죠. without spending any money가 바로 그 핵심 표현이에요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계에서는 이 경험이 화자에게 준 깨달음이 나와요. 바로 저 역시도 다른 사람들과 제 것을 공유해야겠다는 생각이에요. 글의 주제가 마지막에 나오는 구조라는 점, 꼭 기억해 두세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 화자가 백팩을 받고 집으로 돌아간 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 사건을 전개해요. 하지만 그 경험이 주는 의미, 즉 \u003cb class=\"key\">나눔\u003c/b>에 대한 깨달음은 마지막 문장에서 드러나요. 그래서 \u003cb class=\"key\">주제문\u003c/b>이 글 끝에 있는 미괄식 구조예요. 처음부터 끝까지 한 개인의 구체적인 \u003cb class=\"key\">경험\u003c/b>을 서술한다는 점이 특징이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>also (3)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>That day (5)\u003c/b>\u003cspan>지시\u003c/span>\u003cb>also (7)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>too (7)\u003c/b>\u003cspan>추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the backpack\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a cool backpack\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 화자의 경험을 시간 순서대로 서술하는 방식이에요. 백팩을 받고, 상태를 확인하고, 기대하고, 깨닫는 과정이 차례로 이어지죠. 그런데 글의 주제, 즉 나눔에 대한 깨달음은 맨 마지막 문장에서 드러나요. 그래서 주제문이 글 끝에 있는 미괄식 구조라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어도 함께 짚어 볼게요. 두 번째 문장의 but은 예전 것과 지금 것을 대조하는 신호예요. 세 번째 문장의 also는 내용을 추가하는 신호이고, 다섯 번째 문장의 That day는 앞의 경험을 가리키는 지시 표현이에요. 마지막 문장의 also와 too 역시 내용을 덧붙이며 나눔이라는 주제로 자연스럽게 이어 준답니다.","hl":"sg"}]},{"html":"\u003 m>동사\u003c/em>\u003cspan>(돈·시간을) 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>money\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돈\u003c/span>\u003c/div>\u003cdiv>\u003cb>cool\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>should\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나누다, 공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>것, 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>others\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다른 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>too\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한, 역시\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. condition은 상태라는 뜻이고, in great condition은 아주 좋은 상태인이라는 표현이에요. look forward to는 기대하다, share는 나누다, 공유하다라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">get\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">great\u003c/b>\u003cspan class=\"m\">훌륭한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">excellent\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"s\">fantastic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">like\u003c/b>\u003cspan class=\"m\">좋아하다\u003c/span>\u003cdiv clas I got the backpack, 제가 백팩을 얻은 후에. from the person, 그 사람에게서. I went home, 저는 집으로 돌아갔어요.. 이 문장 전체를 해석하면, 그 사람에게서 백팩을 얻은 후 저는 집으로 돌아갔어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작이에요. 주인공이 그 사람에게서 백팩을 얻고 집으로 돌아가는 장면을 보여 주죠. after가 있어서 백팩을 얻은 일이 먼저, 집에 간 일이 나중이라는 시간 순서가 분명해집니다.","hl":"mn"},{"n":14,"text":"어법 포인트, 첫 번째로 after를 보세요. after는 접속사로 쓰여서 뒤에 주어와 동사가 있는 절을 데려옵니다. 그래서 After I got the backpack처럼 시간을 알려 주는 부사절이 만들어져요. 두 번째로 the person을 보세요. 사람 앞에 the가 붙으면 이미 이야기한 특정한 그 사람을 가리킵니다. 세 번째로 went home을 보세요. home은 여기서 부사로 쓰여서 to home이라고 하지 않고 went home이라고만 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 백팩은 그만큼 크지는 않았어요\u003c/span>\u003cspan class=\"en\">The backpack \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예전의 제 것만큼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지만 그것은\u003c/span>\u003cspan class=\"en\">but it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상태가 아주 좋았어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">condition\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">백팩은 예전의 제 것만큼 크지는 않았지만, 상태가 아주 좋았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 받은 백팩의 상태를 설명하는 문장이에요. 크기는 예전 것보다 작지만 \u003cb class=\"key\">상태\u003c/b>는 아주 좋다고 말하며, 앞으로 이 백팩을 쓸 \u003cb class=\"key\">기대감\u003c/b>을 만들어 주죠. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">as \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">as\u003c/b>는 예전 것만큼 크지 않다는 뜻으로, 그냥 작다고만 하는 것보다 비교의 느낌을 살려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급 비교의 부정 (not as ~ as)\u003c/span> : [주어] + [be동사] + not + [[as + 원급 + as]] + [비교 대상] : \"예전의 제 것만큼 크지는 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 one (반복 회피)\u003c/span> : [소유격 my] + [형용사 old] + [[대명사 one]] : \"예전의 제 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be in + 형용사 + 상태 명사 (관용 표현)\u003c/span> : [be동사] + [[in]] + [형용사 great] + [명사 condition] : \"상태가 아주 좋았어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The backpack wasn't as big, 그 백팩은 그만큼 크지는 않았어요. as my old one, 예전의 제 것만큼. but it was, 그렇지만 그것은. in great condition, 상태가 아주 좋았어요.. 이 문장 전체를 해석하면, 백팩은 예전의 제 것만큼 크지는 않았지만, 상태가 아주 좋았어요.","hl":"m"},{"n":16,"text":"이 문장은 받은 백팩의 상태를 설명해요. 크기는 예전 것보다 작지만 상태는 아주 좋다고 말하면서 앞으로 이 백팩을 쓸 기대감을 만들어 주죠. not as big as는 예전 것만큼 크지 않다는 뜻으로, 그냥 작다고만 하는 것보다 비교의 느낌을 살려 줍니다.","hl":"mn"},{"n":17,"text":"어법 포인트, 첫 번째로 wasn't as big as를 보세요. as와 as 사이에 형용사의 원급을 넣으면 두 대상을 비교하는 원급 비교가 됩니다. 여기에 not이 붙으면 예전 것만큼 크지 않다는 뜻이 돼요. 두 번째로 my old one을 보세요. 여기서 one은 앞에 나온 backpack을 다시 말하지 않으려고 대신 쓰는 대명사예요. 세 번째로 was in great condition을 보세요. be 동사 뒤에 in과 상태를 나타내는 말을 붙이면 어떤 상태에 있다는 뜻을 나타내는 관용 표현이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 또한 정말 좋아했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">liked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 색깔을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 저는 이것의 색깔이 정말 맘에 들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 백팩이 마음에 든 이유를 하나 더 보태는 문장이에요. 크기는 작아도 상태와 \u003cb class=\"key\">색깔\u003c/b>까지 좋아서 주인공이 이 백팩에 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">만족\u003c/b>해 한다는 걸 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 위치 (일반동사 앞)\u003c/span> : [[부사 also]] + [[부사 really]] + [일반동사 liked] : \"또한 정말 좋아했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of를 이용한 소유 표현\u003c/span> : [명사 the color] + [[of]] + [대명사 it] : \"그것의 색깔\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I also really liked, 저는 또한 정말 좋아했어요. the color of it, 그것의 색깔을. 이 문장 전체를 해석하면, 또 저는 이것의 색깔이 정말 맘에 들었어요.","hl":"m"},{"n":19,"text":"이 문장은 백팩이 마음에 든 이유를 하나 더 보태요. 크기는 작아도 상태와 색깔까지 좋아서 주인공이 이 백팩에 아주 만족해 한다는 걸 보여 주죠.","hl":"mn"},{"n":20,"text":"어법 포인트, 첫 번째로 also really liked를 보세요. also와 really 같은 부사는 일반동사 앞에 놓여서 그 동작을 꾸며 줍니다. 두 번째로 the color of it을 보세요. it이라는 대명사의 색깔을 말할 때는 its color라고도 하지만, 여기서는 of를 써서 the color of it이라고 표현했어요. 뜻은 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 기대했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">forward \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">using\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교 갈 때 사용하기를 기대했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 새로 얻은 백팩을 학교에서 쓸 일에 대한 \u003cb class=\"key\">기대\u003c/b>를 나타내요. 'look forward to'는 '~을 \u003cb class=\"key\">기대하다\u003c/b>'라는 뜻으로, 어떤 일이 일어나기를 손꼽아 기다리는 느낌이에요. 그래서 백팩을 곧 써 볼 \u003cb class=\"key\">미래\u003c/b>를 상상하며 좋아했던 마음을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">look forward to + 동명사\u003c/span> : look forward to [전치사] + [동명사(using)] : \"그것을 사용하기를 기대했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (용도·목적)\u003c/span> : [for + 명사(school)] : \"학교에 (쓰려고)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I looked forward to, 나는 기대했어요. using it, 그것을 사용하기를. for school, 학교에. 이 문장 전체를 해석하면, 학교 갈 때 사용하기를 기대했어요.","hl":"m"},{"n":22,"text":"이 문장은 새로 얻은 백팩을 학교에서 쓸 일에 대한 기대를 보여 줘요. 백팩이 마음에 들었으니까 빨리 써 보고 싶다는 마음이 담겨 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 짚을 포인트는 look forward to 뒤에 나온 to가 부정사가 아니라 전치사라는 거예요. 전치사 뒤에는 동사 원형이 아니라 동명사가 와서 using이 되는 거죠. 그래서 '~하기를 기대하다'는 항상 look forward to 다음에 동명사를 쓴다고 기억해 두세요. 두 번째로 for school에서 for는 학교라는 용도, 즉 목적을 나타내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날은\u003c/span>\u003cspan class=\"en\">That day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훌륭한 경험이었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그날은 제게 훌륭한 경험이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 백팩을 얻은 일을 겪은 뒤 그날 하루 전체를 돌아보는 \u003cb class=\"key\">총평\u003c/b> 문장이에요. 'a great experience'는 '훌륭한 \u003cb class=\"key\">경험\u003c/b>'이라는 뜻으로, 이 일이 화자에게 의미 있는 일이었음을 강조해요. 글의 흐름에서 앞의 구체적인 사건을 하나로 묶어 주는 \u003cb class=\"key\">마무리\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : 주어(That day) + [be동사(was)] + [주격 보어(a great experience)] : \"훌륭한 경험이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (대상)\u003c/span> : [for + 대명사(me)] : \"제게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"That day, 그날은. was a great experience, 훌륭한 경험이었어요. for me, 제게. 이 문장 전체를 해석하면, 그날은 제게 훌륭한 경험이었어요.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 백팩을 얻은 일을 겪은 뒤 그날 하루 전체를 돌아보는 총평이에요. 이 일이 화자에게 의미 있는 경험이었다는 걸 강조하면서 앞의 사건을 하나로 묶어 주는 마무리 역할을 하죠.","hl":"mn"},{"n":26,"text":"첫 번째로 was 뒤에 명사 a great experience가 와서 주어를 설명하는 주격 보어 역할을 해요. be동사는 주어와 보어를 등호로 이어 준다고 생각하면 쉬워요. 두 번째로 for me는 '제게'라는 대상, 즉 누구에게 그런 경험이었는지를 알려 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 멋진 백팩을 구했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cool \u003c/span>\u003cspan class=\"tgt\">backpack\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 전혀 쓰지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">spending\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 돈을 전혀 쓰지 않고 멋진 백팩을 구했어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장에서 'get'은 '사다'가 아니라 '\u003cb class=\"key\">얻다\u003c/b>·구하다'라는 뜻이에요. 돈을 한 푼도 쓰지 않고 백팩을 얻었다는 점을 강조하는 \u003cb class=\"key\">감탄\u003c/b> 섞인 문장이죠. 'without + 동명사'로 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 얻었다는 사실을 멋지게 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : 주어(I) + [타동사(got)] + [목적어(a cool backpack)] : \"저는 멋진 백팩을 구했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : [without + 동명사(spending) + 목적어(any money)] : \"돈을 전혀 쓰지 않고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">any의 쓰임(부정 의미)\u003c/span> : [any + 불가산명사(money)] : \"어떤 돈도 (쓰지 않고)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I got a cool backpack, 저는 멋진 백팩을 구했어요. without spending any money!, 돈을 전혀 쓰지 않고. 이 문장 전체를 해석하면, 저는 돈을 전혀 쓰지 않고 멋진 백팩을 구했어요!","hl":"m"},{"n":28,"text":"이 문장은 돈을 한 푼도 쓰지 않고 백팩을 얻었다는 사실을 강조하는 감탄 섞인 표현이에요. get이 여기서는 '사다'가 아니라 '얻다, 구하다'라는 뜻으로 쓰였고, without spending any money가 비용 없이 얻었다는 걸 멋지게 보여 줘요.","hl":"mn"},{"n":29,"text":"첫 번째로 without 뒤에 spending이 온 걸 보세요. 전치사 without 뒤에는 동사가 동명사 형태로 와요. 두 번째로 any money, 부정 의미가 있는 without 뒤에서는 some 대신 any를 쓴다는 것도 꼭 기억해요. 세 번째로 got은 '얻다, 구하다'라는 타동사라서 뒤에 목적어 a cool backpack이 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 경험은\u003c/span>\u003cspan class=\"en\">This experience\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 제게 생각하게 만들었어요\u003c/span>\u003cspan class=\"en\">also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 제 것을 공유해야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">share \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">others, \u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 경험은 또한 제게 저 역시도 다른 사람들과 제 것을 공유해야겠다고 생각하게 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 마지막에서 경험을 통해 얻은 \u003cb class=\"key\">교훈\u003c/b>을 정리하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 물건을 그냥 얻은 데서 끝나지 않고, 다른 사람과 \u003cb class=\"key\">나눔\u003c/b>을 실천하겠다는 다짐으로 글을 마무리하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make의 목적격 보어(동사원형)\u003c/span> : make + [목적어] + [동사원형] (~를 …하게 만들다) : \"제게 생각하게 만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(think의 목적어)\u003c/span> : think + [that + 주어 + 동사 ~] (that절 전체가 목적어) : \"저 역시도 다른 사람들과 제 것을 공유해야 한다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 should (당위)\u003c/span> : should + [동사원형] (~해야 한다) : \"공유해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This experience, 이 경험은. also made me think, 또한 제게 생각하게 만들었어요. that I should share my things, 제가 제 것을 공유해야 한다고. with others, too, 다른 사람들과도. 이 문장 전체를 해석하면, 이 경험은 또한 제게 저 역시도 다른 사람들과 제 것을 공유해야겠다고 생각하게 만들었어요.","hl":"m"},{"n":31,"text":"이 문장은 글의 마지막에서 경험을 통해 얻은 교훈을 정리하는 결론 문장이에요. 물건을 그냥 얻은 데서 끝나지 않고, 다른 사람과 나눔을 실천하겠다는 다짐으로 글을 마무리하고 있죠. 그래서 지문 전체의 주제를 잡을 때 아주 중요한 문장이에요.","hl":"mn"},{"n":32,"text":"어법 포인트 순서대로 짚어 볼게요. 첫 번째는 사역동사 make예요. make는 목적어 뒤에 동사원형을 쓰는 동사라서 made me think처럼 to 없이 think가 그대로 온다는 점 꼭 기억하세요. 두 번째는 that이에요. think 뒤에 온 that은 접속사이고, 뒤에 완전한 문장이 와서 명사절을 만들어요. 그 명사절 전체가 think의 목적어 역할을 하는 거죠. 세 번째는 should예요. should는 해야 한다는 당위의 뜻을 가진 조동사이고, 뒤에는 항상 동사원형이 옵니다. 그래서 should share라고 쓴 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 어떤 사람에게서 \u003cb class=\"key\">백팩\u003c/b>을 받고 집으로 돌아갔어요.\u003c/li>\u003cli>백팩은 예전 것만큼 크지는 않았지만 \u003cb class=\"key\">상태\u003c/b>가 아주 좋았고 색깔도 맘에 들었어요.\u003c/li>\u003cli>화자는 돈을 전혀 쓰지 않고 멋진 백팩을 얻은 그날을 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">경험\u003c/b>으로 기억해요.\u003c/li>\u003cli>그 경험은 화자에게 다른 사람들과 \u003cb class=\"key\">나눔\u003c/b>을 실천해야겠다는 생각을 하게 만들었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A backpack I got for free taught me that I should share my things with others, too.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">화자는 어떤 사람에게서 멋진 \u003cb class=\"key\">백팩\u003c/b>을 돈을 들이지 않고 얻고, 그 상태와 색깔에 만족하며 학교에서 쓰기를 기대했어요. 그날의 훌륭한 \u003cb class=\"key\">경험\u003c/b>은 저 역시 다른 사람들과 제 것을 \u003cb class=\"key\">공유\u003c/b>해야겠다는 생각을 하게 만들었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 글 정리해 볼게요. 화자는 이웃에게서 백팩을 받고, 그 상태와 색깔에 만족하며 학교에서 쓰기를 기대했어요. 돈을 한 푼도 쓰지 않고 멋진 백팩을 얻은 그날은 화자에게 훌륭한 경험이었죠. 그리고 그 경험은 다른 사람들과 자기 것을 나누어야겠다는 생각으로 이어졌어요. 오늘도 수고 많았어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
