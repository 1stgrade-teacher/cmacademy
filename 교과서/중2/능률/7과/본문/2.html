@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 능률(김) 7과 본문2","audioDir":"2_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>능률(김)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>My First Bike-Sharing Ride in the City\u003c/h1>\u003ch2>도시에서의 나의 첫 자전거 공유 이용기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>글쓴이는 버스 대신 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>을 이용하여 공원에 갔으며, 이용이 쉬울 뿐만 아니라 \u003cb class=\"key\">환경\u003c/b>에 도움을 주어 기뻤다고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>I rode a shared bike to the park easily and was happy to help the environment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간 도서 중 두 번째 지문 속으로 함께 들어가 볼까요. 오늘은 자전거 공유 시스템을 이용해 공원에 다녀온 일화를 담은 글을 만나볼게요. 자전거를 빌리는 방법과 환경 보호의 보람을 어떻게 표현했는지 함께 살펴봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 도시에서는 교통 체증을 줄이고 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>를 실천하기 위해 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">시스템\u003c/b> (Bike-sharing system)을 적극적으로 도입하고 있다. 이는 스마트폰 \u003cb class=\"key\">앱\u003c/b> (App)을 통해 누구나 쉽게 자전거를 빌리고 반납할 수 있는 친환경 \u003cb class=\"key\">대중교통\u003c/b> 서비스이다. 마치 도서관에서 책을 빌려 읽고 제자리에 꽂아두듯, 시민들이 자전거를 공동으로 이용하는 공유 경제 \u003cb class=\"key\">소비\u003c/b>의 한 형태라고 볼 수 있다. 이러한 시스템은 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">배출량\u003c/b>을 줄이면서 개인의 건강까지 챙길 수 있는 스마트한 도시 생활의 필수 \u003cb class=\"key\">인프라\u003c/b>로 자리 잡고 있다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경 지식을 넓혀볼게요. 요즘 도시에서는 환경을 지키고 교통 체증을 줄이기 위해 자전거 공유 시스템을 많이 도입하고 있어요. 스마트폰 앱으로 누구나 쉽게 빌릴 수 있는 친환경 대중교통 서비스랍니다. 마치 도서관에서 책을 빌려 읽고 제자리에 꽂아두듯 공동으로 이용하는 공유 경제의 한 형태라고 보면 돼요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이동 수단 선택\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글쓴이는 공원에 가기 위해 버스를 타는 대신 \u003cb class=\"key\">자전거를 \u003c/b>\u003cb class=\"key\">빌리기로\u003c/b> 마음먹었다. 자신이 사는 도시에 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>이 잘 갖추어져 있었기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이용 방법 설명\u003csmall>근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>앱이 있는 사람이면 누구나 \u003cb class=\"key\">쉽게 \u003c/b>\u003cb class=\"key\">자전거를 \u003c/b>\u003cb class=\"key\">빌릴 \u003c/b>\u003cb class=\"key\">수\u003c/b> 있다. 먼저 사용하고 싶은 자전거를 골라 \u003cb class=\"key\">QR \u003c/b>\u003cb class=\"key\">코드를 \u003c/b>\u003cb class=\"key\">스캔하면\u003c/b> 잠금이 해제되는 방식이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>점검과 출발\u003csmall>예시 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>출발하기 전 혹시 모를 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">불량\u003c/b>에 대비해 자전거를 꼼꼼히 점검했다. 다행히 모든 것이 괜찮아 보여서 \u003cb class=\"key\">공원으로 \u003c/b>\u003cb class=\"key\">향했다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반납과 소감\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>공원에 도착해 대여소에 \u003cb class=\"key\">자전거를 \u003c/b>\u003cb class=\"key\">반납했고\u003c/b>, 이용이 정말 쉬웠을 뿐만 아니라 \u003cb class=\"key\">환경에 \u003c/b>\u003cb class=\"key\">도움을 \u003c/b>\u003cb class=\"key\">주어\u003c/b> 기뻤다고 소감을 밝힌다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 자전거를 이용해 공원에 다녀온 일화가 시간 순서대로 아주 잘 드러나 있어요.","hl":null},{"n":4,"text":"첫 번째 구간인 첫 번째 문장에서 세 번째 문장까지는 공원에 가기 위해 버스 대신 자전거 공유 시스템을 선택한 과정이 나와요.","hl":"f0"},{"n":5,"text":"두 번째 구간인 네 번째 문장에서 일곱 번째 문장까지는 앱을 켜고 QR 코드를 스캔해서 자전거를 쉽게 빌리는 구체적인 방법을 설명하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 구간인 여덟 번째 문장에서 열 번째 문장까지는 출발하기 전에 자전거 상태를 꼼꼼히 점검하고 안전하게 공원으로 향하는 모습이 담겨 있어요.","hl":"f2"},{"n":7,"text":"네 번째 구간인 열한 번째 문장에서 열세 번째 문장까지는 공원에 자전거를 반납하고 이용이 쉬웠던 점과 환경에 도움을 주어 기뻤다는 소감을 전하고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 공원에 가기로 결심한 순간부터 자전거를 빌리고, 점검하고, 반납하여 소감을 느끼기까지의 과정을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서대로\u003c/b> 전개하고 있다. 글의 초반부와 중반부에서 자전거 공유 시스템의 이용 과정을 설명한 뒤, \u003cb class=\"key\">마지막 \u003c/b>\u003cb class=\"key\">13번 \u003c/b>\u003cb class=\"key\">문장\u003c/b>에서 이용의 편리함과 환경적 보람이라는 최종 소감을 밝히며 마무리하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The next day (1)\u003c/b>\u003cspan>시간 흐름\u003c/span>\u003cb>instead of (2)\u003c/b>\u003cspan>대조 및 선택\u003c/span>\u003cb>First (5)\u003c/b>\u003cspan>순서 제시\u003c/span>\u003cb>Then (6)\u003c/b>\u003cspan>순서 제시\u003c/span>\u003cb>Before (8)\u003c/b>\u003cspan>시간 흐름\u003c/span>\u003cb>Also (13)\u003c/b>\u003cspan>추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bike-sharing system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\  headed for the park.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번에는 모든 게 괜찮아 보여서, 저는 공원으로 향했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 자전거를 꼼꼼히 점검한 결과 이상이 없음을 확인하고, \u003cb class=\"key\">공원\u003c/b>으로 출발하는 상황을 나타냅니다. 상태를 나타내는 동사 \u003cb class=\"key\">look\u003c/b>과 방향을 나타내는 표현이 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사\u003c/span> : look [감각동사] + 형용사 [보어] : \"~해 보이 다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This time, 이번에는. everything looked fine, 모든 게 괜찮아 보여서. so, 그래서. I headed for the park, 저는 공원으로 향했어요.. 이 문장 전체를 해석하면, 이번에는 모든 게 괜찮아 보여서, 저는 공원으로 향했어요.","hl":"m"},{"n":40,"text":"이번에는 모든 게 괜찮아 보여서, 저는 공원으로 향했어요 라는 뜻이에요. 자전거 점검을 끝내고 문제없이 공원으로 출발하는 상황을 보여주죠.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 감각동사 look이에요. 주어의 상태를 설명할 때는 look 뒤에 부사 대신 형용사 보어가 와야 한다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기에 도착해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">there,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 자전거를 반납했어요\u003c/span>\u003cspan class=\"en\">I returned the bike\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원에 있는 대여소에\u003c/span>\u003cspan class=\"en\">to a station in the park.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 목적지인 공원에 도착한 뒤, 빌렸던 \u003cb class=\"key\">자전거\u003c/b>를 지정된 \u003cb class=\"key\">대여소\u003c/b>에 반납하는 행동을 설명합니다. 시간 접속사 \u003cb class=\"key\">When\u003c/b>이 자연스럽게 상황을 연결해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사절\u003c/span> : When [접속사] + 주어 + 동사 : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When I got there, 거기에 도착해서. I returned the bike, 저는 자전거를 반납했어요. to a station in the park, 공원에 있는 대여소에. 이 문장 전체를 해석하면, 거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요.","hl":"m"},{"n":43,"text":"거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요 라는 뜻이에요. 공원에 무사히 도착해서 자전거를 돌려주는 모습을 나타내죠.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 시간의 접속사 When이에요. 문장의 앞이나 뒤에서 특정한 때를 나타내며 절을 이끌어준다는 것을 잘 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거를 이용하는 건\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Using \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bike\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이었다\u003c/span>\u003cspan class=\"en\">was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 쉬웠어요.\u003c/span>\u003cspan class=\"en\">really easy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자전거를 이용하는 건 정말 쉬웠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공유 자전거 시스템을 직접 이용해 본 \u003cb class=\"key\">소감\u003c/b>을 솔직하게 표현하고 있습니다. 동명사구가 주어로 쓰여 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">이용\u003c/b>의 편리함을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Using [동명사] + 목적어 : \"자전거를 이용하는 것\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Using the bike, 자전거를 이용하는 건. was, ~이었다. really easy, 정말 쉬웠어요.. 이 문장 전체를 해석하면, 자전거를 이용하는 건 정말 쉬웠어요.","hl":"m"},{"n":46,"text":"자전거를 이용하는 건 정말 쉬웠어요 라는 뜻이에요. 앱을 통한 대여부터 반납까지의 과정이 아주 편리했음을 드러내죠.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 동명사 주어예요. 동사원형에 ing를 붙여서 자전거를 이용하는 것이라는 주어로 만들었으며, 단수 취급하므로 was를 쓴다는 점을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 기뻤어요\u003c/span>\u003cspan class=\"en\">I was happy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에 도움이 되어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> the environment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 저는 환경에 도움이 되어서 기뻤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자전거를 이용하면서 느낀 긍정적인 감정을 \u003cb class=\"key\">감정의 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 나타내는 to부정사와 함께 표현하고 있어요. 앞서 자전거 이용이 편리했다고 한 것에 이어, 환경까지 보호할 수 있었다는 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">장점\u003c/b>을 말하며 글을 마무리하는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">투부정사의 부사적 용법(감정의 원인)\u003c/span> : [be동사] + [형용사] + [to부정사(동사원형~)] : \"~해서, ~하게 되어\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Also, 또한. I was happy, 저는 기뻤어요. to help the environment, 환경에 도움이 되어서. 이 문장 전체를 해석하면, 또한 저는 환경에 도움이 되어서 기뻤어요.","hl":"m"},{"n":49,"text":"자전거를 타고 나서 느낀 최종적인 만족감을 나타내는 문장이에요. 편리함뿐만 아니라 환경 보호에도 기여했다는 점에서 뿌듯함을 느끼고 있어요.","hl":"mn"},{"n":50,"text":"이 문장에서 가장 중요한 어법은 바로 투부정사의 부사적 용법이에요. 문장 앞부분에 happy라는 감정 형용사가 나와 있잖아요. 그 감정의 원인이 무엇인지 설명하기 위해서 to help라는 투부정사를 바로 이어서 쓰고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글쓴이는 버스 대신 자전거 공유 시스템을 이용해 공원에 가기로 결심했다.\u003c/li>\u003cli>앱을 통해 원하는 자전거를 고르고 QR 코드를 스캔하여 쉽게 대여할 수 있다.\u003c/li>\u003cli>출발 전 자전거 상태를 꼼꼼히 점검한 뒤 안전하게 공원으로 향했다.\u003c/li>\u003cli>자전거를 공원 대여소에 반납했고 이용이 쉬울 뿐만 아니라 환경에도 도움을 주어 기뻤다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>I rode a shared bike to the park easily and was happy to help the environment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">글쓴이는 버스 대신 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>을 이용하여 공원에 갔으며, 이용이 쉬울 뿐만 아니라 \u003cb class=\"key\">환경\u003c/b>에 도움을 주어 기뻤다고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘도 수고 많았어요. 자전거 공유 시스템을 이용한 경험을 담은 이 글의 흐름과 핵심 표현들을 다시 한번 꼼꼼히 복습해 보세요. 우리는 다음 강의에서 또 만나요.","hl":null}]}]});</script></body></html>
