<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 능률(김) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 능률(김) 7과 본문1","audioDir":"1_audio","preview":false,"count":62,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>능률(김)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Jimin's Experience with the Sharing Economy\u003c/h1>\u003ch2>지민이의 공유 경제 경험\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 지민이는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b> 앱을 통해 돈을 쓰지 않고 새것 \u003cb class=\"key\">중고 \u003c/b>\u003cb class=\"key\">물품\u003c/b>인 백팩을 얻은 \u003cb class=\"key\">경험\u003c/b>을 소개하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jimin shares her positive experience of getting a nice secondhand backpack through a sharing app.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간엔 능률 김성곤 중학교 이학년 영어 일곱 번째 단원 본문을 같이 공부할 거예요. 지민이가 스마트폰 앱을 통해 물건을 나누어 쓴 따뜻한 경험을 다룬 글이죠. 글의 전체적인 요약과 요지를 함께 완벽하게 정복해 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시):\n우리가 일상에서 자주 쓰는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>는 영어로 \u003cb class=\"key\">sharing \u003c/b>\u003cb class=\"key\">economy\u003c/b>라고 해요. 이는 물건을 소유하지 않고 여러 사람이 함께 나눠 쓰는 경제 시스템을 의미해요. 마치 거실에 있는 커다란 소파를 가족 모두가 함께 사용하는 것과 비슷하죠. 이 방식을 이용하면 \u003cb class=\"key\">자원\u003c/b>과 \u003cb class=\"key\">돈\u003c/b>을 \u003cb class=\"key\">절약\u003c/b>할 수 있어요. 또한 불필요한 생산을 줄여주기 때문에 \u003cb class=\"key\">환경\u003c/b> 보호에도 큰 도움이 돼요. 최근에는 스마트폰 앱을 통해 주변 사람들과 쉽게 물건을 나누는 \u003cb class=\"key\">중고 \u003c/b>\u003cb class=\"key\">거래\u003c/b>가 활발해지고 있어요.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 먼저 쌓아볼게요. 우리가 일상에서 자주 접하는 공유 경제는 영어로 sharing economy라고 불러요. 물건을 혼자 소유하지 않고 여러 사람이 함께 나눠 쓰는 시스템인데 마치 거실 소파를 가족이 같이 쓰는 것과 같죠. 이렇게 하면 자원과 돈을 절약할 뿐만 아니라 환경 보호에도 큰 도움이 돼요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 경험 소개\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>지민이는 독자들에게 물건을 공유해 본 적이 있는지 질문을 던지며 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 개념을 꺼내요. \u003cb class=\"key\">공유\u003c/b>는 자원과 돈을 절약해 주고 \u003cb class=\"key\">환경\u003c/b>에도 좋다는 장점이 있어요. 이어서 글쓴이 자신의 생생한 \u003cb class=\"key\">경험\u003c/b>을 들려주겠다고 예고해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>앱 활용과 물건 발견\u003csmall>전개 · 문장 5–10\u003c/small>\u003c/h4>\u003cp>지난주에 지민이는 백팩을 구하기 위해 스마트폰 \u003cb class=\"key\">앱\u003c/b>을 이용했어요. 이 앱은 사용자들이 \u003cb class=\"key\">중고 \u003c/b>\u003cb class=\"key\">물품\u003c/b>을 쉽게 사고팔거나 필요 없는 물건을 나눠주도록 도와줘요. 그곳에서 아주 상태가 새것 같은 멋진 백팩을 무료로 \u003cb class=\"key\">나눔\u003c/b>하는 게시물을 보게 되었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>만남 약속과 마무리\u003csmall>결론 · 문장 11–19\u003c/small>\u003c/h4>\u003cp>마음에 드는 물건을 발견한 지민이는 즉시 게시글 올린 사람에게 \u003cb class=\"key\">메시지\u003c/b>를 보냈어요. 서로 대화를 나누어 다음 날 오후에 중앙공원에서 만나기로 \u003cb class=\"key\">약속\u003c/b>을 잡았죠. 결국 지민이는 성공적으로 백팩을 얻게 되며 \u003cb class=\"key\">나눔\u003c/b>을 실천해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 문장부터 마지막 문장까지 전체 흐름을 차근차근 짚어볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 지민이가 자신을 소개하고 공유 경제 이야기를 꺼내요. 자전거와 책 같은 물건을 공유해 본 적이 있는지 물어보며 공유가 자원과 돈을 아껴주고 환경에도 좋다고 말하죠. 자신의 생생한 경험을 들려주겠다는 포부도 밝혀요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 앱을 활용해 물건을 발견하는 과정이에요. 지난주에 지민이는 백팩을 얻기 위해 앱을 켰는데, 이 앱은 중고 물품을 쉽게 사고팔거나 안 쓰는 물건을 나눔할 수 있게 도와주죠. 그곳에서 누군가 무료로 주는 아주 멋진 백팩을 발견해요.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계에서는 실제로 만나기로 약속을 잡는 장면이에요. 새것처럼 멀쩡한 백팩을 보고 반가운 마음에 게시글 작성자에게 메시지를 보내죠. 내일 오후 세 시에 중앙공원에서 만나기로 약속하며 훈훈하게 이야기가 마무리돼요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 \u003cb class=\"key\">전개방식\u003c/b>은 먼저 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b>의 장점을 말한 뒤 자신의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 풀어내는 \u003cb class=\"key\">두괄식\u003c/b> 구조예요. 처음에 \u003cb class=\"key\">공유\u003c/b>의 유익함을 주장하고, 뒤이어 앱을 통한 \u003cb class=\"key\">백팩 \u003c/b>\u003cb class=\"key\">나눔\u003c/b> 과정을 예시로 들어 그 주장을 뒷받침하고 있어요. 따라서 글 전체의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 파악하기에 매우 명확한 구조랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (11)\u003c/b>\u003cspan>인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">sharing economy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">app\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">secondhand items\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">backpack\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sharing\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개방식은 먼저 공유 경제의 유익함을 말하고 자신의 구체적인 백팩 나눔 경험을 뒤에 붙인 두괄식 구조예요. 주장이나 장점을 맨 앞에 제시하고 이를 뒷받침하는 일화나 예시를 뒤에서 보여주는 아주 깔끔한 형태랍니다.","hl":"ty"},{"n":8,"text":"글 속의 장치들도 눈여겨봐야 해요. 열한 번째 문장 앞에 등장하는 So라는 단어는 앞서 새것 같은 백팩을 발견했다는 원인에 이어 메시지를 보냈다는 결과를 이어주는 아주 중요한 인과관계 신호어랍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여태껏, 지금까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>economy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경제\u003c/span>\u003c/div>\u003cdiv>\u003cb>backpack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>백팩, 등낭\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 하다, 허락하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>secondhand\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중고의\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물품, 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게시물\u003c/span>\u003c/div>\u003cdiv>\u003cb>nice\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 좋은\u003c/span>\u003c/div>\u003cdiv>\u003cb>give away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나눠주다, 기부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>message\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메시지\u003c/span>\u003c/div>\u003cdiv>\u003cb>sure\u003c/b>\u003cem>부사\u003c/em>\u003cspan>물론이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중앙의\u003c/span>\u003c/div>\u003cdiv>\u003cb>p.m.\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오후\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에 나온 핵심 단어들을 몇 가지 짚어볼게요. 먼저 resource는 자원이라는 뜻이고요. environment는 우리가 사는 환경을 의미해요. 그리고 물건을 무료로 건네준다는 표현인 give away도 시험에 아주 잘 나오니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">공유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"s\">distribute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">절약하다, 구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">reserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">waste\u003c/span>\u003cspan class=\"a\">spend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">~하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\"> forbid\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">secondhand\u003c/b>\u003cspan class=\"m\">중고의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">used\u003c/span>\u003cspan class=\"s\">pre-owned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003cspan class=\"a\">brand-new\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">nice\u003c/b>\u003cspan class=\"m\">멋진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">good\u003c/span>\u003cspan class=\"s\">great\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bad\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 볼게요. 먼저 물건을 나눠 쓴다는 share는 나누다라는 뜻의 divide와 바꿔 쓸 수 있어요. 그리고 절약하다라는 save는 낭비하다라는 waste가 반대말이 되고, 중고의라는 secondhand는 새로운이라는 new가 반대말이 되니 확실히 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요,\u003c/span>\u003cspan class=\"en\">Hello,\u003c/spa 003c/span>\u003cspan class=\"gn\">현재완료 시제의 경험 용법\u003c/span> : have/has [조동사] + [p.p. (과거분사)] : \"~해본 적이 있다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Have you ever, 여러분은 ~해본 적이 있나요?. shared, 공유한. things like, ~같은 물건을. bikes, books, or toys?, 자전거, 책, 혹은 장난감. 이 문장 전체를 해석하면, 여러분은 자전거, 책, 혹은 장난감 같은 물건을 공유해본 적이 있나요?","hl":"m"},{"n":14,"text":"두 번째 문장이에요. 본격적인 이야기를 시작하기 전에 독자들에게 질문을 던져서 공유에 대한 경험을 떠올리게 만들고 있죠.","hl":"mn"},{"n":15,"text":"두 번째 문장에서 가장 중요한 어법은 Have you ever shared예요. 과거부터 지금까지의 경험을 나타내는 현재완료 시제인데, ever가 들어가서 자전거 같은 것을 빌려 써본 적이 있는지 물어보는 표현이 완성되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공유는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sharing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절약해 주고,\u003c/span>\u003cspan class=\"en\">saves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자원과 돈을\u003c/span>\u003cspan class=\"en\">resources and money,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 돼요\u003c/span>\u003cspan class=\"en\">it is good for\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에\u003c/span>\u003cspan class=\"en\">the environment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공유는 자원과 돈을 절약해 주고, 환경에 도움이 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공유 경제가 왜 좋은지 그 \u003cb class=\"key\">이유\u003c/b>와 \u003cb class=\"key\">장점\u003c/b>을 자원, 돈, 환경이라는 세 가지 측면에서 명확하게 설명하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan cl ckpack?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요, 제가 그 백팩을 가져도 될까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주민이가 백팩을 나눔해 주는 사람에게 정중하게 \u003cb class=\"key\">허락을 \u003c/b>\u003cb class=\"key\">구하는\u003c/b> 직접 화법의 대사예요. 조동사 can을 사용하여 상대방에게 물건을 받을 수 있는지 공손하게 질문하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 의문문\u003c/span> : Can + 주어 + 동사원형? : \"~해도 될까요?\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Hello, 안녕하세요. can, ~해도 될까요. I, 제가. get, 가져도. the backpack?, 그 백팩을. 이 문장 전체를 해석하면, 안녕하세요, 제가 그 백팩을 가져도 될까요?","hl":"m"},{"n":43,"text":"마음에 드는 가방을 찾은 주민이가 게시물을 올린 사람에게 채팅으로 물건을 받을 수 있는지 공손하게 물어보는 대화예요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 조동사 can을 이용한 의문문이에요. 주어 앞으로 can을 보내서 허락을 구하는 표현을 만들고, 뒤에는 동사원형 get을 썼다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론이죠.\u003c/span>\u003cspan class=\"en\">Sure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론이죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지민이가 Central Park에서 만나자고 제안한 \u003cb class=\"key\">요청\u003c/b>에 대해 흔쾌히 수락하는 \u003cb class=\"key\">대답\u003c/b>을 나타내는 표현이에요.\u003c/div>","segs":[{"n":45,"text":"Sure, 물론이죠.. 이 문장 전체를 해석하면, 물론이죠.","hl":"m"},{"n":46,"text":"상대의 제안에 기꺼이 응하는 표현이에요. 앞 문장의 만남 제안에 대해 당연하다는 듯이 수락하는 말을 건네고 있어요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘됐어요!\u003c/span>\u003cspan class=\"en\">Great!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잘됐어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방이 물품 거래 제안을 수락해주어 \u003cb class=\"key\">기쁜 \u003c/b>\u003cb class=\"key\">마음\u003c/b>과 \u003cb class=\"key\">반가움\u003c/b>을 나타내는 감탄 표현이에요.\u003c/div>","segs":[{"n":47,"text":"Great!, 잘됐어요!. 이 문장 전체를 해석하면, 잘됐어요!","hl":"m"},{"n":48,"text":"상대방이 만남을 수락하자 지민이가 느끼는 반가움과 기쁨을 솔직하게 드러내는 감탄사예요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져갈 수 있나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">it?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떻게 가져갈 수 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무료 나눔받을 백팩을 상대방으로부터 \u003cb class=\"key\">어떤 \u003c/b>\u003cb class=\"key\">방법\u003c/b>으로 수령할 수 있는지 물어보는 \u003cb class=\"key\">의문문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 있는 의문문\u003c/span> : How + [조동사 can] + [주어 I] + [동사원형 get] + [목적어 it]? : \"어떻게 그것을 얻을 수 있나요?\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"How, 어떻게. can I get it?, 가져갈 수 있나요?. 이 문장 전체를 해석하면, 어떻게 가져갈 수 있나요?","hl":"m"},{"n":50,"text":"물건을 실제로 어떻게 건네받을지 방법을 묻는 질문이에요. 서로 시간을 정해 직접 만나기로 약속하는 계기가 되는 문장이지요.","hl":"mn"},{"n":51,"text":"첫 번째 포인트는 방법을 묻는 의문사 How예요. 두 번째 포인트는 How 바로 뒤에 조동사 can과 주어 I, 그리고 동사원형 get이 이어지는 의문문 어순 구조라는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오실 수 있나요?\u003c/span>\u003cspan class=\"en\">Can you come\u003c/span>\u003c/div>\u003cdiv class=\" \u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 뵐게요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 약속이 최종적으로 성사된 후, 정해진 \u003cb class=\"key\">만날 \u003c/b>\u003cb class=\"key\">시간\u003c/b>에 다시 보자는 \u003cb class=\"key\">작별 \u003c/b>\u003cb class=\"key\">인사\u003c/b>를 전하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will의 미래 표현\u003c/span> : I + will + 동사원형 : \"~할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":56,"text":"I'll see you, 뵐게요.. then, 그때. 이 문장 전체를 해석하면, 그때 뵐게요.","hl":"m"},{"n":57,"text":"약속을 마무리하면서 정해진 시간에 만나자는 인사를 건네는 장면이에요.","hl":"mn"},{"n":58,"text":"첫 번째 어법 포인트는 I'll see you then에서 조동사 will이에요. I will의 줄임말인 I'll을 써서 미래의 일을 나타내고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감사합니다\u003c/span>\u003cspan class=\"en\">Thank\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">!\u003c/span>\u003cspan class=\"en\">you!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">감사합니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방과 거래 약속을 잡은 후, 도움을 준 것에 대해 고마움을 표현하는 \u003cb class=\"key\">인사말\u003c/b>입니다. 일상 대화에서 자연스럽게 쓰이는 \u003cb class=\"key\">감사의 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 글의 흐름을 훈훈하게 마무리합니다.\u003c/div>","segs":[{"n":59,"text":"Thank, 감사합니다. you!, !. 이 문장 전체를 해석하면, 감사합니다!","hl":"m"},{"n":60,"text":"열아홉 번째 문장이에요. 상대방과 만나서 물건을 받기로 약속을 잡은 뒤에 고마움을 전하는 인사말이랍니다.","hl":"mn"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 일치/불일치\u003c/span>\u003cspan class=\"lp-pill\">정답 지민이는 앱을 통해 새 백팩을 돈을 주고 샀다.\u003c/span>\u003cdiv style=\"margin-top:8px\">지민이는 앱을 통해 새 백팩을 돈을 주고 산 것이 아니라 누군가 \u003cb class=\"key\">give \u003c/b>\u003cb class=\"key\">away\u003c/b>하는, 즉 무료로 나눠주는 백팩을 얻은 것이에요. 지문에서 누군가가 백팩을 \u003cb class=\"key\">give \u003c/b>\u003cb class=\"key\">away\u003c/b>하고 있었고 그것이 새것 같아 보여서 메시지를 보냈다고 했죠. 따라서 돈을 주고 샀다는 내용은 \u003cb class=\"key\">지문 \u003c/b>\u003cb class=\"key\">내용\u003c/b>과 일치하지 않아요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>지민이는 공유 경제 앱을 통해 백팩을 구했다.\u003c/li>\u003cli>그 앱은 사용자들이 중고 물품을 쉽게 사고팔 수 있게 해준다.\u003c/li>\u003cli>지민이는 내일 오후 삼 시에 중앙공원에서 만나기로 했다.\u003c/li>\u003cli>백팩은 새것처럼 괜찮아 보였다.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":61,"text":"이번 지문과 관련된 문제 풀이를 해볼게요. 지민이가 앱을 통해 새 백팩을 돈을 주고 샀다는 보기가 나오면 그것은 틀린 내용이에요. 지민이는 돈을 주고 산 것이 아니라 누군가 give away하는 백팩을 무료로 얻은 것이므로 이 점을 꼭 기억해야 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>공유는 \u003cb class=\"key\">자원\u003c/b>과 돈을 절약하며 환경에도 이롭다.\u003c/li>\u003cli>지민이는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b> 앱을 통해 백팩을 구하고자 했다.\u003c/li>\u003cli>그 앱은 \u003cb class=\"key\">중고 \u003c/b>\u003cb class=\"key\">물품\u003c/b>을 쉽게 사고팔거나 나눌 수 있게 해준다.\u003c/li>\u003cli>지민이는 무료로 나눔하는 새것 같은 백팩을 얻기로 \u003cb class=\"key\">약속\u003c/b>했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jimin shares her positive experience of getting a nice secondhand backpack through a sharing app.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 지민이는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">경제\u003c/b> 앱을 통해 돈을 쓰지 않고 새것 \u003cb class=\"key\">중고 \u003c/b>\u003cb class=\"key\">물품\u003c/b>인 백팩을 얻은 \u003cb class=\"key\">경험\u003c/b>을 소개하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":62,"text":"오늘 이렇게 지민이의 즐거운 공유 앱 사용기를 함께 공부해 보았어요. 공유 경제의 개념과 글의 흐름을 머릿속에 잘 담아두면 어떤 문제가 나와도 쉽게 풀 수 있을 거예요. 수고 많았고 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
