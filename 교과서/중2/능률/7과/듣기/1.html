  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

lecturePlayer(document.getElementById("app"),{"brand":"A Listen and Check (1)","title":"중2 능률 7과 Listen and Check (1)","audioDir":"1_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">선호하는 것 묻고 답하기\u003c/div>\u003ch1>중2 능률 7과 대화문 해설 - 선호 묻고 답하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>지수가 양말 가게에서 양말을 고르고 있고, 친구가 어떤 양말이 마음에 드는지 물어본다. 지수는 빨간 하트가 있는 양말 중에서 짧은 것보다 긴 것을 더 선호한다고 말하고 그 양말을 사기로 한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 능률 교과서 칠과 대화문을 함께 공부해 볼 거예요. 지수라는 여학생이 양말 가게에서 양말을 고르고 있는 상황이에요. 친구가 어떤 양말을 좋아하는지 물어보고, 지수는 긴 양말을 고르죠. 오늘은 선호를 묻고 답하는 표현을 확실하게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cdiv class=\"d-en\">B Jisu, what are you doing?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-1\">\u003cdiv class=\"d-en\">G I'm looking at socks. I want to buy a pair.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cdiv class=\"d-en\">B Which ones do you like?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cdiv class=\"d-en\">G I like the ones with the red hearts, but there are two types.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cdiv class=\"d-en\">B Which do you prefer, the short ones or the long ones?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cdiv class=\"d-en\">G Um… I prefer the long ones to the short ones. So, I'll take this pair.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"B Jisu, what are you doing?","hl":"r-0"},{"n":3,"text":"G I'm looking at socks. I want to buy a pair.","hl":"r-1"},{"n":4,"text":"B Which ones do you like?","hl":"r-2"},{"n":5,"text":"G I like the ones with the red hearts, but there are two types.","hl":"r-3"},{"n":6,"text":"B Which do you prefer, the short ones or the long ones?","hl":"r-4"},{"n":7,"text":"G Um… I prefer the long ones to the short ones. So, I'll take this pair.","hl":"r-5"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">선호하는 것 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Which do you prefer, A or B?\u003c/div>\u003cdiv class=\"d-mean\">A와 B 중 어떤 것을 더 선호하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: B Which do you prefer, the short ones or the long ones?\u003c/div>\u003cdiv class=\"d-exp\">상대가 \u003cb class=\"key\">선호\u003c/b>하는 것을 물을 때 쓰는 표현이에요. 두 가지를 \u003cb class=\"key\">A or B\u003c/b>로 나란히 놓고 어떤 쪽이 더 좋은지 정중하게 묻습니다. 고르는 대상이 복수 명사이면 \u003cb class=\"key\">Which ones\u003c/b> do you prefer?처럼 ones를 써서 물을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Which do you like better, A or B?\u003c/li>\u003cli>Which do you like more, A or B?\u003c/li>\u003cli>Which one do you prefer, A or B?\u003c/li>\u003cli>Do you prefer A or B?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I prefer A to B.\u003c/li>\u003cli>I like A better than B.\u003c/li>\u003cli>I like A more than B.\u003c/li>\u003cli>Either one is fine with me.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"먼저 선호하는 것을 묻는 표현을 볼게요. Which do you prefer, A or B? 는 A와 B 중 어떤 것을 더 선호하니? 라는 뜻이에요. 두 가지를 나란히 놓고 정중하게 묻는 표현이죠. 대화에서는 Which do you prefer, the short ones or the long ones? 로 나왔어요.","hl":"key"},{"n":9,"text":"같은 뜻으로는 Which do you like better, A or B? 라고 할 수 있어요. Which do you like more, A or B? 도 같은 표현이에요. 조금 더 짧게 Do you prefer A or B? 라고 물어도 됩니다.","hl":"alts"},{"n":10,"text":"이렇게 물었을 때는 I prefer A to B. 라고 답해요. 나는 B보다 A를 더 선호해, 라는 뜻이죠. I like A better than B. 라고 해도 같은 뜻이고요. 둘 다 괜찮다면 Either one is fine with me. 라고 말할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">선호하는 것 말하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I prefer A to B.\u003c/div>\u003cdiv class=\"d-mean\">나는 B보다 A를 더 선호해.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: G Um… I prefer the long ones to the short ones. So, I'll take this pair.\u003c/div>\u003cdiv class=\"d-exp\">자신이 \u003cb class=\"key\">선호\u003c/b>하는 것을 말할 때 쓰는 표현이에요. \u003cb class=\"key\">prefer\u003c/b> 뒤에 비교 대상이 와도 than이 아니라 \u003cb class=\"key\">to\u003c/b>를 쓴다는 점을 꼭 기억하세요. 조금 더 쉽게 말하고 싶으면 like A better than B로 바꿔 쓸 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I like A better than B.\u003c/li>\u003cli>I like A more than B.\u003c/li>\u003cli>I'd rather have A than B.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Good choice.\u003c/li>\u003cli>Why do you prefer A?\u003c/li>\u003cli>Sounds good. Then let's take it.\u003c/li>\u003cli>Me too. I prefer A, too.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번에는 선호하는 것을 말하는 표현이에요. I prefer A to B. 는 나는 B보다 A를 더 선호해, 라는 뜻이죠. 주의할 점은 비교 대상 앞에 than이 아니라 to를 쓴다는 거예요. 대화에서는 I prefer the long ones to the short ones. 라고 말했어요.","hl":"key"},{"n":12,"text":"조금 더 쉽게 말하고 싶으면 I like A better than B. 라고 하면 됩니다. I like A more than B. 도 같은 뜻이에요. I'd rather have A than B. 라고 하면 A를 차라리 갖겠다는 느낌이 됩니다.","hl":"alts"},{"n":13,"text":"이런 말을 들었을 때는 Good choice. 라고 해 주면 자연스러워요. Why do you prefer A? 라고 이유를 물어도 좋고요. Sounds good. Then let's take it. 처럼 함께 사자고 답할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 6\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">B Jisu, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what are you doing\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">지수야, 너는 무엇을 하고 있니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">현재진행형\u003c/b> 의문문으로, 지금 하고 있는 일을 묻는 표현이에요. be동사가 \u003cb class=\"key\">주어\u003c/b> 앞으로 나가고 동사는 \u003cb class=\"key\">-ing\u003c/b> 형태가 됩니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Jisu, what are you up to?\u003c/span>\u003cspan>Jisu, what's going on?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">G \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm looking at\u003c/span> socks. I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">want to buy\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">a pair\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">나는 양말을 보고 있어. 한 켤레 사고 싶어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">현재진행형\u003c/b>으로 지금 보고 있는 중이라는 뜻이에요. \u003cb class=\"key\">look at\u003c/b>은 시선을 두고 보는 것을 말합니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">want to\u003c/b>에 동사원형을 붙여 하고 싶은 것을 나타내요. \u003cb class=\"key\">to부정사\u003c/b>를 목적어로 쓴 형태입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">a pair\u003c/b>는 짝을 이루는 물건의 한 켤레를 뜻해요. 양말이나 신발에 씁니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'm checking out socks. I'd like to buy a pair.\u003c/span>\u003cspan>I'm looking at socks. I want to get a pair.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"첫 번째 줄입니다. What are you doing? 하고 남학생이 지수에게 묻네요. 뜻은 지수야, 너는 무엇을 하고 있니? 예요. 지금 하고 있는 일을 물을 때는 be동사를 주어 앞으로 보내고 동사 뒤에 ing를 붙여요. 같은 뜻으로 What are you up to, Jisu? 라고도 말할 수 있어요.","hl":"l-0"},{"n":15,"text":"두 번째 줄입니다. I'm looking at socks. I want to buy a pair. 뜻은 나는 양말을 보고 있어. 한 켤레 사고 싶어. 예요. look at은 시선을 두고 보는 것, want to buy는 사고 싶다는 뜻이죠. a pair는 양말이나 신발처럼 짝을 이루는 물건의 한 켤레를 말해요. 조금 더 공손하게 말하고 싶으면 I'd like to buy a pair. 라고 해도 좋아요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 6\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">B \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Which ones\u003c/span> do you like?\u003c/div>\u003cdiv class=\"d-ko\">어떤 게 마음에 드니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">Which ones\u003c/b>는 여러 개 중 어떤 것인지 고를 때 쓰는 표현이에요. 앞에 나온 복수 명사 \u003cb class=\"key\">socks\u003c/b>를 대신해 \u003cb class=\"key\">ones\u003c/b>를 썼습니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which ones do you prefer?\u003c/span>\u003cspan>Which ones catch your eye?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">G I like \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">the ones with the red hearts\u003c/span>, but \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">there are two types\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">나는 빨간 하트가 있는 게 마음에 드는데, 두 가지 종류가 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">the ones\u003c/b>는 앞에 나온 복수 명사 socks를 대신하는 \u003cb class=\"key\">대명사\u003c/b>예요. \u003cb class=\"key\">with\u003c/b>는 ~이 있는, ~을 가진이라는 뜻으로 모양을 설명합니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">there are\u003c/b>는 뒤에 복수 명사가 올 때 쓰는 표현으로 ~이 있다는 뜻이에요. \u003cb class=\"key\">two types\u003c/b>는 두 가지 종류라는 말입니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'm into the ones with the red hearts, but there are two kinds.\u003c/span>\u003cspan>I like the ones with the red hearts, but there are two types.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"세 번째 줄입니다. Which ones do you like? 뜻은 어떤 게 마음에 드니? 예요. 앞에 나온 socks를 다시 말하지 않고 ones로 받았어요. Which ones do you prefer? 라고 하면 선호를 조금 더 또렷하게 묻는 표현이 됩니다.","hl":"l-0"},{"n":17,"text":"네 번째 줄입니다. I like the ones with the red hearts, but there are two types. 뜻은 나는 빨간 하트가 있는 게 마음에 드는데, 두 가지 종류가 있어. 예요. the ones는 양말을 대신하는 대명사이고, with는 빨간 하트가 있는이라는 뜻이에요. there are는 뒤에 복수 명사가 올 때 쓰는 표현이죠.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 6\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">B \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">Which do you prefer\u003c/span>, \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">the short ones or the long ones\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">짧은 것과 긴 것 중 어떤 것이 더 좋니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">선호\u003c/b>하는 것을 묻는 표현이에요. \u003cb class=\"key\">prefer\u003c/b>는 ~을 더 좋아하다라는 뜻의 동사입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">ones\u003c/b>가 양말을 대신하고 있어요. \u003cb class=\"key\">A or B\u003c/b> 형태로 두 선택지를 나란히 놓고 묻습니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which do you like better, the short ones or the long ones?\u003c/span>\u003cspan>Which do you like more, the short ones or the long ones?\u003c/span>\u003cspan>Which one do you prefer, the short ones or the long ones?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">G Um… \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">I prefer the long ones to the short ones\u003c/span>. So, \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">I'll take this pair\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">음… 나는 짧은 것보다 긴 것이 더 좋아. 그래서 이것을 살게.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">prefer A to B\u003c/b>는 B보다 A를 더 좋아한다는 뜻이에요. 비교 대상 앞에 \u003cb class=\"key\">than\u003c/b>이 아니라 \u003cb class=\"key\">to\u003c/b>를 쓴다는 점이 핵심입니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">take\u003c/b>는 여기서 물건을 사겠다, 고르겠다는 뜻으로 쓰였어요. \u003cb class=\"key\">this pair\u003c/b>는 이 켤레를 가리킵니다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I like the long ones better than the short ones. So, I'll take this pair.\u003c/span>\u003cspan>I like the long ones more than the short ones. So, I'll buy this pair.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"다섯 번째 줄입니다. Which do you prefer, the short ones or the long ones? 뜻은 짧은 것과 긴 것 중 어떤 것이 더 좋니? 예요. 선호를 물을 때는 Which do you prefer, A or B? 를 씁니다. Which do you like better, the short ones or the long ones? 라고 해도 같은 뜻이에요.","hl":"l-0"},{"n":19,"text":"여섯 번째 줄입니다. I prefer the long ones to the short ones. So, I'll take this pair. 뜻은 음, 나는 짧은 것보다 긴 것이 더 좋아. 그래서 이것을 살게. 예요. prefer A to B는 B보다 A를 더 좋아한다는 뜻이고, 여기서는 than이 아니라 to를 쓴다는 점을 꼭 기억하세요. I like the long ones better than the short ones. 라고 바꿔 말할 수도 있어요. take는 여기서 사다, 고르다라는 뜻으로 쓰였어요.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸에 들어갈 적절한 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 가장 적절한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">B: Which do you prefer, the short ones or the long ones?\nG: Um… I prefer the long ones ______ the short ones.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>to\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>than\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>from\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>over\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>for\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to\u003c/span>\u003cdiv class=\"g-exp\">prefer A to B 구문에서 비교 대상 앞에는 than이 아니라 to를 씁니다. 따라서 빈칸에는 to가 들어가야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"첫 번째 문제는 빈칸 채우기예요. 남학생이 짧은 것과 긴 것 중 어떤 것을 더 선호하냐고 묻고, 지수가 긴 것을 더 선호한다고 답하는 문장이에요. 빈칸에 들어갈 말로 가장 적절한 것을 골라 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 첫 번째 보기예요. prefer A to B는 B보다 A를 더 선호한다는 뜻이에요. 비교 대상 앞에는 than이 아니라 to를 써야 하죠. 그래서 빈칸에는 to가 들어갑니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 9\u003c/span>\u003cspan class=\"g-kind\">대화 순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화의 흐름에 맞게 순서를 바르게 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) I like the ones with the red hearts, but there are two types.\n(B) Jisu, what are you doing?\n(C) Which do you prefer, the short ones or the long ones?\n(D) I'm looking at socks. I want to buy a pair.\n(E) Um… I prefer the long ones to the short ones. So, I'll take this pair.\n(F) Which ones do you like?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>B - D - F - A - C - E\u003c/button>\  가격이 나오지 않아서 답할 수 없어요. 나머지 질문은 모두 대화 내용으로 답할 수 있어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">선호하는 것 묻고 답하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>선호를 물을 때는 \u003cb class=\"key\">Which do you prefer, A or B?\u003c/b> 를 씁니다.\u003c/li>\u003cli>선호를 말할 때는 \u003cb class=\"key\">I prefer A to B.\u003c/b> 를 쓰고, 비교 대상 앞에는 \u003cb class=\"key\">to\u003c/b>를 씁니다.\u003c/li>\u003cli>같은 뜻으로 \u003cb class=\"key\">I like A better than B.\u003c/b> 도 기억해 두세요.\u003c/li>\u003cli>앞에 나온 복수 명사는 \u003cb class=\"key\">ones\u003c/b>로 받을 수 있습니다.\u003c/li>\u003c/ul>","segs":[{"n":47,"text":"오늘은 선호를 묻고 답하는 표현을 배웠어요. 선호를 물을 때는 Which do you prefer, A or B? 를 쓰고, 답할 때는 I prefer A to B. 라고 하면 됩니다. 비교 대상 앞에 than이 아니라 to를 쓴다는 점, 꼭 기억해 두세요. 여러분, 오늘도 수고했어요. 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
