    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"C. Watch and Do","title":"중2 천재(이) 7과 대화문 해설: 생일 케이크 추천과 구매","audioDir":"4_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">추천 요청하고 제안하기\u003c/div>\u003ch1>중2 천재(이) 7과 대화문 해설: 생일 케이크 추천과 구매\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>Kate와 Junho가 친구 Alex의 생일 파티를 위해 케이크 가게에서 점원에게 어울리는 케이크를 추천받고, 가격을 확인한 뒤 초와 함께 구매하는 상황이다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 천재 이 교과서 칠 과 대화문을 함께 공부해요. Kate와 Junho가 친구 Alex의 생일 파티에 쓸 케이크를 사러 가게에 왔어요. 점원에게 케이크를 추천받고 가격을 묻는 표현을 자연스럽게 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cdiv class=\"d-en\">Junho Wow, Kate, look at all these cakes! They look so delicious.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-1\">\u003cdiv class=\"d-en\">Kate You're right! Which cake should we get for Alex's birthday party?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cdiv class=\"d-en\">Junho Hmm, I can't decide. There are so many options here.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cdiv class=\"d-en\">Clerk Hi, there! May I help you?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cdiv class=\"d-en\">Kate Oh, thank you! Can you recommend a birthday cake for us?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cdiv class=\"d-en\">Clerk Sure. How about this carrot cake?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cdiv class=\"d-en\">Junho Well, our friend Alex doesn't really like carrots. Do you have any other suggestions?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-7\">\u003cdiv class=\"d-en\">Clerk Oh, I see. Then how about this strawberry cake? It's popular these days.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cdiv class=\"d-en\">Kate That looks great! How much is it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-9\">\u003cdiv class=\"d-en\">Clerk It's 20 dollars. You can also add these birthday\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-10\">\u003cdiv class=\"d-en\">candles for 5 dollars.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-11\">\u003cdiv class=\"d-en\">Junho Great! We'll take it with the candles.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Junho Wow, Kate, look at all these cakes! They look so delicious.","hl":"r-0"},{"n":3,"text":"Kate You're right! Which cake should we get for Alex's birthday party?","hl":"r-1"},{"n":4,"text":"Junho Hmm, I can't decide. There are so many options here.","hl":"r-2"},{"n":5,"text":"Clerk Hi, there! May I help you?","hl":"r-3"},{"n":6,"text":"Kate Oh, thank you! Can you recommend a birthday cake for us?","hl":"r-4"},{"n":7,"text":"Clerk Sure. How about this carrot cake?","hl":"r-5"},{"n":8,"text":"Junho Well, our friend Alex doesn't really like carrots. Do you have any other suggestions?","hl":"r-6"},{"n":9,"text":"Clerk Oh, I see. Then how about this strawberry cake? It's popular these days.","hl":"r-7"},{"n":10,"text":"Kate That looks great! How much is it?","hl":"r-8"},{"n":11,"text":"Clerk It's 20 dollars. You can also add these birthday","hl":"r-9"},{"n":12,"text":"candles for 5 dollars.","hl":"r-10"},{"n":13,"text":"Junho Great! We'll take it with the candles.","hl":"r-11"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">추천 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you recommend + 명사 + for + 사람?\u003c/div>\u003cdiv class=\"d-mean\">~에게 …을 추천해 줄 수 있나요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Kate Oh, thank you! Can you recommend a birthday cake for us?\u003c/div>\u003cdiv class=\"d-exp\">상대방에게 어떤 사람에게 알맞은 물건이나 장소를 골라 달라고 정중하게 요청할 때 써요. \u003cb class=\"key\">recommend\u003c/b> 뒤에는 추천받을 물건을, \u003cb class=\"key\">for\u003c/b> 뒤에는 그 물건이 필요한 사람을 둡니다. 답할 때는 \u003cb class=\"key\">How about + 명사?\u003c/b>로 부드럽게 제안할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you recommend + 명사 + for + 사람?\u003c/li>\u003cli>Can you suggest + 명사 + for + 사람?\u003c/li>\u003cli>What + 명사 + would you recommend for + 사람?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>How about + 명사?\u003c/li>\u003cli>What about + 명사?\u003c/li>\u003cli>I recommend + 명사.\u003c/li>\u003cli>Why don't you try + 명사?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"먼저 추천을 요청하는 표현을 배워 볼게요. Can you recommend a birthday cake for us?라고 하면 우리에게 생일 케이크를 추천해 줄 수 있나요라는 뜻이에요. recommend 뒤에는 추천받을 물건이 오고 for 뒤에는 그 물건이 필요한 사람이 와요.","hl":"key"},{"n":15,"text":"비슷하게 Could you recommend a birthday cake for us?라고도 해요. 조금 더 부드럽게 말할 때는 Could you를 써요. Can you suggest a birthday cake for us?라고 해도 같은 뜻이고, What birthday cake would you recommend for us?라고 물을 수도 있어요.","hl":"alts"},{"n":16,"text":"점원은 How about this carrot cake?라고 답하며 당근 케이크를 제안할 수 있어요. What about this carrot cake?라고 해도 같은 뜻이에요. I recommend this carrot cake라고 직접 추천할 수도 있고, Why don't you try this carrot cake?라고 권해도 자연스러워요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">가격 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">How much is it?\u003c/div>\u003cdiv class=\"d-mean\">그것은 얼마인가요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Kate That looks great! How much is it?\u003c/div>\u003cdiv class=\"d-exp\">물건의 가격을 물을 때 쓰는 가장 기본적인 표현이에요. \u003cb class=\"key\">How much\u003c/b>는 얼마라는 뜻으로 가격을 묻고, 대답은 \u003cb class=\"key\">It's + 가격\u003c/b> 형태로 해요. \u003cb class=\"key\">cost\u003c/b>를 써서 How much does it cost?라고 물을 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What's the price of it?\u003c/li>\u003cli>How much does it cost?\u003c/li>\u003cli>Could you tell me how much it is?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>It's + 가격.\u003c/li>\u003cli>It costs + 가격.\u003c/li>\u003cli>You can get it for + 가격.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이번에는 가격을 묻는 표현을 배워 볼게요. How much is it?이라고 하면 그것은 얼마인가요라는 뜻이에요. 가게에서 물건 값을 물을 때 아주 자주 쓰는 표현이죠.","hl":"key"},{"n":18,"text":"What's the price of it?이라고 해도 가격을 물을 수 있어요. How much does it cost?는 그것이 얼마의 비용이 드나요라는 뜻이에요. Could you tell me how much it is?라고 하면 조금 더 정중하게 가격을 물을 수 있어요.","hl":"alts"},{"n":19,"text":"점원은 It's twenty dollars라고 답할 수 있어요. It costs twenty dollars라고 해도 같은 뜻이에요. You can get it for twenty dollars라고 하면 이십 달러에 살 수 있다는 뜻이 돼요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Junho Wow, Kate, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look at all these cakes\u003c/span>! \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">They look so delicious\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">와, Kate, 이 모든 케이크들 좀 봐! 정말 맛있어 보여.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">look at\u003c/b>은 시선을 어디로 향하게 하라는 뜻으로, 상대의 주의를 환기할 때 써요. \u003cb class=\"key\">all these cakes\u003c/b>는 여기 있는 모든 케이크들을 가리켜요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">look\u003c/b>은 여기서 보이다라는 뜻의 감각동사로, 뒤에 \u003cb class=\"key\">delicious\u003c/b> 같은 형용사가 와서 맛있어 보인다는 의미를 만들어요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate You're right! \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Which cake should we get for Alex's birthday party?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">맞아! 우리가 Alex의 생일 파티를 위해 어떤 케이크를 사야 할까?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">Which+명사 ~?\u003c/b>는 정해진 선택지 가운데 어느 것을 선택할지 상대방의 의견을 물을 때 쓰는 표현으로, 어느 케이크를 사야 할까라는 뜻이에요. \u003cb class=\"key\">should we get\u003c/b>은 우리가 사야 할지 의견을 묻는 형태예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Which cake do you think we should get for Alex's birthday party?\u003c/span>\u003cspan>What cake should we get for Alex's birthday party?\u003c/span>\u003cspan>Which cake would be good for Alex's birthday party?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 문장은 Wow, Kate, look at all these cakes! They look so delicious.예요. 와, Kate, 이 모든 케이크들 좀 봐, 정말 맛있어 보여라는 뜻이에요. look at은 주의를 환기할 때 쓰고, look 뒤에 delicious가 와서 맛있어 보인다는 뜻을 나타내요.","hl":"l-0"},{"n":21,"text":"두 번째 문장은 You're right! Which cake should we get for Alex's birthday party?예요. 맞아, 우리가 Alex의 생일 파티를 위해 어떤 케이크를 사야 할까라는 뜻이죠. Which cake should we get은 여러 선택지 중 어느 케이크를 사야 할지 의견을 묻는 표현이에요. 같은 뜻으로 Which cake do you think we should get for Alex's birthday party?라고도 할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Junho Hmm, \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I can't decide\u003c/span>. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">There are so many options here\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">음, 나는 결정을 못 하겠어. 여기에 선택할 수 있는 것들이 아주 많이 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">can't decide\u003c/b>는 결정을 못 하겠다, 즉 선택을 어려워한다는 뜻이에요. \u003cb class=\"key\">decide\u003c/b>는 decide to+동사원형으로도 자주 써요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">There are + 복수 명사\u003c/b>는 여러 개가 있다는 뜻이고, \u003cb class=\"key\">options\u003c/b>는 선택할 수 있는 것들이라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Clerk Hi, there! \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">May I help you?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">점원: 안녕하세요! 도와드릴까요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">May I help you?\u003c/b>는 손님에게 도움을 제안할 때 쓰는 정중한 표현으로, 도와드릴까요라는 뜻이에요. \u003cb class=\"key\">Can I help you?\u003c/b>도 같은 의미로 자주 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Can I help you?\u003c/span>\u003cspan>How can I help you?\u003c/span>\u003cspan>Is there anything I can help you with?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"세 번째 문장은 Hmm, I can't decide. There are so many options here.예요. 음, 나는 결정을 못 하겠어, 여기에 선택할 수 있는 것들이 아주 많이 있어라는 뜻이에요. can't decide는 결정을 못 하겠다는 뜻이고, options는 선택지들이라는 의미예요.","hl":"l-0"},{"n":23,"text":"네 번째 문장은 Clerk Hi, there! May I help you?예요. 안녕하세요, 도와드릴까요라는 뜻이죠. May I help you?는 손님에게 도움을 제안하는 정중한 표현이에요. 가볍게는 Can I help you?라고도 하고, Is there anything I can help you with?라고 더 친절하게 물을 수도 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate Oh, thank you! \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">Can you recommend a birthday cake for us?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">아, 감사합니다! 저희를 위해서 생일 케이크를 추천해 주실 수 있나요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">Can you recommend+명사+for+사람?\u003c/b>은 상대방에게 어떤 사람에게 알맞은 것을 추천해 달라고 요청할 때 쓰는 표현으로, ~에게 …을 추천해 줄 수 있나요라는 뜻이에요. 여기서는 \u003cb class=\"key\">recommend\u003c/b>의 목적어로 a birthday cake이, for 이하에 us가 와요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Could you recommend a birthday cake for us?\u003c/span>\u003cspan>Can you suggest a birthday cake for us?\u003c/span>\u003cspan>What birthday cake would you recommend for us?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Clerk Sure. \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">How about this carrot cake?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">물론이죠. 이 당근 케이크는 어떠세요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">How about+명사(구)?\u003c/b>는 ~은 어때?라는 뜻으로 상대방에게 무언가를 제안할 때 쓰는 표현이에요. 여기서는 \u003cb class=\"key\">this carrot cake\u003c/b>와 함께 쓰여 이 당근 케이크는 어때요라는 뜻을 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What about this carrot cake?\u003c/span>\u003cspan>Why don't you try this carrot cake?\u003c/span>\u003cspan>Would this carrot cake be good?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"다섯 번째 문장은 Oh, thank you! Can you recommend a birthday cake for us?예요. 아, 감사합니다, 저희를 위해서 생일 케이크를 추천해 주실 수 있나요라는 뜻이에요. recommend 뒤에는 추천받을 물건이 오고 for 뒤에는 그 물건이 필요한 사람이 와요. Could you recommend a birthday cake for us?라고 더 부드럽게 말할 수도 있어요.","hl":"l-0"},{"n":25,"text":"여섯 번째 문장은 Sure. How about this carrot cake?예요. 물론이죠, 이 당근 케이크는 어떠세요라는 뜻이에요. How about 뒤에 명사구를 붙이면 상대에게 부드럽게 제안하는 표현이 돼요. What about this carrot cake?라고 해도 같은 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Junho Well, our friend Alex \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">doesn't really like carrots\u003c/span>. \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">Do you have any other suggestions?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">음, 저희 친구 Alex가 당근을 별로 안 좋아해요. 다른 제안이 있으신가요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">doesn't really like\u003c/b>는 별로 좋아하지 않는다는 뜻으로, 좋아하는 정도가 크지 않음을 나타내요. 주어 Alex가 삼인칭 단수라서 \u003cb class=\"key\">doesn't\u003c/b>가 쓰였어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">Do you have any other+복수 명사?\u003c/b>는 이미 제시한 것 외에 다른 것이 더 있는지 물을 때 쓰는 표현으로, 다른 ~이 있나요라는 뜻이에요. 여기서 \u003cb class=\"key\">suggestions\u003c/b>는 제안이라는 뜻의 복수 명사예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Are there any other suggestions?\u003c/span>\u003cspan>Do you have any other ideas?\u003c/span>\u003cspan>Could you suggest anything else?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Clerk Oh, I see. Then \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">how about this strawberry cake?\u003c/span> \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">It's popular these days.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">아, 알겠어요. 그러면 이 딸기 케이크는 어떠세요? 그것이 요즘 인기 있어요.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">how about+명사?\u003c/b>는 앞서 나온 제안과 다른 선택지를 부드럽게 제안할 때 써요. \u003cb class=\"key\">this strawberry cake\u003c/b>는 점원이 새로 권하는 딸기 케이크를 가리켜요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>\u003cb class=\"key\">popular\u003c/b>는 인기 있는이라는 뜻이고, \u003cb class=\"key\">these days\u003c/b>는 요즘, 최근에라는 뜻의 시간 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What about this strawberry cake?\u003c/span>\u003cspan>Why don't you try this strawberry cake?\u003c/span>\u003cspan>Would this strawberry cake be good?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"일곱 번째 문장은 Well, our friend Alex doesn't really like carrots. Do you have any other suggestions?예요. 음, 저희 친구 Alex가 당근을 별로 안 좋아해요, 다른 제안이 있으신가요라는 뜻이에요. Do you have any other suggestions?는 이미 나온 것 외에 다른 제안이 있는지 묻는 표현이에요. Are there any other suggestions?라고도 할 수 있어요.","hl":"l-0"},{"n":27,"text":"여덟 번째 문장은 Oh, I see. Then how about this strawberry cake? It's popular these days.예요. 아, 알겠어요, 그러면 이 딸기 케이크는 어떠세요, 그것은 요즘 인기 있어요라는 뜻이에요. how about은 다른 선택지를 부드럽게 제안할 때 쓰고, these days는 요즘이라는 뜻이에요. What about this strawberry cake?라고 해도 같은 의도예요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">That looks great!\u003c/span> \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">How much is it?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">좋네요! 그것은 얼마인가요?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>\u003cb class=\"key\">look\u003c/b>은 감각동사로, 뒤에 \u003cb class=\"key\">great\u003c/b> 같은 형용사가 와서 좋아 보인다는 뜻을 나타내요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">14\u003c/span>\u003cspan>\u003cb class=\"key\">How much is it?\u003c/b>은 물건의 가격을 물을 때 쓰는 표현으로, 그것은 얼마인가요라는 뜻이에요. 대답은 \u003cb class=\"key\">It's+가격\u003c/b>의 형태로 해요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What's the price of it?\u003c/span>\u003cspan>How much does it cost?\u003c/span>\u003cspan>Could you tell me how much it is?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Clerk \u003cspan class=\"mk\">15\u003c/span>\u003cspan class=\"tgt\">It's 20 dollars.\u003c/span> \u003cspan class=\"mk\">16\u003c/span>\u003cspan class=\"tgt\">You can also add\u003c/span> these birthday\u003c/div>\u003cdiv class=\"d-ko\">20달러입니다. 이 생일\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan>\u003cb class=\"key\">It's+가격\u003c/b>은 가격을 답할 때 쓰는 기본 형태로, 20달러입니다라는 뜻이에요. \u003cb class=\"key\">dollars\u003c/b>는 달러라는 뜻의 복수 명사예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">16\u003c/span>\u003cspan>\u003cb class=\"key\">can also add\u003c/b>는 추가로 더할 수 있다는 뜻으로, 점원이 선택 사항을 안내할 때 써요. \u003cb class=\"key\">add\u003c/b>는 더하다, 추가하다라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":28,"text":"아홉 번째 문장은 That looks great! How much is it?예요. 좋네요, 그것은 얼마인가요라는 뜻이에요. How much is it?은 물건의 가격을 물을 때 쓰는 기본 표현이고, 대답은 It's에 가격을 붙여서 해요. How much does it cost?라고도 가격을 물을 수 있어요.","hl":"l-0"},{"n":29,"text":"열 번째 문장은 It's twenty dollars. You can also add these birthday로 이어져요. 이십 달러입니다, 또한 이 생일 초들을 추가하실 수 있다는 뜻으로 이어지는 부분이에요. It's 뒤에 가격을 말하면 가격을 답하는 표현이 되고, can also add는 추가로 더할 수 있다는 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 11–12 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">11\u003c/span>\u003c/
