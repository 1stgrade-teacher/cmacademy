  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);

003c/span>\u003ch2 class=\"g-h\">추천 요청하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Can you recommend + 목적어?\u003c/div>\u003cdiv class=\"d-mean\">저에게 ~을 추천해 주시겠어요?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: G Excuse me. Can you recommend a baseball cap\u003c/div>\u003cdiv class=\"d-exp\">\u003cb class=\"key\">Can you recommend\u003c/b>는 상대방에게 특정한 물건이나 서비스를 추천해 달라고 부탁할 때 쓰는 표현이에요. 상대방의 의견이나 경험을 바탕으로 \u003cb class=\"key\">좋은 선택\u003c/b>을 찾고자 할 때 유용하죠. 대답할 때는 추천하고 싶은 물건을 \u003cb class=\"key\">명확하게\u003c/b> 말하고, 그 이유를 덧붙여 설명할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Could you recommend + 목적어?\u003c/li>\u003cli>Would you recommend + 목적어?\u003c/li>\u003cli>Can you suggest + 목적어?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Of course! How about + 명사?\u003c/li>\u003cli>Sure. I recommend + 명사.\u003c/li>\u003cli>Why don't you try + 명사?\u003c/li>\u003cli>I'd suggest + 명사.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"먼저 추천을 요청하는 표현을 배워 볼게요. Can you recommend a baseball cap for me, please? 이렇게 말하면 저에게 야구 모자를 추천해 주시겠어요, 라는 뜻이 돼요. 이때 recommend 뒤에는 목적어가 바로 오고 전치사를 쓰지 않는다는 점을 꼭 기억해요.","hl":"key"},{"n":9,"text":"같은 뜻을 다른 표현으로도 말할 수 있어요. Could you recommend a baseball cap for me? 하고 더 공손하게 말할 수 있고, Can you suggest a baseball cap for me?라고도 해요. Would you recommend a baseball cap for me?도 같은 뜻이 된답니다.","hl":"alts"},{"n":10,"text":"대답은 이렇게 해요. Of course, How about this red baseball cap? 하고 추천할 수 있죠. Sure, I recommend this red baseball cap이라고 해도 되고, Why don't you try this red baseball cap?처럼 권유하는 형태로 대답해도 자연스러워요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">가격 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">How much is[are] ~?\u003c/div>\u003cdiv class=\"d-mean\">~은 얼마인가요?\u00
