@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 천재(이) 7과 본문2","audioDir":"2_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>천재(이)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Half Empty, Half Full?\u003c/h1>\u003ch2>반이 비어 있는가, 반이 차 있는가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 동일한 치즈라도 표현 방식에 따라 \u003cb class=\"key\">프레이밍 \u003c/b>\u003cb class=\"key\">효과\u003c/b>로 인해 소비자가 느끼는 건강함이 달라진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The wording of product information can deceive consumers through the framing effect even when the content is identical.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 우리가 일상에서 흔히 겪는 단어의 함정에 관한 재미있는 이야기를 함께 살펴볼게요. 샌드위치에 넣을 치즈를 고르는 미아의 이야기를 통해 정보 표현 방식이 우리의 판단에 어떤 영향을 주는지 알아보죠. 전체 글의 요지와 핵심 주제를 차근차근 정리해 드릴 테니 잘 따라오세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시)\u003c/div>","segs":[{"n":2,"text":"우리가 어떤 정보를 접할 때 똑같은 내용이라도 프레이밍 효과에 따라 전혀 다르게 느껴질 수 있어요. 예를 들어 물이 반이나 남았다고 말하는 것과 반밖에 안 남았다고 말하는 것은 느낌이 확 다르죠. 이 지문 역시 치즈의 성분을 어떻게 포장하느냐에 따라 소비자가 받는 심리적 영향을 다루고 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상황 제시\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>반이 비었는지 차 있는지에 대한 질문으로 글을 열고, 샌드위치에 넣을 치즈를 고르는 \u003cb class=\"key\">Mia\u003c/b>의 일상적 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 줍니다. 그녀는 두 가지 종류의 치즈 중에서 하나를 골라야 하는 \u003cb class=\"key\">기로\u003c/b>에 놓이게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선택과 착각\u003csmall>전개 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>치즈 포장에 각각 20% 지방과 80% 무지방이라고 적혀 있고, \u003cb class=\"key\">Mia\u003c/b>는 80% 무지방 치즈를 집어 듭니다. 그녀는 이것이 더 \u003cb class=\"key\">건강\u003c/b>하다고 혼잣말을 하며 자신이 내린 선택에 대해 큰 \u003cb class=\"key\">자부심\u003c/b>을 느낍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진실 발견\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>하지만 \u003cb class=\"key\">Mia\u003c/b>는 이 단어들이 자신을 \u003cb class=\"key\">속이고\u003c/b> 있다는 사실을 전혀 알지 못합니다. 사실 두 종류의 치즈는 성분과 내용이 \u003cb class=\"key\">완벽하게 \u003c/b>\u003cb class=\"key\">동일\u003c/b>한 같은 제품입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 문장부터 마지막 문장까지 전체 글의 흐름을 단계별로 꼼꼼히 짚어볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 반이 비었는지 차 있는지 묻는 질문으로 호기심을 유발해요. 이어서 샌드위치에 넣을 치즈를 찾고 있는 미아를 소개하며 두 종류의 치즈 사이에서 선택 상황에 놓인 모습을 보여주죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 한쪽에는 20퍼센트 지방, 다른 한쪽에는 80퍼센트 무지방이라고 적혀 있는 상황이 펼쳐져요. 미아는 80퍼센트 무지방 치즈를 집어 들고는 이것이 더 건강할 거라고 혼잣말을 하며 자신이 한 현명한 선택에 큰 자부심을 느낀답니다.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계에서는 반전이 일어납니다. 미아는 단어들이 자신을 속이고 있다는 사실을 까맣게 모르고 있지만, 사실 그 두 종류의 치즈는 완전히 동일한 제품이라는 진실이 드러나요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 동일한 치즈를 가리키는 두 가지 다른 \u003cb class=\"key\">표현 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 대조하여 보여 줍니다. 처음에는 서로 다른 선택을 하는 것처럼 보이게 만들지만, 마지막 문장에서 사실 두 제품이 완전히 같다는 \u003cb class=\"key\">반전\u003c/b>을 제시하며 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 드러냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (8)\u003c/b>\u003cspan>역접\u003c/span>\u003cb>actually (9)\u003c/b>\u003cspan>강조 및 진실 드러내기\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">two types of cheese\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">One\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the other\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">80% fat-free cheese\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Both types of cheese\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the same\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>20% 지방\u003c/th>\u003cth>80% 무지방\u003c/th>\u003c/tr>\u003ctr>\u003ctd>부정적인 어감\u003c/td>\u003ctd>긍정적인 어감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지방 수치 강조\u003c/td>\u003ctd>무지방 비율 강조\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 두 가지 치즈의 표현 방식을 대조하면서 마지막에 진실을 밝히는 미괄식 전개 방식을 취하고 있어요. 처음에는 미아가 뭔가 대단한 건강식을 고른 것처럼 묘사되지만, 마지막 문장인 아홉 번째 문장에서 반전을 주면서 글의 핵심 메시지를 강렬하게 전달하고 있죠.","hl":"ty"},{"n":8,"text":"문장 속에서 길을 찾아주는 신호어들을 눈여겨봐야 해요. 여덟 번째 문장의 윗줄에 있는 However는 앞의 상황을 뒤집어주는 역접의 역할을 톡톡히 하고 있답니다. 그리고 아홉 번째 문장의 actually는 두 치즈가 사실은 같다는 진실을 명확하게 강조해 주는 중요한 역할을 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>half\u003c/b>\u003cem>adjective\u003c/em>\u003cspan>반의, 절반의\u003c/span>\u003c/div>\u003cdiv>\u003cb>empty\u003c/b>\u003cem>adjective\u003c/em>\u003cspan>비어 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>full\u003c/b>\u003cem>adjective\u003c/em>\u003cspan>가득 찬\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>verb\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sandwich\u003c/b>\u003cem>noun\u003c/em>\u003cspan>샌드위치\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>verb\u003c/em>\u003cspan>선택하 >\u003c/div>","segs":[{"n":19,"text":"One says, 하나는 적혀 있고. \"20% Fat,\", ‘20% 지방’이라고. and the other says, 다른 하나는 적혀 있습니다. \"80% Fat-Free.\", ‘80% 무지방’이라고. 이 문장 전체를 해석하면, 하나는 ‘20% 지방’이라고 적혀 있고, 다른 하나는 ‘80% 무지방’이라고 적혀 있습니다.","hl":"m"},{"n":20,"text":"이 문장은 두 개의 치즈 포장지에 적힌 문구를 비교하고 있어요. 똑같은 치즈인데 한쪽은 지방 함량을, 다른 한쪽은 무지방 비율을 강조해서 적어두었죠.","hl":"mn"},{"n":21,"text":"첫 번째 어법 포인트는 One과 the other 표현이에요. 둘 중에서 하나를 가리킬 때는 One, 나머지 하나를 가리킬 때는 the other를 쓴다는 것을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mia는 집어 듭니다\u003c/span>\u003cspan class=\"en\">Mia \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picks \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">80% 무지방 치즈를\u003c/span>\u003cspan class=\"en\">the 80% fat-free cheese.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mia는 80% 무지방 치즈를 집어 듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공 미아가 두 치즈 중 어떤 것을 선택했는지 보여주는 문장이에요. 80% 무지방이라는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>에 이끌려 치즈를 고르는 미아의 모습이 잘 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사(타동사 + 부사)\u003c/span> : pick [동사] + up [부사] + [목적어] : \"집어 들다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Mia picks up, Mia는 집어 듭니다. the 80% fat-free cheese, 80% 무지방 치즈를. 이 문장 전체를 해석하면, Mia는 80% 무지방 치즈를 집어 듭니다.","hl":"m"},{"n":23,"text":"미아가 수많은 치즈 중에서 80% 무지방이라고 적힌 치즈를 집어 드는 장면이에요. 숫자의 마법에 속아 더 나은 선택을 했다고 믿기 시작하는 순간이죠.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 이어동사 pick up이에요. 일반명사 목적어는 동사와 부사 사이뿐만 아니라 부사 뒤에도 올 수 있다는 점을 잘 살펴두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 혼잣말을 합니다\u003c/span>\u003cspan class=\"en\">She says to herself,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각한다\u003c/span>\u003cspan class=\"en\">&quot;I think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 더 건강에 좋은 것 같다고\u003c/span>\u003cspan class=\"en\">it's \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">healthier\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 “나는 이것이 더 건강에 좋은 것 같아!”라고 혼잣말을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미아가 자신이 고른 치즈가 더 건강에 좋을 것이라고 확신하며 만족감을 느끼는 장면이에요. 언어의 포장 방식이 사람의 \u003cb class=\"key\">판단력\u003c/b>에 어떤 영향을 주는지 보여주는 중요한 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 비교급\u003c/span> : 원급(healthy) + -er : \"더 건강에 좋은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">생략된 접속사 that\u003c/span> : 주어 + 동사 + [that절(주어 + 동사)] : \"~라는 것을 생각하다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"She says to herself, 그녀는 혼잣말을 합니다. \"I think, 나는 생각한다. it's healthier!\", 이것이 더 건강에 좋은 것 같다고. 이 문장 전체를 해석하면, 그녀는 “나는 이것이 더 건강에 좋은 것 같아!”라고 혼잣말을 합니다.","hl":"m"},{"n":26,"text":"미아는 자신이 똑똑한 선택을 했다고 믿으며 스스로를 칭찬하고 있어요. 하지만 사실은 똑같은 치즈라는 반전이 숨겨져 있어서 교훈을 주는 문장이에요.","hl":"mn"},{"n":27,"text":"첫 번째 어법 포인트는 목적절을 이끄는 접속사 that의 생략이에요. think 뒤에 대상을 설명하는 문장이 이어질 때 that을 생략할 수 있다는 점을 잊지 마세요. 두 번째 어법 포인트는 비교급 표현인 healthier예요. 두 대상의 상태를 비교할 때 형용사 뒤에 -er을 붙인다는 것을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 자부심을 느낍니다\u003c/span>\u003cspan class=\"en\">She feels proud\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선택에 대해\u003c/span>\u003cspan class=\"en\">of the choice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">makes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신이 한 선택에 자부심을 느낍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미아가 80% 지방 제거라는 문구에 속아 스스로 건강한 선택을 했다고 착각하며 \u003cb class=\"key\">뿌듯해하는 \u003c/b>\u003cb class=\"key\">모습\u003c/b>을 보여줍니다. \u003cb class=\"key\">단어의 \u003c/b>\u003cb class=\"key\">함정\u003c/b>에 빠진 주인공의 모습을 통해 마케팅의 이면을 꼬집는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 명사(선행사) [the choice] + 주격/목적격 관계대명사 [that] + 주어 [she] + 타동사 [makes] : \"자신이 한\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"She feels proud, 그녀는 자부심을 느낍니다. of the choice, 그 선택에 대해. that she makes, 자신이 한. 이 문장 전체를 해석하면, 그녀는 자신이 한 선택에 자부심을 느낍니다.","hl":"m"},{"n":29,"text":"미아가 자신이 건강한 치즈를 골랐다고 착각하며 뿌듯해하는 장면이에요. 마케팅에 속아 넘어가면서도 스스로 자랑스러워하는 모습을 재치 있게 보여주고 있죠.","hl":"mn"},{"n":30,"text":"여기서 첫 번째 어법 포인트는 목적격 관계대명사 that이에요. the choice라는 선행사를 뒤에서 꾸며주며 makes의 목적어가 빠진 불완전한 절이 오니까 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mia는 모릅니다\u003c/span>\u003cspan class=\"en\">Mia does not know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단어들이 그녀를 속이고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">words \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">tricking \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 Mia는 이 단어들이 그녀를 속이고 있다는 것을 모릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 내용과 반전이 일어나는 문장으로, 미아가 보고 있는 \u003cb class=\"key\">치즈 \u003c/b>\u003cb class=\"key\">포장지의 \u003c/b>\u003cb class=\"key\">문구\u003c/b>가 사실은 소비자를 속이는 마케팅 수단임을 알려줍니다. 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>가 드러나는 중요한 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 접속사 없이 이끄는 that절 (목적어)\u003c/span> : 주어 [Mia] + 일반동사 부정 [does not know] + 접속사 that 생략 + 절 [the words are tricking her] : \"단어들이 그녀를 속이고 있다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"However, 하지만. Mia does not know, Mia는 모릅니다. the words are tricking her, 단어들이 그녀를 속이고 있다는 것을. 이 문장 전체를 해석하면, 하지만 Mia는 이 단어들이 그녀를 속이고 있다는 것을 모릅니다.","hl":"m"},{"n":32,"text":"미아는 자신이 똑똑한 소비를 했다고 믿지만, 사실은 포장지에 적힌 문구에 속고 있다는 반전의 의미를 담고 있어요.","hl":"mn"},{"n":33,"text":"이번 문장에서는 know 뒤에 목적어 역할을 하는 절이 이어지는데 이때 접속사 that이 생략되었어요. 그리고 are tricking이라는 현재 진행형을 써서 지금 이 순간에도 단어들이 미아를 속이고 있음을 나타내고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 종류의 치즈는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Both \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cheese\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실은\u003c/span>\u003cspan class=\"en\">are actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같습니다!\u003c/span>\u003cspan class=\"en\">the same!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 종류의 치즈는 사실 같습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 20% 지방 치즈와 80% 지방 미포함 치즈가 \u003cb class=\"key\">완벽하게 \u003c/b>\u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">제품\u003c/b>이라는 충격적인 진실을 밝힙니다. 언어의 표현 방식만 다를 뿐 \u003cb class=\"key\">본질은 \u003c/b>\u003cb class=\"key\">같다\u003c/b>는 이 글의 핵심 메시지를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">both + 복수명사 주어\u003c/span> : Both + 복수명사 [types of cheese] + 복수동사 [are] : \"두 종류의 치즈는\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Both types of cheese, 두 종류의 치즈는. are actually, 사실은. the same!, 같습니다!. 이 문장 전체를 해석하면, 두 종류의 치즈는 사실 같습니다!","hl":"m"},{"n":35,"text":"지방 20%와 지방 미포함 80%가 결국 완전히 똑같은 치즈라는 반전의 결론을 내려주는 문장이에요.","hl":"mn"},{"n":36,"text":"마지막 어법 포인트는 둘 다를 뜻하는 Both예요. Both 뒤에는 복수명사가 와야 하므로 동사도 복수형인 are를 쓴다는 것을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>반이 비었는지 차 있는지에 대한 질문으로 글이 시작됩니다.\u003c/li>\u003cli>\u003cb class=\"key\">Mia\u003c/b>는 샌드위치에 넣을 치즈 두 종류 중 하나를 고릅니다.\u003c/li>\u003cli>그녀는 80% 무지방 치즈가 더 건강하다고 믿고 자부심을 느낍니다.\u003c/li>\u003cli>하지만 두 치즈는 단어만 다를 뿐 사실 완전히 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">제품\u003c/b>입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The wording of product information can deceive consumers through the framing effect even when the content is identical.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 동일한 치즈라도 표현 방식에 따라 \u003cb class=\"key\">프레이밍 \u003c/b>\u003cb class=\"key\">효과\u003c/b>로 인해 소비자가 느끼는 건강함이 달라진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 배운 내용을 깔끔하게 마무리해 볼게요. 단어의 겉모습이나 표현 방식에 속아 넘어가지 않고 본질을 보는 눈을 기르는 것이 중요해요. 복습 열심히 하시고 우리는 다음 시간에 더 재미있는 영어 지문으로 다시 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
