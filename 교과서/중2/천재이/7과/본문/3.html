@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 천재(이) 7과 본문3","audioDir":"3_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>천재(이)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Power of Fewer Choices\u003c/h1>\u003ch2>더 적은 선택지가 주는 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">선택지\u003c/b>가 너무 많으면 \u003cb class=\"key\">스트레스\u003c/b>를 받지만, \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">선택지\u003c/b>는 우리가 더 현명한 \u003cb class=\"key\">결정\u003c/b>을 내리도록 돕는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Fewer choices can guide you to make wiser decisions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 중학교 2학년 천재 이 교과서의 일곱 번째 단원 본문 마지막 내용을 함께 공부해 볼게요. 이번 지문에서는 선택지가 너무 많을 때 우리가 겪는 고민과 해결책을 다루고 있어요. 글 전체의 요약과 요지를 꼼꼼하게 정리해 줄 테니 끝까지 집중해서 잘 따라와 주세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 마치 마트에서 수십 가지의 라면을 마주했을 때 머릿속이 하얗게 변하는 현상을 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">과부하\u003c/b> 또는 \u003cb class=\"key\">Choice \u003c/b>\u003cb class=\"key\">Overload\u003c/b>라고 해요. 선택의 폭이 넓어지면 오히려 결정을 내리지 못하거나 만족감이 떨어지는 심리적 현상을 의미하죠. 이 지문에서는 아이스크림 가게의 \u003cb class=\"key\">예나\u003c/b>가 겪는 상황을 통해 이러한 \u003cb class=\"key\">선택의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>을 흥미롭게 보여주고 있어요. 결국 우리 삶에서도 너무 많은 가능성보다는 \u003cb class=\"key\">핵심적인 \u003c/b>\u003cb class=\"key\">선택지\u003c/b> 몇 개만 주어질 때 훨씬 편안하고 합리적인 \u003cb class=\"key\">의사결정\u003c/b>을 할 수 있답니다.)\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 먼저 살펴볼게요. 마트에 갔을 때 수십 가지의 라면 종류를 보면 머릿속이 하얗게 변하는 경험을 해본 적이 다들 있을 거예요. 이렇게 선택의 폭이 넓어지면 오히려 결정을 내리지 못하는 현상을 선택 과부하라고 불러요. 오늘 지문에 나오는 예나 역시 비슷한 상황을 겪으면서 더 적은 선택지가 주는 가치를 깨닫게 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상황 제시\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>여러 가지 맛이 있는 \u003cb class=\"key\">아이스크림 \u003c/b>\u003cb class=\"key\">가게\u003c/b>에서 예나를 상상해 보게 하지만, 놀랍게도 예나에게는 이 상황이 전혀 신나지 않아요. 너무 많은 \u003cb class=\"key\">아이스크림 \u003c/b>\u003cb class=\"key\">맛\u003c/b> 때문에 오히려 난감한 입장에 처하게 되죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제와 해결\u003csmall>문제-해결 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>예나는 너무 많은 \u003cb class=\"key\">선택지\u003c/b> 때문에 \u003cb class=\"key\">스트레스\u003c/b>를 느끼다가 친절한 점원 \u003cb class=\"key\">Andy\u003c/b>에게 도움을 요청하기로 결심해요. Andy가 모두가 좋아하는 상위 다섯 가지 맛을 추천해 준 덕분에 예나는 \u003cb class=\"key\">단 \u003c/b>\u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">선택지\u003c/b> 중에서 쉽게 \u003cb class=\"key\">결정\u003c/b>을 내려요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>깨달음과 적용\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>미소를 지으며 가게를 떠난 예나는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">선택지\u003c/b>가 더 좋을 수 있다는 것을 깨달아요. 쇼핑할 때 이러한 \u003cb class=\"key\">비밀\u003c/b>들을 기억한다면 여러분도 더 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내릴 수 있도록 안내받을 수 있을 거예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 문장부터 마지막 문장까지 전체 글의 흐름을 단계별로 차근차근 짚어볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 상황 제시예요. 첫 번째 문장부터 세 번째 문장까지의 내용인데요. 여러 가지 맛이 있는 아이스크림 가게에 있는 예나를 상상해 보게 하지만, 놀랍게도 예나에게는 이 상황이 전혀 신나지 않고 오히려 고민에 빠지게 만들어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제와 해결이에요. 네 번째 문장부터 일곱 번째 문장까지 해당하죠. 예나는 너무 많은 선택지 때문에 스트레스를 느끼다가 친절한 점원 Andy에게 도움을 요청하기로 결심해요. 그리고 Andy가 모두가 좋아하는 상위 다섯 가지 맛을 추천해 준 덕분에 예나는 단 몇 가지 선택지 중에서 쉽게 결정을 내리게 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 깨달음과 적용이에요. 여덟 번째 문장부터 열 번째 문장까지의 내용인데요. 미소를 지으며 가게를 떠난 예나는 더 적은 선택지가 더 좋을 수 있다는 것을 깨달아요. 마지막으로 쇼핑할 때 이러한 비밀들을 기억한다면 여러분도 더 현명한 결정을 내릴 수 있도록 안내받을 수 있을 거예요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 주인공 예나가 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>로 인해 겪는 \u003cb class=\"key\">스트레스\u003c/b>라는 문제를 먼저 제시하고, 점원의 \u003cb class=\"key\">추천\u003c/b>을 통해 이를 해결하는 과정을 보여줘요. 마지막에는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">선택지\u003c/b>가 더 좋다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">깨달음\u003c/b>을 전달하며 글을 마무리하므로 문제와 해결의 구조를 띠고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Lastly (1)\u003c/b>\u003cspan>도입 신호어\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>결과 및 해결 신호어\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">so many options\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a few options\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fewer choices\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>많은 선택지\u003c/th>\u003cth>적은 선택지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>스트레스를 유발함\u003c/td>\u003ctd>쉽고 현명한 결정을 도움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이번 지문의 전개 방식과 구조를 분석해 볼까요. 이 글은 주인공 예나가 겪는 스트레스라는 문제를 먼저 제시하고 점원의 도움으로 해결하는 문제와 해결 구조로 되어 있어요. 글의 앞부분에서 상황과 문제를 보여준 뒤 마지막에 깨달음을 전달하는 두괄식의 특징도 함께 가지고 있답니다.","hl":"ty"},{"n":8,"text":"글을 읽을 때 눈여겨봐야 할 신호어들도 있어요. 첫 번째 문장의 Lastly는 마지막으로 이야기를 마무리하며 상황을 도입하는 역할을 하고, 다섯 번째 문장의 So는 앞서 겪은 스트레스라는 문제에 대한 해결책으로 행동을 유도하는 아주 중요한 결과의 신호어예요. 이런 연결고리를 잘 파악하면 글의 전개가 눈에 쏙 들어올 거예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>flavor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맛\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가게\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신나는\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stressed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>스트레스를 받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>option\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택지\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>clerk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점원\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도움\u003c/span>\u003c/div>\u003cdiv>\u003cb>recommend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추천하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>top\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최고의, 상위의\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a decision\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결정을 내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미소\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fewer\u003c/b>\u003cem>형용사\u0 ips\">\u003cspan class=\"s\">smart\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolish\u003c/span>\u003cspan class=\"a\">unwise\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"주요 어휘들의 동의어와 반의어를 함께 정리해 볼게요. stressed는 스트레스를 받는 이라는 뜻으로 anjonus나 pressured 같은 동의어가 있고, 반의어로는 relaxed가 있어요. recommend는 suggest나 advise로바꿔 쓸 수 있고, wise는 smart라는 동의어와 foolish라는 반의어를 가디고 있으니 함께 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛 속에서 길을 잃다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Lost\u003c/span> in Flavors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로,\u003c/span>\u003cspan class=\"en\">Lastly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예나를 상상해 보세요\u003c/span>\u003cspan class=\"en\">imagine Yena\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이스크림 가게에 있는\u003c/span>\u003cspan class=\"en\">at an ice cream shop\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 가지 종류의 아이스크림 맛이 있는\u003c/span>\u003cspan class=\"en\">with many kinds of ice cream flavors.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">맛 속에서 길을 잃다 마지막으로, 여러 가지 종류의 아이스크림 맛이 있는 아이스크림 가게에 있는 예나를 상상해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 선택 상황에서 겪는 혼란을 설명하기 위해 \u003cb class=\"key\">아이스크림 \u003c/b>\u003cb class=\"key\">가게\u003c/b>라는 구체적인 예를 도입하는 역할이에요. 과거분사구 \u003cb class=\"key\">Lost \u003c/b>\u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">Flavors\u003c/b>가 문장 앞에 나와 제목 역할을 하면서 글의 주제인 \u003cb class=\"key\">선택의 \u003c/b>\u003cb class=\"key\">어려움\u003c/b>을 흥미롭게 시작하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구문(수식)\u003c/span> : [[Lost (과거분사)]] + 전치사구 : \"길을 잃은\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Lost in Flavors, 맛 속에서 길을 잃다. Lastly, 마지막으로. imagine Yena, 예나를 상상해 보세요. at an ice cream shop, 아이스크림 가게에 있는. with many kinds of ice cream flavors, 여러 가지 종류의 아이스크림 맛이 있는. 이 문장 전체를 해석하면, 맛 속에서 길을 잃다 마지막으로, 여러 가지 종류의 아이스크림 맛이 있는 아이스크림 가게에 있는 예나를 상상해 보세요.","hl":"m"},{"n":12,"text":"첫 번째 문장은 선택 상황에서의 혼란을 보여주기 위해 아이스크림 가게라는 구체적인 예를 도입하는 역할을 해요. 앞에 나온 Lost in Flavors는 제목처럼 쓰여서 앞으로 펼쳐질 선택의 어려움에 대한 이야기를 흥미롭게 열어주고 있어요.","hl":"mn"},{"n":13,"text":"첫 번째 어법 포인트는 맨 앞에 쓰인 Lost예요. 이 부분은 분사가 형용사처럼 쓰여서 맛 속에서 길을 잃은 상태를 꾸며주는 분사구문 형태랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신나는 일이죠?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Exciting, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇죠?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">right?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신나는 일이죠?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 많은 아이스크림을 고를 수 있는 상황이 신나고 좋은 일인지 독자에게 묻는 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이에요. 뒤에 붙은 \u003cb class=\"key\">부정사의 \u003c/b>\u003cb class=\"key\">생략\u003c/b> 및 짧은 덧붙임 표현을 통해 독자의 공감을 이끌어내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 서술 및 부가 의문 표현\u003c/span> : [[Exciting (형용사)]] + right? : \"신나는 일이죠, 그렇지 않나요?\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Exciting, 신나는 일이죠?. right?, 그렇죠?. 이 문장 전체를 해석하면, 신나는 일이죠?","hl":"m"},{"n":15,"text":"두 번째 문장은 많은 아이스크림을 고를 수 있는 상황이 정말 신나고 멋진 일인지 독자에게 가볍게 묻는 문장이에요. 짧은 감탄과 확인의 표현을 써서 독자의 공감을 자연스럽게 이끌어내고 있어요.","hl":"mn"},{"n":16,"text":"두 번째 어법 포인트는 주어와 동사가 생략된 구어체 형태라는 점이에요. Exciting이라는 형용사 뒤에 right를 붙여서 상대방의 동의를 구하는 부가 의문문 같은 느낌을 주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글쎄요,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예나에게는 그렇지 않습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">Yena\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">글쎄요, 예나에게는 그렇지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 신나는 상황이 예나에게는 해당되지 않는다는 점을 \u003cb class=\"key\">대조\u003c/b>하여 보여주는 문장이에요. 생략된 표현을 통해 앞 문장의 내용을 받아치면서 \u003cb class=\"key\">반전의 \u003c/b>\u003cb class=\"key\">묘미\u003c/b>를 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">어구 생략 및 전치사구\u003c/span> : not + [[전치사구 (for Yena)]] : \"예나에게는 그렇지 않다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Well, 글쎄요. not for Yena, 예나에게는 그렇지 않습니다.. 이 문장 전체를 해석하면, 글쎄요, 예나에게는 그렇지 않습니다.","hl":"m"},{"n":18,"text":"세 번째 문장은 앞서 말한 신나는 상황이 예나에게는 전혀 해당되지 않는다는 것을 보여주어 반전의 재미를 주는 문장이에요. 앞 문장의 긴 내용을 반복하지 않고 짧게 줄여서 표현했어요.","hl":"mn"},{"n":19,"text":"세 번째 어법 포인트는 반복되는 표현을 생략한 구조예요. It is exciting이 생략되고 not for Yena만 남겨서 예나에게는 그렇지 않다는 의미를 아주 간결하게 나타내고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 스트레스를 느낍니다\u003c/span>\u003cspan class=\"en\">She feels \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stressed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class= u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 비밀들을 기억하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Remember\u003c/span> these secrets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑할 때\u003c/span>\u003cspan class=\"en\">when you go shopping.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쇼핑할 때 이러한 비밀들을 기억하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 다룬 Yena의 이야기를 일반 독자들에게 확장하여, 실제 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서 이 교훈을 적용해 볼 것을 당부하는 \u003cb class=\"key\">명령문\u003c/b>입니다. 글의 실용적인 목적을 드러내며 독자들의 행동 변화를 유도하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형 (Remember)] + [목적어] : \"기억하세요\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Remember these secrets, 이러한 비밀들을 기억하세요. when you go shopping, 쇼핑할 때. 이 문장 전체를 해석하면, 쇼핑할 때 이러한 비밀들을 기억하세요.","hl":"m"},{"n":36,"text":"이 문장은 앞서 다룬 예나의 이야기를 일반 독자들에게 확장하여 실제 쇼핑 상황에서 이 교훈을 적용해 볼 것을 당부하는 명령문이에요. 글의 실용적인 목적을 잘 드러내며 독자들의 행동 변화를 유도하고 있답니다.","hl":"mn"},{"n":37,"text":"첫 번째 어법 포인트는 명령문이에요. 주어인 You를 따로 쓰지 않고 곧바로 동사원형인 Remember로 시작해서 상대방에게 무엇을 하라고 당부하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 안내해 줄 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">guide \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내리도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 현명한 결정을\u003c/span>\u003cspan class=\"en\">wiser decisions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들이 여러분이 더 현명한 결정을 내리도록 안내해 줄 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 쇼핑할 때 \u003cb class=\"key\">비결\u003c/b>을 기억하면 앞으로 더 나은 선택을 할 수 있음을 조언하는 글의 결론이에요. 앞서 배운 \u003cb class=\"key\">선택의 \u003c/b>\u003cb class=\"key\">비밀\u003c/b>이 현명한 \u003cb class=\"key\">의사결정\u003c/b>을 돕는다는 역할을 명확히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 구조 (guide + 목적어 + 목적격 보어)\u003c/span> : guide [5형식 동사] + [you (목적어)] + [to make (to부정사구/목적격 보어)] : \"여러분이 내리도록 안내해 줄 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"They, 그것들이. will guide you, 여러분이 안내해 줄 것입니다. to make, 내리도록. wiser decisions, 더 현명한 결정을. 이 문장 전체를 해석하면, 그것들이 여러분이 더 현명한 결정을 내리도록 안내해 줄 것입니다.","hl":"m"},{"n":39,"text":"이 문장은 쇼핑할 때 배운 비결을 기억하면 앞으로 더 나은 선택을 할 수 있다고 조언하는 결론이에요. 앞서 배운 선택의 비밀이 현명한 의사결정을 돕는다는 중요한 역할을 하고 있죠.","hl":"mn"},{"n":40,"text":"첫 번째 어법 포인트는 5형식 문장 구조예요. guide는 목적격 보어로 to부정사를 취하는 5형식 동사라서 목적어인 you 뒤에 반드시 to make 형태로 써야 해요. 이런 동사 형태는 서술형 시험에 자주 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>예나는 많은 \u003cb class=\"key\">아이스크림 \u003c/b>\u003cb class=\"key\">맛\u003c/b> 때문에 \u003cb class=\"key\">스트레스\u003c/b>를 느낀다.\u003c/li>\u003cli>점원 Andy의 \u003cb class=\"key\">추천\u003c/b>으로 예나는 쉽게 \u003cb class=\"key\">결정\u003c/b>을 내린다.\u003c/li>\u003cli>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">선택지\u003c/b>가 더 좋을 수 있음을 \u003cb class=\"key\">깨닫는다\u003c/b>.\u003c/li>\u003cli>쇼핑할 때 이 \u003cb class=\"key\">비밀\u003c/b>들을 기억하면 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내릴 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Fewer choices can guide you to make wiser decisions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">선택지\u003c/b>가 너무 많으면 \u003cb class=\"key\">스트레스\u003c/b>를 받지만, \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">선택지\u003c/b>는 우리가 더 현명한 \u003cb class=\"key\">결정\u003c/b>을 내리도록 돕는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 배운 내용을 바탕으로 복습을 철저히 해보세요. 선택지가 많다고 해서 무조건 좋은 것은 아니라는 글의 교훈을 꼭 기억하길 바라요. 수고 많았고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
