@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 천재(이) 7과 본문1","audioDir":"1_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>천재(이)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Psychology of Tricky Price Tags\u003c/h1>\u003ch2>교묘한 가격표의 심리학\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리가 쇼핑할 때 가격 외에도 고려해야 할 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">비밀\u003c/b>이 있으며, 그중 \u003cb class=\"key\">교묘한 \u003c/b>\u003cb class=\"key\">가격표\u003c/b>는 소비자를 현혹해 착각하게 만든다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Tricky price tags manipulate consumers into thinking they are getting a great deal when prices are reduced.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 중학교 영어 독해에서 자주 다루는 쇼핑할 때 숨겨진 비밀에 관한 글을 함께 공부해 볼게요. 우리가 평소에 무심코 지나치는 가격표 뒤에는 어떤 소비자 심리가 숨어 있는지 살펴볼 거예요. 글 전체를 관통하는 핵심 요지와 흐름을 아주 꼼꼼하게 정리해 드릴게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">상업 자본주의 사회에서 판매자들은 소비자의 심리적 허점을 파고드는 \u003cb class=\"key\">상업 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 적극적으로 활용한다. 대표적인 예로 원래 가격을 비싸게 책정해 두고 마치 엄청난 혜택을 주는 것처럼 포장하는 \u003cb class=\"key\">가격 \u003c/b>\u003cb class=\"key\">착시 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 있다. 일상에서 마트나 백화점에 가면 빨간색 할인 딱지가 붙어 있을 때 왠지 사지 않으면 손해를 보는 듯한 느낌을 받는 것과 비슷하다. 이러한 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 정확히 이해해야 불필요한 지출을 막고 합리적인 구매를 할 수 있다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 넓혀 볼게요. 우리가 마트나 옷 가게에 가면 세일 딱지가 붙어 있는 물건을 쉽게 볼 수 있죠. 판매자들은 원래 가격을 높게 적어 두고 할인을 크게 하는 것처럼 보이게 만들어 소비자의 지갑을 열게 만들어요. 이런 상업 마케팅 전략은 우리의 가격 착시 현상을 자극해서 이성적인 판단을 흐리게 만든답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문 제기\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>쇼핑할 때 무엇을 생각하는지 \u003cb class=\"key\">질문\u003c/b>을 던지며 글을 시작한다. 가격 외에도 \u003cb class=\"key\">생각해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">것들\u003c/b>이 더 많음을 언급한다. 꼭 알아야 할 몇 가지 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">비밀\u003c/b>이 있음을 알려 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>상황 제시\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>옷 가게에 간 로건의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 든다. 로건은 마음에 드는 티셔츠를 발견하지만 40달러라는 \u003cb class=\"key\">가격표\u003c/b>를 보고 비싸다고 생각한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>심리 변화\u003csmall>전개 · 문장 8–12\u003c/small>\u003c/h4>\u003cp>다음 날 가격이 30달러로 바뀐 것을 보고 로건은 \u003cb class=\"key\">할인\u003c/b>이라고 여기며 흥분한다. 결국 30달러도 여전히 비싼 금액이지만 좋은 가격이라고 \u003cb class=\"key\">착각\u003c/b>하며 구입을 결정한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 첫 번째 문장부터 차근차근 글의 흐름을 분석해 볼게요.","hl":null},{"n":4,"text":"처음 세 문장에서는 쇼핑할 때 무슨 생각을 하는지 질문 제기를 던지면서 시작해요. 가격이 하나의 요소일 수 있지만 실제로는 생각해야 할 것들이 더 많다고 말하죠. 이어서 우리가 꼭 알아야 할 몇 가지 쇼핑 비밀이 있다고 언급하면서 독자의 흥미를 끌어내요.","hl":"f0"},{"n":5,"text":"네 번째 문장부터 일곱 번째 문장까지는 상황 제시 단계예요. 옷 가게에 간 로건이라는 인물을 상상해 보라고 하죠. 로건은 정말 마음에 드는 멋진 티셔츠를 발견하지만 가격표에 적힌 사십 달러를 보고는 비싸다고 생각해요.","hl":"f1"},{"n":6,"text":"여덟 번째 문장부터 마지막 문장까지는 심리 변화 단계예요. 다음 날 가격이 줄로 지워져 있고 삼십 달러로 바뀐 것을 보자 로건은 할인 중이라며 신이 나요. 사실 삼십 달러도 여전히 큰 금액이지만 로건은 좋은 가격이라고 착각하며 결국 구매를 결정하게 되죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 \u003cb class=\"key\">도입부\u003c/b>에서 쇼핑할 때 알아야 할 비밀이 있다고 전체적인 주제를 먼저 밝힌다. 이어서 옷 가게에 간 로건이라는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">인물\u003c/b>의 사례를 든다. 마지막에는 그 사례를 통해 소비자가 착각에 빠지는 과정을 \u003cb class=\"key\">설명\u003c/b>하며 마무리한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>First (4)\u003c/b>\u003cspan>순서 연결\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>역접 전환\u003c/span>\u003cb>In fact (12)\u003c/b>\u003cspan>사실 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">shopping secrets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The Tricky Price Tags\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">price tag says 40 dollars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">price is crossed out and the tag says 30 dollars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">great deal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">great price\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>첫날의 40달러\u003c/th>\u003cth>다음 날의 30달러\u003c/th>\u003c/tr>\u003ctr>\u003ctd>비싸다고 느낌\u003c/td>\u003ctd>할인이라며 좋아함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>구입을 망설임\u003c/td>\u003ctd>구입을 결정함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개방식은 구체적인 사례를 보여 주는 예시 구조를 사용하고 있어요. 글의 앞부분에서 앞으로 다룰 내용을 미리 알려 주는 두괄식 형태를 띠고 있어서 전체적인 글의 뼈대를 쉽게 파악할 수 있답니다.","hl":"ty"},{"n":8,"text":"문장 사이를 이어주는 신호어들을 눈여겨봐야 해요. 네 번째 문장의 첫 부분에 나온 First라는 표현은 새로운 사례를 시작한다는 것을 알려 주죠. 여덟 번째 문장의 But은 어제와 오늘 가격을 대조하는 역접 전환의 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>shopping\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쇼핑\u003c/span>\u003c/div>\u003cdiv>\u003cb>price\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가격\u003c/span>\u003c/div>\u0 /span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">deal!\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 좋은 거래야!”라고 혼잣말을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Logan이 40달러에서 30달러로 할인된 \u003cb class=\"key\">가격표\u003c/b>를 보고 엄청난 이득이라고 \u003cb class=\"key\">착각\u003c/b>하며 기뻐하는 모습을 강조하고 있습니다. 감탄문 구문을 사용하여 Logan의 들뜬 감정을 생생하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문\u003c/span> : What + a + 형용사 + 명사 + (주어 + 동사)! : \"정말 좋은 거래야!\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"What a, 정말. great deal!, 좋은 거래야!. 이 문장 전체를 해석하면, 정말 좋은 거래야!”라고 혼잣말을 합니다.","hl":"m"},{"n":38,"text":"Logan이 할인된 가격을 보고 정말 유리한 조건이라고 착각하며 크게 기뻐하는 상황을 표현하고 있어요. 감탄문을 사용해서 인물의 들뜬 감정을 아주 생생하게 전달하고 있죠.","hl":"mn"},{"n":39,"text":"이 문장은 명사를 강조하는 감탄문이에요. What으로 시작해서 뒤에 관사 a와 형용사 great, 그리고 명사 deal을 차례대로 연결하는 어순을 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 신이 나서\u003c/span>\u003cspan class=\"en\">He gets excited\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 구입하기로 결정합니다.\u003c/span>\u003cspan class=\"en\">and decides \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 신이 나서 그것을 구입하기로 결정합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가격 할인의 \u003cb class=\"key\">속임수\u003c/b>에 넘어간 Logan이 흥분한 감정을 이기지 못하고 충동구매를 하게 되는 결정을 보여줍니다. and로 두 개의 동사구가 매끄럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide [타동사] + [to부정사 (목적어)] : \"구입하기로\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He gets excited, 그는 신이 나서. and decides to buy it, 그것을 구입하기로 결정합니다.. 이 문장 전체를 해석하면, 그는 신이 나서 그것을 구입하기로 결정합니다.","hl":"m"},{"n":41,"text":"할인 가격에 완전히 현혹된 Logan이 결국 감정을 주체하지 못하고 충동적으로 구매를 결심하는 장면이에요.","hl":"mn"},{"n":42,"text":"첫 번째 어법 포인트는 decides의 목적어로 쓰인 to buy예요. decide는 뒤에 목적어로 to부정사를 데려오는 동사라서 동사원형 buy 앞에 to를 붙여서 목적어 역할을 하게 만들었죠. 그리고 주어 하나에 gets와 decides가 병렬 구조로 연결되어 있는 것도 놓치지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실,\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">30달러는 여전히 큰 금액이지만,\u003c/span>\u003cspan class=\"en\">30 dollars \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> still a lot,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Logan은 생각합니다\u003c/span>\u003cspan class=\"en\">but Logan thinks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 좋은 가격이라고\u003c/span>\u003cspan class=\"en\">it is a great price!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 30달러는 여전히 큰 금액이지만, Logan은 그것이 좋은 가격이라고 생각합니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 객관적으로는 여전히 비싸지만 \u003cb class=\"key\">착시 \u003c/b>\u003cb class=\"key\">효과\u003c/b> 때문에 30달러를 합리적인 가격으로 믿어버리는 소비자의 \u003cb class=\"key\">비합리적\u003c/b>인 심리를 꼬집고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수 취급 주어와 동사 일치\u003c/span> : 금액 단위(30 dollars) [주어(단수)] + is [단수 동사] : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"In fact, 사실. 30 dollars is still a lot, 30달러는 여전히 큰 금액이지만. but Logan thinks, Logan은 생각합니다. it is a great price!, 그것이 좋은 가격이라고. 이 문장 전체를 해석하면, 사실, 30달러는 여전히 큰 금액이지만, Logan은 그것이 좋은 가격이라고 생각합니다!","hl":"m"},{"n":44,"text":"객관적인 사실과 소비자가 느끼는 주관적인 생각이 얼마나 다른지 짚어주며 가격표의 마법에 빠진 모습을 비판적으로 보여주고 있어요.","hl":"mn"},{"n":45,"text":"여기서는 주어와 동사의 일치를 살펴볼게요. 30 dollars처럼 금액을 나타내는 표현이 주어로 쓰일 때는 모양이 복수처럼 보여도 하나의 덩어리로 취급해서 복수 동사가 아니라 단수 동사 is를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>쇼핑할 때는 가격 외에도 \u003cb class=\"key\">생각해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">요소\u003c/b>들이 많다.\u003c/li>\u003cli>로건은 옷 가게에서 \u003cb class=\"key\">40달러짜리 \u003c/b>\u003cb class=\"key\">티셔츠\u003c/b>를 보고 비싸다고 느낀다.\u003c/li>\u003cli>다음 날 가격표가 \u003cb class=\"key\">30달러로 \u003c/b>\u003cb class=\"key\">바뀐 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 보고 할인이라고 착각한다.\u003c/li>\u003cli>여전히 비싼 금액이지만 좋은 가격이라고 \u003cb class=\"key\">믿고 \u003c/b>\u003cb class=\"key\">구매\u003c/b>하게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Tricky price tags manipulate consumers into thinking they are getting a great deal when prices are reduced.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리가 쇼핑할 때 가격 외에도 고려해야 할 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">비밀\u003c/b>이 있으며, 그중 \u003cb class=\"key\">교묘한 \u003c/b>\u003cb class=\"key\">가격표\u003c/b>는 소비자를 현혹해 착각하게 만든다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 배운 내용은 쇼핑할 때 우리가 어떻게 가격 착시에 빠지는지 보여주는 아주 흥미로운 지문이었어요. 복습할 때는 로건의 감정이 어떻게 변했는지 흐름을 다시 한번 꼭 읽어 보세요. 여러분 모두 수고 많았어요 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
