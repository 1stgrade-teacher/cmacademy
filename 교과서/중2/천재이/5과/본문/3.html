one ate the cake)</li><li>장남 해리에 대한 심문 (spoke with Harry)</li><li>핵심 키워드: 아침 행적(morning activities)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02해리의 알리바이</div><ul><li>해리는 운동 후 귀가하여 상자 속 케이크를 확인했을 뿐 먹지는 않았다고 주장한다.</li><li>축구 후 오전 11시경 귀가 (played soccer, around 11)</li><li>테이블 위 상자를 열어 내용물 확인 (opened the box)</li><li>확인 후 바로 자신의 방으로 이동 (went to my room)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결정적 단서와 해명</div><ul><li>Jones 부인은 해리의 입가에 묻은 부스러기를 지적하며 의문을 제기한다.</li><li>입 주변에서 발견된 부스러기 (crumbs around your mouth)</li><li>해리의 변명: 배가 고파서 초코 쿠키를 먹었음 (ate chocolate cookies)</li><li>핵심 키워드: 증거(evidence), 배고픔(hungry)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">speak with</td><td class=\"m\">~와 대화하다, ~와 이야기하다</td></tr><tr><td class=\"w\">come back</td><td class=\"m\">돌아오다, 복귀하다</td></tr><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 가루</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b>Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기하며,</span><span class=\"en\"><b><span class=\"grammar-hl\">spoke with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 아들 Harry와</span><span class=\"en\"><b><span class=\"grammar-hl\">Harry, the oldest son</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">”누군가</span><span class=\"en\"><b>“Someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹었어.</span><span class=\"en\"><b>ate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너희 엄마의 케이크를</span><span class=\"en\"><b>your mom’s cake.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b>What</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 했니</span><span class=\"en\"><b>did you do</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"><b>this morning?”</b></span></div></div><div class=\"lec-sent-ko\">(처음에, Ms. Jones는 큰 아들 Harry와 이야기했다. “누군가 너희 엄마의 케이크를 먹었어. 오늘 아침에 너는 무엇을 했니?”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 사건의 조사가 시작되는 도입부로, Ms. Jones가 유력한 용의자인 Harry를 신문하며 정보를 수집하고 있습니다. spoke with Harry는 조사의 첫 대상을 선택했다는 의미이며, 상대방의 알리바이를 확인하기 위해 구체적인 행적을 묻고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spoke with (관용표현): speak with + 사람 형태로 &#39;~와 대화하다&#39;라는 의미를 나타내는 표현이다.</div><div class=\"lec-gr-item\">Harry, the oldest son (동격): 명사 Harry와 명사구 the oldest son이 콤마(,)로 연결되어 동일 인물임을 나타내며, 대상을 보충 설명하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">”저는 축구를 했고,</span><span class=\"en\"><b>“I played soccer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 돌아왔으며</span><span class=\"en\"><b>and I <span class=\"grammar-hl\">came back</span> home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시쯤.</span><span class=\"en\"><b>around 11.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 상자를 보았고</span><span class=\"en\"><b>I saw the box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식탁 위에 있는</span><span class=\"en\"><b>on the table</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 열었으며,</span><span class=\"en\"><b>and opened it.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크가 있었지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">There was a cake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안에,</span><span class=\"en\"><b>inside,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그것을 먹지 않았어요.”</span><span class=\"en\"><b>but I didn’t eat it.”</b></span></div></div><div class=\"lec-sent-ko\">(“저는 축구를 했고, 11시쯤 집에 돌아왔어요. 저는 식탁 위에 있는 상자를 보았고 그것을 열었어요. 안에 케이크가 있었지만, 저는 그것을 먹지 않았어요.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Harry가 자신의 오전 행적을 시간순으로 설명하며 무죄를 입증하려는 단계입니다. saw the box ... and opened it은 케이크의 존재를 확인했다는 사실을 솔직하게 밝힘으로써, 자신이 무언가를 숨기지 않고 있다는 인상을 주려는 의도가 담겨 있습니다. 앞선 행동에 이어 자신의 결백을 직접적으로 주장하는 결론부입니다. didn’t eat it은 상자를 열어 내용물을 확인하는 호기심은 보였으나, 실제 취식 행위라는 선은 넘지 않았음을 강조하며 혐의를 부인하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came back (관용표현): &#39;~로 돌아오다&#39;라는 의미로 쓰이는 구동사이다.</div><div class=\"lec-gr-item\">There was a cake (도치): 유도부사 There가 문장 맨 앞에 쓰이면서 &#39;be동사(was) + 주어(a cake)&#39; 순으로 주어와 동사가 도치된 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“무엇을</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 했니</span><span class=\"en\"><b><span class=\"grammar-hl\">did you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런 다음에?”</span><span class=\"en\"><b>after that?”</b></span></div></div><div class=\"lec-sent-ko\">“그런 다음에 너는 무엇을 했니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Ms. Jones가 Harry의 진술에서 논리적 빈틈을 찾기 위해 추가적인 질문을 던지는 장면입니다. after that은 케이크 상자를 연 시점과 현재 사이의 시간적 공백을 메우기 위한 질문으로, Harry가 다른 행동을 했을 가능성을 탐색하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What did you do 의문문 구조: 의문사 What이 목적어 역할을 수행하며, 일반동사 do의 의문문을 만들기 위해 조동사 did가 주어(you) 앞에 위치한 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">”저는</span><span class=\"en\"><b>“I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그냥 갔어요</span><span class=\"en\"><b>just <span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 방에.”</span><span class=\"en\"><b><span class=\"grammar-hl\">to my room</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“저는 그냥 제 방에 갔어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Harry는 케이크와 더 이상의 접촉이 없었음을 단순하게 답변하여 상황을 마무리 지으려 합니다. just went to my room은 다른 부차적인 행동 없이 주방을 곧장 떠났음을 의미하며, 케이크 사건과 자신을 완전히 분리시키려는 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went to my room 1형식 구조: 주어(I)와 자동사 go(went) 뒤에 장소를 나타내는 전치사구(to my room)가 수식어로 붙은 1형식(SV) 구조의 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">”흠….</span><span class=\"en\"><b>“Hmm....</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b><span class=\"grammar-hl\">why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부스러기가 있지?</span><span class=\"en\"><b><span class=\"grammar-hl\">do you have</span> crumbs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 입 주변에”</span><span class=\"en\"><b>around your mouth?”</b></span></div></div><div class=\"lec-sent-ko\">(“흠…. 그러면 네 입 주변에 왜 부스러기가 있지?”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Ms. Jones가 Harry의 말과 모순되는 결정적인 물리적 증거를 제시하며 압박하는 전환점입니다. crumbs around your mouth는 무언가를 먹지 않았다는 Harry의 주장을 정면으로 반박하는 단서로, 그의 알리바이에 의구심을 제기하는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">why do you have 의문문 구조: 이유를 묻는 의문사 why로 시작하며, 일반동사 have의 의문문을 위해 조동사 do가 주어 앞에 쓰인 직접의문문 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 가루</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">”오,</span><span class=\"en\"><b>“Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 먹었는데</span><span class=\"en\"><b>I ate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초콜릿 쿠키를 조금</span><span class=\"en\"><b>some chocolate cookies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배가 고파서 먹었어요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">because I was hungry</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“오, 저는 배가 고파서 초콜릿 쿠키를 조금 먹었어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐롤이 자신의 상황을 설명하며 케이크가 없었다는 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because I was hungry (부사절): 이유를 나타내는 접속사 because가 이끄는 절로, 주어(I), be동사(was), 보어(hungry)를 모두 갖춘 완전한 절이 주절에 대한 이유를 설명한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>Ms. Jones가 없어진 엄마의 케이크 범인을 찾기 위해 첫째 아들 Harry를 신문한다.</li><li>Harry는 축구를 하고 돌아와 상자를 열어보긴 했지만 케이크를 먹지는 않았다고 주장한다.</li><li>Ms. Jones는 Harry의 입가에 묻은 부스러기를 지적하며 그의 진술을 의심한다.</li><li>Harry는 배가 고파서 쿠키를 먹었을 뿐이라며 새로운 핑계를 대며 상황을 피하려 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ms. Jones questions Harry about the missing cake while identifying suspicious crumbs around his mouth despite his denial.</div>\n              <div class=\"lec-final-sum-ko\">Jones 씨는 Harry에게 사라진 케이크에 대해 질문하는 한편, 먹지 않았다는 그의 부인에도 불구하고 입가 주변의 의심스러운 부스러기를 포착한다.</div></div></div>"],"segs":[[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/3.mp3","hl":null},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/17.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/20.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/21.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/22.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문3_강의_audio/23.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/24.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문3_강의_audio/25.mp3","hl":"grammar"}],[{"audio"
