않는 진술을 할 때 주인공이 이를 꿰뚫어 보는 것도 바로 이 추론의 힘 덕분입니다. 본문의 Ms. Jones 역시 탐정처럼 인물들의 진술 속에 숨겨진 논리적 허점(Logical Fallacy)을 찾아내 범인을 지목하고 있는데, 이는 우리가 일상에서 상대방의 말이 진실인지 판단할 때 사용하는 &#39;인지적 필터&#39;와도 비슷합니다. 따라서 독자 여러분도 각 인물의 진술이 과연 상황과 어떻게 맞물리는지 탐정이 된 기분으로 꼼꼼히 따져보시면 훨씬 흥미롭게 읽으실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01마지막 용의자 탐문</div><ul><li>미스 존스는 사건의 마지막 당사자인 톰과 대화를 나누며 상황을 확인한다.</li><li>막내아들 톰(Tom)과의 면담 진행</li><li>엄마의 케이크를 좋아하는지 확인</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02톰의 알리바이 제시</div><ul><li>톰은 아침에 배가 아파 침대에 있었으며, 약을 먹으러 주방에 갔었다고 진술한다.</li><li>복통(stomachache)으로 인해 아침 내내 침대에 머묾</li><li>오전 11시 30분경 약(medicine)을 먹으러 주방 방문</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의심스러운 행동 고백</div><ul><li>톰은 주방에서 케이크 상자를 열어보았으며, 다시 닫았다는 사실을 인정한다.</li><li>상자(box)가 열려 있어 내부의 케이크를 확인</li><li>상자를 다시 닫았음(closed)을 시인</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04범인 지목</div><ul><li>미스 존스는 진술 속의 모순을 근거로 범인을 최종적으로 판단한다.</li><li>거짓말을 한 사람이 케이크를 먹었다고 선언</li><li>톰의 진술 속에서 범행의 단서를 포착</li><li>핵심 키워드: 거짓말(lie), 케이크(cake)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stomachache</td><td class=\"m\">복통, 배앓이</td></tr><tr><td class=\"w\">take</td><td class=\"m\">먹다, 복용하다, 가져가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는 막내아들 Tom을 만났다.</span><span class=\"en\"><b>Ms. Jones met Tom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">막내아들인</span><span class=\"en\"><b><span class=\"grammar-hl\">the youngest son</span>.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, Ms. Jones는 막내아들 Tom을 만났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 다른 가족들을 차례로 심문하던 과정에 이어, 마지막 용의자인 톰을 조사하는 단계로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the youngest son (동격): 명사(Tom)와 명사구(the youngest son)를 나란히 배치하여 앞의 명사를 구체적으로 설명하는 동격 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“Tom, 너는 엄마의 케이크를 좋아하지, 맞지?”</span><span class=\"en\"><b>“Tom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>you <span class=\"grammar-hl\">like your mom’s cake,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">right?</span>”</b></span></div></div><div class=\"lec-sent-ko\">“Tom, 너는 엄마의 케이크를 좋아하지, 맞지?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 존스 씨가 케이크를 먹었을 가능성이 있는 톰에게 범행 동기를 확인하며 자연스럽게 대화를 시작하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">like your mom’s cake, right? (관용표현(부가의문문)): 긍정문(you like...) 뒤에 , right?를 붙여 상대방의 동의를 구하거나 확인하는 관용적인 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네,</span><span class=\"en\"><b>“Yeah,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그것을 좋아해요.</span><span class=\"en\"><b><span class=\"grammar-hl\">I like it</span>.</b></span></div></div><div class=\"lec-sent-ko\">“네, 저는 그것을 좋아해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰은 케이크를 좋아한다는 사실을 인정하면서도, 자신이 왜 케이크 근처에 가지 못했는지에 대한 알리바이를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I like it 대명사: it은 앞 문장에서 언급된 mom&#39;s cake를 가리키며, 반복을 피하기 위해 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>Actually,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 엄마가 케이크를 굽는 냄새를 맡았어요.</span><span class=\"en\"><b>I <span class=\"grammar-hl\">smelled Mom baking a cake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침에</span><span class=\"en\"><b>in the morning.</b></span></div></div><div class=\"lec-sent-ko\">사실, 저는 엄마가 아침에 케이크를 굽는 냄새를 맡았어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰의 알리바이에 허점은 없는지, 혹은 케이크를 볼 기회가 있었는지 확인하려는 취조의 연속입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">smelled Mom baking a cake 5형식(SVOC) 구조: smell은 지각동사로, 목적어(Mom)의 동작을 현재분사(baking) 형태의 목적격 보어로 취합니다. Mom이 직접 케이크를 굽고 있는 동작을 감각으로 인지함을 나타냅니다.</div><div class=\"lec-gr-item\">baking a cake (현재분사): 목적어인 Mom의 동작을 설명하며, 5형식 지각동사 smell의 목적격 보어로 쓰여 진행 중인 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 저는 배가 아파서</span><span class=\"en\"><b>But I had a stomachache,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침대에 누워 있었어요.</span><span class=\"en\"><b>so <span class=\"grammar-hl\">I stayed in bed</span>.”</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 배가 아파서 침대에 누워 있었어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰은 11시 30분이라는 구체적인 시간을 언급하며 상황을 설명합니다. 특히 자신이 케이크를 직접 보았음을 고백함으로써 스스로 범인으로 몰릴 위험한 단서를 제공하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I stayed in bed (관용표현): in bed는 &#39;침대에 누워 있다&#39; 또는 &#39;자고 있다&#39;라는 상태를 나타내는 관용구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stomachache</td><td class=\"m\">복통, 배앓이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 갔었니</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Did you go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에?</span><span class=\"en\"><b>to the kitchen?”</b></span></div></div><div class=\"lec-sent-ko\">“너는 부엌에 갔었니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰이 닫았다고 한 상자가 사실은 케이크가 없어졌음을 숨기기 위해 열려 있어야 했던 상황임을 추론한 결과입니다. 사건의 진상을 파악한 탐정의 확신에 찬 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you go (대동사): Did는 앞 문장의 &#39;stayed in bed&#39;를 질문으로 바꾸며 과거 시제의 일반동사 go를 의문문 구조로 이끌어내기 위해 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네,</span><span class=\"en\"><b>“Yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 부엌에 갔어요</span><span class=\"en\"><b>I went to the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약을 먹으러</span><span class=\"en\"><b><span class=\"grammar-hl\">to take some medicine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시 30분쯤</span><span class=\"en\"><b>at about 11:30.</b></span></div></div><div class=\"lec-sent-ko\">“네, 저는 11시 30분쯤 약을 먹으러 부엌에 갔어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take some medicine (to부정사): 부사적 용법 중 &#39;목적&#39;을 나타내며, &#39;약을 먹기 위해서&#39;라는 의미로 동작의 의도를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take</td><td class=\"m\">먹다, 복용하다, 가져가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상자는 열려 있었고,</span><span class=\"en\"><b>The box <span class=\"grammar-hl\">was open</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 저는 케이크를 볼 수 있었어요</span><span class=\"en\"><b>so I could see the cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에 있는</span><span class=\"en\"><b>in it.</b></span></div></div><div class=\"lec-sent-ko\">상자는 열려 있었고, 그래서 저는 그 안에 있는 케이크를 볼 수 있었어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was open 상태 서술: 주어(The box)의 상태를 설명하는 형용사 보어 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then I <span class=\"grammar-hl\">closed the box</span>.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 상자를 닫았어요.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그러고 나서 저는 상자를 닫았어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">closed the box 일반동사 과거형: 주어(I)의 과거 행위를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones가 웃으면서</span><span class=\"en\"><b>Ms. Jones smiled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다.</span><span class=\"en\"><b>and said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거짓말을 한 사람이</span><span class=\"en\"><b>“<span class=\"grammar-hl\">The person who lied</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 먹었다는 것을</span><span class=\"en\"><b>ate the cake.”</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones가 웃으면서 말했다. “거짓말을 한 사람이 케이크를 먹었어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰이 닫았다고 한 상자가 사실은 케이크가 없어졌음을 숨기기 위해 열려 있어야 했던 상황임을 추론한 결과입니다. 사건의 진상을 파악한 탐정의 확신에 찬 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The person who lied (관계대명사): 주격 관계대명사 who가 선행사(The person)를 수식합니다. 절 내부에서 who가 주어 역할을 하며, 관계대명사 뒤에는 주어 없이 동사(lied)로 이어지는 불완전한 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>존스 씨가 마지막 용의자인 톰을 심문한다.</li><li>톰은 아침에 아파서 침대에 있었지만, 약을 먹으러 부엌에 갔었다고 말한다.</li><li>톰은 열린 상자 속의 케이크를 보았고 다시 닫았다고 진술한다.</li><li>존스 씨는 그 진술이 거짓임을 간파하고 톰을 범인으로 지목한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Tom claimed to have stayed in bed due to a stomachache, but his admission of opening the cake box at the kitchen exposed his lie.</div>\n              <div class=\"lec-final-sum-ko\">톰은 복통으로 침대에 있었다고 주장했으나, 부엌에서 케이크 상자를 열었다는 진술이 그의 거짓말을 드러냈다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}
