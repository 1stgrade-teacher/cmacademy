 되어 상상해보면 내용을 훨씬 더 흥미롭게 이해하실 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01생일 선물 준비</div><ul><li>엄마는 아빠의 생일을 축하하기 위해 비밀 선물을 준비한다.</li><li>아빠의 생일(Dad’s birthday)을 위해 직접 케이크를 구움</li><li>케이크를 상자에 넣어 주방 식탁(table) 위에 보관함</li><li>핵심 키워드: 비밀 선물(secret gift)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02엄마의 외출</div><ul><li>케이크 장식에 필요한 양초를 사기 위해 잠시 자리를 비운다.</li><li>오전 11시에 양초(candles)를 사러 나감</li><li>약 한 시간(one hour) 동안 집을 비우게 됨</li><li>핵심 키워드: 외출(went out)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03빈 상자 발견</div><ul><li>외출 후 돌아온 엄마는 주방에서 당황스러운 광경을 목격한다.</li><li>집으로 돌아왔을 때 상자가 비어 있음(empty)을 발견</li><li>식탁 위에 그대로 있던 상자 속 내용물만 사라짐</li><li>핵심 키워드: 빈 상자(empty box)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04사건의 결말</div><ul><li>엄마가 없는 사이 누군가 케이크를 모두 먹어버리는 사건이 발생한다.</li><li>누군가(someone) 케이크 전체를 다 먹어 치움</li><li>축하를 위해 준비한 케이크가 통째로 사라진 상황</li><li>핵심 키워드: 사라진 케이크(Missing Cake)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">secret</td><td class=\"m\">비밀의, 숨겨진</td></tr><tr><td class=\"w\">wrap</td><td class=\"m\">싸다, 포장하다</td></tr><tr><td class=\"w\">go out</td><td class=\"m\">외출하다, 나가다</td></tr><tr><td class=\"w\">come back</td><td class=\"m\">돌아오다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find</td><td class=\"m\">발견하다, 알게 되다</td></tr><tr><td class=\"w\">empty</td><td class=\"m\">비어 있는, 빈</td></tr><tr><td class=\"w\">whole</td><td class=\"m\">전체의, 모든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사라진 케이크</span><span class=\"en\"><b>A <span class=\"grammar-hl\">Missing Cake</span></b></span></div></div><div class=\"lec-sent-ko\">사라진 케이크</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Today was Dad’s birthday는 이 이야기가 시작되는 시간적 배경이자, 앞으로 일어날 모든 사건의 근거가 되는 날을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Missing Cake (현재분사(형용사)): -ing 형태인 missing이 뒤에 오는 명사 Cake를 수식하여 &#39;없어진/사라진 케이크&#39;라는 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘은 아빠의 생일이었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Today was Dad’s birthday</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘은 아빠의 생일이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Today was Dad’s birthday는 이 이야기가 시작되는 시간적 배경이자, 앞으로 일어날 모든 사건의 근거가 되는 날을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Today was Dad’s birthday 2형식(SVC) 구조: &#39;주어(Today) + be동사(was) + 주격 보어(Dad’s birthday)&#39;로 이루어져 주어의 정체나 상태를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비밀 선물로,</span><span class=\"en\"><b>As a secret gift,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마는 그에게 케이크를 구워 주셨다.</span><span class=\"en\"><b>Mom <span class=\"grammar-hl\">baked him a cake</span>.</b></span></div></div><div class=\"lec-sent-ko\">비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> As a secret gift는 엄마가 아빠를 깜짝 놀라게 해주려는 다정한 의도를 가지고 정성스럽게 선물을 준비했음을 의미합니다. 앞 문장에서 언급된 생일을 축하하기 위한 구체적인 행동이 이어지고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">baked him a cake 4형식(SVOO) 구조: 수여동사 bake가 &#39;간접목적어(him) + 직접목적어(a cake)&#39; 구조로 쓰여 &#39;~에게 ~을 구워주다&#39;라는 의미를 전달함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">secret</td><td class=\"m\">비밀의, 숨겨진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 케이크를 포장했다</span><span class=\"en\"><b>She wrapped the cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자 안에</span><span class=\"en\"><b>in a box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 놓았다</span><span class=\"en\"><b>and put it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에 있는 식탁 위에.</span><span class=\"en\"><b>on the table in the kitchen.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> wrapped the cake in a box는 케이크가 겉으로 보이지 않게 잘 보관되었다는 점을, on the table in the kitchen은 이후 사건이 벌어지게 될 구체적인 장소를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wrapped the cake... and put it 병렬 구조: 등위접속사 and를 중심으로 과거 시제 동사 wrapped와 put이 대등하게 연결되어 동일한 주어(She)의 연속된 동작을 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wrap</td><td class=\"m\">싸다, 포장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 밖으로 나갔다</span><span class=\"en\"><b>she went out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초를 사기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy candles</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시에.</span><span class=\"en\"><b>at 11.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> went out to buy candles는 엄마가 집을 비우게 된 합당한 이유를 설명합니다. 이 문장은 엄마의 부재로 인해 케이크가 무방비 상태로 남겨졌음을 암시하며, 사건이 발생할 시간적 틈을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy candles (to부정사): &#39;to + 동사원형(buy)&#39;의 형태로, &#39;양초를 사기 위해서&#39;라는 동작의 목적을 나타내는 부사적 용법으로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀가 집으로 돌아왔을 때</span><span class=\"en\"><b>When she <span class=\"grammar-hl\">came back home</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 시간 후에,</span><span class=\"en\"><b>one hour later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 발견했다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자가 비어 있다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that the box was empty</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> found that the box was empty는 앞서 정성껏 준비한 상황과 완전히 대조되는 충격적인 결과를 보여줍니다. 11시부터 12시 사이라는 짧은 시간 동안 누군가가 케이크에 손을 댔음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">found that the box was empty 명사절 접속사 that: 타동사(found)의 목적어 자리에 명사절을 이끄는 접속사 that이 쓰였으며, 그 뒤에는 주어(the box)와 보어(empty)를 갖춘 완전한 형태의 절이 이어짐</div><div class=\"lec-gr-item\">came back home (관용표현): &#39;집으로 돌아오다&#39;라는 의미의 동사구 표현임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">empty</td><td class=\"m\">비어 있는, 빈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누군가 케이크 전체를 먹었다!</span><span class=\"en\"><b>Someone <span class=\"grammar-hl\">ate the whole cake</span>!</b></span></div></div><div class=\"lec-sent-ko\">누군가 케이크 전체를 먹었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Someone ate the whole cake는 상자가 비어 있었던 구체적인 원인이 무엇인지 단정하며 이야기를 마무리합니다. 정성껏 준비한 생일 케이크가 사라진 당혹스러운 상황을 강조하며, 범인이 누구인지에 대한 궁금증을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ate the whole cake 3형식(SVO) 구조: 타동사(ate) 뒤에 목적어(the whole cake)가 오는 전형적인 구조로, 주어의 동작이 직접적으로 미치는 대상을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">whole</td><td class=\"m\">전체의, 모든</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아빠의 생일을 맞아 엄마가 깜짝 선물로 케이크를 직접 구웠다.</li><li>엄마는 케이크를 상자에 넣어 주방 식탁에 두고 양초를 사러 나갔다.</li><li>한 시간 뒤 돌아와 보니 상자 안의 케이크는 온데간데없이 사라졌다.</li><li>누군가 엄마가 없는 사이에 케이크 전체를 다 먹어버리는 사건이 발생했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mom prepared a secret birthday cake for Dad, yet it completely vanished from the kitchen while she was briefly out to buy candles.</div>\n              <div class=\"lec-final-sum-ko\">어머니가 아버지를 위해 비밀 생일 케이크를 준비했지만, 그녀가 양초를 사러 잠시 나간 사이 부엌에서 케이크가 완전히 사라졌다.</div></div></div>"],"segs":[[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/3.mp3","hl":null},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/9.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/10.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/12.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/13.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/15.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/16.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/18.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/19.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/21.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/22.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/24.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/25.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/27.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/28.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문1_강의_audio/29.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문1_강의_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementB
