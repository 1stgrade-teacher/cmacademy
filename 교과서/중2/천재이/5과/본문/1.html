lass=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결정적 단서 발견</div><ul><li>존스 부인은 해리의 입가에 묻은 이물질을 보고 의문을 제기한다.</li><li>입 주변의 부스러기(crumbs) 발견</li><li>해리는 초콜릿 쿠키를 먹었다고 변명</li><li>핵심 키워드: 의심스러운 증거(suspicious evidence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 밝혀내다</td></tr><tr><td class=\"w\">in trouble</td><td class=\"m\">곤경에 처한, 문제에 휘말린</td></tr><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 조금</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘은</span><span class=\"en\"><b><span class=\"grammar-hl\">Today</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠의 생일이었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was Dad’s birthday.</span></b></span></div></div><div class=\"lec-sent-ko\">오늘은 아빠의 생일이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경이 되는 시점과 사건의 발단을 제시하며, 앞으로 벌어질 상황의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Today was Dad’s birthday. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비밀 선물로,</span><span class=\"en\"><b><span class=\"grammar-hl\">As a secret gift,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마는 그에게 케이크를 구워 주셨다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Mom baked</span> him a cake.</b></span></div></div><div class=\"lec-sent-ko\">비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 생일이라는 상황을 받아, 구체적으로 어떤 일이 준비되었는지 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As a secret gift, Mom baked 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 케이크를 상자에 포장했고</span><span class=\"en\"><b><span class=\"grammar-hl\">She wrapped the cake in a</span> box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 올려놓았다</span><span class=\"en\"><b>and put it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식탁 위에</span><span class=\"en\"><b>on the table</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에 있는</span><span class=\"en\"><b>in the kitchen.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엄마가 케이크를 보호하려 했던 위치를 설명하며, 이후 케이크가 사라지는 사건의 공간적 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">She wrapped the cake in a 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서 그녀는 밖으로 나갔다</span><span class=\"en\"><b>Then she went out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초를 사기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to buy</span> candles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시에</span><span class=\"en\"><b>at 11.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엄마가 집을 비우게 된 행동을 기술하여, 범인이 케이크를 먹을 수 있었던 시간적 여유를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;라는 의미로 쓰였으며, went의 목적을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀가 집에 돌아왔을 때</span><span class=\"en\"><b>When she came back home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 시간 후에,</span><span class=\"en\"><b>one hour later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 발견했다</span><span class=\"en\"><b>she found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자가 비어 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that the box was empty</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 외출 상황의 결과로 갈등 상황인 &#39;케이크 분실&#39;이 발생했음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that the box was empty (명사절(that절)): found의 목적어 역할을 하며, 절 내부에서 주어(the box)와 상태를 설명하는 보어(empty)를 갖춘 완전한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누군가가</span><span class=\"en\"><b><span class=\"grammar-hl\">Someone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹었다</span><span class=\"en\"><b><span class=\"grammar-hl\">ate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크 전체를!</span><span class=\"en\"><b><span class=\"grammar-hl\">the whole cake!</span></b></span></div></div><div class=\"lec-sent-ko\">누군가 케이크 전체를 먹었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 비어 있는 상자를 보고 엄마가 내린 결론이며, 사건의 핵심 과제인 범인 찾기를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Someone ate the whole cake! 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마는 Ms. Jones에게 전화했다</span><span class=\"en\"><b>Mom called Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을 찾기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to find</span> the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 먹은</span><span class=\"en\"><b><span class=\"grammar-hl\">who ate the cake</span>.</b></span></div></div><div class=\"lec-sent-ko\">엄마는 케이크를 먹은 사람을 찾기 위해 Ms. Jones에게 전화했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범인을 찾으려는 시도로, 문제 해결사를 등장시켜 이야기의 국면을 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to find (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;의 의미를 가집니다.</div><div class=\"lec-gr-item\">who ate the cake (관계대명사(주격)): 선행사 the person을 수식합니다. 절 내부에서 주어 역할을 하는 who 뒤에 동사(ate)가 바로 이어지는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b>Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명한 노부인이었다</span><span class=\"en\"><b>was a wise old lady</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옆집에 사는</span><span class=\"en\"><b><span class=\"grammar-hl\">who lived next door</span>.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 옆집에 사는 현명한 노부인이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로 등장한 인물이 가진 성격적 특성을 알려주어, 이후 그녀가 취할 해결 방식에 신뢰감을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who lived next door (관계대명사(주격)): 선행사 lady를 수식합니다. 절 내부에서 주어 역할을 하는 who 뒤에 동사(lived)가 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마을의 모든 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">Everyone in town</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀에게 왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">came to her</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 곤경에 처했을 때</span><span class=\"en\"><b>when they were in trouble.</b></span></div></div><div class=\"lec-sent-ko\">마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 지혜롭다는 특징을 보충 설명하여, 그녀가 이 마을의 공식적인 해결사임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Everyone in town came to her 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in trouble</td><td class=\"m\">곤경에 처한, 문제에 휘말린</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b><span class=\"grammar-hl\">Ms. Jones</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다정한 미소를 지으며</span><span class=\"en\"><b><span class=\"grammar-hl\">with her sweet</span> smile.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 다정한 미소를 지으며 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 심각한 분위기 속에서 인물의 여유로운 태도를 보여주어 사건 해결에 대한 기대감을 높입니다. 11. “Don’t worry! Let’s find out the big eater!” 사건을 해결하겠다는 의지를 보여주며, 긴장된 분위기를 누그러뜨리는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ms. Jones came with her sweet 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“걱정 마세요!</span><span class=\"en\"><b>“Don’t worry!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아냅시다</span><span class=\"en\"><b>Let’s <span class=\"grammar-hl\">find out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 대식가를!”</span><span class=\"en\"><b>the big eater!”</b></span></div></div><div class=\"lec-sent-ko\">(“걱정 말아요! 그 대식가를 찾아봅시다!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건을 해결하겠다는 의지를 보여주며, 긴장된 분위기를 누그러뜨리는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find out (관용표현): &#39;알아내다&#39; 또는 &#39;밝혀내다&#39;라는 뜻의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 밝혀내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 엄마에게 물었다,</span><span class=\"en\"><b>She asked Mom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“누가 집에 있었죠</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Who was in the house</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"><b><span class=\"grammar-hl\">this morning?</span>”</b></span></div></div><div class=\"lec-sent-ko\">그녀는 엄마에게 물었다, “누가 오늘 아침에 집에 있었죠?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 용의자를 추리기 위한 논리적 탐색을 시작하며 이야기의 본격적인 추리 과정을 이끕니다. 13. “My children, Harry, Carol, and Tom.” 범인이 될 수 있는 후보군을 구체적으로 나열하여 독자에게 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who was in the house this morning? 간접의문문(직접의문문 형태): 의문사(Who)로 시작하여 주어의 행방을 묻는 질문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“우리 아이들,</span><span class=\"en\"><b><span class=\"grammar-hl\">“My children,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Harry, Carol, 그리고 Tom이요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">Harry, Carol, and Tom.”</span></b></span></div></div><div class=\"lec-sent-ko\">“우리 아이들, Harry, Carol, 그리고 Tom이요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범인이 될 수 있는 후보군을 구체적으로 나열하여 독자에게 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“My children, Harry, Carol, and Tom.” 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는 Harry와 이야기했다,</span><span class=\"en\"><b>Ms. Jones spoke with Harry,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 큰 아들인,</span><span class=\"en\"><b><span class=\"grammar-hl\">the oldest son</span>,</b></span></div></div><div class=\"lec-sent-ko\">(먼저, 존스 부인은 첫째 아들인 해리에게 말을 걸었다, “누군가가 엄마의 케이크를 먹었단다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 용의자를 심문하며, 본격적으로 사건의 진상을 파헤치기 시작합니다. 15. “I played soccer, and I came back home around 11. I saw the box on the table and opened it. There was a cake inside, but I didn’t eat it.” 해리의 진술을 통해 그가 케이크를 보았음을 인정하게 하여, 그를 범인 후보로 계속 남겨둡니다. 16. “What did you do after that?” 앞선 해리의 진술을 토대로 행적을 더욱 깊이 추궁하여 단서를 찾아내려는 의도입니다. 17. “I just went to my room.” 자신의 결백을 주장하며 질문에 답변을 마칩니다. 18. “Hmm.... Then why do you have crumbs around your mouth?” 해리의 진술과 모순되는 시각적 증거를 제시하여, 탐정이 심리적 압박을 가하는 장면입니다. 19. “Oh, I ate some chocolate cookies because I was hungry.” 의심을 피하기 위한 해리의 변명을 제시하며, 과연 이 말이 진실인지 다음 전개를 궁금하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the oldest son (동격): 콤마(,)를 사용하여 앞의 명사 Harry에 대한 보충 설명(가장 큰 아들)을 제공합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“누군가 너희 엄마의 케이크를 먹었어.</span><span class=\"en\"><b>“Someone ate your mom’s cake.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 무엇을 했니</span><span class=\"en\"><b><span class=\"grammar-hl\">What did you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"><b><span class=\"grammar-hl\">this morning?”</span></b></span></div></div><div class=\"lec-sent-ko\">(오늘 아침에 무엇을 했니?”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해리의 진술을 통해 그가 케이크를 보았음을 인정하게 하여, 그를 범인 후보로 계속 남겨둡니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What did you do this morning?” 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 축구를 했고,</span><span class=\"en\"><b><span class=\"grammar-hl\">“I played soccer,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 돌아왔어요</span><span class=\"en\"><b><span class=\"grammar-hl\">and I came</span> back home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시쯤에.</span><span class=\"en\"><b>around 11.</b></span></div></div><div class=\"lec-sent-ko\">“저는 축구를 했고, 11시쯤 집에 돌아왔어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 해리의 진술을 토대로 행적을 더욱 깊이 추궁하여 단서를 찾아내려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“I played soccer, and I came 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 식탁 위의 상자를 보았고</span><span class=\"en\"><b><span class=\"grammar-hl\">I saw the box on the</span> table</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 열었어요.</span><span class=\"en\"><b>and opened it.</b></span></div></div><div class=\"lec-sent-ko\">저는 식탁 위에 있는 상자를 보았고 그것을 열었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 결백을 주장하며 질문에 답변을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I saw the box on the 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안에 케이크가 있었지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">There was a cake inside,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그것을 먹지 않았어요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">but</span> I didn’t eat it.”</b></span></div></div><div class=\"lec-sent-ko\">안에 케이크가 있었지만, 저는 그것을 먹지 않았어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해리의 진술과 모순되는 시각적 증거를 제시하여, 탐정이 심리적 압박을 가하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There was a cake inside, but 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 무엇을 했니</span><span class=\"en\"><b><span class=\"grammar-hl\">“What did you do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 다음에?”</span><span class=\"en\"><b><span class=\"grammar-hl\">after that?”</span></b></span></div></div><div class=\"lec-sent-ko\">“그런 다음에 너는 무엇을 했니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 의심을 피하기 위한 해리의 변명을 제시하며, 과연 이 말이 진실인지 다음 전개를 궁금하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“What did you do after that?” 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 그냥 갔어요</span><span class=\"en\"><b><span class=\"grammar-hl\">“I just went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 방으로.”</span><span class=\"en\"><b><span class=\"grammar-hl\">to my room.”</span></b></span></div></div><div class=\"lec-sent-ko\">“저는 그냥 제 방에 갔어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“I just went to my room.” 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“흠….</span><span class=\"en\"><b>“Hmm....</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 왜 부스러기가 있니</span><span class=\"en\"><b>Then <span class=\"grammar-hl\">why do you have</span> crumbs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 입 주변에?”</span><span class=\"en\"><b>around your mouth?”</b></span></div></div><div class=\"lec-sent-ko\">“흠…. 그러면 네 입 주변에 왜 부스러기가 있지?”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">why do you have 간접의문문(의문사 구문): why를 의문사로 사용하여 이유를 묻는 의문문 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 조금</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 22 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“오,</span><span class=\"en\"><b>“Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 초콜릿 쿠키를 조금 먹었어요</span><span class=\"en\"><b>I ate some chocolate cookies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배가 고팠기 때문에.”</span><span class=\"en\"><b><span class=\"grammar-hl\">because I was hungry</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“오, 저는 배가 고파서 초콜릿 쿠키를 조금 먹었어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because I was hungry (부사절(접속사)): because를 사용하여 &#39;왜냐하면 ~했기 때문에&#39;와 같이 동작의 이유를 설명합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>엄마가 아빠 생일 케이크를 구워 두었으나 외출한 사이 사라지는 사건이 발생한다.</li><li>동네의 지혜로운 해결사 존스 씨가 범인을 찾기 위해 집에 있던 아이들을 조사하기 시작한다.</li><li>첫째 아들 해리가 심문 대상이 되는데, 그가 케이크를 보았다는 사실과 입가의 부스러기가 발견되며 의심을 산다.</li><li>해리는 배가 고파서 쿠키를 먹은 것이라고 해명하며 자신의 결백을 주장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ms. Jones examines the children to identify the cake thief, while questioning Harry about the suspicious crumbs found on his face.</div>\n              <div class=\"lec-final-sum-ko\">존스 부인은 케이크 도둑을 찾기 위해 아이들을 조사하며, 해리의 얼굴에서 발견된 의심스러운 부스러기에 대해 그를 심문한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"},{"audio":"./1_audio/23.mp3","hl":"grammar"}],[{"audio":"./1_audio/24.mp3","hl":"mai
