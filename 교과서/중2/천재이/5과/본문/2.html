" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 설정 및 취조</div><ul><li>존스 씨는 사건 당일 오전 집에 머물렀던 딸 캐롤을 심문한다.</li><li>캐롤의 오전 활동: 집에 머무름 (stayed home)</li><li>심문 내용: 오전 11시에서 12시 사이의 행적 (activity between 11 and 12)</li><li>핵심 키워드: 취조(interrogation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02캐롤의 알리바이</div><ul><li>캐롤은 거실에서 책을 읽었으며 부엌에 갔을 때 빈 상자만 보았다고 주장한다.</li><li>캐롤의 활동: 추리 소설 읽기 (reading a detective novel)</li><li>부엌에서의 상황: 빈 상자를 발견함 (found the box)</li><li>케이크의 부재: 안에 내용물이 없었음 (couldn’t see the cake)</li><li>핵심 키워드: 알리바이(alibi)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03다이어트와 식습관</div><ul><li>캐롤은 다이어트 중이며 평소 초콜릿 케이크를 좋아하지 않는다고 진술한다.</li><li>다이어트 노력: 체중 감량을 위해 디저트 거부 (lose weight)</li><li>식습관: 초콜릿 케이크를 좋아하지 않음 (dislike chocolate cake)</li><li>성분 이유: 설탕과 버터가 너무 많음 (sugar and butter)</li><li>핵심 키워드: 식습관(eating habits)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04새로운 용의자 지목</div><ul><li>캐롤은 부엌에서 나오는 톰을 목격했다고 진술하며 의심을 돌린다.</li><li>목격 시점: 부엌 방문 당시 (time of visiting kitchen)</li><li>목격 대상: 부엌에서 나오는 톰 (Tom coming out)</li><li>핵심 키워드: 용의자(suspect)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정의, 형사의</td></tr><tr><td class=\"w\">lose weight</td><td class=\"m\">살을 빼다, 체중을 감량하다</td></tr><tr><td class=\"w\">most of all</td><td class=\"m\">무엇보다도, 가장 중요한 것은</td></tr><tr><td class=\"w\">exact</td><td class=\"m\">정확한, 꼼꼼한</td></tr><tr><td class=\"w\">come out of</td><td class=\"m\">~에서 나오다, ~에서 빠져나오다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음에,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는 Carol과 이야기했다,</span><span class=\"en\"><b>Ms. Jones talked to <span class=\"grammar-hl\">Carol,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 딸인</span><span class=\"en\"><b><span class=\"grammar-hl\">the daughter</span>.</b></span></div></div><div class=\"lec-sent-ko\">다음에, Ms. Jones는 딸 Carol과 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 다른 인물을 조사했던 상황을 이어받아, 수사 대상이 캐럴로 넘어갔음을 보여줍니다. 사건의 실마리를 찾기 위해 관계자들을 차례로 심문하는 탐정의 조사 과정을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Carol, the daughter (동격): 명사(Carol)와 명사구(the daughter)를 나란히 배치하여 동격 관계를 형성하며, 뒤의 명사구가 앞의 명사를 보충 설명함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 집에 머물렀다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">stayed home</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침 내내</span><span class=\"en\"><b>all morning.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 아침 내내 집에 머물렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐럴이 사건 당시에 어디에 있었는지 확인하는 단계입니다. 그녀가 사건 현장에 접근할 수 있었던 시간적 가능성을 제시하며, 범행 가능성을 검토할 기초 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed home (관용표현): &#39;stay home&#39;은 &#39;집에 머무르다&#39;라는 의미의 관용적 어구로, 전치사 없이 명사를 부사구처럼 사용하여 장소를 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones가 물었다,</span><span class=\"en\"><b>Ms. Jones asked,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“무엇을 너는 하고 있었니</span><span class=\"en\"><b>“<span class=\"grammar-hl\">What were you doing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시와 12시 사이에?”</span><span class=\"en\"><b>between 11 and 12?”</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones가 “너는 11시와 12시 사이에 무엇을 하고 있었니?”라고 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범행 발생 추정 시간에 캐럴이 무엇을 했는지 구체적으로 묻는 대목입니다. 앞 문장에서 확인한 &#39;집에 머물렀다&#39;는 사실을 바탕으로, 그 구체적인 행적을 추궁하여 알리바이를 확인하려는 의도입니다. 4. “I was reading a detective novel in the living room. I went to the kitchen to drink some water and found the box on the table. But I couldn’t see the cake inside the box. You know, I’m trying to lose weight these days. So, I don’t eat any dessert. Most of all, I don’t like chocolate cake. Too much sugar and butter in it.” 자신의 알리바이를 설명하면서, 동시에 용의선상에서 벗어나기 위해 자신은 케이크를 먹을 이유도, 동기도 없다는 점을 강조하는 대목입니다. 자신이 현장(부엌)에 갔던 사실은 인정하되, 범행 대상(케이크)에는 관심이 없었다는 점을 주장하며 혐의를 부정하는 상황입니다. 5. “When did you go to the kitchen?” 캐럴의 진술에서 사건 발생 시간과 부엌에 간 시점이 일치하는지 확인하려는 질문입니다. 앞서 캐럴이 부엌에 갔었다고 말했으므로, 그 정확한 타이밍을 파악해 범행 가능성을 재차 검증하려는 것입니다. 6. “I don’t know the exact time, but I saw Tom coming out of the kitchen.” 자신의 알리바이를 말하는 데서 그치지 않고, 또 다른 인물인 톰을 새로운 용의자로 지목하는 대목입니다. 조사관의 질문에 답하면서 동시에 책임을 다른 사람에게 돌리려는 캐럴의 방어적인 태도가 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What were you doing (간접의문문): 의문사(What)로 시작하여 주어(you)와 진행형 동사(were doing)가 이어지는 의문문 어순임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“나는 탐정 소설을 읽고 있었어요</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">was reading</span> a detective novel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거실에서.</span><span class=\"en\"><b>in the living room.</b></span></div></div><div class=\"lec-sent-ko\">“저는 거실에서 탐정 소설을 읽고 있었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 알리바이를 설명하면서, 동시에 용의선상에서 벗어나기 위해 자신은 케이크를 먹을 이유도, 동기도 없다는 점을 강조하는 대목입니다. 자신이 현장(부엌)에 갔던 사실은 인정하되, 범행 대상(케이크)에는 관심이 없었다는 점을 주장하며 혐의를 부정하는 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was reading (과거진행): be동사의 과거형(was)과 현재분사(reading)가 결합하여 과거의 특정 시점에 진행 중이었던 동작을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정의, 형사의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 부엌에 갔다</span><span class=\"en\"><b>I went to the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 좀 마시기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to drink</span> some water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 상자를 발견했다</span><span class=\"en\"><b>and found the box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식탁 위에 있는.</span><span class=\"en\"><b>on the table.</b></span></div></div><div class=\"lec-sent-ko\">저는 물을 좀 마시기 위해 부엌에 갔고 식탁 위에 있는 상자를 발견했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐럴의 진술에서 사건 발생 시간과 부엌에 간 시점이 일치하는지 확인하려는 질문입니다. 앞서 캐럴이 부엌에 갔었다고 말했으므로, 그 정확한 타이밍을 파악해 범행 가능성을 재차 검증하려는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to drink (to부정사): 문장 내에서 목적을 나타내는 부사적 용법으로 쓰여, 주어의 동작(went)이 발생한 이유를 설명함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 볼 수 없었어요</span><span class=\"en\"><b>But I <span class=\"grammar-hl\">couldn’t see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 케이크를</span><span class=\"en\"><b>the cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자 안에 있는.</span><span class=\"en\"><b>inside the box.</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 그 상자 안에 있는 케이크를 볼 수 없었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 알리바이를 말하는 데서 그치지 않고, 또 다른 인물인 톰을 새로운 용의자로 지목하는 대목입니다. 조사관의 질문에 답하면서 동시에 책임을 다른 사람에게 돌리려는 캐럴의 방어적인 태도가 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn’t see (관용표현): 조동사 can의 과거형인 could에 부정어 not이 결합하여 가능성을 부정하는 표현으로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아시다시피,</span><span class=\"en\"><b>You know,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 몸무게를 줄이려고 노력하고 있어요</span><span class=\"en\"><b>I’m <span class=\"grammar-hl\">trying to lose weight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요즘.</span><span class=\"en\"><b>these days.</b></span></div></div><div class=\"lec-sent-ko\">아시다시피, 저는 요즘 몸무게를 줄이려고 노력하고 있어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">trying to lose weight (to부정사): 동사 try의 목적어로 쓰인 명사적 용법의 to부정사(to lose)이며, weight라는 목적어를 취하는 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lose weight</td><td class=\"m\">살을 빼다, 체중을 감량하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 먹지 않아요</span><span class=\"en\"><b>I <span class=\"grammar-hl\">don’t eat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 디저트도.</span><span class=\"en\"><b>any dessert.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 디저트를 전혀 먹지 않아요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t eat (관용표현): 일반동사 eat을 부정하기 위해 조동사 do와 부정어 not을 결합한 기본적인 부정문 구조임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇보다도,</span><span class=\"en\"><b>Most of all,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 좋아하지 않아요</span><span class=\"en\"><b>I <span class=\"grammar-hl\">don’t like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초콜릿 케이크를.</span><span class=\"en\"><b>chocolate cake.</b></span></div></div><div class=\"lec-sent-ko\">무엇보다도, 저는 초콜릿 케이크를 좋아하지 않아요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t like (관용표현): 감정을 나타내는 일반동사 like를 부정하기 위해 조동사 do와 부정어 not을 결합함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">most of all</td><td class=\"m\">무엇보다도, 가장 중요한 것은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 설탕과 버터가 들어있어요</span><span class=\"en\"><b><span class=\"grammar-hl\">Too much sugar and butter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에.”</span><span class=\"en\"><b><span class=\"grammar-hl\">in it</span>.”</b></span></div></div><div class=\"lec-sent-ko\">그 안에 너무 많은 설탕과 버터가 들어있어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Too much sugar and butter in it 생략 구문: &#39;There is&#39;와 같은 유도부사가 생략된 형태로, 문맥상 주어와 동사가 결합된 문장을 함축하고 있음.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“언제 너는 갔니</span><span class=\"en\"><b>“When <span class=\"grammar-hl\">did you go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에?”</span><span class=\"en\"><b>to the kitchen?”</b></span></div></div><div class=\"lec-sent-ko\">“너는 언제 부엌에 갔니?”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did you go (간접의문문): 의문사(When)로 시작하며 조동사(did)와 주어(you), 동사원형(go)이 결합된 의문문 어순임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“나는 모른다</span><span class=\"en\"><b>“I don’t know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정확한 시간은,</span><span class=\"en\"><b>the exact time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는 Tom을 보았다</span><span class=\"en\"><b>but I <span class=\"grammar-hl\">saw Tom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에서 나오는.”</span><span class=\"en\"><b><span class=\"grammar-hl\">coming out</span> of the kitchen.”</b></span></div></div><div class=\"lec-sent-ko\">“저는 정확한 시간은 모르지만, Tom이 부엌에서 나오는 것을 봤어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw Tom coming out 5형식(SVOC) 구조: 지각동사 see + 목적어(Tom) + 목적보어(현재분사 coming)의 구조로, 목적어의 동작 상태를 직접 묘사함.</div><div class=\"lec-gr-item\">coming out (현재분사): 5형식 문장에서 목적어(Tom)의 동작을 능동적으로 설명하는 보어 역할을 하며, 진행 중인 동작임을 강조함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exact</td><td class=\"m\">정확한, 꼼꼼한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>존스 부인이 사건 조사를 위해 딸 캐럴을 심문한다.</li><li>캐럴은 오전 내내 집에 있었음을 밝히며, 본인은 다이어트 중이라 케이크에 관심이 없었다고 주장한다.</li><li>캐럴은 범행 가능성을 부인하면서 동시에 톰이 부엌에서 나오는 것을 보았다고 제보한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Carol claims she was reading in the living room while denying involvement in the missing cake, but she identifies Tom as leaving the kitchen area.</div>\n              <div class=\"lec-final-sum-ko\">캐럴은 거실에서 책을 읽고 있었다고 주장하며 케이크 절도 가담을 부인하지만, 톰이 주방에서 나오는 것을 보았다고 증언한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"grammar"}],[{"audio":"./2_audio/29.mp3","hl":"main"},{"audio":"./2_aud
