es가 막내 아들 Tom에게 엄마의 케이크를 좋아하는지 묻는다.</li><li>핵심 대상: 막내 아들(youngest son) Tom</li><li>대화 주제: 엄마의 케이크(mom&#39;s cake)를 좋아하는지 여부</li><li>핵심 키워드: 질문(ask)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02Tom의 알리바이</div><ul><li>Tom은 아침에 배가 아파서 계속 침대에 누워 있었다고 주장한다.</li><li>상황 설명: 아침에 케이크 굽는 냄새(smelled baking)를 맡음</li><li>상태 제시: 복통(stomachache) 때문에 누워 있었음</li><li>핵심 키워드: 침대(stayed in bed)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03주방 방문 시인</div><ul><li>Tom은 약을 먹기 위해 오전 중에 잠시 주방에 갔던 사실을 인정한다.</li><li>방문 시간: 오전 11시 30분경(about 11:30)</li><li>방문 목적: 약(medicine)을 복용하기 위함</li><li>핵심 키워드: 주방(kitchen)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04목격 및 행동</div><ul><li>상자가 열려 있어 케이크를 보았으며 직접 상자를 닫았다고 진술한다.</li><li>목격 상황: 상자가 열려 있어(box was open) 케이크를 봄</li><li>행동 완료: 확인 후 상자를 닫음(closed the box)</li><li>핵심 키워드: 목격(see)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05범인 특정</div><ul><li>Ms. Jones는 Tom의 말 속에서 모순을 발견하고 범인을 지목한다.</li><li>추리 원리: 거짓말(lied)을 한 사람이 범인임</li><li>결론 도출: Tom의 진술이 거짓임을 간파하고 미소 지음</li><li>핵심 키워드: 거짓말쟁이(person who lied)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finally</td><td class=\"m\">마침내, 결국</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">smell</td><td class=\"m\">냄새를 맡다, (특정한) 냄새가 나다</td></tr><tr><td class=\"w\">bake</td><td class=\"m\">(빵 등을) 굽다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stomachache</td><td class=\"m\">복통, 위통</td></tr><tr><td class=\"w\">stay in bed</td><td class=\"m\">누워 있다, 자리에 누워 쉬다</td></tr><tr><td class=\"w\">medicine</td><td class=\"m\">약, 약물</td></tr><tr><td class=\"w\">lie</td><td class=\"m\">거짓말하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b>Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만났는데</span><span class=\"en\"><b>met</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">막내아들 Tom을 만났다.</span><span class=\"en\"><b>Tom, <span class=\"grammar-hl\">the youngest son</span>.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, Ms. Jones는 막내아들 Tom을 만났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Jones 씨는 케이크를 누가 먹었는지 알아내기 위해 가족들을 한 명씩 조사해 왔으며, 이 문장은 그 조사의 마지막 순서로 Tom을 대면하게 되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the youngest son (동격): 앞의 명사 Tom과 콤마(,)로 연결되어 동일 인물을 보충 설명하는 명사구임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finally</td><td class=\"m\">마침내, 결국</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“Tom, 너는 엄마의 케이크를 좋아하지, 맞지?”</span><span class=\"en\"><b>“Tom,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>you like</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>your mom’s cake,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">right?</span>”</b></span></div></div><div class=\"lec-sent-ko\">“Tom, 너는 엄마의 케이크를 좋아하지, 맞지?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Jones 씨는 조사를 시작하며 Tom이 케이크를 먹었을 만한 동기, 즉 평소 식성을 먼저 확인하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">right? (부가의문문): 평서문 뒤에 짧게 덧붙여 상대방의 확인이나 동의를 구하는 의문문 형태임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“네,</span><span class=\"en\"><b>“Yeah,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 좋아하는데</span><span class=\"en\"><b>I <span class=\"grammar-hl\">like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 좋아해요.</span><span class=\"en\"><b><span class=\"grammar-hl\">it</span>.</b></span></div></div><div class=\"lec-sent-ko\">“네, 저는 그것을 좋아해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> stayed in bed는 Tom이 몸이 좋지 않아 케이크가 있는 곳으로 갈 수 없었다는 알리바이를 제시하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">like it 3형식 구조: 주어(I) + 동사(like) + 목적어(it)로 이루어진 문장이며, it은 앞서 언급된 cake를 가리킴.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>Actually,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 냄새를 맡았는데</span><span class=\"en\"><b>I <span class=\"grammar-hl\">smelled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마가</span><span class=\"en\"><b><span class=\"grammar-hl\">Mom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 굽는</span><span class=\"en\"><b><span class=\"grammar-hl\">baking</span> a cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침에 맡았어요.</span><span class=\"en\"><b>in the morning.</b></span></div></div><div class=\"lec-sent-ko\">사실, 저는 엄마가 아침에 케이크를 굽는 냄새를 맡았어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 Tom이 계속 누워 있었다고 말하자, Jones 씨는 그가 정말로 주방 근처에도 가지 않았는지 구체적인 동선을 캐묻고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">smelled Mom baking 5형식(SVOC) 구조: 지각동사(smell) + 목적어(Mom) + 목적보어(baking)로 이루어진 구조임.</div><div class=\"lec-gr-item\">baking (현재분사): 지각동사의 목적보어로 쓰여 목적어인 Mom의 동작이 진행 중임을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">smell</td><td class=\"m\">냄새를 맡다, (특정한) 냄새가 나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 배가 아파서</span><span class=\"en\"><b>I had a stomachache,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>so</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누워</span><span class=\"en\"><b>I <span class=\"grammar-hl\">stayed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침대에 있었어요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">in bed</span>.”</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 배가 아파서 침대에 누워 있었어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> closed the box는 Tom이 주방에 간 것은 사실이지만, 케이크를 먹지는 않고 오히려 열려 있던 상자를 닫아주는 선행을 베풀었다며 결백을 주장하는 의미입니다. 하지만 11시 30분에 상자가 열려 있었다고 구체적으로 말한 것이 범인을 밝혀내는 결정적인 단서가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed in bed (관용표현): &#39;누워 있다&#39; 또는 &#39;안정을 취하다&#39;라는 의미로 쓰이는 숙어적 표현임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stomachache</td><td class=\"m\">복통, 위통</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 갔었니</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Did you go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에?”</span><span class=\"en\"><b>to the kitchen?”</b></span></div></div><div class=\"lec-sent-ko\">“너는 부엌에 갔었니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> The person who lied는 Tom의 진술에서 앞뒤가 맞지 않는 모순점을 찾아낸 Jones 씨가 그를 범인으로 지목하며 수사를 마무리 짓는 순간을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you go 일반동사 의문문: 과거 시제 일반동사의 의문문을 만들기 위해 조동사 Did를 주어 앞에 쓰고 동사원형 go를 사용함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“네,</span><span class=\"en\"><b>“Yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 갔는데</span><span class=\"en\"><b>I went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에</span><span class=\"en\"><b>to the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약을 먹으러</span><span class=\"en\"><b><span class=\"grammar-hl\">to take</span> some medicine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시 30분쯤 갔어요.</span><span class=\"en\"><b>at about 11:30.</b></span></div></div><div class=\"lec-sent-ko\">“네, 저는 11시 30분쯤 약을 먹으러 부엌에 갔어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take (to부정사): 부사적 용법 중 &#39;목적&#39;을 나타내며, &#39;~하기 위해서&#39;라고 해석함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">medicine</td><td class=\"m\">약, 약물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상자는</span><span class=\"en\"><b>The box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열려 있었고,</span><span class=\"en\"><b>was open,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>so</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 볼 수 있었어요</span><span class=\"en\"><b>I <span class=\"grammar-hl\">could see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를</span><span class=\"en\"><b>the cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에 있는.</span><span class=\"en\"><b>in it.</b></span></div></div><div class=\"lec-sent-ko\">상자는 열려 있었고, 그래서 저는 그 안에 있는 케이크를 볼 수 있었어요.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could see (조동사): 능력이나 가능성을 나타내는 조동사 can의 과거형 could 뒤에 동사원형 see가 결합된 형태임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I <span class=\"grammar-hl\">closed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">닫았는데</span><span class=\"en\"><b><span class=\"grammar-hl\">the box</span>.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자를 닫았어요.”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그러고 나서 저는 상자를 닫았어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">closed the box (과거시제): 규칙 변화 동사 close의 어미에 -d를 붙여 과거에 일어난 사실을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones가</span><span class=\"en\"><b>Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웃으면서</span><span class=\"en\"><b>smiled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말하기를,</span><span class=\"en\"><b>and said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“사람이</span><span class=\"en\"><b>“The person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거짓말을 한</span><span class=\"en\"><b><span class=\"grammar-hl\">who lied</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹었는데</span><span class=\"en\"><b>ate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 먹었어.”</span><span class=\"en\"><b>the cake.”</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones가 웃으면서 말했다. “거짓말을 한 사람이 케이크를 먹었어.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> The person who lied는 Tom의 진술에서 앞뒤가 맞지 않는 모순점을 찾아낸 Jones 씨가 그를 범인으로 지목하며 수사를 마무리 짓는 순간을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who lied (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사인 The person을 수식하며, 관계절 내에서 주어 역할을 수행함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lie</td><td class=\"m\">거짓말하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>케이크가 없어진 사건을 조사하던 Jones 씨가 마지막으로 막내아들 Tom을 심문한다.</li><li>Tom은 아침에 아파서 누워 있었다고 주장하며 자신의 알리바이를 내세운다.</li><li>그러나 약을 먹으러 주방에 갔을 때 케이크 상자가 열려 있어서 닫아두었다는 상세한 설명을 덧붙인다.</li><li>Jones 씨는 Tom의 진술 속 모순을 통해 그가 거짓말을 하고 있는 범인임을 확신한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\
