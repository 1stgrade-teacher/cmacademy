Nw/vL9dy889ueeR2z2xRuX+8vP+0Pr6/wA/UDqRkC6tv67W6W/P8UBAPrnj3zjkZ+h//WOcnYZ56knjA/rjt+eepoyOoZDnP8Q9++cY9Dz+JNLx/eX/AL6X/GgPxT1X/A/qzt1sJ6YwBk/54/yPTk0HqD17fQkgf/WPX+dLkeq/99L/AI0ZHqv/AH0v+PX6en5gf129f8v0D0/z+f5UvP8A+rn27dB6/rTcqT95eP8AaXqcj19M9eOnqKdgLkZAPHBIGM59DjHQfjkjkGi346B/X9f1/wAFD69D7e3Trnp2zRS8cnIB5yMj8eh6DofqB3FNyOmR1HQjqeh6+5z7ZzQHz6f8G39dQzg4/Hj68/zz/wDXoJG1sdQOOeh/AH8OOBnOcCjK45Ixg46H8PoOMjrjHHejAIJHdTzz027v/QefpyfWhdGvvDR3T9P+H+X6H//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Case of the Missing Cake: Identifying the Liar<small>사라진 케이크 사건: 거짓말쟁이를 찾아라</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 사건을 해결하는 과정에서 단서를 찾아 범인을 지목하는 추리(Deduction)의 형식을 띠고 있는데, 이는 마치 셜록 홈즈가 사소한 정황 증거(Circumstantial evidence)를 통해 진실을 파헤치는 것과 비슷해요. 추리 소설에서는 각 용의자가 제시하는 알리바이(Alibi)가 정말 사실인지, 그리고 그들의 진술 속에 논리적 모순이 없는지를 확인하는 것이 핵심이죠. 예를 들어, 식사 시간대나 음식에 대한 선호도 같은 사소한 정보(Clue)들이 모여 범인을 가리키는 결정적인 퍼즐 조각이 된답니다. 우리가 일상생활에서 누군가의 말을 들을 때 앞뒤가 맞는지 따져보는 습관이 바로 이런 추리적 사고의 기초라고 할 수 있어요. 이번 이야기를 읽을 때도 인물들의 대사 하나하나에 논리적 허점이 숨어 있지는 않은지 집중해서 살펴보면 훨씬 재미있게 지문을 이해하실 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01사건 발생</div><ul><li>엄마가 아빠의 생일 선물로 만든 케이크가 사라지는 사건이 발생한다.</li><li>엄마가 만든 케이크(birthday cake)가 주방 식탁에서 사라짐</li><li>외출 후 돌아온 엄마가 빈 상자(empty box)를 발견함</li><li>지혜로운 이웃인 존스 부인(Ms. Jones)에게 도움을 요청함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02첫 번째 용의자 조사</div><ul><li>가장 먼저 질문을 받은 큰아들 해리는 케이크를 먹지 않았다고 주장한다.</li><li>해리(Harry)는 축구를 하고 돌아와 상자를 열어보았다고 진술함</li><li>입가에 묻은 부스러기(crumbs)에 대해 질문받음</li><li>배가 고파서 초콜릿 쿠키(chocolate cookies)를 먹었다고 해명함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03두 번째 용의자 조사</div><ul><li>둘째 딸 캐럴은 다이어트를 이유로 초콜릿 케이크를 먹지 않았다고 진술한다.</li><li>캐럴(Carol)은 거실에서 추리 소설(detective novel)을 읽고 있었음</li><li>체중 감량(lose weight)을 위해 디저트를 피한다고 주장함</li><li>주방에서 나오는 톰(Tom)을 목격했다고 증언함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04세 번째 용의자 조사</div><ul><li>막내아들 톰은 복통으로 인해 침대에 있었다고 주장한다.</li><li>톰(Tom)은 케이크 냄새를 맡았지만 배가 아파(stomachache) 누워 있었다고 함</li><li>오전 11시 30분경 약을 먹으러 주방에 갔다고 진술함</li><li>열려 있는 상자 안의 케이크를 보았고 상자를 닫았다고 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05범인 식별</div><ul><li>존스 부인은 세 아이의 진술을 종합하여 거짓말을 한 사람을 찾아낸다.</li><li>범인은 식별(identify)하기 위해 각자의 알리바이 조사</li><li>거짓말을 한 사람(the person who lied)이 범인임을 암시</li><li>케이크 실종 사건의 진실을 추론함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 밝혀내다</td></tr><tr><td class=\"w\">in trouble</td><td class=\"m\">곤경에 처한, 문제에 빠진</td></tr><tr><td class=\"w\">come out of</td><td class=\"m\">~에서 나오다</td></tr><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 파편</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정, 형사</td></tr><tr><td class=\"w\">lose weight</td><td class=\"m\">살을 빼다, 체중을 줄이다</td></tr><tr><td class=\"w\">stomachache</td><td class=\"m\">복통, 위통</td></tr><tr><td class=\"w\">lie</td><td class=\"m\">거짓말하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘은</span><span class=\"en\"><b><span class=\"grammar-hl\">Today</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠의 생신이었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was Dad’s birthday.</span></b></span></div></div><div class=\"lec-sent-ko\">오늘은 아빠의 생일이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 배경을 설정하며, 이후 발생할 사건의 주된 소재인 &#39;케이크&#39;가 등장하게 된 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Today was Dad’s birthday. (2형식): [주어+동사+보어] 구조로, Today가 주어, was가 2형식 동사, Dad&#39;s birthday가 보어인 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비밀 선물로,</span><span class=\"en\"><b>As a secret gift,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마는 그에게 구워 주셨는데</span><span class=\"en\"><b>Mom <span class=\"grammar-hl\">baked him a cake</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">비밀 선물로, 엄마는 그에게 케이크를 구워 주셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장의 상황을 구체화하여, 가족들 몰래 준비한 특별한 선물이 존재함을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">baked him a cake (4형식): [주어+동사+간접목적어+직접목적어] 구조로, Mom이 주어, baked가 동사, him(간접목적어), a cake(직접목적어)가 각각 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마는 케이크를 상자에 넣어 포장했고</span><span class=\"en\"><b>She <span class=\"grammar-hl\">wrapped</span> the cake in a box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 올려두었다</span><span class=\"en\"><b>and put it on the table in the kitchen.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌 탁자 위에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 상자에 케이크를 포장했고 그것을 부엌에 있는 식탁에 올려놓았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 케이크가 사라지기 직전의 위치를 명시하여 사건이 발생하는 공간적 단서를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wrapped (과거시제): 주어의 동작을 나타내는 일반동사 과거형이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>Then she went out <span class=\"grammar-hl\">to buy</span> candles at 11.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마는 나갔는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">양초를 사러</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그러고 나서 그녀는 11시에 초를 사기 위해서 밖으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엄마가 자리를 비운 구체적인 시간을 제시함으로써 사건이 발생할 수 있는 시간적 공백을 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): 부사적 용법 중 목적(~하기 위해서)으로 쓰여, went out의 목적을 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 시간 후에 집에 돌아왔을 때,</span><span class=\"en\"><b>When she came back home one hour later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄마는 발견했다</span><span class=\"en\"><b>she found <span class=\"grammar-hl\">that the box was empty</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자가 비어 있다는 것을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀가 한 시간 후에 집에 돌아왔을 때, 그녀는 상자가 비어 있는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건의 발단으로, 독자에게 미스터리한 상황을 알리며 범인을 찾아야 하는 당위성을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that the box was empty (명사절): found의 목적어 역할을 하는 절로, that이 명사절 접속사로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누군가가</span><span class=\"en\"><b>Someone <span class=\"grammar-hl\">ate</span> the whole cake!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹어버렸다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크 전체를!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">누군가 케이크 전체를 먹었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 빈 상자 상태를 보고 엄마가 내린 결론으로, 해결해야 할 갈등을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ate (과거시제): 과거의 사실을 나타내는 일반동사 과거형이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마는 존스 부인을 불렀는데</span><span class=\"en\"><b>Mom called Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을 찾기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to find</span> the person <span class=\"grammar-hl\">who ate the cake</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 먹은.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">엄마는 케이크를 먹은 사람을 찾기 위해 Ms. Jones에게 전화했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건 해결을 위해 탐정 역할을 할 조력자를 등장시켜 이야기의 전환점을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to find (to부정사): 부사적 용법 중 목적(~하기 위해서)으로 쓰여, called의 목적을 설명한다.</div><div class=\"lec-gr-item\">who ate the cake (관계대명사): 주격 관계대명사절로, 앞의 선행사 the person을 수식한다. 절 내부에서 who가 주어 역할을 하므로 뒤에 동사(ate)가 바로 이어진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">존스 부인은 지혜로운 노부인이었는데</span><span class=\"en\"><b>Ms. Jones was a wise old lady</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옆집에 사는.</span><span class=\"en\"><b><span class=\"grammar-hl\">who lived next door</span>.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 옆집에 사는 현명한 노부인이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 존스 부인의 성격을 규정하여 그녀가 왜 사건을 해결할 수 있는 인물인지에 대한 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who lived next door (관계대명사): 주격 관계대명사절로, 앞의 선행사 a wise old lady를 수식한다. 절 내부에서 who가 주어 역할을 하므로 뒤에 동사(lived)가 바로 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">지혜로운, 현명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마을의 모든 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">Everyone in town</span> came to her</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀에게 왔다</span><span class=\"en\"><b>when they were in trouble.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려움이 있을 때.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;지혜롭다&#39;는 평가를 마을 사람들의 평판이라는 구체적인 사례로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Everyone in town (주어): Everyone이 주어이며 전치사구 in town이 이를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in trouble</td><td class=\"m\">곤경에 처한, 문제에 빠진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">존스 부인은 왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">Ms. Jones came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다정한 미소를 띠고.</span><span class=\"en\"><b>with her sweet smile.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 다정한 미소를 지으며 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범인을 심문해야 하는 긴장된 상황과 부인의 평온한 태도를 대비시켜 그녀의 여유로움을 보여줍니다. 11. “Don’t worry! Let’s find out the big eater!” 사건 해결에 대한 자신감을 드러내며 본격적인 탐문 수사의 시작을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ms. Jones came (1형식): [주어+동사] 구조로, Ms. Jones가 주어, came이 1형식 동사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“걱정 마세요!</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Don’t worry</span>!</b></span></div></div><div class=\"lec-sent-ko\">&quot;걱정 마세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건 해결에 대한 자신감을 드러내며 본격적인 탐문 수사의 시작을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t worry (관용표현): 명령문 부정형으로, 상대방에게 ~하지 말라고 당부하는 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">찾아봅시다</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s find out</span> the big eater!”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범인을!”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">대식가를 알아냅시다!&quot;</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수사의 첫 번째 단계로 용의자 명단을 확보하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s find out (관용표현): Let us의 줄임말로 &#39;~하자&#39;라는 제안을 나타내며, find out은 &#39;알아내다&#39;라는 의미의 이어동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 밝혀내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 엄마에게 물었는데</span><span class=\"en\"><b>She asked Mom, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누가 집에 있었는지</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Who was in the house</span> this morning?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 엄마에게 물었다, “누가 오늘 아침에 집에 있었죠?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수사의 첫 번째 단계로 용의자 명단을 확보하는 과정을 보여줍니다. 13. “My children, Harry, Carol, and Tom.” 세 명의 용의자를 구체적으로 지목하여 본격적인 추리극의 서막을 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who was in the house (간접의문문): 의문사(Who)가 이끄는 절이 asked의 목적어로 쓰였다. 어순은 [의문사 + 주어 + 동사]가 기본이나, Who 자체가 주어 역할을 하여 [의문사(주어) + 동사] 형태를 띤다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“제 아이들인</span><span class=\"en\"><b>“My children,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해리, 캐럴, 그리고 톰이요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">Harry, Carol, and Tom</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“우리 아이들, Harry, Carol, 그리고 Tom이요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 용의자들을 한 명씩 대면하는 수사 방식의 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Harry, Carol, and Tom (동격): 앞의 명사 My children을 구체적으로 나열하며 설명하는 동격 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">먼저,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">존스 부인은 해리에게 말했다</span><span class=\"en\"><b>Ms. Jones spoke with Harry,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맏아들인</span><span class=\"en\"><b><span class=\"grammar-hl\">the oldest son</span>, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“누군가가 네 엄마의 케이크를 먹었단다.</span><span class=\"en\"><b>“Someone ate your mom’s cake.</b></span></div></div><div class=\"lec-sent-ko\">처음에, Ms. Jones는 큰 아들 Harry와 이야기했다. “누군가 너희 엄마의 케이크를 먹었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 용의자들을 한 명씩 대면하는 수사 방식의 도입부입니다. 15. “I played soccer, and I came back home around 11. I saw the box on the table and opened it. There was a cake inside, but I didn’t eat it.” 해리가 자신의 알리바이를 제시하며 케이크를 보았음을 시인합니다. 16. “What did you do after that?” 해리의 진술에서 공백을 찾아내어 더 구체적인 행동을 끌어내려는 질문입니다. 17. “I just went to my room.” 자신의 방으로 향했다는 해리의 단순한 대답입니다. 18. “Hmm.... Then why do you have crumbs around your mouth?” 수사 과정에서 결정적인 단서를 포착하여 상대방을 압박하는 긴장된 순간입니다. 19. “Oh, I ate some chocolate cookies because I was hungry.” 앞서 발견된 부스러기에 대해 해리가 제시하는 해명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the oldest son (동격): 앞의 명사 Harry를 보충 설명하며 신분을 나타내는 동격 어구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What did you do</span> this morning?”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">했니</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">오늘 아침에 너는 무엇을 했니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해리의 진술에서 공백을 찾아내어 더 구체적인 행동을 끌어내려는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What did you do (의문문): 조동사 did를 사용하여 과거의 행동을 묻는 일반의문문 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 축구를 했고,</span><span class=\"en\"><b>“I played soccer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 집에 돌아왔어요</span><span class=\"en\"><b>and I <span class=\"grammar-hl\">came back home</span> around 11.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시쯤에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“저는 축구를 했고, 11시쯤 집에 돌아왔어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 방으로 향했다는 해리의 단순한 대답입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came back home (1형식): come은 여기서 1형식으로 쓰였고, back home은 부사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 탁자 위에 있는 상자를 보고</span><span class=\"en\"><b>I <span class=\"grammar-hl\">saw the box on the table</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열어봤어요.</span><span class=\"en\"><b><span class=\"grammar-hl\">and opened it</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 식탁 위에 있는 상자를 보았고 그것을 열었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수사 과정에서 결정적인 단서를 포착하여 상대방을 압박하는 긴장된 순간입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw the box on the table and opened it (병렬구조): saw와 opened가 and를 중심으로 동사 과거형으로 병렬 연결되었다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안에 케이크가 있었지만,</span><span class=\"en\"><b>There was a cake inside,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그것을 먹지 않았어요.</span><span class=\"en\"><b>but I <span class=\"grammar-hl\">didn’t eat</span> it.”</b></span></div></div><div class=\"lec-sent-ko\">안에 케이크가 있었지만, 저는 그것을 먹지 않았어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 발견된 부스러기에 대해 해리가 제시하는 해명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t eat (부정문): 일반동사 과거형의 부정문으로, [did + not + 동사원형] 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을 했나요</span><span class=\"en\"><b>“What did you do</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 후에?</span><span class=\"en\"><b>after that?”</b></span></div></div><div class=\"lec-sent-ko\">“그런 다음에 너는 무엇을 했니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 용의자로 수사 대상을 옮기는 자연스러운 전환입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">crumbs 명사: 문장에서 왜 부스러기가 입 주변에 있는지 이유를 묻는 단서로 사용되었다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 그냥 갔어요</span><span class=\"en\"><b>“I just went to my room.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 방으로.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“저는 그냥 제 방에 갔어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐롤이 집에 계속 있었다는 사실을 통해, 그녀가 범인일 가능성이 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because I was hungry 접속사: because가 이끄는 부사절이 이유를 나타내며, 주절에 뒤따라온다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음....</span><span class=\"en\"><b>“Hmm....</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇다면 왜 부스러기가 있나요</span><span class=\"en\"><b>Then why do you have crumbs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입 주변에?</span><span class=\"en\"><b>around your mouth?”</b></span></div></div><div class=\"lec-sent-ko\">“흠…. 그러면 네 입 주변에 왜 부스러기가 있지?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범행이 일어난 결정적인 시간대를 특정하여 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked to (관용표현): &#39;~에게 말하다&#39;라는 의미의 전치사 결합 동사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crumb</td><td class=\"m\">부스러기, 파편</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 23 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아,</span><span class=\"en\"><b>“Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 초콜릿 쿠키를 좀 먹었는데</span><span class=\"en\"><b>I ate some chocolate cookies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배가 고파서.</span><span class=\"en\"><b>because I was hungry.”</b></span></div></div><div class=\"lec-sent-ko\">“오, 저는 배가 고파서 초콜릿 쿠키를 조금 먹었어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐롤이 자신의 상황을 설명하며 케이크가 없었다는 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What were you doing (과거진행): [be동사 과거(were) + 현재분사(-ing)] 구조로, 과거 특정 시점의 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음으로,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">존스 선생님은 캐롤과 이야기했는데</span><span class=\"en\"><b>Ms. Jones talked to Carol,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">딸인.</span><span class=\"en\"><b>the daughter.</b></span></div></div><div class=\"lec-sent-ko\">다음에, Ms. Jones는 딸 Carol과 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 용의자로 수사 대상을 옮기는 자연스러운 전환입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was reading (과거진행): [be동사 과거(was) + 현재분사(-ing)] 구조로, 과거에 진행 중이던 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 집에 머물렀는데</span><span class=\"en\"><b>She stayed home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오전 내내.</span><span class=\"en\"><b>all morning.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 아침 내내 집에 머물렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐롤이 집에 계속 있었다는 사실을 통해, 그녀가 범인일 가능성이 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">trying to lose weight (to부정사): try의 목적어로 쓰인 명사적 용법의 to부정사 구문이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">존스 선생님이 물었는데</span><span class=\"en\"><b>Ms. Jones asked, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 하고 있었나요</span><span class=\"en\"><b>“What were you doing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시와 12시 사이에?</span><span class=\"en\"><b>between 11 and 12?”</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones가 “너는 11시와 12시 사이에 무엇을 하고 있었니?”라고 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범행이 일어난 결정적인 시간대를 특정하여 질문을 던집니다. 23. “I was reading a detective novel in the living room. I went to the kitchen to drink some water and found the box on the table. But I couldn’t see the cake inside the box.” 캐롤이 자신의 상황을 설명하며 케이크가 없었다는 정보를 제공합니다. 24. “You know, I’m trying to lose weight these days. So, I don’t eat any dessert. Most of all, I don’t like chocolate cake. Too much sugar and butter in it.” 범행 동기를 스스로 부정하며 결백을 강력하게 주장하는 대목입니다. 25. “When did you go to the kitchen?” 캐롤의 알리바이를 확인하기 위해 시간대를 재차 확인하는 질문입니다. 26. “I don’t know the exact time, but I saw Tom coming out of the kitchen.” 캐롤이 새로운 용의자를 지목하며 자신의 혐의를 벗으려 하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">coming out of (현재분사): I saw(지각동사) + Tom(목적어) + coming(목적보어) 구조의 5형식 문장이다. 현재분사가 목적어의 동작을 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 추리 소설을 읽고 있었는데</span><span class=\"en\"><b>“I was reading a detective novel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거실에서.</span><span class=\"en\"><b>in the living room.</b></span></div></div><div class=\"lec-sent-ko\">“저는 거실에서 탐정 소설을 읽고 있었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 모든 용의자 확인이 완료되는 마지막 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the youngest son (동격): Tom을 구체화하는 동격 설명어구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정, 형사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 부엌에 갔고</span><span class=\"en\"><b>I went to the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 좀 마시러</span><span class=\"en\"><b>to drink some water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자를 발견했는데</span><span class=\"en\"><b>and found the box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식탁 위의.</span><span class=\"en\"><b>on the table.</b></span></div></div><div class=\"lec-sent-ko\">저는 물을 좀 마시기 위해 부엌에 갔고 식탁 위에 있는 상자를 발견했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰이 케이크를 좋아한다는 사실을 확인하여 범행 동기를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">smelled Mom baking a cake (5형식): [지각동사(smelled) + 목적어(Mom) + 목적보어(baking)] 구조로, baking은 현재분사가 사용되어 목적어의 동작을 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 저는 케이크를 볼 수 없었는데</span><span class=\"en\"><b>But I couldn’t see the cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자 안의.</span><span class=\"en\"><b>inside the box.</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 그 상자 안에 있는 케이크를 볼 수 없었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰이 자신의 아픈 상태를 알리며 알리바이를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed in bed (1형식): [주어+동사+부사구] 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있잖아요,</span><span class=\"en\"><b>You know,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 살을 빼려고 노력 중인데</span><span class=\"en\"><b>I’m trying to lose weight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요즘.</span><span class=\"en\"><b>these days.</b></span></div></div><div class=\"lec-sent-ko\">아시다시피, 저는 요즘 몸무게를 줄이려고 노력하고 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰의 진술에서 사실관계를 파악하려는 존스 부인의 직설적인 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take some medicine (to부정사): 부사적 용법 중 목적(~하기 위해서)으로 쓰여, went to the kitchen의 이유를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lose weight</td><td class=\"m\">살을 빼다, 체중을 줄이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 먹지 않아요</span><span class=\"en\"><b>I don’t eat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 디저트도.</span><span class=\"en\"><b>any dessert.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 디저트를 전혀 먹지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 톰이 케이크를 보았음을 시인하지만, 먹지는 않았다고 진술하는 부분입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The box was open (2형식): [주어+be동사+형용사] 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇보다도,</span><span class=\"en\"><b>Most of all,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 초콜릿 케이크를 좋아하지 않아요.</span><span class=\"en\"><b>I don’t like chocolate cake.</b></span></div></div><div class=\"lec-sent-ko\">무엇보다도, 저는 초콜릿 케이크를 좋아하지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 모든 조사를 마친 뒤 범인을 지목하는 논리적인 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The person who lied (관계대명사): 주격 관계대명사절로, 선행사 The person을 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">설탕과 버터가 너무 많은</span><span class=\"en\"><b><span class=\"grammar-hl\">Too much sugar and butter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in</span> it.”</b></span></div></div><div class=\"lec-sent-ko\">그 안에 너무 많은 설탕과 버터가 들어있어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Too much sugar and butter in 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언제 갔나요</span><span class=\"en\"><b><span class=\"grammar-hl\">“When did you go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에?</span><span class=\"en\"><b><span class=\"grammar-hl\">to the</span> kitchen?”</b></span></div></div><div class=\"lec-sent-ko\">“너는 언제 부엌에 갔니?”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“When did you go to the 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 45</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 정확한 시간은 모르지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">“I don’t know the exact time,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">톰을 봤는데</span><span class=\"en\"><b>but I saw Tom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나오는 것을</span><span class=\"en\"><b>coming out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에서.</span><span class=\"en\"><b>of the kitchen.”</b></span></div></div><div class=\"lec-sent-ko\">“저는 정확한 시간은 모르지만, Tom이 부엌에서 나오는 것을 봤어요.”</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-it
