e-1\"><div class=\"lec-stage-head\">02캐럴의 행적과 발견</div><ul><li>캐럴은 거실에서 소설을 읽다가 주방에서 빈 상자를 발견했다고 답한다.</li><li>거실(living room)에서 추리 소설을 읽고 있었음</li><li>물을 마시러 주방(kitchen)에 갔다가 탁자 위의 상자를 발견함</li><li>상자 안의 케이크(cake)를 볼 수 없었음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03범행 부인 및 근거</div><ul><li>캐럴은 다이어트와 개인적 취향을 이유로 케이크에 손대지 않았다고 주장한다.</li><li>현재 체중 감량(lose weight) 중이라 디저트를 먹지 않음</li><li>설탕과 버터가 많은 초콜릿 케이크(chocolate cake)를 싫어함</li><li>핵심 키워드: 설탕과 버터(sugar and butter)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04목격담 제시</div><ul><li>캐럴은 주방에서 나오는 다른 인물을 목격했다고 진술하며 대화를 마친다.</li><li>정확한 시간은 알지 못함</li><li>주방에서 나오는 톰(Tom)을 목격함</li><li>핵심 키워드: 목격(saw)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">talk to</td><td class=\"m\">~에게 말을 걸다, ~와 대화하다</td></tr><tr><td class=\"w\">detective</td><td class=\"m\">탐정의, 수사의</td></tr><tr><td class=\"w\">novel</td><td class=\"m\">소설</td></tr><tr><td class=\"w\">lose weight</td><td class=\"m\">체중을 감량하다, 살을 빼다</td></tr><tr><td class=\"w\">these days</td><td class=\"m\">요즘, 최근에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dessert</td><td class=\"m\">디저트, 후식</td></tr><tr><td class=\"w\">most of all</td><td class=\"m\">무엇보다도, 특히</td></tr><tr><td class=\"w\">exact</td><td class=\"m\">정확한, 정밀한</td></tr><tr><td class=\"w\">come out of</td><td class=\"m\">~에서 나오다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음에,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는 딸 Carol과 이야기했다.</span><span class=\"en\"><b>Ms. Jones <span class=\"grammar-hl\">talked to</span> Carol, the daughter.</b></span></div></div><div class=\"lec-sent-ko\">다음에, Ms. Jones는 딸 Carol과 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 조사 대상에 이어 다음 용의자로 지목된 인물을 심문하기 시작하는 단계입니다. Next라는 표현은 이 대화가 일련의 수사 과정 중 하나임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked to (관용표현): &#39;talk to + 사람&#39;은 &#39;~에게 말을 걸다&#39;라는 의미로 사용되는 자동사와 전치사의 결합 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 집에 머물렀다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">stayed home</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침 내내.</span><span class=\"en\"><b>all morning.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 아침 내내 집에 머물렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Carol이 사건 발생 시간에 현장에 있었음을 확인해 주는 배경 정보입니다. 집 안에 계속 있었으므로 사건에 대해 알거나 개입했을 가능성이 충분하다는 전제를 깔아줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stayed home 1형식 구조: stayed는 자동사로 쓰였으며, 뒤의 home은 &#39;집에&#39;라는 의미의 장소 부사로 기능하는 1형식(주어+동사) 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones가 물었다,</span><span class=\"en\"><b>Ms. Jones asked,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“너는 무엇을 하고 있었니</span><span class=\"en\"><b>“What <span class=\"grammar-hl\">were you doing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">11시와 12시 사이에?”</span><span class=\"en\"><b>between 11 and 12?”</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones가 “너는 11시와 12시 사이에 무엇을 하고 있었니?”라고 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수사관이 사건이 발생한 것으로 추정되는 구체적인 시간대를 제시하며 Carol의 알리바이를 확인하는 질문입니다. 수사의 핵심이 되는 골든 타임을 특정하여 상대방을 압박하는 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were you doing (과거진행): be동사의 과거형(were) + 현재분사(-ing) 형태가 의문문 어순(be + S + -ing)으로 쓰여 과거 특정 시점에 진행 중이었던 동작을 묻는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 탐정 소설을 읽고 있었어요</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">was reading</span> a detective novel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거실에서.</span><span class=\"en\"><b>in the living room.</b></span></div></div><div class=\"lec-sent-ko\">“저는 거실에서 탐정 소설을 읽고 있었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Carol이 자신의 알리바이를 제시하는 문장입니다. reading a detective novel은 그녀가 거실이라는 공개된 장소에 머물며 다른 일에 집중하고 있었음을 주장하며 혐의를 부인하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was reading (과거진행): be동사의 과거형(was) + 현재분사(-ing) 형태로 과거에 지속되고 있었던 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detective</td><td class=\"m\">탐정의, 수사의</td></tr><tr><td class=\"w\">novel</td><td class=\"m\">소설</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 갔고</span><span class=\"en\"><b>I went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에</span><span class=\"en\"><b>to the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 좀 마시기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to drink</span> some water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자를 발견했어요</span><span class=\"en\"><b>and found the box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식탁 위에서.</span><span class=\"en\"><b>on the table.</b></span></div></div><div class=\"lec-sent-ko\">저는 물을 좀 마시기 위해 부엌에 갔고 식탁 위에 있는 상자를 발견했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신이 사건 현장(부엌)에 잠시 머물렀던 이유를 설명하며, 문제의 상자를 목격했음을 시인합니다. to drink some water는 부엌에 간 목적이 상자(케이크)가 아니었음을 강조하려는 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to drink (to부정사): 부사적 용법(목적)으로 쓰여 &#39;마시기 위해서&#39;라고 해석되며, 앞선 동작인 went의 목적을 설명한다.</div><div class=\"lec-gr-item\">went ... and found 병렬 구조: 접속사 and를 중심으로 과거 시제 동사인 went와 found가 나란히 연결되어 주어 I에 걸리는 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그 상자 안에 있는 케이크를 볼 수 없었어요.</span><span class=\"en\"><b>I couldn’t see the cake <span class=\"grammar-hl\">inside the box</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 저는 그 상자 안에 있는 케이크를 볼 수 없었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상자는 봤지만 그 내용물인 케이크는 확인하지 못했다며 직접적인 관련성을 부인합니다. couldn’t see는 상자가 닫혀 있었거나 자신이 내용물에 관심이 없었다는 점을 주장하여 범행 가담 여부를 차단하는 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">inside the box (전치사구): 전치사 inside가 명사구 the box와 결합하여 앞의 명사 the cake의 위치를 설명하는 형용사구 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아시다시피,</span><span class=\"en\"><b>You know,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 몸무게를 줄이려고 노력하고 있어요</span><span class=\"en\"><b>I<span class=\"grammar-hl\">’m trying</span> <span class=\"grammar-hl\">to lose</span> weight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요즘.</span><span class=\"en\"><b>these days.</b></span></div></div><div class=\"lec-sent-ko\">아시다시피, 저는 요즘 몸무게를 줄이려고 노력하고 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신이 케이크를 먹었을 리가 없다는 첫 번째 근거로 개인적인 다이어트 상황을 제시합니다. trying to lose weight는 케이크 같은 고칼로리 음식을 피해야만 하는 강한 동기가 자신에게 있음을 호소하는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">’m trying (현재진행): be동사(am) + 현재분사(-ing) 형태로 현재 살을 빼려고 노력하고 있는 진행 중인 상태를 나타낸다.</div><div class=\"lec-gr-item\">to lose (to부정사): 명사적 용법으로 동사 try의 목적어 역할을 하며 &#39;~하는 것을 (노력하다)&#39;라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lose weight</td><td class=\"m\">체중을 감량하다, 살을 빼다</td></tr><tr><td class=\"w\">these days</td><td class=\"m\">요즘, 최근에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 디저트를 전혀 먹지 않아요.</span><span class=\"en\"><b>I <span class=\"grammar-hl\">don’t eat</span> any dessert.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 디저트를 전혀 먹지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 다이어트 결심이 실제 행동으로 이어지고 있음을 강조하며, 케이크라는 품목 자체를 거부하고 있다는 논리를 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t eat 일반동사 부정문: 일반동사 eat의 현재형 부정을 위해 조동사 do와 부정어 not을 결합한 don&#39;t를 동사 원형 앞에 쓴 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dessert</td><td class=\"m\">디저트, 후식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇보다도,</span><span class=\"en\"><b><span class=\"grammar-hl\">Most of all</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 초콜릿 케이크를 좋아하지 않아요.</span><span class=\"en\"><b>I don’t like chocolate cake.</b></span></div></div><div class=\"lec-sent-ko\">무엇보다도, 저는 초콜릿 케이크를 좋아하지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설령 다이어트 중이 아니더라도 취향상 초콜릿 케이크를 먹을 이유가 전혀 없다는 두 번째 근거를 덧붙입니다. Most of all은 다이어트보다 더 강력한 거절의 사유가 &#39;개인적 불호&#39;임을 드러내어 자신의 무고함을 확실히 하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Most of all (관용표현): &#39;무엇보다도&#39; 혹은 &#39;특히&#39;라는 의미로 쓰여 강조의 의미를 더하는 부사구 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">most of all</td><td class=\"m\">무엇보다도, 특히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 설탕과 버터가 (들어있어요)</span><span class=\"en\"><b><span class=\"grammar-hl\">Too much sugar and butter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에.”</span><span class=\"en\"><b>in it.”</b></span></div></div><div class=\"lec-sent-ko\">그 안에 너무 많은 설탕과 버터가 들어있어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 초콜릿 케이크를 싫어하는 구체적인 이유를 밝히며 자신의 주장에 설득력을 더합니다. 케이크의 성분을 부정적으로 묘사함으로써 자신에게 그것이 전혀 매력적인 음식이 아님을 재확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Too much sugar and butter 생략 구문: 문맥상 명사구만 남겨진 형태로, 앞 문장의 chocolate cake 안에 들어있는 성분을 강조하기 위해 &#39;There is&#39; 등의 주어와 동사가 생략된 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“너는 언제 갔니</span><span class=\"en\"><b>“When <span class=\"grammar-hl\">did you go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에?”</span><span class=\"en\"><b>to the kitchen?”</b></span></div></div><div class=\"lec-sent-ko\">“너는 언제 부엌에 갔니?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Carol의 해명을 들은 Jones 씨가 사건의 타임라인을 더 정교하게 맞추기 위해 구체적인 이동 시간을 다시 질문합니다. Carol의 진술에서 모순점을 찾거나 다른 증거와 대조해 보려는 수사 기법입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did you go 일반동사 의문문: 과거 시제 의문문을 만들기 위해 조동사 did를 주어(you) 앞에 쓰고, 본동사는 원형(go)을 쓴 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“저는 정확한 시간은 모르지만,</span><span class=\"en\"><b>“I don’t know the exact time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 Tom을 봤어요</span><span class=\"en\"><b>but I <span class=\"grammar-hl\">saw Tom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌에서 나오는 것을.”</span><span class=\"en\"><b><span class=\"grammar-hl\">coming</span> out of the kitchen.”</b></span></div></div><div class=\"lec-sent-ko\">“저는 정확한 시간은 모르지만, Tom이 부엌에서 나오는 것을 봤어요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신은 시간을 기억하지 못할 만큼 상황에 무심했음을 시사하면서도, 동시에 Tom이라는 다른 인물을 언급하며 의심의 화살을 돌립니다. saw Tom coming out은 자신이 아닌 다른 누군가가 범행 현장에 있었다는 사실을 고발하여 자신에 대한 수사망을 빠져나가려는 전술적 발언입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw Tom coming 5형식(SVOC) 구조: 지각동사(saw) + 목적어(Tom) + 목적격 보어(현재분사 coming) 구조로, 목적어가 ~하고 있는 것을 보았다는 의미를 나타낸다.</div><div class=\"lec-gr-item\">coming (현재분사): 5형식 문장에서 목적격 보어로 사용되었으며, 목적어인 Tom이 직접 수행하는 진행 중인 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exact</td><td class=\"m\">정확한, 정밀한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>수사관 Jones 씨는 실종된 케이크의 행방을 찾기 위해 딸 Carol을 심문한다.</li><li>Carol은 사건 발생 시간에 거실에서 책을 읽었으며, 부엌에는 물을 마시러 잠시 들렀을 뿐이라고 주장한다.</li><li>그녀는 다이어트 중이며 초콜릿 케이크를 싫어하기 때문에 케이크에 손을 댈 이유가 전혀 없음을 강조한다.</li><li>마지막으로 자신 대신 부엌에서 나오는 Tom을 보았다고 진술하며 그를 새로운 용의자로 지목한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Carol claims she did not eat the cake due to her diet and health concerns while pointing to Tom as a person of interest.</div>\n              <div class=\"lec-final-sum-ko\">Carol은 다이어트와 건강상의 이유를 들어 케이크를 먹지 않았다고 주장하면서도 Tom을 유력한 인물로 지목한다.</div></div></div>"],"segs":[[{"audio":"./중2 천재(이) 5과 본문4_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문4_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문4_강의_audio/3.mp3","hl":null},{"audio":"./중2 천재(이) 5과 본문4_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 천재(이) 5과 본문4_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 천재(이) 5과 본문4_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./중2 천재(이) 5과 본문4_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./중2 천재(이) 5과 본문4_강의_audio/8.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문4_강의_audio/9.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문4_강의_audio/10.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5
