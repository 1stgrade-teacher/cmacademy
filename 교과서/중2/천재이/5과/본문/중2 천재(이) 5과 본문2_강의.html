g)의 시작으로, 마치 복잡하게 얽힌 실타래에서 실마리를 찾아 하나씩 풀어가는 과정과 비슷해요. 이러한 문제 해결(Problem Solving) 방식은 일상의 사소한 단서들을 논리적으로 조합해 진실에 다가가는 즐거움을 줍니다. 특히 이웃 간의 신뢰를 바탕으로 한 사회적 중재(Social Mediation)는 공식적인 절차 대신 공동체 안에서 평화롭게 갈등을 해소하는 지혜로운 모습을 잘 보여주고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 발생과 도움 요청</div><ul><li>케이크를 먹은 범인을 찾기 위해 지혜로운 이웃집 존스 부인에게 도움을 요청함.</li><li>마을의 해결사 역할을 하는 지혜로운 노부인(wise old lady)</li><li>곤경(trouble)에 처할 때마다 마을 사람들이 찾는 대상</li><li>핵심 키워드: 도움 요청(call)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02해결사의 등장과 확신</div><ul><li>존스 부인이 방문하여 범인을 찾을 수 있다며 엄마를 안심시키고 조사를 시작함.</li><li>다정한 미소(sweet smile)와 함께 등장</li><li>목표: 케이크를 많이 먹은 사람(big eater)을 찾아내는 것</li><li>핵심 키워드: 안심(Don’t worry)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기초 조사 및 용의자 확인</div><ul><li>사건 발생 당시 집에 있었던 인물들을 확인하며 본격적인 수사에 착수함.</li><li>질문: 오전에 집에 있었던 사람(who was in the house)을 확인</li><li>용의자 파악: 세 명의 아이들(Harry, Carol, Tom)이 지목됨</li><li>핵심 키워드: 질문(ask)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">현명한, 지혜로운</td></tr><tr><td class=\"w\">live next door</td><td class=\"m\">옆집에 살다, 이웃하다</td></tr><tr><td class=\"w\">come to</td><td class=\"m\">(도움을 구하러) ~를 찾아가다, ~에게 오다</td></tr><tr><td class=\"w\">be in trouble</td><td class=\"m\">곤경에 처하다, 어려움에 빠지다</td></tr><tr><td class=\"w\">find out</td><td class=\"m\">~을 알아내다, 밝혀내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마는</span><span class=\"en\"><b>Mom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones에게 전화했다</span><span class=\"en\"><b>called Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람을 찾기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to find</span> the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 먹은.</span><span class=\"en\"><b><span class=\"grammar-hl\">who ate the cake</span>.</b></span></div></div><div class=\"lec-sent-ko\">엄마는 케이크를 먹은 사람을 찾기 위해 Ms. Jones에게 전화했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로, 집 안에서 발생한 작은 사건을 해결하기 위해 외부의 도움을 요청하는 장면입니다. find the person who ate the cake는 엄마가 스스로 범인을 찾지 못해 탐정과 같은 역할을 해줄 전문가나 조력자를 필요로 하고 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to find (to부정사): 부사적 용법 중 목적을 나타내며, 주절의 동작인 called에 대한 목적(~하기 위해서)을 설명하는 구조이다.</div><div class=\"lec-gr-item\">who ate the cake (관계대명사): 주격 관계대명사 who가 이끄는 형용사절이 선행사 the person을 수식하며, 관계대명사절 내부에서 who는 주어 역할을 수행하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b>Ms. Jones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현명한 노부인이었다</span><span class=\"en\"><b>was a wise old lady</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옆집에 사는.</span><span class=\"en\"><b><span class=\"grammar-hl\">who lived next door</span>.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 옆집에 사는 현명한 노부인이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 부른 조력자가 누구인지 소개하는 문장입니다. a wise old lady는 아주머니가 단순히 나이가 많은 이웃이 아니라, 풍부한 경험과 통찰력을 바탕으로 복잡한 문제를 풀어낼 능력이 있는 인물임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who lived next door (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 a wise old lady를 수식하는 구조이며, 절 내부에서 주어가 빠진 불완전한 문장 형태를 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wise</td><td class=\"m\">현명한, 지혜로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마을에 있는 모든 사람은</span><span class=\"en\"><b>Everyone in town</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀에게 왔다</span><span class=\"en\"><b>came to her</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 곤경에 처했을 때.</span><span class=\"en\"><b>when they were <span class=\"grammar-hl\">in trouble</span>.</b></span></div></div><div class=\"lec-sent-ko\">마을에 있는 모든 사람은 그들이 곤경에 처했을 때 그녀에게 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 존스 아주머니의 평판을 설명하며 그녀의 지혜가 검증되었음을 뒷받침합니다. came to her when they were in trouble은 아주머니가 마을에서 비공식적인 해결사 혹은 상담가 역할을 수행하며 신뢰를 쌓아왔다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in trouble (관용표현): &#39;곤경에 처한&#39; 또는 &#39;어려움에 빠진&#39;이라는 의미로 쓰이는 전치사구 관용구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Ms. Jones는</span><span class=\"en\"><b><span class=\"grammar-hl\">Ms. Jones</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다정한 미소를 지으며.</span><span class=\"en\"><b>with her sweet smile.</b></span></div></div><div class=\"lec-sent-ko\">Ms. Jones는 다정한 미소를 지으며 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건 현장에 도착한 아주머니의 첫인상을 묘사합니다. came with her sweet smile은 사건을 해결하러 온 사람이지만 딱딱하거나 위압적인 태도가 아니라, 부드럽고 여유로운 태도로 상황을 대하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ms. Jones came (1형식): 주어 Ms. Jones와 자동사 came으로 이루어진 주어+동사의 완전한 문장 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“걱정 마세요!</span><span class=\"en\"><b>“Don’t worry!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아냅시다!</span><span class=\"en\"><b>Let’s <span class=\"grammar-hl\">find out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대식가를!”</span><span class=\"en\"><b>the big eater!”</b></span></div></div><div class=\"lec-sent-ko\">(“걱정 마세요! 대식가를 알아냅시다!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 걱정하는 엄마를 안심시키며 본격적으로 수사에 착수하는 대사입니다. the big eater는 케이크를 몰래 먹은 범인을 귀엽게 비유한 표현으로, 아주머니가 이 사건을 아이들의 장난 같은 가벼운 소동으로 취급하며 즐겁게 해결하려 함을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find out (관용표현): &#39;~을 알아내다&#39; 또는 &#39;~을 찾아내다&#39;라는 의미를 가진 동사와 부사 결합 형태의 구동사(phrasal verb)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">~을 알아내다, 밝혀내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 엄마에게 물었다,</span><span class=\"en\"><b>She <span class=\"grammar-hl\">asked Mom</span>, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“누가</span><span class=\"en\"><b>“Who</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집에 있었죠?</span><span class=\"en\"><b>was in the house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 아침에?”</span><span class=\"en\"><b>this morning?”</b></span></div></div><div class=\"lec-sent-ko\">그녀는 엄마에게 물었다, “누가 오늘 아침에 집에 있었죠?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지혜로운 아주머니가 사건 해결을 위해 가장 먼저 논리적인 질문을 던지는 단계입니다. Who was in the house는 사건이 일어난 시간대에 현장에 접근할 수 있었던 사람들을 확인하여 용의자 범위를 좁히려는 아주머니의 수사 방식을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked Mom (4형식): 수여동사 ask가 간접목적어(Mom)와 직접목적어(뒤따르는 직접 인용문)를 취하여 &#39;~에게 ~을 묻다&#39;라는 의미를 형성하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“우리 아이들,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">My children,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Harry, Carol, 그리고 Tom이요.”</span><span class=\"en\"><b><span class=\"grammar-hl\">Harry, Carol, and Tom</span>.”</b></span></div></div><div class=\"lec-sent-ko\">“우리 아이들, Harry, Carol, 그리고 Tom이요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아주머니의 질문에 대한 엄마의 답변으로, 이제 수사의 대상이 구체화됩니다. 이 대답을 통해 범인은 외부인이 아니라 세 명의 아이들 중 한 명이라는 사실이 밝혀지며 독자의 궁금증을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My children, Harry, Carol, and Tom (동격): 명사구 My children과 그 뒤에 나열된 Harry, Carol, and Tom이 동일한 대상을 지칭하며 명사의 내용을 구체적으로 보충 설명하는 구조이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>집 안에 있던 케이크가 없어지는 사건이 발생하자 엄마는 이웃집 해결사인 존스 아주머니를 부른다.</li><li>존스 아주머니는 마을 사람들의 고민을 해결해 주는 지혜롭고 신뢰받는 인물이다.</li><li>아주머니는 여유로운 미소와 함께 범인(먹보)을 찾아주겠다며 엄마를 안심시킨다.</li><li>아주머니의 질문을 통해 당시 집에 있었던 세 명의 아이들이 용의자로 지목되며 본격적인 추리가 시작된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mom seeks assistance from her wise neighbor Ms. Jones to identify the person who ate the cake among her children.</div>\n              <div class=\"lec-final-sum-ko\">엄마는 아이들 중 누가 케이크를 먹었는지 밝혀내기 위해 지혜로운 이웃인 Jones 씨에게 도움을 요청한다.</div></div></div>"],"segs":[[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/1.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/2.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/3.mp3","hl":null},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/6.mp3","hl":"stage-2"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/7.mp3","hl":null}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/8.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/9.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/10.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/11.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/12.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/14.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/15.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/17.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/18.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/19.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/20.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/21.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/22.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/23.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/24.mp3","hl":"meaning"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/25.mp3","hl":"grammar"}],[{"audio":"./중2 천재(이) 5과 본문2_강의_audio/26.mp3","hl":"main"},{"audio":"./중2 천재(이) 5과 본문2_강의_audio/27.mp3"
