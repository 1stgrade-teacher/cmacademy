tage-head\">03디자인의 지속적인 활용</div><ul><li>기술이 발전하여 컬러 TV 시대가 되었음에도 불구하고, 사람들은 여전히 전통적인 흑백 축구공을 사용한다.</li><li>흑백 TV에서 공을 쉽게 식별(spot)할 수 있었던 실용성</li><li>현재까지 이어지는 클래식한 디자인의 영향력</li><li>핵심 키워드: 가시성(Visibility), 전통적인(Classic)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는, 대중적인</td></tr><tr><td class=\"w\">quite</td><td class=\"m\">꽤, 상당히, 완전히</td></tr><tr><td class=\"w\">desire</td><td class=\"m\">욕구, 열망, 바람</td></tr><tr><td class=\"w\">importance</td><td class=\"m\">중요성, 중요함</td></tr><tr><td class=\"w\">come in</td><td class=\"m\">~한 모양으로 나오다, ~색으로 출시되다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">여러 가지의, 다양한</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">origin</td><td class=\"m\">기원, 유래, 출처</td></tr><tr><td class=\"w\">come out</td><td class=\"m\">출시되다, 세상에 나오다, 공개되다</td></tr><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 알아차리다, 탐지하다</td></tr><tr><td class=\"w\">easily</td><td class=\"m\">쉽게, 용이하게</td></tr><tr><td class=\"w\">smart</td><td class=\"m\">똑똑한, 영리한, 재치 있는</td></tr><tr><td class=\"w\">classic</td><td class=\"m\">고전적인, 전형적인, 일류의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">축구는</span><span class=\"en\"><b>Soccer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 운동이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is a popular sport</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계에서</span><span class=\"en\"><b>all over the world.</b></span></div></div><div class=\"lec-sent-ko\">축구는 전 세계에서 인기 있는 운동입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 앞으로 다룰 소재인 &#39;축구&#39;가 가진 대중적인 위상을 언급하며 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is a popular sport 2형식 구조: Soccer(S) + is(V) + a popular sport(C)의 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는, 대중적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 꽤 단순하다</span><span class=\"en\"><b><span class=\"grammar-hl\">is also quite simple</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 꽤 단순하기도 하죠.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 축구의 대중성을 이어받아, 축구가 가진 접근 용이성이라는 특징을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is also quite simple 2형식 구조: It(S) + is(V) + simple(C)의 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quite</td><td class=\"m\">꽤, 상당히, 완전히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 단지 필요하다</span><span class=\"en\"><b>You just <span class=\"grammar-hl\">need</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공, 작은 열린 공간,</span><span class=\"en\"><b><span class=\"grammar-hl\">a ball, a small open space,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 찰 욕구가!</span><span class=\"en\"><b><span class=\"grammar-hl\">and the desire to kick</span>!</b></span></div></div><div class=\"lec-sent-ko\">여러분은 공, 작은 열린 공간, 그리고 (공을) 찰 욕구만이 필요해요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축구가 왜 단순한지에 대한 구체적인 예시를 들어, 복잡한 장비 없이도 누구나 즐길 수 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need a ball, a small open space, and the desire to kick (to부정사): the desire를 수식하는 형용사적 용법으로, &#39;찰 욕구&#39;라는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">desire</td><td class=\"m\">욕구, 열망, 바람</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아,</span><span class=\"en\"><b>Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잊지 마라</span><span class=\"en\"><b><span class=\"grammar-hl\">don’t forget</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 가지 더를</span><span class=\"en\"><b>one more thing.</b></span></div></div><div class=\"lec-sent-ko\">아, 한 가지 더 잊지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 주의를 환기하며, 앞서 말한 단순한 조건 외에 또 다른 중요한 요소가 있음을 암시하는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t forget (명령문): 상대방에게 ~하지 말라고 지시하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 이해할 필요가 있다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">need to understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">색깔의 중요성을!</span><span class=\"en\"><b>the importance of colors!</b></span></div></div><div class=\"lec-sent-ko\">여러분은 색깔의 중요성을 이해해야 해요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 핵심 주제를 제시하는 문장으로, 축구공의 디자인과 색상에 숨겨진 이유를 밝히겠다는 의도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to understand (to부정사): need의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">importance</td><td class=\"m\">중요성, 중요함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날 축구공들은</span><span class=\"en\"><b>Soccer balls today</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 색깔로 나온다,</span><span class=\"en\"><b>come in various colors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 검고 흰 공들은</span><span class=\"en\"><b>but black and white balls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상당히 흔하다</span><span class=\"en\"><b>are quite common.</b></span></div></div><div class=\"lec-sent-ko\">오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다양한 색상의 공이 존재한다는 사실을 인정하면서도, 여전히 흑백 조합이 주류를 이루고 있다는 대조를 통해 독자의 궁금증을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Black and White Soccer Balls (현재분사): White(색상)가 Soccer Balls를 수식하는 형용사적 기능을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quite</td><td class=\"m\">꽤, 상당히, 완전히</td></tr><tr><td class=\"w\">come in</td><td class=\"m\">~한 모양으로 나오다, ~색으로 출시되다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">여러 가지의, 다양한</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 들어 본 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 인기 있는 디자인의 기원에 대해?</span><span class=\"en\"><b>about the origin of this popular design?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 흑백 축구공이 왜 대중적인지를 설명하기 위해 질문을 던짐으로써, 역사가 담긴 배경지식을 제공할 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you heard (현재완료): 과거의 경험이 현재까지 이어지는 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는, 대중적인</td></tr><tr><td class=\"w\">origin</td><td class=\"m\">기원, 유래, 출처</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">검고 흰 공들은</span><span class=\"en\"><b>Black and white balls</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">came out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1970년 멕시코 월드컵 동안에</span><span class=\"en\"><b>during the 1970 World Cup in Mexico.</b></span></div></div><div class=\"lec-sent-ko\">검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 흑백 디자인이 등장하게 된 구체적인 시점과 장소를 명시하여 디자인의 기원을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came out (관용표현): (새로운 제품 등이) 출시되다, 나타나다라는 의미의 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 쉽게 발견할 수 있었다</span><span class=\"en\"><b>could <span class=\"grammar-hl\">spot</span> them easily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 흑백 TV에서</span><span class=\"en\"><b>on their black and white TVs.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당시 기술적 제약이었던 &#39;흑백 TV&#39; 환경에서 흑백 공이 가진 가시성이 얼마나 뛰어났는지를 설명하여 디자인의 실용성을 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spot 5형식(SVOC) 구조: People(S) + could spot(V) + them(O) + easily(부사)의 구조로, 목적어의 동작을 포착하는 능력을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 알아차리다, 탐지하다</td></tr><tr><td class=\"w\">easily</td><td class=\"m\">쉽게, 용이하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 똑똑하지 않은가?</span><span class=\"en\"><b><span class=\"grammar-hl\">Isn’t that smart</span>?</b></span></div></div><div class=\"lec-sent-ko\">그것은 똑똑하지 않나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술적 한계를 디자인으로 극복했던 당시의 아이디어가 매우 효율적이었음을 강조하며 감탄을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Isn’t that smart (도치/의문문): 부정 의문문 형태로, 앞선 사실에 대해 화자가 청자에게 동의를 구하거나 강조하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smart</td><td class=\"m\">똑똑한, 영리한, 재치 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 컬러텔레비전을 가지고 있다,</span><span class=\"en\"><b>we have color televisions,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 여전히 찬다</span><span class=\"en\"><b>but we still kick</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 고전적인 검고 흰 축구공들을.</span><span class=\"en\"><b>the <span class=\"grammar-hl\">classic black and white soccer balls</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재의 기술 발전 상황과 과거의 디자인이 공존하는 모습을 보여주며, 그 디자인이 하나의 상징적인 축구 문화로 자리 잡았음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">classic black and white soccer balls (현재분사): black과 white가 뒤에 오는 soccer balls를 수식하는 형용사적 기능을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">classic</td><td class=\"m\">고전적인, 전형적인, 일류의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>축구는 누구나 쉽게 즐길 수 있는 세계적인 스포츠이다.</li><li>흑백 축구공은 과거 흑백 TV에서 잘 보이기 위해 1970년 월드컵 때 고안되었다.</li><li>기술이 발전해 컬러 TV 시대가 되었지만, 흑백 축구공은 여전히 축구를 상징하는 디자인으로 남아 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The iconic black and white soccer ball was introduced during the 1970 World Cup for better visibility on TV, and it remains a popular choice despite the transition to color broadcasting.</div>\n              <div class=\"lec-final-sum-ko\">상징적인 흑백 축구공은 1970년 월드컵 당시 TV 시인성을 높이기 위해 도입되었으며, 컬러 방송으로의 전환에도 불구하고 여전히 인기 있는 선택지로 남아 있다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio":"./1_audio/26.mp3","hl":"main"},{"audio":"./1_audio/27.mp3","hl":"meaning"},{"audio":"./1_audio/28.mp3","hl":"grammar"}],[{"audio":"./1_audio/29.mp3","hl":"main"},{"audio":"./1_audio/30.mp3","hl":"meaning"},{"audio":"./1_audio/31.mp3","hl":"grammar"}],[{"audio":"./1_audio/32.mp3","hl":"main"},{"audio":"./1_audio/33.mp3","hl":"meaning"},{"audio":"./1_audio/34.mp3","hl":"grammar"}],[{"audio":"./1_audio/35.mp3","hl":"main"},{"audio":"./1_audio/36.mp3","hl":"meaning"},{"audio":"./1_audio/37.mp3","hl":"grammar"}],[{"audio":"./1_audio/38.mp3","hl":"main"},{"audio":"./1_audio/39.mp3","hl":"meaning"},{"audio":"./1_audio/40.mp3","hl":"grammar"}],[{"a
