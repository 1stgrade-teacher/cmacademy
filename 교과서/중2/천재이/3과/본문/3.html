vr+FIXXHJGM4PI/P3H07fSmA6j/AD/hTQy44I4znkHvz+vc9c0FgO+cn2/zwP8APU0X/wAv6/rbXYB1FJkeo/P060tAr/8ADfdf7r/5B/8AXz9f/r5z/wDrprcAn0Gc+mOf8jvS5HqOff8AP8vy7cUhwqkjkBSeOc4Hrzk/XP40unT9LD8v60/4c//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Universal Language of Soccer: Understanding Colored Cards<small>축구의 공용어: 색깔 카드의 이해</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">스포츠 경기에서 흔히 볼 수 있는 옐로카드와 레드카드는 언어가 통하지 않는 선수들 사이에서 일종의 비언어적 의사소통(Non-verbal Communication) 수단으로 활용됩니다. 이는 특정한 기호나 색상을 통해 복잡한 상황을 즉각적으로 전달하는 기호학(Semiotics)적 원리를 활용한 것인데, 마치 도로 위의 신호등이 &#39;멈춤&#39;이나 &#39;진행&#39;을 전 세계 공통으로 알리는 것과 비슷한 이치예요. 1970년 멕시코 월드컵에서 처음 도입된 이 카드 시스템은 경기 규칙(Rules of the game)을 효율적으로 전달하기 위해 고안되었으며, 즉각적인 시각적 피드백(Visual feedback)을 통해 심판이 경기의 흐름을 통제하고 선수의 행동을 제약하는 강력한 도구가 된답니다. 이런 배경지식을 알고 축구 경기를 관람하신다면, 심판의 판정이 경기 전체의 흐름을 어떻게 조율하는지 훨씬 더 흥미롭게 관찰하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01색깔 카드의 도입과 역사</div><ul><li>축구 심판들이 의사소통의 도구로 색깔 카드를 사용하기 시작한 역사적 배경을 설명합니다.</li><li>1970년부터 사용된 노란색 및 빨간색 카드</li><li>서로 다른 색상이 선수들에게 각기 다른 메시지 전달</li><li>핵심 키워드: 심판(Referees), 의사소통(Communication)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02카드의 구체적 의미</div><ul><li>색깔별 카드가 경기장 안에서 어떤 경고나 제재의 의미를 담고 있는지 나타냅니다.</li><li>노란색 카드: 반칙에 대한 주의(Be careful) 촉구</li><li>빨간색 카드: 즉각적인 퇴장(You’re out) 명령</li><li>핵심 키워드: 파울(fouls), 퇴장(out)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03보편적 의사소통의 이점</div><ul><li>언어 장벽을 넘어 카드가 경기 내에서 어떻게 효과적으로 기능하는지 설명합니다.</li><li>서로 다른 국가 출신의 선수들 모두가 의미를 명확히 이해</li><li>언어의 한계를 극복한 효율적인 수단</li><li>핵심 키워드: 보편적 이해(understand the meaning)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04경기 관람을 위한 제언</div><ul><li>축구 경기 중 색깔 카드를 유심히 살펴보며 관람하는 즐거움을 제시합니다.</li><li>경기장(field) 위에서 나타나는 다양한 색깔을 관찰할 것</li><li>이를 통해 축구 경기를 더욱 재미있게 관람하는 방법 제안</li><li>핵심 키워드: 축구 경기(soccer match), 즐거움(fun)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">referee</td><td class=\"m\">심판, 중재자</td></tr><tr><td class=\"w\">send a message</td><td class=\"m\">메시지를 전달하다, 의사를 표시하다</td></tr><tr><td class=\"w\">foul</td><td class=\"m\">반칙, 파울</td></tr><tr><td class=\"w\">check out</td><td class=\"m\">확인하다, 살펴보다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심판들은</span><span class=\"en\"><b>Referees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용해 왔다</span><span class=\"en\"><b>have used</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노란색과 빨간색 카드를</span><span class=\"en\"><b>yellow and red cards</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1970년부터</span><span class=\"en\"><b>since 1970.</b></span></div></div><div class=\"lec-sent-ko\">심판은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 카드라는 도구가 도입된 역사적 기점을 제시하며, 본문에서 다룰 의사소통 수단의 배경을 소개하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Color Cards for Communication (동명사): &#39;Color Cards&#39;가 통신(Communication)이라는 행위/용도를 위한 것임을 나타내는 명사적 개념의 동명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">referee</td><td class=\"m\">심판, 중재자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 색깔의 카드들은</span><span class=\"en\"><b>Different color cards</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보낸다</span><span class=\"en\"><b><span class=\"grammar-hl\">send</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 메시지를</span><span class=\"en\"><b><span class=\"grammar-hl\">different messages</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to players</span>.</b></span></div></div><div class=\"lec-sent-ko\">다른 색깔의 카드는 선수들에게 다른 메시지를 전합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 카드가 단순한 도구가 아니라 특정한 정보를 전달하는 의사소통의 수단임을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">send different messages to players 5형식(SVOC) 구조의 변형: &#39;send&#39;는 4형식(SVOO) 구조를 기본으로 하며, 여기서는 send(V) + messages(O) + to players(전치사구) 구조로 쓰여 메시지를 전달하는 대상(players)을 명시하고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">옐로카드는 말한다,</span><span class=\"en\"><b>Yellow cards say,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“조심하시오</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Be careful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 반칙들을!”</span><span class=\"en\"><b><span class=\"grammar-hl\">with those fouls!</span>”</b></span></div></div><div class=\"lec-sent-ko\">옐로카드는 “그러한 반칙들을 조심하시오!”라고 말합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;서로 다른 메시지&#39; 중 노란색 카드가 갖는 구체적인 경고의 의미를 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Be careful with those fouls! (관용표현): &#39;be careful with&#39;는 &#39;~에 주의하다&#39;라는 의미를 가진 숙어로, 여기서는 명령문으로 사용되었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">foul</td><td class=\"m\">반칙, 파울</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">레드카드는 의미한다</span><span class=\"en\"><b>Red cards mean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“당신은 퇴장입니다!”</span><span class=\"en\"><b>“<span class=\"grammar-hl\">You’re out!</span>”</b></span></div></div><div class=\"lec-sent-ko\">레드카드는 “당신은 퇴장입니다!”를 의미합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 노란색 카드에 이어 빨간색 카드의 단호한 결정 사항을 예시로 들며, 두 색상이 명확히 구분되는 정보를 담고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You’re out! (관용표현): &#39;be out&#39;은 스포츠 경기 등에서 &#39;퇴장당하다/탈락하다&#39;라는 의미의 이디엄으로 사용되었다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 선수들은</span><span class=\"en\"><b>All players</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 나라 출신의</span><span class=\"en\"><b><span class=\"grammar-hl\">from different countries</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명하게 이해한다</span><span class=\"en\"><b>clearly understand</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 의미를</span><span class=\"en\"><b>the meaning</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 카드들의</span><span class=\"en\"><b>of these cards.</b></span></div></div><div class=\"lec-sent-ko\">다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 언어가 달라도 카드의 색상만으로 의사소통이 가능한 이유, 즉 카드라는 상징 체계가 가진 범국가적인 공용성을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">from different countries (현재분사): &#39;different&#39;는 형용사이지만, 문맥상 &#39;서로 다른(구분되는)&#39;이라는 상태를 나타내며 뒤의 명사 &#39;countries&#39;를 수식하고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 계획을 가지고 있는가</span><span class=\"en\"><b>Do you have a plan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축구 경기를 볼?</span><span class=\"en\"><b><span class=\"grammar-hl\">to watch</span> a soccer match?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 축구 경기를 볼 계획이 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 카드 시스템에 대한 설명을 토대로, 독자에게 일상 속에서 이 시스템을 직접 경험해 보길 권유하며 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to watch (to부정사): 앞의 명사 &#39;a plan&#39;을 뒤에서 수식하는 형용사적 용법으로, &#39;~할 계획&#39;이라는 의미를 갖는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인해 보라</span><span class=\"en\"><b><span class=\"grammar-hl\">check out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 색깔들을</span><span class=\"en\"><b>the various colors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경기장 위의</span><span class=\"en\"><b>on the field.</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 경기장에서의 다양한 색깔을 확인해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 질문을 받아, 독자가 경기장에서 색상을 통해 메시지를 읽어보는 구체적인 행동을 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">check out (관용표현): &#39;check out&#39;은 &#39;~을 확인하다/살펴보다&#39;라는 의미의 구동사(phrasal verb)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">check out</td><td class=\"m\">확인하다, 살펴보다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">will be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 재미있게!</span><span class=\"en\"><b><span class=\"grammar-hl\">more fun!</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 더 재미있을 것입니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경기 중 색상의 의미를 파악하는 행위가 관람객에게 얻을 수 있는 긍정적인 가치, 즉 관람의 즐거움을 극대화한다는 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It will be more fun! 기초 구조: &#39;It&#39;은 상황을 나타내는 비인칭 주어이며, &#39;will be&#39;는 미래 상태를 나타내는 동사구이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>축구 심판은 1970년부터 색상 카드를 사용하여 선수와 소통한다.</li><li>노란색과 빨간색 카드는 각각 경고와 퇴장이라는 명확한 메시지를 전달한다.</li><li>색상 카드는 언어의 장벽을 넘어 만국 공통의 의사소통 수단으로 기능한다.</li><li>경기 중 이러한 색상 정보를 파악하면 축구 관람을 더 즐겁게 할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Referees use yellow and red cards to deliver clear disciplinary messages, as these colors allow players of all nationalities to understand the rules without language barriers.</div>\n              <div class=\"lec-final-sum-ko\">심판은 명확한 징계 메시지를 전달하기 위해 노란색과 빨간색 카드를 사용하며, 이 색깔들은 모든 국적의 선수들이 언어 장벽 없이 규칙을 이해하도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}],[{"audio":"./3_audio/8.mp3","hl":null}],[{"audio":"./3_audio/9.mp3","hl":"main"},{"audio":"./3_audio/10.mp3","hl":"meaning"},{"audio":"./3_audio/11.mp3","hl":"grammar"}],[{"audio":"./3_audio/12.mp3","hl":"main"},{"audio":"./3_audio/13.mp3","hl":"meaning"},{"audio":"./3_audio/14.mp3","hl":"grammar"}],[{"audio":"./3_audio/15.mp3","hl":"main"},{"audio":"./3_audio/16.mp3","hl":"meaning"},{"audio":"./3_audio/17.mp3","hl":"grammar"}],[{"audio":"./3_audio/18.mp3","hl":"main"},{"audio":"./3_audio/19.mp3","hl":"meaning"},{"audio":"./3_audio/20.mp3","hl":"grammar"}],[{"audio":"./3_audio/21.mp3","hl":"main"},{"audio":"./3_audio/22.mp3","hl":"meaning"},{"audio":"./3_audio/23.mp3","hl":"grammar"}],[{"audio":"./3_audio/24.mp3","hl":"main"},{"audio":"./3_audio/25.mp3","hl":"meaning"},{"audio":"./3_audio/26.mp3","hl":"grammar"}],[{"audio":"./3_audio/27.mp3","hl":"main"},{"audio":"./3_audio/28.mp3","hl":"meaning"},{"audio":"./3_audio/29.mp3","hl":"grammar"}],[{"audio":"./3_audio/30.mp3","hl":"main"},{"audio":"./3_audio/31.mp3","hl":"meaning"},{"audio":"./3_audio/32.mp3","hl":"grammar"}],[{"audio":"./3_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||
