-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01팀 소속감과 결속</div><ul><li>유니폼의 고유한 색상은 선수들을 하나의 정신으로 묶어주는 역할을 합니다.</li><li>팀 정신(team spirit)을 공유하는 매개체</li><li>팀을 하나로 통합하는 힘(unite)을 가짐</li><li>핵심 키워드: 유니폼 색상(uniform colors)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02경기 효율성 증대</div><ul><li>선수들은 경기장 위에서 자신의 팀 동료를 쉽게 식별하여 신속하게 판단할 수 있습니다.</li><li>동료 간의 빠른 위치 파악(spot each other)</li><li>신속한 의사결정(quick decisions) 지원</li><li>핵심 키워드: 경기장(field)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03심판 유니폼의 특징</div><ul><li>심판은 선수들과 구분되기 위해 눈에 띄는 특별한 색상의 유니폼을 착용합니다.</li><li>선수들과의 시각적 차별화(stand out)</li><li>역할 수행을 위한 식별 용이성</li><li>핵심 키워드: 심판(referees)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04검은색 유니폼의 권위</div><ul><li>심판들이 선호하는 검은색은 강력한 권위와 단호함을 상징하는 메시지를 전달합니다.</li><li>강하고 권위 있는 이미지(powerful)</li><li>항의를 방지하는 무언의 메시지(don’t argue)</li><li>핵심 키워드: 검은색(black)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unite</td><td class=\"m\">결합하다, 화합하게 하다</td></tr><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 찾다</td></tr><tr><td class=\"w\">make a decision</td><td class=\"m\">결정하다, 결단을 내리다</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">referee</td><td class=\"m\">심판</td></tr><tr><td class=\"w\">stand out</td><td class=\"m\">눈에 띄다, 두드러지다</td></tr><tr><td class=\"w\">argue with</td><td class=\"m\">~와 언쟁하다, ~와 다투다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 팀의 선수들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Players on each team</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유니폼을 입는다</span><span class=\"en\"><b><span class=\"grammar-hl\">wear uniforms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들만의 색깔이 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">with their own colors</span>.</b></span></div></div><div class=\"lec-sent-ko\">각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로서, 스포츠 경기에서 팀을 구분하는 가장 기본적인 수단인 유니폼의 색상에 대해 언급하며 글 전체의 소재를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Players on each team wear uniforms with their own colors 5형식 구조(해당 안 됨): 주어(Players) + 동사(wear) + 목적어(uniforms)로 이루어진 3형식 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유니폼 색깔은</span><span class=\"en\"><b>Uniform colors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘을 가졌다</span><span class=\"en\"><b>have the power</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팀을 결속시킬</span><span class=\"en\"><b><span class=\"grammar-hl\">to unite</span> the team</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 정신 아래</span><span class=\"en\"><b>under the same spirit.</b></span></div></div><div class=\"lec-sent-ko\">유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 유니폼 색상이 단순히 시각적인 구분을 넘어, 팀원들에게 소속감을 부여하고 심리적으로 결속시키는 기능을 한다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to unite (to부정사): 동사원형 앞에 to를 붙여 명사/형용사/부사적 역할을 수행합니다. 여기서는 &#39;통합하기 위한&#39;이라는 의미로, 앞의 명사(power)를 수식하는 형용사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unite</td><td class=\"m\">결합하다, 화합하게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 유용하다</span><span class=\"en\"><b>are also <span class=\"grammar-hl\">useful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경기장에서</span><span class=\"en\"><b>on the field.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 또한 경기장에서 유용합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 유니폼 색상이 심리적 결속력을 높이는 것을 넘어, 실제 경기 운영 과정에서 실용적인 가치가 있음을 알려주며 화제를 실질적인 기능으로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">useful 형용사 보어: be동사(are) 뒤에서 주어(They)의 상태를 설명하는 주격 보어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선수들은</span><span class=\"en\"><b>Players</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로를 알아볼 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">spot each other</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 빠른 결정을 내릴 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">and make quick decisions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 팀의 고유한 색깔 덕분에</span><span class=\"en\"><b>thanks to their team’s unique colors.</b></span></div></div><div class=\"lec-sent-ko\">선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;유용한 이유&#39;를 구체적인 사례로 뒷받침합니다. 빠른 판단이 중요한 경기 상황에서 색상이라는 시각적 신호가 얼마나 결정적인 역할을 하는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spot each other and make quick decisions (to부정사(생략)): 조동사 can 뒤에 병렬 구조로 연결된 동사원형들입니다. &#39;spot&#39;과 &#39;make&#39;가 조동사 can의 영향을 받는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spot</td><td class=\"m\">발견하다, 찾다</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경기장에서,</span><span class=\"en\"><b>On the field,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심판들은</span><span class=\"en\"><b><span class=\"grammar-hl\">referees</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유니폼을 입는다</span><span class=\"en\"><b><span class=\"grammar-hl\">wear uniforms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 색깔의</span><span class=\"en\"><b><span class=\"grammar-hl\">with special colors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그들은 눈에 띄어야 하기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">because</span> they need to <span class=\"grammar-hl\">stand out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들로부터</span><span class=\"en\"><b>from the players.</b></span></div></div><div class=\"lec-sent-ko\">경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경기 내의 또 다른 구성원인 심판을 등장시켜, 유니폼 색상이 &#39;팀을 묶는 용도&#39;뿐만 아니라 &#39;구분을 명확히 하는 용도&#39;로도 쓰임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">referees wear uniforms with special colors 3형식 구조: 주어(referees) + 동사(wear) + 목적어(uniforms)로 구성된 문장입니다.</div><div class=\"lec-gr-item\">because 접속사: 주어+동사로 이루어진 절을 이끌어 앞 문장의 이유를 설명하는 부사절 접속사입니다.</div><div class=\"lec-gr-item\">stand out (관용표현): &#39;눈에 띄다, 두드러지다&#39;라는 의미의 자동사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">referee</td><td class=\"m\">심판</td></tr><tr><td class=\"w\">stand out</td><td class=\"m\">눈에 띄다, 두드러지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러 색깔들 중에서,</span><span class=\"en\"><b>Among several colors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은색은</span><span class=\"en\"><b>black</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">has been</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 가장 좋아하는 것</span><span class=\"en\"><b>their favorite.</b></span></div></div><div class=\"lec-sent-ko\">몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 심판들이 착용하는 수많은 색상 중 검은색을 특정하며, 왜 검은색이 선택되었는지에 대한 부연 설명으로 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has been (현재완료): 과거의 한 시점부터 현재까지의 상태를 나타내는 &#39;have + p.p.&#39; 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">검은색은</span><span class=\"en\"><b>Black</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강력해 보인다,</span><span class=\"en\"><b>looks powerful,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 보낸다</span><span class=\"en\"><b>and it sends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강한 “나와 논쟁하지 마시오!”라는 메시지를</span><span class=\"en\"><b>a strong “<span class=\"grammar-hl\">Don’t argue with me!</span>” message.</b></span></div></div><div class=\"lec-sent-ko\">검은색은 강력해 보이고 “나와 논쟁하지 마시오!”라는 강한 메시지를 전합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 검은색이 가진 시각적 이미지가 심판의 권위와 어떻게 연결되는지 설명합니다. 심판이 경기장에서 중재자로서 가져야 할 위엄과 통제력을 색상을 통해 간접적으로 보여준다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t argue with me! (명령문): 주어 없이 동사원형(argue)으로 시작하여 상대방에게 동작을 요구하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">argue with</td><td class=\"m\">~와 언쟁하다, ~와 다투다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>유니폼의 색상은 팀원들에게 소속감과 결속력을 제공하는 정신적 도구이다.</li><li>경기 중에는 선수들이 서로를 빠르게 식별하고 판단하게 돕는 실용적인 수단이 된다.</li><li>심판은 선수들과 구분되기 위해 특별한 색상의 유니폼을 입는다.</li><li>특히 검은색은 심판에게 권위 있는 이미지와 엄격한 통제력을 부여한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Uniform colors foster team spirit for players and provide visual distinction for referees to maintain authority on the field.</div>\n              <div class=\"lec-final-sum-ko\">유니폼 색상은 선수들에게 팀 정신을 고취하며 심판에게는 경기장에서 권위를 유지하기 위한 시각적 구분을 제공한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{
