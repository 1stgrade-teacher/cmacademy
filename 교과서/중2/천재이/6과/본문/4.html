love your work about insects)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03파브르의 열정 확인</div><ul><li>에밀리는 파브르가 수십 년간 곤충에 대해 연구하고 집필했음을 알게 된다.</li><li>30년 넘게 지속된 집필 활동(more than thirty years)</li><li>방 구석구석에 배어 있는 자연을 향한 사랑(love for nature)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04모험의 마무리</div><ul><li>에밀리는 방을 나오며 자신이 경험한 특별한 모험을 친구들에게 알리고 싶어 한다.</li><li>마지막 방을 나서는 에밀리(stepped out)</li><li>친구들에게 모험(adventure)을 이야기할 생각에 설렘</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pick up</td><td class=\"m\">집어 들다, (습관, 지식을) 익히다</td></tr><tr><td class=\"w\">truly</td><td class=\"m\">진심으로, 정말로</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연, 본성</td></tr><tr><td class=\"w\">in every corner of</td><td class=\"m\">~의 구석구석에, ~의 방방곡곡에</td></tr><tr><td class=\"w\">step out</td><td class=\"m\">밖으로 나가다, 잠시 자리를 뜨다</td></tr><tr><td class=\"w\">could not wait to</td><td class=\"m\">~하고 싶어 죽겠다, ~하기를 몹시 고대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">책장 중 하나에서</span><span class=\"en\"><b>From one of the bookshelves,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Emily는 발견했다</span><span class=\"en\"><b>Emily found a <span class=\"grammar-hl\">shining</span> book.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛나는 책을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Emily는 책장 중 하나에서 빛나는 책을 발견했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 방을 둘러보던 에밀리가 이제는 눈에 띄는 특정 물건을 발견하며 사건이 구체화되는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shining (현재분사(형용사)): shining이 뒤의 명사 book을 수식하며, &#39;빛나고 있는 책&#39;이라는 동작/상태를 나타낸다. 현재분사+N 구조는 &#39;…하는 N&#39; 또는 &#39;…중인 N&#39;으로 해석한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 집어 들었다</span><span class=\"en\"><b>She picked it up.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 그것을 집어 들었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 발견한 책에 관심을 두고 에밀리가 직접적인 상호작용을 시작하는 행동을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">picked up (관용표현(숙어)): pick up은 &#39;집어 들다&#39;라는 의미의 구동사로, 동사 pick과 부사 up이 결합하여 하나의 타동사구처럼 기능한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 보았다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">saw</span> the name Jean-Henri Fabre on its cover.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jean-Henri Fabre의 이름을</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">표지에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 표지에서 Jean-Henri Fabre의 이름을 보았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 책의 저자를 확인하며, 이 공간이 누구와 관련된 장소인지 독자에게 정보를 제공하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw 5형식(SVOC) 구조: saw(지각동사) + 목적어(the name Jean-Henri Fabre) + 목적격보어(on its cover)가 결합된 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">책을 열었을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When she opened the book,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 발견했다</span><span class=\"en\"><b>she found an old letter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오래된 편지를</span><span class=\"en\"><b>from Charles Darwin.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Charles Darwin에게서 온</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">책을 열었을 때, 그녀는 Charles Darwin에게서 온 오래된 편지를 발견했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 책이라는 매개체를 통해 역사적 인물인 다윈의 흔적을 발견하며 이야기에 깊이가 더해집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When she opened the book, (분사구문(대용)): 문장에서 접속사 When을 포함한 부사절로, 주절의 동작(found)이 일어나는 시간적 배경을 설명한다. 이는 &#39;when + she + opened(과거형)&#39;로 해석하여 시간의 부사절 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것에는 ~라고 쓰여 있었다</span><span class=\"en\"><b>It said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 책을 제게 보내 주셔서 감사합니다.</span><span class=\"en\"><b>“Thank you for <span class=\"grammar-hl\">sending</span> me your book.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.</span><span class=\"en\"><b>I truly love your work about insects.”</b></span></div></div><div class=\"lec-sent-ko\">(그것에는 “당신의 책을 제게 보내 주셔서 감사합니다. 저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.”라고 쓰여 있었습니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급된 편지의 내용을 직접 인용하여, 파브르의 연구가 당대 학자에게 어떤 가치를 지녔는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sending (동명사): 전치사 for의 목적어 자리에 쓰여 &#39;보내는 것&#39;이라는 행위를 나타내는 명사적 기능의 동명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">truly</td><td class=\"m\">진심으로, 정말로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Emily는 알게 되었다</span><span class=\"en\"><b>Emily <span class=\"grammar-hl\">learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Fabre가 곤충에 관한 많은 책들을 썼다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that Fabre wrote many books about insects</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">30년 넘게</span><span class=\"en\"><b>for more than thirty years.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책들을 썼다는 것을 알게 되었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 편지 내용을 토대로 에밀리가 파브르라는 인물의 평생에 걸친 노고를 깨닫게 되는 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learned that Fabre wrote many books about insects (명사절(that절)): 동사 learned의 목적어 역할을 하는 that절로, 완전한 문장(Fabre wrote many books)을 이끌어 하나의 명사 덩어리를 만든다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연에 대한 그의 진정한 사랑은</span><span class=\"en\"><b>His true love for nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명하게 보여졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">was shown</span> clearly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방의 모든 구석에서</span><span class=\"en\"><b>in every corner of the room.</b></span></div></div><div class=\"lec-sent-ko\">자연에 대한 그의 진정한 사랑은 방의 모든 구석에서 분명하게 보여졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 파브르의 연구를 확인한 에밀리가 이제는 방 전체를 둘러보며, 공간 자체가 그의 가치관을 담고 있음을 체감하는 결론적 묘사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was shown (수동태): be동사(was)+p.p.(shown) 구조. show는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) was shown 형태로 쓴다. 기본구조: show + O(목적어) + to + B (O를 B에게 보여주다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 본성</td></tr><tr><td class=\"w\">in every corner of</td><td class=\"m\">~의 구석구석에, ~의 방방곡곡에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Emily는 나왔다</span><span class=\"en\"><b>Emily <span class=\"grammar-hl\">stepped out of</span> the last room.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마지막 방에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Emily는 마지막 방에서 나왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 에밀리의 탐험이 마무리 단계에 이르렀음을 나타내는 시간적, 공간적 이동입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stepped out of (관용표현(숙어)): step out of는 &#39;…에서 나오다&#39;라는 의미의 숙어로, 동사와 전치사가 결합하여 하나의 이동 방향을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 너무 신이 나서</span><span class=\"en\"><b>She was <span class=\"grammar-hl\">so excited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기다릴 수 없었다</span><span class=\"en\"><b><span class=\"grammar-hl\">that she could not wait</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들에게 이야기하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to tell</span> her friends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 모험에 대해 빨리</span><span class=\"en\"><b>about her adventure.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 너무 신이 나서 친구들에게 자신의 모험에 대해 빨리 이야기하고 싶었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 탐험을 마친 에밀리의 벅찬 감정을 드러내며, 이 경험이 그녀에게 얼마나 의미 있는 시간이었는지 강조하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so excited that she could not wait (관용표현(강조구문)): so + 형용사 + that + S + V 구조는 &#39;너무 ~해서 …하다&#39;라는 결과의 의미를 강조하는 구문이다.</div><div class=\"lec-gr-item\">to tell (to부정사): 앞의 동사 wait를 수식하거나 보충하는 부사적 용법으로, &#39;~하기를 기다릴 수 없다&#39;는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">could not wait to</td><td class=\"m\">~하고 싶어 죽겠다, ~하기를 몹시 고대하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에밀리는 도서관에서 파브르의 책과 다윈의 편지를 발견한다.</li><li>이를 통해 파브르의 30년 곤충 연구와 자연에 대한 열정을 깨닫는다.</li><li>탐험을 마친 에밀리는 이 귀중한 경험을 친구들에게 알리고 싶어 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Emily discovers Fabre’s insect research books and Darwin’s letter, so she becomes deeply inspired by his lifelong passion for nature.</div>\n              <div class=\"lec-final-sum-ko\">에밀리는 파브르의 곤충 연구 서적과 다윈의 편지를 발견하고, 자연을 향한 그의 평생에 걸친 열정에 깊은 감명을 받는다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.
