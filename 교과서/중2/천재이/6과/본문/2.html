3Vt+q/HbS5Vl0drqz1Xl+GvXaz3tY//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Kwon Ki-ok: A Pioneer Who Soared for Independence<small>권기옥: 독립을 위해 비상한 선구자</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 한국 최초의 여성 비행사 권기옥(Kwon Ki-ok) 지사에 대해 알아두면 좋은 점들을 소개해 드릴게요. 일제강점기라는 시대적 한계(Historical constraints) 속에서 당시 여성에게 비행학교 입학은 거의 불가능에 가까운 도전이었지만, 그녀는 끈기 있게 꿈을 향해 나아갔답니다. 특히 그녀는 단순히 하늘을 나는 것에 그치지 않고, 대한민국 임시정부 등에서 독립운동(Independence movement)에 헌신하며 조국을 위해 몸 바친 인물이에요. 마치 거센 비바람을 뚫고 목표를 향해 나아가는 비행기처럼, 그녀의 삶은 역경을 극복한 서사(Overcoming adversity)를 보여주는 상징적인 사례라고 할 수 있죠. 오늘 지문을 통해 그녀가 품었던 뜨거운 열정과 나라 사랑의 마음을 깊이 느껴보시길 바랍니다!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인물 소개</div><ul><li>에밀리는 벽에 걸린 권기옥의 사진을 통해 그녀의 강인한 모습을 발견한다.</li><li>사진 속 여성의 강인함(brave and strong)</li><li>한국 최초의 여성 비행사(first female pilot)</li><li>핵심 키워드: 권기옥(Kwon Ki-ok)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02도전과 극복</div><ul><li>권기옥은 당시의 사회적 제약을 뛰어넘어 자신의 꿈을 이루어냈다.</li><li>여성의 비행학교 입학 제한(couldn’t enter flight schools)</li><li>포기하지 않는 노력(didn’t give up)</li><li>핵심 키워드: 꿈(dream)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03독립운동</div><ul><li>권기옥은 단순히 비행기 조종에 그치지 않고 조국을 위해 헌신했다.</li><li>조국을 위한 독립운동(independence)</li><li>일본에 맞서 싸움(fought against Japan)</li><li>핵심 키워드: 독립(independence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04감동과 교훈</div><ul><li>에밀리는 권기옥의 위대한 인생 이야기를 접하며 깊은 감명을 받는다.</li><li>위대한 삶의 이야기(great life story)</li><li>에밀리가 받은 감동(moved)</li><li>핵심 키워드: 감동(moved)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">female</td><td class=\"m\">여성의, 여자(의)</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr><tr><td class=\"w\">work hard</td><td class=\"m\">열심히 일하다, 노력하다</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fight against</td><td class=\"m\">~에 맞서 싸우다, 저항하다</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">be moved by</td><td class=\"m\">~에 감동하다, ~로 마음이 움직이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">벽에는</span><span class=\"en\"><b><span class=\"grammar-hl\">On the wall,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있었습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">there was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 여성의 사진이.</span><span class=\"en\"><b>a picture of a woman.</b></span></div></div><div class=\"lec-sent-ko\">벽에는 한 여성의 사진이 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> On the wall을 시작으로 글의 공간적 배경을 제시합니다. 에밀리가 박물관이나 전시 공간 등 특정 장소에 들어와 관찰을 시작하는 상황임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the wall, there was (도치): 장소를 나타내는 부사구(On the wall)가 문장 앞에 와서 주어(a picture)와 동사(was)의 위치가 바뀐 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She <span class=\"grammar-hl\">looked brave and strong</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보였습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">용감하고 강해.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 용감하고 강해 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 사진 속 인물을 묘사합니다. 인물의 외양에서 느껴지는 분위기를 설명하며 독자로 하여금 주인공 권기옥이라는 인물에게 호기심을 갖게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked brave and strong 5형식(SVOC) 구조의 변형: look은 2형식 동사로, 뒤에 주어의 상태를 보충 설명하는 형용사 보어(brave, strong)가 결합된 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 이름은</span><span class=\"en\"><b><span class=\"grammar-hl\">Her name was Kwon Ki-ok.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">권기옥.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀의 이름은 권기옥이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인물의 이름을 밝히며 대상의 정체를 구체화합니다. 본격적인 인물 소개를 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Her name was Kwon Ki-ok. 2형식 구조: 주어(Her name) + 동사(was) + 보어(Kwon Ki-ok)로 이루어진 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She was <span class=\"grammar-hl\">the first female pilot</span> in Korea.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">최초의 여성 비행사</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그녀는 한국 최초의 여성 비행사였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 권기옥이라는 인물이 역사적으로 어떤 중요한 위치에 있는 사람인지 설명합니다. 이 문장은 뒤따라올 그녀의 도전적인 삶을 뒷받침하는 핵심 근거가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the first female pilot 명사 수식: 서수(the first)와 형용사(female)가 명사(pilot)를 앞에서 수식하여 명사구의 의미를 구체화합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">female</td><td class=\"m\">여성의, 여자(의)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Emily는 ~도 발견했습니다</span><span class=\"en\"><b>Emily also found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오래된 신문을</span><span class=\"en\"><b><span class=\"grammar-hl\">an old newspaper</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책상 위에서.</span><span class=\"en\"><b>on the desk.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 책상 위에서 오래된 신문도 발견했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공간적 배경을 벽에서 책상으로 확장하며 관찰의 대상을 넓힙니다. 이제 사진을 넘어 신문 기사라는 객관적 자료를 통해 인물의 정보를 더 깊이 전달하겠다는 신호입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">an old newspaper 기본 구조: 형용사(old)가 명사(newspaper)를 앞에서 수식하는 일반적인 명사구 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것에는 ~라고 적혀 있었습니다</span><span class=\"en\"><b>It read, “At that time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당시에</span><span class=\"en\"><b>women couldn’t enter flight schools.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여성들은 비행 학교에 입학할 수 없었다.</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>Kwon Ki-ok</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">권기옥은</span><span class=\"en\"><b>didn’t give up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포기하지 않고</span><span class=\"en\"><b>and worked hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열심히 노력했다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to achieve</span> her dream.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿈을 이루기 위해.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(그것에는 “당시에 여성들은 비행 학교에 입학할 수 없었다. 하지만 권기옥은 포기하지 않고 꿈을 이루기 위해 열심히 노력했다.”라고 적혀 있었습니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당시 여성에게 가해졌던 사회적 제약과 이를 극복해낸 인물의 의지를 대조합니다. 신문 내용을 직접 인용함으로써 권기옥의 삶이 단순히 개인적인 성공이 아니라 시대적 한계를 돌파한 과정임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to achieve (to부정사): 목적을 나타내는 부사적 용법으로, &#39;꿈을 이루기 위해&#39;라는 의미로 동사 worked를 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">권기옥은</span><span class=\"en\"><b>Kwon Ki-ok <span class=\"grammar-hl\">did not just fly</span> airplanes.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순히 조종한 것이 아니었습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">비행기만.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">권기옥은 단순히 비행기만 조종한 것이 아니었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비행사라는 직업적 성취에 그치지 않고 그녀의 활동이 더 넓은 영역에 있었음을 예고합니다. 이전 문장들과 달리 그녀의 행보가 다른 차원으로 확장되고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did not just fly (관용표현): &#39;not just A&#39;는 &#39;단지 A만이 아니다&#39;라는 의미를 강조할 때 쓰는 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 ~기도 했습니다</span><span class=\"en\"><b>She also <span class=\"grammar-hl\">fought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일본에 맞서서</span><span class=\"en\"><b><span class=\"grammar-hl\">against</span> Japan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 독립을 위해 싸우.</span><span class=\"en\"><b>for Korea’s independence.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 한국의 독립을 위해 일본에 맞서서 싸우기도 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장을 구체적으로 부연 설명합니다. 그녀의 삶이 조국을 위한 헌신과 연결되어 있음을 밝히며, 그녀를 영웅적인 인물로 격상시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fought against (관용표현): &#39;fight against&#39;는 &#39;~에 맞서 싸우다&#39;라는 의미를 가진 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Emily는 감동을 받았습니다</span><span class=\"en\"><b>Emily <span class=\"grammar-hl\">was moved</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위대한 인생 이야기에</span><span class=\"en\"><b>by the great life story</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">권기옥의.</span><span class=\"en\"><b>of Kwon Ki-ok.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 권기옥의 위대한 인생 이야기에 감동을 받았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 마무리를 장식합니다. 관찰자인 에밀리가 앞선 정보들을 접하며 느낀 내면의 변화를 서술함으로써 독자에게도 그 감동을 전달하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was moved (수동태): be동사(was) + 과거분사(moved) 구조입니다. move는 타동사인데 목적어가 없어서 수동구조(was moved) 형태로 쓴다. 기본구조: V + O (주어가 감동을 주다/옮기다) 형태입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에밀리가 벽에 걸린 권기옥의 사진과 책상의 신문을 보며 그녀의 삶을 알아간다.</li><li>권기옥은 당시 여성이라는 사회적 제약을 극복하고 한국 최초의 여성 비행사가 되었다.</li><li>그녀는 비행을 넘어 조국의 독립을 위해 헌신한 인물이었다.</li><li>에밀리는 권기옥의 위대한 삶의 궤적을 접하며 큰 감동을 느낀다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Kwon Ki-ok became the first female pilot by overcoming social barriers, and she dedicated her life to fighting for Korea&#39;s independence.</div>\n              <div class=\"lec-final-sum-ko\">권기옥은 사회적 장벽을 극복하여 최초의 여성 비행사가 되었으며, 한국의 독립을 위해 싸우는 데 자신의 삶을 바쳤다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"m
