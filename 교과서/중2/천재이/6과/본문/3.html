e\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03살아있는 그림</div><ul><li>에밀리는 날아다니는 그림 중 하나인 꿀벌을 붙잡았다.</li><li>에밀리가 붙잡은 꿀벌 그림(drawing of a honeybee)</li><li>생생함이 느껴질 정도로 상세한 묘사(detailed)</li><li>마치 살아있는(alive) 것처럼 보이는 꿀벌의 모습</li><li>핵심 키워드: 생동감(vividness)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">step into</td><td class=\"m\">~에 들어가다, ~에 발을 들이다</td></tr><tr><td class=\"w\">be filled with</td><td class=\"m\">~로 가득 차다, ~로 붐비다</td></tr><tr><td class=\"w\">look like</td><td class=\"m\">~처럼 보이다, ~와 비슷하다</td></tr><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기, 뜻밖에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">catch</td><td class=\"m\">붙잡다, 포착하다</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정교한</td></tr><tr><td class=\"w\">alive</td><td class=\"m\">살아있는, 생기 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">에밀리는</span><span class=\"en\"><b>Emily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들어갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">stepped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 방 안으로</span><span class=\"en\"><b><span class=\"grammar-hl\">into</span> the next room.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 다음 방으로 들어갔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 서두에서 주인공인 에밀리가 새로운 공간으로 이동하는 장면을 통해 본격적으로 사건이 전개될 장소로 독자를 안내하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stepped into (관용표현): step into는 &#39;~로 들어가다&#39;라는 의미의 자동사+전치사 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 방은</span><span class=\"en\"><b>The room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가득 차 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was filled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 책들과 곤충과 식물의 그림들로</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> many books and drawings of insects and plants.</b></span></div></div><div class=\"lec-sent-ko\">그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 들어간 방의 내부 모습을 묘사합니다. 방 안의 환경을 구체적으로 보여줌으로써 이후 등장할 마법 같은 현상의 배경을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was filled with (수동태): be동사(was)+p.p.(filled) 구조입니다. fill은 타동사인데 목적어가 없어서 수동구조 was filled 형태로 씁니다. 기본구조: fill A with B (A를 B로 채우다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 숲처럼 보였다</span><span class=\"en\"><b><span class=\"grammar-hl\">looked like</span> a small forest.</b></span></div></div><div class=\"lec-sent-ko\">그곳은 작은 숲처럼 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 방 안에 가득한 동식물 자료들을 보고 에밀리가 느낀 인상을 전달합니다. 정적인 방이라는 공간이 마치 살아있는 생태계처럼 느껴질 만큼 신비로운 분위기임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked like (관용표현): look like는 &#39;~처럼 보이다&#39;라는 뜻으로, 뒤에 명사구가 목적어로 오는 연결동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀가 문을 닫았을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When she closed the door</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책상 위의 그림들이</span><span class=\"en\"><b><span class=\"grammar-hl\">drawings on the desk</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 시작했다</span><span class=\"en\"><b>suddenly started</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방 안 여기저기를 날아다니는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to fly</span> around the room.</b></span></div></div><div class=\"lec-sent-ko\">그녀가 문을 닫았을 때, 책상 위의 그림들이 갑자기 방 안 여기저기를 날아다니기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 평범하게 묘사된 공간에서 갑작스러운 판타지적 사건이 발생함을 보여줍니다. 정적인 방의 이미지와 대비되는 역동적인 움직임을 통해 독자의 호기심을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When she closed the door (분사구문(절)): when+주어+동사로 이루어진 시간의 부사절입니다.</div><div class=\"lec-gr-item\">drawings on the desk 5형식(SVOC) 구조의 일부분: start는 여기에서 목적어(drawings)의 동작(to fly)을 이끄는 타동사로 사용되었습니다.</div><div class=\"lec-gr-item\">to fly (to부정사): start의 목적보어로 쓰여, 명사(drawings)가 하는 동작을 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기, 뜻밖에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잡았다</span><span class=\"en\"><b>caught</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 중 하나를</span><span class=\"en\"><b><span class=\"grammar-hl\">one of them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그것들 중 하나를 잡았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 방 안을 날아다니는 수많은 그림 중에서 하나를 붙잡는 행동을 통해, 독자와 주인공이 특정 사물에 집중하게 유도하며 다음 정보로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one of them (관용표현): &#39;one of + 복수명사&#39; 구조로, 여러 개 중 하나를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿀벌의 그림</span><span class=\"en\"><b><span class=\"grammar-hl\">a drawing of a honeybee</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 꿀벌의 그림이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 잡은 사물이 무엇인지 구체적으로 명시합니다. 에밀리가 손에 쥔 그림의 정체를 밝히며 사건의 실체를 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a drawing of a honeybee (명사구): &#39;a drawing(명사) + of + 명사구&#39; 구조로, 앞에 있는 drawing의 내용을 설명하는 전치사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 세밀해서</span><span class=\"en\"><b>was <span class=\"grammar-hl\">so detailed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿀벌이 살아 있는 것처럼 보였다</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the honeybee <span class=\"grammar-hl\">looked alive</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 너무 세밀해서 꿀벌이 살아 있는 것처럼 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 그림의 특징을 설명합니다. 단순히 날아다니는 현상을 넘어, 그림이 현실과 구분이 안 될 정도로 정교하다는 점을 통해 방 안의 마법적 분위기를 극대화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so detailed that (관용표현): &#39;so + 형용사 + that + 절&#39; 구조로, &#39;너무 ~해서 ~하다&#39;라는 결과를 나타내는 접속사 that절입니다.</div><div class=\"lec-gr-item\">looked alive 5형식(SVOC) 구조: 주어(the honeybee)의 상태를 설명하는 보어(alive, 형용사)를 취하는 2형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정교한</td></tr><tr><td class=\"w\">alive</td><td class=\"m\">살아있는, 생기 있는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에밀리가 식물과 곤충 자료로 가득 찬 방에 들어간다.</li><li>방은 작은 숲 같은 느낌을 주며, 문을 닫자마자 그림들이 살아 움직인다.</li><li>에밀리는 날아다니는 그림 중 살아있는 것처럼 정교한 꿀벌 그림을 잡는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Emily enters a room filled with drawings, and the artwork suddenly comes to life when she closes the door.</div>\n              <div class=\"lec-final-sum-ko\">에밀리는 그림으로 가득 찬 방에 들어가고, 문을 닫자 그림들이 갑자기 살아 움직이기 시작한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio"
