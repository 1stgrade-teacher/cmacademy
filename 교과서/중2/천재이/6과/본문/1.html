리며 에밀리는 놀라운 경험을 한다.</li><li>조종사 복장을 착용하고 실감 나는 엔진 소리(sounds of airplane engines)를 들음</li><li>공간의 분위기에 몰입한 에밀리의 놀라움(surprise)</li><li>핵심 키워드: 체험(experience), 놀라움(surprise)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invitation</td><td class=\"m\">초대, 초대장</td></tr><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 평범한</td></tr><tr><td class=\"w\">celebrate</td><td class=\"m\">기념하다, 기리다, 찬양하다</td></tr><tr><td class=\"w\">exploration</td><td class=\"m\">탐험, 탐구</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hang</td><td class=\"m\">매달리다, 걸려 있다</td></tr><tr><td class=\"w\">display</td><td class=\"m\">전시하다, 드러내다</td></tr><tr><td class=\"w\">put on</td><td class=\"m\">~을 입다, ~을 쓰다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에밀리는 받았다</span><span class=\"en\"><b>Emily received</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초대장을 박물관으로부터</span><span class=\"en\"><b>an invitation from a museum.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, Emily는 박물관에서 초대장을 받았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본격적인 이야기가 시작됨을 알리는 도입부입니다. 에밀리라는 주인공이 특별한 공간인 박물관으로 향하게 되는 계기를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Exploring Greatness (현재분사(분사구문)): -ing가 문장 앞에 놓여 의미상의 주어(Emily)의 동작을 나타내며 부사적 기능을 수행함. 원문 구조는 &#39;As she was exploring greatness&#39;와 같이 접속사 + 주어 + 동사 형태로 전환 가능함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invitation</td><td class=\"m\">초대, 초대장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 박물관은</span><span class=\"en\"><b>This museum</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니었다</span><span class=\"en\"><b><span class=\"grammar-hl\">wasn’t</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 평범한 박물관도</span><span class=\"en\"><b>any ordinary museum.</b></span></div></div><div class=\"lec-sent-ko\">이 박물관은 평범한 박물관이 아니었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급된 박물관의 성격을 구체화합니다. 흔히 볼 수 있는 곳이 아니라 특별한 체험이나 전시가 이루어지는 장소라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wasn’t (be동사): 주어(This museum)의 상태를 설명하는 부정문 구조로, be동사 뒤에 not을 붙여 명사(ordinary museum)를 보어로 취함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 평범한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 방들을 가지고 있었다</span><span class=\"en\"><b>It had rooms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위대한 인물들을 기념하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that celebrated great people</span>.</b></span></div></div><div class=\"lec-sent-ko\">그곳에는 위대한 인물들을 기념하는 방들이 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박물관이 왜 평범하지 않은지 그 이유를 밝힙니다. 이 방들은 단순히 물건을 전시하는 곳이 아니라, 역사적 인물의 업적을 기리는 공간임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that celebrated great people (관계대명사): that이 주격 관계대명사로 쓰여 선행사(rooms)를 수식함. 관계대명사절 내부에서 that이 주어 역할을 하므로 뒤에 동사(celebrated)로 시작하는 불완전한 문장이 옴.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">celebrate</td><td class=\"m\">기념하다, 기리다, 찬양하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 들떠 있었다</span><span class=\"en\"><b>She was excited</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작하게 되어</span><span class=\"en\"><b><span class=\"grammar-hl\">to begin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 탐험을</span><span class=\"en\"><b><span class=\"grammar-hl\">her exploration</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그녀의 탐험을 시작하게 되어 들떠 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 에밀리의 심리 상태를 나타냅니다. 박물관이라는 공간이 단순히 관람하는 곳을 넘어, 그녀에게 설렘을 주는 모험의 장소가 되었음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to begin her exploration (to부정사): 앞의 형용사(excited)를 수식하는 부사적 용법으로, 감정의 원인을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exploration</td><td class=\"m\">탐험, 탐구</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 첫 번째 방문지는</span><span class=\"en\"><b>Her first stop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방이었다</span><span class=\"en\"><b>was a room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오래된 비행기 격납고처럼 보이는</span><span class=\"en\"><b><span class=\"grammar-hl\">that looked like</span> an old airplane garage.</b></span></div></div><div class=\"lec-sent-ko\">그녀의 첫 번째 방문지는 오래된 비행기 격납고처럼 보이는 방이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본격적인 박물관 관람이 시작되는 장면입니다. 방의 외형을 묘사하여 독자가 에밀리가 느낄 생생한 현장감을 상상하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that looked like (관계대명사): that이 주격 관계대명사로 쓰여 선행사(a room)를 수식함. 절 내부에서 주어 역할을 하므로 동사(looked)가 바로 이어짐.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모형 비행기들이</span><span class=\"en\"><b>Model airplanes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매달려 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were hanging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천장으로부터</span><span class=\"en\"><b>from the ceiling.</b></span></div></div><div class=\"lec-sent-ko\">모형 비행기들이 천장에 매달려 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공간의 특징을 묘사하는 보충 설명입니다. 시각적인 정보를 제공하여 해당 방의 주제가 비행과 관련된 것임을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were hanging (과거진행): be동사(were) + 현재분사(hanging)가 결합하여 과거 특정 시점에 진행 중이던 동작을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hang</td><td class=\"m\">매달리다, 걸려 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가죽 비행사 재킷과 고글이</span><span class=\"en\"><b>A leather pilot jacket and goggles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전시되어 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were displayed</span>.</b></span></div></div><div class=\"lec-sent-ko\">가죽 비행사 재킷과 고글이 전시되어 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인물과 관련된 소품을 보여줍니다. 관람객이 마치 그 인물이 된 것 같은 느낌을 받을 수 있게끔 유도하는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were displayed (수동태): be동사(were) + 과거분사(displayed) 구조. display는 타동사인데 목적어가 없어서 수동구조 were displayed 형태로 씀. 기본구조: display + O (O를 전시하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">display</td><td class=\"m\">전시하다, 드러내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">에밀리가 그것들을 입었을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When Emily put them on</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 들을 수 있었다</span><span class=\"en\"><b>she could hear</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소리들을 비행기 엔진의</span><span class=\"en\"><b>the sounds of airplane engines.</b></span></div></div><div class=\"lec-sent-ko\">Emily가 그것들을 입었을 때, 그녀는 비행기 엔진 소리를 들을 수 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박물관의 특별함을 직접적으로 보여주는 체험 장면입니다. 단순한 관람을 넘어 감각적인 몰입을 경험하게 하여 박물관의 정체를 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When Emily put them on (관용표현): put on(…을 입다/착용하다)은 이어동사(타동사+부사) 형태로, 목적어(them)가 대명사일 때 반드시 중간에 위치해야 하는 관용적 구조를 따름.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 방을 둘러보았다</span><span class=\"en\"><b>She looked around the room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라서</span><span class=\"en\"><b><span class=\"grammar-hl\">in surprise</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 놀라서 방을 둘러보았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 체험을 마친 에밀리의 반응입니다. 기대 이상의 놀라운 경험을 함으로써 그녀의 탐험이 성공적으로 시작되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in surprise (관용표현): 전치사 in과 추상명사 surprise가 결합하여 부사구처럼 쓰여 문장 전체의 상태를 수식함.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에밀리가 위대한 인물들을 기념하는 특별한 박물관에 초대받는다.</li><li>에밀리는 비행기 격납고처럼 꾸며진 첫 번째 방에서 비행사와 관련된 전시품을 관람한다.</li><li>전시품을 착용하자 실제 비행기 엔진 소리가 들리는 등 몰입형 체험을 경험한다.</li><li>에밀리는 박물관의 생생한 전시 방식에 놀라며 흥미진진한 탐험을 시작한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Emily visits a unique museum honoring great people, and she experiences their achievements through immersive exhibits.</div>\n              <div class=\"lec-final-sum-ko\">에밀리는 위대한 인물들을 기리는 독특한 박물관을 방문하며, 몰입형 전시를 통해 그들의 업적을 체험한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"
