stage-1\"><div class=\"lec-stage-head\">02권기옥의 도전과 애국심</div><ul><li>비행기 격납고를 재현한 방에서 에밀리는 한국 최초의 여성 비행사인 권기옥의 삶을 만난다.</li><li>비행복과 고글을 통한 생생한 체험</li><li>성차별을 극복한 권기옥(Kwon Ki-ok)의 불굴의 의지</li><li>독립운동(independence movement)에 헌신한 위대한 발자취</li><li>핵심 키워드: 여성 비행사(Female pilot), 독립(Independence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03파브르의 자연에 대한 열정</div><ul><li>곤충과 식물로 가득한 방에서 에밀리는 파브르의 연구와 자연을 향한 진심을 발견한다.</li><li>곤충학자 장 앙리 파브르(Jean-Henri Fabre)의 연구실 재현</li><li>찰스 다윈(Charles Darwin)과 주고받은 편지를 통한 업적 확인</li><li>30년 넘게 곤충을 관찰하며 기록한 자연에 대한 사랑</li><li>핵심 키워드: 곤충학자(Entomologist), 자연(Nature)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04탐험의 마무리</div><ul><li>두 인물의 삶을 통해 큰 감동을 받은 에밀리는 이 흥미로운 경험을 친구들과 나누고 싶어 한다.</li><li>위대한 삶의 이야기를 통한 감동(touched)</li><li>친구들에게 공유하고 싶은 특별한 모험</li><li>핵심 키워드: 모험(Adventure), 감동(Moved)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 평범한</td></tr><tr><td class=\"w\">celebrate</td><td class=\"m\">기념하다, 찬양하다</td></tr><tr><td class=\"w\">exploration</td><td class=\"m\">탐험, 탐구</td></tr><tr><td class=\"w\">in surprise</td><td class=\"m\">놀라서, 깜짝 놀라</td></tr><tr><td class=\"w\">female</td><td class=\"m\">여성의, 여자</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 단념하다</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">성취하다, 달성하다</td></tr><tr><td class=\"w\">fight against</td><td class=\"m\">~와 싸우다, ~에 맞서다</td></tr><tr><td class=\"w\">be moved by</td><td class=\"m\">~에 감동받다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">step into</td><td class=\"m\">~에 들어가다, 들어서다</td></tr><tr><td class=\"w\">be filled with</td><td class=\"m\">~로 가득 차다</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정교한</td></tr><tr><td class=\"w\">look alive</td><td class=\"m\">생생해 보이다, 살아 있는 것 같다</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">집어 들다, 잡다</td></tr><tr><td class=\"w\">truly</td><td class=\"m\">진심으로, 정말로</td></tr><tr><td class=\"w\">in every corner of</td><td class=\"m\">~의 곳곳에, 구석구석에</td></tr><tr><td class=\"w\">step out of</td><td class=\"m\">~에서 나오다</td></tr><tr><td class=\"w\">cannot wait to</td><td class=\"m\">~하고 싶어 죽겠다, ~하기를 몹시 기다리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">탐험하기</span><span class=\"en\"><b><span class=\"grammar-hl\">Exploring</span> Greatness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위대함을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(위대함을 탐험하기)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 박물관에서 겪게 될 에밀리의 모험이 글의 전체적인 배경임을 알려주며, 이어질 각 방의 체험 내용으로 독자를 안내하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Exploring (동명사): 문장의 핵심 소재로 &#39;-하는 것(탐험)&#39;이라는 명사 역할을 수행함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에밀리는 초대장을 받았는데</span><span class=\"en\"><b>Emily <span class=\"grammar-hl\">received</span> an invitation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박물관으로부터.</span><span class=\"en\"><b>from a museum.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, Emily는 박물관에서 초대장을 받았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 박물관에서 겪게 될 에밀리의 모험이 글의 전체적인 배경임을 알려주며, 이어질 각 방의 체험 내용으로 독자를 안내하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">received 동사: 주어(Emily)의 동작을 나타내는 일반동사 과거형</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 박물관은</span><span class=\"en\"><b>This museum</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평범한 박물관이 아니었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">wasn’t</span> any ordinary museum.</b></span></div></div><div class=\"lec-sent-ko\">이 박물관은 평범한 박물관이 아니었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 박물관이 특별한 장소임을 강조하며, 이후 에밀리가 경험할 신비로운 일들이 단순한 전시 관람을 넘어선 체험임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wasn’t 동사: be동사의 부정형(was not)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 평범한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳에는 방들이 있었는데</span><span class=\"en\"><b>It had <span class=\"grammar-hl\">rooms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위대한 인물들을 기리는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that celebrated great people</span>.</b></span></div></div><div class=\"lec-sent-ko\">그곳에는 위대한 인물들을 기념하는 방들이 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박물관의 핵심 목적을 밝히며, 이어서 등장할 인물(권기옥, 파브르)이 어떤 성격의 인물들인지 규정하는 기준이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rooms that celebrated great people (관계대명사): that이 주격 관계대명사로 사용되어 선행사 rooms를 수식함. that 뒤에 주어가 없는 불완전   <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a room that looked like (관계대명사): that이 주격 관계대명사로 선행사 a room을 수식함. that 뒤에 주어가 없는 불완전한 절이 옴</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모형 비행기들이</span><span class=\"en\"><b>Model airplanes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매달려 있었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">were hanging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천장에.</span><span class=\"en\"><b>from the ceiling.</b></span></div></div><div class=\"lec-sent-ko\">모형 비행기들이 천장에 매달려 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공간의 분위기를 구체적으로 묘사하여, 에밀리가 비행과 관련된 인물을 만날 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were hanging (현재진행): be동사(were) + -ing(hanging) 구조로, 과거 특정 시점에 천장에 매달려 있던 동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가죽 조종사 재킷과 고글이</span><span class=\"en\"><b>A leather pilot jacket and goggles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전시되어 있었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">were displayed</span>.</b></span></div></div><div class=\"lec-sent-ko\">가죽 비행사 재킷과 고글이 전시되어 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비행기 모형에 이어 비행사가 착용하는 물건들을 보여줌으로써, 권기옥의 직업적 정체성을 실감 나게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were displayed (수동태): be동사(were)+p.p.(displayed) 구조. display는 타동사인데 목적어가 없어서 수동구조 were di meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하나의 탐험이 끝나고 새로운 대상에 대한 탐험이 시작됨을 알리는 공간 이동입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stepped into (관용표현): &#39;~안으로 발을 들여놓다&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 방은</span><span class=\"en\"><b>The room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채워져 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was filled with</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 책과 그림들로</span><span class=\"en\"><b>many books and drawings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곤충과 식물의.</span><span class=\"en\"><b>of insects and plants.</b></span></div></div><div class=\"lec-sent-ko\">그 방은 많은 책들과 곤충과 식물의 그림들로 가득 차 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연과학과 관련된 방의 성격을 묘사하며 다음 주인공인 파브르의 분야를 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was filled with (수동태): be동사(was)+p.p.(filled) 구조. fill은 타동사인데 목적어가 없어서 수동구조 was filled 형태로 씀. 기본구조: fill + O + with B (O를 B로 채우다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보였다</span><span class=\"en\"><b><span class=\"grammar-hl\">looked like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 숲처럼.</span><span class=\"en\"><b>a small forest.</b></span></div></div><div class=\"lec-sent-ko\">그곳은 작은 숲처럼 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meani hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one of them (관용표현): &#39;그들 중 하나&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿀벌 그림.</span><span class=\"en\"><b>a drawing of a honeybee.</b></span></div></div><div class=\"lec-sent-ko\">그것은 꿀벌의 그림이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림의 구체적인 대상을 밝혀 앞서 언급한 곤충학자라는 주제를 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 동사: 주격 보어를 취하는 연결동사</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었는데</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 정교해서</span><span class=\"en\"><b><span class=\"grammar-hl\">so detailed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꿀벌이 살아있는 것처럼 보였다.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the honeybee looked alive.</b></span></div></div><div class=\"lec-sent-ko\">그것은 너무 세밀해서 꿀벌이 살아 있는 것처럼 보였습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림의 수준을 언급하며, 이 공간의 주인이 얼마나 대상을 섬세하게 관찰하고 기록했는지를 짐작하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so detailed that (강조구문): &#39;너무 ~해서 그 결과 …하다&#39;를 나타내는 so... that 구문</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정교한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">책꽂이 중 하나에서,</span><span class=\"en\"><b>From one of the bookshelves,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에밀리는</span><span class=\"en\"><b>Emily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견했다</span><span class=\"en\"><b>found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛나는 책을.</span><span class=\"en\"><b>a <span class=\"grammar-hl\">shining book</span>.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 책장 중 하나에서 빛나는 책을 발견했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다음 주인공인 파브르에게로 에밀리의 관심이 집중되도록 유도하는 물건을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shining book (현재분사): shining이 뒤의 명사 book을 수식하여 &#39;빛나는&#39;이라는 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집어 들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">picked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">it up</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그것을 집어 들었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 발견에서 확인으로 이어지는 탐험 과정을 매끄럽게 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">picked it up (관용표현): &#39;그것을 집어 들다&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보았다</span><span class=\"en\"><b><span class=\"grammar-hl\">saw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장 앙리 파브르라는 이름을</span><span class=\"en\"><b>the name Jean-Henri Fabre</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표지에서.</span><span class=\"en\"><b>on its cover.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 표지에서 Jean-Henri Fabre의 이름을 보았습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 방의 주인공이 파브르임을 명확하게 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw 동사: 5형식 구조(saw + O + 보어 생략/명사구 목적어)로 주어가 인지한 대상을 서술</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀가 책을 펼쳤을 때,</span><span class=\"en\"><b>When she opened the book,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>she</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견했다</span><span class=\"en\"><b><span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오래된 편지를</span><span class=\"en\"><b>an old letter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찰스 다윈으로부터 온.</span><span class=\"en\"><b>from Charles Darwin.</b></span></div></div><div class=\"lec-sent-ko\">책을 열었을 때, 그녀는 Charles Darwin에게서 온 오래된 편지를 발견했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 파브르의 위대함을 당대의 저명한 학자인 다윈의 권위를 빌려 다시 한번 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">found 동사: 일반동사 과거형</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것에는</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰여 있었다</span><span class=\"en\"><b>said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책을 보내주셔서 감사합니다.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Thank you for</span> sending me your book.</b></span></div></div><div class=\"lec-sent-ko\">그것에는 “당신의 책을 제게 보내 주셔서 감사합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다윈과 파브르가 서로의 연구를 존중하는 학술적 교류를 하고 있었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thank you for (관용표현): &#39;~에 대해 감사하다&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진심으로 좋아합니다</span><span class=\"en\"><b>truly <span class=\"grammar-hl\">love</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 곤충에 관한 연구를.</span><span class=\"en\"><b>your work about insects.”</b></span></div></div><div class=\"lec-sent-ko\">저는 곤충에 관한 당신의 연구를 진심으로 사랑합니다.”라고 쓰여 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다윈이 파브르의 연구를 높이 평가했다는 점을 직접적인 인용으로 드러내어 파브르의 업적을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">love 동사: 주어(I)의 감정을 나타내는 일반동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">truly</td><td class=\"m\">진심으로, 정말로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 34 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">에밀리는</span><span class=\"en\"><b>Emily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알게 되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파브르가 곤충에 관한 많은 책을 썼다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> Fabre wrote many books about insects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">30년 넘게.</span><span class=\"en\"><b>for more than thirty years.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 Fabre가 30년 넘게 곤충에 관한 많은 책들을 썼다는 것을 알게 되었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 파브르의 끈기 있는 연구 태도를 설명하여, 그가 자연을 얼마나 사랑했는지 구체적인 시간으로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learned that (명사절): that이 이끄는 절이 learned의 목적어로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연에 대한 그의 진정한 사랑은</span><span class=\"en\"><b>His true love for nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">드러나 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was shown</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명확하게</span><span class=\"en\"><b>clearly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방 구석구석에.</span><span class=\"en\"><b>in every corner of the room.</b></span></div></div><div class=\"lec-sent-ko\">자연에 대한 그의 진정한 사랑은 방의 모든 구석에서 분명하게 보여졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 방의 탐험을 정리하며, 전시물 하나하나가 모두 파브르의 열정을 반영하고 있다는 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was shown (수동태): be동사(was)+p.p.(shown) 구조. show는 타동사인데 목적어가 없어서 수동구조 was shown 형태로 씀. 기본구조: show + O + to B (O를 B에게 보여주다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in every corner of</td><td class=\"m\">~의 곳곳에, 구석구석에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 36 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">에밀리는</span><span class=\"en\"><b>Emily</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걸어 나왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">stepped out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마지막 방에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> the last room.</b></span></div></div><div class=\"lec-sent-ko\">Emily는 마지막 방에서 나왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 모든 탐험이 끝났음을 알리며, 이제는 관람객에서 정보 전달자로 에밀리의 역할이 변화할 것을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stepped out of (관용표현): &#39;~에서 나오다&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 37 / 37</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었는데</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무나 신이 나서</span><span class=\"en\"><b><span class=\"grammar-hl\">so excited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들에게 빨리 말하고 싶어 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> she could not wait <span class=\"grammar-hl\">to tell</span> her friends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 모험에 대해.</span><span class=\"en\"><b>about her adventure.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 너무 신이 나서 친구들에게 자신의 모험에 대해 빨리 이야기하고 싶었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 탐험의 여운이 에밀리에게 큰 기쁨을 주었으며, 이 경험을 타인과 공유하고 싶어 한다는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so excited that (강조구문): &#39;너무 ~해서 …할 수 없다&#39;를 나타내는 so... that 구문</div><div class=\"lec-gr-item\">to tell (to부정사): 부사적 용법 중 감정의 원인(excited)을 보충 설명함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에밀리는 위대한 인물들을 기리는 특별한 박물관에 초대받아 탐험을 시작한다.</li><li>첫 번째 방에서 한국 최초의 여성 비행사 권기옥의 용기와 애국심을 체험한다.</li><li>두 번째 방에서는 곤충학자 장 앙리 파브르가 자연을 향해 쏟은 30년의 열정을 확인한다.</li><li>에밀리는 두 위인의 삶을 직접 경험하고 큰 감동을 받아 친구들에게 이 이야기를 전하고 싶어 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Emily explores a special museum featuring historical figures like Kwon Ki-ok and Jean-Henri Fabre, and she finds deep inspiration through their challenging yet devoted lives.</div>\n              <div class=\"lec-final-sum-ko\">에밀리는 권기옥과 장 앙리 파브르와 같은 역사적 인물을 다루는 특별한 박물관을 탐험하며, 그들의 도전적이고 헌신적인 삶을 통해 깊은 영감을 얻는다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],
