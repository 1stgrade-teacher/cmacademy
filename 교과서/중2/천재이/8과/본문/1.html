<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중2 2학기 기말고사 중2 천재(이) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 천재(이) 8과 본문1","audioDir":"1_audio","preview":false,"count":56,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>천재(이)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>The Legend of the Big Dipper and the Seven Brothers\u003c/h1>\u003ch2>북두칠성과 일곱 형제의 전설\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 이 글은 밤하늘의 \u003cb class=\"key\">북두칠성\u003c/b>이 아픈 어머니를 살리기 위해 \u003cb class=\"key\">효도\u003c/b>를 다한 일곱 형제의 사랑에서 유래했다는 \u003cb class=\"key\">전설\u003c/b>을 소개하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Big Dipper in the night sky originated from the touching love of seven devoted brothers for their sick mother.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 함께 공부할 지문은 밤하늘의 별과 관련된 한국의 전설이에요. 밤하늘에서 흔히 볼 수 있는 북두칠성이 어떤 사연으로 만들어졌는지 일곱 형제의 이야기를 통해 알아볼게요. 어머니를 향한 형제들의 지극한 사랑이 어떻게 별이 되었는지 집중해서 들어보세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락(한국어 4~6문장, 고등학생 눈높이, 관련 개념·용어 영어 병기, 일상 비유 1개, 핵심어 \u003cb class=\"key\"> \u003c/b> 표시): 세계 여러 문화권에서는 밤하늘의 밝은 별무리를 특정한 사물이나 동물로 묶어 \u003cb class=\"key\">별자리\u003c/b> (constellation) 또는 \u003cb class=\"key\">신화\u003c/b>적 이야기와 연결해 왔습니다. 마치 우리가 스마트폰 화면의 아이콘들을 보며 의미를 부여하는 것처럼, 고대 사람들도 밤하늘의 별을 보며 상상력을 펼쳤습니다. 특히 \u003cb class=\"key\">북두칠성\u003c/b> (the Big Dipper)은 북쪽 하늘에서 가장 눈에 띄는 \u003cb class=\"key\">큰숟가락\u003c/b> 모양의 별무리로, 동서양을 막론하고 다양한 전설의 소재가 되었습니다. 한국의 전설에서는 이 별무리가 \u003cb class=\"key\">효도\u003c/b> (filial piety)를 상징하는 일곱 형제의 이야기에 빗대어 설명됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 살펴볼게요. 밤하늘의 별무리는 옛사람들에게 상상력의 원천이었어요. 세계 여러 문화권에서는 반짝이는 별들을 보며 다양한 별자리와 신화를 만들어 냈죠. 특히 북쪽 하늘의 북두칠성은 동서양을 막론하고 흥미로운 전설의 주인공이 되었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>북두칠성과 전설의 도입\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>밤하늘의 \u003cb class=\"key\">북두칠성\u003c/b>을 찾는 방법과 모양을 설명하고, 전 세계에 이에 얽힌 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 존재함을 밝히고 있습니다. 그중 대표적인 두 가지 이야기 중 하나를 소개하기 위한 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>일곱 형제와 아픈 어머니\u003csmall>전개 · 문장 6–11\u003c/small>\u003c/h4>\u003cp>한국에 전해지는 \u003cb class=\"key\">북두칠성\u003c/b> 전설로, 아픈 어머니를 모시던 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">형제\u003c/b>가 \u003cb class=\"key\">산 \u003c/b>\u003cb class=\"key\">너머 \u003c/b>\u003cb class=\"key\">샘물\u003c/b>이 병을 고친다는 말을 듣고 험한 길을 걸어 물을 구해 \u003cb class=\"key\">어머니의 \u003c/b>\u003cb class=\"key\">병\u003c/b>을 낫게 한 과정을 다룹니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>하늘의 감동과 별의 탄생\u003csmall>결론 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>어머니를 향한 형제들의 \u003cb class=\"key\">사랑\u003c/b>에 감동한 \u003cb class=\"key\">옥황상제\u003c/b>가 이들을 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">별\u003c/b>로 바꾸어 밤하늘의 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">숟가락 \u003c/b>\u003cb class=\"key\">모양\u003c/b>이 되게 하였으며, 이를 통해 형제의 \u003cb class=\"key\">효도\u003c/b>를 떠올리게 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 북두칠성과 관련된 전설의 유래를 시간 순서에 따라 전개하고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 밤하늘을 올려다보면 보이는 일곱 개의 밝은 별과 북두칠성의 모양을 소개하면서 세계 여러 나라에 이와 관련된 많은 이야기가 전해진다고 말하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 한국에 전해지는 일곱 형제의 이야기를 시작해요. 아픈 어머니를 모시던 형제들이 산 너머에 병을 고치는 샘물이 있다는 말을 듣고 험한 길을 걸어 물을 구해와 어머니의 병을 낫게 한 사연을 들려주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 옥황상제가 어머니를 향한 형제들의 사랑에 감동하여 이들을 일곱 개의 별로 만들었다고 설명해요. 그래서 우리가 북두칠성을 볼 때마다 형제들의 효도를 떠올릴 수 있다는 교훈을 전하며 글이 마무리돼요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 밤하늘의 \u003cb class=\"key\">북두칠성\u003c/b> 모양을 소개한 뒤, 한국에 전해지는 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">형제\u003c/b>의 전설을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>에 따라 전개하고 있습니다. 형제들이 어머니를 구하기 위해 \u003cb class=\"key\">샘물\u003c/b>을 찾아 험한 길을 걷고 병을 고친 사건이 \u003cb class=\"key\">옥황상제\u003c/b>의 감동으로 이어져 별이 되었다는 인과적 서사를 보여줍니다. 마지막 문장에서는 \u003cb class=\"key\">북두칠성\u003c/b>을 통해 형제의 \u003cb class=\"key\">사랑\u003c/b>을 떠올릴 수 있다는 \u003cb class=\"key\">요지\u003c/b>를 밝히며 글을 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Once upon a time (7)\u003c/b>\u003cspan>시간의 흐름 시작\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>인과 관계\u003c/span>\u003cb>Later (13)\u003c/b>\u003cspan>시간의 경과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">seven bright stars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Big Dipper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">seven brothers and the Big Dipper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">seven brothers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Sky Emperor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the seven brothers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">These stars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Big Dipper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the seven brothers' love for their mom\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 밤하늘의 북두칠성이라는 소재를 먼저 제시한 뒤, 한국에 전해지는 구체적인 전설을 시간 순서에 따라 펼쳐 보이는 미괄식 구조로 되어 있어요. 사건의 흐름에 따라 인과 관계가 자연스럽게 이어지면서 마지막에 핵심 주제를 전달하고 있죠.","hl":"ty"},{"n":8,"text":"문장 속에서 시간의 흐름과 인과 관계를 나타내는 표현들을 잘 찾아야 해요. Once upon a time이라는 표현으로 옛날 이야기의 시작을 알리고, So를 통해 형제들이 샘물을 구하러 길을 떠나는 결과를 보여주며, Later를 통해 시간이 흘러 별로 변하게 되는 과정을 매끄럽게 연결하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>look up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>올려다보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>connect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다, 이루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모양\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>주위에, 전 세계에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>spring\u003c/b>\u003cem>명사\u003c/em>\u003cspan>샘물, 봄\u003c/span>\u003c/div>\u003cdiv>\u003cb>heal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>치료하다, 낫게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sickness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병, 병\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘든, 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>get well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>병이 낫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>touch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감동시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 바꾸다, 변하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>night sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밤하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 떠올리다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사랑\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에 나온 중요 표현들을 짚어볼게요. look up at은 올려다보다라는 뜻이고, connect는 연결하다라는 의미예요. get well은 병이 낫다라는 숙어이고, turn into는 ~로 바꾸다라는 뜻이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">heal\u003c/b>\u003cspan class=\"m\">치료하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cure\u003c/span>\u003cspan class=\"s\">treat\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"s\">unwell\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hard\u003c/b>\u003cspan class=\"m\">힘든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">touch\u003c/b>\u003cspan class=\"m\">감동시 3c/b>\u003cb class=\"key\">그러면 \u003c/b>\u003cb class=\"key\">...할 \u003c/b>\u003cb class=\"key\">것이다\u003c/b>라는 뜻이 되어 \u003cb class=\"key\">조건\u003c/b>의 의미를 나타낸답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + and\u003c/span> : 명령문, and + 주어 + 조동사 미래(will) + 동사원형 : \"올려다보면, 그리고 여러분은 발견할 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Look up at the sky, 하늘을 올려다보면. at night, 밤에. and you will find, 그리고 여러분은 발견할 것입니다. seven bright stars in the north, 북쪽에서 일곱 개의 밝은 별을. 이 문장 전체를 해석하면, 밤하늘을 올려다보면 여러분은 북쪽에서 일곱 개의 밝은 별을 발견할 것입니다.","hl":"m"},{"n":12,"text":"첫 번째 문장은 밤하늘 북쪽을 보며 북두칠성을 찾도록 이끌어주는 역할을 해요. 명령문 뒤에 and가 와서 ~해라 그러면 이라는 뜻을 가지며 조건의 의미를 나타낸답니다.","hl":"mn"},{"n":13,"text":"첫 번째 어법 포인트는 명령문 뒤에 쓰인 and예요. 명령문, and 구조는 ~해라 그러면이라는 뜻으로 조건의 의미를 나타내죠. 그래서 and 대신 if you look이라고 바꿔 쓸 수도 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것들을 연결하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">connect \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 형성합니다\u003c/span>\u003cspan class=\"en\">they form\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 숟가락 모양을\u003c/span>\u003cspan class=\"en\">the shape of a big spoon.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 그것들을 연결하면 큰 숟가락 모양을 이룹니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일곱 개의 별을 선으로 이었을 때 어떤 모양이 되는지 설명하는 문장이에요. \u003cb class=\"key\">접속사 \u003c/b>\u003cb class=\"key\">If\u003c/b>를 사용해 별들을 연결하는 \u003cb class=\"key\">조건\u003c/b>을 나타내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : If + 주어 + 동사, 주어 + 동사 : \"만약 여러분이 그것들을 연결한다면\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"If you connect them, 여러분이 그것들을 연결하면. they form, 그것들은 형성합니다. the shape of a big spoon, 큰 숟가락 모양을. 이 문장 전체를 해석하면, 여러분이 그것들을 연결하면 큰 숟가락 모양을 이룹니다.","hl":"m"},{"n":15,"text":"두 번째 문장은 일곱 개의 별을 선으로 이었을 때 생기는 모습을 설명해요. 접속사 if를 써서 별들을 연결하는 조건을 나타내고 있답니다.","hl":"mn"},{"n":16,"text":"두 번째 어법 포인트는 조건을 나타내는 접속사 if예요. if는 만약 ~라면이라는 뜻으로 어떤 조건이나 상황을 가정할 때 사용되죠. 여기서는 별들을 연결하는 조건을 보여주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 부릅니다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북두칠성이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Big \u003c/span>\u003cspan class=\"tgt\">Dipper\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 이것을 북두칠성이라고 부릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 큰 숟가락 모양을 한 별들의 무리를 \u003cb class=\"key\">북두칠성\u003c/b>이라고 부른다는 것을 알려주는 문장이에요. 주어, 동사, 목적어, \u003cb class=\"key\">목적격 \u003c/b>\u003cb class=\"key\">보어\u003c/b>가 모두 쓰인 \u003cb class=\"key\">5형식 \u003c/b>\u003cb class=\"key\">문장\u003c/b> 형태랍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장구조\u003c/span> : 주어 + 동사(call) + 목적어(it) + 목적격 보어(the Big Dipper) : \"이것을 북두칠성이라고 부르다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"People call, 사람들은 부릅니다. it, 이것을. the Big Dipper, 북두칠성이라고. 이 문장 전체를 해석하면, 사람들은 이것을 북두칠성이라고 부릅니다.","hl":"m"},{"n":18,"text":"세 번째 문장은 큰 숟가락 모양의 별 무리를 북두칠성이라고 부른다는 것을 말해줘요. 5형식 구조를 통해 무엇을 뭐라고 부르는지 명확하게 설명하고 있답니다.","hl":"mn"},{"n":19,"text":"세 번째 어법 포인트는 call 동사가 쓰인 5형식 문장 구조예요. call은 주어와 동사 뒤에 목적어와 목적격 보어가 나와서 목적어를 목적격 보어라고 부른다는 뜻을 만들죠. 여기서는 it을 the Big Dipper라고 부르고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~가 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 이야기들이\u003c/span>\u003cspan class=\"en\">many stories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 관한\u003c/span>\u003cspan class=\"en\">about it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계적으로\u003c/span>\u003cspan class=\"en\">around the world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 세계적으로 그것에 관한 많은 이야기가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">북두칠성\u003c/b>이라는 \u003cb class=\"key\">소재\u003c/b>에 대해 전 세계적으로 다양한 \u003cb class=\"key\">이야기\u003c/b>가 존재함을 소개하며 글의 배경을 넓히는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there 구문\u003c/span> : There [유도부사] + are [동사] + 복수주어 : \"~가 있다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"There are, ~가 있습니다. many stories, 많은 이야기들이. about it, 그것에 관한. around the world, 전 세계적으로. 이 문장 전체를 해석하면, 전 세계적으로 그것에 관한 많은 이야기가 있습니다.","hl":"m"},{"n":21,"text":"이 문장은 북두칠성에 대해 전 세계적으로 다양한 이야기가 존재한다는 것을 알려주며 화제를 자연스럽게 확장하고 있어요.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 There are 구문이에요. 주어가 복수명사인 many stories이기 때문에 is가 아니라 복수동사 are를 쓴다는 것을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 ~가 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들 중 두 가지 이야기가\u003c/span>\u003cspan class=\"en\">two of them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기 그것들 중 두 가지 이야기가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전 세계의 많은 이야기 중 앞으로 들려줄 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 구체적으로 소개하며 본문으로 독자를 이끄는 \u003cb class=\"key\">연결고리\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도치 구문\u003c/span> : Here [유도부사] + are [동사] + 복수주어 [two of them] : \"여기 ~가 있다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Here are, 여기 ~가 있습니다. two of them, 그것들 중 두 가지 이야기가. 이 문장 전체를 해석하면, 여기 그것들 중 두 가지 이야기가 있습니다.","hl":"m"},{"n":24,"text":"이 문장은 전 세계의 많은 이야기 중에서 앞으로 우리가 살펴볼 두 가지 이야기를 구체적으로 소개하는 역할을 해요.","hl":"mn"},{"n":25,"text":"첫 번째 어법 포인트는 도치 구문이에요. Here가 문장 맨 앞에 오면서 주어와 동사의 위치가 바뀌어서, 주어가 복수일 때 are가 온다는 점을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국에는\u003c/span>\u003cspan class=\"en\">In Korea,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~가 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기가\u003c/span>\u003cspan class=\"en\">a story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일곱 형제와\u003c/span>\u003cspan class=\"en\">about seven brothers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북두칠성에 관한\u003c/span>\u003cspan class=\"en\">and the Big Dipper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한국에는 일곱 형제와 북두칠성에 관한 이야기가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 두 가지 이야기 중 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>인 \u003cb class=\"key\">한국의 \u003c/b>\u003cb class=\"key\">전설\u003c/b>을 본격적으로 시작하는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there 구문\u003c/span> : There [유도부사] + is [동사] + 단수주어 [a story] : \"~가 있다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"In Korea, 한국에는. there is, ~가 있습니다. a story, 이야기가. about seven brothers, 일곱 형제와. and the Big Dipper, 북두칠성에 관한. 이 문장 전체를 해석하면, 한국에는 일곱 형제와 북두칠성에 관한 이야기가 있습니다.","hl":"m"},{"n":27,"text":"이 문장은 앞서 예고한 두 가지 이야기 중 첫 번째로 우리나라의 전설인 일곱 형제와 북두칠성 이야기를 본격적으로 시작하고 있어요.","hl":"mn"},{"n":28,"text":"첫 번째 어법 포인트는 유도부사 구문이에요. 뒤에 나오는 주어가 단수명사 a story이기 때문에 동사로 is를 썼다는 것을 정확히 확인해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날 옛적에\u003c/span>\u003cspan class=\"en\">Once upon a time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일곱 형제가 살았습니다\u003c/span>\u003cspan class=\"en\">seven brothers lived\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아픈 어머니와 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">sick \u003c/span>\u003cspan class=\"tgt\">mom\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날 옛적에 일곱 형제가 아픈 어머니와 함께 살았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적인 전래동화의 시작을 알리는 도입부 문장입니다. \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">형제\u003c/b>와 \u003cb class=\"key\">아픈 \u003c/b>\u003cb class=\"key\">어머니\u003c/b>라는 핵심 인물이 등장하며 비극적이고 애틋한 사연의 배경을 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 수식\u003c/span> : 전치사 [with] + 명사구 [their sick mom] : \"아픈 어머니와 함께\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Once upon a time, 옛날 옛적에. seven brothers lived, 일곱 형제가 살았습니다. with their sick mom, 아픈 어머니와 함께. 이 문장 전체를 해석하면, 옛날 옛적에 일곱 형제가 아픈 어머니와 함께 살았습니다.","hl":"m"},{"n":30,"text":"이번 문장은 옛이야기가 시작된다는 것을 알려주는 도입부예요. 일곱 형제가 아픈 어머니와 함께 살고 있었다는 배경을 우리에게 차분하게 소개하고 있답니다.","hl":"mn"},{"n":31,"text":"어법 포인트 살펴볼게요. 마지막에 나온 with their sick mom에서 전치사 with는 누구와 함께인지를 나타내서 형제들이 아픈 어머니와 함께 살았다는 것을 잘 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 들었습니다\u003c/span>\u003cspan class=\"en\">They heard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">샘물이 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">spring\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산 너머에\u003c/span>\u003cspan class=\"en\">over the mountain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 산 너머에 샘물이 있다는 이야기를 들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 형제들이 어머니의 병을 고치기 위해 모험을 떠나게 되는 결정적인 계기가 제시되는 문장입니다. \u003cb class=\"key\">산 \u003c/b>\u003cb class=\"key\">너머\u003c/b>에 있는 \u003cb class=\"key\">샘물\u003c/b>이라는 소문을 듣게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there 구문\u003c/span> : there + be동사 [was] + 주어 [a water spring] : \"샘물이 있다는\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"They heard, 그들은 들었습니다. there was a water spring, 샘물이 있다는 것을. over the mountain, 산 너머에. 이 문장 전체를 해석하면, 그들은 산 너머에 샘물이 있다는 이야기를 들었습니다.","hl":"m"},{"n":33,"text":"이 문장은 형제들이 어머니를 살릴 방법을 찾아 나서는 중요한 계기가 되는 장면이에요. 산 너머에 샘물이 있다는 소문을 듣게 되었다는 내용을 담고 있답니다.","hl":"mn"},{"n":34,"text":"어법 포인트는 중간에 있는 there was a water spring 부분이에요. 새로운 존재를 소개할 때 쓰는 유도부사 there를 쓰고 뒤에 주어인 a water spring이 단수라서 단수 동사 was를 썼다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 말했습니다\u003c/span>\u003cspan class=\"en\">People said\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물이 병을 치료할 수 있다고\u003c/span>\u003cspan class=\"en\">the water \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">heal\u003c/span> sickness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 그 물이 병을 치료할 수 있다고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞문장에서 언급된 샘물의 특별한 효능을 구체적으로 설명합니다. 그 물이 \u003cb class=\"key\">병을 \u003c/b>\u003cb class=\"key\">치료할\u003c/b> 수 있다는 믿음을 주며 형제들의 여정을 정당화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 과거형\u003c/span> : 조동사 [could] + 동사원형 [heal] : \"치료할 수 있다고\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"People said, 사람들은 말했습니다. the water could heal sickness, 그 물이 병을 치료할 수 있다고. 이 문장 전체를 해석하면, 사람들은 그 물이 병을 치료할 수 있다고 말했습니다.","hl":"m"},{"n":36,"text":"앞서 말한 그 샘물이 어떤 특별한 힘을 가졌는지 알려주는 문장이에요. 사람들이 그 물을 마시면 병을 치료할 수 있다고 소문 을 내고 있다는 뜻이죠.","hl":"mn"},{"n":37,"text":"어법 포인트를 짚어보면 could heal이라는 표현이 나와요. 전체 이야기가 과거에 일어난 일이라서 조동사 can을 과거형인 could로 바꿔서 썼다는 것을 눈여겨보면 좋겠어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형제들은 걸었습니다\u003c/span>\u003cspan class=\"en\">the brothers walked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길고 험한 길을\u003c/span>\u003cspan class=\"en\">a long and hard path\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산을 넘어\u003c/span>\u003cspan class=\"en\">over the mountain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물을 구하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get\u003c/span> the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 형제들은 그 물을 구하기 위해 산을 넘어 길고 험한 길을 걸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아픈 어머니를 살리기 위해 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">형제\u003c/b>가 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">스프링\u003c/b>을 향해 험난한 여정을 떠나는 모습을 보여주는 문장입니다. \u003cb class=\"key\">to부정사\u003c/b>의 부사적 용법이 사용되어 행동의 목적을 명확히 전달하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 동사 + 목적어 + [to부정사구 (to + 동사원형)] : \"구하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"So, 그래서. the brothers walked, 형제들은 걸었습니다. a long and hard path, 길고 험한 길을. over the mountain, 산을 넘어. to get the water, 그 물을 구하기 위해. 이 문장 전체를 해석하면, 그래서 형제들은 그 물을 구하기 위해 산을 넘어 길고 험한 길을 걸었습니다.","hl":"m"},{"n":39,"text":"이번 문장은 일곱 형제가 어머니를 살릴 물을 구하기 위해서 산을 넘어 고생하는 장면이에요. 목적을 나타내는 표현이 아주 중요하게 쓰였답니다.","hl":"mn"},{"n":40,"text":"어법 포인트는 맨 뒤에 나온 to get이에요. 동사원형 앞에 to를 붙여서 무엇무엇을 하기 위해서라는 목적을 나타내는 to부정사의 부사적 용법으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그것을 드렸고\u003c/span>\u003cspan class=\"en\">They gave it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어머니께\u003c/span>\u003cspan class=\"en\">to their mom,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내 어머니는 병이 나았습니다.\u003c/span>\u003cspan class=\"en\">she finally got well.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그것을 어머니께 드렸고, 마침내 어머니는 병이 나았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 형제들이 가져다준 물 덕분에 어머니가 \u003cb class=\"key\">병이 \u003c/b>\u003cb class=\"key\">낫게 \u003c/b>\u003cb class=\"key\">되는\u003c/b> 결정적인 전환점입니다. \u003cb class=\"key\">등위접속사\u003c/b> and를 통해 두 개의 절을 자연스럽게 연결하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : [절 1] + [, and] + [절 2] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"They gave it, 그들은 그것을 드렸고. to their mom, 어머니께. and, 그리고. she finally got well, 마침내 어머니는 병이 나았습니다.. 이 문장 전체를 해석하면, 그들은 그것을 어머니께 드렸고, 마침내 어머니는 병이 나았습니다.","hl":"m"},{"n":42,"text":"형제들이 고생 끝에 얻은 물을 어머니에게 드렸고, 드디어 어머니의 병이 낫는 기쁜 순간이에요.","hl":"mn"},{"n":43,"text":"어법 포인트는 문장을 이어주는 접속사 and예요. 앞 문장과 뒤 문장의 내용을 자연스럽게 연결해 주는 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥황상제는\u003c/span>\u003cspan class=\"en\">The Sky Emperor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감동을 받았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">touched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 사랑에\u003c/span>\u003cspan class=\"en\">by their love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어머니에 대한\u003c/span>\u003cspan class=\"en\">for their mom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옥황상제는 그들의 어머니에 대한 사랑에 감동을 받았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어머니를 향한 형제들의 효심에 \u003cb class=\"key\">옥황상제\u003c/b>가 감복하는 장면으로, \u003cb class=\"key\">수동태\u003c/b> 구문을 통해 주어가 감동을 받게 된 원인을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 + [be동사(was) + 과거분사(touched)] : \"감동을 받았다\"\u003c/div>\u003c/div>","segs":[{"n":44,"text":"The Sky Emperor, 옥황상제는. was touched, 감동을 받았습니다. by their love, 그들의 사랑에. for their mom, 어머니에 대한. 이 문장 전체를 해석하면, 옥황상제는 그들의 어머니에 대한 사랑에 감동을 받았습니다.","hl":"m"},{"n":45,"text":"형제들의 지극한 효심을 보고 옥황상제가 큰 감동을 받는 내용이에요. 다음 이야기가 어떻게 전개될지 기대하게 만들죠.","hl":"mn"},{"n":46,"text":"어법 포인트는 was touched예요. 옥황상제가 직접 감동을 준 게 아니라 감동을 받은 것이므로 be동사 다음에 과거분사를 쓴 수동태 형태를 사용했다는 것을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 바꾸었습니다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일곱 형제를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">seven \u003c/span>\u003cspan class=\"tgt\">brothers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일곱 개의 별로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">seven \u003c/span>\u003cspan class=\"tgt\">stars\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에 그는 일곱 형제를 일곱 개의 별로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하늘의 \u003cb class=\"key\">하늘임금\u003c/b>이 어머니를 향한 형제들의 지극한 사랑에 감동하여 이들을 밤하늘의 별로 만들어 준 결말을 보여줍니다. \u003cb class=\"key\">turn \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">into \u003c/b>\u003cb class=\"key\">B\u003c/b> 표현을 사용하여 A를 B로 바꾸다라는 의미를 전달하는 핵심 \u003cb class=\"key\">결말\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 into를 동반하는 turn A into B 구문\u003c/span> : turn [동사] + A [목적어] + into [전치사] + B [명사구] : \"일곱 형제를 일곱 개의 별로 바꾸었습니다\"\u003c/div>\u003c/div>","segs":[{"n":47,"text":"Later, 나중에. he turned, 그는 바꾸었습니다. the seven brothers, 일곱 형제를. into seven stars, 일곱 개의 별로. 이 문장 전체를 해석하면, 나중에 그는 일곱 형제를 일곱 개의 별로 바꾸었습니다.","hl":"m"},{"n":48,"text":"하늘임금이 형제들의 사랑에 감동해 별로 만들어 준 이야기를 마무리하는 문장이에요. turn A into B 표현을 써서 일곱 형제가 일곱 개의 별로 변하는 과정을 나타내고 있죠.","hl":"mn"},{"n":49,"text":"첫 번째 어법 포인트는 turn A into B 구문이에요. turned 뒤에 목적어인 the seven brothers가 나오고 전치사 into 뒤에 seven stars가 와서 A를 B로 바꾸다라는 뜻을 만들어요. 이때 방향이나 변화를 나타내는 전치사 into를 빠뜨리지 않도록 주의해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 별들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">stars\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이루었습니다\u003c/span>\u003cspan class=\"en\">formed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 숟가락 모양을\u003c/span>\u003cspan class=\"en\">a big spoon shape\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤하늘에서\u003c/span>\u003cspan class=\"en\">in the night sky.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 별들은 밤하늘에서 큰 숟가락 모양을 이루었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하늘의 별이 된 형제들이 밤하늘에서 \u003cb class=\"key\">북두칠성\u003c/b>의 생김새인 큰 숟가락 모양을 만들게 되었다는 사실을 설명합니다. 앞서 언급된 별들이 어떤 \u003cb class=\"key\">모양\u003c/b>을 이루는지 구체적으로 연결해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시형용사 These가 쓰인 명사구\u003c/span> : These [지시형용사] + stars [복수명사] : \"이 별들은\"\u003c/div>\u003c/div>","segs":[{"n":50,"text":"These stars, 이 별들은. formed, 이루었습니다. a big spoon shape, 큰 숟가락 모양을. in the night sky, 밤하늘에서. 이 문장 전체를 해석하면, 이 별들은 밤하늘에서 큰 숟가락 모양을 이루었습니다.","hl":"m"},{"n":51,"text":"하늘로 올라간 별들이 밤하늘에서 큰 숟가락 모양을 만들었다는 내용을 담고 있어요. 북두칠성의 생김새가 어떻게 만들어졌는지 시각적으로 보여주는 설명이죠.","hl":"mn"},{"n":52,"text":"첫 번째 어법 포인트는 지시형용사 These예요. 앞에 나온 일곱 개의 별들을 그대로 받아 가리키기 때문에 뒤에 복수명사 stars가 온다는 점을 기억해 두면 좋아요.","hl /div>\u003c/div>","segs":[{"n":53,"text":"If you see, 북두칠성을 본다면. the Big Dipper. you can think of, 여러분은 ~을 떠올릴 수 있습니다. the seven brothers' love, 이 일곱 형제의 사랑을. for their mom, 어머니에 대한. 이 문장 전체를 해석하면, 북두칠성을 본다면 여러분은 이 일곱 형제의 어머니에 대한 사랑을 떠올릴 수 있습니다.","hl":"m"},{"n":54,"text":"이 지문 전체의 주제를 담고 있는 마무리 문장이에요. 우리가 밤하늘에서 북두칠성을 볼 때마다 어머니를 향한 형제들의 깊은 사랑을 떠올리게 된다는 의미를 전하고 있죠.","hl":"mn"},{"n":55,"text":"첫 번째 어법 포인트는 조건의 접속사 If예요. 만약 네가 북두칠성을 본다면이라는 조건을 나타낼 때 현재시제 동사 see를 쓴다는 점을 기억해 주세요. 두 번째 어법 포인트는 복수 소유격인데, seven brothers가 복수명사니까 s 뒤에 apostrophe만 붙여서 brothers'로 쓴 형태도 꼼꼼히 봐 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>밤하늘의 북쪽에는 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">별\u003c/b>이 큰 숟가락 모양의 \u003cb class=\"key\">북두칠성\u003c/b>을 이룹니다.\u003c/li>\u003cli>한국에는 아픈 어머니를 살리기 위해 \u003cb class=\"key\">샘물\u003c/b>을 찾아 험한 길을 걸은 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">형제\u003c/b>의 전설이 있습니다.\u003c/li>\u003cli>어머니를 향한 형제들의 \u003cb class=\"key\">사랑\u003c/b>에 감동한 \u003cb class=\"key\">옥황상제\u003c/b>가 이들을 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">별\u003c/b>로 바꾸었습니다.\u003c/li>\u003cli>\u003cb class=\"key\">북두칠성\u003c/b>을 볼 때마다 우리는 어머니를 향한 형제들의 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>을 떠올릴 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Big Dipper in the night sky originated from the touching love of seven devoted brothers for their sick mother.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 이 글은 밤하늘의 \u003cb class=\"key\">북두칠성\u003c/b>이 아픈 어머니를 살리기 위해 \u003cb class=\"key\">효도\u003c/b>를 다한 일곱 형제의 사랑에서 유래했다는 \u003cb class=\"key\">전설\u003c/b>을 소개하고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":56,"text":"오늘 배운 내용은 북두칠성에 얽힌 일곱 형제의 아름다운 전설이었어요. 어머니를 향한 형제들의 마음이 밤하늘의 별이 되었다는 이야기를 기억하면서, 복습을 꼼꼼히 마치도록 하세요. 수고하셨어요.","hl":null
