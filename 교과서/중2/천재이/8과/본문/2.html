@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중2 2학기 기말고사 중2 천재(이) 8과 본문2","audioDir":"2_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중2\u003cbr>천재(이)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중2 2학기 기말고사\u003c/div>\u003ch1>Native American Stories About the Big Dipper\u003c/h1>\u003ch2>북두칠성에 관한 미국 원주민의 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 전 세계 사람들은 같은 \u003cb class=\"key\">별\u003c/b>인 \u003cb class=\"key\">북두칠성\u003c/b>에 대해 각기 다른 흥미로운 \u003cb class=\"key\">이야기\u003c/b>를 만들어 낸다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People around the world create diverse and interesting stories about the same stars like the Big Dipper.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 이번 시간에는 미국 원주민들이 전해 내려오는 북두칠성 이야기를 함께 살펴볼게요. 전 세계 사람들이 같은 별을 보고 얼마나 다양한 이야기를 만드는지 배울 수 있는 흥미로운 시간이에요. 전체 글의 요약과 요지를 중심으로 본문을 꼼꼼히 분석해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">배경지식 단락: 인류는 밤하늘의 \u003cb class=\"key\">별자리 \u003c/b>\u003cb class=\"key\">(Constellation)\u003c/b>를 보며 오랜 세월 동안 다양한 \u003cb class=\"key\">신화 \u003c/b>\u003cb class=\"key\">(Mythology)\u003c/b>와 전설을 만들어 냈습니다. 이는 마치 일상에서 구름의 모양을 보고 동물이나 사물의 형태를 떠올리는 것과 비슷합니다. 세계 여러 문화권에서는 북두칠성을 쟁기, 국자, 혹은 거대한 \u003cb class=\"key\">곰 \u003c/b>\u003cb class=\"key\">(Bear)\u003c/b> 등 저마다의 독특한 상상력으로 바라보았습니다. 이러한 현상은 인간이 자연 현상에 의미를 부여하고 \u003cb class=\"key\">상상력 \u003c/b>\u003cb class=\"key\">(Imagination)\u003c/b>을 통해 세상을 이해하려는 공통된 본능을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경지식을 넓혀 볼게요. 인류는 밤하늘의 별자리를 보며 오랜 세월 동안 다양한 신화와 전설을 만들어 냈어요. 이는 일상에서 구름의 모양을 보고 다양한 형태를 떠올리는 것과 아주 비슷하답니다. 세계 여러 문화권에서는 북두칠성을 저마다의 독특한 상상력으로 바라보았어요. 이러한 현상은 인간이 자연 현상에 의미를 부여하고 상상력을 통해 세상을 이해하려는 공통된 본능을 보여 준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>미국 원주민들이 북두칠성에 관해 전해 내려오는 특별한 \u003cb class=\"key\">이야기\u003c/b>를 가지고 있음을 소개하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 상황\u003csmall>근거 · 문장 2–5\u003c/small>\u003c/h4>\u003cp>모호크족이 거대한 \u003cb class=\"key\">곰\u003c/b>의 발자국을 발견하고, 곰이 식량을 가져가 배고픔과 두려움을 겪는 위기 상황을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결과정\u003csmall>근거 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>삼 형제가 꿈을 통해 용기를 얻어 곰을 뒤쫓았고, 곰이 하늘로 뛰어오르며 지금도 \u003cb class=\"key\">삼 \u003c/b>\u003cb class=\"key\">형제\u003c/b>가 곰을 쫓는 별자리가 되었다고 전합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>전 세계 사람들이 같은 \u003cb class=\"key\">별\u003c/b>에 대해 다양한 이야기를 만든다는 점을 강조하며 독자에게 새로운 이야기를 상상해 보라고 권합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 전체적인 내용 전개 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 첫 번째 문장을 통해 미국 원주민들이 북두칠성에 관해 전해 내려오는 특별한 이야기를 가지고 있음을 소개하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 문제 상황에서는 두 번째 문장부터 다섯 번째 문장까지 다뤄요. 모호크족이 거대한 곰의 발자국을 발견하고 곰이 식량을 가져가 배고픔과 두려움을 겪는 위기 상황을 설명하고 있답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 해결 과정에서는 여섯 번째 문장부터 아홉 번째 문장까지 이어져요. 삼 형제가 꿈을 통해 용기를 얻어 곰을 뒤쫓았고 곰이 하늘로 오르며 지금도 삼 형제가 곰을 쫓는 별자리가 되었다고 전하고 있어요.","hl":"f2"},{"n":7,"text":"네 번째 단계인 결론에서는 열 번째 문장부터 열두 번째 문장까지 살펴봐요. 전 세계 사람들이 같은 별에 대해 다양한 이야기를 만든다는 점을 강조하며 독자에게 새로운 이야기를 상상해 보라고 권하고 있답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">귀납식\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 미국 원주민의 구체적인 북두칠성 전설을 먼저 상세히 예시로 제시한 뒤, 열 번째 문장에서 전 세계 사람들이 같은 별에 대해 다양한 이야기를 만든다는 일반적인 \u003cb class=\"key\">주제\u003c/b>를 도출하고 있습니다. 따라서 구체적인 사례에서 보편적인 결론을 이끌어내는 \u003cb class=\"key\">귀납적\u003c/b> 전개 방식을 취하고 있으며, 마지막에는 독자에게 질문을 던져 여운을 남깁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As we have seen (10)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a special story\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">different and interesting stories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your story\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이번 지문의 전개 방식과 구조를 분석해 볼까요. 이 글은 구체적인 전설을 먼저 상세히 예시로 제시한 뒤 열 번째 문장에서 전 세계 사람들이 같은 별에 대해 다양한 이야기를 만든다는 일반적인 주제를 도출하고 있어요. 따라서 구체적인 사례에서 보편적인 결론을 이끌어내는 귀납식 구조를 취하고 있답니다.","hl":"ty"},{"n":9,"text":"글 속의 중요한 신호어도 놓치지 말아야 해요. 열 번째 문장의 As we have seen이라는 표현은 지금까지 살펴본 원주민의 전설을 바탕으로 전체 글의 결론을 이끌어내는 아주 중요한 연결고리 역할을 한답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Native American\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미국 원주민\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이야기하다, 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>Big Dipper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북두칠성\u003c/span>\u003c/div>\u003cdiv>\u003cb>track\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발자국\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져가다\u003c/span>\u00 . 발자국을 뜻하는 track이나 거대한이라는 뜻의 giant 그리고 두려워하는 이라는 뜻의 scared 같은 표현들은 시험에 자주 나오니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difficult\u003c/b>\u003cspan class=\"m\">어려운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scared\u003c/b>\u003cspan class=\"m\">두려워하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">afraid\u003c/span>\u003cspan class=\"s\">frightened\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003cspan class=\"a\">fearless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">brave\u003c/b>\u003cspan class=\"m\">용감한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">courageous\u003c/span>\u003cspan class=\"s\">bold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cowardly\u003c/span>\u003cspan class=\"a\">timid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">abolish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 함께 정리해 볼게요. 특별한 이라는 뜻의 special은 unique나 unusual로 바꿔 쓸 수 있고 common이나 ordinary와는 반대말이에요. 또한 어려운 이라는 뜻의 difficult는 hard나 tough와 동의어이고 easy나 simple과는 반의어가 된답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 원주민들도\u003c/span>\u003cspan class=\"en\">Native Americans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해 왔습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">told\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 이야기를\u003c/span>\u003cspan class=\"en\">a special story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북두칠성에 관한\u003c/span>\u003cspan class=\"en\">about the Big Dipper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국 원주민들도 북두칠성에 관한 특별한 이야기를 해 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 전체 글의 도입부로, 이전 단락에서 소개된 그리스 로마 신화에 이어 다른 문화권인 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">원주민\u003c/b>들의 \u003cb class=\"key\">북두칠성\u003c/b> 이야기가 존재함을 밝히는 글의 중심 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have + p.p. [[과거분사]] : \"해 왔습니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Native Americans, 미국 원주민들도. have also told, 해 왔습니다. a special story, 특별한 이야기를. about the Big Dipper, 북두칠성에 관한. 이 문장 전체를 해석하면, 미국 원주민들도 북두칠성에 관한 특별한 이야기를 해 왔습니다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 본문의 시작을 알리는 문장이에요. 그리스 신화뿐만 아니라 미국 원주민들에게도 북두칠성과 관련된 특별한 이야기가 전해져 내려오고 있다는 것을 자연스럽게 소개하고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 have also told예요. 과거에 시작된 행동이 현재까지 계속해서 이어지는 의미를 나타내기 위해서 현재완료 시제를 사용했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">ago\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모호크족 사람들은\u003c/span>\u003cspan class=\"en\">the Mohawk people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견했습니다\u003c/span>\u003cspan class=\"en\">found\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 곰의 발자국을\u003c/span>\u003cspan class=\"en\">the tracks of a giant bear.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래전에 모호크족 사람들은 거대한 곰의 발자국을 발견했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적인 \u003cb class=\"key\">모호크족\u003c/b> 전설의 시작을 알리는 문장으로, \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">곰\u003c/b>의 발자국이라는 사건의 단초를 제공하며 이야기 속으로 독자를 끌어들입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시한 부사구\u003c/span> : 과거시점 [[부사구]] + 과거동사 : \"오래전에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A long time ago, 오래전에. the Mohawk people, 모호크족 사람들은. found, 발견했습니다. the tracks of a giant bear, 거대한 곰의 발자국을. 이 문장 전체를 해석하면, 오래전에 모호크족 사람들은 거대한 곰의 발자국을 발견했습니다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 본격적인 전설 속 이야기로 들어가요. 옛날 옛적에 모호크족 사람들이 거대한 곰의 발자국을 발견하면서 흥미진진한 사건이 시작되죠.","hl":"mn"},{"n":17,"text":"두 번째 어법 포인트는 과거 시제의 사용이에요. A long time ago 같은 과거를 나타내는 표현이 있으므로 동사도 과거형인 found를 써야 한다는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 곰이\u003c/span>\u003cspan class=\"en\">This bear\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져가고 있었어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">taking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 모든 음식을\u003c/span>\u003cspan class=\"en\">all their food,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 배가 고팠습니다\u003c/span>\u003cspan class=\"en\">were very hungry.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 곰이 그들의 모든 음식을 가져가고 있었어서 사람들은 매우 배가 고팠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰의 등장으로 인해 모호크족 사람들이 겪는 \u003cb class=\"key\">위기 \u003c/b>\u003cb class=\"key\">상황\u003c/b>과 갈등의 원인을 설명하며, 앞으로 전개될 이야기의 긴장감을 높여주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행 시제\u003c/span> : be동사 과거형(was) + [[현재분사]](taking) : \"가져가고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : 원인문장 + [[등위접속사]](so) + 결과문장 : \"그래서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This bear, 이 곰이. was taking, 가져가고 있었어서. all their food, 그들의 모든 음식을. so, 그래서. people, 사람들은. were very hungry, 매우 배가 고팠습니다. 이 문장 전체를 해석하면, 이 곰이 그들의 모든 음식을 가져가고 있었어서 사람들은 매우 배가 고팠습니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 곰 때문에 사람들이 큰 어려움을 겪게 된 원인을 말해 주고 있어요. 곰이 음식을 다 가져가 버려서 마을 사람들이 몹시 배고프고 힘든 상황에 처하게 되었죠.","hl":"mn"},{"n":20,"text":"세 번째 어법 포인트는 was taking이라는 과거진행 시제예요. 과거 그 당시 지속적으로 일어나던 일을 표현하고 있어요. 그리고 앞 문장과 뒷문장을 인과 관계로 이어주는 so의 역할도 함께 알아두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려웠습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰을 잡는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">catch \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곰을 잡는 것은 어려웠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거대한 곰이 식량을 모두 가져가 버려 \u003cb class=\"key\">모호크족\u003c/b>이 처한 위기와 \u003cb class=\"key\">곰 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>의 어려움을 강조하는 문장입니다. 주어가 너무 길어 뒤로 보내고 빈자리 \u003cb class=\"key\">가주어\u003c/b> It을 쓴 \u003cb class=\"key\">가주어 \u003c/b>\u003cb class=\"key\">진주어\u003c/b> 구문을 사용했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어 구문\u003c/span> : It [가주어] + be동사 + 형용사 + to부정사 [진주어] : \"곰을 잡는 것은 어려웠습니다\"\u003c/div>\u003c/div>","se . 주어인 삼 형제가 한 두 가지 행동인 became과 followed가 and로 연결되어 있어요. 과거시제를 맞춰서 주어의 연속된 동작을 자연스럽게 이어주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 그들은 보았다\u003c/span>\u003cspan class=\"en\">There they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰이 하늘로 뛰어드는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bear \u003c/span>\u003cspan class=\"tgt\">jump\u003c/span> into the sky,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들도 뛰어들었다\u003c/span>\u003cspan class=\"en\">and they jumped\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 곰을 따라\u003c/span>\u003cspan class=\"en\">after it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳에서 그들은 곰이 하늘로 뛰어드는 것을 보았고 그들도 곰을 따라 뛰어들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지상의 추적이 \u003cb class=\"key\">하늘\u003c/b>로 이어지는 결정적인 전환점입니다. \u003cb class=\"key\">빅디퍼\u003c/b>, 즉 큰곰자리 별자리가 만들어지게 된 신화적 유래를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지각동사 구문\u003c/span> : [지각동사 (saw)] + [목적어 (the bear)] + [동사원형 (jump)] : \"곰이 뛰어드는 것을 보았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"There they saw, 그곳에서 그들은 보았다. the bear jump into the sky, 곰이 하늘로 뛰어드는 것을. and they jumped, 그리고 그들도 뛰어들었다. after it, 그 곰을 따라. 이 문장 전체를 해석하면, 그곳에서 그들은 곰이 하늘로 뛰어드는 것을 보았고 그들도 곰을 따라 뛰어들었습니다.","hl":"m"},{"n":34,"text":"이 문장은 드디어 지상에서의 추적이 하늘로 이어지는 결정적인 장면이에요. 큰곰자리 별자리가 어떻게 만들어졌는지 그 신화적인 유래를 아주 재미있게 설명해주고 있죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 지각동사 구문이에요. saw는 지각동사라서 목적어인 the bear 뒤에 목적격보어로 동사원형인 jump가 왔어요. 곰이 하늘로 뛰어드는 그 순간의 동작을 생생하게 전달해주는 아주 중요한 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 여러분이 보면\u003c/span>\u003cspan class=\"en\">Now, when you see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤하늘을\u003c/span>\u003cspan class=\"en\">the night sky,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 볼 수 있습니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삼 형제가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">brothers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 쫓고 있는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">chasing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 곰을\u003c/span>\u003cspan class=\"en\">the bear.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 밤하늘을 보면 여러분은 삼 형제가 여전히 곰을 쫓고 있는 것을 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 신화적 이야기가 \u003cb class=\"key\">현재\u003c/b>의 밤하늘과 연결됨을 보여줍니다. 독자들에게 밤하늘의 \u003cb class=\"key\">별자리\u003c/b>를 새로운 시각으로 바라보게 유도합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지각동사 + 현재분사\u003c/span> : [조동사 can + 지각동사 (see)] + [목적어 (the three brothers)] + [현재분사 (chasing)] : \"삼 형제가 여전히 쫓고 있는 것을 볼 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Now, when you see, 이제 여러분이 보면. the night sky, 밤하늘을. you can see, 여러분은 볼 수 있습니다. the three brothers, 삼 형제가. still chasing, 여전히 쫓고 있는 것을. the bear, 그 곰을. 이 문장 전체를 해석하면, 이제 밤하늘을 보면 여러분은 삼 형제가 여전히 곰을 쫓고 있는 것을 볼 수 있습니다.","hl":"m"},{"n":37,"text":"옛날의 먼 옛이야기가 지금 우리가 보는 밤하늘과 그대로 이어진다는 점을 아주 멋지게 보여주는 문장이에요. 독자들이 밤하늘의 별자리를 완전히 새로운 눈으로 바라보게 만들어주죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 지각동사 뒤에 쓰인 현재분사예요. see는 지각동사인데 목적어인 the three brothers 뒤에 동작이 계속 이어지는 느낌을 주려고 chasing이라는 현재분사를 썼어요. 삼 형제가 지금도 곰을 계속 쫓고 있는 모습을 아주 생생하게 살려주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 보았듯이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계 사람들은\u003c/span>\u003cspan class=\"en\">people around the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양하고 흥미로운 이야기를 만들어 냅니다.\u003c/span>\u003cspan class=\"en\">create different and interesting stories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 별에 대해\u003c/span>\u003cspan class=\"en\">about the same stars.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 보았듯이, 전 세계 사람들은 같은 별에 대해 다양하고 흥미로운 이야기를 만들어 냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 원주민들의 \u003cb class=\"key\">북두칠성\u003c/b> 전설을 소개한 본문 전체의 내용을 요약하며, \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">별\u003c/b>을 두고도 세계 각지에서 저마다 독특하고 흥미로운 \u003cb class=\"key\">이야기\u003c/b>를 창조해 낸다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 전달하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보 및 양태의 접속사 as\u003c/span> : As [접속사(～처럼/듯이)] + [주어] + [동사] : \"우리가 보았듯이\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"As we have seen, 우리가 보았듯이. people around the world, 전 세계 사람들은. create different and interesting stories, 다양하고 흥미로운 이야기를 만들어 냅니다.. about the same stars, 같은 별에 대해. 이 문장 전체를 해석하면, 우리가 보았듯이, 전 세계 사람들은 같은 별에 대해 다양하고 흥미로운 이야기를 만들어 냅니다.","hl":"m"},{"n":40,"text":"열 번째 문장은 앞서 살펴본 북두칠성 이야기를 바탕으로 글 전체의 핵심 주제를 정리하는 곳이에요. 동일한 별을 보더라도 전 세계 사람들이 저마다 다른 이야기를 만들어 낸다는 점을 강조하고 있죠.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 문장 맨 앞에 쓰인 접속사 as예요. 여기서 as는 '~듯이'라는 의미를 나타내는 양태의 접속사로 사용되었답니다. 뒤에 주어와 동사인 we have seen이 이어져서 앞서 우리가 확인한 내용을 자연스럽게 받아주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 새로운 이야기를\u003c/span>\u003cspan class=\"en\">What new story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상할 수 있나요?\u003c/span>\u003cspan class=\"en\">can you imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북두칠성에 대한\u003c/span>\u003cspan class=\"en\">about the Big Dipper?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 북두칠성에 대한 어떤 새로운 이야기를 상상할 수 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 읽는 독자에게 직접 \u003cb class=\"key\">질문\u003c/b>을 던지는 방식을 사용하여, \u003cb class=\"key\">북두칠성\u003c/b>을 소재로 자신만의 \u003cb class=\"key\">상상력\u003c/b>을 발휘해 새로운 이야기를 만들어 보도록 유도하는 역할을 합니다.\u003c/div>","segs":[{"n":42,"text":"What new story, 어떤 새로운 이야기를. can you imagine, 상상할 수 있나요?. about the Big Dipper?, 북두칠성에 대한. 이 문장 전체를 해석하면, 여러분은 북두칠성에 대한 어떤 새로운 이야기를 상상할 수 있나요?","hl":"m"},{"n":43,"text":"열한 번째 문장은 독자들에게 직접 질문을 건네는 문장이에요. 북두칠성을 바라보며 우리들 스스로도 나만의 상상력을 펼쳐 새로운 이야기를 지어보도록 권유하고 있답니다.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쩌면\u003c/span>\u003cspan class=\"en\">Maybe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래의 사람들이\u003c/span>\u003cspan class=\"en\">people in the future\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 이야기를 즐길지도 모릅니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span> your story.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어쩌면 미래의 사람들이 여러분의 이야기를 즐길지도 모릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 자신들이 상상해 낸 이야기가 먼 \u003cb class=\"key\">미래\u003c/b> 다른 사람들에게도 큰 재미와 \u003cb class=\"key\">감동\u003c/b>을 줄 수 있다는 \u003cb class=\"key\">기대감\u003c/b>과 흥미를 불어넣으며 글을 기분 좋게 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (추측/미래)\u003c/span> : [조동사 will] + [동사원형] : \"~할 것이다 / ~일지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":44,"text":"Maybe, 어쩌면. people in the future, 미래의 사람들이. will enjoy your story, 여러분의 이야기를 즐길지도 모릅니다.. 이 문장 전체를 해석하면, 어쩌면 미래의 사람들이 여러분의 이야기를 즐길지도 모릅니다.","hl":"m"},{"n":45,"text":"마지막 열두 번째 문장은 독자가 만든 이야기가 먼 미래에 다른 이들에게도 사랑받을 수 있다는 기대감을 심어줘요. 글을 읽는 재미를 더하며 훈훈하게 마무리하는 역할을 하죠.","hl":"mn"},{"n":46,"text":"첫 번째 어법 포인트는 조동사 will이에요. will은 미래를 나타낼 뿐만 아니라 '~일 것이다'라는 추측의 뉘앙스도 가지고 있어요. 뒤에 동사원형 enjoy가 이어져서 미래의 사람들이 여러분의 이야기를 즐기게 될 모습을 그려주고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미국 원주민들은 거대한 \u003cb class=\"key\">곰\u003c/b>과 삼 형제에 관한 북두칠성 전설을 전해 온다.\u003c/li>\u003cli>삼 형제는 용기를 내어 식량을 훔친 곰을 하늘 끝까지 뒤쫓았다.\u003c/li>\u003cli>곰이 하늘로 뛰어오르면서 밤하늘의 \u003cb class=\"key\">북두칠성\u003c/b> 별자리가 되었다.\u003c/li>\u003cli>전 세계 사람들은 같은 별을 두고 각기 다른 흥미로운 \u003cb class=\"key\">이야기\u003c/b>를 만들어 낸다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People around the world create diverse and interesting stories about the same stars like the Big Dipper.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 전 세계 사람들은 같은 \u003cb class=\"key\">별\u003c/b>인 \u003cb class=\"key\">북두칠성\u003c/b>에 대해 각기 다른 흥미로운 \u003cb class=\"key\">이야기\u003c/b>를 만들어 낸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":47,"text":"오늘 배운 내용을 바탕으로 미국 원주민의 북두칠성 전설과 글의 전개 방식을 확실히 이해했는지 복습해 보세요. 여러분도 북두칠성에 관한 멋진 이야기를 상상해 보면서 오늘 수업을 마칠게요. 수고하셨어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
