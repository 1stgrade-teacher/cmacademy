Of course, I heard about the book in science class.","hl":"r-3"},{"n":6,"text":"G Daniel Baker wrote it! I'm really looking forward to his book signing.","hl":"r-4"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">경험·정보 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Have you heard about + 명사?\u003c/div>\u003cdiv class=\"d-mean\">~에 대해 들어 본 적이 있니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: G He's a famous writer. Have you heard about the book Stories of Colorful Stars?\u003c/div>\u003cdiv class=\"d-exp\">상대방이 특정한 주제에 대해 알고 있는지 물을 때 \u003cb class=\"key\">Have you heard about\u003c/b>를 씁니다. 상대방의 관심사나 새로운 정보에 대해 자연스럽게 질문할 수 있어 유용한 표현이에요. 답할 때는 \u003cb class=\"key\">Yes, I have\u003c/b> 또는 \u003cb class=\"key\">No, I haven't\u003c/b>로 말하고, 자신의 생각이나 추가 설명을 덧붙일 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Did you hear about ~?\u003c/li>\u003cli>Do you know about ~?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Yes, I have.\u003c/li>\u003cli>No, I haven't.\u003c/li>\u003cli>Yes, I heard about it in science class.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"먼저 첫 번째 의사소통 기능을 살펴볼게요. 상대방이 어떤 주제에 대해 알고 있는지 물어볼 때는 Have you heard about 다음에 궁금한 내용을 붙여서 말해요. 뜻은 그 주제에 대해 들어 본 적이 있니, 라는 말이죠. 상대의 관심사나 새로운 정보를 자연스럽게 물어볼 수 있는 아주 유용한 표현이에요.","hl":"key"},{"n":8,"text":"같은 뜻을 전하는 표현도 여러 가지가 있어요. Did you hear about 을 쓰면 좀 더 과거의 일처럼 물어보는 느낌이고, Do you know about 은 지금 알고 있는지에 초점을 맞춘 표현이에요. 상황에 따라 골라 쓰면 됩니다.","hl":"alts"},{"n":9,"text":"대답은 Yes, I have. 라고 하거나 No, I haven't. 라고 해요. 여기에 살을 붙여서 Yes, I heard about it in science class. 처럼 어디서 들었는지까지 말해 주면 훨씬 자연스럽죠.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">기대 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I'm looking forward to + 명사/동명사\u003c/div>\u003cdiv class=\"d-mean\">나는 ~하기를 기대한다\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: G Daniel Baker wrote it! I'm really looking forward to his book signing.\u003c/div>\u003cdiv class=\"d-exp\">미래에 일어날 일이나 계획에 대한 \u003cb class=\"key\">기대\u003c/b>를 표현할 때 \u003cb class=\"key\">I'm looking forward to\u003c/b>를 씁니다. to 뒤에는 명사나 \u003cb class=\"key\">동명사\u003c/b>가 온다는 점을 꼭 기억하세요. 상대의 말에 공감할 때는 \u003cb class=\"key\">Me too\u003c/b>나 So am I로 짧게 받아 줄 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I can't wait for ~.\u003c/li>\u003cli>I'm excited about ~.\u003c/li>\u003cli>I'm eager to ~.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Me too.\u003c/li>\u003cli>So am I.\u003c/li>\u003cli>I'm looking forward to it, too.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"두 번째 기능은 기대를 나타내는 표현이에요. 미래에 일어날 일이나 계획이 기대될 때 I'm looking forward to 다음에 그 내용을 붙여 말해요. 뜻은 나는 그것을 기대한다, 라는 말이죠. 이때 to 뒤에는 명사나 동명사가 온다는 점을 꼭 기억해 주세요.","hl":"key"},{"n":11,"text":"같은 기대를 다른 말로도 표현할 수 있어요. I can't wait for 는 너무 기대돼서 기다릴 수가 없다는 뜻이고, I'm excited about 은 그것에 대해 신이 난다는 뜻이에요. I'm eager to 는 몹시 하고 싶다는 느낌을 전해 줍니다.","hl":"alts"},{"n":12,"text":"상대가 기대된다고 말하면 Me too. 라고 하거나 So am I. 라고 받아 주세요. I'm looking forward to it, too. 처럼 문장 전체로 다시 말해도 아주 좋습니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">G Wow, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look at this\u003c/span>! \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">There's a book signing by Daniel Baker\u003c/span> at the bookstore this weekend.\u003c/div>\u003cdiv class=\"d-ko\">와, 이거 봐! 이번 주말에 서점에서 Daniel Baker의 책 사인회가 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>상대방의 주의를 끌 때 쓰는 표현으로 '이것 좀 봐'라는 뜻입니다. \u003cb class=\"key\">Look at\u003c/b> 뒤에 보고 싶은 대상을 붙여 씁니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">There is\u003c/b> 구문은 '~이 있다'라는 뜻으로 어떤 것이 처음 등장할 때 소개하는 표현입니다. \u003cb class=\"key\">book signing\u003c/b>은 작가가 책에 사인해 주는 '책 사인회'라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">B \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Who is he\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">그가 누구니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>의문사 \u003cb class=\"key\">Who\u003c/b>를 써서 사람의 신원을 묻는 문장입니다. 여기서 \u003cb class=\"key\">he\u003c/b>는 앞에 나온 Daniel Baker를 가리키는 인칭대명사예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Who's Daniel Baker?\u003c/span>\u003cspan>Who is that?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"첫 번째 줄이에요. Wow, look at this! 는 와, 이거 봐! 라는 뜻으로 상대방의 주의를 끄는 말이에요. There's a book signing by Daniel Baker at the bookstore this weekend. 는 이번 주말에 서점에서 Daniel Baker의 책 사인회가 있어, 라는 뜻이죠. There is 는 어떤 것이 있다는 걸 처음 소개할 때 쓰고, book signing 은 책 사인회라는 뜻이에요.","hl":"l-0"},{"n":14,"text":"두 번째 줄이에요. Who is he? 는 그가 누구니? 라는 뜻이에요. 여기서 he 는 바로 앞에 나온 Daniel Baker 를 가리키는 인칭대명사죠. 같은 뜻으로 이름을 직접 넣어서 Who's Daniel Baker? 라고 물을 수도 있고, Who is that? 이라고 가리키며 물을 수도 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 5\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">G He's a famous writer. \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">H
