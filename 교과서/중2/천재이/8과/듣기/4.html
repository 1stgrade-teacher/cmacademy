    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"C Watch and Do","title":"중2 천재 이상기 8과 대화문 C Watch and Do","audioDir":"4_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">소식 묻고 기대 표현하기\u003c/div>\u003ch1>중2 천재 이상기 8과 대화문 C Watch and Do | 소식 묻고 기대 표현하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>알렉스, 케이트, 준호가 12월 10일에 열리는 학교 과학 캠프의 내용과 준비물, 기대되는 점에 대해 이야기한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 이학년 천재 이상기 팔과 대화문 시 Watch and Do를 함께 공부해 볼게요. 알렉스와 케이트, 준호가 학교 과학 캠프에 대해 이야기하는 상황이에요. 캠프 소식을 묻고 기대하는 표현을 자연스럽게 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cdiv class=\"d-en\">Alex Hi! Have you heard about our school's science\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-1\">\u003cdiv class=\"d-en\">camp on December 10th?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cdiv class=\"d-en\">Kate No, I haven't. What's it about?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cdiv class=\"d-en\">Junho It's about stars. It has a lot of interesting programs. We'll watch stars at night.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cdiv class=\"d-en\">Alex According to the weather forecast, we'll have clear skies. So, we can see the stars easily. I'm looking forward to it.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-5\">\u003cdiv class=\"d-en\">Kate What should we prepare for it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cdiv class=\"d-en\">Alex We'll be outside at night, so we need warm clothes.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-7\">\u003cdiv class=\"d-en\">Junho I heard we can use telescopes. We can see stars more easily with them. It'll be a special experience.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cdiv class=\"d-en\">Kate Oh, I'm curious to see the moon through a telescope. Maybe I'll be able to find the rabbit in the old tale.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-9\">\u003cdiv class=\"d-en\">Alex Haha! I hope you can find it.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-10\">\u003cdiv class=\"d-en\">Junho I'm looking forward to this camp. See you then.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Alex Hi! Have you heard about our school's science","hl":"r-0"},{"n":3,"text":"camp on December 10th?","hl":"r-1"},{"n":4,"text":"Kate No, I haven't. What's it about?","hl":"r-2"},{"n":5,"text":"Junho It's about stars. It has a lot of interesting programs. We'll watch stars at night.","hl":"r-3"},{"n":6,"text":"Alex According to the weather forecast, we'll have clear skies. So, we can see the stars easily. I'm looking forward to it.","hl":"r-4"},{"n":7,"text":"Kate What should we prepare for it?","hl":"r-5"},{"n":8,"text":"Alex We'll be outside at night, so we need warm clothes.","hl":"r-6"},{"n":9,"text":"Junho I heard we can use telescopes. We can see stars more easily with them. It'll be a special experience.","hl":"r-7"},{"n":10,"text":"Kate Oh, I'm curious to see the moon through a telescope. Maybe I'll be able to find the rabbit in the old tale.","hl":"r-8"},{"n":11,"text":"Alex Haha! I hope you can find it.","hl":"r-9"},{"n":12,"text":"Junho I'm looking forward to this camp. See you then.","hl":"r-10"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">소식·정보 알고 있는지 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Have you heard about + 명사?\u003c/div>\u003cdiv class=\"d-mean\">~에 대해 들어 본 적 있니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Alex Hi! Have you heard about our school's science\u003c/div>\u003cdiv class=\"d-exp\">'Have you heard about ~?'는 상대방이 어떤 \u003cb class=\"key\">소식\u003c/b>이나 \u003cb class=\"key\">정보\u003c/b>에 대해 알고 있는지 물을 때 쓰는 표현이에요. \u003cb class=\"key\">현재완료\u003c/b> 질문이므로 긍정은 'Yes, I have.', 부정은 'No, I haven't.'로 답해요. hear about은 구체적인 정보를 들어 본 경우에, hear of는 이름이나 존재만 아는 경우에 주로 써요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Have you heard of + 명사?\u003c/li>\u003cli>Did you hear about + 명사?\u003c/li>\u003cli>Do you know about + 명사?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Yes, I have.\u003c/li>\u003cli>No, I haven't.\u003c/li>\u003cli>Yes, I heard about it yesterday.\u003c/li>\u003cli>No, I didn't hear about it.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":13,"text":"먼저 소식이나 정보를 알고 있는지 묻는 표현을 배워 볼게요. 상대방에게 어떤 일에 대해 들어 본 적이 있는지 물을 때 Have you heard about 다음에 명사를 붙여 말해요. 뜻은 그 일에 대해 들어 본 적 있니예요. 현재완료 질문이라서 대답도 have나 haven't를 사용해요.","hl":"key"},{"n":14,"text":"같은 뜻으로 Have you heard of our school's science camp라고도 해요. Did you hear about our school's science camp도 비슷하게 쓸 수 있어요. Do you know about our school's science camp처럼 알고 있는지 묻는 표현으로 바꿔 말할 수도 있어요.","hl":"alts"},{"n":15,"text":"긍정으로 답할 때는 Yes, I have라고 해요. 부정으로 답할 때는 No, I haven't라고 하죠. 조금 더 자세히 Yes, I heard about it yesterday라고 말할 수도 있고, No, I didn't hear about it처럼 과거형으로 답할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">기대 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I'm looking forward to + 명사/동명사\u003c/div>\u003cdiv class=\"d-mean\">~을 기대하고 있다\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Alex According to the weather forecast, we'll have clear skies. So, we can see the stars easily. I'm looking forward to it.\u003c/div>\u003cdiv class=\"d-exp\">'I'm looking forward to ~.'는 앞으로 일어날 일이나 계획에 대한 \u003cb class=\"key\">기대감\u003c/b>을 나타내는 표현이에요. 여기서 to는 \u003cb class=\"key\">전치사\u003c/b>이므로 뒤에 명사나 \u003cb class=\"key\">동명사\u003c/b>가 와요. 그래서 동사가 올 때는 looking forward to seeing처럼 ing 형태를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I can't wait for + 명사\u003c/li>\u003cli>I'm excited about + 명사/동명사\u003c/li>\u003cli>I expect to + 동사원형\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Me too.\u003c/li>\u003cli>So am I.\u003c/li>\u003cli>That sounds exciting.\u003c/li>\u003cli>I hope so too.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"이번에는 기대하는 마음을 표현해 볼게요. 미래에 일어날 일이 기대될 때 I'm looking forward to 다음에 명사나 동명사를 붙여 말해요. 뜻은 나는 그것을 기대하고 있다는 말이에요. 여기서 to는 전치사라서 뒤에 동명사가 온다는 점을 꼭 기억해요.","hl":"key"},{"n":17,"text":"I can't wait for the science camp처럼 간절히 기다린다는 뜻으로 바꿀 수 있어요. I'm excited about the science camp도 기대된다는 뜻으로 자주 써요. I expect to enjoy the camp처럼 expect to 다음에 동사원형을 쓰는 표현도 있어요.","hl":"alts"},{"n":18,"text":"상대가 기대된다고 말하면 Me too라고 공감할 수 있어요. So am I라고 해도 나도 그래라는 뜻이 돼요. That sounds exciting이나 I hope so too처럼 자연스럽게 응답할 수도 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Alex Hi! \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have you heard about\u003c/span> our school's science\u003c/div>\u003cdiv class=\"d-ko\">안녕! 12월 10일에 있을 우리 학교 과학 캠프에 대해 들어 본 적 있니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>'Have you heard about ~?'는 상대방이 어떤 \u003cb class=\"key\">소식\u003c/b>이나 \u003cb class=\"key\">정보\u003c/b>에 대해 알고 있는지 물을 때 사용하는 표현으로, ‘~에 대해 들어 본 적 있니?’라는 뜻이에요. 여기서는 12월 10일에 있을 학교 과학 캠프에 대해 들어본 적이 있는지 질문하고 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Have you heard of our school's science camp?\u003c/span>\u003cspan>Did you hear about our school's science camp?\u003c/span>\u003cspan>Do you know about our school's science camp?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">camp on December 10th\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">12월 10일에 열리는 캠프 말이야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>특정 날짜 앞에는 \u003cb class=\"key\">전치사\u003c/b> on을 써요. 여기서는 12월 10일에 열리는 과학 캠프를 가리켜요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"알렉스가 인사하며 말해요. Hi! Have you heard about our school's science. 뜻은 안녕! 우리 학교 과학에 대해 들어 본 적 있니예요. 여기서 Have you heard about은 소식이나 정보를 들어 본 적 있는지 묻는 표현이에요. 같은 뜻으로 Have you heard of our school's science camp라고도 하고, Did you hear about our school's science camp라고도 해요. Do you know about our school's science camp처럼 알고 있는지 묻는 표현으로 바꿀 수도 있어요.","hl":"l-0"},{"n":20,"text":"이어서 캠프 날짜를 말하죠. camp on December tenth. 뜻은 십이월 십일에 열리는 캠프라는 말이에요. 특정 날짜 앞에는 전치사 on을 써요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">No, I haven't.\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">What's it about?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">아니, 들어 본 적 없어. 그것은 무엇에 관한 것이니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>알고 있는지 묻는 \u003cb class=\"key\">현재완료\u003c/b> 질문에 대한 부정의 대답은 'No, I haven't.'예요. 여기서는 들어 본 적이 없음을 나타내요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>'What's it about?'은 003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Alex \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">According to the weather forecast\u003c/span>, we'll have clear skies. So, we can see the stars easily. \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">I'm looking forward to it\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">일기 예보에 따르면, 하늘이 맑을 거야. 그래서 우리는 별을 쉽게 볼 수 있어. 나는 그것이 기대돼.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>'According to ~'는 ‘~에 따르면’이라는 뜻의 \u003cb class=\"key\">어구\u003c/b>로, 정보의 출처를 나타낼 때 써요. weather forecast는 \u003cb class=\"key\">일기 예보\u003c/b>라는 뜻이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>'I'm looking forward to ~.'는 미래에 일어날 일이나 계획에 대한 \u003cb class=\"key\">기대감\u003c/b>을 나타내는 표현으로, ‘나는 ~을 기대하고 있다’라는 뜻이에요. 여기서 to는 \u003cb class=\"key\">전치사\u003c/b>이므로 뒤에 명사구나 동명사구가 오며, it은 앞에서 말한 ‘별을 보는 것’을 가리켜요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I can't wait for it.\u003c/span>\u003cspan>I'm excited about it.\u003c/span>\u003cspan>I expect to enjoy it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">What should we prepare for it?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">우리는 그것을 위해 무엇을 준비해야 하니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>‘의문사+조동사+주어+동사원형 ~?’ 구조의 \u003cb class=\"key\">의문문\u003c/b>으로, 의문대명사 what과 의무나 필요를 나타내는 조동사 \u003cb class=\"key\">should\u003c/b>를 사용해 무엇을 준비해야 하는지 묻고 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What do we need to prepare for it?\u003c/span>\u003cspan>What should we bring for it?\u003c/span>\u003cspan>What are we supposed to prepare for it?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"알렉스가 일기 예보를 전하며 말해요. According to the weather forecast, we'll have clear skies. 뜻은 일기 예보에 따르면 하늘이 맑을 거예요. 이어서 I'm looking forward to it이라고 하며 그것이 기대된다고 말해요. 같은 뜻으로 I can't wait for it이나 I'm excited about it이라고도 할 수 있어요. I expect to enjoy it도 비슷한 기대 표현이에요.","hl":"l-0"},{"n":24,"text":"케이트가 준비물을 물어요. What should we prepare for it? 뜻은 우리는 그것을 위해 무엇을 준비해야 하니예요. 의문사 what과 조동사 should를 사용해 무엇을 해야 하는지 묻는 문장이에요. 같은 뜻으로 What do we need to prepare for it?이나 What should we bring for it?라고도 해요. What are we supposed to prepare for it?도 같은 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Alex We'll be outside at night, \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">so we need warm clothes\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">우리는 밤에 밖에 있을 거라서 따뜻한 옷이 필요해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>'so'는 앞의 내용이 뒤의 내용의 \u003cb class=\"key\">이유\u003c/b>나 \u003cb class=\"key\">결과\u003c/b>가 됨을 나타내는 접속사예요. need는 ‘~이 필요하다’라는 뜻으로 need + \u003cb class=\"key\">명사\u003c/b> 형태로 써요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Junho \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">I heard we can use telescopes\u003c/span>. We can see stars \u003cspan class=\"mk\">14\u003c/span>\u003cspan class=\"tgt\">more easily\u003c/span> \u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">with them\u003c/span>. It'll be a special experience.\u003c/div>\u003cdiv class=\"d-ko\">나는 우리가 망원경을 사용할 수 있다고 들었어. 우리는 그것들로 별을 더 쉽게 볼 수 있어. 그것은 특별한 경험이 될 거야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>'I heard (that) + 주어 + 동사'는 ‘~라고 들었다’라는 뜻으로, heard 뒤에 \u003cb class=\"key\">접속사\u003c/b> that이 생략된 \u003cb class=\"key\">목적어 절\u003c/b>이 와요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>'with + 도구'는 ‘~을 가지고, ~을 사용하여’라는 뜻의 \u003cb class=\"key\">도구\u003c/b> 표현이에요. them은 앞에 나온 telescopes를 가리켜요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">14\u003c/span>\u003cspan>‘more + \u003cb class=\"key\">형용사\u003c/b>/\u003cb class=\"key\">부사\u003c/b>’는 비교급을 만들며, 여기서는 ‘더 쉽게’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"알렉스가 준비물을 설명해요. We'll be outside at night, so we need warm clothes. 뜻은 우리는 밤에 밖에 있을 거라서 따뜻한 옷이 필요해요. 여기서 so는 앞의 내용 때문에 뒤의 내용이 필요하다는 흐름을 만들어 줘요.","hl":"l-0"},{"n":26,"text":"준호가 망원경에 대해 말해요. I heard we can use telescopes. 뜻은 우리가 망원경을 사용할 수 있다고 들었어요. We can see stars more easily with them은 우리가 그것들로 별을 더 쉽게 볼 수 있다는 뜻이에요. with them은 망원경을 사용하여라는 의미예요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate Oh, \u003cspan class=\"mk\">15\u003c/span>\u003cspan class=\"tgt\">I'm curious to see\u003c/span> the moon through a telescope. \u003cspan class=\"mk\">16\u003c/span>\u003cspan class=\"tgt\">Maybe I'll be able to find\u003c/span> the rabbit in the old tale.\u003c/div>\u003cdiv class=\"d-ko\">오, 나는 망원경으로 달을 보는 것이 궁금해. 어쩌면 내가 옛날이야기 속 토끼를 찾을 수 있을지도 몰라.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">15\u003c/span>\u003cspan>'I'm curious + to부정사'는 어떤 일을 해 보는 것에 대한 \u003cb class=\"key\">호기심\u003c/b>이나 \u003cb class=\"key\">궁금증\u003c/b>을 나타내는 표현으로, ‘~하는 것이 궁금하다’라는 뜻이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">16\u003c/span>\u003cspan>'be able to + 동사원형'은 ‘~할 수 있다’라는 뜻으로 \u003cb class=\"key\">능력\u003c/b>이나 가능성을 나타내요. Maybe는 ‘어쩌면’이라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'm curious about seeing the moon through a telescope.\u003c/span>\u003cspan>I wonder what the moon looks like through a telescope.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Alex Haha! \u003cspan class=\"mk\">17\u003c/span>\u003cspan class=\"tgt\">I hope you can find it\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">하하! 나는 네가 그것을 찾을 수 있길 바라.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">17\u003c/span>\u003cspan>'I hope ~.'는 바라는 일이나 소망을 나타내는 표현으로, ‘~하기를 바란다’라는 뜻이에요. hope 뒤에는 접속사 that이 이끄는 \u003cb class=\"key\">절\u003c/b>이 올 수 있으며, 이때 that은 \u003cb class=\"key\">생략\u003c/b>할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I hope you find it.\u003c/span>\u003cspan>I wish you could find it.\u003c/span>\u003cspan>I hope you are able to find it.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"케이트가 망원경으로 달을 보고 싶은 마음을 말해요. I'm curious to see the moon through a telescope. 뜻은 나는 망원경으로 달을 보는 것이 궁금해요. I'm curious to 다음에 동사원형을 쓰면 어떤 일을 해 보는 것이 궁금하다는 뜻이 돼요. 비슷하게 I'm curious about seeing the moon through a telescope라고도 말할 수 있어요. I wonder what the moon looks like through a telescope도 같은 뜻으로 쓸 수 있어요.","hl":"l-0"},{"n":28,"text":"알렉스가 케이트의 소망을 응원해요. I hope you can find it. 뜻은 나는 네가 그것을 찾을 수 있길 바라요. hope 뒤에는 that절이 올 수 있고 that은 생략할 수 있어요. 같은 뜻으로 I hope you find it이나 I hope you are able to find it이라고도 해요. I wish you could find it도 비슷한 소망 표현이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 11 / 11\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">11\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Junho \u003cspan class=\"mk\">18\u003c/span>\u003cspan class=\"tgt\">I'm looking forward to this camp\u003c/span>. \u003cspan class=\"mk\">19\u003c/span>\u003cspan class=\"tgt\">See you then.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나는 이 캠프가 기대돼. 그때 봐.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">18\u003c/span>\u003cspan>'I'm looking forward to ~.'는 \u003cb class=\"key\">기대감\u003c/b>을 나타내며, 여기서는 this camp가 앞으로 있을 과학 캠프를 가리켜요. to는 \u003cb class=\"key\">전치사\u003c/b>라서 뒤에 명사 this camp가 왔어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">19\u003c/span>\u003cspan>'See you then.'은 ‘그때 봐.’라는 뜻으로, 약속한 \u003cb class=\"key\">시간\u003c/b>에 다시 만날 때 쓰는 \u003cb class=\"key\">인사\u003c/b> 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I can't wait for this camp.\u003c/span>\u003cspan>I'm excited about this camp.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"마지막으로 준호가 말해요. I'm looking forward to this camp. 뜻은 나는 이 캠프가 기대돼요. See you then은 그때 봐라는 뜻의 인사 표현이에요. 같은 뜻으로 I can't wait for this camp라고도 할 수 있어요. I'm excited about this camp도 같은 뜻으로 쓸 수 있어요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 ‘우리 학교 과학 캠프에 대해 들어 본 적 있니?’와 같은 뜻으로 가장 알맞은 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Have you heard about our school's science camp?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Have you heard of our school's science camp?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Have you went to our school's science camp?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Are you hearing about our school's science camp?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Do you heard about our school's science camp?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Have you heard of our school's science camp?\u003c/span>\u003cdiv class=\"g-exp\">'hear about'과 'hear of'는 모두 [[~에 대해 듣다]]라는 뜻으로 쓸 수 있어요. 나머지 보기는 현재완료나 조동사 형태가 잘못되어 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"첫 번째 문제예요. 우리 학교 과학 캠프에 대해 들어 본 적 있니라는 뜻을 가진 표현을 골라 보세요. 문장은 Have you heard about our school's science camp예요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 첫 번째 보기예요. Have you heard of our school's science camp는 hear about과 같은 뜻으로 쓸 수 있어요. 나머지 보기는 현재완료 형태가 알맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">I'm looking forward to ____ this camp.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>enjoy\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>enjoying\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>enjoyed\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>enjoys\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">enjoying\u003c/span>\u003cdiv class=\"g-exp\">'look forward to'의 to는 [[전치사]]이므로 뒤에 [[동명사]]가 와요. 따라서 enjoy는 enjoying으로 써야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"두 번째 문제예요. 빈칸에 들어갈 말을 골라 보세요. 문장은 I'm looking forward to 빈칸 this camp예요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 두 번째 보기 enjoying이에요. look forward to의 to는 전치사라서 뒤에 동명사가 와요. 그래서 enjoying this camp처럼 말해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">A: I'm looking forward to the science camp. B: ____ 에 들어갈 응답으로 알맞은 것은?\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">A: I'm looking forward to the science camp. B: ____\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>So am I.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>So do I.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Neither am I.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I'm looking forward to.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">So am I.\u003c/span>\u003cdiv class=\"g-exp\">앞의 문장에 be동사 am이 쓰였으므로 ‘나도 그래’는 [[So am I.]]로 받아요. So do I는 일반동사에, Neither am I는 부정에 대한 동의 표현이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"세 번째 문제예요. 상대가 과학 캠프가 기대된다고 말했을 때 알맞은 응답을 골라 보세요. 문장은 I'm looking forward to the science camp예요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":6},{"n":38,"text":"정답은 첫 번째 보기 So am I예요. 앞 문장에 be동사 am이 있으므로 나도 그래는 So am I로 받아요. So do I는 일반동사가 있는 문장에 쓰는 표현이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어를 바르게 배열한 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">should / we / what / prepare / for / it\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>What should we prepare for it?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>What we should prepare for it?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Should what we prepare for it?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>What should prepare we for it?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">What should we prepare for it?\u003c/span>\u003cdiv class=\"g-exp\">의문사+조동사+주어+동사원형 순서로 배열해야 해요. 따라서 [[What]] should we prepare for it?가 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":39,"text":"네 번째 문제예요. 주어진 단어를 바르게 배열한 문장을 골라 보세요. 단어는 should, we, what, prepare, for, it이에요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":40,"text":"","hl":"q","pause":6},{"n":41,"text":"정답은 첫 번째 보기 What should we prepare for it예요. 의문사 what 다음에 조동사 should, 주어 we, 동사원형 prepare 순서로 와요. 그래서 무엇을 준비해야 하니라는 뜻이 돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화 내용과 일치하는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>The science camp is on December 10th.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The weather will be rainy during the camp.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Students do not need warm clothes.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Kate is not curious about the moon.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The science camp is on December 10th.\u003c/span>\u003cdiv class=\"g-exp\">대화에서 과학 캠프가 12월 10일에 열린다고 했어요. 날씨는 맑을 것이고, 따뜻한 옷이 필요하며, 케이트는 달을 보는 것이 궁금하다고 했어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":42,"text":"다섯 번째 문제예요. 대화 내용과 일치하는 것을 골라 보세요. 캠프 날짜와 날씨, 준비물, 케이트의 마음을 잘 생각해 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":43,"text":"","hl":"q","pause":6},{"n":44,"text":"정답은 첫 번째 보기예요. 과학 캠프는 십이월 십일에 열려요. 대화에서 날씨는 맑을 거라고 했고 따뜻한 옷이 필요하다고 했으며 케이트는 달을 보는 것이 궁금하다고 말했어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">소식 묻고 기대 표현하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>'Have you heard about ~?'는 \u003cb class=\"key\">소식\u003c/b>이나 \u003cb class=\"key\">정보\u003c/b>를 들어 본 적 있는지 물을 때 써요.\u003c/li>\u003cli>'I'm looking forward to ~.'는 \u003cb class=\"key\">기대감\u003c/b>을 나타내며 to 뒤에는 명사나 \u003cb class=\"key\">동명사\u003c/b>가 와요.\u003c/li>\u003cli>'I'm curious to + 동사원형'은 \u003cb class=\"key\">호기심\u003c/b>이나 \u003cb class=\"key\">궁금증\u003c/b>을 나타내는 표현이에요.\u003c/li>\u003cli>'I hope + 절'은 바라는 일이나 \u003cb class=\"key\">소망\u003c/b>을 나타내고, that은 \u003cb class=\"key\">생략\u003c/b>할 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":45,"text":"오늘은 과학 캠프 소식을 묻고 기대하는 표현을 배웠어요. Have you heard about 다음에 명사를 붙이면 그 일에 대해 들어 본 적 있는지 물을 수 있어요. I'm looking forward to 다음에는 명사나 동명사를 붙여 기대하는 마음을 표현해요. I'm curious to see처럼 궁금한 마음을 말하고 I hope you can find it처럼 소망을 표현하는 것도 익혀 두세요. 오늘 수고했어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
