제를 겪고 있으며 디지털 기기 과다 사용이 원인으로 지목된다.</li><li>아침에 물건을 계속 잊어버리는 주인공(forgetful)</li><li>뉴스에서 보도된 십 대들의 기억력 문제(memory problems)</li><li>디지털 기기 과다 사용의 부작용(digital devices)</li><li>핵심 키워드: 디지털 기기(digital devices)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02산책을 위한 유인책</div><ul><li>반려견은 주인의 주의를 돌려 함께 시간을 보내기 위한 전략을 실행한다.</li><li>주인의 관심을 끌기 위해 목줄(leash)을 가져옴</li><li>귀여운 춤(cute dance)을 통해 주인의 행동 변화 유도</li><li>스마트폰을 내려놓게 만드는 데 성공(plan worked)</li><li>핵심 키워드: 계획(plan)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03간절한 당부</div><ul><li>반려견은 주인과의 소통과 교감을 위해 스마트폰 사용을 줄여줄 것을 요청한다.</li><li>스마트폰 사용을 줄여달라는 진심 어린 부탁(use your phone less)</li><li>함께 더 많은 시간(more time)을 보내기를 바람</li><li>약속(promise)을 통해 관계 회복을 시도</li><li>핵심 키워드: 약속(promise)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forgetful</td><td class=\"m\">잘 잊어버리는, 건망증이 있는</td></tr><tr><td class=\"w\">digital device</td><td class=\"m\">디지털 기기, 전자 장치</td></tr><tr><td class=\"w\">put down</td><td class=\"m\">~을 내려놓다, ~을 그만두다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오전 8시</span><span class=\"en\"><b><span class=\"grammar-hl\">8 a.m.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 날</span><span class=\"en\"><b><span class=\"grammar-hl\">the Next Day</span></b></span></div></div><div class=\"lec-sent-ko\">다음 날 오전 8시</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 본격적인 시작을 알리는 도입부로, 화자가 누구인지 밝히기 전 일상의 한 장면을 설정하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">8 a.m. the Next Day (명사구): 시간과 날짜를 나타내는 부사적 명사구로 문장 전체의 배경을 설정합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">좋은 아침이야!</span><span class=\"en\"><b><span class=\"grammar-hl\">Good morning!</span></b></span></div></div><div class=\"lec-sent-ko\">좋은 아침이야!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아침 인사를 건네며 주인과 반려동물 간의 평범하고 다정한 대화가 시작되는 분위기를 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Good morning! (관용표현): 아침 인사를 건넬 때 사용하는 정형화된 인사말입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즐겁게 보내</span><span class=\"en\"><b><span class=\"grammar-hl\">Have fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에서!</span><span class=\"en\"><b>at school!</b></span></div></div><div class=\"lec-sent-ko\">학교에서 즐겁게 보내!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학교에 가려는 사람을 향해 응원의 말을 건네며, 화자가 사람과 긴밀한 유대 관계를 맺고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have fun (관용표현): have + fun(즐거움) 구조로 &#39;~하며 즐거운 시간을 보내다&#39;라는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오,</span><span class=\"en\"><b>Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 돌아오고 있네.</span><span class=\"en\"><b><span class=\"grammar-hl\">you’re coming</span> back.</b></span></div></div><div class=\"lec-sent-ko\">오, 너는 돌아오고 있네.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 인사와 달리 예기치 못한 상황이 발생했음을 알리며, 뒤이어 나올 대화의 전환을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you’re coming (현재진행): be동사(are) + 현재분사(coming) 구조로, 가까운 미래나 현재 진행 중인 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 무언가를 잊었니</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you forget</span> something</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또?</span><span class=\"en\"><b>again?</b></span></div></div><div class=\"lec-sent-ko\">또 무언가를 잊었니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문을 통해 상대방의 행동에 대한 관찰을 드러내며, 상대가 평소 건망증이 있다는 사실을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you forget (대동사(did)): 일반동사 forget을 사용한 의문문으로, 앞선 상황을 확인하는 질문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 잘 잊어버려</span><span class=\"en\"><b><span class=\"grammar-hl\">You’re forgetful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요즘.</span><span class=\"en\"><b>these days.</b></span></div></div><div class=\"lec-sent-ko\">너는 요즘 잘 잊어버려.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문을 뒷받침하며 상대방의 최근 상태에 대한 화자의 걱정과 판단을 전합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You’re forgetful 형용사 보어: be동사(are) 뒤에 형용사(forgetful)가 위치하여 주어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forgetful</td><td class=\"m\">잘 잊어버리는, 건망증이 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">봐!</span><span class=\"en\"><b><span class=\"grammar-hl\">Look!</span></b></span></div></div><div class=\"lec-sent-ko\">봐!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대방의 주의를 환기하여 새로운 주제인 뉴스 기사로 화제를 전환하려는 신호입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look! (명령문): 주어 없이 동사 원형으로 시작하여 상대방의 주의를 환기합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뉴스는 말해</span><span class=\"en\"><b>The news says</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 십 대들이 기억력 문제를 경험한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that many teens experience memory problems</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 디지털 기기를 사용하기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because they use digital devices</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많이.</span><span class=\"en\"><b><span class=\"grammar-hl\">too much</span>.</b></span></div></div><div class=\"lec-sent-ko\">뉴스에서는 많은 십 대들이 디지털 기기를 너무 많이 사용하기 때문에 기억력 문제를 경험한다고 말해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상대의 건망증 원인을 외부적 환경인 디지털 기기 사용과 연결해 분석적으로 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that many teens experience memory problems (명사절): say의 목적어 역할을 하는 that절로, 문장 전체의 내용을 이끕니다.</div><div class=\"lec-gr-item\">because they use digital devices too much (접속사절): 이유를 나타내는 부사절로, 주절의 동작에 대한 원인을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">digital device</td><td class=\"m\">디지털 기기, 전자 장치</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 바라</span><span class=\"en\"><b><span class=\"grammar-hl\">I hope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네가 그 십 대들 중 한 명이 아니기를,</span><span class=\"en\"><b><span class=\"grammar-hl\">you’re not one of those teens</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 똑똑한 친구야.</span><span class=\"en\"><b>my smart friend.</b></span></div></div><div class=\"lec-sent-ko\">나는 네가 그 십 대들 중 한 명이 아니길 바라, 나의 똑똑한 친구야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 문제와 상대를 분리하며, 상대방에 대한 애정과 신뢰를 담은 격려의 메시지를 전합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I hope you’re not one of those teens (명사절): hope 뒤에 접속사 that이 생략된 구조로, 목적어 역할을 하는 절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방과 후에</span><span class=\"en\"><b><span class=\"grammar-hl\">After school</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그날,</span><span class=\"en\"><b><span class=\"grammar-hl\">that day</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 그녀에게 가져다주었어</span><span class=\"en\"><b><span class=\"grammar-hl\">I brought her</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 목줄을</span><span class=\"en\"><b><span class=\"grammar-hl\">my leash</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 귀여운 춤을 췄어.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">did a cute dance</span>.</b></span></div></div><div class=\"lec-sent-ko\">그날 방과 후에, 저는 그녀에게 제 목줄을 가져다주었고 귀여운 춤을 추었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시점이 바뀌어 화자의 행동이 서술됩니다. 상대의 행동을 바꾸기 위해 반려동물만이 할 수 있는 능동적인 전략을 실행하는 모습입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After school that day (전치사구): 시간적 배경을 나타내는 전치사(After)구로 문장 앞부분에서 부사 역할을 합니다.</div><div class=\"lec-gr-item\">I brought her my leash (4형식(SVOO)): bring(주다/가져오다) 동사가 간접목적어(her)와 직접목적어(my leash)를 취하는 구조입니다.</div><div class=\"lec-gr-item\">did a cute dance (관용표현): perform a dance를 의미하며, &#39;춤을 추다&#39;라는 뜻의 동사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 계획은</span><span class=\"en\"><b><span class=\"grammar-hl\">My plan</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">효과가 있었어!</span><span class=\"en\"><b><span class=\"grammar-hl\">worked!</span></b></span></div></div><div class=\"lec-sent-ko\">제 계획은 효과가 있었죠!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장에서 보인 행동이 의도한 결과를 가져왔음을 밝히며 화자의 성취감을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My plan worked! (자동사): work가 &#39;효과가 있다/성공하다&#39;라는 의미의 자동사로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 내려놓았어</span><span class=\"en\"><b><span class=\"grammar-hl\">She put down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 휴대 전화를,</span><span class=\"en\"><b><span class=\"grammar-hl\">her phone</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 걸었어</span><span class=\"en\"><b>and we walked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마을 주변을.</span><span class=\"en\"><b>around town.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그녀의 휴대 전화를 내려놓았고, 우리는 마을 주변을 산책했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자의 노력이 가져온 구체적인 결과로, 디지털 기기 중심의 생활에서 벗어나 서로 소통하는 시간으로 변화했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">She put down her phone (구동사): put(동사) + down(부사)이 결합된 표현으로 &#39;내려놓다&#39;라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">put down</td><td class=\"m\">~을 내려놓다, ~을 그만두다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 ~했죠</span><span class=\"en\"><b><span class=\"grammar-hl\">I was so happy.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 행복</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 아주 행복했죠.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 함께 시간을 보내는 것이 화자에게 어떤 정서적 만족감을 주는지 직접적으로 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was so happy. (보어): be동사(was) 뒤에 형용사(happy)가 위치하여 주어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진,</span><span class=\"en\"><b>Jin,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부디 네 휴대 전화를 써</span><span class=\"en\"><b><span class=\"grammar-hl\">please use your phone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적게</span><span class=\"en\"><b><span class=\"grammar-hl\">less</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 시간을 더 많이 보내</span><span class=\"en\"><b>and <span class=\"grammar-hl\">spend more time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나와!</span><span class=\"en\"><b><span class=\"grammar-hl\">with me</span>!</b></span></div></div><div class=\"lec-sent-ko\">Jin, 부디 네 휴대 전화를 덜 쓰고 나랑 더 많은 시간을 보내 줘!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 목적을 드러내는 핵심적인 요청입니다. 디지털 기기보다 인간과 동물 사이의 교감이 더 중요함을 호소합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">please use your phone less (명령문): 상대방에게 요청을 나타내는 부사(please)가 포함된 동사 원형 시작 문장입니다.</div><div class=\"lec-gr-item\">spend more time with me (명령문): 앞선 명령문과 병렬 구조를 이루며 상대방에게 동작을 권유합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 약속할 수 있니</span><span class=\"en\"><b><span class=\"grammar-hl\">Can you promise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나에게?</span><span class=\"en\"><b><span class=\"grammar-hl\">me?</span></b></span></div></div><div class=\"lec-sent-ko\">약속할 수 있지?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 미래의 행동 변화를 확약받으려는 의지를 담아 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can you promise me? (의문문): 조동사(Can)가 문장 맨 앞에 위치하여 상대방의 의지를 묻는 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>주인은 휴대폰 사용으로 인해 기억력 문제 등 일상의 어려움을 겪는다.</li><li>반려동물은 주인의 주의를 돌리기 위해 나름의 전략적 행동을 취한다.</li><li>반려동물의 노력으로 주인은 휴대폰을 내려놓고 함께 시간을 보내게 된다.</li><li>화자는 주인에게 디지털 기기보다 서로의 교감을 우선시해 달라는 진심 어린 당부를 건넨다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Teens are suffering from memory issues due to digital device overuse, but they can improve their well-being by choosing to spend more time engaging with those around them.</div>\n              <div class=\"lec-final-sum-ko\">청소년들은 디지털 기기 과다 사용으로 인해 기억력 문제에 시달리고 있지만, 주변 사람들과 교류하는 시간을 늘림으로써 건강을 회복할 수 있다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.mp3","hl":"meaning"},{"audio":"./3_audio/28.mp3","hl":"grammar"}],[{"audio":"./3_audio/29.mp3","hl":"main"},{"audio":"./3_audio/30.mp3","hl":"meaning"},{"audio":"./3_audio/31.mp3","hl":"grammar"}],[{"audio":"./3_audio/32.mp3","hl":"main"},{"a
