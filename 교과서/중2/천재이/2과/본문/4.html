건강 가이드</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">디지털 기기의 사용이 일상화되면서 우리 몸을 보호하기 위한 일종의 &#39;디지털 위생(Digital Hygiene)&#39; 개념이 중요해지고 있어요. 먼저, 60-60 법칙과 관련된 청력 손실은 큰 소리에 장시간 노출되는 소음성 난청(Noise-Induced Hearing Loss)에서 기인하는데, 이는 마치 귓속의 미세한 세포들이 쉼 없이 일하다 지치는 것과 비슷해요. 또한, 20-20 법칙의 핵심인 디지털 눈 피로(Digital Eye Strain)는 화면을 볼 때 눈 깜박임 횟수가 급격히 줄어들어 발생하는 현상으로, 먼 곳을 바라보는 것만으로도 눈 근육의 긴장을 효과적으로 완화할 수 있답니다. 마지막으로, 스마트폰에 과도하게 의존하는 것을 디지털 치매(Digital Dementia)라고 부르는데, 이는 뇌의 기억 회로를 사용하지 않아 뇌 기능이 저하되는 상태를 의미해요. 이러한 배경지식을 미리 알고 계신다면, 스마트 기기를 더 건강하고 똑똑하게 사용하는 습관을 기르는 데 큰 도움이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01청각 보호를 위한 60-60 규칙</div><ul><li>귀 건강을 지키기 위해 이어폰 사용 시간과 볼륨을 제한해야 합니다.</li><li>일일 이어폰 사용 시간: 60분 미만(less than 60 minutes)</li><li>최대 볼륨의 60% 이하로 유지(below 60 percent)</li><li>핵심 키워드: 60-60 규칙(60-60 Rule)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시각 피로 완화를 위한 20-20 규칙</div><ul><li>화면을 오래 볼 때 눈의 긴장을 풀어주기 위해 정기적인 휴식이 필요합니다.</li><li>스크린 사용 20분마다 휴식(20 minutes of screen time)</li><li>20초 동안 먼 곳을 바라보기(look far away)</li><li>핵심 키워드: 20-20 규칙(20-20 Rule)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03두뇌 활성화를 위한 습관</div><ul><li>스마트폰에 의존하기보다 스스로 기억하려는 노력이 필요합니다.</li><li>할 일을 스스로 기억하기(remember what to do)</li><li>스마트폰 없이도 충분히 똑똑함(smart enough without your smartphone)</li><li>핵심 키워드: 두뇌 훈련(Train Your Brain)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make sure</td><td class=\"m\">확실히 하다, 확인하다</td></tr><tr><td class=\"w\">maximum</td><td class=\"m\">최대, 최고치</td></tr><tr><td class=\"w\">rest</td><td class=\"m\">휴식을 취하다, 쉬다</td></tr><tr><td class=\"w\">look far away</td><td class=\"m\">멀리 바라보다</td></tr><tr><td class=\"w\">smart</td><td class=\"m\">영리한, 똑똑한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이어폰을 사용하세요</span><span class=\"en\"><b>Digital Life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루에 60분 미만으로</span><span class=\"en\"><b>Tips for You 60-60 Rule Use earphones <span class=\"grammar-hl\">for less than 60 minutes</span> a day.</b></span></div></div><div class=\"lec-sent-ko\">(이어폰을 하루에 60분 미만으로 사용하세요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디지털 기기 사용 습관을 교정하기 위한 첫 번째 규칙으로, 청각 기능을 보호하기 위해 기기 사용 시간을 제한해야 한다는 권고입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for less than 60 minutes (관용표현): less than은 &#39;~미만의/보다 적은&#39;이라는 의미로 뒤의 명사구(60 minutes)를 수식하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반드시 ~하도록 하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Make sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음량을 60퍼센트 아래로 유지하고</span><span class=\"en\"><b>the volume is below 60 percent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최대의</span><span class=\"en\"><b>of the maximum.</b></span></div></div><div class=\"lec-sent-ko\">반드시 음량을 최대의 60퍼센트 아래로 유지하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 시간 제한과 더불어 청력 손상을 방지하기 위해 소리 크기를 구체적인 수치로 조절하라는 실천 지침입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Make sure (관용표현): &#39;반드시 ~하도록 해라&#39;는 의미의 표현으로, 뒤에 접속사 that이 생략된 명사절을 취하여 뒤 내용을 확실히 하라는 지시를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make sure</td><td class=\"m\">확실히 하다, 확인하다</td></tr><tr><td class=\"w\">maximum</td><td class=\"m\">최대, 최고치</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 눈을 쉬게 하세요</span><span class=\"en\"><b>20-20 Rule Rest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">20초 동안</span><span class=\"en\"><b>your eyes for</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">20분 후에</span><span class=\"en\"><b>20 seconds after</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화면을 본</span><span class=\"en\"><b>20 minutes of screen time.</b></span></div></div><div class=\"lec-sent-ko\">(화면을 20분 본 후에 당신의 눈을 20초 동안 쉬게 하세요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시각적 피로를 해소하기 위한 규칙을 제시하며, 앞서 다룬 청각 건강에 이어 신체 건강 전반을 관리하라는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to remember (to부정사): &#39;기억하기 위해서&#39;라는 부사적 용법(목적)으로 쓰여, 앞의 동사 Use를 보충 설명합니다.</div><div class=\"lec-gr-item\">what to do (간접의문문): 의문사(what)+to부정사 구조로, &#39;무엇을 해야 할지&#39;라는 명사구 역할을 하여 동사 remember의 목적어 자리에 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rest</td><td class=\"m\">휴식을 취하다, 쉬다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 휴식 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">During this break</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먼 곳을 보세요.</span><span class=\"en\"><b>look far away.</b></span></div></div><div class=\"lec-sent-ko\">이 휴식 동안, 먼 곳을 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 눈의 조절 근육을 이완하여 피로를 효과적으로 줄이는 구체적인 방법을 알려주며, 앞 문장의 휴식 방식을 보충 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">During this break (관용표현): During은 특정 기간을 나타내는 명사구(this break) 앞에 쓰여 부사적 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look far away</td><td class=\"m\">멀리 바라보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 두뇌를 사용하세요</span><span class=\"en\"><b>Train Your Brain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기억하기 위해</span><span class=\"en\"><b>Use your</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 할지</span><span class=\"en\"><b>brain <span class=\"grammar-hl\">to remember</span> <span class=\"grammar-hl\">what to do</span>.</b></span></div></div><div class=\"lec-sent-ko\">(무엇을 할지 기억하기 위해 당신의 두뇌를 사용하세요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디지털 기기에 대한 의존도를 낮추고 스스로 사고하는 능력을 기르라는 조언으로, 앞선 신체 관리에서 정신 건강 관리로 주제를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to remember (to부정사): 앞의 명사적인 목적어 성분(what to do)을 이끄는 동사 원형 구문을 수식하거나 동사 use의 목적어로 이어지는 보충적 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">what to do (간접의문문): 의문사(what)와 to부정사가 결합된 형태입니다. &#39;무엇을 할지&#39;라는 명사구로서 타동사 remember의 목적어 역할을 수행합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 충분히 똑똑하답니다</span><span class=\"en\"><b>You are <span class=\"grammar-hl\">smart enough</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스마트폰 없이도</span><span class=\"en\"><b>without your smartphone!</b></span></div></div><div class=\"lec-sent-ko\">당신은 스마트폰 없이도 충분히 똑똑하답니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 여기서 힘주어 말합니다. 기기가 없어도 인간 고유의 인지 능력은 매우 뛰어나다는 점을 강조하며 독자의 자신감을 북돋는 마무리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">smart enough (관용표현): 형용사(smart) 뒤에 enough를 배치하여 &#39;충분히 똑똑한&#39;이라는 의미를 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smart</td><td class=\"m\">영리한, 똑똑한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>청력 보호를 위해 이어폰 사용 시간을 줄이고 볼륨을 낮춰야 한다.</li><li>시력 보호를 위해 화면을 볼 때는 20분마다 20초씩 먼 곳을 보며 쉬어야 한다.</li><li>스마트폰에 의존하지 말고 스스로 기억하고 생각하는 습관을 들여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Adopting specific rules for device usage protects your physical health, while actively exercising your memory keeps your brain sharp.</div>\n              <div class=\"lec-final-sum-ko\">기기 사용에 대한 구체적인 규칙을 채택하는 것은 신체 건강을 보호하며, 능동적으로 기억력을 훈련하는 것은 뇌를 명석하게 유지한다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":"main"},{"audio":"./4_audio/9.mp3","hl":"meaning"},{"audio":"./4_audio/10.mp3","hl":"grammar"}],[{"audio":"./4_audio/11.mp3","hl":"main"},{"audio":"./4_audio/12.mp3","hl":"meaning"},{"audio":"./4_audio
