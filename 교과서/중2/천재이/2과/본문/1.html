 data-hl=\"stage-1\"><div class=\"lec-stage-head\">02소통의 단절</div><ul><li>오후 4시에 산책을 가고 싶지만, 이어폰을 낀 진은 베일리의 소리를 듣지 못한다.</li><li>야외 활동(play)을 제안하는 베일리</li><li>귀를 막고 있는 작은 이어폰(earphones)</li><li>핵심 키워드: 단절(blocking), 듣지 못함(can&#39;t hear)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03건강 우려 및 요청</div><ul><li>진이 듣고 있는 지나친 소음이 청력을 해칠까 봐 베일리가 진심 어린 걱정을 한다.</li><li>이어폰에서 들리는 시끄러운 소리(thundering sounds)</li><li>청력 손상(harm your hearing)에 대한 경고</li><li>핵심 키워드: 청력(hearing), 소음(loud sounds)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be into</td><td class=\"m\">~에 빠져 있다, ~에 열중하다</td></tr><tr><td class=\"w\">wait for</td><td class=\"m\">~을 기다리다</td></tr><tr><td class=\"w\">go out</td><td class=\"m\">외출하다, 밖으로 나가다</td></tr><tr><td class=\"w\">block out</td><td class=\"m\">차단하다, 가리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thundering</td><td class=\"m\">우레 같은, 굉음을 내는</td></tr><tr><td class=\"w\">harm</td><td class=\"m\">해치다, 손상하다</td></tr><tr><td class=\"w\">take off</td><td class=\"m\">벗다, 이륙하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나와 약속해!</span><span class=\"en\"><b><span class=\"grammar-hl\">Promise Me!</span></b></span></div></div><div class=\"lec-sent-ko\">나와 약속해!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자인 강아지 베일리가 자신을 소개하며 독자에게 친근하게 말을 걸고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Promise Me! (5형식(명령문)): 주어(you)가 생략된 명령문 구조로, &#39;Promise(동사) + Me(간접목적어) + (생략된 직접목적어)&#39;의 4형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">Hi!</span></b></span></div></div><div class=\"lec-sent-ko\">안녕하세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> a tail은 강아지의 꼬리를 의미하며, 이어질 문장에서 발음이 비슷한 단어로 언어유희를 펼치기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hi! (관용표현): 대화에서 상대방에게 친근하게 인사할 때 사용하는 감탄사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 Bailey이고,</span><span class=\"en\"><b>I’m Bailey,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동네의 친절한 개예요.</span><span class=\"en\"><b><span class=\"grammar-hl\">the friendly dog in town</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 Bailey, 동네의 친절한 개예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자인 강아지 베일리가 자신을 소개하며 독자에게 친근하게 말을 걸고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the friendly dog in town (현재분사(형용사적)): 문맥상 생략된 &#39;which is&#39;를 포함하여 &#39;the friendly dog (which is) in town&#39;과 같이 명사를 수식하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 가지고 있어요</span><span class=\"en\"><b>I have <span class=\"grammar-hl\">a tail for you</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼬리를</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분을 위한.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 여러분을 위한 꼬리(tail)가 하나 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> a tail은 강아지의 꼬리를 의미하며, 이어질 문장에서 발음이 비슷한 단어로 언어유희를 펼치기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a tail for you (관용표현): 상대방에게 무언가를 제공하거나 전달할 의도가 있음을 나타내는 전치사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">앗,</span><span class=\"en\"><b><span class=\"grammar-hl\">Oops,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미해요</span><span class=\"en\"><b><span class=\"grammar-hl\">I mean</span> a tale!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기가 하나 있다는 것을!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">앗, 제 말은, 이야기(tale)가 하나 있다는 의미예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 a tail을 a tale로 정정하면서, 강아지가 사람처럼 말실수를 하는 상황을 연출해 독자의 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Oops, I mean (관용표현): 실수한 내용을 바로 정정하거나 수정할 때 사용하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~에 대한 것이에요</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s about</span> my sweet friend Jin</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저의 귀여운 친구 Jin과</span><span class=\"en\"><b>and her smartphone.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 스마트폰.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 저의 귀여운 친구 Jin과 그녀의 스마트폰에 대한 것이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> my sweet friend Jin이 앞으로 전개될 이야기의 주인공임을 밝히며, 이 글의 핵심 소재인 스마트폰을 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s about (가주어): 진주어: &#39;It&#39;은 뒤에 나오는 &#39;my sweet friend Jin and her smartphone&#39;이라는 긴 명사구 내용을 가리키는 상황적 주어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 조금 걱정이 되는데</span><span class=\"en\"><b>I’m a bit <span class=\"grammar-hl\">worried</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 그것에 너무 빠져 있기 때문에.</span><span class=\"en\"><b>because she’s so into it.</b></span></div></div><div class=\"lec-sent-ko\">저는 그녀가 그것에 너무 빠져 있기 때문에 조금 걱정이 돼요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> she’s so into it은 스마트폰에 지나치게 몰입해 있다는 뜻으로, 스마트폰 과의존 문제라는 글의 핵심 주제를 제시합니다. 6. 4 p.m. 시간의 흐름을 나타내며, 주인공인 진과 베일리의 상호작용이 일어나는 구체적인 장면으로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">worried (과거분사): 주어의 심리 상태를 설명하는 형용사적 보어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오후 4시.</span><span class=\"en\"><b><span class=\"grammar-hl\">4 p.m.</span></b></span></div></div><div class=\"lec-sent-ko\">오후 4시</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베일리가 진에게 공동의 활동을 제안하며 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">4 p.m. (관용표현): 시간을 나타내는 표현으로, 오후 4시를 의미합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">멍멍!</span><span class=\"en\"><b><span class=\"grammar-hl\">Bow-wow!</span></b></span></div></div><div class=\"lec-sent-ko\">멍멍!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 진의 반응이 없는 상황을 관찰하며 베일리가 의사소통의 단절을 인지하게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Bow-wow! (관용표현): 의성어로, 개의 짖는 소리를 표현합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jin, 나는 하루 종일 너를 기다리고 있었어.</span><span class=\"en\"><b>Jin,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>I <span class=\"grammar-hl\">was waiting</span> for you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>all day.</b></span></div></div><div class=\"lec-sent-ko\">Jin, 나는 하루 종일 너를 기다리고 있었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베일리가 진의 주의를 끌려는 의성어를 통해 반려견의 간절함을 드러내며, 앞 문장의 걱정이 구체적인 행동으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was waiting (현재진행): &#39;be동사(was) + -ing(waiting)&#39; 구조로, 과거 특정 시점에 동작이 계속 진행 중이었음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나가고</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s go out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀자!</span><span class=\"en\"><b><span class=\"grammar-hl\">and play</span>!</b></span></div></div><div class=\"lec-sent-ko\">나가서 놀자!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베일리가 진에게 공동의 활동을 제안하며 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s go out and play (관용표현): &#39;Let us&#39;의 축약형으로, 상대방에게 함께 동작을 수행할 것을 제안할 때 사용합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go out</td><td class=\"m\">외출하다, 밖으로 나가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오,</span><span class=\"en\"><b>Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 내 말을 못 듣는구나.</span><span class=\"en\"><b>you <span class=\"grammar-hl\">can’t hear</span> me.</b></span></div></div><div class=\"lec-sent-ko\">오, 너는 내 말을 못 듣는구나.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 진의 반응이 없는 상황을 관찰하며 베일리가 의사소통의 단절을 인지하게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t hear (관용표현): &#39;cannot + 동사원형&#39; 구조로, 가능성이나 능력의 부정을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네 귀에 있는 저 아주 작은 이어폰들이</span><span class=\"en\"><b><span class=\"grammar-hl\">Those tiny earphones in your ears</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 차단하고 있어.</span><span class=\"en\"><b><span class=\"grammar-hl\">are blocking me out</span>.</b></span></div></div><div class=\"lec-sent-ko\">네 귀에 있는 저 아주 작은 이어폰들이 나를 차단하고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> blocking me out은 외부 소리를 완전히 차단하고 이어폰 속 소리에만 몰입하는 진의 상태를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Those tiny earphones in your ears (현재분사(형용사적)): &#39;in your ears&#39;가 &#39;Those tiny earphones&#39;를 수식하는 형용사구로 쓰였습니다.</div><div class=\"lec-gr-item\">are blocking me out (현재진행): &#39;be동사(are) + -ing(blocking)&#39; 구조로, 동작이 현재 계속되고 있음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 들을 수 있어</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can hear</span> the thundering sounds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">천둥 같은 소리를</span><span class=\"en\"><b>from them.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들에서 나오는.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 그것들에서 나오는 천둥 같은 소리를 들을 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> thundering sounds는 진이 듣는 소리가 지나치게 크다는 것을 강아지의 입장에서 비유적으로 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can hear (관용표현): &#39;can + 동사원형&#39; 구조로, 감각 동사와 결합하여 능력을 표현합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thundering</td><td class=\"m\">우레 같은, 굉음을 내는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 노래하는 괴물들이</span><span class=\"en\"><b>Are some singing monsters <span class=\"grammar-hl\">living</span> there?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거기에 살고 있니?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">노래하는 몇몇 괴물들이 거기에 살고 있니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어폰 속의 음악을 괴물들의 소리로 상상하며, 진이 현실 세계와 동떨어져 있음을 풍자적으로 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">living (현재진행): &#39;be동사(Are) + -ing(living)&#39; 구조로, 주어의 현재 상태나 동작을 질문합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저 큰 소리들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Those loud sounds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너의 청력에 해를 끼칠 거야.</span><span class=\"en\"><b>will harm your hearing.</b></span></div></div><div class=\"lec-sent-ko\">저 큰 소리들은 너의 청력에 해를 끼칠 거야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어폰 사용이 진의 신체 건강에 부정적인 영향을 줄 수 있다는 점을 베일리가 경고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Those loud sounds (관용표현): &#39;that/those + 명사&#39; 구조로, 가까이 있거나 언급된 대상을 지칭하는 지시사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">harm</td><td class=\"m\">해치다, 손상하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제발 그것들을 빼고</span><span class=\"en\"><b>Please <span class=\"grammar-hl\">take them off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나랑 놀아 줘!</span><span class=\"en\"><b>and <span class=\"grammar-hl\">play with me</span>!</b></span></div></div><div class=\"lec-sent-ko\">제발 그것들을 빼고 나랑 놀아 줘!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기를 마무리하며, 스마트폰(이어폰)에서 벗어나 자연스러운 인간과 동물의 교감으로 돌아오기를 바라는 베일리의 소망을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take them off (관용표현): &#39;동사 + 목적어 + 부사&#39;가 결합하여 &#39;~을 벗다/제거하다&#39;라는 의미를 만드는 구동사입니다.</div><div class=\"lec-gr-item\">play with me (관용표현): &#39;play + with + 목적어&#39; 구조로, &#39;~와 놀다&#39;라는 의미의 전치사 결합 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>강아지 베일리는 친구 진이 스마트폰에 너무 몰입해 있는 상황을 걱정한다.</li><li>베일리는 진과 놀고 싶어 하지만, 진은 이어폰을 낀 채 외부 세계와 단절되어 있다.</li><li>베일리는 큰 볼륨의 이어폰 소리가 진의 청력을 해칠까 봐 걱정한다.</li><li>베일리는 진이 이어폰을 빼고 자신과 함께 시간을 보내기를 간절히 바란다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Excessive smartphone use and loud earphone volume can cause hearing damage, and it hinders the ability to connect with others.</div>\n              <div class=\"lec-final-sum-ko\">과도한 스마트폰 사용과 큰 이어폰 음량은 청력 손상을 유발하며, 타인과 소통하는 능력을 저해한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"ma
