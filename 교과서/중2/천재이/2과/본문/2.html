/li><li>구체적인 휴식 방법을 알려주겠다고 제안함</li><li>핵심 키워드: 눈의 휴식(eye rest)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03시각적 휴식 실행</div><ul><li>눈을 감고 즐거운 상상을 함으로써 피로를 완화하는 방법을 제시한다.</li><li>눈을 감고(close your eyes) 외부 자극 차단</li><li>좋아하는 간식(favorite snacks)을 떠올리며 이완 유도</li><li>핵심 키워드: 상상력(imagination)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rub</td><td class=\"m\">문지르다, 비비다</td></tr><tr><td class=\"w\">give ~ a break</td><td class=\"m\">~에게 휴식을 주다, ~을 잠시 멈추다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오후 11시</span><span class=\"en\"><b><span class=\"grammar-hl\">11 p.m.</span></b></span></div></div><div class=\"lec-sent-ko\">오후 11시</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> It’s late, but you’re still busy with your phone은 독자가 밤늦은 시간까지 화면을 보며 시간을 보내고 있다는 현재 상황을 환기하며 글의 도입부를 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">11 p.m. (관용표현): 시간 표현으로 &#39;오후 11시&#39;를 의미하며, 전치사 없이 시각을 나타내는 부사구로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">늦었어,</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s</span> late,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 너는 여전히 바쁘네</span><span class=\"en\"><b>but you’re still busy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 휴대 전화로</span><span class=\"en\"><b>with your phone.</b></span></div></div><div class=\"lec-sent-ko\">늦었어, 하지만 너는 아직도 네 휴대 전화로 바쁘네.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> It’s late, but you’re still busy with your phone은 독자가 밤늦은 시간까지 화면을 보며 시간을 보내고 있다는 현재 상황을 환기하며 글의 도입부를 엽니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s (가주어): 진주어(가주어): 비인칭 주어 It을 사용하여 시간이나 상태를 나타내는 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 보고 있니</span><span class=\"en\"><b>Are you <span class=\"grammar-hl\">watching</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재미있는 것을?</span><span class=\"en\"><b><span class=\"grammar-hl\">something interesting</span>?</b></span></div></div><div class=\"lec-sent-ko\">너는 재미있는 것을 보고 있니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Are you watching something interesting?은 앞선 상황에 대해 독자에게 질문을 던짐으로써 독자가 자신의 행동을 스스로 돌아보게 하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">watching (현재진행): be동사(are) + 현재분사(-ing) 구조로, 주어의 현재 동작을 나타냅니다.</div><div class=\"lec-gr-item\">something interesting (현재분사(형용사적)): -thing으로 끝나는 명사 뒤에서 interesting이 수식하며 &#39;흥미로운 것&#39;이라는 의미를 갖습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네 눈은 분홍색으로 보이고,</span><span class=\"en\"><b>Your eyes look pink,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너는 계속 비비고 있어</span><span class=\"en\"><b>and you <span class=\"grammar-hl\">keep rubbing</span> them.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">네 눈은 분홍색으로 보이고, 너는 그것들을 계속 비비고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Your eyes look pink, and you keep rubbing them은 독자가 장시간 휴대폰을 사용함으로써 겪는 신체적 증상을 구체적으로 묘사하여, 뒤이어 나올 조언의 필요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep rubbing (현재분사(동명사적)): keep + -ing 구조로, &#39;계속 ~하다&#39;라는 의미의 관용표현입니다. 여기서 -ing는 동명사로 &#39;문지르는 행위&#39;를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rub</td><td class=\"m\">문지르다, 비비다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제발 네 눈에 주렴</span><span class=\"en\"><b>Please <span class=\"grammar-hl\">give your eyes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴식을</span><span class=\"en\"><b><span class=\"grammar-hl\">a break</span>!</b></span></div></div><div class=\"lec-sent-ko\">제발 네 눈에 휴식을 주렴!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Please give your eyes a break!는 앞서 나열한 신체적 불편함에 대한 해결책을 제시하며, 독자에게 눈 건강을 위해 즉시 행동을 멈출 것을 권고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give your eyes a break 5형식(SVOC) 구조(변형): 간접목적어(your eyes)와 직접목적어(a break)를 취하는 4형식 구조이나, 눈이 쉬도록 하는 행위를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 너에게 알려 줄게</span><span class=\"en\"><b>I’ll show you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 쉬는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how to rest</span>.</b></span></div></div><div class=\"lec-sent-ko\">내가 너에게 어떻게 쉬는지 알려 줄게.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I’ll show you how to rest는 앞선 권고에 이어 구체적인 실천 방법을 제시할 것임을 알리며 독자의 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to rest (to부정사): 의문사 + to부정사 구조로, &#39;어떻게 쉬어야 하는지&#39;라는 명사구 역할을 하며 문장에서 목적어 위치에 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">눈을 감고</span><span class=\"en\"><b>Close your eyes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각해</span><span class=\"en\"><b>and <span class=\"grammar-hl\">think about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네가 제일 좋아하는 간식들을</span><span class=\"en\"><b>your favorite snacks.</b></span></div></div><div class=\"lec-sent-ko\">눈을 감고 네가 제일 좋아하는 간식들을 생각해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Close your eyes and think about your favorite snacks는 눈의 피로를 풀 수 있는 실질적이고 즉각적인 행동 지침을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">think about (관용표현): &#39;…에 대해 생각하다&#39;라는 의미의 자동사+전치사 결합입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>밤늦게까지 휴대폰을 사용하는 독자에게 눈의 피로를 경고한다.</li><li>지속적인 화면 시청이 눈을 충혈되게 만들었음을 지적한다.</li><li>눈의 휴식을 위해 구체적인 행동 방침을 제안한다.</li><li>눈을 감고 즐거운 상상을 함으로써 피로를 풀 수 있도록 돕는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Late-night phone usage causes significant eye fatigue, so individuals should intentionally pause to rest their eyes.</div>\n              <div class=\"lec-final-sum-ko\">심야의 스마트폰 사용은 심각한 눈의 피로를 유발하므로, 개인은 의도적으로 눈의 휴식을 취해야 한다.</div></div></div
