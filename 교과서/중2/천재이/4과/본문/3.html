ad\">03깨달음과 감동</div><ul><li>고래의 행동이 자신을 보호하기 위한 구조 활동이었음을 나중에 알게 되었다.</li><li>고래가 생명을 구하려 했다는 사실을 깨달음(realized)</li><li>고래의 이타적 행동(help other sea animals)</li><li>고래의 도움에 대한 놀라움과 감사함(save my life)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">humpback whale</td><td class=\"m\">혹등고래</td></tr><tr><td class=\"w\">underwater</td><td class=\"m\">물속에서, 수중에서</td></tr><tr><td class=\"w\">push</td><td class=\"m\">밀다, 떠밀다</td></tr><tr><td class=\"w\">swim away</td><td class=\"m\">헤엄쳐 달아나다, 멀리 헤엄쳐 가다</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">계속하다, 유지하다</td></tr><tr><td class=\"w\">shout</td><td class=\"m\">외치다, 소리치다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiger shark</td><td class=\"m\">뱀상어</td></tr><tr><td class=\"w\">get on</td><td class=\"m\">~에 타다, 올라타다</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr><tr><td class=\"w\">save one&#39;s life</td><td class=\"m\">목숨을 구하다</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">8월 2일</span><span class=\"en\"><b><span class=\"grammar-hl\">August 2nd</span></b></span></div></div><div class=\"lec-sent-ko\">8월 2일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 도입부로서, 글쓴이가 무엇을 하고 있었는지 구체적인 상황을 제시하며 이어질 사건의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">August 2nd (관용표현): 날짜 표기법. 서수(2nd)를 사용하여 날짜를 나타내며, 명사 앞에 전치사 on과 함께 쓰여 특정 날짜를 지정함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찍고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was filming</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 혹등고래를</span><span class=\"en\"><b>some humpback whales</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b>underwater.</b></span></div></div><div class=\"lec-sent-ko\">나는 물속에서 몇몇 혹등고래를 찍고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 도입부로서, 글쓴이가 무엇을 하고 있었는지 구체적인 상황을 제시하며 이어질 사건의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was filming (과거진행): be동사(was)+현재분사(-ing) 형태. 과거의 특정 시점에 진행 중이던 동작을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">humpback whale</td><td class=\"m\">혹등고래</td></tr><tr><td class=\"w\">underwater</td><td class=\"m\">물속에서, 수중에서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기,</span><span class=\"en\"><b>Suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고래 한 마리가</span><span class=\"en\"><b>one whale</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가까이 와서</span><span class=\"en\"><b><span class=\"grammar-hl\">came close</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀었다 나를</span><span class=\"en\"><b>and pushed me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세게</span><span class=\"en\"><b>hard.</b></span></div></div><div class=\"lec-sent-ko\">갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 평화로운 촬영 상황에서 갑작스러운 돌발 행동으로 전환하며, 독자의 궁금증을 유발하고 사건의 긴장감을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came close (관용표현): 동사 come + 형용사(close) 구조. come이 보어를 취하는 불완전 자동사로 쓰여 &#39;~한 상태로 오다&#39;라는 의미를 형성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">push</td><td class=\"m\">밀다, 떠밀다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헤엄쳐 가려고 노력했다,</span><span class=\"en\"><b><span class=\"grammar-hl\">tried to swim</span> away,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은</span><span class=\"en\"><b>but it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속해서 밀었다 나를</span><span class=\"en\"><b><span class=\"grammar-hl\">kept pushing</span> me</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 밖으로</span><span class=\"en\"><b>out of the water.</b></span></div></div><div class=\"lec-sent-ko\">나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래의 행동이 공격이 아니라 특정한 목적을 가진 반복적인 행위임을 보여주며, 글쓴이가 느끼는 당혹감과 고래의 의도 사이의 간극을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried to swim (to부정사): 동사 try의 목적어로 to부정사(to swim)가 사용된 구조. &#39;시도하다&#39;라는 의미의 try는 미래 지향적인 동작을 목적으로 취할 때 to부정사를 사용함.</div><div class=\"lec-gr-item\">kept pushing (현재분사): 동사 keep의 목적어 자리에 쓰인 -ing 형태. &#39;지속적으로 ~하다&#39;라는 의미를 나타내며, 동작의 연속성을 강조함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">push</td><td class=\"m\">밀다, 떠밀다</td></tr><tr><td class=\"w\">swim away</td><td class=\"m\">헤엄쳐 달아나다, 멀리 헤엄쳐 가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 놀랐다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was so surprised</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 정말 놀랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 예상과 다르게 움직이는 고래의 행동을 겪으며 글쓴이가 느낀 심리적 변화를 표현하며, 다음 문장에서 밝혀질 진실에 대한 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was so surprised (과거분사): be동사(was)+과거분사(surprised) 구조. 감정을 나타내는 분사가 보어로 쓰여 주어의 상태를 설명함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가</span><span class=\"en\"><b>somebody</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소리쳤다</span><span class=\"en\"><b>shouted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배에서,</span><span class=\"en\"><b>from the boat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“뱀상어가</span><span class=\"en\"><b>“A tiger shark</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오고 있다!”</span><span class=\"en\"><b><span class=\"grammar-hl\">is coming</span>!”</b></span></div></div><div class=\"lec-sent-ko\">그때 누군가 배에서 소리쳤다. “뱀상어가 오고 있다!”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래가 왜 글쓴이를 밀어냈는지에 대한 이유가 밝혀지는 대목으로, 앞선 고래의 행동이 생명을 구하기 위한 긴급한 조치였음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is coming (현재진행): be동사(is)+현재분사(-ing) 구조. 말하는 시점에 임박하여 다가오는 동작을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shout</td><td class=\"m\">외치다, 소리치다</td></tr><tr><td class=\"w\">tiger shark</td><td class=\"m\">뱀상어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전하게</span><span class=\"en\"><b>safely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탔다 배에.</span><span class=\"en\"><b><span class=\"grammar-hl\">got on</span> the boat.</b></span></div></div><div class=\"lec-sent-ko\">나는 안전하게 배 위에 탔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래의 도움으로 위기 상황에서 벗어나 안전해졌음을 알리며, 사건이 긍정적으로 마무리되고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got on (관용표현): 동사 get + 전치사 on. &#39;~에 타다&#39;라는 의미의 구동사로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨달았다</span><span class=\"en\"><b><span class=\"grammar-hl\">realized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 고래가</span><span class=\"en\"><b><span class=\"grammar-hl\">that the whale</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">애쓰고 있었다는 것을 나를 구하려고.</span><span class=\"en\"><b><span class=\"grammar-hl\">was trying to save me</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 고래의 행동을 뒤늦게 이해하게 된 시점을 나타내며, 고래의 지능적이고 이타적인 본능을 확인하는 결론부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">realized that the whale was trying to save me (명사절(that절)): 동사 realize의 목적어 역할을 하는 절. that 뒤에 주어+동사가 완전한 형태로 이어짐.</div><div class=\"lec-gr-item\">was trying to save (과거진행): be동사(was)+현재분사(trying) 구조. 과거에 하려던 의도를 나타냄. to부정사(to save)가 try의 목적어로 결합되어 &#39;구하려 노력하는 중이었다&#39;는 의미를 형성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">혹등고래는</span><span class=\"en\"><b>Humpback whales</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">때때로 돕는다</span><span class=\"en\"><b>sometimes help</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 바다 동물들을,</span><span class=\"en\"><b>other sea animals,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는</span><span class=\"en\"><b>but I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전혀 예상하지 못했다</span><span class=\"en\"><b>never <span class=\"grammar-hl\">expected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이</span><span class=\"en\"><b><span class=\"grammar-hl\">them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 생명을 살리리라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to save my life</span>.</b></span></div></div><div class=\"lec-sent-ko\">혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래의 습성에 대한 일반적인 사실과 글쓴이의 개인적인 경험을 연결하며, 예상치 못한 사건을 겪은 것에 대한 경외심과 감사함을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">expected them to save my life 5형식(SVOC) 구조: expect(S) + them(O) + to save(OC) 형태. 목적어인 them(humpback whales)이 to부정사 동작을 하도록 기대한다는 의미로, to부정사가 목적보어로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">humpback whale</td><td class=\"m\">혹등고래</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>혹등고래를 촬영하던 중, 갑자기 고래가 밀치는 바람에 당황했다.</li><li>알고 보니 근처에 뱀상어가 나타나 고래가 글쓴이를 피신시키려던 중이었다.</li><li>고래의 도움으로 무사히 보트에 올라 목숨을 구했다.</li><li>바다 동물의 이타적인 행동에 대한 사실을 알고 있었지만, 직접 겪을 줄은 몰랐던 놀라운 경험이었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A humpback whale pushed a diver out of the water to protect them from a shark, despite the diver&#39;s initial confusion.</div>\n              <div class=\"lec-final-sum-ko\">혹등고래는 다이버의 초기 혼란에도 불구하고 그를 상어로부터 보호하기 위해 물 밖으로 밀어냈다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl"
