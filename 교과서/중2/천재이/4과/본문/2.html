집한 고래의 생태 정보, 특히 노래에 관한 데이터를 기술한다.</li><li>태그를 통해 수년간 고래의 노래(songs) 기록을 확보함</li><li>노래의 지속 시간은 최대 30분에 달함</li><li>수중에서 수천 킬로미터(thousands of kilometers)까지 전달되는 소리</li><li>핵심 키워드: 노래(songs), 기록(recorded)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03연구의 한계와 향후 과제</div><ul><li>아름다운 노래에 비해 아직 밝혀지지 않은 고래의 생태적 비밀을 언급한다.</li><li>고래의 노래가 가진 아름다움(beautiful)에 대한 감탄</li><li>노래의 의미와 기능에 대해 여전히 부족한 정보</li><li>향후 지속적인 연구의 필요성 시사</li><li>핵심 키워드: 미스터리(don&#39;t know much), 고래의 노래(whale songs)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fly</td><td class=\"m\">날리다, 조종하다</td></tr><tr><td class=\"w\">tag</td><td class=\"m\">꼬리표를 붙이다, 위치를 추적하다</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">뒤를 쫓다, 따라가다</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">면밀히, 가까이</td></tr><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be interested in</td><td class=\"m\">~에 관심이 있다</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 녹음하다</td></tr><tr><td class=\"w\">last</td><td class=\"m\">지속되다, 견디다</td></tr><tr><td class=\"w\">up to</td><td class=\"m\">~까지, 최대 ~</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">7월 17일</span><span class=\"en\"><b><span class=\"grammar-hl\">July 17th</span></b></span></div></div><div class=\"lec-sent-ko\">7월 17일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일기의 형식을 빌려 이 글이 작성된 시점을 명시하며, 본격적인 관찰 활동의 시작을 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">July 17th (관용표현): 날짜 표기법으로, 월(July) 다음에 서수(17th)를 사용하여 날짜를 나타내는 명사구 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 드론을 날렸다</span><span class=\"en\"><b>I flew a drone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹등고래에 태그를 달기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to tag</span> humpback whales.</b></span></div></div><div class=\"lec-sent-ko\">오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 날짜에 수행한 구체적인 행동을 제시하며, 관찰 대상인 혹등고래와 이를 위한 최신 기술인 드론의 활용을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to tag (to부정사): 부사적 용법(목적)으로, 드론을 날린 이유(~하기 위해서)를 설명하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tag</td><td class=\"m\">꼬리표를 붙이다, 위치를 추적하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 그들을 가까이 따라갔고</span><span class=\"en\"><b>I <span class=\"grammar-hl\">followed them closely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태그를 조심스럽게 떨어뜨렸다</span><span class=\"en\"><b>and dropped tags carefully</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 등에</span><span class=\"en\"><b>onto their backs.</b></span></div></div><div class=\"lec-sent-ko\">나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 행동을 수행하기 위한 세부 과정을 설명합니다. 고래에게 충격을 주지 않으려는 연구자의 조심스러운 태도가 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">followed them closely 5형식(SVOC) 구조는 아니지만, 주어(I) + 동사(followed) + 목적어(them) + 부사(closely)로 이루어진 3형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tag</td><td class=\"m\">꼬리표를 붙이다, 위치를 추적하다</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">뒤를 쫓다, 따라가다</td></tr><tr><td class=\"w\">closely</td><td class=\"m\">면밀히, 가까이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 많은 정보를 얻는다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">get a lot of information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에 관한</span><span class=\"en\"><b>about them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 태그로부터</span><span class=\"en\"><b>from the tags.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연구자가 왜 고래에게 표지를 부착하는지 그 목적을 밝히며, 이제부터 수집된 정보를 바탕으로 관찰 내용을 서술할 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get a lot of information (관용표현): &#39;a lot of&#39;는 수량 형용사로 뒤의 불가산 명사(information)를 수식하는 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tag</td><td class=\"m\">꼬리표를 붙이다, 위치를 추적하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 특히 관심을 가지고 있다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">am particularly interested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 노래에,</span><span class=\"en\"><b><span class=\"grammar-hl\">in</span> their songs,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 태그들은 그것들을 녹음해 오고 있다</span><span class=\"en\"><b>and the tags <span class=\"grammar-hl\">have recorded</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 년 동안</span><span class=\"en\"><b>for several years.</b></span></div></div><div class=\"lec-sent-ko\">나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수많은 정보 중에서도 글쓴이가 가장 주목하는 구체적인 연구 대상을 좁혀 소개하며, 장기적인 데이터 축적이 이루어졌음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">am particularly interested in (과거분사): be동사(am) + p.p.(interested) + 전치사(in)의 결합으로, 감정 상태를 나타내는 수동 구조입니다. interest는 타동사(interest A: A의 관심을 끌다)인데 목적어가 없어 수동 구조로 쓴 것입니다. 기본구조: interest + O (O의 흥미를 유발하다).</div><div class=\"lec-gr-item\">have recorded (현재완료): 조동사(have) + 과거분사(recorded)의 결합으로, 과거의 어느 시점부터 현재까지 노래를 기록해 온 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tag</td><td class=\"m\">꼬리표를 붙이다, 위치를 추적하다</td></tr><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 녹음하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 노래는 30분까지 지속된다</span><span class=\"en\"><b>Their songs last <span class=\"grammar-hl\">up to</span> 30 minutes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 수천 킬로미터를 이동할 수 있다</span><span class=\"en\"><b>and can travel thousands of kilometers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b>underwater!</b></span></div></div><div class=\"lec-sent-ko\">그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래 노래의 놀라운 특징을 구체적인 수치로 제시하여 대상의 경이로움을 강조하고 독자의 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">up to (관용표현): &#39;~까지(최대치)&#39;라는 의미를 나타내는 전치사구로, 수치(30 minutes)를 강조합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">last</td><td class=\"m\">지속되다, 견디다</td></tr><tr><td class=\"w\">up to</td><td class=\"m\">~까지, 최대 ~</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 노래들은 아름답지만,</span><span class=\"en\"><b>The songs are beautiful,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 여전히 많이 알지 못한다</span><span class=\"en\"><b>but we still <span class=\"grammar-hl\">don’t know much</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">about them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 노래의 아름다움이라는 감상적 측면과 정보의 불충분함이라는 과학적 현실을 대비하며, 연구가 계속되어야 할 필요성을 시사하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t know much about them (관용표현): &#39;much about&#39;은 &#39;대하여 많은 것&#39;이라는 의미로, 부정문에서 지식이나 정보의 양을 나타낼 때 사용합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>연구자는 혹등고래를 연구하기 위해 드론으로 표지를 부착하는 작업을 수행했다.</li><li>표지를 통해 수년 동안 축적된 고래의 노래 데이터를 얻을 수 있었다.</li><li>고래의 노래는 매우 길고 멀리 전달되는 경이로운 특성을 지녔다.</li><li>고래의 노래는 아름답지만, 여전히 과학적으로 밝혀내야 할 미지의 영역이 많다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Researchers utilize drone-based tagging to track humpback whales, while they continue to investigate the nature of their long-distance underwater songs.</div>\n              <div class=\"lec-final-sum-ko\">연구자들은 혹등고래를 추적하기 위해 드론 기반의 태그 부착을 활용하며, 동시에 그들의 장거리 수중 노래의 본질을 지속적으로 조사하고 있다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio":"./2_audio/10.mp3","hl":"grammar"}],[{"audio":"./2_audio/11.mp3","hl":"main"},{"audio":"./2_audio/12.mp3","hl":"meaning"},{"audio":"./2_audio/13.mp3","hl":"grammar"}],[{"audio":"./2_audio/14.mp3","hl":"main"},{"audio":"./2_audio/15.mp3","hl":"meaning"},{"audio":"./2_audio/16.mp3","hl":"grammar"}],[{"audio":"./2_audio/17.mp3","hl":"main"},{"audio":"./2_audio/18.mp3","hl":"meaning"},{"audio":"./2_audio/19.mp3","hl":"grammar"}],[{"audio":"./2_audio/20.mp3","hl":"main"},{"audio":"./2_audio/21.mp3","hl":"meaning"},{"audio":"./2_audio/22.mp3","hl":"grammar"}],[{"audio":"./2_audio/23.mp3","hl":"main"},{"audio":"./2_audio/24.mp3","hl":"meaning"},{"audio":"./2_audio/25.mp3","hl":"grammar"}],[{"audio":"./2_audio/26.mp3","hl":"main"},{"audio":"./2_audio/27.mp3","hl":"meaning"},{"audio":"./2_audio/28.mp3","hl":"grammar"}],[{"audio":"./2_audio/29.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}fun
