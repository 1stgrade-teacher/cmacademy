\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 지문에 등장하는 혹등고래(Humpback Whale)가 가진 생태적 특징을 알면 훨씬 흥미로울 거예요. 혹등고래는 매년 먹이가 풍부한 극지방의 차가운 바다와 번식을 위한 열대 지방의 따뜻한 바다 사이를 수천 킬로미터에 걸쳐 이동(Migration)하는데, 이는 마치 우리가 계절이 바뀔 때 옷을 갈아입거나 집을 옮기는 것과 비슷한 생존 전략이랍니다. 특히 이 과정에서 몸을 수면 위로 완전히 솟구쳐 올리는 브리칭(Breaching)이라는 행동을 하곤 하는데, 이는 단순히 노는 것이 아니라 몸에 붙은 기생충을 털어내거나 무리 내에서 의사소통을 하기 위한 중요한 수단으로 알려져 있어요. 지문에 나오는 쿡 제도처럼 따뜻한 바다는 혹등고래에게 있어 일종의 산후조리원(Calving Ground)과 같아서, 새끼를 낳고 기르기에 최적인 환경을 제공하죠. 이러한 고래들의 이동 경로와 번식 습성을 이해하고 글을 읽는다면, 왜 이들이 머나먼 여정을 거쳐 이곳까지 왔는지 그 경이로움을 더욱 깊이 체감하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구원의 소개</div><ul><li>뉴질랜드 출신의 니카우가 쿡 제도에서 혹등고래 연구 활동을 소개한다.</li><li>저자의 정체성: 뉴질랜드 출신 연구원(Researcher)</li><li>연구 장소: 쿡 제도(Cook Islands)의 고래 연구 센터</li><li>핵심 키워드: 혹등고래(Humpback whales), 연구 일기(Diary)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02혹등고래의 귀환</div><ul><li>남극해에서 긴 여정을 마치고 돌아온 혹등고래의 도착을 알린다.</li><li>이동 경로: 남극해(Southern Ocean)에서 6,500km 이동</li><li>방문 목적: 출산(Give birth)을 위해 따뜻한 곳으로 회귀</li><li>핵심 키워드: 이동(Travel), 돌아온 고래(Back)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03고래와의 조우</div><ul><li>사람에게 우호적인 혹등고래의 역동적인 움직임을 관찰한다.</li><li>고래의 특징: 크고 친근한 거인(Big and friendly giants)</li><li>관찰 내용: 보트 근처에서 놀이와 높은 점프</li><li>핵심 키워드: 물보라(Splashes), 관찰(Watching)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research center</td><td class=\"m\">연구소, 조사 센터</td></tr><tr><td class=\"w\">keep a diary</td><td class=\"m\">일기를 쓰다, 일기를 기록하다</td></tr><tr><td class=\"w\">give birth</td><td class=\"m\">출산하다, 새끼를 낳다</td></tr><tr><td class=\"w\">come close to</td><td class=\"m\">~에 가까이 다가오다, ~에 접근하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for a while</td><td class=\"m\">잠시 동안, 한동안</td></tr><tr><td class=\"w\">all of a sudden</td><td class=\"m\">갑자기, 돌연히</td></tr><tr><td class=\"w\">make a splash</td><td class=\"m\">물보라를 일으키다, (비유적으로) 큰 관심을 끌다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">Kia Orana</span>!</b></span></div></div><div class=\"lec-sent-ko\">안녕하세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뉴질랜드의 인사말을 사용하여 글쓴이가 누구인지 독자에게 소개하며 본격적인 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Kia Orana (관용표현): 뉴질랜드 마오리족 문화권의 인사말로, 상대의 안녕을 기원하는 관용적인 인사말입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 Nikau인데</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Nikau</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴질랜드에서 온 입니다.</span><span class=\"en\"><b>from New Zealand.</b></span></div></div><div class=\"lec-sent-ko\">저는 뉴질랜드에서 온 Nikau입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뉴질랜드의 인사말을 사용하여 글쓴이가 누구인지 독자에게 소개하며 본격적인 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Nikau 주어+동사(S+V) 구조: 주어(I)와 be동사(’m)가 결합하여 자신의 정체성을 나타내는 1형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 일하고 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m working</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고래 연구소에서</span><span class=\"en\"><b>at a whale research center</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쿡 제도에 있는</span><span class=\"en\"><b>in the Cook Islands.</b></span></div></div><div class=\"lec-sent-ko\">저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 자기소개에 이어, 현재 자신이 어떤 환경에서 무엇을 하며 지내고 있는지 구체적인 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m working (현재진행): be동사(’m)+현재분사(working) 형태의 구조로, 현재 진행 중인 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research center</td><td class=\"m\">연구소, 조사 센터</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 생각해요</span><span class=\"en\"><b><span class=\"grammar-hl\">I think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹등고래가</span><span class=\"en\"><b><span class=\"grammar-hl\">humpback whales</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 놀라운 동물이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">are the most amazing animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다에서</span><span class=\"en\"><b>in the ocean.</b></span></div></div><div class=\"lec-sent-ko\">저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 직업적 배경을 바탕으로, 글쓴이가 고래 연구를 하게 된 근본적인 동기이자 고래에 대한 개인적인 경외심을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I think humpback whales are the most amazing animals 5형식(SVOC) 구조와 유사한 목적어절: &#39;I(S) think(V)&#39; 뒤에 문장이 생략된 접속사 that이 이끄는 목적어절이 이어지며, &#39;humpback whales(S) are(V) the most amazing animals(C)&#39;의 2형식 구조를 가집니다.</div><div class=\"lec-gr-item\">amazing (현재분사): animals를 수식하는 형용사적 기능으로, 고래가 가진 상태나 특징을 설명하는 분사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 일기를 써 오고 있는데</span><span class=\"en\"><b>I have kept a diary</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에 대한</span><span class=\"en\"><b>about them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 일과 생각들을 기록하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to record</span> my work and thoughts.</b></span></div></div><div class=\"lec-sent-ko\">저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래에 대한 관심이 일회적인 것이 아니라 지속적인 관찰과 기록으로 이어지고 있음을 밝히며, 이어질 일기 형식의 글을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to record (to부정사): 부사적 용법의 목적을 나타내며, 일기를 쓴 이유를 설명하기 위해 동사 앞에 to를 붙인 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">7월 1일</span><span class=\"en\"><b><span class=\"grammar-hl\">July 1st</span></b></span></div></div><div class=\"lec-sent-ko\">7월 1일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래들이 돌아온 이유를 설명하는데, 혹등고래의 생태적 특성인 번식을 위한 긴 여정을 언급하여 고래의 경이로움을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">July 1st (명사구): 문장에서 날짜를 나타내는 독립적인 명사구 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹등고래들이</span><span class=\"en\"><b>the humpback whales</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돌아왔다!</span><span class=\"en\"><b><span class=\"grammar-hl\">are back</span>!</b></span></div></div><div class=\"lec-sent-ko\">마침내, 혹등고래들이 돌아왔다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간적 배경을 제시하며, 앞서 언급한 연구 대상인 혹등고래를 다시 만난 반가움과 흥분을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are back (be동사+보어): 2형식 구조로, 주어(whales)의 현재 상태(돌아온 상태)를 보어(back)로 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이동하였다</span><span class=\"en\"><b>have traveled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 6,500km를</span><span class=\"en\"><b>about 6,500 km</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남극해로부터</span><span class=\"en\"><b>from the Southern Ocean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새끼를 낳기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to give birth</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래들이 돌아온 이유를 설명하는데, 혹등고래의 생태적 특성인 번식을 위한 긴 여정을 언급하여 고래의 경이로움을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to give birth (to부정사): 부사적 용법의 목적을 나타내며, 고래들이 여행을 온 이유(출산)를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">give birth</td><td class=\"m\">출산하다, 새끼를 낳다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 크고 친근한 거대한 동물들이</span><span class=\"en\"><b>The big and <span class=\"grammar-hl\">friendly</span> giants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 보트에 가까이 왔고</span><span class=\"en\"><b>came close to our boat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀았다</span><span class=\"en\"><b>and played</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠시 동안</span><span class=\"en\"><b>for a while.</b></span></div></div><div class=\"lec-sent-ko\">그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래의 거대한 외형과 인간에게 우호적인 태도를 대비시켜, 글쓴이가 왜 그들을 놀라운 동물이라 생각하는지 눈앞의 장면으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">friendly 형용사: 명사(giants)를 앞에서 수식하며 상태를 서술하는 형용사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for a while</td><td class=\"m\">잠시 동안, 한동안</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기,</span><span class=\"en\"><b>All of a sudden,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높이 뛰어올라</span><span class=\"en\"><b>jumped up high</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대한 물보라를 만들었다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">made</span> huge splashes.</b></span></div></div><div class=\"lec-sent-ko\">갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평화롭게 다가와 놀던 고래가 역동적인 움직임을 보이는 상황으로 전환하며 현장의 생생한 활기를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made 5형식(SVOC) 구조: &#39;they(S) made(V) huge splashes(O)&#39;의 3형식 구조이나, 문맥상 동작의 완료를 나타내는 핵심 동사로 사용되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all of a sudden</td><td class=\"m\">갑자기, 돌연히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고래들을 보는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Watching whales</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절대로 지루해지지 않는다.</span><span class=\"en\"><b>never gets <span class=\"grammar-hl\">boring</span>.</b></span></div></div><div class=\"lec-sent-ko\">고래들을 보는 것은 절대로 지루해지지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고래를 관찰하는 일을 반복해도 늘 새롭고 즐겁다는 글쓴이의 감상을 정리하며, 연구 대상으로서의 고래에 대한 깊은 애정을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Watching whales (동명사): 문장에서 주어 역할을 하는 동명사구로, &#39;고래를 관찰하는 것&#39;이라는 행위를 나타냅니다.</div><div class=\"lec-gr-item\">boring (현재분사): 주어(Watching whales)의 상태를 설명하는 보어로, &#39;지루하게 만드는&#39;이라는 능동적 의미를 지닌 현재분사입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>뉴질랜드 출신의 고래 연구원이 쿡 제도에서 혹등고래를 관찰하며 기록을 남기고 있다.</li><li>7월 1일, 번식을 위해 긴 여정을 마치고 돌아온 혹등고래들을 반갑게 맞이했다.</li><li>고래들의 친근한 접근과 역동적인 움직임을 직접 지켜보며 연구원으로서의 보람과 고래에 대한 깊은 애정을 드러낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Humpback whales have traveled a long distance to give birth, and they display impressive jumping behavior that fascinates the observer.</div>\n              <div class=\"lec-final-sum-ko\">혹등고래는 새끼를 낳기 위해 먼 거리를 이동해 왔으며, 관찰자를 매료시키는 인상적인 도약 행동을 보여준다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio":"./1_audio/26.mp3","hl":"main"},{"audio":"./1_audio/27.mp3","hl":"meaning"},{"audio":"./1_audio/28.mp3","hl":"grammar"}],[{"audio":"./1_audio/29.mp3","hl":"main"},{"audio":"./1_audio/30.mp3","hl":"meaning"},{"audio":"./1_audio/31.mp3","hl":"grammar"}],[{"audio":"./1_audio/32.mp3","hl":"main"},{"audio":"./1_audio/33.mp3","hl":"meaning"},{"audio":"./1_audio/34.mp3","hl":"grammar"}],[{"audio":"./1_audio/35.mp3","hl":"main"},{"audio":"./1_audio/36.mp3","hl":"meaning"},{"audio":"./1_audio/37.mp3","hl":"grammar"}],[{"audio":"./1_audio/3
