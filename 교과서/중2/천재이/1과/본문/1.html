kg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 하이킹(Hiking)의 심리적 효과를 이해하면 훨씬 흥미로울 거예요. 흔히 하이킹은 단순히 산 정상에 도달하는 것이 목적이라고 생각하기 쉽지만, 심리학에서는 이를 &#39;결과 지향적 사고&#39;에서 &#39;과정 중심적 사고&#39;로의 전환이라고 불러요. 마치 인생을 마라톤에 비유하듯, 하이킹 역시 정상이라는 목표보다 걷는 동안 마주하는 자연을 오감으로 느끼는 &#39;마음챙김(Mindfulness)&#39; 과정에 더 큰 의의가 있답니다. 뇌과학적으로도 숲속을 걷는 활동은 스트레스 호르몬인 코르티솔(Cortisol) 수치를 낮추고 인지적 유연성(Cognitive flexibility)을 높여주는 놀라운 효과가 있다고 알려져 있어요. 여러분도 이번 기회에 산을 정복의 대상이 아닌, 일상 속 쉼표를 찍는 힐링 공간으로 바라보는 시각을 가져보시길 바라요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01취미의 제안</div><ul><li>여가 시간에 무엇을 할지 고민하는 사람들에게 새로운 활력을 줄 취미 활동을 제안한다.</li><li>일상에 새로운 변화를 주는 취미(hobbies) 찾기</li><li>자유 시간(free time)의 생산적인 활용</li><li>핵심 키워드: 취미(hobbies)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02등산의 오해</div><ul><li>등산의 목적을 단순히 정상에 오르는 것으로만 생각하는 일반적인 시각을 언급한다.</li><li>정상 도달(reaching the top)에 대한 집착</li><li>등산의 본질적 의미에 대한 회의적 질문</li><li>핵심 키워드: 하이킹(hiking)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03등산의 본질</div><ul><li>등산은 정상 정복이 아닌 과정 자체를 즐기는 활동임을 강조한다.</li><li>과정 그 자체를 즐기는 여정(journey)의 중요성</li><li>자연의 경관(views)과 맑은 공기(fresh air)의 만끽</li><li>핵심 키워드: 자연 탐험(explore nature)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take in</td><td class=\"m\">~을 들이마시다, ~을 이해하다</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐험하다, 탐구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 하루를 빛내세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Light Up</span> Your Days</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 취미들로</span><span class=\"en\"><b>with Special Hobbies</b></span></div></div><div class=\"lec-sent-ko\">특별한 취미들로 여러분의 하루를 빛내세요</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던짐으로써 글의 주제인 &#39;취미 생활&#39;에 대해 자연스럽게 생각해보도록 유도하는 도입부 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Light Up (관용표현): &#39;밝히다/활기를 띠게 하다&#39;라는 의미의 동사구로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 보통 무엇을 하나요</span><span class=\"en\"><b><span class=\"grammar-hl\">What do you usually do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여가 시간에?</span><span class=\"en\"><b>in your free time?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 여가에 보통 무엇을 하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던짐으로써 글의 주제인 &#39;취미 생활&#39;에 대해 자연스럽게 생각해보도록 유도하는 도입부 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What do you usually do (간접의문문): 의문사 What이 문장 앞에 위치하며, 조동사 do와 주어 you, 본동사 do가 결합된 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시도해 보는 것은 어떤가요</span><span class=\"en\"><b>How about <span class=\"grammar-hl\">trying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 흥미로운 취미들을?</span><span class=\"en\"><b>some <span class=\"grammar-hl\">interesting</span> hobbies?</b></span></div></div><div class=\"lec-sent-ko\">흥미로운 취미를 시도해 보는 것은 어떨까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 이어 독자에게 새로운 활동을 제안함으로써 앞으로 소개할 취미 활동들에 대한 관심을 불러일으키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">trying (동명사): 전치사 About의 목적어 역할을 하며 &#39;시도하는 것&#39;이라는 명사적 개념을 나타냄</div><div class=\"lec-gr-item\">interesting (현재분사): &#39;흥미를 유발하는&#39;이라는 동작/상태의 의미로 뒤의 명사 hobbies를 수식</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아래 활동들은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">activities</span> below</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더해 줄 것입니다</span><span class=\"en\"><b>will add</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 무언가를</span><span class=\"en\"><b>something new</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 삶에!</span><span class=\"en\"><b>to your life!</b></span></div></div><div class=\"lec-sent-ko\">아래 활동은 여러분의 삶에 새로운 무언가를 더해 줄 거예요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어질 내용이 단순한 정보 전달을 넘어, 독자의 일상을 더욱 다채롭게 만들 가치가 있는 제안임을 강조하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">activities (현재분사(축약)): 아래 문맥으로 보아 &#39;아래에 언급되는&#39;의 의미로 activities를 수식하는 분사구(that are below)</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하이킹을 가요!</span><span class=\"en\"><b>Let’s <span class=\"grammar-hl\">go hiking</span>!</b></span></div></div><div class=\"lec-sent-ko\">하이킹을 가요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;흥미로운 취미&#39;의 첫 번째 예시로서 구체적인 활동인 하이킹을 제시하며 독자의 행동을 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">go hiking (관용표현): &#39;go + -ing&#39; 구조로 &#39;~하러 가다&#39;라는 의미를 나타냄. 여기서 hiking은 활동을 나타내는 동명사적 성격</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 말합니다,</span><span class=\"en\"><b>Some people say,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;우리는 왜 도달해야 하나요</span><span class=\"en\"><b>“Why do we need <span class=\"grammar-hl\">to get</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정상에?</span><span class=\"en\"><b>to the top?</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 “우리가 왜 정상에 올라가야 하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 하이킹에 대해 가질 수 있는 일반적인 회의론을 먼저 언급하여 독자와 공감대를 형성하는 논리적 전략을 사용합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to get (to부정사): 필요성을 나타내는 need의 목적어 역할을 하는 명사적 용법</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 다시 내려와야 해요</span><span class=\"en\"><b>We <span class=\"grammar-hl\">have to come</span> back down</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어차피.&quot;</span><span class=\"en\"><b>anyway.”</b></span></div></div><div class=\"lec-sent-ko\">어차피 우리는 다시 내려와야 해요.”라고 말합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정상이라는 목적지에 매몰되지 말고 이동하는 과정 그 자체에서 의미를 찾아야 한다는 글쓴이의 핵심적인 관점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have to come (관용표현): 의무를 나타내는 &#39;have to + 동사원형&#39; 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">글쎄요,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산을 하이킹하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">hiking a mountain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 ~에 관한 것이 아닙니다</span><span class=\"en\"><b>is not just about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정상에 도달하는 것에.</span><span class=\"en\"><b><span class=\"grammar-hl\">reaching</span> the top.</b></span></div></div><div class=\"lec-sent-ko\">글쎄요, 등산하는 것은 단순히 정상에 오르는 것만이 아닙니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 회의적인 시각을 받아, 하이킹의 가치가 결과물에만 있지 않음을 밝히며 논지를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hiking a mountain (동명사): 문장의 주어 역할을 하며 &#39;산을 등반하는 것&#39;이라는 행위/활동을 나타냄</div><div class=\"lec-gr-item\">reaching (동명사): 전치사 about의 목적어 역할을 하며 &#39;도달하는 것&#39;이라는 행위를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 또한 ~에 관한 것입니다</span><span class=\"en\"><b>It is also about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여정을 즐기는 것에.</span><span class=\"en\"><b><span class=\"grammar-hl\">enjoying</span> the journey.</b></span></div></div><div class=\"lec-sent-ko\">그것은 여정을 즐기는 것이기도 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정상이라는 목적지에 매몰되지 말고 이동하는 과정 그 자체에서 의미를 찾아야 한다는 글쓴이의 핵심적인 관점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enjoying (동명사): 전치사 about의 목적어 역할을 하며 &#39;즐기는 것&#39;이라는 행위를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀라운 경치를 보세요</span><span class=\"en\"><b>Look at the <span class=\"grammar-hl\">amazing</span> views</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 들이마시세요</span><span class=\"en\"><b>and take in</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신선한 공기를.</span><span class=\"en\"><b>the fresh air.</b></span></div></div><div class=\"lec-sent-ko\">놀라운 경치를 보고 신선한 공기를 마셔 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;여정을 즐긴다&#39;는 앞 문장의 추상적인 조언을 실천할 수 있는 구체적인 행동 지침을 제시하여 독자의 동기부여를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing (현재분사): &#39;놀라움을 주는&#39;이라는 동작의 상태로 views를 수식</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take in</td><td class=\"m\">~을 들이마시다, ~을 이해하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">밖으로 나가 보는 건 어떨까요</span><span class=\"en\"><b><span class=\"grammar-hl\">Why don’t you go out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자연을 탐험하는 건</span><span class=\"en\"><b>and explore nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 당장?</span><span class=\"en\"><b>right now?</b></span></div></div><div class=\"lec-sent-ko\">지금 바로 밖으로 나가서 자연을 탐험하는 건 어떨까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마지막으로서 독자에게 능동적인 행동 변화를 촉구하며 하이킹이라는 취미를 시작하도록 격려하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why don’t you go out (관용표현): &#39;~하는 게 어때?&#39;라는 제안을 나타내는 의문문 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explore</td><td class=\"m\">탐험하다, 탐구하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>여가 시간을 활용해 흥미로운 취미를 갖는 것은 삶에 활력을 준다.</li><li>하이킹은 정상 정복이 목적이 아니라, 오르는 과정에서 즐거움을 찾는 활동이다.</li><li>자연을 누리며 과정의 즐거움을 경험해 볼 것을 권장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Hiking encourages people to step outside to explore nature, and it shifts the focus from reaching the summit to enjoying the journey.</div>\n              <div class=\"lec-final-sum-ko\">등산은 사람들이 자연을 탐험하러 밖으로 나가도록 장려하며, 정상에 도달하는 것에서 여정을 즐기는 것으로 초점을 옮기게 한다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meaning"},{"audio":"./1_audio/10.mp3","hl":"grammar"}],[{"audio":"./1_audio/11.mp3","hl":"main"},{"audio":"./1_audio/12.mp3","hl":"meaning"},{"audio":"./1_audio/13.mp3","hl":"grammar"}],[{"audio":"./1_audio/14.mp3","hl":"main"},{"audio":"./1_audio/15.mp3","hl":"meaning"},{"audio":"./1_audio/16.mp3","hl":"grammar"}],[{"audio":"./1_audio/17.mp3","hl":"main"},{"audio":"./1_audio/18.mp3","hl":"meaning"},{"audio":"./1_audio/19.mp3","hl":"grammar"}],[{"audio":"./1_audio/20.mp3","hl":"main"},{"audio":"./1_audio/21.mp3","hl":"meaning"},{"audio":"./1_audio/22.mp3","hl":"grammar"}],[{"audio":"./1_audio/23.mp3","hl":"main"},{"audio":"./1_audio/24.mp3","hl":"meaning"},{"audio":"./1_audio/25.mp3","hl":"grammar"}],[{"audio
