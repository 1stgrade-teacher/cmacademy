v class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02나눔의 가치</div><ul><li>베이킹의 가장 큰 장점은 만든 결과물을 주변 사람들과 함께 나누는 것입니다.</li><li>베이킹의 하이라이트(highlight)인 나눔의 기쁨</li><li>친구나 가족을 위한 특별한 쿠키 제작</li><li>주변 사람들에게 사랑(love)을 전달하는 경험</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03취미의 긍정적 영향</div><ul><li>일상 속에서 새로운 취미를 시작함으로써 삶에 활력을 불어넣을 수 있습니다.</li><li>다양한 취미(hobbies)에 대한 관심 촉구</li><li>즉각적인 실천을 통한 일상의 변화</li><li>삶을 밝혀주는(light up) 활력 요소로서의 취미</li><li>핵심 키워드: 활력(vitality)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">head to</td><td class=\"m\">~로 향하다, ~로 가다</td></tr><tr><td class=\"w\">be afraid to</td><td class=\"m\">~하기를 두려워하다, ~하기를 꺼리다</td></tr><tr><td class=\"w\">get creative</td><td class=\"m\">창의력을 발휘하다, 창의적이 되다</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr><tr><td class=\"w\">highlight</td><td class=\"m\">가장 중요한 부분, 하이라이트</td></tr><tr><td class=\"w\">light up</td><td class=\"m\">밝게 하다, 즐겁게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Lastly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부엌으로 향하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">head to</span> the kitchen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베이킹을 하기 위해</span><span class=\"en\"><b>for some baking.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, 부엌으로 가서 베이킹을 하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 소개한 여러 취미 활동들에 이어 마지막으로 선택할 수 있는 대안을 제시하며 행동을 촉구하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">head to (관용표현): ‘~로 향하다’라는 뜻의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">head to</td><td class=\"m\">~로 향하다, ~로 가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 만들 수 있어요</span><span class=\"en\"><b>You can <span class=\"grammar-hl\">make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신만의 쿠키를</span><span class=\"en\"><b><span class=\"grammar-hl\">your own cookies</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 자신만의 쿠키를 만들 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적으로 어떤 활동을 할 수 있는지 예시를 들어 베이킹이라는 취미의 매력을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make your own cookies 5형식(SVOC) 구조: &#39;make(동사) + your own cookies(목적어)&#39;의 3형식 구조이나, 본 문맥에서 행위의 주체(You)가 대상(cookies)을 직접 생성하는 목적어 관계를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">조리법을 따르세요,</span><span class=\"en\"><b>Follow the recipes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 두려워하지 마세요</span><span class=\"en\"><b>but <span class=\"grammar-hl\">don’t be afraid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의적이 되는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to get creative</span>.</b></span></div></div><div class=\"lec-sent-ko\">조리법을 따르되, 창의력을 발휘하는 것을 두려워하지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정해진 규칙을 따르는 것과 그 안에서 개성을 찾는 것 사이의 균형을 강조하며 독자의 능동적인 참여를 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t be afraid to get creative (to부정사): &#39;to get creative&#39;는 형용사 afraid의 상태를 설명하는 부사적 용법으로, ‘창의적이 되는 것을’이라는 의미를 보충합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be afraid to</td><td class=\"m\">~하기를 두려워하다, ~하기를 꺼리다</td></tr><tr><td class=\"w\">get creative</td><td class=\"m\">창의력을 발휘하다, 창의적이 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 쿠키를 만들 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you make cookies</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 모양을 시도해 보세요</span><span class=\"en\"><b>try different shapes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이, 꽃, 또는 심지어 여러분이 가장 좋아하는 캐릭터와 같은</span><span class=\"en\"><b>like cats, flowers, or even your favorite characters.</b></span></div></div><div class=\"lec-sent-ko\">여러분이 쿠키를 만들 때, 고양이, 꽃, 심지어 여러분이 매우 좋아하는 캐릭터와 같은 다양한 모양을 시도해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;창의적인 활동&#39;을 실제로 어떻게 구현할 수 있는지 구체적인 방법을 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you make cookies (분사구문(축약절)): 원래 &#39;While you are making cookies&#39;와 같은 시간의 부사절이 쓰일 수 있는 맥락으로, 문장의 배경 상황을 설정합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그저 여러분 자신을 표현하세요!</span><span class=\"en\"><b>Just <span class=\"grammar-hl\">express yourself</span>!</b></span></div></div><div class=\"lec-sent-ko\">그저 여러분 자신을 표현해 보세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 요리라는 행위가 단순한 결과물 창출을 넘어 자신의 개성과 감정을 드러내는 수단임을 강조하며 즐거움을 찾으라고 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">express yourself (관용표현): 주어와 목적어가 같을 때 사용하는 재귀대명사 표현으로 &#39;자기 자신을 표현하다&#39;라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">express</td><td class=\"m\">표현하다, 나타내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 여기에 있습니다</span><span class=\"en\"><b>And here <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">베이킹의 하이라이트가</span><span class=\"en\"><b>the highlight of baking.</b></span></div></div><div class=\"lec-sent-ko\">그리고 여기에 베이킹의 하이라이트가 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 베이킹이 주는 여러 즐거움 중 가장 의미 있는 가치를 소개하기 위해 화제를 환기하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: &#39;here(부사) + is(동사) + the highlight(주어)&#39;로 이루어진 도치 구문입니다. 장소를 나타내는 부사구가 문두에 오면서 주어와 동사가 위치를 바꾸었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">highlight</td><td class=\"m\">가장 중요한 부분, 하이라이트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분에게 즐거움을 줍니다</span><span class=\"en\"><b>gives you <span class=\"grammar-hl\">the joy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나눔의</span><span class=\"en\"><b><span class=\"grammar-hl\">of sharing</span>.</b></span></div></div><div class= rammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will love (미래시제): 조동사 will을 사용하여 미래의 동작이나 상태를 표현합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 생각하나요</span><span class=\"en\"><b><span class=\"grammar-hl\">do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 취미들에 대해서</span><span class=\"en\"><b><span class=\"grammar-hl\">about these hobbies?</span></b></span></div></div><div class=\"lec-sent-ko\">여러분은 이 취미들에 대해 어떻게 생각하나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체에서 소개한 여러 가지 활동들을 다시 한번 상기시키며 독자가 스스로 취미의 가치를 생각해보게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What do you think about these hobbies? (간접의문문): 의문사 &#39;What&#39;이 포함된 문장으로, 상대방의 의견을 묻는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시도해 보는 것은 어떤가요</span><span class=\"en\"><b><span class=\"grammar-hl\">Why don’t you try</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 중 하나를</span><span class=\"en\"><b>one of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로</span><span class=\"en\"><b>right away?</b></span></div></div><div class=\"lec-sent-ko\">그것들 중 하나를 바로 시도해 보는 것은 어떤가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 읽는 것에 그치지 않고 실제 삶에 적용하도록 강력하게 제안하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why don’t you try (관용표현): &#39;Why don&#39;t you + 동사원형&#39;은 상대방에게 제안하거나 권유할 때 쓰는 관용적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빛나게 해 줄 거예요</span><span class=\"en\"><b>will <span class=\"grammar-hl\">light up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 날들을</span><span class=\"en\"><b>your days.</b></span></div></div><div class=\"lec-sent-ko\">그것은 여러분의 날들을 빛나게 해 줄 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 취미 생활을 시작함으로써 얻게 될 변화를 밝고 긍정적인 이미지로 표현하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">light up (관용표현): &#39;환하게 하다/밝히다&#39;라는 뜻의 구동사(숙어)입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">light up</td><td class=\"m\">밝게 하다, 즐겁게 하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>요리는 단순히 음식을 만드는 것을 넘어 창의성을 발휘하고 자신을 표현하는 즐거운 취미이다.</li><li>베이킹의 진정한 가치는 정성껏 만든 음식을 주변 사람들과 나누는 데 있다.</li><li>다양한 취미 활동은 독자의 일상을 더욱 활기차고 행복하게 만들어 줄 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Baking encourages creative self-expression through unique shapes, and it fosters social connection by sharing treats with loved ones.</div>\n              <div class=\"lec-final-sum-ko\">베이킹은 독창적인 모양을 통해 창의적인 자기표현을 장려하며, 사랑하는 사람들과 간식을 나눔으로써 사회적 유대감을 형성한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_au
