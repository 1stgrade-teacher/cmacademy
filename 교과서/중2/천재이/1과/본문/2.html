iv class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a break</td><td class=\"m\">휴식을 취하다, 한숨 돌리다</td></tr><tr><td class=\"w\">put together</td><td class=\"m\">조립하다, 구성하다, 합치다</td></tr><tr><td class=\"w\">forget about</td><td class=\"m\">~에 대해 잊다, ~을 개의치 않다</td></tr><tr><td class=\"w\">worry</td><td class=\"m\">걱정, 고민</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clear</td><td class=\"m\">(마음, 머리를) 맑게 하다, 정리하다</td></tr><tr><td class=\"w\">guess what</td><td class=\"m\">있잖아, 놀라지 마</td></tr><tr><td class=\"w\">feel great</td><td class=\"m\">기분이 아주 좋다, 상쾌하다</td></tr><tr><td class=\"w\">sense of success</td><td class=\"m\">성취감, 성공한 기분</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴식을 취하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">take a break</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼즐로</span><span class=\"en\"><b>with puzzles.</b></span></div></div><div class=\"lec-sent-ko\">이제 퍼즐로 휴식을 취하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 바쁜 일상에서 벗어나 잠시 쉬어가는 시간을 갖자고 제안하며, 퍼즐이라는 구체적인 활동으로 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take a break (관용표현): &#39;휴식을 취하다&#39;라는 의미의 관용구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a break</td><td class=\"m\">휴식을 취하다, 한숨 돌리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">조심스럽게</span><span class=\"en\"><b>Carefully</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조각들을 맞추세요,</span><span class=\"en\"><b><span class=\"grammar-hl\">put the pieces together</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 여러분은 걱정을 잊어버릴 거예요.</span><span class=\"en\"><b>and you will forget about your worries.</b></span></div></div><div class=\"lec-sent-ko\">조심스럽게 조각들을 맞추세요, 그러면 여러분은 걱정을 잊어버릴 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퍼즐 조각을 맞추는 집중력이 어떻게 심리적 효과로 이어지는지 그 과정과 결과를 연결하여 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">put the pieces together (관용표현): &#39;조각들을 맞추다/조립하다&#39;를 의미하는 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">forget about</td><td class=\"m\">~에 대해 잊다, ~을 개의치 않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퍼즐을 하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Doing puzzles</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋다</span><span class=\"en\"><b>is good</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 정신을 맑게 하는 데</span><span class=\"en\"><b>for <span class=\"grammar-hl\">clearing</span> your mind.</b></span></div></div><div class=\"lec-sent-ko\">퍼즐을 맞추는 것은 정신을 맑게 하는 데 좋아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 걱정을 잊게 되는 구체적인 이유가 바로 복잡한 생각을 정리하고 머릿속을 맑게 해주기 때문임을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Doing puzzles (동명사): 문장에서 주어 역할을 하는 -ing 형태입니다. &#39;퍼즐을 맞추는 것은&#39;으로 해석합니다.</div><div class=\"lec-gr-item\">clearing (동명사): 전치사 for의 목적어 역할을 하는 -ing 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clear</td><td class=\"m\">(마음, 머리를) 맑게 하다, 정리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 그거 아세요?</span><span class=\"en\"><b>And <span class=\"grammar-hl\">guess what</span>?</b></span></div></div><div class=\"lec-sent-ko\">그리고 그거 아세요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 호기심을 자극하여 다음에 이어질 긍정적인 경험에 대해 더 집중하게 만드는 대화적 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">guess what (관용표현): 상대방의 주의를 환기시키거나 새로운 소식을 전할 때 쓰는 관용적 구문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guess what</td><td class=\"m\">있잖아, 놀라지 마</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 마지막 조각을 맞출 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you put in the last piece</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 기분이 아주 좋을 것입니다</span><span class=\"en\"><b>you will feel great.</b></span></div></div><div class=\"lec-sent-ko\">마지막 조각을 맞출 때, 여러분은 기분이 아주 좋을 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퍼즐을 완성하는 행위가 주는 즉각적인 심리적 보상을 강조하여 독자의 참여를 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you put in the last piece (관계부사): 문장에서 시간을 나타내는 부사절을 이끕니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feel great</td><td class=\"m\">기분이 아주 좋다, 상쾌하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분에게 줄 거예요</span><span class=\"en\"><b>will <span class=\"grammar-hl\">give you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성취감을</span><span class=\"en\"><b><span class=\"grammar-hl\">a sense of success</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 여러분에게 성취감을 줄 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완성의 순간 느끼는 기분이 단순한 즐거움을 넘어 스스로 성취감을 경험하는 상태임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give you a sense of success 5형식(SVOC) 구조와 유사한 4형식 구조: give(수여동사) + I.O(you) + D.O(a sense of success) 형태로, 당신에게 성공의 감각을 제공한다는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense of success</td><td class=\"m\">성취감, 성공한 기분</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퍼즐을 잡고</span><span class=\"en\"><b><span class=\"grammar-hl\">Grab a puzzle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐기세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">and enjoy</span>!</b></span></div></div><div class=\"lec-sent-ko\">퍼즐을 잡고 즐겨 보세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마지막으로서 지금까지 설명한 퍼즐의 장점을 바탕으로 독자가 직접 행동에 나설 것을 강력하게 권유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Grab a puzzle and enjoy (관용표현): &#39;퍼즐을 잡아라(시작해라) 그리고 즐겨라&#39;라는 명령문 형태의 격려 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>바쁜 일상에서 벗어나 퍼즐을 맞추면 걱정을 잊고 마음을 비울 수 있다.</li><li>퍼즐 조각을 맞추는 집중 과정은 생각을 정리하는 데 도움을 준다.</li><li>완성의 마지막 순간은 성취감을 느끼게 하며, 이는 기분 좋은 경험을 제공한다.</li><li>그러므로 휴식을 위해 퍼즐을 시작해보기를 권한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Solving puzzles helps relieve worries and clear the mind, while also providing a satisfying sense of success upon completion.</div>\n              <div class=\"lec-final-sum-ko\">퍼즐을 푸는 것은 고민을 덜고 마음을 맑게 해주며, 완성했을 때 만족스러운 성취감을 제공한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio":"./2_audio/10.mp3","hl":"grammar"}],[{"audio":"./2_audio/11.mp3","hl":"main"},{"audio":"./2_audio/12.mp3","hl":"meaning"},{"audio":"./2_audio/13.mp3","hl":"grammar"}],[{"audio":"./2_audio/14.mp3","hl":"main"},{"audio":"./2_audio/15.mp3","hl":"meaning"},{"audio":"./2_audio/16.mp3","hl":"grammar"}],[{"audio":"./2_audio/17.mp3","hl":"main"},{"audio":"./2_audio/18.mp3","hl":"meaning"},{"audio":"./2_audio/19.mp3","hl":"grammar"}],[{"audio":"./2_audio/20.mp3","hl":"main"},{"audio":"./2_audio/21.mp3","hl":"meaning"},{"audio":"./2_audio/22.mp3","hl":"grammar"}],[{"audio":"./2_audio/23.mp3","hl":"main"},{"audio":"./2_audio/24.mp3","hl":"meaning"},{"audio":"./2_audio/25.mp3","hl":"grammar"}],[{"audio":"./2_audio/26.mp3","hl":"main"},{"audio":"./2_audio/27.mp3","hl":"meaning"},{"aud
