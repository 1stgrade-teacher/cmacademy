을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01셀카와 자화상의 공통점</div><ul><li>셀카와 자화상은 모두 특정 시점의 자신의 모습을 기록하고 추억한다는 점에서 유사합니다.</li><li>과거의 나를 기억하게 해주는 일기(diary) 같은 역할</li><li>행복했던 순간의 표정(expressions)을 포착하여 당시의 감정을 되살림</li><li>핵심 키워드: 자화상(self-portrait), 셀카(selfie)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02화가들의 자화상 기록</div><ul><li>화가들은 자신의 인생 여러 시기를 기록하기 위해 자화상을 제작했습니다.</li><li>렘브란트(Rembrandt)는 평생 90여 점의 자화상을 그림</li><li>젊은 시절부터 노년까지 자신의 변화하는 모습을 남김</li><li>핵심 키워드: 기록(record), 변화(change)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03셀카와 자화상의 차이점</div><ul><li>제작 방식과 목적에서 셀카와 자화상은 분명한 차이를 보입니다.</li><li>셀카는 카메라로 즉시 촬영(quickly)이 가능하여 편리함</li><li>자화상은 완성하기까지 오랜 시간이 걸리며 화가의 독특한 화풍(painting style)이 담김</li><li>핵심 키워드: 화풍(painting style), 차이점(differences)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04자화상에 담긴 화가의 개성</div><ul><li>자화상은 단순히 모습을 담는 것을 넘어 화가만의 고유한 예술적 특징을 보여줍니다.</li><li>빈센트 반 고흐(Vincent van Gogh)는 모델 비용을 아끼기 위해 자화상을 그림</li><li>밝은 색상과 두꺼운 붓터치를 사용하는 자신만의 독창적인 방식 확립</li><li>핵심 키워드: 독창적인(unique), 예술적 스타일(style)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capture</td><td class=\"m\">(사진 등을) 찍다, 포착하다</td></tr><tr><td class=\"w\">self-portrait</td><td class=\"m\">자화상</td></tr><tr><td class=\"w\">similar</td><td class=\"m\">비슷한</td></tr><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr><tr><td class=\"w\">expression</td><td class=\"m\">표정</td></tr><tr><td class=\"w\">bring back</td><td class=\"m\">(기억·감정을) 되살리다, 불러일으키다</td></tr><tr><td class=\"w\">joyful</td><td class=\"m\">기쁜, 즐거운</td></tr><tr><td class=\"w\">similarly</td><td class=\"m\">마찬가지로, 비슷하게</td></tr><tr><td class=\"w\">youth</td><td class=\"m\">젊음, 청년기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">old age</td><td class=\"m\">노년</td></tr><tr><td class=\"w\">difference</td><td class=\"m\">차이(점)</td></tr><tr><td class=\"w\">personal</td><td class=\"m\">개인적인, 독자적인</td></tr><tr><td class=\"w\">style</td><td class=\"m\">방식, 양식</td></tr><tr><td class=\"w\">model</td><td class=\"m\">모델 (화가의 피사체)</td></tr><tr><td class=\"w\">enough</td><td class=\"m\">충분한</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은, 선명한</td></tr><tr><td class=\"w\">apply</td><td class=\"m\">(물감 등을) 바르다</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 즐긴다</span><span class=\"en\"><b>people enjoy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셀피 찍는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">taking</span> selfies.</b></span></div></div><div class=\"lec-sent-ko\">오늘날, 사람들은 셀피 찍는 것을 즐깁니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대인들이 일상에서 사진을 찍어 자신의 모습을 남기는 것이 대중적인 문화가 되었음을 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking (동명사): enjoy라는 일반동사의 목적어 역할을 하며 &#39;셀카를 찍는 것&#39;이라는 행위를 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 포착할 수 있다</span><span class=\"en\"><b>We can <span class=\"grammar-hl\">capture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 순간들을</span><span class=\"en\"><b>special moments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들로</span><span class=\"en\"><b>with them.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그것들로 특별한 순간을 포착할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;셀카&#39;의 기능을 설명하며, 왜 사람들이 이를 즐기는지에 대한 이유를 제시합니다. 여기서 capture는 사전적으로 &#39;포획하다, 붙잡다&#39;인데, 여기서는 순간의 이미지를 사진 속에 &#39;담아내다&#39;라는 의미로 쓰였습니다. 단순히 촬영하는 것을 넘어 그 소중한 시간을 박제한다는 어감을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">capture (조동사(can)+동사원형): 조동사 can 뒤에는 동사의 원형이 오며 가능의 의미를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capture</td><td class=\"m\">(사진 등을) 찍다, 포착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오래전,</span><span class=\"en\"><b>Long ago,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 포착했다</span><span class=\"en\"><b>people captured</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신의 모습을</span><span class=\"en\"><b>their own image</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 방식으로</span><span class=\"en\"><b>in a <span class=\"grammar-hl\">different</span> way.</b></span></div></div><div class=\"lec-sent-ko\">오래전, 사람들은 다른 방식으로 그들 자신의 모습을 포착했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름을 과거로 돌려, 현대의 &#39;셀카&#39;와 연결될 수 있는 과거의 예술 형태를 소개하려는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">different 형용사: 명사 way를 수식하며 &#39;다른&#39;이라는 성질을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capture</td><td class=\"m\">(사진 등을) 찍다, 포착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 그렸다</span><span class=\"en\"><b>They painted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 자신에 대한 그림을</span><span class=\"en\"><b>pictures of <span class=\"grammar-hl\">themselves</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그들 자신의 그림을 그렸습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;다른 방식&#39;이 무엇인지 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">themselves (재귀대명사): 주어(They)와 목적어(그들 자신)가 동일인물일 때 사용하는 재귀용법.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 그림들은</span><span class=\"en\"><b>These pictures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자화상이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> self-portraits.</b></span></div></div><div class=\"lec-sent-ko\">이 그림들이 자화상입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거에 사람들이 자신의 모습을 남기던 방식이 &#39;자화상&#39;임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(These pictures)와 보어(self-portraits)를 연결하는 동사로, 주어의 상태나 정체를 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">self-portrait</td><td class=\"m\">자화상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">셀피와 자화상은</span><span class=\"en\"><b>Selfies and self-portraits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비슷하다</span><span class=\"en\"><b>are <span class=\"grammar-hl\">similar</span>.</b></span></div></div><div class=\"lec-sent-ko\">셀피와 자화상은 비슷합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주제인 두 대상(셀카, 자화상) 사이의 공통점을 다룰 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">similar 형용사 보어: 2형식 문장에서 주어의 성질을 설명하는 주격보어 역할.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">self-portrait</td><td class=\"m\">자화상</td></tr><tr><td class=\"w\">similar</td><td class=\"m\">비슷한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">둘 다 보여 준다</span><span class=\"en\"><b>Both show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 모습을</span><span class=\"en\"><b>our image</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 시간에</span><span class=\"en\"><b><span class=\"grammar-hl\">at a certain time</span>.</b></span></div></div><div class=\"lec-sent-ko\">둘 다 특정한 시간의 우리 모습을 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장의 근거로, 두 가지 모두 과거의 한 지점을 기록한다는 본질적인 기능을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at a certain time (전치사구): 명사 image의 구체적인 상황을 부연 설명하는 부사구 역할.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">certain</td><td class=\"m\">특정한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것들을 볼 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When we look at them</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 기억할 수 있다</span><span class=\"en\"><b>we can <span class=\"grammar-hl\">remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신을</span><span class=\"en\"><b>ourselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그때의</span><span class=\"en\"><b>from that time.</b></span></div></div><div class=\"lec-sent-ko\">우리가 그것들을 볼 때, 우리는 그때의 우리 자신을 기억할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사진과 그림이 가진 &#39;기록물&#39;로서의 역할을 강조하며 7번 문장을 보충합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When we look at them (분사구문(절)): when 접속사를 포함한 시간의 부사절이며, 뒷절의 주어(we)와 일치함.</div><div class=\"lec-gr-item\">remember (to부정사): 문장 내에서 목적을 나타내는 부사적 용법으로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 이다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일기와 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">like</span> a diary.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 일기와 같습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 셀카와 자화상을 &#39;일기&#39;에 비유했습니다. diary는 기록의 도구라는 사전적 의미를 넘어, 내 삶의 흐름을 보여주는 개인적인 기록물이라는 의미를 강조하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are like (관용표현): be like(~와 같다) 구조로, 주어의 비유적 특성을 서술함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 29</div>\n        <div data-hl=\"main\"><div class= o\">문장 28 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 표현할 수 있다</span><span class=\"en\"><b>We can express</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신을</span><span class=\"en\"><b><span class=\"grammar-hl\">ourselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셀피와 자화상으로</span><span class=\"en\"><b>with selfies and self-portraits.</b></span></div></div><div class=\"lec-sent-ko\">우리는 셀피와 자화상으로 우리 자신을 표현할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 다시 정리하며 독자에게 의미를 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ourselves (재귀대명사): 주어(We)와 목적어(ourselves)가 동일할 때 사용하는 재귀용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">self-portrait</td><td class=\"m\">자화상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 29 / 29</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 원하나요</span><span class=\"en\"><b>Do you want</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시도하기를?</span><span class=\"en\"><b><span class=\"grammar-hl\">to try</span>?</b></span></div></div><div class=\"lec-sent-ko\">한번 해 보실래요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 참여를 유도하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to try (to부정사): 동사 want의 목적어 자리에 위치한 명사적 용법.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>셀카와 자화상은 자신의 모습을 특정 시점에 남겨 기록한다는 점에서 공통점이 있다.</li><li>과거 사람들은 자화상을 통해 자신의 인생을 기록했고, 오늘날 우리는 셀카를 통해 행복한 순간을 남긴다.</li><li>그러나 셀카는 쉽고 간편한 반면, 자화상은 오랜 시간이 걸리고 화가 개인의 예술적 스타일이 담긴다는 차이가 있다.</li><li>결국 두 방식 모두 우리 자신을 표현하고 기억하는 중요한 수단이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Selfies and self-portraits both serve to preserve personal memories, but they differ in the time required and the artistic style expressed.</div>\n              <div class=\"lec-final-sum-ko\">셀카와 자화상은 둘 다 개인적인 추억을 보존하는 역할을 하지만, 소요되는 시간과 표현되는 예술적 스타일 면에서 차이가 있다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"audio":"./full_audio/9.mp3","hl":"main"},{"audio":"./full_audio/10.mp3","hl":"meaning"},{"audio":"./full_audio/11.mp3","hl":"grammar"}],[{"audio":"./full_audio/12.mp3","hl":"main"},{"audio":"./full_audio/13.mp3","hl":"meaning"},{"audio":"./full_audio/14.mp3","hl":"grammar"}],[{"audio":"./full_audio/15.mp3","hl":"main"},{"audio":"./full_audio/16.mp3","hl":"meaning"},{"audio":"./full_audio/17.mp3","hl":"grammar"}],[{"audio":"./full_audio/18.mp3","hl":"main"},{"audio":"./full_audio/19.mp3","hl":"meaning"},{"audio":"./full_audio/20.mp3","hl":"grammar"}],[{"audio":"./full_audio/21.mp3","hl":"main"},{"audio":"./full_audio/22.mp3","hl":"meaning"},{"audio":"./full_audio/23.mp3","hl":"grammar"}],[{"audio":"./full_audio/24.mp3","hl":"main"},{"audio":"./full_audio/25.mp3","hl":"meaning"},{"audio":"./full_audio/26.mp3","hl":"grammar"}],[{"audio":"./full_audio/27.mp3","hl":"main"},{"audio":"./full_audio/28.mp3","hl":"meaning"},{"audio":"./full_audio/29.mp3","hl":"grammar"}],[{"audio":"./full_audio/30.mp3","hl":"main"},{"audio":"./full_audio/31.mp3
