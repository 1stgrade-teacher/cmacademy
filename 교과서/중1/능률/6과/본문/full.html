ly\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">한글날(Hangeul Day)은 세종대왕이 훈민정음(Hunminjeongeum), 즉 &#39;백성을 가르치는 올바른 소리&#39;를 창제하고 반포한 것을 기념하는 국가 기념일이에요. 한글은 세계에서 유일하게 창제 원리와 만든 이가 명확히 기록된 과학적인 문자 체계로, 자음과 모음을 조합하여 소리 나는 대로 글자를 만들 수 있는 독창적인 구조를 가지고 있죠. 과거에는 한자가 어려워 글을 읽지 못하던 백성들을 위해 세종대왕이 애민 정신(Love for the people)을 바탕으로 배우기 쉬운 글자를 만드셨는데, 오늘날에는 한류 문화와 함께 세계적으로 그 우수성을 인정받고 있어요. 여러분도 잘 알고 있듯, 언어는 단순히 소통의 도구를 넘어 그 나라의 역사와 정신을 담고 있는 그릇과도 같으니, 이번 기회에 우리 글자의 소중함을 다시 한번 생각해보면 좋겠네요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01한글날 축제 현장</div><ul><li>기자는 한글날을 맞아 열린 한글 축제 현장에서 한글을 사랑하는 세 사람을 인터뷰한다.</li><li>10월 9일 한글날(Hangeul Day)을 기념하는 축제 현장</li><li>태국, 스위스, 캐나다 출신의 다양한 인터뷰 대상자</li><li>핵심 키워드: 한글날(Hangeul Day), 축제(festival)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02한글을 좋아하는 이유</div><ul><li>인터뷰 대상자들은 저마다의 이유로 한글에 대해 깊은 애정과 관심을 표현한다.</li><li>학습의 용이성(easy to learn): 24개의 글자만 배우면 모든 단어를 읽을 수 있음</li><li>글자의 조형미(unique and beautiful shapes): 글자의 모양에서 예술적 가치를 느낌</li><li>역사적 가치(amazing history): 세종대왕의 백성을 향한 애민 정신(King Sejong)</li><li>핵심 키워드: 학습(learning), 모양(shapes), 역사(history)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03한글을 배우게 된 계기</div><ul><li>학습자들은 개인적인 관심사와 흥미를 바탕으로 자연스럽게 한글을 접하게 되었다.</li><li>K-팝(K-pop) 노래를 따라 부르고 싶은 열망이 학습의 동기가 됨</li><li>좋아하는 노래를 부르기 위해 스스로 한글 공부를 시작함</li><li>핵심 키워드: 동기(motivation), K-팝(K-pop)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한</td></tr><tr><td class=\"w\">alphabet</td><td class=\"m\">문자, 알파벳</td></tr><tr><td class=\"w\">festival</td><td class=\"m\">축제</td></tr><tr><td class=\"w\">activity</td><td class=\"m\">활동</td></tr><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 들뜬</td></tr><tr><td class=\"w\">interview</td><td class=\"m\">인터뷰하다</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">모양</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unique</td><td class=\"m\">독특한</td></tr><tr><td class=\"w\">soldier</td><td class=\"m\">군인</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr><tr><td class=\"w\">history</td><td class=\"m\">역사</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운</td></tr><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들다</td></tr><tr><td class=\"w\">be a big fan of</td><td class=\"m\">~의 열렬한 팬이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한글날 기자:</span><span class=\"en\"><b>Happy Hangeul Day Reporter:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘은 10월 9일인데,</span><span class=\"en\"><b>Today is October 9,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 날인</span><span class=\"en\"><b><span class=\"grammar-hl\">a special day</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글을 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for Hangeul,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 알파벳을.</span><span class=\"en\"><b><span class=\"grammar-hl\">the Korean alphabet</span>.</b></span></div></div><div class=\"lec-sent-ko\">(한글날 기자: 오늘은 한글, 즉 한국의 알파벳을 위한 특별한 날인 10월 9일입니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주제인 &#39;한글날&#39;을 언급하며 독자들의 관심을 유도하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a special day for Hangeul, the Korean alphabet (동격): 콤마(,)를 사용하여 앞의 명사구(a special day for Hangeul)와 뒤의 명사구(the Korean alphabet)가 같은 대상임을 설명하는 동격 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special</td><td class=\"m\">특별한</td></tr><tr><td class=\"w\">alphabet</td><td class=\"m\">문자, 알파벳</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 한글 축제에 와 있으며</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m at a Hangeul festival now</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 지금 한글 축제에 와 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기자가 현재 인터뷰를 진행하고 있는 장소적 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m at a Hangeul festival now 기본 문장 구조: 주어(I) + be동사(’m) + 장소 부사구(at a Hangeul festival)로 이루어진 1형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">festival</td><td class=\"m\">축제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 즐기고 있는데</span><span class=\"en\"><b>People <span class=\"grammar-hl\">are enjoying</span> fun activities here.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재미있는 활동들을</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기서.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">사람들은 이곳에서 재미있는 활동들을 즐기고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축제 현장의 활기찬 분위기를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are enjoying (현재진행): be동사(are) + 현재분사(enjoying)가 결합하여 현재 동작이 진행 중임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 ~해 보이며</span><span class=\"en\"><b>They look <span class=\"grammar-hl\">happy and excited</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행복하고 들떠.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그들은 행복하고 신나 보입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축제에 참여한 사람들의 감정 상태를 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">happy and excited 형용사 보어: 주어(They)의 상태를 설명하는 주격 보어로, 형용사가 나열된 2형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 들뜬</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 인터뷰할 예정인데</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m going to interview</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 명의 한글 애호가를.</span><span class=\"en\"><b>three Hangeul lovers.</b></span></div></div><div class=\"lec-sent-ko\">저는 세 명의 한글 애호가를 인터뷰할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 나올 인터뷰 대상자들을 소개하며 글의 구조를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m going to interview (to부정사): be going to + 동사원형 구조에서 미래의 계획을 나타내는 to부정사의 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">interview</td><td class=\"m\">인터뷰하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뿌엥, 13세, 학생, 태국</span><span class=\"en\"><b><span class=\"grammar-hl\">Pueng, 13, student, Thailand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안나, 27세, 디자이너, 스위스</span><span class=\"en\"><b>Anna, 27, designer, Switzerland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">윌리엄, 51세, 교수, 캐나다</span><span class=\"en\"><b>William, 51, professor, Canada</b></span></div></div><div class=\"lec-sent-ko\">(뿌엥, 13세, 학생, 태국 / 안나, 27세, 디자이너, 스위스 / 윌리엄, 51세, 교수, 캐나다)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인터뷰할 세 사람의 이름, 나이, 직업, 출신 국가를 간략히 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Pueng, 13, student, Thailand (동격): 명사(Pueng)와 뒤따르는 정보(나이, 직업, 국가)를 나열하여 부연 설명하는 동격 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기자:</span><span class=\"en\"><b>Reporter:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기에 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">Here is my first question</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 첫 번째 질문이.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">기자: 저의 첫 번째 질문입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한글날이 어떤 날인지 날짜와 함께 설명하며 현장 보도의 시작을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here is my first question (도치): 장소 부사인 &#39;Here&#39;가 문두로 나오면서 주어(my first question)와 동사(is)의 순서가 바뀐 도치 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜 좋아하나요</span><span class=\"en\"><b>Why <span class=\"grammar-hl\">do you like</span> Hangeul?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여러분은 왜 한글을 좋아하시나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인터뷰 대상자들에게 한글에 대한 관심을 묻는 핵심 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do you like (의문문): 일반동사(like)의 의문문을 만들기 위해 주어 앞에 조동사(do)를 배치한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뿌엥:</span><span class=\"en\"><b>Pueng:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 한글을 좋아하는데</span><span class=\"en\"><b>I like Hangeul</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우기 쉽기 때문에.</span><span class=\"en\"><b>because it is easy <span class=\"grammar-hl\">to learn</span>.</b></span></div></div><div class=\"lec-sent-ko\">Pueng: 저는 한글이 배우기 쉽기 때문에 그것을 좋아해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 픙이 한글을 좋아하는 첫 번째 이유를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to learn (to부정사): 형용사(easy)의 의미를 보충해 주는 to부정사의 부사적 용법(형용사 수식)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 배웠고</span><span class=\"en\"><b>I learned</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글의 24글자를</span><span class=\"en\"><b>the 24 letters of Hangeul,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제 읽을 수 있는데</span><span class=\"en\"><b>and <span class=\"grammar-hl\">I am able to read</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 한국어 단어든.</span><span class=\"en\"><b>any Korean word now.</b></span></div></div><div class=\"lec-sent-ko\">저는 한글의 24개 글자를 배웠고, 이제 어떤 한글 단어든 읽을 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 배우기 쉽다는 근거를 자신의 경험으로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am able to read (관용표현): be able to + V는 &#39;~할 수 있다&#39;라는 능력을 나타내는 관용 표현으로, to부정사를 포함하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안나:</span><span class=\"en\"><b>Anna:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글의 모양은</span><span class=\"en\"><b>The shapes of Hangeul</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독특하고 아름다워 보인다.</span><span class=\"en\"><b><span class=\"grammar-hl\">look unique and beautiful</span>.</b></span></div></div><div class=\"lec-sent-ko\">Anna: 한글의 모양은 독특하고 아름다워 보여요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 안나가 한글을 좋아하는 심미적인 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look unique and beautiful 2형식 구조: 감각동사(look) 뒤에 주어의 상태를 설명하는 형용사 보어(unique, beautiful)가 온 2형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shape</td><td class=\"m\">모양</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 좋아하는데</span><span class=\"en\"><b>I like <span class=\"grammar-hl\">the Korean word for Switzerland</span>, “스위스[seu-wi-seu].</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스위스를 뜻하는 한국어 단어를</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">“스위스”를.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 스위스를 나타내는 한글 단어 ‘스위스’를 좋아해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한글의 모양에 매력을 느낀 구체적인 예시를 듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the Korean word for Switzerland 전치사구 수식: 전치사(for)를 사용하여 명사(the Korean word)를 한정하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 군인처럼 보이는데</span><span class=\"en\"><b><span class=\"grammar-hl\">It looks like a soldier</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 산 사이에 있는.</span><span class=\"en\"><b>between two mountains.</b></span></div></div><div class=\"lec-sent-ko\">그것은 두 개의 산들 사이에 있는 군인처럼 보여요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> looks like는 사전적으로 &#39;~처럼 보이다&#39;인데, 여기서는 글자의 시각적 형상을 묘사하는 것입니다. 한글 자음과 모음의 조합이 마치 그림처럼 느껴진다는 점을 강조하여 한글의 시각적 아름다움을 비유적으로 표현했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It looks like a soldier (관용표현): &#39;look like + 명사&#39; 구조로, &#39;~처럼 보이다&#39;라는 의미를 나타내는 관용적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">soldier</td><td class=\"m\">군인</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~해 보이며</span><span class=\"en\"><b><span class=\"grammar-hl\">It looks great</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멋져.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 멋져 보여요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한글 단어에 대한 안나의 만족감을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It looks great 2형식 구조: 감각동사(looks) 뒤에 형용사 보어(great)가 위치하여 주어(It)의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">윌리엄:</span><span class=\"en\"><b>William:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 한글을 좋아하는데</span><span class=\"en\"><b>I like Hangeul</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 역사가 놀랍기 때문에.</span><span class=\"en\"><b>because <span class=\"grammar-hl\">its history is amazing</span>.</b></span></div></div><div class=\"lec-sent-ko\">William: 저는 한글의 역사가 대단하기 때문에 그것을 좋아해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 윌리엄이 한글을 좋아하는 역사적인 이유를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">its history is amazing (명사절): 접속사 that(생략됨)이 이끄는 절이 이유를 나타내는 부사절(because)의 내용으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">history</td><td class=\"m\">역사</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오래전에는,</span><span class=\"en\"><b>A long time ago,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 한국 사람들이</span><span class=\"en\"><b>most Koreans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글을 읽거나 쓸 수 없었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">couldn’t read or write</span>.</b></span></div></div><div class=\"lec-sent-ko\">오래전, 대부분의 한국인들은 읽거나 쓸 수 없었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한글이 창제되기 전의 상황을 역사적 배경으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">couldn’t read or write 조동사 부정: 조동사(could)의 부정 형태(could not) 뒤에 동사원형(read, write)이 연결된 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">세종대왕은 이 일을 안타깝게 여겼고,</span><span class=\"en\"><b>King Sejong felt bad about this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 만들었는데</span><span class=\"en\"><b>so <span class=\"grammar-hl\">he created</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 알파벳을</span><span class=\"en\"><b><span class=\"grammar-hl\">a new alphabet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 백성을 위해.</span><span class=\"en\"><b>for his people.</b></span></div></div><div class=\"lec-sent-ko\">세종대왕은 이것에 대해 안타깝게 느껴서, 그의 백성들을 위해 새로운 문자를 창제했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> felt bad는 사전적으로 &#39;기분이 나쁘다&#39;지만, 여기서는 백성들의 문맹을 안타깝게(가슴 아프게) 여기는 마음을 의미합니다. 단순히 기분이 안 좋은 것이 아니라, 통치자로서 백성을 아끼는 깊은 연민의 마음을 강조하기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">he created a new alphabet 기본 문장 구조: 주어(he) + 타동사(created) + 목적어(a new alphabet)로 이루어진 3형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alphabet</td><td class=\"m\">문자, 알파벳</td></tr><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 18 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기자:</span><span class=\"en\"><b>Reporter:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분 모두 정말로 사랑하는군요</span><span class=\"en\"><b><span class=\"grammar-hl\">You all really love Hangeul</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">기자: 여러분 모두 한글을 정말 사랑하시네요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인터뷰 내용을 요약하며 인터뷰이들의 열정에 공감합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You all really love Hangeul (강조): 부사(really)가 동사(love)를 수식하며 문장의 의미를 강조하고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게 시작했나요</span><span class=\"en\"><b>How <span class=\"grammar-hl\">did you start learning</span> it?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 배우기를.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">여러분은 어떻게 그것을 배우기 시작하셨나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습 계기에 대한 추가 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did you start learning (동명사): start의 목적어로 쓰인 -ing 형태(learning)이며, 행위/활동을 나타내므로 동명사로 분류합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 ~입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m a big fan of K-pop songs</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열렬한 팬</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">K-팝 노래의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(저는 K-팝 노래의 열렬한 팬입니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한글을 배우게 된 동기를 개인적인 관심사와 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m a big fan of K-pop songs (전치사구): &#39;fan of ~&#39;는 &#39;~의 팬&#39;이라는 의미로, 전치사 of를 사용하여 명사(K-pop songs)를 연결합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한국 노래를 부르고 싶었기 때문에,</span><span class=\"en\"><b><span class=\"grammar-hl\">Because I wanted to sing</span> Korean songs,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 시작했습니다</span><span class=\"en\"><b>I started learning Hangeul.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한글을 배우는 것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 한국 노래를 부르고 싶었기 때문에, 한글을 배우기 시작했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 노래를 부르고 싶은 욕구가 한글 학습으로 이어졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Because I wanted to sing (분사구문(대체)): 접속사(Because)를 포함한 부사절로, &#39;to sing&#39;은 동사(want)의 목적어로 쓰인 to부정사의 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 부를 수 있습니다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can sing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 K-팝 노래를</span><span class=\"en\"><b>many K-pop songs!</b></span></div></div><div class=\"lec-sent-ko\">이제 저는 많은 케이팝 노래를 부를 수 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습의 결과로 얻게 된 성취감을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can sing (조동사): 조동사(can) 뒤에 동사원형(sing)이 결합하여 가능을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>한글날을 맞아 축제 현장에서 다양한 외국인들이 한글을 사랑하는 이유를 인터뷰했다.</li><li>픙은 배우기 쉽다는 점과 K-팝을 즐기고 싶다는 이유로 한글을 배웠다.</li><li>안나는 한글의 독특하고 아름다운 모양에 매력을 느꼈다.</li><li>윌리엄은 백성을 사랑하는 세종대왕의 창제 정신이라는 역사적 배경을 높이 평가한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People around the world are attracted to Hangeul because of its simplicity and beauty, and they often begin learning it due to their interest in Korean culture.</div>\n              <div class=\"lec-final-sum-ko\">전 세계 사람들은 한글의 간결함과 아름다움에 매력을 느끼며, 한국 문화에 대한 관심으로 인해 한글 공부를 시작한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"}],[{"audio":"./full_audio/7.mp3","hl":null}],[
