바꾸는 것만으로도 물을 효과적으로 아낄 수 있습니다.</li><li>짧은 시간 동안 샤워하기(take quick showers)</li><li>양치질할 때 물 잠가두기(turn off the water)</li><li>수도꼭지를 완전히 잠그는 습관 기르기(turn off the tap)</li><li>핵심 키워드: 절약(save), 수도꼭지(tap)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천 확인 및 격려</div><ul><li>다양한 활동을 통해 올바른 물 절약 방법을 확인하고 성취감을 얻습니다.</li><li>그림을 보고 물 절약 방법인지 구분하는 활동(identify ways)</li><li>정답을 맞힘으로써 물 절약 실천 의지 고취</li><li>당신은 물 절약을 정말 잘한다는 칭찬(amazing)</li><li>핵심 키워드: 실천 확인(check), 칭찬(praise)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">live</td><td class=\"m\">살다</td></tr><tr><td class=\"w\">without</td><td class=\"m\">~없이</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">낭비하다</td></tr><tr><td class=\"w\">a lot of</td><td class=\"m\">많은</td></tr><tr><td class=\"w\">sad</td><td class=\"m\">슬픈</td></tr><tr><td class=\"w\">save</td><td class=\"m\">절약하다</td></tr><tr><td class=\"w\">quick</td><td class=\"m\">빠른, 짧은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shower</td><td class=\"m\">샤워</td></tr><tr><td class=\"w\">turn off</td><td class=\"m\">(수도꼭지 등을) 잠그다, (전기를) 끄다</td></tr><tr><td class=\"w\">while</td><td class=\"m\">~하는 동안</td></tr><tr><td class=\"w\">brush</td><td class=\"m\">솔질하다, 닦다</td></tr><tr><td class=\"w\">teeth</td><td class=\"m\">치아 (tooth의 복수형)</td></tr><tr><td class=\"w\">make sure</td><td class=\"m\">확실히 ~하게 하다, 확인하다</td></tr><tr><td class=\"w\">tap</td><td class=\"m\">수도꼭지</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b>Hi!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 물 절약이에요!</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m</span> Water Saver!</b></span></div></div><div class=\"lec-sent-ko\">안녕하세요! 저는 물 절약이에요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 글쓴이가 자신을 ‘물 절약가’라는 이름으로 소개하며 독자에게 친근하게 말을 걸고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m 주어(I) + be동사(am)의 축약 형태입니다. 1형식 구조로 주어의 상태나 정체성을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">save</td><td class=\"m\">절약하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물은</span><span class=\"en\"><b>Water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 중요합니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> very important.</b></span></div></div><div class=\"lec-sent-ko\">물은 매우 중요합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물 절약의 필요성을 강조하기 위해 물의 절대적인 가치를 먼저 언급하며 논의를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 문장의 동사입니다. &#39;Water(주어) = important(보어)&#39;의 구조로 주어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살 수 없어요</span><span class=\"en\"><b>can’t live</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것 없이</span><span class=\"en\"><b><span class=\"grammar-hl\">without it</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그것 없이 살 수 없어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 ‘중요하다’는 내용을 구체적인 근거(생존 필수 요소)로 뒷받침하여 물의 중요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">without it 전치사구입니다. 전치사(without) 뒤에 대명사(it)가 목적어로 결합하여 동사(live)를 수식하는 부사적 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">live</td><td class=\"m\">살다</td></tr><tr><td class=\"w\">without</td><td class=\"m\">~없이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 사람들은</span><span class=\"en\"><b>But people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낭비해요</span><span class=\"en\"><b><span class=\"grammar-hl\">waste</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 물을</span><span class=\"en\"><b>a lot of water.</b></span></div></div><div class=\"lec-sent-ko\">하지만 사람들은 많은 물을 낭비해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 물의 중요성과 대비되는 현실적인 문제를 제기하여 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">waste 3형식 동사입니다. 주어(people) + 동사(waste) + 목적어(a lot of water)의 기본 구조를 갖추고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">낭비하다</td></tr><tr><td class=\"w\">a lot of</td><td class=\"m\">많은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들어요 나를</span><span class=\"en\"><b><span class=\"grammar-hl\">makes me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">슬프게</span><span class=\"en\"><b><span class=\"grammar-hl\">sad</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것이 저를 슬프게 만들어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물 낭비라는 부정적인 상황에 대한 글쓴이의 감정을 드러내어 독자가 환경 문제에 공감하게 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes me sad 5형식(SVOC) 구조입니다. make(사역동사) + 목적어(me) + 목적보어(sad, 형용사)가 결합하여 목적어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sad</td><td class=\"m\">슬픈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게</span><span class=\"en\"><b><span class=\"grammar-hl\">How</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b><span class=\"grammar-hl\">can we</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절약할 수 있을까요 물을?</span><span class=\"en\"><b><span class=\"grammar-hl\">save water?</span></b></span></div></div><div class=\"lec-sent-ko\">우리는 어떻게 물을 절약할 수 있을까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제 제기에서 해결 방안 제시로 넘어가는 전환점으로, 독자에게 질문을 던져 실천 방법을 생각하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How can we save water? 의문문 구조입니다. 의문부사(How)를 사용하여 방법이나 수단을 묻고 있으며, 조동사(can) + 주어(we) + 동사원형(save)의 어순을 취합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">save</td><td class=\"m\">절약하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Take</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빨리 샤워를</span><span class=\"en\"><b><span class=\"grammar-hl\">quick showers</span>.</b></span></div></div><div class=\"lec-sent-ko\">샤워를 빨리 하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물을 절약하는 구체적인 실천 방법 중 첫 번째를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take quick showers 명령문 구조입니다. 주어(You)가 생략된 채 동사원형(Take)으로 시작하여 상대방에게 행동을 요청합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quick</td><td class=\"m\">빠른, 짧은</td></tr><tr><td class=\"w\">shower</td><td class=\"m\">샤워</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잠그세요</span><span class=\"en\"><b>Turn off</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을</span><span class=\"en\"><b>the water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동안 여러분이 닦는</span><span class=\"en\"><b><span class=\"grammar-hl\">while you brush</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 이를</span><span class=\"en\"><b><span class=\"grammar-hl\">your teeth</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분이 이를 닦는 동안에는 물을 잠그세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상생활 속에서 쉽게 실천할 수 있는 두 번째 물 절약 방법을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while you brush your teeth 접속사(while)가 이끄는 부사절입니다. 주어(you)와 동사(brush)가 포함된 절이 주절의 행동이 일어나는 시점을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">turn off</td><td class=\"m\">(수도꼭지 등을) 잠그다, (전기를) 끄다</td></tr><tr><td class=\"w\">while</td><td class=\"m\">~하는 동안</td></tr><tr><td class=\"w\">brush</td><td class=\"m\">솔질하다, 닦다</td></tr><tr><td class=\"w\">teeth</td><td class=\"m\">치아 (tooth의 복수형)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">make sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 잠갔는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">that you turn off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수도꼭지를</span><span class=\"en\"><b><span class=\"grammar-hl\">the tap</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히</span><span class=\"en\"><b>completely.</b></span></div></div><div class=\"lec-sent-ko\">또한, 여러분이 수도꼭지를 완전히 잠갔는지 확인하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 실천 사항을 덧붙이며, make sure는 사전적으로 &#39;확실히 하다&#39;이지만 여기서는 &#39;잊지 말고 반드시 ~해라&#39;라는 뜻으로 쓰였습니다. 독자가 실수를 방지하도록 주의를 환기하는 강조의 의도가 담겨 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make sure that you turn off the tap 관용표현(make sure) + that절입니다. that절이 make sure의 내용을 구체화하며, &#39;반드시 ~하도록 하라&#39;는 의미를 전달합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">turn off</td><td class=\"m\">(수도꼭지 등을) 잠그다, (전기를) 끄다</td></tr><tr><td class=\"w\">make sure</td><td class=\"m\">확실히 ~하게 하다, 확인하다</td></tr><tr><td class=\"w\">tap</td><td class=\"m\">수도꼭지</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보세요</span><span class=\"en\"><b>Look at</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림들을</span><span class=\"en\"><b>the <span class=\"grammar-hl\">pictures</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래에 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">below</span>.</b></span></div></div><div class=\"lec-sent-ko\">아래 그림들을 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실천 방안 학습에서 배운 내용을 확인하는 활동으로 넘어가기 위해 독자의 시선을 아래로 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pictures below 후치 수식 구조입니다. 부사(below)가 명사(pictures)를 뒤에서 수식하여 &#39;아래에 있는 사진들&#39;이라는 의미를 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇이</span><span class=\"en\"><b><span class=\"grammar-hl\">Which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방법들인가요</span><span class=\"en\"><b><span class=\"grammar-hl\">are ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 절약할</span><span class=\"en\"><b><span class=\"grammar-hl\">to save water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 무엇이</span><span class=\"en\"><b>and which</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지 않은가요?</span><span class=\"en\"><b>are not?</b></span></div></div><div class=\"lec-sent-ko\">물을 절약하는 방법과 그렇지 않은 방법은 무엇인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 절약 방법들이 실제 상황에서 무엇인지 구분하도록 유도하며 독자의 참여를 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Which are ways to save water to부정사(to save): 형용사적 용법입니다. 앞의 명사(ways)를 뒤에서 수식하여 &#39;~하는 방법&#39;이라는 의미를 만듭니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr><tr><td class=\"w\">save</td><td class=\"m\">절약하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쓰세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Write</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">O 또는 X를</span><span class=\"en\"><b>an O or X</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각 그림 위에</span><span class=\"en\"><b>on each picture.</b></span></div></div><div class=\"lec-sent-ko\">각 그림에 O 또는 X를 쓰세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 학습 활동 방식을 지시하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Write 명령문입니다. 동사원형으로 문장을 시작하여 특정 행동을 지시합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 확신해요</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 얻었다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that you got</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정답을</span><span class=\"en\"><b><span class=\"grammar-hl\">the right answers</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 여러분이 정답을 맞혔다고 확신해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 활동을 마친 독자에게 격려를 보내며 긍정적인 분위기를 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m sure that you got the right answers (명사절(that절)): 주절의 형용사(sure) 뒤에서 문장의 목적어와 같은 역할을 하며, 확신의 내용을 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은</span><span class=\"en\"><b>You</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 뛰어나요</span><span class=\"en\"><b>are amazing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 절약하는 것에!</span><span class=\"en\"><b><span class=\"grammar-hl\">at saving water</span>!</b></span></div></div><div class=\"lec-sent-ko\">여러분은 물을 절약하는 것에 정말 뛰어나요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 환경 보호에 기여하고 있음을 치켜세워 성취감을 느끼게 하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at saving water (동명사(saving)): 전치사(at) 뒤에 위치하여 명사적 역할을 수행하며, &#39;물 절약하기&#39;라는 활동을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>물은 생존에 필수적이지만 사람들은 이를 낭비하고 있다.</li><li>글쓴이는 샤워 줄이기, 양치 시 물 잠그기 등 구체적인 절약법을 제시한다.</li><li>독자 스스로 물 절약 방법을 구분하는 활동을 하게 함으로써 실천을 유도한다.</li><li>독자를 칭찬하며 환경 보호에 대한 지속적인 관심을 독려한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Water is a vital resource for our survival, and we can easily conserve it by practicing small daily habits like turning off the tap.</div>\n              <div class=\"lec-final-sum-ko\">물은 우리가 생존하는 데 필수적인 자원이므로, 수도꼭지를 잠그는 것과 같은 작은 일상 습관을 실천함으로써 쉽게 절약할 수 있다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":"main"},{"audio":"./3_audio/27.
