그만큼 빠르게 버려져 환경 오염의 주범이 되곤 하죠. 이를 극복하기 위해 헌 옷을 재활용하거나 새롭게 디자인하여 다시 활용하는 업사이클링(Upcycling) 활동이 주목받고 있어요. 낡은 옷을 그냥 버리는 대신, 가방이나 인형 같은 새로운 물건으로 바꾸는 과정은 자원 순환(Resource Circulation)의 가치를 실천하는 아주 좋은 방법이랍니다. 여러분도 이번 글을 통해 옷의 가치를 재발견하고 지구를 지키는 친환경 패션(Eco-friendly Fashion) 소비자가 되어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 인식</div><ul><li>사람들이 의류를 너무 자주 버려 환경 문제가 발생하고 있습니다.</li><li>의류 폐기물(waste)로 인한 환경 오염</li><li>일부 옷은 분해되는 데 200년 이상 소요</li><li>핵심 키워드: 환경(environment), 분해(break down)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실천 방안</div><ul><li>환경을 보호하기 위해 옷 소비를 줄이고 오래 입는 습관이 필요합니다.</li><li>옷을 너무 많이 사지 않기</li><li>옷을 오랫동안 입기(wear for a long time)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03재활용 아이디어</div><ul><li>낡은 옷을 버리는 대신 새로운 물건으로 바꾸어 활용할 수 있습니다.</li><li>오래된 옷을 새로운 물건(new items)으로 창조</li><li>낡은 의류를 유용한 자원으로 활용</li><li>핵심 키워드: 재활용(useful), 창조(create)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fashion</td><td class=\"m\">유행, 패션</td></tr><tr><td class=\"w\">clever</td><td class=\"m\">영리한, 똑똑한</td></tr><tr><td class=\"w\">throw away</td><td class=\"m\">버리다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">break down</td><td class=\"m\">분해되다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">create</td><td class=\"m\">만들다, 창조하다</td></tr><tr><td class=\"w\">item</td><td class=\"m\">품목, 물건</td></tr><tr><td class=\"w\">useful</td><td class=\"m\">유용한</td></tr><tr><td class=\"w\">below</td><td class=\"m\">아래에</td></tr><tr><td class=\"w\">match</td><td class=\"m\">연결하다, 어울리다</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">정확한, 옳은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패션 똑똑이예요.</span><span class=\"en\"><b>Fashion Clever.</b></span></div></div><div class=\"lec-sent-ko\">저는 패션 똑똑이예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 필자가 자신을 소개하며, 앞으로 패션과 환경에 대해 현명한 조언을 할 것임을 보여주는 도입부입니다. 여기서 clever는 사전적으로는 &#39;영리한&#39;이라는 뜻이지만, 여기서는 단순히 머리가 좋은 것을 넘어 &#39;환경을 생각하고 자원을 아낄 줄 아는 현명한 선택을 하는 사람&#39;이라는 의미로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m (관용표현): I am의 축약형으로, 주어 I와 be동사 am이 결합하여 주어의 상태나 정체성을 서술합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fashion</td><td class=\"m\">유행, 패션</td></tr><tr><td class=\"w\">clever</td><td class=\"m\">영리한, 똑똑한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옷을 버려요</span><span class=\"en\"><b>throw away clothes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 자주.</span><span class=\"en\"><b><span class=\"grammar-hl\">too often</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 옷을 너무 자주 버려요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 문제의 원인을 제시하는 문장입니다. 옷을 쉽게 사고 버리는 현대인의 일반적인 소비 습관을 지적하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too often (관용표현): &#39;너무 자주&#39;라는 뜻의 부사구로, 동사 throw away를 수식하여 빈도를 강조합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throw away</td><td class=\"m\">버리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기가 돼요</span><span class=\"en\"><b>become waste</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 해쳐요</span><span class=\"en\"><b>and <span class=\"grammar-hl\">hurt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을.</span><span class=\"en\"><b>the environment.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 쓰레기가 되어 환경을 해쳐요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;옷을 버리는 행위&#39;가 가져오는 부정적인 결과를 보여줍니다. hurt는 사전적으로는 &#39;다치게 하다&#39;라는 뜻이지만, 여기서는 무생물인 환경이 생태계 파괴로 인해 고통받는 상황을 빗대어 환경 오염의 심각성을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hurt (기본구조): 주어(They) + 동사(become, hurt)의 병렬 구조로, waste와 environment에 미치는 영향을 서술합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알고 있었나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Did you know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 옷들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that some clothes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">200년이 넘게 걸린다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">take over 200 years</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분해되는 데?</span><span class=\"en\"><b><span class=\"grammar-hl\">to break down</span>?</b></span></div></div><div class=\"lec-sent-ko\">몇몇 옷들은 분해되는 데 200년이 넘게 걸린다는 것을 알고 있었나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 옷이 환경에 미치는 악영향을 구체적인 수치(200년)로 제시하여 독자의 경각심을 일깨우는 질문입니다. 여기서 break down은 &#39;고장 나다&#39;가 아니라 &#39;분해되다&#39;라는 의미로, 환경학적 관점에서 물질이 자연 상태로 돌아가는 과정을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Did you know (간접의문문): &#39;Did you know&#39; 뒤에 목적어로 명사절(that절)이 이어지는 구조로, 전체 문장은 의문문을 형성합니다.</div><div class=\"lec-gr-item\">that some clothes take over 200 years to break down (to부정사): &#39;to break down&#39;은 형용사적 용법으로 200년이라는 시간의 구체적인 의미를 보충 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">break down</td><td class=\"m\">분해되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사지 마세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 옷을.</span><span class=\"en\"><b>too many clothes.</b></span></div></div><div class=\"lec-sent-ko\">너무 많은 옷을 사지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제 제기에 따른 첫 번째 구체적인 해결책입니다. 과도한 소비를 줄이자는 직관적인 행동 지침을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t buy (관용표현): Do not의 축약형으로, 상대방에게 하지 말아야 할 행동을 지시하는 부정 명령문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">입으세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Wear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 옷을</span><span class=\"en\"><b>your clothes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안.</span><span class=\"en\"><b>for a long time.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 옷을 오랫동안 입으세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 해결책입니다. 옷을 새로 사는 대신 기존의 옷을 아껴 입음으로써 환경 보호에 동참할 것을 권유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Wear (관용표현): 동사원형으로 시작하는 명령문으로, 상대방에게 동작을 권유하거나 지시합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 또한 만들 수 있어요</span><span class=\"en\"><b>You can also <span class=\"grammar-hl\">create</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 물건을</span><span class=\"en\"><b><span class=\"grammar-hl\">new items</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 헌 옷으로부터!</span><span class=\"en\"><b><span class=\"grammar-hl\">from your old clothes</span>!</b></span></div></div><div class=\"lec-sent-ko\">여러분의 헌 옷으로 새로운 물건을 만들 수도 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세 번째 해결책으로, 단순히 옷을 유지하는 단계를 넘어 &#39;업사이클링(새활용)&#39;이라는 창의적인 해결 방안을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">create new items from your old clothes (관용표현): &#39;A from B&#39; 구조로, B(헌 옷)라는 재료로부터 A(새로운 아이템)를 만들어내는 과정을 표현합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">create</td><td class=\"m\">만들다, 창조하다</td></tr><tr><td class=\"w\">item</td><td class=\"m\">품목, 물건</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만들어 봅시다</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헌 옷을</span><span class=\"en\"><b><span class=\"grammar-hl\">old clothes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유용하게.</span><span class=\"en\"><b><span class=\"grammar-hl\">useful</span>.</b></span></div></div><div class=\"lec-sent-ko\">헌 옷을 유용하게 만들어 봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용들을 요약하며 독자들의 능동적인 참여를 촉구하는 마무리 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s make old clothes useful 5형식(SVOC) 구조: make(사역동사) + O(old clothes) + OC(useful, 형용사) 구조로, 목적어를 목적보어한 상태로 만들라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">useful</td><td class=\"m\">유용한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있어요</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 가지 물건들이</span><span class=\"en\"><b>some items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아래에.</span><span class=\"en\"><b>below.</b></span></div></div><div class=\"lec-sent-ko\">아래에 몇 가지 물건들이 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들이 직접 활동에 참여할 수 있도록 안내하는 전환 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문두에 오면서 주어(some items)와 동사(are)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">item</td><td class=\"m\">품목, 물건</td></tr><tr><td class=\"w\">below</td><td class=\"m\">아래에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 만들 수 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">can you make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 헌 옷들로?</span><span class=\"en\"><b><span class=\"grammar-hl\">with these old clothes</span>?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 이 헌 옷들로 무엇을 만들 수 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 호기심을 자극하여 뒤에 이어질 활동에 집중하게 만드는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can you make with these old clothes (간접의문문): 의문사 What으로 시작하는 의문문 구조로, 전치사구 with these old clothes가 동사 make의 재료를 보충합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연결해 보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Match</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헌 옷과</span><span class=\"en\"><b><span class=\"grammar-hl\">the old clothes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알맞은 새 물건을.</span><span class=\"en\"><b><span class=\"grammar-hl\">with the correct new items</span>.</b></span></div></div><div class=\"lec-sent-ko\">헌 옷과 알맞은 새 물건을 연결해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 활동 내용을 제시하는 명령문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Match the old clothes with the correct new items (관용표현): &#39;Match A with B&#39; 구조로, A와 B를 서로 짝짓거나 연결하라는 의미의 명령문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">item</td><td class=\"m\">품목, 물건</td></tr><tr><td class=\"w\">match</td><td class=\"m\">연결하다, 어울리다</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">정확한, 옳은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제</span><span class=\"en\"><b>Now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 될 수 있어요</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영리하게</span><span class=\"en\"><b><span class=\"grammar-hl\">clever</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패션에 또한!</span><span class=\"en\"><b><span class=\"grammar-hl\">at fashion</span> too!</b></span></div></div><div class=\"lec-sent-ko\">이제 여러분도 패션에 영리해질 수 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 처음 사용한 &#39;Fashion Clever&#39;를 다시 언급하며, 독자들도 환경을 생각하는 현명한 소비자가 될 수 있다는 긍정적인 메시지로 글을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be clever at fashion (관용표현): &#39;be clever at ~&#39; 구조로, &#39;~에 능숙하다/재치가 있다&#39;라는 의미를 나타내는 상태 서술입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><t
