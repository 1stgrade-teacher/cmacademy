-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pollution</td><td class=\"m\">오염</td></tr><tr><td class=\"w\">superhero</td><td class=\"m\">슈퍼히어로(영웅)</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr><tr><td class=\"w\">join</td><td class=\"m\">참여하다, 합류하다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">낭비하다</td></tr><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">kilogram</td><td class=\"m\">킬로그램(kg)</td></tr><tr><td class=\"w\">properly</td><td class=\"m\">올바르게, 제대로</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">food waste</td><td class=\"m\">음식물 쓰레기</td></tr><tr><td class=\"w\">glass</td><td class=\"m\">유리</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">올바른</td></tr><tr><td class=\"w\">bin</td><td class=\"m\">쓰레기통</td></tr><tr><td class=\"w\">below</td><td class=\"m\">아래에</td></tr><tr><td class=\"w\">draw</td><td class=\"m\">그리다, 선을 긋다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오염은</span><span class=\"en\"><b><span class=\"grammar-hl\">Pollution</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제</span><span class=\"en\"><b><span class=\"grammar-hl\">a big problem</span>.</b></span></div></div><div class=\"lec-sent-ko\">오염은 큰 문제입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 환경 오염이 해결해야 할 심각한 과제임을 제시하며 독자의 관심을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Pollution is a big problem (기본구조): S + V + C(보어)의 2형식 문장으로, Pollution이 주어, is가 동사, a big problem이 주어의 상태를 설명하는 보어 역할을 함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pollution</td><td class=\"m\">오염</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히,</span><span class=\"en\"><b>Luckily,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 명의 슈퍼히어로가</span><span class=\"en\"><b>three superheroes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일하고 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">are working</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to protect</span> the environment.</b></span></div></div><div class=\"lec-sent-ko\">다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;슈퍼히어로&#39;라는 표현을 사용해 환경 보호 활동을 하는 인물들을 흥미로운 존재로 묘사하며, 앞으로 소개할 해결책에 대한 기대감을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are working (현재진행): be동사(are) + -ing(working)의 형태로, 현재 어떤 동작이 진행 중임을 나타냄</div><div class=\"lec-gr-item\">to protect (to부정사): to + 동사원형 구조로, 여기서는 &#39;환경을 보호하기 위해서&#39;라는 의미의 부사적 용법(목적)으로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">superhero</td><td class=\"m\">슈퍼히어로(영웅)</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들고 싶어 하며</span><span class=\"en\"><b><span class=\"grammar-hl\">want to make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을</span><span class=\"en\"><b>the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨끗하게</span><span class=\"en\"><b>clean.</b></span></div></div><div class=\"lec-sent-ko\">그들은 세상을 깨끗하게 만들고 싶어 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 슈퍼히어로들이 가진 구체적인 목표를 설명하며, 글의 전체적인 지향점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want to make (to부정사): want의 목적어 역할을 하는 명사적 용법으로, to + 동사원형(make) 구조임</div><div class=\"lec-gr-item\">make the world clean 5형식(SVOC) 구조: make(사역동사) + O(the world) + OC(clean, 형용사)로, 목적어를 목적보어한 상태로 만들다라는 의미를 가짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">함께하시겠어요</span><span class=\"en\"><b><span class=\"grammar-hl\">Will you join</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을</span><span class=\"en\"><b><span class=\"grammar-hl\">them?</span></b></span></div></div><div class=\"lec-sent-ko\">당신도 그들과 함께하시겠어요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 질문을 던져 환경 보호라는 행동에 동참할 것을 권유하는 설득적인 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Will you join them? (기본구조): 조동사(Will)를 포함한 의문문으로, S(you) + V(join) + O(them)의 구조를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">join</td><td class=\"m\">참여하다, 합류하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b><span class=\"grammar-hl\">Hi!</span></b></span></div></div><div class=\"lec-sent-ko\">안녕하세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 Wizard는 사전적으로 &#39;마법사&#39;를 뜻하지만, 여기서는 재활용을 통해 환경 문제를 해결하는 능력이 뛰어난 사람을 비유합니다. 환경 보호라는 다소 딱딱할 수 있는 주제를 친근하고 재미있게 전달하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hi! (관용표현): 대화 시작 시 사용하는 인사말</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용 마법사</span><span class=\"en\"><b><span class=\"grammar-hl\">Recycle Wizard</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 재활용 마법사예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 Wizard는 사전적으로 &#39;마법사&#39;를 뜻하지만, 여기서는 재활용을 통해 환경 문제를 해결하는 능력이 뛰어난 사람을 비유합니다. 환경 보호라는 다소 딱딱할 수 있는 주제를 친근하고 재미있게 전달하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Recycle Wizard (기본구조): I(주어) + am(be동사) + Recycle Wizard(보어)의 2형식 문장임</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낭비하는데</sp 용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이 1,000kg을 재활용하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">recycling 1,000 kilograms of paper</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절약할 수 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">can save</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 19그루의 나무와</span><span class=\"en\"><b>about 19 trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">29,000리터의 물을</span><span class=\"en\"><b>and 29,000 liters of water.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 수치를 들어 재활용의 효과를 입증함으로써, 독자가 재활용의 중요성을 실감하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">recycling 1,000 kilograms of paper (동명사): 문장에서 주어 역할을 하는 동명사구로, 뒤에 목적어(1,000 kilograms of paper)를 수반함</div><div class=\"lec-gr-item\">can save (기본구조): 조동사(can) + 동사원형(save)의 구조로, &#39;~할 수 있다&#39;는 능력을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr><tr><td class=\"w\">for example</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">kilogram</td><td class=\"m\">킬로그램(kg)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">되고 싶나요</span><span class=\"en\"><b>Do you want <span class=\"grammar-hl\">to be</span></b></span></div><div class=\"lec-chunk\"><spa
