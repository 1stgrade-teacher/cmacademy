" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02재활용의 마법사</div><ul><li>재활용을 통해 자원을 절약하고 올바른 분리배출을 실천하는 법을 배웁니다.</li><li>자원 낭비를 줄이는 재활용(recycling)의 중요성</li><li>종이 1,000kg 재활용 시 나무와 물 절약 효과</li><li>올바른 분리배출(correct bins) 방법 준수</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03패션의 지혜</div><ul><li>헌 옷을 버리지 않고 다시 활용하여 환경 오염을 막는 지혜로운 소비를 제안합니다.</li><li>의류 쓰레기 문제와 분해(break down)에 걸리는 긴 시간</li><li>무분별한 의류 구매 지양 및 오래 입기</li><li>헌 옷을 활용해 새로운 물건 만들기(create new items)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04물의 절약가</div><ul><li>소중한 자원인 물을 아끼기 위해 일상에서 실천할 수 있는 습관을 강조합니다.</li><li>생존에 필수적인 자원인 물(water)의 중요성</li><li>짧게 샤워하기 및 양치할 때 물 잠그기</li><li>수도꼭지를 완전히 잠그는(turn off the tap) 습관 정착</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmental</td><td class=\"m\">환경의</td></tr><tr><td class=\"w\">pollution</td><td class=\"m\">오염</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr><tr><td class=\"w\">properly</td><td class=\"m\">적절하게, 제대로</td></tr><tr><td class=\"w\">bin</td><td class=\"m\">쓰레기통</td></tr><tr><td class=\"w\">throw away</td><td class=\"m\">버리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">break down</td><td class=\"m\">분해되다</td></tr><tr><td class=\"w\">useful</td><td class=\"m\">유용한</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한</td></tr><tr><td class=\"w\">make sure</td><td class=\"m\">확실히 ~하다</td></tr><tr><td class=\"w\">tap</td><td class=\"m\">수도꼭지</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은</span><span class=\"en\"><b>You’re</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 슈퍼히어로입니다!</span><span class=\"en\"><b>an <span class=\"grammar-hl\">Environmental Superhero</span>!</b></span></div></div><div class=\"lec-sent-ko\">당신은 환경 슈퍼히어로입니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자를 &#39;환경 슈퍼히어로&#39;라고 부르며 환경 보호에 동참해야 한다는 흥미를 유발하고 있습니다. Superhero는 사전적으로는 &#39;초능력을 가진 영웅&#39;을 뜻하지만, 여기서는 환경을 지키는 중요한 역할을 하는 사람이라는 의미를 강조하기 위해 비유적으로 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Environmental Superhero (현재분사(형용사)): Environmental이 Superhero를 수식하는 구조. &#39;-al&#39;로 끝나는 형용사가 명사를 수식하여 &#39;환경적인 영웅&#39;이라는 의미를 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">environmental</td><td class=\"m\">환경의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오염은</span><span class=\"en\"><b><span class=\"grammar-hl\">Pollution</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is a big problem</span>.</b></span></div></div><div class=\"lec-sent-ko\">오염은 큰 문제입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호가 필요한 이유를 제시하며 글의 전체적인 논의 주제를 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Pollution is a big problem 2형식(SVC) 구조: Pollution(S) + is(V) + a big problem(C)으로 이루어진 기본 문장 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pollution</td><td class=\"m\">오염</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히,</span><span class=\"en\"><b>Luckily,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 명의 슈퍼히어로가</span><span class=\"en\"><b>three superheroes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일하고 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">are working</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을 보호하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to protect</span> the environment.</b></span></div></div><div class=\"lec-sent-ko\">다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오염이라는 &#39;문제&#39;에 대해 뒤이어 소개할 세 명의 해결사(슈퍼히어로)를 등장시켜 논리적 전환을 꾀합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are working (현재진행): be동사(are) + 현재분사(working)를 사용하여 현재 일어나고 있는 동작을 나타냅니다.</div><div class=\"lec-gr-item\">to protect to부정사(부사적 용법): working이라는 동사를 수식하며, 목적(~하기 위해서)을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protect</td><td class=\"m\">보호하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들고 싶어 합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">want to make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 깨끗하게</span><span class=\"en\"><b>the world clean.</b></span></div></div><div class=\"lec-sent-ko\">그들은 세상을 깨끗하게 만들고 싶어 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 슈퍼히어로들이 가진 목표와 동기를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want to make to부정사(명사적 용법): want의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">make the world clean 5형식(SVOC) 구조: make(V) + the world(O) + clean(OC)으로, 목적어의 상태를 설명하는 형용사 보어가 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은</span><span class=\"en\"><b><span class=\"grammar-hl\">Will you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들과 함께하시겠어요?</span><span class=\"en\"><b><span class=\"grammar-hl\">join them?</span></b></span></div></div><div class=\"lec-sent-ko\">당신도 그들과 함께하시겠어요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 환경 보호 활동에 참여할 것을 권유하며 글에 대한 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Will you join them? 조동사 의문문: 조동사 Will을 문장 앞으로 도치하여 의문문을 만든 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b>Hi!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 재활용 마법사예요.</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m Recycle Wizard</span>.</b></span></div></div><div class=\"lec-sent-ko\">(안녕하세요! 저는 재활용 마법사입니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 슈퍼히어로인 &#39;재활용 마법사&#39;를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m Recycle Wizard 2형식(SVC) 구조: I(S) + am(V) + Recycle Wizard(C)로 주어의 신분을 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 자원을 낭비해요.</span><span class=\"en\"><b>waste <span class=\"grammar-hl\">too many resources</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 너무 많은 자원을 낭비해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재활용이 필요한 배경 상황(원인)을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too many resources (관용표현): &#39;너무 많은&#39;을 의미하며 가산 명사의 수량을 나타내는 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resource</td><td class=\"m\">자원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용은</span><span class=\"en\"><b><span class=\"grammar-hl\">recycling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 절약할 수 있어요.</span><span class=\"en\"><b>can save them.</b></span></div></div><div class=\"lec-sent-ko\">하지만 재활용은 그것들을 절약할 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자원 낭비라는 문제에 대한 구체적인 해결책을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">recycling (동명사(명사적)): 문장의 주어 역할을 하며 &#39;재활용하는 것은&#39;으로 해석됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이 1,000kg을 재활용하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">recycling 1,000 kilograms of paper</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절약할 수 있어요</span><span class=\"en\"><b>can save</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 19그루의 나무와</span><span class=\"en\"><b>about 19 trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">29,000리터의 물을</span><span class=\"en\"><b>and 29,000 liters of water.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 뒷받침하는 구체적인 수치를 제시하여 재활용의 효과를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">recycling 1,000 kilograms of paper (동명사(명사적)): 문장의 주어 역할을 하는 구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 원하나요</span><span class=\"en\"><b>Do you want</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마법사가</span><span class=\"en\"><b>a wizard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용 분야의</span><span class=\"en\"><b>at recycling?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 재활용 마법사가 되고 싶나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 직접 재활용에 참여하도록 유도하는 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be to부정사(명사적 용법): want의 목적어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycling</td><td class=\"m\">재활용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 재활용해야 합니다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">should recycle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제대로!</span><span class=\"en\"><b>properly!</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 재활용을 제대로 해야 합니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;재활용 마법사&#39;가 되기 위한 구체적인 실천 방안을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should recycle (조동사): 의무를 나타내는 should 뒤에 동사원형이 결합된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">properly</td><td class=\"m\">적절하게, 제대로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 41</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">플라스틱, 종이, 음식물 쓰레기, 그리고 유리를 넣으세요</span><span class=\"en\"><b>Put plastic, paper, <span class=\"grammar-hl\">food waste</span>, and glass</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알맞은 쓰레기통에</span><span class=\"en\"><b>in the correct bins.</b></span></div></div><div class=\"lec-se
