 느낄 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일상적인 시작</div><ul><li>비아트리스의 금요일은 평범한 날로 시작된다.</li><li>흰 양말을 신고 샌드위치를 만들며 하루를 시작함</li><li>이웃이 그녀를 &quot;완벽한 소녀&quot;라고 부름</li><li>핵심 키워드: 비아트리스(Beatrice)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02재능과 압박</div><ul><li>비아트리스는 재능 쇼에서 매년 우승하는 재주꾼이다.</li><li>이웃이 재능 쇼에 대해 질문함</li><li>그녀는 항상 실수를 하지 않음</li><li>핵심 키워드: 재능 쇼(talent show)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03긴장과 실수</div><ul><li>요리 수업 중 비아트리스는 실수를 할 뻔한다.</li><li>미끄러운 것에 발을 디디며 넘어질 뻔함</li><li>긴장감이 커지며 불안해함</li><li>핵심 키워드: 긴장(nervous)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04예상치 못한 사건</div><ul><li>재능 쇼에서 비아트리스는 실수를 하게 된다.</li><li>소금통이 후추로 가득 차 있었음</li><li>물풍선과 계란이 엉망이 됨</li><li>핵심 키워드: 실수(mistake)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05새로운 시작</div><ul><li>비아트리스는 실수를 통해 새로운 자신을 발견한다.</li><li>웃음을 터뜨리며 관객과 함께 웃음</li><li>다음 날, 양말을 다르게 신음</li><li>핵심 키워드: 변화(change)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">begin</td><td class=\"m\">시작하다</td></tr><tr><td class=\"w\">sandwich</td><td class=\"m\">샌드위치</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양</td></tr><tr><td class=\"w\">neighbor</td><td class=\"m\">이웃</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">실수</td></tr><tr><td class=\"w\">champion</td><td class=\"m\">챔피언, 우승자</td></tr><tr><td class=\"w\">nervous</td><td class=\"m\">긴장한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">talent</td><td class=\"m\">재능</td></tr><tr><td class=\"w\">throw</td><td class=\"m\">던지다</td></tr><tr><td class=\"w\">strange</td><td class=\"m\">이상한</td></tr><tr><td class=\"w\">laugh</td><td class=\"m\">웃다</td></tr><tr><td class=\"w\">surprise</td><td class=\"m\">놀라움</td></tr><tr><td class=\"w\">sleep</td><td class=\"m\">수면</td></tr><tr><td class=\"w\">call</td><td class=\"m\">부르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">완벽한 소녀의 이야기</span><span class=\"en\"><b><span class=\"grammar-hl\">The Story of a Perfect Girl</span></b></span></div></div><div class=\"lec-sent-ko\">(완벽한 소녀의 이야기)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 이야기의 제목을 소개하고 있습니다. &#39;완벽한 소녀&#39;라는 표현은 주인공인 비아트리스의 성격이나 행동을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Story of a Perfect Girl (기본구조): N + of + N 형태로, 첫 번째 명사(The Story)가 두 번째 명사(Perfect Girl)를 수식하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비아트리스에게는</span><span class=\"en\"><b><span class=\"grammar-hl\">For Beatrice</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">금요일이 시작되었다</span><span class=\"en\"><b>Friday <span class=\"grammar-hl\">began</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 날과 같았다.</span><span class=\"en\"><b><span class=\"grammar-hl\">like any other day</span>.</b></span></div></div><div class=\"lec-sent-ko\">Beatrice에게 금요일은 어느 다른 날처럼 시작되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 비아트리스의 일상적인 삶을 보여줍니다. 그녀의 하루가 특별하지 않다는 것을 강조하여, 이후의 사건들이 더욱 극적이게 느껴지도록 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For Beatrice 전치사 + 명사 구조로, Beatrice를 위한 상황을 나타내는 표현이다.</div><div class=\"lec-gr-item\">began like any other day began은 일반동사로, 주어가 &#39;Friday&#39;일 때 과거형으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 신었다</span><span class=\"en\"><b>She wore</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 흰색 양말을</span><span class=\"en\"><b><span class=\"grammar-hl\">the same white socks</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양쪽 발에.</span><span class=\"en\"><b>on both of her feet.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스가 일관성을 중시하는 성격임을 나타냅니다. 같은 양말을 신는 것은 그녀의 완벽함을 상징합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the same white socks 형용사 + 명사 구조로, &#39;the same&#39;이 &#39;white socks&#39;를 수식하여 같은 색의 양말을 의미한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">Then she made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">샌드위치를.</span><span class=\"en\"><b><span class=\"grammar-hl\">a sandwich</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 그녀는 샌드위치를 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스의 일상적인 행동을 보여줍니다. 그녀의 평범한 아침을 강조하며, 이후의 사건과 대비를 이루게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Then she made a sandwich Then은 문장 시작 부분에 위치하여 시간의 흐름을 나타내는 부사로 쓰였다.</div></div>\n        <div class=\"lec-voca-w      <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그때 모든 사람들이 함께 웃기 시작했다.</span><span class=\"en\"><b>Then everyone started to laugh together.</b></span></div></div><div class=\"lec-sent-ko\">그러더니 모두 함께 웃기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스의 실수가 사람들을 하나로 묶는 계기가 되었습니다. 그녀의 실수가 긍정적인 분위기를 만들어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Beatrice made a mistake made는 일반동사로, 주어가 &#39;Beatrice&#39;일 때 과거형으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">laugh</td><td class=\"m\">웃다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 44 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그날 밤,</span><span class=\"en\"><b>That night,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비아트리스는 깊은 잠을 잤다.</span><span class=\"en\"><b>Beatrice had a deep sleep.</b></span></div></div><div class=\"lec-sent-ko\">그날 밤, Beatrice는 깊은 잠을 잤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스가 긴장감에서 벗어나 편안함을 느끼고 있음을 나타냅니다. 그녀의 감정이 안정되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What a surprise! What으로 시작하는 감탄문으로, 주어가 생략된 상태에서 &#39;a surprise&#39;를 강조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sleep</td><td class=\"m\">수면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 45 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음 날 아침,</span><span class=\"en\"><b>The next morning,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 일어났다</span><span class=\"en\"><b>she woke up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미소를 지으며.</span><span class=\"en\"><b>with a smile.</b></span></div></div><div class=\"lec-sent-ko\">다음 날 아침, 그녀는 미소를 지으며 일어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스가 긍정적인 마음가짐을 가지게 되었음을 보여줍니다. 그녀의 변화가 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What should I do? What으로 시작하는 의문문 구조로, 주어가 &#39;I&#39;일 때 질문을 형성한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 46 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 흰 양말을 신었다</span><span class=\"en\"><b>She put a white sock</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왼발에…</span><span class=\"en\"><b>on her left foot...</b></span></div></div><div class=\"lec-sent-ko\">(그녀는 왼발에 흰 양말을 신었다…)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스가 더 이상 완벽함에 집착하지 않게 되었음을 나타냅니다. 그녀의 변화가 상징적으로 표현됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Cry? Run off the stage? 동사원형으로 질문을 형성하는 구조로, 두 가지 선택지를 제시한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 47 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b>and</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">초록 양말을</span><span class=\"en\"><b>a green sock</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오른발에!</span><span class=\"en\"><b>on her right foot!</b></span></div></div><div class=\"lec-sent-ko\">(그리고 오른발에 초록 양말을 신었다!)</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Suddenly, she began to laugh loudly suddenly는 시간의 흐름을 나타내는 부사로, &#39;began to laugh&#39;는 곧 일어날 행동을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 48 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 더 이상 그녀를 &quot;완벽한 소녀&quot;라고 부르지 않는다.</span><span class=\"en\"><b>people no longer call her “Perfect Girl.</b></span></div></div><div class=\"lec-sent-ko\">이제, 사람들은 더 이상 그녀를 ‘완벽한 소녀’라고 부르지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스의 새로운 정체성을 보여줍니다. 그녀의 완벽함이 아닌 진정한 모습이 인정받고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The people looked at each other looked는 일반동사로, 주어가 &#39;The people&#39;일 때 과거형으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">call</td><td class=\"m\">부르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 49 / 49</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 단지 그녀를 비아트리스라고 부른다.</span><span class=\"en\"><b>They just call her Beatrice.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그녀를 그저 Beatrice라고 부른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비아트리스가 자신의 이름으로 불리게 되었다는 것은 그녀의 성장과 변화를 의미합니다. 그녀가 더 이상 완벽함에 얽매이지 않게 되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Then everyone started to laugh together started to 구조로, &#39;laugh&#39;가 곧 일어날 행동을 나타내는 동사로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><t
