<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 8과 본문3","audioDir":"3_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(윤)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Goldilocks Apologizes and Promises to Clean Every Day\u003c/h1>\u003ch2>골디락스, 사과하고 매일 청소를 약속하다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>곰 세 마리가 집으로 돌아와 골디락스가 \u003cb class=\"key\">수프\u003c/b>를 먹고 \u003cb class=\"key\">의자\u003c/b>를 부수고 허락 없이 집 사진을 \u003cb class=\"key\">게시물\u003c/b>로 올린 것을 발견한다. 골디락스는 잘못을 인정하고 여름이 끝날 때까지 매일 집을 \u003cb class=\"key\">청소\u003c/b>하겠다고 사과한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Goldilocks apologizes for breaking into the bears' house and posting pictures without permission, promising to clean their house every day until the end of the summer.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 골디락스와 곰 세 마리 이야기를 현대적으로 각색한 지문을 함께 읽어 볼 거예요. 곰들이 집에 돌아와서 벌어지는 사건과 골디락스의 사과까지 차례대로 살펴볼게요. 이 글의 요지는 골디락스가 허락 없이 집에 들어가 사진을 올린 잘못을 인정하고 사과한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 전래 동화 '골디락스와 곰 세 마리(Goldilocks and the Three Bears)'를 현대적으로 각색한 이야기이다. 원작에서 골디락스는 남의 집에 무단 침입(trespass)해 죽을 먹고 의자를 부수고 잠을 자다가 곰들이 돌아오자 도망친다. 이 각색본은 여기에 소셜 미디어(social media) 요소를 더해, 집 안 사진을 허락(permission) 없이 \u003cb class=\"key\">게시물\u003c/b>(post)로 올리는 새로운 잘못을 만들어 냈다. 이는 사생활(privacy) 침해와 초상권 문제를 떠올리게 한다. 일상 비유로 말하면 친구 집에 몰래 들어가 방 사진을 찍어 SNS에 올리는 것과 같다. 결국 이 글은 잘못을 인정하고 \u003cb class=\"key\">사과\u003c/b>하며 책임을 지는 태도를 보여 준다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 이 지문은 전래 동화인 Goldilocks and the Three Bears를 현대적으로 바꾼 이야기예요. 원작에서 골디락스는 남의 집에 무단 침입해서 죽을 먹고 의자를 부수고 잠을 자다가 곰들이 돌아오자 도망치죠. 이 각색본은 여기에 소셜 미디어 요소를 더했어요. 집 안 사진을 허락 없이 게시물로 올리는 새로운 잘못을 만들어 낸 거예요. 이건 사생활 침해나 초상권 문제를 떠올리게 하죠. 친구 집에 몰래 들어가 방 사진을 찍어 SNS에 올리는 것과 비슷하다고 생각하면 이해하기 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>곰들의 귀가\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>약 한 시간 후에 곰 세 마리가 집으로 돌아온다. 아기곰은 누군가 자신의 \u003cb class=\"key\">수프\u003c/b>를 먹고 \u003cb class=\"key\">의자\u003c/b>를 부서뜨렸다고 외친다. 집에 들어오자마자 이상한 흔적이 드러나는 \u003cb class=\"key\">도입\u003c/b> 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>게시물 문제\u003csmall>전환 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>곰들은 위층으로 올라가 \u003cb class=\"key\">Goldilocks\u003c/b>를 보고, 엄마곰은 그 옆에서 \u003cb class=\"key\">휴대폰\u003c/b>을 발견한다. 엄마곰은 자기 집에 관한 게시물들이 올라와 있는 것을 보고 화가 나서 외친다. 단순한 침입을 넘어 \u003cb class=\"key\">게시물\u003c/b>이라는 새로운 문제가 드러나는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아빠곰의 추궁\u003csmall>반례 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>Goldilocks는 놀라서 \u003cb class=\"key\">벌떡 \u003c/b>\u003cb class=\"key\">일어난다\u003c/b>. 아빠곰은 우리 집에 \u003cb class=\"key\">침입\u003c/b>해서 허락 없이 사진을 올렸다고 지적한다. 잘못을 모르냐고 묻는 \u003cb class=\"key\">추궁\u003c/b>의 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사과와 보상\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>Goldilocks는 용서를 구하고 \u003cb class=\"key\">사과\u003c/b>한다. 여름이 끝날 때까지 매일 집을 \u003cb class=\"key\">청소\u003c/b>하겠다고 제안한다. 잘못에 대한 \u003cb class=\"key\">보상\u003c/b>으로 이야기가 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 약 한 시간 후에 곰 세 마리가 집으로 돌아와요. 아기곰은 누군가 자기 수프를 먹고 의자를 부서뜨렸다고 외치죠. 집에 들어오자마자 이상한 흔적이 보이는 도입 부분이에요.","hl":"f0"},{"n":5,"text":"그다음 곰들은 위층으로 올라가서 Goldilocks를 보고, 엄마곰은 그 옆에서 휴대폰을 발견해요. 엄마곰은 자기 집에 관한 게시물들이 올라와 있는 걸 보고 화가 나서 외치죠. 단순한 침입을 넘어 게시물이라는 새로운 문제가 드러나는 부분이에요.","hl":"f1"},{"n":6,"text":"이어서 Goldilocks는 놀라서 벌떡 일어나요. 아빠곰은 우리 집에 침입해서 허락 없이 사진을 올렸다고 지적하고, 이런 것들이 잘못인지 모르냐고 물어요. 잘못을 추궁하는 장면이죠.","hl":"f2"},{"n":7,"text":"마지막으로 Goldilocks가 용서를 구하고 사과해요. 여름이 끝날 때까지 매일 집을 청소하겠다고 제안하죠. 잘못에 대한 보상으로 이야기가 마무리돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 시간 순서대로 전개되는 \u003cb class=\"key\">시간순\u003c/b> 구조이다. 곰들이 집에 돌아오고, 위층으로 올라가고, 골디락스가 벌떡 일어나고, 마지막에 사과하는 흐름이 이어진다. 글의 주제를 담은 \u003cb class=\"key\">주제문\u003c/b>이 마지막 부분에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>이라고 볼 수 있다. 따라서 결론에 해당하는 열한 번째 문장에서 골디락스의 사과와 보상 약속을 확인해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>About an hour later (1)\u003c/b>\u003cspan>시간 전환 신호\u003c/span>\u003cb>They went upstairs (3)\u003c/b>\u003cspan>장면 전개\u003c/span>\u003cb>without our permission (8)\u003c/b>\u003cspan>재진술·강조\u003c/span>\u003cb>I'll clean your house every day until the end of the summer (11)\u003c/b>\u003cspan>결론·보상 약속\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ate my soup and broke my chair\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">broke into our house\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">posted these pictures without our permission\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these things are wrong\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 곰들이 집에 돌아온 뒤에 위층으로 올라가고, 골디락스가 벌떡 일어나고, 마지막에 사과하는 순서로 사건이 이어지죠. 주제를 담은 문장이 글 끝에 나오는 미괄식 구조예요. 그래서 결론 부분인 마지막 문장에서 골디락스의 사과와 보상 약속을 꼭 확인해야 해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 About an hour later가 시간의 흐름을 열어 주고, They went upstairs가 장면을 다음 단계로 넘겨 줘요. 마지막 문장인 I'll clean your house every day until the end of the summer가 결론을 맺죠. 그리고 broke into our house와 posted these pictures without our permission은 골디락스가 저지른 잘못을 다시 말해 주는 재진술 표현이에요. 이렇게 반복되는 표현을 잡으면 사건의 핵심이 잘못과 사과라는 걸 알 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>about\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약, ~쯤\u003c/span>\u003c/div>\u003cdiv>\u003cb>hour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시간, 한 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>후에, 나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>come home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집으로 돌아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수프\u003c/span>\u003c/div>\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부수다, 깨뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의자\u003c/span>\u003c/div>\u003cdiv>\u003cb>cry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다, 울부짖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upstairs\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위층으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>휴대폰, 전화\u003c/span>\u003c/div>\u003cdiv>\u003cb>next to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~옆에\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끔찍한, 형편없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게시물\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다, 소리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>angrily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>화가 나서\u003c/span>\u003c/div>\u003cdiv>\u003cb>jump up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>벌떡 일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in surprise\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>놀라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>break into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>침입하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>permission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허락, 허가\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘못된, 틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>forgive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>용서하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>청소하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>end\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끝, 마지막\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. permission은 허락이라는 뜻이고, without permission은 허락 없이라는 표현이에요. break into는 침입하다, forgive는 용서하다라는 뜻이죠. terrible은 끔찍한, angrily는 화가 나서라는 의미로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">permission\u003c/b>\u003cspan class=\"m\">허락\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">approval\u003c/span>\u003cspan class=\"s\">authorization\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prohibition\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">끔찍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"s\">dreadful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">great\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wrong\u003c/b>\u003cspan class=\"m\">잘못된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incorrect\u003c/span>\u003cspan class=\"s\">mistaken\u003c/span>\u003cspan class=\"s\">improper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003cspan class=\"a\">correct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forgive\u003c/b>\u003cspan class=\"m\">용서하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pardon\u003c/span>\u003cspan class=\"s\">excuse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">blame\u003c/span>\u003cspan class=\"a\">punish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shout\u003c/b>\u003cspan class=\"m\">외치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">yell\u003c/span>\u003cspan class=\"s\">cry\u003c/span>\u003cspan class=\"s\">scream\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">whisper\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">angrily\u003c/b>\u003cspan class=\"m\">화가 나서\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">furiously\u003c/span>\u003cspan class=\"s\">madly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calmly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. permission은 consent, approval과 비슷하고 반대말은 prohibition이에요. terrible은 awful, horrible과 가깝고 반대는 wonderful이죠. wrong은 incorrect, mistaken과 같은 뜻이고 반대는 right예요. forgive는 pardon, excuse와 비슷하고 반대는 blame이나 punish랍니다. shout는 yell, cry와 비슷하고 반대는 whisper예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 한 시간 후에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">About \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">hour \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰 세 마리가\u003c/span>\u003cspan class=\"en\">three bears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집으로 돌아왔다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시간이 얼마나 흘렀는지 알려 주는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b> 문장이에요. About은 정확한 시간이 아니라 \u003cb class=\"key\">대략\u003c/b>을 나타내고, home은 '집으로'라는 뜻으로 쓰였어요. 곰 세 마리가 집으로 돌아오면서 사건이 본격적으로 시작되는 \u003cb class=\"key\">신호\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구(전치사 about + 시간 표현 + later)\u003c/span> : [About + 시간 명사구 + later] = '약 ~ 후에' : \"약 한 시간 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 부사 home (전치사 없는 부사 용법)\u003c/span> : come [자동사] + home [부사] : \"집으로 돌아왔다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"About an hour later, 약 한 시간 후에. three bears, 곰 세 마리가. came home, 집으로 돌아왔다.. 이 문장 전체를 해석하면, 약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시간이 얼마나 흘렀는지 알려 주는 장면 전환 신호예요. About은 정확한 시간이 아니라 대략을 나타내고, home은 집으로라는 뜻으로 쓰였죠. 곰 세 마리가 집으로 돌아오면서 사건이 본격적으로 시작돼요.","hl":"mn"},{"n":14,"text":"먼저 About an hour later를 볼게요. about은 시간이나 수 앞에서 대략이라는 뜻을 더하고, later는 시간 순서를 나타내는 부사예요. 다음으로 came home인데요, home이 집으로라는 부사로 쓰이면 to를 붙이지 않아요. 그래서 to home이 아니라 그냥 home이라고 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 내 수프를 먹고\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Someone\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ate \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">soup \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 의자를 부서뜨렸어요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">broke \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">chair\u003c/span>!&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 아기곰이 외쳤다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cried \u003c/span>\u003cspan class=\"tgt\">Baby \u003c/span>\u003cspan class=\"tgt\">Bear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!”라고 아기곰이 외쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기곰이 자기 수프와 의자가 망가진 것을 보고 \u003cb class=\"key\">화가 \u003c/b>\u003cb class=\"key\">나서\u003c/b> 외치는 장면이에요. 앞에서 곰들이 집으로 돌아왔으니, 이제 각자 자기 물건의 \u003cb class=\"key\">피해\u003c/b>를 확인하는 흐름이죠. cried는 여기서 소리 내어 외쳤다는 뜻으로 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 someone의 단수 취급\u003c/span> : someone [단수 주어] + 단수동사 : \"누군가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 동사구 병렬\u003c/span> : 주어 + [동사 A] + and + [동사 B] : \"내 수프를 먹고 내 의자를 부서뜨렸어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤의 주어-동사 도치\u003c/span> : &quot;인용문&quot; + [동사] + [주어] : \"라고 아기곰이 외쳤다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Someone ate my soup, 누군가 내 수프를 먹고. and broke my chair!, 내 의자를 부서뜨렸어요!. cried Baby Bear, 라고 아기곰이 외쳤다.. 이 문장 전체를 해석하면, “누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!”라고 아기곰이 외쳤다.","hl":"m"},{"n":16,"text":"두 번째 문장은 아기곰이 자기 수프와 의자가 망가진 걸 보고 화가 나서 외치는 장면이에요. 앞에서 곰들이 집으로 돌아왔으니, 이제 각자 자기 물건의 피해를 확인하는 흐름이죠. cried는 여기서 소리 내어 외쳤다는 뜻으로 쓰였어요.","hl":"mn"},{"n":17,"text":"먼저 Someone을 볼게요. someone은 부정대명사라서 단수 취급을 하고 단수동사를 써요. 다음으로 ate my soup and broke my chair를 보면, ate와 broke가 and로 연결된 병렬 구조이고 주어 Someone을 함께 공유해요. 마지막으로 cried Baby Bear는 인용문 뒤에서 동사가 주어보다 먼저 나오는 도치예요. 이렇게 쓰면 장면이 훨씬 생생하게 느껴집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 위층으로 가서\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">upstairs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks를 봤다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003cspan class=\"tgt\">Goldilocks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 위층으로 가서 Goldilocks를 봤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰들이 위층으로 올라가 Goldilocks를 발견하는 \u003cb class=\"key\">장면\u003c/b>을 이어 주는 문장이에요. 두 동작이 \u003cb class=\"key\">순서\u003c/b>대로 이어짐을 and가 나타내죠. 여기서 Goldilocks가 등장하면서 이야기가 다음 사건으로 넘어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 부사 upstairs (전치사 없는 부사 용법)\u003c/span> : go [자동사] + upstairs [부사] : \"위층으로 갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 동사 병렬\u003c/span> : [동사 A] + and + [동사 B(시제 일치)] : \"그리고 Goldilocks를 봤다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They went upstairs, 그들은 위층으로 가서. and saw Goldilocks, Goldilocks를 봤다.. 이 문장 전체를 해석하면, 그들은 위층으로 가서 Goldilocks를 봤다.","hl":"m"},{"n":19,"text":"세 번째 문장은 곰들이 위층으로 올라가 Goldilocks를 발견하는 장면을 이어 주는 문장이에요. went upstairs처럼 upstairs는 위층으로라는 부사로 쓰여서 전치사 없이 바로 오죠. 두 동작이 순서대로 이어짐을 and가 나타내고, Goldilocks가 등장하면서 이야기가 다음 사건으로 넘어갑니다.","hl":"mn"},{"n":20,"text":"먼저 went upstairs를 볼게요. upstairs가 위층으로라는 부사로 쓰여서 전치사 없이 바로 동사 뒤에 와요. 그래서 to upstairs라고 하지 않습니다. 다음으로 and saw Goldilocks를 보면, went와 saw가 모두 과거형으로 시제를 맞춰 and로 병렬 연결됐어요. 그래서 두 동작이 시간 순서대로 이어진다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마곰이\u003c/span>\u003cspan class=\"en\">Mother Bear\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대폰을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">phone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks 옆에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Goldilocks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마곰이 집으로 돌아온 뒤 Goldilocks 옆에서 \u003cb class=\"key\">휴대폰\u003c/b>을 발견한 장면이에요. 이 휴대폰 발견은 Goldilocks가 집에 침입했을 뿐만 아니라 사진을 \u003cb class=\"key\">게시\u003c/b>했을 가능성을 알려 주는 중요한 단서예요. 그래서 다음 문장에서 엄마곰이 화를 내는 흐름으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : [주어 Mother Bear] + [동사 found] + [목적어 a phone] : \"휴대폰을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식\u003c/span> : [명사 a phone] + [전치사구 next to Goldilocks] : \"Goldilocks 옆에 있는 휴대폰\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Mother Bear, 엄마곰이. found, 발견했다. a phone, 휴대폰을. next to Goldilocks, Goldilocks 옆에서. 이 문장 전체를 해석하면, 엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.","hl":"m"},{"n":22,"text":"이 문장은 엄마곰이 Goldilocks 옆에서 휴대폰을 발견한 장면이에요. 이 휴대폰은 Goldilocks가 사진을 게시했을 가능성을 보여 주는 중요한 단서가 되죠. 그래서 다음에 엄마곰이 화를 내는 흐름으로 자연스럽게 이어져요.","hl":"mn"},{"n":23,"text":"첫 번째로 found a phone은 found라는 타동사 뒤에 목적어 a phone이 오는 삼형식 문장이에요. 그래서 휴대폰을 발견했다라고 해석하죠. 두 번째로 next to Goldilocks는 전치사구로 앞의 명사 a phone을 꾸며 Goldilocks 옆에 있는 휴대폰이라고 위치를 설명해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끔찍해!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">terrible\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“끔찍해!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마곰이 집에 돌아와 상황을 보고 놀라며 내뱉는 \u003cb class=\"key\">감탄\u003c/b> 표현이에요. ‘This is terrible!’은 ‘이건 \u003cb class=\"key\">끔찍해\u003c/b>!’라는 뜻으로, 곰 가족의 집이 엉망이 된 상황에 대한 강한 부정적 감정을 보여 줘요. 바로 다음 문장에서 그 이유를 게시물 사진으로 설명하게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : This [단수 지시대명사] + is : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 동사 + 주격보어\u003c/span> : [주어 This] + [동사 is] + [주격보어 terrible] : \"끔찍하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"This, 이것은. is, 이다. terrible!, 끔찍해!. 이 문장 전체를 해석하면, “끔찍해!","hl":"m"},{"n":25,"text":"이 문장은 엄마곰이 상황을 보고 놀라며 내뱉는 감탄 표현이에요. This is terrible은 이건 끔찍해라는 뜻으로, 집이 엉망이 된 상황에 대한 강한 부정적 감정을 보여 주죠. 바로 다음 문장에서 그 이유가 게시물 사진이라고 설명돼요.","hl":"mn"},{"n":26,"text":"첫 번째로 This는 앞의 상황 전체를 가리키는 지시대명사예요. 그래서 단수로 보고 is와 함께 씁니다. 두 번째로 is terrible은 be동사 is 뒤에 형용사 terrible이 오는 이형식 문장이에요. 이때 terrible은 주어 This의 상태를 설명하는 주격보어가 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 봐요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 집에 관한 이 모든 게시물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">posts\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">shouted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko cks가 올린 게시물을 보며 화를 내는 장면이에요. Look at은 게시물을 보라고 주의를 끄는 명령문이고, 인용문 뒤의 shouted Mother Bear는 엄마곰이 화가 나서 외쳤다는 뜻을 강조하죠. 그래서 Goldilocks가 잘못을 깨닫게 되는 흐름으로 이어져요.","hl":"mn"},{"n":29,"text":"첫 번째로 Look at은 동사원형으로 시작하는 명령문이에요. 상대에게 게시물을 보라고 주의를 끄는 표현이죠. 두 번째로 all these posts는 all과 these가 복수명사 posts를 꾸미는 복수 명사구예요. 세 번째로 of our home은 앞의 명사 posts를 뒤에서 꾸미는 전치사구고요. 네 번째로 shouted Mother Bear는 직접 인용문 뒤에서 동사가 주어 앞으로 나가는 도치 형태예요. 다섯 번째로 angrily는 동사 shouted를 꾸미는 부사로 화가 난 상태를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks는\u003c/span>\u003cspan class=\"en\">Goldilocks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌떡 일어났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">jumped \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">surprise\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Goldilocks는 놀라서 벌떡 일어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰 가족이 화를 내며 소리치는 장면 바로 다음에 나오는 문장으로, Goldilocks가 \u003cb class=\"key\">놀라서\u003c/b> 몸을 일으키는 즉각적인 반응을 보여 줘요. 이 반응이 있어서 아빠곰이 \u003cb class=\"key\">꾸짖는\u003c/b> 다음 대화가 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사)\u003c/span> : jump [자동사] + up [부사] → '벌떡 일어나다' : \"벌떡 일어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(감정의 원인)\u003c/span> : in + [추상명사 surprise] → '놀라서' : \"놀라서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Goldilocks, Goldilocks는. jumped up, 벌떡 일어났다. in surprise, 놀라서. 이 문장 전체를 해석하면, Goldilocks는 놀라서 벌떡 일어났다.","hl":"m"},{"n":31,"text":"곰 가족이 화를 내며 소리치는 바로 다음 장면이에요. Goldilocks가 놀라서 몸을 일으키는 반응을 보여 주죠. 이 반응 덕분에 아빠곰이 꾸짖는 다음 대화로 자연스럽게 이어집니다.","hl":"mn"},{"n":32,"text":"먼저 jumped up을 보세요. jump만 쓰면 뛰다라는 뜻인데, up이 붙어서 구동사가 되면 벌떡 일어나다라는 뜻이 돼요. 여기서 up은 위쪽 방향이 아니라 동작이 완전히 이루어졌다는 걸 나타내는 부사예요. 두 번째로 in surprise를 보세요. 전치사 in 뒤에 감정을 나타내는 추상명사가 오면 놀라서라는 뜻의 부사구가 됩니다. 그래서 이 문장은 Goldilocks가 놀라서 벌떡 일어났다라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 우리 집에 침입했어\u003c/span>\u003cspan class=\"en\">&quot;You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">broke \u003c/span>\u003cspan class=\"tgt\">into\u003c/span> our house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이 사진들을 올렸어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">posted\u003c/span> these pictures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 허락 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">permission\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠곰이 Goldilocks의 잘못을 또렷하게 지적하는 문장이에요. 집에 \u003cb class=\"key\">침입\u003c/b>한 행동과 허락 없는 \u003cb class=\"key\">게시\u003c/b>라는 두 가지 잘못을 and로 묶어 \u003cb class=\"key\">나열\u003c/b>하고 있죠. 그래서 잘못이 하나가 아니라 둘이라는 점을 분명히 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사+전치사)\u003c/span> : break [자동사] + into [전치사] + [목적어 our house] → '~에 침입하다' : \"침입했어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [과거동사 broke] + and + [과거동사 posted] → 두 동작을 대등하게 연결 : \"그리고 올렸어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 without + 명사구의 부사적 용법\u003c/span> : without + [명사구 our permission] → '우리의 허락 없이' : \"우리의 허락 없이\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"\"You broke into our house, 너는 우리 집에 침입했어. and posted these pictures, 그리고 이 사진들을 올렸어. without our permission, 우리의 허락 없이. 이 문장 전체를 해석하면, “너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어.","hl":"m"},{"n":34,"text":"아빠곰이 Goldilocks의 잘못을 또렷하게 지적하는 문장이에요. 집에 침입한 행동과 허락 없는 게시라는 두 가지 잘못을 and로 묶어 나열하고 있죠. 그래서 잘못이 하나가 아니라 둘이라는 점을 분명히 해 줍니다.","hl":"mn"},{"n":35,"text":"먼저 broke into를 보세요. break는 부수다라는 뜻인데 into와 만나면 구동사가 되어서 침입하다라는 뜻이 돼요. 뒤에 목적어 our house가 와서 우리 집에 침입하다가 됩니다. 두 번째로 and posted를 보세요. and는 같은 품사와 같은 시제의 표현을 대등하게 이어 주는 접속사라서 broke와 posted가 나란히 과거형으로 연결돼요. 세 번째로 without our permission을 보세요. without은 없이라는 뜻의 전치사이고 뒤에는 명사나 동명사가 오는데, 여기서는 our permission이라는 명사구가 와서 우리의 허락 없이라는 부사구가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 모르니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 것들이 잘못이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 아빠곰이 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Father \u003c/span>\u003cspan class=\"tgt\">Bear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부정의문문으로 물으면서 사실상 강하게 \u003cb class=\"key\">꾸짖는\u003c/b> 표현이에요. '모르니?'라고 되물어 상대가 잘못을 \u003cb class=\"key\">인식\u003c/b>하지 못한 점을 지적하는 거죠. 말한 내용 뒤에 said Father Bear를 도치해 놓아 누가 말했는지를 분명히 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문\u003c/span> : Don't + [주어 you] + [동사 know] ~? → '~하지 않니?' : \"너는 모르니\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(명사절 목적어)\u003c/span> : know + [(that) + these things + are wrong] → '~라는 것을 알다' : \"이런 것들이 잘못이라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤의 주어-동사 도치\u003c/span> : [인용문] + said + [주어 Father Bear] → '라고 ~가 말했다' : \"라고 아빠곰이 말했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Don't you know, 너는 모르니. these things are wrong?\", 이런 것들이 잘못이라는 것을. said Father Bear, 라고 아빠곰이 말했다. 이 문장 전체를 해석하면, 너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.","hl":"m"},{"n":37,"text":"이 문장은 부정의문문으로 물으면서 사실상 강하게 꾸짖는 표현이에요. 모르니라고 되물어서 상대가 잘못을 인식하지 못한 점을 지적하는 거죠. 마지막에 말한 사람을 붙여 아빠곰의 화난 마음을 전달합니다.","hl":"mn"},{"n":38,"text":"먼저 Don't you know를 보세요. 일반동사 의문문에 not이 붙어서 부정의문문이 됐어요. 부정의문문은 단순한 질문이 아니라 놀람이나 책망의 감정을 담아 상대를 압박할 때 씁니다. 두 번째로 these things are wrong을 보세요. know 뒤에 이런 것들이 잘못이라는 명사절이 목적어로 오는데, 이때 접속사 that은 생략되어도 문장 성분이 그대로 남아요. 세 번째로 said Father Bear를 보세요. 말한 내용을 직접 인용한 뒤에는 said와 주어의 순서를 바꾸는 도치가 흔히 쓰입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제발\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Please \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저를 용서해 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">forgive \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">용서해 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 자신의 잘못을 인정하고 곰 가족에게 정중히 용서를 구하는 말이에요. Please를 붙인 \u003cb class=\"key\">명령문\u003c/b>으로 간절하고 \u003cb class=\"key\">공손한 \u003c/b>\u003cb class=\"key\">부탁\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(부탁의 Please)\u003c/span> : Please + [동사원형] + [목적어] : \"제발 저를 용서해 주세요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Please, 제발. forgive me, 저를 용서해 주세요. 이 문장 전체를 해석하면, 용서해 주세요.","hl":"m"},{"n":40,"text":"여기는 Goldilocks가 잘못을 인정하고 곰 가족에게 정중히 용서를 구하는 장면이에요. Please가 붙은 명령문으로 간절한 부탁을 나타내죠.","hl":"mn"},{"n":41,"text":"여기서 눈여겨볼 것은 명령문이에요. Please forgive me는 Please가 붙은 명령문이라서 주어 You가 생략되고 동사원형 forgive로 시작해요. 그래서 제발 저를 용서해 주세요라는 공손한 부탁이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 죄송해요,\u003c/span>\u003cspan class=\"en\">I'm so sorry,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여러분 집을 청소할게요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'll \u003c/span>\u003cspan class=\"tgt\">clean\u003c/span> your house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름이 끝날 때까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">summer\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks가 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Goldilocks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요. Goldilocks가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 사과하면서 여름이 끝날 때까지 매일 집을 청소하겠다고 \u003cb class=\"key\">약속\u003c/b>하는 문장이에요. 잘못을 인정하고 \u003cb class=\"key\">보상\u003c/b>하겠다는 태도를 보여 주어 이야기가 화해로 마무리되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (미래·의지)\u003c/span> : [주어] + will + [동사원형] : \"청소할게요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 until (시간의 종료점)\u003c/span> : until + [시점을 나타내는 명사구] : \"여름이 끝날 때까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤 도치 (동사 + 주어)\u003c/span> : [인용문] + said + [주어] : \"Goldilocks가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I'm so sorry, 정말 죄송해요. and I'll clean your house, 그리고 여러분 집을 청소할게요. every day, 매일. until the end of the summer, 여름이 끝날 때까지. said Goldilocks, Goldilocks가 말했다. 이 문장 전체를 해석하면, 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요. Goldilocks가 말했다.","hl":"m"},{"n":43,"text":"Goldilocks가 사과하면서 여름이 끝날 때까지 매일 집을 청소하겠다고 약속하는 문장이에요. 잘못을 인정하고 보상하겠다는 태도가 담겨 있어서 이야기가 화해로 마무리되죠.","hl":"mn"},{"n":44,"text":"먼저 I'll clean에서 will은 미래와 의지를 나타내는 조동사라서 뒤에 동사원형 clean이 와요. 두 번째로 until은 어떤 일이 끝나는 시점까지 계속된다는 뜻이고, 뒤에 the end of the summer라는 명사구가 와서 그 시점을 알려 줘요. 세 번째로 said Goldilocks는 직접 인용문 뒤에서 말한 사람을 밝히는 표현인데, 동사 said가 주어 Goldilocks 앞에 오는 도치가 일어난 걸 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>약 한 시간 후에 곰 세 마리가 집으로 돌아오자, 아기곰은 누군가 자기 \u003cb class=\"key\">수프\u003c/b>를 먹고 \u003cb class=\"key\">의자\u003c/b>를 부서뜨렸다고 외쳤다.\u003c/li>\u003cli>곰들은 위층에서 \u003cb class=\"key\">Goldilocks\u003c/b>를 보고, 엄마곰은 그 옆에서 \u003cb class=\"key\">휴대폰\u003c/b>을 발견해 허락 없이 올라온 게시물들을 보고 화를 냈다.\u003c/li>\u003cli>아빠곰은 골디락스가 집에 \u003cb class=\"key\">침입\u003c/b>해 허락 없이 사진을 올린 것이 잘못이라고 지적했다.\u003c/li>\u003cli>골디락스는 용서를 구하고 여름이 끝날 때까지 매일 집을 \u003cb class=\"key\">청소\u003c/b>하겠다고 사과했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Goldilocks apologizes for breaking into the bears' house and posting pictures without permission, promising to clean their house every day until the end of the summer.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">곰 세 마리가 집으로 돌아와 골디락스가 \u003cb class=\"key\">수프\u003c/b>를 먹고 \u003cb class=\"key\">의자\u003c/b>를 부수고 허락 없이 집 사진을 \u003cb class=\"key\">게시물\u003c/b>로 올린 것을 발견한다. 골디락스는 잘못을 인정하고 여름이 끝날 때까지 매일 집을 \u003cb class=\"key\">청소\u003c/b>하겠다고 사과한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 지문은 골디락스가 남의 집에 침입해서 사진을 올린 잘못을 인정하고, 여름이 끝날 때까지 청소하겠다고 사과하는 이야기였어요. 시간순으로 사건이 이어지고 결론이 마지막에 나오는 미괄식 구조라는 점을 꼭 기억해 두세요. 핵심 단어와 동의어, 반의어도 함께 복습하면 좋겠어요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
