<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 8과 본문2","audioDir":"2_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(윤)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Goldilocks Takes Selfies in the Cottage\u003c/h1>\u003ch2>골디락스, 오두막에서 셀피를 찍다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 어느 날 Goldilocks가 숲속 \u003cb class=\"key\">오두막집\u003c/b>을 발견하고 들어가서, 수프를 먹고 의자를 부수고 \u003cb class=\"key\">셀피\u003c/b>를 찍어 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 올린 뒤, 위층 가장 작은 침대에서 잠든 이야기이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>요지: Goldilocks enters an empty cottage, carelessly eats the soup, breaks a chair, posts selfies on social media, and falls asleep in the smallest bed.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일 학년 동아 윤 선생님 교과서 본문을 함께 공부할 거예요. 골디락스가 숲속 오두막에 들어가서 벌어지는 이야기이고, 원작 동화를 현대적으로 바꾼 재미있는 지문이에요. 요약하면, 골디락스가 오두막에서 수프를 먹고 의자를 부수고 셀피를 찍어 소셜 미디어에 올린 뒤 침대에서 잠든다는 내용이에요. 요지는 남의 집에서 자기 마음대로 행동하는 골디락스의 모습을 시간 순서로 보여 준다는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 전래 동화 Goldilocks and the Three Bears를 현대적으로 각색한 \u003cb class=\"key\">retelling\u003c/b>입니다. 원작에서 골디락스는 실수로 남의 물건을 망가뜨리고 미안해하지만, 이 글에서는 \u003cb class=\"key\">SNS\u003c/b> 세대의 캐릭터로 바뀌어 자기 행동을 즐기고 사진으로 남깁니다. 이렇게 사건이 일어난 순서대로 이어지는 글을 \u003cb class=\"key\">서사문\u003c/b>(narrative)이라고 하며, 등장인물의 행동과 그 결과에 주목하며 읽어야 합니다. 사건의 원인과 결과를 따라가는 것은 마치 드라마를 처음부터 끝까지 보면서 장면을 이어 붙이는 것과 같습니다. 장면이 바뀔 때 나오는 One day, Then 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>은 다음 장면으로 넘어가는 신호가 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 볼게요. 이 지문은 전래 동화인 Goldilocks and the Three Bears를 현대적으로 각색한 retelling이에요. 원작에서 골디락스는 실수로 남의 물건을 망가뜨리고 미안해하지만, 이 글에서는 SNS 세대의 캐릭터로 바뀌어서 자기 행동을 즐기고 사진으로 남겨요. 이렇게 사건이 일어난 순서대로 이어지는 글을 서사문, 영어로 narrative라고 합니다. 서사문은 등장인물의 행동과 그 결과에 주목하면서 읽어야 해요. 이건 마치 드라마를 처음부터 끝까지 보면서 장면을 이어 붙이는 것과 같아요. 그리고 One day나 Then 같은 시간 표현이 나오면 다음 장면으로 넘어가는 신호라고 생각하면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>오두막 발견\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>어느 날 그녀는 숲에서 \u003cb class=\"key\">산책\u003c/b>을 하다가 한 오두막집을 발견합니다. 그녀는 \u003cb class=\"key\">문을 \u003c/b>\u003cb class=\"key\">두드렸지만\u003c/b> 아무 대답이 없었어요. 날이 어두워지고 비가 내리기 시작하면서 상황이 점점 급해집니다. 이야기의 배경과 문제 상황이 여기서 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>집 안으로\u003csmall>전개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>그녀는 \u003cb class=\"key\">문을 \u003c/b>\u003cb class=\"key\">열고\u003c/b> 안으로 걸어 들어갔어요. 식탁 위에는 수프 세 그릇이 있었고, 그녀는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">그릇\u003c/b>의 수프를 먹었습니다. 그리고 미소를 지으며 \u003cb class=\"key\">셀피\u003c/b>를 찍었죠. 남의 집이라는 사실은 전혀 신경 쓰지 않는 모습입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의자를 부수다\u003csmall>절정 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>의자도 세 개 있었는데, 그녀는 가장 작은 의자 위에서 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">번이고\u003c/b> 뛰었어요. 결국 \u003cb class=\"key\">의자가 \u003c/b>\u003cb class=\"key\">부서졌지만\u003c/b> 그녀는 신경 쓰지 않았습니다. 그녀는 다시 셀피를 찍어 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 모두 올렸죠. 재미있다고 외치는 장면에서 그녀의 무책임함이 가장 잘 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>침대에서 잠들다\u003csmall>결말 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>그런 다음 그녀는 \u003cb class=\"key\">위층으로 \u003c/b>\u003cb class=\"key\">올라가\u003c/b> 침대 세 개를 발견했어요. 그녀는 피곤해서 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">침대\u003c/b>에서 잠들었습니다. 남의 집에서 벌어진 일이 그녀의 잠으로 끝나면서 이야기가 \u003cb class=\"key\">결말\u003c/b>을 맞습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문을 네 단계로 나누어서 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 오두막 발견이에요. 어느 날 골디락스는 숲에서 산책을 하다가 한 오두막집을 발견해요. 그녀는 문을 두드렸지만 아무 대답이 없었죠. 그리고 날이 어두워지고 비가 내리기 시작하면서 상황이 점점 급해집니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그녀가 집 안으로 들어가요. 그녀는 문을 열고 안으로 걸어 들어갑니다. 식탁 위에는 수프 세 그릇이 있었고, 그녀는 가장 작은 그릇의 수프를 먹어요. 그리고 미소를 지으며 셀피를 찍습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 의자를 부수는 장면이에요. 의자도 세 개 있었는데, 그녀는 가장 작은 의자 위에서 몇 번이고 뛰어요. 결국 의자가 부서졌지만 그녀는 신경 쓰지 않았습니다. 그리고 다시 셀피를 찍어서 소셜 미디어에 모두 올려요.","hl":"f2"},{"n":7,"text":"마지막 단계는 침대에서 잠드는 결말이에요. 그런 다음 그녀는 위층으로 올라가서 침대 세 개를 발견합니다. 그녀는 피곤해서 가장 작은 침대에서 잠들어요. 이렇게 남의 집에서 벌어진 일이 그녀의 잠으로 끝이 납니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 One day와 Then 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 따라 사건이 일어난 순서대로 이어지는 \u003cb class=\"key\">서사문\u003c/b>입니다. 뚜렷한 주제문 없이 행동이 나열되다가 마지막 문장에서 잠드는 장면으로 끝나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요. 발견, 침입, 식사, 파손, 업로드, 잠이라는 행동이 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 연결되고 장소도 아래층에서 위층으로 이동합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>시간 도입\u003c/span>\u003cb>but (2)\u003c/b>\u003cspan>대조·반전\u003c/span>\u003cb>again and again (8)\u003c/b>\u003cspan>반복 강조\u003c/span>\u003cb>Then (12)\u003c/b>\u003cspan>순서 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">taking a walk in the forest\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">opened the door and walked inside\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">went upstairs\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간 순서예요. 처음부터 끝까지 사건이 일어난 순서대로 이어지는 서사문이죠. 뚜렷한 주제문이 따로 없고 행동이 나열되다가 마지막 문장에서 잠드는 장면으로 끝나기 때문에 미괄식 구조로 볼 수 있어요. 그래서 읽을 때는 각 장면의 순서와 장소 변화를 중심으로 따라가면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 먼저 보면, 첫 번째 문장의 One day가 이야기의 시간을 열어 주고, 열두 번째 문장의 Then이 다음 장면으로 넘어가는 신호예요. 두 번째 문장의 but은 아무 대답이 없었다는 반전을 만들어 주고, 여덟 번째 문장의 again and again은 반복되는 행동을 강조합니다. 또 수프 세 그릇, 의자 세 개, 침대 세 개처럼 숫자 three가 반복되면서 장소가 바뀌어도 같은 구조가 이어지는 걸 보여 줘요. 이런 재진술과 반복을 잡으면 이야기 구조가 한눈에 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>One day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a walk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산책하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cottage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오두막집\u003c/span>\u003c/div>\u003cdiv>\u003cb>knock on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 두드리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대답\u003c/span>\u003c/div>\u003cdiv>\u003cb>get dark\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어두워지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>start to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기 시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비가 내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk inside\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안으로 걸어 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bowl\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>soup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수프\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smallest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>take selfies\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>셀피를 찍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>with a smile\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>미소를 지으며\u003c/span>\u003c/div>\u003cdiv>\u003cb>chair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의자\u003c/span>\u003c/div>\u003cdiv>\u003cb>jump on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~위에서 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>again and again\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몇 번이고, 거듭\u003c/span>\u003c/div>\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부서지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>care\u003c/b>\u003cem>동사\u003c/em>\u003cspan>신경 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(인터넷에) 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소셜 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>upstairs\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위층으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel tired\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>피곤함을 느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall asleep\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠들다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. take a walk는 산책하다, cottage는 오두막집이라는 뜻이에요. knock on은 문을 두드리다, get dark는 어두워지다라는 표현이고요. jump on은 위에서 뛰다, fall asleep은 잠들다라는 뜻이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cottage\u003c/b>\u003cspan class=\"m\">오두막집\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cabin\u003c/span>\u003cspan class=\"s\">hut\u003c/span>\u003cspan class=\"s\">lodge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">answer\u003c/b>\u003cspan class=\"m\">대답\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reply\u003c/span>\u003cspan class=\"s\">response\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">question\u003c/span>\u003cspan class=\"a\">silence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break\u003c/b>\u003cspan class=\"m\">부서지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crack\u003c/span>\u003cspan class=\"s\">smash\u003c/span>\u003cspan class=\"s\">destroy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fix\u003c/span>\u003cspan class=\"a\">repair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shout\u003c/b>\u003cspan class=\"m\">외치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">yell\u003c/span>\u003cspan class=\"s\">cry out\u003c/span>\u003cspan class=\"s\">scream\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">whisper\u003c/span>\u003cspan class=\"a\">murmur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">post\u003c/b>\u003cspan class=\"m\">게시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">upload\u003c/span>\u003cspan class=\"s\">publish\u003c/span>\u003cspan class=\"s\">share\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">delete\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">care\u003c/b>\u003cspan class=\"m\">신경 쓰다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mind\u003c/span>\u003cspan class=\"s\">worry\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. find는 발견하다인데 discover, spot과 바꿔 쓸 수 있고 반대말은 lose예요. answer는 대답인데 reply, response와 같은 말이고 반대말은 question이나 silence죠. break는 부서지다로 crack, smash와 비슷하고 반대말은 fix, repair예요. shout는 외치다로 yell, cry out과 같고 반대말은 whisper입니다. care는 신경 쓰다로 mind와 비슷하고 반대말은 ignore, neglect예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 산책을 하고 있었다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲에서\u003c/span>\u003cspan class=\"en\">in the forest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 한 오두막집을 발견했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cottage\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기가 시작되는 도입 문장으로, 주인공이 숲에서 산책하던 중 우연히 오두막집을 발견하는 \u003cb class=\"key\">장면\u003c/b>을 그려 줘요. \u003cb class=\"key\">과거진행형\u003c/b> was taking은 하고 있던 \u003cb class=\"key\">배경\u003c/b> 행동을, 과거형 found는 그 배경 위에서 벌어진 \u003cb class=\"key\">사건\u003c/b>을 나타내 두 동작이 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : [주어] + was/were + [동사-ing] (~하고 있었다) : \"산책을 하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [was taking ...] + and + [found ...] (동사구와 동사구를 대등하게 연결) : \"그리고 한 오두막집을 발견했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One day, 어느 날. she was taking a walk, 그녀는 산책을 하고 있었다. in the forest, 숲에서. and found a cottage, 그리고 한 오두막집을 발견했다.. 이 문장 전체를 해석하면, 어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다.","hl":"m"},{"n":13,"text":"이 문장은 이야기가 시작되는 장면이에요. 숲에서 산책하다가 우연히 오두막집을 발견하는 장면이죠. 여기서 was taking은 과거진행형이고, 하고 있던 배경 행동을 나타내요. 그리고 found는 그 배경 위에서 갑자기 벌어진 사건을 콕 짚어 주는 과거형이에요.","hl":"mn"},{"n":14,"text":"어법 포인트를 짚어 볼게요. 첫 번째는 was taking a walk인데요, 과거의 어느 시점에 진행 중이던 동작을 나타내는 과거진행형이에요. 그래서 '산책을 하고 있었다'라고 해석하죠. 두 번째는 and found a cottage예요. 과거진행형과 과거형을 같은 주어에 이어 붙여 병렬로 연결한 구조예요. 그래서 '산책을 하다가 발견했다'라는 자연스러운 흐름이 만들어지는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 문을 두드렸다,\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">knocked \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">door\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 아무 대답이 없었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 문을 두드렸지만, 아무 대답이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀가 문을 두드렸지만 아무도 대답하지 않았다는 \u003cb class=\"key\">장면\u003c/b>이에요. 대답이 없다는 건 오두막집이 \u003cb class=\"key\">비어 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 느낌을 주고, 그래서 다음 문장에서 날이 어두워지고 비가 내리기 시작하는 쪽으로 이야기가 흘러가죠. 이 문장은 뒤에서 다가올 \u003cb class=\"key\">긴장\u003c/b>을 살짝 만들어 두는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 + 전치사 관용표현\u003c/span> : knock + on + [대상] (~을 두드리다) : \"문을 두드렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but (역접)\u003c/span> : [문장] + but + [문장] (앞뒤를 반대 관계로 연결) : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">There be 구문 + no 부정\u003c/span> : There + was + [명사] (~이 있었다) / no + [명사] (아무 ~도 없다) : \"아무 대답이 없었다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She knocked on the door, 그녀는 문을 두드렸다. but there was no answer, 그러나 아무 대답이 없었다.. 이 문장 전체를 해석하면, 그녀는 문을 두드렸지만, 아무 대답이 없었다.","hl":"m"},{"n":16,"text":"그녀가 문을 두드렸지만 아무도 대답하지 않았다는 장면이에요. 대답이 없다는 건 오두막집이 비어 있다는 느낌을 주죠. 그래서 다음 문장에서 날이 어두워지고 비가 내리기 시작하는 쪽으로 흘러가고요. 이 문장은 뒤에서 다가올 긴장을 살짝 만들어 두는 역할도 해요.","hl":"mn"},{"n":17,"text":"어법 포인트를 볼게요. 첫 번째는 knocked on the door예요. knock 뒤에 두드리는 대상이 오려면 전치사 on이 필요하고, knock on the door 전체가 문을 두드리다라는 관용표현이 돼요. 두 번째는 but이에요. 앞 문장과 뒤 문장을 반대 관계로 이어 주는 등위접속사이고, 기대와 다른 결과를 만드는 역접 표현이죠. 세 번째는 there was no answer인데요, There be 구문으로 ~이 있었다라는 뜻이고, 부정 형용사 no가 붙어서 아무 대답도 없었다는 완전 부정이 된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날이 어두워지고 있었다,\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">dark\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 비가 내리기 시작했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">날이 어두워지고 있었고, 비가 내리기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해가 지면서 주변 \u003cb class=\"key\">상황\u003c/b>이 점점 나빠지는 장면이에요. 어두워지고 비까지 내리기 시작하니, 소녀가 오두막집 안으로 들어갈 \u003cb class=\"key\">이유\u003c/b>가 자연스럽게 만들어진 \u003cb class=\"key\">흐름\u003c/b>이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형 (상태 변화의 진행)\u003c/span> : It + was + getting + [형용사] (~해지고 있었다) : \"어두워지고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and (나열)\u003c/span> : [문장] + and + [문장] (앞뒤를 나란히 연결) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : start + [to + 동사원형] (~하기 시작하다) : \"비가 내리기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It was getting dark, 날이 어두워지고 있었다. and it started to rain, 그리고 비가 내리기 시작했다.. 이 문장 전체를 해석하면, 날이 어두워지고 있었고, 비가 내리기 시작했다.","hl":"m"},{"n":19,"text":"해가 지면서 주변 상황이 점점 나빠지는 장면이에요. 어두워지고 비까지 내리기 시작하니까, 소녀가 오두막집 안으로 들어갈 이유가 자연스럽게 만들어지는 흐름이죠. 그래서 앞에서 문을 두드렸던 장면과 딱 이어지는 거예요.","hl":"mn"},{"n":20,"text":"어법 포인트를 짚어 볼게요. 첫 번째는 was getting dark예요. get은 되다라는 상태 변화를 나타내는 동사라서, 과거진행형과 만나면 점점 어두워지고 있었다는 진행의 느낌을 줘요. 여기서 It은 날씨를 나타내는 비인칭 주어라는 것도 꼭 기억해 두세요. 두 번째는 started to rain이에요. start 뒤에 to부정사가 와서 ~하기 시작하다라는 목적어 역할을 하고, to rain은 비가 내리는 동작을 가리켜요. 세 번째는 and인데요, 날이 어두워지는 상황과 비가 오는 상황을 나열해서 두 가지 상황이 함께 벌어지고 있음을 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문을 열고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">opened \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">door \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안으로 걸어 들어갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">walked \u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 문을 열고 안으로 걸어 들어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노크에도 대답이 없자 소녀가 직접 문을 열고 들어가는 장면으로, 소녀의 \u003cb class=\"key\">행동\u003c/b>이 한 걸음 더 나아감을 보여 줘요. opened와 walked가 and로 이어진 \u003cb class=\"key\">병렬\u003c/b> 구조라 문을 열고 들어가는 두 동작이 연속해서 일어났음을 알 수 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 인칭대명사\u003c/span> : She(주격) + [동사 opened] : \"그녀는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조(and)\u003c/span> : [동사1 opened] + [목적어 the door] + and + [동사2 walked] + [부사 inside] : \"문을 열고 안으로 걸어 들어갔다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She, 그녀는. opened the door, 문을 열고. and walked inside, 안으로 걸어 들어갔다. 이 문장 전체를 해석하면, 그녀는 문을 열고 안으로 걸어 들어갔다.","hl":"m"},{"n":22,"text":"이 문장은 금발머리 소녀가 노크 대신 직접 행동에 나서는 장면이에요. 앞에서 노크를 했는데 대답이 없었죠. 그래서 결국 스스로 문을 열고 안으로 걸어 들어갔다는 거예요.","hl":"mn"},{"n":23,"text":"먼저 첫 번째, 동사의 병렬 구조를 봐요. opened와 walked, 두 개의 과거동사가 and로 나란히 연결되어 있어요. 이렇게 같은 형태의 동사가 and로 이어지면 두 동작이 연속해서 일어났다는 뜻이 돼요. 두 번째, 주어 She는 앞 문장에 나온 Goldilocks를 다시 받는 주격 인칭대명사예요. 이름을 반복하지 않고 She로 받아서 문장이 훨씬 자연스럽죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수프 세 그릇이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">bowls \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">soup\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식탁 위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">table\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">식탁 위에는 수프 세 그릇이 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집 안으로 들어간 소녀의 눈에 식탁 위의 수프 세 그릇이 들어오는 \u003cb class=\"key\">장면\u003c/b>이에요. '무엇이 있다'는 것을 먼저 알려 주고, 어디에 있는지는 뒤에서 붙여 주는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There be 구문(유도부사 there)\u003c/span> : There + [be동사] + [주어] (~이 있다) : \"~이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(of) + 복수명사\u003c/span> : [수량 three] + [복수명사 bowls] + of + [명사 soup] : \"수프 세 그릇\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [전치사 on] + [관사 a] + [명사 table] : \"식탁 위에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"There were, ~이 있었다. three bowls of soup, 수프 세 그릇이. on a table, 식탁 위에. 이 문장 전체를 해석하면, 식탁 위에는 수프 세 그릇이 있었다.","hl":"m"},{"n":25,"text":"집 안으로 들어간 소녀의 눈에 식탁 위의 수프 세 그릇이 들어오는 장면이에요. '무엇이 있다'는 걸 먼저 알려 주고, 어디에 있는지는 뒤에서 말해 주는 방식이죠.","hl":"mn"},{"n":26,"text":"먼저 첫 번째, There were는 '무엇이 있다'를 말할 때 쓰는 유도부사 구문이에요. 진짜 주어는 There 뒤에 오는 three bowls of soup라는 걸 꼭 기억하세요. 두 번째, three bowls of soup에서 셀 수 있는 bowls로 그릇 수를 세고 of로 내용물 soup을 이어 줘요. 그래서 주어가 복수라서 be동사도 were가 된 거예요. 세 번째, on a table은 장소를 알려 주는 전치사구로, 문장 끝에서 '식탁 위에' 있다는 정보를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 먹었고\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 작은 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">smallest \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 셀피를 찍었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">selfies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미소를 지으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">smile\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소녀가 가장 작은 그릇의 수프를 먹고, 미소 지으며 셀피를 찍는 장면이에요. 가장 작은 것을 고르는 \u003cb class=\"key\">행동\u003c/b>과 곧바로 셀피를 찍는 모습에서 소녀의 \u003cb class=\"key\">성격\u003c/b>이 드러나죠. with a smile은 '미소를 지으며'라는 \u003cb class=\"key\">부대상황\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조(and)\u003c/span> : [동사1 ate] + [목적어] + and + [동사2 took] + [목적어] : \"먹었고 셀피를 찍었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급(the + 최상급)\u003c/span> : the + [최상급 형용사 smallest] + [명사 one] : \"가장 작은 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 with의 부대상황 표현\u003c/span> : with + [관사 a] + [명사 smile] (~하며, ~한 채로) : \"미소를 지으며\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"She ate, 그녀는 먹었고. the smallest one, 가장 작은 것을. and took selfies, 그리고 셀피를 찍었다. with a smile, 미소를 지으며. 이 문장 전체를 해석하면, 그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다.","hl":"m"},{"n":28,"text":"소녀가 가장 작은 그릇의 수프를 먹고, 미소 지으며 셀피를 찍는 장면이에요. 가장 작은 것을 고르는 행동과 곧바로 셀피를 찍는 모습에서 소녀의 성격이 드러나죠.","hl":"mn"},{"n":29,"text":"먼저 첫 번째, the smallest one을 보세요. 여러 개 중에서 고를 때 the와 최상급을 써서 '가장 작은 것'이라고 말해요. 여기서 one은 앞에 나온 bowls of soup 가운데 하나를 가리키는 대명사예요. 두 번째, ate와 took, 두 개의 과거동사가 and로 연결된 병렬 구조예요. 그래서 먹는 동작과 찍는 동작이 이어서 일어났다는 뜻이 되죠. 세 번째, with a smile은 '미소를 지으며'라는 뜻으로, 셀피를 찍는 동작과 미소가 동시에 일어난 부대상황을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 개의 의자가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">chairs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의자도 세 개 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 탁자 위의 수프 세 그릇을 말한 뒤, 이어서 방 안에 \u003cb class=\"key\">의자\u003c/b>가 세 개 있었다는 사실을 덧붙이는 문장이에요. 영어는 '무엇이 있다'를 말할 때 \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">is/are \u003c/b>\u003cb class=\"key\">구문\u003c/b>을 쓰고, 여기서는 \u003cb class=\"key\">also\u003c/b>를 넣어 '또한'이라는 뜻을 더하고 있죠. 금발머리가 집 안 물건을 하나씩 살펴보는 흐름을 자연스럽게 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(존재 표현)\u003c/span> : There + [be동사] + [주어(존재하는 것)] (주어가 복수면 are/were) : \"의자 세 개가 또한 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 also의 위치(be동사 뒤)\u003c/span> : [be동사] + [also] + [주어] : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There were, 있었다. also, 또한. three chairs, 세 개의 의자가. 이 문장 전체를 해석하면, 의자도 세 개 있었다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 수프 세 그릇을 말한 다음에, 방 안에 의자도 세 개 놓여 있었다는 걸 알려 주는 문장이에요. 영어에서 무엇이 있다고 할 때는 there을 문장 앞에 세우고 진짜 주어를 be동사 뒤에 놓는다는 것, 꼭 기억해 두세요. 여기서는 의자가 여러 개라서 were를 썼고, also가 들어가서 또한이라는 뜻이 더해졌어요.","hl":"mn"},{"n":32,"text":"어법 포인트는 두 가지예요. 첫 번째는 there is, there are 구문이에요. 무엇이 있다는 뜻을 만들 때 there을 문장 맨 앞에 두고, 진짜 주어는 be동사 뒤에 놓아요. 여기서는 의자가 복수라서 were를 쓴 거죠. 두 번째는 부사 also의 위치예요. also는 be동사가 있으면 그 뒤에 놓여요. 그래서 There were also three chairs 순서가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 뛰었다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">jumped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 작은 것 위에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">smallest \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 번이고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">again \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">again\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 금발머리가 세 의자 중에서 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">의자\u003c/b>를 골라 그 위에서 \u003cb class=\"key\">반복해서\u003c/b> 뛰는 장면이에요. 앞 문장의 three chairs를 \u003cb class=\"key\">one\u003c/b>으로 받아 '가장 작은 것'이라고 표현했고, \u003cb class=\"key\">again \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">again\u003c/b>으로 '몇 번이고'라는 반복을 강조합니다. 수프도 가장 작은 것을 골랐듯, 그녀의 장난기가 점점 커지고 있는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 on\u003c/span> : jump + [on + 장소] : \"~위에서 뛰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 + one(앞 명사를 대신하는 대명사)\u003c/span> : the + [최상급] + [one(앞 명사 대신)] : \"가장 작은 것(의자)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현(again and again)\u003c/span> : [again] + and + [again] : \"몇 번이고, 거듭\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"She jumped, 그녀는 뛰었다. on the smallest one, 가장 작은 것 위에서. again and again, 몇 번이고. 이 문장 전체를 해석하면, 그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다.","hl":"m"},{"n":34,"text":"여기서는 금발머리가 세 의자 중에서 가장 작은 의자를 골라 그 위에서 계속 뛰는 장면이에요. 앞에 나온 chairs를 다시 쓰지 않고 one으로 받아서 가장 작은 것이라고 표현했죠. 또 뛰고 또 뛰는 모습이 again and again이라는 표현에 담겨 있어요.","hl":"mn"},{"n":35,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째는 jumped on이에요. jump는 뛰다라는 자동사라서, 어디 위에서 뛰었는지 말하려면 전치사 on을 붙여서 장소를 이어 줘요. 두 번째는 the smallest one이에요. 최상급 앞에는 보통 the를 붙이고, one은 앞에 나온 chairs를 되풀이하지 않으려고 쓴 대명사예요. 세 번째는 again and again인데, 같은 말을 and로 이어서 몇 번이고라는 반복을 강조하는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 부서졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> broke,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 신경 쓰지 않았다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의자가 부서졌지만, 그녀는 신경 쓰지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가장 작은 의자가 \u003cb class=\"key\">부서졌지만\u003c/b>, 금발머리는 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">쓰지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>는 문장이에요. 여기서 \u003cb class=\"key\">It\u003c/b>은 바로 앞에 나온 the smallest one, 즉 그 의자를 가리키고, \u003cb class=\"key\">but\u003c/b>이 '부서짐'과 '무관심'이라는 반대 내용을 이어 줍니다. 물건을 함부로 다루는 그녀의 무책임한 태도가 점점 커지는 흐름을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시(앞에 나온 명사 받기)\u003c/span> : [It] + 동사 ~ (앞 문장의 [the smallest one]을 대신함) : \"그것은(그 의자는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [문장] + but + [문장] : \"그러나, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">일반동사의 과거 부정(did not + 동사원형)\u003c/span> : [주어] + [did not(didn't)] + [동사원형] : \"신경 쓰지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It broke, 그것은 부서졌다. but, 그러나. she didn't care, 그녀는 신경 쓰지 않았다. 이 문장 전체를 해석하면, 의자가 부서졌지만, 그녀는 신경 쓰지 않았다.","hl":"m"},{"n":37,"text":"이 문장은 가장 작은 의자가 부서졌는데도 금발머리가 아무렇지 않게 넘어갔다는 걸 보여 줘요. 여기서 It은 바로 앞에 나온 the smallest one, 그러니까 그 의자를 가리켜요. 부서졌다는 내용과 신경 쓰지 않았다는 내용이 서로 반대라서 but으로 이어 준 거예요.","hl":"mn"},{"n":38,"text":"어법 포인트를 순서대로 볼게요. 첫 번째는 It인데요, 앞에 나온 the smallest one을 그대로 대신하는 대명사예요. 그래서 해석할 때는 그 의자가라고 풀어 주면 자연스러워요. 두 번째는 but이에요. 앞 내용과 뒤 내용이 반대일 때 문장과 문장 사이를 but으로 이어 줘요. 세 번째는 didn't care인데, 일반동사를 부정할 때는 did not을 쓰고 동사는 원형으로 돌려놔요. 그래서 과거인데도 cared가 아니라 care가 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;너무 재미있어!&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;It's \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">fun!&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shouted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Goldilocks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“너무 재미있어!”라고 Goldilocks가 외쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 작은 의자에서 뛰어놀며 즐거움을 크게 터뜨리는 장면이에요. \u003cb class=\"key\">인용문\u003c/b>이 문장 앞에 나와 감정을 생생하게 전하고, 뒤에서는 \u003cb class=\"key\">동사+주어\u003c/b> 순서가 쓰여 동화다운 리듬을 만들어 줘요. 남의 집에서 마음대로 즐기는 이 모습이 뒤에 이어질 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 살짝 예고한답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄 표현 (so + 형용사)\u003c/span> : It is + [[so]] + [형용사] : '정말 ~해' : \"&quot;너무 재미있어!&quot;\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어·동사 도치\u003c/span> : [인용문] + [동사] + [주어] : \"Goldilocks가 외쳤다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"\"It's so fun!\", \"너무 재미있어!\". shouted, 외쳤다. Goldilocks, Goldilocks가. 이 문장 전체를 해석하면, “너무 재미있어!”라고 Goldilocks가 외쳤다.","hl":"m"},{"n":40,"text":"이 문장은 Goldilocks가 작은 의자에서 뛰놀면서 신나 하는 장면이에요. 인용문이 앞에 나와서 감정을 아주 생생하게 보여 주고, 뒤에서는 동사가 주어보다 먼저 나오는 도치가 쓰여 동화다운 리듬을 만들어 줘요. 남의 집에서 마음대로 즐기는 이 모습이 뒤에 이어질 문제 상황을 살짝 예고한답니다.","hl":"mn"},{"n":41,"text":"먼저 첫 번째 어법 포인트는 감탄 표현이에요. It's so fun! 에서 so는 형용사 fun 앞에서 정도를 강하게 만들어 주는 말이죠. 두 번째는 인용문 뒤에 온 도치인데요, 인용문이 문장 앞에 오면 shouted Goldilocks처럼 동사가 주어보다 먼저 나온다는 걸 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 셀피를 찍었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">selfies\u003c/span> again\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 올렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">posted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 셀피를\u003c/span>\u003cspan class=\"en\">all the selfies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 셀피를 찍는 데서 끝나지 않고 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 올리는 행동까지 이어지는 문장이에요. \u003cb class=\"key\">and\u003c/b>가 두 동작을 자연스럽게 묶고, 찍은 셀피를 전부 올렸다는 점에서 그녀의 \u003cb class=\"key\">과시\u003c/b> 성향이 드러나요. 앞 문장의 셀피 장면을 한 단계 더 키워 주는 역할이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (take + selfie)\u003c/span> : take + [[selfie(s)]] : '셀피를 찍다' : \"셀피를 찍었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 동사 병렬\u003c/span> : [동사 과거] + and + [동사 과거] : \"그리고 올렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on (게시 장소)\u003c/span> : post + [목적어] + [[on]] + [장소] : \"소셜 미디어에\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"She, 그녀는. took selfies again, 다시 셀피를 찍었고. and posted, 그리고 올렸다. all the selfies, 모든 셀피를. on social media, 소셜 미디어에. 이 문장 전체를 해석하면, 그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다.","hl":"m"},{"n":43,"text":"이 문장은 셀피를 찍는 데서 끝나지 않고 소셜 미디어에 올리는 행동까지 이어지는 장면이에요. and가 두 동작을 자연스럽게 묶어 주고, 찍은 셀피를 전부 올렸다는 점에서 그녀의 과시 성향이 드러나죠. 앞 문장의 셀피 장면을 한 단계 더 키워 주는 역할을 합니다.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 관용 표현이에요. 사진을 찍을 때는 make가 아니라 take를 써서 take selfies, '셀피를 찍다'라고 한다는 걸 꼭 기억하세요. 두 번째는 등위접속사 and의 동사 병렬인데요, took과 posted가 and로 묶여서 같은 주어의 두 동작을 이어 주고, 그래서 둘 다 과거형으로 맞춰 줍니다. 세 번째는 전치사 on이에요. 무엇을 어디에 올리다는 post 뒤에 목적어를 쓰고 on으로 장소를 붙이는 형태라는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음,\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 위층으로 올라가\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">upstairs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침대 세 개를\u003c/span>\u003cspan class=\"en\">three beds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간의 흐름을 이어 주는 \u003cb class=\"key\">Then\u003c/b>으로 시작해, 이야기의 무대가 아래층에서 위층으로 옮겨 가는 걸 보여 줘요. \u003cb class=\"key\">and\u003c/b>로 '올라가다'와 '발견하다' 두 동작이 이어지고, 침대 세 개는 앞에 나온 그릇 세 개, 의자 세 개와 짝을 이루는 \u003cb class=\"key\">평행\u003c/b> 구조를 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 upstairs (전치사 없는 방향 표현)\u003c/span> : go + [[upstairs]] : \"위층으로 올라갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 동사 병렬\u003c/span> : [동사 과거] + and + [동사 과거] : \"그리고 발견했다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Then, 그런 다음. she went upstairs, 그녀는 위층으로 올라가. and found, 그리고 발견했다. three beds, 침대 세 개를. 이 문장 전체를 해석하면, 그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다.","hl":"m"},{"n":46,"text":"이 문장은 시간의 흐름을 이어 주는 Then으로 시작해서, 이야기의 무대가 아래층에서 위층으로 옮겨 가는 걸 보여 줘요. and로 올라가다와 발견하다 두 동작이 이어지고, 침대 세 개는 앞에 나온 그릇 세 개, 의자 세 개와 짝을 이루는 평행 구조를 만듭니다.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 부사 upstairs예요. upstairs는 부사라서 방향을 나타낼 때도 to를 붙이지 않아요. 그래서 go upstairs라고 쓴다는 걸 꼭 기억하세요. 두 번째는 등위접속사 and의 동사 병렬인데요, went와 found가 and로 묶여서 한 주어의 두 동작을 이어 주고, 시제를 과거로 통일해 준다는 점도 함께 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 피곤함을 느꼈다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">tired\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 잠들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">asleep\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 작은 침대에서\u003c/span>\u003cspan class=\"en\">in the smallest bed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 피곤해서 가장 작은 침대에서 잠들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 금발머리가 피곤함을 느껴 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">침대\u003c/b>에서 잠이 든 장면이에요. 앞에서 가장 작은 수프를 먹고 가장 작은 의자에 뛰어올랐던 것처럼, 여기서도 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 고르는 흐름이 그대로 이어져요. 그리고 이 장면은 곰들이 집에 돌아와 벌어질 사건의 \u003cb class=\"key\">원인\u003c/b>이 되니, 다음 이야기를 예고하는 중요한 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 형용사 (2형식)\u003c/span> : feel[감각동사] + [tired (형용사/주격보어)] : \"피곤함을 느꼈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and (동사 병렬)\u003c/span> : [felt tired] + and + [fell asleep] : \"그리고 ~했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현 fall asleep\u003c/span> : fall[동사] + asleep[형용사] : \"잠들었다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"She felt tired, 그녀는 피곤함을 느꼈다. and fell asleep, 그리고 잠들었다. in the smallest bed, 가장 작은 침대에서. 이 문장 전체를 해석하면, 그녀는 피곤해서 가장 작은 침대에서 잠들었다.","hl":"m"},{"n":49,"text":"이 문장은 금발머리가 피곤함을 느껴서 가장 작은 침대에서 잠이 드는 장면이에요. 앞에서 가장 작은 수프를 먹고 가장 작은 의자에 뛰어올랐던 것처럼, 여기서도 가장 작은 것을 고르는 흐름이 그대로 이어지죠. 그리고 이 장면은 곰들이 집에 돌아와서 벌어질 사건의 원인이 되니까, 다음 이야기를 이끄는 아주 중요한 대목이에요.","hl":"mn"},{"n":50,"text":"어법 포인트는 세 가지예요. 첫 번째, felt tired에서 feel은 감각동사로 쓰여서 뒤에 형용사 tired가 오는 문장을 만듭니다. 부사가 아니라 형용사가 온다는 점을 꼭 기억하세요. 두 번째, fell asleep은 잠들다라는 관용 표현이라서 통째로 외워야 하고요, 여기서 fall은 상태 변화를 나타내는 동사예요. 세 번째, and는 등위접속사로 두 동사 felt와 fell을 대등하게 연결해 줍니다. 그래서 주어 She를 한 번만 써도 두 동작이 자연스럽게 이어지죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어느 날 Goldilocks는 숲에서 \u003cb class=\"key\">산책\u003c/b>을 하다가 한 오두막집을 발견했어요.\u003c/li>\u003cli>아무 대답이 없자 그녀는 \u003cb class=\"key\">문을 \u003c/b>\u003cb class=\"key\">열고\u003c/b> 들어가 수프를 먹고 미소를 지으며 \u003cb class=\"key\">셀피\u003c/b>를 찍었습니다.\u003c/li>\u003cli>가장 작은 의자에서 뛰어 \u003cb class=\"key\">부서뜨렸지만\u003c/b> 신경 쓰지 않고, 셀피를 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 모두 올렸어요.\u003c/li>\u003cli>그녀는 위층으로 올라가 피곤해서 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">침대\u003c/b>에서 잠들었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>요지: Goldilocks enters an empty cottage, carelessly eats the soup, breaks a chair, posts selfies on social media, and falls asleep in the smallest bed.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 어느 날 Goldilocks가 숲속 \u003cb class=\"key\">오두막집\u003c/b>을 발견하고 들어가서, 수프를 먹고 의자를 부수고 \u003cb class=\"key\">셀피\u003c/b>를 찍어 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 올린 뒤, 위층 가장 작은 침대에서 잠든 이야기이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 지문을 정리해 볼게요. 골디락스는 숲에서 오두막을 발견하고 들어가서 수프를 먹고 셀피를 찍었어요. 그리고 의자를 부수고 셀피를 소셜 미디어에 올린 뒤, 위층 침대에서 잠들었죠. 시간 순서를 따라가며 각 장면의 행동과 그 결과를 짝지어 기억하면 시험에서도 흔들리지 않을 거예요. 오늘도 수고했고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
