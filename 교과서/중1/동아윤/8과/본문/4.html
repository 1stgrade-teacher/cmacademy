<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 8과 본문4 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 8과 본문4","audioDir":"4_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(윤)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Think Twice Before You Press POST\u003c/h1>\u003ch2>게시를 누르기 전에 다시 생각하세요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Goldilocks는 오두막집 게시물을 모두 \u003cb class=\"key\">삭제\u003c/b>했다고 아빠곰에게 말했지만, 아빠곰은 다른 사람들이 이미 \u003cb class=\"key\">공유\u003c/b>했기 때문에 게시물이 \u003cb class=\"key\">영원히\u003c/b> 남는다고 알려 준다. 결국 Goldilocks는 \u003cb class=\"key\">게시\u003c/b> 전에 다시 생각하겠다고 다짐한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You should think twice before pressing POST, because posts shared by others will live on forever.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중1 동아 윤 선생님 교과서 여덟 과 본문 네 번째 지문을 함께 읽어 볼 거예요. 이 이야기는 Goldilocks가 소셜 미디어에 올린 게시물을 삭제한 뒤 벌어지는 아빠곰과의 대화를 담고 있어요. 요약하면, 게시물을 지워도 다른 사람이 이미 공유했다면 영원히 남는다는 것이죠. 그래서 이 글의 요지는 게시하기 전에 다시 한 번 생각하자는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">소셜 미디어(social media)에 한 번 올린 게시물은 내가 지워도 완전히 사라지지 않는다. 다른 사람이 이미 \u003cb class=\"key\">공유\u003c/b>(share)하거나 캡처(screenshot)해 두면 그 복사본은 내 손을 떠나 있다. 이런 흔적을 디지털 발자국(digital footprint)이라고 부른다. 인터넷에서는 \u003cb class=\"key\">복제\u003c/b>와 \u003cb class=\"key\">재배포\u003c/b>가 거의 무료이고 순식간이라 정보가 통제를 벗어나기 쉽다. 교실에서 종이 쪽지를 돌리면 원본을 회수해도 이미 여러 명이 내용을 외우고 있는 것과 같은 이치다. 그래서 온라인에서는 올리기 전에 \u003cb class=\"key\">신중\u003c/b>하게 판단하는 습관이 필요하다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 소셜 미디어에 한 번 올린 게시물은 내가 지워도 완전히 사라지지 않아요. 다른 사람이 이미 공유하거나 캡처해 두면 그 복사본은 내 손을 떠나 있죠. 이런 흔적을 디지털 발자국, 영어로 digital footprint라고 불러요. 인터넷에서는 복제와 재배포가 거의 무료이고 순식간이라 정보가 통제를 벗어나기 쉬워요. 교실에서 종이 쪽지를 돌리면 원본을 회수해도 이미 여러 명이 내용을 외우고 있는 것과 같은 이치예요. 그래서 온라인에서는 올리기 전에 신중하게 판단하는 습관이 꼭 필요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>여름의 노력\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>Goldilocks는 여름 내내 열심히 일했다는 장면으로 이야기가 시작된다. \u003cb class=\"key\">All \u003c/b>\u003cb class=\"key\">summer \u003c/b>\u003cb class=\"key\">long\u003c/b>이라는 시간 표현은 사건이 마지막 날에 일어난다는 점을 강조한다. 아직 문제는 드러나지 않는 \u003cb class=\"key\">도입\u003c/b> 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>삭제했다는 안심\u003csmall>통념 · 문장 2\u003c/small>\u003c/h4>\u003cp>마지막 날 Goldilocks는 아빠곰에게 오두막집 게시물을 모두 \u003cb class=\"key\">삭제\u003c/b>했다고 말하며 \u003cb class=\"key\">걱정\u003c/b>하지 말라고 한다. 여기서 그녀는 삭제하면 문제가 끝난다고 믿는 \u003cb class=\"key\">통념\u003c/b>을 드러낸다. say to 표현이 대화의 시작을 알린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아빠곰의 반박\u003csmall>반박·근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>아빠곰은 You still don't understand라고 말하며 그녀의 생각을 \u003cb class=\"key\">반박\u003c/b>한다. 이미 다른 사람들이 \u003cb class=\"key\">공유\u003c/b>했기 때문에 게시물은 \u003cb class=\"key\">영원히\u003c/b> 남는다는 것이다. still, already, forever 같은 신호어가 통념과 실제의 \u003cb class=\"key\">대비\u003c/b>를 분명히 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>깨달음과 다짐\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>Goldilocks는 그 생각은 하지 못했다며 자신의 \u003cb class=\"key\">오해\u003c/b>를 인정한다. 이어서 이제부터는 \u003cb class=\"key\">게시\u003c/b>를 누르기 전에 다시 생각하겠다고 \u003cb class=\"key\">다짐\u003c/b>한다. 이 마지막 문장이 글의 \u003cb class=\"key\">주제\u003c/b>를 완성한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. Goldilocks가 여름 내내 열심히 일했다는 장면으로 이야기가 시작되죠. All summer long이라는 시간 표현 덕분에 사건이 여름의 마지막 날에 일어난다는 걸 알 수 있어요. 아직 문제는 드러나지 않아요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 Goldilocks가 아빠곰에게 오두막집 게시물을 모두 삭제했다고 말해요. 그리고 걱정하지 말라고 안심시키죠. 여기서 그녀는 삭제하면 문제가 끝난다고 믿는 통념을 드러내요. say to라는 표현이 대화의 시작을 알려 줘요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 아빠곰의 반박이에요. 아빠곰은 You still don't understand라고 말하면서 그녀의 생각을 바로잡죠. 이미 다른 사람들이 공유했기 때문에 게시물은 영원히 남는다는 거예요. still, already, forever 같은 신호어가 통념과 실제의 대비를 분명하게 보여 줘요.","hl":"f2"},{"n":7,"text":"마지막 단계는 깨달음과 다짐이에요. Goldilocks는 그 생각은 하지 못했다면서 자신의 오해를 인정하죠. 그리고 이제부터는 게시를 누르기 전에 다시 생각하겠다고 다짐해요. 이 마지막 문장이 글 전체의 주제를 완성해 줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">Goldilocks가 게시물을 지웠으니 괜찮다고 믿는 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시하고, 아빠곰이 실제를 알려 주며 그것을 \u003cb class=\"key\">반박\u003c/b>하는 흐름이다. still과 already, forever 같은 표현이 통념과 실제의 \u003cb class=\"key\">대비\u003c/b>를 분명히 만든다. 글의 \u003cb class=\"key\">주제\u003c/b>를 담은 문장이 맨 끝에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 따라서 게시 전에 다시 생각하자는 마지막 문장이 이 글의 주제문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박이에요. Goldilocks가 삭제하면 끝난다고 믿는 통념을 먼저 내세우고, 아빠곰이 실제를 알려 주면서 그것을 반박하죠. 주제를 담은 문장이 맨 끝에 나오기 때문에 미괄식 구조라고 볼 수 있어요. 결국 마지막 문장인 게시 전에 다시 생각하겠다는 다짐이 이 글의 주제문이에요.","hl":"ty"},{"n":9,"text":"신호어를 하나씩 짚어 볼게요. 두 번째 문장의 so는 앞의 말에 대한 이유와 결과를 이어 주고, 세 번째 문장의 still은 상대가 여전히 이해하지 못한다는 반박 신호예요. 네 번째 문장의 already는 이미 벌어진 일을 강조하고, 다섯 번째 문장의 forever는 결과를 강하게 못 박죠. 그리고 마지막 문장의 From now on은 결론과 다짐으로 넘어가는 전환 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>all summer long\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>여름 내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>work hard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열심히 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard\u003c/b>\u003cem>부사\u003c/em>\u003cspan>열심히, 힘들게\u003c/span>\u003c/div>\u003cdiv>\u003cb>last\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마지막의\u003c/span>\u003c/div>\u003cdiv>\u003cb>say to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…에게 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delete\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삭제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게시물\u003c/span>\u003c/div>\u003cdiv>\u003cb>cottage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오두막집\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아직도, 여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>other\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>already\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이미, 벌써\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소셜 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>live on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 살아남다, 남아 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영원히\u003c/span>\u003c/div>\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>from now on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이제부터\u003c/span>\u003c/div>\u003cdiv>\u003cb>think twice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시[신중히] 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>press\u003c/b>\u003cem>동사\u003c/em>\u003cspan>누르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>POST\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게시 (버튼)\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚고 갈게요. delete는 삭제하다, share는 공유하다, forever는 영원히라는 뜻이에요. live on은 계속 살아남다, 남아 있다는 의미이고, think twice는 다시 한 번 신중하게 생각하다라는 뜻이죠. press는 누르다, POST는 게시 버튼을 가리켜요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">delete\u003c/b>\u003cspan class=\"m\">삭제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">erase\u003c/span>\u003cspan class=\"s\">remove\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">공유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"s\">spread\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forever\u003c/b>\u003cspan class=\"m\">영원히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permanently\u003c/span>\u003cspan class=\"s\">eternally\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">temporarily\u003c/span>\u003cspan class=\"a\">briefly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worry\u003c/b>\u003cspan class=\"m\">걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concern\u003c/span>\u003cspan class=\"s\">fret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">live on\u003c/b>\u003cspan class=\"m\">계속 살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">survive\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">remain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">press\u003c/b>\u003cspan class=\"m\">누르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">push\u003c/span>\u003cspan class=\"s\">click\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. delete는 erase, remove와 뜻이 가깝고, 반대말로는 add나 keep이 있어요. share는 distribute, spread와 비슷하고, hide나 withhold와는 반대되는 개념이죠. forever는 permanently, eternally와 가깝고 temporarily, briefly와 반대돼요. understand는 comprehend, grasp와 뜻이 통하고 misunderstand와는 반대고요. worry는 concern, fret과 비슷하고 relax, calm과 반대라는 것도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름 내내,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">All \u003c/span>\u003cspan class=\"tgt\">summer \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks는\u003c/span>\u003cspan class=\"en\">Goldilocks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열심히 일했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여름 내내, Goldilocks는 열심히 일했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 여름 내내 성실하게 지냈다는 \u003cb class=\"key\">배경\u003c/b>을 깔아 주는 문장이에요. 동사가 \u003cb class=\"key\">과거형\u003c/b> worked라서 '이미 끝난 일'이라는 점이 분명해지죠. 뒤에서 벌어지는 사건의 무대를 미리 세팅하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사구(기간 강조)\u003c/span> : all + [기간] + long = [기간] 내내 : \"여름 내내\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단순과거시제(동사의 과거형)\u003c/span> : [주어] + [동사 과거형] + [부사] : \"열심히 일했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"All summer long, 여름 내내. Goldilocks, Goldilocks는. worked hard, 열심히 일했다.. 이 문장 전체를 해석하면, 여름 내내, Goldilocks는 열심히 일했다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 열어 주는 문장이에요. 여름 내내 Goldilocks가 열심히 일했다는 걸 보여 주는 거죠. 이미 끝난 일이라서 동사를 과거형으로 썼다는 점, 꼭 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 All summer long이라는 시간의 부사구예요. 여름이라는 기간 전체를 강조하는 표현이죠. 두 번째는 동사의 과거 시제예요. worked는 work의 과거형으로, 이미 끝난 과거의 일을 나타내고 hard는 열심히라는 뜻의 부사로 동사 뒤에 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막 날에,\u003c/span>\u003cspan class=\"en\">On the last day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks는 아빠곰에게 말했다,\u003c/span>\u003cspan class=\"en\">Goldilocks \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Father \u003c/span>\u003cspan class=\"tgt\">Bear\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 나의 모든 게시물을 삭제했어요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">deleted\u003c/span> all my posts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 오두막집에 관한\u003c/span>\u003cspan class=\"en\">of your cottage,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니 제발 걱정하지 마세요.”\u003c/span>\u003cspan class=\"en\">so please \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막 날에 Goldilocks는 “오두막집에 관한 제 게시물을 모두 삭제했으니 걱정하지 마세요.”라고 아빠곰에게 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 아빠곰에게 '게시물을 다 지웠으니 걱정 말라'고 \u003cb class=\"key\">안심\u003c/b>시키는 장면이에요. \u003cb class=\"key\">say \u003c/b>\u003cb class=\"key\">to\u003c/b> 사람 구조로 말을 듣는 대상을 밝히고, 큰따옴표 \u003cb class=\"key\">직접인용\u003c/b>으로 인물의 말투를 그대로 살렸어요. 여기서 so는 '그러니'라는 뜻으로 \u003cb class=\"key\">결과\u003c/b>를 이끕니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say to + 사람 (말하다)\u003c/span> : [주어] + say + to + [사람] = [사람]에게 말하다 : \"아빠곰에게 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접인용문 안의 단순과거\u003c/span> : 따옴표 안 [주어] + [동사 과거형] : \"나는 삭제했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Don't + [동사원형] = ~하지 마세요 : \"걱정하지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"On the last day, 마지막 날에. Goldilocks said to Father Bear, Goldilocks는 아빠곰에게 말했다. \"I deleted all my posts, “나는 나의 모든 게시물을 삭제했어요. of your cottage, 당신의 오두막집에 관한. so please don't worry.\", 그러니 제발 걱정하지 마세요.”. 이 문장 전체를 해석하면, 마지막 날에 Goldilocks는 “오두막집에 관한 제 게시물을 모두 삭제했으니 걱정하지 마세요.”라고 아빠곰에게 말했다.","hl":"m"},{"n":16,"text":"Goldilocks가 아빠곰에게 직접 말하는 장면이에요. 게시물을 다 지웠으니 걱정 말라고 안심시키는 거죠. 큰따옴표로 감싼 직접인용이라서 인물의 말투가 그대로 살아 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 say to 사람이에요. 누군가에게 말했다고 할 때는 say 뒤에 to를 붙여서 사람을 연결해 줍니다. 두 번째는 직접인용문 안의 과거 시제예요. 이미 삭제한 일이라 deleted라고 과거형을 썼죠. 세 번째는 부정 명령문이에요. Don't worry처럼 Don't 뒤에 동사원형을 쓰면 걱정하지 마세요라는 명령이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“너는\u003c/span>\u003cspan class=\"en\">&quot;You\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 ~하지 않아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">still\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">understand\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“너는 아직도 이해하지 못하는구나.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠곰이 Goldilocks의 착각을 짚어 주는 문장이에요. 게시물을 지워도 소용없다는 사실을 Goldilocks가 \u003cb class=\"key\">이해\u003c/b>하지 못하고 있다는 뜻이죠. \u003cb class=\"key\">still\u003c/b>이 들어가 '지금까지도 여전히' 모른다는 \u003cb class=\"key\">뉘앙스\u003c/b>를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 still의 위치\u003c/span> : [주어] + still + [do/does + not] + [동사원형] : \"아직도, 여전히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재시제 부정문 (do-support)\u003c/span> : [주어] + do/does + not + [동사원형] : \"이해하지 못한다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"\"You, “너는. still don't, 여전히 ~하지 않아. understand, 이해하다. 이 문장 전체를 해석하면, “너는 아직도 이해하지 못하는구나.","hl":"m"},{"n":19,"text":"아빠곰이 Goldilocks에게 핵심을 짚어 주는 문장이에요. 게시물을 지워도 소용없다는 걸 이해하지 못하고 있다는 뜻이죠. still이 들어가서 지금까지도 여전히 모른다는 뉘앙스를 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 부사 still의 위치예요. 부정문에서는 still이 don't 앞에 와서 아직도라는 의미를 강조합니다. 두 번째는 현재 시제의 부정문이에요. 주어가 You라서 do를 쓰고 not을 붙여 don't understand가 됩니다. 이 순서를 헷갈리면 시험에서 자주 틀리니 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들이\u003c/span>\u003cspan class=\"en\">Other people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이미 공유했어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">shared\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 사람들이 이미 소셜 미디어에 그것들을 공유했어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 골디락스가 게시물을 지웠다고 말했지만, 아빠곰은 이미 다른 사람들이 그것들을 공유해 버렸다고 알려 주는 문장이에요. \u003cb class=\"key\">공유\u003c/b>라는 행위가 삭제보다 먼저 일어났다는 점을 \u003cb class=\"key\">이미\u003c/b>라는 부사로 강조하고 있어요. 한 번 퍼진 것은 되돌릴 수 없다는 흐름을 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 already + 과거시제 동사\u003c/span> : [주어] + [already(부사)] + [shared(과거동사)] : \"이미 공유했어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사(지시 대상)\u003c/span> : [대명사 them] = 앞 문장의 [posts] : \"그것들(게시물)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(매체)\u003c/span> : [동사 + 목적어] + [on + social media(전치사구)] : \"소셜 미디어에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Other people, 다른 사람들이. already shared, 이미 공유했어. them, 그것들을. on social media, 소셜 미디어에. 이 문장 전체를 해석하면, 다른 사람들이 이미 소셜 미디어에 그것들을 공유했어.","hl":"m"},{"n":22,"text":"이 문장은 아빠곰이 골디락스에게 이미 늦었다고 알려 주는 부분이에요. 골디락스가 게시물을 지웠다고 해도, 다른 사람들이 이미 그것들을 공유해 버렸다는 거죠. 그래서 공유라는 행위가 삭제보다 먼저 일어났다는 점을 already로 강조하고 있어요.","hl":"mn"},{"n":23,"text":"첫 번째, already는 이미라는 뜻으로 일반동사 앞에 놓여서 과거의 일이 예상보다 먼저 일어났음을 강조해요. 두 번째, them은 앞 문장에 나온 posts, 즉 게시물을 가리키는 대명사예요. 세 번째, on social media는 소셜 미디어에라는 뜻으로 매체를 나타내는 전치사구이고, shared를 꾸며 주는 부사구 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너의 게시물은 계속 남아 있을 거야 영원히 라고 아빠곰이 말했다\u003c/span>\u003cspan class=\"en\">Your posts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> forever,&quot; \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Father \u003c/span>\u003cspan class=\"tgt\">Bear.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너의 게시물은 영원히 남아 있을 거야.”라고 아빠곰이 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠곰이 인터넷의 무서운 점을 알려 주는 핵심 문장이에요. 게시물을 지워도 이미 퍼진 것은 사라지지 않고 계속 남는다는 뜻이죠. \u003cb class=\"key\">live \u003c/b>\u003cb class=\"key\">on\u003c/b>은 '계속 살아남다, 영원히 남다'라는 뜻의 구동사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형(단순미래)\u003c/span> : [주어] + [will + 동사원형] : \"계속 남아 있을 거야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : [&quot;인용문,&quot;] + [said + 주어] : \"라고 아빠곰이 말했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"Your posts, 너의 게시물은. will live on, 계속 남아 있을 거야. forever,\", 영원히. said Father Bear, 라고 아빠곰이 말했다. 이 문장 전체를 해석하면, 너의 게시물은 영원히 남아 있을 거야.”라고 아빠곰이 말했다.","hl":"m"},{"n":25,"text":"아빠곰이 인터넷의 무서운 점을 알려 주는 문장이에요. 게시물을 지워도 이미 퍼진 것은 사라지지 않고 계속 남는다는 뜻이죠. live on은 계속 살아남다, 영원히 남다라는 뜻의 구동사예요.","hl":"mn"},{"n":26,"text":"첫 번째, will은 미래를 나타내는 조동사라서 뒤에 항상 동사원형이 와요. 그래서 live가 원형 그대로 쓰였고, live on은 계속 남다라는 뜻의 구동사예요. 두 번째, 인용문 뒤의 said Father Bear는 원래 Father Bear said인데 주어와 동사가 도치된 형태예요. 그래서 아빠곰이 말했다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아,\u003c/span>\u003cspan class=\"en\">&quot;Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각하지 못했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 Goldilocks가 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Goldilocks.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아, 그 생각은 하지 못했어요.”라고 Goldilocks가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 골디락스가 자신의 실수를 뒤늦게 깨닫는 장면이에요. 아빠곰의 경고를 듣고 그제야 문제를 알아차린 거죠. \u003cb class=\"key\">think \u003c/b>\u003cb class=\"key\">about\u003c/b>은 '~에 대해 생각하다'라는 뜻이고, 맨 앞의 \u003cb class=\"key\">아\u003c/b>라는 감탄으로 뒤늦은 깨달음을 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거의 부정문\u003c/span> : [주어] + [did not + 동사원형] : \"생각하지 못했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 지시대명사\u003c/span> : [think] + [about(전치사) + that(지시대명사)] : \"그것에 대해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어-동사 도치\u003c/span> : [&quot;인용문,&quot;] + [said + 주어] : \"라고 Goldilocks가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"Oh, 아. I didn't think, 나는 생각하지 못했어요. about that,\", 그것에 대해. said Goldilocks, 라고 Goldilocks가 말했다. 이 문장 전체를 해석하면, “아, 그 생각은 하지 못했어요.”라고 Goldilocks가 말했다.","hl":"m"},{"n":28,"text":"골디락스가 자신의 실수를 깨닫는 장면이에요. 아빠곰의 경고를 듣고 그제야 문제를 알아차린 거죠. 아, 라는 감탄으로 뒤늦은 깨달음을 드러내고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째, didn't think는 일반동사의 과거 부정이에요. did not 뒤에 동사원형 think가 온 형태죠. 두 번째, about that에서 that은 그것을 가리키는 지시대명사이고 about은 전치사예요. think about으로 묶어 그것에 대해 생각하다로 해석해요. 세 번째, 인용문 뒤의 said Goldilocks도 주어와 동사가 도치된 형태라서 골디락스가 말했다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제부터\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 다시 한 번 생각할게요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'll\u003c/span> think twice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 '게시'를 누르기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">press \u003c/span>\u003cspan class=\"tgt\">POST\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이제부터 ‘게시’를 누르기 전에 다시 생각할게요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 골디락스가 자기 잘못을 깨닫고 앞으로의 행동 변화를 \u003cb class=\"key\">다짐\u003c/b>하는 결말 문장이에요. think twice는 직역하면 '두 번 생각하다'지만 실제로는 행동하기 전에 \u003cb class=\"key\">신중하게\u003c/b> 재고하다는 뜻이고, POST는 SNS의 \u003cb class=\"key\">게시\u003c/b> 버튼을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(부사구)\u003c/span> : From now on + [주어 + 동사] : \"이제부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will (미래·의지)\u003c/span> : [주어] + will + [동사원형] : \"저는 ~할게요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 before + 시간 부사절(미래 대신 현재)\u003c/span> : before + [주어 + 현재동사] : \"제가 게시를 누르기 전에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"\"From now on, 이제부터. I'll think twice, 저는 다시 한 번 생각할게요. before I press POST.\", 제가 '게시'를 누르기 전에. 이 문장 전체를 해석하면, “이제부터 ‘게시’를 누르기 전에 다시 생각할게요.”","hl":"m"},{"n":31,"text":"이 문장은 골디락스가 자기 잘못을 깨닫고 앞으로의 행동 변화를 다짐하는 결말이에요. think twice는 그냥 두 번 생각한다가 아니라 행동하기 전에 신중하게 재고한다는 뜻이에요. 그리고 POST는 SNS의 게시 버튼을 가리키는 말이죠.","hl":"mn"},{"n":32,"text":"어법 포인트 세 개만 짚어 볼게요. 첫 번째, From now on은 지금부터 앞으로라는 뜻의 관용 표현이에요. 두 번째, I'll은 조동사 will이 들어간 형태로 미래와 의지를 나타내고, 뒤에는 꼭 동사원형이 와요. 세 번째, before I press POST에서 before는 시간 부사절을 이끄는데, 미래의 일이라도 시간 부사절 안에서는 will을 쓰지 않고 현재시제 press를 써요. 시험에 정말 자주 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Goldilocks는 여름 내내 열심히 일한 뒤 마지막 날 오두막집 게시물을 모두 \u003cb class=\"key\">삭제\u003c/b>했다고 말한다.\u003c/li>\u003cli>그녀는 삭제하면 문제가 끝난다고 \u003cb class=\"key\">안심\u003c/b>하지만, 이는 실제와 다른 \u003cb class=\"key\">통념\u003c/b>이다.\u003c/li>\u003cli>아빠곰은 다른 사람들이 이미 \u003cb class=\"key\">공유\u003c/b>했기 때문에 게시물이 \u003cb class=\"key\">영원히\u003c/b> 남는다고 반박한다.\u003c/li>\u003cli>결국 Goldilocks는 \u003cb class=\"key\">게시\u003c/b> 전에 다시 생각하겠다고 다짐하며, 온라인 정보의 \u003cb class=\"key\">확산\u003c/b>을 경계하는 교훈을 전한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You should think twice before pressing POST, because posts shared by others will live on forever.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Goldilocks는 오두막집 게시물을 모두 \u003cb class=\"key\">삭제\u003c/b>했다고 아빠곰에게 말했지만, 아빠곰은 다른 사람들이 이미 \u003cb class=\"key\">공유\u003c/b>했기 때문에 게시물이 \u003cb class=\"key\">영원히\u003c/b> 남는다고 알려 준다. 결국 Goldilocks는 \u003cb class=\"key\">게시\u003c/b> 전에 다시 생각하겠다고 다짐한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 배운 내용을 마지막으로 정리해 볼게요. Goldilocks는 게시물을 삭제했다고 안심했지만, 이미 공유된 게시물은 영원히 남는다는 걸 깨달았죠. 그래서 게시하기 전에 다시 생각하는 태도의 중요성을 배웠어요. 소셜 미디어에서는 삭제보다 애초에 신중하게 올리는 것이 더 중요하다는 점, 꼭 기억해 주세요. 오늘 수업도 여기까지예요. 수고했어요, 여러분.","hl":null}]}]});</script></body></html>
