<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 8과 본문1","audioDir":"1_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(윤)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Goldilocks Changes Her Posts for More Likes\u003c/h1>\u003ch2>더 많은 '좋아요'를 위해 게시물을 바꾸는 Goldilocks\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소셜 미디어에 사진을 공유하던 Goldilocks는 더 많은 \u003cb class=\"key\">좋아요\u003c/b>를 얻으려고 일상적인 게시물에서 웃긴 사진, 결국 더 충격적인 사진으로 점점 자극을 높여 간다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Goldilocks keeps changing her posts, from everyday things to funny pictures and then to more shocking pictures, in order to get more likes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 동아 윤 선생님 교과서에 나오는 본문이에요. 작은 마을에 사는 금발 소녀 Goldilocks가 소셜 미디어에 사진을 올리면서 좋아요를 얻으려고 애쓰는 이야기죠. 처음에는 일상적인 사진을 올렸지만 반응이 없자 웃긴 사진으로, 그리고 더 충격적인 사진으로 내용을 바꿔 간다는 흐름이에요. 핵심은 좋아요를 좇는 마음이 게시물을 점점 자극적으로 만든다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">소셜 미디어(social media)는 사람들이 사진과 글을 올리고 서로 반응을 주고받는 온라인 공간이에요. 게시물이 받는 \u003cb class=\"key\">좋아요\u003c/b>(likes)는 인기의 척도처럼 여겨지기 때문에 사람들은 더 많은 좋아요를 얻으려고 애를 쓰죠. 그런데 \u003cb class=\"key\">팔로워\u003c/b>(followers)의 관심은 쉽게 식는데, 이것을 '지루함'이라고 표현해요. 마치 같은 간식을 매일 먹으면 처음엔 맛있어도 금세 물리는 것과 같은 이치예요. 그래서 점점 더 자극적인 내용을 올리는 \u003cb class=\"key\">자극 \u003c/b>\u003cb class=\"key\">경쟁\u003c/b>이 생기기도 해요. 이 지문은 그런 사회 현상을 금발 소녀 Goldilocks의 이야기로 풀어낸 것이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 소셜 미디어는 사람들이 사진과 글을 올리고 서로 반응을 주고받는 온라인 공간이에요. 게시물이 받는 좋아요는 인기의 척도처럼 여겨져서, 많은 사람이 더 많은 좋아요를 얻으려고 노력하죠. 그런데 팔로워의 관심은 쉽게 식어요. 같은 간식을 매일 먹으면 처음엔 맛있어도 금세 물리는 것과 같은 이치예요. 그래서 점점 더 자극적인 내용을 올리는 자극 경쟁이 생기기도 하죠. 이 지문은 그런 사회 현상을 Goldilocks 이야기로 풀어낸 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>작은 마을에 금발의 어린 소녀 Goldilocks가 등장해요. 그녀는 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 사진을 공유하는 것을 좋아했어요. 이야기의 주인공과 관심사가 먼저 제시되는 도입부예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>고민\u003csmall>문제 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>처음에 그녀는 \u003cb class=\"key\">일상적인\u003c/b> 것들을 올렸지만 사람들은 좋아요를 많이 주지 않았어요. 그래서 어떻게 하면 더 많은 좋아요를 받을지 고민했죠. 원하는 반응을 얻지 못한 \u003cb class=\"key\">문제\u003c/b>가 드러나요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반응 얻기\u003csmall>해결 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>그녀는 웃긴 사진들을 올려야겠다고 생각했어요. 그 결과 게시물이 좋아요를 많이 받았고 Goldilocks는 \u003cb class=\"key\">행복\u003c/b>해했죠. 문제를 풀어 보려는 첫 번째 \u003cb class=\"key\">시도\u003c/b>가 성공한 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새 문제\u003csmall>반전 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>하지만 팔로워들은 곧 \u003cb class=\"key\">지루함\u003c/b>을 느꼈어요. 그래서 그녀는 더 충격적인 사진들을 올리기로 결심해요. 성공이 오래가지 않고 더 강한 자극이 필요해지는 \u003cb class=\"key\">전환\u003c/b>이 일어나요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 따라가 볼게요.","hl":null},{"n":4,"text":"이야기는 작은 마을에 금발의 어린 소녀 Goldilocks가 등장하면서 시작해요. 그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했죠. 주인공과 그녀의 관심사가 먼저 제시되는 도입부예요.","hl":"f0"},{"n":5,"text":"처음에 그녀는 일상적인 것들을 올렸지만, 사람들은 좋아요를 많이 주지 않았어요. 그래서 어떻게 하면 더 많은 좋아요를 받을 수 있을지 고민했죠. 원하는 반응을 얻지 못한 문제가 드러나는 부분이에요.","hl":"f1"},{"n":6,"text":"그녀는 웃긴 사진들을 올려야겠다고 생각했어요. 그 결과 게시물이 좋아요를 많이 받았고, Goldilocks는 행복해했죠. 문제를 풀어 보려는 첫 번째 시도가 성공한 대목이에요.","hl":"f2"},{"n":7,"text":"그런데 팔로워들은 곧 지루함을 느꼈어요. 그래서 그녀는 더 충격적인 사진들을 올리기로 결심해요. 성공이 오래가지 않고 더 강한 자극이 필요해지는 전환이 일어나는 부분이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 좋아요가 적다는 \u003cb class=\"key\">문제\u003c/b>를 제시하고 웃긴 사진으로 \u003cb class=\"key\">해결\u003c/b>한 뒤, 다시 팔로워의 지루함이라는 새 문제가 생기는 \u003cb class=\"key\">문제-해결\u003c/b> 구조예요. 각 시도 뒤에 반응이 따라오는 인과적 흐름이 반복되죠. 주제는 글 첫머리에 바로 제시되지 않고, 마지막 문장에서 더 충격적인 사진을 올리기로 결심하는 대목에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At first (4)\u003c/b>\u003cspan>시간 순서·도입\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>반전·대조\u003c/span>\u003cb>however (9)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">share photos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">posted everyday things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">post funny pictures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">post more shocking pictures\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Goldilocks\u003c/th>\u003cth>팔로워들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>많은 좋아요를 받고 행복해함\u003c/td>\u003ctd>곧 지루함을 느낌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>더 강한 자극을 선택함\u003c/td>\u003ctd>새로운 자극을 원함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제를 제시하고 해결하는 문제-해결 방식으로 전개돼요. 좋아요가 적다는 문제를 웃긴 사진으로 풀고, 다시 팔로워가 지루해지는 새 문제가 생기면서 비슷한 흐름이 반복되는 구조죠. 그런데 이 주제는 글 앞부분에서 바로 드러나지 않고, 마지막 문장에서 더 충격적인 사진을 올리기로 결심하는 모습으로 드러나요. 그래서 주제가 뒤에서 정리되는 미괄식이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 훨씬 또렷해져요. At first가 나오면서 처음 상황이 제시되고, but을 기준으로 좋아요를 많이 받지 못했다는 반전이 일어나죠. 뒤쪽에서는 however가 팔로워들이 지루해졌다는 전환을 알려 주고, So가 그 결과 더 충격적인 사진을 올리기로 한 결심으로 이어 줘요. 이렇게 but, however, So를 기준으로 장면이 바뀌는 지점을 표시하면 내용이 잘 정리돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>golden\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>금빛의, 금발의\u003c/span>\u003c/div>\u003cdiv>\u003cb>town\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>photo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사진\u003c/span>\u003c/div>\u003cdiv>\u003cb>social media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소셜 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(게시물을) 올리다, 게시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyday\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일상적인, 매일의\u003c/span>\u003c/div>\u003cdiv>\u003cb>thing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>것, 사물\u003c/span>\u003c/div>\u003cdiv>\u003cb>but\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>give\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>명사\u003c/em>\u003cspan>좋아요, 호감\u003c/span>\u003c/div>\u003cdiv>\u003cb>many\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>should\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>funny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>웃긴, 재미있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사진, 그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>now\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이제\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>follower\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팔로워, 추종자\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧, 머지않아\u003c/span>\u003c/div>\u003cdiv>\u003cb>bored\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지루해진, 지루한\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다, 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shocking\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충격적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. post는 여기서 사진을 올리다, 게시하다라는 동사로 쓰였어요. everyday는 every day와 헷갈리기 쉬운데, everyday는 일상적이라는 뜻의 형용사라는 점을 꼭 기억하세요. followers는 팔로워, 즉 게시물을 구독하는 사람들이라는 뜻이고, bored는 지루해진이라는 형용사예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">공유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"s\">spread\u003c/span>\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">hoard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">post\u003c/b>\u003cspan class=\"m\">게시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">upload\u003c/span>\u003cspan class=\"s\">publish\u003c/span>\u003cspan class=\"s\">share\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">delete\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">funny\u003c/b>\u003cspan class=\"m\">웃긴, 재미있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">amusing\u003c/span>\u003cspan class=\"s\">humorous\u003c/span>\u003cspan class=\"s\">comical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">serious\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">행복한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">joyful\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bored\u003c/b>\u003cspan class=\"m\">지루한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uninterested\u003c/span>\u003cspan class=\"s\">tired\u003c/span>\u003cspan class=\"s\">weary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">interested\u003c/span>\u003cspan class=\"a\">excited\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결심하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shocking\u003c/b>\u003cspan class=\"m\">충격적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surprising\u003c/span>\u003cspan class=\"s\">startling\u003c/span>\u003cspan class=\"s\">alarming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. share는 공유하다라는 뜻으로 distribute, spread와 가깝고, keep과는 반대돼요. funny는 amusing, humorous와 비슷하고 serious, dull와 반대죠. happy는 glad, pleased와 가깝고 sad와 반대돼요. bored는 uninterested, tired와 비슷하고 interested, excited와 반대돼요. decide는 determine, choose와 가깝고 hesitate와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 어린 소녀가\u003c/span>\u003cspan class=\"en\">a little girl\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금발을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">golden \u003c/span>\u003cspan class=\"tgt\">hair\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 마을에\u003c/span>\u003cspan class=\"en\">in a small town.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작은 마을에 금발의 어린 소녀가 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 배경과 \u003cb class=\"key\">주인공\u003c/b>을 소개하는 첫 문장이에요. There was는 '~이 있었다'라는 뜻으로 어떤 존재가 있다는 걸 처음 알려 줄 때 쓰는 \u003cb class=\"key\">유도부사\u003c/b> 표현이죠. with golden hair는 소녀를 꾸미는 \u003cb class=\"key\">전치사구\u003c/b>로, 금발이라는 특징을 덧붙여 인물을 생생하게 그려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + [be동사] + [주어] + [장소 부사구] : \"작은 마을에 …이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사] + with + [명사] (앞의 명사를 뒤에서 수식) : \"금발을 가진, 금발의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There was, 있었다. a little girl, 한 어린 소녀가. with golden hair, 금발을 가진. in a small town, 작은 마을에. 이 문장 전체를 해석하면, 작은 마을에 금발의 어린 소녀가 있었다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경과 주인공을 소개하는 첫 문장이에요. There was는 '~이 있었다'라는 뜻으로 어떤 존재가 있다는 걸 처음 알려 줄 때 쓰는 유도부사 표현이죠. 그리고 with golden hair는 소녀를 꾸미는 전치사구로, 금발이라는 특징을 덧붙여 인물을 생생하게 그려 줍니다.","hl":"mn"},{"n":14,"text":"먼저 There was부터 볼게요. 처음 언급되는 대상을 '~이 있다'로 소개할 때는 유도부사 There를 문장 앞에 세우고, 진짜 주어는 be동사 뒤에 둡니다. 이때 동사의 수는 뒤에 오는 주어에 맞춰요. 두 번째로 with golden hair를 보면, 전치사 with가 이끄는 구가 앞의 명사 a little girl를 뒤에서 꾸며 주는 형용사 역할을 해요. '금발을 가지고 있는'이라는 뜻이 자연스럽게 '금발의'로 해석된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 이름은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her \u003c/span>\u003cspan class=\"tgt\">name \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Goldilocks였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">Goldilocks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 이름은 Goldilocks였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 소개한 소녀의 \u003cb class=\"key\">이름\u003c/b>을 밝혀 주는 문장이에요. be동사 뒤에 고유명사 Goldilocks가 와서 주어 Her name과 같은 대상임을 나타내는 \u003cb class=\"key\">2형식\u003c/b> 구조죠. 짧지만 주인공의 정체를 확실히 못 박아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어] + be동사 + [주격 보어] : \"그녀의 이름은 Goldilocks였다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Her name, 그녀의 이름은. was Goldilocks, Goldilocks였다. 이 문장 전체를 해석하면, 그녀의 이름은 Goldilocks였다.","hl":"m"},{"n":16,"text":"이 문장은 앞서 소개한 소녀의 이름을 밝혀 주는 문장이에요. be동사 뒤에 고유명사 Goldilocks가 와서 주어 Her name과 같은 대상임을 나타내는 두 번째 형식 구조죠. 짧지만 주인공의 정체를 확실히 못 박아 주는 역할을 합니다.","hl":"mn"},{"n":17,"text":"여기서 핵심은 be동사예요. be동사는 주어의 상태나 정체를 설명하면서 주어와 보어를 연결하는 두 번째 형식 동사입니다. Goldilocks는 주어 Her name을 보충 설명하는 주격 보어로, 주어와 보어가 같은 대상이라는 관계가 성립해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 좋아했다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">liked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진을 공유하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">share\u003c/span> photos\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Goldilocks가 무엇을 좋아했는지 알려 주는 문장이에요. liked 뒤에 to share가 와서 '공유하는 것을 좋아했다'라는 \u003cb class=\"key\">목적어\u003c/b> 역할을 하죠. 또 on social media는 사진을 올리는 \u003cb class=\"key\">매체\u003c/b>를 알려 주는 전치사구로, 이야기가 소셜 미디어에서 시작된다는 걸 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : [동사 like] + [to + 동사원형] (to부정사구가 목적어) : \"공유하는 것을 좋아했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소·매체)\u003c/span> : [동사] + on + [명사] (장소·매체를 나타내는 부사구) : \"소셜 미디어에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She liked, 그녀는 좋아했다. to share photos, 사진을 공유하는 것을. on social media, 소셜 미디어에. 이 문장 전체를 해석하면, 그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다.","hl":"m"},{"n":19,"text":"이 문장은 Goldilocks가 무엇을 좋아했는지 알려 주는 문장이에요. liked 뒤에 to share가 와서 공유하는 것을 좋아했다라는 목적어 역할을 하죠. 또 on social media는 사진을 올리는 매체를 알려 주는 전치사구로, 이야기가 소셜 미디어에서 시작된다는 걸 보여 줍니다.","hl":"mn"},{"n":20,"text":"먼저 liked to share를 볼게요. like, want, hope 같은 동사는 to부정사를 목적어로 취합니다. 여기서 to share는 공유하는 것이라는 명사 역할을 하면서 liked의 목적어가 되는 거예요. 그다음 on social media를 보면, on은 여기서 장소를 나타내는 전치사로 사진을 올리는 매체를 가리켜요. 그리고 social media는 소셜 미디어라는 뜻의 명사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에,\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 일상적인 것들을 올렸지만,\u003c/span>\u003cspan class=\"en\">she posted \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">everyday \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 그녀에게 주지 않았다\u003c/span>\u003cspan class=\"en\">but people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 ‘좋아요’를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">likes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 ‘좋아요’를 많이 주지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 처음에 올린 것은 평범한 일상 게시물이었고, 반응은 좋지 않았다는 \u003cb class=\"key\">배경\u003c/b>을 깔아 주는 문장이에요. 중간의 \u003cb class=\"key\">but\u003c/b>이 앞뒤를 대조시켜서, 왜 그녀가 더 센 사진을 고민하게 되는지 \u003cb class=\"key\">원인\u003c/b>을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 everyday와 부사구 every day의 구별\u003c/span> : [[everyday]](형용사) + 명사 / every day(부사구) : \"일상적인 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 과거 부정문(did not + 동사원형)\u003c/span> : 주어 + [[did not]] + [[동사원형]] : \"주지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">4형식(수여동사) 구문\u003c/span> : give + [[간접목적어]](her) + [[직접목적어]](many likes) : \"그녀에게 많은 ‘좋아요’를 주다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"At first, 처음에. she posted everyday things, 그녀는 일상적인 것들을 올렸지만. but people didn't give her, 사람들은 그녀에게 주지 않았다. many likes, 많은 ‘좋아요’를. 이 문장 전체를 해석하면, 처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 ‘좋아요’를 많이 주지 않았다.","hl":"m"},{"n":22,"text":"이 문장은 Goldilocks가 처음에 어떤 글을 올렸는지 알려 주는 배경 문장이에요. 일상적인 것들을 올렸는데 사람들이 좋아요를 많이 주지 않았다는 거죠. 여기서 but이 앞뒤를 대조시켜서, 왜 그녀가 더 자극적인 사진을 고민하게 되는지 그 원인을 만들어 줍니다.","hl":"mn"},{"n":23,"text":"먼저 didn't give를 보세요. 과거의 부정은 조동사 did에 not을 붙이고, 본동사는 동사원형 give로 돌아간다는 점이 핵심이에요. 두 번째로 give her many likes는 give가 ~에게 …을 주다라는 뜻의 수여동사라서 간접목적어 her와 직접목적어 many likes가 둘 다 필요한 구문이에요. 마지막으로 everyday things에서 everyday는 명사 things를 꾸미는 형용사이고, 매일이라는 뜻의 every day와는 띄어쓰기가 다르다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“내가 무엇을 해야 할까\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 ‘좋아요’를 받기 위해?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likes\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 생각했다.\u003c/span>\u003cspan class=\"en\">she thought.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“어떻게 하면 더 많은 ‘좋아요’를 받을 수 있지?” 그녀는 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 좋아요를 더 받고 싶어서 스스로에게 던진 \u003cb class=\"key\">질문\u003c/b>을 그대로 보여 주는 문장이에요. 무엇을 해야 할지 \u003cb class=\"key\">고민\u003c/b>하는 이 장면이 바로 다음 문장의 결심으로 이어지죠. 그래서 이 문장은 이야기가 방향을 트는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 직접의문문(의문사 + 조동사 + 주어)\u003c/span> : [의문사 What] + [조동사 should] + [주어 I] + [동사원형 do] : \"내가 무엇을 해야 할까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [행위] + [[to부정사]](목적: ~하기 위해) : \"더 많은 ‘좋아요’를 받기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"What should I do, “내가 무엇을 해야 할까. to get more likes?\", 더 많은 ‘좋아요’를 받기 위해?”. she thought, 그녀는 생각했다.. 이 문장 전체를 해석하면, “어떻게 하면 더 많은 ‘좋아요’를 받을 수 있지?” 그녀는 생각했다.","hl":"m"},{"n":25,"text":"이 문장은 Goldilocks가 좋아요를 더 받고 싶어서 스스로에게 던진 질문이에요. 무엇을 해야 할지 고민하는 장면이죠. 이 고민이 바로 다음 문장에서 웃긴 사진을 올리겠다는 결심으로 이어지니까, 흐름을 잘 따라와 주세요.","hl":"mn"},{"n":26,"text":"먼저 What should I do를 보세요. 의문사가 문장 맨 앞에 오면 조동사가 주어 앞으로 나와서 의문사, 조동사, 주어 순서라는 어순이 만들어져요. 그래서 I should가 아니라 should I가 되는 거예요. 그다음 to get more likes는 더 많은 좋아요를 받기 위해라는 목적을 나타내는 to부정사의 부사적 용법이에요. 여기서 to부정사는 무엇을 해야 하는지 그 목적을 설명해 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 알았다!”\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“알았다!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 스스로 해답을 찾아낸 \u003cb class=\"key\">깨달음\u003c/b>의 순간을 아주 짧게 보여 주는 문장이에요. 바로 뒤 문장의 \u003cb class=\"key\">결심\u003c/b>을 예고하는 \u003cb class=\"key\">신호\u003c/b> 역할을 하죠. 짧지만 이야기의 흐름에서 아주 중요한 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제(지금의 깨달음 표현)\u003c/span> : 주어 + [[현재시제 동사]] : \"나는 알았다, 알겠어\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"I, “나는. know!\", 알았다!”. 이 문장 전체를 해석하면, “알았다!”","hl":"m"},{"n":28,"text":"이 문장은 Goldilocks가 스스로 해답을 찾은 순간을 아주 짧게 보여 줘요. 아이디어가 떠올랐다는 깨달음의 표현이죠. 바로 다음 문장에서 어떤 결심을 하는지 이어지니까 흐름을 놓치지 마세요.","hl":"mn"},{"n":29,"text":"여기서는 I know가 현재시제로 쓰였어요. 방금 무언가를 깨달았을 때는 과거형 대신 현재시제 know를 써서 알았다, 알겠어 하는 느낌을 살려 줍니다. 짧은 한마디지만 다음 문장의 결심을 예고하는 아주 중요한 신호라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올려야겠어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">post \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웃긴 사진들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">funny \u003c/span>\u003cspan class=\"tgt\">pictures\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">웃긴 사진들을 올려야겠어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Goldilocks가 좋아요를 더 받기 위해 스스로 내린 \u003cb class=\"key\">결심\u003c/b>을 담은 문장이에요. 웃긴 사진을 올리겠다는 \u003cb class=\"key\">의지\u003c/b>를 should로 표현했죠. 앞 문장의 알았다! 하는 외침에 이어지는 \u003cb class=\"key\">해결책\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should + 동사원형\u003c/span> : 주어 + [[should]] + [[동사원형]] : \"올려야겠어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : post [타동사] + [[funny pictures (목적어)]] : \"웃긴 사진들을 올리다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I, 나는. should post, 올려야겠어. funny pictures, 웃긴 사진들을. 이 문장 전체를 해석하면, 웃긴 사진들을 올려야겠어.","hl":"m"},{"n":31,"text":"이 문장은 Goldilocks가 더 많은 좋아요를 받기 위해 스스로 내린 결심을 담고 있어요. 웃긴 사진을 올리겠다는 의지를 should로 표현했죠. 바로 앞의 알았다! 하는 외침에 이어지는 해결책인 거예요.","hl":"mn"},{"n":32,"text":"여기서 첫 번째 포인트는 조동사 should예요. 조동사 should 뒤에는 동사원형이 오는데, 여기서는 강한 의지와 결심을 나타내고 있어요. 두 번째로 post는 올리다, 게시하다라는 뜻의 타동사라서 뒤에 funny pictures라는 목적어가 와요. 그래서 웃긴 사진들을 올려야겠어라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 게시물은\u003c/span>\u003cspan class=\"en\">her posts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">받고 있었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">getting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 ‘좋아요’를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">likes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Goldilocks는 행복했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> Goldilocks was happy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 그녀의 게시물은 많은 ‘좋아요’를 받고 있었고, Goldilocks는 행복했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웃긴 사진을 올린 뒤 \u003cb class=\"key\">게시물\u003c/b>이 많은 \u003cb class=\"key\">좋아요\u003c/b>를 받으면서 Goldilocks가 \u003cb class=\"key\">행복\u003c/b>해졌다는 긍정적인 흐름이에요. 하지만 바로 다음 문장에서 팔로워들이 지루해졌다는 반전이 나오죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형(was/were + 현재분사)\u003c/span> : 주어 + [[was/were]] + [[현재분사]] : \"받고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 a lot of + 복수명사\u003c/span> : [[a lot of]] + [셀 수 있는 복수명사] : \"많은 ‘좋아요’를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and(절과 절의 병렬)\u003c/span> : [절] + [[and]] + [절] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Now, 이제. her posts, 그녀의 게시물은. were getting, 받고 있었고. a lot of likes, 많은 ‘좋아요’를. and Goldilocks was happy, 그리고 Goldilocks는 행복했다. 이 문장 전체를 해석하면, 이제, 그녀의 게시물은 많은 ‘좋아요’를 받고 있었고, Goldilocks는 행복했다.","hl":"m"},{"n":34,"text":"이 문장은 Goldilocks가 웃긴 사진을 올린 뒤 상황이 좋아졌다는 걸 보여 줘요. 게시물이 많은 좋아요를 받으면서 그녀가 행복해졌다는 긍정적인 흐름이에요. 하지만 바로 다음 문장에서 팔로워들이 지루해졌다는 반전이 나온답니다.","hl":"mn"},{"n":35,"text":"먼저 were getting은 과거진행형이에요. was/were 뒤에 현재분사가 오면 과거의 어느 시점에 진행 중이던 일을 나타내요. 두 번째로 and는 절과 절을 대등하게 이어 주는 등위접속사예요. 그래서 앞 절과 뒤 절이 같은 무게로 연결되죠. 세 번째로 a lot of는 셀 수 있는 복수명사 앞에 와서 많은이라는 뜻을 나타내는 수량 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 팔로워들은\u003c/span>\u003cspan class=\"en\">Her followers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧\u003c/span>\u003cspan class=\"en\">soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지루해졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">bored\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 그녀의 팔로워들은 곧 지루해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 좋아요가 늘어 행복해하던 흐름을 뒤집는 \u003cb class=\"key\">전환\u003c/b>의 문장이에요. 팔로워들이 곧 \u003cb class=\"key\">지루해졌다\u003c/b>는 건 자극적인 내용이 아니면 \u003cb class=\"key\">흥미\u003c/b>를 잃는다는 뜻이죠. 그래서 다음 문장에서 더 충격적인 사진을 올리기로 결심하게 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">삽입 부사 however\u003c/span> : 주어 + , [[however]], + 동사 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">get + 과거분사(상태 변화)\u003c/span> : [[get]] + [[과거분사]] : \"지루해졌다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Her followers, 그녀의 팔로워들은. however, 하지만. soon, 곧. got bored, 지루해졌다. 이 문장 전체를 해석하면, 하지만, 그녀의 팔로워들은 곧 지루해졌다.","hl":"m"},{"n":37,"text":"이 문장은 앞에서 좋아요가 늘어 행복해하던 흐름을 뒤집는 전환이에요. 팔로워들이 곧 지루해졌다는 건 자극적인 내용이 아니면 흥미를 잃는다는 뜻이죠. 그래서 다음 문장에서 더 충격적인 사진을 올리기로 결심하게 된답니다.","hl":"mn"},{"n":38,"text":"먼저 however는 문장 부사예요. 주어와 동사 사이에 콤마와 함께 삽입되어서 앞 내용과 전환되는 흐름을 만들어 주죠. 두 번째로 got bored는 get에 과거분사 bored가 결합한 형태예요. get이 become처럼 상태 변화, 즉 ~하게 되다라는 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 결심했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올리기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">post\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 충격적인 사진들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">shocking\u003c/span> pictures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 팔로워들이 지루해하자 Goldilocks가 점점 더 자극적인 사진을 올리기로 결심하는 장면으로, 이야기가 더 \u003cb class=\"key\">극단적\u003c/b>으로 흘러갈 것임을 예고하는 \u003cb class=\"key\">전환점\u003c/b>이에요. 'shocking'은 단순히 웃긴 것을 넘어 사람들을 놀라게 하는 \u003cb class=\"key\">충격적인\u003c/b> 사진을 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(decide의 목적어)\u003c/span> : decide [자동사·타동사] + [to post (to부정사구/목적어)] : \"올리기로 결심했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급(more + 형용사)\u003c/span> : more + [shocking (형용사)] → '더 충격적인' : \"더 충격적인\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"So, 그래서. she decided, 그녀는 결심했다. to post, 올리기로. more shocking pictures, 더 충격적인 사진들을. 이 문장 전체를 해석하면, 그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.","hl":"m"},{"n":40,"text":"이 문장은 팔로워들이 지루해하자 Goldilocks가 반응하는 장면이에요. 재미있는 사진으로도 부족하니까 점점 더 자극적인 쪽으로 가는 거죠. 그래서 이야기가 더 극단적으로 흘러갈 것임을 알려 주는 전환점이라고 보면 돼요.","hl":"mn"},{"n":41,"text":"먼저 decided to post를 보세요. decide 뒤에 to부정사가 오면 '~하기로 결심하다'라는 뜻이 되고, 이때 to부정사는 목적어 역할을 해요. 그래서 to post는 '올리다'가 아니라 '올리기로'라고 해석해야 자연스러워요. 다음으로 more shocking을 보세요. shocking처럼 긴 형용사는 -er을 붙이지 않고 앞에 more를 붙여서 비교급을 만들어요. 그래서 '더 충격적인'이라는 뜻이 되고, 앞에 나온 사진들과 비교하는 표현이 되는 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>작은 마을의 금발 소녀 Goldilocks는 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>에 사진을 공유하는 것을 좋아했다.\u003c/li>\u003cli>처음에는 \u003cb class=\"key\">일상적인\u003c/b> 것들을 올렸지만 사람들이 좋아요를 많이 주지 않아 고민했다.\u003c/li>\u003cli>웃긴 사진을 올려 많은 \u003cb class=\"key\">좋아요\u003c/b>를 받고 행복해했지만, 팔로워들은 곧 지루해졌다.\u003c/li>\u003cli>결국 그녀는 더 \u003cb class=\"key\">충격적인\u003c/b> 사진들을 올리기로 결심하며 자극이 점점 커졌다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Goldilocks keeps changing her posts, from everyday things to funny pictures and then to more shocking pictures, in order to get more likes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소셜 미디어에 사진을 공유하던 Goldilocks는 더 많은 \u003cb class=\"key\">좋아요\u003c/b>를 얻으려고 일상적인 게시물에서 웃긴 사진, 결국 더 충격적인 사진으로 점점 자극을 높여 간다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 내용을 정리해 볼게요. Goldilocks는 좋아요를 더 받으려고 일상적인 게시물에서 웃긴 사진으로, 다시 더 충격적인 사진으로 내용을 바꿔 갔어요. 좋아요를 좇는 마음이 게시물을 점점 자극적으로 만들고, 팔로워의 관심은 쉽게 식는다는 점이 이 이야기의 핵심이에요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
