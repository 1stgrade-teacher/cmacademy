  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"문법1","title":"to부정사의 부사적 용법 — '~하기 위해'를 말하는 to부정사","audioDir":"1_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">to부정사의 부사적 용법\u003c/div>\u003ch1>to부정사의 부사적 용법 — '~하기 위해'를 말하는 to부정사\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>to부정사가 '~하기 위해'라는 목적을 나타내는 부사적 용법을 익히고, 부정형과 다양한 의미까지 문맥으로 구분할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중1 동아 윤 7과에서 아주 중요한 문법을 하나 배워 볼 거예요. 바로 to부정사의 부사적 용법인데요, 오늘은 그중에서도 '~하기 위해'라는 목적을 나타내는 to부정사를 집중적으로 봅니다. 영화를 만들기 위해 열심히 일하는 사람들처럼, 우리가 어떤 행동을 하는 이유를 영어로 말할 수 있게 되는 거예요. 부정형과 문장 앞에 쓰는 방법, 그리고 감정의 원인이나 결과 같은 다른 의미까지 차근차근 같이 풀어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">형태 — to + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부사로 쓰이는 to부정사는 \u003cb class=\"key\">to+동사원형\u003c/b>의 형태로 씁니다. 여기서 to는 전치사가 아니라 to부정사를 만드는 표시이고, 뒤에는 언제나 \u003cb class=\"key\">동사원형\u003c/b>이 옵니다. 그래서 to 뒤에 ing나 과거형이 오면 틀린 문장이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Tom exercises every day \u003cspan class=\"fx\">to be healthy\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Tom은 건강해지기 위해 매일 운동을 한다.\u003c/div>\u003cdiv class=\"g-note\">to 뒤에 동사원형 be가 온 형태를 확인하는 예문이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>만 온다는 점을 헷갈리지 마세요.\u003c/div>","segs":[{"n":2,"text":"자, 먼저 형태부터 볼게요. 부사로 쓰이는 to부정사는 to와 동사원형을 붙여서 씁니다. 여기서 to는 전치사가 아니라 to부정사를 만드는 표시예요. 그래서 to 뒤에는 언제나 동사원형이 와야 하고, ing나 과거형이 오면 안 됩니다. 예를 들어 Tom exercises every day to be healthy라는 문장에서 to 뒤에 be가 그대로 온 것, 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"Tom exercises every day to be healthy. 이 문장은 Tom은 건강해지기 위해 매일 운동을 한다는 뜻이에요. 여기서 to be healthy를 보시면 to 뒤에 동사원형 be가 그대로 왔죠. 이렇게 to 뒤에는 언제나 동사원형이 온다는 점을 눈여겨봐 주세요.","hl":"ex-0"},{"n":4,"text":"특히 to 다음에 ing를 쓰는 실수가 정말 많아요. to 뒤에는 언제나 동사원형이라는 것, 입에 붙을 때까지 소리 내어 연습해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">의미와 쓰임 — 목적 (~하기 위해)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부사로 쓰인 to부정사는 '\u003cb class=\"key\">~하기 위해\u003c/b>'라는 의미로 어떤 행동의 \u003cb class=\"key\">목적\u003c/b>을 나타냅니다. 우리말로 해석할 때 'to + 동사원형' 부분을 '~하기 위해'로 읽으면 자연스럽습니다. 이때 to부정사 앞의 문장은 그 목적을 이루기 위한 행동이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">행동 + to + 동사원형 = ~하기 위해 …하다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A lot of people are working hard \u003cspan class=\"fx\">to create\u003c/span> this movie.\u003c/div>\u003cdiv class=\"g-ko\">많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다.\u003c/div>\u003cdiv class=\"g-note\">to create가 '만들기 위해'라는 목적을 나타내는 부사적 용법이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To capture\u003c/span> their happy moments, I’m going to use drones.\u003c/div>\u003cdiv class=\"g-ko\">그들의 행복한 순간을 포착하기 위해 나는 드론을 사용할 것이다.\u003c/div>\u003cdiv class=\"g-note\">to부정사구가 문장 앞에 나와 목적을 먼저 말해 주는 형태예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Olivia came to Seoul \u003cspan class=\"fx\">to study Korean\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Olivia는 한국어를 공부하기 위해 서울에 왔다.\u003c/div>\u003cdiv class=\"g-note\">came to Seoul이라는 행동의 목적이 to study Korean이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I went to the bakery \u003cspan class=\"fx\">to get some bread\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 빵을 좀 사기 위해 빵집에 갔다.\u003c/div>\u003cdiv class=\"g-note\">I wanted to get some bread, so I went to the bakery로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부사로 쓰인 to부정사가 \u003cb class=\"key\">목적\u003c/b>, \u003cb class=\"key\">결과\u003c/b>, \u003cb class=\"key\">감정의 원인\u003c/b> 중 어떤 의미인지 \u003cb class=\"key\">문맥\u003c/b>을 통해 파악해야 합니다.\u003c/div>","segs":[{"n":5,"text":"이번에는 의미와 쓰임을 볼게요. 부사로 쓰인 to부정사는 '~하기 위해'라는 뜻으로, 어떤 행동을 하는 목적을 나타냅니다. 해석할 때는 to 이하 부분을 '~하기 위해'로 먼저 읽어 보면 훨씬 자연스러워요. 예를 들어 We recycle to reduce waste는 우리는 재활용한다, 왜? 쓰레기를 줄이기 위해, 이렇게 목적이 붙는 구조예요. 앞에 있는 행동이 목적을 이루기 위한 행동이라는 점도 같이 기억해 주세요.","hl":"rule"},{"n":6,"text":"A lot of people are working hard to create this movie. 이 문장은 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다는 뜻이에요. 여기서 to create가 바로 '만들기 위해'라는 목적을 나타내는 부사적 용법이죠. 열심히 일하는 이유가 영화를 만들기 위해서라는 걸 to create가 알려 주고 있어요.","hl":"ex-0"},{"n":7,"text":"To capture their happy moments, I'm going to use drones. 이 문장은 그들의 행복한 순간을 포착하기 위해 나는 드론을 사용할 것이라는 뜻이에요. To capture가 문장 맨 앞에 나와서 목적을 먼저 알려 주고 있죠. 이렇게 to부정사구는 문장 앞에도 쓸 수 있다는 점, 꼭 기억해 두세요.","hl":"ex-1"},{"n":8,"text":"Olivia came to Seoul to study Korean. 이 문장은 Olivia는 한국어를 공부하기 위해 서울에 왔다는 뜻이에요. 서울에 온 이유가 바로 한국어를 공부하기 위해서라는 거죠. 여기서 to study Korean이 목적을 나타내는 부사적 용법이에요.","hl":"ex-2"},{"n":9,"text":"I went to the bakery to get some bread. 이 문장은 나는 빵을 좀 사기 위해 빵집에 갔다는 뜻이에요. 이 문장은 I wanted to get some bread, so I went to the bakery라고 바꿔 쓸 수도 있어요. 빵집에 간 목적이 빵을 사는 것이었다는 걸 to get some bread가 보여 주고 있는 거예요.","hl":"ex-3"},{"n":10,"text":"시험에서는 이 to부정사가 목적인지, 결과인지, 감정의 원인인지를 구분하는 문제가 자주 나와요. 그러니까 해석이 어색하면 문맥을 다시 한번 확인하는 습관을 꼭 들여 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">부정 — not + to부정사 (~하지 않기 위해)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">'~하지 않기 위해'라는 \u003cb class=\"key\">부정\u003c/b>의 의미는 \u003cb class=\"key\">not+to부정사\u003c/b>로 표현합니다. 이때 not은 반드시 to 앞에 씁니다. to 뒤에 not을 쓰면 틀린 문장이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">not + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I hurried \u003cspan class=\"fx\">not to be late\u003c/span> for my class.\u003c/div>\u003cdiv class=\"g-ko\">나는 수업에 늦지 않기 위해 서둘렀다.\u003c/div>\u003cdiv class=\"g-note\">not이 to 앞에 온 부정의 to부정사 형태를 확인해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I ran fast \u003cspan class=\"fx\">not to miss the bus\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 버스를 놓치지 않기 위해 빨리 뛰었다.\u003c/div>\u003cdiv class=\"g-note\">not이 to 앞에 와서 '놓치지 않기 위해'라는 부정의 목적을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부정의 to부정사에서 \u003cb class=\"key\">not\u003c/b>은 절대 to 뒤에 쓰지 않습니다.\u003c/div>","segs":[{"n":11,"text":"이번에는 부정의 의미를 볼게요. '~하지 않기 위해'라고 말하고 싶을 때는 not과 to부정사를 함께 씁니다. 중요한 건 순서인데요, not이 반드시 to 앞에 와야 해요. to not be late처럼 쓰면 틀리고, not to be late처럼 써야 맞습니다. 예를 들어 I hurried not to be late for my class는 나는 수업에 늦지 않기 위해 서둘렀다는 뜻이에요.","hl":"rule"},{"n":12,"text":"I hurried not to be late for my class. 이 문장은 나는 수업에 늦지 않기 위해 서둘렀다는 뜻이에요. 서두른 이유가 늦지 않기 위해서라는 목적을 나타내고 있죠. 여기서 not to be late처럼 not이 to 앞에 온 것, 꼭 눈으로 확인해 주세요.","hl":"ex-0"},{"n":13,"text":"I ran fast not to miss the bus. 이 문장은 나는 버스를 놓치지 않기 위해 빨리 뛰었다는 뜻이에요. 여기서도 not이 to 앞에 와서 '놓치지 않기 위해'라는 부정의 목적을 나타내고 있죠. 방금 배운 형태가 그대로 쓰였으니 아주 익숙하게 느껴질 거예요.","hl":"ex-1"},{"n":14,"text":"학생들이 가장 많이 하는 실수가 to not be late처럼 쓰는 거예요. not은 무조건 to 앞이라고 기억해 두시면 시험에서 실수하지 않아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">문장 앞에 쓰기 &amp; 다양한 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부사로 쓰이는 to부정사구는 \u003cb class=\"key\">문장 앞\u003c/b>에 쓸 수도 있습니다. 또한 목적 외에도 \u003cb class=\"key\">감정의 원인\u003c/b>이나 \u003cb class=\"key\">결과\u003c/b>의 의미로 쓰일 수 있어 문맥으로 파악해야 합니다. 형용사 뒤에서 '~하기에'라는 의미로 형용사를 수식하기도 합니다.\u003cdiv>\u003cspan class=\"g-formula\">To + 동사원형, 주어 + 동사 = ~하기 위해, …하다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To stay healthy\u003c/span>, eat fruits.\u003c/div>\u003cdiv class=\"g-ko\">건강을 유지하려면 과일을 먹어라.\u003c/div>\u003cdiv class=\"g-note\">to부정사구가 문장 앞에 나와 '~하려면'이라는 목적을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I’m so glad \u003cspan class=\"fx\">to meet you\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">당신을 만나서 정말 기뻐요.\u003c/div>\u003cdiv class=\"g-note\">glad라는 감정의 원인을 나타내는 '~해서'의 의미예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Greg lived \u003cspan class=\"fx\">to be ninety\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Greg는 90세까지 살았다.\u003c/div>\u003cdiv class=\"g-note\">살다라는 행동의 결과를 나타내는 '~해서 결국 …하다'의 의미예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The quiz is fun \u003cspan class=\"fx\">to solve\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 퀴즈는 풀기에 재미있다.\u003c/div>\u003cdiv class=\"g-note\">fun이라는 형용사를 '~하기에'라는 의미로 수식하는 쓰임이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>형태가 같아도 뜻이 다르므로, 해석이 어색하면 \u003cb class=\"key\">문맥\u003c/b>을 다시 확인하세요.\u003c/div>","segs":[{"n":15,"text":"마지막으로 확장된 쓰임을 볼게요. 부사로 쓰이는 to부정사구는 문장 앞에 나와서 목적을 먼저 말해 줄 수도 있습니다. 그리고 목적 말고도 다른 의미로 쓰일 때가 있는데요, 감정의 원인으로 '~해서'라는 뜻이 되기도 하고, 결과로 '~해서 결국 그렇게 되다'라는 뜻이 되기도 합니다. 또 형용사 뒤에 붙어 '~하기에'라는 의미로 형용사를 꾸며 주기도 해요. 그러니까 형태는 같아도 문맥에 따라 뜻이 달라진다는 점이 핵심입니다.","hl":"rule"},{"n":16,"text":"To stay healthy, eat fruits. 이 문장은 건강을 유지하려면 과일을 먹어라라는 뜻이에요. To stay healthy가 문장 맨 앞에 나와서 목적을 먼저 말해 주고 있죠. 이렇게 문장 앞에 오면 '~하려면'이라고 해석하면 아주 자연스러워요.","hl":"ex-0"},{"n":17,"text":"I'm so glad to meet you. 이 문장은 당신을 만나서 정말 기뻐요라는 뜻이에요. 여기서 to meet you는 '만나기 위해'가 아니라 기쁨이라는 감정의 원인을 나타내는 '~해서'의 의미예요. 같은 to부정사라도 이렇게 감정의 원인으로 쓰일 수 있다는 것, 꼭 기억해 주세요.","hl":"ex-1"},{"n":18,"text":"Greg lived to be ninety. 이 문장은 Greg는 구십 세까지 살았다는 뜻이에요. 여기서 to be ninety는 목적이 아니라 결과를 나타내는 표현이에요. 살다라는 행동의 결과가 구십 세까지였다는 뜻이죠.","hl":"ex-2"},{"n":19,"text":"The quiz is fun to solve. 이 문장은 그 퀴즈는 풀기에 재미있다는 뜻이에요. 여기서 to solve는 fun이라는 형용사를 '~하기에'라는 의미로 꾸며 주고 있죠. 같은 to부정사지만 문맥에 따라 이렇게 형용사를 수식하기도 한다는 점, 알아 두세요.","hl":"ex-3"},{"n":20,"text":"시험에서는 형태보다 의미 구분을 묻는 문제가 많이 나와요. 그러니까 이 문장에서 to부정사가 무슨 뜻으로 쓰였는지 항상 스스로 물어보는 습관을 가져 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I went to the bakery for get some bread.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I went to the bakery to get some bread.\u003c/div>\u003cdiv class=\"g-why\">목적을 나타낼 때는 for 다음에 동사원형을 쓰지 않고 to부정사를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I hurried to not be late for my class.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I hurried not to be late for my class.\u003c/div>\u003cdiv class=\"g-why\">부정의 to부정사는 not을 to 앞에 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Tom exercises every day to being healthy.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Tom exercises every day to be healthy.\u003c/div>\u003cdiv class=\"g-why\">to 뒤에는 동사원형이 와야 하므로 being이 아니라 be를 씁니다.\u003c/div>\u003c/div>","segs":[{"n":21,"text":"첫 번째로 많이 틀리는 문장을 볼게요. I went to the bakery for get some bread라고 쓰면 틀린 문장이에요. 목적을 나타낼 때는 for 다음에 동사원형을 쓰지 않고 to부정사를 써야 합니다. 그래서 I went to the bakery to get some bread가 맞는 문장이에요.","hl":"mk-0"},{"n":22,"text":"두 번째 문장을 볼게요. I hurried to not be late for my class라고 쓰면 틀려요. 부정의 to부정사에서는 not이 반드시 to 앞에 와야 하거든요. 그래서 I hurried not to be late for my class라고 써야 맞는 문장이 됩니다.","hl":"mk-1"},{"n":23,"text":"세 번째 문장도 확인해 볼게요. Tom exercises every day to being healthy라고 쓰면 틀린 문장이에요. to 뒤에는 언제나 동사원형이 와야 하니까 being이 아니라 be를 써야 합니다. 그래서 Tom exercises every day to be healthy가 맞는 문장이에요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 to부정사가 나타내는 의미로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">To capture their happy moments, I’m going to use drones.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>목적 (~하기 위해)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>감정의 원인 (~해서)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>결과 (~해서 결국 …하다)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>형용사 수식 (~하기에)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">목적 (~하기 위해)\u003c/span>\u003cdiv class=\"g-exp\">To capture는 '포착하기 위해'라는 목적을 나타내는 부사적 용법입니다. 드론을 사용하는 이유가 행복한 순간을 포착하기 위해서라는 목적을 보여 줍니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"첫 번째 문제입니다. To capture their happy moments, I'm going to use drones. 이 문장에서 to부정사가 나타내는 의미를 고르는 문제예요. 첫 번째 보기는 목적, 두 번째 보기는 감정의 원인, 세 번째 보기는 결과, 네 번째 보기는 형용사 수식입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 첫 번째 보기, 목적입니다. 이 문장은 그들의 행복한 순간을 포착하기 위해 나는 드론을 사용할 것이라는 뜻이에요. 드론을 사용하는 이유가 행복한 순간을 포착하기 위해서잖아요. 그래서 to capture는 '포착하기 위해'라는 목적을 나타내는 부사적 용법입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 같은 뜻이 되도록 빈칸에 알맞은 말을 쓰세요. (Olivia는 한국어를 공부하기 위해 서울에 왔다.)\u003c/div>\u003cdiv class=\"g-qs\">Olivia came to Seoul ____ Korean.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to study\u003c/span>\u003cdiv class=\"g-exp\">'한국어를 공부하기 위해'라는 목적을 나타내므로 to study가 들어갑니다. to부정사가 서울에 온 목적을 설명해 줍니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"두 번째 문제입니다. 우리말 해석은 Olivia는 한국어를 공부하기 위해 서울에 왔다이고, 문장은 Olivia came to Seoul, 그리고 빈칸, Korean입니다. 빈칸에 알맞은 말을 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 to study입니다. '한국어를 공부하기 위해'라는 목적을 나타내야 하니까 to부정사 to study가 들어가는 거예요. 완성된 문장은 Olivia came to Seoul to study Korean이고, 서울에 온 목적이 한국어를 공부하는 것이라는 뜻이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 잘못된 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I hurried to not be late for my class.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I hurried not to be late for my class.\u003c/span>\u003cdiv class=\"g-exp\">부정의 to부정사는 not을 to 앞에 씁니다. to not be late가 아니라 not to be late가 맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"세 번째 문제는 오류 수정입니다. I hurried to not be late for my class. 이 문장에서 잘못된 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 I hurried not to be late for my class입니다. 부정의 to부정사에서는 not이 반드시 to 앞에 와야 해요. 그래서 to not be late가 아니라 not to be late라고 써야 맞는 문장이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">every day / Tom / to / exercises / be / healthy\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Tom exercises every day to be healthy.\u003c/span>\u003cdiv class=\"g-exp\">주어 Tom 다음에 동사 exercises가 오고, 목적을 나타내는 to be healthy가 문장 ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to be\u003c/span>\u003cdiv class=\"g-exp\">살다라는 행동의 결과를 나타내는 to부정사가 쓰여 '~해서 결국 …하다'의 의미가 됩니다. to 뒤에는 동사원형이 옵니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":39,"text":"마지막 문제입니다. Greg lived, 빈칸, ninety. 빈칸에 들어갈 말을 고르세요. 첫 번째 보기는 be, 두 번째 보기는 to be, 세 번째 보기는 being, 네 번째 보기는 to being입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":40,"text":"","hl":"q","pause":6},{"n":41,"text":"정답은 두 번째 보기, to be입니다. 이 문장은 Greg는 구십 세까지 살았다는 뜻이고, 살다라는 행동의 결과가 구십 세까지였다는 것을 나타내죠. 그리고 to 뒤에는 언제나 동사원형이 오니까 to be가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사의 부사적 용법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>부사로 쓰이는 to부정사는 \u003cb class=\"key\">to+동사원형\u003c/b> 형태로 쓰고, '~하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타냅니다.\u003c/li>\u003cli>부정의 의미는 \u003cb class=\"key\">not+to부정사\u003c/b>로 '~하지 않기 위해'라고 표현합니다.\u003c/li>\u003cli>to부정사구는 \u003cb class=\"key\">문장 앞\u003c/b>에 쓸 수 있고, \u003cb class=\"key\">감정의 원인\u003c/b>이나 \u003cb class=\"key\">결과\u003c/b>의 의미로도 쓰입니다.\u003c/li>\u003cli>형태가 같아도 뜻이 다르므로 \u003cb class=\"key\">문맥\u003c/b>을 통해 의미를 파악해야 합니다.\u003c/li>\u003c/ul>","segs":[{"n":42,"text":"오늘은 to부정사의 부사적 용법을 배웠어요. 부사로 쓰이는 to부정사는 to와 동사원형 형태로 쓰이고, '~하기 위해'라는 목적을 나타낸다는 것 기억하시죠. 부정으로 쓰려면 not을 to 앞에 붙여서 '~하지 않기 위해'라고 표현하고요. 또 문장 앞에 쓸 수도 있고, 감정의 원인이나 결과, 형용사 수식의 의미로도 쓰인다는 것까지 정리해 봤습니다. 오늘 배운 문장들은 꼭 소리 내어 여러 번 읽어 보시고요, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
