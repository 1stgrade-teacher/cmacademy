</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"문법2","title":"시간의 접속사 when, after, before 완전 정복","audioDir":"2_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">2. 시간의 접속사 (시간 부사절)\u003c/div>\u003ch1>시간의 접속사 when, after, before 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>시간의 부사절을 이끄는 when, after, before의 쓰임을 익히고, 시간 부사절에서는 미래의 일도 현재시제로 쓴다는 규칙을 설명할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중일 동아윤 교과서 칠과의 두번째 문법인 시간의 접속사에 대해 함께 공부해 볼 거예요. when, after, before처럼 시간을 알려 주는 접속사가 문장에서 어떤 역할을 하는지 살펴볼게요. 그리고 시간 부사절에서는 미래의 일도 현재시제로 쓴다는 아주 중요한 규칙도 배웁니다. 오늘도 재미있게 따라와 주세요!","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">부사절과 시간의 부사절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사로 시작되는 절이 다른 절의 의미를 더해 주는 부사 역할을 하면 이를 \u003cb class=\"key\">부사절\u003c/b>이라고 합니다. 시간의 부사절을 이끄는 접속사에는 when, after, before 등이 있습니다. 부사절은 \u003cb class=\"key\">주절\u003c/b>의 앞이나 뒤에 올 수 있고, 앞에 올 때는 부사절 끝에 \u003cb class=\"key\">콤마\u003c/b>(,)를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주절 + 접속사 + 주어 + 동사 / 접속사 + 주어 + 동사, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Max gets too excited \u003cspan class=\"fx\">when a lot of people are around\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Max는 주변에 사람들이 많을 때 가끔 너무 흥분한다.\u003c/div>\u003cdiv class=\"g-note\">when이 이끄는 시간 부사절이 주절 뒤에 온 경우입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I take a nap \u003cspan class=\"fx\">when I feel tired\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 피곤할 때 낮잠을 잔다.\u003c/div>\u003cdiv class=\"g-note\">부사절이 주절 뒤에 오면 콤마를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When I feel tired,\u003c/span> I take a nap.\u003c/div>\u003cdiv class=\"g-ko\">나는 피곤할 때 낮잠을 잔다.\u003c/div>\u003cdiv class=\"g-note\">부사절이 앞에 오면 부사절 끝에 콤마를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>부사절이 \u003cb class=\"key\">문장 앞\u003c/b>에 오면 부사절 끝에 \u003cb class=\"key\">콤마\u003c/b>를 꼭 써야 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 부사절이 뭔지 알아볼까요? 접속사로 시작하는 절이 다른 절의 의미를 더해 주면서 부사처럼 일을 하면 그걸 부사절이라고 불러요. 시간을 나타내는 부사절은 when, after, before 같은 접속사가 이끌어 줍니다. 이 부사절은 주절 앞에도 오고 뒤에도 올 수 있는데요. 부사절이 앞에 올 때는 부사절이 끝나는 자리에 콤마를 꼭 찍어 줘야 합니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. Max gets too excited when a lot of people are around. 이 문장은 Max는 주변에 사람들이 많을 때 가끔 너무 흥분한다는 뜻이에요. 앞부분 Max gets too excited가 주절이고, when a lot of people are around가 시간 부사절이죠.","hl":"ex-0"},{"n":4,"text":"다음은 I take a nap when I feel tired. 나는 피곤할 때 낮잠을 잔다라는 뜻이에요. 여기서는 부사절이 주절 뒤에 왔기 때문에 중간에 콤마가 없습니다.","hl":"ex-1"},{"n":5,"text":"이번에는 순서를 바꿔 볼게요. When I feel tired, I take a nap. 뜻은 똑같이 나는 피곤할 때 낮잠을 잔다예요. 부사절이 앞으로 나왔기 때문에 when I feel tired 뒤에 콤마가 있는 걸 꼭 확인해 주세요.","hl":"ex-2"},{"n":6,"text":"부사절이 문장 앞에 올 때는 콤마를 잊지 마세요. 콤마 하나 때문에 시험에서 틀리는 경우가 정말 많답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">시간 접속사 when (~할 때)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">when은 \u003cb class=\"key\">~할 때\u003c/b>라는 뜻으로, 두 일이 같은 시점에 일어남을 나타냅니다. when이 이끄는 부사절이 \u003cb class=\"key\">주절\u003c/b>보다 앞에 오면 그 뒤에 콤마를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">When + 주어 + 동사, 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When I hear that song\u003c/span>, I feel happy.\u003c/div>\u003cdiv class=\"g-ko\">그 노래를 들을 때 나는 행복해진다.\u003c/div>\u003cdiv class=\"g-note\">when 부사절이 앞에 오고 콤마가 뒤따릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I create sound effects in my studio \u003cspan class=\"fx\">when recording on location is not easy\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 현장에서 녹음하는 게 쉽지 않을 때 내 작업실에서 음향 효과를 만든다.\u003c/div>\u003cdiv class=\"g-note\">when 뒤에 절 전체가 와서 시간의 상황을 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He paints pictures \u003cspan class=\"fx\">when he has free time\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 시간이 날 때 그림을 그린다.\u003c/div>\u003cdiv class=\"g-note\">when은 반복되는 습관을 말할 때도 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>when은 \u003cb class=\"key\">~할 때\u003c/b>라는 뜻으로, 두 일이 같은 \u003cb class=\"key\">시점\u003c/b>에 일어날 때 씁니다.\u003c/div>","segs":[{"n":7,"text":"이제 when을 자세히 볼게요. when은 우리말로 할 때라는 뜻이고, 두 가지 일이 같은 시점에 일어난다는 걸 보여 줘요. when이 이끄는 부사절이 주절보다 앞에 오면 그 뒤에 콤마를 씁니다. 또 when은 반복되는 습관을 말할 때도 자주 씁니다.","hl":"rule"},{"n":8,"text":"When I hear that song, I feel happy. 그 노래를 들을 때 나는 행복해진다라는 뜻이에요. when I hear that song이 시간 부사절이고 그 뒤에 콤마가 있죠.","hl":"ex-0"},{"n":9,"text":"I create sound effects in my studio when recording on location is not easy. 나는 현장에서 녹음하는 게 쉽지 않을 때 내 작업실에서 음향 효과를 만든다는 뜻이에요. when 뒤에 recording on location is not easy라는 절이 온 걸 볼 수 있어요.","hl":"ex-1"},{"n":10,"text":"He paints pictures when he has free time. 그는 시간이 날 때 그림을 그린다는 뜻이에요. 이렇게 when은 반복되는 습관을 말할 때도 자주 쓰인답니다.","hl":"ex-2"},{"n":11,"text":"when은 두 일이 같은 시점에 일어난다는 느낌을 담고 있어요. 그래서 뜻을 물어보는 문제가 자주 나옵니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">시간 접속사 after (~한 후에)와 before (~하기 전에)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">after는 \u003cb class=\"key\">~한 후에\u003c/b>, before는 \u003cb class=\"key\">~하기 전에\u003c/b>라는 뜻으로 두 일의 순서를 나타냅니다. after 뒤에는 먼저 일어난 일이, before 뒤에는 나중에 일어난 일이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">주절 + after + 주어 + 동사 / before + 주어 + 동사, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Kevin played outside \u003cspan class=\"fx\">after he did his homework\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Kevin은 숙제를 한 후에 밖에서 놀았다.\u003c/div>\u003cdiv class=\"g-note\">after 뒤에는 먼저 일어난 일인 숙제가 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My work begins \u003cspan class=\"fx\">after the shooting is over\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 일은 촬영이 끝난 후에 시작된다.\u003c/div>\u003cdiv class=\"g-note\">after 뒤에는 먼저 끝난 일이 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He took a shower \u003cspan class=\"fx\">before he went to bed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 잠자리에 들기 전에 샤워를 했다.\u003c/div>\u003cdiv class=\"g-note\">before 뒤에는 나중에 일어난 일이 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Before you eat,\u003c/span> you should wash your hands.\u003c/div>\u003cdiv class=\"g-ko\">먹기 전에 너는 네 손을 씻어야 한다.\u003c/div>\u003cdiv class=\"g-note\">부사절이 앞에 오면 끝에 콤마를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>after와 before는 \u003cb class=\"key\">순서\u003c/b>를 나타내며, after 뒤에는 \u003cb class=\"key\">먼저\u003c/b> 일어난 일이 옵니다.\u003c/div>","segs":[{"n":12,"text":"이번에는 순서를 나타내는 after와 before를 배워 볼게요. after는 한 후에, before는 하기 전에라는 뜻이에요. after 뒤에는 먼저 일어난 일이 오고, before 뒤에는 나중에 일어난 일이 옵니다. 그래서 두 접속사는 두 사건의 순서를 정확히 알려 줍니다.","hl":"rule"},{"n":13,"text":"Kevin played outside after he did his homework. Kevin은 숙제를 한 후에 밖에서 놀았다라는 뜻이에요. after 뒤에 먼저 일어난 일인 숙제가 온 걸 확인해 보세요.","hl":"ex-0"},{"n":14,"text":"My work begins after the shooting is over. 내 일은 촬영이 끝난 후에 시작된다는 뜻이에요. 촬영이 먼저 끝나고 그다음에 일이 시작된다는 순서가 보이죠.","hl":"ex-1"},{"n":15,"text":"He took a shower before he went to bed. 그는 잠자리에 들기 전에 샤워를 했다라는 뜻이에요. 샤워가 먼저이고 잠자리에 드는 일이 나중이라는 순서를 before가 알려 줍니다.","hl":"ex-2"},{"n":16,"text":"Before you eat, you should wash your hands. 먹기 전에 너는 네 손을 씻어야 한다는 뜻이에요. before 부사절이 문장 앞에 왔기 때문에 뒤에 콤마가 있는 것도 함께 기억해 주세요.","hl":"ex-3"},{"n":17,"text":"after와 before는 순서를 알려 주는 접속사예요. 누가 먼저 일어난 일인지 잘 구분해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">시간 부사절에서는 미래를 현재시제로\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시간을 나타내는 부사절이 \u003cb class=\"key\">미래\u003c/b>의 일을 나타내더라도 동사는 \u003cb class=\"key\">현재시제\u003c/b>로 씁니다. 미래를 나타내는 will은 시간 부사절 안에 쓰지 않습니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + will + 동사 ~ when + 주어 + 동사(현재)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We will have dinner \u003cspan class=\"fx\">when Amy arrives\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 Amy가 도착하면 저녁을 먹을 것이다.\u003c/div>\u003cdiv class=\"g-note\">when Amy will arrive라고 쓰면 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I will call you \u003cspan class=\"fx\">after I get home\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 집에 도착한 후에 너에게 전화할 것이다.\u003c/div>\u003cdiv class=\"g-note\">after 뒤에도 미래의 일을 현재시제로 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시간 부사절 안에서는 \u003cb class=\"key\">will\u003c/b>을 쓰지 않고 \u003cb class=\"key\">현재시제\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":18,"text":"마지막으로 아주 중요한 규칙이에요. 시간을 나타내는 부사절이 미래의 일을 말하더라도 동사는 현재시제로 씁니다. 그래서 시간 부사절 안에는 will을 쓰지 않아요. 우리말로는 미래처럼 느껴져도 영어에서는 현재시제로 표현한다는 점, 꼭 기억해 주세요.","hl":"rule"},{"n":19,"text":"We will have dinner when Amy arrives. 우리는 Amy가 도착하면 저녁을 먹을 거라는 뜻이에요. 주절에는 will이 있지만 when 뒤에는 arrives라는 현재시제가 온 걸 보세요. when Amy will arrive라고 쓰면 틀린 문장이 됩니다.","hl":"ex-0"},{"n":20,"text":"I will call you after I get home. 나는 집에 도착한 후에 너에게 전화할 거라는 뜻이에요. 여기서도 after 뒤에는 will이 아니라 get이라는 현재시제가 왔죠. 시간 부사절에서는 미래도 현재시제로 쓴다는 규칙이 그대로 적용됐어요.","hl":"ex-1"},{"n":21,"text":"시간 부사절 안에 will을 쓰면 틀려요. 미래의 일이어도 현재시제로 쓴다는 것, 시험에 정말 자주 나옵니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>We will have dinner when Amy will arrive.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ We will have dinner when Amy arrives.\u003c/div>\u003cdiv class=\"g-why\">시간을 나타내는 부사절에서는 미래의 일도 현재시제로 쓰기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>When I feel tired I take a nap.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ When I feel tired, I take a nap.\u003c/div>\u003cdiv class=\"g-why\">부사절이 문장 앞에 오면 부사절 끝에 콤마를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I will call you before I will leave.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I will call you before I leave.\u003c/div>\u003cdiv class=\"g-why\">before가 이끄는 시간 부사절 안에서는 will을 쓰지 않습니다.\u003c/div>\u003c/div>","segs":[{"n":22,"text":"이 문장은 시간 부사절 안에 will을 썼기 때문에 틀렸어요. 주절의 will은 그대로 두고, when 뒤의 will arrive는 arrives로 바꿔 줘야 합니다. 시간 부사절에서는 미래의 일도 현재시제로 쓴다는 규칙을 기억해 주세요.","hl":"mk-0"},{"n":23,"text":"이 문장은 부사절이 문장 앞에 왔는데 콤마가 빠졌어요. when I feel tired 뒤에 콤마를 찍어 주면 됩니다. 콤마 하나만 빠져도 틀린 문장이 되니 꼭 확인하세요.","hl":"mk-1"},{"n":24,"text":"이 문장도 before 뒤에 will을 써서 틀렸어요. before가 이끄는 시간 부사절 안에서는 will을 쓰지 않고 현재시제를 씁니다. 그래서 before I leave라고 고쳐야 맞는 문장이 됩니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">그녀는 친구들을 볼 때 웃는다. -&gt; She smiles (when/before) she sees her friends.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>after\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>because\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">when\u003c/span>\u003cdiv class=\"g-exp\">우리말이 ~할 때라는 뜻이므로 시간의 접속사 when이 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"첫 번째 문제입니다. 그녀는 친구들을 볼 때 웃는다를 영어로 옮기면 She smiles 다음에 when이 들어갈지 before가 들어갈지 고르는 문제예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 첫 번째 보기 when이에요. 우리말이 친구들을 볼 때이니까 시간의 접속사 when이 알맞습니다. She smiles when she sees her friends. 이렇게 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">나는 공부할 때 음악을 듣는다. -&gt; I listen to music (but/when) I study.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>but\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>after\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">when\u003c/span>\u003cdiv class=\"g-exp\">공부할 때라는 시간의 상황을 나타내므로 when이 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"두 번째 문제입니다. 나는 공부할 때 음악을 듣는다를 영어로 옮긴 문장이에요. 괄호 안에서 알맞은 접속사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 두 번째 보기 when이에요. when은 할 때라는 뜻으로 시간의 상황을 알려 줍니다. but은 뜻이 맞지 않으니 when을 골라야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">그녀는 쿠키를 구운 후에 부엌을 청소했다. -&gt; She cleaned the kitchen (after/when) she baked cookies.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>after\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>because\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">after\u003c/span>\u003cdiv class=\"g-exp\">쿠키를 구운 후에라는 순서를 나타내므로 after가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"세 번째 문제입니다. 그녀는 쿠키를 구운 후에 부엌을 청소했다를 영어로 옮긴 문장이에요. 순서를 잘 보고 알맞은 접속사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 첫 번째 보기 after예요. 우리말에 후에라는 순서가 있으니까 after가 맞습니다. She cleaned the kitchen after she baked cookies. 이렇게 쓰면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">떠나기 전에 우리는 불을 껐다. -&gt; We turned off the lights (after/before) we left.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>after\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>because\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">before\u003c/span>\u003cdiv class=\"g-exp\">떠나기 전에라는 뜻이므로 before가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"네 번째 문제입니다. 떠나기 전에 우리는 불을 껐다를 영어로 옮긴 문장이에요. 전에라는 뜻을 담은 접속사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 두 번째 보기 before예요. before는 하기 전에라는 뜻이니까 불을 끄는 일이 먼저, 떠나는 일이 나중이라는 순서가 잘 드러납니다. We turned off the lights before we left. 이렇게 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">그는 시간이 날 때 그림을 그린다. -&gt; He paints pictures (when/after) he has free time.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>after\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>if\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">when\u003c/span>\u003cdiv class=\"g-exp\">시간이 날 때라는 뜻이므로 when이 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"다섯 번째 문제입니다. 그는 시간이 날 때 그림을 그린다를 영어로 옮긴 문장이에요. 때라는 뜻을 가진 접속사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 첫 번째 보기 when이에요. 시간이 날 때라는 뜻이니까 when이 맞습니다. after를 쓰면 시간이 난 후에라는 엉뚱한 뜻이 되어 버립니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 의미가 같도록 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">우리는 Amy가 도착하면 저녁을 먹을 것이다. -&gt; We will have dinner when Amy ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>arrives\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>will arrive\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>arrived\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>is arriving\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">arrives\u003c/span>\u003cdiv class=\"g-exp\">시간을 나타내는 부사절에서는 미래의 일도 현재시제로 쓰므로 arrives가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"마지막 문제입니다. 우리는 Amy가 도착하면 저녁을 먹을 것이라는 문장이에요. 주절에는 will이 있지만 when 뒤에는 어떤 형태가 와야 할지 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":6},{"n":42,"text":"정답은 첫 번째 보기 arrives예요. 시간을 나타내는 부사절에서는 미래의 일이더라도 현재시제로 씁니다. 그래서 when Amy will arrive가 아니라 when Amy arrives라고 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">2. 시간의 접속사 (시간 부사절)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>시간의 부사절을 이끄는 접속사에는 \u003cb class=\"key\">when\u003c/b>, \u003cb class=\"key\">after\u003c/b>, \u003cb class=\"key\">before\u003c/b>가 있습니다.\u003c/li>\u003cli>부사절이 문장 앞에 오면 부사절 끝에 \u003cb class=\"key\">콤마\u003c/b>를 씁니다.\u003c/li>\u003cli>after는 \u003cb class=\"key\">~한 후에\u003c/b>, before는 \u003cb class=\"key\">~하기 전에\u003c/b>라는 뜻으로 순서를 나타냅니다.\u003c/li>\u003cli>시간 부사절에서는 미래의 일도 \u003cb class=\"key\">현재시제\u003c/b>로 씁니다.\u003c/li>\u003c/ul>","segs":[{"n":43,"text":"오늘은 시간의 접속사 when, after, before를 배웠어요. 시간의 부사절은 주절 앞이나 뒤에 올 수 있고, 앞에 올 때는 콤마를 쓴다는 것도 확인했습니다. 그리고 after는 한 후에, before는 하기 전에라는 뜻으로 두 일의 순서를 알려 준다는 것도 기억해 주세요. 가장 중요한 규칙은 시간 부사절에서 미래의 일도 현재시제로 쓴다는 점이었죠. 오늘 배운 내용 꼭 복습하고, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script></body></html>
