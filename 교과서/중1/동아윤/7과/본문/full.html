<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 7과 본문 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 7과 본문","audioDir":"full_audio","preview":false,"count":97,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중1\u003cbr>동아(윤)\u003cbr>7과 본문\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>The People Behind the Movie 'Happy Days'\u003c/h1>\u003ch2>영화 'Happy Days'를 만드는 사람들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 영화 'Happy Days'의 감독 Jim Brown이 여러 \u003cb class=\"key\">제작진\u003c/b>을 소개하며, 로케이션 매니저·촬영감독·동물 조련사·영화 편집자·폴리 아티스트가 각자 맡은 일을 설명한다. 이는 한 편의 영화가 서로 다른 \u003cb class=\"key\">전문가\u003c/b>들의 협업으로 완성된다는 것을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A single movie is completed through the collaboration of many people who each play a different role.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 영화 Happy Days를 만드는 사람들의 이야기를 함께 읽어 볼 거예요. 이 글은 감독 Jim Brown의 소개로 시작해서, 영화를 만드는 여러 제작진이 자기 직업을 소개하는 내용이에요. 요약하면 한 편의 영화가 여러 전문가의 협업으로 완성된다는 것이고, 요지는 영화 제작에는 서로 다른 역할을 맡은 많은 사람들이 함께 일한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">영화 한 편이 완성되기까지는 감독(director) 혼자만의 힘으로는 불가능해요. 로케이션 매니저(location manager)가 촬영 장소를 찾고, 촬영감독(director of photography)이 카메라를 담당하며, 동물 조련사(animal wrangler)가 동물 배우를 관리하는 식으로 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">분담\u003c/b>이 이루어지죠. 촬영이 끝나면 영화 편집자(film editor)가 장면의 순서를 바꾸거나 삭제하며 \u003cb class=\"key\">이야기\u003c/b>를 다듬고, 폴리 아티스트(Foley artist)는 실제로 녹음하기 어려운 소리를 작업실에서 인위적으로 만들어 냅니다. 이는 마치 오케스트라가 각자 다른 악기를 연주하지만 결국 하나의 곡을 완성하는 것과 같아요. 이처럼 영화는 서로 다른 \u003cb class=\"key\">전문가\u003c/b>들이 협업하여 완성하는 종합 예술이에요.\u003c/div>","segs":[{"n":2,"text":"영화 한 편이 완성되기까지는 감독 혼자만의 힘으로는 불가능해요. 로케이션 매니저가 촬영 장소를 찾고, 촬영감독이 카메라를 담당하며, 동물 조련사가 동물 배우를 관리하는 식으로 역할 분담이 이루어지죠. 촬영이 끝나면 영화 편집자가 장면의 순서를 바꾸거나 삭제하며 이야기를 다듬고, 폴리 아티스트는 실제로 녹음하기 어려운 소리를 작업실에서 인위적으로 만들어 냅니다. 이건 마치 오케스트라가 각자 다른 악기를 연주하지만 결국 하나의 곡을 완성하는 것과 같아요. 이처럼 영화는 서로 다른 전문가들이 협업해서 완성하는 종합 예술이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>영화와 제작진 소개\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>감독 Jim Brown이 자신을 소개하며 이 영화가 Tom과 그의 개 Max의 \u003cb class=\"key\">우정\u003c/b>에 관한 작품이라고 밝혀요. 그리고 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다고 말하며, 그들 중 몇 명을 만나 보고 싶은지 \u003cb class=\"key\">질문\u003c/b>을 던져요. 이 도입부가 앞으로 제작진을 소개하겠다는 신호가 되는 거죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>로케이션 매니저 Anna\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>Anna는 자기가 이 아름다운 해변을 찾아냈다고 말하며 자신이 \u003cb class=\"key\">야외 \u003c/b>\u003cb class=\"key\">촬영 \u003c/b>\u003cb class=\"key\">관리자\u003c/b>라고 소개해요. 그녀의 일은 촬영을 위한 완벽한 장소를 찾는 것이고, 쉽지는 않지만 여행을 좋아하고 도전을 즐기기 때문에 \u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 정말 좋아한다고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>촬영감독 Peter\u003csmall>예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>Peter는 이 영화의 \u003cb class=\"key\">촬영감독\u003c/b>으로서 모든 카메라를 담당하고 있다고 소개해요. 오늘 Tom과 Max가 해변에서 공을 가지고 함께 놀 예정이라고 설명하며, 그들의 \u003cb class=\"key\">행복한 \u003c/b>\u003cb class=\"key\">순간\u003c/b>을 포착하기 위해 드론을 사용할 거라고 밝혀요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>동물 조련사 Jennifer\u003csmall>예시 · 문장 13–18\u003c/small>\u003c/h4>\u003cp>Jennifer는 Max를 오랫동안 훈련하고 돌봤다고 말해요. Max는 훌륭한 배우이지만 주변에 사람이 많을 때 가끔 너무 \u003cb class=\"key\">흥분\u003c/b>하기 때문에, 그를 진정시키기 위해 \u003cb class=\"key\">수신호\u003c/b>를 사용한다고 해요. 그리고 스스로 질문을 던진 뒤 자신이 동물 조련사라고 답해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>편집자 Emma와 폴리 아티스트 Chris\u003csmall>결론 · 문장 19–28\u003c/small>\u003c/h4>\u003cp>Emma는 촬영이 끝나고 나서 일이 시작되는 \u003cb class=\"key\">영화 \u003c/b>\u003cb class=\"key\">편집자\u003c/b>로, 더 좋은 이야기를 만들기 위해 장면의 순서를 바꾸거나 일부를 삭제하기도 해요. Chris는 야외에서 녹음하기 어려울 때 작업실에서 음향 효과를 만드는 \u003cb class=\"key\">폴리 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>이고, 쌀과 플라스틱 통으로 파도 소리를 만들어 진짜처럼 들리게 한다고 말해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그러면 이제 글의 흐름을 따라가면서 각 제작진이 무슨 일을 하는지 하나씩 살펴볼게요.","hl":null},{"n":4,"text":"먼저 감독 Jim Brown이 자신을 소개하면서, 이 영화가 Tom과 그의 개 Max의 우정에 관한 작품이라고 밝혀요. 그리고 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다고 말하면서, 그들 중 몇 명을 만나 보고 싶은지 질문을 던지죠. 이 도입부가 앞으로 제작진을 소개하겠다는 신호가 되는 거예요.","hl":"f0"},{"n":5,"text":"다음은 로케이션 매니저 Anna예요. 그녀는 자기가 이 아름다운 해변을 찾아냈다고 말하고, 자신의 일은 촬영을 위한 완벽한 장소를 찾는 것이라고 소개해요. 쉽지는 않지만 여행을 좋아하고 도전을 즐기기 때문에 자기 일을 정말 좋아한다고 하죠.","hl":"f1"},{"n":6,"text":"그다음은 촬영감독 Peter예요. 그는 이 영화의 모든 카메라를 담당하고 있다고 말해요. 오늘 Tom과 Max가 해변에서 공을 가지고 함께 놀 예정인데, 그들의 행복한 순간을 포착하기 위해 드론을 사용할 거라고 밝히죠.","hl":"f2"},{"n":7,"text":"이번에는 Jennifer 차례예요. 그녀는 Max를 오랫동안 훈련하고 돌봤다고 말해요. Max는 훌륭한 배우이지만 주변에 사람이 많을 때 가끔 너무 흥분해서, 그를 진정시키기 위해 수신호를 사용한다고 하죠. 그리고 나는 누구일까요라고 물은 뒤에 자신이 동물 조련사라고 답해요.","hl":"f3"},{"n":8,"text":"마지막으로 영화 편집자 Emma와 폴리 아티스트 Chris가 나와요. Emma의 일은 촬영이 끝나고 나서 시작되고, 더 좋은 이야기를 만들기 위해 장면의 순서를 바꾸거나 일부를 삭제하기도 하죠. Chris는 야외 촬영장에서 녹음하기 어려울 때 작업실에서 음향 효과를 만들고, 쌀과 플라스틱 통으로 파도 소리를 만들어 진짜처럼 들리게 한다고 말해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 앞부분에서 감독이 영화를 소개하며 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다는 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시해요. 이후 각 제작진이 스스로 \u003cb class=\"key\">질문\u003c/b>을 던지고 바로 답하며 자기 직업을 소개하는 방식이 반복되죠. 이는 핵심 내용을 앞에서 먼저 던지는 \u003cb class=\"key\">두괄식\u003c/b> 구성이에요. 그래서 주제문은 세 번째 문장이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Do you want to meet some of them? (4)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>but (7)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Who am I? (17)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>So (16)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>after (20)\u003c/b>\u003cspan>시간\u003c/span>\u003cb>To create (21)\u003c/b>\u003cspan>목적\u003c/span>\u003cb>when (24)\u003c/b>\u003cspan>시간·조건\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">working hard to create this movie\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my job is to find perfect places for shooting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I'm in charge of all the cameras\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I trained and took care of Max\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">My work begins after the shooting is over\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I create sound effects in my studio\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문과 답변의 방식으로 이어지는 글이라고 볼 수 있어요. 감독이 먼저 만나 보고 싶은지 물어보고, 각 제작진이 나는 누구일까요라고 스스로 묻고는 바로 답을 하죠. 또 전체를 아우르는 주제문이 글 앞부분에 나오는 두괄식 구조예요. 그래서 주제문은 세 번째 문장인, 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다는 부분이 됩니다.","hl":"ty"},{"n":10,"text":"신호어를 보면, 네 번째 문장의 Do you want to meet some of them 같은 질문 표현이 제작진 소개를 예고하고, 열일곱 번째 문장의 Who am I도 같은 역할을 해요. 또 일곱 번째 문장의 but은 쉽지 않지만 좋아한다는 대조를 만들고, 열여섯 번째 문장의 So는 흥분하기 때문에 진정시킨다는 결과를 연결하죠. 이렇게 각 인물이 자기 직업을 소개하는 문장들을 같은 개념을 바꿔 말한 표현으로 묶어서 보면 글 전체 구조가 잘 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>director\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감독\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우정\u003c/span>\u003c/div>\u003cdiv>\u003cb>work hard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열심히 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>location\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소, 위치\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>shooting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>촬영\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도전\u003c/span>\u003c/div>\u003cdiv>\u003cb>photography\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사진 촬영\u003c/span>\u003c/div>\u003cdiv>\u003cb>be in charge of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 담당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>capture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>moment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순간\u003c/span>\u003c/div>\u003cdiv>\u003cb>drone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>드론, 무인 항공기\u003c/span>\u003c/div>\u003cdiv>\u003cb>train\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훈련하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>excited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>hand signal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진정시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>animal wrangler\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물 조련사\u003c/span>\u003c/div>\u003cdiv>\u003cb>film editor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영화 편집자\u003c/span>\u003c/div>\u003cdiv>\u003cb>scene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장면\u003c/span>\u003c/div>\u003cdiv>\u003cb>delete\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삭제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>order\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순서\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음향 효과\u003c/span>\u003c/div>\u003cdiv>\u003cb>record\u003c/b>\u003cem>동사\u003c/em>\u003cspan>녹음하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진짜의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어를 몇 개 짚어 볼게요. director는 감독, capture는 포착하다, calm은 진정시키다는 뜻이에요. 또 be in charge of는 담당하다, take care of는 돌보다라는 뜻으로, 각 인물의 역할을 설명하는 중요한 표현이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"s\">flawless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imperfect\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">capture\u003c/b>\u003cspan class=\"m\">포착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">catch\u003c/span>\u003cspan class=\"s\">seize\u003c/span>\u003cspan class=\"s\">record\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calm\u003c/b>\u003cspan class=\"m\">진정시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">soothe\u003c/span>\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"s\">comfort\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">excite\u003c/span>\u003cspan class=\"a\">agitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">excited\u003c/b>\u003cspan class=\"m\">흥분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilled\u003c/span>\u003cspan class=\"s\">eager\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">bored\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">real\u003c/b>\u003cspan class=\"m\">진짜의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">artificial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">change\u003c/b>\u003cspan class=\"m\">바꾸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 둘게요. create는 만들다라는 뜻으로 make나 produce와 비슷하고 destroy와는 반대예요. perfect는 완벽한이라는 뜻이고 ideal, flawless와 가깝죠. capture는 catch, seize와 비슷하고 release, miss와 반대이며, calm은 soothe, quiet와 가깝고 excite와 반대예요. excited는 thrilled와 비슷하고, real은 genuine, actual과 가깝고 fake나 artificial과 반대라는 것도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요,\u003c/span>\u003cspan class=\"en\">Hi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Jim Brown이고,\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Jim \u003c/span>\u003cspan class=\"tgt\">Brown, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Happy Days’의 감독이에요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">director \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Happy \u003c/span>\u003cspan class=\"tgt\">Days\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요, 나는 ‘Happy Days’의 감독 Jim Brown이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 영화 \u003cb class=\"key\">Happy \u003c/b>\u003cb class=\"key\">Days\u003c/b>의 \u003cb class=\"key\">감독\u003c/b> Jim Brown이 자기소개를 하는 부분이에요. 뒤에 나오는 Anna, Peter, Jennifer도 모두 자신의 직업을 소개하죠. 그래서 이 문장은 앞으로 이어질 직업 소개들의 시작을 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마로 이어지는 동격)\u003c/span> : [고유명사] + , + [the + 직위·신분 명사] : \"Jim Brown, 즉 ‘Happy Days’의 감독\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Hi, 안녕하세요. I'm Jim Brown, 나는 Jim Brown이고. the director of Happy Days, ‘Happy Days’의 감독이에요.. 이 문장 전체를 해석하면, 안녕하세요, 나는 ‘Happy Days’의 감독 Jim Brown이에요.","hl":"m"},{"n":14,"text":"이 문장은 영화 Happy Days의 감독 Jim Brown이 자기소개를 하는 부분이에요. 뒤에 나오는 Anna나 Peter, Jennifer도 모두 자기 직업을 소개하죠. 그래서 이 첫 문장은 앞으로 이어질 직업 소개들의 시작을 여는 역할을 해요.","hl":"mn"},{"n":15,"text":"여기서 꼭 봐야 할 건 동격이에요. Jim Brown과 the director of Happy Days가 콤마로 나란히 놓여 있죠. 이건 앞의 사람과 뒤의 신분이 같은 사람이라는 뜻이에요. 그래서 Jim Brown, 즉 Happy Days의 감독, 이렇게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 영화예요\u003c/span>\u003cspan class=\"en\">It's \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">movie \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우정에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">friendship\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tom과 그의 개 Max 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">Tom \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">dog \u003c/span>\u003cspan class=\"tgt\">Max\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 Tom과 그의 개 Max의 우정에 관한 영화예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 영화가 어떤 내용인지 알려 주는 문장이에요. 주인공 Tom과 그의 개 Max 사이의 \u003cb class=\"key\">우정\u003c/b> 이야기라는 거죠. 뒤에 나올 촬영 장면들도 모두 이 둘의 우정을 담아내기 위한 것이라서, 영화의 \u003cb class=\"key\">주제\u003c/b>를 잡아 주는 중요한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사] + [전치사 + 명사구] : \"우정에 관한 영화\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">between A and B\u003c/span> : between [A] and [B] : \"Tom과 그의 개 Max 사이의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격\u003c/span> : [일반명사] + [고유명사] : \"그의 개인 Max\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It's a movie, 이것은 영화예요. about the friendship, 우정에 관한. between Tom and his dog Max, Tom과 그의 개 Max 사이의. 이 문장 전체를 해석하면, 이것은 Tom과 그의 개 Max의 우정에 관한 영화예요.","hl":"m"},{"n":17,"text":"이 문장은 이 영화가 어떤 내용인지 알려 주는 문장이에요. 주인공 Tom과 그의 개 Max 사이의 우정 이야기라는 거죠. 뒤에 나올 촬영 장면들도 모두 이 둘의 우정을 담아내기 위한 것이라서, 영화의 주제를 잡아 주는 중요한 문장이에요.","hl":"mn"},{"n":18,"text":"첫 번째로 볼 것은 about이에요. about은 ~에 관한, 이라는 뜻으로 앞의 a movie를 뒤에서 꾸며 줘요. 두 번째는 between A and B인데요, Tom과 Max, 딱 둘 사이의 관계를 나타내죠. 세 번째는 동격이에요. his dog와 Max가 나란히 붙어 있는데, 그의 개가 바로 Max라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열심히 일하고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 영화를 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">movie\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 영화 한 편을 만드는 데 정말 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 힘을 모으고 있다는 걸 전해 줘요. 감독, 촬영감독, 동물 조련사처럼 뒤에서 소개될 사람들이 바로 그 사람들이죠. 그래서 다음 문장에서 그중 몇 명을 만나 보자고 자연스럽게 이어지는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수의 일치(a lot of + 복수명사)\u003c/span> : A lot of + [복수명사] + [복수동사] : \"많은 사람들이 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형(be + -ing)\u003c/span> : [주어] + are + [동사-ing] : \"열심히 일하고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절] + to + [동사원형] : \"이 영화를 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"A lot of people, 많은 사람들이. are working hard, 열심히 일하고 있어요. to create this movie, 이 영화를 만들기 위해. 이 문장 전체를 해석하면, 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있어요.","hl":"m"},{"n":20,"text":"이 문장은 이 영화 한 편을 만드는 데 정말 많은 사람이 힘을 모으고 있다는 걸 전해 줘요. 감독, 촬영감독, 동물 조련사처럼 뒤에서 소개될 사람들이 바로 그 사람들이죠. 그래서 다음 문장에서 그중 몇 명을 만나 보자고 자연스럽게 이어지는 거예요.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 현재진행형이에요. are 뒤에 working이 오면 지금 하고 있는 일을 나타내요. 두 번째는 to부정사의 목적 용법이에요. to create는 이 영화를 만들기 위해, 라는 목적을 말해 주죠. 세 번째는 수의 일치인데요, A lot of people 뒤에는 사람이 여러 명이라서 are를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 ~하고 싶나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만나기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 중 몇 명을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들 중 몇 명을 만나 보고 싶나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 영화를 만드는 사람들을 소개하기 전에 관객에게 던지는 \u003cb class=\"key\">질문\u003c/b>이에요. '~하고 싶다'는 바람을 묻는 \u003cb class=\"key\">의문문\u003c/b> 형태로, 다음에 이어질 등장인물 소개의 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">want + to부정사(목적어)\u003c/span> : want [타동사] + [to meet (to부정사구/목적어)] : \"만나기를 원하나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">some of + 복수대명사(부분 표현)\u003c/span> : some of [복수대명사(them)] : \"그들 중 몇 명\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Do you want, 너는 ~하고 싶나요. to meet, 만나기를. some of them?, 그들 중 몇 명을. 이 문장 전체를 해석하면, 그들 중 몇 명을 만나 보고 싶나요?","hl":"m"},{"n":23,"text":"이 문장은 영화를 만드는 사람들을 소개하기 전에 관객에게 던지는 질문이에요. 하고 싶다는 바람을 묻는 의문문 형태죠. 그래서 다음에 이어질 등장인물 소개의 도입 역할을 하는 문장이에요.","hl":"mn"},{"n":24,"text":"먼저 첫 번째 어법 포인트예요. want는 뒤에 to부정사를 목적어로 데려오는 동사라서 to meet이 그대로 와요. 그래서 '만나기를 원하나요'라는 의문문이 되는 거죠. 두 번째로 some of them을 보세요. some of 뒤에 복수대명사 them이 붙어서 그들 중 일부, 그러니까 몇 명이라는 뜻을 만들어요. 이 두 가지만 잡으면 문장이 아주 쉬워져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Anna이고\u003c/span>\u003cspan class=\"en\">I'm Anna,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 찾았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 아름다운 해변을\u003c/span>\u003cspan class=\"en\">this beautiful beach.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 Anna이고, 내가 이 아름다운 해변을 찾아냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Anna가 자신을 소개하면서 자기가 찾아낸 아름다운 \u003cb class=\"key\">해변\u003c/b>을 자랑하는 문장이에요. 앞에서 감독이 던진 질문에 바로 답하듯 이어지는 \u003cb class=\"key\">자기소개\u003c/b>죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and\u003c/span> : [문장] + and + [문장] : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">find의 과거형(불규칙 동사)\u003c/span> : find - found - found : \"찾아냈어요\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I'm Anna, 나는 Anna이고. and I found, 그리고 나는 찾았어요. this beautiful beach, 이 아름다운 해변을. 이 문장 전체를 해석하면, 나는 Anna이고, 내가 이 아름다운 해변을 찾아냈어요.","hl":"m"},{"n":26,"text":"Anna가 자기소개를 하면서 자기가 찾아낸 아름다운 해변을 자랑하는 문장이에요. 앞에서 감독이 사람들을 만나 보라고 물었죠. 그 질문에 바로 답하듯 이어지는 자기소개라고 보면 돼요.","hl":"mn"},{"n":27,"text":"첫 번째로 and를 보세요. 여기서 and는 두 문장을 대등하게 이어 주는 등위접속사예요. 그래서 자기소개와 그 뒤에 한 행동이 자연스럽게 연결되죠. 두 번째로 found는 find의 과거형이에요. find는 불규칙 동사라서 과거형이 found로 바뀌어요. 그래서 이 문장은 현재인 I'm Anna와 과거인 I found가 and로 나란히 연결된 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 야외 촬영 관리자이고\u003c/span>\u003cspan class=\"en\">I'm a location manager,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 내 일은 ~예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽한 장소를 찾는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">perfect \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촬영을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">shooting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 야외 촬영 관리자이고, 내 일은 촬영을 위한 완벽한 장소를 찾는 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Anna가 자신의 \u003cb class=\"key\">직업\u003c/b>을 구체적으로 설명하는 문장이에요. to부정사로 '내 일이 무엇인지'를 풀어 주고, 그 장소가 \u003cb class=\"key\">촬영\u003c/b>을 위한 곳이라는 점까지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and\u003c/span> : [문장] + and + [문장] : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격보어)\u003c/span> : [주어] + be동사 + [to부정사(주격보어)] : \"내 일은 완벽한 장소를 찾는 것이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사\u003c/span> : for [목적] + [동명사(shooting)] : \"촬영을 위한\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I'm a location manager, 나는 야외 촬영 관리자이고. and my job is, 그리고 내 일은 ~예요. to find perfect places, 완벽한 장소를 찾는 것. for shooting, 촬영을 위한. 이 문장 전체를 해석하면, 나는 야외 촬영 관리자이고, 내 일은 촬영을 위한 완벽한 장소를 찾는 거예요.","hl":"m"},{"n":29,"text":"Anna가 자신의 직업을 구체적으로 설명하는 문장이에요. to부정사를 써서 내 일이 무엇인지 풀어 주고, 그 장소가 촬영을 위한 곳이라는 점까지 알려 줘요. 앞 문장에서 찾아낸 해변이 바로 이 일의 결과라는 흐름도 함께 봐 주세요.","hl":"mn"},{"n":30,"text":"먼저 and는 두 문장을 대등하게 이어 주는 등위접속사예요. 직업 소개와 그 일의 내용을 자연스럽게 연결해 주죠. 그리고 my job is 뒤에 온 to find를 눈여겨보세요. be동사 뒤에서 주어 my job의 내용을 설명하는 주격보어로 쓰인 to부정사예요. 그래서 '내 일은 완벽한 장소를 찾는 것이에요'라고 해석하는 명사적 용법이죠. 마지막으로 for shooting에서 for 뒤에는 동명사가 와서 촬영을 위한, 즉 목적을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론,\u003c/span>\u003cspan class=\"en\">Of course,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 일은 쉽지 않지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> is not easy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 나는 내 일을 정말 좋아해요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> I love my job.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론, 이 일은 쉽지 않지만, 나는 내 일을 정말 좋아해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 \u003cb class=\"key\">it\u003c/b>은 완벽한 장소를 찾는 '그 일'을 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>예요. 쉽지 않다는 어려움과 그래도 좋아한다는 애정을 \u003cb class=\"key\">but\u003c/b>으로 묶어, 안나가 자기 일에 자부심을 느낀다는 것을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : it = 앞 문장의 내용([[장소를 찾는 일]])을 받는 [[대명사]] : \"그 일은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [문장 A] + but + [문장 B] : 앞뒤를 [[대조]]로 연결 : \"그러나\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Of course, 물론. it is not easy, 그 일은 쉽지 않지만. but I love my job, 그러나 나는 내 일을 정말 좋아해요.. 이 문장 전체를 해석하면, 물론, 이 일은 쉽지 않지만, 나는 내 일을 정말 좋아해요.","hl":"m"},{"n":32,"text":"여기서 it은 완벽한 장소를 찾는 그 일을 가리키는 지시대명사예요. 쉽지 않다는 어려움과 그래도 좋아한다는 애정을 대조로 묶어서, 안나가 자기 일에 자부심을 느낀다는 걸 보여 주는 문장이에요.","hl":"mn"},{"n":33,"text":"첫 번째, it은 앞에서 말한 장소를 찾는 일을 그대로 받는 지시대명사예요. 날씨나 시간을 나타내는 비인칭 it이 아니라는 점을 꼭 구분해 두세요. 두 번째, but은 쉽지 않다는 내용과 좋아한다는 내용을 대조로 이어 주는 등위접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 여행하는 것을 좋아해요\u003c/span>\u003cspan class=\"en\">I like \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">travel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 도전을 즐겨요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> enjoy challenges.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 여행하는 것을 좋아하고 도전을 즐겨요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 안나가 자기 일을 좋아하는 이유를 덧붙이는 문장이에요. 여행을 좋아하고 \u003cb class=\"key\">도전\u003c/b>을 즐기는 성향이, 완벽한 장소를 찾아다니는 \u003cb class=\"key\">로케이션 \u003c/b>\u003cb class=\"key\">매니저\u003c/b>라는 직업과 잘 맞는다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : like [타동사] + [to travel (to부정사구/목적어)] : \"여행하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and(병렬)\u003c/span> : I [like] ... and [(I) enjoy] ... : [[주어]] I를 공유하는 [[병렬]] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I like to travel, 나는 여행하는 것을 좋아해요. and enjoy challenges, 그리고 도전을 즐겨요.. 이 문장 전체를 해석하면, 나는 여행하는 것을 좋아하고 도전을 즐겨요.","hl":"m"},{"n":35,"text":"이 문장은 안나가 자기 일을 좋아하는 이유를 덧붙이는 문장이에요. 여행을 좋아하고 도전을 즐기는 성향이, 완벽한 장소를 찾아다니는 로케이션 매니저라는 직업과 잘 맞는다는 걸 보여 줘요.","hl":"mn"},{"n":36,"text":"첫 번째, like 뒤에 온 to travel은 여행하는 것이라는 목적어 역할을 하는 to부정사의 명사적 용법이에요. 그래서 to부정사구 전체가 like의 목적어로 들어간 거죠. 두 번째, and는 주어 I를 함께 쓰면서 like와 enjoy라는 두 동사를 병렬로 이어 줘요. 그래서 여행하는 것을 좋아하고 도전을 즐긴다는 두 가지 뜻이 자연스럽게 연결돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Peter예요,\u003c/span>\u003cspan class=\"en\">I'm Peter,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촬영감독인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">director \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">photography\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 영화의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">movie\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 이 영화의 촬영감독인 Peter예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 인물 피터가 자신을 소개하며 맡은 직업을 밝히는 문장이에요. 이름 뒤에 \u003cb class=\"key\">콤마\u003c/b>로 직업을 이어 붙여, 피터가 이 영화에서 어떤 일을 하는 사람인지 바로 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [고유명사 Peter] , [the director of photography] : 앞 명사 = 뒤 명사 : \"촬영감독인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [the director of photography] + [for this movie] : 앞 [[명사]]를 꾸미는 [[전치사구]] : \"이 영화의\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"I'm Peter, 나는 Peter예요. the director of photography, 촬영감독인. for this movie, 이 영화의.. 이 문장 전체를 해석하면, 나는 이 영화의 촬영감독인 Peter예요.","hl":"m"},{"n":38,"text":"이 문장은 새 인물 피터가 자신을 소개하면서 맡은 직업을 밝히는 문장이에요. 이름 뒤에 콤마로 직업을 이어 붙여서, 피터가 이 영화에서 어떤 일을 하는 사람인지 바로 알려 줘요.","hl":"mn"},{"n":39,"text":"첫 번째, 콤마 뒤의 the director of photography는 앞의 Peter와 같은 사람이라는 걸 설명하는 동격이에요. 두 번째, for this movie는 전치사구로 앞의 the director of photography를 꾸며 줘서 이 영화의 촬영감독이라는 뜻을 완성해요. 이름, 직업, 그리고 이 영화의라는 정보가 차례대로 이어지는 구조를 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~을 담당하고 있어요\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">charge \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 카메라를\u003c/span>\u003cspan class=\"en\">all the cameras.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 모든 카메라를 담당하고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 자신의 역할을 소개하는 문장이에요. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">charge \u003c/b>\u003cb class=\"key\">of\u003c/b>는 '~을 담당하다'라는 뜻의 관용 표현이고, 카메라 감독인 그가 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">카메라\u003c/b>를 책임진다는 것을 보여 줘요. 앞에서 직업을 하나씩 소개하는 흐름 속에서 '카메라 감독'이라는 정체성을 분명히 밝히는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현 be in charge of(~을 담당하다)\u003c/span> : [주어] + be동사 + [[in charge of]] + [담당하는 대상(명사)] : \"~을 담당하고 있어요\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"I'm in charge of, 나는 ~을 담당하고 있어요. all the cameras, 모든 카메라를. 이 문장 전체를 해석하면, 나는 모든 카메라를 담당하고 있어요.","hl":"m"},{"n":41,"text":"Peter가 자기 역할을 소개하는 문장이에요. 영화에서는 카메라를 누가 잡느냐가 아주 중요하죠. 그래서 자기가 모든 카메라를 책임진다고 말하면서 카메라 감독이라는 직업을 분명하게 보여 주고 있어요.","hl":"mn"},{"n":42,"text":"여기서 첫 번째 포인트는 be in charge of 예요. 이건 담당하다, 책임지다라는 뜻의 관용 표현이에요. be동사 뒤에 in charge of가 통째로 붙어서 책임을 맡고 있는 상태를 나타내죠. 그리고 of 뒤에는 담당하는 대상이 와서 all the cameras, 즉 모든 카메라가 그 자리에 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘,\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tom과 Max는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Tom \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Max\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 놀 예정이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">play\u003c/span> together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공을 가지고\u003c/span>\u003cspan class=\"en\">with a ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해변에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beach\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘, Tom과 Max는 해변에서 공을 가지고 함께 놀 예정이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘 촬영할 장면을 소개하는 문장이에요. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">going \u003c/b>\u003cb class=\"key\">to\u003c/b>는 이미 정해진 \u003cb class=\"key\">계획된 \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 나타내죠. 앞에서 Anna가 찾은 해변이라는 장소가 여기서 다시 나오면서 Tom과 Max의 공놀이 장면이 영화의 핵심 장면임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어의 수 일치(복수 주어)\u003c/span> : [A and B] + [복수동사 are] : \"Tom과 Max는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be going to + 동사원형(계획된 미래)\u003c/span> : [주어] + be going to + [동사원형] : \"놀 예정이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : [동사] + [전치사 on + 장소 명사] : \"해변에서\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Today, 오늘. Tom and Max, Tom과 Max는. are going to play together, 함께 놀 예정이에요. with a ball, 공을 가지고. on the beach, 해변에서. 이 문장 전체를 해석하면, 오늘, Tom과 Max는 해변에서 공을 가지고 함께 놀 예정이에요.","hl":"m"},{"n":44,"text":"오늘 찍을 장면을 소개하는 문장이에요. 영화 속 주인공인 Tom과 Max가 해변에서 공놀이를 하는 장면이죠. 앞에서 Anna가 찾은 해변이라는 장소가 여기서 다시 등장해서 이야기가 자연스럽게 이어져요.","hl":"mn"},{"n":45,"text":"먼저 are going to play를 보세요. be going to 다음에는 동사원형이 와서 할 예정이다라는 계획된 미래를 나타내요. 그리고 주어가 Tom and Max, 두 명이라서 be동사가 am이나 is가 아니라 are인 것도 꼭 챙겨야 하는 포인트예요. 마지막으로 on the beach는 장소를 나타내는 전치사구로 해변에서라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12
