e도 아까 배운 be going to, 즉 계획된 미래 표현이에요. 그래서 사용할 거예요라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제니퍼예요\u003c/span>\u003cspan class=\"en\">Jennifer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 Jennifer예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제니퍼가 처음 등장하며 자신의 이름을 밝히는 \u003cb class=\"key\">자기소개\u003c/b> 문장이에요. 앞에서 Anna와 Peter가 차례로 자기소개를 했듯, 여기서도 새로운 \u003cb class=\"key\">화자\u003c/b>가 등장해 다음 문장에서 자신이 한 일을 설명하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 축약형(I am → I'm)\u003c/span> : I + am → I'm : \"나는 ~예요\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"I'm, 나는 ~예요. Jennifer, 제니퍼예요. 이 문장 전체를 해석하면, 나는 Jennifer예요.","hl":"m"},{"n":50,"text":"이 문장은 제니퍼가 자신을 소개하는 자기소개 문장이에요. 앞에서 안나와 피터가 자기소개를 했죠? 이제 제니퍼 차례인 거예요. 그래서 새로운 화자, 그러니까 말하는 사람이 등장한다는 신호로 보면 돼요.","hl":"mn"},{"n":51,"text":"여기서 눈여겨볼 건 be동사의 축약이에요. I am이 줄어서 I'm이 되죠. 회화에서는 이렇게 축약해서 말하는 게 아주 자연스러워요. 그리고 이름 앞에는 관사 없이 그냥 Jennifer, 이렇게 바로 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 훈련했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">trained \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Max를 돌봤어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> Max\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 Max를 오랫동안 훈련하고 돌봤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제니퍼가 맥스와 함께 쌓아 온 오랜 \u003cb class=\"key\">경험\u003c/b>을 말하는 문장이에요. 훈련하고 돌봤다는 표현에서 그녀가 맥스와 아주 가깝고 동물을 다루는 전문가라는 점이 드러나며, 이어지는 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">조련사\u003c/b> 공개로 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬(and로 연결된 과거동사)\u003c/span> : [과거동사 trained] + and + [과거동사 took care of] : \"훈련했고 돌봤어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간\u003c/span> : for + [기간을 나타내는 말] : \"오랫동안\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"I trained, 나는 훈련했어요. and took care of Max, 그리고 Max를 돌봤어요. for a long time, 오랫동안. 이 문장 전체를 해석하면, 나는 Max를 오랫동안 훈련하고 돌봤어요.","hl":"m"},{"n":53,"text":"이 문장은 제니퍼가 맥스와 쌓아 온 오랜 경험을 보여 줘요. 훈련하고 돌봤다는 말에서 그녀가 맥스와 아주 가까운 사이라는 걸 알 수 있죠. 그리고 바로 다음 문장에서 그녀가 동물 조련사라는 정체가 공개돼요.","hl":"mn"},{"n":54,"text":"첫 번째 포인트는 동사의 병렬이에요. trained와 took, 두 개의 과거동사를 and로 나란히 연결했죠. 이럴 때는 두 동사의 시제를 꼭 똑같이 맞춰 줘야 해요. 두 번째 포인트는 전치사 for예요. for 뒤에 기간을 나타내는 말이 오면 얼마 동안이라는 뜻이 되는데, 여기서는 for a long time, 즉 오랫동안이라는 뜻이에요. 참고로 took care of는 take care of의 과거형이고, 돌보다라는 뜻의 덩어리 표현으로 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Max는 훌륭한 배우예요,\u003c/span>\u003cspan class=\"en\">Max \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">actor\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그는 가끔 너무 흥분해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> he sometimes \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">gets \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">excited\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주변에 사람들이 많을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">around\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Max는 훌륭한 배우이지만, 주변에 사람들이 많을 때 가끔 너무 흥분해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 맥스의 \u003cb class=\"key\">장점\u003c/b>과 \u003cb class=\"key\">단점\u003c/b>을 한 문장 안에 함께 담아, 배우로서 훌륭하지만 사람이 많으면 흥분한다는 점을 알려 줘요. 그래서 바로 다음 문장에서 제니퍼가 손짓으로 맥스를 진정시킨다고 말하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : Max [주어] + is [be동사] + a great actor [주격보어] : \"Max는 훌륭한 배우예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [문장] + but + [문장] : \"그런데, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">get + 형용사 / too + 형용사\u003c/span> : get [상태 변화] + too + [형용사] : \"너무 흥분해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 부사절\u003c/span> : [주절] + when + [주어 + 동사 ~] : \"주변에 사람들이 많을 때\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"Max is a great actor, Max는 훌륭한 배우예요. but he sometimes gets too excited, 그런데 그는 가끔 너무 흥분해요. when a lot of people are around, 주변에 사람들이 많을 때. 이 문장 전체를 해석하면, Max는 훌륭한 배우이지만, 주변에 사람들이 많을 때 가끔 너무 흥분해요.","hl":"m"},{"n":56,"text":"이 문장은 맥스의 장점과 단점을 함께 보여 줘요. 훌륭한 배우라는 칭찬 뒤에, 사람이 많으면 너무 흥분한다는 단점을 붙였죠. 그래서 바로 다음 문장에서 제니퍼가 손짓으로 맥스를 진정시킨다고 말하는 거예요.","hl":"mn"},{"n":57,"text":"첫 번째 포인트는 이 문장의 형식이에요. be동사 is 뒤에 명사구가 와서 주어의 정체를 설명해 주는 주격보어 자리죠. 두 번째는 but이에요. 앞의 칭찬과 뒤의 문제점을 대조로 이어 주는 등위접속사예요. 세 번째는 get이에요. get 뒤에 형용사가 오면 그 상태로 변한다는 뜻이 되고, too가 붙으면 너무 흥분해요처럼 지나친 정도를 나타내요. 그리고 sometimes 같은 빈도부사는 일반동사 앞에 놓인다는 것도 같이 기억해 두세요. 네 번째는 when이에요. when은 주변에 사람들이 많을 때처럼 시간이나 상황을 알려 주는 부사절을 이끌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 수신호를 사용해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003cspan class=\"tgt\">signals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 진정시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">calm \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 나는 그를 진정시키기 위해 수신호를 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 Max가 사람이 많으면 너무 흥분한다고 말했죠. 이 문장은 그 문제를 해결하는 방법을 제시하는 문장으로, \u003cb class=\"key\">수신호\u003c/b>를 이용해 그를 \u003cb class=\"key\">진정\u003c/b>시킨다는 내용이에요. '~하기 위해'라는 목적의 뜻이 \u003cb class=\"key\">to부정사\u003c/b>로 표현되어 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합명사의 복수형\u003c/span> : [명사 hand + 명사 signal] + -s(복수) : \"나는 수신호를 사용해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use [목적어] + to + [동사원형] (to부정사구/부사적 용법) : \"그를 진정시키기 위해\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"So, 그래서. I use hand signals, 나는 수신호를 사용해요. to calm him, 그를 진정시키기 위해. 이 문장 전체를 해석하면, 그래서, 나는 그를 진정시키기 위해 수신호를 사용해요.","hl":"m"},{"n":59,"text":"이 문장은 앞에서 Max가 사람이 많으면 너무 흥분한다고 했죠. 그래서 그 문제를 해결하는 방법을 말해 주는 문장이에요. 바로 수신호를 써서 그를 진정시킨다는 거예요.","hl":"mn"},{"n":60,"text":"먼저 to calm him을 보세요. 수신호를 사용하는 목적이 그를 진정시키는 것이죠. 그래서 to부정사가 목적을 나타내는 부사적 용법으로 쓰였어요. 두 번째로 hand signals는 hand와 signal이 합쳐진 복합명사예요. 신호를 여러 개 쓰니까 복수형 signals가 된 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Who \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">I\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 누구일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 자신이 하는 일을 설명한 뒤, 자기 직업이 무엇인지 \u003cb class=\"key\">퀴즈\u003c/b>처럼 물어보는 문장이에요. 독자의 \u003cb class=\"key\">호기심\u003c/b>을 끌어 다음 문장에서 \u003cb class=\"key\">정답\u003c/b>을 제시하는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문(주어와 be동사의 도치)\u003c/span> : 의문사 Who + be동사 am + 주어 I : \"나는 누구일까요?\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"Who, 누구. am I?, 나는 ~일까요?. 이 문장 전체를 해석하면, 나는 누구일까요?","hl":"m"},{"n":62,"text":"이 문장은 앞에서 자기 일을 쭉 설명한 다음에 던지는 퀴즈 같은 질문이에요. 나는 누구일까요 하고 물으면서 여러분의 호기심을 확 끌어올리는 거죠. 그리고 바로 다음 문장에서 정답을 알려 줘요.","hl":"mn"},{"n":63,"text":"여기서 눈여겨볼 건 be동사와 주어의 자리가 바뀐 거예요. 원래는 I am인데, 의문문이 되면서 am이 앞으로 나가서 Who am I가 됐어요. 이렇게 주어와 동사의 순서가 바뀌는 걸 도치라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~예요\u003c/span>\u003cspan class=\"en\">I'm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물 조련사\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">wrangler\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 동물 조련사예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞 문장의 질문에 대한 \u003cb class=\"key\">정답\u003c/b>을 밝히는 문장이에요. \u003cb class=\"key\">animal \u003c/b>\u003cb class=\"key\">wrangler\u003c/b>는 영화 현장에서 동물 배우를 훈련하고 돌보는 \u003cb class=\"key\">직업\u003c/b>을 가리키는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 보어와 부정관사 a/an\u003c/span> : 주어 + be동사 + [a/an + 명사(주격보어)] : \"동물 조련사\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"I'm, 나는 ~예요. an animal wrangler, 동물 조련사. 이 문장 전체를 해석하면, 나는 동물 조련사예요.","hl":"m"},{"n":65,"text":"이 문장은 바로 앞의 질문에 대한 정답을 밝히는 문장이에요. animal wrangler는 영화 현장에서 동물 배우를 훈련하고 돌보는 직업을 말해요.","hl":"mn"},{"n":66,"text":"an animal wrangler는 be동사 뒤에서 주어 I를 설명해 주는 주격보어 자리예요. 그리고 animal이 모음 소리로 시작하니까 부정관사는 a가 아니라 an을 쓴다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 이름은 Emma이고,\u003c/span>\u003cspan class=\"en\">My name is Emma,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 영화 편집자예요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">film \u003c/span>\u003cspan class=\"tgt\">editor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 이름은 Emma이고, 나는 영화 편집자예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Emma가 처음 등장하면서 자신을 소개하는 문장이에요. 앞에서 Peter와 Jennifer가 차례로 자기 일을 밝혔던 \u003cb class=\"key\">자기소개\u003c/b> 흐름이 그대로 이어지고, Emma는 \u003cb class=\"key\">영화 \u003c/b>\u003cb class=\"key\">편집자\u003c/b>라는 직업을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and (문장과 문장의 연결)\u003c/span> : [문장 A] + and + [문장 B] : \"그리고 나는 영화 편집자예요\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"My name is Emma, 내 이름은 Emma이고. and I'm a film editor, 나는 영화 편집자예요.. 이 문장 전체를 해석하면, 내 이름은 Emma이고, 나는 영화 편집자예요.","hl":"m"},{"n":68,"text":"여기서 Emma가 처음 등장하면서 자기소개를 하죠. 앞에서 Peter와 Jennifer가 자기 일을 소개했던 흐름이 그대로 이어지는 거예요. film editor는 우리말로 영화 편집자, 그러니까 찍은 장면들을 다듬어서 하나의 영화로 만드는 사람이에요.","hl":"mn"},{"n":69,"text":"여기서 and는 앞 문장과 뒤 문장을 똑같은 무게로 이어 주는 등위접속사예요. 그래서 뒤에서도 주어 I와 be동사 am이 그대로 짝을 이뤄서 I'm a film editor라고 말하죠. 앞 문장 My name is Emma와 뒤 문장 I'm a film editor가 and로 나란히 놓인 구조라고 이해하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 일은 시작돼요\u003c/span>\u003cspan class=\"en\">My work begins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촬영이 끝나고 나서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">shooting \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 일은 촬영이 끝나고 나서 시작돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Emma가 자기 일이 언제 시작되는지를 밝히는 문장이에요. \u003cb class=\"key\">촬영\u003c/b>이 다 끝난 다음에야 \u003cb class=\"key\">편집\u003c/b> 작업이 시작된다는 순서를 알려 주죠. 그래서 다음 문장에서 편집이 어떤 일인지 설명해 주는 발판이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 after\u003c/span> : after + 주어 + 동사 (~한 후에) : \"촬영이 끝나고 나서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(주격보어)\u003c/span> : be동사 + 형용사(보어) : \"끝나 있다, 끝나다\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"My work begins, 내 일은 시작돼요. after the shooting is over, 촬영이 끝나고 나서.. 이 문장 전체를 해석하면, 내 일은 촬영이 끝나고 나서 시작돼요.","hl":"m"},{"n":71,"text":"Emma가 자기 일이 언제 시작되는지를 말해 주는 문장이에요. 촬영이 다 끝난 다음에야 편집 작업이 시작된다는 순서를 알려 주는 거죠. 그래서 이 문장이 다음 문장에서 편집이 어떤 일인지 설명해 주는 발판이 돼요.","hl":"mn"},{"n":72,"text":"먼저 after는 '촬영이 끝난 후에'라는 시점을 알려 주는 시간의 부사절 접속사예요. 그리고 is over에서 over는 '위에'라는 전치사가 아니라 '끝난'이라는 형용사로 쓰여서 보어 자리에 온 거예요. 부사절 안에서는 미래 일이라도 현재시제로 써 준다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 좋은 이야기를 만들기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">story\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 장면의 순서를 바꿀 수 있어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">scenes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 그중 일부를 삭제할 수도 있어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">delete \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 좋은 이야기를 만들기 위해서, 나는 장면의 순서를 바꾸거나 장면 중 일부를 삭제할 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Emma가 \u003cb class=\"key\">편집자\u003c/b>로서 실제로 무엇을 하는지 구체적으로 보여 주는 문장이에요. 이야기를 더 좋게 만들기 위해 \u003cb class=\"key\">장면\u003c/b>의 순서를 바꾸거나 일부를 지울 수 있다고 말하죠. 이 단락의 핵심, 즉 편집자의 일을 가장 잘 압축해서 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + 동사원형 + , + 주절 (~하기 위해) : \"더 좋은 이야기를 만들기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형, or로 연결된 병렬 구조\u003c/span> : can + [동사원형 A] + or + [동사원형 B] : \"장면의 순서를 바꾸거나 일부를 삭제할 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대명사 them (앞의 복수명사 지칭)\u003c/span> : some of + 대명사(앞 명사 반복 피하기) : \"그 장면들 중 일부를\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"To create a better story, 더 좋은 이야기를 만들기 위해서. I can change the order of scenes, 나는 장면의 순서를 바꿀 수 있어요. or delete some of them, 또는 그중 일부를 삭제할 수도 있어요.. 이 문장 전체를 해석하면, 더 좋은 이야기를 만들기 위해서, 나는 장면의 순서를 바꾸거나 장면 중 일부를 삭제할 수도 있어요.","hl":"m"},{"n":74,"text":"Emma가 편집자로서 실제로 무엇을 하는지 구체적으로 보여 주는 문장이에요. 이야기를 더 좋게 만들기 위해 장면의 순서를 바꾸거나 일부를 지울 수 있다고 말하죠. 이 문장이 이 단락의 핵심, 즉 편집자의 일을 가장 잘 압축해서 보여 줘요.","hl":"mn"},{"n":75,"text":"먼저 문장 맨 앞에 온 To create a better story는 to부정사의 부사적 용법으로 목적을 나타내요. '더 좋은 이야기를 만들기 위해서'라고 해석하는 이유가 바로 여기에 있죠. 그리고 can 뒤에는 동사원형이 오는데, change와 delete가 or로 나란히 연결된 병렬 구조라는 점도 꼭 챙겨 두세요. 마지막으로 some of them에서 them은 앞에 나온 scenes를 다시 쓰지 않고 받아 주는 대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스토리텔링 기술은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Storytelling \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 직업에 중요해요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 나는 책을 많이 읽어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">read \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 직업상 스토리텔링 기술이 중요해서 나는 책을 많이 읽어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영화 편집자 Emma가 자기 직업에 필요한 능력을 밝히는 문장이에요. \u003cb class=\"key\">스토리텔링\u003c/b> 능력이 일에 중요하다는 말과, 그래서 평소 \u003cb class=\"key\">독서\u003c/b>를 많이 한다는 습관이 한 문장에 담겨 있죠. 여기서 read a lot은 단순한 취미가 아니라 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">구성 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 기르기 위한 노력이라는 점을 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합명사(명사+명사)와 주어-동사 수 일치\u003c/span> : [명사 storytelling] + [명사 skills] → 주어 전체가 복수 취급 : \"스토리텔링 기술은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (대상·기준)\u003c/span> : be [형용사 important] + for + [명사(기준이 되는 대상)] : \"내 직업에 중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 so (결과)\u003c/span> : [원인 절] + so + [결과 절(주어+동사)] : \"그래서 나는 많이 읽는다\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"Storytelling skills, 스토리텔링 기술은. are important for my job, 내 직업에 중요해요. so I read a lot, 그래서 나는 책을 많이 읽어요.. 이 문장 전체를 해석하면, 내 직업상 스토리텔링 기술이 중요해서 나는 책을 많이 읽어요.","hl":"m"},{"n":77,"text":"이 문장은 영화 편집자 Emma가 자기 일에 필요한 능력을 말하는 부분이에요. 스토리텔링 능력이 자기 직업에 중요하고, 그래서 평소에 독서를 많이 한다는 습관까지 함께 보여 주죠. 여기서 read a lot은 그냥 취미가 아니라, 이야기 구성 능력을 기르기 위한 노력이라는 점을 꼭 기억해 주세요.","hl":"mn"},{"n":78,"text":"첫 번째로 Storytelling skills를 보세요. storytelling이라는 명사가 skills를 앞에서 꾸며 주는 복합명사 구조예요. 그래서 주어는 storytelling skills 전체이고, 핵심 명사가 복수라서 동사도 복수 형태인 are를 쓴 겁니다. 두 번째로 are important for my job에서 for는 중요함의 기준이 되는 대상을 나타내는 전치사예요. 나의 직업에 있어서 중요하다는 뜻이 되죠. 세 번째로 so I read a lot에서 so는 앞의 내용을 원인으로 받아 뒤의 결과를 이끄는 등위접속사예요. 중요하기 때문에 그래서 많이 읽는다는 결과로 자연스럽게 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Chris이고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">Chris\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 폴리 아티스트예요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Foley \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 Chris이고, 폴리 아티스트예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Chris가 자신을 소개하는 문장이에요. \u003cb class=\"key\">Foley \u003c/b>\u003cb class=\"key\">artist\u003c/b>는 영화 장면에 필요한 소리를 직접 만들어 내는 \u003cb class=\"key\">음향 \u003c/b>\u003cb class=\"key\">효과 \u003c/b>\u003cb class=\"key\">전문가\u003c/b>를 뜻하죠. 바로 다음 문장에서 그가 어떤 일을 하는지 이어지니, 직업 이름의 뜻을 정확히 잡아 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 축약형 (I am)\u003c/span> : [주어 I] + [be동사 am → I'm] + [주격 보어 Chris] : \"나는 Chris이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and (두 절 연결)\u003c/span> : [절 하나] + , + and + [절 둘] : \"그리고 나는 폴리 아티스트이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정관사 a (직업·신분 표시)\u003c/span> : [a + 단수 직업 명사] : \"한 명의 폴리 아티스트\"\u003c/div>\u003c/div>","segs":[{"n":79,"text":"I'm Chris, 나는 Chris이고. and I'm a Foley artist, 그리고 나는 폴리 아티스트예요.. 이 문장 전체를 해석하면, 나는 Chris이고, 폴리 아티스트예요.","hl":"m"},{"n":80,"text":"Chris가 자신을 소개하는 문장이에요. Foley artist는 영화 장면에 필요한 소리를 직접 만들어 내는 음향 효과 전문가를 뜻하죠. 바로 다음 문장에서 그가 어떤 일을 하는지 이어지니, 직업 이름의 뜻을 정확히 잡아 두세요.","hl":"mn"},{"n":81,"text":"첫 번째로 I'm Chris에서 I'm은 I am의 축약형이에요. 회화체에서는 주어와 be동사를 이렇게 줄여서 말하는 게 자연스럽습니다. 두 번째로 and I'm a Foley artist에서 and는 콤마 뒤에서 두 번째 절을 첫 번째 절과 같은 자격으로 이어 주는 등위접속사예요. 두 절이 대등하게 연결된 구조죠. 세 번째로 a Foley artist에서 직업이나 신분을 말할 때는 부정관사 a를 붙여서 한 사람이라는 뜻을 나타낸다는 점도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 24 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 음향 효과를 만들어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">effects\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 작업실에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">studio\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야외 촬영장에서 녹음하는 게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">recording \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">location \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽지 않을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 야외 촬영장에서 녹음하는 게 쉽지 않을 때 내 작업실에서 음향 효과를 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Chris가 자기 일을 설명하는 문장이에요. \u003cb class=\"key\">야외 \u003c/b>\u003cb class=\"key\">촬영\u003c/b>에서 소리를 그대로 담기 어려울 때, 그는 \u003cb class=\"key\">작업실\u003c/b>에서 직접 \u003cb class=\"key\">음향 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 만들어 낸다는 뜻이죠. 다음 문장부터 파도 소리를 만드는 구체적인 예가 나오니, 이 문장은 전체 설명의 \u003cb class=\"key\">총론\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 (주어+동사+목적어)\u003c/span> : [주어 I] + [동사 create] + [목적어 sound effects] : \"나는 음향 효과를 만들어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : [동사 create] + [목적어 sound effects] + [in + 장소 명사] : \"내 작업실에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 명사절(주어 역할) + 동명사 주어\u003c/span> : [when + (동명사구 recording on location) + 동사 is not easy] : \"야외 촬영장에서 녹음하는 것이 쉽지 않을 때\"\u003c/div>\u003c/div>","segs":[{"n":82,"text":"I create sound effects, 나는 음향 효과를 만들어요. in my studio, 내 작업실에서. when recording on location, 야외 촬영장에서 녹음하는 게. is not easy, 쉽지 않을 때. 이 문장 전체를 해석하면, 나는 야외 촬영장에서 녹음하는 게 쉽지 않을 때 내 작업실에서 음향 효과를 만들어요.","hl":"m"},{"n":83,"text":"Chris가 자기 일을 설명하는 문장이에요. 야외 촬영에서 소리를 그대로 담기가 어려울 때, 그는 작업실에서 직접 음향 효과를 만들어 낸다는 뜻이죠. 다음 문장부터 파도 소리를 만드는 구체적인 예가 나오니까, 이 문장은 전체 설명의 총론 역할을 한다고 보면 됩니다.","hl":"mn"},{"n":84,"text":"첫 번째로 I create sound effects는 주어와 동사, 그리고 목적어가 나란히 놓인 문장이에요. create는 만들어 내다는 뜻의 타동사라서 뒤에 목적어가 꼭 필요하죠. 두 번째로 in my studio에서 in은 장소를 나타내는 전치사예요. 전치사구 in my studio가 동사 create를 꾸며서 어디에서 하는지를 알려 주는 부사구로 쓰였습니다. 세 번째로 when recording on location is not easy를 보세요. when이 이끄는 절이 문장 주어 자리에 놓여서 야외 촬영장에서 녹음하는 것이라는 상황 자체를 가리켜요. 이때 recording은 동사에 ing를 붙여 명사처럼 쓴 동명사이고, 동명사구가 주어이므로 뒤 동사는 단수인 is로 받는다는 것도 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 25 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들어 봐요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Listen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의 깊게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">carefully\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잘 들어 봐요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스가 자기 소리를 들려주기 전에 듣는 사람들의 주의를 끄는 말이에요. 짧은 \u003cb class=\"key\">명령문\u003c/b>으로 귀를 집중시킨 뒤, 바로 다음 문장에서 파도 소리에 대해 묻는 흐름으로 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + [나머지] → 주어 You 생략 : \"들어 봐요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : [동사] + [부사] → 어떻게 하는지 설명 : \"주의 깊게\"\u003c/div>\u003c/div>","segs":[{"n":85,"text":"Listen, 들어 봐요. carefully, 주의 깊게. 이 문장 전체를 해석하면, 잘 들어 봐요.","hl":"m"},{"n":86,"text":"이 문장은 크리스가 자기 소리를 들려주기 전에 여러분의 주의를 끄는 말이에요. 짧은 명령문으로 말해서 귀를 집중시키는 거죠.","hl":"mn"},{"n":87,"text":"여기서 첫 번째 어법 포인트는 명령문이에요. 명령문은 주어 You를 생략하고 동사원형 Listen으로 문장을 시작해요. 두 번째 포인트는 부사 carefully인데요, 이 부사가 동사 Listen을 꾸며서 어떻게 듣는지를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 26 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들리나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">hear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파도의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">waves\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">파도 소리가 들리나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스가 방금 만든 소리가 파도 소리처럼 들리는지 확인하며 묻는 문장이에요. 앞에서 잘 들어 보라고 한 뒤에 이 질문이 이어져서, 실제로 파도 소리인지 궁금하게 만드는 장치죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제 의문문\u003c/span> : [Do] + [주어] + [동사원형] ~? : \"들리나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(of)의 형용사적 수식\u003c/span> : [명사] + of + [명사] → 뒤에서 앞을 수식 : \"파도의 소리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복수 보통명사의 무관사 용법\u003c/span> : [복수명사] 앞에는 관사 없이 씀 : \"파도들\"\u003c/div>\u003c/div>","segs":[{"n":88,"text":"Do you hear, 들리나요. the sound, 그 소리가. of waves?, 파도의. 이 문장 전체를 해석하면, 파도 소리가 들리나요?","hl":"m"},{"n":89,"text":"크리스가 방금 만든 소리가 파도 소리처럼 들리는지 여러분에게 물어보는 문장이에요. 앞에서 잘 들어 보라고 한 다음에 이 질문이 이어지니까 흐름이 아주 자연스럽죠.","hl":"mn"},{"n":90,"text":"첫 번째 어법 포인트는 Do로 시작하는 의문문이에요. 일반동사 의문문은 Do를 문장 맨 앞에 두고 주어 you 다음에 동사원형 hear를 써서 만들어요. 두 번째는 the sound of waves인데, of waves라는 전치사구가 앞의 the sound를 뒤에서 꾸며 줘요. 세 번째로 waves는 복수 보통명사라서 관사 없이 그냥 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 27 / 28\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만들었어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쌀과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">rice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱 통으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003cspan class=\"tgt\">container\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 쌀과 플라스틱 통으로 그 소리를 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스가 파도 소리를 무엇으로 만들었는지 밝히는 문장이에요. 비싼 장비가 아니라 쌀과 플라스틱 통이라는 생활용품을 썼다는 점이 흥미롭죠. 앞 문장의 파도 소리가 여기서 \u003cb class=\"key\">that \u003c/b>\u003cb class=\"key\">sound\u003c/b>로 다시 받아져서 흐름이 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 make의 과거형(불규칙 변화)\u003c/span> : make - made - made : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 that\u003c/span> : [that] + [명사] → '그 명사' : \"그 소리를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도구·수단을 나타내는 전치사 with\u003c/span> : [make] + [목적어] + with + [도구] : \"쌀과 플라스틱 통으로\"\u003c/div>\u003c/div>","segs":[{"n":91,"text":"I made, 나는 만들었어요. that sound, 그 소리를. with rice, 쌀과. and a plastic container, 플라스틱 통으로. 이 문장 전체를 해석하면, 나는 쌀과 플라스틱 통으로 그 소리를 만들었어요.","hl":"m"},{"n":92,"text":"크리스가 파도 소리를 어떻게 만들었는지 밝히는 문장이에요. 비싼 장비가 아니라 쌀과 플라스틱 통이라는 생활용품을 썼다는 점이 참 재미있죠.","hl":"mn"},{"n":93,"text":"첫 번째 어법 포인트는 made예요. make의 과거형이고 make, made, made로 변하는 불규칙 동사죠. 두 번째는 that sound인데, that이 지시형용사로 쓰여서 그 소리라는 뜻을 만들어요. 세 번째는 with rice and a plastic container로, 도구나 수단을 나타내는 전치사 with예요. 쌀과 플라스틱 통이 and로 나란히 연결된 병렬 구조도 함께 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 28 / 28\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ...하지 않나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Doesn't \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들리다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜처럼?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">real\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진짜처럼 들리지 않나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 크리스가 만든 파도 소리를 듣고 청자에게 그 소리가 \u003cb class=\"key\">진짜\u003c/b>처럼 들리는지 확인하는 \u003cb class=\"key\">부정의문문\u003c/b>이에요. 단순한 질문이 아니라, 자신의 사운드 효과가 매우 사실적이라는 점을 강조하며 청자의 동의를 이끌어 내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문\u003c/span> : Doesn't + 주어 + 동사원형 ~? → 긍정의 확인·동의를 구하는 질문 : \"그것은 ...하지 않나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 sound + 형용사 보어\u003c/span> : sound + [형용사] → ...하게 들리다 : \"진짜처럼 들리다\"\u003c/div>\u003c/div>","segs":[{"n":94,"text":"Doesn't it, 그것은 ...하지 않나요?. sound, 들리다. real?, 진짜처럼?. 이 문장 전체를 해석하면, 진짜처럼 들리지 않나요?","hl":"m"},{"n":95,"text":"이 문장은 파도 소리를 만든 크리스가 그 소리가 진짜처럼 들리는지 청자에게 확인하는 말이에요. 부정의문문으로 물으면서 자연스럽게 동의를 구하고, 자기 사운드 효과가 아주 사실적이라는 점을 강조하죠.","hl":"mn"},{"n":96,"text":"여기서 첫 번째 포인트는 부정의문문이에요. Doesn't it으로 시작해서 청자에게 확인하고 동의를 구하는 거죠. 두 번째 포인트는 감각동사 sound 뒤에 형용사 real이 온다는 점이에요. sound 뒤에 부사가 아니라 형용사가 와서 어떤 소리로 들리는지를 설명해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이 영화는 Tom과 그의 개 Max의 \u003cb class=\"key\">우정\u003c/b>에 관한 영화이고, 많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있어요.\u003c/li>\u003cli>Anna는 촬영을 위한 완벽한 장소를 찾는 \u003cb class=\"key\">야외 \u003c/b>\u003cb class=\"key\">촬영 \u003c/b>\u003cb class=\"key\">관리자\u003c/b>이고, Peter는 모든 카메라를 담당하는 \u003cb class=\"key\">촬영감독\u003c/b>이에요.\u003c/li>\u003cli>Jennifer는 Max를 훈련하고 돌보는 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">조련사\u003c/b>로, 사람이 많을 때 흥분하는 Max를 수신호로 진정시켜요.\u003c/li>\u003cli>Emma는 촬영이 끝난 뒤 장면을 편집하는 \u003cb class=\"key\">영화 \u003c/b>\u003cb class=\"key\">편집자\u003c/b>이고, Chris는 작업실에서 음향 효과를 만드는 \u003cb class=\"key\">폴리 \u003c/b>\u003cb class=\"key\">아티스트\u003c/b>예요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A single movie is completed through the collaboration of many people who each play a different role.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 영화 'Happy Days'의 감독 Jim Brown이 여러 \u003cb class=\"key\">제작진\u003c/b>을 소개하며, 로케이션 매니저·촬영감독·동물 조련사·영화 편집자·폴리 아티스트가 각자 맡은 일을 설명한다. 이는 한 편의 영화가 서로 다른 \u003cb class=\"key\">전문가\u003c/b>들의 협업으로 완성된다는 것을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":97,"text":"오늘 글은 영화 Happy Days를 만드는 감독, 로케이션 매니저, 촬영감독, 동물 조련사, 영화 편집자, 폴리 아티스트를 차례로 소개했어요. 각자 다른 일을 하지만 모두 한 편의 영화를 완성하기 위해 함께 일한다는 점이 핵심이에요. 질문과 답변 구조, 그리고 두괄식 주제문을 꼭 기억해 두세요. 그럼 오늘 수업은 여기까지 하고, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
