  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

lecturePlayer(document.getElementById("app"),{"brand":"Watch and Talk A-1","title":"중1 동아(윤) Lesson 7 장래 희망 묻고 답하기","audioDir":"1_audio","preview":false,"count":31,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">장래 희망 묻고 답하기\u003c/div>\u003ch1>중1 동아(윤) Lesson 7 장래 희망 묻고 답하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>여학생이 민수에게 장래 희망이 무엇인지 묻고, 민수는 스포츠 기자가 되고 싶다고 답한다. 이어서 스포츠 경기를 많이 보는지 묻고, 민수는 모든 종류의 스포츠에 관심이 있다고 말한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 동아 윤정미 교과서 Lesson Seven 대화문을 함께 공부해 볼게요. 여학생이 민수에게 장래 희망을 묻고, 민수는 스포츠 기자가 되고 싶다고 대답하는 대화예요. 오늘은 장래 희망을 묻고 답하는 표현과 관심사를 말하는 표현을 배워 볼 거예요. 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">➊What do you want to be in the future, Minsu?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">➋I want to be a sports reporter.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Oh, really? Do you watch ➌ a lot of sports games?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Yes, I do. ➍ I'm interested in all kinds of sports.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"➊What do you want to be in the future, Minsu?","hl":"r-0"},{"n":3,"text":"➋I want to be a sports reporter.","hl":"r-1"},{"n":4,"text":"Oh, really? Do you watch ➌ a lot of sports games?","hl":"r-2"},{"n":5,"text":"Yes, I do. ➍ I'm interested in all kinds of sports.","hl":"r-3"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">장래 희망 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What do
