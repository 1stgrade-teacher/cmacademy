03cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Thank you. I want to make an airplane someday!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">➏Let's fly this airplane, and then we can ➐try making an airplane, too.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-9\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Good idea.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Jiho, ➊why don't we try this? We can fly an airplane!","hl":"r-0"},{"n":3,"text":"Sure. It ➋ looks like fun!","hl":"r-1"},{"n":4,"text":"Do you want to be a pilot in the future?","hl":"r-2"},{"n":5,"text":"Yes, I'm interested in flying airplanes. ➌How about you, Lucy?","hl":"r-3"},{"n":6,"text":"I'm interested in making airplanes, ➍ not flying. I want","hl":"r-4"},{"n":7,"text":"to be an airplane engineer.","hl":"r-5"},{"n":8,"text":"That ➎sounds cool!","hl":"r-6"},{"n":9,"text":"Thank you. I want to make an airplane someday!","hl":"r-7"},{"n":10,"text":"➏Let's fly this airplane, and then we can ➐try making an airplane, too.","hl":"r-8"},{"n":11,"text":"Good idea.","hl":"r-9"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">제안하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Why don't we + 동사원형 ~?\u003c/div>\u003cdiv class=\"d-mean\">우리 ~할까?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Jiho, ➊why don't we try this? We can fly an airplane!\u003c/div>\u003cdiv class=\"d-exp\">무엇을 함께 하자고 \u003cb class=\"key\">부드럽게 제안\u003c/b>할 때 써요. 「Why don't we + 동사원형 ~?」은 ‘우리 ~할까?’라는 뜻이고, 같은 뜻으로 「Let's + 동사원형 ~」을 쓸 수 있어요. 친구나 가까운 사이에서 자주 쓰는 \u003cb class=\"key\">제안\u003c/b> 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Let's + 동사원형 ~\u003c/li>\u003cli>Shall we + 동사원형 ~?\u003c/li>\u003cli>How about + 동명사 ~?\u003c/li>\u003cli>What about + 동명사 ~?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure.\u003c/li>\u003cli>Good idea.\u003c/li>\u003cli>That sounds cool!\u003c/li>\u003cli>Okay.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"자, 첫 번째 의사소통 기능은 제안하기예요. 상대에게 무엇을 함께 하자고 부드럽게 권할 때는 Why don't we 뒤에 동사원형을 붙여서 말해요. Why don't we try this?라고 하면 우리 이거 해 볼까?라는 뜻이에요. 이 표현은 Let's try this로 바꿔 말할 수도 있어요.","hl":"key"},{"n":13,"text":"그럼 같은 뜻을 가진 다른 표현들도 하나씩 들어 볼게요. Let's try this, 우리 이거 하자. Shall we try this, 우리 이거 해 볼까? How about trying this, 이거 해 보는 건 어때? 이렇게 상황에 따라 골라서 쓸 수 있어요.","hl":"alts"},{"n":14,"text":"제안을 들었을 때는 어떻게 답할까요? Sure, 그래. Good idea, 좋은 생각이야. That sounds cool, 멋지게 들리네. Okay, 좋아. 이렇게 짧게 동의해 주면 돼요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">관심 있는 일 말하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I'm interested in + 동명사 ~\u003c/div>\u003cdiv class=\"d-mean\">나는 ~하는 것에 관심이 있어\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Yes, I'm interested in flying airplanes. ➌How about you, Lucy?\u003c/div>\u003cdiv class=\"d-exp\">자신이 \u003cb class=\"key\">관심\u003c/b> 있는 활동을 말할 때 「be interested in + 동명사」를 써요. in은 \u003cb class=\"key\">전치사\u003c/b>라서 뒤에 동사원형이 아니라 반드시 동명사가 온다는 점을 꼭 기억해요. 상대에게 되물을 때는 How about you?를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I'm into + 명사/동명사 ~\u003c/li>\u003cli>I like + 동명사 ~\u003c/li>\u003cli>I enjoy + 동명사 ~\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>How about you?\u003c/li>\u003cli>What about you?\u003c/li>\u003cli>I'm interested in + 명사, too.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"두 번째 의사소통 기능은 관심 있는 일 말하기예요. 내가 관심 있는 활동을 말할 때는 I'm interested in 뒤에 동명사를 붙여요. I'm interested in flying airplanes라고 하면 나는 비행기를 조종하는 것에 관심이 있어라는 뜻이에요. 여기서 in은 전치사라서 뒤에 동명사가 온다는 것, 꼭 기억해요.","hl":"key"},{"n":16,"text":"같은 뜻을 가진 다른 표현도 들어 볼게요. I'm into flying airplanes, 나는 비행기 조종에 빠져 있어. I like flying airplanes, 나는 비행기 조종을 좋아해. I enjoy flying airplanes, 나는 비행기 조종을 즐겨. 이렇게도 말할 수 있어요.","hl":"alts"},{"n":17,"text":"그러면 상대에게는 어떻게 되물을까요? How about you? 너는 어때? What about you? 너는 어때? 라고 물어볼 수 있어요. 나도 관심이 있으면 I'm interested in flying airplanes, too라고 답해 주면 돼요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 10\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Jiho, ➊\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why don't we try this\u003c/span>? We can fly an airplane!\u003c/div>\u003cdiv class=\"d-ko\">지호야, 우리 이거 해 볼까? 우리 비행기를 날릴 수 있어!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>「Why don’t we + \u003cb class=\"key\">동사원형\u003c/b> ~?」은 ‘우리 ~할까?’라는 의미의 \u003cb class=\"key\">제안\u003c/b>하는 표현이며, 「Let’s + 동사원형 ~」으로 바꿔 말할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Let's try this.\u003c/span>\u003cspan>Shall we try this?\u003c/span>\u003cspan>How about trying this?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. It ➋ \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looks like fun\u003c/span>!\u003c/div>\u003cdiv class=\"d-ko\">그래. 재미있어 보이네!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>fun은 ‘재미’라는 뜻의 \u003cb class=\"key\">명사\u003c/b>로 쓰였으며, 「look like + \u003cb class=\"key\">명사\u003c/b>」는 ‘~해 보이다, ~처럼 보이다’라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"첫 번째 줄이에요. 루시가 지호에게 말해요. Jiho, why don't we try this? We can fly an airplane! 지호야, 우리 이거 해 볼까? 우리 비행기를 날릴 수 있어! 여기서 why don't we try this는 우리 이거 해 볼까라고 제안하는 표현이에요. Let's try this라고 바꿔 말할 수도 있어요.","hl":"l-0"},{"n":19,"text":"두 번째 줄은 지호의 대답이에요. Sure. It looks like fun! 그래. 재미있어 보이네! 여기서 fun은 재미라는 뜻의 명사로 쓰였고, look like 뒤에 명사가 오면 해 보이다, 처럼 보이다라는 뜻이 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 10\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Do you want to be a pilot in the future\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">너는 장래에 조종사가 되고 싶니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>「want to be + 명사」는 ‘~가 되고 싶다’라는 뜻이고, \u003cb class=\"key\">in the future\u003c/b>는 ‘장래에, 앞으로’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Are you going to be a pilot in the future?\u003c/span>\u003cspan>Do you want to become a pilot in the future?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes, \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I'm interested in flying airplanes\u003c/span>. ➌\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">How about you, Lucy?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">응, 나는 비행기를 조종하는 것에 관심이 있어. 너는 어때, 루시?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>「be interested in + \u003cb class=\"key\">동명사\u003c/b>」는 ‘~하는 것에 관심이 있다’라는 뜻이에요. in은 \u003cb class=\"key\">전치사\u003c/b>라서 뒤에 동명사가 와요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>‘너는 어때?’라는 의미로 \u003cb class=\"key\">상대방의 의견\u003c/b>을 물을 때 쓰며, What about you?로 바꿔 말할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What about you, Lucy?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"세 번째 줄이에요. Do you want to be a pilot in the future? 너는 장래에 조종사가 되고 싶니? want to be 뒤에 명사를 쓰면 그것이 되고 싶다라는 뜻이고, in the future는 장래에라는 뜻이에요. 같은 뜻으로 Are you going to be a pilot in the future?라고도 말할 수 있어요.","hl":"l-0"},{"n":21,"text":"네 번째 줄은 지호가 답해요. Yes, I'm interested in flying airplanes. How about you, Lucy? 응, 나는 비행기를 조종하는 것에 관심이 있어. 너는 어때, 루시? be interested in 뒤에는 동명사가 오고, How about you는 너는 어때라는 뜻으로 What about you로 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 10\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">I'm interested in making airplanes\u003c/span>, ➍ \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">not flying\u003c/span>. I want\u003c/div>\u003cdiv class=\"d-ko\">나는 비행기를 만드는 것에 관심이 있어, 조종하는 게 아니라. 나는\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>「be interested in + \u003cb class=\"key\">동명사\u003c/b>」 형태로, 관심 있는 활동인 ‘비행기를 만드는 것’을 말하고 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>콤마 뒤에 not으로 시작하는 말을 덧붙여 ‘~이 아니라’라는 의미를 나타내면서 앞의 말을 \u003cb class=\"key\">강조\u003c/b>할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">to be an airplane engineer\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">비행기 엔지니어가 되고 싶어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>앞 줄의 want와 이어져 「want to be + 명사」 ‘~가 되고 싶다’를 이루고, \u003cb class=\"key\">engineer\u003c/b>는 ‘엔지니어, 기술자’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"다섯 번째 줄이에요. I'm interested in making airplanes, not flying. I want 나는 비행기를 만드는 것에 관심이 있어, 조종하는 게 아니라. 나는 콤마 뒤에 not으로 시작하는 말을 덧붙이면 조종하는 게 아니라처럼 앞의 말을 강조할 수 있어요.","hl":"l-0"},{"n":23,"text":"여섯 번째 줄이에요. to be an airplane engineer. 비행기 엔지니어가 되고 싶어. 앞 줄의 want와 이어져서 want to be an airplane engineer, 즉 비행기 엔지니어가 되고 싶다라는 뜻이 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 10\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">That ➎\u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">sounds cool\u003c/span>!\u003c/div>\u003cdiv class=\"d-ko\">그거 멋지게 들리네!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>「sound + \u003cb class=\"key\">형용사\u003c/b>」는 ‘~하게 들리다’의 의미예요. 들려서 느껴지는 인상을 말할 때 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That sounds great!\u003c/span>\u003cspan>That sounds fun!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Thank you. \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">I want to make an airplane someday\u003c/span>!\u003c/div>\u003cdiv class=\"d-ko\">고마워. 나는 언젠가 비행기를 만들고 싶어!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>「want to + \u003cb class=\"key\">동사원형\u003c/b>」은 ‘~하고 싶다’라는 뜻이고, \u003cb class=\"key\">someday\u003c/b>는 ‘언젠가’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"일곱 번째 줄이에요. That sounds cool! 그거 멋지게 들리네! sound 뒤에 형용사를 쓰면 하게 들리다라는 뜻이에요. That sounds great라고도 말할 수 있어요.","hl":"l-0"},{"n":25,"text":"여덟 번째 줄이에요. Thank you. I want to make an airplane someday! 고마워. 나는 언젠가 비행기를 만들고 싶어! want to 뒤에 동사원형을 쓰면 하고 싶다라는 뜻이고, someday는 언젠가라는 뜻이에요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 10\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➏\u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">Let's fly this airplane\u003c/span>, and then we can ➐\u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">try making an airplane\u003c/span>, too.\u003c/div>\u003cdiv class=\"d-ko\">우리 이 비행기를 날려 보자, 그러고 나서 우리 비행기를 만들어 보는 것도 시도해 볼 수 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>「Let’s + 동사원형」은 ‘~하자’라는 의미로 \u003cb class=\"key\">제안\u003c/b>하는 표현이며, 「Why don’t we + 동사원형 ~?」으로 바꿔 말할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>「try + \u003cb class=\"key\">동명사\u003c/b>」는 ‘(시험삼아) ~해 보다’라는 의미예요. 참고로 「try + \u003cb class=\"key\">to부정사\u003c/b>」는 ‘~하기 위해 노력하다’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Why don't we fly this airplane and then try making an airplane, too?\u003c/span>\u003cspan>Shall we fly this airplane and then try making an airplane, too?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">Good idea\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">좋은 생각이야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan>상대의 \u003cb class=\"key\">제안\u003c/b>에 동의하며 ‘좋은 생각이야’라고 답하는 표현이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Sounds good.\u003c/span>\u003cspan>That's a great idea.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"아홉 번째 줄이에요. Let's fly this airplane, and then we can try making an airplane, too. 우리 이 비행기를 날려 보자, 그러고 나서 우리 비행기를 만들어 보는 것도 시도해 볼 수 있어. Let's 뒤에 동사원형을 쓰면 하자가 되고, try 뒤에 동명사를 쓰면 시험삼아 해 보다라는 뜻이에요. 참고로 try 뒤에 to부정사를 쓰면 하기 위해 노력하다라는 뜻이 돼요. 여기서는 Why don't we fly this airplane and then try making an airplane, too?라고도 말할 수 있어요.","hl":"l-0"},{"n":27,"text":"마지막 줄이에요. Good idea. 좋은 생각이야. 상대의 제안에 동의할 때 쓰는 표현이에요. Sounds good이나 That's a great idea라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 3\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 Why don't we try this?와 같은 뜻으로 쓸 수 있는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Why don't we try this?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Let's try this.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Do you try this?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Are we trying this?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Why are we trying this?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Can you try this?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Let's try this.\u003c/span>\u003cdiv class=\"g-exp\">「Why don’t we + 동사원형 ~?」은 우리 ~할까라고 [[제안]]하는 표현이에요. 같은 뜻으로 「Let's + [[동사원형]] ~」을 쓸 수 있어요. 나머지 보기는 제안의 뜻이 아니거나 형태가 어색해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"첫 번째 문제는 대체 표현 고르기예요. 밑줄 친 Why don't we try this?와 같은 뜻으로 쓸 수 있는 표현을 골라 보세요. 보기는 첫 번째, Let's try this. 두 번째, Do you try this? 세 번째, Are we trying this? 네 번째, Why are we trying this? 다섯 번째, Can you try this? 입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 첫 번째 보기예요. Why don't we 뒤에 동사원형을 쓰는 표현도 제안하는 말이고, Let's 뒤에 동사원형을 쓰는 표현도 똑같이 제안하는 말이에요. 나머지 보기는 제안의 뜻이 아니거나 형태가 어색해서 답이 될 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 3\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">I'm interested in ____ airplanes.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>make\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>making\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>to make\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>made\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>makes\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">making\u003c/span>\u003cdiv class=\"g-exp\">「be interested in + [[동명사]]」 형태로 써요. in은 [[전치사]]라서 뒤에 동사원형이나 to부정사가 아니라 동명사가 와요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"두 번째 문제는 빈칸 채우기예요. I'm interested in 빈칸 airplanes. 빈칸에 알맞은 것을 골라 보세요. 보기는 첫 번째 make, 두 번째 making, 세 번째 to make, 네 번째 made, 다섯 번째 makes 입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 두 번째 보기, making이에요. be interested in 뒤에는 동명사가 와요. in이 전치사라서 뒤에 동사원형이나 to부정사가 아니라 동명사가 오는 거예요. 그래서 I'm interested in making airplanes가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 3\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화를 순서대로 바르게 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) Yes, I'm interested in flying airplanes. How about you, Lucy? (B) Jiho, why don't we try this? We can fly an airplane! (C) I'm interested in making airplanes, not flying. I want to be an airplane engineer. (D) Sure. It looks like fun!\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>B-D-A-C\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>B-A-D-C\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>D-B-A-C\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>B-D-C-A\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>D-A-B-C\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">B-D-A-C\u003c/span>\u003cdiv class=\"g-exp\">먼저 루시가 Why don't we try this?로 [[제안]]하고, 지호가 Sure로 답한 뒤 자신의 관심사를 말하며 루시에게 되물어요. 마지막으로 루시가 자신의 관심사와 장래 희망을 말하는 흐름이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"세 번째 문제는 대화 순서 배열이에요. 주어진 대화를 자연스러운 순서로 배열한 것을 골라 보세요. 보기는 첫 번째 B-D-A-C, 두 번째 B-A-D-C, 세 번째 D-B-A-C, 네 번째 B-D-C-A, 다섯 번째 D-A-B-C 입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 첫 번째 보기, B-D-A-C예요. 먼저 루시가 Jiho, why don't we try this?라고 제안하고, 지호가 Sure. It looks like fun!이라고 답해요. 그다음 지호가 자신이 비행기 조종에 관심이 있다고 말하며 루시에게 How about you?라고 되묻고, 마지막으로 루시가 비행기를 만드는 것에 관심이 있고 비행기 엔지니어가 되고 싶다고 말하는 흐름이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">제안하고 관심 있는 일 말하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>제안할 때는 \u003cb class=\"key\">Why don't we + 동사원형\u003c/b>이나 \u003cb class=\"key\">Let's + 동사원형\u003c/b>을 써요.\u003c/li>\u003cli>관심 있는 일은 \u003cb class=\"key\">I'm interested in + 동명사\u003c/b>로 말하고, 되물을 때는 \u003cb class=\"key\">How about you?\u003c/b>를 써요.\u003c/li>\u003cli>‘~이 아니라’를 강조할 때는 콤마 뒤에 \u003cb class=\"key\">not\u003c/b>으로 시작하는 말을 덧붙여요.\u003c/li>\u003cli>「try + \u003cb class=\"key\">동명사\u003c/b>」는 ‘(시험삼아) ~해 보다’, 「try + \u003cb class=\"key\">to부정사\u003c/b>」는 ‘~하기 위해 노력하다’예요.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘 배운 표현을 정리해 볼게요. 제안할 때는 Why don't we 뒤에 동사원형을 쓰거나 Let's 뒤에 동사원형을 써서 말해요. 관심 있는 일은 I'm interested in 뒤에 동명사를 붙여 말하고, 되물을 때는 How about you?라고 물어봐요. 그리고 콤마 뒤에 not으로 시작하는 말을 붙이면 그것이 아니라라고 강조할 수 있고, try 뒤에 동명사가 오면 시험삼아 해 보다, to부정사가 오면 하기 위해 노력하다라는 뜻이 된다는 것도 꼭 기억해요. 오늘도 정말 잘했어요. 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
