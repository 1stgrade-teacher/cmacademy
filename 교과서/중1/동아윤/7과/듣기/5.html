window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"C Watch, Answer, and Talk","title":"중1 동아 윤정미 7과 C Watch, Answer, and Talk","audioDir":"5_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">제안하기와 관심사·장래 희망 묻고 답하기\u003c/div>\u003ch1>중1 동아 윤정미 7과 C Watch, Answer, and Talk 대화문 해설\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>지호와 루시가 비행기 장난감을 함께 가지고 놀면서 서로의 관심사와 장래 희망에 대해 이야기합니다. 루시는 비행기를 만드는 엔지니어가 되고 싶다고 말하고, 지호는 비행기를 날리는 것에 관심이 있습니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 중학교 일 학년 동아 윤정미 교과서 칠 과, Watch, Answer, and Talk 대화문을 함께 공부해 볼 거예요. 지호와 루시가 비행기 장난감을 함께 하면서 서로의 관심사와 장래 희망을 이야기하는 장면이에요. 그럼 대화를 한 줄씩 읽으면서 오늘의 표현을 차근차근 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Jiho, why don't we try this? We can fly an airplane!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Sure. It looks like fun!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Do you want to be a pilot in the future?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Yes, I'm interested in flying airplanes. How about you, Lucy?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I'm interested in making airplanes, not flying. I want to be an airplane engineer.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">That sounds cool!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Thank you. I want to make an airplane someday!\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Let's fly this airplane, and then we can try making an airplane, too.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Good idea.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Jiho, why don't we try this? We can fly an airplane!","hl":"r-0"},{"n":3,"text":"Sure. It looks like fun!","hl":"r-1"},{"n":4,"text":"Do you want to be a pilot in the future?","hl":"r-2"},{"n":5,"text":"Yes, I'm interested in flying airplanes. How about you, Lucy?","hl":"r-3"},{"n":6,"text":"I'm interested in making airplanes, not flying. I want to be an airplane engineer.","hl":"r-4"},{"n":7,"text":"That sounds cool!","hl":"r-5"},{"n":8,"text":"Thank you. I want to make an airplane someday!","hl":"r-6"},{"n":9,"text":"Let's fly this airplane, and then we can try making an airplane, too.","hl":"r-7"},{"n":10,"text":"Good idea.","hl":"r-8"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">제안하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Why don't we + 동사원형 ~?\u003c/div>\u003cdiv class=\"d-mean\">우리 ~할까?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Jiho, why don't we try this? We can fly an airplane!\u003c/div>\u003cdiv class=\"d-exp\">상대에게 함께 무엇을 하자고 \u003cb class=\"key\">제안\u003c/b>할 때 「Why don't we + 동사원형 ~?」을 써요. 뜻은 ‘우리 ~할까?’이고, 「Let's + 동사원형 ~」으로 바꿔 말할 수 있어요. 상대가 제안을 받아들일 때는 Sure나 \u003cb class=\"key\">Good idea\u003c/b>로 답해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>Let's + 동사원형 ~.\u003c/li>\u003cli>How about + 동명사 ~?\u003c/li>\u003cli>Shall we + 동사원형 ~?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Sure.\u003c/li>\u003cli>Good idea.\u003c/li>\u003cli>That sounds great.\u003c/li>\u003cli>Sounds good.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"먼저 제안하는 표현을 볼게요. Why don't we try this? 는 우리 이거 해 볼까? 라는 뜻이에요. Why don't we 뒤에 동사원형을 넣으면 우리 함께 무엇을 하자고 부드럽게 제안하는 말이 돼요.","hl":"key"},{"n":12,"text":"같은 뜻으로는 Let's try this라고 할 수 있어요. 우리 이거 해 보자 라는 뜻이죠. How about trying this나 Shall we try this도 함께 기억해 두세요.","hl":"alts"},{"n":13,"text":"이런 제안에 대답할 때는 Sure라고 하거나 Good idea라고 해요. That sounds great라고 해도 좋아요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">관심사 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What are you interested in?\u003c/div>\u003cdiv class=\"d-mean\">너는 무엇에 관심이 있니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Yes, I'm interested in flying airplanes. How about you, Lucy?\u003c/div>\u003cdiv class=\"d-exp\">관심 있는 활동이나 분야를 물을 때는 \u003cb class=\"key\">What are you interested in?\u003c/b>이라고 해요. 대답할 때는 I'm interested in 다음에 관심 활동을 넣고, 활동은 동사원형에 -ing를 붙인 \u003cb class=\"key\">동명사\u003c/b> 형태로 말해요. 장래 희망을 물을 때는 \u003cb class=\"key\">What do you want to be in the future?\u003c/b>라고 하고, 「I want to be + 직업」으로 답해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What do you like doing?\u003c/li>\u003cli>What are your interests?\u003c/li>\u003cli>Is there anything you are interested in?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I'm interested in + 명사(동명사).\u003c/li>\u003cli>I'm into + 명사(동명사).\u003c/li>\u003cli>I like + 동명사.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"이번에는 관심사를 묻고 답하는 표현이에요. What are you interested in? 은 너는 무엇에 관심이 있니? 라는 뜻이죠. 그리고 대답할 때는 I'm interested in 뒤에 관심 있는 활동이나 분야를 넣어 말해요.","hl":"key"},{"n":15,"text":"질문은 What do you like doing이나 What are your interests로도 바꿔 말할 수 있어요. 대답은 I'm into 다음에 좋아하는 것을 넣어도 같은 뜻이 된답니다.","hl":"alts"},{"n":16,"text":"대답으로는 I'm interested in flying airplanes처럼 동명사를 써서 말해요. I like making airplanes라고 해도 자연스러워요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Jiho, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why don't we try this?\u003c/span> We can fly an airplane!\u003c/div>\u003cdiv class=\"d-ko\">지호야, 우리 이거 해 볼까? 우리 비행기를 날릴 수 있어!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>「Why don't we + 동사원형 ~?」은 ‘우리 ~할까?’라는 의미의 \u003cb class=\"key\">제안\u003c/b> 표현이에요. 「Let's + 동사원형 ~」으로 바꿔 말할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Let's try this, Jiho.\u003c/span>\u003cspan>How about trying this?\u003c/span>\u003cspan>Shall we try this?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Sure. \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">It looks like fun!\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">물론이지. 재미있어 보여!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>fun은 ‘재미’라는 뜻의 \u003cb class=\"key\">명사\u003c/b>로 쓰였어요. 「look like + 명사」는 ‘~해 보이다, ~처럼 보이다’라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"첫 번째 줄이에요. Jiho, why don't we try this? We can fly an airplane! 지호야, 우리 이거 해 볼까? 우리 비행기를 날릴 수 있어! 라는 뜻이에요. 여기서 Why don't we 뒤에 동사원형을 쓰면 우리 함께 무엇을 하자고 제안하는 표현이 된답니다. 같은 뜻으로 Let's try this라고도 말할 수 있어요.","hl":"l-0"},{"n":18,"text":"두 번째 줄이에요. Sure. It looks like fun! 물론이지, 재미있어 보여! 라는 뜻이에요. 여기서 fun은 재미라는 뜻의 명사로 쓰였고, look like 뒤에 명사를 쓰면 무언가처럼 보인다는 뜻이 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Do you want to be a pilot in the future?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">너는 장래에 조종사가 되고 싶니?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>장래 희망을 물을 때는 「What do you want to be \u003cb class=\"key\">in the future\u003c/b>?」라고 해요. 여기서는 Do you want to be + 직업 형태로 묻고 있죠.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Are you interested in being a pilot in the future?\u003c/span>\u003cspan>Would you like to be a pilot in the future?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Yes, \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I'm interested in flying airplanes\u003c/span>. \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">How about you, Lucy?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">응, 나는 비행기를 날리는 것에 관심이 있어. 너는 어때, 루시?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>「be \u003cb class=\"key\">interested\u003c/b> in + 명사」는 ‘~에 관심이 있다’라는 뜻이고, 활동을 말할 때는 동사원형에 -ing를 붙인 \u003cb class=\"key\">동명사\u003c/b>를 써요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>‘너는 어때?’라는 의미로, \u003cb class=\"key\">What about you?\u003c/b>로 바꿔 말할 수 있어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Yes, I'm interested in flying airplanes. What about you, Lucy?\u003c/span>\u003cspan>Yes, I want to fly airplanes. How about you, Lucy?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"세 번째 줄이에요. Do you want to be a pilot in the future? 너는 장래에 조종사가 되고 싶니? 라는 뜻이에요. 장래에 무엇이 되고 싶은지 물을 때는 What do you want to be in the future라고도 한답니다.","hl":"l-0"},{"n":20,"text":"네 번째 줄이에요. Yes, I'm interested in flying airplanes. How about you, Lucy? 응, 나는 비행기를 날리는 것에 관심이 있어. 루시 너는 어때? 라는 뜻이에요. be interested in 뒤에는 동명사가 와서 관심 있는 활동을 나타내고, How about you는 What about you로 바꿔 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">I'm interested in making airplanes, \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">not flying\u003c/span>. \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">I want to be an airplane engineer.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">나는 비행기를 날리는 것이 아니라 만드는 것에 관심이 있어. 나는 비행기 엔지니어가 되고 싶어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>콤마 뒤에 \u003cb class=\"key\">not\u003c/b>으로 시작하는 말을 덧붙여 ‘~이 아니라’라는 의미를 나타내면서 앞의 말을 강조할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>「I want to \u003cb class=\"key\">be\u003c/b> + 직업」은 ‘~가 되고 싶다’라는 뜻으로 장래 희망을 말할 때 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I'm interested in making airplanes rather than flying them.\u003c/span>\u003cspan>I like making airplanes, not flying them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">That sounds cool!\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">멋지게 들리네!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>「sound + \u003cb class=\"key\">형용사\u003c/b>」는 ‘~하게 들리다’라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That sounds great!\u003c/span>\u003cspan>That sounds awesome!\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"다섯 번째 줄이에요. I'm interested in making airplanes, not flying. I want to be an airplane engineer. 나는 비행기를 날리는 것이 아니라 만드는 것에 관심이 있어. 나는 비행기 엔지니어가 되고 싶어. 라는 뜻이에요. 콤마 뒤에 not flying을 붙여 날리는 것이 아니라 만드는 것이라고 강조했고, want to be 뒤에 직업을 넣어 장래 희망을 말했어요.","hl":"l-0"},{"n":22,"text":"여섯 번째 줄이에요. That sounds cool! 멋지게 들리네! 라는 뜻이에요. sound 뒤에 형용사를 쓰면 어떻게 들리는지를 나타낼 수 있어요. 그래서 That sounds great나 That sounds awesome으로도 말할 수 있답니다.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Thank you. \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">I want to make an airplane someday\u003c/span>!\u003c/div>\u003cdiv class=\"d-ko\">고마워. 나는 언젠가 비행기를 만들어 보고 싶어!\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>「want to + \u003cb class=\"key\">동사원형\u003c/b>」은 ‘~하고 싶다’라는 뜻이고, \u003cb class=\"key\">someday\u003c/b>는 ‘언젠가’라는 의미예요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I hope to make an airplane someday!\u003c/span>\u003cspan>I want to build an airplane someday!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">B\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">Let's fly this airplane\u003c/span>, and then we can \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">try making an airplane\u003c/span>, too.\u003c/div>\u003cdiv class=\"d-ko\">이 비행기를 날려 보자, 그리고 나서 우리는 비행기를 만들어 보는 것도 해 볼 수 있어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>「Let's + 동사원형」은 ‘~하자’라는 의미로 함께 하자고 \u003cb class=\"key\">제안\u003c/b>하는 표현이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>「\u003cb class=\"key\">try + 동명사\u003c/b>」는 ‘(시험 삼아) ~해 보다’라는 의미이고, 「try + to부정사」는 ‘~하기 위해 \u003cb class=\"key\">노력하다\u003c/b>’라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Let's fly this airplane first, and then we can try making one, too.\u003c/span>\u003cspan>How about flying this airplane and then trying to make one?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"일곱 번째 줄이에요. Thank you. I want to make an airplane someday! 고마워, 나는 언젠가 비행기를 만들어 보고 싶어! 라는 뜻이에요. want to 뒤에 동사원형을 쓰면 하고 싶은 일을 말할 수 있고, someday는 언젠가라는 뜻이에요.","hl":"l-0"},{"n":24,"text":"여덟 번째 줄이에요. Let's fly this airplane, and then we can try making an airplane, too. 이 비행기를 날려 보자, 그리고 나서 우리는 비행기를 만들어 보는 것도 해 볼 수 있어. 라는 뜻이에요. Let's 뒤에 동사원형을 쓰면 함께 하자는 제안이 되고, try 뒤에 동명사를 쓰면 시험 삼아 해 보다는 뜻이 돼요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">G\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">Good idea.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">좋은 생각이야.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>상대의 제안에 \u003cb class=\"key\">동의\u003c/b>할 때 쓰는 짧은 응답 표현이에요. ‘좋은 생각이야’라는 뜻이죠.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Sounds good.\u003c/span>\u003cspan>That's a great idea.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"아홉 번째 줄이에요. Good idea. 좋은 생각이야. 라는 뜻이에요. 상대의 제안에 동의할 때 쓰는 짧은 응답 표현이랍니다. Sounds good이나 That's a great idea라고 해도 같은 뜻이 돼요.","hl":"l-0"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 부분과 바꿔 쓸 수 있는 표현으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">Why don't we try this?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Let's try this.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Do we try this?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Why did we try this?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Are we trying this?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Let's try this.\u003c/span>\u003cdiv class=\"g-exp\">「Why don't we + 동사원형?」은 ‘우리 ~할까?’라는 제안 표현이라서 「Let's + 동사원형」으로 바꿔 말할 수 있어요. 나머지 보기는 시제나 의미가 달라요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"첫 번째 문제예요. 밑줄 친 Why don't we try this와 바꿔 쓸 수 있는 표현을 골라 보세요. 잠시 멈추고 직접 풀어 볼까요?","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 첫 번째 보기예요. Why don't we는 우리가 함께 하자고 제안할 때 쓰니까 Let's try this로 바꿀 수 있어요. 나머지 보기는 시제나 의미가 달라서 답이 될 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003
