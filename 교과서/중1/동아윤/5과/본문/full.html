Museum)</li><li>관람객 Ann의 증언: 휠체어 앞에 서 있는 170cm보다 조금 큰 노인을 목격함</li><li>핵심 키워드: 목격자(eyewitnesses), 범인(criminal)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02결정적 단서 확보</div><ul><li>미술관 직원의 목격담을 통해 범인의 정체가 노인이 아닌 젊은 남성임이 밝혀졌습니다.</li><li>청소부 Carlos의 증언: 도망치던 노인의 가발이 벗겨졌으며, 실제로는 갈색 머리의 젊은 남자임</li><li>경비원 Diego의 증언: 휠체어 옆에서 케이크 상자를 발견함</li><li>핵심 키워드: 가발(wig), 휠체어(wheelchair)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03용의자 신원 특정</div><ul><li>빵집 주인의 증언을 통해 범인의 구체적인 신체적 특징이 확인되었습니다.</li><li>빵집 주인 Camila의 증언: 금요일에 영어만 사용하는 파란 눈의 젊은 남자가 가장 작은 케이크를 구매함</li><li>범인의 특징: 파란 눈(blue eyes), 영어 사용자(English speaker), 작은 케이크 구입</li><li>핵심 키워드: 신체 특징(physical features)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04범인 추론 및 확정</div><ul><li>목격자들의 증언과 용의자들의 정보를 대조하여 최종 범인을 식별합니다.</li><li>용의자 대조: Larry Johnson은 키 173cm, 긴 갈색 머리, 영어 구사, 파란 눈을 가짐</li><li>결과 분석: 모든 증언과 일치하는 인물은 Larry Johnson임</li><li>핵심 키워드: 용의자(suspects), 식별(identify)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throw</td><td class=\"m\">던지다</td></tr><tr><td class=\"w\">eyewitness</td><td class=\"m\">목격자</td></tr><tr><td class=\"w\">criminal</td><td class=\"m\">범인</td></tr><tr><td class=\"w\">visitor</td><td class=\"m\">방문객</td></tr><tr><td class=\"w\">turn around</td><td class=\"m\">뒤를 돌다</td></tr><tr><td class=\"w\">wheelchair</td><td class=\"m\">휠체어</td></tr><tr><td class=\"w\">tall</td><td class=\"m\">키가 큰</td></tr><tr><td class=\"w\">janitor</td><td class=\"m\">관리인, 청소부</td></tr><tr><td class=\"w\">gray</td><td class=\"m\">회색의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">run away</td><td class=\"m\">도망치다</td></tr><tr><td class=\"w\">fall off</td><td class=\"m\">~에서 떨어지다</td></tr><tr><td class=\"w\">wig</td><td class=\"m\">가발</td></tr><tr><td class=\"w\">run after</td><td class=\"m\">뒤쫓다</td></tr><tr><td class=\"w\">catch</td><td class=\"m\">잡다</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은</td></tr><tr><td class=\"w\">guard</td><td class=\"m\">경비원</td></tr><tr><td class=\"w\">crime scene</td><td class=\"m\">범죄 현장</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">조각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누가</span><span class=\"en\"><b><span class=\"grammar-hl\">Who</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 던졌는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Threw a Cake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모나리자에게</span><span class=\"en\"><b><span class=\"grammar-hl\">at the Monalisa?</span></b></span></div></div><div class=\"lec-sent-ko\">누가 모나리자에게 케이크를 던졌나?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글은 미술관에서 발생한 사건의 범인을 찾는 추리 과정임을 보여주는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Who Threw a Cake at the Monalisa? (간접의문문): 의문사 Who가 문장의 주어 역할을 하는 의문문 구조로, 뒤에 동사가 바로 이어짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난 토요일,</span><span class=\"en\"><b>Last Saturday,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가가</span><span class=\"en\"><b><span class=\"grammar-hl\">someone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 던졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">threw a cake</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모나리자에게</span><span class=\"en\"><b><span class=\"grammar-hl\">at the Monalisa</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보테로 박물관에서</span><span class=\"en\"><b>in the Botero Museum</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">콜롬비아 보고타에 있는</span><span class=\"en\"><b>in Bogota, Colombia.</b></span></div></div><div class=\"lec-sent-ko\">지난 토요일, 누군가가 콜롬비아 보고타에 있는 보테로 박물관의 모나리자 그림에 케이크를 던졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건의 배경인 시간과 장소, 그리고 발생한 사건의 내용을 객관적으로 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">someone threw a cake at the Monalisa (관용표현): throw A at B (~에 A를 던지다) 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 명의 목격자가</span><span class=\"en\"><b><span class=\"grammar-hl\">four eyewitnesses.</span></b></span></div></div><div class=\"lec-sent-ko\">네 명의 목격자가 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 범인을 찾기 위한 단서를 제공해 줄 사람들의 존재를 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were four eyewitnesses. (도치): 유도부사 There로 시작하여 주어(four eyewitnesses)와 동사(were)가 도치된 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eyewitness</td><td class=\"m\">목격자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을</span><span class=\"en\"><b><span class=\"grammar-hl\">What</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 말했는가</span><span class=\"en\"><b><span class=\"grammar-hl\">did they say?</span></b></span></div></div><div class=\"lec-sent-ko\">그들이 뭐라고 말했을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 목격자들의 진술을 통해 범인을 추리해 나갈 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What did they say? (간접의문문): 의문사 What으로 시작하는 의문문으로, 조동사 did를 사용하여 주어(they)와 동사원형(say)의 관계를 명시</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음 내용을 읽고</span><span class=\"en\"><b><span class=\"grammar-hl\">Read the following</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">범인을 찾아라</span><span class=\"en\"><b>and find the criminal.</b></span></div></div><div class=\"lec-sent-ko\">다음을 읽고, 범인을 찾아보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 사건의 단서를 조합하여 범인을 지목해보라는 과제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Read the following (관용표현): the following(다음의 것/다음 내용)은 명사로 사용된 관용적 어구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">criminal</td><td class=\"m\">범인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방문객 앤 존스:</span><span class=\"en\"><b>Ann Jones, <span class=\"grammar-hl\">a visitor</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 모나리자를 보고 있었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I was looking at the Monalisa</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가가</span><span class=\"en\"><b>and someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이크를 던졌어요</span><span class=\"en\"><b>threw a cake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림에</span><span class=\"en\"><b>at the painting.</b></span></div></div><div class=\"lec-sent-ko\">(방문객 앤 존스: 저는 모나리자를 보고 있었는데, 누군가가 그림에 케이크를 던졌어요.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사건 당시의 상황을 설명하며, 범인의 행동을 처음으로 목격한 상황을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a visitor I was looking at the Monalisa (현재진행): be동사(was)+현재분사(looking)를 사용하여 과거의 동작을 나타내는 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visitor</td><td class=\"m\">방문객</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 뒤를 돌아보았고</span><span class=\"en\"><b><span class=\"grammar-hl\">I turned around</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보았어요</span><span class=\"en\"><b><span class=\"grammar-hl\">and saw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노인을</span><span class=\"en\"><b><span class=\"grammar-hl\">an old man.</span></b></span></div></div><div class=\"lec-sent-ko\">저는 뒤를 돌아봤고 한 노인을 봤어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앤 존스가 본 범인의 첫인상을 &#39;노인&#39;으로 특정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I turned around and saw an old man. (관용표현): turn around(~로 몸을 돌리다) 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</s
