온다는 사실이 밝혀져 심각한 문제로 떠오르고 있어요. 이런 이유로 환경 보호를 위해 일회용품 대신 다회용기(reusable container)를 사용하는 것과 같은 &#39;제로 웨이스트(zero waste)&#39; 실천이 매우 중요한 삶의 방식이 되고 있답니다. 마치 우리가 매일 쓰는 칫솔이나 빨대 하나를 바꾸는 작은 행동이 모여서 지구 전체의 생태계를 지키는 힘이 된다고 생각하면 이해하기 쉬울 거예요. 이번 지문에서는 이렇게 일상 속에서 플라스틱 사용을 줄이려는 실천이 개인에게 어떤 긍정적인 마음을 가져다주는지 다루고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 인식</div><ul><li>일상적으로 이용하던 음식 배달 서비스 대신 새로운 방식을 시도했다.</li><li>배달 서비스(food delivery services) 이용을 자제함</li><li>직접 식당으로 걸어가서 음식을 포장함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제의식</div><ul><li>환경을 생각하여 일회용품 사용을 줄여야겠다고 결심했다.</li><li>플라스틱은 완전히 사라지지 않음(never goes away completely)</li><li>일회용 플라스틱(single-use plastic) 사용을 피하기로 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천 및 결과</div><ul><li>개인 용기를 지참하여 환경 보호를 실천하고 긍정적인 기분을 느꼈다.</li><li>다회용기(reusable container)를 직접 가져감</li><li>환경을 위한 행동을 통해 뿌듯함(felt good)을 느낌</li><li>핵심 키워드: 일회용품(single-use plastic), 다회용기(reusable container)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 과제</td></tr><tr><td class=\"w\">single-use</td><td class=\"m\">일회용의</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">delivery</td><td class=\"m\">배달</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr><tr><td class=\"w\">instead</td><td class=\"m\">그 대신에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">favorite</td><td class=\"m\">가장 좋아하는</td></tr><tr><td class=\"w\">restaurant</td><td class=\"m\">식당</td></tr><tr><td class=\"w\">reusable</td><td class=\"m\">재사용 가능한</td></tr><tr><td class=\"w\">container</td><td class=\"m\">용기, 그릇</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">~을 찾아오다, 가지러 가다</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">챌린지 03 /</span><span class=\"en\"><b>Challenge 03</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일회용 플라스틱 사용을 반대하세요</span><span class=\"en\"><b>Say No to <span class=\"grammar-hl\">Single-Use Plastic</span></b></span></div></div><div class=\"lec-sent-ko\">(챌린지 03 / 일회용 플라스틱 사용을 반대하세요)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 평소의 습관(배달 이용)과 오늘의 행동이 다름을 밝히며, 환경을 위한 변화를 시도했음을 보여주는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Single-Use Plastic (동명사(명사적)): &#39;Single-Use&#39;는 &#39;한 번 사용하기&#39;라는 행위를 나타내는 동명사로, 뒤의 명사 Plastic을 수식하며 &#39;일회용 플라스틱&#39;이라는 용도/성격을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 과제</td></tr><tr><td class=\"w\">single-use</td><td class=\"m\">일회용의</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 종종 음식 배달 서비스를 이용하는데,</span><span class=\"en\"><b>Emma: I often use <span class=\"grammar-hl\">food delivery services</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘은 이용하지 않았어.</span><span class=\"en\"><b>but today I <span class=\"grammar-hl\">didn’t</span>.</b></span></div></div><div class=\"lec-sent-ko\">(Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자가 평소의 습관(배달 이용)과 오늘의 행동이 다름을 밝히며, 환경을 위한 변화를 시도했음을 보여주는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">food delivery services (동명사(명사적)): &#39;delivery&#39;는 &#39;배달하기&#39;라는 행위의 용도를 나타내는 동명사로, 뒤의 명사 services를 수식하여 &#39;음식 배달 서비스&#39;라는 구체적인 의미를 형성합니다.</div><div class=\"lec-gr-item\">didn’t (대동사): 앞의 일반동사 &#39;use food delivery services&#39;를 대신하여 반복을 피하는 대동사입니다. 앞의 동사가 일반동사이면 do[does, did]를 쓴다는 규칙에 따라 did를 사용했습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delivery</td><td class=\"m\">배달</td></tr><tr><td class=\"w\">service</td><td class=\"m\">서비스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 가장 좋아하는 식당에 걸어가서</span><span class=\"en\"><b>I walked to my favorite restaurant</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재사용할 수 있는 용기를 가지고</span><span class=\"en\"><b>with a <span class=\"grammar-hl\">reusable container</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식을 가져왔어.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">picked up</span> the food.</b></span></div></div><div class=\"lec-sent-ko\">대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 Instead는 단순히 &#39;대신에&#39;라는 뜻을 넘어, 배달 시 발생하는 플라스틱 쓰레기를 줄이겠다는 필자의 &#39;의도적인 선택&#39;을 강조합니다. 앞 문장의 &#39;배달하지 않음&#39;이라는 결심을 실천으로 옮기는 구체적인 행동을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reusable container (현재분사(형용사)): &#39;reusable&#39;은 &#39;재사용할 수 있는&#39;이라는 상태를 나타내며 뒤의 명사 container를 수식합니다.</div><div class=\"lec-gr-item\">picked up (관용표현): &#39;pick up&#39;은 &#39;찾으러 가다/가져오다&#39;라는 의미의 구동사로, 문맥상 음식점에서 음식을 받아오는 행위를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead</td><td class=\"m\">그 대신에</td></tr><tr><td class=\"w\">favorite</td><td class=\"m\">가장 좋아하는</td></tr><tr><td class=\"w\">restaurant</td><td class=\"m\">식당</td></tr><tr><td class=\"w\">reusable</td><td class=\"m\">재사용 가능한</td></tr><tr><td class=\"w\">container</td><td class=\"m\">용기, 그릇</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">들었어</span><span class=\"en\"><b>I heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱은 절대로 완전히 없어지지 않는다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that plastic never goes away completely</span>.</b></span></div></div><div class=\"lec-sent-ko\">플라스틱은 절대로 완전히 없어지지 않는다고 들었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> goes away는 사전적으로 &#39;멀리 가다&#39;이지만, 여기서는 플라스틱이 자연에서 분해되어 흔적도 없이 사라지는 상태를 의미합니다. 필자가 환경 보호를 실천하게 된 동기를 설명하며, 플라스틱의 영구적인 잔류성에 대한 경각심을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that plastic never goes away completely (명사절(that절)): &#39;heard&#39;라는 타동사의 목적어 역할을 하는 명사절로, 문장 전체의 내용을 이끕니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">completely</td><td class=\"m\">완전히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 사용하지 않았어</span><span class=\"en\"><b>I didn’t use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘 어떤 일회용 플라스틱도</span><span class=\"en\"><b>any <span class=\"grammar-hl\">single-use plastic</span> today.</b></span></div></div><div class=\"lec-sent-ko\">나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 문제의식(플라스틱의 잔류성)을 바탕으로 필자가 달성한 구체적인 실천 성과를 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">single-use plastic (동명사(명사적)): &#39;single-use&#39;는 &#39;한 번 사용하기&#39;라는 용도를 나타내는 동명사로, Plastic을 수식하며 &#39;일회용 플라스틱&#39;이라는 명사적 개념을 만듭니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">single-use</td><td class=\"m\">일회용의</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기분이 좋았어!</span><span class=\"en\"><b>I <span class=\"grammar-hl\">felt good</span>!</b></span></div></div><div class=\"lec-sent-ko\">기분이 좋았어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> good은 사전적으로 &#39;좋은&#39;이라는 뜻이지만, 여기서는 자신의 선택이 환경에 긍정적인 영향을 미쳤다는 사실에서 오는 &#39;뿌듯함&#39;과 &#39;보람&#39;을 의미합니다. 필자의 개인적인 감정을 통해 독자들에게 환경 보호 실천의 정서적 만족감을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt good 2형식 구조: &#39;feel&#39;은 보어를 필요로 하는 불완전 자동사로, 뒤에 형용사 보어 &#39;good&#39;이 와서 주어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>필자는 평소 즐기던 배달 음식 대신 다회용기를 직접 챙겨 음식 포장에 나섰다.</li><li>플라스틱이 완전히 사라지지 않는다는 사실을 인지하고 실천에 옮긴 것이다.</li><li>일회용품 사용을 줄인 결과, 필자는 큰 만족감과 뿌듯함을 느꼈다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The speaker chooses to visit a restaurant with a reusable container, and she feels proud of avoiding single-use plastic to protect the environment.</div>\n              <div class=\"lec-final-sum-ko\">말하는 이는 다회용기를 가지고 식당에 방문하는 방법을 선택했으며, 환경을 보호하기 위해 일회용 플라스틱을 사용하지 않은 것에 대해 뿌듯함을 느낀다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"}],[{"audio":"./3_audio/7.mp3","hl":null}],[{"audio":"./3_audio/8.mp3","hl":"main"},{"audio":"./3_audio/9.mp3","hl":"meaning"},{"audio":"./3_audio/10.mp3","hl":"grammar"}],[{"audio":"./3_audio/11.mp3","hl":"main"},{"audio":"./3_audio/12.mp3","hl":"meaning"},{"audio":"./3_audio/13.mp3","hl":"grammar"}],[{"audio":"./3_audio/14.mp3","hl":"main"},{"audio":"./3_audio/15.mp3","hl":"meaning"},{"audio":"./3_audio/16.mp3","hl":"grammar"}],[{"audio":"./3_audio/17.mp3","hl":"main"},{"audio":"./3_audio/18.mp3","hl":"meaning"},{"audio":"./3_audio/19.mp3","hl":"grammar"}],[{"audio":"./3_audio/20.mp3","hl":"main"},{"audio":"./3_audio/21.mp3","hl":"meaning"},{"audio":"./3_audio/22.mp3","hl":"grammar"}],[{"audio":"./3_audio/23.mp3","hl":"main"},{"audio":"./3_audio/24.mp3","hl":"meaning"},{"audio":"./3_audio/25.mp3","hl":"grammar"}],[{"audio":"./3_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeTy
