 재활용(recycling), 보상(in return)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycle</td><td class=\"m\">재활용하다</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱의</td></tr><tr><td class=\"w\">glass</td><td class=\"m\">유리로 된</td></tr><tr><td class=\"w\">bottle</td><td class=\"m\">병</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycling machine</td><td class=\"m\">재활용 수거기</td></tr><tr><td class=\"w\">one by one</td><td class=\"m\">하나씩</td></tr><tr><td class=\"w\">in return</td><td class=\"m\">보답으로, 대신에</td></tr><tr><td class=\"w\">point</td><td class=\"m\">점수, 포인트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어제,</span><span class=\"en\"><b>Yesterday,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 가져갔다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱과 유리병 몇 개를</span><span class=\"en\"><b><span class=\"grammar-hl\">some plastic and glass bottles</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용 기계로</span><span class=\"en\"><b><span class=\"grammar-hl\">to a recycling machine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 집 근처에 있는</span><span class=\"en\"><b>near my house.</b></span></div></div><div class=\"lec-sent-ko\">민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 민수가 재활용 활동을 시작했다는 상황을 설명합니다. &#39;Recycle&#39;이라는 주제를 도입하며, 구체적으로 어떤 행동을 했는지 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took some plastic and glass bottles to a recycling machine 5형식(SVOC) 구조의 변형: take A to B(A를 B로 가져가다) 구조로, 주어(I)가 행위자이며 목적어(plastic and glass bottles)를 목적지(recycling machine)로 이동시키는 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱의</td></tr><tr><td class=\"w\">glass</td><td class=\"m\">유리로 된</td></tr><tr><td class=\"w\">bottle</td><td class=\"m\">병</td></tr><tr><td class=\"w\">recycling machine</td><td class=\"m\">재활용 수거기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 넣었다</span><span class=\"en\"><b>I put</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 기계 안으로</span><span class=\"en\"><b>them into the machine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나씩,</span><span class=\"en\"><b><span class=\"grammar-hl\">one by one</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 얻었다</span><span class=\"en\"><b>and I got</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약간의 포인트를</span><span class=\"en\"><b>some points</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대가로</span><span class=\"en\"><b><span class=\"grammar-hl\">in return</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 가져간 물건들을 어떻게 처리했는지 과정을 서술합니다. 여기서 in return은 사전적으로는 &#39;보답으로&#39;라는 뜻이지만, 여기서는 재활용 행위에 대한 &#39;보상으로&#39;라는 의미로 쓰였습니다. 단순히 물건을 버리는 행위가 아니라, 행동에 대한 경제적 이득이 발생했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one by one (관용표현): &#39;하나씩, 차례대로&#39;라는 의미를 가진 부사적 표현입니다.</div><div class=\"lec-gr-item\">in return (관용표현): &#39;보답으로, 대신에&#39;라는 의미를 가진 부사적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">one by one</td><td class=\"m\">하나씩</td></tr><tr><td class=\"w\">in return</td><td class=\"m\">보답으로, 대신에</td></tr><tr><td class=\"w\">point</td><td class=\"m\">점수, 포인트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇을 나는 할 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">What can I do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 포인트들로?</span><span class=\"en\"><b>with those points?</b></span></div></div><div class=\"lec-sent-ko\">그 포인트로 무엇을 할 수 있냐고?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;포인트&#39;라는 새로운 개념에 대해 독자의 호기심을 자극하며, 다음 내용에 대한 궁금증을 유발하는 질문을 던집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What can I do 간접의문문과 관련된 의문문 구조: 의문사(What)가 문장 맨 앞으로 이동하여 조동사(can)와 주어(I)가 도치된 의문문 기본 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">point</td><td class=\"m\">점수, 포인트</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 사용할 수 있다</span><span class=\"en\"><b>I can use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을</span><span class=\"en\"><b>them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">like money</span>.</b></span></div></div><div class=\"lec-sent-ko\">음, 나는 그것들을 돈처럼 사용할 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장의 질문에 대한 답변입니다. 포인트가 단순한 숫자가 아니라 실질적인 화폐 가치를 지닌다는 점을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">like money (관용표현): 전치사 like는 &#39;~처럼&#39;이라는 비유의 의미를 나타내며, 여기서는 &#39;돈처럼&#39;이라는 의미로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 생각하지 않니</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 멋지다고?</span><span class=\"en\"><b><span class=\"grammar-hl\">that’s cool</span>?</b></span></div></div><div class=\"lec-sent-ko\">멋지다고 생각하지 않니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 경험과 정보에 대해 상대방의 동의를 구하며 대화를 마무리합니다. 재활용이 환경 보호라는 가치를 넘어 재미있고 이익이 되는 활동임을 강조하며 글을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t you think (도치): 부정 의문문 구조로, 조동사(Do)와 주어(you)가 도치되어 의문문을 형성하고 있습니다.</div><div class=\"lec-gr-item\">that’s cool (that절): think의 목적어 역할을 하는 명사절로, 주어(that)와 서술어(is)가 결합된 형태입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>민수는 집 근처 재활용 기계에 플라스틱과 유리병을 가져갔다.</li><li>물건을 넣을 때마다 포인트를 보상으로 받았다.</li><li>이 포인트는 실제 돈처럼 사용할 수 있다.</li><li>민수는 재활용의 편리함과 보상 체계가 매우 멋진 일이라고 생각한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People can use recycling machines to dispose of waste conveniently, and they receive points that function like money in return.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 재활용 기계를 사용하여 편리하게 쓰레기를 처리하고, 그 대가로 현금처럼 사용할 수 있는 포인트를 받는다.</div></div></div>"],"segs":[[{"audio":"./4_audio/1.mp3","hl":null}],[{"audio":"./4_audio/2.mp3","hl":null}],[{"audio":"./4_audio/3.mp3","hl":null},{"audio":"./4_audio/4.mp3","hl":"stage-0"},{"audio":"./4_audio/5.mp3","hl":"stage-1"},{"audio":"./4_audio/6.mp3","hl":"stage-2"}],[{"audio":"./4_audio/7.mp3","hl":null}],[{"audio":"./4_audio/8.mp3","hl":"main"},{"audio":"./4_audio/9.mp3","hl":"meaning"},{"audio":"./4_audio/10.mp3","hl":"grammar"}],[{"audio":"./4_audio/11.mp3","hl":"main"},{"audio":"./4_audio/12.mp3","hl":"meaning"},{"audio":"./4_audio/13.mp3","hl":"grammar"}],[{"audio":"./4_audio/14.mp3","hl":"main"},{"audio":"./4_audio/15.mp3","hl":"meaning"},{"audio":"./4_audio/16.mp3","hl":"grammar"}],[{"audio":"./4_audio/17.mp3","hl":"main"},{"audio":"./4_audio/18.mp3","hl":"meaning"},{"audio":"./4_audio/19.mp3","hl":"grammar"}],[{"audio":"./4_audio/20.mp3","hl":"main"},{"audio":"./4_audio/21.mp3","hl":"meaning"},{"audio":"./4_audio/22.mp3","hl":"grammar"}],[{"audio":"./4_audio/23.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k
