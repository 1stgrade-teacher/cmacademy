i>반려견(dog)으로 인해 가방이 찢어짐(tore)</li><li>새로 사려고 했으나 다시 생각함(thought again)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가치관 확립</div><ul><li>제로 웨이스트 삶을 위해 물건을 재사용하는 것이 중요함을 깨달았다.</li><li>제로 웨이스트 삶(zero-waste living)의 중요성 인식</li><li>물건을 새로 사지 않고 다시 쓰기로 결정함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천 및 결과</div><ul><li>서툰 솜씨지만 가방을 직접 수선하여 다시 사용하기로 했다.</li><li>수선(fix)을 시도함</li><li>바느질(sewing)에 서툴러 완벽해 보이진 않음</li><li>결과물에 만족하며 재사용을 실천함</li><li>핵심 키워드: 재사용(reuse), 수선(fix)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tear</td><td class=\"m\">찢다</td></tr><tr><td class=\"w\">reuse</td><td class=\"m\">재사용하다</td></tr><tr><td class=\"w\">zero-waste</td><td class=\"m\">쓰레기를 배출하지 않는</td></tr><tr><td class=\"w\">living</td><td class=\"m\">생활, 삶</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">고치다, 수리하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sew</td><td class=\"m\">바느질하다</td></tr><tr><td class=\"w\">be good at</td><td class=\"m\">~을 잘하다</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한</td></tr><tr><td class=\"w\">guess</td><td class=\"m\">생각하다, 추측하다</td></tr><tr><td class=\"w\">all right</td><td class=\"m\">괜찮은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 개가</span><span class=\"en\"><b>My dog</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찢었다</span><span class=\"en\"><b><span class=\"grammar-hl\">tore</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 가방을</span><span class=\"en\"><b>my bag.</b></span></div></div><div class=\"lec-sent-ko\">Domingo: 내 개가 내 가방을 찢었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도밍고가 자신의 가방이 훼손된 상황을 설명하며, 이 글의 소재인 &#39;가방&#39;과 그것을 처리해야 하는 상황을 처음 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tore 불규칙 동사: tear의 과거형으로 주어(My dog)의 행동을 나타내는 타동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 사고 싶었다</span><span class=\"en\"><b>I wanted <span class=\"grammar-hl\">to buy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">a new one</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 나는 생각했다</span><span class=\"en\"><b>but I thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시</span><span class=\"en\"><b>again.</b></span></div></div><div class=\"lec-sent-ko\">나는 새것을 사고 싶었지만, 다시 생각해 봤어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> thought again은 사전적으로 &#39;다시 생각하다&#39;이지만, 여기서는 익숙한 소비 방식(새것 구매)을 멈추고 다른 선택지를 고민하는 &#39;심사숙고&#39;의 과정을 의미합니다. 단순히 생각을 반복하는 것이 아니라, 환경을 위해 기존 관습에서 벗어나려는 변화의 첫 단계를 강조하려고 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to buy (to부정사): want(타동사)의 목적어로 쓰인 명사적 용법입니다. want+O+toV 구조를 취하며 여기서는 목적어 자리에 to부정사가 왔습니다.</div><div class=\"lec-gr-item\">a new one 대명사: 앞에 언급된 bag을 대신하며 one은 부정대명사로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 배웠다</span><span class=\"en\"><b>I learned</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재사용이 중요하다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that reusing is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제로 웨이스트 생활을 위해</span><span class=\"en\"><b>for <span class=\"grammar-hl\">zero-waste living</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 고민한 결과 도달한 깨달음을 나타내며, 왜 물건을 새로 사지 않고 수선하려 하는지에 대한 논리적 근거(환경적 가치)를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that reusing is important (명사절): learned(타동사)의 목적어 역할을 하는 that절입니다.</div><div class=\"lec-gr-item\">reusing (동명사): 문장에서 주어 역할을 하고 있으며 &#39;재사용하는 것&#39;이라는 명사적 개념을 나타냅니다.</div><div class=\"lec-gr-item\">zero-waste living (동명사): &#39;제로 웨이스트 생활&#39;이라는 용도를 나타내는 복합 명사적 표현으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">zero-waste</td><td class=\"m\">쓰레기를 배출하지 않는</td></tr><tr><td class=\"w\">living</td><td class=\"m\">생활, 삶</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 결심했다</span><span class=\"en\"><b>I decided</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 수선하기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 재사용하기로</span><span class=\"en\"><b>and <span class=\"grammar-hl\">reuse</span> it.</b></span></div></div><div class=\"lec-sent-ko\">그래서 나는 그것을 수선해서 재사용하기로 결심했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 깨달음(재사용의 중요성)을 바탕으로 도밍고가 구체적인 실천 행동인 &#39;수선&#39;을 결정했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to fix (to부정사): decide(타동사)의 목적어로 쓰인 명사적 용법입니다. 구조는 decide + to V 형태입니다.</div><div class=\"lec-gr-item\">reuse (to부정사): 앞에 있는 to fix와 병렬 구조를 이루며 decide에 연결되는 목적어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reuse</td><td class=\"m\">재사용하다</td></tr><tr><td class=\"w\">decide</td><td class=\"m\">결정하다</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">고치다, 수리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 아주 잘하지 못한다</span><span class=\"en\"><b>I’m not very good</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바느질을,</span><span class=\"en\"><b>at <span class=\"grammar-hl\">sewing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 생각하지 않는다</span><span class=\"en\"><b>and I don’t think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 가방이</span><span class=\"en\"><b><span class=\"grammar-hl\">that the bag</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완벽해 보인다고</span><span class=\"en\"><b><span class=\"grammar-hl\">looks perfect</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수선이 가져올 현실적인 한계(완벽하지 않은 결과물)를 인정하며, 재사용을 실천하는 과정이 쉽거나 화려하기만 한 것은 아님을 솔직하게 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sewing (동명사): 전치사 at의 목적어로 쓰인 명사적 기능입니다.</div><div class=\"lec-gr-item\">that the bag looks perfect (명사절): don&#39;t think(타동사)의 목적어 역할을 하는 that절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sew</td><td class=\"m\">바느질하다</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생각한다</span><span class=\"en\"><b>I guess</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괜찮다고</span><span class=\"en\"><b><span class=\"grammar-hl\">all right</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래도 괜찮은 것 같아.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> all right은 사전적으로 &#39;옳은/괜찮은&#39;이지만, 여기서는 완벽하지 않은 수선 결과물이라도 환경을 위한 실천이라는 점에서는 충분히 가치가 있다는 &#39;만족감&#39;을 나타냅니다. 완벽함보다 가치 있는 실천을 우선시한다는 화자의 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s all right (관용표현): &#39;괜찮다&#39;는 의미의 형용사적 보어 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guess</td><td class=\"m\">생각하다, 추측하다</td></tr><tr><td class=\"w\">all right</td><td class=\"m\">괜찮은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>도밍고는 강아지가 망가뜨린 가방을 보며 새것을 살지 고민했다.</li><li>환경을 생각하는 &#39;제로 웨이스트&#39; 실천을 위해 수선하기로 마음먹었다.</li><li>비록 바느질 솜씨가 부족해 완벽하진 않지만, 다시 사용할 수 있다는 점에 만족한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Domingo decided to repair his torn bag instead of buying a new one, as he realized that reusing items is essential for a zero-waste life.</div>\n              <div class=\"lec-final-sum-ko\">도밍고는 물건을 재사용하는 것이 제로 웨이스트 삶에 필수적임을 깨닫고, 새 가방을 사는 대신 찢어진 가방을 수리하기로 결심했다.</div><
