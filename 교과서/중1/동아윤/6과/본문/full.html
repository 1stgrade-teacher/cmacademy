">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 우리가 일상에서 흔히 말하는 제로 웨이스트(Zero-waste)란 단순히 쓰레기를 버리지 않는 것을 넘어, 자원의 소비를 줄이고 쓰레기 배출을 최소화하려는 라이프스타일을 의미해요. 특히 오늘 지문에 등장하는 핵심 개념인 3R 원칙(Reduce, Reuse, Recycle)은 자원 순환의 기본인데, 먼저 불필요한 소비를 줄이는 줄이기(Reduce), 물건을 고쳐 쓰거나 다시 활용하는 재사용(Reuse), 그리고 마지막으로 버려진 자원을 새로운 제품의 원료로 바꾸는 재활용(Recycle)의 과정을 말하죠. 우리가 매일 사용하는 일회용 플라스틱은 분해되는 데 수백 년이 걸릴 정도로 환경에 치명적인데, 이를 방지하기 위해 많은 국가에서 자원 순환(Resource Circulation) 시스템을 구축하고 있습니다. 마치 우리가 망가진 물건을 버리는 대신 수선해서 사용하는 것이 경제적이듯, 이러한 작은 실천들이 모이면 지구의 부담을 덜어주는 큰 변화를 만들어낼 수 있답니다. 여러분도 오늘부터 실천할 수 있는 작은 방법들을 고민하며 이 글을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>심각해지는 환경 문제를 해결하기 위해 제로 웨이스트 챌린지를 제안한다.</li><li>날로 병들어가는 지구(Earth)를 구하기 위한 노력</li><li>일상에서 발생하는 많은 쓰레기(waste) 줄이기</li><li>핵심 키워드: 제로 웨이스트 챌린지(Zero-waste challenge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02음식물 쓰레기 줄이기</div><ul><li>외식 후 남은 음식을 버리지 않고 창의적으로 활용한다.</li><li>식당에서 남은 음식(leftovers)을 포장해오기</li><li>다음 날 새로운 점심 식사로 재탄생시키기</li><li>핵심 키워드: 음식물 쓰레기(Food waste)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03재사용의 가치</div><ul><li>물건이 낡거나 망가졌을 때 바로 새로 사지 않고 고쳐 쓴다.</li><li>가방이 찢어졌을 때 버리는 대신 수선(fix)하기</li><li>완벽하지 않아도 다시 사용하는 것의 중요성 깨닫기</li><li>핵심 키워드: 재사용(Reuse)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04일회용 플라스틱 거부</div><ul><li>배달 음식 대신 다회용기를 직접 사용하여 플라스틱 배출을 막는다.</li><li>일회용 플라스틱(single-use plastic) 사용 안 하기</li><li>다회용기(reusable container)를 직접 들고 식당 방문하기</li><li>핵심 키워드: 일회용품(Disposable)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05재활용 실천</div><ul><li>분리배출을 생활화하고 이를 보상으로 연결한다.</li><li>빈 병과 플라스틱을 재활용 기계(recycling machine)에 넣기</li><li>재활용 실천을 통해 얻은 포인트(points)를 현금처럼 활용하기</li><li>핵심 키워드: 재활용(Recycle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 병든</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전</td></tr><tr><td class=\"w\">share</td><td class=\"m\">공유하다, 나누다</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 감소시키다</td></tr><tr><td class=\"w\">eat out</td><td class=\"m\">외식하다</td></tr><tr><td class=\"w\">leftover</td><td class=\"m\">남은 음식</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">FYI</td><td class=\"m\">참고로 (for your information)</td></tr><tr><td class=\"w\">reuse</td><td class=\"m\">재사용하다</td></tr><tr><td class=\"w\">tear</td><td class=\"m\">찢다</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">고치다, 수리하다</td></tr><tr><td class=\"w\">sew</td><td class=\"m\">바느질하다</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한</td></tr><tr><td class=\"w\">delivery</td><td class=\"m\">배달</td></tr><tr><td class=\"w\">reusable</td><td class=\"m\">재사용 가능한</td></tr><tr><td class=\"w\">container</td><td class=\"m\">용기, 그릇</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">참여하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Join</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제로 웨이스트 챌린지에</span><span class=\"en\"><b>the Zero-Waste Challenge</b></span></div></div><div class=\"lec-sent-ko\">제로 웨이스트 챌린지에 동참하세요</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리의 일상적인 쓰레기 배출 행위가 지구 환경을 악화시키고 있다는 문제 상황을 제시하며 글을 시작합니다. 여기서 sicker는 단순히 질병에 걸린 상태가 아니라, 인간이 버린 쓰레기로 인해 지구가 회복 불가능한 정도로 오염되고 있다는 것을 강조하기 위해 &#39;병들다&#39;라는 비유적 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Join (명령문): 동사원형으로 시작하여 상대방에게 행동을 요청하거나 지시하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>Every day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 배출하고</span><span class=\"en\"><b>we produce</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 쓰레기를</span><span class=\"en\"><b>lots of waste,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구는</span><span class=\"en\"><b>and the Earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 아파지고 있습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is getting sicker and sicker</span>.</b></span></div></div><div class=\"lec-sent-ko\">매일 우리는 많은 양의 쓰레기를 생산하고, 지구는 점점 더 병들고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리의 일상적인 쓰레기 배출 행위가 지구 환경을 악화시키고 있다는 문제 상황을 제시하며 글을 시작합니다. 여기서 sicker는 단순히 질병에 걸린 상태가 아니라, 인간이 버린 쓰레기로 인해 지구가 회복 불가능한 정도로 오염되고 있다는 것을 강조하기 위해 &#39;병들다&#39;라는 비유적 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is getting sicker and sicker (현재진행): be동사(is)+현재분사(getting) 구조로 상태가 점점 변화하고 있음을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 병든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 원하나요</span><span class=\"en\"><b>Do you want <span class=\"grammar-hl\">to save</span> the Earth?</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 구하는 것을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">지구를 구하고 싶나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 문제 상황(지구의 병듦)을 해결하기 위한 관심을 독자에게 유도하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to save (to부정사): want의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제로 웨이스트 챌린지에 참여하고</span><span class=\"en\"><b><span class=\"grammar-hl\">join</span> the zero-waste challenge,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 이야기를 공유하세요.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">share</span> your stories.</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 제로 웨이스트 챌린지에 동참하고 당신의 이야기를 공유해 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호라는 거창한 목표를 실천하기 위한 구체적인 대안으로 &#39;챌린지&#39;와 &#39;경험 공유&#39;를 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">join (명령문): 동사원형으로 시작하여 청자에게 특정 행동을 권유하는 구조입니다.</div><div class=\"lec-gr-item\">share (명령문): 앞의 join과 등위접속사 and로 연결된 동사원형입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class= nd picked up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식을</span><span class=\"en\"><b>the food.</b></span></div></div><div class=\"lec-sent-ko\">대신에, 재사용 가능한 용기를 가지고 내가 가장 좋아하는 식당으로 걸어가서 음식을 가져왔어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 배달 대신 다회용기를 선택함으로써 환경을 보호하는 구체적인 실천 방법을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reusable 형용사: reusable(재사용 가능한)이 container를 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reusable</td><td class=\"m\">재사용 가능한</td></tr><tr><td class=\"w\">container</td><td class=\"m\">용기, 그릇</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 20 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 들었습니다</span><span class=\"en\"><b>I heard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱이</span><span class=\"en\"><b>that plastic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라지지 않는다고</span><span class=\"en\"><b>never <span class=\"grammar-hl\">goes away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히</span><span class=\"en\"><b>completely.</b></span></div></div><div class=\"lec-sent-ko\">나는 플라스틱은 절대로 완전히 없어지지 않는다고 들었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 일회용 플라스틱을 거부해야 하는지에 대한 과학적/환경적 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">goes away (관용표현): &#39;사라지다&#39;라는 뜻의 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 사용하지 않았습니다</span><span class=\"en\"><b>I <span cl span class=\"ko\">그 포인트로</span><span class=\"en\"><b>with those points?</b></span></div></div><div class=\"lec-sent-ko\">그 포인트로 뭘 할 수 있냐고?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 호기심을 유발하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can I do (간접의문문): 의문사가 포함된 문장으로 주어와 동사의 위치가 도치된 직접 의문문 형식입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음,</span><span class=\"en\"><b>Well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그것들을 사용할 수 있습니다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">can use</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈처럼</span><span class=\"en\"><b>like money.</b></span></div></div><div class=\"lec-sent-ko\">음, 나는 포인트를 돈처럼 사용할 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재활용의 경제적 이점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can use (조동사): 가능을 나타내는 can과 일반동사 use가 결합했습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 27</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">생각하지 않나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 멋지다고</span><span class=\"en\"><b>that’s cool?</b></span></div></div><div class=\"lec-sent-ko\">멋지다고 생각하지 않니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 재활용 참여를 권유하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t you think (도치): 부정 의문문 형식으로, 주어(you) 앞에 조동사(Do)가 위치하는 일반적인 의문문 어순을 따릅니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지구 환경이 악화되는 상황에서 환경 보호를 위한 &#39;제로 웨이스트 챌린지&#39;가 필요하다.</li><li>음식물 쓰레기 줄이기, 물건 재사용하기, 일회용 플라스틱 거부하기, 재활용하기라는 4가지 실천 방안을 제시한다.</li><li>각 사례를 통해 작고 사소한 실천이 지구를 살리고 개인에게도 보람을 준다는 것을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Various individuals share their daily efforts to save the environment, and they encourage others to practice sustainable habits in their own lives.</div>\n              <div class=\"lec-final-sum-ko\">다양한 사람들이 환경을 보호하기 위해 실천하는 일상적 노력을 공유하며, 다른 이들에게도 자신의 삶에서 지속 가능한 습관을 실천하도록 독려한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],[{"audio":"./full_audio/19.mp3","hl":"main"},{"audio":"./full_audio/20.mp3","hl":"meaning"},{"audio":"./full_audio/21.mp3","hl":"grammar"}],[{"audio":"./full_audio/22.mp3","hl":"main"},{"audio":"./full_audio/23.mp3","hl":"meaning"},{"audio":"./full_audio/24.m
