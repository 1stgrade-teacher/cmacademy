<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(윤) 6과 본문 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(윤) 6과 본문","audioDir":"full_audio","preview":false,"count":81,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.684em\">중1\u003cbr>동아(윤)\u003cbr>6과 본문\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>The Zero-Waste Challenge: Four Ways to Save the Earth\u003c/h1>\u003ch2>제로 웨이스트 챌린지: 지구를 구하는 네 가지 실천\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>매일 많은 쓰레기로 지구가 병들고 있는 가운데, 저자는 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b>에 동참해 자신의 이야기를 공유하자고 제안합니다. Olivia, Domingo, Emma, Minsu가 각각 \u003cb class=\"key\">음식물 \u003c/b>\u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>, 재사용, 일회용 플라스틱 거부, 재활용을 실천한 사례를 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Join the zero-waste challenge and practice reducing food waste, reusing things, refusing single-use plastic, and recycling to save the Earth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 제로 웨이스트 챌린지에 관한 글이에요. 매일 쏟아지는 쓰레기로 지구가 병들고 있는 상황에서, 저자는 제로 웨이스트 챌린지에 동참하고 자신의 이야기를 공유하자고 제안하고 있죠. 요지를 한마디로 말하면, 줄이기와 재사용하기, 일회용 플라스틱 거부하기, 재활용하기라는 네 가지 실천으로 지구를 구하자는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 매일 버리는 쓰레기는 \u003cb class=\"key\">매립지\u003c/b>(landfill)로 가거나 소각장에서 태워집니다. 특히 플라스틱은 잘 분해되지 않아 수백 년 동안 환경에 남아 \u003cb class=\"key\">미세플라스틱\u003c/b>(microplastic)으로 생태계를 위협하죠. 그래서 등장한 개념이 바로 쓰레기 자체를 만들지 말자는 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트\u003c/b>(zero-waste) 운동입니다. 제로 웨이스트는 크게 줄이기(reduce), 재사용하기(reuse), 일회용 거부하기(refuse), 재활용하기(recycle) 네 가지로 실천합니다. 마치 방을 치울 때 물건을 무작정 버리는 게 아니라 자리를 다시 잡아 주는 것과 비슷하죠. 이렇게 작은 습관 하나하나가 모이면 지구는 다시 건강해질 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 우리가 매일 버리는 쓰레기는 매립지로 가거나 소각장에서 태워지는데, 특히 플라스틱은 잘 분해되지 않아 수백 년 동안 환경에 남아요. 이 과정에서 잘게 부서진 미세플라스틱이 생태계를 위협하기도 하죠. 그래서 등장한 개념이 바로 제로 웨이스트, 즉 쓰레기 자체를 만들지 말자는 운동이에요. 제로 웨이스트는 크게 줄이기, 재사용하기, 일회용 거부하기, 재활용하기 네 가지로 실천해요. 방을 치울 때 물건을 무작정 버리는 게 아니라 자리를 다시 잡아 주는 것과 비슷하다고 생각하면 이해하기 쉬울 거예요. 이런 작은 습관이 모이면 지구가 다시 건강해질 수 있다는 게 이 글의 바탕이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>지구의 경고\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>매일 우리가 많은 \u003cb class=\"key\">쓰레기\u003c/b>를 만들어 내고, 그 결과 \u003cb class=\"key\">지구\u003c/b>가 점점 더 병들고 있다는 문제를 제기합니다. 이 한 문장이 글 전체의 출발점이자 배경이 됩니다. 'getting sicker and sicker'라는 표현으로 상황이 갈수록 나빠지고 있음을 강조하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>해결책 제안\u003csmall>전환·주장 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>'Do you want to save the Earth?'라는 \u003cb class=\"key\">질문\u003c/b>으로 독자의 관심을 끌고, 'Then'을 신호로 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b>에 동참하라고 제안합니다. 자신의 이야기를 공유하라는 말은 독자를 수동적 관찰자가 아니라 실천자로 초대하는 표현입니다. 이 두 문장이 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실천 사례 1·2\u003csmall>예시 · 문장 4–13\u003c/small>\u003c/h4>\u003cp>첫 번째 챌린지는 \u003cb class=\"key\">음식물 \u003c/b>\u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>로, Olivia가 외식 후 남은 음식을 집에 가져와 다음 날 점심으로 활용한 이야기를 들려줍니다. 두 번째는 \u003cb class=\"key\">재사용\u003c/b>으로, Domingo가 개가 찢은 가방을 새로 사지 않고 직접 수선해 다시 쓴 경험을 소개합니다. 두 사례 모두 작은 결심과 실천을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실천 사례 3·4\u003csmall>예시·결론 · 문장 14–23\u003c/small>\u003c/h4>\u003cp>세 번째 챌린지는 \u003cb class=\"key\">일회용 \u003c/b>\u003cb class=\"key\">플라스틱\u003c/b> 거부로, Emma가 배달 대신 재사용 용기를 가지고 식당에 가서 음식을 받아 온 하루를 전합니다. 네 번째는 \u003cb class=\"key\">재활용\u003c/b>으로, Minsu가 플라스틱과 유리병을 재활용 기계에 넣고 받은 포인트를 돈처럼 쓸 수 있다고 말합니다. 네 사람의 사례가 앞에서 제시한 제안을 구체적으로 뒷받침합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 지구의 경고예요. 매일 우리가 많은 쓰레기를 만들고, 그 결과 지구가 점점 더 병들고 있다는 문제를 제기하죠. getting sicker and sicker라는 표현에서 상황이 갈수록 나빠지고 있다는 뉘앙스를 꼭 느껴 보세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 해결책을 제시해요. Do you want to save the Earth라는 질문으로 독자의 관심을 끌고, Then을 신호로 제로 웨이스트 챌린지에 동참하라고 말하죠. 그리고 여러분의 이야기를 공유해 달라고 하면서 독자를 실천의 주인공으로 초대해요. 이 두 문장이 글 전체의 주제문 역할을 한다는 점도 기억해 두세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 실천 사례의 앞부분이에요. 첫 번째 챌린지는 음식물 쓰레기 줄이기로, Olivia가 외식하고 남은 음식을 집에 가져와 다음 날 점심으로 활용한 이야기를 들려줘요. 두 번째 챌린지는 재사용으로, Domingo가 개가 찢은 가방을 새로 사지 않고 직접 수선해서 다시 쓴 경험을 소개하죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 나머지 실천 사례예요. 세 번째 챌린지는 일회용 플라스틱 거부로, Emma가 배달 대신 재사용 용기를 챙겨 식당에 가서 음식을 받아 온 하루를 전해요. 네 번째 챌린지는 재활용으로, Minsu가 플라스틱과 유리병을 재활용 기계에 넣고 받은 포인트를 돈처럼 쓸 수 있다고 말하죠. 이 네 사례가 앞에서 던진 제안을 구체적으로 뒷받침해 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 쓰레기 문제로 지구가 병들고 있다고 \u003cb class=\"key\">문제\u003c/b>를 제기하고, 곧바로 제로 웨이스트 챌린지에 참여하자는 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 이후 네 명의 사례가 그 해결책을 하나씩 구체화하는 \u003cb class=\"key\">예시\u003c/b>로 이어지죠. 핵심 주장이 글 앞부분에서 먼저 나오므로 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (3)\u003c/b>\u003cspan>전환·해결책 제시\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>Instead (15)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">save the Earth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">zero-waste challenge\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">zero-waste living\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결이에요. 처음에 쓰레기 문제로 지구가 병들고 있다고 문제를 던지고, 바로 뒤에서 제로 웨이스트 챌린지라는 해결책을 제시하죠. 그리고 그 해결책을 네 사람의 사례로 하나씩 보여 줍니다. 주제문이 글 앞부분에 나오는 두괄식 구조라는 점도 꼭 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보면 구조가 더 잘 보여요. 세 번째 문장의 Then은 앞의 문제를 받아 해결책으로 넘어가는 전환이에요. 아홉 번째 문장의 but은 새것을 사고 싶은 마음과 다시 생각하는 태도를 대조시키고, 열한 번째 문장의 So는 그 결심의 결과를 이끌어 내죠. 열다섯 번째 문장의 Instead는 배달 대신 걸어갔다는 대조를 만들어 주고, 이런 어휘들이 글의 방향을 잡아 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기, 폐기물\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>병든, 아픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다, 동참하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도전, 챌린지\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>외식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leftover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>남은 음식\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>FYI\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>참고로(for your information)\u003c/span>\u003c/div>\u003cdiv>\u003cb>reuse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찢다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다, 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수선하다, 고치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sewing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바느질\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>single-use\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일회용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>delivery service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배달 서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>reusable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재사용할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>container\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기, 그릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가져오다, 집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>recycle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재활용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in return\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대가로, 보답으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>point\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포인트, 점수\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. produce는 만들다, waste는 쓰레기라는 뜻이고, reduce는 줄이다, reuse는 재사용하다예요. single-use는 일회용의, container는 용기, in return은 대가로라는 의미로 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">produce\u003c/b>\u003cspan class=\"m\">만들다, 생산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">consume\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">쓰레기, 폐기물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">garbage\u003c/span>\u003cspan class=\"s\">trash\u003c/span>\u003cspan class=\"s\">rubbish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">cut down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">join\u003c/b>\u003cspan class=\"m\">참여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">participate in\u003c/span>\u003cspan class=\"s\">take part in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">quit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reuse\u003c/b>\u003cspan class=\"m\">재사용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">repurpose\u003c/span>\u003cspan class=\"s\">recycle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">throw away\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">completely\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"s\">fully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. produce는 create, make와 비슷하고 destroy와는 반대예요. waste는 garbage, trash와 같은 뜻이고, save는 rescue, protect와 가깝지만 destroy와는 반대죠. reduce는 decrease, lessen과 동의어이고 increase와 반대돼요. join은 participate in, take part in으로 바꿔 쓸 수 있고 leave와는 반대예요. reuse는 repurpose, recycle과 비슷하게 쓰이고 discard와는 반대라는 것도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">Every day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 많은 쓰레기를 만들고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">produce\u003c/span> lots of waste,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 지구는\u003c/span>\u003cspan class=\"en\">and the Earth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 병들고 있습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">getting\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sicker \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sicker\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쓰레기를 매일 많이 만들수록 \u003cb class=\"key\">지구\u003c/b>가 \u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">병들고\u003c/b> 있다는 비유로 문제의 심각성을 환기하는 도입 문장이에요. 뒤에서 제로 웨이스트 챌린지를 제안하기 위해 먼저 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 자연스럽게 꺼내는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제(일반적 사실)\u003c/span> : [주어] + [동사원형] + [목적어] : \"우리는 만듭니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [주어] + is + [현재분사] : \"점점 되어 가고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : [비교급] + and + [비교급] : \"점점 더 병들고 병들고\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Every day, 매일. we produce lots of waste, 우리는 많은 쓰레기를 만들고. and the Earth, 그리고 지구는. is getting sicker and sicker, 점점 더 병들고 있습니다.. 이 문장 전체를 해석하면, 매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 매일 쓰레기를 많이 만들수록 지구가 점점 더 병들고 있다는 비유로 환경 문제의 심각성을 알려 줘요. 그래서 뒤에서 제로 웨이스트 챌린지를 제안하기 위한 도입 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 현재시제예요. 매일 반복되는 일반적 사실이라서 we produce처럼 동사원형을 씁니다. 두 번째 포인트는 현재진행형이에요. 지구가 지금 계속 변화하는 중이라는 뜻이라서 is getting을 써요. 세 번째 포인트는 비교급 and 비교급이에요. sicker and sicker처럼 비교급을 and로 연결하면 점점 더 병들고 병들고라는 점진적 변화를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 원하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구를 구하기를?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">save\u003c/span> the Earth?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 지구를 구하고 싶나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던져 관심을 끌고, 이어질 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트\u003c/b> 실천으로 자연스럽게 이끄는 문장이에요. want to save라는 표현으로 \u003cb class=\"key\">지구를 \u003c/b>\u003cb class=\"key\">구하고 \u003c/b>\u003cb class=\"key\">싶은 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 직접 확인하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 do의 의문문\u003c/span> : Do + [주어] + [동사원형]? : \"여러분은 원하나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : want + [to부정사(목적어)] : \"구하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Do you want, 여러분은 원하나요. to save the Earth?, 지구를 구하기를?. 이 문장 전체를 해석하면, 여러분은 지구를 구하고 싶나요?","hl":"m"},{"n":16,"text":"이 문장은 독자에게 질문을 던져 관심을 끌고, 이어질 제로 웨이스트 실천으로 자연스럽게 이끌어요. want to save라는 표현으로 지구를 구하고 싶은 마음을 직접 확인하는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 조동사 do의 의문문이에요. 일반동사 want의 의문문이라서 조동사 do를 문장 앞에 두고 주어 you 뒤에 동사원형 want를 씁니다. 두 번째 포인트는 to부정사의 명사적 용법이에요. want 뒤에는 하고 싶은 행동을 목적어로 두는데, 이때 동사원형 앞에 to를 붙인 to부정사를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제로 웨이스트 챌린지에 동참하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">join\u003c/span> the zero-waste challenge,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여러분의 이야기를 공유해 주세요.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">share\u003c/span> your stories.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 \u003cb class=\"key\">대답\u003c/b>으로, 독자에게 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b> 참여와 경험 공유를 요청하는 문장이에요. 이후 각 챌린지 사례를 소개하는 글의 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">지시문\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + [목적어] : \"동참하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and로 연결된 명령문 병렬\u003c/span> : [명령문] + and + [명령문] : \"공유해 주세요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Then, 그렇다면. join the zero-waste challenge, 제로 웨이스트 챌린지에 동참하고. and share your stories, 그리고 여러분의 이야기를 공유해 주세요.. 이 문장 전체를 해석하면, 그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.","hl":"m"},{"n":19,"text":"이 문장은 앞의 질문에 대한 대답으로, 독자에게 제로 웨이스트 챌린지 참여와 경험 공유를 요청해요. 그래서 뒤에 이어지는 각 챌린지 사례를 소개하는 글의 도입 지시문 역할을 하죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 명령문이에요. 상대에게 행동을 요청할 때는 주어 you를 생략하고 동사원형으로 문장을 시작합니다. 두 번째 포인트는 and로 연결된 명령문 병렬이에요. join과 share 두 행동을 and로 이어서 둘 다 하라는 병렬 명령문이고, share도 앞의 join과 똑같이 동사원형으로 시작하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">챌린지 01 음식물 쓰레기를 줄이세요\u003c/span>\u003cspan class=\"en\">Challenge 01 Reduce Food Waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Olivia: 내 생일은 지난 토요일이었고,\u003c/span>\u003cspan class=\"en\">Olivia: My birthday \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">Saturday\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\ 쓴 것도 꼭 기억하세요. 마지막으로 ate out은 외식을 하다라는 관용 표현 eat out의 과거형이에요. eat은 불규칙 동사라서 과거형이 ate가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남은 음식이 많았어,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">lots \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">leftovers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 우리는 그것들을 집으로 가져왔어.\u003c/span>\u003cspan class=\"en\">but we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brought\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">them\u003c/span> home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남은 음식이 많아서 우리는 그것들을 집으로 가져왔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 외식하고 남은 음식을 버리지 않고 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">가져왔다\u003c/b>는 내용이에요. 앞 문장의 외식 이야기를 이어 받아 \u003cb class=\"key\">음식물 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>를 줄이는 실천을 보여 주는 부분이죠. there were는 '~이 있었다'라는 뜻으로 남은 음식이 많았음을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] : \"남은 음식이 많이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형\u003c/span> : bring [동사] → 과거형 brought : \"가져왔어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 대명사\u003c/span> : 동사 + [목적격 대명사] : \"그것들을\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"There were lots of leftovers, 남은 음식이 많았어. but we brought them home, 그러나 우리는 그것들을 집으로 가져왔어.. 이 문장 전체를 해석하면, 남은 음식이 많아서 우리는 그것들을 집으로 가져왔어.","hl":"m"},{"n":25,"text":"외식하고 남은 음식을 버리지 않고 집으로 가져왔다는 내용이에요. 앞 문장의 외식 이야기를 이어 받아서 음식물 쓰레기를 줄이는 실천을 보여 주는 부분이죠.","hl":"mn"},{"n":26,"text":"먼저 There were lots of leftovers를 보세요. there를 유도부사로 먼저 쓰고, be동사 뒤에 진짜 주어를 놓는 구문이에요. 주어 leftovers가 복수라서 were를 쓴 거죠. 다음으로 brought는 bring의 과거형이에요. bring은 불규칙 동사라서 과거형이 brought가 돼요. 마지막으로 them은 앞에 나온 leftovers를 다시 말하지 않고 받은 목적격 대명사예요. 동사 brought의 목적어 자리라서 목적격을 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그다음 날,\u003c/span>\u003cspan class=\"en\">The next day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 맛있는 점심을 만들었어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> a nice lunch\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그다음 날, 나는 그것들로 맛있는 점심을 만들었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그다음 날 남은 음식으로 \u003cb class=\"key\">점심을 \u003c/b>\u003cb class=\"key\">만들었다\u003c/b>는 내용이에요. 음식을 그대로 버리지 않고 다시 \u003cb class=\"key\">활용\u003c/b>한 구체적인 예로, 첫 번째 챌린지의 핵심 실천을 마무리하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형\u003c/span> : make [동사] → 과거형 made : \"만들었어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재료를 나타내는 전치사구(make A out of B)\u003c/span> : make + [목적어 A] + out of + [재료 B] : \"그것들로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The next day, 그다음 날. I made a nice lunch, 나는 맛있는 점심을 만들었어. out of them, 그것들로.. 이 문장 전체를 해석하면, 그다음 날, 나는 그것들로 맛있는 점심을 만들었어.","hl":"m"},{"n":28,"text":"그다음 날 남은 음식으로 맛있는 점심을 만들었다는 내용이에요. 음식을 그대로 버리지 않고 다시 활용한 구체적인 예로, 첫 번째 챌린지의 핵심 실천을 마무리하죠.","hl":"mn"},{"n":29,"text":"먼저 made는 make의 과거형이에요. make도 불규칙 동사라서 과거형이 made가 돼요. 다음으로 out of them을 보세요. make A out of B는 B로 A를 만들다라는 구문인데, 여기서는 them, 즉 남은 음식이 재료가 된 거예요. 그래서 out of them이 그것들로라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참고로,\u003c/span>\u003cspan class=\"en\">FYI,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 찾을 수 있어\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 요리 아이디어를\u003c/span>\u003cspan class=\"en\">great cooking ideas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남은 음식을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">leftovers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인터넷에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Internet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 남은 음식을 활용하는 \u003cb class=\"key\">팁\u003c/b>을 전하는 부분이에요. 남은 음식으로 무엇을 만들지 고민될 때 \u003cb class=\"key\">인터넷\u003c/b>에서 요리 아이디어를 찾아보라고 권하는 거죠. \u003cb class=\"key\">FYI\u003c/b>는 for your information의 줄임말로 '참고로'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (가능)\u003c/span> : [주어] + can + [동사원형] (~할 수 있다) : \"찾을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (대상)\u003c/span> : [명사] + for + [명사] (…을 위한) : \"남은 음식을 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (장소·수단)\u003c/span> : on + the Internet (인터넷에서) : \"인터넷에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"FYI, 참고로. you can find, 너는 찾을 수 있어. great cooking ideas, 멋진 요리 아이디어를. for leftovers, 남은 음식을 위한. on the Internet, 인터넷에서. 이 문장 전체를 해석하면, 참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.","hl":"m"},{"n":31,"text":"이 문장은 Olivia가 남은 음식을 활용하는 팁을 알려 주는 부분이에요. 남은 음식으로 무엇을 만들지 고민될 때 인터넷에서 요리 아이디어를 찾아보라고 권하는 거죠. FYI는 for your information의 줄임말로 참고로 라는 뜻이에요.","hl":"mn"},{"n":32,"text":"어법 포인트를 짚어 볼게요. 첫 번째로, can find에서 can은 조동사예요. can 뒤에는 동사원형이 와서 찾을 수 있다는 가능의 뜻을 만들어요. 두 번째로, for leftovers의 for는 대상을 나타내는 전치사예요. 아이디어가 향하는 대상이 남은 음식이라는 걸 알려 주죠. 세 번째로, on the Internet은 인터넷에서라는 장소와 수단의 표현이에요. 그리고 FYI가 for your information의 줄임말이라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">챌린지 02, 재사용하세요\u003c/span>\u003cspan class=\"en\">Challenge 02 \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reuse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도밍고:\u003c/span>\u003cspan class=\"en\">Domingo:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 개가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">dog\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\" u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새것 하나를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 다시 생각해 봤어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> I thought again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 새것을 사고 싶었지만, 다시 생각해 봤어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Domingo는 처음에는 새 가방을 \u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">싶었지만\u003c/b>, 곧바로 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">생각\u003c/b>했어요. 이 문장은 뒤에서 가방을 고쳐 다시 쓰기로 한 \u003cb class=\"key\">결정\u003c/b>의 이유가 되어 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">want + to부정사 (목적어)\u003c/span> : [주어] + want + [to부정사] (~하고 싶다) : \"사고 싶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사 one\u003c/span> : a new + one (앞에 나온 셀 수 있는 명사 대신) : \"새것 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 but (대조)\u003c/span> : [문장] + but + [문장] (그러나, 하지만) : \"그러나, 하지만\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I wanted to buy, 나는 사고 싶었어. a new one, 새것 하나를. but I thought again, 하지만 다시 생각해 봤어. 이 문장 전체를 해석하면, 나는 새것을 사고 싶었지만, 다시 생각해 봤어.","hl":"m"},{"n":37,"text":"Domingo는 처음에는 새 가방을 사고 싶었어요. 그런데 잠시 다시 생각해 봤다는 거죠. 이 문장은 뒤에 나오는 가방을 고쳐서 다시 쓰기로 한 결정의 이유를 만들어 주는 중요한 부분이에요.","hl":"mn"},{"n":38,"text":"어법 포인트를 짚어 볼게요. 첫 번째로, wanted to buy에서 want 뒤에 to부정사가 와서 사고 싶었다는 바람을 나타내요. 두 번째로, a new one의 one은 앞에 나온 bag을 반복하지 않으려고 쓴 부정대명사예요. 세 번째로, but은 앞뒤를 반대로 이어 주는 등위접속사예요. 사고 싶었던 마음과 다시 생각한 태도가 대조되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 배웠어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">learned \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재사용이 중요하다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reusing \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제로 웨이스트 생활에\u003c/span>\u003cspan class=\"en\">for zero-waste living.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도밍고가 가방을 새로 사지 않고 수선하기로 마음먹은 까닭을 알려 주는 문장이에요. 앞에서 가방이 찢어져 새것을 사고 싶었지만, \u003cb class=\"key\">재사용\u003c/b>이 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">생활\u003c/b>에서 얼마나 중요한지 깨달았다는 흐름을 만듭니다. 바로 다음 문장의 결심으로 이어지는 이유가 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : learn [타동사] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"재사용이 중요하다는 것을 배웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 주어(단수 취급)\u003c/span> : [동명사(~ing)] + 단수 동사(is) : \"재사용은 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"I learned, 나는 배웠어. that reusing is important, 재사용이 중요하다는 것을. for zero-waste living, 제로 웨이스트 생활에. 이 문장 전체를 해석하면, 나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어.","hl":"m"},{"n":40,"text":"이 문장은 도밍고가 왜 가방을 새로 사지 않았는지 그 이유를 알려 줘요. 바로 재사용이 제로 웨이스트 생활에서 아주 중요하다는 걸 배웠기 때문이죠. 그래서 다음 문장에서 가방을 고치겠다는 결심이 자연스럽게 이어집니다.","hl":"mn"},{"n":41,"text":"먼저 learned 뒤에 that이 나오면서 그 뒤 문장 전체가 목적어 역할을 해요. 재사용이 중요하다는 것, 이렇게 덩어리로 해석하면 됩니다. 그리고 reusing은 동명사인데요. 동명사가 주어로 쓰이면 단수로 취급해서 is를 써요. 그래서 reusing is important라고 하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것을 수선하기로 결심했어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 재사용하기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">reuse \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 나는 그것을 수선해서 재사용하기로 결심했어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 배운 \u003cb class=\"key\">재사용\u003c/b>의 중요성을 실제 행동으로 옮기는 문장이에요. 새로 사려던 마음을 바꿔 가방을 \u003cb class=\"key\">수선\u003c/b>해서 다시 쓰기로 한 도밍고의 \u003cb class=\"key\">결심\u003c/b>을 보여 줍니다. 제로 웨이스트 실천의 구체적인 예가 되는 대목이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide [타동사] + [to + 동사원형 (to부정사구/목적어)] : \"그것을 수선하기로 결심했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : [to + 동사원형] and [(to) + 동사원형] : \"그것을 수선하고 재사용하다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"So, 그래서. I decided to fix it, 나는 그것을 수선하기로 결심했어. and reuse it, 그리고 그것을 재사용하기로. 이 문장 전체를 해석하면, 그래서 나는 그것을 수선해서 재사용하기로 결심했어.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 배운 재사용의 중요성을 실제 행동으로 옮긴 부분이에요. 새로 사려던 마음을 바꿔서 가방을 수선해 다시 쓰기로 한 도밍고의 결심을 보여 주죠. 제로 웨이스트를 말로만이 아니라 행동으로 실천한 셈입니다.","hl":"mn"},{"n":44,"text":"먼저 decide 뒤에 to fix가 왔어요. 결심하다라는 동사 뒤에는 to부정사가 와서 무엇을 하기로 결심했는지를 나타냅니다. 그리고 to fix it and reuse it에서 fix와 reuse가 and로 나란히 연결되어 있어요. 같은 to부정사가 and로 이어지는 병렬 구조라서 두 번째 to는 생략하고 reuse it만 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 바느질을 아주 잘하지 못해,\u003c/span>\u003cspan class=\"en\">I'm not very \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">sewing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 생각하지 않아\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가방이 완벽해 보인다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bag \u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">perfect\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바느질이 능숙하지 않아 결과물이 완벽하지는 않지만 그래도 괜찮다고 스스로 받아들이는 문장이에요. 완벽하지 않아도 \u003cb class=\"key\">재사용\u003c/b> 자체에 의미가 있다는 제로 웨이스트의 \u003cb class=\"key\">태도\u003c/b>를 보여 줍니다. 다음 문장의 '괜찮아'라는 말로 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be good at + 동명사\u003c/span> : be good at + [동명사(~ing)] : \"바느질을 잘하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정어의 전이(think 동사의 부정)\u003c/span> : I don't think + [that + 주어 + 동사 ~] : \"가방이 완벽해 보인다고 생각하지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"I'm not very good at sewing, 나는 바느질을 아주 잘하지 못해. and I don't think, 그리고 나는 생각하지 않아. that the bag looks perfect, 가방이 완벽해 보인다고. 이 문장 전체를 해석하면, 나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아.","hl":"m"},{"n":46,"text":"이 문장은 바느질이 능숙하지 않아서 결과물이 완벽하지는 않지만 그래도 괜찮다고 스스로 받아들이는 부분이에요. 완벽하지 않아도 재사용 자체에 의미가 있다는 제로 웨이스트의 태도를 보여 주죠. 그래서 다음 문장에서 괜찮다고 말하게 됩니다.","hl":"mn"},{"n":47,"text":"먼저 be good at 뒤에 sewing이라는 동명사가 왔어요. 전치사 at 뒤에는 명사가 와야 해서 동사 sew가 동명사 sewing으로 바뀐 겁니다. 그리고 I don't think that이라고 해서 부정을 앞으로 옮겼어요. 영어에서는 think 뒤 내용을 부정할 때 주절에 not을 붙이는 게 자연스러워서, 가방이 완벽해 보인다고 생각하지 않는다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~인 것 같아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">guess \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">괜찮은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래도 괜찮은 것 같아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 Domingo는 바느질을 잘하지 못해 가방이 완벽하지 않다고 말했죠. 그래서 완벽하지는 않아도 \u003cb class=\"key\">괜찮다\u003c/b>고 스스로 받아들이는 문장이에요. \u003cb class=\"key\">I \u003c/b>\u003cb class=\"key\">guess\u003c/b>는 확신은 없지만 그렇게 생각한다는 뜻으로, '아마 ~인 것 같아'라고 부드럽게 말할 때 써요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적절)\u003c/span> : I guess + [(that) + 주어 + 동사 ~] : \"나는 그것이 괜찮다고 생각해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">it is의 축약형과 대명사 it\u003c/span> : it(대명사) + is(be동사) → it's : \"그것은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"I guess, 나는 ~인 것 같아. it's, 그것은 ~이야. all right, 괜찮은. 이 문장 전체를 해석하면, 그래도 괜찮은 것 같아.","hl":"m"},{"n":49,"text":"이 문장은 앞에서 가방을 직접 고친 Domingo의 마음을 대신 표현해 줘요. 완벽하지는 않아도 스스로 괜찮다고 받아들이는 따뜻한 마무리죠. I guess는 확신은 없지만 그렇게 생각한다는 뜻이라서, 아마 괜찮은 것 같아 정도로 부드럽게 해석해요.","hl":"mn"},{"n":50,"text":"첫 번째로, I guess 뒤에는 접속사 that이 생략되어 있어요. that it's all right에서 that이 사라진 형태로, 생각이나 판단을 담는 목적절이 이어지는 구조예요. 두 번째로, it's는 it is의 줄임말이고, 여기서 it은 앞에 나온 가방이나 상황 전체를 가리키는 대명사예요. 그래서 주어를 다시 쓰지 않고도 바로 이어 말할 수 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">챌린지 03\u003c/span>\u003cspan class=\"en\">Challenge 03\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일회용 플라스틱 사용을 반대하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Say \u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Single-Use \u003c/span>\u003cspan class=\"tgt\">Plastic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엠마:\u003c/span>\u003cspan class=\"en\">Emma:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 종종 음식 배달 서비스를 이용하는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">delivery \u003c/span>\u003cspan class=\"tgt\">services\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘은 이용하지 않았어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">today \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">didn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">챌린지 03 / 일회용 플라스틱 사용을 반대하세요 Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 부분은 챌린지 03의 주제와 Emma의 실천을 함께 보여 줘요. 주제는 \u003cb class=\"key\">일회용 \u003c/b>\u003cb class=\"key\">플라스틱\u003c/b>을 쓰지 말자이고, Emma는 평소 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">배달 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>를 자주 이용하지만 오늘만큼은 이용하지 않았다고 말하죠. but과 today로 '평소와 다른 오늘'을 콕 집어 대비시킨 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + 목적어 (주어 You 생략) : \"일회용 플라스틱 사용을 반대하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하이픈으로 연결된 복합 표현\u003c/span> : [단어 + 하이픈 + 단어] → 하나의 형용사처럼 사용 : \"일회용 플라스틱\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사가 명사를 수식하는 명사구\u003c/span> : food(명사) + delivery(명사) + services(명사) : \"음식 배달 서비스\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">대동사 do(반복 회피)\u003c/span> : but + [주어] + didn't (= did not use) : \"그런데 오늘은 이용하지 않았어\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Challenge 03, 챌린지 03. Say No to Single-Use Plastic, 일회용 플라스틱 사용을 반대하세요. Emma, 엠마:. I often use food delivery services, 나는 종종 음식 배달 서비스를 이용하는데. but today I didn't, 오늘은 이용하지 않았어.. 이 문장 전체를 해석하면, 챌린지 03 / 일회용 플라스틱 사용을 반대하세요 Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.","hl":"m"},{"n":52,"text":"이 부분은 챌린지 세 번째 주제와 Emma의 실천을 함께 보여 줘요. Emma는 평소에 음식 배달 서비스를 자주 이용하지만, 오늘은 이용하지 않았다고 말하죠. but과 today를 넣어서 평소와 다른 오늘을 콕 집어 대비시킨 문장이에요.","hl":"mn"},{"n":53,"text":"먼저 Say No to Single-Use Plastic을 보세요. 주어 없이 동사원형 Say로 시작하는 명령문이라서, 일회용 플라스틱에 아니라고 말하라는 지시가 돼요. 두 번째로 Single-Use는 하이픈으로 묶여서 하나의 형용사처럼 Plastic을 꾸며 주고, 한 번 쓰고 버리는이라는 뜻이에요. 세 번째로 food delivery services는 명사가 명사를 꾸미는 명사 수식 구조라서 음식 배달 서비스라는 한 덩어리로 해석해요. 마지막으로 but today I didn't에서 didn't는 앞의 use를 다시 쓰지 않고 대신한 대동사이고, today 덕분에 평소와 달리 오늘이라는 대비가 살아난답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 내가 가장 좋아하는 식당에 걸어갔어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">walked \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">favorite \u003c/span>\u003cspan class=\"tgt\">restaurant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재사용할 수 있는 용기를 가지고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">reusable \u003c/span>\u003cspan class=\"tgt\">container\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 음식을 가져왔어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">Instead\u003c/b>는 앞 문장의 '배달 서비스를 이용하지 않았다'를 받아 '그 대신에'라는 뜻으로 이어 줘요. Emma는 \u003cb class=\"key\">재사용 \u003c/b>\u003cb class=\"key\">용기\u003c/b>를 직접 들고 걸어가서 음식을 받아왔고, 이것이 일회용 플라스틱을 줄이는 구체적인 \u003cb class=\"key\">실천\u003c/b>이에요. walked와 picked up이 and로 나란히 연결되어 두 행동이 자연스럽게 이어지는 구조죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 walk + 전치사 to(방향)\u003c/span> : walk(자동사) + to + [장소] : \"내가 가장 좋아하는 식당에 걸어갔어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(수단·도구) with\u003c/span> : with + [도구·수단 명사] : \"재사용할 수 있는 용기를 가지고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조와 구동사 pick up\u003c/span> : [walked ~] and [picked up ~] : \"그리고 그 음식을 가져왔어\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Instead, 대신에. I walked to my favorite restaurant, 나는 내가 가장 좋아하는 식당에 걸어갔어. with a reusable container, 재사용할 수 있는 용기를 가지고. and picked up the food, 그리고 그 음식을 가져왔어.. 이 문장 전체를 해석하면, 대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.","hl":"m"},{"n":55,"text":"Instead는 앞 문장에서 배달 서비스를 이용하지 않았다는 말을 받아서 그 대신에라는 뜻으로 이어 줘요. Emma는 재사용 용기를 직접 들고 걸어가서 음식을 받아왔고, 이게 바로 일회용 플라스틱을 줄이는 구체적인 실천이에요. walked와 picked up이 and로 나란히 연결되어 두 행동이 자연스럽게 이어지는 구조죠.","hl":"mn"},{"n":56,"text":"먼저 walked to my favorite restaurant에서 walk는 목적어를 바로 받지 않는 자동사라서, 도착지를 말할 때 전치사 to를 붙여요. 두 번째로 with a reusable container에서 with는 용기를 가지고, 용기를 이용해서라는 수단을 나타내고, walked와 함께 쓰여서 용기를 들고 걸어갔다는 동시 상황을 더해 줘요. 마지막으로 and picked up the food에서 walked와 picked up이 and로 연결된 병렬 구조라서 두 동작이 나란히 이어지고, pick up은 집어 들다, 음식을 받아 가다라는 뜻의 구동사예요. 참고로 reusable은 reuse에 able을 붙여 만든 형용사라서 재사용할 수 있는이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 들었어\u003c/span>\u003cspan class=\"en\">I heard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대로 없어지지 않는다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">completely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">플라스틱은 절대로 완전히 없어지지 않는다고 들었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 플라스틱이 \u003cb class=\"key\">완전히\u003c/b> 분해되지 않고 계속 남는다는 사실을 들었다고 말하며, 뒤에 이어지는 실천에 \u003cb class=\"key\">이유\u003c/b>를 대 주는 문장이에요. 그래서 오늘 일회용 플라스틱을 쓰지 않은 엠마의 행동이 \u003cb class=\"key\">설득력\u003c/b>을 갖게 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : heard + [that + 주어 + 동사 ... (명사절/목적어)] : \"플라스틱이 절대로 완전히 없어지지 않는다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제(3인칭 단수)와 빈도부사 never\u003c/span> : 주어(3인칭 단수) + never + [동사원형+s] : \"절대로 없어지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"I heard, 나는 들었어. that plastic, 플라스틱이. never goes away, 절대로 없어지지 않는다고. completely, 완전히. 이 문장 전체를 해석하면, 플라스틱은 절대로 완전히 없어지지 않는다고 들었어.","hl":"m"},{"n":58,"text":"이 문장은 엠마가 왜 일회용 플라스틱을 쓰지 않았는지 그 이유를 말해 주는 문장이에요. 플라스틱은 완전히 분해되지 않고 계속 남는다는 사실을 들었다고 하면서, 다음 문장으로 자연스럽게 이어지죠. 그래서 오늘 일회용 플라스틱을 쓰지 않았다는 이야기가 훨씬 설득력 있게 들려요.","hl":"mn"},{"n":59,"text":"첫 번째로, heard 뒤에 that이 나오면서 그 뒤 내용 전체가 목적어 자리에 들어갔어요. hear나 know, think 같은 동사 뒤에서 that절은 목적어 역할을 하고, ~라고로 해석되는 명사절이 되죠. 두 번째로, 주어 plastic은 3인칭 단수라서 동사에 s가 붙어 goes가 되었고, 빈도부사 never는 일반동사 앞에 놓였어요. 그래서 절대로 없어지지 않는다는 뜻이 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 23\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용하지 않았어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 일회용 플라스틱도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">single-use \u003c/span>\u003cspan class=\"tgt\">plastic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘\u003c/span>\u003cspan class=\"en\">today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엠마가 오늘 실제로 한 \u003cb class=\"key\">행동\u003c/b>을 딱 잘라 말하는 문장이에요. 플라스틱이 완전히 없어지지 않는다고 들은 것에 대한 \u003cb class=\"key\">실천\u003c/b>이죠. 그래서 이 문장 자체가 챌린지를 지켰다는 \u003cb class=\"key\">증거\u003c/b>가 되어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거시제 부정문(did not + 동사원형)\u003c/span> : 주어 + did not(didn't) + [동사원형] : \"사용하지 않았어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서의 any\u003c/span> : not + [any + 명사] : \"어떤 일회용 플라스틱도\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"I, 나는. didn't use, 사용하지 않았어. any single-use plastic, 어떤 일회용 플라스틱도. today, 오늘. 이 문장 전체를 해석하면, 나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.","hl":"m"},{"n":61,"text":"이 문장은 엠마가 오늘 실제로 해낸 행동을 딱 잘라 말하고 있어요. 앞에서 플라스틱이 완전히 없어지지 않는다고 들었다는 말에 대한 실천인 셈이죠. 그래서 이 문장 자체가 챌린지를 제대로 지켰다는 증거가 되어 줍니다.","hl":"mn"},{"n":62,"text":"첫 번째로, 과거 부정문이라서 did not이 시제를 담당하고 본동사는 동사원형 use를 썼어요. 두 번째로, 부정문에서는 어떤 것도라는 뜻으로 some이 아니라 any를 씁니다. 그래서 any single-use plastic이 어떤 일회용 플라스틱도로 해석되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기분이 좋았어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">good\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기분이 좋았어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실천을 마친 뒤의 \u003cb class=\"key\">기분\u003c/b>을 짧게 표현한 문장이에요. 일회용 플라스틱을 쓰지 않았다는 사실이 준 \u003cb class=\"key\">뿌듯함\u003c/b>이 그대로 드러나죠. 짧지만 챌린지의 \u003cb class=\"key\">보람\u003c/b>을 보여 주는 마무리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 형용사(2형식 주격보어)\u003c/span> : 주어 + feel(감각동사) + [형용사(주격보어)] : \"기분이 좋았다\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"I, 나는. felt good!, 기분이 좋았어. 이 문장 전체를 해석하면, 기분이 좋았어!","hl":"m"},{"n":64,"text":"이 문장은 실천을 마친 뒤의 기분을 아주 짧게 표현하고 있어요. 일회용 플라스틱을 쓰지 않았다는 사실이 스스로에게 뿌듯함을 준 거죠. 짧지만 챌린지의 보람을 보여 주는 마무리 문장이에요.","hl":"mn"},{"n":65,"text":"여기서 felt는 감각동사 feel의 과거형이에요. 감각동사 뒤에는 부사가 아니라 형용사가 와서 주어의 상태를 설명하죠. 그래서 I felt good이라고 쓰고, good은 주격보어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">챌린지 04 재활용하세요 민수:\u003c/span>\u003cspan class=\"en\">Challenge 04 Recycle Minsu:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어제\u003c/span>\u003cspan class=\"en\">Yesterday,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 플라스틱과 유리병 몇 개를 가져갔어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">glass \u003c/span>\u003cspan class=\"tgt\">bottles \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재활용 기계에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">recycling \u003c/span>\u003cspan class=\"tgt\">machine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집 근처에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">챌린지 04 / 재활용하세요 민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 민수가 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b>를 실제로 실천한 행동을 소개하는 문장이에요. took some plastic and glass bottles to a recycling machine은 '플라스틱과 유리병을 재활용 기계에 가져갔다'는 뜻이고, near my house는 그 기계의 \u003cb class=\"key\">위치\u003c/b>를 알려주는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">take A to B 구문 (전치사 to의 방향)\u003c/span> : take + [목적어 A] + to + [장소 B] : \"플라스틱과 유리병을 재활용 기계에 가져갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사의 병렬 구조 (A and B)\u003c/span> : some + [명사 A] + and + [명사 B] : \"플라스틱과 유리병 몇 개\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사] + [전치사구] : \"집 근처에 있는 재활용 기계\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"Challenge 04 Recycle Minsu, 챌린지 04 재활용하세요 민수:. Yesterday, 어제. I took some plastic and glass bottles, 나는 플라스틱과 유리병 몇 개를 가져갔어. to a recycling machine, 재활용 기계에. near my house, 집 근처에 있는. 이 문장 전체를 해석하면, 챌린지 04 / 재활용하세요 민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.","hl":"m"},{"n":67,"text":"이 문장은 민수가 재활용 챌린지를 실제로 실천한 모습을 소개해요. took some plastic and glass bottles to a recycling machine은 플라스틱과 유리병을 재활용 기계에 가져갔다는 뜻이고, near my house는 그 기계가 집 근처에 있다는 위치 정보를 더해 줘요. 그래서 어제 집 근처 재활용 기계에 병들을 가져간 장면이 머릿속에 그려지면 좋아요.","hl":"mn"},{"n":68,"text":"먼저 take A to B 구문을 보세요. take는 목적어 뒤에 전치사 to를 붙여서 'A를 B로 가져가다'라는 뜻을 만들어요. 여기서 to는 방향과 도착지를 나타내는 전치사랍니다. 두 번째로 near my house를 보면, 이 전치사구가 바로 앞의 a recycling machine을 꾸며 주는 형용사 역할을 하고 있어요. 그래서 '집 근처에 있는 재활용 기계'라고 해석되는 거예요. 마지막으로 some plastic and glass bottles처럼 명사와 명사가 and로 나란히 연결되는 병렬 구조도 눈에 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것들을 기계에 집어넣었고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">machine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나씩\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 포인트를 받았어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">points\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대가로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">return\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 재활용 기계를 사용하는 과정과 그 결과를 함께 보여 주는 문장이에요. 병을 하나씩 넣는 동작과 포인트를 받는 \u003cb class=\"key\">결과\u003c/b>가 and로 나란히 연결돼 있어요. '재활용하면 \u003cb class=\"key\">보상\u003c/b>이 돌아온다'는 흐름을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">put A into B 구문 (과거형 put)\u003c/span> : put + [목적어] + into + [장소] : \"그것들을 기계에 집어넣었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 (부사구)\u003c/span> : [one by one] : \"하나씩\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and\u003c/span> : [절] + and + [절] : \"그리고 나는 포인트를 받았어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용 표현 (부사구)\u003c/span> : [in return] : \"대가로, 답례로\"\u003c/div>\u003c/div>","segs":[{"n":69,"text":"I put them into the machine, 나는 그것들을 기계에 집어넣었고. one by one, 하나씩. and I got some points, 그리고 나는 포인트를 받았어. in return, 대가로. 이 문장 전체를 해석하면, 나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어.","hl":"m"},{"n":70,"text":"이 문장은 재활용 기계를 사용하는 과정과 그 결과를 함께 보여 줘요. 병을 하나씩 넣는 동작, 그리고 그에 대한 결과로 포인트를 받는 흐름이 and로 나란히 연결돼 있어요. 재활용이 보상으로 이어진다는 점이 이 문장의 핵심이에요.","hl":"mn"},{"n":71,"text":"먼저 put A into B 구문을 보세요. put은 목적어 뒤에 전치사 into를 붙여 'A를 B 안에 넣다'라는 뜻을 만들어요. 그리고 put의 과거형은 원형과 똑같이 put이라서, 시제는 앞뒤 문맥으로 판단해야 한답니다. 두 번째로 one by one은 '하나씩'이라는 뜻의 관용 표현이고요, 세 번째로 in return은 '그에 대한 대가로'라는 뜻의 관용 표현이에요. 마지막으로 and가 두 개의 절을 대등하게 이어 주면서, 집어넣는 동작과 포인트를 받는 결과를 나란히 연결해 준다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 할 수 있냐고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 포인트로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">points?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 포인트로 무엇을 할 수 있냐고?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 민수가 포인트를 받고 나서 스스로에게 던지는 \u003cb class=\"key\">질문\u003c/b>이에요. 바로 다음 문장에서 이 질문에 대한 답이 이어지므로, 뒤 내용을 끌어내는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요. do with는 '~로 무엇을 하다'라는 뜻이라, 포인트의 \u003cb class=\"key\">활용법\u003c/b>을 묻는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문 (의문사 + 조동사 + 주어)\u003c/span> : What + [조동사] + [주어] + [동사원형]? : \"그 포인트로 무엇을 할 수 있냐고?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 의문문\u003c/span> : can + [주어] + [동사원형] : \"내가 ~할 수 있냐고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">do with 구문\u003c/span> : do with + [명사] : \"그 포인트로 (무엇을) 하다\"\u003c/div>\u003c/div>","segs":[{"n":72,"text":"What, 무엇을. can I do, 내가 할 수 있냐고. with those points?, 그 포인트로. 이 문장 전체를 해석하면, 그 포인트로 무엇을 할 수 있냐고?","hl":"m"},{"n":73,"text":"이 문장은 민수가 포인트를 받고 나서 스스로에게 던지는 질문이에요. 바로 뒤 문장에서 이 질문에 대한 답이 이어지니까, 다음 내용을 끌어내는 도입 역할을 한다고 보면 돼요. do with는 '~로 무엇을 하다'라는 뜻이라서, 이 포인트를 어떻게 쓸 수 있을지 묻는 표현이에요.","hl":"mn"},{"n":74,"text":"먼저 의문사가 이끄는 의문문을 볼게요. 의문사 What이 맨 앞에 나오고, 그 뒤에 조동사 can과 주어 I가 자리를 바꾸는 도치가 일어나요. 두 번째로 do with를 보면 '무엇을 하다'라는 뜻의 구문으로, What과 함께 쓰여 활용법을 묻는 표현이 됩니다. 마지막으로 조동사 can은 주어 앞으로 나가 도치되고, 뒤에는 동사원형 do가 온다는 점, 그리고 가능을 묻는다는 점까지 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것들을 사용할 수 있어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음, 나는 그것들을 돈처럼 사용할 수 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 재활용 기계에서 받은 \u003cb class=\"key\">points\u003c/b>를 \u003cb class=\"key\">money\u003c/b>처럼 쓸 수 있다는 뜻이에요. 전치사 \u003cb class=\"key\">like\u003c/b>가 '~처럼'이라는 의미로 쓰여, 포인트의 쓰임을 돈에 빗대어 설명하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (능력·가능)\u003c/span> : [주어] + [[can]] + [동사원형] : \"사용할 수 있어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like (~처럼)\u003c/span> : [전치사 like] + [명사] : \"돈처럼\"\u003c/div>\u003c/div>","segs":[{"n":75,"text":"Well, 음. I can use them, 나는 그것들을 사용할 수 있어. like money, 돈처럼. 이 문장 전체를 해석하면, 음, 나는 그것들을 돈처럼 사용할 수 있어.","hl":"m"},{"n":76,"text":"이 문장은 앞에서 모은 포인트를 돈처럼 쓸 수 있다는 뜻이에요. like는 여기서 '~처럼'이라는 뜻으로, points를 money에 빗대어 말하고 있죠. 그래서 them이 바로 그 points를 가리킨다는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":77,"text":"어법 포인트 첫 번째, 조동사 can이 나오면 뒤에는 반드시 동사원형이 온다는 점이에요. I can use처럼 말이죠. 어법 포인트 두 번째, 전치사 like는 '~처럼'이라는 뜻으로 뒤에 명사 money가 바로 왔어요. 좋아요, 이제 다음 문장으로 가 볼게요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 23\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 생각하지 않니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 멋지다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that's \u003c/span>\u003cspan class=\"tgt\">cool\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">멋지다고 생각하지 않니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대의 동의를 구하는 \u003cb class=\"key\">부정의문문\u003c/b>으로, 포인트를 돈처럼 쓸 수 있다는 사실이 \u003cb class=\"key\">멋지다\u003c/b>고 되묻는 문장이에요. \u003cb class=\"key\">that\u003c/b>은 앞 문장 전체의 내용을 가리키는 지시대명사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문 (동의 유도)\u003c/span> : [Don't] + [주어] + [동사] ~? : \"너는 생각하지 않니\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 that + be동사\u003c/span> : [지시대명사 that] + [is(축약 's)] + [형용사] : \"그것이 멋지다\"\u003c/div>\u003c/div>","segs":[{"n":78,"text":"Don't you think, 너는 생각하지 않니. that's cool?, 그것이 멋지다고. 이 문장 전체를 해석하면, 멋지다고 생각하지 않니?","hl":"m"},{"n":79,"text":"이 문장은 부정의문문으로 물으면서 상대방의 동의를 자연스럽게 끌어내는 표현이에요. 앞에서 포인트를 돈처럼 쓸 수 있다고 했으니, 그것 참 멋지지 않냐고 되묻는 거죠. that은 바로 그 사실 전체를 가리킨다는 것도 기억해 두세요.","hl":"mn"},{"n":80,"text":"어법 포인트 첫 번째, Don't you think처럼 부정의문문으로 물으면 상대가 '그래, 그렇지'라고 긍정하는 답을 기대하게 됩니다. 어법 포인트 두 번째, think 뒤에는 접속사 that이 생략된 절이 이어져요. that's cool의 that은 지시대명사로 '그것'을 가리키고, is는 축약된 형태라는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>매일 많은 \u003cb class=\"key\">쓰레기\u003c/b>를 만들어 내면서 지구가 점점 더 병들고 있다는 문제가 제기됩니다.\u003c/li>\u003cli>저자는 지구를 구하고 싶다면 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b>에 동참하고 자신의 이야기를 공유하라고 제안합니다.\u003c/li>\u003cli>Olivia는 \u003cb class=\"key\">음식물 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>를 줄였고, Domingo는 찢어진 가방을 수선해 \u003cb class=\"key\">재사용\u003c/b>을 실천했습니다.\u003c/li>\u003cli>Emma는 \u003cb class=\"key\">일회용 \u003c/b>\u003cb class=\"key\">플라스틱\u003c/b> 사용을 거부했고, Minsu는 병을 재활용해 포인트를 받았습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Join the zero-waste challenge and practice reducing food waste, reusing things, refusing single-use plastic, and recycling to save the Earth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">매일 많은 쓰레기로 지구가 병들고 있는 가운데, 저자는 \u003cb class=\"key\">제로 \u003c/b>\u003cb class=\"key\">웨이스트 \u003c/b>\u003cb class=\"key\">챌린지\u003c/b>에 동참해 자신의 이야기를 공유하자고 제안합니다. Olivia, Domingo, Emma, Minsu가 각각 \u003cb class=\"key\">음식물 \u003c/b>\u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>, 재사용, 일회용 플라스틱 거부, 재활용을 실천한 사례를 소개합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":81,"text":"오늘 글 정리해 볼게요. 지구가 병들고 있다는 문제에서 출발해, 제로 웨이스트 챌린지에 동참하자는 제안이 글의 중심이었어요. 그리고 음식물 쓰레기 줄이기, 재사용, 일회용 플라스틱 거부, 재활용이라는 네 가지 사례가 그 제안을 뒷받침했죠. 여러분도 오늘부터 작은 실천 하나씩 시작해 보면 좋겠어요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
