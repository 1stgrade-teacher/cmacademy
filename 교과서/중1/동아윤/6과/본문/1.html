 것을 넘어, 물건을 다시 사용하거나 재활용하는 순환 경제(Circular economy)의 가치를 실천하는 것이랍니다. 특히 지문에서 소개된 음식물 쓰레기 줄이기(Reducing food waste)는 우리가 일상에서 가장 쉽게 실천할 수 있는 환경 보호 방법 중 하나예요. 먹다 남은 음식을 버리지 않고 창의적으로 요리해 먹는 업사이클링 요리(Upcycling cooking) 같은 작은 노력이 모이면, 지구가 다시 건강해지는 데 큰 도움이 될 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 인식</div><ul><li>우리가 매일 배출하는 쓰레기 때문에 지구가 병들고 있다는 사실을 자각합니다.</li><li>지속적인 쓰레기 배출(producing waste)의 문제점</li><li>지구가 점점 아파짐(getting sicker)</li><li>핵심 키워드: 제로 웨이스트 챌린지(zero-waste challenge)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02챌린지 제안</div><ul><li>지구를 지키기 위해 일상에서 제로 웨이스트를 실천하고 경험을 공유할 것을 권유합니다.</li><li>환경 보호를 위한 능동적인 참여(join)</li><li>자신의 실천 사례 공유(share stories)</li><li>핵심 키워드: 참여(join)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실천 사례 - 음식물 쓰레기 줄이기</div><ul><li>외식 후 남은 음식을 버리지 않고 재활용하여 음식물 쓰레기를 줄이는 방법을 소개합니다.</li><li>외식 후 남은 음식(leftovers) 포장해오기</li><li>남은 음식을 활용한 새로운 식사(nice lunch) 만들기</li><li>핵심 키워드: 음식물 쓰레기 줄이기(Reduce Food Waste)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04꿀팁 활용</div><ul><li>인터넷을 통해 남은 음식을 활용할 수 있는 다양한 요리 정보를 얻을 수 있습니다.</li><li>인터넷(Internet)을 통한 정보 검색</li><li>남은 재료를 활용한 요리 아이디어(cooking ideas) 찾기</li><li>핵심 키워드: 참고 정보(FYI)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 병든</td></tr><tr><td class=\"w\">join</td><td class=\"m\">참여하다, 함께하다</td></tr><tr><td class=\"w\">zero-waste</td><td class=\"m\">쓰레기를 배출하지 않는</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 과제</td></tr><tr><td class=\"w\">share</td><td class=\"m\">공유하다, 나누다</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 축소하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">food waste</td><td class=\"m\">음식물 쓰레기</td></tr><tr><td class=\"w\">eat out</td><td class=\"m\">외식하다</td></tr><tr><td class=\"w\">leftover</td><td class=\"m\">남은 음식</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, 데려오다</td></tr><tr><td class=\"w\">nice</td><td class=\"m\">멋진, 훌륭한</td></tr><tr><td class=\"w\">FYI</td><td class=\"m\">참고로 (For Your Information의 약어)</td></tr><tr><td class=\"w\">cooking</td><td class=\"m\">요리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>Every day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 만든다</span><span class=\"en\"><b>we produce</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 쓰레기를</span><span class=\"en\"><b>lots of waste,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 지구는</span><span class=\"en\"><b>and the Earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되어가고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is getting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 병들게</span><span class=\"en\"><b>sicker and sicker.</b></span></div></div><div class=\"lec-sent-ko\">매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리가 일상적으로 쓰레기를 배출하는 행동이 누적되어 지구가 병들고 있다는 문제 상황을 제시합니다. 여기서 sicker는 사전적으로 &#39;더 아픈&#39;이지만, 문맥상 환경 오염으로 인한 &#39;지구의 상태 악화&#39;를 의미합니다. 필자는 지구가 회복 불가능할 정도로 나빠지고 있다는 점을 강조하기 위해 점층적인 표현을 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is getting (현재진행): be동사(is)+현재분사(getting) 구조로, 상태의 변화(점점 ~해지다)를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈, 병든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 원하나요</span><span class=\"en\"><b>Do you want</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to save</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를?</span><span class=\"en\"><b>the Earth?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 지구를 구하고 싶나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 환경 문제에 대해 독자에게 질문을 던짐으로써, 해결 방안으로 넘어가기 전 주의를 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to save (to부정사): want의 목적어로 쓰인 명사적 용법으로 &#39;~하는 것을 원하다&#39;라는 의미를 가짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동참하세요</span><span class=\"en\"><b>join</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제로 웨이스트 챌린지에</span><span class=\"en\"><b>the <span class=\"grammar-hl\">zero-waste</span> challenge,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 공유하세요</span><span class=\"en\"><b>and share</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 이야기를</span><span class=\"en\"><b>your stories.</b></span></div></div><div class=\"lec-sent-ko\">그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 질문에 대한 해결책으로 &#39;제로 웨이스트 챌린지&#39;를 제안합니다. 참여를 독려하며 독자가 단순히 읽는 것에 그치지 않고 실천하도록 유도하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">zero-waste (관용표현): 쓰레기를 만들지 않는 활동을 지칭하는 사회적 용어</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">join</td><td class=\"m\">참여하다, 함께하다</td></tr><tr><td class=\"w\">zero-waste</td><td class=\"m\">쓰레기를 배출하지 않는</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 과제</td></tr><tr><td class=\"w\">share</td><td class=\"m\">공유하다, 나누다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">챌린지 01</span><span class=\"en\"><b>Challenge 01</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄이세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Reduce</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식물 쓰레기를</span><span class=\"en\"><b>Food Waste</b></span></div></div><div class=\"lec-sent-ko\">챌린지 01 / 음식물 쓰레기를 줄이세요</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 실천 방안의 첫 번째 단계로 &#39;음식물 쓰레기 감소&#39;라는 주제를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Reduce (관용표현): 제목이나 표어에서 행동을 촉구할 때 쓰이는 명령문 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr><tr><td class=\"w\">challenge</td><td class=\"m\">도전, 과제</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 축소하다</td></tr><tr><td class=\"w\">food waste</td><td class=\"m\"
