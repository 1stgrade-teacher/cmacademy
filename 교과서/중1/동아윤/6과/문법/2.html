  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}

  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

lecturePlayer(document.getElementById("app"),{"brand":"문법2","title":"중1 동아(윤) 6과 - 접속사 that 완전 정복","audioDir":"2_audio","preview":false,"count":61,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">접속사 that\u003c/div>\u003ch1>중1 동아(윤) 6과 - 접속사 that 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>접속사 that이 이끄는 명사절의 형태와 쓰임을 익히고, that과 지시사 that을 구분해 바르게 사용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중1 동아 윤 6과의 접속사 that을 배워 볼 거예요. 접속사 that이 문장 안에서 어떤 역할을 하는지, 언제 생략할 수 있는지 함께 알아볼게요. 또 접속사 that과 지시사 that을 구분하는 방법도 연습해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">접속사 that의 형태와 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사 \u003cb class=\"key\">that\u003c/b>은 「that+주어+동사」의 형태로 쓰이며, 문장에서 주어, 보어, 목적어의 역할을 하는 \u003cb class=\"key\">명사절\u003c/b>을 이끕니다. that 자체는 해석하지 않고 뒤에 오는 절을 이끌어요.\u003cdiv>\u003cspan class=\"g-formula\">that + 주어 + 동사 = 명사절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">That the sun rises in the east\u003c/span> is a fact.\u003c/div>\u003cdiv class=\"g-ko\">태양이 동쪽에서 떠오른다는 것은 사실이다.\u003c/div>\u003cdiv class=\"g-note\">that절이 문장의 주어 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The bad news is \u003cspan class=\"fx\">that Jess didn't pass the exam\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나쁜 소식은 Jess가 시험에 합격하지 못했다는 것이다.\u003c/div>\u003cdiv class=\"g-note\">that절이 보어 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">We think \u003cspan class=\"fx\">that school uniforms are necessary\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 교복이 필요하다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">that절이 think의 목적어 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I hear \u003cspan class=\"fx\">that she is a doctor\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀가 의사라고 들었다.\u003c/div>\u003cdiv class=\"g-note\">접속사 that 뒤에는 주어 she와 동사 is가 옵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>접속사 that 뒤에는 반드시 \u003cb class=\"key\">주어\u003c/b>와 \u003cb class=\"key\">동사\u003c/b>가 이어집니다. that만 보고 지시대명사라고 생각하지 않도록 주의하세요.\u003c/div>","segs":[{"n":2,"text":"오늘 첫 번째 개념은 접속사 that이에요. 접속사 that은 that 다음에 주어와 동사가 이어지는 형태로 쓰여요. 그리고 이 덩어리가 문장 안에서 주어, 보어, 목적어 역할을 하는 명사절을 만들어 줍니다. 예를 들어 That the sun rises in the east is a fact라고 하면 that the sun rises in the east가 주어 역할을 해요. 뜻은 태양이 동쪽에서 떠오른다는 것은 사실이다예요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 That the sun rises in the east is a fact예요. 뜻은 태양이 동쪽에서 떠오른다는 것은 사실이다입니다. 여기서 that the sun rises in the east 부분이 문장의 주어 역할을 해요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 The bad news is that Jess didn't pass the exam이에요. 뜻은 나쁜 소식은 Jess가 시험에 합격하지 못했다는 것이다입니다. 여기서 that Jess didn't pass the exam가 보어 역할을 하죠.","hl":"ex-1"},{"n":5,"text":"세 번째 예문은 We think that school uniforms are necessary예요. 뜻은 우리는 교복이 필요하다고 생각한다입니다. that school uniforms are necessary가 think의 목적어 역할을 합니다.","hl":"ex-2"},{"n":6,"text":"네 번째 예문은 I hear that she is a doctor예요. 뜻은 나는 그녀가 의사라고 들었다입니다. 여기서 that 뒤에 주어 she와 동사 is가 오는 것을 확인할 수 있어요.","hl":"ex-3"},{"n":7,"text":"시험에서는 that 뒤에 어떤 형태가 오는지 자주 물어봐요. 그래서 that 뒤에는 주어와 동사가 이어진다는 점을 꼭 기억해 주세요. 그리고 that을 지시대명사로 착각하지 않도록 뒤에 주어와 동사가 있는지 확인해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">목적어로 쓰인 that절에서 that 생략\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사의 \u003cb class=\"key\">목적어\u003c/b> 역할을 하는 that절에서 접속사 \u003cb class=\"key\">that\u003c/b>은 대체로 생략할 수 있습니다. 하지만 that을 생략해도 뒤에는 주어와 동사가 그대로 남아 있어야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + (that) + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I heard \u003cspan class=\"fx\">(that)\u003c/span> plastic never goes away completely.\u003c/div>\u003cdiv class=\"g-ko\">나는 플라스틱이 완전히 없어지지 않는다고 들었다.\u003c/div>\u003cdiv class=\"g-note\">heard의 목적어로 쓰인 목적절이며 that은 생략할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I guess \u003cspan class=\"fx\">(that)\u003c/span> it's all right.\u003c/div>\u003cdiv class=\"g-ko\">나는 그것이 괜찮다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">guess의 목적어로 쓰인 that절입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">We believe \u003cspan class=\"fx\">(that)\u003c/span> he is kind.\u003c/div>\u003cdiv class=\"g-ko\">우리는 그가 친절하다고 믿는다.\u003c/div>\u003cdiv class=\"g-note\">believe의 목적어로 쓰인 that절입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I don't think \u003cspan class=\"fx\">(that)\u003c/span> the bag looks perfect.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 가방이 완벽해 보인다고 생각하지 않는다.\u003c/div>\u003cdiv class=\"g-note\">think의 목적어로 쓰인 that절이며 that은 생략할 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>that을 생략해도 \u003cb class=\"key\">주어\u003c/b>와 \u003cb class=\"key\">동사\u003c/b>는 절대 생략하지 않습니다. 목적어 that절인지 확인하려면 동사 뒤에 주어와 동사가 있는지 보세요.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 목적어로 쓰인 that절에서 that을 생략하는 거예요. think, believe, guess, hear처럼 생각이나 믿음, 들음을 나타내는 동사 뒤에 that절이 오면 that을 대체로 생략할 수 있어요. 예를 들어 I guess that it's all right에서 that을 빼고 I guess it's all right라고 해도 뜻은 같아요. 하지만 that이 없어도 뒤에는 주어와 동사가 반드시 있어야 합니다.","hl":"rule"},{"n":9,"text":"첫 번째 예문은 I heard that plastic never goes away completely예요. 여기서 that은 생략할 수 있고, 뜻은 나는 플라스틱이 완전히 없어지지 않는다고 들었다입니다. heard의 목적어로 쓰인 목적절이에요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문은 I guess that it's all right예요. 뜻은 나는 그것이 괜찮다고 생각한다입니다. 여기서도 that을 생략할 수 있어요.","hl":"ex-1"},{"n":11,"text":"세 번째 예문은 We believe that he is kind예요. 뜻은 우리는 그가 친절하다고 믿는다입니다. believe 뒤의 that도 생략할 수 있습니다.","hl":"ex-2"},
