<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 비상(황) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 비상(황) 7과 본문1","audioDir":"1_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>비상(황)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>A Plastic Duck in the Middle of the Ocean\u003c/h1>\u003ch2>바다 한가운데에 있는 플라스틱 오리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 플라스틱 목욕 장난감인 오리가 \u003cb class=\"key\">공장\u003c/b>에서 만들어져 \u003cb class=\"key\">상자\u003c/b>에 담긴 채 바다로 나갔다가, \u003cb class=\"key\">사고\u003c/b>로 상자가 바다에 빠지면서 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>를 떠돌게 되었다는 이야기이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>요지: A plastic bath toy duck explains how it ended up floating in the middle of the ocean.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 바다 한가운데에 떠 있는 플라스틱 오리의 이야기예요. 목욕 장난감으로 태어난 오리가 어떻게 넓은 바다까지 가게 되었는지 그 과정을 차근차근 따라가 볼 거예요. 요약하자면 공장에서 만들어진 플라스틱 오리가 상자에 담겨 바다로 나갔다가 사고로 상자가 바다에 빠지면서 바다 한가운데를 떠돌게 되었다는 내용이고, 요지는 바로 그렇게 오리가 바다 한가운데에 오게 된 경위를 스스로 설명한다는 거예요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">플라스틱은 가볍고 오래 가는 물질이라서 장난감과 생활용품에 아주 많이 쓰인다. 문제는 이렇게 오래 가는 플라스틱이 바다에 들어가면 잘 썩지 않고 아주 오랫동안 떠다닌다는 점이다. 실제로 컨테이너선(container ship)이 운반하던 화물이 사고로 바다에 빠지는 일도 드물지 않다. 우리가 택배 상자를 옮기다가 손을 놓쳐 상자가 길거리를 굴러다니듯이, 배에서 떨어진 화물 상자는 바다를 떠돌게 된다. 이렇게 바다로 흘러든 쓰레기를 marine debris, 즉 해양 쓰레기라고 부른다. 목욕 장난감 오리들이 사고로 바다에 빠진 뒤 여러 나라 해안에 도착한 유명한 사례도 있는데, 이 지문은 바로 그런 \u003cb class=\"key\">표류\u003c/b>를 화자의 입장에서 들려주는 글이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 플라스틱은 가볍고 오래 가는 물질이라서 장난감이나 생활용품에 아주 많이 쓰여요. 그런데 문제는 이렇게 오래 가는 플라스틱이 바다에 들어가면 잘 썩지 않고 아주 오랫동안 떠다닌다는 점이에요. 컨테이너선이 운반하던 화물이 사고로 바다에 빠지는 일도 실제로 자주 있고요. 우리가 택배 상자를 옮기다가 손을 놓쳐서 상자가 길거리를 굴러다니듯이, 배에서 떨어진 화물 상자는 바다를 떠돌게 돼요. 이렇게 바다로 흘러든 쓰레기를 marine debris, 우리말로 해양 쓰레기라고 부르는데, 목욕 장난감 오리들이 사고로 바다에 빠져 여러 나라 해안에 도착한 유명한 사례도 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자기소개와 현재 위치\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>화자는 자신이 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">오리\u003c/b>이자 \u003cb class=\"key\">목욕 \u003c/b>\u003cb class=\"key\">장난감\u003c/b>이라고 소개한다. 그런데 But look이라는 말과 함께 자기가 \u003cb class=\"key\">목욕탕\u003c/b>에 있지 않고 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>에 있다고 말하며 상황을 뒤집는다. 독자는 이 도입에서 화자의 실제 처지가 예상과 다르다는 것을 알게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>중심 질문 던지기\u003csmall>질문 · 문장 6\u003c/small>\u003c/h4>\u003cp>화자는 How did I get here라고 물으며 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>까지 오게 된 경로를 독자에게 묻는다. 이 질문이 글 전체를 이끄는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이 된다. 뒤에 이어지는 모든 문장이 이 질문에 대한 답이라는 점을 알 수 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>만들어진 곳과 이유\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>화자는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">오리들\u003c/b>과 함께 \u003cb class=\"key\">공장\u003c/b>에서 왔다고 밝힌다. 사람들이 플라스틱으로 오리를 만든 이유는 \u003cb class=\"key\">가볍고 \u003c/b>\u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">가기\u003c/b> 때문이라고 because로 설명한다. 이 특징이 뒤에 나오는 사고와 자연스럽게 이어진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>상자에 담겨 바다로\u003csmall>결과 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>사람들이 오리를 \u003cb class=\"key\">상자\u003c/b> 속에 넣었고 그 상자들은 \u003cb class=\"key\">바다\u003c/b>로 나갔다. 그러나 상자들이 \u003cb class=\"key\">사고\u003c/b>로 바다에 빠지면서 오리는 바다 한가운데를 떠돌게 되었다. 앞에서 던진 \u003cb class=\"key\">질문\u003c/b>에 대한 답이 마지막 두 문장에서 완성된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 크게 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 오리의 자기소개예요. 오리는 자기가 플라스틱 오리이고 목욕 장난감이라고 말해요. 그런데 갑자기 But look 하면서 자기는 목욕탕에 있지 않고 바다 한가운데에 있다고 상황을 뒤집죠. 이 도입부에서 우리는 오리의 현재 위치를 알게 되고, 글 전체가 오리의 실제 처지를 보여 주는 방식으로 시작한다는 걸 느끼게 돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 질문이에요. 오리가 이렇게 바다 한가운데까지 오게 된 경로를 독자에게 묻는 부분이죠. How did I get here라는 이 질문이 글 전체를 끌고 가는 중심 질문이에요. 덕분에 뒤에 이어지는 설명이 모두 이 질문에 대한 답이라는 것을 알 수 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 오리가 어디서 왔는지, 그리고 왜 플라스틱으로 만들어졌는지 설명해요. 오리는 다른 오리들과 함께 공장에서 왔고, 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 오리를 만들었어요. 여기서 because가 이유를 알려 주는 신호어로 쓰인다는 점을 꼭 기억해 두세요. 가볍고 오래 간다는 이 특징이 뒤에 나오는 사고와도 자연스럽게 연결돼요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 사고가 난 부분이에요. 사람들이 오리를 상자 속에 넣었고, 그 상자들이 바다로 나갔는데 사고로 바다에 빠졌어요. 그래서 지금 오리가 바다 한가운데를 떠돌고 있는 거죠. 앞에서 던진 질문에 대한 답이 바로 마지막 두 문장에서 완성된다는 점이 이 글의 핵심이에요. 여기서 But은 예상과 다른 결과를 알려 주는 반전의 신호로 쓰였어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 화자의 현재 상황을 먼저 보여 주고 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 던진 뒤, 그 답을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 풀어 놓는 \u003cb class=\"key\">질문-답변\u003c/b> 구조로 되어 있다. 핵심 내용인 사고와 표류가 마지막 문장에서 완성되므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 또한 공장에서 만들어져 상자에 담기고 바다로 나가 빠지는 과정이 순서대로 제시되어 \u003cb class=\"key\">시간순\u003c/b> 전개가 함께 나타난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>How (6)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>because (8)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>반전·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a plastic duck\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bath toy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">we\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>목욕탕 속 목욕 장난감\u003c/th>\u003cth>바다 한가운데의 플라스틱 오리\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사람과 함께 있는 익숙한 장소\u003c/td>\u003ctd>사고로 떠내려간 낯선 장소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>원래의 쓰임과 역할\u003c/td>\u003ctd>사고 이후의 실제 상황\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답변 구조예요. 먼저 오리의 현재 상황을 보여 주고, 어떻게 여기에 오게 됐는지 질문을 던진 뒤, 그 답을 시간 순서대로 풀어 놓죠. 핵심 내용이 뒤쪽에서 완성되기 때문에 미괄식 구조로 볼 수 있어요. 그래서 글을 읽을 때는 질문이 나오는 지점과 그 답이 나오는 지점을 짝지어 기억하는 게 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 앞부분에 나오는 But은 독자의 예상을 뒤집는 전환 신호예요. 그리고 How did I get here라는 의문문이 질문을 던지는 신호이고, because는 이유를 붙여 주는 신호, 마지막의 But은 사고라는 반전을 알려 주는 신호예요. 또 바다를 가리키는 표현이 the ocean, out to sea, the ocean으로 반복되면서 같은 내용을 바꿔 말하고 있다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>플라스틱의, 플라스틱제의\u003c/span>\u003c/div>\u003cdiv>\u003cb>duck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오리\u003c/span>\u003c/div>\u003cdiv>\u003cb>bath\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목욕\u003c/span>\u003c/div>\u003cdiv>\u003cb>toy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장난감\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목욕탕, 욕실\u003c/span>\u003c/div>\u003cdiv>\u003cb>look\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다, 봐\u003c/span>\u003c/div>\u003cdiv>\u003cb>middle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가운데, 중간\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다, 대양\u003c/span>\u003c/div>\u003cdiv>\u003cb>how\u 빠지다라는 뜻이니 문장 안에서 함께 익혀 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">light\u003c/b>\u003cspan class=\"m\">가벼운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lightweight\u003c/span>\u003cspan class=\"s\">slight\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">heavy\u003c/span>\u003cspan class=\"a\">weighty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">long\u003c/b>\u003cspan class=\"m\">오래, 길게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lengthy\u003c/span>\u003cspan class=\"s\">prolonged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">short\u003c/span>\u003cspan class=\"a\">brief\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">middle\u003c/b>\u003cspan class=\"m\">가운데\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">center\u003c/span>\u003cspan class=\"s\">core\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">edge\u003c/span>\u003cspan class=\"a\">side\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">put\u003c/b>\u003cspan class=\"m\">넣다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">place\u003c/span>\u003cspan class=\"s\">set\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take out\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">last\u003c/b>\u003cspan class=\"m\">오래가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continue\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fall into\u003c/b>\u003cspan class=\"m\">~로 떨어지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">drop into\u003c/span>\u003cspan class=\"s\">plunge into\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003cspan class=\"a\">climb\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accident\u003c/b>\u003cspan class=\"m\">사고\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mishap\u003c/span>\u003cspan class=\"s\">crash\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. light는 가벼운이라는 뜻이라서 lightweight, slight 같은 동의어가 있고 반대말은 heavy예요. long은 오래라는 뜻으로 lengthy, prolonged와 가깝고 반대말은 short죠. middle은 가운데라는 뜻이라서 center, core와 바꿔 쓸 수 있고 반대말은 edge, side예요. put은 place, set과 비슷하고 take out, remove와 반대되고, accident는 mishap, crash와 가까운 표현이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕!\u003c/span>\u003cspan class=\"en\">Hi!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 플라스틱 오리가 독자에게 \u003cb class=\"key\">인사말\u003c/b>을 건네며 이야기를 여는 대목입니다. 아주 짧은 한마디로 \u003cb class=\"key\">친근한 \u003c/b>\u003cb class=\"key\">말투\u003c/b>를 만들기 때문에, 독자는 이 장난감이 어떤 이야기를 들려줄지 궁금해하며 다음 문장을 읽게 됩니다.\u003c/div>","segs":[{"n":12,"text":"Hi!, 안녕!. 이 문장 전체를 해석하면, 안녕!","hl":"m"},{"n":13,"text":"첫 번째 문장은 플라스틱 오리가 우리에게 인사를 건네는 부분이에요. 짧은 인사말 하나로 친근한 말투가 만들어지고, 독자는 이 오리가 무슨 이야기를 들려줄지 궁금해하게 되죠.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 플라스틱 오리이고\u003c/span>\u003cspan class=\"en\">I am \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003cspan class=\"tgt\">duck\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 목욕 장난감이야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bath \u003c/span>\u003cspan class=\"tgt\">toy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 플라스틱 오리이고 목욕 장난감이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 자기 \u003cb class=\"key\">정체\u003c/b>를 밝히는 문장입니다. \u003cb class=\"key\">플라스틱\u003c/b>으로 만들어진 \u003cb class=\"key\">목욕 \u003c/b>\u003cb class=\"key\">장난감\u003c/b>이라는 두 가지 정보를 and로 나란히 붙여, 아주 평범한 장난감이라는 점을 먼저 못 박아 둡니다. 그래서 뒤에서 바다 한가운데에 있다는 반전이 더 크게 다가옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정관사 a + 형용사 + 명사\u003c/span> : [부정관사 a] + [형용사 plastic] + [명사 duck] : \"플라스틱 오리 한 마리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [문장 I am a plastic duck] + [and] + [문장 I am a bath toy] : \"그리고 나는 목욕 장난감이야\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"I am a plastic duck, 나는 플라스틱 오리이고. and I am a bath toy, 그리고 나는 목욕 장난감이야.. 이 문장 전체를 해석하면, 나는 플라스틱 오리이고 목욕 장난감이야.","hl":"m"},{"n":15,"text":"두 번째 문장은 이 오리가 자기 정체를 밝히는 부분이에요. 나는 플라스틱 오리이고, 목욕 장난감이야, 라고 두 가지 정보를 나란히 말하죠. 플라스틱으로 만들어졌고 목욕 장난감이라는 아주 평범한 장난감이라는 걸 먼저 알려 주는 거예요. 이 평범함이 뒤에서 바다 한가운데에 있다는 반전을 더 크게 만들어 줍니다.","hl":"mn"},{"n":16,"text":"먼저 a plastic duck을 보세요. 처음 꺼내는 하나의 대상에는 부정관사 a를 쓰고, 그 뒤에 형용사 plastic이 명사 duck을 꾸며 줍니다. 그래서 플라스틱 오리 한 마리가 되는 거예요. 다음으로 and I am a bath toy를 보면, 문장과 문장을 and로 이어 병렬 구조를 만들었어요. 앞의 나는 플라스틱 오리이다에 나는 목욕 장난감이다를 대등하게 붙여 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">봐!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 봐!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 한 자기 소개를 뒤집는 \u003cb class=\"key\">전환\u003c/b>의 문장입니다. '목욕 장난감'이라는 평범한 정보에 \u003cb class=\"key\">하지만\u003c/b>을 붙여 독자의 시선을 확 끌어당기고, 뒤에 이어질 놀라운 상황을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 look] + [주어 you 생략] : \"봐\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"But, 하지만. look!, 봐!. 이 문장 전체를 해석하면, 하지만, 봐!","hl":"m"},{"n":18,"text":"세 번째 문장은 앞의 자기 소개를 뒤집는 전환의 문장이에요. 나는 목욕 장난감이라고 했는데, 하지만 봐! 하고 독자의 시선을 확 끌어당기는 거죠. 그래서 다음 문장에서 나올 놀라운 상황이 훨씬 궁금해집니다.","hl":"mn"},{"n":19,"text":"여기서 짚을 어법은 명령문이에요. 상대에게 뭘 하라고 할 때는 주어 you를 생략하고 동사원형으로 시작하죠. 그래서 look 하나만으로도 봐, 라는 명령이 되는 거예요. 짧게 던지듯 말해서 독자의 눈을 확 끌어당기는 효과까지 얻고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 있지 않아요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목욕탕 안에\u003c/span>\u003cspan class=\"en\">in a bathroom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 목욕탕에 있지 않아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 자신을 목욕 장난감 오리라고 소개한 화자가 \u003cb class=\"key\">부정문\u003c/b>으로 '목욕탕에 있지 않다'고 말하는 문장이에요. 바로 앞의 \u003cb class=\"key\">But \u003c/b>\u003cb class=\"key\">look!\u003c/b>에 이어 독자의 시선을 끌고, 다음 문장에서 진짜 장소를 밝히기 전에 \u003cb class=\"key\">반전\u003c/b>을 준비하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 부정문\u003c/span> : 주어 + be동사 + [[not]] + 전치사구(~에 있다) : \"~에 있지 않다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"I am not, 나는 있지 않아요. in a bathroom, 목욕탕 안에. 이 문장 전체를 해석하면, 나는 목욕탕에 있지 않아.","hl":"m"},{"n":21,"text":"여기서 화자는 be동사에 not을 붙여서 목욕탕에 있지 않다고 말하고 있어요. 앞에서 자기가 목욕 장난감 오리라고 했으니까 당연히 목욕탕에 있을 것 같죠. 그런데 아니라고 하면서 독자에게 반전을 준비하는 문장이에요.","hl":"mn"},{"n":22,"text":"첫 번째로, am not을 눈여겨보세요. be동사 뒤에 not을 붙이면 부정문이 되고, 여기서는 in a bathroom이라는 전치사구를 부정하는 거예요. 그래서 나는 목욕탕 안에 있지 않다는 뜻이 됩니다. 두 번째로, in a bathroom에서 in은 장소를 나타내는 전치사이고, bathroom 앞에 a가 붙어서 막연한 하나의 목욕탕을 가리킨다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 있어요\u003c/span>\u003cspan class=\"en\">I am\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한가운데에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">middle \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 바다 한가운데 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 목욕탕이 아니라고 한 화자가 자신이 실제로 있는 곳을 밝히는 문장이에요. \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>라는 표현으로 장난감 오리의 위치가 얼마나 엉뚱하고 극적인지 강조하고, 뒤에 이어질 사고 이야기의 무대를 \u003cb class=\"key\">배경\u003c/b>으로 깔아 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용 표현(in the middle of)\u003c/span> : in the middle of + [[명사]](~의 한가운데에) : \"~의 한가운데에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the의 용법\u003c/span> : the + [[명사]](특정한 대상) : \"그 바다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"I am, 나는 있어요. in the middle, 한가운데에. of the ocean, 바다의. 이 문장 전체를 해석하면, 나는 바다 한가운데 있어.","hl":"m"},{"n":24,"text":"앞에서 목욕탕이 아니라고 했죠. 이번에는 진짜 장소를 밝히는데, 바로 바다 한가운데예요. 목욕 장난감 오리가 바다 한가운데에 있다는 설정이 얼마나 엉뚱하고 충격적인지 강조하는 문장이에요.","hl":"mn"},{"n":25,"text":"첫 번째로, in the middle of는 한가운데라는 뜻으로 통째로 외워 두는 전치사구 표현이에요. 여기서는 바다라는 장소를 꾸며 주고 있죠. 두 번째로, the ocean처럼 정관사 the가 붙으면 그냥 바다가 아니라 문맥에서 특정한 그 바다를 가리킨다는 느낌이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 오게 됐을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">here\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 여기에 어떻게 오게 됐을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 스스로도 이해가 안 된다는 듯 던지는 \u003cb class=\"key\">의문문\u003c/b>이에요. '어떻게 내가 여기에 오게 됐을까'라고 물으면서, 뒤에서 공장과 배, 사고로 이어지는 이야기를 자연스럽게 \u003cb class=\"key\">이끌어 \u003c/b>\u003cb class=\"key\">내는\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문(도치)\u003c/span> : [[의문사]] + 조동사 + 주어 + [[동사원형]] : \"어떻게 내가 ~했을까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 get + 부사 here\u003c/span> : get(도착하다) + [[here]](여기에) : \"여기에 오다, 여기에 도착하다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"How, 어떻게. did I get, 내가 오게 됐을까. here?, 여기에. 이 문장 전체를 해석하면, 내가 여기에 어떻게 오게 됐을까?","hl":"m"},{"n":27,"text":"화자가 스스로도 이해가 안 된다는 듯이 던지는 의문문이에요. 어떻게 내가 여기에 오게 됐을까 하고 물으면서, 다음 문장에서 공장과 배 이야기로 자연스럽게 넘어가게 해 주는 질문이에요.","hl":"mn"},{"n":28,"text":"첫 번째로, How did I get here는 의문사가 앞에 나오면서 조동사 did와 주어 I가 자리를 바꾸는 도치가 일어난 의문문이에요. did 뒤에는 반드시 동사원형 get이 온다는 것도 꼭 기억하세요. 두 번째로, get here에서 get은 여기에 도착하다라는 뜻의 자동사이고, here는 여기라는 부사예요. 그래서 어떻게 여기에 오게 됐을까라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~였다 / 나는 ~출신이었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공장에서\u003c/span>\u003cspan class=\"en\">from a factory\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 오리들과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">ducks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 다른 오리들과 함께 공장에서 왔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 어디서 왔는지 밝히는 문장이에요. be from은 \u003cb class=\"key\">출신\u003c/b>을 나타내는 표현이라 '공장 출신', 즉 공장에서 만들어져 나왔다는 뜻이죠. with other ducks는 '다른 오리들과 \u003cb class=\"key\">함께\u003c/b>'라는 동반의 의미예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 과거형(was)\u003c/span> : [주어 I] + [was (be동사 과거형)] + [from ~ (출신)] : \"나는 ~였다 / 나는 ~출신이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with (동반·함께)\u003c/span> : [with + 명사] = ~와 함께 : \"다른 오리들과 함께\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"I was, 나는 ~였다 / 나는 ~출신이었다. from a factory, 공장에서. with other ducks, 다른 오리들과 함께. 이 문장 전체를 해석하면, 나는 다른 오리들과 함께 공장에서 왔어.","hl":"m"},{"n":30,"text":"이 문장은 내가 어디서 왔는지 밝히는 문장이에요. be from은 출신을 나타내는 표현이라, 공장 출신, 즉 공장에서 만들어져 나왔다는 뜻이죠. with other ducks는 다른 오리들과 함께라는 동반의 의미예요.","hl":"mn"},{"n":31,"text":"첫 번째로 was를 보세요. 주어 I에 맞는 be동사의 과거형은 was예요. 지금이 아니라 과거의 상태를 말하니까 was를 씁니다. 두 번째로 with other ducks, 여기서 with는 동반을 나타내는 전치사예요. 그래서 다른 오리들과 함께라고 해석하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 우리를 만들었어\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">plastic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것은 가볍기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 오래 가기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lasts \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 우리를 무엇으로, 왜 만들었는지 알려 주는 문장이에요. 플라스틱이 \u003cb class=\"key\">가볍고\u003c/b> 오래 가서 \u003cb class=\"key\">재료\u003c/b>로 선택됐다는 뜻이죠. 여기서 it은 앞에 나온 \u003cb class=\"key\">plastic\u003c/b>을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">make + 목적어 (3형식)\u003c/span> : make [타동사] + [us (목적어)] + [with plastic (재료)] : \"우리를 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with (재료·도구)\u003c/span> : [with + 재료명사] = ~로, ~을 가지고 : \"플라스틱으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because\u003c/span> : [because + 주어 + 동사] = 왜냐하면 ~이기 때문에 : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">대명사 it + 병렬 구조\u003c/span> : [it (앞 명사 지칭)] + [is light] and [lasts long] : \"그것은 가볍고 오래 간다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"People made us, 사람들은 우리를 만들었어. with plastic, 플라스틱으로. because it is light, 왜냐하면 그것은 가볍기 때문에. and lasts long, 그리고 오래 가기 때문에. 이 문장 전체를 해석하면, 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.","hl":"m"},{"n":33,"text":"이 문장은 사람들이 우리를 무엇으로, 왜 만들었는지 알려 줘요. plastic은 가볍고 오래 간다는 장점 때문에 재료로 선택됐다는 거죠. 여기서 it은 앞에 나온 plastic을 가리켜요.","hl":"mn"},{"n":34,"text":"첫 번째, made us를 보세요. make는 만들다라는 타동사라 뒤에 목적어 us가 와요. 무엇으로 만들었는지는 with plastic이 알려 줍니다. 두 번째, with plastic에서 with는 재료를 나타내는 전치사예요. 그래서 플라스틱으로라고 해석하죠. 세 번째, because는 이유를 이끄는 접속사예요. 네 번째, it is light and lasts long에서 it은 앞의 plastic을 받는 대명사이고, is light와 lasts long이 and로 나란히 연결된 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 우리를 넣었어\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 속에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">boxes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리는 나갔지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> we \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 바다로 나가게 된 \u003cb class=\"key\">과정\u003c/b>을 이어 주는 문장이에요. 사람들이 상자에 담았고, 그 상자가 \u003cb class=\"key\">바다\u003c/b>로 향했다는 흐름이죠. 바로 다음 문장에서 상자가 사고로 바다에 빠진다고 이어지니, 여기가 사건의 시작점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">put + 목적어 (3형식)\u003c/span> : put [타동사] + [us (목적어)] + [in boxes (장소)] : \"우리를 넣었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in (장소·안)\u003c/span> : [in + 명사] = ~안에 : \"상자 속에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and (두 절 연결)\u003c/span> : [절] + and + [절] : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용 표현 go out to sea\u003c/span> : [go out to + the sea] = 바다로 나가다 : \"바다로 나갔지\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"People put us, 사람들은 우리를 넣었어. in boxes, 상자 속에. and we went out, 그리고 우리는 나갔지. to sea, 바다로. 이 문장 전체를 해석하면, 사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지.","hl":"m"},{"n":36,"text":"이 문장은 우리가 바다로 나가게 된 과정을 이어 줘요. 사람들이 상자에 담았고, 그 상자가 바다로 향했다는 흐름이죠. 바로 다음 문장에서 상자가 사고로 바다에 빠진다고 이어지니, 여기가 사건의 시작점이에요.","hl":"mn"},{"n":37,"text":"첫 번째, put us에서 put은 넣다라는 타동사라 뒤에 목적어 us가 와요. 두 번째, in boxes에서 in은 안을 나타내는 전치사라 상자 속에라고 해석해요. 세 번째, and는 두 절을 대등하게 이어 주는 등위접속사예요. 앞 절과 뒤 절이 나란히 연결되죠. 네 번째, went out to sea는 바다로 나가다라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 상자들이\u003c/span>\u003cspan class=\"en\">the boxes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다에 빠진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">fell\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사고로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">accident\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그 상자들이 사고로 바다에 빠진 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 상자들이 왜 바다에 있게 되었는지 그 \u003cb class=\"key\">원인\u003c/b>을 밝혀 주는 문장이에요. \u003cb class=\"key\">사고\u003c/b> 때문에 상자들이 \u003cb class=\"key\">바다\u003c/b>로 빠졌다는 뜻으로, 앞에서 나온 플라스틱 오리들이 어떻게 넓은 바다를 떠돌게 되었는지 이어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형(불규칙 변화)\u003c/span> : fall(원형) - fell(과거) - fallen(과거분사) : \"빠졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 into의 이동·방향 표현\u003c/span> : fall [자동사] + into + [명사(장소)] : \"바다 속으로 (빠지다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(원인·상황)\u003c/span> : 주어 + 동사 + [in + 명사] (부사구) : \"사고로\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"But, 그러나. the boxes, 그 상자들이. fell into the ocean, 바다에 빠진. in an accident, 사고로. 이 문장 전체를 해석하면, 그러나 그 상자들이 사고로 바다에 빠진 거야.","hl":"m"},{"n":39,"text":"이 문장은 상자들이 왜 바다에 있게 됐는지 그 원인을 알려 줘요. 사고 때문에 상자들이 바다로 빠졌다는 거죠. 그래서 플라스틱 오리들이 넓은 바다를 떠돌게 된 거예요.","hl":"mn"},{"n":40,"text":"먼저 fell은 fall의 과거형이에요. fall은 fell, fallen으로 변하는 불규칙 동사라서 꼭 외워 두세요. 두 번째로 into는 밖에서 안으로 움직이는 방향을 나타내는 전치사예요. 그래서 fell into the ocean은 바다 속으로 빠졌다는 뜻이 돼요. 마지막으로 in an accident는 사고로라는 뜻으로, 왜 빠졌는지 그 원인을 설명해 주는 부사구예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">오리\u003c/b>이자 \u003cb class=\"key\">목욕 \u003c/b>\u003cb class=\"key\">장난감\u003c/b>이지만 지금은 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>에 있다.\u003c/li>\u003cli>화자는 자신이 어떻게 여기에 오게 되었는지 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 던진다.\u003c/li>\u003cli>화자는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">오리들\u003c/b>과 함께 \u003cb class=\"key\">공장\u003c/b>에서 왔고, 사람들은 \u003cb class=\"key\">가볍고 \u003c/b>\u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">가기\u003c/b> 때문에 플라스틱으로 오리를 만들었다.\u003c/li>\u003cli>오리는 \u003cb class=\"key\">상자\u003c/b>에 담겨 바다로 나갔지만, 상자들이 \u003cb class=\"key\">사고\u003c/b>로 바다에 빠지면서 바다를 떠돌게 되었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>요지: A plastic bath toy duck explains how it ended up floating in the middle of the ocean.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 플라스틱 목욕 장난감인 오리가 \u003cb class=\"key\">공장\u003c/b>에서 만들어져 \u003cb class=\"key\">상자\u003c/b>에 담긴 채 바다로 나갔다가, \u003cb class=\"key\">사고\u003c/b>로 상자가 바다에 빠지면서 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">한가운데\u003c/b>를 떠돌게 되었다는 이야기이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 글은 목욕 장난감 오리가 공장에서 만들어져 상자에 담겨 바다로 나갔다가 사고로 바다에 빠져 바다 한가운데를 떠돌게 된 이야기였어요. 질문으로 시작해서 시간 순서대로 답을 완성하는 미괄식 구조, 그리고 But과 because 같은 신호어를 잘 기억해 두세요. 가볍고 오래 가는 플라스틱의 특징이 오리의 운명을 결정했다는 점도 함께 기억하면 좋겠어요. 오늘도 수고 많았고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
