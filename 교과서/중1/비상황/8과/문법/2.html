\">나는 그녀가 나를 좋아한다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">that절이 동사 think의 목적어 자리에 왔어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>that절이 주어로 쓰이면 절 전체를 \u003cb class=\"key\">하나의 명사\u003c/b>처럼 보고 \u003cb class=\"key\">덩어리\u003c/b>로 해석하는 습관이 중요해요.\u003c/div>","segs":[{"n":2,"text":"오늘의 핵심은 접속사 that이 이끄는 절이 통째로 명사처럼 쓰인다는 점이에요. 명사가 할 수 있는 일, 그러니까 주어 자리와 보어 자리, 목적어 자리에 that절이 들어갈 수 있어요. 그래서 that절이 문장 앞에 오면 주어, be동사 뒤에 오면 보어, 일반동사 뒤에 오면 목적어 역할을 하게 되죠. 이 세 가지만 구분해도 오늘 문법의 절반은 끝난 셈이에요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. That they won the race is true. 뜻은 그들이 경주에서 우수한 것은 사실이다예요. 여기서 That they won the race 전체가 주어 역할을 하고 뒤에 is true가 이어지고 있죠. 그래서 that절이 주어 자리에 들어간 경우예요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. The important thing is that I trust you. 뜻은 중요한 것은 내가 너를 믿는다는 것이다예요. be동사 is 뒤에 that절이 와서 주어의 내용을 설명해 주고 있어요. 이렇게 be동사 뒤에서 주어를 설명해 주면 보어 역할을 하는 거예요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문이에요. I think that she likes me. 뜻은 나는 그녀가 나를 좋아한다고 생각한다예요. 동사 think 뒤에 that절이 와서 생각의 내용을 채워 주고 있으니 목적어 역할이에요. 이렇게 동사 뒤에서 내용을 채워 주는 that절을 가장 자주 만나게 될 거예요.","hl":"ex-2"},{"n":6,"text":"that절이 주어로 나오면 절 전체를 하나의 명사처럼 봐야 해요. 길게 늘어놓고 해석하면 헷갈리니까 덩어리로 묶어서 읽는 습관을 들여 봐요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">that 다음에는 주어와 동사가 한 쌍으로 온다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사 that 다음에는 반드시 \u003cb class=\"key\">주어 + 동사\u003c/b> 순서의 절이 이어져요. 이때 that은 특별한 뜻이 없이 절을 명사처럼 만들어 주는 \u003cb class=\"key\">접속사\u003c/b> 역할만 해요. 그래서 해석할 때 that은 보통 '~라는 것'으로 자연스럽게 옮겨요.\u003cdiv>\u003cspan class=\"g-formula\">that + 주어 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I knew \u003cspan class=\"fx\">that we did our best\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 우리가 최선을 다했다는 것을 알았다.\u003c/div>\u003cdiv class=\"g-note\">that 뒤에 주어 we와 동사 did가 이어져요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I think \u003cspan class=\"fx\">that he is busy now\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 지금 바쁘다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">that 뒤에 he is라는 주어와 동사가 와요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I believe \u003cspan class=\"fx\">that the story is true\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 이야기가 진실이라고 믿는다.\u003c/div>\u003cdiv class=\"g-note\">that은 뜻 없이 절을 명사로 만들어 줄 뿐이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>that 뒤에 \u003cb class=\"key\">주어 + 동사\u003c/b>가 보이지 않으면 접속사가 아니라 \u003cb class=\"key\">지시대명사\u003c/b>나 \u003cb class=\"key\">지시형용사\u003c/b>일 수 있어요.\u003c/div>","segs":[{"n":7,"text":"접속사 that 다음에는 주어와 동사가 한 쌍으로 반드시 나와요. that 자체에는 뜻이 거의 없고, 뒤에 오는 절을 명사처럼 만들어 주는 역할만 하죠. 그래서 해석할 때는 that을 '~라는 것' 정도로 자연스럽게 받아들이면 돼요. 이때 that 뒤에 주어와 동사가 제대로 보이는지 확인하는 습관이 아주 중요해요.","hl":"rule"},{"n":8,"text":"첫 번째 예문이에요. I knew that we did our best. 뜻은 나는 우리가 최선을 다했다는 것을 알았다예요. that 뒤에 주어 we와 동사 did가 한 쌍으로 잘 나오고 있죠. knew의 목적어로 that절이 통째로 들어간 모습이에요.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. I think that he is busy now. 뜻은 나는 그가 지금 바쁘다고 생각한다예요. that 뒤에 주어 he와 동사 is가 나오고 뒤에 busy now가 이어지죠. 이렇게 that 다음에 주어와 동사가 보이면 접속사 that이라고 생각하면 돼요.","hl":"ex-1"},{"n":10,"text":"세 번째 예문이에요. I believe that the story is true. 뜻은 나는 그 이야기가 진실이라고 믿는다예요. 여기서 that은 따로 해석되지 않고 뒤의 the story is true를 명사처럼 묶어 주는 역할만 해요. 그래서 believe의 목적어로 깔끔하게 들어가죠.","hl":"ex-2"},{"n":11,"text":"만약 that 뒤에 주어와 동사가 보이지 않는다면 접속사가 아닐 수 있어요. 그럴 때는 지시대명사나 지시형용사로 쓰인 that인지 한 번 더 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">목적어로 온 that은 생략할 수 있다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사 \u003cb class=\"key\">know, think, believe\u003c/b> 처럼 생각이나 말을 나타내는 동사의 목적어로 that절이 오면 접속사 that을 \u003cb class=\"key\">생략\u003c/b>할 수 있어요. 회화에서는 that을 빼고 말하는 경우가 아주 많아요. 다만 생략해도 절의 \u003cb class=\"key\">주어 + 동사\u003c/b>는 그대로 남아요.\u003cdiv>\u003cspan class=\"g-formula\">know / think / believe + (that) + 주어 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I didn't know \u003cspan class=\"fx\">(that) he was absent yesterday\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 어제 결석했다는 것을 몰랐다.\u003c/div>\u003cdiv class=\"g-note\">know의 목적어로 온 that은 생략할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I think \u003cspan class=\"fx\">(that) vegetables are good for health\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 채소가 건강에 좋다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">think 뒤의 that도 생략할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I believe \u003cspan class=\"fx\">(that) he will keep his promise\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 약속을 지킬 것을 믿는다.\u003c/div>\u003cdiv class=\"g-note\">believe 뒤의 that 역시 생략할 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>that을 생략해도 \u003cb class=\"key\">해석\u003c/b>은 그대로이지만, 절의 \u003cb class=\"key\">주어\u003c/b>를 놓치지 않도록 동사 앞의 주어를 꼭 찾아요.\u003c/div>","segs":[{"n":12,"text":"이번에는 that을 빼도 되는 경우를 배워 볼게요. know나 think, believe, hope, imagine, tell, say 같은 동사 뒤에 that절이 목적어로 오면 that을 생략할 수 있어요. 실제로 회화에서는 that을 빼고 말하는 경우가 훨씬 많답니다. 다만 that을 빼도 절의 주어와 동사는 그대로 남아 있다는 점을 꼭 기억해요.","hl":"rule"},{"n":13,"text":"첫 번째 예문이에요. I didn't know that he was absent yesterday. 뜻은 나는 그가 어제 결석했다는 것을 몰랐다예요. 여기서 that은 넣어도 되고 빼도 되는 자리이고, 빼도 뜻은 똑같아요. know 뒤에 목적어로 that절이 왔기 때문에 생략이 가능한 거예요.","hl":"ex-0"},{"n":14,"text":"두 번째 예문이에요. I think that vegetables are good for health. 뜻은 나는 채소가 건강에 좋다고 생각한다예요. think 뒤에 that을 그대로 두어도 되고 빼도 자연스러워요. 대신 that을 빼면 vegetables are good for health가 바로 이어지니 주어를 놓치지 않도록 해요.","hl":"ex-1"},{"n":15,"text":"세 번째 예문이에요. I believe that he will keep his promise. 뜻은 나는 그가 약속을 지킬 것을 믿는다예요. believe도 목적어로 that절을 데려오는 동사라서 that을 생략할 수 있어요. that을 빼고 I believe he will keep his promise라고 말해도 전혀 문제가 없어요.","hl":"ex-2"},{"n":16,"text":"that을 생략해도 해석은 달라지지 않아요. 대신 절의 주어를 놓치면 문장이 이상하게 읽히니까 동사 앞에서 주어를 꼭 찾아 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">that의 다양한 쓰임 구별하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">that은 접속사 말고도 여러 가지로 쓰여요. 앞의 명사를 가리키면 \u003cb class=\"key\">지시대명사\u003c/b>, 명사 앞에서 꾸미면 \u003cb class=\"key\">지시형용사\u003c/b>, 명사 뒤에서 꾸미면 \u003cb class=\"key\">관계대명사\u003c/b>예요. 뒤에 \u003cb class=\"key\">주어 + 동사\u003c/b>의 절이 이어지고 그 절이 통째로 명사 역할을 하면 명사절 접속사예요.\u003cdiv>\u003cspan class=\"g-formula\">지시대명사 / 지시형용사 / 명사절 접속사 / 관계대명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">That\u003c/span> is a car.\u003c/div>\u003cdiv class=\"g-ko\">저것은 자동차이다.\u003c/div>\u003cdiv class=\"g-note\">여기서 That은 지시대명사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">That man\u003c/span> is my uncle.\u003c/div>\u003cdiv class=\"g-ko\">저 사람은 나의 삼촌이다.\u003c/div>\u003cdiv class=\"g-note\">명사 man을 꾸미는 지시형용사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I imagine \u003cspan class=\"fx\">that we will have a lot of fun at the party\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 우리가 파티에서 아주 재미있게 보낼 것이라고 상상해.\u003c/div>\u003cdiv class=\"g-note\">that절이 imagine의 목적어로 쓰인 명사절 접속사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I bought a phone \u003cspan class=\"fx\">that is expensive\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 비싼 핸드폰을 샀다.\u003c/div>\u003cdiv class=\"g-note\">앞의 명사 phone을 꾸며 주는 관계대명사 that이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>같은 that이라도 앞에 \u003cb class=\"key\">명사\u003c/b>가 있는지, 뒤에 \u003cb class=\"key\">주어 + 동사\u003c/b>의 절이 이어지는지로 쓰임을 구별해요.\u003c/div>","segs":[{"n":17,"text":"마지막으로 that의 다양한 쓰임을 정리해 볼게요. that은 접속사로만 쓰이는 게 아니라 지시대명사, 지시형용사, 관계대명사로도 쓰여요. 뒤에 주어와 동사가 있는 절이 이어지고 그 절이 통째로 명사 역할을 하면 명사절 접속사라고 보면 돼요. 앞에 명사가 있고 그 명사를 꾸며 주면 관계대명사, 명사 없이 혼자 쓰이면 지시대명사예요. 이렇게 주변을 살펴보면 that의 쓰임이 보인답니다.","hl":"rule"},{"n":18,"text":"첫 번째 예문이에요. That is a car. 뜻은 저것은 자동차이다예요. 여기서 That은 혼자 쓰여서 저것이라는 뜻을 가진 지시대명사예요. 뒤에 절이 아니라 명사 a car가 바로 이어지고 있죠.","hl":"ex-0"},{"n":19,"text":"두 번째 예문이에요. That man is my uncle. 뜻은 저 사람은 나의 삼촌이다예요. 여기서 That은 명사 man 앞에서 저 사람이라는 뜻으로 꾸며 주고 있으니 지시형용사예요. 접속사 that과 모양은 같지만 하는 일이 완전히 다르죠.","hl":"ex-1"},{"n":20,"text":"세 번째 예문이에요. I imagine that we will have a lot of fun at the party. 뜻은 나는 우리가 파티에서 아주 재미있게 보낼 것이라고 상상해예요. that 뒤에 we will have라는 주어와 동사가 있는 절이 와서 imagine의 목적어 역할을 하고 있어요. 그래서 여기의 that은 명사절을 이끄는 접속사예요.","hl":"ex-2"},{"n":21,"text":"네 번째 예문이에요. I bought a phone that is expensive. 뜻은 나는 비싼 핸드폰을 샀다예요. 여기서 that은 앞에 있는 명사 phone을 꾸며 주는 관계대명사예요. 접속사 that은 명사절을 만들고, 관계대명사 that은 앞의 명사를 꾸민다는 차이를 기억해요.","hl":"ex-3"},{"n":22,"text":"같은 that이라도 앞에 명사가 있는지, 뒤에 주어와 동사가 이어지는지를 보면 쓰임이 구별돼요. 이 두 가지만 확인해도 충분해요.","hl":"tip"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I believe ____ the story is true.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003cdiv class=\"g-exp\">believe 뒤에서 the story is true라는 절을 이끌어 주는 접속사 that이 필요해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"이번에는 빈칸 문제예요. I believe 빈칸 the story is true. 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 that이에요. believe 뒤에 the story is true라는 절이 목적어로 왔으니까 절을 이끌어 주는 접속사 that이 필요해요. 물론 목적어로 온
