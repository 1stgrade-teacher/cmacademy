<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 비상(황) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 비상(황) 8과 본문1","audioDir":"1_audio","preview":false,"count":70,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>비상(황)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Running Together: Andy's Friendship Marathon\u003c/h1>\u003ch2>함께 달리다: Andy의 우정 마라톤\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 시각 장애인 Andy가 학교 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에서 가장 친한 친구 Junha와 함께 뛰며, 마라톤 전의 \u003cb class=\"key\">두려움\u003c/b>을 이겨 내고 이제는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">도전\u003c/b>을 해 보려는 자신감을 얻는 이야기이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>With his best friend's help, Andy overcomes his fear, finishes the marathon, and gains the confidence to try new things.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 비상 황 교과서 여덟 번째 과 본문이에요. 시각 장애인 소년 Andy가 우정 마라톤에 도전하는 감동적인 이야기죠. Andy는 눈이 보이지 않아 지팡이로 걷지만, 가장 친한 친구 Junha와 함께 뛰면서 두려움을 이겨 내고 새로운 도전을 결심하게 됩니다. 이 글의 요지는 친구의 도움과 동행이 두려움을 자신감으로 바꾸어 준다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">시각 장애인은 눈으로 세상을 보지 못하기 때문에 \u003cb class=\"key\">지팡이\u003c/b>(white cane)나 안내견의 도움을 받아 길을 찾아요. 이들은 \u003cb class=\"key\">점자\u003c/b>(Braille)라는 촉각 문자로 책을 읽기도 하죠. 마라톤(marathon)은 아주 긴 거리를 달리는 경주지만, 학교 행사에서는 짧은 코스로 열리기도 해요. 눈이 보이지 않는 선수는 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>(guide runner)와 끈으로 연결되어 함께 달리는 방식으로 경기에 참여해요. 마치 자전거를 처음 배울 때 옆에서 잡아 주는 사람이 있으면 두려움이 줄어드는 것과 같은 원리예요. 이렇게 한 사람의 \u003cb class=\"key\">동행\u003c/b>이 두려움을 용기로 바꿔 줄 수 있다는 점이 이 글의 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 시각 장애인은 눈으로 세상을 보지 못해서 지팡이나 안내견의 도움을 받아 길을 찾아요. 또 점자라는 촉각 문자로 책을 읽기도 하죠. 마라톤은 아주 긴 거리를 달리는 경주지만, 학교 행사에서는 짧은 코스로 열리기도 해요. 눈이 보이지 않는 선수는 가이드 러너와 끈으로 연결되어 함께 달리는 방식으로 경기에 참여해요. 자전거를 처음 배울 때 옆에서 잡아 주는 사람이 있으면 두려움이 줄어드는 것과 같은 원리죠. 이렇게 한 사람의 동행이 두려움을 용기로 바꿔 줄 수 있다는 점이 이 글의 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주인공 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자는 자신이 \u003cb class=\"key\">시각 \u003c/b>\u003cb class=\"key\">장애인\u003c/b>이라고 밝히고, \u003cb class=\"key\">지팡이\u003c/b>를 이용해 걷는다고 소개해요. 'I'm blind'와 'I walk with a stick'이라는 짧은 문장으로 주인공의 상황을 먼저 제시하는 \u003cb class=\"key\">도입\u003c/b>부예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>행사 소식과 망설임\u003csmall>문제 제기 · 문장 3–8\u003c/small>\u003c/h4>\u003cp>담임 선생님께서 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>이라는 학교 행사가 열리고 두 명이 한 팀으로 뛴다고 말씀하셔요. 모든 사람들이 그 이야기를 하고 화자도 \u003cb class=\"key\">관심\u003c/b>이 생겼지만, 'But can I run?'이라며 스스로 뛸 수 있을지 \u003cb class=\"key\">확신\u003c/b>하지 못해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>친구의 도움\u003csmall>해결 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>화자는 고민을 가장 친한 친구 \u003cb class=\"key\">준하\u003c/b>에게 털어놓아요. 준하는 'Don't worry! I'll run with you.'라고 말하며 \u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">뛰겠다\u003c/b>고 약속해요. 이 대답이 이후 이야기의 \u003cb class=\"key\">전환점\u003c/b>이 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마라톤 당일\u003csmall>절정 · 문장 12–16\u003c/small>\u003c/h4>\u003cp>마라톤 날, 두 사람은 서로의 \u003cb class=\"key\">움직임\u003c/b>을 느끼기 위해 손가락에 \u003cb class=\"key\">끈\u003c/b>을 묶어요. 화자는 친구의 말을 주의 깊게 들으며 함께 뛰고, 바람이 불어오는 느낌에 \u003cb class=\"key\">감동\u003c/b>해요. 결승선에서 모든 사람들의 응원을 받은 화자는 \u003cb class=\"key\">자랑스러움\u003c/b>을 느껴요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>달라진 결심\u003csmall>결론 · 문장 17–19\u003c/small>\u003c/h4>\u003cp>마라톤 전에는 '할 수 없다'고 생각했던 화자가 이제는 다른 것들에도 도전하고 싶어 해요. 다음에는 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">타기\u003c/b>를 해 보고 싶다고 말하며 글을 맺어요. 두려움이 \u003cb class=\"key\">자신감\u003c/b>으로 바뀐 \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 이 글의 주제예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이야기의 흐름을 다섯 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 주인공 소개예요. Andy는 자신이 시각 장애인이라고 밝히고, 지팡이를 이용해 걷는다고 말합니다. 짧은 문장 두 개로 주인공의 상황을 먼저 보여 주는 도입부인 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 행사 소식과 망설임이 나와요. 담임 선생님께서 우정 마라톤이라는 학교 행사가 열리고, 두 명이 한 팀으로 뛴다고 말씀하세요. 모든 사람들이 그 이야기를 하고 Andy도 관심이 생기지만, 과연 자기가 뛸 수 있을지 확신하지 못합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 친구의 도움이에요. Andy는 고민을 가장 친한 친구 준하에게 털어놓고, 준하는 걱정하지 말라며 자기가 함께 뛰겠다고 약속합니다. 이 대답이 이야기의 전환점이 되는 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 마라톤 당일이에요. 두 사람은 서로의 움직임을 느끼기 위해 손가락에 끈을 묶고, Andy는 친구의 말을 주의 깊게 들으며 함께 뜁니다. 바람이 불어오는 느낌에 감동하고, 결승선에서 모든 사람들의 응원을 받으며 자랑스러움을 느끼죠.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 달라진 결심이에요. 마라톤 전에는 할 수 없다고 생각했던 Andy가 이제는 다른 것들에도 도전하고 싶어 합니다. 다음에는 자전거 타기를 해 보고 싶다고 말하며 글을 맺는데, 두려움이 자신감으로 바뀐 심경 변화가 이 글의 주제예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 'One day', 'On the day of the marathon', 'Before', 'now' 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 따라 사건이 순서대로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 이야기예요. 화자가 자신의 경험을 처음부터 차례로 들려주는 \u003cb class=\"key\">일인칭 \u003c/b>\u003cb class=\"key\">시점\u003c/b> 서사죠. 글의 결론이자 \u003cb class=\"key\">주제문\u003c/b>인 'But now, I want to try other things.'가 마지막 부분에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 구성이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (3)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>So (9)\u003c/b>\u003cspan>인과·전환\u003c/span>\u003cb>On the day of the marathon (12)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>Before (17)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>But now (18)\u003c/b>\u003cspan>전환·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">two people run as a team\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I'll run with you\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ran with him\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>마라톤 전\u003c/th>\u003cth>마라톤 후\u003c/th>\u003c/tr>\u003ctr>\u003ctd>I was not sure.\u003c/td>\u003ctd>I was proud of myself.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I thought that I couldn't do it.\u003c/td>\u003ctd>I want to try other things.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순이에요. One day, On the day of the marathon, Before, now 같은 시간 표현을 따라 사건이 순서대로 이어지죠. 화자가 자신의 경험을 처음부터 차례로 들려주는 일인칭 시점의 서사이고요. 글의 결론이자 주제문인 But now, I want to try other things가 마지막 부분에 나오기 때문에 미괄식 구성이라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 어느 날을 뜻하는 One day는 시간의 전환을 알려 주고, So는 그래서 고민을 털어놓았다는 인과의 흐름을 만들어요. On the day of the marathon은 마라톤 당일로 무대를 바꾸는 시간 표현이고요. Before와 But now는 마라톤 전과 후를 대조하면서 결론으로 이끄는 신호어예요. 또 two people run as a team, I'll run with you, ran with him처럼 함께 뛴다는 개념이 표현만 바꿔 반복되는 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>blind\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시각 장애인인, 눈이 먼\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걷다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지팡이\u003c/span>\u003c/div>\u003cdiv>\u003cb>homeroom teacher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>담임 선생님\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>marathon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마라톤\u003c/span>\u003c/div>\u003cdiv>\u003cb>team\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팀, 조\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interested\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관심 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sure\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>best friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장 친한 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tie\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묶다, 매다\u003c/span>\u003c/div>\u003cdiv>\u003cb>string\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끈, 줄\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~주위에, ~둘레에\u003c/span>\u003c/div>\u003cdiv>\u003cb>finger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손가락\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다, 귀 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게, 조심스럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>blow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(바람이) 불다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결승선\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>응원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>proud\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자랑스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해 보다, 시도하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚고 갈게요. blind는 시각 장애인인, stick은 지팡이, homeroom teacher는 담임 선생님이라는 뜻이에요. interested는 관심 있는, sure는 확신하는, worry는 걱정하다라는 뜻이고요. tie는 묶다, movement는 움직임, cheer는 응원하다, proud는 자랑스러운이라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">blind\u003c/b>\u003cspan class=\"m\">시각 장애인인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sightless\u003c/span>\u003cspan class=\"s\">visually impaired\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sighted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">interested\u003c/b>\u003cspan class=\"m\">관심 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">curious\u003c/span>\u003cspan class=\"s\">fascinated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uninterested\u003c/span>\u003cspan class=\"a\">bored\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sure\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsure\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worry\u003c/b>\u003cspan class=\"m\">걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concern\u003c/span>\u003cspan class=\"s\">fret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">carefully\u003c/b>\u003cspan class=\"m\">주의 깊게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attentively\u003c/span>\u003cspan class=\"s\">cautiously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003cspan class=\"a\">recklessly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">proud\u003c/b>\u003cspan class=\"m\">자랑스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">satisfied\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ashamed\u003c/span>\u003cspan class=\"a\">embarrassed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">try\u003c/b>\u003cspan class=\"m\">해 보다, 시도하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attempt\u003c/span>\u003cspan class=\"s\">endeavor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give up\u003c/span>\u003cspan class=\"a\">quit\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. blind는 sightless나 visually impaired와 비슷하고, 반대말은 sighted예요. interested는 curious, fascinated와 가깝고 반대는 uninterested죠. sure는 certain, confident와 같고 반대는 unsure, doubtful이고요. worry는 concern과 비슷하고 반대는 relax예요. carefully는 attentively, cautiously와 같고 반대는 carelessly이고, proud는 satisfied, pleased와 비슷하고 반대는 ashamed이에요. 마지막으로 try는 attempt, endeavor와 같고 반대는 give up이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Andy의 이야기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Andy's\u003c/span> Story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 시각 장애인이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">blind.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Andy의 이야기 나는 시각 장애인이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 부분은 글의 제목 \u003cb class=\"key\">Andy's \u003c/b>\u003cb class=\"key\">Story\u003c/b>와 화자가 자신의 상태를 밝히는 첫 문장이 함께 있는 도입부예요. 화자가 자신이 \u003cb class=\"key\">시각 \u003c/b>\u003cb class=\"key\">장애인\u003c/b>이라는 정보를 먼저 제시하기 때문에, 앞으로 나올 마라톤 이야기를 이해하는 중요한 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격(명사 + 's)\u003c/span> : [사람 이름] + 's + [명사] : \"Andy의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(주격보어)\u003c/span> : [주어] + be동사 + [형용사(주격보어)] : \"나는 시각 장애인이다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Andy's Story, Andy의 이야기. I'm blind, 나는 시각 장애인이다.. 이 문장 전체를 해석하면, Andy의 이야기 나는 시각 장애인이다.","hl":"m"},{"n":14,"text":"여기는 글의 제목과 화자 소개가 함께 나오는 부분이에요. Andy라는 화자가 자신이 시각 장애인이라고 먼저 밝히고 있죠. 이 정보가 있어야 뒤에 나오는 마라톤 이야기가 훨씬 자연스럽게 이해돼요.","hl":"mn"},{"n":15,"text":"먼저 Andy's를 보세요. 사람 이름 뒤에 's를 붙이면 소유격이 되어서 Andy의라는 뜻이 돼요. 그리고 I'm blind는 be동사 am 뒤에 형용사 blind가 온 구조예요. 이때 형용사는 주어 I의 상태를 설명하는 주격보어 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 걷는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지팡이를 이용하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">stick\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 지팡이를 이용하여 걷는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시각 장애인인 화자가 평소 어떻게 이동하는지를 알려 주는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">설명\u003c/b>이에요. '지팡이'라는 구체적인 도구를 제시해서, 뒤에 나올 마라톤 장면에서 친구와 끈을 묶는 모습과 자연스럽게 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제(습관·일반적 사실)\u003c/span> : [주어] + [동사원형(현재시제)] : \"나는 걷는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with(도구·수단)\u003c/span> : [동사] + with + [도구를 나타내는 명사] : \"지팡이를 이용하여\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"I walk, 나는 걷는다. with a stick, 지팡이를 이용하여. 이 문장 전체를 해석하면, 나는 지팡이를 이용하여 걷는다.","hl":"m"},{"n":17,"text":"이 문장은 화자가 평소에 어떻게 움직이는지 알려 주는 배경 설명이에요. 지팡이를 짚고 걷는다는 구체적인 정보를 줘서, 뒤에 나오는 마라톤 장면이 더 생생하게 느껴지죠.","hl":"mn"},{"n":18,"text":"여기서는 현재시제 I walk가 눈에 띄어요. 지금 이 순간 걷는다는 뜻이 아니라 평소에 그렇게 걷는다는 습관을 나타내죠. 그리고 with a stick에서 전치사 with는 도구나 수단을 나타내서 지팡이를 이용하여라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 담임 선생님께서 말씀하셨다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">homeroom \u003c/span>\u003cspan class=\"tgt\">teacher \u003c/span>\u003cspan class=\"tgt\">said,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">&quot;There \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교 행사가,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">event, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우정 마라톤\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Friendship \u003c/span>\u003cspan class=\"tgt\">Marathon\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 나의 담임 선생님께서 “‘우정 마라톤’이라는 학교 행사가 있을 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 담임 선생님이 학교 행사 소식을 전하는 장면으로, 본격적인 \u003cb class=\"key\">사건\u003c/b>이 시작되는 지점이에요. 콤마 뒤에 Friendship Marathon이 나오면서 그 행사의 정체가 밝혀지고, 화자 Andy가 이 소식에 \u003cb class=\"key\">관심\u003c/b>을 갖게 되는 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법(say + 인용문)\u003c/span> : [주어] + say + &quot;,&quot; + [따옴표로 묶은 인용문] : \"나의 담임 선생님께서 말씀하셨다,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There be 구문 + 미래시제\u003c/span> : There + will + be + [명사(주어)] : \"있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(명사 + 명사구)\u003c/span> : [명사] + , + [같은 대상을 가리키는 명사(구)] : \"학교 행사, 즉 우정 마라톤\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"One day, 어느 날. my homeroom teacher said, 나의 담임 선생님께서 말씀하셨다. \"There will be, 있을 것이다. a school event, 학교 행사가. Friendship Marathon, 우정 마라톤. 이 문장 전체를 해석하면, 어느 날, 나의 담임 선생님께서 “‘우정 마라톤’이라는 학교 행사가 있을 거예요.","hl":"m"},{"n":20,"text":"여기서는 담임 선생님이 학교 행사 소식을 전해 주는 장면이에요. 바로 뒤에 우정 마라톤이라는 행사 이름이 나오면서 이야기가 본격적으로 시작되죠. 화자 Andy가 이 소식을 듣고 관심을 갖게 되는 출발점이 되는 문장이에요.","hl":"mn"},{"n":21,"text":"먼저 said 뒤에 따옴표가 나오죠. 이렇게 남의 말을 그대로 옮겨 적은 것을 직접화법이라고 해요. 다음으로 There will be는 유도부사 there에 be동사가 결합한 형태로, 무엇인가가 있을 것이라는 미래의 의미를 만들어 줍니다. 마지막으로 a school event 뒤에 콤마를 두고 Friendship Marathon이 이어지는데, 이건 앞에 나온 행사가 바로 우정 마라톤이라는 걸 알려 주는 동격 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 행사에서는\u003c/span>\u003cspan class=\"en\">In this event,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 명이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뛰게 됩니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">run\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 팀으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">team\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.”라고 말씀하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 선생님이 소개한 \u003cb class=\"key\">행사\u003c/b>의 규칙을 구체적으로 설명해 주는 문장이에요. 이 행사는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">명\u003c/b>이 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">팀\u003c/b>이 되어 함께 달리는 방식이라는 걸 알려 주죠. 그래서 앤디는 눈이 보이지 않아도 친구와 함께라면 달릴 수 있겠다는 생각을 하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : 복수 주어 [two people] + 동사원형 [run] : \"두 명이 뛰게 됩니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (~로서, ~으로)\u003c/span> : run [자동사] + [as a team (전치사구/부사 역할)] : \"한 팀으로\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"In this event, 이 행사에서는. two people, 두 명이. run, 뛰게 됩니다. as a team, 한 팀으로. 이 문장 전체를 해석하면, 이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.”라고 말씀하셨다.","hl":"m"},{"n":23,"text":"이 문장은 선생님께서 말씀하신 행사 규칙을 자세히 알려 주는 부분이에요. 이 행사는 두 명이 한 팀이 되어 함께 달리는 방식이라는 거죠. 그래서 앤디도 친구와 함께라면 달릴 수 있겠다는 생각을 하게 되는 거예요.","hl":"mn"},{"n":24,"text":"먼저 첫 번째 포인트는 주어와 동사의 수 일치예요. two people은 복수 주어라서 동사 run에 s를 붙이지 않아요. 두 번째 포인트는 전치사 as인데요, as a team이라고 하면 한 팀으로, 즉 팀을 이루어서라는 뜻이 됩니다. as는 이렇게 자격이나 역할을 나타낼 때 쓴다는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Everyone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">talked \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 사람들이 그것에 대해 이야기했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤 \u003cb class=\"key\">행사\u003c/b> 소식이 나온 뒤 반 전체가 그 이야기로 들썩였다는 뜻이에요. 친구들 모두가 \u003cb class=\"key\">관심\u003c/b>을 보이는 분위기 속에서 앤디도 자연스럽게 그 행사에 눈을 돌리게 되죠. 이 문장은 앤디가 마음이 움직이기 시작하는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 everyone의 수 취급\u003c/span> : Everyone [단수 취급 주어] + 단수동사 [talked] : \"모든 사람들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 talk about + 목적어\u003c/span> : talk [자동사] + about [전치사] + it [전치사 about의 목적어] : \"그것에 대해 이야기했다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Everyone, 모든 사람들이. talked about, 이야기했다. it, 그것에 대해. 이 문장 전체를 해석하면, 모든 사람들이 그것에 대해 이야기했다.","hl":"m"},{"n":26,"text":"마라톤 행사 소식이 나온 뒤에 반 친구들 모두가 그 이야기를 하고 있었다는 뜻이에요. 모두가 관심을 보이는 분위기 속에서 앤디도 자연스럽게 그 행사에 눈을 돌리게 되는 거죠.","hl":"mn"},{"n":27,"text":"먼저 talk about은 '~에 대해 이야기하다'라는 동사구예요. talk은 자동사라서 무엇에 대해 말하는지 알려 줄 때 전치사 about을 붙이고, 그 뒤에 목적어 it이 오는 구조가 되는 거예요. 그리고 everyone은 해석은 모든 사람들이라고 복수처럼 하지만 문법적으로는 단수로 취급해서 동사도 단수형이 쓰인다는 것도 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관심이 생겼다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">interested\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나도 관심이 생겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 모두 \u003cb class=\"key\">행사\u003c/b> 이야기를 하는 걸 듣고 앤디도 마음이 움직였다는 뜻이에요. 앞 문장의 분위기와 자연스럽게 이어지면서 앤디가 \u003cb class=\"key\">도전\u003c/b>을 결심하게 되는 출발점이 되죠. get interested는 '관심이 생기다'라는 뜻으로, 뒤에서 마라톤에 나가게 되는 \u003cb class=\"key\">계기\u003c/b>를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">get + 과거분사 (2형식 문장)\u003c/span> : get [동사] + interested [과거분사형 형용사/주격보어] : \"관심이 생겼다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I, 나는. also, 또한. got interested, 관심이 생겼다. 이 문장 전체를 해석하면, 나도 관심이 생겼다.","hl":"m"},{"n":29,"text":"친구들이 모두 행사 이야기를 하는 걸 듣고 앤디도 마음이 움직였다는 뜻이에요. 이 문장이 바로 앤디가 마라톤에 도전하게 되는 출발점이 되는 거죠.","hl":"mn"},{"n":30,"text":"핵심은 got interested인데요, 여기서 get은 '~하게 되다'라는 뜻으로 상태 변화를 나타내요. 그리고 뒤에 interested라는 형용사가 와서 주어인 I를 설명해 주죠. 이렇게 주어 다음에 동사, 그다음에 주격보어가 오는 구조를 2형식 문장이라고 해요. interested는 사람이 관심을 느낄 때 쓰는 과거분사형 형용사라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 뛸 수 있을까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">run?\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“하지만 내가 뛸 수 있을까?”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤 행사 이야기를 들은 앤디가 스스로에게 던진 \u003cb class=\"key\">의문문\u003c/b>이다. 모두가 이야기하고 나도 흥미가 생겼지만, 눈이 보이지 않는 자신이 정말 뛸 수 있을지 \u003cb class=\"key\">망설임\u003c/b>을 드러낸다. 이 물음이 다음 문장의 '확신할 수 없었다'로 자연스럽게 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(역접) But\u003c/span> : [앞 문장] + [But] + [주어 + 동사] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 의문문(주어-조동사 도치)\u003c/span> : [Can] + [주어 I] + [동사원형 run]? : \"내가 뛸 수 있을까?\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"But, 하지만. can I run?, 내가 뛸 수 있을까?. 이 문장 전체를 해석하면, “하지만 내가 뛸 수 있을까?”","hl":"m"},{"n":32,"text":"이 문장은 앤디가 마라톤 이야기를 들은 뒤 스스로에게 던진 의문문이에요. 앞에서는 모두가 이야기하고 나도 흥미가 생겼다고 했죠. 그런데 눈이 보이지 않는 내가 정말 뛸 수 있을까 하는 망설임이 담겨 있어요.","hl":"mn"},{"n":33,"text":"여기서 But은 앞의 흥미로운 상황과 반대되는 걱정을 이어 주는 접속사이고, 역접의 느낌을 담고 있어요. 그리고 can I run은 조동사 can이 주어 앞으로 나간 도치 형태예요. 이때 can은 능력을 나타내는 조동사라서 뒤에는 반드시 동사원형 run이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확신할 수 없었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 확신할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 7번 질문에 대한 앤디의 솔직한 \u003cb class=\"key\">심정\u003c/b>을 보여 주는 문장이다. '확신할 수 없었다'는 말은 곧 \u003cb class=\"key\">자신감\u003c/b>이 없었다는 뜻이다. 그래서 다음 문장에서 친구 \u003cb class=\"key\">준하\u003c/b>에게 이야기를 꺼내게 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 과거 부정문(주격보어 형용사)\u003c/span> : [주어 I] + [was (be동사 과거)] + [not] + [sure (형용사 보어)] : \"확신할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I, 나는. was not sure, 확신할 수 없었다.. 이 문장 전체를 해석하면, 나는 확신할 수 없었다.","hl":"m"},{"n":35,"text":"이 문장은 앤디가 스스로에게 물은 질문에 대한 솔직한 심정이에요. 바로 앞에서 뛸 수 있을까 하고 물었지만, 스스로 확신할 수 없었다는 뜻이죠. 이 자신감 없는 마음 때문에 다음 문장에서 친구 준하에게 이야기를 꺼내게 되는 거예요.","hl":"mn"},{"n":36,"text":"was not sure는 be동사 was 뒤에 not을 붙여 만든 부정문이에요. 그리고 sure는 주어 I의 상태를 설명하는 주격보어로 쓰였죠. be동사 부정문은 이렇게 be동사 바로 뒤에 not을 넣는다고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것에 대해 이야기했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">talked \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 가장 친한 친구와\u003c/span>\u003cspan class=\"en\">with \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">friend, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준하와.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Junha\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 확신이 없던 앤디가 혼자 고민하지 않고 가장 친한 친구 \u003cb class=\"key\">준하\u003c/b>에게 먼저 \u003cb class=\"key\">도움\u003c/b>을 청한 문장이다. 여기서 it은 앞에 나온 마라톤과 '뛸 수 있을까'라는 고민을 가리킨다. 이 \u003cb class=\"key\">대화\u003c/b>가 이후 둘이 함께 달리는 사건으로 이어지는 출발점이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 So(결과)\u003c/span> : [앞 문장] + [So] + [주어 + 동사] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about + 목적격 대명사\u003c/span> : [talk (자동사)] + [about + 목적어 it] : \"그것에 대해 이야기하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(콤마로 연결된 명사)\u003c/span> : [명사구 my best friend] + [,] + [Junha (동격 명사)] : \"나의 가장 친한 친구인 준하\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"So, 그래서. I talked about it, 나는 그것에 대해 이야기했다. with my best friend, 나의 가장 친한 친구와. Junha, 준하와.. 이 문장 전체를 해석하면, 그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다.","hl":"m"},{"n":38,"text":"확신이 없던 앤디가 혼자 고민하지 않고 가장 친한 친구 준하에게 먼저 도움을 청한 문장이에요. 여기서 it은 앞에 나온 마라톤과 뛸 수 있을까라는 고민을 가리키죠. 이 대화가 이후 둘이 함께 달리는 사건으로 이어지는 출발점이에요.","hl":"mn"},{"n":39,"text":"먼저 So는 앞 문장의 결과를 이어 주는 접속부사예요. 그래서 결과의 흐름을 만들어 주죠. 두 번째로 talked about it을 보면, talk는 자동사라서 목적어를 바로 가질 수 없어요. 그래서 전치사 about을 거쳐 목적격 it을 붙인 형태예요. 세 번째로 my best friend, Junha는 콤마 뒤의 Junha가 앞의 명사구와 같은 사람을 가리키는 동격 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했다,\u003c/span>\u003cspan class=\"en\">He said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“걱정하지마!\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 “걱정하지마!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앤디가 앞에서 자기가 뛸 수 있을지 \u003cb class=\"key\">걱정\u003c/b>했기 때문에, 준하가 먼저 \u003cb class=\"key\">안심\u003c/b>시키며 괜찮다고 말해 주는 장면이에요. 이 한마디가 뒤에서 두 사람이 함께 달리는 일의 \u003cb class=\"key\">출발점\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문(Don't + 동사원형)\u003c/span> : [Don't] + [동사원형 worry] : \"걱정하지마\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He said, 그는 말했다. \"Don't worry!, “걱정하지마!. 이 문장 전체를 해석하면, 그는 “걱정하지마!","hl":"m"},{"n":41,"text":"여기서 준하는 앤디의 걱정을 먼저 없애 주려고 해요. 앤디가 앞에서 내가 뛸 수 있을까 하고 걱정했기 때문에, 친구가 바로 안심시키는 흐름이죠. 그래서 이 말은 괜찮다는 뜻을 전하는 따뜻한 대사이고, 뒤에서 두 사람이 함께 달리는 일의 출발점이 됩니다.","hl":"mn"},{"n":42,"text":"문법은 두 가지로 정리할게요. 첫째, 여기서는 주어가 없는 명령문이 쓰였어요. 둘째, 하지 말라고 명령할 때는 Don't 뒤에 동사원형을 그대로 쓴다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 뛸 거야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'll\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">run \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너와 함께.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 너와 함께 뛸 거야.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 준하가 자기가 앤디와 \u003cb class=\"key\">함께\u003c/b> 뛰겠다고 나서는 문장이에요. 앞 문장의 안심시키는 말에 이어, 실제로 달리겠다는 \u003cb class=\"key\">의지\u003c/b>를 보여 주는 대답이죠. 그래서 앤디의 \u003cb class=\"key\">걱정\u003c/b>이 확실히 사라지는 순간이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래를 나타내는 will의 축약형\u003c/span> : [주어 I] + ['ll = will] + [동사원형 run] : \"내가 ~할 거야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동반의 전치사 with\u003c/span> : [동사 run] + [with + 목적격 you] : \"너와 함께 뛰다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I'll run, 내가 뛸 거야. with you.\", 너와 함께.”. 이 문장 전체를 해석하면, 내가 너와 함께 뛸 거야.”라고 말했다.","hl":"m"},{"n":44,"text":"앤디가 혼자 뛸 수 있을까 걱정하는데, 준하가 자기가 함께 뛰겠다고 나서는 장면이에요. 이 말에는 앞으로 정말 같이 달리겠다는 의지가 담겨 있어요. 그래서 앤디의 걱정이 확실히 사라지는 순간이죠.","hl":"mn"},{"n":45,"text":"첫째, I'll 은 I will 의 줄임말이고, 앞으로 하겠다는 의지와 약속을 나타내요. 둘째, with 는 '함께'라는 동반의 뜻을 가진 전치사예요. 그래서 이 전치사 뒤에는 목적격 you 가 온다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마라톤 날에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">marathon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 끈을 묶었다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tied\u003c/span> a string\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 손가락에\u003c/span>\u003cspan class=\"en\">around our fingers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로의 움직임을 느끼기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other's \u003c/span>\u003cspan class=\"tgt\">movement\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤 당일, 두 사람이 \u003cb class=\"key\">끈\u003c/b>을 손가락에 묶고 서로의 \u003cb class=\"key\">움직임\u003c/b>을 느끼며 달릴 준비를 한 장면이에요. 눈이 보이지 않는 앤디도 친구와 \u003cb class=\"key\">함께\u003c/b> 달릴 수 있었던 방법이죠. 그래서 이 문장은 뒤에 이어지는 감동적인 완주의 배경을 설명해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">특정한 날 앞에 쓰는 전치사 on\u003c/span> : [on] + [the day of the marathon(특정한 날)] : \"마라톤 날에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 과거형(규칙 변화)\u003c/span> : [tie] + [d] → [tied] : \"묶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절 동작] + [to + 동사원형] : \"서로의 움직임을 느끼기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">상호대명사 each other의 소유격\u003c/span> : [each other] + ['s] + [명사] : \"서로의\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"On the day of the marathon, 마라톤 날에. we tied a string, 우리는 끈을 묶었다. around our fingers, 우리의 손가락에. to feel each other's movement, 서로의 움직임을 느끼기 위해.. 이 문장 전체를 해석하면, 마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다.","hl":"m"},{"n":47,"text":"이 문장은 마라톤 당일 두 사람이 어떻게 달렸는지 보여 줘요. 끈을 손가락에 묶고 서로의 움직임을 느끼면서 달린 거죠. 눈이 보이지 않는 앤디도 친구와 함께 달릴 수 있었던 방법이었어요. 그래서 뒤에 이어지는 감동적인 완주의 배경이 됩니다.","hl":"mn"},{"n":48,"text":"문법 포인트를 순서대로 짚어 볼게요. 첫째, 특정한 날짜를 말할 때는 전치사 on 을 쓴다는 점이에요. 둘째, 이미 끝난 일이니까 tie 를 과거형인 tied 로 바꿔 줬어요. 셋째, to feel 은 '느끼기 위해'라는 목적을 나타내는 to부정사예요. 넷째, each other 는 '서로'라는 뜻의 상호대명사이고, 여기에 소유격이 붙어서 '서로의'가 되었어요. 이 네 가지만 잡으면 이 문장은 완벽합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그의 말을 들었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">listened \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 주의 깊게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">carefully\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그와 함께 뛰었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ran \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 준하가 함께 뛰겠다고 해 준 뒤, 앤디가 실제로 어떻게 달렸는지 보여 주는 문장이에요. \u003cb class=\"key\">청각\u003c/b>에 의지해 뛰어야 했던 앤디에게 친구의 안내는 \u003cb class=\"key\">생명줄\u003c/b>과 같았죠. listened와 ran이 and로 이어진 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>라서 듣기와 달리기가 한 흐름 안에서 함께 일어난 행동임을 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 구문(listen to)\u003c/span> : listen [자동사] + to + [목적어] : \"그의 말을 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사구의 동사구 수식\u003c/span> : listened to him [동사구] + very carefully [부사구] : \"매우 주의 깊게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조(and)\u003c/span> : listened to him [동사구] + and + ran with him [동사구] : \"그리고 그와 함께 뛰었다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"I listened to him, 나는 그의 말을 들었다. very carefully, 매우 주의 깊게. and ran with him, 그리고 그와 함께 뛰었다. 이 문장 전체를 해석하면, 나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다.","hl":"m"},{"n":50,"text":"이 문장은 준하의 말을 귀 기울여 듣고 함께 달린 장면이에요. 앤디는 청각에 의지해 뛰어야 했던 친구라서 친구의 안내는 생명줄 같은 것이었죠. listened와 ran이 and로 이어진 병렬 구조라서 듣기와 달리기가 한 흐름 안에서 함께 일어난 행동임을 알 수 있어요.","hl":"mn"},{"n":51,"text":"먼저 listen to를 볼게요. listen은 목적어를 바로 가질 수 없는 자동사라서 목적어 앞에 전치사 to를 꼭 붙여 줘야 해요. 다음으로 very carefully는 부사 carefully를 꾸며 주는 부사구로, listened to him 전체를 수식해서 얼마나 주의 깊게 들었는지 알려 줘요. 마지막으로 and ran with him은 앞의 listened to him과 짝을 이루는 병렬 구조예요. 그래서 주어 I를 다시 쓰지 않고 듣기와 달리기를 나란히 연결해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바람이\u003c/span>\u003cspan class=\"en\">The wind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내게 불어오고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">blowing\u003c/span> through me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 느낌이 정말 좋았다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달리는 동안 바람이 몸을 스쳐 가는 감각을 생생하게 전하는 문장이에요. \u003cb class=\"key\">과거진행\u003c/b>으로 그 순간 계속 불고 있던 바람을 그렸고, \u003cb class=\"key\">감각동사\u003c/b> felt 뒤에 형용사 great을 써서 앤디의 \u003cb class=\"key\">기분\u003c/b>이 얼마나 좋았는지 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형(be + V-ing)\u003c/span> : was [be동사의 과거형] + blowing [현재분사] : \"불어오고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : it [앞의 내용 전체를 받는 대명사] + felt + great : \"그 느낌이, 그것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사(주격보어)\u003c/span> : felt [감각동사] + great [형용사/주격보어] : \"정말 좋게 느껴졌다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"The wind, 바람이. was blowing through me, 내게 불어오고 있었다. and it felt great, 그리고 그 느낌이 정말 좋았다. 이 문장 전체를 해석하면, 바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다.","hl":"m"},{"n":53,"text":"이 문장은 달리는 동안 바람이 몸을 스쳐 가는 감각을 생생하게 전해 줘요. 과거진행으로 그 순간 계속 불고 있던 바람을 그렸고, 감각동사 felt 뒤에 형용사 great을 써서 앤디의 기분이 얼마나 좋았는지 보여 줍니다.","hl":"mn"},{"n":54,"text":"첫 번째로 was blowing은 과거진행형이에요. be동사의 과거형 was에 현재분사 blowing을 붙여서 그 순간 계속 불고 있던 장면을 그려 주죠. 두 번째로 it은 앞에 나온 바람이 부는 상황 전체를 받는 지시대명사예요. 같은 내용을 반복하지 않고 대명사로 깔끔하게 받아 준 거예요. 세 번째로 felt great에서 feel은 감각동사라서 뒤에 부사가 아니라 형용사가 와요. 그래서 greatly가 아니라 great이 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결승선에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">At \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">finish \u003c/span>\u003cspan class=\"tgt\">line,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들이 응원했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cheered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결승선에서, 모든 사람들이 우리를 응원했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경주를 끝낸 순간 사람들이 함께 기뻐해 준 장면이에요. \u003cb class=\"key\">결승선\u003c/b>이라는 장소와 \u003cb class=\"key\">응원\u003c/b>이라는 반응을 통해 앤디가 혼자가 아니라 한 \u003cb class=\"key\">팀\u003c/b>으로 완주했음을 강조합니다. 이 문장은 완주의 기쁨이 다음 문장의 \u003cb class=\"key\">자신감\u003c/b>으로 이어지는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : At + the finish line [전치사구] , + 주어 + 동사 : \"결승선에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">everyone의 단수 취급\u003c/span> : everyone [단수 취급 주어] + cheered [단수 동사] : \"모든 사람들이 응원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 구문(cheer for)\u003c/span> : cheered [자동사] + for + us [전치사의 목적어] : \"우리를 응원했다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"At the finish line, 결승선에서. everyone cheered, 모든 사람들이 응원했다. for us, 우리를. 이 문장 전체를 해석하면, 결승선에서, 모든 사람들이 우리를 응원했다.","hl":"m"},{"n":56,"text":"이 문장은 경주를 끝낸 순간 사람들이 함께 기뻐해 준 장면이에요. 결승선이라는 장소와 응원이라는 반응을 통해 앤디가 혼자가 아니라 한 팀으로 완주했음을 강조하죠. 그리고 이 기쁨이 다음 문장의 자신감으로 이어지는 흐름의 출발점이 된답니다.","hl":"mn"},{"n":57,"text":"첫 번째로 At the finish line은 문장 앞에 온 전치사구로, 장소를 알려 주면서 문장 전체를 꾸며 주는 부사 역할을 해요. 두 번째로 everyone cheered에서 everyone은 뜻은 모든 사람들이지만 문법적으로는 단수로 취급해서 동사도 단수형 cheered가 와요. 세 번째로 cheered for us에서 cheer는 응원하다라는 뜻으로 쓸 때 자동사라서 대상 앞에 전치사 for를 꼭 붙여 줘야 해요. 그래서 for us가 누구를 응원했는지 알려 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 자신이 자랑스러웠다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">proud \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">myself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내 자신이 자랑스러웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 마라톤을 완주한 뒤 Andy가 느낀 \u003cb class=\"key\">성취감\u003c/b>과 \u003cb class=\"key\">자부심\u003c/b>을 나타내요. 앞에서 친구 Junha와 함께 달린 일이 Andy에게 '나도 할 수 있다'는 마음을 생기게 했음을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be proud of 관용표현\u003c/span> : [주어] + be proud of + [대상] : \"~을 자랑스러워하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사\u003c/span> : [주어] + 동사 + 재귀대명사 : \"내 자신을\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"I, 나는. was proud of myself, 내 자신이 자랑스러웠다. 이 문장 전체를 해석하면, 나는 내 자신이 자랑스러웠다.","hl":"m"},{"n":59,"text":"이 문장은 마라톤을 완주한 뒤 Andy가 느낀 성취감과 자부심을 나타내요. 앞에서 친구 Junha와 함께 달린 일이 Andy에게 나도 할 수 있다는 마음을 생기게 했음을 보여 줘요.","hl":"mn"},{"n":60,"text":"첫 번째 어법 포인트는 was proud of예요. be proud of는 무엇을 자랑스러워하다는 뜻의 관용표현이에요. 그래서 proud 앞에 be동사가 오고 뒤에 전치사 of가 붙어요. 두 번째 어법 포인트는 myself예요. 주어 I와 목적어가 같은 사람일 때 쓰는 재귀대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마라톤 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">marathon,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각했다\u003c/span>\u003cspan class=\"en\">I thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것을 할 수 없었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마라톤 전에, 나는 그것을 할 수 없다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 마라톤 전 Andy의 \u003cb class=\"key\">부정적\u003c/b> 생각을 보여 줘요. 당시에는 자신이 할 수 없다고 믿었지만, 뒤에서 그 생각이 바뀌는 흐름을 만들기 위한 \u003cb class=\"key\">대조\u003c/b>의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : Before + 명사구, 주절 : \"마라톤 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that(명사절 유도)\u003c/span> : think + that + 완전한 절 : \"~라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정형 + 동사원형\u003c/span> : could not + 동사원형 : \"그것을 할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"Before the marathon, 마라톤 전에. I thought, 나는 생각했다. that, ~라고. I couldn't do it, 나는 그것을 할 수 없었다. 이 문장 전체를 해석하면, 마라톤 전에, 나는 그것을 할 수 없다고 생각했다.","hl":"m"},{"n":62,"text":"이 문장은 마라톤 전 Andy의 부정적인 생각을 보여 줘요. 당시에는 자신이 할 수 없다고 믿었지만, 뒤에서 그 생각이 바뀌는 흐름을 만들기 위한 대조의 출발점이에요.","hl":"mn"},{"n":63,"text":"첫 번째 어법 포인트는 Before the marathon이에요. Before는 전치사라서 뒤에 명사구가 오고, 이 덩어리가 시간을 나타내는 부사구가 돼요. 두 번째 어법 포인트는 that이에요. thought 뒤에서 접속사 that이 완전한 절을 이끌어 목적어 역할을 하게 해요. 세 번째 어법 포인트는 couldn't do it이에요. couldn't는 could not의 줄임말이고 뒤에는 동사원형 do가 와요. 그래서 과거에 그것을 할 수 없었던 능력의 부정을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 지금\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But \u003c/span>\u003cspan class=\"tgt\">now,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~하고 싶다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 것들을 해 보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">try\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 지금, 나는 다른 것들을 해 보고 싶다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Andy가 마라톤 경험을 통해 \u003cb class=\"key\">자신감\u003c/b>을 얻고 앞으로 \u003cb class=\"key\">도전\u003c/b>하고 싶은 마음을 드러내는 결말이에요. 과거의 '할 수 없다'는 생각과 대비되는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전환의 접속사 But과 시간 부사 now\u003c/span> : But + now, 주어 + 동사 : \"그러나 지금\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">want + to부정사(목적어)\u003c/span> : want + to부정사 : \"해 보고 싶다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 other + 복수명사\u003c/span> : other + 복수명사 : \"다른 것들\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"But now, 그러나 지금. I want to, 나는 ~하고 싶다. try other things, 다른 것들을 해 보다. 이 문장 전체를 해석하면, 그러나 지금, 나는 다른 것들을 해 보고 싶다.","hl":"m"},{"n":65,"text":"이 문장은 Andy가 마라톤 경험을 통해 자신감을 얻고 앞으로 도전하고 싶은 마음을 드러내는 결말이에요. 과거의 할 수 없다는 생각과 대비되는 긍정적 변화를 보여 줘요.","hl":"mn"},{"n":66,"text":"첫 번째 어법 포인트는 But now예요. But은 앞의 부정적인 생각에서 반대로 돌아서는 전환을 나타내고, now는 지금의 변화된 마음을 강조해요. 두 번째 어법 포인트는 want to try예요. want 뒤에 to부정사 try가 와서 목적어 역할을 해요. 세 번째 어법 포인트는 other things예요. other는 다른이라는 뜻의 형용사이고 things는 복수명사라서 여러 다른 것들을 뜻해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각한다\u003c/span>\u003cspan class=\"en\">I think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 해 볼 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거 타기를\u003c/span>\u003cspan class=\"en\">a bike ride\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음번에는\u003c/span>\u003cspan class=\"en\">next time!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤을 겪으며 자신감을 얻은 화자가 \u003cb class=\"key\">다음번\u003c/b>에는 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">타기\u003c/b>에 도전해 보겠다는 결심을 보여 주는, 글 전체의 결말 문장이에요. I think 뒤의 \u003cb class=\"key\">that절\u003c/b>은 '~라고'라는 뜻으로 think의 목적어 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (think의 목적어절)\u003c/span> : think [타동사] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"~라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can (능력·가능)\u003c/span> : 주어 + [can + 동사원형] : \"해 볼 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"I think, 나는 생각한다. that I can try, 내가 해 볼 수 있다고. a bike ride, 자전거 타기를. next time!, 다음번에는. 이 문장 전체를 해석하면, 나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다.","hl":"m"},{"n":68,"text":"이 문장은 글 전체의 결말이에요. 예전에는 자전거 타기를 못 할 거라고 생각했던 화자가 마라톤을 통해 자신감을 얻고, 이제는 다음번에 자전거 타기에 도전해 보고 싶다고 말하죠. 그래서 이 문장이 글의 주제인 새로운 도전을 잘 보여 줍니다.","hl":"mn"},{"n":69,"text":"먼저 that은 think 뒤에서 '~라고'라는 뜻으로 문장을 이끌어 목적어절을 만드는 명사절 접속사예요. 그래서 that I can try a bike ride next time 전체가 think의 목적어가 되죠. 두 번째로 can은 조동사라서 뒤에 동사원형이 오고, 여기서는 '해 볼 수 있다'라는 가능의 뜻을 나타냅니다. try 뒤에는 a bike ride라는 명사 목적어가 왔다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>시각 장애인 Andy는 눈이 보이지 않아 \u003cb class=\"key\">지팡이\u003c/b>를 짚고 사는 주인공이에요.\u003c/li>\u003cli>학교의 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b> 소식을 듣고 관심을 갖지만, 스스로 뛸 수 있을지 \u003cb class=\"key\">확신\u003c/b>하지 못해요.\u003c/li>\u003cli>친구 Junha가 함께 뛰겠다고 하자 둘은 끈으로 연결되어 마라톤을 완주하고 \u003cb class=\"key\">자랑스러움\u003c/b>을 느껴요.\u003c/li>\u003cli>그 경험을 통해 Andy는 두려움을 넘어 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">도전\u003c/b>을 해 보려는 \u003cb class=\"key\">자신감\u003c/b>을 얻어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>With his best friend's help, Andy overcomes his fear, finishes the marathon, and gains the confidence to try new things.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 시각 장애인 Andy가 학교 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에서 가장 친한 친구 Junha와 함께 뛰며, 마라톤 전의 \u003cb class=\"key\">두려움\u003c/b>을 이겨 내고 이제는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">도전\u003c/b>을 해 보려는 자신감을 얻는 이야기이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":70,"text":"오늘 배운 내용을 정리해 볼게요. 시각 장애인 Andy가 우정 마라톤에서 친구 Junha와 함께 뛰며 두려움을 자신감으로 바꾸는 이야기였죠. 시간 표현을 따라가며 사건을 정리하고, 마지막 문장에서 심경 변화를 확인하는 것이 핵심이에요. 여러분도 누군가의 동행이 얼마나 큰 힘이 되는지 꼭 기억해 두면 좋겠어요. 오늘 수업도 여기까지예요. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
