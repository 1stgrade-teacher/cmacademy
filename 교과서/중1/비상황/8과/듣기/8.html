window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"C Watch & Present","title":"중1 비상(황) 8과 Everyday Communication2 C Watch & Present","audioDir":"8_audio","preview":false,"count":31,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">주말에 한 일 묻고 답하기 / 감탄하며 칭찬하기\u003c/div>\u003ch1>중1 비상(황) 8과 Everyday Communication 2 — C Watch &amp; Present 대화문 해설\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>남학생이 Lena에게 주말 동안 무엇을 했는지 묻고, Lena는 가족과 함께 어린이 병원에서 작은 콘서트를 열었다고 이야기합니다. 남학생이 놀라며 칭찬하고, Lena는 가족이 각자 맡은 연주와 노래를 했다며 그날이 올해 최고의 날이었다고 말합니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 여덟 번째 과의 Watch and Present 대화문을 함께 공부해 볼 거예요. 남학생이 친구 Lena에게 주말에 무엇을 했는지 묻는 아주 짧고 자연스러운 대화예요. What did you do 뒤에 over the weekend처럼 과거를 나타내는 말이 붙으면 지난 주말에 무엇을 했는지 묻는 표현이 돼요. 또 held나 played나 sang처럼 과거형 동사로 지난 경험을 묘사한다는 점도 함께 익혀 볼게요. 자, 그럼 첫 번째 줄부터 하나씩 들어가 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">What did you do over the weekend, Lena?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">My family and I held a small concert at a children's hospital.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">M\u003c/span>\u003cdiv class=\"d-en\">A small concert? That's great.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">W\u003c/span>\u003cdiv class=\"d-en\">My dad played the violin, and my mom played the piano. I sang a few songs. It was the best day of the year.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"What did you do over the weekend, Lena?","hl":"r-0"},{"n":3,"text":"My family and I held a small concert at a children's hospital.","hl":"r-1"},{"n":4,"text":"A small concert? That's great.","hl":"r-2"},{"n":5,"text":"My dad played the violin, and my mom played the piano. I sang a few songs. It was the best day of the year.","hl":"r-3"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">주말에 한 일 묻고 답하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What did you do over the weekend?\u003c/div>\u003cdiv class=\"d-mean\">주말 동안에 무엇을 했니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: What did you do over the weekend, Lena?\u003c/div>\u003cdiv class=\"d-exp\">\u003cb class=\"key\">What did you do\u003c/b>에 \u003cb class=\"key\">과거부사(구)\u003c/b>가 이어지면 '~에 무엇을 했니?'라는 뜻으로 과거에 한 일을 묻는 표현이에요. 여기서는 \u003cb class=\"key\">over the weekend\u003c/b>가 이어져 지난 주말에 무엇을 했는지 묻고, 대답은 과거형 동사로 해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How did you spend your weekend?\u003c/li>\u003cli>What did you do last weekend?\u003c/li>\u003cli>Did you do anything special over the weekend?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I held a small concert at a children's hospital.\u003c/li>\u003cli>I visited my grandparents.\u003c/li>\u003cli>I played soccer with my friends.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"이번 대화의 첫 번째 기능은 주말에 한 일을 묻고 답하는 거예요. 핵심 표현은 What did you do over the weekend이고, 뜻은 주말 동안에 무엇을 했니예요. What did you do 뒤에 over the weekend처럼 과거를 가리키는 말이 붙으면 지난 주말에 무엇을 했는지 묻는 표현이 돼요. 그래서 대답할 때는 held나 played나 sang처럼 과거형 동사를 써야 해요.","hl":"key"},{"n":7,"text":"같은 뜻으로는 How did you spend your weekend라고 물을 수도 있어요. What did you do last weekend도 아주 자연스럽고요. Did you do anything special over the weekend처럼 특별한 일이 있었는지 묻는 표현도 함께 알아 두면 좋아요.","hl":"alts"},{"n":8,"text":"대답은 I visited my grandparents처럼 과거형 동사로 시작하면 돼요. I played soccer with my friends라고 해도 좋고요. 이 대화처럼 I held a small concert at a children's hospital이라고 말하면 훨씬 풍부한 대답이 됩니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">감탄하며 칭찬하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">That's great.\u003c/div>\u003cdiv class=\"d-mean\">그거 멋지다.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: A small concert? That's great.\u003c/div>\u003cdiv class=\"d-exp\">상대의 이야기를 듣고 \u003cb class=\"key\">감탄\u003c/b>하거나 \u003cb class=\"key\">칭찬\u003c/b>할 때 쓰는 짧은 표현이에요. 상대가 한 말을 A small concert?처럼 \u003cb class=\"key\">되풀이\u003c/b>하며 놀라움을 나타낸 뒤에 자연스럽게 이어 쓸 수 있어요. 칭찬을 받으면 Thanks나 Thank you로 감사를 표현하면 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>That sounds great.\u003c/li>\u003cli>That's wonderful.\u003c/li>\u003cli>How nice.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>Thanks.\u003c/li>\u003cli>Thank you. It was really fun.\u003c/li>\u003cli>Yes, it was the best day of the year.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"두 번째 기능은 감탄하며 칭찬하기예요. 핵심 표현은 That's great이고 뜻은 그거 멋지다예요. 상대의 말을 A small concert처럼 되풀이하며 놀라움을 보여 주고, 바로 뒤에 That's great로 칭찬해 주면 아주 자연스러워요.","hl":"key"},{"n":10,"text":"That's great 대신에 That sounds great라고 해도 같은 뜻이에요. That's wonderful도 좋고, How nice처럼 짧게 감탄할 수도 있어요. 이 표현들은 모두 상대의 좋은 소식에 반응할 때 씁니다.","hl":"alts"},{"n":11,"text":"칭찬을 받으면 Thanks라고 짧게 답해도 되고, Thank you. It was really fun처럼 덧붙여도 좋아요. 이 대화처럼 Yes, it was the best day of the year라고 답하면 대화가 아주 풍성해집니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 4\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">M\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What did you do\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">over the weekend\u003c/span>, Lena?\u003c/div>\u003cdiv class=\"d-ko\">남: 주말 동안에 뭐 했니, Lena?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">What did you do\u003c/b>는 과거에 한 일을 묻는 의문문이에요. 여기에 \u003cb class=\"key\">과거부사(구)\u003c/b>가 이어지면 '~에 무엇을 했니?'라는 뜻이 되고, did가 \u003cb class=\"key\">과거\u003c/b>를 나타내므로 뒤에는 동사원형 do를 씁니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>'주말 동안에'라는 뜻의 \u003cb class=\"key\">시간\u003c/b>을 나타내는 어구예요. 여기서는 \u003cb class=\"key\">over the weekend\u003c/b>가 이어져 지난 주말에 무엇을 했는지 묻고, \u003cb class=\"key\">over\u003c/b>는 '동안'이라는 의미로 쓰였어요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How did you spend your weekend, Lena?\u003c/span>\u003cspan>What did you do last weekend, Lena?\u003c/span>\u003cspan>Did you do anything special over the weekend, Lena?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">W\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">My family and I\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">held\u003c/span> a small concert \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">at a children's hospital\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">여: 우리 가족과 나는 어린이 병원에서 작은 콘서트를 열었어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>주어 자리에서는 '나'를 뒤에 두고 \u003cb class=\"key\">My family and I\u003c/b> 순서로 써요. '우리 가족과 나'라는 뜻이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">hold\u003c/b>의 과거형으로 '열다, 개최하다'라는 뜻이에요. 이 대화에서는 \u003cb class=\"key\">held\u003c/b>, played, sang처럼 \u003cb class=\"key\">과거형\u003c/b> 동사를 사용해 지난 경험을 묘사해요. 콘서트나 행사를 열 때 자주 씁니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>장소 앞에 쓰는 전치사 \u003cb class=\"key\">at\u003c/b>과 '어린이 병원'이라는 뜻의 \u003cb class=\"key\">children's hospital\u003c/b>이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>My family and I had a small concert at a children's hospital.\u003c/span>\u003cspan>We gave a small concert at a children's hospital.\u003c/span>\u003cspan>My family and I put on a small concert at a children's hospital.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"첫 번째 줄이에요. 남학생이 What did you do over the weekend, Lena라고 말합니다. 뜻은 주말 동안에 뭐 했니, Lena야, 예요. What did you do는 과거에 한 일을 묻는 의문문이고, over the weekend는 주말 동안이라는 뜻이에요. 그래서 What did you do 뒤에 over the weekend가 붙으면 지난 주말에 무엇을 했는지 묻는 말이 됩니다. How did you spend your weekend라고 바꿔 말해도 같은 의도가 돼요.","hl":"l-0"},{"n":13,"text":"두 번째 줄이에요. Lena가 My family and I held a small concert at a children's hospital이라고 말합니다. 뜻은 나의 가족과 나는 어린이 병원에서 작은 콘서트를 열었어, 예요. My family and I는 주어로 쓰였고, held는 hold의 과거형이에요. 이렇게 held나 played나 sang 같은 과거형 동사를 쓰면 지난 주말에 있었던 일을 묘사할 수 있어요. 같은 뜻으로 My family and I had a small concert라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 4\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">M\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">A small concert?\u003c/span> \u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">That's great\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">남: 작은 콘서트라고? 멋지다.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>상대의 말을 \u003cb class=\"key\">되풀이\u003c/b>하며 놀라움을 나타내는 표현이에요. 끝을 올려 읽으면 감탄하는 느낌이 살아요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>상대의 이야기에 \u003cb class=\"key\">칭찬\u003c/b>과 \u003cb class=\"key\">감탄\u003c/b>을 담아 반응하는 표현이에요. '그거 멋지다'라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>That sounds great.\u003c/span>\u003cspan>That's wonderful.\u003c/span>\u003cspan>How nice.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">W\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">My dad \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">played the violin\u003c/span>, and \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">my mom played the piano\u003c/span>. I \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">sang a few songs\u003c/span>. It was \u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">the best day of the year\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">여: 우리 아빠가 바이올린을 연주하셨고, 엄마는 피아노를 치셨어. 나는 노래 몇 곡을 불렀지. 올해 최고의 날이었어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>악기 이름 앞에는 정관사 \u003cb class=\"key\">the\u003c/b>를 붙여요. '바이올린을 연주하다'는 \u003cb class=\"key\">play the violin\u003c/b>으로 씁니다. 여기서는 과거형 \u003cb class=\"key\">played\u003c/b>로 아빠가 바이올린을 연주하셨다는 지난 경험을 나타내요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">played\u003c/b>는 play의 과거형이고, 엄마가 피아노를 연주하셨다는 \u003cb class=\"key\">과거\u003c/b>의 경험을 나타내요. 악기 이름 앞에는 \u003cb class=\"key\">the\u003c/b>를 붙여요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">sang\u003c/b>은 sing의 과거형이에요. \u003cb class=\"key\">a few\u003c/b>는 '몇 개의, 약간의'라는 뜻으로 셀 수 있는 복수 명사 앞에 써요. Lena가 노래 몇 곡을 불렀다는 \u003cb class=\"key\">과거\u003c/b>의 경험을 나타냅니다.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">최상급\u003c/b> best 앞에는 \u003cb class=\"key\">the\u003c/b>를 붙여요. '올해 최고의 날'이라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>It was the greatest day of the year.\u003c/span>\u003cspan>It was the best day ever.\u003c/span>\u003cspan>I had the best day of the year.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"세 번째 줄이에요. 남학생이 A small concert, That's great라고 말합니다. 뜻은 작은 콘서트라고, 멋지다, 예요. 상대의 말을 그대로 되풀이하며 놀라고, That's great로 칭찬하고 있죠. 비슷하게는 That sounds great나 That's wonderful이라고도 말할 수 있어요.","hl":"l-0"},{"n":15,"text":"네 번째 줄이에요. Lena가 My dad played the violin, and my mom played the piano, I sang a few songs, It was the best day of the year라고 말합니다. 뜻은 우리 아빠가 바이올린을 연주하셨고 엄마는 피아노를 치셨어, 나는 노래 몇 곡을 불렀지, 올해 최고의 날이었어, 예요. 여기서 played와 sang은 모두 과거형 동사라서 지난 주말에 한 일을 묘사해 줍니다. 악기 이름 앞에는 the를 붙이고, a few는 몇 개의라는 뜻이에요. 최상급 앞에도 the를 붙인다는 점을 꼭 기억하세요.","hl":"l-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 5\u003c/span>\u003cspan class=\"g-kind\">대체 표현\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 'What did you do over the weekend?'와 같은 의도로 쓸 수 있는 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">What did you do over the weekend?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>How did you spend your weekend?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Where did you go over the weekend?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>What are you doing this weekend?\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Who did you meet over the weekend?\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">How did you spend your weekend?\u003c/span>\u003cdiv class=\"g-exp\">주말에 한 일을 묻는 표현이므로 '주말을 어떻게 보냈니?'라는 [[How did you spend your weekend?]]가 알맞아요. [[What did you do]] 뒤에 [[over the weekend]]처럼 과거를 나타내는 말이 이어지면 지난 주말에 무엇을 했는지 묻는 표현이 돼요. 나머지는 장소, 미래 계획, 사람을 묻는 표현이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제예요. What did you do over the weekend와 같은 의도로 쓸 수 있는 표현을 골라 보세요. 첫 번째는 How did you spend your weekend, 두 번째는 Where did you go over the weekend, 세 번째는 What are you doing this weekend, 네 번째는 Who did you meet over the weekend입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 첫 번째 보기예요. 주말에 한 일을 묻는 표현이니까 How did you spend your weekend가 딱 맞아요. What did you do 뒤에 over the weekend가 붙으면 지난 주말에 무엇을 했는지 묻는 말이 된다는 점도 기억하세요. 나머지 보기는 장소나 미래 계획, 사람을 묻는 표현이라서 이 대화와는 의미가 달라요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 5\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">My family and I ____ a small concert at a children's hospital.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>held\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>helped\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>heard\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>hoped\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">held\u003c/span>\u003cdiv class=\"g-exp\">'콘서트를 열다'는 [[hold a concert]]이고, 과거 이야기이므로 과거형 [[held]]를 씁니다. 이 대화에서는 [[held]], played, sang 같은 과거형 동사로 지난 경험을 묘사해요. helped는 돕다, heard는 듣다, hoped는 바라다라는 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"두 번째 문제예요. My family and I 빈칸 a small concert at a children's hospital에서 빈칸에 들어갈 말을 고르세요. 첫 번째는 held, 두 번째는 helped, 세 번째는 heard, 네 번째는 hoped입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 첫 번째 보기 held예요. 콘서트를 열다는 hold a concert이고, 과거에 일어난 일이니까 과거형 held를 써야 해요. held와 played와 sang처럼 과거형 동사를 쓰면 지난 경험을 묘사할 수 있어요. helped와 heard와 hoped는 뜻이 전혀 다르니까 헷갈리지 마세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 5\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">밑줄 친 부분 'That's great.'와 바꿔 쓸 수 있는 표현을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">A small concert? That's great.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>That sounds wonderful.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>That's too bad.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>I'm sorry to hear that.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>That's boring.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">That sounds wonderful.\u003c/span>\u003cdiv class=\"g-exp\">That's great는 [[칭찬]]과 [[감탄]]의 표현이므로 That sounds wonderful로 바꿀 수 있어요. 나머지는 모두 안 좋은 반응을 나타내는 표현이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"세 번째 문제예요. That's great와 바꿔 쓸 수 있는 표현을 고르세요. 첫 번째는 That sounds wonderful, 두 번째는 That's too bad, 세 번째는 I'm sorry to hear that, 네 번째는 That's boring입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 첫 번째 보기예요. That's great는 칭찬하고 감탄하는 말이라서 That sounds wonderful로 바꿀 수 있어요. 두 번째와 세 번째와 네 번째는 모두 안 좋은 반응이라서 이 대화에는 어울리지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 5\u003c/span>\u003cspan class=\"g-kind\">순서 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화를 자연스러운 순서로 배열한 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\" style=\"white-space:pre-line\">(A) My dad played the violin, and my mom played the piano. (B) What did you do over the weekend, Lena? (C) My family and I held a small concert at a children's hospital. (D) A small concert? That's great.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>(B)-(C)-(D)-(A)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>(B)-(D)-(C)-(A)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>(C)-(B)-(D)-(A)\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>(D)-(B)-(C)-(A)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(B)-(C)-(D)-(A)\u003c/span>\u003cdiv class=\"g-exp\">먼저 주말에 한 일을 묻고, Lena가 콘서트를 열었다고 답한 뒤, 남학생이 감탄하며 칭찬하고, 마지막으로 콘서트의 자세한 내용이 이어져요. 그래서 (B)-(C)-(D)-(A) 순서가 자연스러워요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"네 번째 문제예요. 네 개의 문장을 자연스러운 대화 순서로 배열해 보세요. 먼저 질문이 오고, 그다음 대답과 반응이 이어진다고 생각하면 쉬워요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 첫 번째 보기예요. 먼저 주말에 뭐 했니라고 묻는 B로 시작하고, Lena가 콘서트를 열었다고 답하는 C가 이어져요. 그다음 남학생이 멋지다고 반응하는 D가 오고, 마지막에 자세한 설명인 A가 오면 자연스러운 대화가 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">Lena의 대화 내용과 일치하는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Lena's dad played the piano.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Lena sang a few songs.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>The concert was at a school.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Lena's mom played the violin.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Lena sang a few songs.\u003c/span>\u003cdiv class=\"g-exp\">대화에서 I sang a few songs라고 했으므로 Lena가 노래를 불렀다는 내용이 맞아요. 아빠는 바이올린, 엄마는 피아노를 연주했고, 장소는 [[children's hospital]]이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"다섯 번째 문제예요. Lena의 대화 내용과 일치하는 것을 골라 보세요. 첫 번째는 아빠가 피아노를 쳤다는 말, 두 번째는 Lena가 노래 몇 곡을 불렀다는 말, 세 번째는 공연 장소가 학교라는 말, 네 번째는 엄마가 바이올린을 연주했다는 말입니다. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 두 번째 보기예요. 대화에서 I sang a few songs라고 했으니까 Lena가 노래를 불렀다는 내용이 맞아요. 아빠는 바이올린을, 엄마는 피아노를 연주했고, 장소는 어린이 병원이었어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">주말에 한 일 묻고 답하기 / 감탄하며 칭찬하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주말에 한 일을 물을 때는 \u003cb class=\"key\">What did you do\u003c/b> 뒤에 \u003cb class=\"key\">over the weekend\u003c/b>처럼 과거를 나타내는 말을 붙여 묻고, \u003cb class=\"key\">과거형\u003c/b> 동사로 답해요.\u003c/li>\u003cli>콘서트나 행사를 열다는 \u003cb class=\"key\">hold a concert\u003c/b>이고, 과거형은 \u003cb class=\"key\">held\u003c/b>예요. 과거의 경험은 played, sang처럼 \u003cb class=\"key\">과거형\u003c/b> 동사로 묘사해요.\u003c/li>\u003cli>좋은 소식에는 \u003cb class=\"key\">That's great.\u003c/b>처럼 짧게 \u003cb class=\"key\">감탄\u003c/b>하며 칭찬해 주세요.\u003c/li>\u003cli>악기 앞에는 \u003cb class=\"key\">the\u003c/b>를, \u003cb class=\"key\">최상급\u003c/b> 앞에도 the를 붙인다는 점을 기억하세요.\u003c/li>\u003c/ul>","segs":[{"n":31,"text":"오늘은 주말에 한 일을 묻고 답하는 표현과 감탄하며 칭찬하는 표현을 배웠어요. What did you do 뒤에 over the weekend가 붙으면 지난 주말에 무엇을 했는지 묻는 말이 된다는 점 기억나죠? 대답은 held나 played나 sang처럼 과거형 동사로 하면 돼요. 콘서트를 열다는 hold a concert, 과거형은 held였고요. 그리고 좋은 소식에는 That's great라고 짧게 칭찬해 주면 대화가 아주 따뜻해집니다. 오늘 배운 표현들 꼭 소리 내어 연습해 보고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
