<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"8과 본문2","audioDir":"2_audio","preview":false,"count":73,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">8과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>From One Dot to Many: Vashti's Growing Confidence\u003c/h1>\u003ch2>점 하나에서 여러 점으로, 커져 가는 Vashti의 자신감\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 선생님이 금색 액자에 걸어 둔 자신의 \u003cb class=\"key\">점\u003c/b>을 보고 더 나은 점을 만들겠다고 마음먹은 Vashti는 물감을 섞고 더 큰 붓과 종이를 쓰며 점을 발전시켜, 마침내 칠하지 않고도 점을 만들어 내는 \u003cb class=\"key\">창의력\u003c/b>까지 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Encouraged by seeing her own dot framed, Vashti keeps experimenting and discovers her own creativity.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일 학년 YBM 박 선생님 교과서 여덟 과의 본문 두 번째 지문을 함께 읽어 볼 거예요. 금색 액자에 걸린 점 하나에서 시작되는 Vashti의 이야기인데요. 자신의 점을 발견한 Vashti가 점점 더 과감한 시도로 나아가는 과정을 담고 있답니다. 요약하면, 액자에 걸린 자신의 점을 보고 더 나은 점을 만들겠다고 마음먹은 Vashti가 물감을 섞고 더 큰 붓과 종이를 쓰면서, 마침내 칠하지 않고도 점을 만들어 내는 창의력을 보여 준다는 내용이에요. 글의 요지는 작은 인정 하나가 자신감을 키우고, 그 자신감이 창의력으로 이어진다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 Peter H. Reynolds의 그림책 The Dot에서 가져온 장면입니다. 주인공 Vashti는 원래 자기 그림에 자신이 없었지만, 선생님이 그녀의 점을 금색 액자에 걸어 주면서 '나도 할 수 있다'는 \u003cb class=\"key\">자기효능감\u003c/b>(self-efficacy)을 얻습니다. 교육심리학에서는 이런 믿음을 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">마인드셋\u003c/b>(growth mindset)이라 부르는데, 능력은 고정된 것이 아니라 노력으로 자란다는 생각입니다. 미술 교육에서도 결과물의 완성도보다 시도 자체를 인정해 주는 \u003cb class=\"key\">과정 \u003c/b>\u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">피드백\u003c/b>이 창의성(creativity)을 키운다고 봅니다. 마치 헬스장에서 가벼운 아령을 든 기록을 인정받으면 다음 날 더 무거운 아령에 도전하게 되는 것과 같습니다. 인정 한마디가 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">시도\u003c/b>를 부르고, 그 시도가 결국 실력을 만드는 것입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 이 글은 Peter H. Reynolds가 쓴 그림책 The Dot에서 가져온 장면입니다. Vashti는 원래 자기 그림에 자신이 없는 아이였는데, 선생님이 그녀의 점을 금색 액자에 걸어 주면서 상황이 완전히 뒤집혀요. 교육심리학에서는 이렇게 나도 할 수 있다는 믿음을 self-efficacy, 즉 자기효능감이라고 부릅니다. 그리고 능력은 고정된 것이 아니라 노력으로 자란다는 생각을 growth mindset, 성장 마인드셋이라고 해요. 헬스장에서 가벼운 아령을 든 기록을 인정받으면 다음 날 더 무거운 아령에 도전하게 되는 것과 같은 원리죠. 결국 인정 한마디가 다음 시도를 부르고, 그 시도가 실력을 만든다는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>액자 속의 점\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>다음 주에 Vashti가 미술 수업에 들어갔을 때, 그녀는 \u003cb class=\"key\">놀람\u003c/b>을 감추지 못합니다. 선생님의 책상 위에 \u003cb class=\"key\">그림\u003c/b>이 한 점 있었기 때문입니다. 그것은 다름 아닌 \u003cb class=\"key\">금색 \u003c/b>\u003cb class=\"key\">액자\u003c/b>에 들어간 그녀 자신의 점이었습니다. 자기 점이 작품처럼 대접받는 장면이 이야기의 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>도전의 선언\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>Vashti는 저것보다 더 나은 점을 만들 수 있다고 \u003cb class=\"key\">외칩니다\u003c/b>. 이 말은 곧 \u003cb class=\"key\">도전\u003c/b>의 선언입니다. 그녀는 자신의 수채화 물감 세트를 열고 바로 \u003cb class=\"key\">작업\u003c/b>을 시작합니다. 액자에 걸린 점 하나가 그녀 안의 자신감을 깨운 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>점을 찍다\u003csmall>전개 · 문장 8–13\u003c/small>\u003c/h4>\u003cp>Vashti는 점들을 만들기 위해 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">그리고 \u003c/b>\u003cb class=\"key\">또 \u003c/b>\u003cb class=\"key\">그립니다\u003c/b>. 빨간 점, 노란 점, 파란 점이 차례로 종이 위에 나타납니다. 여기서 멈추지 않고 그녀는 파란색을 노란색과 \u003cb class=\"key\">섞어\u003c/b> 초록색 점을 만들어 냅니다. 단순한 반복이 \u003cb class=\"key\">색의 \u003c/b>\u003cb class=\"key\">혼합\u003c/b>이라는 새로운 시도로 이어지는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>더 크게\u003csmall>발전 · 문장 14–17\u003c/small>\u003c/h4>\u003cp>초록 점을 만든 뒤 그녀는 자신에게 매우 \u003cb class=\"key\">만족\u003c/b>합니다. 그리고 작은 점들을 만들었으니 큰 것들도 만들 수 있을 것 같다고 \u003cb class=\"key\">추측\u003c/b>합니다. 실제로 그녀는 더 큰 붓과 더 큰 종이를 사용해 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">점\u003c/b>들을 만듭니다. 자신감이 커지면서 작업의 규모도 함께 커지는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>칠하지 않은 점\u003csmall>결론 · 문장 18–20\u003c/small>\u003c/h4>\u003cp>마지막에 Vashti는 심지어 점을 그리지 않고도 점을 \u003cb class=\"key\">만듭니다\u003c/b>. 둥근 중앙 부분을 제외하고 종이 전체를 칠해 \u003cb class=\"key\">흰 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 남긴 것입니다. 이것은 붓으로 찍는 방식에서 벗어난 발상의 전환입니다. 작은 점 하나가 \u003cb class=\"key\">창의력\u003c/b>의 끝까지 밀고 나간 셈입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장을 따라가면서 글의 흐름을 다섯 단계로 나눠 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 다음 주에 Vashti가 미술 수업에 들어갔을 때 그녀는 놀람을 감추지 못합니다. 선생님의 책상 위에 그림이 한 점 있었기 때문이죠. 그것은 금색 액자에 들어간 그녀 자신의 점이었어요. 자기 점이 작품처럼 대접받는 장면이 이야기의 출발점입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환입니다. Vashti는 저것보다 더 나은 점을 만들 수 있다고 외칩니다. 이 말은 곧 도전의 선언이에요. 그리고 그녀는 자신의 수채화 물감 세트를 열고 바로 작업을 시작합니다. 액자에 걸린 점 하나가 그녀 안의 자신감을 깨운 셈이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 본격적인 작업이 이어집니다. Vashti는 점들을 만들기 위해 더 그리고 또 그립니다. 빨간 점, 노란 점, 파란 점이 차례로 나타나고, 거기서 멈추지 않고 파란색을 노란색과 섞어 초록색 점을 만들어 내요. 단순한 반복이 색의 혼합이라는 새로운 시도로 이어지는 단계입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 발전이에요. 초록 점을 만든 뒤 그녀는 자신에게 매우 만족합니다. 그리고 작은 점들을 만들었으니 큰 것들도 만들 수 있을 것 같다고 추측하죠. 실제로 더 큰 붓과 더 큰 종이를 사용해 더 큰 점들을 만들어요. 자신감이 커지면 작업의 규모도 함께 커진다는 걸 보여 줍니다.","hl":"f3"},{"n":8,"text":"마지막 단계는 심화이자 결론입니다. Vashti는 심지어 점을 그리지 않고도 점을 만듭니다. 둥근 중앙 부분을 제외하고 종이 전체를 칠해서 흰 점을 남긴 거예요. 붓으로 찍는 방식에서 벗어난 발상의 전환이죠. 작은 점 하나가 창의력의 끝까지 밀고 나간 셈입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 'Next week'라는 시간 표현으로 시작해 사건이 차례로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개입니다. 주제를 앞에서 선언하지 않고, 마지막에 점을 그리지 않고도 점을 만드는 장면을 보여 주면서 \u003cb class=\"key\">창의력\u003c/b>이라는 메시지를 완성합니다. 그래서 핵심 내용이 글의 뒤쪽에 놓이는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 열여덟 번째 문장이 주제문이고, 열아홉 번째와 스무 번째 문장이 그 근거가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Next week (1)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>She was surprised (2)\u003c/b>\u003cspan>결과 제시\u003c/span>\u003cb>Hmm (5)\u003c/b>\u003cspan>감탄·분위기 전환\u003c/span>\u003cb>and (8)\u003c/b>\u003cspan>동작 누적\u003c/span>\u003cb>even (18)\u003c/b>\u003cspan>강조(심화)\u003c/span>\u003cb>except (19)\u003c/b>\u003cspan>예외 표시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a picture above the teacher's desk\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her dot in a gold frame\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a better dot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">little dots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">big ones\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bigger dots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a white dot\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순입니다. 다음 주라는 시간 표현으로 시작해서 사건이 차례로 이어지죠. 구조로 보면 미괄식이에요. 주제를 앞에서 딱 말하지 않고, 마지막에 점을 그리지 않고도 점을 만드는 장면을 보여 주면서 창의력이라는 메시지를 완성하기 때문입니다. 그래서 마지막 세 문장을 특히 눈여겨봐야 해요.","hl":"ty"},{"n":10,"text":"신호어를 먼저 보면, 첫 번째 문장의 Next week가 시간의 시작을 알려 줍니다. 두 번째 문장의 She was surprised는 앞 장면의 결과를 받아 주는 표현이고, 다섯 번째 문장의 Hmm은 감탄과 함께 분위기를 바꾸는 신호예요. 여덟 번째 문장에서는 and로 동작이 계속 누적되고, 열여덟 번째 문장의 even은 심지어라는 뜻으로 내용이 한 단계 더 나아간다는 걸 알려 줍니다. 열아홉 번째 문장의 except는 예외를 표시하는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>next week\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다음 주에\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 걸어 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>above\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~보다 위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>dot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점\u003c/span>\u003c/div>\u003cdiv>\u003cb>gold\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>금색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>frame\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액자, 틀\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>better\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 나은\u003c/span>\u003c/div>\u003cdiv>\u003cb>than\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 벌, 세트\u003c/span>\u003c/div>\u003cdiv>\u003cb>watercolors\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수채화 물감\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>동사\u003c/em>\u003cspan>작업하다, 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(물감으로) 그리다, 칠하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창조하다, 만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섞다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be happy with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 만족하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>guess\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추측하다, ~인 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>brush\u003c/b>\u003cem>명사\u003c/em>\u003cspan>붓\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>except\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 제외하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>round\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>둥근\u003c/span>\u003c/div>\u003cdiv>\u003cb>center\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중앙, 중심\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚어 볼게요. frame은 액자, set은 한 벌이나 세트를 뜻합니다. mix는 섞다, whole은 전체의, except는 제외하고라는 뜻이에요. 그리고 even은 심지어라는 뜻으로 뒤에 오는 내용을 강조하는 부사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">surprised\u003c/b>\u003cspan class=\"m\">놀란\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">amazed\u003c/span>\u003cspan class=\"s\">astonished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unmoved\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">창조하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mix\u003c/b>\u003cspan class=\"m\">섞다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">blend\u003c/span>\u003cspan class=\"s\">combine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">만족한, 기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">little\u003c/b>\u003cspan class=\"m\">작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">small\u003c/span>\u003cspan class=\"s\">tiny\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">big\u003c/span>\u003cspan class=\"a\">large\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">better\u003c/b>\u003cspan class=\"m\">더 나은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improved\u003c/span>\u003cspan class=\"s\">superior\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">whole\u003c/b>\u003cspan class=\"m\">전체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">except\u003c/b>\u003cspan class=\"m\">~을 제외하고\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">other than\u003c/span>\u003cspan class=\"s\">but\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">including\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 둘게요. surprised는 amazed나 astonished로 바꿔 쓸 수 있고 반대말은 unmoved 정도로 잡으면 됩니다. create는 make, produce와 가깝고 반대말은 destroy예요. mix는 blend, combine으로 바꿀 수 있고 반대말은 separate입니다. happy는 pleased, delighted, glad와 같은 뜻이고 반대말은 sad나 unhappy죠. little은 small, tiny와 같고 반대말은 big, large이고, whole은 entire, complete와 같고 반대말은 partial입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 주에\u003c/span>\u003cspan class=\"en\">Next week,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는\u003c/span>\u003cspan class=\"en\">Vashti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸어 들어갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">walked\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미술 수업에\u003c/span>\u003cspan class=\"en\">art class.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 주에 Vashti는 미술 수업에 들어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 장면이 바뀌는 것을 알려 주는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 'Next week'는 앞 이야기에서 일주일쯤 지난 \u003cb class=\"key\">시간\u003c/b>을 표시하며 새로운 사건이 시작됨을 알려 줘요. Vashti가 미술실로 들어오는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 그림처럼 그려 두면 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제(규칙 동사)\u003c/span> : [동사원형] + ed = 과거형 : \"걸어 들어갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 into(방향)\u003c/span> : walk [into + 장소] = …안으로 걸어 들어가다 : \"…안으로\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Next week, 다음 주에. Vashti, Vashti는. walked into, 걸어 들어갔다. art class, 미술 수업에. 이 문장 전체를 해석하면, 다음 주에 Vashti는 미술 수업에 들어갔다.","hl":"m"},{"n":14,"text":"이 문장은 장면이 바뀐다는 걸 알려 주는 문장이에요. Next week, 그러니까 앞 이야기에서 일주일쯤 지난 시간을 표시하면서 새 장면이 시작된다는 신호를 주죠. Vashti가 미술실로 걸어 들어오는 모습을 머릿속에 그려 보면서 읽어 보세요.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 walked예요. 이미 지난 일을 말하니까 walk에 ed를 붙여 과거형으로 썼어요. 두 번째는 into인데, 밖에서 안으로 이동하는 방향을 나타내는 전치사라서 art class 앞에 딱 붙어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀랐다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 놀랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 교실에 들어간 Vashti가 무언가를 보고 \u003cb class=\"key\">놀람\u003c/b>을 느꼈음을 바로 알려 주는 짧은 문장이에요. 왜 놀랐는지는 다음 문장에서 밝혀지므로, 여기서는 독자의 \u003cb class=\"key\">궁금증\u003c/b>을 만드는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 형용사(be + 과거분사)\u003c/span> : [주어] + be동사 + [surprised(감정 형용사)] = 놀란 상태이다 : \"놀랐다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"She, 그녀는. was surprised, 놀랐다. 이 문장 전체를 해석하면, 그녀는 놀랐다.","hl":"m"},{"n":17,"text":"Vashti가 교실에 들어가서 무언가를 보고 놀랐다는 사실을 알려 주는 문장이에요. 왜 놀랐는지는 바로 다음 문장에서 밝혀지니까, 여기서는 궁금증만 남겨 두는 거예요.","hl":"mn"},{"n":18,"text":"was surprised를 그냥 '놀라게 되었다'로 외우지 말고 감정을 나타내는 형용사로 이해해요. 놀람은 무언가에 놀라게 된 결과라서 과거분사 surprised를 be동사 뒤에 써서 상태를 보여 줘요. 그래서 '놀란 상태였다'가 되고 우리말로는 '놀랐다'로 자연스럽게 옮겨요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림이 한 점\u003c/span>\u003cspan class=\"en\">a picture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님의 책상 위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">above\u003c/span> the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">teacher's\u003c/span> desk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선생님의 책상 위에 그림이 한 점 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 놀란 이유가 드러나는 문장이에요. 선생님 책상 위에 \u003cb class=\"key\">그림\u003c/b>이 한 점 있다는 \u003cb class=\"key\">배경\u003c/b>을 제시해요. 이 그림이 뒤에 나오는 'her dot', 즉 Vashti가 찍은 점이라는 것을 독자는 짐작하게 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] + [장소·수식어구] : \"…이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 above(위치)\u003c/span> : above + [명사] = …보다 위에 : \"…위에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격('s)\u003c/span> : [사람 명사] + 's = …의 : \"선생님의\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"There was, 있었다. a picture, 그림이 한 점. above the teacher's desk, 선생님의 책상 위에. 이 문장 전체를 해석하면, 선생님의 책상 위에 그림이 한 점 있었다.","hl":"m"},{"n":20,"text":"드디어 Vashti가 놀란 이유가 나와요. 선생님 책상 위에 그림이 한 점 있었다는 배경을 보여 주는 문장이죠. 그리고 이 그림이 바로 뒤에 나오는 her dot, 그러니까 Vashti가 찍었던 점이라는 걸 독자는 짐작하게 됩니다.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 There was예요. 무엇이 있다는 존재를 말할 때는 주어 앞에 There를 세우고, be동사는 뒤에 오는 주어 a picture에 맞춰 was로 써요. 두 번째로 teacher's는 사람 명사 teacher에 소유격 표시를 붙여 선생님의라는 소유 관계를 만든 것이고, 세 번째로 above는 책상 표면에 닿은 느낌이 아니라 위쪽 공간을 뜻하는 위치 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 점\u003c/span>\u003cspan class=\"en\">her dot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금색 액자에 있는!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">gold \u003c/span>\u003cspan class=\"tgt\">frame\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 금색 액자에 있는 그녀의 점이었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 선생님 책상 위에 그림이 하나 있었다고 했죠. 그 그림의 정체가 바로 바슈티가 찍었던 \u003cb class=\"key\">점\u003c/b>이었고, 그것도 \u003cb class=\"key\">금색 \u003c/b>\u003cb class=\"key\">액자\u003c/b>에 담겨 걸려 있었다는 뜻이에요. 자기 점이 작품처럼 대접받는 걸 보고 바슈티의 \u003cb class=\"key\">자신감\u003c/b>이 싹트는 장면이라 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : [지시대명사 It] + be동사 + [명사(보어)] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 her dot] + [전치사구 in a gold frame] : \"금색 액자에 있는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It was, 그것은 ~이었다. her dot, 그녀의 점. in a gold frame!, 금색 액자에 있는!. 이 문장 전체를 해석하면, 그것은 금색 액자에 있는 그녀의 점이었다!","hl":"m"},{"n":23,"text":"앞에서 선생님 책상 위에 그림이 하나 있었다고 했죠. 그 그림이 바로 바슈티가 그린 점이었어요. 그것도 금색 액자에 담겨 걸려 있었으니, 자기 점이 작품처럼 대접받는 걸 보고 바슈티가 자신감을 얻는 장면이에요.","hl":"mn"},{"n":24,"text":"첫 번째, It은 앞 문장에 나온 a picture를 받는 지시대명사예요. 두 번째, in a gold frame은 전치사구로 앞의 her dot을 뒤에서 꾸며 주는 형용사 역할을 해요. 그래서 금색 액자에 있는 그녀의 점, 이렇게 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음!\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Hmm!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“음!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림을 본 바슈티가 짧게 내뱉는 \u003cb class=\"key\">감탄\u003c/b> 소리예요. 놀라움과 동시에 '이 정도면 나도 더 잘할 수 있는데' 하는 \u003cb class=\"key\">아쉬움\u003c/b>이 섞인 느낌이죠. 바로 뒤에 이어지는 말의 분위기를 만들어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄사(느낌을 나타내는 말)\u003c/span> : [감탄사] + [느낌을 실은 억양] : \"음!\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Hmm!, 음!. 이 문장 전체를 해석하면, “음!","hl":"m"},{"n":26,"text":"그림을 본 바슈티가 음, 하고 내뱉는 소리예요. 놀라움과 함께 나라면 더 잘할 수 있는데 하는 아쉬움이 섞여 있죠. 바로 다음 문장으로 자연스럽게 이어지는 신호탄 같은 말이에요.","hl":"mn"},{"n":27,"text":"이 문장은 감탄사 하나로 이루어져 있어요. 문장 성분을 갖추지 않고 느낌만 전하는 말이라서, 해석할 때도 음, 정도로 가볍게 살려 주면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만들 수 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">dot\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저것보다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 저것보다 더 나은 점을 만들 수 있어!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 액자에 걸린 자기 점을 보고, 저것보다 더 나은 점을 만들겠다는 \u003cb class=\"key\">의지\u003c/b>를 드러내는 문장이에요. better는 good의 \u003cb class=\"key\">비교급\u003c/b>으로 '저것보다 더 나은'이라는 뜻이죠. 이 한마디가 뒤에서 바슈티가 여러 가지 점을 그려 내는 \u003cb class=\"key\">계기\u003c/b>가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(능력)\u003c/span> : [주어] + [can + 동사원형] : \"나는 만들 수 있어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사의 명사 수식\u003c/span> : [비교급 형용사 better] + [명사 dot] : \"더 나은 점\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 that(비교 대상)\u003c/span> : [비교급] + than + [지시대명사 that] : \"저것보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급과 than의 짝\u003c/span> : [비교급 …] + than + [비교 대상] : \"~보다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I can make, 나는 만들 수 있어. a better dot, 더 나은 점을. than that!, 저것보다!. 이 문장 전체를 해석하면, 나는 저것보다 더 나은 점을 만들 수 있어!”","hl":"m"},{"n":29,"text":"액자에 걸린 자기 점을 보더니, 저것보다 더 나은 점을 만들겠다고 선언하는 장면이에요. 이 한마디가 바슈티가 물감을 열고 점을 그리기 시작하는 계기가 되죠. 결국 이 말이 뒤에 나오는 여러 점들의 출발점이에요.","hl":"mn"},{"n":30,"text":"첫 번째, can 뒤에는 동사원형이 와서 can make가 되는 거예요. 두 번째, better는 good의 비교급이라서 더 나은 점이라는 뜻이 되고, 비교급이 명사 앞에서 꾸며 주고 있어요. 세 번째, than 뒤의 that은 앞에 나온 a dot을 대신 받는 지시대명사예요. 그래서 than that은 저 점보다, 이렇게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 열었다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">opened \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 수채화 그림물감 세트를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">watercolors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작업하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신의 수채화 그림물감 세트를 열고 작업하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 자신의 그림 도구를 스스로 열어 작업을 시작하는 장면이에요. 앞에서 자신이 찍은 점이 액자에 걸린 것을 보고 마음이 움직였다는 사실을 보여 주는 대목이죠. 그래서 이 문장은 이야기가 본격적으로 움직이기 시작하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬구조(동사 병렬)\u003c/span> : [동사 opened + 목적어] + and + [동사 started + to부정사] : \"열었고 … 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start [타동사] + [to work (to부정사구/목적어)] : \"작업하기를 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"She opened, 그녀는 열었다. her set of watercolors, 자신의 수채화 그림물감 세트를. and started, 그리고 시작했다. to work, 작업하기를. 이 문장 전체를 해석하면, 그녀는 자신의 수채화 그림물감 세트를 열고 작업하기 시작했다.","hl":"m"},{"n":32,"text":"Vashti가 직접 그림 도구를 꺼내서 작업을 시작하는 장면이에요. 앞에서 자신이 찍은 점이 액자에 걸린 걸 보고 마음이 움직였다는 걸 보여 주는 대목이죠. 그래서 이 문장은 이야기가 본격적으로 출발하는 전환점 같은 역할을 해요.","hl":"mn"},{"n":33,"text":"먼저 opened와 started가 and로 나란히 연결된 병렬구조라는 점을 꼭 기억해 주세요. 주어 She를 두 동사가 함께 쓰는 구조예요. 두 번째로 started to work에서 to work는 start라는 동사의 목적어 자리에 온 to부정사예요. start는 뒤에 to부정사를 목적어로 자주 데리고 온다는 것도 같이 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는 그리고 또 그렸다\u003c/span>\u003cspan class=\"en\">Vashti \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">painted \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">painted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많이\u003c/span>\u003cspan class=\"en\">more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점들을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">dots\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 점들을 만들기 위해 더 그리고 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 같은 말을 두 번 반복한 painted and painted가 '계속해서, 점점 더' 그렸다는 느낌을 만들어 줘요. 결국 Vashti가 점 만들기에 완전히 빠져들었다는 것을 보여 주는 문장이죠. 뒤에 붙은 to create dots는 그렇게 그린 \u003cb class=\"key\">이유\u003c/b>와 \u003cb class=\"key\">목적\u003c/b>을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 반복을 통한 강조(병렬)\u003c/span> : [동사] + and + [같은 동사] + more : \"그리고 또 그렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사 ~] + [to create dots (to부정사구/목적)] : \"점들을 만들기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Vashti painted and painted, Vashti는 그리고 또 그렸다. more, 더 많이. to create dots, 점들을 만들기 위해. 이 문장 전체를 해석하면, Vashti는 점들을 만들기 위해 더 그리고 그렸다.","hl":"m"},{"n":35,"text":"같은 말을 두 번 반복한 painted and painted가 '계속해서, 점점 더' 그렸다는 느낌을 만들어 줘요. 결국 Vashti가 점 만들기에 푹 빠졌다는 걸 보여 주는 문장이죠. 뒤의 to create dots는 그렇게 그린 이유, 즉 목적을 알려 줍니다.","hl":"mn"},{"n":36,"text":"여기서 to create dots는 '점들을 만들기 위해서'라는 뜻의 to부정사 부사적 용법이에요. 목적을 나타낼 때는 to부정사를 문장 뒤에 붙인다고 정리해 두세요. 참고로 painted and painted처럼 같은 동사를 and로 이어 주면 '계속 그렸다'는 강조 효과가 생깁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">red \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">dot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빨간 점.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 점을 여러 개 만들었다고 했으니, 그 점들을 하나씩 구체적으로 보여 주는 대목이에요. 빨간 점, 노란 점, 파란 점이 차례로 이어지면서 \u003cb class=\"key\">색깔\u003c/b>이 더해지는 흐름이 만들어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 한정적 용법(명사 수식)\u003c/span> : [관사 A] + [형용사 red] + [명사 dot] : \"빨간 점\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"A red, 빨간. dot, 점.. 이 문장 전체를 해석하면, 빨간 점.","hl":"m"},{"n":38,"text":"앞 문장에서 점을 여러 개 만들었다고 했으니, 그 점들을 하나씩 구체적으로 보여 주는 대목이에요. 빨간 점, 노란 점, 파란 점이 차례로 이어지면서 색깔이 더해지는 흐름이 만들어집니다.","hl":"mn"},{"n":39,"text":"여기서는 red라는 형용사가 dot라는 명사 앞에서 그 명사를 꾸며 주고 있어요. 관사 A, 형용사 red, 명사 dot 순서로 놓이는 영어의 기본 어순을 확인해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노란 점.\u003c/span>\u003cspan class=\"en\">yellow dot.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">노란 점.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 빨간 점을 보여 준 데 이어, 여기서는 \u003cb class=\"key\">노란 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 제시하며 색깔별로 점을 만들어 가는 과정을 보여 줍니다. 여러 색의 점을 하나씩 나열하는 흐름 속에서 \u003cb class=\"key\">색의 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>을 드러내는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정관사 a\u003c/span> : A + [형용사] + [단수 가산명사] : \"하나의\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"A, 하나의. yellow dot, 노란 점.. 이 문장 전체를 해석하면, 노란 점.","hl":"m"},{"n":41,"text":"앞에서 빨간 점을 보여 준 데 이어, 여기서는 노란 점을 제시하며 색깔별로 점을 만들어 가는 과정을 보여 줍니다. 여러 색의 점을 하나씩 나열하는 흐름 속에서 색의 다양성을 드러내는 부분이에요.","hl":"mn"},{"n":42,"text":"여기서 A는 노란 점 하나를 가리키는 부정관사예요. 단수 가산명사 앞에 붙어서 '하나의'라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파란 점.\u003c/span>\u003cspan class=\"en\">blue dot.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">파란 점.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노란 점에 이어 \u003cb class=\"key\">파란 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 보여 주며 색깔별 나열을 이어 갑니다. 이 파란 점은 바로 다음 문장에서 노란색과 섞이는 재료가 되므로, 뒤의 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 준비하는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정관사 a\u003c/span> : A + [형용사] + [단수 가산명사] : \"하나의\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"A, 하나의. blue dot, 파란 점.. 이 문장 전체를 해석하면, 파란 점.","hl":"m"},{"n":44,"text":"노란 점에 이어 파란 점을 보여 주며 색깔별 나열을 이어 갑니다. 이 파란 점은 바로 다음 문장에서 노란색과 섞이는 재료가 되므로, 뒤의 색 변화를 준비하는 역할도 해요.","hl":"mn"},{"n":45,"text":"여기서도 A는 파란 점 하나를 가리키는 부정관사예요. 단수 가산명사 앞에 붙어 '하나의'라는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 섞었다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">mixed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파란색을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">blue \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노란색과.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">yellow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 파란색을 노란색과 섞었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바슈티가 파란색과 노란색을 섞어 새로운 색을 만드는 장면입니다. 앞의 색깔별 점 나열이 \u003cb class=\"key\">색의 \u003c/b>\u003cb class=\"key\">혼합\u003c/b>으로 발전하고, 다음 문장에서 \u003cb class=\"key\">초록 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 만들 수 있게 되는 원인을 제공해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">mix A with B 구문\u003c/span> : mix [A] with [B] (A를 B와 섞다) : \"파란색을 노란색과 섞었다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"She mixed, 그녀는 섞었다. the blue, 파란색을. with the yellow, 노란색과.. 이 문장 전체를 해석하면, 그녀는 파란색을 노란색과 섞었다.","hl":"m"},{"n":47,"text":"바슈티가 파란색과 노란색을 섞어 새로운 색을 만드는 장면입니다. 앞의 색깔별 점 나열이 색의 혼합으로 발전하고, 다음 문장에서 초록 점을 만들 수 있게 되는 원인을 제공해요.","hl":"mn"},{"n":48,"text":"여기서 핵심은 mix A with B 구문이에요. 무엇을 무엇과 섞는지 말할 때는 mix A with B 형태로 씁니다. A 자리에는 the blue, B 자리에는 the yellow가 들어가서 파란색을 노란색과 섞었다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초록색 점을!\u003c/span>\u003cspan class=\"en\">a green dot!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 초록색 점을 만들 수 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 파란색과 노란색을 섞어 \u003cb class=\"key\">초록색 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 \u003cb class=\"key\">만들 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있었다\u003c/b>는 장면이에요. 앞에서 색을 섞는 행동이 결과로 이어지며, 그녀가 점을 만드는 즐거움을 느끼기 시작한다는 흐름을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could의 과거 능력\u003c/span> : [주어] + could + [동사원형] : \"만들 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"She, 그녀는. could make, 만들 수 있었다. a green dot!, 초록색 점을!. 이 문장 전체를 해석하면, 그녀는 초록색 점을 만들 수 있었다!","hl":"m"},{"n":50,"text":"Vashti가 파란색과 노란색을 섞어 초록색 점을 만들 수 있었다는 장면이에요. 앞에서 색을 섞는 행동이 결과로 이어지면서, 그녀는 점을 만드는 즐거움을 느끼기 시작하죠.","hl":"mn"},{"n":51,"text":"여기서 핵심은 조동사 could예요. could는 과거의 능력을 나타내고, 뒤에는 동사원형 make가 와서 만들 수 있었다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 만족했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">happy\u003c/span> with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">herself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신에게 매우 만족했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 자신이 만든 점에 대해 스스로 \u003cb class=\"key\">만족\u003c/b>했음을 보여 주는 문장이에요. 앞의 성공이 그녀의 \u003cb class=\"key\">자신감\u003c/b>을 높여 다음에는 더 큰 점에 도전하게 하는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(주어의 상태)\u003c/span> : [주어] + was + [형용사] : \"매우 행복했다/매우 만족했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사 herself\u003c/span> : with + [재귀대명사] : \"자신에게\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"She, 그녀는. was very happy with, 매우 만족했다. herself, 자신에게. 이 문장 전체를 해석하면, 그녀는 자신에게 매우 만족했다.","hl":"m"},{"n":53,"text":"Vashti가 자신이 만든 점에 대해 스스로 만족했음을 보여 주는 문장이에요. 앞의 성공이 그녀의 자신감을 높여 다음에는 더 큰 점에 도전하게 하는 흐름을 만들어요.","hl":"mn"},{"n":54,"text":"첫 번째로 was very happy는 be동사 뒤에 형용사가 와서 주어의 상태를 설명하는 부분이에요. be happy with는 만족하다라는 뜻으로 쓰여요. 두 번째로 with 뒤의 herself는 주어 She와 같은 사람을 가리키는 재귀대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">&quot;I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lots \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 점들을\u003c/span>\u003cspan class=\"en\">little dots.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 많은 작은 점들을 만들었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 이미 많은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">점\u003c/b>들을 만들었다고 말하며, 이제는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">점\u003c/b>도 만들 수 있겠다는 \u003cb class=\"key\">자신감\u003c/b>을 보이는 문장이에요. 작은 점에서 큰 점으로 나아가려는 대화의 출발점이 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 make의 과거형\u003c/span> : [주어] + made + [목적어] : \"만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 lots of\u003c/span> : lots of + [복수명사] : \"많은\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"I, 나는. made, 만들었다. lots of, 많은. little dots, 작은 점들을. 이 문장 전체를 해석하면, “나는 많은 작은 점들을 만들었어.","hl":"m"},{"n":56,"text":"Vashti가 이미 많은 작은 점들을 만들었다고 말하며, 이제는 큰 점도 만들 수 있겠다는 자신감을 보이는 문장이에요. 작은 점에서 큰 점으로 나아가려는 대화의 출발점이 되죠.","hl":"mn"},{"n":57,"text":"첫 번째로 made는 make의 과거형으로, 이미 끝난 행동을 나타내요. 두 번째로 lots of는 셀 수 있는 복수명사 little dots 앞에서 많은이라는 수량을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">guess \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 만들 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">can\u003c/span> make\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 것들도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">ones\u003c/span>, too.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 큰 것들도 만들 수 있을 것 같아.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 작은 점들을 많이 만든 Vashti가 이제 큰 점들도 만들 수 있겠다고 말하는 장면이에요. 작은 점에서 얻은 \u003cb class=\"key\">자신감\u003c/b>이 더 큰 시도로 이어지는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적절)\u003c/span> : guess + [that] + 주어 + 동사 : \"내가 ~할 수 있다고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사 ones\u003c/span> : [형용사] + ones = 앞에 나온 복수명사 반복 피함 : \"큰 것들\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"I guess, 나는 생각해요. I can make, 내가 만들 수 있다고. big ones, too, 큰 것들도. 이 문장 전체를 해석하면, 나는 큰 것들도 만들 수 있을 것 같아.”","hl":"m"},{"n":59,"text":"앞에서 작은 점들을 많이 만들었죠. 그래서 Vashti는 이제 큰 점들도 만들 수 있겠다고 스스로 자신감을 내비치는 장면이에요. 작은 점에서 시작한 자신감이 큰 점으로 확장되는 흐름을 보여 줍니다.","hl":"mn"},{"n":60,"text":"첫 번째로 I guess 뒤에 접속사 that이 생략되어 I can make가 바로 이어져요. 그래서 내가 만들 수 있다고 생각해로 해석해요. 두 번째로 big ones의 ones는 앞에 나온 dots를 반복하지 않으려고 쓴 부정대명사예요. 그래서 big ones는 큰 것들이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 20\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는 사용했어요\u003c/span>\u003cspan class=\"en\">Vashti used\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 붓과 더 큰 종이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">brush \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 점들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">dots\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 더 큰 점들을 만들기 위해 더 큰 붓과 더 큰 종이를 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 점들을 여러 개 만든 Vashti가 이제 더 큰 붓과 더 큰 종이를 선택해 점의 크기를 키우는 장면이에요. 이는 자신감이 커지면서 행동의 규모도 커지는 \u003cb class=\"key\">확장\u003c/b>을 보여 주고, 뒤의 큰 점 만들기로 이어지는 \u003cb class=\"key\">흐름\u003c/b>을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 형용사와 명사구의 병렬\u003c/span> : a bigger brush and (a) bigger paper : \"더 큰 붓과 더 큰 종이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : used + 목적어 + to make + 목적어 = ~하기 위해 ...을 사용했다 : \"더 큰 점들을 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"Vashti used, Vashti는 사용했어요. a bigger brush and bigger paper, 더 큰 붓과 더 큰 종이를. to make, 만들기 위해. bigger dots, 더 큰 점들을. 이 문장 전체를 해석하면, Vashti는 더 큰 점들을 만들기 위해 더 큰 붓과 더 큰 종이를 사용했다.","hl":"m"},{"n":62,"text":"작은 점들을 여러 개 만든 Vashti가 이제 더 큰 붓과 더 큰 종이를 선택해 점의 크기를 키우는 장면이에요. 자신감이 커지면서 행동의 규모도 커지는 확장을 보여 주고, 뒤의 큰 점 만들기로 이어지는 흐름을 만듭니다.","hl":"mn"},{"n":63,"text":"첫 번째로 a bigger brush and bigger paper는 and로 두 명사구를 병렬로 연결한 표현이에요. 두 명사구 모두 bigger라는 비교급의 영향을 받아 더 크다는 뜻을 가져요. 두 번째로 to make bigger dots는 목적을 나타내는 to부정사의 부사적 용법이에요. 그래서 더 큰 점들을 만들기 위해로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는 심지어 만들었어요\u003c/span>\u003cspan class=\"en\">Vashti \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even\u003c/span> made\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점을\u003c/span>\u003cspan class=\"en\">a dot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 그리지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">painting \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 심지어 점을 그리지 않고 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉으로는 점을 그리지 않고 점을 만들었다는 뜻이라 모순처럼 들려요. 하지만 다음 문장에서 종이 전체를 칠하고 가운데만 남겨 \u003cb class=\"key\">흰 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 만든 방식이 드러나요. 그래서 이 문장은 Vashti의 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 보여 주는 핵심 실마리예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 even(강조)\u003c/span> : even + 동사/명사 = 심지어 ~조차 : \"심지어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : without + [동명사(V-ing)] = ~하지 않고 : \"그것을 그리지 않고\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Vashti even made, Vashti는 심지어 만들었어요. a dot, 점을. without painting one, 그것을 그리지 않고. 이 문장 전체를 해석하면, Vashti는 심지어 점을 그리지 않고 만들었다.","hl":"m"},{"n":65,"text":"겉으로는 점을 그리지 않고 점을 만들었다는 뜻이라 모순처럼 들려요. 하지만 다음 문장에서 종이 전체를 칠하고 가운데만 남겨 흰 점을 만든 방식이 드러나요. 그래서 이 문장은 Vashti의 창의적 전환을 보여 주는 핵심 실마리예요.","hl":"mn"},{"n":66,"text":"첫 번째로 even은 심지어라는 뜻으로 놀라운 사실을 강조하는 부사예요. 두 번째로 without painting one에서 without은 전치사라서 뒤에 동명사 painting이 와요. 그래서 그것을 그리지 않고라는 부대상황을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 20\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 색칠했다\u003c/span>\u003cspan class=\"en\">She painted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이 전체를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둥근 중앙 부분을 제외하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">except \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">round \u003c/span>\u003cspan class=\"tgt\">center\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 둥근 중앙 부분을 제외하고 종이 전체를 색칠했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Vashti가 종이 전체를 색칠하면서 가운데 둥근 부분은 일부러 남겨 두었음을 보여 줘요. 그 남겨진 \u003cb class=\"key\">여백\u003c/b>이 곧 하나의 점처럼 보이게 되는 장면으로 이어지는, 글의 \u003cb class=\"key\">반전\u003c/b>을 준비하는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 whole의 위치와 의미\u003c/span> : the + whole + [명사] = 전체 [명사] : \"종이 전체\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 except(…을 제외하고)\u003c/span> : except + [명사(구)] = …을 제외하고 : \"둥근 중앙 부분을 제외하고\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"She painted, 그녀는 색칠했다. the whole paper, 종이 전체를. except the round center, 둥근 중앙 부분을 제외하고. 이 문장 전체를 해석하면, 그녀는 둥근 중앙 부분을 제외하고 종이 전체를 색칠했다.","hl":"m"},{"n":68,"text":"이 문장은 바슈티가 종이 전체를 색칠하되 가운데 둥근 부분은 남겨 두었다는 뜻이에요. 그래서 남은 여백이 흰 점처럼 보이게 되고, 바로 다음 문장의 흰색 점으로 이어지는 반전을 만들어 줍니다.","hl":"mn"},{"n":69,"text":"첫 번째 어법 포인트는 the whole paper예요. whole은 관사 the 뒤, 명사 paper 앞에서 전체라는 뜻을 만들어요. all the paper와 달리 the whole paper 순서로 쓴다는 점을 기억하세요. 두 번째는 except the round center인데, except는 전치사로 제외의 대상을 나타내요. painted의 목적어인 the whole paper에서 중앙 부분만 빼고 색칠했다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흰색 점이\u003c/span>\u003cspan class=\"en\">a white dot!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">흰색 점이 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 색칠하지 않고 남긴 둥근 중앙이 바로 \u003cb class=\"key\">흰색 \u003c/b>\u003cb class=\"key\">점\u003c/b>이 되었음을 밝히는 문장이에요. 붓으로 그린 점이 아니라 \u003cb class=\"key\">여백\u003c/b>으로 만든 점이라는 점에서 이 이야기의 \u003cb class=\"key\">반전\u003c/b>을 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(존재)\u003c/span> : There + be동사 + [주어] = [주어]가 있다 : \"있었다\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"There was, 있었다. a white dot!, 흰색 점이. 이 문장 전체를 해석하면, 흰색 점이 있었다!","hl":"m"},{"n":71,"text":"이 문장은 남겨 둔 둥근 중앙이 흰색 점으로 보였다는 뜻이에요. 붓으로 그린 점이 아니라 여백으로 만든 점이라는 점이 이 이야기의 반전이죠.","hl":"mn"},{"n":72,"text":"There was는 존재를 나타내는 구문이에요. 뒤에 오는 a white dot이 주어 역할을 하므로 동사 was는 단수형으로 맞춰요. 그래서 흰색 점이 있었다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>선생님의 책상 위 금색 액자에 걸린 자신의 \u003cb class=\"key\">점\u003c/b>을 보고 Vashti는 놀란다.\u003c/li>\u003cli>그녀는 저것보다 더 나은 점을 만들 수 있다고 말하며 \u003cb class=\"key\">작업\u003c/b>을 시작한다.\u003c/li>\u003cli>빨간 점, 노란 점, 파란 점을 만들고 파란색을 노란색과 \u003cb class=\"key\">섞어\u003c/b> 초록 점을 만든다.\u003c/li>\u003cli>더 큰 붓과 종이로 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 만들고, 마지막에는 칠하지 않고도 \u003cb class=\"key\">흰 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 남긴다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Encouraged by seeing her own dot framed, Vashti keeps experimenting and discovers her own creativity.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 선생님이 금색 액자에 걸어 둔 자신의 \u003cb class=\"key\">점\u003c/b>을 보고 더 나은 점을 만들겠다고 마음먹은 Vashti는 물감을 섞고 더 큰 붓과 종이를 쓰며 점을 발전시켜, 마침내 칠하지 않고도 점을 만들어 내는 \u003cb class=\"key\">창의력\u003c/b>까지 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":73,"text":"오늘 내용 정리해 볼게요. 금색 액자에 걸린 점 하나가 Vashti에게 자신감을 주었고, 그 자신감은 색을 섞고 종이를 키우는 실험으로 이어졌어요. 결국 그녀는 점을 그리지 않고도 점을 만드는 경지에 도달합니다. 여러분도 작은 시도 하나를 인정받는다면 그다음 시도가 훨씬 쉬워진다는 걸 기억해 두세요. 오늘 수업 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
