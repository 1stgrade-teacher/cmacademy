<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}

.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}

.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"8과 본문3","audioDir":"3_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">8과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>Please Sign It: A Shaky Line Becomes Art\u003c/h1>\u003ch2>이것에 서명해: 흔들린 선이 예술이 되다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Vashti의 많은 \u003cb class=\"key\">점\u003c/b>이 학교 미술 전시회에서 \u003cb class=\"key\">대성공\u003c/b>을 거둔 뒤, 직선조차 못 그린다고 하는 남자아이에게 Vashti는 \u003cb class=\"key\">너 \u003c/b>\u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">믿어\u003c/b>라고 말하고 종이를 건넨다. 그리고 남자아이가 그은 흔들리는 선을 보고 \u003cb class=\"key\">서명\u003c/b>하게 하며 작은 \u003cb class=\"key\">시도\u003c/b>도 \u003cb class=\"key\">작품\u003c/b>이 될 수 있음을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even a small, shaky line can become art when someone is encouraged to trust themselves and sign it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분, 오늘은 학교 미술 전시회에서 벌어지는 따뜻한 장면을 함께 읽어 볼 거예요. Vashti의 많은 점이 대성공을 거둔 뒤, 한 남자아이가 자신은 직선조차 못 그린다고 말하죠. Vashti는 남자아이에게 너 자신을 믿어라는 말을 하고, 남자아이가 그은 흔들리는 선에 서명하게 합니다. 이 글의 요지는 작은 시도라도 누군가의 격려를 받으면 작품이 될 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 이야기는 작은 \u003cb class=\"key\">점\u003c/b> 하나에서 시작된 자신감이 다른 사람에게 옮겨 가는 장면을 보여 줍니다. 미술 교육에서 중요한 것은 완벽한 결과보다 \u003cb class=\"key\">자기효능감\u003c/b>(self-efficacy), 즉 ‘나도 할 수 있다’는 믿음을 키우는 일입니다. 이러한 믿음은 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">마인드셋\u003c/b>(growth mindset)과 연결되는데, 능력은 고정된 것이 아니라 작은 시도로 자란다고 보는 태도입니다. 마치 처음 자전거를 탈 때 흔들려도 넘어지지 않고 한 번 더 페달을 밟아 보는 것과 비슷합니다. Vashti가 남자아이의 곧지 않은 선을 보고도 \u003cb class=\"key\">서명\u003c/b>을 권한 것은 결과의 완벽함보다 \u003cb class=\"key\">시도\u003c/b> 자체를 인정한 것입니다.\u003c/div>","segs":[{"n":2,"text":"이 이야기는 작은 점 하나에서 시작된 자신감이 다른 사람에게 옮겨 가는 장면을 보여 줍니다. 미술 교육에서 중요한 것은 완벽한 결과보다 자기효능감, 즉 나도 할 수 있다는 믿음을 키우는 일이에요. 이런 믿음은 성장 마인드셋과 연결됩니다. 능력은 고정된 것이 아니라 작은 시도로 자란다고 보는 태도죠. 마치 처음 자전거를 탈 때 흔들려도 한 번 더 페달을 밟아 보는 것과 비슷해요. Vashti가 남자아이의 곧지 않은 선을 보고도 서명을 권한 것은 결과의 완벽함보다 시도 자체를 인정한 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>전시회의 성공\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>몇 주 후 학교 미술 전시회가 열리고, Vashti의 많은 \u003cb class=\"key\">점\u003c/b>이 \u003cb class=\"key\">대성공\u003c/b>을 거둡니다. 이 장면은 작은 시작이 전시회의 성과로 이어졌음을 보여 줍니다. Vashti가 이전에 찍은 점들이 이제 사람들에게 인정받는 분위기입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>남자아이의 등장\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>Vashti는 자신의 옆에 서 있는 어린 남자아이를 봅니다. 남자아이는 Vashti를 \u003cb class=\"key\">대단한 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>라고 부르며 자신도 그처럼 \u003cb class=\"key\">그리고 \u003c/b>\u003cb class=\"key\">싶다\u003c/b>고 말합니다. 이는 남자아이가 Vashti의 작업을 동경하고 있음을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자신감의 씨앗\u003csmall>전환 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>Vashti는 남자아이에게 자신감을 주려고 \u003cb class=\"key\">너 \u003c/b>\u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">믿어\u003c/b>라고 말합니다. 그러나 남자아이는 \u003cb class=\"key\">직선조차\u003c/b> 그릴 수 없다며 스스로를 낮게 봅니다. 여기서 격려와 자기 의심이 맞서는 \u003cb class=\"key\">전환\u003c/b>이 일어납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>보여 달라는 요청\u003csmall>문제 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>Vashti는 미소를 지으며 남자아이에게 종이 한 장을 건넵니다. 그리고 \u003cb class=\"key\">보여 \u003c/b>\u003cb class=\"key\">줘\u003c/b>라고 말하며 남자아이가 직접 해 보게 합니다. 이는 완벽한 실력보다 \u003cb class=\"key\">시도\u003c/b>를 요구하는 장면입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>서명의 의미\u003csmall>결론 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>남자아이의 연필은 선을 그리는 동안 흔들리고, 그 선은 \u003cb class=\"key\">곧지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>. Vashti는 그 선을 주의 깊게 본 뒤 \u003cb class=\"key\">서명\u003c/b>해 달라고 말합니다. 이 말은 남자아이의 작은 선도 하나의 \u003cb class=\"key\">작품\u003c/b>으로 인정한다는 뜻입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 전시회의 성공에서 시작해 남자아이의 등장, Vashti의 격려, 작은 선, 그리고 서명 요청으로 이어지는 시간순 흐름을 가집니다.","hl":null},{"n":4,"text":"먼저 몇 주 후 학교 미술 전시회가 열리고 Vashti의 많은 점이 대성공을 거둡니다. 이 장면은 작은 시작이 전시회의 성과로 이어졌음을 보여 주죠. Vashti가 이전에 찍은 점들이 이제 사람들에게 인정받는 분위기입니다.","hl":"f0"},{"n":5,"text":"다음으로 Vashti는 자신의 옆에 서 있는 어린 남자아이를 봅니다. 남자아이는 Vashti를 대단한 예술가라고 부르며 자신도 그처럼 그리고 싶다고 말해요. 이 장면은 남자아이가 Vashti의 작업을 동경하고 있음을 보여 줍니다.","hl":"f1"},{"n":6,"text":"Vashti는 남자아이에게 자신감을 주려고 너 자신을 믿어라는 말을 합니다. 그러나 남자아이는 직선조차 그릴 수 없다며 스스로를 낮게 봐요. 여기서 격려와 자기 의심이 맞서는 전환이 일어납니다.","hl":"f2"},{"n":7,"text":"Vashti는 미소를 지으며 남자아이에게 종이 한 장을 건넵니다. 그리고 보여 줘라는 말을 하며 남자아이가 직접 해 보게 하죠. 이는 완벽한 실력보다 시도를 요구하는 장면입니다.","hl":"f3"},{"n":8,"text":"남자아이의 연필은 선을 그리는 동안 흔들리고, 그 선은 곧지 않았다. Vashti는 그 선을 주의 깊게 본 뒤 서명해 달라고 말합니다. 이 말은 남자아이의 작은 선도 하나의 작품으로 인정한다는 뜻이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 전시회의 성공, 남자아이의 등장, Vashti의 격려, 작은 선, 서명 요청이 차례로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개입니다. 사건은 시간순이지만 중심 생각은 중간의 8번 문장인 Trust yourself에서 직접 제시되므로 이를 \u003cb class=\"key\">주제문\u003c/b>으로 볼 수 있습니다. 앞부분은 남자아이의 동경, 뒷부분은 조언이 행동으로 이어지는 장면이므로 중심 문장이 가운데에 있는 \u003cb class=\"key\">중괄식\u003c/b>입니다. 마지막의 \u003cb class=\"key\">서명\u003c/b> 요청은 그 메시지를 행동으로 보여 주는 \u003cb class=\"key\">예시\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>A few weeks later (1)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>No (9)\u003c/b>\u003cspan>부정·자기 의심\u003c/span>\u003cb>while (13)\u003c/b>\u003cspan>동시 상황\u003c/span>\u003cb>and (15)\u003c/b>\u003cspan>동작 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">many dots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a big success\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a great artist\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">paint like you\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Trust yourself\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Show me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sign it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 사건이 차례로 일어나는 시간순 구성이에요. 사건은 시간순으로 진행되지만, 글의 중심 생각은 중간의 주제문인 Trust yourself에서 직접 제시됩니다. 앞부분은 남자아이가 Vashti를 동경하는 장면이고, 뒷부분은 그 조언이 실제 행동으로 이어지는 장면이죠. 그래서 중심 문장이 글의 가운데에 있는 중괄식으로 볼 수 있고, 마지막의 서명 요청은 너 자신을 믿어라는 메시지를 행동으로 보여 주는 예시입니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 A few weeks later가 시간이 흐르며 다음 장면으로 넘어가게 해 줍니다. while은 남자아이가 선을 긋는 동안 연필이 흔들렸다는 동시 상황을 보여 주고, No는 남자아이의 부정적인 자기 인식을 드러내죠. 또 great artist, paint like you, Trust yourself, Show me, sign it 같은 표현이 이어지며 동경에서 행동과 인정으로 생각이 확장됩니다. Vashti의 격려와 남자아이의 자기 의심은 대조를 이루고, 마지막의 서명 요청은 앞의 Trust yourself를 행동으로 다시 말해 주는 재진술이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>a few\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몇몇의\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>art show\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미술 전시회\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열리다, 개최되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어린, 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>beside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 옆에\u003c/span>\u003c/div>\u003cdiv>\u003cb>great\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대단한, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sure\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>trust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>~조차\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>straight\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>곧은\u003c/span>\u003c/div>\u003cdiv>\u003cb>line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>건네주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a piece of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 장의, 한 조각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pencil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연필\u003c/span>\u003c/div>\u003cdiv>\u003cb>shake\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흔들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서명하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어로는 take place가 열리다, success가 성공, trust가 믿다라는 뜻이에요. straight는 곧은, carefully는 주의 깊게, sign은 서명하다로 기억해 두세요. hand는 동사로 쓰이면 건네주다, shake는 흔들리다라는 뜻도 함께 익혀 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">success\u003c/b>\u003cspan class=\"m\">성공\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003cspan class=\"a\">defeat\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">great\u003c/b>\u003cspan class=\"m\">대단한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">excellent\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sure\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003cspan class=\"a\">unsure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trust\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">believe\u003c/span>\u003cspan class=\"s\">rely on\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">distrust\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">straight\u003c/b>\u003cspan class=\"m\">곧은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">direct\u003c/span>\u003cspan class=\"s\">even\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">crooked\u003c/span>\u003cspan class=\"a\">bent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">show\u003c/b>\u003cspan class=\"m\">보여 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">carefully\u003c/b>\u003cspan class=\"m\">주의 깊게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautiously\u003c/span>\u003cspan class=\"s\">attentively\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003cspan class=\"a\">hastily\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 success는 achievement나 triumph로 바꿔 쓸 수 있고, 반대말은 failure예요. great는 excellent나 wonderful과 가깝고, sure는 certain, confident와 비슷합니다. trust는 believe나 rely on으로 바꿀 수 있고, straight의 반대말은 crooked나 bent예요. show는 display나 present로 말할 수 있으며 반대말은 hide나 conceal이고, carefully는 cautiously나 attentively로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 주 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">weeks \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교 미술 전시회가\u003c/span>\u003cspan class=\"en\">the school art show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열렸다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 주 후에 학교 미술 전시회가 열렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몇 주 후에 학교 미술 전시회가 열렸다는 시간적 배경을 제시하는 문장이에요. 'take place'는 행사가 실제로 \u003cb class= ","segs":[{"n":25,"text":"\"You're, “당신은. a great artist, 대단한 예술가예요.. 이 문장 전체를 해석하면, “당신은 대단한 예술가예요.","hl":"m"},{"n":26,"text":"이 말은 소년이 Vashti를 대단한 예술가라고 칭찬하며 존경을 표현한 거예요. 바로 다음에 이어지는 I want to paint like you의 이유가 되는 말이고, 소년이 Vashti를 롤모델로 여긴다는 점을 보여 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째 어법은 You're예요. You와 are가 축약되어 You're가 되었고, 소년이 Vashti에게 직접 말하는 구어체 표현이에요. 두 번째는 a great artist인데, 관사 a가 형용사 great과 명사 artist를 묶어 명사구를 만들고, be동사 뒤에서 주어를 설명하는 주격보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 그리고 싶어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 당신처럼 그리고 싶어요.” 그가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 Vashti처럼 \u003cb class=\"key\">그리고 \u003c/b>\u003cb class=\"key\">싶다\u003c/b>고 말하며 자신의 \u003cb class=\"key\">바람\u003c/b>을 직접 전하는 문장이에요. 앞에서 Vashti를 대단한 예술가라고 한 데 이어, 그녀를 \u003cb class=\"key\">본받고 \u003c/b>\u003cb class=\"key\">싶은 \u003c/b>\u003cb class=\"key\">대상\u003c/b>으로 여긴다는 뜻이죠. want to paint는 '그리고 싶다', like you는 '당신처럼'으로 해석해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명 3cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be sure + (that)절 (that 생략)\u003c/span> : [주어] + be sure + [(that) + 주어 + 동사] : \"나는 ~라고 확신해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 동사구 생략\u003c/span> : you can [paint like me] : \"너는 (그렇게) 할 수 있어\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"\"I'm, “나는. sure you can, 네가 할 수 있다고 확신해.. 이 문장 전체를 해석하면, “나는 네가 할 수 있다고 확신해.","hl":"m"},{"n":32,"text":"여기서 Vashti는 소년이 나는 당신처럼 그릴 수 없다고 말하자, 아니야 너는 할 수 있다고 격려하는 거예요. I'm sure는 내가 확신한다는 뜻으로 상대의 능력에 대한 강한 믿음을 보여 줘요. 이 격려는 바로 다음에 나오는 Trust yourself, 즉 너 자신을 믿으라는 말로 이어지면서 자신감이라는 주제를 만들어 줍니다.","hl":"mn"},{"n":33,"text":"어법 포인트 첫 번째는 I'm sure 뒤에 that절이 생략된 구조예요. sure 뒤에 접속사 that이 생략된 명사절 you can이 와서 네가 할 수 있다고 확신한다는 뜻을 만들어요. 두 번째는 you can에서 앞의 paint like you를 반복하지 않고 can만 남긴 동사구 생략이에요. 그래서 you can은 너는 그렇게 할 수 있다는 의미로 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너 자신을 믿어.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Trust\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti가 말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">Vashti\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너 자신을 믿어.” Vashti가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 소년에게 '너 자신을 믿어'라고 말하며 스스로를 신뢰하라고 \u003cb class=\"key\">조언\u003c/b>해요. 명령문 Trust yourself는 상대에게 직접 \u003cb class=\"key\">자신감\u003c/b>을 가지라고 권하는 표현이에요. 앞의 I'm sure you can과 연결되어, 결국 중요한 것은 \u003cb class=\"key\">스스로에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] + [목적어] : \"믿어라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사\u003c/span> : [동사] + oneself : \"너 자신을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">직접화법 뒤 도치\u003c/span> : &quot;인용문,&quot; + said + [주어] : \"Vashti가 말했다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Trust yourself,\", 너 자신을 믿어.”. said Vashti, Vashti가 말했다.. 이 문장 전체를 해석하면, 너 자신을 믿어.” Vashti가 말했다.","hl":"m"},{"n":35,"text":"Vashti가 소년에게 너 자신을 믿으라고 직접 조언하는 장면이에요. Trust yourself는 명령문으로 상대에게 자신감을 가지라고 권하는 표현이죠. 앞에서 Vashti가 너는 할 수 있다고 확신한다고 말한 것과 연결해서, 결국 중요한 것은 스스로에 대한 믿음이라는 점을 보여 줍니다.","hl":"mn"},{"n":36,"text":"어법 포인트 첫 번째는 Trust로 시작하는 명령문이에요. 주어 You를 생략하고 동사원형 Trust를 써서 상대에게 명령과 권유를 나타내죠. 두 번째는 yourself가 재귀대명사라는 점이에요. 주어인 You와 목적어가 같은 대상이라서 yourself를 써서 너 자신을이라는 뜻을 분명히 해요. 세 번째는 said Vashti의 도치 어순이에요. 인용문 뒤에서 말하는 동사 said가 주어 Vashti보다 앞에 나오는 도치로, Vashti가 말했다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“아니요,\u003c/span>\u003cspan class=\"en\">&quot;No,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 직선조차 그릴 수 없어요.”\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">straight \u003c/span>\u003cspan class=\"tgt\">line\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아니요, 저는 직선조차 그릴 수 없어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 '직선조차 그릴 수 없다'며 자신의 능력을 강하게 \u003cb class=\"key\">부정\u003c/b>하는 말이에요. even은 '~조차'라는 뜻으로, 아주 쉬운 일도 못 한다는 \u003cb class=\"key\">자신감 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 강조해요. 이 대답은 Vashti가 종이를 건네고 서명을 부탁하는 다음 행동의 \u003cb class=\"key\">계기\u003c/b>가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정과 even 강조\u003c/span> : [주어] + can't even + [동사원형] : \"~조차 그릴 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + 명사\u003c/span> : [형용사 straight] + [명사 line] : \"직선\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"\"No, “아니요. I can't even draw a straight line.\", 저는 직선조차 그릴 수 없어요.”. 이 문장 전체를 해석하면, “아니요, 저는 직선조차 그릴 수 없어요.”","hl":"m"},{"n":38,"text":"소년이 자신은 직선조차 그릴 수 없다고 말하면서 스스로의 능력을 강하게 부정하는 장면이에요. even은 우리말로 조차라는 뜻으로, 아주 쉬운 일도 못 한다는 자신감 없음을 강조하죠. 이 부정적인 대답은 Vashti가 종이를 건네고 서명을 부탁하는 다음 행동으로 이어지는 계기가 됩니다.","hl":"mn"},{"n":39,"text":"어법 포인트 첫 번째는 can't even draw예요. can't는 can not의 줄임말로 능력 부정을 나타내고, even은 조차라는 뜻으로 뒤의 동사 draw를 강조해요. 두 번째는 a straight line이에요. straight가 형용사로 명사 line을 앞에서 꾸며서 직선이라는 하나의 의미 단위를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는\u003c/span>\u003cspan class=\"en\">Vashti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미소 지었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti가 미소 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 &quot;직선조차 그릴 수 없다&quot;고 말한 직후, Vashti가 말 대신 \u003cb class=\"key\">미소\u003c/b>로 답한 장면이에요. 이 짧은 문장은 다음에 \u003cb class=\"key\">종이\u003c/b>를 건네는 행동으로 자연스럽게 이어 주는 연결 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제(규칙 동사)\u003c/span> : [동사원형 smile] + [-ed] → smiled : \"미소 지었다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Vashti, Vashti는. smiled, 미소 지었다.. 이 문장 전체를 해석하면, Vashti가 미소 지었다.","hl":"m"},{"n":41,"text":"여기서 Vashti가 왜 미소를 지었는지가 중요해요. 바로 앞에서 소년이 자기는 직선조차 못 그린다고 말했죠. 그 말에 Vashti는 길게 설명하지 않고 미소로 답한 거예요. 그리고 그 미소가 다음에 종이를 건네는 장면으로 이어지는 거예요.","hl":"mn"},{"n":42,"text":"여기서 smiled는 과거시제예요. 이미 일어난 일이니까 동사원형 smile에 e d를 붙여서 smiled로 쓴 거죠. 이야기 속 사건은 이렇게 과거시제로 쭉 이어진다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 건네주었다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">handed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자아이에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">boy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이 한 장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">piece \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그 남자아이에게 종이 한 장을 건네주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 소년에게 직접 해 볼 \u003cb class=\"key\">기회\u003c/b>를 주는 장면이에요. 앞에서 소년이 못 그린다고 했으니, 말 대신 종이를 건네며 행동을 이끌어 내는 거예요. 이 종이는 뒤에 나오는 \u003cb class=\"key\">서명\u003c/b> 장면으로 이어지는 중요한 소재가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 문장(수여동사 hand)\u003c/span> : hand + [간접목적어: the boy] + [직접목적어: a piece of paper] : \"그 남자아이에게 종이 한 장을 건네주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불가산명사의 수량 표현\u003c/span> : a piece of + [불가산명사 paper] : \"종이 한 장\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"She handed, 그녀는 건네주었다. the boy, 그 남자아이에게. a piece of paper, 종이 한 장을. 이 문장 전체를 해석하면, 그녀는 그 남자아이에게 종이 한 장을 건네주었다.","hl":"m"},{"n":44,"text":"Vashti가 소년에게 종이를 건네는 장면이에요. 앞에서 소년이 자기는 못 그린다고 했으니, Vashti가 직접 해 볼 기회를 주는 거죠. 그리고 이 종이는 뒤에서 소년이 선을 긋고 서명하는 장면으로 이어지는 중요한 소재가 돼요.","hl":"mn"},{"n":45,"text":"먼저 handed는 수여동사예요. hand는 사람에게 물건을 건네준다는 뜻이라서 뒤에 간접목적어인 the boy가 먼저 오고, 직접목적어인 a piece of paper가 뒤에 오는 4형식 구조를 만들어요. 두 번째로 a piece of paper에서 paper는 불가산명사라서 수량을 셀 때 단위 표현을 붙여요. 그래서 종이 한 장이라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 줘\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Show \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">me\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나에게 보여 줘.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 소년에게 말 대신 \u003cb class=\"key\">행동\u003c/b>을 요구하는 장면이에요. 길게 설명하지 않고 Show me라고만 말한 것이 핵심이에요. 이 한마디가 소년이 선을 긋게 되는 계기가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문과 4형식 수여동사의 목적어 생략\u003c/span> : [동사원형 Show] + [간접목적어 me] + [직접목적어 (it) 생략] : \"나에게 (그것을) 보여 줘\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Show, 보여 줘. me, 나에게. 이 문장 전체를 해석하면, “나에게 보여 줘.”","hl":"m"},{"n":47,"text":"Vashti가 소년에게 말로 설명하는 대신 행동을 요구하는 장면이에요. 길게 설명하지 않고 Show me라고만 말한 게 인상적이죠. 이 한마디가 뒤에서 소년이 종이에 선을 긋고 서명하게 되는 계기가 돼요.","hl":"mn"},{"n":48,"text":"Show me는 명령문이에요. 명령문은 주어 you를 생략하고 동사원형으로 시작하죠. 그리고 show는 수여동사라서 원래는 뒤에 물건이 와야 하는데, 여기서는 이미 종이를 건네줬으니 직접목적어가 생략된 형태예요. 그래서 '나에게 보여 줘'라고 짧게 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자아이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">boy's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연필은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pencil\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔들렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shook\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 그리는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">drew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">line\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 남자아이가 선을 그리는 동안 그 남자아이의 연필은 흔들렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연필이 흔들렸다는 것은 소년이 \u003cb class=\"key\">긴장\u003c/b>해서 자신감이 없다는 사실을 몸으로 보여 주는 장면이에요. 바로 앞에서 소년이 &quot;I can't even draw a straight line&quot;이라고 말한 것과 자연스럽게 이어집니다. 이 떨림 덕분에 뒤에 나오는 Vashti의 &quot;sign it&quot;이라는 말이 더 큰 \u003cb class=\"key\">반전\u003c/b>으로 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 소유격('s)\u003c/span> : [명사] + 's + [명사] : \"그 남자아이의 연필\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형\u003c/span> : shake(현재) - shook(과거) - shaken(과거분사) : \"흔들렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 while의 시간 부사절\u003c/span> : [주절] + while + [주어 + 동사] : \"그가 선을 그리는 동안\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"The boy's, 그 남자아이의. pencil, 연필은. shook, 흔들렸다. while he drew, 그가 그리는 동안. a line, 선을. 이 문장 전체를 해석하면, 그 남자아이가 선을 그리는 동안 그 남자아이의 연필은 흔들렸다.","hl":"m"},{"n":50,"text":"소년이 선을 그리는 동안 연필이 흔들렸다는 건 긴장해서 자신이 없다는 걸 보여 주는 장면이에요. 바로 앞에서 소년이 직선조차 못 그린다고 말했죠. 이 흔들림이 뒤에서 Vashti가 서명을 부탁하는 장면으로 이어집니다.","hl":"mn"},{"n":51,"text":"먼저 The boy's pencil에서 's가 소유격이라서 '소년의 연필'이라는 뜻이 된다는 점을 기억하세요. 두 번째로 shook은 shake의 불규칙 동사 과거형이고요, 주어인 연필이 스스로 흔들린 거니까 자동사로 쓰였어요. 세 번째로 while은 두 동작이 동시에 일어난다는 걸 알려 주는 시간의 접속사예요. 부사절 안에서는 미래의 일도 현재시제로 쓰지만 여기서는 지난 일이라 과거시제 drew를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선은\u003c/span>\u003cspan class=\"en\">The line\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">straight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 선은 곧지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 그은 선이 \u003cb class=\"key\">직선\u003c/b>이 아니었다는 사실을 담담하게 확인해 주는 문장이에요. 앞의 &quot;연필이 흔들렸다&quot;와 원인과 결과로 짝을 이루죠. 선이 곧지 않다는 것은 소년의 부족한 실력을 다시 한 번 보여 주지만, Vashti는 이 선에서도 가능성을 봅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 부정문\u003c/span> : [be동사] + not + [형용사(주격보어)] : \"곧지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격보어로 쓰인 형용사\u003c/span> : [주어] + [be동사] + [형용사] : \"곧은, 곧지 않은\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"The line, 그 선은. was not, 아니었다. straight, 곧은. 이 문장 전체를 해석하면, 그 선은 곧지 않았다.","hl":"m"},{"n":53,"text":"소년이 그은 선이 직선이 아니었다는 걸 확인해 주는 문장이에요. 앞에서 연필이 흔들렸다고 했으니 결과가 이렇게 나오는 게 당연하죠. 실력은 부족하지만 Vashti는 이 선에서도 뭔가를 봅니다.","hl":"mn"},{"n":54,"text":"여기서 첫 번째 포인트는 be동사 뒤에 not을 붙여 부정문을 만든다는 거예요. was not, 즉 '아니었다'가 되죠. 두 번째로 straight는 형용사로 쓰여서 주어 The line의 상태를 설명하는 주격보어 역할을 합니다. 그래서 '그 선은 곧지 않았다'라는 해석이 자연스러운 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는\u003c/span>\u003cspan class=\"en\">Vashti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 보았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의 깊게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">carefully \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;이것에 서명해 주렴.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">&quot;Please \u003c/span>\u003cspan class=\"tgt\">... \u003c/span>\u003cspan class=\"tgt\">sign \u003c/span>\u003cspan class=\"tgt\">it.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 그것을 주의 깊게 보고 말했다. “이것에 서명해 주렴.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년의 서툰 선을 보고도 Vashti는 그 선을 하나의 \u003cb class=\"key\">작품\u003c/b>으로 인정하고 서명을 부탁해요. 서명을 하면 그것은 '내가 그린 것'이 되고, 그 순간 소년도 작가의 자리에 서게 되죠. 앞에서 Vashti가 점 하나로 시작했던 \u003cb class=\"key\">자신감\u003c/b>의 메시지가 그대로 이어지는 지문의 \u003cb class=\"key\">결말\u003c/b>이자 핵심 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 look + 전치사 at\u003c/span> : [look] + at + [목적어] : \"그것을 보았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조\u003c/span> : [동사구 A] + and + [동사구 B] : \"주의 깊게 보고 … 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">Please를 쓴 명령문\u003c/span> : Please + [동사원형] + [목적어] : \"이것에 서명해 주렴\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"Vashti, Vashti는. looked at it, 그것을 보았다. carefully, 주의 깊게. and said, 그리고 말했다. \"Please ... sign it.\", \"이것에 서명해 주렴.\". 이 문장 전체를 해석하면, Vashti는 그것을 주의 깊게 보고 말했다. “이것에 서명해 주렴.”","hl":"m"},{"n":56,"text":"소년의 삐뚤빼뚤한 선을 보고도 Vashti는 그걸 작품으로 인정하고 서명을 부탁해요. 서명을 하는 순간 소년도 작가가 되는 거죠. 앞에서 Vashti가 점 하나로 시작했던 자신감, 그 메시지가 그대로 이어지는 결말 장면입니다.","hl":"mn"},{"n":57,"text":"첫 번째로 look은 자동사라서 목적어를 데리려면 전치사 at이 꼭 필요해요. 그래서 looked at it, '그것을 보았다'가 되는 거예요. 두 번째로 looked와 said가 and로 연결된 병렬 구조이고, 시제도 둘 다 과거로 맞춰져 있습니다. 세 번째로 Please sign it은 주어 You를 생략한 명령문이에요. 동사원형으로 시작하고 Please를 붙여서 정중한 부탁의 느낌을 살렸답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Vashti의 많은 \u003cb class=\"key\">점\u003c/b>이 학교 미술 전시회에서 \u003cb class=\"key\">대성공\u003c/b>을 거두었습니다.\u003c/li>\u003cli>한 남자아이는 Vashti를 \u003cb class=\"key\">대단한 \u003c/b>\u003cb class=\"key\">예술가\u003c/b>라고 부르며 자신도 그처럼 \u003cb class=\"key\">그리고 \u003c/b>\u003cb class=\"key\">싶다\u003c/b>고 말했습니다.\u003c/li>\u003cli>Vashti는 남자아이에게 \u003cb class=\"key\">너 \u003c/b>\u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">믿어\u003c/b>라고 말하고 종이를 건네 \u003cb class=\"key\">보여 \u003c/b>\u003cb class=\"key\">달라\u003c/b>고 했습니다.\u003c/li>\u003cli>남자아이의 흔들린 선을 본 Vashti는 그 선에 \u003cb class=\"key\">서명\u003c/b>하게 하며 작은 시도도 \u003cb class=\"key\">작품\u003c/b>이 될 수 있음을 보여 주었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even a small, shaky line can become art when someone is encouraged to trust themselves and sign it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Vashti의 많은 \u003cb class=\"key\">점\u003c/b>이 학교 미술 전시회에서 \u003cb class=\"key\">대성공\u003c/b>을 거둔 뒤, 직선조차 못 그린다고 하는 남자아이에게 Vashti는 \u003cb class=\"key\">너 \u003c/b>\u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">믿어\u003c/b>라고 말하고 종이를 건넨다. 그리고 남자아이가 그은 흔들리는 선을 보고 \u003cb class=\"key\">서명\u003c/b>하게 하며 작은 \u003cb class=\"key\">시도\u003c/b>도 \u003cb class=\"key\">작품\u003c/b>이 될 수 있음을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"정리해 볼게요. Vashti의 많은 점은 학교 미술 전시회에서 대성공을 거두었고, 한 남자아이는 Vashti를 대단한 예술가라고 부르며 자신도 그리고 싶다고 말했습니다. Vashti는 남자아이에게 너 자신을 믿어라는 말을 하고 종이를 건네 보여 달라고 했으며, 마지막에는 남자아이의 흔들린 선에 서명하게 하여 작은 시도도 작품이 될 수 있음을 보여 주었습니다. 오늘 수업에서 이 흐름과 메시지를 꼭 기억해 주세요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
