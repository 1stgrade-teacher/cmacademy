<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}

.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}

.lp-chips .a{background:#FFF1D8;color:#8A5A00}
.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"8과 본문1","audioDir":"1_audio","preview":false,"count":64,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">8과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>Just Make a Mark\u003c/h1>\u003ch2>그냥 점 하나를 만들어 봐\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미술 시간, 빈 종이 앞에서 &quot;나는 정말 못 그리겠어요&quot;라고 말하는 Vashti에게 선생님은 &quot;그냥 점 하나를 만들어 봐&quot;라고 말합니다. 그 점을 찍은 Vashti에게 선생님이 &quot;이제 이것에 서명하렴&quot;이라고 말하자, 그녀는 \u003cb class=\"key\">그릴 \u003c/b>\u003cb class=\"key\">수는 \u003c/b>\u003cb class=\"key\">없지만\u003c/b> 이름은 서명할 수 있다는 사실을 스스로 깨닫습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even a single small mark can start a person on the way to believing in her own ability.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 피터 레이놀즈의 그림책 The Dot에 나오는 장면이에요. 미술 시간, 빈 종이 앞에서 아무것도 못 그리겠다고 말하는 Vashti와 그런 학생에게 아주 작은 숙제를 던지는 선생님의 이야기입니다. 이 글의 요지는 아주 작은 점 하나가 자기 능력에 대한 믿음의 출발점이 될 수 있다는 거예요. 함께 천천히 따라와 보세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 피터 레이놀즈의 그림책 The Dot에서 가져온 장면으로, 미술 시간에 아무것도 그리지 못한 Vashti가 선생님의 작은 제안을 통해 첫발을 떼는 과정을 담고 있습니다. 여기서 핵심 개념은 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">마인드셋\u003c/b>(growth mindset)으로, 능력은 타고나는 고정된 것이 아니라 작은 시도로 자란다는 믿음입니다. 반대로 '나는 원래 못 그려'라고 단정하고 멈추는 태도는 \u003cb class=\"key\">고정 \u003c/b>\u003cb class=\"key\">마인드셋\u003c/b>(fixed mindset)이라고 부릅니다. 선생님은 칭찬이나 격려 대신 '점이라도 찍어 보라'는 \u003cb class=\"key\">최소한의 \u003c/b>\u003cb class=\"key\">요구\u003c/b>(minimal request)를 던져 학생의 부담을 낮춥니다. 이는 큰 목표를 아주 작은 행동으로 쪼개는 \u003cb class=\"key\">과제 \u003c/b>\u003cb class=\"key\">분할\u003c/b>(task breakdown)과 비슷한데, 마치 요리를 못한다고 말하는 아이에게 '물 끓이기부터 해 보자'고 말하는 것과 같습니다. 마지막의 '서명하렴'은 결과물에 자기 이름을 붙여 \u003cb class=\"key\">주인의식\u003c/b>(ownership)을 갖게 하는 장치라는 점도 함께 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"배경지식을 하나 짚고 갈게요. 이 장면의 핵심 개념은 성장 마인드셋, 영어로 growth mindset입니다. 능력은 타고나는 고정된 것이 아니라 작은 시도로 자란다는 믿음이죠. 반대로 나는 원래 못 그려라고 단정하고 멈추는 태도는 고정 마인드셋, fixed mindset이라고 불러요. 선생님은 칭찬 대신 점이라도 찍어 보라는 최소한의 요구를 던져서 학생의 부담을 확 낮춥니다. 이건 큰 목표를 작은 행동으로 쪼개는 과제 분할, task breakdown과 비슷해요. 요리를 못한다고 말하는 아이에게 물 끓이기부터 해 보자고 말하는 것과 같은 원리죠. 그리고 마지막에 서명하라고 한 것은 결과물에 이름을 붙여 주인의식, ownership을 갖게 하는 장치예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>빈 종이\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>미술 수업이 끝났지만 Vashti는 교실을 떠나지 않습니다. 그녀 앞의 종이는 아무것도 없는 \u003cb class=\"key\">빈 \u003c/b>\u003cb class=\"key\">종이\u003c/b> 그대로입니다. 다른 친구들은 무언가를 남겼는데 자신만 아무것도 못 했다는 뜻이죠. 이 장면은 '나는 못 그려'라는 \u003cb class=\"key\">자신 \u003c/b>\u003cb class=\"key\">없음\u003c/b>이 시작되는 지점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선생님의 농담\u003csmall>통념 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>선생님은 그 빈 종이를 가만히 들여다봅니다. 그러고는 '눈보라 속에 있는 북극곰'이라고 \u003cb class=\"key\">농담\u003c/b>을 던지죠. Vashti는 '아주 재미있네요'라고 받아치면서도 '저는 정말 \u003cb class=\"key\">못 \u003c/b>\u003cb class=\"key\">그리겠어요\u003c/b>'라고 말합니다. 이 대목에서 그녀의 문제가 실력이 아니라 \u003cb class=\"key\">자신감\u003c/b>이라는 점이 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>점 하나의 제안\u003csmall>전환 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>선생님은 미소 지으며 머리를 젓고는 '그냥 점 하나를 만들어 봐'라고 말합니다. 그리고 '그것이 너를 \u003cb class=\"key\">어딘가로\u003c/b> 데려다줄 거야'라고 덧붙이죠. 완성도 높은 결과물이 아니라 \u003cb class=\"key\">시작하는 \u003c/b>\u003cb class=\"key\">행동\u003c/b> 자체를 요구한 것입니다. 부담을 낮춘 이 한마디가 글의 방향을 바꿉니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>쿡 찌르기\u003csmall>예시 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>Vashti는 펜을 집어 종이를 쿡 찌르고 '여기요!'라고 말합니다. 선생님은 그 점을 집어 들어 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">깊게\u003c/b> 살펴봅니다. 농담으로 넘기지 않고 하나의 작품처럼 \u003cb class=\"key\">진지하게\u003c/b> 대했다는 점이 중요합니다. 인정받은 경험이 다음 행동을 가능하게 하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>서명\u003csmall>결론 · 문장 15–17\u003c/small>\u003c/h4>\u003cp>선생님은 종이를 돌려주며 '이제 이것에 \u003cb class=\"key\">서명\u003c/b>하렴'이라고 말합니다. Vashti는 잠시 생각하다 '그릴 수는 없지만 이름은 서명할 수 있다'고 답합니다. 못하는 것 하나가 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">것\u003c/b> 전체를 가리지는 않는다는 사실을 스스로 인정한 셈입니다. 이것이 이 글의 \u003cb class=\"key\">주제\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 빈 종이 장면이에요. 미술 수업이 끝났는데도 Vashti는 교실을 떠나지 않아요. 그녀 앞의 종이는 아무것도 없는 빈 종이 그대로죠. 친구들은 뭔가를 남겼는데 나만 못 했다는 생각이 자신 없음으로 이어지는 지점입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 선생님이 그 종이를 보고 눈보라 속의 북극곰이라고 농담을 던져요. Vashti는 아주 재미있네요 하고 받아치면서도 저는 정말 못 그리겠어요라고 말하죠. 여기서 우리가 봐야 할 건 실력 문제가 아니라 자신감 문제라는 점이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전환이에요. 선생님은 미소 지으며 머리를 젓고는 그냥 점 하나를 만들어 봐라고 말합니다. 그리고 그것이 너를 어딘가로 데려다줄 거야 하고 덧붙이죠. 완성도가 아니라 시작하는 행동 자체를 요구한 거예요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서 Vashti는 펜을 집어 종이를 쿡 찌르고 여기요 하고 말해요. 선생님은 그 점을 집어 들어 주의 깊게 들여다봅니다. 농담으로 넘기지 않고 진지하게 작품처럼 대했다는 점이 아주 중요해요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계에서 선생님은 종이를 돌려주며 이제 이것에 서명하렴이라고 말해요. Vashti는 잠시 생각하다가 그릴 수는 없지만 이름은 서명할 수 있다고 답합니다. 못하는 것 하나가 할 수 있는 것 전체를 가리지는 않는다는 걸 스스로 인정한 거예요. 이게 바로 이 글의 주제입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 진행되는 이야기 글입니다. 빈 종이, 농담, 점 하나, 서명이라는 장면이 차례로 이어지죠. 인물이 처음에는 '못 그리겠다'고 말하다가 마지막에 '이름은 서명할 수 있다'고 말하는 변화가 핵심입니다. 주제를 담은 문장이 맨 끝에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 보는 것이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Ah! (5)\u003c/b>\u003cspan>농담 던지기\u003c/span>\u003cb>Very funny! (7)\u003c/b>\u003cspan>자조적 반응\u003c/span>\u003cb>Just (10)\u003c/b>\u003cspan>최소 요구 강조\u003c/span>\u003cb>There! (13)\u003c/b>\u003cspan>행동 완료 표시\u003c/span>\u003cb>Now (15)\u003c/b>\u003cspan>다음 단계 제시\u003c/span>\u003cb>Well, maybe ... but (17)\u003c/b>\u003cspan>인식 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">empty paper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I just can't draw\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Just make a mark\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">It will take you somewhere\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Now sign it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I can sign my name\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"전개 방식을 볼게요. 이 글은 사건이 일어난 시간 순서대로 진행되는 이야기 글이에요. 빈 종이, 농담, 점 하나, 서명이라는 장면이 차례로 이어지죠. 주제를 담은 문장이 맨 마지막에 나오기 때문에 미괄식 구조라고 정리할 수 있어요. 그래서 결론 문장을 읽을 때 긴장을 놓지 말고 봐야 합니다.","hl":"ty"},{"n":10,"text":"신호어도 눈여겨보세요. 다섯 번째 문장의 Ah는 농담을 던지는 신호이고, 일곱 번째 문장의 Very funny는 자조 섞인 반응이에요. 열 번째 문장의 Just는 부담을 낮추는 최소 요구의 표시이고요. 열세 번째 문장의 There는 행동을 끝냈다는 표시, 열다섯 번째 문장의 Now는 다음 단계로 넘어간다는 신호입니다. 마지막 문장의 Well, maybe 그리고 but은 생각이 바뀌는 결정적인 지점이니 꼭 표시해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끝나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>classroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교실\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이\u003c/span>\u003c/div>\u003cdiv>\u003cb>empty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비어 있는, 빈\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>polar bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북극곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>snowstorm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈보라\u003c/span>\u003c/div>\u003cdiv>\u003cb>funny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재미있는, 우스운\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shake one's head\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>머리를 젓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mark\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표시, 점\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>데려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>somewhere\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어딘가로\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poke\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쿡 찌르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게, 조심스럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>return\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돌려주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a moment\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>maybe\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마\u003c/span>\u003c/div>\u003cdiv>\u003cb>well\u003c/b>\u003cem>부사\u003c/em>\u003cspan>음, 글쎄\u003c/span>\u "s\">closely\u003c/span>\u003cspan class=\"s\">cautiously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003cspan class=\"a\">recklessly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">return\u003c/b>\u003cspan class=\"m\">돌려주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give back\u003c/span>\u003cspan class=\"s\">hand back\u003c/span>\u003cspan class=\"s\">restore\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">hold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pick up\u003c/b>\u003cspan class=\"m\">집어 들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lift\u003c/span>\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">grab\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">put down\u003c/span>\u003cspan class=\"a\">drop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">maybe\u003c/b>\u003cspan class=\"m\">아마\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perhaps\u003c/span>\u003cspan class=\"s\">possibly\u003c/span>\u003cspan class=\"s\">probably\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certainly\u003c/span>\u003cspan class=\"a\">definitely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. empty의 동의어는 blank나 vacant이고 반의어는 full이에요. funny는 amusing이나 humorous로 바꿔 쓸 수 있고 반대말은 serious입니다. carefully의 동의어는 attentively나 closely, 반의어는 carelessly예요. return은 give back, pick up은 lift로 바꿔 말할 수 있다는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미술 수업이\u003c/span>\u003cspan class=\"en\">Art class\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끝났다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/ 003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“저는 정말 못 그리겠어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 그림에 대한 \u003cb class=\"key\">자신감 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 솔직하게 털어놓는 말이에요. just는 '정말, 그냥'의 강조로, 아무리 해도 \u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">된다\u003c/b>는 좌절감을 담고 있죠. 이 말이 선생님이 '점 하나만 그어 봐'라고 제안하는 계기가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조 부사의 위치(조동사 뒤, 본동사 앞)\u003c/span> : [조동사(can't)] + just + [동사원형] : \"정말, 그냥\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정형 + 동사원형\u003c/span> : [주어] + can't + [동사원형(draw)] : \"그릴 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"\"I, “저는. just, 정말. can't draw.\", 못 그리겠어요.”. 이 문장 전체를 해석하면, “저는 정말 못 그리겠어요.”","hl":"m"},{"n":35,"text":"Vashti가 나는 정말 그림을 못 그린다고 솔직하게 말하는 장면이에요. 여기서 just 는 그냥이 아니라 정말, 아무리 해도 안 된다는 강조로 읽어 주세요. 이렇게 자기 한계를 인정하는 말이 나오니까, 선생님이 점 하나만 그어 보라는 제안을 하게 되는 거예요.","hl":"mn"},{"n":36,"text":"첫 번째로, can't 뒤에는 반드시 동사원형 draw 가 와요. 조동사 뒤에는 동사원형, 이건 아주 중요한 규칙이에요. 두 번째로, just 는 조동사 뒤 본동사 앞에 놓여서 정말, 그냥 하고 강조하는 부사로 쓰였어요. 세 번째로, can't 는 can not 의 줄임말로 여기서는 할 수 없다는 능력의 부정을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 선생님은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her \u003c/span>\u003cspan class=\"tgt\">teacher\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미소 지었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">smiled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 저었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">shook\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 머리를\u003c/span>\u003cspan class=\"en\">her head.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 선생님은 미소 지었고 그녀의 머리를 저었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 야단치지 않고 \u003cb class=\"key\">미소\u003c/b>를 지으며 머리를 저은 장면이에요. 여기서 머리를 젓는 건 화난 반응이 아니라 '아니야, 그렇지 않아'라는 \u003cb class=\"key\">너그러운 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이죠. 이 다정한 반응 덕분에 이어지는 'Just make a mark'라는 제안이 자연스럽게 나와요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">두 동작을 공유하는 주어\u003c/span> : [주어(Her teacher)] + smiled and shook + [목적어] : \"그녀의 선생님은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조(and)\u003c/span> : [주어] + [과거동사 A(smiled)] + and + [과거동사 B(shook)] : \"미소 지었고 … 저었다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Her teacher, 그녀의 선생님은. smiled, 미소 지었고. and shook, 그리고 저었다. her head, 그녀의 머리를. 이 문장 전체를 해석하면, 그녀의 선생님은 미소 지었고 그녀의 머리를 저었다.","hl":"m"},{"n":38,"text":"선생님이 혼내지 않고 미소를 지으면서 머리를 젓는 장면이에요. 머리를 젓는다고 해서 화난 게 아니라, 아니에요 그렇지 않아요 하고 부드럽게 받아 주는 거죠. 이 장면 뒤에 점 하나만 그어 보라는 제안이 이어지니까, 선생님의 다정한 태도를 함께 기억해 주세요.","hl":"mn"},{"n":39,"text":"첫 번째로, 주어 Her teacher 가 미소 짓는 동작과 머리를 젓는 동작을 함께 해요. 그래서 두 번째 동사 앞에서는 주어를 다시 쓰지 않아요. 두 번째로, and 가 smiled 와 shook 두 동사를 대등하게 이어 주는 병렬 구조예요. 세 번째로, 두 동사가 모두 과거형이라 시제가 나란히 맞춰져 있고, shake 의 과거형이 shook 이라는 불규칙 변화라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점 하나를 만들어 봐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make\u003c/span> a mark.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그냥 점 하나를 만들어 봐.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님은 Vashti에게 완벽한 그림이 아니라 우선 \u003cb class=\"key\">표시\u003c/b> 하나를 해 보라고 말해요. 'Just'는 '그냥, 일단'의 뜻으로 부담을 낮춰 주고, 동사원형으로 시작하는 \u003cb class=\"key\">명령문\u003c/b>이라 권유와 가벼운 지시의 느낌을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [Just] + [동사원형] + 목적어 : \"그냥 만들어 봐\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Just, 그냥. make a mark, 점 하나를 만들어 봐. 이 문장 전체를 해석하면, 그냥 점 하나를 만들어 봐.","hl":"m"},{"n":41,"text":"여기서 선생님은 Vashti에게 완벽한 그림을 그리라는 게 아니라 일단 아주 작은 표시 하나를 해 보라고 해요. 동사원형으로 시작하는 명령문이라 '그냥 해 봐'라는 권유와 가벼운 지시의 느낌이 나요. 이 한마디가 다음 행동의 시작이 됩니다.","hl":"mn"},{"n":42,"text":"첫 번째, Just make는 주어 You를 생략하고 동사원형 make로 시작한 명령문이에요. 그래서 '그냥 만들어 봐'라는 지시와 권유의 뜻이 됩니다. 여기서는 선생님이 부담 없이 표시를 해 보라고 말하는 상황이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">데려다줄 거야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">take\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어딘가로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">somewhere\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 너를 어딘가로 데려다줄 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 표시 하나가 \u003cb class=\"key\">시작점\u003c/b>이 되어 Vashti를 새로운 \u003cb class=\"key\">가능성\u003c/b>으로 이끌 수 있다는 비유예요. 'take you somewhere'는 단순히 어딘가로 데려간다기보다, 그림을 시작하면 예상하지 못한 세계로 나아가게 된다는 뜻으로 읽을 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will(미래)\u003c/span> : will + [동사원형] : \"데려다줄 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">take + 목적어 + 장소 부사\u003c/span> : take + [목적어] + [장소 부사] : \"너를 어딘가로\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"It, 그것이. will take, 데려다줄 거야. you, 너를. somewhere, 어딘가로. 이 문장 전체를 해석하면, 그것이 너를 어딘가로 데려다줄 거야.","hl":"m"},{"n":44,"text":"선생님은 작은 표시 하나가 시작점이 되어 Vashti를 새로운 가능성으로 이끌 수 있다고 말해요. take you somewhere는 단순히 어딘가로 데려간다기보다, 그림을 시작하면 예상하지 못한 세계로 나아가게 된다는 비유로 읽을 수 있어요. 그래서 이 문장은 시작의 중요성을 보여 줍니다.","hl":"mn"},{"n":45,"text":"첫 번째, will take는 조동사 will 뒤에 동사원형 take가 온 미래 표현이에요. '데려다줄 것이다'로 해석하죠. 두 번째, you somewhere는 take의 목적어 you 뒤에 도착지 somewhere를 붙인 구조예요. somewhere는 '어딘가로'라는 장소 부사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는\u003c/span>\u003cspan class=\"en\">Vashti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펜을 집어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> a pen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이를 쿡 찔렀다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">poked\u003c/span> the paper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 펜을 집어 종이를 쿡 찔렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님의 말을 듣고 Vashti가 실제로 펜을 들어 종이를 콕 찌르는 \u003cb class=\"key\">행동\u003c/b>을 하는 장면이에요. 거창한 그림이 아니라 아주 작은 \u003cb class=\"key\">점\u003c/b> 하나를 찍음으로써 그림의 시작을 만든 것이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(pick up)\u003c/span> : pick + up + [목적어] / pick + [목적어] + up : \"집어 들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and(동사 병렬)\u003c/span> : [동사구 A] + and + [동사구 B] : \"그리고 찔렀다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Vashti, Vashti는. picked up a pen, 펜을 집어. and, 그리고. poked the paper, 종이를 쿡 찔렀다. 이 문장 전체를 해석하면, Vashti는 펜을 집어 종이를 쿡 찔렀다.","hl":"m"},{"n":47,"text":"선생님의 말을 듣고 Vashti가 실제로 펜을 들어 종이를 콕 찌르는 행동을 하는 장면이에요. 거창한 그림이 아니라 아주 작은 행동 하나를 시작한 것이죠. poked는 '쿡 찔렀다'처럼 가볍게 점을 찍는 동작을 생생하게 보여 줍니다.","hl":"mn"},{"n":48,"text":"첫 번째, picked up은 '집어 들다'라는 구동사예요. 목적어가 대명사이면 pick it up처럼 동사와 up 사이에 놓는다는 점도 기억해 두세요. 두 번째, and poked에서 and는 앞의 picked up과 뒤의 poked를 대등하게 연결하는 병렬 구조예요. 그래서 '펜을 집어 들고 종이를 찔렀다'처럼 두 동작을 자연스럽게 이어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기요!\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There!\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“여기요!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 펜으로 종이를 쿡 찔러 아주 작은 \u003cb class=\"key\">점\u003c/b> 하나를 만들고 '여기요!'라고 내미는 장면입니다. 거창한 그림이 아니라 점 하나일 뿐이지만, 선생님이 말한 '표시'를 처음으로 남긴 \u003cb class=\"key\">시도\u003c/b>입니다. 짧은 감탄사 안에 무언가를 해 보기 시작한 변화가 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄사 There의 쓰임(장소 부사가 아님)\u003c/span> : [There! (감탄사)] = '여기요!' : \"여기요!\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"There!, 여기요!. 이 문장 전체를 해석하면, “여기요!”","hl":"m"},{"n":50,"text":"Vashti가 펜으로 종이를 쿡 찔러 아주 작은 점 하나를 만들고 여기요 하고 말하는 장면이에요. 대단한 그림이 아니라 점 하나지만, 이것이 선생님이 말한 표시가 되죠. 짧은 감탄사 안에 무언가를 처음 시도해 본 용기가 담겨 있습니다.","hl":"mn"},{"n":51,"text":"여기서 There는 거기에라는 장소 부사가 아니라 여기요 하고 내미는 감탄사예요. 주어와 동사가 다 생략된 한 마디 표현이라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 선생님은\u003c/span>\u003cspan class=\"en\">Her teacher\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이를 집어 들고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 보고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의 깊게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">carefully\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 선생님은 종이를 집어 들고 주의 깊게 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 종이를 집어 들어 그 점을 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">깊게\u003c/b> 살펴보는 장면입니다. picked up → looked at → carefully로 행동이 차례로 이어지며, 작은 \u003cb class=\"key\">점\u003c/b> 하나도 진지하게 \u003cb class=\"key\">작품\u003c/b>으로 대우한다는 뜻입니다. 이 태도가 Vashti에게 '나도 무언가를 만들 수 있다'는 자신감을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 pick up의 목적어 배치\u003c/span> : pick up + [목적어(the paper)] : \"종이를 집어 들고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [picked up + 목적어] and [looked at + 목적어] : \"그리고 그것을 보았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사의 동사구 수식\u003c/span> : looked at it + [carefully(부사)] : \"주의 깊게\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Her teacher, 그녀의 선생님은. picked up the paper, 종이를 집어 들고. and looked at it, 그리고 그것을 보고. carefully, 주의 깊게. 이 문장 전체를 해석하면, 그녀의 선생님은 종이를 집어 들고 주의 깊게 보았다.","hl":"m"},{"n":53,"text":"선생님이 그 점을 주의 깊게 살펴보는 장면이에요. 집어 들고, 보고, 주의 깊게라는 세 동작이 차례로 이어지죠. 작은 점 하나를 진짜 작품처럼 대우해 주는 태도가 Vashti에게 자신감을 줍니다.","hl":"mn"},{"n":54,"text":"첫 번째, picked up the paper에서 pick up은 집어 들다라는 구동사예요. 두 번째, and가 picked up과 looked at을 병렬로 이어 주고 있습니다. 세 번째, carefully는 부사로 어떻게 보았는지를 꾸며 주는 자리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 그 종이를 돌려주고\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">returned \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">paper \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Vashti\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;이제 이것에 서명하렴.&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Now \u003c/span>\u003cspan class=\"tgt\">sign \u003c/span>\u003cspan class=\"tgt\">it.\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 종이를 Vashti에게 돌려주며 말했다, “이제 이것에 서명하렴.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 종이를 돌려주며 '이제 이것에 \u003cb class=\"key\">서명\u003c/b>하렴'이라고 말하는 장면입니다. 서명은 작품을 완성하는 행위이므로, 선생님은 점 하나를 \u003cb class=\"key\">작품\u003c/b>으로 인정하고 Vashti를 작가로 세워 주는 셈입니다. 그래서 이 말이 뒤에서 Vashti가 '나는 서명할 수 있다'고 깨닫게 만드는 \u003cb class=\"key\">복선\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">return A to B (목적어 + 전치사 to + 대상)\u003c/span> : return + [목적어(the paper)] + to + [대상(Vashti)] : \"그 종이를 Vashti에게 돌려주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [returned + 목적어] and [said + 목적어] : \"그리고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 sign] + [목적어 it] : \"이제 이것에 서명하렴\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"She returned the paper, 그녀는 그 종이를 돌려주고. to Vashti, Vashti에게. and said, 그리고 말했어요. \"Now sign it.\", \"이제 이것에 서명하렴.\". 이 문장 전체를 해석하면, 그녀는 종이를 Vashti에게 돌려주며 말했다, “이제 이것에 서명하렴.”","hl":"m"},{"n":56,"text":"선생님이 종이를 돌려주면서 이제 이것에 서명하렴 하고 말하는 장면이에요. 서명은 작품을 완성하는 행위라서, 점 하나를 작품으로 인정해 주는 말이죠. 그래서 이 장면은 뒤에서 Vashti가 나도 서명할 수 있다고 깨닫게 만드는 복선이기도 합니다.","hl":"mn"},{"n":57,"text":"첫 번째, returned the paper to Vashti는 A를 B에게 돌려주다라는 형태로, 전치사 to가 대상을 이끌어 4형식처럼 해석돼요. 두 번째, returned와 said가 and로 병렬 연결되어 있습니다. 세 번째, Now sign it은 주어 You가 생략된 명령문이라 동사원형 sign으로 시작하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Vashti는\u003c/span>\u003cspan class=\"en\">Vashti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각했다\u003c/span>\u003cspan class=\"en\">thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 동안.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">moment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Vashti는 잠시 동안 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 서명하라고 하자 Vashti가 곧바로 대답하지 않고 잠시 생각에 잠기는 장면이에요. 여기서 \u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">moment\u003c/b>는 길지 않은 짧은 시간을 뜻하며, 곧 이어질 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 준비하는 신호예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 시간의 길이\u003c/span> : for + [시간/기간 표현] : \"잠시 동안\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"Vashti, Vashti는. thought, 생각했다. for a moment, 잠시 동안.. 이 문장 전체를 해석하면, Vashti는 잠시 동안 생각했다.","hl":"m"},{"n":59,"text":"선생님이 서명하라고 했을 때 Vashti가 바로 대답하지 않고 잠시 생각하는 장면이에요. 여기서 for a moment는 짧은 시간을 뜻하고, 곧 이어질 마음의 변화를 준비하는 신호로 봐 주세요.","hl":"mn"},{"n":60,"text":"for는 시간의 길이를 나타내는 전치사예요. a moment처럼 짧은 시간 표현과 함께 쓰여서 잠시 동안이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음,\u003c/span>\u003cspan class=\"en\">&quot;Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마 저는 그릴 수는 없지만\u003c/span>\u003cspan class=\"en\">maybe I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 저는 제 이름은 서명할 수 있어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">sign\u003c/span> my name.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“음, 아마 저는 그릴 수는 없지만 제 이름은 서명할 수 있어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Vashti가 자신은 그림을 못 그리지만 이름은 서명할 수 있다는 사실을 깨닫는 문장이에요. 앞의 부정적인 생각과 뒤의 긍정적인 발견을 \u003cb class=\"key\">but\u003c/b>으로 이어 \u003cb class=\"key\">자신감\u003c/b>의 작은 시작을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정형\u003c/span> : can't + [동사원형] : \"그릴 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but\u003c/span> : [절] + but + [절] : \"그러나, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형] : \"서명할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"\"Well, 음. maybe I can't draw, 아마 저는 그릴 수는 없지만. but I can sign my name.\", 그러나 저는 제 이름은 서명할 수 있어요.. 이 문장 전체를 해석하면, “음, 아마 저는 그릴 수는 없지만 제 이름은 서명할 수 있어요.”","hl":"m"},{"n":62,"text":"Vashti가 자신은 그림을 못 그리지만 이름은 서명할 수 있다는 걸 깨닫는 문장이에요. 앞의 부정적인 생각과 뒤의 긍정적인 발견을 but으로 이어서 자신감의 작은 시작을 보여 줘요.","hl":"mn"},{"n":63,"text":"먼저 can't draw에서 can은 능력이나 가능성을 나타내는 조동사이고 not이 붙으면 할 수 없다가 돼요. can't 뒤에는 반드시 동사원형 draw가 와요. 그리고 but은 앞의 그릴 수 없다와 뒤의 서명할 수 있다를 대조로 이어 주는 등위접속사예요. 마지막으로 can sign에서 can 뒤에 동사원형 sign이 와서 가능을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미술 수업이 끝난 뒤에도 Vashti는 \u003cb class=\"key\">빈 \u003c/b>\u003cb class=\"key\">종이\u003c/b> 앞에서 교실을 떠나지 못합니다.\u003c/li>\u003cli>선생님은 그 종이를 '눈보라 속의 북극곰'이라고 \u003cb class=\"key\">농담\u003c/b>하며 분위기를 풀어 줍니다.\u003c/li>\u003cli>선생님의 '그냥 점 하나를 만들어 봐'라는 말에 Vashti는 종이를 \u003cb class=\"key\">쿡 \u003c/b>\u003cb class=\"key\">찌르듯\u003c/b> 점을 하나 찍습니다.\u003c/li>\u003cli>선생님은 그 점에 \u003cb class=\"key\">서명\u003c/b>하라고 말하고, Vashti는 못 그려도 이름은 쓸 수 있다는 것을 깨닫습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even a single small mark can start a person on the way to believing in her own ability.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미술 시간, 빈 종이 앞에서 &quot;나는 정말 못 그리겠어요&quot;라고 말하는 Vashti에게 선생님은 &quot;그냥 점 하나를 만들어 봐&quot;라고 말합니다. 그 점을 찍은 Vashti에게 선생님이 &quot;이제 이것에 서명하렴&quot;이라고 말하자, 그녀는 \u003cb class=\"key\">그릴 \u003c/b>\u003cb class=\"key\">수는 \u003c/b>\u003cb class=\"key\">없지만\u003c/b> 이름은 서명할 수 있다는 사실을 스스로 깨닫습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":64,"text":"오늘 내용을 정리해 볼게요. Vashti를 바꾼 것은 갑자기 늘어난 실력이 아니라 점 하나를 찍어 본 아주 작은 행동이었어요. 성장 마인드셋과 주인의식이라는 개념도 꼭 챙겨 두시고요. 여러분도 무언가 잘 안 될 때 오늘 배운 것처럼 작은 표시 하나부터 시작해 보면 좋겠습니다. 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
