<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"7과 본문3","audioDir":"3_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>Funny-Looking Potatoes Can Make Fantastic Chips\u003c/h1>\u003ch2>우스꽝스럽게 생긴 감자도 훌륭한 감자칩을 만든다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>모양이 \u003cb class=\"key\">특이하고\u003c/b> 크기도 모두 다른 못생긴 감자들은 사람들에게 \u003cb class=\"key\">쓸모없다\u003c/b>고 여겨지지만, 실제로는 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">감자칩\u003c/b>을 만들 수 있다는 것을 사람들이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">알기\u003c/b>를 바란다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Funny-looking potatoes may look useless, but they can make fantastic chips, so people should learn more about them and judge them by their real value, not by their appearance.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 당근과 키위, 사과가 나오는 짧은 대화문을 함께 읽어 볼 거예요. 못생긴 감자들에 대한 이야기인데, 겉모습은 이상해도 훌륭한 감자칩을 만들 수 있다는 내용이죠. 핵심은 겉모습만 보고 쓸모없다고 판단하지 말자는 거예요. 그럼 힘차게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 겉모습만으로 물건의 가치를 판단하곤 하죠. 마트에는 크기와 모양이 일정한 농산물만 진열되기 때문에, 울퉁불퉁한 채소는 자연스럽게 \u003cb class=\"key\">못난이 \u003c/b>\u003cb class=\"key\">농산물\u003c/b>(ugly produce)로 불리며 외면받습니다. 생산자와 유통업체가 정한 \u003cb class=\"key\">외형 \u003c/b>\u003cb class=\"key\">규격\u003c/b>(cosmetic standards)에 맞지 않는다는 이유로 멀쩡한 식품이 버려지면 \u003cb class=\"key\">식량 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>(food waste)가 커지고, 농민의 소득도 줄어듭니다. 그래서 최근에는 모양은 이상해도 맛과 영양은 똑같다는 점을 알리는 캠페인이 늘고 있어요. 친구를 처음 만났을 때 첫인상만으로 성격을 단정하면 오해하기 쉬운 것과 같은 이치죠. 이 지문의 채소들이 들려주는 이야기도 바로 그런 \u003cb class=\"key\">편견\u003c/b>에 대한 것입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 쌓아 볼게요. 우리는 흔히 겉모습만으로 물건의 가치를 판단하곤 하죠. 마트에는 크기와 모양이 일정한 농산물만 진열되기 때문에, 울퉁불퉁한 채소는 자연스럽게 못난이 농산물로 불리며 외면받습니다. 영어로는 ugly produce라고 하죠. 생산자와 유통업체가 정한 외형 규격에 맞지 않는다는 이유로 멀쩡한 식품이 버려지면 식량 낭비가 커지고 농민의 소득도 줄어듭니다. 친구를 처음 만났을 때 첫인상만으로 성격을 단정하면 오해하기 쉬운 것과 같은 이치예요. 그래서 이 지문의 채소들 이야기는 바로 그런 편견에 대한 이야기라고 이해하시면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>못생긴 감자의 등장\u003csmall>도입·통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>당근이 우스꽝스럽게 생긴 \u003cb class=\"key\">못생긴 \u003c/b>\u003cb class=\"key\">감자\u003c/b>들을 먼저 꺼냅니다. 그 감자들은 모양이 특이하고 크기도 모두 달라서 눈에 띄지만, 사람들은 그런 감자들을 \u003cb class=\"key\">쓸모없다\u003c/b>고 여깁니다. 여기까지가 일반적인 인식을 보여 주는 \u003cb class=\"key\">통념\u003c/b> 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뜻밖의 반전\u003csmall>전환 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>키위가 but을 쓰며 분위기를 바꿉니다. 우스꽝스럽게 생긴 감자들이 오히려 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">감자칩\u003c/b>을 만든다고 들었다는 거죠. 당근이 놀라서 되묻고 '정말 멋진데!'라고 감탄하는 장면에서 \u003cb class=\"key\">반전\u003c/b>이 완성됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>더 알려지길 바람\u003csmall>주장(소망) · 문장 7–8\u003c/small>\u003c/h4>\u003cp>당근은 사람들이 자기들에 대해 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">알기\u003c/b>를 바랍니다. 겉모습이 아니라 쓸모로 평가받고 싶다는 \u003cb class=\"key\">소망\u003c/b>이 담긴 문장이죠. 사과가 '나도 그러길 바라'라고 맞장구치면서 이 바람은 등장인물 모두의 것으로 넓어집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사람들을 맞이함\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>사과가 다가오는 \u003cb class=\"key\">사람들\u003c/b>을 발견하고 친구들에게 알립니다. 그리고 모두 함께 그들을 \u003cb class=\"key\">환영\u003c/b>하자고 제안하며 대화가 끝납니다. 편견을 넘어 반갑게 맞이하자는 \u003cb class=\"key\">결론\u003c/b>으로 마무리되는 셈이죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 대화가 어떤 순서로 흘러가는지 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 단계는 못생긴 감자의 등장이에요. 당근이 우스꽝스럽게 생긴 못생긴 감자들을 먼저 꺼내죠. 그 감자들은 모양이 특이하고 크기도 모두 달라서 눈에 띄지만, 사람들은 그런 감자들을 쓸모없다고 여깁니다. 여기까지가 일반적인 인식, 즉 통념을 보여 주는 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 뜻밖의 반전입니다. 키위가 but을 쓰면서 분위기를 바꾸죠. 우스꽝스럽게 생긴 감자들이 오히려 훌륭한 감자칩을 만든다고 들었다는 거예요. 당근이 놀라서 되묻고 정말 멋지다고 감탄하는 장면에서 반전이 완성됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 더 알려지길 바라는 부분이에요. 당근은 사람들이 자기들에 대해 더 많이 알기를 바랍니다. 겉모습이 아니라 쓸모로 평가받고 싶다는 소망이 담긴 문장이죠. 사과가 나도 그러길 바란다고 맞장구치면서 이 바람은 등장인물 모두의 것으로 넓어집니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 사람들을 맞이하는 결론이에요. 사과가 다가오는 사람들을 발견하고 친구들에게 알립니다. 그리고 모두 함께 그들을 환영하자고 제안하면서 대화가 끝나죠. 편견을 넘어 반갑게 맞이하자는 결론으로 마무리되는 겁니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박 (대조·예시)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 못생긴 감자를 쓸모없다고 보는 \u003cb class=\"key\">통념\u003c/b>에서 출발하지만, but이 들어간 네 번째 문장에서 곧바로 \u003cb class=\"key\">반박\u003c/b>합니다. 우스꽝스럽게 생긴 감자가 오히려 훌륭한 감자칩이 된다는 사실이 \u003cb class=\"key\">근거\u003c/b>로 제시되면서 인식이 뒤집히죠. 그 바람을 담은 일곱 번째 문장이 주제문인데, 이것이 글의 뒤쪽에 놓여 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>too (1)\u003c/b>\u003cspan>앞 내용에 추가\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>통념 반박·전환\u003c/span>\u003cb>I hope that (7)\u003c/b>\u003cspan>주제문 제시\u003c/span>\u003cb>Look (9)\u003c/b>\u003cspan>주의 환기·장면 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">funny-looking potatoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan \">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문(How + 형용사)\u003c/span> : How + [[형용사]]! : \"정말 멋진데!\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"How, 정말. wonderful!, 멋진데!. 이 문장 전체를 해석하면, 정말 멋진데!","hl":"m"},{"n":28,"text":"당근은 키위의 말을 듣고 감탄하며 기뻐하는 장면이에요. 짧은 감탄문으로 긍정적인 기대를 드러내서 대화 분위기를 밝게 해요.","hl":"mn"},{"n":29,"text":"How wonderful은 How 뒤에 형용사 wonderful을 두어 감탄을 나타내는 감탄문이에요. 정말 멋지다처럼 느낌을 강하게 표현할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 바라요\u003c/span>\u003cspan class=\"en\">I hope\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 배우기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에 대해 더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 사람들이 우리에 대해 더 많이 알기를 희망해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당근이 자기 마음을 정식으로 꺼내는 문장이에요. 겉모습이 이상한 감자를 쓸모없다고 여기는 사람들의 \u003cb class=\"key\">편견\u003c/b>을 알고, 우리에 대해 더 많이 알아 주길 바란다는 \u003cb class=\"key\">바람\u003c/b>을 전해요. 이 바람은 바로 뒤 사과의 \u003cb class=\"key\">공감\u003c/b>으로 이어져 두 친구의 마음이 하나가 되는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어 역할)\u003c/span> : hope + [that + 주어 + 동사 (명사절)] : ~하기를 바라다 : \"사람들이 배우기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more + 전치사구\u003c/span> : learn + [more (비교급 부사)] + [about + 목적격] : \"우리에 대해 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I hope, 나는 바라요. that people learn, 사람들이 배우기를. more about us, 우리에 대해 더 많이. 이 문장 전체를 해석하면, 나는 사람들이 우리에 대해 더 많이 알기를 희망해.","hl":"m"},{"n":31,"text":"이 문장은 당근이 자기 마음을 정식으로 꺼내는 부분이에요. 사람들이 이상한 모양의 감자를 보고 품는 편견을 알기에, 우리에 대해 더 많이 알아 주길 바란다는 바람을 전하는 거죠. 그리고 그 바람은 바로 뒤에서 사과가 받아 주니까 두 친구의 공감으로 이어지는 거예요.","hl":"mn"},{"n":32,"text":"먼저 첫 번째 어법은 접속사 that이에요. hope 뒤에 that people learn이 통째로 붙어서 무엇을 바라는지 내용을 채워 주죠. 이때 that은 뒤 문장을 명사절로 묶어 주는 접속사예요. 두 번째는 비교급 more인데요, learn을 꾸며서 더 많이 배운다는 정도를 나타내요. 그 뒤에 오는 about us는 전치사구로 무엇에 대해 알지를 분명히 밝혀 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과:\u003c/span>\u003cspan class=\"en\">Apple:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그렇게 되기를 바라\u003c/span>\u003cspan class=\"en\">I hope \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사과: 나도 그러길 바라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 당근의 바람에 뜻을 함께하는 장면이에요. so가 앞에서 당근이 한 말 \u003cb class=\"key\">전체\u003c/b>를 대신 받아서, 같은 말을 되풀이하지 않고도 \u003cb class=\"key\">동의\u003c/b>를 분명히 보여 줘요. 여기에 too까지 붙여 '나도 똑같이'라는 \u003cb class=\"key\">공감\u003c/b>을 강조하고, 곧이어 사람들이 오는 것을 발견하는 장면으로 넘어가요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so의 대용법(앞 내용을 받는 말)\u003c/span> : I hope + [so (앞 문장 내용 전체를 받는 대명사)] : \"그러길, 그렇게 되기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too\u003c/span> : [문장] + , + too : ~도 또한 : \"나도, 역시\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Apple, 사과:. I hope so, 나는 그렇게 되기를 바라. too, 나도. 이 문장 전체를 해석하면, 사과: 나도 그러길 바라.","hl":"m"},{"n":34,"text":"사과가 당근의 바람에 함께 뜻을 모으는 장면이에요. so가 앞에서 당근이 한 말 전체를 받아 주니까, 같은 말을 다시 하지 않아도 동의한다는 게 확실히 보이죠. 거기에 too까지 붙여서 나도 똑같다는 공감을 한 번 더 강조해 주고요. 그리고 이 공감이 끝나자마자 사람들이 오는 장면이 펼쳐져요.","hl":"mn"},{"n":35,"text":"첫 번째로 볼 것은 so의 쓰임이에요. 여기서 so는 '그렇게'라는 뜻으로 앞사람이 한 말 전체를 대신 받는 말이에요. 그래서 I hope so라고만 해도 그렇게 되길 바란다는 동의가 완성되죠. 두 번째는 too인데요, 또한, 역시라는 뜻으로 첨가의 의미를 더해 줘요. 사과도 같은 마음이라는 걸 짧게 강조하는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">봐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구들!\u003c/span>\u003cspan class=\"en\">friends!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">봐, 친구들!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 애플이 친구들의 시선을 사람들이 오는 쪽으로 돌리는 말이에요. Look은 '이쪽을 봐'라며 \u003cb class=\"key\">주의\u003c/b>를 끄는 표현이고, friends는 친구들을 부르는 \u003cb class=\"key\">호격\u003c/b>이에요. 이 짧은 한마디로 모든 친구의 시선이 사람들에게 옮겨 가고, 다음 문장의 환영 인사로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Look] + , + [호격 friends] : 봐, 친구들 : \"봐\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Look, 봐. friends!, 친구들!. 이 문장 전체를 해석하면, 봐, 친구들!","hl":"m"},{"n":37,"text":"애플이 친구들의 시선을 사람들이 오는 쪽으로 돌리는 장면이에요. Look은 이쪽을 봐라며 주의를 끄는 표현이고, friends는 친구들을 부르는 호격이에요. 이 짧은 한마디 덕분에 모두의 시선이 한 방향으로 옮겨 가고, 이어지는 환영 인사로 자연스럽게 넘어갑니다.","hl":"mn"},{"n":38,"text":"여기서 볼 어법은 명령문이에요. 상대에게 무엇을 하라고 할 때는 동사원형으로 문장을 시작하죠. 그래서 주어 없이 Look으로 바로 시작한 거예요. 그리고 쉼표 뒤에 friends를 붙여서 친구들에게 말을 거는 구조를 만들었어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오고 있어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">coming\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 오고 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Apple이 친구들에게 사람들이 오고 있다고 알리는 장면이에요. \u003cb class=\"key\">현재진행형\u003c/b> \u003cb class=\"key\">are \u003c/b>\u003cb class=\"key\">coming\u003c/b>으로 지금 눈앞에서 진행 중인 일을 생생하게 전달하죠. 이 말을 듣고 친구들은 손님을 맞을 준비를 하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [주어] + be동사 + [동사-ing] : \"오고 있어\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"People, 사람들이. are coming, 오고 있어.. 이 문장 전체를 해석하면, 사람들이 오고 있어.","hl":"m"},{"n":40,"text":"이 문장은 Apple이 친구들에게 사람들이 오고 있다고 알려 주는 장면이에요. 현재진행형 are coming을 써서 지금 눈앞에서 진행 중인 움직임을 생생하게 보여 주죠. 이 말을 듣고 친구들은 손님을 맞을 준비를 하게 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째, are coming은 지금 진행 중인 동작을 나타내는 현재진행형이에요. be동사 are 뒤에 현재분사 coming을 붙여 바로 눈앞의 움직임을 보여 주죠. 그래서 단순현재가 아니라 현재진행형으로 해석하는 게 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 …하자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 환영하자.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">welcome\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들을 환영하자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다가오는 사람들을 함께 \u003cb class=\"key\">환영\u003c/b>하자는 Apple의 제안이에요. Let's를 써서 모두를 아우르는 부드러운 \u003cb class=\"key\">청유\u003c/b>의 뜻을 나타냅니다. 지문은 이 환영의 말로 자연스럽게 마무리됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's\u003c/span> : Let's + [동사원형] : \"우리 …을 환영하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 대명사\u003c/span> : welcome + [목적격 대명사] : \"그들을\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Let's, 우리 …하자. welcome them, 그들을 환영하자.. 이 문장 전체를 해석하면, 그들을 환영하자.","hl":"m"},{"n":43,"text":"이 문장은 다가오는 사람들을 함께 환영하자는 Apple의 제안이에요. Let's를 써서 모두를 아우르는 부드러운 청유의 뜻을 나타냅니다. 지문은 이 환영의 말로 자연스럽게 마무리됩니다.","hl":"mn"},{"n":44,"text":"첫 번째, Let's welcome은 함께 하자고 권하는 청유문이에요. Let's 뒤에 동사원형 welcome을 써서 우리가 함께 환영하자는 뜻을 만들어요. 여기서 's는 us의 줄임말이에요. 두 번째, them은 welcome의 목적어로 쓰인 목적격 대명사예요. 앞에 나온 사람들을 가리키죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>못생긴 감자들은 모양이 \u003cb class=\"key\">특이하고\u003c/b> 크기가 모두 달라서 눈에 띈다.\u003c/li>\u003cli>사람들은 그런 감자들을 \u003cb class=\"key\">쓸모없다\u003c/b>고 여긴다.\u003c/li>\u003cli>하지만 키위는 그 감자들이 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">감자칩\u003c/b>을 만든다고 들었다.\u003c/li>\u003cli>당근과 사과는 사람들이 자기들을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">알기\u003c/b>를 바라며 다가오는 사람들을 \u003cb class=\"key\">환영\u003c/b>하려 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Funny-looking potatoes may look useless, but they can make fantastic chips, so people should learn more about them and judge them by their real value, not by their appearance.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">모양이 \u003cb class=\"key\">특이하고\u003c/b> 크기도 모두 다른 못생긴 감자들은 사람들에게 \u003cb class=\"key\">쓸모없다\u003c/b>고 여겨지지만, 실제로는 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">감자칩\u003c/b>을 만들 수 있다는 것을 사람들이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">알기\u003c/b>를 바란다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 지문은 모양이 특이하고 크기가 제각각인 못생긴 감자들에 대한 이야기였어요. 사람들은 그런 감자를 쓸모없다고 여기지만, 키위의 말처럼 그 감자들이 훌륭한 감자칩을 만든다는 사실이 중요하죠. 결국 겉모습이 아니라 실제 가치로 판단해야 하고, 사람들이 우리에 대해 더 많이 알기를 바라는 마음으로 서로를 환영하자는 겁니다. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
