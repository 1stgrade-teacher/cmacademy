<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pk),#7CCBC8)}

.lp-sa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}

.lp-sa .m{color:#666;margin-left:6px;font-size:14px}
.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}

.lp-chips .a{background:#FFF1D8;color:#8A5A00}
.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}
.lp-sno .es{color:#fff;background:#E0952B;border-radius:4px;padding:1px 8px;font-size:11.5px;margin-left:8px}
.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}
.lp .mk{border-radius:4px;width:auto;min-width:20px;padding:0 3px;background:var(--pk-t)}
.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}
.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

.lp-hl{border-radius:6px}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"7과 본문1","audioDir":"1_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>A Special Market for Funny-Looking Fruits and Vegetables\u003c/h1>\u003ch2>우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장에서 사과와 키위가 각자의 사연을 이야기합니다. 둘 다 \u003cb class=\"key\">껍질의 \u003c/b>\u003cb class=\"key\">점\u003c/b>이나 \u003cb class=\"key\">크기\u003c/b> 같은 겉모습 때문에 맛없다고 여겨지지만, 실제로는 \u003cb class=\"key\">해롭지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 맛이 훌륭하다고 말합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Appearance such as spots or size does not determine how good fruits and vegetables taste.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장 이야기를 함께 읽어 볼 거예요. 사과와 키위가 각자의 사연을 들려주는 짧고 재미있는 글이죠. 요약하면 겉모습이 아니라 실제 맛이 중요하다는 이야기고, 요지는 점이나 크기 같은 겉모습이 과일의 맛을 결정하지는 않는다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">마트에서는 모양이 고르고 색이 예쁜 과일만 진열대에 오릅니다. 이런 \u003cb class=\"key\">외모 \u003c/b>\u003cb class=\"key\">기준\u003c/b>(cosmetic standard) 때문에 점이 있거나 크기가 작은 과일은 팔리지 않고 버려지곤 하죠. 실제로 모양이 못난 농산물은 전체 \u003cb class=\"key\">식량 \u003c/b>\u003cb class=\"key\">손실\u003c/b>(food loss)에서 큰 부분을 차지합니다. 그래서 최근에는 못난이 과일을 싸게 팔거나 전문 \u003cb class=\"key\">시장\u003c/b>(market)을 여는 움직임이 늘고 있습니다. 사람의 외모만 보고 성격을 짐작하면 큰 오해가 생기듯이, 과일도 겉모습만 보고 \u003cb class=\"key\">맛\u003c/b>을 판단하면 오해가 생깁니다. 실제로 겉이 울퉁불퉁한 과일이 더 달고 향이 좋은 경우도 많습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 알아 볼게요. 마트에서는 모양이 고르고 색이 예쁜 과일만 진열대에 올립니다. 이런 외모 기준 때문에 점이 있거나 크기가 작은 과일은 팔리지 않고 버려지곤 하죠. 실제로 모양이 못난 농산물은 전체 식량 손실에서 큰 부분을 차지합니다. 그래서 최근에는 못난이 과일을 싸게 팔거나 전문 시장을 여는 움직임이 늘고 있어요. 사람의 외모만 보고 성격을 짐작하면 오해가 생기듯이, 과일도 겉모습만 보고 맛을 판단하면 큰 오해가 생긴답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특별한 시장\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 우스꽝스럽게 생긴 과일과 채소를 위한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">시장\u003c/b>을 소개하며 시작합니다. 이곳에 모인 과일과 채소는 서로에게 \u003cb class=\"key\">인사\u003c/b>를 나누고 이야기를 시작합니다. 아직 어떤 주장도 나오지 않은 \u003cb class=\"key\">도입부\u003c/b>라서 앞으로 어떤 사연이 펼쳐질지 궁금하게 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사과의 통념\u003csmall>통념 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>먼저 사과가 정말 좋은 날이라는 \u003cb class=\"key\">감탄\u003c/b>과 함께 등장합니다. 사과는 껍질에 \u003cb class=\"key\">점\u003c/b>이 많아서 이 시장에 왔다고 말합니다. 그리고 사람들이 자신을 \u003cb class=\"key\">맛없다\u003c/b>고 생각한다는 세상의 통념을 전합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>사과의 반박\u003csmall>반박 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>사과는 곧바로 그들은 틀렸다고 \u003cb class=\"key\">반박\u003c/b>합니다. 점은 \u003cb class=\"key\">해롭지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 사실을 먼저 밝히고, 자신은 맛이 훌륭하다고 \u003cb class=\"key\">주장\u003c/b>합니다. 겉모습과 실제 맛은 별개라는 점을 사과의 사례로 보여 주는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>키위의 통념\u003csmall>통념 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이번에는 키위가 자신을 소개하며 둥글지만 아주 \u003cb class=\"key\">작다\u003c/b>고 말합니다. 농부들이 \u003cb class=\"key\">크기\u003c/b> 때문에 자신을 팔고 싶어 하지 않는다는 현실을 전합니다. 사과와 마찬가지로 \u003cb class=\"key\">겉모습\u003c/b> 때문에 겪는 어려움을 말하는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>키위의 반박\u003csmall>반박 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>키위는 크기가 무슨 상관이야라는 \u003cb class=\"key\">수사의문문\u003c/b>으로 되받아칩니다. 그리고 자신이 달콤하고 맛있다는 사실로 \u003cb class=\"key\">주장\u003c/b>을 마무리합니다. 결국 두 과일 모두 겉모습이 아니라 \u003cb class=\"key\">맛\u003c/b>이 중요하다는 메시지를 남깁니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입부예요. 글은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장을 소개하며 시작합니다. 이곳에 모인 과일과 채소는 서로에게 인사를 나누고 이야기를 시작해요. 아직 주장은 나오지 않지만, 어떤 사연이 펼쳐질지 궁금하게 만드는 부분입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 사과가 등장해요. 사과는 정말 좋은 날이라고 감탄하며 말문을 엽니다. 그리고 껍질에 점이 많아서 이 시장에 왔다고 말하죠. 이어서 사람들이 자신을 맛없다고 생각한다는 세상의 통념을 전합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 사과는 곧바로 그들은 틀렸다고 반박해요. 점은 해롭지 않다는 사실을 먼저 밝히고, 자신은 맛이 훌륭하다고 주장합니다. 겉모습과 실제 맛은 별개라는 점을 사과의 사례로 보여 주는 단계예요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 키위가 나옵니다. 키위는 자신이 둥글지만 아주 작다고 소개하고, 농부들이 크기 때문에 자신을 팔고 싶어 하지 않는다는 현실을 전해요. 사과와 마찬가지로 겉모습 때문에 겪는 어려움을 말하는 거죠.","hl":"f3"},{"n":8,"text":"마지막 단계에서 키위는 크기가 무슨 상관이야라는 수사의문문으로 되받아칩니다. 그리고 자신이 달콤하고 맛있다는 사실로 주장을 마무리해요. 결국 두 과일 모두 겉모습이 아니라 맛이 중요하다는 메시지를 남깁니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시(통념-반박)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 사과와 키위 두 사례를 \u003cb class=\"key\">예시\u003c/b>로 나란히 보여 주며, 각 사례 안에서 통념과 반박을 반복합니다. 주제를 처음에 선언하지 않고 마지막 키위의 말에서 \u003cb class=\"key\">주제\u003c/b>가 드러나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다. They are wrong!과 Who cares about size? 같은 강한 \u003cb class=\"key\">반박\u003c/b> 표현이 중심 생각을 대신 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What a nice day! (3)\u003c/b>\u003cspan>감탄문으로 분위기 전환\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>People think that (5)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>They are wrong! (6)\u003c/b>\u003cspan>통념 반박\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>because of (10)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>Who cares about (11)\u003c/b>\u003cspan>수사의문문으로 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">funny-looking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spots on my skin\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">very small\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">size\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사람들의 통념\u003c/th>\u003cth>과일들의 주장\u003c/th>\u003c/tr>\u003ctr>\u003ctd>점이 많으면 맛없다\u003c/td>\u003ctd>점은 해롭지 않고 맛있다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>작으면 팔 수 없다\u003c/td>\u003ctd>크기는 상관없고 달콤하다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 예시예요. 사과와 키위 두 사례를 나란히 보여 주면서, 각 사례 안에서 통념과 반박을 반복하죠. 주제를 처음에 선언하지 않고 마지막 키위의 말에서 주제가 드러나니까 미괄식 구조로 보면 됩니다. 그래서 마지막 수사의문문을 주제문처럼 잡아 두면 좋아요.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨야 해요. 다섯 번째 문장의 People think that은 통념을 제시하고, 여섯 번째 문장의 They are wrong은 그 통념을 바로 반박하죠. 네 번째 문장의 because와 열 번째 문장의 because of는 모두 이유를 붙여 주고, 아홉 번째 문장의 but은 둥글지만 아주 작다는 대조를 만듭니다. 열한 번째 문장의 Who cares about은 수사의문문으로 강조하는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>funny-looking\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>우스꽝스럽게 생긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>market\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>greet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>each other\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nice\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좋은, 멋진\u003c/s lp-chunk\">\u003cspan class=\"ko\">그리고 채소를 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">vegetables\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이곳은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 배경을 열어 주는 문장으로, 이야기가 펼쳐질 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">시장\u003c/b>이 어떤 곳인지 소개합니다. funny-looking은 '우스꽝스럽게 생긴'이라는 뜻으로, 겉모습이 \u003cb class=\"key\">특이한\u003c/b> 과일과 채소가 모이는 공간임을 암시해요. 뒤에 이어질 등장인물들의 말과 대비되는 \u003cb class=\"key\">배경\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : 명사(market) + for + 명사구 : \"우스꽝스럽게 생긴 과일과 채소를 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사를 포함한 복합형용사\u003c/span> : [funny + looking(-ing)] → 명사 앞에서 꾸미는 하나의 형용사 : \"우스꽝스럽게 생긴\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"This is, 이것은 ~입니다. a special market, 특별한 시장. for funny-looking fruits, 우스꽝스럽게 생긴 과일을 위한. and vegetables, 그리고 채소를 위한. 이 문장 전체를 해석하면, 이곳은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장입니다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 배경을 열어 주는 문장이에요. 우스꽝스럽게 생긴 과일과 채소만 모이는 특별한 시장이 있다고 소개하죠. 겉모습이 특이한 과일과 채소들의 이야기가 곧 시작된다는 신호예요.","hl":"mn"},{"n":15,"text":"첫 번째로 funny-looking을 보세요. look이 현재분사 looking이 되어 funny와 합쳐지면 하나의 형용사가 되고, 그래서 fruits 앞에서 꾸며 줍니다. 두 번째로 for가 이끄는 전치사구는 앞의 market을 뒤에서 꾸며 주는 형용사구 역할을 해요. for는 '~을 위한'이라는 목적의 의미로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 인사합니다\u003c/span>\u003cspan class=\"en\">They greet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이야기를 시작합니다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 서로에게 인사하며 이야기를 시작합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 소개된 과일과 채소들이 실제로 \u003cb class=\"key\">대화\u003c/b>를 나누기 시작하는 장면을 여는 문장입니다. greet과 start to talk가 and로 \u003cb class=\"key\">병렬\u003c/b> 연결되어 두 동작이 연달아 일어남을 보여 줘요. 이후 각 등장인물의 말이 이어지도록 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상호대명사\u003c/span> : 복수 주어 + 동사 + each other : \"서로에게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : start + [to talk (to부정사/목적어)] : \"이야기를 시작합니다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They greet, 그들은 인사합니다. each other, 서로에게. and start to talk, 그리고 이야기를 시작합니다. 이 문장 전체를 해석하면, 그들은 서로에게 인사하며 이야기를 시작합니다.","hl":"m"},{"n":17,"text":"앞에서 소개된 과일과 채소들이 이제 실제로 말을 시작한다는 장면이에요. 인사하고 나서 대화를 시작하죠. 바로 다음부터 각 등장인물의 대사가 이어지니까 이 문장은 대화의 도입부라고 보면 됩니다.","hl":"mn"},{"n":18,"text":"첫 번째로 each other를 보세요. 둘 이상이 주고받는 상호 관계를 나타내는 대명사이고, 전치사 없이 greet의 목적어로 바로 쓰였어요. 두 번째로 start to talk에서 start는 to부정사를 목적어로 받아 '~하기 시작하다'를 만듭니다. 이때 greet과 start가 and로 묶여 병렬 구조를 이룬다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과:\u003c/span>\u003cspan class=\"en\">Apple:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 좋은 날이야!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">nice \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사과: 정말 좋은 날이야!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 처음 등장하며 분위기를 밝게 여는 \u003cb class=\"key\">감탄문\u003c/b>입니다. 화자가 '사과'라는 것을 콜론으로 표시해, 이제부터 인물의 직접 \u003cb class=\"key\">대사\u003c/b>가 시작됨을 알려 줘요. 짧은 감탄으로 시장의 즐거운 분위기를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문(What + a + 형용사 + 명사)\u003c/span> : What + a/an + [형용사] + [명사]! : \"정말 좋은 날이야!\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Apple, 사과:. What a nice day!, 정말 좋은 날이야!. 이 문장 전체를 해석하면, 사과: 정말 좋은 날이야!","hl":"m"},{"n":20,"text":"사과가 처음 등장하면서 던지는 첫마디예요. 콜론으로 화자가 사과임을 밝혀 주고, 이제부터 인물의 직접 대사가 시작된다는 걸 알려 줍니다. 짧은 감탄으로 시장의 밝고 즐거운 분위기를 전해 줘요.","hl":"mn"},{"n":21,"text":"여기서 볼 포인트는 What a nice day라는 감탄문이에요. 명사 day를 형용사 nice가 앞에서 꾸미는 어순이고, How와 달리 What은 명사가 중심이라 a와 명사가 함께 옵니다. 이 어순을 그대로 외워 두면 감탄문 문제는 어렵지 않아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 여기(이곳에) 왔어\u003c/span>\u003cspan class=\"en\">I'm here\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 나는 가지고 있기 때문이야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> I have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 점을\u003c/span>\u003cspan class=\"en\">many spots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 껍질에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">skin\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내 껍질에 점이 많아서 이곳에 왔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 자신이 이 시장에 온 까닭을 직접 밝히는 문장이에요. \u003cb class=\"key\">because\u003c/b>로 이유를 제시하고 \u003cb class=\"key\">spots\u003c/b>로 껍질의 점을 콕 집어 말하죠. 겉모습 때문에 밀려났다는 \u003cb class=\"key\">억울함\u003c/b>이 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [[주어]] + [[동사]] + because + 주어 + 동사 (이유의 접속사절) : \"왜냐하면 ~이기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [[명사]] + on + [[명사]] (전치사구가 앞 명사를 뒤에서 꾸밈) : \"내 껍질에 있는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"I'm here, 나는 여기(이곳에) 왔어. because I have, 왜냐하면 나는 가지고 있기 때문이야. many spots, 많은 점을. on my skin, 내 껍질에. 이 문장 전체를 해석하면, 나는 내 껍질에 점이 많아서 이곳에 왔어.","hl":"m"},{"n":23,"text":"이 문장은 사과가 자기소개를 시작하면서 왜 이 시장에 나왔는지 밝히는 대목이에요. because 하나로 이유를 딱 짚어 주고, spots라는 단어로 껍질에 난 점을 콕 집어 말하죠. 못생겨서가 아니라 겉모습 때문에 오해받는다는 억울함이 담겨 있어요.","hl":"mn"},{"n":24,"text":"첫 번째로 because는 이유를 이끄는 접속사예요. because 뒤에는 주어와 동사가 있는 절이 통째로 와서 이유를 설명하죠. 두 번째로 on my skin은 전치사구인데, 앞에 있는 many spots를 뒤에서 꾸며 주는 역할을 해요. 전치사구는 명사 뒤에서 꾸민다고 기억해 두면 되고, 그래서 '내 껍질에 있는 많은 점'이라는 의미가 만들어지는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 생각해\u003c/span>\u003cspan class=\"en\">People think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 맛없다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">tasteless\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 내가 맛없다고 생각해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 겉모습만 보고 성급하게 \u003cb class=\"key\">판단\u003c/b>하고 있다는 것을 알려 주는 문장이에요. 점이 많으니 \u003cb class=\"key\">맛\u003c/b>도 없을 거라고 단정하는 것이죠. 그래서 다음 문장에서 곧바로 \u003cb class=\"key\">반박\u003c/b>이 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(think의 목적어)\u003c/span> : think + that + [[주어]] + [[동사]] (that절이 동사의 목적어) : \"내가 맛없다고\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"People think, 사람들은 생각해. that I'm tasteless, 내가 맛없다고. 이 문장 전체를 해석하면, 사람들은 내가 맛없다고 생각해.","hl":"m"},{"n":26,"text":"이 문장은 사람들이 사과를 겉모습만 보고 판단한다는 걸 보여 줘요. 점이 많으니까 맛도 없을 거라고 쉽게 단정하는 거죠. 그래서 바로 다음 문장에서 그 생각을 뒤집는 반박이 나올 수밖에 없어요.","hl":"mn"},{"n":27,"text":"여기서 that은 '저것'이라는 뜻이 아니라 뒤에 오는 문장을 묶어 주는 접속사예요. think 뒤에 that절이 통째로 와서 무엇을 생각하는지, 즉 목적어 역할을 하죠. 이때 that은 해석하지 않는다는 게 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">틀렸어!\u003c/span>\u003cspan class=\"en\">are wrong!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 틀렸어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 사람들이 가진 생각을 정면으로 부정하는 짧고 강한 문장이에요. \u003cb class=\"key\">They\u003c/b>가 사람들을 가리키며 사과의 자신감을 드러내죠. 이 한마디로 앞의 \u003cb class=\"key\">편견\u003c/b>이 무너집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인칭대명사의 문맥 지칭\u003c/span> : They = 앞 문장의 [[People]] (복수 명사를 받는 [[지칭]]) : \"그들은\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They, 그들은. are wrong!, 틀렸어!. 이 문장 전체를 해석하면, 그들은 틀렸어!","hl":"m"},{"n":29,"text":"사람들이 가진 생각을 정면으로 부정하는 아주 짧고 힘 있는 문장이에요. 앞에서 나온 사람들을 그대로 받아서, 그 판단이 틀렸다고 사과가 자신 있게 외치는 거죠. 이 한마디로 앞에 있던 편견이 시원하게 깨집니다.","hl":"mn"},{"n":30,"text":"여기서 They는 앞 문장에 나온 People을 가리키는 대명사예요. 같은 단어를 또 쓰지 않고 대명사로 받아 주는 이 지칭 관계를 꼭 잡아야 해요. 그리고 be동사 are 뒤에 형용사 wrong이 와서 '틀린 상태'를 말해 주는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 점은\u003c/span>\u003cspan class=\"en\">My spots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해롭지 않아.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">harmful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 점은 해롭지 않아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 자신의 점이 해롭지 않다고 말하며, 외모 때문에 맛없다고 생각하는 사람들의 오해를 반박하는 문장입니다. 앞에서 사람들이 자기가 맛없다고 생각한다고 했으므로, 점은 \u003cb class=\"key\">해롭지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 사실로 \u003cb class=\"key\">오해\u003c/b>를 깨려는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : [주어 My spots] + [be동사 are] + not + [형용사 harmful (주격보어)] : \"해롭지 않다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"My spots, 내 점은. are not harmful, 해롭지 않아.. 이 문장 전체를 해석하면, 내 점은 해롭지 않아.","hl":"m"},{"n":32,"text":"사과는 자기 점이 해롭지 않다고 말하면서 사람들의 오해를 깨려고 해요. 앞에서 사람들이 자기가 맛없다고 생각한다고 했죠. 그래서 점 때문에 맛이나 건강을 의심할 필요가 없다는 뜻을 전하는 문장이에요.","hl":"mn"},{"n":33,"text":"are not harmful은 be동사 are 뒤에 not이 붙어 부정을 만든 표현이에요. 주어 My spots의 상태를 설명하는 문장이죠. 그래서 '내 점은 해롭지 않아'라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">taste \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훌륭해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">great\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 맛이 훌륭해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 자신의 맛이 훌륭하다고 강조하며, 겉모습과 달리 맛에는 문제가 없다고 주장하는 문장입니다. 앞의 '내 점은 해롭지 않아'에 이어, \u003cb class=\"key\">외모\u003c/b>가 아니라 \u003cb class=\"key\">맛\u003c/b>으로 자신의 가치를 보라는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사(주격보어)\u003c/span> : [주어 I] + [감각동사 taste] + [형용사 great (주격보어)] : \"맛이 훌륭하다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I, 나는. taste, 맛이. great, 훌륭해.. 이 문장 전체를 해석하면, 나는 맛이 훌륭해.","hl":"m"},{"n":35,"text":"사과는 자기 맛이 훌륭하다고 말하면서 겉모습과 상관없이 맛은 좋다고 강조해요. 앞에서 점이 해롭지 않다고 한 데 이어, 이번에는 외모가 아니라 맛으로 자기를 봐 달라는 흐름이에요.","hl":"mn"},{"n":36,"text":"여기서 taste는 '맛이 나다'라는 감각동사예요. 감각동사 뒤에는 형용사가 와서 주어의 상태를 설명하죠. 그래서 great이 '훌륭하게'가 아니라 '훌륭한'의 의미로 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">키위:\u003c/span>\u003cspan class=\"en\">Kiwi:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둥글다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">round \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 작아.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">small\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">키위: 나는 둥글지만 아주 작아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 키위가 자신은 둥글지만 크기가 아주 작다고 소개하며, 이어질 크기 콤플렉스를 드러내는 문장입니다. but으로 \u003cb class=\"key\">둥글다\u003c/b>는 특징과 \u003cb class=\"key\">작다\u003c/b>는 특징을 대조해, 자신의 고민을 자연스럽게 꺼냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 축약형\u003c/span> : [주어 I] + [be동사 am] → [I'm] : \"나는 ~이다, 나는 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [형용사 round] + but + [형용사 very small] : \"둥글지만 아주 작다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Kiwi, 키위:. I'm, 나는. round, 둥글다. but, 하지만. very small, 아주 작아.. 이 문장 전체를 해석하면, 키위: 나는 둥글지만 아주 작아.","hl":"m"},{"n":38,"text":"키위는 자기가 둥글지만 아주 작다고 말해요. 둥글다는 특징보다 작다는 점을 문제로 삼는 거죠. 이 말이 앞으로 농부들이 자기 크기 때문에 팔지 않는다는 내용으로 이어지는 실마리가 됩니다.","hl":"mn"},{"n":39,"text":"먼저 I'm은 I am이 줄어든 축약형이에요. 주어 I에 맞는 be동사 am이 쓰였죠. 다음으로 but은 대조를 나타내는 등위접속사로, 둥글다와 아주 작다라는 두 형용사를 연결해요. 그래서 두 특징이 병렬로 이어지면서 '둥글지만 아주 작아'라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들은 원하지 않아\u003c/span>\u003cspan class=\"en\">Farmers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 팔기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 크기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">size\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">농부들은 내 크기 때문에 나를 팔고 싶어 하지 않아 해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 키위가 자신이 아주 작다는 점을 말한 뒤, 농부들이 \u003cb class=\"key\">크기\u003c/b> 때문에 자기를 팔려고 하지 않는다고 이야기하는 부분이에요. 여기서 크기는 키위가 겪는 문제의 핵심이고, 다음 문장에서 크기가 무슨 상관이냐고 되묻는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">want + to부정사(목적어)의 부정\u003c/span> : don't want + [to sell (to부정사구/목적어)] : \"팔고 싶어 하지 않아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">because of + 명사(전치사구)\u003c/span> : because of + [my size (명사구)] : \"내 크기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Farmers don't want, 농부들은 원하지 않아. to sell me, 나를 팔기를. because of my size, 내 크기 때문에. 이 문장 전체를 해석하면, 농부들은 내 크기 때문에 나를 팔고 싶어 하지 않아 해.","hl":"m"},{"n":41,"text":"이 문장은 키위가 자신이 아주 작다는 점을 말한 뒤, 농부들이 크기 때문에 자기를 팔려고 하지 않는다고 이야기하는 부분이에요. 여기서 크기는 키위가 겪는 문제의 핵심이고, 다음 문장에서 크기가 무슨 상관이냐고 되묻는 문제 제기의 근거가 됩니다.","hl":"mn"},{"n":42,"text":"첫 번째로, want는 목적어로 to부정사를 취하는 동사예요. 그래서 want to sell처럼 쓰고, 부정할 때는 don't want to sell처럼 조동사 부정으로 want 앞에 don't를 둡니다. 두 번째로, because of는 전치사구라서 뒤에 명사구 my size가 와요. because 뒤에는 절이 오지만 because of 뒤에는 명사구가 온다는 차이를 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 신경 쓰겠어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Who \u003c/span>\u003cspan class=\"tgt\">cares\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크기에 대해?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">size\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">크기가 무슨 상관이야?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 키위가 크기가 무슨 상관이냐고 되묻는 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이에요. 크기가 중요하지 않다는 키위의 주장을 강하게 드러내며, 다음 문장에서 자신이 달콤하고 맛있다고 말하는 \u003cb class=\"key\">근거\u003c/b>로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 who가 주어인 의문문\u003c/span> : [Who (의문사/주어)] + [cares (동사)] : \"누가 신경 쓰겠어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about + 명사\u003c/span> : care about + [size (명사)] : \"크기에 대해 신경 쓰다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Who cares, 누가 신경 쓰겠어. about size?, 크기에 대해?. 이 문장 전체를 해석하면, 크기가 무슨 상관이야?","hl":"m"},{"n":44,"text":"이 문장은 키위가 크기가 무슨 상관이냐고 되묻는 수사 의문문이에요. 크기가 중요하지 않다는 주장을 강하게 드러내고, 다음 문장에서 자신이 달콤하고 맛있다고 말하는 근거로 이어집니다.","hl":"mn"},{"n":45,"text":"첫 번째로, who가 문장의 주어로 쓰이면 의문문이라도 do를 넣지 않고 동사 cares를 바로 뒤에 둬요. 주어가 who일 때 동사는 단수형 cares가 됩니다. 두 번째로, care about은 무엇에 대해 신경 쓰다는 뜻의 숙어예요. 여기서는 크기를 문제 삼지 말자는 반문으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 달콤해\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sweet \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 맛있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">delicious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 달콤하고 맛있는걸.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 키위가 크기 대신 자신의 장점인 맛을 내세우는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 앞에서 크기가 무슨 상관이냐고 반문한 뒤, 자신이 달콤하고 맛있다는 \u003cb class=\"key\">근거\u003c/b>를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 병렬\u003c/span> : [sweet (형용사)] + and + [delicious (형용사)] : \"달콤하고 맛있는\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"I'm sweet, 나는 달콤해. and delicious, 그리고 맛있어. 이 문장 전체를 해석하면, 나는 달콤하고 맛있는걸.","hl":"m"},{"n":47,"text":"이 문장은 키위가 크기 대신 자신의 장점인 맛을 내세우는 결론이에요. 앞에서 크기가 무슨 상관이냐고 반문한 뒤, 자신이 달콤하고 맛있다는 근거를 제시합니다.","hl":"mn"},{"n":48,"text":"먼저, and가 두 형용사 sweet과 delicious를 병렬로 연결해요. 그래서 달콤하고 맛있는처럼 두 성질을 함께 말할 수 있습니다. 이 표현은 be동사 I'm 뒤의 주격 보어로 쓰여 키위의 성질을 설명합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우스꽝스럽게 생긴 과일과 채소를 위한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">시장\u003c/b>에서 과일들이 서로 인사를 나누고 이야기를 시작합니다.\u003c/li>\u003cli>사과는 껍질의 \u003cb class=\"key\">점\u003c/b> 때문에 사람들이 자신을 맛없다고 생각하지만, 점은 해롭지 않고 자신은 맛이 훌륭하다고 반박합니다.\u003c/li>\u003cli>키위는 \u003cb class=\"key\">크기\u003c/b> 때문에 농부들이 자신을 팔고 싶어 하지 않지만, 크기가 무슨 상관이냐고 되묻습니다.\u003c/li>\u003cli>결국 두 과일 모두 겉모습이 아니라 실제 \u003cb class=\"key\">맛\u003c/b>이 중요하다는 메시지를 전합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Appearance such as spots or size does not determine how good fruits and vegetables taste.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장에서 사과와 키위가 각자의 사연을 이야기합니다. 둘 다 \u003cb class=\"key\">껍질의 \u003c/b>\u003cb class=\"key\">점\u003c/b>이나 \u003cb class=\"key\">크기\u003c/b> 같은 겉모습 때문에 맛없다고 여겨지지만, 실제로는 \u003cb class=\"key\">해롭지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 맛이 훌륭하다고 말합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 글의 핵심은 아주 단순해요. 점이 있든 크기가 작든 겉모습은 맛과 상관이 없다는 거죠. 사과와 키위의 말처럼, 우리도 겉모습만 보고 판단하는 습관을 한 번쯤 돌아봐야 합니다. 긴 문장은 because와 because of 뒤의 이유를 표시하며 다시 한 번 소리 내어 읽어 보세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
