<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"7과 본문2","audioDir":"2_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 ybm(박)\u003c/div>\u003ch1>Odd but Fresh: The Story of Unusual Fruits and Vegetables\u003c/h1>\u003ch2>못생겨도 신선한, 모양 다른 과일과 채소 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>당근은 돌을 피하다 생긴 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">다리\u003c/b>와 포크 같은 뿌리를 소개하며 자신이 \u003cb class=\"key\">신선\u003c/b>하고 건강에 좋은 주스를 만든다고 말해요. 사과가 우리 같은 과일과 채소를 더 만나고 싶어 하자, 키위는 너무 \u003cb class=\"key\">휘어진 \u003c/b>\u003cb class=\"key\">가지\u003c/b>는 사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>를 좋아해 슈퍼마켓에서 팔지 않는다고 답해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Odd-shaped fruits and vegetables can still be fresh and healthy, but people often prefer straight-looking produce, so supermarkets do not sell bent ones.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 모양은 조금 이상하지만 아주 신선한 과일과 채소들에 관한 지문을 함께 읽어 볼게요. 세 다리 당근과 휘어진 가지가 등장하는 재미있는 대화문이에요. 이 글의 요지는 겉모양이 특이해도 신선하고 건강에 좋은 농산물이 있으며, 사람들이 곧은 모양을 좋아해서 그런 농산물이 판매되지 않을 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">농산물의 겉모양을 중요하게 여기는 소비 기준을 \u003cb class=\"key\">cosmetic \u003c/b>\u003cb class=\"key\">standards\u003c/b>라고 해요. 당근의 뿌리가 갈라지거나 가지가 휘는 것은 돌이나 토양 조건 때문에 자연스럽게 생기는 \u003cb class=\"key\">생육 \u003c/b>\u003cb class=\"key\">차이\u003c/b>예요. 이렇게 모양이 고르지 않은 농산물을 \u003cb class=\"key\">ugly \u003c/b>\u003cb class=\"key\">produce\u003c/b> 또는 못난이 농산물이라고 부르는데, 맛과 영양은 오히려 좋은 경우가 많아요. 마치 모양이 조금 이상한 빵이라도 속재료와 맛은 훌륭할 수 있는 것과 비슷하죠. 그래서 외형 기준만으로 판매를 거르면 \u003cb class=\"key\">food \u003c/b>\u003cb class=\"key\">waste\u003c/b>가 늘고 농민의 손실도 커질 수 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 짚어 볼게요. 농산물의 겉모양을 중요하게 여기는 소비 기준을 cosmetic standards라고 해요. 당근의 뿌리가 갈라지거나 가지가 휘는 것은 돌이나 토양 조건 때문에 생기는 자연스러운 생육 차이예요. 이렇게 모양이 고르지 않은 농산물을 ugly produce 또는 못난이 농산물이라고 부르는데, 맛과 영양은 오히려 좋은 경우가 많아요. 모양이 조금 이상한 빵이라도 속재료와 맛은 훌륭할 수 있는 것과 비슷하죠. 그래서 외형 기준만으로 판매를 거르면 food waste가 늘고 농민의 손실도 커질 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>당근의 자기소개\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>당근은 자신의 다리가 세 개인 것을 보이면서 \u003cb class=\"key\">우스꽝스러운 \u003c/b>\u003cb class=\"key\">모양\u003c/b>을 먼저 꺼내요. 그 뿌리가 포크처럼 생긴 이유는 땅속에서 \u003cb class=\"key\">돌을 \u003c/b>\u003cb class=\"key\">피하려\u003c/b> 한 결과라고 설명해요. 모양은 이상해도 자신은 \u003cb class=\"key\">신선\u003c/b>하고 건강에 좋은 주스를 만든다고 강조하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사과의 질문\u003csmall>질문 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>사과는 모두 만나서 반갑다고 인사한 뒤, 우리와 같은 더 많은 \u003cb class=\"key\">과일과 \u003c/b>\u003cb class=\"key\">채소\u003c/b>를 만나고 싶다고 말해요. 그리고 그런 친구를 \u003cb class=\"key\">아는지\u003c/b> 묻으며 대화를 다음 단계로 넘겨요. 이 질문이 다른 예를 끌어내는 \u003cb class=\"key\">전환\u003c/b> 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>키위의 가지 제안\u003csmall>답변 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>키위는 사과의 질문에 \u003cb class=\"key\">가지를 \u003c/b>\u003cb class=\"key\">제안\u003c/b>하며 답해요. 그러면서 어떤 가지들은 너무 많이 \u003cb class=\"key\">휘어 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 구체적인 예를 들어요. 이는 모양이 고르지 않은 채소가 실제로 있다는 \u003cb class=\"key\">예시\u003c/b>가 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>판매되지 않는 이유\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 슈퍼마켓은 휘어진 가지를 팔지 않는다는 사실이 나와요. 그 이유는 사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>를 좋아하기 때문이에요. 결국 소비자의 \u003cb class=\"key\">외형 \u003c/b>\u003cb class=\"key\">선호\u003c/b>가 못난이 농산물의 판매를 막는다는 핵심이 드러나죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 당근의 자기소개예요. 당근은 자신의 다리가 세 개인 것을 보이면서 우스꽝스러운 모양을 먼저 꺼내요. 그 뿌리가 포크처럼 생긴 이유는 땅속에서 돌을 피하려 한 결과라고 설명하죠. 모양은 이상해도 자신은 신선하고 건강에 좋은 주스를 만든다고 강조해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 사과가 질문을 던져요. 사과는 모두 만나서 반갑다고 인사한 뒤, 우리와 같은 더 많은 과일과 채소를 만나고 싶다고 말해요. 그리고 그런 친구를 아는지 묻으며 대화를 다음 단계로 넘기죠. 이 질문이 다른 예를 끌어내는 전환 역할을 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 키위의 답변이에요. 키위는 사과의 질문에 가지를 제안하며 답해요. 그러면서 어떤 가지들은 너무 많이 휘어 있다고 구체적인 예를 들어요. 이는 모양이 고르지 않은 채소가 실제로 있다는 예시가 돼요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 판매되지 않는 이유가 나와요. 슈퍼마켓은 휘어진 가지를 팔지 않는다는 사실이 나오고, 그 이유는 사람들이 곧은 가지를 좋아하기 때문이에요. 결국 소비자의 외형 선호가 못난이 농산물의 판매를 막는다는 핵심이 드러나죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 당근의 예시로 시작해 사과의 질문과 키위의 답변으로 이어지는 \u003cb class=\"key\">질문-답변\u003c/b> 구조예요. 앞부분에서는 세 다리 당근처럼 모양이 특이해도 신선하다는 사례를 보여 주고, 마지막 문장에서 사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>를 좋아해 휘어진 가지가 팔리지 않는다는 점을 밝혀요. 핵심 내용이 끝에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있고, 주제문은 열 번째 문장이에요. 그래서 글의 중심은 단순한 소개가 아니라 \u003cb class=\"key\">외형 \u003c/b>\u003cb class=\"key\">선호\u003c/b>가 판매를 결정한다는 데 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (2)\u003c/b>\u003cspan>이유\u003c/span>\u003cb>Do you know any? (7)\u003c/b>\u003cspan>질문\u003c/span>\u003cb>How about (8)\u003c/b>\u003cspan>제안·답변\u003c/span>\u003cb>too much (9)\u003c/b>\u003cspan>정도 강조\u003c/span>\u003cb>because (10)\u003c/b>\u003cspan>이유·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">look funny\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">three legs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">like a fork\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bent too much\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">straight eggplants\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>휘어진 가지\u003c/th>\u003cth>곧은 가지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사람들이 선호하지 않음\u003c/td>\u003ctd>사람들이 선호함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>슈퍼마켓에서 팔지 않음\u003c/td>\u003ctd>슈퍼마켓에서 판매됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 당근의 예시로 시작해 사과의 질문과 키위의 답변으로 이어지는 질문과 답변 구조예요. 앞부분에서는 세 다리 당근처럼 모양이 특이해도 신선하다는 사례를 보여 주고, 마지막 문장에서 사람들이 곧은 가지를 좋아해 휘어진 가지가 팔리지 않는다는 점을 밝혀요. 핵심 내용이 끝에 나오므로 미괄식으로 볼 수 있고, 주제문은 열 번째 문장이에요. 그래서 글의 중심은 단순한 소개가 아니라 외형 선호가 판매를 결정한다는 데 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장과 열 번째 문장에 because가 나와요. 두 번째 문장에서는 뿌리가 포크 같아서 우스꽝스러워 보인다는 이유를 말하고, 열 번째 문장에서는 사람들이 곧은 가지를 좋아한다는 판매 거절의 이유를 밝히죠. 일곱 번째 문장의 Do you know any는 질문을, 여덟 번째 문장의 How about은 제안과 답변을 이끌어요. 또 휘어진 가지와 곧은 가지처럼 모양을 대조하는 표현을 통해 글의 핵심이 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leg\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다리\u003c/span>\u003c/div>\u003cdiv>\u003cb>look\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>funny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>우스꽝스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>root\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뿌리\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~처럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>fork\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포크\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\ 니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당근이 자신의 \u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">개\u003c/b>를 보여 주며 ‘보이니?’라고 묻는 장면이에요. 채소에게 사람의 말과 감정을 부여한 \u003cb class=\"key\">의인화\u003c/b> 표현으로, 앞으로 여러 채소가 자신의 특징을 소개하는 글의 시작을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : see + [that + 주어 + 동사 ~ (명사절/목적어)] : \"내가 다리 세 개를 가지고 있다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Carrot: Do you see, 당근: 보이니?. that I have three legs?, 내가 다리 세 개를 가지고 있다는 것을?. 이 문장 전체를 해석하면, 당근: 내 다리가 세 개인 것이 보이니?","hl":"m"},{"n":13,"text":"이 문장은 당근이 자신의 다리 세 개를 보여 주며 보이니 하고 묻는 장면이에요. 채소에게 사람처럼 말하게 한 의인화 표현이죠. 그래서 당근이 친근하게 질문하는 느낌으로 읽으면 좋아요.","hl":"mn"},{"n":14,"text":"첫 번째로, Do you see 뒤에 that I have three legs가 이어져요. 여기서 that은 접속사로 명사절을 만들고, 그 절 전체가 see의 목적어 역할을 해요. 그래서 내가 다리 세 개를 가지고 있다는 것을 보이니라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 우스꽝스러워 보여\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">funny\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 내 뿌리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">roots \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포크처럼 생겼기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fork\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 뿌리가 포크처럼 생겼기 때문에 나는 우스꽝스러워 보여.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당근이 자신의 \u003cb class=\"key\">우스꽝스러운 \u003c/b>\u003cb class=\"key\">모양\u003c/b>의 이유를 \u003cb class=\"key\">뿌리\u003c/b>로 설명하는 문장이에요. 뿌리가 \u003cb class=\"key\">포크\u003c/b>처럼 갈라져 보여서 다리 세 개처럼 보인다는 뜻으로, 앞 문장의 질문에 이유를 덧붙여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사(주격보어)\u003c/span> : look + [형용사 (주격보어)] : \"우스꽝스러워 보이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because의 부사절\u003c/span> : [주어 + 동사 ~ + because + 주어 + 동사 ~ (이유 부사절)] : \"내 뿌리가 포크처럼 생겼기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I look funny, 나는 우스꽝스러워 보여. because my roots, 왜냐하면 내 뿌리가. are like a fork, 포크처럼 생겼기 때문에. 이 문장 전체를 해석하면, 내 뿌리가 포크처럼 생겼기 때문에 나는 우스꽝스러워 보여.","hl":"m"},{"n":16,"text":"이 문장은 당근이 왜 우스꽝스러운 모양인지 설명해요. 뿌리가 포크처럼 갈라져 있어서 그렇게 보인다는 뜻이에요.","hl":"mn"},{"n":17,"text":"첫 번째로, look funny에서 look은 감각동사로 쓰여 뒤에 형용사 funny가 와요. 그래서 우스꽝스러워 보인다고 해석해요. 두 번째로, because는 이유를 이끄는 접속사이고 뒤에 my roots are like a fork라는 부사절을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그저 시도했어\u003c/span>\u003cspan class=\"en\">I just \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌을 피하려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid\u003c/span> stones\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅속에 있는\u003c/span>\u003cspan class=\"en\">in the ground\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자랐어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">grew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다리 세 개로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">legs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그저 땅속에서 돌을 피하려 했는데 다리가 세 개로 자랐어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당근이 자신의 세 다리가 \u003cb class=\"key\">돌\u003c/b>을 피하려다 생긴 결과라고 설명하는 문장이에요. 땅속에서 \u003cb class=\"key\">돌\u003c/b>을 피하려고 애쓰는 과정에서 뿌리가 갈라져 \u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">개\u003c/b>처럼 자랐다는 뜻이에요. 앞 문장의 우스꽝스러운 겉모습에 대한 이유를 더 구체적으로 말해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : try + [to + 동사원형 (to부정사구/목적어)] : \"피하려고 노력했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬(and)\u003c/span> : [tried to avoid ...] and [grew ...] : \"그리고 다리 세 개로 자랐다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I just tried, 나는 그저 시도했어. to avoid stones, 돌을 피하려고. in the ground, 땅속에 있는. and grew, 그리고 자랐어. three legs, 다리 세 개로. 이 문장 전체를 해석하면, 나는 그저 땅속에서 돌을 피하려 했는데 다리가 세 개로 자랐어.","hl":"m"},{"n":19,"text":"당근이 돌을 피하려고 애쓰는 과정에서 뿌리가 갈라져 다리 세 개처럼 자랐다고 말해요. 그래서 앞에서 말한 우스꽝스러운 모양의 이유가 더 구체적으로 드러나요.","hl":"mn"},{"n":20,"text":"첫 번째로, tried to avoid에서 to avoid는 tried의 목적어로 쓰인 to부정사예요. try to 다음에는 동사원형이 와서 피하려고 노력하다라고 해석해요. 두 번째로, and grew three legs에서 and가 tried와 grew를 이어 주는 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 신선하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">fresh\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 ~을 만들어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강에 좋은 주스를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">healthy \u003c/span>\u003cspan class=\"tgt\">juice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 신선하고, 건강에 좋은 주스를 만들어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당근이 자기 장점을 소개하는 문장이에요. 겉모습은 세 갈래라 우스꽝스러워도 \u003cb class=\"key\">신선함\u003c/b>이라는 장점과 \u003cb class=\"key\">건강에 \u003c/b>\u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">주스\u003c/b>를 만든다는 장점을 함께 내세우고 있죠. and로 두 장점을 나란히 묶어 강조한 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식(주어 + be동사 + 주격보어)\u003c/span> : 주어 + be동사 + [형용사(주격보어)] : \"나는 신선하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(서술어의 연결)\u003c/span> : [am + 형용사] and [make + 목적어] : \"그리고 건강에 좋은 주스를 만들어\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I'm fresh, 나는 신선하고. and make, 그리고 ~을 만들어요. healthy juice, 건강에 좋은 주스를. 이 문장 전체를 해석하면, 나는 신선하고, 건강에 좋은 주스를 만들어.","hl":"m"},{"n":22,"text":"이 문장은 당근이 자기 자랑을 하는 부분이에요. 겉모습은 세 갈래라 우스꽝스럽지만, 신선함이라는 장점과 건강에 좋은 주스를 만든다는 장점을 함께 말하고 있죠. 두 장점을 and로 나란히 묶어서 강조한 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 I'm fresh를 보세요. be동사 am 뒤에 형용사 fresh가 와서 주어의 상태를 설명하는 주격보어 역할을 해요. be동사는 주어를 설명하는 2형식 동사라는 점을 기억해 두세요. 두 번째로 and make healthy juice에서 and가 앞의 I'm fresh와 뒤의 동사구를 대등하게 이어 주는 병렬 구조예요. 같은 주어 I를 두 서술어가 함께 쓰고 있다는 것도 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과:\u003c/span>\u003cspan class=\"en\">Apple:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 기뻐요\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">glad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너희 모두를 만나서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사과: 모두 만나서 반가워!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 친구들에게 처음 인사하는 대사예요. 반갑다는 감정을 먼저 말하고, 그 감정의 이유를 to see you all로 덧붙이고 있죠. 앞의 등장인물 소개를 이어 받아 대화를 시작하는 \u003cb class=\"key\">도입부\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : [감정 형용사] + to + 동사원형 : \"너희 모두를 만나서 기쁜\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인칭대명사 + all(전체 강조)\u003c/span> : you + all = '너희 모두' : \"너희 모두\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Apple, 사과:. I'm glad, 나는 기뻐요. to see you all!, 너희 모두를 만나서. 이 문장 전체를 해석하면, 사과: 모두 만나서 반가워!","hl":"m"},{"n":25,"text":"사과가 처음 등장해서 친구들에게 인사하는 대사예요. 만나서 반갑다는 감정을 먼저 말하고, 그 기쁨의 이유를 to see you all로 덧붙이고 있죠. 전체 대화를 여는 도입부 역할을 하는 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 glad to see you all을 보세요. 감정을 나타내는 형용사 glad 뒤에 to부정사가 와서 그 감정의 원인을 설명해요. 이렇게 감정 형용사 뒤에 오는 to부정사는 원인을 나타내는 부사적 용법이에요. 두 번째로 you all은 '너희 모두'라는 뜻으로, 인칭대명사 you 뒤에 all이 붙어 전체를 강조하는 표현이에요. see의 목적어 자리라서 목적격 you가 쓰였다는 점도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만나고 싶어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 과일과 채소들을\u003c/span>\u003cspan class=\"en\">more fruits and vegetables\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 우리와 같은 더 많은 과일과 채소들을 만나고 싶어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 자기처럼 생긴 친구를 더 만나고 싶다며 이야기를 다음 단계로 넘기는 핵심 문장이에요. like us가 '우리와 같은'이라는 뜻으로 앞의 과일과 채소를 꾸며 주죠. 이 말 덕분에 바로 뒤에서 키위가 가지를 추천하는 \u003cb class=\"key\">계기\u003c/b>가 마련돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to + 동사원형(목적어)] : \"만나고 싶다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like + 목적격\u003c/span> : 명사 + like + [목적격] : \"우리와 같은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I want to meet, 나는 만나고 싶어요. more fruits and vegetables, 더 많은 과일과 채소들을. like us, 우리와 같은. 이 문장 전체를 해석하면, 나는 우리와 같은 더 많은 과일과 채소들을 만나고 싶어.","hl":"m"},{"n":28,"text":"사과가 자기처럼 생긴 친구를 더 만나고 싶다고 말하면서 이야기를 다음 단계로 넘기는 문장이에요. 여기서 like us가 '우리와 같은'이라는 뜻으로 앞에 나온 과일과 채소를 꾸며 주죠. 바로 이 말이 뒤에서 키위가 가지를 추천하는 계기가 돼요.","hl":"mn"},{"n":29,"text":"첫 번째로 want to meet을 보세요. want는 목적어로 to부정사를 데리고 와서 '만나고 싶다'라는 뜻을 만들어요. 이때 to부정사는 명사처럼 목적어 자리에 쓰인 명사적 용법이에요. 두 번째로 like us에서 like는 동사가 아니라 '~와 같은'이라는 뜻의 전치사이고, 전치사 뒤에는 목적격 us가 와요. 앞에 있는 more fruits and vegetables를 like us가 뒤에서 꾸며 준다는 어순도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 알고 있니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것(사람)이라도?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너 아는 친구 있니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 &quot;우리 같은 더 많은 과일과 채소를 만나고 싶다&quot;고 말한 뒤, 상대에게 \u003cb class=\"key\">아는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 있는지 물어보는 문장이에요. 여기서 any는 앞에 나온 fruits and vegetables를 다시 말하지 않고 받아 주는 \u003cb class=\"key\">대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문(do/does/did)\u003c/span> : Do + [주어] + [동사원형] ~? : \"너는 ~을 아니?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 any\u003c/span> : any + (앞에 나온 복수명사를 대신함) : \"어떤 것(사람)이든\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Do you know, 너는 알고 있니. any?, 어떤 것(사람)이라도?. 이 문장 전체를 해석하면, 너 아는 친구 있니?","hl":"m"},{"n":31,"text":"사과가 더 많은 과일과 채소를 만나고 싶다고 했죠. 그래서 여기서는 너 아는 사람이 있냐고 묻는 거예요. any는 앞에 나온 fruits and vegetables를 대신하는 대명사랍니다.","hl":"mn"},{"n":32,"text":"첫 번째로 Do you know, 일반동사 의문문이에요. 일반동사 know를 의문문으로 만들 때는 조동사 do를 주어 앞에 보내고 동사는 원형으로 써요. 두 번째로 any는 대명사로, 앞에 나온 fruits and vegetables를 반복하지 않고 받아 주는 말이에요. 의문문에서는 some 대신 any를 쓴다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">키위:\u003c/span>\u003cspan class=\"en\">Kiwi:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~은 어때?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지들은?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eggplants\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">키위: 가지들은 어때?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과가 아는 과일이나 채소를 묻자, 키위가 가지를 추천하며 \u003cb class=\"key\">제안\u003c/b>하는 장면이에요. How about ~?은 상대에게 가볍게 무엇을 권할 때 쓰는 표현이죠. eggplants는 셀 수 있는 명사라서 여러 개를 가리키는 \u003cb class=\"key\">복수형\u003c/b>으로 썼어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현 How about ~?\u003c/span> : How about + [명사/동명사]? : \"~은 어때?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">셀 수 있는 명사의 복수형\u003c/span> : [가산명사] + -s : \"가지들\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Kiwi, 키위:. How about, ~은 어때?. eggplants?, 가지들은?. 이 문장 전체를 해석하면, 키위: 가지들은 어때?","hl":"m"},{"n":34,"text":"사과가 아는 과일이나 채소가 있냐고 물었죠. 키위가 가지를 추천하면서 가지들은 어때 하고 제안하는 장면이에요. How about은 상대에게 가볍게 제안할 때 쓰는 표현이랍니다.","hl":"mn"},{"n":35,"text":"첫 번째로 How about, 제안할 때 쓰는 관용표현이에요. about 뒤에는 명사나 동명사가 오고, 여기서는 명사 eggplants가 왔어요. 두 번째로 eggplants, eggplant는 셀 수 있는 명사라서 여러 개를 말할 때 복수형으로 써요. 이렇게 복수형은 가지라는 채소 종류 전체를 총칭할 때도 쓰인답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 가지들은\u003c/span>\u003cspan class=\"en\">Some eggplants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휘어져 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">bent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 가지들은 너무 많이 휘어 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가지들 가운데 일부가 심하게 휘어 있다는 뜻이에요. be동사 뒤에 과거분사가 와서 '휘어진 상태'를 나타내는 \u003cb class=\"key\">수동태\u003c/b> 문장이죠. 이 문장은 다음에 나오는 &quot;사람들이 곧은 가지를 좋아해서 슈퍼마켓이 팔지 않는다&quot;는 내용의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : [주어] + be + [과거분사] : \"휘어져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정도 부사구 too much\u003c/span> : [동사] + too much : \"너무 많이\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Some eggplants, 어떤 가지들은. are bent, 휘어져 있어. too much, 너무 많이.. 이 문장 전체를 해석하면, 어떤 가지들은 너무 많이 휘어 있어.","hl":"m"},{"n":37,"text":"가지들 중에 일부가 너무 심하게 휘어 있다는 뜻이에요. 바로 뒤에 나오는 슈퍼마켓이 왜 그런 가지를 팔지 않는지 설명해 주는 근거가 되는 문장이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 are bent, 수동태예요. be동사 뒤에 과거분사 bent를 두면 휘어진 상태를 나타낼 수 있어요. 두 번째로 too much, 정도가 지나치다는 뜻을 더해 주는 부사구예요. 휘어진 정도가 지나치다는 걸 알려 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슈퍼마켓은\u003c/span>\u003cspan class=\"en\">Supermarkets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 팔지 않아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 사람들이 좋아하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧은 가지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">straight \u003c/span>\u003cspan class=\"tgt\">eggplants\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 곧은 가지를 좋아하기 때문에 슈퍼마켓은 그들을 팔지 않아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 슈퍼마켓이 가지를 팔지 않는 \u003cb class=\"key\">이유\u003c/b>를 밝히는 문장이에요. 키위가 가지를 제안했지만, 사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>만 좋아하기 때문에 휘어진 가지는 판매되지 않는다는 흐름을 보여 줍니다. 결국 모양이 다른 채소들도 사람들의 취향 앞에서 설 자리가 없다는 \u003cb class=\"key\">문제\u003c/b>를 드러내는 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제 부정문\u003c/span> : [주어 Supermarkets] + don't + [동사원형 sell] + [목적어 them] : \"팔지 않아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사(목적격)\u003c/span> : them = 앞에 나온 복수명사 eggplants를 가리키는 목적격 대명사 : \"그들(가지들)을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [주어 people + 동사 like + 목적어 straight eggplants] : \"왜냐하면 사람들이 곧은 가지를 좋아하기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Supermarkets, 슈퍼마켓은. don't sell them, 그들을 팔지 않아. because people like, 왜냐하면 사람들이 좋아하기 때문에. straight eggplants, 곧은 가지를. 이 문장 전체를 해석하면, 사람들이 곧은 가지를 좋아하기 때문에 슈퍼마켓은 그들을 팔지 않아.","hl":"m"},{"n":40,"text":"이 문장은 슈퍼마켓이 가지를 팔지 않는 이유를 밝히는 문장이에요. 키위가 가지를 제안했지만, 사람들이 곧은 가지만 좋아하기 때문에 휘어진 가지는 팔리지 않는다는 흐름이죠. 결국 모양이 다른 채소들도 사람들의 취향 때문에 설 자리가 없다는 문제를 드러내는 대목이에요.","hl":"mn"},{"n":41,"text":"어법 포인트는 세 가지예요. 첫 번째, 주어가 복수니까 don't를 쓰고 뒤에는 동사원형 sell이 와요. 두 번째, them은 앞에 나온 eggplants를 가리키는 지시대명사예요. 세 번째, because 뒤에는 주어와 동사가 다 있는 완전한 절이 와서 이유를 설명해 준다는 점, 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>당근은 세 다리와 포크 같은 뿌리를 보이며 \u003cb class=\"key\">돌을 \u003c/b>\u003cb class=\"key\">피하려\u003c/b> 생긴 모양이라고 말해요.\u003c/li>\u003cli>모양은 우스꽝스러워도 당근은 \u003cb class=\"key\">신선\u003c/b>하고 건강에 좋은 주스를 만들어요.\u003c/li>\u003cli>사과는 우리 같은 더 많은 \u003cb class=\"key\">과일과 \u003c/b>\u003cb class=\"key\">채소\u003c/b>를 만나고 싶어 하고, 키위는 가지를 예로 들어요.\u003c/li>\u003cli>사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>를 좋아해서 슈퍼마켓은 너무 휘어진 가지를 팔지 않는다는 점이 핵심이에요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Odd-shaped fruits and vegetables can still be fresh and healthy, but people often prefer straight-looking produce, so supermarkets do not sell bent ones.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">당근은 돌을 피하다 생긴 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">다리\u003c/b>와 포크 같은 뿌리를 소개하며 자신이 \u003cb class=\"key\">신선\u003c/b>하고 건강에 좋은 주스를 만든다고 말해요. 사과가 우리 같은 과일과 채소를 더 만나고 싶어 하자, 키위는 너무 \u003cb class=\"key\">휘어진 \u003c/b>\u003cb class=\"key\">가지\u003c/b>는 사람들이 \u003cb class=\"key\">곧은 \u003c/b>\u003cb class=\"key\">가지\u003c/b>를 좋아해 슈퍼마켓에서 팔지 않는다고 답해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 글은 겉모양이 조금 이상해도 신선함과 영양은 그대로일 수 있다는 점을 알려 줘요. 세 다리 당근과 휘어진 가지처럼 못난이 농산물도 가치가 있다는 사실을 기억해 주세요. 사람들이 곧은 모양만 고집하면 멀쩡한 농산물이 팔리지 않을 수 있다는 점도 생각해 볼 만해요. 오늘도 수고 많았고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
