<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 비상(황) 7과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 비상(황) 7과 본문3","audioDir":"3_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>비상(황)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>A Rubber Duck's Long Journey\u003c/h1>\u003ch2>고무오리의 긴 여행\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 강한 \u003cb class=\"key\">폭풍\u003c/b>에 바다를 떠난 \u003cb class=\"key\">고무오리\u003c/b>가 몇 주 만에 육지에 도착해 한 소년 Mike의 \u003cb class=\"key\">욕조\u003c/b>에서 안식을 얻지만, 바다에 남은 \u003cb class=\"key\">오리 \u003c/b>\u003cb class=\"key\">친구들\u003c/b>을 그리워하며 언젠가 다시 만나기를 바란다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The rubber duck finally finds a safe home in a bathtub but still misses its duck friends in the ocean.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일 학년 비상 황 교과서 본문을 함께 읽어 볼 거예요. 바다를 떠돌던 고무오리가 긴 여행 끝에 소년 Mike의 욕조에 도착하는 이야기죠. 주인공 오리는 지금 행복하지만 바다에 남은 친구들을 그리워한다는 점이 이 글의 핵심이에요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고무오리는 영어로 rubber duck이라고 부르는 장난감이에요. 그런데 이런 장난감이 실제로 바다에 떠내려가 \u003cb class=\"key\">해류\u003c/b>(ocean current)를 타고 먼 나라 해변까지 도착하는 일이 있어요. 아주 유명한 예로, 예전에 화물선 사고로 수만 개의 고무오리가 바다에 쏟아져 여러 나라 해안에 밀려온 사건이 있었죠. 이런 물건들은 해류가 어떻게 움직이는지 알려 주는 \u003cb class=\"key\">단서\u003c/b>가 되기도 해요. 편지를 병에 담아 바다에 띄우면 어디에 도착할지 모르는 것과 비슷한 원리예요. 그래서 이 지문의 오리 여행은 그냥 상상만은 아니랍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 고무오리는 영어로 rubber duck이라고 하는 장난감이에요. 그런데 이런 장난감이 실제로 바다에 떠내려가 해류를 타고 먼 나라 해변까지 도착하는 일이 있어요. 아주 유명한 예로, 예전에 화물선 사고로 수많은 고무오리가 바다에 쏟아져 여러 나라 해안에 밀려온 사건이 있었죠. 이런 물건들은 해류가 어떻게 움직이는지 알려 주는 단서가 되기도 해요. 편지를 병에 담아 바다에 띄우면 어디에 도착할지 모르는 것과 비슷한 원리예요. 그래서 이 지문처럼 오리의 여행은 그냥 상상만은 아니에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>폭풍과 탈출\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>어느 날 강한 \u003cb class=\"key\">폭풍\u003c/b>이 화자를 바다에서 빼내 줍니다. 화자는 사람이 아니라 \u003cb class=\"key\">고무오리\u003c/b>입니다. 글은 사건이 시작된 \u003cb class=\"key\">시점\u003c/b>을 알리며 이야기를 엽니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>육지 도착과 사람들\u003csmall>전개 · 문장 2–5\u003c/small>\u003c/h4>\u003cp>몇 주 후 마침내 \u003cb class=\"key\">육지\u003c/b>에 도착합니다. \u003cb class=\"key\">해변\u003c/b>에는 많은 사람들이 있었고, 누군가가 나를 집어 듭니다. 집어 든 사람 덕분에 새로운 이동이 시작됩니다. 나는 지금 어디로 가는지 \u003cb class=\"key\">궁금해\u003c/b> 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>새로운 안식처\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>정말 \u003cb class=\"key\">긴 \u003c/b>\u003cb class=\"key\">여행\u003c/b>이었다고 감탄합니다. 마침내 나는 Mike라는 \u003cb class=\"key\">소년\u003c/b>과 함께 \u003cb class=\"key\">욕조\u003c/b>에 있습니다. 나는 얼마나 \u003cb class=\"key\">운이 \u003c/b>\u003cb class=\"key\">좋은지\u003c/b> 모릅니다. 불안했던 여정이 안식으로 바뀌는 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>친구들 그리움\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>하지만 때때로 나는 다른 \u003cb class=\"key\">오리 \u003c/b>\u003cb class=\"key\">친구들\u003c/b>을 떠올립니다. 그들이 아직도 \u003cb class=\"key\">바다\u003c/b>에 있을까 걱정합니다. 언젠가 모두 만나기를 바라는 \u003cb class=\"key\">소망\u003c/b>으로 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 어느 날 강한 폭풍이 화자를 바다에서 빼내 줍니다. 여기서 화자는 사람이 아니라 고무오리라는 걸 꼭 기억해 두세요. 글은 사건이 시작된 시점을 알리며 이야기를 열어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전개예요. 몇 주 후 마침내 육지에 도착합니다. 해변에는 많은 사람들이 있었고, 누군가가 나를 집어 듭니다. 집어 든 사람 덕분에 새로운 이동이 시작되고, 나는 지금 어디로 가는지 궁금해 하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전환이에요. 정말 긴 여행이었다고 감탄합니다. 마침내 나는 Mike라는 소년과 함께 욕조에 있어요. 나는 얼마나 운이 좋은지 모릅니다. 불안했던 여정이 안식으로 바뀌는 대목이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 하지만 때때로 나는 다른 오리 친구들을 떠올립니다. 그들이 아직도 바다에 있을까 걱정하죠. 언젠가 모두 만나기를 바라는 소망으로 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 전개되는 \u003cb class=\"key\">이야기글\u003c/b>입니다. One day, After weeks, finally, now 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이 흐름을 이끕니다. 화자의 이동과 상태 변화가 차례로 이어지고, 마지막에서 \u003cb class=\"key\">친구들\u003c/b>을 그리워하는 마음이 드러납니다. 그래서 글의 주제가 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>시간 도입\u003c/span>\u003cb>After weeks (2)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003cb>finally (2)\u003c/b>\u003cspan>도달·결과\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>someday (11)\u003c/b>\u003cspan>미래·소망\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">freed me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reached land\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">picked me up\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">in a bathtub\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 앞에서부터 사건이 일어난 순서대로 차례차례 이어지죠. 그리고 화자가 전하고 싶은 마음, 곧 친구들을 그리워하는 마음은 마지막 부분에서 드러나요. 그래서 주제가 글 끝에 오는 미괄식 구조라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. One day는 시간의 도입을, After weeks는 시간의 경과를, finally는 도달과 결과를 알려 줍니다. But은 흐름을 한 번 전환시키고, someday는 앞으로의 소망을 가리켜요. 또 freed me, reached land, picked me up, in a bathtub처럼 오리의 이동과 상태 변화를 나타내는 표현이 차례로 이어지는 것도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>storm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭풍\u003c/span>\u003c/div>\u003cdiv>\u003cb>free\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빼내다, 자유롭게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>after\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>week\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주, 몇 주\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다, 이르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>land\u003c/b>\u003cem>명사\u003c/em>\u003cspan>육지\u003c/span>\u003c/div>\u003cdiv>\u003cb>there were\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 있었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>beach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해변\u003c/span>\u003c/div>\u003cdiv>\u003cb>someone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>누군가\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>where\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어디에, 어디로\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>journey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행\u003c/span>\u003c/div>\u003cdiv>\u003cb>What a long journey!\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>정말 긴 여행이구나!\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathtub\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕조\u003c/span>\u003c/div>\u003cdiv>\u003cb>boy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소년\u003c/span>\u003c/div>\u003cdiv>\u003cb>lucky\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>운이 좋은\u003c/span>\u003c/div>\u003cdiv>\u003cb>How lucky I am!\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나는 얼마나 운이 좋은지!\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>duck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오리\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아직도\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다, 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>someday\u003c/b>\u003cem>부사\u003c/em>\u003cspan>언젠가\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚고 갈게요. storm은 폭풍, reach는 도착하다, journey는 여행이라는 뜻이에요. pick up은 집어 들다, lucky는 운이 좋은, someday는 언젠가라는 의미로 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">storm\u003c/b>\u003cspan class=\"m\">폭풍\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tempest\u003c/span>\u003cspan class=\"s\">gale\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">free\u003c/b>\u003cspan class=\"m\">빼내다, 자유롭게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"s\">liberate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">capture\u003c/span>\u003cspan class=\"a\">imprison\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reach\u003c/b>\u003cspan class=\"m\">도착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arrive at\u003c/span>\u003cspan class=\"s\">get to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">journey\u003c/b>\u003cspan class=\"m\">여행\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trip\u003c/span>\u003cspan class=\"s\">voyage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lucky\u003c/b>\u003cspan class=\"m\">운이 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fortunate\u003c/span>\u003cspan class=\"s\">blessed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unlucky\u003c/span>\u003cspan class=\"a\">unfortunate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hope\u003c/b>\u003cspan class=\"m\">바라다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wish\u003c/span>\u003cspan class=\"s\">expect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">despair\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘를 동의어와 반의어로 정리해 볼게요. storm의 동의어는 tempest와 gale이고 반의어는 calm이에요. free는 release, liberate와 뜻이 가깝고 capture, imprison과 반대되지요. finally는 eventually, at last와 가깝고 initially와 반대예요. reach는 arrive at, get to와 같고 depart, leave와 반대됩니다. journey는 trip, voyage와 비슷하고, lucky는 fortunate, blessed와 가까우며 unlucky, unfortunate와 반대예요. hope는 wish, expect와 비슷하고 despair와 반대라는 것도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강한 폭풍이\u003c/span>\u003cspan class=\"en\">a strong storm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 빼내 주었어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">freed \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 강한 폭풍이 나를 빼내 주었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작을 알리는 문장이에요. \u003cb class=\"key\">폭풍\u003c/b>이 오리를 원래 있던 곳에서 떼어내 바다로 떠나보내는 사건의 출발점이죠. free는 '자유롭게 하다, 풀어 주다'라는 뜻인데, 여기서는 \u003cb class=\"key\">빼내\u003c/b> 주었다는 의미로 자연스럽게 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 free + 목적어 (3형식)\u003c/span> : free [타동사] + [목적어] : \"나를 빼내 주었어\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One day, 어느 날. a strong storm, 강한 폭풍이. freed me, 나를 빼내 주었어.. 이 문장 전체를 해석하면, 어느 날, 강한 폭풍이 나를 빼내 주었어.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작을 알리는 장면이에요. 강한 폭풍이 오리를 원래 있던 곳에서 떼어내는 사건의 출발점이죠. free는 자유롭게 하다, 풀어 주다라는 뜻이고, 여기서는 빼내 주었다는 느낌으로 해석하면 자연스러워요.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어 볼게요. 첫 번째, free는 타동사라서 뒤에 목적어 me가 바로 온다는 점을 기억하세요. 두 번째, 목적어 앞에는 전치사를 쓰지 않아요. free me처럼 목적어가 바로 붙는 형태가 시험에도 잘 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 주 후에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">weeks\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 마침내 도착했지\u003c/span>\u003cspan class=\"en\">I finally \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reached \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육지에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">land\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 주 후에, 나는 마침내 육지에 도착했지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몇 주라는 긴 시간이 흐른 뒤 마침내 \u003cb class=\"key\">육지\u003c/b>에 닿았다는 뜻이에요. \u003cb class=\"key\">마침내\u003c/b>라는 뜻의 finally가 오랜 항해 끝에 도착했다는 감동을 강조해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 쓰임\u003c/span> : After + [명사(구)] : \"몇 주 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사의 목적어 (전치사 불필요)\u003c/span> : reach [타동사] + [목적어] : \"육지에 도착했지\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"After weeks, 몇 주 후에. I finally reached, 나는 마침내 도착했지. land, 육지에. 이 문장 전체를 해석하면, 몇 주 후에, 나는 마침내 육지에 도착했지.","hl":"m"},{"n":16,"text":"몇 주라는 긴 시간이 지나서 마침내 육지에 닿았다는 뜻이에요. finally가 들어가서 오랜 항해 끝에 도착했다는 감동이 살아나죠.","hl":"mn"},{"n":17,"text":"어법 포인트 두 개 짚을게요. 첫 번째, after는 전치사라서 뒤에 weeks가 와서 몇 주 후에라는 시간 표현을 만들어 줍니다. 두 번째, reach는 도착하다라는 뜻의 타동사라서 land 앞에 전치사를 쓰지 않아요. arrive였다면 arrive at이나 arrive in을 써야 한다는 점과 꼭 비교해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해변에는\u003c/span>\u003cspan class=\"en\">at the beach.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해변에는 많은 사람들이 있었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 육지에 도착한 뒤 해변의 상황을 보여 주는 문장이에요. \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 있었다는 배경 설명으로, 바로 다음에 누군가 오리를 집어 드는 사건으로 이어지는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문 (유도부사)\u003c/span> : There + [be동사] + [주어] : \"있었어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 a lot of + 복수명사\u003c/span> : a lot of + [복수명사] : \"많은 사람들이\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There were, 있었어. a lot of people, 많은 사람들이. at the beach, 해변에는. 이 문장 전체를 해석하면, 해변에는 많은 사람들이 있었어.","hl":"m"},{"n":19,"text":"이 문장은 육지에 도착한 뒤 해변의 상황을 보여 줘요. 많은 사람들이 있었다는 배경 설명이고, 다음 문장에서 누군가 오리를 집어 드는 사건으로 이어지는 흐름을 만들어 줍니다.","hl":"mn"},{"n":20,"text":"어법 포인트 짚어 볼게요. 첫 번째, There were는 이 있다라는 뜻의 유도부사 구문이고, 진짜 주어인 a lot of people이 동사 뒤에 온다는 게 핵심이에요. 두 번째, 주어가 복수라서 be동사를 were로 썼다는 점도 기억하세요. 세 번째, a lot of는 복수명사 앞에서 많은이라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아,\u003c/span>\u003cspan class=\"en\">Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 집어 들었어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아, 누군가가 나를 집어 들었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해변에 있던 누군가가 표류하던 화자(오리 인형)를 발견해서 들어 올리는 순간이에요. 바로 앞 문장에서 해변에 사람이 많다고 했으니, 그중 \u003cb class=\"key\">누군가\u003c/b>가 화자를 \u003cb class=\"key\">집어 \u003c/b>\u003cb class=\"key\">들었다\u003c/b>는 뜻으로 이어지는 거예요. 긴 여행이 끝나고 새 주인을 만나는 장면이 시작되는 신호예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 someone (단수 취급)\u003c/span> : [someone (부정대명사·단수)] + [단수동사 picked] : \"누군가가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 pick up의 목적어 위치 (대명사는 중간에)\u003c/span> : pick + [목적어(대명사 me)] + up : \"나를 집어 들었어\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Oh, 아. someone, 누군가가. picked me up, 나를 집어 들었어.. 이 문장 전체를 해석하면, 아, 누군가가 나를 집어 들었어.","hl":"m"},{"n":22,"text":"이 문장은 표류하던 화자, 그러니까 오리 인형이 드디어 누군가에게 발견되는 순간을 보여 줘요. 앞 문장에서 해변에 사람이 많았다고 했죠. 그중 누군가가 화자를 집어 들었다는 뜻이라서, 긴 여행이 끝나고 새 주인을 만나는 장면이 시작되는 거예요.","hl":"mn"},{"n":23,"text":"먼저 첫 번째 포인트는 someone이에요. someone은 누군가라는 뜻의 부정대명사인데, 한 명을 가리키니까 단수로 취급해요. 그래서 뒤에 동사도 picked처럼 단수 형태가 왔어요. 두 번째는 picked me up이에요. pick up은 집어 들다라는 뜻의 구동사인데, 목적어가 me처럼 대명사일 때는 pick과 up 사이에 넣어야 해요. 그래서 picked up me가 아니라 picked me up이 된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 지금 어디로 가고 있는 걸까?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">now?,&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각했어.\u003c/span>\u003cspan class=\"en\">thought.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 누군가에게 집어 들린 뒤, 화자가 자기 자신에게 어디로 가는 건지 물어보는 장면이에요. 따옴표 안의 말은 화자의 \u003cb class=\"key\">혼잣말\u003c/b>이고, 그 뒤의 thought가 '그렇게 \u003cb class=\"key\">생각\u003c/b>했다'는 뜻을 완성해요. 앞 문장과 자연스럽게 이어지는 속마음 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접인용 (따옴표로 말·생각을 그대로 인용)\u003c/span> : [&quot;...?&quot;] + [주어 I] + [thought] : \"“나는 지금 어디로 가고 있는 걸까?”라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형 의문문 (의문사 + be동사 + 주어 + -ing)\u003c/span> : [Where (의문사)] + [am (be동사)] + [I (주어)] + [going (동사원형+-ing)]? : \"나는 지금 어디로 가고 있는 걸까?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"\"Where am I going now?,\", “나는 지금 어디로 가고 있는 걸까?”. I, 나는. thought, 생각했어.. 이 문장 전체를 해석하면, “나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.","hl":"m"},{"n":25,"text":"화자가 지금 어디로 가는지 궁금해하면서 혼잣말로 생각하는 장면이에요. 바로 앞에서 누군가 나를 집어 들었기 때문에, 그다음에 이런 속마음이 자연스럽게 이어지는 거죠. 따옴표 안의 말은 화자의 생각을 그대로 옮긴 거예요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 현재진행형 의문문이에요. 지금 하고 있는 일을 묻기 때문에 be동사 am과 going이 쓰였고, 의문사 Where가 문장 맨 앞으로 나와서 Where am I going now? 순서가 됐어요. 두 번째는 직접인용이에요. 따옴표 안에 생각을 그대로 넣고 뒤에 thought를 붙여서 라고 생각했어라는 뜻을 만들었어요. 이 문장은 영작 서술형으로도 잘 나오니까 어순을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 긴\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여행이었어!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">journey!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 긴 여행이었어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폭풍과 표류, 그리고 해변에서 발견되기까지의 모든 과정을 돌아보며 화자가 감탄하는 문장이에요. 그 전체 과정을 하나로 묶어 \u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">긴 \u003c/b>\u003cb class=\"key\">여행\u003c/b>이었다고 느끼는 거예요. 감탄문이라서 짧지만 감정이 아주 강하게 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문 (What + a + 형용사 + 명사)\u003c/span> : [What + a(부정관사) + [형용사 long] + [단수명사 journey]]! : \"정말 긴 여행이었어!\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감탄문에서 주어·동사의 생략\u003c/span> : [What a long journey!] = [What a long journey (it was)!] : \"(그것은) 정말 긴 여행이었어!\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"What a long, 정말 긴. journey!, 여행이었어!. 이 문장 전체를 해석하면, 정말 긴 여행이었어!","hl":"m"},{"n":28,"text":"이 문장은 긴 여행을 겪은 화자가 그 여정을 돌아보며 감탄하는 문장이에요. 앞 문장들에서 폭풍과 표류, 그리고 해변에서 누군가에게 발견되기까지의 과정이 있었죠. 그 모든 과정을 하나로 묶어서 정말 긴 여행이었다고 느끼는 거예요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 감탄문이에요. 감탄문에서는 What을 문장 맨 앞에 쓰고, a와 형용사 long, 그리고 명사 journey 순서를 이어 줘요. 그래서 What a long journey!가 정말 긴 여행이었어라는 감탄의 뜻이 되는 거죠. 두 번째는 주어와 동사의 생략이에요. 원래는 What a long journey it was!에서 it was가 들어가는데, 감탄문에서는 이 부분을 자주 생략해요. 그래서 짧은 문장만으로도 감탄의 뜻이 충분히 전달되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 마침내 ~에 있어\u003c/span>\u003cspan class=\"en\">I am finally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">욕조 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bathtub\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 소년, Mike와 함께\u003c/span>\u003cspan class=\"en\">with \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">boy, \u003c/span>\u003cspan class=\"tgt\">Mike\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오리가 긴 여정 끝에 마침내 \u003cb class=\"key\">욕조\u003c/b>라는 안전한 곳, Mike라는 소년 곁에 도착했음을 보여주는 문장이에요. 콤마로 이어 붙인 \u003cb class=\"key\">동격\u003c/b> 표현 this boy, Mike로 소년의 이름을 밝혀 장면을 구체적으로 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [be동사] + [전치사 + 장소 명사] : \"욕조 안에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(콤마로 이어지는 동격)\u003c/span> : [명사] + , + [같은 대상을 가리키는 명사] : \"이 소년, 즉 Mike\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I am finally, 나는 마침내 ~에 있어. in a bathtub, 욕조 안에. with this boy, Mike, 이 소년, Mike와 함께. 이 문장 전체를 해석하면, 나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.","hl":"m"},{"n":31,"text":"이 문장은 오리가 긴 여행 끝에 드디어 안전한 곳에 도착했다는 걸 보여줘요. 그 안전한 곳이 바로 욕조이고, 그 곁에는 Mike라는 소년이 있죠. 콤마로 소년의 이름을 덧붙여서 이 소년이 누구인지 구체적으로 알려주고 있어요.","hl":"mn"},{"n":32,"text":"먼저 this boy, Mike를 볼게요. 콤마 뒤의 Mike는 앞의 this boy와 같은 대상을 가리키는 동격 표현이에요. 같은 사람을 두 번 가리키면서 이름을 덧붙인 거죠. 그리고 in a bathtub은 be동사 뒤에 온 전치사구로, 주어가 어디에 있는지 위치를 알려줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 운이 좋은지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">lucky \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 (그렇)다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 얼마나 운이 좋은지!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 욕조와 소년을 만난 오리가 이제 얼마나 기쁜지를 감탄으로 터뜨리는 문장이에요. How lucky라는 짧은 감탄이 오리의 행복한 \u003cb class=\"key\">감정\u003c/b>과 \u003cb class=\"key\">안도감\u003c/b>을 강하게 전달해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문(How + 형용사 + 주어 + 동사)\u003c/span> : How + [형용사] + [주어] + [동사]! : \"나는 얼마나 운이 좋은지!\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"How lucky, 얼마나 운이 좋은지. I am!, 나는 (그렇)다!. 이 문장 전체를 해석하면, 나는 얼마나 운이 좋은지!","hl":"m"},{"n":34,"text":"앞에서 욕조와 소년을 만난 오리가 이제 얼마나 기쁜지를 감탄으로 터뜨리는 문장이에요. How lucky라는 짧은 감탄이 오리의 행복한 감정을 세게 전달하죠. 어려운 비유는 없고, 감정을 강조하는 표현이에요.","hl":"mn"},{"n":35,"text":"이건 감탄문이에요. 평서문이라면 I am lucky라고 할 텐데, 감탄문에서는 How와 형용사 lucky를 문장 맨 앞으로 끌어올려요. 그래서 How lucky I am이 되는데, 주어와 동사는 그대로 뒤에 남아 있어요. 놀람과 감정을 강조하는 어순이라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 때때로\u003c/span>\u003cspan class=\"en\">But sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각해\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 다른 오리 친구들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">duck \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 때때로 나는 나의 다른 오리 친구들을 생각해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But으로 화제를 확 돌려, 지금은 안전하고 행복하지만 바다에 남은 친구들이 떠오른다는 마음을 보여줘요. 앞의 행복한 장면과 대비되는 \u003cb class=\"key\">그리움\u003c/b>과 친구들을 향한 \u003cb class=\"key\">걱정\u003c/b>이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(think about)\u003c/span> : think + about + [목적어] : \"~에 대해 생각하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 other의 수식(수식어 순서)\u003c/span> : [한정사 my] + [형용사 other] + [명사 duck friends] : \"나의 다른 오리 친구들\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But sometimes, 그러나 때때로. I think about, 나는 생각해. my other duck friends, 나의 다른 오리 친구들을. 이 문장 전체를 해석하면, 그러나 때때로 나는 나의 다른 오리 친구들을 생각해.","hl":"m"},{"n":37,"text":"But으로 시작해서 화제를 확 돌려요. 지금은 안전하고 행복하지만, 때때로 바다에 남은 친구들이 떠오른다는 거죠. 앞의 행복한 장면과 대비되는 그리움, 그리고 걱정하는 마음이 담겨 있어요.","hl":"mn"},{"n":38,"text":"먼저 think about을 보세요. think는 자동사라서 목적어를 바로 못 가져요. 그래서 전치사 about을 붙여서 my other duck friends를 이어 줘요. 그리고 my other duck friends에서는 한정사 my 다음에 형용사 other가 오고, 그 뒤에 명사가 오는 수식어 순서를 확인할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~인가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Are \u003c/span>\u003cspan class=\"tgt\">they\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아직도\u003c/span>\u003cspan class=\"en\">still\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다에 있나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 아직도 바다에 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 자신을 떠나보낸 오리 친구들을 떠올린 화자가 그들의 안부를 궁금해하며 던지는 \u003cb class=\"key\">의문문\u003c/b>이에요. 대답을 듣기 위한 질문이라기보다 \u003cb class=\"key\">그리움\u003c/b>을 담아 혼잣말처럼 하는 말이라, 글의 흐름에서는 다음 문장의 \u003cb class=\"key\">소망\u003c/b>으로 이어지는 디딤돌 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 의문문의 도치(주어-동사 도치)\u003c/span> : [Be동사] + [주어] ~? (예: Are they ~?) : \"그들은 ~인가요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소)의 부사적 쓰임\u003c/span> : [전치사 in] + [명사 the ocean] : \"바다에, 바다 속에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Are they, 그들은 ~인가요. still, 아직도. in the ocean?, 바다에 있나요?. 이 문장 전체를 해석하면, 그들은 아직도 바다에 있을까?","hl":"m"},{"n":40,"text":"여기서 주인공은 자신을 떠나보낸 오리 친구들을 떠올리고 있어요. 그 친구들이 아직도 바다에 있는지 궁금해하며 안부를 묻는 마음이 담겨 있죠. 대답을 듣기 위한 질문이라기보다는 그리움을 담아 혼잣말처럼 던지는 의문문이고, 바로 다음 문장의 소망으로 이어지는 연결 고리 역할을 해요.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 be동사 의문문이에요. Are they처럼 be동사를 주어 앞으로 내보내는 도치가 일어나죠. 그래서 일반동사 의문문처럼 do나 does를 쓰지 않고 be동사 자체를 문장 맨 앞에 세운다는 걸 기억하세요. 두 번째 포인트는 in the ocean이라는 전치사구예요. 이 전치사구가 문장 끝에서 어디에 있는지를 알려 주는 장소 정보를 더해 줘요. be동사와 함께 쓰여서 바다에 있다는 상태를 나타낸다고 정리해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 바라요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 모두를 만나기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언젠가\u003c/span>\u003cspan class=\"en\">someday.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 언젠가 그들 모두를 만나기를 바라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 오리 친구들을 떠올린 화자가 마지막에 그 \u003cb class=\"key\">소망\u003c/b>을 직접 밝히며 글을 맺는 문장이에요. 과거의 만남이 아니라 미래의 \u003cb class=\"key\">재회\u003c/b>를 바란다는 점이 핵심이고, \u003cb class=\"key\">hope \u003c/b>\u003cb class=\"key\">to부정사\u003c/b>가 '~하기를 바라다'라는 소망을 담는 대표 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : hope [타동사] + [to see ~ (to부정사구/목적어)] : \"만나기를 바라다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 + all의 어순\u003c/span> : [대명사 them] + [all (한정사)] : \"그들 모두를\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I hope, 나는 바라요. to see them all, 그들 모두를 만나기를. someday, 언젠가. 이 문장 전체를 해석하면, 나는 언젠가 그들 모두를 만나기를 바라.","hl":"m"},{"n":43,"text":"이 문장은 지문의 마지막 문장이에요. 앞에서 오리 친구들을 떠올린 주인공이 이제 그 소망을 직접 말하죠. 과거의 만남이 아니라 미래의 재회를 바라는 마음이 담겨 있어서 글을 따뜻하게 맺어 주는 역할을 해요.","hl":"mn"},{"n":44,"text":"첫 번째 포인트는 hope to see예요. hope 뒤에 to부정사가 와서 만나기를 바란다는 목적어 역할을 하죠. hope는 목적어로 to부정사를 쓰는 대표 동사라서 동명사인 seeing이 아니라 to see를 쓴다는 점을 꼭 기억하세요. 두 번째 포인트는 them all이에요. all이 대명사 them을 꾸밀 때는 명사 앞이 아니라 뒤에 온다는 점이 중요해요. all the students처럼 명사 앞에 쓰는 경우와 비교해서 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>강한 \u003cb class=\"key\">폭풍\u003c/b>이 고무오리를 바다에서 빼내 몇 주 만에 \u003cb class=\"key\">육지\u003c/b>에 도착하게 합니다.\u003c/li>\u003cli>해변에서 누군가 오리를 집어 들고, 오리는 새로운 \u003cb class=\"key\">여정\u003c/b>이 시작되었음을 느낍니다.\u003c/li>\u003cli>오리는 Mike라는 소년과 함께 \u003cb class=\"key\">욕조\u003c/b>에 있게 되어 자신이 \u003cb class=\"key\">운이 \u003c/b>\u003cb class=\"key\">좋다\u003c/b>고 말합니다.\u003c/li>\u003cli>그러나 바다에 남은 \u003cb class=\"key\">오리 \u003c/b>\u003cb class=\"key\">친구들\u003c/b>을 그리워하며 언젠가 다시 만나기를 \u003cb class=\"key\">바랍니다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The rubber duck finally finds a safe home in a bathtub but still misses its duck friends in the ocean.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 강한 \u003cb class=\"key\">폭풍\u003c/b>에 바다를 떠난 \u003cb class=\"key\">고무오리\u003c/b>가 몇 주 만에 육지에 도착해 한 소년 Mike의 \u003cb class=\"key\">욕조\u003c/b>에서 안식을 얻지만, 바다에 남은 \u003cb class=\"key\">오리 \u003c/b>\u003cb class=\"key\">친구들\u003c/b>을 그리워하며 언젠가 다시 만나기를 바란다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글을 정리해 볼게요. 바다를 떠돌던 고무오리가 폭풍을 만나 긴 여행 끝에 Mike의 욕조에 도착했어요. 지금은 운이 좋다고 느끼지만, 바다에 남은 오리 친구들을 그리워하고 있죠. 시간순으로 이어지는 이야기글이고, 주제는 글 끝에 나온다는 점을 꼭 기억하세요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
