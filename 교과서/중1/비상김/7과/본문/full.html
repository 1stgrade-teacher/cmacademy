사건인 1992년 발생한 &#39;플라스틱 오리 장난감 유실 사고(Friendly Floatees spill)&#39;를 배경으로 하고 있어요. 당시 폭풍으로 인해 약 2만 8천 개의 고무 오리가 바다에 쏟아졌는데, 이 장난감들이 해류(Ocean currents)를 타고 전 세계 바다를 수년간 떠돌며 과학자들이 바다의 흐름을 연구하는 데 중요한 자료가 되었죠. 하지만 이 사건은 동시에 해양 오염(Marine pollution)의 심각성을 알리는 계기가 되기도 했어요. 바다에 버려진 플라스틱은 쉽게 썩지 않고 파도에 잘게 부서져 미세 플라스틱(Microplastics)이 되어 바다 생태계를 위협하게 된답니다. 마치 우리가 무심코 버린 쓰레기가 바다를 건너 큰 문제가 되는 것처럼, 인간이 만든 플라스틱이 자연 환경에 어떤 영향을 미치는지 한 번쯤 깊이 생각해보는 시간이 되었으면 해요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시작된 예상치 못한 여행</div><ul><li>공장에서 만들어진 플라스틱 오리들이 바다로 떠나게 된 계기를 설명합니다.</li><li>가볍고 튼튼한 플라스틱 재질(plastic material)로 만들어짐</li><li>운반 도중 사고(accident)로 상자가 바다에 빠짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02바다에서 마주한 위기들</div><ul><li>오리가 바다를 떠돌며 겪은 환경 문제와 안타까운 경험을 다룹니다.</li><li>강한 바람과 파도(waves)로 인해 오리들이 뿔뿔이 흩어짐</li><li>그물에 걸린 바다거북(sea turtle)을 보고 도움을 주지 못해 슬퍼함</li><li>거대한 쓰레기 섬(trash island)에 도착하여 플라스틱 오염을 목격함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 곳으로의 도착</div><ul><li>강한 폭풍 덕분에 바다를 탈출해 다시 사람의 곁으로 돌아옵니다.</li><li>강한 폭풍(strong storm)으로 쓰레기 섬에서 벗어남</li><li>오랜 기간 끝에 해변(beach)에 도착해 사람에게 발견됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04여행의 끝과 그리움</div><ul><li>다시 욕조로 돌아온 오리의 안도감과 친구들에 대한 걱정을 보여줍니다.</li><li>소년 마이크(Mike)의 욕조로 돌아와 행복을 느낌</li><li>바다에 남겨진 다른 친구 오리(duck friends)들을 걱정함</li><li>핵심 키워드: 바다 표류(ocean journey)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lucky</td><td class=\"m\">운이 좋은</td></tr><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">middle</td><td class=\"m\">중앙, 한가운데</td></tr><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr><tr><td class=\"w\">factory</td><td class=\"m\">공장</td></tr><tr><td class=\"w\">light</td><td class=\"m\">가벼운</td></tr><tr><td class=\"w\">last</td><td class=\"m\">지속되다, 오래가다</td></tr><tr><td class=\"w\">accident</td><td class=\"m\">사고</td></tr><tr><td class=\"w\">luckily</td><td class=\"m\">다행히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wave</td><td class=\"m\">파도</td></tr><tr><td class=\"w\">take apart</td><td class=\"m\">~을 분리하다, 흩어지게 하다</td></tr><tr><td class=\"w\">be in trouble</td><td class=\"m\">곤경에 처하다</td></tr><tr><td class=\"w\">fishing net</td><td class=\"m\">그물</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기</td></tr><tr><td class=\"w\">storm</td><td class=\"m\">폭풍</td></tr><tr><td class=\"w\">free</td><td class=\"m\">자유롭게 하다, 풀어주다</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">도착하다, 도달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말 운 좋은 오리구나!</span><span class=\"en\"><b><span class=\"grammar-hl\">What a Lucky Ducky!</span></b></span></div></div><div class=\"lec-sent-ko\">얼마나 운이 좋은 오리인가!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 제목입니다. Lucky Ducky는 &#39;운 좋은 오리&#39;라는 뜻인데, 여기서 Lucky는 단순히 운이 좋은 것을 넘어 험난한 바다 여행에서 살아남아 다시 원래 목적지인 욕조로 돌아온 주인공의 상황을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What a Lucky Ducky! (도치(감탄문)): &#39;What + a + 형용사 + 명사&#39; 구조의 감탄문으로, 원래는 &#39;What a lucky ducky (I am)&#39; 형태에서 주어/동사가 생략된 구문임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lucky</td><td class=\"m\">운이 좋은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕!</span><span class=\"en\"><b>Hi!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 플라스틱 오리이고</span><span class=\"en\"><b><span class=\"grammar-hl\">I am a plastic duck</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목욕 장난감이야.</span><span class=\"en\"><b>and I am a bath toy.</b></span></div></div><div class=\"lec-sent-ko\">안녕! 나는 플라스틱 오리이고 목욕 장난감이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 자신을 소개하며 자신이 원래 어떤 존재인지 정의하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am a plastic duck (관용표현): &#39;a plastic duck&#39;은 고무 오리 인형이라는 대상을 지칭하는 명사구임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">last</td><td class=\"m\">지속되다, 오래가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 봐!</span><span class=\"en\"><b>But look!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 욕실에 있지 않아.</span><span class=\"en\"><b><span class=\"grammar-hl\">I am not in a bathroom</span>.</b></span></div></div><div class=\"lec-sent-ko\">(하지만 봐! 나는 욕실에 있지 않아.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 언급한 &#39;목욕 장난감&#39;이라는 본래의 위치와 현재 처한 상황이 다름을 보여주며 앞으로 벌어질 사건에 대한 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am not in a bathroom (관용표현): &#39;in a bathroom&#39;은 장소의 전치사구로, 오리 인형이 있어야 할 일반적인 장소를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 있다</span><span class=\"en\"><b>I am <span class=\"grammar-hl\">in the middle of the ocean</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다 한가운데에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 바다 한가운데 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 화장실이 아닌 바다라는 위험한 곳에 있음을 밝히며, 이야기의 본격적인 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the middle of the ocean (관용표현): &#39;in the middle of ~&#39;는 &#39;~의 한가운데에&#39;라는 의미를 나타내는 장소 전치사구임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">middle</td><td class=\"m\">중앙, 한가운데</td></tr><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내가 어떻게 왔을까</span><span class=\"en\"><b><span class=\"grammar-hl\">How did I get here?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">내가 여기에 어떻게 오게 됐을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 주인공이 바다로 떠밀려 오게 된 과거의 사건을 설명할 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How did I get here? 간접의문문(의문사 의문문): &#39;How&#39;로 시작하는 의문문으로, 장소 부사 &#39;here&#39;에 도달한 방식과 경위를 묻는 구조임</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 공장에서 나왔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I was from a factory</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 오리들과 함께.</span><span class=\"en\"><b>with other ducks.</b></span></div></div><div class=\"lec-sent-ko\">나는 다른 오리들과 함께 공장에서 왔어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오리들의 시작점을 알리는 과거 시점의 서술입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was from a factory (관용표현): &#39;be from ~&#39;는 &#39;~출신이다&#39; 또는 &#39;~에서 왔다&#39;는 의미를 나타내는 기본 구문임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">factory</td><td class=\"m\">공장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 우리를 만들었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">People made us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱으로</span><span class=\"en\"><b><span class=\"grammar-hl\">with plastic</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 가볍고</span><span class=\"en\"><b>because it is light</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오래가기 때문에.</span><span class=\"en\"><b>and lasts long.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플라스틱의 특성(가벼움, 내구성) 때문에 오리들이 바다에서 쉽게 떠내려가고 사라지지 않는다는 환경적 문제의 원인을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People made us with plastic 5형식(SVOC) 구조: &#39;make + O + with + 재료&#39; 구조로, 목적어(us)를 어떤 재료로 만드는지 설명하는 3형식 구조의 변형임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plastic</td><td class=\"m\">플라스틱</td></tr><tr><td class=\"w\">light</td><td class=\"m\">가벼운</td></tr><tr><td class=\"w\">last</td><td class=\"m\">지속되다, 오래가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 우리를 상자에 넣었고</span><span class=\"en\"><b><span class=\"grammar-hl\">People put us in boxes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 바다로 나갔어.</span><span class=\"en\"><b>and we went out to sea.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상품으로 운송되던 중 사고가 발생하기 전까지의 이동 경로를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People put us in boxes (관용표현): &#39;put A in B&#39;는 &#39;A를 B에 넣다&#39;라는 의미로, 주체자가 대상을 특정 장소로 이동시키는 동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 상자들이 바다에 빠졌는데</span><span class=\"en\"><b>But <span class=\"grammar-hl\">the boxes fell into the ocean</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사고로.</span><span class=\"en\"><b>in an accident.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그 상자들이 사고로 바다에 빠진 거야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 평화로운 이동 상황이 &#39;사고&#39;라는 변수를 통해 바다 표류라는 사건으로 전환되는 지점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the boxes fell into the ocean (관용표현): &#39;fall into ~&#39;는 &#39;~로 떨어지다/빠지다&#39;라는 의미로, 상태의 변화를 나타내는 동사구임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr><tr><td class=\"w\">accident</td><td class=\"m\">사고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">운 좋게도</span><span class=\"en\"><b>Luckily,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 상자에서 빠져나올 수 있었어.</span><span class=\"en\"><b><span class=\"grammar-hl\">we could get out of the boxes</span>.</b></span></div></div><div class=\"lec-sent-ko\">운 좋게도, 우리는 상자들 밖으로 나올 수 있었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상자에서 탈출했다는 것은 자유를 얻음과 동시에 본격적으로 바다를 떠돌게 됨을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we could get out of the boxes (관용표현): &#39;get out of ~&#39;는 &#39;~에서 나오다&#39;라는 의미로, 탈출이나 분리 상태를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">luckily</td><td class=\"m\">다행히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바람이 강해서</span><span class=\"en\"><b>The wind was strong,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파도가 우리를 뿔뿔이 흩어지게 했어.</span><span class=\"en\"><b>so <span class=\"grammar-hl\">the waves took us apart</span>.</b></span></div></div><div class=\"lec-sent-ko\">바람이 강해서 파도가 우리를 떨어뜨려 놓았어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> took us apart는 사전적으로 &#39;분해하다&#39;이지만, 여기서는 바람과 파도의 힘에 의해 무리 지어 있던 오리들이 서로 다른 곳으로 멀어지게 되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the waves took us apart (관용표현): &#39;take apart&#39;는 &#39;분해하다/떼어놓다&#39;라는 의미의 구동사로, 목적어인 &#39;us&#39;가 갈라짐을 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wave</td><td class=\"m\">파도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바다에서</span><span class=\"en\"><b><span class=\"grammar-hl\">In the ocean,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 많은 바다 동물을 만났어.</span><span class=\"en\"><b><span class=\"grammar-hl\">I met a lot of sea animals</span>.</b></span></div></div><div class=\"lec-sent-ko\">바다에서 나는 많은 바다 동물을 만났어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다라는 새로운 환경에서 주인공이 겪는 경험의 확장을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In the ocean, I met a lot of sea animals (관용표현): &#39;a lot of&#39;는 수량 형용사로 뒤의 가산명사 &#39;sea animals&#39;를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들 중 다수가</span><span class=\"en\"><b>But <span class=\"grammar-hl\">many of them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곤경에 처해 있었어.</span><span class=\"en\"><b><span class=\"grammar-hl\">were in trouble</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그들 중 많은 이들이 어려움에 빠져 있었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해양 오염이라는 무거운 주제를 등장인물들의 고통을 통해 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">many of them were in trouble (관용표현): &#39;be in trouble&#39;은 &#39;곤경에 처해 있다&#39;는 상태를 나타내는 형용사적 전치사구임</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한번은</span><span class=\"en\"><b>One time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 바다거북을 만났는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I met a sea turtle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그물에 걸린.</span><span class=\"en\"><b><span class=\"grammar-hl\">in a fishing net</span>.</b></span></div></div><div class=\"lec-sent-ko\">한번은, 내가 낚시 그물에 걸린 바다거북을 만났어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 사례를 통해 해양 생태계가 겪는 실질적인 위험을 제시합니다. 15. “Get me out of this,” the sea turtle cried. cried는 단순히 &#39;울다&#39;가 아니라, 거북이가 처한 절박한 상황에서 도움을 요청하며 &#39;외치다&#39;라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I met a sea turtle in a fishing net (과거분사(형용사)): &#39;in a fishing net&#39;은 바다거북의 상태를 설명하는 전치사구이며, &#39;fishing&#39;은 동명사로 &#39;낚시용&#39;이라는 용도를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fishing net</td><td class=\"m\">그물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것에서 나를 꺼내줘라고</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Get me out of this</span>,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다거북이 울부짖었어.</span><span class=\"en\"><b>the sea turtle cried.</b></span></div></div><div class=\"lec-sent-ko\">“이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> cried는 단순히 &#39;울다&#39;가 아니라, 거북이가 처한 절박한 상황에서 도움을 요청하며 &#39;외치다&#39;라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Get me out of this 5형식(SVOC) 구조: &#39;get + O(me) + 부사구(out of this)&#39;로, 목적어인 나를 특정 상태나 장소로 이동시키라는 명령문임</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 돕고 싶었지만</span><span class=\"en\"><b><span class=\"grammar-hl\">I wanted to help</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그럴 수 없었어.</span><span class=\"en\"><b>but I couldn’t.</b></span></div></div><div class=\"lec-sent-ko\">나는 도와주고 싶었지만 할 수 없었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무기력한 장난감인 주인공의 한계를 보여주며 안타까움을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I wanted to help (to부정사): &#39;wanted&#39;의 목적어 역할을 하며, 동사 &#39;help&#39;를 명사적 기능으로 전환함</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I was so sad</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 슬펐다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 매우 슬펐어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 감정 변화를 통해 독자의 공감을 끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I was so sad (관용표현): 부사 &#39;so&#39;가 형용사 &#39;sad&#39;의 정도를 강조함</div></div>\n        ","<div cl /div><div class=\"lec-sent-ko\">어느 날, 강한 폭풍이 나를 빼내 주었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> freed는 &#39;해방하다&#39;인데, 여기서 폭풍은 파괴적인 힘이지만 주인공에게는 쓰레기 섬을 탈출할 기회를 준 계기가 되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a strong storm freed me (관용표현): &#39;free&#39;가 타동사로 쓰여 &#39;~를 자유롭게 하다&#39;라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">storm</td><td class=\"m\">폭풍</td></tr><tr><td class=\"w\">free</td><td class=\"m\">자유롭게 하다, 풀어주다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 22 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇 주 후,</span><span class=\"en\"><b><span class=\"grammar-hl\">After weeks,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I finally reached land</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내 도착했는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">육지에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">몇 주 후에, 나는 마침내 육지에 도착했지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기나긴 표류 끝에 마침내 목적지에 가까워졌음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After weeks, I finally reached land (관용표현): &#39;reach&#39;는 타동사로 뒤에 목적어 &#39;land&#39;가 바로 오며, &#39;~에 도착하다&#39;를 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reach</td><td class=\"m\">도착하다, 도달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 23 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">There were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">a lot of people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해변에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at the beach</span>.</b></span></div></div><div class=\"lec-sent-ko\">해변에는 많은 사람들이 있었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인간 세상으로 다시 돌아왔음을 보여주는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were a lot of people at the beach (도치(유도부사)): &#39;There + be동사 + 주어&#39; 구조로, 장소에 존재함을 나타내는 구문임</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오,</span><span class=\"en\"><b>Oh,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가가</span><span class=\"en\"><b><span class=\"grammar-hl\">someone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 주웠다.</span><span class=\"en\"><b><span class=\"grammar-hl\">picked me up</span>.</b></span></div></div><div class=\"lec-sent-ko\">아, 누군가가 나를 집어 들었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 운명이 다시 사람의 손에 의해 결정되는 순간입니다. 25. “Where am I going now?,” I thought. 새로운 환경에 대한 불안감과 기대가 섞인 심리를 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">someone picked me up (관용표현): &#39;pick up&#39;은 &#39;집어 올리다&#39;를 뜻하는 구동사로, 대명사 &#39;me&#39;는 항상 사이에 위치함</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“이제 어디로 가는 거지?” 라고</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Where am I going now?</span>,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 생각했다.</span><span class=\"en\"><b>I thought.</b></span></div></div><div class=\"lec-sent-ko\">“나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 환경에 대한 불안감과 기대가 섞인 심리를 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where am I going now? (현재진행): &#39;am + going&#39; 구조로, 미래의 계획이나 현재 진행 중인 이동 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말 긴 여정이다!</span><span class=\"en\"><b><span class=\"grammar-hl\">What a long journey!</span></b></span></div></div><div class=\"lec-sent-ko\">정말 긴 여행이었어!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다에서 표류했던 고난의 시간을 회상하며 안도감을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What a long journey! (도치(감탄문)): &#39;What + (a) + 형용사 + 명사&#39; 구조를 사용하여 감탄을 나타내는 구문임</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 마침내 있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I am finally</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">욕조에</span><span class=\"en\"><b><span class=\"grammar-hl\">in a bathtub</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 소년과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with this boy,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마이크.</span><span class=\"en\"><b><span class=\"grammar-hl\">Mike</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 본래 목적지인 &#39;욕조&#39;로 돌아와 안정을 찾았음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am finally in a bathtub with this boy, Mike (동격): &#39;this boy&#39;와 &#39;Mike&#39;가 같은 대상을 가리키며, &#39;Mike&#39;가 뒤에서 &#39;boy&#39;를 구체화함</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">얼마나 운이 좋은지</span><span class=\"en\"><b><span class=\"grammar-hl\">How lucky I am!</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 얼마나 운이 좋은지!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장의 제목과 수미상관을 이루며, 여행을 마치고 돌아온 만족감을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How lucky I am! (도치(감탄문)): &#39;How + 형용사 + 주어 + 동사&#39; 순서의 감탄문 구조로, 주어와 동사가 정상 어순보다 뒤에 위치함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lucky</td><td class=\"m\">운이 좋은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 29 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 가끔</span><span class=\"en\"><b>But sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 생각하는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I think about</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 다른 오리 친구들에 대해.</span><span class=\"en\"><b><span class=\"grammar-hl\">my other duck friends</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 때때로 나는 나의 다른 오리 친구들을 생각해.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 행복 속에서도 동료들에 대한 그리움을 나타내며 여운을 남깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I think about my other duck friends (관용표현): &#39;think about&#39;은 &#39;~에 대해 생각하다&#39;를 의미하는 동사구임</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 인가</span><span class=\"en\"><b><span class=\"grammar-hl\">Are they</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히</span><span class=\"en\"><b><span class=\"grammar-hl\">still</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in the ocean?</span></b></span></div></div><div class=\"lec-sent-ko\">그들은 아직도 바다에 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여전히 바다에 남아 있을 친구들을 걱정하며 다시금 환경 문제에 대한 생각을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Are they still in the ocean? (관용표현): &#39;still&#39;은 &#39;여전히&#39;라는 의미의 부사로, 지속되는 상태를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 31 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 보기를 바라는데</span><span class=\"en\"><b><span class=\"grammar-hl\">I hope to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 모두를</span><span class=\"en\"><b><span class=\"grammar-hl\">them all</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언젠가.</span><span class=\"en\"><b><span class=\"grammar-hl\">someday</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 언젠가 그들 모두를 만나기를 바라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해피엔딩 속에서도 해결되지 않은 문제(해양 쓰레기)에 대한 희망적인 메시지로 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I hope to see them all someday (to부정사): &#39;hope&#39;의 목적어로 쓰였으며, 미래의 동작을 나타내는 명사적 용법임</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>플라스틱 오리가 사고로 바다에 빠져 긴 표류를 시작한다.</li><li>표류하며 바다 동물들의 고통과 거대한 쓰레기 섬을 목격한다.</li><li>운 좋게 폭풍을 만나 육지로 돌아와 다시 목욕 장난감이 된다.</li><li>안락한 일상 속에서도 바다에 남은 오리 친구들을 걱정하며 환경 문제를 되새긴다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The plastic duck travels through the ocean facing pollution before it is found and brought back to a home.</div>\n              <div class=\"lec-final-sum-ko\">플라스틱 오리는 발견되어 집으로 돌아오기 전까지 오염으로 가득한 바다를 여행한다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"audio":"./full_audio/9.mp3","hl":"main"},{"audio":"./full_audio/10.mp3","hl":"meaning"},{"audio":"./full_audio/11.mp3","hl":"grammar"}],[{"audio":"./full_audio/12.mp3","hl":"main"},{"audio":"./full_audio/13.mp3","hl":"meaning"},{"audio":"./full_au
