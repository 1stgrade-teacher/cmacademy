<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 비상(황) 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 비상(황) 7과 본문2","audioDir":"2_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>비상(황)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>From the Boxes to a Giant Trash Island\u003c/h1>\u003ch2>상자에서 거대한 쓰레기 섬까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>운 좋게 상자 밖으로 나온 플라스틱이 파도에 흩어져 바다로 흘러가, 어려움에 빠진 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">동물\u003c/b>들을 만나고 마침내 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>에 도착해 그곳을 벗어나고 싶어 한다. 이 글은 바다에 버려진 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 바다 생물을 위협한다는 것을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Plastic waste that flows into the ocean harms sea animals and piles up into giant trash islands.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일학년 비상 황 교과서 일곱 번째 과, 본문 두 번째 지문을 함께 공부할 거예요. 이 글은 바다로 흘러간 플라스틱이 겪은 일을 일인칭으로 들려주는 이야기입니다. 운 좋게 상자 밖으로 나온 플라스틱이 파도에 흩어져 바다로 가고, 어려움에 빠진 바다 동물들을 만나며, 마침내 거대한 쓰레기 섬에 도착한다는 내용이죠. 핵심은 바다에 버려진 플라스틱 쓰레기가 결국 바다 생물과 환경을 위협한다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">바다로 흘러든 플라스틱은 \u003cb class=\"key\">해류\u003c/b>(ocean current)를 타고 아주 먼 곳까지 이동한다. 이렇게 이동한 플라스틱은 한곳에 뭉쳐 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>(trash island)이나 쓰레기 지대(garbage patch)를 만든다. 플라스틱은 잘 썩지 않아 오랜 시간 바다에 남고, 햇빛과 파도에 부서지면 \u003cb class=\"key\">미세 \u003c/b>\u003cb class=\"key\">플라스틱\u003c/b>(microplastic)이 되어 물고기 몸속까지 들어간다. 예를 들어 집에서 버린 작은 물병 하나는 우산 없이 쏟아지는 비를 맞는 사람처럼 아무 저항 없이 강을 따라 바다로 휩쓸려 간다. 그래서 바다거북이나 물고기 같은 바다 생물(sea animals)이 그물이나 플라스틱에 걸려 \u003cb class=\"key\">어려움\u003c/b>(in trouble)에 빠지게 된다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 바다로 흘러든 플라스틱은 ocean current, 즉 해류를 타고 아주 먼 곳까지 이동합니다. 이렇게 모인 플라스틱은 한곳에 뭉쳐 거대한 쓰레기 섬, 영어로 trash island나 garbage patch를 만듭니다. 플라스틱은 잘 썩지 않아서 아주 오랜 시간 바다에 남고, 작게 부서지면 microplastic이 되어 물고기 몸속까지 들어가요. 여러분이 집에서 버린 작은 물병 하나도 강을 따라 바다로 가면, 마치 우산 없이 쏟아지는 비를 맞는 사람처럼 아무 저항 없이 휩쓸려 갑니다. 그래서 바다거북이나 물고기 같은 sea animals가 그물이나 플라스틱에 걸려 in trouble에 빠지는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상자 밖으로\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>운 좋게도 화자 일행은 \u003cb class=\"key\">상자\u003c/b> 밖으로 나올 수 있었다. 하지만 바람이 강해서 \u003cb class=\"key\">파도\u003c/b>가 그들을 떼어 놓았다. 이 장면은 플라스틱이 바다로 흘러가기 시작하는 출발점을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>바다 동물과의 만남\u003csmall>전개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>바다에 도착한 화자는 많은 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 만났다. 그런데 그들 중 많은 이들이 \u003cb class=\"key\">어려움\u003c/b>에 빠져 있었다. 여기서 글의 문제 상황이 본격적으로 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거북이 구조 실패\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>화자는 \u003cb class=\"key\">낚시 \u003c/b>\u003cb class=\"key\">그물\u003c/b>에 걸린 \u003cb class=\"key\">바다거북\u003c/b>을 만났고, 거북이는 이것으로부터 나를 꺼내 달라고 외쳤다. 화자는 도와주고 싶었지만 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없었\u003c/b>고, 그래서 매우 슬펐다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>쓰레기 섬에 도착\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>그때 파도가 화자를 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>으로 데려갔다. 화자는 그곳에서 많은 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>를 보았고, 그곳에서 \u003cb class=\"key\">벗어나고 \u003c/b>\u003cb class=\"key\">싶어\u003c/b> 했다. 이야기가 바다 오염이라는 주제로 모이는 결말 부분이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 크게 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계는 상자 밖으로 나오는 장면이에요. 운 좋게도 화자 일행은 상자 밖으로 나올 수 있었는데, 바람이 강해서 파도가 그들을 떼어 놓았죠. 이 장면은 플라스틱이 세상 밖으로, 그리고 바다로 흘러가기 시작하는 출발점입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 바다에 도착한 화자가 많은 바다 동물을 만나요. 그런데 그들 중 많은 이들이 어려움에 빠져 있었죠. 여기서 글의 문제 상황이 본격적으로 드러납니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 바다거북을 만난 장면이에요. 화자는 낚시 그물에 걸린 바다거북을 만나고, 거북이는 이것으로부터 나를 꺼내 달라고 외칩니다. 화자는 도와주고 싶었지만 할 수 없었고, 그래서 매우 슬펐어요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 파도가 화자를 거대한 쓰레기 섬으로 데려갑니다. 그곳에서 화자는 많은 플라스틱 쓰레기를 보았고, 그곳에서 벗어나고 싶어 해요. 이야기가 플라스틱 문제라는 주제로 모이는 결말 부분입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 화자가 겪은 사건이 시간의 흐름에 따라 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개 방식이다. 상자 밖으로 나옴, 바다에서 동물을 만남, 거북이를 만남, 쓰레기 섬에 도착함으로 장소와 사건이 차례로 바뀐다. 글의 중심 내용인 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b> 문제는 마지막 부분에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Luckily (1)\u003c/b>\u003cspan>도입·전환\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>반전\u003c/span>\u003cb>One time (5)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Then (9)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">get out of the boxes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">in trouble\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">in a fishing net\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a giant trash island\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">get out of there\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간의 흐름에 따라 사건이 이어지는 시간순 전개 방식이에요. 장소가 바뀌고 상황이 차례로 진행되죠. 그리고 글의 중심 생각은 맨 마지막 부분, 플라스틱 쓰레기를 보았다는 대목에서 드러나기 때문에 미괄식 구조라고 볼 수 있어요. 처음부터 끝까지 화자가 겪은 일을 순서대로 따라가면 자연스럽게 주제에 도착합니다.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 첫 번째 문장의 Luckily는 운 좋게 시작되었다는 도입 신호이고, 네 번째 문장의 But은 어려움이 시작된다는 반전 신호예요. 다섯 번째 문장의 One time은 구체적인 예시를 꺼내는 표현이고, 아홉 번째 문장의 Then은 시간이 다음 장면으로 넘어간다는 신호입니다. 그리고 get out of the boxes, in trouble, in a fishing net, get out of there처럼 갇히고 벗어나려는 상황이 표현을 바꿔 가며 반복된다는 점도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>luckily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>운 좋게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>get out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~밖으로 나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>box\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상자\u003c/span>\u003c/div>\u003cdiv>\u003cb>wind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바람\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>wave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파도\u003c/span>\u003c/div>\u003cdiv>\u003cb>take ~ apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 떼어 놓다, 흩어지게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>trouble\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어려움, 곤경\u003c/span>\u003c/div>\u003cdiv>\u003cb>in trouble\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어려움에 빠진\u003c/span>\u003c/div>\u003cdiv>\u003cb>one time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한번은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea turtle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다거북\u003c/span>\u003c/div>\u003cdiv>\u003cb>fishing net\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낚시 그물\u003c/span>\u003c/div>\u003cdiv>\u003cb>get ~ out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 꺼내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다, 소리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>want to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하고 싶다\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>couldn't\u003c/b>\u003cem>동사\u003c/em>\u003cspan>할 수 없었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>슬픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>then\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그때, 그러고 나서\u003c/span>\u003c/div>\u003cdiv>\u003cb>take ~ to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 …로 데리고 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>trash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>island\u003c/b>\u003cem>명사\u003c/em>\u003cspan>섬\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플라스틱\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기, 폐기물\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. get out of는 밖으로 나오다, take apart는 떼어 놓다라는 뜻이고, in trouble은 어려움에 빠진이라는 숙어예요. a fishing net은 낚시 그물, a giant trash island는 거대한 쓰레기 섬이라는 뜻이니 통째로 익혀 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">luckily\u003c/b>\u003cspan class=\"m\">운 좋게도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fortunately\u003c/span>\u003c id\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. luckily는 운 좋게도라는 뜻으로 fortunately와 비슷하고 반대말은 unluckily예요. trouble은 어려움이라는 뜻으로 difficulty, problem과 가깝고, strong은 강한이라는 뜻으로 powerful, mighty와 비슷하지만 weak가 반대말이죠. giant는 거대한이라는 뜻으로 huge, enormous와 가깝고 tiny가 반대말이며, sad는 슬픈이라는 뜻으로 unhappy와 가깝고 happy가 반대말이에요. waste는 쓰레기라는 뜻으로 rubbish, garbage, trash와 바꿔 쓸 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운 좋게도,\u003c/span>\u003cspan class=\"en\">Luckily,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 나올 수 있었어\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자들 밖으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the boxes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">운 좋게도, 우리는 상자들 밖으로 나올 수 있었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자 일행이 상자 밖으로 빠져나온 상황을 말해요. luckily는 '운 좋게도'라는 뜻으로, 위험에서 벗어난 \u003cb class=\"key\">다행\u003c/b>을 나타내죠. 여기서 boxes는 앞 문맥에서 그들이 갇혀 있던 \u003cb class=\"key\">상자\u003c/b>를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형\u003c/span> : [주어] + [[could]] + [동사원형 get] : \"나올 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(관용표현)\u003c/span> : get out of + [장소·공간] : \"~밖으로 나가다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Luckily, 운 좋게도. we could get out, 우리는 나올 수 있었어. of the boxes, 상자들 밖으로. 이 문장 전체를 해석하면, 운 좋게도, 우리는 상자들 밖으로 나올 수 있었어.","hl":"m"},{"n":13,"text":"이 문장은 화자 일행이 상자 밖으로 빠져나온 상황을 말해요. luckily는 운 좋게도라는 뜻으로, 위험에서 벗어난 다행함을 나타내죠. 여기서 boxes는 앞 문맥에서 그들이 갇혀 있던 상자를 가리켜요.","hl":"mn"},{"n":14,"text":"여기서 첫 번째로 볼 것은 could get out이에요. could는 조동사라서 뒤에 동사원형 get이 그대로 오는 거죠. 두 번째는 get out of인데, 이건 밖으로 나가다라는 뜻의 관용표현이에요. 그래서 of 뒤에 boxes가 빠져나온 공간으로 나오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바람이 강해서\u003c/span>\u003cspan class=\"en\">The wind was strong,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 파도가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> the waves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 떨어뜨려 놓았어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">apart\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바람이 강해서 파도가 우리를 떨어뜨려 놓았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바람이 강해서 파도가 화자 일행을 흩어지게 만든 상황을 \u003cb class=\"key\">원인\u003c/b>과 \u003cb class=\"key\">결과\u003c/b>로 이어서 말해요. 앞의 The wind was strong이 원인이 되고, 뒤의 took us apart가 결과가 되죠. apart는 '떨어져'라는 뜻으로 함께 있던 것들의 \u003cb class=\"key\">흩어짐\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 so (결과)\u003c/span> : [원인 문장] + , so + [결과 문장] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 (목적어 + 목적격보어)\u003c/span> : [동사 took] + [목적어 us] + [목적격보어 apart] : \"우리를 떨어져 있게 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The wind was strong, 바람이 강해서. so the waves, 그래서 파도가. took us apart, 우리를 떨어뜨려 놓았어. 이 문장 전체를 해석하면, 바람이 강해서 파도가 우리를 떨어뜨려 놓았어.","hl":"m"},{"n":16,"text":"이 문장은 바람이 강해서 파도가 화자 일행을 흩어지게 만든 상황을 원인과 결과로 이어서 말해요. 앞의 The wind was strong이 원인이 되고, 뒤의 took us apart가 결과가 되는 거죠. apart는 떨어져라는 뜻으로, 함께 있던 것들이 흩어졌다는 걸 보여 줘요.","hl":"mn"},{"n":17,"text":"여기서 첫 번째로 볼 것은 so예요. so는 앞의 원인과 뒤의 결과를 이어 주는 등위접속사죠. 두 번째는 took us apart인데, 이건 동사 took 뒤에 목적어 us가 오고, 그 뒤에 목적격보어 apart가 오는 구조예요. 그래서 우리를 떨어져 있는 상태로 만들었다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 만났어\u003c/span>\u003cspan class=\"en\">I met\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 바다 동물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> sea animals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바다에서 나는 많은 바다 동물을 만났어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바다에서 화자가 많은 바다 동물을 만났다는 내용이에요. In the ocean은 '바다에서'라는 \u003cb class=\"key\">장소\u003c/b>를 알려 주고, a lot of는 '많은'이라는 \u003cb class=\"key\">수량\u003c/b>을 나타내죠. 앞으로 여러 바다 동물과의 만남이 이어질 것을 \u003cb class=\"key\">예고\u003c/b>하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(장소 부사구)\u003c/span> : [전치사 In] + [명사구 the ocean] : \"바다에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현\u003c/span> : a lot of + [복수명사 sea animals] : \"많은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In the ocean, 바다에서. I met, 나는 만났어. a lot of sea animals, 많은 바다 동물을. 이 문장 전체를 해석하면, 바다에서 나는 많은 바다 동물을 만났어.","hl":"m"},{"n":19,"text":"이 문장은 바다에서 화자가 많은 바다 동물을 만났다는 내용이에요. In the ocean은 바다에서라는 장소를 알려 주고, a lot of는 많이라는 수량을 나타내죠. 앞으로 여러 바다 동물과의 만남이 이어질 것을 예고하는 문장이에요.","hl":"mn"},{"n":20,"text":"여기서 첫 번째로 볼 것은 In the ocean이에요. 이건 장소를 나타내는 전치사구로 문장 앞에 나와서 어디서 만났는지 알려 주죠. 두 번째는 a lot of인데, 이건 많이라는 뜻으로 뒤에 복수명사 sea animals가 오는 수량 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들 중 많은 이들이\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려움에 빠져 있었어.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">trouble\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들 중 많은 이들이 어려움에 빠져 있었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 만난 많은 바다 동물들이 \u003cb class=\"key\">어려움\u003c/b>에 처해 있었다는 뜻이에요. 여기서 them은 앞 문장의 \u003cb class=\"key\">sea \u003c/b>\u003cb class=\"key\">animals\u003c/b>를 가리켜요. But으로 시작해 앞 내용을 반대 방향으로 이어 주면서, 이제부터 안타까운 이야기가 시작된다는 신호를 보내는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 표현 many of + 복수대명사(목적격)\u003c/span> : many of + [복수대명사 they의 목적격 them] : \"그들 중 많은 이들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 be in trouble\u003c/span> : be동사 + [in trouble (전치사구)] : \"어려움에 빠져 있었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But many of them, 하지만 그들 중 많은 이들이. were in trouble, 어려움에 빠져 있었어.. 이 문장 전체를 해석하면, 하지만 그들 중 많은 이들이 어려움에 빠져 있었어.","hl":"m"},{"n":22,"text":"여기서 them은 바로 앞 문장에 나온 sea animals를 가리켜요. 그 많은 바다 동물들이 어려움에 처해 있었다는 뜻이죠. But으로 시작해서 앞 문장의 내용을 반대 방향으로 이어 주니까, 이제부터는 안타까운 이야기가 시작된다고 보면 돼요.","hl":"mn"},{"n":23,"text":"먼저 many of them을 볼게요. many of는 전체 중 일부를 나타내는 표현이에요. of는 전치사라서 뒤에 오는 대명사는 주격 they가 아니라 목적격 them을 쓴다는 것, 꼭 기억해 두세요. 그리고 동사는 복수로 취급해서 were를 썼어요. 두 번째로 were in trouble은 관용표현이에요. in trouble은 어려움에 처한, 곤경에 빠진이라는 뜻이니까, 여기서는 어려움에 빠져 있었어로 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한번은,\u003c/span>\u003cspan class=\"en\">One time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 바다거북을 만났어\u003c/span>\u003cspan class=\"en\">I met a sea turtle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낚시 그물에 걸린\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fishing \u003c/span>\u003cspan class=\"tgt\">net\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한번은, 내가 낚시 그물에 걸린 바다거북을 만났어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 어려움에 처한 바다 동물들의 구체적인 예를 하나 꺼내는 문장이에요. \u003cb class=\"key\">One \u003c/b>\u003cb class=\"key\">time\u003c/b>은 '한번은'이라는 뜻으로 예시를 들 때 쓰는 표현이에요. 낚시 그물에 걸려 있는 바다거북의 \u003cb class=\"key\">상황\u003c/b>을 먼저 보여 주고, 바로 다음 문장에서 그 거북이가 하는 말이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사 a sea turtle] + [전치사구 in a fishing net] : \"낚시 그물에 걸린\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사가 명사를 수식하는 합성 표현\u003c/span> : [fishing (동명사)] + [net (명사)] : \"낚시 그물\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One time, 한번은. I met a sea turtle, 내가 바다거북을 만났어. in a fishing net, 낚시 그물에 걸린. 이 문장 전체를 해석하면, 한번은, 내가 낚시 그물에 걸린 바다거북을 만났어.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 어려움에 처한 바다 동물들의 구체적인 예를 들려주는 문장이에요. One time은 한번은이라는 뜻으로, 예를 하나 꺼낼 때 쓰는 표현이죠. 낚시 그물에 걸려 있는 바다거북의 상황을 먼저 보여 주고, 바로 다음 문장에서 그 거북이가 하는 말이 이어져요.","hl":"mn"},{"n":26,"text":"먼저 in a fishing net을 볼게요. 이 전치사구가 앞에 있는 명사 a sea turtle을 뒤에서 꾸며 줘요. 그래서 낚시 그물 속에 있는 바다거북, 즉 낚시 그물에 걸린 바다거북이라는 뜻이 되는 거죠. 이렇게 전치사구가 명사를 수식하는 걸 형용사적 용법이라고 해요. 그리고 fishing net에서 fishing은 낚시하기라는 동명사로 뒤에 오는 net을 꾸며서 낚시용 그물이라는 하나의 명사 덩어리를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것으로부터 나를 꺼내 줘,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Get \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 바다거북이 외쳤지.\u003c/span>\u003cspan class=\"en\">the sea turtle cried.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 낚시 그물에 걸린 바다거북이 구조를 애타게 요청하는 장면이에요. 여기서 this는 바로 앞 문장에 나온 \u003cb class=\"key\">fishing \u003c/b>\u003cb class=\"key\">net\u003c/b>을 가리켜요. 거북이의 말이 그대로 따옴표 안에 들어 있는 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">인용\u003c/b>이라서 상황의 급박함이 아주 생생하게 느껴지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문과 5형식 동사 get\u003c/span> : [동사원형 Get] + [목적어 me] + [목적격보어 out of this] : \"이것으로부터 나를 꺼내 줘\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 out of + 지시대명사\u003c/span> : [out of (전치사구)] + [this] : \"이것으로부터\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"Get me out of this,\", 이것으로부터 나를 꺼내 줘. the sea turtle cried, 라고 바다거북이 외쳤지.. 이 문장 전체를 해석하면, “이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지.","hl":"m"},{"n":28,"text":"낚시 그물에 걸린 바다거북이 구조를 애타게 요청하는 장면이에요. 여기서 this는 바로 앞 문장에 나온 fishing net을 가리켜요. 바다거북의 말이 그대로 따옴표 안에 들어 있어서, 상황의 급박함이 아주 생생하게 느껴지는 문장이죠.","hl":"mn"},{"n":29,"text":"먼저 Get me out of this를 볼게요. 명령문은 주어 you를 생략하고 동사원형으로 문장을 시작해요. get은 목적어를 어떤 상태로 만들다라는 뜻으로 쓰여서, me 뒤에 목적격보어가 오는 구조가 되는 거죠. 두 번째로 out of this에서 out of는 밖으로, 에서 빠져나와라는 뜻을 가진 전치사구예요. 이 부분이 me의 상태를 설명해 주고, this는 앞의 fishing net을 가리켜서 이것으로부터, 즉 이 그물로부터라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 원했어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돕기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 나는\u003c/span>\u003cspan class=\"en\">but I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 수 없었어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 도와주고 싶었지만 할 수 없었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그물에 갇힌 거북이가 도와달라고 외쳤지만, 화자는 도와주고 싶은 \u003cb class=\"key\">마음\u003c/b>만 있었을 뿐 실제로는 아무것도 할 수 없었던 상황이에요. I wanted to help로 바람을 먼저 말하고 but으로 꺾어 주면서 \u003cb class=\"key\">마음과 \u003c/b>\u003cb class=\"key\">행동\u003c/b>의 차이를 드러내고, 이 \u003cb class=\"key\">무력감\u003c/b>이 바로 다음 문장의 슬픔으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want [타동사] + to help [to부정사구/목적어] : \"돕기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정형(과거의 능력 부정)\u003c/span> : could [조동사] + not [부정어] = couldn't : \"할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I wanted, 나는 원했어. to help, 돕기를. but I, 그러나 나는. couldn't, 할 수 없었어. 이 문장 전체를 해석하면, 나는 도와주고 싶었지만 할 수 없었어.","hl":"m"},{"n":31,"text":"거북이가 그물에서 도와달라고 외쳤는데, 화자는 돕고 싶은 마음만 있었고 실제로는 아무것도 할 수 없었던 거예요. 앞에서 바람을 말하고 but으로 꺾어 주니까 마음과 행동의 차이가 확 드러나죠. 그래서 이 무력감이 바로 다음 문장의 슬픔으로 자연스럽게 이어집니다.","hl":"mn"},{"n":32,"text":"여기서 첫 번째로 볼 어법은 to부정사의 명사적 용법이에요. want는 뒤에 to부정사를 목적어로 데려가는 동사라서, to help가 '돕기를'이라는 목적어 역할을 하는 거죠. 두 번째는 couldn't인데요, 과거의 능력을 나타내는 could에 not이 붙어서 '할 수 없었다'라는 뜻이 되고 뒤에 올 help는 반복을 피하려고 생략된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 (그런 상태였어)\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 슬펐어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 매우 슬펐어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도와주지 못했다는 사실이 화자를 \u003cb class=\"key\">슬픔\u003c/b>에 잠기게 했어요. 아주 짧은 문장이지만 앞 문장의 \u003cb class=\"key\">무력감\u003c/b>을 감정으로 정리해 주는 역할을 하죠. 부사 so가 슬픔의 \u003cb class=\"key\">정도\u003c/b>를 한층 강하게 밀어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격보어)과 부사 so의 강조\u003c/span> : I [주어] + was [be동사/2형식] + so sad [주격보어] : \"나는 매우 슬펐다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I was, 나는 (그런 상태였어). so sad, 매우 슬펐어. 이 문장 전체를 해석하면, 나는 매우 슬펐어.","hl":"m"},{"n":34,"text":"도와주고 싶었는데 아무것도 못 했다는 사실이 화자를 슬픔에 잠기게 했어요. 문장이 아주 짧지만, 앞 문장의 무력감을 감정으로 정리해 주는 역할을 하죠. so가 슬픔의 정도를 한층 강하게 밀어 준다는 것도 기억해 두세요.","hl":"mn"},{"n":35,"text":"여기서 짚을 어법은 2형식 문장이에요. be동사 뒤에 형용사 sad가 와서 주어인 I의 상태를 설명하는 주격보어가 되죠. 그리고 그 앞에 온 부사 so가 형용사 sad를 강조해서 슬픔의 정도를 훨씬 크게 만들어 준다는 점도 같이 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파도가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">waves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 데리고 갔어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 쓰레기 섬으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">giant \u003c/span>\u003cspan class=\"tgt\">trash \u003c/span>\u003cspan class=\"tgt\">island\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 파도가 나를 거대한 쓰레기 섬으로 데리고 갔어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 슬퍼하던 화자를 파도가 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>으로 밀어 보내면서 장소가 바뀌고, 다음 문장에서 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>를 목격하게 되는 계기가 됩니다. Trash island는 바다 위에 쓰레기가 모여 실제로 만들어진 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 Then(시간 순서 연결)\u003c/span> : Then [접속부사] + 주어 + 동사 : \"그때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the(특정 대상 지시)\u003c/span> : the [정관사] + waves [복수명사] : \"그 파도가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">take + 목적어 + to + 장소(전치사 to)\u003c/span> : take [동사] + me [목적어] + to [전치사] + 장소 : \"나를 거대한 쓰레기 섬으로 데려갔다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Then, 그때. the waves, 파도가. took me, 나를 데리고 갔어. to a giant trash island, 거대한 쓰레기 섬으로. 이 문장 전체를 해석하면, 그때 파도가 나를 거대한 쓰레기 섬으로 데리고 갔어.","hl":"m"},{"n":37,"text":"슬퍼하던 화자를 파도가 거대한 쓰레기 섬으로 밀어 보내면서 이야기의 장소가 확 바뀌어요. 여기서 trash island는 바다 위에 쓰레기가 모여 실제로 만들어진 쓰레기 섬을 말하죠. 이 장면이 바로 다음 문장에서 플라스틱 쓰레기를 목격하게 되는 계기가 됩니다.","hl":"mn"},{"n":38,"text":"어법 첫 번째는 문장 맨 앞의 Then이에요. 이건 접속부사라서 앞 내용에 이어 다음 사건이 시간 순서대로 일어났다는 걸 알려 줘요. 두 번째는 the waves인데요, 앞에서 이미 파도가 나왔기 때문에 부정관사 a가 아니라 정관사 the를 써서 특정 대상을 가리키는 거예요. 세 번째는 took me to a giant trash island인데, 여기서 to는 to부정사가 아니라 전치사예요. 그래서 뒤에 동사원형이 아니라 명사구 a giant trash island가 온 거고, take A to B는 'A를 B로 데려가다'라는 관용 표현으로 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보았지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱 쓰레기를\u003c/span>\u003cspan class=\"en\">plastic waste.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 많은 플라스틱 쓰레기를 보았지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 파도가 나를 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>으로 데려갔죠. 그 섬에 도착한 내 눈에 들어온 것은 바로 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>였어요. 이 문장은 쓰레기 섬의 모습을 보여 주면서, 다음 문장에서 내가 왜 그곳을 떠나고 싶어 했는지 알려 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : 주어 + [타동사 saw] + [목적어 a lot of plastic waste] : \"보았지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(a lot of + 명사)\u003c/span> : a lot of + [불가산명사 / 복수명사] : \"많은\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"I, 나는. saw, 보았지. a lot of, 많은. plastic waste, 플라스틱 쓰레기를. 이 문장 전체를 해석하면, 나는 많은 플라스틱 쓰레기를 보았지.","hl":"m"},{"n":40,"text":"앞 문장에서 파도가 나를 거대한 쓰레기 섬으로 데려갔죠. 그 섬에 도착한 내 눈에 들어온 건 바로 플라스틱 쓰레기였어요. 이 문장은 쓰레기 섬의 모습을 보여 주면서, 다음 문장에서 내가 왜 그곳을 떠나고 싶어 했는지 알려 주는 역할을 해요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 동사 saw예요. see는 보다라는 뜻의 타동사라서 무엇을 보았는지 알려 주는 목적어가 꼭 필요하죠. 그래서 a lot of plastic waste가 목적어 자리에 온 거예요. 두 번째는 a lot of인데요, many나 much 대신 쓰는 수량 표현이에요. 셀 수 없는 명사 waste 앞에서도 자연스럽게 많은이라는 뜻을 만들어 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원했지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벗어나기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그곳에서 벗어나고 싶었어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>에서 많은 플라스틱 쓰레기를 본 뒤, 나는 그곳에 더 있고 싶지 않았어요. wanted to는 '~하고 싶었다'라는 \u003cb class=\"key\">감정\u003c/b>을 나타내서, 앞에서 느낀 슬픔이 그곳을 떠나고 싶은 마음으로 이어지는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(want의 목적어)\u003c/span> : want + [to + 동사원형] : \"벗어나고 싶었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 전치사)\u003c/span> : get out of + [장소] : \"~에서 벗어나다, 빠져나가다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I, 나는. wanted, 원했지. to get out of, 벗어나기를. there, 그곳에서. 이 문장 전체를 해석하면, 나는 그곳에서 벗어나고 싶었어.","hl":"m"},{"n":43,"text":"거대한 쓰레기 섬에서 많은 플라스틱 쓰레기를 본 뒤, 나는 그곳에 더 있고 싶지 않았어요. wanted to는 하고 싶었다는 감정을 나타내서, 앞에서 느낀 슬픔이 그곳을 떠나고 싶은 마음으로 이어지는 거예요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 wanted to get out of there예요. want 뒤에는 무엇을 하고 싶은지 알려 주는 목적어가 필요한데, 동사는 그대로 목적어가 될 수 없어서 to부정사로 바꿔 준 거죠. 그래서 to부정사가 명사처럼 목적어 역할을 하고 있어요. 두 번째는 get out of인데요, 안에 있던 곳에서 빠져나오다라는 뜻의 덩어리 표현이에요. 여기서는 쓰레기 섬이라는 공간에서 벗어나고 싶다는 의미로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>운 좋게 상자 밖으로 나온 플라스틱은 강한 바람과 \u003cb class=\"key\">파도\u003c/b> 때문에 흩어져 바다로 갔다.\u003c/li>\u003cli>바다에서 만난 많은 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">동물\u003c/b>들은 \u003cb class=\"key\">어려움\u003c/b>에 빠져 있었다.\u003c/li>\u003cli>화자는 \u003cb class=\"key\">낚시 \u003c/b>\u003cb class=\"key\">그물\u003c/b>에 걸린 바다거북을 만났지만 도와주지 못해 매우 슬펐다.\u003c/li>\u003cli>결국 파도가 화자를 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>으로 데려갔고, 화자는 많은 플라스틱 쓰레기를 보고 그곳을 벗어나고 싶어 했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Plastic waste that flows into the ocean harms sea animals and piles up into giant trash islands.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">운 좋게 상자 밖으로 나온 플라스틱이 파도에 흩어져 바다로 흘러가, 어려움에 빠진 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">동물\u003c/b>들을 만나고 마침내 거대한 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">섬\u003c/b>에 도착해 그곳을 벗어나고 싶어 한다. 이 글은 바다에 버려진 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">쓰레기\u003c/b>가 바다 생물을 위협한다는 것을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 내용을 정리해 볼게요. 상자 밖으로 나온 플라스틱은 파도에 흩어져 바다로 갔고, 어려움에 빠진 바다 동물들을 만났으며, 마침내 거대한 쓰레기 섬에 도착했어요. 이 이야기가 우리에게 말하는 것은 결국 플라스틱 쓰레기가 바다 생물을 위협한다는 사실입니다. 여러분도 작은 플라스틱 하나를 버릴 때 그 뒤에 어떤 일이 일어나는지 한 번쯤 떠올려 보면 좋겠어요. 오늘도 수고했고, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
