 점을 찾아 수정하는 과정입니다.</li><li>게임을 직접 플레이하며 의견 공유(shared ideas)</li><li>새로운 단계 추가 및 아이템 보완(added more items)</li><li>핵심 키워드: 테스트(Testing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04게임 출시</div><ul><li>완성된 게임을 시장에 내놓고 팀워크의 성과를 확인합니다.</li><li>앱 시장에 게임을 최종적으로 출시(published)</li><li>사용자들로부터 많은 후기를 받음</li><li>핵심 키워드: 팀워크(teamwork)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adventure</td><td class=\"m\">모험</td></tr><tr><td class=\"w\">work together</td><td class=\"m\">협력하다, 함께 일하다</td></tr><tr><td class=\"w\">begin</td><td class=\"m\">시작되다</td></tr><tr><td class=\"w\">monster</td><td class=\"m\">괴물</td></tr><tr><td class=\"w\">go through</td><td class=\"m\">~을 통과하다, ~을 거치다</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한</td></tr><tr><td class=\"w\">choose</td><td class=\"m\">선택하다</td></tr><tr><td class=\"w\">item</td><td class=\"m\">품목, 물건</td></tr><tr><td class=\"w\">get off</td><td class=\"m\">~에서 떠나다, ~에서 내리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">background</td><td class=\"m\">배경</td></tr><tr><td class=\"w\">character</td><td class=\"m\">등장인물, 캐릭터</td></tr><tr><td class=\"w\">code</td><td class=\"m\">코딩하다, 암호화하다</td></tr><tr><td class=\"w\">put together</td><td class=\"m\">조립하다, 합치다</td></tr><tr><td class=\"w\">share</td><td class=\"m\">공유하다, 나누다</td></tr><tr><td class=\"w\">idea</td><td class=\"m\">생각, 아이디어</td></tr><tr><td class=\"w\">add</td><td class=\"m\">추가하다</td></tr><tr><td class=\"w\">useful</td><td class=\"m\">유용한</td></tr><tr><td class=\"w\">publish</td><td class=\"m\">출판하다, 발표하다(게시하다)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 30</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요!</span><span class=\"en\"><b>Hi!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 현수입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">I'm</span> Hyunsu.</b></span></div></div><div class=\"lec-sent-ko\">(안녕하세요! 저는 현수입니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 자신을 소개하며 게임 제작 과정을 이야기할 화자를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I&#39;m (관용표현): 주어(I)와 be동사(am)를 축약한 형태로, 자기소개를 할 때 쓰는 기본 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 30</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난여름,</span><span class=\"en\"><b>Last summer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저와 제 친구들은</span><span class=\"en\"><b>my friends and I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리만의 모험 게임인</span><span class=\"en\"><b><span class=\"grammar-hl\">our own adventure game</span>, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“잃어버린 섬”을.</span><span class=\"en\"><b>“The Lost Island.</b></span></div></div><div class=\"lec-sent-ko\">지난여름, 내 친구들과 나는 우리만의 모험 게임인 ‘잃어버린 섬’을 만들었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 전체적인 주제인 &#39;게임 제작 경험&#39;을 소개하며 본격적인 내용을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made our own adventure game 5형식(SVOC) 구조: &#39;make + O + C&#39;에서 O(adventure game)를 C(name)로 꾸며주거나 명명하는 구조가 확장된 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adventure</td><td class=\"m\">모험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 30</div>\n
