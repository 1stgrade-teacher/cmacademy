\">02알래스카 주 박람회 방문</div><ul><li>필자와 사촌 지미는 박람회에 가서 다양한 행사에 참여했다.</li><li>지미의 나무 자르기(wood cutting) 게임 도전</li><li>아쉽게도 상품을 받지 못한 지미</li><li>핵심 키워드: 박람회(Fair)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03지역 특색 음식 시식</div><ul><li>박람회에서 필자는 생소하지만 맛있는 특별한 음식을 먹었다.</li><li>신선한 연어를 넣은 샌드위치(salmon sandwiches) 시식</li><li>평소 즐겨 먹던 햄과 치즈 샌드위치와의 차이점</li><li>핵심 키워드: 연어(Salmon)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04거대 채소 경연대회</div><ul><li>풍부한 일조량 덕분에 알래스카에서는 채소가 매우 크게 자란다.</li><li>엄청난 크기의 호박(pumpkin)을 본 필자</li><li>여름철 하루 20시간에 달하는 일조량</li><li>핵심 키워드: 수확물(crops)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05하루 마무리</div><ul><li>늦은 시간까지 밝은 알래스카의 여름밤을 즐기며 일정을 마쳤다.</li><li>밤 10시에도 어둡지 않은 풍경</li><li>즐거웠던 알래스카에서의 하루</li><li>핵심 키워드: 여름(summer)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visit</td><td class=\"m\">방문하다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">실제로, 사실은</td></tr><tr><td class=\"w\">set</td><td class=\"m\">(해가) 지다</td></tr><tr><td class=\"w\">sign up for</td><td class=\"m\">~에 등록하다, 참가 신청하다</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">응원하다, 환호하다</td></tr><tr><td class=\"w\">prize</td><td class=\"m\">상, 상품</td></tr><tr><td class=\"w\">wet</td><td class=\"m\">젖은</td></tr><tr><td class=\"w\">food court</td><td class=\"m\">푸드 코트 (음식점들이 모여 있는 곳)</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">salmon</td><td class=\"m\">연어</td></tr><tr><td class=\"w\">tasty</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">fresh</td><td class=\"m\">신선한</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한</td></tr><tr><td class=\"w\">contest</td><td class=\"m\">대회, 경연</td></tr><tr><td class=\"w\">enter</td><td class=\"m\">(대회 등에) 참가하다</td></tr><tr><td class=\"w\">crop</td><td class=\"m\">농작물, 수확물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난 여름에,</span><span class=\"en\"><b>Last summer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 방문했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">visited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 삼촌을</span><span class=\"en\"><b>my uncle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알래스카에 있는</span><span class=\"en\"><b>in Alaska.</b></span></div></div><div class=\"lec-sent-ko\">지난 여름, 나는 알래스카에 계신 삼촌을 방문했어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 나타내는 제목으로, 필자가 알래스카에서 보낸 여름방학 경험에 대해 서술할 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">visited (과거시제): 일반동사의 과거형으로 &#39;방문했다&#39;는 과거의 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visit</td><td class=\"m\">방문하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">너는 추측할 수 있니</span><span class=\"en\"><b><span class=\"grammar-hl\">Can you guess</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을</span><span class=\"en\"><b>the time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진 속의</span><span class=\"en\"><b>in the picture?</b></span></div></div><div class=\"lec-sent-ko\">사진 속 시간을 추측할 수 있겠니?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 호기심을 유발하고, 알래스카의 독특한 자연 현상을 자연스럽게 소개하기 위한 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can you guess (조동사): Can(할 수 있다)이 주어 앞에 위치하여 의문문을 구성합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실은 ~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> actually</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 9시</span><span class=\"en\"><b>9 p.m.</b></span></div></div><div class=\"lec-sent-ko\">사실은 오후 9시였어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 상식(오후 9시면 어두워야 함)과 실제 상황이 다름을 보여주며 뒤에 나올 설명의 근거를 마련합니다. 여기서 actually는 사전적으로는 &#39;실제로&#39;라는 뜻이지만, 여기서는 &#39;상식 밖의 상황임을 강조&#39;하기 위해 쓰였습니다. 독자가 가질 의아함을 해소함과 동시에 알래스카의 특수성을 극대화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was (be동사): 과거형으로 상태를 나타내는 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">실제로, 사실은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나의 삼촌이</span><span class=\"en\"><b>My uncle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말씀하셨다,</span><span class=\"en\"><b>said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“태양은</span><span class=\"en\"><b>“The sun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">doesn’t set</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5월부터 7월까지.</span><span class=\"en\"><b>from May to July.</b></span></div></div><div class=\"lec-sent-ko\">나의 삼촌은 말씀하셨어. “태양이 5월부터 7월까지 지지 않는단다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 백야 현상에 대한 설명을 통해 앞 문장의 의문점에 대한 답을 제공합니다. Midnight Sun은 사전적으로는 &#39;한밤중의 태양&#39;이지만 여기서는 &#39;밤에도 해가 떠 있는 현상(백야)&#39;을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doesn’t set (현재시제): 일반동사의 부정문으로 습관적이거나 불변하는 자연 현상을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set</td><td class=\"m\">(해가) 지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알래스카는 ~이다</span><span class=\"en\"><b>Alaska is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘땅’</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">The Land</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한밤중의 태양의</span><span class=\"en\"><b><span class=\"grammar-hl\">of the Midnight Sun</span>.’”</b></span></div></div><div class=\"lec-sent-ko\">그래서 알래스카는 ‘한밤중의 태양의 땅’이라고 하지.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 백야 현상에 대한 설명을 통해 앞 문장의 의문점에 대한 답을 제공합니다. Midnight Sun은 사전적으로는 &#39;한밤중의 태양&#39;이지만 여기서는 &#39;밤에도 해가 떠 있는 현상(백야)&#39;을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Land of the Midnight Sun (명사구): 문장에서 주격 보어로 쓰여 Alaska의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삼촌이</span><span class=\"e </span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 10시에,</span><span class=\"en\"><b>at 10 p.m.,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 그리 어둡지 않았다.</span><span class=\"en\"><b>it was not so dark.</b></span></div></div><div class=\"lec-sent-ko\">우리가 밤 10시에 축제를 떠났을 때, 그렇게 어둡지 않았어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다시 한번 알래스카의 백야 현상을 언급하며 글의 도입부와 수미상관 구조를 형성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When we left the fair at 10 p. m. (관계부사(접속사)): when은 시간을 나타내는 부사절을 이끄는 접속사로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 23</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재밌는 하루.</span><span class=\"en\"><b><span class=\"grammar-hl\">a fun day.</span></b></span></div></div><div class=\"lec-sent-ko\">재밌는 하루였어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 알래스카에서의 하루를 전체적으로 정리하며 만족스러운 소감을 밝히는 마무리 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was a fun day. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>필자가 여름방학을 맞아 알래스카의 삼촌을 방문했다.</li><li>알래스카의 백야 현상으로 인해 밤늦게까지 환한 풍경을 경험했다.</li><li>주 박람회에 방문해 나무 자르기 게임을 보고 지역 특산물인 연어 샌드위치를 먹었다.</li><li>백야의 긴 일조량 덕분에 거대하게 자란 채소들을 구경했다.</li><li>알래스카만의 독특한 자연 현상과 문화를 즐긴 즐거운 여행이었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author visited Alaska and learned about the midnight sun, while also enjoying local foods and the unique agriculture of the region.</div>\n              <div class=\"lec-final-sum-ko\">필자는 알래스카를 방문해 백야 현상에 대해 배우고, 그 지역의 음식과 독특한 농작물을 즐겼다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],[{"audio":"./full_audio/19.mp3","hl":"main"},{"audio":"./full_audio/20.mp3","hl":"meaning"},{"audio":"./full_audio/21.mp3","hl":"grammar"}],[{"audio":"./full_audio/22.mp3","hl":"main"},{"audio":"./full_audio/23.mp3","hl":"meaning"},{"audio":"./full_audio/24.mp3","hl":"grammar"}],[{"audio":"./full_audio/25.mp3","hl":"main"},{"audio":"./full_audio/26.mp3","hl":"meaning"},{"audio":"./full_audio/27.mp3","hl":"grammar"}],[{"audio":"./full_audio/28.mp3","hl":"main"},{"audio":"./full_audio/29.mp3","hl":"meaning"},{"audio":"./full_audio/30.mp3","hl":"grammar"}],[{"audio":"./full_audio/31.mp3","hl":"main"},{"audio":"./full_audio/32.mp3","hl":"meaning"},{"audio":"./full_audio/33.mp3","hl":"grammar"}],[{"audio":"./full_audio/34.mp3","hl":"main"},{"audio":"./full_audio/35.mp3","hl
