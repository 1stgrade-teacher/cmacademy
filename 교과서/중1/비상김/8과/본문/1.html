li>다른 활동인 자전거 타기(bike ride)에 도전하고 싶어 함</li><li>새로운 경험을 통해 자신감(confidence)을 얻음</li><li>핵심 키워드: 도전(challenge), 자신감(confidence)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">눈이 먼</td></tr><tr><td class=\"w\">stick</td><td class=\"m\">지팡이</td></tr><tr><td class=\"w\">homeroom teacher</td><td class=\"m\">담임 선생님</td></tr><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">be interested in</td><td class=\"m\">~에 흥미가 있다</td></tr><tr><td class=\"w\">be sure</td><td class=\"m\">확신하는</td></tr><tr><td class=\"w\">tie</td><td class=\"m\">묶다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">string</td><td class=\"m\">끈</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임</td></tr><tr><td class=\"w\">carefully</td><td class=\"m\">조심스럽게, 주의 깊게</td></tr><tr><td class=\"w\">blow</td><td class=\"m\">불다</td></tr><tr><td class=\"w\">finish line</td><td class=\"m\">결승선</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr><tr><td class=\"w\">proud</td><td class=\"m\">자랑스러운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">앤디의 이야기는</span><span class=\"en\"><b><span class=\"grammar-hl\">Andy’s Story</span></b></span></div></div><div class=\"lec-sent-ko\">(앤디의 이야기)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 자신의 신체적 상황을 직접적으로 밝히며, 앞으로 이어질 이야기의 배경이 되는 자신의 한계점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Andy’s Story (관용표현): 소유격(&#39;s)을 사용하여 &#39;앤디의 이야기&#39;라는 소유 관계를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m blind.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">앞이 보이지 않습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 시각 장애인이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 자신의 신체적 상황을 직접적으로 밝히며, 앞으로 이어질 이야기의 배경이 되는 자신의 한계점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m blind. (관용표현): be동사(am)를 사용하여 상태나 형용사를 서술하는 2형식 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">눈이 먼</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 걷습니다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">walk with a stick</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지팡이를 짚고.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 지팡이를 이용하여 걷는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 시각장애라는 상태를 구체적인 행동으로 설명합니다. 여기서 stick은 사전적으로 &#39;막대기&#39;지만, 문맥상 &#39;흰 지팡이(시각장애인용 지팡이)&#39;를 의미하며, 화자의 일상적인 이동 수단임을 나타내기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">walk with a stick (관용표현): &#39;with a stick&#39;은 도구를 나타내는 전치사구로 동사 walk를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stick</td><td class=\"m\">지팡이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">담임 선생님께서</span><span class=\"en\"><b>my homeroom teacher</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말씀하시기를,</span><span class=\"en\"><b>said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교 행사가 있을 것이라고,</span><span class=\"en\"><b>“There will be a school event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우정 마라톤이라는.</span><span class=\"en\"><b><span class=\"grammar-hl\">Friendship Marathon</span>.</b></span></div></div><div class=\"lec-sent-ko\">(어느 날, 담임 선생님께서 말씀하셨습니다, “학교 행사인 우정 마라톤이 있을 것이다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기가 시작되는 계기입니다. 선생님의 발언은 화자에게 새로운 도전의 기회가 주어졌음을 알리는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Friendship Marathon (관용표현): 고유명사와 일반명사의 동격 구조로, 마라톤의 이름을 구체적으로 명시함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">homeroom teacher</td><td class=\"m\">담임 선생님</td></tr><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 행사에서,</span><span class=\"en\"><b>In this event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 사람이 달립니다</span><span class=\"en\"><b>two people <span class=\"grammar-hl\">run</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 팀이 되어.</span><span class=\"en\"><b><span class=\"grammar-hl\">as a team</span>.</b></span></div></div><div class=\"lec-sent-ko\">(이 행사에서, 두 사람이 한 팀이 되어 달립니다.”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤의 규칙을 설명합니다. 혼자 달릴 수 없는 화자에게 이 규칙은 참여가 가능하다는 희망을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">run as a team (관용표현): &#39;as a team&#39;은 &#39;팀으로서&#39;라는 자격을 나타내는 전치사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가</span><span class=\"en\"><b>Everyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해 이야기했습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">talked about it</span>.</b></span></div></div><div class=\"lec-sent-ko\">모든 사람들이 그것에 대해 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤이 학교의 큰 화젯거리였음을 보여주며, 화자 역시 자연스럽게 이 흐름에 관심을 두게 되었음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked about it (관용표현): 동사 talk와 전치사 about이 결합하여 특정 대상에 대해 논의함을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저 또한</span><span class=\"en\"><b>I also</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미가 생겼습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">got interested</span>.</b></span></div></div><div class=\"lec-sent-ko\">나도 관심이 생겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 친구들이 마라톤을 논의하는 분위기를 보고 화자 역시 도전해보고 싶은 마음이 생겼음을 보여줍니다. 7. “But can I run?” 자신의 신체적 제약을 고려했을 때 현실적으로 가능한지 스스로 질문하며, 도전 전의 망설임과 불안을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got interested (과거분사): &#39;be/get+p.p.&#39; 형태의 수동적 상태 표현. interest는 타동사인데 목적어가 없어서 수동구조(got interested)로 쓴다. 기본구조: interest O (O의 관심을 끌다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>“But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 달릴 수 있을까요?</span><span class=\"en\"><b><span class=\"grammar-hl\">can I run</span>?</b></span></div></div><div class=\"lec-sent-ko\">“하지만 내가 뛸 수 있을까?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스스로에 대한 의구심을 표현하며, 마라톤 참여를 결정하기 전의 갈등을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can I run (간접의문문): 문장 성분상 의문문을 포함하며, 주어와 동사의 어순이 바뀌어 의문형 구조를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확신이 서지 않았습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was not sure</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 확신할 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스스로에 대한 의구심을 표현하며, 마라톤 참여를 결정하기 전의 갈등을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was not sure (관용표현): 형용사 sure 뒤에 생략된 that절이 이어질 수 있는 상태 서술 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 20</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래
