하는 협동심(Teamwork)을 배우게 해준답니다. 마치 우리가 2인 3각 경기를 할 때 파트너와 발을 맞추기 위해 서로의 속도를 살피는 것처럼, 가이드 러닝은 서로를 온전히 믿고 의지해야만 완주할 수 있는 멋진 경험인 셈이죠.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01마라톤 도전의 시작</div><ul><li>시각장애인인 앤디가 친구 준하의 제안으로 우정 마라톤에 참가하기로 결심한다.</li><li>혼자서는 달릴 수 있을지 확신이 없었음 (not sure)</li><li>가장 친한 친구인 준하의 도움으로 참가를 결정함</li><li>핵심 키워드: 우정 마라톤(Friendship Marathon), 안내자(guide runner)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마라톤을 위한 준비와 실천</div><ul><li>두 사람은 서로의 움직임을 느끼기 위해 끈을 활용하여 연습하며 호흡을 맞춘다.</li><li>끈(string)을 손가락에 묶어 서로의 동작을 감지함</li><li>장애물이나 방향 전환에 대해 서로 소통함</li><li>핵심 키워드: 끈(string), 소통(communication)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03마라톤 완주와 변화</div><ul><li>경기 중 힘든 순간도 있었지만, 포기하지 않고 함께 결승선을 통과하며 성취감을 느낀다.</li><li>비록 1등은 아니었지만 최선을 다해 완주함</li><li>앤디는 새로운 일에 도전할 용기를 얻음</li><li>준하는 끝까지 해냈다는 사실에 큰 기쁨을 느낌</li><li>핵심 키워드: 결승선(finish line), 성취감(sense of achievement)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">눈이 먼, 시각 장애가 있는</td></tr><tr><td class=\"w\">stick</td><td class=\"m\">지팡이</td></tr><tr><td class=\"w\">homeroom teacher</td><td class=\"m\">담임 선생님</td></tr><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr><tr><td class=\"w\">team</td><td class=\"m\">팀, 조</td></tr><tr><td class=\"w\">be interested in</td><td class=\"m\">~에 관심이 있다</td></tr><tr><td class=\"w\">sure</td><td class=\"m\">확신하는</td></tr><tr><td class=\"w\">tie</td><td class=\"m\">묶다</td></tr><tr><td class=\"w\">string</td><td class=\"m\">끈, 줄</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 동작</td></tr><tr><td class=\"w\">carefully</td><td class=\"m\">주의 깊게, 신중하게</td></tr><tr><td class=\"w\">blow</td><td class=\"m\">(바람이) 불다</td></tr><tr><td class=\"w\">finish line</td><td class=\"m\">결승선</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr><tr><td class=\"w\">proud</td><td class=\"m\">자랑스러워하는</td></tr><tr><td class=\"w\">sign up for</td><td class=\"m\">~에 신청하다, 등록하다</td></tr><tr><td class=\"w\">guide</td><td class=\"m\">안내자, 가이드</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m blind.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시각장애인입니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 시각 장애인이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 시각 장애인임을 밝히며, 일상생활에서 이동을 위해 지팡이에 의존해야 하는 자신의 신체적 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m blind. (보어(C)): 형용사인 blind가 주어의 상태를 보충 설명하는 2형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">눈이 먼, 시각 장애가 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 걷는데</span><span class=\"en\"><b>I walk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지팡이를 짚고.</span><span class=\"en\"><b><span class=\"grammar-hl\">with a stick</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 지팡이를 이용하여 걷는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자가 시각 장애인임을 밝히며, 일상생활에서 이동을 위해 지팡이에 의존해야 하는 자신의 신체적 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with a stick (관용표현): 전치사 with를 사용하여 수단이나 도구(~을 가지고)를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stick</td><td class=\"m\">지팡이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">담임 선생님께서 말씀하셨는데</span><span class=\"en\"><b><span class=\"grammar-hl\">my homeroom teacher</span> said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교 행사가 있을 것이라고,</span><span class=\"en\"><b>“There will be a school event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우정 마라톤이라는.</span><span class=\"en\"><b>Friendship Marathon.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, 나의 담임 선생님께서 “‘우정 마라톤’이라는 학교 행사가 있을 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학교에서 마라톤 대회가 열린다는 소식을 전하며, 뒤에 이어질 &#39;함께 달리는 활동&#39;의 계기를 마련해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">my homeroom teacher (관용표현): 학교에서 담임 선생님을 지칭하는 명사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">homeroom teacher</td><td class=\"m\">담임 선생님</td></tr><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 행사에서는,</span><span class=\"en\"><b>In this event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 사람이 달리는데</span><span class=\"en\"><b><span class=\"grammar-hl\">two people run</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 팀으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">as a team</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.”라고 말씀하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 장애라는 현실적인 제약 때문에 자신의 참여 가능성에 대해 의구심을 갖는 심리적 갈등을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">two people run as a team 5형식(SVOC) 구조와 유사한 목적지향적 표현: run(동사) + as a team(전치사구)으로 팀의 형태로 달린다는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">event</td><td class=\"m\">행사</td></tr><tr><td class=\"w\">team</td><td class=\"m\">팀, 조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모두가 이야기했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">Everyone talked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해.</span><span class=\"en\"><b><span class=\"grammar-hl\">about it.</span></b></span></div></div><div class=\"lec-sent-ko\">모든 사람들이 그것에 대해 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주변의 들뜬 분위기에 화자 역시 참여하고 싶다는 호기심과 의욕을 느끼기 시작했음을 보여줍니다. 4. “But can I run?” I was not sure. 장애라는 현실적인 제약 때문에 자신의 참여 가능성에 대해 의구심을 갖는 심리적 갈등을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Everyone talked about it. (관용표현): talk about은 &#39;~에 대해 이야기하다&#39;라는 의미의 자동사+전치사 결합구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저 또한</span><span class=\"en\"><b>I also <span class=\"grammar-hl\">got interested</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미가 생겼습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나도 관심이 생겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤을 완주하기 위한 구체적인 방법(끈)을 제시하며, 시각 장애인인 Andy와 그를 돕는 준하가 어떻게 물리적으로 연결되는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got interested (수동태): be동사(got은 여기서 상태 변화를 나타내는 get) + p.p.(interested) 구조입니다. interest는 &#39;관심을 끌다&#39;라는 타동사인데, 목적어가 주어로 나가면서 수동구조 get interested(관심이 생기다) 형태로 씁니다. 기본구조: interest A (A의 관심을 끌다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>“But <span class=\"grammar-hl\">can I run?</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 달릴 수 있을까요?</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">“하지만 내가 뛸 수 있을까?”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞을 볼 수 없는 Andy가 준하의 안내에 전적으로 의지하며 달리는 협동의 과정을 묘사하고, 그로 인해 느끼는 해방감과 기쁨을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can I run? (도치): 의문문 구조에서 조동사 can이 주어 I 앞으로 이동한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I <span class=\"grammar-hl\">was not sure</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확신이 서지 않았습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 확신할 수 없었다.</div></div>\n        <div class=\"lec-grammar div><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">앤디와 함께 달렸고</span><span class=\"en\"><b>ran with Andy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 안내하며</span><span class=\"en\"><b>and guided him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동시에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at the same time</span>.</b></span></div></div><div class=\"lec-sent-ko\">마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;made it&#39;은 사전적으로 &#39;성공해내다, 해내다&#39;라는 뜻인데, 여기서는 힘든 과정 끝에 완주라는 목표를 달성했음을 강조합니다. 단순히 도착했다는 사실보다 고난을 극복하고 결과를 만들어냈다는 점을 강조하려고 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at the same time (관용표현): &#39;동시에&#39;를 의미하는 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guide</td><td class=\"m\">안내자, 가이드</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 28 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘들었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was hard</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리는 것을 멈추지 않았습니다.</span><span class=\"en\"><b>didn’t stop running.</b></span></div></div><div class=\"lec-sent-ko\">그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was hard (가주어): 진주어: 문맥상 뒤의 생략된 내용 혹은 상황을 지칭하며, hard는 보어로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>At last,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도착했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">made it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결승선에!</span><span class=\"en\"><b><span class=\"grammar-hl\">to the finish line</span>!</b></span></div></div><div class=\"lec-sent-ko\">마침내, 우리는 결승선에 도착했다!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it to the finish line (관용표현): make it은 &#39;~에 성공적으로 도착하다/해내다&#39;라는 의미의 숙어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finish line</td><td class=\"m\">결승선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 30 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우승하지 못했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">didn’t win</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경주에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">the race</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그 경주에서 우승하지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결과(우승)보다는 과정(최선)에 가치를 두는 성숙한 태도를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t win the race (관용표현): win the race는 경주에서 이기다라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알았는데</span><span class=\"en\"><b><span class=\"grammar-hl\">knew</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 최선을 다했다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">that we did our best</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 나는 우리가 최선을 다했다는 것을 알았다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">knew that we did our best (명사절): that이 이끄는 절이 동사 knew의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무언가를 끝내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Finishing something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽지 않았는데</span><span class=\"en\"><b>was not easy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저에게.</span><span class=\"en\"><b>for me.</b></span></div></div><div class=\"lec-sent-ko\">무언가를 끝내는 것은 나에게 쉽지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 준하 역시 이번 경험을 통해 포기하지 않고 끝까지 수행해내는 경험을 얻었음을 나타내며, 둘 모두에게 이 도전이 긍정적인 의미를 가졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Finishing something (동명사): 문장에서 주어 역할을 하는 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이번에는</span><span class=\"en\"><b><span class=\"grammar-hl\">this time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해냈습니다!</span><span class=\"en\"><b><span class=\"grammar-hl\">did it!</span></b></span></div></div><div class=\"lec-sent-ko\">그러나 이번에는 나는 해냈다!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">this time I did it! (관용표현): this time은 &#39;이번에는&#39;을 의미하는 부사적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 행복.</span><span class=\"en\"><b><span class=\"grammar-hl\">very happy</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 매우 행복했다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was very happy (보어(C)): 형용사인 happy가 주어의 상태를 설명하는 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 35 / 35</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">앤디도</span><span class=\"en\"><b>Andy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행복해 보였는데</span><span class=\"en\"><b><span class=\"grammar-hl\">looked happy,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역시.</span><span class=\"en\"><b><span class=\"grammar-hl\">too</span>.</b></span></div></div><div class=\"lec-sent-ko\">Andy도 행복해 보였다.</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked happy, too (보어(C)): 감각동사 look 뒤에 형용사 보어 happy가 온 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>시각 장애인인 Andy는 친구 준하와 함께 &#39;우정 마라톤&#39;에 참가하기로 합니다.</li><li>둘은 끈을 연결해 서로의 움직임을 느끼며 훈련했고, 마라톤 당일 협동을 통해 결승선까지 완주합니다.</li><li>Andy는 할 수 있다는 자신감을 얻었고, 준하 또한 끝까지 포기하지 않고 해내는 성취감을 느꼈습니다.</li><li>결과적으로 두 사람 모두 도전을 통해 스스로 성장하는 계기가 되었습니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The two friends overcame their fears and physical limitations by practicing together, and they ultimately gained confidence through the experience of finishing the marathon.</div>\n              <div class=\"lec-final-sum-ko\">두 친구는 함께 연습하며 두려움과 신체적 한계를 극복했고, 마라톤 완주 경험을 통해 자신감을 얻었다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"}],[{"audio":"./full_audio/7.mp3","hl":null}],[{"audio":"./full_audio/8.mp3","hl":"main"},{"audio":"./full_audio/9.mp3","hl":"meaning"},{"audio":"./full_audio/10.mp3","hl":"grammar"}],[{"audio":"./full_audio/11.mp3","hl":"main"},{"audio":"./full_audio/12.mp3","hl":"meaning"},{"audio":"./full_audio/13.mp3","hl":"grammar"}],[{"audio":"./full_audio/14.mp3","hl":"main"},{"audio":"./full_audio/15.mp3","hl":"meaning"},{"audio":"./full_audio/16.mp3","hl":"grammar"}],[{"audio":"./full_audio/17.mp3","hl":"main"},{"audio":"./full_audio/18.mp3","hl":"meaning"},{"audio":"./full_audio/19.mp3","hl":"grammar"}],[{"audio":"./full_audio/20.mp3","hl":"main"},{"audio":"./full_audio/21.mp3","hl":"mean
