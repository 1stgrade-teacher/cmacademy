<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 비상(황) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 비상(황) 8과 본문2","audioDir":"2_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>비상(황)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>We Didn't Win, but We Finished It Together\u003c/h1>\u003ch2>우리는 이기지 못했지만 함께 끝까지 해냈다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>준하는 Andy의 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>가 되어 끈으로 함께 연습하고, 마라톤에서 힘들어도 멈추지 않고 \u003cb class=\"key\">결승선\u003c/b>에 도착했다. 우승하지는 못했지만 \u003cb class=\"key\">최선을 \u003c/b>\u003cb class=\"key\">다했다\u003c/b>는 사실에 둘은 행복해했고, 무언가를 \u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 쉽지 않았던 준하는 이번에는 해냈다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even though we didn't win the race, finishing it together and doing our best made me truly happy.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일 학년 비상 황 교과서 여덟 과 본문 두 번째, Junha's Story를 함께 읽어 볼 거예요. 준하와 Andy가 우정 마라톤에 함께 등록해서 결승선까지 달리는 이야기인데요. 우승이 아니라 완주와 최선을 다하는 마음이 핵심이에요. 그래서 오늘 글의 요지는 우리가 경주에서 이기지는 못했지만 끝까지 해냈다는 사실이 준하를 정말 행복하게 했다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">마라톤에는 눈이 보이지 않는 선수를 돕는 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>(guide runner)가 함께 달릴 수 있어요. 두 사람은 손이나 \u003cb class=\"key\">끈\u003c/b>(tether, string)으로 연결되어 같은 속도와 보폭을 유지하는데, 이런 방식을 \u003cb class=\"key\">페어 \u003c/b>\u003cb class=\"key\">러닝\u003c/b>(tandem running)이라고 불러요. 가이드 러너는 장애물과 방향을 실시간으로 알려 주는 '눈'의 역할을 하죠. 마치 친구와 눈을 감고 한 줄로 이어져 걷는 놀이처럼, 서로의 신호에 전적으로 의지해야만 앞으로 나아갈 수 있어요. 그래서 이런 경기에서는 기록보다 \u003cb class=\"key\">신뢰\u003c/b>(trust)와 호흡이 중요하고, 완주 자체가 큰 성취가 된답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 마라톤에는 눈이 보이지 않는 선수를 돕는 가이드 러너가 함께 달릴 수 있어요. 두 사람은 손이나 끈으로 연결되어 같은 속도와 보폭을 유지하는데, 이걸 페어 러닝이라고 불러요. 가이드 러너는 장애물과 방향을 실시간으로 알려 주는 눈의 역할을 하죠. 친구와 눈을 감고 한 줄로 이어져 걷는 놀이를 생각하면 이해가 쉬워요. 서로의 신호에 전적으로 의지해야만 앞으로 나아갈 수 있기 때문에, 이런 경기에서는 기록보다 신뢰와 호흡이 중요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>함께하기로 한 결심\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>준하의 이야기가 시작된다. Andy와 준하는 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에 등록하고, 준하는 Andy의 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>가 된다. 두 사람은 \u003cb class=\"key\">끈\u003c/b>을 이용해서 매일 함께 뛰며 호흡을 맞춘다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연습과 소통\u003csmall>예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>달리는 도중에 준하는 Andy에게 자전거가 오고 있으니 오른쪽으로 움직이자고 \u003cb class=\"key\">안내\u003c/b>한다. 이렇게 한 \u003cb class=\"key\">팀\u003c/b>으로서 두 사람은 마라톤에서 우승하기 위해 열심히 연습한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>마라톤 본경기\u003csmall>전개 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>마라톤 동안 준하는 Andy와 함께 뛰면서 동시에 그를 \u003cb class=\"key\">안내\u003c/b>한다. 그것은 힘들었지만 두 사람은 \u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 계속 뛰었고, 마침내 \u003cb class=\"key\">결승선\u003c/b>에 도착한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결과와 깨달음\u003csmall>결론 · 문장 10–15\u003c/small>\u003c/h4>\u003cp>두 사람은 그 경주에서 우승하지 못했지만, 준하는 우리가 \u003cb class=\"key\">최선을 \u003c/b>\u003cb class=\"key\">다했다\u003c/b>는 것을 안다. 무언가를 \u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 준하에게 쉽지 않았지만 이번에는 해냈고, 그래서 준하도 Andy도 행복해 보인다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 함께하기로 한 결심이에요. 준하의 이야기가 시작되고, Andy와 준하가 우정 마라톤에 등록해요. 그리고 준하는 Andy의 가이드 러너가 되죠. 두 사람은 끈을 이용해서 매일 함께 뛰면서 호흡을 맞춰요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 연습과 소통이에요. 달리는 도중에 준하는 Andy에게 자전거가 오고 있으니까 오른쪽으로 움직이자고 안내해요. 이렇게 한 팀으로서 두 사람은 마라톤에서 우승하기 위해 열심히 연습합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 마라톤 본경기예요. 마라톤 동안 준하는 Andy와 함께 뛰면서 동시에 그를 안내해요. 그것은 힘들었지만 두 사람은 뛰는 것을 멈추지 않았고, 마침내 결승선에 도착하죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결과와 깨달음이에요. 두 사람은 그 경주에서 우승하지 못했지만, 준하는 우리가 최선을 다했다는 것을 알아요. 무언가를 끝내는 것은 준하에게 쉽지 않았는데 이번에는 해냈고, 그래서 준하도 Andy도 행복해 보여요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 등록에서 연습, 경기, 완주, 깨달음으로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개를 따른다. 우승이라는 \u003cb class=\"key\">통념\u003c/b>적 결과가 아니라 완주와 최선이라는 \u003cb class=\"key\">주제\u003c/b>를 마지막에 제시하므로 \u003cb class=\"key\">미괄식\u003c/b>이다. 마지막의 &quot;But this time I did it!&quot;이 글쓴이의 핵심 메시지를 담고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>every day (3)\u003c/b>\u003cspan>반복·시간\u003c/span>\u003cb>During the marathon (7)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>At last (9)\u003c/b>\u003cspan>시간·결말\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>But this time (13)\u003c/b>\u003cspan>대조·강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">practiced hard\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't stop running\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">made it to the finish line\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Finishing something\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">did our best\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">did it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 등록에서 연습, 경기, 완주, 깨달음으로 이어지는 시간순 전개 방식이에요. 그리고 결론에 해당하는 주제가 맨 마지막에 나오기 때문에 미괄식 구조라고 볼 수 있어요. 실제로 글의 주제문은 Finishing something was not easy for me, 그리고 But this time I did it이라는 마지막 부분이에요. 그러니까 사건을 시간 순서대로 늘어놓고, 그 끝에서 글쓴이의 진짜 메시지를 던져 주는 구성이죠.","hl":"ty"},{"n":9,"text":"신호어도 꼭 챙겨야 해요. every day는 매일이라는 반복과 시간을, During the marathon은 마라톤 동안이라는 시간 전환을 알려 줘요. At last는 마침내라는 결말의 신호이고요. 또 But과 But this time은 앞의 내용을 뒤집는 전환과 대조의 신호라서, 뒤에 오는 문장이 글의 핵심이라는 걸 알려 줍니다. 같은 개념을 바꿔 말한 표현도 눈여겨보세요. practiced hard에서 didn't stop running으로, 그리고 made it to the finish line과 did our best, 마지막으로 did it으로 이어지면서 완주와 최선이라는 하나의 개념을 계속 다시 말해 주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sign up for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 등록하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우정\u003c/span>\u003c/div>\u003cdiv>\u003cb>marathon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마라톤\u003c/span>\u003c/div>\u003cdiv>\u003cb>guide runner\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가이드 러너, 안내 주자\u003c/span>\u003c/div>\u003cdiv>\u003cb>runner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주자, 달리는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>run\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뛰다, 달리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>string\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끈, 줄\u003c/span>\u003c/div>\u003cdiv>\u003cb>come\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>to the right\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오른쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>team\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팀, 한 팀\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연습하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard\u003c/b>\u003cem>부사\u003c/em>\u003cspan>열심히, 힘들게\u003c/span>\u003c/div>\u003cdiv>\u003cb>win\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이기다, 우승하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>guide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안내하다, 인도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the same time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>동시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at last\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마침내, 드디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 도착하다, 해내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결승선\u003c/span>\u003c/div>\u003cdiv>\u003cb>race\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경주, 경기\u003c/span>\u003c/div>\u003cdiv>\u003cb>do one's best\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최선을 다하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끝내다, 마치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>this time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이번에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>look\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~해 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>too\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한, 역시\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. sign up for는 등록하다, guide runner는 가이드 러너, string은 끈이라는 뜻이에요. practice는 연습하다, win은 이기다, at the same time은 동시에라는 표현이고요. make it to는 도착하다라는 뜻으로 여기서는 결승선에 도착했다는 의미로 쓰였어요. do one's best는 최선을 다하다라는 아주 중요한 숙어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sign up for\u003c/b>\u003cspan class=\"m\">등록하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">register for\u003c/span>\u003cspan class=\"s\">enroll in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cancel\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">together\u003c/b>\u003cspan class=\"m\">함께\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">jointly\u003c/span>\u003cspan class=\"s\">as a team\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alone\u003c/span>\u003cspan class=\"a\">separately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">practice\u003c/b>\u003cspan class=\"m\">연습하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">train\u003c/span>\u003cspan class=\"s\">rehearse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">win\u003c/b>\u003cspan class=\"m\">이기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">beat\u003c/span>\u003cspan class=\"s\">defeat\u003c/span>\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hard\u003c/b>\u003cspan class=\"m\">힘든, 열심히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"s\">strenuous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">halt\u003c/span>\u003cspan class=\"s\">cease\u003c/span>\u003cspan class=\"s\">quit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">at last\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">finally\u003c/span>\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">in the end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">at first\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">행복한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. sign up for의 동의어는 register for와 enroll in이고, 반대말은 cancel이나 withdraw예요. together는 jointly, as a team과 뜻이 통하고 반대말은 alone, separately죠. practice는 train, rehearse와 가깝고, win은 beat, defeat와 동의어이며 반대말은 lose, fail이에요. hard는 difficult, tough와 바꿔 쓸 수 있고, stop은 halt, cease와 동의어에 반대말은 continue, keep이에요. at last는 finally, eventually와 같은 뜻이고, 마지막으로 happy는 glad, delighted, pleased와 같은 뜻이며 반대말은 sad, unhappy랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준하의 이야기\u003c/span>\u003cspan class=\"en\">Junha's Story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Andy와 나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Andy \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">등록했다\u003c 리는 열심히 연습했다\u003c/span>\u003cspan class=\"en\">we practiced hard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마라톤에서 우승하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">win \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">marathon\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 준하와 앤디가 한 팀으로서 마라톤 우승을 목표로 함께 연습한 것을 말해요. As a team은 '한 팀으로서'라는 \u003cb class=\"key\">자격\u003c/b>을, to win은 '우승하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타냅니다. 이 다짐이 뒤에 나오는 완주 장면의 \u003cb class=\"key\">복선\u003c/b>이 되어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as(~로서, ~으로서)\u003c/span> : as + [명사] : \"한 팀으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어] + [동사] + ... + to부정사(목적) : \"마라톤에서 우승하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As a team, 한 팀으로서. we practiced hard, 우리는 열심히 연습했다. to win the marathon, 마라톤에서 우승하기 위해. 이 문장 전체를 해석하면, 한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.","hl":"m"},{"n":28,"text":"이 문장은 준하와 앤디가 한 팀으로서 마라톤 우승을 목표로 함께 연습한 것을 말해요. As a team은 한 팀으로서라는 자격을 나타내고, to win은 우승하기 위해라는 목적을 나타내죠. 두 사람의 이 약속이 뒤에 나오는 완주 장면의 복선이 되어 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 As a team을 보세요. as는 로서라는 자격이나 역할을 나타내는 전치사라서 a team 앞에 붙어 한 팀으로서라는 전치사구를 만들어요. 두 번째로 to win the marathon을 보세요. to부정사가 뒤에 오면 하기 위해라는 목적을 나타내는 부사적 용법이 됩니다. practiced hard라는 행동의 이유를 설명해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마라톤 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">marathon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Andy와 함께 뛰었고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ran \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">Andy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그를 안내했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">guided \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 주하가 Andy와 함께 달리면서 동시에 길을 안내하는 장면을 보여 줘요. 두 가지 일을 한꺼번에 해냈다는 점이 핵심이고, 여기서 I는 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>인 주하를 가리켜요. 앞 문장에서 함께 연습한 팀워크가 실제 경기에서도 그대로 이어지고 있다는 흐름을 이어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(때)\u003c/span> : during + [명사(기간·행사)] → [문장 전체를 수식] : \"마라톤 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사구 병렬\u003c/span> : [동사 과거형 A] + and + [동사 과거형 B] : \"Andy와 함께 뛰었고 그를 안내했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현(부사구)\u003c/span> : at the same time → [두 가지 일이 동시에 일어남] : \"동시에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"During the marathon, 마라톤 동안. I ran with Andy, 나는 Andy와 함께 뛰었고. and guided him, 그리고 그를 안내했다. at the same time, 동시에. 이 문장 전체를 해석하면, 마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다.","hl":"m"},{"n":31,"text":"이 문장은 주하가 Andy와 함께 달리면서 동시에 길을 안내하는 장면을 보여 줘요. 두 가지 일을 한꺼번에 해냈다는 점이 핵심이에요. 여기서 I는 가이드 러너인 주하를 가리키고, 앞 문장에서 함께 연습한 팀워크가 실제 경기에서도 그대로 이어지고 있다는 흐름을 이어 주는 문장이에요.","hl":"mn"},{"n":32,"text":"어법 포인트 세 가지 짚어 볼게요. 첫 번째는 During the marathon이에요. during은 특정 기간이나 행사 전체 앞에 붙어서 시간의 의미를 더해 주는 전치사죠. 두 번째는 ran with Andy and guided him인데, and가 과거 동사 두 개를 나란히 연결하는 병렬 구조예요. 그래서 앞뒤 동사의 시제와 형태를 똑같이 맞춰 줘야 해요. 세 번째는 at the same time이에요. 이건 동시에라는 뜻으로 굳어진 관용 표현이니 통째로 외워 두면 시험에서 바로 써먹을 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 힘들었지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 뛰는 것을 멈추지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">running\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 It은 날씨나 시간이 아니라, 바로 앞에서 말한 '함께 뛰며 안내하는 일' 전체를 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>예요. 힘들었지만 \u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>는 이 문장이 끝까지 해내려는 두 사람의 태도를 잘 보여 줘요. 다음 문장의 결승선 도착 장면으로 이어지는 힘든 과정을 압축해 놓은 문장이기도 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it(앞 내용 지칭)\u003c/span> : It(앞 문장·상황 전체) + be동사 + 형용사 : \"그것은 힘들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [문장 A] + but + [문장 B] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사 stop\u003c/span> : stop + [동명사(-ing)] → [~하는 것을 멈추다] : \"뛰는 것을 멈추지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It was hard, 그것은 힘들었지만. but we didn't stop running, 우리는 뛰는 것을 멈추지 않았다. 이 문장 전체를 해석하면, 그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.","hl":"m"},{"n":34,"text":"여기서 It은 날씨나 시간이 아니라, 바로 앞에서 말한 함께 뛰면서 안내하는 그 일 전체를 가리키는 지시대명사예요. 힘들었지만 멈추지 않았다는 이 문장이 이 글의 태도를 잘 보여 주죠. 그래서 다음에 나오는 결승선 도착 장면이 더 감동적으로 다가와요.","hl":"mn"},{"n":35,"text":"어법 포인트 순서대로 볼게요. 첫 번째, It was hard에서 it은 날씨나 시간의 it이 아니라 앞 문장의 상황 전체를 받는 지시대명사예요. 두 번째, but은 앞의 힘들었다와 뒤의 멈추지 않았다를 대조로 이어 주는 등위접속사예요. 세 번째가 제일 중요해요. didn't stop running에서 stop 뒤에 동명사 running이 왔다는 걸 꼭 기억하세요. stop 뒤에 동명사가 오면 하던 행동을 멈추다라는 뜻이고, to부정사가 오면 멈추고 나서 다른 걸 하러 가다라는 뜻이 돼요. 시험에서 이 둘을 바꿔 놓는 문제가 정말 많이 나오니까 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">At \u003c/span>\u003cspan class=\"tgt\">last\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 해냈다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결승선까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">finish \u003c/span>\u003cspan class=\"tgt\">line\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, 우리는 결승선에 도착했다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 어려운 과정을 버텨 낸 끝에 \u003cb class=\"key\">결승선에 \u003c/b>\u003cb class=\"key\">도착\u003c/b>한 순간을 강조해요. made it이라는 표현에는 그냥 도착한 것이 아니라 어렵게 \u003cb class=\"key\">해냈다\u003c/b>는 뿌듯함이 담겨 있어요. 그래서 마침내라는 표현과 함께 두 사람의 성취가 감동적으로 마무리되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사구(문장 부사)\u003c/span> : At last, + [주어 + 동사] : \"마침내\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 make it to + 장소\u003c/span> : make it to + [장소] → [~에 (어렵게) 도착하다] : \"결승선에 도착했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"At last, 마침내. we made it, 우리는 해냈다. to the finish line!, 결승선까지. 이 문장 전체를 해석하면, 마침내, 우리는 결승선에 도착했다!","hl":"m"},{"n":37,"text":"이 문장은 어려운 과정을 버텨 낸 끝에 결승선에 도착한 순간을 강조해요. made it에는 그냥 도착한 게 아니라 어렵게 해냈다는 뿌듯함이 담겨 있죠. 그래서 마침내라는 표현과 함께 두 사람의 성취가 감동적으로 마무리돼요.","hl":"mn"},{"n":38,"text":"어법 포인트 두 가지 짚어 볼게요. 첫 번째, At last는 문장 맨 앞에서 오랜 과정 끝에 마침내라는 시간의 의미를 더해 주는 부사구예요. 두 번째, made it to the finish line에서 make it은 해내다, 성공하다라는 관용 표현이고, 뒤에 to와 장소가 오면 그곳까지 도착하다라는 뜻이 돼요. 그래서 결승선에 도착했다로 해석하는 거예요. 참고로 하나를 도착하다, 라고 직역하면 어색하니 관용 표현째로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우승하지 못했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">win\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 경주에서\u003c/span>\u003cspan class=\"en\">the race.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그 경주에서 우승하지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 완주에 성공한 직후에 나오는 문장으로, 결과만 보면 \u003cb class=\"key\">우승\u003c/b>하지 못했다는 사실을 담담하게 인정하는 부분이에요. 이 실패에도 불구하고 다음 문장에서 \u003cb class=\"key\">최선\u003c/b>을 다했다는 가치로 초점이 옮겨 가기 때문에, 이 문장은 흐름을 뒤집는 징검다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거시제의 부정문\u003c/span> : 주어 + [[did not]](didn't) + [[동사원형]] : \"우승하지 못했다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"We, 우리는. didn't win, 우승하지 못했다. the race, 그 경주에서. 이 문장 전체를 해석하면, 우리는 그 경주에서 우승하지 못했다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 완주에 성공한 바로 뒤에 나와서, 결과만 보면 우승하지 못했다는 사실을 담담하게 인정하는 부분이에요. 그런데 이 실패에도 불구하고 다음 문장에서 최선을 다했다는 가치로 초점이 옮겨 가기 때문에, 이 문장은 흐름을 뒤집는 징검다리 역할을 합니다.","hl":"mn"},{"n":41,"text":"여기서 꼭 봐야 할 어법 포인트는 첫 번째, 일반동사 과거의 부정문이에요. didn't win, 이렇게 did not 뒤에는 반드시 동사원형 win이 온다는 점을 기억해 두세요. 과거라는 표시는 이미 did가 하고 있으니까 win에 또 과거형을 붙이면 안 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 알았다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">knew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 최선을 다했다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">best\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나는 우리가 최선을 다했다는 것을 알았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경주에서 \u003cb class=\"key\">우승\u003c/b>하지 못한 결과를 부정하지 않으면서도, 그보다 중요한 가치가 \u003cb class=\"key\">최선\u003c/b>을 다한 것임을 말하는 문장이에요. 앞 문장의 아쉬움과 이 문장의 뿌듯함이 But으로 연결되면서 글의 초점이 '결과'에서 '과정'으로 바뀝니다. knew는 '알고 있었다'는 확신의 느낌을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (목적어절)\u003c/span> : 주어 + [[동사]](knew) + [[that]] + 주어 + 동사 ~ : \"우리가 최선을 다했다는 것을 알았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 do one's best\u003c/span> : do + [[소유격]] + best : \"최선을 다했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But, 하지만. I knew, 나는 알았다. that we did our best, 우리가 최선을 다했다는 것을. 이 문장 전체를 해석하면, 하지만 나는 우리가 최선을 다했다는 것을 알았다.","hl":"m"},{"n":43,"text":"이 문장은 우승하지 못한 결과를 부정하지 않으면서도, 그보다 중요한 가치가 최선을 다한 것임을 말하고 있어요. 앞 문장의 아쉬움과 이 문장의 뿌듯함이 But으로 이어지면서, 글의 초점이 결과에서 과정으로 바뀌는 거죠. knew는 단순히 아는 게 아니라 확신하고 있었다는 느낌을 담고 있어요.","hl":"mn"},{"n":44,"text":"어법 포인트는 첫 번째, 명사절 접속사 that이에요. knew 뒤에 목적어로 절이 통째로 들어가니까 그 절 앞에 that을 붙여 줍니다. that절 안에는 주어 we와 동사 did가 다 있는 완전한 문장이 온다는 것도 꼭 챙겨 두세요. 두 번째, did our best는 최선을 다하다라는 뜻의 관용표현이에요. 주어 we에 맞춰 소유격은 our, 과거 시제는 did로 바뀐 형태라는 점을 기억하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를 끝내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Finishing \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무언가를 끝내는 것은 나에게 쉽지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내가 이번 완주를 왜 그렇게 기뻐했는지 그 이유를 깔아 주는 배경 문장이에요. 원래 나는 \u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">것\u003c/b> 자체가 어려운 사람이었다는 고백이 먼저 나오고, 다음에 '이번에는 해냈다'가 이어지면서 감동이 커집니다. be not easy \u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">me\u003c/b>는 '나에게 쉽지 않다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [[동명사]](~ing) + 단수 동사 : \"무언가를 끝내는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 부정문과 for + 사람\u003c/span> : 주어 + [[was not]] + 형용사 + [[for]] + 사람 : \"나에게 쉽지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Finishing something, 무언가를 끝내는 것은. was not easy, 쉽지 않았다. for me, 나에게. 이 문장 전체를 해석하면, 무언가를 끝내는 것은 나에게 쉽지 않았다.","hl":"m"},{"n":46,"text":"이 문장은 내가 이번 완주를 왜 그렇게 기뻐했는지 그 이유를 깔아 주는 배경 문장이에요. 원래 나는 끝내는 것 자체가 어려운 사람이었다는 고백이 먼저 나오고, 바로 다음에 이번에는 해냈다가 이어지면서 감동이 훨씬 커지는 구조죠. be not easy for me는 나에게 쉽지 않다는 뜻이에요.","hl":"mn"},{"n":47,"text":"어법 포인트 첫 번째, Finishing something은 동명사가 주어로 나온 형태예요. 동사를 주어 자리에 쓰려면 -ing를 붙여 명사처럼 만들어야 하고, 그때는 단수로 취급해서 be동사를 was로 써 줍니다. 두 번째, was not easy for me를 보세요. be동사 뒤에 not을 붙여 부정을 만들고, 누구에게 쉬운지를 말할 때는 형용사 뒤에 for와 사람 목적격을 붙인다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 이번에는\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 해냈다!\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이번에는 나는 해냈다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 \u003cb class=\"key\">무엇인가를 \u003c/b>\u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">일\u003c/b>은 나에게 쉽지 않았다고 했어요. 그런데 이번에는 달랐다는 뜻으로, \u003cb class=\"key\">해냈다\u003c/b>는 성취감을 강조하는 문장이에요. \u003cb class=\"key\">But\u003c/b>이 앞의 어려움과 이번의 성공을 대비시켜 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시형용사 this + 명사(시간 부사구)\u003c/span> : [this + 명사(time)] → '이번에는' (전치사 없이 쓰는 시간 부사구) : \"이번에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사 did + 지시대명사 it\u003c/span> : [did] = 앞에 나온 동사(finish)를 대신함 + [it] = 앞의 내용을 받음 : \"그것을 해냈다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"But this time, 그러나 이번에는. I did it!, 나는 해냈다!. 이 문장 전체를 해석하면, 그러나 이번에는 나는 해냈다!","hl":"m"},{"n":49,"text":"바로 앞 문장에서 뭔가를 끝내는 건 나에게 쉽지 않았다고 했죠. 그런데 이번에는 달랐다는 거예요. 그래서 이 문장은 내가 해냈다는 뿌듯함을 강조하는 문장이에요.","hl":"mn"},{"n":50,"text":"먼저 did it을 볼게요. did는 앞에 나온 finish를 다시 쓰지 않고 대신한 대동사예요. 그래서 나는 해냈다라고 해석하죠. 그리고 it은 그것, 즉 앞에서 말한 일을 가리키는 지시대명사고요. 또 this time은 이번에는이라는 뜻의 시간 부사구예요. 그래서 이번에는이라는 말이 문장 앞에 놓여 앞의 어려움과 이번의 성공을 대비시켜 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 행복했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">happy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 매우 행복했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤을 \u003cb class=\"key\">끝까지 \u003c/b>\u003cb class=\"key\">해낸\u003c/b> 뒤의 감정을 보여 주는 문장이에요. 앞 문장의 성취가 \u003cb class=\"key\">행복\u003c/b>이라는 감정으로 이어지며, \u003cb class=\"key\">very\u003c/b>가 그 정도를 강하게 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(be동사 + 주격보어 형용사)\u003c/span> : [주어 I] + [be동사 was] + [형용사 happy (주격보어)] : \"매우 행복했다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"I, 나는. was very happy, 매우 행복했다.. 이 문장 전체를 해석하면, 나는 매우 행복했다.","hl":"m"},{"n":52,"text":"마라톤을 끝까지 해냈다는 사실에 내가 얼마나 기뻤는지를 보여 주는 문장이에요. 앞 문장의 해냈다는 성취감이 여기서 행복이라는 감정으로 이어지죠.","hl":"mn"},{"n":53,"text":"I was very happy는 be동사 was 뒤에 형용사 happy가 온 2형식 문장이에요. be동사 뒤에 형용사가 오면 주어의 상태를 설명하는 주격보어가 돼요. 그래서 나는 매우 행복했다라고 해석하죠. very는 그 행복의 정도를 강하게 만들어 주는 부사고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앤디\u003c/span>\u003cspan class=\"en\">Andy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복해 보였다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">happy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Andy도 행복해 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나뿐만 아니라 함께 달린 \u003cb class=\"key\">Andy\u003c/b>도 기뻐 보였다는 뜻이에요. \u003cb class=\"key\">too\u003c/b>가 앤디를 앞의 나와 같은 상황에 더해 주면서, 두 사람 모두 \u003cb class=\"key\">만족\u003c/b>했음을 보여 주고 이야기를 따뜻하게 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사(주격보어)\u003c/span> : [감각동사 look] + [형용사 happy (주격보어)] → '~하게 보이다' : \"행복해 보였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too\u003c/span> : [앞에 나온 내용] + [too] → '~도 또한' : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Andy, 앤디. looked happy, 행복해 보였다. too, 또한.. 이 문장 전체를 해석하면, Andy도 행복해 보였다.","hl":"m"},{"n":55,"text":"나뿐만 아니라 함께 달린 앤디도 기뻐 보였다는 뜻이에요. 두 사람 모두 만족했다는 걸 보여 주면서 이야기를 따뜻하게 마무리하죠.","hl":"mn"},{"n":56,"text":"looked happy에서 look은 감각동사예요. 감각동사 뒤에는 부사가 아니라 형용사가 와서 행복해 보인다는 뜻을 만들어요. 그래서 looked happy는 행복해 보였다로 해석하고, 이것도 2형식 문장이에요. 마지막 too는 앤디도라는 뜻으로, 앞에서 행복했다는 나에 앤디를 더해 주는 첨가의 부사랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Andy와 준하는 \u003cb class=\"key\">우정 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에 등록하고, 준하는 Andy의 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>가 되었다.\u003c/li>\u003cli>두 사람은 \u003cb class=\"key\">끈\u003c/b>을 이용해 매일 함께 연습하며 한 \u003cb class=\"key\">팀\u003c/b>으로서 우승을 준비했다.\u003c/li>\u003cli>마라톤에서 힘들었지만 \u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 마침내 \u003cb class=\"key\">결승선\u003c/b>에 도착했고, 우승은 못 했지만 \u003cb class=\"key\">최선을 \u003c/b>\u003cb class=\"key\">다했다\u003c/b>.\u003c/li>\u003cli>무언가를 \u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 쉽지 않았던 준하에게 이번 완주는 큰 성취였고, 둘은 \u003cb class=\"key\">행복\u003c/b>해했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even though we didn't win the race, finishing it together and doing our best made me truly happy.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">준하는 Andy의 \u003cb class=\"key\">가이드 \u003c/b>\u003cb class=\"key\">러너\u003c/b>가 되어 끈으로 함께 연습하고, 마라톤에서 힘들어도 멈추지 않고 \u003cb class=\"key\">결승선\u003c/b>에 도착했다. 우승하지는 못했지만 \u003cb class=\"key\">최선을 \u003c/b>\u003cb class=\"key\">다했다\u003c/b>는 사실에 둘은 행복해했고, 무언가를 \u003cb class=\"key\">끝내는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 쉽지 않았던 준하는 이번에는 해냈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"정리해 볼게요. 오늘 글은 준하가 Andy의 가이드 러너가 되어서 끈으로 함께 연습하고, 마라톤에서 힘들어도 멈추지 않고 결승선에 도착한 이야기였어요. 우승은 하지 못했지만 최선을 다했다는 사실, 그리고 무언가를 끝내는 것이 쉽지 않았던 준하가 이번에는 해냈다는 점이 핵심이에요. 여러분도 결과보다 끝까지 해내는 과정의 가치를 꼭 기억해 주세요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
