. 마라톤(Marathon)과 같은 긴 여정에서는 혼자서 속도를 내는 것보다 함께 보조를 맞추며 끝까지 완주하는 과정(Process) 자체가 결과보다 더 큰 의미를 지니기도 합니다. 여러분도 누군가와 함께 목표를 향해 달렸던 경험을 떠올려 보면, 오늘 읽을 준하와 앤디의 이야기가 얼마나 값진 것인지 더 깊이 공감할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01준비 과정</div><ul><li>준하와 앤디는 마라톤 대회를 목표로 함께 훈련을 시작했다.</li><li>준하는 앤디의 가이드 러너(guide runner)가 되어 함께 달림</li><li>끈(string)으로 서로를 연결해 호흡을 맞춤</li><li>핵심 키워드: 가이드 러너(guide runner), 훈련(practiced)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마라톤 실전</div><ul><li>힘든 상황 속에서도 두 사람은 포기하지 않고 끝까지 경기에 집중했다.</li><li>준하는 앤디에게 상황을 설명하며 방향을 안내함</li><li>육체적으로 힘들었지만 멈추지 않고 계속 달림</li><li>핵심 키워드: 결승선(finish line), 안내(guided)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03완주의 기쁨</div><ul><li>비록 우승은 하지 못했지만, 최선을 다했다는 사실에 큰 성취감을 느꼈다.</li><li>경기 결과와 상관없이 최선을 다했음을 깨달음</li><li>완주 자체가 준하에게 특별한 의미를 가짐</li><li>서로의 행복을 확인하며 도전의 가치를 느낌</li><li>핵심 키워드: 최선(did our best), 성취(finishing)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sign up for</td><td class=\"m\">~에 등록하다, 신청하다</td></tr><tr><td class=\"w\">guide</td><td class=\"m\">안내자, 가이드</td></tr><tr><td class=\"w\">string</td><td class=\"m\">끈, 줄</td></tr><tr><td class=\"w\">come</td><td class=\"m\">오다, 다가오다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습하다</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">during</td><td class=\"m\">~동안에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at the same time</td><td class=\"m\">동시에</td></tr><tr><td class=\"w\">at last</td><td class=\"m\">마침내, 드디어</td></tr><tr><td class=\"w\">make it to</td><td class=\"m\">~에 도착하다, 해내다</td></tr><tr><td class=\"w\">finish line</td><td class=\"m\">결승선</td></tr><tr><td class=\"w\">race</td><td class=\"m\">경주, 시합</td></tr><tr><td class=\"w\">do one&#39;s best</td><td class=\"m\">최선을 다하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Andy와 나는</span><span class=\"en\"><b>Junha’s Story Andy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘우정 마라톤’에 등록했다.</span><span class=\"en\"><b>and I <span class=\"grammar-hl\">signed up for</span> Friendship Marathon.</b></span></div></div><div class=\"lec-sent-ko\">준하의 이야기</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> signed up for는 사전적으로는 &#39;서명하여 등록하다&#39;인데, 여기서는 어떤 대회나 모임에 참여하기로 결심하고 명단에 이름을 올렸다는 뜻입니다. 단순히 이름을 적는 행위가 아니라, 앞으로의 도전을 공식적으로 시작하겠다는 의지를 보여주기 위해 이 표현을 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">signed up for (관용표현): &#39;등록하다/신청하다&#39;라는 뜻의 숙어로, 뒤에 목적어(Friendship Marathon)를 취하는 타동사구 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 가이드 러너였다.</span><span class=\"en\"><b>his guide runner.</b></span></div></div><div class=\"lec-sent-ko\">나는 그의 가이드 러너였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 마라톤에 신청했다는 사실을 밝힌 뒤, 주인공인 &#39;나&#39;가 구체적으로 어떤 역할을 맡았는지 설명하며 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: 주어(I)와 보어(his guide runner)를 연결하는 상태 동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guide</td><td class=\"m\">안내자, 가이드</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 뛰며</span><span class=\"en\"><b><span class=\"grammar-hl\">ran</span> together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끈을 이용하여.</span><span class=\"en\"><b>with a string.</b></span></div></div><div class=\"lec-sent-ko\">우리는 끈을 이용하여 매일 함께 뛰었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 &#39;안내 주자&#39;의 역할을 수행하기 위해 앤디와 내가 구체적으로 어떻게 달렸는지 보여줍니다. 여기서 string은 단순히 끈을 의미하지만, 시각 장애인인 앤디와 주인공을 하나로 연결해 주는 &#39;의사소통의 도구&#39;이자 &#39;신뢰의 상징&#39;으로 쓰였습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ran 1형식 구조: &#39;달리다&#39;라는 의미의 자동사로, 뒤에 부사구(together, every day, with a string)가 이어지는 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">string</td><td class=\"m\">끈, 줄</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 “Andy, 자전거가 오고 있어.</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>told him, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>“Andy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b>a bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">is coming</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 끈을 이용하여 매일 함께 뛰었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 끈을 통해 신체적 연결을 확인한 뒤, 실제로 어떻게 안내를 하는지 대화 예시를 통해 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is coming (현재진행): be동사(is) + 현재분사(coming) 구조로, 동작이 말하는 시점에 일어나고 있음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니까</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">움직이자고</span><span class=\"en\"><b><span class=\"grammar-hl\">let’s move</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오른쪽으로.</span><span class=\"en\"><b>to the right.</b></span></div></div><div class=\"lec-sent-ko\">나는 “Andy, 자전거가 오고 있어. 그러니까 오른쪽으로 움직이자.”라고 그에게 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;우리&#39;를 &#39;팀&#39;이라고 표현하며, 단순히 함께 달리는 것을 넘어 같은 목표를 향해 노력하는 공동체임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">let’s move (관용표현): &#39;let us&#39;의 줄임말로, 청유형(~하자)을 나타내며 뒤에 동사원형을 취합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 팀으로서,</span><span class=\"en\"><b>As a team,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열심히 연습했는데</span><span class=\"en\"><b>practiced hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마라톤에서 우승하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to win</span> the marathon.</b></span></div></div><div class=\"lec-sent-ko\">한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;우리&#39;를 &#39;팀&#39;이라고 표현하며, 단순히 함께 달리는 것을 넘어 같은 목표를 향해 노력하는 공동체임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to win (to부정사): 부사적 용법(목적)으로, 마라톤에서 우승하기 위해 연습했다는 의도를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">practice</td><td class=\"m\">연습하다</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마라톤 동안,</span><span class=\"en\"><b>During the marathon,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Andy와 함께 뛰며</span><span class=\"en\"><b>ran with Andy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 안내했는데</span><span class=\"en\"><b>and <span class=\"grammar-hl\">guided</span> him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동시에.</span><span class=\"en\"><b>at the same time.</b></span></div></div><div class=\"lec-sent-ko\">마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연습 단계를 지나 실제 경기 상황이 되었음을 알립니다. 5번 문장의 연습이 실제 어떻게 적용되는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">guided 5형식 구조: guide + O + 부사(at the same time) 등과 같이 목적어를 보조하는 역할을 수행하는 동사 패턴입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guide</td><td class=\"m\">안내자, 가이드</td></tr><tr><td class=\"w\">marathon</td><td class=\"m\">마라톤</td></tr><tr><td class=\"w\">during</td><td class=\"m\">~동안에</td></tr><tr><td class=\"w\">at the same time</td><td class=\"m\">동시에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">힘들었지만,</span><span class=\"en\"><b>was hard,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>but we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추지 않았다</span><span class=\"en\"><b>didn’t stop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뛰는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">running</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마라톤이라는 도전 과정에서 겪는 어려움을 언급하며, 그 어려움을 극복하는 두 사람의 끈기를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">running (동명사): stop의 목적어 역할을 하며, &#39;달리는 것&#39;이라는 행위를 멈추지 않았다는 의미를 전달합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>At last,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>we</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도착했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">made it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결승선에.</span><span class=\"en\"><b>to the finish line!</b></span></div></div><div class=\"lec-sent-ko\">마침내, 우리는 결승선에 도착했다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> made it은 사전적으로 &#39;해내다, 성공하다&#39;인데, 여기서는 힘든 과정을 거쳐 결국 목표 지점인 결승선까지 도달했다는 뜻입니다. 고생 끝에 목적지에 도착했다는 성취감을 강조하기 위해 이 숙어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it (관용표현): &#39;성공하다/도착하다&#39;라는 숙어적 표현으로, 문맥상 결승점에 도달했다는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at last</td><td class=\"m\">마침내, 드디어</td></tr><tr><td class=\"w\">finish line</td><td class=\"m\">결승선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우승하지 못했다</span><span class=\"en\"><b><span class=\"grammar-hl\">didn’t win</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 경주에서.</span><span class=\"en\"><b>the race.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그 경주에서 우승하지 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에서 세웠던 목표(우승)를 달성하지 못했다는 사실을 솔직하게 밝히며 긴장감을 살짝 낮춥니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t win (대동사(did)): 앞선 일반동사 부정문을 부정의 의미로 반복하거나 시제를 나타내기 위해 사용되는 조동사 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">race</td><td class=\"m\">경주, 시합</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 나는</span><span class=\"en\"><b>But I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알았다</span><span class=\"en\"><b>knew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가</span><span class=\"en\"><b><span class=\"grammar-hl\">that we</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최선을 다했다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">did our best</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 나는 우리가 최선을 다했다는 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우승이라는 결과보다 &#39;최선을 다했다&#39;는 과정의 가치가 더 중요함을 드러내며 앞 문장의 아쉬움을 상쇄합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that we did our best (that절): knew의 목적어 역할을 하는 명사절로, 주어(we)와 동사(did)가 포함된 완전한 문장 구조입니다.</div><div class=\"lec-gr-item\">did (대동사(did)): 일반동사 구문을 대신하여 &#39;최선을 다했다&#39;라는 의미를 완성합니다. 앞의 동사가 일반동사이면 do[does, did]를 쓴다는 규칙에 따릅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무언가를 끝내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Finishing something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였는데</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽지 않았다</span><span class=\"en\"><b>not easy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나에게.</span><span class=\"en\"><b>for me.</b></span></div></div><div class=\"lec-sent-ko\">무언가를 끝내는 것은 나에게 쉽지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 과거에는 중도 포기를 자주 했거나, 끝까지 완수하는 것을 힘들어했다는 개인적인 배경을 밝히며 변화의 계기를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Finishing something (동명사): 문장에서 주어 역할을 하며, &#39;어떤 일을 끝내는 것&#39;이라는 명사적 개념을 형성합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 이번에는</span><span class=\"en\"><b>But this time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해냈다.</span><span class=\"en\"><b><span class=\"grammar-hl\">did it</span>!</b></span></div></div><div class=\"lec-sent-ko\">그러나 이번에는 나는 해냈다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 11번 문장의 고질적인 어려움을 이번 마라톤을 통해 극복했음을 강조하며 글의 주제인 &#39;성취감&#39;을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did it (대동사(did)): 일반동사(Finishing something)를 대신하는 표현으로, 앞의 동사가 일반동사이면 did를 쓴다는 규칙에 따라 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였는데</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 행복했다.</span><span class=\"en\"><b>very happy.</b></span></div></div><div class=\"lec-sent-ko\">나는 매우 행복했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 목표를 달성한 뒤 주인공이 느끼는 감정을 직접적으로 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: 주어(I)의 상태(happy)를 설명하는 보어 연결 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Andy도</span><span class=\"en\"><b>Andy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행복해 보였는데</span><span class=\"en\"><b><span class=\"grammar-hl\">looked happy</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역시.</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">Andy도 행복해 보였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 행복이 혼자만의 것이 아니라, 파트너인 앤디와 함께 공유하는 감정임을 보여주며 따뜻하게 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked happy 5형식 구조(유사): 2형식 감각동사(look) 뒤에 형용사 보어(happy)가 온 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>주인공은 시각 장애인 앤디의 안내 주자가 되어 마라톤을 함께 준비했다.</li><li>비록 우승은 못 했지만, 포기하지 않고 함께 결승선을 통과했다.</li><li>주인공은 이 경험을 통해 무언가를 끝까지 완수하는 기쁨과 성취감을 맛보았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The narrator guided Andy throughout the marathon, and they felt a sense of accomplishment by reaching the finish line together.</div>\n              <div class=\"lec-final-sum-ko\">화자는 마라톤 내내 앤디를 이끌었으며, 그들은 함께 결승선을 통과함으로써 성취감을 느꼈다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meaning"},{"audio":"./2_audio/10.mp3","hl":"grammar"}],[{"audio":"./2_audio/11.mp3","hl":"main"},{"audio":"./2_audi
