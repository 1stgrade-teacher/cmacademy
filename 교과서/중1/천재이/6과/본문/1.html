>마치 야수(beast)가 그린 그림 같다는 평가를 받음</li><li>야수파(Wild Beast)라는 별명을 얻게 됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04예술적 고집과 성공</div><ul><li>마티스는 타인의 시선에 흔들리지 않고 자신의 화풍을 유지하여 결국 성공을 거둔다.</li><li>남들의 평가에 굴하지 않고 자기만의 방식(own style)을 고수함</li><li>꾸준한 노력 끝에 결국 유명한 화가(famous)가 됨</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gallery</td><td class=\"m\">미술관</td></tr><tr><td class=\"w\">strange</td><td class=\"m\">이상한</td></tr><tr><td class=\"w\">color</td><td class=\"m\">색칠하다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">거친, 파격적인</td></tr><tr><td class=\"w\">at first</td><td class=\"m\">처음에</td></tr><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr><tr><td class=\"w\">keep</td><td class=\"m\">유지하다</td></tr><tr><td class=\"w\">finally</td><td class=\"m\">마침내</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hello,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분.</span><span class=\"en\"><b><span class=\"grammar-hl\">everyone.</span></b></span></div></div><div class=\"lec-sent-ko\">안녕하세요, 여러분.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자인 아멜리가 청중에게 인사를 건네며 이야기를 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hello, everyone. (관용표현): 인사말(Hello) 뒤에 호칭(everyone)을 붙여 청자를 지칭하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제 이름은</span><span class=\"en\"><b><span class=\"grammar-hl\">My name</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Amélie입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is Amélie.</span></b></span></div></div><div class=\"lec-sent-ko\">제 이름은 Amélie입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림 속 주인공인 자신의 이름을 소개하며 청중과 관계를 맺고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My name is Amélie. 기본 2형식 구조: 주어(My name) + 동사(is) + 주격보어(Amélie)로 구성되어 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오신 것을 환영합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">Welcome</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 남편의 미술관에.</span><span class=\"en\"><b><span class=\"grammar-hl\">to my husband’s gallery.</span></b></span></div></div><div class=\"lec-sent-ko\">제 남편의 미술관에 오신 것을 환영합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 배경이 화가인 남편 앙리 마티스의 작품들이 전시된 공간임을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Welcome to my husband’s gallery. (관용표현): &#39;(장소)에 온 것을 환영한다&#39;는 의미로, 주어(You)가 생략된 명령문 형태의 환영 인사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gallery</td><td class=\"m\">미술관</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저를 보세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">Look at me.</span></b></span></div></div><div class=\"lec-sent-ko\">저를 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 청중의 시선을 그림 속 자신의 모습으로 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look at me. (관용표현): &#39;Look at + 대상&#39; 구조로, 대상을 바라보라는 명령문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 생각하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 이상하다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">that I’m strange?</span></b></span></div></div><div class=\"lec-sent-ko\">여러분은 제가 이상하다고 생각하세요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그림 속 얼굴색이 특이해서 사람들이 가질 법한 의문을 미리 제시하여 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you think that I’m strange? 간접의문문과 유사한 명사절: think의 목적어로 쓰인 that절(I&#39;m strange)을 포함하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">strange</td><td class=\"m\">이상한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제 남편, 앙리 마티스가</span><span class=\"en\"><b><span class=\"grammar-hl\">My husband, Henri Matisse,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">색칠했어요</span><span class=\"en\"><b><span class=\"grammar-hl\">colored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 얼굴을</span><span class=\"en\"><b><span class=\"grammar-hl\">my face</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">녹색으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">in green.</span></b></span></div></div><div class=\"lec-sent-ko\">제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 얼굴색이 초록색인 이유가 화가인 남편의 선택이었음을 분명히 밝히며, 앞선 질문에 대한 답을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My husband, Henri Matisse, colored my face in green. 5형식 구조: My husband를 부연 설명하는 동격(Henri Matisse)이 삽입되어 있으며, 주어(My husband) + 동사(colored) + 목적어(my face) + 전치사구(in green)가 결합된 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">color</td><td class=\"m\">색칠하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">걱정하지 마세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t worry.</span></b></span></div></div><div class=\"lec-sent-ko\">걱정하지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 초록색 얼굴 때문에 혹시 아멜리가 병이 든 것은 아닌지 걱정할 청중을 안심시키는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t worry. (관용표현): &#39;Don&#39;t + 동사원형&#39;을 사용하여 걱정하지 말라는 부정 명령문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제 얼굴은</span><span class=\"en\"><b><span class=\"grammar-hl\">My face</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니에요</span><span class=\"en\"><b><span class=\"grammar-hl\">isn’t</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로</span><span class=\"en\"><b><span class=\"grammar-hl\">actually</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">녹색이.</span><span class=\"en\"><b><span class=\"grammar-hl\">green.</span></b></span></div></div><div class=\"lec-sent-ko\">제 얼굴은 실제로 녹색이 아니에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화가의 의도적인 변형일 뿐, 실제 모습은 그렇지 않다는 사실을 명확히 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My face isn’t actually green. 기본 2형식 구조: 주어(My face) + 부정문(isn&#39;t) + 보어(green) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b><span class=\"grammar-hl\">Why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 칠했을까요</span><span class=\"en\"><b><span class=\"grammar-hl\">did he paint</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저를</span><span class=\"en\"><b><span class=\"grammar-hl\">me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 식으로</span><span class=\"en\"><b><span class=\"grammar-hl\">this way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면.</span><span class=\"en\"><b><span class=\"grammar-hl\">then?</span></b></span></div></div><div class=\"lec-sent-ko\">그러면 왜 그는 저를 이런 식으로 칠했을까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 궁금증을 다시 한번 자극하여, 다음 문장에서 나올 예술적 동기를 자연스럽게 이끌어내는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why did he paint me this way then? (대동사(did)): 일반동사 paint를 대신하여 질문을 구성하는 의문문의 조동사로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 원했거든요</span><span class=\"en\"><b>He wanted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표현하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to express</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 감정을</span><span class=\"en\"><b>his emotions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밝고 거친 색으로.</span><span class=\"en\"><b>with bright and wild colors.</b></span></div></div><div class=\"lec-sent-ko\">그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 wild는 사전적으로 &#39;야생의, 거친&#39;이라는 뜻이지만, 여기서는 기존의 관습에 얽매이지 않고 대담하고 강렬하게 색을 쓴다는 의미입니다. 필자는 마티스의 파격적인 예술관을 강조하기 위해 이 단어를 선택했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to express (to부정사): wanted의 목적어로 쓰여 &#39;표현하는 것을 원했다&#39;는 의미를 나타내는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">color</td><td class=\"m\">색칠하다</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">bright</td><td class=\"m\">밝은</td></tr><tr><td class=\"w\">wild</td><td class=\"m\">거친, 파격적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">People</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋아하지 않았어요</span><span class=\"en\"><b><span class=\"grammar-hl\">didn’t like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 그림 스타일을</span><span class=\"en\"><b><span class=\"grammar-hl\">this painting style</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at first.</span></b></span></div></div><div class=\"lec-sent-ko\">사람들은 처음에 이 그림 스타일을 좋아하지 않았어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마티스의 파격적인 시도가 당시 대중에게는 쉽게 받아들여지지 않았다는 갈등 상황을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People didn’t like this painting style at first. (동명사): painting(그리는 행위/활동)이 style을 꾸며주는 명사적 용도로 사용된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at first</td><td class=\"m\">처음에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Some people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했죠</span><span class=\"en\"><b><span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야수가 저를 그렸다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">that a beast painted me.</span></b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 야수가 저를 그렸다고 생각했죠.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 beast는 사전적으로 &#39;짐승, 야수&#39;를 의미하는데, 여기서는 마티스의 그림이 너무 파격적이라 사람이 그린 것이 아닌 것처럼 보일 만큼 기괴했다는 비판적인 인식을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Some people thought that a beast painted me. 명사절 that: thought의 목적어 역할을 하는 절을 이끄는 접속사 that입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 얻었어요</span><span class=\"en\"><b>he got</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘야수’라는 별명을.</span><span class=\"en\"><b><span class=\"grammar-hl\">the nickname Wild Beast</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그는 ‘야수’라는 별명을 얻었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중의 부정적인 반응이 오히려 그를 상징하는 유명한 별명으로 정착하게 된 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the nickname Wild Beast (동격): nickname과 Wild Beast가 동일한 대상을 의미하는 동격 관계입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild</td><td class=\"m\">거친, 파격적인</td></tr><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 지켰고</span><span class=\"en\"><b><span class=\"grammar-hl\">He kept</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신만의 스타일을</span><span class=\"en\"><b><span class=\"grammar-hl\">his own style</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내 유명해졌어요.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">finally became famous</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 자신만의 스타일을 지켰고 마침내 유명해졌어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대중의 비판에도 굴하지 않고 뚝심 있게 예술 활동을 지속한 결과, 결국 성공을 거두었다는 결말입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">He kept his own style 기본 3형식 구조: 주어(He) + 타동사(kept) + 목적어(his own style)로 이루어진 문장입니다.</div><div class=\"lec-gr-item\">finally became famous 기본 2형식 구조: 주어(He) + 상태 변화 동사(became) + 형용사 보어(famous) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finally</td><td class=\"m\">마침내</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자 아멜리는 남편 앙리 마티스의 그림 속 초록 얼굴에 대해 설명한다.</li><li>마티스는 고정관념에서 벗어나 감정을 강렬한 색채로 표현하고자 했다.</li><li>처음에는 대중의 비난을 받아 &#39;야수&#39;라 불리기도 했다.</li><li>결국 자신의 예술적 주관을 지켜냄으로써 명성을 얻게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Henri Matisse used bold colors to express his emotions, and he eventually achieved fame by maintaining his unique style despite negative public reactions.</div>\n              <div class=\"lec-final-sum-ko\">앙리 마티스는 감정을 표현하기 위해 대담한 색채를 사용했으며, 부정적인 대중의 반응에도 불구하고 자신만의 독특한 스타일을 유지하여 결국 명성을 얻었다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"aud
