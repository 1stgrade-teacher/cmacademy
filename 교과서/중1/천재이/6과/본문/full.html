 미술 시간의 콜라주처럼, 그는 자유로운 형태와 색감의 조화를 통해 마지막까지 예술혼을 불태웠답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초상화에 담긴 감정</div><ul><li>앙리 마티스는 아내의 초상화에 파격적인 색을 사용하여 자신의 감정을 표현했다.</li><li>아내의 얼굴을 초록색으로 칠함 (colored my face in green)</li><li>밝고 강렬한 색채로 감정을 표현함 (express his emotions)</li><li>파격적인 화풍 때문에 &#39;야수(Wild Beast)&#39;라는 별명을 얻음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마티스의 독특한 작업 방식</div><ul><li>마티스는 붓 대신 가위와 종이를 활용하여 새로운 형태의 작품을 만들어냈다.</li><li>달팽이 모양의 작품 (snail shell)</li><li>색칠한 종이를 가위로 오려 붙이는 기법 (cut out shapes with scissors)</li><li>작품을 구성하는 독창적인 방식 (unique way)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03예술을 향한 열정</div><ul><li>마티스는 노년의 병마에도 굴하지 않고 자신만의 예술 세계를 끝까지 개척했다.</li><li>70세의 나이에 찾아온 병 (got very sick)</li><li>포기하지 않고 &#39;컷아웃(cut-outs)&#39;이라는 새로운 예술 형식을 만듦</li><li>관람객에게 갤러리 탐험을 제안하며 마무리함</li><li>핵심 키워드: 컷아웃(cut-outs), 예술적 열정(artistic passion)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gallery</td><td class=\"m\">미술관</td></tr><tr><td class=\"w\">strange</td><td class=\"m\">이상한</td></tr><tr><td class=\"w\">color</td><td class=\"m\">색칠하다</td></tr><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">express</td><td class=\"m\">표현하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">wild</td><td class=\"m\">격렬한, 거친</td></tr><tr><td class=\"w\">painting style</td><td class=\"m\">화풍, 그리기 방식</td></tr><tr><td class=\"w\">at first</td><td class=\"m\">처음에</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beast</td><td class=\"m\">짐승</td></tr><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr><tr><td class=\"w\">keep</td><td class </li><li>비록 초기에는 &#39;야수&#39;라는 비난을 받았지만, 자기만의 스타일을 고수하여 성공했다.</li><li>나이가 들어 병이 든 후에는 붓 대신 가위와 종이를 이용한 &#39;컷아웃&#39;이라는 새로운 기법을 만들었다.</li><li>이처럼 마티스는 상황과 방식에 얽매이지 않고 끊임없이 예술 세계를 확장했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Matisse established a unique style by using bold colors and cut-outs, and he continued his passion for art even after falling ill.</div>\n              <div class=\"lec-final-sum-ko\">마티스는 대담한 색채와 종이 오리기 기법을 통해 독창적인 스타일을 확립했으며, 병에 걸린 후에도 예술에 대한 열정을 이어갔다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"}],[{"audio":"./full_audio/7.mp3","hl":null}],[{"audio":"./full_audio/8.mp3","hl":"main"},{"audio":"./full_audio/9.mp3","hl":"meaning"},{"audio":"./full_audio/10.mp3","hl":"grammar"}],[{"audio":"./full_audio/11.mp3","hl":"main"},{"audio":"./full_audio/12.mp3","hl":"meaning"},{"audio":"./full_audio/13.mp3","hl":"grammar"}],[{"audio":"./full_audio/14.mp3","hl":"main"},{"audio":"./full_audio/15.mp3","hl":"meaning"},{"audio":"./full_audio/16.mp3","hl":"grammar"}],[{"audio":"./full_audio/17.mp3","hl":"main"},{"audio":"./full_audio/18.mp3","hl":"meaning"},{"audio":"./full_audio/19.mp3","hl":"grammar"}],[{"audio":"./full_audio/20.mp3","hl":"main"},{"audio":"./full_audio/21.mp3","hl":"meaning"},{"audio":"./full_audio/22.mp3","hl":"grammar"}],[{"audio":"./full_audio/23.mp3","hl":"main"},{"audio":"./full_audio/24.mp3","hl":"meaning"},{"audio":"./full_audio/25.mp3","hl":"grammar"}],[{"audio":"./full_audio/26.mp3","hl":"main"},{"audio":"./full_audio/27.mp3","hl":"meaning"},{"audio":"./full_audio/28.mp3","hl":"grammar"}],[{"audio":"./full_audio/29.mp3","hl":"main"},{"audio":"./full_audio/30.mp3","hl":"meaning"},{"audio":"./full_audio/31.mp3",
