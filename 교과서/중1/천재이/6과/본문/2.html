ss=\"lec-stage-head\">01그림 속 동물 찾기</div><ul><li>독자에게 그림 속 숨은 동물을 찾아보도록 유도하며 흥미를 유발한다.</li><li>초록색 도형에서 시작해 달팽이 껍질 모양을 따라가기</li><li>정체는 바로 달팽이(snail)</li><li>핵심 키워드: 달팽이(snail)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02마티스의 독특한 창작 방식</div><ul><li>마티스가 일반적인 그림 방식이 아닌 가위와 종이를 사용하여 작품을 만드는 과정을 설명한다.</li><li>종이에 물감을 칠한 뒤 가위로 모양을 오림</li><li>오려낸 조각들을 이어 붙여 완성함</li><li>핵심 키워드: 가위(scissors), 오려내기(cut-outs)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03역경을 이겨낸 예술혼</div><ul><li>마티스가 70세라는 고령과 병마를 극복하고 새로운 예술을 창조했음을 보여준다.</li><li>70세에 겪은 심각한 질병(sick)</li><li>포기하지 않고 새로운 예술 형식인 &#39;컷아웃&#39;을 창조</li><li>핵심 키워드: 예술(art), 컷아웃(cut-outs)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04전시 관람 안내</div><ul><li>독자들에게 마티스의 다양한 작품 세계를 직접 탐색해보도록 권유하며 글을 마친다.</li><li>갤러리를 둘러보며 작품을 찾아볼 것</li><li>앙리 마티스(Henri Matisse)의 예술 세계를 탐험함</li><li>핵심 키워드: 갤러리(gallery), 탐험(explore)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">모양, 형태</td></tr><tr><td class=\"w\">trace</td><td class=\"m\">따라가다, 추적하다</td></tr><tr><td class=\"w\">snail</td><td class=\"m\">달팽이</td></tr><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들다</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한</td></tr><tr><td class=\"w\">paint</td><td class=\"m\">색칠하다, 그리다</td></tr><tr><td class=\"w\">cut out</td><td class=\"m\">오려내다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scissor</td><td class=\"m\">가위</td></tr><tr><td class=\"w\">put together</td><td class=\"m\">합치다, 조립하다</td></tr><tr><td class=\"w\">sick</td><td class=\"m\">아픈</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형태, 형식</td></tr><tr><td class=\"w\">look around</td><td class=\"m\">둘러보다</td></tr><tr><td class=\"w\">gallery</td><td class=\"m\">미술관, 화랑</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 둘러보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안녕하세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">Hi,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은.</span><span class=\"en\"><b><span class=\"grammar-hl\">there.</span></b></span></div></div><div class=\"lec-sent-ko\">안녕하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 독자에게 친근하게 말을 거는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Hi, there. (관용표현): 인사말(Hi) 뒤에 there를 붙여 가벼운 인사로 사용하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 저를 찾을 수 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Can you find me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림에서.</span><span class=\"en\"><b>in the picture?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 그림에서 저를 찾을 수 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 호기심을 자극하여 미술 작품을 자세히 관찰하도록 유도하는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Can you find me 5형식(SVOC) 구조: find(동사)+me(목적어)를 활용한 일반적인 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>Actually,</b></span body><tr><td class=\"w\">look around</td><td class=\"m\">둘러보다</td></tr><tr><td class=\"w\">gallery</td><td class=\"m\">미술관, 화랑</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 둘러보다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>마티스의 작품 &#39;달팽이&#39;가 자신의 특징을 설명하며 독자에게 말을 건넨다.</li><li>마티스는 병든 후에도 예술을 포기하지 않고 종이를 오려 붙이는 &#39;컷아웃&#39;이라는 새로운 기법을 만들었다.</li><li>독자에게 미술관을 둘러보며 마티스의 예술 세계를 더 깊이 탐험해 볼 것을 권한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Matisse overcame his physical struggles to create a new art style, so he produced unique works using scissors and painted paper.</div>\n              <div class=\"lec-final-sum-ko\">마티스는 신체적 어려움을 극복하고 새로운 예술 스타일을 창조했기에, 가위와 색칠한 종이를 사용하여 독창적인 작품을 만들었다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"aud
