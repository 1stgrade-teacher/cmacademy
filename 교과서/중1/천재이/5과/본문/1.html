의 활약이 깃든 국가적 성지라고 할 수 있어요. 이순신 장군은 거북선(Turtle Ship)을 활용해 뛰어난 전략으로 바다를 지켜냈는데, 통영에는 장군을 기리는 공원과 동상이 많아 역사적 의미를 되새기기에 좋은 장소랍니다. 이번 글을 읽을 때, 이런 배경을 떠올리면 통영 여행의 설렘과 평화로운 풍경이 더 생생하게 느껴질 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행의 시작</div><ul><li>이른 아침 설레는 마음으로 가족 여행을 시작하였다.</li><li>출발 시간: 오전 6시 (6 a.m.)</li><li>여행지: 통영 (Tongyeong)</li><li>핵심 키워드: 가족 여행 (family trip)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02중앙시장 방문과 충무김밥</div><ul><li>통영의 대표 음식인 충무김밥을 먹으며 음식에 담긴 유래를 배웠다.</li><li>점심 식사 장소: 중앙시장 (Jungang Market)</li><li>충무김밥의 특징: 밥만 들어있는 김밥과 무, 오징어 (radish and squid)</li><li>유래: 과거 어부들이 바다에서 먹던 음식 (fishermen)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03이순신 공원과 역사적 경험</div><ul><li>이순신 공원을 방문하여 거대한 동상을 보고 역사의 현장을 상상했다.</li><li>방문 장소: 이순신 공원 (Yi Sun-sin Park)</li><li>이순신 장군의 거대한 동상 (huge statue)</li><li>역사적 상상: 통영 앞바다의 위대한 전투 (great battle)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04하루의 마무리</div><ul><li>아름다운 저녁 노을을 보며 평화로운 감정을 느끼며 여행을 마무리했다.</li><li>해안가를 따라 걷는 산책 (walk along the coast)</li><li>아름다운 저녁 노을 (sunset)</li><li>느낀 점: 나라를 사랑하는 마음과 평화로움 (peaceful)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get up</td><td class=\"m\">일어나다</td></tr><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 흥분한</td></tr><tr><td class=\"w\">arrive</td><td class=\"m\">도착하다</td></tr><tr><td class=\"w\">inside</td><td class=\"m\">~ 안에</td></tr><tr><td class=\"w\">radish</td><td class=\"m\">무</td></tr><tr><td class=\"w\">squid</td><td class=\"m\">오징어</td></tr><tr><td class=\"w\">fisherman</td><td class=\"m\">어부</td></tr><tr><td class=\"w\">spicy</td><td class=\"m\">매운</td></tr><tr><td class=\"w\">tasty</td><td class=\"m\">맛있는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">huge</td><td class=\"m\">거대한</td></tr><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">admiral</td><td class=\"m\">제독</td></tr><tr><td class=\"w\">imagine</td><td class=\"m\">상상하다</td></tr><tr><td class=\"w\">battle</td><td class=\"m\">전투</td></tr><tr><td class=\"w\">coast</td><td class=\"m\">해안</td></tr><tr><td class=\"w\">take a walk</td><td class=\"m\">산책하다</td></tr><tr><td class=\"w\">sunset</td><td class=\"m\">일몰</td></tr><tr><td class=\"w\">peaceful</td><td class=\"m\">평화로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">8월 16일</span><span class=\"en\"><b>August 16th</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 일어났다</span><span class=\"en\"><b>I got up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">6시에</span><span class=\"en\"><b><span class=\"grammar-hl\">at six</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the morning</span>.</b></span></div></div><div class=\"lec-sent-ko\">(8월 16일에 저는 아침 6시에 일어났습니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 첫날을 시작하는 화자의 행동을 보여주며, 앞으로 이어질 여행 일정의 서막을 알리는 도입 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at six in the morning (관용표현): 시간과 관련된 전치사 at은 구체적인 시각 앞에 쓰여 &#39;-시에&#39;라는 의미를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">첫째 날</span><span class=\"en\"><b><span class=\"grammar-hl\">the first day</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 가족 여행의</span><span class=\"en\"><b>of my family trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통영으로의</span><span class=\"en\"><b>to Tongyeong.</b></span></div></div><div class=\"lec-sent-ko\">통영으로의 우리 가족 여행의 첫날이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 일어난 구체적인 이유가 바로 ‘가족 여행’ 때문임을 밝히며 글의 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was the first day (가주어): 진주어: 여기서는 It이 특정 시간을 나타내는 비인칭 주어로 쓰였으나, 문장의 시작에서 상황을 정의하는 주어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신이 났다!</span><span class=\"en\"><b><span class=\"grammar-hl\">was excited</span>!</b></span></div></div><div class=\"lec-sent-ko\">나는 신이 났다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 첫날을 맞이한 화자의 설레는 감정을 직접적으로 드러내어 독자에게 여행의 기대감을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was excited (과거분사): excited는 감정을 나타내는 분사로서 주어 I의 상태를 보충 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 흥분한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 도착했다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">arrived</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중앙시장에</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> Jungang Market</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 1시에</span><span class=\"en\"><b>at 1 p.m.</b></span></div></div><div class=\"lec-sent-ko\">우리는 오후 1시에 중앙시장에 도착했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본격적인 시작 장소를 제시하며 시간과 장소의 변화를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">arrived at (관용표현): arrive at은 &#39;어디에 도착하다&#39;라는 의미의 자동사구로, 목적지를 나타낼 때 전치사 at과 함께 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">arrive</td><td class=\"m\">도착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 우리는 먹었다</span><span class=\"en\"><b>There we <span class=\"grammar-hl\">had</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충무김밥을</span><span class=\"en\"><b><span class=\"grammar-hl\">Chungmu gimbap</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점심으로</span><span class=\"en\"><b><span class=\"grammar-hl\">for lunch</span>.</b></span></div></div><div class=\"lec-sent-ko\">그곳에서 우리는 점심으로 충무김밥을 먹었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시장에 도착한 구체적인 목적이자 통영의 대표 음식인 ‘충무김밥’을 소개하는 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had Chungmu gimbap for lunch (관용표현): have + 식사명 + for + 식사 시간 구조로 &#39;어떤 식사를 하다&#39;라는 의미를 가짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었다</span><span class=\" <table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coast</td><td class=\"m\">해안</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일몰은</span><span class=\"en\"><b><span class=\"grammar-hl\">The sunset</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">was beautiful</span>.</b></span></div></div><div class=\"lec-sent-ko\">일몰이 아름다웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연 풍경에 대한 묘사를 통해 여행의 감동을 시각적으로 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The sunset was beautiful (관용표현): 주어의 상태를 보충하는 주격 보어로 형용사(beautiful)가 쓰인 2형식 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sunset</td><td class=\"m\">일몰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 18</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 감았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">closed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 눈을</span><span class=\"en\"><b><span class=\"grammar-hl\">my eyes</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 눈을 감았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> closed는 사전적으로 &#39;닫다&#39;인데, 여기서는 단순히 시야를 차단하는 것을 넘어 눈앞의 아름다운 풍경과 역사적 장소의 분위기를 오롯이 느끼고 내면화하려는 &#39;집중&#39;의 의도를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">closed my eyes (관용표현): 주어의 소유격과 신체 부위를 목적어로 취하는 타동사 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 18</div>\
