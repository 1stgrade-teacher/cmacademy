<div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 경상남도 통영을 여행하며 겪은 경험을 담고 있는데, 여기서 언급된 충무김밥(Chungmu gimbap)은 과거 통영 앞바다에서 고기잡이를 하던 어부들이 밥이 잘 쉬지 않도록 반찬과 밥을 따로 담아 먹었던 것에서 유래한 유서 깊은 음식이에요. 또한, 지문에 등장하는 이순신 장군(Admiral Yi Sun-sin)은 임진왜란 당시 통영 앞바다인 한산도 대첩에서 거북선(Turtle Ship)을 활용해 큰 승리를 거둔 우리나라의 위대한 영웅으로, 통영은 그의 삼도수군통제영이 위치했던 역사적 장소이기도 하죠. 동피랑(Dongpirang)은 원래 철거 위기에 처한 달동네였지만, 지금은 벽화 마을(Mural Village)로 변신하여 관광객들에게 사랑받는 예술 공간이 되었답니다. 마지막으로 전혁림 화백(Jeon Hyuck-lim)은 통영의 푸른 바다를 독창적인 파란색으로 표현해 &#39;색채의 마술사&#39;라 불리는데, 이처럼 통영은 역사적 사건과 예술적 감각이 어우러진 특별한 여행지라고 할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행 시작과 통영의 맛</div><ul><li>통영 여행 첫날, 중앙시장에서 통영의 전통 음식을 맛보며 여정을 시작했다.</li><li>중앙시장(Jungang Market)에서 점심으로 충무김밥 체험</li><li>충무김밥의 유래: 어부들이 바다 위에서 먹던 음식</li><li>핵심 키워드: 충무김밥(Chungmu gimbap), 어부(fishermen)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02역사와 자연의 조화</div><ul><li>이순신 공원을 방문하여 통영의 역사적 배경을 느끼고 아름다운 자연 경관을 감상했다.</li><li>이순신 장군 동상(statue of Admiral Yi) 관람과 전투 상상</li><li>해안가를 따라 걷는 산책(walk along the coast)</li><li>핵심 키워드: 이순신 장군(Admiral Yi), 일몰(sunset)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03벽화 마을 탐방</div><ul><li>여행 둘째 날, 동피랑 마을에서 벽화를 구경하며 사진을 찍는 즐거운 시간을 보냈다.</li><li>동피랑(Dongpirang)의 아름다운 벽화(paintings) 감상</li><li>어머니와 함께 수많은 기념사진 촬영</li><li>핵심 키워드: 벽화(wall paintings), 동피랑(Dongpirang)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04예술적 마무리</div><ul><li>전혁림 미술관을 방문하여 통영의 바다를 표현한 색채의 마술사를 만났다.</li><li>전혁림 미술관(Jeon Hyuck-lim Museum of Art) 방문</li><li>다양한 푸른색으로 바다를 그린 화가의 작품 감상</li><li>핵심 키워드: 색채의 마술사(Magician of Color), 미술관(Museum of Art)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr><tr><td class=\"w\">arrive</td><td class=\"m\">도착하다</td></tr><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 들뜬</td></tr><tr><td class=\"w\">radish</td><td class=\"m\">무</td></tr><tr><td class=\"w\">squid</td><td class=\"m\">오징어</td></tr><tr><td class=\"w\">fisherman</td><td class=\"m\">어부</td></tr><tr><td class=\"w\">spicy</td><td class=\"m\">매운</td></tr><tr><td class=\"w\">tasty</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">huge</td><td class=\"m\">거대한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">statue</td><td class=\"m\">조각상</td></tr><tr><td class=\"w\">admiral</td><td class=\"m\">제독</td></tr><tr><td class=\"w\">imagine</td><td class=\"m\">상상하다</td></tr><tr><td class=\"w\">battle</td><td class=\"m\">전투</td></tr><tr><td class=\"w\">coast</td><td class=\"m\">해안</td></tr><tr><td class=\"w\">sunset</td><td class=\"m\">일몰</td></tr><tr><td class=\"w\">peaceful</td><td class=\"m\">평화로운</td></tr><tr><td class=\"w\">cliff</td><td class=\"m\">절벽</td></tr><tr><td class=\"w\">painter</td><td class=\"m\">화가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가람의 여행 일기</span><span class=\"en\"><b><span class=\"grammar-hl\">Garam’s Travel Diary to Tongyeong</span> August 16th</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통영으로 떠난</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">8월 16일</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 아침 여섯 시에 일어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 첫날, 가람이가 일찍 하루를 시작하며 설레는 마음으로 일정을 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Garam’s Travel Diary to Tongyeong (관용표현): 고유명사와 함께 쓰인 소유격 &#39;Garam&#39;s&#39;는 장소나 기록물을 나타내는 목적을 의미합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 일어났다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">got up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">6시에</span><span class=\"en\"><b>at six</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침</span><span class=\"en\"><b>in the morning.</b></span></div></div><div class=\"lec-sent-ko\">나는 아침 여섯 시에 일어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 첫날, 가람이가 일찍 하루를 시작하며 설레는 마음으로 일정을 시작하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got up (관용표현): 숙어 &#39;get up&#39;은 &#39;일어나다&#39;라는 의미를 가진 구동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그날은 첫날이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was the first day</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 가족 여행의</span><span class=\"en\"><b>of my family trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통영으로 떠난</span><span class=\"en\"><b>to Tongyeong.</b></span></div></div><div class=\"lec-sent-ko\">통영으로의 우리 가족 여행의 첫날이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 시간적 배경이 가족 여행의 시작임을 밝혀주며, 앞으로 펼쳐질 여행기에 대한 기대감을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was the first day (가주 ed my eyes (관용표현): &#39;close one&#39;s eyes&#39;는 &#39;눈을 감다&#39;라는 의미의 고정된 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 느낄 수 있었다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">could feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이순신 장군의 사랑을</span><span class=\"en\"><b>Admiral Yi’s love</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나라를 향한</span><span class=\"en\"><b>for the country.</b></span></div></div><div class=\"lec-sent-ko\">나는 이순신 장군의 나라에 대한 사랑을 느낄 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아름다운 풍경 속에서 장군의 정신을 되새기며 여행지의 깊은 의미를 깨닫는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could feel (관용표현): 조동사 &#39;could&#39;를 사용하여 과거의 능력이나 가능성을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">admiral</td><td class=\"m\">제독</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 19 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 것이</span><span class=\"en\"><b>Everything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 평화로웠다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was really peaceful</span>.</b></span></div></div><div class=\"lec-sent-ko\">모든 것이 정말 평화로웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행지에서의 만족감과 정서적 충만함을 요약하며 하루를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was really peaceful (관용표현): &#39;really&#39;는 형용사 &#39;peaceful&#39;을 강조하는 부사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">peaceful</td><td class=\"m\">평화로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 20 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">8월 17일</span><span class=\"en\"><b>August 17th</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이른 아침,</span><span class=\"en\"><b><span class=\"grammar-hl\">Early in the morning</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 갔는데</span><span class=\"en\"><b>we went</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동피랑에 갔다.</span><span class=\"en\"><b>to Dongpirang.</b></span></div></div><div class=\"lec-sent-ko\">벽에는 많은 예쁜 그림들이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행 둘째 날의 새로운 일정으로 장소를 이동합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Early in the morning (관용표현): &#39;early in the morning&#39;은 &#39;아침 일찍&#39;을 뜻하는 부사적 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예쁜 그림들이 많이</span><span class=\"en\"><b>many pretty paintings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽에.</span><span class=\"en\"><b>on the walls.</b></span></div></div><div class=\"lec-sent-ko\">벽에는 많은 예쁜 그림들이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 동피랑 마을의 특징인 벽화를 묘사하며 시각적인 흥미를 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were (도치): 유도부사 &#39;There&#39; 구문으로 동사 &#39;were&#39;와 주어 &#39;many pretty paintings&#39;가 도치되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였는데</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 장소</span><span class=\"en\"><b>the best place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 찍기에.</span><span class=\"en\"><b><span class=\"grammar-hl\">for taking pictures</span>!</b></span></div></div><div class=\"lec-sent-ko\">그곳은 사진을 찍기에 최고의 장소였다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 벽화 마을의 매력을 강조하며 사진을 찍기 좋아하는 일반적인 여행객의 설렘을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for taking pictures (동명사): 전치사 &#39;for&#39;의 목적어로 쓰인 동명사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 23 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마와 나는</span><span class=\"en\"><b>Mom and I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찍었다</span><span class=\"en\"><b><span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 장의 사진을.</span><span class=\"en\"><b><span class=\"grammar-hl\">hundreds of pictures</span>.</b></span></div></div><div class=\"lec-sent-ko\">엄마와 나는 수백 장의 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 즐거움을 사진이라는 기록으로 남기려는 열정적인 모습을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took hundreds of pictures (관용표현): &#39;hundreds of&#39;는 &#39;수백의&#39;라는 의미로 수량을 나타내는 관용적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 24 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아빠가</span><span class=\"en\"><b>my dad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말씀하셨는데</span><span class=\"en\"><b>said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제발 그만해!</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Please stop</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상 사진은 안 돼라고.</span><span class=\"en\"><b>No more pictures!”</b></span></div></div><div class=\"lec-sent-ko\">더 이상의 사진은 안 돼!”라고 말씀하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 너무 많은 사진 촬영에 지친 아빠의 반응을 넣어 여행지의 유머러스하고 현실적인 상황을 보여줍니다. 24. ‘Dong’ means ‘east,’ and ‘pirang’ means ‘cliff.’ 지명에 담긴 어원적 의미를 설명하여 여행지에 대한 이해도를 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Please stop (관용표현): 명령문에 &#39;Please&#39;를 붙여 공손함을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 25 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘동’은</span><span class=\"en\"><b>‘Dong’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘동쪽’을 의미하고</span><span class=\"en\"><b><span class=\"grammar-hl\">means</span> ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘동쪽’을</span><span class=\"en\"><b>‘east,’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 ‘피랑’은</span><span class=\"en\"><b>and ‘pirang’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘절벽’을 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">means</span> ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘절벽’을.</span><span class=\"en\"><b>‘cliff.</b></span></div></div><div class=\"lec-sent-ko\">‘동’은 ‘동쪽’을 의미하고, ‘피랑’은 ‘절벽’을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 정보와 대비되는 또 다른 장소를 소개하며 정보를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">means 동격의 that: 본문에는 없으나, &#39;~라는 의미이다&#39;라는 뜻으로 명사를 보충 설명하는 구조를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cliff</td><td class=\"m\">절벽</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 26 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>also</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서피랑도.</span><span class=\"en\"><b>Seopirang.</b></span></div></div><div class=\"lec-sent-ko\">서피랑도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 정보와 대비되는 또 다른 장소를 소개하며 정보를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There is (도치): 유도부사 &#39;There&#39;가 문두에 쓰여 주어 &#39;Seopirang&#39;과 동사 &#39;is&#39;가 도치되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음으로,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 갔는데</span><span class=\"en\"><b>we <span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전혁림 미술관에 갔다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> the Jeon Hyuck-lim Museum of Art.</b></span></div></div><div class=\"lec-sent-ko\">다음으로, 우리는 전혁림 미술관에 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 활동적인 장소에서 문화적인 장소로 여행의 성격이 전환됨을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went to (관용표현): 특정 장소로의 이동을 나타내는 &#39;go to&#39; 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 화가의 별명은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">painter’s nickname</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘색채의 마술사’이다</span><span class=\"en\"><b>is ‘</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘색채의 마술사’.</span><span class=\"en\"><b>‘The Magician of Color.</b></span></div></div><div class=\"lec-sent-ko\">그 화가의 별명은 ‘색채의 마술사’이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Magician은 사전적으로 &#39;마술사&#39;지만, 여기서는 그의 작품이 단순히 그림을 넘어 사람을 매료시키는 힘을 가졌음을 비유합니다. 예술적 천재성을 한 문장에 압축하려고 이 단어를 골랐습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">painter’s nickname (관용표현): 소유격 &#39;painter&#39;s&#39;를 사용하여 해당 명사와의 소유 관계를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">painter</td><td class=\"m\">화가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 29 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렸는데</span><span class=\"en\"><b><span class=\"grammar-hl\">painted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통영의 바다를</span><span class=\"en\"><b><span class=\"grammar-hl\">the sea</span> of Tongyeong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 파란색으로.</span><span class=\"en\"><b>with various blue colors.</b></span></div></div><div class=\"lec-sent-ko\">그는 통영의 바다를 다양한 푸른색으로 칠했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화가의 예술적 특징을 구체적으로 설명하며 미술관 방문의 이유를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">painted the sea (관용표현): &#39;paint A with B&#39; 구조는 &#39;A를 B로 채색하다&#39;라는 의미로 쓰입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐겁게 감상했는데</span><span class=\"en\"><b><span class=\"grammar-hl\">enjoyed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 그림을</span><span class=\"en\"><b><span class=\"grammar-hl\">his paintings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우.</span><span class=\"en\"><b>very much.</b></span></div></div><div class=\"lec-sent-ko\">나는 그의 그림들을 아주 많이 즐겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작품을 본 개인적인 감상을 솔직하게 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enjoyed his paintings (관용표현): &#39;enjoy&#39;는 동명사를 목적어로 취하거나 명사를 목적어로 취하여 즐거움을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">정말 멋진 경험이었다!</span><span class=\"en\"><b><span class=\"grammar-hl\">What a great experience</span>!</b></span></div></div><div class=\"lec-sent-ko\">정말 좋은 경험이었구나!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 여행을 한 문장으로 감탄하며 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What a great experience (관용표현): 감탄문 &#39;What a + 형용사 + 명사&#39; 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 32 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가족 여행을 가는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Going on a family trip</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인데</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상</span><span class=\"en\"><b>always</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐겁다.</span><span class=\"en\"><b>fun.</b></span></div></div><div class=\"lec-sent-ko\">가족 여행을 가는 것은 언제나 재미있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본질적인 즐거움을 일반화하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Going on a family trip (동명사): 문장의 주어 자리에 위치하여 &#39;가족 여행을 가는 것&#39;이라는 명사적 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 33 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">통영아,</span><span class=\"en\"><b>Tongyeong,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안녕</span><span class=\"en\"><b><span class=\"grammar-hl\">bye</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일단.</span><span class=\"en\"><b><span class=\"grammar-hl\">for now</span>!</b></span></div></div><div class=\"lec-sent-ko\">통영, 이젠 안녕!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행을 마치는 아쉬움과 다시 오고 싶은 마음을 담아 작별 인사를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">bye for now (관용표현): &#39;for now&#39;는 &#39;일단은/당분간&#39;을 의미하는 숙어입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 34 / 34</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">See you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음에.</span><span class=\"en\"><b><span class=\"grammar-hl\">next time</span>!</b></span></div></div><div class=\"lec-sent-ko\">다음에 보자!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">See you next time (관용표현): 헤어질 때 사용하는 인사말 숙어입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>가람이 가족은 통영으로 여행을 떠나 충무김밥을 먹고 역사적 의미를 되새겼다.</li><li>둘째 날에는 동피랑 마을에서 사진을 찍고 전혁림 미술관을 방문하며 예술적 감동을 느꼈다.</li><li>통영이라는 도시가 가진 역사, 풍경, 예술을 모두 경험하며 즐거운 가족 여행을 마무리했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Garam enjoyed local food and historical sites, and also explored beautiful art and scenery during the family trip to Tongyeong.</div>\n              <div class=\"lec-final-sum-ko\">가람이는 통영 가족 여행 동안 지역 음식과 역사적 장소를 즐겼고, 아름다운 예술과 풍경도 탐험했다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"
