dADv8/557f4Y6Uf5/z1/wA9qQMCMgj16/5/GkLKO4POOvvj/P5UAOo5/n/9b/69ICMDkc9O2R2xRkAdRj1z7Z6/Tn6c0bALR+Ppn/PvSEgckgf/AFuv5d6Xj+v9c/1oAKP8/wD66TI9R3H5DJ/IUMcAn0BPr0Hp3oA//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">An Enjoyable Family Trip to Tongyeong<small>즐거운 통영 가족 여행</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 통영의 유명한 관광지인 동피랑(Dongpirang)과 전혁림 미술관(Jeon Hyuck-lim Museum of Art)을 다루고 있는데, 여기서 &#39;벽화 마을&#39;은 낙후된 마을에 예술적인 벽화를 그려 환경을 개선하는 도시 재생(Urban Regeneration) 사업의 대표적인 사례예요. 통영의 동피랑처럼 높은 지대에 위치한 마을들은 마을의 경관을 보존하면서도 관광객을 유치하기 위해 이런 방식을 활용하곤 하죠. 또한, 글에 언급된 &#39;색채의 마술사&#39; 전혁림 화백은 한국의 전통적인 색감과 바다의 푸른빛을 조화롭게 표현하기로 유명한 화가예요. 평소 갤러리나 미술관에 가는 것이 조금 어렵게 느껴졌다면, 이렇게 화가의 별명을 미리 알고 작품을 감상할 때 작가가 무엇을 표현하려 했는지 집중해서 살펴보는 습관을 가지면 훨씬 즐거운 관람이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01동피랑 마을 방문</div><ul><li>아침 일찍 동피랑 마을에 도착하여 아름다운 벽화들을 배경으로 사진 촬영을 즐겼다.</li><li>벽화(pretty paintings)로 꾸며진 아름다운 마을 환경</li><li>가족들과 함께 수많은 사진을 촬영하며 즐거운 시간 보냄</li><li>핵심 키워드: 동피랑(Dongpirang), 사진(pictures)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02동피랑과 서피랑의 이름 의미</div><ul><li>통영의 지명인 동피랑과 서피랑이 가진 언어적 의미를 소개한다.</li><li>&#39;동(Dong)&#39;은 동쪽을 의미함</li><li>&#39;피랑(pirang)&#39;은 절벽을 의미함</li><li>핵심 키워드: 의미(means), 절벽(cliff)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전혁림 미술관 관람</div><ul><li>&#39;색채의 마술사&#39;라 불리는 전혁림 화가의 작품 세계를 감상했다.</li><li>화가의 별명: 색채의 마술사(The Magician of Color)</li><li>통영의 바다를 다양한 파란색으로 표현한 작품들</li><li>핵심 키워드: 전혁림 미술관(Jeon Hyuck-lim Museum of Art), 색채(color)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04여행의 마무리</div><ul><li>가족 여행을 통해 얻은 소중한 경험을 되새기며 다음을 기약한다.</li><li>가족과 함께하는 여행(family trip)의 즐거움</li><li>통영을 떠나며 다음 방문을 기대하는 작별 인사</li><li>핵심 키워드: 경험(experience), 작별(bye)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">early</td><td class=\"m\">일찍</td></tr><tr><td class=\"w\">pretty</td><td class=\"m\">예쁜</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림</td></tr><tr><td class=\"w\">take a picture</td><td class=\"m\">사진을 찍다</td></tr><tr><td class=\"w\">hundred</td><td class=\"m\">백(100)</td></tr><tr><td class=\"w\">finally</td><td class=\"m\">마침내, 드디어</td></tr><tr><td class=\"w\">cliff</td><td class=\"m\">절벽</td></tr><tr><td class=\"w\">museum</td><td class=\"m\">박물관, 미술관</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">painter</td><td class=\"m\">화가</td></tr><tr><td class=\"w\">nickname</td><td class=\"m\">별명</td></tr><tr><td class=\"w\">magician</td><td class=\"m\">마술사</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험</td></tr><tr><td class=\"w\">go on a trip</td><td class=\"m\">여행을 가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">8월 17일</span><span class=\"en\"><b>August 17th <span class=\"grammar-hl\">Early in the morning</span>, we went to Dongpirang.</b></span></div></div><div class=\"lec-sent-ko\">8월 17일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일기 형식의 글임을 알리며, 여행의 첫 번째 기록 시점을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Early in the morning (관용표현): 부사구로 &#39;이른 아침에&#39;라는 시간을 나타내는 숙어적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">early</td><td class=\"m\">일찍</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아침 일찍,</span><span class=\"en\"><b><span class=\"grammar-hl\">There were</span> many pretty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 갔는데</span><span class=\"en\"><b>paintings on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동피랑에.</span><span class=\"en\"><b>the walls.</b></span></div></div><div class=\"lec-sent-ko\">벽에는 많은 예쁜 그림들이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 동피랑이라는 장소의 특징을 설명하며, 이후 필자가 사진을 많이 찍게 되는 원인을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were (도치): 유도부사 There가 문두에 오면서 주어와 동사의 위치가 바뀐 구조입니다. 주어는 뒤에 오는 &#39;many pretty paintings&#39;입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pretty</td><td class=\"m\">예쁜</td></tr><tr><td class=\"w\">painting</td><td class=\"m\">그림</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있었는데</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span> was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 예쁜 그림들이</span><span class=\"en\"><b>the best place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벽에는.</span><span class=\"en\"><b>for <span class=\"grammar-hl\">taking pictures</span>!</b></span></div></div><div class=\"lec-sent-ko\">그곳은 사진을 찍기에 최고의 장소였다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 벽화들이 사진을 찍기에 아주 훌륭한 환경임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It (가주어): 진주어: It은 가주어로 쓰여 뒤에 나오는 문맥적 상황을 대신하며, 여기서는 &#39;taking pictures&#39;와 관련된 앞선 상황을 지칭합니다.</div><div class=\"lec-gr-item\">taking pictures (동명사): 전치사 &#39;for&#39;의 목적어 자리에 위치하여 &#39;~하는 것&#39;이라는 명사적 의미로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳은</span><span class=\"en\"><b>Mom and I took <span class=\"grammar-hl\">hundreds of</span> pictures.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장소였는데</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 장소였다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 찍기에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">엄마와 나는 수백 장의 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 장소에 대한 만족감을 &#39;수백 장&#39;이라는 과장된 표현을 통해 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hundreds of (관용표현): &#39;수백의&#39;라는 뜻을 나타내는 수량 표현으로, 숫자 뒤에 s를 붙여 강조합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hundred</td><td class=\"m\">백(100)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄마와 나는</span><span class=\"en\"><b>Finally, my dad said, “<span class=\"grammar-hl\">Please stop!</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찍었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 장의 사진을.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">엄마와 나는 수백 장의 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\ o\">재미있다</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언제나.</span><span class=\"en\"><b>always fun.</b></span></div></div><div class=\"lec-sent-ko\">가족 여행을 가는 것은 언제나 재미있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이번 여행을 통해 느낀 가족 여행의 일반적인 즐거움을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Going on a family trip (동명사): 문장의 주어 자리에 위치하여 &#39;가족 여행을 가는 것&#39;이라는 명사적 역할을 수행합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">통영,</span><span class=\"en\"><b>Tongyeong,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이젠 안녕!</span><span class=\"en\"><b><span class=\"grammar-hl\">bye for now</span>!</b></span></div></div><div class=\"lec-sent-ko\">통영, 이젠 안녕!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> bye for now는 직역하면 &#39;지금은 안녕&#39;이지만, 여행을 마치고 떠나며 다시 오기를 기약하는 &#39;나중에 다시 보자&#39;라는 의미입니다. 여행의 끝에서 아쉬움을 표현하기 위해 사용되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">bye for now (관용표현): &#39;당분간 안녕&#39;이라는 작별 인사로 쓰이는 숙어적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보자</span><span class=\"en\"><b><span class=\"grammar-hl\">See you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음에.</span><span class=\"en\"><b>next time!</b></span></div></div><div class=\"lec-sent-ko\">다음에 보자!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 통영이라는 장소에 대한 애착을 드러내며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">See you (관용표현): &#39;다음에 보자&#39;는 의미를 나타내는 일상적인 작별 인사 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>필자는 가족과 함께 통영의 동피랑을 방문해 벽화 사진을 찍으며 즐거운 시간을 보냈다.</li><li>지명의 유래를 알아보고 전혁림 미술관에 방문해 &#39;색채의 마술사&#39;라는 화가의 작품을 감상했다.</li><li>여행을 마치며 통영에서의 경험에 큰 만족감을 드러내고 다음을 기약했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The family visited Dongpirang to take pictures and explored the Jeon Hyuck-lim Museum of Art, and they had a great time together.</div>\n              <div class=\"lec-final-sum-ko\">가족은 사진을 찍으러 동피랑을 방문하고 전혁림 미술관을 둘러보며, 함께 즐거운 시간을 보냈다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio
