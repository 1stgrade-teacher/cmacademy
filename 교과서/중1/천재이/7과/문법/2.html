  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

}
lecturePlayer(document.getElementById("app"),{"brand":"비교급","title":"중1 천재(이) 7과 문법2 비교급","audioDir":"중1_천재(이)_7과_문법2_비교급_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">비교급\u003c/div>\u003ch1>비교급 완전 정복 - 더 크고, 더 비싸고, 더 재미있게!\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>형용사와 부사의 비교급을 만드는 규칙을 익히고, 비교급 + than 구문으로 두 대상을 비교하는 문장을 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 두 가지를 비교할 때 꼭 필요한 비교급을 배워 볼 거예요. 더 크다, 더 비싸다처럼 누가 더 그런지를 말할 때 쓰는 표현이죠. 오늘 규칙만 잘 잡아 두면 어떤 형용사가 나와도 비교급을 척척 만들 수 있어요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">비교급 만드는 방법 - 짧은 단어는 -er\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">두 대상을 비교할 때 형용사나 부사에 \u003cb class=\"key\">-er\u003c/b>을 붙여 \u003cb class=\"key\">비교급\u003c/b>을 만듭니다. 대부분의 경우 -er만 붙이고, -e로 끝나면 -r만 붙입니다. 「자음+y」로 끝나면 y를 i로 바꾸고 -er을 붙이며, 「단모음+단자음」으로 끝나면 마지막 자음을 한 번 더 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">형용사/부사 + -er\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">small - \u003cspan class=\"fx\">smaller\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">작은 - 더 작은\u003c/div>\u003cdiv class=\"g-note\">대부분의 형용사는 뒤에 -er만 붙입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">nice - \u003cspan class=\"fx\">nicer\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">좋은 - 더 좋은\u003c/div>\u003cdiv class=\"g-note\">-e로 끝나는 단어는 -r만 붙입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">happy - \u003cspan class=\"fx\">happier\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">행복한 - 더 행복한\u003c/div>\u003cdiv class=\"g-note\">「자음+y」로 끝나면 y를 i로 바꾸고 -er을 붙입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">hot - \u003cspan class=\"fx\">hotter\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">더운 - 더 더운\u003c/div>\u003cdiv class=\"g-note\">「단모음+단자음」으로 끝나면 마지막 자음을 한 번 더 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>big처럼 「단모음+단자음」으로 끝나는 단어는 \u003cb class=\"key\">bigger\u003c/b>처럼 마지막 자음을 한 번 더 써요.\u003c/div>","segs":[{"n":2,"text":"오늘은 비교급을 만드는 방법부터 볼게요. 두 대상을 비교할 때는 형용사나 부사에 er을 붙여서 비교급을 만들어요. small은 smaller, long은 longer처럼 대부분은 그냥 er만 붙이면 돼요. 그런데 e로 끝나는 단어는 r만 붙이고, 자음과 y로 끝나는 단어는 y를 i로 바꾼 다음 er을 붙여요. 단모음과 단자음으로 끝나는 단어는 마지막 자음을 한 번 더 써 줘야 한다는 점도 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"먼저 small, smaller예요. 뜻은 작은, 더 작은이에요. 이렇게 대부분의 형용사는 뒤에 er만 붙이면 비교급이 완성돼요.","hl":"ex-0"},{"n":4,"text":"다음은 nice, nicer예요. 뜻은 좋은, 더 좋은이에요. e로 끝나는 단어는 e를 또 쓰지 않고 r만 붙인다는 점을 눈여겨 보세요.","hl":"ex-1"},{"n":5,"text":"happy, happier예요. 뜻은 행복한, 더 행복한이에요. 자음과 y로 끝나면 y를 i로 바꾸고 er을 붙여요. 그래서 happier가 되는 거예요.","hl":"ex-2"},{"n":6,"text":"hot, hotter예요. 뜻은 더운, 더 더운이에요. 단모음과 단자음으로 끝나면 마지막 자음을 한 번 더 써서 hotter가 돼요. big도 같은 방식으로 bigger가 되죠.","hl":"ex-3"},{"n":7,"text":"헷갈리기 쉬운 게 big이에요. 그냥 er만 붙이면 biger가 되지만, 단모음과 단자음으로 끝나기 때문에 마지막 g를 한 번 더 써서 bigger라고 해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">3음절 이상은 more를 앞에 붙여요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">3음절 이상인 형용사나 부사, 그리고 -ous, -ful, -less, -ive 등으로 끝나는 2음절 형용사는 앞에 \u003cb class=\"key\">more\u003c/b>를 붙여 비교급을 만듭니다. 이때 형용사 자체는 \u003cb class=\"key\">원급\u003c/b> 그대로 둡니다.\u003cdiv>\u003cspan class=\"g-formula\">more + 형용사/부사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">interesting - \u003cspan class=\"fx\">more interesting\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">재미있는 - 더 재미있는\u003c/div>\u003cdiv class=\"g-note\">3음절 이상은 more를 앞에 붙입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">beautiful - \u003cspan class=\"fx\">more beautiful\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">아름다운 - 더 아름다운\u003c/div>\u003cdiv class=\"g-note\">-ful로 끝나는 2음절 단어도 more를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>단어가 2음절이어도 \u003cb class=\"key\">-ful\u003c/b>, \u003cb class=\"key\">-ous\u003c/b>, -less, -ive로 끝나면 \u003cb class=\"key\">more\u003c/b>를 붙여요.\u003c/div>","segs":[{"n":8,"text":"이번에는 긴 단어들을 볼게요. interesting이나 beautiful처럼 세 음절 이상인 형용사는 er을 붙이지 않고 앞에 more를 붙여요. ous나 ful, less, ive로 끝나는 두 음절 단어도 똑같이 more를 써요. 이때 형용사 자체는 원래 모양 그대로 두는 게 포인트예요.","hl":"rule"},{"n":9,"text":"interesting, more interesting이에요. 뜻은 재미있는, 더 재미있는이에요. 이렇게 긴 단어는 뒤에 er을 붙이지 않고 앞에 more를 붙인다는 것, 기억해 두세요.","hl":"ex-0"},{"n":10,"text":"beautiful, more beautiful이에요. 뜻은 아름다운, 더 아름다운이에요. ful로 끝나는 두 음절 단어도 more를 붙여서 비교급을 만들어요. beautifuler라고는 하지 않아요.","hl":"ex-1"},{"n":11,"text":"단어가 두 음절이어도 ful이나 ous, less, ive로 끝나면 more를 붙인다고 생각하시면 훨씬 쉬워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">불규칙 변화 - 통째로 외워요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">good과 well은 비교급이 \u003cb class=\"key\">better\u003c/b>로 변하고, bad와 ill은 \u003cb class=\"key\">worse\u003c/b>로 변합니다. many와 much는 more, little은 less가 되는데, 이런 단어들은 -er이나 more를 붙이지 않는 \u003cb class=\"key\">불규칙\u003c/b> 변화입니다.\u003cdiv>\u003cspan class=\"g-formula\">good/well → better, bad/ill → worse, many/much → more, little → less\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">good / well - \u003cspan class=\"fx\">better\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">좋은, 잘 - 더 좋은, 더 잘\u003c/div>\u003cdiv class=\"g-note\">good과 well의 비교급은 better입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">bad / ill - \u003cspan class=\"fx\">worse\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">나쁜, 아픈 - 더 나쁜, 더 아픈\u003c/div>\u003cdiv class=\"g-note\">bad와 ill의 비교급은 worse입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">many / much - \u003cspan class=\"fx\">more\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">많은 - 더 많은\u003c/div>\u003cdiv class=\"g-note\">many와 much의 비교급은 more입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">little - \u003cspan class=\"fx\">less\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">적은 - 더 적은\u003c/div>\u003cdiv class=\"g-note\">little의 비교급은 less입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>불규칙 변화는 규칙으로 만들 수 없으니 \u003cb class=\"key\">better\u003c/b>, \u003cb class=\"key\">worse\u003c/b>처럼 \u003cb class=\"key\">통째로\u003c/b> 외워야 해요.\u003c/div>","segs":[{"n":12,"text":"이제 불규칙 변화를 볼게요. good과 well은 better, bad와 ill은 worse로 변해요. many와 much는 more, little은 less가 되는데요. 이런 단어들은 er이나 more를 붙이지 않고 모양이 완전히 달라지니까 통째로 외워 두는 게 좋아요.","hl":"rule"},{"n":13,"text":"good, well, better예요. 뜻은 좋은, 잘, 더 좋은이에요. good과 well은 er을 붙이지 않고 better로 바뀌는 불규칙 변화예요.","hl":"ex-0"},{"n":14,"text":"bad, ill, worse예요. 뜻은 나쁜, 아픈, 더 나쁜이에요. bad와 ill도 bader가 아니라 worse로 변해요.","hl":"ex-1"},{"n":15,"text":"many, much, more예요. 뜻은 많은, 더 많은이에요. 셀 수 있는 것과 셀 수 없는 것 모두 more를 쓴다고 기억해 두세요.","hl":"ex-2"},{"n":16,"text":"little, less예요. 뜻은 적은, 더 적은이에요. littler가 아니라 less로 변한다는 것도 함께 외워 두세요.","hl":"ex-3"},{"n":17,"text":"불규칙 변화는 규칙을 아무리 잘 알아도 만들어 낼 수가 없어요. better와 worse는 그 자체로 하나의 단어처럼 외워 두는 게 가장 안전해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">비교 구문 - 비교급 + than\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「\u003cb class=\"key\">비교급\u003c/b> + \u003cb class=\"key\">than\u003c/b>」은 '보다 더 …한, 보다 더 …하게'라는 의미를 나타냅니다. than 뒤에는 비교하는 대상이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">비교급 + than + 비교 대상\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The red shirt is \u003cspan class=\"fx\">more expensive than\u003c/span> the blue one.\u003c/div>\u003cdiv class=\"g-ko\">그 빨간 셔츠가 그 파란 셔츠보다 더 비싸요.\u003c/div>\u003cdiv class=\"g-note\">비교급 more expensive 뒤에 than을 붙여 두 셔츠를 비교합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>than 뒤의 \u003cb class=\"key\">one\u003c/b>은 앞에 나온 명사를 대신하는 말이에요.\u003c/div>","segs":[{"n":18,"text":"이제 비교급을 문장에서 어떻게 쓰는지 볼게요. 비교급 뒤에 than을 붙이면 그것보다 더 그렇다는 뜻이 돼요. than 뒤에는 비교하는 대상이 와요. 그래서 더 비싼 셔츠와 파란 셔츠를 비교할 때도 이 모양을 그대로 써요.","hl":"rule"},{"n":19,"text":"The red shirt is more expensive than the blue one. 이 문장은 그 빨간 셔츠가 그 파란 셔츠보다 더 비싸다는 뜻이에요. more expensive라는 비교급 뒤에 than이 와서 두 셔츠를 비교하고 있죠. 문장 끝에 나온 one은 앞에 나온 shirt를 대신하는 말이에요.","hl":"ex-0"},{"n":20,"text":"문장 끝에 나온 one이 낯설 수 있는데요. one은 앞에서 이미 말한 shirt를 다시 말하지 않으려고 쓰는 표현이에요.","hl":"tip"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 happy의 비교급으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>happyer\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>happier\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>more happy\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>happiest\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">happier\u003c/span>\u003cdiv class=\"g-exp\">「자음+y」로 끝나면 y를 i로 바꾸고 -er을 붙이므로 happier가 됩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"첫 번째 문제예요. happy의 비교급으로 알맞은 것을 골라 보세요. 보기는 happyer, happier, more happy, happiest입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 두 번째 보기인 happier예요. happy는 자음과 y로 끝나니까 y를 i로 바꾸고 er을 붙여 happier가 돼요. happyer라고 쓰면 안 되고, more happy도 아니에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 단어를 알맞은 비교급으로 바꿔 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">This box is ____ than that one. (big)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">bigger\u003c/span>\u003cdiv class=\"g-exp\">big은 「단모음+단자음」으로 끝나므로 마지막 자음을 한 번 더 쓰고 -er을 붙여 bigger가 됩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"두 번째 문제는 빈칸 채우기예요. This box is blank than that one. 괄호 안의 big을 알맞은 비교급으로 바꿔 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 bigger예요. big은 단모음과 단자음으로 끝나기 때문에 마지막 자음인 g를 한 번 더 쓰고 er을 붙여요. 그래서 This box is bigger than that one이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 beautiful의 비교급으로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>beautifuler\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>more beautiful\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>beautifuller\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>most beautiful\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">more beautiful\u003c/span>\u003cdiv class=\"g-exp\">-ful로 끝나는 2음절 형용사는 앞에 more를 붙여 비교급을 만듭니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"세 번째 문제예요. beautiful의 비교급으로 알맞은 것을 골라 보세요. 보기는 beautifuler, more beautiful, beautifuller, most beautiful입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 두 번째 보기인 more beautiful이에요. beautiful은 ful로 끝나는 두 음절 단어라서 er을 붙이지 않고 앞에 more를 붙여요. beautifuler나 beautifuller는 틀린 표현이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Tom is gooder at math than Mike.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Tom is better at math than Mike.\u003c/span>\u003cdiv class=\"g-exp\">good의 비교급은 불규칙 변화로 better입니다. gooder라는 형태는 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"네 번째 문제는 틀린 부분을 고치는 문제예요. Tom is gooder at math than Mike. 어디가 잘못됐는지 찾아서 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 Tom is better at math than Mike예요. good은 불규칙 변화라서 er을 붙이지 않고 better로 바뀌어요. gooder라는 말은 쓰지 않는다는 점을 꼭 기억하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 알맞게 배열해 '그 빨간 셔츠가 그 파란 셔츠보다 더 비싸다'라는 뜻의 문장을 만드세요.\u003c/div>\u003cdiv class=\"g-qs\">the / red / shirt / is / more expensive / than / the blue one\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The red shirt is more expensive than the blue one.\u003c/span>\u003cdiv class=\"g-exp\">비교급 more expensive 뒤에 than을 붙이고 비교 대상 the blue one을 이어 줍니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"다섯 번째 문제는 단어 배열이에요. 주어진 단어를 알맞게 늘어놓아서 그 빨간 셔츠가 그 파란 셔츠보다 더 비싸다는 뜻의 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 The red shirt i 됩니다. 오늘 배운 내용 복습 잘 해 두고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
