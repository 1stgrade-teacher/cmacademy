축제를 개최함</li><li>핵심 키워드: 나폴레옹(Napoleon), 축제(festival)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03세계의 다양한 오믈렛</div><ul><li>나라마다 고유한 재료와 방식으로 만든 독특한 오믈렛이 존재합니다.</li><li>스페인의 감자 오믈렛: 토르티야 데 파타타(Tortilla de Patata)</li><li>말레이시아와 인근 국가의 볶음밥 오믈렛: 나시 고렝 파타야(Nasi Goreng Pattaya)</li><li>지역마다 각자의 오믈렛 요리법(recipes)을 가지고 있음</li><li>핵심 키워드: 요리법(recipes), 전통 음식(dishes)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">omelet</td><td class=\"m\">오믈렛</td></tr><tr><td class=\"w\">shell</td><td class=\"m\">껍데기</td></tr><tr><td class=\"w\">daisy</td><td class=\"m\">데이지 (꽃)</td></tr><tr><td class=\"w\">olive</td><td class=\"m\">올리브</td></tr><tr><td class=\"w\">avocado</td><td class=\"m\">아보카도</td></tr><tr><td class=\"w\">dish</td><td class=\"m\">요리</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">easily</td><td class=\"m\">쉽게</td></tr><tr><td class=\"w\">beat</td><td class=\"m\">(계란 등을) 휘젓다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fry</td><td class=\"m\">기름에 튀기다/볶다</td></tr><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">add</td><td class=\"m\">추가하다</td></tr><tr><td class=\"w\">taste</td><td class=\"m\">맛이 나다</td></tr><tr><td class=\"w\">army</td><td class=\"m\">군대</td></tr><tr><td class=\"w\">giant</td><td class=\"m\">거대한</td></tr><tr><td class=\"w\">festival</td><td class=\"m\">축제</td></tr><tr><td class=\"w\">recipe</td><td class=\"m\">조리법</td></tr><tr><td class=\"w\">wrap</td><td class=\"m\">감싸다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오믈렛</span><span class=\"en\"><b><span class=\"grammar-hl\">Omelets Around the World</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(세계의 오믈렛)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퀴즈의 첫 시작으로, 계란의 물리적 특징인 &#39;껍데기&#39;를 언급하여 독자의 호기심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Omelets Around the World 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">omelet</td><td class=\"m\">오믈렛</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 껍데기가 있지만</span><span class=\"en\"><b><span class=\"grammar-hl\">I have a shell,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게는 아니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">but I’m</span> not a crab.</b></span></div></div><div class=\"lec-sent-ko\">저는 껍데기가 있지만, 게는 아니에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퀴즈의 첫 시작으로, 계란의 물리적 특징인 &#39;껍데기&#39;를 언급하여 독자의 호기심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I have a shell, but I’m 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shell</td><td class=\"m\">껍데기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 노란색과 흰색이지만</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m yellow and white,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데이지 꽃은 아니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">but I’m</span> not a
