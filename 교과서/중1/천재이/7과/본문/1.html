<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 7과 본문1","audioDir":"1_audio","preview":false,"count":60,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>What Am I? An Egg in Many Dishes\u003c/h1>\u003ch2>나는 무엇일까요? 여러 요리 속의 달걀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수수께끼로 \u003cb class=\"key\">달걀\u003c/b>을 소개한 뒤, 전 세계의 다양한 달걀 요리와 대표적인 \u003cb class=\"key\">오믈렛\u003c/b>을 알려 주고, 기본 만드는 법과 더 맛있게 만드는 방법까지 설명하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Eggs are used in many dishes around the world, and an omelet is a popular, easy-to-make dish that tastes even better with cheese, vegetables, or meat.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 중학교 1학년 천재 이재영 교과서 일곱 번째 과 본문이에요. 'What am I?'라는 수수께끼로 시작해서, 전 세계의 다양한 달걀 요리와 오믈렛 만드는 법을 알려 주는 글이죠. 요약하면 수수께끼로 달걀을 소개한 뒤, 대표적인 달걀 요리인 오믈렛을 소개하고 쉽게 만드는 법과 더 맛있게 만드는 방법까지 알려 주는 글이에요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">달걀\u003c/b>(egg)은 닭이 낳는 둥근 알로, 단단한 \u003cb class=\"key\">껍데기\u003c/b>(shell)와 흰자, 노른자로 이루어져 있어요. 그래서 '껍데기가 있지만 게는 아니다'처럼 생김새와 특징을 단서로 정답을 맞히는 \u003cb class=\"key\">수수께끼\u003c/b>(riddle)의 소재가 되곤 하죠. 달걀은 삶거나 부치거나 구워서 전 세계 어디서나 먹는 기본 식재료라서 나라마다 다양한 달걀 요리(egg dishes)가 발달했어요. 이 글에 나오는 \u003cb class=\"key\">오믈렛\u003c/b>(omelet)은 달걀을 풀어 기름에 부친 요리로, 프랑스에서 시작해 세계 여러 나라에서 즐기는 대표적인 달걀 요리예요. 마치 라면에 계란이나 치즈를 추가하면 맛이 확 좋아지듯, 오믈렛도 치즈나 채소, 고기를 더하면 훨씬 맛있어집니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 달걀은 닭이 낳는 둥근 알로, 단단한 껍데기와 흰자, 노른자로 이루어져 있어요. 그래서 '껍데기가 있지만 게는 아니다'처럼 생김새와 특징을 단서로 정답을 맞히는 수수께끼의 소재가 되곤 하죠. 달걀은 삶거나 부치거나 구워서 전 세계 어디서나 먹는 기본 식재료라서 나라마다 다양한 달걀 요리가 발달했어요. 이 글에 나오는 오믈렛은 달걀을 풀어 기름에 부친 요리로, 프랑스에서 시작해 세계 여러 나라에서 즐기는 대표적인 달걀 요리예요. 라면에 계란이나 치즈를 추가하면 맛이 확 좋아지듯, 오믈렛도 치즈나 채소, 고기를 더하면 훨씬 맛있어진답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>수수께끼 제시\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>글은 '나는 무엇일까요?'라는 \u003cb class=\"key\">수수께끼\u003c/b>로 시작합니다. 화자는 자신이 \u003cb class=\"key\">껍데기\u003c/b>가 있지만 게는 아니고, 노랗고 하얗지만 데이지 꽃은 아니라고 말하죠. 또 올리브보다 크고 아보카도보다 작다고 하며 단서를 하나씩 던집니다. 이런 단서들은 모두 \u003cb class=\"key\">달걀\u003c/b>의 특징을 가리켜요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정답과 화제 전환\u003csmall>전환 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>이어서 정답이 \u003cb class=\"key\">달걀\u003c/b>이라고 밝히고, 전 세계에 다양한 달걀 요리가 있다는 일반적인 내용으로 넘어갑니다. 그리고 '여러분이 가장 좋아하는 달걀 요리는 무엇인가요?'라고 \u003cb class=\"key\">질문\u003c/b>을 던지죠. 곧바로 '오믈렛은 어떤가요?'라며 오믈렛을 \u003cb class=\"key\">예시\u003c/b>로 제안합니다. 질문과 답, 그리고 제안을 통해 자연스럽게 다음 내용으로 넘어가는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오믈렛 소개와 조리법\u003csmall>예시 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>오믈렛이 \u003cb class=\"key\">인기 \u003c/b>\u003cb class=\"key\">있는\u003c/b> 달걀 요리라고 소개한 뒤, 만드는 방법을 아주 간단하게 설명합니다. 달걀 몇 개를 \u003cb class=\"key\">휘저어\u003c/b> 섞고 기름에 부치면 된다고 하죠. 그리고 '그게 다입니다'라고 말하며 조리법이 어렵지 않다는 점을 강조합니다. 쉬운 \u003cb class=\"key\">조리법\u003c/b> 덕분에 누구나 만들어 볼 수 있다는 뜻이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>더 맛있게 만드는 팁\u003csmall>결론 · 문장 14–16\u003c/small>\u003c/h4>\u003cp>마지막으로 더 맛있는 오믈렛을 원하느냐고 물으며 \u003cb class=\"key\">응용\u003c/b> 방법을 알려 줍니다. 그저 \u003cb class=\"key\">치즈\u003c/b>, 채소, 또는 고기를 더해 보라고 하죠. 그러면 맛이 더 좋아질 것이라고 말하며 글을 맺습니다. 기본 조리법에 \u003cb class=\"key\">재료\u003c/b>를 더하면 더 맛있어진다는 친절한 마무리입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 수수께끼 제시예요. 글은 '나는 무엇일까요?'라는 수수께끼로 시작합니다. 화자는 자신이 껍데기가 있지만 게는 아니고, 노랗고 하얗지만 데이지 꽃은 아니라고 말하죠. 또 올리브보다 크고 아보카도보다 작다고 하면서 단서를 하나씩 던집니다. 이 단서들은 모두 달걀의 특징을 가리키고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 정답 공개와 화제 전환이에요. 이어서 정답이 달걀이라고 밝히고, 전 세계에 다양한 달걀 요리가 있다는 내용으로 넘어갑니다. 그리고 여러분이 가장 좋아하는 달걀 요리가 무엇인지 질문을 던지죠. 곧바로 오믈렛은 어떤가요, 라며 오믈렛을 예시로 제안합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 오믈렛 소개와 조리법이에요. 오믈렛이 인기 있는 달걀 요리라고 소개한 뒤, 만드는 방법을 아주 간단하게 설명합니다. 달걀 몇 개를 휘저어 섞고 기름에 부치면 된다고 하죠. 그리고 그게 다라고 말하면서 조리법이 어렵지 않다는 점을 강조합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 더 맛있게 만드는 팁이에요. 마지막으로 더 맛있는 오믈렛을 원하느냐고 물으면서 응용 방법을 알려 줍니다. 그저 치즈, 채소, 또는 고기를 더해 보라고 하죠. 그러면 맛이 더 좋아질 거라고 말하며 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변(문답)\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 '나는 무엇일까요?'라는 \u003cb class=\"key\">수수께끼\u003c/b>와 그에 대한 답으로 시작해 독자의 흥미를 끕니다. 그런데 글 전체의 중심 내용인 '세계에는 다양한 달걀 요리가 있다'는 \u003cb class=\"key\">주제문\u003c/b>은 글의 중간인 일곱 번째 문장에 나옵니다. 그 뒤에 대표적인 예시로 \u003cb class=\"key\">오믈렛\u003c/b>을 들고, 만드는 법과 응용법을 덧붙이죠. 그래서 질문과 답으로 여는 \u003cb class=\"key\">문답\u003c/b> 구조이면서 주제문이 가운데 있는 중괄식이라고 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>What am I? (4)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>Yes, it is an egg. (6)\u003c/b>\u003cspan>답 제시\u003c/span>\u003cb>That is all. (13)\u003c/b>\u003cspan>마무리·강조\u003c/span>\u003cb>How about (9)\u003c/b>\u003cspan>제안·화제 전환\u003c/span>\u003cb>Just add (15)\u003c/b>\u003cspan>추가·응용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">an egg\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">egg dishes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your favorite egg dish\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an omelet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The omelet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a more delicious omelet\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답으로 내용을 이끄는 질문-답변, 다시 말해 문답 구조예요. 수수께끼로 질문을 던지고 바로 다음 문장에서 답을 제시하면서 독자의 흥미를 끌죠. 그리고 글 전체의 중심 내용은 중간에 나오는 'There are many different egg dishes around the world.'라는 문장이에요. 그래서 주제문이 글 가운데에 놓인 중괄식 구조라고 정리할 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어도 짚어 볼게요. 첫 번째 문장과 두 번째 문장의 but은 대조를 나타내고, 네 번째 문장의 What am I는 질문을 던지는 표현이에요. 여섯 번째 문장의 Yes, it is an egg에서 답이 제시되고, 아홉 번째 문장의 How about은 화제를 오믈렛으로 전환하는 신호죠. 또 열세 번째 문장의 That is all은 조리법 설명을 마무리하고, 열다섯 번째 문장의 Just add는 재료를 더하는 응용으로 이어 줍니다. 같은 대상을 가리키는 표현이 an egg에서 egg dishes와 an omelet으로 이어지는 흐름도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>shell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>껍데기\u003c/span>\u003c/div>\u003cdiv>\u003cb>crab\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게\u003c/span>\u003c/div>\u003cdiv>\u003cb>daisy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>데이지 꽃\u003c/span>\u003c/div>\u003cdiv>\u003cb>olive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>올리브\u003c/span>\u003c/div>\u003cdiv>\u003cb>avocado\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아보카도\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정답, 대답\u003c/span>\u003c/div>\u003cdiv>\u003cb>egg\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달걀, 알\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른, 다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>dish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요리\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에\u003c/span>\u003c/div>\u003cdiv>\u003cb>favorite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>How about ~?\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~은 어때요?\u003c/span>\u003c/div>\u003cdiv>\u003cb>omelet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오믈렛\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>beat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>휘젓다, 치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기름에 부치다, 튀기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>oil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기름\u003c/span>\u003c/div>\u003cdiv>\u003cb>That is all.\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그게 다예요\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>더하다, 추가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheese\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치즈\u003c/span>\u003c/div>\u003cdiv>\u003cb>vegetable\u003c/b>\u003cem>명사\u003c/em>\u003cspan>채소\u003c/span>\u003c/div>\u003cdiv>\u003cb>meat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>taste\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맛이 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>better\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 맛있게, 더 좋게\u003c/span>\u003c/div>\u003cdiv>\u003cb>know\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. shell은 껍데기, dish는 요리라는 뜻이고, around the world는 전 세계에라는 숙어예요. beat은 달걀을 휘젓다는 뜻이고, fry는 기름에 부치다, add는 더하다라는 뜻이죠. delicious는 맛있는, popular는 인기 있는이라는 뜻도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른, 다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easily\u003c/b>\u003cspan class=\"m\">쉽게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simply\u003c/span>\u003cspan class=\"s\">without difficulty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">with difficulty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">yummy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tasteless\u003c/span>\u003cspan class=\"a\">bland\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">better\u003c/b>\u003cspan class=\"m\">더 좋은, 더 맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improved\u003c/span>\u003cspan class=\"s\">superior\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">add\u003c/b>\u003cspan class=\"m\">더하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">put in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003cspan class=\"a\">subtract\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. different는 various, diverse와 뜻이 비슷하고 반대말은 same이나 similar예요. popular는 well-known, common과 가깝고 반대말은 unpopular죠. easily는 simply, without difficulty와 비슷하고 반대는 with difficulty예요. delicious는 tasty, yummy와 비슷하고 반대말은 tasteless, bland이고, better는 improved와 가깝고 반대는 worse예요. add는 include와 뜻이 통하고 반대말은 remove입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 껍데기가 있고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">shell\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 게가 아니에요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">crab\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 껍데기가 있지만, 게는 아니에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 정답을 바로 알려 주지 않고 \u003cb class=\"key\">수수께끼\u003c/b> 형식으로 독자의 궁금증을 끄는 첫 번째 단서예요. 껍데기가 있다는 정보로 게를 떠올리게 해 놓고 but으로 '게는 아니다'라고 뒤집어서 '그럼 뭘까?' 하는 \u003cb class=\"key\">호기심\u003c/b>을 만들죠. 그래서 뒤에 나오는 단서들과 함께 읽으면서 정답을 추리해야 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제(현재의 상태)\u003c/span> : [주어 I + 동사 have + 목적어 a shell] : \"저는 껍데기를 가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사(대조)\u003c/span> : [절 + but + 절] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : [주어 + be동사(am) + not + 보어(a crab)] : \"저는 게가 아니에요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"I have a shell, 저는 껍데기가 있고. but, 하지만. I'm not a crab, 저는 게가 아니에요.. 이 문장 전체를 해석하면, 저는 껍데기가 있지만, 게는 아니에요.","hl":"m"},{"n":13,"text":"이 문장은 정답을 바로 말하지 않고 궁금증을 만드는 수수께끼의 첫 번째 단서예요. 껍데기가 있다고 하니까 게를 떠올리게 하지만, 게는 아니라고 하면서 우리를 헷갈리게 하죠. 그래서 다음 문장들의 단서를 하나씩 모아서 정답을 추리해야 해요.","hl":"mn"},{"n":14,"text":"먼저 I have a shell은 지금 내 상태를 말하는 현재시제예요. 두 번째로 but은 앞뒤 내용을 반대로 이어 주는 등위접속사고요. 마지막으로 I'm not a crab은 be동사 am 뒤에 not을 붙여서 만든 be동사 부정문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 노랗고 하얗고,\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">yellow \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">white\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 데이지 꽃이 아니에요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">daisy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 노랗고 하얗지만, 데이지 꽃은 아니에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 단서로 색깔을 알려 주는 문장이에요. 노랑과 하양이라는 색은 데이지 꽃을 떠올리게 하지만, 다시 '데이지가 아니다'라고 부정하면서 \u003cb class=\"key\">궁금증\u003c/b>을 키우죠. 첫 번째 문장과 똑같이 긍정 뒤에 but으로 부정을 붙이는 \u003cb class=\"key\">대조\u003c/b> 구조가 반복되고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 병렬(and)\u003c/span> : [형용사 + and + 형용사] : \"노랗고 하얀\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사(대조)\u003c/span> : [절 + but + 절] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : [주어 + be동사(am) + not + 보어(a daisy)] : \"저는 데이지 꽃이 아니에요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I'm yellow and white, 저는 노랗고 하얗고. but, 하지만. I'm not a daisy, 저는 데이지 꽃이 아니에요.. 이 문장 전체를 해석하면, 저는 노랗고 하얗지만, 데이지 꽃은 아니에요.","hl":"m"},{"n":16,"text":"이 문장은 색깔을 알려 주는 두 번째 단서예요. 노랗고 하얗다고 하니까 데이지 꽃을 떠올리게 하지만, 데이지는 아니라고 다시 뒤집으면서 궁금증을 키우죠. 첫 번째 문장과 똑같이 but으로 대조하는 방식이 반복되고 있어요.","hl":"mn"},{"n":17,"text":"먼저 yellow and white는 두 색깔 형용사를 and로 나란히 묶은 병렬 표현이에요. 두 번째로 but은 앞뒤 내용을 반대로 이어 주는 등위접속사고요. 마지막으로 I'm not a daisy는 be동사 am 뒤에 not을 붙여서 만든 be동사 부정문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 올리브보다 더 크고,\u003c/span>\u003cspan class=\"en\">I'm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">olive\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 아보카도보다 더 작아요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">smaller \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">avocado\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 올리브보다 더 크지만, 아보카도보다 더 작아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 단서로 크기를 알려 주는 문장이에요. 올리브보다 크고 아보카도보다 작다고 하면서 답의 크기 범위를 좁혀 주죠. 두 가지 비교를 but으로 이어 놓아서, 독자가 '그 정도 크기의 무엇일까?' 하고 \u003cb class=\"key\">추리\u003c/b>를 하게 만드는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 + than\u003c/span> : [비교급(bigger) + than + 비교 대상(an olive)] : \"올리브보다 더 큰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사(대조)\u003c/span> : [절 + but + 절] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 + than\u003c/span> : [주어 + be동사 + 비교급(smaller) + than + 비교 대상(an avocado)] : \"저는 아보카도보다 더 작아요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I'm bigger than an olive, 저는 올리브보다 더 크고. but, 하지만. I'm smaller than an avocado, 저는 아보카도보다 더 작아요.. 이 문장 전체를 해석하면, 저는 올리브보다 더 크지만, 아보카도보다 더 작아요.","hl":"m"},{"n":19,"text":"이 문장은 크기를 알려 주는 세 번째 단서예요. 올리브보다 크고 아보카도보다 작다고 하면서 답이 될 수 있는 크기의 범위를 좁혀 주죠. 두 가지 비교를 but으로 이어 놓아서 독자가 그 정도 크기의 무엇일까 하고 추리하게 만드는 문장이에요.","hl":"mn"},{"n":20,"text":"먼저 bigger than an olive는 big을 비교급 bigger로 바꾸고 than으로 올리브와 비교한 표현이에요. 두 번째로 but은 앞뒤 내용을 반대로 이어 주는 등위접속사고요. 마지막으로 smaller than an avocado도 비교급 smaller에 than을 붙여 아보카도와 비교한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">am \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 무엇일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수수께끼의 마지막 질문으로, 앞의 세 힌트를 종합해 답을 맞혀 보라는 \u003cb class=\"key\">질문\u003c/b>이에요. shell, yellow and white, olive, avocado 같은 \u003cb class=\"key\">힌트\u003c/b>가 모두 하나의 대상을 가리키고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문의 도치(의문사 + be동사 + 주어)\u003c/span> : [[의문사 What]] + [[be동사 am]] + [[주어 I]] : \"저는 무엇일까요?\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"What, 무엇. am, ~일까요. I, 저는. 이 문장 전체를 해석하면, 저는 무엇일까요?","hl":"m"},{"n":22,"text":"이 문장은 수수께끼의 마지막 질문이에요. 껍질이 있고 노란색과 흰색이고 올리브보다 크고 아보카도보다 작은 것이 무엇인지 물어보는 거죠. 앞에 나온 힌트를 모두 모아서 답을 맞혀 보라는 질문입니다.","hl":"mn"},{"n":23,"text":"여기서 첫 번째 포인트는 의문사가 있는 의문문의 도치예요. 무엇을 묻는 의문사 What이 맨 앞에 나오고, be동사 am이 주어 I보다 앞으로 나옵니다. 평서문이라면 I am이라고 쓰지만 의문문에서는 이렇게 자리를 바꿔서 What am I가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 알고 있나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 정답을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 정답을 알고 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정답을 바로 말하지 않고 학생에게 다시 \u003cb class=\"key\">되묻는\u003c/b> 표현이에요. \u003cb class=\"key\">의문문\u003c/b> 형태로 대화를 이끌면서 다음 문장에서 답을 제시하는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 do를 쓴 일반동사 의문문\u003c/span> : [[Do]] + [[주어 you]] + [[동사원형 know]] : \"여러분은 알고 있나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the의 용법(특정 대상 지칭)\u003c/span> : [[the]] + [[명사 answer]] : \"그 정답을\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Do you know, 여러분은 알고 있나요. the answer, 그 정답을. 이 문장 전체를 해석하면, 여러분은 정답을 알고 있나요?","hl":"m"},{"n":25,"text":"이 문장은 정답을 바로 말하지 않고 학생에게 다시 한번 물어보는 표현이에요. 의문문으로 대화를 이어 가면서 다음 문장에서 답을 제시하는 도입 역할을 하죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 조동사 do를 쓴 의문문이에요. 일반동사 know가 들어간 문장을 물어볼 때는 주어 앞에 Do를 세우고 동사는 원형 그대로 써요. 그래서 Do you know가 되는 거죠. 두 번째 포인트는 정관사 the예요. answer 앞에 the를 붙여서 막연한 답이 아니라 수수께끼의 그 정답, 이미 정해져 있는 특정한 답을 가리킨다는 걸 표시합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네,\u003c/span>\u003cspan class=\"en\">Yes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀 하나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">egg\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네, 그것은 달걀입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 \u003cb class=\"key\">긍정\u003c/b>하면서 답을 확정하는 문장이에요. 여기서 it은 앞에서 묻고 있는 '나', 즉 \u003cb class=\"key\">수수께끼의 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 받아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : [[대명사 it]] + [[be동사 is]] : \"그것은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정관사 an의 용법(모음 소리 앞)\u003c/span> : [[부정관사 an]] + [[명사 egg]] : \"달걀 하나\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Yes, 네. it is, 그것은 ~입니다. an egg, 달걀 하나. 이 문장 전체를 해석하면, 네, 그것은 달걀입니다.","hl":"m"},{"n":28,"text":"이 문장은 앞의 질문에 그렇다고 긍정하면서 답을 확정하는 문장이에요. 여기서 it은 앞에서 묻고 있던 나, 그러니까 수수께끼의 대상인 달걀을 받는답니다.","hl":"mn"},{"n":29,"text":"여기서 첫 번째 포인트는 지시대명사 it이에요. 앞에서 나온 명사를 대신 받아서 그것은 이라고 해석하죠. 두 번째 포인트는 부정관사 an이에요. egg는 모음 소리로 시작하니까 a가 아니라 an을 씁니다. 그래서 an egg, 달걀 하나가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 다양한 달걀 요리가\u003c/span>\u003cspan class=\"en\">many different egg dishes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 세계에는 많은 다양한 달걀 요리가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 달걀에 대해 이야기한 뒤, 화제를 '달걀 요리'로 넓히는 도입 문장이에요. \u003cb class=\"key\">around \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">world\u003c/b>라는 표현으로 달걀 요리가 세계 여러 곳에 아주 많다는 것을 강조하고 있어요. 그래서 다음 문장에서 좋아하는 달걀 요리를 묻는 흐름으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There 구문(유도부사 there + be동사)\u003c/span> : There + are + [복수 주어] : '~들이 있다' : \"있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : [명사] + around the world (전치사구) : \"전 세계에는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There are, 있습니다. many different egg dishes, 많은 다양한 달걀 요리가. around the world, 전 세계에는. 이 문장 전체를 해석하면, 전 세계에는 많은 다양한 달걀 요리가 있습니다.","hl":"m"},{"n":31,"text":"이 문장은 달걀 요리가 세계 여러 곳에 아주 많다는 걸 알려 주는 도입 문장이에요. 앞에서 달걀 이야기를 꺼냈으니 이제 달걀 요리로 화제를 넓히는 거죠. around the world라는 표현으로 범위가 전 세계라는 걸 강조하고 있어요.","hl":"mn"},{"n":32,"text":"먼저 There are는 '~이 있다'라는 뜻으로, 셀 수 있는 복수명사 앞에 씁니다. 여기서 there는 '거기에'라는 뜻이 아니라 주어의 존재를 소개하는 유도부사라는 점을 꼭 기억하세요. 두 번째로 around the world는 '전 세계에'라는 장소의 뜻을 더해 주는 전치사구예요. 이 전치사구가 앞의 명사를 뒤에서 꾸며 주는 역할도 한다는 것까지 챙겨 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 가장 좋아하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">favorite\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀 요리는\u003c/span>\u003cspan class=\"en\">egg dish?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 가장 좋아하는 달걀 요리는 무엇인가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학생들에게 자기 취향을 직접 물어보는 질문 문장이에요. 달걀 요리라는 주제를 자기 경험과 연결시키는 역할을 하죠. \u003c/div>","segs":[{"n":39,"text":"The omelet, 그 오믈렛은. is, ~입니다. a popular egg dish, 인기 있는 달걀 요리. 이 문장 전체를 해석하면, 오믈렛은 인기 있는 달걀 요리입니다.","hl":"m"},{"n":40,"text":"이 문장은 오믈렛이 어떤 요리인지 소개하는 문장이에요. 오믈렛은 인기 있는 달걀 요리라고 알려 주면서 글의 주제를 자연스럽게 던져 주죠. 앞에서 오믈렛을 권했으니, 이제 그것이 얼마나 친숙한 요리인지 설명해 주는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, 주어 The omelet 뒤에 동사 is가 오고, 그 뒤에 주격 보어 a popular egg dish가 와서 주어의 정체를 설명해 주죠. 두 번째, 관사 a는 정해지지 않은 하나를 가리키는 부정관사예요. 그래서 a popular egg dish는 특정한 하나가 아니라 막연한 하나의 요리라는 느낌을 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은\u003c/span>\u003cspan class=\"en\">You\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">easily\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 그것을 쉽게 만들 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오믈렛을 쉽게 만들 수 있다고 알려 줘요. it은 바로 앞에 나온 the omelet을 가리키는 \u003cb class=\"key\">대명사\u003c/b>예요. 그래서 누구나 어렵지 않게 오믈렛을 만들 수 있다는 자신감을 전하는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (능력)\u003c/span> : [주어 You] + [조동사 can] + [동사원형 make] : \"만들 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어를 갖는 문장과 부사의 수식\u003c/span> : [동사 make] + [목적어 it]  개를 휘저어 섞고 그것들을 부치다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 them (앞 명사 반복 회피)\u003c/span> : [some eggs] → [them] : \"그것들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 쓰임\u003c/span> : [전치사 in] + [명사 oil] : \"기름에, 기름 속에서\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"You beat some eggs, 여러분은 달걀 몇 개를 휘저어 섞고. and fry them, 그것들을 부칩니다. in oil, 기름에. 이 문장 전체를 해석하면, 여러분은 달걀 몇 개를 휘저어 섞고 그것들을 기름에 부칩니다.","hl":"m"},{"n":46,"text":"이 문장은 오믈렛을 만드는 구체적인 방법을 알려 줘요. 달걀을 휘저어 섞는 동작과 기름에 부치는 동작을 and로 이어서 순서대로 보여 주죠. 그래서 조리 과정이 아주 간단하다는 걸 느끼게 해 줍니다.","hl":"mn"},{"n":47,"text":"첫 번째, and가 두 동작을 이어 주는 등위접속사예요. beat some eggs와 fry them이라는 두 동사구를 대등하게 연결하죠. 두 번째, fry 뒤의 them은 앞에 나온 some eggs를 다시 가리키는 대명사예요. 같은 말을 반복하지 않으려고 them으로 바꿔 쓴 거예요. 세 번째, in oil은 부치다라는 동작이 기름 속에서 일어난다는 걸 알려 주는 전치사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그게 바로 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전부\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그게 다입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오믈렛 만드는 방법 설명을 깔끔하게 마무리하는 문장이에요. 달걀을 풀어 기름에 부치면 끝이라는 것을 알려 주죠. 여기서 That은 바로 앞에서 말한 그 방법 전체를 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어+동사+주격보어)\u003c/span> : That[주어] + is[동사] + all[주격보어] : \"그게 전부입니다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"That is, 그게 바로 ~입니다. all, 전부. 이 문장 전체를 해석하면, 그게 다입니다.","hl":"m"},{"n":49,"text":"이 문장은 오믈렛 만드는 방법 설명을 마무리하는 문장이에요. 달걀을 풀어서 기름에 부치기만 하면 끝이라는 걸 알려 주죠. 여기서 That은 바로 앞에서 말한 그 방법 전체를 가리키는 지시대명사예요.","hl":"mn"},{"n":50,"text":"먼저 That은 앞에 나온 내용 전체를 받는 지시대명사 주어예요. is는 be동사이고, all은 주어의 상태를 설명해 주는 주격보어로 쓰였어요. 그래서 That is all은 주어와 동사, 그리고 주격보어 순서로 이루어진 2형식 문장이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 원하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 맛있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">delicious \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오믈렛을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">omelet\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 더 맛있는 오믈렛을 원하나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 질문을 던져 관심을 끄는 문장이에요. 기본 오믈렛에서 한 단계 더 나아가는 내용으로 넘어가게 해 주는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이죠. more delicious는 지금보다 한 단계 더 맛있다는 \u003cb class=\"key\">비교급\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 의문문(조동사 do)\u003c/span> : Do + 주어 + 동사원형 ~? : \"여러분은 ~을 원하나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more + 형용사\u003c/span> : more + [형용사] + [명사] : \"더 맛있는 오믈렛\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Do you want, 여러분은 원하나요. a more delicious, 더 맛있는. omelet, 오믈렛을. 이 문장 전체를 해석하면, 여러분은 더 맛있는 오믈렛을 원하나요?","hl":"m"},{"n":52,"text":"이 문장은 독자에게 질문을 던져서 관심을 끄는 역할을 해요. 기본 오믈렛 이야기에서 더 맛있는 오믈렛 이야기로 넘어가는 자연스러운 도입 질문이죠. more delicious는 지금보다 한 단계 더 맛있다는 비교급 표현이에요.","hl":"mn"},{"n":53,"text":"먼저 Do you want를 볼까요. 일반동사 want의 의문문은 조동사 do를 문장 맨 앞에 두고 동사는 동사원형으로 써요. 그래서 Do you want 형태가 되는 거죠. 다음으로 a more delicious omelet을 보면, 음절이 긴 형용사 delicious는 뒤에 er을 붙이지 않고 앞에 more를 붙여서 비교급을 만들어요. 비교급이 명사를 꾸밀 때는 관사 a 뒤에 온다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그저 더해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"tgt\">add\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치즈\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cheese, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">채소\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">vegetables, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 고기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">meat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그저 치즈, 채소, 또는 고기를 더해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 더 맛있는 오믈렛을 만드는 아주 간단한 방법을 알려 주는 문장이에요. 재료를 추가하라는 \u003cb class=\"key\">명령문\u003c/b>으로, 앞 문장의 질문에 대한 \u003cb class=\"key\">해답\u003c/b> 역할을 하죠. 치즈와 채소, 고기를 or로 이어 여러 재료 중 아무거나 골라도 된다는 \u003cb class=\"key\">선택\u003c/b>의 뜻을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형)\u003c/span> : Just + [동사원형] ~ : \"그저 더하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 병렬구조(or)\u003c/span> : [A], [B], or [C] : \"치즈, 채소, 또는 고기\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Just add, 그저 더해 보세요. cheese, 치즈. vegetables, 채소. or meat, 또는 고기를. 이 문장 전체를 해석하면, 그저 치즈, 채소, 또는 고기를 더해 보세요.","hl":"m"},{"n":55,"text":"이 문장은 더 맛있는 오믈렛을 만드는 아주 간단한 방법을 알려 줘요. 바로 재료를 추가하라는 명령문이고, 앞에서 던진 질문에 대한 해답 역할을 하죠. 치즈와 채소, 고기를 or로 이어서 여러 재료 중 아무거나 골라도 된다는 뜻을 나타내요.","hl":"mn"},{"n":56,"text":"먼저 Just add를 보세요. 명령문은 주어 You를 생략하고 동사원형으로 문장을 시작해요. 그래서 add가 그대로 나오는 거고, 앞에 Just를 붙여서 그저, 그냥이라는 강조의 느낌을 더한 거예요. 다음으로 cheese, vegetables, or meat를 보면, 여러 명사를 같은 형태로 나열하는 병렬구조예요. 마지막에 or를 쓰면 이것들 중 아무거나라는 선택의 뜻이 된다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛이 날 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">taste\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 맛있게!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">better\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 더 맛있을 것입니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 치즈나 채소, 고기를 더하면 오믈렛이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">맛있게\u003c/b> 된다고 \u003cb class=\"key\">마무리\u003c/b>하는 문장이에요. taste better는 '더 맛있게 느껴지다'라는 뜻으로, 요리법을 따라 했을 때 결과가 좋아진다는 기대를 담고 있어요. 글의 흐름에서 독자에게 재료를 추가해 보라고 권하는 \u003cb class=\"key\">설득\u003c/b> 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (단순미래)\u003c/span> : [주어] + will + [동사원형] : \"~할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 taste (2형식)\u003c/span> : [감각동사 taste] + [형용사 보어 better] : \"더 맛이 나다, 더 맛있게 느껴지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 (good/well의 비교급)\u003c/span> : [better] = [more good/well] : \"더 좋게, 더 맛있게\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"It, 그것은. will taste, 맛이 날 것입니다. better!, 더 맛있게!. 이 문장 전체를 해석하면, 그것은 더 맛있을 것입니다!","hl":"m"},{"n":58,"text":"이 문장은 앞에서 말한 치즈나 채소, 고기를 더하면 오믈렛이 더 맛있게 된다고 마무리하는 문장이에요. taste better는 더 맛있게 느껴진다는 뜻으로, 요리법을 따라 했을 때 결과가 좋아진다는 기대를 담고 있어요. 글의 흐름에서 독자에게 재료를 추가해 보라고 권하는 설득 문장이죠.","hl":"mn"},{"n":59,"text":"먼저 will은 미래를 나타내는 조동사예요. will 뒤에는 동사원형 taste가 와서 앞으로 그렇게 될 거라는 미래의 뜻을 만들어요. 두 번째로 taste는 감각동사라서 뒤에 부사가 아니라 형용사 보어 better가 와요. 그래서 주어의 상태를 설명하는 문장이 되는 거죠. 세 번째로 better는 good이나 well의 비교급이에요. 그래서 지금 상태보다 더 좋아진다는 비교의 뜻을 담고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이 글은 '나는 무엇일까요?'라는 \u003cb class=\"key\">수수께끼\u003c/b>로 시작해 정답이 \u003cb class=\"key\">달걀\u003c/b>임을 밝힙니다.\u003c/li>\u003cli>전 세계에는 많은 다양한 \u003cb class=\"key\">달걀 \u003c/b>\u003cb class=\"key\">요리\u003c/b>가 있고, 그중 하나가 바로 \u003cb class=\"key\">오믈렛\u003c/b>입니다.\u003c/li>\u003cli>오믈렛은 달걀을 \u003cb class=\"key\">휘저어\u003c/b> 기름에 부치면 되는 쉽고 인기 있는 요리입니다.\u003c/li>\u003cli>여기에 \u003cb class=\"key\">치즈\u003c/b>, 채소, 고기를 더하면 더 맛있는 오믈렛을 만들 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Eggs are used in many dishes around the world, and an omelet is a popular, easy-to-make dish that tastes even better with cheese, vegetables, or meat.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수수께끼로 \u003cb class=\"key\">달걀\u003c/b>을 소개한 뒤, 전 세계의 다양한 달걀 요리와 대표적인 \u003cb class=\"key\">오믈렛\u003c/b>을 알려 주고, 기본 만드는 법과 더 맛있게 만드는 방법까지 설명하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":60,"text":"오늘 글 잘 따라오셨나요? 이 글은 수수께끼로 달걀을 소개하고, 전 세계의 다양한 달걀 요리 가운데 오믈렛을 예시로 들어 쉽게 만드는 법과 더 맛있게 만드는 방법까지 알려 주었어요. 핵심은 질문과 답으로 흥미를 끌고, 주제문을 글 가운데에 두는 중괄식 구조라는 점이에요. 오늘 배운 단어와 표현도 꼭 복습해 보시고요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
