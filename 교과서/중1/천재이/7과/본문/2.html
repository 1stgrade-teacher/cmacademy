<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 7과 본문2","audioDir":"2_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Napoleon and the Giant Omelet of Bessières\u003c/h1>\u003ch2>나폴레옹과 베시에르의 거대한 오믈렛\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 나폴레옹이 \u003cb class=\"key\">베시에르\u003c/b> 마을의 오믈렛을 매우 즐기고 다음 날 군대를 위해 거대한 오믈렛을 요청한 이야기가, 오늘날 매년 열리는 \u003cb class=\"key\">오믈렛 \u003c/b>\u003cb class=\"key\">축제\u003c/b>로 이어지고 있다는 글이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A past story of Napoleon asking for a giant omelet has become an annual omelet festival in Bessières today.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 오믈렛에 관한 재미있는 이야기를 함께 읽어 볼 거예요. 나폴레옹이 베시에르 마을에서 오믈렛을 맛보고, 다음 날 자기 군대를 위해 거대한 오믈렛을 요청했다는 내용이죠. 이 이야기가 오늘날 매년 열리는 오믈렛 축제로 이어졌다는 게 이 글의 요지예요. 그럼 같이 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">나폴레옹(Napoleon)은 십구 세기 초 유럽을 지배했던 프랑스의 황제이자 뛰어난 군사 지휘관이에요. 그는 수많은 전투를 이끌며 유럽 곳곳을 이동했기 때문에, 그가 다녀간 지역에는 다양한 일화가 전해 내려와요. \u003cb class=\"key\">오믈렛\u003c/b>(omelet)은 달걀을 풀어 부쳐 만든 요리로, 프랑스에서는 지역마다 자기만의 방식으로 즐기는 향토 음식이에요. 베시에르(Bessières)는 프랑스 남부의 작은 마을로, 지금도 매년 거대한 오믈렛을 만들어 나누는 \u003cb class=\"key\">축제\u003c/b>로 유명해요. 이 글처럼 오래전 실제 사건이 오늘날의 전통으로 이어지는 경우가 많은데, 우리 동네 축제가 옛날 어느 유명 인물의 방문에서 시작되었다는 이야기와 비슷하죠. 그래서 이런 글은 과거의 사건과 현재의 전통을 연결하며 읽는 것이 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 나폴레옹은 십구 세기 초 유럽을 지배했던 프랑스의 황제이자 뛰어난 군사 지휘관이에요. 그가 수많은 전투를 이끌며 유럽 곳곳을 옮겨 다녔기 때문에, 그가 다녀간 지역에는 다양한 일화가 전해 내려오죠. 오믈렛은 달걀을 풀어 부쳐 만든 요리로, 프랑스에서는 지역마다 자기만의 방식으로 즐기는 향토 음식이에요. 베시에르는 프랑스 남부의 작은 마을인데, 지금도 매년 거대한 오믈렛을 만들어 나누는 축제로 유명하답니다. 우리 동네 축제가 옛날 어느 유명 인물의 방문에서 시작되었다는 이야기와 비슷하죠. 그래서 이런 글은 과거의 사건과 현재의 전통을 연결하며 읽는 게 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이야기 소개\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>이 글은 오믈렛에 관한 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 하나 있다는 문장으로 시작해요. 흥미로운 소재를 먼저 던져 독자의 관심을 끄는 \u003cb class=\"key\">도입\u003c/b> 부분이죠. 앞으로 어떤 내용이 펼쳐질지 궁금하게 만드는 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>나폴레옹과 마을\u003csmall>배경 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>어느 날 \u003cb class=\"key\">나폴레옹\u003c/b>과 그의 군대가 \u003cb class=\"key\">베시에르\u003c/b> 마을 근처에 머물렀어요. 그리고 나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그것을 매우 즐겼죠. 이 부분이 뒤에 이어질 사건의 \u003cb class=\"key\">배경\u003c/b>이자 원인이 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거대한 오믈렛 요청\u003csmall>결과 · 문장 4\u003c/small>\u003c/h4>\u003cp>오믈렛을 맛있게 먹은 나폴레옹은 다음 날 그의 \u003cb class=\"key\">군대\u003c/b>를 위해 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">오믈렛\u003c/b>을 요청했어요. 앞에서 오믈렛을 즐긴 일이 이 요청으로 이어지는 \u003cb class=\"key\">결과\u003c/b> 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>오늘날의 축제\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>오늘날 베시에르 사람들은 매년 그들의 \u003cb class=\"key\">오믈렛 \u003c/b>\u003cb class=\"key\">축제\u003c/b>를 위해 거대한 오믈렛을 만들어요. 과거의 일화가 현재의 \u003cb class=\"key\">전통\u003c/b>으로 이어지고 있음을 보여 주는 마무리 문장이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 글의 흐름을 단계별로 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 이야기 소개예요. 글은 오믈렛에 관한 재미있는 이야기가 하나 있다는 문장으로 시작하죠. 흥미로운 소재를 먼저 던져서 여러분의 관심을 끄는 도입 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 나폴레옹과 마을이에요. 어느 날 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀어요. 그리고 나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그것을 매우 즐겼죠. 이 부분이 뒤에 이어질 사건의 배경이자 원인이 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 거대한 오믈렛 요청이에요. 오믈렛을 맛있게 먹은 나폴레옹은 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했어요. 앞에서 오믈렛을 즐긴 일이 이 요청으로 이어지는 결과 부분이죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 오늘날의 축제예요. 오늘날 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만들어요. 과거의 일화가 현재의 전통으로 이어지고 있음을 보여 주는 마무리 문장이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">오믈렛에 \u003c/b>\u003cb class=\"key\">관한 \u003c/b>\u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 있다고 화제를 먼저 제시하고, 그 뒤에 구체적인 일화를 풀어 놓는 \u003cb class=\"key\">두괄식\u003c/b> 구조예요. 두 번째 문장부터는 과거의 사건을 시간 순서대로 전개하고, 마지막 문장에서 오늘날로 넘어와 현재의 전통을 제시하죠. 즉 화제 제시 뒤에 사건이 \u003cb class=\"key\">시간순\u003c/b>으로 이어지는 흐름이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (2)\u003c/b>\u003cspan>과거 사건의 시작\u003c/span>\u003cb>the next day (4)\u003c/b>\u003cspan>시간의 흐름(다음 날)\u003c/span>\u003cb>These days (5)\u003c/b>\u003cspan>현재로의 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">omelets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an omelet from the town\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a giant omelet for his army\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a giant omelet for their omelet festival\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 첫 문장에서 오믈렛에 관한 재미있는 이야기가 있다고 화제를 먼저 제시하고, 그 뒤에 구체적인 일화를 풀어 놓는 두괄식 구조죠. 어느 날에서 시작해 과거의 사건을 시간 순서대로 전개하고, 마지막 문장에서 오늘날로 넘어와 현재의 전통을 보여 줘요. 그래서 화제 제시 뒤에 사건이 시간순으로 이어지는 글이에요.","hl":"ty"},{"n":9,"text":"신호어를 보면, 두 번째 문장의 One day는 과거 사건의 시작을 알려 줘요. 네 번째 문장의 the next day는 다음 날이라는 시간의 흐름을 표시하고, 다섯 번째 문장의 These days는 현재로 전환하는 신호예요. 또 오믈렛이라는 말이 an omelet from the town, a giant omelet for his army처럼 계속 바뀌어 반복되면서 하나의 개념으로 이어지죠. 이렇게 시간 표현과 재진술을 따라가면 글의 흐름이 한눈에 잡혀요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>There is\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재미있는, 흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 관한\u003c/span>\u003c/div>\u003cdiv>\u003cb>omelet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오믈렛\u003c/span>\u003c/div>\u003cdiv>\u003cb>One day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>army\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군대\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>near\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~근처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>town\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을, 도시\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹어 보다, 시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>from\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에서, ~출신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>very much\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매우, 대단히\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요청하다, 달라고 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>the next day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다음 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>These days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오늘날, 요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>festival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>every year\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매년\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. ask for는 요청하다, 달라고 하다는 뜻이고, giant는 거대한이라는 뜻이에요. stay는 머물다, enjoy는 즐기다라는 의미로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">interesting\u003c/b>\u003cspan class=\"m\">재미있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fascinating\u003c/span>\u003cspan class=\"s\">engaging\u003c/span>\u003cspan class=\"s\">exciting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">relish\u003c/span>\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">giant\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ask for\u003c/b>\u003cspan class=\"m\">요청하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">reject\u003c/ ass=\"ko\">오믈렛에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">omelets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오믈렛에 관한 재미있는 이야기가 하나 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">도입\u003c/b> 부분으로, 오믈렛에 관한 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 있다고 말하며 뒤에 이어질 내용을 예고합니다. 아직 구체적인 이야기는 나오지 않았으므로 독자의 \u003cb class=\"key\">흥미\u003c/b>를 끄는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(존재 표현)\u003c/span> : There is + [단수 명사] : \"~이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사가 명사를 앞에서 수식\u003c/span> : [관사 + 형용사 + 명사] : \"재미있는 이야기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 about의 목적어\u003c/span> : about + [명사] : \"오믈렛에 관한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There is, 있습니다. an interesting story, 재미있는 이야기가. about omelets, 오믈렛에 관한. 이 문장 전체를 해석하면, 오믈렛에 관한 재미있는 이야기가 하나 있습니다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 도입 부분이에요. 오믈렛에 관한 재미있는 이야기가 있다고 말하면서 뒤에 이어질 내용을 예고하죠. 아직 구체적인 이야기는 나오지 않았으니까 독자의 흥미를 끄는 역할을 해요.","hl":"mn"},{"n":14,"text":"먼저 There is 구문이에요. 처음 언급하는 사물의 존재를 소개할 때 쓰고, 뒤에 오는 단수 명사 story가 진짜 주어예요. 두 번째로 interesting은 뒤의 story를 꾸며 주는 형용사로 쓰였어요. 그래서 재미있는 이야기라는 뜻이 되죠. 세 번째로 about은 ~에 관한이라는 뜻의 전치사이고 뒤에 명사 omelets가 목적어로 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나폴레옹과 그의 군대가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Napoleon \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">army\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머물렀습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stayed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베시에르 마을 근처에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">near\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">town \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Bessières\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 \u003cb class=\"key\">배경\u003c/b>을 알려 줍니다. 나폴레옹과 군대가 베시에르 마을 근처에 머물렀다는 사실이 뒤에서 오믈렛을 먹게 된 \u003cb class=\"key\">계기\u003c/b>로 이어져요. 시간과 \u003cb class=\"key\">장소\u003c/b>를 제시해 사건의 출발점을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">and로 연결된 복수 주어\u003c/span> : [명사 A] and [명사 B] + [복수 동사] : \"나폴레옹과 그의 군대가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거시제(규칙 동사)\u003c/span> : [주어] + [동사 과거형] : \"머물렀습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 near(장소)\u003c/span> : near + [명사구] : \"~근처에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">of를 이용한 동격 표현\u003c/span> : the town of + [고유명사] : \"베시에르 마을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One day, 어느 날. Napoleon and his army, 나폴레옹과 그의 군대가. stayed, 머물렀습니다. near the town of Bessières, 베시에르 마을 근처에. 이 문장 전체를 해석하면, 어느 날, 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀습니다.","hl":"m"},{"n":16,"text":"두 번째 문장은 이야기의 배경을 알려 줘요. 나폴레옹과 군대가 베시에르 마을 근처에 머물렀다는 사실이 뒤에서 오믈렛을 먹게 된 계기로 이어지죠. 시간과 장소를 제시해서 사건의 출발점을 만듭니다.","hl":"mn"},{"n":17,"text":"먼저 Napoleon and his army를 보세요. and로 두 명사가 연결되면 주어가 복수로 취급돼요. 그래서 이 문장에서는 과거 동사 stayed가 함께 왔죠. 두 번째로 stayed는 stay에 -ed를 붙인 과거시제예요. 이미 지난 어느 날의 일이니까요. 세 번째로 near는 ~근처에라는 뜻의 전치사이고 뒤에 명사구가 와서 장소를 보충해요. 네 번째로 the town of Bessières에서 of는 앞의 town과 뒤의 Bessières를 연결해 베시에르라는 마을이라는 동격 관계를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나폴레옹은 먹어 보았습니다\u003c/span>\u003cspan class=\"en\">Napoleon \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을에서 만든 오믈렛을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">omelet \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">town\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그는 그것을 즐겼습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">enjoyed \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">much\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그는 그것을 매우 즐겼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나폴레옹이 오믈렛을 먹고 \u003cb class=\"key\">만족\u003c/b>한 사건을 구체적으로 보여 줍니다. 마을에서 만든 오믈렛을 먹어 보고 매우 즐겼다는 내용이 다음 문장의 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">오믈렛\u003c/b> 요청으로 이어지는 \u003cb class=\"key\">원인\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제(규칙 동사)\u003c/span> : [주어] + [동사 과거형] : \"먹어 보았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사] + from + [명사] : \"마을에서 만든 오믈렛\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 연결된 절\u003c/span> : [절], and [절] : \"그리고 그는 그것을 즐겼습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">정도를 나타내는 부사구\u003c/span> : [동사] + very much : \"매우\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Napoleon tried, 나폴레옹은 먹어 보았습니다. an omelet from the town, 마을에서 만든 오믈렛을. and he enjoyed it, 그리고 그는 그것을 즐겼습니다. very much, 매우. 이 문장 전체를 해석하면, 나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그는 그것을 매우 즐겼습니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 나폴레옹이 오믈렛을 먹고 만족한 사건을 구체적으로 보여 줘요. 마을에서 만든 오믈렛을 먹어 보고 매우 즐겼다는 내용이 다음 문장의 거대한 오믈렛 요청으로 이어지는 원인이 되죠.","hl":"mn"},{"n":20,"text":"먼저 tried는 try에 -ed를 붙인 과거시제예요. 여기서는 먹어 보다라는 뜻으로 쓰였죠. 두 번째로 an omelet from the town에서 from the town이 앞의 an omelet을 뒤에서 꾸며 마을에서 온, 마을에서 만든 오믈렛이라는 뜻을 더해요. 세 번째로 and he enjoyed it에서 and는 두 절을 대등하게 이어 주는 등위접속사예요. he는 나폴레옹을, it은 오믈렛을 가리킵니다. 네 번째로 very much는 동사 enjoyed를 꾸며 얼마나 즐겼는지 정도를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 요청했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 오믈렛을\u003c/span>\u003cspan class=\"en\">a giant omelet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 군대를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">army\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 날\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나폴레옹이 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">날\u003c/b> 그의 \u003cb class=\"key\">군대\u003c/b>를 위해 거대한 \u003cb class=\"key\">오믈렛\u003c/b>을 달라고 요청했다는 내용이에요. 앞 문장에서 오믈렛을 아주 맛있게 먹었다는 이야기 다음에, 그가 그것을 군대 전체를 위해 요청하는 장면으로 이어지는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현(ask for + 명사)\u003c/span> : ask for + [요청하는 대상] : \"요청했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(목적·이익)\u003c/span> : for + [명사(이익을 받는 대상)] : \"그의 군대를 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사구\u003c/span> : [the next day] = 다음 날 : \"다음 날\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He asked for, 그는 요청했습니다. a giant omelet, 거대한 오믈렛을. for his army, 그의 군대를 위해. the next day, 다음 날. 이 문장 전체를 해석하면, 그는 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했습니다.","hl":"m"},{"n":22,"text":"이 문장은 나폴레옹이 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했다는 내용이에요. ask for는 무엇을 달라고 요청하다는 뜻이고, 앞 문장에서 오믈렛을 아주 맛있게 먹었다는 이야기 다음에 이어지는 흐름이죠.","hl":"mn"},{"n":23,"text":"먼저 asked for를 보세요. ask for는 무엇을 요청하다는 뜻으로 함께 쓰이는 관용표현이에요. ask만 쓰면 묻다가 되지만, for가 붙으면 원하는 것을 달라고 요구하는 의미가 돼요. 두 번째로 for his army는 그의 군대를 위해라는 뜻으로, for가 목적이나 이익을 나타내는 전치사구예요. 마지막으로 the next day는 다음 날이라는 시간 부사구로, 요청한 시점을 알려 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날,\u003c/span>\u003cspan class=\"en\">These days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베시에르 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Bessières\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 오믈렛을 만듭니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">giant \u003c/span>\u003cspan class=\"tgt\">omelet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 오믈렛 축제를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">omelet \u003c/span>\u003cspan class=\"tgt\">festival\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">year\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날, 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘날 베시에르 사람들이 \u003cb class=\"key\">매년\u003c/b> 오믈렛 \u003cb class=\"key\">축제\u003c/b>를 위해 거대한 오믈렛을 만든다는 내용이에요. 과거 나폴레옹의 일화가 오늘날의 \u003cb class=\"key\">축제\u003c/b> 전통으로 이어진다는 흐름을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사 people] + [in Bessières (전치사구/형용사 역할)] : \"베시에르 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식(주어 + 타동사 + 목적어)\u003c/span> : [주어 people] + make[타동사] + [a giant omelet (목적어)] : \"거대한 오믈렛을 만듭니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(목적)\u003c/span> : for + [명사(목적·이유)] : \"그들의 오믈렛 축제를 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">빈도 부사구\u003c/span> : [every year] = 매년 : \"매년\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"These days, 오늘날. people in Bessières, 베시에르 사람들은. make a giant omelet, 거대한 오믈렛을 만듭니다. for their omelet festival, 그들의 오믈렛 축제를 위해. every year, 매년. 이 문장 전체를 해석하면, 오늘날, 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만듭니다.","hl":"m"},{"n":25,"text":"오늘날 베시에르 사람들은 매년 오믈렛 축제를 위해 거대한 오믈렛을 만든다는 내용이에요. 과거 나폴레옹의 일화가 오늘날의 축제 전통으로 이어진다는 흐름을 보여 주는 문장이죠.","hl":"mn"},{"n":26,"text":"먼저 people in Bessières를 보세요. 전치사구 in Bessières가 앞의 명사 people을 뒤에서 꾸며서 베시에르에 있는 사람들, 즉 베시에르 사람들이라는 뜻이 돼요. 두 번째로 make a giant omelet을 보면, make는 만들다라는 뜻의 타동사라서 뒤에 만드는 대상인 a giant omelet이 목적어로 와요. 세 번째로 for their omelet festival에서 for는 을 위해라는 목적을 나타내서, 오믈렛을 만드는 이유를 알려 줘요. 마지막으로 every year는 매년이라는 빈도 부사구로, 이 일이 해마다 반복된다는 것을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오믈렛에 관한 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 하나 있다.\u003c/li>\u003cli>어느 날 \u003cb class=\"key\">나폴레옹\u003c/b>과 그의 군대가 베시에르 마을 근처에 머물렀다.\u003c/li>\u003cli>나폴레옹은 마을의 오믈렛을 매우 즐기고 다음 날 군대를 위해 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">오믈렛\u003c/b>을 요청했다.\u003c/li>\u003cli>오늘날 베시에르 사람들은 매년 \u003cb class=\"key\">오믈렛 \u003c/b>\u003cb class=\"key\">축제\u003c/b>를 위해 거대한 오믈렛을 만든다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A past story of Napoleon asking for a giant omelet has become an annual omelet festival in Bessières today.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 나폴레옹이 \u003cb class=\"key\">베시에르\u003c/b> 마을의 오믈렛을 매우 즐기고 다음 날 군대를 위해 거대한 오믈렛을 요청한 이야기가, 오늘날 매년 열리는 \u003cb class=\"key\">오믈렛 \u003c/b>\u003cb class=\"key\">축제\u003c/b>로 이어지고 있다는 글이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘은 나폴레옹과 거대한 오믈렛 이야기를 읽어 봤어요. 어느 날 나폴레옹이 베시에르 마을에서 오믈렛을 즐기고, 다음 날 군대를 위해 거대한 오믈렛을 요청했죠. 그리고 그 이야기가 오늘날 매년 열리는 오믈렛 축제로 이어졌다는 점, 꼭 기억해 두세요. 시간 표현을 중심으로 과거와 현재를 연결하며 읽는 습관도 잊지 마시고요. 오늘도 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
