<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 7과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 7과 본문3","audioDir":"3_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>7과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Omelets Around the World: Spain and Malaysia\u003c/h1>\u003ch2>세계 곳곳의 오믈렛: 스페인과 말레이시아\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>전 세계 사람들은 저마다 다른 \u003cb class=\"key\">오믈렛\u003c/b> 조리법을 가지고 있으며, 스페인의 \u003cb class=\"key\">Tortilla \u003c/b>\u003cb class=\"key\">de \u003c/b>\u003cb class=\"key\">Patata\u003c/b>와 말레이시아의 Nasi Goreng Pattaya가 그 예로 소개됩니다. 글은 두 사례를 보여 준 뒤 \u003cb class=\"key\">배고픔\u003c/b>을 물으며 오믈렛을 먹어 보라고 권합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People around the world have their own omelet recipes, and the text shows examples from Spain and Malaysia.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 세계 여러 나라의 오믈렛 이야기를 다룬 지문을 함께 읽어 볼 거예요. 이 글은 전 세계 사람들이 저마다 자신만의 오믈렛 조리법을 가지고 있다는 내용으로 시작해요. 스페인과 말레이시아의 오믈렛을 예로 들고, 마지막에는 여러분에게 오믈렛을 먹어 보라고 권하는 글이랍니다. 요지는 나라마다 오믈렛 조리법이 다르다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">오믈렛(omelet)은 달걀을 풀어 팬에 부쳐 만든 요리로, 프랑스에서 시작된 것으로 알려져 있으며 나라마다 이름과 들어 가는 재료가 다릅니다. 스페인의 \u003cb class=\"key\">Tortilla \u003c/b>\u003cb class=\"key\">de \u003c/b>\u003cb class=\"key\">Patata\u003c/b>는 달걀에 감자를 넣어 만드는 대표적인 오믈렛으로, 스페인 사람들이 아침과 저녁을 가리지 않고 즐겨 먹는 음식입니다. 말레이시아와 인도네시아의 Nasi Goreng Pattaya는 닭고기 볶음밥을 얇은 달걀 지단으로 감싼 음식으로, 동남아에서 인기 있는 \u003cb class=\"key\">퓨전\u003c/b> 요리입니다. 우리가 같은 밥이라도 김밥, 볶음밥, 덮밥으로 다르게 만들어 먹듯이, 세계 여러 나라도 같은 달걀 요리를 자기 방식대로 \u003cb class=\"key\">변형\u003c/b>해서 먹습니다. 이렇게 음식에 담긴 재료와 이름은 그 나라의 \u003cb class=\"key\">식문화\u003c/b>를 보여 주는 좋은 단서가 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 오믈렛은 영어로 omelet이라고 쓰고, 달걀을 풀어 팬에 부쳐 만든 음식이에요. 스페인의 Tortilla de Patata는 감자를 넣어 만드는 대표적인 오믈렛으로, 스페인 사람들이 아침과 저녁을 가리지 않고 즐겨 먹는 음식이죠. 말레이시아의 Nasi Goreng Pattaya는 닭고기 볶음밥을 얇은 달걀 지단으로 감싼 음식이고, 인도네시아와 싱가포르에서도 인기가 많아요. 우리가 김밥, 볶음밥, 덮밥처럼 같은 밥을 다르게 표현하듯이, 세계 여러 나라도 같은 달걀 요리를 자기 방식으로 다르게 만들어 먹는 거예요. 그래서 음식에 담긴 재료와 이름은 그 나라의 식문화를 보여 주는 단서가 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주제 제시\u003csmall>도입, 주제 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b> 사람들이 저마다 다른 오믈렛 \u003cb class=\"key\">조리법\u003c/b>을 가지고 있다고 시작합니다. 이 문장이 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다. 독자는 앞으로 여러 나라의 오믈렛 사례가 이어질 것이라고 예상할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>스페인 오믈렛\u003csmall>예시 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>첫 번째 \u003cb class=\"key\">예시\u003c/b>는 스페인입니다. \u003cb class=\"key\">Tortilla \u003c/b>\u003cb class=\"key\">de \u003c/b>\u003cb class=\"key\">Patata\u003c/b>는 스페인식 오믈렛이고, 스페인어로 patata가 \u003cb class=\"key\">감자\u003c/b>를 뜻한다고 설명합니다. 그래서 이 오믈렛에는 \u003cb class=\"key\">달걀\u003c/b>과 감자가 들어간다는 근거까지 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>말레이시아 오믈렛\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>두 번째 예시는 \u003cb class=\"key\">말레이시아\u003c/b>입니다. 사람들은 \u003cb class=\"key\">닭고기 \u003c/b>\u003cb class=\"key\">볶음밥\u003c/b>을 \u003cb class=\"key\">얇은 \u003c/b>\u003cb class=\"key\">오믈렛\u003c/b>으로 감싸는데, 그 이름이 Nasi Goreng Pattaya입니다. 이 음식은 \u003cb class=\"key\">인도네시아\u003c/b>와 싱가포르에서도 인기가 있다고 덧붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>질문과 권유\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>마지막 두 문장은 \u003cb class=\"key\">질문\u003c/b>과 \u003cb class=\"key\">권유\u003c/b>로 이루어집니다. 지금 배가 고픈지 물어보며 독자의 \u003cb class=\"key\">흥미\u003c/b>를 끌어올립니다. 그리고 \u003cb class=\"key\">오믈렛\u003c/b>을 먹어 보는 게 어떻냐고 제안하며 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장은 글 전체의 주제를 알려 줍니다. 전 세계 사람들이 자신만의 오믈렛 조리법을 가지고 있다는 내용이죠. 이 문장이 바로 주제문이라서, 앞으로 여러 나라의 사례가 이어질 거라고 예상할 수 있어요.","hl":"f0"},{"n":5,"text":"두 번째 문장부터 네 번째 문장까지는 스페인의 예시가 나옵니다. Tortilla de Patata가 스페인식 오믈렛이고, 스페인어로 patata가 감자를 뜻한다고 설명해요. 그래서 이 오믈렛에는 달걀과 감자가 들어간다는 것까지 알 수 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장부터 일곱 번째 문장까지는 말레이시아의 예시예요. 사람들이 닭고기 볶음밥을 얇은 오믈렛으로 감싼다고 하고, 그 이름이 Nasi Goreng Pattaya라고 알려 줘요. 인도네시아와 싱가포르에서도 인기가 있다는 덧붙임도 나옵니다.","hl":"f2"},{"n":7,"text":"마지막으로 여덟 번째 문장과 아홉 번째 문장은 질문과 권유로 끝나요. 지금 배가 고픈지 물어보고, 오믈렛을 먹어 보는 게 어떻냐고 제안하죠. 이 부분이 글을 재미있게 마무리하는 장치예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시하고, 그 뒤에 스페인과 말레이시아의 \u003cb class=\"key\">예시\u003c/b>를 차례로 배열했습니다. 주제문이 맨 앞에 있으므로 \u003cb class=\"key\">두괄식\u003c/b> 구성이라고 할 수 있습니다. 각 예시는 나라 이름, 음식 이름, 재료 순서로 설명되어 \u003cb class=\"key\">이해\u003c/b>를 돕습니다. 마지막은 질문과 권유로 마무리해 독자와 \u003cb class=\"key\">상호작용\u003c/b>하려는 의도를 보입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In Spanish (3)\u003c/b>\u003cspan>설명 전환\u003c/span>\u003cb>In Malaysia (5)\u003c/b>\u003cspan>예시 전환\u003c/span>\u003cb>also (7)\u003c/b>\u003cspan>추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">omelet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Tortilla de Patata\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Spanish omelet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Nasi Goreng Pattaya\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this special omelet\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 예시예요. 첫 문장에서 주제를 먼저 말하고, 그 뒤에 스페인과 말레이시아의 사례를 차례로 보여 주는 두괄식 구조죠. 주제문이 맨 앞에 있으니 두괄식이라고 하고, 주제문은 첫 번째 문장이에요. 그래서 이 글은 주제를 먼저 던지고 예시로 뒷받침하는 아주 전형적인 구성이랍니다.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. 세 번째 문장의 In Spanish는 스페인어로 설명을 시작한다는 신호이고, 다섯 번째 문장의 In Malaysia는 말레이시아 예시로 넘어간다는 신호예요. 일곱 번째 문장의 also는 인도네시아와 싱가포르를 추가로 묶어 주는 역할을 하죠. 또 omelet이라는 말이 Tortilla de Patata, Spanish omelet, Nasi Goreng Pattaya처럼 계속 다른 이름으로 바뀌어 나오는 것도 확인해 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신만의\u003c/span>\u003c/div>\u003cdiv>\u003cb>omelet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오믈렛\u003c/span>\u003c/div>\u003cdiv>\u003cb>recipe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조리법\u003c/span>\u003c/div>\u003cdiv>\u003cb>Spanish\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>스페인의\u003c/span>\u003c/div>\u003cdiv>\u003cb>in Spanish\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스페인어로\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potato\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감자\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>egg\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달걀\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrap\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감싸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chicken\u003c/b>\u003cem>명사\u003c/em>\u003cspan>닭고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>fried rice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>볶음밥\u003c/span>\u003c/div>\u003cdiv>\u003cb>thin\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얇은\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이름\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>now\u003c/b>\u003cem>부사\u003c/em>\u003cspan>지금\u003c/span>\u003c/div>\u003cdiv>\u003cb>How about -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 건 어떤가요\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시도하다, 먹어 보다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. recipe는 조리법, wrap은 감싸다, thin은 얇은이라는 뜻이에요. special은 특별한, popular는 인기 있는, hungry는 배고픈이라는 뜻이고요. How about trying은 먹어 보는 게 어때요라는 권유 표현이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">own\u003c/b>\u003cspan class=\"m\">자신만의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">personal\u003c/span>\u003cspan class=\"s\">individual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shared\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wrap\u003c/b>\u003cspan class=\"m\">감싸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"s\">enclose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unwrap\u003c/span>\u003cspan class=\"a\">uncover\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">famous\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thin\u003c/b>\u003cspan class=\"m\">얇은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">slim\u003c/span>\u003cspan class=\"s\">slender\u003c/span>\u003cspan class=\"s\">narrow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thick\u003c/span>\u003cspan class=\"a\">wide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"s\">famished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">try\u003c/b>\u003cspan class=\"m\">시도하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attempt\u003c/span>\u003cspan class=\"s\">test\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give up\u003c/span>\u003cspan class=\"a\">quit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">around the world\u003c/b>\u003cspan class=\"m\">전 세계에서\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all over the world\u003c/span>\u003cspan class=\"s\">worldwide\u003c/span>\u003cspan class=\"s\">globally\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. own은 자신만의라는 뜻으로 personal이나 individual과 가깝고, shared나 common과는 반대예요. wrap은 감싸다라는 뜻으로 cover, enclose와 비슷하고 unwrap과는 반대죠. special은 unique, particular와 비슷하고 ordinary와 반대돼요. popular는 well-liked, famous와 가깝고 unpopular와 반대이고, thin은 slim, slender와 비슷하고 thick과 반대예요. 마지막으로 try는 attempt, test와 가깝고 give up과는 반대라는 것도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계의 사람들은\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신만의 오믈렛 조리법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own\u003c/span> omelet recipes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 세계의 사람들은 그들 자신만의 오믈렛 조리법을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 여는 첫 문장이에요. 나라마다 \u003cb class=\"key\">오믈렛 \u003c/b>\u003cb class=\"key\">조리법\u003c/b>이 다르다는 것을 알려 주죠. own은 '자기 자신의'라는 뜻으로, 각자가 \u003cb class=\"key\">자신만의\u003c/b> 조리법을 가지고 있다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 후위 수식)\u003c/span> : [명사 People] + [전치사구 around the world (형용사구/후위 수식)] : \"전 세계의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재시제(일반적 사실)\u003c/span> : [주어 People(복수)] + [동사 have(원형)] : \"가지고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격 + own(소유 강조)\u003c/span> : [소유격 their] + [own (강조 형용사)] + [명사 omelet recipes] : \"그들 자신만의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"People around the world, 전 세계의 사람들은. have, 가지고 있습니다. their own omelet recipes, 그들 자신만의 오믈렛 조리법을. 이 문장 전체를 해석하면, 전 세계의 사람들은 그들 자신만의 오믈렛 조리법을 가지고 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제를 여는 첫 문장이에요. 나라마다 오믈렛 조리법이 다르다는 걸 알려 주죠. own은 자기 자신의라는 뜻으로, 각자가 자신만의 조리법을 가지고 있다는 점을 강조한답니다.","hl":"mn"},{"n":14,"text":"먼저 around the world를 보세요. 전치사구가 앞에 있는 명사 People을 뒤에서 꾸며 주는 형용사적 용법이에요. 그다음 have는 주어 People이 복수라서 삼인칭 단수일 때 붙는 s 없이 원형 그대로 썼어요. 마지막으로 their own에서 own은 소유격 뒤에서 소유를 강조하는 말이라는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tortilla de Patata(토르티야 데 파타타)는\u003c/span>\u003cspan class=\"en\">Tortilla de Patata\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스페인 오믈렛\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Spanish \u003c/span>\u003cspan class=\"tgt\">omelet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Tortilla de Patata(토르티야 데 파타타)는 스페인 오믈렛입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 여러 나라의 오믈렛을 꺼냈으니, 그 첫 번째 \u003cb class=\"key\">예시\u003c/b>로 스페인 오믈렛을 소개하는 문장이에요. Tortilla de Patata는 \u003cb class=\"key\">고유 \u003c/b>\u003cb class=\"key\">명사\u003c/b>라서 그대로 쓰고, 뒤에서 그것이 무엇인지 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">보어\u003c/b>로 설명해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(주격 보어, 2형식)\u003c/span> : [주어 Tortilla de Patata] + [be동사 is] + [주격보어 a Spanish omelet] : \"스페인 오믈렛입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정관사 a + 형용사 + 명사\u003c/span> : [부정관사 a] + [형용사 Spanish] + [명사 omelet] : \"스페인 오믈렛\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Tortilla de Patata, Tortilla de Patata(토르티야 데 파타타)는. is, 입니다. a Spanish omelet, 스페인 오믈렛. 이 문장 전체를 해석하면, Tortilla de Patata(토르티야 데 파타타)는 스페인 오믈렛입니다.","hl":"m"},{"n":16,"text":"앞 문장에서 여러 나라의 오믈렛 이야기를 꺼냈으니, 이제 그 첫 번째 예시로 스페인 오믈렛을 소개하는 거예요. Tortilla de Patata는 고유 명사라서 그대로 읽어 주면 됩니다.","hl":"mn"},{"n":17,"text":"이 문장은 be동사 is로 주어를 설명하는 문장이에요. 주어와 be동사 뒤의 a Spanish omelet이 같은 대상을 가리키죠. be동사 뒤에서 주어를 설명하는 이 명사를 주격 보어라고 불러요. 그리고 a Spanish omelet에서 a는 여러 오믈렛 중 하나를 가리키는 부정관사라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스페인어로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">Spanish\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">patata는\u003c/span>\u003cspan class=\"en\">'patata'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘감자’를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">'a \u003c/span>\u003cspan class=\"tgt\">potato.'\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스페인어로 patata는 ‘감자’를 의미합니다.\u003c/div>\u003c/ hungry가 보어로 와요. 그래서 배가 고프다고 느끼다라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오믈렛을 먹어 보는 건\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">trying\u003c/span> an omelet?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오믈렛을 먹어 보는 건 어떤가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 마무리하며 독자에게 오믈렛을 먹어 보자고 부드럽게 \u003cb class=\"key\">제안\u003c/b>하는 문장입니다. \u003cb class=\"key\">How \u003c/b>\u003cb class=\"key\">about\u003c/b>은 '~하는 건 어떤가요'라는 뜻으로 제안할 때 쓰는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">How about + 동명사(제안 표현)\u003c/span> : How about + [trying (동명사)] ~? : \"~하는 건 어떤가요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"How about, 어떤가요. trying an omelet?, 오믈렛을 먹어 보는 건. 이 문장 전체를 해석하면, 오믈렛을 먹어 보는 건 어떤가요?","hl":"m"},{"n":37,"text":"이 문장은 글을 마무리하면서 독자에게 오믈렛을 먹어 보자고 부드럽게 제안하는 문장이에요. How about은 어떤가요라는 뜻으로 제안할 때 쓰는 표현이죠.","hl":"mn"},{"n":38,"text":"How about 뒤에는 동명사 trying이 와요. about이 전치사라서 뒤에 동사가 오면 동명사 형태를 써야 하거든요. 그래서 trying an omelet, 오믈렛을 먹어 보는 건이라고 해석합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b>의 사람들은 저마다 \u003cb class=\"key\">자신만의\u003c/b> 오믈렛 \u003cb class=\"key\">조리법\u003c/b>을 가지고 있습니다.\u003c/li>\u003cli>스페인의 \u003cb class=\"key\">Tortilla \u003c/b>\u003cb class=\"key\">de \u003c/b>\u003cb class=\"key\">Patata\u003c/b>는 \u003cb cla
