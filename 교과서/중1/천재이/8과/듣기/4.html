window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"C. Watch and Do","title":"중1 천재(이) 8과 대화문 C. Watch and Do","audioDir":"4_audio","preview":false,"count":47,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">문제 묻고 제안·조언하기\u003c/div>\u003ch1>중1 천재(이) 8과 대화문 C. Watch and Do\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>준호가 어머니 생신 선물을 사려고 친구들에게 도움을 청하고, 케이트와 민지가 장갑과 스카프를 추천하며 색깔을 묻고 고르는 대화입니다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 천재 이 교과서의 Watch and Do 대화문을 함께 공부해요. 준호가 엄마 생신 선물을 사려고 케이트와 민지에게 도움을 청하는 상황이에요. 친구들이 어떤 표현으로 문제를 묻고, 제안하고, 조언하는지 살펴봐요. 대화문을 한 줄씩 읽으면서 핵심 표현과 문법을 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">Kate, Minji, I need help.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">Kate\u003c/span>\u003cdiv class=\"d-en\">What's wrong, Junho?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">I need to buy a present for my mom. This Sunday is her birthday.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">Minji\u003c/span>\u003cdiv class=\"d-en\">Do you have anything in mind?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">I have no idea.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">Kate\u003c/span>\u003cdiv class=\"d-en\">Why don't you buy these gloves? It's getting cold these days.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">Well, she has a lot of gloves.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">Minji\u003c/span>\u003cdiv class=\"d-en\">Then how about this scarf? It's very pretty.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">That's a good idea. Hmm.... There are so many colors.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-9\">\u003cspan class=\"d-sp\">Kate\u003c/span>\u003cdiv class=\"d-en\">What color does she like?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-10\">\u003cspan class=\"d-sp\">Junho\u003c/span>\u003cdiv class=\"d-en\">She likes blue. I'll get a blue scarf.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-11\">\u003cspan class=\"d-sp\">Minji\u003c/span>\u003cdiv class=\"d-en\">Perfect! I hope she likes it.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Kate, Minji, I need help.","hl":"r-0"},{"n":3,"text":"What's wrong, Junho?","hl":"r-1"},{"n":4,"text":"I need to buy a present for my mom. This Sunday is her birthday.","hl":"r-2"},{"n":5,"text":"Do you have anything in mind?","hl":"r-3"},{"n":6,"text":"I have no idea.","hl":"r-4"},{"n":7,"text":"Why don't you buy these gloves? It's getting cold these days.","hl":"r-5"},{"n":8,"text":"Well, she has a lot of gloves.","hl":"r-6"},{"n":9,"text":"Then how about this scarf? It's very pretty.","hl":"r-7"},{"n":10,"text":"That's a good idea. Hmm.... There are so many colors.","hl":"r-8"},{"n":11,"text":"What color does she like?","hl":"r-9"},{"n":12,"text":"She likes blue. I'll get a blue scarf.","hl":"r-10"},{"n":13,"text":"Perfect! I hope she likes it.","hl":"r-11"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">문제·걱정 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What's wrong?\u003c/div>\u003cdiv class=\"d-mean\">무슨 일이야?, 왜 그래?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: What's wrong, Junho?\u003c/div>\u003cdiv class=\"d-exp\">상대방이 걱정스러워 보이거나 무슨 문제가 있는 것 같을 때 쓰는 표현이에요. \u003cb class=\"key\">What's wrong?\u003c/b>은 '무슨 일이야?'라는 뜻으로, 가까운 친구에게 편하게 \u003cb class=\"key\">문제\u003c/b>나 \u003cb class=\"key\">걱정\u003c/b>을 물을 때 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>What's the matter?\u003c/li>\u003cli>Is something wrong?\u003c/li>\u003cli>What's going on?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I need help.\u003c/li>\u003cli>I have a problem.\u003c/li>\u003cli>Nothing's wrong.\u003c/li>\u003cli>I'm just tired.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"먼저 문제나 걱정을 묻는 표현을 배워 볼게요. 친구가 걱정스러워 보이면 What's wrong?이라고 말해요. 이 말은 무슨 일이야, 왜 그래라는 뜻이에요. 상대방의 문제를 편하게 물어볼 때 아주 자주 쓰는 표현이죠.","hl":"key"},{"n":15,"text":"같은 뜻으로는 What's the matter?라고 할 수 있어요. 무엇이 문제야라는 뜻이에요. Is something wrong?은 뭔가 잘못된 거 있어라는 뜻으로 걱정을 묻는 표현이에요. What's going on?은 무슨 일이 벌어지고 있어라는 뜻으로 상황을 물을 때 써요.","hl":"alts"},{"n":16,"text":"이 질문에는 I need help라고 대답할 수 있어요. 도움이 필요해라는 뜻이죠. I have a problem은 문제가 있어라는 뜻이고, Nothing's wrong은 아무 문제 없어라는 뜻이에요. I'm just tired처럼 지금 상태를 말해도 좋아요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">제안·조언하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">Why don't you + 동사원형?\u003c/div>\u003cdiv class=\"d-mean\">~하는 게 어때?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: Why don't you buy these gloves? It's getting cold these days.\u003c/div>\u003cdiv class=\"d-exp\">상대에게 제안이나 조언을 부드럽게 할 때 쓰는 표현이에요. \u003cb class=\"key\">Why don't you\u003c/b> 다음에는 \u003cb class=\"key\">동사원형\u003c/b>이 오고, \u003cb class=\"key\">How about\u003c/b> 다음에는 명사나 명사구가 와요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How about + 명사(구)?\u003c/li>\u003cli>What about + 명사(구)?\u003c/li>\u003cli>You should + 동사원형.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>That's a good idea.\u003c/li>\u003cli>Sounds good.\u003c/li>\u003cli>I'll try that.\u003c/li>\u003cli>No, thanks.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이번에는 제안하고 조언하는 표현을 배워 볼게요. Why don't you buy these gloves?는 이 장갑을 사는 게 어때라고 제안하는 말이에요. Why don't you 뒤에는 동사원형이 와요. 그래서 buy가 그대로 쓰였죠.","hl":"key"},{"n":18,"text":"비슷한 제안 표현으로 How about this scarf?가 있어요. 이 스카프는 어때라는 뜻이죠. What about this scarf?도 같은 뜻으로 쓸 수 있어요. You should buy a blue scarf는 파란 스카프를 사는 게 좋겠어라는 뜻으로 좀 더 직접적인 조언이에요.","hl":"alts"},{"n":19,"text":"제안을 받아들일 때는 That's a good idea라고 말할 수 있어요. 좋은 생각이야라는 뜻이에요. Sounds good은 좋을 것 같아, I'll try that은 한번 해 볼게라는 뜻이에요. 거절할 때는 No, thanks라고 공손하게 말할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Junho\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Kate, Minji, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I need help.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">케이트, 민지, 나 도움이 필요해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">I need help.\u003c/b>는 '도움이 필요해'라는 뜻이에요. \u003cb class=\"key\">need\u003c/b>는 명사 help를 목적어로 받아 '~이 필요하다'를 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Can you help me?\u003c/span>\u003cspan>I could use some help.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">Kate\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">What's wrong\u003c/span>, Junho?\u003c/div>\u003cdiv class=\"d-ko\">준호야, 무슨 일이야?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>\u003cb class=\"key\">What's wrong?\u003c/b>은 '무슨 일이야?'라는 뜻으로, 상대방이 걱정스러워 보이거나 무슨 문제가 있는 것 같을 때 사용하는 표현이다.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>What's the matter?\u003c/span>\u003cspan>Is something wrong?\u003c/span>\u003cspan>What's going on?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 문장이에요. Kate Minji I need help. 케이트, 민지, 나 도움이 필요해라는 뜻이에요. I need help는 도움이 필요해라는 표현이고, need 뒤에 help가 와서 도움이라는 명사를 목적어로 받았어요. 같은 뜻으로 Can you help me?라고도 말할 수 있어요.","hl":"l-0"},{"n":21,"text":"이번 문장은 What's wrong Junho예요. 준호야, 무슨 일이야라는 뜻이에요. What's wrong?은 상대방이 걱정스러워 보이거나 무슨 문제가 있는 것 같을 때 사용하는 표현이에요. 같은 뜻으로 What's the matter?나 Is something wrong?이라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Junho\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I need to buy\u003c/span> a present for my mom. \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">This Sunday is her birthday.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">엄마 선물을 사야 해. 이번 일요일이 엄마 생신이거든.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>\u003cb class=\"key\">I need to + 동사원형\u003c/b>은 '나는 ~할 필요가 있다, ~해야 한다'라는 뜻이에요. 여기서는 to buy가 쓰여 '살 필요가 있어, 사야 해'라는 뜻을 나타내요. 더 강한 의무를 나타낼 때는 \u003cb class=\"key\">have to + 동사원형\u003c/b>이나 \u003cb class=\"key\">must\u003c/b>를 써요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>\u003cb class=\"key\">This Sunday\u003c/b>는 '이번 일요일'이라는 뜻이고, \u003cb class=\"key\">her birthday\u003c/b>는 '그녀의 생일'이라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I have to buy a present for my mom.\u003c/span>\u003cspan>I must buy a present for my mom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Minji\u003c/span>\u003cspan class=\"d-ln\">4\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">Do you have anything in mind?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">생각해 둔 거 있어?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">Do you have anything in mind?\u003c/b>는 '생각해 둔 게 있어?'라는 뜻으로, 상대방에게 구체적으로 어떤 생각을 묻는 표현이에요. 이때 \u003cb class=\"key\">have in mind\u003c/b>는 '~을 염두에 두다, 생각해 두다'라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Do you have any ideas?\u003c/span>\u003cspan>Have you thought of anything?\u003c/span>\u003cspan>Is there anything you're considering?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"이번 문장은 I need to buy a present for my mom이에요. 엄마 선물을 사야 한다는 뜻이에요. I need to 다음에 동사원형 buy가 와서 살 필요가 있다, 사야 한다는 뜻을 나타내요. 더 강한 의무를 말할 때는 I have to buy나 I must buy처럼 쓸 수 있어요. This Sunday is her birthday는 이번 일요일이 엄마 생신이라는 뜻이에요.","hl":"l-0"},{"n":23,"text":"이번 문장은 Do you have anything in mind?예요. 생각해 둔 게 있어라는 뜻이에요. 상대방에게 구체적으로 어떤 생각을 묻는 표현이고, have in mind는 염두에 두다, 생각해 두다는 뜻이에요. 같은 뜻으로 Do you have any ideas?나 Have you thought of anything?이라고도 할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 5–6 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Junho\u003c/span>\u003cspan class=\"d-ln\">5\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">I have no idea.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">전혀 모르겠어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">I have no idea.\u003c/b>는 '정말 모르겠다'라는 뜻으로, 상대방의 질문이나 상황에 대해 아무런 정보가 없을 때 사용하는 표현이에요. \u003cb class=\"key\">I don't know.\u003c/b>보다 더 강한 뉘앙스를 가져요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>I don't know.\u003c/span>\u003cspan>I have no clue.\u003c/span>\u003cspan>I'm not sure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">Kate\u003c/span>\u003cspan class=\"d-ln\">6\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan class=\"tgt\">Why don't you buy these gloves?\u003c/span> \u003cspan class=\"mk\">8\u003c/span>\u003cspan class=\"tgt\">It's getting cold\u003c/span> these days.\u003c/div>\u003cdiv class=\"d-ko\">이 장갑 사는 게 어때? 요즘 점점 추워지고 있잖아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">7\u003c/span>\u003cspan>\u003cb class=\"key\">Why don't you + 동사원형?\u003c/b>은 제안이나 조언을 부드럽게 할 때 사용하는 표현으로 '~하는 게 어때?'라는 뜻이고, 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 와요. 비슷한 제안 표현 \u003cb class=\"key\">How about ~?\u003c/b>은 뒤에 명사나 명사구가 온다는 점이 달라요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">8\u003c/span>\u003cspan>\u003cb class=\"key\">It's getting cold\u003c/b>는 '점점 추워지고 있다'는 뜻이에요. 이때 \u003cb class=\"key\">It\u003c/b>은 날씨를 나타내는 비인칭 주어이고, \u003cb class=\"key\">get + 형용사\u003c/b>는 '~하게 되다, ~해지다'라는 점진적인 변화를 나타내요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How about these gloves? It's getting cold these days.\u003c/span>\u003cspan>What about buying these gloves? It's getting cold these days.\u003c/span>\u003cspan>You should buy these gloves. It's getting cold these days.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":24,"text":"이번 문장은 I have no idea예요. 정말 모르겠다는 뜻이에요. 상대방의 질문이나 상황에 대해 아무런 정보가 없을 때 사용하는 표현이고, I don't know보다 더 강한 뉘앙스를 가져요. 비슷하게 I have no clue나 I'm not sure라고도 말할 수 있어요.","hl":"l-0"},{"n":25,"text":"이번 문장은 Why don't you buy these gloves?예요. 이 장갑을 사는 게 어때라는 뜻이에요. Why don't you 뒤에는 동사원형이 와서 buy가 쓰였어요. It's getting cold는 점점 추워지고 있다는 뜻이고, 여기서 It은 날씨를 나타내는 비인칭 주어예요. 같은 제안으로 How about these gloves?나 You should buy these gloves라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 7–8 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Junho\u003c/span>\u003cspan class=\"d-ln\">7\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Well, she has \u003cspan class=\"mk\">9\u003c/span>\u003cspan class=\"tgt\">a lot of gloves\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">음, 엄마는 장갑이 많아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">9\u003c/span>\u003cspan>\u003cb class=\"key\">a lot of\u003c/b>는 '많은'이라는 뜻으로 셀 수 있는 복수 명사 앞에 쓰여요. 여기서는 \u003cb class=\"key\">gloves\u003c/b>가 복수라서 a lot of gloves라고 했어요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Minji\u003c/span>\u003cspan class=\"d-ln\">8\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Then \u003cspan class=\"mk\">10\u003c/span>\u003cspan class=\"tgt\">how about this scarf?\u003c/span> It's very pretty.\u003c/div>\u003cdiv class=\"d-ko\">그럼 이 스카프는 어때? 정말 예쁘잖아.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">10\u003c/span>\u003cspan>\u003cb class=\"key\">How about + 명사(구)?\u003c/b>는 '~은 어때?'라고 제안할 때 쓰는 표현이에요. \u003cb class=\"key\">Why don't you + 동사원형?\u003c/b>과 비슷한 제안 표현이지만, How about 뒤에는 명사나 명사구가 와요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Then why don't you buy this scarf?\u003c/span>\u003cspan>Then what about this scarf?\u003c/span>\u003cspan>Then you should get this scarf.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"이번 문장은 Well she has a lot of gloves예요. 음, 엄마는 장갑이 많다는 뜻이에요. a lot of는 많은이라는 뜻으로 복수 명사 gloves 앞에 쓰였어요. 그래서 장갑이 많다는 의미를 자연스럽게 나타내죠.","hl":"l-0"},{"n":27,"text":"이번 문장은 Then how about this scarf?예요. 그럼 이 스카프는 어때라는 뜻이에요. How about 뒤에는 명사나 명사구가 와서 this scarf가 쓰였어요. 비슷한 제안으로 Then why don't you buy this scarf?나 Then what about this scarf?라고도 말할 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 9–10 / 12\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">Junho\u003c/span>\u003cspan class=\"d-ln\">9\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan class=\"tgt\">That's a good idea.\u003c/span> Hmm.... \u003cspan class=\"mk\">12\u003c/span>\u003cspan class=\"tgt\">There are so many colors.\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">좋은 생각이야. 음... 색이 정말 많네.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">11\u003c/span>\u003cspan>\u003cb class=\"key\">That's a good idea.\u003c/b>는 '좋은 생각이야'라는 뜻으로, 상대의 제안을 받아들일 때 쓰는 표현이에요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">12\u003c/span>\u003cspan>\u003cb class=\"key\">There + be동사 ~\u003c/b>는 '~(들)이 있(었)다'라는 뜻으로, be동사 뒤에 주어 역할을 하는 명사구가 와요. 여기서는 복수 명사구 \u003cb class=\"key\">so many colors\u003c/b>가 와서 be동사 are가 쓰였어요. 주어가 단수일 때는 is나 was, 복수일 때는 are나 were를 써요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>Sounds good.\u003c/span>\u003cspan>I like that idea.\u003c/span>\u003cspan>That works for me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">Kate\u003c/span>\u003cspan class=\"d-ln\">10\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">13\u003c/span>\u003cspan class=\"tgt\">What color does she like?\u003c/span>\u003c/div>\u003cdiv class=\"d-ko\">그분은 어떤 tton>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>(B)-(A)-(C)-(D)\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(C)-(B)-(A)-(D)\u003c/span>\u003cdiv class=\"g-exp\">준호가 선물을 사야 한다고 말하고, 민지가 생각해 둔 것이 있는지 묻고, 준호가 모르겠다고 답한 뒤 케이트가 장갑을 사라고 제안하는 순서가 자연스러워요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"대화가 자연스럽게 이어지도록 순서를 골라 보세요. 준호가 선물을 사야 한다고 말하는 문장, 민지가 생각해 둔 것이 있는지 묻는 문장, 준호가 모르겠다고 답하는 문장, 케이트가 장갑을 사라고 제안하는 문장을 생각해 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":6},{"n":43,"text":"정답은 첫 번째 보기예요. 준호가 선물을 사야 한다고 말하고, 민지가 생각해 둔 것이 있는지 묻고, 준호가 모르겠다고 답한 뒤 케이트가 장갑을 사는 게 어때라고 제안하는 순서가 자연스러워요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 5\u003c/span>\u003cspan class=\"g-kind\">내용 일치\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">대화 내용과 일치하는 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>준호는 엄마 생신 선물을 사려고 한다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>케이트는 스카프를 추천했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>준호의 엄마는 장갑이 하나도 없다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>준호는 빨간 스카프를 사기로 했다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">준호는 엄마 생신 선물을 사려고 한다.\u003c/span>\u003cdiv class=\"g-exp\">준호는 이번 일요일이 엄마 생신이라 선물을 사려고 해요. 장갑은 많다고 했고, 민지가 스카프를 추천했으며, 준호는 파란 스카프를 사기로 했어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":44,"text":"대화 내용과 일치하는 것을 골라 보세요. 준호가 엄마 생신 선물을 사려는지, 누가 스카프를 추천했는지, 어떤 색 스카프를 사기로 했는지 생각해 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":45,"text":"","hl":"q","pause":6},{"n":46,"text":"정답은 첫 번째 보기예요. 준호는 엄마 생신 선물을 사려고 해요. 장갑은 많다고 했고, 민지가 스카프를 추천했으며, 준호는 파란 스카프를 사기로 했어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">문제 묻고 제안·조언하기\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">What's wrong?\u003c/b>은 '무슨 일이야?'라고 문제를 물을 때 써요.\u003c/li>\u003cli>\u003cb class=\"key\">I need to + 동사원형\u003c/b>은 '~해야 한다'는 뜻이에요.\u003c/li>\u003cli>\u003cb class=\"key\">Why don't you + 동사원형?\u003c/b>과 \u003cb class=\"key\">How about + 명사(구)?\u003c/b>는 제안할 때 써요.\u003c/li>\u003cli>\u003cb class=\"key\">There are + 복수명사\u003c/b>는 '~들이 있다'는 뜻이고, \u003cb class=\"key\">I hope (that) ~\u003c/b>은 '~이기를 바란다'는 뜻이에요.\u003c/li>\u003c/ul>","segs":[{"n":47,"text":"오늘은 준호가 엄마 생신 선물을 고르는 대화를 공부했어요. 문제를 물을 때는 What's wrong?이라고 하고, 제안할 때는 Why don't you buy these gloves?처럼 말해요. How about this scarf?도 같은 제안 표현이에요. I hope she likes it처럼 바라는 마음도 표현할 수 있답니다. 오늘 배운 표현을 꼭 복습해 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
