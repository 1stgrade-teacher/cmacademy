  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};

lecturePlayer(document.getElementById("app"),{"brand":"문법1","title":"중3 시사(박) 8과 문법1 분사구문","audioDir":"중3_ybm(박)_8과_문법1_분사구문_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사구문\u003c/div>\u003ch1>중3 YBM(박) 8과 분사구문 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>분사구문의 개념과 형태를 이해하고, 시간·동시동작·이유의 의미로 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 삼학년 YBM 박 교과서의 분사구문을 함께 공부해 볼 거예요. 분사구문은 처음에는 조금 낯설 수 있지만, 접속사와 주어를 생략하고 동사를 현재분사로 바꾼다는 규칙만 잡으면 생각보다 쉬워요. 오늘은 예문을 통해 형태를 익히고, 시간과 동시동작, 이유를 나타내는 해석까지 차근차근 연습해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">분사구문의 개념과 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문은 「접속사＋주어＋동사 ~, 주어＋동사 …」 문장에서 \u003cb class=\"key\">접속사\u003c/b>와 \u003cb class=\"key\">주어\u003c/b>를 생략하고 동사를 \u003cb class=\"key\">현재분사\u003c/b> 형태로 바꾼 구문이에요. 현재분사는 동사원형에 -ing를 붙인 형태예요. 이렇게 하면 문장이 더 간결해져요.\u003cdiv>\u003cspan class=\"g-formula\">접속사 + 주어 + 동사 ~, 주어 + 동사 … → (접속사·주어 생략) + 동사-ing ~, 주어 + 동사 …\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Seeing the police officer\u003c/span>, he ran away.\u003c/div>\u003cdiv class=\"g-ko\">그는 경찰을 봤기 때문에 도망갔다.\u003c/div>\u003cdiv class=\"g-note\">접속사와 주어를 생략하고 동사를 현재분사 Seeing으로 바꾼 분사구문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Kevin is eating pizza, \u003cspan class=\"fx\">listening to music\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">Kevin은 노래를 들으면서 피자를 먹었다.\u003c/div>\u003cdiv class=\"g-note\">주절의 동작과 함께 일어나는 동작을 현재분사 listening으로 표현했어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>분사구문을 만들 때는 \u003cb class=\"key\">접속사\u003c/b>와 \u003cb class=\"key\">주어\u003c/b>를 먼저 확인하고, 동사를 \u003cb class=\"key\">현재분사\u003c/b>로 바꾸는 순서를 기억하세요.\u003c/div>","segs":[{"n":2,"text":"분사구문은 두 문장을 이어 주는 접속사절에서 접속사와 주어를 생략하고, 동사를 현재분사인 동사원형에 ing를 붙인 형태로 바꾼 거예요. 예를 들어 접속사가 있고 주어가 같은 문장에서는 반복되는 주어를 지우고 동사를 ing 형태로 만들어요. 그러면 문장이 훨씬 간결해지고 자연스러워져요. 오늘은 이 기본 형태부터 확실히 잡아 볼게요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 Seeing the police officer, he ran away예요. 뜻은 그는 경찰을 봤기 때문에 도망갔다예요. 여기서 Seeing은 동사 see가 현재분사로 바뀐 형태이고, 접속사와 주어가 생략되어 있어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 Kevin is eating pizza, listening to music이에요. 뜻은 Kevin은 노래를 들으면서 피자를 먹었다예요. listening to music이 현재분사로 쓰여서 피자를 먹는 동작과 함께 일어나는 행동을 나타내요.","hl":"ex-1"},{"n":5,"text":"분사구문을 만들 때는 먼저 접속사와 주어를 찾고, 그다음 동사를 현재분사로 바꿔야 해요. 이 순서를 기억하면 실수를 줄일 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">시간을 나타내는 분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문이 \u003cb class=\"key\">시간\u003c/b>을 나타낼 때는 ‘~할 때’로 해석해요. 이때 접속사 when이나 while이 생략된 것으로 볼 수 있어요. \u003cb class=\"key\">현재분사\u003c/b>로 시작하는 부분이 시간의 의미를 담아요.\u003cdiv>\u003cspan class=\"g-formula\">분사구문(~할 때), 주어 + 동사 = When/While + 주어 + 동사, 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Going to Seoul\u003c/span>, he visited his grandparents.\u003c/div>\u003cdiv class=\"g-ko\">그는 서울에 갔을 때 그의 조부모님을 방문했다.\u003c/div>\u003cdiv class=\"g-note\">Going to Seoul을 ‘서울에 갔을 때’로 해석하는 시간의 분사구문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Entering my room\u003c/span>, I saw my dog eating my lunch.\u003c/div>\u003cdiv class=\"g-ko\">내 방으로 들어갈 때 나는 내 강아지가 내 점심을 먹고 있는 것을 봤다.\u003c/div>\u003cdiv class=\"g-note\">Entering my room이 ‘내 방으로 들어갈 때’라는 시간의 의미를 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시간의 분사구문은 \u003cb class=\"key\">when\u003c/b>이나 \u003cb class=\"key\">while\u003c/b>을 넣어 원래 문장으로 바꿔 보면 뜻이 잘 드러나요.\u003c/div>","segs":[{"n":6,"text":"분사구문은 문맥에 따라 시간을 나타낼 수 있어요. 이때는 할 때라는 뜻으로 해석하면 자연스러워요. 접속사 when이나 while이 생략되었다고 생각하면 이해하기 쉬워요. 예문을 보면서 시간의 의미를 찾아볼게요.","hl":"rule"},{"n":7,"text":"첫 번째 예문은 Going to Seoul, he visited his grandparents예요. 뜻은 그는 서울에 갔을 때 그의 조부모님을 방문했다예요. Going to Seoul이 서울에 갔을 때라는 시간의 의미를 나타내요.","hl":"ex-0"},{"n":8,"text":"두 번째 예문은 Entering my room, I saw my dog eating my lunch예요. 뜻은 내 방으로 들어갈 때 나는 내 강아지가 내 점심을 먹고 있는 것을 봤다예요. Entering my room이 내 방으로 들어갈 때라는 시간의 의미를 담고 있어요.","hl":"ex-1"},{"n":9,"text":"시간의 분사구문은 when이나 while을 넣어 원래 문장으로 바꿔 보면 뜻이 잘 드러나요. 해석이 헷갈릴 때 꼭 활용해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">동시동작을 나타내는 분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문이 \u003cb class=\"key\">동시동작\u003c/b>을 나타낼 때는 ‘~하면서’로 해석해요. 주절의 동작과 분사구문의 동작이 거의 같은 때에 일어나요. 이때는 \u003cb class=\"key\">while\u003c/b>의 의미가 담겨 있다고 볼 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사, -ing ~ = 주어 + 동사 while + 주어 + be동사 + -ing ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He read a book, \u003cspan class=\"fx\">drinking coffee\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 커피를 마시면서 책을 읽었다.\u003c/div>\u003cdiv class=\"g-note\">책을 읽는 동작과 커피를 마시는 동작이 동시에 일어나 ‘~하면서’로 해석해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Smiling brightly\u003c/span>, she waved me.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 환하게 웃으며 나에게 손을 흔들었다.\u003c/div>\u003cdiv class=\"g-note\">Smiling brightly가 ‘환하게 웃으면서’라는 동시동작을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동시동작은 두 동작이 \u003cb class=\"key\">동시\u003c/b>에 일어나는지 확인하고, 해석할 때 ‘~하면서’를 넣어 보세요.\u003c/div>","segs":[{"n":10,"text":"분사구문은 두 동작이 동시에 일어날 때도 사용해요. 이때는 하면서라는 뜻으로 해석하면 자연스러워요. 주절의 동작과 분사구문의 동작이 함께 일어난다고 생각하면 이해하기 쉬워요. 예문을 통해 동시동작의 느낌을 익혀 볼게요.","hl":"rule"},{"n":11,"text":"첫 번째 예문은 He read a book, drinking coffee예요. 뜻은 그는 커피를 마시면서 책을 읽었다예요. drinking coffee가 커피를 마시면서라는 동시동작을 나타내요.","hl":"ex-0"},{"n":12,"text":"두 번째 예문은 Smiling brightly, she waved me예요. 뜻은 그녀는 환하게 웃으며 나에게 손을 흔들었다예요. Smiling brightly가 환하게 웃으면서라는 동시동작을 나타내요.","hl":"ex-1"},{"n":13,"text":"동시동작은 두 동작이 동시에 일어나는지 확인하는 것이 중요해요. 해석할 때는 하면서라는 말을 넣어 보면 자연스러운지 바로 알 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">이유나 원인을 나타내는 분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문이 \u003cb class=\"key\">이유\u003c/b>나 \u003cb class=\"key\">원인\u003c/b>을 나타낼 때는 ‘~하기 때문에’로 해석해요. 이때는 because나 since의 의미가 담겨 있어요. 분사구문의 내용이 주절의 행동에 대한 이유가 돼요.\u003cdiv>\u003cspan class=\"g-formula\">Feeling + 형용사, 주어 + 동사 = Since + 주어 + felt + 형용사, 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Feeling tired\u003c/span>, he didn’t want to go out.\u003c/div>\u003cdiv class=\"g-ko\">그는 피곤했기 때문에 밖으로 나가고 싶지 않았다.\u003c/div>\u003cdiv class=\"g-note\">Feeling tired가 ‘피곤했기 때문에’라는 이유를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Having no money\u003c/span>, I couldn’t buy the bike.\u003c/div>\u003cdiv class=\"g-ko\">나는 돈이 없었기 때문에 자전거를 살 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">Having no money가 ‘돈이 없었기 때문에’라는 원인을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>이유의 분사구문은 \u003cb class=\"key\">because\u003c/b>나 \u003cb class=\"key\">since\u003c/b>를 넣어 원래 문장으로 바꿔 보면 이해가 쉬워요.\u003c/div>","segs":[{"n":14,"text":"분사구문은 이유나 원인을 나타낼 때도 사용해요. 이때는 하기 때문에라는 뜻으로 해석하면 자연스러워요. 분사구문의 내용이 뒤에 나오는 주절의 행동에 대한 이유가 되는 거죠. 예문을 보면서 이유의 의미를 확인해 볼게요.","hl":"rule"},{"n":15,"text":"첫 번째 예문은 Feeling tired, he didn’t want to go out이에요. 뜻은 그는 피곤했기 때문에 밖으로 나가고 싶지 않았다예요. Feeling tired가 피곤했기 때문에라는 이유를 나타내요.","hl":"ex-0"},{"n":16,"text":"두 번째 예문은 Having no money, I couldn’t buy the bike예요. 뜻은 나는 돈이 없었기 때문에 자전거를 살 수 없었다예요. Having no money가 돈이 없었기 때문에라는 원인을 나타내요.","hl":"ex-1"},{"n":17,"text":"이유의 분사구문은 because나 since를 넣어 원래 문장으로 바꿔 보면 이해가 쉬워요. 해석이 애매할 때는 접속사를 넣어 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>See the police officer, he ran away.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Seeing the police officer, he ran away.\u003c/div>\u003cdiv class=\"g-why\">분사구문에서는 동사를 현재분사 형태로 바꿔야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He read a book, drink coffee.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He read a book, drinking coffee.\u003c/div>\u003cdiv class=\"g-why\">동시동작을 나타내는 분사구문은 현재분사 drinking을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Feeling tired, he didn’t wanted to go out.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Feeling tired, he didn’t want to go out.\u003c/div>\u003cdiv class=\"g-why\">조동사 didn’t 뒤에는 동사원형 want가 와야 해요.\u003c/div>\u003c/div>","segs":[{"n":18,"text":"분사구문에서 동사를 그대로 쓰면 틀려요. see를 현재분사인 Seeing으로 바꿔야 하고, 그래서 Seeing the police officer, he ran away가 맞아요.","hl":"mk-0"},{"n":19,"text":"동시동작을 나타낼 때는 동사를 현재분사로 바꿔야 해요. drink가 아니라 drinking을 써서 He read a book, drinking coffee라고 해야 맞아요.","hl":"mk-1"},{"n":20,"text":"didn’t는 조동사이기 때문에 뒤에 동사원형이 와야 해요. 그래서 wanted가 아니라 want를 써서 Feeling tired, he didn’t want to go out이라고 해야 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 빈칸에 들어갈 어법상 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">____ bread, I sang a song.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Bake\u003c/button>\u003
