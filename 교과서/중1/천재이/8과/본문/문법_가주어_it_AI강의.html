  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}

lecturePlayer(document.getElementById("app"),{"brand":"중2 비상(황) 7과 문법2","title":"가주어 it 완벽 정리","audioDir":"문법_가주어_it_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가주어 it\u003c/div>\u003ch1>가주어 it 완벽 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>to부정사가 주어일 때 가주어 it을 쓰는 문장을 만들고, 의미상 주어 for와 of를 구별할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 가주어 it이라는 아주 재미있는 문법을 배워 볼 거예요. 문장 주어가 to부정사로 길어질 때 영어는 어떻게 하는지, 그리고 그 to부정사 앞에 누가 하는지를 붙이는 방법까지 함께 알아볼게요. 오늘 설명만 잘 따라오면 시험에 나오는 문제는 거의 다 풀 수 있어요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">가주어 it의 형태와 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「to + 동사원형」 형태의 \u003cb class=\"key\">to부정사\u003c/b>가 ‘~하는 것은’의 의미로 문장에서 \u003cb class=\"key\">주어\u003c/b> 역할을 할 때, 보통 주어 자리에 \u003cb class=\"key\">가주어 it\u003c/b>을 쓰고 진주어인 to부정사(구)는 문장 뒤로 보내요. 이때 가주어 it은 해석하지 않아요.\u003cdiv>\u003cspan class=\"g-formula\">It + be동사 + 형용사 + to부정사 ... (진주어 to부정사는 문장 뒤로)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To study hard\u003c/span> is important.\u003c/div>\u003cdiv class=\"g-ko\">열심히 공부하는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">to부정사가 주어 자리에 그대로 있는 원래 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It is important to study hard\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">열심히 공부하는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">가주어 it을 세우고 진주어 to study hard를 뒤로 보낸 문장이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가주어 it은 ‘그것’이라고 해석하지 않아요. \u003cb class=\"key\">해석하지 않는다\u003c/b>는 점을 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"자, 먼저 문장에서 주어가 아주 길어질 때를 생각해 볼까요? To study hard is important처럼 to부정사가 주어 자리에 오면 문장이 무겁고 어색하게 느껴져요. 그래서 영어는 주어 자리에 가주어 it만 세워 두고, 진짜 주어인 to부정사는 문장 뒤로 보내 버려요. 그래서 It is important to study hard가 되는 거예요. 이때 it은 그것이라고 해석하지 않는다는 점, 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. To study hard is important. 뜻은 열심히 공부하는 것은 중요하다예요. 여기서 To study hard가 문장의 주어 자리에 길게 자리를 차지하고 있죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. It is important to study hard. 뜻은 아까와 똑같이 열심히 공부하는 것은 중요하다예요. 주어 자리에 it이 들어가고 진짜 주어인 to study hard가 뒤로 갔어요. 이때 앞의 it은 그것이라고 해석하지 않는다는 것, 잊지 마세요.","hl":"ex-1"},{"n":5,"text":"한 가지만 더 강조할게요. 가주어 it은 뜻이 있는 단어가 아니라 주어 자리를 채워 주는 자리 표시자예요. 그러니까 해석할 때는 it을 그냥 없는 셈 치고 뒤에 있는 to부정사부터 해석하면 된답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">to부정사의 의미상 주어: for와 of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사의 의미상 주어를 나타낼 경우 to부정사(구) 앞에 「for + 목적격」의 형태로 써요. 단, 사람의 \u003cb class=\"key\">성격\u003c/b>이나 \u003cb class=\"key\">태도\u003c/b>를 나타내는 형용사(kind, nice, smart 등)가 앞에 올 경우에는 의미상 주어를 「of + 목적격」의 형태로 써요.\u003cdiv>\u003cspan class=\"g-formula\">It is + 형용사 + for/of + 목적격 + to부정사 ...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is important \u003cspan class=\"fx\">for you to get enough sleep\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너가 충분한 잠을 자는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">의미상 주어 you를 for와 함께 to부정사 앞에 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It is difficult \u003cspan class=\"fx\">for children to sit still\u003c/span> for a long time.\u003c/div>\u003cdiv class=\"g-ko\">아이들이 오랫동안 가만히 앉아 있는 것은 어렵다.\u003c/div>\u003cdiv class=\"g-note\">의미상 주어가 children이고, 그 일을 하는 주체를 for로 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">It was \u003cspan class=\"fx\">kind of you to help me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너가 나를 도와주다니 친절하구나.\u003c/div>\u003cdiv class=\"g-note\">사람의 성격을 나타내는 kind 뒤에는 for가 아니라
