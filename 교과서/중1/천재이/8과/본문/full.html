기대(excited)</li><li>가시(spines)를 보고 신기해하는 친구들</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실수와 고립</div><ul><li>해리는 의도치 않게 친구들에게 피해를 주게 되며 점차 혼자가 된다.</li><li>축구공을 터뜨려 친구들이 놀이를 중단함(soccer ball)</li><li>가시 때문에 토끼 루비(rabbit)를 다치게 함</li><li>자신의 가시 때문에 아무도 좋아하지 않을 거라 생각함(lonely)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03오해와 외로움</div><ul><li>친구들의 이해할 수 없는 행동 때문에 해리는 생일날 더욱 소외감을 느낀다.</li><li>생일날 교실에서 자신만 빼고 나가는 친구들</li><li>친구들의 행동에 큰 슬픔과 외로움을 느낌(sad)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04친구들의 따뜻한 배려</div><ul><li>친구들은 해리의 가시를 배려한 특별한 생일 선물을 준비했다.</li><li>친구들이 마련한 깜짝 생일 파티(Happy birthday)</li><li>가시로부터 친구들을 보호할 스펀지 재킷(sponge jackets) 준비</li><li>친구들의 배려에 놀라고 기뻐하는 해리</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05우정과 행복</div><ul><li>친구들의 진심 어린 마음을 확인한 해리는 외로움을 극복하게 된다.</li><li>해리를 위한 맞춤형 재킷(jacket) 선물</li><li>친구들과의 포옹(hug)을 통해 관계 회복</li><li>더 이상 외롭지 않고 행복해진 해리(happy smile)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hedgehog</td><td class=\"m\">고슴도치</td></tr><tr><td class=\"w\">excited</td><td class=\"m\">신이 난, 들뜬</td></tr><tr><td class=\"w\">enter</td><td class=\"m\">들어가다</td></tr><tr><td class=\"w\">spine</td><td class=\"m\">가시</td></tr><tr><td class=\"w\">curiously</td><td class=\"m\">호기심 있게, 궁금한 듯이</td></tr><tr><td class=\"w\">lunchtime</td><td class=\"m\">점심시간</td></tr><tr><td class=\"w\">join</td><td class=\"m\">함께하다, 참여하다</td></tr><tr><td class=\"w\">kick</td><td class=\"m\">발로 차다</td></tr><tr><td class=\"w\">flat</td><td class=\"m\">바람이 빠진</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">anymore</td><td class=\"m\">더 이상 (~않다)</td></tr><tr><td class=\"w\">playground</td><td class=\"m\">운동장, 놀이터</td></tr><tr><td class=\"w\">alone</td><td clas
