<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 8과 본문2","audioDir":"2_audio","preview":false,"count":61,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Alone Again: Harry the Hedgehog\u003c/h1>\u003ch2>또 혼자가 된 고슴도치 Harry\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>가시 때문에 친구에게 다가가도 곧 \u003cb class=\"key\">혼자\u003c/b>가 되는 고슴도치 Harry가, 생일 날에도 반 친구들에게 남겨져 교실에서 \u003cb class=\"key\">외로움\u003c/b>을 느낀다는 이야기\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Harry the hedgehog keeps ending up alone because his spines hurt others, and that makes him feel sad and lonely.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 고슴도치 Harry와 토끼 Ruby가 나오는 본문을 함께 읽어 볼 거예요. 이 글은 학교 버스와 교실, 두 장면에서 Harry가 겪는 일을 시간 순서대로 보여 주는 이야기예요. 요약하면 가시 때문에 친구에게 다가가도 결국 혼자가 되는 Harry가 생일 날에도 남겨져 외로움을 느낀다는 내용이고, 요지는 그가 가시 때문에 늘 혼자가 되어 슬프고 외롭다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고슴도치는 영어로 hedgehog라고 부르며, 등과 옆구리에 빽빽한 \u003cb class=\"key\">가시\u003c/b>(spines, quills)를 가지고 있어요. 이 가시는 포식자(predator)로부터 몸을 지키는 \u003cb class=\"key\">방어 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이지만, 동시에 다른 동물과 몸을 맞대는 접촉을 어렵게 만들죠. 실제로 고슴도치는 가시 때문에 서로 부딪히지 않으려고 일정한 거리를 두는데, 이는 사람 사이의 관계에서도 나타나는 심리적 거리감과 닮아 있어요. 예를 들어 가시가 돋친 장미가 아름답지만 손으로 만지면 아픈 것처럼, Harry도 다가가고 싶은 마음과 상대를 아프게 하는 몸을 동시에 가진 존재예요. 이 지문은 이런 신체적 특징이 또래 관계에서 \u003cb class=\"key\">소외\u003c/b>(social exclusion)로 이어질 때 생기는 정서적 고통을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 고슴도치는 영어로 hedgehog라고 하고, 등과 옆구리에 빽빽한 가시를 가지고 있어요. 이 가시를 영어로는 spines 또는 quills라고 부르는데, 포식자로부터 몸을 지키는 방어 수단이죠. 그런데 이 가시는 다른 동물과 몸을 맞대는 접촉을 어렵게 만들기도 해요. 가시가 돋친 장미가 아름답지만 손으로 만지면 아픈 것처럼, Harry도 다가가고 싶은 마음과 상대를 아프게 하는 몸을 동시에 가진 존재예요. 사람 사이에서도 몸이나 성격 때문에 친구에게 다가가지 못하고 소외되는 경우가 있는데, 이 지문은 그런 정서적 고통을 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>버스에서의 만남\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>학교 버스에서 Harry는 친절한 토끼 \u003cb class=\"key\">Ruby\u003c/b>를 발견하고, Ruby가 먼저 손을 흔들며 인사를 합니다. Harry는 그런 Ruby 옆에 앉기 위해 자리를 옮깁니다. 두 친구가 가까워질 것 같은 \u003cb class=\"key\">기대\u003c/b>가 담긴 장면이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가시가 만든 거리\u003csmall>문제 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>Harry가 옆에 앉자마자 'Ouch!'라는 소리와 함께 Harry의 \u003cb class=\"key\">가시\u003c/b>가 Ruby를 아프게 합니다. Harry는 미안하다고 말하고 뒷자리로 가고, 그는 다시 \u003cb class=\"key\">혼자\u003c/b>가 됩니다. 다가가려는 시도가 몸의 특징 때문에 곧바로 좌절되는 \u003cb class=\"key\">문제\u003c/b> 상황이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>혼자인 이유 자각\u003csmall>자각 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>뒷자리에 앉은 Harry는 '이 가시 때문에 아무도 나를 좋아하지 않아'라고 생각합니다. 자신이 소외된 원인을 \u003cb class=\"key\">가시\u003c/b>로 돌리며 그는 정말 \u003cb class=\"key\">슬픔\u003c/b>을 느낍니다. 감정의 이유가 분명히 드러나는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>생일 날 교실\u003csmall>반복 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>몇 주 뒤, Harry는 교실 뒤쪽 자리에 앉아 있고 그날은 그의 \u003cb class=\"key\">생일\u003c/b>입니다. 반 친구들은 무언가를 이야기하다가 Harry 없이 교실을 \u003cb class=\"key\">떠나\u003c/b> 버립니다. 장소만 버스에서 교실로 바뀌었을 뿐 같은 \u003cb class=\"key\">소외\u003c/b>가 반복되는 장면이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>남겨진 외로움\u003csmall>결론 · 문장 16\u003c/small>\u003c/h4>\u003cp>남겨진 Harry는 너무 \u003cb class=\"key\">외로움\u003c/b>을 느낍니다. 두 번의 장면을 통해 Harry의 외로움이 강조되며 글이 끝이 나요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 사건이 일어난 순서를 따라 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 학교 버스에서의 만남이에요. Harry는 친절한 토끼 Ruby를 발견하고, Ruby가 먼저 손을 흔들며 인사하죠. Harry는 그런 Ruby 옆에 앉기 위해 자리를 옮깁니다. 두 친구가 가까워질 것 같은 기대가 담긴 장면이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 문제가 생겨요. Harry가 옆에 앉자마자 Ruby가 아프다고 소리치고, Harry의 가시가 Ruby를 아프게 했다는 걸 알게 되죠. Harry는 미안하다고 말하고 뒷자리로 가고, 다시 혼자가 됩니다. 다가가려는 시도가 가시 때문에 곧바로 좌절되는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 Harry의 자각이에요. 뒷자리에 앉은 Harry는 이 가시 때문에 아무도 자기를 좋아하지 않는다고 생각합니다. 그리고 정말 슬프다고 느끼죠. 소외의 원인과 감정이 함께 드러나는 대목이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 장소가 교실로 바뀌어요. 몇 주 뒤, Harry는 교실 뒤쪽 자리에 앉아 있고 그날은 그의 생일이에요. 반 친구들은 무언가를 이야기하다가 Harry 없이 교실을 떠나 버립니다. 버스에서 겪은 소외가 교실에서 똑같이 반복되는 장면이에요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결말이에요. 남겨진 Harry는 너무 외롭다고 느낍니다. 두 장면을 통해 Harry의 외로움이 한층 더 강조되면서 글이 끝나요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>를 따라 버스 장면과 교실 장면을 차례로 보여 줍니다. 두 장면 모두 Harry가 친구에게 다가가려다 \u003cb class=\"key\">혼자\u003c/b> 남는 결말로 끝나서 같은 상황이 \u003cb class=\"key\">반복\u003c/b>되는 구조를 만듭니다. 주제를 처음에 밝히지 않고 마지막 문장에서 Harry의 \u003cb class=\"key\">외로움\u003c/b>으로 정리하기 때문에 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>A few weeks later (12)\u003c/b>\u003cspan>시간 경과 표시\u003c/span>\u003cb>Then (15)\u003c/b>\u003cspan>다음 사건 전환\u003c/span>\u003cb>because of (10)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>again (9)\u003c/b>\u003cspan>반복 강조\u003c/span>\u003cb>without (15)\u003c/b>\u003cspan>소외 표현\u003c/span>\u003cb>so (16)\u003c/b>\u003cspan>정도 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">hurt Ruby\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">went to the back seat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">was alone again\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Nobody likes me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">left the classroom without Harry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">felt so lonely\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Harry가 바라는 것\u003c/th>\u003cth>실제로 벌어진 일\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ruby 옆에 앉고 싶음\u003c/td>\u003ctd>가시 때문에 뒷자리로 감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생일에 친구들과 어울리고 싶음\u003c/td>\u003ctd>친구들이 말없이 교실을 떠남\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간 순서예요. 사건이 일어난 순서대로 버스 장면과 교실 장면이 차례로 이어지죠. 두 장면 모두 Harry가 친구에게 다가가려다 혼자 남는 결말로 끝나서 같은 상황이 반복되는 구조를 만들어요. 또 주제를 처음에 밝히지 않고 마지막 문장에서 Harry의 외로움으로 정리하기 때문에 미괄식으로 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"신호어를 먼저 보면, 몇 주 뒤라는 표현이 시간이 지났음을 알려 주고, then은 다음 사건으로 넘어가는 신호예요. because of는 Harry가 혼자인 이유를 제시하는 원인 표현이고, again과 so는 반복과 정도를 강조하죠. 재진술도 중요한데, Ruby를 아프게 했다는 말과 뒷자리로 갔다는 말, 다시 혼자가 되었다는 말이 모두 같은 상황을 다르게 표현한 거예요. 그리고 친구들이 Harry 없이 교실을 떠났다는 말은 그가 소외되었다는 뜻을 보여 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>school bus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통학 버스, 학교 버스\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친절한, 다정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>wave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>손을 흔들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>next to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~옆에\u003c/span>\u003c/div>\u003cdiv>\u003cb>spine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가시, 등뼈\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>아프게 하다, 다치게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sorry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>back seat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뒷자리\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혼자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>nobody\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아무도 ~않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>동사\u003c/em>\u003cspan>좋아하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>really\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>sad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>슬픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>a few weeks later\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몇 주 뒤에\u003c/span>\u003c/div>\u003cdiv>\u003cb>classroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교실\u003c/span>\u003c/div>\u003cdiv>\u003cb>birthday\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생일\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>something\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무언가\u003c/span>\u003c/div>\u003cdiv>\u003cb>then\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러더니, 그때\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>lonely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외로운\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어부터 볼게요. friendly는 친절한, spine은 가시, hurt는 아프게 하다, alone은 혼자인이라는 뜻이에요. because of는 때문에, a few weeks later는 몇 주 뒤에, without은 없이라는 뜻이고요. lonely는 외로운, classmate는 반 친구라는 뜻이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">friendly\u003c/b>\u003cspan class=\"m\">친절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">kind\u003c/span>\u003cspan class=\"s\">warm\u003c/span>\u003cspan class=\"s\">amiable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfriendly\u003c/span>\u003cspan class=\"a\">hostile\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurt\u003c/b>\u003cspan class=\"m\">아프게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">injure\u003c/span>\u003cspan class=\"s\">wound\u003c/span>\u003cspan class=\"s\">pain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">heal\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alone\u003c/b>\u003cspan class=\"m\">혼자인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lonely\u003c/span>\u003cspan class=\"s\">solitary\u003c/span>\u003cspan class=\"s\">by oneself\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">together\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sad\u003c/b>\u003cspan class=\"m\">슬픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unhappy\u003c/span>\u003cspan class=\"s\">sorrowful\u003c/span>\u003cspan class=\"s\">gloomy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003cspan class=\"a\">cheerful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">떠나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depart\u003c/span>\u003cspan class=\"s\">exit\u003c/span>\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">arrive\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lonely\u003c/b>\u003cspan class=\"m\">외로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">solitary\u003c/span>\u003cspan class=\"s\">friendless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003cspan class=\"a\">connected\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. friendly는 kind, warm과 비슷하고 unfriendly와는 반대예요. find는 discover, spot과 가깝고 lose와 반대죠. hurt는 injure, wound와 비슷하고 heal과 반대이고요. sad는 unhappy, gloomy와 가깝고 happy와 반대이며, leave는 depart, exit와 비슷하고 arrive와 반대예요. 마지막으로 lonely는 isolated, solitary와 가깝고 accompanied와 반대라는 것까지 챙겨 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교 버스에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">bus\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는 Ruby를 발견했습니다,\u003c/span>\u003cspan class=\"en\">Harry found \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Ruby, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친절한 토끼를요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">friendly \u003c/span>\u003cspan class=\"tgt\">rabbit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교 버스에서 Harry는 친절한 토끼 Ruby를 발견했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">주인공\u003c/b> Harry가 학교 버스에서 Ruby를 처음 만나는 장면이에요. 뒤에 붙은 the friendly rabbit은 Ruby가 어떤 인물인지 알려 주는 \u003cb class=\"key\">동격\u003c/b> 표현이라서, Ruby가 친절한 토끼라는 정보를 독자에게 바로 심어 줘요. 그래서 두 인물의 관계가 앞으로 어떻게 이어질지 궁금하게 만드는 도입 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : 전치사 on + [the school bus] → 문장 앞 [부사구] : \"학교 버스에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [명사] + , + [명사구] (앞 명사를 부연 설명) : \"Ruby, 즉 친절한 토끼\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"On the school bus, 학교 버스에서. Harry found Ruby, Harry는 Ruby를 발견했습니다. the friendly rabbit, 친절한 토끼를요.. 이 문장 전체를 해석하면, 학교 버스에서 Harry는 친절한 토끼 Ruby를 발견했습니다.","hl":"m"},{"n":14,"text":"첫 번째 문장은 이야기의 주인공 Harry가 학교 버스에서 Ruby를 처음 만나는 장면이에요. 뒤에 붙은 the friendly rabbit은 Ruby가 어떤 인물인지 알려 주는 동격 표현이라서, Ruby가 친절한 토끼라는 정보를 독자에게 바로 심어 주죠. 그래서 두 인물의 관계가 앞으로 어떻게 이어질지 기대하게 만드는 도입 문장이에요.","hl":"mn"},{"n":15,"text":"먼저 문장 맨 앞의 On the school bus를 볼게요. 이건 장소를 나타내는 전치사구가 부사구로 쓰인 거예요. 어디에서 일이 일어났는지부터 알려 주고, 그 뒤에 주어 Harry가 이어지는 구조죠. 다음으로 Ruby, the friendly rabbit을 보세요. 콤마 뒤의 the friendly rabbit이 앞의 Ruby와 같은 대상을 다시 설명하는 동격이에요. 그래서 'Ruby, 즉 친절한 토끼'라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“안녕,\u003c/span>\u003cspan class=\"en\">&quot;Hi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“안녕, Harry!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ruby가 Harry에게 먼저 건네는 \u003cb class=\"key\">대사\u003c/b>예요. Hi 같은 짧은 \u003cb class=\"key\">인사말\u003c/b>은 두 사람이 이미 친근한 사이라서 편하게 말을 거는 분위기를 보여 줘요. 콤마 뒤에 온 Harry는 상대를 직접 부르는 \u003cb class=\"key\">호격\u003c/b>이라서, Ruby가 Harry를 정확히 향해 말하고 있음을 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">호격(부르는 말)\u003c/span> : [인사말] + , + [이름] (상대를 부르는 호격) : \"Harry야\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"\"Hi, “안녕. Harry!\", Harry!”. 이 문장 전체를 해석하면, “안녕, Harry!”","hl":"m"},{"n":17,"text":"두 번째 문장은 Ruby가 Harry에게 먼저 건네는 인사 대사예요. Hi 같은 짧은 인사말은 두 사람이 이미 친근한 사이라서 편하게 말을 거는 분위기를 보여 주죠. 콤마 뒤의 Harry는 상대를 직접 부르는 호격이라서, Ruby가 Harry를 정확히 향해 말하고 있다는 걸 알 수 있어요.","hl":"mn"},{"n":18,"text":"여기서 콤마 뒤에 온 Harry를 눈여겨보세요. 이름을 불러 상대를 직접 부르는 호격이에요. 그리고 따옴표 안의 Hi, Harry!는 주어와 동사가 따로 없는 인사말 한마디라서, 문장이라기보다 대화의 한 토막으로 보면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ruby가\u003c/span>\u003cspan class=\"en\">Ruby\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 손을 흔들었습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">waved \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ruby가 그에게 손을 흔들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ruby가 손을 흔들어 인사를 \u003cb class=\"key\">행동\u003c/b>으로 보여 주는 문장이에요. wave at은 '~에게 손을 흔들다'라는 뜻으로, at이 인사가 향하는 \u003cb class=\"key\">방향\u003c/b>을 콕 집어 줘요. 앞 문장의 말 인사에 이어 몸짓 인사까지 더해져서, Ruby가 Harry에게 관심을 보인다는 흐름이 만들어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 at 구문\u003c/span> : [주어] + wave + at + [사람] : \"그에게 손을 흔들었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인칭대명사의 목적격\u003c/span> : 전치사 + [목적격] (he → him) : \"그에게\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Ruby, Ruby가. waved at him, 그에게 손을 흔들었습니다.. 이 문장 전체를 해석하면, Ruby가 그에게 손을 흔들었습니다.","hl":"m"},{"n":20,"text":"세 번째 문장은 Ruby가 손을 흔들어 인사를 행동으로 보여 주는 문장이에요. wave at은 '~에게 손을 흔들다'라는 뜻으로, at이 인사가 향하는 방향을 콕 집어 주죠. 앞 문장의 말 인사에 이어 몸짓 인사까지 더해져서, Ruby가 Harry에게 관심을 보인다는 흐름이 만들어져요.","hl":"mn"},{"n":21,"text":"먼저 waved at him에서 동사 wave는 손을 흔들다는 뜻의 자동사예요. 목적어를 바로 가질 수 없어서 전치사 at으로 방향을 이어 주고, 그래서 wave at somebody 형태로 '~에게 손을 흔들다'가 돼요. 다음으로 at 뒤에 온 him을 보세요. 여기는 전치사 뒤라서 목적격이 와야 하니, 주격 he를 그대로 쓰면 안 되고 반드시 him을 써야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갔습니다\u003c/span>\u003cspan class=\"en\">went\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ruby 옆에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\"> 3c/div>\u003c/div>","segs":[{"n":25,"text":"Ouch!, “아야!”. 이 문장 전체를 해석하면, “아야!”","hl":"m"},{"n":26,"text":"Harry가 Ruby 옆에 앉는 순간 터진 비명이에요. 누가 다쳤다는 신호죠. 바로 다음 문장에서 그 이유가 나옵니다.","hl":"mn"},{"n":27,"text":"이건 감탄사예요. 갑자기 아프거나 놀랐을 때 내는 소리로, 문장의 흐름을 바꾸는 신호라고 생각하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry의 가시가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Harry's \u003c/span>\u003cspan class=\"tgt\">spines\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프게 했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hurt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ruby를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Ruby\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry의 가시가 Ruby를 아프게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry의 \u003cb class=\"key\">가시\u003c/b>가 Ruby를 아프게 했다는 뜻이에요. 같이 앉으려던 Harry 때문에 Ruby가 다친 것이죠. 이 사건이 Harry를 다시 \u003cb class=\"key\">외톨이\u003c/b>로 만드는 직접적인 원인이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격('s)\u003c/span> : [Harry's + 명사(spines)] : \"Harry의 가시\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식(주어 + 동사 + 목적어)\u003c/span> : hurt [타동사] + [Ruby (목적어)] : \"Ruby를 아프게 했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Harry's spines, Harry의 가시가. hurt, 아프게 했습니다. Ruby, Ruby를. 이 문장 전체를 해석하면, Harry의 가시가 Ruby를 아프게 했습니다.","hl":"m"},{"n":29,"text":"Harry의 가시가 Ruby를 아프게 했다는 뜻이에요. 같이 앉으려던 Harry 때문에 Ruby가 다친 거죠. 이 사건이 Harry를 다시 외톨이로 만드는 직접적인 원인이 됩니다.","hl":"mn"},{"n":30,"text":"첫 번째는 Harry's인데, 소유격으로 Harry의라고 해석해요. 두 번째는 hurt Ruby인데, hurt는 뒤에 목적어를 바로 데리고 와서 Ruby를 아프게 하다라고 해석해요. 그래서 Harry의 가시가 주어, hurt가 동사, Ruby가 목적어인 구조가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오,\u003c/span>\u003cspan class=\"en\">&quot;Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미안해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">sorry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ruby.\u003c/span>\u003cspan class=\"en\">Ruby.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“오, 미안해, Ruby.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 \u003cb class=\"key\">spines\u003c/b> 때문에 Ruby를 아프게 한 뒤 Harry가 하는 \u003cb class=\"key\">사과\u003c/b>의 말이에요. 짧은 한마디지만 상대를 \u003cb class=\"key\">배려\u003c/b>하는 마음이 담겨 있죠. 이 사과 뒤에 Harry가 뒷자리로 가는 흐름으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사과의 관용 표현(be sorry)\u003c/span> : 주어 + be동사 + sorry (+ for -ing / that절) : \"미안해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 축약형\u003c/span> : I + am → I'm : \"나는 ~이에요\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Oh, 오. I'm sorry, 미안해. Ruby, Ruby.. 이 문장 전체를 해석하면, “오, 미안해, Ruby.”","hl":"m"},{"n":32,"text":"이 문장은 Harry가 자기 가시 때문에 Ruby를 아프게 해서 하는 사과의 말이에요. 아주 짧지만 상대를 배려하는 마음이 담겨 있죠. 그리고 이 사과 뒤에 Harry가 뒷자리로 가는 흐름으로 이어집니다.","hl":"mn"},{"n":33,"text":"먼저 I'm sorry는 be동사 뒤에 형용사 sorry가 온 이 형식 문장이에요. 미안하다는 상태를 그대로 나타내는 사과의 관용 표현이죠. 그리고 I'm은 be동사 am이 주어 I와 붙어서 축약된 형태라는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갔습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒷자리로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">seat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 뒷자리로 갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ruby를 아프게 한 뒤 Harry가 스스로 \u003cb class=\"key\">뒷자리\u003c/b>로 자리를 옮긴 장면이에요. '뒷자리'는 혼자 남고 싶은 마음을 상징하듯 쓰였죠. 이 선택이 바로 다음 문장의 \u003cb class=\"key\">외로움\u003c/b>으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">go의 과거형(불규칙 동사)\u003c/span> : go - went - gone : \"갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to(도착점)\u003c/span> : go + to + [장소 명사] : \"뒷자리로\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Harry, Harry는. went, 갔습니다. to the back seat, 뒷자리로.. 이 문장 전체를 해석하면, Harry는 뒷자리로 갔습니다.","hl":"m"},{"n":35,"text":"이 문장은 Harry가 스스로 뒷자리로 자리를 옮긴 장면이에요. 뒤쪽 자리는 혼자 남고 싶은 마음을 상징하듯 쓰였죠. 그리고 이 선택이 바로 다음 문장의 외로움으로 이어집니다.","hl":"mn"},{"n":36,"text":"먼저 went는 go의 과거형이에요. go는 과거형이 불규칙하게 바뀌는 동사라서 went를 그대로 써 줍니다. 그리고 to는 움직임의 도착점을 나타내는 전치사라서 to the back seat는 뒷자리라는 장소로 향했다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">H /span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 가시\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">spines\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이 가시 때문에 아무도 나를 좋아하지 않아.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry가 자기 등에 난 가시 때문에 아무도 자기를 좋아하지 않는다고 스스로 결론 내리는 장면이에요. 실제로 친구들이 싫어한다기보다, 앞에서 Ruby를 아프게 한 일 때문에 Harry가 \u003cb class=\"key\">자책\u003c/b>하고 있는 흐름이에요. 그래서 이 문장은 Harry의 \u003cb class=\"key\">외로움\u003c/b>과 슬픔을 압축해서 보여 주는 핵심 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 주어 Nobody\u003c/span> : Nobody + [단수동사] → '아무도 ~하지 않는다' : \"아무도 나를 좋아하지 않아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(이유) because of\u003c/span> : because of + [명사구] → '~ 때문에' : \"이 가시 때문에\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Nobody likes me, 아무도 나를 좋아하지 않아. because of, 때문에. these spines, 이 가시. 이 문장 전체를 해석하면, “이 가시 때문에 아무도 나를 좋아하지 않아.”","hl":"m"},{"n":41,"text":"Harry가 자기 등에 난 가시 때문에 아무도 자기를 좋아하지 않는다고 혼자 결론 내리는 장면이에요. 친구들이 진짜로 싫어한다기보다, 앞에서 Ruby를 아프게 한 일 때문에 Harry가 스스로를 탓하고 있는 거죠. 그래서 이 문장은 Harry의 외로움과 슬픔을 한 번에 보여 주는 핵심 문장이에요.","hl":"mn"},{"n":42,"text":"먼저 Nobody likes me를 보세요. Nobody는 부정대명사라서 '아무도 없어요'라는 뜻이고, 그래서 뒤에 likes처럼 단수동사가 와요. 두 번째로 because of를 보세요. because of는 뒤에 명사 덩어리만 데리고 와서 '이 가시 때문에'라는 이유를 만들어 줘요. 만약 because만 쓴다면 뒤에 주어와 동사가 있는 절이 와야 한다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는 느꼈습니다\u003c/span>\u003cspan class=\"en\">Harry \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 슬프다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 정말 슬프다고 느꼈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry가 앞에서 겪은 일들 때문에 정말 슬픈 마음이 들었다는 뜻이에요. felt는 '만졌다'가 아니라 '느꼈다'라는 뜻으로 쓰였고, 뒤의 sad가 그의 \u003cb class=\"key\">감정\u003c/b>을 설명해 줘요. 짧은 문장이지만 앞 문장의 자책과 이어지면서 Harry의 \u003cb class=\"key\">슬픔\u003c/b>을 확실하게 전달하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 feel + 형용사(주격보어)\u003c/span> : feel + [형용사 (주격보어)] → '~하게 느끼다' : \"정말 슬프다고 느꼈습니다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Harry felt, Harry는 느꼈습니다. really sad, 정말 슬프다고. 이 문장 전체를 해석하면, Harry는 정말 슬프다고 느꼈습니다.","hl":"m"},{"n":44,"text":"Harry가 앞에서 겪은 일들 때문에 정말 슬픈 마음이 들었다는 뜻이에요. 여기서 felt는 '만졌다'가 아니라 '느꼈다'라는 뜻으로 쓰였고, 뒤에 sad가 와서 그의 감정을 설명해 줘요. 짧지만 앞 문장의 자책과 이어지면서 Harry의 슬픔을 확실하게 보여 주는 문장이죠.","hl":"mn"},{"n":45,"text":"여기서 feel은 '만지다'가 아니라 '느끼다'라는 뜻의 2형식 동사예요. 그래서 뒤에 목적어가 아니라 sad 같은 형용사가 주격보어로 와서 '슬프다고 느꼈다'가 되는 거죠. 그리고 really는 형용사 sad를 꾸며서 '정말 슬프다'라는 정도를 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 주 뒤에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">weeks \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는 앉아 있었습니다\u003c/span>\u003cspan class=\"en\">Harry \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">sitting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒤쪽에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교실의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">classroom\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 주 뒤, Harry는 교실 뒤에 앉아 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 몇 주 지났다는 것을 알려 주면서 새로운 장면으로 넘어가는 연결 문장이에요. Harry가 여전히 교실 뒤쪽, 즉 가장 눈에 띄지 않는 자리에 앉아 있다는 점에서 그의 \u003cb class=\"key\">외로움\u003c/b>이 계속되고 있음을 보여 줘요. 바로 다음에 이어지는 생일 장면의 \u003cb class=\"key\">배경\u003c/b>을 만들어 주는 문장이기도 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 경과 표현 (a few + 복수명사 + later)\u003c/span> : [a few + 복수명사 + later] → '몇 주 뒤에' : \"몇 주 뒤에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형 (was/were + -ing)\u003c/span> : [was/were] + [동사원형-ing] → '~하고 있었다' : \"앉아 있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 in the back of\u003c/span> : in the back of + [명사] → '~의 뒤쪽에' : \"교실 뒤에\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"A few weeks later, 몇 주 뒤에. Harry was sitting, Harry는 앉아 있었습니다. in the back, 뒤쪽에. of the classroom, 교실의. 이 문장 전체를 해석하면, 몇 주 뒤, Harry는 교실 뒤에 앉아 있었습니다.","hl":"m"},{"n":47,"text":"이 문장은 시간이 몇 주 지났다는 것을 알려 주면서 새로운 장면으로 넘어가는 연결 문장이에요. Harry가 여전히 교실 뒤쪽, 즉 가장 눈에 띄지 않는 자리에 앉아 있다는 점에서 외로움이 계속되고 있음을 보여 주죠. 바로 다음에 이어지는 생일 장면의 배경을 만들어 주는 문장이기도 해요.","hl":"mn"},{"n":48,"text":"먼저 A few weeks later를 보세요. a few는 '몇 개의'라는 뜻으로 복수명사 weeks를 꾸미고, later가 붙어서 '몇 주 뒤에'라는 시간 표현을 만들어요. 두 번째로 was sitting은 과거진행형이에요. be동사 과거형 was에 현재분사 sitting을 붙여서 그때 앉아 있던 장면을 그려 주죠. 세 번째로 in the back of the classroom은 '교실 뒤쪽에'라는 뜻으로 위치를 자세히 알려 주는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이었습니다\u003c/span>\u003cspan class=\"en\">was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 생일\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his\u003c/span> birthday.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 생일이었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Harry의 생일이라는 사실을 알려 줍니다. 앞에서 Harry가 외로웠던 흐름 뒤에 나오니, 특별한 날인 \u003cb class=\"key\">생일\u003c/b>이 다음 이야기의 배경이 돼요. It은 날짜나 상황을 말할 때 쓰는 \u003cb class=\"key\">비인칭 \u003c/b>\u003cb class=\"key\">주어\u003c/b>로, '그것은'이라고 해석합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it\u003c/span> : It [비인칭 주어] + was [be동사] + his birthday [명사(주격보어)] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 대명사\u003c/span> : his [소유격] + birthday [명사] : \"그의\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"It, 그것은. was, ~이었습니다. his birthday, 그의 생일. 이 문장 전체를 해석하면, 그의 생일이었습니다.","hl":"m"},{"n":50,"text":"이 문장은 Harry의 생일이라는 사실을 알려 주는 문장이에요. 앞에서 Harry가 외로웠던 이야기 뒤에 나오니까, 특별한 날인 생일이 다음 이야기의 배경이 된다는 걸 기억해 두세요. 그리고 It은 날짜나 상황을 말할 때 쓰는 비인칭 주어라는 점도 꼭 챙겨 두세요.","hl":"mn"},{"n":51,"text":"It은 날짜나 상황을 말할 때 쓰는 비인칭 주어예요. 그래서 '그것은'이라고 해석하지만 실제로 무엇을 가리키지는 않죠. was는 '~이었습니다', his birthday는 '그의 생일'이에요. his는 Harry가 남자라서 쓰는 소유격이고, 소유격 뒤에는 명사가 온다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 반 친구들은\u003c/span>\u003cspan class=\"en\">His classmates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기하고 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">talking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 반 친구들은 무언가에 대해 이야기하고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반 친구들이 Harry를 빼놓고 무언가를 꾸미고 있음을 암시하는 문장입니다. \u003cb class=\"key\">과거진행형\u003c/b> were talking은 그 이야기가 그 순간에도 계속되고 있었음을 보여 줘요. 무엇인지 밝히지 않은 \u003cb class=\"key\">something\u003c/b>이 궁금증을 만들어 다음 문장으로 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형 (be동사 과거 + 동사원형-ing)\u003c/span> : were [be동사 과거] + talking [현재분사] = 과거진행 : \"이야기하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about + 목적어(부정대명사)\u003c/span> : talk + about + [목적어] = ~에 대해 이야기하다 : \"무언가에 대해\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"His classmates, 그의 반 친구들은. were talking, 이야기하고 있었습니다. about something, 무언가에 대해. 이 문장 전체를 해석하면, 그의 반 친구들은 무언가에 대해 이야기하고 있었습니다.","hl":"m"},{"n":53,"text":"이 문장은 반 친구들이 Harry를 빼놓고 무언가를 꾸미고 있다는 걸 암시해요. were talking은 그 순간에도 이야기가 계속되고 있었음을 보여 주죠. 무엇인지 밝히지 않은 something이 궁금증을 만들어서 다음 문장으로 자연스럽게 이어 줘요.","hl":"mn"},{"n":54,"text":"먼저 were talking은 과거진행형이에요. be동사의 과거형 were에 동사원형 talking을 붙여서 '~하고 있었다'는 뜻을 만들어요. 주어가 복수라서 was가 아니라 were를 썼다는 점도 꼭 챙겨 두세요. 두 번째로 talk는 about과 함께 쓰여서 '~에 대해 이야기하다'라는 뜻이 돼요. something은 '무언가'라는 부정대명사이고, 전치사 뒤에서 목적어 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러더니\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 떠났습니다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교실을\u003c/span>\u003cspan class=\"en\">the classroom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러더니 그들은 Harry 없이 교실을 떠났습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Harry를 두고 교실을 나가는 장면으로, Harry의 외로움이 가장 커지는 대목입니다. \u003cb class=\"key\">left\u003c/b>는 leave의 과거형이고, \u003cb class=\"key\">without \u003c/b>\u003cb class=\"key\">Harry\u003c/b>가 'Harry 없이'라는 뜻이라 소외감이 뚜렷하게 드러나요. 그래서 바로 다음 문장에서 Harry가 몹시 외로움을 느끼게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">leave의 과거형(불규칙 변화)\u003c/span> : leave - left - left [현재 - 과거 - 과거분사] : \"떠났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 명사\u003c/span> : without [전치사] + Harry [명사(목적어)] : \"Harry 없이\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"Then, 그러더니. they left, 그들은 떠났습니다. the classroom, 교실을. without Harry, Harry 없이. 이 문장 전체를 해석하면, 그러더니 그들은 Harry 없이 교실을 떠났습니다.","hl":"m"},{"n":56,"text":"이 문장은 친구들이 Harry를 두고 교실을 나가는 장면이에요. 앞에서 무언가를 이야기하던 친구들이 갑자기 교실을 떠나니까 Harry는 더 외로워지죠. left는 leave의 과거형이고, without Harry가 'Harry 없이'라는 뜻이라서 소외감이 아주 잘 드러나요.","hl":"mn"},{"n":57,"text":"첫 번째, left는 leave의 과거형이에요. leave는 leave, left, left로 변하는 불규칙 동사라서 꼭 외워 두세요. 두 번째, without Harry는 전치사 without 뒤에 사람 이름이 온 형태예요. without은 '~없이'라는 뜻으로 함께하지 않는 대상을 나타내고, 이 표현이 Harry의 소외감을 강조해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해리는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느꼈습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 외롭다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">lonely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 너무 외롭다고 느꼈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 해리는 등 뒤 좌석으로 가서 혼자 앉았고, 교실에서도 친구들이 자기만 빼놓고 나가 버렸죠. 이 문장은 그런 해리의 \u003cb class=\"key\">외로움\u003c/b>을 마지막에 한 번 더 강하게 못 박아 주는 문장이에요. \u003cb class=\"key\">so\u003c/b>가 들어가서 '외롭다'보다 훨씬 강한 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 감각동사 feel(불완전자동사)\u003c/span> : [주어] + feel + [형용사 보어] : \"느꼈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정도 부사 so + 형용사 보어\u003c/span> : so [정도 부사] + lonely [형용사] : \"너무 외롭게\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"Harry, 해리는. felt, 느꼈습니다. so lonely, 너무 외롭다고. 이 문장 전체를 해석하면, Harry는 너무 외롭다고 느꼈습니다.","hl":"m"},{"n":59,"text":"앞에서 해리는 버스에서도 혼자, 교실에서도 혼자였죠. 그 감정을 마지막에 확실하게 정리해 주는 문장이 바로 이 문장이에요. 그래서 이 문장은 해리의 외로움을 독자에게 강하게 각인시키는 역할을 합니다.","hl":"mn"},{"n":60,"text":"먼저 첫 번째, felt를 보세요. feel은 여기서 '느끼다'라는 뜻의 2형식 동사로 쓰였고, 2형식 동사는 보어가 꼭 필요해서 뒤에 형용사가 옵니다. 그래서 부사가 아니라 형용사 lonely가 온다는 점을 꼭 기억하세요. 두 번째, so lonely를 보세요. so는 정도를 강하게 만드는 부사라서 lonely를 꾸미면 '외롭다'가 아니라 '너무 외롭다'라는 강한 감정이 됩니다. 그래서 이 문장은 해리의 외로움을 한층 더 진하게 전해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>학교 버스에서 Harry는 친절한 토끼 \u003cb class=\"key\">Ruby\u003c/b>를 만나 옆자리에 앉으려 했어요.\u003c/li>\u003cli>그러나 Harry의 \u003cb class=\"key\">가시\u003c/b>가 Ruby를 아프게 해서 그는 뒷자리로 가야 했고, 다시 \u003cb class=\"key\">혼자\u003c/b>가 되었어요.\u003c/li>\u003cli>Harry는 '이 가시 때문에 아무도 나를 좋아하지 않아'라고 생각하며 \u003cb class=\"key\">슬픔\u003c/b>을 느꼈어요.\u003c/li>\u003cli>몇 주 뒤 \u003cb class=\"key\">생일\u003c/b> 날에도 반 친구들은 Harry 없이 교실을 떠났고, 그는 \u003cb class=\"key\">외로움\u003c/b>을 느꼈어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Harry the hedgehog keeps ending up alone because his spines hurt others, and that makes him feel sad and lonely.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">가시 때문에 친구에게 다가가도 곧 \u003cb class=\"key\">혼자\u003c/b>가 되는 고슴도치 Harry가, 생일 날에도 반 친구들에게 남겨져 교실에서 \u003cb class=\"key\">외로움\u003c/b>을 느낀다는 이야기\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":61,"text":"오늘 지문을 정리해 볼게요. Harry는 가시 때문에 Ruby에게 다가가지 못하고, 생일 날에도 친구들에게 남겨져 외로움을 느꼈어요. 사건이 시간 순서대로 이어지고, 마지막 문장에서 그의 외로움이 정리되는 미괄식 구조라는 점도 꼭 기억해 두세요. 그럼 오늘 수업은 여기까지입니다. 모두 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
