<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 8과 본문3","audioDir":"3_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Happy Birthday, Harry!\u003c/h1>\u003ch2>해리, 생일 축하해!\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 반 친구들이 Harry를 불러 밖으로 나가게 하고, \u003cb class=\"key\">생일\u003c/b>을 맞아 \u003cb class=\"key\">스펀지\u003c/b> 재킷을 선물하며 함께 \u003cb class=\"key\">껴안아\u003c/b> 준다. 그 관심 덕분에 Harry는 더 이상 \u003cb class=\"key\">외롭지\u003c/b> 않게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Harry's classmates surprise him on his birthday with a sponge jacket and hugs, which makes him feel no longer lonely.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 천재 이 선생님 교과서 여덟 과 본문 세 번째 지문을 함께 읽어 볼 거예요. Harry의 생일날 벌어지는 따뜻한 이야기인데요, 반 친구들이 Harry를 불러내고 선물을 주고 함께 안아 주는 장면이 담겨 있어요. 요지는 친구들의 관심과 선물 덕분에 Harry가 더 이상 외롭지 않게 된다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">생일(birthday)은 많은 문화에서 사람들 사이의 \u003cb class=\"key\">유대\u003c/b>(bond)를 확인하는 특별한 날입니다. 친구들이 함께 모여 축하하고 선물(gift)을 주는 행동은 상대를 \u003cb class=\"key\">소중히\u003c/b> 여긴다는 신호입니다. 이 지문에서 친구들이 함께 입은 스펀지 재킷은 일종의 \u003cb class=\"key\">단체복\u003c/b>(uniform)처럼 같은 무리에 속해 있음을 보여 주는 장치입니다. 단체복은 우리가 같은 집단에 속해 있다는 \u003cb class=\"key\">소속감\u003c/b>(belonging)을 만들어 주는데, 이는 같은 교복을 입은 친구들끼리 더 가깝게 느껴지는 것과 비슷합니다. 결국 Harry에게 중요한 것은 선물 자체가 아니라, 자신을 기억하고 챙겨 주는 사람들이 있다는 \u003cb class=\"key\">사실\u003c/b>입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 생일은 많은 문화에서 사람들 사이의 유대를 확인하는 특별한 날이에요. 친구들이 함께 모여 축하하고 선물을 주는 행동은 상대를 소중히 여긴다는 신호죠. 이 지문에서 친구들이 함께 입은 스펀지 재킷은 일종의 단체복처럼 같은 무리에 속해 있음을 보여 주는 장치예요. 단체복은 우리가 같은 집단에 속해 있다는 소속감을 만들어 주는데, 이건 같은 교복을 입은 친구들끼리 더 가깝게 느껴지는 것과 비슷해요. 결국 Harry에게 중요한 것은 선물 자체가 아니라, 자신을 기억하고 챙겨 주는 사람들이 있다는 사실이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>친구들의 부름\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>곧 반 친구들이 Harry를 불렀고, 'Harry, come out!'이라고 말했어요. Harry가 밖으로 \u003cb class=\"key\">나갔을 \u003c/b>\u003cb class=\"key\">때\u003c/b> 반 친구들이 그를 \u003cb class=\"key\">기다리고\u003c/b> 있었습니다. 이 장면은 친구들이 이미 무언가를 준비해 두었음을 \u003cb class=\"key\">암시\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>생일과 선물의 예고\u003csmall>전환 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>친구들은 \u003cb class=\"key\">스펀지\u003c/b> 재킷을 입고 있었어요. 그리고 'Happy birthday, Harry!'라며 이건 너를 위한 거라고 말했죠. 여기서 \u003cb class=\"key\">생일\u003c/b>이라는 상황이 드러나면서 이야기의 \u003cb class=\"key\">배경\u003c/b>이 분명해집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>상자를 받은 Harry\u003csmall>전개 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>Ruby가 Harry에게 \u003cb class=\"key\">상자\u003c/b>를 주었고, Harry는 \u003cb class=\"key\">놀랐습니다\u003c/b>. 그리고 기뻐하며 그 상자를 열어 \u003cb class=\"key\">안을\u003c/b> 보았어요. 선물을 받고 확인하는 \u003cb class=\"key\">전환\u003c/b> 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>재킷을 입다\u003csmall>절정 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>상자 안에는 Harry를 위한 \u003cb class=\"key\">재킷\u003c/b>이 있었습니다. Harry는 'I love it!'이라며 좋아했고, 곧바로 그 재킷을 \u003cb class=\"key\">입었어요\u003c/b>. 선물이 실제로 \u003cb class=\"key\">받아들여지는\u003c/b> 장면이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>포옹과 결론\u003csmall>결론 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>그러고 나서 모든 반 친구들이 Harry를 \u003cb class=\"key\">껴안았습니다\u003c/b>. 행복한 \u003cb class=\"key\">미소\u003c/b>가 Harry의 얼굴에 번졌고, 그는 더 이상 \u003cb class=\"key\">외롭지\u003c/b> 않았어요. 친구들의 관심이 Harry의 마음을 바꾼 \u003cb class=\"key\">결론\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 곧 반 친구들이 Harry를 불렀어요. Harry, come out 하고 소리치죠. Harry가 밖으로 나갔을 때 친구들이 그를 기다리고 있었는데, 이 장면은 친구들이 이미 무언가를 준비해 두었다는 걸 암시해요.","hl":"f0"},{"n":5,"text":"다음으로 친구들은 스펀지 재킷을 입고 있었어요. 그리고 Happy birthday, Harry, 이건 너를 위한 거야 하고 말하죠. 여기서 생일이라는 상황이 드러나면서 이야기의 배경이 분명해져요.","hl":"f1"},{"n":6,"text":"이어서 Ruby가 Harry에게 상자를 주었고, Harry는 놀랐어요. 그리고 기뻐하며 상자를 열어 안을 보았죠. 선물을 받고 확인하는 전환 단계예요.","hl":"f2"},{"n":7,"text":"상자 안에는 Harry를 위한 재킷이 있었어요. Harry는 I love it 하면서 좋아했고, 곧바로 그 재킷을 입었죠. 선물이 실제로 받아들여지는 장면이에요.","hl":"f3"},{"n":8,"text":"마지막으로 모든 반 친구들이 Harry를 껴안았어요. 행복한 미소가 Harry의 얼굴에 번졌고, 그는 더 이상 외롭지 않았죠. 친구들의 관심이 Harry의 마음을 바꾼 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Soon, When, Then 같은 \u003cb class=\"key\">시간\u003c/b> 표지어를 따라 사건이 차례대로 이어지는 이야기입니다. 그래서 전개 방식은 \u003cb class=\"key\">시간순\u003c/b>이고, 처음에는 Harry가 불려 나가는 장면에서 시작해 마지막 문장에서 그가 더 이상 \u003cb class=\"key\">외롭지\u003c/b> 않다는 결론에 도달합니다. 결론이 마지막에 제시되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Soon (1)\u003c/b>\u003cspan>시간·도입\u003c/span>\u003cb>When (3)\u003c/b>\u003cspan>시간·계기\u003c/span>\u003cb>Then (13)\u003c/b>\u003cspan>시간·전환\u003c/span>\u003cb>anymore (15)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Harry was surprised\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">gladly opened the box\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I love it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">A happy smile spread on Harry's face\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He wasn't lonely anymore\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순이에요. Soon이나 When, Then 같은 시간 표지어를 따라 사건이 차례대로 이어지죠. 처음에는 Harry가 불려 나가는 장면에서 시작해서, 마지막 문장에서 그가 더 이상 외롭지 않다는 결론에 도달해요. 그래서 결론이 마지막에 나오는 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 Soon은 이야기의 시작을 알려 주고, 세 번째 문장의 When은 Harry가 밖으로 나간 계기를 만들어 줘요. 열세 번째 문장의 Then은 포옹 장면으로 넘어가는 전환이고, 열다섯 번째 문장의 anymore는 결론을 강조하는 표현이에요. 이렇게 시간 표지어를 따라가면 사건의 순서가 한눈에 잡혀요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go outside\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밖으로 나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>when\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sponge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스펀지\u003c/span>\u003c/div>\u003cdiv>\u003cb>jacket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재킷\u003c/span>\u003c/div>\u003cdiv>\u003cb>Happy birthday\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생일 축하해\u003c/span>\u003c/div>\u003cdiv>\u003cb>give\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>box\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상자\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>gladly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>기뻐하며\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look inside\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>there was\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 있었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정말 마음에 들어 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>입다\u003c/span>\u003c/div>\u003cdiv>\u003cb>then\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러고 나서\u003c/span>\u003c/div>\u003cdiv>\u003cb>all\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모든\u003c/span>\u003c/div>\u003cdiv>\u003cb>hug\u003c/b>\u003cem>동사\u003c/em>\u003cspan>껴안다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미소\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>명사\u003c/em>\u003cspan>얼굴\u003c/span>\u003c/div>\u003cdiv>\u003cb>lonely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚어 볼게요. wait for는 기다리다, wear는 입고 있다, put on은 입다는 뜻이에요. surprised는 놀란, gladly는 기뻐하며, lonely는 외로운이라는 뜻이고, spread는 번지다라는 의미로 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">행복한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">joyful\u003c/span>\u003cspan class=\"s\">cheerful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lonely\u003c/b>\u003cspan class=\"m\">외로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">solitary\u003c/span>\u003cspan class=\"s\">alone\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprised\u003c/b>\u003cspan class=\"m\">놀란\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">amazed\u003c/span>\u003cspan class=\"s\">astonished\u003c/span>\u003cspan class=\"s\">shocked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gladly\u003c/b>\u003cspan class=\"m\">기뻐하며\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happily\u003c/span>\u003cspan class=\"s\">willingly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reluctantly\u003c/span>\u003cspan class=\"a\">unwillingly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give\u003c/b>\u003cspan class=\"m\">주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">hand\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spread\u003c/b>\u003cspan class=\"m\">번지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extend\u003c/span>\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003cspan class=\"a\">contract\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. happy는 glad, joyful, cheerful 같은 동의어가 있고 반대말은 sad나 unhappy예요. lonely는 solitary나 alone과 비슷하고, surprised는 amazed, astonished와 가까워요. gladly는 happily, willingly와 같은 뜻이고 반대로는 reluctantly, unwillingly가 있어요. give는 offer, hand, present로 바꿔 쓸 수 있고 반대말은 take나 receive예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Soon,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 반 친구들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">classmates \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry를 불렀습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧, 그의 반 친구들이 Harry를 불렀습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기가 새 국면으로 넘어가는 \u003cb class=\"key\">전환점\u003c/b>을 알려 줍니다. Soon은 '곧, 머지않아'라는 뜻으로 앞으로 \u003cb class=\"key\">사건\u003c/b>이 곧 일어난다는 신호를 주는 말이에요. 친구들이 왜 Harry를 불렀는지는 바로 다음 문장에서 밝혀집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사의 문두 위치\u003c/span> : [부사 Soon] + [주어 his classmates] + [동사 called] + [목적어 Harry] : \"곧,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문장(주어 + 동사 + 목적어)\u003c/span> : [주어 his classmates] + [타동사 called] + [목적어 Harry] : \"그의 반 친구들이 Harry를 불렀습니다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Soon, 곧. his classmates, 그의 반 친구들이. called Harry, Harry를 불렀습니다.. 이 문장 전체를 해석하면, 곧, 그의 반 친구들이 Harry를 불렀습니다.","hl":"m"},{"n":14,"text":"이 문장은 이야기가 새 국면으로 넘어가는 전환점을 알려 줍니다. Soon은 곧, 머지않아라는 뜻으로 앞으로 사건이 곧 일어난다는 신호를 주는 거예요. 친구들이 왜 Harry를 불렀는지는 바로 다음 문장에서 밝혀집니다.","hl":"mn"},{"n":15,"text":"첫 번째로 Soon이 문장 맨 앞에 온 것을 보세요. 시간을 나타내는 부사가 앞에 오면 뒤에 올 사건을 자연스럽게 기다리게 만들어 줍니다. 두 번째로 his classmates called Harry는 주어와 타동사와 목적어가 차례로 오는 삼 형식 문장이에요. call은 부르다는 뜻의 타동사라서 뒤에 목적어 Harry가 꼭 필요하답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“Harry,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;Harry,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나와 봐!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“Harry, 나와 봐!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 밖에서 Harry를 부르는 \u003cb class=\"key\">장면\u003c/b>이에요. 이름을 먼저 부른 뒤 '나와 봐!'라고 \u003cb class=\"key\">재촉\u003c/b>하는 짧은 명령문이라서, 밖에 뭔가 준비되어 있다는 느낌을 줘요. 다음 문장에서 Harry가 밖으로 나가는 장면이 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">호격(이름을 부르는 말)\u003c/span> : [호격 Harry] + [명령문 come out] : \"Harry, (부르는 말)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 come] + [부사 out] : \"나와 봐!\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"\"Harry, “Harry. come out!\", 나와 봐!”. 이 문장 전체를 해석하면, “Harry, 나와 봐!”","hl":"m"},{"n":17,"text":"이 문장은 친구들이 밖에서 Harry를 부르는 장면이에요. 이름을 먼저 부른 다음 나와 봐라고 재촉하는 짧은 명령문이죠. 그래서 밖에 뭔가 준비되어 있다는 느낌을 줍니다. 다음 문장에서 Harry가 밖으로 나가는 장면이 이어져요.","hl":"mn"},{"n":18,"text":"첫 번째로 Harry 뒤에 쉼표가 찍힌 것은 호격이기 때문이에요. 이름을 불러 말을 거는 말이라서 문장 성분이 아니랍니다. 두 번째로 come out은 명령문이에요. 명령문은 주어 You를 생략하고 동사원형으로 시작하죠. come은 오다, out은 밖으로라는 뜻이라서 밖으로 나오라는 말이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry가 밖으로 나갔을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Harry \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">outside\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 반 친구들이\u003c/span>\u003cspan class=\"en\">his classmates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 기다리고 있었습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">waiting \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry가 밖으로 나갔을 때 그의 반 친구들이 그를 기다리고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry가 밖으로 나가는 \u003cb class=\"key\">행동\u003c/b>과, 그 순간 친구들이 이미 기다리고 있던 \u003cb class=\"key\">상황\u003c/b>을 한 문장에 담았어요. when 절이 배경을 먼저 깔아 주고 과거진행형이 그때 벌어지고 있던 일을 보여 줍니다. 그래서 '나가 보니 기다리고 있더라' 하는 \u003cb class=\"key\">장면\u003c/b>이 생생하게 그려져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [접속사 When] + [주어 Harry] + [동사 went] + [부사 outside] : \"Harry가 밖으로 나갔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형(be동사 + 현재분사)\u003c/span> : [주어 his classmates] + [were] + [waiting(현재분사)] + [for him] : \"그를 기다리고 있었습니다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"When Harry went outside, Harry가 밖으로 나갔을 때. his classmates, 그의 반 친구들이. were waiting for him, 그를 기다리고 있었습니다.. 이 문장 전체를 해석하면, Harry가 밖으로 나갔을 때 그의 반 친구들이 그를 기다리고 있었습니다.","hl":"m"},{"n":20,"text":"이 문장은 Harry가 밖으로 나가는 행동과, 그 순간 친구들이 이미 기다리고 있던 상황을 한 문장에 담았어요. when 절이 배경을 먼저 깔아 주고 과거진행형이 그때 벌어지고 있던 일을 보여 주죠. 그래서 나가 보니 기다리고 있더라 하는 장면이 생생하게 그려집니다.","hl":"mn"},{"n":21,"text":"첫 번째로 When Harry went outside는 접속사 when이 이끄는 시간 부사절이에요. when은 할 때라는 뜻으로 뒤에 주어와 동사가 있는 부사절을 만들고, 이 절이 앞에 와서 주절의 때를 알려 줍니다. 두 번째로 were waiting for him은 과거진행형이에요. be동사 과거형 were에 현재분사 waiting을 붙여 하고 있었다는 과거진행을 만드는 거죠. 그래서 Harry가 나온 그 순간에 기다림이 이미 진행 중이었다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입고 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">wearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스펀지 재킷을\u003c/span>\u003cspan class=\"en\">sponge jackets.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 스펀지 재킷을 입고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry의 반 친구들이 모두 스펀지 재킷을 입고 밖에서 기다리고 있던 장면이에요. wearing은 단순히 '입었다'가 아니라 \u003cb class=\"key\">입고 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">중\u003c/b>이라는 \u003cb class=\"key\">진행\u003c/b>의 느낌을 담고 있죠. 바로 이어질 깜짝 생일 파티의 분위기를 만들어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형(be동사 과거 + 동사원형-ing)\u003c/span> : [주어] + [was/were] + [동사원형-ing] : \"입고 있었습니다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"They, 그들은. were wearing, 입고 있었습니다. sponge jackets, 스펀지 재킷을. 이 문장 전체를 해석하면, 그들은 스펀지 재킷을 입고 있었습니다.","hl":"m"},{"n":23,"text":"이 문장은 Harry의 반 친구들이 모두 스펀지 재킷을 입고 기다리고 있었다는 장면을 보여 줘요. 갑자기 나타난 Harry에게 깜짝 선물을 준비한 분위기가 느껴지죠.","hl":"mn"},{"n":24,"text":"먼저 were wearing을 보세요. 이건 과거진행형이에요. 과거의 어느 순간에 하고 있던 동작을 나타낼 때 be동사 과거형에 동사원형에 ing를 붙인 현재분사를 써요. 그래서 '입고 있었다'라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“생일 축하해,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Happy \u003c/span>\u003cspan class=\"tgt\">birthday\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“생일 축하해, Harry!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Harry를 부르며 생일을 축하해 주는 말이에요. Happy birthday는 축하할 때 쓰는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이고, 뒤에 이름을 붙여 부르는 \u003cb class=\"key\">호격\u003c/b>으로 쓰였어요. 바로 다음 문장에서 선물을 건네는 흐름으로 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">축하 인사 관용 표현(감탄 표현)\u003c/span> : Happy + [기념일을 나타내는 명사] : \"생일 축하해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">호격(부르는 말)\u003c/span> : [이름] + 쉼표 또는 느낌표 : \"Harry야\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"\"Happy birthday, “생일 축하해. Harry!, Harry!. 이 문장 전체를 해석하면, “생일 축하해, Harry!","hl":"m"},{"n":26,"text":"친구들이 Harry를 부르며 생일을 축하해 주는 장면이에요. 바로 뒤 문장에서 선물을 건네니, 축하 인사가 이어지는 흐름이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 Happy birthday는 축하할 때 쓰는 관용 표현이에요. Happy 뒤에 기념일 이름을 붙이면 '축하해'라는 감탄의 뜻이 돼요. 두 번째로 Harry는 사람을 부르는 호격이에요. 이렇게 이름을 부르면 그 사람에게 말을 거는 표현이 되죠.","hl":"gr"}]},{"html":"\u00 요. 그리고 a box처럼 처음 나오는 셀 수 있는 명사 앞에는 부정관사 a를 붙인다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀랐습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 놀랐습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 갑자기 나타나 Happy birthday라고 외치고 상자까지 내밀었으니 \u003cb class=\"key\">Harry\u003c/b>가 \u003cb class=\"key\">놀란\u003c/b> 것은 당연한 반응이에요. 이 짧은 문장은 Harry의 놀람을 전달하면서, 바로 다음에 상자를 여는 행동으로 넘어가는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정동사의 수동태(be동사 + 과거분사)\u003c/span> : [주어 Harry] + was [be동사] + surprised [과거분사] : \"놀랐습니다, 놀란 상태가 되었습니다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Harry, Harry는. was surprised, 놀랐습니다. 이 문장 전체를 해석하면, Harry는 놀랐습니다.","hl":"m"},{"n":35,"text":"친구들이 갑자기 나타나서 Happy birthday라고 외치고 상자까지 내밀었으니 Harry가 놀란 건 당연하죠. 이 문장은 Harry의 놀람을 짧게 전하면서, 바로 다음에 상자를 여는 행동으로 넘어가는 연결 고리 역할을 해요. be동사와 과거분사가 만나 감정 표현이 되었다는 점도 눈여겨보세요.","hl":"mn"},{"n":36,"text":"be동사 뒤에 과거분사가 오면 수동태가 되는데, surprise처럼 사람의 감정을 나타내는 동사는 수동태 형태가 놀란이라는 뜻의 형용사처럼 굳어져요. 그래서 Harry was surprised는 Harry가 스스로 놀게 한 것이 아니라, 친구들의 깜짝 이벤트 때문에 놀란 상태가 되었다는 뜻이에요. 주어가 사람일 때 감정동사의 과거분사는 이렇게 감정 표현으로 자주 쓰인다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기뻐하며 그 상자를 열어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gladly\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">opened \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">box \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 안을 보았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 기뻐하며 그 상자를 열어 안을 보았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">Harry\u003c/b>가 선물 상자를 반가운 마음으로 열고 그 \u003cb class=\"key\">안\u003c/b>을 들여다보는 장면이에요. 앞 문장의 놀람이 기쁨으로 바뀌어 \u003cb class=\"key\">행동\u003c/b>으로 나타난 부분이죠. 다음 문장에서 상자 안에 든 재킷이 소개되므로, 이 문장은 선물의 정체를 꺼내는 징검다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사가 동사를 앞에서 수식\u003c/span> : [부사 gladly] + [동사 opened] : \"기뻐하며, 기꺼이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 연결된 동사구의 병렬\u003c/span> : [동사구 opened the box] + and + [동사구 looked inside] : \"그 상자를 열어 그리고 안을 보았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 look + 부사 inside\u003c/span> : look [자동사] + inside [부사] : \"안을 보다, 안쪽을 들여다보다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Harry, Harry는. gladly opened the box, 기뻐하며 그 상자를 열어. and looked inside, 그리고 안을 보았습니다. 이 문장 전체를 해석하면, Harry는 기뻐하며 그 상자를 열어 안을 보았습니다.","hl":"m"},{"n":38,"text":"이 문장은 Harry가 선물 상자를 반가운 마음으로 열고 그 안을 들여다보는 장면이에요. 앞 문장에서의 놀람이 기쁨으로 바뀌어 행동으로 나타난 부분이죠. 그리고 다음 문장에서 상자 안에 있던 재킷이 소개되기 때문에, 이 문장은 선물의 정체를 꺼내는 징검다리 역할을 합니다.","hl":"mn"},{"n":39,"text":"첫 번째로 볼 것은 부사 gladly예요. gladly는 동사 opened 앞에 놓여서 Harry가 어떤 마음으로 상자를 열었는지를 설명해 줍니다. 두 번째로는 and로 연결된 동사구의 병렬을 봐야 해요. opened the box와 looked inside가 and로 나란히 연결되어 있고, 앞뒤 동사가 모두 과거시제로 모양을 맞췄죠. 세 번째로 inside는 전치사가 아니라 부사라는 점이에요. 그래서 look 뒤에 전치사 없이 바로 붙어서 안을 보다라는 동사구를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재킷이\u003c/span>\u003cspan class=\"en\">a jacket\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry를 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry를 위한 재킷이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 상자를 연 Harry가 안을 들여다본 결과를 알려 주는 \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">is\u003c/b> 구문이에요. ‘~이 있다’라는 뜻으로, 상자 안에 \u003cb class=\"key\">Harry\u003c/b>를 위한 재킷이 들어 있었다는 사실을 처음으로 소개하죠. 여기서 나온 jacket이 바로 다음 문장의 it이 가리키는 \u003cb class=\"key\">지시 \u003c/b>\u003cb class=\"key\">대상\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] (~이 있다) : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for(이익의 대상)\u003c/span> : [for + 명사] (~을 위한) : \"Harry를 위한\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"There was, 있었습니다. a jacket, 재킷이. for Harry, Harry를 위한. 이 문장 전체를 해석하면, Harry를 위한 재킷이 있었습니다.","hl":"m"},{"n":41,"text":"이 문장은 앞에서 Harry가 상자를 열고 안을 들여다본 결과를 알려 주는 문장이에요. 상자 안에 무엇이 있었는지 처음으로 소개하는 거죠. 여기서 나온 jacket이 바로 다음 문장의 it이 가리키는 대상이니까 꼭 기억해 두세요.","hl":"mn"},{"n":42,"text":"첫 번째로 There was를 보세요. 무엇이 있다고 말할 때 there를 문장 앞에 세우고 be동사를 쓰는 유도부사 구문이에요. 진짜 주어는 뒤에 있는 a jacket이고, 그래서 be동사도 was가 된 거예요. 두 번째로 for Harry를 보세요. for는 ~을 위해, ~을 위한이라는 뜻으로 이익의 대상을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">&quot;I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 정말 마음에 들어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">love\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 그것이 정말 마음에 들어!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선물을 확인한 Harry가 감탄하듯 기쁨을 표현하는 \u003cb class=\"key\">감탄\u003c/b>의 말이에요. it은 앞 문장의 a jacket을 받는 \u003cb class=\"key\">대명사\u003c/b>로, ‘그 재킷이 정말 마음에 들어!’라는 뜻이죠. 짧은 한마디지만 Harry의 \u003cb class=\"key\">만족감\u003c/b>이 확실히 드러나서 이야기 분위기가 밝아지는 지점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 동사(3형식)\u003c/span> : 주어 + love + [목적어] : \"정말 마음에 들어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 it(앞에 나온 명사 받기)\u003c/span> : [it] = 앞 문장의 a jacket : \"그것이\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I, 나는. love it!, 그것이 정말 마음에 들어. 이 문장 전체를 해석하면, “나는 그것이 정말 마음에 들어!”","hl":"m"},{"n":44,"text":"이 문장은 선물을 확인한 Harry가 감탄하듯 기쁨을 표현하는 말이에요. 여기서 it은 바로 앞 문장에 나온 a jacket을 가리키고요. 짧은 한마디지만 Harry의 만족감이 확실하게 드러나서 이야기 분위기가 아주 밝아지는 지점이에요.","hl":"mn"},{"n":45,"text":"먼저 love를 보세요. 아주 좋아하다, 마음에 들어 하다는 감정을 나타내는 동사라서 뒤에 좋아하는 대상이 목적어로 와요. 그리고 it은 앞 문장의 a jacket을 다시 가리키는 대명사예요. 같은 말을 반복하지 않으려고 it으로 받은 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 재킷을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">jacket\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 그 재킷을 입었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기쁜 마음을 행동으로 옮기는 장면이에요. put on은 ‘입다’라는 뜻의 \u003cb class=\"key\">구동사\u003c/b>로, Harry가 실제로 재킷을 걸친다는 \u003cb class=\"key\">행동\u003c/b>을 보여 주죠. 이 행동 뒤에 친구들의 포옹이 이어지면서 \u003cb class=\"key\">우정\u003c/b>을 확인하는 따뜻한 흐름으로 넘어가요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 put on(입다)\u003c/span> : put + on + [옷] (입다) : \"입었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the(앞에 나온 명사 지칭)\u003c/span> : the + [앞에 언급된 명사] : \"그 재킷을\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Harry, Harry는. put on, 입었습니다. the jacket, 그 재킷을. 이 문장 전체를 해석하면, Harry는 그 재킷을 입었습니다.","hl":"m"},{"n":47,"text":"이 문장은 기쁜 마음을 행동으로 옮기는 장면이에요. Harry가 실제로 재킷을 걸친다는 행동을 보여 주죠. 이렇게 입자마자 친구들이 안아 주니까 우정을 확인하는 따뜻한 흐름으로 이어져요.","hl":"mn"},{"n":48,"text":"첫 번째로 put on을 보세요. put과 on이 만나서 입다라는 새로운 뜻을 만든 구동사예요. 목적어가 대명사일 때는 put it on처럼 on을 뒤로 보낸다는 것도 같이 기억해 두세요. 두 번째로 the jacket을 보세요. 앞에서 a jacket이라고 처음 나왔으니까 다시 말할 때는 the를 붙여서 그 재킷이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 반 친구들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">classmates\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry를 껴안았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hugged \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 모든 반 친구들이 Harry를 껴안았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 케이크와 재킷으로 축하를 받은 Harry에게, 이번에는 친구들이 직접 몸으로 마음을 전하는 장면이에요. \u003cb class=\"key\">껴안기\u003c/b>라는 따뜻한 행동이 글의 분위기를 완전히 바꿔 놓죠. Harry가 외로움에서 벗어나는 \u003cb class=\"key\">전환점\u003c/b>이 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한정사 all + 정관사 the + 복수명사\u003c/span> : all + the + [복수명사] → 「모든 ~들」 : \"모든 반 친구들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 + 목적어\u003c/span> : hugged [타동사 과거형] + Harry [목적어] : \"Harry를 껴안았습니다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Then, 그러고 나서. all the classmates, 모든 반 친구들이. hugged Harry, Harry를 껴안았습니다. 이 문장 전체를 해석하면, 그러고 나서 모든 반 친구들이 Harry를 껴안았습니다.","hl":"m"},{"n":50,"text":"이 문장은 친구들이 Harry를 껴안아 주는 장면을 보여 줘요. 앞에서 케이크와 재킷으로 축하해 준 흐름이 껴안기라는 따뜻한 행동으로 이어지죠. 그래서 Harry의 마음이 풀리는 장면의 시작이라고 볼 수 있어요.","hl":"mn"},{"n":51,"text":"첫 번째로 all the classmates를 보세요. all은 한정사이고 그 뒤에 정관사 the를 붙여서 모든 반 친구들이라는 뜻을 만들어요. 두 번째로 hugged Harry를 보세요. hug는 껴안다라는 타동사라서 뒤에 껴안는 대상을 목적어로 바로 붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복한 미소가\u003c/span>\u003cspan class=\"en\">A happy smile\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번졌습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spread\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry의 얼굴에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Harry's \u003c/span>\u003cspan class=\"tgt\">face\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">행복한 미소가 Harry의 얼굴에 번졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉으로 드러난 표정을 통해 Harry의 마음 상태를 보여 주는 문장이에요. \u003cb class=\"key\">미소\u003c/b>가 얼굴에 번진다는 표현은 기쁨이 안에서 밖으로 퍼져 나오는 모습을 그린 거죠. 앞 문장의 껴안기와 이어지며 장면이 따뜻하게 마무리됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사의 과거형(spread-spread-spread)\u003c/span> : A happy smile [주어] + spread [자동사 과거형] + on Harry's face [부사구] : \"번졌습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on + 소유격\u003c/span> : spread on + [Harry's face (소유격 + 명사)] : \"Harry의 얼굴에\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"A happy smile, 행복한 미소가. spread, 번졌습니다. on Harry's face, Harry의 얼굴에. 이 문장 전체를 해석하면, 행복한 미소가 Harry의 얼굴에 번졌습니다.","hl":"m"},{"n":53,"text":"이 문장은 Harry가 이제 외롭지 않다는 사실을 얼굴 표정으로 보여 줘요. 미소가 얼굴에 번진다는 표현은 감정이 겉으로 드러나는 모습을 그린 거죠. 앞 문장의 껴안기와 이어져서 장면이 아주 따뜻하게 마무리돼요.","hl":"mn"},{"n":54,"text":"먼저 spread를 보세요. spread는 원형과 과거형과 과거분사가 모두 같은 불규칙 동사라서 여기서는 과거형으로 쓰였어요. 그리고 주어인 미소가 스스로 번지는 자동사로 쓰였죠. 다음으로 on Harry's face를 보세요. 미소가 번지는 장소를 나타낼 때는 전치사 on을 쓰고, Harry's처럼 소유격으로 누구의 얼굴인지 밝혀 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외롭지 않았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">lonely\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 더 이상 외롭지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 결말을 한 문장으로 정리하는 부분이에요. 친구들의 관심과 우정이 결국 Harry의 \u003cb class=\"key\">외로움\u003c/b>을 없애 줬다는 뜻이죠. 앞선 사건들이 모두 이 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 위해 쌓여 왔다는 걸 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(주격보어)\u003c/span> : He [주어] + wasn't [be동사 과거 부정] + lonely [주격보어] : \"외롭지 않았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서의 anymore(더 이상 ~않다)\u003c/span> : not + [동사] + anymore → 「더 이상 ~하지 않다」 : \"더 이상\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"He, 그는. wasn't lonely, 외롭지 않았습니다. anymore, 더 이상. 이 문장 전체를 해석하면, 그는 더 이상 외롭지 않았습니다.","hl":"m"},{"n":56,"text":"이 문장은 글 전체의 결말이에요. Harry가 이제는 더 이상 외롭지 않다는 상태 변화를 딱 한 문장으로 정리해 주죠. 앞에서 친구들이 보여 준 관심과 우정이 결국 Harry의 외로움을 없애 줬다는 뜻이에요.","hl":"mn"},{"n":57,"text":"첫 번째로 wasn't lonely를 보세요. lonely는 외롭다는 뜻의 형용사라서 be동사 뒤에서 주어 He의 상태를 설명하는 주격보어로 쓰여요. lonely는 ly로 끝나지만 부사가 아니라 형용사라는 점을 꼭 기억해 두세요. 두 번째로 anymore를 보세요. anymore는 부정문에서 더 이상 이전과 달리 않다는 뜻으로, 달라진 현재 상태를 강조하는 부사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>곧 반 친구들이 Harry를 불러 밖으로 나가게 했고, 그때 친구들은 그를 \u003cb class=\"key\">기다리고\u003c/b> 있었습니다.\u003c/li>\u003cli>친구들은 \u003cb class=\"key\">스펀지\u003c/b> 재킷을 입은 채 생일을 축하하며 Ruby가 Harry에게 \u003cb class=\"key\">상자\u003c/b>를 주었습니다.\u003c/li>\u003cli>상자 안에는 Harry를 위한 \u003cb class=\"key\">재킷\u003c/b>이 있었고, 그는 그것을 입고 매우 \u003cb class=\"key\">만족해\u003c/b> 했습니다.\u003c/li>\u003cli>모든 친구들이 Harry를 껴안자 행복한 \u003cb class=\"key\">미소\u003c/b>가 번졌고, 그는 더 이상 \u003cb class=\"key\">외롭지\u003c/b> 않았습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Harry's classmates surprise him on his birthday with a sponge jacket and hugs, which makes him feel no longer lonely.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 반 친구들이 Harry를 불러 밖으로 나가게 하고, \u003cb class=\"key\">생일\u003c/b>을 맞아 \u003cb class=\"key\">스펀지\u003c/b> 재킷을 선물하며 함께 \u003cb class=\"key\">껴안아\u003c/b> 준다. 그 관심 덕분에 Harry는 더 이상 \u003cb class=\"key\">외롭지\u003c/b> 않게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"오늘 지문은 친구들의 부름에서 시작해 선물과 포옹으로 끝나는 따뜻한 이야기였어요. 사건은 시간 순서대로 이어지고, 결론은 마지막 문장에 나오는 미괄식 구조였죠. 핵심은 선물 자체가 아니라 나를 챙겨 주는 친구들이 있다는 사실이 Harry의 외로움을 없앴다는 점이에요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
