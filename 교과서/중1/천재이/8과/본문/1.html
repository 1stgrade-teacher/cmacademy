<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(이) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(이) 8과 본문1","audioDir":"1_audio","preview":false,"count":61,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(이)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Harry's First Day and the Flat Soccer Ball\u003c/h1>\u003ch2>Harry의 첫날과 터진 축구공\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새 학교 첫날 \u003cb class=\"key\">친구\u003c/b>를 많이 사귀고 싶어 하던 Harry가 점심시간 축구에서 \u003cb class=\"key\">가시\u003c/b>로 공을 터뜨리고, 결국 친구들이 운동장을 떠나 \u003cb class=\"key\">혼자\u003c/b> 남게 되는 이야기.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Harry, excited for his first day at a new school and eager to make friends, accidentally popped the soccer ball with his spines and was left alone.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 중학교 일학년 천재 이재영 교과서 여덟 과 본문 첫 번째 이야기예요. 새 학교 첫날을 맞은 Harry의 하루를 담고 있죠. Harry는 많은 친구를 사귀고 싶어 했지만, 결국 운동장에 혼자 남게 되는 이야기예요. 오늘은 이 이야기의 흐름과 그 속에 담긴 마음을 함께 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고슴도치(hedgehog)는 등과 옆구리에 날카로운 가시(spines, quills)가 돋아 있는 포유류입니다. 이 가시는 천적(predator)으로부터 자신을 지키는 방어 수단(defense)으로, 위협을 느끼면 몸을 말아 공처럼 됩니다. 그런데 이런 가시는 축구공처럼 공기가 든 물체에 닿으면 구멍을 내기 쉽습니다. 마치 송곳을 든 채로 풍선을 안는 것과 같죠. 새 학교 첫날(first day)은 누구에게나 긴장되는 순간이며, 특히 자신이 남들과 다르다고 느끼는 아이에게는 더 어렵습니다. 이 글은 \u003cb class=\"key\">가시\u003c/b>라는 신체적 특징 때문에 \u003cb class=\"key\">친구\u003c/b> 만들기가 어려워진 Harry의 상황을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 고슴도치, 영어로 hedgehog는 등과 옆구리에 날카로운 가시가 돋아 있는 포유류예요. 이 가시는 천적, 즉 predator로부터 자신을 지키는 방어 수단이고, 위협을 느끼면 몸을 말아 공처럼 되죠. 그런데 이런 가시는 축구공처럼 공기가 든 물체에 닿으면 쉽게 구멍을 내요. 송곳을 든 채로 풍선을 안는 것과 같은 거예요. 그리고 새 학교 첫날은 누구에게나 긴장되는 순간이에요. 특히 자기 자신이 남들과 다르다고 느끼는 친구에게는 더 어렵죠. 이 글은 바로 그런 Harry의 상황을 보여 준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>설렘\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Harry는 새 학교 첫날이라 매우 \u003cb class=\"key\">신이 \u003c/b>\u003cb class=\"key\">났습니다\u003c/b>. 그는 학교로 가는 길에 '많은 \u003cb class=\"key\">친구\u003c/b>를 사귀고 싶다'고 생각했습니다. 이 세 문장이 글 전체의 \u003cb class=\"key\">목표\u003c/b>를 세워 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>첫 만남\u003csmall>전개 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>교실에 들어서자 모두가 Harry를 쳐다봤고, 그는 자신을 소개했습니다. 하지만 친구들은 인사 대신 그의 \u003cb class=\"key\">가시\u003c/b>를 \u003cb class=\"key\">호기심\u003c/b>을 갖고 바라봤습니다. 여기서 '다름'이 처음 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>축구 초대\u003csmall>전환 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>점심시간에 반 친구들은 \u003cb class=\"key\">축구\u003c/b>를 하고 있었습니다. 친구들은 Harry에게 join us라며 함께 하자고 했고, 돼지 Peter가 그에게 공을 찼습니다. 친구가 될 기회가 열린 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사고\u003csmall>반례 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>Harry가 공을 잡으려고 점프했을 때, 그의 가시에 공이 닿아 \u003cb class=\"key\">공이 \u003c/b>\u003cb class=\"key\">터져 \u003c/b>\u003cb class=\"key\">버렸습니다\u003c/b>. 친구들은 더 이상 축구를 못 하겠다고 했고, 안으로 들어가자고 말했습니다. 선의의 행동이 \u003cb class=\"key\">사고\u003c/b>로 이어집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결말\u003csmall>결론 · 문장 15–16\u003c/small>\u003c/h4>\u003cp>반 친구들은 \u003cb class=\"key\">운동장\u003c/b>을 떠났고, Harry는 \u003cb class=\"key\">혼자\u003c/b> 남았습니다. 첫날의 기대와 정반대되는 결말로, 글은 여운을 남기며 끝납니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 Harry의 설렘이에요. Harry는 새로운 학교에서의 첫날이라 매우 신이 났어요. 학교로 가는 길에 그는 많은 친구를 사귀고 싶다고 생각했죠. 이 장면이 글 전체의 목표를 세워 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 첫 만남이에요. 그가 교실에 들어갔을 때 모두가 그를 쳐다봤어요. Harry는 안녕, 나는 Harry야, 만나서 반가워라고 말했죠. 그런데 친구들은 인사 대신 그의 가시를 호기심을 갖고 바라봤어요. 여기서 다름이 처음 드러납니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 축구 초대예요. 점심시간에 Harry의 반 친구들은 축구를 하고 있었어요. 친구들이 Harry에게 join us, 우리랑 같이 놀자고 했고, 돼지 Peter가 Harry에게 축구공을 찼죠. 친구가 될 기회가 열린 순간이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 사고예요. Harry가 공을 잡기 위해서 점프했을 때, 공이 터져 버렸어요. 친구들은 더 이상 축구를 못 하겠다고 했고, 안으로 들어가자고 말했죠. 선의의 행동이 사고로 이어진 셈이에요.","hl":"f3"},{"n":8,"text":"마지막 단계는 결말이에요. 반 친구들은 운동장을 떠났고, Harry는 혼자 남았어요. 첫날의 기대와 정반대되는 결말이라서 더 안타깝게 느껴지죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Harry의 첫날을 시간의 흐름에 따라 따라가는 \u003cb class=\"key\">시간순\u003c/b> 전개 방식입니다. 첫날 아침의 설렘에서 점심시간의 사건, 운동장을 떠나는 결말로 이어지죠. 주제가 마지막 문장에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 마지막 문장의 \u003cb class=\"key\">혼자\u003c/b> 남은 모습이 다름에서 오는 소외라는 주제를 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On his way to school (3)\u003c/b>\u003cspan>시간·장소 이동 표시\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>시간 부사절 표시\u003c/span>\u003cb>At lunchtime (8)\u003c/b>\u003cspan>시간 전환 신호\u003c/span>\u003cb>When (11)\u003c/b>\u003cspan>사건 발생 순간 표시\u003c/span>\u003cb>anymore (13)\u003c/b>\u003cspan>부정적 결과 강조\u003c/span>\u003cb>left (15)\u003c/b>\u003cspan>행동 결과(이탈)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">everyone looked at him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They looked at his spines curiously\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">We can't play soccer anymore\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The classmates left the playground\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Harry was alone\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순이에요. Harry의 하루를 첫날 아침부터 점심시간, 그리고 운동장을 떠나는 순간까지 순서대로 따라가죠. 그리고 주제가 마지막에 드러나는 미괄식 구조예요. 마지막 문장에서 Harry가 혼자 남았다는 사실이 이 이야기의 핵심을 보여 준답니다.","hl":"ty"},{"n":10,"text":"시간의 흐름을 알려 주는 신호어들을 눈여겨보세요. 첫 번째 문장의 on his way to school, 그리고 when he entered the classroom이 장면을 이동시켜 주죠. at lunchtime은 아침에서 점심으로 시간을 확 넘겨 줍니다. 또 두 번째 when이 사고가 일어난 순간을 정확히 짚어 주고, anymore는 더 이상 축구를 못 한다는 부정적 결과를 강조해요. 마지막으로 left와 alone이 남겨진 결과를 보여 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>excited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신이 난, 들뜬\u003c/span>\u003c/div>\u003cdiv>\u003cb>first day\u003c/b>\u003cem>명사\u003c/em>\u003cspan>첫날\u003c/span>\u003c/div>\u003cdiv>\u003cb>new school\u003c/b>\u003cem>명사\u003c/em>\u003cspan>새 학교\u003c/span>\u003c/div>\u003cdiv>\u003cb>on one's way to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 가는 길에\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>want to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하고 싶어 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make friends\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>친구를 사귀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>classroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교실\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모두, 모든 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 쳐다보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Nice to meet you\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>만나서 반가워\u003c/span>\u003c/div>\u003cdiv>\u003cb>spine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가시, 등뼈\u003c/span>\u003c/div>\u003cdiv>\u003cb>curiously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>호기심 있게\u003c/span>\u003c/div>\u003cdiv>\u003cb>lunchtime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점심시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>play soccer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>축구를 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함께하다, 합류하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kick\u003c/b>\u003cem>동사\u003c/em>\u003cspan>차다\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>jump\u003c/b>\u003cem>동사\u003c/em>\u003cspan>점프하다, 뛰어오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go flat\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>터지다, 바람이 빠지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>안으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>playground\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동장\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혼자인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚어 볼게요. excited는 신이 난이라는 뜻이고, enter는 들어가다, leave는 떠나다라는 뜻이에요. 또 catch는 잡다, join은 함께하다라는 뜻이고, alone은 혼자인이라는 뜻이죠. go flat은 공이 터지거나 바람이 빠지다는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">excited\u003c/b>\u003cspan class=\"m\">신이 난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilled\u003c/span>\u003cspan class=\"s\">eager\u003c/span>\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">bored\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enter\u003c/b>\u003cspan class=\"m\">들어가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">come in\u003c/span>\u003cspan class=\"s\">go in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">exit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">join\u003c/b>\u003cspan class=\"m\">합류하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take part in\u003c/span>\u003cspan class=\"s\">participate in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">quit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">catch\u003c/b>\u003cspan class=\"m\">잡다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grab\u003c/span>\u003cspan class=\"s\">seize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">drop\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">떠나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depart\u003c/span>\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">arrive\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alone\u003c/b>\u003cspan class=\"m\">혼자의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">by oneself\u003c/span>\u003cspan class=\"s\">lonely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">together\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">curiously\u003c/b>\u003cspan class=\"m\">호기심 있게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interestedly\u003c/span>\u003cspan class=\"s\">wonderingly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifferently\u003c/span>\u003cspan class=\"a\">uninterestedly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. excited는 thrilled, eager와 비슷하고 calm, bored와 반대예요. enter는 come in, go in과 가깝고 leave, exit와 반대죠. catch는 grab, seize와 비슷하고 drop, release와 반대이고요. leave는 depart, go away와 가깝고 arrive, stay와 반대예요. 마지막으로 alone은 by oneself, lonely와 비슷하고 together, accompanied와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 신이 났습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">excited\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 매우 신이 났습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작으로, 새 학교에 가는 해리의 \u003cb class=\"key\">들뜬 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 보여 주는 문장이에요. excited는 '흥분한'보다 여기서는 '\u003cb class=\"key\">신이 \u003c/b>\u003cb class=\"key\">난\u003c/b>', '들뜬'이라는 상태의 뜻으로 쓰였죠. 뒤에 이어질 사건들의 \u003cb class=\"key\">분위기\u003c/b>를 미리 알려 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사의 형용사적 용법\u003c/span> : [주어 Harry] + be동사 was + [과거분사 excited] : \"매우 신이 났습니다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Harry, Harry는. was very excited, 매우 신이 났습니다.. 이 문장 전체를 해석하면, Harry는 매우 신이 났습니다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 시작이에요. 해리가 새 학교에 가는 날, 마음이 얼마나 들떠 있었는지를 보여 주는 장면이죠. excited는 여기서 흥분한이 아니라 신이 난, 들뜬이라는 상태의 뜻 학교에서의 그의 첫날이었습니다.","hl":"m"},{"n":17,"text":"여기서 It은 앞에 나온 특정 명사를 가리키는 게 아니라 그날이라는 상황 전체를 가리키는 비인칭 대명사예요. 새로운 학교에서 보내는 첫날이라는 배경을 알려 주는 문장이죠.","hl":"mn"},{"n":18,"text":"먼저 It은 특정 명사가 아니라 상황을 가리키는 비인칭 대명사라는 점을 기억하세요. 그리고 his first day at a new school을 보시면 소유격 his와 서수 first가 명사 day를 앞에서 꾸미고 있어요. 뒤에 오는 전치사구 at a new school은 앞의 명사 day를 뒤에서 꾸며 주는 후치 수식이에요. 이렇게 명사 뒤에 전치사구가 오면 앞의 명사를 뒤에서 설명한다고 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교로 가는 길에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각했습니다\u003c/span>\u003cspan class=\"en\">he thought,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'나는 만들고 싶어요\u003c/span>\u003cspan class=\"en\">'\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 친구를'\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span>.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교로 가는 길에 그는 ‘많은 친구를 사귀고 싶어.’라고 생각했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해리가 학교로 가면서 마음속으로 \u003cb class=\"key\">바람\u003c/b>을 품는 장면이에요. make friends는 '친구를 만들다'가 아니라 '\u003cb class=\"key\">친구를 \u003c/b>\u003c class=\"tgt\">classroom\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가\u003c/span>\u003cspan class=\"en\">everyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 쳐다봤습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 교실에 들어갔을 때, 모두 그를 쳐다봤습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Harry가 교실에 들어섰을 때 반 친구들 \u003cb class=\"key\">모두\u003c/b>가 그를 쳐다본 장면을 보여 줘요. 새 학교 첫날이라 긴장한 Harry에게 시선이 한꺼번에 쏠린 거죠. \u003cb class=\"key\">everyone\u003c/b>은 '모두'라는 뜻이고 \u003cb class=\"key\">him\u003c/b>은 앞에 나온 Harry를 가리킨다는 점도 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : [When + 주어 + 동사 ~], 주어 + 동사 : \"그가 교실에 들어갔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 look + 전치사 at 구문\u003c/span> : look at + [목적어] : \"그를 쳐다봤습니다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"When he entered, 그가 들어갔을 때. the classroom, 교실에. everyone, 모두가. looked at him, 그를 쳐다봤습니다. 이 문장 전체를 해석하면, 그가 교실에 들어갔을 때, 모두 그를 쳐다봤습니다.","hl":"m"},{"n":23,"text":"이 문장은 Harry가 교실에 들어섰을 때 반 친구들 모두가 그를 쳐다본 장면을 보여 줘요. 새 학교 첫날이라 긴장한 Harry에게 시선이 한꺼번에 쏠린 거죠. everyone은 모두라는 뜻이고, him은 앞에 나온 Harry를 가리킨다는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":24,"text":"첫 번째로 짚을 부분은 When he entered the classroom이에요. 여기서 when은 시간 부사절을 이끄는 접속사예요. 언제 그 일이 일어났는지 알려 주는 역할을 하죠. 두 번째로 짚을 부분은 looked at him이에요. look은 목적어를 바로 데려가지 못하는 자동사라서, 전치사 at을 붙여 동사구 look at을 만들고 그 뒤에 목적어 him을 데려온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는 말했습니다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Harry \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕,\u003c/span>\u003cspan class=\"en\">&quot;Hi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Harry야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 “안녕, 나는 Harry야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Harry가 교실에 들어간 뒤 친구들에게 \u003cb class=\"key\">자기소개\u003c/b>를 시작하는 장면이에요. '안녕'이라고 \u003cb class=\"key\">인사\u003c/b>하면서 자기 이름을 밝히는 아주 기본적인 표현이죠. 바로 앞에서 친구를 많이 사귀고 싶다고 생각한 Harry의 마음이 그대로 드러나는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법(say + 인용문)\u003c/span> : [주어] + said, &quot;[인용 내용]&quot; : \"Harry는 말했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 현재형 축약(I am → I'm)\u003c/span> : [주어] + am/is/are + [보어] : \"나는 Harry야\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Harry said, Harry는 말했습니다. \"Hi, 안녕. I'm Harry, 나는 Harry야. 이 문장 전체를 해석하면, Harry는 “안녕, 나는 Harry야.","hl":"m"},{"n":26,"text":"이 문장은 Harry가 교실에 들어간 뒤 친구들에게 자기소개를 시작하는 장면이에요. 안녕이라고 인사하면서 자기 이름을 밝히는 아주 기본적인 인사 표현이죠. 바로 앞에서 친구를 많이 사귀고 싶다고 생각한 Harry의 마음이 그대로 드러나는 부분이에요.","hl":"mn"},{"n":27,"text":"첫 번째로, Harry said는 직접화법이에요. 남이 한 말을 그대로 옮길 때는 say 뒤에 큰따옴표를 열고 그 내용을 그대로 붙여 주면 돼요. 두 번째로, I'm Harry에서 I'm은 I am이 줄어든 축약형이에요. 주어 I 뒤에 be동사 am이 오고, 그 뒤에 Harry가 주격 보어로 와서 내가 누구인지 알려 주는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반가워요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만나서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet \u003c/span>\u003cspan class=\"tgt\">you.\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만나서 반가워.”라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Harry가 자기 이름을 말한 뒤 이어서 하는 \u003cb class=\"key\">인사 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요. 처음 만난 사람에게 하는 가장 기본적인 \u003cb class=\"key\">인사말\u003c/b>이죠. '만나서 반가워요'라는 뜻으로, 새 친구에게 다가가는 Harry의 \u003cb class=\"key\">친근함\u003c/b>이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It is ~ to ... 구문에서 가주어 it이 생략된 인사 표현\u003c/span> : It is nice to meet you → Nice to meet you : \"만나서 반가워요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : [감정 형용사 nice] + to부정사 + [목적어 you] : \"만나서\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Nice, 반가워요. to meet you, 만나서. 이 문장 전체를 해석하면, 만나서 반가워.”라고 말했습니다.","hl":"m"},{"n":29,"text":"이 문장은 Harry가 자기 이름을 말한 뒤 이어서 하는 인사 표현이에요. 처음 만난 사람에게 하는 가장 기본적인 인사말이죠. 만나서 반가워요라는 뜻으로, 새 친구에게 다가가는 친근함이 담겨 있어요. 학생용 해석에서 뒤에 붙은 라고 말했습니다는 앞 문장의 said에 연결된다는 점도 알아 두세요.","hl":"mn"},{"n":30,"text":"먼저, 이 표현은 원래 It is nice to meet you인데, 인사말에서는 가주어 it과 be동사가 생략된 형태예요. 그래서 Nice to meet you만 남은 거죠. 그리고 nice는 감정 형용사예요. 감정 형용사 뒤에 to부정사가 오면 왜 그런 감정을 느끼는지, 즉 감정의 원인을 알려 줘요. 여기서는 만나서 반갑다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바라봤습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 가시를\u003c/span>\u003cspan class=\"en\">his spines\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호기심을 갖고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">curiously\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그의 가시를 호기심을 갖고 바라봤습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry가 교실에 들어갔을 때 반 친구들이 말을 걸기보다 먼저 그의 \u003cb class=\"key\">가시\u003c/b>에 시선을 뺏긴 장면이에요. 아직 Harry가 낯설다는 \u003cb class=\"key\">분위기\u003c/b>를 보여 주는 대목이죠. curiously는 나쁜 뜻이 아니라 '신기해서, 궁금해서'라는 뜻에 가까워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(look at + 목적어)\u003c/span> : look [자동사] + at [전치사] + his spines [목적어] : \"그의 가시를 바라봤습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사(동사 수식)\u003c/span> : [동사 looked at] + [부사 curiously] : \"호기심을 갖고\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"They, 그들은. looked at, 바라봤습니다. his spines, 그의 가시를. curiously, 호기심을 갖고. 이 문장 전체를 해석하면, 그들은 그의 가시를 호기심을 갖고 바라봤습니다.","hl":"m"},{"n":32,"text":"여기는 Harry가 교실에 들어간 직후 장면이에요. 친구들이 말을 걸기 전에 먼저 그의 가시를 쳐다봤죠. 이건 아직 Harry가 낯설다는 분위기를 보여 주는 거예요. 그리고 curiously는 나쁜 뜻이 아니라 신기해서, 궁금해서 쳐다봤다는 느낌이에요.","hl":"mn"},{"n":33,"text":"첫 번째, look at은 그냥 look만 쓰면 안 되고 전치사 at을 꼭 붙여야 뒤에 보는 대상이 와요. 두 번째, curiously는 동사 looked at을 꾸며 주는 부사예요. 그래서 어떻게 바라봤는지, 호기심 있게 바라봤다고 설명해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점심시간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">At \u003c/span>\u003cspan class=\"tgt\">lunchtime\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry의 반 친구들은\u003c/span>\u003cspan class=\"en\">Harry's classmates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구를 하고 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">playing\u003c/span> soccer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">점심시간에 Harry의 반 친구들은 축구를 하고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 점심시간에 반 친구들이 이미 축구를 \u003cb class=\"key\">진행\u003c/b> 중이던 상황을 그린 문장이에요. 그래서 Harry가 나중에 그 놀이에 끼어들게 되는 \u003cb class=\"key\">배경\u003c/b>이 되어 줍니다. 과거진행형을 써서 '그때 하고 있었다'는 장면이 생생하게 살아나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 전치사구\u003c/span> : At + [시간 명사 lunchtime] : \"점심시간에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형(be동사 + -ing)\u003c/span> : [주어 Harry's classmates] + [were] + [playing (현재분사)] : \"하고 있었습니다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"At lunchtime, 점심시간에. Harry's classmates, Harry의 반 친구들은. were playing soccer, 축구를 하고 있었습니다. 이 문장 전체를 해석하면, 점심시간에 Harry의 반 친구들은 축구를 하고 있었습니다.","hl":"m"},{"n":35,"text":"이 문장은 점심시간에 친구들이 이미 축구를 하고 있던 장면을 보여 줘요. 그래서 Harry가 나중에 그 놀이에 끼어드는 배경이 되죠. 과거진행형 덕분에 그때 하고 있었다는 장면이 아주 생생하게 느껴져요.","hl":"mn"},{"n":36,"text":"첫 번째, were playing은 과거진행형이에요. be동사 과거형 were에 동사원형ing를 붙여서 그때 진행 중이던 일을 나타내요. 두 번째, At lunchtime에서 at은 특정한 시점을 표시하는 전치사예요. 그래서 점심시간에라는 때를 정확히 찍어 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry야,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리랑 같이 놀자!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">join \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“Harry, 우리랑 같이 놀자!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Harry를 이름으로 불러 자기들 놀이에 끼워 주는 \u003cb class=\"key\">초대\u003c/b>의 말이에요. 앞에서는 가시만 신기하게 쳐다봤는데, 여기서는 먼저 다가와 함께 놀자고 말을 건네죠. 그래서 이 문장은 친구들이 Harry를 \u003cb class=\"key\">받아들이려는\u003c/b> 마음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">호격(부르는 말)\u003c/span> : [호격 Harry] + [,] + [명령문 join us] : \"Harry야,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 join] + [목적어 us] : \"우리랑 같이 놀자!\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"\"Harry, Harry야. join us!\", 우리랑 같이 놀자!. 이 문장 전체를 해석하면, “Harry, 우리랑 같이 놀자!”","hl":"m"},{"n":38,"text":"이건 친구들이 Harry를 이름으로 불러서 자기들 놀이에 끼워 주는 초대의 말이에요. 앞에서는 가시만 신기하게 쳐다봤는데, 여기서는 먼저 다가와 함께 놀자고 말을 거네요. 그래서 친구들이 Harry를 받아들이려는 마음이 느껴지는 문장이에요.","hl":"mn"},{"n":39,"text":"첫 번째, Harry는 이름을 불러 주의를 끄는 호격이에요. 그래서 뒤에 쉼표를 찍고 목소리를 살짝 올려 읽어요. 두 번째, join us는 주어 You를 생략한 명령문이에요. 동사원형으로 시작하면 우리랑 같이 놀자처럼 권유하는 말이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돼지 Peter가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Peter, \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pig,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구공을 찼습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">kicked \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">soccer \u003c/span>\u003cspan class=\"tgt\">ball \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Harry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돼지 Peter가 Harry에게 축구공을 찼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돼지 Peter가 Harry에게 축구공을 차 준 장면이에요. 이 패스 때문에 Harry가 공을 잡으러 뛰게 되고, 곧바로 공이 터지는 사건으로 이어지는 \u003cb class=\"key\">원인\u003c/b>을 만드는 문장이에요. Peter가 \u003cb class=\"key\">돼지\u003c/b>이고 Harry가 고슴도치라는 설정이 뒤의 사고와 자연스럽게 연결돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마로 이어 주는 동격 표현)\u003c/span> : [고유명사] , [동격 명사구] , : \"돼지인 Peter\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 + 목적어 + to + 사람(전치사 to를 쓰는 구조)\u003c/span> : kick [목적어] to [사람] : \"Harry에게 축구공을 찼습니다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Peter, the pig, 돼지 Peter가. kicked the soccer ball, 축구공을 찼습니다. to Harry, Harry에게. 이 문장 전체를 해석하면, 돼지 Peter가 Harry에게 축구공을 찼습니다.","hl":"m"},{"n":41,"text":"돼지 Peter가 Harry에게 축구공을 차 준 장면이에요. 이 패스 때문에 Harry가 공을 잡으러 뛰게 되고, 바로 다음에 공이 터지는 사건으로 이어지는 원인을 만들어 주는 문장이죠. Peter가 돼지이고 Harry가 고슴도치라는 설정이 뒤의 사고와 자연스럽게 연결돼요.","hl":"mn"},{"n":42,"text":"첫 번째 포인트는 동격이에요. Peter 뒤에 콤마를 찍고 the pig를 붙였죠. Peter가 곧 돼지라는 걸 알려 주는 동격 표현이에요. 두 번째 포인트는 전치사 to예요. kick은 목적어를 하나만 쓰는 삼형식 동사라서, 찬 대상 Harry 앞에 to를 붙여서 kicked the soccer ball to Harry 이렇게 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry가 점프했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Harry \u003c/span>\u003cspan class=\"tgt\">jumped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공을 잡으려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">catch \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공이 터져 버렸습니다\u003c/span>\u003cspan class=\"en\">the ball \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">flat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry가 공을 잡기 위해서 점프했을 때, 공이 터져 버렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Harry가 공을 잡으려고 점프한 순간, 공이 터져 버린 장면이에요. 여기서 flat은 '평평한'이라는 뜻인데, 공에서 바람이 빠져 납작해졌다는 말이에요. 그래서 다음 문장에서 축구를 더 할 수 없게 되는 \u003cb class=\"key\">결과\u003c/b>로 이어지는 핵심 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when(시간 부사절)\u003c/span> : When + [주어] + [동사] , [주절] : \"Harry가 점프했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절 동사] + to + [동사원형] → '~하기 위해서' : \"공을 잡기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">go + 형용사(상태 변화)\u003c/span> : go + [형용사] → '~하게 되다' : \"터져 버렸습니다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"When Harry jumped, Harry가 점프했을 때. to catch the ball, 공을 잡으려고. the ball went flat, 공이 터져 버렸습니다. 이 문장 전체를 해석하면, Harry가 공을 잡기 위해서 점프했을 때, 공이 터져 버렸습니다.","hl":"m"},{"n":44,"text":"Harry가 공을 잡으려고 점프를 했는데, 그 순간 공이 터져 버렸어요. 여기서 flat은 평평하다는 뜻인데, 공에서 바람이 빠져 납작해졌다는 말이죠. 그래서 다음 문장에서 축구를 더 못 하게 되는 결과로 이어지는 아주 중요한 장면이에요.","hl":"mn"},{"n":45,"text":"첫 번째 포인트는 to부정사의 부사적 용법이에요. to catch the ball은 점프를 한 목적을 나타내서 공을 잡기 위해서라고 해석해요. 두 번째 포인트는 go 플러스 형용사예요. went flat은 터져 버렸다라는 뜻으로, 공이 납작해진 상태 변화를 보여 주죠. 세 번째 포인트는 when이 이끄는 시간 부사절이에요. When Harry jumped는 Harry가 점프했을 때라는 시간을 알려 주고, 뒤에 주절이 와서 전체 흐름을 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“오,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;Oh, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안 돼!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">no!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“오, 안 돼!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공이 터진 것을 본 Harry가 놀라서 내지른 말이에요. 바로 뒤의 'We can't play soccer anymore'와 함께, 축구를 계속할 수 없다는 \u003cb class=\"key\">당황\u003c/b>과 \u003cb class=\"key\">아쉬움\u003c/b>을 그대로 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문(느낌을 나타내는 표현)\u003c/span> : [Oh, no!] → [놀람·유감을 나타내는 감탄 표현] : \"오, 안 돼!\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"\"Oh, “오. no!, 안 돼!. 이 문장 전체를 해석하면, “오, 안 돼!","hl":"m"},{"n":47,"text":"공이 터진 걸 본 Harry가 놀라서 내지른 말이에요. 바로 뒤에 이어지는 We can't play soccer anymore와 함께, 축구를 더 못 한다는 당황과 아쉬움을 그대로 담고 있죠.","hl":"mn"},{"n":48,"text":"여기서 짚을 포인트는 감탄문이에요. Oh, no는 주어나 동사 없이 놀람과 유감을 그대로 드러내는 감탄문이죠. 그래서 문장 성분을 따질 필요 없이 오, 안 돼라는 느낌 그대로 받아들이면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~할 수 없다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구를 하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">play\u003c/span> soccer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 더 이상 축구를 못 하겠네.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해리가 공을 찌그러뜨려 축구를 계속할 수 없게 되자, 상황을 알리는 말이에요. \u003cb class=\"key\">anymore\u003c/b>는 '더 이상'이라는 뜻으로 부정문과 함께 쓰여, 이제는 예전처럼 축구를 할 수 없다는 \u003cb class=\"key\">상황 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 강조해요. 이 한마디를 계기로 친구들이 운동장을 떠나는 흐름이 시작돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정 + 동사원형\u003c/span> : can't + [동사원형(play)] : \"~할 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문과 함께 쓰이는 부사 anymore\u003c/span> : [부정문] + anymore → '더 이상 ~않다' : \"더 이상\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"We can't, 우리는 ~할 수 없다. play soccer, 축구를 하다. anymore, 더 이상.. 이 문장 전체를 해석하면, 우리는 더 이상 축구를 못 하겠네.","hl":"m"},{"n":50,"text":"여기는 해리가 공을 찌그러뜨린 뒤에 상황을 알리는 장면이에요. can't는 할 수 없다는 뜻이고, anymore는 더 이상이라는 뜻이라서 두 표현이 만나면 이제는 축구를 계속할 수 없다는 상황 변화를 강조하게 돼요. 바로 이 말을 시작으로 친구들이 운동장을 떠나는 흐름이 이어지니까 흐름을 잘 기억해 두세요.","hl":"mn"},{"n":51,"text":"첫 번째 포인트는 can't play예요. can은 뒤에 동사원형을 데리고 와서 할 수 있다는 뜻을 만들고, 여기에 not이 붙어서 can't 더하기 동사원형, 즉 할 수 없다가 돼요. 두 번째 포인트는 anymore예요. anymore는 부정문 끝에 놓여서 더 이상이라는 뜻을 더해 주니까, can't와 함께 쓰여 더 이상 축구를 못 한다는 의미가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 ~하자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">inside\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안으로 들어가자.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축구를 못 하게 된 상황에서 친구들이 안으로 들어가자고 제안하는 말이에요. \u003cb class=\"key\">Let's\u003c/b>는 '우리 ~하자'라고 상대를 권유하는 \u003cb class=\"key\">청유문\u003c/b>이에요. 이 제안이 다음 문장의 '친구들이 운동장을 떠났습니다'로 이어지면서 장면이 실내로 바뀌게 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's + 동사원형\u003c/span> : Let's + [동사원형(go)] → '우리 ~하자' : \"우리 ~하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 go + 부사 inside\u003c/span> : go + [부사(inside)] : \"안으로 가다, 안으로 들어가다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Let's, 우리 ~하자. go, 가다. inside, 안으로.. 이 문장 전체를 해석하면, 안으로 들어가자.”","hl":"m"},{"n":53,"text":"여기는 축구를 못 하게 된 친구들이 안으로 들어가자고 제안하는 장면이에요. Let's는 우리 하자, 라고 상대를 권유하는 청유문이에요. 이 제안이 바로 다음 문장에서 친구들이 운동장을 떠나는 행동으로 이어지면서 장면이 안쪽으로 바뀌게 되죠.","hl":"mn"},{"n":54,"text":"첫 번째 포인트는 Let's예요. 이건 Let us의 축약형이고, 뒤에 동사원형이 와서 우리 하자, 라는 청유문을 만들어요. 두 번째 포인트는 go inside예요. 여기서 inside는 부사로 쓰여서 안으로, 라는 방향을 나타내고, go 같은 이동 동사 뒤에 붙어 어디로 가는지를 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반 친구들은\u003c/span>\u003cspan class=\"en\">The classmates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운동장을 떠났습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">playground\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반 친구들은 운동장을 떠났습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 안으로 들어가자는 제안을 받아들여 실제로 운동장을 떠난 결과를 알려 주는 문장이에요. \u003cb class=\"key\">left\u003c/b>는 leave의 \u003cb class=\"key\">과거형\u003c/b>으로 '떠났다'라는 뜻이고, \u003cb class=\"key\">운동장\u003c/b>을 떠난 이 행동이 해리만 혼자 남는 다음 장면을 만드는 발판이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 동사 leave의 과거형 + 목적어\u003c/span> : left(leave의 과거형) + [목적어(the playground)] : \"운동장을 떠났다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"The classmates, 반 친구들은. left the playground, 운동장을 떠났습니다. 이 문장 전체를 해석하면, 반 친구들은 운동장을 떠났습니다.","hl":"m"},{"n":56,"text":"여기는 친구들이 안으로 들어가자는 말에 따라 실제로 운동장을 떠난 결과를 알려 주는 문장이에요. left는 leave의 과거형으로 떠났다는 뜻이고, 이 행동 덕분에 다음 장면에서 해리만 혼자 남게 되죠. 글의 흐름에서 해리가 소외되는 분위기를 만드는 중요한 대목이니까 꼭 기억해 두세요.","hl":"mn"},{"n":57,"text":"여기서 봐야 할 건 left the playground예요. leave는 떠나다는 뜻의 타동사인데, 과거형이 left로 불규칙하게 바뀌어요. 그래서 left 뒤에 목적어 the playground가 와서 운동장을 떠났다, 라는 뜻이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harry는\u003c/span>\u003cspan class=\"en\">Harry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼자였습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">alone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Harry는 혼자였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 친구들이 모두 교실로 들어간 뒤 \u003cb class=\"key\">Harry\u003c/b>만 \u003cb class=\"key\">운동장\u003c/b>에 남았다는 뜻이에요. 앞에서 공이 펑크 나 축구를 못 하게 된 사건 때문에 Harry는 \u003cb class=\"key\">소외\u003c/b>되고 \u003cb class=\"key\">외로움\u003c/b>을 느끼게 되죠. 그래서 이 문장은 Harry의 쓸쓸한 \u003cb class=\"key\">상황\u003c/b>을 마무리하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 과거형\u003c/span> : 주어 + was/were + 주격보어 : \"~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격보어로 쓰인 형용사\u003c/span> : 주어 + be동사 + [형용사(주격보어)] : \"혼자인, 홀로인\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"Harry, Harry는. was alone, 혼자였습니다. 이 문장 전체를 해석하면, Harry는 혼자였습니다.","hl":"m"},{"n":59,"text":"이 문장은 친구들이 모두 교실로 들어간 뒤 Harry만 운동장에 남았다는 뜻이에요. 앞에서 공이 펑크 나서 축구를 못 하게 된 사건 때문에 Harry는 소외되고 외로움을 느끼게 되죠. 그래서 이 문장은 Harry의 쓸쓸한 상황을 마무리하는 역할을 해요.","hl":"mn"},{"n":60,"text":"어법 포인트도 짚어 볼게요. 첫 번째는 was예요. Harry가 과거에 어떤 상태였는지 말할 때 be동사의 과거형 was를 써요. 주어가 단수이고 시제가 과거이기 때문이죠. 두 번째는 alone이에요. alone은 혼자라는 상태를 나타내는 형용사로, be동사 was 뒤에서 주어 Harry의 상태를 설명하는 주격보어 역할을 해요. 그래서 be동사 뒤에 형용사가 오는 문장 구조가 된다는 점도 같이 기억해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Harry는 새 학교 \u003cb class=\"key\">첫날\u003c/b>이라 매우 신이 났고 많은 친구를 사귀고 싶어 했습니다.\u003c/li>\u003cli>교실에 들어가자 모두가 그를 쳐다봤고, 친구들은 그의 \u003cb class=\"key\">가시\u003c/b>를 호기심 있게 바라봤습니다.\u003c/li>\u003cli>점심시간 축구에서 Peter가 공을 찼고, Harry가 공을 잡으려 점프하자 \u003cb class=\"key\">공이 \u003c/b>\u003cb class=\"key\">터져 \u003c/b>\u003cb class=\"key\">버렸습니다\u003c/b>.\u003c/li>\u003cli>친구들은 더 이상 축구를 못 하게 되어 운동장을 떠났고, Harry는 \u003cb class=\"key\">혼자\u003c/b> 남았습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Harry, excited for his first day at a new school and eager to make friends, accidentally popped the soccer ball with his spines and was left alone.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새 학교 첫날 \u003cb class=\"key\">친구\u003c/b>를 많이 사귀고 싶어 하던 Harry가 점심시간 축구에서 \u003cb class=\"key\">가시\u003c/b>로 공을 터뜨리고, 결국 친구들이 운동장을 떠나 \u003cb class=\"key\">혼자\u003c/b> 남게 되는 이야기.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":61,"text":"오늘 이야기를 한번 정리해 볼게요. Harry는 새 학교 첫날 친구를 많이 사귀고 싶어 했어요. 하지만 자신의 가시 때문에 공이 터지고, 결국 친구들이 떠나면서 혼자 남게 되죠. 남들과 다른 점이 때로는 예상치 못한 사고를 부를 수 있다는 점을 보여 주는 이야기예요. 그럼 오늘 수업은 여기까지, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
