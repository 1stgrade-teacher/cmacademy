<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch2 Unit 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch2 Unit 02","audioDir":"2-02_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch2\u003cbr>Unit\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>The Poison Apple Mystery\u003c/h1>\u003ch2>독사과의 비밀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 오래 전 사람들은 토마토를 \u003cb class=\"key\">독사과\u003c/b>라 부르며 두려워했어요. 하지만 부유한 사람들이 죽은 진짜 원인은 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>였고, 토마토는 아무 잘못도 하지 않았어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Gist: Tomatoes were called poison apples, but lead plates, not tomatoes, made people sick and die.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분, 오늘은 아주 재미있는 영어 지문을 함께 읽어 볼 거예요. 제목은 Poison Apple, 우리말로는 독사과예요. 이 이야기는 토마토가 억울하게 독사과라는 별명을 얻은 사건을 담고 있어요. 겉보기에는 무서운 제목이지만, 읽고 나면 토마토가 얼마나 억울한지 알게 될 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">오래 전 유럽에서는 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>를 쓰는 사람들이 있었어요. 납은 영어로 lead라고 하고, 몸에 들어오면 아주 위험해요. 그런데 사람들은 접시의 납이 위험한 줄 모르고 토마토만 의심했어요. 음료수는 멀쩡한데 더러운 컵 때문에 배가 아픈 것과 비슷해요. 그래서 토마토는 억울하게 \u003cb class=\"key\">독사과\u003c/b>, 영어로 poison apple이라는 별명을 얻었답니다.\u003c/div>","segs":[{"n":2,"text":"오래 전 유럽에는 납으로 만든 접시를 쓰는 사람들이 있었어요. 납은 영어로 lead라고 하는데, 몸에 들어오면 아주 위험해요. 그런데 사람들은 접시의 납이 위험한 줄 모르고 토마토만 의심했어요. 여러분, 음료수는 멀쩡한데 더러운 컵 때문에 배가 아픈 적 있나요? 그래서 토마토는 억울하게 독사과라는 별명을 얻었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>별명이 생겨요\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>토마토는 \u003cb class=\"key\">밝고 \u003c/b>\u003cb class=\"key\">빛나는 \u003c/b>\u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">열매\u003c/b>예요. 오래 전에는 토마토를 \u003cb class=\"key\">독사과\u003c/b>라고 불렀어요. 별명에 사람들의 걱정이 담겨 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사람들이 두려워해요\u003csmall>문제 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>유럽 사람들은 토마토를 먹지 않았어요. 부유한 사람들이 토마토를 먹고 \u003cb class=\"key\">병이 \u003c/b>\u003cb class=\"key\">들어 \u003c/b>\u003cb class=\"key\">죽자\u003c/b>, 모두가 \u003cb class=\"key\">두려워\u003c/b>했어요. 왜 그랬을까요?\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진짜 원인을 찾아요\u003csmall>이유 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>하지만 사람들의 생각은 \u003cb class=\"key\">틀렸어요\u003c/b>. 부유한 사람들은 토마토를 먹을 때 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>를 사용했어요. 납은 매우 \u003cb class=\"key\">위험\u003c/b>해서 병이 들거나 죽을 수 있고, 그래서 그들은 납 중독으로 죽은 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>토마토는 억울해요\u003csmall>해결 · 문장 14\u003c/small>\u003c/h4>\u003cp>토마토는 아무 \u003cb class=\"key\">잘못\u003c/b>도 하지 않았어요. 억울한 \u003cb class=\"key\">독사과\u003c/b> 별명은 이제 안녕이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 토마토의 별명이에요. 토마토는 밝고 빛나는 빨간 열매인데, 오래 전에는 독사과라고 불렸어요. 참 억울한 별명이죠?","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 사람들이 두려워한 이유를 보여 줘요. 유럽 사람들은 토마토를 먹지 않았어요. 그런데 부유한 사람들이 토마토를 먹고 병이 들어 죽자, 모두가 토마토를 두려워하게 되었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 진짜 원인을 찾아요. 사람들의 생각은 틀렸어요. 부유한 사람들은 토마토를 먹을 때 납 접시를 사용했어요. 납은 매우 위험해서 병이 들거나 죽을 수 있었어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 토마토가 억울하다는 사실을 말해요. 토마토는 아무 잘못도 하지 않았어요. 그래서 독사과라는 별명은 잘못된 이름이었답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">원인-결과\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 14번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 토마토의 별명으로 시작해요. 사람들이 왜 토마토를 두려워했는지 보여 주고, 진짜 원인인 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">중독\u003c/b>을 알려 줘요. 마지막에 \u003cb class=\"key\">토마토\u003c/b>는 잘못이 없다고 정리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Long ago (2)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>생각이 반대임을 알려 줌\u003c/span>\u003cb>when (10)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결과를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Tomatoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bright and shiny red fruit\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">poison apple\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사람들의 생각\u003c/th>\u003cth>진짜 사실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>토마토가 사람을 죽였다\u003c/td>\u003ctd>납 접시가 사람을 죽였다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>토마토는 독사과이다\u003c/td>\u003ctd>토마토는 아무 잘못이 없다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과를 설명하는 글입니다. 중심 문장은 마지막에 있어요. 그래서 끝까지 읽으면 토마토가 억울하다는 결론을 알 수 있답니다.","hl":"ty"},{"n":9,"text":"글을 읽을 때 Long ago나 when 같은 말은 때를 알려 줘요. But은 생각이 반대라는 신호이고, So는 결과를 알려 주는 말이에요. 또 Tomatoes, bright and shiny red fruit, poison apple처럼 같은 토마토를 여러 이름으로 부르고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>bright\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>밝은\u003c/span>\u003c/div>\u003cdiv>\u003cb>shiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빛나는\u003c/span>\u003c/div>\u003cdiv>\u003cb>long ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래 전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>nickname\u003c/b>\u003cem>명사\u003c/em>\u003cspan>별명\u003c/span>\u003c/div>\u003cdiv>\u003cb>poison apple\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>독사과\u003c/span>\u003c/div>\u003cdiv>\u003cb>Europe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유럽\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹었다, eat의 과거형\u003c/span>\u003c/div>\u003cdiv>\u003cb>became\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되었다, become의 과거형\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>병든\u003c/span>\u003c/div>\u003cdiv>\u003cb>died\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽었다, die의 과거형\u003c/span>\u003c/div>\u003cdiv>\u003cb>from then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그때부터\u003c/span>\u003c/div>\u003cdiv>\u003cb>afraid of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 두려워하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead\u003c/b>\u003cem>명사\u003c/em>\u003cspan>납\u003c/span>\u003c/div>\u003cdiv>\u003cb>plate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접시\u003c/span>\u003c/div>\u003cdiv>\u003cb>when\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead poisoning\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>납 중독\u003c/span>\u003c/div>\u003cdiv>\u003cb>do anything wrong\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아무 잘못도 하지 않다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 몇 개 소리 내어 읽어 볼까요? bright는 밝은, shiny는 빛나는, nickname은 별명이라는 뜻이에요. poison apple은 독사과, lead는 납, dangerous는 위험한, lead poisoning은 납 중독이라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">bright\u003c/b>\u003cspan class=\"m\">밝은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shiny\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dark\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">병든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">afraid\u003c/b>\u003cspan class=\"m\">두려워하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scared\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wrong\u003c/b>\u003cspan class=\"m\">틀린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incorrect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dangerous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unsafe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">die\u003c/b>\u003cspan class=\"m\">죽다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pass away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">live\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. bright의 비슷한 말은 shiny이고 반대말은 dark이며, sick은 ill과 비슷하고 healthy와 반대예요. afraid는 scared와 비슷하고 brave와 반대이고, wrong은 incorrect와 비슷하고 right와 반대예요. dangerous는 unsafe와 비슷하고 safe와 반대이며, die는 pass away와 비슷하고 live와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토는 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Tomatoes \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝고 빛나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">shiny\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간 열매예요\u003c/span>\u003cspan class=\"en\">red fruit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">토마토는 밝고 빛나는 빨간 열매입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 토마토가 어떤 모습인지 알려 주는 문장이에요. 글의 \u003cb class=\"key\">주제\u003c/b>인 토마토를 처음 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개일 때 are(be동사)\u003c/span> : 토마토들(Tomatoes) + 이다(are) + 빨간 열매(red fruit) : \"토마토는 빨간 열매예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 밝은(bright) + and + 빛나는(shiny) : \"밝고 빛나는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Tomatoes are, 토마토는 ~입니다. bright and shiny, 밝고 빛나는. red fruit, 빨간 열매예요. 이 문장 전체를 해석하면, 토마토는 밝고 빛나는 빨간 열매입니다.","hl":"m"},{"n":13,"text":"이 문장은 토마토가 어떤 모습인지 알려 줘요. 글의 주제인 토마토를 처음 꺼내는 문장이죠.","hl":"mn"},{"n":14,"text":"첫째, Tomatoes처럼 여러 개를 말할 때는 be동사 are를 써요. 둘째, bright and shiny에서 and는 밝다와 빛난다를 이어 주는 이어 주는 말이에요. 아주 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래 전에,\u003c/span>\u003cspan class=\"en\">Long ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토는 가졌어요\u003c/span>\u003cspan class=\"en\">tomatoes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별명을\u003c/span>\u003cspan class=\"en\">a nickname.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래 전에, 토마토에는 별명이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">전\u003c/b>에 토마토에게 \u003cb class=\"key\">별명\u003c/b>이 있었다는 걸 알려 줘요. 다음에 그 별명이 무엇인지 궁금하게 만들죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 토마토는(tomatoes) + 가졌다(had) + 별명을(a nickname) : \"별명이 있었다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Long ago, 오래 전에. tomatoes had, 토마토는 가졌어요. a nickname, 별명을. 이 문장 전체를 해석하면, 오래 전에, 토마토에는 별명이 있었습니다.","hl":"m"},{"n":16,"text":"오래 전에 토마토에게 별명이 있었다는 걸 알려 줘요. 그래서 다음 문장에서 그 별명이 뭔지 궁금해지죠.","hl":"mn"},{"n":17,"text":"여기서 꼭 기억할 것은 had예요. have의 과거형이 had예요. 오래 전에 있었던 일이라서 had를 써서 별명을 가지고 있었다고 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;독사과&quot;였어요\u003c/span>\u003cspan class=\"en\">&quot;poison apple.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 &quot;독사과&quot;였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 그 \u003cb class=\"key\">별명\u003c/b>이 &quot;독사과&quot;였다는 걸 알려 줘요. 토마토를 무서운 것으로 소개하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그것(It) = 앞에 나온 별명 : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 be동사(be동사 과거형)\u003c/span> : 그것은(It) + 이었다(was) + 독사과(poison apple) : \"그것은 ~였다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It was, 그것은 ~였어요. \"poison apple.\", \"독사과\"였어요. 이 문장 전체를 해석하면, 그것은 \"독사과\"였습니다.","hl":"m"},{"n":19,"text":"바로 그 별명이 독사과였다는 걸 알려 줘요. 토마토를 무서운 것으로 소개하는 부분이죠.","hl":"mn"},{"n":20,"text":"먼저 It은 앞에 나온 별명을 대신하는 말이에요. 같은 말을 또 하지 않으려고 It을 써요. 그리고 지난 일이라서 is 대신 was를 써서 과거 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽에 있는 사람들은\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Europe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토를 먹지 않았어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span> tomatoes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유럽의 사람들은 토마토를 먹지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 유럽 사람들이 토마토를 먹지 않았다고 말해요. 다음에 나올 \u003cb class=\"key\">이유\u003c/b>를 궁금하게 만드는 \u003cb class=\"key\">도입\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 말(전치사)\u003c/span> : 누가(People) + 어디에서(in Europe) : \"유럽에 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하지 않았다고 말하기(부정문)\u003c/span> : 누가(People) + 하지 않았다(didn't eat) + 무엇을(tomatoes) : \"먹지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"People in Europe, 유럽에 있는 사람들은. didn't eat tomatoes, 토마토를 먹지 않았어요.. 이 문장 전체를 해석하면, 유럽의 사람들은 토마토를 먹지 않았습니다.","hl":"m"},{"n":22,"text":"이 문장은 유럽 사람들이 토마토를 먹지 않았다고 말해요. 왜 안 먹었는지 이유가 궁금해지죠? 그래서 이 문장은 이야기의 도입이에요.","hl":"mn"},{"n":23,"text":"첫 번째, in Europe에서 in은 장소를 알려 주는 전치사예요. 그래서 People in Europe은 유럽에 있는 사람들이라는 뜻이에요. 두 번째, didn't eat은 하지 않았다고 말하는 부정문이에요. 이때 didn't 뒤에는 동사원형 eat을 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 먹지 않았을까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">not?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 먹지 않았을까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 유럽 사람들이 토마토를 먹지 않았다고 했죠. 그 \u003cb class=\"key\">이유\u003c/b>를 묻는 짧은 \u003cb class=\"key\">질문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 묻는 짧은 질문(의문문)\u003c/span> : 왜(Why) + 아닌가요(not)? : \"왜 아닌가요?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Why not?, 왜 먹지 않았을까요?. 이 문장 전체를 해석하면, 왜 먹지 않았을까요?","hl":"m"},{"n":25,"text":"앞에서 유럽 사람들이 토마토를 먹지 않았다고 했죠. 그 이유를 묻는 짧은 질문이에요.","hl":"mn"},{"n":26,"text":"Why not은 왜 아닌가요라고 이유를 묻는 짧은 의문문이에요. 아주 짧지만 다음 내용을 궁금하게 만드는 질문이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 부유한 사람들은\u003c/span>\u003cspan class=\"en\">Some \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rich \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토를 먹었어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ate\u003c/span> tomatoes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 부유한 사람들이 토마토를 먹었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유럽 사람들 중 일부 부유한 사람들은 토마토를 먹었어요. 앞의 '먹지 않았다'와 달리 \u003cb class=\"key\">예외\u003c/b>가 있었다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 부유한(rich) + 사람들(people) : \"부유한 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 먹었어요(ate) : \"먹었어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Some rich people, 몇몇 부유한 사람들은. ate tomatoes, 토마토를 먹었어요.. 이 문장 전체를 해석하면, 몇몇 부유한 사람들이 토마토를 먹었습니다.","hl":"m"},{"n":28,"text":"유럽 사람들 중 일부 부유한 사람들은 토마토를 먹었어요. 앞에서는 먹지 않았다고 했는데, 여기서는 예외가 있었다는 걸 보여 줘요.","hl":"mn"},{"n":29,"text":"첫 번째, rich는 부유한이라는 뜻으로 people을 꾸며 주는 형용사예요. 형용사는 명사 앞에서 그 명사를 자세히 알려 줘요. 두 번째, ate는 eat의 과거형이에요. 지난 일이라서 eat이 ate로 바뀐 불규칙 동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 곧\u003c/span>\u003cspan class=\"en\">But soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 병이 들어\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> sick\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 죽었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">died\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 곧 그들은 병이 들어 죽었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 토마토를 먹은 부자들이 \u003cb class=\"key\">아프다가\u003c/b> 결국 \u003cb class=\"key\">죽었다\u003c/b>는 것을 말해요. 사람들이 토마토를 무서워하게 된 \u003cb class=\"key\">까닭\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그들은(they) + 병이 들었다(became sick) : \"병이 들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 아프게 되었다(became sick) + 그리고(and) + 죽었다(died) : \"그리고 죽었어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But soon, 하지만 곧. they became sick, 그들은 병이 들어. and died, 그리고 죽었습니다. 이 문장 전체를 해석하면, 하지만 곧 그들은 병이 들어 죽었습니다.","hl":"m"},{"n":31,"text":"부자들이 토마토를 먹고 아프다가 죽었다는 뜻이에요. 그래서 사람들이 토마토를 무서워하게 된 거예요.","hl":"mn"},{"n":32,"text":"첫 번째, became은 become의 과거형이에요. 지난 일이니까 과거형으로 말해요. 두 번째, and는 이어 주는 말이에요. 병이 들었다는 일과 죽었다는 일을 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때부터\u003c/span>\u003cspan class=\"en\">From then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람이 되었어요\u003c/span>\u003cspan class=\"en\">everyone \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토를 두려워하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">afraid \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">tomatoes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때부터, 모든 사람이 토마토를 두려워하게 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그때부터 모든 사람이 토마토를 \u003cb class=\"key\">무서워하게\u003c/b> 되었다는 말이에요. 부자들이 토마토를 먹고 죽었다고 \u003cb class=\"key\">믿었기\u003c/b> 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 모든 사람이(everyone) + 되었다(became) + 두려워하는(afraid) : \"~이 되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무서움을 나타내는 짝 표현(be afraid of)\u003c/span> : 무서워하는(afraid) + 무엇을(of tomatoes) : \"토마토를 두려워하는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"From then, 그때부터. everyone became, 모든 사람이 되었어요. afraid of tomatoes, 토마토를 두려워하게. 이 문장 전체를 해석하면, 그때부터, 모든 사람이 토마토를 두려워하게 되었습니다.","hl":"m"},{"n":34,"text":"그때부터 모든 사람이 토마토를 무서워하게 되었다는 뜻이에요. 부자들이 토마토를 먹고 죽었다고 믿었기 때문이죠.","hl":"mn"},{"n":35,"text":"첫 번째, became은 become의 과거형이에요. 지난 일이라 과거형으로 말해요. 두 번째, afraid of는 '무서워하는'이라는 짝 표현이에요. afraid 뒤에 of를 꼭 붙여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> they\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">틀렸습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> wrong\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토에 대해\u003c/span>\u003cspan class=\"en\">about tomatoes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들은 토마토에 대해 틀렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 토마토에 대해 \u003cb class=\"key\">잘못 \u003c/b>\u003cb class=\"key\">알고\u003c/b> 있었다는 말이에요. 진짜 원인은 토마토가 아니라는 것을 \u003cb class=\"key\">알려 \u003c/b>\u003cb class=\"key\">주는\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 하지만(But) + 뒤말 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사의 과거형\u003c/span> : 그들은(they) + 이었어요(were) + 틀린(wrong) : \"~이었어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But they, 하지만 그들은. were wrong, 틀렸습니다. about tomatoes, 토마토에 대해. 이 문장 전체를 해석하면, 하지만 그들은 토마토에 대해 틀렸습니다.","hl":"m"},{"n":37,"text":"사람들이 토마토에 대해 잘못 알고 있었다는 뜻이에요. 진짜 원인은 토마토가 아니었죠.","hl":"mn"},{"n":38,"text":"첫 번째, But은 이어 주는 말이에요. 앞말과 반대되는 이야기를 시작할 때 써요. 두 번째, were는 are의 과거형이에요. 지난 일이라 were로 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 부유한 사람들은\u003c/span>\u003cspan class=\"en\">Those rich people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">납 접시를 사용했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used\u003c/span> lead plates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 토마토를 먹었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">ate \u003c/span>\u003cspan class=\"tgt\">tomatoes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 부유한 사람들은 토마토를 먹을 때 납 접시를 사용했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부유한 사람들이 토마토를 먹을 때 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>를 썼다는 걸 알려 줘요. 이 문장은 사람들이 아팠던 진짜 \u003cb class=\"key\">원인\u003c/b>을 밝혀 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 했다(used) + 무엇을(plates) : \"사용했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사 when)\u003c/span> : when + 누가(they) + 했다(ate) + 무엇을(tomatoes) : \"그들이 토마토를 먹었을 때\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Those rich people, 그 부유한 사람들은. used lead plates, 납 접시를 사용했습니다. when they ate tomatoes, 그들이 토마토를 먹었을 때. 이 문장 전체를 해석하면, 그 부유한 사람들은 토마토를 먹을 때 납 접시를 사용했습니다.","hl":"m"},{"n":40,"text":"부유한 사람들이 토마토를 먹을 때 납 접시를 썼다는 걸 알려 줘요. 이 문장은 사람들이 아팠던 진짜 원인을 밝혀 줘요.","hl":"mn"},{"n":41,"text":"첫 번째로 used는 지난 일을 말하는 과거형이에요. 그래서 사용했다는 뜻이에요. 두 번째로 when they ate tomatoes는 그들이 토마토를 먹었을 때라는 뜻이에요. when이 때를 이어 주는 말이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">납은\u003c/span>\u003cspan class=\"en\">Lead \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 위험합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">dangerous\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">납은 매우 위험합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 납이 아주 \u003cb class=\"key\">위험한\u003c/b> 금속이라고 알려 줘요. 앞에서 부유한 사람들이 아팠던 까닭을 \u003cb class=\"key\">납\u003c/b> 때문이라고 이해하게 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사) + 꾸며 주는 말(형용사)\u003c/span> : 무엇이(Lead) + 이다(is) + 매우 위험한(dangerous) : \"매우 위험합니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Lead is, 납은. very dangerous, 매우 위험합니다. 이 문장 전체를 해석하면, 납은 매우 위험합니다.","hl":"m"},{"n":43,"text":"납이 아주 위험한 금속이라고 알려 줘요. 앞에서 부유한 사람들이 아팠던 까닭을 납 때문이라고 이해하게 해 줘요.","hl":"mn"},{"n":44,"text":"여기서 is는 be동사예요. be동사는 이다나 상태를 말해요. dangerous는 형용사라서 위험한이라고 꾸며 줘요. 그래서 납은 매우 위험하다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 ~할 수 있습니다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">병이 들거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">get\u003c/span> sick\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 죽을 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> die.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 병이 들거나 죽을 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 납을 몸에 많이 넣으면 \u003cb class=\"key\">병\u003c/b>이 들거나 \u003cb class=\"key\">죽을\u003c/b> 수 있다고 해요. 그래서 토마토가 아니라 납이 \u003cb class=\"key\">위험\u003c/b>했다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 누가(People) + ~할 수 있다(can) + 되다(get) : \"병이 들 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 or)\u003c/span> : A(get sick) + 또는(or) + B(die) : \"병이 들거나 죽거나\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"People can, 사람들은 ~할 수 있습니다. get sick, 병이 들거나. or die, 또는 죽을 수 있습니다. 이 문장 전체를 해석하면, 사람들은 병이 들거나 죽을 수 있습니다.","hl":"m"},{"n":46,"text":"납을 몸에 많이 넣으면 병이 들거나 죽을 수 있다고 해요. 그래서 토마토가 아니라 납이 위험했다는 걸 알려 줘요.","hl":"mn"},{"n":47,"text":"첫 번째로 can은 도와주는 동사예요. 동사 get 앞에서 할 수 있다라는 뜻을 더해요. 두 번째로 or는 두 가지를 이어 주는 말이에요. 병이 들거나 죽는다처럼 선택을 연결하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그 부유한 사람들은\u003c/span>\u003cspan class=\"en\">So the rich people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">납 중독으로 죽었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">died\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">poisoning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그 부유한 사람들은 납 중독으로 죽은 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부유한 사람들이 죽은 까닭은 토마토가 아니라 \u003cb class=\"key\">납\u003c/b>이었다는 걸 알려 줘요. 그래서 \u003cb class=\"key\">토마토\u003c/b>는 잘못이 없다는 사실이 자연스럽게 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 누가(the rich people) + 했어요(died) : \"죽었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">까닭을 알려 주는 말(전치사)\u003c/span> : 일어난 일(died) + 까닭(from) + 무엇(lead poisoning) : \"납 중독 때문에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So the rich people, 그래서 그 부유한 사람들은. died from lead poisoning, 납 중독으로 죽었어요. 이 문장 전체를 해석하면, 그래서 그 부유한 사람들은 납 중독으로 죽은 것입니다.","hl":"m"},{"n":49,"text":"이 문장은 부유한 사람들이 왜 죽었는지 알려 줘요. 토마토 때문이 아니라 납 때문이었다는 거죠. 그래서 토마토는 잘못이 없다는 사실이 자연스럽게 드러나요.","hl":"mn"},{"n":50,"text":"문법을 하나씩 짚어 볼게요. 첫 번째, died는 지난 일을 말하는 과거형이에요. 오늘 일이면 die지만, 이미 지나간 일이라 died라고 해요. 두 번째, from은 왜 그런 일이 생겼는지 까닭을 알려 주는 말이에요. 그래서 from lead poisoning은 납 중독 때문에, 라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토는 하지 않았어요\u003c/span>\u003cspan class=\"en\">Tomatoes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't\u003c/span> do\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무 잘못도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anything\u003c/span> wrong!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">토마토는 아무 잘못도 하지 않았습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">결론\u003c/b>이에요. 토마토는 아무 잘못도 하지 않았고, 진짜 문제는 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">중독\u003c/b>이었다는 걸 딱 정리해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 부정하기(과거 부정문)\u003c/span> : 누가(Tomatoes) + 안 했어요(didn't) + 무엇을(do) : \"하지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문 속 '아무것도'(any)\u003c/span> : 안 했어요(didn't) + 아무것도(anything) : \"아무것도\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Tomatoes didn't do, 토마토는 하지 않았어요. anything wrong!, 아무 잘못도. 이 문장 전체를 해석하면, 토마토는 아무 잘못도 하지 않았습니다!","hl":"m"},{"n":52,"text":"이 문장은 이 글의 결론이에요. 토마토는 아무 잘못도 하지 않았고, 진짜 문제는 납 중독이었다는 걸 딱 정리해 주죠. 억울했던 토마토가 드디어 이름을 되찾은 기분이에요.","hl":"mn"},{"n":53,"text":"문법 포인트 두 개를 볼게요. 첫 번째, didn't는 지난 일을 안 했다고 말할 때 쓰는 말이에요. 이때 뒤에 오는 동사는 꼭 동사원형으로 써야 해요. 그래서 do anything wrong처럼 do를 그대로 썼죠. 두 번째, anything은 부정문에서 아무것도라는 뜻이에요. didn't와 anything이 만나면 아무것도 하지 않았다는 말이 완성돼요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">중심 내용 찾기\u003c/span>\u003cspan class=\"lp-pill\">정답 토마토는 잘못이 없고, 사람들은 납 접시 때문에 죽었다.\u003c/span>\u003cdiv style=\"margin-top:8px\">글의 마지막 문장에서 \u003cb class=\"key\">토마토\u003c/b>는 아무 잘못도 하지 않았다고 말해요. 또 앞에서 부유한 사람들이 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>를 사용했다는 진짜 원인을 알려 줘요. 그래서 중심 내용은 토마토가 억울하다는 것이에요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>토마토가 정말 독이 있어서 사람들이 죽었다고 하면, 글의 마지막 문장과 반대예요.\u003c/li>\u003cli>부유한 사람들이 토마토를 싫어해서 죽었다고 하면, 글에 그런 내용이 없어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":54,"text":"이제 문제를 풀어 볼까요? 이 글의 중심 내용을 묻는 문제예요. 토마토가 정말 독이 있다고 생각하면 글의 마지막 문장과 반대가 돼요. 정답은 토마토는 잘못이 없고, 사람들은 납 접시 때문에 죽었다는 것이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">토마토\u003c/b>는 밝고 빛나는 빨간 열매예요.\u003c/li>\u003cli>오래 전 사람들은 토마토를 \u003cb class=\"key\">독사과\u003c/b>라고 부르며 두려워했어요.\u003c/li>\u003cli>부유한 사람들이 토마토를 먹고 죽은 까닭은 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b> 때문이었어요.\u003c/li>\u003cli>그래서 \u003cb class=\"key\">토마토\u003c/b>는 아무 잘못도 하지 않았어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Gist: Tomatoes were called poison apples, but lead plates, not tomatoes, made people sick and die.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 오래 전 사람들은 토마토를 \u003cb class=\"key\">독사과\u003c/b>라 부르며 두려워했어요. 하지만 부유한 사람들이 죽은 진짜 원인은 \u003cb class=\"key\">납 \u003c/b>\u003cb class=\"key\">접시\u003c/b>였고, 토마토는 아무 잘못도 하지 않았어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘은 Poison Apple 이야기를 읽었어요. 토마토는 독이 아니라 억울한 열매였고, 진짜 원인은 납이었죠. 여러분은 겉으로 보이는 별명만 믿지 않고 진짜 이유를 찾는 멋진 친구들이에요. 오늘도 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
