<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch3 Unit 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch3 Unit 02","audioDir":"3-02_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch3\u003cbr>Unit\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Charging Bull in New York City\u003c/h1>\u003ch2>뉴욕의 돌진하는 황소상\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 뉴욕 시에 있는 \u003cb class=\"key\">돌진하는 \u003c/b>\u003cb class=\"key\">황소상\u003c/b>은 Arturo Di Modica가 1989년에 뉴욕 시민에게 주는 크리스마스 선물로 세운 것이에요. 시에서 허락하지 않아 한때 가져갔지만, 사람들이 원해서 결국 \u003cb class=\"key\">공원\u003c/b>에 다시 놓였어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Charging Bull was a Christmas gift to New Yorkers, and people wanted it back, so the city put it in a park.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 뉴욕 시에 있는 아주 큰 황소상 이야기를 읽어 볼 거예요. 힘차게 돌진하는 모습을 담은 Charging Bull 이야기랍니다. 우리 함께 천천히 읽어 보아요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">뉴욕은 미국에서 가장 큰 도시 중 하나예요. 이 도시에는 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">여신상\u003c/b>처럼 세계적으로 유명한 것이 많아요. \u003cb class=\"key\">황소상\u003c/b>은 힘과 용기를 나타내는 \u003cb class=\"key\">조형물\u003c/b>(statue)이에요. 우리가 운동회에서 우승 트로피를 자랑스러워하듯, 뉴욕 사람들도 이 황소를 아주 자랑스러워해요. 황소는 영어로 \u003cb class=\"key\">bull\u003c/b>이라고 해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 뉴욕이 어느 나라 도시인지 아나요? 맞아요, 미국이에요. 뉴욕에는 자유의 여신상처럼 세계적으로 유명한 것이 많아요. 오늘 만날 황소상은 힘과 용기를 나타내는 조형물이에요. 우리가 운동회에서 우승 트로피를 자랑스러워하듯, 뉴욕 사람들도 이 황소를 아주 자랑스러워한답니다. 황소는 영어로 bull이라고 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>뉴욕의 큰 황소\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>돌진하는 황소상이 어디에 있는지, 얼마나 \u003cb class=\"key\">큰지\u003c/b> 알려 줘요. 많은 사람들이 매일 보러 오고, 무게는 약 \u003cb class=\"key\">3,200kg\u003c/b>이나 된다고 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>만든 사람과 선물\u003csmall>이유 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>누가 만들었는지 \u003cb class=\"key\">질문\u003c/b>하고, 만든 사람이 Arturo Di Modica라고 답해요. 1989년에 건물 밖 크리스마스트리 아래에 두었고, 뉴욕 시민에게 주는 \u003cb class=\"key\">크리스마스 \u003c/b>\u003cb class=\"key\">선물\u003c/b>이었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>허락받지 못함\u003csmall>문제 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>시에서는 그것을 \u003cb class=\"key\">허락\u003c/b>하지 않았어요. 그래서 \u003cb class=\"key\">경찰\u003c/b>이 그것을 가져가 버렸어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다시 돌아온 황소\u003csmall>해결 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>많은 사람들이 황소상이 \u003cb class=\"key\">돌아오기\u003c/b>를 원했어요. 마침내 시에서는 그것을 다시 가져왔고, 이번에는 \u003cb class=\"key\">공원\u003c/b>에 두었어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글이 어떤 순서로 흘러가는지 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 단계에서는 황소상이 어디에 있는지 알려 줘요. Charging Bull is in New York City, 뉴욕 시에 있다고 하지요. 그리고 많은 사람들이 매일 보러 오고, 무게가 약 3,200킬로그램이나 된다고 해요. 정말 큰 황소상이지요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 누가 만들었는지 질문해요. Who made the bull, 하고 물어보지요. 만든 사람은 Arturo Di Modica이고, 1989년에 건물 밖 크리스마스트리 아래에 두었어요. 그리고 이것은 뉴욕 시민들에게 주는 크리스마스 선물이었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 문제가 생겨요. 시에서는 그것을 허락하지 않았어요. 그래서 경찰이 그것을 가져가 버렸지요. 기껏 준비한 선물이 갑자기 사라진 셈이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결이에요. 많은 사람들이 황소상이 돌아오기를 원했어요. 마침내 시에서는 그것을 다시 가져왔고, 이번에는 공원에 두었어요. 사람들의 마음이 통한 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 글의 주인공인 \u003cb class=\"key\">황소상\u003c/b>이 어디에 있는지 먼저 알려 줘요. 그다음 황소상에 대한 정보를 차례로 보여 주고, 중간에 \u003cb class=\"key\">문제\u003c/b>가 생겼다가 끝에서 \u003cb class=\"key\">해결\u003c/b>돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In 1989 (7)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>Finally (12)\u003c/b>\u003cspan>마지막 순서를 알려 줌\u003c/span>\u003cb>this time (13)\u003c/b>\u003cspan>바뀐 때를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Charging Bull\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bull\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a Christmas gift to New Yorkers\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결로 짜여 있어요. 중심 내용은 첫 번째 문장에서 먼저 알려 주지요. 황소상이 뉴욕 시에 있다는 사실로 시작해서, 중간에 문제가 생기고 끝에서 해결되는 구조예요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. In 1989는 때를 알려 주고, But은 반대 내용을 이어 줘요. Finally는 마지막 순서를 알려 주고, this time은 때가 바뀌었다는 것을 알려 줘요. 같은 황소상을 Charging Bull, the bull, it, 그리고 a Christmas gift to New Yorkers라고 다르게 부르고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>charging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>돌진하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>bull\u003c/b>\u003cem>명사\u003c/em>\u003cspan>황소\u003c/span>\u003c/div>\u003cdiv>\u003cb>come\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>every day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매일\u003c/span>\u003c/div>\u003cdiv>\u003cb>big\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>weigh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>무게가 ~나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~밖에\u003c/span>\u003c/div>\u003cdiv>\u003cb>building\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건물\u003c/span>\u003c/div>\u003cdiv>\u003cb>under\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>gift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>허락하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>police\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>take away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가져가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>want\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>back\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시 돌아오게\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공원\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? charging은 돌진하는, weigh는 무게가 나가다는 뜻이에요. allow는 허락하다, take away는 가져가다는 뜻이고요. finally는 마침내라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gift\u003c/b>\u003cspan class=\"m\">선물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">present\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">허락하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">take away\u003c/b>\u003cspan class=\"m\">가져가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remove\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bring back\u003c/span>\u003cspan class=\"a\">give back\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. big은 large나 huge와 비슷하고, small이나 little과 반대예요. gift는 present와 비슷해요. allow는 let과 비슷하고, 반대로 refuse는 허락하지 않는다는 뜻이에요. take away는 bring back과 반대말이고, finally는 at last와 비슷하면서 first와는 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌진하는 황소상은\u003c/span>\u003cspan class=\"en\">Charging Bull\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕 시에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">New \u003c/span>\u003cspan class=\"tgt\">York \u003c/span>\u003cspan class=\"tgt\">City\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돌진하는 황소상은 뉴욕 시에 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴욕에 있는 \u003cb class=\"key\">돌진하는 \u003c/b>\u003cb class=\"key\">황소상\u003c/b>을 소개하는 글의 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 이 글 전체가 황소상 이야기라는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 무엇이(is) + 있다(in) + 어디에(New York City) : \"뉴욕 시에 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Charging Bull, 돌진하는 황소상은. is in, 있습니다. New York City, 뉴욕 시에. 이 문장 전체를 해석하면, 돌진하는 황소상은 뉴욕 시에 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 돌진하는 황소상이 뉴욕 시에 있다고 알려 줘요.","hl":"mn"},{"n":14,"text":"여기서 눈여겨볼 것은 장소 짝꿍 말인 전치사예요. in이 New York City라는 장소 앞에 붙어서 어디에 있는지 알려 주죠. 무엇이 어디에 있다고 말할 때는 be동사 다음에 전치사와 장소를 붙여 주면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 보러 옵니다\u003c/span>\u003cspan class=\"en\">come \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 매일 그것을 보러 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 황소상이 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">인기 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 것을 보여 줘요. \u003cb class=\"key\">매일\u003c/b> 많은 사람이 보러 올 만큼 유명하다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">많은 수 말하기(수량 표현 many)\u003c/span> : 많은(Many) + 사람들(people) : \"많은 사람들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 보러(to see) + 그것을(it) : \"그것을 보러\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Many people, 많은 사람들이. come to see it, 그것을 보러 옵니다. every day, 매일. 이 문장 전체를 해석하면, 많은 사람들이 매일 그것을 보러 옵니다.","hl":"m"},{"n":16,"text":"이 문장은 황소상이 아주 인기 있다는 것을 알려 줘요. 매일 많은 사람이 보러 온다고 하니까 얼마나 유명한지 알 수 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 many는 셀 수 있는 것 앞에 붙여서 '많은'이라고 말해요. people은 복수라서 many와 잘 어울려요. 두 번째로 to see는 '보러'라는 목적을 말하는 to부정사예요. to 다음에는 꼭 동사원형이 와요. come to see it을 통째로 '그것을 보러 오다'로 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 큽니다\u003c/span>\u003cspan class=\"en\">so big!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 정말 큽니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 황소상이 \u003cb class=\"key\">얼마나 \u003c/b>\u003cb class=\"key\">큰지\u003c/b> 놀라는 마음을 담았어요. 다음에 나오는 \u003cb class=\"key\">무게\u003c/b> 이야기를 궁금하게 만드는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(am·are·is 친구들)\u003c/span> : 그것은(It) + 이다(is) + 정말 큰(so big) : \"그것은 ~입니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is, 그것은. so big!, 정말 큽니다. 이 문장 전체를 해석하면, 그것은 정말 큽니다!","hl":"m"},{"n":19,"text":"이 문장은 황소상이 정말 크다고 감탄하는 문장이에요. 다음에 나오는 무게 이야기를 궁금하게 만들어 줘요.","hl":"mn"},{"n":20,"text":"It is는 '그것은 ~이다'라는 be동사 문장이에요. 무엇이 어떤지 말할 때 무엇이 다음에 is를 넣고, 그다음에 big처럼 꾸며 주는 말을 붙여요. so는 big을 더 세게 꾸며 주는 말이에요. 여러분도 It is so big! 하고 크게 읽어 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무게가 약\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">weighs\u003c/span> about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3,200킬로그램입니다\u003c/span>\u003cspan class=\"en\">3,200 kg.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 무게가 약 3,200kg입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 황소상의 \u003cb class=\"key\">무게\u003c/b>를 알려 주는 문장이에요. 숫자를 보면 이 황소상의 \u003cb class=\"key\">크기\u003c/b>가 얼마나 큰지 짐작할 수 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 황소상 → 그것(It) : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(It) + 무게가 나간다(weighs) : \"무게가 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It, 그것은. weighs about, 무게가 약. 3,200 kg, 3,200킬로그램입니다. 이 문장 전체를 해석하면, 그것은 무게가 약 3,200kg입니다.","hl":"m"},{"n":22,"text":"이 문장은 황소상의 무게를 알려 주고 있어요. 숫자를 보면 황소상의 크기가 얼마나 큰지 알 수 있죠.","hl":"mn"},{"n":23,"text":"먼저 It은 앞에 나온 황소상을 가리키는 대명사예요. 같은 말을 또 하지 않으려고 그것이라고 짧게 부르는 거죠. 그리고 It은 한 개니까 동사 weigh에 s를 붙여서 weighs라고 해요. 이걸 3인칭 단수라고 불러요. 여러분도 It 다음에는 동사에 s를 꼭 붙여 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Who\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들었을까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 황소상을\u003c/span>\u003cspan class=\"en\">the bull?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누가 그 황소상을 만들었을까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 황소상을 \u003cb class=\"key\">누가\u003c/b> 만들었는지 묻고 있어요. 이렇게 물으면 다음에 \u003cb class=\"key\">만든 \u003c/b>\u003cb class=\"key\">사람\u003c/b> 이야기가 나올 거라고 알 수 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 who(의문문)\u003c/span> : 누가(Who) + 했어요(made) + 무엇을(the bull)? : \"누가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 만들다(make) → 만들었다(made) : \"만들었어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Who, 누가. made, 만들었을까요. the bull?, 그 황소상을. 이 문장 전체를 해석하면, 누가 그 황소상을 만들었을까요?","hl":"m"},{"n":25,"text":"이 문장은 황소상을 누가 만들었는지 묻고 있어요. 이렇게 물으면 다음에 만든 사람 이야기가 나온다는 걸 알 수 있죠.","hl":"mn"},{"n":26,"text":"먼저 Who는 누구인지 궁금할 때 문장 맨 앞에 쓰는 말이에요. 이렇게 무엇인가를 묻는 문장을 의문문이라고 해요. 그리고 made는 make의 과거형이에요. 이미 지난 일이라서 make가 made로 모양이 바뀐 거죠. 질문을 잘 따라 읽으면 다음 문장이 술술 이해될 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Arturo Di Modica였습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Arturo \u003c/span>\u003cspan class=\"tgt\">Di \u003c/span>\u003cspan class=\"tgt\">Modica\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 Arturo Di Modica였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 황소상을 만든 사람이 Arturo Di Modica라고 알려 주는 문장이에요. 앞 문장의 질문에 \u003cb class=\"key\">대답\u003c/b>을 해 주죠. \u003cb class=\"key\">만든 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 누구인지 이제 알겠어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">was·were 친구들(be동사)\u003c/span> : 그것은(It) + 이었다(was) : \"그것은 ~이었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 그것은(It) + 이었다(was) + Arturo Di Modica : \"Arturo Di Modica였습니다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It was, 그것은 ~이었습니다. Arturo Di Modica, Arturo Di Modica였습니다. 이 문장 전체를 해석하면, 그것은 Arturo Di Modica였습니다.","hl":"m"},{"n":28,"text":"이 문장은 황소상을 만든 사람이 Arturo Di Modica라고 알려 줘요. 앞에서 던진 질문에 대답을 해 주는 거죠. 이제 만든 사람이 누구인지 알겠어요.","hl":"mn"},{"n":29,"text":"먼저 It was는 그것은 이었다라는 뜻이에요. 과거에 있었던 일이라서 is 대신에 was를 썼어요. 그리고 was 뒤에는 누구인지 알려 주는 말이 와요. 이렇게 주어를 채워 주는 말을 보어라고 해요. 아주 짧은 문장이지만 알맹이가 꽉 들어 있죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1989년에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">1989\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그것을 두었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 건물 밖에,\u003c/span>\u003cspan class=\"en\">outside of a building,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리 아래에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Christmas \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1989년에, 그는 그것을 한 건물 밖, 크리스마스트리 아래에 두었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작가가 황소를 \u003cb class=\"key\">건물 \u003c/b>\u003cb class=\"key\">밖\u003c/b> 크리스마스트리 아래에 두었다는 뜻이에요. 황소 이야기의 \u003cb class=\"key\">처음 \u003c/b>\u003cb class=\"key\">장면\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 시간(In) + 년도(1989) : \"1989년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(he) + 두었다(put) + 그것을(it) : \"그는 그것을 두었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 아래에(under) + 크리스마스트리(a Christmas tree) : \"크리스마스트리 아래에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In 1989, 1989년에. he put it, 그는 그것을 두었습니다. outside of a building, 한 건물 밖에. under a Christmas tree, 크리스마스트리 아래에.. 이 문장 전체를 해석하면, 1989년에, 그는 그것을 한 건물 밖, 크리스마스트리 아래에 두었습니다.","hl":"m"},{"n":31,"text":"작가가 황소를 건물 밖 크리스마스트리 아래에 두었다는 뜻이에요. 황소 이야기의 처음 장면을 보여 주죠.","hl":"mn"},{"n":32,"text":"첫 번째, In 1989에서 In은 시간을 알려 주는 전치사예요. 두 번째, put은 지난 일을 말하는 과거형이에요. 세 번째, under는 장소를 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스 선물\u003c/span>\u003cspan class=\"en\">a Christmas gift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕 시민들에게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">New \u003c/span>\u003cspan class=\"tgt\">Yorkers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 뉴욕 시민들에게 주는 크리스마스 선물이었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그 황소가 뉴욕 시민들에게 주는 \u003cb class=\"key\">크리스마스 \u003c/b>\u003cb class=\"key\">선물\u003c/b>이었다는 뜻이에요. 작가의 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(It) + 이었다(was) : \"그것은 ~이었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : ~에게(to) + 뉴욕 시민들(New Yorkers) : \"뉴욕 시민들에게\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It was, 그것은 ~이었습니다. a Christmas gift, 크리스마스 선물. to New Yorkers, 뉴욕 시민들에게.. 이 문장 전체를 해석하면, 그것은 뉴욕 시민들에게 주는 크리스마스 선물이었습니다.","hl":"m"},{"n":34,"text":"그 황소는 뉴욕 시민들에게 주는 크리스마스 선물이었어요. 작가의 따뜻한 마음이 담겨 있죠.","hl":"mn"},{"n":35,"text":"첫 번째, It was에서 was는 be동사예요. 지난 일이라 was를 썼죠. 두 번째, to는 선물이 누구에게 가는지 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시에서는\u003c/span>\u003cspan class=\"en\">The city\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 허락하지 않았습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">allow\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시에서는 그것을 허락하지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시에서는 그 선물을 \u003cb class=\"key\">허락하지 \u003c/b>\u003cb class=\"key\">않았\u003c/b>다는 뜻이에요. 그래서 다음 문장에서 황소에게 \u003cb class=\"key\">문제\u003c/b>가 생겨요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(do/does/did 부정)\u003c/span> : 하지 않았다(didn't) + 허락하다(allow) : \"허락하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The city, 시에서는. didn't allow it, 그것을 허락하지 않았습니다.. 이 문장 전체를 해석하면, 시에서는 그것을 허락하지 않았습니다.","hl":"m"},{"n":37,"text":"시에서는 그 황소를 허락하지 않았어요. 그래서 다음에 황소에게 문제가 생기죠.","hl":"mn"},{"n":38,"text":"didn't는 지난 일을 부정할 때 쓰는 말이에요. didn't 뒤에는 동사를 원래 모양으로 써요. 그래서 allowed가 아니라 allow예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경찰이\u003c/span>\u003cspan class=\"en\">The police\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 가져갔습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> away.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경찰이 그것을 가져갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시에서 허락하지 않아서 \u003cb class=\"key\">경찰\u003c/b>이 황소를 \u003cb class=\"key\">가져갔다는\u003c/b> 내용이에요. 이야기가 \u003cb class=\"key\">문제\u003c/b> 상황으로 바뀌는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형, 불규칙)\u003c/span> : 누가(The police) + 가져갔다(took) + 그것을(it) : \"가져갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 가져갔다(took) + 그것을(it) : \"그것을\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The police, 경찰이. took it away, 그것을 가져갔습니다.. 이 문장 전체를 해석하면, 경찰이 그것을 가져갔습니다.","hl":"m"},{"n":40,"text":"경찰이 황소를 가져갔다는 뜻이에요. 이야기가 문제 상황으로 바뀌는 부분이에요.","hl":"mn"},{"n":41,"text":"첫 번째, took은 take의 과거형이에요. 지난 일이라 took이라고 말해요. 두 번째, it은 앞에 나온 Charging Bull을 다시 가리키는 대명사예요. 그래서 그것을이라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 돌아오기를 원했습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wanted\u003c/span> it back.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 많은 사람들이 그것이 돌아오기를 원했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 황소가 \u003cb class=\"key\">돌아오기를\u003c/b> 바랐다는 내용이에요. 그래서 다음에 \u003cb class=\"key\">다시\u003c/b> 가져오는 일이 생겨요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 하지만(But) + 뒤말 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 + 복수(수량 표현)\u003c/span> : 많은(many) + 사람들(people) : \"많은 사람들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형, 규칙)\u003c/span> : 누가(many people) + 원했다(wanted) + 그것을(it) : \"원했습니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But many people, 하지만 많은 사람들이. wanted it back, 그것이 돌아오기를 원했습니다.. 이 문장 전체를 해석하면, 하지만 많은 사람들이 그것이 돌아오기를 원했습니다.","hl":"m"},{"n":43,"text":"사람들이 황소가 돌아오기를 바랐다는 뜻이에요. 그래서 다음에 다시 가져오는 일이 생겨요.","hl":"mn"},{"n":44,"text":"첫 번째, But은 하지만이라는 접속사예요. 앞 내용과 반대되는 말을 이어 줘요. 두 번째, many people은 많은 사람들이라는 뜻이에요. people은 사람들이라서 복수 모양이에요. 세 번째, wanted는 want에 ed를 붙인 과거형이에요. 지난 일이라 wanted라고 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내, 시에서는\u003c/span>\u003cspan class=\"en\">F\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in\u003c/span>ally, the city\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 다시 가져왔지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brought\u003c/span> it back, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 장소에 두었습니다.\u003c/span>\u003cspan class=\"en\">in a new place.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, 시에서는 그것을 다시 가져왔지만, 새로운 장소에 두었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시가 황소를 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">가져왔지만\u003c/b> \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">장소\u003c/b>에 두었다는 내용이에요. \u003cb class=\"key\">문제\u003c/b>가 조금 풀리는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소(a new place) : \"새로운 장소에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형, 불규칙)\u003c/span> : 누가(the city) + 다시 가져왔다(brought) + 그것을(it) : \"다시 가져왔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 하지만(but) + 뒤말 : \"하지만\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Finally, the city, 마침내, 시에서는. brought it back, but, 그것을 다시 가져왔지만. in a new place, 새로운 장소에 두었습니다.. 이 문장 전체를 해석하면, 마침내, 시에서는 그것을 다시 가져왔지만, 새로운 장소에 두었습니다.","hl":"m"},{"n":46,"text":"시가 황소를 다시 가져왔지만 새로운 장소에 두었다는 뜻이에요. 문제가 조금 풀리는 부분이에요.","hl":"mn"},{"n":47,"text":"첫 번째, brought는 bring의 과거형이에요. 지난 일이라 brought라고 말해요. 두 번째, but은 하지만이라는 접속사예요. 가져왔지만 새로운 장소라는 다른 점을 이어 줘요. 세 번째, in은 안에나 에라는 뜻을 가진 전치사예요. 여기서는 새로운 장소에라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 있었습니다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이번에는\u003c/span>\u003cspan class=\"en\">this time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번에는 공원에 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도시가 황소를 다시 가져온 뒤, 이번에는 \u003cb class=\"key\">공원\u003c/b>에 있었다는 뜻이에요. 마지막으로 황소의 \u003cb class=\"key\">장소\u003c/b>가 바뀌었다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 무엇이(It) + was + 어디에 : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : in + 장소 : \"공원에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"It was, 그것은 있었습니다. in a park, 공원에. this time, 이번에는. 이 문장 전체를 해석하면, 이번에는 공원에 있었습니다.","hl":"m"},{"n":49,"text":"이 문장은 도시가 황소를 다시 가져온 뒤, 이번에는 공원에 있었다는 뜻이에요. 마지막으로 황소의 장소가 바뀌었다는 걸 알려 주죠.","hl":"mn"},{"n":50,"text":"첫 번째, was는 be동사의 지난 모습이에요. is가 was로 바뀌어서 지난 일을 말해 줘요. 두 번째, in a park에서 in은 장소를 알려 주는 말이에요. 그래서 공원 안에라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>돌진하는 \u003cb class=\"key\">황소상\u003c/b>은 뉴욕 시에 있고, 무게가 약 3,200kg이나 되는 큰 조형물이에요.\u003c/li>\u003cli>Arturo Di Modica가 1989년에 만들어서 뉴욕 시민에게 주는 \u003cb class=\"key\">크리스마스 \u003c/b>\u003cb class=\"key\">선물\u003c/b>로 두었어요.\u003c/li>\u003cli>시에서는 \u003cb class=\"key\">허락\u003c/b>하지 않아 경찰이 가져갔지만, 사람들은 다시 돌아오기를 \u003cb class=\"key\">원했어요\u003c/b>.\u003c/li>\u003cli>마침내 시에서는 황소상을 \u003cb class=\"key\">공원\u003c/b>에 다시 두었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Charging Bull was a Christmas gift to New Yorkers, and people wanted it back, so the city put it in a park.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 뉴욕 시에 있는 \u003cb class=\"key\">돌진하는 \u003c/b>\u003cb class=\"key\">황소상\u003c/b>은 Arturo Di Modica가 1989년에 뉴욕 시민에게 주는 크리스마스 선물로 세운 것이에요. 시에서 허락하지 않아 한때 가져갔지만, 사람들이 원해서 결국 \u003cb class=\"key\">공원\u003c/b>에 다시 놓였어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 뉴욕의 Charging Bull 이야기를 읽었어요. 큰 황소상이 선물로 시작해서 공원에 다시 서게 된 이야기, 기억나지요? 문제와 해결 순서로 읽으면 글이 훨씬 쉽게 느껴져요. 오늘도 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
