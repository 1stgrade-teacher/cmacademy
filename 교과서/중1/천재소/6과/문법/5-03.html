</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch5 Unit 03","audioDir":"5-03_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch5\u003cbr>Unit\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Walk, Don't Run: The Young Man and the Apples\u003c/h1>\u003ch2>뛰지 말고 걸어요: 젊은이와 사과\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>한 젊은이가 사과 \u003cb class=\"key\">바구니\u003c/b>를 들고 집에 빨리 가려고 뛰었지만, 사과가 자꾸 \u003cb class=\"key\">떨어져서\u003c/b> 오히려 집에 늦게 도착했어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Walking home without dropping apples is faster than running and dropping them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 사과 바구니를 든 젊은이의 이야기를 읽어 볼 거예요. 빨리 가려고 뛰었는데 오히려 늦어 버린 재미있는 이야기랍니다. 같이 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">여러분, 사과가 가득 든 \u003cb class=\"key\">바구니\u003c/b>를 들고 뛰어 본 적 있나요? 뛰면 몸이 흔들려서 사과가 톡톡 떨어져요. 영어로 바구니는 basket, 뛰다는 \u003cb class=\"key\">run\u003c/b>이라고 해요. 그러면 사과를 떨어뜨리지 않고 집에 빨리 가려면 어떻게 해야 할까요? 오늘 이야기 속 노인이 아주 좋은 답을 알려 줍니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 사과가 가득 든 바구니를 들고 뛰어 본 적 있나요? 뛰면 몸이 흔들려서 사과가 톡톡 떨어져요. 영어로 바구니는 basket, 뛰다는 run이라고 해요. 그러면 사과를 떨어뜨리지 않고 집에 빨리 가려면 어떻게 해야 할까요? 오늘 이야기 속 노인이 아주 좋은 답을 알려 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>만남과 질문\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>한 젊은이가 사과 \u003cb class=\"key\">바구니\u003c/b>를 들고 있었어요. 길에서 \u003cb class=\"key\">노인\u003c/b>을 만나 집에 빨리 가는 방법을 물었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>노인의 조언\u003csmall>조언 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>노인은 뛰지 말고 걸어서 집에 가라고 했어요. 그러면 더 빠를 거라고 했지요. 그런데 젊은이는 그 말을 \u003cb class=\"key\">이해\u003c/b>하지 못했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>뛰어서 생긴 문제\u003csmall>문제 · 문장 6–12\u003c/small>\u003c/h4>\u003cp>젊은이는 바구니를 들고 뛰기 \u003cb class=\"key\">시작\u003c/b>했어요. 그런데 사과가 자꾸 \u003cb class=\"key\">떨어져서\u003c/b> 멈추고 줍고 다시 뛰기를 여러 번 \u003cb class=\"key\">반복\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>늦은 도착\u003csmall>마무리 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">마침내\u003c/b> 그는 집에 도착했어요. 하지만 시간은 아주 \u003cb class=\"key\">늦었어요\u003c/b>. 빨리 가려던 마음이 오히려 시간을 잡아먹은 거예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기가 어떤 차례로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"먼저 한 젊은이가 사과 바구니를 들고 있었어요. 그리고 길에서 한 노인을 만나 집에 빨리 가는 방법을 물었죠.","hl":"f0"},{"n":5,"text":"노인은 뛰지 말고 걸어서 집에 가라고 했어요. 그러면 더 빠를 거라고 했지요. 그런데 젊은이는 그 말을 이해하지 못했어요.","hl":"f1"},{"n":6,"text":"젊은이는 바구니를 들고 뛰기 시작했어요. 그런데 사과가 자꾸 떨어져서 멈추고, 줍고, 다시 뛰기를 여러 번 반복했답니다.","hl":"f2"},{"n":7,"text":"그렇게 해서 마침내 집에 도착했어요. 하지만 시간은 아주 늦었어요. 빨리 가려던 마음이 오히려 시간을 잡아먹은 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 노인이 한 조언이 \u003cb class=\"key\">가운데\u003c/b>에 있고, 그 조언이 맞았는지 뒤에서 보여 주는 이야기예요. 그래서 중심이 되는 말은 다섯 번째 문장인 It'll be faster예요. 마지막의 \u003cb class=\"key\">But\u003c/b>이 '빨리 가려 했지만 늦었다'는 반대 상황을 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (8)\u003c/b>\u003cspan>반대 내용\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>순서 알려 줌\u003c/span>\u003cb>Finally (13)\u003c/b>\u003cspan>마지막 순서 알려 줌\u003c/span>\u003cb>But (14)\u003c/b>\u003cspan>반대 내용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">A young man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a basket of apples\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the basket\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the apples\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>뛰기\u003c/th>\u003cth>걷기\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사과가 자꾸 떨어진다\u003c/td>\u003ctd>사과를 잘 지킬 수 있다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>줍느라 시간이 더 걸린다\u003c/td>\u003ctd>멈추지 않아 더 빠르다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 차례대로 쓰인 이야기예요. 중심이 되는 말은 가운데에 나오는 It'll be faster라는 문장이에요. 마지막의 But이 앞 내용과 반대되는 결과를 보여 준답니다.","hl":"ty"},{"n":9,"text":"Then이나 Finally 같은 말이 순서를 알려 주고, But은 앞 내용과 반대되는 일이 생겼다고 알려 줘요. 또 젊은이를 A young man이라고 했다가 He라고 다시 부르고, 사과 바구니를 the basket, the apples라고 다르게 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>young\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>젊은\u003c/span>\u003c/div>\u003cdiv>\u003cb>basket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바구니\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집에 도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빨리\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걷다\u003c/span>\u003c/div>\u003cdiv>\u003cb>faster\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>run\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밖으로 떨어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>줍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>again\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>late\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>늦은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. young은 젊은, basket은 바구니, understand는 이해하다라는 뜻이에요. keep falling은 계속 떨어진다는 뜻이고, pick up은 줍다, finally는 마침내라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">halt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">go\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">run\u003c/b>\u003cspan class=\"m\">뛰다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dash\u003c/span>\u003cspan class=\"s\">race\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">walk\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">late\u003c/b>\u003cspan class=\"m\">늦은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tardy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">early\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 익혀 봐요. fast는 빠른, 비슷한 말은 quick, 반대말은 slow예요. start는 시작하다, 비슷한 말은 begin, 반대말은 stop이에요. run은 뛰다, 반대말은 walk이고, late는 늦은, 반대말은 early랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 젊은이가\u003c/span>\u003cspan class=\"en\">A young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바구니를 가지고 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> a basket\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과가 든\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">apples\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 젊은이가 사과 바구니를 가지고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작으로, \u003cb class=\"key\">주인공\u003c/b>이 사과 바구니를 들고 있다는 것을 알려 줘요. 여기서 사과는 나중에 아주 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">물건\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(A young man) + 가졌다(had) + 무엇을(a basket of apples) : \"가지고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개 말(복수)\u003c/span> : 한 개(apple) + s = 여러 개(apples) : \"사과들\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A young man, 한 젊은이가. had a basket, 바구니를 가지고 있었어요. of apples, 사과가 든. 이 문장 전체를 해석하면, 한 젊은이가 사과 바구니를 가지고 있었습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 처음이에요. 한 젊은이가 사과 바구니를 들고 있다는 걸 알려 주죠. 주인공과 중요한 물건이 한 번에 나와서 장면이 딱 그려져요.","hl":"mn"},{"n":14,"text":"첫 번째, had는 지난 일을 말하는 과거형이에요. have의 과거 모양이 had랍니다. 두 번째, apples처럼 여러 개를 말할 때는 명사 뒤에 s를 붙여요. 사과 하나는 apple, 사과 여러 개는 apples예요. 아주 쉬운 규칙이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 만났어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">met\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 노인을\u003c/span>\u003cspan class=\"en\">an old man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 물었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> asked,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 하면 내가\u003c/span>\u003cspan class=\"en\">&quot;How \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can\u003c/span> I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 빨리 갈 수 있나요\u003c/span>\u003cspan class=\"en\">get home fast?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 한 노인을 만나 &quot;어떻게 하면 집에 빨리 갈 수 있나요?&quot;라고 물었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 노인에게 집에 빨리 가는 \u003cb class=\"key\">방법\u003c/b>을 물어요. 이 \u003cb class=\"key\">질문\u003c/b> 덕분에 이야기가 움직이기 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 만났다(met) + 누구를(an old man) : \"만났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 만났다(met) + and + 물었다(asked) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 내가(I) + ~할 수 있다(can) + 가다(get) : \"~할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He met, 그는 만났어요. an old man, 한 노인을. and asked, 그리고 물었어요. \"How can I, 어떻게 하면 내가. get home fast?\", 집에 빨리 갈 수 있나요. 이 문장 전체를 해석하면, 그는 한 노인을 만나 \"어떻게 하면 집에 빨리 갈 수 있나요?\"라고 물었습니다.","hl":"m"},{"n":16,"text":"주인공이 노인에게 집에 빨리 가는 방법을 물어요. 이 질문 하나로 이야기가 슬슬 움직이기 시작한답니다.","hl":"mn"},{"n":17,"text":"첫 번째, met은 meet의 과거형이에요. 지난 일을 말하는 과거형은 모양이 달라질 때도 있어요. 두 번째, and는 두 가지 일을 이어 주는 말이에요. 만난 일과 물은 일을 한 문장으로 묶어 주죠. 세 번째, can은 도와주는 동사예요. 동사 앞에서 ~할 수 있다는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 노인은 대답했어요\u003c/span>\u003cspan class=\"en\">The old man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">answered\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뛰지 마세요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">노인은 &quot;뛰지 마시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노인이 '뛰지 마세요'라고 짧게 \u003cb class=\"key\">대답\u003c/b>해요. 주인공이 하려는 행동과 반대되는 말이라 더 궁금하게 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The old man) + 대답했다(answered) : \"대답했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 하지 마(Don't) + 뛰다(run) : \"뛰지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The old man answered, 그 노인은 대답했어요. \"Don't run, 뛰지 마세요. 이 문장 전체를 해석하면, 노인은 \"뛰지 마시오.","hl":"m"},{"n":19,"text":"노인이 뛰지 말라고 짧게 대답해요. 주인공이 하려는 행동과 정반대라서 다음이 더 궁금해지죠.","hl":"mn"},{"n":20,"text":"첫 번째, answered는 answer에 -ed를 붙인 과거형이에요. 두 번째, Don't run은 명령문이에요. 누군가에게 하지 말라고 할 때는 Don't 뒤에 동사를 그대로 써요. 여러분도 친구에게 하지 마라고 할 때 이렇게 말할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸어서 집에 가시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Walk\u003c/span> home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">걸어서 집에 가시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 늙은 남자가 젊은 남자에게 \u003cb class=\"key\">달리지 \u003c/b>\u003cb class=\"key\">말고\u003c/b> \u003cb class=\"key\">걸어서\u003c/b> 집에 가라고 알려 주는 말이에요. 이야기의 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 콕 집어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(Walk) + 장소(home) : \"걸으시오\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Walk home, 걸어서 집에 가시오. 이 문장 전체를 해석하면, 걸어서 집에 가시오.","hl":"m"},{"n":22,"text":"늙은 남자가 젊은 남자에게 달리지 말고 걸어서 집에 가라고 알려 주는 말이에요. 이야기의 해결 방법을 콕 집어 주는 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 ~일 것이오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It'll\u003c/span> be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 빠를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">faster\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 더 빠를 것이오.&quot;라고 대답했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 늙은 남자가 '걸어가는 것이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">빠를\u003c/b> 거요'라고 말해요. 이 이야기의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 담은 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞으로의 일(미래형 will)\u003c/span> : 주어(It) + will + 동사원형(be) : \"그것은 ~일 것이오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : fast + er = faster : \"더 빠른\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"It'll be, 그것이 ~일 것이오. faster, 더 빠를. 이 문장 전체를 해석하면, 그것이 더 빠를 것이오.\"라고 대답했습니다.","hl":"m"},{"n":24,"text":"늙은 남자가 '걸어가는 것이 더 빠를 거요'라고 말해요. 이 이야기의 중심 생각을 담은 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 젊은이는\u003c/span>\u003cspan class=\"en\">The young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하지 못했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 대답을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">젊은이는 그의 대답을 이해하지 못했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 젊은 남자가 늙은 남자의 \u003cb class=\"key\">충고\u003c/b>를 \u003cb class=\"key\">이해하지 \u003c/b>\u003cb class=\"key\">못했어요\u003c/b>. 그래서 곧 달리기를 시작하게 된다는 것을 미리 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 부정(과거 부정문)\u003c/span> : 누가(The young man) + didn't + 하다(understand) : \"이해하지 못했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">그의 ~(소유격)\u003c/span> : his(그의) + answer(대답) : \"그의 대답\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"The young man, 그 젊은이는. didn't understand, 이해하지 못했습니다. his answer, 그의 대답을. 이 문장 전체를 해석하면, 젊은이는 그의 대답을 이해하지 못했습니다.","hl":"m"},{"n":26,"text":"젊은 남자가 늙은 남자의 충고를 이해하지 못했어요. 그래서 곧 달리기를 시작하게 된다는 것을 미리 알려 주는 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뛰기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바구니를 들고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">basket\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 바구니를 들고 뛰기 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청년이 집에 빨리 가려고 바구니를 든 채 뛰기 시작했다는 말이에요. 이 \u003cb class=\"key\">서두름\u003c/b>이 뒤에서 어떤 일을 만드는지 보여 주는 시작점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to붙은 동사(to부정사)\u003c/span> : 누가(He) + 시작했다(started) + ~하기를(to run) : \"뛰기 시작했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : 누가(He) + 뛰었다(run) + 무엇을 들고(with the basket) : \"바구니를 들고\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He started, 그는 시작했습니다. to run, 뛰기를. with the basket, 바구니를 들고. 이 문장 전체를 해석하면, 그는 바구니를 들고 뛰기 시작했습니다.","hl":"m"},{"n":28,"text":"이 문장은 청년이 빨리 가려고 바구니를 든 채 뛰기 시작했다는 걸 알려 줘요. 서두름이 시작되는 장면이죠.","hl":"mn"},{"n":29,"text":"첫 번째, started to run은 '뛰기 시작했다'라는 뜻이에요. start 뒤에 to랑 동사원형을 붙이면 '~하기 시작하다'가 된답니다. 두 번째, with the basket은 '바구니를 들고'라는 뜻이에요. with는 무엇을 들고 있는지 알려 주는 짝꿍 말이에요. 여러분도 with를 만나면 '가지고'라고 생각해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 사과들이\u003c/span>\u003cspan class=\"en\">But the apples\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 떨어졌습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003cspan class=\"tgt\">falling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바구니 밖으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">basket\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 사과들이 바구니 밖으로 계속 떨어졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뛰는 동안 사과가 바구니 밖으로 자꾸 떨어졌다는 말이에요. 빨리 뛰는 것이 오히려 \u003cb class=\"key\">손해\u003c/b>가 된다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">ing붙은 동사(동사-ing)\u003c/span> : 사과들이(the apples) + 계속했다(kept) + 떨어지기를(falling) : \"계속 떨어졌습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 떨어졌다(falling) + 바구니 밖으로(out of the basket) : \"바구니 밖으로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But the apples, 하지만 사과들이. kept falling, 계속 떨어졌습니다. out of the basket, 바구니 밖으로. 이 문장 전체를 해석하면, 하지만 사과들이 바구니 밖으로 계속 떨어졌습니다.","hl":"m"},{"n":31,"text":"청년이 열심히 뛰었는데도 사과가 자꾸 떨어졌다는 장면이에요. 서두르면 오히려 손해라는 걸 알려 주죠.","hl":"mn"},{"n":32,"text":"첫 번째, kept falling은 '계속 떨어졌다'라는 뜻이에요. keep 뒤에 falling을 붙이면 같은 일이 여러 번 일어난다는 느낌을 줘요. 두 번째, out of the basket은 '바구니 밖으로'라는 뜻이에요. out of는 안에서 밖으로 나가는 방향을 알려 주는 짝꿍 말이에요. 사과가 바구니 밖으로 떨어지는 모습을 그려 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 멈춰 서서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 주웠습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> picked up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과들을\u003c/span>\u003cspan class=\"en\">the apples.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 멈춰 서서 사과들을 주웠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청년이 뛰기를 멈추고 떨어진 사과를 하나하나 주웠다는 말이에요. 뛰던 일이 \u003cb class=\"key\">멈추는\u003c/b> 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그는(He) + 멈췄다(stopped) : \"그는 멈췄습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그는 멈췄다(He stopped) + 그리고(and) + 주웠다(picked up) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He stopped, 그는 멈춰 서서. and picked up, 그리고 주웠습니다. the apples, 사과들을. 이 문장 전체를 해석하면, 그는 멈춰 서서 사과들을 주웠습니다.","hl":"m"},{"n":34,"text":"청년이 뛰기를 멈추고 떨어진 사과를 주웠다는 장면이에요. 빨리 가려던 계획이 잠깐 멈춘 거죠.","hl":"mn"},{"n":35,"text":"첫 번째, stopped는 '멈췄다'라는 지난 일을 말해요. stop에 -ed를 붙였는데, 짧은 모음 뒤에서는 p를 한 번 더 써서 stopped가 된답니다. 두 번째, and는 두 가지 일을 이어 주는 말이에요. 멈췄다와 주웠다, 두 동작을 한 문장으로 묶어 줘요. 여러분도 and로 두 가지 행동을 이어서 말해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음 그는\u003c/span>\u003cspan class=\"en\">Then he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 뛰었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ran\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">again\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 그는 다시 뛰었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사과를 다 주운 뒤에 소년이 \u003cb class=\"key\">다시\u003c/b> 뛰기 시작했다는 뜻이에요. 한 번 실패했지만 또 뛰어 본 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그는(he) + 뛰었다(ran) : \"뛰었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 다시(again) + 뛰었다(ran) : \"다시, 또\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Then he, 그런 다음 그는. ran again, 다시 뛰었습니다. 이 문장 전체를 해석하면, 그런 다음 그는 다시 뛰었습니다.","hl":"m"},{"n":37,"text":"사과를 다 주운 다음에 소년이 다시 뛰었다는 뜻이에요.","hl":"mn"},{"n":38,"text":"먼저 동사 ran을 볼까요. 지난 일이라 과거형 ran을 썼어요. 그리고 run처럼 모양이 확 바뀌는 동사는 불규칙 동사라고 해요. 두 번째, again은 '다시, 또'라는 뜻으로 동작을 더 자세히 알려 주는 부사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사과들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">apples\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 떨어졌습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fell\u003c/span> again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사과들이 또 떨어졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 다시 뛰자 바구니 속 사과들이 또 바닥으로 떨어졌어요. 앞에서 한 번 떨어진 일이 또 일어난 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 말(복수)\u003c/span> : 사과 한 개(an apple) + 여러 개(the apples) : \"그 사과들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 떨어졌다(fell) : \"떨어졌습니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The apples, 그 사과들이. fell again, 또 떨어졌습니다. 이 문장 전체를 해석하면, 사과들이 또 떨어졌습니다.","hl":"m"},{"n":40,"text":"소년이 다시 뛰니까 사과들이 또 떨어졌다는 뜻이에요. 앞에서도 떨어졌는데 또 그런 거예요.","hl":"mn"},{"n":41,"text":"먼저 The apples를 볼까요. 사과가 여러 개라서 apple에 s를 붙인 복수 모양이에요. 그리고 fall의 과거형이 fell이라는 것도 기억해요. 이미 지나간 일이라 과거형 fell을 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 이것을 반복했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">repeated\u003c/span> this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 번\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">times\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 이것을 여러 번 반복했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뛰고 사과를 줍고 또 뛰는 일을 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">번\u003c/b> 되풀이했다는 뜻이에요. 그래서 집에 아주 늦게 도착했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그는(he) + 반복했다(repeated) : \"반복했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">숫자를 알려 주는 말(수량 표현)\u003c/span> : 많은(many) + 번(times) : \"여러 번\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"He repeated this, 그는 이것을 반복했습니다. many times, 여러 번. 이 문장 전체를 해석하면, 그는 이것을 여러 번 반복했습니다.","hl":"m"},{"n":43,"text":"뛰고 사과를 줍는 일을 여러 번 되풀이했다는 뜻이에요.","hl":"mn"},{"n":44,"text":"먼저 repeated를 봐요. 지나간 일이라 repeat에 d를 붙인 과거형이에요. 두 번째, many는 셀 수 있는 것이 많다는 뜻이고 times는 '번'이라서 many times는 여러 번이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내, 그는\u003c/span>\u003cspan class=\"en\">Finally, he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 도착했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got\u003c/span> home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, 그는 집에 도착했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사과를 여러 번 줍느라 멈췄지만 \u003cb class=\"key\">마침내\u003c/b> 집에 \u003cb class=\"key\">도착\u003c/b>했다는 뜻이에요. 앞의 여러 번 멈춘 일과 이어지는 결말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그는(he) + 도착했어요(got) + 집에(home) : \"도착했어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Finally, he, 마침내, 그는. got home, 집에 도착했어요.. 이 문장 전체를 해석하면, 마침내, 그는 집에 도착했습니다.","hl":"m"},{"n":46,"text":"이 문장은 그가 마침내 집에 도착했다는 뜻이에요. 여러 번 사과를 주웠지만 결국 집에 도착했다는 거예요.","hl":"mn"},{"n":47,"text":"여기서 got은 get의 과거형이에요. 지난 일을 말할 때는 get을 got으로 바꿔요. 그래서 '도착했어요'라는 지난 일이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 늦었어요.\u003c/span>\u003cspan class=\"en\">very late.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 매우 늦었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 집에 도착했지만 시간이 아주 \u003cb class=\"key\">늦었다\u003c/b>는 뜻이에요. 그래서 앞에서 열심히 뛰었지만 결과는 좋지 않았다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말(집에 도착) + 하지만(But) + 뒤말(아주 늦음) : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그때는(it) + 이었다(was) + 아주 늦은(very late) : \"아주 늦었어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"But it was, 하지만 그때는. very late, 아주 늦었어요.. 이 문장 전체를 해석하면, 하지만 매우 늦었습니다.","hl":"m"},{"n":49,"text":"이 문장은 집에 도착했지만 시간이 아주 늦었다는 뜻이에요. 그래서 앞에서 열심히 뛰었지만 결과는 좋지 않았다는 걸 보여 줘요.","hl":"mn"},{"n":50,"text":"먼저 But은 앞말과 반대되는 늦었다는 말을 이어 줘요. 그리고 was는 is의 과거형이고 be동사 친구예요. 지난 일을 말하니까 was를 써요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 이해(까닭 찾기)\u003c/span>\u003cspan class=\"lp-pill\">정답 뛰면 사과가 떨어져서 다시 줍느라 더 늦기 때문이에요.\u003c/span>\u003cdiv style=\"margin-top:8px\">노인의 말은 세 번째부터 다섯 번째 문장에 나와요. 뛰지 말고 걸으라고 했지요. 왜냐하면 뛰면 \u003cb class=\"key\">사과가 \u003c/b>\u003cb class=\"key\">떨어져서\u003c/b> 다시 줍느라 시간이 더 걸리기 때문이에요. 그래서 답은 \u003cb class=\"key\">걸어서\u003c/b> 가는 것이에요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>빨리 걷는 연습을 시키고 싶어서예요. — 노인은 연습 이야기를 하지 않았어요.\u003c/li>\u003cli>사과를 팔고 싶어서예요. — 노인은 사과를 사겠다는 말을 하지 않았어요.\u003c/li>\u003cli>집으로 가는 길을 몰라서예요. — 노인은 길을 묻는 젊은이에게 방법을 알려 주었어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":51,"text":"자, 이제 문제를 풀어 볼까요? 노인이 왜 뛰지 말고 걸으라고 했는지 생각해 보세요. 뛰면 사과가 떨어져서 다시 줍느라 시간이 더 걸리기 때문이에요. 그래서 정답은 걸어서 가는 것이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>한 젊은이가 사과 \u003cb class=\"key\">바구니\u003c/b>를 들고 집에 빨리 가려고 뛰었어요.\u003c/li>\u003cli>뛰면 사과가 자꾸 \u003cb class=\"key\">떨어져서\u003c/b> 다시 주워야 했어요.\u003c/li>\u003cli>서두르면 오히려 집에 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">늦게 \u003c/b>\u003cb class=\"key\">도착\u003c/b>할 수 있어요.\u003c/li>\u003cli>노인의 조언처럼 \u003cb class=\"key\">걸어서\u003c/b> 가는 것이 더 빨라요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Walking home without dropping apples is faster than running and dropping them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">한 젊은이가 사과 \u003cb class=\"key\">바구니\u003c/b>를 들고 집에 빨리 가려고 뛰었지만, 사과가 자꾸 \u003cb class=\"key\">떨어져서\u003c/b> 오히려 집에 늦게 도착했어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 우리는 서두르면 오히려 집에 더 늦게 도착할 수 있다는 것을 배웠어요. 중심 문장 It'll be faster와 keep falling 표현도 꼭 기억해 두세요. 여러분, 오늘 정말 잘했어요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
