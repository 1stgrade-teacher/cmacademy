<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch3 Unit 03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch3 Unit 03","audioDir":"3-03_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch3\u003cbr>Unit\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>The Cow Chooses Its Owner\u003c/h1>\u003ch2>소가 고른 주인\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>한 농부가 병이 든 소를 버렸지만, Raju가 그 소를 \u003cb class=\"key\">돌보아\u003c/b> 건강하게 만들었어요. 결국 소는 \u003cb class=\"key\">Raju\u003c/b>를 자신의 주인으로 결정했어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The cow chose Raju, who took good care of it, as its owner.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 영어 지문을 읽어 볼까요? 오늘은 Raju and the Farmer라는 이야기를 읽어요. 한 농부와 소, 그리고 Raju가 나오는 재미있는 이야기예요. 소가 누구를 주인으로 고를지 같이 알아봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">소는 영어로 cow라고 해요. 소가 주는 우유는 milk라고 하고, 옛날에는 아주 소중한 재산이었어요. 여러분이 아끼는 강아지나 인형을 생각해 보세요. 누가 정성껏 돌봐 주면 그 사람을 더 가까이 느끼지요. 그래서 동물도 자기를 \u003cb class=\"key\">돌봐 \u003c/b>\u003cb class=\"key\">주는\u003c/b> 사람을 기억한대요.\u003c/div>","segs":[{"n":2,"text":"소는 영어로 cow라고 해요. 소가 주는 우유는 milk라고 하고, 옛날에는 아주 소중한 재산이었어요. 여러분이 아끼는 강아지나 인형을 한번 떠올려 보세요. 누가 정성껏 돌봐 주면 그 사람이 더 가까이 느껴지지요? 여러분은 동물이 주인을 스스로 고를 수 있다고 생각해요? 오늘 이야기에서는 소가 직접 주인을 고른대요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>농부와 소\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>이 단계에서는 농부가 소를 키워요. 농부는 소에게서 \u003cb class=\"key\">우유\u003c/b>를 많이 얻었어요. 그 우유를 팔아 \u003cb class=\"key\">돈\u003c/b>도 벌었지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소가 아파요\u003csmall>문제 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그런데 소가 \u003cb class=\"key\">병\u003c/b>이 들어 우유를 만들지 못해요. 그래서 농부는 소를 \u003cb class=\"key\">버려요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Raju의 돌봄\u003csmall>바뀜 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>Raju는 소를 집으로 데려가 정성껏 \u003cb class=\"key\">돌봐요\u003c/b>. 소는 다시 건강해져 우유를 많이 만들어요. Raju는 그 우유를 팔아 \u003cb class=\"key\">부자\u003c/b>가 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>소의 선택\u003csmall>마무리 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>농부는 소를 되찾고 싶어서 마을 \u003cb class=\"key\">우두머리\u003c/b>에게 물어요. 우두머리는 소가 \u003cb class=\"key\">주인\u003c/b>을 결정할 거라고 말해요. 그리고 소는 \u003cb class=\"key\">Raju\u003c/b>에게 가요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 농부가 소를 버리는 장면에서 시작해서, 소가 자기 주인을 고르는 장면으로 끝나요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 농부와 소가 나와요. 농부는 소에게서 우유를 많이 얻었어요. 그 우유를 팔아서 돈도 벌었지요.","hl":"f0"},{"n":5,"text":"그런데 두 번째 단계에서 문제가 생겨요. 소가 병이 들어 우유를 더 만들지 못했어요. 그래서 농부는 소를 버렸어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 Raju가 나와요. Raju는 소를 발견하고 집으로 데려가서 정성껏 돌봤어요. 소는 다시 건강해져 우유를 많이 만들었고, Raju는 그 우유를 팔아 부자가 되었어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 농부가 Raju에 대해 듣고 소를 되찾고 싶어 해요. 두 사람은 마을의 우두머리에게 물었고, 우두머리는 소가 주인을 결정할 거라고 말했어요. 그리고 소는 Raju에게 갔답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서로 이어지는 글(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 농부가 소를 버린 일에서 시작해요. 가운데에서 Raju가 소를 \u003cb class=\"key\">돌보아\u003c/b> 건강하게 만들고, 끝에서 소가 \u003cb class=\"key\">Raju\u003c/b>를 골라요. 그래서 마지막 문장이 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 보여 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>앞 내용과 반대되는 일이 생겼다고 알려 줌\u003c/span>\u003cb>again (9)\u003c/b>\u003cspan>소가 다시 우유를 만들게 되었다고 알려 줌\u003c/span>\u003cb>will (14)\u003c/b>\u003cspan>앞으로 정해질 일을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a cow\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cow\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his cow\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>농부\u003c/th>\u003cth>Raju\u003c/th>\u003c/tr>\u003ctr>\u003ctd>소가 아프자 소를 버림\u003c/td>\u003ctd>소를 집으로 데려가 돌봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소를 잃고 아무것도 얻지 못함\u003c/td>\u003ctd>우유를 팔아 부자가 됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 이어지는 이야기예요. 중심 생각을 보여 주는 문장은 맨 끝에 있어요. 소가 Raju에게 갔다는 마지막 문장이 이 이야기의 중심 문장이지요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. 네 번째 문장의 But은 앞 내용과 반대되는 일이 생겼다고 알려 줘요. 아홉 번째 문장의 again은 소가 다시 우유를 만들게 되었다고 알려 주지요. 소를 가리키는 말이 the cow에서 it으로, 또 his cow로 바뀌는 것도 잘 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>cow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소, 암소\u003c/span>\u003c/div>\u003cdiv>\u003cb>got\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻었다(get의 과거형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>milk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우유\u003c/span>\u003c/div>\u003cdiv>\u003cb>sold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔았다(sell의 과거형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>made money\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돈을 벌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>became\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되었다(become의 과거형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈, 병든\u003c/span>\u003c/div>\u003cdiv>\u003cb>stopped\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>threw out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>내던지다, 버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>found\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견했다(find의 과거형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>took care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>better\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상태가 나아진, 더 나은\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>heard\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들었다(hear의 과거형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>back\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시, 되찾도록\u003c/span>\u003c/div>\u003cdiv>\u003cb>head\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우두머리\u003c/span>\u003c/div>\u003cdiv>\u003cb>village\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? farmer는 농부, sick은 아픈, threw out은 버리다, took care of는 돌보다라는 뜻이에요. rich는 부자인, decide는 결정하다라는 뜻이지요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003cspan class=\"a\">well\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rich\u003c/b>\u003cspan class=\"m\">부자인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wealthy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">found\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discovered\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lost\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">better\u003c/b>\u003cspan class=\"m\">더 나은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well\u003c/span>\u003cspan class=\"s\">nicer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">took care of\u003c/b>\u003cspan class=\"m\">돌보다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">looked after\u003c/span>\u003cspan class=\"s\">cared for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignored\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">choose\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. sick은 ill과 비슷하고 healthy와 반대예요. rich는 wealthy와 비슷하고 poor와 반대지요. found는 discovered와 비슷하고, took care of는 looked after와 비슷한 말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 농부가\u003c/span>\u003cspan class=\"en\">A farmer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소 한 마리를\u003c/span>\u003cspan class=\"en\">a cow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 농부가 소 한 마리를 가지고 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작이에요. \u003cb class=\"key\">농부\u003c/b> 한 사람이 \u003cb class=\"key\">소\u003c/b> 한 마리를 키우고 있었다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(A farmer) + 가졌다(had) + 무엇을(a cow) : \"가지고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A farmer, 한 농부가. had, 가지고 있었다. a cow, 소 한 마리를. 이 문장 전체를 해석하면, 한 농부가 소 한 마리를 가지고 있었습니다.","hl":"m"},{"n":13,"text":"이야기가 시작되는 문장이에요. 농부 한 사람이 소 한 마리를 키우고 있었다는 뜻이죠.","hl":"mn"},{"n":14,"text":"여기서 had는 have의 과거형이에요. 지금 하는 일이 아니라 이미 지나간 지난 일을 말할 때 쓰는 모양이에요. 그래서 이 이야기는 옛날에 있었던 일이라고 생각하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 얻었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 우유를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lots \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> milk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소에게서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그 소에게서 많은 우유를 얻었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농부가 소에게서 \u003cb class=\"key\">우유\u003c/b>를 아주 많이 \u003cb class=\"key\">얻었다\u003c/b>는 뜻이에요. 그래서 농부가 이익을 얻기 시작했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 얻었다(got) + 무엇을(lots of milk) : \"얻었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 nt의 과거형이에요. want는 원하다라는 뜻이고, 지난 일을 말할 때는 wanted라고 해요. 농부가 소를 다시 되찾고 싶어 했던 지난 마음을 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그와 Raju는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Raju\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우두머리에게 물었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> the head\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">village\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그와 Raju는 마을의 우두머리에게 물었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그와 Raju가 소의 주인 문제를 \u003cb class=\"key\">마을의 \u003c/b>\u003cb class=\"key\">우두머리\u003c/b>에게 가져가 물어봤다는 뜻이에요. 두 사람의 다툼을 마을 어른이 \u003cb class=\"key\">결정\u003c/b>하게 된 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 누가(He) + 그리고(and) + 누가(Raju) : \"그와 Raju\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 묻다(ask) + -ed = asked(물었습니다) : \"물었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·소속 짝꿍 말(전치사)\u003c/span> : the head + of + the village = 마을의 우두머리 : \"마을의\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"He and Raju, 그와 Raju는. asked the head, 우두머리에게 물었습니다. of the village, 마을의. 이 문장 전체를 해석하면, 그와 Raju는 마을의 우두머리에게 물었습니다.","hl":"m"},{"n":46,"text":"그와 Raju가 마을의 우두머리에게 물었어요. 소의 주인을 누가 차지할지 마을 어른에게 물어본 거예요.","hl":"mn"},{"n":47,"text":"첫 번째, He and Raju에서 and는 이어 주는 말이에요. 두 사람을 나란히 이어 줍니다. 두 번째, asked는 지난 일 말, 과거형이에요. ask에 -ed를 붙이면 물었습니다가 돼요. 세 번째, of the village는 마을의라는 뜻으로 앞의 the head를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우두머리는\u003c/span>\u003cspan class=\"en\">The head\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소가\u003c/span>\u003cspan class=\"en\">&quot;The cow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정할 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">decide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 주인을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">owner\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우두머리는 &quot;소가 자신의 주인을 결정할 것입니다.&quot;라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우두머리가 '소가 \u003cb class=\"key\">주인\u003c/b>을 직접 고르게 하자'고 말한 거예요. 사람이 아니라 소가 \u003cb class=\"key\">결정\u003c/b>한다는 재미있는 규칙을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 말하다(say) → said(말했습니다) : \"말했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 소가(The cow) + 할 것이다(will) + 정하다(decide) : \"결정할 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)의 소유격\u003c/span> : its(그것의) + owner(주인) = 자신의 주인 : \"자신의 주인\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The head, 우두머리는. said, 말했습니다. \"The cow, 소가. will decide, 결정할 것입니다. its owner.\", 자신의 주인을. 이 문장 전체를 해석하면, 우두머리는 \"소가 자신의 주인을 결정할 것입니다.\"라고 말했습니다.","hl":"m"},{"n":49,"text":"우두머리가 소가 주인을 직접 고르게 하자고 말했어요. 사람이 정하는 게 아니라 소가 정한다는 규칙을 알려 준 거예요.","hl":"mn"},{"n":50,"text":"첫 번째, said는 say의 과거형이에요. 지난 일이라서 said로 바뀌었어요. 두 번째, will decide에서 will은 도와주는 동사, 조동사예요. will 다음에는 동사원형 decide가 와요. 세 번째, its owner는 자신의 주인이라는 뜻이고, its는 소를 가리키는 대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소는\u003c/span>\u003cspan class=\"en\">The cow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갔습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Raju에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Raju\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소는 Raju에게 갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소가 Raju에게 걸어갔다는 뜻이에요. 소가 스스로 Raju를 \u003cb class=\"key\">주인\u003c/b>으로 고른 결말을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 가다(go) → went(갔습니다) : \"갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·방향 짝꿍 말(전치사)\u003c/span> : 갔습니다(went) + 에게(to) + Raju : \"Raju에게\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The cow, 소는. went, 갔습니다. to Raju, Raju에게. 이 문장 전체를 해석하면, 소는 Raju에게 갔습니다.","hl":"m"},{"n":52,"text":"소가 결국 Raju에게 갔어요. 소가 진짜 주인을 스스로 고른 셈이죠.","hl":"mn"},{"n":53,"text":"첫 번째, went는 go의 과거형이에요. 지난 일이라서 go가 went로 바뀌었어요. 두 번째, to Raju는 Raju에게라는 뜻이에요. to는 어디로 가는지 알려 주는 짝꿍 말이에요. 오늘 소가 고른 주인은 바로 Raju였네요. 참 잘했죠?","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">주제·교훈 파악\u003c/span>\u003cspan class=\"lp-pill\">정답 정성껏 돌봐 준 사람이 진짜 주인이 된다는 것\u003c/span>\u003cdiv style=\"margin-top:8px\">글의 끝에서 소가 \u003cb class=\"key\">Raju\u003c/b>에게 갔어요. 농부는 소가 아프자 버렸지만 Raju는 \u003cb class=\"key\">돌보아\u003c/b> 건강하게 만들었지요. 그래서 이 이야기의 \u003cb class=\"key\">교훈\u003c/b>은 돌봄이 주인을 만든다는 것이에요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>농부가 돈을 더 많이 벌었다는 내용은 글에 없어요.\u003c/li>\u003cli>소가 마을 우두머리를 골랐다는 말은 나오지 않아요.\u003c/li>\u003cli>Raju가 소를 훔쳤다는 내용은 글에 없어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":54,"text":"오늘의 문제도 함께 풀어 봐요. 이 이야기의 교훈을 묻는 문제예요. 농부는 소가 아프자 버렸지만 Raju는 정성껏 돌봤지요. 소는 결국 자기를 돌봐 준 Raju에게 갔어요. 그래서 정답은 정성껏 돌봐 준 사람이 진짜 주인이 된다는 것이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>농부는 소에게서 우유를 얻어 \u003cb class=\"key\">돈\u003c/b>을 벌었어요.\u003c/li>\u003cli>소가 병이 들자 농부는 소를 \u003cb class=\"key\">버렸어요\u003c/b>.\u003c/li>\u003cli>Raju는 소를 집에 데려가 \u003cb class=\"key\">돌보아\u003c/b> 건강하게 만들었어요.\u003c/li>\u003cli>결국 소는 자기를 돌봐 준 \u003cb class=\"key\">Raju\u003c/b>를 주인으로 골랐어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The cow chose Raju, who took good care of it, as its owner.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">한 농부가 병이 든 소를 버렸지만, Raju가 그 소를 \u003cb class=\"key\">돌보아\u003c/b> 건강하게 만들었어요. 결국 소는 \u003cb class=\"key\">Raju\u003c/b>를 자신의 주인으로 결정했어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 우리는 Raju and the Farmer 이야기를 읽었어요. 소가 주인을 고르는 장면이 정말 인상적이었죠? 여러분도 오늘 배운 표현들을 소리 내어 읽으며 복습해 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
