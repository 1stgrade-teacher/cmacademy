<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch1 Unit 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch1 Unit 02","audioDir":"1-02_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch1\u003cbr>Unit\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>The Polar Bear and the Panda\u003c/h1>\u003ch2>북극곰과 판다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 진흙에 빠진 \u003cb class=\"key\">북극곰\u003c/b>이 눈에 검은 원이 생겨 판다처럼 보여 \u003cb class=\"key\">판다\u003c/b>와 친구가 되었어요. 하지만 물속에 들어갔다 나온 뒤 다시 하얗게 변해서, 둘 다 \u003cb class=\"key\">곰\u003c/b>이라는 걸 알게 되었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even though they look different, a polar bear and a panda can be friends because they are both bears.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 판다와 북극곰이 친구가 되는 재미있는 이야기를 함께 읽어 볼 거예요. 진흙에 빠진 북극곰이 판다처럼 보여서 생긴 일이랍니다. 마지막에는 둘 다 곰이라서 친구가 된다는 따뜻한 이야기예요. 자, 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">북극곰은 아주 추운 북극에서 살아요. 그래서 눈처럼 하얀 털을 가지고 있죠. 판다는 중국의 따뜻한 대나무 숲에 살고, 눈 주위에 \u003cb class=\"key\">검은색\u003c/b> 동그라미가 있어요. 사는 곳이 달라서 두 동물은 만날 일이 거의 없답니다. 여러분이 \u003cb class=\"key\">교실\u003c/b>이 다른 친구와 운동장에서 만나 친구가 되는 것과 비슷해요. 참고로 fur는 털, bamboo는 대나무라는 뜻이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 알아 볼게요. 북극곰은 아주 추운 북극에서 살아요. 그래서 눈처럼 하얀 털을 가지고 있죠. 판다는 중국의 따뜻한 대나무 숲에 살고, 눈 주위에 검은색 동그라미가 있어요. 여러분이 교실이 다른 친구와 운동장에서 만나 친구가 되는 것과 비슷해요. 그런데 여러분, 하얀 북극곰이 진흙을 뒤집어쓰면 어떻게 보일까요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>진흙에 빠진 북극곰\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>어느 날, 북극곰 한 마리가 진흙에 빠졌어요. 그는 눈을 가렸는데, 눈 주위에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>이 생겼어요. 그래서 판다처럼 보였답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>판다와 친구가 되다\u003csmall>소개 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>그때 판다 한 마리가 와서 인사를 했어요. 그들은 친구가 되어 함께 놀았어요. 배가 고픈 북극곰에게 판다가 \u003cb class=\"key\">대나무\u003c/b>를 주었지만, 북극곰은 그것을 좋아하지 않았어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>물속에서 생긴 일\u003csmall>바뀜 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>북극곰이 물고기를 잡자고 했고, 둘은 물속으로 들어갔어요. 물속에서 북극곰은 다시 \u003cb class=\"key\">하얗게\u003c/b> 변했어요. 판다는 깜짝 놀라서 너는 판다가 아니구나 하고 말했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>둘 다 곰!\u003csmall>마무리 · 문장 14–15\u003c/small>\u003c/h4>\u003cp>북극곰은 나는 북극곰이라고 말했어요. 그리고 우리는 둘 다 \u003cb class=\"key\">곰\u003c/b>이라고 알려 주었어요. 생김새가 달라도 친구가 될 수 있다는 걸 보여 줘요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 진흙에서 시작해서 물속에서 끝나요. 그 흐름을 네 단계로 나눠 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 시작이에요. 어느 날, 북극곰 한 마리가 진흙에 빠졌어요. 북극곰은 눈을 가렸는데, 눈 주위에 검은 원이 생겨서 판다처럼 보였답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 판다가 나타나요. 판다가 와서 인사를 하고, 둘은 친구가 되어 함께 놀았어요. 배가 고픈 북극곰에게 판다가 대나무를 주었지만, 북극곰은 그것을 좋아하지 않았어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 일이 바뀌어요. 북극곰이 물고기를 잡자고 했고, 둘은 물속으로 들어갔어요. 물속에서 북극곰은 다시 하얗게 변했고, 판다는 깜짝 놀랐어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 마무리예요. 판다가 너는 판다가 아니구나 하고 말했죠. 북극곰은 나는 북극곰이라고 대답했어요. 그리고 둘 다 곰이라서 우리는 친구라고 알려 줬답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 어느 날로 시작해서 일이 일어난 순서대로 이어져요. 그래서 시간의 흐름을 따라 읽으면 내용이 잘 보여요. 마지막 문장에서 둘 다 \u003cb class=\"key\">곰\u003c/b>이라는 중심 생각을 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>이야기 시작을 알려 줌\u003c/span>\u003cb>Then (4)\u003c/b>\u003cspan>다음 일을 알려 줌\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>But (15)\u003c/b>\u003cspan>마지막에 중심 생각을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a polar bear\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">You\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I'm a polar bear\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>판다\u003c/th>\u003cth>북극곰\u003c/th>\u003c/tr>\u003ctr>\u003ctd>눈에 검은 원이 있어요\u003c/td>\u003ctd>털이 하얗고 몸이 커요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대나무를 좋아해요\u003c/td>\u003ctd>대나무를 싫어해요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 쓰인 이야기예요. 중심이 되는 생각은 맨 끝 문장에 나와요. 생김새가 달라도 둘 다 곰이라는 것이 이 이야기의 중심이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. One day는 이야기의 시작을 알려 주고, Then은 다음 일을 이어 줘요. But은 앞 내용과 반대되는 내용을 알려 주죠. 그리고 같은 북극곰을 a polar bear, He, him, I처럼 여러 가지 말로 부른다는 것도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넘어졌다, 빠졌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mud\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>covered\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가렸다, 덮었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>circle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동그라미, 원\u003c/span>\u003c/div>\u003cdiv>\u003cb>came\u003c/b>\u003cem>동사\u003c/em>\u003cspan>왔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say hello\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>became\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>bamboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>gave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>동사\u003c/em>\u003cspan>좋아하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물고기를 잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>went into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~속으로 들어갔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물\u003c/span>\u003c/div>\u003cdiv>\u003cb>turned\u003c/b>\u003cem>동사\u003c/em>\u003cspan>변했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>again\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>both\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>둘 다의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. fell은 넘어지거나 빠졌다는 뜻이고, mud는 진흙이에요. bamboo는 대나무, hungry는 배고픈이라는 뜻이에요. surprised는 놀란, together는 함께라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fell\u003c/b>\u003cspan class=\"m\">빠졌다, 넘어졌다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dropped\u003c/span>\u003cspan class=\"s\">slipped\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">got up\u003c/span>\u003cspan class=\"a\">stood up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">like\u003c/b>\u003cspan class=\"m\">좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprised\u003c/b>\u003cspan class=\"m\">놀란\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shocked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">together\u003c/b>\u003cspan class=\"m\">함께\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">with each other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alone\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">friends\u003c/b>\u003cspan class=\"m\">친구들\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pals\u003c/span>\u003cspan class=\"s\">buddies\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enemies\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. like는 enjoy나 love와 비슷하고, hate나 dislike와 반대예요. hungry는 starving과 비슷하고 full과 반대죠. together는 with each other와 비슷하고 alone과 반대예요. surprised는 shocked와 비슷하고 calm과 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰 한 마리가\u003c/span>\u003cspan class=\"en\">a polar bear\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진흙에 빠졌습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">fell\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mud\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 북극곰 한 마리가 진흙에 빠졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">시작\u003c/b>을 알려 주는 문장이에요. 북극곰이 \u003cb class=\"key\">진흙\u003c/b>에 빠지면서 재미있는 일이 시작된다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(a polar bear) + 했다(fell) + 어디에(in the mud) : \"빠졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 어디에(in) + 무엇에(the mud) : \"진흙 속에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One day, 어느 날. a polar bear, 북극곰 한 마리가. fell in the mud, 진흙에 빠졌습니다. 이 문장 전체를 해석하면, 어느 날, 북극곰 한 마리가 진흙에 빠졌습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작을 알려 줘요. 어느 날 북극곰이 진흙에 빠졌다는 거죠. 그래서 어떤 재미있는 일이 생길지 궁금해지는 거예요.","hl":"mn"},{"n":14,"text":"먼저 지난 일을 말하는 모습을 봐요. fall은 빠지다라는 뜻인데, 지난 일이라서 fell로 바뀌었어요. 이것은 규칙대로 만든 과거형이 아니라서 꼭 외워 두면 좋아요. 그리고 in은 장소를 알려 주는 전치사예요. 그래서 in the mud는 진흙 속에라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가렸습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">covered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 눈을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">eyes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 눈을 가렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰이 \u003cb class=\"key\">눈\u003c/b>을 가렸다는 뜻이에요. 눈에 진흙이 들어가지 않게 \u003cb class=\"key\">가린\u003c/b> 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 했다(covered) + 무엇을(his eyes) : \"가렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">누구의 것(소유격)\u003c/span> : 누구의(his) + 무엇을(eyes) : \"그의 눈을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He covered, 그는 가렸습니다. his eyes, 그의 눈을. 이 문장 전체를 해석하면, 그는 눈을 가렸습니다.","hl":"m"},{"n":16,"text":"북극곰이 눈을 가렸다는 뜻이에요. 진흙이 눈에 들어가지 않게 손으로 가린 거죠. 눈을 감싸 보호한 거예요.","hl":"mn"},{"n":17,"text":"먼저 covered를 볼까요? cover에 ed를 붙여서 과거형 covered를 만들었어요. 지난 일이라서 이렇게 말해요. 그리고 his는 그의라는 소유격이에요. 누구의 눈인지 알려 주는 말이죠. 그래서 his eyes는 그의 눈이라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 눈에는\u003c/span>\u003cspan class=\"en\">His eyes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 원이 생겼습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> black circles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">pandas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 눈에는 판다처럼 검은 원이 생겼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 눈 주위에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>이 생겨서 꼭 \u003cb class=\"key\">판다\u003c/b>처럼 보였다는 뜻이에요. 그래서 다음에 판다가 인사하러 오는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(His eyes) + 가졌다(had) + 무엇을(black circles) : \"가지고 있었다(생겼다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">처럼 말하는 말(전치사)\u003c/span> : 무엇처럼(like) + 무엇(pandas) : \"판다처럼\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"His eyes, 그의 눈에는. had black circles, 검은 원이 생겼습니다. like pandas, 판다처럼. 이 문장 전체를 해석하면, 그의 눈에는 판다처럼 검은 원이 생겼습니다.","hl":"m"},{"n":19,"text":"눈 주위에 검은 원이 생겨서 꼭 판다처럼 보였다는 뜻이에요. 그래서 다음 장면에서 진짜 판다가 인사하러 오는 거죠.","hl":"mn"},{"n":20,"text":"먼저 had를 볼까요? have의 과거형은 had예요. 가지고 있었다라는 뜻인데, 여기서는 검은 원이 생겼다로 해석해요. 그리고 like는 여기서 판다처럼이라는 뜻이에요. ~처럼이라고 기억해 두면 아주 좋아요. 여러분도 오늘 문장 세 개를 자신 있게 읽을 수 있겠죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 판다 한 마리가\u003c/span>\u003cspan class=\"en\">Then a p\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>a\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">와서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came\u003c/span> and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인사를 했습니다.\u003c/span>\u003cspan class=\"en\">said hello.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 판다 한 마리가 와서 인사를 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다 한 마리가 와서 북극곰에게 먼저 인사하는 장면이에요. 이야기에 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">친구\u003c/b>가 등장하는 부분이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 동작1(came) + and(그리고) + 동작2(said) : \"그리고, 와서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 판다(a panda) + came(왔어요) : \"왔어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Then a panda, 그때 판다 한 마리가. came and, 와서. said hello, 인사를 했습니다.. 이 문장 전체를 해석하면, 그때 판다 한 마리가 와서 인사를 했습니다.","hl":"m"},{"n":22,"text":"이 문장은 판다 한 마리가 와서 북극곰에게 인사하는 장면이에요. 이야기에 새 친구가 등장하는 부분이죠.","hl":"mn"},{"n":23,"text":"먼저 came은 '오다'의 과거형이에요. 이미 지난 일이라 came이라고 말해요. 그리고 and는 두 동작을 이어 주는 말이에요. '와서'와 '말했어요'를 한 문장으로 묶어 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 친구가 되어\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 함께 놀았습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> played together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 친구가 되어 함께 놀았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰과 판다가 서로 친구가 되어 함께 노는 장면이에요. 둘의 \u003cb class=\"key\">우정\u003c/b>이 시작되는 부분이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그들은(They) + became(되었어요) + friends(친구가) : \"되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 동작1(became friends) + and + 동작2(played together) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They became friends, 그들은 친구가 되어. and played together, 그리고 함께 놀았습니다.. 이 문장 전체를 해석하면, 그들은 친구가 되어 함께 놀았습니다.","hl":"m"},{"n":25,"text":"이 문장은 북극곰과 판다가 친구가 되어 함께 노는 장면이에요. 둘의 우정이 시작되는 부분이죠.","hl":"mn"},{"n":26,"text":"먼저 became은 '되다'의 과거형이에요. 그래서 이미 친구가 된 지난 일을 말해요. 그리고 and는 두 동작을 이어 줘요. 친구가 된 일과 함께 논 일을 자연스럽게 연결해 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk 는 \u003cb class=\"key\">먹이\u003c/b> 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The panda) + 주었다(gave) + 무엇을(bamboo) : \"주었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 준다(gave) + 무엇을(bamboo) + 누구에게(to him) : \"그에게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The panda, 그 판다는. gave bamboo, 대나무를 주었습니다. to him, 그에게. 이 문장 전체를 해석하면, 판다는 그에게 대나무를 주었습니다.","hl":"m"},{"n":31,"text":"배고픈 북극곰에게 판다가 대나무를 건넸어요. 북극곰이 이 먹이를 좋아할지 정말 궁금해지는 장면이죠.","hl":"mn"},{"n":32,"text":"먼저 gave를 볼까요. give의 지난 일 모양은 gave예요. 이미 지나간 일이라 과거형으로 말한답니다. 그리고 to him은 그에게, 라는 뜻이에요. 어디로 가는지 방향을 알려 주는 짝꿍 말이죠. 누구에게 주는지 to him으로 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 좋아하지 않았습니다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그는 그것을 좋아하지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다가 준 \u003cb class=\"key\">대나무\u003c/b>를 북극곰이 좋아하지 않았어요. 그래서 다음에는 다른 걸 찾고 싶은 \u003cb class=\"key\">마음\u003c/b>이 들었겠죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">안 ~했다고 말하기(부정문)\u003c/span> : 누가(he) + 안 했다(didn't) + 좋아하다(like) : \"좋아하지 않았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 가리키는 것(it) = bamboo : \"그것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, 하지만. he didn't like, 그는 좋아하지 않았습니다. it, 그것을. 이 문장 전체를 해석하면, 하지만 그는 그것을 좋아하지 않았습니다.","hl":"m"},{"n":34,"text":"판다가 준 대나무를 북극곰이 좋아하지 않았어요. 그래서 다음에는 다른 걸 찾고 싶은 마음이 들었겠죠.","hl":"mn"},{"n":35,"text":"먼저 didn't를 봐요. 지난 일을 안 했다고 말할 때는 didn't를 써요. 그리고 didn't 뒤에 오는 동사는 like처럼 동사원형으로 돌아간답니다. 마지막으로 it은 앞에 나온 bamboo를 가리키는 대명사예요. 그래서 그것을, 이라고 짧게 말하는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기를 잡자\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">fish\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 &quot;물고기를 잡자!&quot;라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰이 판다에게 같이 \u003cb class=\"key\">물고기\u003c/b>를 잡자고 했어요. 둘이 함께 \u003cb class=\"key\">물\u003c/b>로 가는 이야기가 여기서 시작되는 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 말했다(said) : \"말했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">같이 하자고 말하기(Let's)\u003c/span> : 우리 같이 하자(Let's) + 물고기 잡기(fish) : \"물고기를 잡자\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He said, 그는 말했습니다. \"Let's fish!\", 물고기를 잡자. 이 문장 전체를 해석하면, 그는 \"물고기를 잡자!\"라고 말했습니다.","hl":"m"},{"n":37,"text":"북극곰이 판다에게 같이 물고기를 잡자고 했어요. 둘이 함께 물로 가는 이야기가 여기서 시작되는 장면이죠.","hl":"mn"},{"n":38,"text":"먼저 said는 say의 과거형이에요. 이미 한 말이라 과거형으로 써요. 그리고 Let's는 우리 같이 하자, 라는 뜻이에요. 친구에게 같이 하자고 할 때 딱 좋은 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰과\u003c/span>\u003cspan class=\"en\">The polar bear \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다는\u003c/span>\u003cspan class=\"en\">the panda\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들어갔습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">went\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극곰과 판다는 물속으로 들어갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰과 판다가 함께 \u003cb class=\"key\">물속\u003c/b>으로 들어갔다는 뜻이에요. 이 장면에서 북극곰의 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">모습\u003c/b>이 곧 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A and B = A와 B : \"그리고, ~와\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 가다(go)의 지난 모습은 went : \"들어갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : into + 장소 = ~속으로 : \"물속으로\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The polar bear and, 북극곰과. the panda, 판다는. went into, 들어갔습니다. the water, 물속으로. 이 문장 전체를 해석하면, 북극곰과 판다는 물속으로 들어갔습니다.","hl":"m"},{"n":40,"text":"이 문장은 북극곰과 판다가 함께 물속으로 들어갔다는 뜻이에요. 바로 이 장면에서 북극곰의 진짜 모습이 곧 드러나죠.","hl":"mn"},{"n":41,"text":"먼저 and는 북극곰과 판다를 이어 주는 말이에요. 두 번째로 went는 go의 과거형이에요. 지난 일이라 went를 써요. 세 번째로 into는 안으로라는 뜻으로 물속을 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰은 변했습니다\u003c/span>\u003cspan class=\"en\">The polar bear \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 하얗게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">white\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">again\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극곰은 다시 하얗게 변했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰 몸에 묻었던 \u003cb class=\"key\">진흙\u003c/b>이 물에서 씻겨서 \u003cb class=\"key\">하얀 \u003c/b>\u003cb class=\"key\">털\u003c/b>이 다시 보인다는 뜻이에요. 이야기의 중요한 변화가 일어나는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 변하다(turn)의 지난 모습은 turned : \"변했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">색을 말하는 꾸며 주는 말(형용사)\u003c/span> : white = 하얀, 하얗게 : \"하얗게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">다시를 말하는 더 자세히 알려 주는 말(부사)\u003c/span> : again = 다시 : \"다시\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The polar bear turned, 북극곰은 변했습니다. white again, 다시 하얗게. 이 문장 전체를 해석하면, 북극곰은 다시 하얗게 변했습니다.","hl":"m"},{"n":43,"text":"이 문장은 북극곰 몸에 묻었던 진흙이 물에서 씻겨서 하얀 털이 다시 보인다는 뜻이에요. 이야기에서 북극곰의 진짜 모습이 드러나는 중요한 장면이죠.","hl":"mn"},{"n":44,"text":"먼저 turned는 turn의 과거형이에요. 지난 일이라 turned를 써요. 두 번째로 white는 색을 말하는 형용사예요. 북극곰이 하얗게 변한 상태를 알려 주죠. 세 번째로 again은 다시라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다는\u003c/span>\u003cspan class=\"en\">The panda\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀랐습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">판다는 놀랐습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다가 북극곰의 하얀 모습을 보고 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">놀랐다\u003c/b>는 뜻이에요. 앞에서 판다는 북극곰을 \u003cb class=\"key\">판다\u003c/b>라고 생각했기 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 지난 모습(be동사)\u003c/span> : 주어 + was = ~였습니다, ~한 상태였습니다 : \"~였습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 말하는 꾸며 주는 말(형용사)\u003c/span> : be + surprised = 놀란 상태이다 : \"놀란\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The panda, 판다는. was surprised, 놀랐습니다. 이 문장 전체를 해석하면, 판다는 놀랐습니다.","hl":"m"},{"n":46,"text":"이 문장은 판다가 북극곰의 하얀 모습을 보고 깜짝 놀랐다는 뜻이에요. 앞에서 판다는 북극곰을 판다라고 생각했기 때문이죠.","hl":"mn"},{"n":47,"text":"먼저 was는 be동사의 지난 모습이에요. 지난 일을 말할 때 is 대신 was를 써요. 두 번째로 surprised는 놀란 감정을 말하는 형용사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 ~이 아니야\u003c/span>\u003cspan class=\"en\">&quot;You \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다!\u003c/span>\u003cspan class=\"en\">a panda!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 &quot;너는 판다가 아니구나!&quot;라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다인 줄 알았던 친구가 물속에서 하얗게 변하자 \u003cb class=\"key\">놀라서\u003c/b> 하는 말이에요. \u003cb class=\"key\">판다가 \u003c/b>\u003cb class=\"key\">아니야\u003c/b> 하고 알아챈 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 말하다(say) + 지난 일 → 말했어요(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 부정문(be동사 부정문)\u003c/span> : 너는(You) + ~이 아니야(are not) + 판다(a panda) : \"~이 아니야\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"He said, 그는 말했어요. \"You are not, 너는 ~이 아니야. a panda!\", 판다!. 이 문장 전체를 해석하면, 그는 \"너는 판다가 아니구나!\"라고 말했습니다.","hl":"m"},{"n":49,"text":"이 문장은 판다가 놀라서 하는 말이에요. 물속에서 하얗게 변한 친구를 보고 판다가 아니야 하고 알아챈 거죠.","hl":"mn"},{"n":50,"text":"첫 번째, said는 say의 과거형이에요. 이미 지난 일이라서 과거형으로 바뀐 거예요. 그리고 say는 규칙이 아니라 불규칙으로 변한답니다. 두 번째, are not은 be동사 뒤에 not을 붙인 부정문이에요. 그래서 너는 판다가 아니야라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰은\u003c/span>\u003cspan class=\"en\">The polar bear\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했어요\u003c/span>\u003cspan class=\"en\">said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~이야\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">polar \u003c/span>\u003cspan class=\"tgt\">bear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극곰은 &quot;나는 북극곰이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물속에서 하얗게 돌아온 북극곰이 \u003cb class=\"key\">정체\u003c/b>를 밝히는 말이에요. \u003cb class=\"key\">나는 \u003c/b>\u003cb class=\"key\">북극곰이야\u003c/b>라고 스스로 소개하는 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 줄임말(be동사 축약)\u003c/span> : 나는(I) + 이다(am) → 나는 ~이야(I'm) : \"나는 ~이야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">셀 수 있는 명사 앞 a(부정관사 a)\u003c/span> : 하나의(a) + 북극곰(polar bear) : \"북극곰 한 마리\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The polar bear, 북극곰은. said, 말했어요. \"I'm a, 나는 ~이야. polar bear, 북극곰.. 이 문장 전체를 해석하면, 북극곰은 \"나는 북극곰이야.","hl":"m"},{"n":52,"text":"물속에서 하얗게 돌아온 북극곰이 자기 정체를 밝히는 말이에요. 나는 북극곰이야 하고 소개하는 장면이죠.","hl":"mn"},{"n":53,"text":"첫 번째, I'm은 I am을 짧게 줄인 말이에요. 친구끼리 말할 때 아주 자주 써요. 두 번째, 셀 수 있는 명사 하나 앞에는 a를 붙여요. 여기서는 북극곰 한 마리라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리는 ~이야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> we are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘 다 곰!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both\u003c/span> bears!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리는 둘 다 곰이야!&quot;라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉모습은 달라도 북극곰과 판다는 \u003cb class=\"key\">둘 \u003c/b>\u003cb class=\"key\">다 \u003c/b>\u003cb class=\"key\">곰\u003c/b>이라고 말해요. \u003cb class=\"key\">친구\u003c/b>가 된 두 곰의 마음이 보이는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 하지만(But) + 뒷말 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">둘 다(both)\u003c/span> : 둘 다(both) + 명사(bears) : \"둘 다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"But we are, 하지만 우리는 ~이야. both bears!, 둘 다 곰!. 이 문장 전체를 해석하면, 하지만 우리는 둘 다 곰이야!\"라고 말했습니다.","hl":"m"},{"n":55,"text":"겉모습은 달라도 북극곰과 판다는 둘 다 곰이에요. 친구가 된 두 곰의 마음이 보이는 문장이에요.","hl":"mn"},{"n":56,"text":"첫 번째, But은 앞에서 한 말과 반대되는 생각을 이어 주는 말이에요. 두 번째, both는 두 친구 모두를 가리킬 때 써요. 그래서 북극곰과 판다, 둘 다 곰이라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 이해하기(이유 찾기)\u003c/span>\u003cspan class=\"lp-pill\">정답 북극곰이 물속에서 나오자 눈의 검은 원이 지워져 다시 하얀 북극곰이 되었기 때문이에요.\u003c/span>\u003cdiv style=\"margin-top:8px\">판다는 12번 문장에서 \u003cb class=\"key\">놀랐\u003c/b>다고 말해요. 바로 앞 11번 문장을 보면 북극곰이 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">하얗게\u003c/b> 변했어요. 그래서 너는 판다가 아니구나 하고 말한 거예요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>대나무를 싫어해서는 놀란 이유가 아니에요. 그건 8번 문장의 다른 내용이에요.\u003c/li>\u003cli>물고기를 잡자고 해서는 놀란 이유가 아니에요. 그건 9번 문장의 제안이에요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":57,"text":"이제 문제를 풀어 볼게요. 판다는 왜 놀랐을까요? 바로 앞 문장에서 북극곰이 물속에서 나와 다시 하얗게 변했어요. 그 모습을 보고 판다는 정말 놀랐고, 너는 판다가 아니구나 하고 말한 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>진흙에 빠진 \u003cb class=\"key\">북극곰\u003c/b>이 눈에 검은 원이 생겨 판다처럼 보였어요.\u003c/li>\u003cli>판다가 \u003cb class=\"key\">대나무\u003c/b>를 주었지만 북극곰은 좋아하지 않았어요.\u003c/li>\u003cli>물속에 들어갔다 나오자 북극곰은 다시 \u003cb class=\"key\">하얗게\u003c/b> 변했어요.\u003c/li>\u003cli>둘 다 \u003cb class=\"key\">곰\u003c/b>이라서 서로 친구가 될 수 있었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even though they look different, a polar bear and a panda can be friends because they are both bears.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 진흙에 빠진 \u003cb class=\"key\">북극곰\u003c/b>이 눈에 검은 원이 생겨 판다처럼 보여 \u003cb class=\"key\">판다\u003c/b>와 친구가 되었어요. 하지만 물속에 들어갔다 나온 뒤 다시 하얗게 변해서, 둘 다 \u003cb class=\"key\">곰\u003c/b>이라는 걸 알게 되었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"오늘 우리는 판다와 북극곰 이야기를 읽었어요. 진흙 때문에 판다처럼 보였던 북극곰이 물속에서 원래 모습을 찾았죠. 그래도 둘 다 곰이라서 친구가 될 수 있었어요. 여러분도 서로 달라도 친구가 될 수 있다는 것, 잊지 마세요. 오늘 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
