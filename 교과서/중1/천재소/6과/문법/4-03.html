<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch4 Unit 03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch4 Unit 03","audioDir":"4-03_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch4\u003cbr>Unit\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Fox Fire: Another Name for the Aurora\u003c/h1>\u003ch2>여우불: 오로라의 또 다른 이름\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>오로라는 핀란드에서 \u003cb class=\"key\">여우불\u003c/b>이라는 또 다른 이름을 가지고 있어요. 옛날 이야기 속 \u003cb class=\"key\">불여우\u003c/b>들이 하늘을 달리거나 눈 속을 달리며 \u003cb class=\"key\">오로라\u003c/b>를 만든다고 해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>In Finland, the aurora is called &quot;fox fire,&quot; and old stories tell how fire foxes make it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 핀란드의 밤하늘에 관한 재미있는 글을 읽어 볼 거예요. 제목은 Fox Fire, 우리말로는 여우불이에요. 오로라를 여우불이라고 부르는 이유와 두 가지 옛날 이야기를 함께 알아봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">오로라는 밤하늘에 초록색·보라색 빛이 커튼처럼 펼쳐지는 멋진 자연 현상이에요. 영어로는 \u003cb class=\"key\">aurora\u003c/b>(오로라)라고 해요. 북쪽 나라인 핀란드 사람들은 이 빛을 \u003cb class=\"key\">여우불\u003c/b>(fox fire)이라고도 불러요. 옛날 사람들은 하늘의 빛을 보고 '여우가 꼬리로 만든 빛'이라고 상상했어요. 우리가 구름을 보고 '강아지 같다!' 하고 상상하는 것과 같은 거예요.\u003c/div>","segs":[{"n":2,"text":"밤하늘에 초록색과 보라색 빛이 커튼처럼 펼쳐지는 모습을 본 적 있나요? 그 멋진 빛을 영어로 aurora, 오로라라고 해요. 북쪽 나라 핀란드에서는 이 빛을 여우불, fox fire라고도 불러요. 옛날 사람들은 하늘의 빛을 보고 여우가 꼬리로 만든 빛이라고 상상했어요. 여러분도 구름을 보고 강아지 같다고 상상한 적 있죠? 그런 재미있는 상상이 옛날 이야기가 된 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이름 소개\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>핀란드에서는 오로라를 \u003cb class=\"key\">여우불\u003c/b>이라고 불러요. 옛날 이야기 속 \u003cb class=\"key\">불여우\u003c/b>가 여우불을 만들었다고 해요. 그리고 그 이야기는 두 가지로 나뉜다고 알려 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>하늘을 달리는 불여우\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>한 이야기에서 \u003cb class=\"key\">불여우\u003c/b>들은 하늘을 가로질러 아주 빠르게 달려요. 그들의 \u003cb class=\"key\">꼬리\u003c/b>가 산들을 스치면 \u003cb class=\"key\">불꽃\u003c/b>이 튀어요. 그 불꽃이 하늘을 환하게 밝혀요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>눈 속을 달리는 불여우\u003csmall>바뀜 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>다른 이야기에서는 \u003cb class=\"key\">불여우\u003c/b>들이 눈 속을 달려요. \u003cb class=\"key\">꼬리\u003c/b>가 들어 올린 \u003cb class=\"key\">눈송이\u003c/b>들이 하늘로 올라가요. 그 눈송이들이 \u003cb class=\"key\">달빛\u003c/b>을 받아 \u003cb class=\"key\">오로라\u003c/b>를 만들어 냬요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글의 흐름을 따라가 볼까요? 이 글은 이름을 소개하고, 두 가지 이야기를 차례대로 들려줘요.","hl":null},{"n":4,"text":"먼저 핀란드에서는 오로라를 여우불이라고 부른다고 알려 줘요. 그리고 옛날 이야기 속 불여우가 여우불을 만들었다고 해요. 여기서 불여우는 fire fox, 불을 다루는 여우라는 뜻이에요. 그리고 두 가지 다른 이야기가 있다고 살짝 알려 주지요.","hl":"f0"},{"n":5,"text":"첫 번째 이야기에서 불여우들은 하늘을 가로질러 아주 빠르게 달려요. 그들의 꼬리가 산들을 스치면 불꽃이 튀어요. 그 불꽃이 하늘을 환하게 밝힌다고 해요. 상상만 해도 정말 멋지죠?","hl":"f1"},{"n":6,"text":"두 번째 이야기에서는 불여우들이 눈 속을 달려요. 그런데 이번에는 꼬리가 눈송이를 들어 올려요. 눈송이들이 하늘로 올라가 달빛을 받으면 오로라가 만들어진대요. 여러분은 두 이야기 중에 어떤 이야기가 더 재미있나요?","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">두 가지 이야기를 비교하며 설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">\u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>인 네 번째 문장이 '두 가지 다른 이야기가 있다'고 알려 줘요. 그래서 앞부분에서는 이름을 소개하고, 뒷부분에서는 두 이야기를 \u003cb class=\"key\">비교\u003c/b>해서 들려줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In one story (5)\u003c/b>\u003cspan>첫 번째 이야기가 시작됨을 알려 줌\u003c/span>\u003cb>In the other story (9)\u003c/b>\u003cspan>다른 이야기가 시작됨을 알려 줌\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>앞과 다른 내용으로 바뀜을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Aurora\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fox fire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fox fires\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fire foxes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">auroras\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>하늘을 달리는 이야기\u003c/th>\u003cth>눈 속을 달리는 이야기\u003c/th>\u003c/tr>\u003ctr>\u003ctd>꼬리가 산들을 스침\u003c/td>\u003ctd>꼬리가 눈송이들을 들어 올림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>불꽃이 하늘을 밝힘\u003c/td>\u003ctd>눈송이가 달빛을 받아 오로라를 만듦\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 두 가지 이야기를 비교하며 설명하는 글이에요. 중심 문장은 가운데에 있는 네 번째 문장, There are two different stories about them이에요. 이 문장이 글 전체가 무엇을 말할지 알려 주는 열쇠예요.","hl":"ty"},{"n":8,"text":"글의 길잡이 말을 찾아볼까요? In one story는 첫 번째 이야기가 시작된다는 신호이고, In the other story는 다른 이야기가 시작된다는 신호예요. 또 같은 대상을 Aurora, fox fire, fire foxes, auroras처럼 다르게 부르고 있으니 잘 살펴보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>another\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>또 다른, 또 하나의\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>fire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불\u003c/span>\u003c/div>\u003cdiv>\u003cb>fox\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여우\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른, 서로 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 관한\u003c/span>\u003c/div>\u003cdiv>\u003cb>run\u003c/b>\u003cem>동사\u003c/em>\u003cspan>달리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>tail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꼬리\u003c/span>\u003c/div>\u003cdiv>\u003cb>brush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>스치다, 쓸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mountain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산\u003c/span>\u003c/div>\u003cdiv>\u003cb>spark\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불꽃\u003c/span>\u003c/div>\u003cdiv>\u003cb>light up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>환하게 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>snow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈\u003c/span>\u003c/div>\u003cdiv>\u003cb>lift up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>들어 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>snowflake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈송이\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다, 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>moonlight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이제 오늘의 단어를 소리 내어 읽어 볼게요. another는 다른, through는 가로질러, brush는 스치다, spark는 불꽃이라는 뜻이에요. lift up은 들어 올리다, catch는 받다, moonlight는 달빛이에요. 큰 소리로 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">other\u003c/span>\u003cspan class=\"s\">unlike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠르게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">run\u003c/b>\u003cspan class=\"m\">달리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dash\u003c/span>\u003cspan class=\"s\">race\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">walk\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lift up\u003c/b>\u003cspan class=\"m\">들어 올리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">pick up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">put down\u003c/span>\u003cspan class=\"a\">lower\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들어 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">build\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"비슷한 말과 반대말도 함께 익혀 봐요. different는 other, unlike와 비슷하고 same과 반대예요. fast는 quick과 비슷하고 slow와 반대죠. run은 dash와 비슷하고 walk와 반대예요. lift up은 raise와 비슷하고 put down과 반대이고, create는 make와 비슷하고 break와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오로라는 가지고 있습니다\u003c/span>\u003cspan class=\"en\">Aurora \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 하나의 이름을\u003c/span>\u003cspan class=\"en\">another name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핀란드에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Finland\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오로라는 핀란드에서 또 하나의 이름을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오로라에게는 핀란드에서 부르는 \u003cb class=\"key\">또 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">이름\u003c/b>이 있다는 걸 알려 줘요. 글의 \u003cb class=\"key\">주제\u003c/b>를 살짝 꺼내는 첫 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 누가(Aurora) + 한다(has) + 무엇을(another name) : \"가지고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 말(전치사)\u003c/span> : in + 장소(Finland) : \"핀란드에서\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Aurora has, 오로라는 가지고 있습니다. another name, 또 하나의 이름을. in Finland, 핀란드에서. 이 문장 전체를 해석하면, 오로라는 핀란드에서 또 하나의 이름을 가지고 있습니다.","hl":"m"},{"n":12,"text":"이 문장은 오로라에게 핀란드에서 부르는 또 다른 이름이 있다고 말해요. 글의 주제를 살짝 꺼내는 첫 문장이지요.","hl":"mn"},{"n":13,"text":"첫 번째, has를 눈여겨봐요. Aurora는 한 사람이라서 have 대신 has를 써요. 두 번째, in Finland는 핀란드에서라는 장소를 알려 줘요. 나라 이름 앞에는 in을 붙인다고 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;여우불&quot;\u003c/span>\u003cspan class=\"en\">&quot;fox fire.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 &quot;여우불&quot;입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 또 다른 이름이 바로 \u003cb class=\"key\">여우불\u003c/b>이라고 알려 줘요. 짧지만 \u003cb class=\"key\">이름\u003c/b>을 콕 집어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap 기 속에서는 : \"한 이야기에서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 마리일 때 동사(단수·복수)\u003c/span> : 주어가 여럿이면(They) + 동사원형(run) : \"불여우들이 달립니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : through + 장소 = 장소를 가로질러 : \"하늘을 가로질러\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"In one story, 한 이야기에서는. fire foxes run, 불여우들이 달립니다. through the sky, 하늘을 가로질러. 이 문장 전체를 해석하면, 한 이야기에서는, 불여우들이 하늘을 가로질러 달립니다.","hl":"m"},{"n":24,"text":"두 가지 이야기 중에서 첫 번째 이야기를 소개하는 문장이에요. 불여우들이 하늘을 가로질러 달린다는 아주 신나는 장면이죠.","hl":"mn"},{"n":25,"text":"첫 번째, in은 이야기 속에서는이라는 뜻으로 쓰였어요. 두 번째, through는 하늘을 가로질러라는 뜻이에요. 세 번째, 주어가 여러 마리일 때는 동사에 s를 붙이지 않고 run 그대로 쓴다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 달립니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fast\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 빠르게 달립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불여우들이 얼마나 빠른지 알려 주는 문장이에요. 앞 문장의 \u003cb class=\"key\">하늘\u003c/b> 장면을 더 생생하게 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사) + 동사\u003c/span> : They(그들) + run(달린다) : \"그들은 달립니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 달린다(run) + 빠르게(fast) : \"빠르게\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"They run, 그들은 달립니다. fast, 빠르게. 이 문장 전체를 해석하면, 그들은 빠르게 달립니다.","hl":"m"},{"n":27,"text":"불여우들이 하늘을 아주 빠르게 달린다는 것을 알려 주는 문장이에요. 짧지만 장면이 확 살아나죠?","hl":"mn"},{"n":28,"text":"첫 번째, they는 앞에 나온 fire foxes를 대신하는 대명사예요. 그래서 동사에 s를 붙이지 않아요. 두 번째, fast는 빠르게라고 더 자세히 알려 주는 부사예요. 동사 뒤에 오는 모습을 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 꼬리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Their \u003c/span>\u003cspan class=\"tgt\">tails\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산들을 스칩니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brush \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mountains\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 꼬리가 산들을 스칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불여우의 \u003cb class=\"key\">꼬리\u003c/b>가 산을 살짝 스친다고 말해요. 다음에 불꽃이 생긴다는 이야기로 이어지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">누구의 것인지 알려 주는 말(소유격)\u003c/span> : 누구의(Their) + 무엇(tails) : \"그들의 꼬리들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하는 일 말 + 무엇을(동사 + 목적어)\u003c/span> : 누가(Their tails) + 한다(brush) + 무엇을(the mountains) : \"산들을 스친다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Their tails, 그들의 꼬리가. brush the mountains, 산들을 스칩니다. 이 문장 전체를 해석하면, 그들의 꼬리가 산들을 스칩니다.","hl":"m"},{"n":30,"text":"이 문장은 불여우의 꼬리가 산을 살짝 스친다고 말해요. 꼬리가 산을 스치면 어떤 일이 생길지 다음 문장에서 이어져요.","hl":"mn"},{"n":31,"text":"첫 번째, Their는 그들의라는 뜻으로 꼬리가 누구 것인지 알려 주는 소유격이에요. 두 번째, brush는 동사이고 the mountains는 목적어예요. 동사 뒤에 목적어가 오는 모양, 아주 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 불꽃을 만들고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">makes\u003c/span> sparks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 불꽃들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> those sparks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘을 환하게 만듭니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 불꽃을 만들고, 그 불꽃들이 하늘을 환하게 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불꽃이 생기고 그 불꽃이 하늘을 \u003cb class=\"key\">환하게\u003c/b> 밝힌다고 말해요. 앞에서 산을 스친 꼬리가 하늘을 빛나게 하는 결과를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(It) + 만든다(makes) + 무엇을(sparks) : \"그것은 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + and + 뒤 내용 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">하는 일 말 + 무엇을(동사 + 목적어)\u003c/span> : 그것들이(those sparks) + 밝힌다(light up) + 무엇을(the sky) : \"하늘을 환하게 밝히다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"It makes sparks, 그것은 불꽃을 만들고. and those sparks, 그리고 그 불꽃들이. light up the sky, 하늘을 환하게 만듭니다.. 이 문장 전체를 해석하면, 그것은 불꽃을 만들고, 그 불꽃들이 하늘을 환하게 만듭니다.","hl":"m"},{"n":33,"text":"이 문장은 불꽃이 생기고 그 불꽃이 하늘을 환하게 밝힌다고 말해요. 그래서 밤하늘이 반짝반짝 빛나게 되는 거예요.","hl":"mn"},{"n":34,"text":"첫 번째, It은 하나를 가리키니까 동사에 s를 붙여서 makes라고 해요. 두 번째, and는 앞 내용과 뒤 내용을 이어 주는 말이에요. 세 번째, light up은 환하게 만들다라는 동사 표현이고 뒤에 the sky가 와서 무엇이 밝아지는지 알려 줘요. 아주 잘 따라오고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이야기에서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">story\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불여우들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fire \u003c/span>\u003cspan class=\"tgt\">foxes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈 속에서 달립니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">run\u003c/span> in the snow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 이야기에서는, 불여우들이 눈 속에서 달립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 이야기에서는 불여우들이 \u003cb class=\"key\">눈\u003c/b> 위를 달린다고 말해요. 두 가지 이야기 중 다른 이야기를 소개하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : In + the other story(다른 이야기 안에서) : \"다른 이야기에서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개일 때 동사 그대로(단수·복수)\u003c/span> : 그것들(the fire foxes) + 달린다(run) : \"불여우들이 달린다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"In the other story, 다른 이야기에서는. the fire foxes, 불여우들이. run in the snow, 눈 속에서 달립니다.. 이 문장 전체를 해석하면, 다른 이야기에서는, 불여우들이 눈 속에서 달립니다.","hl":"m"},{"n":36,"text":"이 문장은 두 번째 이야기에서 불여우들이 눈 위를 달린다고 말해요. 앞의 하늘 이야기와는 다른 장면이 시작되는 거예요.","hl":"mn"},{"n":37,"text":"첫 번째, In은 안에서라는 뜻을 가진 전치사예요. 두 번째, 주어인 the fire foxes가 여러 마리라서 동사에 s를 붙이지 않고 run이라고 해요. 여러 개일 때는 동사를 그대로 쓴다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그들의 꼬리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">tails \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈송이들을 들어 올립니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">lift\u003c/span> up snowflakes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 그들의 꼬리가 눈송이들을 들어 올립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 두 번째 이야기에서 여우 꼬리가 눈송이를 위로 올린다고 말해요. 하늘로 올라가는 장면을 만들려고 \u003cb class=\"key\">꼬리\u003c/b>가 하는 일을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그런데(But) + 뒤 문장 : \"그런데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복수 주어 현재동사(일반동사 현재형)\u003c/span> : 그들의 꼬리들은(their tails) + 들어 올린다(lift) : \"그들의 꼬리가 들어 올려요\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"But their tails, 그런데 그들의 꼬리가. lift up snowflakes, 눈송이들을 들어 올립니다.. 이 문장 전체를 해석하면, 그런데 그들의 꼬리가 눈송이들을 들어 올립니다.","hl":"m"},{"n":39,"text":"이 문장은 두 번째 이야기에서 여우의 꼬리가 눈송이를 위로 올린다고 말해요. 하늘로 올라갈 준비를 하는 장면이죠.","hl":"mn"},{"n":40,"text":"첫 번째로 But은 앞 내용과 반대 느낌을 더해 주는 이어 주는 말이에요. 두 번째로 their tails는 복수 주어라서 동사 lift에 s를 붙이지 않아요. 지금 일어나는 일을 말하는 현재 문장이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 눈송이들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">snowflakes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘로 올라갑니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">go\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 눈송이들은 하늘로 올라갑니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 위로 올라간 눈송이들이 하늘로 간다고 말해요. 다음 문장에서 달빛을 만날 \u003cb class=\"key\">눈송이\u003c/b>의 움직임을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 주어 현재동사(일반동사 현재형)\u003c/span> : 그 눈송이들은(The snowflakes) + 간다(go) : \"그 눈송이들은 올라가요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : into + the sky : \"하늘 속으로\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"The snowflakes, 그 눈송이들은. go into the sky, 하늘로 올라갑니다.. 이 문장 전체를 해석하면, 그 눈송이들은 하늘로 올라갑니다.","hl":"m"},{"n":42,"text":"이 문장은 위로 올라간 눈송이들이 하늘로 간다고 말해요. 다음 장면에서 달빛을 만날 눈송이의 움직임을 보여 주죠.","hl":"mn"},{"n":43,"text":"먼저 The snowflakes는 복수 주어라서 동사 go에 s를 붙이지 않아요. 그리고 지금 일어나는 현재 일을 말하죠. 마지막으로 into the sky에서 into는 하늘이라는 장소를 가리키는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 받아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">catch \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달빛을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">moonlight\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 오로라를 만들어 냅니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">auroras\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 달빛을 받아 오로라를 만들어 냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 눈송이들이 달빛을 받아 오로라를 만든다고 말해요. 두 번째 이야기의 마지막 \u003cb class=\"key\">결과\u003c/b>를 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그것들은(They) + 받아요(catch) : \"그것들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 + 무엇을(목적어)\u003c/span> : 받아(catch) + 달빛을(the moonlight) : \"달빛을 받아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그리고(and) + 만들어 낸다(create) : \"그리고 오로라를 만들어 내요\"\u003c/div>\u003c/div>","segs":[{"n":44,"text":"They catch, 그것들은 받아. the moonlight, 달빛을. and create auroras, 그리고 오로라를 만들어 냅니다.. 이 문장 전체를 해석하면, 그것들은 달빛을 받아 오로라를 만들어 냅니다.","hl":"m"},{"n":45,"text":"이 문장은 눈송이들이 달빛을 받아 오로라를 만든다고 말해요. 두 번째 이야기의 마지막 결과를 알려 주죠.","hl":"mn"},{"n":46,"text":"먼저 They는 앞에 나온 눈송이들을 대신하는 대명사예요. catch the moonlight에서는 동사 catch 뒤에 목적어 the moonlight가 와요. and는 catch와 create 두 동작을 이어 주는 접속사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">주제 찾기\u003c/span>\u003cspan class=\"lp-pill\">정답 핀란드의 여우불(오로라)에 관한 두 가지 옛날 이야기\u003c/span>\u003cdiv style=\"margin-top:8px\">글은 처음에 오로라의 또 다른 이름인 \u003cb class=\"key\">여우불\u003c/b>을 소개해요. 그리고 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 차례대로 들려주지요. 그래서 이 글의 주제는 여우불에 관한 두 가지 옛날 이야기예요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>핀란드의 겨울 날씨는 글에 설명이 없어요.\u003c/li>\u003cli>산의 모양은 꼬리가 스치는 대상으로만 나와요.\u003c/li>\u003cli>눈송이가 만들어지는 과학 원리는 나오지 않아요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":47,"text":"이제 문제를 풀어 볼까요? 이 글의 주제를 묻는 문제예요. 글은 처음에 여우불이라는 이름을 알려 주고, 이어서 두 가지 이야기를 들려줘요. 그래서 정답은 핀란드의 여우불에 관한 두 가지 옛날 이야기예요. 겨울 날씨나 산의 모양, 눈이 만들어지는 원리는 이 글의 중심이 아니에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오로라는 핀란드에서 \u003cb class=\"key\">여우불\u003c/b>이라는 또 다른 이름을 가져요.\u003c/li>\u003cli>옛날 이야기 속 \u003cb class=\"key\">불여우\u003c/b>들이 여우불을 만든다고 해요.\u003c/li>\u003cli>한 이야기에서는 \u003cb class=\"key\">꼬리\u003c/b>가 산을 스쳐 \u003cb class=\"key\">불꽃\u003c/b>이 하늘을 밝혀요.\u003c/li>\u003cli>다른 이야기에서는 \u003cb class=\"key\">눈송이\u003c/b>가 \u003cb class=\"key\">달빛\u003c/b>을 받아 \u003cb class=\"key\">오로라\u003c/b>를 만들어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>In Finland, the aurora is called &quot;fox fire,&quot; and old stories tell how fire foxes make it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">오로라는 핀란드에서 \u003cb class=\"key\">여우불\u003c/b>이라는 또 다른 이름을 가지고 있어요. 옛날 이야기 속 \u003cb class=\"key\">불여우\u003c/b>들이 하늘을 달리거나 눈 속을 달리며 \u003cb class=\"key\">오로라\u003c/b>를 만든다고 해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 여러분은 오로라의 또 다른 이름인 여우불과 두 가지 옛날 이야기를 배웠어요. 불여우의 꼬리가 불꽃과 눈송이를 만들어 낸다는 상상이 정말 멋졌죠? 글을 읽을 때 두 이야기를 비교하며 읽는 방법도 꼭 기억해요. 오늘 정말 잘했어요, 다음에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
