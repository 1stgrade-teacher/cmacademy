<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch3 Unit 04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch3 Unit 04","audioDir":"3-04_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch3\u003cbr>Unit\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Cows: Giving Animals\u003c/h1>\u003ch2>소: 아낌없이 주는 동물\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>오래 전에는 사람들이 소고기를 먹지 않았고, 소는 그들의 삶에서 매우 중요했어요. 로마와 인도에서는 소를 \u003cb class=\"key\">신\u003c/b>과 관련시켰고, 농부들에게 소는 \u003cb class=\"key\">보물\u003c/b>처럼 일하고 우유를 주었으며, 아시아에서는 수레를 \u003cb class=\"key\">끌었어요\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A long time ago, cows were very important to people for many reasons.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 반가워요. 오늘은 소에 대한 아주 재미있는 글을 함께 읽어 볼 거예요. 제목은 Cows: Giving Animals, 소는 아낌없이 주는 동물이라는 뜻이에요. 옛날 사람들에게 소가 얼마나 소중했는지 함께 알아볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">오래 전에는 소가 오늘날의 트럭이나 자동차 같은 역할을 했어요. 무거운 짐을 \u003cb class=\"key\">수레\u003c/b>(cart)에 싣고 힘껏 끌었거든요. 소는 우유(milk)도 주고, 농부들의 일도 도왔어요. 어떤 나라에서는 소를 \u003cb class=\"key\">신\u003c/b>(god)과 연결해 아주 소중하게 여겼어요. 우리가 매일 마시는 우유를 생각하면 소에게 고마운 마음이 드는 것과 같아요.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 우유를 좋아하나요? 우리는 소에게 우유도 얻고 많은 도움을 받아요. 아주 오래 전에는 소가 오늘날의 트럭 같은 역할을 했어요. 무거운 짐을 실은 수레를 힘껏 끌었거든요. 어떤 나라에서는 소를 신과 연결해서 아주 특별하게 생각했어요. 그럼 이제 글 속으로 들어가 볼까요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>요즘과 오래 전\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>요즘에는 많은 사람들이 \u003cb class=\"key\">소고기\u003c/b> 먹는 것을 즐겨요. 하지만 오래 전에는 사람들이 소고기를 먹지 않았어요. 소는 그들의 삶에서 매우 \u003cb class=\"key\">중요\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소가 중요했던 이유\u003csmall>이유 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>그것에는 몇 가지 \u003cb class=\"key\">이유\u003c/b>들이 있었어요. 로마와 인도에서는 사람들이 소를 \u003cb class=\"key\">신\u003c/b>과 관련시켰어요. 농부들에게 소는 \u003cb class=\"key\">보물\u003c/b>과 같았어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>소가 한 일\u003csmall>예시 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>소는 농부들을 위해 \u003cb class=\"key\">일\u003c/b>했어요. 농부들은 소에게서 \u003cb class=\"key\">우유\u003c/b>를 얻었어요. 아시아에서는 사람들이 수레에 \u003cb class=\"key\">무거운\u003c/b> 물건들을 실어 날랐고, 소가 그 수레를 끌었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>도움을 준 소\u003csmall>마무리 · 문장 11\u003c/small>\u003c/h4>\u003cp>소는 사람들에게 정말 \u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">되었어요\u003c/b>. 그래서 소를 아낌없이 주는 동물이라고 부를 수 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 소가 왜 중요했는지 처음부터 끝까지 차례로 알려 주는 글이에요.","hl":null},{"n":4,"text":"먼저 글은 요즘과 오래 전을 비교해요. 요즘에는 많은 사람들이 소고기 먹는 것을 즐기지만, 오래 전에는 소고기를 먹지 않았어요. 그때 소는 사람들의 삶에서 아주 중요한 동물이었어요.","hl":"f0"},{"n":5,"text":"그다음에는 그 이유를 알려 줘요. 로마와 인도에서는 사람들이 소를 신과 관련시켰어요. 그리고 농부들에게 소는 보물과 같았대요. 정말 소중한 동물이었죠?","hl":"f1"},{"n":6,"text":"이제 소가 실제로 한 일이 나와요. 소는 농부들을 위해 일했고, 농부들은 소에게서 우유를 얻었어요. 아시아에서는 소가 무거운 물건을 실은 수레를 끌었어요.","hl":"f2"},{"n":7,"text":"마지막 문장에서 소는 정말 도움이 되었다고 정리해요. 일도 하고 우유도 주니 얼마나 고마운 동물인지 모르겠죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(왜 그런지 차례로 알려 주는 글)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 \u003cb class=\"key\">처음\u003c/b>에서 소가 매우 중요했다고 먼저 말해요. 그다음에 왜 중요한지를 \u003cb class=\"key\">이유\u003c/b>별로 하나씩 알려 주고, 로마와 인도, 농부, 아시아의 예를 들어 보여 줘요. 마지막에는 소가 정말 도움이 되었다고 정리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>These days (1)\u003c/b>\u003cspan>지금이라는 시간을 알려 줌\u003c/span>\u003cb>A long time ago (2)\u003c/b>\u003cspan>옛날이라는 시간을 알려 줌\u003c/span>\u003cb>There were some reasons for that (4)\u003c/b>\u003cspan>이유가 이어서 나온다고 알려 줌\u003c/span>\u003cb>also (8)\u003c/b>\u003cspan>내용을 하나 더 보태 줌\u003c/span>\u003cb>And (10)\u003c/b>\u003cspan>앞 문장과 이어 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Cows\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>요즘 사람들\u003c/th>\u003cth>오래 전 사람들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>소고기 먹는 것을 즐겨요\u003c/td>\u003ctd>소고기를 먹지 않았어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소는 먹을거리\u003c/td>\u003ctd>소는 삶의 중요한 동물\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 왜 그런지 차례로 설명하는 글이에요. 중심 문장은 글의 처음에 나오는 세 번째 문장, 소는 그들의 삶에서 매우 중요했습니다예요. 처음에 주제를 말하고, 뒤에서 이유를 하나씩 풀어 주는 짜임이에요.","hl":"ty"},{"n":9,"text":"길잡이 말도 꼭 눈여겨보세요. These days는 지금, A long time ago는 옛날이라는 시간을 알려 줘요. 또 There were some reasons for that는 이제부터 이유가 나온다고 알려 주고, also는 내용을 하나 더 보태 줘요. 같은 소를 가리킬 때 Cows, them, They처럼 다르게 부르는 것도 잘 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>These days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>beef\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>A long time ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래 전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>link\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관련시키다, 연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>god\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>treasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보물\u003c/span>\u003c/div>\u003cdiv>\u003cb>work for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~를 위해 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>milk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우유\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나르다, 싣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heavy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무거운\u003c/span>\u003c/div>\u003cdiv>\u003cb>thing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>cart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수레\u003c/span>\u003c/div>\u003cdiv>\u003cb>pull\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. important는 중요한, reason은 이유라는 뜻이에요. carry는 나르다, heavy는 무거운, pull은 끌다라는 뜻이죠. helpful은 도움이 되는이라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"s\">key\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">carry\u003c/b>\u003cspan class=\"m\">나르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bring\u003c/span>\u003cspan class=\"s\">take\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">heavy\u003c/b>\u003cspan class=\"m\">무거운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">light\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">helpful\u003c/b>\u003cspan class=\"m\">도움이 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">kind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. enjoy는 즐기다, 비슷한 말은 like와 love, 반대말은 hate예요. important는 중요한, 반대말은 unimportant이고요. heavy는 무거운, 반대말은 light예요. helpful은 도움이 되는, 반대말은 useless예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘에는,\u003c/span>\u003cspan class=\"en\">These days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즐깁니다\u003c/span>\u003cspan class=\"en\">enjoy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소고기 먹는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">beef\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘에는, 많은 사람들이 소고기 먹는 것을 즐깁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 요즘 사람들이 소고기를 \u003cb class=\"key\">즐겨 \u003c/b>\u003cb class=\"key\">먹는다\u003c/b>는 것을 알려 주는 문장이에요. 옛날 이야기와 \u003cb class=\"key\">비교\u003c/b>하려고 먼저 오늘의 모습을 꺼내 놓은 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">많은 수 알려 주기(수량 표현)\u003c/span> : 많은(many) + 사람들(people) : \"많은 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사에 ing 붙인 이름 말(동명사)\u003c/span> : 즐기다(enjoy) + 무엇을(eating beef) : \"소고기 먹는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"These days, 요즘에는. many people, 많은 사람들이. enjoy, 즐깁니다. eating beef, 소고기 먹는 것을. 이 문장 전체를 해석하면, 요즘에는, 많은 사람들이 소고기 먹는 것을 즐깁니다.","hl":"m"},{"n":13,"text":"요즘 사람들이 소고기를 즐겨 먹는다는 이야기예요. 옛날 이야기와 비교하려고 오늘의 모습을 먼저 꺼내 놓은 거죠.","hl":"mn"},{"n":14,"text":"먼저 many people을 봐요. many는 셀 수 있는 사람이나 물건 앞에 붙어서 '많은'이라고 말해 줘요. 두 번째로 enjoy eating beef에서 eating은 '먹는 것'이라는 이름 말처럼 쓰여요. enjoy 뒤에는 이렇게 동사에 ing를 붙인 말이 자주 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래 전에,\u003c/span>\u003cspan class=\"en\">A long time ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹지 않았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소고기를\u003c/span>\u003cspan class=\"en\">beef.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래 전에, 사람들은 소고기를 먹지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오래 전에는 사람들이 소고기를 \u003cb class=\"key\">먹지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>고 말해요. 첫 번째 문장과 \u003cb class=\"key\">반대되는\u003c/b> 옛날 모습을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 부정하기(과거 부정문)\u003c/span> : 누가(people) + 하지 않았다(didn't) + 하다(eat) : \"먹지 않았습니다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A long time ago, 오래 전에. people, 사람들은. didn't eat, 먹지 않았습니다. beef, 소고기를. 이 문장 전체를 해석하면, 오래 전에, 사람들은 소고기를 먹지 않았습니다.","hl":"m"},{"n":16,"text":"오래 전에는 사람들이 소고기를 먹지 않았다고 말해요. 첫 번째 문장과 반대되는 옛날 모습을 보여 주는 거죠.","hl":"mn"},{"n":17,"text":"didn't eat을 자세히 봐요. didn't는 did not을 줄인 말이고 '하지 않았다'라는 뜻이에요. didn't 뒤에는 동사를 그대로 써요. 그래서 ate가 아니라 eat이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소는 이었습니다\u003c/span>\u003cspan class=\"en\">Cows \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 중요했습니다\u003c/span>\u003cspan class=\"en\">very important\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 삶에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소는 그들의 삶에서 매우 중요했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소가 사람들의 삶에서 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">중요했다\u003c/b>는 뜻이에요. 왜 소고기를 안 먹었는지 \u003cb class=\"key\">이유\u003c/b>를 알려 주는 열쇠가 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 지난 모습(be동사 과거형)\u003c/span> : 소들은(Cows) + 이었습니다(were) + 매우 중요한(very important) : \"이었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·상황 짝꿍 말(전치사)\u003c/span> : in(안에) + their lives(그들의 삶) : \"그들의 삶에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Cows were, 소는 이었습니다. very important, 매우 중요했습니다. in their lives, 그들의 삶에서. 이 문장 전체를 해석하면, 소는 그들의 삶에서 매우 중요했습니다.","hl":"m"},{"n":19,"text":"소가 사람들의 삶에서 아주 중요했다는 뜻이에요. 왜 소고기를 안 먹었는지 알려 주는 이유의 열쇠인 거죠.","hl":"mn"},{"n":20,"text":"were는 be동사의 지난 모습이에요. 소는 여러 마리니까 were를 써요. 두 번째로 in their lives에서 in은 '안에, 속에'라는 뜻으로 장소나 상황을 알려 주고, their는 '그들의'라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 이유들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">reasons\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대한\u003c/span>\u003cspan class=\"en\">for that.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것에는 몇 가지 이유들이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞으로 \u003cb class=\"key\">이유\u003c/b>를 하나씩 말하겠다고 미리 알려 주는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 그래서 다음 문장들에서 이유가 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음 표현(There is/are의 과거형)\u003c/span> : There + were + 여러 개 → 무엇들이 있었어요 : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(some + 복수 명사)\u003c/span> : some(몇 가지) + 복수 명사(reasons) : \"몇 가지 이유들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"There were, 있었습니다. some reasons, 몇 가지 이유들이. for that, 그것에 대한. 이 문장 전체를 해석하면, 그것에는 몇 가지 이유들이 있었습니다.","hl":"m"},{"n":22,"text":"이 문장은 앞으로 이유를 하나씩 말하겠다고 미리 알려 주는 중심 문장이에요. 그래서 다음 문장부터 이유가 쭉 이어지는 거예요.","hl":"mn"},{"n":23,"text":"먼저 There were는 여러 개가 있었어요라는 뜻이에요. 지금은 지난 일이라 were를 썼어요. 두 번째로 some은 몇 가지라는 뜻으로 복수 명사 앞에 와요. 그래서 some reasons는 몇 가지 이유들이 되는 거예요. 아주 잘 따라왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마와 인도에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">Rome \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">India\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 소를 관련시켰습니다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">linked\u003c/span> cows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신과\u003c/span>\u003cspan class=\"en\">with gods.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">로마와 인도에서, 사람들은 소를 신과 관련시켰습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마와 인도에서는 소를 \u003cb class=\"key\">신\u003c/b>과 이어서 생각했다는 뜻이에요. 그래서 소가 아주 특별한 동물이었어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(in) 장소\u003c/span> : in + 장소(Rome and India) → ~에서 : \"로마와 인도에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 ed)\u003c/span> : 동사(link) + ed → 지난 일(link-ed) : \"관련시켰습니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In Rome and India, 로마와 인도에서. people linked cows, 사람들은 소를 관련시켰습니다. with gods, 신과. 이 문장 전체를 해석하면, 로마와 인도에서, 사람들은 소를 신과 관련시켰습니다.","hl":" 3cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 소가(cows) + 끌었다(pulled) + 수레를(the carts) : \"끌었습니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"And cows, 그리고 소가. pulled the carts, 그 수레를 끌었습니다. 이 문장 전체를 해석하면, 그리고 소가 그 수레를 끌었습니다.","hl":"m"},{"n":40,"text":"바로 앞에서 수레 이야기가 나왔죠. 그 수레를 소가 직접 끌었다고 말하는 문장이에요. 소가 사람들을 도와줬다는 뜻이 담겨 있어요.","hl":"mn"},{"n":41,"text":"첫째, pulled를 눈여겨보세요. 지난 일을 말할 때는 동사 뒤에 e d를 붙여서 과거형으로 만들어요. 둘째, the carts는 그 수레라는 뜻이에요. 앞에서 이미 나온 수레라서 the를 붙여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 이었습니다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 도움이 되었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">helpful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 정말 도움이 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소가 사람들에게 \u003cb class=\"key\">도움\u003c/b>이 많이 되었다고 이 부분을 마무리하는 말이에요. 소가 얼마나 \u003cb class=\"key\">쓸모\u003c/b>가 있었는지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 지난 모습(be동사)\u003c/span> : 그들은(They) + 이었다(were) + 정말 도움이 되는(helpful) : \"그들은 ~이었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 정말(really) + 도움이 되는(helpful) : \"정말 도움이 되는\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They were, 그들은 이었습니다. really helpful, 정말 도움이 되었습니다. 이 문장 전체를 해석하면, 그들은 정말 도움이 되었습니다.","hl":"m"},{"n":43,"text":"소가 정말 도움이 되었다고 이야기를 마무리하는 문장이에요. 소가 수레도 끌고 우유도 주니 얼마나 고마웠을까요.","hl":"mn"},{"n":44,"text":"첫째, They는 소처럼 여러 개를 가리키는 주어예요. 이럴 때 be동사는 were를 써요. 둘째, really는 부사예요. helpful 앞에서 '정말'이라고 뜻을 세게 해 줘요. 여러분도 오늘 공부 정말 잘했어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 이해(주제 찾기)\u003c/span>\u003cspan class=\"lp-pill\">정답 오래전 사람들에게 소가 매우 중요했던 이유\u003c/span>\u003cdiv style=\"margin-top:8px\">글의 \u003cb class=\"key\">처음\u003c/b>에서 소가 사람들의 삶에서 매우 중요했다고 말해요. 그리고 그 \u003cb class=\"key\">이유\u003c/b>를 로마와 인도, 농부, 아시아의 예로 차례로 보여 줘요. 그래서 모든 문장을 아우르는 답은 소가 중요했던 이유예요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>소고기 요리 방법이에요. → 글에는 요리 방법이 나오지 않아요.\u003c/li>\u003cli>소의 몸 색깔이에요. → 색깔에 대한 말은 전혀 없어요.\u003c/li>\u003cli>농부가 되는 방법이에요. → 농부 이야기는 예로 든 것뿐이에요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":45,"text":"이제 문제를 함께 풀어 볼까요? 이 글의 주제로 가장 알맞은 것을 고르는 문제예요. 글의 처음에서 소가 사람들의 삶에서 매우 중요했다고 했죠. 그리고 그 이유를 로마와 인도, 농부, 아시아의 예로 차례로 보여 줬어요. 그래서 정답은 첫 번째 보기, 오래전 사람들에게 소가 매우 중요했던 이유예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오래 전에는 사람들이 소고기를 먹지 않았고, 소는 삶에서 \u003cb class=\"key\">중요\u003c/b>했어요.\u003c/li>\u003cli>로마와 인도에서는 소를 \u003cb class=\"key\">신\u003c/b>과 관련시켰고, 농부에게 소는 \u003cb class=\"key\">보물\u003c/b> 같았어요.\u003c/li>\u003cli>소는 농부를 위해 일하고 \u003cb class=\"key\">우유\u003c/b>를 주었어요.\u003c/li>\u003cli>아시아에서는 소가 수레를 끌어 무거운 물건을 날랐고, 정말 \u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">되었어요\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A long time ago, cows were very important to people for many reasons.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">오래 전에는 사람들이 소고기를 먹지 않았고, 소는 그들의 삶에서 매우 중요했어요. 로마와 인도에서는 소를 \u003cb class=\"key\">신\u003c/b>과 관련시켰고, 농부들에게 소는 \u003cb class=\"key\">보물\u003c/b>처럼 일하고 우유를 주었으며, 아시아에서는 수레를 \u003cb class=\"key\">끌었어요\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 소가 옛날 사람들에게 얼마나 중요한 동물이었는지 배웠어요. 이유를 차례로 보여 주는 글을 읽을 때는 왜 그런지 생각하며 읽는 게 중요해요. 여러분 모두 끝까지 잘 따라와 줘서 정말 멋졌어요. 다음 시간에도 신나게 영어를 읽어 봐요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
