<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch5 Unit 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch5 Unit 01","audioDir":"5-01_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch5\u003cbr>Unit\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Alice and Her Slow Sloth\u003c/h1>\u003ch2>Alice와 그녀의 느린 나무늘보\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>빠르게만 하던 Alice가 \u003cb class=\"key\">나무늘보\u003c/b>와 산책하며 느리게 지내는 동안 이웃, 꽃, 별을 만나고, 결국 느리게 하는 일을 \u003cb class=\"key\">즐기게\u003c/b> 된 이야기예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Doing things slowly can help you see and enjoy the world around you.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 나무늘보와 함께 산책을 나선 Alice 이야기를 읽어 볼 거예요. 제목은 My Special Pet, 우리말로는 나의 특별한 반려동물이에요. 빠르게만 살던 Alice가 느린 친구를 만나 무엇을 얻었는지 함께 찾아봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">나무늘보(sloth)\u003c/b>는 세상에서 가장 느린 동물 중 하나예요. 나무에 매달려 살고, 움직임이 아주 \u003cb class=\"key\">slow\u003c/b>, 즉 느려요. 그래서 '느리다' 하면 나무늘보를 먼저 떠올리기도 해요. 여러분이 숙제를 하다가 창밖을 볼 때처럼, 천천히 하면 \u003cb class=\"key\">주변\u003c/b>이 새로 보이는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 나무늘보라는 동물을 본 적 있나요? 나무늘보는 영어로 sloth라고 하는데, 세상에서 가장 느린 동물 중 하나예요. 나무에 매달려 지내고 움직임이 아주 slow, 그러니까 느리죠. 여러분이 숙제를 하다가 창밖을 바라보면 평소에 못 보던 것이 보이죠? 천천히 하면 주변이 새로 보인다는 것, 오늘 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>빠른 Alice\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Alice는 무엇이든 \u003cb class=\"key\">빠르게\u003c/b> 했어요. 밥도 빨리 먹고 걸음도 빨랐죠. 그런데 그녀의 반려 \u003cb class=\"key\">나무늘보\u003c/b>는 Alice와 아주 달랐어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>느린 나무늘보\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>나무늘보는 모든 일을 \u003cb class=\"key\">느리게\u003c/b> 했어요. 어느 날 저녁 산책에서도 나무늘보는 너무 느려서 Alice는 자꾸 \u003cb class=\"key\">기다려야\u003c/b> 했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기다리며 만난 것들\u003csmall>예시 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>기다리는 동안 Alice는 \u003cb class=\"key\">이웃\u003c/b>들을 만나 인사하고 이야기를 나눴어요. 그다음에는 \u003cb class=\"key\">꽃향기\u003c/b>를 맡고 하늘의 별도 보았어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>느림이 준 선물\u003csmall>바뀜 · 문장 12\u003c/small>\u003c/h4>\u003cp>결국 Alice는 느리게 하는 일을 \u003cb class=\"key\">즐기게\u003c/b> 되었어요. 빨랐던 Alice의 생각이 바뀐 거예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이야기가 어떤 순서로 흘러가는지 하나씩 살펴볼게요.","hl":null},{"n":4,"text":"먼저 Alice는 무엇이든 빠르게 했어요. 밥도 빨리 먹고 걸음도 빨랐죠. 그런데 그녀의 반려 나무늘보는 Alice와 아주 달랐어요.","hl":"f0"},{"n":5,"text":"나무늘보는 모든 일을 느리게 했어요. 어느 날 저녁 산책에서도 나무늘보는 너무 느려서 Alice는 자꾸 기다려야 했어요. 조금 답답했을 수도 있겠죠?","hl":"f1"},{"n":6,"text":"그런데 기다리는 동안 좋은 일이 생겼어요. Alice는 이웃들을 만나 인사하고 이야기를 나눴어요. 그리고 꽃향기를 맡고, 하늘의 별도 올려다보았어요.","hl":"f2"},{"n":7,"text":"마지막에 Alice는 느리게 하는 일을 즐기게 되었어요. 빨리만 하던 아이의 생각이 이렇게 바뀐 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교하며 들려주는 이야기\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 Alice의 \u003cb class=\"key\">빠름\u003c/b>과 나무늘보의 \u003cb class=\"key\">느림\u003c/b>을 나란히 보여 줘요. 마지막에 Alice가 느리게 하는 것을 즐겼다고 하면서 \u003cb class=\"key\">주제\u003c/b>를 밝혀요. 그래서 중심 문장이 글의 끝에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>One evening (5)\u003c/b>\u003cspan>때 알려 줌\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>다음 순서 알려 줌\u003c/span>\u003cb>After that (10)\u003c/b>\u003cspan>그다음 순서 알려 줌\u003c/span>\u003cb>also (11)\u003c/b>\u003cspan>더하는 내용 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Alice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">She\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Alice\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Alice\u003c/th>\u003cth>나무늘보(sloth)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>모든 것을 빠르게 해요\u003c/td>\u003ctd>모든 것을 느리게 해요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>빨리 먹고 빨리 걸어요\u003c/td>\u003ctd>산책할 때도 아주 느려요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두 존재를 비교하는 이야기예요. Alice의 빠름과 나무늘보의 느림을 나란히 보여 주고, 중심 문장은 글의 맨 끝에 있어요.","hl":"ty"},{"n":9,"text":"길잡이 말을 보면 흐름이 잘 보여요. But은 반대 내용을 알려 주고, Then과 After that은 다음 순서를 알려 줘요. 또 Alice는 She, her, she처럼 다르게 불리기도 하니 누구를 말하는지 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>do\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하다 (과거형 did: 했다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>everything\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모든 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다 (과거형 ate: 먹었다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걷다 (과거형 walked: 걸었다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>sloth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나무늘보\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>느리게\u003c/span>\u003c/div>\u003cdiv>\u003cb>evening\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저녁\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a pet for a walk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반려동물을 데리고 산책하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>say hi\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…와 이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>After that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>smell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>냄새를 맡다 (과거형 smelled: 냄새를 맡았다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>…을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다 (과거형 enjoyed: 즐겼다)\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. slowly는 느리게, fast는 빠르게라는 뜻이에요. neighbor는 이웃, enjoy는 즐기다라는 뜻이죠. waited for는 기다렸다, smelled는 냄새를 맡았다는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠르게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slow\u003c/b>\u003cspan class=\"m\">느린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not fast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fast\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not the same\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">have fun\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wait\u003c/b>\u003cspan class=\"m\">기다리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">go\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. fast의 반대말은 slowly이고, slow의 반대말은 fast예요. different는 not the same과 비슷하고 same과 반대예요. enjoy는 like, have fun과 비슷하고, wait는 기다린다는 뜻이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앨리스는 했어요\u003c/span>\u003cspan class=\"en\">Alice \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을 빠르게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everything\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fast\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Alice는 모든 것을 빠르게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앨리스는 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 \u003cb class=\"key\">빠르게\u003c/b> 했어요. 이 문장은 앨리스가 어떤 아이인지 알려 주는 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Alice) + 했어요(did) + 무엇을(everything) : \"했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무엇을(목적어)\u003c/span> : 한다(did) + 무엇을(everything) : \"모든 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 했어요(did) + 어떻게(fast) : \"빠르게\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Alice did, 앨리스는 했어요. everything fast, 모든 것을 빠르게. 이 문장 전체를 해석하면, Alice는 모든 것을 빠르게 했습니다.","hl":"m"},{"n":13,"text":"이 문장은 앨리스가 모든 것을 빠르게 하는 아이라는 걸 알려 줘요. 글의 중심 문장이기도 하죠.","hl":"mn"},{"n":14,"text":"먼저 did를 볼까요. do의 과거형이 did예요. 지난 일을 말할 때 이렇게 바뀌어요. 다음은 everything이에요. 동사 뒤에서 무엇을 했는지 알려 주는 목적어예요. 마지막으로 fast는 어떻게 했는지 더 자세히 알려 주는 부사예요. 잘 따라 읽어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 빨리 먹었어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ate\u003c/span> fast\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 빨리 걸었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> walked fast.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 빨리 먹고 빨리 걸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀는 먹을 때도 걸을 때도 \u003cb class=\"key\">빠르게\u003c/b> 했어요. 두 가지 행동을 \u003cb class=\"key\">and\u003c/b>로 이어서 말하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(She) + 먹었어요(ate) + 어떻게(fast) : \"먹었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 먹었어요(ate fast) + 그리고(and) + 걸었어요(walked fast) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She ate fast, 그녀는 빨리 먹었어요. and walked fast, 그리고 빨리 걸었어요. 이 문장 전체를 해석하면, 그녀는 빨리 먹고 빨리 걸었습니다.","hl":"m"},{"n":16,"text":"그녀는 먹을 때도 걷을 때도 빠르게 했어요. 두 가지 행동을 and로 이어서 말하고 있어요.","hl":"mn"},{"n":17,"text":"먼저 ate는 eat의 과거형이에요. 규칙대로 변하지 않는 불규칙 동사라서 꼭 외워 두면 좋아요. 두 번째로 and는 두 가지 행동을 이어 주는 접속사예요. 그래서 빠르게 먹고 빠르게 걸었다는 뜻이 돼요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그녀의 반려 나무늘보는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">her\u003c/span> pet sloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달랐어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> different.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그녀의 반려 나무늘보는 달랐습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 앨리스는 빠르다고 했죠. 이 문장은 그와 \u003cb class=\"key\">반대\u003c/b>되는 이야기를 꺼내요. 그녀의 \u003cb class=\"key\">반려동물\u003c/b>은 달랐어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + 하지만(But) + 뒤 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">누구의(소유격)\u003c/span> : 누구의(her) + 무엇(pet sloth) : \"그녀의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(sloth) + 이었어요(was) + 달랐어요(different) : \"이었어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But her pet sloth, 하지만 그녀의 반려 나무늘보는. was different, 달랐어요. 이 문장 전체를 해석하면, 하지만 그녀의 반려 나무늘보는 달랐습니다.","hl":"m"},{"n":19,"text":"앞에서 앨리스는 모든 것을 빠르게 한다고 했죠. 이 문장은 그와 반대되는 이야기를 꺼내요. 그녀의 반려동물은 달랐어요.","hl":"mn"},{"n":20,"text":"먼저 But은 앞 내용과 반대되는 이야기를 이어 주는 접속사예요. 두 번째로 was는 be동사 is의 과거형이에요. 지난 이야기라서 was를 써요. 마지막으로 her는 그녀의라고 알려 주는 소유격이에요. 그래서 그녀의 반려 나무늘보가 돼요. 아주 잘했어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무늘보는\u003c/span>\u003cspan class=\"en\">The sloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을 느리게 했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did\u003c/span> everything slowly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 나무늘보는 모든 것을 느리게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무늘보는 무엇이든 \u003cb class=\"key\">느리게\u003c/b> 해요. 앨리스가 빨랐던 것과 \u003cb class=\"key\">반대\u003c/b>라는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The sloth) + 했어요(did) + 무엇을(everything) : \"했습니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The sloth, 그 나무늘보는. did everything slowly, 모든 것을 느리게 했습니다. 이 문장 전체를 해석하면, 그 나무늘보는 모든 것을 느리게 했습니다.","hl":"m"},{"n":22,"text":"이 문장은 나무늘보가 모든 일을 느리게 한다는 뜻이에요. 앨리스가 빨랐던 것과 반대라는 점을 기억하면 좋아요.","hl":"mn"},{"n":23,"text":"첫 번째, did는 do의 과거형이에요. 지난 일을 말할 때 써요. 그래서 이 문장은 그 나무늘보가 모든 것을 느리게 했다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날 저녁,\u003c/span>\u003cspan class=\"en\">One evening,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 그 나무늘보를 데리고 갔어요\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span> the sloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산책하러\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 저녁, 그녀는 나무늘보를 데리고 산책을 나갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어느 날 저녁에 앨리스가 나무늘보를 \u003cb class=\"key\">데리고\u003c/b> \u003cb class=\"key\">산책\u003c/b>을 나갔어요. 이야기가 움직이기 시작하는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(she) + 데리고 갔어요(took) + 누구를(the sloth) : \"데리고 갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~하러라는 뜻을 더하는 말(전치사)\u003c/span> : for + a walk = 산책하러 : \"산책하러\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One evening, 어느 날 저녁. she took the sloth, 그녀는 그 나무늘보를 데리고 갔어요. for a walk, 산책하러. 이 문장 전체를 해석하면, 어느 날 저녁, 그녀는 나무늘보를 데리고 산책을 나갔습니다.","hl":"m"},{"n":25,"text":"어느 날 저녁에 앨리스가 나무늘보를 데리고 산책을 나갔다는 뜻이에요. 이야기가 이제 움직이기 시작해요.","hl":"mn"},{"n":26,"text":"첫 번째, took은 take의 과거형이에요. 그래서 지난 일을 말하고 있어요. 두 번째, for a walk는 산책하러라는 묶음 표현이에요. for를 붙여서 무엇을 하러라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무늘보는\u003c/span>\u003cspan class=\"en\">The sloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 느렸습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> so slow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class= u003c/span>\u003cspan class=\"gn\">여러 개 말(복수)\u003c/span> : 하나면(star) + 그대로, 여럿이면(stars) + s : \"별들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 무엇을(the stars) + 안에(in) + 어디에(the sky) : \"하늘에 있는\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"She also, 그녀는 또한. looked at, 바라보았습니다. the stars, 별들을. in the sky, 하늘에 있는. 이 문장 전체를 해석하면, 그녀는 또한 하늘의 별들을 보았습니다.","hl":"m"},{"n":40,"text":"밤하늘에 떠 있는 별을 가만히 바라보았다는 뜻이에요. 느리게 걸어서 하늘까지 볼 수 있었던 거죠.","hl":"mn"},{"n":41,"text":"먼저 the stars를 보세요. 별이 여러 개라서 star 뒤에 s를 붙여 복수로 만들었어요. 다음으로 in the sky에서 in은 장소를 알려 주는 전치사예요. 그래서 하늘 안에 있는 별들이라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alice는 즐겼습니다\u003c/span>\u003cspan class=\"en\">Alice enjoyed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일들을 하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느리게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">slowly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Alice는 일들을 느리게 하는 것을 즐겼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빨리만 하던 Alice가 이제는 \u003cb class=\"key\">느리게\u003c/b> 하는 것도 \u003cb class=\"key\">즐겼다\u003c/b>는 뜻이에요. 이 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼(동명사)\u003c/span> : 무엇을(enjoyed) + 하는 것(doing things) : \"일들을 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 하는 일(doing) + 어떻게(slowly) : \"느리게\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Alice enjoyed, Alice는 즐겼습니다. doing things, 일들을 하는 것을. slowly, 느리게. 이 문장 전체를 해석하면, Alice는 일들을 느리게 하는 것을 즐겼습니다.","hl":"m"},{"n":43,"text":"빨리만 하던 앨리스가 이제는 느리게 하는 것도 즐기게 되었다는 뜻이에요. 이 글의 중심 생각을 담은 문장이죠.","hl":"mn"},{"n":44,"text":"먼저 doing things를 보세요. 동사에 ing를 붙이면 하는 것이라는 이름 말처럼 쓰여요. 이것을 동명사라고 불러요. 그리고 slowly는 어떻게 하는지 알려 주는 부사예요. 그래서 느리게라는 뜻으로 doing things를 도와주고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">빈칸에 알맞은 말 고르기\u003c/span>\u003cspan class=\"lp-pill\">정답 slowly\u003c/span>\u003cdiv style=\"margin-top:8px\">세 번째 문장에서 나무늘보는 Alice와 \u003cb class=\"key\">different\u003c/b>, 즉 다르다고 했어요. 그래서 네 번째 문장은 The sloth did everything \u003cb class=\"key\">slowly\u003c/b>가 되어야 해요. \u003cb class=\"key\">fast\u003c/b>의 반대말을 찾으면 답이 보여요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>fast는 Alice의 모습이라 나무늘보에게는 맞지 않아요.\u003c/li>\u003cli>happily는 '기쁘게'라서 속도를 말하지 않아요.\u003c/li>\u003cli>carefully는 '조심스럽게'라서 글에 나오지 않아요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":45,"text":"이제 문제를 풀어 볼게요. 빈칸에 알맞은 말을 고르는 문제예요. 세 번째 문장에서 나무늘보는 Alice와 different, 즉 다르다고 했죠. 그래서 네 번째 문장은 The sloth did everything slowly가 되어야 해요. fast는 Alice의 모습이니까 답이 아니에요. 정답은 slowly예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Alice는 모든 것을 \u003cb class=\"key\">빠르게\u003c/b> 했지만 나무늘보는 \u003cb class=\"key\">느리게\u003c/b> 했어요.\u003c/li>\u003cli>나무늘보가 너무 느려서 Alice는 자꾸 \u003cb class=\"key\">기다렸어요\u003c/b>.\u003c/li>\u003cli>기다리는 동안 \u003cb class=\"key\">이웃\u003c/b>과 이야기하고 꽃향기와 별을 보았어요.\u003c/li>\u003cli>결국 Alice는 느리게 하는 일을 \u003cb class=\"key\">즐기게\u003c/b> 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Doing things slowly can help you see and enjoy the world around you.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">빠르게만 하던 Alice가 \u003cb class=\"key\">나무늘보\u003c/b>와 산책하며 느리게 지내는 동안 이웃, 꽃, 별을 만나고, 결국 느리게 하는 일을 \u003cb class=\"key\">즐기게\u003c/b> 된 이야기예요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 Alice와 느린 나무늘보 이야기를 읽었어요. 빨리만 하는 것보다 천천히 하면 이웃도 꽃도 별도 보인다는 걸 배웠죠. 여러분도 오늘 한 가지는 천천히 해 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
