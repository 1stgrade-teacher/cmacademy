. 수고했어요!","hl":"sum"}]}],"practice":{"unit":"접속사 that","level":"중학생","ctx":"단원: 접속사 that\n강의 제목: 접속사 that 하나면 문장이 두 배로 길어진다! that절 완전 정복\n목표: 접속사 that이 이끄는 절의 구조를 이해하고, that절을 목적어로 사용하는 문장을 만들 수 있다.\n개념 1. 접속사 that과 종속절, 주절: 접속사는 단어와 단어, 구와 구, 절과 절을 연결해 주는 말로, 등위접속사와 종속접속사가 있어요. 종속접속사가 포함된 절을 종속절이라 하고, 종속절이 연결되는 다른 절을 주절이라고 해요. 오늘 배우는 that은 종속접속사로, 뒤에 주어와 동사가 포함된 완전한 문장이 옵니다. [접속사 that + 주어 + 동사 ~ (완전한 문장)] (주의: that 뒤에 주어와 동사가 모두 있는지 먼저 확인하세요. 동사가 빠지면 that절이 완성되지 않아요.)\n  예문: I hope that my work can help the Earth. (나는 내 일이 지구를 도울 수 있기를 바란다.) / We know that our teacher is from Busan. (우리는 우리 선생님이 부산 출신이라는 것을 안다.)\n개념 2. that절이 목적어로 쓰일 때: that절은 문장에서 주어, 목적어, 보어로 쓰일 수 있는데, 특히 목적어로 쓰이는 경우가 많아요. 목적어로 쓰인 that은 생략할 수 있어서 that을 빼고 말해도 뜻이 같아요. [주어 + 동사 + that + 주어 + 동사 ~ (that은 생략 가능)] (주의: that절이 주어로 쓰이면 보통 It ~ that절 형태로 바꿀 수 있고, 이때 it은 가주어, that절은 진주어예요. 보어로 쓰이면 주어와 that절의 내용이 같다는 뜻을 나타내요.)\n  예문: I think that she is kind. (나는 그녀가 친절하다고 생각한다.) / My sister thinks that the game is exciting. (내 동생은 그 게임이 재미있다고 생각한다.) / I hope that you can come. (나는 네가 올 수 있기를 바란다.)\n개념 3. that절을 목적어로 자주 쓰는 동사: that절을 목적어로 취하는 동사로 think, know, hope, believe, say 등이 있어요. 이런 동사 뒤에는 that과 함께 주어와 동사가 있는 완전한 절이 옵니다. [think / know / hope / believe / say + that + 주어 + 동사] (주의: believe와 know처럼 '~라고 믿다, ~라는 것을 알다'라는 뜻을 가진 동사 뒤에는 that절이 자연스럽게 이어져요.)\n  예문: Jason believes that he can be a pilot. (Jason은 그가 비행사가 될 수 있다고 믿는다.) / She believes that her dog is smart. (그녀는 그녀의 개가 똑똑하다고 믿는다.) / Many people know that Linda is good at math. (많은 사람들은 Linda가 수학을 잘하는 것을 안다.) / I hope that everything goes well. (나는 모든 일이 잘 되기를 바란다.)\n자주 하는 실수: I think that is she kind. → I think that she is kind. / She believes that her dog smart. → She believes that her dog is smart. / I hope that everything go well. → I hope that everything goes well.\n정리: 접속사는 절과 절을 연결하며, 종속접속사 that이 이끄는 절을 종속절이라고 해요. / that절은 주로 목적어로 쓰이고, 목적어로 쓰인 that은 생략할 수 있어요. / that절을 목적어로 자주 쓰는 동사에는 think, know, hope, believe 등이 있어요.","items":[{"t":"choose","q":"다음 중 접속사 that이 이끄는 절이 목적어로 쓰인 문장 두 개를 고르세요.","ref":"","opts":["I know that Mina plays the piano well.","The boy that won the race is my cousin.","He hopes to win the game.","I believe that this bag is too heavy.","She made a cake that tastes delicious."],"ans":[1,4],"exp":"1번과 4번은 know/believe 뒤에 접속사 that이 이끄는 절이 목적어로 쓰였어요. 2번과 5번의 that은 관계대명사이고, 3번에는 that절이 없어요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"My sister believes that the story [[are]] true.","ok":false,"right":["is"],"exp":"that절의 주어 the story가 단수이므로 동사는 is가 와야 해요."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"I think that is he a good student.","wrong":"is he","right":["he is"],"exp":"접속사 that 뒤에는 주어 he 다음에 동사 is가 와야 해요."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["that","what","who","because"],"items":[{"s":"I believe ____ this museum is very old.","a":"that"},{"s":"My brother hopes ____ our team will win.","a":"that"},{"s":"We know ____ Ms. Han teaches science.","a":"that"},{"s":"Do you think ____ the test was difficult?","a":"that"}],"exp":"think, hope, know, believe 뒤에는 접속사 that + 주어 + 동사로 이루어진 완전한 절이 와요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"Our neighbors know [[that]] Jina is good at drawing.","ok":true,"right":[],"exp":"know 뒤에 접속사 that이 이끄는 절이 목적어로 쓰였고, that절 안에 주어 Jina와 동사 is가 모두 있어 옳아요."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"Jisu says","r":"that she practices the violin every day."},{"l":"The boys believe","r":"that they will win the soccer game."},{"l":"I hope","r":"that you can visit Jeju with us."},{"l":"Our teacher knows","r":"that we study hard for the test."}],"exp":"각각 say, believe, hope, know 뒤에 접속사 that과 주어·동사가 있는 완전한 절이 이어져요. 대명사 she, they, you, we도 앞부분의 주어와 자연스럽게 연결돼요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"I [[believe that]] this book is useful.","hint":"(believe, that)"},"items":[{"scene":"🙂🎨 지수가 자신의 그림이 멋지다고 생각하는 상황","pre":"Jisu","post":"her picture is wonderful.","hint":"(think, that)","a":["thinks that"]},{"scene":"👩‍🏫📚 우리 선생님이 민호가 숙제를 끝냈다는 것을 아는 상황","pre":"Our teacher","post":"Minho finished his homework.","hint":"(know, that)","a":["knows that"]}],"exp":"주어 뒤에 think/know를 알맞게 쓴 뒤 접속사 that을 붙이고, that절 안에는 주어와 동사가 모두 오게 해요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"내 남동생은 그 영화가 아주 재미있다고 생각한다.","chunks":["My younger brother","thinks that","the movie","is very exciting"],"end":".","alts":[],"exp":"thinks 뒤에 접속사 that이 오고, that절 안에서 주어 the movie 다음에 동사 is가 와요."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ul(t){return esc(t).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");}
  function plain(t){return s(t).replace(/\[\[|\]\]/g,"");}
  function nz(t){return plain(t).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}
  function blank(t){return s(t).replace(/_{2,}|\(\s*\)|\[\s*\]/g,"____");}
  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){
    if(!x||typeof x!=="object")return null;
    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();
    if(t==="same"||t==="mcq")t="choose";
    if(t==="choose"){
      var opts=A(x.opts||x.options).map(s).filter(function(v){return v.trim();}).slice(0,8),ans=A(Array.isArray(x.ans)?x.ans:[x.ans]),seen={};
      ans=ans.map(function(n){return parseInt(n,10);}).filter(function(n){if(!(n>=1&&n<=opts.length)||seen[n])return false;seen[n]=1;return true;});
      if(opts.length<3||!ans.length)return null;
      return {t:t,q:q||(ans.length>1?"알맞은 것을 "+ans.length+"개 고르세요.":"알맞은 것을 고르세요."),ref:s(x.ref).trim(),opts:opts,ans:ans.sort(),exp:exp};}
    if(t==="fix"){
      var S=s(x.s||x.sentence).trim(),w=s(x.wrong).trim(),r=alts(x.right);
      if(!S||!w||S.indexOf(w)<0||!r.length)return null;
      return {t:t,q:q||"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.",s:S,wrong:w,right:r,exp:exp};}
    if(t==="bank"){
      var bank=A(x.bank).map(s).map(function(v){return v.trim();}).filter(Boolean),low=bank.map(function(v){return nz(v);});
      var its=A(x.items).map(function(it){var ss=blank(it&&it.s);var a=s(it&&it.a).trim(),k=low.indexOf(nz(a));
        if(ss.split("____").length!==2||k<0)return null;return {s:ss,a:bank[k]};}).filter(Boolean).slice(0,8);
      if(bank.length<2||its.length<2)return null;
      return {t:t,q:q||"빈칸에 알맞은 것을 <보기>에서 고르세요.",bank:bank,items:its,exp:exp};}
    if(t==="match"){
      var pr=A(x.pairs).map(function(p){return p&&s(p.l).trim()&&s(p.r).trim()?{l:s(p.l).trim(),r:s(p.r).trim()}:null;}).filter(Boolean).slice(0,7);
      if(pr.length<3)return null;
      return {t:t,q:q||"알맞은 것끼리 연결하세요.",pairs:pr,exp:exp};}
    if(t==="scene"){
      var ex=x.ex&&typeof x.ex==="object"?{s:s(x.ex.s).trim(),hint:s(x.ex.hint).trim()}:{s:"",hint:""};
      var sit=A(x.items).map(function(it){if(!it)return null;var a=alts(it.a);if(!a.length)return null;
        return {scene:s(it.scene).trim(),pre:s(it.pre),post:s(it.post),hint:s(it.hint).trim(),a:a};}).filter(Boolean).slice(0,3);
      if(!sit.length)return null;
      return {t:t,q:q||"상황을 보고 <보기>와 같이 문장을 완성하세요.",ex:ex,items:sit,exp:exp};}
    if(t==="order"){
      var ch=A(x.chunks).map(s).map(function(v){return v.trim();}).filter(Boolean).slice(0,8);
      if(ch.length<3)return null;
      return {t:t,q:q||"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.",ko:s(x.ko).trim(),chunks:ch,end:s(x.end==null?".":x.end).trim(),alts:alts(x.alts),exp:exp};}
