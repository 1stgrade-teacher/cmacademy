<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(소) 6과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(소) 6과 본문1","audioDir":"1_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(소)\u003cbr>6과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>People Who Work in Nature: Nari the Haenyeo\u003c/h1>\u003ch2>자연에서 일하는 사람들: 해녀 나리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 자연에서 일하는 사람들의 이야기를 들려주는 글이다. 거제의 \u003cb class=\"key\">해녀\u003c/b> 나리는 조수와 날씨를 확인하고 잠수복과 수경을 갖춘 뒤 물속에서 \u003cb class=\"key\">해산물\u003c/b>을 채집하며, 너무 많이 채집하지 않고 쓰레기를 줍는 등 \u003cb class=\"key\">바다\u003c/b>를 아끼는 실천을 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People who work in nature, like the haenyeo Nari, take care of the ocean by collecting only what they need and picking up trash.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 자연에서 일하는 사람들, 그중에서도 거제의 해녀 나리의 이야기를 함께 읽어 볼 거예요. 이 글은 바다나 산, 심지어 북극처럼 자연을 무대로 일하는 사람들을 소개하고, 그들의 이야기를 직접 들어 보자는 내용이에요. 핵심은 자연에서 일하는 사람들이 바다를 아끼고 지킨다는 점이에요. 그럼 지문을 한 문장씩 따라가면서 흐름과 어휘를 꼼꼼히 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세상에는 사무실이 아니라 \u003cb class=\"key\">자연\u003c/b>을 무대로 일하는 사람들이 있어요. 바다, 산, 심지어 북극처럼 아주 극한 환경에서 일하는 직업도 있고요. 그중 대표적인 예가 물에 들어가 해산물을 채집하는 \u003cb class=\"key\">해녀\u003c/b>(haenyeo)예요. 해녀는 잠수복(diving suit)과 수경(swimming glasses) 같은 장비를 갖추고, \u003cb class=\"key\">조수\u003c/b>(tide)와 날씨(the weather)를 확인한 다음 물속으로 들어가죠. 이건 등산 전에 날씨와 코스를 확인하는 것과 비슷해요. 최근에는 바다에 \u003cb class=\"key\">쓰레기\u003c/b>(trash)가 많아지면서, 해양 환경(marine environment)을 지키는 일이 자연에서 일하는 사람들의 중요한 과제가 되었어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 세상에는 사무실이 아니라 자연을 무대로 일하는 사람들이 많아요. 바다, 산, 심지어 북극처럼 아주 극한 환경에서 일하는 직업도 있고요. 그중 대표적인 예가 물에 들어가 해산물을 채집하는 해녀예요. 해녀는 잠수복과 수경 같은 장비를 갖추고 조수와 날씨를 확인한 다음 물속으로 들어가죠. 이건 등산 전에 날씨와 코스를 확인하는 것과 비슷해요. 최근에는 바다에 쓰레기가 많아지면서 해양 환경을 지키는 일이 자연에서 일하는 사람들의 중요한 과제가 되었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자연에서 일하는 사람들\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 자연에서 일하는 사람들을 소개하며 시작해요. 그들은 바다, 산, 심지어 북극에서도 일한다고 말하며 '\u003cb class=\"key\">자연\u003c/b>'이라는 넓은 무대를 먼저 제시해요. 그리고 'Let's meet them'이라며 독자를 그들을 만나는 자리로 \u003cb class=\"key\">초대\u003c/b>하고, 그들의 \u003cb class=\"key\">이야기\u003c/b>를 들어 보자고 제안해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>나리, 거제의 해녀\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>이제 실제 인물이 등장해요. 나리는 자신이 거제의 \u003cb class=\"key\">해녀\u003c/b>라고 소개하고, 물에 잠수해서 \u003cb class=\"key\">해산물\u003c/b>을 채집한다고 말해요. 아침에는 \u003cb class=\"key\">조수\u003c/b>와 날씨를 확인하며 하루를 준비하는데, 이것이 바로 그녀의 구체적인 \u003cb class=\"key\">일과\u003c/b>예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>장비와 물속 활동\u003csmall>근거 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>일을 하려면 먼저 \u003cb class=\"key\">장비\u003c/b>가 필요해요. 나리는 잠수복을 입고 수경을 써서 물속에서 일한다고 설명해요. 그런데 그녀는 일이 힘들다고만 하지 않고, 잠수하는 것과 아름다운 바다에서 \u003cb class=\"key\">시간\u003c/b>을 보내는 것을 아주 좋아한다고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>절제와 쓰레기 줍기\u003csmall>예시 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>여기서 나리의 태도가 드러나요. 그녀는 해산물을 너무 많이 채집하지 않는데, 이것이 \u003cb class=\"key\">바다\u003c/b>에 좋다고 말해요. 요즘은 물속에 \u003cb class=\"key\">쓰레기\u003c/b>가 많이 보여서 직접 줍는다는 실천도 소개해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>바다를 아끼자는 마음\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 나리는 우리가 바다에 \u003cb class=\"key\">신경\u003c/b>을 써야 한다고 믿는다고 말해요. 앞에서 보여 준 절제와 쓰레기 줍기가 이 \u003cb class=\"key\">주장\u003c/b>의 근거가 되고, 글 전체가 바다를 아끼자는 메시지로 마무리돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 글은 자연에서 일하는 사람들을 소개하면서 시작해요. 그들은 바다, 산, 심지어 북극에서도 일한다고 말하며 자연이라는 넓은 무대를 먼저 보여 주죠. 그리고 독자를 그들을 만나는 자리로 초대하면서, 그들의 이야기를 들어 보자고 제안해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 실제 인물이 등장해요. 나리는 자신이 거제의 해녀라고 소개하고, 물에 잠수해서 해산물을 채집한다고 말해요. 아침에는 조수와 날씨를 확인하면서 하루를 준비하는데, 이게 바로 그녀의 구체적인 일과예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 장비와 물속 활동이에요. 일을 하려면 먼저 장비가 필요하겠죠. 나리는 잠수복을 입고 수경을 써서 물속에서 일한다고 설명해요. 그런데 그녀는 일이 힘들다고만 하지 않고, 잠수하는 것과 아름다운 바다에서 시간을 보내는 것을 아주 좋아한다고 말해요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 나리의 태도가 드러나요. 그녀는 해산물을 너무 많이 채집하지 않는데, 그게 바다에 좋다고 말해요. 그리고 요즘은 물속에 쓰레기가 많이 보여서 직접 쓰레기를 줍는다는 실천도 소개하죠.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 마지막 문장에서 나리는 우리가 바다에 신경을 써야 한다고 믿는다고 말해요. 앞에서 보여 준 절제와 쓰레기 줍기가 이 주장의 근거가 되고, 글 전체가 바다를 아끼자는 메시지로 마무리돼요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 일반적인 소개 뒤에 \u003cb class=\"key\">예시\u003c/b>로 실제 인물을 등장시켜요. 첫 세 문장에서 자연에서 일하는 사람들을 넓게 제시하고, 이어서 거제의 해녀 나리를 구체적인 사례로 보여 주죠. 마지막 문장에서 바다를 아끼자는 \u003cb class=\"key\">주장\u003c/b>이 나오기 때문에 결론이 뒤에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>even (2)\u003c/b>\u003cspan>범위 확대\u003c/span>\u003cb>Let's meet (3)\u003c/b>\u003cspan>독자 초대\u003c/span>\u003cb>These days (12)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>so (12)\u003c/b>\u003cspan>원인·결과\u003c/span>\u003cb>I believe that (13)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">work in nature\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">work in the sea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dive in the water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">collect seafood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">work in the water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spending time in the beautiful sea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">good for the ocean\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">care about the ocean\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 예시, 즉 구체적인 사례 제시예요. 처음에는 자연에서 일하는 사람들을 일반적으로 소개하고, 그다음 거제의 해녀 나리라는 실제 인물을 예로 들어 보여 주죠. 그리고 마지막 문장에서 바다를 아껴야 한다는 주장으로 마무리해요. 그래서 결론이 맨 뒤에 나오는 미괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"신호어도 함께 봐요. 첫 부분의 Let's meet은 독자를 초대하는 표현이고, 두 번째 문장의 even은 범위를 넓혀 주는 신호예요. 열두 번째 문장의 These days는 시간을 전환하고, so는 앞뒤를 원인과 결과로 이어 줘요. 마지막 문장의 I believe that은 글쓴이의 주장을 꺼내는 신호라는 것도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>love\u003c/b>\u003cem>동사\u003c/em>\u003cspan>아주 좋아하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mountain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>Arctic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북극\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>dive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잠수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채집하다, 모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seafood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해산물\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조수\u003c/span>\u003c/div>\u003cdiv>\u003cb>weather\u003c/b>\u003cem>명사\u003c/em>\u003cspan>날씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입다, 착용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>diving suit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠수복\u003c/span>\u003c/div>\u003cdiv>\u003cb>swimming glasses\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수경\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>too much\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>be good for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 좋다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다, 대양\u003c/span>\u003c/div>\u003cdiv>\u003cb>these days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>trash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>줍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>care about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 신경을 쓰다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개만 짚어 볼게요. haenyeo는 해녀, dive는 잠수하다, collect는 채집하다, tide는 조수라는 뜻이에요. care about은 신경을 쓰다, pick up은 줍다로 기억해 두면 문장이 훨씬 쉽게 읽혀요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">아주 좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collect\u003c/b>\u003cspan class=\"m\">채집하다, 모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">pick up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">spread\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">check\u003c/b>\u003cspan class=\"m\">확인하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">examine\u003c/span>\u003cspan class=\"s\">inspect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">care about\u003c/b>\u003cspan class=\"m\">~에 신경을 쓰다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mind\u003c/span>\u003cspan class=\"s\">be concerned about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">work\u003c/b>\u003cspan class=\"m\">일하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">labor\u003c/span>\u003cspan class=\"s\">toil\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rest\u003c/span>\u003cspan class=\"a\">play\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. love는 enjoy나 like로 바꿔 쓸 수 있고, 반대말은 hate예요. collect는 gather나 pick up과 가깝고, check는 examine이나 inspect로 바꿀 수 있어요. beautiful은 pretty나 lovely와 비슷하고 반대말은 ugly죠. believe는 think나 trust로 바꿀 수 있고, care about은 mind와 비슷한 표현이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은\u003c/span>\u003cspan class=\"en\">Some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일하는 것을 아주 좋아한다\u003c/span>\u003cspan class=\"en\">love \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 자연에서 일하는 것을 아주 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 첫 문장으로, 자연과 함께하는 일을 좋아하는 사람들이 있다는 것을 알려 주며 앞으로 그들을 소개하겠다는 흐름을 연다. \u003cb class=\"key\">love \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">work\u003c/b>는 '일하는 것을 좋아하다'라는 뜻으로, \u003cb class=\"key\">to부정사\u003c/b>가 love의 목적어 역할을 한다. \u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">nature\u003c/b>는 '자연에서, 자연 속에서'라는 장소 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : love [타동사] + [to work (to부정사구/목적어)] + [in nature (전치사구)] : \"자연에서 일하는 것\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Some people, 어떤 사람들은. love to work, 일하는 것을 아주 좋아한다. in nature, 자연에서. 이 문장 전체를 해석하면, 어떤 사람들은 자연에서 일하는 것을 아주 좋아한다.","hl":"m"},{"n":14,"text":"이 문장은 글을 여는 첫 번째 문장이에요. 자연 속에서 일하는 사람들이 있다는 걸 알려 주면서, 앞으로 그런 사람들을 소개하겠다는 흐름을 만들어 줍니다. love to work는 일하는 것을 좋아한다는 뜻이고, in nature는 자연에서라는 장소 표현이에요.","hl":"mn"},{"n":15,"text":"여기서 눈여겨볼 건 to work in nature예요. love 같은 동사 뒤에 to부정사가 오면 그 행동을 좋아한다는 뜻이 되죠. 이때 to work는 문장에서 목적어 자리를 채우는 명사적 용법이에요. 그래서 자연에서 일하는 것 자체를 좋아한다는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일한다\u003c/span>\u003cspan class=\"en\">work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다, 산에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sea, \u003c/span>\u003cspan class=\"tgt\">mountains, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 북극에서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Arctic\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 바다, 산, 심지어 북극에서도 일한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 자연에서 일하는 사람들을 언급한 뒤, 그 장소가 얼마나 다양한지 구체적으로 보여 주는 문장이다. \u003cb class=\"key\">even\u003c/b>은 '심지어'라는 뜻으로 북극처럼 극단적인 장소까지 포함된다는 것을 강조한다. 세 장소가 \u003cb class=\"key\">or\u003c/b>로 연결된 병렬 구조이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(A, B, or C)\u003c/span> : [in the sea], [mountains], or [even in the Arctic] — 세 장소 표현을 or로 병렬 연결 : \"바다, 산, 심지어 북극에서도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : even + [전치사구/명사] — 극단적인 경우를 강조 : \"심지어 ~조차도\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They, 그들은. work, 일한다. in the sea, mountains, 바다, 산에서. or even in the Arctic, 심지어 북극에서도. 이 문장 전체를 해석하면, 그들은 바다, 산, 심지어 북극에서도 일한다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 자연이라는 공간이 얼마나 넓은지 구체적으로 보여 줘요. 바다와 산을 넘어 북극까지 나열하면서 장소의 다양성을 강조하죠. 이렇게 여러 장소를 or로 이어 주는 걸 병렬 구조라고 해요.","hl":"mn"},{"n":18,"text":"먼저 in the sea, mountains, or even in the Arctic를 보세요. 세 개의 장소 표현이 or로 나란히 연결된 병렬 구조예요. 그다음 even은 심지어라는 뜻으로, 북극처럼 극단적인 장소까지 포함된다는 걸 강조해 줍니다. 그래서 일하는 공간이 아주 다양하다는 느낌이 살아나요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 만나 보고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">meet \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 이야기를 들어 보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">listen \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">stories\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들을 만나 보고 그들의 이야기를 들어 보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 다음 내용으로 함께 나아가자고 \u003cb class=\"key\">제안\u003c/b>하는 문장이다. 앞에서 자연에서 일하는 사람들을 소개했고, 이제 그들의 실제 이야기를 들으러 가자는 \u003cb class=\"key\">청유문\u003c/b>으로 글의 흐름을 자연스럽게 연결한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's\u003c/span> : Let's + [동사원형] — '우리 ~하자' : \"만나 보자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [meet them] and [listen to their stories] — 동사구와 동사구를 and로 병렬 : \"그들을 만나고 그들의 이야기를 듣다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 관용 표현\u003c/span> : listen to + [목적어] — '~을 듣다' : \"~의 이야기를 듣다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Let's meet them, 그들을 만나 보고. and listen to their stories, 그들의 이야기를 들어 보자. 이 문장 전체를 해석하면, 그들을 만나 보고 그들의 이야기를 들어 보자.","hl":"m"},{"n":20,"text":"이 문장은 독자에게 함께 다음으로 나아가자고 제안하는 문장이에요. 앞에서 자연에서 일하는 사람들을 언급했으니, 이제 그들의 실제 이야기를 들으러 가자는 거죠. 이렇게 권유하는 문장을 청유문이라고 해요.","hl":"mn"},{"n":21,"text":"먼저 Let's meet을 보세요. Let's 뒤에 동사원형이 오면 우리 뭘 하자라는 청유문이 됩니다. 그리고 meet them과 listen to their stories가 and로 나란히 연결된 병렬 구조예요. 마지막으로 listen은 자동사라서 뒤에 대상을 연결할 때 to를 붙여 listen to 형태로 써야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~입니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나리\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Nari\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 나리입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 자신을 처음 소개하는 문장이에요. 앞에서 그들의 이야기를 들어 보자고 했으니, 이제 \u003cb class=\"key\">해녀\u003c/b> \u003cb class=\"key\">나리\u003c/b>가 직접 등장하는 자리죠. be동사 am 뒤에 이름이 오는 \u003cb class=\"key\">2형식\u003c/b> 문장으로, 자신이 누구인지 밝히는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(2형식 주격보어)\u003c/span> : [[주어]] + be동사(am) + [[주격보어]](명사) : \"나는 나리입니다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"I am, 나는 ~입니다. Nari, 나리. 이 문장 전체를 해석하면, 저는 나리입니다.","hl":"m"},{"n":23,"text":"이 문장은 나리가 자신을 처음 소개하는 부분이에요. 앞에서 해녀들의 이야기를 들어 보자고 했으니, 이제 드디어 해녀 나리가 직접 등장하는 거죠. am 뒤에 이름이 오는 이 형식 문장으로, 나는 나리라고 자신을 밝히는 역할을 합니다.","hl":"mn"},{"n":24,"text":"be동사는 주어와 주격보어를 등호로 이어 주는 연결동사예요. 그래서 I am Nari는 나는 나리다, 즉 나와 나리가 같은 사람이라는 관계를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~입니다\u003c/span>\u003cspan class=\"en\">I am\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 해녀\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">haenyeo\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거제에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Geoje\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 거제의 해녀입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나리가 자신의 \u003cb class=\"key\">직업\u003c/b>과 \u003cb class=\"key\">사는 \u003c/b>\u003cb class=\"key\">곳\u003c/b>을 밝히는 문장이에요. a haenyeo로 정체성을 말하고, in Geoje로 장소를 덧붙여 '거제의 해녀'라는 \u003cb class=\"key\">정보\u003c/b>를 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(2형식 주격보어: 명사)\u003c/span> : [[주어]] + be동사 + [[주격보어]](명사) : \"해녀\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소, 명사 뒤 수식)\u003c/span> : [[전치사]] in + [[장소 명사]] : \"거제에 있는 / 거제에서\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I am, 나는 ~입니다. a haenyeo, 한 해녀. in Geoje, 거제에 있는. 이 문장 전체를 해석하면, 저는 거제의 해녀입니다.","hl":"m"},{"n":26,"text":"나리가 자신의 직업과 사는 곳을 밝히는 문장이에요. a haenyeo로 정체성을 말하고, in Geoje로 장소를 덧붙여서 거제의 해녀라는 정보를 완성하죠.","hl":"mn"},{"n":27,"text":"be동사 am 뒤에 명사 a haenyeo가 와서 주어 I의 정체를 설명하는 주격보어 역할을 해요. 그리고 전치사구 in Geoje가 앞의 명사 a haenyeo를 뒤에서 꾸며서 거제에 있는 해녀라는 장소 정보를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 물속에서 잠수해요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dive \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 해산물을 채집해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">collect \u003c/span>\u003cspan class=\"tgt\">seafood\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 물에 잠수해서 해산물을 채집합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해녀인 나리가 실제로 하는 \u003cb class=\"key\">일\u003c/b>을 두 가지로 보여 주는 문장이에요. dive와 collect가 \u003cb class=\"key\">and\u003c/b>로 나란히 연결되어 '잠수한다'와 '채집한다'는 \u003cb class=\"key\">행동\u003c/b>이 한 흐름으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조(and)\u003c/span> : [[동사]] A + and + [[동사]] B : \"잠수하다 그리고 채집하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [[전치사]] in + [[the water]] : \"물속에서\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I dive in the water, 나는 물속에서 잠수해요. and collect seafood, 그리고 해산물을 채집해요. 이 문장 전체를 해석하면, 저는 물에 잠수해서 해산물을 채집합니다.","hl":"m"},{"n":29,"text":"이 문장은 해녀인 나리가 실제로 하는 일을 보여 줘요. 잠수한다와 채집한다, 두 가지 행동이 and로 나란히 이어지죠. 한 사람이 바다에서 하는 일의 흐름이 그대로 드러납니다.","hl":"mn"},{"n":30,"text":"먼저, 주어 I를 함께 쓰는 두 동사 dive와 collect가 and로 병렬 연결되어 있어요. 그래서 두 행동 모두 주어 I가 한다는 뜻이 됩니다. 그리고 전치사구 in the water가 앞의 동사 dive를 꾸며서 어디서 잠수하는지 장소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">morning\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 확인합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">check\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조수와 날씨를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tide \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">weather\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아침에, 저는 조수와 날씨를 확인합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하루를 시작하기 전에 \u003cb class=\"key\">조수\u003c/b>와 \u003cb class=\"key\">날씨\u003c/b>를 먼저 점검하는 나리의 습관을 보여 주는 문장이에요. 바다에서 일하는 사람에게 이 확인은 안전과 바로 이어지는 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">점검\u003c/b>이라는 점을 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(때)\u003c/span> : [전치사 In + 명사 the morning] = 때를 나타내는 부사구 : \"아침에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재시제(습관·반복)\u003c/span> : [주어 I + 동사 check (현재시제)] : \"저는 확인합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 병렬\u003c/span> : [명사 the tide + and + 명사 the weather] : \"조수와 날씨\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"In the morning, 아침에. I check, 저는 확인합니다. the tide and the weather, 조수와 날씨를. 이 문장 전체를 해석하면, 아침에, 저는 조수와 날씨를 확인합니다.","hl":"m"},{"n":32,"text":"이 문장은 나리가 하루를 시작하기 전에 조수와 날씨를 먼저 점검한다는 걸 보여 줘요. 바다에서 일하는 사람에게 조수와 날씨는 안전과 바로 이어지니까, 이게 곧 사전 점검이자 직업인의 습관이라는 뜻이에요.","hl":"mn"},{"n":33,"text":"먼저 In the morning은 때를 나타내는 전치사구예요. 시간 정보를 문장 앞에 두어 아침에라는 뜻을 먼저 알려 주는 거죠. 두 번째로 I check는 현재시제인데, 매일 반복되는 습관을 말할 때 쓰는 형태예요. 세 번째로 the tide and the weather는 and로 두 명사를 같은 자격으로 나란히 연결한 병렬 구조예요. 조수와 날씨, 두 가지를 한꺼번에 확인한다는 뜻이 담겨 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 입습니다\u003c/span>\u003cspan class=\"en\">I wear\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠수복과 수경을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">diving \u003c/span>\u003cspan class=\"tgt\">suit \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">swimming \u003c/span>\u003cspan class=\"tgt\">glasses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속에서 일하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 물속에서 일하기 위해 잠수복을 입고 수경을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물속에서 일하기 위해 무엇을 갖추는지 알려 주는 문장이에요. \u003cb class=\"key\">잠수복\u003c/b>과 \u003cb class=\"key\">수경\u003c/b>이라는 구체적인 장비를 제시해서 나리의 하루 준비 과정을 생생하게 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사(동명사)의 명사 수식 + and 병렬\u003c/span> : [동명사 diving + 명사 suit] and [동명사 swimming + 명사 glasses] : \"잠수복과 수경\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to부정사 to work + 전치사구 in the water] : \"물속에서 일하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I wear, 저는 입습니다. a diving suit and swimming glasses, 잠수복과 수경을. to work in the water, 물속에서 일하기 위해. 이 문장 전체를 해석하면, 저는 물속에서 일하기 위해 잠수복을 입고 수경을 씁니다.","hl":"m"},{"n":35,"text":"이 문장은 나리가 물속에서 일하기 위해 무엇을 갖추는지 알려 줘요. 잠수복과 수경이라는 구체적인 장비를 보여 주면서 하루의 준비 과정을 생생하게 그려 주는 거죠.","hl":"mn"},{"n":36,"text":"먼저 a diving suit and swimming glasses를 보세요. diving과 swimming이 각각 뒤에 오는 명사 suit와 glasses를 꾸며 주는 수식어 역할을 하고, 두 덩어리를 and로 병렬 연결했어요. 그래서 잠수복과 수경이라는 뜻이 되죠. 두 번째로 to work in the water는 to부정사의 부사적 용법으로 목적을 나타내요. 왜 그 장비를 입는지, 물속에서 일하기 위해서라는 목적을 붙여 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 아주 좋아합니다\u003c/span>\u003cspan class=\"en\">I love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠수하는 것과 시간을 보내는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">diving \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">spending \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">days,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 봅니다\u003c/span>\u003cspan class=\"en\">I see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 쓰레기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속에\u003c/span>\u003cspan class=\"en\">in the water,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 쓰레기를 줍니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> the trash.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘은 물속에 쓰레기가 많이 보여서 쓰레기를 줍습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> These days는 '요즘은'이라는 뜻의 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요. 물속에 쓰레기가 많아진 \u003cb class=\"key\">문제\u003c/b>를 말하고, 그래서 나리가 직접 쓰레기를 줍는다는 실천으로 이어지죠. so는 앞의 이유와 뒤의 결과를 이어 주는 \u003cb class=\"key\">접속사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구(현재시제와 함께)\u003c/span> : These days, + 주어 + 현재동사 : \"요즘은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">a lot of + 불가산명사\u003c/span> : a lot of + [불가산명사] : \"많은 쓰레기가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사(원인-결과)\u003c/span> : [원인], so [결과] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : pick + up + [목적어] / pick + [목적어] + up : \"줍다, 집어 들다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"These days, 요즘은. I see, 저는 봅니다. a lot of trash, 많은 쓰레기가. in the water, 물속에. so, 그래서. I pick up the trash, 저는 쓰레기를 줍니다. 이 문장 전체를 해석하면, 요즘은 물속에 쓰레기가 많이 보여서 쓰레기를 줍습니다.","hl":"m"},{"n":47,"text":"These days는 요즘이라는 뜻의 시간 표현이에요. 물속에 쓰레기가 많아진 문제를 말하고, 그래서 나리가 직접 쓰레기를 줍는다는 실천으로 이어지죠. so는 앞의 이유와 뒤의 결과를 이어 주는 접속사예요.","hl":"mn"},{"n":48,"text":"첫 번째 어법 포인트는 These days예요. 요즘이라는 뜻의 시간 표현으로, 지금 반복되는 습관이나 상황을 말할 때 현재시제와 함께 써요. 두 번째는 a lot of trash인데, trash는 셀 수 없는 불가산명사라서 복수형을 쓰지 않고, a lot of는 셀 수 있는 명사와 없는 명사 모두에 쓸 수 있는 수량 표현이에요. 세 번째는 so로, 앞 문장이 이유가 되고 뒤 문장이 결과가 되는 관계를 이어 주는 등위접속사예요. 마지막으로 pick up은 줍다라는 뜻의 구동사이고, 목적어가 대명사일 때는 부사 up 앞에 놓는다는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 믿습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 신경을 써야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다에\u003c/span>\u003cspan class=\"en\">the ocean.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 우리가 바다에 신경을 써야 한다고 믿습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나리 이야기의 마지막 \u003cb class=\"key\">결론\u003c/b> 문장으로, 우리가 바다를 소중히 여기고 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>에 관심을 가져야 한다는 \u003cb class=\"key\">당위\u003c/b>를 전합니다. care about은 단순히 '돌보다'가 아니라 '~에 신경 쓰다, 중요하게 여기다'라는 뜻이에요. 앞에서 쓰레기를 줍는 행동의 이유가 되는 나리의 가치관을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (목적어)\u003c/span> : believe [타동사] + that + [주어 + 동사 ...] : \"~라고 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should (당위)\u003c/span> : [주어] + should + [동사원형] : \"신경 써야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 about을 동반한 자동사 care\u003c/span> : care [자동사] + about + [명사구] : \"~에 신경 쓰다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"I believe, 저는 믿습니다. that we should care about, 우리가 신경을 써야 한다고. the ocean, 바다에. 이 문장 전체를 해석하면, 저는 우리가 바다에 신경을 써야 한다고 믿습니다.","hl":"m"},{"n":50,"text":"이 문장은 나리 이야기의 결론이에요. 바다를 소중히 여기고 환경 보호에 관심을 가져야 한다는 당위를 전하고 있죠. care about은 '신경 쓰다, 중요하게 여기다'라는 뜻으로, 나리가 쓰레기를 줍는 행동의 이유가 되는 가치관을 보여 줍니다.","hl":"mn"},{"n":51,"text":"첫 번째, believe는 타동사라서 뒤에 목적어가 필요하고, that이 이끄는 명사절이 목적어 역할을 해요. 이때 that은 접속사예요. 두 번째, should는 조동사라서 뒤에 동사원형이 오고, 여기서는 당위의 뜻으로 '~해야 한다'를 나타내요. 세 번째, care는 자동사로 쓰여 about과 함께 오면 '신경 쓰다'라는 뜻이 되고, 이때 전치사 about의 쓰임이 중요해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자연에서 일하는 사람들은 바다, 산, 심지어 북극에서도 일하며, 우리는 그들의 \u003cb class=\"key\">이야기\u003c/b>를 들어 볼 수 있다.\u003c/li>\u003cli>거제의 해녀 나리는 물에 잠수해 \u003cb class=\"key\">해산물\u003c/b>을 채집하고, 아침마다 조수와 날씨를 확인한 뒤 잠수복과 수경을 착용한다.\u003c/li>\u003cli>그녀는 해산물을 너무 많이 채집하지 않는데, 이것이 \u003cb class=\"key\">바다\u003c/b>에 좋기 때문이다.\u003c/li>\u003cli>요즘 물속의 \u003cb class=\"key\">쓰레기\u003c/b>를 줍는 실천을 통해, 그녀는 우리가 바다에 신경을 써야 한다고 믿는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People who work in nature, like the haenyeo Nari, take care of the ocean by collecting only what they need and picking up trash.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 자연에서 일하는 사람들의 이야기를 들려주는 글이다. 거제의 \u003cb class=\"key\">해녀\u003c/b> 나리는 조수와 날씨를 확인하고 잠수복과 수경을 갖춘 뒤 물속에서 \u003cb class=\"key\">해산물\u003c/b>을 채집하며, 너무 많이 채집하지 않고 쓰레기를 줍는 등 \u003cb class=\"key\">바다\u003c/b>를 아끼는 실천을 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글의 핵심은 아주 선명해요. 자연에서 일하는 사람들, 그중에서도 해녀 나리는 바다를 아끼는 마음으로 일해요. 해산물을 너무 많이 채집하지 않고 쓰레기를 줍는 작은 실천이 결국 바다를 지키는 일이 된다는 메시지였죠. 오늘 배운 흐름과 어휘를 꼭 복습하고, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
