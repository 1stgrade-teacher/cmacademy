low lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자연에서 일하는 사람들</div><ul><li>사람들 중에는 자연 속에서 일하는 것을 좋아하는 이들이 있다. 바다, 산, 북극 같은 곳에서 일하며 각자의 이야기를 들려준다.</li><li>일터: 바다(sea), 산(mountains), 북극(Arctic)</li><li>자연 속 노동자들의 경험을 소개함</li><li>핵심 키워드: 자연(nature)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02나리의 직업</div><ul><li>나리는 거제에서 해녀(haenyeo)로 일하며 물속에 들어가 해산물을 채집한다.</li><li>직업: 해녀(haenyeo)</li><li>장소: 거제(Geoje)</li><li>하는 일: 잠수(dive)하여 해산물(seafood) 수집</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03일할 때의 준비</div><ul><li>나리는 아침마다 조수(tide)와 날씨(weather)를 확인하고 작업에 필요한 장비를 갖춘다.</li><li>조수(tide)와 날씨(weather) 점검</li><li>잠수복(diving suit) 착용</li><li>수경(swimming glasses) 사용</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04바다를 아끼는 마음</div><ul><li>나리는 바다를 아름답게 느끼며, 해산물을 너무 많이 잡지 않고 쓰레기도 줍는다.</li><li>바다(sea)를 사랑하고 잠수하는 것을 즐김</li><li>과도한 채집을 하지 않아 바다에 도움이 됨</li><li>물속 쓰레기(trash)를 보면 직접 주움</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05자연을 지키려는 생각</div><ul><li>나리는 바다를 돌봐야 한다고 믿으며, 자신의 일이 자연 보호와 연결된다고 생각한다.</li><li>바다 보호(ocean care)의 중요성 강조</li><li>일과 환경 보호가 함께 이루어짐</li><li>핵심 키워드: 책임감(responsibility)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 대자연</td></tr><tr><td class=\"w\">sea</td><td class=\"m\">바다</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr><tr><td class=\"w\">arctic</td><td class=\"m\">북극, 북극 지방</td></tr><tr><td class=\"w\">dive</td><td class=\"m\">잠수하다, 뛰어들다</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">모으다, 채집하다, 수확하다</td></tr><tr><td class=\"w\">seafood</td><td class=\"m\">해산물</td></tr><tr><td class=\"w\">check</td><td class=\"m\">확인하다, 점검하다</td></tr><tr><td class=\"w\">tide</td><td class=\"m\">조수, 밀물과 썰물</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr><tr><td class=\"w\">diving suit</td><td class=\"m\">잠수복</td></tr><tr><td class=\"w\">swimming glasses</td><td class=\"m\">수경, 물안경</td></tr><tr><td class=\"w\">spend time</td><td class=\"m\">시간을 보내다, 시간을 들이다</td></tr><tr><td class=\"w\">beautiful</td><td class=\"m\">아름다운, 멋진</td></tr><tr><td class=\"w\">trash</td><td class=\"m\">쓰레기, 폐기물</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">줍다, 집어 올리다, 치우다</td></tr><tr><td class=\"w\">care about</td><td class=\"m\">~을 걱정하다, ~을 중요하게 여기다, ~을 신경 쓰다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일하는 것을 사랑한다</span><span class=\"en\"><b>love <span class=\"grammar-hl\">to work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in nature</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 자연에서 일하는 것을 아주 좋아한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 첫 문장으로, 앞으로 자연에서 일하는 사람들의 이야기를 들려주겠다고 여는 문장입니다. 여기서는 ‘자연 속에서 일하는 일’이 힘든 노동이기만 한 것이 아니라, 좋아하고 즐길 수 있는 삶의 방식이라는 점을 먼저 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to work in nature (to부정사): to + 동사원형 구조로 목적을 나타낸다. 여기서 to work는 love의 목적어처럼 붙어 ‘자연에서 일하는 것’을 뜻하는 명사적 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 대자연</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일한다</span><span class=\"en\"><b>work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다, 산, 또는 심지어 북극에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in the sea, mountains, or even in the Arctic</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 바다, 산, 심지어 북극에서도 일한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 ‘자연 속에서 일하는 사람들’이 실제로 어떤 곳에서 일하는지 구체적으로 보여 줍니다. 보통의 사무실이나 도시가 아니라, 매우 거칠고 특별한 자연 환경까지 포함된다는 점을 강조해 자연 속 노동의 범위를 넓혀 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the sea, mountains, or even in the Arctic (관용표현): in + 장소 표현으로 ‘~에서’의 뜻을 만드는 기본 전치사구이다. sea, mountains, Arctic은 모두 work의 장소를 나타내는 부사구로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sea</td><td class=\"m\">바다</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr><tr><td class=\"w\">arctic</td><td class=\"m\">북극, 북극 지방</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 만나 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">meet them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 이야기를 들어 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">and listen to their stories</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들을 만나 보고 그들의 이야기를 들어 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 두 문장을 바탕으로, 이제부터 사례를 소개하겠다는 전환 문장입니다. 독자에게 “설명만 하는 글이 아니라 실제 사람들의 경험을 들려주겠다”는 흐름을 만들어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s meet them and listen to their stories (관용표현): Let’s는 Let us의 줄임말로 ‘~하자’의 제안 표현이다. meet, listen은 and로 연결된 병렬 동사구이며, listen은 to their stories와 함께 동사+전치사 구조를 이룬다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나리다</span><span class=\"en\"><b><span class=\"grammar-hl\">am Nari</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 나리입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 인물의 자기소개로, 앞부분의 일반적인 소개에서 구체적인 사례로 들어갑니다. 이제부터는 ‘자연에서 일하는 사람’ 중 한 사람의 개인적인 이야기가 시작된다는 신호입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am Nari 5형식(SVOC) 구조: be동사 am 뒤에 보어 Nari가 와서 주어 I를 설명하는 구조이다. S + be + C 형태로, I = Nari의 관계를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해녀이다</span><span class=\"en\"><b><span class=\"grammar-hl\">am a haenyeo</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거제의</span><span class=\"en\"><b><span class=\"grammar-hl\">in Geoje</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 거제의 해녀입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나리가 어떤 일을 하는 사람인지 밝히는 문장입니다. 앞 문장의 자기소개를 이어받아 직업과 지역을 알려 주며, 바다에서 일하는 사람이라는 핵심 정보를 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am a haenyeo in Geoje 5형식(SVOC) 구조: am 뒤의 a haenyeo가 주격보어로 쓰여 주어 I의 신분을 설명한다. in Geoje는 장소를 덧붙이는 부사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물에 잠수하고</span><span class=\"en\"><b><span class=\"grammar-hl\">dive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다 음식을 채집한다</span><span class=\"en\"><b><span class=\"grammar-hl\">in the water</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b><span class=\"grammar-hl\">and collect seafood</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 물에 잠수해서 해산물을 채집합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해녀의 실제 업무가 무엇인지 설명합니다. 앞 문장에서 직업을 말했고, 이 문장에서는 그 일이 어떤 모습인지 보여 주어 독자가 해녀의 일을 구체적으로 떠올릴 수 있게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I dive in the water and collect seafood 일반동사 구조: dive와 collect가 and로 연결된 병렬 동사구이다. in the water는 dive의 장소를 나타내는 부사구이고, collect는 seafood를 목적어로 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sea</td><td class=\"m\">바다</td></tr><tr><td class=\"w\">dive</td><td class=\"m\">잠수하다, 뛰어들다</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">모으다, 채집하다, 수확하다</td></tr><tr><td class=\"w\">seafood</td><td class=\"m\">해산물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아침에</span><span class=\"en\"><b><span class=\"grammar-hl\">In the morning</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인한다</span><span class=\"en\"><b>check</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조수와 날씨를</span><span class=\"en\"><b>the tide and the weather.</b></span></div></div><div class=\"lec-sent-ko\">아침에, 저는 조수와 날씨를 확인합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다에서 일할 때는 감으로만 일하는 것이 아니라, 안전과 수확을 위해 조건을 먼저 살펴야 한다는 점을 보여 줍니다. 앞 문장의 ‘물속에서 일한다’는 내용을 뒷받침하며, 자연을 상대하는 일이 계획과 준비를 필요로 한다는 사실을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In the morning (관용표현): 시간 부사구로 문장 전체의 기준 시점을 나타낸다. 문두에 와서 배경 시간을 먼저 제시한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">check</td><td class=\"m\">확인하다, 점검하다</td></tr><tr><td class=\"w\">tide</td><td class=\"m\">조수, 밀물과 썰물</td></tr><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠수복과 수경을 입는다</span><span class=\"en\"><b>wear a diving suit and swimming glasses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서 일하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to work in the water</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 물속에서 일하기 위해 잠수복을 입고 수경을 씁니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다에서 일하려면 몸을 보호하고 시야를 확보해야 한다는 배경이 들어 있습니다. 앞 문장의 준비 과정에 이어, 실제로 어떤 장비를 갖추고 일하는지 보여 주어 작업 환경의 현실감을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to work in the water (to부정사): to + 동사원형 구조로 목적을 나타낸다. 여기서 to work는 wear의 목적을 나타내는 부사적 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">diving suit</td><td class=\"m\">잠수복</td></tr><tr><td class=\"w\">swimming glasses</td><td class=\"m\">수경, 물안경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑한다</span><span class=\"en\"><b>love</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠수하는 것과 시간을 보내는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">diving and spending time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 바다에서</span><span class=\"en\"><b>in <span class=\"grammar-hl\">the beautiful sea</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 잠수하는 것과 아름다운 바다에서 시간을 보내는 것을 아주 좋아합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 생계를 위해 일하는 것을 넘어, 나리가 이 일을 진심으로 좋아한다는 마음을 드러냅니다. 앞의 여러 문장에서 일의 과정과 준비를 보여 준 뒤, 여기서는 그 일을 지속하게 만드는 즐거움과 애정을 말해 전체 분위기를 따뜻하게 바꿔 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">diving and spending time (동명사): -ing 형태가 love의 목적어처럼 쓰여 명사 역할을 한다. diving과 spending time은 모두 ‘좋아하는 행위’로 병렬된 동명사구이다.</div><div class=\"lec-gr-item\">the beautiful sea 형용사 beautiful이 명사 sea를 수식한다. sea 앞의 the는 특정한 바다를 가리키는 한정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sea</td><td class=\"m\">바다</td></tr><tr><td class=\"w\">beautiful</td><td class=\"m\">아름다운, 멋진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채집하지</span><span class=\"en\"><b><span class=\"grammar-hl\">don’t collect</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 해산물을</span><span class=\"en\"><b><span class=\"grammar-hl\">too much seafood</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 너무 많은 해산물을 채집하지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연을 아끼는 태도를 직접 말하는 문장입니다. 앞 문장에서 바다를 좋아한다고 했는데, 여기서는 그 애정이 실제 행동으로 이어진다는 점을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t collect 대동사(do/does/did) 설명 규칙: 여기서는 부정문을 만드는 조동사 do가 사용된 형태이다. 일반동사 collect 앞에 do not이 와서 현재시제 부정문을 만든다.</div><div class=\"lec-gr-item\">too much seafood (관용표현): too much는 ‘너무 많은’이라는 양 표현으로, 셀 수 없는 명사 seafood를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sea</td><td class=\"m\">바다</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">모으다, 채집하다, 수확하다</td></tr><tr><td class=\"w\">seafood</td><td class=\"m\">해산물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">This</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋다</span><span class=\"en\"><b><span class=\"grammar-hl\">is good</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다에</span><span class=\"en\"><b><span class=\"grammar-hl\">for the ocean</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것이 바다에 좋습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 이유를 짧게 정리한 설명입니다. 너무 많이 잡지 않는 행동이 바다 생태계를 지키는 데 도움이 된다는 뜻으로, 개인의 절제가 자연 보호와 연결된다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is good for the ocean 5형식(SVOC) 구조: be동사 is 뒤의 good이 보어로 쓰여 주어 This의 상태를 설명한다. for the ocean은 good의 기준이나 대상이 되는 전치사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요즘</span><span class=\"en\"><b>These days,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많이 본다</span><span class=\"en\"><b><span class=\"grammar-hl\">see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를</span><span class=\"en\"><b><span class=\"grammar-hl\">a lot of trash</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물속에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in the water</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>so</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줍는다</span><span class=\"en\"><b><span class=\"grammar-hl\">pick up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 쓰레기를</span><span class=\"en\"><b><span class=\"grammar-hl\">the trash</span>.</b></span></div></div><div class=\"lec-sent-ko\">요즘은 물속에 쓰레기가 많이 보여서 쓰레기를 줍습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바다에서 일하는 사람으로서 단순히 해산물만 보는 것이 아니라, 오염 문제도 직접 마주하고 있다는 내용입니다. 앞 문장의 ‘바다에 좋다’는 태도를 실제 행동으로 확장해, 바다를 보호하기 위해 청소까지 한다는 점을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I see a lot of trash in the water 5형식(SVOC) 구조: see는 여기서 지각동사로 쓰여 뒤에 목적어 a lot of trash를 취한다. in the water는 trash가 있는 장소를 나타내는 부사구이다.</div><div class=\"lec-gr-item\">a lot of trash (관용표현): a lot of는 ‘많은’의 뜻으로 뒤의 명사 trash를 수식한다. 수량을 나타내는 표현이다.</div><div class=\"lec-gr-item\">I pick up the trash (관용표현): pick up은 ‘줍다, 집어 올리다’의 뜻을 가진 구동사이다. pick과 up이 함께 하나의 동사 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trash</td><td class=\"m\">쓰레기, 폐기물</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">줍다, 집어 올리다, 치우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는다</span><span class=\"en\"><b><span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 바다를 신경 써야 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that we should care about the ocean</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 우리가 바다에 신경을 써야 한다고 믿습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마지막에서 나리의 생각을 정리하는 결론입니다. 앞에서 보여 준 절제, 청소, 바다에 대한 애정이 모두 이 한 문장으로 모입니다. 자연에서 일하는 사람은 자연을 이용하는 동시에 지켜야 한다는 메시지를 전합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I believe that we should care about the ocean 동격의 that: believe 뒤의 that절이 앞의 동사 belief 내용을 보충하는 내용절이다. 여기서는 명사+that절이 아니라 동사 뒤의 that절이므로 문장 내용 전체를 이끄는 목적절 구조이다.</div><div class=\"lec-gr-item\">should care about the ocean 조동사 should + 동사원형 care 구조로, 말하는 사람이 생각하는 필요/권고의 의미를 나타낸다. care about은 ‘~에 관심을 갖다, 신경 쓰다’의 관용표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">care about</td><td class=\"m\">~을 걱정하다, ~을 중요하게 여기다, ~을 신경 쓰다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자연 속에서 일하는 사람들은 특별한 환경에서 살아가며 일한다.</li><li>나리는 해녀로서 바다에서 해산물을 따고, 물때와 날씨를 살피며 준비한다.</li><li>그녀는 바다를 좋아하고, 너무 많이 채취하지 않으며, 쓰레기까지 주우며 바다를 지킨다.</li><li>이 이야기는 자연을 일터로 삼는 사람에게는 자연을 아끼는 마음이 중요하다는 점을 보여 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Nari works as a haenyeo in Geoje and loves the sea, so she collects only a limited amount of seafood and picks up trash to care for the ocean.</div>\n              <div class=\"lec-final-sum-ko\">나리는 거제에서 해녀로 일하며 바다를 사랑해서 해산물을 많이 채취하지 않고 쓰레기를 주워 바다를 돌본다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"},{"audio":"./1_audio/8.mp3","hl":"stage-4"}],[{"audio":"./1_audio/9.mp3","hl":null}],[{"audio":"./1_audio/10.mp3","hl":"main"},{"audio":"./1_audio/11.mp3","hl":"meaning"},{"audio":"./1_audio/12.mp3","hl":"grammar"}],[{"audio":"./1_audio/13.mp3","hl":"main"},{"audio":"./1_audio/14.mp3","hl":"meaning"},{"audio":"./1_audio/15.mp3","hl":"grammar"}],[{"audio":"./1_audio/16.mp3","hl":"main"},{"audio":"./1_audio/17.mp3","hl":"meaning"},{"audio":"./1_audio/18.mp3","hl":"grammar"}],[{"audio":"./1_audio/19.mp3","hl":"main"},{"audio":"./1_audio/20.mp3","hl":"meaning"},{"audio":"./1_audio/21.mp3","hl":"grammar"}],[{"audio":"./1_audio/22.mp3","hl":"main"},{"audio":"./1_audio/23.m
