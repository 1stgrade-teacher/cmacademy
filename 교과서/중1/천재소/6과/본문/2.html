<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(소) 6과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(소) 6과 본문2","audioDir":"2_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(소)\u003cbr>6과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>A Vet Who Cares for Wild Animals\u003c/h1>\u003ch2>야생 동물을 돌보는 수의사\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 지한은 \u003cb class=\"key\">지리산\u003c/b> 야생 동물 보호 센터의 \u003cb class=\"key\">수의사\u003c/b>로, 아픈 야생 동물을 돌보고 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">돌려보내며\u003c/b>, 곰과 같은 야생 동물을 돌보기 위해 산을 오릅니다. 그는 야생 동물 \u003cb class=\"key\">보호\u003c/b>의 중요성을 강조하며, 함께 살아가기 위해 그들과 그들의 \u003cb class=\"key\">서식처\u003c/b>를 계속 지켜보아야 한다고 말합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jihan, a vet at the wild animal care center in Jirisan, takes care of sick wild animals and sends them back home, and he says we should protect wild animals and their homes so that we can live together.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중1 천재 소 6과 본문 두 번째 지문을 함께 읽어 볼 거예요. 이 글은 지리산 야생 동물 보호 센터에서 일하는 수의사 지한이 자신의 일을 소개하고, 야생 동물 보호의 중요성을 말하는 글이죠. 요약하면 지한이 아픈 야생 동물을 돌보고 자연으로 돌려보내면서, 우리가 그들과 함께 살아가야 한다고 강조하는 글이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">지리산은 우리나라를 대표하는 국립공원(national park)으로, 반달가슴곰(Asiatic black bear)을 비롯한 많은 야생 동물이 사는 곳입니다. 야생 동물 보호 센터(wild animal care center)는 다친 야생 동물을 구조(rescue)하고 치료(treatment)한 뒤 다시 자연으로 돌려보내는 시설이에요. 여기서 일하는 수의사(vet, veterinarian)는 동물의 건강을 돌보는 전문가입니다. 마치 다친 사람이 병원에서 치료를 받고 집으로 돌아가듯이, 야생 동물도 치료가 끝나면 원래 살던 \u003cb class=\"key\">서식처\u003c/b>(habitat)로 돌아갑니다. 그래서 보호 센터의 일은 치료만이 아니라 \u003cb class=\"key\">서식처\u003c/b>를 지키는 일까지 포함합니다. 사람과 야생 동물이 같은 공간에서 살아가려면 서로의 영역을 \u003cb class=\"key\">지켜보는\u003c/b> 꾸준한 관심이 필요하다는 점을 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 짚고 갈게요. 지리산은 우리나라를 대표하는 국립공원이고, 반달가슴곰 같은 야생 동물이 사는 곳이에요. 야생 동물 보호 센터는 다친 동물을 구조하고 치료해서 다시 자연으로 돌려보내는 시설이죠. 여기서 일하는 수의사, 영어로 vet은 동물의 건강을 돌보는 전문가예요. 마치 다친 사람이 병원에서 치료받고 집으로 돌아가듯이, 야생 동물도 치료가 끝나면 원래 살던 서식처로 돌아갑니다. 그래서 보호 센터의 일은 치료만이 아니라 서식처를 지키는 일까지 포함한다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자기소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자 지한이 자신의 \u003cb class=\"key\">이름\u003c/b>을 밝히고, \u003cb class=\"key\">지리산\u003c/b> 야생 동물 보호 센터에서 일하는 \u003cb class=\"key\">수의사\u003c/b>라고 소개합니다. 독자에게 자신이 누구이며 어떤 일을 하는 사람인지 먼저 알려 주는 도입 부분입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>돌봄과 방사\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그는 센터에서 \u003cb class=\"key\">아픈\u003c/b> 야생 동물을 \u003cb class=\"key\">돌보고\u003c/b>, 다 나으면 그들을 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">돌려보냅니다\u003c/b>. 또한 곰과 같은 야생 동물을 돌보기 위해 자주 \u003cb class=\"key\">산을 \u003c/b>\u003cb class=\"key\">오릅니다\u003c/b>. 구체적인 활동을 통해 자신의 일을 보여 주는 부분입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>직업적 자부심\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>지한은 자신의 \u003cb class=\"key\">직업\u003c/b>이 자랑스럽다고 말하고, 야생 동물을 \u003cb class=\"key\">보호\u003c/b>하는 것이 \u003cb class=\"key\">중요\u003c/b>하다고 생각한다고 밝힙니다. 여기서 글의 \u003cb class=\"key\">주제\u003c/b>가 분명하게 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>함께 살기\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막으로 우리가 \u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">살아가기\u003c/b> 위해 그들과 그들의 \u003cb class=\"key\">서식처\u003c/b>를 계속 \u003cb class=\"key\">지켜보아야\u003c/b> 한다고 당부합니다. 조동사 should를 사용해 독자가 해야 할 일을 제시하며 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요. 이 글은 자기소개로 시작해서 구체적인 활동으로 이어지고, 마지막에 야생 동물 보호의 중요성을 말하며 끝나요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 지한이 자신의 이름을 밝히고, 지리산 야생 동물 보호 센터에서 일하는 수의사라고 소개하죠. 독자에게 자기가 누구이고 무슨 일을 하는 사람인지 먼저 알려 주는 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 구체적인 활동이 나와요. 그는 센터에서 아픈 야생 동물을 돌보고, 다 나으면 그들을 집으로 돌려보냅니다. 또 곰 같은 야생 동물을 돌보기 위해 자주 산을 오른다고 해요. 이 활동들이 뒤에 나올 주장을 받쳐 주는 근거가 된답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 가치와 주장이에요. 지한은 자기 직업이 자랑스럽다고 말하고, 야생 동물을 보호하는 것이 중요하다고 생각한다고 밝혀요. 바로 여기가 이 글의 주제가 드러나는 곳이죠.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 우리가 함께 살아가기 위해 그들과 그들의 서식처를 계속 지켜보아야 한다고 당부합니다. should를 써서 독자에게 해야 할 일을 분명하게 제시하고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 자기소개와 구체적인 활동을 먼저 제시하고, 주장은 뒤쪽으로 미뤄 놓았습니다. 그래서 주제가 글 끝부분에 나오는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 주제문은 여섯 번째 문장인 protecting wild animals is important이며, 지한의 경험과 활동이 이 \u003cb class=\"key\">주장\u003c/b>을 받쳐 주는 근거 역할을 합니다. 즉 자신의 사례라는 \u003cb class=\"key\">예시\u003c/b>를 통해 야생 동물 보호의 중요성을 전달하는 전개 방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Also (4)\u003c/b>\u003cspan>추가 정보 제시\u003c/span>\u003cb>I think that (6)\u003c/b>\u003cspan>의견·주장 표시\u003c/span>\u003cb>should (7)\u003c/b>\u003cspan>당위·당부 표현\u003c/span>\u003cb>to live together (7)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">take care of\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">look after\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">protecting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keep an eye on\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 자기소개와 구체적인 활동이라는 예시를 먼저 보여 준 다음, 뒤쪽에서 주장을 꺼내는 전개 방식이에요. 주제문은 여섯 번째 문장의 protecting wild animals is important 부분이고, 그래서 주제가 뒤에 나오는 미괄식 구조로 볼 수 있죠. 처음부터 주장을 던지는 두괄식이 아니라, 자신의 경험을 쌓아 올린 다음 결론으로 가는 방식이라는 점을 기억하세요.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. 네 번째 문장 맨 앞에 나오는 Also는 앞의 내용에 정보를 더하겠다는 표시예요. 여섯 번째 문장의 I think that은 화자의 의견과 주장을 꺼내는 표현이고요. 마지막 문장의 should는 당위와 당부를 나타내죠. 또 take care of와 look after가 같은 뜻으로 반복되면서 돌봄이라는 개념이 이어진다는 것도 꼭 챙겨 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>vet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>야생의\u003c/span>\u003c/div>\u003cdiv>\u003cb>animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>care\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보호, 돌봄\u003c/span>\u003c/div>\u003cdiv>\u003cb>center\u003c/b>\u003cem>명사\u003c/em>\u003cspan>센터, 시설\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>send back to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 돌려보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>home\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집, 서식지\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mountain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산\u003c/span>\u003c/div>\u003cdiv>\u003cb>look after\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>proud\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자랑스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>be proud of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 자랑스러워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>job\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직업\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>should\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep an eye on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 계속 지켜보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>live\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 순서대로 정리해 볼게요. take care of는 돌보다, look after도 돌보다라는 뜻으로, 이 글에서 같은 의미로 반복되는 핵심 표현이에요. send back to는 돌려보내다, be proud of는 자랑스러워하다라는 숙어이고요. keep an eye on은 계속 지켜보다라는 뜻으로 마지막 문장의 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">take care of\u003c/b>\u003cspan class=\"m\">~을 돌보다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">care for\u003c/span>\u003cspan class=\"s\">look after\u003c/span>\u003cspan class=\"s\">attend to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u0 s=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해요. take care of와 look after는 care for, attend to와 뜻이 통하고, 반대로 neglect나 ignore는 돌보지 않는다는 뜻이죠. protect는 guard, defend, preserve와 가깝고, harm이나 endanger는 반대말이에요. sick은 ill, unwell과 같고 healthy는 반대이고, important는 significant, essential과 같고 trivial은 반대예요. proud는 satisfied, pleased와 비슷하고 ashamed는 반대라는 것도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 이름은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">name \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지한입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Jihan\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제 이름은 지한입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지한이가 자기 자신을 소개하며 말문을 여는 첫 문장이에요. \u003cb class=\"key\">자기소개\u003c/b>에서 가장 기본이 되는 표현으로, 바로 뒤에 이어질 직업 소개로 자연스럽게 넘어가게 해 주는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다. \u003cb class=\"key\">My \u003c/b>\u003cb class=\"key\">name \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">...\u003c/b> 뒤에 이름만 바꿔 넣으면 언제든 쓸 수 있는 안전한 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어 My name] + [동사 is] + [주격보어 Jihan] → 주어와 보어가 같다고 말하는 구조 : \"제 이름은 지한입니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My name, 제 이름은. is, 입니다. Jihan, 지한입니다. 이 문장 전체를 해석하면, 제 이름은 지한입니다.","hl":"m"},{"n":13,"text":"이 문장은 지한이가 자기소개를 시작하는 첫 문장이에요. 자기소개에서 가장 기본이 되는 표현이고요, 바로 뒤에 나오는 직업 소개로 자연스럽게 이어 주는 도입 역할을 합니다. My name is 뒤에 이름만 바꿔 넣으면 언제든 쓸 수 있으니까 통째로 외워 두세요.","hl":"mn"},{"n":14,"text":"여기서 is는 주어와 보어를 등호로 이어 주는 be동사예요. 그래서 내 이름과 지한이 같은 사람이라는 동격 관계가 만들어지는 거죠. 이렇게 주어, be동사, 주격보어 순서로 가는 문장을 두 형식 문장이라고 불러요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 ~입니다\u003c/span>\u003cspan class=\"en\">I am\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수의사\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">vet \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 동물 보호 센터의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">center\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지리산에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Jirisan\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 지리산 야생 동물 보호 센터의 수의사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지한이의 직업과 일하는 장소를 한 번에 알려 주는 문장이에요. \u003cb class=\"key\">수의사\u003c/b>라는 직업에 \u003cb class=\"key\">지리산\u003c/b>이라는 구체적인 장소를 붙여서 독자가 상황을 바로 그릴 수 있게 해 줍니다. 앞 문장의 자기소개를 이어 받아 \u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">소개\u003c/b>로 넘어가는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사 a vet] + [전치사구 at the wild animal care center] → 뒤에서 앞의 명사를 꾸밈 : \"야생 동물 보호 센터의 수의사\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정관사 a의 용법(직업 명사 앞)\u003c/span> : [a + 직업 명사 vet] → 여러 사람 중 하나임을 나타냄 : \"수의사\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(장소 한정)\u003c/span> : [명사 the center] + [전치사구 in Jirisan] → 앞 명사에 장소 정보를 더함 : \"지리산에 있는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I am, 저는 ~입니다. a vet, 수의사. at the wild animal care center, 야생 동물 보호 센터의. in Jirisan, 지리산에 있는. 이 문장 전체를 해석하면, 저는 지리산 야생 동물 보호 센터의 수의사입니다.","hl":"m"},{"n":16,"text":"이 문장은 지한이의 직업과 일하는 장소를 한 번에 알려 주는 문장이에요. 수의사라는 직업에 지리산이라는 구체적인 장소를 붙여서 독자가 장면을 바로 그릴 수 있게 해 주죠. 앞 문장의 자기소개를 이어 받아 직업 소개로 넘어가는 흐름입니다.","hl":"mn"},{"n":17,"text":"먼저 a vet at the wild animal care center를 보세요. 전치사 at이 만든 구가 앞의 명사 vet을 뒤에서 꾸며 주는 형용사 역할을 해요. 그래서 어떤 수의사인지가 뒤에서 설명되는 구조죠. 다음으로 in Jirisan은 앞에 나온 center를 꾸며서 그 센터가 지리산에 있다는 정보를 더해 줍니다. 앞에서부터 보호 센터, 지리산에 있는 이렇게 끊어 읽기 하면 뜻이 자연스러워요. 마지막으로 a vet에서 부정관사 a는 셀 수 있는 직업 명사 앞에 붙어서 수의사라는 사람 중 하나라는 종류의 느낌을 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 돌보고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아픈 야생 동물을\u003c/span>\u003cspan class=\"en\">sick wild animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">센터의\u003c/span>\u003cspan class=\"en\">in the center\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들을 돌려보냅니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 집으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">homes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 센터의 아픈 야생 동물을 돌보고 그들을 집으로 돌려보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지한이가 실제로 하는 일을 구체적으로 보여 주는 문장이에요. \u003cb class=\"key\">돌보다\u003c/b>와 \u003cb class=\"key\">돌려보내다\u003c/b>라는 두 행동을 묶어서, 아픈 동물을 치료해 자연으로 되돌려 준다는 \u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">활동\u003c/b>의 핵심을 담고 있습니다. 뒤에 나오는 곰을 살피는 일로 이어지는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(동사구)\u003c/span> : [take care of + 목적어] → '~을 돌보다, 보살피다' : \"돌보고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 병렬 구조\u003c/span> : [take care of ...] + and + [send ...] → 두 동사구를 대등하게 연결 : \"그리고 그들을 집으로 돌려보냅니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">send + 목적어 + 부사 + 전치사구 구조\u003c/span> : [send + 목적어 them + 부사 back + 전치사구 to their homes] → '~을 ...로 되돌려 보내다' : \"그들을 그들의 집으로 돌려보냅니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I take care of, 저는 돌보고. sick wild animals, 아픈 야생 동물을. in the center, 센터의. and send them back, 그리고 그들을 돌려보냅니다. to their homes, 그들의 집으로. 이 문장 전체를 해석하면, 저는 센터의 아픈 야생 동물을 돌보고 그들을 집으로 돌려보냅니다.","hl":"m"},{"n":19,"text":"이 문장은 지한이가 실제로 하는 일을 구체적으로 보여 주는 문장이에요. 돌보다와 돌려보내다, 이 두 행동을 묶어서 아픈 동물을 치료해 자연으로 되돌려 준다는 보호 활동의 핵심을 담고 있죠. 뒤에 나오는 곰을 살피는 일로 이어지는 흐름의 출발점입니다.","hl":"mn"},{"n":20,"text":"먼저 take care of를 보세요. 이건 take, care, of가 따로가 아니라 하나로 굳어진 동사구예요. look after와 같은 뜻이고 뒤에 돌봄의 대상이 목적어로 옵니다. 다음으로 and를 중심으로 take care of와 send라는 두 동사구가 나란히 놓여 병렬을 이루고 있어요. 주어 I를 두 번 쓰지 않고 한 번에 묶어 주는 구조죠. 마지막으로 send them back to their homes에서는 send 뒤에 목적어 them이 오고, 방향을 나타내는 부사 back과 전치사구 to their homes가 이어져서 어디로 돌려보내다라는 이동의 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 자주 산을 오릅니다\u003c/span>\u003cspan class=\"en\">I often climb the mountain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 동물을 돌보기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">bears\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 저는 곰과 같은 야생 동물을 돌보기 위해 자주 산을 오릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지한이가 하는 일을 \u003cb class=\"key\">구체적\u003c/b>으로 알려 주는 역할을 해요. 앞에서는 센터에서 동물을 돌본다고 했고, 여기서는 산에 올라가 곰 같은 야생 동물을 돌본다고 덧붙이죠. to look after는 \u003cb class=\"key\">돌보다\u003c/b>라는 뜻이고, like는 여기서 '좋아하다'가 아니라 \u003cb class=\"key\">예시\u003c/b>를 나타내는 전치사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 주어 + 동사 + [to + 동사원형 (목적을 나타내는 부사구)] : \"야생 동물을 돌보기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like(예시)\u003c/span> : [명사] + like + [예시 명사] : \"곰과 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Also, 또한. I often climb the mountain, 저는 자주 산을 오릅니다. to look after wild animals, 야생 동물을 돌보기 위해. like bears, 곰과 같은. 이 문장 전체를 해석하면, 또한 저는 곰과 같은 야생 동물을 돌보기 위해 자주 산을 오릅니다.","hl":"m"},{"n":22,"text":"이 문장은 지한이가 하는 일을 구체적으로 알려 주는 역할을 해요. 앞에서는 센터에서 동물을 돌본다고 했고, 여기서는 산에 올라가 곰 같은 야생 동물을 돌본다고 덧붙이죠. to look after는 돌보다라는 뜻이고, like는 여기서 좋아하다가 아니라 예시를 나타내는 전치사예요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 to부정사의 부사적 용법이에요. to look after wild animals에서 to부정사가 산을 오르는 목적을 나타내서 야생 동물을 돌보기 위해라고 해석돼요. 두 번째는 전치사 like예요. like bears에서 like는 ~와 같은이라는 뜻으로 예시를 들어 주는 전치사이고, 동사로 쓰여서 ~을 좋아하다라는 뜻이 아니라는 걸 꼭 구별해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 자랑스럽습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">proud \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 직업이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 제 직업이 자랑스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자신의 직업에 대한 \u003cb class=\"key\">자부심\u003c/b>을 직접 표현하는 문장이에요. 앞에서 수의사로서 하는 일을 설명한 뒤, 그래서 내 직업이 자랑스럽다고 글의 흐름을 이어 줘요. be proud of는 '자랑스러워하다'라는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 축약형(I am → I'm)\u003c/span> : 주어 I + be동사 am → I'm : \"저는 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be proud of 관용 표현(형용사 + 전치사)\u003c/span> : be proud of + [명사(구)] : \"제 직업이 자랑스러운\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I'm proud, 저는 자랑스럽습니다. of my job, 제 직업이. 이 문장 전체를 해석하면, 저는 제 직업이 자랑스럽습니다.","hl":"m"},{"n":25,"text":"이 문장은 자신의 직업에 대한 자부심을 직접 표현하는 문장이에요. 앞에서 수의사로서 하는 일을 설명한 뒤, 그래서 내 직업이 자랑스럽다고 글의 흐름을 이어 줘요. be proud of는 자랑스러워하다라는 뜻의 관용 표현이에요.","hl":"mn"},{"n":26,"text":"첫 번째는 be동사의 축약형이에요. I am이 I'm으로 줄어든 축약 형태로, 회화나 일기 같은 글에서 아주 자연스럽게 쓰여요. 두 번째는 be proud of 관용 표현이에요. proud가 형용사라서 뒤에 전치사 of를 붙여서 ~을 자랑스러워하다라는 뜻을 만들고, of 뒤에는 자랑스러움의 대상인 my job이 와요. 그래서 I'm proud of my job은 저는 제 직업이 자랑스럽습니다가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 생각합니다\u003c/span>\u003cspan class=\"en\">I think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 동물을 보호하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">protecting \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 야생 동물을 보호하는 것이 중요하다고 생각합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 알려 주는 아주 중요한 문장이에요. 야생 동물을 보호하는 것이 중요하다는 지한이의 생각을 밝히고 있죠. protecting처럼 동사에 ing를 붙인 \u003cb class=\"key\">동명사\u003c/b>가 주어로 오면 '보호하는 것'이라는 뜻이 되고, 그 주어는 단수로 취급해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : 주어 + think + that + [주어 + 동사 (명사절/목적어)] : \"야생 동물을 보호하는 것이 중요하다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사(protecting) + 목적어] + 단수 동사(is) : \"야생 동물을 보호하는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I think, 저는 생각합니다. that protecting wild animals, 야생 동물을 보호하는 것이. is important, 중요하다고. 이 문장 전체를 해석하면, 저는 야생 동물을 보호하는 것이 중요하다고 생각합니다.","hl":"m"},{"n":28,"text":"이 문장은 이 글의 중심 생각을 알려 주는 아주 중요한 문장이에요. 야생 동물을 보호하는 것이 중요하다는 지한이의 생각을 밝히고 있죠. protecting처럼 동사에 ing를 붙인 동명사가 주어로 오면 보호하는 것이라는 뜻이 되고, 그 주어는 단수로 취급해요.","hl":"mn"},{"n":29,"text":"첫 번째는 접속사 that이 이끄는 명사절이에요. that protecting wild animals is important가 think의 목적어 역할을 하고, that은 뜻에 별 영향을 주지 않아서 해석하지 않아도 자연스러워요. 두 번째는 동명사 주어예요. protect에 ing를 붙여 protecting wild animals로 만들면 야생 동물을 보호하는 것이라는 주어가 돼요. 동명사 주어는 단수로 보기 때문에 be동사는 is를 쓴다는 점도 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 계속 지켜보아야 합니다\u003c/span>\u003cspan class=\"en\">We should \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">eye \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들과 그들의 서식처를\u003c/span>\u003cspan class=\"en\">them and their homes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 살아가기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 함께 살아가기 위해 그들과 그들의 서식처를 계속 지켜보아야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막 문장으로, 야생동물과 사람이 \u003cb class=\"key\">공존\u003c/b>하기 위해 우리가 해야 할 일을 제시합니다. '지켜보다'라는 뜻의 \u003cb class=\"key\">keep \u003c/b>\u003cb class=\"key\">an \u003c/b>\u003cb class=\"key\">eye \u003c/b>\u003cb class=\"key\">on\u003c/b>을 써서 단순히 보는 것이 아니라 지속적인 관심과 보호가 필요하다는 점을 강조하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현(숙어)\u003c/span> : keep an eye on + [목적어] (~을 계속 지켜보다) : \"~을 계속 지켜보다, ~을 주시하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절] + to + [동사원형] (~하기 위해) : \"함께 살아가기 위해\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We should keep an eye on, 우리는 계속 지켜보아야 합니다. them and their homes, 그들과 그들의 서식처를. to live together, 함께 살아가기 위해. 이 문장 전체를 해석하면, 우리는 함께 살아가기 위해 그들과 그들의 서식처를 계속 지켜보아야 합니다.","hl":"m"},{"n":31,"text":"이 문장은 글의 마무리 문장이에요. 야생동물과 우리가 함께 살아가기 위해 무엇을 해야 하는지 알려 주죠. 바로 그들과 그들의 서식처를 계속 지켜보는 거예요. 이렇게 서로가 더불어 사는 것을 공존이라고 해요. 여기서 keep an eye on은 단순히 한 번 보는 게 아니라 꾸준히 관심을 갖고 지켜본다는 뜻이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 keep an eye on을 볼게요. 이건 관용 표현이에요. eye가 단수로 쓰이면서 관심을 기울여 지켜보라는 뜻이 되죠. 두 번째로 to live together를 볼게요. 이건 to부정사의 부사적 용법으로 목적을 나타내요. 그러니까 함께 살아가기 위해라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>지한은 \u003cb class=\"key\">지리산\u003c/b> 야생 동물 보호 센터에서 일하는 \u003cb class=\"key\">수의사\u003c/b>입니다.\u003c/li>\u003cli>그는 센터에서 아픈 야생 동물을 \u003cb class=\"key\">돌보고\u003c/b>, 다 나으면 그들을 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">돌려보냅니다\u003c/b>.\u003c/li>\u003cli>또한 곰과 같은 야생 동물을 돌보기 위해 자주 \u003cb class=\"key\">산을 \u003c/b>\u003cb class=\"key\">오릅니다\u003c/b>.\u003c/li>\u003cli>그는 야생 동물 \u003cb class=\"key\">보호\u003c/b>가 중요하다고 생각하며, 함께 살아가기 위해 그들과 그들의 \u003cb class=\"key\">서식처\u003c/b>를 계속 지켜보아야 한다고 말합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jihan, a vet at the wild animal care center in Jirisan, takes care of sick wild animals and sends them back home, and he says we should protect wild animals and their homes so that we can live together.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 지한은 \u003cb class=\"key\">지리산\u003c/b> 야생 동물 보호 센터의 \u003cb class=\"key\">수의사\u003c/b>로, 아픈 야생 동물을 돌보고 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">돌려보내며\u003c/b>, 곰과 같은 야생 동물을 돌보기 위해 산을 오릅니다. 그는 야생 동물 \u003cb class=\"key\">보호\u003c/b>의 중요성을 강조하며, 함께 살아가기 위해 그들과 그들의 \u003cb class=\"key\">서식처\u003c/b>를 계속 지켜보아야 한다고 말합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 배운 내용을 정리해 볼게요. 지한은 지리산 보호 센터의 수의사로, 아픈 야생 동물을 돌보고 자연으로 돌려보냅니다. 그리고 야생 동물을 보호하는 것이 중요하다는 주장을 미괄식 구조로 전달하고 있죠. 함께 살아가기 위해 그들의 서식처를 계속 지켜보아야 한다는 마지막 문장을 꼭 기억하세요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
