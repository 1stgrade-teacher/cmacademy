><li>근무지: 야생동물 보호센터(wild animal care center)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02주된 업무</div><ul><li>아픈 야생동물을 돌보고 원래 살던 곳으로 돌려보낸다.</li><li>아픈 동물 치료 및 관리(care for sick wild animals)</li><li>야생동물의 고향으로 보내기(send them back to their homes)</li><li>핵심 키워드: 돌봄(care)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현장 관찰 활동</div><ul><li>산에 올라가 곰 같은 야생동물을 살핀다.</li><li>산을 자주 오름(climb the mountain)</li><li>야생동물 관찰(look after wild animals)</li><li>예시 동물: 곰(bears)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04직업에 대한 자부심</div><ul><li>지한은 자신의 일을 자랑스럽게 여기며, 야생동물 보호의 가치를 믿는다.</li><li>직업에 대한 자부심(proud)</li><li>야생동물 보호의 중요성(protecting wild animals is important)</li><li>핵심 키워드: 보호(protecting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05함께 살아가기 위한 태도</div><ul><li>야생동물과 그들의 서식지를 지켜야 인간과 동물이 함께 살 수 있다.</li><li>야생동물의 상태를 지속적으로 살펴야 함(keep an eye on them)</li><li>서식지(their homes) 보호 필요</li><li>공존(live together)의 중요성</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">돌보다, 보살피다, 책임지다</td></tr><tr><td class=\"w\">wild animal</td><td class=\"m\">야생동물</td></tr><tr><td class=\"w\">center</td><td class=\"m\">센터, 중심, 기관</td></tr><tr><td class=\"w\">send back</td><td class=\"m\">돌려보내다, 반송하다, 되돌려 보내다</td></tr><tr><td class=\"w\">look after</td><td class=\"m\">돌보다, 보살피다, 관리하다</td></tr><tr><td class=\"w\">proud of</td><td class=\"m\">~을 자랑스러워하는, ~에 대해 자부심을 느끼는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protect</td><td class=\"m\">보호하다, 지키다, 막다</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한, 중대한</td></tr><tr><td class=\"w\">keep an eye on</td><td class=\"m\">~을 지켜보다, ~을 주의 깊게 살피다</td></tr><tr><td class=\"w\">home</td><td class=\"m\">집, 서식지, 고향</td></tr><tr><td class=\"w\">live together</td><td class=\"m\">함께 살다, 공존하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제 이름은</span><span class=\"en\"><b><span class=\"grammar-hl\">My name is Jihan</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지한입니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">제 이름은 지한입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 시작으로, 화자가 누구인지 먼저 밝히는 자기소개입니다. 뒤에 나올 직업과 활동을 이해하기 위한 기본 정보입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My name is Jihan 5형식(SVOC) 구조: my name(S) + is(V) + Jihan(C) 형태로, 주어의 신원을 보어가 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I am a vet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수의사이다</span><span class=\"en\"><b><span class=\"grammar-hl\">at the wild animal care center</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지리산의 야생 동물 보호 센터에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in Jirisan</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 지리산 야생 동물 보호 센터의 수의사입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자의 직업과 근무지를 알려 줍니다. 앞 문장에서 이름을 소개한 뒤, 이 사람이 어떤 일을 하는 사람인지 자연스럽게 이어서 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am a vet 5형식(SVOC) 구조: I(S) + am(V) + a vet(C) 형태로, 보어가 주어의 직업/신분을 설명한다.</div><div class=\"lec-gr-item\">at the wild animal care center in Jirisan (전치사구): at the wild animal care center와 in Jirisan은 모두 장소를 나타내어 앞의 명사 vet를 구체적으로 덧붙여 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild animal</td><td class=\"m\">야생동물</td></tr><tr><td class=\"w\">center</td><td class=\"m\">센터, 중심, 기관</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는</span><span class=\"en\"><b>I <span class=\"grammar-hl\">take care of</span> <span class=\"grammar-hl\">sick wild animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아픈 야생 동물을 돌보고</span><span class=\"en\"><b>in the center</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">센터에서</span><span class=\"en\"><b>and <span class=\"grammar-hl\">send them back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 돌려보내며</span><span class=\"en\"><b><span class=\"grammar-hl\">to their homes</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집으로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 센터의 아픈 야생 동물을 돌보고 그들을 집으로 돌려보냅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수의사로서 실제로 하는 일을 구체적으로 말합니다. 단순히 치료만 하는 것이 아니라, 회복한 동물을 다시 자연으로 돌려보내는 것이 중요한 역할이라는 뜻입니다. 앞 문장의 직업 설명을 실제 업무로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take care of (관용표현): take care of는 &#39;돌보다&#39;라는 뜻의 고정 표현으로, 동사 take에 목적어 care와 전치사 of가 결합한 구조다.</div><div class=\"lec-gr-item\">sick wild animals 형용사+명사 구조: sick가 wild animals를 수식하여 &#39;아픈 야생동물들&#39;의 뜻을 만든다.</div><div class=\"lec-gr-item\">send them back to their homes 5형식(SVOC) 구조: send + 목적어(them) + 목적격 보어(back to their homes) 형태로, 목적어를 어떤 상태/방향으로 보내는지 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">돌보다, 보살피다, 책임지다</td></tr><tr><td class=\"w\">wild animal</td><td class=\"m\">야생동물</td></tr><tr><td class=\"w\">center</td><td class=\"m\">센터, 중심, 기관</td></tr><tr><td class=\"w\">home</td><td class=\"m\">집, 서식지, 고향</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한 나는 자주 산을 오른다</span><span class=\"en\"><b>Also, I often <span class=\"grammar-hl\">climb the mountain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생 동물들을 돌보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to look after wild animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곰과 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">like bears</span>.</b></span></div></div><div class=\"lec-sent-ko\">또한 저는 곰과 같은 야생 동물을 돌보기 위해 자주 산을 오릅니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 센터 안에서의 일에 더해, 현장에서도 활동한다는 점을 덧붙입니다. 야생동물 보호는 실내 치료만이 아니라 자연 서식지까지 직접 찾아가 돌보는 일이라는 점을 보여 줍니다. 앞 문장의 업무 설명을 확장하는 내용입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">climb the mountain to look after wild animals like bears (to부정사): to look after는 목적을 나타내며, 앞의 동작 climb의 목적을 설명한다.</div><div class=\"lec-gr-item\">look after (관용표현): look after는 &#39;돌보다&#39;라는 뜻의 숙어로, 동사 look과 전치사 after가 합쳐져 하나의 의미를 이룬다.</div><div class=\"lec-gr-item\">wild animals like bears like bears는 예시를 덧붙이는 전치사구로, 앞의 wild animals의 범위를 구체화한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild animal</td><td class=\"m\">야생동물</td></tr><tr><td class=\"w\">look after</td><td class=\"m\">돌보다, 보살피다, 관리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 자랑스럽다</span><span class=\"en\"><b><span class=\"grammar-hl\">I’m proud</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 직업의</span><span class=\"en\"><b><span class=\"grammar-hl\">of my job</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 제 직업이 자랑스럽습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 말한 일을 통해 느끼는 화자의 마음을 드러냅니다. 단순한 정보 전달에서 벗어나, 이 일이 화자에게 의미 있고 보람 있는 일이라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I’m proud of my job 형용사 보어 구조: proud of my job은 be동사 뒤에서 상태를 나타내는 보어 역할을 하며, of 이하가 기준/대상을 덧붙인다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">proud of</td><td class=\"m\">~을 자랑스러워하는, ~에 대해 자부심을 느끼는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생각한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생 동물을 보호하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that protecting wild animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요하다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is important</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 야생 동물을 보호하는 것이 중요하다고 생각합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화자의 가치관을 직접 밝히는 문장입니다. 앞 문장의 ‘자랑스럽다’는 감정이 왜 생겼는지 설명해 주는 근거가 되며, 이후 문장의 행동 지침으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I think that protecting wild animals is important 동격의 that: think의 목적어 that절이 뒤 내용을 받는 구조이다. 이 문장에서는 that 이하가 &#39;무엇을 생각하는지&#39;의 내용을 덧붙여 설명한다.</div><div class=\"lec-gr-item\">protecting wild animals (동명사): protecting이 명사처럼 쓰여 think that절 안에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">is important 5형식(SVOC) 구조: protecting wild animals(S) + is(V) + important(C) 형태로, 보어 important가 주어의 성질을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wild animal</td><td class=\"m\">야생동물</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다, 지키다, 막다</td></tr><tr><td class=\"w\">important</td><td class=\"m\">중요한, 중대한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 계속 지켜보아야 한다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">should keep an eye on</span> <span class=\"grammar-hl\">them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들과 그들의 서식처를</span><span class=\"en\"><b><span class=\"grammar-hl\">and their homes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 살아가기 위해</span><span class=\"en\"><b>to live together.</b></span></div></div><div class=\"lec-sent-ko\">우리는 함께 살아가기 위해 그들과 그들의 서식처를 계속 지켜보아야 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 핵심 결론입니다. 사람과 야생동물이 공존하려면 동물뿐 아니라 그들이 사는 환경까지 보호해야 한다는 뜻입니다. 앞의 직업 소개와 가치관을 바탕으로, 독자에게 함께 지켜야 한다는 메시지를 전합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should keep an eye on (관용표현): keep an eye on은 &#39;주의 깊게 지켜보다/살피다&#39;라는 뜻의 숙어로, 동사 keep과 목적어 an eye, 전치사 on이 결합한 고정 표현이다.</div><div class=\"lec-gr-item\">their homes to live together (to부정사): to live together는 목적을 나타내며, 앞의 행동의 목표를 설명한다.</div><div class=\"lec-gr-item\">them and their homes 대등한 목적어 연결: and가 them과 their homes를 연결하여 keep의 목적어를 나란히 제시한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep an eye on</td><td class=\"m\">~을 지켜보다, ~을 주의 깊게 살피다</td></tr><tr><td class=\"w\">home</td><td class=\"m\">집, 서식지, 고향</td></tr><tr><td class=\"w\">live together</td><td class=\"m\">함께 살다, 공존하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지한은 지리산 야생동물 보호센터에서 일하는 수의사이다.</li><li>그는 아픈 야생동물을 치료하고, 회복하면 자연으로 돌려보낸다.</li><li>때로는 산에 올라가 곰 같은 야생동물도 돌본다.</li><li>이 일에 큰 자부심을 느끼며, 야생동물 보호의 중요성을 강조한다.</li><li>사람과 동물이 함께 살기 위해서는 동물과 그들의 서식지를 함께 지켜야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The speaker works at a wild animal care center and climbs the mountain to care for wild animals, and believes they should be protected to live together.</div>\n              <div class=\"lec-final-sum-ko\">화자는 야생 동물 보호센터에서 일하고 산에 올라 야생 동물을 돌보며, 함께 살아가기 위해 그들을 보호해야 한다고 생각한다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"},{"audio":"./2_audio/8.mp3","hl":"stage-4"}],[{"audio":"./2_audio/9.mp3","hl":null}],[{"audio":"./2_audio/10.mp3","hl":"main"},{"audio":"./2_audio/11.mp3","hl":"meaning"},{"audio":"./2_audio/12.mp3","hl":"grammar"}],[{"audio":"./2_audio/13.mp3","hl":"main"},{"audio":"./2_audio/14.mp3","hl":"meaning"},{"audio":"./2_audio/15.mp3","hl":"grammar"}],[{"audio":"./2_audio/16.mp3","hl":"main"},{"audio":"./2_audio/17.mp3","hl":"meaning"},{"audio":"./2_audio/18.mp3","hl":"grammar"}],[{"audio":"./2_audio/19.mp3","hl":"main"},{"audio":"./2_audio/20.mp3","hl":"m
