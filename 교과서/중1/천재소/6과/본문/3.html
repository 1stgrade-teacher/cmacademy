<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 천재(소) 6과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 천재(소) 6과 본문3","audioDir":"3_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>천재(소)\u003cbr>6과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>An Arctic Scientist Studying the Climate Crisis\u003c/h1>\u003ch2>기후 위기를 연구하는 극지 과학자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 극지 과학자 은은 노르웨이 북극 다산 과학 기지에서 \u003cb class=\"key\">토양\u003c/b>, 바닷물, 얼음을 연구하며 \u003cb class=\"key\">아라온호\u003c/b> 덕분에 바닷물 표본을 채집한다. 그녀는 \u003cb class=\"key\">북극해\u003c/b>가 기후 위기의 해답을 가지고 있다고 믿고 자신의 일이 지구를 돕기를 바란다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Arctic Ocean holds the answers to the climate crisis, and an Arctic scientist hopes her work can help the Earth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 1학년 천재 소 6과 본문, 은의 자기소개를 함께 읽어 볼 거예요. 이 글은 극지 과학자 은의 일과 꿈을 담고 있어요. 은은 북극을 연구하며 아라온호를 타고 바닷물 표본을 모으고, 그 연구가 기후 위기의 해답이 되기를 바란다는 내용이랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">먼저 배경지식을 짚어 볼게요. 북극은 the Arctic이라고 부르고, 지구에서 가장 추운 지역 중 하나예요. 이곳의 \u003cb class=\"key\">얼음\u003c/b>과 바닷물은 지구 기후를 이해하는 중요한 자료가 됩니다. 배경지식이 낯설다면, 북극을 지구의 냉장고라고 생각해 보세요. 냉장고 문이 열려 있으면 음식이 상하듯, 북극의 얼음이 녹으면 지구의 \u003cb class=\"key\">기후\u003c/b>가 흔들립니다. 그래서 과학자들은 이곳을 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">위기\u003c/b>를 푸는 열쇠로 봅니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 북극은 the Arctic이라고 부르고, 지구에서 가장 추운 지역 중 하나예요. 이곳의 ice, 즉 얼음과 바닷물은 지구 기후를 이해하는 중요한 자료가 됩니다. 배경지식이 낯설다면, 북극을 지구의 냉장고라고 생각해 보세요. 냉장고 문이 열려 있으면 음식이 상하듯, 북극의 얼음이 녹으면 지구의 climate, 기후가 흔들린답니다. 그래서 과학자들은 이곳을 climate crisis, 기후 위기를 푸는 열쇠로 봐요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>연구자 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>이 글은 \u003cb class=\"key\">극지 \u003c/b>\u003cb class=\"key\">과학자\u003c/b> 은의 자기소개로 시작합니다. 그녀는 자신의 이름을 밝히고, 노르웨이의 \u003cb class=\"key\">북극 \u003c/b>\u003cb class=\"key\">다산 \u003c/b>\u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">기지\u003c/b>에서 일한다고 말합니다. 직업과 근무지를 먼저 제시하며 글을 여는 것이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연구 대상\u003csmall>예시 · 문장 3\u003c/small>\u003c/h4>\u003cp>이어서 은이 무엇을 연구하는지 소개합니다. 그녀는 북극의 \u003cb class=\"key\">토양\u003c/b>, \u003cb class=\"key\">바닷물\u003c/b>, 그리고 얼음을 연구한다고 말합니다. 자신의 일이 구체적으로 무엇인지 보여 주는 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아라온호\u003csmall>근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>다음으로 특별한 배인 \u003cb class=\"key\">아라온호\u003c/b>가 등장합니다. 이 배는 다른 배보다 더 튼튼해서 바다를 가로질러 \u003cb class=\"key\">두꺼운 \u003c/b>\u003cb class=\"key\">얼음\u003c/b>을 깰 수 있습니다. 그 덕분에 은은 바닷물 \u003cb class=\"key\">표본\u003c/b>을 채집할 수 있다고 말합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>의의와 소망\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>마지막으로 글은 \u003cb class=\"key\">북극해\u003c/b>가 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">위기\u003c/b>에 대한 해답을 가지고 있다고 주장합니다. 그래서 은의 연구는 단순한 탐사가 아니라 지구를 돕는 일이 됩니다. 그녀는 자신의 일이 \u003cb class=\"key\">지구\u003c/b>를 돕기를 바라며 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 은은 자신이 극지 과학자라고 소개하고, 노르웨이의 북극 다산 과학 기지에서 일한다고 말해요. 글의 첫 부분에서 자신의 이름과 직업을 밝히는 거죠.","hl":"f0"},{"n":5,"text":"다음으로 그녀가 연구하는 대상을 소개해요. 토양, 바닷물, 얼음, 이렇게 세 가지를 연구한다고 말합니다.","hl":"f1"},{"n":6,"text":"그다음엔 특별한 배, 아라온호가 등장해요. 이 배는 다른 배보다 더 튼튼해서 바다를 가로질러 두꺼운 얼음을 깰 수 있어요. 그래서 은은 아라온호 덕분에 바닷물 표본을 채집할 수 있다고 말합니다.","hl":"f2"},{"n":7,"text":"마지막으로 글은 북극해가 기후 위기에 대한 해답을 가지고 있다고 주장해요. 그리고 자신의 일이 지구를 돕기를 바란다는 소망으로 끝맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 은이라는 인물의 구체적인 사례를 통해 북극 연구를 소개하는 \u003cb class=\"key\">예시\u003c/b> 방식입니다. 동시에 핵심 주장인 \u003cb class=\"key\">북극해\u003c/b>가 기후 위기의 해답을 가진다는 내용이 마지막 부분에 나오는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 앞부분은 자신의 직업과 연구 대상을 차례로 제시하고, 뒷부분에서 연구의 의의를 밝힙니다. 그래서 글의 결론에 해당하는 뒤쪽 문장에 주목해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>than (5)\u003c/b>\u003cspan>비교\u003c/span>\u003cb>Thanks to (7)\u003c/b>\u003cspan>인과\u003c/span>\u003cb>that (9)\u003c/b>\u003cspan>목적어절 유도\u003c/span>\u003cb>and (1)\u003c/b>\u003cspan>나열·추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the special ship, Araon\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This ship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Araon\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>아라온호\u003c/th>\u003cth>다른 배들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>더 튼튼함(stronger)\u003c/td>\u003ctd>덜 튼튼함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>두꺼운 얼음을 깰 수 있음\u003c/td>\u003ctd>두꺼운 얼음을 깰 수 없음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 은 자신의 사례를 보여 주는 예시 구조예요. 그리고 결론을 마지막에 배치한 미괄식으로 되어 있죠. 처음에는 자기소개로 시작하지만, 북극해가 기후 위기의 해답을 가진다는 핵심 주장은 뒤쪽에 나옵니다. 그래서 읽을 때 마지막 문장들을 특히 눈여겨봐야 해요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 다섯 번째 문장의 than은 다른 배와 비교하는 신호고, 일곱 번째 문장의 Thanks to는 원인과 결과를 이어 주는 표현이에요. 그리고 마지막 문장의 hope that은 바람의 내용을 이끄는 표현이죠. 이런 신호어를 찾으면 글의 뼈대가 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이름\u003c/span>\u003c/div>\u003cdiv>\u003cb>Arctic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>북극의, 극지의\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>station\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기지, 역\u003c/span>\u003c/div>\u003cdiv>\u003cb>Norway\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노르웨이\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>토양, 흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>seawater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바닷물\u003c/span>\u003c/div>\u003cdiv>\u003cb>ice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>얼음\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주, 흔히\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이동하다, 여행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배, 선박\u003c/span>\u003c/div>\u003cdiv>\u003cb>stronger\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 튼튼한(strong의 비교급)\u003c/span>\u003c/div>\u003cdiv>\u003cb>other\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨다, 부수다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>두꺼운\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다, 대양\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채집하다, 모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sample\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표본, 견본\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해답, 답\u003c/span>\u003c/div>\u003cdiv>\u003cb>climate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기후\u003c/span>\u003c/div>\u003cdiv>\u003cb>crisis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다, 희망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개를 짚어 볼게요. scientist는 과학자, station은 기지라는 뜻이에요. 또 special은 특별한, thick은 두꺼운이라는 뜻이고, collect는 모으다, 채집하다라는 의미랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">scientist\u003c/b>\u003cspan class=\"m\">과학자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">researcher\u003c/span>\u003cspan class=\"s\">scholar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">study\u003c/b>\u003cspan class=\"m\">연구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">research\u003c/span>\u003cspan class=\"s\">examine\u003c/span>\u003cspan class=\"s\">investigate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">exceptional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">usual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strong\u003c/b>\u003cspan class=\"m\">튼튼한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"s\">solid\u003c/span>\u003cspan class=\"s\">sturdy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">fragile\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thick\u003c/b>\u003cspan class=\"m\">두꺼운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dense\u003c/span>\u003cspan class=\"s\">heavy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collect\u003c/b>\u003cspan class=\"m\">모으다, 채집하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">pick up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">spread\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">answer\u003c/b>\u003cspan class=\"m\">해답, 답\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">solution\u003c/span>\u003cspan class=\"s\">reply\u003c/span>\u003cspan class=\"s\">key\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">question\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">crisis\u003c/b>\u003cspan class=\"m\">위기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emergency\u003c/span>\u003cspan class=\"s\">danger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">peace\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. study는 research, examine과 비슷하고 반대말은 ignore예요. special은 unique, particular과 가깝고 ordinary와 반대됩니다. strong은 tough, solid와 비슷하고 weak와 반대죠. 마지막으로 collect는 gather와 가깝고 scatter와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 이름은 은이고,\u003c/span>\u003cspan class=\"en\">My name is Eun,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 저는 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> I am\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">극지 과학자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">Arctic \u003c/span>\u003cspan class=\"tgt\">scientist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제 이름은 은이고, 저는 극지 과학자입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자기소개로 시작하는 문장이에요. 먼저 \u003cb class=\"key\">이름\u003c/b>을 말하고, 이어서 \u003cb class=\"key\">직업\u003c/b>인 극지 과학자를 밝혀 자신이 어떤 사람인지 알려 줍니다. 앞으로 이어질 북극 연구 이야기의 \u003cb class=\"key\">화자\u003c/b>가 누구인지 소개하는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사(두 문장 연결)\u003c/span> : 문장 + [[and]] + 문장 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 주격 보어(명사구)\u003c/span> : 주어(I) + be동사(am) + [[주격 보어(명사구)]] : \"극지 과학자\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My name is Eun, 내 이름은 은이고. and I am, 그리고 저는 ~입니다. an Arctic scientist, 극지 과학자. 이 문장 전체를 해석하면, 제 이름은 은이고, 저는 극지 과학자입니다.","hl":"m"},{"n":13,"text":"이 문장은 자기소개예요. 이름을 먼저 말하고, 이어서 직업인 극지 과학자를 밝히죠. 그래서 앞으로 나올 북극 연구 이야기의 주인공이 누구인지 알려 주는 도입 역할을 한답니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 and예요. 두 문장을 대등하게 이어 주는 등위접속사죠. 두 번째 포인트는 an Arctic scientist인데요. be동사 am 뒤에서 주어 I를 설명해 주는 주격 보어 자리예요. 주어와 보어가 같은 사람을 가리키는 문장이라는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 일합니다\u003c/span>\u003cspan class=\"en\">I work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극 다산 과학 기지에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Arctic \u003c/span>\u003cspan class=\"tgt\">Dasan \u003c/span>\u003cspan class=\"tgt\">Station\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노르웨이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Norway\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 노르웨이의 북극 다산 과학 기지에서 일합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">근무지\u003c/b>를 밝히는 문장이에요. 앞에서 극지 과학자라고 소개한 뒤, 노르웨이의 북극 다산 과학 기지에서 일한다고 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">장소\u003c/b>를 제시합니다. 독자가 화자의 활동 무대를 머릿속에 그려 볼 수 있게 해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : work + [[at + 특정 장소]] : \"북극 다산 과학 기지에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(범위·장소)\u003c/span> : [[in + 국가·넓은 지역]] : \"노르웨이에서 (노르웨이의)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I work, 저는 일합니다. at the Arctic Dasan Station, 북극 다산 과학 기지에서. in Norway, 노르웨이의. 이 문장 전체를 해석하면, 저는 노르웨이의 북극 다산 과학 기지에서 일합니다.","hl":"m"},{"n":16,"text":"이 문장은 근무지를 밝히는 문장이에요. 앞에서 극지 과학자라고 소개한 다음, 노르웨이의 북극 다산 과학 기지에서 일한다고 구체적인 장소를 제시하죠. 그래서 독자가 화자의 활동 무대를 머릿속에 그려 볼 수 있게 해 준답니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 at the Arctic Dasan Station이에요. work 뒤에서 어디서 일하는지 알려 주는 장소 부사구죠. at은 특정 지점을 콕 집어 말할 때 쓴다는 것도 기억해 두세요. 두 번째 포인트는 in Norway인데요. in은 국가처럼 넓은 범위를 나타낼 때 써요. 이 전치사구가 앞에 나온 기지가 어디에 있는지 더 자세히 알려 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 연구합니다\u003c/span>\u003cspan class=\"en\">I study\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토양, 바닷물, 얼음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">soil, \u003c/span>\u003cspan class=\"tgt\">seawater, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Arctic\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 북극의 토양, 바닷물, 얼음을 연구합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">대상\u003c/b>을 구체적으로 나열한 문장이에요. 토양, 바닷물, 얼음이라는 세 가지 \u003cb class=\"key\">재료\u003c/b>를 통해 화자가 무엇을 연구하는지 한눈에 보여 줍니다. 뒤에 나올 배와 바닷물 이야기의 \u003cb class=\"key\">바탕\u003c/b>이 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 병렬 구조(A, B, and C)\u003c/span> : [[명사 + , + 명사 + , + and + 명사]] : \"토양, 바닷물, 그리고 얼음\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : [[in + the Arctic]] : \"북극에서 (북극의)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I study, 저는 연구합니다. the soil, seawater, and ice, 토양, 바닷물, 얼음을. in the Arctic, 북극의. 이 문장 전체를 해석하면, 저는 북극의 토양, 바닷물, 얼음을 연구합니다.","hl":"m"},{"n":19,"text":"이 문장은 연구 대상을 구체적으로 나열한 문장이에요. 토양, 바닷물, 얼음이라는 세 가지 재료를 통해 화자가 무엇을 연구하는지 한눈에 보여 주죠. 뒤에 나올 배와 바닷물 이야기의 바탕이 되는 문장이랍니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 the soil, seawater, and ice예요. 여러 명사를 콤마로 나열하고 마지막에 and로 묶는 병렬 구조죠. 이렇게 세 가지가 하나로 묶여서 study의 목적어가 된답니다. 두 번째 포인트는 in the Arctic이에요. 어디서 연구하는지 알려 주는 장소 부사구이고, 앞에 나온 대상들을 북극이라는 공간 안으로 한정해 준다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 자주 이동합니다\u003c/span>\u003cspan class=\"en\">I often travel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 배를 타고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">ship, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아라온호\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Araon\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 특별한 배인 아라온호를 타고 자주 이동합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 연구에 꼭 필요한 이동 수단인 \u003cb class=\"key\">아라온호\u003c/b>를 처음 소개하는 대목이에요. 콤마 뒤에 이름 Araon을 붙여 '특별한 배'가 곧 아라온호임을 알려 주죠. 그래서 뒤 문장에서 이 배가 왜 특별한지 설명할 \u003cb class=\"key\">발판\u003c/b>을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(수단·교통)\u003c/span> : travel + on + [교통수단] : \"특별한 배를 타고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(콤마로 이어 주는 동격)\u003c/span> : [명사구], [그 명사구와 같은 대상을 가리키는 명사] : \"특별한 배인 아라온호\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I often travel, 저는 자주 이동합니다. on the special ship, 특별한 배를 타고. Araon, 아라온호. 이 문장 전체를 해석하면, 저는 특별한 배인 아라온호를 타고 자주 이동합니다.","hl":"m"},{"n":22,"text":"이 문장은 연구에 꼭 필요한 이동 수단인 아라온호를 처음 소개하는 부분이에요. 콤마 뒤에 Araon을 붙여서 특별한 배가 바로 아라온호라는 걸 알려 주죠. 그래서 뒤에 나오는 문장들이 이 배가 왜 특별한지 설명할 수 있게 돼요.","hl":"mn"},{"n":23,"text":"어법 포인트 첫 번째, the special ship, Araon은 동격이에요. 콤마 뒤 Araon이 앞의 명사와 같은 대상을 가리키니까 특별한 배인 아라온호로 해석해요. 두 번째, on the special ship에서 on은 배나 비행기 같은 교통수단 앞에 쓰여서 타고라는 수단의 뜻을 만들어요. 그래서 travel on the special ship은 특별한 배를 타고 이동하다가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 배는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">ship\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 튼튼합니다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stronger \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 배들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">ships\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 배는 다른 배보다 더 튼튼합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 소개한 아라온호가 왜 특별한지 이유를 대는 문장이에요. 다른 배들과 \u003cb class=\"key\">비교\u003c/b>해서 이 배가 더 튼튼하다는 점을 강조하죠. 그래서 다음 문장에서 두꺼운 얼음을 깰 수 있다는 \u003cb class=\"key\">근거\u003c/b>로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사·지시형용사의 지시 용법\u003c/span> : this + [단수 명사] : \"이 배는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + than (두 대상 비교)\u003c/span> : [형용사 + er] + than + [비교 대상] : \"다른 배들보다 더 튼튼한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This ship, 이 배는. is stronger, 더 튼튼합니다. than other ships, 다른 배들보다. 이 문장 전체를 해석하면, 이 배는 다른 배보다 더 튼튼합니다.","hl":"m"},{"n":25,"text":"이 문장은 아라온호가 특별한 이유를 설명하는 부분이에요. 다른 배들과 비교해서 이 배가 더 튼튼하다는 걸 알려 주죠. 그래서 바로 다음 문장에서 두꺼운 얼음을 깰 수 있다는 이야기로 이어져요.","hl":"mn"},{"n":26,"text":"어법 포인트 첫 번째, stronger than other ships는 비교급 표현이에요. strong에 er을 붙여서 비교급을 만들고, than 뒤에 비교 대상인 other ships를 놓아 둘을 견주는 거죠. 두 번째, This ship의 this는 바로 앞 문장에서 나온 아라온호를 가리키는 말이에요. 그래서 이 배는이라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깰 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">break\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두꺼운 얼음을\u003c/span>\u003cspan class=\"en\">thick ice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다를 가로질러\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 바다를 가로질러 두꺼운 얼음을 깰 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '더 튼튼하다'는 점이 실제로 어떤 \u003cb class=\"key\">능력\u003c/b>으로 나타나는지 보여 주는 문장이에요. 바다를 가로질러 두꺼운 얼음을 깬다는 건 곧 쇄빙 능력을 뜻하죠. 그래서 이 배 덕분에 연구가 가능하다는 다음 내용의 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (능력)\u003c/span> : [주어] + can + [동사원형] : \"깰 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(경로)\u003c/span> : [동사] + across + [명사] : \"바다를 가로질러\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It, 그것은. can break, 깰 수 있습니다. thick ice, 두꺼운 얼음을. across the ocean, 바다를 가로질러. 이 문장 전체를 해석하면, 그것은 바다를 가로질러 두꺼운 얼음을 깰 수 있습니다.","hl":"m"},{"n":28,"text":"이 문장은 아라온호가 튼튼하다는 말이 실제로 어떤 능력인지 보여 줘요. 바다를 가로질러 두꺼운 얼음을 깰 수 있다는 건 쇄빙 능력을 뜻하죠. 그래서 이 배 덕분에 바닷물 시료를 모을 수 있다는 다음 내용의 근거가 돼요.","hl":"mn"},{"n":29,"text":"어법 포인트 첫 번째, can break에서 can은 능력을 나타내는 조동사예요. 조동사 뒤에는 동사원형이 오기 때문에 break가 그대로 쓰였죠. 두 번째, across the ocean에서 across는 가로질러라는 경로를 나타내는 전치사예요. 그래서 얼음을 깨면서 바다를 가로질러 간다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아라온호 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thanks \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Araon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 채집할 수 있습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">collect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바닷물 표본을\u003c/span>\u003cspan class=\"en\">seawater samples.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아라온호 덕분에 저는 바닷물 표본을 채집할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 소개한 배가 연구에 왜 중요한지를 밝히는 문장입니다. thanks to가 아라온호를 채집의 \u003cb class=\"key\">원인\u003c/b>으로 묶어 주고, 그 결과로 표본을 얻는다는 흐름을 만듭니다. 앞의 배 설명과 뒤의 바닷물 채집이 자연스럽게 \u003cb class=\"key\">연결\u003c/b>되는 자리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 thanks to (~덕분에)\u003c/span> : thanks to + [명사] → '~덕분에' : \"아라온호 덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can (능력·가능)\u003c/span> : can + [동사원형] : \"채집할 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Thanks to Araon, 아라온호 덕분에. I can collect, 저는 채집할 수 있습니다. seawater samples, 바닷물 표본을. 이 문장 전체를 해석하면, 아라온호 덕분에 저는 바닷물 표본을 채집할 수 있습니다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 소개한 배가 연구에 왜 중요한지 알려 줘요. 아라온호가 표본 채집의 원인이라는 걸 짚어 주는 문장이죠. 그래서 배 설명이 끝난 뒤에 이 문장이 이어지면서 연구 과정이 자연스럽게 연결됩니다.","hl":"mn"},{"n":32,"text":"첫 번째는 thanks to인데요, 이건 덕분에라는 뜻의 관용 표현이에요. 그래서 뒤에 아라온이 오면 아라온호 덕분에가 되는 거죠. 두 번째는 can인데요, 조동사 can 뒤에는 동사원형이 와야 해서 collect가 그대로 옵니다. 해석은 할 수 있다, 즉 가능을 나타내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극해는\u003c/span>\u003cspan class=\"en\">The Arctic Ocean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해답을 가지고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">answers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후 위기에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">climate \u003c/span>\u003cspan class=\"tgt\">crisis\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극해는 기후 위기에 대한 해답을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 유은 연구자가 이 일을 하는 이유를 한마디로 정리한 문장입니다. 북극해가 기후 위기를 풀 열쇠, 즉 \u003cb class=\"key\">해답\u003c/b>을 품고 있다는 뜻으로 선언하는 자리입니다. 그래서 앞의 바닷물 표본 채집 이야기와 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제 (일반적 사실)\u003c/span> : [주어] + has + [목적어] : \"가지고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to (~에 대한)\u003c/span> : [명사] + to + [명사] → '~에 대한 [명사]' : \"기후 위기에 대한 해답\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The Arctic Ocean, 북극해는. has the answers, 해답을 가지고 있습니다. to the climate crisis, 기후 위기에 대한. 이 문장 전체를 해석하면, 북극해는 기후 위기에 대한 해답을 가지고 있습니다.","hl":"m"},{"n":34,"text":"이 문장은 이 연구를 하는 이유를 한마디로 말해 줘요. 북극해가 기후 위기의 해답을 품고 있다는 뜻이죠. 그래서 앞에서 바닷물 표본을 채집한다는 이야기와 자연스럽게 이어집니다.","hl":"mn"},{"n":35,"text":"첫 번째는 the answers to인데요, answer나 key 같은 명사 뒤에 to를 붙이면 대한이라는 수식 관계가 만들어집니다. 그래서 기후 위기에 대한 해답이 되는 거죠. 두 번째는 has인데요, 북극해가 늘 해답을 품고 있다는 일반적 사실을 말하려고 현재시제를 쓴 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바랍니다\u003c/span>\u003cspan class=\"en\">I hope\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 일이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구를 도울 수 있기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 제 일이 지구를 도울 수 있기를 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글을 맺으면서 연구자가 품은 \u003cb class=\"key\">바람\u003c/b>을 전하는 문장입니다. 내 일이 지구에 힘이 되기를 원한다는 뜻으로, 앞에서 말한 연구와 채집 이야기를 모두 감싸는 \u003cb class=\"key\">마무리\u003c/b> 역할을 합니다. that 뒤에는 바라는 내용이 통째로 들어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 목적어)\u003c/span> : hope + that + [주어 + 동사] → '~을 바라다' : \"제 일이 지구를 도울 수 있기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can (가능)\u003c/span> : can + [동사원형] : \"도울 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I hope, 저는 바랍니다. that my work, 제 일이. can help the Earth, 지구를 도울 수 있기를. 이 문장 전체를 해석하면, 저는 제 일이 지구를 도울 수 있기를 바랍니다.","hl":"m"},{"n":37,"text":"이 문장은 글을 맺으면서 연구자의 바람을 말해 줘요. 내 일이 지구에 도움이 되기를 바란다는 뜻이죠. 그래서 앞에서 말한 연구와 채집 이야기를 모두 아우르는 마무리 문장이 됩니다.","hl":"mn"},{"n":38,"text":"첫 번째는 that인데요, hope 뒤에 접속사 that을 붙여서 바라는 내용 전체를 명사절로 만들어 목적어 자리에 넣은 겁니다. 두 번째는 can인데요, 조동사 can 뒤에는 동사원형이 오기 때문에 help가 그대로 나옵니다. 여기서는 도울 수 있다는 가능의 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>은은 노르웨이의 북극 다산 과학 기지에서 일하는 \u003cb class=\"key\">극지 \u003c/b>\u003cb class=\"key\">과학자\u003c/b>입니다.\u003c/li>\u003cli>그녀는 북극의 \u003cb class=\"key\">토양\u003c/b>, 바닷물, 얼음을 연구합니다.\u003c/li>\u003cli>특별한 배 \u003cb class=\"key\">아라온호\u003c/b>는 다른 배보다 튼튼해서 두꺼운 얼음을 깨고, 덕분에 바닷물 표본을 채집할 수 있습니다.\u003c/li>\u003cli>그녀는 \u003cb class=\"key\">북극해\u003c/b>가 기후 위기의 해답을 가지고 있다고 믿으며 자신의 일이 \u003cb class=\"key\">지구\u003c/b>를 돕기를 바랍니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Arctic Ocean holds the answers to the climate crisis, and an Arctic scientist hopes her work can help the Earth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 극지 과학자 은은 노르웨이 북극 다산 과학 기지에서 \u003cb class=\"key\">토양\u003c/b>, 바닷물, 얼음을 연구하며 \u003cb class=\"key\">아라온호\u003c/b> 덕분에 바닷물 표본을 채집한다. 그녀는 \u003cb class=\"key\">북극해\u003c/b>가 기후 위기의 해답을 가지고 있다고 믿고 자신의 일이 지구를 돕기를 바란다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘은 은의 자기소개를 통해 북극 연구의 의미를 살펴봤어요. 극지 과학자라는 직업, 아라온호의 역할, 그리고 기후 위기에 대한 해답이라는 핵심을 꼭 기억해 주세요. 그럼 다음 시간에 또 만나요. 수고했어요!","hl":null}]}]});</script></body></html>
