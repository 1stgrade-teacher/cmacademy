-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01북극 과학자의 소개</div><ul><li>화자는 노르웨이 북극 다산과학기지에서 일하는 북극 과학자(Eun)이다.</li><li>이름: Eun</li><li>직업: 북극 과학자(Arctic scientist)</li><li>근무지: 북극 다산과학기지(Arctic Dasan Station), 노르웨이(Norway)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연구 대상</div><ul><li>북극의 토양, 바닷물, 얼음을 조사하며 북극 환경을 연구한다.</li><li>연구 대상: 토양(soil), 해수(seawater), 얼음(ice)</li><li>연구 분야: 북극(Arctic)</li><li>핵심 키워드: 환경 연구(environmental research)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03특별한 배 아라온</div><ul><li>연구를 위해 아라온(Araon)이라는 특별한 배를 자주 탄다.</li><li>특별한 배: 아라온(Araon)</li><li>특징: 다른 배보다 강함(stronger)</li><li>기능: 두꺼운 얼음(thick ice)을 깨고 이동함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04연구 활동의 도움</div><ul><li>아라온 덕분에 해수 샘플(seawater samples)을 채집할 수 있다.</li><li>아라온은 북극해를 오가는 연구를 가능하게 함</li><li>바닷물 시료(seawater samples) 채집에 도움</li><li>연구 자료 수집이 쉬워짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05연구의 의미</div><ul><li>북극해는 기후 위기(climate crisis)의 해답을 가진 곳이며, 화자는 자신의 일이 지구에 도움이 되길 바란다.</li><li>북극해는 기후 위기의 단서를 제공함</li><li>연구의 목적: 지구(Earth)를 돕는 것</li><li>핵심 키워드: 기후 위기(climate crisis)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">my name is</td><td class=\"m\">내 이름은, 나는 ~라고 불린다</td></tr><tr><td class=\"w\">arctic scientist</td><td class=\"m\">북극 과학자</td></tr><tr><td class=\"w\">work at</td><td class=\"m\">~에서 일하다, ~에 근무하다</td></tr><tr><td class=\"w\">study</td><td class=\"m\">연구하다, 조사하다, 배우다</td></tr><tr><td class=\"w\">soil</td><td class=\"m\">토양, 흙</td></tr><tr><td class=\"w\">seawater</td><td class=\"m\">바닷물, 해수</td></tr><tr><td class=\"w\">ice</td><td class=\"m\">얼음</td></tr><tr><td class=\"w\">often</td><td class=\"m\">자주, 흔히</td></tr><tr><td class=\"w\">travel on</td><td class=\"m\">~을 타고 여행하다, ~을 이용해 이동하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">special ship</td><td class=\"m\">특별한 배, 특수 선박</td></tr><tr><td class=\"w\">stronger than</td><td class=\"m\">~보다 더 강한, ~보다 더 튼튼한</td></tr><tr><td class=\"w\">break</td><td class=\"m\">부수다, 깨다, 깨뜨리다</td></tr><tr><td class=\"w\">thick</td><td class=\"m\">두꺼운, 두터운, 진한</td></tr><tr><td class=\"w\">across the ocean</td><td class=\"m\">바다를 가로질러, 바다 전체에 걸쳐</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~때문에</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">모으다, 수집하다, 채집하다</td></tr><tr><td class=\"w\">sample</td><td class=\"m\">표본, 샘플, 견본</td></tr><tr><td class=\"w\">arctic ocean</td><td class=\"m\">북극해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내 이름은 은이다</span><span class=\"en\"><b><span class=\"grammar-hl\">My name is Eun</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나는 극지 과학자이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">I am an Arctic scientist</span>.</b></span></div></div><div class=\"lec-sent-ko\">제 이름은 은이고, 저는 극지 과학자입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 시작으로, 화자가 누구인지와 어떤 일을 하는 사람인지 먼저 밝힙니다. 앞으로 나올 내용이 북극 연구에 관한 개인적인 소개문임을 알려 주는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My name is Eun 기본 문장 구조: My name is ... 형태로 이름을 소개하는 표현이다. name 뒤에 보어처럼 고유명사 Eun이 와서 주어의 정체를 나타낸다.</div><div class=\"lec-gr-item\">I am an Arctic scientist 보어 구조: be동사(am) + 보어(an Arctic scientist) 형태이다. 주어 I의 신분/직업을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">my name is</td><td class=\"m\">내 이름은, 나는 ~라고 불린다</td></tr><tr><td class=\"w\">arctic scientist</td><td class=\"m\">북극 과학자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 일한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북극 다산 과학 기지에서</span><span class=\"en\"><b><span class=\"grammar-hl\">at the Arctic Dasan Station</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">노르웨이의</span><span class=\"en\"><b><span class=\"grammar-hl\">in Norway</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 노르웨이의 북극 다산 과학 기지에서 일합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 화자의 일터를 구체적으로 보여 줍니다. 1문장에서 말한 “북극 과학자”라는 말이 실제로 어디에서 이루어지는지 설명하면서, 뒤에 이어질 연구 활동의 배경을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I work at the Arctic Dasan Station in Norway 기본 문장 구조: 주어(I) + 동사(work) + 장소구(at the Arctic Dasan Station in Norway) 형태이다. at은 장소를 나타내는 전치사로, 뒤의 명사구를 목적어처럼 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work at</td><td class=\"m\">~에서 일하다, ~에 근무하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 연구한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토양, 바닷물, 그리고 얼음을</span><span class=\"en\"><b><span class=\"grammar-hl\">the soil, seawater, and ice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북극의</span><span class=\"en\"><b><span class=\"grammar-hl\">in the Arctic</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 북극의 토양, 바닷물, 얼음을 연구합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 화자가 구체적으로 무엇을 연구하는지 알려 줍니다. 북극 환경을 구성하는 핵심 요소들을 살피는 일이며, 바로 이런 연구가 기후 문제와 연결된다는 흐름을 만들기 위해 앞선 문장들 뒤에 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I study the soil, seawater, and ice in the Arctic 기본 문장 구조: 주어(I) + 동사(study) + 목적어(the soil, seawater, and ice) + 장소구(in the Arctic) 형태이다. study는 목적어를 직접 취하는 타동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">study</td><td class=\"m\">연구하다, 조사하다, 배우다</td></tr><tr><td class=\"w\">soil</td><td class=\"m\">토양, 흙</td></tr><tr><td class=\"w\">seawater</td><td class=\"m\">바닷물, 해수</td></tr><tr><td class=\"w\">ice</td><td class=\"m\">얼음</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 자주 이동한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I often travel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 배, 아라온호를 타고</span><span class=\"en\"><b><span class=\"grammar-hl\">on the special ship, Araon</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 특별한 배인 아라온호를 타고 자주 이동합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 연구를 하려면 현장에 직접 가야 한다는 점을 보여 줍니다. 앞의 연구 설명에서 자연스럽게 이어져, 북극 연구가 실험실 안에서만 끝나지 않고 실제 이동과 관측이 필요하다는 사실을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I often travel on the special ship, Araon 기본 문장 구조: 주어(I) + 동사(travel) + 전치사구(on the special ship, Araon) 형태이다. on은 탈것을 나타내는 전치사로 쓰여 이동 수단을 표현한다.</div><div class=\"lec-gr-item\">the special ship, Araon (동격): Araon이 the special ship을 다시 설명하는 동격 관계이다. 앞의 명사를 같은 대상을 가리키는 이름으로 덧붙여 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">often</td><td class=\"m\">자주, 흔히</td></tr><tr><td class=\"w\">travel on</td><td class=\"m\">~을 타고 여행하다, ~을 이용해 이동하다</td></tr><tr><td class=\"w\">special ship</td><td class=\"m\">특별한 배, 특수 선박</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 배는</span><span class=\"en\"><b>This ship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 튼튼하다</span><span class=\"en\"><b><span class=\"grammar-hl\">is stronger</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 배들보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than other ships</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 배는 다른 배보다 더 튼튼합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 왜 아라온호가 필요한지 설명하는 근거입니다. 앞 문장에서 등장한 특별한 배가 단순한 이동 수단이 아니라, 북극 환경을 견딜 수 있는 성능을 가진 배라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is stronger than other ships (비교구문): stronger than ... 형태이다. stronger는 형용사의 비교급이고, than이 비교 대상을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stronger than</td><td class=\"m\">~보다 더 강한, ~보다 더 튼튼한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 깰 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">It can break</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두꺼운 얼음을</span><span class=\"en\"><b><span class=\"grammar-hl\">thick ice</span></b></span></div><div class=\"lec- "lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thanks to Araon (관용표현): Thanks to ...는 &#39;~덕분에&#39;라는 뜻의 숙어로, 뒤의 내용이 가능해진 원인을 나타낸다.</div><div class=\"lec-gr-item\">I can collect seawater samples 조동사 can + 동사원형 collect 구조이다. collect는 목적어 seawater samples를 직접 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seawater</td><td class=\"m\">바닷물, 해수</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~때문에</td></tr><tr><td class=\"w\">collect</td><td class=\"m\">모으다, 수집하다, 채집하다</td></tr><tr><td class=\"w\">sample</td><td class=\"m\">표본, 샘플, 견본</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">북극해는</span><span class=\"en\"><b>The Arctic Ocean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가지고 있다 해답을</span><span class=\"en\"><b><span class=\"grammar-hl\">has the answers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기후 위기에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">to the climate crisis</span>.</b></span></div></div><div class=\"lec-sent-ko\">북극해는 기후 위기에 대한 해답을 가지고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 중심 생각을 드러냅니다. 앞부분이 연구 방법과 도구를 설명했다면, 이 문장은 왜 그런 연구가 중요한지를 말합니다. 북극해를 조사하면 지구 기후 변화의 원인을 이해하고 해결의 실마리를 찾을 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has the answers to the climate crisis 기본 문장 구조: 주어(The Arctic Ocean) + 동사(has) + 목적어(the answers) + 전치사구(to the climate crisis) 형태이다. to는 answers가 연결되는 대상이나 관련 범위를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">arctic ocean</td><td class=\"m\">북극해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 희망한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I hope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 일이</span><span class=\"en\"><b><span class=\"grammar-hl\">that my work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 도울 수 있기를</span><span class=\"en\"><b><span class=\"grammar-hl\">can help the Earth</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 제 일이 지구를 도울 수 있기를 바랍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 마무리로, 화자의 연구 목적과 바람을 정리합니다. 앞에서 말한 모든 연구 활동은 결국 지구를 돕기 위한 것임을 강조하며, 개인의 일과 전 세계적 문제를 연결해 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I hope that my work can help the Earth 동사 hope 뒤의 that절이 목적절로 쓰였다. that절은 hope의 내용/희망 내용을 구체적으로 나타낸다.</div><div class=\"lec-gr-item\">my work can help the Earth that절 내부 구조: 주어(my work) + 조동사 can + 동사원형 help + 목적어(the Earth) 형태이다. help는 목적어를 취하는 타동사이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자는 북극 과학자이며 노르웨이의 북극 다산 기지에서 일한다.</li><li>북극의 토양, 바닷물, 얼음을 연구하기 위해 현장에 나간다.</li><li>아라온호는 얼음을 뚫고 이동할 수 있어 북극 연구를 가능하게 한다.</li><li>북극해를 연구하면 기후 위기의 해답을 찾을 수 있다고 본다.</li><li>화자는 자신의 연구가 지구에 도움이 되기를 바란다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An Arctic scientist studies the Arctic with Araon to gather data that may help solve the climate crisis.</div>\n              <div class=\"lec-final-sum-ko\">북극 과학자는 기후 위기 해결에 도움이 될 자료를 얻기 위해 아라온과 함께 북극을 연구한다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio
