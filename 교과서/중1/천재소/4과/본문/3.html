라 도마(cutting board) 위에 나와서 놀랐다.</li><li>예상과 달리 접시가 아닌 도마 위에 제공됨</li><li>시각적으로도 독특한 음식 형식이었음</li><li>음식의 모양 자체가 인상적이었다는 점을 강조함</li><li>핵심 키워드: 도마(cutting board)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04두 번째 놀라움과 소스</div><ul><li>고기가 매우 부드러웠고, 특별한 생선소스(fish sauce)도 맛있었다.</li><li>돼지고기(pork)의 식감이 매우 부드러움(soft)</li><li>함께 먹은 소스(sauce)도 인상적이었음</li><li>음식의 맛과 식감이 모두 좋았음</li><li>핵심 키워드: 생선소스(fish sauce)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05돔베의 의미</div><ul><li>나중에 ‘돔베(dombe)’가 제주 방언에서 도마를 뜻한다는 것을 알게 되었다.</li><li>돔베(dombe)는 제주어(Jeju’s language) 표현</li><li>뜻은 도마(cutting board)</li><li>음식 이름이 지역 언어와 연결됨</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jeju-do</td><td class=\"m\">제주도</td></tr><tr><td class=\"w\">hot</td><td class=\"m\">더운, 뜨거운</td></tr><tr><td class=\"w\">tired</td><td class=\"m\">피곤한, 지친</td></tr><tr><td class=\"w\">however</td><td class=\"m\">그러나, 하지만</td></tr><tr><td class=\"w\">get ... back</td><td class=\"m\">되찾다, 회복하다, 다시 얻다</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~때문에</td></tr><tr><td class=\"w\">surprise</td><td class=\"m\">놀라게 하다, 뜻밖이다</td></tr><tr><td class=\"w\">way</td><td class=\"m\">방식, 방법, 점, 측면</td></tr><tr><td class=\"w\">first</td><td class=\"m\">첫째로, 우선</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pork</td><td class=\"m\">돼지고기</td></tr><tr><td class=\"w\">cutting board</td><td class=\"m\">도마</td></tr><tr><td class=\"w\">plate</td><td class=\"m\">접시</td></tr><tr><td class=\"w\">soft</td><td class=\"m\">부드러운, 말랑한</td></tr><tr><td class=\"w\">sauce</td><td class=\"m\">소스, 양념장</td></tr><tr><td class=\"w\">learn</td><td class=\"m\">알게 되다, 배우다</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr><tr><td class=\"w\">language</td><td class=\"m\">언어, 말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">8월 2일</span><span class=\"en\"><b><span class=\"grammar-hl\">August 2</span></b></span></div></div><div class=\"lec-sent-ko\">8월 2일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 배경을 먼저 제시하는 문장입니다. 앞으로 제주도에서 있었던 경험을 이야기하겠다는 시작점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">August 2 기본 표현: 날짜를 나타내는 명사구이다. 문장 안에서 시간 부사어처럼 쓰일 수 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제주도는</span><span class=\"en\"><b><span class=\"grammar-hl\">Jeju-do</span> <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 섬이다</span><span class=\"en\"><b><span class=\"grammar-hl\">a beautiful island</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의</span><span class=\"en\"><b><span class=\"grammar-hl\">in Korea</span>.</b></span></div></div><div class=\"lec-sent-ko\">제주도는 한국의 아름다운 섬이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 배경을 먼저 제시하는 문장입니다. 앞으로 제주도에서 있었던 경험을 이야기하겠다는 시작점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Jeju-do (주어): 문장의 주체를 나타내는 명사이다.</div><div class=\"lec-gr-item\">is (be동사): 주어와 보어를 연결하는 연결동사이다.</div><div class=\"lec-gr-item\">a beautiful island in Korea (보어): 주격보어 역할을 하는 명사구이다. a beautiful island가 핵심 명사구이고, in Korea는 뒤에서 island를 꾸미는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">jeju-do</td><td class=\"m\">제주도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 거기에 갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">We went there</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 더운 날에</span><span class=\"en\"><b><span class=\"grammar-hl\">on a very hot day</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 피곤해졌다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">we became tired</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 매우 더운 날에 거기에 갔고 피곤해졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장에서 소개한 제주도에서 실제로 겪은 상황을 이어 줍니다. 더운 날 이동해서 피곤해졌다는 점이 뒤에 나올 음식 이야기의 필요성을 자연스럽게 만들어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We went there on a very hot day 기본문 구조: 주어 + 동사 + 부사구이다. on a very hot day는 시간 부사어로 동작의 시점을 나타낸다.</div><div class=\"lec-gr-item\">we became tired 5형식(SVC) 구조: became는 연결동사처럼 쓰여 주어 we와 보어 tired를 연결한다. tired는 주어의 상태를 나타내는 형용사 보어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hot</td><td class=\"m\">더운, 뜨거운</td></tr><tr><td class=\"w\">tired</td><td class=\"m\">피곤한, 지친</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 우리는 기운을 되찾았다</span><span class=\"en\"><b>However, <span class=\"grammar-hl\">we got our energy back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돔베고기 덕분에</span><span class=\"en\"><b><span class=\"grammar-hl\">thanks to dombegogi</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 돔베고기 덕분에 우리는 기운을 되찾았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 “더워서 지쳤다”는 상황과 대비되며, 그 피로를 해결해 준 원인이 도톰베고기라는 뜻입니다. 글의 중심 경험이 음식임을 드러내는 전환 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we got our energy back 5형식(SVOC) 구조: get + O + 부사/보어 형태로 O의 상태 변화를 나타낸다. our energy가 목적어이고 back이 그 회복 상태를 나타내는 보어 역할을 한다.</div><div class=\"lec-gr-item\">thanks to dombegogi (관용표현): thanks to는 ‘~덕분에’라는 뜻의 관용적 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">however</td><td class=\"m\">그러나, 하지만</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~때문에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 나를 놀라게 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">It surprised me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 가지 면으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in two ways</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 두 가지 면으로 나를 놀라게 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장에서 말한 도톰베고기에 대해 구체적으로 무엇이 놀라웠는지 설명하겠다는 예고입니다. 뒤의 두 문장이 그 “두 가지”를 하나씩 풀어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It surprised me 5형식(SVOC) 구조: surprise + O 형태로 목적어 me를 직접 취한다. It이 주어, surprised가 동사, me가 목적어이다.</div><div class=\"lec-gr-item\">in two ways (전치사구): 동작이 어떤 기준이나 방식에서 일어났는지 나타내는 부사어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprise</td><td class=\"m\">놀라게 하다, 뜻밖이다</td></tr><tr><td class=\"w\">way</td><td class=\"m\">방식, 방법, 점, 측면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫째로, 그것은</span><span class=\"en\"><b>First, <span class=\"grammar-hl\">it was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돼지고기였다</span><span class=\"en\"><b><span class=\"grammar-hl\">pork</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도마 위의</span><span class=\"en\"><b><span class=\"grammar-hl\">on a cutting board</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">접시 위가 아닌</span><span class=\"en\"><b><span class=\"grammar-hl\">not on a plate</span>.</b></span></div></div><div class=\"lec-sent-ko\">첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 놀라운 점을 말합니다. 보통 음식은 접시에 담겨 나오는데, 여기서는 도마가 그릇처럼 사용된 점이 인상적이라는 뜻입니다. 제주 음식 문화의 독특함을 보여 주는 부분입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it was pork on a cutting board 5형식(SVC) 구조: was는 연결동사이고 pork가 보어이다. on a cutting board는 pork를 뒤에서 설명하는 전치사구이다.</div><div class=\"lec-gr-item\">on a cutting board (전치사구): pork의 위치를 나타내는 부사적 수식어이다.</div><div class=\"lec-gr-item\">not on a plate 대조 표현: 앞의 전치사구와 병렬로 대비시키는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">first</td><td class=\"m\">첫째로, 우선</td></tr><tr><td class=\"w\">pork</td><td class=\"m\">돼지고기</td></tr><tr><td class=\"w\">cutting board</td><td class=\"m\">도마</td></tr><tr><td class=\"w\">plate</td><td class=\"m\">접시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">둘째로, 고기는</span><span class=\"en\"><b>Second, <span class=\"grammar-hl\">the meat was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 부드러웠다!</span><span class=\"en\"><b><span class=\"grammar-hl\">so soft</span>!</b></span></div></div><div class=\"lec-sent-ko\">둘째로, 고기가 아주 부드러웠다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 놀라운 점입니다. 단순히 보기만 특이한 것이 아니라, 맛과 식감도 매우 만족스러웠다는 의미입니다. 앞문장의 “놀라움”을 실제 체험의 감탄으로 이어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the meat was so soft 5형식(SVC) 구조: was는 연결동사이고 soft가 보어이다. so는 뒤의 형용사 soft를 강조하는 정도부사이다.</div><div class=\"lec-gr-item\">so soft 강조 표현: so가 형용사 soft를 강조해서 정도를 크게 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">soft</td><td class=\"m\">부드러운, 말랑한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 그것을 먹었다</span><span class=\"en\"><b><span class=\"grammar-hl\">I had it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 생선 소스와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with a special fish sauce</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 소스도 훌륭했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">the sauce was great, too</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도톰베고기를 어떻게 먹었는지 구체적으로 설명합니다. 고기 자체뿐 아니라 곁들이는 소스까지 맛있어서 전체 경험이 더 좋았다는 뜻입니다. 앞의 감탄을 음식 맛의 세부로 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I had it with a special fish sauce 5형식(SVOC) 구조: had + O + 부가어구 형태이다. it이 목적어이고 with a special fish sauce는 함께한 대상을 나타내는 부사어이다.</div><div class=\"lec-gr-item\">the sauce was great, too 5형식(SVC) 구조: was는 연결동사이고 great가 보어이다. too는 ‘역시/또한’의 의미를 더하는 부사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sauce</td><td class=\"m\">소스, 양념장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에, 나는 배웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">Later</span>, <span class=\"grammar-hl\">I learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">about the meaning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돔베의</span><span class=\"en\"><b><span class=\"grammar-hl\">of dombe</span>.</b></span></div></div><div class=\"lec-sent-ko\">나중에 나는 돔베의 의미에 대해 배웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 음식 이름에 담긴 의미를 뒤늦게 이해하게 되었다는 마무리 흐름입니다. 앞에서 체험한 독특한 형태가 왜 그런 이름인지 설명으로 넘어가는 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Later 시간 부사: 뒤의 동작이 일어난 시점을 나타낸다.</div><div class=\"lec-gr-item\">I learned about the meaning of dombe 기본문 구조: 주어 + 동사 + 전치사구이다. about the meaning of dombe는 learned의 목적을 직접 받지 않고 전치사 about의 목적어 역할을 하는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learn</td><td class=\"m\">알게 되다, 배우다</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">It means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도마를</span><span class=\"en\"><b><span class=\"grammar-hl\">a cutting board</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제주 말로</span><span class=\"en\"><b><span class=\"grammar-hl\">in Jeju’s language</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 제주 말로 도마를 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장에서 말한 dombe의 뜻을 직접 밝혀 줍니다. 그래서 “도마 위에 나온 고기”라는 앞의 모습이 우연이 아니라, 이름과 형태가 연결된 문화적 특징임을 알 수 있게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It means a cutting board 5형식(SVC) 구조가 아니라 동사 mean의 기본 문형으로, 뒤의 명사구 a cutting board가 뜻하는 내용을 설명한다. 의미상 보어 역할의 명사구이다.</div><div class=\"lec-gr-item\">in Jeju’s language (전치사구): means의 의미 범위를 제한하는 부사어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cutting board</td><td class=\"m\">도마</td></tr><tr><td class=\"w\">language</td><td class=\"m\">언어, 말</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>제주도에서 더운 날 지쳐 있었지만 도톰베고기 덕분에 기운을 회복했다.</li><li>도톰베고기는 접시가 아니라 도마 위에 나와서 눈에 띄었다.</li><li>고기 자체도 매우 부드럽고, 함께 먹은 소스도 맛있었다.</li><li>나중에 dombe가 제주어로 도마를 뜻한다는 사실을 알게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The writer ate dombegogi in Jeju on a hot day and learned that “dombe” means cutting board in the local language.</div>\n              <div class=\"lec-final-sum-ko\">글쓴이는 더운 날 제주에서 돔베고기를 먹었고, “돔베”가 제주 방언으로 도마를 뜻한다는 것을 알게 되었다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"},
