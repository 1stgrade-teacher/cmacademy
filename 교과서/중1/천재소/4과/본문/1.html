qLR+H+f/wBX9PwTI/AjIORg/r6c+lIHU85H4n8vz4xQMdSE4BPYAn/PejI9Qfx9Ov5f59aRjhWI5wpPr06jvz/nBpad/wAe2/3dQP/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">My Korean Food Diary: A Visit to Damyang<small>나의 한국 음식 일기: 담양 방문기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">한국 음식 여행 지문을 이해하려면 먼저 향토 음식(Local food)과 지역 특산물(Regional specialty) 개념을 알아두시면 좋아요. 이 글에서 나오는 대통밥(Daetongbap)은 대나무 통에 밥을 지어 대나무 향이 밥에 스며드는 음식이고, 떡갈비(Tteokgalbi)는 다진 소고기를 양념해 부드럽고 달콤하게 만든 한국식 고기 요리라서, 둘 다 재료와 조리 방식이 지역의 특징을 잘 보여줍니다. 특히 담양(Damyang)은 대나무로 유명한 지역이라, 대나무 정원인 죽녹원(Jungnogwon) 같은 장소와 음식이 서로 연결되어 지역 문화와 음식이 함께 경험되는 관광의 예로 볼 수 있어요. 이런 맥락을 알고 읽으면, 단순히 “맛있었다”는 표현을 넘어서 왜 그 음식이 그 장소와 잘 어울리는지 더 자연스럽게 이해하실 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행의 시작</div><ul><li>여름방학 동안 윌리엄(William)은 가족과 함께 한국을 여행했다. 이 식도락 일기(food diary)의 배경이 되는 하루가 시작된다.</li><li>여행 시기: 여름방학(summer vacation)</li><li>여행 장소: 한국(Korea)</li><li>동행: 가족(family)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02담양과 죽녹원 방문</div><ul><li>담양(Damyang)에 가서 유명한 대나무 정원인 죽녹원(Jungnogwon)을 둘러보았다. 정원 산책을 즐기며 여행의 분위기를 느꼈다.</li><li>장소 소개: 죽녹원(Jungnogwon), famous bamboo garden</li><li>활동: 정원 산책(walking in the garden)</li><li>핵심 키워드: 대나무 정원(bamboo garden)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03지역 음식 맛보기</div><ul><li>둘러본 뒤 두 가지 지역 음식(local dishes)을 먹었다. 담양의 특색이 담긴 음식으로 여행의 맛을 더했다.</li><li>음식 1: 대통밥(daetongbap)</li><li>음식 2: 떡갈비(tteokgalbi)</li><li>핵심 키워드: 지역 음식(local dishes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04음식의 특징과 느낌</div><ul><li>대통밥은 대나무 그릇(bamboo bowl)에 담은 밥이고, 독특한 대나무 향(bamboo smell)이 인상적이었다. 떡갈비는 부드럽고 달콤했으며, 두 음식은 잘 어울렸다.</li><li>대통밥 특징: 대나무 그릇에 담은 밥(rice in a bamboo bowl)</li><li>떡갈비 특징: 부드럽고 달콤한(soft and sweet) 소고기 요리</li><li>전체 평가: 두 음식이 잘 어울림(went well together)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vacation</td><td class=\"m\">휴가, 방학</td></tr><tr><td class=\"w\">travel around</td><td class=\"m\">돌아다니다, 여행하다</td></tr><tr><td class=\"w\">family</td><td class=\"m\">가족</td></tr><tr><td class=\"w\">food diary</td><td class=\"m\">식사 기록, 음식 일기</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">bamboo</td><td class=\"m\">대나무</td></tr><tr><td class=\"w\">garden</td><td class=\"m\">정원, 공원</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다, 누리다</td></tr><tr><td class=\"w\">walk</td><td class=\"m\">걷다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look around</td><td class=\"m\">둘러보다, 구경하다</td></tr><tr><td class=\"w\">local</td><td class=\"m\">지역의, 현지의</td></tr><tr><td class=\"w\">dish</td><td class=\"m\">요리, 음식</td></tr><tr><td class=\"w\">rice</td><td class=\"m\">쌀, 밥</td></tr><tr><td class=\"w\">bowl</td><td class=\"m\">그릇, 사발</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일한</td></tr><tr><td class=\"w\">smell</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">soft</td><td class=\"m\">부드러운, 연한</td></tr><tr><td class=\"w\">sweet</td><td class=\"m\">달콤한, 맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나의 한국 음식 일기</span><span class=\"en\"><b><span class=\"grammar-hl\">My Korean Food Diary</span></b></span></div></div><div class=\"lec-sent-ko\">나의 한국 음식 일기</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 제목입니다. 한국 여행 중 먹은 음식을 날짜별로 기록한 짧은 일기라는 뜻을 먼저 알려 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">My Korean Food Diary (명사구): 소유격 My가 뒤의 명사구 Korean Food Diary를 수식한다. 전체가 제목처럼 쓰인 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">food diary</td><td class=\"m\">식사 기록, 음식 일기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여름 방학 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">During the summer vacation</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">William은 한국 여기저기를 여행했다</span><span class=\"en\"><b>William <span class=\"grammar-hl\">traveled around Korea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with his family</span>.</b></span></div></div><div class=\"lec-sent-ko\">여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 배경을 여는 문장입니다. 누가 언제 어떤 상황에서 여행했는지 알려 주며, 뒤에 나올 음식 이야기가 여행 중의 경험임을 깔아 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">During the summer vacation (전치사구): During + 명사구 구조로, 문장 전체의 시간을 나타내는 부사어 역할을 한다.</div><div class=\"lec-gr-item\">traveled around Korea with his family (동사구): traveled가 문장의 서술어이고, around Korea와 with his family가 각각 이동의 범위와 동반 대상을 나타내는 부사어로 붙는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vacation</td><td class=\"m\">휴가, 방학</td></tr><tr><td class=\"w\">family</td><td class=\"m\">가족</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">This is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 음식 일기이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">his food diary</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 그의 음식 일기이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 여행을 바탕으로, 이 글이 단순한 여행기가 아니라 먹은 것을 기록한 일기임을 분명히 합니다. 그래서 뒤의 내용이 음식 중심으로 전개될 것이라고 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is his food diary be동사 문장: This가 주어, is가 be동사, his food diary가 주격보어로 이어지는 기본 연결 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">food diary</td><td class=\"m\">식사 기록, 음식 일기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">7월 25일</span><span class=\"en\"><b><span class=\"grammar-hl\">July 25</span></b></span></div></div><div class=\"lec-sent-ko\">7월 25일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 날짜를 표시한 부분입니다. 이제부터는 그날 무엇을 먹고 무엇을 느꼈는지, 일정한 순서로 적는 형식이라는 것을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">July 25 (명사구): 날짜를 나타내는 표현으로 문장 성분이라기보다 표제어처럼 쓰인 명사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 담양에 갔고</span><span class=\"en\"><b>We <span class=\"grammar-hl\">went to Damyang</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죽녹원을 방문했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">visited Jungnogwon</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 대나무 정원인</span><span class=\"en\"><b><span class=\"grammar-hl\">a famous bamboo garden</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫째로 그날의 장소와 활동을 말합니다. 음식 이야기에 바로 들어가기 전에 어디를 갔는지 먼저 제시해서, 이 식사가 여행 일정 속 한 장면임을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went to Damyang go + to + 장소 구조이다. go는 뒤에 목적지를 전치사구로 받는 이동 동사이다.</div><div class=\"lec-gr-item\">visited Jungnogwon visit은 타동사로 기본구조는 visit + 목적어이다. 여기서는 Jungnogwon이 목적어이다.</div><div class=\"lec-gr-item\">a famous bamboo garden (형용사구): famous가 bamboo garden을 수식한다. bamboo는 garden을 꾸미는 명사 수식어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">famous</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">bamboo</td><td class=\"m\">대나무</td></tr><tr><td class=\"w\">garden</td><td class=\"m\">정원, 공원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 걷는 것을 즐겼다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">enjoyed walking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원에서</span><span class=\"en\"><b>in the garden.</b></span></div></div><div class=\"lec-sent-ko\">우리는 정원에서 걷는 것을 즐겼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 장소 설명을 이어받아, 그곳에서 어떤 기분이었는지를 덧붙입니다. 단순 방문이 아니라 산책 자체를 즐겼다는 점에서 여행의 분위기가 좋았다는 것을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enjoyed walking 동사 + 동명사 구조: enjoy는 뒤에 동명사를 목적어로 취하는 동사이다. walking이 enjoy의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">walking in the garden (동명사): walking은 명사처럼 쓰여 enjoyed의 목적어가 되었다. in the garden은 walking의 장소를 나타내는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garden</td><td class=\"m\">정원, 공원</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다, 누리다</td></tr><tr><td class=\"w\">walk</td><td class=\"m\">걷다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주변을 둘러본 후에,</span><span class=\"en\"><b><span class=\"grammar-hl\">After we looked around</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 먹었다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">ate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 가지 지역 음식을</span><span class=\"en\"><b><span class=\"grammar-hl\">two local dishes</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대통밥과 떡갈비를</span><span class=\"en\"><b><span class=\"grammar-hl\">daetongbap and tteokgalbi</span>.</b></span></div></div><div class=\"lec-sent-ko\">주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 산책 경험 다음에 자연스럽게 음식 이야기로 넘어갑니다. 여행지에서 구경한 뒤 그 지역의 대표 음식을 먹는 전형적인 흐름을 보여 주며, 뒤의 두 음식 설명으로 이어지는 연결고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After we looked around (부사절): After + S + V 구조이다. 뒤의 ate와 시간 관계를 나타내는 종속절이다.</div><div class=\"lec-gr-item\">looked around (관용표현): look around는 &#39;둘러보다&#39;라는 뜻의 구동사이다. 동사와 부사가 결합한 표현이다.</div><div class=\"lec-gr-item\">ate two local dishes 동사 + 목적어 구조이다. ate는 타동사이고 two local dishes가 목적어이다.</div><div class=\"lec-gr-item\">daetongbap and tteokgalbi (동격): 앞의 two local dishes와 같은 대상을 구체적으로 나열한 동격 표현이다. 앞 명사의 내용을 덧붙여 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">local</td><td class=\"m\">지역의, 현지의</td></tr><tr><td class=\"w\">dish</td><td class=\"m\">요리, 음식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대통밥은</span><span class=\"en\"><b>Daetongbap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대나무 그릇에 담긴 밥이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">rice in a bamboo bowl</span>.</b></span></div></div><div class=\"lec-sent-ko\">대통밥은 대나무 그릇에 담긴 밥이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 음식이 무엇인지 간단히 설명합니다. 뒤 문장에서 맛과 향을 말하기 전에, 독자가 이 음식의 모습을 떠올릴 수 있도록 기본 정보를 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is rice in a bamboo bowl be동사 문장: is가 연결동사이고, rice in a bamboo bowl이 주격보어로 그의 정체를 설명한다.</div><div class=\"lec-gr-item\">in a bamboo bowl (전치사구): in + 명사구 구조로 rice가 들어 있는 그릇의 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bamboo</td><td class=\"m\">대나무</td></tr><tr><td class=\"w\">rice</td><td class=\"m\">쌀, 밥</td></tr><tr><td class=\"w\">bowl</td><td class=\"m\">그릇, 사발</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 매우 좋았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">loved</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 독특한 대나무 향이</span><span class=\"en\"><b><span class=\"grammar-hl\">its unique bamboo smell</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그것의 독특한 대나무 향이 매우 좋았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 대통밥 설명을 받아, 그 음식이 왜 인상적이었는지 개인적인 감상을 말합니다. 음식의 모양이나 재료보다도 향이 특별해서 좋았다는 뜻으로, 체험의 생생함을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">loved its unique bamboo smell 동사 + 목적어 구조이다. loved는 타동사이고 its unique bamboo smell이 목적어이다.</div><div class=\"lec-gr-item\">its unique bamboo smell (명사구): unique가 smell을 수식하고 bamboo가 smell을 추가로 한정한다. 전체가 loved의 목적어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bamboo</td><td class=\"m\">대나무</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일한</td></tr><tr><td class=\"w\">smell</td><td class=\"m\">냄새</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">떡갈비는</span><span class=\"en\"><b><span class=\"grammar-hl\">Tteokgalbi,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국의 소고기 요리인</span><span class=\"en\"><b><span class=\"grammar-hl\">a Korean beef dish,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부드럽고</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달콤했다</span><span class=\"en\"><b><span class=\"grammar-hl\">soft and sweet</span>.</b></span></div></div><div class=\"lec-sent-ko\">한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 음식의 특징을 설명하는 문장입니다. 앞의 대통밥이 향으로 인상적이었다면, 이 음식은 맛과 식감이 좋았다고 대비되며, 두 가지 음식을 각각 다르게 즐겼다는 점이 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Tteokgalbi, a Korean beef dish, (동격): a Korean beef dish가 Tteokgalbi를 다시 설명하는 동격 표현이다. 앞 명사의 정체를 구체화한다.</div><div class=\"lec-gr-item\">was soft and sweet be동사 문장: was가 연결동사이고 soft and sweet가 주격보어로 뒤의 주어 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dish</td><td class=\"m\">요리, 음식</td></tr><tr><td class=\"w\">soft</td><td class=\"m\">부드러운, 연한</td></tr><tr><td class=\"w\">sweet</td><td class=\"m\">달콤한, 맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 요리들은</span><span class=\"en\"><b>The dishes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 정말 잘 어울렸다</span><span class=\"en\"><b>really <span class=\"grammar-hl\">went well together</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 요리들은 함께 정말 잘 어울렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 두 음식을 함께 평가하며 글을 마무리합니다. 각각의 음식 설명을 종합해, 대통밥과 떡갈비를 같이 먹었을 때 조화가 좋았다는 결론을 내립니다. 앞의 개별 감상들이 이 한 문장으로 정리됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went well together (관용표현): go well together는 &#39;잘 어울리다&#39;라는 뜻의 관용적 표현이다. 동사 go와 부사 well, together가 함께 하나의 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dish</td><td class=\"m\">요리, 음식</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>윌리엄은 여름 방학에 가족과 함께 한국을 여행했다.</li><li>담양의 죽녹원을 구경한 뒤, 지역 음식인 대통밥과 떡갈비를 먹었다.</li><li>대통밥은 대나무 향이 특별했고, 떡갈비는 부드럽고 달콤했다.</li><li>두 음식은 함께 먹었을 때 조화가 좋았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">William visited a bamboo garden in Damyang and then ate daetongbap and tteokgalbi, which he found delicious together.</div>\n              <div class=\"lec-final-sum-ko\">윌리엄은 담양의 대나무 정원을 방문한 뒤 대통밥과 떡갈비를 먹었고, 두 음식이 잘 어울린다고 느꼈다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"},{"audio":"./1_audio/23.mp3","hl":"grammar"}],[{"audio":"./1_audio/24.mp3","hl":"main"},{"audio":"./1_audio/25.mp3","hl":"meaning"},{"audio":"./1_audio/26.mp3","hl":"grammar"}],[{"audio":"./1_audio/27.mp3","hl":"main"},{"audio":"./1_audio/28.mp3","hl":"meaning"},{"audio":"./1_audio/29.mp3","hl":"grammar"}],[{"audio":"./1_audio/30.mp3","hl":"main"},{"audio":"./1_audio/31.mp3","hl":"meaning"},{"audio":"./1_audio/32.mp3","hl":"grammar"}],[{"audio":"./1_audio/33.mp3","hl":"main"},{"audio":"./1_audio/34.mp3","hl":"meaning"},{"audio":"./1_audio/35.mp3","hl":"grammar"}],[{"audio":"./1_audio/36.mp3","hl":"main"},{"audio":"./1_audio/37.mp3","hl":"meaning"},{"audio":"./1_audio/38.mp3","hl":"grammar"}],[{"audio":"./1_audio/39.mp3","hl":"main"},{"audio":"./1_audio/40.mp3","hl":"meaning"},{"audio":"./1_audio/41.mp3","hl":"grammar"}],[{"audio":"./1_audio/42.mp3","hl"
