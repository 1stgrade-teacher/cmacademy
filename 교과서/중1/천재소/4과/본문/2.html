)이 이 음식을 먹기 시작함</li><li>쉽게 상하지 않아서 오래 보관할 수 있었음</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visited</td><td class=\"m\">방문했다, 다녀왔다</td></tr><tr><td class=\"w\">go up</td><td class=\"m\">올라가다, 올라가다, 상승하다</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr><tr><td class=\"w\">cable car</td><td class=\"m\">케이블카, 삭도</td></tr><tr><td class=\"w\">seeing</td><td class=\"m\">보면서, 바라보는 것, 목격하는 것</td></tr><tr><td class=\"w\">ocean</td><td class=\"m\">바다, 대양</td></tr><tr><td class=\"w\">fantastic</td><td class=\"m\">환상적인, 정말 멋진, 굉장한</td></tr><tr><td class=\"w\">local</td><td class=\"m\">지역의, 현지의</td></tr><tr><td class=\"w\">restaurant</td><td class=\"m\">식당, 레스토랑</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eat</td><td class=\"m\">먹다</td></tr><tr><td class=\"w\">type</td><td class=\"m\">종류, 유형</td></tr><tr><td class=\"w\">inside</td><td class=\"m\">prep.</td></tr><tr><td class=\"w\">rice</td><td class=\"m\">쌀, 밥</td></tr><tr><td class=\"w\">seaweed</td><td class=\"m\">해조류, 김</td></tr><tr><td class=\"w\">kimchi</td><td class=\"m\">김치</td></tr><tr><td class=\"w\">spicy</td><td class=\"m\">매운, 자극적인</td></tr><tr><td class=\"w\">squid</td><td class=\"m\">오징어</td></tr><tr><td class=\"w\">side</td><td class=\"m\">곁, 옆, 한쪽</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 통영을 방문했고</span><span class=\"en\"><b><span class=\"grammar-hl\">We visited Tongyeong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산에 올라갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">and went up the mountain</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케이블카를 타고</span><span class=\"en\"><b><span class=\"grammar-hl\">by cable car</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 첫 문장으로, 여행의 시작과 장소를 알려 줍니다. 통영에 가서 산에 올랐다는 사실을 통해 뒤에 나올 풍경 감상과 음식 경험의 배경을 깔아 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We visited Tongyeong and went up the mountain by cable car 일반동사 과거시제: visited, went는 과거형으로 과거의 두 동작을 and로 연결한 문장이다. went up은 관용표현으로, up이 함께 붙어 동작의 방향을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visited</td><td class=\"m\">방문했다, 다녀왔다</td></tr><tr><td class=\"w\">mountain</td><td class=\"m\">산</td></tr><tr><td class=\"w\">cable car</td><td class=\"m\">케이블카, 삭도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">파란 바다와 녹색의 섬들을 보는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Seeing the blue ocean and the green islands</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환상적이었다!</span><span class=\"en\"><b>was fantastic!</b></span></div></div><div class=\"lec-sent-ko\">파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 올라간 산에서 본 장면을 이어받아, 여행에서 가장 인상 깊었던 풍경을 강조합니다. 자연 경관이 매우 아름다워서 글쓴이가 강한 감동을 느꼈다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Seeing the blue ocean and the green islands (현재분사): Seeing이 문장 앞에서 부사적 의미로 쓰인 분사구문이다. 원래는 When we saw the blue ocean and the green islands처럼 접속사와 주어 동사가 있는 절로 바꿀 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seeing</td><td class=\"m\">보면서, 바라보는 것, 목격하는 것</td></tr><tr><td class=\"w\">ocean 들여 먹는 음식이었다.</li><li>이 음식은 상하기 어려워서 옛날 어부들이 먹기 시작한, 통영의 역사와 연결된 음식이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The writer visited Tongyeong, ate spicy chungmugimbap, and learned that it was originally eaten by fishermen because it did not spoil quickly.</div>\n              <div class=\"lec-final-sum-ko\">글쓴이는 통영을 방문해 매운 충무김밥을 먹고, 그것이 쉽게 상하지 않아 어부들이 먹기 시작했다는 사실을 알게 되었다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"},{"audio":"./2_audio/7.mp3","hl":"stage-3"}],[{"audio":"./2_audio/8.mp3","hl":null}],[{"audio":"./2_audio/9.mp3","hl":"main"},{"audio":"./2_audio/10.mp3","hl":"meaning"},{"audio":"./2_audio/11.mp3","hl":"grammar"}],[{"audio":"./2_audio/12.mp3","hl":"main"},{"audio":"./2_audio/13.mp3","hl":"meaning"},{"audio":"./2_audio/14.mp3","hl":"grammar"}],[{"audio":"./2_audio/15.mp3","hl":"main"},{"audio":"./2_audio/16.mp3","hl":"meaning"},{"audio":"./2_audio/17.mp3","hl":"grammar"}],[{"audio":"./2_audio/18.mp3","hl":"main"},{"audio":"./2_audio/19.mp3","hl":"meaning"},{"audio":"./2_audio/20.mp3","hl":"grammar"}],[{"audio":"./2_audio/21.mp3","hl":"main"},{"audio":"./2_audio/22.mp3","hl":"meaning"},{"audio":"./2_audio/23.mp3","hl":"grammar"}],[{"audio":"./2_audio/24.mp3","hl":"main"},{"audio":"./2_audio/25.mp3","hl":"meaning"},{"audio":"./2_audio/26.mp3","hl":"grammar"}],[{"audio":"./2_audio/27.mp3","hl":"main"},{"audio":"./2_audio/28.mp3","hl":"meaning"},{"audio":"./2_audio/29.mp3","hl":"grammar"}],[{"audio":"./2_audio/30.mp3","hl":"main"},{"audio":"./2_audio/31.mp3","hl":"meaning"},{"audio":"./2_audio/32.mp3","hl":"grammar"}],[{"audio":"./2_audio/33.mp3","hl":"main"},{"audio":"./2_audio/34.mp3","hl":"meaning"},{"audio":"./2_audio/35.mp3","hl":"grammar"}],[{"audio":
