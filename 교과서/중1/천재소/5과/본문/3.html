“달라졌다(DIFFERENT)”는 표현은 꽃이 피었거나 식물이 더 자란 것처럼 눈에 보이는 변화를 뜻해요. 마치 우리가 여름 내내 정성껏 돌본 화분이 어느 날 갑자기 꽃을 피우고, 아이도 방학 사이에 훌쩍 커 있는 걸 발견하는 것처럼, 이 글은 시간의 흐름에 따른 변화를 보여주는 짧은 이야기라고 이해하시면 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여름의 돌봄</div><ul><li>엘은 정원에 꽃을 심고 여름 내내 정성껏 가꾼다.</li><li>꽃을 심음: planted the flowers</li><li>계절 배경: growing season</li><li>여름 동안 지속적으로 돌봄: cared for them</li><li>핵심 키워드: 돌봄(cared)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02방문과 발견</div><ul><li>여름의 마지막 날, 조가 엘의 집에 오고 둘은 정원으로 달려간다.</li><li>방문 인물: 조(Jo)</li><li>장소: 엘의 집(El’s house)</li><li>행동: 정원으로 달려감 (ran to the garden)</li><li>핵심 키워드: 방문(visited)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03예상 밖의 변화</div><ul><li>정원에서 두 사람은 갑자기 멈추고, 무언가 달라졌음을 알아차린다.</li><li>갑작스러운 정지: suddenly stopped</li><li>변화의 표시: Something was DIFFERENT</li><li>긴장과 놀라움이 생김</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04꽃과 엘의 성장</div><ul><li>꽃이 아스터(aster)에 피어 있고, 엘도 함께 더 커져 있다.</li><li>꽃의 변화: flowers on the aster</li><li>엘의 변화: El grew TALLER, TOO</li><li>자연의 성장과 인물의 성장이 함께 제시됨</li><li>핵심 키워드: 성장(grew taller)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plant</td><td class=\"m\">심다, 식재하다</td></tr><tr><td class=\"w\">flower</td><td class=\"m\">꽃</td></tr><tr><td class=\"w\">garden</td><td class=\"m\">정원, 뜰</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다, 되다</td></tr><tr><td class=\"w\">season</td><td class=\"m\">계절, 시기</td></tr><tr><td class=\"w\">all summer long</td><td class=\"m\">여름 내내, 여름 동안 계속</td></tr><tr><td class=\"w\">care for</td><td class=\"m\">~을 돌보다, ~을 보살피다, ~을 좋아하다</td></tr><tr><td class=\"w\">last</td><td class=\"m\">마지막의, 최후의</td></tr><tr><td class=\"w\">day</td><td class=\"m\">날, 하루</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come to</td><td class=\"m\">~에 오다, ~에 이르다</td></tr><tr><td class=\"w\">house</td><td class=\"m\">집, 가옥</td></tr><tr><td class=\"w\">run to</td><td class=\"m\">~으로 달려가다</td></tr><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기</td></tr><tr><td class=\"w\">stop</td><td class=\"m\">멈추다, 서다</td></tr><tr><td class=\"w\">different</td><td class=\"m\">다른, 달라진, 특별한</td></tr><tr><td class=\"w\">there be</td><td class=\"m\">~이 있다, 존재하다</td></tr><tr><td class=\"w\">aster</td><td class=\"m\">과꽃, 애스터</td></tr><tr><td class=\"w\">tall</td><td class=\"m\">키가 큰, 높은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El은 꽃들을 심었다</span><span class=\"en\"><b>El <span class=\"grammar-hl\">planted the flowers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 정원에</span><span class=\"en\"><b><span class=\"grammar-hl\">in her garden</span>.</b></span></div></div><div class=\"lec-sent-ko\">El은 그녀의 정원에 꽃들을 심었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 시작으로, 엘이 정원에서 꽃을 직접 가꾸는 상황을 먼저 보여 줍니다. 뒤에 이어질 계절 변화와 꽃의 성장 이야기를 자연스럽게 열어 주는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">planted the flowers (과거동사): 주어 El이 동작을 직접 한 일반동사 과거형입니다. 문장 기본 구조는 S + V + O입니다.</div><div class=\"lec-gr-item\">the flowers (명사구): planted의 목적어입니다. 동작의 대상이 되는 명사구입니다.</div><div class=\"lec-gr-item\">in her garden (전치사구): 장소를 나타내는 부가 정보입니다. 동작이 일어난 위치를 덧붙입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plant</td><td class=\"m\">심다, 식재하다</td></tr><tr><td class=\"w\">flower</td><td class=\"m\">꽃</td></tr><tr><td class=\"w\">garden</td><td class=\"m\">정원, 뜰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span> <span class=\"grammar-hl\">was growing season</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">성장하는 시기</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">성장하는 시기였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 꽃이 심어진 뒤에 왜 잘 자랄 수 있는지 배경을 설명합니다. 앞 문장의 행동이 그냥 나온 것이 아니라, 식물이 성장하기에 알맞은 때였음을 알려 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It (가주어): 뒤에 오는 보어 내용을 받기 위해 형식상 앞에 놓인 주어입니다.</div><div class=\"lec-gr-item\">was growing season be동사 + 명사구 구조입니다. 보어 growing season이 주어 It의 상태나 내용을 설명합니다.</div><div class=\"lec-gr-item\">growing (현재분사): season을 수식하는 형용사적 분사입니다. &#39;자라고 있는/성장 중인&#39;의 의미로 season의 상태를 꾸밉니다.</div><div class=\"lec-gr-item\">growing season 현재분사 + 명사 구조입니다. growing이 season을 꾸며서 하나의 명사구를 이룹니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다, 되다</td></tr><tr><td class=\"w\">season</td><td class=\"m\">계절, 시기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여름 내내</span><span class=\"en\"><b><span class=\"grammar-hl\">All summer long</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 그것들을 돌보았다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">cared for them</span>.</b></span></div></div><div class=\"lec-sent-ko\">여름 내내 그녀는 그것들을 돌보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엘이 꽃을 심기만 한 것이 아니라 계속 신경 쓰고 관리했다는 뜻입니다. 앞의 “심었다”와 이어져서, 뒤에 꽃이 달라지는 결과가 우연이 아니라 정성의 결과임을 준비합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">All summer long (부사구): 시간을 나타내며 문장 전체를 수식합니다.</div><div class=\"lec-gr-item\">cared for them 일반동사 과거형 구조입니다. care for는 함께 쓰이는 관용적 동사구로 &#39;돌보다&#39;의 의미를 냅니다.</div><div class=\"lec-gr-item\">cared for (관용표현): care for는 &#39;돌보다, 보살피다&#39;라는 뜻의 고정된 동사구입니다.</div><div class=\"lec-gr-item\">them 대명사 목적어: cared for의 대상입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all summer long</td><td class=\"m\">여름 내내, 여름 동안 계속</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막 날에</span><span class=\"en\"><b><span class=\"grammar-hl\">On the last day</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여름의</span><span class=\"en\"><b><span class=\"grammar-hl\">of summer</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jo가 왔다</span><span class=\"en\"><b>Jo <span class=\"grammar-hl\">came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">El의 집에</span><span class=\"en\"><b><span class=\"grammar-hl\">to El’s house</span>.</b></span></div></div><div class=\"lec-sent-ko\">여름의 마지막 날, Jo가 El의 집에 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간의 흐름이 여름의 끝에 이르렀음을 보여 주고, 새 인물 조가 등장합니다. 다음에 둘이 함께 정원을 보게 될 상황을 만드는 연결 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the last day of summer (부사구): 시간을 나타내는 전치사구입니다.</div><div class=\"lec-gr-item\">came to El’s house 일반동사 과거형 구조입니다. came 뒤에 목적지 전치사구 to El’s house가 이어집니다.</div><div class=\"lec-gr-item\">to El’s house (전치사구): came의 이동 방향이나 목적지를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">last</td><td class=\"m\">마지막의, 최후의</td></tr><tr><td class=\"w\">day</td><td class=\"m\">날, 하루</td></tr><tr><td class=\"w\">house</td><td class=\"m\">집, 가옥</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El과 Jo는</span><span class=\"en\"><b><span class=\"grammar-hl\">El and Jo</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원으로 달려갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">ran to the garden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 갑자기 멈췄다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">suddenly stopped</span>.</b></span></div></div><div class=\"lec-sent-ko\">El과 Jo는 정원으로 달려가다가 갑자기 멈췄다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 둘이 기대를 가지고 정원으로 갔다가 예상 못 한 장면을 보고 놀랐다는 뜻입니다. 뒤의 “Something was DIFFERENT!”를 자연스럽게 받아 주는, 놀람 직전의 행동 묘사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">El and Jo (등위주어): and로 연결된 복수 주어입니다.</div><div class=\"lec-gr-item\">ran to the garden 일반동사 과거형 구조입니다. ran 뒤에 방향을 나타내는 전치사구 to the garden이 옵니다.</div><div class=\"lec-gr-item\">suddenly stopped 일반동사 과거형 구조입니다. suddenly는 동사를 수식하는 부사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">garden</td><td class=\"m\">정원, 뜰</td></tr><tr><td class=\"w\">suddenly</td><td class=\"m\">갑자기</td></tr><tr><td class=\"w\">stop</td><td class=\"m\">멈추다, 서다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무엇인가가</span><span class=\"en\"><b><span class=\"grammar-hl\">Something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달랐다!</span><span class=\"en\"><b><span class=\"grammar-hl\">was DIFFERENT</span>!</b></span></div></div><div class=\"lec-sent-ko\">무엇인가가 달라졌다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정원에서 눈에 띄는 변화가 생겼다는 사실을 강조합니다. 앞 문장의 “갑자기 멈췄다”는 반응의 이유를 직접 설명하며, 다음 문장의 구체적인 변화로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Something 대명사 주어: 문장의 주어입니다.</div><div class=\"lec-gr-item\">was DIFFERENT be동사 + 형용사 구조입니다. was가 주어 Something과 보어 DIFFERENT를 연결합니다.</div><div class=\"lec-gr-item\">DIFFERENT (보어): 주어의 상태를 설명하는 형용사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">different</td><td class=\"m\">다른, 달라진, 특별한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">꽃들이 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">There were flowers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과꽃에</span><span class=\"en\"><b><span class=\"grammar-hl\">on the aster</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">... 그리고 El도</span><span class=\"en\"><b>... <span class=\"grammar-hl\">and El</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 커졌다!</span><span class=\"en\"><b><span class=\"grammar-hl\">grew TALLER, TOO</span>!</b></span></div></div><div class=\"lec-sent-ko\">과꽃에 꽃들이 있었다 ... 그리고 El도 키가 더 커졌다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기다리던 변화가 실제로 일어났음을 보여 줍니다. 식물의 성장과 엘의 성장이 함께 제시되어, 이 이야기에서 둘이 서로 연결된 특별한 변화라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There were flowers There 구문: 존재를 나타내는 구조입니다. were가 주어 flowers의 존재를 표시합니다.</div><div class=\"lec-gr-item\">flowers (주어): 존재하는 대상을 나타내는 명사입니다.</div><div class=\"lec-gr-item\">on the aster (전치사구): flowers의 위치를 설명합니다.</div><div class=\"lec-gr-item\">and El grew TALLER, TOO 등위접속사 and로 앞 문장과 연결된 병렬 구조입니다.</div><div class=\"lec-gr-item\">grew TALLER 5형식(SVOC) 구조: grow + C 형태로 보어 taller가 주어 El의 변화된 상태를 설명합니다. 여기서 grow는 &#39;점점 ~해지다&#39;처럼 상태 변화를 나타내는 연결 동사처럼 쓰였습니다.</div><div class=\"lec-gr-item\">TALLER (보어): El의 변화된 상태를 나타내는 형용사입니다.</div><div class=\"lec-gr-item\">TOO 부사: 앞 내용과의 추가 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flower</td><td class=\"m\">꽃</td></tr><tr><td class=\"w\">aster</td><td class=\"m\">과꽃, 애스터</td></tr><tr><td class=\"w\">tall</td><td class=\"m\">키가 큰, 높은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>엘은 정원에 꽃을 심고 여름 내내 정성껏 돌보았다.</li><li>여름이 끝날 무렵, 조가 찾아와 함께 정원을 보러 갔다.</li><li>그런데 정원에서는 예상 못 한 변화가 일어났다.</li><li>꽃이 피었고, 엘도 함께 더 자라 있었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">El cared for her garden all summer, and by the end of the season the flowers had grown and El had grown taller too.</div>\n              <div class=\"lec-final-sum-ko\">엘은 여름 내내 정원을 돌보았고, 계절이 끝날 무렵 꽃들이 자랐으며 엘도 더 커졌다.</div></div></div>"],"segs":[[{"audio":"./3_audio/1.mp3","hl":null}],[{"audio":"./3_audio/2.mp3","hl":null}],[{"audio":"./3_audio/3.mp3","hl":null},{"audio":"./3_audio/4.mp3","hl":"stage-0"},{"audio":"./3_audio/5.mp3","hl":"stage-1"},{"audio":"./3_audio/6.mp3","hl":"stage-2"},{"audio":"./3_audio/7.mp3","hl":"stage-3"}]
