lass=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01친구들의 평소 모습</div><ul><li>엘(El)과 조(Jo)는 반에서 가장 작은 학생들이었고 늘 함께 다녔다.</li><li>둘은 항상 함께 있었음</li><li>화분(pots)에 혼자 닿지 못해 같이 물을 줌</li><li>핵심 키워드: 가장 작은 학생들(smallest students)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02함께하던 활동</div><ul><li>키가 작아 식물에 물 주는 일도 둘이 힘을 합쳐야 했다.</li><li>식물에 물 주기(watering the plants)를 함께 함</li><li>혼자서는 화분에 손이 닿지 않음</li><li>협력하며 생활하는 모습</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03봄의 변화</div><ul><li>봄(spring)이 되자 조(Jo)에게 눈에 띄는 변화가 일어났다.</li><li>조가 더 커짐(grew taller)</li><li>이전과 다른 변화(different)가 나타남</li><li>핵심 키워드: 성장(grow, taller)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04달라진 관계</div><ul><li>조가 엘보다 더 커지면서 이제 조는 혼자서도 물을 줄 수 있게 되었다.</li><li>조가 엘보다 키가 더 큼(taller than El)</li><li>혼자 식물에 물을 줄 수 있게 됨</li><li>엘은 상대적으로 더 작게 느껴짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05엘의 심리</div><ul><li>엘은 날마다 자신이 더 작아지는 것처럼 느꼈다.</li><li>엘이 smaller every day라고 느낌</li><li>비교를 통해 자신의 변화를 체감함</li><li>몸의 변화가 마음에도 영향을 줌</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smallest</td><td class=\"m\">가장 작은, 최하급의</td></tr><tr><td class=\"w\">together</td><td class=\"m\">함께, 같이</td></tr><tr><td class=\"w\">water</td><td class=\"m\">물을 주다, 관개하다</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">닿다, 도달하다, 손이 닿다</td></tr><tr><td class=\"w\">alone</td><td class=\"m\">혼자서, 홀로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">different</td><td class=\"m\">다른, 색다른, 달라진</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다, 커지다</td></tr><tr><td class=\"w\">taller</td><td class=\"m\">더 큰, 더 키가 큰</td></tr><tr><td class=\"w\">feel</td><td class=\"m\">느끼다, ~한 기분이 들다</td></tr><tr><td class=\"w\">smaller</td><td class=\"m\">더 작은, 더 보잘것없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">성장하는 시기</span><span class=\"en\"><b><span class=\"grammar-hl\">Growing Season</span></b></span></div></div><div class=\"lec-sent-ko\">성장하는 시기</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 두 아이의 기본적인 상태를 알려 줍니다. 뒤에서 나올 변화의 출발점이 됩니다. 즉, 처음에는 둘 다 반에서 가장 작아서 서로 비슷한 처지였다는 배경을 깔아 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Growing Season (현재분사): Growing이 뒤의 Season을 수식하는 형용사 역할을 한다. 전체로는 &#39;자라는 계절&#39;처럼 해석되는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다, 커지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El과 Jo는</span><span class=\"en\"><b>El and Jo <span class=\"grammar-hl\">were the smallest students</span> in the class.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 작은 학생들이었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">반에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">El과 Jo는 반에서 가장 작은 학생들이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 두 아이의 기본적인 상태를 알려 줍니다. 뒤에서 나올 변화의 출발점이 됩니다. 즉, 처음에는 둘 다 반에서 가장 작아서 서로 비슷한 처지였다는 배경을 깔아 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were the smallest students (수동태): be동사(were)+p.p. 형태가 아니라, 여기서는 연결동사 be + 보어 구조이다. smallest는 최상급 형용사이고 students를 보충 설명한다.</div><div class=\"lec-gr-item\">the smallest students in the class (형용사구): smallest가 students를 수식하고, in the class가 뒤에서 students의 범위를 한정한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smallest</td><td class=\"m\">가장 작은, 최하급의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They <span class=\"grammar-hl\">were always together</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 함께였다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그들은 항상 함께였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 두 아이가 아주 가까운 사이였음을 보여 줍니다. 앞문장의 “둘 다 작다”는 공통점에 이어, 생활 방식도 비슷하고 늘 붙어 다니는 관계라는 점을 더해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were always together be동사(were) + 보어(together) 구조이다. together는 함께라는 뜻의 부사로, 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">together</td><td class=\"m\">함께, 같이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They even <span class=\"grammar-hl\">watered the plants together</span> in the class <span class=\"grammar-hl\">because they could not reach the pots alone</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어는 함께 식물에 물을 주기도 했다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">교실에서</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 혼자서는 화분에 닿을 수 없었기 때문에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그들은 혼자서는 화분에 닿을 수 없었기 때문에 심지어는 교실에서 함께 식물에 물을 주기도 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 왜 늘 함께였는지를 구체적으로 설명합니다. 키가 작아서 혼자서는 화분을 관리할 수 없으니 서로 도와야 했다는 뜻입니다. 앞의 두 문장을 이어 받아, 두 아이의 관계가 단순히 친해서가 아니라 ‘같은 한계’를 공유하기 때문에 더 끈끈했다는 점을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">watered the plants together 일반동사 watered + 목적어 the plants의 기본 3형식 구조이다. together는 동작이 함께 이루어졌음을 나타내는 부사이다.</div><div class=\"lec-gr-item\">could not reach the pots alone 5형식(SVOC) 구조: reach는 타동사이고 the pots가 목적어이다. alone은 &#39;혼자서&#39;라는 부사이고, could not는 조동사로 동사의 가능 여부를 나타낸다.</div><div class=\"lec-gr-item\">because they could not reach the pots alone 접속사 because가 이유절을 이끈다. 앞 절의 내용을 설명하는 부사절 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">together</td><td class=\"m\">함께, 같이</td></tr><tr><td class=\"w\">water</td><td class=\"m\">물을 주다, 관개하다</td></tr><tr><td class=\"w\">reach</td><td class=\"m\">닿다, 도달하다, 손이 닿다</td></tr><tr><td class=\"w\">alone</td><td class=\"m\">혼자서, 홀로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However, <span class=\"grammar-hl\">in the spring</span>, <span class=\"grammar-hl\">something was DIFFERENT</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">봄에는</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가가 달라졌다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">하지만 봄에는 무언가가 달라졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞부분의 안정된 상황에서 갑자기 변화를 예고하는 전환점입니다. “However”가 앞의 내용과 반대되는 새 국면을 열어 주며, 이제부터는 둘의 관계나 상황에 변화가 생긴다는 신호입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the spring 전치사구로 시간을 나타내는 부사어이다. 문장 전체의 배경 상황을 제시한다.</div><div class=\"lec-gr-item\">something was DIFFERENT be동사(was) + 보어(different) 구조이다. different는 형용사로 주어 something의 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">different</td><td class=\"m\">다른, 색다른, 달라진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jo의</span><span class=\"en\"><b>Jo <span class=\"grammar-hl\">grew TALLER</span>!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">키가 더 커졌다!</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Jo의 키가 더 커졌다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 변화의 핵심을 직접 말합니다. 둘이 비슷한 처지였는데 조에게 성장 변화가 생겨서 상황이 달라졌다는 뜻입니다. 앞문장의 “something was different”가 구체적으로 무엇인지 밝혀 주는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">grew TALLER 5형식(SVOC) 구조가 아니라 연결동사 grow + 보어(taller) 구조이다. taller는 비교급 형용사로 상태 변화와 정도의 증가를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">taller</td><td class=\"m\">더 큰, 더 키가 큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jo는</span><span class=\"en\"><b>Jo <span class=\"grammar-hl\">was taller than El</span>, <span class=\"grammar-hl\">so Jo could water the plants alone</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">El보다 키가 더 컸고,</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 Jo는 혼자 식물에 물을 줄 수 있었다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">Jo는 El보다 키가 더 컸고, 그래서 Jo는 혼자 식물에 물을 줄 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 키가 커진 결과가 무엇인지 보여 줍니다. 예전에는 둘이 함께해야 했던 일을 이제 조는 혼자 할 수 있게 됩니다. 앞문장의 변화가 단순한 신체 변화로 끝나지 않고, 실제 행동의 차이로 이어졌다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was taller than El 비교구문이다. be동사(was) + 형용사 비교급(taller) + than + 비교 대상(El) 구조로 두 대상의 정도를 비교한다.</div><div class=\"lec-gr-item\">could water the plants alone 조동사 could + 일반동사 water + 목적어 the plants의 기본 구조이다. alone은 부사로 &#39;혼자서&#39;의 뜻을 더한다.</div><div class=\"lec-gr-item\">so Jo could water the plants alone 접속사 so가 결과를 나타내며, 앞 문장과 뒤 문장의 인과 관계를 연결한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">water</td><td class=\"m\">물을 주다, 관개하다</td></tr><tr><td class=\"w\">alone</td><td class=\"m\">혼자서, 홀로</td></tr><tr><td class=\"w\">taller</td><td class=\"m\">더 큰, 더 키가 큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El은</span><span class=\"en\"><b>El <span class=\"grammar-hl\">felt smaller every day</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 작아지는 기분이었다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">El은 매일 더 작아지는 기분이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 조의 변화가 엘에게 어떤 감정적 영향을 주는지 보여 줍니다. 실제로 엘이 줄어든 것은 아니지만, 상대적으로 더 작고 뒤처진 느낌을 받는다는 뜻입니다. 앞문장의 “조는 혼자 할 수 있다”는 변화와 이어지면서, 둘의 관계가 같은 출발점에서 점점 달라지고 있음을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt smaller every day 5형식(SVOC) 구조: felt는 연결동사처럼 쓰이고, smaller가 보어이다. every day는 빈도를 나타내는 부사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smaller</td><td class=\"m\">더 작은, 더 보잘것없는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>엘과 조는 둘 다 반에서 가장 작았고 늘 함께 지내며 서로 도와야 했다.</li><li>봄이 오자 조가 먼저 커서 혼자 할 수 있는 일이 생겼다.</li><li>그 변화 때문에 두 아이의 균형이 달라졌고, 엘은 상대적으로 더 작게 느껴졌다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">El and Jo were always together, but when Jo grew taller in spring, Jo could water the plants alone and El felt smaller.</div>\n              <div class=\"lec-final-sum-ko\">El과 Jo는 늘 함께했지만 봄에 Jo가 더 크게 자라자 Jo는 혼자 식물에 물을 줄 수 있게 되었고 El은 더 작게 느꼈다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"},{"audio":"./1_audio/8.mp3","hl":"stage-4"}],[{"audio":"./1_audio/9.mp3","hl":null}],[{"audio":"./1_audio/10.mp3","hl":"main"},{"audio":"./1_audio/11.mp3","hl":"meaning"},{"audio":"./1_audio/12.mp3","hl":"grammar"}],[{"audio":"./1_audio/13.mp3","hl":"main"},{"audio":"./1_audio/14.mp3","hl":"meaning"},{"audio":"./1_audio/15.mp3","hl":"grammar"}],[{"audio":"./1_audio/16.mp3","hl":"main"},{"audio":"./1_audio/17.mp3","hl":"meaning"},{"audio":"./1_audio/18.mp3","hl":"grammar"}],[{"audio":"./1_audio/19.mp3","hl":"main"},{"audio":"./1_audio/20.mp3","hl":"meaning"},{"audio":"./1_audio/21.mp3","hl":"grammar"}],[{"audio":"./1_audio/22.mp3","hl":"main"},{"audio":"./1_audio/23.mp3","hl":"meaning"}
