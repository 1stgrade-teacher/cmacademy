/L/APXRst7f1fr5fcHp0/4Gn3dvzAHAA7DpRtGN3qcH/wAePr7n8/YUoZSWG4Z5zyDgDqD6EHHbOcYApCR6j0688fX8u3ToKFr5uyVuutt10fkt/PSzFHPJHYA8HoM+gx35PYAEe64PT0xyORzk54GcY78/qMNEijI3Lg8Hkfr1x6fj64pxdQOGGT1OenPHBz+Y78knOSfrv+C/L+u4Hzc89eCB7cY6Y74/l1GW08shGSRk9Rkdu3PQjjOBn8MmmZHOGGP94D8/cf8A1+lC2S7L/JCX/D/cvv8AUUjOT09Pp04z1x24/Xgo7bVYjGQoOcnHy9TjPXnr+PTovyjBOCMf3gDkgH/IHpk+8TqG3Bed4wucHJ6EYx2685zgYBBOai05R2d3vpbeN16arpb7rFqXRtNct73VtLXWjVnr1++1z//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Small Plant’s Hidden Potential<small>작은 식물에 숨겨진 가능성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 지문을 이해하려면 먼저 식물의 성장(Growth)과 개화(Flowering)에 대한 기본 개념을 알아두시면 좋아요. 꽃이 바로 피지 않는 어린 식물도 충분한 햇빛, 물, 흙의 영양분이 있으면 시간이 지나며 자라서 꽃을 피우는데, 이런 식물의 변화를 생장 과정이라고 합니다. 또 여기서 나오는 아스터(Aster)와 지니아(Zinnia)는 모두 여름철에 잘 자라는 꽃 식물로, 품종에 따라 크기나 꽃이 피는 시기가 다를 수 있어요. 이 이야기는 식물이 사람처럼 겉모습만 보고 판단하면 안 된다는 점을 보여주는데, 작은 씨앗이 나중에 큰 나무가 되듯이 지금은 작고 초라해 보여도 앞으로 달라질 가능성이 있다는 비유로 이해하시면 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여름 화분 나누기</div><ul><li>학기 마지막 날, 학생들은 여름 동안 돌볼 꽃 화분을 집으로 가져가게 된다.</li><li>미스터 디아즈(Mr. Diaz)가 각자 꽃을 가져가라고 말함</li><li>학생들이 창가로 달려가 화분을 먼저 고름</li><li>화려한 꽃이 달린 화분이 먼저 선택됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02엘의 선택과 마음</div><ul><li>엘(El)은 가장 작은 식물이 든 마지막 화분을 고르고, 자신과 닮았다고 느낀다.</li><li>엘은 꽃이 없는 작은 식물을 받음</li><li>식물의 모습에 자신의 처지를 겹쳐 봄</li><li>핵심 키워드: 작은 식물(small plant)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03미스터 디아스의 격려</div><ul><li>미스터 디아스는 그 식물이 시간이 지나면 아름다운 꽃을 피우는 아스터(aster)라고 알려 준다.</li><li>아직은 작고 초록색이지만 성장 가능성이 있음</li><li>아스터(aster)는 시간이 지나면 꽃이 핌</li><li>현재 모습만으로 판단할 수 없음을 암시</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04조의 선물</div><ul><li>조(Jo)는 여름 동안 할머니 집에 가게 된다며 자신의 자니아(zinnia) 화분을 엘에게 양보한다.</li><li>조는 자신의 화분을 엘에게 줌</li><li>할머니 집에 있어서 돌볼 수 없다고 설명함</li><li>핵심 키워드: 양보하다(give)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05함께 심는 우정</div><ul><li>엘은 아스터와 자니아를 나란히 심겠다고 말하며, 둘의 우정을 식물 친구 관계에 비유한다.</li><li>두 식물을 side by side로 심겠다고 함</li><li>식물들이 좋은 친구가 될 것이라고 말함</li><li>엘이 미소 지으며 마음이 밝아짐</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a flower home</td><td class=\"m\">꽃을 집으로 가져가다, 꽃을 집에 데려가다</td></tr><tr><td class=\"w\">care for</td><td class=\"m\">~을 돌보다, ~을 보살피다</td></tr><tr><td class=\"w\">reach for</td><td class=\"m\">~을 향해 손을 뻗다, ~을 잡으려고 손을 뻗다</td></tr><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 매우 작은</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">화분, 냄비</td></tr><tr><td class=\"w\">colorful</td><td class=\"m\">색깔이 화려한, 다채로운</td></tr><tr><td class=\"w\">take</td><td class=\"m\">가져가다, 집어 들다, 데려가다</td></tr><tr><td class=\"w\">last</td><td class=\"m\">마지막의, 맨 끝의</td></tr><tr><td class=\"w\">smallest</td><td class=\"m\">가장 작은</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plant</td><td class=\"m\">식물, 화초</td></tr><tr><td class=\"w\">feel like</td><td class=\"m\">~처럼 느껴지다, ~과 비슷한 기분이 들다</td></tr><tr><td class=\"w\">just like</td><td class=\"m\">꼭 ~처럼, 바로 ~와 같은</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 바라보다</td></tr><tr><td class=\"w\">in time</td><td class=\"m\">시간이 지나면, 결국</td></tr><tr><td class=\"w\">grow</td><td class=\"m\">자라다, 성장하다</td></tr><tr><td class=\"w\">sure</td><td class=\"m\">확신하는, 확실한</td></tr><tr><td class=\"w\">have</td><td class=\"m\">가지다, 소유하다</td></tr><tr><td class=\"w\">side by side</td><td class=\"m\">나란히, 옆에 붙어서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학교의 마지막 날에</span><span class=\"en\"><b>On the last day of school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Diaz 선생님이 말씀하셨다</span><span class=\"en\"><b>Mr. Diaz said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“여러분,</span><span class=\"en\"><b>“Class,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꽃 하나를 집에 가져가서</span><span class=\"en\"><b>you <span class=\"grammar-hl\">can take a flower home</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 돌보세요</span><span class=\"en\"><b><span class=\"grammar-hl\">and care for it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여름 동안”</span><span class=\"en\"><b><span class=\"grammar-hl\">over the summer</span>.”</b></span></div></div><div class=\"lec-sent-ko\">학교 마지막 날에 Diaz 선생님이 말씀하셨다. “여러분, 꽃을 하나 집에 가져가서 여름 동안 돌보세요.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 시작입니다. 선생님이 학생들에게 여름 동안 돌볼 꽃을 하나씩 가져가라고 하며 과제를 내줍니다. 앞으로 벌어질 ‘꽃 고르기’ 장면의 배경을 마련하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can take a flower home and care for it over the summer 조동사 can 뒤에 동사원형 take, care for가 병렬로 연결된 구조다. take A home은 관용적으로 ‘A를 집에 가져가다’의 뜻으로 쓰이고, care for it은 care for + 목적어 구조이다.</div><div class=\"lec-gr-item\">over the summer (관용표현): over + 기간은 ‘그 기간 동안’의 의미로 쓰이는 시간 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take a flower home</td><td class=\"m\">꽃을 집으로 가져가다, 꽃을 집에 데려가다</td></tr><tr><td class=\"w\">care for</td><td class=\"m\">~을 돌보다, ~을 보살피다</td></tr><tr><td class=\"w\">take</td><td class=\"m\">가져가다, 집어 들다, 데려가다</td></tr><tr><td class=\"w\">last</td><td class=\"m\">마지막의, 맨 끝의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 학생이</span><span class=\"en\"><b>All the students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달려갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">ran</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창문으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to the window</span>.</b></span></div></div><div class=\"lec-sent-ko\">모든 학생이 창문으로 달려갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 선생님의 말을 듣자마자 학생들이 꽃을 고르기 위해 몰려갑니다. 앞 문장의 지시가 바로 행동으로 이어진 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ran to the window run to + 장소 구조로, to는 방향을 나타내는 전치사이고 run이 뒤의 목적지(window)를 향해 이동하는 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El의 학급 친구들은</span><span class=\"en\"><b>El’s classmates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화분에 손을 뻗었다</span><span class=\"en\"><b><span class=\"grammar-hl\">reached for the pots</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 El 너머</span><span class=\"en\"><b><span class=\"grammar-hl\">over tiny El</span>.</b></span></div></div><div class=\"lec-sent-ko\">El의 학급 친구들은 작은 El 너머 화분에 손을 뻗었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 키가 작은 엘은 경쟁에서 밀리는 상황이 드러납니다. 친구들이 먼저 좋은 화분을 차지하려는 모습이라, 엘이 불리한 위치에 있음을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reached for the pots (관용표현): reach for + 목적어는 ‘손을 뻗다’의 뜻으로 쓰이는 숙어이다. reach는 여기서 전치사 for와 함께 고정적으로 쓰인다.</div><div class=\"lec-gr-item\">over tiny El 전치사 over가 위치 관계를 나타내며, tiny El 위쪽에 있는 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tiny</td><td class=\"m\">아주 작은, 매우 작은</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">화분, 냄비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가져갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 화분을</span><span class=\"en\"><b><span class=\"grammar-hl\">all the pots</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형형색색의 꽃과 함께 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">with colorful flowers</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 형형색색의 꽃이 있는 화분을 모두 가져갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인기 있는 화분은 다른 아이들이 먼저 가져갔다는 뜻입니다. 그래서 엘에게 남는 선택지는 점점 줄어들고, 다음 문장의 ‘남은 화분’이 왜 특별한지 이해하게 해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took all the pots take + 목적어의 기본 동사구 구조이다. all the pots는 take의 목적어이다.</div><div class=\"lec-gr-item\">with colorful flowers with + 명사구가 뒤의 pots를 꾸며 주는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pot</td><td class=\"m\">화분, 냄비</td></tr><tr><td class=\"w\">colorful</td><td class=\"m\">색깔이 화려한, 다채로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">El은</span><span class=\"en\"><b>El</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가져갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class wers는 plant를 꾸며 주는 전치사구이다.</div><div class=\"lec-gr-item\">with no flowers 전치사구 with no + 명사로 ‘~이 없는’ 상태를 나타내며, 앞의 명사 plant를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">smallest</td><td class=\"m\">가장 작은</td></tr><tr><td class=\"w\">plant</td><td class=\"m\">식물, 화초</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“나는 느껴</span><span class=\"en\"><b>“I <span class=\"grammar-hl\">feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 너처럼,</span><span class=\"en\"><b><span class=\"grammar-hl\">just like you</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 식물아”</span><span class=\"en\"><b>little plant,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">El이 말했다</span><span class=\"en\"><b>said El.</b></span></div></div><div class=\"lec-sent-ko\">“나도 너와 같은 심정이야, 작은 식물아.” El이 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엘이 그 작은 식물과 자기 처지를 겹쳐 보고 있습니다. 겉모습이 초라해서 소외감을 느끼는 식물에 자신을 빗대며, 엘의 마음속 외로움이 드러납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">feel just like you (관용표현): feel like + 대명사는 ‘~처럼 느껴지다’의 뜻으로 쓰인다. 여기서는 like가 전치사처럼 쓰여 you를 비교 대상으로 받는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plant</td><td class=\"m\">식물, 화초</td></tr><tr><td class=\"w\">just like</td><td class=\"m\">꼭 ~처럼, 바로 ~와 같은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Diaz 선생님이</span><span class=\"en\"><b>Mr. Diaz</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">El을 보며</span><span class=\"en\"><b><span class=\"grammar-hl\">looked at El</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 말씀하셨다</span><span class=\"en\"><b>and said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“그것은</span><span class=\"en\"><b>“<span class=\"grammar-hl\">That’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과꽃 식물이야</span><span class=\"en\"><b><span class=\"grammar-hl\">an aster plant</span>.</b></span></div></div><div class=\"lec-sent-ko\">Diaz 선생님이 El을 보며 말씀하셨다. “그것은 과꽃 식물이야.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 선생님이 엘의 실망을 알아차리고 희망을 줍니다. 지금은 작아 보여도 나중에는 달라질 수 있다는 점을 알려 주며, 뒤에 나올 변화의 가능성을 제시합니다. 9. “But it’s just a little green plant,” said El. She was not so sure. 엘은 아직 선생님의 말을 믿지 못합니다. 지금 눈앞에 보이는 모습만으로 판단하고 있어서, 희망적인 설명을 받아들이지 못하는 상태입니다. 10. “You can have my zinnia plant,” Jo said to El, “I’ll be at my grandma’s all summer.” 조가 자기 화분을 엘에게 양보합니다. 단순한 교환이 아니라, 여름 동안 돌볼 수 없는 자신의 사정을 고려해 친구에게 기회를 넘겨 주는 장면입니다. 11. “I’ll plant my aster and your zinnia side by side,” El said. 엘이 이제 단순히 한 화분을 받는 데서 끝내지 않고, 두 식물을 함께 돌보겠다고 말합니다. 여기서 엘의 마음이 조금 열린 모습이 보이며, 조의 배려를 받아들이는 방향으로 바뀝니다. 12. “They’ll be good friends—just like us!” said Jo. El smiled. 식물 두 개를 친구에 비유하면서, 두 아이의 관계도 더 가까워졌다는 뜻입니다. 처음의 실망과 외로움이 우정과 기쁨으로 바뀌며 이야기가 따뜻하게 마무리됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looked at El (관용표현): look at + 목적어는 ‘~을 보다’의 기본 동사구이다.</div><div class=\"lec-gr-item\">That’s an aster plant 주어 That과 be동사’s, 보어 an aster plant로 이루어진 연결동사 구조이다. aster plant는 보어로서 앞의 주어를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plant</td><td class=\"m\">식물, 화초</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span cla
