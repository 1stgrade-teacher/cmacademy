aper cut-out) 기법을 발전시켰는데, 이건 붓 대신 색종이와 형태로 작품을 만드는 새로운 방식이었어요. 마치 몸이 불편한 사람이 악기를 바꿔도 음악을 계속하듯이, 마티스는 도구를 바꿔 창작을 이어간 셈이죠. 이 과정은 예술에서의 적응(adaptation)과 창의성(creativity)이 얼마나 중요한지 보여 주며, 실제로 마티스의 후기 작품들은 단순한 장식이 아니라 미술사에서 매우 혁신적인 시도로 평가받습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01소년 시절과 예술가의 시작</div><ul><li>프랑스의 작은 마을에서 자란 헨리 마티스(Henri Matisse)는 어릴 때부터 그림 그리기를 좋아했다.</li><li>프랑스의 작은 마을에서 성장</li><li>모래와 책에 그림을 그림</li><li>핵심 키워드: 마티스(Matisse), 그림(draw)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02파리에서의 성공</div><ul><li>성인이 된 마티스는 파리(Paris)로 가서 화가(artist)로 활동하며 점점 유명해졌다.</li><li>매일 그림을 그리며 삶을 이어 감</li><li>사람들의 관심과 사랑을 받음</li><li>결국 유명해짐(famous)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03병과 좌절</div><ul><li>나이가 든 마티스는 병에 걸려 침대에 누워 지내야 했고, 더 이상 제대로 그림을 그릴 수 없었다.</li><li>병 때문에 침대에 누워 지냄</li><li>꿈속에서만 그림을 그림</li><li>눈을 뜨면 슬픔(sadness)을 느낌</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04가위로 하는 새 예술</div><ul><li>다시 앉을 수 있게 된 마티스는 붓 대신 가위(scissors)로 종이를 잘라 새로운 작품을 만들기 시작했다.</li><li>다시 그림을 시도했지만 예전처럼 잘 그리지 못함</li><li>종이를 잘라 새, 꽃, 아름다운 형태를 만듦</li><li>핵심 키워드: 가위(scissors), 종이(paper), 창의성(creativity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05행복한 마무리</div><ul><li>종이 조각들로 방 안을 가득 채운 마티스는 침대에 누워서도 자신만의 작은 정원을 만들며 행복을 느꼈다.</li><li>방 안이 모양과 색깔로 가득 참</li><li>침대 주변에 종이 정원(paper garden)을 만듦</li><li>밤하늘의 별도 그의 가위에서 나온 것처럼 상상함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">henri matisse</td><td class=\"m\">앙리 마티스, 프랑스의 화가</td></tr><tr><td class=\"w\">draw</td><td class=\"m\">그리다, 그리기 시작하다, 끌어당기다</td></tr><tr><td class=\"w\">picture</td><td class=\"m\">그림, 사진, 장면</td></tr><tr><td class=\"w\">sand</td><td class=\"m\">모래</td></tr><tr><td class=\"w\">book</td><td class=\"m\">책</td></tr><tr><td class=\"w\">grow up</td><td class=\"m\">자라다, 성장하다, 어른이 되다</td></tr><tr><td class=\"w\">leave</td><td class=\"m\">떠나다, 남기다</td></tr><tr><td class=\"w\">artist</td><td class=\"m\">예술가, 화가</td></tr><tr><td class=\"w\">paint</td><td class=\"m\">그림을 그리다, 칠하다, 페인트를 바르다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">day after day</td><td class=\"m\">날마다, 매일 반복해서</td></tr><tr><td class=\"w\">year after year</td><td class=\"m\">해마다, 여러 해 동안 계속해서</td></tr><tr><td class=\"w\">be happy with</td><td class=\"m\">~에 만족하다, ~을 마음에 들어하다</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 주목하다</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">fall ill</td><td class=\"m\">병들다, 아프게 되다</td></tr><tr><td class=\"w\">lie in bed</td><td class=\"m\">침대에 누워 있다</td></tr><tr><td class=\"w\">at all</td><td class=\"m\">전혀, 조금도</td></tr><tr><td class=\"w\">dream</td><td class=\"m\">꿈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">앙리의 가위</span><span class=\"en\"><b>Henri’s Scissors <span class=\"grammar-hl\">In a small town in France, there lived a young boy</span>.</b></span></div></div><div class=\"lec-sent-ko\">(앙리의 가위)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 시작입니다. 장소와 주인공의 어린 시절을 먼저 보여 주면서, 앞으로 한 인물이 어떻게 성장하는지 따라갈 준비를 시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In a small town in France, there lived a young boy (도치): 장소구( in a small town in France )가 앞에 와서 주어 a young boy 뒤에 동사 lived가 놓인 도치 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">프랑스의 작은 마을에</span><span class=\"en\"><b><span class=\"grammar-hl\">His name was Henri Matisse</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살았다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">어린 소년이</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그의 이름은 Henri Matisse였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 나온 “어린 소년”이 누구인지 밝혀 줍니다. 이제 독자는 이 인물이 실제로 누구인지 알게 되고, 뒤에 이어질 삶의 이야기를 한 사람의 전기로 읽게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">His name was Henri Matisse 기본 SVC 구조다. His name이 주어, was가 연결동사, Henri Matisse가 보어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">henri matisse</td><td class=\"m\">앙리 마티스, 프랑스의 화가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 이름은</span><span class=\"en\"><b>He liked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">였다</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">앙리 마티스</span><span class=\"en\"><b><span class=\"grammar-hl\">draw pictures</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 그림 그리는 것을 좋아했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마티스의 어릴 적 성향을 보여 줍니다. 단순한 소개처럼 보이지만, 뒤에서 그가 화가가 되는 흐름의 출발점이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to draw pictures (to부정사): like toV 구조로 쓰인 부정사다. liked의 목적어처럼 보이지만 실제로는 liked 뒤에 이어지는 to부정사구이다.</div></div>\n -grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 시선을 돌리게 합니다. 앞의 상상을 지금 눈앞의 풍경과 연결시키려는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am really happy 기본 SVC 구조다. am이 연결동사, really happy가 보어이다.</div><div class=\"lec-gr-item\">he thought thought는 말하기 동사 뒤에 따옴표 안 내용이 오는 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 29 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마도</span><span class=\"en\"><b>Perhaps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마티스는 여전히 가위를 사용하고 있다</span><span class=\"en\"><b>Matisse <span class=\"grammar-hl\">is still using scissors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에서 별들을 오리기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to cut out stars in heaven</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마도 Matisse는 여전히 천국에서 별을 오리기 위해 가위를 사용하고 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마티스의 예술이 죽음 이후에도 계속되는 것처럼 상상하며 그를 기립니다. 현실의 이야기를 넘어, 그의 창작이 영원한 이미지로 남았다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is still using scissors to cut out stars in heaven (현재진행): is using은 be동사 + -ing 형태로 현재 진행 중인 동작을 나타낸다. to cut out stars in heaven은 목적을 나타내는 to부정사구다.</div><div class=\"lec-gr-item\">to cut out stars in heaven (to부정사): to cut out은 목적을 나타내며 뒤의 stars를 목적어로 취한다. cut out은 숙어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 30 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Look at the night sky</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밤하늘을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">밤하늘을 봐.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 시선을 돌리게 합니다. 앞의 상상을 지금 눈앞의 풍경과 연결시키려는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look at the night sky (관용표현): look at은 &#39;보다&#39;라는 의미의 숙어다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 31 / 31</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">별들 중 일부는</span><span class=\"en\"><b><span class=\"grammar-hl\">Some of the stars</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나올지도 모른다</span><span class=\"en\"><b><span class=\"grammar-hl\">may come</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 가위에서</span><span class=\"en\"><b><span class=\"grammar-hl\">from his scissors</span>.</b></span></div></div><div class=\"lec-sent-ko\">별들 중 일부는 그의 가위에서 나온 것일지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 밤하늘의 별빛을 마티스의 작품처럼 바라보게 만드는 마지막 마무리입니다. 그의 상상력과 작품이 자연의 아름다움과 이어져 있다는 감동적인 결말입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Some of the stars may come from his scissors 기본 조동사 구조다. may가 가능성을 나타내고 come from이 이어진다.</div><div class=\"lec-gr-item\">come from his scissors (관용표현): come from은 &#39;…에서 오다, …에서 비롯되다&#39;라는 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>마티스는 어린 시절부터 그림을 좋아했고, 결국 파리에서 화가가 되었다.</li><li>오랫동안 그림을 그리며 성공했지만, 나이가 들어 병들면서 더 이상 예전처럼 그릴 수 없게 되었다.</li><li>그러나 그는 가위와 종이를 사용해 새로운 방식의 예술을 찾아냈다.</li><li>몸은 약해졌어도 창작의 즐거움은 계속되었고, 그의 작품은 별빛처럼 오래 기억될 존재가 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Matisse became unable to paint because of illness, but he found a new way to create beautiful art by cutting paper with scissors.</div>\n              <div class=\"lec-final-sum-ko\">마티스는 병으로 그림을 그릴 수 없게 되었지만, 종이를 가위로 잘라 아름다운 예술을 만드는 새로운 방법을 찾았다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"},{"audio":"./full_audio/8.mp3","hl":"stage-4"}],[{"audio":"./full_audio/9.mp3","hl":null}],[{"audio":"./full_audio/10.mp3","hl":"main"},{"audio":"./full_audio/11.mp3","hl":"meaning"},{"audio":"./full_audio/12.mp3","hl":"grammar"}],[{"audio":"./full_audio/13.mp3","hl":"main"},{"audio":"./full_audio/14.mp3","hl":"meaning"},{"audio":"./full_audio/15.mp3","hl":"grammar"}],[{"audio":"./full_audio/16.mp3","hl":"main"},{"audio":"./full_audio/17.mp3","hl":"meaning"},{"audio":"./full_audio/18.mp3","hl":"grammar"}],[{"audio":"./full_audio/19.mp3","hl":"main"},{"audio":"./full_audio/20.mp3","hl":"meaning"},{"audio":"./full_audio/21.mp3","hl":"grammar"}],[{"audio":"./full_audio/22.mp3","hl":"main"},{"audio":"./full_audio/23.mp3","hl":"meaning"},{"audio":"./full_audio/24.mp3","hl":"grammar"}],[{"audio":"./full_audio/25.mp3","hl":"main"},{"audio":"./full_audio/26.mp3","hl":"meaning"},{"audio":"./full_audio/27.mp3","hl":"grammar"}],[{"audio":"./full_audio/28.mp3","hl":"main"},{"audio":"./full_audio/29.mp3","hl":"meaning"},{"audio":"./full_audio/30.mp3","hl":"grammar"}],[{"audio":"./full_audio/31.mp3","hl":"main"},{"audio":"./full_audio/32.mp3","hl":"meaning"},{"audio":"./full_audio/33.mp3","hl":"grammar"}],[{"audio":"./full_audio/34.mp3","hl":"main"},{"audio":"./full_audio/35.mp3","hl":"meaning"},{"audio":"./
