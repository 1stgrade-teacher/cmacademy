<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 천재(소영순) 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 천재(소영순) 7과 본문2","audioDir":"2_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 천재(소영순)\u003c/div>\u003ch1>Matisse: Painting with Scissors\u003c/h1>\u003ch2>마티스: 가위로 그리는 그림\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>건강 악화로 침대에 머물게 된 \u003cb class=\"key\">마티스\u003c/b>가 \u003cb class=\"key\">가위\u003c/b>를 이용해 종이를 오려 자신만의 정원을 만들며 새로운 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>과 행복을 찾는 과정을 그리고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Henri Matisse overcame his physical limitations by creating vibrant paper art with scissors, finding true happiness in his new creative journey.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 1학년 천재 소영순 교과서 7과의 두 번째 본문 이야기를 함께 나누어 보려고 해요. 이번 시간에는 위대한 화가 앙리 마티스가 어떻게 가위라는 도구로 새로운 예술 인생을 시작했는지 살펴볼 거예요. 글의 핵심은 신체적 한계를 극복하고 가위로 만든 종이 정원에서 찾은 진정한 행복입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">앙리 마티스는 강렬한 색채를 사용했던 야수파(Fauvism)의 거장입니다. 노년에 암 수술과 건강 악화로 인해 \u003cb class=\"key\">휠체어\u003c/b>에 의지하게 되자, 더 이상 붓을 들고 서서 그림을 그릴 수 없게 되었습니다. 그는 절망하는 대신 \u003cb class=\"key\">가위\u003c/b>를 들어 채색된 종이를 오려 붙이는 '종이 오리기(Gouaches Découpés)'라는 새로운 기법을 창조했습니다. 이것은 신체적 한계가 결코 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">창의성\u003c/b>을 막을 수 없음을 보여주는 감동적인 사례입니다. 마치 악기가 망가진 연주자가 손뼉으로 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>을 만들어내는 것처럼, 마티스도 도구를 바꾸어 인생의 두 번째 정점을 맞이했습니다.\u003c/div>","segs":[{"n":2,"text":"마티스는 원래 강렬한 색을 쓰는 아주 유명한 화가였어요. 하지만 나이가 들어 몸이 아파지자 더 이상 서서 그림을 그릴 수 없게 되어 주로 휠체어나 침대에서 생활해야 했답니다. 마티스는 여기서 좌절했을까요? 아니에요! 그는 붓 대신 가위를 들어 종이를 오려 붙이는 자신만의 새로운 방식을 찾아냈습니다. 마치 우리가 컴퓨터 대신 태블릿으로 그림을 그리듯, 그는 도구의 한계를 뛰어넘어 새로운 가능성을 열었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>가위라는 새로운 붓\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>마티스가 가위를 집어 들어 종이를 오리는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 실행에 옮깁니다. 그는 단순히 종이를 자르는 것이 아니라 가위를 이용해 \u003cb class=\"key\">그림을 \u003c/b>\u003cb class=\"key\">그리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>과 같은 예술 활동을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가위가 준 기회\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>무엇인가를 오려 내는 행위에서 마티스는 큰 \u003cb class=\"key\">기쁨\u003c/b>을 느낍니다. 건강 문제로 그림을 그리기 어려운 상황에서 가위는 그에게 \u003cb class=\"key\">또 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 선사한 소중한 도구가 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>방 안의 작은 정원\u003csmall>전개 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>침대에 머물러야 하는 한계가 있었지만, 마티스는 온종일 종이를 오려 \u003cb class=\"key\">종이 \u003c/b>\u003cb class=\"key\">정원\u003c/b>을 완성합니다. 자신의 창조물로 둘러싸인 환경에서 마티스는 진정으로 \u003cb class=\"key\">행복함\u003c/b>을 느낍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>하늘로 이어진 예술\u003csmall>결론 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>작가는 마티스가 천국에서도 \u003cb class=\"key\">가위질\u003c/b>을 멈추지 않았을 것이라고 상상합니다. 밤하늘의 별들이 마티스의 손끝에서 탄생했을지 모른다는 \u003cb class=\"key\">문학적 \u003c/b>\u003cb class=\"key\">상상력\u003c/b>으로 글을 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 마티스가 가위로 종이 예술을 시작한 순간부터 그가 느낀 행복, 그리고 영원히 기억될 그의 모습까지 시간의 흐름을 따라 전개되고 있어요.","hl":null},{"n":4,"text":"첫 번째부터 네 번째 문장까지는 마티스의 멋진 아이디어가 시작되는 단계예요. 가위를 집어 들고 종이를 오려 아름다운 모양을 만드는 모습을 보여주는데, 작가는 이를 가위로 그림을 그리고 있었다고 아주 멋지게 표현하고 있습니다.","hl":"f0"},{"n":5,"text":"다섯 번째와 여섯 번째 문장에서는 마티스가 스스로에게 하는 말이 나옵니다. 종이를 오리는 기쁨이 점점 커지고 있고, 가위가 자신에게 또 다른 기회를 주었다며 가슴 벅찬 소감을 전하고 있죠.","hl":"f1"},{"n":6,"text":"일곱 번째부터 열한 번째 문장까지는 그의 방이 온통 종이 정원으로 변하는 과정을 담고 있습니다. 비록 몸은 침대에 대부분 머물러야 하는 답답한 상황이지만, 자신의 주변을 정원으로 채우며 정말 행복하다고 생각하는 마티스의 마음이 잘 느껴집니다.","hl":"f2"},{"n":7,"text":"마지막으로 열두 번째부터 열네 번째 문장까지는 마티스의 예술이 천국에서도 계속될 것이라는 작가의 상상이 이어집니다. 우리가 보는 밤하늘의 별들이 사실은 마티스의 가위에서 나온 것일지도 모른다는 낭만적인 마무리로 독자들에게 감동을 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">마티스가 아이디어를 얻고 종이를 오려 정원을 만든 뒤, 그 결과에 대해 느끼는 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">결론\u003c/b>을 시간의 흐름에 따라 배치했습니다. 특히 문장 11번에서 자신의 현재 상태와 대조되는 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">행복\u003c/b>을 강조하며 주제를 드러냅니다. 마지막에는 마티스의 예술을 \u003cb class=\"key\">밤하늘의 \u003c/b>\u003cb class=\"key\">별\u003c/b>에 비유하여 영원성을 부여하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>이야기의 시작을 알림\u003c/span>\u003cb>Soon (8)\u003c/b>\u003cspan>시간의 경과와 변화의 결과 제시\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>신체적 제약과 예술적 성취의 대조\u003c/span>\u003cb>Perhaps (12)\u003c/b>\u003cspan>작가의 주관적 추측과 상상으로 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Matisse\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">My pleasure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another chance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his room\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a small paper garden\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his scissors\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 마티스의 행동과 감정의 변화를 시간순으로 배치한 전개 방식을 따르고 있어요. 특히 뒷부분에서 마티스의 행복감과 예술적 가치를 강조하고 있어 주제가 뒤에 강조되는 미괄식 구조에 가깝습니다.","hl":"ty"},{"n":9,"text":"One day라는 표현으로 새로운 변화의 시작을 알리고, Soon을 사용해서 그의 방이 모양과 색으로 가득 차게 된 빠른 변화를 보여줍니다. 또한 but을 사용해서 침대에 머무는 고통스러운 상황과 종이 정원을 만든 기쁜 상황을 대조하며 마티스의 의지를 돋보이게 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>brilliant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 아이디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>scissors\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가위\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자르다, 오리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모양, 형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 잘라 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say to oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혼잣말을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기쁨, 즐거움\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>커지다, 자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>another\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>또 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>all day\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>하루 종일\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>be full of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 가득 차다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>most of the time\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>대부분의 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>garden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정원\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 주변에\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나뭇잎 (복수형: leaves)\u003c/span>\u003c/div>\u003cdiv>\u003cb>perhaps\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>heaven\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천국, 하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>night sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밤하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 나오다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 살펴볼까요? 멋진이라는 뜻의 brilliant와 무엇으로 가득 차다라는 의미의 be full of는 꼭 외워두세요. 그리고 혼잣말을 하다라는 뜻의 say to oneself도 마티스의 심정을 나타내는 중요한 숙어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">brilliant\u003c/b>\u003cspan class=\"m\">멋진, 훌륭한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">excellent\u003c/span>\u003cspan class=\"s\">superb\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pleasure\u003c/b>\u003cspan class=\"m\">기쁨\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">joy\u003c/span>\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003cspan class=\"a\">displeasure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">chance\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">opportunity\u003c/span>\u003cspan class=\"s\">possibility\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stay\u003c/b>\u003cspan class=\"m\">머무르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remain\u003c/span>\u003cspan class=\"s\">reside\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perhaps\u003c/b>\u003cspan class=\"m\">아마도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maybe\u003c/span>\u003cspan class=\"s\">possibly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certainly\u003c/span>\u003cspan class=\"a\">definitely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. 기쁨을 뜻하는 pleasure는 joy나 delight로 바꿔 쓸 수 있지만, 슬픔을 뜻하는 sorrow와는 반대되는 개념입니다. 아마도라는 뜻의 perhaps는 maybe와 비슷하고, 확실히를 뜻하는 certainly와는 반대 의미를 가집니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Matisse는 해냈다\u003c/span>\u003cspan class=\"en\">Matisse got\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 생각을.\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">brilliant\u003c/span> idea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, Matisse는 멋진 생각을 해냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 마티스의 새로운 예술적 시도의 \u003cb class=\"key\">시작\u003c/b>을 알리는 전환점입니다. 아파서 누워 있던 그에게 찾아온 \u003cb class=\"key\">영감\u003c/b>을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사를 수식하는 형용사\u003c/span> : brilliant [형용사] + idea [명사] : \"멋진\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One day, 어느 날. Matisse got, Matisse는 해냈다. a brilliant idea, 멋진 생각을.. 이 문장 전체를 해석하면, 어느 날, Matisse는 멋진 생각을 해냈다.","hl":"m"},{"n":13,"text":"마티스가 몸이 아파 침대에만 있다가 새로운 예술 세계를 여는 결정적인 순간이에요. 그에게 찾아온 아주 멋진 아이디어를 소개하고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 형용사 brilliant예요. 이 단어는 뒤에 있는 명사인 idea를 꾸며주고 있어요. 마티스의 생각이 단순한 게 아니라 아주 반짝이고 멋진 것이었다는 느낌을 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가위를 집어 들어,\u003c/span>\u003cspan class=\"en\">He picked up scissors,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이를 자르고,\u003c/span>\u003cspan class=\"en\">cut some paper,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 만들었다\u003c/span>\u003cspan class=\"en\">and made\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름다운 모양을.\u003c/span>\u003cspan class=\"en\">beautiful shapes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스가 직접 \u003cb class=\"key\">행동\u003c/b>에 옮기는 과정을 나열하여 보여줍니다. 세 개의 동사가 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>로 연결되어 동작의 순서를 명확히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거동사의 병렬 구조\u003c/span> : V1 (picked up), V2 (cut), and V3 (made) : \"집어 들었고, 잘랐고, 그리고 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He picked up scissors, 그는 가위를 집어 들어. cut some paper, 종이를 자르고. and made, 그리고 만들었다. beautiful shapes, 아름다운 모양을.. 이 문장 전체를 해석하면, 그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다.","hl":"m"},{"n":16,"text":"마티스가 생각에만 그치지 않고 가위를 들어서 예술 작품을 만드는 구체적인 과정을 생생하게 묘사하고 있어요.","hl":"mn"},{"n":17,"text":"두 번째 문장의 핵심은 picked up, cut, 그리고 made가 콤마와 and로 연결된 병렬 구조예요. 주어 He가 한 세 가지 행동을 과거형으로 나란히 썼죠. 여기서 cut은 과거형도 모양이 똑같다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 잘라 냈다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cut \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새와 꽃을.\u003c/span>\u003cspan class=\"en\">birds and flowers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 새와 꽃을 잘라 냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스가 종이를 잘라 구체적으로 무엇을 만들었는지 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">사항\u003c/b>을 설명합니다. 가위로 만든 \u003cb class=\"key\">작품의 \u003c/b>\u003cb class=\"key\">소재\u003c/b>가 무엇인지 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사(구동사)\u003c/span> : cut [동사] + out [부사] : \"잘라 내다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He cut out, 그는 잘라 냈다. birds and flowers, 새와 꽃을.. 이 문장 전체를 해석하면, 그는 새와 꽃을 잘라 냈다.","hl":"m"},{"n":19,"text":"마티스의 종이 정원이 어떤 모습으로 시작되었는지 보여주는 문장이에요. 새와 꽃 같은 자연의 소재들을 선택했네요.","hl":"mn"},{"n":20,"text":"세 번째 문장의 cut out은 이어동사라고 불러요. 단순히 자르는 것에서 나아가 밖으로 오려 낸다는 의미를 담고 있죠. 이렇게 동사와 부사가 짝꿍처럼 쓰이는 표현들에 익숙해져야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그림을 그리고 있었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">drawing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가위로!\u003c/span>\u003cspan class=\"en\">with SCISSORS!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 가위로 그림을 그리고 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스가 붓 대신 가위를 예술적 도구로 사용하여 \u003cb class=\"key\">창의적인 \u003c/b>\u003cb class=\"key\">시도\u003c/b>를 시작했음을 보여줍니다. 평범한 도구가 마티스의 손에서 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">수단\u003c/b>으로 변화하는 놀라운 순간을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(was/were) + [동사원형-ing] : \"그리고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He was drawing, 그는 그림을 그리고 있었다. with SCISSORS!, 가위로!. 이 문장 전체를 해석하면, 그는 가위로 그림을 그리고 있었다!","hl":"m"},{"n":22,"text":"화가인 마티스가 붓이 아니라 가위를 사용하여 그림을 그린다는 아주 놀랍고 창의적인 장면을 묘사하고 있습니다. 가위라는 일상적인 도구가 마티스에게는 새로운 예술적 도구가 된 것이죠.","hl":"mn"},{"n":23,"text":"문장에서 was drawing 부분을 주목해 보세요. be동사 과거형인 was 뒤에 동사원형에 ing를 붙인 형태인 과거진행형이 쓰였어요. 과거의 어느 순간에 마티스가 가위질을 하며 그림을 그리고 있던 생생한 동작을 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 자기 자신에게 말했다,\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나의 기쁨이\u003c/span>\u003cspan class=\"en\">&quot;My pleasure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가를 오려 내는 것에서의\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cutting\u003c/span> things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱 커지고 있어.&quot;\u003c/span>\u003cspan class=\"en\">grows and grows.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 “무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 종이를 오리는 단순한 작업이 마티스에게 큰 \u003cb class=\"key\">행복감\u003c/b>을 주고 있음을 표현합니다. 'grows and grows'라는 반복 표현을 통해 열정이 \u003cb class=\"key\">점진적으로 \u003c/b>\u003cb class=\"key\">심화\u003c/b>되고 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀 용법\u003c/span> : 주어(He) ... 전치사(to) + [목적어(himself)] : \"혼잣말을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : 전치사(in) + [동사원형-ing(목적어)] : \"오려 내는 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He said to himself, 그는 자기 자신에게 말했다. \"My pleasure, \"나의 기쁨이. in cutting things, 무엇인가를 오려 내는 것에서의. grows and grows, 더욱 커지고 있어.\". 이 문장 전체를 해석하면, 그는 “무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어.","hl":"m"},{"n":25,"text":"건강 악화로 힘든 상황이었지만 가위질이라는 새로운 작업 방식이 마티스에게 큰 즐거움을 주었고 그 행복이 점점 커지고 있다는 고백입니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 said to himself입니다. 주어인 He와 전치사의 목적어가 같은 사람이기 때문에 재귀대명사 himself를 썼고 혼잣말을 했다는 의미를 전달해요. 두 번째 포인트는 전치사 in 다음에 나온 cutting입니다. 전치사 뒤에는 반드시 명사나 동명사가 와야 하므로 동사 cut을 동명사 형태로 바꾸어 준 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가위는 내게 주었어\u003c/span>\u003cspan class=\"en\">Scissors \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 기회를.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">chance\u003c/span>.&quot;\u003c/span>\u003c/div>\
