<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 천재(소영순) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 천재(소영순) 7과 본문1","audioDir":"1_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">7과\u003cbr>본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 천재(소영순)\u003c/div>\u003ch1>Henri Matisse: A Lifelong Passion for Art\u003c/h1>\u003ch2>앙리 마티스: 예술을 향한 평생의 열정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">앙리 \u003c/b>\u003cb class=\"key\">마티스\u003c/b>의 어린 시절부터 화가로서의 성공, 그리고 노년의 \u003cb class=\"key\">투병\u003c/b> 중에도 멈추지 않았던 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">열정\u003c/b>을 다루고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Henri Matisse pursued his passion for painting throughout his life, even when facing physical challenges.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 세계적인 화가 앙리 마티스의 삶을 담은 흥미로운 지문을 함께 공부해 보겠습니다. 이 글은 마티스가 어떻게 예술가의 길을 걷게 되었는지, 그리고 노년에 찾아온 큰 시련을 어떻게 마주했는지를 보여줍니다. 끝까지 포기하지 않는 그의 예술적 열정에 집중해서 요지를 파악해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">앙리 마티스는 파블로 피카소와 함께 20세기 최고의 화가로 꼽히는 \u003cb class=\"key\">야수파\u003c/b>(Fauvism)의 창시자입니다. 그는 색채의 마술사라 불릴 만큼 강렬한 색을 사용했는데, 이는 당시 사람들에게 큰 충격을 주었습니다. 이 지문은 그의 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">생애\u003c/b>를 시간순으로 보여주며, 특히 노년에 몸이 불편해진 \u003cb class=\"key\">역경\u003c/b>을 어떻게 마주했는지 설명합니다. 마치 운동선수가 부상을 입어도 운동을 포기하지 않는 것처럼, 마티스에게 그림은 \u003cb class=\"key\">삶 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">자체\u003c/b>였습니다.\u003c/div>","segs":[{"n":2,"text":"강의를 시작하기 전에 마티스에 대해 살짝 알아볼까요? 앙리 마티스는 강렬한 색채를 사용하는 야수파라는 화풍을 만든 아주 유명한 프랑스 화가예요. 사람들은 그를 색채의 마술사라고 부르기도 하죠. 오늘 지문은 그의 화려한 작품 뒤에 숨겨진 인간적인 고민과 역경을 시간의 흐름에 따라 보여주고 있습니다. 마치 운동선수가 큰 부상을 당한 뒤 다시 재활에 도전하는 모습과 비슷하다고 생각하며 읽어보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>어린 시절의 마티스\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>프랑스의 작은 마을에서 자란 소년 마티스는 모래와 책에 \u003cb class=\"key\">그림 \u003c/b>\u003cb class=\"key\">그리기\u003c/b>를 매우 좋아했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>화가로의 성장과 명성\u003csmall>전개 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>성인이 된 마티스는 파리로 떠나 유명한 \u003cb class=\"key\">화가\u003c/b>가 되었고, 많은 사람들에게 \u003cb class=\"key\">사랑\u003c/b>을 받았습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>투병으로 인한 슬픔\u003csmall>전환 · 문장 10–14\u003c/small>\u003c/h4>\u003cp>노년기에 \u003cb class=\"key\">병에 \u003c/b>\u003cb class=\"key\">걸린\u003c/b> 마티스는 침대에 누워만 있어야 했고, 더는 \u003cb class=\"key\">그림\u003c/b>을 그릴 수 없게 되어 슬퍼했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다시 시작된 예술적 의지\u003csmall>결론 · 문장 15–17\u003c/small>\u003c/h4>\u003cp>다행히 기운을 차려 다시 그림을 시작했지만, 이전만큼 \u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">그릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 깨닫게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 마티스의 어린 시절부터 노년기까지 인생의 흐름을 네 단계로 나누어 설명하고 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 프랑스의 작은 마을에서 그림을 사랑하며 자란 마티스의 어린 시절을 보여줍니다. 모래와 책에 그림을 그렸다는 묘사를 통해 그의 순수한 열정을 느낄 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 전개부에서는 마티스가 파리로 가서 화가로 성공하는 과정을 담고 있습니다. 해마다 열심히 그림을 그리며 사람들의 사랑을 받고 유명해지는 행복한 전성기를 묘사하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 전환부에서는 갑자기 분위기가 바뀝니다. 노인이 된 마티스가 병에 걸려 침대에만 누워 있게 되고, 그토록 사랑하던 그림을 그릴 수 없게 된 깊은 슬픔을 전달합니다.","hl":"f2"},{"n":7,"text":"마지막 결론 단계에서는 마티스가 다시 일어나 그림을 그리려고 노력하는 모습을 보여줍니다. 비록 예전처럼 잘 그릴 수는 없었지만, 끝까지 붓을 놓지 않았던 그의 의지를 엿볼 수 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">마티스의 \u003cb class=\"key\">어린 \u003c/b>\u003cb class=\"key\">시절\u003c/b>부터 \u003cb class=\"key\">노년기\u003c/b>까지의 삶의 궤적을 시간의 흐름에 따라 나열한 \u003cb class=\"key\">연대기적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>입니다. 마티스의 성공을 다룬 중간 부분이 내용상 정점을 이루며, 이후 노년의 \u003cb class=\"key\">시련\u003c/b>과 극복 과정을 연결합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When Matisse grew up (5)\u003c/b>\u003cspan>시간적 배경 변화(성인기)\u003c/span>\u003cb>When Matisse became an old man (10)\u003c/b>\u003cspan>시간적 배경 변화(노년기)\u003c/span>\u003cb>before long (15)\u003c/b>\u003cspan>상태 변화의 시점\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">young boy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Henri Matisse\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">artist\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">famous\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">old man\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 전형적인 시간 순서에 따른 전개 방식을 취하고 있어요. 마티스가 아이였을 때부터 노인이 되었을 때까지 일어난 사건들을 차례대로 나열하고 있죠. 구조적으로는 마티스의 성공이 가장 돋보이는 중간 부분에 핵심적인 내용이 담긴 중괄식 구성으로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 잘 보세요. 다섯 번째 문장의 When Matisse grew up과 열 번째 문장의 When Matisse became an old man이 시간의 큰 변화를 알려줍니다. 그리고 열다섯 번째 문장의 before long이라는 표현은 슬픔의 시기가 지나고 새로운 변화가 시작됨을 알려주는 아주 중요한 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>town\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>lived\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dr 003c/b>\u003cem>부사\u003c/em>\u003cspan>후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>realized\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨달았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anymore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 이상\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? fell ill은 병에 걸리다라는 뜻으로 마티스의 위기를 나타내고, notice는 알아차리다라는 뜻으로 그의 성공을 상징합니다. at all은 부정문과 쓰여 전혀라는 의미를 강조할 때 자주 쓰이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">artist\u003c/b>\u003cspan class=\"m\">화가, 예술가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">painter\u003c/span>\u003cspan class=\"s\">creator\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ill\u003c/b>\u003cspan class=\"m\">병든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sick\u003c/span>\u003cspan class=\"s\">unwell\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003cspan class=\"a\">well\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">luckily\u003c/b>\u003cspan class=\"m\">다행히도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fortunately\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unluckily\u003c/span>\u003cspan class=\"a\">unfortunately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realized\u003c/b>\u003cspan class=\"m\">깨달았다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understood\u003c/span>\u003cspan class=\"s\">noticed\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘인 famous의 동의어로는 well-known이나 renowned를 꼭 알아두세요. 반의어는 unknown이 되겠죠. ill은 sick으로 바꿔 쓸 수 있고 반대말은 healthy입니다. luckily의 동의어인 fortunately도 시험에 정말 자주 나오는 표현이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 마을에\u003c/span>\u003cspan class=\"en\">In a small town\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스의\u003c/span>\u003cspan class=\"en\">in France,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">lived\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린 소년이\u003c/span>\u003cspan class=\"en\">a young boy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">프랑스의 작은 마을에 어린 소년이 살았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">배경\u003c/b>과 주인공을 소개하며 독자의 관심을 끄는 도입부입니다. \u003cb class=\"key\">장소\u003c/b>를 먼저 언급하여 옛날이야기를 들려주는 듯한 느낌을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + 1형식 동사의 도치\u003c/span> : there + [V (lived)] + [S (a young boy)] : \"~가 살았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In a small town, 작은 마을에. in France, 프랑스의. there lived, 살았다. a young boy, 어린 소년이. 이 문장 전체를 해석하면, 프랑스의 작은 마을에 어린 소년이 살았다.","hl":"m"},{"n":13,"text":"프랑스의 한 한적한 마을을 배경으로 이야기가 시작되네요. 위대한 화가인 마티스의 어린 시절 모습을 보여주는 첫 번째 문장이에요.","hl":"mn"},{"n":14,"text":"문장 처음에 there가 나오면 주어가 뒤로 가는 도치 구조가 나타나요. 여기서 동사는 lived이고 주어는 a young boy라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 이름은\u003c/span>\u003cspan class=\"en\">His name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Henri Matisse\u003c/span>\u003cspan class=\"en\">Henri Matisse.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 이름은 Henri Matisse였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 소년이 누구인지 \u003cb class=\"key\">이름\u003c/b>을 구체적으로 밝힙니다. 글의 \u003cb class=\"key\">주인공\u003c/b>인 앙리 마티스를 정식으로 소개하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형\u003c/span> : [주어 (His name)] + [was (be동사 과거)] + [보어] : \"~였다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"His name, 그의 이름은. was, 였다. Henri Matisse, Henri Matisse. 이 문장 전체를 해석하면, 그의 이름은 Henri Matisse였다.","hl":"m"},{"n":16,"text":"앞에서 말한 소년이 누구인지 이름을 알려주고 있네요. 바로 우리가 잘 아는 유명한 화가 앙리 마티스의 이야기예요.","hl":"mn"},{"n":17,"text":"주어가 His name으로 삼인칭 단수이기 때문에 비동사 과거형인 was를 썼어요. 주어의 인칭과 수에 맞춰 동사를 쓰는 게 중요하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋아했다\u003c/span>\u003cspan class=\"en\">liked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림\u003c/span>\u003cspan class=\"en\">pictures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그림 그리는 것을 좋아했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공의 \u003cb class=\"key\">취미\u003c/b>를 언급하여 훗날 화가가 될 것이라는 \u003cb class=\"key\">복선\u003c/b>을 제시합니다. 그가 무엇에 열정이 있었는지 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : liked [동사] + [to draw (to부정사/목적어)] : \"그리는 것을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He, 그는. liked, 좋아했다. to draw, 그리는 것을. pictures, 그림. 이 문장 전체를 해석하면, 그는 그림 그리는 것을 좋아했다.","hl":"m"},{"n":19,"text":"마티스가 어릴 때 무엇을 좋아했는지 설명하고 있어요. 그림 그리기를 아주 좋아했던 소년의 특징을 잘 보여주네요.","hl":"mn"},{"n":20,"text":"liked라는 동사 뒤에 무엇을 좋아하는지 목적어를 쓸 때 to draw처럼 투부정사를 사용해요. 여기서는 그리는 것이라는 명사처럼 쓰인 명사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그렸다\u003c/span>\u003cspan class=\"en\">He drew\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림을\u003c/span>\u003cspan class=\"en\">pictures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모래에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sand \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그의 책에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">books\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 모래와 그의 책에 그림을 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어린 시절의 마티스가 주변의 흔한 재료들을 활용해 \u003cb class=\"key\">그림 \u003c/b>\u003cb class=\"key\">그리기\u003c/b>에 열중했던 모습을 보여줍니다. 장소에 구애받지 않는 그의 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">열정\u003c/b>을 묘사하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬 구조\u003c/span> : [in the sand] + and + [in his books] : \"모래 속에 그리고 그의 책 속에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He drew, 그는 그렸다. pictures, 그림을. in the sand, 모래에. and in his books, 그리고 그의 책에. 이 문장 전체를 해석하면, 그는 모래와 그의 책에 그림을 그렸다.","hl":"m"},{"n":22,"text":"어린 시절 마티스가 얼마나 그림 그리기를 좋아했는지 알 수 있는 대목이죠? 모래밭이나 책 같은 평범한 곳도 그에게는 훌륭한 캔버스였던 거예요.","hl":"mn"},{"n":23,"text":"여기서 and라는 접속사를 잘 보세요. in the sand와 in his books라는 두 전치사구를 나란히 연결하는 병렬 구조를 만들고 있습니다. 이렇게 같은 형태를 나란히 두는 게 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Matisse가 어른이 되었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Matisse \u003c/span>\u003cspan class=\"tgt\">grew \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 마을을 떠났다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">town \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파리에서 화가가\u003c/span>\u003cspan class=\"en\">an artist in Paris.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스의 인생에서 중요한 \u003cb class=\"key\">전환점\u003c/b>을 설명합니다. 고향을 떠나 예술의 중심지인 파리에서 \u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">화가\u003c/b>로서의 삶을 시작했음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사 When\u003c/span> : When + [주어] + [동사] : \"Matisse가 자랐을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : [left (동사1)] + and + [became (동사2)] : \"마을을 떠났고 그리고 되었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When Matisse grew up, Matisse가 어른이 되었을 때. he left his town, 그는 마을을 떠났다. and became, 그리고 되었다. an artist in Paris, 파리에서 화가가. 이 문장 전체를 해석하면, Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다.","hl":"m"},{"n":25,"text":"이제 마티스의 본격적인 예술가 인생이 시작되는 문장이에요. 고향을 떠나 큰 도시인 파리로 가서 꿈을 이룬 장면이죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 접속사 When입니다. 마티스가 자랐을 때라는 시간을 나타내는 부사절을 이끌고 있어요. 두 번째는 동사 left와 became입니다. 주어 he에 연결된 두 과거 동사가 and를 중심으로 병렬 구조를 이루고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그림을 그렸다\u003c/span>\u003cspan class=\"en\">He painted pictures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">year \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">year\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 날마다, 해마다 그림을 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스가 화가가 된 후 얼마나 \u003cb class=\"key\">성실하게\u003c/b> 작업에 임했는지 강조합니다. 시간의 흐름을 나타내는 표현을 통해 그의 \u003cb class=\"key\">꾸준함\u003c/b>을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">반복을 통한 강조\u003c/span> : [명사] + after + [명사] : \"날마다 그리고 해마다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He painted pictures, 그는 그림을 그렸다. day after day, 날마다. and year after year, 해마다. 이 문장 전체를 해석하면, 그는 날마다, 해마다 그림을 그렸다.","hl":"m"},{"n":28,"text":"마티스는 한두 번 그리고 만 게 아니에요. 매일매일, 그리고 수년 동안 아주 꾸준히 그림을 그린 성실한 화가였다는 걸 알 수 있습니다.","hl":"mn"},{"n":29,"text":"여기서 day after day와 year after year라는 표현이 재미있죠? 명사 뒤에 after를 쓰고 다시 같은 명사를 써서 아주 오랫동안 그 행동이 지속되었다는 점을 강조하고 있는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 ~했다\u003c/span>\u003cspan class=\"en\">He was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 삶에.\u003c/span>\u003cspan class=\"en\">his life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그의 삶에 행복해했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스가 파리에서 화가로서 \u003cb class=\"key\">만족감\u003c/b>을 느끼며 살아가고 있음을 보여줍니다. 자신의 꿈을 이룬 뒤 찾아온 \u003cb class=\"key\">평온한\u003c/b> 일상을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be happy with (~에 행복해하다)\u003c/span> : be [be동사] + happy [형용사] + with [전치사] : \"~에 행복해하다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He was, 그는 ~했다. happy with, 행복해. his life, 그의 삶에.. 이 문장 전체를 해석하면, 그는 그의 삶에 행복해했다.","hl":"m"},{"n":31,"text":"마티스가 파리에서 화가로서 매일 그림을 그리며 자신의 삶에 아주 만족하고 있었다는 것을 알 수 있어요. 꿈을 이루고 난 뒤의 평화로운 감정이 잘 느껴지는 문장입니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트로 be happy with 표현을 보세요. 이 표현은 주어가 무엇에 대해 행복해하거나 만족해할 때 쓰는데, 여기서는 전치사 with 뒤에 그의 삶이라는 의미의 his life가 와서 자신의 삶에 행복해했다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">More \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아보기 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">notice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를.\u003c/span>\u003cspan class=\"en\">him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">점점 더 많은 사람들이 그를 알아보기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중의 관심이 \u003cb class=\"key\">점차적으로\u003c/b> 증가하고 있음을 강조합니다. 무명 화가에서 유명 화가로 넘어가는 \u003cb class=\"key\">전환점\u003c/b>이 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : More and more + [복수 명사] : \"점점 더 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">begin의 목적어 (to부정사)\u003c/span> : begin [타동사] + to [to부정사/목적어] : \"알아보기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"More and more people, 점점 더 많은 사람들이. began to notice, 알아보기 시작했다. him, 그를.. 이 문장 전체를 해석하면, 점점 더 많은 사람들이 그를 알아보기 시작했다.","hl":"m"},{"n":34,"text":"마티스의 실력이 알려지면서 사람들이 그를 주목하기 시작했다는 내용이에요. 인기가 점점 높아지고 있다는 것을 More and more라는 표현으로 강조하고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 More and more는 비교급 and 비교급 구조로, 점점 더 많은이라는 강조의 의미를 나타내요. 두 번째로 began to notice에서는 begin이라는 동사 뒤에 to notice라는 to부정사가 와서 어떤 행동을 시작했다는 의미의 목적어 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그의 그림을 사랑했고,\u003c/span>\u003cspan class=\"en\">They loved his paintings,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧\u003c/span>\u003cspan class=\"en\">and soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 유명해졌다.\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">famous\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그의 그림을 사랑했고 곧 그는 유명해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들의 사랑이 마티스를 \u003cb class=\"key\">유명 \u003c/b>\u003cb class=\"key\">인사\u003c/b>로 만들었음을 설명합니다. 작품에 대한 호평이 \u003cb class=\"key\">성공\u003c/b>으로 이어졌음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 연결동사 (become)\u003c/span> : become [동사] + famous [형용사/보어] : \"유명해졌다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They loved his paintings, 그들은 그의 그림을 사랑했고. and soon, 곧. he became famous, 그는 유명해졌다.. 이 문장 전체를 해석하면, 그들은 그의 그림을 사랑했고 곧 그는 유명해졌다.","hl":"m"},{"n":37,"text":"사람들이 마티스의 그림을 아주 좋아하게 되었고, 그 덕분에 그가 아주 유명한 화가가 되었다는 기쁜 소식을 전하고 있어요. 그림 실력이 인정받은 결과이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 became famous를 잘 봐야 해요. become은 어떤 상태가 된다는 변화를 나타내는 동사인데, 그 뒤에는 famous처럼 형용사를 써서 유명한 상태가 되었다는 보어 역할을 하게 합니다. 두 번째로 and soon은 앞의 원인과 뒤의 결과를 자연스럽게 이어주는 연결 고리 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Matisse가 ~했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> Matisse\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노인이 되었을\u003c/span>\u003cspan class=\"en\">became an old man,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 병에 걸렸다.\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">ill\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Matisse가 노인이 되었을 때, 그는 병에 걸렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 분위기가 바뀌는 \u003cb class=\"key\">전환점\u003c/b>입니다. 마티스의 인생에 갑작스러운 \u003cb class=\"key\">시련\u003c/b>이 찾아왔음을 나타내며 다음 사건을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(때)\u003c/span> : When [주어] + [동사] : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상태 변화 동사구\u003c/span> : fall [동사] + ill [형용사] : \"병에 걸리다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"When Matisse, Matisse가 ~했을 때. became an old man, 노인이 되었을. he fell ill, 그는 병에 걸렸다.. 이 문장 전체를 해석하면, Matisse가 노인이 되었을 때, 그는 병에 걸렸다.","hl":"m"},{"n":40,"text":"마티스의 평화롭던 인생에 큰 변화가 생기는 부분이에요. 건강했던 화가에게 시련이 닥치면서 이야기의 흐름이 큰 전환점을 맞이하게 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째로 When은 접속사로 쓰여서 마티스가 노인이 되었을 때라는 시간의 부사절을 이끌고 있어요. 두 번째로 fell ill은 단순히 떨어진다는 뜻이 아니라 병에 걸린 상태처럼 나쁜 쪽으로 변화한 것을 강조하는 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 오직 ~할 수밖에 없었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">only\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침대에 눕는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lie \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">bed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 잠자는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 침대에 누워 잠만 잘 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병으로 인해 마티스의 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">활동\u003c/b>이 극도로 제한된 상황입니다. 열정적인 화가에게 찾아온 비극적인 \u003cb class=\"key\">무기력함\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 부사\u003c/span> : could [조동사] + only [부사] + [동사원형] : \"오직 ~할 수밖에 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : [lie (동사원형 1)] + and + [sleep (동사원형 2)] : \"침대에 누워 잠자다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"He could only, 그는 오직 ~할 수밖에 없었다. lie in bed, 침대에 눕는 것. and sleep, 그리고 잠자는 것을.. 이 문장 전체를 해석하면, 그는 침대에 누워 잠만 잘 수 있었다.","hl":"m"},{"n":43,"text":"병 때문에 마티스의 신체적 활동이 매우 작아진 상태를 보여주죠. 화가로서 아무것도 할 수 없는 절망적인 무기력함이 잘 느껴지는 문장이에요.","hl":"mn"},{"n":44,"text":"첫 번째로 could only는 할 수 있는 일이 오직 이것뿐이라는 제한적인 상황을 나타내요. 두 번째로 조동사 뒤에 lie와 sleep이라는 두 동사가 and로 묶여서 똑같은 형태인 동사원형으로 쓰인 병렬 연결 구조를 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그림을 그릴 수 없었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">paint \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전혀.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그림을 전혀 그릴 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마티스에게 삶의 전부였던 \u003cb class=\"key\">그림 \u003c/b>\u003cb class=\"key\">그리기\u003c/b>가 불가능해진 최악의 상태입니다. \u003cb class=\"key\">부정의 \u003c/b>\u003cb class=\"key\">강조\u003c/b>를 통해 그의 깊은 절망을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 강조 구문(not ... at all)\u003c/span> : not [부정어] + [동사] + at all : \"전혀 ~할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"He couldn't paint, 그는 그림을 그릴 수 없었다. at all, 전혀.. 이 문장 전체를 해석하면, 그는 그림을 전혀 그릴 수 없었다.","hl":"m"},{"n":46,"text":"마티스에게 그림 그리기는 인생의 전부였는데, 그걸 못하게 된 최악의 상황을 말하고 있어요. 부정의 강조를 통해 화가가 느끼는 슬픔을 더 깊게 표현하고 있답니다.","hl":"mn"},{"n":47,"text":"여기서는 부정어 not과 문장 끝의 at all이 만나서 전혀 ~하지 않다는 의미가 돼요. 단순히 못하는 게 아니라 아예 불가능하다는 것을 강력하게 강조하는 핵심 구문이니 서술형 대비를 위해 꼭 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 오직 그릴 수 있었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could\u003c/span> only paint\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 꿈속에서만\u003c/span>\u003cspan class=\"en\">in his dreams.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 오직 그의 꿈속에서만 그릴 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병으로 인해 현실에서 \u003cb class=\"key\">그림\u003c/b>을 그릴 수 없는 Matisse의 안타까운 상황을 강조합니다. 꿈속에서라도 그리고 싶어 하는 그의 예술적 \u003cb class=\"key\">열정\u003c/b>이 느껴집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 과거형\u003c/span> : could [조동사] + paint [동사원형] : \"~할 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"He could only paint, 그는 오직 그릴 수 있었다. in his dreams, 그의 꿈속에서만. 이 문장 전체를 해석하면, 그는 오직 그의 꿈속에서만 그릴 수 있었다.","hl":"m"},{"n":49,"text":"현실에서는 몸이 너무 아파서 침대에 누워만 있어야 했기 때문에, 꿈에서만 그림을 그릴 수 있는 상황이에요. 마티스의 그림에 대한 간절한 마음이 잘 나타나 있죠.","hl":"mn"},{"n":50,"text":"조동사 can의 과거형인 could를 써서 과거에 가능했던 능력을 나타내고 있어요. 오직이라는 뜻의 부사 only가 동사 paint 앞에 쓰여서 의미를 한정해주고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Matisse가 눈을 떴을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> Matisse opened his eyes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 눈은 슬픔으로 가득 차 있었다.\u003c/span>\u003cspan class=\"en\">they were full of sadness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 꿈에서 깨어나 현실을 마주했을 때, 그림을 그릴 수 없는 \u003cb class=\"key\">상태\u003c/b>에 대한 깊은 슬픔을 표현합니다. \u003cb class=\"key\">신체적\u003c/b> 고통보다 예술 활동을 할 수 없는 것이 더 큰 고통임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : When [접속사] + Matisse opened [주어+동사] ~, : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">형용사구 관용 표현\u003c/span> : be [동사] + full [형용사] + of [전치사] + sadness [명사] : \"~로 가득 차 있다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When Matisse opened his eyes, Matisse가 눈을 떴을 때. they were full of sadness, 그의 눈은 슬픔으로 가득 차 있었다.. 이 문장 전체를 해석하면, Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다.","hl":"m"},{"n":52,"text":"즐거웠던 꿈에서 깨어나 다시 그림을 못 그리는 현실로 돌아온 마티스의 감정을 묘사해요. 여기서 they는 앞에 나온 마티스의 두 눈을 가리킨답니다.","hl":"mn"},{"n":53,"text":"첫 번째 포인트로 시간을 나타내는 접속사 When이 쓰인 부사절이 문장 앞에 왔어요. 두 번째로 be full of라는 표현은 무엇으로 가득 차다라는 상태를 설명할 때 아주 자주 쓰이는 숙어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다행히도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Luckily\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마 지나지 않아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 앉을 수 있었다.\u003c/span>\u003cspan class=\"en\">he could sit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다행히도, 얼마 지나지 않아 그는 앉을 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 절망적인 상황에서 건강이 \u003cb class=\"key\">회복\u003c/b>되기 시작하는 전환점을 보여줍니다. 다시 그림을 그릴 수 있다는 \u003cb class=\"key\">희망\u003c/b>의 시작을 알리는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 전체 수식 부사\u003c/span> : Luckily [부사], + [주절] : \"운 좋게도, 다행히도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사구(숙어)\u003c/span> : before [전치사/부사] + long [형용사/부사] : \"머지않아, 곧\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Luckily, 다행히도. before long, 얼마 지나지 않아. he could sit, 그는 앉을 수 있었다.. 이 문장 전체를 해석하면, 다행히도, 얼마 지나지 않아 그는 앉을 수 있었다.","hl":"m"},{"n":55,"text":"건강이 조금씩 나아지기 시작했다는 반가운 소식이에요. 침대에만 누워 있다가 스스로 앉을 수 있게 된 것은 아주 큰 변화이자 회복의 신호입니다.","hl":"mn"},{"n":56,"text":"첫 번째로 문장 전체의 분위기를 알려주는 부사 Luckily가 문장 맨 앞에 쓰였고요. 두 번째로 before long은 머지않아 또는 얼마 지나지 않아라는 뜻을 가진 아주 중요한 숙어니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조금 후에, \u003c/span>\u003cspan class=\"en\">A little later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작했다 \u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 그림을 그리기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span> again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조금 후에, 그는 다시 그림을 그리기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병마를 이겨내고 다시 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">활동\u003c/b>을 재개하려는 마티스의 강한 \u003cb class=\"key\">의지\u003c/b>를 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start [타동사] + [to paint (to부정사구/목적어)] : \"그림 그리는 것을 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"A little later, 조금 후에. he started, 그는 시작했다. to paint again, 다시 그림을 그리기. 이 문장 전체를 해석하면, 조금 후에, 그는 다시 그림을 그리기 시작했다.","hl":"m"},{"n":58,"text":"아픈 시기를 지나서 마티스가 다시 붓을 잡게 된 장면이에요. 포기하지 않는 마티스의 예술 활동에 대한 강한 의지를 느낄 수 있는 부분이죠.","hl":"mn"},{"n":59,"text":"여기서 문법 포인트는 첫 번째로 start라는 동사예요. start는 그림을 그리는 것을 시작했다는 의미로 뒤에 to paint처럼 to부정사를 목적어로 취할 수 있고, painting이라는 동명사를 써도 의미가 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 \u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 깨달았다 \u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">realized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 그림을 잘 그릴 수 없다는 것을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">paint \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의욕을 가지고 다시 시작했으나, 신체적 \u003cb class=\"key\">한계\u003c/b>에 부딪히며 느끼는 \u003cb class=\"key\">좌절감\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : realized [타동사] + [that (접속사) + 주어 + 동사 (목적어절)] : \"~라는 것을 깨달았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not... anymore\u003c/span> : not [부정어] ... anymore [부사] : \"더 이상 잘 그릴 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"However, 하지만. he realized, 그는 깨달았다. that he couldn't paint well, 그가 그림을 잘 그릴 수 없다는 것을. anymore, 더 이상. 이 문장 전체를 해석하면, 하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다.","hl":"m"},{"n":61,"text":"의욕은 앞섰지만 몸이 따라주지 않는 안타까운 상황이에요. 마티스가 자신의 신체적 한계를 깨닫고 깊은 좌절감을 느끼는 중요한 전환점입니다.","hl":"mn"},{"n":62,"text":"문법을 보면 첫 번째로 realized 뒤에 나오는 that은 목적어 자리에 문장을 이끌고 오는 접속사예요. 명사절을 만드는 역할을 하죠. 그리고 두 번째로 문장 끝에 있는 anymore는 앞의 not과 함께 쓰여서 더 이상은 할 수 없다는 부정 표현을 완성해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>프랑스의 어린 소년 \u003cb class=\"key\">앙리 \u003c/b>\u003cb class=\"key\">마티스\u003c/b>는 모래와 책에 그림 그리는 것을 즐겼습니다.\u003c/li>\u003cli>성인이 되어 파리에서 화가가 된 그는 \u003cb class=\"key\">성공과 \u003c/b>\u003cb class=\"key\">명성\u003c/b>을 얻으며 행복한 삶을 살았습니다.\u003c/li>\u003cli>노년에 \u003cb class=\"key\">병\u003c/b>에 걸려 더 이상 그림을 그릴 수 없게 되자 깊은 \u003cb class=\"key\">슬픔\u003c/b>에 빠졌습니다.\u003c/li>\u003cli>다시 일어서서 그림을 시작했지만, 예전 같은 \u003cb class=\"key\">기량\u003c/b>을 발휘할 수 없다는 현실을 마주했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Henri Matisse pursued his passion for painting throughout his life, even when facing physical challenges.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">앙리 \u003c/b>\u003cb class=\"key\">마티스\u003c/b>의 어린 시절부터 화가로서의 성공, 그리고 노년의 \u003cb class=\"key\">투병\u003c/b> 중에도 멈추지 않았던 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">열정\u003c/b>을 다루고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"오늘은 앙리 마티스의 일생을 통해 예술에 대한 그의 헌신을 배워보았습니다. 신체적인 한계에 부딪혔을 때 마티스가 느꼈을 감정과 그럼에도 다시 도전한 그 자세가 이 지문의 핵심이에요. 오늘 배운 시간 흐름의 단서들과 주요 숙어들을 다시 한번 복습하면서 지문을 읽어보세요. 고생 많았습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
