<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 8과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 8과 본문2","audioDir":"2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>8과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Nick's New Word: Frindle\u003c/h1>\u003ch2>Nick의 새로운 단어, frindle\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 집에 오는 길에 \u003cb class=\"key\">펜\u003c/b>을 주운 Nick은 그 펜에 \u003cb class=\"key\">frindle\u003c/b>이라는 새 이름을 붙이고, 다음 날 친구들에게 알려 주어 그 주가 끝날 무렵 \u003cb class=\"key\">학급 \u003c/b>\u003cb class=\"key\">친구들\u003c/b> 모두가 그 단어를 쓰게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Nick gives a pen a new name, frindle, and his new word spreads to all of his classmates in a week.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 동아 이 교과서 여덟 단원, 본문 두 번째 지문을 함께 공부해 볼 거예요. 이 이야기는 Nick이라는 친구가 길에서 펜 하나를 주우면서 시작돼요. 그리고 그 펜에 frindle이라는 새로운 이름을 붙이죠. 오늘 우리는 이 새로운 단어가 어떻게 친구들 사이로 퍼져 나가는지 함께 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">언어는 사람들 사이의 \u003cb class=\"key\">약속\u003c/b>이라서, 같은 사물이라도 사회가 합의한 이름으로 부른다. 새로운 사물이나 개념이 등장하면 사람들은 \u003cb class=\"key\">신조어\u003c/b>(neologism, coined word)를 만들어 낸다. 사전에 실린 공식 단어(dictionary word)와 달리, 신조어는 처음에는 한 사람의 장난이나 아이디어에서 출발하는 경우가 많다. 마치 친구들 사이에서 별명(nickname)이 퍼지듯, 재미있는 말은 입에서 입으로 옮겨 가며 순식간에 퍼진다. 결국 단어의 힘은 사전이 아니라 그것을 쓰는 \u003cb class=\"key\">사용자\u003c/b>(speaker, user)에게 있다. 사람들이 쓰기 시작하면 그것이 곧 언어가 되는 것이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 언어는 사람들 사이의 약속이에요. 같은 사물이라도 사회가 합의한 이름으로 부르기로 한 거죠. 그래서 새로운 사물이나 개념이 등장하면 사람들은 신조어를 만들어 내요. 영어로는 neologism, 또는 coined word라고 해요. 사전에 실린 공식 단어와 달리, 신조어는 처음에는 한 사람의 장난이나 아이디어에서 출발하는 경우가 많아요. 친구들 사이에서 별명이 퍼지는 것과 똑같아요. 재미있는 말은 입에서 입으로 옮겨 가면서 순식간에 퍼지죠. 결국 단어의 힘은 사전이 아니라 그것을 쓰는 사용자에게 있어요. 사람들이 쓰기 시작하면 그것이 곧 언어가 되는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>펜을 줍다\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>집에 오는 길에 Nick은 \u003cb class=\"key\">거리\u003c/b>에서 \u003cb class=\"key\">펜\u003c/b> 하나를 보았다. 그리고 그는 그 펜을 \u003cb class=\"key\">주웠다\u003c/b>. 이 장면은 이야기의 출발점이 되는 사건을 제시한다. 특별할 것 없는 평범한 펜이 이후 이야기의 \u003cb class=\"key\">소재\u003c/b>가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>새 이름을 붙이다\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그는 문득 \u003cb class=\"key\">생각\u003c/b>이 하나 떠올랐다. 그리고 펜에게 말하듯 '오늘부터 너의 새 이름은 \u003cb class=\"key\">frindle\u003c/b>이야'라고 선언한다. 여기서 사소한 물건에 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">이름\u003c/b>을 붙이는 발상의 전환이 일어난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>단어가 퍼지다\u003csmall>전개 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">날\u003c/b>, 그는 친구들에게 자신의 새로운 단어에 대해 말했다. 그리고 그 주의 끝 무렵에는 그의 \u003cb class=\"key\">학급 \u003c/b>\u003cb class=\"key\">친구들\u003c/b> 모두가 그 단어를 사용하고 있었다. 한 사람의 아이디어가 \u003cb class=\"key\">집단\u003c/b>으로 번져 나가는 과정을 시간의 흐름에 따라 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일상이 되다\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>친구들은 실제로 그 단어를 써서 '내가 너의 \u003cb class=\"key\">frindle\u003c/b>을 빌릴 수 있을까?'라고 말한다. 또 '나는 너의 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">frindle\u003c/b>이 예쁘다고 생각해'라고 말한다. 이 대사들은 새 단어가 일상의 \u003cb class=\"key\">대화\u003c/b> 속에 완전히 자리 잡았음을 보여 주는 결론이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이 이야기의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 집에 오는 길에 Nick은 거리에서 펜 하나를 보았어요. 그리고 그 펜을 주웠죠. 특별할 것 없는 평범한 펜이지만, 이 펜이 앞으로 이야기의 중요한 소재가 된답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 전환이 일어나요. Nick은 문득 생각이 하나 떠올랐어요. 그리고 펜에게 말하듯 오늘부터 너의 새 이름은 frindle이야, 라고 선언하죠. 사소한 물건에 새 이름을 붙이는 이 발상의 전환이 바로 이 글의 핵심 사건이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 이 단어가 퍼져 나가요. 다음 날, 그는 친구들에게 자신의 새로운 단어에 대해 말했어요. 그리고 그 주의 끝 무렵에는 그의 학급 친구들 모두가 그 단어를 사용하고 있었죠. 한 사람의 아이디어가 집단으로 번지는 과정을 시간의 흐름에 따라 보여 줘요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 친구들이 실제로 그 단어를 써서 말해요. 내가 너의 frindle을 빌릴 수 있을까, 라고 묻고, 나는 너의 빨간 frindle이 예쁘다고 생각해, 라고 말하죠. 이 대사들은 새 단어가 일상의 대화 속에 완전히 자리 잡았음을 보여 줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 집에 오는 길, 다음 날, 그 주의 끝 무렵처럼 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 따라 사건이 차례로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개 방식을 쓴다. Nick이 펜을 줍고 이름을 붙이는 장면에서 시작해, 마지막에는 친구들의 \u003cb class=\"key\">대화\u003c/b>로 끝난다. 글의 핵심인 새 단어의 확산은 마지막 부분인 여섯 번째 문장에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 사건의 결과를 독자가 스스로 따라가며 파악하게 하는 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On the way home (1)\u003c/b>\u003cspan>장면과 시간 제시\u003c/span>\u003cb>From today (4)\u003c/b>\u003cspan>시작 시점 제시\u003c/span>\u003cb>The next day (5)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>By the end of the week (6)\u003c/b>\u003cspan>시간 경과와 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a pen\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the pen\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">frindle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his new word\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 집에 오는 길, 다음 날, 그 주의 끝 무렵처럼 시간 표현을 따라 사건이 차례대로 이어지죠. 그리고 글의 핵심인 새 단어의 확산은 마지막 부분인 여섯 번째 문장에서 드러나요. 그래서 구조로 보면 미괄식이라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 잘 봐 두세요. On the way home은 첫 번째 문장에서 장면과 시간을 열어 주고, The next day는 다섯 번째 문장에서 시간을 넘겨 줘요. By the end of the week는 여섯 번째 문장에서 시간이 얼마나 흘렀고 결과가 무엇인지 알려 주죠. 또 a pen이 the pen으로, 다시 frindle과 his new word, it으로 바뀌는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>on the way home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집에 오는 길에\u003c/span>\u003c/div>\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다 (과거형 saw)\u003c/span>\u003c/div>\u003cdiv>\u003cb>pen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>펜\u003c/span>\u003c/div>\u003cdiv>\u003cb>street\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리, 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다, 줍다 (과거형 picked up)\u003c/span>\u003c/div>\u003cdiv>\u003cb>have\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가지다, (생각이) 떠오르다 (과거형 had)\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 아이디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>from\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~부터\u003c/span>\u003c/div>\u003cdiv>\u003cb>today\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>new\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>새로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이름\u003c/span>\u003c/div>\u003cdiv>\u003cb>the next day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다음 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다 (과거형 told)\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 대하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>word\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단어\u003c/span>\u003c/div>\u003cdiv>\u003cb>by the end of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 끝날 무렵까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>week\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주, 일주일\u003c/span>\u003c/div>\u003cdiv>\u003cb>all\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모든\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학급 친구, 반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>were using\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하고 있었다 (과거진행)\u003c/span>\u003c/div>\u003cdiv>\u003cb>borrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>red\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빨간\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예쁜\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. on the way home은 집에 오는 길에라는 뜻이고, pick up은 집어 들다, 줍다라는 뜻이에요. 그리고 by the end of는 이 끝날 무렵까지라는 표현이에요. borrow는 빌리다라는 뜻이고, pretty는 예쁘다라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">see\u003c/b>\u003cspan class=\"m\">보다, 목격하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">idea\u003c/b>\u003cspan class=\"m\">생각, 아이디어\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thought\u003c/span>\u003cspan class=\"s\">notion\u003c/span>\u003cspan class=\"s\">concept\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">new\u003c/b>\u003cspan class=\"m\">새로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fresh\u003c/span>\u003cspan class=\"s\">novel\u003c/span>\u003cspan class=\"s\">recent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">old\u003c/span>\u003cspan class=\"a\">used\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tell\u003c/b>\u003cspan class=\"m\">말하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">say\u003c/span>\u003cspan class=\"s\">inform\u003c/span>\u003cspan class=\"s\">mention\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">use\u003c/b>\u003cspan class=\"m\">사용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"s\">utilize\u003c/span>\u003cspan class=\"s\">apply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">borrow\u003c/b>\u003cspan class=\"m\">빌리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"s\">use temporarily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lend\u003c/span>\u003cspan class=\"a\">return\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pretty\u003c/b>\u003cspan class=\"m\">예쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">beautiful\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"s\">attractive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘들을 동의어와 반의어로 정리해 볼게요. see는 보다, 목격하다라는 뜻으로 notice, spot, observe와 비슷하고, miss, ignore와는 반대예요. idea는 thought, notion과 가깝고, new는 fresh, novel과 비슷하지만 old와는 반대죠. use는 employ, utilize와 가깝고, pretty는 beautiful, lovely와 비슷하지만 ugly와는 반대예요. borrow는 빌리다라는 뜻이고 그 반대말은 lend, 즉 빌려주다예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 오는 길에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nick은 보았다\u003c/span>\u003cspan class=\"en\">Nick \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펜 하나를\u003c/span>\u003cspan class=\"en\">a pen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거리에서.\u003c/span>\u003cspan class=\"en\">on the street.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">집에 오는 길에, Nick은 거리에서 펜 하나를 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 \u003cb class=\"key\">배경\u003c/b>을 열어 주는 첫 문장이에요. 'On the way home'이 사건이 일어난 \u003cb class=\"key\">때와 \u003c/b>\u003cb class=\"key\">장소\u003c/b>를 알려 주고, Nick이 길에서 펜을 발견하는 장면을 그려 줍니다. 바로 이 펜이 나중에 frindle이 되는 물건이라서, 뒷이야기의 \u003cb class=\"key\">출발점\u003c/b>이 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소·때)\u003c/span> : on the way + [부사 home] → 문장 전체를 꾸미는 [[부사구]] : \"집에 오는 길에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 과거시제(see-saw-seen)\u003c/span> : see [현재] - saw [과거] - seen [과거분사] : \"보았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"On the way home, 집에 오는 길에. Nick saw, Nick은 보았다. a pen, 펜 하나를. on the street, 거리에서.. 이 문장 전체를 해석하면, 집에 오는 길에, Nick은 거리에서 펜 하나를 보았다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 열어 주는 첫 문장이에요. 집에 오는 길에 Nick이 길에서 펜을 발견하는 장면이죠. 바로 이 펜이 나중에 frindle이 되는 물건이라서, 이야기의 출발점이라고 볼 수 있어요.","hl":"mn"},{"n":14,"text":"어법 포인트 두 개만 짚을게요. 첫 번째, On the way home은 '집에 오는 길에'라는 뜻의 전치사구 덩어리예요. home이 부사로 붙어서 때와 장소를 알려 주는 부사구 역할을 하죠. 두 번째, saw는 see의 과거형이에요. see는 see, saw, seen으로 변하는 불규칙 동사이니까 과거형이 saw라는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주웠다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 펜을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그 펜을 주웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 방금 본 펜을 실제로 집어 드는 \u003cb class=\"key\">행동\u003c/b>을 보여 주는 문장이에요. 앞 문장이 '보기'였다면 여기서는 '줍기'로 행동이 한 단계 \u003cb class=\"key\">진전\u003c/b>되죠. 그리고 the pen이라고 다시 가리키는 것을 보면, 앞에 나온 그 펜이라는 연결이 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사)와 목적어 위치\u003c/span> : pick up + [목적어] → 목적어가 [[대명사]]면 pick it up : \"주웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the의 쓰임(앞에 나온 것 재언급)\u003c/span> : the + [앞에서 이미 언급된 명사] : \"그 펜을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He, 그는. picked up, 주웠다. the pen, 그 펜을. 이 문장 전체를 해석하면, 그는 그 펜을 주웠다.","hl":"m"},{"n":16,"text":"Nick이 방금 본 펜을 실제로 집어 드는 행동을 보여 주는 문장이에요. 앞 문장이 보기였다면, 여기서는 줍기로 행동이 한 단계 진전되죠. 그리고 the pen이라고 다시 가리키는 것을 보면 앞에 나온 그 펜이라는 연결이 자연스럽게 이어집니다.","hl":"mn"},{"n":17,"text":"어법 포인트는 두 가지예요. 첫 번째, picked up은 동사와 부사가 합쳐져 '줍다'라는 뜻이 된 구동사예요. 목적어가 the pen처럼 명사면 뒤에 그대로 두지만, it 같은 대명사가 오면 pick it up처럼 사이에 넣어야 한다는 것, 시험에 정말 자주 나와요. 두 번째, the pen에서 the는 앞 문장에 a pen으로 나온 것을 다시 가리킬 때 쓰는 정관사예요. 그래서 '그 펜'이라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가졌다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 생각이 하나 떠올랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick의 머릿속에 새로운 생각이 번뜩 떠오른 순간을 보여 주는 문장이에요. 이 \u003cb class=\"key\">아이디어\u003c/b>가 바로 다음 문장에서 펜에 frindle이라는 새 이름을 붙이는 \u003cb class=\"key\">계기\u003c/b>가 되죠. 그래서 이 문장은 이야기가 본격적으로 움직이기 시작하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have의 과거형(불규칙 변화)\u003c/span> : have [현재] - had [과거] - had [과거분사] : \"떠올렸다, 가졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 have an idea\u003c/span> : have + an idea → [[생각이 떠오르다]] : \"생각이 하나 떠올랐다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He had, 그는 가졌다. an idea, 생각을. 이 문장 전체를 해석하면, 그는 생각이 하나 떠올랐다.","hl":"m"},{"n":19,"text":"Nick의 머릿속에 새로운 생각이 번뜩 떠오른 순간을 보여 줘요. 이 아이디어가 바로 다음 문장에서 펜에 frindle이라는 새 이름을 붙이는 계기가 되죠. 그래서 이 문장은 이야기가 본격적으로 움직이기 시작하는 전환점 역할을 해요.","hl":"mn"},{"n":20,"text":"어법 포인트 두 가지예요. 첫 번째, had는 have의 과거형이에요. have는 have, had, had로 변하는 불규칙 동사라는 것, 기억해 두세요. 두 번째, had an idea는 '생각이 떠오르다'라는 관용 표현이에요. '생각을 가지다'라고 그대로 해석하면 어색하니까 통째로 외워 두면 좋아요. 그리고 idea 앞에는 관사 an이 붙는다는 점도 꼭 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘부터,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">today\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너의 새 이름\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">name \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘frindle’이야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">frindle\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“오늘부터, 너의 새 이름은 ‘frindle’이야.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 펜을 주워 든 뒤 장난삼아 새 \u003cb class=\"key\">이름\u003c/b>을 붙여 주는 장면이에요. 오늘부터 이 펜은 frindle이라고 선언하는 셈이죠. 이 선언이 이후 이야기 전체를 움직이는 \u003cb class=\"key\">출발점\u003c/b>이 되고, \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">단어\u003c/b> frindle의 시작을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간의 시작점)\u003c/span> : [전치사 From] + [시간 명사 today] : \"오늘부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어 your new name] + [동사 is] + [주격보어 frindle] : \"너의 새 이름은 frindle이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"From today, 오늘부터. your new name, 너의 새 이름. is frindle, ‘frindle’이야.. 이 문장 전체를 해석하면, “오늘부터, 너의 새 이름은 ‘frindle’이야.”","hl":"m"},{"n":22,"text":"이 문장은 Nick이 펜을 주워 들고 장난삼아 새 이름을 붙여 주는 장면이에요. 오늘부터 이 펜은 frindle이라고 선언하는 셈이죠. 이 선언이 이후 이야기 전체를 움
