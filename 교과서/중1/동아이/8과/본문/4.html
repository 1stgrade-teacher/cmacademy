<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 8과 본문4 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 8과 본문4","audioDir":"4_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>8과 본문4\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Frindle Becomes a Real Word: Mrs. Granger's True Heart\u003c/h1>\u003ch2>진짜 단어가 된 frindle, 그리고 Granger 선생님의 진심\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>시간이 흘러 스물한 살이 된 Nick은 Granger 선생님에게서 펜과 편지, 그리고 \u003cb class=\"key\">사전\u003c/b>을 받고 자신이 만든 \u003cb class=\"key\">frindle\u003c/b>이 마침내 진짜 단어가 되었음을 알게 된다. 선생님은 처음부터 \u003cb class=\"key\">Nick의 \u003c/b>\u003cb class=\"key\">편\u003c/b>이었지만 이야기를 위해 '나쁜 사람' 역할을 했다고 고백한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>As frindle becomes a real dictionary word, Mrs. Granger reveals that she was on Nick's side from the beginning.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 소설 Frindle의 마지막 부분이에요. 시간이 흘러 어른이 된 Nick이 선생님에게서 소포를 받고, 자신이 만든 단어가 진짜 단어가 되는 순간을 담고 있죠. 요약하면, frindle이 사전에 실리고 선생님의 진심이 밝혀지는 이야기예요. 요지는 선생님이 처음부터 Nick의 편이었다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 장면은 Andrew Clements의 소설 Frindle의 결말 부분이다. 주인공 Nick은 어린 시절 펜을 가리키는 새 말 frindle을 만들었고, 언어 교사 Mrs. Granger는 그것을 막으려 했다. 언어에서 새로운 단어가 자리를 잡는 과정은 사람들이 그 말을 계속 쓰는가에 달려 있다. 사전에 실린다는 것은 그 단어가 공식적으로 인정받는다는 뜻이며, 이를 영어로는 a dictionary entry, 즉 사전 등재라고 부른다. 이런 현상은 우리 생활에서도 흔하다. 예를 들어 친구들 사이에서만 쓰던 줄임말이 어느새 뉴스와 사전에까지 오르는 것과 같은 이치다. 결국 \u003cb class=\"key\">신조어\u003c/b> 하나가 사회를 움직이는 힘이 될 수 있음을 보여 주는 장면이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 이 장면은 Andrew Clements가 쓴 소설 Frindle에서 나온 부분이에요. 주인공 Nick은 어릴 때 펜을 가리키는 새 말 frindle을 만들었고, Granger 선생님은 그걸 막으려 했죠. 언어는 사람들이 계속 쓰면 자연스럽게 새로운 단어로 자리를 잡아요. 사전에 실린다는 건 그 단어가 공식적으로 인정받는다는 뜻이고, 우리말로 하면 신조어가 국어사전에 오르는 것과 같아요. 친구들 사이의 줄임말이 어느새 뉴스와 사전에 오르는 것과 같은 이치죠. 즉 단어 하나가 세상을 바꿀 수 있다는 걸 보여 주는 장면이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>졸업과 망각\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">시간이 \u003c/b>\u003cb class=\"key\">흘러\u003c/b> Nick은 졸업했고, 어린 시절 자신이 만든 \u003cb class=\"key\">frindle\u003c/b>이라는 단어에 대해서는 잊고 지냈다. 한때 세상을 떠들썩하게 했던 사건도 그에게서는 점점 멀어져 갔다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소포 도착\u003csmall>전환 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>그가 \u003cb class=\"key\">스물한 \u003c/b>\u003cb class=\"key\">살\u003c/b>이 되었을 때, Granger 선생님으로부터 \u003cb class=\"key\">소포\u003c/b> 하나가 도착했다. 그 안에는 펜 한 자루와 편지 한 통, 그리고 사전 하나가 들어 있었고, 사전 위에는 '541쪽을 보라'는 \u003cb class=\"key\">쪽지\u003c/b>가 놓여 있었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>사전 속 발견\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>Nick은 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">눈을 \u003c/b>\u003cb class=\"key\">믿을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없었다\u003c/b>. 그는 그 페이지에서 자신이 만든 단어 \u003cb class=\"key\">frindle\u003c/b>이 실제로 실려 있는 것을 발견했다. 오래전의 장난이 현실이 된 순간이었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>선생님의 고백\u003csmall>결론 · 문장 9–14\u003c/small>\u003c/h4>\u003cp>편지에서 선생님은 \u003cb class=\"key\">축하\u003c/b>한다는 말과 함께 frindle이 이제 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 되었다고 전한다. 이어서 자신은 \u003cb class=\"key\">처음부터 \u003c/b>\u003cb class=\"key\">Nick의 \u003c/b>\u003cb class=\"key\">편\u003c/b>이었지만 모든 좋은 이야기에는 '나쁜 사람'이 필요해서 자신이 그 역할을 맡았을 뿐이라며, 이해해 주기를 바란다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 시간이 흘러 Nick이 졸업하고, 자신이 만든 frindle이라는 단어에 대해 잊고 지내게 되죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환이에요. 그가 스물한 살이 되었을 때 Granger 선생님에게서 소포가 도착해요. 그 안에는 펜과 편지, 그리고 사전이 들어 있었고, 사전 위에는 오백사십일 쪽을 보라는 쪽지가 놓여 있었죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거예요. Nick은 자신의 눈을 믿을 수 없었고, 그 페이지에서 자신이 만든 단어 frindle을 발견해요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 편지에서 선생님은 축하한다며 frindle이 이제 진짜 단어가 되었다고 말해요. 그리고 자신은 처음부터 Nick의 편이었지만, 모든 좋은 이야기에는 나쁜 사람이 필요해서 자기가 그 역할을 맡았을 뿐이라고 고백하죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 Nick의 졸업에서 시작해 스물한 살의 소포, 사전 속 발견, 편지의 고백으로 \u003cb class=\"key\">시간순\u003c/b>으로 이어진다. 핵심 진실인 '선생님은 처음부터 Nick의 편이었다'는 맨 마지막 \u003cb class=\"key\">편지\u003c/b>에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 그래서 앞부분의 사건들은 마지막 반전을 위한 준비에 해당한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (3)\u003c/b>\u003cspan>시간 제시\u003c/span>\u003cb>But (12)\u003c/b>\u003cspan>전환·반전\u003c/span>\u003cb>from the beginning (11)\u003c/b>\u003cspan>진실 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">frindle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the word frindle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a real word\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>겉으로 드러난 태도 (bad guy)\u003c/th>\u003cth>숨겨 온 진심 (on your side)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>규칙을 지키라며 단어 사용을 반대함\u003c/td>\u003ctd>처음부터 Nick을 응원하고 지지함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이야기 속 '나쁜 사람' 역할을 자처함\u003c/td>\u003ctd>진짜 편에 선 조력자였음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간의 흐름을 따라 사건이 진행되는 시간순 구조예요. 동시에 마지막 편지에서 반전이 일어나죠. 핵심 진실인 선생님의 진심은 글의 맨 끝에서 드러나기 때문에 미괄식이라고 볼 수 있어요. 그래서 마지막 문장까지 긴장을 놓지 않고 읽어야 해요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 Time passed는 시간의 경과를 알려 주고, 세 번째 문장의 When은 사건이 일어난 시점을 제시해요. 열두 번째 문장의 But은 단순한 연결이 아니라 앞의 내용을 뒤집는 반전 신호라는 점을 꼭 기억하세요. 또 처음부터라는 뜻의 from the beginning은 선생님의 진심을 강조하는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Time passed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 흘렀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>졸업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(나이가) 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>package\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소포, 꾸러미\u003c/span>\u003c/div>\u003cdiv>\u003cb>letter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편지\u003c/span>\u003c/div>\u003cdiv>\u003cb>dictionary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사전\u003c/span>\u003c/div>\u003cdiv>\u003cb>note\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쪽지, 메모\u003c/span>\u003c/div>\u003cdiv>\u003cb>page\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(책의) 쪽, 페이지\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eye\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>word\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단어\u003c/span>\u003c/div>\u003cdiv>\u003cb>dear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친애하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>congratulations\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축하\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진짜의, 실제의\u003c/span>\u003c/div>\u003cdiv>\u003cb>on one's side\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 편이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beginning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>처음, 시작\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad guy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나쁜 사람, 악당\u003c/span>\u003c/div>\u003cdiv>\u003cb>play\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(역할을) 하다, 맡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개를 짚어 볼게요. receive는 받다, package는 소포, note는 쪽지라는 뜻이에요. 그리고 believe one's eyes는 눈을 의심하다, on one's side는 편이 되다라는 뜻이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">forget\u003c/b>\u003cspan class=\"m\">잊다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overlook\u003c/span>\u003cspan class=\"s\">neglect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remember\u003c/span>\u003cspan class=\"a\">recall\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">receive\u003c/b>\u003cspan class=\"m\">받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">send\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">distrust\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">real\u003c/b>\u003cspan class=\"m\">진짜의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beginning\u003c/b>\u003cspan class=\"m\">처음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">start\u003c/span>\u003cspan class=\"s\">origin\u003c/span>\u003cspan class=\"s\">outset\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">conclusion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hope\u003c/b>\u003cspan class=\"m\">바라다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wish\u003c/span>\u003cspan class=\"s\">desire\u003c/span>\u003cspan class=\"s\">expect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">despair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. forget은 잊다이고, remember와 recall이 반대말이에요. receive는 get, obtain과 비슷하고 send, give와 반대죠. real은 actual, genuine과 가깝고 fake, false와 반대예요. understand는 comprehend, grasp와 비슷하고 misunderstand와 반대라는 것도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흘렀고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Time \u003c/span>\u003cspan class=\"tgt\">passed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Nick은 졸업했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Nick \u003c/span>\u003cspan class=\"tgt\">graduated.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 흘렀고 Nick은 졸업했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 흐르면서 Nick이 자라 졸업하는 장면을 담은 문장이에요. \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>과 Nick의 성장을 함께 보여 주면서, 뒤에 이어질 선생님의 편지 이야기로 넘어가는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b>의 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 pass의 과거형(완전한 문장)\u003c/span> : [주어 Time] + [passed (자동사 과거형)] : \"시간이 흘렀다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 절과 절 연결\u003c/span> : [절1 Time passed] + [and] + [절2 Nick graduated] : \"그리고 Nick은 졸업했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Time passed, 시간이 흘렀고. and Nick graduated, 그리고 Nick은 졸업했다.. 이 문장 전체를 해석하면, 시간이 흘렀고 Nick은 졸업했다.","hl":"m"},{"n":13,"text":"이 문장은 시간이 흐르면서 Nick이 자라서 졸업하는 장면을 보여 줘요. 앞부분은 시간의 흐름을, 뒷부분은 Nick의 성장을 담고 있어서 이야기의 배경이 바뀌는 신호가 됩니다.","hl":"mn"},{"n":14,"text":"먼저 passed를 보세요. pass는 지나가다라는 뜻의 자동사라서 목적어 없이 주어 Time만으로 완전한 문장이 돼요. 그리고 and는 두 개의 절을 대등하게 이어 주는 등위접속사예요. 그래서 시간이 흘렀다는 절과 Nick이 졸업했다는 절이 나란히 연결되는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 잊었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">forgot\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘frindle’에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">frindle\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 ‘frindle’에 대해 잊었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 한때 만들어 낸 말인 frindle을 잊었다는 뜻이에요. 앞에서 만든 단어가 시간이 지나며 자연스럽게 잊히는 상황을 보여 주고, 나중에 소포가 오면서 그 단어가 다시 떠오르는 \u003cb class=\"key\">복선\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형(forget-forgot)\u003c/span> : [forget (원형)] → [forgot (과거형)] : \"잊었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 + 전치사 about 구문\u003c/span> : [forget] + [about + 명사] : \"‘frindle’에 대해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He forgot, 그는 잊었다. about frindle, ‘frindle’에 대해. 이 문장 전체를 해석하면, 그는 ‘frindle’에 대해 잊었다.","hl":"m"},{"n":16,"text":"이 문장은 Nick이 frindle이라는 단어를 잊었다는 뜻이에요. 앞에서 만든 단어가 시간이 지나면서 잊히는 상황을 보여 주고, 뒤에 소포가 오면서 다시 떠오르는 복선이 됩니다.","hl":"mn"},{"n":17,"text":"먼저 forgot을 보세요. forget은 규칙 변화를 하지 않는 불규칙 동사라서 과거형이 forgot이 됩니다. 다음으로 about frindle을 보면, forget 뒤에 전치사 about이 붙어서 어떤 대상에 대해 잊다는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 21살이 되었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">21\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 소포 하나를 받았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">received \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">package\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Granger 선생님으로부터.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">Mrs. \u003c/span>\u003cspan class=\"tgt\">Granger\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 21살이 되었을 때, 그는 Granger 선생님으로부터 소포 하나를 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 21살이 된 시점에 Granger 선생님에게서 소포를 받는 장면이에요. 잊혔던 frindle이 다시 등장하는 이야기의 \u003cb class=\"key\">전환점\u003c/b>이 되고, 선생님이 그를 계속 기억하고 있었다는 사실을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절(When) + turn + 나이\u003c/span> : [When + 주어 + 동사], [주절] : \"그가 21살이 되었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문장(주어 + 동사 + 목적어)\u003c/span> : [he (주어)] + [received (동사)] + [a package (목적어)] : \"그는 소포 하나를 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 from (출처·보낸 사람)\u003c/span> : [명사] + [from + 사람] : \"Granger 선생님으로부터\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When he turned 21, 그가 21살이 되었을 때. he received a package, 그는 소포 하나를 받았다. from Mrs. Granger, Granger 선생님으로부터.. 이 문장 전체를 해석하면, 그가 21살이 되었을 때, 그는 Granger 선생님으로부터 소포 하나를 받았다.","hl":"m"},{"n":19,"text":"이 문장은 Nick이 21살이 된 시점에 Granger 선생님에게서 소포를 받는 장면이에요. 잊혔던 frindle이 다시 등장하는 이야기의 전환점이 되고, 선생님이 그를 계속 기억하고 있었다는 사실을 보여 줍니다.","hl":"mn"},{"n":20,"text":"먼저 When he turned 21을 보세요. When은 시간 부사절을 이끌고, turn은 나이가 되다라는 뜻으로 turn 다음에 숫자가 바로 옵니다. 그리고 콤마 뒤 주절에서 그는 소포를 받았다는 핵심 사건이 나와요. 마지막으로 from Mrs. Granger는 전치사 from이 소포가 누구에게서 왔는지 알려 주는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가지고 있었다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펜 한 자루, 편지 한 통\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pen, \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">letter, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사전 하나를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">dictionary\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것에는 펜 한 자루와 편지 한 통, 그리고 사전 하나가 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Mrs. Granger가 보낸 소포 안에 무엇이 들어 있었는지 하나씩 소개하는 문장이에요. 앞 문장에서 Nick이 소포를 받았다고 했으니, 여기서는 그 \u003cb class=\"key\">소포\u003c/b>의 내용물을 차례로 알려 주는 흐름이죠. 뒤에서 이 사전이 결정적인 단서가 되기 때문에 아주 중요한 \u003cb class=\"key\">복선\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유의 타동사 had (have의 과거형)\u003c/span> : [주어] + had + [목적어] : \"그것은 ~을 가지고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B, and C)\u003c/span> : [명사 A], [명사 B], and [명사 C] : \"펜 한 자루, 편지 한 통, 그리고 사전 하나\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It had, 그것은 가지고 있었다. a pen, a letter, 펜 한 자루, 편지 한 통. and a dictionary, 그리고 사전 하나를. 이 문장 전체를 해석하면, 그것에는 펜 한 자루와 편지 한 통, 그리고 사전 하나가 있었다.","hl":"m"},{"n":22,"text":"이 문장은 Mrs. Granger가 보낸 소포 안에 무엇이 들어 있었는지 하나씩 알려 주는 문장이에요. 앞에서 Nick이 소포를 받았다고 했으니, 여기서는 그 소포의 내용물을 차례로 소개하는 흐름이죠. 그리고 여기 나오는 사전이 뒤에서 아주 중요한 복선이 된다는 것도 기억해 두세요.","hl":"mn"},{"n":23,"text":"먼저 had는 '먹었다'나 '했다'가 아니라 '가지고 있었다'라는 소유의 뜻이에요. 그리고 a pen, a letter, and a dictionary처럼 세 개의 명사를 콤마와 and로 나란히 연결한 것을 병렬 구조라고 해요. 나열할 때는 마지막 두 개 사이에만 and를 넣는다는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쪽지가 하나\u003c/span>\u003cspan class=\"en\">a note\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사전 위에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dictionary\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사전 위에는 쪽지가 하나 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사전 위에 쪽지가 놓여 있었다는 사실을 전해 줘요. 바로 다음 문장에서 그 쪽지에 적힌 말이 나오기 때문에, \u003cb class=\"key\">시선\u003c/b>을 쪽지로 옮겨 주는 다리 역할을 하는 문장이죠. 짧지만 다음 내용을 예고하는 중요한 \u003cb class=\"key\">연결\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There be 구문 (존재 구문)\u003c/span> : There + be동사 + [주어] : \"~이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법 (위치)\u003c/span> : [명사] + on + [장소] : \"사전 위에(있는)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"There was, 있었다. a note, 쪽지가 하나. on the dictionary, 사전 위에는. 이 문장 전체를 해석하면, 사전 위에는 쪽지가 하나 있었다.","hl":"m"},{"n":25,"text":"이 문장은 사전 위에 쪽지가 놓여 있었다는 사실을 전해 줘요. 바로 다음 문장에서 그 쪽지에 적힌 말이 나오기 때문에, 독자의 시선을 쪽지로 옮겨 주는 다리 역할을 하는 문장이죠. 짧지만 다음 내용을 예고하는 중요한 연결 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 There was는 '무엇이 있다'를 표현하는 존재 구문이에요. 이때 진짜 주어는 be동사 뒤에 오는 a note이고, There는 '거기'라는 뜻이 아니라 주어 자리를 채워 주는 유도어라는 점이 중요해요. 두 번째로 on the dictionary에서 전치사 on은 '사전 위에'라는 위치를 나타내면서 앞의 명사 a note를 꾸며 줘요. 그래서 '사전 위에 있는 쪽지'라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보거라\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">See\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">541쪽을\u003c/span>\u003cspan class=\"en\">page 541.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“541쪽을 보거라.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사전에 붙어 있던 쪽지에 적힌 내용이에요. Mrs. Granger가 Nick에게 사전의 특정 쪽을 펼쳐 보라고 \u003cb class=\"key\">지시\u003c/b>하는 아주 짧은 명령문이죠. 이 한마디가 Nick을 사전 541쪽으로 이끌면서 이야기의 \u003cb class=\"key\">전환점\u003c/b>을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형으로 시작)\u003c/span> : [동사원형] + [목적어] : \"보거라\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"See, 보거라. page 541.\", 541쪽을. 이 문장 전체를 해석하면, “541쪽을 보거라.”","hl":"m"},{"n":28,"text":"이 문장은 사전에 붙어 있던 쪽지에 적힌 내용이에요. Mrs. Granger가 Nick에게 사전의 특정 쪽을 펼쳐 보라고 지시하는 아주 짧은 명령문이죠. 이 한마디가 Nick을 사전 오백사십일 쪽으로 이끌면서 이야기의 전환점을 만들어 줍니다.","hl":"mn"},{"n":29,"text":"먼저 See로 문장이 시작하는데, 이것은 주어 You를 생략한 명령문이에요. 명령문은 동사원형으로 시작한다는 것이 핵심 규칙이에요. 그래서 '네가 보거라'라는 뜻이 되고, 뒤에 오는 page five hundred forty-one이 그 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nick은\u003c/span>\u003cspan class=\"en\">Nick\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿을 수 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 눈을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">eyes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nick은 자신의 눈을 믿을 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 사전 541쪽에서 ‘frindle’이라는 단어를 직접 보고 놀라는 장면이에요. 눈으로 본 것을 \u003cb class=\"key\">믿을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 것은 너무 뜻밖이라 현실 같지 않다는 \u003cb class=\"key\">놀라움\u003c/b>을 나타내죠. 앞에서 ‘See page 541’이라는 쪽지가 나왔고, 이제 그 페이지에 적힌 것을 확인하는 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>의 절정 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정 + 관용표현 believe one's eyes\u003c/span> : [주어] + [[couldn't believe one's eyes]] (조동사 과거형 + 동사원형 + 목적어) : \"자신의 눈을 믿을 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Nick, Nick은. couldn't believe, 믿을 수 없었다. his eyes, 자신의 눈을. 이 문장 전체를 해석하면, Nick은 자신의 눈을 믿을 수 없었다.","hl":"m"},{"n":31,"text":"여기는 Nick이 사전 오백사십일 쪽에서 frindle이라는 단어를 직접 보고 깜짝 놀라는 장면이에요. 눈으로 본 것을 믿을 수 없다는 건, 너무 뜻밖이라 현실 같지 않다는 놀라움을 나타내는 말이죠. 앞에서 See page 오백사십일이라는 쪽지가 나왔으니, 그 페이지를 확인하는 이 부분이 글의 절정이라는 흐름도 같이 기억해 두세요.","hl":"mn"},{"n":32,"text":"첫 번째, couldn't believe his eyes에서 could는 can의 과거형이에요. 여기서는 과거의 능력이 아니라 믿을 수 없다는 불가능의 느낌으로 쓰였죠. 두 번째, believe one's eyes는 자신의 눈을 믿다, 즉 눈으로 본 것을 사실로 받아들이다라는 관용 표현이에요. 그래서 이 덩어리는 자신의 눈을 믿을 수 없었다라고 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 페이지에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">page\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 발견했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 단어를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">word \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘frindle’이라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">frindle\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 페이지에서, 그는 ‘frindle’이라는 단어를 발견했다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쪽지가 가리킨 541쪽에서 Nick이 마침내 \u003cb class=\"key\">frindle\u003c/b>이라는 단어를 찾아내는 장면이에요. 자신이 만든 말이 사전에 실린 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 되었다는 사실을 확인하는 순간이죠. 바로 앞 문장의 \u003cb class=\"key\">놀라움\u003c/b>에 이어, 그 놀라움의 이유가 구체적으로 밝혀지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문두 도치(부사구 강조)\u003c/span> : [[On that page]], + [주어] + [동사] ~ (전치사구 + 주어 + 동사) : \"그 페이지에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">find의 과거형(불규칙 동사)\u003c/span> : [주어 he] + [[found (find의 과거형)]] + [목적어 the word frindle] : \"발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격 관계(명사 + 명사)\u003c/span> : [the word] + [[frindle (동격 명사)]] : \"‘frindle’이라는 단어\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"On that page, 그 페이지에서. he found, 그는 발견했다. the word, 그 단어를. frindle!, ‘frindle’이라는. 이 문장 전체를 해석하면, 그 페이지에서, 그는 ‘frindle’이라는 단어를 발견했다!","hl":"m"},{"n":34,"text":"쪽지가 가리킨 오백사십일 쪽에서 Nick이 마침내 frindle이라는 단어를 찾아내는 장면이에요. 자신이 만든 말이 사전에 실린 진짜 단어가 되었다는 걸 확인하는 순간이죠. 바로 앞 문장의 놀라움에 이어, 그 놀라움의 이유가 구체적으로 밝혀지는 문장이에요.","hl":"mn"},{"n":35,"text":"첫 번째, On that page처럼 장소를 나타내는 전치사구를 문장 앞에 두면 바로 그 페이지에서라는 강조 효과가 생겨요. 두 번째, found는 find의 과거형이고 finded가 아니라는 점, 꼭 기억하세요. 세 번째, the word frindle은 the word와 frindle이 동격으로 나란히 놓여서 frindle이라는 단어라고 해석한다는 점도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nick에게,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Dear \u003c/span>\u003cspan class=\"tgt\">Nick,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축하한다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Congratulations!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nick에게, 축하한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Mrs. Granger가 Nick에게 보낸 \u003cb class=\"key\">편지\u003c/b>의 첫 인사말이에요. 자신이 그토록 막았던 \u003cb class=\"key\">frindle\u003c/b>이 진짜 단어가 된 것을 축하해 주는 장면이죠. 앞에서 ‘bad guy’ 역할을 했다던 Mrs. Granger의 진심이 드러나기 시작하는 \u003cb class=\"key\">전환점\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지의 호칭 표현(서두 인사)\u003c/span> : [[Dear]] + [수신자 이름] + 쉼표 : \"Nick에게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감탄문(축하 인사 표현)\u003c/span> : [[Congratulations]]! (복수형 명사 + 느낌표) : \"축하한다!\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Dear Nick, Nick에게. Congratulations!, 축하한다!. 이 문장 전체를 해석하면, Nick에게, 축하한다!","hl":"m"},{"n":37,"text":"이 문장은 Mrs. Granger가 Nick에게 보낸 편지의 첫 인사말이에요. 자신이 그토록 막았던 frindle이 진짜 단어가 된 것을 축하해 주는 장면이죠. 앞에서 bad guy 역할을 했다던 Mrs. Granger의 진심이 드러나기 시작하는 전환점이라는 점도 함께 봐 두세요.","hl":"mn"},{"n":38,"text":"첫 번째, Dear Nick에서 Dear는 편지를 시작할 때 받는 사람 이름 앞에 붙여서 Nick에게라고 인사하는 편지 형식이에요. 두 번째, Congratulations는 항상 복수형으로 쓰는 감탄문이자 축하 인사말이고, 뒤에 대상을 붙일 때는 to를 써서 Congratulations to you처럼 말한다는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">frindle은\u003c/span>\u003cspan class=\"en\">Frindle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜 단어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘frindle’은 이제 진짜 단어야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mrs. Granger가 사전을 통해 \u003cb class=\"key\">frindle\u003c/b>이 공식적으로 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 되었음을 알려 주는 문장이에요. 닉이 만든 장난 같은 단어가 \u003cb class=\"key\">사전\u003c/b>에 실렸다는 점에서 이야기의 반전을 보여 주죠. 그래서 앞의 'See page 541'과 자연스럽게 이어지는 결말의 핵심 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : Frindle[주어] + is[be동사] + a real word[주격보어(명사)] : \"frindle은 이제 진짜 단어이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 위치(be동사 뒤)\u003c/span> : be동사 + [부사 now] + 주격보어 : \"이제\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Frindle, frindle은. is now, 이제 ~이다. a real word, 진짜 단어. 이 문장 전체를 해석하면, ‘frindle’은 이제 진짜 단어야.","hl":"m"},{"n":40,"text":"여기서 frindle이 이제 진짜 단어라고 하죠. 사전에 실렸다는 건 공식적으로 인정받았다는 뜻이에요. 닉이 만든 장난 같은 단어가 진짜 단어가 된 반전을 보여 주는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 be동사 뒤에 명사가 오는 이형식 문장이에요. frindle과 a real word가 등호로 연결된다고 생각하면 쉬워요. be동사 뒤에서 주어를 설명해 주는 이 명사를 주격보어라고 불러요. 두 번째로 now 같은 시간 부사는 be동사 뒤에 온다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 편이었어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">side\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beginning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 처음부터 네 편이었단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mrs. Granger가 자신이 계속 닉의 편이었다고 밝히는 문장이에요. 바로 앞에서 'bad guy' 역할을 했다는 말과 대비되면서 그녀의 진심을 보여 주는 \u003cb class=\"key\">반전\u003c/b>이죠. \u003cb class=\"key\">from \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">beginning\u003c/b>이라는 표현으로 처음부터 한결같았음을 강조하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(be on one's side)\u003c/span> : be동사 + on + [소유격] + side = ~의 편이다 : \"네 편이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시점)\u003c/span> : 전치사 from + 명사구 the beginning : \"처음부터\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I, 나는. was on your side, 네 편이었어. from the beginning, 처음부터. 이 문장 전체를 해석하면, 나는 처음부터 네 편이었단다.","hl":"m"},{"n":43,"text":"Mrs. Granger가 자기가 계속 닉의 편이었다고 밝히는 문장이에요. 앞에서 나쁜 사람 역할을 했다는 말과 대비되면서 그녀의 진심이 드러나죠. from the beginning이라는 표현으로 처음부터 한결같았다는 걸 강조하고 있어요.","hl":"mn"},{"n":44,"text":"먼저 was on your side는 네 편이었다라는 관용 표현이에요. on 다음에 소유격이 오면 누구의 편인지를 나타내는 거죠. 그리고 from the beginning은 처음부터라는 시점을 알려 주는 전치사구예요. be동사를 쓴 이유는 그때가 과거 시점이기 때문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 좋은 이야기에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">story \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요하지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">needs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘나쁜 사람’이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">&quot;bad \u003c/span>\u003cspan class=\"tgt\">guy.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 모든 좋은 이야기에는 ‘나쁜 사람’이 필요하지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 좋은 이야기에는 갈등을 만들어 주는 '나쁜 사람'이 꼭 필요하다는 뜻이에요. Mrs. Granger는 자기가 그 \u003cb class=\"key\">악역\u003c/b>을 맡았다고 말하면서, 닉을 미워한 게 아니라는 걸 돌려서 전하는 거죠. 이 문장이 다음 문장의 \u003cb class=\"key\">반전\u003c/b>으로 이어지는 다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">every + 단수명사 + 단수동사(수 일치)\u003c/span> : every + [단수명사] + [단수동사] : \"모든 좋은 이야기는 필요로 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문장의 목적어(명사구)\u003c/span> : need[타동사] + [a &quot;bad guy&quot;(목적어)] : \"‘나쁜 사람’을\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"But, 하지만. every good story, 모든 좋은 이야기에는. needs, 필요하지. a \"bad guy.\", ‘나쁜 사람’이. 이 문장 전체를 해석하면, 하지만 모든 좋은 이야기에는 ‘나쁜 사람’이 필요하지.","hl":"m"},{"n":46,"text":"좋은 이야기에는 갈등을 만드는 나쁜 사람이 꼭 필요하다는 뜻이에요. Mrs. Granger는 자기가 그 악역을 맡았다고 말하면서 닉을 미워한 게 아니라는 걸 돌려서 전하는 거죠. 이 문장이 바로 다음 문장의 반전으로 이어지는 다리 역할을 해요.","hl":"mn"},{"n":47,"text":"첫 번째로 every 뒤에는 항상 단수명사가 오고 동사도 단수로 맞춰요. 그래서 stories가 아니라 story, need가 아니라 needs가 쓰인 거예요. 두 번째로 need는 여기서 필요로 하다는 뜻의 타동사로 쓰여서 뒤에 목적어가 왔어요. 그 목적어가 바로 a bad guy, 즉 나쁜 사람이라는 명사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">했단다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">played\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 역할을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">role\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 그 역할을 했단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 bad guy, 즉 '악역'을 자신이 직접 맡았다고 밝히는 문장이에요. 좋은 이야기에는 악역이 필요하다는 \u003cb class=\"key\">비유\u003c/b>를 이어 받아, 선생님이 그 \u003cb class=\"key\">악역\u003c/b>을 \u003cb class=\"key\">자처\u003c/b>했음을 말하고 있어요. 그래서 이 문장은 선생님의 희생과 진심을 드러내는 연결 고리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제 (규칙동사 play + -ed)\u003c/span> : [주어 I] + [동사 played (과거형)] + [목적어 that role] : \"했단다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 that (that + 명사)\u003c/span> : that [지시형용사] + [단수명사 role] = '그 역할' : \"그 역할\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"I, 나는. played, 했단다. that role, 그 역할을. 이 문장 전체를 해석하면, 내가 그 역할을 했단다.","hl":"m"},{"n":49,"text":"이 문장은 앞에서 말한 bad guy 역할을 선생님 자신이 직접 맡았다고 밝히는 부분이에요. 좋은 이야기에는 악역이 필요하다는 비유를 그대로 이어 받아서, 자기가 그 악역을 자처했다는 뜻이죠. 그래서 이 문장은 선생님의 희생과 진심을 보여 주는 연결 고리라고 볼 수 있어요.","hl":"mn"},{"n":50,"text":"첫 번째로 that role을 보세요. 여기서 that은 명사 앞에서 특정한 대상을 콕 집어 가리키는 지시형용사예요. 그래서 뒤에 오는 명사 role을 꾸며 그 역할이라는 뜻이 되죠. 두 번째로 played는 이미 끝난 과거의 일을 나타내는 과거시제예요. 동사 play에 -ed를 붙여서 played가 되었고, 뒤에 목적어 that role이 온다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바란다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hope\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 이해하기를...\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네가 이해해 주기를 바란다...\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지의 마지막 문장으로, 악역을 맡았던 진짜 이유를 학생이 \u003cb class=\"key\">이해해 \u003c/b>\u003cb class=\"key\">주기\u003c/b>를 바라는 선생님의 \u003cb class=\"key\">진심\u003c/b>이 담겨 있어요. 끝의 점 세 개는 말을 다 잇지 못한 \u003cb class=\"key\">여운\u003c/b>을 남기면서 감정이 절정에 이르는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절을 목적어로 취하는 타동사 hope\u003c/span> : hope [타동사] + [that + 주어 + 동사 (명사절/목적어)] : \"바란다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절\u003c/span> : that [접속사] + [주어 you + 동사 understand] : \"네가 이해하기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 안의 주어 + 동사 (완전한 절)\u003c/span> : [that + 주어 you + 동사 understand] : \"네가 이해하다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"I, 나는. hope, 바란다. that you understand, 네가 이해하기를.... 이 문장 전체를 해석하면, 네가 이해해 주기를 바란다...","hl":"m"},{"n":52,"text":"이 문장은 편지의 마지막 부분으로, 악역을 맡았던 진짜 이유를 학생이 이해해 주기를 바라는 선생님의 진심이 담겨 있어요. 끝에 붙은 점 세 개는 말을 다 하지 못한 여운을 남기면서 감정이 절정에 이르는 부분이죠.","hl":"mn"},{"n":53,"text":"첫 번째로 hope를 보세요. hope는 무언가를 바란다는 뜻의 타동사라서 뒤에 목적어가 필요한데, 여기서는 접속사 that이 이끄는 명사절이 그 목적어로 왔어요. 두 번째로 that절 안을 보면 주어 you와 동사 understand가 모두 갖춰진 완전한 절이 들어 있어요. 이때 understand는 목적어 없이 쓰여서 네가 이해하다라는 뜻이 되고, 이 절 전체가 네가 이해해 주기를 바란다라는 의미를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>시간이 흘러 Nick은 졸업하고 자신이 만든 \u003cb class=\"key\">frindle\u003c/b>이라는 단어를 잊고 지냈다.\u003c/li>\u003cli>스물한 살이 된 그는 Granger 선생님에게서 펜, 편지, \u003cb class=\"key\">사전\u003c/b>이 담긴 소포를 받고 사전의 한 페이지에서 frindle을 발견한다.\u003c/li>\u003cli>\u003cb class=\"key\">frindle\u003c/b>은 마침내 사전에 실린 진짜 단어가 되었다.\u003c/li>\u003cli>선생님은 처음부터 \u003cb class=\"key\">Nick의 \u003c/b>\u003cb class=\"key\">편\u003c/b>이었지만 모든 좋은 이야기에는 '나쁜 사람'이 필요해서 그 역할을 맡았을 뿐이라고 고백한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>As frindle becomes a real dictionary word, Mrs. Granger reveals that she was on Nick's side from the beginning.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">시간이 흘러 스물한 살이 된 Nick은 Granger 선생님에게서 펜과 편지, 그리고 \u003cb class=\"key\">사전\u003c/b>을 받고 자신이 만든 \u003cb class=\"key\">frindle\u003c/b>이 마침내 진짜 단어가 되었음을 알게 된다. 선생님은 처음부터 \u003cb class=\"key\">Nick의 \u003c/b>\u003cb class=\"key\">편\u003c/b>이었지만 이야기를 위해 '나쁜 사람' 역할을 했다고 고백한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 글의 핵심은 frindle이 마침내 진짜 단어가 되었다는 사실, 그리고 선생님이 처음부터 Nick의 편이었다는 고백이에요. 겉으로는 나쁜 사람처럼 보였지만 진심은 응원이었다는 반전을 꼭 기억하세요. 오늘도 끝까지 잘 따라와 줘서 고마워요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
