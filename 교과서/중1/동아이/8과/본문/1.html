<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 8과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 8과 본문1","audioDir":"1_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>8과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>How Do Words Get Their Meanings?\u003c/h1>\u003ch2>단어는 어떻게 뜻을 갖게 될까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 닉 앨런이 영어 수업에서 \u003cb class=\"key\">단어의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>가 어떻게 생기는지 선생님께 질문했고, 선생님은 사람들이 \u003cb class=\"key\">합의\u003c/b>로 뜻을 정한다고 답했지만 닉은 \u003cb class=\"key\">동의\u003c/b>하지 않았다고 생각한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Word meanings come from the agreement of people, not from the words themselves.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 닉 앨런이 영어 시간에 선생님께 단어의 의미에 대해 질문하는 지문을 함께 공부할 거예요. 아주 짧은 대화문이지만, 단어의 뜻이 어디서 오는지 생각하게 하는 좋은 글이에요. 요약하면 단어의 뜻은 사람들이 함께 정한 약속이라는 거고, 요지는 사람들이 단어에 의미를 부여한다는 것이에요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">먼저 배경지식을 짚어 볼게요. 언어학에서는 단어와 그 뜻 사이에 필연적인 관계가 없다고 봐요. 개를 가리키는 소리가 꼭 dog여야 할 이유는 없고, 사람들이 그렇게 쓰기로 약속했기 때문에 dog가 개가 되는 거예요. 이렇게 소리와 뜻이 임의로 연결되는 성질을 \u003cb class=\"key\">자의성\u003c/b>이라고 부르고, 영어로는 arbitrariness of the sign이라고 해요. 우리가 친구와 손을 들기로 약속하면 그 손짓이 인사가 되듯이, 단어도 사회가 함께 정한 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">약속\u003c/b>인 셈이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 언어학에서는 단어와 그 뜻 사이에 꼭 필요한 관계가 없다고 봐요. 개를 가리키는 소리가 반드시 dog여야 할 이유는 없고, 사람들이 그렇게 쓰기로 약속했기 때문에 dog가 개가 되는 거예요. 이렇게 소리와 뜻이 임의로 연결되는 성질을 자의성이라고 부르고, 영어로는 arbitrariness of the sign이라고 해요. 우리가 친구와 손을 들기로 약속하면 그 손짓이 인사가 되듯이, 단어도 사회가 함께 정한 사회적 약속인 셈이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인물 소개\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>닉 앨런이 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">학년\u003c/b> 학생으로 등장합니다. 평범한 초등학생인 그가 영어 시간에 어떤 일을 겪는지 보여 주려는 \u003cb class=\"key\">도입부\u003c/b>예요. 인물과 배경을 먼저 제시하며 이야기를 엽니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>질문 던지기\u003csmall>문제 제기 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>닉이 선생님께 \u003cb class=\"key\">단어의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>가 어떻게 생기는지 물어봅니다. dog가 왜 개를 뜻하는지, 왜 책을 뜻하지는 않는지 \u003cb class=\"key\">의문\u003c/b>을 던지죠. 같은 \u003cb class=\"key\">문제\u003c/b>를 세 문장에 걸쳐 반복하며 궁금증을 키웁니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>선생님의 답\u003csmall>근거 제시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>그레인저 선생님은 \u003cb class=\"key\">사람들\u003c/b>이 단어에 뜻을 준다고 답합니다. 닉이 다시 how 하고 묻자, 선생님은 나와 너, 그리고 나라의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 그 의미에 \u003cb class=\"key\">합의\u003c/b>했다고 설명해요. 단어의 뜻은 사회가 정한다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 여기서 나옵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>닉의 반응\u003csmall>반례·결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>닉은 속으로 정말 그럴까 하고 \u003cb class=\"key\">회의\u003c/b>를 품습니다. 그리고 나는 \u003cb class=\"key\">동의\u003c/b>하지 않았다고 생각하죠. 사회 전체의 약속과 개인의 생각이 \u003cb class=\"key\">충돌\u003c/b>하는 장면으로 글이 끝납니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 크게 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 닉 앨런이 다섯 번째 학년 학생으로 등장하죠. 인물과 배경을 먼저 보여 주는 도입부라고 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 질문이에요. 닉이 단어의 의미가 어떻게 생기는지 선생님께 물어봐요. dog라는 단어가 왜 개를 뜻하는지, 왜 책을 뜻하지는 않는지 의문을 던지죠. 같은 문제를 세 문장에 걸쳐 반복하면서 궁금증을 키워요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 답변이에요. 그레인저 선생님은 사람들이 단어에 뜻을 준다고 설명해요. 닉이 다시 how 하고 묻자, 선생님은 나와 너, 그리고 나라의 모든 사람이 그 의미에 합의했다고 말하죠. 여기서 단어의 뜻은 사회가 정한다는 핵심 주장이 나와요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 반응이에요. 닉은 속으로 정말 그럴까 하고 회의를 품어요. 그리고 나는 동의하지 않았다고 생각하죠. 사회 전체의 약속과 개인의 생각이 충돌하는 장면으로 글이 끝나요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 닉의 \u003cb class=\"key\">질문\u003c/b>으로 시작해 선생님의 \u003cb class=\"key\">답변\u003c/b>으로 이어지는 \u003cb class=\"key\">질문-답변\u003c/b> 구조예요. 구체적인 사례를 먼저 던지고 원리를 뒤에서 밝히는 \u003cb class=\"key\">귀납적\u003c/b> 전개라고 볼 수 있죠. 주제에 해당하는 문장이 뒤쪽 일곱 번째 문장에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>으로 봅니다. 마지막 두 문장은 닉의 \u003cb class=\"key\">반응\u003c/b>이라 주제문 뒤에 붙는 여운 역할을 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>asked (2)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>answered (5)\u003c/b>\u003cspan>답변 시작\u003c/span>\u003cb>asked (6)\u003c/b>\u003cspan>되묻기\u003c/span>\u003cb>said (7)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>thought (8)\u003c/b>\u003cspan>속마음·반응\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">get their meanings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">give meanings to words\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">agreed on the meaning\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I didn't agree\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>모두의 합의\u003c/th>\u003cth>닉의 생각\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단어의 뜻을 사람들이 정함\u003c/td>\u003ctd>나는 그 뜻에 동의하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나라 전체가 함께 약속함\u003c/td>\u003ctd>혼자만 받아들이지 못함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문과 답변이 짝을 이루는 질문-답변 구조예요. 닉이 구체적인 사례를 던지고 선생님이 원리를 밝히는 방식이라, 구체적인 것에서 일반적인 결론으로 가는 귀납적 전개로 볼 수 있죠. 주제에 해당하는 문장이 뒤쪽에 나오기 때문에 미괄식 구조라고 정리할 수 있어요. 마지막 두 문장은 닉의 반응이라 주제문 뒤에 붙는 여운 같은 부분이에요.","hl":"ty"},{"n":9,"text":"신호어를 보면 누가 말하는지가 아주 중요한 단서예요. 두 번째 문장의 asked는 질문을 여는 신호이고, 다섯 번째 문장의 answered는 답변을 시작하는 신호예요. 일곱 번째 문장의 said는 근거를 제시하고, 여덟 번째 문장의 thought는 닉의 속마음을 보여 주죠. 그리고 get their meanings와 give meanings to words, agreed on the meaning처럼 같은 개념을 바꿔 말하는 재진술도 꼭 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fifth grade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>5학년\u003c/span>\u003c/div>\u003cdiv>\u003cb>one day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>English class\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영어 수업\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>teacher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선생님\u003c/span>\u003c/div>\u003cdiv>\u003cb>how\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어떻게\u003c/span>\u003c/div>\u003cdiv>\u003cb>word\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단어\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 갖게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미, 뜻\u003c/span>\u003c/div>\u003cdiv>\u003cb>why\u003c/b>\u003cem>부사\u003c/em>\u003cspan>왜\u003c/span>\u003c/div>\u003cdiv>\u003cb>dog\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다, 뜻하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>can\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>book\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>give\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모든 사람, 모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라, 국가\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 합의하다, 동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>really\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정말로, 정말?\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 꼭 챙겨야 해요. agree on은 ~에 합의하다, meaning은 의미, ask는 묻다라는 뜻이에요. 특히 agree on과 agree는 시험에 자주 나오니 세트로 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">meaning\u003c/b>\u003cspan class=\"m\">의미, 뜻\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sense\u003c/span>\u003cspan class=\"s\">definition\u003c/span>\u003cspan class=\"s\">significance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ask\u003c/b>\u003cspan class=\"m\">묻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inquire\u003c/span>\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"s\">request\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">answer\u003c/span>\u003cspan class=\"a\">reply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">answer\u003c/b>\u003cspan class=\"m\">대답하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reply\u003c/span>\u003cspan class=\"s\">respond\u003c/span>\u003cspan class=\"s\">react\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ask\u003c/span>\u003cspan class=\"a\">question\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">concur\u003c/span>\u003cspan class=\"s\">assent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">object\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give\u003c/b>\u003cspan class=\"m\">주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">grant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">everyone\u003c/b>\u003cspan class=\"m\">모든 사람\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">everybody\u003c/span>\u003cspan class=\"s\">all\u003c/span>\u003cspan class=\"s\">each person\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nobody\u003c/span>\u003cspan class=\"a\">no one\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mean\u003c/b>\u003cspan class=\"m\">의미하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">signify\u003c/span>\u003cspan class=\"s\">denote\u003c/span>\u003cspan class=\"s\">indicate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. ask는 inquire, question, request와 뜻이 비슷하고 answer의 반대말이죠. 반대로 answer는 reply, respond로 바꿔 쓸 수 있어요. agree는 consent, concur와 가깝고 disagree, object가 반대말이에요. give는 provide, offer와 비슷하고 take, receive가 반대이고, meaning은 sense, definition과 통한답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">닉 앨런은\u003c/span>\u003cspan class=\"en\">Nick Allen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5학년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fifth \u003c/span>\u003cspan class=\"tgt\">grade\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">닉 앨런은 5학년이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 주인공 닉 앨런의 \u003cb class=\"key\">배경\u003c/b>을 소개해요. 그가 \u003cb class=\"key\">5학년\u003c/b> 학생이라는 정보를 먼저 제시해서, 뒤에 이어질 영어 수업 장면의 \u003cb class=\"key\">상황\u003c/b>을 자연스럽게 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 전치사구(상태·소속 표현)\u003c/span> : [주어] + was + [in the fifth grade (전치사구)] : \"5학년이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">서수 표현(the + 서수 + 명사)\u003c/span> : [the + 서수(fifth) + 명사(grade)] : \"다섯 번째 학년, 즉 5학년\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Nick Allen, 닉 앨런은. was in, ~에 있었다. the fifth grade, 5학년에. 이 문장 전체를 해석하면, 닉 앨런은 5학년이었다.","hl":"m"},{"n":13,"text":"이 문장은 이야기 주인공 닉 앨런의 배경을 소개하는 부분이에요. 그가 5학년이라는 정보를 먼저 주면서, 뒤에 이어질 영어 수업 장면의 상황을 자연스럽게 깔아 주고 있죠.","hl":"mn"},{"n":14,"text":"먼저 첫 번째 포인트는 be동사 was 뒤에 in the fifth grade라는 전치사구가 온 구조예요. be동사는 주어의 상태나 소속을 설명할 때 쓰인다는 것, 꼭 기억하세요. 그리고 학년은 서수를 써서 in the fifth grade처럼 말한다는 것도 함께 알아 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">One day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영어 시간에\u003c/span>\u003cspan class=\"en\">in English class,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 선생님께 물었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">teacher\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단어들은 어떻게\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">words \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 의미를 갖게 될까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">meanings?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 영어 시간에, 그는 선생님께 &quot;단어들은 어떻게 그 의미를 갖게 될까요?&quot;라고 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 영어 시간에 닉이 선생님께 \u003cb class=\"key\">질문\u003c/b>을 던지는 장면이에요. How로 시작하는 \u003cb class=\"key\">의문문\u003c/b>을 그대로 인용해서 보여 주고, 단어의 의미가 어떻게 생기는지 궁금해하는 닉의 \u003cb class=\"key\">호기심\u003c/b>을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">ask + 사람(간접목적어) 구조\u003c/span> : [ask + 사람(목적어) + 직접의문문] : \"그는 선생님께 물었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사가 있는 직접의문문(직접화법)\u003c/span> : [의문사(How) + do + 주어 + 동사원형 ~?] : \"단어들은 어떻게 그 의미를 갖게 될까요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">get + 목적어(얻다)\u003c/span> : [get + 목적어(their meanings)] : \"그 의미를 얻다, 그 의미를 갖다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One day, 어느 날. in English class, 영어 시간에. he asked his teacher, 그는 선생님께 물었다. \"How do words, 단어들은 어떻게. get their meanings?, 그 의미를 갖게 될까?. 이 문장 전체를 해석하면, 어느 날 영어 시간에, 그는 선생님께 \"단어들은 어떻게 그 의미를 갖게 될까요?\"라고 물었다.","hl":"m"},{"n":16,"text":"이 문장은 영어 시간에 닉이 선생님께 질문을 던지는 장면이에요. How로 시작하는 의문문을 그대로 인용해서 보여 주고 있죠. 단어의 의미가 어떻게 생기는지 정말 궁금해하는 닉의 호기심이 느껴지는 부분이에요.","hl":"mn"},{"n":17,"text":"먼저 첫 번째, ask는 묻다라는 뜻으로 사람을 목적어로 바로 받을 수 있어요. 그래서 his teacher가 선생님께라는 대상이 되는 거죠. 두 번째, How로 시작하는 의문사 의문문에서는 도치가 일어나서 do가 주어 앞으로 나오고 동사는 반드시 동사원형을 씁니다. 세 번째, get은 여기서 의미를 얻다라는 뜻의 타동사로 쓰였고, their는 앞에 나온 words를 가리킨다는 것도 짚어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">dog라는 단어는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">word \u003c/span>\u003cspan class=\"tgt\">dog \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개를 뜻하는 걸까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">mean\u003c/span> a dog?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 dog라는 단어는 개를 뜻할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 닉이 앞에서 한 질문을 이어서 \u003cb class=\"key\">왜\u003c/b>라는 말로 다시 따져 묻는 부분이에요. \u003cb class=\"key\">dog\u003c/b>라는 단어가 왜 다른 뜻이 아니라 꼭 \u003cb class=\"key\">개\u003c/b>를 뜻하는지 끝까지 파고들고 있죠. 그래서 단어의 의미가 사람들이 정한 약속이라는 뒤 내용으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제 의문문(do/does + 주어 + 동사원형)\u003c/span> : [의문사(Why) + does + 주어 + 동사원형(mean) ~?] : \"왜 ~는 뜻하나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 표현(명사 + 명사)\u003c/span> : [the word + dog(명사)] : \"dog라는 단어\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Why, 왜. does the word dog, dog라는 단어는. mean a dog?, 개를 뜻하는 걸까?. 이 문장 전체를 해석하면, 왜 dog라는 단어는 개를 뜻할까?","hl":"m"},{"n":19,"text":"이 문장은 닉이 방금 한 질문을 왜라는 말로 다시 이어 가는 부분이에요. dog라는 단어가 왜 하필 개를 뜻하는지, 다른 뜻이 아니라 왜 개인지 끝까지 따져 묻고 있죠.","hl":"mn"},{"n":20,"text":"먼저 첫 번째, 주어가 the word dog처럼 삼인칭 단수일 때는 의문문을 만들 때 does를 쓰고 본동사는 반드시 동사원형 mean을 쓴다는 점을 기억하세요. 두 번째, the word 뒤에 dog를 그대로 붙여서 dog라는 단어라는 뜻을 만들어요. 명사가 다른 명사를 동격으로 설명해 주는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 수 없나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">mean\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 그것은 책을 뜻할 수 없나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick은 앞에서 dog라는 단어가 왜 dog를 뜻하는지 물은 뒤, 이번에는 그 단어가 책을 뜻하지 못하는 이유를 되묻고 있어요. 즉 \u003cb class=\"key\">단어\u003c/b>와 \u003cb class=\"key\">의미\u003c/b>의 관계가 사람이 정한 약속일 뿐인지 의심하는 장면이에요. \u003cb class=\"key\">자의성\u003c/b>이라는 말로 바꾸면 단어의 뜻은 본래 정해진 것이 아니라는 문제를 제기한 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 Why가 이끄는 조동사 의문문\u003c/span> : Why + [조동사 can't] + [주어 it] + [동사원형 mean] : \"왜 그것은 의미할 수 없나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 mean의 목적어\u003c/span> : mean + [목적어 a book] : \"책을\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Why, 왜. can't, 할 수 없나요. it, 그것은. mean, 의미하다. a book?\", 책을?. 이 문장 전체를 해석하면, 왜 그것은 책을 뜻할 수 없나요?","hl":"m"},{"n":22,"text":"이 문장은 Nick이 dog라는 단어가 왜 책을 뜻하지 못하는지 되묻는 장면이에요. 여기서 핵심은 단어와 의미 사이의 관계를 의심한다는 점이에요. 단어의 뜻이 원래 정해진 것이 아니라 사람들이 정한 것일 수 있다는 자의성 문제를 제기하는 거예요.","hl":"mn"},{"n":23,"text":"먼저 Why can't it mean을 볼게요. Why가 앞에 오면 의문문이 되고, 조동사 can't가 주어 it 앞으로 가면서 도치가 일어나요. 조동사 뒤에는 동사원형 mean이 와요. 그리고 a book은 타동사 mean의 목적어로 쓰여서 책을 의미하다라는 뜻을 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그레인저 선생님은\u003c/span>\u003cspan class=\"en\">Mrs. Granger\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대답했다,\u003c/span>\u003cspan class=\"en\">answered,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">People\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">meanings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단어들에게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그레인저 선생님은 &quot;사람들이 단어들에게 의미를 부여한다.&quot;라고 대답했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그레인저 선생님은 단어의 뜻이 하늘에서 떨어진 것이 아니라 \u003cb class=\"key\">사람들\u003c/b>이 \u003cb class=\"key\">단어\u003c/b>에 \u003cb class=\"key\">의미\u003c/b>를 붙여 준 결과라고 설명해요. 이 답은 Nick의 질문에 대해 언어가 사회적 약속이라는 관점을 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 주어\u003c/span> : People + [동사원형 give] : \"사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">give + 직접목적어 + to + 간접목적어\u003c/span> : give + [직접목적어 meanings] + to + [간접목적어 words] : \"단어들에게 의미를 주다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Mrs. Granger, 그레인저 선생님은. answered, 대답했다. \"People, 사람들은. give, 준다. meanings, 의미들을. to words.\", 단어들에게.. 이 문장 전체를 해석하면, 그레인저 선생님은 \"사람들이 단어들에게 의미를 부여한다.\"라고 대답했다.","hl":"m"},{"n":25,"text":"선생님은 단어의 뜻이 저절로 생긴 것이 아니라 사람들이 단어에 의미를 붙여 준 결과라고 말해요. 그래서 이 문장은 언어가 사회적 약속이라는 관점을 보여 줘요.","hl":"mn"},{"n":26,"text":"먼저 People을 보면 사람들은이라는 복수 주어라서 현재동사 give에 s를 붙이지 않고 동사원형 give를 써요. 다음으로 give meanings to words는 give A to B 구조예요. give는 수여동사라서 직접목적어 meanings를 먼저 쓰고, 간접목적어 words 앞에는 전치사 to를 붙여요. 그래서 의미를 단어들에게 주다라는 뜻이 완성돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">닉은\u003c/span>\u003cspan class=\"en\">Nick\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;어떻게?&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">&quot;How?&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">닉은 &quot;어떻게?&quot;라고 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick은 선생님의 설명을 듣고도 이해가 충분히 되지 않아 \u003cb class=\"key\">방법\u003c/b>을 다시 묻고 있어요. 짧은 \u003cb class=\"key\">의문사\u003c/b> \u003cb class=\"key\">How\u003c/b> 하나로 대화를 이어 가며, 앞으로 Nick이 어떤 행동을 할지 궁금하게 만드는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법으로 의문문 인용\u003c/span> : ask + &quot;, [의문문]?&quot; : \"어떻게?라고 물었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Nick, 닉은. asked, 물었다. \"How?\", \"어떻게?\". 이 문장 전체를 해석하면, 닉은 \"어떻게?\"라고 물었다.","hl":"m"},{"n":28,"text":"Nick은 선생님의 설명을 듣고도 이해가 충분하지 않아 방법을 다시 묻고 있어요. 짧은 의문사 How 하나로 대화를 이어 가면서 다음 내용에 대한 궁금증을 만들어요.","hl":"mn"},{"n":29,"text":"asked, How는 누군가의 말을 그대로 옮기는 직접화법이에요. ask 뒤에 의문문을 그대로 인용했고, How는 의문사 하나로 이루어진 짧은 의문문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그랜저 선생님이 말했다,\u003c/span>\u003cspan class=\"en\">Mrs. Granger said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너와 나, 그리고 이 나라의 모든 사람들이\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You, \u003c/span>\u003cspan class=\"tgt\">me, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 의미에 합의했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">agreed \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">meaning\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그랜저 선생님은 &quot;너와 나, 그리고 이 나라의 모든 사람들이 그 의미에 합의한 거란다.&quot;라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단어의 의미는 개인이 혼자 정하는 것이 아니라 여러 사람이 함께 정한다는 선생님의 설명이 담긴 문장이에요. 닉은 '나만 그 합의에서 빠져 있다'는 \u003cb class=\"key\">의문\u003c/b>을 품게 되고, 이 말이 그 \u003cb class=\"key\">근거\u003c/b>가 되어 다음 문장으로 이어지는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어의 병렬구조\u003c/span> : [You] + [me] + [and everyone in the country] → 복수로 취급되는 주어 : \"너와 나, 그리고 이 나라의 모든 사람들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 agree on (~에 합의하다)\u003c/span> : agree [자동사] + on + [목적어(the meaning)] : \"그 의미에 합의했다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Mrs. Granger said, 그랜저 선생님이 말했다. \"You, me, and everyone in the country, 너와 나, 그리고 이 나라의 모든 사람들이. agreed on the meaning.\", 그 의미에 합의했다.. 이 문장 전체를 해석하면, 그랜저 선생님은 \"너와 나, 그리고 이 나라의 모든 사람들이 그 의미에 합의한 거란다.\"라고 말했다.","hl":"m"},{"n":31,"text":"이 문장은 단어의 의미를 혼자 정하는 게 아니라 여러 사람이 함께 정한다는 선생님의 설명이에요. 닉은 자기만 그 합의에서 빠져 있다는 걸 깨닫고 의문을 품게 되는데, 그 근거가 되는 대목이죠.","hl":"mn"},{"n":32,"text":"먼저 agree on을 보세요. agree는 자동사라서 목적어를 바로 가질 수 없기 때문에 전치사 on을 붙여서 agree on, 즉 무언가에 합의하다라는 뜻을 만들어요. 그다음 주어를 보면 You, me, and everyone in the country가 and로 나란히 이어진 병렬 구조인데요, 이렇게 여러 요소가 이어지면 주어 전체가 복수로 취급된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">닉은 생각했다, 정말?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nick \u003c/span>\u003cspan class=\"tgt\">thought,\u003c/span> &quot;Really?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">닉은 &quot;정말?&quot;이라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님의 말을 듣고 닉이 속으로 놀라며 되묻는 장면이에요. 모든 사람이 \u003cb class=\"key\">합의\u003c/b>했다는 말이 자기 기억과 맞지 않아 \u003cb class=\"key\">의아\u003c/b>해하는 마음이 그대로 드러나죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think의 과거형과 직접화법\u003c/span> : [주어 Nick] + [동사 thought(과거)] + [따옴표로 묶인 인용 내용] : \"닉은 생각했다,\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Nick thought, 닉은 생각했다. \"Really?\", 정말?. 이 문장 전체를 해석하면, 닉은 \"정말?\"이라고 생각했다.","hl":"m"},{"n":34,"text":"닉이 속으로 놀라서 되묻는 장면이에요. 선생님은 모두가 합의했다고 했지만 자기 기억에는 없으니 의아할 수밖에 없죠.","hl":"mn"},{"n":35,"text":"thought는 think의 과거형으로 이미 지나간 생각을 나타내요. 그리고 따옴표 안의 Really는 닉이 머릿속에서 한 말을 그대로 옮긴 직접화법이라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의하지 않았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">agree\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 동의하지 않았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 닉이 마음속으로 '나는 그 합의에 동의한 적이 없다'고 \u003cb class=\"key\">반박\u003c/b>하는 부분이에요. 선생님의 설명과 닉의 경험이 서로 \u003cb class=\"key\">충돌\u003c/b>하는 지점으로, 닉이 왜 계속 의문을 품는지 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제 부정문 (did not + 동사원형)\u003c/span> : [주어] + did not(didn't) + [동사원형 agree] : \"동의하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I, 나는. didn't agree, 동의하지 않았다.. 이 문장 전체를 해석하면, 나는 동의하지 않았어.","hl":"m"},{"n":37,"text":"닉이 마음속으로 나는 그 합의에 동의한 적이 없다고 반박하는 부분이에요. 선생님의 설명과 닉의 경험이 서로 충돌하는 지점이죠.","hl":"mn"},{"n":38,"text":"과거 부정문은 did 뒤에 not을 붙이고, 본동사는 반드시 동사원형 agree를 써요. 그래서 didn't agreed가 아니라 didn't agree가 맞는 형태예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>닉 앨런은 \u003cb class=\"key\">영어 \u003c/b>\u003cb class=\"key\">수업\u003c/b>에서 단어가 어떻게 뜻을 갖게 되는지 선생님께 물었어요.\u003c/li>\u003cli>dog가 왜 개를 뜻하고 책을 뜻하지는 않는지 \u003cb class=\"key\">의문\u003c/b>을 던졌죠.\u003c/li>\u003cli>선생님은 \u003cb class=\"key\">사람들\u003c/b>이 단어에 의미를 주고, 나라의 모든 사람이 \u003cb class=\"key\">합의\u003c/b>했다고 답했어요.\u003c/li>\u003cli>닉은 나는 \u003cb class=\"key\">동의\u003c/b>하지 않았다고 생각하며 사회적 약속에 \u003cb class=\"key\">회의\u003c/b>를 품었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Word meanings come from the agreement of people, not from the words themselves.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 닉 앨런이 영어 수업에서 \u003cb class=\"key\">단어의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>가 어떻게 생기는지 선생님께 질문했고, 선생님은 사람들이 \u003cb class=\"key\">합의\u003c/b>로 뜻을 정한다고 답했지만 닉은 \u003cb class=\"key\">동의\u003c/b>하지 않았다고 생각한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 배운 내용을 정리해 볼게요. 닉 앨런의 질문에서 시작해, 단어의 의미는 사람들의 합의로 정해진다는 답을 얻었죠. 하지만 닉은 동의하지 않았다고 생각하며 회의를 품었고, 그 지점이 바로 이 글의 재미있는 반전이에요. 단어의 뜻은 사회적 약속이라는 점, 꼭 기억하고 오늘 수업 마칠게요. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
