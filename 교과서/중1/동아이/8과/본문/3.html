<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 8과 본문3 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 8과 본문3","audioDir":"3_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>8과 본문3\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Frindle Spreads Beyond the Classroom\u003c/h1>\u003ch2>교실을 넘어 퍼진 frindle\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Granger 선생님은 frindle이 진짜 단어가 아니라며 Nick과 학급 전체에게 사용을 거듭 금지했지만, 그 단어는 점점 더 많은 학생들에게 퍼져 결국 \u003cb class=\"key\">전국\u003c/b>의 학생들이 사용하게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Despite Mrs. Granger's repeated ban, the word frindle spread and was finally used by students across the whole country.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 함께 읽을 지문은 중학교 일학년 동아 이 선생님 교과서 여덟 과 본문 세 번째 부분이에요. Andrew Clements의 소설 Frindle에서 아주 중요한 장면이죠. Granger 선생님과 Nick이 frindle이라는 단어를 두고 이야기를 나누고, 그 단어가 결국 전국으로 퍼지는 내용이에요. 오늘 수업에서 이 장면의 흐름과 구조, 그리고 핵심 단어들을 차근차근 정리해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 Andrew Clements의 소설 Frindle의 한 장면이에요. 주인공 Nick은 펜을 가리키는 새 단어 frindle을 직접 만들어 냈고, 그것이 친구들 사이에서 퍼지기 시작하죠. 언어학에서는 이렇게 새로 만들어진 단어를 \u003cb class=\"key\">신조어\u003c/b>(coinage, neologism)라고 불러요. 중요한 건 단어가 사전이나 권위 있는 기관이 정하는 것이 아니라, 사람들이 실제로 쓰기 시작할 때 \u003cb class=\"key\">언어 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>(speech community) 안에서 살아 있는 말이 된다는 점이에요. 마치 어떤 유행어가 방송에 한 번 나오면 순식간에 전국으로 퍼지는 것과 같은 이치죠. 결국 언어의 변화는 한 사람의 \u003cb class=\"key\">선택\u003c/b>과 사회적 \u003cb class=\"key\">확산\u003c/b>이 만나서 일어나는 거예요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 이 글은 Andrew Clements가 쓴 소설 Frindle의 한 장면이에요. 주인공 Nick은 펜을 가리키는 새 단어 frindle을 직접 만들어 냈고, 그 단어가 친구들 사이에서 퍼지기 시작하죠. 언어학에서는 이렇게 새로 만들어진 단어를 신조어라고 부르고, 영어로는 coinage 또는 neologism이라고 해요. 중요한 건 단어가 사전이 정하는 게 아니라 사람들이 실제로 쓰기 시작할 때 언어 공동체 안에서 살아 있는 말이 된다는 점이에요. 마치 어떤 유행어가 방송에 한 번 나오면 순식간에 전국으로 퍼지는 것과 같은 이치죠. 그래서 언어의 변화는 한 사람의 선택과 사회적 확산이 만나서 일어난다고 볼 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>선생님의 제지\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>어느 날 수업이 끝난 후, Granger 선생님은 Nick을 불러요. 그녀는 frindle이 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 아니라고 단언하며, Nick과 반 친구들이 그것을 쓰는 것을 \u003cb class=\"key\">멈추어야\u003c/b> 한다고 말하죠. 이 장면은 이후 벌어질 갈등의 \u003cb class=\"key\">출발점\u003c/b>이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Nick의 답변\u003csmall>반응 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>Nick은 선생님이 기분이 좋지 않으신 건 안다고 말해요. 그러면서 정말 죄송하지만 이미 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">늦었다\u003c/b>고 답하죠. 이제는 \u003cb class=\"key\">모두\u003c/b>가 그 단어를 쓰고 있다는 것이 그의 핵심 논리예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>봉인된 편지\u003csmall>전환 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>Granger 선생님은 편지 한 통을 꺼내요. 그것은 Nick을 위해 쓴 편지지만 오늘은 주지 않고 \u003cb class=\"key\">언젠가\u003c/b> 보내겠다고 말하죠. 이 \u003cb class=\"key\">비밀 \u003c/b>\u003cb class=\"key\">편지\u003c/b>는 뒤에서 중요한 복선이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다시 한 번 금지\u003csmall>반복 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>다음 날 아침, 선생님은 학급 전체에게 frindle을 쓰지 말라고 다시 말해요. frindle은 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 아니라는 주장을 똑같이 반복하죠. 같은 \u003cb class=\"key\">금지\u003c/b>가 한 번 더 나오면서 긴장이 커져요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>멈출 수 없는 확산\u003csmall>결론 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>하지만 점점 더 많은 학생들이 그 단어를 썼어요. 다른 학교 학생들도 쓰기 시작했고, 곧 \u003cb class=\"key\">전국\u003c/b>의 학생들이 사용하게 되죠. 금지에도 불구하고 단어가 \u003cb class=\"key\">확산\u003c/b>되는 결과로 글은 끝나요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 선생님의 제지예요. 어느 날 수업이 끝난 후, Granger 선생님은 Nick을 불러요. 그리고 frindle은 진짜 단어가 아니니까 너와 반 친구들은 그것을 쓰는 것을 멈춰야 한다고 단호하게 말하죠. 이 장면이 이후 갈등의 출발점이 돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Nick의 답변이에요. Nick은 선생님이 기분이 좋지 않으신 건 안다고 말해요. 그러면서 정말 죄송하지만 이미 너무 늦었다고 답하죠. 이제는 모두가 그 단어를 쓰고 있다는 것이 그의 핵심 논리예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 봉인된 편지예요. Granger 선생님은 편지 한 통을 꺼내서, 이건 너를 위해 쓴 편지지만 오늘은 주지 않고 언젠가 보내주겠다고 말해요. 이 비밀 편지는 나중에 아주 중요한 복선이 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 다시 한 번의 금지예요. 다음 날 아침, 선생님은 학급 전체에게 frindle을 쓰지 말라고 다시 말해요. frindle은 진짜 단어가 아니라는 주장을 똑같이 반복하죠. 같은 금지가 한 번 더 나오면서 긴장감이 커져요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 멈출 수 없는 확산이에요. 하지만 점점 더 많은 학생들이 그 단어를 썼어요. 다른 학교 학생들도 쓰기 시작했고, 곧 전국의 학생들이 그것을 사용하게 되죠. 금지에도 불구하고 단어가 확산되는 결과로 글이 마무리돼요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 One day, The next morning, Soon 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 따라 사건이 순서대로 이어져요. 선생님의 금지와 Nick의 답변, 편지, 재금지, 그리고 확산이라는 다섯 장면이 \u003cb class=\"key\">시간순\u003c/b>으로 배열되죠. 핵심 결론인 frindle이 전국으로 퍼졌다는 내용이 맨 마지막 문장에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 구조예요. 그래서 주제문은 마지막 문장으로 잡는 것이 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>시간 도입\u003c/span>\u003cb>The next morning (11)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>But (13)\u003c/b>\u003cspan>대조·반전\u003c/span>\u003cb>Soon (15)\u003c/b>\u003cspan>시간·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Everyone is using it now\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more and more students used it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Students in other schools started using it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">students in the whole country were using it\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Granger 선생님\u003c/th>\u003cth>학생들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>frindle 사용을 멈추라고 요구\u003c/td>\u003ctd>금지에도 계속 frindle을 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>frindle은 진짜 단어가 아니라고 주장\u003c/td>\u003ctd>전국에서 실제로 쓰이는 단어로 만듦\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순이에요. One day, The next morning, Soon 같은 시간 표현을 따라 사건이 순서대로 이어지죠. 핵심 결론인 frindle이 전국으로 퍼졌다는 내용이 맨 마지막 문장에 나오기 때문에 미괄식 구조라고 볼 수 있어요. 그래서 주제문은 마지막 문장으로 잡는 것이 자연스러워요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 One day는 이야기의 시작을 알리고, 열한 번째 문장의 The next morning은 다음 날로 시간을 넘겨 줘요. 그리고 열세 번째 문장의 But은 선생님의 금지와 학생들의 확산을 대비시키는 강한 반전 신호예요. 마지막 문장의 Soon은 확산이 결국 전국 규모로 커졌다는 결과를 보여 주죠. 또 모두가 그것을 쓰고 있어요, 점점 더 많은 학생들이 사용했어요, 전국의 학생들이 사용하고 있었어요라는 표현은 같은 개념을 점점 크게 반복해서 말한 재진술이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>after class\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수업이 끝난 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진짜의, 실제의\u003c/span>\u003c/div>\u003cdiv>\u003cb>word\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단어, 말\u003c/span>\u003c/div>\u003cdiv>\u003cb>classmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>should\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~해야 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다, 그만두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다, 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>know\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기분 좋은, 행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sorry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>late\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>늦은\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모든 사람, 모두\u003c/span>\u003c/div>\u003cdiv>\u003cb>take out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>꺼내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>letter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편지\u003c/span>\u003c/div>\u003cdiv>\u003cb>write\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>some day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>언젠가\u003c/span>\u003c/div>\u003cdiv>\u003cb>next\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다음의\u003c/span>\u003c/div>\u003cdiv>\u003cb>morning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아침\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more and more\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>점점 더 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>student\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학생\u003c/span>\u003c/div>\u003cdiv>\u003cb>other\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>school\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학교\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라, 국가\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚어 볼게요. take out은 꺼내다, send는 보내다, 그리고 some day는 언젠가라는 뜻이에요. stop은 멈추다, use는 사용하다, whole은 전체의라는 뜻이고, more and more는 점점 더 많은이라는 숙어로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">real\u003c/b>\u003cspan class=\"m\">진짜의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">unreal\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quit\u003c/span>\u003cspan class=\"s\">cease\u003c/span>\u003cspan class=\"s\">halt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003cspan class=\"a\">begin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">use\u003c/b>\u003cspan class=\"m\">사용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"s\">utilize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">기분 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">angry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">send\u003c/b>\u003cspan class=\"m\">보내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mail\u003c/span>\u003cspan class=\"s\">deliver\u003c/span>\u003cspan class=\"s\">dispatch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">whole\u003c/b>\u003cspan class=\"m\">전체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">total\u003c/span>\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">late\u003c/b>\u003cspan class=\"m\">늦은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delayed\u003c/span>\u003cspan class=\"s\">tardy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">early\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. real은 진짜의라는 뜻으로 actual, true, genuine과 비슷하고 fake나 unreal과 반대예요. stop은 quit, cease, halt와 가깝고 continue나 start와 반대죠. use는 employ, utilize와 비슷하고, happy는 glad, pleased, delighted와 비슷하며 unhappy나 sad와 반대예요. send는 mail, deliver, dispatch와 가깝고 receive와 반대이고, whole은 entire, total, complete와 비슷해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날 수업이 끝난 후,\u003c/span>\u003cspan class=\"en\">One day \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">class\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Granger 선생님은\u003c/span>\u003cspan class=\"en\">Mrs. Granger\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nick을 불렀다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Nick\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 수업이 끝난 후, Granger 선생님은 Nick을 불렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수업이 끝난 뒤 Granger 선생님이 Nick을 따로 부른 장면이에요. 여기서 \u003cb class=\"key\">call\u003c/b>은 '이름을 부르다'가 아니라 '사람을 불러내다'라는 뜻으로, 뒤에 이어질 두 사람의 \u003cb class=\"key\">대화\u003c/b>를 시작하는 신호예요. 이 문장은 다음 내용의 \u003cb class=\"key\">배경\u003c/b>을 열어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 명사(구) (시간의 부사구)\u003c/span> : after [전치사] + [명사 class] → [시간의 부사구] : \"수업이 끝난 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 타동사 call + 목적어\u003c/span> : call [타동사] + [목적어 Nick] : \"Nick을 불렀다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"One day after class, 어느 날 수업이 끝난 후. Mrs. Granger, Granger 선생님은. called Nick, Nick을 불렀다.. 이 문장 전체를 해석하면, 어느 날 수업이 끝난 후, Granger 선생님은 Nick을 불렀다.","hl":"m"},{"n":14,"text":"이 문장은 수업이 끝난 다음에 선생님이 Nick을 따로 부른 장면이에요. 여기서 call은 이름을 부르는 게 아니라 사람을 따로 불러낸다는 뜻이고요, 바로 뒤에 이어지는 두 사람의 대화를 여는 신호예요. 이 문장이 다음 내용 전체의 배경을 열어 준다고 이해하시면 좋아요.","hl":"mn"},{"n":15,"text":"첫 번째로 after class를 보면요, after는 전치사라서 뒤에 명사가 와요. 그래서 class가 after의 목적어가 되고 수업 후에라는 시간 표현이 만들어지는 거죠. 이 덩어리는 문장에서 때를 알려 주는 역할을 하니까 시간 부사구로 정리해 두세요. 두 번째로 called Nick을 보면요, call은 뒤에 목적어 하나만 필요한 3형식 동사예요. 그래서 Nick을 불렀다라고 해석하고 목적격 보어가 없다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘frindle’은\u003c/span>\u003cspan class=\"en\">&quot;Frindle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜 단어가 아니야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 “‘frindle’은 진짜 단어가 아니야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Granger 선생님이 frindle이라는 말은 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 아니라고 못 박는 장면이에요. 선생님의 말을 \u003cb class=\"key\">직접화법\u003c/b>으로 그대로 옮겨 인물의 태도를 생생하게 보여 줘요. 여기서 한 이 말이 뒤에서 반 아이들에게 다시 나오는 \u003cb class=\"key\">복선\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법을 이끄는 say + 인용문\u003c/span> : say [동사] + [큰따옴표 인용문] → [직접화법] : \"그녀는 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사의 부정문\u003c/span> : be동사 [is] + not → [부정문] : \"~이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관사 a + 형용사 real + 명사 word (명사구)\u003c/span> : [관사 a] + [형용사 real] + [명사 word] : \"진짜 단어 (하나)\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"She said, 그녀는 말했다. \"Frindle, ‘frindle’은. is not a real word, 진짜 단어가 아니야.. 이 문장 전체를 해석하면, 그녀는 “‘frindle’은 진짜 단어가 아니야.","hl":"m"},{"n":17,"text":"이 문장은 Granger 선생님이 frindle이라는 말은 진짜 단어가 아니라고 못 박는 장면이에요. 선생님의 말을 직접화법으로 그대로 옮겨서 인물의 태도가 생생하게 느껴지고요. 여기서 한 이 말이 뒤에서 반 아이들에게 다시 나오는 복선이 된다는 점도 기억해 두세요.","hl":"mn"},{"n":18,"text":"먼저 She said를 보면요, said 뒤에 인용문이 이어지면서 남의 말을 그대로 전하는 직접화법이 됩니다. 두 번째로 is not을 보면요, be동사 뒤에 not을 붙여서 부정문을 만들었어요. 일반동사처럼 do not을 쓰지 않는다는 점이 중요하죠. 세 번째로 a real word를 보면요, 셀 수 있는 명사 앞에는 관사를 붙여야 하고, real은 word를 꾸미는 형용사로 진짜 단어라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너와 너희 반 친구들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">classmates\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈춰야 해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너와 너희 반 친구들은 그것을 사용하는 것을 멈춰야 해.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 반 아이들에게 frindle 사용을 그만두라고 \u003cb class=\"key\">충고\u003c/b>하는 문장이에요. should로 \u003cb class=\"key\">의무\u003c/b>를 부드럽게 전하고, stop using으로 '쓰던 것을 중단하라'는 \u003cb class=\"key\">명령\u003c/b>의 뜻을 담았어요. 앞의 두 문장과 이어지면서 선생님의 반대 입장이 분명해지는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">and로 연결된 주어 병렬\u003c/span> : [You] and [your classmates] → [주어] : \"너와 너희 반 친구들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should + 동사원형\u003c/span> : should [조동사] + stop [동사원형] : \"멈춰야 해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">stop + 동명사(목적어)\u003c/span> : stop [동사] + using [동명사/목적어] : \"그것을 사용하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"You and your classmates, 너와 너희 반 친구들은. should stop, 멈춰야 해. using it.\", 그것을 사용하는 것을. 이 문장 전체를 해석하면, 너와 너희 반 친구들은 그것을 사용하는 것을 멈춰야 해.”라고 말했다.","hl":"m"},{"n":20,"text":"이 문장은 선생님이 반 아이들에게 frindle 쓰는 걸 그만두라고 충고하는 말이에요. should로 의무를 부드럽게 전하고, stop using으로 쓰던 것을 중단하라는 명령의 뜻을 담았죠. 앞의 두 문장과 이어지면서 선생님이 frindle에 반대한다는 입장이 더 분명해지는 부분이에요.","hl":"mn"},{"n":21,"text":"첫 번째로 You and your classmates를 보면요, and가 두 명사를 대등하게 이어서 하나의 주어를 만들었어요. 뜻은 너와 반 친구들 전부가 되겠죠. 두 번째로 should stop을 보면요, should는 충고와 의무를 나타내는 조동사라서 뒤에 동사원형이 옵니다. 그래서 stop이 stops나 stopped가 아니라 그대로 stop인 거예요. 세 번째로 using it을 보면요, stop 뒤에 동명사가 오면 하던 것을 멈춘다는 뜻이 되고, 여기서는 it을 쓰는 행동을 중단하라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nick은 말했다,\u003c/span>\u003cspan class=\"en\">Nick said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;저는 알아요\u003c/span>\u003cspan class=\"en\">&quot;I know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님께서 기분이 좋지 않으신 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">happy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nick은 “선생님께서 기분이 좋지 않으신 건 알겠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 선생님의 기분을 먼저 인정해 주면서, 곧이어 자신의 주장을 펼칠 \u003cb class=\"key\">근거\u003c/b>를 준비하는 문장이에요. 여기서 that은 해석하지 않고 know의 \u003cb class=\"key\">목적어\u003c/b> 자리를 채워 주는 \u003cb class=\"key\">that절\u003c/b> 표시예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : know [타동사] + that + [주어 + 동사 (명사절/목적어)] : \"선생님께서 기분이 좋지 않으신 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 현재시제의 부정\u003c/span> : [주어] + are + not + [형용사] : \"기분이 좋지 않으신\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Nick said, Nick은 말했다. \"I know, \"저는 알아요. that you're not happy, 선생님께서 기분이 좋지 않으신 것을.. 이 문장 전체를 해석하면, Nick은 “선생님께서 기분이 좋지 않으신 건 알겠어요.","hl":"m"},{"n":23,"text":"이 문장은 Nick이 선생님의 기분을 먼저 인정해 주는 부분이에요. 그래야 뒤에서 자기 주장을 펼칠 근거가 자연스럽게 만들어지죠. 상대를 존중하는 말로 시작하는 거예요.","hl":"mn"},{"n":24,"text":"첫 번째, know 뒤에 that절이 와서 목적어 자리를 채우고 있어요. 그래서 ~라는 것을 알다라는 뜻이 되죠. 두 번째, you're not happy는 be동사 뒤에 not을 붙여서 현재 상태를 부정한 형태예요. 선생님이 지금 기분이 좋지 않다는 걸 그대로 인정하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 죄송하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">sorry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 늦었어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">late\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 죄송하지만, 너무 늦었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nick이 \u003cb class=\"key\">사과\u003c/b>를 하면서도 자기 주장은 굽히지 않겠다는 뜻을 담은 문장이에요. but 뒤에 \u003cb class=\"key\">too \u003c/b>\u003cb class=\"key\">late\u003c/b>를 두어 이미 돌이킬 수 없는 현실을 강하게 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 부사 + 형용사(감정 표현)\u003c/span> : [주어] + am + [부사 really] + [형용사 sorry] : \"정말 죄송하지만\"\u003c/div>\u  쓴 상태를 말하니까 과거시제로 쓰였죠. for you는 너를 위해라는 뜻으로, 이 편지의 대상이 닉이라는 걸 보여 줍니다.","hl":"mn"},{"n":36,"text":"어법 포인트는 첫 번째로 wrote예요. write의 과거형이고 이미 끝난 일을 말하니까 과거시제로 썼습니다. 두 번째로 for you인데, for는 여기서 누구를 위해라는 이익의 뜻을 나타내는 전치사예요. 그래서 이 편지는 너를 위한 거라는 마음이 담겨 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~하지 않을 거야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 주다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘\u003c/span>\u003cspan class=\"en\">today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나는 그것을 네게 오늘 주지 않을 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지를 썼다고 해 놓고는 바로 주지는 않겠다는 \u003cb class=\"key\">반전\u003c/b>이 담긴 문장이에요. be going to는 미래의 계획이나 \u003cb class=\"key\">의도\u003c/b>를 나타내는데, not이 붙어서 ‘줄 생각이 없다’는 선생님의 강한 의지가 드러납니다. 그래서 이 편지는 나중에 닉에게 전해질 \u003cb class=\"key\">복선\u003c/b>이 되는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be going to의 부정문\u003c/span> : [주어] + be동사 + not + going to + [동사원형] : \"나는 주지 않을 거야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식의 3형식 전환(give + 목적어 + to + 사람)\u003c/span> : give + [직접목적어] + to + [간접목적어] : \"그것을 네게 주다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"But, 하지만. I'm not going to, 나는 ~하지 않을 거야. give it, 그것을 주다. to you, 네게. today, 오늘. 이 문장 전체를 해석하면, 하지만 나는 그것을 네게 오늘 주지 않을 거야.","hl":"m"},{"n":38,"text":"편지를 썼다고 해 놓고는 바로 주지는 않겠다는 반전이 담긴 문장이에요. be going to는 미래의 계획이나 의도를 나타내는데, not이 붙어서 줄 생각이 없다는 선생님의 강한 의지가 드러납니다. 그래서 이 편지는 나중에 닉에게 전해질 복선이 되는 거죠.","hl":"mn"},{"n":39,"text":"어법은 첫 번째로 I'm not going to give, 즉 be going to의 부정이에요. be동사 뒤에 not을 넣고 going to 다음에는 동사원형이 온다는 순서를 꼭 기억하세요. 두 번째로 give it to you인데, 목적어가 대명사 it일 때는 사람 앞에 to를 붙여서 그것을 네게 주다라는 순서로 바꿔 쓴 거예요. 이 두 가지가 이 문장에서 시험에 나올 만한 포인트입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 보낼 거야\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 편지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">letter\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언젠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 이 편지를 언젠가 네게 보낼 거야.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Granger 선생님이 Nick에게 이 편지를 오늘은 주지 않고 \u003cb class=\"key\">언젠가\u003c/b> 보내주겠다고 말하는 장면이에요. 이 편지는 나중에 이야기에서 중요한 \u003cb class=\"key\">복선\u003c/b>이 되죠. will은 미래에 대한 \u003cb class=\"key\">의지·예정\u003c/b>을 나타내고, some day는 미래의 어느 때를 가리키는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (미래시제)\u003c/span> : 주어 + [[will]] + [[동사원형]] : \"보낼 거야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 (수여동사)\u003c/span> : send + [[간접목적어]](you) + [[직접목적어]](this letter) : \"네게 이 편지를 보내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사구 (미래 시점)\u003c/span> : some day = [[언젠가]] (미래의 어느 때) : \"언젠가\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"I will send, 나는 보낼 거야. you, 네게. this letter, 이 편지를. some day, 언젠가. 이 문장 전체를 해석하면, 나는 이 편지를 언젠가 네게 보낼 거야.”라고 말했다.","hl":"m"},{"n":41,"text":"여기서 말하고 있는 사람이 Granger 선생님이라는 걸 꼭 기억해 주세요. 선생님은 이 편지를 오늘은 주지 않고 언젠가 보내주겠다고 하는데, 이 편지가 나중에 이야기의 중요한 복선이 됩니다. will은 미래에 대한 의지와 예정을 나타내고, some day는 미래의 어느 때를 가리키는 표현이에요.","hl":"mn"},{"n":42,"text":"첫 번째는 will send인데, will은 미래를 나타내는 조동사이고 조동사 뒤에는 항상 동사원형이 오기 때문에 sends가 아니라 send를 씁니다. 두 번째는 send you this letter인데, send는 목적어를 두 개 갖는 수여동사라서 사람이 먼저 오는 간접목적어, 사물이 뒤에 오는 직접목적어 순서로 쓰는 4형식 구조예요. 세 번째는 some day인데, 미래의 어느 시점을 가리키는 부사구로 문장 끝에서 언젠가라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 날 아침, Granger 선생님은 학급에 말했다, ‘frindle’을 사용하는 것을 멈추거라!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">morning\u003c/span>, Mrs. Granger \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">class\u003c/span>, &quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Stop \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">frindle\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 날 아침, Granger 선생님은 학급에 “‘frindle’을 사용하는 것을 멈추거라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서는 Nick에게 개인적으로 말했지만, 이제는 \u003cb class=\"key\">학급 \u003c/b>\u003cb class=\"key\">전체\u003c/b>에게 공개적으로 frindle을 쓰지 말라고 하는 장면이에요. 선생님의 경고가 점점 강해지는 흐름을 보여주죠. 그런데 바로 다음 문장에서 더 많은 학생들이 이 단어를 쓰기 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구 (명사구의 부사적 용법)\u003c/span> : [[The next morning]] + 주어 + 동사 : \"다음 날 아침에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">tell + 사람 목적어\u003c/span> : tell + [[사람 목적어]](the class) : \"학급에게 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명령문 + stop -ing\u003c/span> : Stop + [[동명사]](using) ~ : \"frindle을 사용하는 것을 멈추거라\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"The next morning, 다음 날 아침. Mrs. Granger told the class, Granger 선생님은 학급에 말했다. \"Stop using frindle!\", ‘frindle’을 사용하는 것을 멈추거라!. 이 문장 전체를 해석하면, 다음 날 아침, Granger 선생님은 학급에 “‘frindle’을 사용하는 것을 멈추거라!","hl":"m"},{"n":44,"text":"앞에서는 Nick에게 개인적으로 말했지만, 이제는 학급 전체에게 공개적으로 frindle을 쓰지 말라고 하는 장면이에요. 선생님의 경고가 점점 강해지는 흐름을 보여주죠. 그런데 바로 다음 문장에서 더 많은 학생들이 이 단어를 쓰기 시작한다는 게 재미있는 반전이에요.","hl":"mn"},{"n":45,"text":"첫 번째는 The next morning인데, 명사구가 문장 앞에서 시간을 나타내는 부사구로 쓰였어요. 두 번째는 told the class인데, tell은 사람 목적어를 바로 데려올 수 있어서 say to와 달리 전치사가 필요 없어요. 세 번째는 Stop using frindle인데, 동사원형으로 시작하는 명령문이고 stop 뒤에 동명사가 와서 하는 것을 멈추다라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">frindle은\u003c/span>\u003cspan class=\"en\">Frindle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 아니야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜 단어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘frindle’은 진짜 단어가 아니야.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 frindle은 진짜 단어가 아니라고 다시 한 번 강조하는 문장이에요. 바로 앞의 명령문과 이어져서 선생님의 반대 입장을 분명히 보여주죠. 그런데 이야기 속에서는 이 단어가 \u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">널리\u003c/b> 퍼져 나갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : 주어 + [[be동사]] + not + 보어 : \"~이 아니야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격보어 (명사)\u003c/span> : 주어(Frindle) + be동사 + [[주격보어]](a real word) : \"진짜 단어\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Frindle, frindle은. is not, ~이 아니야. a real word, 진짜 단어. 이 문장 전체를 해석하면, ‘frindle’은 진짜 단어가 아니야.”라고 말했다.","hl":"m"},{"n":47,"text":"선생님이 frindle은 진짜 단어가 아니라고 다시 한 번 강조하는 문장이에요. 바로 앞의 명령문과 이어져서 선생님의 반대 입장을 분명히 보여주죠. 그런데 이야기 속에서는 이 단어가 점점 더 널리 퍼져 나간다는 점이 재미있는 포인트예요.","hl":"mn"},{"n":48,"text":"첫 번째는 is not인데, be동사 뒤에 not을 붙여서 부정문을 만들었어요. 일반동사라면 do를 써야 하지만 be동사는 그럴 필요가 없죠. 두 번째는 a real word인데, be동사 뒤에서 주어 Frindle의 정체를 설명하는 주격보어로 명사구가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 학생들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more\u003c/span> students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 점점 더 많은 학생들이 그것을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 선생님이 frindle을 쓰지 말라고 했지만, 오히려 \u003cb class=\"key\">점점 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은\u003c/b> 학생들이 그 말을 썼다는 흐름이에요. 금지가 \u003cb class=\"key\">오히려\u003c/b> 그 말을 퍼뜨린 결과로 이어졌다는 걸 보여 주죠. 여기서 it은 frindle을 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 반복 표현\u003c/span> : more + and + more + [복수명사] → '점점 더 많은' : \"점점 더 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단순과거(과거시제)\u003c/span> : [주어] + [동사 과거형 used] + [목적어 it] : \"그것을 사용했다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"But, 하지만. more and more students, 점점 더 많은 학생들이. used it, 그것을 사용했다. 이 문장 전체를 해석하면, 하지만 점점 더 많은 학생들이 그것을 사용했다.","hl":"m"},{"n":50,"text":"여기서 하지만은 앞에서 선생님이 쓰지 말라고 한 말과 반대되는 흐름을 만들어 줘요. 그런데도 점점 더 많은 학생들이 frindle을 썼다는 거죠. 금지가 오히려 그 말을 퍼뜨린 셈이에요. 그리고 it은 바로 frindle을 가리킵니다.","hl":"mn"},{"n":51,"text":"첫 번째로 볼 건 more and more예요. 비교급인 more를 and로 한 번 더 이어 주면 점점 더라는 증가의 느낌이 살아나요. 그래서 점점 더 많은이라는 뜻이 되는 거죠. 두 번째는 used인데요, 동사에 과거시제를 써서 이미 지나간 과거의 일이라는 걸 보여 줘요. 시험에서는 과거시제 자리 찾기 문제로 자주 나옵니다.","hl" 구죠. 해석할 때는 다른 학교의 학생들처럼 앞에서 이어 주면 자연스러워요. 두 번째는 started using이에요. start 뒤에 동명사가 목적어로 오면 그것을 하기 시작했다는 뜻이 되죠. to부정사도 가능하지만 시험에는 이 형태 그대로 자주 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧\u003c/span>\u003cspan class=\"en\">Soon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전국의 학생들이\u003c/span>\u003cspan class=\"en\">students \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용하고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧, 전국의 학생들이 그것을 사용하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마지막 문장으로, frindle이 \u003cb class=\"key\">교실\u003c/b>을 넘어 \u003cb class=\"key\">전국\u003c/b>으로 퍼진 결과를 보여 줘요. 과거진행형은 그 확산이 한 시점에 \u003cb class=\"key\">계속\u003c/b> 이어지고 있던 상황을 그려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 후치 수식\u003c/span> : [명사 students] + [전치사구 in the whole country] : \"전국에 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행(be동사 + 동명사)\u003c/span> : [주어 복수] + were + [동명사 using] + [목적어 it] : \"그것을 사용하고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"Soon, 곧. students in the whole country, 전국의 학생들이. were using it, 그것을 사용하고 있었다. 이 문장 전체를 해석하면, 곧, 전국의 학생들이 그것을 사용하고 있었다.","hl":"m"},{"n":56,"text":"마지막 문장에서는 frindle이 이제 전국으로 퍼진 결과를 보여 줘요. 과거진행형을 써서 그 사용이 한순간이 아니라 계속 이어지고 있던 상황을 그려 주죠. 교실에서 시작된 말이 나라 전체로 번진 거예요.","hl":"mn"},{"n":57,"text":"먼저 were using을 보세요. 과거의 어느 시점에 진행 중이던 일은 were와 동명사를 함께 써서 표현해요. 그래서 그것을 사용하고 있었다가 되는 거죠. 단순과거 used보다 과정과 퍼져 나가는 느낌을 살려 줍니다. 다음으로 in the whole country인데요, students 뒤에서 범위를 전국으로 넓혀 주는 전치사구예요. whole이 들어가서 나라 전체라는 강조의 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어느 날 수업이 끝난 후 Granger 선생님은 Nick을 불러 frindle 사용을 멈추라고 말했어요. \u003cb class=\"key\">제지\u003c/b>\u003c/li>\u003cli>Nick은 정말 죄송하지만 이제는 모두가 그 단어를 쓰기 때문에 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">늦었다\u003c/b>고 답했어요.\u003c/li>\u003cli>선생님은 Nick을 위해 쓴 \u003cb class=\"key\">편지\u003c/b>를 꺼내 언젠가 보내겠다고 했고, 다음 날 학급 전체에 다시 금지령을 내렸어요.\u003c/li>\u003cli>하지만 금지에도 불구하고 더 많은 학생들이 frindle을 썼고, 결국 \u003cb class=\"key\">전국\u003c/b>의 학생들이 사용하게 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Despite Mrs. Granger's repeated ban, the word frindle spread and was finally used by students across the whole country.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Granger 선생님은 frindle이 진짜 단어가 아니라며 Nick과 학급 전체에게 사용을 거듭 금지했지만, 그 단어는 점점 더 많은 학생들에게 퍼져 결국 \u003cb class=\"key\">전국\u003c/b>의 학생들이 사용하게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"오늘 글을 정리해 볼게요. Granger 선생님은 frindle을 쓰지 말라고 여러 번 금지했지만, 그 단어는 점점 더 많은 학생들에게 퍼져 결국 전국에서 쓰이게 됐어요. 언어는 권위가 아니라 사람들의 실제 사용 속에서 살아 움직인다는 점이 이 장면의 핵심이에요. 오늘 배운 시간순 구조와 신호어, 핵심 단어들을 꼭 복습해 두세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
