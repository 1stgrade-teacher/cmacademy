  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"문법1","title":"중1 동아(이) 5과 현재완료 문제풀이","audioDir":"문제풀이_중1_동아(이)_5과_현재완료·현재완료_진행형·since_for·과거시제_구별_audio","preview":false,"count":114,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">현재완료·현재완료 진행형·since/for·과거시제 구별\u003c/div>\u003ch1>중1 동아(이) 5과 현재완료 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>15문제 · 양자택일, 보기 활용 빈칸 완성, 틀린 부분 고치기, 문장 전환 빈칸 완성\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요? 오늘은 중학교 일 학년 동아 교과서 오 과의 현재완료 문제를 함께 풀어 볼 거예요. 선택형 문제부터 빈칸 완성, 어법 고치기, 문장 전환 문제까지 순서대로 확인하면서 현재완료의 핵심을 잡아 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료의 기본 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 \u003cb class=\"key\">have/has + 과거분사\u003c/b>로 쓰며, 과거의 일이 현재와 이어지거나 현재 결과를 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have/has + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>3인칭 단수 주어에는 has를 쓴다\u003c/li>\u003cli>부정문은 have/has not + p.p.\u003c/li>\u003cli>의문문은 Have/Has + 주어 + p.p.?\u003c/li>\u003cli>과거형과 과거분사를 구별한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have finished my homework.\u003c/div>\u003cdiv class=\"g-ko\">나는 숙제를 끝냈다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has not arrived yet.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 아직 도착하지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"현재완료는 모양부터 익혀 두면 쉬워요. 주어 뒤에 have나 has를 쓰고, 그다음에 과거분사를 붙입니다. 주어가 he, she, it처럼 삼인칭 단수이면 has를 써요. 부정문은 have나 has 뒤에 not을 넣고, 의문문은 have나 has를 문장 앞으로 보내면 됩니다. 과거분사는 동사 뒤에 ed를 붙이거나 seen, eaten처럼 불규칙으로 바뀌는 형태예요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">since와 for의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">since\u003c/b> 뒤에는 시작 시점, \u003cb class=\"key\">for\u003c/b> 뒤에는 기간이 온다.\u003cdiv>\u003cspan class=\"g-formula\">since + 시작점 / for + 기간\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>since: last year, the beginning of June 같은 시작점\u003c/li>\u003cli>for: two weeks, ten years, a long time 같은 기간\u003c/li>\u003cli>현재완료·현재완료 진행형과 잘 어울린다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He has lived here \u003cspan class=\"fx\">since last year\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 작년부터 여기 살았다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has been reading \u003cspan class=\"fx\">for two hours\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 두 시간 동안 읽고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"since와 for는 모양이 비슷해 보여도 쓰임이 달라요. since 뒤에는 작년, 월 초처럼 일이 시작된 시점이 옵니다. for 뒤에는 두 주, 십 년처럼 얼마 동안인지 기간이 와요. 그러니까 뒤에 시작점이 보이면 since, 기간이 보이면 for라고 생각하면 됩니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료와 과거시제의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">last month, yesterday, ago\u003c/b>처럼 정확한 과거 시점을 나타내는 표현이 있으면 \u003cb class=\"key\">과거시제\u003c/b>를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">과거 시점 표현 + 과거동사 / since·for·ever·already·yet + 현재완료\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>현재완료는 막연한 과거·경험·계속·완료\u003c/li>\u003cli>과거시제는 끝난 과거의 일\u003c/li>\u003cli>last, ago, yesterday와 현재완료는 함께 쓰지 않음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I met him last month.\u003c/div>\u003cdiv class=\"g-ko\">나는 지난달에 그를 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I have met him before.\u003c/div>\u003cdiv class=\"g-ko\">나는 전에 그를 만난 적이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"현재완료와 과거시제는 시간 표현으로 구별할 수 있어요. last month, yesterday, ago처럼 끝난 과거의 시점을 콕 집어 말할 때는 과거시제를 씁니다. 반면에 since, for, ever, already, yet처럼 현재와 연결되는 표현이 있으면 현재완료가 자연스러워요. 문제에서 시간 표현을 먼저 찾는 습관을 가져 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">She \u003cspan class=\"p-box\">\u003cspan>hasn't attended\u003c/span>\u003ci>/\u003c/i>\u003cspan>didn't attend\u003c/span>\u003c/span> any parties since she came to Korea.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">hasn't attended\u003c/div>\u003cdiv class=\"p-op\">didn't attend\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hasn't attended\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":5,"text":"첫 번째 문제는 since가 나오는 문장이에요. 어떤 시제가 과거부터 지금까지를 나타내는지 보세요.","hl":"q"},{"n":6,"text":"","hl":"q","pause":7},{"n":7,"text":"정답은 has not attended입니다. since she came to Korea처럼 과거 시작점부터 현재까지 이어질 때는 현재완료를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">She \u003cspan class=\"p-box\">\u003cspan class=\"ok\">hasn't attended\u003c/span>\u003ci>/\u003c/i>\u003cspan>didn't attend\u003c/span>\u003c/span> any parties since she came to Korea.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">hasn't attended\u003c/div>\u003cdiv class=\"p-op\">didn't attend\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 보기\u003c/b>문장 끝의 \u003cb class=\"key\">since she came to Korea\u003c/b>는 ‘한국에 온 이후 지금까지’라는 뜻이에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 확인\u003c/b>과거의 한 시점부터 현재까지 이어지는 일이므로 \u003cb class=\"key\">현재완료\u003c/b>가 필요해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>\u003cb class=\"key\">hasn't attended\u003c/b>는 현재완료 부정이고, didn't attend는 과거시제라 since와 자연스럽지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 hasn't attended\u003c/span>\u003cdiv class=\"p-full\">She hasn't attended any parties since she came to Korea.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 한국에 온 이후로 어떤 파티에도 참석하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>since가 있으면 무조건 현재완료라고 외우기보다 ‘과거 시작점에서 현재까지’라는 의미인지 확인하세요.\u003c/div>","segs":[{"n":8,"text":"먼저 문장 끝을 보면 since she came to Korea가 있어요. 이 표현은 과거의 시작점부터 지금까지 이어진다는 신호예요.","hl":"st-0"},{"n":9,"text":"한국에 온 뒤로 지금까지 파티에 가지 않았다는 뜻이므로 현재완료를 써야 해요.","hl":"st-1"},{"n":10,"text":"그래서 has not attended가 정답이고, did not attend는 과거의 한 사건만 말하므로 since와 어울리지 않아요.","hl":"st-2"},{"n":11,"text":"이 문제의 함정도 짚고 갈게요. since가 있으면 무조건 현재완료라고 외우기보다 ‘과거 시작점에서 현재까지’라는 의미인지 확인하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료 진행형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">have/has been + 동사원형-ing\u003c/b>는 과거에 시작한 일이 지금까지 계속되고 있음을 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have/has been + V-ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>for/since와 함께 자주 쓴다\u003c/li>\u003cli>계속의 의미를 강조한다\u003c/li>\u003cli>have/has 뒤에는 been, 그 뒤에는 -ing\u003c/li>\u003cli>의문문은 How long have you been ~? 형태로 자주 쓴다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">have been running\u003c/span> for ten years.\u003c/div>\u003cdiv class=\"g-ko\">그들은 십 년 동안 달려 오고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">How long \u003cspan class=\"fx\">have you been studying\u003c/span> English?\u003c/div>\u003cdiv class=\"g-ko\">너는 영어를 얼마나 오래 공부해 오고 있니?\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"현재완료 진행형은 과거에 시작한 일이 지금도 계속되고 있다는 것을 보여 줘요. 형태는 have나 has 뒤에 been을 쓰고, 그 뒤에 동사에 ing를 붙인 형태를 놓습니다. for나 since 같은 표현과 함께 자주 나오고요. have been 다음에 동사원형이 아니라 ing 형태가 온다는 점을 꼭 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">They have been \u003cspan class=\"p-box\">\u003cspan>run\u003c/span>\u003ci>/\u003c/i>\u003cspan>running\u003c/span>\u003c/span> in marathons for about 10 years.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">run\u003c/div>\u003cdiv class=\"p-op\">running\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">running\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":13,"text":"두 번째 문제는 have been 뒤에 무엇이 오는지 묻고 있어요. 뒤의 for 표현도 함께 보세요.","hl":"q"},{"n":14,"text":"","hl":"q","pause":7},{"n":15,"text":"정답은 running입니다. have been running은 과거부터 지금까지 계속 뛰고 있다는 현재완료 진행형이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">They have been \u003cspan class=\"p-box\">\u003cspan>run\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">running\u003c/span>\u003c/span> in marathons for about 10 years.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">run\u003c/div>\u003cdiv class=\"p-op\">running\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">have been 뒤 확인\u003c/b>\u003cb class=\"key\">have been\u003c/b> 뒤에는 현재완료 진행형을 만드는 \u003cb class=\"key\">-ing\u003c/b>가 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>for about 10 years는 ‘약 십 년 동안’이라 계속 이어지는 의미예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>run은 동사원형이라 have been 뒤에 바로 못 오고, \u003cb class=\"key\">running\u003c/b>이 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 running\u003c/span>\u003cdiv class=\"p-full\">They have been running in marathons for about 10 years.\u003c/div>\u003cdiv class=\"p-ko\">그들은 약 십 년 동안 마라톤을 뛰어 오고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>have been 뒤에 p.p.가 아니라 -ing가 오면 현재완료 진행형입니다.\u003c/div>","segs":[{"n":16,"text":"먼저 have been 뒤에 무엇이 오는지 보세요. 현재완료 진행형을 만들려면 동사에 ing를 붙인 형태가 와야 해요.","hl":"st-0"},{"n":17,"text":"뒤에 for about ten years가 있으므로 약 십 년 동안 계속 달려 오고 있다는 의미예요.","hl":"st-1"},{"n":18,"text":"run은 동사원형이라 have been 뒤에 바로 오지 못하고, running이 알맞습니다.","hl":"st-2"},{"n":19,"text":"이 문제의 함정도 짚고 갈게요. have been 뒤에 p.p.가 아니라 -ing가 오면 현재완료 진행형입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">경험을 묻는 현재완료 ever와 never\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">ever\u003c/b>는 의문문에서 ‘지금까지 ~해 본 적 있니?’를, \u003cb class=\"key\">never\u003c/b>는 ‘한 번도 ~해 본 적 없다’를 나타내며 \u003cb class=\"key\">have/has + p.p.\u003c/b> 구조를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">Have/Has + 주어 + ever + p.p.? / 주어 + have/has + never + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>ever는 주로 의문문에 쓴다\u003c/li>\u003cli>never는 have/has 뒤, p.p. 앞에 둔다\u003c/li>\u003cli>과거형과 과거분사를 구별한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Have you ever seen a shooting star?\u003c/div>\u003cdiv class=\"g-ko\">너는 별똥별을 본 적이 있니?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I have never eaten dim sum.\u003c/div>\u003cdiv class=\"g-ko\">나는 딤섬을 한 번도 먹어 본 적이 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"경험을 말할 때는 현재완료를 자주 써요. ever는 의문문에서 지금까지 한 번이라도 해 본 적이 있는지 물을 때 사용합니다. never는 한 번도 해 본 적이 없다는 뜻으로 have나 has 뒤, 과거분사 앞에 놓아요. 이때 saw가 아니라 seen처럼 과거분사를 골라야 한다는 점을 꼭 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Have you ever \u003cspan class=\"p-box\">\u003cspan>saw\u003c/span>\u003ci>/\u003c/i>\u003cspan>seen\u003c/span>\u003c/span> a shooting star in the night sky?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">saw\u003c/div>\u003cdiv class=\"p-op\">seen\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">seen\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"세 번째 문제는 ever가 들어간 경험 묻기 문장이에요. Have you 뒤에 어떤 형태가 와야 하는지 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":7},{"n":23,"text":"정답은 seen입니다. 현재완료 경험을 물을 때는 과거분사 seen을 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv clas
