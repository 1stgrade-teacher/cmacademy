o)를 배경으로 하고 있는데, 이곳에는 설악산(Seoraksan)의 유명한 바위인 흔들바위(Heundeulbawi)처럼 자연의 신비함을 느낄 수 있는 명소들이 많아요. 흔들바위는 겉보기엔 위태로워 보이지만, 실제로 밀어보면 조금씩 흔들릴 뿐 절대 떨어지지 않아 많은 사람에게 재미있는 체험 거리로 알려져 있죠. 또한, 속초는 동해안에 위치해 있어서 새벽에 일출(Sunrise)을 감상하기에 최적의 장소이며, 바다와 산을 동시에 즐길 수 있다는 큰 장점이 있어요. 마지막으로, 등대 전망대(Lighthouse Observatory)와 같이 바다를 지키는 시설은 항해하는 배들의 안전을 책임지는 길잡이 역할을 하는데, 이런 장소들은 지역의 역사와 풍경을 동시에 관찰할 수 있는 중요한 교육적 공간이기도 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행의 시작과 첫째 날</div><ul><li>런던에서 온 아멜리아가 수빈이네 가족과 함께 속초로 여행을 떠나 즐거운 시간을 보냅니다.</li><li>설악산 흔들바위(Heundeulbawi) 체험</li><li>속초 해변에서 텐트 치고 저녁 식사</li><li>핵심 키워드: 여행 일기(travel diary), 캠핑(tents)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02둘째 날 아침과 감자전</div><ul><li>이른 아침 일출을 감상하고 속초의 지역 음식인 감자전을 맛봅니다.</li><li>해변에서 일출(sunrise) 보며 소원 빌기</li><li>한국식 부침개인 감자전(gamjajeon) 시식</li><li>핵심 키워드: 일출(sunrise), 소원(wish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03등대 전망대 관람</div><ul><li>여행의 마지막 일정으로 등대 전망대에 올라 아름다운 경치를 감상합니다.</li><li>가파른 계단을 올라 속초 등대 전망대(Lighthouse Observatory) 방문</li><li>도시와 바다, 산이 어우러진 풍경 감상</li><li>핵심 키워드: 등대(lighthouse), 경치(view)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04여행의 마무리</div><ul><li>아멜리아는 이번 여행의 모든 순간을 소중히 여기며 한국에서의 추억을 간직하기로 합니다.</li><li>사진 촬영을 통해 여행 기록 남기기</li><li>한국을 잊지 않겠다는 다짐</li><li>핵심 키워드: 추억(remember), 순간(moment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr><tr><td class=\"w\">diary</td><td class=\"m\">일기</td></tr><tr><td class=\"w\">hike</td><td class=\"m\">하이킹하다, 도보 여행을 하다</td></tr><tr><td class=\"w\">push</td><td class=\"m\">밀다</td></tr><tr><td class=\"w\">shake</td><td class=\"m\">흔들리다</td></tr><tr><td class=\"w\">scary</td><td class=\"m\">무서운</td></tr><tr><td class=\"w\">put up</td><td class=\"m\">(텐트 등을) 치다, 설치하다</td></tr><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">sunrise</td><td class=\"m\">일출, 해돋이</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rise</td><td class=\"m\">오르다, 뜨다</td></tr><tr><td class=\"w\">make a wish</td><td class=\"m\">소원을 빌다</td></tr><tr><td class=\"w\">lighthouse</td><td class=\"m\">등대</td></tr><tr><td class=\"w\">observatory</td><td class=\"m\">관측소, 전망대</td></tr><tr><td class=\"w\">steep</td><td class=\"m\">가파른</td></tr><tr><td class=\"w\">view</td><td class=\"m\">경치, 전망</td></tr><tr><td class=\"w\">shine</td><td class=\"m\">빛나다</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운</td></tr><tr><td class=\"w\">moment</td><td class=\"m\">순간</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즐거움은</span><span class=\"en\"><b><span class=\"grammar-hl\">Fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">속초에서의!</span><span class=\"en\"><b>in Sokcho!</b></span></div></div><div class=\"lec-sent-ko\">속초에서의 즐거움!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 전체적인 주제를 나타내는 제목으로, 속초 여행이 매우 즐거웠음을 암시하며 독자의 관심을 끕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Fun (관용표현): 형용사(fun)를 활용한 감탄문 형태의 문장으로, 구체적인 주어와 동사를 생략하여 일상적인 상황을 강조함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아멜리아는</span><span class=\"en\"><b>Amelia</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">출신이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던으로부터.</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> London.</b></span></div></div><div class=\"lec-sent-ko\">Amelia는 런던 출신이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 아멜리아가 어디에서 왔는지를 소개하며 이야기를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is from (관용표현): &#39;be from + 장소&#39; 구조로, &#39;~출신이다&#39;라는 소속이나 기원을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주에,</span><span class=\"en\"><b>Last week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>she</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">속초에</span><span class=\"en\"><b>to Sokcho</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수빈이네 가족과 함께.</span><span class=\"en\"><b>with Subin’s family.</b></span></div></div><div class=\"lec-sent-ko\">지난주에, 그녀는 수빈이의 가족과 함께 속초에 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 아멜리아가 누구와, 어디로 여행을 갔는지 구체적인 상황을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went 과거 시제: 주어(she)의 과거의 동작이나 상태를 서술함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기에</span><span class=\"en\"><b><span class=\"grammar-hl\">Here</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아멜리아의 여행 일기가.</span><span class=\"en\"><b>Amelia’s travel diary.</b></span></div></div><div class=\"lec-sent-ko\">이것은 Amelia의 여행기이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 나올 글이 아멜리아가 직접 쓴 일기 형식임을 알려주며 글의 성격을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here is (도치): 장소 부사(Here)가 문두로 오면서 주어(Amelia’s travel diary)와 동사(is)의 위치가 바뀐 도치 구문임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr><tr><td class=\"w\">diary</td><td class=\"m\">일기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">9월 5일 금요일</span><span class=\"en\"><b>Friday, September 5th</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨가</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맑았는데</span><span class=\"en\"><b>sunny</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘.</span><span class=\"en\"><b>today.</b></span></div></div><div class=\"lec-sent-ko\">9월 5일, 금요일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본격적인 시작을 알리는 일기 날짜를 기록합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was (가주어): 진주어의 변형: 날씨를 나타내는 비인칭 주어(it)를 사용한 문장임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\" \" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 과거 시제: 전체 여행에 대한 평가를 과거형으로 서술함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">moment</td><td class=\"m\">순간</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 37 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 찍었다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사진을.</span><span class=\"en\"><b>many pictures.</b></span></div></div><div class=\"lec-sent-ko\">나는 많은 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 추억을 간직하기 위한 행동입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took 과거 시제: 사진을 찍었다는 과거의 동작을 표현함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 38 / 38</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 항상 기억할 것이다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">will always remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국을.</span><span class=\"en\"><b>Korea.</b></span></div></div><div class=\"lec-sent-ko\">나는 언제나 한국을 기억할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국 여행에 대한 만족감과 앞으로의 다짐을 담은 마무리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will always remember 미래 시제: 조동사(will)를 사용하여 미래에도 계속 기억할 것임을 표현함.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>런던에서 온 아멜리아는 수빈이네 가족과 함께 속초로 여행을 떠났다.</li><li>설악산 흔들바위와 속초 해수욕장에서 즐거운 시간을 보냈다.</li><li>둘째 날에는 일출을 보며 소원을 빌고, 감자전을 먹으며 한국 음식을 경험했다.</li><li>마지막으로 등대 전망대에 올라 속초의 아름다운 경치를 감상하며 한국 여행의 소중한 추억을 남겼다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Amelia visited famous landmarks and enjoyed local food with her friend&#39;s family, so she created unforgettable memories in Korea.</div>\n              <div class=\"lec-final-sum-ko\">아멜리아는 친구 가족과 함께 유명한 명소를 방문하고 지역 음식을 즐기며, 한국에서의 잊지 못할 추억을 만들었다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"},{"audio":"./full_audio/7.mp3","hl":"stage-3"}],[{"audio":"./full_audio/8.mp3","hl":null}],[{"audio":"./full_audio/9.mp3","hl":"main"},{"audio":"./full_audio/10.mp3","hl":"meaning"},{"audio":"./full_audio/11.mp3","hl":"grammar"}],[{"audio":"./full_audio/12.mp3","hl":"main"},{"audio":"./full_audio/13.mp3","hl":"meaning"},{"audio":"./full_audio/14.mp3","hl":"grammar"}],[{"audio":"./full_audio/15.mp3","hl":"main"},{"audio":"./full_audio/16.mp3","hl":"meaning"},{"audio":"./full_audio/17.mp3","hl":"grammar"}],[{"audio":"./full_audio/18.mp3","hl":"main"},{"audio":"./full_audio/19.mp3","hl":"meaning"},{"audio":"./full_audio/20.mp3","hl":"grammar"}],[{"audio":"./full_audio/21.mp3","hl":"main"},{"audio":"./full_audio/22.mp3","hl":"meaning"},{"audio":"./full_audio/23.mp3","hl":"grammar"}],[{"audio":"./full_audio/24.mp3","hl":"main"},{"audio":"./full_audio/25.mp3","hl":"meaning"},{"audio":"./full_audio/26.mp3","hl":"grammar"}],[{"audio":"./full_audio/27.mp3","hl":"main"},{"audio":"./full_audio/28.mp3","hl":"meaning"},{"audio":"./full_audio/29.mp3","hl":"grammar"}],[{"audio":"./full_audio/30.mp3","hl":"main"},{"audio":"./full_audio/31.mp3","hl":"meaning"},{"audio":"./full_aud
