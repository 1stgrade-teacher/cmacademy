인 친구에게 한국의 자연과 문화를 어떻게 설명하면 좋을지 생각해보면 더 재미있게 이해할 수 있을 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01여행의 시작과 설악산 등반</div><ul><li>아멜리아는 수빈이네 가족과 함께 설악산에 올라 흔들바위를 경험했다.</li><li>설악산(Seoraksan) 등반 및 거대한 바위 발견</li><li>흔들바위(Heundeulbawi)를 밀어보며 스릴을 느낌</li><li>핵심 키워드: 등반(hike), 흔들바위(Heundeulbawi)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02속초 해변에서의 저녁 시간</div><ul><li>등반을 마친 일행은 속초 해변으로 이동하여 즐거운 저녁 시간을 보냈다.</li><li>해변 근처에 텐트(tents) 설치</li><li>맛있는 한국식 소고기(Korean beef)로 저녁 식사</li><li>핵심 키워드: 속초 해변(Sokcho Beach), 텐트(tents)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03밤의 정취와 기대감</div><ul><li>텐트 안에서 파도 소리를 들으며 수빈과 소중한 추억을 쌓았다.</li><li>파도(waves) 소리를 들으며 대화와 웃음꽃을 피움</li><li>다음 날 아침 일출(sunrise)을 보기를 간절히 기대함</li><li>핵심 키워드: 일출(sunrise), 파도(waves)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr><tr><td class=\"w\">diary</td><td class=\"m\">일기</td></tr><tr><td class=\"w\">hike</td><td class=\"m\">도보 여행을 하다, 하이킹하다</td></tr><tr><td class=\"w\">push</td><td class=\"m\">밀다</td></tr><tr><td class=\"w\">shake</td><td class=\"m\">흔들리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scary</td><td class=\"m\">무서운</td></tr><tr><td class=\"w\">put up</td><td class=\"m\">세우다, 설치하다</td></tr><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr><tr><td class=\"w\">wave</td><td class=\"m\">파도</td></tr><tr><td class=\"w\">sunrise</td><td class=\"m\">일출</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Amelia는</span><span class=\"en\"><b><span class=\"grammar-hl\">Amelia</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">출신이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던</span><span class=\"en\"><b><span class=\"grammar-hl\">from London.</span></b></span></div></div><div class=\"lec-sent-ko\">Amelia는 런던 출신이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아멜리아가 어디에서 왔는지를 밝히며, 이 글의 화자인 아멜리아가 외국인임을 암시하여 이후 한국 여행 중 겪는 경험이 새로운 문화적 체험임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Amelia is from London. (기본문장구조): S(Amelia) + V(is) + 전치사구(from London)의 1형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주에,</span><span class=\"en\"><b>Last week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b><span class=\"grammar-hl\">she</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갔는데</span><span class=\"en\"><b><span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">속초에</span><span class=\"en\"><b><span class=\"grammar-hl\">to Sokcho</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수빈이의 가족과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with Subin’s family.</span></b></span></div></div><div class=\"lec-sent-ko\">지난주에, 그녀는 수빈이의 가족과 함께 속초에 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간적 배경과 장소, 그리고 동행인을 소개하며 본격적인 여행 일기가 시작됨을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">she went to Sokcho with Subin’s family. (기본문장구조): S(she) + V(went) + 부사구(to Sokcho) + 부사구(with Subin’s family)의 1형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Here</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Amelia의 여행기</span><span class=\"en\"><b>Amelia’s travel diary.</b></span></div></div><div class=\"lec-sent-ko\">이것은 Amelia의 여행기이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어지는 내용이 개인적인 여행 기록임을 안내하는 도입부 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here is (도치): 유도부사 Here가 문장 맨 앞에 오면서 주어(Amelia’s travel diary)와 동사(is)가 도치된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel</td><td class=\"m\">여행</td></tr><tr><td class=\"w\">diary</td><td class=\"m\">일기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">금요일,</span><span class=\"en\"><b><span class=\"grammar-hl\">Friday, September 5th</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">9월 5일</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">9월 5일, 금요일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일기의 형식을 갖추기 위해 구체적인 날짜를 명시했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Friday, September 5th (명사구): 날짜를 나타내는 명사구로 문장의 독립된 정보로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 등산이라는 활동을 구체적으로 설명하며, 다음 문장에 나올 &#39;흔들바위&#39;에 대한 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hiked Seoraksan and saw a very big rock. (병렬구조): and를 중심으로 과거동사 hiked와 saw가 연결되어 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hike</td><td class=\"m\">도보 여행을 하다, 하이킹하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔들바위였다.</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔들바위</span><span class=\"en\"><b><span class=\"grammar-hl\">Heundeulbawi.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 흔들바위였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;큰 바위&#39;의 정체를 밝히는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was Heundeulbawi. (기본문장구조): S(It) + V(was) + C(Heundeulbawi)의 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수빈이와 나는</span><span class=\"en\"><b>Subin and I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀었다</span><span class=\"en\"><b><span class=\"grammar-hl\">pushed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"><b>it.</b></span></div></div><div class=\"lec-sent-ko\">수빈이와 나는 그것을 밀었다.</div></div>\n        <div class=\ ass=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b><span class=\"grammar-hl\">I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐거웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">had</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말</span><span class=\"en\"><b><span class=\"grammar-hl\">a lot of fun!</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 무서웠지만, 나는 정말 즐거웠다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> scary는 사전적으로 &#39;무서운&#39;이지만, 여기서는 바위가 떨어질까 봐 느끼는 긴장감을 뜻합니다. 자연의 경이로움을 체험하며 느끼는 감정을 솔직하게 표현하고자 이 단어를 썼습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was scary, but I had a lot of fun! (관용표현): have a lot of fun은 &#39;매우 즐거운 시간을 보내다&#39;라는 의미의 관용적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scary</td><td class=\"m\">무서운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그다음에,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b><span class=\"grammar-hl\">we</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갔다</span><span class=\"en\"><b><span class=\"grammar-hl\">went</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">속초 해수욕장으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to Sokcho Beach.</span></b></span></div></div><div class=\"lec-sent-ko\">그다음에, 우리는 속초 해수욕장으로 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 장소 이동을 나타내며 여행의 흐름을 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">we went to Sokcho Beach. (기본문장구조): S(we) + V(went) + 부사구(to Sokcho Beach)의 1형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쳤는데</span><span class=\"en\"><b><span class=\"grammar-hl\">put up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 텐트를</span><span class=\"en\"><b>two tents</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해변 근처에</span><span class=\"en\"><b>near the beach.</b></span></div></div><div class=\"lec-sent-ko\">우리는 해변 근처에 두 개의 텐트를 쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 야영을 준비하는 모습을 보여주며 해변에서의 활동을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">put up (관용표현): &#39;설치하다, 세우다&#39;라는 의미를 가진 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">put up</td><td class=\"m\">세우다, 설치하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹었다</span><span class=\"en\"><b><span class=\"grammar-hl\">had</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한우를</span><span class=\"en\"><b><span class=\"grammar-hl\">Korean beef</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저녁 식사로</span><span class=\"en\"><b><span class=\"grammar-hl\">for dinner.</span></b></span></div></div><div class=\"lec-sent-ko\">우리는 저녁 식사로 한우를 먹었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한국 여행의 즐거움 중 하나인 음식을 경험하고 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had Korean beef for dinner. (기본문장구조): S(We) + V(had) + O(Korean beef)의 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛있었다!</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛있고</span><span class=\"en\"><b><span class=\"grammar-hl\">delicious!</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 맛있었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식사에 대한 만족감을 강조하며 글의 밝은 분위기를 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was delicious! (기본문장구조): S(It) + V(was) + C(delicious, 형용사)의 2형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 텐트 안에서,</span><span class=\"en\"><b>In our tent,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수빈이와 나는</span><span class=\"en\"><b>Subin and I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파도 소리를</span><span class=\"en\"><b><span class=\"grammar-hl\">the waves.</span></b></span></div></div><div class=\"lec-sent-ko\">우리 텐트 안에서, 수빈이와 나는 파도 소리를 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행지의 풍경과 소리를 감각적으로 묘사하여 현장감을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">heard the waves. (지각동사): S(Subin and I) + V(heard) + O(the waves)의 3형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wave</td><td class=\"m\">파도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기하고</span><span class=\"en\"><b><span class=\"grammar-hl\">talked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b><span class=\"grammar-hl\">and</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웃었다</span><span class=\"en\"><b><span class=\"grammar-hl\">laughed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많이</span><span class=\"en\"><b>a lot.</b></span></div></div><div class=\"lec-sent-ko\">우리는 많이 이야기하고 웃었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 친구와 함께하는 시간의 즐거움을 표현하며 긍정적인 관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">talked and laughed (병렬구조): 과거동사 talked와 laughed가 and를 통해 연결되어 주어의 행동을 나열합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는</span><span class=\"en\"><b>I</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말</span><span class=\"en\"><b>really</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보고 싶다</span><span class=\"en\"><b>want <span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해돋이를</span><span class=\"en\"><b>the sunrise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내일</span><span class=\"en\"><b>tomorrow.</b></span></div></div><div class=\"lec-sent-ko\">나는 내일 해돋이를 정말 보고 싶다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 남은 기대감을 드러내며 일기를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): want의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sunrise</td><td class=\"m\">일출</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>런던에서 온 아멜리아가 수빈이네 가족과 함께 속초 여행을 떠났다.</li><li>설악산 흔들바위를 밀어보고 속초 해변에서 텐트를 치며 한국의 즐거운 추억을 쌓았다.</li><li>맛있는 음식과 함께 파도 소리를 들으며 친구와 행복한 시간을 보냈다.</li><li>여행의 마무리로 내일 일출을 보고 싶다는 기대를 표현했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Amelia hiked Seoraksan with Subin’s family, and she spent an enjoyable evening camping and eating dinner at the beach.</div>\n              <div class=\"lec-final-sum-ko\">아멜리아는 수빈이네 가족과 함께 설악산을 등반했으며, 해변에서 캠핑을 하고 저녁을 먹으며 즐거운 시간을 보냈다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"}],[{"audio":"./1_audio/7.mp3","hl":null}],[{"audio":"./1_audio/8.mp3","hl":"main"},{"audio":"./1_audio/9.mp3","hl":"meani
