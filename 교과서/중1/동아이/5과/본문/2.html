양(sunrise)</li><li>소원을 빌며(make a wish) 아침을 시작함</li><li>핵심 키워드: 일출(sunrise), 소원(wish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02점심 식사와 명소 방문</div><ul><li>속초의 지역 음식을 맛보고 등대 전망대에 올라 주변 경치를 관람했다.</li><li>점심으로 감자전(gamjajeon)을 맛있게 먹음</li><li>속초 등대 전망대(Sokcho Lighthouse Observatory)로 이동</li><li>가파른 계단을 올라가며 다리가 피곤함을 느낌</li><li>정상에서 도시, 바다, 산을 한눈에 조망함</li><li>핵심 키워드: 전망대(observatory), 가파른(steep)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03등대의 의미와 여행 마무리</div><ul><li>오랜 역사를 간직한 등대의 가치를 확인하며 즐거웠던 여행을 되새겼다.</li><li>70년 된 등대가 밤마다 배들을 위해 빛을 비춘다는 사실을 알게 됨</li><li>여행의 모든 순간이 훌륭했음을 느낌</li><li>많은 사진을 찍으며 한국에서의 추억을 소중히 간직함</li><li>핵심 키워드: 등대(lighthouse), 추억(remember)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wake up</td><td class=\"m\">잠에서 깨다</td></tr><tr><td class=\"w\">early</td><td class=\"m\">일찍</td></tr><tr><td class=\"w\">dark</td><td class=\"m\">어두운</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖에</td></tr><tr><td class=\"w\">beach</td><td class=\"m\">해변</td></tr><tr><td class=\"w\">slowly</td><td class=\"m\">천천히</td></tr><tr><td class=\"w\">turn</td><td class=\"m\">~로 변하다</td></tr><tr><td class=\"w\">rise</td><td class=\"m\">떠오르다</td></tr><tr><td class=\"w\">make a wish</td><td class=\"m\">소원을 빌다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">close</td><td class=\"m\">감다(눈을)</td></tr><tr><td class=\"w\">lunch</td><td class=\"m\">점심 식사</td></tr><tr><td class=\"w\">pancake</td><td class=\"m\">팬케이크(납작한 요리)</td></tr><tr><td class=\"w\">visit</td><td class=\"m\">방문하다</td></tr><tr><td class=\"w\">steep</td><td class=\"m\">가파른</td></tr><tr><td class=\"w\">stair</td><td class=\"m\">계단</td></tr><tr><td class=\"w\">tired</td><td class=\"m\">피곤한</td></tr><tr><td class=\"w\">top</td><td class=\"m\">꼭대기</td></tr><tr><td class=\"w\">view</td><td class=\"m\">경치, 전망</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">9월 6일 토요일</span><span class=\"en\"><b><span class=\"grammar-hl\">Saturday, September 6th</span></b></span></div></div><div class=\"lec-sent-ko\">9월 6일, 토요일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일기 형식의 글임을 알리며, 여행 중 있었던 구체적인 날짜를 언급하여 기록의 시작을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Saturday, September 6th (관용표현): 날짜와 요일을 나타내는 표현으로, 명사구로 문장을 시작하여 일기나 기록의 성격을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 일어났는데</span><span class=\"en\"><b>We <span class=\"grammar-hl\">woke up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 일찍.</span><span class=\"en\"><b>very early.</b></span></div></div><div class=\"lec-sent-ko\">우리는 아주 일찍 일어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 본격적인 시작을 알리는 문장으로, 3번 문장에서 이어질 일출을 보기 위한 행동을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">woke up (관용표현): &#39;일어나다&#39;라는 의미의 구동사(Phrasal verb)로, wake와 up이 결합하여 하나의 자동사처럼 쓰입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">early</td><td class=\"m\">일찍</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어두웠는데</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span> was dark</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밖은.</span><span class=\"en\"><b>outside.</b></span></div></div><div class=\"lec-sent-ko\">밖은 어두웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 일찍 일어난 이유가 아직 해가 뜨기 전임을 강조하며, 시간적 배경을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It (가주어): 진주어(유사 개념): 여기서는 날씨나 상황을 나타내는 비인칭 주어 It으로, 특정한 대상 없이 상태를 묘사합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dark</td><td class=\"m\">어두운</td></tr><tr><td class=\"w\">outside</td><td class=\"m\">밖에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수빈이와 나는</span><span class=\"en\"><b><span class=\"grammar-hl\">Subin and I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달려갔고</span><span class=\"en\"><b><span class=\"grammar-hl\">ran</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해변으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to the beach</span>.</b></span></div></div><div class=\"lec-sent-ko\">수빈이와 나는 해변으로 달려갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일출을 보기 위해 이동하는 장면이며, 기대감에 찬 행동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Subin and I ran to the beach 1형식 문장 구조: &#39;주어(Subin and I) + 동사(ran) + 전치사구(to the beach)&#39;로 구성된 단순 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beach</td><td class=\"m\">해변</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">천천히,</span><span class=\"en\"><b><span class=\"grammar-hl\">Slowly,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘이</span><span class=\"en\"><b><span class=\"grammar-hl\">the sky</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">붉게 변했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">turned red</span>.</b></span></div></div><div class=\"lec-sent-ko\">천천히, 하늘이 붉게 변했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> turned는 사전적으로 &#39;돌다/바뀌다&#39;인데, 여기서는 새벽의 어둠이 사라지고 해가 뜨면서 하늘의 색깔이 서서히 붉은색으로 변해가는 과정을 시각적으로 묘사합니다. 상태의 변화를 강조하기 위해 이 동사를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Slowly, the sky turned red (도치): 부사(Slowly)를 문장 맨 앞에 배치하여 동작의 양상을 강조하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slowly</td><td class=\"m\">천천히</td></tr><tr><td class=\"w\">turn</td><td class=\"m\">~로 변하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수빈이가 말했다,</span><span class=\"en\"><b>Subin said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해가</span><span class=\"en\"><b>“The sun</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뜨고 있다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">is rising</span>.</b></span></div></div><div class=\"lec-sent-ko\">수빈이가 “해가 떠오르고 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일출이라는 중요한 사건을 맞이하여 친구와 소통하는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is rising (현재진행): be동사(is) + -ing(rising)의 구조로, 현재 말하는 시점에 해가 떠오르고 있는 동작을 나타냅니다.</div></div> ></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가파른 계단을 많이.</span><span class=\"en\"><b>many steep stairs.</b></span></div></div><div class=\"lec-sent-ko\">우리는 많은 가파른 계단을 걸어 올라갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전망대에 오르는 과정의 물리적 어려움을 언급하여, 다음에 나올 결과물(아름다운 풍경)의 가치를 높이는 대비 효과를 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">walked up (관용표현): &#39;걸어 올라가다&#39;라는 의미의 구동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">steep</td><td class=\"m\">가파른</td></tr><tr><td class=\"w\">stair</td><td class=\"m\">계단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 다리는</span><span class=\"en\"><b>Our legs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피곤했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">were tired</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 다리는 피곤했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 12번 문장의 등반 과정을 겪은 후의 신체적 상태를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were tired 2형식 구조: 주어(Our legs) + be동사(were) + 보어(tired, 형용사) 구조로 주어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tired</td><td class=\"m\">피곤한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 꼭대기에서</span><span class=\"en\"><b>But <span class=\"grammar-hl\">at the top</span>,</b></span></div><div class=\"lec-chunk\"><s iv><div class=\"lec-chunk\"><span class=\"ko\">약 70년이 되었다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">is about 70 years old</span>.</b></span></div></div><div class=\"lec-sent-ko\">수빈이는 “이 등대는 약 70년이 되었어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 등대의 역사성과 기능을 통해 장소의 의미를 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is about 70 years old (관용표현): &#39;~살이다 / ~년 되었다&#39;를 나타내는 &#39;숫자 + years old&#39; 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 18 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 여전히 빛을 비추는데</span><span class=\"en\"><b>It still <span class=\"grammar-hl\">shines its light</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배들을 위해</span><span class=\"en\"><b>for ships</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밤에.</span><span class=\"en\"><b>at night.</b></span></div></div><div class=\"lec-sent-ko\">이것은 아직 밤에 선박들을 위해 빛을 비춰.”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행 전체에 대한 총평으로, 앞선 모든 경험이 만족스러웠음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shines its light 3형식 구조: 주어(It) + 동사(shines) + 목적어(its light) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 19 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 말했다,</span><span class=\"en\"><b>I said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">와,</span><span class=\"en\"><b>“Wow,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 놀라워!</span><span class=\"en\"><b><span class=\"grammar-hl\">that’s amazing</span>!</b></span></div></div><div class=\"lec-sent-ko\">나는 “와, 그거 놀랍네!”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 등대의 역할에 대한 화자의 감탄을 통해 여행지의 매력을 다시 한번 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that’s amazing (강조구문): 감탄사를 포함하여 상황에 대한 강한 인상을 강조하는 구문입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 20 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이번 여행의 모든 순간은</span><span class=\"en\"><b><span class=\"grammar-hl\">Every moment of this trip</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멋졌다.</span><span class=\"en\"><b>was wonderful.</b></span></div></div><div class=\"lec-sent-ko\">이 여행의 모든 순간이 훌륭했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행 전체에 대한 총평으로, 앞선 모든 경험이 만족스러웠음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Every moment of this trip (관용표현): &#39;Every + 단수명사&#39; 구조로 전체를 강조하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 21 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 찍었다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사진을</span><span class=\"en\"><b><span class=\"grammar-hl\">many pictures</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 많은 사진을 찍었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 추억을 간직하려는 의지를 보여주며 마무리 단계로 나아갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took many pictures (관용표현): &#39;사진을 찍다&#39;라는 뜻의 숙어적 표현(take pictures)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 22 / 22</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 항상 기억할 것이다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">will always remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국을</span><span class=\"en\"><b>Korea.</b></span></div></div><div class=\"lec-sent-ko\">나는 언제나 한국을 기억할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 소감을 최종적으로 정리하며, 이번 여행이 화자에게 큰 의미가 있었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will always remember 조동사 구문: 미래 시제(will)를 사용하여 다짐이나 미래의 사실을 표현합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>화자는 여행지(한국)에서 이른 아침 일출을 보며 소원을 빌었다.</li><li>점심에는 한국 음식인 감자전을 먹으며 즐거운 시간을 보냈다.</li><li>속초 등대전망대에 올라가 아름다운 경치를 감상하며 여행의 깊은 감동을 느꼈다.</li><li>이번 여행의 모든 순간을 사진으로 남기며 한국을 좋은 기억으로 간직하기로 했다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The writer enjoyed watching the sunrise and exploring the Sokcho Lighthouse Observatory, and they will cherish these wonderful memories of Korea.</div>\n              <div class=\"lec-final-sum-ko\">글쓴이는 일출을 감상하고 속초 등대 전망대를 둘러보며 즐거운 시간을 보냈으며, 한국에서의 이 멋진 추억들을 소중히 간직할 것이다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":null},{"audio":"./2_audio/4.mp3","hl":"stage-0"},{"audio":"./2_audio/5.mp3","hl":"stage-1"},{"audio":"./2_audio/6.mp3","hl":"stage-2"}],[{"audio":"./2_audio/7.mp3","hl":null}],[{"audio":"./2_audio/8.mp3","hl":"main"},{"audio":"./2_audio/9.mp3","hl":"meanin
