즈 요리</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">스위스의 대표적인 전통 음식인 퐁듀(Fondue)는 프랑스어의 &#39;녹이다&#39;라는 단어에서 유래했는데, 과거 알프스 산맥의 목동들이 겨울철 딱딱하게 굳은 빵을 부드럽게 먹기 위해 치즈를 녹여 찍어 먹던 것에서 시작된 지혜가 담긴 음식이에요. 퐁듀를 먹을 때는 긴 포크에 빵을 끼워 녹인 치즈에 듬뿍 찍어 먹는 것이 핵심인데, 이는 단순히 맛을 즐기는 것을 넘어 여럿이 한 냄비를 공유하며 소통과 유대감(Social Bonding)을 다지는 스위스만의 특별한 식사 문화를 보여준답니다. 최근에는 치즈뿐만 아니라 고기나 초콜릿을 활용해 다양한 방식으로 즐기기도 하지만, 원조 격인 치즈 퐁듀는 지역의 자연환경과 식생활이 결합된 상징적인 요리라고 할 수 있어요. 여러분도 이 글을 읽으면서 스위스의 따뜻하고 친근한 식사 분위기를 떠올려 보면 내용을 훨씬 재미있게 이해할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01스위스의 식문화</div><ul><li>스위스 사람들은 치즈 요리를 즐겨 먹으며, 그중에서도 퐁듀가 매우 유명하다.</li><li>대표적인 치즈 요리: 퐁듀 (fondue)</li><li>스위스 사람들이 선호하는 음식</li><li>핵심 키워드: 스위스(Switzerland), 퐁듀(fondue)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02재료 준비 및 가열</div><ul><li>퐁듀를 만드는 과정은 매우 간단하며, 치즈를 녹이는 것으로 시작한다.</li><li>냄비에 치즈를 넣고 가열함 (heat)</li><li>빵을 작은 크기로 자름 (cut)</li><li>핵심 키워드: 가열(heat), 빵(bread)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03퐁듀 즐기기</div><ul><li>준비된 빵을 녹은 치즈에 찍어 먹는 것이 퐁듀를 즐기는 방법이다.</li><li>긴 포크(long fork)를 사용하여 음식을 찍음</li><li>따뜻한 치즈에 빵을 담금 (dip)</li><li>핵심 키워드: 포크(fork), 담그다(dip)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04퐁듀의 맛</div><ul><li>잘 만들어진 퐁듀는 사람들에게 매우 맛있는 경험을 제공한다.</li><li>퐁듀의 맛에 대한 평가</li><li>매우 맛이 좋음 (delicious)</li><li>핵심 키워드: 맛(taste), 맛있는(delicious)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fondue</td><td class=\"m\">퐁듀(녹인 치즈 요리)</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">dish</td><td class=\"m\">요리</td></tr><tr><td class=\"w\">easy</td><td class=\"m\">쉬운</td></tr><tr><td class=\"w\">heat</td><td class=\"m\">데우다, 가열하다</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">냄비</td></tr><tr><td class=\"w\">cut</td><td class=\"m\">자르다</td></tr><tr><td class=\"w\">bread</td><td class=\"m\">빵</td></tr><tr><td class=\"w\">into</td><td class=\"m\">~안으로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">small</td><td class=\"m\">작은</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">조각</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">집어 들다</td></tr><tr><td class=\"w\">long</td><td class=\"m\">긴</td></tr><tr><td class=\"w\">fork</td><td class=\"m\">포크</td></tr><tr><td class=\"w\">dip</td><td class=\"m\">담그다</td></tr><tr><td class=\"w\">warm</td><td class=\"m\">따뜻한</td></tr><tr><td class=\"w\">cheese</td><td class=\"m\">치즈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퐁뒤,</span><span class=\"en\"><b><span class=\"grammar-hl\">Fondue,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스위스</span><span class=\"en\"><b><span class=\"grammar-hl\">Switzerland</span></b></span></div></div><div class=\"lec-sent-ko\">퐁뒤, 스위스</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스위스의 식문화에 대한 일반적인 사실을 언급하며, 앞으로 설명할 &#39;퐁듀&#39;라는 음식의 배경을 제시하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Fondue, Switzerland (명사구): 도시와 국가를 나열하는 관용적 표현으로, &#39;장소, 지역&#39;을 나타내는 기본 명사 배열 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fondue</td><td class=\"m\">퐁듀(녹인 치즈 요리)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스위스 사람들은</span><span class=\"en\"><b>People in Switzerland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">치즈를 먹는 것을 좋아한다.</span><span class=\"en\"><b>like <span class=\"grammar-hl\">eating</span> cheese.</b></span></div></div><div class=\"lec-sent-ko\">스위스 사람들은 치즈를 먹는 것을 좋아한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스위스의 식문화에 대한 일반적인 사실을 언급하며, 앞으로 설명할 &#39;퐁듀&#39;라는 음식의 배경을 제시하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (동명사): like의 목적어 역할을 하며 &#39;먹는 것&#39;이라는 행위를 나타내는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheese</td><td class=\"m\">치즈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퐁뒤는</span><span class=\"en\"><b>Fondue</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 치즈 요리이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> a popular cheese dish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스위스에서</span><span class=\"en\"><b>in Switzerland.</b></span></div></div><div class=\"lec-sent-ko\">퐁뒤는 스위스에서 인기 있는 치즈 요리이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;치즈를 좋아하는 스위스 사람들&#39;의 식성을 바탕으로, 구체적인 요리인 &#39;퐁듀&#39;를 소개하며 주제를 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식(SVC) 구조: 주어(Fondue)의 상태나 정체를 설명하는 보어(a popular cheese dish)를 연결하는 연결동사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fondue</td><td class=\"m\">퐁듀(녹 .</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">heat 명령문 구조: 주어(You)가 생략되고 동사원형으로 시작하여 상대방에게 동작을 지시하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">heat</td><td class=\"m\">데우다, 가열하다</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">냄비</td></tr><tr><td class=\"w\">cheese</td><td class=\"m\">치즈</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다음으로,</span><span class=\"en\"><b>Next,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빵을 잘라라</span><span class=\"en\"><b><span class=\"grammar-hl\">cut</span> bread</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 조각으로</span><span class=\"en\"><b>into small pieces.</b></span></div></div><div class=\"lec-sent-ko\">다음으로, 빵을 작은 조각으로 잘라라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조리 과정의 두 번째 단계입니다. 치즈에 찍어 먹기 적당한 크기로 빵을 준비하라는 지시사항입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cut 명령문 구조: 동사원형으로 시작하며 &#39;조각으로 자르라&#39;는 동작을 지시합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cut</td><td class=\"m\">자르다</td></tr><tr><td class=\"w\">bread</td><td class=\"m\">빵</td></tr><tr><td class=\"w\">into</td><td class=\"m\">~안으로</td></tr><tr><td class=\"w\">small</td><td class=\"m\">작은</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">조각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퐁뒤를 즐기자.</span><s
