head\">01배경 설명</div><ul><li>하와이는 여러 섬으로 이루어져 있으며, 이곳 사람들은 생선 요리를 즐겨 먹는다.</li><li>하와이의 지리적 특성: 여러 개의 섬(islands)으로 구성됨</li><li>하와이 사람들의 식습관: 생선(fish)을 먹는 것을 즐김</li><li>핵심 키워드: 하와이(Hawaii), 생선(fish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02음식의 정의와 의미</div><ul><li>포케는 하와이에서 유명한 생선 샐러드이며 그 이름에는 특별한 뜻이 담겨 있다.</li><li>음식 명칭: 포케(Poke)</li><li>이름의 유래: 하와이 언어로 ‘자르다(to cut)’라는 뜻</li><li>핵심 키워드: 포케(Poke), 자르다(to cut)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03조리법과 특징</div><ul><li>신선한 재료를 사용하여 만드는 포케는 보기에도 좋고 맛도 훌륭한 음식이다.</li><li>만드는 방법: 생선을 작은 조각으로 잘라 그릇(bowl)에 담음</li><li>추가 재료: 신선한 채소(fresh vegetables)를 곁들임</li><li>요리의 특징: 다채로운 색깔(colorful)을 띰</li><li>핵심 키워드: 신선한 채소(fresh vegetables), 그릇(bowl)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04추천 및 마무리</div><ul><li>훌륭한 맛을 자랑하는 포케를 직접 맛보기를 권한다.</li><li>맛 평가: 아주 맛이 좋음(tastes great)</li><li>권유 사항: 한번 시도해 볼 것(Try it)</li><li>핵심 키워드: 맛(taste), 추천(recommendation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">island</td><td class=\"m\">섬</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한</td></tr><tr><td class=\"w\">salad</td><td class=\"m\">샐러드</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다</td></tr><tr><td class=\"w\">cut</td><td class=\"m\">자르다</td></tr><tr><td class=\"w\">small</td><td class=\"m\">작은</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">조각</td></tr><tr><td class=\"w\">put</td><td class=\"m\">놓다, 넣다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bowl</td><td class=\"m\">사발, 그릇</td></tr><tr><td class=\"w\">add</td><td class=\"m\">더하다, 첨가하다</td></tr><tr><td class=\"w\">fresh</td><td class=\"m\">신선한</td></tr><tr><td class=\"w\">vegetable</td><td class=\"m\">채소</td></tr><tr><td class=\"w\">colorful</td><td class=\"m\">다채로운, 색깔이 다양한</td></tr><tr><td class=\"w\">try</td><td class=\"m\">먹어보다, 시도하다</td></tr><tr><td class=\"w\">taste</td><td class=\"m\">맛이 나다</td></tr><tr><td class=\"w\">great</td><td class=\"m\">아주 좋은, 훌륭한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">포케,</span><span class=\"en\"><b><span class=\"grammar-hl\">Poke,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하와이,</span><span class=\"en\"><b><span class=\"grammar-hl\">Hawaii,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국</span><span class=\"en\"><b><span class=\"grammar-hl\">the United States</span></b></span></div></div><div class=\"lec-sent-ko\">(포케, 미국 하와이)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 제목이자 주제로, 하와이의 대표 음식인 &#39;포케&#39;를 소개하겠다는 것을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Poke, Hawaii, the United States 명사구의 나열: 장소나 대상을 구체적인 것에서 포괄적인 순서로 배열한 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 섬이</span><span class=\"en\"><b>many islands</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하와이에는</span><span class=\"en\"><b>in Hawaii.</b></span></div></div><div class=\"lec-sent-ko\">하와이에는 많은 섬이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하와이라는 지역적 배경을 설명하며, 섬이 많은 지리적 특성상 해산물을 먹는 문화가 발달했음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There가 문장 맨 앞에 오면서 주어(many islands)와 동사(are)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">island</td><td class=\"m\">섬</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하와이 사람들은</span><span class=\"en\"><b>People in Hawaii</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐기며</span><span class=\"en\"><b>enjoy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생선을 먹는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">eating</span> fish.</b></span></div></div><div class=\"lec-sent-ko\">하와이 사람들은 생선을 먹는 것을 즐긴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 섬 환경을 바탕으로, 그곳 사람들의 식습관을 연결하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (동명사): enjoy의 목적어 역할을 하며, fish를 먹는 행위를 명사적으로 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">포케는</span><span class=\"en\"><b>Poke</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이며</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 생선 샐러드</span><span class=\"en\"><b>a <span class=\"grammar-hl\">famous fish salad</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하와이의</span><span class=\"en\"><b>from Hawaii.</b></span></div></div><div class=\"lec-sent-ko\">포케는 하와이의 유명한 생선 샐러드이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하와이의 식습관(생선 즐겨 먹기)에서 탄생한 구체적인 음식인 &#39;포케&#39;의 정의를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">famous fish salad 형용사적 수식: 명사 salad를 형용사 famous와 명사 fish가 앞에서 수식하여 의미를 구체화합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">famous</td><td class=\"m\">유명한</td></tr><tr><td class=\"w\">salad</td><td class=\"m\">샐러드</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">포케는</span><span class=\"en\"><b>Poke</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미하는데</span><span class=\"en\"><b>means “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘자르는 것’을</span><span class=\"en\"><b><span class=\"grammar-hl\">“to cut”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하와이어로</span><span class=\"en\"><b>in Hawaiian.</b></span></div></div><div class=\"lec-sent-ko\">포케는 하와이어로 ‘자르는 것’을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> means는 사전적으로 &#39;의미하다&#39;이지만, 여기서는 단어의 어원을 설명하는 문맥입니다. 왜 &#39;포케&#39;라는 이름이 붙었는지 그 유래를 밝혀 음식의 이름과 조리법의 연관성을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">“to cut” (to부정사): 문장에서 의미를 명사처럼 전달하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mean</td><td class=\"m\">의미하다</td></tr><tr><td class=\"w\">cut</td><td class=\"m\">자르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><sp ><li>포케는 색감이 아름답고 맛이 좋아 직접 먹어보는 것을 추천한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Poke is a traditional Hawaiian dish made by combining small pieces of fish with fresh vegetables, and it is known for its colorful appearance and great taste.</div>\n              <div class=\"lec-final-sum-ko\">포케는 생선을 작게 썰어 신선한 채소와 섞어 만든 하와이의 전통 음식이며, 알록달록한 모양과 훌륭한 맛으로 유명하다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":null},{"audio":"./1_audio/4.mp3","hl":"stage-0"},{"audio":"./1_audio/5.mp3","hl":"stage-1"},{"audio":"./1_audio/6.mp3","hl":"stage-2"},{"audio":"./1_audio/7.mp3","hl":"stage-3"}],[{"audio":"./1_audio/8.mp3","hl":null}],[{"audio":"./1_audio/9.mp3","hl":"main"},{"audio":"./1_audio/10.mp3","hl":"meaning"},{"audio":"./1_audio/11.mp3","hl":"grammar"}],[{"audio":"./1_audio/12.mp3","hl":"main"},{"audio":"./1_audio/13.mp3","hl":"meaning"},{"audio":"./1_audio/14.mp3","hl":"grammar"}],[{"audio":"./1_audio/15.mp3","hl":"main"},{"audio":"./1_audio/16.mp3","hl":"meaning"},{"audio":"./1_audio/17.mp3","hl":"grammar"}],[{"audio":"./1_audio/18.mp3","hl":"main"},{"audio":"./1_audio/19.mp3","hl":"meaning"},{"audio":"./1_audio/20.mp3","hl":"grammar"}],[{"audio":"./1_audio/21.mp3","hl":"main"},{"audio":"./1_audio/22.mp3","hl":"meaning"},{"audio":"./1_audio/23.mp3","hl":"grammar"}],[{"audio":"./1_audio/24.mp3","hl":"main"},{"audio":"./1_audio/25.mp3","hl":"meaning"},{"audio":"./1_audio/26.mp3","hl":"grammar"}],[{"audio":"./1_audio/27.mp3","hl":"main"},{"audio":"./1_audio/28.mp3","hl":"meaning"},{"audio":"./1_audio/29.mp3","hl":"grammar"}],[{"audio":"./1_audio/30.mp3","hl":"main"},{"audio":"./1_audio/31.mp3","hl":"meaning"},{"audio":"./1_audio/32.mp3","hl":"grammar"}],[{"audio":"./1_audio/33.mp3","hl":"main"},{"audio":"./1_audio/34.mp3","hl":"meaning"},{"audio":"./1_audio/35.mp3","hl":"grammar"}],[{"audio":"./1_audio/36
