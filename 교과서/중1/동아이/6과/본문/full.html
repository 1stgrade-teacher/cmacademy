><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02스위스의 퐁듀</div><ul><li>스위스의 대중적인 치즈 요리인 퐁듀는 따뜻한 치즈에 빵을 찍어 먹는 방식입니다.</li><li>조리법: 냄비에 치즈를 녹인 뒤 작은 빵 조각을 준비함</li><li>먹는 법: 긴 포크(long fork)를 이용해 빵을 치즈에 찍어서(dip) 먹음</li><li>핵심 키워드: 퐁듀(Fondue), 치즈(cheese)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태국의 똠얌꿍</div><ul><li>더운 날씨의 태국에서 즐겨 먹는 똠얌꿍은 매콤하고 시큼한 맛이 특징인 새우 수프입니다.</li><li>맛의 특징: 매운맛(spicy)과 신맛(sour)이 조화로움</li><li>재료: 주재료인 새우(shrimp)가 포함됨</li><li>섭취 방법: 밥과 함께 먹으면 더욱 맛있음</li><li>핵심 키워드: 똠얌꿍(Tom Yum Goong), 새우 수프(shrimp soup)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">island</td><td class=\"m\">섬</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">famous</td><td class=\"m\">유명한</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다</td></tr><tr><td class=\"w\">piece</td><td class=\"m\">조각</td></tr><tr><td class=\"w\">bowl</td><td class=\"m\">그릇</td></tr><tr><td class=\"w\">add</td><td class=\"m\">더하다, 추가하다</td></tr><tr><td class=\"w\">fresh</td><td class=\"m\">신선한</td></tr><tr><td class=\"w\">colorful</td><td class=\"m\">다채로운, 색깔이 선명한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">taste</td><td class=\"m\">~한 맛이 나다</td></tr><tr><td class=\"w\">great</td><td class=\"m\">아주 좋은, 훌륭한</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">dish</td><td class=\"m\">요리</td></tr><tr><td class=\"w\">heat</td><td class=\"m\">데우다, 가열하다</td></tr><tr><td class=\"w\">pot</td><td class=\"m\">냄비</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">집어 들다</td></tr><tr><td class=\"w\">dip</td><td class=\"m\">(액체 등에) 살짝 담그다</td></tr><tr><td class=\"w\">delicious</td><td class=\"m\">맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 28</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있는데</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 섬들이</span><span class=\"en\"><b>many islands</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하와이에는.</span><span class=\"en\"><b>in Hawaii.</b></span></div></div><div class=\"lec-sent-ko\">하와이에는 많은 섬이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하와이라는 지역의 지리적 특성을 먼저 언급하여, 이어질 음식(포케)이 왜 생겨났는지에 대한 환경적 배경을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are (도치): 유도부사 There로 시작하여 &#39;주어(many islands) + 동사(are)&#39;의 위치가 바뀐 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">island</td><td class=\"m\">섬</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 28</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하와이 사람들은</span><span class=\"en\"><b>People in Hawaii</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐기는데</span><span class=\"en\"><b>enjoy <span class=\"grammar-hl\">eating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생선 먹는 것을.</span><span class=\"en\"><b>fish.</b></span></div></div><div class=\"lec-sent-ko\">하와이 사람들은 생선을 먹는 것을 즐긴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 섬이라는 지리적 환경 덕분에 하와이 사람들의 식습관이 자연스럽게 생선 위주가 되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (동명사): enjoy의 목적어 역할을 하며 &#39;먹는 것&#39;이라는 명사적 개념으로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">enjoy</td><  style=\"color:#ffd9a0;\">의미</b> 요리의 핵심 재료를 밝혀 요리의 정체를 분명히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has 5형식(SVOC) 구조와 유사한 목적어의 포함 관계: &#39;it&#39; 안에 &#39;shrimp&#39;가 있다는 소유/포함의 상태를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 26 / 28</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>People</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋아하는데</span><span class=\"en\"><b>like</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똠얌꿍을 먹는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">eating</span> tom yum goong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밥과 함께.</span><span class=\"en\"><b>with rice.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 밥과 함께 똠얌꿍을 먹는 것을 좋아한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 음식을 더 맛있게 즐기는 일반적인 식사 방식을 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (동명사): like의 목적어 역할을 하며 &#39;먹는 것&#39;이라는 행위를 명사화함</div></div>\n        ","<div class=\"lec-sent-no\">문장 27 / 28</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">냄새가</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은</span><span class=\"en\"><b><span class=\"grammar-hl\">smells</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냄새가 납니다.</span><span class=\"en\"><b>good.</b></span></div></div><div class=\"lec-sent-ko\">그것은 냄새가 좋다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 똠얌꿍에 대한 오감적인 평가를 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">smells 5형식(SVOC) 구조 기반: 감각동사 smell 뒤에 형용사(good)를 보어로 취하여 주어의 상태를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 28 / 28</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말</span><span class=\"en\"><b>really</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛있습니다.</span><span class=\"en\"><b>tasty.</b></span></div></div><div class=\"lec-sent-ko\">그것은 정말 맛있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 요리의 맛을 다시 한번 강조하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s (관용표현): It is의 줄임말로 앞선 대상의 상태를 강조함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>하와이, 스위스, 태국의 대표 음식을 통해 세계 각지의 식문화를 소개한다.</li><li>각 음식은 해당 지역의 기후, 지리적 환경, 그리고 사람들이 즐겨 먹는 재료와 밀접한 관련이 있다.</li><li>포케(하와이), 퐁듀(스위스), 똠얌꿍(태국)의 조리법과 먹는 방법을 통해 각 나라의 음식 특징을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Poke, fondue, and tom yum goong are unique traditional dishes that represent the distinct culinary cultures of Hawaii, Switzerland, and Thailand.</div>\n              <div class=\"lec-final-sum-ko\">포케, 퐁듀, 그리고 똠얌꿍은 하와이, 스위스, 태국의 독특한 요리 문화를 대표하는 고유한 전통 음식이다.</div></div></div>"],"segs":[[{"audio":"./full_audio/1.mp3","hl":null}],[{"audio":"./full_audio/2.mp3","hl":null}],[{"audio":"./full_audio/3.mp3","hl":null},{"audio":"./full_audio/4.mp3","hl":"stage-0"},{"audio":"./full_audio/5.mp3","hl":"stage-1"},{"audio":"./full_audio/6.mp3","hl":"stage-2"}],[{"audio":"./full_audio/7.mp3","hl":null}]
