0GMk9hjv0xQWUdSPzHf8aP6/QP0HY7+lH+f85/pTdwwDkDPv+f5d/1xS5Gcfl6H6HvQL+vy28vu9BaQ8/579ff27UZBweD6fh159sfnSEgAnrx+BwCcfzP9cUJ31Qz/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Tom yum goong: A Popular and Spicy Thai Soup<small>똠얌꿍: 인기 있고 매콤한 태국의 수프</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">태국 요리의 핵심인 똠얌꿍(Tom Yum Goong)은 세계 3대 수프 중 하나로 꼽히며, 태국 특유의 덥고 습한 기후를 견디기 위해 발달한 음식입니다. 이 요리에서 가장 중요한 포인트는 매운맛(Spicy)과 신맛(Sour)이 절묘하게 어우러지는 것인데, 이는 식욕을 돋우고 몸의 열을 내리는 효과가 있죠. 흔히 들어가는 식재료인 새우(Shrimp)는 단백질을 보충해주며, 레몬그라스나 라임 같은 향신료는 요리에 독특한 풍미와 향을 더해줍니다. 마치 우리가 여름철에 이열치열로 뜨거운 국물을 먹듯, 태국 사람들에게 똠얌꿍은 더위 속에서 활력을 되찾아주는 소울 푸드와 같다고 이해하면 훨씬 흥미로울 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01태국의 식문화와 똠얌꿍</div><ul><li>태국의 더운 날씨는 사람들이 매운 음식을 즐겨 먹는 식습관에 영향을 주었다.</li><li>더운 기후(hot weather)가 매운 음식 선호도를 높임</li><li>똠얌꿍은 태국을 대표하는 인기 있는 수프(popular soup)임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02똠얌꿍의 특징</div><ul><li>똠얌꿍은 강렬한 맛과 향을 가진 태국의 전통 요리이다.</li><li>맛: 맵고 신맛(spicy and sour)이 조화로움</li><li>주요 재료: 새우(shrimp)가 들어감</li><li>향: 식욕을 돋우는 좋은 냄새(smells good)가 남</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03맛있게 먹는 법</div><ul><li>많은 사람들은 똠얌꿍을 밥과 함께 먹는 것을 선호한다.</li><li>쌀밥(rice)과 함께 먹는 식사 방식</li><li>매우 맛있고(really tasty) 만족스러운 요리</li><li>핵심 키워드: 태국 음식(Thai food)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">spicy</td><td class=\"m\">매운</td></tr><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">soup</td><td class=\"m\">수프, 국</td></tr><tr><td class=\"w\">taste</td><td class=\"m\">~한 맛이 나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sour</td><td class=\"m\">신(맛이 나는)</td></tr><tr><td class=\"w\">shrimp</td><td class=\"m\">새우</td></tr><tr><td class=\"w\">rice</td><td class=\"m\">쌀, 밥</td></tr><tr><td class=\"w\">smell</td><td class=\"m\">~한 냄새가 나다</td></tr><tr><td class=\"w\">tasty</td><td class=\"m\">맛있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">똠얌꿍,</span><span class=\"en\"><b><span class=\"grammar-hl\">Tom Yum Goong,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태국</span><span class=\"en\"><b><span class=\"grammar-hl\">Thailand</span></b></span></div></div><div class=\"lec-sent-ko\">(똠얌꿍, 태국)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 태국의 지리적 특징(기후)을 소개하며, 왜 그곳 사람들이 매운 음식을 즐겨 먹는지에 대한 환경적 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Tom Yum Goong, Thailand (명사구): 고유명사 &#39;Tom Yum Goong&#39; 뒤에 콤마와 함께 장소인 &#39;Thailand&#39;를 배치하여 부연 설명하는 동격 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">태국의 날씨는</span><span class=\"en\"><b><span class=\"grammar-hl\">The weather in Thailand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덥다.</span><span class=\"en\"><b><span class=\"grammar-hl\">very hot.</span></b></span></div></div><div class=\"lec-sent-ko\">태국의 날씨는 매우 덥다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 태국의 지리적 특징(기후)을 소개하며, 왜 그곳 사람들이 매운 음식을 즐겨 먹는지에 대한 환경적 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The weather in Thailand is very hot. 기본 문장 구조: &#39;The weather&#39;가 주어, &#39;is&#39;가 동사, &#39;very hot&#39;이 보어인 2형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">weather</td><td class=\"m\">날씨</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 태국 사람들은</span><span class=\"en\"><b>Many Thai people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹는 것을 즐긴다.</span><span class=\"en\"><b>enjoy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매운 음식을</span><span class=\"en\"><b><span class=\"grammar-hl\">eating</span> spicy food.</b></span></div></div><div class=\"lec-sent-ko\">많은 태국 사람들은 매운 음식을 먹는 것을 즐긴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급된 더운 날씨가 식습관에 미친 영향을 설명하며, 이어질 내용인 &#39;똠얌꿍&#39;에 대한 자연스러운 연결 고리를 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating (동명사): &#39;enjoy&#39;의 목적어 역할을 하며, &#39;매운 음식을 먹는 것&#39;이라는 명사적 개념을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">enjoy</td><td class=\"m\">즐기다</td></tr><tr><td class=\"w\">spicy</td><td class=\"m\">매운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">똠얌꿍은</span><span class=\"en\"><b>Tom yum goong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 태국 수프이다.</span><span class=\"en\"><b>is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 태국 수프이다.</span><span class=\"en\"><b>a <span class=\"grammar-hl\">popular</span> Thai soup.</b></span></div></div><div class=\"lec-sent-ko\">똠얌꿍은 인기 있는 태국 수프이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 &#39;매운 음식&#39;의 구체적인 예시로 똠얌꿍을 소개하며 글의 핵심 소재를 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">popular 형용사: &#39;Thai soup&#39;이라는 명사를 앞에서 수식하여 의미를 보충하고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">popular</td><td class=\"m\">인기 있는</td></tr><tr><td class=\"w\">soup</td><td class=\"m\">수프, 국</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맵고 신맛이 난다.</span><span class=\"en\"><b><span class=\"grammar-hl\">tastes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맵고 신맛이 난다.</span><span class=\"en\"><b><span class=\"grammar-hl\">spicy and sour.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 맵고 신맛이 난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 똠얌꿍의 구체적인 맛을 설명합니다. 여기서 tastes는 사전적으로 &#39;맛이 나다&#39;라는 동사인데, 음식이 가진 고유한 속성을 묘사하기 위해 사용되었습니다. 필자는 이 단어를 통해 독자가 똠얌꿍의 맛을 머릿속으로 그려보도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It tastes spicy and sour. 2형식 구조: &#39;tastes&#39;는 감각동사로, 뒤에 주어의 상태를 설명하는 형용사 보어 &#39;spicy&#39;와 &#39;sour&#39;가 연결되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spicy</td><td class=\"m\">매운</td>
