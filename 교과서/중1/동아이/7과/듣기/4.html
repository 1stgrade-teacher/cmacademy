lecturePlayer(document.getElementById("app"),{"brand":"Topic 2 > A","title":"중1 동아(이) 7과 Topic 2 > A","audioDir":"4_audio","preview":false,"count":56,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">의견 묻고 답하기와 공감 표현하기\u003c/div>\u003ch1>중1 동아(이) 7과 대화문 해설: 얼굴 페인팅과 의견 묻기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">대화 상황\u003c/b>수연이와 민호가 얼굴 페인팅을 보고 서로의 의견을 묻고 공감한다. 민호는 수연이의 고양이 디자인을 좋아하고, 자신도 얼굴 페인팅을 받고 싶어 꽃 디자인에 대해 의견을 묻는다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 중학교 일 학년 동아 이 교과서 칠 과 대화문을 함께 공부해요. 수연이와 민호가 얼굴 페인팅을 보며 서로의 의견을 묻고 공감하는 상황이에요. What do you think about it?로 의견을 묻고, I feel the same.으로 공감하는 표현을 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">대화 듣기\u003c/span>\u003cdiv class=\"d-chat\">\u003cdiv class=\"d-bub d-l\" data-hl=\"r-0\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Suyeon, you got a face painting.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-1\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">➊Yes, Minho. What do you think about ➋ it?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-2\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">I think it's cute. I like the cat.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-3\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I feel the same.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-4\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">➌I want to get a face painting, ➍too.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-5\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">Sure. ➎There are four designs.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-6\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Hmm, what do you think about this flower design?\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-r\" data-hl=\"r-7\">\u003cspan class=\"d-sp\">G\u003c/span>\u003cdiv class=\"d-en\">I think ➏ it's going to look great on you.\u003c/div>\u003c/div>\u003cdiv class=\"d-bub d-l\" data-hl=\"r-8\">\u003cspan class=\"d-sp\">B\u003c/span>\u003cdiv class=\"d-en\">Okay. I'm going to get it.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"Suyeon, you got a face painting.","hl":"r-0"},{"n":3,"text":"➊Yes, Minho. What do you think about ➋ it?","hl":"r-1"},{"n":4,"text":"I think it's cute. I like the cat.","hl":"r-2"},{"n":5,"text":"I feel the same.","hl":"r-3"},{"n":6,"text":"➌I want to get a face painting, ➍too.","hl":"r-4"},{"n":7,"text":"Sure. ➎There are four designs.","hl":"r-5"},{"n":8,"text":"Hmm, what do you think about this flower design?","hl":"r-6"},{"n":9,"text":"I think ➏ it's going to look great on you.","hl":"r-7"},{"n":10,"text":"Okay. I'm going to get it.","hl":"r-8"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 1\u003c/span>\u003ch2 class=\"g-h\">의견 묻기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">What do you think about + 대상?\u003c/div>\u003cdiv class=\"d-mean\">너는 ~에 대해 어떻게 생각하니?\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: ➊Yes, Minho. What do you think about ➋ it?\u003c/div>\u003cdiv class=\"d-exp\">상대방의 \u003cb class=\"key\">의견\u003c/b>을 물을 때 쓰는 표현이에요. What do you think about ~?는 뒤에 \u003cb class=\"key\">대상\u003c/b>을 붙여 '너는 ~에 대해 어떻게 생각하니?'라는 뜻이 되고, 대답은 \u003cb class=\"key\">I think\u003c/b> ~.로 시작해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How do you feel about + 대상?\u003c/li>\u003cli>What is your opinion on + 대상?\u003c/li>\u003cli>What about + 대상?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I think ~.\u003c/li>\u003cli>In my opinion, ~.\u003c/li>\u003cli>I feel ~.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"먼저 상대방의 의견을 묻는 표현을 배워 볼게요. What do you think about it?은 너는 그것에 대해 어떻게 생각하니?라는 뜻이에요. 뒤에 대상이나 상황을 붙여서 상대의 생각을 물을 수 있어요. 대답할 때는 I think로 시작해서 자신의 의견을 말하면 됩니다.","hl":"key"},{"n":12,"text":"비슷한 표현으로 How do you feel about it?이라고 해도 너는 그것에 대해 어떻게 생각하니?라는 뜻이에요. What is your opinion on it?은 그것에 대한 네 의견은 무엇이니?라는 뜻이고요. 짧게 What about you?라고 하면 너는 어때?라는 뜻으로 앞의 질문을 다시 물을 수 있어요.","hl":"alts"},{"n":13,"text":"의견을 물었을 때는 I think it's cute.처럼 I think로 시작해 대답할 수 있어요. In my opinion, it's cute.라고 하면 내 생각에는 그것이 귀엽다는 뜻이에요. I feel it's cute.처럼 I feel을 써도 자신의 생각을 말할 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">공감 표현하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I feel the same.\u003c/div>\u003cdiv class=\"d-mean\">나도 공감해.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I feel the same.\u003c/div>\u003cdiv class=\"d-exp\">상대방의 의견에 \u003cb class=\"key\">공감\u003c/b>할 때 쓰는 표현이에요. I feel the same.은 '나도 같은 생각이야'라는 뜻이고, \u003cb class=\"key\">I think so, too\u003c/b>.나 I agree with you.로 바꿔 말할 수 있어요. 공감하지 않을 때는 \u003cb class=\"key\">I don't think so\u003c/b>.라고 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I think so, too.\u003c/li>\u003cli>I agree with you.\u003c/li>\u003cli>Me, too.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I don't think so.\u003c/li>\u003cli>I don't agree.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"이번에는 상대의 의견에 공감하는 표현을 배워 볼게요. I feel the same.은 나도 같은 생각이야, 나도 공감해라는 뜻이에요. 상대가 좋다고 말했을 때 자연스럽게 공감을 나타낼 수 있죠.","hl":"key"},{"n":15,"text":"같은 뜻으로 I think so, too.라고 말할 수 있어요. I agree with you.는 네 말에 동의해라는 뜻이고, Me, too.는 나도 그래라는 뜻이에요. You're right.라고 하면 네 말이 맞아라는 뜻으로 공감을 표현할 수 있어요.","hl":"alts"},{"n":16,"text":"공감하지 않을 때는 I don't think so.라고 말해요. 나는 그렇게 생각하지 않아라는 뜻이에요. I don't agree.도 나는 동의하지 않아라는 뜻으로 쓸 수 있어요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">Suyeon, you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got a face painting\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">수연아, 너 얼굴 페인팅을 했구나.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">got\u003c/b>은 get의 과거형으로 여기서는 '얻다, 하다'의 뜻이에요. \u003cb class=\"key\">face painting\u003c/b>은 얼굴에 하는 그림 분장을 말해요.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c/span>\u003cspan class=\"d-ln\">2\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">➊Yes, Minho. \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">What do you think about\u003c/span> ➋ \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>?\u003c/div>\u003cdiv class=\"d-ko\">응, 민호. 너는 그것에 대해 어떻게 생각해?\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan>상대방의 \u003cb class=\"key\">의견\u003c/b>을 묻는 표현으로, 뒤에 대상을 붙여 '너는 ~에 대해 어떻게 생각하니?'라고 말해요. 짧게 \u003cb class=\"key\">What about you?\u003c/b>는 '너는 어때?'라는 뜻으로 앞에서 한 질문을 다시 묻는 말이며 \u003cb class=\"key\">How about you?\u003c/b>와 바꿔 쓸 수 있어요. 여기에서는 What do you think about it?의 의미예요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan>여기서 \u003cb class=\"key\">it\u003c/b>은 앞에 나온 \u003cb class=\"key\">this picture\u003c/b>, 즉 이 그림을 가리켜요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>How do you feel about it?\u003c/span>\u003cspan>What is your opinion on it?\u003c/span>\u003cspan>What about you?\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"첫 번째 문장은 Suyeon, you got a face painting. 수연아, 너 얼굴 페인팅을 했구나. 라는 뜻이에요. got은 get의 과거형이고, face painting은 얼굴에 하는 그림 분장을 말해요. 친구의 얼굴에 그림이 있는 것을 보고 말하는 자연스러운 표현이죠.","hl":"l-0"},{"n":18,"text":"두 번째 문장은 Yes, Minho. What do you think about it? 예스, 민호. 너는 그것에 대해 어떻게 생각하니? 라는 뜻이에요. 여기서 it은 앞에 나온 face painting, 즉 이 그림을 가리켜요. What do you think about은 상대의 의견을 묻는 표현이고, What about you?라고 하면 너는 어때?라는 뜻으로 앞의 질문을 다시 물을 수 있어요. How about you?도 같은 뜻으로 쓸 수 있어요.","hl":"l-1"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 3–4 / 9\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">3\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">I think\u003c/span> \u003cspan class=\"mk\">5\u003c/span>\u003cspan class=\"tgt\">it's\u003c/span> cute. \u003cspan class=\"mk\">6\u003c/span>\u003cspan class=\"tgt\">I like the cat\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">나는 그것이 귀엽다고 생각해. 나는 그 고양이 디자인이 마음에 들어.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan>자신의 \u003cb class=\"key\">의견\u003c/b>을 말할 때 \u003cb class=\"key\">I think\u003c/b> ~.로 시작해요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">5\u003c/span>\u003cspan>\u003cb class=\"key\">it's\u003c/b>는 it is의 줄임말이고, 여기서 \u003cb class=\"key\">it\u003c/b>은 \u003cb class=\"key\">face painting\u003c/b>을 가리켜요.\u003c/span>\u003c/div>\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">6\u003c/span>\u003cspan>\u003cb class=\"key\">the cat\u003c/b>은 얼굴 페인팅의 고양이 디자인을 가리켜요. '나는 그 고양이 디자인이 마음에 들어'라는 뜻이에요.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-alt\">\u003cb>같은 의도의 표현\u003c/b>\u003cspan>In my opinion, it's cute.\u003c/span>\u003cspan>I feel it's cute.\u003c/span>\u003cspan>It looks cute to me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"d-line\" data-hl=\"l-1\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-r\">G\u003c
