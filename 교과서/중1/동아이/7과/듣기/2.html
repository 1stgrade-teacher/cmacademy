inger?\u003c/div>\u003cdiv class=\"d-exp\">상대의 \u003cb class=\"key\">의견\u003c/b>을 물을 때 쓰는 표현이에요. about 뒤에는 의견을 묻는 \u003cb class=\"key\">대상\u003c/b>을 넣고, 대답할 때는 I think나 I feel, In my opinion으로 \u003cb class=\"key\">생각\u003c/b>을 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>How do you feel about + 명사?\u003c/li>\u003cli>What is your opinion on + 명사?\u003c/li>\u003cli>What do you think of + 명사?\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I think + 주어 + 동사.\u003c/li>\u003cli>I feel + 주어 + 동사.\u003c/li>\u003cli>In my opinion, + 주어 + 동사.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"상대의 의견을 물을 때는 What do you think about 다음에 대상을 넣어 말해요. 뜻은 그 대상에 대해 어떻게 생각하니예요. 예를 들어 What do you think about the singer?는 그 가수에 대해 어떻게 생각하니라는 뜻이죠. about 뒤에는 궁금한 대상이 온다는 점을 기억해 주세요.","hl":"key"},{"n":7,"text":"같은 질문을 How do you feel about the singer?라고도 해요. 또 What is your opinion on the singer?라고 말할 수 있고, What do you think of the singer?처럼 think of를 써도 됩니다. 모두 상대의 생각을 묻는 같은 의도의 표현이에요.","hl":"alts"},{"n":8,"text":"대답할 때는 I think his voice is beautiful처럼 I think 다음에 생각을 말해요. I feel his voice is beautiful라고 해도 되고, In my opinion, his voice is beautiful처럼 In my opinion을 쓸 수도 있어요. 이렇게 하면 상대의 질문에 자연스럽게 의견을 말할 수 있습니다.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">의사소통 기능 2\u003c/span>\u003ch2 class=\"g-h\">의견 말하고 공감하기\u003c/h2>\u003cdiv class=\"d-key\" data-hl=\"key\">\u003cdiv class=\"d-keyexp\">I think + (that) + 주어 + 동사\u003c/div>\u003cdiv class=\"d-mean\">~라고 생각해요.\u003c/div>\u003cdiv class=\"d-from\">대화 속 문장: I think our school band is cool.\u003c/div>\u003cdiv class=\"d-exp\">자신의 \u003cb class=\"key\">생각\u003c/b>을 말할 때 I think ~를 쓰고 I feel ~로도 바꿀 수 있어요. I think 뒤에는 접속사 \u003cb class=\"key\">that\u003c/b>이 생략되어 있으며, 형용사 \u003cb class=\"key\">cool\u003c/b>은 여기서 ‘멋진’이라는 뜻이에요. 상대의 의견에 공감할 때는 I feel the same이나 I think so, too로 답하고, 공감하지 않을 때는 I don’t think so나 I don’t agree를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"d-cols\">\u003cdiv class=\"d-box\" data-hl=\"alts\">\u003cb>같은 의미의 표현\u003c/b>\u003cul>\u003cli>I feel + (that) + 주어 + 동사\u003c/li>\u003cli>In my opinion, + 주어 + 동사\u003c/li>\u003cli>I believe + (that) + 주어 + 동사\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"d-box a\" data-hl=\"ans\">\u003cb>대답하는 표현\u003c/b>\u003cul>\u003cli>I feel the same.\u003c/li>\u003cli>I think so, too.\u003c/li>\u003cli>I agree with you.\u003c/li>\u003cli>You’re right.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"자신의 생각을 말할 때는 I think 다음에 문장을 이어 말해요. I think our school band is cool은 우리 학교 밴드가 멋지다고 생각해요라는 뜻이죠. 이때 I think는 I feel로 바꿔 말할 수 있고, think 뒤의 접속사 that은 자주 생략됩니다. 여기서 cool은 멋지다는 뜻의 형용사로 쓰였어요.","hl":"key"},{"n":10,"text":"같은 생각을 I feel our school band is cool이라고도 말해요. In my opinion, our school band is cool처럼 In my opinion을 쓸 수도 있고, I believe our school band is cool이라고 해도 됩니다. 모두 자신의 의견을 말하는 같은 의도의 표현이에요.","hl":"alts"},{"n":11,"text":"상대가 의견을 말하면 I feel the same이라고 하며 공감할 수 있어요. I think so, too나 I agree with you, Me, too, You’re right도 같은 뜻으로 자주 쓰입니다. 공감하지 않을 때는 I don’t think so나 I don’t agree라고 말해요.","hl":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">대화 해설 1–2 / 4\u003c/span>\u003cdiv class=\"d-line\" data-hl=\"l-0\">\u003cdiv class=\"d-lh\">\u003cspan class=\"d-sp d-l\">B\u003c/span>\u003cspan class=\"d-ln\">1\u003c/span>\u003c/div>\u003cdiv class=\"d-en2\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I think\u003c/span>\u003cspan class=\"mk\">2\u003c/span> our school band is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cool\u003c/span>.\u003c/div>\u003cdiv class=\"d-ko\">우리 학교 밴드가 멋지다고 생각해.\u003c/div>\u003cdiv class=\"d-notes\">\u003cdiv class=\"d-note\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan>\u003cb class=\"key\">I think\u003c/b>는 자신의 생각을 말할 때 쓰는 핵심 표현이에요. I think ~.는 I feel ~.로 바꿔 쓸 수 있어요.\u003c/span>\u003c/div>\u003  문장으로도 바꿀 수 있어요.\u003c/li>\u003cli>\u003cb class=\"key\">I think\u003c/b> 뒤의 접속사 \u003cb class=\"key\">that\u003c/b>은 자주 생략되고, \u003cb class=\"key\">cool\u003c/b>은 ‘멋진’이라는 뜻의 형용사로 쓰였어요.\u003c/li>\u003cli>상대의 의견을 물을 때는 \u003cb class=\"key\">What do you think about\u003c/b> + 대상?을 쓰고, \u003cb class=\"key\">How do you feel about\u003c/b> + 대상?이나 \u003cb class=\"key\">What is your opinion on\u003c/b> + 대상?으로도 말할 수 있어요.\u003c/li>\u003cli>상대의 의견에 공감할 때는 \u003cb class=\"key\">I feel the same.\u003c/b>이나 \u003cb class=\"key\">I think so, too.\u003c/b>, \u003cb class=\"key\">I agree with you.\u003c/b>로 답하고, 공감하지 않을 때는 I don’t think so.나 I don’t agree.를 써요.\u003c/li>\u003cli>공감 표현으로는 \u003cb class=\"key\">Me, too.\u003c/b>나 \u003cb class=\"key\">You’re right.\u003c/b>도 자주 쓰고, 비공감 표현으로는 \u003cb class=\"key\">I don’t think so.\u003c/b>를 기억해요.\u003c/li>\u003c/ul>","segs":[{"n":31,"text":"오늘은 의견을 묻고 답하는 표현을 배웠어요. 자신의 생각을 말할 때는 I think 다음에 문장을 이어 말하고, I feel로 바꿔 말할 수 있습니다. 상대의 의견을 물을 때는 What do you think about 다음에 대상을 넣고, What is your opinion on이나 How do you feel about으로도 물을 수 있어요. 공감할 때는 I feel the same이라고 하고, I think so, too나 I agree with you, Me, too, You’re right도 쓸 수 있습니다. 공감하지 않을 때는 I don’t think so나 I don’t agree라고 해요. 오늘 배운 표현을 학교 밴드나 좋아하는 가수에 대해 말할 때 꼭 사용해 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
