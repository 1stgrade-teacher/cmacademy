</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"접속사 when","title":"중1 동아(이) 7과 문법2 접속사 when","audioDir":"2_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">중1 동아(이) 7과 문법2 – 접속사 when\u003c/div>\u003ch1>when 하나로 시간 표현 끝내기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>접속사 when의 의미와 형태를 익히고, when절의 위치와 시간 부사절의 시제 규칙을 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 시간을 나타내는 접속사 when을 배워 볼 거예요. when은 '~할 때'라는 뜻으로 두 문장을 자연스럽게 이어 주는 아주 중요한 역할을 한답니다. 오늘 예문 몇 개만 확실히 익히면 시험에서 접속사 문제는 어렵지 않아요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">접속사 when의 의미와 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사는 \u003cb class=\"key\">단어\u003c/b>와 단어, \u003cb class=\"key\">구\u003c/b>와 구, \u003cb class=\"key\">절\u003c/b>과 절을 연결하는 말이에요. 그중 when은 '~할 때'라는 뜻으로 시간을 나타내는 \u003cb class=\"key\">부사절\u003c/b>을 이끌고, 「when + 주어 + 동사 ~」의 형태로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">when + 주어 + 동사 ~ = ~할 때\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When he was 33\u003c/span>, he moved to Paris.\u003c/div>\u003cdiv class=\"g-ko\">그가 33살이었을 때, 그는 파리로 이주했다.\u003c/div>\u003cdiv class=\"g-note\">when 뒤에 주어 he와 동사 was가 온 기본 형태예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When David met his friend\u003c/span>, he smiled.\u003c/div>\u003cdiv class=\"g-ko\">David가 그의 친구를 만났을 때, 그는 미소를 지었다.\u003c/div>\u003cdiv class=\"g-note\">when절이 앞에 오면 절 끝에 콤마를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>when은 \u003cb class=\"key\">의문사\u003c/b>로도 쓰여 '언제'라는 뜻이 되니, \u003cb class=\"key\">접속사\u003c/b> when과 쓰임을 구분해야 해요.\u003c/div>","segs":[{"n":2,"text":"먼저 접속사가 무엇인지부터 짚고 갈게요. 접속사는 단어와 단어, 구와 구, 절과 절을 연결해 주는 말이에요. 그중에서 when은 '~할 때'라는 뜻으로 시간을 나타내는 부사절을 이끌어요. 형태는 when 뒤에 주어와 동사가 차례로 오는 모양이죠. 아주 단순하니까 부담 갖지 마세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. When he was 33, he moved to Paris. 뜻은 '그가 서른세 살이었을 때, 그는 파리로 이주했다'예요. when 뒤에 주어 he와 동사 was가 그대로 와 있죠. 이 모양이 바로 기본 형태랍니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. When David met his friend, he smiled. 뜻은 'David가 그의 친구를 만났을 때, 그는 미소를 지었다'예요. when절이 문장 앞에 오면 절이 끝나는 자리에 콤마를 꼭 찍어 준다는 것도 기억해 두세요.","hl":"ex-1"},{"n":5,"text":"한 가지 주의할 점이 있어요. when은 '언제'라는 의문사로도 쓰이기 때문에 모양이 똑같아 보여요. 하지만 오늘 배우는 when은 두 문장을 이어 주는 접속사라는 점, 꼭 구분해서 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">when절의 위치와 콤마\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">when이 이끄는 부사절은 \u003cb class=\"key\">주절\u003c/b>의 앞과 뒤에 모두 올 수 있어요. 주절 앞에 올 때는 절의 끝에 \u003cb class=\"key\">콤마\u003c/b>를 쓰고, 뒤에 올 때는 콤마 없이 바로 이어 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">When + 주어 + 동사, 주어 + 동사 / 주어 + 동사 + when + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I saw the sun \u003cspan class=\"fx\">when I woke up\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내가 일어났을 때, 나는 태양을 보았다.\u003c/div>\u003cdiv class=\"g-note\">when절이 주절 뒤에 오면 콤마를 쓰지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wanted to be a singer \u003cspan class=\"fx\">when I was young\u003c/span>. = When I was young, I wanted to be a singer.\u003c/div>\u003cdiv class=\"g-ko\">나는 어렸을 때, 가수가 되고 싶었다.\u003c/div>\u003cdiv class=\"g-note\">when절의 위치를 바꿔도 뜻은 같아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">My dog wags his tail \u003cspan class=\"fx\">when he is happy\u003c/span>. = When my dog is happy, he wags his tail.\u003c/div>\u003cdiv class=\"g-ko\">나의 개는 기분이 좋을 때 꼬리를 흔든다.\u003c/div>\u003cdiv class=\"g-note\">when절을 앞뒤 어디에 두어도 뜻은 같아요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>when절이 앞에 올 때는 절 끝에 \u003cb class=\"key\">콤마\u003c/b>를 꼭 쓰고, 뒤에 올 때는 쓰지 않아요.\u003c/div>","segs":[{"n":6,"text":"이번에는 when절이 어디에 오는지 볼게요. when절은 주절의 앞에도, 뒤에도 모두 올 수 있어요. 앞에 올 때는 절이 끝나는 자리에 콤마를 쓰고, 뒤에 올 때는 콤마 없이 자연스럽게 이어 주면 돼요. 순서를 바꿔도 뜻은 똑같다는 것도 중요한 포인트예요.","hl":"rule"},{"n":7,"text":"세 번째 예문이에요. I saw the sun when I woke up. 뜻은 '내가 일어났을 때, 나는 태양을 보았다'예요. 여기서는 when절이 뒤에 왔기 때문에 콤마가 없죠.","hl":"ex-0"},{"n":8,"text":"네 번째 예문이에요. I wanted to be a singer when I was young. 뜻은 '나는 어렸을 때, 가수가 되고 싶었다'예요. 이 문장은 When I was young, I wanted to be a singer. 처럼 when절을 앞으로 보내도 뜻이 똑같아요. 앞으로 보낼 때는 콤마를 잊지 마세요.","hl":"ex-1"},{"n":9,"text":"다섯 번째 예문이에요. My dog wags his tail when he is happy. 뜻은 '나의 개는 기분이 좋을 때 꼬리를 흔든다'예요. 이것도 When my dog is happy, he wags his tail. 로 순서를 바꿀 수 있답니다.","hl":"ex-2"},{"n":10,"text":"콤마 하나 때문에 틀리는 경우가 정말 많아요. when절이 앞에 오면 콤마를 쓰고, 뒤에 오면 쓰지 않는다는 것만 확실히 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">시간의 부사절에서는 미래를 현재시제로\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시간을 나타내는 부사절 안에서 미래의 일을 말할 때는 \u003cb class=\"key\">will\u003c/b>을 쓰지 않고 \u003cb class=\"key\">현재시제\u003c/b>로 표현해요. 미래의 의미는 주절의 will이 담당합니다.\u003cdiv>\u003cspan class=\"g-formula\">When + 주어 + 현재동사 ~, 주어 + will + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">When he arrives\u003c/span>, we will order.\u003c/div>\u003cdiv class=\"g-ko\">그가 도착할 때, 우리는 주문할 것이다.\u003c/div>\u003cdiv class=\"g-note\">when절에서는 will arrive가 아니라 arrives를 써요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>when절 안에는 \u003cb class=\"key\">will\u003c/b>을 쓰지 않고 \u003cb class=\"key\">현재시제\u003c/b>로 미래를 나타낸다는 점이 시험에 자주 나와요.\u003c/div>","segs":[{"n":11,"text":"여기서 아주 중요한 규칙이 하나 나와요. 시간을 나타내는 부사절 안에서는 미래의 일을 현재시제로 표현해요. when절에 will을 쓰면 틀리는 거죠. 미래라는 느낌은 뒤에 오는 주절의 will이 대신 전해 준답니다.","hl":"rule"},{"n":12,"text":"여섯 번째 예문이에요. When he arrives, we will order. 뜻은 '그가 도착할 때, 우리는 주문할 것이다'예요. when절에는 will을 쓰지 않고 arrives라는 현재시제를 썼고, 주절에 will을 써서 미래를 나타냈어요. will arrive라고 쓰면 틀린 문장이 되니까 꼭 기억하세요.","hl":"ex-0"},{"n":13,"text":"시험에서 will을 넣어서 틀리게 만든 문장이 정말 자주 나와요. when절 안에서는 미래의 일도 현재시제로 쓴다는 점, 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">그 밖의 시간을 나타내는 접속사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">when 말고도 시간을 나타내는 접속사가 많아요. \u003cb class=\"key\">while\u003c/b>은 '~하는 동안에', after는 '~한 후에', before는 '~하기 전에', \u003cb class=\"key\">until\u003c/b>은 '~할 때까지'라는 뜻이에요.\u003cdiv>\u003cspan class=\"g-formula\">while / after / before / until + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">While we were playing basketball\u003c/span>, it started raining.\u003c/div>\u003cdiv class=\"g-ko\">우리가 농구를 하는 동안 비가 오기 시작했다.\u003c/div>\u003cdiv class=\"g-note\">while은 '~하는 동안에'라는 뜻으로 when과 구별해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>접속사는 \u003cb class=\"key\">의미\u003c/b>로 구별해야 하니 while, after, before, until의 뜻을 정확히 외워 두세요.\u003c/div>","segs":[{"n":14,"text":"마지막으로 when 말고 다른 시간 접속사들도 알아 둘게요. while은 '~하는 동안에', after는 '~한 후에', before는 '~하기 전에', until은 '~할 때까지'라는 뜻이에요. 뜻만 정확히 알아 두면 접속사 고르는 문제는 쉽게 풀 수 있어요.","hl":"rule"},{"n":15,"text":"마지막 예문이에요. While we were playing basketball, it started raining. 뜻은 '우리가 농구를 하는 동안 비가 오기 시작했다'예요. 여기서는 when이 아니라 while을 써서 '~하는 동안에'라는 뜻을 살렸답니다.","hl":"ex-0"},{"n":16,"text":"접속사 문제는 결국 뜻 싸움이에요. while, after, before, until의 뜻을 정확히 외워 두면 보기만 봐도 답이 보일 거예요.","hl":"tip"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 접속사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">____ he was 33, he moved to Paris.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>When\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>While\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Before\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Until\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">When\u003c/span>\u003cdiv class=\"g-exp\">'~할 때'라는 뜻으로 뒤에 he was 33이라는 시간 부사절이 오므로 When이 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제예요. 빈칸에 알맞은 접속사를 고르는 문제입니다. he was 33, he moved to Paris. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 첫 번째 보기 When이에요. '그가 서른세 살이었을 때'라는 뜻이니까 '~할 때'를 나타내는 when이 들어가야 하죠. while은 '~하는 동안에'라는 뜻이라 여기에는 어울리지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 when의 의미로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">When she was six years old, she was sick.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>~한 후에\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>~할 때\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>~하기 전에\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>~할 때까지\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">~할 때\u003c/span>\u003cdiv class=\"g-exp\">when은 시간을 나타내는 부사절을 이끌며 '~할 때'라는 뜻이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제예요. When she was six years old, she was sick. 이 문장에서 when의 의미를 고 lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">중1 동아(이) 7과 문법2 – 접속사 when\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>접속사 when은 '~할 때'라는 뜻으로 \u003cb class=\"key\">시간\u003c/b>을 나타내는 \u003cb class=\"key\">부사절\u003c/b>을 이끌어요.\u003c/li>\u003cli>when절은 주절의 \u003cb class=\"key\">앞\u003c/b>과 뒤에 모두 올 수 있고, 앞에 올 때는 \u003cb class=\"key\">콤마\u003c/b>를 써요.\u003c/li>\u003cli>시간의 부사절에서는 미래의 일을 \u003cb class=\"key\">현재시제\u003c/b>로 나타내요.\u003c/li>\u003cli>\u003cb class=\"key\">while\u003c/b>, after, before, \u003cb class=\"key\">until\u003c/b>도 시간을 나타내는 접속사예요.\u003c/li>\u003c/ul>","segs":[{"n":35,"text":"오늘은 접속사 when을 배웠어요. when은 '~할 때'라는 뜻으로 시간 부사절을 이끌고, when절은 주절의 앞에도 뒤에도 올 수 있다는 것, 기억나죠? 시간의 부사절에서는 미래의 일을 현재시제로 쓴다는 규칙도 꼭 챙겨 두세요. while, after, before, until 같은 친구들도 함께 익혀 두면 시험 문제가 훨씬 쉬워질 거예요. 오늘도 수고 많았어요, 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
