<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 7과 본문2 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 7과 본문2","audioDir":"2_audio","preview":false,"count":60,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>7과 본문2\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Frida Kahlo: Self-Portraits That Touch Hearts\u003c/h1>\u003ch2>프리다 칼로: 마음을 감동시키는 자화상\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>멕시코 화가 \u003cb class=\"key\">프리다 \u003c/b>\u003cb class=\"key\">칼로\u003c/b>는 여섯 살의 병과 열여덟 살의 버스 사고를 겪으며 자신을 그리기 시작해 평생 55점의 \u003cb class=\"key\">자화상\u003c/b>을 남겼고, 그 그림은 반 고흐의 그림처럼 많은 사람들의 \u003cb class=\"key\">마음\u003c/b>을 감동시킨다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Frida Kahlo's self-portraits, painted through her suffering, like Van Gogh's, touch the hearts of many people.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 동아 이 선생님 교과서 일곱 번째 과, 본문 두 번째 지문을 함께 공부할 거예요. 이 글은 멕시코 화가 프리다 칼로가 병과 사고를 이겨 내고 자화상을 그리게 된 이야기를 담고 있죠. 핵심은 그녀의 그림이 반 고흐의 그림처럼 많은 사람들의 마음을 감동시킨다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">프리다 칼로(Frida Kahlo)는 20세기 멕시코를 대표하는 화가로, 자기 얼굴을 그린 \u003cb class=\"key\">자화상\u003c/b>(self-portrait)으로 아주 유명합니다. 그녀는 여섯 살에 소아마비(polio)를 앓아 오른쪽 다리가 약해졌고, 열여덟 살에는 버스 사고로 큰 부상을 입었습니다. 병상에서 몸을 거의 움직일 수 없었던 그녀는 거울을 보며 자신을 그리기 시작했습니다. 반 고흐(Van Gogh) 역시 자신을 자주 그린 화가라서 두 사람은 자주 함께 언급됩니다. 힘든 훈련을 견딘 운동선수가 그 기록으로 사람들을 감동시키는 것과 비슷하다고 생각하면 이해가 쉽습니다. 이처럼 \u003cb class=\"key\">자화상\u003c/b>은 화가가 자신의 내면과 삶을 세상에 보여 주는 창(window)과 같습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알고 가면 훨씬 쉬워요. 프리다 칼로는 이십 세기 멕시코를 대표하는 화가로, 자기 얼굴을 그린 자화상으로 아주 유명하죠. 그녀는 여섯 살에 소아마비를 앓아 오른쪽 다리가 약해졌고, 열여덟 살에는 버스 사고로 큰 부상을 입었어요. 병상에서 몸을 거의 움직일 수 없었던 그녀는 거울을 보며 자신을 그리기 시작했죠. 반 고흐도 자신을 자주 그린 화가라서 두 사람은 자주 함께 언급돼요. 힘든 훈련을 견딘 운동선수가 그 기록으로 사람들을 감동시키는 것과 비슷하다고 생각하면 이해가 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>칼로의 어린 시절\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">프리다 \u003c/b>\u003cb class=\"key\">칼로\u003c/b>가 멕시코의 \u003cb class=\"key\">화가\u003c/b>였다는 소개로 시작합니다. 그녀는 여섯 살 때 매우 아팠고, 오른쪽 다리가 왼쪽 다리보다 더 \u003cb class=\"key\">약해졌습니다\u003c/b>. 하지만 그녀는 '나는 \u003cb class=\"key\">나아질\u003c/b> 거야, 나처럼 아픈 사람들을 도울 거야'라고 긍정적으로 생각했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사고와 자화상\u003csmall>전환 · 문장 6–11\u003c/small>\u003c/h4>\u003cp>열여덟 살에 그녀는 끔찍한 \u003cb class=\"key\">버스 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 당해 오랫동안 \u003cb class=\"key\">병원\u003c/b>에 머물렀습니다. 그녀는 스스로에게 '나는 약해 보이지만 \u003cb class=\"key\">누구보다 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">강해\u003c/b>'라고 말하며 마음을 다잡았습니다. 그래서 그녀는 자신을 \u003cb class=\"key\">그리기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>했고, 일생 동안 55점의 \u003cb class=\"key\">자화상\u003c/b>을 남겼습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>그림을 보라\u003csmall>질문 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>작가는 독자에게 그녀의 그림들을 보라고 \u003cb class=\"key\">청유\u003c/b>합니다. 그리고 '그녀는 \u003cb class=\"key\">강해 \u003c/b>\u003cb class=\"key\">보이는가\u003c/b>?'라고 \u003cb class=\"key\">질문\u003c/b>을 던집니다. 이 질문은 앞에서 그녀가 스스로에게 했던 말과 이어지며, 독자가 그림 속 그녀를 직접 \u003cb class=\"key\">떠올려\u003c/b> 보게 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>두 화가의 공통점\u003csmall>결론 · 문장 14–16\u003c/small>\u003c/h4>\u003cp>반 고흐와 칼로는 서로 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">이유\u003c/b>로 자신을 그렸습니다. 하지만 그들의 그림에는 한 가지 \u003cb class=\"key\">공통점\u003c/b>이 있습니다. 바로 그 그림들이 많은 사람들의 \u003cb class=\"key\">마음\u003c/b>을 감동시킨다는 점이며, 이것이 이 글의 \u003cb class=\"key\">주제\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 칼로의 어린 시절이에요. 글은 프리다 칼로가 멕시코의 화가였다는 소개로 시작하죠. 그녀는 여섯 살 때 매우 아팠고, 오른쪽 다리가 왼쪽 다리보다 더 약해졌어요. 그래도 그녀는 나아질 거야, 나처럼 아픈 사람들을 도울 거야라고 긍정적으로 생각했습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 사고와 자화상이 나와요. 열여덟 살에 그녀는 끔찍한 버스 사고를 당해 오랫동안 병원에 머물렀죠. 그녀는 나는 약해 보이지만 누구보다 더 강해라고 스스로에게 말하며 마음을 다잡았어요. 그래서 자신을 그리기 시작했고, 일생 동안 오십오 점의 자화상을 남겼습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그림을 보라는 대목이에요. 작가는 독자에게 그녀의 그림들을 보라고 청유하죠. 그리고 그녀는 강해 보이는가라고 질문을 던집니다. 이 질문은 앞에서 그녀가 스스로에게 했던 말과 이어지면서, 독자가 그림 속 그녀의 강인함을 직접 떠올려 보게 만들어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 두 화가의 공통점이에요. 반 고흐와 칼로는 서로 다른 이유로 자신을 그렸습니다. 하지만 그들의 그림에는 한 가지 공통점이 있죠. 바로 그 그림들이 많은 사람들의 마음을 감동시킨다는 점이고, 이것이 이 글의 주제입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 여섯 살, 열여덟 살처럼 나이를 따라가며 칼로의 삶을 \u003cb class=\"key\">시간순\u003c/b>으로 서술합니다. 그 과정에서 병과 사고라는 \u003cb class=\"key\">고통\u003c/b>이 자화상이라는 결과로 이어지는 흐름이 드러나죠. 마지막 부분에서는 반 고흐와 나란히 놓고 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">점\u003c/b>과 \u003cb class=\"key\">공통점\u003c/b>을 짚은 뒤, 가장 중요한 내용인 '많은 사람들의 마음을 감동시킨다'를 맨 끝 문장에 배치했으므로 \u003cb class=\"key\">미괄식\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (2)\u003c/b>\u003cspan>시간 제시\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>different (14)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>But (15)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>in common (15)\u003c/b>\u003cspan>공통점 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">she was very sick\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her right leg became weaker\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I look weak\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I am stronger than anyone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Does she look strong\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Frida Kahlo\u003c/th>\u003cth>Van Gogh\u003c/th>\u003c/tr>\u003ctr>\u003ctd>병과 사고를 겪으며 자신을 그림\u003c/td>\u003ctd>지문에 구체적 배경이 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자신을 그린 이유가 서로 다름\u003c/td>\u003ctd>자신을 그린 이유가 서로 다름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공통 결과: 많은 사람들의 마음을 감동시킴\u003c/td>\u003ctd>공통 결과: 많은 사람들의 마음을 감동시킴\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 여섯 살, 열여덟 살처럼 나이를 따라가며 칼로의 삶을 차례대로 서술하죠. 그리고 마지막 부분에서 반 고흐와 칼로를 나란히 놓고 다른 점과 공통점을 짚어 줍니다. 가장 중요한 문장이 맨 끝에 나오니까 미괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 두 번째 문장과 여섯 번째 문장의 When은 시간을 알려 주는 신호어예요. 네 번째 문장의 But은 부정적인 상황을 뒤집는 전환이고, 열 번째 문장의 So는 자화상을 그리기 시작했다는 결과를 이끌어 내죠. 특히 열다섯 번째 문장의 But과 one thing in common은 서로 다른 점에서 공통점으로 시선을 옮기는 결정적인 대조 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Mexican\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멕시코의\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화가, 예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈, 병든\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오른쪽의\u003c/span>\u003c/div>\u003cdiv>\u003cb>leg\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다리\u003c/span>\u003c/div>\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>get well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나아지다, 회복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끔찍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>accident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hospital\u003c/b>\u003cem>명사\u003c/em>\u003cspan>병원\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a long time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오랫동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>look\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~해 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>누구든지\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(그림을) 그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>herself\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>그녀 자신을\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-portrait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자화상\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifetime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일생, 평생\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>in common\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공통으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>touch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감동시키다, 닿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. become은 이 되다, weak는 약한, strong은 강한이라는 뜻이고, get well은 나아지다, 회복하다라는 숙어예요. in common은 공통으로, touch는 감동시키다라는 뜻으로 마음이라는 단어와 함께 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">weak\u003c/b>\u003cspan class=\"m\">약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">frail\u003c/span>\u003cspan class=\"s\">feeble\u003c/span>\u003cspan class=\"s\">fragile\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003cspan class=\"a\">sturdy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strong\u003c/b>\u003cspan class=\"m\">강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">powerful\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"s\">sturdy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">frail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"s\">unwell\u003c/span>\u003cspan class=\"s\">sickly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003cspan class=\"a\">well\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">끔찍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"s\">dreadful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">great\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">unlike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">touch\u003c/b>\u003cspan class=\"m\">감동시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">move\u003c/span>\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impress\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stay\u003c/b>\u003cspan class=\"m\">머물다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remain\u003c/span>\u003cspan class=\"s\">linger\u003c/span>\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 단어들은 동의어와 반의어로 묶어서 기억해 두면 좋아요. weak는 frail, feeble, fragile과 비슷하고 반대말은 strong이죠. strong은 powerful, tough와 가깝고 반대말은 weak예요. sick은 ill, unwell과 비슷하고 반대말은 healthy, well이고, terrible은 awful, horrible과 가깝고 반대말은 wonderful이에요. different는 various, distinct와 비슷하고 반대말은 same, similar라는 것도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프리다 칼로는\u003c/span>\u003cspan class=\"en\">Frida Kahlo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코의 화가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Mexican \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">프리다 칼로는 멕시코의 화가였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제\u003c/b>인 화가 프리다 칼로를 소개하는 첫 문장이에요. 그녀가 \u003cb class=\"key\">멕시코\u003c/b> 출신의 \u003cb class=\"key\">화가\u003c/b>였다는 기본 정보를 알려 주면서, 뒤에 이어질 그녀의 인생 이야기를 여는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(be동사 + 주격보어)\u003c/span> : [주어] + was[be동사] + [a Mexican artist (주격보어/명사구)] : \"멕시코의 화가였다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Frida Kahlo, 프리다 칼로는. was, ~였다. a Mexican artist, 멕시코의 화가. 이 문장 전체를 해석하면, 프리다 칼로는 멕시코의 화가였다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제인 화가 프리다 칼로를 소개하는 첫 문장이에요. 그녀가 멕시코 출신의 화가였다는 기본 정보를 알려 주면서 뒤에 이어질 이야기를 여는 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째, be동사 was 뒤에 명사구 a Mexican artist가 왔죠. 이렇게 be동사 뒤에서 주어를 설명해 주는 말을 주격보어라고 해요. 그래서 이 문장은 주어와 보어가 같은 뜻을 만드는 형식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 여섯 살 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">six \u003c/span>\u003cspan class=\"tgt\">years \u003c/span>\u003cspan class=\"tgt\">old\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 매우 아팠다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">sick\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 여섯 살 때, 그녀는 매우 아팠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">시간\u003c/b>을 나타내는 When 절로 그녀가 여섯 살이던 어린 시절의 일을 소개해요. 바로 다음 문장에서 오른쪽 다리가 약해졌다는 \u003cb class=\"key\">결과\u003c/b>로 이어지기 위한 \u003cb class=\"key\">배경\u003c/b> 정보를 주는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어] + [be동사] + [나이], [주절] : \"그녀가 여섯 살 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(be동사 + 형용사 보어)\u003c/span> : [주어] + was[be동사] + [very sick (주격보어/형용사구)] : \"그녀는 매우 아팠다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When she was six years old, 그녀가 여섯 살 때. she was very sick, 그녀는 매우 아팠다. 이 문장 전체를 해석하면, 그녀가 여섯 살 때, 그녀는 매우 아팠다.","hl":"m"},{"n":16,"text":"이 문장은 시간을 나타내는 when 절로 그녀가 여섯 살이던 어린 시절의 일을 소개해요. 바로 뒤에서 오른쪽 다리가 약해졌다는 결과로 이어지기 위한 배경 정보를 주는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째, when이 접속사로 쓰여서 '~할 때'라는 시간의 부사절을 만들고 있어요. 부사절 안에도 주어와 be동사가 그대로 나오는 완전한 문장 형태가 온다는 점을 기억하세요. 두 번째, 주절의 be동사 was 뒤에 형용사 sick이 와서 주어 she의 상태를 설명하는 주격보어예요. very는 형용사 sick을 꾸며서 정도를 강조해 주고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 오른쪽 다리가\u003c/span>\u003cspan class=\"en\">Her right leg\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 약해졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">weaker\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 왼쪽 다리보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003cspan class=\"tgt\">leg\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 오른쪽 다리가 그녀의 왼쪽 다리보다 더 약해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여섯 살 때 앓은 병 때문에 오른쪽 다리에 \u003cb class=\"key\">변화\u003c/b>가 생겼다는 사실을 전해요. \u003cb class=\"key\">became\u003c/b>과 \u003cb class=\"key\">비교급\u003c/b> 표현이 함께 쓰여, 왼쪽 다리와 비교해 오른쪽 다리가 더 약해진 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 became + 비교급 보어\u003c/span> : [주어] + became[상태 변화 동사] + [weaker (주격보어)] : \"더 약해졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 than 비교 대상\u003c/span> : [비교급] + than + [비교 대상] : \"그녀의 왼쪽 다리보다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Her right leg, 그녀의 오른쪽 다리가. became weaker, 더 약해졌다. than her left leg, 그녀의 왼쪽 다리보다. 이 문장 전체를 해석하면, 그녀의 오른쪽 다리가 그녀의 왼쪽 다리보다 더 약해졌다.","hl":"m"},{"n":19,"text":"이 문장은 여섯 살 때 앓은 병 때문에 오른쪽 다리에 변화가 생겼다는 사실을 전해요. became과 비교급 표현이 함께 쓰여서 왼쪽 다리와 비교해 오른쪽 다리가 더 약해진 상태 변화를 보여 주죠.","hl":"mn"},{"n":20,"text":"첫 번째, became은 '~하게 되었다'라는 상태 변화를 나타내는 동사예요. 뒤에 비교급 형용사 weaker가 주격보어로 와서 주어의 변화된 상태를 설명해 주죠. 두 번째, 비교급 weaker 뒤에 than이 와서 비교의 대상인 her left leg를 이끌어요. 그래서 왼쪽 다리보다 더 약하다는 비교 의미가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그녀는 생각했다,\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 나아질 거야.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그녀는 “나는 나아질 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸이 아팠던 어린 시절에도 프리다는 절망하지 않고 스스로에게 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">말\u003c/b>을 걸어 줍니다. 이 문장은 바로 뒤에 이어지는 ‘나는 나처럼 아픈 사람들을 도울 거야’라는 결심의 출발점이에요. 여기서 \u003cb class=\"key\">will\u003c/b>은 단순한 미래가 아니라 ‘반드시 그렇게 되고 말 거야’라는 \u003cb class=\"key\">의지\u003c/b>를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (think + 목적어절)\u003c/span> : think + [that] + 주어 + 동사 : \"그녀는 …라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형 (미래·의지)\u003c/span> : 주어 + will + [[동사원형]] (get) : \"나는 나아질 거야\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But she thought, 하지만 그녀는 생각했다. \"I will get well, “나는 나아질 거야.. 이 문장 전체를 해석하면, 하지만 그녀는 “나는 나아질 거야.","hl":"m"},{"n":22,"text":"이 문장은 프리다가 아픈 몸속에서도 스스로에게 긍정적인 말을 걸어 주는 장면이에요. will은 여기서 ‘나아질 거야’라는 강한 의지를 나타내고, get well은 ‘나아지다, 회복하다’라는 뜻의 관용표현이에요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 접속사 that이 생략된 목적어절이에요. she thought 뒤에 ‘~라고’라는 뜻의 that이 원래 있어야 하지만 회화나 문학 문장에서는 자주 생략돼요. 그래서 she thought 바로 뒤에 나오는 I will get well이 통째로 think의 목적어 역할을 하는 거죠. 두 번째 포인트는 조동사 will이에요. will 뒤에는 반드시 동사원형이 오기 때문에 get이라고 써야 하고, gets나 got은 쓸 수 없어요. 그리고 여기서 will은 단순한 미래가 아니라 ‘반드시 나아지고 말 거야’라는 의지를 담고 있다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아픈 사람들을 도울 거야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> sick people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나처럼.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 나처럼 아픈 사람들을 도울 거야.”라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 프리다가 자신이 아팠던 경험을 \u003cb class=\"key\">이타심\u003c/b>으로 바꾸는 장면입니다. ‘나처럼 아픈 사람들’이라는 표현에는 같은 처지의 사람을 이해하는 마음이 담겨 있죠. 그리고 이 \u003cb class=\"key\">결심\u003c/b>은 훗날 그녀가 그림으로 많은 사람을 위로하는 삶으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형\u003c/span> : 주어 + will + [[동사원형]] (help) : \"나는 도울 거야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like + 목적격\u003c/span> : 전치사 like + [[목적격]] (I → me) : \"나처럼\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I will help sick people, 나는 아픈 사람들을 도울 거야. like me.\", 나처럼.”. 이 문장 전체를 해석하면, 나는 나처럼 아픈 사람들을 도울 거야.”라고 생각했다.","hl":"m"},{"n":25,"text":"이 문장은 프리다가 자신이 아팠던 경험을 이타심으로 바꾸는 장면이에요. 나처럼 아픈 사람들이라는 표현에는 같은 처지의 사람을 이해하는 마음이 담겨 있죠. 그리고 이 결심은 훗날 그녀가 그림으로 많은 사람을 위로하는 삶으로 이어져요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 조동사 will이에요. will help처럼 will 뒤에는 언제나 동사원형이 오고, helps나 helped는 올 수 없어요. 두 번째 포인트는 전치사 like예요. like는 ‘좋아하다’라는 동사로도 쓰이지만, 여기서는 뒤에 목적격 me가 오는 전치사로 쓰여서 ‘나처럼’이라는 뜻이 돼요. 세 번째 포인트는 목적어 자리인데요, help 뒤에 sick people이 목적어로 와서 ‘아픈 사람들을 돕다’라는 3형식 문장이 만들어진 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 열여덟 살이었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">18\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 당했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끔찍한 버스 사고를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">terrible \u003c/span>\u003cspan class=\"tgt\">bus \u003c/span>\u003cspan class=\"tgt\">accident\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 열여덟 살이었을 때, 그녀는 끔찍한 버스 사고를 당했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 프리다의 인생을 완전히 바꾼 \u003cb class=\"key\">버스 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 알려 주는 장면입니다. be in an accident는 ‘사고를 당하다’라는 뜻의 \u003cb class=\"key\">관용표현\u003c/b>이라서 ‘사고 안에 있었다’라고 해석하면 안 됩니다. 이 사고로 그녀는 오랜 병원 생활을 하게 되고, 그 시간이 훗날 \u003cb class=\"key\">자화상\u003c/b>을 그리게 된 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 when\u003c/span> : When + 주어 + 동사, + 주절 : \"그녀가 열여덟 살이었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 전치사구 (관용표현 be in an accident)\u003c/span> : be in an accident = [[사고를 당하다]] : \"끔찍한 버스 사고를 당했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When she was 18, 그녀가 열여덟 살이었을 때. she was in, 그녀는 당했다. a terrible bus accident, 끔찍한 버스 사고를. 이 문장 전체를 해석하면, 그녀가 열여덟 살이었을 때, 그녀는 끔찍한 버스 사고를 당했다.","hl":"m"},{"n":28,"text":"이 문장은 프리다의 인생을 완전히 바꾼 버스 사고를 알려 주는 장면이에요. be in an accident는 ‘사고를 당하다’라는 뜻의 관용표현이라서 ‘사고 안에 있었다’라고 해석하면 안 되죠. 이 사고로 그녀는 오랜 병원 생활을 하게 되고, 그 시간이 훗날 자화상을 그리게 된 계기가 돼요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 시간의 부사절 접속사 when이에요. when은 ‘~할 때’라는 뜻으로 뒤에 주어와 동사가 있는 완전한 절을 이끌어요. 두 번째 포인트는 be동사 was가 들어간 be in an accident라는 관용표현이에요. 이때 in은 ‘~안에’가 아니라 사고를 겪었다는 뜻을 만들어 주는 전치사로 봐야 해요. 세 번째로 a terrible bus accident에서 a가 붙은 걸 보면 버스 사고 하나를 셀 수 있는 명사로 보고 있다는 것도 알 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 머물렀다\u003c/span>\u003cspan class=\"en\">She stayed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">병원에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hospital\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 오랫동안 병원에 머물렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 칼로가 버스 사고를 당한 뒤 병원에서 오랫동안 지냈다는 사실을 전하는 문장이에요. 바로 뒤에서 그녀가 스스로에게 하는 말이 나오기 때문에, 그 말이 얼마나 절실했는지 보여 주는 \u003cb class=\"key\">배경\u003c/b>이 되어요. 긴 병원 생활이라는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 꼭 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : stayed [자동사] + in + the hospital [전치사구] : \"병원에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간(지속)\u003c/span> : stayed [자동사] + for + [기간] : \"오랫동안\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"She stayed, 그녀는 머물렀다. in the hospital, 병원에. for a long time, 오랫동안. 이 문장 전체를 해석하면, 그녀는 오랫동안 병원에 머물렀다.","hl":"m"},{"n":31,"text":"이 문장은 칼로가 사고 뒤에 병원에서 오랫동안 지냈다는 사실을 알려 줘요. 바로 다음에 그녀가 스스로에게 하는 말이 나오니까, 이 문장은 그 말이 얼마나 절실했는지 보여 주는 배경이 되죠. 긴 병원 생활이라는 시간 정보를 꼭 기억해 두세요.","hl":"mn"},{"n":32,"text":"먼저 전치사 for를 눈여겨보세요. for 뒤에 기간이 오면 그 기간 동안 계속이라는 뜻이에요. 그래서 오랫동안이라는 지속의 의미가 만들어지죠. 그리고 in the hospital은 병원에라는 장소 표현인데, 관사 the를 써서 특정 병원에 입원해 있었다는 느낌을 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">칼로는 그녀 자신에게 말했다\u003c/span>\u003cspan class=\"en\">Kahlo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">herself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 약해 보여\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">weak\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">칼로는 “나는 약해 보여.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사고 뒤에 칼로가 스스로에게 한 말이에요. 겉으로는 약해 보인다고 솔직하게 인정하면서도, 바로 다음 문장에서 누구보다 강하다고 말하기 때문에 \u003cb class=\"key\">반전\u003c/b>의 출발점이 되어요. 이 문장과 다음 문장을 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">쌍\u003c/b>으로 묶어서 기억하면 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사 (say to oneself)\u003c/span> : said [동사] + to + herself [재귀대명사] : \"그녀 자신에게 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사(2형식)\u003c/span> : look [감각동사] + weak [형용사(주격보어)] : \"약해 : [동사 painted] + [재귀대명사 themselves] : \"그들 자신을 그렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 명사 (이유)\u003c/span> : for + [명사 different reasons] : \"다른 이유로\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Van Gogh and Kahlo, 반 고흐와 칼로는. painted themselves, 그들 자신을 그렸다. for different reasons, 다른 이유로. 이 문장 전체를 해석하면, 반 고흐와 칼로는 다른 이유로 그들 자신을 그렸다.","hl":"m"},{"n":52,"text":"여기서는 반 고흐와 칼로를 한 문장에 나란히 놓고 비교하고 있어요. 두 사람 모두 자화상을 많이 그렸지만 그 이유는 서로 달랐다는 뜻이죠. 그래서 이 문장이 다음 문장의 공통점 이야기로 자연스럽게 이어 줍니다.","hl":"mn"},{"n":53,"text":"첫 번째로 볼 것은 Van Gogh and Kahlo처럼 주어가 두 개로 나란히 연결된 병렬 구조예요. 두 번째로 painted themselves에서 themselves는 주어를 다시 가리키는 재귀대명사라서 스스로를 그렸다는 뜻이 되죠. 세 번째로 for different reasons는 전치사 for가 이유를 나타내는 덩어리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 그림은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> paintings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 공통점을 가지고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">common\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들의 그림은 한 가지 공통점이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 이유가 서로 달랐다고 한 것과 But으로 대비시키면서, 두 화가의 그림에는 딱 하나 \u003cb class=\"key\">공통점\u003c/b>이 있다고 말해요. have one thing in common은 한 가지 공통점을 가지고 있다는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요. 다음 문장에서 그 공통점이 무엇인지 알려 주는 징검다리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 대명사 (앞 문장의 명사 지칭)\u003c/span> : [소유격 their] + [명사 paintings] : \"그들의 그림은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 have ... in common\u003c/span> : have + [one thing] + in common (공통점을 가지고 있다) : \"한 가지 공통점을 가지고 있다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"But, 하지만. their paintings, 그들의 그림은. have one thing in common, 한 가지 공통점을 가지고 있다. 이 문장 전체를 해석하면, 하지만 그들의 그림은 한 가지 공통점이 있다.","hl":"m"},{"n":55,"text":"이 문장은 앞에서 두 화가가 자신을 그린 이유가 달랐다고 한 것과 대비해서, 그런데 그들의 그림에는 한 가지 공통점이 있다고 말하고 있어요. have one thing in common은 한 가지 공통점을 가지고 있다는 관용 표현이죠. 바로 다음 문장에서 그 공통점이 무엇인지 알려 줄 거예요.","hl":"mn"},{"n":56,"text":"첫 번째로 their는 앞 문장에 나온 반 고흐와 칼로를 가리키는 소유격이에요. 그래서 their paintings는 그들의 그림이라는 뜻이 되죠. 두 번째로 have one thing in common은 한 가지 공통점을 가지고 있다는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 감동시킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">touch\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hearts \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 많은 사람들의 마음을 감동시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 반 고흐와 칼로 그림의 \u003cb class=\"key\">공통점\u003c/b>을 최종적으로 정리하는 결론이에요. 두 화가의 그림이 많은 사람들의 \u003cb class=\"key\">마음을 \u003c/b>\u003cb class=\"key\">감동시키다\u003c/b>는 뜻이죠. touch the hearts of는 직역하면 '심장을 만지다'지만 실제로는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 쓰여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 주어 현재시제 수 일치\u003c/span> : [They (복수 주어)] + [touch (동사원형)] : \"그것들은 감동시킨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of를 이용한 소유 표현\u003c/span> : [the hearts] + [of] + [many people] : \"많은 사람들의 마음\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"They touch, 그것들은 감동시킨다. the hearts, 마음을. of many people, 많은 사람들의. 이 문장 전체를 해석하면, 그것들은 많은 사람들의 마음을 감동시킨다.","hl":"m"},{"n":58,"text":"이 문장은 앞에서 말한 반 고흐와 칼로 그림의 공통점을 최종적으로 정리하는 결론이에요. 두 화가의 그림이 많은 사람들의 마음을 감동시키다, 이게 바로 그 공통점이죠. touch the hearts of는 직역하면 심장을 만지다지만 실제로는 관용 표현으로 쓰여요.","hl":"mn"},{"n":59,"text":"첫 번째로 They touch를 보면 주어 They가 복수라서 동사에 s를 붙이지 않고 동사원형 touch를 써요. 주어와 동사의 수 일치를 꼭 확인하세요. 두 번째로 the hearts of many people은 of를 이용한 소유 표현이에요. many people이 the hearts를 소유하는 관계라서 같은 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>멕시코의 화가 \u003cb class=\"key\">프리다 \u003c/b>\u003cb class=\"key\">칼로\u003c/b>는 여섯 살 때 병으로 오른쪽 다리가 약해졌지만, 나아져서 아픈 사람들을 돕겠다고 \u003cb class=\"key\">다짐\u003c/b>했다.\u003c/li>\u003cli>열여덟 살에 끔찍한 \u003cb class=\"key\">버스 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 당한 뒤, 그녀는 '나는 \u003cb class=\"key\">누구보다 \u003c/b>\u003cb class=\"key\">강해\u003c/b>'라고 말하며 자신을 그리기 시작했다.\u003c/li>\u003cli>그녀는 일생 동안 55점의 \u003cb class=\"key\">자화상\u003c/b>을 남겼고, 그 그림들을 보며 우리는 그녀가 \u003cb class=\"key\">강해\u003c/b> 보이는지 묻게 된다.\u003c/li>\u003cli>반 고흐와 칼로는 다른 이유로 자신을 그렸지만, 두 사람의 그림은 많은 사람들의 \u003cb class=\"key\">마음\u003c/b>을 감동시킨다는 \u003cb class=\"key\">공통점\u003c/b>이 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Frida Kahlo's self-portraits, painted through her suffering, like Van Gogh's, touch the hearts of many people.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">멕시코 화가 \u003cb class=\"key\">프리다 \u003c/b>\u003cb class=\"key\">칼로\u003c/b>는 여섯 살의 병과 열여덟 살의 버스 사고를 겪으며 자신을 그리기 시작해 평생 55점의 \u003cb class=\"key\">자화상\u003c/b>을 남겼고, 그 그림은 반 고흐의 그림처럼 많은 사람들의 \u003cb class=\"key\">마음\u003c/b>을 감동시킨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":60,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 프리다 칼로는 병과 사고라는 고통 속에서도 자신을 그리기 시작해 오십오 점의 자화상을 남겼습니다. 그 그림들은 반 고흐의 그림과 이유는 달라도, 많은 사람들의 마음을 감동시킨다는 공통점이 있어요. 약함을 강함으로 바꾼 그녀의 자화상, 오늘 꼭 기억해 두세요. 수고했어요, 여러분.","hl":null}]}]});</script></body></html>
