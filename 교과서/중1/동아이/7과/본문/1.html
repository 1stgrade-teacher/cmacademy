<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중1 2학기 기말대비 중1 동아(이) 7과 본문1 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"중1 2학기 기말대비 중1 동아(이) 7과 본문1","audioDir":"1_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.597em\">중1\u003cbr>동아(이)\u003cbr>7과 본문1\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">중1 2학기 기말대비\u003c/div>\u003ch1>Why Did Van Gogh Paint Himself?\u003c/h1>\u003ch2>반 고흐는 왜 자신을 그렸을까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 몇몇 화가들은 왜 \u003cb class=\"key\">자화상\u003c/b>을 그렸을까? \u003cb class=\"key\">빈센트 \u003c/b>\u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">고흐\u003c/b>는 사람을 그리고 싶었지만 모델을 쓸 돈이 없어 자신을 그리기 시작했고, 결국 \u003cb class=\"key\">서른여섯 \u003c/b>\u003cb class=\"key\">점\u003c/b>의 서로 다른 자화상을 남겼다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Van Gogh painted many self-portraits because he could not afford models.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 동아 이재영 교과서 칠 과 본문 첫 번째 이야기예요. 이 글은 화가들이 왜 자화상을 그렸는지, 특히 빈센트 반 고흐가 왜 자신을 그렸는지를 다루고 있어요. 반 고흐는 모델을 쓸 돈이 없어서 자신을 그리기 시작했고, 서른여섯 점의 자화상을 남겼다는 내용이에요. 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">자화상\u003c/b>(self-portrait)은 화가가 거울이나 사진을 보며 자기 모습을 그린 그림이에요. \u003cb class=\"key\">빈센트 \u003c/b>\u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">고흐\u003c/b>(Vincent van Gogh)는 네덜란드 출신의 \u003cb class=\"key\">후기 \u003c/b>\u003cb class=\"key\">인상주의\u003c/b>(Post-Impressionism) 화가로, 강렬한 색과 붓터치로 유명해요. 그런데 그는 살아 있을 때 그림이 거의 팔리지 않아 무척 가난했고, 그래서 값비싼 \u003cb class=\"key\">모델\u003c/b>(model)을 구하기가 어려웠어요. 모델을 세워 놓고 그림을 그리는 일은 셀카를 찍는 것과 달리 시간도 돈도 많이 드는 작업이에요. 결국 그는 거울 속 자신을 모델 삼아 자화상을 그리기 시작했고, 지금은 그 작품들이 그의 대표작이 되었어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 자화상은 영어로 self-portrait라고 하는데, 화가가 거울을 보며 자기 모습을 그린 그림이에요. 빈센트 반 고흐는 네덜란드 출신의 후기 인상주의 화가로, 강렬한 색과 붓터치로 아주 유명하죠. 그런데 그는 살아 있을 때 그림이 거의 팔리지 않아서 무척 가난했어요. 모델을 세워 놓고 그림을 그리는 일은 셀카를 찍는 것과 달리 시간도 돈도 많이 드는 작업이에요. 그래서 값비싼 모델을 구하기 어려웠던 그는 결국 거울 속 자신을 모델 삼아 자화상을 그리기 시작했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문으로 열기\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>글은 가장 \u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">화가\u003c/b>가 누구인지, 그가 어떻게 생겼는지 묻는 질문으로 시작해요. 이어서 몇몇 화가들이 \u003cb class=\"key\">자화상\u003c/b>을 그렸다는 사실을 제시하죠. 그런데 '그들은 왜 자신을 그렸을까?'라는 새로운 \u003cb class=\"key\">질문\u003c/b>을 던지며 독자의 궁금증을 자극해요. 마지막으로 함께 \u003cb class=\"key\">알아보자\u003c/b>고 하며 본론으로 이끌어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 제기\u003csmall>문제 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>이제 \u003cb class=\"key\">빈센트 \u003c/b>\u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">고흐\u003c/b>가 등장해요. 그는 네덜란드 화가였지만 \u003cb class=\"key\">일생 \u003c/b>\u003cb class=\"key\">동안 \u003c/b>\u003cb class=\"key\">유명하지 \u003c/b>\u003cb class=\"key\">않았어요\u003c/b>. 서른세 살에 \u003cb class=\"key\">파리\u003c/b>로 이주한 그는 사람들을 그리고 싶어 했죠. 하지만 \u003cb class=\"key\">모델\u003c/b>을 쓰는 비용이 너무 비쌌다는 \u003cb class=\"key\">문제\u003c/b>가 드러나요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자화상 시작\u003csmall>해결 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>고민에 빠진 반 고흐는 '나는 모델을 쓸 돈이 없어, 내가 무엇을 할 수 있을까?'라며 \u003cb class=\"key\">자문\u003c/b>해요. 그리고 스스로를 그리기 시작하는 \u003cb class=\"key\">해결책\u003c/b>을 찾죠. 그 결과 그는 무려 \u003cb class=\"key\">서른여섯 \u003c/b>\u003cb class=\"key\">점\u003c/b>의 자화상을 남겼어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>두 그림 비교\u003csmall>결과 · 문장 14–17\u003c/small>\u003c/h4>\u003cp>그의 자화상들은 모두 \u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">다르다\u003c/b>는 점이 흥미로워요. 글은 이 두 그림을 보라고 하며 \u003cb class=\"key\">비교\u003c/b>로 이끌어요. 한 그림이 다른 그림보다 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">밝다\u003c/b>고 설명하죠. 마지막으로 어느 것이 마음에 드는지 \u003cb class=\"key\">질문\u003c/b>하며 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 질문으로 글을 여는 부분이에요. 가장 좋아하는 화가가 누구인지, 그 화가가 어떻게 생겼는지 묻고 있죠. 이어서 몇몇 화가들이 자화상을 그렸다는 사실을 꺼내고, 그들은 왜 자신을 그렸을까라는 질문을 던져요. 함께 알아보자고 하면서 본론으로 들어갑니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 빈센트 반 고흐가 등장해요. 그는 네덜란드 화가였지만 일생 동안 유명하지 않았어요. 서른세 살이었을 때 파리로 이주했고, 사람들을 그리고 싶어 했죠. 그런데 모델을 쓰는 비용이 너무 비쌌다는 문제가 드러납니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 문제를 해결하는 부분이에요. 반 고흐는 모델을 쓸 돈이 없다고 생각하고, 내가 무엇을 할 수 있을까 고민해요. 그래서 그는 자신을 그리기 시작했죠. 그 결과 서른여섯 점의 자화상을 남기게 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 그 자화상들이 모두 서로 다르다는 점을 말해요. 그리고 두 그림을 보라고 하면서 비교로 이끌죠. 한 그림이 다른 그림보다 더 밝다고 설명하고, 마지막으로 어느 것이 마음에 드는지 묻습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음에 '화가들은 왜 자신을 그렸을까'라는 \u003cb class=\"key\">질문\u003c/b>을 던져요. 그다음 반 고흐가 \u003cb class=\"key\">모델\u003c/b>을 쓸 돈이 없어 자화상을 그리기 시작했다는 \u003cb class=\"key\">답\u003c/b>을 제시하죠. 이렇게 원인과 결과가 이어지는 \u003cb class=\"key\">문제-해결\u003c/b> 구조이고, 핵심 답이 글 뒷부분에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why (4)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>문제 제시\u003c/span>\u003cb>So (12)\u003c/b>\u003cspan>해결·결과\u003c/span>\u003cb>Which (17)\u003c/b>\u003cspan>질문 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">paint self-portraits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">paint themselves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">paint himself\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">self-portraits\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 구조로 되어 있어요. 사람을 그리고 싶지만 모델이 너무 비싸다는 문제가 먼저 나오고, 그 문제를 자신을 그리는 방법으로 해결하죠. 그래서 전개 방식은 문제 해결이고, 핵심이 되는 답이 글의 뒷부분에 나오기 때문에 미괄식이라고 볼 수 있어요. 주제문은 반 고흐가 자신을 그리기 시작했다는 문장이에요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 왜냐고 묻는 Why가 앞에서 질문을 던지고, but이 나오면서 모델이 비싸다는 어려움이 드러나요. 그리고 So가 나오면서 해결과 결과를 이끌죠. 또 self-portraits와 themselves, himself가 같은 개념을 반복해서 가리키고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>favorite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가, 화가\u003c/span>\u003c/div>\u003cdiv>\u003cb>look like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 보이다, ~의 생김새이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(그림을) 그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Why\u003c/b>\u003cem>부사\u003c/em>\u003cspan>왜\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-portrait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자화상\u003c/span>\u003c/div>\u003cdiv>\u003cb>themselves\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>그들 자신\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다, 찾아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Dutch\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>네덜란드의\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifetime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일생, 평생\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이사하다, 이주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>want\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모델\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼, 값비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>money\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돈\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>himself\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>그 자신\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른, 서로 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bright\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>밝은\u003c/span>\u003c/div>\u003cdiv>\u003cb>than\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>other\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>다른 것, 나머지\u003c/span>\u003c/div>\u003cdiv>\u003cb>which\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>어느 것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개를 짚어 볼게요. look like는 어떻게 생겼는지 묻는 표현이고, expensive는 값이 비싸다는 뜻이에요. lifetime은 일생, 평생이라는 뜻으로 in his lifetime처럼 쓰여요. look at은 보라는 뜻이고, bright는 밝은이라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">pricey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bright\u003c/b>\u003cspan class=\"m\">밝은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shining\u003c/span>\u003cspan class=\"s\">luminous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dark\u003c/span>\u003cspan class=\"a\">dim\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">artist\u003c/b>\u003cspan class=\"m\">예술가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">painter\u003c/span>\u003cspan class=\"s\">creator\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">want\u003c/b>\u003cspan class=\"m\">원하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">desire\u003c/span>\u003cspan class=\"s\">wish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"s\">commence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. famous는 유명한이라는 뜻으로 well-known, renowned와 비슷하고, unknown, obscure와 반대예요. expensive는 costly, pricey와 비슷하고 cheap, inexpensive과 반대죠. different는 various, distinct와 가깝고 same, similar와 반대돼요. bright는 shining, luminous와 비슷하고 dark, dim과 반대입니다. artist는 painter, creator와 비슷한 말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구인가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Who\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 가장 좋아하는 화가는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">favorite \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 가장 좋아하는 화가는 누구인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방에게 가장 좋아하는 화가가 누구인지 물어보며 대화를 여는 문장이에요. 이 질문을 시작으로 화가와 자화상 이야기가 이어지기 때문에 글의 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b> 역할을 해요. favorite은 '가장 좋아하는'이라는 뜻으로 명사 앞에서 명사를 꾸며 주는 \u003cb class=\"key\">형용사\u003c/b>라는 점도 함께 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 who(주격 보어)\u003c/span> : Who + be동사 + [주어]? → [주어]는 누구인가? : \"누구인가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문의 주어(소유격+형용사+명사)\u003c/span> : [소유격 your] + [형용사 favorite] + [명사 artist] : \"당신이 가장 좋아하는 화가는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Who is, 누구인가. your favorite artist?, 당신이 가장 좋아하는 화가는. 이 문장 전체를 해석하면, 당신이 가장 좋아하는 화가는 누구인가?","hl":"m"},{"n":13,"text":"이 문장은 대화를 시작하면서 상대방에게 가장 좋아하는 화가가 누구인지 물어보는 질문이에요. 뒤에 나올 자화상 이야기로 자연스럽게 들어가기 위한 도입 질문이라고 보시면 돼요. favorite은 가장 좋아한다는 뜻으로 명사 앞에서 꾸며 주는 형용사라는 것도 같이 기억해 두세요.","hl":"mn"},{"n":14,"text":"먼저 Who는 사람을 물을 때 쓰는 의문사예요. be동사 is 뒤에 오는 자리는 주격 보어 자리인데, 여기서는 의문사 Who가 그 자리에 올라가 있죠. 그리고 your favorite artist는 소유격 your와 형용사 favorite이 명사 artist를 꾸미는 주어 덩어리예요. 의문사가 앞으로 나가도 주어는 be동사 뒤에 그대로 남는다는 점, 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇\u003c/span>\u003cspan class=\"en\">What\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀나 그는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 생겼는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀나 그는 어떻게 생겼는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 화가가 누구인지 물었으니, 이번에는 그 화가의 생김새를 묻는 질문이에요. she or he라고 해서 그녀나 그를 함께 묶어 둔 것이 포인트죠. What과 look like가 만나면 '어떻게 생겼는가'라는 \u003cb class=\"key\">생김새\u003c/b>를 묻는 표현이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 조동사 do(3인칭 단수 does)+동사원형\u003c/span> : 의문사 + [does] + [주어] + [동사원형 look]? : \"그녀나 그는 ~처럼 보이는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or로 연결된 병렬 주어\u003c/span> : [명사 she] + or + [명사 he] : \"그녀나 그는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현 look like(~처럼 보이다)\u003c/span> : look like + [명사·대명사] → ~처럼 보이다 : \"~처럼 보이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What, 무엇. does she or he, 그녀나 그는. look like?, 어떻게 생겼는가. 이 문장 전체를 해석하면, 그녀나 그는 어떻게 생겼는가?","hl":"m"},{"n":16,"text":"이 문장은 앞 문장에 이어서 상대방이 좋아하는 화가의 생김새를 묻는 질문이에요. she or he라고 해서 그녀나 그를 함께 묶어 둔 것이 포인트죠. look like는 겉모습이 어떠하다는 뜻으로, What과 만나면 어떻게 생겼는가라는 질문이 돼요.","hl":"mn"},{"n":17,"text":"먼저 What은 무엇을 묻는 의문사인데, 여기서는 look like와 짝을 이뤄 어떻게 생겼는지를 묻고 있어요. 일반동사가 있는 의문문이라 조동사 do가 필요하고, 주어가 3인칭 단수라서 does가 쓰였어요. 그리고 조동사 뒤에는 반드시 동사원형 look이 온다는 것도 확인해 주세요. 또 she or he는 or로 연결된 병렬 주어이고, look like는 통째로 외워 두면 좋은 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 화가들은\u003c/span>\u003cspan class=\"en\">Some artists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">painted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자화상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">self-portraits\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 화가들은 자화상을 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '자화상'이라는 주제를 처음 꺼내는 문장이에요. 화가가 누구인지 묻던 흐름에서 화가들이 자화상을 그렸다는 사실로 글의 방향을 돌려 놓죠. 그래서 뒤에서 왜 스스로를 그렸는지, 누가 그렸는지가 자연스럽게 이어질 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(주어+타동사+목적어)\u003c/span> : [주어 Some artists] + [타동사 painted] + [목적어 self-portraits] : \"자화상을 그렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합명사 self-portrait의 복수형\u003c/span> : [self 자화상] + [portrait 초상화] → 복수형 self-portraits : \"자화상들\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some artists, 몇몇 화가들은. painted, 그렸다. self-portraits, 자화상을. 이 문장 전체를 해석하면, 몇몇 화가들은 자화상을 그렸다.","hl":"m"},{"n":19,"text":"이 문장은 자화상이라는 주제를 처음 꺼내는 문장이에요. 앞에서 화가에 대해 물었으니, 이제 화가들이 자화상을 그렸다는 사실을 알려 주면서 글의 방향을 자화상 쪽으로 돌려 놓죠. 그래서 뒤에서 왜 스스로를 그렸는지, 누가 그렸는지가 이어질 수 있는 거예요.","hl":"mn"},{"n":20,"text":"먼저 paint는 그림을 그리다라는 뜻의 타동사라서 뒤에 그 대상인 목적어가 꼭 필요한 동사예요. 그래서 painted 뒤에 self-portraits가 목적어로 오는 문장이 만들어졌어요. 그리고 self-portraits는 self와 portrait가 결합한 복합명사에 복수형 s가 붙은 형태라는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그렸을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 왜 그들 자신을 그렸을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 언급한 self-portraits, 즉 자화상을 화가들이 왜 그렸는지 \u003cb class=\"key\">이유\u003c/b>를 묻는 \u003cb class=\"key\">의문문\u003c/b>이에요. 여기서 themselves는 주어 they가 자기 자신을 그렸다는 것을 나타내는 \u003cb class=\"key\">재귀대명사\u003c/b>죠. 이 질문이 뒤에서 반 고흐의 예를 통해 답을 찾아가는 글의 출발점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문(과거 시제)\u003c/span> : 의문사 + did + 주어 + 동사원형? : \"왜 그들은 그렸을까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사(목적어)\u003c/span> : 주어 + 동사 + 재귀대명사(주어와 같은 대상) : \"그들 자신을\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Why, 왜. did they paint, 그들은 그렸을까. themselves?, 그들 자신을. 이 문장 전체를 해석하면, 그들은 왜 그들 자신을 그렸을까?","hl":"m"},{"n":22,"text":"이 문장은 앞에서 나온 self-portraits, 그러니까 자화상을 화가들이 왜 그렸는지 이유를 묻는 의문문이에요. 여기서 themselves는 재귀대명사로, 주어인 they가 바로 자기 자신을 그렸다는 걸 보여 줘요. 이 질문이 글 전체에서 답을 찾아가는 출발점이 되는 거죠.","hl":"mn"},{"n":23,"text":"먼저 Why did they paint 부분을 볼게요. 의문사 Why가 앞에 나오면 조동사 did가 주어 앞으로 나가고, 본동사는 동사원형 paint를 쓴다는 게 핵심이에요. 과거 사실을 묻기 때문에 did를 썼다는 것도 같이 기억해 주세요. 그리고 themselves는 주어 they와 같은 대상을 가리키는 재귀대명사로, 목적어 자리에 쓰여서 그들 자신을이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알아보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 던진 질문에 대한 답을 함께 찾아보자는 \u003cb class=\"key\">제안\u003c/b> 표현이에요. 아주 짧은 문장이지만 바로 다음 내용으로 넘어가는 \u003cb class=\"key\">전환\u003c/b> 역할을 하죠. 뒤에서 반 고흐 이야기가 시작된다는 신호라고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유형 명령문(Let's + 동사원형)\u003c/span> : Let's + 동사원형 : \"알아보자\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Let's, 하자. find out, 알아보자. 이 문장 전체를 해석하면, 알아보자.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 던진 질문의 답을 함께 찾아보자는 제안이에요. 짧지만 다음 내용으로 넘어가는 전환 역할을 하죠. 바로 뒤에서 반 고흐 이야기가 시작된다는 신호라고 보면 돼요.","hl":"mn"},{"n":26,"text":"Let's find out은 Let us의 줄임말로, 우리 함께 하자는 청유형 표현이에요. Let's 뒤에는 항상 동사원형이 온다는 점, 시험에도 잘 나오니까 꼭 기억해 두세요. 여기서는 find out이 하나의 덩어리로 알아내다라는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빈센트 반 고흐는\u003c/span>\u003cspan class=\"en\">Vincent van Gogh\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네덜란드의 화가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Dutch \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빈센트 반 고흐는 네덜란드의 화가였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 드디어 글의 주인공이 등장하는 문장이에요. Vincent van Gogh는 사람 이름을 나타내는 \u003cb class=\"key\">고유명사\u003c/b>라서 앞에 \u003cb class=\"key\">관사\u003c/b>를 쓰지 않는다는 점이 중요하죠. Dutch는 '네덜란드의'라는 뜻으로, 그가 어느 나라 화가인지 알려 주면서 뒤에 이어질 그의 이야기를 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : 주어 + be동사 + 주격보어(명사) : \"네덜란드의 화가였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정관사 + 국적 형용사 + 명사\u003c/span> : 부정관사 a + 국적 형용사 Dutch + 명사 artist : \"네덜란드의 화가\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Vincent van Gogh, 빈센트 반 고흐는. was, 였다. a Dutch artist, 네덜란드의 화가. 이 문장 전체를 해석하면, 빈센트 반 고흐는 네덜란드의 화가였다.","hl":"m"},{"n":28,"text":"드디어 글의 주인공이 등장하는 문장이에요. Vincent van Gogh는 사람 이름을 나타내는 고유명사라서 앞에 관사를 쓰지 않는다는 점이 중요하죠. Dutch는 네덜란드의라는 뜻으로, 그가 어느 나라 화가인지 알려 주면서 뒤에 이어질 이야기를 예고해 줍니다.","hl":"mn"},{"n":29,"text":"was a Dutch artist는 주어를 설명해 주는 주격보어가 오는 2형식 문장이에요. be동사 was 뒤에 명사 a Dutch artist가 와서 빈센트 반 고흐가 네덜란드의 화가였다고 설명해 주는 거죠. 그리고 사람 이름인 고유명사 앞에는 관사를 쓰지 않지만, 직업을 나타내는 명사 앞에는 이렇게 관사 a를 붙여 준다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명하지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">famous\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 일생 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">lifetime\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그의 일생 동안 유명하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 반 고흐가 살아 있을 때에는 세상이 그를 알아주지 못했다는 사실을 알려 줘요. 그래서 뒤에서 그가 왜 자화상을 그리게 되었는지 이해하려면 이 \u003cb class=\"key\">배경\u003c/b>을 먼저 기억해야 하죠. famous 앞에 not이 붙어 '유명하지 않았다'라는 \u003cb class=\"key\">부정\u003c/b>의 뜻이 된다는 점도 함께 챙겨 주세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형의 부정문\u003c/span> : [주어] + was/were + not + [형용사(주격보어)] : \"유명하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(시간)\u003c/span> : [전치사 in] + [소유격 his] + [명사 lifetime] : \"그의 일생 동안\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He, 그는. was not famous, 유명하지 않았다. in his lifetime, 그의 일생 동안. 이 문장 전체를 해석하면, 그는 그의 일생 동안 유명하지 않았다.","hl":"m"},{"n":31,"text":"이 문장은 반 고흐가 살아 있을 때에는 세상이 그를 알아주지 못했다는 사실을 알려 줘요. 그래서 뒤에서 그가 왜 자화상을 그리게 되었는지 이해하려면 이 배경을 먼저 기억해야 하죠. famous 앞에 not이 붙어서 유명하지 않았다는 부정의 뜻이 된다는 점도 함께 챙겨 주세요.","hl":"mn"},{"n":32,"text":"여기서 첫 번째로 볼 것은 be동사 과거형의 부정문이에요. 주어 He 뒤에 was가 오고, 그 뒤에 not이 붙어서 유명하지 않았다는 부정의 뜻을 만들죠. was 뒤에 오는 famous는 주어의 상태를 설명하는 주격보어라는 것도 같이 기억해 주세요. 두 번째, in his lifetime에서 in은 동안이라는 기간을 나타내는 전치사이고, his lifetime은 그의 일생이라는 뜻이에요. 그래서 이 전치사구가 문장 끝에서 시점을 알려 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 33살이었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">33\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 이주했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">moved \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파리로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Paris\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 33살이었을 때, 그는 파리로 이주했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 반 고흐가 서른세 살에 파리로 옮겨 갔다는 \u003cb class=\"key\">시간\u003c/b> 정보를 전해 줘요. 파리로 이주한 시점이 뒤에 이어지는 그의 그림 활동을 이해하는 \u003cb class=\"key\">배경\u003c/b>이 됩니다. when이 이끄는 부분이 먼저 나오고, 그 뒤에 주절이 오는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부사절\u003c/b> 구조라는 점을 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : [접속사 When] + [주어 he] + [동사 was] + [보어 33] : \"그가 33살이었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">move to + 장소\u003c/span> : [주어] + move(d) + to + [도착지] : \"그는 파리로 이주했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When he was 33, 그가 33살이었을 때. he moved, 그는 이주했다. to Paris, 파리로. 이 문장 전체를 해석하면, 그가 33살이었을 때, 그는 파리로 이주했다.","hl":"m"},{"n":34,"text":"이 문장은 반 고흐가 서른세 살에 파리로 옮겨 갔다는 시간 정보를 전해 줘요. 파리로 이주한 시점이 뒤에 이어지는 그의 그림 활동을 이해하는 배경이 되죠. when이 이끄는 부분이 먼저 나오고, 그 뒤에 주절이 오는 시간 부사절 구조라는 점을 눈여겨보세요.","hl":"mn"},{"n":35,"text":"첫 번째, When he was 33에서 when은 할 때라는 뜻으로 시간 부사절을 이끄는 접속사예요. 부사절 안에도 주어 he와 be동사 was가 있어서 완전한 문장 형태를 이룬다는 것도 꼭 기억해 주세요. 두 번째, he moved to Paris에서 move는 이사하다, 이주하다라는 뜻이고, to 뒤에 도착지 Paris가 와서 어디로 가는지를 나타내요. 과거의 일이라 과거형 moved를 쓴 것도 함께 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 원했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 그리기를,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span> people,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 모델들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> models were\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 비쌌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">expensive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 사람들을 그리고 싶었지만, 모델들은 너무 비쌌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 반 고흐가 자화상을 그리게 된 \u003cb class=\"key\">이유\u003c/b>를 알려 주는 아주 중요한 문장이에요. 사람을 그리고 싶었지만 돈이 없어서 모델을 쓸 수 없었다는 \u003cb class=\"key\">상황\u003c/b>이 담겨 있죠. 그래서 뒤 문장에서 그가 스스로를 모델 삼아 자화상을 그리기 시작한다는 \u003cb class=\"key\">흐름\u003c/b>으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to + 동사원형] : \"그리기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but\u003c/span> : [문장] + but + [문장] : \"그러나, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too + 형용사\u003c/span> : too + [형용사] (+ to부정사) : \"너무 비쌌다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He wanted, 그는 원했다. to paint people, 사람들을 그리기를. but models were, 하지만 모델들은. too expensive, 너무 비쌌다. 이 문장 전체를 해석하면, 그는 사람들을 그리고 싶었지만, 모델들은 너무 비쌌다.","hl":"m"},{"n":37,"text":"이 문장은 반 고흐가 자화상을 그리게 된 이유를 알려 주는 아주 중요한 문장이에요. 사람을 그리고 싶었지만 돈이 없어서 모델을 쓸 수 없었다는 상황이 담겨 있죠. 그래서 뒤 문장에서 그가 스스로를 모델 삼아 자화상을 그리기 시작한다는 흐름으로 이어집니다.","hl":"mn"},{"n":38,"text":"첫 번째, wanted to paint에서 to paint는 wanted의 목적어 역할을 하는 to부정사예요. 그래서 그는 사람들을 그리기를 원했다라고 해석하는 명사적 용법이죠. 두 번째, but은 앞 내용과 반대되는 내용을 이어 주는 등위접속사예요. 여기서는 그리고 싶었다와 너무 비쌌다라는 대조 관계를 만들어 줍니다. 세 번째, too expensive에서 too는 형용사 앞에서 너무, 지나치게라는 뜻을 더해 주는 부사예요. 그래서 너무 비쌌다는 정도의 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">thought,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 돈이 없어\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모델을 쓸\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 “나는 모델을 쓸 돈이 없어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림의 대상이 될 사람을 구할 돈조차 없다는 \u003cb class=\"key\">고민\u003c/b>을 직접화법으로 그대로 보여 주는 문장이에요. 여기서 for a model은 '모델을 쓸, 모델을 위한'이라는 뜻이죠. 이 고민이 바로 뒤에 자화상을 그리게 된 \u003cb class=\"key\">이유\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법(인용문 도입)\u003c/span> : [[think]] + , + &quot;인용문&quot; : \"그는 생각했다,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제의 부정\u003c/span> : 주어 + [[do/does]] + not + [[동사원형]] : \"없어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for의 용법(용도·목적)\u003c/span> : money [[for]] + 명사 : \"모델을 쓸\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"He thought, 그는 생각했다. \"I don't have money, 나는 돈이 없어. for a model, 모델을 쓸. 이 문장 전체를 해석하면, 그는 “나는 모델을 쓸 돈이 없어.","hl":"m"},{"n":40,"text":"여기서 for a model은 그림의 대상이 될 사람, 그러니까 모델을 구하기 위한이라는 뜻이에요. 모델을 쓸 돈이 없다는 고민을 직접화법으로 그대로 보여 주는 문장이죠. 이 고민이 바로 뒤에 자화상을 그리게 된 이유가 됩니다.","hl":"mn"},{"n":41,"text":"먼저 don't have를 볼게요. 일반동사의 부정은 주어에 따라 do나 does를 쓰고, 그 뒤에 not을 붙인 다음 동사를 동사원형으로 되돌려 줍니다. 여기서는 직접화법이라 지금 말하는 시점이 그대로 살아 있어서 don't have가 된 거예요. 다음으로 for a model에서 전치사 for는 '~을 위한'이라는 용도를 나타냅니다. 마지막으로 He thought, 다음에 따옴표로 직접화법을 이어 붙여서 그의 생각을 그대로 전달하고 있다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 할 수 있을까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">do?&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 무엇을 할 수 있을까?”라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반 고흐가 스스로에게 던진 \u003cb class=\"key\">의문문\u003c/b>으로, 답이 없는 막막한 상황을 보여 줘요. 의문사 what이 앞에 나오고 조동사 can이 주어 앞으로 나온 형태죠. 이 고민이 다음 문장의 \u003cb class=\"key\">해결책\u003c/b>으로 이어지는 준비 단계가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문(조동사 도치)\u003c/span> : [[의문사]] + [[조동사]] + 주어 + [[동사원형]]? : \"내가 무엇을 할 수 있을까?\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"What, 무엇을. can I do?\", 내가 할 수 있을까?. 이 문장 전체를 해석하면, 내가 무엇을 할 수 있을까?”라고 생각했다.","hl":"m"},{"n":43,"text":"이건 반 고흐가 스스로에게 던진 질문이에요. 모델도 없고 돈도 없는 막막한 상황에서 '내가 무엇을 할 수 있을까' 하고 고민하는 거죠. 이 의문문이 바로 다음 문장의 해결책으로 이어지는 준비 단계가 됩니다.","hl":"mn"},{"n":44,"text":"의문사가 있는 의문문은 의문사 다음에 조동사가 주어 앞으로 나오는 게 핵심이에요. 여기서는 what 다음에 can이 주어 I 앞에 온 거죠. 그리고 조동사 뒤에는 언제나 동사원형이 옵니다. 그래서 do가 그대로 쓰인 거예요. 이 두 가지만 기억하면 어순 문제는 어렵지 않아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반 고흐는 시작했다\u003c/span>\u003cspan class=\"en\">Van Gogh \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 자신을 그리기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 반 고흐는 그 자신을 그리기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 모델을 쓸 돈이 없다는 고민이 있었죠. So는 그 고민과 이 행동이 \u003cb class=\"key\">인과관계\u003c/b>로 이어진다는 걸 보여 줘요. 결국 반 고흐는 스스로를 그림의 대상으로 삼았고, 이것이 자화상을 그리게 된 \u003cb class=\"key\">계기\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start + [[to부정사]] ([[목적어]]) : \"그리기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀용법\u003c/span> : 주어 = 목적어일 때 [[재귀대명사]](himself) : \"그 자신을\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So, 그래서. Van Gogh started, 반 고흐는 시작했다. to paint himself, 그 자신을 그리기. 이 문장 전체를 해석하면, 그래서, 반 고흐는 그 자신을 그리기 시작했다.","hl":"m"},{"n":46,"text":"앞에서 모델을 살 돈이 없다는 고민이 있었죠. 그래서라는 뜻의 So가 그 고민과 이 행동을 인과관계로 이어 줍니다. 결국 반 고흐는 스스로를 그림의 대상으로 삼았고, 이것이 자화상을 그리게 된 계기가 된 거예요.","hl":"mn"},{"n":47,"text":"먼저 started to paint를 보세요. start는 뒤에 to부정사를 목적어로 데려가는 동사예요. 그래서 '시작했다' 다음에 무엇을 시작했는지 to paint가 목적어 자리로 옵니다. 두 번째로 himself는 재귀대명사예요. 목적어가 주어와 같은 사람을 가리킬 때는 him이 아니라 himself를 씁니다. 그래서 '다른 사람이 아닌 바로 그 자신을 그리기 시작했다'는 뜻이 완성돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">painted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서른여섯 점의 자화상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">36 \u003c/span>\u003cspan class=\"tgt\">self-portraits\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 36점의 자화상을 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반 고흐가 실제로 남긴 자화상이 \u003cb class=\"key\">서른여섯 \u003c/b>\u003cb class=\"key\">점\u003c/b>이나 된다는 사실을 숫자로 보여 주는 문장이에요. 앞에서 자화상을 그리기 시작한 이유를 말했으니, 여기서는 그 결과인 \u003cb class=\"key\">작품 \u003c/b>\u003cb class=\"key\">수\u003c/b>를 제시하며 뒤에 나올 두 그림으로 자연스럽게 시선을 옮겨 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순과거시제\u003c/span> : [주어 He] + [동사 과거형 painted] + [목적어 36 self-portraits] : \"그렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수사 + 복합명사의 복수형\u003c/span> : [수사 36] + [복합명사 self-portrait] + [복수 -s] : \"36점의 자화상\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"He, 그는. painted, 그렸다. 36 self-portraits, 서른여섯 점의 자화상을. 이 문장 전체를 해석하면, 그는 36점의 자화상을 그렸다.","hl":"m"},{"n":49,"text":"이 문장은 반 고흐가 남긴 자화상이 서른여섯 점이나 된다는 걸 알려 줘요. 앞에서 왜 자화상을 그리기 시작했는지 이야기했으니, 여기서는 그 결과를 숫자로 보여 주면서 뒤에 나올 두 그림으로 자연스럽게 넘어가는 거예요.","hl":"mn"},{"n":50,"text":"먼저 첫 번째로 painted를 보세요. 이미 끝난 과거의 일이니까 동사 paint에 -ed를 붙인 과거형을 썼고, 이걸 단순과거라고 불러요. 두 번째로 thirty-six self-portraits를 보면 self와 portrait가 합쳐진 복합명사에 복수형 -s가 붙어 있죠. 숫자가 서른여섯이라서 당연히 복수형을 써야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">different\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 모두 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 서른여섯 점의 자화상이 하나같이 똑같지 않다는 점을 강조하는 문장이에요. 그래서 바로 다음 문장에서 서로 다른 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 함께 보며 비교해 보자고 이어지는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">all의 위치(be동사 뒤)\u003c/span> : [be동사 are] + [all] + [형용사 different] : \"모두 다르다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"They, 그것들은. are all, 모두. different, 다르다. 이 문장 전체를 해석하면, 그것들은 모두 다르다.","hl":"m"},{"n":52,"text":"이 문장은 앞에서 말한 서른여섯 점의 자화상이 하나도 똑같지 않다는 걸 강조해요. 그래서 바로 다음에 서로 다른 두 그림을 비교해 보자고 자연스럽게 이어지는 거예요.","hl":"mn"},{"n":53,"text":"여기서 눈여겨볼 건 are all different예요. all이 be동사 뒤에 오면 주어 전체를 강조하는 부사가 되어서, 그것들은 모두 다르다라는 뜻이 되죠. all의 위치에 따라 느낌이 달라질 수 있으니 be동사 뒤라는 자리를 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보아라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 두 그림을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">paintings\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 두 그림을 보아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자를 직접 두 그림 앞으로 불러 세우는 \u003cb class=\"key\">명령문\u003c/b>이에요. 앞에서 '모두 다르다'고 했으니, 실제로 두 그림을 보며 차이를 확인해 보라는 \u003cb class=\"key\">제안\u003c/b>으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형)\u003c/span> : [동사원형 Look] + [전치사 at] + [목적어] : \"보아라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 these + 복수명사\u003c/span> : [these] + [수사 two] + [복수명사 paintings] : \"이 두 그림\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Look at, 보아라. these two paintings, 이 두 그림을. 이 문장 전체를 해석하면, 이 두 그림을 보아라.","hl":"m"},{"n":55,"text":"이 문장은 독자를 두 그림 앞으로 직접 불러 세우는 명령문이에요. 앞에서 자화상이 모두 다르다고 했으니, 실제로 두 그림을 보면서 차이를 확인해 보라는 제안으로 이어지는 거죠.","hl":"mn"},{"n":56,"text":"먼저 첫 번째로 Look at을 보세요. 상대에게 뭘 하라고 할 때는 주어 You를 생략하고 동사원형으로 시작하는데, 이걸 명령문이라고 해요. 두 번째로 these two paintings를 보면 가까이 있는 여러 개를 가리키는 지시형용사 these 뒤에 복수명사 paintings가 온 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 그림이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 밝다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brighter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 그림보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 그림이 다른 그림보다 더 밝다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 본 두 그림 중 하나가 다른 하나보다 더 밝다는 것을 알려 주는 문장이에요. \u003cb class=\"key\">비교급\u003c/b>을 써서 두 그림의 \u003cb class=\"key\">차이\u003c/b>를 드러내죠. 이렇게 비교해 놓고 바로 다음 문장에서 어느 것을 좋아하는지 독자에게 물어봐요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 one(앞에 나온 명사 반복 회피)\u003c/span> : [앞에 나온 셀 수 있는 명사] → one(단수) / ones(복수) : \"한 그림이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + than 구문\u003c/span> : A is [형용사 비교급 -er] + than + B : \"다른 그림보다 더 밝다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"One, 한 그림이. is brighter, 더 밝다. than the other, 다른 그림보다. 이 문장 전체를 해석하면, 한 그림이 다른 그림보다 더 밝다.","hl":"m"},{"n":58,"text":"앞에서 두 그림을 봤죠. 그중 한 그림이 다른 그림보다 더 밝다고 말하고 있는 거예요. 이렇게 비교급을 써서 두 그림의 차이를 보여 주고, 바로 다음에 어느 것을 좋아하는지 물어보는 흐름으로 이어져요.","hl":"mn"},{"n":59,"text":"첫 번째 포인트는 부정대명사 one이에요. 앞에 나온 painting을 또 쓰지 않고 one으로 짧게 가리키는 거죠. 두 번째 포인트는 비교급이에요. bright에 er을 붙여 brighter로 만들고 뒤에 than을 붙여서, 다른 하나보다 더 밝다고 비교하는 구조예요. 여기서 나머지 하나는 the other로 받는다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Which \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 마음에 드는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 어느 것이 마음에 드는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 그림 중 어느 것을 좋아하는지 독자에게 직접 물어보는 문장이에요. 글을 \u003cb class=\"key\">질문\u003c/b>으로 시작해서 질문으로 끝내면서 독자를 이야기 속으로 끌어들이죠. 앞 문장의 \u003cb class=\"key\">비교\u003c/b>를 바탕으로 선택을 유도하는 마무리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 Which를 쓴 선택 의문문\u003c/span> : Which + (one/명사) + 조동사 + 주어 + 동사? : \"어느 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 의문문(do + 주어 + 동사원형)\u003c/span> : Do/Does + 주어 + 동사원형? : \"당신은 마음에 드는가\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Which one, 어느 것이. do you like?, 당신은 마음에 드는가. 이 문장 전체를 해석하면, 당신은 어느 것이 마음에 드는가?","hl":"m"},{"n":61,"text":"두 그림 중에 어느 것을 좋아하는지 독자한테 직접 묻는 질문이에요. 이 글은 질문으로 시작해서 질문으로 끝나는데, 마지막에 이렇게 물어봄으로써 독자를 이야기 속으로 끌어들이는 거예요.","hl":"mn"},{"n":62,"text":"첫 번째 포인트는 의문사 which예요. 정해진 몇 개 중에서 하나를 고르게 할 때 쓰는 의문사죠. 두 번째 포인트는 일반동사 의문문이에요. like는 be동사가 아니라 일반동사라서 do를 주어 앞에 놓고, 동사는 동사원형 like를 그대로 써요. 그래서 do you like 순서가 되는 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글은 좋아하는 화가와 \u003cb class=\"key\">자화상\u003c/b>에 대한 질문으로 시작한다.\u003c/li>\u003cli>\u003cb class=\"key\">빈센트 \u003c/b>\u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">고흐\u003c/b>는 일생 동안 유명하지 않았고 서른세 살에 파리로 이주했다.\u003c/li>\u003cli>그는 사람을 그리고 싶었지만 \u003cb class=\"key\">모델\u003c/b>이 너무 비싸서 대신 자신을 그리기 시작했다.\u003c/li>\u003cli>그 결과 그는 서로 다른 \u003cb class=\"key\">서른여섯 \u003c/b>\u003cb class=\"key\">점\u003c/b>의 자화상을 남겼고, 글은 두 그림을 비교하며 끝난다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Van Gogh painted many self-portraits because he could not afford models.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 몇몇 화가들은 왜 \u003cb class=\"key\">자화상\u003c/b>을 그렸을까? \u003cb class=\"key\">빈센트 \u003c/b>\u003cb class=\"key\">반 \u003c/b>\u003cb class=\"key\">고흐\u003c/b>는 사람을 그리고 싶었지만 모델을 쓸 돈이 없어 자신을 그리기 시작했고, 결국 \u003cb class=\"key\">서른여섯 \u003c/b>\u003cb class=\"key\">점\u003c/b>의 서로 다른 자화상을 남겼다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"자, 오늘 내용을 정리해 볼게요. 화가들은 왜 자화상을 그렸을까라는 질문에서 시작해서, 반 고흐가 모델을 쓸 돈이 없어 자신을 그리기 시작했다는 이야기였어요. 그는 서른여섯 점의 서로 다른 자화상을 남겼고, 그중 두 그림의 밝기를 비교하며 글을 마무리했죠. 오늘 배운 핵심 단어와 표현 꼭 복습하시고요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
