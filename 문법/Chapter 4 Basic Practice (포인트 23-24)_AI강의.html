}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 4 Basic Practice (포인트 23-24)","audioDir":"Chapter_4_Basic_Practice_(포인트_23-24)_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가정법(as if, I wish) · 제안·요구·당위의 that절 · suggest/insist 의미 구분\u003c/div>\u003ch1>가정법과 (should) 동사원형 that절 총정리 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 문법 문제 풀어 볼게요. 이번 시간은 Chapter 4 Basic Practice, 포인트 스물세 번째와 24번 내용이에요. 가정법과 제안·요구 표현이 섞여 있는 문제들이라 처음엔 헷갈릴 수 있는데, 오늘 네 가지 개념만 확실히 잡으면 전부 풀 수 있어요. 천천히 같이 가 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">제안·요구·당위의 that절 (should) 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">advise, suggest, demand, insist, request, argue 같은 동사나 essential, necessary, important 같은 형용사 뒤 that절에서는 \u003cb class=\"key\">(should) + 동사원형\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">S + advise/suggest/insist + that + S + (should) + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어가 3인칭 단수여도 동사에 -s를 붙이지 않습니다\u003c/li>\u003cli>should는 보통 생략되어 동사원형만 남습니다\u003c/li>\u003cli>be동사는 주어와 상관없이 항상 be를 씁니다\u003c/li>\u003cli>It is essential/necessary/important that ~ 구문도 같은 규칙입니다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I suggest that he take a rest.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 쉬기를 제안한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It is important that every student \u003cspan class=\"fx\">be\u003c/span> on time.\u003c/div>\u003cdiv class=\"g-ko\">모든 학생이 시간을 지키는 것이 중요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념부터 볼게요. advise나 suggest, demand, insist, argue처럼 제안하고 요구하는 동사 뒤에 that절이 오면 그 안의 동사는 인칭이나 시제와 상관없이 동사원형을 씁니다. 원래는 should가 들어 있는데 보통 생략돼서 동사원형만 남는 거예요. 그래서 주어가 he나 she여도 keeps가 아니라 keep을 씁니다. 또 It is essential that이나 It is important that 같은 당위 표현 뒤에도 똑같이 적용되고, 이때 be동사는 무조건 be를 써요. 시험에 정말 자주 나오는 규칙이니까 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">His parents advised that he \u003cspan class=\"p-box\">\u003cspan>keep\u003c/span>\u003ci>/\u003c/i>\u003cspan>keeps\u003c/span>\u003c/span> away from strangers.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">keep\u003c/div>\u003cdiv class=\"p-op\">keeps\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 advise 뒤에 that절이 왔어요. 이 동사가 어떤 성격인지부터 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 keep입니다. advise는 제안하는 동사라서 that절 안에는 should가 생략된 동사원형이 와야 하거든요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">His parents advised that he \u003cspan class=\"p-box\">\u003cspan class=\"ok\">keep\u003c/span>\u003ci>/\u003c/i>\u003cspan>keeps\u003c/span>\u003c/span> away from strangers.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">keep\u003c/div>\u003cdiv class=\"p-op\">keeps\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 성격 확인\u003c/b>advised 뒤에 that절이 왔으므로 \u003cb class=\"key\">제안·충고\u003c/b>의 동사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">규칙 적용\u003c/b>that절 동사는 \u003cb class=\"key\">(should) 동사원형\u003c/b>이므로 he 뒤에도 keep을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">오답 정리\u003c/b>keeps는 3인칭 단수 현재형이라 이 구문에서는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 keep\u003c/span>\u003cdiv class=\"p-full\">His parents advised that he keep away from strangers.\u003c/div>\u003cdiv class=\"p-ko\">그의 부모님은 그가 낯선 사람들을 멀리하라고 충고했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어 he에 끌려 keeps를 고르는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 advised라는 동사를 봐 주세요. 뒤에 that절이 이어지죠. 이건 충고하고 제안하는 동사예요.","hl":"st-0"},{"n":7,"text":"이럴 때 that절 안의 동사는 should가 생략된 동사원형을 씁니다. 그래서 주어가 he여도 keep이에요.","hl":"st-1"},{"n":8,"text":"keeps는 주어 he에 맞춘 평범한 현재형인데, 이 구문에서는 인칭에 맞추지 않기 때문에 답이 될 수 없어요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 주어 he에 끌려 keeps를 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">as if 가정법\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as if 뒤에는 \u003cb class=\"key\">실제와 다른 상황\u003c/b>을 가정해 과거형을 쓰고, 앞선 일을 가정하면 \u003cb class=\"key\">had p.p.\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">as if + S + were/과거동사 (현재 사실 반대) / as if + S + had p.p. (과거 사실 반대)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사는 인칭·수와 상관없이 were를 씁니다\u003c/li>\u003cli>주절 시제가 현재든 과거든 as if절은 한 단계 과거로 물러납니다\u003c/li>\u003cli>이미 일어난 일을 가정하면 had p.p.로 한 단계 더 과거로 갑니다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He acts as if he were a doctor.\u003c/div>\u003cdiv class=\"g-ko\">그는 마치 의사인 것처럼 행동한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It looks as if someone had thrown all the darts in one place.\u003c/div>\u003cdiv class=\"g-ko\">마치 누군가 다트를 한곳에 다 던진 것처럼 보인다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"두 번째는 as if 가정법이에요. as if는 우리말로 하면 마치 그런 것처럼이라는 뜻인데, 실제로는 그렇지 않은 상황을 가정하는 표현이에요. 그래서 뒤에 오는 동사는 현재 일이라도 한 단계 과거로 물러나서 과거형을 쓰고, be동사는 주어가 뭐든 were를 씁니다. 만약 그 일이 이미 벌어진 일이라서 한 단계 더 과거로 가야 한다면 had p.p.를 쓰면 돼요. 정리하면 지금 사실과 다르면 were나 과거형, 그보다 앞선 일이면 had p.p.예요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He loves his cat as if it \u003cspan class=\"p-box\">\u003cspan>were\u003c/span>\u003ci>/\u003c/i>\u003cspan>had been\u003c/span>\u003c/span> his own daughter.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">were\u003c/div>\u003cdiv class=\"p-op\">had been\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 as if가 나왔네요. 실제로 그런지 아닌지를 먼저 따져 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 were입니다. 현재 사실과 반대되는 가정이라 as if 뒤에 were를 쓴 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He loves his cat as if it \u003cspan class=\"p-box\">\u003cspan class=\"ok\">were\u003c/span>\u003ci>/\u003c/i>\u003cspan>had been\u003c/span>\u003c/span> his own daughter.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">were\u003c/div>\u003cdiv class=\"p-op\">had been\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">as if 확인\u003c/b>as if 뒤는 \u003cb class=\"key\">가정법\u003c/b>으로 실제와 다른 상황을 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시점 판단\u003c/b>고양이가 지금 딸인 것처럼 대하는 \u003cb class=\"key\">현재 사실 반대\u003c/b>이므로 과거형 were를 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">오답 정리\u003c/b>had been은 그보다 앞선 일에 쓰는 과거완료라 여기서는 어울리지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 were\u003c/span>\u003cdiv class=\"p-full\">He loves his cat as if it were his own daughter.\u003c/div>\u003cdiv class=\"p-ko\">그는 자신의 고양이를 마치 친딸인 것처럼 사랑한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be동사라고 무심코 was를 떠올리는 실수 — as if 뒤는 항상 were\u003c/div>","segs":[{"n":14,"text":"as if가 보이면 가정법이라고 생각하시면 돼요. 실제로는 아닌 걸 마치 그런 것처럼 말하는 표현이니까요.","hl":"st-0"},{"n":15,"text":"지금 고양이를 딸처럼 사랑하는 상황을 말하고 있죠. 현재 사실과 반대되는 가정이니까 과거형 were를 씁니다.","hl":"st-1"},{"n":16,"text":"had been은 이미 지나간 일을 가정할 때 쓰는 형태예요. 여기서는 시간 차이가 없으니 답이 될 수 없습니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. be동사라고 무심코 was를 떠올리는 실수 — as if 뒤는 항상 were","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Many scientists argue that academic research \u003cspan class=\"p-box\">\u003cspan>is\u003c/span>\u003ci>/\u003c/i>\u003cspan>be\u003c/span>\u003c/span> free for all to read.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">is\u003c/div>\u003cdiv class=\"p-op\">be\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">be\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"세 번째 문제도 that절 안의 동사를 고르는 문제예요. argue의 성격을 먼저 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":7},{"n":20,"text":"정답은 be입니다. argue 뒤 that절에 should가 생략된 동사원형이 와서 be를 그대로 쓴 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Many scientists argue that academic research \u003cspan class=\"p-box\">\u003cspan>is\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">be\u003c/span>\u003c/span> free for all to read.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">is\u003c/div>\u003cdiv class=\"p-op\">be\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 성격 확인\u003c/b>argue가 '주장하다'로 쓰여 that절에 \u003cb class=\"key\">당위\u003c/b>의 내용이 이어집니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">규칙 적용\u003c/b>that절 동사는 \u003cb class=\"key\">(should) 동사원형\u003c/b>이므로 be동사는 그대로 be를 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">오답 정리\u003c/b>is는 주어 academic research에 맞춘 일반 현재형이라 이 구문에서는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 be\u003c/span>\u003cdiv class=\"p-full\">Many scientists argue that academic research be free for all to read.\u003c/div>\u003cdiv class=\"p-ko\">많은 과학자들은 학술 연구가 누구나 읽을 수 있도록 무료여야 한다고 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어 academic research가 단수라서 is를 고르는 실수\u003c/div>","segs":[{"n":21,"text":"argue는 주장하다라는 뜻이죠. 뒤에 주장하는 내용이 that절로 이어지는데, 이건 당위를 나타내는 표현이에요.","hl":"st-0"},{"n":22,"text":"이 구문에서는 should가 생략된 동사원형이 오기 때문에 be동사 자리에 be를 그대로 써 줍니다.","hl":"st-1"},{"n":23,"text":"is는 주어에 맞춘 평범한 현재형이지만, 이 구문은 주어에 맞추지 않으니까 답이 아니에요.","hl":"st-2"},{"n":24,"text":"이 문제의 함정도 짚고 갈게요. 주어 academic research가 단수라서 is를 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">I wish 가정법 (이루지 못한 소망)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">I wish 뒤에서 \u003cb class=\"key\">현재 사실과 반대\u003c/b>면 과거형을, \u003cb class=\"key\">과거 사실과 반대\u003c/b>면 had p.p.를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">I wish + S + 과거형(were) / I wish + S + had p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사는 항상 were를 씁니다\u003c/li>\u003cli>이미 지나간 일에 대한 후회는 had p.p.로 씁니다\u003c/li>\u003cli>wish 뒤의 that은 생략할 수 있습니다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish I were taller.\u003c/div>\u003cdiv class=\"g-ko\">키가 더 컸으면 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wish I had studied harder.\u003c/div>\u003cdiv class=\"g-ko\">더 열심히 공부했더라면 좋았을 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"세 번째는 I wish 가정법이에요. wish는 이루지 못한 소망이나 후회를 말할 때 쓰죠. 지금 사실과 반대되는 소망이면 동사를 과거형으로 쓰고, be동사는 were를 씁니다. 이미 지나간 일을 후회할 때는 had p.p.를 써서 한 단계 더 과거로 보내요. 예를 들어 더 열심히 공부했더라면 좋았을 텐데라고 할 때 had studied를 쓰는 거예요. 시제 하나 차이로 의미가 완전히 달라지니까 뒤에 나오는 시간 표현도 같이 봐 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">What were the things you wished you \u003cspan class=\"p-box\">\u003cspan>knew\u003c/span>\u003ci>/\u003c/i>\u003cspan>had known\u003c/span>\u003c/span> before starting out not이 와야 해요.","hl":"st-1"},{"n":52,"text":"did not만 had not으로 고쳐 주시면 되고, 뒤에 있는 committed는 과거분사라서 그대로 두면 됩니다.","hl":"st-2"},{"n":53,"text":"이 문제의 함정도 짚고 갈게요. did not만 보고 시제를 놓쳐 committed까지 손대는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">suggest·insist의 의미 구분 (제안 vs 암시·주장)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">suggest가 '제안하다', insist가 '요구하다'이면 that절에 \u003cb class=\"key\">(should) 동사원형\u003c/b>을, suggest가 '암시하다·보여주다', insist가 '주장하다(사실)'이면 \u003cb class=\"key\">직설법\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">suggest/insist + that + S + (should) + 동사원형 (제안·요구) / + S + 평서문 시제 (암시·사실 주장)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>해석으로 의미를 먼저 판단합니다\u003c/li>\u003cli>암시·사실 주장일 때는 시제 일치를 그대로 적용합니다\u003c/li>\u003cli>주장하는 내용이 앞선 일이면 과거완료를 씁니다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The data suggests that the dogs realized something was wrong.\u003c/div>\u003cdiv class=\"g-ko\">그 자료는 개들이 뭔가 잘못됐음을 알아차렸다는 것을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He insisted that he had seen the doctor the day before.\u003c/div>\u003cdiv class=\"g-ko\">그는 전날 의사를 만났다고 주장했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"마지막 개념은 suggest와 insist의 의미 구분이에요. 같은 동사라도 제안하다, 요구하다라는 뜻이면 that절에 should가 생략된 동사원형이 와요. 그런데 suggest가 보여 주다, 암시하다라는 뜻이거나, insist가 사실을 주장하다라는 뜻이면 가정법이 아니라 평범한 문장을 씁니다. 이때는 일반 문장이니까 시제 일치를 그대로 적용해 주시면 돼요. 그래서 해석을 먼저 확인하는 습관이 정말 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">That the dogs paused for one or two seconds suggests that they \u003cu class=\"p-u\">realize\u003c/u> something was wrong.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">realize → realized\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":55,"text":"네 번째 문제는 suggest의 뜻이 핵심이에요. 제안인지 암시인지 해석부터 해 보세요.","hl":"q"},{"n":56,"text":"","hl":"q","pause":7},{"n":57,"text":"정답은 realized입니다. 여기서 suggest는 보여 준다는 뜻이라 직설법으로 시제를 맞춰야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">That the dogs paused for one or two seconds suggests that they \u003cu class=\"p-u\">realize\u003c/u> something was wrong.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">의미 판단\u003c/b>suggests가 '제안하다'가 아니라 '\u003cb class=\"key\">보여 주다·암시하다\u003c/b>'로 쓰였습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">직설법 적용\u003c/b>이때는 가정법이 아니라 \u003cb class=\"key\">직설법\u003c/b>이므로 시제 일치를 적용합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">시제 맞추기\u003c/b>뒤에 was wrong이 있으므로 같은 과거 시점인 \u003cb class=\"key\">realized\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 realize → realized\u003c/span>\u003cdiv class=\"p-full\">That the dogs paused for one or two seconds suggests that they realized something was wrong.\u003c/div>\u003cdiv class=\"p-ko\">개들이 한두 초 멈춘 것은 그들이 뭔가 잘못됐음을 알아차렸다는 것을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>suggest만 보면 무조건 동사원형으로 고치는 실수\u003c/div>","segs":[{"n":58,"text":"suggests의 뜻을 먼저 확인해요. 개들이 잠깐 멈춘 사실이 무언가를 보여 준다는 뜻이지, 제안한다는 뜻은 아니죠.","hl":"st-0"},{"n":59,"text":"이렇게 암시하다는 뜻일 때는 동사원형이 아니라 일반 문장이 와요. 그래서 시제를 맞춰 줘야 합니다.","hl":"st-1"},{"n":60,"text":"뒤에 was wrong이라는 과거 표현이 있으니 realize도 과거형 realized로 맞춰 주시면 됩니다.","hl":"st-2"},{"n":61,"text":"이 문제의 함정도 짚고 갈게요. suggest만 보면 무조건 동사원형으로 고치는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Suppose you threw darts at random on a map of the United States. You'd find the holes left by the darts to be more or less evenly distributed across the map. But the real map of any given industry looks nothing like that; it looks more as if someone (1) \u003cu class=\"p-u\">throws\u003c/u> all the darts in the same place. It is advised that firms (2) \u003cu class=\"p-u\">are\u003c/u> clustered. Buyers may be suspicious of a software firm in the middle of the cornfields.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) had thrown (2) (should) be\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":62,"text":"이제 지문형 문제예요. 두 군데 밑줄이 있는데, 각각 어떤 구문인지 표시부터 해 보세요.","hl":"q"},{"n":63,"text":"","hl":"q","pause":7},{"n":64,"text":"정답은 첫 번째가 had thrown, 두 번째가 be입니다. 하나는 as if 가정법, 다른 하나는 제안 구문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Suppose you threw darts at random on a map of the United States. You'd find the holes left by the darts to be more or less evenly distributed across the map. But the real map of any given industry looks nothing like that; it looks more as if someone (1) \u003cu class=\"p-u\">throws\u003c/u> all the darts in the same place. It is advised that firms (2) \u003cu class=\"p-u\">are\u003c/u> clustered. Buyers may be suspicious of a software firm in the middle of the cornfields.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) as if 확인\u003c/b>as if 뒤에서 이미 다트를 던진 \u003cb class=\"key\">앞선 일\u003c/b>을 가정하므로 \u003cb class=\"key\">had thrown\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 동사 성격 확인\u003c/b>It is advised that은 \u003cb class=\"key\">제안\u003c/b> 구문이므로 that절에 \u003cb class=\"key\">(should) 동사원형\u003c/b>을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(2) 형태 정리\u003c/b>are를 \u003cb class=\"key\">(should) be\u003c/b>로 고칩니다. should는 생략해 be만 써도 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) had thrown (2) (should) be\u003c/span>\u003cdiv class=\"p-full\">It looks more as if someone had thrown all the darts in the same place. It is advised that firms (should) be clustered.\u003c/div>\u003cdiv class=\"p-ko\">마치 누군가 다트를 전부 같은 곳에 던진 것처럼 보인다. 기업들은 서로 모여 있어야 한다는 충고가 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 주어 firms가 복수라 are를 그대로 두는 실수\u003c/div>","segs":[{"n":65,"text":"첫 번째 밑줄은 as if 뒤에 있죠. 이미 다트를 다 던진 상황을 가정하는 거라서 한 단계 더 과거로 가야 합니다.","hl":"st-0"},{"n":66,"text":"두 번째 밑줄 앞에는 It is advised that이 있어요. 충고하는 구문이라서 뒤에는 동사원형이 와야 합니다.","hl":"st-1"},{"n":67,"text":"그래서 are를 be로 고쳐 주시면 되고, should를 살려서 should be라고 써도 똑같이 정답이에요.","hl":"st-2"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 주어 firms가 복수라 are를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">There can be a huge disconnect between the way someone presents themselves on the surface and how they are really feeling deep inside. I wish I had known that sooner. I wish I (1) \u003cu class=\"p-u\">pressed\u003c/u> my son to seek support when he voiced his negative feelings. I regret not doing so. That day, he insisted that he (2) \u003cu class=\"p-u\">see\u003c/u> the doctor the day before and everything was fine. He looked as if he (3) \u003cu class=\"p-u\">is\u003c/u> fine, but in fact he was in great pain.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) had pressed (2) had seen (3) were\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":69,"text":"마지막 지문 문제예요. 밑줄이 세 군데인데, wish와 insist와 as if가 각각 나옵니다.","hl":"q"},{"n":70,"text":"","hl":"q","pause":7},{"n":71,"text":"정답은 차례로 had pressed, had seen, were입니다. 후회는 과거완료, 사실 주장은 시제 일치, as if는 were로 정리됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">There can be a huge disconnect between the way someone presents themselves on the surface and how they are really feeling deep inside. I wish I had known that sooner. I wish I (1) \u003cu class=\"p-u\">pressed\u003c/u> my son to seek support when he voiced his negative feelings. I regret not doing so. That day, he insisted that he (2) \u003cu class=\"p-u\">see\u003c/u> the doctor the day before and everything was fine. He looked as if he (3) \u003cu class=\"p-u\">is\u003c/u> fine, but in fact he was in great pain.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) wish 확인\u003c/b>이미 지나간 일을 후회하므로 \u003cb class=\"key\">had pressed\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) insist 의미 확인\u003c/b>insisted가 '\u003cb class=\"key\">주장하다\u003c/b>'로 쓰여 전날 의사를 만났다는 사실을 말하므로 \u003cb class=\"key\">had seen\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) as if 확인\u003c/b>looked as if 뒤는 \u003cb class=\"key\">현재 사실 반대\u003c/b>이므로 be동사는 \u003cb class=\"key\">were\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) had pressed (2) had seen (3) were\u003c/span>\u003cdiv class=\"p-full\">I wish I had pressed my son to seek support when he voiced his negative feelings. That day, he insisted that he had seen the doctor the day before and everything was fine. He looked as if he were fine, but in fact he was in great pain.\u003c/div>\u003cdiv class=\"p-ko\">나는 아들이 부정적인 감정을 이야기했을 때 그를 다그쳐 도움을 받도록 했더라면 하고 후회한다. 그날 그는 전날 의사를 만났고 모든 게 괜찮았다고 주장했다. 그는 괜찮은 것처럼 보였지만 사실은 아주 힘들어하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 insist를 요구로 보고 see를 그대로 두는 실수\u003c/div>","segs":[{"n":72,"text":"첫 번째 밑줄은 I wish 뒤에 있어요. 아들에게 그때 이야기했더라면 하는 후회니까 과거완료를 써야 합니다.","hl":"st-0"},{"n":73,"text":"두 번째는 insisted 뒤인데, 요구가 아니라 사실을 주장하는 경우예요. 전날 만났다는 앞선 일이라서 과거완료를 씁니다.","hl":"st-1"},{"n":74,"text":"세 번째는 as if 뒤에 be동사가 왔죠. 가정법이니까 주어와 상관없이 were를 써 주시면 됩니다.","hl":"st-2"},{"n":75,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 insist를 요구로 보고 see를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">가정법(as if, I wish) · 제안·요구·당위의 that절 · suggest/insist 의미 구분\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>제안·요구·당위의 that절에서는 주어와 상관없이 \u003cb class=\"key\">(should) 동사원형\u003c/b>을 씁니다.\u003c/li>\u003cli>as if 뒤에서 현재 사실과 반대면 \u003cb class=\"key\">were\u003c/b>, 앞선 일이면 \u003cb class=\"key\">had p.p.\u003c/b>입니다.\u003c/li>\u003cli>I wish 뒤에서 과거 사실에 대한 후회는 \u003cb class=\"key\">had p.p.\u003c/b>로 씁니다.\u003c/li>\u003cli>suggest·insist는 해석으로 의미를 판단해 \u003cb class=\"key\">가정법\u003c/b>인지 \u003cb class=\"key\">직설법\u003c/b>인지 결정합니다.\u003c/li>\u003c/ul>","segs":[{"n":76,"text":"오늘 열 문제 정말 잘 따라와 주셨어요. 핵심은 결국 두 가지예요. 제안하고 요구하는 표현 뒤에는 동사원형, 가정법에서는 한 단계 과거로 물러난다는 것, 그리고 suggest나 insist는 해석이 먼저라는 것까지 기억해 주세요. 다음 시간에도 좋은 문제로 만나요, 수고했어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
