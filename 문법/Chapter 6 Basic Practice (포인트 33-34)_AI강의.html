window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 6 Basic Practice (포인트 33-34)","audioDir":"Chapter_6_Basic_Practice_(포인트_33-34)_audio","preview":false,"count":77,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">복합관계사, 관계대명사, 의문사절\u003c/div>\u003ch1>복합관계사·관계대명사·의문사절 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 복합관계사와 관계대명사, 의문사절을 구분하는 기본 문제를 풀어 볼 거예요. 선택지에서 무엇이 빠졌는지, 앞에 선행사가 있는지, 절 안에서 주어나 목적어가 빠졌는지를 차근차근 확인해 봅시다. 헷갈리기 쉬운 who와 whoever, what과 which, however와 how를 확실히 정리해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">복합관계대명사 whoever, whatever, whichever\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whoever/whatever/whichever\u003c/b>는 선행사를 포함해 '~하는 사람/것/어느 쪽이든'을 뜻하고, 뒤에는 \u003cb class=\"key\">불완전한 절\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">whoever + 동사 / whatever + 주어·목적어가 빠진 절 / whichever + 명사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>whoever = anyone who\u003c/li>\u003cli>whatever = anything that\u003c/li>\u003cli>whichever = no matter which\u003c/li>\u003cli>양보의 뜻으로도 쓰임\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Whoever is willing to help can join us.\u003c/div>\u003cdiv class=\"g-ko\">도와줄 의향이 있는 사람은 누구든 참여할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You can choose whichever side you like.\u003c/div>\u003cdiv class=\"g-ko\">어느 쪽이든 원하는 쪽을 선택해도 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 복합관계대명사부터 볼게요. whoever는 anyone who, whatever는 anything that처럼 선행사를 스스로 품고 있는 말이에요. 그래서 뒤에는 주어나 목적어가 하나 빠진 불완전한 절이 이어집니다. whichever는 뒤에 명사를 데리고 와서 어느 쪽이든이라는 뜻을 만들 수 있어요. 이 표현들은 양보의 뜻으로도 자주 쓰인다는 점을 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I will vote for \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan>whoever\u003c/span>\u003c/span> is willing to do what they're saying.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whoever\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whoever\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 전치사 for 뒤에 어떤 의문사가 와야 자연스러운지 묻고 있어요. 뒤에 is willing이 이어지는 구조를 먼저 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 whoever입니다. is의 주어가 필요하고, 누구든지라는 뜻을 담아야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I will vote for \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">whoever\u003c/span>\u003c/span> is willing to do what they're saying.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whoever\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">절 구조 보기\u003c/b>전치사 for 뒤에는 \u003cb class=\"key\">whoever is willing...\u003c/b> 전체가 목적어로 오는 명사절이고, is의 주어가 필요해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>\u003cb class=\"key\">whoever\u003c/b>는 anyone who의 뜻으로 '~할 의향이 있는 사람은 누구든'을 나타내요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">오답 정리\u003c/b>who는 '누구'라는 의문사라서 '~하는 사람은 누구든'이라는 \u003cb class=\"key\">선행사 포함\u003c/b> 의미가 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 whoever\u003c/span>\u003cdiv class=\"p-full\">I will vote for whoever is willing to do what they're saying.\u003c/div>\u003cdiv class=\"p-ko\">나는 자신이 말하는 대로 실천할 의향이 있는 사람에게 투표할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>전치사 뒤라고 무조건 whom으로 바꾸면 안 돼요. 절 안에서 주어 역할이면 \u003cb class=\"key\">whoever\u003c/b>예요.\u003c/div>","segs":[{"n":6,"text":"먼저 for 뒤를 보면 is willing 이하가 이어지죠. 이때 is의 주어가 필요한데, who는 선행사 없이 이 자리를 채우기 어렵습니다.","hl":"st-0"},{"n":7,"text":"여기서 필요한 뜻은 누구든지 할 의향이 있는 사람입니다. 그래서 anyone who의 의미를 담은 whoever가 자연스럽습니다.","hl":"st-1"},{"n":8,"text":"who를 쓰면 단순히 누구인지 묻는 느낌이 되어 문장 전체가 어색해집니다. 그래서 whoever가 정답입니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 전치사 뒤라고 무조건 whom으로 바꾸면 안 돼요. 절 안에서 주어 역할이면 whoever예요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 what\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">what\u003c/b>은 선행사를 포함해 '~하는 것'을 뜻하며, 앞에 \u003cb class=\"key\">선행사가 없어야\u003c/b> 한다.\u003cdiv>\u003cspan class=\"g-formula\">what + 주어나 목적어가 빠진 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>what = the thing(s) that\u003c/li>\u003cli>that은 접속사로 뒤 절이 완전해야 함\u003c/li>\u003cli>주어·목적어·보어 역할\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">What he said was true.\u003c/div>\u003cdiv class=\"g-ko\">그가 말한 것은 사실이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is what I wanted.\u003c/div>\u003cdiv class=\"g-ko\">이것이 내가 원했던 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"관계대명사 what은 앞에 선행사가 없을 때 쓰는 말이에요. what 하나가 the thing that이라는 뜻을 품고 있어서 무엇인가를 가리키는 역할을 해요. 뒤에는 주어나 목적어, 보어가 하나 빠진 절이 이어집니다. 반면 that은 접속사로 쓰일 때 뒤 절이 완전해야 하므로 what과 헷갈리면 절 안에 빈자리가 있는지부터 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">My new job wasn't \u003cspan class=\"p-box\">\u003cspan>what\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> I thought it would be.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">what\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">what\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 wasn't 뒤에 오는 보어를 고르는 문제예요. 내가 생각했던 것이라는 의미가 나오는지 확인해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 what입니다. the thing that의 의미로 be의 보어 자리를 채워 주니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">My new job wasn't \u003cspan class=\"p-box\">\u003cspan class=\"ok\">what\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> I thought it would be.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">what\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">보어 자리\u003c/b>wasn't 뒤에 \u003cb class=\"key\">명사절\u003c/b>이 와서 '내가 생각했던 것'이라는 보어 역할을 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">what의 의미\u003c/b>\u003cb class=\"key\">what\u003c/b>은 the thing that의 뜻으로 선행사를 포함해 '~한 것'을 나타내요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">that 탈락\u003c/b>that은 접속사로 쓰이면 뒤 절이 완전해야 하는데, thought의 목적어 자리가 비어 있어 \u003cb class=\"key\">what\u003c/b>이 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 what\u003c/span>\u003cdiv class=\"p-full\">My new job wasn't what I thought it would be.\u003c/div>\u003cdiv class=\"p-ko\">내 새 직장은 내가 생각했던 것과 같지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>that은 뒤 절이 완전할 때 접속사로 쓰지만, be의 보어가 빠진 here에서는 \u003cb class=\"key\">what\u003c/b>이에요.\u003c/div>","segs":[{"n":14,"text":"wasn't 뒤에는 내가 생각했던 것이라는 명사절이 와서 보어 역할을 해요. 이 명사절 안에서 be의 보어가 비어 있는지 보세요.","hl":"st-0"},{"n":15,"text":"what은 the thing that의 뜻으로 선행사를 포함해 생각했던 것을 나타냅니다. 그래서 what I thought it would be가 자연스러워요.","hl":"st-1"},{"n":16,"text":"that을 접속사로 쓰면 뒤 절이 완전해야 하는데, 여기서는 be의 보어가 빠져 있어요. 그래서 that은 답이 될 수 없습니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. that은 뒤 절이 완전할 때 접속사로 쓰지만, be의 보어가 빠진 here에서는 what이에요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">복합관계부사 whenever, wherever, however\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whenever/wherever/however\u003c/b>는 '~할 때마다/어디서든/아무리 ~해도'를 뜻하고, however 뒤에는 \u003cb class=\"key\">형용사나 부사\u003c/b>가 온다.\u003cdiv>\u003cspan class=\"g-formula\">whenever + 완전한 절 / wherever + 완전한 절 / however + 형용사·부사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>whenever = at any time when\u003c/li>\u003cli>wherever = in any place where\u003c/li>\u003cli>however + 형용사/부사\u003c/li>\u003cli>양보의 의미를 자주 만든다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Whenever she gives a presentation, she gets nervous.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 발표할 때마다 긴장한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">However hard it is, don't give up.\u003c/div>\u003cdiv class=\"g-ko\">아무리 힘들어도 포기하지 마라.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"이번에는 복합관계부사입니다. whenever는 언제든지 또는 할 때마다, wherever는 어디로 가든, however는 아무리 해도라는 뜻을 만들어요. whenever와 wherever 뒤에는 주어와 동사가 다 있는 완전한 절이 오는 경우가 많습니다. however는 뒤에 형용사나 부사가 먼저 와야 자연스러워요. however hard처럼 형용사와 함께 쓰이는 모양을 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">She gets nervous \u003cspan class=\"p-box\">\u003cspan>whenever\u003c/span>\u003ci>/\u003c/i>\u003cspan>whatever\u003c/span>\u003c/span> she gives a presentation in front of the class.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">whenever\u003c/div>\u003cdiv class=\"p-op\">whatever\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whenever\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 뒤에 완전한 절이 오는지 보는 문제예요. whenever와 whatever 중 어느 것이 시간의 흐름을 만들어 주는지 생각해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 whenever입니다. 그녀가 발표할 때마다 긴장한다는 뜻이 되니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">She gets nervous \u003cspan class=\"p-box\">\u003cspan class=\"ok\">whenever\u003c/span>\u003ci>/\u003c/i>\u003cspan>whatever\u003c/span>\u003c/span> she gives a presentation in front of the class.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">whenever\u003c/div>\u003cdiv class=\"p-op\">whatever\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에 she gives a presentation라는 \u003cb class=\"key\">완전한 절\u003c/b>이 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">whenever 의미\u003c/b>\u003cb class=\"key\">whenever\u003c/b>는 '~할 때마다'로 시간·조건을 나타내요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">whatever 탈락\u003c/b>whatever는 '무엇이든'이라는 명사절을 만들기 때문에 뒤에 명사나 불완전한 절이 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 whenever\u003c/span>\u003cdiv class=\"p-full\">She gets nervous whenever she gives a presentation in front of the class.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 교실 앞에서 발표할 때마다 긴장한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>whatever를 '아무리 ~해도'로 착각하지 말고, 뒤에 \u003cb class=\"key\">명사\u003c/b>가 있는지 보세요.\u003c/div>","segs":[{"n":22,"text":"뒤에 she gives a presentation라는 주어와 동사가 다 있는 절이 와요. 그래서 시간이나 조건을 나타내는 접속사가 필요합니다.","hl":"st-0"},{"n":23,"text":"whenever는 할 때마다라는 뜻으로 앞 문장과 자연스럽게 이어져요. 그녀는 발표할 때마다 긴장한다는 의미가 됩니다.","hl":"st-1"},{"n":24,"text":"whatever는 무엇이든이라는 명사절을 만들기 때문에 뒤에 명사나 불완전한 절이 필요해요. 여기서는 어울리지 않습니다.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. whatever를 '아무리 ~해도'로 착각하지 말고, 뒤에 명사가 있는지 보세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 which/that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 \u003cb class=\"key\">선행사\u003c/b>가 있으면 관계대명사 \u003cb class=\"key\">which/that\u003c/b>을 쓰고, 선행사를 포함하는 what은 쓸 수 없다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + which/that + 주어나 목적어가 빠진 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>which는 사물 선행사\u003c/li>\u003cli>that도 사물에 가능\u003c/li>\u003cli>what은 선행사 있으면 불가\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the program which works best.\u003c/div>\u003cdiv class=\"g-ko\">이것이 가장 잘 작동하는 프로그램이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Here are the strategies which can help you.\u003c/div>\u003cdiv class=\"g-ko\">여기 너를 도와줄 수 있는 전략들이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"이번에는 앞에 선행사가 있는 경우를 봅시다. program이나 strategies처럼 꾸며 줄 명사가 이미 있으면 관계대명사 which나 that을 써요. which는 그 선행사를 받으면서 뒤 절에서 주어나 목적어 역할을 합니다. what은 선행사를 스스로 포함하니까 앞에 명사가 있으면 절대 같이 쓰면 안 돼요. 선행사가 있는지 없는지가 가장 중요한 판단 기준입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The doctors are working to develop a program \u003cspan class=\"p-box\">\u003cspan>what\u003c/span>\u003ci>/\u003c/i>\u003cspan>which\u003c/span>\u003c/span> works best for the patients.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">what\u003c/div>\u003cdiv class=\"p-op\">which\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">which\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 program이라는 선행사가 있는지 확인하는 문제예요. 뒤 절에서 주어가 빠졌는지도 함께 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 which입니다. 선행사 program을 받으면서 works의 주어 역할을 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cs \u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>여기서 what을 쓰면 앞에 strategies가 이미 있어서 \u003cb class=\"key\">선행사 중복\u003c/b>이 돼요.\u003c/div>","segs":[{"n":58,"text":"the strategies가 which의 선행사입니다. which는 전략들을 받아 주는 관계대명사예요.","hl":"st-0"},{"n":59,"text":"which는 can help의 주어로 쓰여 전략들이 너를 도울 수 있다는 뜻을 만듭니다.","hl":"st-1"},{"n":60,"text":"선행사가 있고 절 안에서 주어가 빠졌으므로 which가 알맞습니다. 그래서 원문은 맞습니다.","hl":"st-2"},{"n":61,"text":"이 문제의 함정도 짚고 갈게요. 여기서 what을 쓰면 앞에 strategies가 이미 있어서 선행사 중복이 돼요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">의문사절(간접의문문)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">ask, know, decide 같은 동사 뒤에서 '무엇/어떻게/어디'를 나타낼 때는 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 순서의 \u003cb class=\"key\">의문사절\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">의문사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>how things are = 상황이 어떤지\u003c/li>\u003cli>what is right = 옳은 것\u003c/li>\u003cli>의문사절은 목적어·주어 역할\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I know what is right.\u003c/div>\u003cdiv class=\"g-ko\">나는 무엇이 옳은지 안다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She asked how things were at home.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 집에서 상황이 어떤지 물었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":62,"text":"마지막으로 의문사절을 정리해 볼게요. ask나 know, decide 뒤에서 무엇인지, 어떻게인지, 어디인지를 말할 때는 의문사가 먼저 오고 그다음 주어와 동사가 와요. 예를 들어 how things are는 상황이 어떤지라는 뜻이고, what is right는 옳은 것이 무엇인지라는 뜻입니다. 이때 의문사절은 문장 전체에서 목적어나 주어 역할을 할 수 있어요. however처럼 보이는 말과 how를 구분하는 연습도 함께 해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Motivation may come from several sources. It may simply be asking (1) \u003cu class=\"p-u\">however\u003c/u> things are at home. For one student considering dropping out of school, it was a note (2) \u003cu class=\"p-u\">what\u003c/u> I wrote saying that he made my day when I saw him in school. He came to me with the note with tears in his eyes and thanked me. He will graduate this year. (3) \u003cu class=\"p-u\">What\u003c/u> technique is used, the students must know that you care about them.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) how (2) which 또는 that (3) Whatever\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"이번 지문은 동기 부여에 관한 글이에요. 세 군데 밑줄에서 의문사절, 관계대명사, 양보의 복합관계사를 차례로 구분해야 합니다.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"첫 번째는 how, 두 번째는 which 또는 that, 세 번째는 Whatever입니다. 앞에 선행사가 있는지와 양보의 뜻인지를 보면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Motivation may come from several sources. It may simply be asking (1) \u003cu class=\"p-u\">however\u003c/u> things are at home. For one student considering dropping out of school, it was a note (2) \u003cu class=\"p-u\">what\u003c/u> I wrote saying that he made my day when I saw him in school. He came to me with the note with tears in his eyes and thanked me. He will graduate this year. (3) \u003cu class=\"p-u\">What\u003c/u> technique is used, the students must know that you care about them.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>asking 뒤에는 \u003cb class=\"key\">how things are\u003c/b>처럼 '상황이 어떤지'를 나타내는 의문사절이 와야 해요. however는 '그러나'나 '아무리 ~해도'라서 여기서는 부적절해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>a note라는 \u003cb class=\"key\">선행사\u003c/b>가 있으므로 관계대명사 \u003cb class=\"key\">which\u003c/b> 또는 \u003cb class=\"key\">that\u003c/b>을 써요. what은 선행사를 포함해 쓸 수 없어요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>\u003cb class=\"key\">Whatever\u003c/b> technique is used는 '어떤 기술이 사용되든'이라는 양보 부사절이에요. What technique is used는 단순 의문사절이 되어 문맥이 맞지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) how (2) which 또는 that (3) Whatever\u003c/span>\u003cdiv class=\"p-full\">Motivation may come from several sources. It may simply be asking how things are at home. For one student considering dropping out of school, it was a note which I wrote saying that he made my day when I saw him in school. He came to me with the note with tears in his eyes and thanked me. He will graduate this year. Whatever technique is used, the students must know that you care about them.\u003c/div>\u003cdiv class=\"p-ko\">동기 부여는 여러 근원에서 나올 수 있으며, 어떤 기술이 사용되든 학생들은 선생님이 자신을 아낀다는 것을 알아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>however 뒤에는 형용사·부사, whatever 뒤에는 \u003cb class=\"key\">명사\u003c/b>가 올 수 있어요.\u003c/div>","segs":[{"n":66,"text":"첫 번째 밑줄은 asking 뒤에 이어집니다. 여기서는 집에서 상황이 어떤지 묻는 뜻이므로 how things are가 되어야 하고, however는 접속부사나 양보의 뜻이라 어울리지 않습니다.","hl":"st-0"},{"n":67,"text":"두 번째 밑줄 앞에는 a note라는 선행사가 있습니다. 그래서 관계대명사 which나 that을 써야 하고, what은 선행사를 포함하므로 쓸 수 없습니다.","hl":"st-1"},{"n":68,"text":"세 번째 밑줄은 어떤 기술이 사용되든이라는 양보의 뜻이 필요해요. whatever technique is used가 자연스럽고, what technique is used는 단순한 의문사절이 되어 문맥이 맞지 않습니다.","hl":"st-2"},{"n":69,"text":"이 문제의 함정도 짚고 갈게요. however 뒤에는 형용사·부사, whatever 뒤에는 명사가 올 수 있어요.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">When you don't know which side to choose, keep aware of your feelings. Just do what you wish to. I know you will decide (1) \u003cu class=\"p-u\">that\u003c/u> is right. I will be by your side, (2) \u003cu class=\"p-u\">which\u003c/u> side you choose. You don't need to be too tight with yourself, putting yourself under too much stress. When you are comfortable, you know where you are. (3) \u003cu class=\"p-u\">How\u003c/u> hard the situation is, just trust yourself more.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) what 또는 whatever (2) whichever (3) However\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":70,"text":"이번 지문은 선택과 자신감에 관한 글이에요. 세 군데 밑줄에서 의문사절과 양보의 복합관계사를 구분해 보세요.","hl":"q"},{"n":71,"text":"","hl":"q","pause":7},{"n":72,"text":"첫 번째는 what 또는 whatever, 두 번째는 whichever, 세 번째는 However입니다. 양보의 뜻인지와 뒤에 오는 품사를 확인하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">When you don't know which side to choose, keep aware of your feelings. Just do what you wish to. I know you will decide (1) \u003cu class=\"p-u\">that\u003c/u> is right. I will be by your side, (2) \u003cu class=\"p-u\">which\u003c/u> side you choose. You don't need to be too tight with yourself, putting yourself under too much stress. When you are comfortable, you know where you are. (3) \u003cu class=\"p-u\">How\u003c/u> hard the situation is, just trust yourself more.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>decide 뒤에 \u003cb class=\"key\">is right\u003c/b>가 이어지므로 주어가 빠진 명사절이 필요해요. that은 접속사로 주어를 채우지 못하므로 \u003cb class=\"key\">what\u003c/b> 또는 \u003cb class=\"key\">whatever\u003c/b>로 고쳐요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>'어느 쪽을 선택하든'이라는 양보의 뜻이므로 \u003cb class=\"key\">whichever\u003c/b> side you choose가 맞아요. which는 단순 의문사나 관계대명사라서 양보 의미가 부족해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>hard라는 \u003cb class=\"key\">형용사\u003c/b> 앞에서 '아무리 ~해도'를 나타내려면 \u003cb class=\"key\">However\u003c/b>를 써요. How hard는 '얼마나 힘든지'라는 의문사절이 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) what 또는 whatever (2) whichever (3) However\u003c/span>\u003cdiv class=\"p-full\">When you don't know which side to choose, keep aware of your feelings. Just do what you wish to. I know you will decide what is right. I will be by your side, whichever side you choose. You don't need to be too tight with yourself, putting yourself under too much stress. When you are comfortable, you know where you are. However hard the situation is, just trust yourself more.\u003c/div>\u003cdiv class=\"p-ko\">어느 쪽을 선택해야 할지 모를 때는 감정을 잘 살피고, 상황이 아무리 힘들어도 자신을 더 믿으라는 글이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>however는 뒤에 \u003cb class=\"key\">형용사·부사\u003c/b>가 오고, whichever는 뒤에 \u003cb class=\"key\">명사\u003c/b>가 와요.\u003c/div>","segs":[{"n":73,"text":"첫 번째 밑줄은 decide 뒤에 이어집니다. is right 앞에 주어가 없으므로 what이나 whatever로 옳은 것을 결정한다는 명사절을 만들어야 합니다.","hl":"st-0"},{"n":74,"text":"두 번째 밑줄은 어느 쪽을 선택하든이라는 양보의 뜻이 필요해요. whichever side you choose가 자연스럽고, which side you choose는 단순한 의문사절이 됩니다.","hl":"st-1"},{"n":75,"text":"세 번째 밑줄은 hard 앞에서 아무리 힘들어도라는 뜻을 만들어야 해요. however hard처럼 however 뒤에 형용사가 오고, how hard는 얼마나 힘든지라는 의문사절이 됩니다.","hl":"st-2"},{"n":76,"text":"이 문제의 함정도 짚고 갈게요. however는 뒤에 형용사·부사가 오고, whichever는 뒤에 명사가 와요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">복합관계사, 관계대명사, 의문사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>선행사가 없고 '~하는 것'이면 \u003cb class=\"key\">what\u003c/b>, 선행사가 있으면 \u003cb class=\"key\">which/that\u003c/b>을 쓴다.\u003c/li>\u003cli>누구든지·무엇이든·어느 쪽이든은 \u003cb class=\"key\">whoever/whatever/whichever\u003c/b>로 선행사를 포함한다.\u003c/li>\u003cli>할 때마다·어디로 가든·아무리 해도는 \u003cb class=\"key\">whenever/wherever/however\u003c/b>로 표현하고, however 뒤에는 형용사·부사가 온다.\u003c/li>\u003cli>의문사절은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 순서이고, that은 주어나 목적어를 채우지 못한다.\u003c/li>\u003c/ul>","segs":[{"n":77,"text":"오늘은 복합관계사와 관계대명사, 의문사절을 구분하는 문제를 풀었어요. 먼저 선행사가 있는지 확인하고, 절 안에 주어나 목적어가 빠졌는지 살펴보면 답이 보입니다. however 뒤에는 형용사나 부사, whatever 뒤에는 명사가 올 수 있다는 점도 꼭 기억해 주세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
