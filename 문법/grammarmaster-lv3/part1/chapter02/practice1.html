}
lecturePlayer(document.getElementById("app"),{"brand":"Practice2","title":"조동사 can, may, must, should 완전 정복","audioDir":"practice1_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">그래마마스터 레벨3 Chapter02 - can, may, must, should\u003c/div>\u003ch1>조동사 can, may, must, should 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>can, may, must, should의 다양한 쓰임을 예문으로 익히고, must not과 don't have to를 구별할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 조동사 can, may, must, should를 함께 공부해 볼 거예요. 이 네 친구들은 동사 앞에서 말하는 사람의 마음을 바꿔 주는 아주 중요한 조동사들이에요. 오늘은 예문을 하나씩 읽으면서 언제 어떤 조동사를 쓰는지 확실하게 잡아 갑시다. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">can - 능력, 허가·요청, 가능성·추측\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">can은 '~할 수 있다'는 \u003cb class=\"key\">능력\u003c/b>을 나타내요. 또한 '~해도 된다'는 \u003cb class=\"key\">허가\u003c/b>와 '~해도 될까요?'라는 \u003cb class=\"key\">요청\u003c/b>, '~일 수도 있다 / ~일 리가 없다'는 \u003cb class=\"key\">가능성·추측\u003c/b>으로도 쓰여요. can은 \u003cb class=\"key\">조동사\u003c/b>이므로 뒤에는 항상 \u003cb class=\"key\">동사원형\u003c/b>이 와요.\u003cdiv>\u003cspan class=\"g-formula\">can + 동사원형 / can't + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The applicant \u003cspan class=\"fx\">can(= is able to) speak\u003c/span> English like a native speaker.\u003c/div>\u003cdiv class=\"g-ko\">그 지원자는 원어민처럼 영어를 말할 수 있다.\u003c/div>\u003cdiv class=\"g-note\">can은 '~할 수 있다'는 능력을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">can use\u003c/span> my computer if you need it.\u003c/div>\u003cdiv class=\"g-ko\">필요하면 내 컴퓨터를 써도 돼.\u003c/div>\u003cdiv class=\"g-note\">허가를 나타내는 can은 '~해도 된다'로 해석해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Can I open\u003c/span> the window for a moment?\u003c/div>\u003cdiv class=\"g-ko\">잠깐 창문 좀 열어도 될까요?\u003c/div>\u003cdiv class=\"g-note\">요청할 때는 Can I ~? 형태로 물어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">Clara \u003cspan class=\"fx\">can't be\u003c/span> a liar. She always tells the truth.\u003c/div>\u003cdiv class=\"g-ko\">클라라가 거짓말쟁이일 리가 없다. 그녀는 항상 진실을 말한다.\u003c/div>\u003cdiv class=\"g-note\">can't는 '~일 리가 없다'는 강한 부정 추측이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>can 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오고, can't는 '~일 리가 없다'는 \u003cb class=\"key\">추측\u003c/b>으로도 쓰인다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 can이에요. can은 크게 세 가지 뜻으로 쓰여요. 첫째는 할 수 있다는 능력이고, 둘째는 해도 된다는 허가나 요청, 셋째는 일 수도 있다, 일 리가 없다는 가능성과 추측이에요. can은 조동사라서 뒤에는 반드시 동사원형이 온다는 점, 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. The applicant can speak English like a native speaker. 그 지원자는 원어민처럼 영어를 말할 수 있다는 뜻이에요. 여기서 can은 할 수 있다는 능력을 나타내요.","hl":"ex-0"},{"n":4,"text":"You can use my computer if you need it. 필요하면 내 컴퓨터를 써도 된다는 뜻이에요. 이렇게 can은 해도 된다는 허가를 나타내기도 해요.","hl":"ex-1"},{"n":5,"text":"Can I open the window for a moment? 잠깐 창문 좀 열어도 될까요? 라는 뜻이에요. 내가 해도 될까요 하고 물을 때 Can I를 쓴다고 기억해 두세요.","hl":"ex-2"},{"n":6,"text":"Clara can't be a liar. She always tells the truth. 클라라가 거짓말쟁이일 리가 없다는 뜻이에요. 그녀는 항상 진실을 말하니까요. 이렇게 can't는 일 리가 없다는 강한 부정 추측으로 쓰여요.","hl":"ex-3"},{"n":7,"text":"can 뒤에 동사를 쓸 때 s를 붙이거나 to를 붙이면 안 돼요. 그리고 can't be는 일 리가 없다는 뜻으로 확신을 담은 강한 추측이라는 것도 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">may - 허가·요청, 가능성·추측, 기원\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">may는 '~해도 된다'는 \u003cb class=\"key\">허가\u003c/b>와 '~해도 될까요?'라는 \u003cb class=\"key\">요청\u003c/b>을 나타내며, can보다 \u003cb class=\"key\">격식\u003c/b> 있는 표현이에요. '~일지도 모른다'는 \u003cb class=\"key\">가능성·추측\u003c/b>으로도 쓰여요. 또한 May + 주어 + 동사원형 형태로 '~이기를 빈다'는 \u003cb class=\"key\">기원\u003c/b>을 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">may + 동사원형 / May + 주어 + 동사원형!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">may sit\u003c/span> here if the seat is empty.\u003c/div>\u003cdiv class=\"g-ko\">그 자리가 비어 있으면 여기에 앉아도 된다.\u003c/div>\u003cdiv class=\"g-note\">may는 can보다 격식 있는 허가 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">May I take\u003c/span> this cart first?\u003c/div>\u003cdiv class=\"g-ko\">제가 이 카트를 먼저 가져가도 될까요?\u003c/div>\u003cdiv class=\"g-note\">May I ~?는 정중하게 허가를 구하는 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">may be interested\u003c/span> in the essay contest.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그 에세이 대회에 관심이 있을지도 모른다.\u003c/div>\u003cdiv class=\"g-note\">may는 '~일지도 모른다'는 가능성·추측을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">May he rest\u003c/span> in peace!\u003c/div>\u003cdiv class=\"g-ko\">그가 편히 잠들기를!\u003c/div>\u003cdiv class=\"g-note\">May + 주어 + 동사원형은 '~이기를 빈다'는 기원 표현이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>may는 \u003cb class=\"key\">격식\u003c/b> 있는 표현이라 일상 회화에서는 can을 더 자주 쓰고, May + 주어 + 동사원형은 \u003cb class=\"key\">기원\u003c/b> 표현이에요.\u003c/div>","segs":[{"n":8,"text":"다음은 may예요. may는 허가와 요청에서 can보다 더 격식 있고 정중한 느낌을 줘요. 또 일지도 모른다는 가능성과 추측을 나타내고, 문장 맨 앞에 나와서 이기를 빈다는 기원을 표현하기도 해요.","hl":"rule"},{"n":9,"text":"You may sit here if the seat is empty. 그 자리가 비어 있으면 여기에 앉아도 된다는 뜻이에요. may가 can보다 더 격식 있는 허가 표현이에요.","hl":"ex-0"},{"n":10,"text":"May I take this cart first? 제가 이 카트를 먼저 가져가도 될까요? 라는 뜻이에요. May I 하고 시작하면 아주 정중하게 허가를 구하는 표현이 돼요.","hl":"ex-1"},{"n":11,"text":"They may be interested in the essay contest. 그들은 그 에세이 대회에 관심이 있을지도 모른다는 뜻이에요. 여기서 may는 일지도 모른다는 추측을 나타내요.","hl":"ex-2"},{"n":12,"text":"May he rest in peace! 그가 편히 잠들기를 바란다는 뜻이에요. May 다음에 주어와 동사원형이 오면 이기를 빈다는 기원 표현이 돼요.","hl":"ex-3"},{"n":13,"text":"may는 격식 있는 표현이라 일상 대화에서는 can을 더 자주 써요. 그리고 May 다음에 주어와 동사원형이 오면 기원 표현이 된다는 것도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">must - 의무, 강한 추측 / must not과 don't have to\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">must는 '~해야 한다'는 \u003cb class=\"key\">의무\u003c/b>를 나타내고, '~임에 틀림없다'는 \u003cb class=\"key\">강한 추측\u003c/b>에도 쓰여요. must not은 '~하면 안 된다'는 \u003cb class=\"key\">금지\u003c/b>이고, don't have to는 '~할 필요가 없다'는 \u003cb class=\"key\">불필요\u003c/b>예요. 두 표현은 뜻이 정반대이므로 꼭 구별해야 해요.\u003cdiv>\u003cspan class=\"g-formula\">must + 동사원형 / must not + 동사원형 / don't have to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">All applicants \u003cspan class=\"fx\">must(= have to) take\u003c/span> an entrance test.\u003c/div>\u003cdiv class=\"g-ko\">모든 지원자는 입학 시험을 치러야 한다.\u003c/div>\u003cdiv class=\"g-note\">must는 '~해야 한다'는 의무를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He is sneezing and coughing. He \u003cspan class=\"fx\">must have\u003c/span> a cold.\u003c/div>\u003cdiv class=\"g-ko\">그는 재채기를 하고 기침을 한다. 감기에 걸린 게 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">must는 '~임에 틀림없다'는 강한 추측을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">must not take\u003c/span> this medicine before meals.\u003c/div>\u003cdiv class=\"g-ko\">너는 식사 전에 이 약을 먹으면 안 된다.\u003c/div>\u003cdiv class=\"g-note\">must not은 '~하면 안 된다'는 금지예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">don't have to take\u003c/span> this medicine twice a day.\u003c/div>\u003cdiv class=\"g-ko\">너는 이 약을 하루에 두 번 먹을 필요가 없다.\u003c/div>\u003cdiv class=\"g-note\">don't have to는 '~할 필요가 없다'는 불필요를 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>must not은 \u003cb class=\"key\">금지\u003c/b>, don't have to는 \u003cb class=\"key\">불필요\u003c/b>로 뜻이 완전히 달라요.\u003c/div>","segs":[{"n":14,"text":"이제 must예요. must는 해야 한다는 의무를 나타내고, 틀림없다는 강한 추측에도 써요. 그리고 must not은 하면 안 된다는 금지, don't have to는 할 필요가 없다는 불필요라는 점을 꼭 구분해야 해요.","hl":"rule"},{"n":15,"text":"All applicants must take an entrance test. 모든 지원자는 입학 시험을 치러야 한다는 뜻이에요. must는 해야 한다는 의무를 나타내고, have to와 바꿔 쓸 수 있어요.","hl":"ex-0"},{"n":16,"text":"He is sneezing and coughing. He must have a cold. 그는 재채기를 하고 기침을 하니까 감기에 걸린 게 틀림없다는 뜻이에요. 이렇게 must는 틀림없다는 강한 추측에도 쓰여요.","hl":"ex-1"},{"n":17,"text":"You must not take this medicine before meals. 식사 전에 이 약을 먹으면 안 된다는 뜻이에요. must not은 하면 안 된다는 금지예요.","hl":"ex-2"},{"n":18,"text":"You don't have to take this medicine twice a day. 이 약을 하루에 두 번 먹을 필요가 없다는 뜻이에요. don't have to는 할 필요가 없다는 불필요를 나타내요.","hl":"ex-3"},{"n":19,"text":"must not은 하면 안 된다는 금지, don't have to는 할 필요가 없다는 불필요예요. 뜻이 정반대니까 문제에서 꼭 구별해서 읽어야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">should - 의무, 충고, that절에서의 should\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">should는 must보다 부드럽게 '~해야 한다'는 \u003cb class=\"key\">의무\u003c/b>를 나타내요. '~하는 것이 좋다'는 \u003cb class=\"key\">충고\u003c/b>로도 자주 쓰여요. insist, order, demand, suggest처럼 \u003cb class=\"key\">주장·명령·요구·제안\u003c/b>을 나타내는 동사 뒤 that절에는 \u003cb class=\"key\">(should) 동사원형\u003c/b>을 써요.\u003cdiv>\u003cspan class=\"g-formula\">should + 동사원형 / insist·suggest + that + 주어 + (should) + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">should(= ought to) take care of\u003c/span> your little sisters when your parents go out.\u003c/div>\u003cdiv class=\"g-ko\">부모님이 외출하시면 너는 여동생들을 돌봐야 한다.\u003c/div>\u003cdiv class=\"g-note\">should는 '~해야 한다'는 의무를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You \u003cspan class=\"fx\">should eat\u003c/span> more vegetables to stay healthy.\u003c/div>\u003cdiv class=\"g-ko\">건강을 유지하려면 채소를 더 먹는 것이 좋다.\u003c/div>\u003cdiv class=\"g-note\">충고할 때 should로 '~하는 것이 좋다'라고 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">insisted that the project (should) be done\u003c/span> by the end of the month.\u003c/div>\u003cdiv class=\"g-ko\">그는 그 프로젝트가 월말까지 끝나야 한다고 주장했다.\u003c/div>\u003cdiv class=\"g-note\">insist 뒤 that절에는 (should) + 동사원형을 써요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>should는 must보다 \u003cb class=\"key\">부드러운\u003c/b> \u003cb class=\"key\">충고\u003c/b> 표현이고, insist 같은 동사 뒤 that절에는 \u003cb class=\"key\">(should) 동사원형\u003c/b>을 써요.\u003c/div>","segs":[{"n":20,"text":"마지막은 should예요. should는 must보다 부드럽게 해야 한다는 의무를 말할 때 쓰고, 하는 것이 좋다는 충고에도 써요. 그리고 insist나 suggest처럼 주장, 명령, 요구, 제안을 나타내는 동사 뒤에 that절이 오면 그 안에는 should와 동사원형을 써요.","hl":"rule"},{"n":21,"text":"You should take care of your little sisters when your parents go out. 부모님이 외출하시면 여동생들을 돌봐야 한다는 뜻이에요. should는 must보다 부드러운 의무 표현이에요.","hl":"ex-0"},{"n":22,"text":"You should eat more vegetables to stay healthy. 건강을 유지하려면 채소를 더 먹는 것이 좋다는 뜻이에요. 이렇게 should는 충고할 때도 써요.","hl":"ex-1"},{"n":23,"text":"He insisted that the project should be done by the end of the month. 그는 그 프로젝트가 월말까지 끝나야 한다고 주장했다는 뜻이에요. insist 뒤 that절에서는 should를 넣거나 생략하고 동사원형 be를 써요.","hl":"ex-2"},{"n":24,"text":"should는 must보다 부드럽게 충고할 때 자주 써요. insist나 order, demand, suggest 뒤에 that절이 오면 그 안에 should와 동사원형을 쓴다는 것도 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>All applicants must to take an entrance test.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ All applicants must take an entrance test.\u003c/div>\u003cdiv class=\"g-why\">조동사 must 뒤에는 to 없이 동사원형을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He insisted that the project is done by the end of the month.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He insisted that the project (should) be done by the end of the month.\u003c/div>\u003cdiv class=\"g-why\">insist 뒤 that절에는 (should) + 동사원형을 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>You don't have to take this medicine before meals. (식사 전에 먹으면 안 된다는 뜻으로 쓸 때)\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ You must not take this medicine before meals.\u003c/div>\u003cdiv class=\"g-why\">금지는 must not, 불필요는 don't have to로 표현해요.\u003c/div>\u003c/div>","segs":[{"n":25,"text":"조동사 뒤에 to를 붙이는 실수를 아주 많이 해요. must to take가 아니라 must take라고 써야 하고, can이나 should 뒤에도 똑같이 동사원형만 온다는 점을 기억하세요.","hl":"mk-0"},{"n":26,"text":"insist나 suggest 뒤에 that절이 오면 그 안에는 should와 동사원형을 써요. 회화에서는 should를 생략하고 동사원형만 쓰기도 하는데, 이때도 is가 아니라 be를 써야 해요.","hl":"mk-1"},{"n":27,"text":"우리말로는 둘 다 비슷하게 들리지만 뜻은 정반대예요. 먹으면 안 된다는 금지는 must not, 먹을 필요가 없다는 불필요는 don't have to로 써야 해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Clara ____ be a liar. She always tells the truth.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>can't\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>must not\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>don't have to\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>shouldn't\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">can't\u003c/span>\u003cdiv class=\"g-exp\">'~일 리가 없다'는 강한 부정 추측은 can't로 표현해요. 뒤에 항상 진실을 말한다는 내용이 나오므로 '거짓말쟁이일 리가 없다'는 뜻이 돼요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"첫 번째 문제는 빈칸 채우기예요. Clara blank be a liar. She always tells the truth. 빈칸에 들어갈 말로 알맞은 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 첫 번째 보기 can't예요. 뒤에 그녀는 항상 진실을 말한다는 내용이 나오니까 거짓말쟁이일 리가 없다는 강한 추측이 되어야 해요. must not은 금지라서 여기에는 어울리지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 동사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">May he ____ in peace!\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">rest\u003c/span>\u003cdiv class=\"g-exp\">May + 주어 + 동사원형은 '~이기를 빈다'는 기원 표현이에요. 주어 he 뒤에는 동사원형 rest가 와요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"두 번째 문제도 빈칸 채우기예요. May he blank in peace! 라는 문장인데요, 여기에 알맞은 동사를 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 rest예요. May 다음에 주어 he가 오고 그 뒤에 동사원형이 오면 이기를 빈다는 기원 표현이 돼요. 그래서 그가 편히 잠들기를 바란다는 뜻이 되는 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 가장 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">You ____ take this medicine twice a day. Once is enough.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>must not\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>don't have to\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>can't\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>shouldn't\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">don't have to\u003c/span>\u003cdiv class=\"g-exp\">하루 한 번이면 충분하다는 말이므로 '먹을 필요가 없다'는 뜻의 don't have to가 알맞아요. must not은 '먹으면 안 된다'는 금지예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"세 번째 문제도 빈칸 채우기예요. You blank take this medicine twice a day. Once is enough. 뒤에 하루에 한 번이면 충분하다는 말이 이어져요. 알맞은 보기를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 두 번째 보기 don't have to예요. 한 번이면 충분하다는 말은 곧 두 번 먹을 필요가 없다는 뜻이니까요. must not을 쓰면 먹으면 안 된다는 금지가 되어 뜻이 완전히 달라져요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">All applicants must to take an entrance test.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">All applicants must take an entrance test.\u003c/span>\u003cdiv class=\"g-exp\">조동사 must 뒤에는 to 없이 동사원형이 와요. 따라서 must to take가 아니라 must take가 맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"네 번째 문제는 틀린 부분을 고치는 문제예요. All applicants must to take an entrance test. 이 문장에서 어색한 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 must to take를 must take로 고치는 거예요. must는 조동사라서 뒤에 동사원형이 바로 오고 to는 쓰지 않아요. 그래서 All applicants must take an entrance test. 가 맞는 문장이 돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 허가를 구하는 문장을 만드세요.\u003c/div>\u003cdiv class=\"g-qs\">May / I / take / this / cart / first\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">May I take this cart first?\u003c/span>\u003cdiv class=\"g-exp\">May I + 동사원형 ~?은 상대에게 정중하게 허가를 구하는 표현이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"다섯 번째 문제는 단어 배열이에요. May, I, take, this, cart, first 이 단어들을 모두 사용해서 허가를 구하는 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":6},{"n":42,"text":"정답은 May I take this cart first? 예요. 의문문이니까 May가 맨 앞에 오고, 주어 I 다음에 동사원형 take가 오면 정중하게 허가를 구하는 문장이 완성돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'건강을 유지하려면 채소를 더 먹는 것이 좋다'를 should를 사용해 영작하세요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">You should eat more vegetables to stay healthy.\u003c/span>\u003cdiv class=\"g-exp\">충고할 때는 should + 동사원형을 써요. '~하기 위해'는 to부정사 to stay로 표현해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":43,"text":"마지막 문제는 영작이에요. 건강을 유지하려면 채소를 더 먹는 것이 좋다는 말을 should를 사용해서 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":44,"text":"","hl":"q","pause":6},{"n":45,"text":"정답은 You should eat more vegetables to stay healthy. 예요. 충고할 때는 should 뒤에 동사원형 eat을 쓰고, 건강을 유지하려면이라는 뜻은 to stay healthy로 표현해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">그래마마스터 레벨3 Chapter02 - can, may, must, should\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>can은 \u003cb class=\"key\">능력\u003c/b>, \u003cb class=\"key\">허가·요청\u003c/b>, \u003cb class=\"key\">가능성·추측\u003c/b>을 나타내요.\u003c/li>\u003cli>may는 \u003cb class=\"key\">허가·요청\u003c/b>, \u003cb class=\"key\">가능성·추측\u003c/b>, \u003cb class=\"key\">기원\u003c/b>을 나타내요.\u003c/li>\u003cli>must는 \u003cb class=\"key\">의무\u003c/b>와 \u003cb class=\"key\">강한 추측\u003c/b>, should는 \u003cb class=\"key\">의무\u003c/b>와 \u003cb class=\"key\">충고\u003c/b>를 나타내요.\u003c/li>\u003cli>must not은 \u003cb class=\"key\">금지\u003c/b>, don't have to는 \u003cb class=\"key\">불필요\u003c/b>이고, insist 같은 동사 뒤 that절에는 \u003cb class=\"key\">(should) 동사원형\u003c/b>을 써요.\u003c/li>\u003c/ul>","segs":[{"n":46,"text":"오늘은 조동사 can, may, must, should를 예문과 함께 정리했어요. can은 능력과 허가, 추측을, may는 격식 있는 허가와 추측, 기원을 나타낸다는 것, 기억나죠? must는 의무와 강한 추측, should는 의무와 충고를 나타내고, insist 뒤 that절에는 should와 동사원형을 쓴다는 것도 꼭 챙겨 두세요. 그리고 must not은 금지, don't have to는 불필요라는 차이도 잊지 마세요. 오늘 배운 조동사들을 예문으로 꼭 소리 내어 연습해 보시고, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
