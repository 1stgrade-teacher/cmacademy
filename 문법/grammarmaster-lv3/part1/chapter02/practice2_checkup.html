  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

}
lecturePlayer(document.getElementById("app"),{"brand":"Practice2 Check Up","title":"조동사 + have p.p. 총정리 — 그래마마스터 레벨3 챕터2 문제풀이","audioDir":"practice2_checkup_audio","preview":false,"count":103,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조동사(과거 추측·후회, may well과 may as well, would rather A than B)\u003c/div>\u003ch1>조동사 + have p.p. 총정리 — 그래마마스터 레벨3 챕터2 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>14문제 · 양자택일, 빈칸 채우기, 틀린 부분 고치기, 서술형 빈칸 완성\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 그래마마스터 레벨삼 챕터이 조동사 문제를 함께 풀어 볼 거예요. 조동사 뒤에 have 과거분사가 붙으면 과거 사실에 대한 추측이나 후회를 나타낼 수 있는데, 오늘 이 부분을 확실하게 잡아 갑시다. 문제는 모두 열네 문제니까 하나씩 차근차근 풀어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 + have + 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실에 대한 \u003cb class=\"key\">추측\u003c/b>이나 \u003cb class=\"key\">후회\u003c/b>는 조동사 뒤에 \u003cb class=\"key\">have + 과거분사\u003c/b>를 붙여 표현합니다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + (not) + have + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>may have p.p.는 '~했을지도 모른다', must have p.p.는 '~했음에 틀림없다', cannot have p.p.는 '~했을 리가 없다'\u003c/li>\u003cli>should have p.p.는 '~했어야 했다', should not have p.p.는 '~하지 말았어야 했다'\u003c/li>\u003cli>not은 조동사 바로 뒤, have 앞에 씁니다\u003c/li>\u003cli>과거분사는 불규칙 형태까지 꼼꼼히 확인합니다(forget → forgotten)\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She may have hurt her leg.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 다리를 다쳤을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He must have missed the train.\u003c/div>\u003cdiv class=\"g-ko\">그는 기차를 놓쳤음에 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I should not have stayed up so late.\u003c/div>\u003cdiv class=\"g-ko\">나는 그렇게 늦게까지 깨어 있지 말았어야 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"자, 첫 번째 개념은 조동사 뒤에 have 과거분사가 오는 형태예요. 이 형태는 지금이 아니라 이미 지나간 일에 대해 추측하거나 후회할 때 씁니다. may have 과거분사는 했을지도 모른다, must have 과거분사는 했음에 틀림없다는 강한 추측, cannot have 과거분사는 했을 리가 없다는 강한 부정이에요. 그리고 should have 과거분사는 했어야 했다는 후회를 나타내죠. 여기서 중요한 건 not의 위치인데, not은 반드시 조동사 바로 뒤에 옵니다. 그리고 과거분사는 forget이 forgotten이 되는 것처럼 불규칙 형태도 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">She is walking very uncomfortably. She \u003cspan class=\"p-box\">\u003cspan>may\u003c/span>\u003ci>/\u003c/i>\u003cspan>cannot\u003c/span>\u003c/span> have hurt her leg.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">may\u003c/div>\u003cdiv class=\"p-op\">cannot\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">may\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제예요. 그녀가 아주 불편하게 걷고 있다는 상황이 먼저 나오죠. 이 상황에서 다리를 다쳤을 가능성을 어떻게 표현하는지 봐 주세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 may예요. 다리를 다쳤을지도 모른다는 가능성을 말하니까 may have 과거분사를 쓰고, cannot은 했을 리가 없다는 강한 부정이라 상황과 반대예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">She is walking very uncomfortably. She \u003cspan class=\"p-box\">\u003cspan class=\"ok\">may\u003c/span>\u003ci>/\u003c/i>\u003cspan>cannot\u003c/span>\u003c/span> have hurt her leg.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">may\u003c/div>\u003cdiv class=\"p-op\">cannot\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">앞 문장 확인\u003c/b>그녀가 아주 \u003cb class=\"key\">불편하게 걷고 있다\u003c/b>는 앞 문장이 단서입니다. 다리를 다쳤을 가능성을 추측하는 흐름이에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">may 확인\u003c/b>may have p.p.는 '~했을지도 모른다'로 \u003cb class=\"key\">가능성\u003c/b>을 나타내므로 자연스럽습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">cannot 확인\u003c/b>cannot have p.p.는 '~했을 리가 없다'라는 \u003cb class=\"key\">강한 부정\u003c/b>이라 상황과 반대입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 may\u003c/span>\u003cdiv class=\"p-full\">She may have hurt her leg.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 다리를 다쳤을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>cannot have p.p.를 '못 했다'로만 외우면 추측 문제에서 바로 틀립니다.\u003c/div>","segs":[{"n":6,"text":"먼저 앞 문장을 봐요. 그녀가 아주 불편하게 걷고 있다고 했죠. 그러면 다리를 다쳤을 가능성을 생각해 보는 흐름이라는 걸 알 수 있어요.","hl":"st-0"},{"n":7,"text":"그 가능성을 표현하는 게 may have 과거분사예요. 했을지도 모른다라는 뜻이니까 이 상황에 딱 맞습니다.","hl":"st-1"},{"n":8,"text":"반면에 cannot have 과거분사는 했을 리가 없다는 강한 부정이에요. 다리를 다쳤을 수도 있다는 흐름과 정반대라서 답이 될 수 없습니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. cannot have p.p.를 '못 했다'로만 외우면 추측 문제에서 바로 틀립니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The train left ten minutes ago. He \u003cspan class=\"p-box\">\u003cspan>should\u003c/span>\u003ci>/\u003c/i>\u003cspan>must\u003c/span>\u003c/span> have missed it.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">should\u003c/div>\u003cdiv class=\"p-op\">must\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">must\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제예요. 기차가 십 분 전에 떠났다는 정보가 핵심이에요. 그가 기차를 놓쳤다는 걸 얼마나 확신하는지 생각해 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 must예요. 기차가 이미 떠났으니 놓쳤음에 틀림없다는 강한 추측이고, should have 과거분사는 했어야 했다는 후회라서 여기엔 맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The train left ten minutes ago. He \u003cspan class=\"p-box\">\u003cspan>should\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">must\u003c/span>\u003c/span> have missed it.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">should\u003c/div>\u003cdiv class=\"p-op\">must\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>ten minutes ago는 \u003cb class=\"key\">과거\u003c/b>의 분명한 기준입니다. 이미 기차가 떠난 뒤라는 뜻이에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">must 확인\u003c/b>must have p.p.는 '~했음에 틀림없다'라는 \u003cb class=\"key\">강한 추측\u003c/b>으로, 기차를 놓친 것이 거의 확실한 상황에 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">should 확인\u003c/b>should have p.p.는 '~했어야 했다'라는 \u003cb class=\"key\">후회\u003c/b>라서 주어 he가 기차를 놓친 것과 연결되지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 must\u003c/span>\u003cdiv class=\"p-full\">The train left ten minutes ago. He must have missed it.\u003c/div>\u003cdiv class=\"p-ko\">기차가 십 분 전에 떠났다. 그는 기차를 놓쳤음에 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>과거 사실에 대한 강한 확신은 must have p.p., 후회는 should have p.p.로 구분하세요.\u003c/div>","segs":[{"n":13,"text":"먼저 시간 표현을 봐요. 십 분 전에 기차가 떠났다고 했으니 이미 지나간 일에 대한 이야기죠.","hl":"st-0"},{"n":14,"text":"기차가 떠났으니 그가 놓친 게 거의 확실하겠죠. 이렇게 확신하는 추측은 must have 과거분사로 표현합니다.","hl":"st-1"},{"n":15,"text":"should have 과거분사는 했어야 했다는 후회예요. 그가 기차를 놓친 사실을 말하는 자리에는 어울리지 않습니다.","hl":"st-2"},{"n":16,"text":"이 문제의 함정도 짚고 갈게요. 과거 사실에 대한 강한 확신은 must have p.p., 후회는 should have p.p.로 구분하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">may well과 may as well 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">may well\u003c/b>은 '~하는 것이 당연하다, 충분히 ~할 만하다'이고, \u003cb class=\"key\">may as well\u003c/b>은 '~하는 편이 낫다'라는 뜻입니다.\u003cdiv>\u003cspan class=\"g-formula\">may well + 동사원형 / may as well + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>may well은 근거가 있는 당연한 추측\u003c/li>\u003cli>may as well은 달리 더 나은 선택이 없어서 '~하는 게 낫다'는 뉘앙스\u003c/li>\u003cli>as well이 들어가면 '~하는 편이 낫다'로 해석\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You may well take some rest at home.\u003c/div>\u003cdiv class=\"g-ko\">너는 집에서 좀 쉬는 것이 당연하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">There's nothing else to do, so we may as well leave early.\u003c/div>\u003cdiv class=\"g-ko\">달리 할 일이 없으니 일찍 떠나는 편이 낫겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"두 번째 개념은 may well과 may as well을 구분하는 거예요. 두 표현이 as 하나 차이라서 학생들이 정말 자주 헷갈리죠. may well은 근거가 있어서 당연히 그럴 만하다는 뜻이고, may as well은 달리 더 나은 선택이 없으니까 하는 편이 낫다는 뜻이에요. 그래서 앞 문장에 할 일이 없다, 다른 방법이 없다 같은 내용이 나오면 may as well이 자연스럽습니다. 해석을 할 때는 as가 있으면 하는 편이 낫다로 읽어 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">There's nothing else to do here, so we \u003cspan class=\"p-box\">\u003cspan>may well\u003c/span>\u003ci>/\u003c/i>\u003cspan>may as well\u003c/span>\u003c/span> leave early.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">may well\u003c/div>\u003cdiv class=\"p-op\">may as well\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">may as well\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"세 번째 문제예요. 여기엔 달리 할 일이 없다는 말에 주목해 주세요. 선택의 여지가 없다는 뜻이거든요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":7},{"n":20,"text":"정답은 may as well이에요. 달리 더 나은 선택이 없으니까 일찍 떠나는 편이 낫다는 뜻이고, may well은 당연히 그럴 만하다는 뜻이라 여기엔 맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">There's nothing else to do here, so we \u003cspan class=\"p-box\">\u003cspan>may well\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">may as well\u003c/span>\u003c/span> leave early.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">may well\u003c/div>\u003cdiv class=\"p-op\">may as well\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">앞 문장 확인\u003c/b>여기엔 달리 할 일이 없다는 말은 \u003cb class=\"key\">선택의 여지가 없다\u003c/b>는 뜻입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">may as well 확인\u003c/b>may as well은 '~하는 편이 낫다'로, 다른 좋은 선택이 없을 때 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">may well 탈락\u003c/b>may well은 '~하는 것이 당연하다'라서 '일찍 떠나는 편이 낫다'는 흐름과 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 may as well\u003c/span>\u003cdiv class=\"p-full\">There's nothing else to do here, so we may as well leave early.\u003c/div>\u003cdiv class=\"p-ko\">여기엔 달리 할 일이 없으니 우리는 일찍 떠나는 편이 낫겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>as가 하나 빠지면 뜻이 완전히 달라집니다. '편이 낫다'는 may as well로 기억하세요.\u003c/div>","segs":[{"n":21,"text":"앞 부분에서 여기엔 다른 할 일이 없다고 했죠. 그러면 남은 선택이 별로 없다는 뜻이에요.","hl":"st-0"},{"n":22,"text":"이럴 때 쓰는 표현이 may as well이에요. 달리 할 게 없으니 일찍 떠나는 편이 낫겠다는 뜻이 자연스럽습니다.","hl":"st-1"},{"n":23,"text":"may well은 당연히 그럴 만하다는 뜻이라서, 편이 낫다는 의미를 살릴 수 없어요. 그래서 답이 될 수 없습니다.","hl":"st-2"},{"n":24,"text":"이 문제의 함정도 짚고 갈게요. as가 하나 빠지면 뜻이 완전히 달라집니다. '편이 낫다'는 may as well로 기억하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">would rather A than B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">would rather A than B\u003c/b>는 'B하기보다는 차라리 A하겠다'는 뜻으로, A와 B 자리에 모두 \u003cb class=\"key\">동사원형\u003c/b>이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">would rather + 동사원형 + than + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>than 뒤에도 to부정사가 아니라 동사원형을 씁니다\u003c/li>\u003cli>would rather 뒤에 not을 쓰면 '차라리 ~하지 않겠다'\u003c/li>\u003cli>'~하는 편이 좋다'라는 had better와 구분해서 기억\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I would rather walk than take a bus.\u003c/div>\u003cdiv class=\"g-ko\">나는 버스를 타기보다는 차라리 걷겠다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We would rather fight to the end than surrender.\u003c/div>\u003cdiv class=\"g-ko\">우리는 차라리 끝까지 싸우겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"세 번째 개념은 would rather A than B예요. 뜻은 비하기보다는 차라리 하겠다인데, 여기서 가장 중요한 건 형태입니다. would rather 뒤에도 동사원형, than 뒤에도 동사원형이 와요. than 뒤에 to부정사를 쓰는 실수가 정말 많으니까 꼭 기억해 주세요. 우리말 해석에 차라리, 오히려가 나오면 이 공식을 떠올리면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I would rather run my own business than \u003cspan class=\"p-box\">\u003cspan>work\u003c/span>\u003ci>/\u003c/i>\u003cspan>to work\u003c/span>\u003c/span> for someone else.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">work\u003c/div>\u003cdiv class=\"p-op\">to work\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">work\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"네 번째 문제예요. would rather와 than이 한 문장에 같이 나왔죠. 두 자리에 어떤 형태가 와야 하는지 확인해 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":7},{"n":28,"text":"정답은 work예요. would rather 뒤에도, than 뒤에도 동사원형이 와야 하니까 to가 붙은 to work는 틀린 표현입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I would rather run my own business than \u003cspan class=\"p-box\">\u003cspan class=\"ok\">work\u003c/span>\u003ci>/\u003c/i>\u003cspan>to work\u003c/span>\u003c/span> for someone else.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">work\u003c/div>\u003cdiv class=\"p-op\">to work\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">공식 확인\u003
