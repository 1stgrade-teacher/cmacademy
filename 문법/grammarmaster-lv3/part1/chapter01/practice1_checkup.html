  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

lecturePlayer(document.getElementById("app"),{"brand":"Practice1 Check Up","title":"현재완료와 현재완료진행 문제풀이","audioDir":"practice1_checkup_audio","preview":false,"count":112,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">현재완료, 현재완료진행, 과거시제 구분\u003c/div>\u003ch1>현재완료와 현재완료진행 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>15문제 · 양자택일, 보기 활용 빈칸 완성, 틀린 부분 고치기, 문장 결합 빈칸 완성\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 현재완료와 현재완료진행을 중심으로 Grammar Check Up 문제를 풀어 볼 거예요. since나 for, ever나 never, last month 같은 표현이 나올 때 어떤 시제를 골라야 하는지 하나씩 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 \u003cb class=\"key\">have/has + 과거분사\u003c/b>로 쓰고, 과거의 일이 지금까지 경험·완료·계속으로 이어짐을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">have/has + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>경험: ever, never와 함께 씁니다.\u003c/li>\u003cli>완료: already, yet과 함께 씁니다.\u003c/li>\u003cli>계속: for, since와 함께 씁니다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have never seen this movie.\u003c/div>\u003cdiv class=\"g-ko\">나는 이 영화를 본 적이 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has already finished her homework.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 이미 숙제를 끝냈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 현재완료를 정리해 볼게요. 현재완료는 have 또는 has 뒤에 과거분사를 붙여서 과거의 일이 지금까지 이어지는 경험, 완료, 계속을 나타내요. 경험을 물을 때는 ever, 경험한 적이 없을 때는 never를 자주 써요. already는 이미 끝난 일, yet은 아직 끝나지 않은 일에 잘 어울려요. 그래서 since나 for가 보이면 지금까지 이어지는 일인지 먼저 확인하는 습관이 중요해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\" cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">They have been \u003cspan class=\"p-box\">\u003cspan>run\u003c/span>\u003ci>/\u003c/i>\u003cspan>running\u003c/span>\u003c/span> in marathons for about 10 years.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">run\u003c/div>\u003cdiv class=\"p-op\">running\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">running\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"이번 문제는 have been 뒤에 어떤 형태가 오는지 묻는 문제예요. for about ten years도 함께 살펴보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 running이에요. have been 뒤에는 동사원형에 ing를 붙인 현재완료진행 형태가 와요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">They have been \u003cspan class=\"p-box\">\u003cspan>run\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">running\u003c/span>\u003c/span> in marathons for about 10 years.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">run\u003c/div>\u003cdiv class=\"p-op\">running\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">have been 확인\u003c/b>have been 뒤에는 \u003cb class=\"key\">현재완료진행\u003c/b> 형태가 와야 하므로 동사원형에 ing를 붙입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">for about 10 years 확인\u003c/b>for about 10 years는 \
