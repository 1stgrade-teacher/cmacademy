u003c/span>\u003ci>/\u003c/i>\u003cspan>writing\u003c/span>\u003c/span> the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">written\u003c/div>\u003cdiv class=\"p-op\">writing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">writing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 괄호 안에서 알맞은 형태를 고르는 문제예요. 미래 시점을 나타내는 표현과 How long이 함께 있다는 점을 눈여겨보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 writing입니다. 미래의 다섯 시까지 보고서를 계속 쓰고 있는 상황이므로 미래완료진행을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">How long will you have been \u003cspan class=\"p-box\">\u003cspan>written\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">writing\u003c/span>\u003c/span> the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">written\u003c/div>\u003cdiv class=\"p-op\">writing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시제 단서 찾기\u003c/b>by 5 p.m.는 미래의 특정 시점까지를 뜻하므로 \u003cb class=\"key\">미래완료\u003c/b> 또는 \u003cb class=\"key\">미래완료진행\u003c/b>을 생각합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">How long 확인\u003c/b>How long은 '얼마 동안'이라는 \u003cb class=\"key\">기간\u003c/b>을 묻으므로 동작이 계속되는 \u003cb class=\"key\">진행\u003c/b> 의미가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">형태 고르기\u003c/b>will have been 뒤에는 \u003cb class=\"key\">V-ing\u003c/b>가 와야 하므로 writing이 알맞습니다. written은 완료의 p.p.라 진행 의미를 살릴 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 writing\u003c/span>\u003cdiv class=\"p-full\">How long will you have been writing the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-ko\">너는 오후 다섯 시까지 그 보고서를 얼마 동안 쓰고 있을 것인가?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>by 5 p.m.만 보고 will have written을 고르지 말고, How long이 있으면 진행형을 먼저 확인하세요.\u003c/div>","segs":[{"n":6,"text":"먼저 오후 다섯 시까지라는 표현을 보세요. 미래의 다섯 시까지라는 기준점이 있으니 미래완료 계열을 생각해야 해요.","hl":"st-0"},{"n":7,"text":"그다음 How long을 확인하세요. 얼마 동안이라는 기간을 묻고 있으니 동작이 계속 이어지는 진행의 느낌이 필요합니다.","hl":"st-1"},{"n":8,"text":"그래서 will have been 다음에는 writing이 와야 해요. written은 과거분사라서 여기에서는 진행의 의미를 살릴 수 없습니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. by 5 p.m.만 보고 will have written을 고르지 말고, How long이 있으면 진행형을 먼저 확인하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">과거완료\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 어떤 시점보다 더 앞선 일을 말할 때 \u003cb class=\"key\">had + p.p.\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + had + p.p. + before/by/when + 과거 시점\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거보다 더 과거인 사건 표시\u003c/li>\u003cli>before, after, when, by the time 같은 단서 확인\u003c/li>\u003cli>과거 시제와 함께 쓰여 시간 순서를 분명히 함\u003c/li>\u003cli>ever는 과거완료 의문문에서 Had you ever p.p. 형태\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">had left\u003c/span> before I arrived.\u003c/div>\u003cdiv class=\"g-ko\">내가 도착하기 전에 그녀는 떠났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"과거완료는 과거의 한 사건보다 더 먼저 일어난 일을 말할 때 사용해요. had 뒤에 과거분사를 붙이면 됩니다. before나 when 같은 말과 함께 두 과거 사건의 순서를 보여 줄 때 자주 나와요. 기준이 되는 시점이 과거라면 현재완료 have가 아니라 had를 써야 한다는 점을 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 14\u003c/span>\u003cspan class=\"g-kind\">양자택일
