 class=\"p-box\">\u003cspan>written\u003c/span>\u003ci>/\u003c/i>\u003cspan>writing\u003c/span>\u003c/span> the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① written\u003c/div>\u003cdiv class=\"p-op\">② writing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② writing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 오후 다섯 시까지 보고서를 얼마나 오래 쓰고 있게 될지 묻는 문장이에요. will have been 뒤에 어떤 형태가 와야 하는지 생각해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 두 번째 선택지인 writing이에요. 얼마 동안 계속 쓰고 있게 될지를 말하므로 미래완료진행 형태인 will have been writing을 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">How long will you have been \u003cspan class=\"p-box\">\u003cspan>written\u003c/span>\u003ci>/\u003c/i>\u003cspan>writing\u003c/span>\u003c/span> the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① written\u003c/div>\u003cdiv class=\"p-op\">② writing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">구조 확인\u003c/b>\u003cb class=\"key\">will have been\u003c/b> 뒤에는 현재분사가 와서 미래완료진행을 만든다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 확인\u003c/b>written은 과거분사라서 \u003cb class=\"key\">will have been written\u003c/b>이 되어 수동의 의미가 된다. ‘you’가 보고서를 쓰는 주체이므로 알맞지 않다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>따라서 \u003cb class=\"key\">writing\u003c/b>이 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② writing\u003c/span>\u003cdiv class=\"p-full\">How long will you have been writing the report by 5 p.m.?\u003c/div>\u003cdiv class=\"p-ko\">오후 다섯 시까지 너는 그 보고서를 얼마나 오래 쓰고 있게 될까?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>will have been 뒤에 무조건 과거분사를 쓰면 수동이 됩니다. 계속 진행이면 현재분사를 씁니다.\u003c/div>","segs":[{"n":6,"text":"먼저 빈칸 앞을 보면 will have been이 있어요. 이 형태는 미래의 어떤 시점까지 계속하고 있을 일을 말할 때 쓰는 미래완료진행이에요.","hl":"st-0"},{"n":7,"text":"written은 과거분사라서 will have been written이 되면 수동의 느낌이 돼요. 그런데 여기서는 you가 보고서를 쓰는 사람이므로 수동으로 만들면 뜻이 맞지 않습니다.","hl":"st-1"},{"n":8,"text":"그래서 현재분사인 writing이 들어가야 합니다. 정답은 두 번째 선택지예요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. will have been 뒤에 무조건 과거분사를 쓰면 수동이 됩니다. 계속 진행이면 현재분사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">과거완료 (had + p.p.)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 어떤 일보다 더 이전에 일어난 일은 \u003cb class=\"key\">had + p.p.\u003c/b>로 표현한다.\u003cdiv>\u003cspan class=\"g-formula\">had + 과거분사(p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거의 기준점보다 앞선 일을 나타낸다.\u003c/li>\u003cli>before, after, when, by the time 같은 표현과 함께 자주 쓴다.\u003c/li>\u003cli>부정은 \u003cb class=\"key\">had not + p.p.\u003c/b>로 쓴다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">When I arrived, the movie had already begun.\u003c/div>\u003cdiv class=\"g-ko\">내가 도착했을 때 영화는 이미 시작되었었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She had not slept enough the night before.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 전날 밤에 잠을 충분히 자지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"과거완료는 과거의 어떤 장면보다 더 앞서 일어난 일을 말할 때 써요. 형태는 had 다음에 과거분사를 붙이면 됩니다. 예를 들어 내가 도착했을 때 영화가 이미 시작되었었다라고 할 때는 had already begun처럼 써요. 부정문은 had not slept처럼 had not 뒤에 과거분사를 붙여요. 문제에서 before나 when 같은 말과 함께 과거 사실이 두 개 보이면 먼저 일어난 쪽에 과거완료가 쓰였는지 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">When I arrived at school, the first period had already \u003cspan class=\"p-box\">\u003cspan>began\u003c/span>\u003ci>/\u003c/i>\u003cspan>begun\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① began\u003c/div>\u003cdiv class=\"p-op\">② begun\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② begun\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 내가 학교에 도착했을 때 첫 수업이 이미 시작되었었다는 뜻을 만드는 문장이에요. had already 뒤에 과거형이 와야 하는지 과거분사가 와야 하는지 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 두 번째 선택지인 begun이에요. had already 뒤에는 과거분사가 와야 해서 begin의 과거분사 begun을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">When I arrived at school, the first period had already \u003cspan class=\"p-box\">\u003cspan>began\u003c/span>\u003ci>/\u003c/i>\u003cspan>begun\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① began\u003c/div>\u003cdiv class=\"p-op\">② begun\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시제 확인\u003c/b>\u003cb class=\"key\">had already\u003c/b>가 있으므로 과거완료 구조이다. had 뒤에는 과거분사가 와야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 확인\u003c/b>began은 begin의 과거형이고, begun은 과거분사이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>따라서 \u003cb class=\"key\">begun\u003c/b>이 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② begun\u003c/span>\u003cdiv class=\"p-full\">When I arrived at school, the first period had already begun.\u003c/div>\u003cdiv class=\"p-ko\">내가 학교에 도착했을 때, 첫 수업은 이미 시작되었었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>begin의 과거형 began과 과거분사 begun을 구별해야 합니다. had 뒤에는 begun입니다.\u003c/div>","segs":[{"n":14,"text":"빈칸 앞에 had already가 보여요. had가 쓰였으므로 이 문장은 과거완료 구조이고, had 뒤에는 과거분사가 와야 합니다.","hl":"st-0"},{"n":15,"text":"began은 begin의 과거형이고, begun은 과거분사예요. had 뒤에는 과거분사가 필요하므로 begun이 맞습니다.","hl":"st-1"},{"n":16,"text":"그래서 정답은 두 번째 선택지인 begun이에요.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. begin의 과거형 began과 과거분사 begun을 구별해야 합니다. had 뒤에는 begun입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료와 과거완료의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 현재까지 이어지는 일에, 과거완료는 과거의 기준점보다 이전 일에 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">have/has + p.p. ↔ had + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>before + 과거절이 있으면 그보다 이전 일은 과거완료로 쓴다.\u003c/li>\u003cli>ever, never 같은 경험 표현은 완료 시제와 함께 쓸 수 있다.\u003c/li>\u003cli>과거의 기준점이 분명하면 have/has가 아니라 had를 쓴다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Had you ever studied Spanish before you moved to Spain?\u003c/div>\u003cdiv class=\"g-ko\">스페인으로 이사하기 전에 너는 스페인어를 공부한 적이 있었니?\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"현재완료와 과거완료는 모양이 비슷해서 헷갈리기 쉬워요. 현재완료는 지금까지 이어지는 일이나 경험을 말할 때 쓰고, 과거완료는 과거의 어떤 일보다 더 이전에 일어난 일을 말할 때 씁니다. 문제에 before you moved처럼 과거의 기준점이 있으면 그보다 앞선 경험은 had studied처럼 과거완료로 써야 해요. 그래서 Have you ever studied가 아니라 Had you ever studied가 되는 거죠.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cspan class=\"p-box\">\u003cspan>Have\u003c/span>\u003ci>/\u003c/i>\u003cspan>Had\u003c/span>\u003c/span> you ever studied Spanish before you moved to Spain?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Have\u003c/div>\u003cdiv class=\"p-op\">② Had\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② Had\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 스페인으로 이사하기 전에 스페인어를 공부한 적이 있었는지 묻는 문장이에요. before you moved라는 과거 기준점을 먼저 확인해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 두 번째 선택지인 Had예요. 이사한 일보다 공부한 일이 더 이전이므로 과거완료 Had you ever studied를 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cspan class=\"p-box\">\u003cspan>Have\u003c/span>\u003ci>/\u003c/i>\u003cspan>Had\u003c/span>\u003c/span> you ever studied Spanish before you moved to Spain?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Have\u003c/div>\u003cdiv class=\"p-op\">② Had\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">과거 기준점 확인\u003c/b>\u003cb class=\"key\">before you moved\u003c/b>는 과거의 기준점을 나타낸다. 스페인어를 공부한 일은 그보다 이전이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 선택\u003c/b>과거보다 이전 일이므로 현재완료 \u003cb class=\"key\">Have\u003c/b>가 아니라 과거완료 \u003cb class=\"key\">Had\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>따라서 \u003cb class=\"key\">Had\u003c/b>가 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② Had\u003c/span>\u003cdiv class=\"p-full\">Had you ever studied Spanish before you moved to Spain?\u003c/div>\u003cdiv class=\"p-ko\">스페인으로 이사하기 전에 너는 스페인어를 공부한 적이 있었니?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ever가 보여서 무조건 Have를 고르면 안 됩니다. before + 과거절이 있으면 과거완료를 확인합니다.\u003c/div>","segs":[{"n":22,"text":"문장 뒤에 before you moved가 있어요. 이 말은 과거의 기준점을 만들어 줍니다. 스페인어를 공부한 일은 그 이사보다 더 이전에 일어난 일이죠.","hl":"st-0"},{"n":23,"text":"과거보다 더 이전 일을 말할 때는 현재완료 have가 아니라 과거완료 had를 써요. 그래서 Had you ever studied가 되어야 합니다.","hl":"st-1"},{"n":24,"text":"그래서 정답은 두 번째 선택지인 Had예요.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. ever가 보여서 무조건 Have를 고르면 안 됩니다. before + 과거절이 있으면 과거완료를 확인합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">미래완료 (will have + p.p.)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">미래의 특정 시점까지 어떤 일이 완료될 것임을 나타낼 때 \u003cb class=\"key\">will have + p.p.\u003c/b>를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">will have + 과거분사(p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>by + 미래 시간 표현과 함께 자주 쓴다.\u003c/li>\u003cli>‘~까지 …했을 것이다’로 해석한다.\u003c/li>\u003cli>will have 뒤에는 반드시 과거분사가 온다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He will have left school by 4 p.m. tomorrow.\u003c/div>\u003cdiv class=\"g-ko\">그는 내일 오후 네 시까지 학교를 떠났을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The workers will have built the bridge by the time this month ends.\u003c/div>\u003cdiv class=\"g-ko\">노동자들은 이번 달이 끝날 때쯤이면 그 다리를 지을 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"미래완료는 미래의 어떤 시점까지 일이 끝나 있을 것이라고 말할 때 써요. 형태는 will have 다음에 과거분사를 붙입니다. by tomorrow나 by the time this month ends처럼 미래의 기준 시간이 보이면 will have left나 will have built처럼 과거분사가 왔는지 확인해요. 뜻은 보통 ‘~까지 무엇을 했을 것이다’로 해석합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He \u003cspan class=\"p-box\">\u003cspan>will have left\u003c/span>\u003ci>/\u003c/i>\u003cspan>has left\u003c/span>\u003c/span> school by 4:00 p.m. tomorrow.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① will have left\u003c/div>\u003cdiv class=\"p-op\">② has left\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">① will have left\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 그가 내일 오후 네 시까지 학교를 떠났을 것이라고 말하는 문장이에요. by와 tomorrow가 함께 있다는 점을 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 첫 번째 선택지인 will have left예요. 미래의 특정 시점까지 완료될 일이므로 will have left를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 14\u003c/span>\u003cspan class=\"g-kind\">선택형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He \u003cspan class=\"p-box\">\u003cspan>will have left\u003c/span>\u003ci>/\u003c/i>\u003cspan>has left\u003c/span>\u003c/span> school by 4:00 p.m. tomorrow.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① will have left\u003c/div>\u003cdiv class=\"p-op\">② has left\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>\u003cb class=\"key\">by 4:00 p.m. tomorrow\u003c/b>는 미래의 특정 시점까지를 나타낸다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 선택\u003c/b>미래의 특정 시점까지 완료될 일이므로 \u003cb class=\"key\">will have + p.p.\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 확인\u003c/b>has left는 현재완료이므로 미래의 기준 시간과 맞지 않는다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답\u003c/b>따라서 \u003cb class=\"key\">will have left\u003c/b>가 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ① will have left\u003c/span>\u003cdiv class=\"p-full\">He will have left school by 4:00 p.m. tomorrow.\u003c/div>\u003cdiv class=\"p-ko\">그는 내일 오후 네 시까지 학교를 떠났을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>tomorrow가 있으니 미래완료 will have left를 써야 합니다. has left는 현재완료입니다.\u003c/div>","segs":[{"n":30,"text":"문장 끝에 by four p.m. tomorrow가 있어요. 이 표현은 내일 오후 네 시까지라는 미래의 기준 시간을 나타냅니다.","hl":"st-0"},{"n":31,"text":"미래의 어떤 시점까지 일이 끝나 있을 것이라고 말할 때는 will have 다음에 과거분사를 쓰는 미래완료를 써요.","hl":"st-1"},{"n":32,"text":"has left는 현재완료라서 내일 오후 네 시라는 미래 기준과 잘 맞지 않습니다.","hl":"st-2"},{"n":33,"text":"그래서 정답은 첫 번째 선택지인 will have left예요.","hl":"st-3"},{"n":34,"text":"이 문제의 함정도 짚고 갈게요. tomorrow가 있으니 미래완료 will have left를 써야 합니다. has left는 현재완료입니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 14\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 우리말과 의미가 같도록 빈칸에 들어갈 말을 [보기]에서 골라 알맞은 형태로 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Carol은 전날 밤에 잠을 충분히 자지 않았기 때문에 매우 피곤했다.\u003cbr>→ Carol was so tired because she \u003cspan class=\"p-blank\">\u003c/span> \u003cspan class=\"p-blank\">\u003c/span> \u003cspan class=\"p-blank\">\u003c/span> enough the night before.\u003c/div>\u003cdiv class=\"p-words\">보기: meet / wait / build / sleep\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had not slept\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"다섯 번째 문제는 Carol이 전날 밤에 잠을 충분히 자지 않아서 피곤했다는 뜻을 만드는 문장이에요. 과거보다 더 이전 일이라는 점과 부정 표현을 함께 생각해 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":7},{"n":37,"text":"정답은 had not slept예요. 과거의 기준보다 앞선 부정의 일을 말하므로 had not slept를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 14\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 우리말과 의미가 같도록 빈칸에 들어갈 말을 [보기]에서 골라 알맞은 형태로 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Carol은 전날 밤에 잠을 충분히 자지 않았기 때문에 매우 피곤했다.\u003cbr>→ Carol was so tired because she \u003cspan class=\"p-blank\">\u003c/span> \u003cspan class=\"p-blank\">\u003c/span> \u003cspan class=\"p-blank\">\u003c/span> enough the night before.\u003c/div>\u003cdiv class=\"p-words\">보기: meet / wait / build / sleep\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문장의 기준 확인\u003c/b>Carol was tired는 과거이고, \u003cb class=\"key\">the night before\u003c/b>는 그보다 앞선 밤이다. 잠을 자지 않은 일은 그 전에 끝난 상태이므로 과거완료를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동사 선택\u003c/b>‘잠을 자다’는 \u003cb class=\"key\">sleep\u003c/b>이고, 과거분사는 \u003cb class=\"key\">slept\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">부정 과거완료\u003c/b>‘자지 않았다’이므로 \u003cb class=\"key\">had not + p.p.\u003c/b> 구조로 \u003cb class=\"key\">had not sle
