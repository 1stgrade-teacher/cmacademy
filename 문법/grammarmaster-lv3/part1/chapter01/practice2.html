</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Practice2","title":"과거완료 & 미래완료 — 시간선 위에서 말하기","audioDir":"practice2_audio","preview":false,"count":44,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">과거완료, 미래완료\u003c/div>\u003ch1>과거완료 &amp; 미래완료 — 시간선 위에서 말하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>과거보다 더 이전의 일은 had + p.p., 미래의 한 시점까지의 일은 will have + p.p.로 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 그래마마스터 레벨 쓰리의 과거완료와 미래완료를 공부해 볼 거예요. 시제는 시간선 위에 사건을 놓는 연습이라고 생각하면 훨씬 쉬워져요. 과거보다 더 이전의 일을 말할 때 쓰는 had와 과거분사, 그리고 미래의 어느 시점까지 끝나는 일을 말할 때 쓰는 will have와 과거분사를 예문으로 차근차근 익혀 볼게요. 오늘 수업이 끝나면 여러분은 시간선을 자유롭게 오갈 수 있게 될 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">과거완료의 형태와 네 가지 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 특정 시점보다 더 이전에 일어난 일이 그 시점까지 영향을 미칠 때 「had + p.p.」의 형태로 씁니다. 쓰임은 \u003cb class=\"key\">완료\u003c/b>, \u003cb class=\"key\">경험\u003c/b>, \u003cb class=\"key\">계속\u003c/b>, \u003cb class=\"key\">결과\u003c/b> 네 가지로 나눌 수 있습니다. 기준 시점이 과거라는 점이 현재완료와 다릅니다.\u003cdiv>\u003cspan class=\"g-formula\">had + p.p. (기준 시점: 과거)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">had just finished\u003c/span> reading the book when his parents came home.\u003c/div>\u003cdiv class=\"g-ko\">그의 부모님이 집에 왔을 때 그는 막 그 책을 다 읽은 상태였다.\u003c/div>\u003cdiv class=\"g-note\">과거의 한 시점에 막 끝난 일은 완료의 의미로 had + p.p.를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My family \u003cspan class=\"fx\">had never been\u003c/span> to South America until last month.\u003c/div>\u003cdiv class=\"g-ko\">우리 가족은 지난달까지 남아메리카에 한 번도 가 본 적이 없었다.\u003c/div>\u003cdiv class=\"g-note\">과거의 한 시점까지의 경험을 말할 때 had never p.p.를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Brian \u003cspan class=\"fx\">had been sick for about three weeks\u003c/span> when I saw him.\u003c/div>\u003cdiv class=\"g-ko\">내가 브라이언을 만났을 때 그는 약 삼 주 동안 아팠다.\u003c/div>\u003cdiv class=\"g-note\">과거의 한 시점까지 상태가 계속 이어졌으므로 과거완료를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">had broken\u003c/span> my leg, so I couldn't walk alone.\u003c/div>\u003cdiv class=\"g-ko\">나는 다리가 부러져서 혼자 걸을 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">앞의 일이 원인이 되어 생긴 결과를 나타낼 때도 과거완료를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재완료의 기준 시점은 \u003cb class=\"key\">현재\u003c/b>, 과거완료의 기준 시점은 \u003cb class=\"key\">과거\u003c/b>라는 차이를 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"자, 먼저 과거완료부터 볼게요. 과거의 어떤 시점보다 더 이전에 일어난 일이 그 시점까지 영향을 줄 때, 동사 앞에 had를 쓰고 뒤에는 과거분사를 붙여요. 이때 기준이 되는 시점은 지금이 아니라 과거라는 게 중요해요. 쓰임은 방금 끝난 완료, 해 본 적 있는 경험, 계속 이어지는 상태, 그리고 그 일 때문에 생긴 결과 이렇게 네 가지로 나눠 볼 수 있어요.","hl":"rule"},{"n":3,"text":"먼저 이 문장이에요. He had just finished reading the book when his parents came home. 뜻은 그의 부모님이 집에 왔을 때 그는 막 그 책을 다 읽은 상태였다는 거예요. 부모님이 온 시점보다 책을 다 읽은 일이 먼저 일어났기 때문에 had finished를 썼어요. 이렇게 과거의 어떤 시점에 막 끝난 일은 완료의 의미로 과거완료를 써요.","hl":"ex-0"},{"n":4,"text":"다음은 경험을 나타내는 문장이에요. My family had never been to South America until last month. 뜻은 우리 가족은 지난달까지 남아메리카에 한 번도 가 본 적이 없었다는 거예요. 지난달이라는 과거 시점까지의 경험을 말하고 있으니 had never been을 쓴 거죠.","hl":"ex-1"},{"n":5,"text":"이번에는 계속을 나타내는 문장이에요. Brian had been sick for about three weeks when I saw him. 뜻은 내가 브라이언을 만났을 때 그는 약 삼 주 동안 아팠다는 거예요. 내가 그를 본 과거 시점까지 병이 계속 이어졌으니까 had been sick을 쓴 거예요.","hl":"ex-2"},{"n":6,"text":"마지막은 결과를 나타내는 문장이에요. I had broken my leg, so I couldn't walk alone. 뜻은 나는 다리가 부러져서 혼자 걸을 수 없었다는 거예요. 다리가 부러진 일이 먼저 일어났고, 그 결과로 혼자 걸을 수 없었던 거죠.","hl":"ex-3"},{"n":7,"text":"현재완료와 헷갈리기 쉬운데, 현재완료는 기준 시점이 현재이고 과거완료는 기준 시점이 과거예요. 과거 이야기를 하다가 그보다 더 전에 일어난 일을 말할 때 과거완료를 떠올리면 돼요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">대과거와 현재완료 비교\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거에 일어난 여러 가지 일 중에서 더 먼저 일어난 일을 \u003cb class=\"key\">대과거\u003c/b>라고 하고 과거완료로 나타냅니다. 단, before, after 등 일의 전후 관계가 분명히 드러나는 접속사가 쓰이면 과거완료 대신 \u003cb class=\"key\">과거시제\u003c/b>를 쓸 수 있습니다. 또한 현재완료의 기준 시점은 \u003cb class=\"key\">현재\u003c/b>, 과거완료의 기준 시점은 \u003cb class=\"key\">과거\u003c/b>입니다.\u003cdiv>\u003cspan class=\"g-formula\">더 먼저 일어난 일 → had + p.p. / before, after가 있으면 과거시제 가능\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The movie \u003cspan class=\"fx\">had started\u003c/span> when she entered the theater.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 극장에 들어갔을 때 영화는 이미 시작해 있었다.\u003c/div>\u003cdiv class=\"g-note\">영화가 시작한 일이 극장에 들어간 일보다 먼저 일어난 대과거입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She apologized to her friend after she \u003cspan class=\"fx\">had realized\u003c/span> her mistake.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 자신의 실수를 깨달은 후에 친구에게 사과했다.\u003c/div>\u003cdiv class=\"g-note\">after가 있어 realized로 써도 되지만, 먼저 일어난 일을 강조하려고 과거완료를 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">My room is messy. I \u003cspan class=\"fx\">haven't cleaned\u003c/span> it for weeks.\u003c/div>\u003cdiv class=\"g-ko\">내 방은 지저분하다. 나는 몇 주 동안 그 방을 치우지 않았다.\u003c/div>\u003cdiv class=\"g-note\">기준 시점이 현재이므로 현재완료를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">My room was messy. I \u003cspan class=\"fx\">hadn't cleaned\u003c/span> it for weeks.\u003c/div>\u003cdiv class=\"g-ko\">내 방은 지저분했다. 나는 몇 주 동안 그 방을 치우지 않았었다.\u003c/div>\u003cdiv class=\"g-note\">기준 시점이 과거로 옮겨지면 과거완료를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>before, after가 있어도 더 먼저 일어난 일을 강조하고 싶으면 과거완료를 그대로 써도 됩니다.\u003c/div>","segs":[{"n":8,"text":"이번에는 대과거를 정리해 볼게요. 과거에 일어난 두 가지 일 가운데 더 먼저 일어난 일을 대과거라고 하고 과거완료로 나타내요. 그런데 before나 after처럼 일의 앞뒤 관계가 분명한 접속사가 쓰이면 과거완료 대신 그냥 과거시제를 써도 괜찮아요. 그리고 현재완료는 기준 시점이 현재, 과거완료는 기준 시점이 과거라는 차이도 꼭 기억해 두세요.","hl":"rule"},{"n":9,"text":"먼저 이 문장이에요. The movie had started when she entered the theater. 뜻은 그녀가 극장에 들어갔을 때 영화는 이미 시작해 있었다는 거예요. 영화가 시작한 일이 그녀가 들어간 일보다 먼저 일어났으니까 had started를 쓴 거죠.","hl":"ex-0"},{"n":10,"text":"다음 문장이에요. She apologized to her friend after she had realized her mistake. 뜻은 그녀는 자신의 실수를 깨달은 후에 친구에게 사과했다는 거예요. after가 있어서 realized라고 그냥 과거시제로 써도 되지만, 먼저 일어난 일을 또렷하게 보여 주려고 had realized를 썼어요.","hl":"ex-1"},{"n":11,"text":"이제 현재완료와 비교해 볼게요. My room is messy. I haven't cleaned it for weeks. 뜻은 내 방은 지저분하다, 나는 몇 주 동안 그 방을 치우지 않았다는 거예요. 지금 이 순간을 기준으로 말하고 있으니 현재완료를 썼어요.","hl":"ex-2"},{"n":12,"text":"이 문장과 비교해 보세요. My room was messy. I hadn't cleaned it for weeks. 뜻은 내 방은 지저분했다, 나는 몇 주 동안 그 방을 치우지 않았었다는 거예요. 기준 시점이 과거로 옮겨졌기 때문에 현재완료 대신 과거완료 hadn't cleaned를 쓴 거예요.","hl":"ex-3"},{"n":13,"text":"before나 after가 있으면 과거시제를 써도 되지만, 더 먼저 일어난 일을 강조하고 싶을 때는 과거완료를 그대로 써도 된다는 점도 알아 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">과거완료진행\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 특정 시점 이전부터 그 시점까지 계속 진행되고 있었던 일은 「had been + v-ing」의 형태로 씁니다. 얼마 동안 하고 있었는지를 나타내는 \u003cb class=\"key\">기간\u003c/b> 표현과 자주 함께 씁니다. 상태를 나타내는 동사는 진행형으로 쓰지 않습니다.\u003cdiv>\u003cspan class=\"g-formula\">had been + v-ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Some people \u003cspan class=\"fx\">had been standing\u003c/span> in line for more than three hours at that time.\u003c/div>\u003cdiv class=\"g-ko\">그때 몇몇 사람들은 세 시간 넘게 줄을 서 있었다.\u003c/div>\u003cdiv class=\"g-note\">과거의 한 시점까지 동작이 계속 진행되고 있었음을 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">had been waiting\u003c/span> for the bus for thirty minutes when it finally came.\u003c/div>\u003cdiv class=\"g-ko\">버스가 마침내 왔을 때 그는 삼십 분 동안 버스를 기다리고 있었다.\u003c/div>\u003cdiv class=\"g-note\">과거의 한 시점까지 기다리는 동작이 계속되고 있었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>know, have, belong처럼 \u003cb class=\"key\">상태\u003c/b>를 나타내는 동사는 진행형으로 쓰지 않습니다.\u003c/div>","segs":[{"n":14,"text":"이번에는 과거완료진행이에요. 과거의 어떤 시점 이전부터 그 시점까지 계속 진행되고 있던 일은 had been에 동사 ing를 붙여서 표현해요. 보통 얼마 동안 하고 있었는지를 함께 말하기 때문에 기간을 나타내는 표현과 자주 만나요. 그리고 know나 belong처럼 상태를 나타내는 동사는 진행형으로 쓰지 않는다는 점도 기억해 주세요.","hl":"rule"},{"n":15,"text":"이 문장을 보세요. Some people had been standing in line for more than three hours at that time. 뜻은 그때 몇몇 사람들은 세 시간 넘게 줄을 서 있었다는 거예요. 그때라는 과거 시점까지 줄을 서는 동작이 계속 이어지고 있었으니 had been standing을 쓴 거죠.","hl":"ex-0"},{"n":16,"text":"비슷한 문장을 하나 더 볼게요. He had been waiting for the bus for thirty minutes when it finally came. 뜻은 버스가 마침내 왔을 때 그는 삼십 분 동안 버스를 기다리고 있었다는 거예요. 버스가 온 과거 시점까지 기다리는 동작이 계속되고 있었어요.","hl":"ex-1"},{"n":17,"text":"상태를 나타내는 동사는 진행형으로 쓰지 않아요. 그래서 나는 그를 오 년 동안 알고 있었다라고 할 때는 had been knowing이 아니라 had known을 써야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">미래완료와 미래완료진행\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">미래의 특정 시점까지 계속되거나 완료되는 일은 「will have + p.p.」의 형태로 씁니다. 주로 \u003cb class=\"key\">by\u003c/b>, \u003cb class=\"key\">by the time\u003c/b>과 함께 씁니다. 미래의 특정 시점까지 지속되고 있을 일은 「will have been + v-ing」의 형태로 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">will have + p.p. / will have been + v-ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">By next year, I \u003cspan class=\"fx\">will have graduated\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내년이면 나는 졸업할 것이다.\u003c/div>\u003cdiv class=\"g-note\">by + 미래 시점까지 완료되는 일은 will have + p.p.로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">By the time they move abroad, they \u003cspan class=\"fx\">will have sold\u003c/span> their house.\u003c/div>\u003cdiv class=\"g-ko\">그들이 해외로 이사할 때쯤이면 그들은 집을 팔았을 것이다.\u003c/div>\u003cdiv class=\"g-note\">by the time 뒤의 미래 시점까지 완료되는 일을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">will have been working\u003c/span> for the company for ten years by the end of this month.\u003c/div>\u003cdiv class=\"g-ko\">이번 달 말이면 나는 그 회사에서 십 년 동안 일한 것이 될 것이다.\u003c/div>\u003cdiv class=\"g-note\">미래의 한 시점까지 일이 계속 이어지므로 미래완료진행을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">by\u003c/b> 뒤에는 미래 시점 표현이 오고, \u003cb class=\"key\">by the time\u003c/b> 뒤에는 보통 현재시제가 와서 미래를 대신합니다.\u003c/div>","segs":[{"n":18,"text":"마지막으로 미래완료예요. 미래의 어떤 시점까지 계속되거나 완료되는 일은 will have에 과거분사를 붙여서 표현해요. 이때는 주로 by나 by the time과 함께 쓰여서 그 시점까지라는 의미를 만들어 줘요. 미래의 한 시점까지 계속 진행되고 있을 일은 will have been에 동사 ing를 붙여서 나타내요.","hl":"rule"},{"n":19,"text":"먼저 이 문장이에요. By next year, I will have graduated. 뜻은 내년이면 나는 졸업할 것이라는 거예요. 내년이라는 미래의 시점까지 졸업이 완료되는 일이니까 will have graduated를 썼어요.","hl":"ex-0"},{"n":20,"text":"다음 문장이에요. By the time they move abroad, they will have sold their house. 뜻은 그들이 해외로 이사할 때쯤이면 그들은 집을 팔았을 것이라는 거예요. by the time 뒤에 미래의 시점이 나오고, 그 시점까지 집을 파는 일이 끝나 있으니 will have sold를 쓴 거죠.","hl":"ex-1"},{"n":21,"text":"이 문장도 보세요. I will have been working for the company for ten years by the end of this month. 뜻은 이번 달 말이면 나는 그 회사에서 십 년 동안 일한 것이 된다는 거예요. 미래의 한 시점까지 일이 계속 이어지니까 will have been working을 썼어요.","hl":"ex-2"},{"n":22,"text":"by 뒤에는 미래 시점을 나타내는 표현이 오고, by the time 뒤에는 보통 현재시제가 와서 미래를 대신해요. 그래서 they move abroad처럼 현재시제가 쓰인 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>When I arrived, he already left.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ When I arrived, he had already left.\u003c/div>\u003cdiv class=\"g-why\">내가 도착한 과거 시점보다 그가 떠난 일이 먼저이므로 과거완료 had left를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>By next year, I will graduate from middle school.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ By next year, I will have graduated from middle school.\u003c/div>\u003cdiv class=\"g-why\">by next year라는 미래 시점까지 완료되는 일이므로 will have + p.p.를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I had been knowing him for five years.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I had known him for five years.\u003c/div>\u003cdiv class=\"g-why\">know는 상태를 나타내는 동사라 진행형으로 쓰지 않고 과거완료로 씁니다.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"첫 번째로 자주 나오는 실수예요. When I arrived, he already left라고 하면 두 일이 동시에 일어난 것처럼 들려요. 그가 떠난 일이 내가 도착한 일보다 먼저라면 he had already left라고 해야 자연스러워요.","hl":"mk-0"},{"n":24,"text":"두 번째 실수예요. by next year는 내년까지라는 미래의 시점을 보여 주죠. 그 시점까지 졸업이 끝나 있는 상황이니까 will graduate가 아니라 will have graduated라고 해야 해요.","hl":"mk-1"},{"n":25,"text":"세 번째 실수예요. know는 알고 있다는 상태를 나타내는 동사라서 진행형으로 쓰지 않아요. 그래서 had been knowing이 아니라 had known이라고 해야 해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">He ____ just finished reading the book when his parents came home.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>has\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>had\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>have\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>will have\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had\u003c/span>\u003cdiv class=\"g-exp\">부모님이 집에 온 과거 시점보다 책을 다 읽은 일이 먼저 일어났으므로 과거완료 had finished를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"첫 번째 문제예요. 빈칸에 들어갈 말로 알맞은 것을 고르세요. He, 빈칸, just finished reading the book when his parents came home. 보기는 첫 번째 has, 두 번째 had, 세 번째 have, 네 번째 will have예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 두 번째 보기인 had예요. 부모님이 집에 온 것은 과거의 일이고, 책을 다 읽은 일은 그보다 더 먼저 일어났죠. 그래서 과거완료 had finished가 되어야 해요. has는 기준 시점이 현재인 현재완료라서 여기에는 어울리지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 동사를 알맞은 형태로 바꾸어 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">The movie ____ (start) when she entered the theater.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had started\u003c/span>\u003cdiv class=\"g-exp\">그녀가 극장에 들어간 과거 시점보다 영화가 시작한 일이 먼저이므로 과거완료를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"두 번째 문제예요. 괄호 안의 동사를 알맞은 형태로 바꾸어 빈칸을 채워 보세요. The movie, 빈칸, start, when she entered the theater. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 had started예요. 그녀가 극장에 들어간 과거 시점보다 영화가 시작한 일이 먼저 일어났으니까 과거완료를 써야 해요. start의 과거분사는 started라서 had started가 되죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">By next year, I ____ from middle school.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u00
