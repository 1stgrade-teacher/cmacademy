":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The article will \u003cspan class=\"p-box\">\u003cspan>publish\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">be published\u003c/span>\u003c/span> in the next issue.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">publish\u003c/div>\u003cdiv class=\"p-op\">be published\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어와 조동사\u003c/b>주어 The article은 글이고, 조동사 \u003cb class=\"key\">will\u003c/b> 뒤가 문제예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">수동태 확인\u003c/b>기사는 \u003cb class=\"key\">발행되는\u003c/b> 대상이므로 조동사 뒤에 \u003cb class=\"key\">be + p.p.\u003c/b>가 필요해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>publish는 능동, be published는 \u003cb class=\"key\">조동사 수동\u003c/b>이라 정답은 be published예요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 be published\u003c/span>\u003cdiv class=\"p-full\">The article will be published in the next issue.\u003c/div>\u003cdiv class=\"p-ko\">그 기사는 다음 호에 발행될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>will 뒤에 과거분사만 쓰고 be를 빠뜨리기 쉬워요.\u003c/div>","segs":[{"n":7,"text":"먼저 주어 The article이 스스로 발행하는지, 발행되는 대상인지 보세요. 앞에 will이 있으니 조동사 뒤의 형태를 확인해야 해요.","hl":"st-0"},{"n":8,"text":"기사는 누군가에 의해 발행되는 대상이죠. 그래서 will 뒤에 be를 넣고 publish의 과거분사 published를 써야 해요.","hl":"st-1"},{"n":9,"text":"publish만 쓰면 기사가 직접 발행한다는 뜻이 되어 어색해요. be published가 자연스럽습니다.","hl":"st-2"},{"n":10,"text":"이 문제의 함정도 짚고 갈게요. will 뒤에 과거분사만 쓰고 be를 빠뜨리기 쉬워요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태 뒤 전치사 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be known to, be known for, be crowded with처럼 수동태 뒤에 오는 \u003cb class=\"key\">전치사 조합\u003c/b>을 통째로 익힌다.\u003cdiv>\u003cspan class=\"g-formula\">be known to 사람 / be known for 특징 / be crowded with 사람·것\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>known to 뒤에는 사람이 온다\u003c/li>\u003cli>known for 뒤에는 이유나 특징이 온다\u003c/li>\u003cli>crowded with는 '~로 붐비다'이다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The chef's name is \u003cspan class=\"fx\">known to\u003c/span> many cooks.\u003c/div>\u003cdiv class=\"g-ko\">그 요리사의 이름은 많은 요리사들에게 알려져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The city is \u003cspan class=\"fx\">crowded with\u003c/span> people.\u003c/div>\u003cdiv class=\"g-ko\">그 도시는 사람들로 붐빈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"known to는 사람에게 알려진, known for는 특징으로 유명한, crowded with는 사람이나 것으로 붐비는 표현이에요. 이 세 가지는 전치사까지 한 덩어리로 외워 두면 좋아요. 예를 들어 The chef's name is known to many cooks는 요리사의 이름이 많은 요리사들에게 알려져 있다는 뜻이에요. 전치사에 따라 뜻이 달라지니까 예문과 함께 익혀 두면 시험에서 바로 찾을 수 있어요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The chef's name is known \u003cspan class=\"p-box\">\u003cspan>to\u003c/span>\u003ci>/\u003c/i>\u003cspan>for\u003c/span>\u003c/span> many cooks in Europe.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to\u003c/div>\u003cdiv class=\"p-op\">for\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"두 번째 문제예요. known 뒤에 사람이 오는지 특징이 오는지 보고 전치사를 고르세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 to예요. many cooks처럼 사람에게 알려져 있다는 뜻이면 known to를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The chef's name is known \u003cspan class=\"p-box\">\u003cspan class=\"ok\">to\u003c/span>\u003ci>/\u003c/i>\u003cspan>for\u003c/span>\u003c/span> many cooks in Europe.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to\u003c/div>\u003cdiv class=\"p-op\">for\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">known 뒤 전치사\u003c/b>known은 '알려진'이고 뒤에 \u003cb class=\"key\">to\u003c/b>가 오면 '~에게 알려진'이 돼요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>many cooks는 \u003cb class=\"key\">사람\u003c/b>이므로 to가 자연스러워요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">for와 비교\u003c/b>for는 '~로 유명한'이라는 \u003cb class=\"key\">이유·특징\u003c/b>을 말할 때 써요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 to\u003c/span>\u003cdiv class=\"p-full\">The chef's name is known to many cooks in Europe.\u003c/div>\u003cdiv class=\"p-ko\">그 요리사의 이름은 유럽의 많은 요리사들에게 알려져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>known for를 사람에게 알려진 뜻으로 착각하는 실수\u003c/div>","segs":[{"n":15,"text":"known 뒤에 사람이 오면 보통 to를 써서 그 사람에게 알려져 있다는 뜻을 만들어요.","hl":"st-0"},{"n":16,"text":"many cooks는 사람들이죠. 그래서 to many cooks가 자연스러워요.","hl":"st-1"},{"n":17,"text":"for는 특징이나 이유를 말할 때 쓰는 전치사라서 여기 u003c/div>\u003cdiv class=\"p-ko\">나의 고장 난 컴퓨터는 지난주부터 수리받고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>since last week를 문장 앞에 두거나 has been 순서를 바꾸는 실수\u003c/div>","segs":[{"n":111,"text":"컴퓨터는 단수 주어이고 지난주부터 지금까지 이어진 일이라서 현재완료를 써요.","hl":"st-0"},{"n":112,"text":"현재완료 수동태는 has been 뒤에 과거분사를 붙여요.","hl":"st-1"},{"n":113,"text":"repair의 과거분사는 repaired이고, 지난주부터는 since last week로 표현해요.","hl":"st-2"},{"n":114,"text":"그래서 has been repaired since last week 순서로 배열하면 됩니다.","hl":"st-3"},{"n":115,"text":"이 문제의 함정도 짚고 갈게요. since last week를 문장 앞에 두거나 has been 순서를 바꾸는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">수동태: 기본, 진행, 완료, 조동사, 동사구\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>수동태는 \u003cb class=\"key\">be동사 + 과거분사\u003c/b>가 기본이고, 시제는 be동사에 나타낸다.\u003c/li>\u003cli>진행 수동은 \u003cb class=\"key\">be being + 과거분사\u003c/b>, 완료 수동은 \u003cb class=\"key\">have/has been + 과거분사\u003c/b>이다.\u003c/li>\u003cli>조동사 뒤 수동은 \u003cb class=\"key\">조동사 + be + 과거분사\u003c/b> 순서이다.\u003c/li>\u003cli>laugh at, look after처럼 전치사가 붙은 동사구는 수동태에서도 \u003cb class=\"key\">전치사를 남긴다\u003c/b>.\u003c/li>\u003cli>자동사는 수동태로 쓸 수 없고, 주어가 행위자이면 \u003cb class=\"key\">능동태\u003c/b>로 고친다.\u003c/li>\u003c/ul>","segs":[{"n":116,"text":"오늘의 핵심은 수동태를 만날 때 be동사와 과거분사의 짝을 먼저 찾는 거예요. 진행이면 being, 완료면 been, 조동사 뒤면 be를 넣는다는 점을 꼭 기억하세요. 동사구 수동태에서는 전치사를 빼먹지 않는 것도 잊지 마세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
