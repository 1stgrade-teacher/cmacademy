  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"Practice1","title":"4형식·5형식 문장의 수동태 완전 정복","audioDir":"practice1_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">그래마마스터 레벨3 챕터3 - Practice 01 4형식·5형식 문장의 수동태\u003c/div>\u003ch1>4형식·5형식 문장의 수동태 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적어가 두 개인 문장과 목적격 보어가 있는 문장을 수동태로 바꾸는 규칙을 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 수동태 중에서도 조금 특별한 문장들을 다뤄 볼 거예요. 목적어를 두 개 가진 4형식 문장, 그리고 목적격 보어가 따라오는 5형식 문장을 수동태로 바꾸는 방법이에요. 처음에는 형태가 낯설게 느껴질 수 있지만, 규칙만 정확히 알면 어렵지 않답니다. 오늘 수업이 끝나면 두 가지 형태의 수동태를 자유자재로 만들 수 있게 될 거예요. 자, 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">4형식 문장의 수동태 - 두 가지 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">4형식 문장은 목적어가 두 개이므로 \u003cb class=\"key\">간접목적어\u003c/b>와 \u003cb class=\"key\">직접목적어\u003c/b>를 각각 주어로 하여 두 가지 형태의 수동태를 만들 수 있다. 사람인 간접목적어가 주어가 되면 남은 직접목적어가 동사 뒤에 오고, 물건인 직접목적어가 주어가 되면 간접목적어 앞에 \u003cb class=\"key\">전치사\u003c/b>를 붙인다.\u003cdiv>\u003cspan class=\"g-formula\">간접목적어 + be동사 + p.p. + 직접목적어 / 직접목적어 + be동사 + p.p. + 전치사 + 간접목적어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Her grandmother \u003cspan class=\"fx\">gave her a golden necklace\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀의 할머니는 그녀에게 금목걸이를 주셨다.\u003c/div>\u003cdiv class=\"g-note\">her라는 사람 목적어와 a golden necklace라는 물건 목적어가 함께 있는 4형식 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">was given a golden necklace\u003c/span> by her grandmother.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 할머니에게 금목걸이를 받았다.\u003c/div>\u003cdiv class=\"g-note\">사람 목적어 her가 주어 She로 나간 형태로, 남은 직접목적어가 동사 뒤에 온다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">A golden necklace \u003cspan class=\"fx\">was given to her\u003c/span> by her grandmother.\u003c/div>\u003cdiv class=\"g-ko\">금목걸이가 그녀의 할머니에 의해 그녀에게 주어졌다.\u003c/div>\u003cdiv class=\"g-note\">물건 목적어가 주어가 되면 남은 간접목적어 앞에 to를 붙인다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>직접목적어가 주어인 수동태에서는 남은 간접목적어 앞에 \u003cb class=\"key\">to\u003c/b>를 쓰는 경우가 가장 많다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"4형식 문장은 목적어를 두 개 가지고 있는 문장이에요. 그래서 수동태로 바꿀 때 어느 목적어를 주어 자리로 보내느냐에 따라 두 가지 모습이 나옵니다. 사람 목적어를 주어로 세우면 간접목적어가 주어가 되고, 물건 목적어를 주어로 세우면 직접목적어가 주어가 돼요. 이때 남은 목적어는 동사 뒤에 그대로 남는다는 점을 꼭 기억해 주세요. 두 형태 모두 시험에 자주 나오니까 손으로 직접 써 보면서 익히면 좋아요.","hl":"rule"},{"n":3,"text":"먼저 이 문장을 봐요. Her grandmother gave her a golden necklace. 뜻은 그녀의 할머니가 그녀에게 금목걸이를 주셨다는 거예요. gave 뒤에 her와 a golden necklace, 목적어가 두 개 나란히 있죠. 이게 바로 4형식 문장의 모습이에요.","hl":"ex-0"},{"n":4,"text":"이번에는 사람 목적어인 her를 주어 자리로 보내 봤어요. She was given a golden necklace by her grandmother. 뜻은 그녀는 할머니에게 금목걸이를 받았다는 거예요. 주어가 사람이 되니까 남은 금목걸이가 동사 뒤에 그대로 남아 있는 걸 볼 수 있어요.","hl":"ex-1"},{"n":5,"text":"이번엔 반대로 물건 목적어를 주어로 세워 봤어요. A golden necklace was given to her by her grandmother. 뜻은 금목걸이가 할머니에 의해 그녀에게 주어졌다는 거예요. 금목걸이가 주어로 나갔기 때문에 남아 있는 her 앞에 to를 붙여 줘야 자연스러워요.","hl":"ex-2"},{"n":6,"text":"물건을 주어로 세울 때 남은 사람 앞에 전치사를 꼭 붙여야 한다는 점, 잊지 마세요. 대부분은 to를 쓴다고 생각해 두면 훨씬 편해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">전치사 to, for, of의 구분과 주의할 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">직접목적어가 주어인 수동태에서 대부분의 \u003cb class=\"key\">수여동사\u003c/b>(give, send, show, bring, teach 등)는 간접목적어 앞에 \u003cb class=\"key\">to\u003c/b>를 쓰지만 make, buy, get, cook, choose 등은 \u003cb class=\"key\">for\u003c/b>를, ask, require 등은 \u003cb class=\"key\">of\u003c/b>를 쓴다. 또한 buy, write, cook, make, find 등은 직접목적어만을 수동태의 주어로 쓸 수 있다.\u003cdiv>\u003cspan class=\"g-formula\">직접목적어 + be동사 + p.p. + to / for / of + 간접목적어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The scientist \u003cspan class=\"fx\">showed me a good sample\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 과학자는 내게 좋은 견본을 보여 주었다.\u003c/div>\u003cdiv class=\"g-note\">show는 to를 쓰는 대표적인 수여동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Some cookies \u003cspan class=\"fx\">were made for her daughter\u003c/span> by Jane.\u003c/div>\u003cdiv class=\"g-ko\">제인에 의해 그녀의 딸을 위한 쿠키가 만들어졌다.\u003c/div>\u003cdiv class=\"g-note\">make는 간접목적어 앞에 for를 쓰는 동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Different questions \u003cspan class=\"fx\">were asked of me\u003c/span> by many students.\u003c/div>\u003cdiv class=\"g-ko\">많은 학생들에 의해 내게 여러 가지 질문이 이루어졌다.\u003c/div>\u003cdiv class=\"g-note\">ask는 전치사 of를 쓰는 동사이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">This new laptop \u003cspan class=\"fx\">was bought for me\u003c/span> by Cathy.\u003c/div>\u003cdiv class=\"g-ko\">이 새 노트북은 캐시에 의해 나를 위해 구입되었다.\u003c/div>\u003cdiv class=\"g-note\">buy는 직접목적어만 수동태의 주어로 쓸 수 있어 사람을 주어로 한 수동태는 틀린다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>buy, write, cook, make, find는 사람을 주어로 하는 수동태로 쓰지 않으니 \u003cb class=\"key\">직접목적어\u003c/b>만 주어로 쓰세요.\u003c/div>","segs":[{"n":7,"text":"물건 목적어를 주어로 세울 때 남는 사람 앞에 어떤 전치사를 쓰느냐가 중요한 포인트예요. 대부분의 수여동사는 to를 쓰지만, 만들어 주거나 사 주는 느낌의 동사들은 for를 씁니다. 그리고 묻다, 요구하다라는 동사들은 of를 써요. 또 하나, buy나 make 같은 동사는 사람을 주어로 하는 수동태로는 쓰지 않는다는 점도 꼭 기억해 주세요.","hl":"rule"},{"n":8,"text":"The scientist showed me a good sample. 이 문장은 그 과학자가 내게 좋은 견본을 보여 주었다는 뜻이에요. show는 to를 쓰는 대표적인 동사라서, 물건을 주어로 세우면 A good sample was shown to me by the scientist. 이렇게 to me가 됩니다.","hl":"ex-0"},{"n":9,"text":"Jane made her daughter some cookies. 이 문장을 수동태로 바꾸면 Some cookies were made for her daughter by Jane. 이 돼요. 만들어 주는 느낌의 동사 make는 사람 앞에 for를 쓴다는 것, 꼭 기억해 두세요.","hl":"ex-1"},{"n":10,"text":"Many students asked me different questions. 이 문장에서 물건인 질문을 주어로 보내면 Different questions were asked of me by many students. 가 돼요. 묻다라는 뜻의 ask는 사람 앞에 of를 쓴다는 점이 조금 특별하죠.","hl":"ex-2"},{"n":11,"text":"Cathy bought me this new laptop. 이 문장을 수동태로 바꾸면 This new laptop was bought for me by Cathy. 예요. 그런데 여기서 I was bought this new laptop by Cathy. 라고 쓰면 틀려요. buy는 물건만 주어로 세울 수 있는 동사거든요.","hl":"ex-3"},{"n":12,"text":"사람을 주어 자리에 세우고 싶은 마음이 들 때가 있는데, buy나 make는 그게 안 되는 동사예요. 이 동사들은 물건만 주어로 세운다고 외워 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">5형식 문장의 수동태 - 목적격 보어는 그대로\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">5형식 문장은 \u003cb class=\"key\">목적어\u003c/b>만 수동태의 주어로 쓸 수 있으며, 목적격 보어인 형용사, 명사, 분사, \u003cb class=\"key\">to부정사\u003c/b>는 형태 변화 없이 그대로 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">목적어 + be동사 + p.p. + 목적격 보어 (그대로)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My room \u003cspan class=\"fx\">was kept clean\u003c/span> by my mother.\u003c/div>\u003cdiv class=\"g-ko\">내 방은 어머니에 의해 깨끗하게 유지되었다.\u003c/div>\u003cdiv class=\"g-note\">목적격 보어인 형용사 clean이 형태 변화 없이 그대로 남는다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was asked to write down\u003c/span> my name and phone number by her.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀에 의해 내 이름과 전화번호를 적으라는 요청을 받았다.\u003c/div>\u003cdiv class=\"g-note\">목적격 보어인 to부정사가 그대로 유지된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>5형식 수동태에서는 \u003cb class=\"key\">목적어\u003c/b>만 주어가 되고 목적격 보어는 자리만 옮겨질 뿐 \u003cb class=\"key\">형태 변화\u003c/b>가 없다는 점을 기억하세요.\u003c/div>","segs":[{"n":13,"text":"5형식 문장은 목적어 뒤에 목적격 보어가 따라오는 문장이에요. 이때 수동태로 바꾸면 목적어만 주어 자리로 올라가고, 목적격 보어는 모양을 바꾸지 않고 그대로 남습니다. 형용사든 명사든 분사든 to부정사든 모두 그대로 쓰인다는 게 핵심이에요. 너무 복잡하게 생각하지 말고 목적어만 앞으로 올린다고 기억해 주세요.","hl":"rule"},{"n":14,"text":"My mother kept my room clean. 이 문장은 어머니가 내 방을 깨끗하게 유지하셨다는 뜻이에요. 수동태로 바꾸면 My room was kept clean by my mother. 가 되고, 형용사 clean은 그대로 자리를 지키고 있어요.","hl":"ex-0"},{"n":15,"text":"She asked me to write down my name and phone number. 이 문장을 수동태로 바꾸면 I was asked to write down my name and phone number by her. 예요. 목적격 보어였던 to write down 이하가 그대로 따라오는 걸 확인해 보세요.","hl":"ex-1"},{"n":16,"text":"목적격 보어까지 손대려고 하면 실수가 생겨요. 목적어만 앞으로 올린다고 생각하면 훨씬 간단해집니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">지각동사와 사역동사의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">지각동사의 목적격 보어로 쓰인 \u003cb class=\"key\">원형부정사\u003c/b>는 수동태에서 \u003cb class=\"key\">현재분사\u003c/b>나 to부정사로 바뀌고, 사역동사는 make만 수동태로 쓰이며 원형부정사가 \u003cb class=\"key\">to부정사\u003c/b>로 바뀐다. 목적격 보어가 분사인 경우에는 형태 변화 없이 그대로 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">지각동사: 원형부정사 → 현재분사 / to부정사 · 사역동사 make: 원형부정사 → to부정사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A man \u003cspan class=\"fx\">was seen leaving\u003c/span>[to leave] the building late at night by the police.\u003c/div>\u003cdiv class=\"g-ko\">한 남자가 늦은 밤에 경찰에 의해 그 건물을 떠나는 것이 목격되었다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 see의 목적격 보어 원형부정사 leave가 현재분사나 to부정사로 바뀐다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was made to find\u003c/span> treasure in the backyard by Joe.\u003c/div>\u003cdiv class=\"g-ko\">나는 조에 의해 뒷마당에서 보물을 찾게 되었다.\u003c/div>\u003cdiv class=\"g-note\">사역동사 make의 목적격 보어 원형부정사가 to부정사로 바뀐다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">A little girl \u003cspan class=\"fx\">was seen skating\u003c/span> on the ice by us.\u003c/div>\u003cdiv class=\"g-ko\">한 어린 소녀가 우리에 의해 얼음 위에서 스케이트를 타는 것이 보였다.\u003c/div>\u003cdiv class=\"g-note\">목적격 보어가 분사인 경우에는 수동태에서도 형태 변화가 없다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>지각동사·사역동사의 목적격 보어가 \u003cb class=\"key\">분사\u003c/b>인 경우에는 수동태로 바꿔도 \u003cb class=\"key\">형태 변화\u003c/b>가 없다는 점을 구별해서 기억하세요.\u003c/div>","segs":[{"n":17,"text":"지각동사와 사역동사는 목적격 보어로 동사원형을 데려오는 동사들이에요. 그런데 수동태가 되면 동사원형이 그대로 있을 수 없어서 모습을 바꿉니다. 지각동사는 현재분사나 to부정사로, 사역동사 make는 to부정사로 바뀌어요. 다만 원래 목적격 보어가 분사였다면 아무 변화 없이 그대로 남는다는 것도 함께 기억해 주세요.","hl":"rule"},{"n":18,"text":"The police saw a man leave the building late at night. 이 문장을 수동태로 바꾸면 A man was seen leaving the building late at night by the police. 가 돼요. 원래 leave였던 동사원형이 leaving이나 to leave로 바뀐다는 점이 핵심이에요.","hl":"ex-0"},{"n":19,"text":"Joe made me find treasure in the backyard. 이 문장을 수동태로 바꾸면 I was made to find treasure in the backyard by Joe. 예요. 사역동사 중에서 make만 수동태로 쓸 수 있고, find가 to find로 바뀌는 걸 꼭 기억해 주세요.","hl":"ex-1"},{"n":20,"text":"We saw a little girl skating on the ice. 이 문장을 수동태로 바꾸면 A little girl was seen skating on the ice by us. 가 돼요. 처음부터 분사인 skating이었기 때문에 수동태가 되어도 모양이 그대로 유지된답니다.","hl":"ex-2"},{"n":21,"text":"분사가 이미 들어 있으면 손댈 필요가 없어요. 동사원형일 때만 모양이 바뀐다고 생각하면 헷갈리지 않아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was bought this new laptop by Cathy.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ This new laptop was bought for me by Cathy.\u003c/div>\u003cdiv class=\"g-why\">buy는 직접목적어만 수동태의 주어로 쓸 수 있어 사람을 주어로 하는 수동태로는 쓰지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>A man was seen leave the building late at night by the police.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ A man was seen leaving the building late at night by the police.\u003c/div>\u003cdiv class=\"g-why\">지각동사의 목적격 보어로 쓰인 원형부정사는 수동태에서 현재분사나 to부정사로 바뀐다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was made find treasure in the backyard by Joe.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I was made to find treasure in the backyard by Joe.\u003c/div>\u003cdiv class=\"g-why\">사역동사 make의 목적격 보어로 쓰인 원형부정사는 수동태에서 to부정사로 바뀐다.\u003c/div>\u003c/div>","segs":[{"n":22,"text":"buy는 사람을 주어 자리에 세울 수 없는 동사예요. 그래서 I was bought라고 쓰면 틀리고, 물건인 This new laptop을 주어로 세워서 This new laptop was bought for me by Cathy. 라고 해야 해요.","hl":"mk-0"},{"n":23,"text":"지각동사가 수동태가 되면 동사원형이 그대로 남을 수 없어요. leave를 leaving이나 to leave로 바꿔 주어야 하고, 그냥 leave라고 쓰면 틀린 문장이 됩니다.","hl":"mk-1"},{"n":24,"text":"사역동사 make가 수동태가 되면 뒤에 오는 동사원형 앞에 to를 꼭 붙여야 해요. 그래서 I was made to find treasure in the backyard by Joe. 가 맞는 문장이에요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장을 수동태로 바꿀 때 올바른 것은?\u003c/div>\u003cdiv class=\"g-qs\">Her grandmother gave her a golden necklace.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>She was given a golden necklace by her grandmother.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>She was gave a golden necklace by her grandmother.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>A golden necklace was given her by her grandmother.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>A golden necklace was given for her by her grandmother.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She was given a golden necklace by her grandmother.\u003c/span>\u003cdiv class=\"g-exp\">사람 목적어 her를 주어로 하면 She was given이 되고, 남은 직접목적어 a golden necklace가 동사 뒤에 온다. 직접목적어가 주어일 때 give는 전치사 to를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"자, 첫 번째 문제는 객관식이에요. 그녀의 할머니가 그녀에게 금목걸이를 주셨다는 문장을 수동태로 바꾸면 어떻게 될까요? 보기를 하나씩 읽어 보고 직접 골라 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 첫 번째 보기예요. She was given a golden necklace by her grandmother. 사람 목적어인 her가 주어 자리로 나가면서 She was given이 된 거예요. 나머지 보기는 동사 형태가 틀렸거나 전치사 to 대신 for를 써서 답이 될 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장을 수동태로 바꿀 때 빈칸에 알맞은 전치사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Some cookies were made ____ her daughter by Jane.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">for\u003c/span>\u003cdiv class=\"g-exp\">make는 직접목적어가 주어인 수동태에서 간접목적어 앞에 for를 쓰는 동사이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"이번에는 빈칸 문제예요. Jane made her daughter some cookies. 이 문장을 수동태로 바꾸면 Some cookies were made, 그다음 빈칸, her daughter by Jane. 이 됩니다. 빈칸에 들어갈 전치사가 무엇일지 잠시 멈추고 생각해 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 for예요. make는 만들어 주는 느낌의 동사라서 간접목적어 앞에 for를 씁니다. 그래서 Some cookies were made for her daughter by Jane. 이렇게 완성돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I was bought this new laptop by Cathy.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">This new laptop was bought for me by Cathy.\u003c/span>\u003cdiv class=\"g-exp\">buy는 직접목적어만 수동태의 주어로 쓸 수 있으므로 물건인 this new laptop이 주어가 되어야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"세 번째 문제는 오류 수정이에요. I was bought this new laptop by Cathy. 이 문장에는 틀린 부분이 하나 숨어 있어요. 어디가 잘못됐는지 찾아서 바르게 고쳐 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"buy는 사람을 주어로 세울 수 없는 동사예요. 그래서 물건인 this new laptop을 주어로 올려서 This new laptop was bought for me by Cathy. 라고 고쳐야 해요. 전치사도 to가 아니라 for라는 점을 함께 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어를 알맞게 배열하여 수동태 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">asked / I / different questions / was / by many students\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I was asked different questions by many students.\u003c/span>\u003cdiv class=\"g-exp\">사람 목적어 me가 주어 I로 바뀌고, 남은 직접목적어 different questions가 동사 뒤에 온다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"네 번째 문제는 배열이에요. 주어진 단어들을 알맞은 순서로 늘어놓아 수동태 문장을 만들어 보세요. 주어가 무엇이 되어야 하는지부터 생각하면 쉬울 거예요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 I was asked different questions by many students. 예요. 원래 문장에서 사람 목적어였던 me가 주어 I로 올라가고, 질문이라는 목적어가 뒤에 그대로 남았어요. ask는 이렇게 사람을 주어로 세우는 형태도 쓸 수 있답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장을 수동태로 바꿀 때 올바른 것은?\u003c/div>\u003cdiv class=\"g-qs\">The police saw a man leave the building late at night.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>A man was seen leave the building late at night by the police.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>A man was seen leaving the building late at night by the police.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>A man saw leaving the building late at night by the police.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>A man was seen to leaving the building late at night by the police.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">A man was seen leaving the building late at night by the police.\u003c/span>\u003cdiv class=\"g-exp\">지각동사 see의 목적격 보어로 쓰인 원형부정사 leave는 수동태에서 현재분사 leaving이나 to부정사 to leave로 바뀐다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"다섯 번째 문제예요. 경찰이 한 남자가 건물을 떠나는 것을 목격했다는 문장을 수동태로 바꾸려고 해요. 지각동사가 들어 있으니 목적격 보어가 어떻게 변할지 생각하면서 골라 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 두 번째 보기예요. A man was seen leaving the building late at night by the police. 지각동사의 목적격 보어였던 원형부정사 leave가 현재분사 leaving으로 바뀐 거예요. 첫 번째 보기처럼 leave를 그대로 두거나, 네 번째 보기처럼 to와 ing를 같이 쓰면 틀려요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 5형식 문장의 수동태로 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">조는 나에게 뒷마당에서 보물을 찾게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I was made to find treasure in the backyard by Joe.\u003c/span>\u003cdiv class=\"g-exp\">사역동사 make의 목적격 보어 원형부정사 find는 수동태에서 to find로 바뀐다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"마지막 문제는 영작이에요. 조는 나에게 뒷마당에서 보물을 찾게 했다는 문장을 수동태로 만들어 보세요. 사역동사 make가 들어 있다는 점을 꼭 염두에 두고 써 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":6},{"n":42,"text":"정답은 I was made to find treasure in the backyard by Joe. 예요. 사역동사 make는 수동태로 쓸 수 있고, 목적격 보어였던 find 앞에 to를 붙여서 to find로 바꿔 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">그래마마스터 레벨3 챕터3 - Practice 01 4형식·5형식 문장의 수동태\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>4형식 문장은 \u003cb class=\"key\">간접목적어\u003c/b>와 \u003cb class=\"key\">직접목적어\u003c/b>를 각각 주어로 하여 두 가지 수동태를 만들 수 있다.\u003c/li>\u003cli>직접목적어가 주어일 때 give, send, show 등은 \u003cb class=\"key\">to\u003c/b>, make, buy는 \u003cb class=\"key\">for\u003c/b>, ask는 of를 쓴다.\u003c/li>\u003cli>buy, write, cook, make, find는 \u003cb class=\"key\">직접목적어\u003c/b>만 수동태의 주어로 쓸 수 있다.\u003c/li>\u003cli>5형식 문장은 \u003cb class=\"key\">목적어\u003c/b>만 주어가 되고 목적격 보어는 형태 변화 없이 그대로 남는다.\u003c/li>\u003cli>지각동사와 사역동사 make의 \u003cb class=\"key\">원형부정사\u003c/b>는 수동태에서 현재분사나 \u003cb class=\"key\">to부정사\u003c/b>로 바뀐다.\u003c/li>\u003c/ul>","segs":[{"n":43,"text":"오늘은 두 가지 큰 내용을 배웠어요. 먼저 4형식 문장은 목적어가 두 개라서 어느 쪽을 주어로 세우느냐에 따라 수동태가 두 가지로 만들어진다는 점, 그리고 남은 사람 앞에 to나 for, of를 붙인다는 점을 기억해 주세요. 다음으로 5형식 문장은 목적어만 주어로 올라가고 목적격 보어는 그대로 남는다는 것도 배웠어요. 지각동사와 사역동사 make는 동사원형이 현재분사나 to부정사로 바뀐다는 것까지 정리하면 오늘 내용은 완벽합니다. 여기까지 열심히 따라온 여러분, 정말 수고 많았어요. 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
