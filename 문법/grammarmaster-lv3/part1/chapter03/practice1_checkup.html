  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Practice1 Check Up","title":"그래마마스터 레벨3 Chapter02 수동태 문제풀이","audioDir":"practice1_checkup_audio","preview":false,"count":115,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">수동태와 목적격 보어(지각동사·사역동사·to부정사·4형식)\u003c/div>\u003ch1>그래마마스터 레벨3 Chapter02 수동태 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>15문제 · 양자택일, 빈칸 채우기(보기 활용), 틀린 부분 고치기, 동일 의미 문장 완성\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 수동태와 목적격 보어가 함께 나오는 문제들을 풀어 볼 거예요. 지각동사, 사역동사, to부정사를 쓰는 동사, 목적어가 두 개인 문형까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태의 기본 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태는 \u003cb class=\"key\">be + 과거분사(p.p.)\u003c/b>로 만들고, 행위자는 보통 \u003cb class=\"key\">by + 목적격\u003c/b>으로 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + be + p.p. (+ by 행위자)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사가 시제와 수일치를 담당한다.\u003c/li>\u003cli>과거분사는 동사 뒤에 그대로 붙인다.\u003c/li>\u003cli>행위자가 중요하지 않으면 by 이하는 생략할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The window was broken by the boy.\u003c/div>\u003cdiv class=\"g-ko\">그 창문은 소년에 의해 깨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The letters are delivered every morning.\u003c/div>\u003cdiv class=\"g-ko\">그 편지들은 매일 아침 배달된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"수동태는 행동을 당하는 대상을 주어로 세우는 표현이에요. 이때 동사는 be동사와 과거분사로 만들고, be동사가 시제와 수일치를 담당해요. 행위자를 말하고 싶으면 by를 붙여서 뒤에 놓으면 됩니다. 예를 들어 the window was broken by the boy라고 하면 창문이 소년에 의해 깨진 것이죠. 그래서 수동태 문제에서는 주어가 단수인지 복수인지, 시제가 언제인지부터 확인해야 해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">지각동사의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">see/hear/watch + 목적어 + 동사원형·현재분사 → 수동태에서는 \u003cb class=\"key\">be seen/heard/watched + to부정사 또는 현재분사\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">목적어 + be + seen/heard/watched + to V / V-ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>수동태 뒤에 동사원형만 쓰면 틀린다.\u003c/li>\u003cli>hear somebody shout → somebody is heard to shout\u003c/li>\u003cli>see somebody entering → somebody is seen entering\u003c/li>\u003cli>watch somebody hit → somebody is watched to hit/hitting\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The man \u003cspan class=\"fx\">was seen entering\u003c/span> the building.\u003c/div>\u003cdiv class=\"g-ko\">그 남자는 건물에 들어가고 있는 것이 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">was heard to sing\u003c/span> in the room.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 방에서 노래하는 것이 들렸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"see, hear, watch 같은 지각동사는 목적어 뒤에 동사원형이나 현재분사를 쓸 수 있어요. 그런데 이 문장이 수동태가 되면 동사원형만 덩그러니 쓰지는 못하고 to부정사나 현재분사로 바꿔 줘야 해요. 예를 들어 hear somebody shout는 somebody is heard to shout가 됩니다. 시험에서는 수동태 뒤에 to가 살아나는지, 아니면 현재분사가 오는지를 꼭 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The suspect was seen \u003cspan class=\"p-box\">\u003cspan>enter\u003c/span>\u003ci>/\u003c/i>\u003cspan>entering\u003c/span>\u003c/span> the building late at night.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">enter\u003c/div>\u003cdiv class=\"p-op\">entering\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">entering\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":4,"text":"첫 번째 문제예요. was seen 뒤에 어떤 형태가 와야 하는지, see의 수동태라는 점을 먼저 보세요.","hl":"q"},{"n":5,"text":"","hl":"q","pause":7},{"n":6,"text":"정답은 entering이에요. see의 수동태 뒤에는 동사원형만 쓰지 못하고 to부정사나 현재분사가 오는데, 여기서는 건물에 들어가고 있는 상황이라 entering이 자연스러워요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The suspect was seen \u003cspan class=\"p-box\">\u003cspan>enter\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">entering\u003c/span>\u003c/span> the building late at night.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">enter\u003c/div>\u003cdiv class=\"p-op\">entering\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">수동태 확인\u003c/b>was seen은 see의 수동태이므로 뒤에는 \u003cb class=\"key\">to부정사 또는 현재분사\u003c/b>가 와야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 비교\u003c/b>enter는 동사원형이라 수동태 뒤에 바로 쓸 수 없고, entering은 현재분사라 자연스러워요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">의미 확인\u003c/b>용의자가 건물에 \u003cb class=\"key\">들어가고 있는\u003c/b> 장면이 보였다는 뜻이므로 entering이 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 entering\u003c/span>\u003cdiv class=\"p-full\">The suspect was seen entering the building late at night.\u003c/div>\u003cdiv class=\"p-ko\">그 용의자는 늦은 밤에 그 건물에 들어가고 있는 것이 목격되었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>was seen 뒤에 동사원형 enter를 그대로 쓰는 것\u003c/div>","segs":[{"n":7,"text":"was seen은 see의 수동태예요. 이때 뒤에는 동사원형만 쓰지 못하고 to부정사나 현재분사가 와요.","hl":"st-0"},{"n":8,"text":"enter는 동사원형이라서 was seen 뒤에 바로 쓰면 어색해요. entering은 현재분사라서 자연스럽게 올 수 있어요.","hl":"st-1"},{"n":9,"text":"용의자가 건물에 들어가고 있는 장면이 보였다는 뜻이니까 entering이 알맞아요.","hl":"st-2"},{"n":10,"text":"이 문제의 함정도 짚고 갈게요. was seen 뒤에 동사원형 enter를 그대로 쓰는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사를 취하는 동사의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">ask/expect/advise/allow + 목적어 + to V → 수동태에서는 \u003cb class=\"key\">be asked/expected/advised/allowed + to V\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">목적어 + be + p.p. + to V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>수동태가 되어도 to부정사가 그대로 남는다.\u003c/li>\u003cli>ask somebody to do → be asked to do\u003c/li>\u003cli>expect somebody to do → be expected to do\u003c/li>\u003cli>allow somebody to do → be allowed to do\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">was asked to wait\u003c/span> outside.\u003c/div>\u003cdiv class=\"g-ko\">그는 밖에서 기다려 달라는 요청을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Students \u003cspan class=\"fx\">are allowed to use\u003c/span> the library.\u003c/div>\u003cdiv class=\"g-ko\">학생들은 도서관을 이용하는 것이 허용된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"ask, expect, advise, allow는 목적어 뒤에 to부정사를 데리고 오는 동사들이에요. 이 동사들이 수동태가 되어도 to부정사는 그대로 남습니다. 그래서 be asked to do, be expected to do, be advised to do, be allowed to do 형태가 되죠. 동사원형만 쓰거나 동명사를 쓰면 틀리기 쉬우니 to를 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The new professor was asked \u003cspan class=\"p-box\">\u003cspan>explain\u003c/span>\u003ci>/\u003c/i>\u003cspan>to explain\u003c/span>\u003c/span> his theory.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">explain\u003c/div>\u003cdiv class=\"p-op\">to explain\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to explain\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"두 번째 문제예요. was asked 뒤에 to가 필요한지, ask가 어떤 형태를 취하는지 생각해 보세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 to explain이에요. ask somebody to do 형태가 수동태가 되면 be asked to do로 to부정사가 그대로 남아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>다음 괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The new professor was asked \u003cspan class=\"p-box\">\u003cspan>explain\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">to explain\u003c/span>\u003c/span> his theory.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">explain\u003c/div>\u003cdiv class=\"p-op\">to explain\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">수동태 동사 확인\u003c/b>was asked는 ask의 수동태예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ask의 문형\u003c/b>ask + 목적어 + \u003cb class=\"key\">to부정사\u003c/b> → 수동태에서도 to부정사가 남아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>explain은 원형이라 틀리고 to explain이 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 to explain\u003c/span>\u003cdiv class=\"p-full\">The new professor was asked to explain his theory.\u003c/div>\u003cdiv class=\"p-ko\">새 교수님은 자신의 이론을 설명해 달라는 요청을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ask의 수동태 뒤에서 to를 빼먹는 것\u003c/div>","segs":[{"n":15,"text":"was asked는 ask의 수동태예요. ask가 수동태로 바뀐 문장이라는 점을 먼저 잡아요.","hl":"st-0"},{"n":16,"text":"ask는 목적어 뒤에 to부정사를 쓰는 동사예요. 수동태가 되어도 to부정사가 그대로 남습니다.","hl":"st-1"},{"n":17,"text":"explain은 동사원형이라서 뒤에 바로 올 수 없고, to explain이 되어야 해요.","hl":"st-2"},{"n":18,"text":"이 문제의 함정도 짚고 갈게요. ask의 수동태 뒤에서 to를 빼먹는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">4형식 동사의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">give/send/buy/make/ask + 간접목적어 + 직접목적어 → 직접목적어를 주어로 하면 \u003cb class=\"key\">be + p.p. + to/for/of + 간접목적어\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">직접목적어 + be + p.p. + to/for/of + 간접목적어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>give/send는 to를 쓴다.\u003c/li>\u003cli>buy/make는 for를 쓴다.\u003c/li>\u003cli>ask는 of를 쓴다.\u003c/li>\u003cli>간접목적어를 주어로 하는 수동태는 어색한 경우가 많다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A letter was sent to her.\u003c/div>\u003cdiv class=\"g-ko\">그녀에게 편지가 보내졌다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">A cake was made for him.\u003c/div>\u003cdiv class=\"g-ko\">그를 위해 케이크가 만들어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">A question was asked of the teacher.\u003c/div>\u003cdiv class=\"g-ko\">선생님에게 질문이 이루어졌다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"give, send, buy, make, ask처럼 목적어가 두 개 있는 문형은 수동태로 바꿀 때 직접목적어를 주어로 세우는 경우가 많아요. 이때 간접목적어 앞에는 동사에 따라 to, for, of를 골라 씁니다. give와 send는 to, buy와 make는 for, ask는 of를 쓴다고 묶어서 기억하면 편해요. 예를 들어 send somebody something은 something was sent to somebody가 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 15\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u00 ,"segs":[{"n":111,"text":"능동문은 keep 다음에 목적어 the front door, 그 뒤에 형용사 open이 오는 구조예요.","hl":"st-0"},{"n":112,"text":"목적어 the front door를 주어로 세우고 keep은 was kept로 바꿔요.","hl":"st-1"},{"n":113,"text":"형용사 open은 그대로 두고, 회의 동안이라는 말과 행위자 by the manager를 붙입니다.","hl":"st-2"},{"n":114,"text":"이 문제의 함정도 짚고 갈게요. open을 to open으로 바꾸는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">수동태와 목적격 보어(지각동사·사역동사·to부정사·4형식)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>지각동사 수동태는 \u003cb class=\"key\">be seen/heard/watched + to부정사 또는 현재분사\u003c/b>로 쓴다.\u003c/li>\u003cli>ask/expect/advise/allow의 수동태는 \u003cb class=\"key\">be + p.p. + to부정사\u003c/b> 형태이다.\u003c/li>\u003cli>4형식 수동태는 \u003cb class=\"key\">to/for/of + 간접목적어\u003c/b>를 쓰며 give/send는 to, buy/make는 for, ask는 of이다.\u003c/li>\u003cli>make 사역동사 수동태는 \u003cb class=\"key\">be made to + 동사원형\u003c/b>, keep + 목적어 + 형용사 수동태는 \u003cb class=\"key\">be kept + 형용사\u003c/b>이다.\u003c/li>\u003c/ul>","segs":[{"n":115,"text":"오늘은 수동태에서 목적격 보어와 전치사가 어떻게 달라지는지 정리했어요. 지각동사와 사역동사는 수동태가 되면 to가 살아나는 경우가 많고, 목적어가 두 개인 문형은 동사에 따라 to, for, of를 골라야 해요. 이 기준만 기억하면 시험에서 형태를 고르는 문제는 쉽게 풀 수 있어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
