  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

lecturePlayer(document.getElementById("app"),{"brand":"Practice2","title":"주의해야 할 수동태 완전 정복","audioDir":"practice2_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">그래마마스터 레벨3 Chapter03 주의해야 할 수동태\u003c/div>\u003ch1>주의해야 할 수동태 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>진행형·완료형, 조동사, 동사구, by 이외의 전치사를 쓰는 수동태의 형태를 이해하고 문장에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요? 오늘은 그래마마스터 레벨 삼 챕터 삼에서 주의해야 할 수동태를 공부해요. 이미 배운 수동태가 진행형, 완료형, 조동사, 동사구, 그리고 by가 아닌 전치사와 만나면 어떻게 달라지는지 예문으로 함께 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">진행형·완료형 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">진행형 수동태는 \u003cb class=\"key\">be동사 + being + p.p.\u003c/b> 형태로 써요. 현재완료 수동태는 \u003cb class=\"key\">have been + p.p.\u003c/b> 또는 \u003cb class=\"key\">has been + p.p.\u003c/b>로 쓰고, 과거완료 수동태는 \u003cb class=\"key\">had been + p.p.\u003c/b>로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">be + being + p.p. / have[has] been + p.p. / had been + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">More than 6,000 languages \u003cspan class=\"fx\">are being spoken\u003c/span> today.\u003c/div>\u003cdiv class=\"g-ko\">오늘날 6,000개가 넘는 언어가 사용되고 있다.\u003c/div>\u003cdiv class=\"g-note\">be동사 뒤에 being이 와서 지금 진행 중인 수동태를 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Our website \u003cspan class=\"fx\">has been updated\u003c/span> since last year.\u003c/div>\u003cdiv class=\"g-ko\">우리 웹사이트는 작년부터 업데이트되었다.\u003c/div>\u003cdiv class=\"g-note\">현재완료 수동태는 have[has] been + p.p. 형태로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">This tree \u003cspan class=\"fx\">had been burned\u003c/span> when I saw it.\u003c/div>\u003cdiv class=\"g-ko\">내가 그 나무를 보았을 때 그것은 이미 불에 타 있었다.\u003c/div>\u003cdiv class=\"g-note\">과거완료 수동태는 had been + p.p. 형태로, 과거보다 더 이전 일을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>진행형은 \u003cb class=\"key\">being\u003c/b>, 완료형은 \u003cb class=\"key\">been\u003c/b>을 꼭 넣어야 해요.\u003c/div>","segs":[{"n":2,"text":"먼저 진행형과 완료형 수동태를 볼게요. 진행형 수동태는 be동사 뒤에 being을 넣고 과거분사를 붙여서 be being p.p. 형태로 만들어요. 현재완료 수동태는 have나 has 뒤에 been을 넣고 과거분사를 붙여요. 과거완료 수동태는 had been 뒤에 과거분사를 붙이면 됩니다. 예문으로 확인해 볼까요?","hl":"rule"},{"n":3,"text":"More than six thousand languages are being spoken today. 오늘날 육천 개가 넘는 언어가 사용되고 있다는 뜻이에요. are being spoken이 진행형 수동태로, 지금 사용되는 중이라는 느낌을 줍니다.","hl":"ex-0"},{"n":4,"text":"Our website has been updated since last year. 우리 웹사이트는 작년부터 업데이트되었다는 뜻이에요. has been updated가 현재완료 수동태로, 과거부터 지금까지 이어진 상태를 나타냅니다.","hl":"ex-1"},{"n":5,"text":"This tree had been burned when I saw it. 내가 그 나무를 보았을 때 그것은 이미 불에 타 있었다는 뜻이에요. had been burned가 과거완료 수동태로, 내가 본 시점보다 더 이전에 불탄 상태였음을 보여 줍니다.","hl":"ex-2"},{"n":6,"text":"진행형 수동태에서는 being을 빼먹지 않는 것이 중요해요. 완료형 수동태에서는 been을 꼭 넣어야 하고요. being과 been이 헷갈릴 수 있으니 소리 내어 여러 번 읽어 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">조동사가 있는 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사가 있는 문장의 수동태는 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b> 형태로 써요. 조동사 뒤에는 항상 \u003cb class=\"key\">be동사 원형\u003c/b>이 오고, 그 뒤에 \u003cb class=\"key\">과거분사\u003c/b>가 와요.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The exhibition \u003cspan class=\"fx\">will be opened\u003c/span> to the public.\u003c/div>\u003cdiv class=\"g-ko\">그 전시회는 대중에게 공개될 것이다.\u003c/div>\u003cdiv class=\"g-note\">조동사 will 뒤에 be가 오고 과거분사 opened가 와서 will be opened가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>조동사 뒤에는 \u003cb class=\"key\">be\u003c/b>가 오고 그 뒤에 \u003cb class=\"key\">p.p.\u003c/b>가 와요.\u003c/div>","segs":[{"n":7,"text":"이번에는 조동사가 있는 수동태예요. 조동사가 문장에 있으면 수동태는 조동사 뒤에 be를 쓰고 그 뒤에 과거분사를 붙여요. 그래서 조동사 be p.p. 순서가 됩니다. 조동사가 있어도 be동사는 꼭 원형 be로 써야 해요.","hl":"rule"},{"n":8,"text":"The exhibition will be opened to the public. 그 전시회는 대중에게 공개될 것이라는 뜻이에요. will be opened가 조동사가 있는 수동태로, will 뒤에 be와 과거분사 opened가 온 형태입니다.","hl":"ex-0"},{"n":9,"text":"조동사가 있으면 be동사를 원형 be로 쓴다는 점을 꼭 기억하세요. will be opened처럼 조동사 바로 뒤에 be가 오고 그 뒤에 과거분사가 와요. 조동사 뒤에 is나 are를 쓰면 틀리니 주의하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">동사구의 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사구의 수동태에서는 동사만 \u003cb class=\"key\">be동사 + p.p.\u003c/b>로 바꾸고, 나머지 \u003cb class=\"key\">전치사\u003c/b>나 \u003cb class=\"key\">부사\u003c/b>는 그대로 써요. 예를 들어 laugh at은 \u003cb class=\"key\">be laughed at\u003c/b>로, turn off는 \u003cb class=\"key\">be turned off\u003c/b>로 바꿔요.\u003cdiv>\u003cspan class=\"g-formula\">be + p.p. + 전치사/부사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">was laughed at\u003c/span> by his classmates.\u003c/div>\u003cdiv class=\"g-ko\">그는 반 친구들에게 비웃음을 당했다.\u003c/div>\u003cdiv class=\"g-note\">laugh at이 수동태가 되면 at을 그대로 남겨 was laughed at이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The lights \u003cspan class=\"fx\">were turned off\u003c/span> after the meeting.\u003c/div>\u003cdiv class=\"g-ko\">회의가 끝난 후에 불이 꺼졌다.\u003c/div>\u003cdiv class=\"g-note\">turn off가 수동태가 되면 부사 off를 그대로 남겨 were turned off가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동사구는 동사만 \u003cb class=\"key\">be + p.p.\u003c/b>로 바꾸고 \u003cb class=\"key\">전치사\u003c/b>나 \u003cb class=\"key\">부사\u003c/b>는 그대로 둬요.\u003c/div>","segs":[{"n":10,"text":"동사구의 수동태는 조금 다르게 생각해야 해요. laugh at이나 turn off처럼 동사와 전치사나 부사가 붙어 하나의 의미를 만드는 경우가 있죠. 이때 수동태로 바꿀 때는 동사만 be동사와 과거분사로 바꾸고, 뒤에 붙은 전치사나 부사는 그대로 남겨 둡니다. 그래서 be laughed at, be turned off처럼 쓰는 거예요.","hl":"rule"},{"n":11,"text":"He was laughed at by his classmates. 그는 반 친구들에게 비웃음을 당했다는 뜻이에요. was laughed at에서 at을 그대로 남긴 것이 동사구 수동태의 핵심입니다.","hl":"ex-0"},{"n":12,"text":"The lights were turned off after the meeting. 회의가 끝난 후에 불이 꺼졌다는 뜻이에요. were turned off에서 off를 그대로 남겨 동사구의 의미를 살렸습니다.","hl":"ex-1"},{"n":13,"text":"동사구를 수동태로 바꿀 때는 전치사나 부사를 절대 빼먹으면 안 돼요. laughed at에서 at을 빼면 의미가 달라지니까요. turn off처럼 부사가 붙은 동사구도 off를 그대로 남겨 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">by 이외의 전치사를 쓰는 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태의 행위자는 보통 \u003cb class=\"key\">by + 목적격\u003c/b>으로 나타내지만, by가 아닌 다른 전치사를 쓰는 경우도 많아요. be covered with, be filled with, be surprised at처럼 \u003cb class=\"key\">전치사\u003c/b>를 포함한 표현을 \u003cb class=\"key\">통째로\u003c/b> 익혀야 해요.\u003cdiv>\u003cspan class=\"g-formula\">be + p.p. + with[at/about/for/in/of/to] + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The department store \u003cspan class=\"fx\">is crowded with\u003c/span> young shoppers.\u003c/div>\u003cdiv class=\"g-ko\">그 백화점은 젊은 손님들로 붐빈다.\u003c/div>\u003cdiv class=\"g-note\">be crowded with는 '~로 붐비다'라는 뜻으로 by가 아니라 with를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">was worried about\u003c/span> his mother's health.\u003c/div>\u003cdiv class=\"g-ko\">그는 어머니의 건강에 대해 걱정했다.\u003c/div>\u003cdiv class=\"g-note\">be worried about은 '~에 대해 걱정하다'라는 뜻으로 about을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>by가 아닌 전치사를 쓰는 표현은 \u003cb class=\"key\">통째로\u003c/b> 외우고, \u003cb class=\"key\">자동사\u003c/b>나 \u003cb class=\"key\">resemble\u003c/b>처럼 수동태로 쓸 수 없는 동사도 구별하세요.\u003c/div>","segs":[{"n":14,"text":"수동태에서 행위자는 보통 by를 써서
