  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Practice2","title":"to부정사의 두 얼굴: 형용사적 용법과 부사적 용법","audioDir":"practice2_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">그래마마스터 레벨3 Chapter04 형용사적 용법과 부사적 용법\u003c/div>\u003ch1>to부정사의 두 얼굴: 형용사적 용법과 부사적 용법\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>to부정사가 명사·동사·형용사를 어떻게 꾸미는지 구별하고 be + to부정사의 의미를 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 to부정사가 명사를 꾸미는 형용사적 용법과 동사나 형용사를 꾸미는 부사적 용법을 배워 볼 거예요. 또 be 동사와 to부정사가 만나면 예정, 의무, 가능, 운명, 의도 같은 뜻을 나타낸다는 것도 함께 알아볼게요. 예문을 하나씩 읽으면서 to부정사가 어디를 꾸미는지 꼭 확인해 보세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">형용사적 용법: 명사를 꾸미는 to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사가 \u003cb class=\"key\">명사\u003c/b> 뒤에서 그 명사를 수식하며 '~할, ~한'으로 해석해요. 이때 to부정사는 명사의 성질이나 할 일을 설명하는 \u003cb class=\"key\">형용사\u003c/b> 역할을 해요.\u003cdiv>\u003cspan class=\"g-formula\">명사 + to부정사 = ~할 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I was looking for a present \u003cspan class=\"fx\">to please my mother\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 어머니를 기쁘게 해 드릴 선물을 찾고 있었다.\u003c/div>\u003cdiv class=\"g-note\">to please my mother가 앞의 present를 꾸며 주는 형용사적 용법이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We found an excellent hotel \u003cspan class=\"fx\">to stay at\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 머물 훌륭한 호텔을 찾았다.\u003c/div>\u003cdiv class=\"g-note\">to stay at이 hotel을 꾸미고, stay at의 목적어 hotel이 앞에 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>to stay at처럼 동사 뒤에 \u003cb class=\"key\">전치사\u003c/b>가 필요한 경우에는 전치사를 빠뜨리지 마세요.\u003c/div>","segs":[{"n":2,"text":"먼저 형용사적 용법부터 볼게요. to부정사가 명사 뒤에 붙어서 그 명사를 꾸며 주면 형용사적 용법이에요. 이때 해석은 자연스럽게 물건을 꾸밀 선물, 머물 호텔처럼 우리말로 풀어 주면 됩니다. 핵심은 to부정사가 바로 앞의 명사를 설명한다는 점이에요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 I was looking for a present to please my mother예요. 뜻은 나는 어머니를 기쁘게 해 드릴 선물을 찾고 있었다예요. 여기서 to please my mother가 바로 앞의 present를 꾸며 주는 형용사적 용법이에요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 We found an excellent hotel to stay at이에요. 뜻은 우리는 머물 훌륭한 호텔을 찾았다예요. to stay at이 앞의 hotel을 꾸며 주고, 전치사 at 뒤에 있던 목적어 hotel이 앞으로 나온 구조예요.","hl":"ex-1"},{"n":5,"text":"여기서 주의할 점은 stay at처럼 전치사가 필요한 동사는 to부정사 뒤에 전치사를 꼭 남겨야 한다는 거예요. 그래서 hotel to stay at이라고 써야 자연스럽습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">be + to부정사의 서술적 용법\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「be + to부정사」는 문장에서 \u003cb class=\"key\">서술적\u003c/b>으로 쓰여 \u003cb class=\"key\">예정\u003c/b>, \u003cb class=\"key\">의무\u003c/b>, 가능, 운명, 의도 등을 나타내요. 예정은 ~할 예정이다, 의무는 ~해야 한다, 가능은 ~할 수 있다, 운명은 ~할 운명이다, 의도는 ~하려고 하다로 해석해요.\u003cdiv>\u003cspan class=\"g-formula\">be동사 + to부정사 = 예정·의무·가능·운명·의도\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">is to get married\u003c/span> to a famous announcer next month.\u003c/div>\u003cdiv class=\"g-ko\">그는 다음 달에 유명한 아나운서와 결혼할 예정이다.\u003c/div>\u003cdiv class=\"g-note\">be + to부정사가 예정을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">All students \u003cspan class=\"fx\">are to submit\u003c/span> their homework by Friday.\u003c/div>\u003cdiv class=\"g-ko\">모든 학생은 금요일까지 숙제를 제출해야 한다.\u003c/div>\u003cdiv class=\"g-note\">be + to부정사가 의무를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Evidence \u003cspan class=\"fx\">was not to be found\u003c/span> anywhere.\u003c/div>\u003cdiv class=\"g-ko\">증거는 어디에서도 발견될 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">be + to부정사가 가능을 나타내고, not이 가능을 부정해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">was never to see\u003c/span> her children again.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 다시는 자녀들을 보지 못할 운명이었다.\u003c/div>\u003cdiv class=\"g-note\">be + to부정사가 운명을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>의도는 If you are to get treasures, you must dig up the ground처럼 \u003cb class=\"key\">조건\u003c/b> 속에서 ~하려고 하다로 해석해요.\u003c/div>","segs":[{"n":6,"text":"이번에는 be 동사와 to부정사가 함께 쓰이는 경우를 볼게요. 이때 to부정사는 명사를 꾸미는 것이 아니라 문장에서 서술어처럼 쓰여요. 그래서 be 동사와 to부정사가 합쳐져서 예정, 의무, 가능, 운명, 의도 같은 의미를 만들어 냅니다. 해석은 문맥에 따라 할 예정이다, 해야 한다, 할 수 있다, 할 운명이다, 하려고 하다로 달라져요.","hl":"rule"},{"n":7,"text":"첫 번째 예문은 He is to get married to a famous announcer next month예요. 뜻은 그는 다음 달에 유명한 아나운서와 결혼할 예정이다예요. is to get married가 앞으로 결혼할 예정이라는 의미를 나타냅니다.","hl":"ex-0"},{"n":8,"text":"두 번째 예문은 All students are to submit their homework by Friday예요. 뜻은 모든 학생은 금요일까지 숙제를 제출해야 한다예요. are to submit이 해야 한다는 의무를 나타내고 있어요.","hl":"ex-1"},{"n":9,"text":"세 번째 예문은 Evidence was not to be found anywhere예요. 뜻은 증거는 어디에서도 발견될 수 없었다예요. was not to be found가 발견될 수 없다는 가능의 부정을 나타냅니다.","hl":"ex-2"},{"n":10,"text":"네 번째 예문은 She was never to see her children again이에요. 뜻은 그녀는 다시는 자녀들을 보지 못할 운명이었다예요. was never to see가 다시는 보지 못할 운명이라는 의미를 나타냅니다.","hl":"ex-3"},{"n":11,"text":"의도는 조금 특별하게 조건과 함께 자주 나와요. If you are to get treasures, you must dig up the ground처럼 보물을 얻으려고 한다면 땅을 파야 한다는 뜻으로 해석하면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">부사적 용법: 목적, 감정의 원인, 결과, 판단의 근거\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사가 동사, 형용사, 부사를 수식하면 \u003cb class=\"key\">부사적 용법\u003c/b>이에요. 이때 목적, 감정의 원인, 결과, 판단의 근거 등을 나타내며 각각 ~하기 위해서, ~해서, 결국 ~하다, ~하다니로 해석해요.\u003cdiv>\u003cspan class=\"g-formula\">동사·형용사·부사 + to부정사 = 목적·감정의 원인·결과·판단의 근거\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My family went to Jeju Island \u003cspan class=\"fx\">to climb Mt. Halla\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리 가족은 한라산에 오르기 위해서 제주도에 갔다.\u003c/div>\u003cdiv class=\"g-note\">to climb Mt. Halla가 went의 목적을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He is sad \u003cspan class=\"fx\">to lose his job\u003c/span> because of the company's problems.\u003c/div>\u003cdiv class=\"g-ko\">그는 회사의 문제들 때문에 직장을 잃어서 슬프다.\u003c/div>\u003cdiv class=\"g-note\">sad의 감정 원인을 to lose his job이 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The woman grew up \u003cspan class=\"fx\">to be a lawyer\u003c/span> after her graduation.\u003c/div>\u003cdiv class=\"g-ko\">그 여자는 졸업 후에 자라서 결국 변호사가 되었다.\u003c/div>\u003cdiv class=\"g-note\">to be a lawyer가 결과를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">You must be talented \u003cspan class=\"fx\">to make such a successful business\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그렇게 성공적인 사업을 만들다니 너는 재능이 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">to make such a successful business가 판단의 근거를 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적은 '~하기 위해서', \u003cb class=\"key\">감정의 원인\u003c/b>은 '~해서', 결과는 '결국 ~하다'로 구별해요.\u003c/div>","segs":[{"n":12,"text":"이제 부사적 용법으로 넘어가 볼게요. to부정사가 동사나 형용사, 부사를 꾸며 주면 부사적 용법이라고 해요. 이때 목적이면 하기 위해서, 감정의 원인이면 해서, 결과면 결국 하다, 판단의 근거면 하다니로 해석해요. 해석이 문맥에 따라 달라지니까 앞뒤 단어를 꼭 같이 봐야 합니다.","hl":"rule"},{"n":13,"text":"첫 번째 예문은 My family went to Jeju Island to climb Mt. Halla예요. 뜻은 우리 가족은 한라산에 오르기 위해서 제주도에 갔다예요. to climb Mt. Halla가 제주도에 간 목적을 나타냅니다.","hl":"ex-0"},{"n":14,"text":"두 번째 예문은 He is sad to lose his job because of the company's problems예요. 뜻은 그는 회사의 문제들 때문에 직장을 잃어서 슬프다예요. to lose his job이 왜 슬픈지 알려 주는 감정의 원인이에요.","hl":"ex-1"},{"n":15,"text":"세 번째 예문은 The woman grew up to be a lawyer after her graduation이에요. 뜻은 그 여자는 졸업 후에 자라서 결국 변호사가 되었다예요. to be a lawyer가 자란 결과 결국 변호사가 되었다는 결과를 나타냅니다.","hl":"ex-2"},{"n":16,"text":"네 번째 예문은 You must be talented to make such a successful business예요. 뜻은 그렇게 성공적인 사업을 만들다니 너는 재능이 틀림없다예요. to make such a successful business가 재능이 있다고 판단하는 근거가 됩니다.","hl":"ex-3"},{"n":17,"text":"해석할 때 목적은 하기 위해서, 감정의 원인은 해서, 결과는 결국 하다로 구별하면 쉬워요. 특히 감정 형용사 sad 뒤에 오는 to부정사는 왜 슬픈지 알려 주는 감정의 원인이 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">부사적 용법의 확장: 조건, 형용사 수식, 감정과 판단\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사는 \u003cb class=\"key\">조건\u003c/b>을 나타내거나 \u003cb class=\"key\">형용사\u003c/b>를 수식할 수 있어요. 또 감정 형용사와 \u003cb class=\"key\">주관적 판단\u003c/b> 형용사 뒤에서 그 원인이나 판단의 이유를 설명해요.\u003cdiv>\u003cspan class=\"g-formula\">조건·형용사 수식·감정/판단 형용사 + to부정사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I would be happy \u003cspan class=\"fx\">to pass the final examination\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 최종 시험에 합격한다면 행복할 것이다.\u003c/div>\u003cdiv class=\"g-note\">to부정사가 조건을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The company's name is difficult \u003cspan class=\"fx\">to spell\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 회사의 이름은 철자하기 어렵다.\u003c/div>\u003cdiv class=\"g-note\">difficult를 수식하는 형용사 수식 용법이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">We are pleased \u003cspan class=\"fx\">to introduce our new membership program\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 새로운 회원 프로그램을 소개하게 되어 기쁩니다.\u003c/div>\u003cdiv class=\"g-note\">pleased의 감정 원인을 to부정사가 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">He must be foolish \u003cspan class=\"fx\">to believe such a big lie\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그렇게 큰 거짓말을 믿다니 그는 어리석음이 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">foolish라는 주관적 판단 003c/li>\u003cli>감정 형용사와 \u003cb class=\"key\">주관적 판단\u003c/b> 형용사 뒤의 to부정사는 그 \u003cb class=\"key\">원인\u003c/b>이나 이유를 설명해요.\u003c/li>\u003c/ul>","segs":[{"n":45,"text":"오늘은 to부정사가 명사를 꾸미는 형용사적 용법과 동사나 형용사를 꾸미는 부사적 용법을 배웠어요. be 동사와 to부정사가 만나면 예정, 의무, 가능, 운명, 의도를 나타낸다는 것도 기억해 주세요. 감정 형용사와 주관적 판단 형용사 뒤의 to부정사는 그 이유를 설명한다는 점도 꼭 챙겨 주세요. 예문을 다시 읽으면서 to부정사가 어디를 꾸미는지 확인하면 오늘 내용이 오래 남을 거예요.","hl":"sum"}]}]});</script></body></html>
