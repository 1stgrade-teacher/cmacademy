  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Practice3","title":"독립분사구문과 비인칭 분사구문, 이제 어렵지 않아요","audioDir":"practice3_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter06 분사구문 (독립분사구문 · with 분사구문 · 비인칭 분사구문)\u003c/div>\u003ch1>독립분사구문과 비인칭 분사구문, 이제 어렵지 않아요\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어가 다를 때 쓰는 독립분사구문, with + 명사 + 분사, 그리고 관용 표현인 비인칭 분사구문을 예문으로 익히고 직접 문제에 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 지난 시간에는 분사구문의 기본 원리를 배웠죠. 오늘은 그 분사구문이 조금 특별해지는 세 가지 경우를 공부할 거예요. 주어가 서로 다를 때 쓰는 독립분사구문, 그리고 with를 이용한 표현과 솔직히 말해서처럼 굳어진 비인칭 분사구문이에요. 예문을 하나씩 읽으면서 천천히 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">독립분사구문 : 주어가 다르면 주어를 살린다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부사절의 주어가 주절의 주어와 다를 때는 주어를 \u003cb class=\"key\">생략\u003c/b>하지 않고 그대로 씁니다. 접속사는 \u003cb class=\"key\">생략\u003c/b>하고 동사를 \u003cb class=\"key\">분사\u003c/b>로 바꿔 '주어 + 분사' 형태로 만듭니다. 이렇게 주어가 남아 있는 분사구문을 \u003cb class=\"key\">독립분사구문\u003c/b>이라고 합니다.\u003cdiv>\u003cspan class=\"g-formula\">접속사 생략 + (주절과 다른) 부사절 주어 + 분사 ~, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">My mom breaking her ankle\u003c/span>, I called 119.\u003c/div>\u003cdiv class=\"g-ko\">우리 엄마가 발목을 다쳐서, 나는 119에 전화했다.\u003c/div>\u003cdiv class=\"g-note\">부사절의 주어 my mom이 주절의 주어 I와 달라서 그대로 남아 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The market being closed\u003c/span>, we couldn't buy any snacks.\u003c/div>\u003cdiv class=\"g-ko\">그 시장이 문을 닫아서, 우리는 간식을 살 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">As the market was closed에서 접속사만 지우고 being closed로 바꾼 형태입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There being a lot of trash in the park\u003c/span>, we decided to clean it up.\u003c/div>\u003cdiv class=\"g-ko\">공원에 쓰레기가 아주 많아서, 우리는 그것을 치우기로 결정했다.\u003c/div>\u003cdiv class=\"g-note\">There was ~ 구문도 there를 그대로 두고 being을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 주어와 부사절의 주어가 \u003cb class=\"key\">같으면\u003c/b> 주어를 생략하지만, \u003cb class=\"key\">다르면\u003c/b> 반드시 남겨야 한다는 점이 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 독립분사구문부터 볼게요. 분사구문을 만들 때 부사절의 주어가 주절의 주어와 같으면 주어를 생략하죠. 그런데 두 주어가 서로 다르면 이야기가 완전히 달라져요. 이때는 주어를 절대 지우지 않고 그대로 남겨 둡니다. 접속사만 지우고 동사를 분사로 바꿔서, 누가 하는 일인지가 분명하게 보이는 분사구문을 만드는 거예요.","hl":"rule"},{"n":3,"text":"My mom breaking her ankle, I called 119. 이 문장은 우리 엄마가 발목을 다쳐서, 나는 백십구에 전화했다는 뜻이에요. 원래는 When my mom broke her ankle, I called 119였는데, 엄마와 나는 서로 다른 사람이라서 my mom을 지우지 않고 그대로 남겨 둔 거예요.","hl":"ex-0"},{"n":4,"text":"The market being closed, we couldn't buy any snacks. 는 그 시장이 문을 닫아서, 우리는 간식을 살 수 없었다는 뜻이에요. 원래 문장은 As the market was closed였는데, 주절의 주어 we와 시장이 다르니까 the market을 그대로 두고 being closed로 바꾼 거예요.","hl":"ex-1"},{"n":5,"text":"There being a lot of trash in the park, we decided to clean it up. 은 공원에 쓰레기가 아주 많아서, 우리는 그것을 치우기로 결정했다는 뜻이에요. Because there was로 시작하던 문장에서 접속사가 사라지고 there가 주어 자리에 그대로 남아 있는 모습을 꼭 기억해 두세요.","hl":"ex-2"},{"n":6,"text":"여기서 헷갈리기 쉬운 부분이 있어요. 주어가 같으면 생략하고, 다르면 남긴다는 것만 정확히 구분하면 독립분사구문은 절반은 끝난 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">with + (대)명사 + 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">'~한[된] 채로, ~하면서[되어서]'의 뜻으로 \u003cb class=\"key\">동시 동작\u003c/b>을 나타냅니다. with 뒤에 \u003cb class=\"key\">(대)명사\u003c/b>를 쓰고, 명사와 분사가 \u003cb class=\"key\">능동\u003c/b> 관계이면 현재분사를, 수동 관계이면 과거분사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">with + (대)명사 + 현재분사(능동) / 과거분사(수동)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Don't brush your teeth \u003cspan class=\"fx\">with water running\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">물이 흐르는 채로 양치하지 마라.\u003c/div>\u003cdiv class=\"g-note\">물이 흐르는 것은 능동 관계라서 현재분사 running을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">James sat on the sofa \u003cspan class=\"fx\">with his arms folded\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">제임스는 팔짱을 낀 채로 소파에 앉아 있었다.\u003c/div>\u003cdiv class=\"g-note\">팔은 접히는 대상이라 수동 관계이므로 과거분사 folded를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>분사를 고르기 전에 명사와 분사의 관계를 먼저 확인하세요. 흐르는 물은 \u003cb class=\"key\">능동\u003c/b>, 접히는 팔은 \u003cb class=\"key\">수동\u003c/b> 관계예요.\u003c/div>","segs":[{"n":7,"text":"두 번째는 with가 들어가는 표현이에요. 뜻은 한 채로, 하면서 정도로 기억하면 좋아요. with 뒤에 명사나 대명사를 쓰고 그 뒤에 분사를 붙이는데, 이때 명사와 분사의 관계를 꼭 따져 봐야 해요. 명사가 스스로 하는 일이면 현재분사, 당하는 일이면 과거분사를 쓰면 됩니다.","hl":"rule"},{"n":8,"text":"Don't brush your teeth with water running. 은 물이 흐르는 채로 양치하지 말라는 뜻이에요. 물이 흐르는 것은 물이 스스로 하는 일이니까 능동 관계이고, 그래서 현재분사 running을 쓴 거예요.","hl":"ex-0"},{"n":9,"text":"James sat on the sofa with his arms folded. 는 제임스가 팔짱을 낀 채로 소파에 앉아 있었다는 뜻이에요. 팔은 스스로 접는 것이 아니라 접히는 대상이니까 수동 관계이고, 그래서 과거분사 folded를 씁니다.","hl":"ex-1"},{"n":10,"text":"문제를 풀 때는 분사 자리에서 멈추고, 앞에 있는 명사가 직접 하는 일인지 당하는 일인지 생각해 보세요. 그 판단 하나로 답이 갈려요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">비인칭 분사구문 : 관용 표현으로 굳어진 분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부사절의 주어가 \u003cb class=\"key\">일반인\u003c/b>(we, they, people 등)인 경우에는 주어를 \u003cb class=\"key\">생략\u003c/b>하고 관용 표현처럼 씁니다. \u003cb class=\"key\">frankly speaking\u003c/b>, \u003cb class=\"key\">judging from\u003c/b>, \u003cb class=\"key\">considering\u003c/b>처럼 통째로 익혀 두면 편리합니다.\u003cdiv>\u003cspan class=\"g-formula\">일반인 주어 생략 + 분사구(관용 표현) ~, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Frankly speaking\u003c/span>, I don't have automobile insurance.\u003c/div>\u003cdiv class=\"g-ko\">솔직히 말해서, 나는 자동차 보험이 없다.\u003c/div>\u003cdiv class=\"g-note\">frankly speaking은 '솔직히 말해서'라는 대표적인 관용 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Judging from the opinion polls\u003c/span>, he seems to be succeeding.\u003c/div>\u003cdiv class=\"g-ko\">여론조사로 판단하건대, 그는 성공하고 있는 것처럼 보인다.\u003c/div>\u003cdiv class=\"g-note\">judging from은 '~으로 판단하건대'라는 뜻으로 굳어진 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Generally speaking\u003c/span>, you had better speak slowly when you give your speech.\u003c/div>\u003cdiv class=\"g-ko\">일반적으로 말해서, 연설을 할 때는 천천히 말하는 것이 좋다.\u003c/div>\u003cdiv class=\"g-note\">generally speaking은 '일반적으로 말해서'라는 뜻입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Considering his age\u003c/span>, he is a very talented pianist.\u003c/div>\u003cdiv class=\"g-ko\">그의 나이를 고려하면, 그는 아주 재능 있는 피아니스트이다.\u003c/div>\u003cdiv class=\"g-note\">considering은 '~을 고려하면'이라는 뜻의 전치사처럼 쓰입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>compared to, speaking of, strictly speaking, granting that도 함께 \u003cb class=\"key\">관용 표현\u003c/b>으로 묶어서 외워 두세요.\u003c/div>","segs":[{"n":11,"text":"마지막은 비인칭 분사구문이에요. 부사절의 주어가 우리, 사람들처럼 특정하지 않은 일반인일 때는 굳이 주어를 쓰지 않고 생략해요. 그러다 보니 솔직히 말해서, 일반적으로 말해서처럼 하나의 관용 표현처럼 굳어졌어요. 이런 표현들은 뜻과 함께 통째로 외워 두는 것이 가장 빠릅니다.","hl":"rule"},{"n":12,"text":"Frankly speaking, I don't have automobile insurance. 는 솔직히 말해서, 나는 자동차 보험이 없다는 뜻이에요. frankly speaking은 앞으로 자주 만나게 될 표현이니까 소리 내어 세 번 정도 따라 읽어 보세요.","hl":"ex-0"},{"n":13,"text":"Judging from the opinion polls, he seems to be succeeding. 은 여론조사로 판단하건대, 그는 성공하고 있는 것처럼 보인다는 뜻이에요. judging from은 으로 판단하건대라는 뜻으로 굳어져 있으니 그대로 외워 두세요.","hl":"ex-1"},{"n":14,"text":"Generally speaking, you had better speak slowly when you give your speech. 는 일반적으로 말해서, 연설을 할 때는 천천히 말하는 것이 좋다는 뜻이에요. speaking이 들어가는 표현은 앞에 부사만 바꿔서 여러 가지로 쓸 수 있어요.","hl":"ex-2"},{"n":15,"text":"Considering his age, he is a very talented pianist. 는 그의 나이를 고려하면, 그는 아주 재능 있는 피아니스트라는 뜻이에요. considering 뒤에 명사가 바로 오면 을 고려하면이라는 뜻으로 자연스럽게 이어집니다.","hl":"ex-3"},{"n":16,"text":"오늘 나온 표현 말고도 compared to, speaking of, strictly speaking, granting that이 있어요. 이런 표현들은 규칙을 따지기보다 덩어리로 기억하는 게 훨씬 효율적이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Breaking her ankle, I called 119.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ My mom breaking her ankle, I called 119.\u003c/div>\u003cdiv class=\"g-why\">부사절의 주어 my mom이 주절의 주어 I와 다르므로 주어를 생략하면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>James sat on the sofa with his arms folding.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ James sat on the sofa with his arms folded.\u003c/div>\u003cdiv class=\"g-why\">팔은 접히는 대상이므로 수동 관계인 과거분사 folded를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Don't brush your teeth with water run.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Don't brush your teeth with water running.\u003c/div>\u003cdiv class=\"g-why\">물이 흐르는 것은 능동 관계이므로 현재분사 running을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"첫 번째 실수는 주어를 지워 버린 경우예요. 발목을 다친 사람은 엄마인데 주어를 지우면 내가 다친 것처럼 읽혀요. 주어가 다를 때는 my mom을 꼭 남겨 주세요.","hl":"mk-0"},{"n":18,"text":"두 번째는 분사 형태를 잘못 고른 경우예요. 팔은 스스로 접는 게 아니라 접히는 대상이죠. 그래서 수동 관계인 과거분사 folded를 써야 합니다.","hl":"mk-1"},{"n":19,"text":"세 번째는 동사원형을 그대로 쓴 경우예요. 물이 흐르는 것은 물이 스스로 하는 일이니까 능동 관계예요. 그래서 현재분사 running을 써야 자연스러워요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan
