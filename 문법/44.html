003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'what'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">He is what is called a night owl.\u003c/div>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">O\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">'what is called'는 '소위, 이른바'라는 뜻의 관용 표현으로 바르게 쓰였습니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'that'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">A smartphone is that many people check first in the morning.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">보어 자리에 쓰였고 check의 목적어가 빠져 있으므로 that이 아니라 what을 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 객관식\u003c/span>\u003cdiv class=\"g-q\">다음 중 밑줄 친 what의 쓰임이 나머지 넷과 다른 것은?\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>This is what I wanted.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Show me what you bought.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>What he said is true.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Don't put off what you can finish today.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>A smartphone is what many people check first.\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">What he said is true.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">3번의 What은 주어 역할을 하고, 나머지 1, 2, 4, 5번은 보어 또는 목적어 역할을 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요
