window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 5 Chapter Test","audioDir":"Chapter_5_Chapter_Test_audio","preview":false,"count":171,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">접속사·병렬·관계사·동격절·준동사 종합\u003c/div>\u003ch1>Chapter 5 Chapter Test 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 맞는 문장 짝 고르기, 틀린 부분 고치기, 배열 서술형, 틀린 것 짝 고르기, 빈칸 형태 변형, 지문 어법 + 영작, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 챕터 파이브 챕터 테스트를 함께 풀어 볼 거예요. 접속사와 병렬, 관계사와 동격절, 준동사까지 시험에 자주 나오는 포인트를 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">양보 접속사 although와 전치사 despite\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">although는 \u003cb class=\"key\">절\u003c/b>을 이끌고, despite는 \u003cb class=\"key\">명사·동명사\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">although + 주어 + 동사 / despite + 명사(구)·동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>뒤에 주어와 동사가 있으면 although\u003c/li>\u003cli>뒤에 명사나 동명사만 있으면 despite\u003c/li>\u003cli>despite the fact that + 절도 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Although it was raining, we went out.\u003c/div>\u003cdiv class=\"g-ko\">비가 오고 있었지만, 우리는 외출했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Despite the rain, we went out.\u003c/div>\u003cdiv class=\"g-ko\">비에도 불구하고, 우리는 외출했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, although와 despite는 둘 다 비록 그럴지라도라는 뜻이지만 뒤에 오는 형태가 달라요. although는 접속사라서 뒤에 주어와 동사가 있는 절이 와요. despite는 전치사라서 뒤에 명사나 동명사가 와요. 그래서 뒤에 절이 보이면 although, 명사나 동명사가 보이면 despite를 고르면 돼요. despite the fact that처럼 절을 이끌고 싶을 때는 the fact that을 끼워 넣는 표현도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u >접속사 선택\u003c/b>절을 이끄는 것은 접속사 \u003cb class=\"key\">although\u003c/b>이고, despite는 전치사라서 절을 바로 받지 못해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>although they are harmless...로 \u003cb class=\"key\">비록 그것들이 해롭지 않을지라도\u003c/b>가 되어 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 although\u003c/span>\u003cdiv class=\"p-full\">Many situations are considered a threat by our brains, although they are harmless to our survival.\u003c/div>\u003cdiv class=\"p-ko\">많은 상황은 우리 뇌에 의해 위협으로 여겨지지만, 그것들은 우리 생존에 해롭지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>despite 뒤에 절이 그대로 오면 틀림\u003c/div>","segs":[{"n":6,"text":"먼저 빈칸 뒤를 보면 they are harmless라는 완전한 절이 나옵니다. 주어와 동사가 갖춰져 있는지 확인해 보세요.","hl":"st-0"},{"n":7,"text":"주어와 동사가 있는 절을 이끌 수 있는 것은 although예요. despite는 전치사라서 뒤에 명사나 동명사가 와야 합니다.","hl":"st-1"},{"n":8,"text":"그래서 although를 넣으면 비록 그것들이 우리 생존에 해롭지 않을지라도라는 뜻으로 자연스럽게 이어집니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. despite 뒤에 절이 그대로 오면 틀림","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">not only A but also B 병렬\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">not only와 but also 뒤에는 \u003cb class=\"key\">같은 형태\u003c/b>가 와야 한다.\u003cdiv>\u003cspan class=\"g-formula\">not only + 명사/동사/형용사, but also + 같은 형태\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동사가 나오면 but also 뒤도 같은 시제·형태\u003c/li>\u003cli>주어가 not only A but also B이면 동사는 B에 수일치\u003c/li>\u003cli>배열 문제에서는 not only 뒤와 but also 뒤 요소를 짝지어 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She not only sings but also dances.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 노래할 뿐만 아니라 춤도 춘다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You should walk not only slowly but also carefully.\u003c/div>\u003cdiv class=\"g-ko\">너는 천천히 뿐만 아니라 조심스럽게 걸어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"not only A but also B는 앞과 뒤에 같은 형태를 나란히 놓는 표현이에요. 동사가 오면 동사끼리, 부사가 오면 부사끼리, 형용사가 오면 형용사끼리 맞춰 줘야 해요. 문제에서 but also 뒤에 동명사가 갑자기 나오면 앞의 동사 형태와 비교해서 틀렸는지 확인해 보세요. 배열 문제에서는 not only 뒤에 오는 말과 but also 뒤에 오는 말을 한 쌍으로 생각하면 쉬워요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and, or, but, not only A but also B에서는 \u003cb class=\"key\">같은 문법 형태\u003c/b>를 나란히 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">동사 and 동사 / to부정사 and to부정사 / 형용사 and 형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>and 앞뒤 형태 확인\u003c/li>\u003cli>준동사는 같은 종류로 맞추기\u003c/li>\u003cli>명령문이 이어지면 동사원형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is a good way to ease anxiety and gain creativity.\u003c/div>\u003cdiv class=\"g-ko\">그것은 불안을 줄이고 창의성을 얻는 좋은 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Put your phone down and turn to face your partner.\u003c/div>\u003cdiv class=\"g-ko\">휴대폰을 내려놓고 상대방을 향해 돌아서라.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"병렬 구조는 쉽게 말해 짝을 맞추는 거예요. and나 but 앞뒤에 동사가 오면 동사끼리, 준동사가 오면 같은 종류의 준동사끼리 형태를 맞춰야 해요. 명령문이 이어지는 경우에는 and 뒤에도 동사원형이 와요. 문제에서 and를 보면 바로 앞과 뒤의 형태를 눈으로 비교해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">My aunt not only goes to school but also \u003cspan class=\"p-box\">\u003cspan>has\u003c/span>\u003ci>/\u003c/i>\u003cspan>having\u003c/span>\u003c/span> a full-time job.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">has\u003c/div>\u003cdiv class=\"p-op\">having\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">has\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"두 번째 문제는 not only A but also B에서 but also 뒤에 어떤 형태가 와야 하는지 묻고 있어요. 앞의 goes와 짝을 맞춰 보세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 has예요. not only 뒤의 goes와 같은 현재형 동사가 but also 뒤에 와야 하므로 has가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">My aunt not only goes to school but also \u003cspan class=\"p-box\">\u003cspan class=\"ok\">has\u003c/span>\u003ci>/\u003c/i>\u003cspan>having\u003c/span>\u003c/span> a full-time job.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">has\u003c/div>\u003cdiv class=\"p-op\">having\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">상관접속사 찾기\u003c/b>\u003cb class=\"key\">not only goes ... but also\u003c/b> 구조이므로 but also 뒤에는 앞의 goes와 같은 형태의 동사가 와야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주어·시제 확인\u003c/b>주어 My aunt는 단수이고 현재 시제이므로 \u003cb class=\"key\">has\u003c/b>가 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">동명사 탈락\u003c/b>having은 동명사·분사 형태라서 but also 뒤의 정동사 자리에 바로 올 수 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 has\u003c/span>\u003cdiv class=\"p-full\">My aunt not only goes to school but also has a full-time job.\u003c/div>\u003cdiv class=\"p-ko\">나의 이모는 학교에 다닐 뿐만 아니라 정규직 일도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>but also 뒤에 동명사 having을 쓰면 병렬이 깨짐\u003c/div>","segs":[{"n":15,"text":"먼저 not only와 but also가 짝을 이루고 있는지 보세요. 앞에 goes라는 동사가 있으니 뒤에도 같은 형태의 동사가 와야 합니다.","hl":"st-0"},{"n":16,"text":"주어는 My aunt로 단수이고 현재 상황을 말하고 있어요. 그래서 현재형 단수 동사 has가 자연스럽습니다.","hl":"st-1"},{"n":17,"text":"having은 동명사나 분사 형태라서 여기처럼 정동사가 필요한 자리에 그대로 쓰일 수 없어요.","hl":"st-2"},{"n":18,"text":"이 문제의 함정도 짚고 갈게요. but also 뒤에 동명사 having을 쓰면 병렬이 깨짐","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명사절 접속사 that과 whether\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">that은 \u003cb class=\"key\">사실\u003c/b>을 이끌고, whether는 \u003cb class=\"key\">~인지 아닌지\u003c/b>라는 불확실성을 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">that + 완전한 절 / whether + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>or not이 보이면 whether\u003c/li>\u003cli>not clear, not sure, depend on 뒤에는 whether가 자연스러움\u003c/li>\u003cli>that은 ~라는 사실이라는 의미\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is not clear whether he will come or not.\u003c/div>\u003cdiv class=\"g-ko\">그가 올지 안 올지 분명하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It is clear that technology has changed childhood.\u003c/div>\u003cdiv class=\"g-ko\">기술이 어린 시절을 바꾼 것은 분명하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"that과 whether는 둘 다 명사절을 이끌 수 있지만 의미가 달라요. that은 이미 정해진 사실을 말할 때 쓰고, whether는 어떤 일인지 아닌지 불확실할 때 써요. especially or not이 함께 보이면 whether를 먼저 떠올리세요. not clear나 depend on 뒤에서도 whether가 자연스러운 경우가 많아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">It is clear that technology developed over the past two decades has radically transformed what childhood looks like. However, it is not clear \u003cspan class=\"p-box\">\u003cspan>that\u003c/span>\u003ci>/\u003c/i>\u003cspan>whether\u003c/span>\u003c/span> technology is dangerous for kids or not.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">whether\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whether\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"세 번째 문제는 that과 whether 중에서 고르는 문제예요. 앞의 not clear와 뒤의 or not에 주목해 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":7},{"n":22,"text":"정답은 whether예요. 확실하지 않다는 의미에 or not이 함께 있으므로 whether가 자연스럽습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">It is clear that technology developed over the past two decades has radically transformed what childhood looks like. However, it is not clear \u003cspan class=\"p-box\">\u003cspan>that\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">whether\u003c/span>\u003c/span> technology is dangerous for kids or not.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">whether\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">의미 확인\u003c/b>\u003cb class=\"key\">it is not clear\u003c/b>는 분명하지 않다는 뜻이라서 뒤에 불확실한 내용이 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">or not 단서\u003c/b>뒤에 \u003cb class=\"key\">or not\u003c/b>이 있으므로 ~인지 아닌지를 나타내는 whether가 필요해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">that 탈락\u003c/b>that은 확정된 사실을 이끌어서 not clear와 잘 어울리지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 whether\u003c/span>\u003cdiv class=\"p-full\">However, it is not clear whether technology is dangerous for kids or not.\u003c/div>\u003cdiv class=\"p-ko\">그러나 기술이 아이들에게 위험한지 아닌지는 분명하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>or not이 보이는데 that을 고르면 의미가 어긋남\u003c/div>","segs":[{"n":23,"text":"앞부분에 it is not clear가 있으니 확실하지 않다는 의미예요. 그래서 뒤에는 어떤 사실을 단정하는 표현보다 불확실성을 나타내는 표현이 어울립니다.","hl":"st-0"},{"n":24,"text":"문장 끝을 보면 or not이 붙어 있어요. 이때는 ~인지 아닌지를 뜻하는 whether를 쓰는 것이 자연스럽습니다.","hl":"st-1"},{"n":25,"text":"that은 이미 분명한 사실을 말할 때 주로 쓰기 때문에 not clear 뒤에서는 어색합니다.","hl":"st-2"},{"n":26,"text":"이 문제의 함정도 짚고 갈게요. or not이 보이는데 that을 고르면 의미가 어긋남","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">시간 접속사 while과 전치사 during\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">while은 \u003cb class=\"key\">절\u003c/b>을 이끌고, during은 \u003cb class=\"key\">명사(구)\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">while + 주어 + 동사 / during + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>while 뒤에 주어·동사 확인\u003c/li>\u003cli>during 뒤에는 명사만\u003c/li>\u003cli>while은 ~하는 동안이라는 의미\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">While you take a walk, breathe deeply.\u003c/div>\u003cdiv class=\"g-ko\">산책하는 동안 깊게 숨을 쉬어라.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">During the walk, breathe deeply.\u003c/div>\u003cdiv class=\"g-ko\">산책 동안 깊게 숨을 쉬어라.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"while과 during도 뒤에 오는 형태로 구분해요. while은 접속사라서 뒤에 주어와 동사가 있는 절이 와요. during은 전치사라서 뒤에 명사나 명사구가 와요. 그래서 뒤에 you take a walk처럼 절이 보이면 while, daily conversations처럼 명사구가 보이면 during을 골라요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 알맞은 말을 각각 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Breathing in some fresh air \u003cspan class=\"p-box\">\u003cspan>during\u003c/span>\u003ci>/\u003c/i>\u003cspan>while\u003c/span>\u003c/span> you take a walk is a great way to clear your mind. It is also a good way to ease anxiety and \u003cspan class=\"p-box\">\u003cspan>gain\u003c/span>\u003ci>/\u003c/i>\u003cspan>gaining\u003c/span>\u003c/span> creativity.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">during\u003c/div>\u003cdiv class=\"p-op\">while\u003c/div>\u003cdiv class=\"p-op\">gain\u003c/div>\u003cdiv class=\"p-op\">gaining\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">while, gain\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"네 번째 문제는 두 군데를 고르는 문제예요. 첫 번째는 while과 during, 두 번째는 gain과 gaining의 형태를 살펴보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":7},{"n":30,"text":"정답은 while과 gain이에요. while 뒤에는 절이 오고, and 앞의 ease와 같은 동사원형 gain이 병렬로 이어져야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 알맞은 말을 각각 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Breathing in some fresh air \u003cspan class=\"p-box\">\u003cspan>during\u003c/span>\u003ci>/\u003c/i>\u003cspan>while\u003c/span>\u003c/span> you take a walk is a great way to clear your mind. It is also a good way to ease anxiety and \u003cspan class=\"p-box\">\u003cspan>gain\u003c/span>\u003ci>/\u003c/i>\u003cspan>gaining\u003c/span>\u003c/span> creativity.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">during\u003c/div>\u003cdiv class=\"p-op\">while\u003c/div>\u003cdiv class=\"p-op\">gain\u003c/div>\u003cdiv class=\"p-op\">gaining\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 빈칸\u003c/b>뒤에 \u003cb class=\"key\">you take a walk\u003c/b>라는 절이 오므로 접속사 while이 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 빈칸\u003c/b>\u003cb class=\"key\">to ease anxiety and ___ creativity\u003c/b>에서 and 앞의 ease와 같은 동사원형 \u003cb class=\"key\">gain\u003c/b>이 병렬로 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>while you take a walk, gain creativity로 자연스럽게 완성돼요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 while, gain\u003c/span>\u003cdiv class=\"p-full\">Breathing in some fresh air while you take a walk is a great way to clear your mind. It is also a good way to ease anxiety and gain creativity.\u003c/div>\u003cdiv class=\"p-ko\">산책하는 동안 신선한 공기를 마시는 것은 마음을 맑게 하는 좋은 방법이다. 그것은 또한 불안을 줄이고 창의성을 얻는 좋은 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>during 뒤에 절이 오거나 gaining으로 and 병렬을 깨면 틀림\u003c/div>","segs":[{"n":31,"text":"첫 번째 빈칸 뒤에는 you take a walk라는 주어와 동사가 있는 절이 와요. 그래서 절을 이끄는 while이 필요합니다.","hl":"st-0"},{"n":32,"text":"두 번째 빈칸은 to ease anxiety and 다음에 이어져요. and 앞의 ease가 동사원형이므로 뒤에도 동사원형 gain이 와야 병렬이 맞습니다.","hl":"st-1"},{"n":33,"text":"그래서 while과 gain을 넣으면 산책하는 동안 신선한 공기를 마시는 것이 불안을 줄이고 창의성을 얻는 좋은 방법이라는 뜻이 됩니다.","hl":"st-2"},{"n":34,"text":"이 문제의 함정도 짚고 갈게요. during 뒤에 절이 오거나 gaining으로 and 병렬을 깨면 틀림","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동격절을 이끄는 that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">belief, news, fact, idea, rumor, assumption 같은 \u003cb class=\"key\">추상명사\u003c/b> 뒤에서 that은 그 내용을 설명하는 동격절을 이끈다.\u003cdiv>\u003cspan class=\"g-formula\">추상명사 + that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>that 뒤에 완전한 절이 오면 동격절 가능\u003c/li>\u003cli>the news that ~, the fact that ~\u003c/li>\u003cli>동격절 that은 해석이 ~라는\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I can't believe the news that the tax rate will decline.\u003c/div>\u003cdiv class=\"g-ko\">세율이 내려갈 것이라는 뉴스를 믿을 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The fact that you are in a new place is exciting.\u003c/div>\u003cdiv class=\"g-ko\">네가 새로운 곳에 있다는 사실은 신난다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"동격절은 앞에 있는 추상명사의 내용을 뒤에서 자세히 설명해 주는 절이에요. belief, news, fact, idea, rumor, assumption 같은 명사 뒤에 that이 나오고 뒤에 완전한 절이 오면 동격절로 볼 수 있어요. 이때 that은 관계대명사가 아니라 접속사 역할을 해요. 그래서 뒤에 주어와 동사가 모두 갖춰져 있는지 확인하는 습관이 중요해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사와 동명사, 전치사 뒤 -ing\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 \u003cb class=\"key\">동명사(-ing)\u003c/b>, be supposed to, be willing to, be eager to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + -ing / be supposed to + 동사원형 / be willing to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>look forward to, object to, opposed to의 to는 전치사\u003c/li>\u003cli>to부정사의 to 뒤에는 동사원형\u003c/li>\u003cli>and 병렬이면 앞뒤 형태를 맞춤\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We look forward to receiving your reply.\u003c/div>\u003cdiv class=\"g-ko\">우리는 당신의 답장을 기다립니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is willing to help those in need.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 어려운 사람들을 기꺼이 돕는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"to가 나온다고 해서 무조건 to부정사라고 생각하면 안 돼요. look forward to, object to, opposed to, be devoted to에서의 to는 전치사라서 뒤에 동명사가 와요. 반면 be supposed to, be willing to, be eager to에서의 to는 to부정사라서 뒤에 동사원형이 와요. 문제를 풀 때는 to 앞의 표현이 무엇인지 먼저 확인해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 알맞은 말을 각각 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If you have a belief \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> a society can be perfected through cooperation, join our organization. We are always looking for people who are willing to \u003cspan class=\"p-box\">\u003cspan>helping\u003c/span>\u003ci>/\u003c/i>\u003cspan>help\u003c/span>\u003c/span> those in need!\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">which\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">helping\u003c/div>\u003cdiv class=\"p-op\">help\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that, help\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"다섯 번째 문제는 belief 뒤의 접속사와 willing to 뒤의 동사 형태를 묻고 있어요. 뒤에 완전한 절인지, to 뒤인지 확인해 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":7},{"n":39,"text":"정답은 that과 help예요. belief 뒤에는 내용을 설명하는 동격절 that이 오고, willing to 뒤에는 동사원형 help가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 알맞은 말을 각각 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">If you have a belief \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> a society can be perfected through cooperation, join our organization. We are always looking for people who are willing to \u003cspan class=\"p-box\">\u003cspan>helping\u003c/span>\u003ci>/\u003c/i>\u003cspan>help\u003c/span>\u003c/span> those in need!\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">which\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">helping\u003c/div>\u003cdiv class=\"p-op\">help\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">belief 뒤 확인\u003c/b>a belief 뒤에 \u003cb class=\"key\">a society can be perfected...\u003c/b>라는 완전한 절이 와서 내용을 설명하므로 동격절 that이 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">which 탈락\u003c/b>which는 관계대명사라서 뒤에 불완전한 절이 와야 하는데, 여기서는 절이 완전해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">willing to 뒤\u003c/b>\u003cb class=\"key\">be willing to\u003c/b> 뒤에는 동사원형이 와서 help가 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 that, help\u003c/span>\u003cdiv class=\"p-full\">If you have a belief that a society can be perfected through cooperation, join our organization. We are always looking for people who are willing to help those in need!\u003c/div>\u003cdiv class=\"p-ko\">만약 사회가 협력을 통해 완성될 수 있다는 믿음을 가지고 있다면, 우리 단체에 가입하세요. 우리는 항상 도움이 필요한 사람들을 기꺼이 돕고자 하는 사람들을 찾고 있습니다!\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>belief 뒤 which, willing to 뒤 helping을 고르면 틀림\u003c/div>","segs":[{"n":40,"text":"belief 뒤를 보면 a society can be perfected라는 완전한 절이 와요. 이는 belief의 내용을 설명하는 동격절이므로 that을 씁니다.","hl":"st-0"},{"n":41,"text":"which를 쓰려면 뒤에 주어나 목적어가 빠진 불완전한 절이 와야 해요. 하지만 여기서는 절이 완전하므로 which는 어색합니다.","hl":"st-1"},{"n":42,"text":"willing to는 to부정사 표현이라서 뒤에 동사원형이 와요. 그래서 helping이 아니라 help가 맞습니다.","hl":"st-2"},{"n":43,"text":"이 문제의 함정도 짚고 갈게요. belief 뒤 which, willing to 뒤 helping을 고르면 틀림","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤의 명사절과 동명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 명사 상당어가 와야 하므로 \u003cb class=\"key\">동명사\u003c/b>나 \u003cb class=\"key\">whether절\u003c/b>이 오고, that절은 잘 오지 않는다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + -ing / 전치사 + whether절 / depend on whether + 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>depend on, look forward to, object to, opposed to\u003c/li>\u003cli>that절은 전치사 뒤에 바로 못 옴\u003c/li>\u003cli>whether절은 전치사 뒤에 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Staying healthy depends on whether we have a sustainable lifestyle.\u003c/div>\u003cdiv class=\"g-ko\">건강을 유지하는 것은 우리가 지속 가능한 생활 방식을 가지는지에 달려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We look forward to receiving your reply.\u003c/div>\u003cdiv class=\"g-ko\">우리는 당신의 답장을 기다립니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":44,"text":"전치사 뒤에는 명사 역할을 하는 표현이 와야 해요. 그래서 동사가 오면 동명사로 바꿔야 하고, 절이 오면 whether절처럼 명사절로 쓸 수 있는 접속사가 필요해요. depend on 뒤에 that절을 그대로 쓰면 어색해요. 이때는 ~인지 아닌지라는 의미의 whether절을 써야 자연스러워요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 that과 which\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계대명사는 앞의 \u003cb class=\"key\">명사\u003c/b>를 꾸며 주며, that은 제한적 용법에서 which 대신 자주 쓰인다. 동격절 that과 구별해야 한다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + that/which + 불완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>관계대명사 뒤에는 불완전한 절\u003c/li>\u003cli>동격절 that 뒤에는 완전한 절\u003c/li>\u003cli>사람은 who/that, 사물은 which/that\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The rumor that was all over town was false.\u003c/div>\u003cdiv class=\"g-ko\">마을에 퍼진 소문은 거짓이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The news that water was discovered was surprising.\u003c/div>\u003cdiv class=\"g-ko\">물이 발견되었다는 뉴스는 놀라웠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"관계대명사 that과 which는 앞에 있는 명사를 뒤에서 꾸며 줘요. 이때 관계대명사 뒤에는 주어나 목적어가 빠진 불완전한 절이 와요. 반면 동격절의 that 뒤에는 주어와 동사가 모두 있는 완전한 절이 와요. 그래서 that이나 which를 볼 때는 뒤의 절이 완전한지 불완전한지를 먼저 확인해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① We look forward \u003cu class=\"p-u\">to receiving\u003c/u> a positive reply.\u003c/div>\u003cdiv class=\"p-op\">② Staying healthy depends on \u003cu class=\"p-u\">that\u003c/u> we have a sustainable lifestyle.\u003c/div>\u003cdiv class=\"p-op\">③ The dogs were left in the snow \u003cu class=\"p-u\">until\u003c/u> a kind stranger took them in.\u003c/div>\u003cdiv class=\"p-op\">④ My heart started to race as they were about \u003cu class=\"p-u\">to announce\u003c/u> the winner.\u003c/div>\u003cdiv class=\"p-op\">⑤ I can't believe she wasn't aware of the rumor \u003cu class=\"p-u\">that\u003c/u> was all over the town.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② (that → whether)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":46,"text":"여섯 번째 문제는 다섯 문장 중 어법상 틀린 것을 찾는 문제예요. 전치사 뒤에 오는 형태와 관계대명사를 중심으로 하나씩 확인해 보세요.","hl":"q"},{"n":47,"text":"","hl":"q","pause":7},{"n":48,"text":"정답은 두 번째예요. depends on 뒤에는 that절이 아니라 whether절이 와서 whether we have a sustainable lifestyle가 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① We look forward \u003cu class=\"p-u\">to receiving\u003c/u> a positive reply.\u003c/div>\u003cdiv class=\"p-op\">② Staying healthy depends on \u003cu class=\"p-u\">that\u003c/u> we have a sustainable lifestyle.\u003c/div>\u003cdiv class=\"p-op\">③ The dogs were left in the snow \u003cu class=\"p-u\">until\u003c/u> a kind stranger took them in.\u003c/div>\u003cdiv class=\"p-op\">④ My heart started to race as they were about \u003cu class=\"p-u\">to announce\u003c/u> the winner.\u003c/div>\u003cdiv class=\"p-op\">⑤ I can't believe she wasn't aware of the rumor \u003cu class=\"p-u\">that\u003c/u> was all over the town.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">look forward to\u003c/b>의 to는 전치사라서 뒤에 동명사 receiving이 와서 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">depends on\u003c/b> 뒤에는 전치사 목적어가 필요하고, that절은 바로 올 수 없어요. ~인지 아닌지이므로 whether절이 와야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>\u003cb class=\"key\">until\u003c/b>은 ~할 때까지라는 접속사로 뒤에 절이 와서 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>\u003cb class=\"key\">be about to\u003c/b> 뒤에는 동사원형이 와서 to announce가 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>the rumor \u003cb class=\"key\">that was all over the town\u003c/b>에서 that은 주어 역할을 하는 관계대명사로 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (that → whether)\u003c/span>\u003cdiv class=\"p-full\">② Staying healthy depends on whether we have a sustainable lifestyle.\u003c/div>\u003cdiv class=\"p-ko\">건강을 유지하는 것은 우리가 지속 가능한 생활 방식을 가지는지에 달려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>depends on 뒤에 that절을 그대로 두는 오류\u003c/div>","segs":[{"n":49,"text":"첫 번째 문장에서 look forward to의 to는 전치사예요. 그래서 뒤에 동명사 receiving이 온 것이 맞습니다.","hl":"st-0"},{"n":50,"text":"두 번째 문장은 depends on 뒤를 봐야 해요. 전치사 on 뒤에 that절이 바로 오면 어색하고, 여기서는 ~인지 아닌지를 나타내는 whether절이 필요합니다.","hl":"st-1"},{"n":51,"text":"세 번째 문장의 until은 ~할 때까지라는 접속사로 뒤에 a kind stranger took them in이라는 절이 와요. 그래서 맞습니다.","hl":"st-2"},{"n":52,"text":"네 번째 문장은 be about to 뒤에 동사원형 announce가 와서 곧 발표하려고 했다는 뜻을 만듭니다. 맞습니다.","hl":"st-3"},{"n":53,"text":"다섯 번째 문장의 that은 the rumor를 꾸며 주면서 was의 주어 역할을 해요. 관계대명사로 쓰인 것이 맞습니다.","hl":"st-4"},{"n":54,"text":"이 문제의 함정도 짚고 갈게요. depends on 뒤에 that절을 그대로 두는 오류","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">상관접속사 neither A nor B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">neither A nor B는 \u003cb class=\"key\">A도 B도 아니다\u003c/b>이며 A와 B가 같은 형태여야 한다.\u003cdiv>\u003cspan class=\"g-formula\">neither + 명사 + nor + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>nor 뒤에 명사 확인\u003c/li>\u003cli>동사 수일치는 B에 맞춤\u003c/li>\u003cli>either ... or와 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Neither short distance nor light traffic matters.\u003c/div>\u003cdiv class=\"g-ko\">짧은 거리도 가벼운 교통량도 중요하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He sent neither a message nor a messenger.\u003c/div>\u003cdiv class=\"g-ko\">그는 메시지도 전령도 보내지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"neither A nor B는 A도 아니고 B도 아니라는 뜻이에요. nor가 보이면 앞의 neither와 짝을 이루는지 먼저 확인하세요. 그리고 A와 B 자리에는 같은 종류의 명사나 같은 형태의 표현이 와야 해요. either A or B와 헷갈리지 않도록 nor가 있는지도 꼭 봐야 해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">because와 because of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">because는 \u003cb class=\"key\">절\u003c/b>을 이끌고, because of는 \u003cb class=\"key\">명사(구)\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">because + 주어 + 동사 / because of + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>뒤에 절이 있으면 because\u003c/li>\u003cli>뒤에 명사만 있으면 because of\u003c/li>\u003cli>because of its poor location\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The business failed because its location was poor.\u003c/div>\u003cdiv class=\"g-ko\">그 사업은 위치가 좋지 않아서 실패했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The business failed because of its poor location.\u003c/div>\u003cdiv class=\"g-ko\">그 사업은 좋지 않은 위치 때문에 실패했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":56,"text":"because와 because of는 뜻은 비슷하지만 뒤에 오는 형태가 달라요. because는 접속사라서 뒤에 주어와 동사가 있는 절이 와요. because of는 전치사 표현이라서 뒤에 명사나 명사구가 와요. 뒤에 절이 없고 명사만 보이면 because of로 고쳐야 한다는 점을 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 짝 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">ⓐ He sent neither a message nor a messenger but came himself. ⓑ Pack your bags and head to this gorgeous destination before it's too late. ⓒ The business failed because its poor location for both workers and markets. ⓓ Some critics object 뒤에 동격절 \u003cb class=\"key\">that you are in a new place\u003c/b>를 붙여 The fact that you are in a new place로 써요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ⑤ (that → whether) (2) The fact that you are in a new place\u003c/span>\u003cdiv class=\"p-full\">(2) The fact that you are in a new place means you have an opportunity to experience new things.\u003c/div>\u003cdiv class=\"p-ko\">(1) 정답은 ⑤이며 that을 whether로 고친다. (2) The fact that you are in a new place\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>whether ... or ... 나열을 that으로 쓰면 틀림\u003c/div>","segs":[{"n":143,"text":"첫 번째 밑줄은 Adjusting to life in a new place가 주어로 쓰였어요. 동명사 주어로 맞습니다.","hl":"st-0"},{"n":144,"text":"두 번째 밑줄의 which는 activities를 꾸며 주는 주격 관계대명사예요. 뒤에 weren't available이 와서 맞습니다.","hl":"st-1"},{"n":145,"text":"세 번째 밑줄은 While you try those로, while 뒤에 주어와 동사가 있는 절이 와서 맞습니다.","hl":"st-2"},{"n":146,"text":"네 번째 밑줄은 help you meet people and feel connected에서 meet과 feel이 병렬을 이루고 있어서 맞습니다.","hl":"st-3"},{"n":147,"text":"다섯 번째 밑줄은 going back to school, starting a new career, finishing that novel 같은 여러 가능성을 나열해요. 이때는 ~이든지라는 의미의 whether가 필요하므로 that이 어색합니다.","hl":"st-4"},{"n":148,"text":"두 번째 물음은 fact를 이용해 여러분이 새로운 곳에 있다는 사실을 영작하는 거예요. fact 뒤에 동격절 that you are in a new place를 붙이면 됩니다.","hl":"st-5"},{"n":149,"text":"이 문제의 함정도 짚고 갈게요. whether ... or ... 나열을 that으로 쓰면 틀림","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">what = the thing(s) that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">what은 \u003cb class=\"key\">선행사를 포함한 관계대명사\u003c/b>로 ~하는 것을 뜻하며, 뒤에는 불완전한 절이 온다.\u003cdiv>\u003cspan class=\"g-formula\">what + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>what they describe as ~\u003c/li>\u003cli>that과 달리 선행사 없이 명사절\u003c/li>\u003cli>뒤에 불완전한 절 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The team discovered \u003cspan class=\"fx\">what they describe\u003c/span> as a new species.\u003c/div>\u003cdiv class=\"g-ko\">그 팀은 그들이 신종이라고 묘사하는 것을 발견했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":150,"text":"what은 앞에 선행사가 없어도 그 자체로 ~하는 것이라는 명사 역할을 해요. 그래서 what they describe as라고 하면 그들이 묘사하는 것이라는 뜻이 돼요. what 뒤에는 주어나 목적어가 빠진 불완전한 절이 오는 경우가 많아요. that과 헷갈릴 때는 앞에 명사가 있는지, 뒤의 절이 완전한지 비교해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">If you're at all superstitious, chances are that you get a little nervous when you spot Friday the 13th on a calendar. The date has been synonymous with bad luck for ages. However, there's absolutely no scientific evidence ① \u003cu class=\"p-u\">supporting\u003c/u> the idea that Friday the 13th is actually unlucky. Actually, one super cool scientific discovery ② \u003cu class=\"p-u\">was made\u003c/u> public on Friday, November 13, 2009. On this date, NASA scientists shared the news ③ \u003cu class=\"p-u\">which\u003c/u> water was discovered on the moon. &quot;I'm here today to tell you that indeed, yes, we found water. Not just a little bit, ④ \u003cu class=\"p-u\">but\u003c/u> a significant amount,&quot; said NASA project scientist Anthony Colaprete during a news conference. The team discovered ⑤ \u003cu class=\"p-u\">what\u003c/u> they describe as &quot;about a dozen, two-gallon bucketfuls.&quot; There was absolutely nothing unlucky about that!\u003c/div>\u003cdiv class=\"p-q\">다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① supporting\u003c/div>\u003cdiv class=\"p-op\">② was made\u003c/div>\u003cdiv class=\"p-op\">③ which\u003c/div>\u003cdiv class=\"p-op\">④ but\u003c/div>\u003cdiv class=\"p-op\">⑤ what\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (which → that)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":151,"text":"열아홉 번째 문제는 지문의 다섯 밑줄 중 어법상 틀린 것을 찾는 문제예요. 특히 news 뒤의 절이 완전한지 불완전한지 확인해 보세요.","hl":"q"},{"n":152,"text":"","hl":"q","pause":7},{"n":153,"text":"정답은 세 번째 밑줄이에요. news 뒤에서 내용을 설명하는 동격절을 이끌어야 하므로 which가 아니라 that이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">If you're at all superstitious, chances are that you get a little nervous when you spot Friday the 13th on a calendar. The date has been synonymous with bad luck for ages. However, there's absolutely no scientific evidence ① \u003cu class=\"p-u\">supporting\u003c/u> the idea that Friday the 13th is actually unlucky. Actually, one super cool scientific discovery ② \u003cu class=\"p-u\">was made\u003c/u> public on Friday, November 13, 2009. On this date, NASA scientists shared the news ③ \u003cu class=\"p-u\">which\u003c/u> water was discovered on the moon. &quot;I'm here today to tell you that indeed, yes, we found water. Not just a little bit, ④ \u003cu class=\"p-u\">but\u003c/u> a significant amount,&quot; said NASA project scientist Anthony Colaprete during a news conference. The team discovered ⑤ \u003cu class=\"p-u\">what\u003c/u> they describe as &quot;about a dozen, two-gallon bucketfuls.&quot; There was absolutely nothing unlucky about that!\u003c/div>\u003cdiv class=\"p-q sm\">다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① supporting\u003c/div>\u003cdiv class=\"p-op\">② was made\u003c/div>\u003cdiv class=\"p-op\">③ which\u003c/div>\u003cdiv class=\"p-op\">④ but\u003c/div>\u003cdiv class=\"p-op\">⑤ what\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">evidence supporting the idea\u003c/b>에서 supporting은 evidence를 꾸미는 현재분사로 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">was made public\u003c/b>은 수동태로 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>the news 뒤에 \u003cb class=\"key\">water was discovered on the moon\u003c/b>라는 완전한 절이 와서 동격절 that이 필요해요. which는 관계대명사라 뒤가 불완전해야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>\u003cb class=\"key\">Not just a little bit, but a significant amount\u003c/b>는 not just A but B 구조로 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>\u003cb class=\"key\">what they describe as...\u003c/b>에서 what은 선행사를 포함한 관계대명사로 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (which → that)\u003c/span>\u003cdiv class=\"p-full\">On this date, NASA scientists shared the news that water was discovered on the moon.\u003c/div>\u003cdiv class=\"p-ko\">이 날 NASA 과학자들은 달에서 물이 발견되었다는 뉴스를 공유했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>news 뒤에 완전한 절이 오면 동격절 that, which 아님\u003c/div>","segs":[{"n":154,"text":"첫 번째 밑줄의 supporting은 evidence를 뒤에서 꾸며 주는 현재분사예요. 과학적 증거가 그 생각을 뒷받침한다는 의미로 맞습니다.","hl":"st-0"},{"n":155,"text":"두 번째 밑줄은 discovery was made public으로 수동태가 쓰였어요. 발견이 대중에게 공개되었다는 의미로 맞습니다.","hl":"st-1"},{"n":156,"text":"세 번째 밑줄은 the news 뒤에 완전한 절이 이어져요. 뉴스의 내용을 설명하는 동격절이므로 which가 아니라 that이 와야 합니다.","hl":"st-2"},{"n":157,"text":"네 번째 밑줄은 Not just a little bit, but a significant amount로 not just A but B 구조를 이루고 있어서 맞습니다.","hl":"st-3"},{"n":158,"text":"다섯 번째 밑줄의 what은 그들이 묘사하는 것이라는 뜻으로 선행사를 포함한 관계대명사예요. 맞습니다.","hl":"st-4"},{"n":159,"text":"이 문제의 함정도 짚고 갈게요. news 뒤에 완전한 절이 오면 동격절 that, which 아님","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">5형식 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">keep, make, find 같은 동사는 \u003cb class=\"key\">목적어 + 목적격보어\u003c/b> 형태로 쓰여 목적어를 어떤 상태로 유지하거나 만든다는 뜻을 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">keep + 목적어 + 형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>keep you full: you가 목적어, full이 목적격보어\u003c/li>\u003cli>목적격보어 자리에는 형용사 가능\u003c/li>\u003cli>동사원형·분사와 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Vegetables keep you full.\u003c/div>\u003cdiv class=\"g-ko\">채소는 당신을 배부르게 유지한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":160,"text":"keep은 목적어와 목적격보어를 함께 쓰는 대표적인 동사예요. keep you full은 너를 배부르게 유지한다는 뜻으로, you가 목적어이고 full이 목적격보어예요. 이 자리에는 형용사가 자연스럽게 올 수 있어요. 목적격보어 자리에 동사원형이 오는지 형용사가 오는지 문장 구조를 보고 판단해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조건 접속사 if\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if는 \u003cb class=\"key\">만약 ~라면\u003c/b>이라는 조건의 부사절을 이끌고, 뒤에 주어와 동사가 온다.\u003cdiv>\u003cspan class=\"g-formula\">if + 주어 + 동사, 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>weight gain if you eat...\u003c/li>\u003cli>that절과 혼동하지 않기\u003c/li>\u003cli>조건의 if 뒤에는 완전한 절\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You can gain weight if you eat more than you burn.\u003c/div>\u003cdiv class=\"g-ko\">소모하는 것보다 더 많이 먹으면 살이 찔 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":161,"text":"if는 조건을 나타내는 접속사로, 만약 그렇게 하면이라는 의미를 만들어요. if 뒤에는 주어와 동사가 있는 완전한 절이 와요. 관계대명사 that이나 동격절 that으로 착각하면 안 되는 자리에서 if가 필요할 수 있어요. 문장 앞뒤의 의미가 조건인지 아닌지도 함께 판단해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Not all vegetables are created equal when it comes to ① \u003cu class=\"p-u\">keeping\u003c/u> your weight where you want it. You need to find out ② \u003cu class=\"p-u\">whether\u003c/u> some of your favorites are messing with your diet goals. Do you ever feel like you're always hungry when you're dieting? That's probably because you're not eating the right types of vegetables to keep you ③ \u003cu class=\"p-u\">full\u003c/u>. Anything without skin or pulp, like cucumbers, ④ \u003cu class=\"p-u\">is\u003c/u> likely to make you reach for another snack because it is lower in fiber and won't make you feel full for long. This is why juices aren't filling but smoothies can be. Also, you may want to start reconsidering how many sweet potatoes you eat. They are still very high in calories and carbohydrates and can lead to weight gain ⑤ \u003cu class=\"p-u\">that\u003c/u> you eat more calories than you burn.\u003c/div>\u003cdiv class=\"p-q\">다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① keeping\u003c/div>\u003cdiv class=\"p-op\">② whether\u003c/div>\u003cdiv class=\"p-op\">③ full\u003c/div>\u003cdiv class=\"p-op\">④ is\u003c/div>\u003cdiv class=\"p-op\">⑤ that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤ (that → if)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":162,"text":"스무 번째 문제는 지문의 다섯 밑줄 중 어법상 틀린 것을 찾는 문제예요. 전치사 to 뒤, 목적격보어, 그리고 weight gain 뒤의 접속사를 차례로 확인해 보세요.","hl":"q"},{"n":163,"text":"","hl":"q","pause":7},{"n":164,"text":"정답은 다섯 번째 밑줄이에요. weight gain 뒤에는 관계대명사 that이 아니라 조건을 나타내는 if가 와서, 소모하는 것보다 더 많이 먹으면이라는 뜻을 만들어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Not all vegetables are created equal when it comes to ① \u003cu class=\"p-u\">keeping\u003c/u> your weight where you want it. You need to find out ② \u003cu class=\"p-u\">whether\u003c/u> some of your favorites are messing with your diet goals. Do you ever feel like you're always hungry when you're dieting? That's probably because you're not eating the right types of vegetables to keep you ③ \u003cu class=\"p-u\">full\u003c/u>. Anything without skin or pulp, like cucumbers, ④ \u003cu class=\"p-u\">is\u003c/u> likely to make you reach for another snack because it is lower in fiber and won't make you feel full for long. This is why juices aren't filling but smoothies can be. Also, you may want to start reconsidering how many sweet potatoes you eat. They are still very high in calories and carbohydrates and can lead to weight gain ⑤ \u003cu class=\"p-u\">that\u003c/u> you eat more calories than you burn.\u003c/div>\u003cdiv class=\"p-q sm\">다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① keeping\u003c/div>\u003cdiv class=\"p-op\">② whether\u003c/div>\u003cdiv class=\"p-op\">③ full\u003c/div>\u003cdiv class=\"p-op\">④ is\u003c/div>\u003cdiv class=\"p-op\">⑤ that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">when it comes to keeping\u003c/b>에서 to는 전치사라서 뒤에 동명사 keeping이 와서 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">find out whether ...\u003c/b>는 ~인지 아닌지를 알아내다라는 의미로 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>\u003cb class=\"key\">keep you full\u003c/b>은 목적어 you와 목적격보어 full을 쓴 5형식으로 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>주어 \u003cb class=\"key\">Anything\u003c/b>이 단수이므로 동사 is가 맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>weight gain 뒤에 \u003cb class=\"key\">you eat more calories than you burn\u003c/b>라는 완전한 절이 와서 관계대명사 that은 틀려요. 조건의 if가 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤ (that → if)\u003c/span>\u003cdiv class=\"p-full\">They are still very high in calories and carbohydrates and can lead to weight gain if you eat more calories than you burn.\u003c/div>\u003cdiv class=\"p-ko\">그것들은 여전히 칼로리와 탄수화물이 매우 높아서, 소모하는 것보다 더 많은 칼로리를 먹으면 체중 증가로 이어질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>weight gain 뒤 that을 관계대명사로 보면 오류, 조건 if가 필요\u003c/div>","segs":[{"n":165,"text":"첫 번째 밑줄은 when it comes to 뒤에 있어요. 여기서 to는 전치사라서 동명사 keeping이 온 것이 맞습니다.","hl":"st-0"},{"n":166,"text":"두 번째 밑줄은 find out whether some of your favorites are messing with your diet goals로, ~인지 아닌지를 알아내다라는 의미예요. 맞습니다.","hl":"st-1"},{"n":167,"text":"세 번째 밑줄은 keep you full에서 목적어 you 뒤에 목적격보어 full이 온 구조예요. 형용사 full이 자연스럽습니다.","hl":"st-2"},{"n":168,"text":"네 번째 밑줄의 주어는 Anything으로 단수예요. 그래서 동사 is가 온 것이 맞습니다.","hl":"st-3"},{"n":169,"text":"다섯 번째 밑줄은 weight gain 뒤에 관계대명사 that이 와요. 하지만 뒤에 you eat more calories than you burn라는 완전한 절이 와서 관계대명사로 볼 수 없어요. 여기서는 만약 ~라면이라는 조건의 if가 필요합니다.","hl":"st-4"},{"n":170,"text":"이 문제의 함정도 짚고 갈게요. weight gain 뒤 that을 관계대명사로 보면 오류, 조건 if가 필요","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">접속사·병렬·관계사·동격절·준동사 종합\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>접속사 뒤에 절이 있으면 \u003cb class=\"key\">although/while/because\u003c/b>, 명사가 있으면 \u003cb class=\"key\">despite/during/because of\u003c/b>를 쓴다.\u003c/li>\u003cli>not only A but also B, and, or에서는 앞뒤에 \u003cb class=\"key\">같은 형태\u003c/b>를 맞춘다.\u003c/li>\u003cli>전치사 뒤에는 \u003cb class=\"key\">동명사\u003c/b>, to부정사의 to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/li>\u003cli>추상명사 뒤에 완전한 절이 오면 \u003cb class=\"key\">동격절 that\u003c/b>, 불완전한 절이 오면 \u003cb class=\"key\">관계대명사\u003c/b>를 쓴다.\u003c/li>\u003cli>whether는 \u003cb class=\"key\">~인지 아닌지\u003c/b>, if는 \u003cb class=\"key\">조건\u003c/b>을 나타내는 경우가 많다.\u003c/li>\u003c/ul>","segs":[{"n":171,"text":"오늘 문제에서 가장 중요한 포인트는 뒤에 절이 오는지 명사가 오는지 확인하는 거예요. 상관접속사와 병렬 구조에서는 앞뒤 형태를 꼭 맞춰 주고, 전치사 뒤에는 동명사를 떠올려 주세요. 동격절 that과 관계대명사 that, whether와 if의 차이까지 정리해 두면 시험에서 흔들리지 않을 거예요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
