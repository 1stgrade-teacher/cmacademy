window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"일등급샘","title":"Ch07-01 인칭대명사, 재귀대명사","audioDir":"Ch07-01_인칭대명사,_재귀대명사_audio","preview":false,"count":24,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Ch07-01 인칭대명사, 재귀대명사\u003c/div>\u003ch1>인칭대명사와 재귀대명사, 헷갈리는 것만 콕 집어 끝내기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>인칭대명사의 격변화와 재귀대명사의 두 가지 쓰임을 예문으로 익히고, 자주 틀리는 문장을 스스로 고칠 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 인칭대명사와 재귀대명사를 함께 공부할 거예요. 이름은 익숙한데 막상 문장에 쓰려고 하면 mine을 써야 할지 me를 써야 할지 헷갈리죠. 오늘 예문 몇 개만 제대로 정리하면 그 고민이 확 사라질 거예요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">인칭대명사의 격변화\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">인칭대명사는 문장 안에서의 역할에 따라 모양이 달라집니다. 주어 자리에는 \u003cb class=\"key\">주격\u003c/b>, 목적어 자리에는 \u003cb class=\"key\">목적격\u003c/b>을 쓰고, 소유격 뒤에 명사가 오는 대신 그 명사까지 혼자 대신하면 \u003cb class=\"key\">소유대명사\u003c/b>가 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">주격 / 소유격(+명사) / 목적격 / 소유대명사(=소유격+명사)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A: Is this bag \u003cspan class=\"fx\">yours\u003c/span>? B: Yes, it's mine.\u003c/div>\u003cdiv class=\"g-ko\">A: 이 가방은 네 것이니? B: 응, 그것은 내 거야.\u003c/div>\u003cdiv class=\"g-note\">yours는 your bag, mine은 my bag을 대신하는 소유대명사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The cell phone is \u003cspan class=\"fx\">Kevin's\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 휴대 전화는 Kevin의 것이다.\u003c/div>\u003cdiv class=\"g-note\">사람 이름처럼 고유명사도 이름 뒤에 's를 붙이면 소유격과 소유대명사 모양이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This is my seat, and that one is \u003cspan class=\"fx\">yours\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이것은 내 자리이고, 저것은 너의 것이다.\u003c/div>\u003cdiv class=\"g-note\">my는 명사 seat을 꾸미는 소유격, yours는 your seat을 대신하는 소유대명사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>소유격 뒤에는 반드시 \u003cb class=\"key\">명사\u003c/b>가 오고, 소유대명사는 \u003cb class=\"key\">소유격+명사\u003c/b>를 혼자서 대신한다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"인칭대명사는 사람이나 사물을 가리키는 말인데요, 문장에서 어떤 역할을 하느냐에 따라 모양이 달라져요. 주어로 쓰이면 주격, 목적어로 쓰이면 목적격, 그리고 명사 앞에서 그 명사의 주인을 밝히면 소유격이에요. 그런데 소유격 뒤의 명사를 굳이 다시 말하지 않고 혼자서 나의 것, 네 것처럼 표현할 때가 있는데, 그것이 바로 소유대명사입니다. 그래서 소유대명사는 소유격에 명사를 붙인 것과 똑같은 뜻을 혼자서 담당한다고 기억해 두면 좋아요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. Is this bag yours? 라고 물으면 이 가방은 네 것이니, 라는 뜻이죠. 대답으로 Yes, it's mine. 은 응, 그것은 내 거야, 라는 뜻이고요. 여기서 yours는 your bag을, mine은 my bag을 혼자 대신한 소유대명사라는 점을 꼭 기억해 주세요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. The cell phone is Kevin's. 는 그 휴대 전화는 Kevin의 것이다, 라는 뜻이에요. Kevin처럼 사람 이름 뒤에 's를 붙이면 그 사람의 것이라는 소유대명사가 됩니다. 이름일 때도 규칙이 똑같다는 것, 잊지 마세요.","hl":"ex-1"},{"n":5,"text":"여기서 하나 더 볼게요. This is my seat, and that one is yours. 는 이것은 내 자리이고 저것은 너의 것이다, 라는 뜻이에요. my는 뒤에 seat이라는 명사가 붙어 있는 소유격이고, yours는 your seat을 혼자 대신한 소유대명사예요. 이 차이를 눈으로 한 번 더 확인해 두세요.","hl":"ex-2"},{"n":6,"text":"한 가지만 강조할게요. 소유격은 반드시 뒤에 명사가 따라와야 하고, 소유대명사는 그 명사까지 혼자서 대신한다는 차이가 있어요. 이 차이만 잡으면 소유격과 소유대명사 문제는 거의 다 맞힐 수 있습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">재귀대명사의 쓰임과 관용 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어와 목적어가 같은 대상일 때 목적어 자리에 \u003cb class=\"key\">재귀대명사\u003c/b>를 쓰고, 이때는 생략할 수 없습니다. 주어의 행동을 강조할 때도 재귀대명사를 쓰는데 이때는 생략이 가능하며, 단수는 \u003cb class=\"key\">-self\u003c/b>, 복수는 \u003cb class=\"key\">-selves\u003c/b> 꼴로 만듭니다.\u003cdiv>\u003cspan class=\"g-formula\">-self(단수) / -selves(복수)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She looked at \u003cspan class=\"fx\">herself\u003c/span> in the mirror.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 거울 속 자신을 바라보았다.\u003c/div>\u003cdiv class=\"g-note\">목적어가 주어와 같은 대상일 때 쓰는 재귀용법으로, 생략할 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I fixed the bike \u003cspan class=\"fx\">myself\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 자전거를 내가 직접 고쳤다.\u003c/div>\u003cdiv class=\"g-note\">주어의 행동을 강조하는 강조용법으로, 생략해도 문장이 성립합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Help yourself to\u003c/span> the food!\u003c/div>\u003cdiv class=\"g-ko\">음식을 마음껏 드세요!\u003c/div>\u003cdiv class=\"g-note\">help oneself to는 ~을 마음껏 먹다라는 뜻의 관용 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>by oneself, help oneself to, enjoy oneself, make oneself at home 같은 \u003cb class=\"key\">관용 표현\u003c/b>은 통째로 외워 두세요.\u003c/div>","segs":[{"n":7,"text":"재귀대명사는 두 가지로 나눠서 이해하면 아주 쉬워요. 첫째는 주어와 목적어가 같은 사람일 때 목적어 자리에 쓰는 경우인데, 우리말로 하면 자기 자신이라는 뜻이 되고 절대 생략할 수 없어요. 둘째는 주어가 한 행동을 강조해서 직접, 스스로라고 말할 때 쓰는 경우인데, 이때는 없어도 문장이 성립하니까 생략할 수 있습니다. 그리고 모양은 단수면 self로 끝나고 복수면 selves로 끝난다는 것도 함께 기억해 두세요.","hl":"rule"},{"n":8,"text":"자, 첫 번째 예문이에요. She looked at herself in the mirror. 는 그녀는 거울 속 자신을 바라보았다, 라는 뜻입니다. 주어가 She이고 전치사 at 뒤의 목적어도 같은 그녀 자신이니까 herself를 쓴 거예요. 이때 herself를 빼 버리면 누구를 봤는지가 사라지니까 절대 생략할 수 없다는 점, 꼭 기억하세요.","hl":"ex-0"},{"n":9,"text":"두 번째 예문입니다. I fixed the bike myself. 는 나는 자전거를 내가 직접 고쳤다, 라는 뜻이에요. 여기서 myself는 목적어가 아니라 내가 직접, 이라는 뜻으로 주어 I를 강조하고 있어요. 그래서 이 myself는 없애도 문장이 자연스럽게 성립합니다.","hl":"ex-1"},{"n":10,"text":"세 번째 예문은 통째로 외워야 하는 표현이에요. Help yourself to the food! 는 음식을 마음껏 드세요, 라는 뜻입니다. help yourself to는 마음껏 먹다라는 뜻으로 굳어진 관용 표현이니까 단어 하나하나보다 덩어리로 기억해 두세요.","hl":"ex-2"},{"n":11,"text":"관용 표현은 규칙으로 풀려고 하면 오히려 헷갈려요. by oneself, help oneself to, enjoy oneself, make oneself at home은 하나의 단어처럼 통째로 외워 두면 시험장에서 바로 떠올릴 수 있습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I bought a new dress. It's color is red.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I bought a new dress. Its color is red.\u003c/div>\u003cdiv class=\"g-why\">it의 소유격은 어퍼스트로피가 없는 Its이고, It's는 It is의 줄임말이기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Anna is a popular blogger. This fashion blog is she's.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Anna is a popular blogger. This fashion blog is hers.\u003c/div>\u003cdiv class=\"g-why\">she의 소유대명사는 she's가 아니라 hers이기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I think of me as a nice person.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I think of myself as a nice person.\u003c/div>\u003cdiv class=\"g-why\">주어 I와 전치사 of의 목적어가 같은 대상이므로 재귀대명사 myself를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"먼저 철자 하나 때문에 틀리는 경우예요. It's color is red라고 쓰면 It is color is red가 되어 버려서 말이 안 되죠. it의 소유격은 어퍼스트로피 없이 Its로 써야 하고, It's는 오직 It is의 줄임말로만 쓴다는 것, 꼭 구분해 주세요.","hl":"mk-0"},{"n":13,"text":"두 번째는 소유대명사 모양을 착각하는 실수예요. she 뒤에 's를 붙인 she's는 소유대명사가 아니라 she is나 she has의 줄임말이에요. she의 소유대명사는 hers 하나뿐이니까 This fashion blog is hers라고 써야 합니다.","hl":"mk-1"},{"n":14,"text":"세 번째는 재귀대명사를 빠뜨린 실수입니다. 문장의 주어가 I인데 전치사 of 뒤의 목적어도 같은 나 자신을 가리키고 있죠. 이렇게 주어와 목적어가 같을 때는 me가 아니라 myself를 써야 하고, 이 자리의 재귀대명사는 생략할 수 없어요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 3\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말이 바르게 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">(A) ____ bike is new, but (B) ____ is very old.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Peter / my\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>Peter / mine\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Peter's / my\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>Peter's / mine\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Peters / mine\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Peter's / mine\u003c/span>\u003cdiv class=\"g-exp\">(A)는 명사 bike를 꾸미는 소유격 Peter's, (B)는 '나의 것'을 뜻하는 소유대명사 mine이 알맞다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제는 객관식이에요. 첫 번째 빈칸 bike is new, but 두 번째 빈칸 is very old. 라는 문장이 나옵니다. 보기가 다섯 개 있으니까 명사 앞인지 아닌지를 잘 따져 보고, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 네 번째 보기예요. 첫 번째 빈칸은 bike라는 명사를 꾸며야 하니까 소유격 Peter's가 필요하고, 두 번째 빈칸은 나의 것이라는 뜻을 혼자 나타내니까 소유대명사 mine이 와야 해요. 그래서 Peter's와 mine이 짝지어진 네 번째 보기가 정답입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 3\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 일치하도록 주어진 말을 이용해 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">너는 너 자신을 믿어야 한다. (trust, oneself) → You should ____.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">trust yourself\u003c/span>\u003cdiv class=\"g-exp\">주어가 You이므로 재귀대명사 yourself를 목적어로 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"두 번째 문제는 영작이에요. 너는 너 자신을 믿어야 한다, 를 trust와 oneself를 이용해서 완성해 보세요. 주어가 무엇인지, 목적어가 누구인지를 먼저 확인하고 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 trust yourself예요. 주어가 You이니까 재귀대명사도 yourself를 써야 하고, 주어와 목적어가 같은 대상을 가리키니까 이 재귀대명사는 생략하면 안 됩니다. 그래서 You should trust yourself가 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 3\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">My parents gave mine a gift.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">mine → me\u003c/span>\u003cdiv class=\"g-exp\">동사 gave의 간접목적어 자리이므로 목적격 me를 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"세 번째 문제는 어법상 틀린 부분을 찾아 고치는 문제예요. My parents gave mine a gift. 라는 문장인데요, 어색한 부분이 딱 한 군데 있습니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 mine을 me로 고치는 거예요. gave는 give의 과거형이고 뒤에 간접목적어와 직접목적어가 나오는 구조죠. 간접목적어 자리에는 목적격이 와야 하니까 소유대명사 mine이 아니라 목적격 me를 써야 합니다. 그래서 My parents gave me a gift가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Ch07-01 인칭대명사, 재귀대명사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>소유격 뒤에는 \u003cb class=\"key\">명사\u003c/b>가 오고, 소유대명사는 소유격과 명사를 합친 뜻을 \u003cb class=\"key\">혼자\u003c/b> 대신한다.\u003c/li>\u003cli>재귀대명사는 주어와 목적어가 같을 때는 \u003cb class=\"key\">생략할 수 없고\u003c/b>, 주어를 강조할 때는 \u003cb class=\"key\">생략할 수 있다\u003c/b>.\u003c/li>\u003cli>help oneself to처럼 굳어진 \u003cb class=\"key\">관용 표현\u003c/b>은 통째로 외운다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":24,"text":"오늘 배운 내용을 정리해 볼게요. 소유격 뒤에는 반드시 명사가 오고, 소유대명사는 소유격과 명사를 합친 뜻을 혼자서 대신한다는 점을 기억하세요. 재귀대명사는 주어와 목적어가 같을 때는 절대 생략할 수 없고, 주어를 강조할 때는 생략할 수 있다는 차이도 꼭 챙겨 두시고요. help oneself to 같은 관용 표현은 덩어리로 외워 두면 좋습니다. 오늘 수업 여기까지예요, 예문을 소리 내어 다시 한 번 읽어 보면서 복습해 보세요. 수고했습니다!","hl":"sum"}]}],"practice":{"unit":"Ch07-01 인칭대명사, 재귀대명사","level":"중학생","ctx":"단원: Ch07-01 인칭대명사, 재귀대명사\n강의 제목: 인칭대명사와 재귀대명사, 헷갈리는 것만 콕 집어 끝내기\n목표: 인칭대명사의 격변화와 재귀대명사의 두 가지 쓰임을 예문으로 익히고, 자주 틀리는 문장을 스스로 고칠 수 있다.\n개념 1. 인칭대명사의 격변화: 인칭대명사는 문장 안에서의 역할에 따라 모양이 달라집니다. 주어 자리에는 주격, 목적어 자리에는 목적격을 쓰고, 소유격 뒤에 명사가 오는 대신 그 명사까지 혼자 대신하면 소유대명사가 됩니다. [주격 / 소유격(+명사) / 목적격 / 소유대명사(=소유격+명사)] (주의: 소유격 뒤에는 반드시 명사가 오고, 소유대명사는 소유격+명사를 혼자서 대신한다는 점을 기억하세요.)\n  예문: A: Is this bag yours? B: Yes, it's mine. (A: 이 가방은 네 것이니? B: 응, 그것은 내 거야.) / The cell phone is Kevin's. (그 휴대 전화는 Kevin의 것이다.) / This is my seat, and that one is yours. (이것은 내 자리이고, 저것은 너의 것이다.)\n개념 2. 재귀대명사의 쓰임과 관용 표현: 주어와 목적어가 같은 대상일 때 목적어 자리에 재귀대명사를 쓰고, 이때는 생략할 수 없습니다. 주어의 행동을 강조할 때도 재귀대명사를 쓰는데 이때는 생략이 가능하며, 단수는 -self, 복수는 -selves 꼴로 만듭니다. [-self(단수) / -selves(복수)] (주의: by oneself, help oneself to, enjoy oneself, make oneself at home 같은 관용 표현은 통째로 외워 두세요.)\n  예문: She looked at herself in the mirror. (그녀는 거울 속 자신을 바라보았다.) / I fixed the bike myself. (나는 자전거를 내가 직접 고쳤다.) / Help yourself to the food! (음식을 마음껏 드세요!)\n자주 하는 실수: I bought a new dress. It's color is red. → I bought a new dress. Its color is red. / Anna is a popular blogger. This fashion blog is she's. → Anna is a popular blogger. This fashion blog is hers. / I think of me as a nice person. → I think of myself as a nice person.\n정리: 소유격 뒤에는 명사가 오고, 소유대명사는 소유격과 명사를 합친 뜻을 혼자 대신한다. / 재귀대명사는 주어와 목적어가 같을 때는 생략할 수 없고, 주어를 강조할 때는 생략할 수 있다. / help oneself to처럼 굳어진 관용 표현은 통째로 외운다.","items":[{"t":"choose","q":"다음 중 \u003c보기>의 밑줄 친 herself와 쓰임이 같은 것 두 개를 고르세요.","ref":"Mina taught [[herself]] to play the guitar.","opts":["He introduced [[himself]] to the new student.","We painted the wall [[ourselves]].","You should be proud of [[yourself]].","The teacher [[himself]] answered the phone.","The children cleaned the room [[themselves]]."],"ans":[1,3],"exp":"\u003c보기>의 herself는 주어와 같은 대상을 목적어로 받는 재귀용법이에요. ①과 ③도 같은 재귀용법이고, ②④⑤는 주어의 행동을 강조하는 강조용법이에요."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"Mine bag is on the desk, but yours is under the chair.","wrong":"Mine","right":["My"],"exp":"명사 bag 앞에는 소유격 my를 써야 해요. mine은 '내 것'이라는 소유대명사예요."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["I","me","my","mine","myself"],"items":[{"s":"Please give the book to ____.","a":"me"},{"s":"This is ____ backpack, not yours.","a":"my"},{"s":"That seat is ____, so you can't sit here.","a":"mine"},{"s":"I can solve this problem by ____.","a":"myself"},{"s":"____ am responsible for this mistake.","a":"I"}],"exp":"목적어 자리에는 me, 명사 앞에는 소유격 my, '내 것'을 대신하면 소유대명사 mine, 주어와 같은 대상을 다시 가리키면 재귀대명사 myself를 써요."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"My brother and I painted the room","r":"by ourselves."},{"l":"The boy pointed at","r":"himself in the photo."},{"l":"This bag is mine, and","r":"that one is yours."},{"l":"Help","r":"yourself to the sandwiches."},{"l":"Kevin fixed the computer","r":"himself."}],"exp":"by ourselves는 '우리 힘으로/혼자서', himself는 '그 자신이 직접', yourself는 help oneself to(~을 마음껏 먹다) 관용 표현으로 쓰였어요. mine과 yours는 각각 '내 것', '네 것'을 대신하는 소유대명사예요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"My friends and I enjoyed [[ourself]] at the water park.","ok":false,"right":["ourselves"],"exp":"주어 My friends and I가 복수이므로 재귀대명사는 ourselves를 써야 해요. enjoy oneself는 '즐거운 시간을 보내다'라는 관용 표현이에요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"The little boy tied his shoes [[by himself]].","hint":"(by, he)"},"items":[{"scene":"🧍‍♀️🎂 혼자서 생일 케이크를 만든 소녀","pre":"The girl made the birthday cake ","post":".","hint":"(by, she)","a":["by herself"]},{"scene":"🍕😋 친구가 피자를 마음껏 먹으라고 권하는 상황","pre":"Help ","post":" to the pizza.","hint":"(you)","a":["yourself"]}],"exp":"by oneself는 '혼자서', help oneself to는 '~을 마음껏 먹다'라는 뜻의 관용 표현이에요. 주어와 같은 대상을 가리킬 때 재귀대명사를 써요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"그 소녀는 혼자서 그 문제를 풀었다.","chunks":["The girl","solved","the problem","by herself"],"end":".","alts":[],"exp":"by herself는 '그녀 혼자서'라는 뜻으로, 주어 The girl와 같은 대상을 재귀대명사로 받은 표현이에요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"This phone is not mine; it is [[hers]].","ok":true,"right":[],"exp":"hers는 her phone을 혼자 대신하는 소유대명사로 바르게 쓰였어요. 목적격 her나 소유격 her와 구별해야 해요."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ul(t){return esc(t).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");}
  function plain(t){return s(t).replace(/\[\[|\]\]/g,"");}
  function nz(t){return plain(t).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}
  function blank(t){return s(t).replace(/_{2,}|\(\s*\)|\[\s*\]/g,"____");}
  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){
    if(!x||typeof x!=="object")return null;
    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();
    if(t==="same"||t==="mcq")t="choose";
    if(t==="choose"){
      var opts=A(x.opts||x.options).map(s).filter(function(v){return v.trim();}).slice(0,8),ans=A(Array.isArray(x.ans)?x.ans:[x.ans]),seen={};
      ans=ans.map(function(n){return parseInt(n,10);}).filter(function(n){if(!(n>=1&&n<=opts.length)||seen[n])return false;seen[n]=1;return true;});
      if(opts.length<3||!ans.length)return null;
      return {t:t,q:q||(ans.length>1?"알맞은 것을 "+ans.length+"개 고르세요.":"알맞은 것을 고르세요."),ref:s(x.ref).trim(),opts:opts,ans:ans.sort(),exp:exp};}
    if(t==="fix"){
      var S=s(x.s||x.sentence).trim(),w=s(x.wrong).trim(),r=alts(x.right);
      if(!S||!w||S.indexOf(w)<0||!r.length)return null;
      return {t:t,q:q||"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.",s:S,wrong:w,right:r,exp:exp};}
    if(t==="bank"){
      var bank=A(x.bank).map(s).map(function(v){return v.trim();}).filter(Boolean),low=bank.map(function(v){return nz(v);});
      var its=A(x.items).map(function(it){var ss=blank(it&&it.s);var a=s(it&&it.a).trim(),k=low.indexOf(nz(a));
        if(ss.split("____").length!==2||k<0)return null;return {s:ss,a:bank[k]};}).filter(Boolean).slice(0,8);
      if(bank.length<2||its.length<2)return null;
      return {t:t,q:q||"빈칸에 알맞은 것을 <보기>에서 고르세요.",bank:bank,items:its,exp:exp};}
    if(t==="match"){
      var pr=A(x.pairs).map(function(p){return p&&s(p.l).trim()&&s(p.r).trim()?{l:s(p.l).trim(),r:s(p.r).trim()}:null;}).filter(Boolean).slice(0,7);
      if(pr.length<3)return null;
      return {t:t,q:q||"알맞은 것끼리 연결하세요.",pairs:pr,exp:exp};}
    if(t==="scene"){
      var ex=x.ex&&typeof x.ex==="object"?{s:s(x.ex.s).trim(),hint:s(x.ex.hint).trim()}:{s:"",hint:""};
      var sit=A(x.items).map(function(it){if(!it)return null;var a=alts(it.a);if(!a.length)return null;
        return {scene:s(it.scene).trim(),pre:s(it.pre),post:s(it.post),hint:s(it.hint).trim(),a:a};}).filter(Boolean).slice(0,3);
      if(!sit.length)return null;
      return {t:t,q:q||"상황을 보고 <보기>와 같이 문장을 완성하세요.",ex:ex,items:sit,exp:exp};}
    if(t==="order"){
      var ch=A(x.chunks).map(s).map(function(v){return v.trim();}).filter(Boolean).slice(0,8);
      if(ch.length<3)return null;
      return {t:t,q:q||"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.",ko:s(x.ko).trim(),chunks:ch,end:s(x.end==null?".":x.end).trim(),alts:alts(x.alts),exp:exp};}
    if(t==="ox"){
      var S2=s(x.s||x.sentence).trim(),m=S2.match(/\[\[(.+?)\]\]/g),ok=x.ok===true||/^(o|true|옳)/i.test(s(x.ok).trim()),r2=alts(x.right);
      if(!m||m.length!==1||(!ok&&!r2.length))return null;
      return {t:t,q:q||"밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.",s:S2,ok:ok,right:r2,exp:exp};}
    return null;
  }
  function norm(o){var L=Array.isArray(o)?o:o&&typeof o==="object"?A(o.items||o.practice||o.questions):[];return L.map(item).filter(Boolean);}
  function ctxOf(P){return {ctx:s(P.ctx),level:s(P.level),unit:s(P.unit)};}

  /* ---------- 문제 하나 그리기와 채점 ---------- */
  function view(it,box){
    var st={},h="";
    if(it.t==="choose"){
      st.pick=[];
      if(it.ref)h+='<div class="pq-ref"><b>&lt;보기&gt;</b> '+ul(it.ref)+'</div>';
      h+='<div class="pq-opts">'+it.opts.map(function(o,i){return '<button class="pq-opt" data-i="'+(i+1)+'"><b>'+(CIRC[i]||(i+1))+'</b> '+ul(o)+'</button>';}).join("")+'</div>';
      if(it.ans.length>1)h+='<p class="pq-note">※ '+it.ans.length+'개를 고르세요.</p>';
      box.innerHTML=h;
      box.onclick=function(e){var b=e.target.closest(".pq-opt");if(!b||st.done)return;var n=+b.getAttribute("data-i"),k=st.pick.indexOf(n);
        if(k>=0)st.pick.splice(k,1);else{if(it.ans.length===1)st.pick=[];st.pick.push(n);if(st.pick.length>it.ans.length)st.pick.shift();}
        [].forEach.call(box.querySelectorAll(".pq-opt"),function(o){o.classList.toggle("on",st.pick.indexOf(+o.getAttribute("data-i"))>=0);});};
      st.ready=function(){return st.pick.length>0;};
      st.check=function(){var p=st.pick.slice().sort(),ok=p.length===it.ans.length&&p.every(function(v,i){return v===it.ans[i];});
        [].forEach.call(box.querySelectorAll(".pq-opt"),function(o){var n=+o.getAttribute("data-i");if(it.ans.indexOf(n)>=0)o.classList.add("ok");else if(st.pick.indexOf(n)>=0)o.classList.add("no");});
        return {ok:ok,answer:it.ans.map(function(n){return CIRC[n-1]||n;}).join(", ")};};
    }
    else if(it.t==="fix"){
      var words=it.s.split(/\s+/);st.sel={};
      box.innerHTML='<p class="pq-note">※ 틀린 부분의 단어를 눌러 고르고, 바르게 고친 말을 쓰세요.</p><div class="pq-sen pq-words">'+words.map(function(w,i){return '<span class="pq-w" data-i="'+i+'">'+esc(w)+'</span>';}).join(" ")+'</div>'+
        '<div class="pq-row"><span class="pq-lb">고친 말</span><input class="pq-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="바르게 고친 말을 쓰세요"></div>';
      box.onclick=function(e){var w=e.target.closest(".pq-w");if(!w||st.done)return;var i=w.getAttribute("data-i");if(st.sel[i])delete st.sel[i];else st.sel[i]=1;w.classList.toggle("on",!!st.sel[i]);};
      st.ready=function(){return Object.keys(st.sel).length>0&&box.querySelector(".pq-in").value.trim();};
      st.check=function(){var ks=Object.keys(st.sel).map(Number).sort(function(a,b){return a-b;}),a=ks[0],b=ks[ks.length-1],inp=box.querySelector(".pq-in").value.trim();
        var mine=words.slice(0,a).concat([inp],words.slice(b+1)).join(" "),ok=it.right.some(function(r){return nz(mine)===nz(it.s.replace(it.wrong,r));});
        box.querySelector(".pq-in").disabled=true;
        var ws=box.querySelectorAll(".pq-w"),p=0;[].forEach.call(ws,function(el,i){var st0=it.s.indexOf(words[i],p);p=st0+words[i].length;var w0=it.s.indexOf(it.wrong);if(st0<w0+it.wrong.length&&p>w0)el.classList.add("ans");});

        '<div class="pq-chips"><span class="pq-lb">&lt;보기&gt;</span>'+it.bank.map(function(w,i){return '<button class="pq-chip c'+(i%6)+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join("")+'</div>';
      function paint(){[].forEach.call(box.querySelectorAll(".pq-blank"),function(b){var i=+b.getAttribute("data-i");b.textContent=st.v[i]||"";b.classList.toggle("act",i===st.act&&!st.done);b.classList.toggle("fill",!!st.v[i]);});}
      box.onclick=function(e){if(st.done)return;var b=e.target.closest(".pq-blank"),c=e.target.closest(".pq-chip");

        R.map(function(ri){return '<button class="pq-m r" data-i="'+ri+'">'+esc(it.pairs[ri].r)+'</button>';}).join("")+'</div></div>';
      function paint2(){var used={};Object.keys(st.link).forEach(function(l,k){used[st.link[l]]=l;});

    }
    else if(it.t==="scene"){
      h="";if(it.ex&&it.ex.s)h+='<div class="pq-ref"><b>&lt;보기&gt;</b><br>'+ul(it.ex.s)+(it.ex.hint?' <span class="pq-hint">'+esc(it.ex.hint)+'</span>':'')+'</div>';
      h+=it.items.map(function(x,i){return '<div class="pq-scene">'+(x.scene?'<div class="pq-pic">'+esc(x.scene)+'</div>':'')+
        '<div class="pq-sen">'+(it.items.length>1?'<b>'+(i+1)+'.</b> ':'')+esc(x.pre)+'<input class="pq-in" data-i="'+i+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답을 쓰세요">'+esc(x.post)+(x.hint?' <span class="pq-hint">'+esc(x.hint)+'</span>':'')+'</div></div>';}).join("");

      st.check=function(){var all=true;[].forEach.call(box.querySelectorAll(".pq-in"),function(inp){var x=it.items[+inp.getAttribute("data-i")],v=inp.value.trim();
          var ok=x.a.some(function(a){return nz(v)===nz(a)||nz(v)===nz(x.pre+" "+a+" "+x.post);});if(!ok)all=false;inp.disabled=true;inp.classList.add(ok?"ok":"no");});
        return {ok:all,answer:it.items.map(function(x,i){return (it.items.length>1?(i+1)+". ":"")+x.a.join(" / ");}).join("   ")};};
    }
    else if(it.t==="order"){
      var pool=mix(it.chunks.length);st.seq=[];
      function paint3(){box.querySelector(".pq-line").innerHTML=st.seq.map(function(k,p){return '<button class="pq-chip on" data-p="'+p+'">'+esc(it.chunks[k])+'</button>';}).join("")+(st.seq.length?'':'<span class="pq-ph">아래 어구를 차례대로 누르세요</span>')+'<span class="pq-end">'+esc(it.end)+'</span>';
        box.querySelector(".pq-pool").innerHTML=pool.map(function(k){return st.seq.indexOf(k)>=0?'':'<button class="pq-chip" data-k="'+k+'">'+esc(it.chunks[k])+'</button>';}).join("");}
      box.innerHTML=(it.ko?'<div class="pq-ko">'+esc(it.ko)+'</div>':'')+'<div class="pq-line"></div><div class="pq-pool"></div>';
      box.onclick=function(e){if(st.done)return;var c=e.target.closest(".pq-chip");if(!c)return;
        if(c.hasAttribute("data-k"))st.seq.push(+c.getAttribute("data-k"));else st.seq.splice(+c.getAttribute("data-p"),1);paint3();};
      paint3();
      st.ready=function(){return st.seq.length===it.chunks.length;};
      st.check=function(){var mine=st.seq.map(function(k){return it.chunks[k];}).join(" "),good=[it.chunks.join(" ")].concat(it.alts);
        var ok=good.some(function(g){return nz(g)===nz(mine);});box.querySelector(".pq-line").classList.add(ok?"ok":"no");

    else if(it.t==="ox"){

        '<div class="pq-row" hidden><span class="pq-lb">고친 말</span><input class="pq-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="밑줄 친 부분을 바르게 고쳐 쓰세요"></div>';
      box.onclick=function(e){if(st.done)return;var b=e.target.closest(".pq-oxb");if(!b)return;st.pick=b.getAttribute("data-v");

      st.ready=function(){return st.pick==="O"||(st.pick==="X"&&box.querySelector(".pq-in").value.trim());};

        else{var full=it.s.replace(/\[\[(.+?)\]\]/,"@@").split("@@");ok=st.pick==="X"&&it.right.some(function(r){return nz(v)===nz(r)||nz(v)===nz(full[0]+" "+r+" "+full[1]);});}

  /* ---------- 문제 풀기 화면 ---------- */
  function mount(LP,opt){
    opt=opt||{};var D=LP&&LP.D?LP.D:LP,P=D&&D.practice;if(!P)return null;
    var base=norm(P.items);if(!base.length)return null;
    var root=document.createElement("div");root.className="pq";root.hidden=true;root.setAttribute("role","dialog");root.setAttribute("aria-label","문제 풀기");
    root.innerHTML='<div class="pq-in0"><div class="pq-hd"><div class="pq-tt"><b></b><small></small></div><button class="pq-x" type="button">✕ 강의로 돌아가기</button></div><div class="pq-main"></div></div>';
    document.body.appendChild(root);
    var main=root.querySelector(".pq-main"),S={sets:[{name:"강의 문제",items:base}],set:0,list:[],idx:0,res:[],busy:false};
    root.querySelector(".pq-tt b").textContent="문제 풀기";root.querySelector(".pq-tt small").textContent=s(D.title||P.unit);
    ["keydown","keyup","keypress"].forEach(function(ev){root.addEventListener(ev,function(e){e.stopPropagation();});});
    function open(){if(LP&&LP.stop)try{LP.stop();}catch(_){}root.hidden=false;document.documentElement.classList.add("pq-lock");if(!S.list.length)start(0,null);else draw();}
    function close(){root.hidden=true;document.documentElement.classList.remove("pq-lock");}
    root.querySelector(".pq-x").onclick=close;
    document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest('[data-act="practice"]');if(t){e.preventDefault();open();}});
    var top=document.querySelector(".lp-top");if(top){var b=document.createElement("button");b.className="pq-open";b.type="button";b.setAttribute("data-act","practice");b.textContent="✎ 문제 풀기";top.appendChild(b);}
    function start(si,only){S.set=si;var L=S.sets[si].items;S.list=only?only.map(function(i){return L[i];}):L.slice();S.map=only||L.map(function(_,i){return i;});S.idx=0;S.res=S.list.map(function(){return null;});draw();}
    function draw(){
      if(S.idx>=S.list.length){summary();return;}
      var it=S.list[S.idx],n=S.list.length;
      main.innerHTML='<div class="pq-pill">'+(S.idx+1)+' / '+n+'</div><div class="pq-type">'+esc(TL[it.t]||"")+'</div><h2 class="pq-q">'+ul(it.q)+'</h2><div class="pq-card"></div>'+
        '<div class="pq-res" hidden></div><div class="pq-foot"><button class="pq-btn pq-check" type="button" disabled>정답 확인</button><button class="pq-btn pq-next" type="button" hidden>'+(S.idx<n-1?"다음 문제 →":"결과 보기")+'</button><button class="pq-skip" type="button">'+(S.idx<n-1?"건너뛰기":"")+'</button></div>';
      var card=main.querySelector(".pq-card"),st=view(it,card),chk=main.querySelector(".pq-check"),nx=main.querySelector(".pq-next"),sk=main.querySelector(".pq-skip");
      var upd=function(){chk.disabled=!st.ready();};card.addEventListener("click",function(){setTimeout(upd,0);});card.addEventListener("input",upd);upd();
      chk.onclick=function(){if(!st.ready())return;st.done=true;it._done=true;var r=st.check();S.res[S.idx]=r.ok;
        var rb=main.querySelector(".pq-res");rb.hidden=false;rb.className="pq-res "+(r.ok?"ok":"no");
        rb.innerHTML='<b>'+(r.ok?"✓ 정답이에요!":"✗ 아쉬워요")+'</b>'+(r.ok?'':'<div class="pq-ans"><span>정답</span>'+esc(r.answer).replace(/\n/g,"<br>")+'</div>')+(it.exp?'<div class="pq-exp">'+esc(it.exp)+'</div>':'');
        chk.hidden=true;sk.hidden=true;nx.hidden=false;nx.focus();};
      nx.onclick=function(){S.idx++;draw();main.scrollTop=0;root.scrollTop=0;};
      sk.onclick=function(){S.res[S.idx]=false;S.idx++;draw();};
      if(!sk.textContent)sk.hidden=true;
      root.scrollTop=0;
    }
    function summary(){
      var n=S.list.length,ok=S.res.filter(function(v){return v===true;}).length,wrong=[];S.res.forEach(function(v,i){if(v!==true)wrong.push(S.map[i]);});
      var h='<div class="pq-sum"><div class="pq-score"><b>'+ok+'</b> / '+n+'</div><p>'+(ok===n?"모두 맞았어요! 훌륭해요 👏":ok>=n*0.7?"잘했어요! 틀린 문제만 한 번 더 풀어 볼까요?":"틀린 문제를 해설과 함께 다시 풀어 봐요.")+'</p>'+
        '<ol class="pq-list">'+S.list.map(function(it,i){return '<li class="'+(S.res[i]===true?"ok":"no")+'"><span>'+(S.res[i]===true?"✓":"✗")+'</span>'+esc(TL[it.t]||"")+' · '+esc(plain(it.q)).slice(0,60)+'</li>';}).join("")+'</ol><div class="pq-acts">'+
        (wrong.length?'<button class="pq-btn" data-a="wrong">틀린 문제 다시 풀기 ('+wrong.length+')</button>':'')+
        '<button class="pq-btn ghost" data-a="again">처음부터 다시</button>'+
        '<button class="pq-btn ai" data-a="ai">✨ AI 새 문제 더 풀기</button>'+
        (S.sets.length>1?'<select class="pq-sets">'+S.sets.map(function(x,i){return '<option value="'+i+'"'+(i===S.set?' selected':'')+'>'+esc(x.name)+' ('+x.items.length+'문제)</option>';}).join("")+'</select><button class="pq-btn ghost" data-a="set">이 세트 풀기</button>':'')+
        '<button class="pq-btn ghost" data-a="close">강의로 돌아가기</button></div><div class="pq-aimsg" role="status"></div><div class="pq-code" hidden><input type="password" placeholder="선생님께 받은 입장 코드" autocomplete="off"><button class="pq-btn" data-a="code">확인</button></div></div>';
      main.innerHTML=h;
      main.querySelector(".pq-acts").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");

        else if(a==="set")start(+main.querySelector(".pq-sets").value,null);else if(a==="ai")more();};
      var cb=main.querySelector('[data-a="code"]');if(cb)cb.onclick=function(){var v=main.querySelector(".pq-code input").value.trim();if(!v)return;try{localStorage.setItem("cm-chat-code",v);}catch(_){}main.querySelector(".pq-code").hidden=true;more();};
    }
    function more(){
      if(S.busy)return;var m=main.querySelector(".pq-aimsg"),btn=main.querySelector('[data-a="ai"]');
      if(location.protocol==="file:"){m.className="pq-aimsg no";m.textContent="AI 새 문제는 강의를 사이트(인터넷 주소)에서 열었을 때 쓸 수 있어요.";return;}
      S.busy=true;if(btn)btn.disabled=true;m.className="pq-aimsg";m.textContent="AI가 새 문제를 만드는 중이에요… 20~40초 정도 걸려요.";
      var code="";try{code=localStorage.getItem("cm-chat-code")||"";}catch(_){}
      var avoid=[];S.sets.forEach(function(x){x.items.forEach(function(it){avoid.push(plain(it.q+" "+(it.s||it.ref||(it.opts&&it.opts[0])||(it.items&&it.items[0]&&(it.items[0].s||it.items[0].post))||"")).slice(0,90));});});
      var body=JSON.stringify({ctx:s(P.ctx),level:s(P.level),unit:s(P.unit||D.title),n:opt.n||6,avoid:avoid.slice(-30),code:code}),t0=Date.now();
      var tm=setInterval(function(){m.textContent="AI가 새 문제를 만드는 중이에요… ("+Math.round((Date.now()-t0)/1000)+"초)";},1000);
      fetch(opt.api||"/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).then(function(res){
        var ct=res.headers.get("content-type")||"";
        if(!res.ok)return res.json().catch(function(){return {};}).then(function(j){if(j.error==="code"){main.querySelector(".pq-code").hidden=false;}throw new Error(j.msg||"새 문제를 받지 못했어요. 잠시 뒤 다시 해 주세요.");});
        if(ct.indexOf("application/json")>=0)return res.json();
        return res.text().then(function(t){var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("AI가 문제를 다 만들지 못했어요. 다시 눌러 주세요.");return JSON.parse(t.slice(a,b+1));});
      }).then(function(j){var L=norm(j);if(L.length<2)throw new Error("AI가 만든 문제가 알맞지 않아요. 다시 눌러 주세요.");
        S.sets.push({name:"AI 새 문제 "+S.sets.length,items:L});start(S.sets.length-1,null);
      }).catch(function(e){m.className="pq-aimsg no";m.textContent=(e&&e.message&&!/JSON|Unexpected|fetch/i.test(e.message))?e.message:"새 문제를 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.";if(btn)btn.disabled=false;
      }).then(function(){clearInterval(tm);S.busy=false;});
    }
    /* AI 조교(질문하기)에게: 아직 [정답 확인]을 하지 않은 문제는 답을 알려 주지 않도록 */
    window.__cmPQ={locked:function(){var L=[];S.sets.forEach(function(x){x.items.forEach(function(it){if(!it._done)L.push(it);});});return L;},
      current:function(){return root.hidden?null:S.list[S.idx]||null;}};
    return {open:open,close:close};
  }
  return {norm:norm,item:item,mount:mount,plain:plain,TL:TL};
}
practiceKit().mount(window.__LP);</script><script src="/chat-widget.js" defer></script>
