window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"일등급샘","title":"Ch11-01 and, but, or, so","audioDir":"Ch11-01_and,_but,_or,_so_audio","preview":false,"count":23,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Ch11-01 and, but, or, so\u003c/div>\u003ch1>문장을 이어 주는 접속사 and, but, or, so\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>and, but, or, so와 both A and B, either A or B를 문장 속에서 정확히 구별해 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 문장과 문장, 단어와 단어를 자연스럽게 이어 주는 접속사들을 배워 볼 거예요. and, but, or, so 이렇게 네 친구와 함께 both A and B, either A or B라는 짝꿍 표현도 같이 익혀 봅니다. 오늘 강의만 잘 따라오면 문장 연결 문제는 실수 없이 풀 수 있을 거예요. 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">등위접속사 and, but, or와 상관접속사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and(그리고), but(그러나), or(또는)는 문법적으로 대등한 단어와 단어, 구와 구, 절과 절을 연결해요. 즉 \u003cb class=\"key\">and\u003c/b>는 '그리고', \u003cb class=\"key\">but\u003c/b>은 '그러나', \u003cb class=\"key\">or\u003c/b>는 '또는'이라는 뜻으로 같은 자격의 말끼리 이어 줍니다. 상관접속사로는 「both A and B(A와 B 둘 다)」, 「either A or B(A 또는 B 둘 중 하나)」가 있어요.\u003cdiv>\u003cspan class=\"g-formula\">and / but / or / both A and B / either A or B\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I ate \u003cspan class=\"fx\">soup and salad\u003c/span> for lunch.\u003c/div>\u003cdiv class=\"g-ko\">나는 점심으로 수프와 샐러드를 먹었다.\u003c/div>\u003cdiv class=\"g-note\">명사와 명사를 대등하게 연결하는 and\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Both the book and the movie\u003c/span> were great.\u003c/div>\u003cdiv class=\"g-ko\">그 책과 영화 둘 다 훌륭했다.\u003c/div>\u003cdiv class=\"g-note\">both A and B (복수 취급)\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The machine is \u003cspan class=\"fx\">old, but it works well\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 기계는 오래되었지만 잘 작동한다.\u003c/div>\u003cdiv class=\"g-note\">대조되는 내용을 연결하는 but\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">You can have \u003cspan class=\"fx\">either fish or chicken\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 생선이나 닭고기 둘 중 하나를 먹을 수 있다.\u003c/div>\u003cdiv class=\"g-note\">either A or B\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>and, but, or 앞뒤에는 \u003cb class=\"key\">품사\u003c/b>와 \u003cb class=\"key\">형태\u003c/b>가 같은 말이 와야 해요. 그리고 both는 or가 아니라 반드시 \u003cb class=\"key\">and\u003c/b>와 짝을 이룹니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 오늘은 문장을 이어 주는 접속사들을 배워 볼게요. and는 그리고, but은 그러나, or는 또는이라는 뜻으로, 문법적으로 똑같은 자격을 가진 말끼리 연결해 줍니다. 단어와 단어, 구와 구, 절과 절을 짝지어 준다고 기억하면 아주 쉬워요. 그리고 both A and B는 둘 다, either A or B는 둘 중 하나라는 뜻을 가진 상관접속사입니다. 짝이 되는 단어를 세트로 외워 두면 시험에서 절대 헷갈리지 않아요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 I ate soup and salad for lunch, 나는 점심으로 수프와 샐러드를 먹었다는 뜻이에요. 여기서 and가 soup라는 명사와 salad라는 명사를 똑같은 자격으로 이어 주고 있죠. 명사와 명사처럼 같은 종류의 말끼리 연결된다는 점을 눈여겨 봐 주세요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 Both the book and the movie were great, 그 책과 영화 둘 다 훌륭했다는 뜻이에요. both A and B는 A와 B 둘 다를 뜻하고, 두 가지를 함께 가리키니까 동사는 복수형인 were를 씁니다. both 뒤에는 or가 아니라 and가 온다는 것도 꼭 기억해 주세요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문은 The machine is old, but it works well, 그 기계는 오래되었지만 잘 작동한다는 뜻이에요. 오래되었다는 내용과 잘 작동한다는 내용이 서로 반대되죠. 이렇게 앞뒤 내용이 대조될 때는 but을 씁니다.","hl":"ex-2"},{"n":6,"text":"네 번째 예문은 You can have either fish or chicken, 너는 생선이나 닭고기 둘 중 하나를 먹을 수 있다는 뜻이에요. either A or B는 둘 중 하나를 고르라는 표현입니다. either 뒤에는 and가 아니라 or가 온다는 점을 꼭 세트로 외워 두세요.","hl":"ex-3"},{"n":7,"text":"여기서 아주 중요한 포인트가 있어요. and, but, or 앞뒤에는 품사와 형태가 꼭 같아야 합니다. 형용사 뒤에는 형용사, 부사 뒤에는 부사, 같은 시제 뒤에는 같은 시제가 와야 하죠. 그리고 both는 or가 아니라 반드시 and와 짝을 이룬다는 것도 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">접속사 so\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">so는 '그래서'라는 뜻으로 앞절의 \u003cb class=\"key\">원인\u003c/b>에 따른 뒤절의 \u003cb class=\"key\">결과\u003c/b>를 연결해요. 즉 앞에는 이유가, 뒤에는 그 이유 때문에 생긴 일이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">원인 절 + , so + 결과 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I was really tired, \u003cspan class=\"fx\">so I took a break\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 정말 피곤해서 휴식을 취했다.\u003c/div>\u003cdiv class=\"g-note\">원인(피곤함) + so + 결과(휴식)\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">because\u003c/b>는 원인, \u003cb class=\"key\">so\u003c/b>는 결과를 나타내므로 두 접속사는 한 문장에 함께 쓰지 않아요.\u003c/div>","segs":[{"n":8,"text":"이번에는 so를 배워 볼게요. so는 그래서라는 뜻으로, 앞절의 원인에 따른 뒤절의 결과를 연결해 줍니다. 앞에는 이유가 오고, 뒤에는 그 이유 때문에 생긴 일이 온다고 생각하면 쉬워요. 원인 절과 결과 절 사이에는 쉼표를 꼭 넣어 주세요.","hl":"rule"},{"n":9,"text":"예문을 읽어 볼게요. I was really tired, so I took a break, 나는 정말 피곤해서 휴식을 취했다는 뜻이에요. 앞에는 피곤했다는 원인이, 뒤에는 그래서 휴식을 취했다는 결과가 나옵니다. 이렇게 원인 다음에 결과가 이어질 때 so를 쓴다고 정리해 두세요.","hl":"ex-0"},{"n":10,"text":"주의할 점이 하나 있어요. because는 원인을, so는 결과를 나타내니까 의미 방향이 반대예요. 그래서 두 접속사를 한 문장에 같이 쓰면 안 됩니다. 둘 중에 하나만 골라서 써야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He ate the pizza quickly and quiet.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He ate the pizza quickly and quietly.\u003c/div>\u003cdiv class=\"g-why\">and 앞뒤는 문법적으로 대등해야 하므로 부사 quickly와 나란히 부사 quietly를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Both Ian or Mickey are great artists.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Both Ian and Mickey are great artists.\u003c/div>\u003cdiv class=\"g-why\">both는 or가 아니라 and와 짝을 이뤄 「both A and B」로 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Yesterday was a holiday, but I didn't go to school.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Yesterday was a holiday, so I didn't go to school.\u003c/div>\u003cdiv class=\"g-why\">휴일(원인)이어서 학교에 가지 않은 것(결과)이므로 역접 but이 아니라 인과 so를 써야 한다.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 문장이 왜 틀렸을까요? and 앞에는 부사 quickly가 왔는데 뒤에는 형용사 quiet가 왔어요. and 앞뒤는 문법적으로 대등해야 하니까 뒤에도 부사 quietly를 써서 He ate the pizza quickly and quietly라고 해야 합니다.","hl":"mk-0"},{"n":12,"text":"이번 문장은 both와 or를 같이 썼기 때문에 틀렸어요. both는 반드시 and와 짝을 이뤄서 both A and B 형태로 씁니다. 그래서 Both Ian and Mickey are great artists라고 고쳐야 해요.","hl":"mk-1"},{"n":13,"text":"이 문장은 앞뒤 관계를 잘 살펴봐야 해요. 어제가 휴일이었다는 것은 원인이고, 학교에 가지 않았다는 것은 그 결과예요. 그러니까 반대되는 내용을 잇는 but이 아니라, 원인과 결과를 잇는 so를 써서 Yesterday was a holiday, so I didn't go to school이라고 해야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 3\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분이 올바른 것을 고르시오.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>It is cold but snowy in winter.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I want to visit both London or Paris.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>These shoes are nice or expensive.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>Ava was sick, so she took some medicine.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>You may add either water and milk.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Ava was sick, so she took some medicine.\u003c/span>\u003cdiv class=\"g-exp\">아픈 것(원인)과 약을 먹은 것(결과)을 연결하는 so가 바르게 쓰인 4번이 정답이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":14,"text":"첫 번째 문제는 객관식이에요. 다음 중에서 밑줄 친 부분이 올바른 것을 골라 보세요. 첫 번째 보기, It is cold but snowy in winter. 두 번째 보기, I want to visit both London or Paris. 세 번째 보기, These shoes are nice or expensive. 네 번째 보기, Ava was sick, so she took some medicine. 다섯 번째 보기, You may add either water and milk. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":15,"text":"","hl":"q","pause":6},{"n":16,"text":"정답은 네 번째 보기예요. Ava was sick, so she took some medicine은 아픈 것이라는 원인과 약을 먹은 것이라는 결과를 so로 잘 이어 줬어요. 두 번째 보기는 both 뒤에 or가 와서 틀렸고, 다섯 번째 보기는 either 뒤에 and가 와서 틀렸습니다. 세 번째 보기도 서로 반대되지 않는 내용을 or로 이어서 어색해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 3\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">우리말과 일치하도록 주어진 말을 이용해 문장을 완성하시오.\u003c/div>\u003cdiv class=\"g-qs\">Bill had ____ for dinner.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">both pizza and pasta\u003c/span>\u003cdiv class=\"g-exp\">'A와 B 둘 다'를 나타내는 「both A and B」 표현을 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"두 번째 문제는 영작이에요. 빌은 저녁으로 피자와 파스타 둘 다 먹었다는 우리말과 일치하도록, pizza와 pasta를 이용해서 빈칸을 채워 보세요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 both pizza and pasta예요. A와 B 둘 다라는 뜻을 나타낼 때는 both A and B 표현을 씁니다. 그래서 Bill had both pizza and pasta for dinner가 되는 거죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 3\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">어법상 틀린 부분을 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"g-qs\">The lecture was long but interest.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">interest → interesting\u003c/span>\u003cdiv class=\"g-exp\">형용사 long과 대등하게 연결되어야 하므로 형용사 interesting을 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"세 번째 문제는 오류 수정이에요. The lecture was long but interest, 이 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 interest를 interesting으로 고치는 거예요. but 앞에는 형용사 long이 왔으니까 뒤에도 형용사가 와야 대등해집니다. 그래서 The lecture was long but interesting이라고 써야 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Ch11-01 and, but, or, so\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>and, but, or는 문법적으로 대등한 \u003cb class=\"key\">단어\u003c/b>와 단어, 구와 구, 절과 절을 연결한다.\u003c/li>\u003cli>both A \u003cb class=\"key\">and\u003c/b> B는 '둘 다', either A \u003cb class=\"key\">or\u003c/b> B는 '둘 중 하나'를 뜻한다.\u003c/li>\u003cli>\u003cb class=\"key\">so\u003c/b>는 앞절의 원인에 따른 뒤절의 결과를 이어 주는 접속사다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":23,"text":"오늘 배운 내용을 정리해 볼게요. and, but, or는 문법적으로 대등한 단어와 단어, 구와 구, 절과 절을 연결한다는 것, 기억나죠? both A and B는 둘 다, either A or B는 둘 중 하나라는 뜻이고요. 그리고 so는 앞절의 원인에 따른 결과를 이어 주는 접속사였습니다. 오늘 배운 표현들을 예문과 함께 꼭 복습해 보고, 다음 시간에 또 만나요. 수고했어요!","hl":"sum"}]}],"practice":{"unit":"Ch11-01 and, but, or, so","level":"중학생","ctx":"단원: Ch11-01 and, but, or, so\n강의 제목: 문장을 이어 주는 접속사 and, but, or, so\n목표: and, but, or, so와 both A and B, either A or B를 문장 속에서 정확히 구별해 쓸 수 있다.\n개념 1. 등위접속사 and, but, or와 상관접속사: and(그리고), but(그러나), or(또는)는 문법적으로 대등한 단어와 단어, 구와 구, 절과 절을 연결해요. 즉 and는 '그리고', but은 '그러나', or는 '또는'이라는 뜻으로 같은 자격의 말끼리 이어 줍니다. 상관접속사로는 「both A and B(A와 B 둘 다)」, 「either A or B(A 또는 B 둘 중 하나)」가 있어요. [and / but / or / both A and B / either A or B] (주의: and, but, or 앞뒤에는 품사와 형태가 같은 말이 와야 해요. 그리고 both는 or가 아니라 반드시 and와 짝을 이룹니다.)\n  예문: I ate soup and salad for lunch. (나는 점심으로 수프와 샐러드를 먹었다.) / Both the book and the movie were great. (그 책과 영화 둘 다 훌륭했다.) / The machine is old, but it works well. (그 기계는 오래되었지만 잘 작동한다.) / You can have either fish or chicken. (너는 생선이나 닭고기 둘 중 하나를 먹을 수 있다.)\n개념 2. 접속사 so: so는 '그래서'라는 뜻으로 앞절의 원인에 따른 뒤절의 결과를 연결해요. 즉 앞에는 이유가, 뒤에는 그 이유 때문에 생긴 일이 옵니다. [원인 절 + , so + 결과 절] (주의: because는 원인, so는 결과를 나타내므로 두 접속사는 한 문장에 함께 쓰지 않아요.)\n  예문: I was really tired, so I took a break. (나는 정말 피곤해서 휴식을 취했다.)\n자주 하는 실수: He ate the pizza quickly and quiet. → He ate the pizza quickly and quietly. / Both Ian or Mickey are great artists. → Both Ian and Mickey are great artists. / Yesterday was a holiday, but I didn't go to school. → Yesterday was a holiday, so I didn't go to school.\n정리: and, but, or는 문법적으로 대등한 단어와 단어, 구와 구, 절과 절을 연결한다. / both A and B는 '둘 다', either A or B는 '둘 중 하나'를 뜻한다. / so는 앞절의 원인에 따른 뒤절의 결과를 이어 주는 접속사다.","items":[{"t":"choose","q":"다음 중 어법상 올바른 문장 두 개를 고르세요.","ref":"","opts":["My father cooked dinner and cleaned the kitchen.","Both the teacher or the students were excited.","The movie was boring, so we left early.","She likes singing and to dance.","Both my cousins and my uncle lives in Busan."],"ans":[1,3],"exp":"and는 같은 형태의 동사를, so는 원인과 결과를 연결하므로 ①과 ③이 옳아요. ②는 both A and B가 되어야 하고, ④는 singing과 dancing처럼 형태를 맞춰야 하며, ⑤는 both A and B를 복수로 보아 live가 되어야 해요."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"She answered the question quickly and correct.","wrong":"correct","right":["correctly"],"exp":"and 앞뒤에는 문법적으로 대등한 말이 와야 하므로 부사 quickly와 나란히 부사 correctly를 써야 해요."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["and","but","or","so","either"],"items":[{"s":"Would you like tea ____ coffee?","a":"or"},{"s":"The sweater was pretty, ____ it was too small.","a":"but"},{"s":"We missed the bus, ____ we were late for school.","a":"so"},{"s":"She is good at math ____ science.","a":"and"},{"s":"You can choose ____ the red pen or the blue pen.","a":"either"}],"exp":"선택에는 or, 대조에는 but, 원인과 결과에는 so, 나열에는 and를 쓰며, either A or B는 '둘 중 하나'를 뜻해요."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"I wanted to buy the shoes,","r":"but they were too expensive."},{"l":"It was raining hard,","r":"so we took a taxi."},{"l":"You can pay","r":"by card or in cash."},{"l":"Both my sister and I","r":"are good at drawing."},{"l":"You can take","r":"either the elevator or the stairs."}],"exp":"신발이 비싸서 못 산 것은 대조(but), 비가 와서 택시를 탄 것은 결과(so)예요. 나머지는 or, both A and B, either A or B로 자연스럽게 이어져요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"[[Either the bus or the subway]] is fine with me.","hint":"(either, the bus, the subway)"},"items":[{"scene":"🍎🍌 사과와 바나나 둘 다 몸에 좋다고 말하는 소녀","pre":"","post":" are good for you.","hint":"(both, apples, bananas)","a":["Both apples and bananas"]},{"scene":"🌧️☂️ 비가 와서 우산을 챙긴 소년","pre":"It was raining, ","post":" I took an umbrella.","hint":"(so)","a":["so"]}],"exp":"both A and B는 '둘 다'라서 복수로 받고, so는 앞의 원인에 따른 결과를 이어 줘요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"Both Mina [[or]] Jisu are in the classroom.","ok":false,"right":["and"],"exp":"both는 or가 아니라 and와 짝을 이루어 「both A and B」로 써야 해요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"그 영화는 매우 길었지만 우리는 끝까지 재미있게 봤다.","chunks":["The movie was very long,","but we enjoyed it","until the end"],"end":".","alts":[],"exp":"길었다는 내용과 끝까지 재미있게 봤다는 내용이 대조되므로 but으로 이어요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"The math problem was difficult, [[so]] I asked my teacher for help.","ok":true,"right":[],"exp":"어려운 문제라서 선생님께 도움을 청한 것이므로 원인과 결과를 잇는 so가 알맞아요."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

    function summary(){
      var n=S.list.length,ok=S.res.filter(function(v){return v===true;}).length,wrong=[];S.res.forEach(function(v,i){if(v!==true)wrong.push(S.map[i]);});
      var h='<div class="pq-sum"><div class="pq-score"><b>'+ok+'</b> / '+n+'</div><p>'+(ok===n?"모두 맞았어요! 훌륭해요 👏":ok>=n*0.7?"잘했어요! 틀린 문제만 한 번 더 풀어 볼까요?":"틀린 문제를 해설과 함께 다시 풀어 봐요.")+'</p>'+
        '<ol class="pq-list">'+S.list.map(function(it,i){return '<li class="'+(S.res[i]===true?"ok":"no")+'"><span>'+(S.res[i]===true?"✓":"✗")+'</span>'+esc(TL[it.t]||"")+' · '+esc(plain(it.q)).slice(0,60)+'</li>';}).join("")+'</ol><div class="pq-acts">'+
        (wrong.length?'<button class="pq-btn" data-a="wrong">틀린 문제 다시 풀기 ('+wrong.length+')</button>':'')+
        '<button class="pq-btn ghost" data-a="again">처음부터 다시</button>'+
        '<button class="pq-btn ai" data-a="ai">✨ AI 새 문제 더 풀기</button>'+
        (S.sets.length>1?'<select class="pq-sets">'+S.sets.map(function(x,i){return '<option value="'+i+'"'+(i===S.set?' selected':'')+'>'+esc(x.name)+' ('+x.items.length+'문제)</option>';}).join("")+'</select><button class="pq-btn ghost" data-a="set">이 세트 풀기</button>':'')+
        '<button class="pq-btn ghost" data-a="close">강의로 돌아가기</button></div><div class="pq-aimsg" role="status"></div><div class="pq-code" hidden><input type="password" placeholder="선생님께 받은 입장 코드" autocomplete="off"><button class="pq-btn" data-a="code">확인</button></div></div>';
      main.innerHTML=h;
      main.querySelector(".pq-acts").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
        if(a==="wrong")start(S.set,wrong);else if(a==="again")start(S.set,null);else if(a==="close")close();
        else if(a==="set")start(+main.querySelector(".pq-sets").value,null);else if(a==="ai")more();};
      var cb=main.querySelector('[data-a="code"]');if(cb)cb.onclick=function(){var v=main.querySelector(".pq-code input").value.trim();if(!v)return;try{localStorage.setItem("cm-chat-code",v);}catch(_){}main.querySelector(".pq-code").hidden=true;more();};
    }
    function more(){
      if(S.busy)return;var m=main.querySelector(".pq-aimsg"),btn=main.querySelector('[data-a="ai"]');
      if(location.protocol==="file:"){m.className="pq-aimsg no";m.textContent="AI 새 문제는 강의를 사이트(인터넷 주소)에서 열었을 때 쓸 수 있어요.";return;}
      S.busy=true;if(btn)btn.disabled=true;m.className="pq-aimsg";m.textContent="AI가 새 문제를 만드는 중이에요… 20~40초 정도 걸려요.";
      var code="";try{code=localStorage.getItem("cm-chat-code")||"";}catch(_){}
      var avoid=[];S.sets.forEach(function(x){x.items.forEach(function(it){avoid.push(plain(it.q+" "+(it.s||it.ref||(it.opts&&it.opts[0])||(it.items&&it.items[0]&&(it.items[0].s||it.items[0].post))||"")).slice(0,90));});});
      var body=JSON.stringify({ctx:s(P.ctx),level:s(P.level),unit:s(P.unit||D.title),n:opt.n||6,avoid:avoid.slice(-30),code:code}),t0=Date.now();
      var tm=setInterval(function(){m.textContent="AI가 새 문제를 만드는 중이에요… ("+Math.round((Date.now()-t0)/1000)+"초)";},1000);
      fetch(opt.api||"/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).then(function(res){
        var ct=res.headers.get("content-type")||"";
        if(!res.ok)return res.json().catch(function(){return {};}).then(function(j){if(j.error==="code"){main.querySelector(".pq-code").hidden=false;}throw new Error(j.msg||"새 문제를 받지 못했어요. 잠시 뒤 다시 해 주세요.");});
        if(ct.indexOf("application/json")>=0)return res.json();
        return res.text().then(function(t){var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("AI가 문제를 다 만들지 못했어요. 다시 눌러 주세요.");return JSON.parse(t.slice(a,b+1));});
      }).then(function(j){var L=norm(j);if(L.length<2)throw new Error("AI가 만든 문제가 알맞지 않아요. 다시 눌러 주세요.");
        S.sets.push({name:"AI 새 문제 "+S.sets.length,items:L});start(S.sets.length-1,null);
      }).catch(function(e){m.className="pq-aimsg no";m.textContent=(e&&e.message&&!/JSON|Unexpected|fetch/i.test(e.message))?e.message:"새 문제를 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.";if(btn)btn.disabled=false;
      }).then(function(){clearInterval(tm);S.busy=false;});
    }
    /* AI 조교(질문하기)에게: 아직 [정답 확인]을 하지 않은 문제는 답을 알려 주지 않도록 */
    window.__cmPQ={locked:function(){var L=[];S.sets.forEach(function(x){x.items.forEach(function(it){if(!it._done)L.push(it);});});return L;},
      current:function(){return root.hidden?null:S.list[S.idx]||null;}};
    return {open:open,close:close};
  }
  return {norm:norm,item:item,mount:mount,plain:plain,TL:TL};
}
practiceKit().mount(window.__LP);</script><script src="/chat-widget.js" defer></script>
