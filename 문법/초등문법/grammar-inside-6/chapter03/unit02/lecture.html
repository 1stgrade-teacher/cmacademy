</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Chapter 3 Unit 2 장소의 전치사","title":"장소와 위치를 나타내는 전치사 정복하기","audioDir":"lecture_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 3 Unit 2\u003c/div>\u003ch1>장소와 위치를 나타내는 전치사 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>장소와 위치를 나타내는 전치사의 의미를 정확히 구별하고 전치사 뒤에는 목적격을 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕 여러분 오늘 선생님과 함께 공부할 내용은 장소와 위치를 나타내는 전치사예요. in과 at의 차이점부터 다양한 위치 전치사까지 아주 쉽게 정리해 줄게요. 끝까지 집중해서 우리 모두 전치사 마스터가 되어 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">장소를 나타내는 in과 at\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">장소를 나타낼 때 \u003cb class=\"key\">in\u003c/b>은 넓은 공간이나 도시 혹은 국가 앞에 쓰고, \u003cb class=\"key\">at\u003c/b>은 특정 지점이나 좁은 장소 앞에 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">in + 넓은 공간 또는 도시·국가 / at + 특정 지점 또는 좁은 장소\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I live \u003cspan class=\"fx\">in Seoul\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 서울에 산다.\u003c/div>\u003cdiv class=\"g-note\">도시 이름 앞에는 전치사 in을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is \u003cspan class=\"fx\">at the bus stop\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 버스 정류장에 있다.\u003c/div>\u003cdiv class=\"g-note\">특정 지점이나 좁은 장소 앞에는 전치사 at을 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>대도시나 나라처럼 넓은 곳은 \u003cb class=\"key\">in\u003c/b>, 점처럼 특정한 좁은 장소는 \u003cb class=\"key\">at\u003c/b>을 쓴다고 기억하세요.\u003c/div>","segs":[{"n":2,"text":"장소를 나타낼 때 in은 넓은 공간이나 도시나 국가 앞에 써요. 반면에 at은 특정 지점이나 좁은 장소 앞에 쓴답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. I live in Seoul 은 나는 서울에 산다는 뜻이에요. 도시 이름인 Seoul 앞이라서 in을 썼어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. She is at the bus stop 은 그녀는 버스 정류장에 있다는 뜻이죠. 버스 정류장 같은 특정한 좁은 장소 앞이라서 at을 썼어요.","hl":"ex-1"},{"n":5,"text":"넓은 곳은 in이고 좁은 곳은 at이라는 것만 잘 기억해 두면 절대 헷갈리지 않을 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">위치를 나타내는 다양한 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">위치를 나타내는 전치사로 \u003cb class=\"key\">on\u003c/b>, \u003cb class=\"key\">under\u003c/b>, \u003cb class=\"key\">behind\u003c/b>, \u003cb class=\"key\">in front of\u003c/b>, \u003cb class=\"key\">next to\u003c/b>, \u003cb class=\"key\">between\u003c/b>의 의미를 구별하여 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The cat is \u003cspan class=\"fx\">on\u003c/span> the box.\u003c/div>\u003cdiv class=\"g-ko\">고양이가 상자 위에 있다.\u003c/div>\u003cdiv class=\"g-note\">물건의 표면 닿아 있는 위를 나타낼 때 on을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The ball is \u003cspan class=\"fx\">under\u003c/span> the table.\u003c/div>\u003cdiv class=\"g-ko\">공이 탁자 아래에 있다.\u003c/div>\u003cdiv class=\"g-note\">무엇무엇의 아래를 나타낼 때 under를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>위치 전치사는 그림을 연상하며 \u003cb class=\"key\">의미\u003c/b>를 정확히 구별해서 외워야 해요.\u003c/div>","segs":[{"n":6,"text":"위치를 나타내는 전치사에는 여러 가지가 있어요. on은 위에, under는 아래에, behind는 뒤에, in front of는 앞에, next to는 옆에, between은 사이에 있다는 뜻으로 각각 쓰여요.","hl":"rule"},{"n":7,"text":"예문을 함께 읽어 볼게요. The cat is on the box 는 고양이가 상자 위에 있다는 뜻이에요. on은 무엇무엇의 위에라는 위치를 나타내죠.","hl":"ex-0"},{"n":8,"text":"다음 예문이에요. The ball is under the table 은 공이 탁자 아래에 있다는 뜻이에요. under는 무엇무엇의 아래에라는 뜻을 가지고 있어요.","hl":"ex-1"},{"n":9,"text":"위치 전치사는 머릿속으로 그림을 그려 가면서 의미를 구별하는 것이 가장 좋은 방법이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤의 대명사 격\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤의 대명사는 반드시 \u003cb class=\"key\">목적격\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 대명사의 목적격(me, you, him, her, it, us, them)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Sit next \u003cspan class=\"fx\">to me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 옆에 앉아라.\u003c/div>\u003cdiv class=\"g-note\">전치사 to 뒤에 대명사의 목적격 me를 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The book is \u003cspan class=\"fx\">behind her\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 책은 그녀의 뒤에 있다.\u003c/div>\u003cdiv class=\"g-note\">전치사 behind 뒤에 대명사의 목적격 her를 썼다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사 뒤에는 절대 \u003cb class=\"key\">주격\u003c/b> 대명사를 쓰지 않도록 주의하세요.\u003c/div>","segs":[{"n":10,"text":"아주 중요한 규칙이 있어요. 전치사 뒤에 대명사가 올 때는 반드시 목적격을 써야 한답니다.","hl":"rule"},{"n":11,"text":"예문을 봐요. Sit next to me 는 내 옆에 앉으라는 뜻이에요. 전치사 to 뒤에 주격인 I가 아니라 목적격인 me가 왔죠.","hl":"ex-0"},{"n":12,"text":"보충 예문을 하나 더 볼게요. The book is behind her 는 그 책은 그녀의 뒤에 있다는 뜻이에요. 전치사 behind 뒤에 대명사 her의 목적격 형태가 쓰였어요.","hl":"ex-1"},{"n":13,"text":"전치사 뒤에 주격 대명사를 쓰지 않도록 시험 문제에서도 자주 확인해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He lives at Korea.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He lives in Korea.\u003c/div>\u003cdiv class=\"g-why\">국가나 넓은 도시 앞에는 at이 아니라 in을 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Sit next to I.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Sit next to me.\u003c/div>\u003cdiv class=\"g-why\">전치사 뒤의 대명사는 반드시 목적격을 써야 하므로 I 대신 me를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 자주 틀리는 문장이에요. He lives at Korea 라고 쓰면 틀려요. 국가 앞에는 at이 아니라 in을 써야 하므로 He lives in Korea가 맞아요.","hl":"mk-0"},{"n":15,"text":"두 번째로 자주 틀리는 문장이에요. Sit next to I 라고 쓰면 안 돼요. 전치사 to 뒤에는 목적격을 써야 하니까 I 대신에 목적격인 me를 써서 Sit next to me라고 해야 해요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 전치사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I live ____ Busan.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>at\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>in\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>on\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>under\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">in\u003c/span>\u003cdiv class=\"g-exp\">도시 이름인 Busan 앞에는 넓은 장소를 나타내는 전치사 in을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제입니다. I live 빈칸 Busan에서 빈칸에 알맞은 전치사를 고르는 문제예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 두 번째 보기인 in이에요. 도시 이름 앞에는 전치사 in을 쓴다고 배웠죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 전치사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She is waiting ____ the bus stop.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>in\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>at\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>on\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>between\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">at\u003c/span>\u003cdiv class=\"g-exp\">버스 정류장 같은 특정한 좁은 장소 앞에는 전치사 at을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"두 번째 문제입니다. She is waiting 빈칸 the bus stop의 빈칸에 들어갈 알맞은 말을 골라 보세요. 직접 풀어 보고 들어봐요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 두 번째 보기인 at이에요. 버스 정류장 같은 특정한 좁은 장소 앞에는 at을 쓴답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">고양이가 상자 위에 있다는 뜻이 되도록 빈칸에 알맞은 전치사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The cat is ____ the box.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">on\u003c/span>\u003cdiv class=\"g-exp\">물건의 표면 위에 있는 위치를 나타낼 때는 전치사 on을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"세 번째 문제입니다. The cat은 the box 위에 있다는 문장이 되도록 빈칸에 알맞은 전치사를 써넣어 보세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 on이에요. 상자 위에 있는 위치를 나타내니까 on이 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 전체 문장을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The ball is under he.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The ball is under him.\u003c/span>\u003cdiv class=\"g-exp\">전치사 under 뒤의 대명사는 목적격을 써야 하므로 he를 목적격 him으로 고쳐야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"네 번째 문제입니다. The ball is under he라는 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 생각해 봐요.","hl":"q"},{"n":2
