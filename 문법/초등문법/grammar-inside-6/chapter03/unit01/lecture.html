  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  show();

lecturePlayer(document.getElementById("app"),{"brand":"Chapter 3 Unit 1 시간의 전치사","title":"헷갈리는 시간 전치사 완벽 정복","audioDir":"lecture_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 3 Unit 1\u003c/div>\u003ch1>헷갈리는 시간 전치사 완벽 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>시간을 나타내는 전치사의 올바른 쓰임을 이해하고 구별할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 시간을 나타내는 전치사에 대해 확실하게 배워볼 거예요. 영어를 쓰다 보면 언제 at을 쓰고 언제 on을 써야 할지 헷갈릴 때가 많죠. 오늘 선생님과 함께 이 전치사들의 규칙을 완벽하게 정리해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">시각, 날짜, 월을 나타내는 전치사 at, on, in\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시간을 나타내는 전치사로 시각이나 특정 시점 앞에는 \u003cb class=\"key\">at\u003c/b>, 날짜나 요일 앞에는 \u003cb class=\"key\">on\u003c/b>, 월이나 계절이나 연도 앞에는 \u003cb class=\"key\">in\u003c/b>을 씁니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I get up \u003cspan class=\"fx\">at 7 o'clock\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 7시에 일어난다.\u003c/div>\u003cdiv class=\"g-note\">시각 앞에는 at을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We have English class \u003cspan class=\"fx\">on Monday\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 월요일에 영어 수업이 있다.\u003c/div>\u003cdiv class=\"g-note\">요일 앞에는 on을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Flowers bloom \u003cspan class=\"fx\">in spring\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">꽃은 봄에 핀다.\u003c/div>\u003cdiv class=\"g-note\">계절 앞에는 in을 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>넓은 기간일수록 in, 특정한 날이나 요일은 on, 콕 집은 시각은 \u003cb class=\"key\">at\u003c/b>을 쓴다고 기억하면 쉬워요.\u003c/div>","segs":[{"n":2,"text":"먼저 시각이나 특정 시점 앞에는 at을 쓰고 날짜나 요일 앞에는 on을 쓰고 월이나 계절이나 연도 앞에는 in을 쓴다는 것을 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 읽어 볼게요. I get up at 7 o'clock. 나는 7시에 일어난다는 뜻이에요. 시각인 7 o'clock 앞에는 at을 쓴답니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문을 볼까요. We have English class on Monday. 우리는 월요일에 영어 수업이 있다는 뜻이죠. 요일인 Monday 앞에는 on을 써요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문이에요. Flowers bloom in spring. 꽃은 봄에 핀다는 뜻이랍니다. 계절인 spring 앞에는 in을 붙여요.","hl":"ex-2"},{"n":6,"text":"넓은 기간일수록 in을 쓰고 특정한 날이나 요일은 on을 쓰며 콕 집은 시각은 at을 쓴다고 기억하면 절대 헷갈리지 않을 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">특정 시기, 행사와 기간을 나타내는 during과 for\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">특정 시기나 행사 뒤에는 \u003cb class=\"key\">during\u003c/b>을 쓰고, 숫자 기간 앞에는 \u003cb class=\"key\">for\u003c/b>를 씁니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I slept \u003cspan class=\"fx\">during the movie\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 영화 보는 동안에 잤다.\u003c/div>\u003cdiv class=\"g-note\">특정 시기나 행사 앞에는 during을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She stayed there \u003cspan class=\"fx\">for three days\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 거기에 3일 동안 머물렀다.\u003c/div>\u003cdiv class=\"g-note\">숫자 기간 앞에는 for를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>기간을 나타낼 때 숫자 기간이 나오면 \u003cb class=\"key\">for\u003c/b>, 특정 사건이나 행사이름이 나오면 \u003cb class=\"key\">during\u003c/b>을 골라야 해요.\u003c/div>","segs":[{"n":7,"text":"이번에는 기간을 나타내는 두 전치사 during과 for를 비교해 볼게요. 특정 시기나 행사 뒤에는 during을 쓰고 숫자 기간 앞에는 for를 쓴답니다.","hl":"rule"},{"n":8,"text":"첫 번째 예문을 함께 소리 내어 읽어 봐요. I slept during the movie. 나는 영화 보는 동안에 잤다는 뜻이에요. 영화라는 특정 시기 앞이라서 during을 썼어요.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. She stayed there for three days. 그녀는 거기에 3일 동안 머물렀다는 뜻이죠. three days라는 숫자 기간 앞에는 for를 쓴답니다.","hl":"ex-1"},{"n":10,"text":"기간을 나타낼 때 숫자 기간이 나오면 for를 고르고 특정 사건이나 행사이름이 나오면 during을 골라야 한다는 것을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">지속과 마감 기한을 나타내는 until과 by\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동작이나 상태의 지속을 나타낼 때는 \u003cb class=\"key\">until\u003c/b>을 쓰고, 마감 기한을 나타낼 때는 \u003cb class=\"key\">by\u003c/b>를 씁니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I will wait \u003cspan class=\"fx\">until Friday\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 금요일까지 기다릴 것이다.\u003c/div>\u003cdiv class=\"g-note\">동작이나 상태의 지속을 나타낼 때는 until을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You must finish this \u003cspan class=\"fx\">by tomorrow\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 내일까지 이것을 끝마쳐야 한다.\u003c/div>\u003cdiv class=\"g-note\">마감 기한을 나타낼 때는 by를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>계속 이어지면 \u003cb class=\"key\">until\u003c/b>, 딱 그 때까지 끝내는 마감이면 \u003cb class=\"key\">by\u003c/b>를 쓴다고 기억하세요.\u003c/div>","segs":[{"n":11,"text":"마지막으로 until과 by를 배워볼게요. 동작이나 상태가 계속 이어지는 지속을 말할 때는 until을 쓰고 정해진 시간까지 끝마쳐야 하는 마감 기한을 말할 때는 by를 쓴답니다.","hl":"rule"},{"n":12,"text":"첫 번째 예문입니다. I will wait until Friday. 나는 금요일까지 기다릴 것이라는 뜻이에요. 기다리는 상태가 금요일까지 계속 지속되므로 until을 썼어요.","hl":"ex-0"},{"n":13,"text":"두 번째 예문이에요. You must finish this by tomorrow. 너는 내일까지 이것을 끝마쳐야 한다는 뜻이죠. 내일이라는 마감 기한까지 늦지 않게 끝내야 하므로 by를 쓴답니다.","hl":"ex-1"},{"n":14,"text":"계속 이어지면 until을 쓰고 딱 그 때까지 끝내는 마감이면 by를 쓴다고 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was born in Monday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I was born on Monday.\u003c/div>\u003cdiv class=\"g-why\">요일 앞에는 in이 아니라 on을 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Please finish
