  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);

}
lecturePlayer(document.getElementById("app"),{"brand":"Chapter 3 Unit 3 방향의 전치사","title":"방향을 나타내는 전치사 정복하기","audioDir":"lecture_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 3 Unit 3\u003c/div>\u003ch1>방향을 나타내는 전치사 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>방향을 나타내는 다양한 전치사의 의미와 쓰임을 정확하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리는 전치사 단원에서 방향을 나타내는 표현들을 함께 배워 볼 거예요. 길을 묻거나 위치를 설명할 때 꼭 필요한 내용이니까 집중해서 잘 들어 주세요. 그럼 우리말 의미와 함께 하나씩 차근차근 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">기본 방향 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">방향\u003c/b>을 나타내는 전치사에는 위쪽이나 아래쪽, 출발지와 도착지를 가리키는 다양한 표현이 있어요. up은 위로, down은 아래로, from은 어디 어디에서, to는 어디 어디로라는 뜻을 나타내요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">walk \u003cspan class=\"fx\">up\u003c/span> the hill\u003c/div>\u003cdiv class=\"g-ko\">언덕 위로 걷다\u003c/div>\u003cdiv class=\"g-note\">up은 위쪽 방향을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">run \u003cspan class=\"fx\">down\u003c/span> the stairs\u003c/div>\u003cdiv class=\"g-ko\">계단 아래로 달리다\u003c/div>\u003cdiv class=\"g-note\">down은 아래쪽 방향을 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">come \u003cspan class=\"fx\">from\u003c/span> Seoul\u003c/div>\u003cdiv class=\"g-ko\">서울에서 오다\u003c/div>\u003cdiv class=\"g-note\">from은 출발지를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">go \u003cspan class=\"fx\">to\u003c/span> school\u003c/div>\u003cdiv class=\"g-ko\">학교로 가다\u003c/div>\u003cdiv class=\"g-note\">to는 도착 방향을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>from A to \u003cb class=\"key\">B\u003c/b> 구조는 A에서 B로 또는 A부터 B까지라는 뜻을 나타내므로 함께 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 기본적인 방향을 나타내는 전치사예요. up은 위로, down은 아래로 움직이는 모습을 나타내죠. 그리고 from은 어디 어디에서 출발할 때 쓰고, to는 어디 어디로 향할 때 써요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 walk up the hill이에요. 언덕 위로 걷다라는 뜻이고 여기서 up은 위쪽 방향을 나타내요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 run down the stairs예요. 계단 아래로 달리다라는 뜻이고 여기서 down은 아래쪽 방향을 나타내죠.","hl":"ex-1"},{"n":5,"text":"세 번째 예문은 come from Seoul이에요. 서울에서 오다라는 뜻이며 from은 출발하는 장소를 나타내요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문은 go to school이에요. 학교로 가다라는 뜻이고 to는 향하는 방향을 나타내요.","hl":"ex-3"},{"n":7,"text":"from A to B 형태는 A에서 B로라는 의미로 자주 쓰이니까 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">통과와 가로지름을 나타내는 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">공간을 \u003cb class=\"key\">가로질러\u003c/b> 가거나 내부를 \u003cb class=\"key\">통과해서\u003c/b> 이동할 때 쓰는 전치사도 있어요. across는 어떤 평면이나 공간을 가로질러 건너는 것을 뜻하고, through는 어떤 공간의 내부를 통과해서 지나가는 것을 뜻해요.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">walk \u003cspan class=\"fx\">across\u003c/span> the street\u003c/div>\u003cdiv class=\"g-ko\">길을 가로질러 걷다\u003c/div>\u003cdiv class=\"g-note\">across는 평면이나 넓은 공간을 가로지르는 것을 뜻합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">go \u003cspan class=\"fx\">through\u003c/span> the tunnel\u003c/div>\u003cdiv class=\"g-ko\">터널을 통과해서 가다\u003c/div>\u003cdiv class=\"g-note\">through는 내부를 통과하는 것을 뜻합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>across는 표면 위를 가로지르는 느낌이고, through는 입체적인 공간 속을 통과하는 느낌이라는 점을 구분해 두세요.\u003c/div>","segs":[{"n":8,"text":"두 번째 개념은 가로지르거나 통과하는 모습을 나타내는 전치 이에요. across는 무엇인가를 가로질러 건널 때 쓰고, through는 터널이나 숲 같은 곳을 통과해서 지나갈 때 써요.","hl":"rule"},{"n":9,"text":"첫 번째 예문은 walk across the street이에요. 길을 가로질러 걷다라는 뜻이며 across는 길을 가로질러 건널 때 써요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문은 go through the tunnel이에요. 터널을 통과해서 가다라는 뜻이고 through는 안을 통과해 지나갈 때 써요.","hl":"ex-1"},{"n":11,"text":"across와 through는 겉을 건너느냐 속을 통과하느냐의 차이가 있으니 잘 구별해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He walked through the street.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He walked across the street.\u003c/div>\u003cdiv class=\"g-why\">길을 건널 때는 내부를 통과하는 through가 아니라 표면을 가로지르는 across를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She ran up the stairs to escape.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She ran down the stairs to escape.\u003c/div>\u003cdiv class=\"g-why\">상황에 맞는 방향 전치사를 골라야 하므로 아래로 내려갈 때는 down을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"첫 번째 자주 틀리는 문장을 볼게요. He walked through the street이라고 쓰면 틀려요. 길은 표면을 가로지르는 것이므로 through 대신 across를 써야 맞아요.","hl":"mk-0"},{"n":13,"text":"두 번째 자주 틀리는 문장이에요. 도망치기 위해 계단 위로 달릴 수도 있지만 아래로 내려가는 상황이라면 up 대신 down을 써야 올바른 문장이 돼요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 알맞은 전치사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The train goes ________ the dark tunnel.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>up\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>down\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>through\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>across\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">through\u003c/span>\u003cdiv class=\"g-exp\">어두운 터널 내부를 통과해서 지나가는 것이므로 through가 정답입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":14,"text":"첫 번째 문제예요. The train goes 빈칸 the dark tunnel 문장의 빈칸에 들어갈 알맞은 전치사를 골라보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":15,"text":"","hl":"q","pause":6},{"n":16,"text":"정답은 세 번째 보기에 있는 through예요. 터널 안을 통과해서 지나가는 것이니까 through가 알맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 빈칸에 알맞은 전치사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">We walked ________ the busy street.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">across\u003c/span>\u003cdiv class=\"g-exp\">복잡한 거리를 가로질러 걷는 것이므로 across가 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"두 번째 문제예요. We walked 빈칸 the busy street 문장의 빈칸에 알맞은 전치사를 적어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 across예요. 거리를 가로질러 걷는 뜻이므로 across를 쓰는 것이 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 위로 향하는 방향을 나타내는 전치사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Which word means moving to a higher place?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>down\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>up\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>from\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>to\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">up\u003c/span>\u003cdiv class=\"g-exp\">위쪽 방향을 나타내는 전치사는 up입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"세 번째 문제예요. 위로 향하는 방향을 나타내는 전치사를 고르는 문제네요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기에 있는 up이에요. up은 위쪽 방향을 나타내는 전치사랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 알맞은 단어를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">She came ________ Busan to Seoul.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">from\u003c/span>\u003cdiv class=\"g-exp\">출발지를 나타내는 전치사 from과 도착지 to를 짝지어 from A to B 표현을 완성합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"네 번째 문제예요. She came 빈칸 Busan to Seoul 문장에서 출발지를 나타내는 빈칸을 채워 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 from이에요. 부산에서 서울로라는 뜻의 from A to B 표현에서 출발지는 from이 담당해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 의미가 바르게 연결된 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Choose the correct meaning of the preposition.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>down - 위로\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>across - 통과해서\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>to - ~로\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>through - 가로질러\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to - ~로\u003c/span>\u003cdiv class=\"g-exp\">to는 어디 어디로라는 도착 방향을 나타내므로 3번 보기가 올바릅니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"다섯 번째 문제예요. 전치사와 뜻이 바르게 연결된 보기를 찾아보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 세 번째 보기인 to와 ~로예요. down은 아래로, across는 가로질러, through는 통과해서가 올바른 뜻이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말 뜻에 맞도록 영어 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">그들은 언덕 위로 걸어갔다. -&gt; They walked ________ the hill.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">up\u003c/span>\u003cdiv class=\"g-exp\">언덕 위로라는 방향을 나타내므로 빈칸에는 up이 들어가야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"마지막 여섯 번째 문제예요. 그들은 언덕 위로 걸어갔다라는 문장을 영어로 완성할 때 빈칸에 들어갈 말을 적어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 up이에요. 언덕 위로 걷는 것이므로 walked up the hill이라고 써야 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 3 Unit 3\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>방향을 나타내는 전치사에는 \u003cb class=\"key\">up\u003c/b>, \u003cb class=\"key\">down\u003c/b>, \u003cb class=\"key\">from\u003c/b>, \u003cb class=\"key\">to\u003c/b>가 있어요.\u003c/li>\u003cli>표면을 가로지를 때는 \u003cb class=\"key\">across\u003c/b>, 내부를 통과할 때는 \u003cb class=\"key\">through\u003c/b>를 사용해요.\u003c/li>\u003c/ul>","segs":[{"n":32,"text":"오늘 우리는 방향을 나타내는 다양한 전치사를 함께 공부해 보았어요. up, down, from, to 그리고 across와 through의 차이점을 잘 기억해 두면 앞
