window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 8 Basic Practice (포인트 45-46)","audioDir":"Chapter_8_Basic_Practice_(포인트_45-46)_audio","preview":false,"count":77,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">비교급과 최상급의 강조·배수·구문\u003c/div>\u003ch1>Chapter 8 Basic Practice 비교급·최상급 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 비교급과 최상급을 다루는 기본 문제를 풀어 볼 거예요. 선택지와 밑줄을 하나씩 보면서 어떤 표현이 자연스러운지 함께 판단해 봅시다. 차근차근 함께 풀어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">비교급 강조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">비교급 앞에는 \u003cb class=\"key\">much\u003c/b>, \u003cb class=\"key\">a lot\u003c/b>, \u003cb class=\"key\">far\u003c/b>, \u003cb class=\"key\">even\u003c/b>, \u003cb class=\"key\">still\u003c/b> 등을 써서 '훨씬 더'의 의미를 강조합니다.\u003cdiv>\u003cspan class=\"g-formula\">much / a lot / far + 비교급 + than\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>much better는 맞지만 more better는 틀림\u003c/li>\u003cli>very는 비교급 앞에서 강조 부사로 쓰지 않음\u003c/li>\u003cli>by far는 최상급 강조에 주로 사용\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This book is much more interesting than that one.\u003c/div>\u003cdiv class=\"g-ko\">이 책은 저 책보다 훨씬 더 흥미롭다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"비교급을 더 강하게 말하고 싶을 때는 비교급 앞에 much나 a lot, far 같은 부사를 붙여요. 이미 better처럼 비교급인 말 앞에 more를 또 붙이면 안 된다는 점도 꼭 기억해 주세요. 시험에서는 much better와 more better를 구별하는 문제가 자주 나와요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The hotel offered \u003cspan class=\"p-box\">\u003cspan>much\u003c/span>\u003ci>/\u003c/i>\u003cspan>more\u003c/span>\u003c/span> better service than it did a year ago.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">much\u003c/div>\u003cdiv class=\"p-op\">more\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">much\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 much와 more 중 무엇이 better 앞에 알맞은지 고르는 문제예요. better가 어떤 형태인지부터 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 much예요. better가 이미 비교급이라서 비교급을 강조하는 much가 와야 하고, more는 쓰지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The hotel offered \u003cspan class=\"p-box\">\u003cspan class=\"ok\">much\u003c/span>\u003ci>/\u003c/i>\u003cspan>more\u003c/span>\u003c/span> better service than it did a year ago.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">much\u003c/div>\u003cdiv class=\"p-op\">more\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">비교급 확인\u003c/b>better는 이미 \u003cb class=\"key\">비교급\u003c/b>입니다. 따라서 앞에는 비교급을 강조하는 much가 와야 하고, more를 또 쓰면 비교급이 중복됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">than 확인\u003c/b>than이 있으므로 \u003cb class=\"key\">비교급\u003c/b> 구조가 확실합니다. much better service가 자연스러운 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 much\u003c/span>\u003cdiv class=\"p-full\">The hotel offered much better service than it did a year ago.\u003c/div>\u003cdiv class=\"p-ko\">그 호텔은 일 년 전보다 훨씬 더 나은 서비스를 제공했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>more better처럼 비교급을 두 번 쓰지 않습니다.\u003c/div>","segs":[{"n":6,"text":"먼저 better를 보면 이미 비교급이에요. 그래서 앞에는 비교급을 강조하는 much가 와야 하고, more를 또 붙이면 안 됩니다.","hl":"st-0"},{"n":7,"text":"뒤에 than이 있으니 비교급 구조라는 것도 확인할 수 있어요. 결국 much better service가 자연스럽습니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. more better처럼 비교급을 두 번 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">as 원급 as possible\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가능한 한 ~한, 가능한 한 ~하게는 \u003cb class=\"key\">as + 원급 + as possible\u003c/b>로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">as + 형용사/부사 + as possible\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>possible을 possibly로 바꾸지 않음\u003c/li>\u003cli>as와 as 사이에는 원급\u003c/li>\u003cli>be as specific as possible 형태\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Please answer as clearly as possible.\u003c/div>\u003cdiv class=\"g-ko\">가능한 한 명확하게 대답해 주세요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"가능한 한 구체적으로 말할 때는 as specific as possible이라고 해요. 이 표현에서 possible은 가능한이라는 뜻으로 굳어진 형태라서 possibly로 바꾸지 않아요. as와 as 사이에는 원급이 들어간다는 것도 함께 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Be as specific as \u003cspan class=\"p-box\">\u003cspan>possible\u003c/span>\u003ci>/\u003c/i>\u003cspan>possibly\u003c/span>\u003c/span> when you make a plan.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">possible\u003c/div>\u003cdiv class=\"p-op\">possibly\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">possible\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 possible과 possibly 중 어떤 형태가 as specific as 뒤에 알맞은지 고르는 문제예요. 굳어진 표현을 떠올려 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 possible이에요. as specific as possible은 가능한 한 구체적으로라는 뜻으로 굳어진 표현이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Be as specific as \u003cspan class=\"p-box\">\u003cspan class=\"ok\">possible\u003c/span>\u003ci>/\u003c/i>\u003cspan>possibly\u003c/span>\u003c/span> when you make a plan.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">possible\u003c/div>\u003cdiv class=\"p-op\">possibly\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">표현 확인\u003c/b>가능한 한 구체적으로는 \u003cb class=\"key\">as specific as possible\u003c/b>이라는 굳어진 표현입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">possible 확인\u003c/b>이 표현에서 possible은 \u003cb class=\"key\">possibly\u003c/b>로 바뀌지 않습니다. 따라서 possible이 정답입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 possible\u003c/span>\u003cdiv class=\"p-full\">Be as specific as possible when you make a plan.\u003c/div>\u003cdiv class=\"p-ko\">계획을 세울 때는 가능한 한 구체적으로 하세요.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>as specific as possibly라고 쓰지 않습니다.\u003c/div>","segs":[{"n":13,"text":"가능한 한 구체적으로 말할 때는 as specific as possible이라는 표현을 써요. 이 짝을 통째로 기억해 두면 좋습니다.","hl":"st-0"},{"n":14,"text":"이 표현에서 possible은 possibly로 바뀌지 않아요. 그래서 possible이 그대로 들어가야 합니다.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. as specific as possibly라고 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">배수사와 as 원급 as 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">twice, three times 같은 배수사는 \u003cb class=\"key\">as + 원급 + as\u003c/b> 앞에 놓습니다.\u003cdiv>\u003cspan class=\"g-formula\">twice / three times + as + 원급 + as\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>twice as much coffee as\u003c/li>\u003cli>불가산명사 coffee는 much로 받음\u003c/li>\u003cli>twice much as는 틀림\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He earns twice as much money as I do.\u003c/div>\u003cdiv class=\"g-ko\">그는 내가 버는 돈의 두 배를 번다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"배수 표현은 twice나 three times 같은 말을 as 원급 as 앞에 두어요. 커피처럼 셀 수 없는 명사는 much coffee라고 하므로 twice as much coffee as가 됩니다. twice much as라고 쓰지 않도록 주의해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">She drank twice \u003cspan class=\"p-box\">\u003cspan>much as\u003c/span>\u003ci>/\u003c/i>\u003cspan>as much\u003c/span>\u003c/span> coffee as she usually does.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">much as\u003c/div>\u003cdiv class=\"p-op\">as much\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">as much\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"세 번째 문제는 twice 뒤에 어떤 순서가 와야 자연스러운지 고르는 문제예요. coffee가 어떤 명사인지도 함께 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 as much예요. 배수사 twice 뒤에는 as much coffee as 순서가 와야 하고, coffee는 셀 수 없는 명사라서 much를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">She drank twice \u003cspan class=\"p-box\">\u003cspan>much as\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">as much\u003c/span>\u003c/span> coffee as she usually does.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">much as\u003c/div>\u003cdiv class=\"p-op\">as much\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">배수사 위치\u003c/b>twice는 \u003cb class=\"key\">as + 원급 + as\u003c/b> 앞에 놓입니다. 따라서 twice as much coffee as가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">명사 확인\u003c/b>coffee는 셀 수 없는 명사라서 \u003cb class=\"key\">much\u003c/b>를 씁니다. twice as much coffee as가 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 as much\u003c/span>\u003cdiv class=\"p-full\">She drank twice as much coffee as she usually does.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 평소보다 두 배나 많은 커피를 마셨다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>twice much as coffee라고 쓰지 않습니다.\u003c/div>","segs":[{"n":20,"text":"twice 같은 배수사는 as 원급 as 앞에 와요. 그래서 twice as much coffee as의 순서가 자연스럽습니다.","hl":"st-0"},{"n":21,"text":"coffee는 셀 수 없는 명사라서 much coffee라고 해요. 결국 twice as much coffee as가 맞습니다.","hl":"st-1"},{"n":22,"text":"이 문제의 함정도 짚고 갈게요. twice much as coffee라고 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">최상급 강조 by far\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">최상급 앞에서 '단연코, 훨씬'을 강조할 때는 \u003cb class=\"key\">by far\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">by far + the + 최상급\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>by far the most populated\u003c/li>\u003cli>very the most는 틀림\u003c/li>\u003cli>the very best는 별도의 강조 표현\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is by far the best player on the team.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 팀에서 단연코 최고의 선수다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"최상급 앞에 by far를 쓰면 단연코 가장 그렇다는 뜻을 강조할 수 있어요. very를 the most 앞에 그대로 붙여 very the most라고 하면 어색합니다. 그래서 the most populated 앞에는 by far가 자연스러워요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Havana is \u003cspan class=\"p-box\">\u003cspan>very\u003c/span>\u003ci>/\u003c/i>\u003cspan>by far\u003c/span>\u003c/span> the most populated city in Cuba.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">very\u003c/div>\u003cdiv class=\"p-op\">by far\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">by far\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"네 번째 문제는 very와 by far 중 무엇이 the most populated 앞에 알맞은지 고르는 문제예요. 최상급을 강조하는 표현을 생각해 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":7},{"n":26,"text":"정답은 by far예요. the most populated라는 최상급 앞에서 단연코라는 뜻을 더하려면 by far를 쓰기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Havana is \u003cspan class=\"p-box\">\u003cspan>very\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">by far\u003c/span>\u003c/span> the most populated city in Cuba.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">very\u003c/div>\u003cdiv class=\"p-op\">by far\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">최상급 확인\u003c/b>the most populated는 \u003cb class=\"key\">최상급\u003c/b>입니다. 최상급 앞에서 단연코라는 의미를 강조할 수 있는 표현을 찾습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">강조 부사\u003c/b>최상급 강조에는 \u003cb class=\"key\">by far\u003c/b>를 씁니다. very the most populated는 어색하므로 by far가 정답입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 by far\u003c/span>\u003cdiv class=\"p-full\">Havana is by far the most populated city in Cuba.\u003c/div>\u003cdiv class=\"p-ko\">아바나는 쿠바에서 단연코 가장 인구가 많은 도시다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>very를 the most 앞에 그대로 붙여 very the most라고 쓰지 않습니다.\u003c/div>","segs":[{"n":27,"text":"the most populated가 최상급이라는 것을 먼저 확인해요. 이 최상급을 단연코라는 느낌으로 강조할 표현이 필요합니다.","hl":"st-0"},{"n":28,"text":"최상급 앞에는 by far를 써서 단연코 가장 그렇다고 강조할 수 있어요. very the most populated는 어색해서 답이 될 수 없습니다.","hl":"st-1"},{"n":29,"text":"이 문제의 함정도 짚고 갈게요. very를 the most 앞에 그대로 붙여 very the most라고 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">둘 중 더 ~한 것\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">둘 중 하나를 비교할 때는 \u003cb class=\"key\">the + 비교급 + of the two\u003c/b> 형태로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">the + 비교급 + of the two\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>of the tw n":61,"text":"","hl":"q","pause":7},{"n":62,"text":"정답은 첫째 most, 둘째 mammal, 셋째 five times예요. 최상급 앞에는 most, any other 뒤에는 단수명사, 배수는 five times로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">No wonder elephants have some of the (1) \u003cu class=\"p-u\">more\u003c/u> expressive trunks and ears on the planet. Elephants have more facial neurons than any other land (2) \u003cu class=\"p-u\">mammals\u003c/u>. African elephants and Asian elephants have about 63,000 and 54,000 facial neurons. Even taking into account the elephant's large size, that's about (3) \u003cu class=\"p-u\">five\u003c/u> more than any other mammal, except for dolphins.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 밑줄\u003c/b>some of the 뒤에서 '가장 표현력이 뛰어난'이라는 최상급 의미가 필요하므로 &lt;&lt;more&gt;&gt;를 \u003cb class=\"key\">most\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 밑줄\u003c/b>than any other 뒤에는 \u003cb class=\"key\">단수명사\u003c/b>가 와야 하므로 &lt;&lt;mammals&gt;&gt;를 \u003cb class=\"key\">mammal\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">세 번째 밑줄\u003c/b>'다섯 배 더'라는 배수 의미가 필요하므로 &lt;&lt;five&gt;&gt;를 \u003cb class=\"key\">five times\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) most (2) mammal (3) five times\u003c/span>\u003cdiv class=\"p-full\">No wonder elephants have some of the most expressive trunks and ears on the planet. Elephants have more facial neurons than any other land mammal. African elephants and Asian elephants have about 63,000 and 54,000 facial neurons. Even taking into account the elephant's large size, that's about five times more than any other mammal, except for dolphins.\u003c/div>\u003cdiv class=\"p-ko\">코끼리가 지구상에서 가장 표현력이 뛰어난 코와 귀를 가진 것은 놀랄 일이 아니다. 코끼리는 다른 어떤 육상 포유류보다 얼굴 신경이 많고, 그 수는 돌고래를 제외한 다른 어떤 포유류보다 약 다섯 배나 많다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>any other 뒤에는 단수명사를 쓰고, 최상급 앞에는 most를 씁니다.\u003c/div>","segs":[{"n":63,"text":"첫 번째 밑줄은 some of the 뒤에서 가장 표현력이 뛰어난이라는 최상급 의미가 필요해요. 그래서 more가 아니라 most로 고쳐야 합니다.","hl":"st-0"},{"n":64,"text":"두 번째 밑줄은 any other 뒤에 단수명사가 와야 한다는 규칙을 확인하는 자리예요. 그래서 mammals가 아니라 mammal로 고칩니다.","hl":"st-1"},{"n":65,"text":"세 번째 밑줄은 단순히 다섯이 아니라 다섯 배 더 많다는 뜻이 필요해요. 그래서 five를 five times로 고쳐야 합니다.","hl":"st-2"},{"n":66,"text":"이 문제의 함정도 짚고 갈게요. any other 뒤에는 단수명사를 쓰고, 최상급 앞에는 most를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">the very + 최상급\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">최상급 앞에는 \u003cb class=\"key\">the\u003c/b>가 필요하고, '바로 그 최고의'를 강조할 때는 \u003cb class=\"key\">the very + 최상급\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">the very + 최상급 + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the very best customer experience\u003c/li>\u003cli>very best만으로는 관사 부족\u003c/li>\u003cli>최상급 best 앞의 the 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the very best choice.\u003c/div>\u003cdiv class=\"g-ko\">이것이 바로 최고의 선택이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":67,"text":"최상급 best 앞에는 정관사 the가 필요해요. 여기에 바로 그 최고라는 느낌을 더하려면 the very best처럼 the와 very를 함께 씁니다. 그래서 very best가 아니라 the very best customer experience가 맞아요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">the 비교급, the 비교급\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">‘~하면 할수록 더 ~하다’는 \u003cb class=\"key\">the + 비교급,
