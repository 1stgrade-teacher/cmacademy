  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"unit36","title":"이유와 조건의 접속사로 문장의 뼈대 잡기","audioDir":"구문_마블_레드_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">마블 레드\u003c/div>\u003ch1>이유와 조건의 접속사로 문장의 뼈대 잡기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>원인·이유를 나타내는 as, since, because, now that, just because와 조건의 if를 구분해 긴 문장의 구조를 정확히 파악한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 마블 레드 유닛에서 이유와 조건을 나타내는 구문을 배워 봅니다. as, since, because, now that, just because, if가 문장에서 어떤 역할을 하는지 잡아 볼 거예요. 이 접속사들이 이끄는 절을 찾으면 긴 문장도 쉽게 끊어 읽을 수 있습니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">구문 핵심\u003c/span>\u003ch2 class=\"g-h\">마블 레드\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"pt\">이유·원인을 나타낼 때는 \u003cb class=\"key\">as\u003c/b>, \u003cb class=\"key\">since\u003c/b>, \u003cb class=\"key\">because\u003c/b>, \u003cb class=\"key\">now that\u003c/b>, \u003cb class=\"key\">just because\u003c/b>가 절을 이끌고, 조건을 나타낼 때는 \u003cb class=\"key\">if\u003c/b>가 절을 이끕니다. 접속사 뒤에는 주어와 동사가 있는 절이 오고, 전체 문장에서 원인이나 조건의 역할을 합니다. \u003cb class=\"key\">just because\u003c/b>는 ‘단지 ~라는 이유만으로’라는 부정적 뉘앙스, \u003cb class=\"key\">now that\u003c/b>은 ‘이제 ~이므로’라는 변화의 뉘앙스를 가집니다.\u003c/div>\u003cdiv class=\"y-list\">\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">1\u003c/span>01 \u003cspan class=\"fx\">As people are walking all the time\u003c/span>, in the same spot, a path appears.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">2\u003c/span>02 Don't take the wrong side of an argument \u003cspan class=\"fx\">just because your opponent has taken the right side\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">3\u003c/span>03 Knowing another language is a window into another culture, \u003cspan class=\"fx\">since how a society thinks and views the world is expressed through its language\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">4\u003c/span>04 The time scales of geological activity are important for environmental geologists \u003cspan class=\"fx\">because they provide a way to measure human impacts on the natural world\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">5\u003c/span>05 \u003cspan class=\"fx\">Now that tablet PCs, 3D VR glasses, and interactive whiteboards are so much a part of the modern classroom\u003c/span>, many people fear reading books will no longer be as important.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">6\u003c/span>06 Words can carry meanings beyond those consciously intended by speakers or writers \u003cspan class=\"fx\">because listeners or readers bring their own perspectives to the language they encounter\u003c/span>.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">7\u003c/span>07 \u003cspan class=\"fx\">Just because you can hear your robins, goldfinches, and sparrows chirping away happily in the garden every morning\u003c/span>, don't be fooled into thinking that all is well in 'birdworld.'\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">8\u003c/span>08 \u003cspan class=\"fx\">As the nature of sarcasm implies a contradiction between intent and message\u003c/span>, nonverbal cues may &quot;leak&quot; and reveal the speaker's true mood.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">9\u003c/span>09 \u003cspan class=\"fx\">Now that genetically modified foods are on our supermarket shelves\u003c/span>, the genie is out of the bottle and cannot be put back in.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">10\u003c/span>10 \u003cspan class=\"fx\">As price is decided by bringing demand and supply into equilibrium\u003c/span>, an increase in supply leads to a fall in price and increase in equilibrium quantity.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">11\u003c/span>11 \u003cspan class=\"fx\">If we are not to become 'slaves to the machine'\u003c/span>, we should keep in mind that since computer programs are designed by people, they, too, are fallible.\u003c/div>\u003cdiv class=\"y-li\">\u003cspan class=\"y-no\">12\u003c/span>12 \u003cspan class=\"fx\">Now that labor's clout has significantly diminished\u003c/span>, knowledge workers have become the more important group in the economic equation.\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 이유를 나타내는 접속사부터 볼게요. as, since, because는 뒤에 주어와 동사가 있는 절을 데리고 와서 원인이나 이유를 설명해 줍니다. now that은 이제 이기 때문에라는 변화의 느낌을 담고 있고, just because는 단지 그 이유만으로라는 뜻으로 자주 쓰여요. if는 조건을 이끌며, 특히 if we are to 같은 표현은 만약 우리가 하려면이라는 뜻으로 기억해 두면 좋습니다.","hl":"pt"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">01 \u003cspan class=\"fx\">As people are walking all the time\u003c/span>, in the same spot, a path appears.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As people are walking all the time, \u003c/div>\u003cdiv class=\"k\">사람들이 항상 걷고 있기 때문에, \u003c/div>\u003cdiv class=\"e\">in the same spot, \u003c/div>\u003cdiv class=\"k\">같은 장소에서, \u003c/div>\u003cdiv class=\"e\">a path appears.\u003c/div>\u003cdiv class=\"k\">길이 나타난다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">As\u003c/b>는 ‘~이기 때문에, ~하면서’의 이유·상황을 이끄는 접속사로, 뒤에 \u003cb class=\"key\">people are walking all the time\u003c/b>이라는 절이 옵니다. 주절 \u003cb class=\"key\">a path appears\u003c/b>의 원인을 설명합니다.\u003c/div>","segs":[{"n":3,"text":"As people are walking all the time, 사람들이 항상 걷고 있기 때문에. in the same spot, 같은 장소에서. a path appears, 길이 나타난다.","hl":"ch"},{"n":4,"text":"이 문장은 as로 시작하죠. 여기서 as는 왜냐하면에 가까운 이유의 접속사이고, 뒤에 people are walking all the time이라는 절이 이어집니다. 그래서 a path appears라는 주절이 왜 일어나는지 설명해 주는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 1 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">01 \u003cspan class=\"fx\">As people are walking all the time\u003c/span>, in the same spot, a path appears.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>사람들이 같은 자리에서 계속 걷다 보면 자연스럽게 길이 만들어진다는 뜻이에요. 반복된 행동이 눈에 보이는 결과를 만든다는 함축이 있습니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">As people are walking all the time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because people keep walking\u003c/span>\u003cdiv class=\"w\">As를 Because로 바꾸어 원인을 더 분명하게 드러냈습니다. all the time은 keep walking으로 자연스럽게 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">a path appears\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">a path is created\u003c/span>\u003cdiv class=\"w\">appears를 수동태 is created로 바꾸어 길이 만들어진다는 결과를 강조했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all the time\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">constantly\u003c/span>\u003cspan class=\"y-eq\">all the time = constantly\u003c/span>\u003cdiv class=\"w\">항상·끊임없이를 뜻하는 부사로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">in the same spot\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">in the same place\u003c/span>\u003cspan class=\"y-eq\">spot = place\u003c/span>\u003cdiv class=\"w\">장소를 뜻하는 spot을 일반적인 place로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">appears\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">comes into being\u003c/span>\u003cspan class=\"y-eq\">appear = come into being\u003c/span>\u003cdiv class=\"w\">나타나다를 조금 더 문어적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because people keep walking in the same place, a path is formed.\u003c/div>\u003c/div>","segs":[{"n":5,"text":"이 문장은 사람들이 같은 자리에서 계속 걷다 보면 길이 생긴다는 뜻이에요. 작은 반복이 눈에 보이는 결과를 만든다는 느낌으로 이해하면 좋습니다.","hl":"mn"},{"n":6,"text":"as는 because로 바꿔 쓸 수 있고, appears는 is created처럼 바꿀 수 있어요. 뜻은 거의 같지만 because가 원인을 더 분명하게 강조합니다.","hl":"rw"},{"n":7,"text":"all the time은 constantly로, in the same spot은 in the same place로 바꿀 수 있습니다. appear는 come into being처럼 조금 더 문어적인 표현으로도 바꿔 볼 수 있어요.","hl":"ph"},{"n":8,"text":"같은 뜻을 자연스럽게 다시 말하면 because people keep walking in the same place, a path is formed라고 할 수 있습니다. because를 사용해 원인을 분명히 하고, 수동태로 결과를 표현했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">02 Don't take the wrong side of an argument \u003cspan class=\"fx\">just because your opponent has taken the right side\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Don't take the wrong side of an argument \u003c/div>\u003cdiv class=\"k\">논쟁의 잘못된 편을 택하지 마라 \u003c/div>\u003cdiv class=\"e\">just because your opponent has taken the right side.\u003c/div>\u003cdiv class=\"k\">단지 상대방이 올바른 편을 택했기 때문에.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">just because\u003c/b>는 ‘단지 ~라는 이유만으로’라는 뜻으로, \u003cb class=\"key\">your opponent has taken the right side\u003c/b>라는 절을 이끌어 명령문 \u003cb class=\"key\">Don't take the wrong side of an argument\u003c/b>의 판단 근거를 부정적으로 제시합니다.\u003c/div>","segs":[{"n":9,"text":"Don't take the wrong side of an argument, 논쟁의 잘못된 편을 택하지 마라. just because your opponent has taken the right side, 단지 상대방이 올바른 편을 택했기 때문에.","hl":"ch"},{"n":10,"text":"이 문장은 명령문이에요. just because가 your opponent has taken the right side라는 절을 이끌면서, 단지 그 이유만으로 잘못된 편을 택하지 말라고 경고하죠. 그래서 just because는 이유를 말하지만 부정적인 판단을 함께 담고 있습니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 2 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">02 Don't take the wrong side of an argument \u003cspan class=\"fx\">just because your opponent has taken the right side\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>상대가 옳은 편에 섰다는 이유만으로 무조건 반대편을 들지 말라는 뜻입니다. 상대와 반대하기 위해 틀린 선택을 하면 안 된다는 경고입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Don't take the wrong side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Do not choose the wrong side\u003c/span>\u003cdiv class=\"w\">명령문을 조금 더 격식 있게 바꾸었습니다. take the side를 choose the side로 풀어 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">just because\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">simply because\u003c/span>\u003cdiv class=\"w\">just because의 ‘단지’라는 제한적 느낌을 simply because로 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">take the wrong side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">choose the wrong side\u003c/span>\u003cspan class=\"y-eq\">take a side = choose a side\u003c/span>\u003cdiv class=\"w\">편을 들다라는 표현을 choose로 바꾸어 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">opponent\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">rival\u003c/span>\u003cspan class=\"y-eq\">opponent = rival\u003c/span>\u003cdiv class=\"w\">상대방을 뜻하는 opponent를 rival로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">has taken the right side\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has chosen the right position\u003c/span>\u003cspan class=\"y-eq\">take a side = choose a position\u003c/span>\u003cdiv class=\"w\">올바른 편을 택하다를 올바른 입장을 선택하다로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Do not choose the wrong position in an argument simply because your opponent has chosen the right one.\u003c/div>\u003c/div>","segs":[{"n":11,"text":"상대가 옳은 편에 섰다는 이유만으로 무조건 반대편을 들지 말라는 뜻이에요. 상대와 반대하기 위해 틀린 선택을 하면 안 된다는 경고입니다.","hl":"mn"},{"n":12,"text":"just because는 simply because로 바꿀 수 있고, take the wrong side는 choose the wrong side로 바꿀 수 있어요. 뜻은 같지만 simply because가 단지라는 느낌을 더 분명히 줍니다.","hl":"rw"},{"n":13,"text":"take the wrong side는 choose the wrong side로, opponent는 rival로 바꿀 수 있습니다. has taken the right side는 has chosen the right position처럼 표현할 수 있어요.","hl":"ph"},{"n":14,"text":"같은 뜻으로 다시 말하면 do not choose the wrong position in an argument simply because your opponent has chosen the right one이라고 할 수 있습니다. 명령문의 느낌을 살리면서 just because를 simply because로 바꾸었어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">03 Knowing another language is a window into another culture, \u003cspan class=\"fx\">since how a society thinks and views the world is expressed through its language\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Knowing another language \u003c/div>\u003cdiv class=\"k\">다른 언어를 아는 것은 \u003c/div>\u003cdiv class=\"e\">is a window into another culture, \u003c/div>\u003cdiv class=\"k\">다른 문화로 통하는 창문이다, \u003c/div>\u003cdiv class=\"e\">since how a society thinks and views the world \u003c/div>\u003cdiv class=\"k\">왜냐하면 한 사회가 세상을 어떻게 생각하고 바라보는지가 \u003c/div>\u003cdiv class=\"e\">is expressed through its language.\u003c/div>\u003cdiv class=\"k\">그것의 언어를 통해 표현되기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">since\u003c/b>는 ‘왜냐하면 ~이므로’라는 이유의 접속사로, 뒤에 \u003cb class=\"key\">how a society thinks and views the world\u003c/b>라는 간접의문문 절이 주어로 오고 \u003cb class=\"key\">is expressed\u003c/b>가 동사입니다. 앞 문장 전체의 이유를 설명합니다.\u003c/div>","segs":[{"n":15,"text":"Knowing another language, 다른 언어를 아는 것은. is a window into another culture, 다른 문화로 통하는 창문이다. since how a society thinks and views the world, 왜냐하면 한 사회가 세상을 어떻게 생각하고 바라보는지가. is expressed through its language, 그것의 언어를 통해 표현되기 때문이다.","hl":"ch"},{"n":16,"text":"이 문장은 since가 이유를 이끄는 구조예요. since 뒤에는 how a society thinks and views the world라는 간접의문문이 주어로 오고, is expressed가 동사로 이어집니다. 앞의 knowing another language is a window into another culture 전체를 이유로 설명해 주죠.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 3 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">03 Knowing another language is a window into another culture, \u003cspan class=\"fx\">since how a society thinks and views the world is expressed through its language\u003c/span>.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>언어는 문화를 이해하는 통로이며, 사회의 사고방식과 세계관이 언어에 담긴다는 뜻입니다. 한 언어를 배우면 그 문화의 관점도 엿볼 수 있다는 함축입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Knowing another language is a window into another culture\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Learning another language gives you a window into another culture\u003c/span>\u003cdiv class=\"w\">Knowing을 Learning으로 바꾸고, gives you a window로 풀어 배움의 결과를 더 자연스럽게 표현했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">since\u003c/span>\u003cspan class=\"ar\">→\u00 y of thinking and viewing the world is expressed through its language라고 할 수 있습니다. since 대신 because를 써서 이유를 분명히 했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 4 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">04 The time scales of geological activity are important for environmental geologists \u003cspan class=\"fx\">because they provide a way to measure human impacts on the natural world\u003c/span>.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">The time scales of geological activity \u003c/div>\u003cdiv class=\"k\">지질학적 활동의 시간 척도들은 \u003c/div>\u003cdiv class=\"e\">are important for environmental geologists \u003c/div>\u003cdiv class=\"k\">환경 지질학자들에게 중요하다 \u003c/div>\u003cdiv class=\"e\">because they provide a way \u003c/div>\u003cdiv class=\"k\">왜냐하면 그것들은 방법을 제공하기 때문이다 \u003c/div>\u003cdiv class=\"e\">to measure human impacts on the natural world.\u003c/div>\u003cdiv class=\"k\">자연계에 대한 인간의 영향을 측정하는.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">because\u003c/b>가 \u003cb class=\"key\">they provide a way to measure human impacts on the natural world\u003c/b>라는 절을 이끌어 앞 문장의 이유를 설명합니다. \u003cb class=\"key\">they\u003c/b>는 \u003cb class=\"key\">the time scales\u003c/b>를 가리키고, \u003cb class=\"key\">a way to measure\u003c/b>는 ‘측정하는 방법’입니다.\u003c/div>","segs":[{"n":21,"text":"The time scales of geological activity, 지질학적 활동의 시간 척도들은. are important for environmental geologists, 환경 지질학자들에게 중요하다. because they provide a way, 왜냐하면 그것들은 방법을 제공하기 때문이다. to measure human impacts on the natural world, 자연계에 대한 인간의 영향을 측정하는.","hl":"ch"},{"n":22,"text":"이 문장에서는 because가 they provide a way to measure human impacts on the natural world라는 절을 이끌고 있어요. they는 앞에 나온 the time scales를 가리키고, a way to measure는 측정하는 방법이라는 뜻입니다. 그래서 지질학적 시간 척도가 왜 중요한지 설명하는 구조예요.","hl":"st"}]},{"html":"\u0 the garden every morning\u003c/span>, don't be fooled into thinking that all is well in 'birdworld.'\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Just because you can hear your robins, goldfinches, and sparrows \u003c/div>\u003cdiv class=\"k\">단지 당신이 당신의 울새, 오색방울새, 참새가 \u003c/div>\u003cdiv class=\"e\">chirping away happily in the garden every morning, \u003c/div>\u003cdiv class=\"k\">정원에서 매일 아침 행복하게 지저귀는 소리를 들을 수 있다는 이유만으로, \u003c/div>\u003cdiv class=\"e\">don't be fooled into thinking \u003c/div>\u003cdiv class=\"k\">속아서 생각하지 마라 \u003c/div>\u003cdiv class=\"e\">that all is well in 'birdworld.'\u003c/div>\u003cdiv class=\"k\">‘조류 세계’에서 모든 것이 괜찮다고.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Just because\u003c/b>는 ‘단지 ~라는 이유만으로’라는 뜻으로, \u003cb class=\"key\">you can hear ... every morning\u003c/b>이라는 절을 이끕니다. 뒤의 명령문 \u003cb class=\"key\">don't be fooled into thinking ...\u003c/b>에 대해 섣부른 판단을 경고합니다.\u003c/div>","segs":[{"n":39,"text":"Just because you can hear your robins, goldfinches, and sparrows, 단지 당신이 당신의 울새, 오색방울새, 참새가. chirping away happily in the garden every morning, 정원에서 매일 아침 행복하게 지저귀는 소리를 들을 수 있다는 이유만으로. don't be fooled into thinking, 속아서 생각하지 마라. that all is well in 'birdworld.', ‘조류 세계’에서 모든 것이 괜찮다고.","hl":"ch"},{"n":40,"text":"이 문장은 just because로 시작해요. just because는 단지 그 이유만으로라는 뜻으로, you can hear your robins, goldfinches, and sparrows chirping away happily in the garden every morning이라는 절을 이끕니다. 뒤의 명령문 don't be fooled into thinking 이하로 섣부른 판단을 경고하는 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 7 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">07 \u003cspan class=\"fx\">Just because you can hear your robins, goldfinches, and sparrows chirping away happily in the garden every morning\u003c/span>, don't be fooled into thinking that all is well in 'birdworld.'\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>새들이 아침마다 잘 지저귄다고 해서 조류의 세계 전체가 안전하다고 믿으면 안 된다는 뜻입니다. 겉으로 보이는 평화가 모든 문제가 해결되었음을 뜻하지 않는다는 함축입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Just because\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Simply because\u003c/span>\u003cdiv class=\"w\">Just because의 제한적 느낌을 Simply because로 자연스럽게 살렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">don't be fooled into thinking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">don't let yourself believe\u003c/span>\u003cdiv class=\"w\">속아서 생각하지 마라를 스스로 믿지 말라로 풀어 의미를 분명히 했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">chirping away\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">singing continuously\u003c/span>\u003cspan class=\"y-eq\">chirp = sing\u003c/span>\u003cdiv class=\"w\">새가 지저귀다를 계속 노래하다로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be fooled into thinking\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">be misled into believing\u003c/span>\u003cspan class=\"y-eq\">be fooled into = be misled into\u003c/span>\u003cdiv class=\"w\">속아서 생각하다를 잘못된 믿음으로 이끌리다로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">all is well\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">everything is fine\u003c/span>\u003cspan class=\"y-eq\">all is well = everything is fine\u003c/span>\u003cdiv class=\"w\">모든 것이 괜찮다를 일상적인 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Simply because you hear your robins, goldfinches, and sparrows singing happily in the garden every morning, do not be misled into believing that everything is fine in the bird world.\u003c/div>\u003c/div>","segs":[{"n":41,"text":"새들이 아침마다 잘 지저귄다고 해서 조류의 세계 전체가 안전하다고 믿으면 안 된다는 뜻이에요. 겉으로 보이는 평화가 모든 문제가 해결되었다는 뜻은 아니라는 함축입니다.","hl":"mn"},{"n":42,"text":"just because는 simply because로 바꿀 수 있고, don't be fooled into thinking은 don't let yourself believe로 바꿀 수 있어요. 뜻은 같지만 don't let yourself believe가 스스로 믿지 말라는 느낌을 더 직접적으로 줍니다.","hl":"rw"},{"n":43,"text":"chirping away는 singing continuously로, be fooled into thinking은 be misled into believing으로 바꿀 수 있습니다. all is well은 everything is fine으로도 표현할 수 있어요.","hl":"ph"},{"n":44,"text":"같은 뜻을 다시 말하면 simply because you hear your robins, goldfinches, and sparrows singing happily in the garden every morning, do not be misled into believing that everything is fine in the bird world라고 할 수 있습니다. just because의 제한적인 느낌을 simply because로 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">08 \u003cspan class=\"fx\">As the nature of sarcasm implies a contradiction between intent and message\u003c/span>, nonverbal cues may &quot;leak&quot; and reveal the speaker's true mood.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As the nature of sarcasm implies \u003c/div>\u003cdiv class=\"k\">빈정거림의 본질은 \u003c/div>\u003cdiv class=\"e\">a contradiction between intent and message, \u003c/div>\u003cdiv class=\"k\">의도와 메시지 사이의 모순을 암시하기 때문에, \u003c/div>\u003cdiv class=\"e\">nonverbal cues may &quot;leak&quot; \u003c/div>\u003cdiv class=\"k\">비언어적 신호는 ‘새어 나갈’ 수 있고 \u003c/div>\u003cdiv class=\"e\">and reveal the speaker's true mood.\u003c/div>\u003cdiv class=\"k\">화자의 진정한 기분을 드러낼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">As\u003c/b>는 ‘~이기 때문에’라는 이유의 접속사로, \u003cb class=\"key\">the nature of sarcasm implies a contradiction between intent and message\u003c/b>라는 절을 이끕니다. 주절에서 \u003cb class=\"key\">nonverbal cues may &quot;leak&quot; and reveal ...\u003c/b>라는 결과가 이어집니다.\u003c/div>","segs":[{"n":45,"text":"As the nature of sarcasm implies, 빈정거림의 본질은. a contradiction between intent and message, 의도와 메시지 사이의 모순을 암시하기 때문에. nonverbal cues may \"leak\", 비언어적 신호는 ‘새어 나갈’ 수 있고. and reveal the speaker's true mood, 화자의 진정한 기분을 드러낼 수 있다.","hl":"ch"},{"n":46,"text":"이 문장은 as로 시작하고, as는 이유를 나타내요. 뒤에는 the nature of sarcasm implies a contradiction between intent and message라는 절이 오고, 주절에서는 nonverbal cues may leak and reveal the speaker's true mood라고 말하며 결과를 보여 줍니다.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 8 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">08 \u003cspan class=\"fx\">As the nature of sarcasm implies a contradiction between intent and message\u003c/span>, nonverbal cues may &quot;leak&quot; and reveal the speaker's true mood.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>빈정거림은 말과 의도 사이에 모순이 있기 때문에, 표정이나 말투 같은 비언어적 신호가 숨은 감정을 드러낼 수 있다는 뜻입니다. 말로 숨긴 감정이 몸짓으로 새어 나온다는 함축입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">As\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because\u003c/span>\u003cdiv class=\"w\">이유의 As를 Because로 바꾸어 인과 관계를 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">may &quot;leak&quot; and reveal\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">may slip out and show\u003c/span>\u003cdiv class=\"w\">leak and reveal을 slip out and show로 바꾸어 감정이 자연스럽게 드러나는 느낌을 살렸습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">imply\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">suggest\u003c/span>\u003cspan class=\"y-eq\">imply = suggest\u003c/span>\u003cdiv class=\"w\">암시하다를 suggest로 바꾸어 의미를 부드럽게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">nonverbal cues\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">body language signals\u003c/span>\u003cspan class=\"y-eq\">nonverbal cues = body language signals\u003c/span>\u003cdiv class=\"w\">비언어적 신호를 몸짓 언어 신호로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">true mood\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">real feelings\u003c/span>\u003cspan class=\"y-eq\">true mood = real feelings\u003c/span>\u003cdiv class=\"w\">진정한 기분을 실제 감정으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because the nature of sarcasm involves a contradiction between intent and message, nonverbal signals may slip out and show the speaker's real feelings.\u003c/div>\u003c/div>","segs":[{"n":47,"text":"빈정거림은 말과 의도 사이에 모순이 있기 때문에 표정이나 말투 같은 비언어적 신호가 숨은 감정을 드러낼 수 있다는 뜻이에요. 말로 숨긴 감정이 몸짓으로 새어 나온다는 함축입니다.","hl":"mn"},{"n":48,"text":"as는 because로 바꿀 수 있고, may leak and reveal은 may slip out and show로 바꿀 수 있어요. 뜻은 같지만 slip out이 감정이 자연스럽게 새어 나온다는 느낌을 더 살려 줍니다.","hl":"rw"},{"n":49,"text":"imply는 suggest로, nonverbal cues는 body language signals로 바꿀 수 있습니다. true mood는 real feelings로도 바꿔 볼 수 있어요.","hl":"ph"},{"n":50,"text":"같은 뜻으로 다시 말하면 because the nature of sarcasm involves a contradiction between intent and message, nonverbal signals may slip out and show the speaker's real feelings라고 할 수 있습니다. as 대신 because를 써서 이유를 분명히 했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">09 \u003cspan class=\"fx\">Now that genetically modified foods are on our supermarket shelves\u003c/span>, the genie is out of the bottle and cannot be put back in.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Now that genetically modified foods \u003c/div>\u003cdiv class=\"k\">이제 유전자 조작 식품이 \u003c/div>\u003cdiv class=\"e\">are on our supermarket shelves, \u003c/div>\u003cdiv class=\"k\">우리의 슈퍼마켓 선반에 있기 때문에, \u003c/div>\u003cdiv class=\"e\">the genie is out of the bottle \u003c/div>\u003cdiv class=\"k\">지니는 병 밖으로 나왔고 \u003c/div>\u003cdiv class=\"e\">and cannot be put back in.\u003c/div>\u003cdiv class=\"k\">다시 안으로 넣어질 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Now that\u003c/b>은 ‘이제 ~이기 때문에’라는 뜻으로, \u003cb class=\"key\">genetically modified foods are on our supermarket shelves\u003c/b>라는 절을 이끌어 변화된 상황을 전제로 합니다. 주절의 속담 \u003cb class=\"key\">the genie is out of the bottle ...\u003c/b>이 그 결과를 비유적으로 표현합니다.\u003c/div>","segs":[{"n":51,"text":"Now that genetically modified foods, 이제 유전자 조작 식품이. are on our supermarket shelves, 우리의 슈퍼마켓 선반에 있기 때문에. the genie is out of the bottle, 지니는 병 밖으로 나왔고. and cannot be put back in, 다시 안으로 넣어질 수 없다.","hl":"ch"},{"n":52,"text":"이 문장은 now that으로 시작해요. now that은 이제 이기 때문에라는 뜻으로, genetically modified foods are on our supermarket shelves라는 절을 이끌어 이미 바뀐 상황을 전제로 합니다. 주절의 the genie is out of the bottle은 되돌릴 수 없는 상황을 비유해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 9 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">09 \u003cspan class=\"fx\">Now that genetically modified foods are on our supermarket shelves\u003c/span>, the genie is out of the bottle and cannot be put back in.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>유전자 조작 식품이 이미 우리 생활에 들어왔기 때문에 이제 되돌릴 수 없는 상황이라는 뜻입니다. ‘병 밖으로 나온 지니’는 통제 불가능하고 원상 복구가 어려운 일을 비유합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Now that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Since\u003c/span>\u003cdiv class=\"w\">변화의 전제를 나타내는 Now that을 Since로 바꾸어 이유를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot be put back in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">can never be reversed\u003c/span>\u003cdiv class=\"w\">병에 다시 넣을 수 없다를 되돌릴 수 없다로 의역했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">genetically modified foods\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">GM foods\u003c/span>\u003cspan class=\"y-eq\">genetically modified foods = GM foods\u003c/span>\u003cdiv class=\"w\">긴 표현을 널리 쓰는 약어로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is out of the bottle\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">has been released\u003c/span>\u003cspan class=\"y-eq\">be out of the bottle = be released\u003c/span>\u003cdiv class=\"w\">병 밖으로 나온 상태를 풀려난 상태로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">cannot be put back in\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">cannot be undone\u003c/span>\u003cspan class=\"y-eq\">cannot be put back in = cannot be undone\u003c/span>\u003cdiv class=\"w\">되돌릴 수 없다는 의미를 직접적으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Since genetically modified foods are already on our supermarket shelves, the situation is like a genie that has left the bottle and can never be put back.\u003c/div>\u003c/div>","segs":[{"n":53,"text":"유전자 조작 식품이 이미 우리 생활에 들어왔기 때문에 이제 원상 복구가 어려운 상황이라는 뜻이에요. 병 밖으로 나온 지니는 통제 불가능하고 되돌리기 힘든 일을 비유합니다.","hl":"mn"},{"n":54,"text":"now that은 since로 바꿀 수 있고, cannot be put back in은 can never be reversed로 바꿀 수 있어요. 뜻은 같지만 can never be reversed가 되돌릴 수 없다는 의미를 더 직접적으로 전합니다.","hl":"rw"},{"n":55,"text":"genetically modified foods는 GM foods로, is out of the bottle은 has been released로 바꿀 수 있습니다. cannot be put back in은 cannot be undone으로도 표현할 수 있어요.","hl":"ph"},{"n":56,"text":"같은 뜻을 다시 말하면 since genetically modified foods are already on our supermarket shelves, the situation is like a genie that has left the bottle and can never be put back이라고 할 수 있습니다. now that의 변화 느낌을 since로 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">10 \u003cspan class=\"fx\">As price is decided by bringing demand and supply into equilibrium\u003c/span>, an increase in supply leads to a fall in price and increase in equilibrium quantity.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">As price is decided \u003c/div>\u003cdiv class=\"k\">가격은 결정되기 때문에 \u003c/div>\u003cdiv class=\"e\">by bringing demand and supply into equilibrium, \u003c/div>\u003cdiv class=\"k\">수요와 공급을 균형으로 이끎으로써, \u003c/div>\u003cdiv class=\"e\">an increase in supply leads to \u003c/div>\u003cdiv class=\"k\">공급의 증가는 이어진다 \u003c/div>\u003cdiv class=\"e\">a fall in price and increase in equilibrium quantity.\u003c/div>\u003cdiv class=\"k\">가격의 하락과 균형 수량의 증가로.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">As\u003c/b>는 ‘~이기 때문에’라는 이유의 접속사로, \u003cb class=\"key\">price is decided by bringing demand and supply into equilibrium\u003c/b>이라는 절을 이끕니다. 주절 \u003cb class=\"key\">an increase in supply leads to ...\u003c/b>의 경제적 원리를 설명합니다.\u003c/div>","segs":[{"n":57,"text":"As price is decided, 가격은 결정되기 때문에. by bringing demand and supply into equilibrium, 수요와 공급을 균형으로 이끎으로써. an increase in supply leads to, 공급의 증가는 이어진다. a fall in price and increase in equilibrium quantity, 가격의 하락과 균형 수량의 증가로.","hl":"ch"},{"n":58,"text":"이 문장은 as로 이유를 나타내요. as 뒤에는 price is decided by bringing demand and supply into equilibrium이라는 절이 오고, 주절에서는 an increase in supply leads to 이하로 공급 증가의 결과를 설명합니다. 그래서 경제 원리를 원인과 결과로 연결한 구조예요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 10 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">10 \u003cspan class=\"fx\">As price is decided by bringing demand and supply into equilibrium\u003c/span>, an increase in supply leads to a fall in price and increase in equilibrium quantity.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>가격이 수요와 공급의 균형으로 정해지기 때문에 공급이 늘면 가격은 내려가고 균형 거래량은 늘어난다는 뜻입니다. 경제 원리를 인과적으로 설명합니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">As\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Because\u003c/span>\u003cdiv class=\"w\">이유의 As를 Because로 바꾸어 원인을 더 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">leads to a fall in price\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">causes the price to fall\u003c/span>\u003cdiv class=\"w\">leads to a fall을 causes ... to fall로 바꾸어 인과 관계를 직접적으로 표현했습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">is decided by\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">is determined by\u003c/span>\u003cspan class=\"y-eq\">be decided by = be determined by\u003c/span>\u003cdiv class=\"w\">결정되다를 더 객관적인 determined로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">bringing demand and supply into equilibrium\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">balancing demand and supply\u003c/span>\u003cspan class=\"y-eq\">bring into equilibrium = balance\u003c/span>\u003cdiv class=\"w\">균형으로 이끌다를 균형을 맞추다로 간단히 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">leads to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">results in\u003c/span>\u003cspan class=\"y-eq\">lead to = result in\u003c/span>\u003cdiv class=\"w\">이어지다를 결과로 낳다로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Because price is determined by balancing demand and supply, an increase in supply causes the price to fall and the equilibrium quantity to rise.\u003c/div>\u003c/div>","segs":[{"n":59,"text":"가격이 수요와 공급의 균형으로 정해지기 때문에 공급이 늘면 가격은 내려가고 균형 거래량은 늘어난다는 뜻이에요. 경제 원리를 인과적으로 설명합니다.","hl":"mn"},{"n":60,"text":"as는 because로 바꿀 수 있고, leads to a fall in price는 causes the price to fall로 바꿀 수 있어요. 뜻은 같지만 causes가 원인과 결과를 더 직접적으로 보여 줍니다.","hl":"rw"},{"n":61,"text":"is decided by는 is determined by로, bringing into equilibrium은 balancing으로 바꿀 수 있습니다. leads to는 results in으로도 바꿔 볼 수 있어요.","hl":"ph"},{"n":62,"text":"같은 뜻으로 다시 말하면 because price is determined by balancing demand and supply, an increase in supply causes the price to fall and the equilibrium quantity to rise라고 할 수 있습니다. as의 이유 관계를 because로 분명히 했어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">11 \u003cspan class=\"fx\">If we are not to become 'slaves to the machine'\u003c/span>, we should keep in mind that since computer programs are designed by people, they, too, are fallible.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">If we are not to become 'slaves to the machine', \u003c/div>\u003cdiv class=\"k\">만약 우리가 ‘기계의 노예’가 되지 않으려면, \u003c/div>\u003cdiv class=\"e\">we should keep in mind \u003c/div>\u003cdiv class=\"k\">우리는 명심해야 한다 \u003c/div>\u003cdiv class=\"e\">that since computer programs are designed by people, \u003c/div>\u003cdiv class=\"k\">컴퓨터 프로그램은 사람들에 의해 설계되기 때문에 \u003c/div>\u003cdiv class=\"e\">they, too, are fallible.\u003c/div>\u003cdiv class=\"k\">그것들도 또한 틀릴 수 있다는 것을.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">If\u003c/b>는 조건을 이끌고, \u003cb class=\"key\">we are not to become ...\u003c/b>에서 \u003cb class=\"key\">be to\u003c/b>는 ‘~하려면, ~할 예정이다’의 의미로 쓰여 ‘만약 우리가 ~되지 않으려면’이 됩니다. that절 안의 \u003cb class=\"key\">since\u003c/b>는 컴퓨터 프로그램이 틀릴 수 있는 이유를 추가로 설명합니다.\u003c/div>","segs":[{"n":63,"text":"If we are not to become 'slaves to the machine', 만약 우리가 ‘기계의 노예’가 되지 않으려면. we should keep in mind, 우리는 명심해야 한다. that since computer programs are designed by people, 컴퓨터 프로그램은 사람들에 의해 설계되기 때문에. they, too, are fallible, 그것들도 또한 틀릴 수 있다는 것을.","hl":"ch"},{"n":64,"text":"이 문장은 if로 조건을 이끌어요. if we are not to become slaves to the machine에서 are to는 하려면이라는 뜻으로 쓰여, 만약 우리가 기계의 노예가 되지 않으려면으로 해석합니다. that절 안에서는 since가 컴퓨터 프로그램이 틀릴 수 있는 이유를 추가로 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 11 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">11 \u003cspan class=\"fx\">If we are not to become 'slaves to the machine'\u003c/span>, we should keep in mind that since computer programs are designed by people, they, too, are fallible.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>인간이 기계에 지나치게 의존하는 것을 막으려면, 컴퓨터 프로그램도 사람이 만들었기 때문에 실수할 수 있음을 기억해야 한다는 뜻입니다. 기술을 맹신하지 말자는 경고입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">If we are not to become\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">If we do not want to become\u003c/span>\u003cdiv class=\"w\">be to의 ‘~하려면’ 의미를 want to로 풀어 이해하기 쉽게 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep in mind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">remember\u003c/span>\u003cdiv class=\"w\">명심하다를 더 간단한 remember로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">be to\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">want to\u003c/span>\u003cspan class=\"y-eq\">be to = want to\u003c/span>\u003cdiv class=\"w\">조건 속의 be to를 의도·바람의 want to로 풀었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">keep in mind\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">bear in mind\u003c/span>\u003cspan class=\"y-eq\">keep in mind = bear in mind\u003c/span>\u003cdiv class=\"w\">명심하다를 같은 의미의 관용 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">fallible\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">capable of making mistakes\u003c/span>\u003cspan class=\"y-eq\">fallible = capable of making mistakes\u003c/span>\u003cdiv class=\"w\">틀릴 수 있는을 풀어 쓴 표현으로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">If we do not want to become slaves to the machine, we should remember that computer programs, because they are designed by people, can also make mistakes.\u003c/div>\u003c/div>","segs":[{"n":65,"text":"인간이 기계에 지나치게 의존하는 것을 막으려면 컴퓨터 프로그램도 사람이 만들었기 때문에 실수할 수 있음을 기억해야 한다는 뜻이에요. 기술을 맹신하지 말자는 경고입니다.","hl":"mn"},{"n":66,"text":"if we are not to become은 if we do not want to become으로 바꿀 수 있고, keep in mind는 remember로 바꿀 수 있어요. 뜻은 같지만 remember가 더 간단하고 직접적입니다.","hl":"rw"},{"n":67,"text":"be to는 want to로, keep in mind는 bear in mind로 바꿀 수 있습니다. fallible은 capable of making mistakes로도 표현할 수 있어요.","hl":"ph"},{"n":68,"text":"같은 뜻을 다시 말하면 if we do not want to become slaves to the machine, we should remember that computer programs, because they are designed by people, can also make mistakes라고 할 수 있습니다. if의 조건과 since의 이유를 모두 살렸어요.","hl":"pp"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">직독직해와 구문\u003c/span>\u003c/div>\u003cdiv class=\"y-sen\" data-hl=\"sen\">12 \u003cspan class=\"fx\">Now that labor's clout has significantly diminished\u003c/span>, knowledge workers have become the more important group in the economic equation.\u003c/div>\u003cdiv class=\"y-chunks\" data-hl=\"ch\">\u003cdiv class=\"e\">Now that labor's clout \u003c/div>\u003cdiv class=\"k\">이제 노동의 영향력이 \u003c/div>\u003cdiv class=\"e\">has significantly diminished, \u003c/div>\u003cdiv class=\"k\">상당히 줄어들었기 때문에, \u003c/div>\u003cdiv class=\"e\">knowledge workers have become \u003c/div>\u003cdiv class=\"k\">지식 근로자들은 되었다 \u003c/div>\u003cdiv class=\"e\">the more important group in the economic equation.\u003c/div>\u003cdiv class=\"k\">경제 방정식에서 더 중요한 집단이.\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-st\" data-hl=\"st\">\u003cb class=\"y-lb\">구문\u003c/b>\u003cb class=\"key\">Now that\u003c/b>은 ‘이제 ~이기 때문에’라는 뜻으로, \u003cb class=\"key\">labor's clout has significantly diminished\u003c/b>라는 절을 이끌어 변화된 상황을 나타냅니다. 주절 \u003cb class=\"key\">knowledge workers have become ...\u003c/b>의 결과를 설명합니다.\u003c/div>","segs":[{"n":69,"text":"Now that labor's clout, 이제 노동의 영향력이. has significantly diminished, 상당히 줄어들었기 때문에. knowledge workers have become, 지식 근로자들은 되었다. the more important group in the economic equation, 경제 방정식에서 더 중요한 집단이.","hl":"ch"},{"n":70,"text":"이 문장은 now that으로 시작해요. now that은 이제 이기 때문에라는 뜻으로, labor's clout has significantly diminished라는 절을 이끌어 변화된 상황을 나타냅니다. 주절에서는 knowledge workers have become the more important group이라고 말하며 그 결과를 설명해요.","hl":"st"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문장 12 / 12\u003c/span>\u003cspan class=\"g-kind\">의미와 바꿔 쓰기\u003c/span>\u003c/div>\u003cdiv class=\"y-sen sm\">12 \u003cspan class=\"fx\">Now that labor's clout has significantly diminished\u003c/span>, knowledge workers have become the more important group in the economic equation.\u003c/div>\u003cdiv class=\"y-box y-mn\" data-hl=\"mn\">\u003cb class=\"y-lb\">함축적 의미\u003c/b>노동의 영향력이 크게 줄어든 지금, 지식 근로자가 경제에서 더 중요한 집단이 되었다는 뜻입니다. 경제 구조의 중심이 바뀌었다는 함축입니다.\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"rw\">\u003cb class=\"y-lb\">표현 바꿔 쓰기\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">Now that\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">Since\u003c/span>\u003cdiv class=\"w\">변화의 전제를 담은 Now that을 Since로 바꾸어 이유를 분명히 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">have become the more important group\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">have emerged as the more important group\u003c/span>\u003cdiv class=\"w\">더 중요한 집단이 되다를 더 중요한 집단으로 떠오르다로 바꾸었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-cg\" data-hl=\"ph\">\u003cb class=\"y-lb\">어구 정리\u003c/b>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">clout\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">influence\u003c/span>\u003cspan class=\"y-eq\">clout = influence\u003c/span>\u003cdiv class=\"w\">영향력이라는 뜻을 더 일반적인 단어로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">significantly diminished\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">greatly decreased\u003c/span>\u003cspan class=\"y-eq\">significantly diminished = greatly decreased\u003c/span>\u003cdiv class=\"w\">상당히 줄어든을 greatly decreased로 바꾸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"y-pair\">\u003cspan class=\"f\">economic equation\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"t\">economic structure\u003c/span>\u003cspan class=\"y-eq\">economic equation = economic structure\u003c/span>\u003cdiv class=\"w\">경제 방정식이라는 비유를 경제 구조로 풀었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"y-box y-pp\" data-hl=\"pp\">\u003cb class=\"y-lb\">패러프레이징\u003c/b>\u003cdiv class=\"p\">Since labor's influence has greatly decreased, knowledge workers have emerged as the more important group in the economic structure.\u003c/div>\u003c/div>","segs":[{"n":71,"text":"노동의 영향력이 크게 줄어든 지금 지식 근로자가 경제에서 더 중요한 집단이 되었다는 뜻이에요. 경제 구조의 중심이 바뀌었다는 함축입니다.","hl":"mn"},{"n":72,"text":"now that은 since로 바꿀 수 있고, have become the more important group은 have emerged as the more important group으로 바꿀 수 있어요. 뜻은 같지만 emerge as가 새롭게 떠오른다는 느낌을 더 줍니다.","hl":"rw"},{"n":73,"text":"clout는 influence로, significantly diminished는 greatly decreased로 바꿀 수 있습니다. economic equation은 economic structure로도 바꿔 볼 수 있어요.","hl":"ph"},{"n":74,"text":"같은 뜻으로 다시 말하면 since labor's influence has greatly decreased, knowledge workers have emerged as the more important group in the economic structure라고 할 수 있습니다. now that의 변화 느낌을 since로 살렸어요.","hl":"pp"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">마블 레드\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>이유를 나타내는 \u003cb class=\"key\">as\u003c/b>, \u003cb class=\"key\">since\u003c/b>, \u003cb class=\"key\">because\u003c/b>는 뒤에 절을 이끌어 원인을 설명합니다.\u003c/li>\u003cli>\u003cb class=\"key\">now that\u003c/b>은 ‘이제 ~이기 때문에’라는 변화의 뉘앙스를 가집니다.\u003c/li>\u003cli>\u003cb class=\"key\">just because\u003c/b>는 ‘단지 ~라는 이유만으로’라는 제한적·부정적 뉘앙스를 만듭니다.\u003c/li>\u003cli>\u003cb class=\"key\">if\u003c/b>는 조건을 이끌고, \u003cb class=\"key\">if we are to\u003c/b>는 ‘만약 우리가 ~하려면’으로 해석합니다.\u003c/li>\u003cli>접속사 뒤에는 주어와 동사가 있는 절이 오는지 먼저 확인합니다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 이유와 조건을 나타내는 구문을 정리했어요. as, since, because는 원인을 설명하고, now that은 이제라는 변화의 느낌을 담고 있습니다. just because는 단지 그 이유만으로라는 제한을 주고, if는 조건을 이끌며 if we are to는 만약 우리가 하려면으로 이해하면 됩니다. 긴 문장을 만나면 접속사 뒤에 주어와 동사가 있는 절이 있는지 먼저 찾아보고, 오늘 배운 내용 꼭 복습해 주세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
