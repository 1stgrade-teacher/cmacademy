lecturePlayer(document.getElementById("app"),{"brand":"Chapter 1 Unit 01 be동사의 현재형과 과거형","title":"be동사의 현재형과 과거형 정복하기","audioDir":"문법_Grammar_Inside1_Unit_01_be동사의_현재형과_과거형_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 01 be동사의 현재형과 과거형\u003c/div>\u003ch1>be동사의 현재형과 과거형 정복하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>be동사의 현재형과 과거형, 그리고 There is/are의 쓰임을 정확히 이해하고 문장을 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 우리 함께 Grammar Inside 일 단원 비동사의 현재형과 과거형을 공부해 볼 거예요. 비동사는 우리 영문법에서 가장 중요하고 기초가 되는 부분이니까 귀 쫑긋 세우고 잘 들어 주세요. 그럼 오늘도 힘차게 출발해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">be동사의 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">be동사\u003c/b>는 주어 뒤에 쓰여 '~이다', '(~에) 있다'의 \u003cb class=\"key\">의미\u003c/b>를 나타냅니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">am\u003c/span> a new student here.\u003c/div>\u003cdiv class=\"g-ko\">나는 여기에 새로 온 학생이다.\u003c/div>\u003cdiv class=\"g-note\">주어 I 뒤에 am이 와서 '~이다'라는 의미를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My bag \u003cspan class=\"fx\">is\u003c/span> on the desk.\u003c/div>\u003cdiv class=\"g-ko\">내 가방은 책상 위에 있다.\u003c/div>\u003cdiv class=\"g-note\">주어 My bag 뒤에 is가 와서 '(~에) 있다'라는 의미를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어의 의미에 따라 \u003cb class=\"key\">상태\u003c/b>나 \u003cb class=\"key\">위치\u003c/b>를 나타낼 때 비동사를 쓴다는 것을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 비동사의 쓰 이에요. 비동사는 주어 뒤에 쓰여서 '~이다' 또는 '(~에) 있다'의 의미를 나타낸답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. I am a new student here.라고 하면 나는 여기에 새로 온 학생이라는 뜻이에요. 여기서 am이 바로 비동사랍니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문도 볼까요. My bag is on the desk.라고 하면 내 가방은 책상 위에 있다는 뜻이에요. 여기서 is는 책상 위에 있다는 위치를 나타내고 있어요.","hl":"ex-1"},{"n":5,"text":"여기서 작은 팁을 줄게요. 주어의 의미에 따라 상태나 위치를 나타낼 때 비동사를 쓴다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">be동사의 형태 (현재형과 과거형)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be동사의 형태는 주어의 \u003cb class=\"key\">수\u003c/b>와 \u003cb class=\"key\">인칭\u003c/b>, 그리고 시제에 따라 달라집니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I am fourteen years old. I was thirteen last year.\u003c/div>\u003cdiv class=\"g-ko\">나는 열네 살이다. 나는 작년에 열세 살이었다.\u003c/div>\u003cdiv class=\"g-note\">현재는 am, 작년이라는 과거를 나타낼 때는 was를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>am과 is의 과거형은 \u003cb class=\"key\">was\u003c/b>, are의 과거형은 \u003cb class=\"key\">were\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":6,"text":"두 번째 개념은 비동사의 형태예요. 비동사의 형태는 주어의 수와 인칭 그리고 시제에 따라 달라진답니다. 일상 대화에서는 주로 줄임말을 사용해요.","hl":"rule"},{"n":7,"text":"예문을 함께 읽어 볼게요. I am fourteen years old. I was thirteen last year.라고 해요. 현재를 말할 때는 am을 쓰고 작년이라는 과거를 말할 때는 was를 쓴다는 걸 알 수 있죠.","hl":"ex-0"},{"n":8,"text":"과거형을 쓸 때 am과 is는 was로 바뀌고 are는 were로 바뀐다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">There is / are 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">There is / are\u003c/b>는 주어와 함께 쓰여 '~가 있다'의 의미를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">There is + 단수명사 / 셀 수 없는 명사, There are + 복수명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There is\u003c/span> a bank near here.\u003c/div>\u003cdiv class=\"g-ko\">이 근처에 은행이 있다.\u003c/div>\u003cdiv class=\"g-note\">뒤에 단수명사 a bank가 오므로 There is를 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There are\u003c/span> thirty students in my class.\u003c/div>\u003cdiv class=\"g-ko\">우리 반에는 서른 명의 학생들이 있다.\u003c/div>\u003cdiv class=\"g-note\">뒤에 복수명사 thirty students가 오므로 There are를 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>뒤에 나오는 명사가 \u003cb class=\"key\">단수명사\u003c/b>인지 \u003cb class=\"key\">복수명사\u003c/b>인지 꼭 확인하고 is와 are를 골라야 해요.\u003c/div>","segs":[{"n":9,"text":"세 번째 개념은 데어리즈와 데어라 구문이에요. There is 또는 There are 뒤에 주어가 오면 '~가 있다'라는 뜻을 나타내지요.","hl":"rule"},{"n":10,"text":"첫 번째 예문을 들어 볼까요. There is a bank near here.라고 하면 이 근처에 은행이 있다는 뜻이에요. 뒤에 단수명사가 오니까 There is를 썼어요.","hl":"ex-0"},{"n":11,"text":"두 번째 예문도 볼게요. There are thirty students in my class.라고 하면 우리 반에는 서른 명의 학생들이 있다는 뜻이에요. 복수명사가 오니까 There are를 썼답니다.","hl":"ex-1"},{"n":12,"text":"여기서 주의할 점은 뒤에 나오는 명사가 단수인지 복수인지 꼭 확인하고 is와 are를 골라야 한다는 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">There was / were 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">There was / were\u003c/b>는 과거에 '~가 있었다'의 의미를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">There was + 단수명사, There were + 복수명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There was\u003c/span> a math test yesterday.\u003c/div>\u003cdiv class=\"g-ko\">어제 수학 시험이 있었다.\u003c/div>\u003cdiv class=\"g-note\">과거를 나타내는 어제(yesterday)가 있으므로 There was를 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>과거를 나타내는 표현이 문장에 있을 때는 \u003cb class=\"key\">was\u003c/b>나 \u003cb class=\"key\">were\u003c/b>를 써야 해요.\u003c/div>","segs":[{"n":13,"text":"네 번째 개념은 There was와 There were 구문이에요. 과거에 무언가 있었다고 말할 때는 There was 또는 There were를 쓴답니다.","hl":"rule"},{"n":14,"text":"예문을 함께 읽어 봐요. There was a math test yesterday.라고 하면 어제 수학 시험이 있었다는 뜻이에요. 어제라는 과거 표현이 있으니까 There was를 썼어요.","hl":"ex-0"},{"n":15,"text":"과거를 나
