window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 7 Chapter Test","audioDir":"Chapter_7_Chapter_Test_audio","preview":false,"count":160,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">대명사·수일치·수량표현·간접의문문·가주어 it\u003c/div>\u003ch1>Chapter 7 Chapter Test 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 맞는 문장 짝 고르기, 틀린 부분 고치기, 배열 서술형, 지문 어법, 지문 서술형, 지문 어법+영작\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter Seven 테스트에 나온 대명사와 수일치, 수량 표현, 어순 문제를 함께 풀어 볼게요. 선택지에서 무엇을 먼저 확인해야 하는지 차근차근 짚어 드릴 테니 끝까지 잘 따라오세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대명사의 수·인칭 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대명사는 가리키는 명사의 \u003cb class=\"key\">수\u003c/b>와 \u003cb class=\"key\">인칭\u003c/b>에 맞춰 it/them, his/their, itself/themselves처럼 형태를 바꿔야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 명사 → it / itself, 복수 명사 → them / themselves\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>대명사가 무엇을 가리키는지 먼저 찾기\u003c/li>\u003cli>가리키는 명사의 단수·복수 확인\u003c/li>\u003cli>소유격도 their/its 구분\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I bought two apples and ate them.\u003c/div>\u003cdiv class=\"g-ko\">나는 사과 두 개를 사서 그것들을 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The company changed its policy.\u003c/div>\u003cdiv class=\"g-ko\">그 회사는 정책을 바꿨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"대명사 문제는 먼저 무엇을 가리키는지 찾는 것이 시작이에요. 가리키는 명사가 복수라면 it이 아니라 them을, 단수라면 them이 아니라 it을 써야 하죠. 소유격도 마찬가지로 회사처럼 단수 대상이면 its, 사람들처럼 복수 대상이면 their를 씁니다. 그래서 대명사를 보면 바로 앞이나 문맥에서 그 대상의 수와 인칭을 확인해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/di ">사과는 왁싱을 포함한 최신 기술을 사용해 포장되고 등급이 매겨지는데, 왁싱은 사과들을 윤이 나게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>which가 가리키는 waxing에 끌려 it을 고르지 않도록 합니다.\u003c/div>","segs":[{"n":6,"text":"먼저 문장의 주어가 Apples라는 점을 보세요. Apples는 복수 명사입니다.","hl":"st-0"},{"n":7,"text":"윤이 나게 되는 대상은 광택 작업을 거치는 사과들이죠. 그래서 복수 대명사 them을 씁니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. which가 가리키는 waxing에 끌려 it을 고르지 않도록 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">another, the other, others\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">another\u003c/b>는 '또 하나 더', 정해진 나머지 하나는 \u003cb class=\"key\">the other\u003c/b>, 특정하지 않은 다른 사람들이나 다른 것들은 \u003cb class=\"key\">others\u003c/b>로 구분합니다.\u003cdiv>\u003cspan class=\"g-formula\">one + another + the other (셋 중 마지막)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>셋 중 하나, 또 하나, 마지막 하나\u003c/li>\u003cli>정해진 나머지 하나는 the other\u003c/li>\u003cli>일반적인 다른 사람들은 others\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have three books. One is English, another is math, and the other is science.\u003c/div>\u003cdiv class=\"g-ko\">책이 세 권 있다. 하나는 영어, 또 하나는 수학, 나머지 하나는 과학이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We should help others.\u003c/div>\u003cdiv class=\"g-ko\">우리는 다른 사람들을 도와야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"another는 막연히 또 하나 더라는 뜻이고, 셋 중 마지막 남은 하나를 콕 집을 때는 the other를 써요. 예를 들어 책이 세 권 있고 하나와 또 하나를 말한 뒤에 남은 마지막 하나는 the other가 되죠. others는 특정하지 않은 다른 사람들이나 다른 것들을 말할 때 씁니다. 그래서 앞에 몇 개가 이미 언급됐는지, 남은 대상이 하나인지 여러 개인지 보면 답이 보여요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Shortly before Christmas she bought three dolls for her daughter. One is cute, another is pretty, and \u003cspan class=\"p-box\">\u003cspan>another\u003c/span>\u003ci>/\u003c/i>\u003cspan>the other\u003c/span>\u003c/span> is tall.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">the other\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"dolls가 세 개라는 점과 one, another가 이미 나왔다는 점을 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 the other입니다. 남은 마지막 하나를 가리키기 때문입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Shortly before Christmas she bought three dolls for her daughter. One is cute, another is pretty, and \u003cspan class=\"p-box\">\u003cspan>another\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">the other\u003c/span>\u003c/span> is tall.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">남은 대상 세기\u003c/b>One is cute, another is pretty까지 두 개를 말했으므로 남은 것은 \u003cb class=\"key\">마지막 하나\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">표현 선택\u003c/b>정해진 나머지 마지막 하나는 \u003cb class=\"key\">the other\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 the other\u003c/span>\u003cdiv class=\"p-full\">Shortly before Christmas she bought three dolls for her daughter. One is cute, another is pretty, and the other is tall.\u003c/div>\u003cdiv class=\"p-ko\">크리스마스 직전에 그녀는 딸을 위해 인형 세 개를 샀다. 하나는 귀엽고, 또 하나는 iv>","segs":[{"n":27,"text":"find 뒤에서 발견된 사람은 주어 He 자신이죠. 그래서 himself를 씁니다.","hl":"st-0"},{"n":28,"text":"혼잣말을 하는 대상도 주어인 그 자신이므로 said to himself가 자연스럽습니다.","hl":"st-1"},{"n":29,"text":"이 문제의 함정도 짚고 갈게요. 목적어 자리에 him을 쓰면 다른 사람을 가리킬 수 있습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">a few/a little/much/plenty of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">셀 수 있는 복수 명사에는 \u003cb class=\"key\">a few\u003c/b>, 셀 수 없는 명사에는 \u003cb class=\"key\">a little\u003c/b>을 쓰고, \u003cb class=\"key\">plenty of\u003c/b>는 둘 다 가능합니다.\u003cdiv>\u003cspan class=\"g-formula\">a few + 복수명사 / a little + 불가산명사 / plenty of + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>tips는 셀 수 있는 복수\u003c/li>\u003cli>time, information, meat는 불가산\u003c/li>\u003cli>much는 불가산에 주로 사용\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have a few tips.\u003c/div>\u003cdiv class=\"g-ko\">나는 몇 가지 조언이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We need a little more time.\u003c/div>\u003cdiv class=\"g-ko\">우리는 조금 더 시간이 필요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"수량 표현은 명사가 셀 수 있는지 없는지부터 봐야 해요. tips처럼 셀 수 있는 복수 명사에는 a few를 쓰고, time이나 information처럼 셀 수 없는 명사에는 a little을 씁니다. plenty of는 셀 수 있는 명사와 없는 명사 모두에 쓸 수 있어서 꽤 자주 나오죠. much는 보통 셀 수 없는 명사와 함께 쓴다는 점도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Many people cut \u003cspan class=\"p-box\">\u003cspan>them\u003c/span>\u003ci>/\u003c/i>\u003cspan>themselves\u003c/span>\u003c/span> while they are cooking. But if you know \u003cspan class=\"p-box\">\u003cspan>a few\u003c/span>\u003ci>/\u003c/i>\u003cspan>a little\u003c/span>\u003c/span> useful tips, you can be safer.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">themselves, a few\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"주어 Many people과 명사 tips의 성격을 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":7},{"n":33,"text":"정답은 themselves와 a few입니다. 사람들이 자기 자신을 다치는 것이고 tips는 셀 수 있는 복수 명사입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Many people cut \u003cspan class=\"p-box\">\u003cspan>them\u003c/span>\u003ci>/\u003c/i>\u003cspan>themselves\u003c/span>\u003c/span> while they are cooking. But if you know \u003cspan class=\"p-box\">\u003cspan>a few\u003c/span>\u003ci>/\u003c/i>\u003cspan>a little\u003c/span>\u003c/span> useful tips, you can be safer.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">재귀대명사\u003c/b>Many people이 주어이고 복수이므로 목적어는 \u003cb class=\"key\">themselves\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">수량 표현\u003c/b>tips는 셀 수 있는 복수 명사라서 \u003cb class=\"key\">a few\u003c/b>를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 themselves, a few\u003c/span>\u003cdiv class=\"p-full\">Many people cut themselves while they are cooking. But if you know a few useful tips, you can be safer.\u003c/div>\u003cdiv class=\"p-ko\">많은 사람들이 요리하다가 자신을 다친다. 하지만 몇 가지 유용한 조언을 알고 있다면 더 안전할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>a little은 셀 수 없는 명사에 씁니다.\u003c/div>","segs":[{"n":34,"text":"주어가 Many people로 복수이고, 다치는 대상도 그들 자신이므로 themselves를 씁니다.","hl":"st-0"},{"n":35,"text":"tips는 셀 수 있는 복수 명사라서 a few를 붙여야 합니다.","hl":"st-1"},{"n":36,"text":"이 문제의 함정도 짚고 갈게요. a little은 셀 수 없는 명사에 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">most of/some of + 명사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">most of\u003c/b>나 \u003cb class=\"key\">some of\u003c/b> 뒤의 명사가 복수면 복수 동사, 불가산이면 단수 동사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">most of the workers + have / some of the luggage + was\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>of 뒤 명사의 수를 기준으로 동사 결정\u003c/li>\u003cli>workers는 복수 → have\u003c/li>\u003cli>luggage는 불가산 → was\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Most of the workers have completed the training.\u003c/div>\u003cdiv class=\"g-ko\">대부분의 근로자가 교육을 마쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Some of the luggage was lost.\u003c/div>\u003cdiv class=\"g-ko\">수하물 중 일부가 분실되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"most of나 some of가 주어로 나오면 of 뒤에 있는 명사를 꼭 봐야 해요. 그 명사가 workers처럼 복수이면 동사도 have나 are처럼 복수형을 씁니다. 반대로 luggage처럼 셀 수 없는 명사이면 was나 is처럼 단수 동사를 써야 하죠. 즉 of 앞의 most나 some에 끌리지 말고 of 뒤 명사가 기준입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① You need to be grateful to all \u003cu class=\"p-u\">those\u003c/u> who helped you.\u003c/div>\u003cdiv class=\"p-op\">② James' Mom and Dad think that \u003cu class=\"p-u\">their\u003c/u> son's essay is excellent.\u003c/div>\u003cdiv class=\"p-op\">③ She considers \u003cu class=\"p-u\">it\u003c/u> important to eat a healthy and balanced diet.\u003c/div>\u003cdiv class=\"p-op\">④ Most of the workers \u003cu class=\"p-u\">has\u003c/u> not yet completed their annual health and safety training.\u003c/div>\u003cdiv class=\"p-op\">⑤ It was during this time that Macbeth, one of Shakespeare's greatest \u003cu class=\"p-u\">works\u003c/u>, was written.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ has → have\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"다섯 문장을 하나씩 보면서 주어와 동사의 수, 대명사, 가주어 it을 확인하세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":7},{"n":40,"text":"정답은 네 번째입니다. Most of the workers에서 workers가 복수이므로 has가 아니라 have가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① You need to be grateful to all \u003cu class=\"p-u\">those\u003c/u> who helped you.\u003c/div>\u003cdiv class=\"p-op\">② James' Mom and Dad think that \u003cu class=\"p-u\">their\u003c/u> son's essay is excellent.\u003c/div>\u003cdiv class=\"p-op\">③ She considers \u003cu class=\"p-u\">it\u003c/u> important to eat a healthy and balanced diet.\u003c/div>\u003cdiv class=\"p-op\">④ Most of the workers \u003cu class=\"p-u\">has\u003c/u> not yet completed their annual health and safety training.\u003c/div>\u003cdiv class=\"p-op\">⑤ It was during this time that Macbeth, one of Shakespeare's greatest \u003cu class=\"p-u\">works\u003c/u>, was written.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>those who helped you에서 \u003cb class=\"key\">those\u003c/b>는 사람들, who는 주격이라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>their는 James' Mom and Dad를 받으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>considers it important to eat에서 it은 \u003cb class=\"key\">가주어\u003c/b>로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>Most of the workers에서 of 뒤 \u003cb class=\"key\">workers\u003c/b>가 복수이므로 has가 아니라 \u003cb class=\"key\">have\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>Macbeth, one of Shakespeare's greatest works에서 주어 Macbeth는 단수이고 works는 복수 명사라서 was written은 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ has → have\u003c/span>\u003cdiv class=\"p-full\">④ Most of the workers have not yet completed their annual health and safety training.\u003c/div>\u003cdiv class=\"p-ko\">대부분의 근로자는 아직 연례 건강 및 안전 교육을 마치지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>Most of 뒤에 복수 명사가 있으면 동사도 복수로 맞춥니다.\u003c/div>","segs":[{"n":41,"text":"첫 번째는 those who helped you에서 those가 사람들을 뜻하고 who가 주격으로 쓰여 맞습니다.","hl":"st-0"},{"n":42,"text":"두 번째는 their가 James의 부모님을 가리키므로 맞습니다.","hl":"st-1"},{"n":43,"text":"세 번째는 it이 가주어로 쓰여 to eat 이하를 받아 주므로 맞습니다.","hl":"st-2"},{"n":44,"text":"네 번째는 Most of the workers에서 workers가 복수라서 has가 아니라 have가 와야 합니다.","hl":"st-3"},{"n":45,"text":"다섯 번째는 주어 Macbeth가 단수이고 works는 복수 명사로 쓰여 was written이 맞습니다.","hl":"st-4"},{"n":46,"text":"이 문제의 함정도 짚고 갈게요. Most of 뒤에 복수 명사가 있으면 동사도 복수로 맞춥니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">that/those로 명사 반복 피하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 명사를 반복하지 않을 때 단수는 \u003cb class=\"key\">that\u003c/b>, 복수는 \u003cb class=\"key\">those\u003c/b>로 받습니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 명사 → that of / 복수 명사 → those of\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>비교 대상의 수 확인\u003c/li>\u003cli>relationship은 단수 → that\u003c/li>\u003cli>genes는 복수 → those\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The weather here is warmer than that of Seoul.\u003c/div>\u003cdiv class=\"g-ko\">여기 날씨가 서울의 날씨보다 따뜻하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My shoes are cheaper than those of my brother.\u003c/div>\u003cdiv class=\"g-ko\">내 신발이 형의 신발보다 싸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":47,"text":"영어에서는 앞에 나온 명사를 그대로 반복하는 대신 that이나 those로 받아 줄 수 있어요. 이때 앞 명사가 단수면 that, 복수면 those를 씁니다. 예를 들어 weather는 단수라서 that of Seoul이 되고, shoes는 복수라서 those of my brother가 되죠. 비교 문제에서 than 뒤에 나오면 무엇을 대신하는지 수를 확인하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">one과 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">one\u003c/b>은 같은 종류의 것 하나를 막연히 가리키고, \u003cb class=\"key\">it\u003c/b>은 앞에 나온 특정한 대상을 가리킵니다.\u003cdiv>\u003cspan class=\"g-formula\">a new one / dropped it\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>a new one = 새것 하나\u003c/li>\u003cli>특정 물건을 다시 말하면 it\u003c/li>\u003cli>another는 또 하나 더\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I broke my cup. I need to buy a new one.\u003c/div>\u003cdiv class=\"g-ko\">컵을 깨뜨려서 새것을 사야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I dropped my phone and broke it.\u003c/div>\u003cdiv class=\"g-ko\">휴대폰을 떨어뜨려서 그것을 깨뜨렸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"one은 같은 종류의 것 중 하나를 막연하게 가리킬 때 쓰고, it은 이미 나온 특정한 대상을 다시 가리킬 때 씁니다. 내 컵을 깨뜨리고 새 컵 하나를 사야 한다면 a new one이 자연스럽고, 내 휴대폰을 떨어뜨려 그 휴대폰을 깨뜨렸다면 it을 써야 하죠. 문제에서는 앞에 있는 명사가 특정한지, 같은 종류의 새것인지 구분하면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 짝 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">ⓐ The emotions in the poems are that of loss and grief.\u003cbr>ⓑ Buy two shirts and get another completely free during our promotion.\u003cbr>ⓒ I don't know much about financing, so I need a lot of information about it.\u003cbr>ⓓ My phone turned off by itself because I dropped one on the floor.\u003cbr>ⓔ I accidentally broke my sister's cup. I need to buy a new one for her.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓑ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":49,"text":"각 문장에서 대명사가 무엇을 가리키는지 표시하면서 보세요.","hl":"q"},{"n":50,"text":"","hl":"q","pause":7},{"n":51,"text":"정답은 네 번째입니다. 두 번째, 세 번째, 다섯 번째 문장이 맞고 첫 번째와 네 번째는 대명사가 틀렸습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 짝 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">ⓐ The emotions in the poems are that of loss and grief div class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>than did anyone else는 비교 구문의 도치로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>meat는 불가산이라 much meat가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>animals that eat meat에서 that은 주격 관계대명사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>horsemeat의 association이므로 their를 \u003cb class=\"key\">its\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">(2) 영작\u003c/b>주어 Christians가 복수이므로 재귀대명사는 \u003cb class=\"key\">themselves\u003c/b>이고, set apart는 '분리하다'입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ⑤ (2) Christians wanted to set themselves apart.\u003c/span>\u003cdiv class=\"p-full\">Christians wanted to set themselves apart.\u003c/div>\u003cdiv class=\"p-ko\">기독교인들은 그들 자신을 분리하기를 원했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>their가 사람들 they를 가리킨다고 착각하지 말고 horsemeat과의 관계를 봅니다.\u003c/div>","segs":[{"n":133,"text":"첫 번째 It은 빵을 강조하는 구문의 일부로 쓰여 맞습니다.","hl":"st-0"},{"n":134,"text":"두 번째는 비교 구문에서 did가 anyone else 앞에 온 도치 형태로 맞습니다.","hl":"st-1"},{"n":135,"text":"세 번째는 meat가 셀 수 없는 명사라서 much meat가 맞습니다.","hl":"st-2"},{"n":136,"text":"네 번째는 animals를 받는 주격 관계대명사 that이라서 맞습니다.","hl":"st-3"},{"n":137,"text":"다섯 번째는 horsemeat의 association을 말하므로 their를 its로 고쳐야 합니다.","hl":"st-4"},{"n":138,"text":"영작에서는 Christians가 복수 주어라서 themselves를 쓰고, wanted to set apart 순서로 만듭니다.","hl":"st-5"},{"n":139,"text":"이 문제의 함정도 짚고 갈게요. their가 사람들 they를 가리킨다고 착각하지 말고 horsemeat과의 관계를 봅니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬구조 to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and로 두 동작을 연결할 때는 \u003cb class=\"key\">to + 동사원형\u003c/b> 형태를 나란히 맞춰 병렬구조를 만듭니다.\u003cdiv>\u003cspan class=\"g-formula\">be seen to + 동사원형 and then to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>dive와 fly는 같은 대상의 동작\u003c/li>\u003cli>seen to dive and then to fly\u003c/li>\u003cli>to부정사 병렬\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He was seen \u003cspan class=\"fx\">to enter and to leave\u003c/span> the room.\u003c/div>\u003cdiv class=\"g-ko\">그가 방에 들어가고 나오는 것이 목격되었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She decided \u003cspan class=\"fx\">to study and to work\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 공부하고 일하기로 결정했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":140,"text":"병렬구조는 and로 연결된 표현의 형태를 똑같이 맞춰 주는 문법이에요. seen to dive and then to fly에서 dive와 fly는 모두 새의 동작이므로 to부정사 형태를 나란히 써야 자연스럽습니다. 하나는 to가 있고 하나는 없으면 문법적으로 어색해질 수 있죠. and 앞뒤의 형태가 같은지 확인하는 습관을 들이세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Explorers discovering new lands across the Atlantic Ocean saw an extraordinary creature—a fish that propelled ① \u003cu class=\"p-u\">itself\u003c/u> through the ocean waters with wings like a bird! This strange creature with its bright orange beak and black feathers was seen to dive deep into the ocean waters and then ② \u003cu class=\"p-u\">to fly\u003c/u> rapidly through the sky. Because the explorers feared this mythical creature, they invented tales that portrayed it as rising from pieces of wood from shipwrecks. Today these seabirds are no longer feared, in part because scientists have studied to learn more about ③ \u003cu class=\"p-u\">themselves\u003c/u>. Now ④ \u003cu class=\"p-u\">known\u003c/u> as the Atlantic puffin, this seabird lives in the Atlantic Ocean in the Northern Hemisphere. These ocean-living birds seem to fly underwater using their wings to dive deep into the sea ⑤ \u003cu class=\"p-u\">where\u003c/u> they feed on small fish.\u003c/div>\u003cdiv class=\"p-q\">밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① itself\u003c/div>\u003cdiv class=\"p-op\">② to fly\u003c/div>\u003cdiv class=\"p-op\">③ themselves\u003c/div>\u003cdiv class=\"p-op\">④ known\u003c/div>\u003cdiv class=\"p-op\">⑤ where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ themselves → them\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":141,"text":"각 밑줄이 무엇을 가리키고 어떤 형태로 연결되는지 보세요.","hl":"q"},{"n":142,"text":"","hl":"q","pause":7},{"n":143,"text":"정답은 세 번째입니다. scientists가 알아보려는 대상은 바닷새이므로 themselves가 아니라 them을 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Explorers discovering new lands across the Atlantic Ocean saw an extraordinary creature—a fish that propelled ① \u003cu class=\"p-u\">itself\u003c/u> through the ocean waters with wings like a bird! This strange creature with its bright orange beak and black feathers was seen to dive deep into the ocean waters and then ② \u003cu class=\"p-u\">to fly\u003c/u> rapidly through the sky. Because the explorers feared this mythical creature, they invented tales that portrayed it as rising from pieces of wood from shipwrecks. Today these seabirds are no longer feared, in part because scientists have studied to learn more about ③ \u003cu class=\"p-u\">themselves\u003c/u>. Now ④ \u003cu class=\"p-u\">known\u003c/u> as the Atlantic puffin, this seabird lives in the Atlantic Ocean in the Northern Hemisphere. These ocean-living birds seem to fly underwater using their wings to dive deep into the sea ⑤ \u003cu class=\"p-u\">where\u003c/u> they feed on small fish.\u003c/div>\u003cdiv class=\"p-q sm\">밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① itself\u003c/div>\u003cdiv class=\"p-op\">② to fly\u003c/div>\u003cdiv class=\"p-op\">③ themselves\u003c/div>\u003cdiv class=\"p-op\">④ known\u003c/div>\u003cdiv class=\"p-op\">⑤ where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>a fish가 자신을 추진했으므로 \u003cb class=\"key\">itself\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>to dive와 then \u003cb class=\"key\">to fly\u003c/b>가 to부정사로 병렬을 이룹니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>scientists가 알아보려는 대상은 seabirds이므로 themselves를 \u003cb class=\"key\">them\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>known as는 수동의 과거분사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>the sea \u003cb class=\"key\">where\u003c/b> they feed on small fish에서 where는 장소 관계부사로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ themselves → them\u003c/span>\u003cdiv class=\"p-full\">Today these seabirds are no longer feared, in part because scientists have studied to learn more about them.\u003c/div>\u003cdiv class=\"p-ko\">오늘날 이 바닷새들은 더 이상 두려움의 대상이 아니다. 부분적으로 과학자들이 그들에 대해 더 알아보기 위해 연구해 왔기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>scientists 자신을 알아보는 것이 아니라 바닷새를 알아보는 문맥입니다.\u003c/div>","segs":[{"n":144,"text":"첫 번째는 물고기 하나가 자기 자신을 추진했으므로 itself가 맞습니다.","hl":"st-0"},
