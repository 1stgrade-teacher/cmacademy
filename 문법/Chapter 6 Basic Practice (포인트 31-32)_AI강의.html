window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 6 Basic Practice (포인트 31-32)","audioDir":"Chapter_6_Basic_Practice_(포인트_31-32)_audio","preview":false,"count":80,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">관계부사(why/when/where/how)와 관계대명사(who/which/that), 삽입절 수일치\u003c/div>\u003ch1>관계부사·관계대명사 총정리 문제풀이 (Chapter 6 Basic Practice)\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 Chapter 6 Basic Practice, 포인트 서른한 번과 서른두 번 문제를 함께 풀어 볼 거예요. 관계부사와 관계대명사가 섞여 나오는 부분이라 학생들이 가장 많이 헷갈려 하는 단원이죠. 선행사와 뒤에 오는 절의 모양만 정확히 보면 답이 보이니까, 오늘 그 눈을 만들어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계부사 why (이유)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 \u003cb class=\"key\">the reason\u003c/b>일 때 관계부사 \u003cb class=\"key\">why\u003c/b>를 써서 '~한 이유'를 나타냅니다. why 뒤에는 주어와 동사가 모두 있는 \u003cb class=\"key\">완전한 절\u003c/b>이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">the reason + why + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>선행사가 reason이면 why\u003c/li>\u003cli>why 뒤는 주어·동사가 다 있는 완전한 절\u003c/li>\u003cli>how는 reason과 함께 쓸 수 없음\u003c/li>\u003cli>관계부사 why는 생략 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I don't know \u003cspan class=\"fx\">the reason why\u003c/span> he left.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 떠난 이유를 모르겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 이유를 나타내는 관계부사부터 볼게요. 선행사가 the reason일 때는 관계부사 why를 써서 '~한 이유'라는 뜻을 만들어요. 이때 why 뒤에는 주어와 동사가 모두 있는 완전한 절이 와요. 학생들이 자주 how를 넣고 싶어 하는데, how는 the way와 어울리는 말이라서 reason 뒤에는 쓸 수 없어요. 그래서 reason이 보이면 바로 why를 떠올리시면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Is there a reason \u003cspan class=\"p-box\">\u003cspan>how\u003c/span>\u003ci>/\u003c/i>\u003cspan>why\u003c/span>\u003c/span> you chose this book for the discussion?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">how\u003c/div>\u003cdiv class=\"p-op\">why\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">why\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 이유를 나타내는 선행사 뒤에 어떤 관계부사가 오는지를 묻고 있어요. 빈칸 앞의 선행사와 뒤 절의 모양을 함께 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 why입니다. 선행사가 reason이고 뒤에 완전한 절이 오니까 이유의 관계부사 why를 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Is there a reason \u003cspan class=\"p-box\">\u003cspan>how\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">why\u003c/span>\u003c/span> you chose this book for the discussion?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">how\u003c/div>\u003cdiv class=\"p-op\">why\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 찾기\u003c/b>빈칸 앞에 a reason, 즉 \u003cb class=\"key\">이유\u003c/b>를 뜻하는 선행사가 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에는 \u003cb class=\"key\">you chose\u003c/b>처럼 주어와 동사가 모두 있는 \u003cb class=\"key\">완전한 절\u003c/b>이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">관계부사 결정\u003c/b>선행사가 이유이고 뒤가 완전한 절이면 \u003cb class=\"key\">why\u003c/b>입니다. how는 the way와만 어울리므로 reason 뒤에는 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 why\u003c/span>\u003cdiv class=\"p-full\">Is there a reason why you chose this book for the discussion?\u003c/div>\u003cdiv class=\"p-ko\">토론을 위해 이 책을 고른 이유가 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>reason 뒤에 how를 끌어와 reason how로 만드는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 빈칸 앞을 보면 a reason이라는 선행사가 보여요. 이유를 뜻하는 명사죠.","hl":"st-0"},{"n":7,"text":"그리고 뒤를 보면 you chose this book이라고 주어와 동사가 다 갖춰진 완전한 절이 와요.","hl":"st-1"},{"n":8,"text":"선행사가 이유이고 뒤에 완전한 절이 오면 why를 써요. how는 the way와만 어울리고 reason 뒤에는 쓰지 않습니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. reason 뒤에 how를 끌어와 reason how로 만드는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">the way 뒤의 that (how 금지)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 \u003cb class=\"key\">the way\u003c/b>(방법)일 때는 \u003cb class=\"key\">that\u003c/b>을 쓰거나 아무것도 쓰지 않으며, \u003cb class=\"key\">how\u003c/b>는 함께 쓸 수 없습니다.\u003cdiv>\u003cspan class=\"g-formula\">the way + that + 완전한 절 / the way + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the way how는 뜻이 겹쳐 틀린 표현\u003c/li>\u003cli>the way that은 가능하고 that은 생략 가능\u003c/li>\u003cli>ways(방법들) 뒤에도 how 대신 that 또는 생략\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I like \u003cspan class=\"fx\">the way that\u003c/span> she smiles.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀가 웃는 방식이 좋다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 the way 뒤에 오는 말을 정리해 볼게요. 방법이나 방식을 뜻하는 the way 뒤에는 that을 쓰거나 아무것도 쓰지 않아요. 그런데 how도 방법을 뜻하니까 the way how라고 쓰고 싶어지죠. 하지만 이렇게 쓰면 같은 뜻이 두 번 겹쳐서 틀린 표현이 돼요. 그러니까 the way가 나오면 that 아니면 생략, how는 절대 안 된다고 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Scientists build machines that transform the way \u003cspan class=\"p-box\">\u003cspan>that\u003c/span>\u003ci>/\u003c/i>\u003cspan>how\u003c/span>\u003c/span> we live.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">how\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제도 선행사가 힌트예요. the way 뒤에 무엇이 올 수 있고 무엇이 올 수 없는지 생각하면서 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 that입니다. the way 뒤에는 that을 쓰거나 생략하고, how는 뜻이 겹치기 때문에 쓸 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Scientists build machines that transform the way \u003cspan class=\"p-box\">\u003cspan class=\"ok\">that\u003c/span>\u003ci>/\u003c/i>\u003cspan>how\u003c/span>\u003c/span> we live.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">how\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>빈칸 앞의 the way는 \u003cb class=\"key\">방법·방식\u003c/b>을 뜻하는 선행사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에는 \u003cb class=\"key\">we live\u003c/b>처럼 주어와 동사가 있는 완전한 절이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">that과 how 비교\u003c/b>the way 뒤에는 \u003cb class=\"key\">that\u003c/b>을 쓰거나 생략합니다. how는 '방법'이라는 뜻이 겹쳐 the way how로는 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 that\u003c/span>\u003cdiv class=\"p-full\">Scientists build machines that transform the way that we live.\u003c/div>\u003cdiv class=\"p-ko\">과학자들은 우리가 사는 방식을 바꾸는 기계를 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>the way how가 자연스럽게 들려서 how를 고르는 실수\u003c/div>","segs":[{"n":14,"text":"빈칸 앞을 보면 the way가 있어요. 방법이나 방식을 뜻하는 말이죠.","hl":"st-0"},{"n":15,"text":"뒤에는 we live라고 주어와 동사가 다 있는 완전한 절이 와요.","hl":"st-1"},{"n":16,"text":"the way 뒤에는 that을 쓰거나 아무것도 쓰지 않아요. how는 이미 방법이라는 뜻을 담고 있어서 the way와 같이 쓰면 뜻이 겹쳐 틀린 표현이 됩니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. the way how가 자연스럽게 들려서 how를 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주격 관계대명사 who와 삽입절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계대명사 뒤에 \u003cb class=\"key\">I think\u003c/b>, \u003cb class=\"key\">I believe\u003c/b> 같은 삽입절이 오면, 그 부분을 빼고 남은 절에서 관계대명사가 \u003cb class=\"key\">주어\u003c/b>인지 \u003cb class=\"key\">목적어\u003c/b>인지로 격을 정합니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사(사람) + who + (I think) + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>삽입절은 지우고 판단\u003c/li>\u003cli>뒤에 동사가 바로 오면 주격 who\u003c/li>\u003cli>전치사·타동사의 목적어 자리면 목적격 whom\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is the girl who I think is honest.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 내가 정직하다고 생각하는 소녀다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"관계대명사 뒤에 I think나 I believe 같은 말이 끼어 있는 경우를 볼게요. 이럴 때는 그 끼어든 부분을 잠깐 지우고 생각하는 게 핵심이에요. 지우고 나서 관계대명사 자리에 주어가 필요한지 목적어가 필요한지를 확인하면 돼요. 뒤에 동사가 바로 오면 주어가 필요한 것이니까 주격 who를 쓰고, 목적어가 비어 있으면 whom을 쓰는 거예요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Choose the group of people \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan>whom\u003c/span>\u003c/span> you think are more attractive.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whom\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 관계대명사 뒤에 짧은 표현이 끼어 있어요. 끼어든 부분을 지우면 답이 보입니다.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 who입니다. you think를 지우면 뒤에 are가 바로 오니까 주격 관계대명사 who가 필요해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Choose the group of people \u003cspan class=\"p-box\">\u003cspan class=\"ok\">who\u003c/span>\u003ci>/\u003c/i>\u003cspan>whom\u003c/span>\u003c/span> you think are more attractive.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whom\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">삽입절 지우기\u003c/b>you think는 삽입된 말이므로 지우고 봅니다. 남으면 \u003cb class=\"key\">the group of people __ are more attractive\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">빈자리 역할 확인\u003c/b>남은 절에서 빈자리 뒤에 \u003cb class=\"key\">are\u003c/b>가 오므로 빈자리는 \u003cb class=\"key\">주어\u003c/b> 자리입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">격 결정\u003c/b>주어 자리이므로 주격 \u003cb class=\"key\">who\u003c/b>입니다. whom은 목적격이라 여기서는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 who\u003c/span>\u003cdiv class=\"p-full\">Choose the group of people who you think are more attractive.\u003c/div>\u003cdiv class=\"p-ko\">당신이 더 매력적이라고 생각하는 사람들의 집단을 고르세요.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>you think에 이끌려 목적격 whom을 고르는 실수\u003c/div>","segs":[{"n":22,"text":"먼저 you think를 지워 보세요. 삽입된 표현이라 없어도 문장이 성립하거든요.","hl":"st-0"},{"n":23,"text":"지우고 나면 빈자리 바로 뒤에 are가 와요. 그렇다면 빈자리는 주어 자리라는 뜻이죠.","hl":"st-1"},{"n":24,"text":"주어 자리니까 주격 who를 써야 해요. whom은 목적어 자리에만 쓰니까 여기서는 틀린 답입니다.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. you think에 이끌려 목적격 whom을 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계부사 where (장소)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 \u003cb class=\"key\">장소\u003c/b>이고 뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 오면 관계부사 \u003cb class=\"key\">where\u003c/b>를 씁니다. where는 전치사 + which로 바꿔 쓸 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">장소 선행사 + where + 완전한 절 (= in/at which)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>where 뒤는 주어·동사가 다 있는 완전한 절\u003c/li>\u003cli>뒤가 불완전하면 which를 써야 함\u003c/li>\u003cli>where = in which, at which\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the house \u003cspan class=\"fx\">where I grew up\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이곳은 내가 자란 집이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"장소를 나타내는 관계부사 where를 볼게요. 선행사가 장소이고 뒤에 주어와 동사가 다 있는 완전한 절이 오면 where를 써요. where는 in which나 at which를 짧게 줄인 말이라고 생각하면 이해가 쉬워요. 반대로 뒤에 주어나 목적어가 빠진 불완전한 절이 오면 관계대명사 which를 써야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The frog must remain near the water \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u003ci>/\u003c/i>\u003cspan>where\u003c/span>\u003c/span> it can take a dip every now and then.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">which\u003c/div>\u003cdiv class=\"p-op\">where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">where\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 선행사가 무엇을 뜻하는지, 뒤 절이 완전한지 두 가지만 확인하면 됩니다.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 where입니다. 선행사가 장소인 water이고 뒤에 완전한 절이 오니까 관계부사 where를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The frog must remain near the water \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">where\u003c/span>\u003c/span> it can take a dip every now and then.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">which\u003c/div>\u003cdiv class=\"p-op\">where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>선행사 the water는 \u003cb class=\"key\">장소\u003c/b>를 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에는 \u003cb class=\"key\">it can take a dip\u003c/b>처럼 주어와 동사가 모두 있는 \u003cb class=\"key\">완전한 절\u003c/b>이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">관계부사 선택\u003c/b>장소 선행사 + 완전한 절이므로 \u003cb class=\"key\">where\u003c/b>입니다. which는 뒤에 불완전한 절이 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 where\u003c/span>\u003cdiv class=\"p-full\">The frog must remain near the water where it can take a dip every now and then.\u003c/div>\u003cdiv class=\"p-ko\">개구리는 이따금 물에 들어갈 수 있는 물가에 머물러야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>뒤 절이 완전한데도 습관적으로 which를 고르는 실수\u003c/div>","segs":[{"n":30,"text":"빈칸 앞의 the water를 보세요. 장소를 나타내는 선행사죠.","hl":"st-0"},{"n":31,"text":"뒤에는 it can take a dip이라고 주어와 조동사, 동사가 다 갖춰진 완전한 절이 와요.","hl":"st-1"},{"n":32,"text":"장소 선행사 뒤에 완전한 절이 오면 where를 써요. which를 쓰려면 뒤에 주어나 목적어가 빠져 있어야 하는데 여기는 그렇지 않죠.","hl":"st-2"},{"n":33,"text":"이 문제의 함정도 짚고 갈게요. 뒤 절이 완전한데도 습관적으로 which를 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계부사 when (시간)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 \u003cb class=\"key\">시간\u003c/b>(years, days, time 등)이고 뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 오면 관계부사 \u003cb class=\"key\">when\u003c/b>을 씁니다. 이때 when 대신 \u003cb class=\"key\">that\u003c/b>을 쓰기도 합니다.\u003cdiv>\u003cspan class=\"g-formula\">시간 선행사 + when + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>years, days, a time 뒤에는 when\u003c/li>\u003cli>when 자리에 that을 쓰는 것도 가능\u003c/li>\u003cli>뒤에 주어가 없으면 관계대명사 which/that\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I remember \u003cspan class=\"fx\">the days when\u003c/span> we played together.\u003c/div>\u003cdiv class=\"g-ko\">나는 우리가 함께 놀던 날들을 기억한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"시간을 나타내는 관계부사 when을 정리해 볼게요. 선행사가 years나 days, time처럼 시간을 뜻하고 뒤에 완전한 절이 오면 when을 써요. 그리고 회화체에서는 이 when 자리에 that을 쓰기도 해요. 그래서 days 뒤에 that이 있어도 틀린 게 아니라는 점, 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Tree rings usually grow wider in years \u003cu class=\"p-u\">which\u003c/u> it is warm and wet.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">which → when\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"첫 번째 고치기 문제예요. 밑줄 앞의 선행사가 무엇을 뜻하는지부터 확인해 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":7},{"n":37,"text":"which를 when으로 고칩니다. 선행사 years가 시간이고 뒤에 완전한 절이 오니까 관계부사 when이 필요해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Tree rings usually grow wider in years \u003cu class=\"p-u\">which\u003c/u> it is warm and wet.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>선행사 years는 \u003cb class=\"key\">시간\u003c/b>을 뜻합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에는 \u003cb class=\"key\">it is warm and wet\u003c/b>처럼 주어와 동사가 모두 있는 완전한 절이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">고치기\u003c/b>시간 선행사 + 완전한 절이므로 which를 \u003cb class=\"key\">when\u003c/b>으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 which → when\u003c/span>\u003cdiv class=\"p-full\">Tree rings usually grow wider in years when it is warm and wet.\u003c/div>\u003cdiv class=\"p-ko\">나이테는 보통 따뜻하고 습한 해에 더 넓게 자란다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>뒤 절이 완전한데 which를 그대로 두는 실수\u003c/div>","segs":[{"n":38,"text":"먼저 선행사를 보면 years예요. 시간을 뜻하는 말이죠.","hl":"st-0"},{"n":39,"text":"뒤에는 it is warm and wet이라고 주어와 동사가 다 있는 완전한 절이 와요.","hl":"st-1"},{"n":40,"text":"시간 선행사 뒤에 완전한 절이 오면 when을 써야 해요. 그래서 which를 when으로 고치는 겁니다.","hl":"st-2"},{"n":41,"text":"이 문제의 함정도 짚고 갈게요. 뒤 절이 완전한데 which를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">접속사 that (보어절)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">The reason is \u003cb class=\"key\">that\u003c/b> ~ 처럼 be동사 뒤에서 '~라는 것'이라는 절을 이끌 때는 \u003cb class=\"key\">접속사 that\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">The reason is + that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>보어 자리의 that은 생략 불가\u003c/li>\u003cli>because를 끌어오면 의미가 어긋남\u003c/li>\u003cli>주어가 The reason이면 보어는 that절\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The reason \u003cspan class=\"fx\">is that\u003c/span> he was sick.\u003c/div>\u003cdiv class=\"g-ko\">그 이유는 그가 아팠기 때문이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The reason is that 이라는 표현을 볼게요. be동사 뒤에서 '~라는 것'이라는 뜻으로 절을 이끌 때는 접속사 that을 써요. 학생들이 because를 쓰고 싶어 하는데, 여기서는 that이 맞아요. 그리고 이 that은 생략할 수 없다는 것도 함께 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cu class=\"p-u\">The reason I love cooking\u003c/u> is that it involves both art and science.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":43,"text":"두 번째 문제는 밑줄 친 부분이 길어서 부담스럽게 보여요. 하지만 주어 자리와 보어 자리를 나눠서 보면 간단합니다.","hl":"q"},{"n":44,"text":"","hl":"q","pause":7},{"n":45,"text":"정답은 맞음, 동그라미입니다. the reason 뒤에 why가 생략된 주어도 자연스럽고, be동사 뒤에 접속사 that이 온 것도 알맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cu class=\"p-u\">The reason I love cooking\u003c/u> is that it involves both art and science.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어부 확인\u003c/b>주어는 \u003cb class=\"key\">The reason I love cooking\u003c/b>으로, the reason 뒤에 관계부사 why가 생략된 형태입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">보어절 확인\u003c/b>be동사 뒤 보어 자리에는 '~라는 것'을 이끄는 \u003cb class=\"key\">접속사 that\u003c/b>이 와서 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>주어 구조와 that절 모두 문제가 없으므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">The reason I love cooking is that it involves both art and science.\u003c/div>\u003cdiv class=\"p-ko\">내가 요리를 좋아하는 이유는 그것이 예술과 과학을 모두 포함하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어가 길다고 해서 that절로 착각하거나, that을 because로 바꾸려는 실수\u003c/div>","segs":[{"n":46,"text":"밑줄 친 부분은 문장의 주어예요. the reason 뒤에 why가 생략된 형태로, 요리하는 것을 좋아하는 이유라는 뜻이 됩니다.","hl":"st-0"},{"n":47,"text":"그리고 is 뒤에는 that절이 와서 이유의 내용을 설명하고 있어요. 이때 that은 접속사로 쓰인 게 맞습니다.","hl":"st-1"},{"n":48,"text":"주어도 문제 없고 that절도 문제 없으니 이 문장은 그대로 맞습니다.","hl":"st-2"},{"n":49,"text":"이 문제의 함정도 짚고 갈게요. 주어가 길다고 해서 that절로 착각하거나, that을 because로 바꾸려는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">삽입절과 주어-동사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계사절 안에 \u003cb class=\"key\">I believe\u003c/b>, \u003cb class=\"key\">I think\u003c/b>가 삽입되면 동사의 수는 삽입절이 아니라 \u003cb class=\"key\">선행사\u003c/b>에 맞춥니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사(복수) + that + I believe + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>삽입절은 수 일치에 영향 없음\u003c/li>\u003cli>관계사절 동사의 주어 = 선행사\u003c/li>\u003cli>believe 뒤에 바로 온 동사가 관계사절의 동사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">These are the books \u003cspan class=\"fx\">that I believe are\u003c/span> useful.\u003c/div>\u003cdiv class=\"g-ko\">이것들은 내가 유용하다고 믿는 책들이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":50,"text":"관계사절 안에 I believe 같은 삽입 표현이 들어간 경우예요. 이때 동사의 수는 삽입된 부분이 아니라 원래 주인, 그러니까 관계대명사의 선행사를 따라가요. 선행사가 복수면 동사도 복수로 써야 한다는 뜻이에요. 시험에서는 일부러 삽입 표현을 넣어서 단수 동사로 꼬아 놓으니까, 삽입 표현을 지우고 선행사를 찾는 습관을 들이세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">I need time to do all the things that I believe \u003cu class=\"p-u\">is\u003c/u> important for my family.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is → are\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":51,"text":"세 번째 문제에는 삽입 표현이 숨어 있어요. 동사의 진짜 주인이 누구인지 찾아보세요.","hl":"q"},{"n":52,"text":"","hl":"q","pause":7},{"n":53,"text":"is를 are로 고칩니다. 관계사절의 주어는 복수인 all the things이고, I believe는 삽입된 표현이라 수 일치에 영향을 주지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">I need time to do all the things that I believe \u003cu class=\"p-u\">is\u003c/u> important for my family.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">삽입절 지우기\u003c/b>I believe는 삽입된 표현이므로 지우고 봅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">관계사절 주어 찾기\u003c/b>남은 절의 주어는 관계대명사 that, 그 선행사는 \u003cb class=\"key\">all the things\u003c/b>로 복수입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">수 일치\u003c/b>복수 선행사에 맞춰 \u003cb class=\"key\">are\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 is → are\u003c/span>\u003cdiv class=\"p-full\">I need time to do all the things that I believe are important for my family.\u003c/div>\u003cdiv class=\"p-ko\">나는 내가 가족에게 중요하다고 믿는 모든 일을 할 시간이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>삽입된 I believe를 주어로 착각해 단수 is를 그대로 두는 실수\u003c/div>","segs":[{"n":54,"text":"먼저 I believe를 지워 보세요. 삽입된 말이라 문장 성립에는 영향이 없어요.","hl":"st-0"},{"n":55,"text":"지우고 나면 동사의 주인은 관계대명사 that이 되고, 그 that은 앞의 all the things를 가리켜요. 복수 명사죠.","hl":"st-1"},{"n":56,"text":"주어가 복수니까 동사도 복수인 are로 맞춰야 합니다. 그래서 is를 are로 고치는 거예요.","hl":"st-2"},{"n":57,"text":"이 문제의 함정도 짚고 갈게요. 삽입된 I believe를 주어로 착각해 단수 is를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">I remember the days \u003cu class=\"p-u\">that\u003c/u> we used to go cycling together.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":58,"text":"네 번째 문제는 밑줄 친 that이 관계대명사인지 관계부사인지 판단하는 문제예요. 뒤 절이 완전한지 확인해 보세요.","hl":"q"},{"n":59,"text":"","hl":"q","pause":7},{"n":60,"text":"정답은 맞음, 동그라미입니다. 시간 선행사 days 뒤에 완전한 절이 오고, when 자리에 that을 쓰는 것도 가능하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">I remember the days \u003cu class=\"p-u\">that\u003c/u> we used to go cycling together.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>선행사 the days는 \u003cb class=\"key\">시간\u003c/b>을 뜻합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">뒤 절 확인\u003c/b>뒤에는 \u003cb class=\"key\">we used to go cycling together\u003c/b>처럼 주어와 동사가 모두 있는 완전한 절이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">that의 쓰임\u003c/b>시간 선행사 뒤 완전한 절에서는 when을 쓰는데, 회화체에서는 \u003cb class=\"key\">that\u003c/b>으로 대신할 수 있으므로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">I remember the days that we used to go cycling together.\u003c/div>\u003cdiv class=\"p-ko\">나는 우리가 함께 자전거를 타러 가곤 했던 날들을 기억한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>that은 관계대명사만 된다고 생각해서 틀렸다고 판정하는 실수\u003c/div>","segs":[{"n":61,"text":"먼저 밑줄 앞의 the days를 보세요. 시간을 뜻하는 선행사예요.","hl":"st-0"},{"n":62,"text":"뒤에는 we used to go cycling이라고 주어와 동사가 다 있는 완전한 절이 와요.","hl":"st-1"},{"n":63,"text":"시간 선행사 뒤에 완전한 절이 오면 when을 쓰지만, that으로 대신하는 것도 허용돼요. 그래서 이 문장은 맞습니다.","hl":"st-2"},{"n":64,"text":"이 문제의 함정도 짚고 갈게요. that은 관계대명사만 된다고 생각해서 틀렸다고 판정하는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">전치사 + 관계대명사 which (= where)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계사절 안에 전치사가 남아 있으면 \u003cb class=\"key\">전치사 + which\u003c/b> 형태로 씁니다. 장소를 나타낼 때는 이를 \u003cb class=\"key\">where\u003c/b> 하나로 바꿀 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + which + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>through which, in which, at which 형태\u003c/li>\u003cli>장소라면 where로 교체 가능\u003c/li>\u003cli>전치사 뒤에는 that을 쓸 수 없음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the road \u003cspan class=\"fx\">through which\u003c/span> we walked.\u003c/div>\u003cdiv class=\"g-ko\">이것은 우리가 걸어 지나간 길이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":65,"text":"마지막으로 전치사가 함께 쓰이는 관계대명사를 볼게요. 관계사절 안에 전치사가 남아 있으면 전치사를 which 앞으로 보내서 through which, in which처럼 써요. 그리고 장소를 뜻할 때는 이걸 where 하나로 줄일 수도 있어요. 다만 전치사 뒤에는 that을 쓸 수 없다는 점도 같이 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">I have enjoyed our scenic natural spaces for my whole life. The land (1) \u003cu class=\"p-u\">through\u003c/u> the Pine Hill walking trail would cut is home to a variety of species. Wildlife faces pressure from development, and these animals need space (2) \u003cu class=\"p-u\">which\u003c/u> they can hide from human activity. We should think of ways (3) \u003cu class=\"p-u\">how\u003c/u> we can stop destroying habitats with excess trails.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) through which (2) where 또는 in which (3) that 또는 how 삭제\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":66,"text":"이번에는 지문형 문제예요. 세 개의 빈칸을 차례로 보면서 선행사와 뒤 절의 완전성을 확인해 보세요.","hl":"q"},{"n":67,"text":"","hl":"q","pause":7},{"n":68,"text":"첫 번째는 through which, 두 번째는 where 또는 in which, 세 번째는 that으로 바꾸거나 how를 삭제합니다. 선행사의 종류와 뒤 절의 모양이 답을 정해 줍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">I have enjoyed our scenic natural spaces for my whole life. The land (1) \u003cu class=\"p-u\">through\u003c/u> the Pine Hill walking trail would cut is home to a variety of species. Wildlife faces pressure from development, and these animals need space (2) \u003cu class=\"p-u\">which\u003c/u> they can hide from human activity. We should think of ways (3) \u003cu class=\"p-u\">how\u003c/u> we can stop destroying habitats with excess trails.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>선행사 the land를 받고 뒤에는 주어 the Pine Hill walking trail과 동사 would cut이 있는 완전한 절이 옵니다. 전치사 through의 목적어가 비어 있으므로 \u003cb class=\"key\">through which\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>선행사 space는 \u003cb class=\"key\">장소\u003c/b>이고 뒤 절 they can hide from human activity는 완전합니다. which를 \u003cb class=\"key\">where\u003c/b>로 고치거나 \u003cb class=\"key\">in which\u003c/b>로 바꿉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>선행사 ways 뒤에 how는 쓸 수 없습니다. \u003cb class=\"key\">that\u003c/b>으로 바꾸거나 how를 삭제합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) through which (2) where 또는 in which (3) that 또는 how 삭제\u003c/span>\u003cdiv class=\"p-full\">The land through which the Pine Hill walking trail would cut is home to a variety of species. Wildlife faces pressure from development, and these animals need space where they can hide from human activity. We should think of ways that we can stop destroying habitats with excess trails.\u003c/div>\u003cdiv class=\"p-ko\">파인 힐 산책로가 가로지를 땅은 다양한 생물종의 서식지이다. 야생동물은 개발로 인한 압박에 직면해 있으며, 이 동물들은 인간 활동을 피해 숨을 수 있는 공간이 필요하다. 우리는 과도한 산책로로 서식지를 파괴하는 것을 막을 방법을 생각해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 뒤 절이 완전한데도 which를 그대로 두는 실수, (3)에서 how를 살려 두는 실수\u003c/div>","segs":[{"n":69,"text":"지문 첫 번째 빈칸을 볼게요. 선행사는 the land이고, 뒤에는 주어와 동사가 다 있는 완전한 절이 와요. 그런데 through의 목적어가 비어 있죠. 그래서 전치사를 which 앞으로 보내서 through which라고 고칩니다.","hl":"st-0"},{"n":70,"text":"두 번째 빈칸의 선행사 space는 장소예요. 뒤에 오는 절도 완전하고요. 이럴 때는 which를 where로 고치거나 in which로 바꿔 줍니다.","hl":"st-1"},{"n":71,"text":"세 번째 빈칸은 ways 뒤에 how가 온 경우예요. 방법을 뜻하는 선행사 뒤에는 how를 쓸 수 없어요. 그래서 that으로 바꾸거나 how를 아예 지워야 합니다.","hl":"st-2"},{"n":72,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 뒤 절이 완전한데도 which를 그대로 두는 실수, (3)에서 how를 살려 두는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Known as the &quot;Mother of Hubble,&quot; Nancy Grace Roman was one of the first female executives at NASA (1) \u003cu class=\"p-u\">there\u003c/u> she was instrumental in establishing the Hubble Telescope program structure. She was also NASA's first chief astronomer. At a time (2) \u003cu class=\"p-u\">which\u003c/u> very few women worked at NASA, she made multiple crucial scientific discoveries. She is one of the scientists (3) \u003cu class=\"p-u\">whom\u003c/u> I believe shaped world history.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) where (2) when 또는 that (3) who\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":73,"text":"마지막 지문 문제예요. 세 빈칸 모두 선행사가 무엇인지, 뒤 절이 완전한지, 그리고 삽입 표현이 있는지를 차례로 확인해 보세요.","hl":"q"},{"n":74,"text":"","hl":"q","pause":7},{"n":75,"text":"첫 번째는 where, 두 번째는 when 또는 that, 세 번째는 who로 고칩니다. 장소는 where, 시간은 when, 주어 자리면 who라고 정리해 두면 좋아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Known as the &quot;Mother of Hubble,&quot; Nancy Grace Roman was one of the first female executives at NASA (1) \u003cu class=\"p-u\">there\u003c/u> she was instrumental in establishing the Hubble Telescope program structure. She was also NASA's first chief astronomer. At a time (2) \u003cu class=\"p-u\">which\u003c/u> very few women worked at NASA, she made multiple crucial scientific discoveries. She is one of the scientists (3) \u003cu class=\"p-u\">whom\u003c/u> I believe shaped world history.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>선행사 NASA는 \u003cb class=\"key\">장소\u003c/b>이고 뒤 절 she was instrumental in ~은 완전합니다. there를 \u003cb class=\"key\">where\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>선행사 a time은 \u003cb class=\"key\">시간\u003c/b>이고 뒤 절 very few women worked at NASA는 완전합니다. which를 \u003cb class=\"key\">when\u003c/b>으로 고치며, that도 가능합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>삽입절 I believe를 지우면 __ shaped world history에서 빈자리는 \u003cb class=\"key\">주어\u003c/b>입니다. 따라서 목적격 whom을 주격 \u003cb class=\"key\">who\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) where (2) when 또는 that (3) who\u003c/span>\u003cdiv class=\"p-full\">Known as the &quot;Mother of Hubble,&quot; Nancy Grace Roman was one of the first female executives at NASA where she was instrumental in establishing the Hubble Telescope program structure. At a time when very few women worked at NASA, she made multiple crucial scientific discoveries. She is one of the scientists who I believe shaped world history.\u003c/div>\u003cdiv class=\"p-ko\">'허블의 어머니'로 알려진 낸시 그레이스 로먼은 허블 망원경 프로그램 체계를 세우는 데 중요한 역할을 한 NASA의 첫 여성 임원 중 한 명이었다. 그녀는 NASA의 첫 수석 천문학자이기도 했다. NASA에서 여성이 거의 일하지 않던 시기에 그녀는 여러 중요한 과학적 발견을 해냈다. 그녀는 세계 역사를 만들어 냈다고 내가 믿는 과학자 중 한 명이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(3)에서 삽입절 I believe에 이끌려 whom을 그대로 두는 실수\u003c/div>","segs":[{"n":76,"text":"첫 번째 빈칸의 앞을 보면 NASA가 있어요. 장소를 뜻하는 선행사이고, 뒤에 오는 절도 완전합니다. 그래서 there를 관계부사 where로 고칩니다.","hl":"st-0"},{"n":77,"text":"두 번째 빈칸의 선행사는 a time으로 시간을 뜻해요. 뒤에 오는 절도 완전하니까 which를 when으로 고칩니다. 여기서는 that을 써도 괜찮습니다.","hl":"st-1"},{"n":78,"text":"세 번째 빈칸은 I believe를 지우고 보세요. 그러면 빈자리 뒤에 shaped라는 동사가 나오니까 빈자리는 주어 자리예요. 그래서 whom을 주격인 who로 고칩니다.","hl":"st-2"},{"n":79,"text":"이 문제의 함정도 짚고 갈게요. (3)에서 삽입절 I believe에 이끌려 whom을 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">관계부사(why/when/where/how)와 관계대명사(who/which/that), 삽입절 수일치\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>선행사가 \u003cb class=\"key\">the reason\u003c/b>이면 why, \u003cb class=\"key\">the way\u003c/b>면 that 또는 생략, how는 쓰지 않습니다.\u003c/li>\u003cli>관계부사 뒤에는 \u003cb class=\"key\">완전한 절\u003c/b>, 관계대명사 뒤에는 \u003cb class=\"key\">불완전한 절\u003c/b>이 옵니다.\u003c/li>\u003cli>삽입절(I think, I believe)은 지우고 나서 \u003cb class=\"key\">격\u003c/b>과 \u003cb class=\"key\">수 일치\u003c/b>를 판단합니다.\u003c/li>\u003cli>장소는 where(=전치사 + which), 시간은 when(또는 that)으로 정리해 두세요.\u003c/li>\u003c/ul>","segs":[{"n":80,"text":"오늘 푼 문제들의 핵심은 결국 두 가지였어요. 선행사가 무엇을 뜻하는지 보고, 뒤에 오는 절이 완전한지 불완전한지 확인하는 것. 그리고 I think나 I believe 같은 표현이 끼어 있으면 지우고 보는 습관이에요. 이 세 가지만 몸에 익히면 관계부사와 관계대명사 문제는 틀릴 일이 거의 없습니다. 오늘도 수고했어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
