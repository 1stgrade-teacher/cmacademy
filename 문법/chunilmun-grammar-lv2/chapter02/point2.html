</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"point2","title":"Chapter02 시제 — 과거시제와 미래 표현 완전 정리","audioDir":"point2_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter02 시제\u003c/div>\u003ch1>Chapter02 시제 — 과거시제와 미래 표현 완전 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>이미 지난 일은 과거시제로, 앞으로 할 일은 will과 be going to로 정확히 구분해 말할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 영어 문법을 공부해 볼까요? 오늘은 시제 단원에서 과거시제와 미래 표현을 배웁니다. 이미 지나간 일은 어떻게 말하고, 앞으로 할 일은 어떻게 말하는지 예문으로 차근차근 알아볼 거예요. 시간 표현만 잘 찾아도 절반은 해결되니까 편하게 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">과거시제: 이미 지난 일\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사의 \u003cb class=\"key\">과거형\u003c/b>을 사용하면 이미 지난 일이나 상태를 나타내어 '~이었다', '~했다'라는 뜻이 됩니다. 이때 \u003cb class=\"key\">yesterday, last ~, ago\u003c/b>처럼 과거를 나타내는 표현과 함께 자주 쓰입니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 과거형 (+ yesterday / last ~ / ago)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was\u003c/span> so busy all last week.\u003c/div>\u003cdiv class=\"g-ko\">나는 지난주 내내 너무 바빴다.\u003c/div>\u003cdiv class=\"g-note\">last week처럼 지난 시간을 가리키는 표현이 있으면 be동사도 과거형 was를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">won\u003c/span> the marathon race in 2020.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 2020년에 마라톤 경주에서 우승했다.\u003c/div>\u003cdiv class=\"g-note\">이미 지난 일이므로 동사는 과거형 won을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">We \u003cspan class=\"fx\">watched\u003c/span> a movie yesterday.\u003c/div>\u003cdiv class=\"g-ko\">우리는 어제 영화를 봤다.\u003c/div>\u003cdiv class=\"g-note\">yesterday가 있으므로 watch가 아니라 과거형 watched를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>문장에 \u003cb class=\"key\">yesterday, last week, ago\u003c/b>가 보이면 동사는 반드시 \u003cb class=\"key\">과거형\u003c/b>으로 씁니다.\u003c/div>","segs":[{"n":2,"text":"먼저 과거시제부터 볼게요. 이미 지나간 일이나 그때의 상태를 말할 때는 동사의 과거형을 씁니다. 그래서 '나는 바빴다'는 I was busy처럼 be동사도 was로 바뀌는 거죠. 그리고 yesterday나 last week, ago처럼 과거를 가리키는 말이 문장에 보이면 과거시제라고 생각하시면 됩니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. I was so busy all last week. 지난주 내내 너무 바빴다는 뜻이에요. last week처럼 지난 시간을 가리키는 말이 있으니까 be동사를 과거형 was로 쓴 거예요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. She won the marathon race in 2020. 그녀는 이천이십 년에 마라톤 경주에서 우승했다는 뜻입니다. 이미 끝난 일이니까 win이 아니라 과거형 won을 썼어요.","hl":"ex-1"},{"n":5,"text":"이번에는 제가 준비한 예문이에요. We watched a movie yesterday. 우리는 어제 영화를 봤다는 뜻이죠. yesterday가 있으니까 watch가 아니라 watched로 써야 합니다.","hl":"ex-2"},{"n":6,"text":"시험에서 자주 나오는 함정이 바로 시간 표현이에요. 문장에 yesterday나 last week, ago가 보이면 동사를 반드시 과거형으로 바꿔야 합니다. 반대로 내일이나 다음 주를 가리키는 말이 있으면 미래 표현을 쓴다는 것도 함께 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">미래 표현: 앞으로 할 일\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「\u003cb class=\"key\">will\u003c/b> + 동사원형」은 '~할 것이다'라는 뜻으로 앞으로 할 일을 나타냅니다. 「\u003cb class=\"key\">be going to\u003c/b> + 동사원형」도 같은 뜻으로, 앞으로의 계획이나 예정을 말할 때 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">will + 동사원형 / be going to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It \u003cspan class=\"fx\">will snow\u003c/span> this weekend.\u003c/div>\u003cdiv class=\"g-ko\">이번 주말에 눈이 올 것이다.\u003c/div>\u003cdiv class=\"g-note\">this weekend처럼 앞으로의 때를 가리키는 표현이 있으면 will과 동사원형을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">am going to see\u003c/span> a doctor.\u003c/div>\u003cdiv class=\"g-ko\">나는 의사에게 진찰을 받을 것이다.\u003c/div>\u003cdiv class=\"g-note\">be going to 뒤에는 동사원형 see가 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">My sister \u003cspan class=\"fx\">is going to study\u003c/span> math tonight.\u003c/div>\u003cdiv class=\"g-ko\">내 여동생은 오늘 밤 수학을 공부할 것이다.\u003c/div>\u003cdiv class=\"g-note\">tonight처럼 앞으로의 때를 가리키는 말이 있으면 be going to와 동사원형을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>will과 be going to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오며, \u003cb class=\"key\">-ed\u003c/b>나 -s를 붙이지 않습니다.\u003c/div>","segs":[{"n":7,"text":"이번에는 앞으로 할 일을 말하는 미래 표현입니다. will 뒤에 동사원형을 붙이면 '~할 것이다'라는 뜻이 되고, be going to 뒤에 동사원형을 붙여도 같은 뜻이 됩니다. be동사는 주어에 맞춰 am, are, is로 바뀌지만 그 뒤에는 언제나 동사원형이 온다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":8,"text":"첫 번째 예문입니다. It will snow this weekend. 이번 주말에 눈이 올 것이라는 뜻이에요. this weekend는 앞으로 올 시간이니까 will 뒤에 동사원형 snow를 쓴 거죠.","hl":"ex-0"},{"n":9,"text":"두 번째 예문이에요. I am going to see a doctor. 나는 의사에게 진찰을 받을 것이라는 뜻입니다. 주어가 I니까 be동사는 am이 되고, 그 뒤에는 동사원형 see가 왔어요.","hl":"ex-1"},{"n":10,"text":"이번에는 제가 준비한 예문이에요. My sister is going to study math tonight. 내 여동생은 오늘 밤 수학을 공부할 것이라는 뜻이죠. 주어가 my sister니까 be동사는 is이고, 뒤에는 동사원형 study가 왔습니다.","hl":"ex-2"},{"n":11,"text":"가장 많이 틀리는 부분이 바로 will 뒤에 동사를 변형해서 쓰는 경우예요. will 뒤에는 언제나 동사원형이 오니까 will goes나 will went 같은 형태는 절대 쓰면 안 됩니다. be going to 뒤도 똑같이 동사원형이라고 생각하시면 쉬워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I will visit my grandmother yesterday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I visited my grandmother yesterday.\u003c/div>\u003cdiv class=\"g-why\">yesterday는 과거를 나타내므로 미래 표현 will이 아니라 과거형 visited를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She will goes to the library tomorrow.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She will go to the library tomorrow.\u003c/div>\u003cdiv class=\"g-why\">will 뒤에는 동사원형이 와야 하므로 goes가 아니라 go를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He is going to went hiking last Sunday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He went hiking last Sunday.\u003c/div>\u003cdiv class=\"g-why\">last Sunday는 과거를 나타내므로 be going to가 아니라 과거형 went를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시간 표현과 시제가 서로 맞지 않으면 틀린 문장이 됩니다. yesterday가 있는데 will을 쓰면 안 되고, 동사를 과거형 visited로 바꿔야 해요.","hl":"mk-0"},{"n":13,"text":"will 뒤에는 반드시 동사원형이 와야 합니다. 주어가 she라서 습관처럼 goes를 쓰고 싶겠지만, will이 앞에 있으니 go로 바꿔야 맞아요.","hl":"mk-1"},{"n":14,"text":"last Sunday처럼 지난 시간을 가리키는 말이 있으면 be going to가 아니라 과거형을 써야 합니다. 그래서 went hiking이라고 해야 맞는 문장이 됩니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Sam [will visit / visited] the art museum last week.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>will visit\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>visited\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">visited\u003c/span>\u003cdiv class=\"g-exp\">last week는 과거를 나타내므로 과거형 visited를 씁니다. will visit은 미래 표현이라 함께 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제입니다. Sam will visit the art museum last week, 또는 Sam visited the art museum last week. 어느 쪽이 어법상 알맞을까요? last week에 주목하면서 잠시 직접 풀어 보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 두 번째, visited예요. last week는 지난 시간을 가리키니까 과거형 visited를 써야 합니다. will visit은 미래 표현이라서 las
