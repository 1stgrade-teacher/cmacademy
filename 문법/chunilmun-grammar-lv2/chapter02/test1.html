    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

lecturePlayer(document.getElementById("app"),{"brand":"Actual Test 1~9번","title":"천일문그래마 레벨2 챕터2 문제풀이","audioDir":"test1_audio","preview":false,"count":81,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">불규칙 동사 변화와 시제\u003c/div>\u003ch1>천일문그래마 레벨2 챕터2 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>9문제 · 바르게 연결된 것 고르기, 빈칸 완성, 영작 서술형, 어법상 알맞은 것 고르기, 문장 전환 서술형\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 천일문그래마 레벨2 챕터2 문제를 함께 풀어 볼 거예요. 동사의 변화형과 과거진행형, 현재완료, 시제 표현을 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">불규칙 동사의 원형·과거형·과거분사형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사는 원형, 과거형, 과거분사형의 세 가지 모습을 가지며 불규칙 동사는 형태를 하나씩 정확히 외워야 해요. 특히 \u003cb class=\"key\">비슷하게 생긴 과거형과 과거분사형\u003c/b>을 구별하는 것이 중요해요.\u003cdiv>\u003cspan class=\"g-formula\">원형 - 과거형 - 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>원형-과거형-과거분사형을 한 세트로 암기\u003c/li>\u003cli>cut-cut-cut, come-came-come, send-sent-sent\u003c/li>\u003cli>buy-bought-bought와 bring-brought-brought 구별\u003c/li>\u003cli>find-found-found와 found-founded-founded 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">come — came — come\u003c/div>\u003cdiv class=\"g-ko\">오다 — 왔다 — 온\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">send — sent — sent\u003c/div>\u003cdiv class=\"g-ko\">보내다 — 보냈다 — 보낸\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"동사는 원형, 과거형, 과거분사형 세 가지 모습을 가져요. 규칙 동사는 보통 ed를 붙이지만, 불규칙 동사는 모양이 다양하게 바뀌죠. 예를 들어 come은 came, come으로 바뀌고 send는 sent, sent로 바뀌어요. 문제에서는 세 형태가 모두 정확한지 하나씩 확인해야 해요. 특히 bought와 brought, found와 founded처럼 비슷하게 생긴 형태를 구별하는 것이 중요해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 9\u003c/span>\u003cspan class=\"g-kind\">바르게 연결된 것 고르기\u003c/span>\u003c/div>\u003cdiv dat 003c/button>","segs":[{"n":12,"text":"두 번째 문제도 불규칙 동사의 세 가지 형태를 묻고 있어요. 특히 과거분사형이 정확한지 눈여겨보세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 다섯 번째 선택지예요. send의 과거형과 과거분사형은 모두 sent로 같아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 9\u003c/span>\u003cspan class=\"g-kind\">바르게 연결된 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 중 동사의 변화형이 바르게 연결된 것을 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① fly — flew — flow\u003c/div>\u003cdiv class=\"p-op\">② grow — grew — grewn\u003c/div>\u003cdiv class=\"p-op\">③ find — found — founded\u003c/div>\u003cdiv class=\"p-op\">④ make — made — maden\u003c/div>\u003cdiv class=\"p-op\">⑤ send — sent — sent\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① fly 확인\u003c/b>fly의 변화는 \u003cb class=\"key\">fly-flew-flown\u003c/b>이므로 flow는 틀려요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② grow 확인\u003c/b>grow의 변화는 \u003cb class=\"key\">grow-grew-grown\u003c/b>이므로 grewn은 틀려요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ find 확인\u003c/b>find의 변화는 \u003cb class=\"key\">find-found-found\u003c/b>이고 founded는 ‘설립했다’라는 다른 동사예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ make 확인\u003c/b>make의 변화는 \u003cb class=\"key\">make-made-made\u003c/b>이므로 maden은 틀려요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ send 확인\u003c/b>send의 변화는 \u003cb class=\"key\">send-sent-sent\u003c/b>이므로 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>find의 과거분사는 found이고 founded는 ‘설립했다’라는 뜻의 다른 동사예요.\u003c/div>","segs":[{"n":15,"text":"첫 번째 선택지는 fly의 과거분사를 flow로 썼어요. fly의 과거분사는 flown이에요.","hl":"st-0"},{"n":16,"text":"두 번째 선택지는 grow의 과거분사를 grewn으로 썼어요. grow의 과거분사는 grown이에요.","hl":"st-1"},{"n":17,"text":"세 번째 선택지는 find의 과거분사를 founded로 썼어요. find의 과거분사는 found이고 founded는 설립하다라는 뜻의 동사예요.","hl":"st-2"},{"n":18,"text":"네 번째 선택지는 make의 과거분사를 maden으로 썼어요. make의 과거분사는 made예요.","hl":"st-3"},{"n":19,"text":"다섯 번째 선택지는 send, sent, sent예요. 세 형태가 모두 바르게 연결되어 있어요.","hl":"st-4"},{"n":20,"text":"이 문제의 함정도 짚고 갈게요. find의 과거분사는 found이고 founded는 ‘설립했다’라는 뜻의 다른 동사예요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">과거진행형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 특정 시점에 진행 중이던 동작은 \u003cb class=\"key\">was/were + 동사원형-ing\u003c/b>로 표현해요. 해석은 보통 ‘~하고 있었다’로 끝나요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + was/were + 동사원형-ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>was는 I, he, she, it에 사용\u003c/li>\u003cli>were는 you, we, they에 사용\u003c/li>\u003cli>ago, then, at that time과 잘 어울림\u003c/li>\u003cli>now와 함께 쓰면 시제가 맞지 않음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">was talking\u003c/span> to my teacher.\u003c/div>\u003cdiv class=\"g-ko\">나는 선생님께 이야기하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">was preparing\u003c/span> a party.\u003c/div>\u003cdiv class=\"g-ko\">그는 파티를 준비하고 있었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"과거진행형은 과거의 어느 시점에 어떤 동작이 계속되고 있었음을 나타내요. 형태는 be동사의 과거형인 was 또는 were 뒤에 동사원형에 ing를 붙인 모양을 써요. 해석은 보통 하고 있었다로 끝나죠. ago, at that time, while 같은 표현이 있으면 과거진행형을 떠올리면 좋아요. 주어가 I나 he, she, it이면 was를, you나 we, they이면 were를 써요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>우리말과 일치하도록 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">나는 10분 전에 선생님께 이야기하고 있었다.\u003cbr>→ I \u003cspan class=\"p-blank\">\u003c/span> to my teacher 10 minutes ago.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① talk\u003c/div>\u003cdiv class=\"p-op\">② talked\u003c/div>\u003cdiv class=\"p-op\">③ am talking\u003c/div>\u003cdiv class=\"p-op\">④ was talking\u003c/div>\u003cdiv class=\"p-op\">⑤ have talked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"세 번째 문제는 우리말과 영어 문장을 보고 빈칸에 알맞은 시제를 고르는 문제예요. 십 분 전에 하고 있던 일이라는 점을 먼저 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":7},{"n":24,"text":"정답은 네 번째 선택지예요. 과거의 어느 시점에 하고 있던 동작이므로 was talking을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>우리말과 일치하도록 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">나는 10분 전에 선생님께 이야기하고 있었다.\u003cbr>→ I \u003cspan class=\"p-blank\">\u003c/span> to my teacher 10 minutes ago.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① talk\u003c/div>\u003cdiv class=\"p-op\">② talked\u003c/div>\u003cdiv class=\"p-op\">③ am talking\u003c/div>\u003cdiv class=\"p-op\">④ was talking\u003c/div>\u003cdiv class=\"p-op\">⑤ have talked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>\u003cb class=\"key\">10 minutes ago\u003c/b>는 과거의 특정 시점을 나타내요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동작의 성격 확인\u003c/b>‘이야기하고 있었다’는 과거에 진행 중이던 동작이므로 \u003cb class=\"key\">과거진행형\u003c/b>이 필요해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 확인\u003c/b>was talking이 \u003cb class=\"key\">was + 동사원형-ing\u003c/b> 형태로 알맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">오답 정리\u003c/b>talk는 현재, talked는 과거, am talking은 현재진행, have talked는 현재완료라서 문맥과 맞지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">I was talking to my teacher 10 minutes ago.\u003c/div>\u003cdiv class=\"p-ko\">나는 10분 전에 선생님께 이야기하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ago가 있으면 현재완료가 아니라 과거 시제를 먼저 생각해요.\u003c/div>","segs":[{"n":25,"text":"문장 끝에 십 분 전이라는 시간 표현이 있어요. 이것은 과거의 특정 시점을 가리켜요.","hl":"st-0"},{"n":26,"text":"해석을 보면 이야기하고 있었다이므로 과거의 어느 순간에 계속되던 동작을 나타내요. 그래서 과거진행형이 필요해요.","hl":"st-1"},{"n":27,"text":"보기 중에서 과거진행형은 was talking이에요. was 다음에 talking이 와서 과거에 하고 있던 일을 나타내요.","hl":"st-2"},{"n":28,"text":"나머지 선택지는 현재, 단순 과거, 현재진행, 현재완료를 나타내므로 십 분 전에 하고 있었다는 의미와 맞지 않아요.","hl":"st-3"},{"n":29,"text":"이 문제의 함정도 짚고 갈게요. ago가 있으면 현재완료가 아니라 과거 시제를 먼저 생각해요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 \u003cb class=\"key\">have/has + 과거분사\u003c/b>로 만들며 경험, 계속, 완료, 결과를 나타내요. since 뒤에는 시작점, for 뒤에는 기간이 와요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have/has + 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어가 3인칭 단수면 has, 그 외에는 have\u003c/li>\u003cli>since + 시작점, for + 기간\u003c/li>\u003cli>ever는 경험을 묻는 현재완료 의문문에 사용\u003c/li>\u003cli>has gone to는 가서 지금 없음, has been to는 가 본 경험\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It \u003cspan class=\"fx\">has snowed\u003c/span> since this afternoon.\u003c/div>\u003cdiv class=\"g-ko\">오늘 오후부터 쭉 눈이 내렸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Have you ever played\u003c/span> tennis?\u003c/div>\u003cdiv class=\"g-ko\">너는 테니스 쳐본 적 있니?\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"현재완료는 have 또는 has 뒤에 과거분사를 붙여서 만들어요. 경험, 계속, 완료, 결과 같은 여러 의미를 나타낼 수 있죠. since 뒤에는 시작점, for 뒤에는 기간이 와요. ever는 주로 현재완료 의문문에서 지금까지의 경험을 물을 때 써요. has gone to는 가서 지금 여기에 없는 결과를, has been to는 가 본 경험이 있다는 뜻을 나타내요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>우리말과 일치하도록 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">오늘 오후부터 쭉 눈이 내렸다.\u003cbr>→ It \u003cspan class=\"p-blank\">\u003c/span> since this afternoon.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① snowed\u003c/div>\u003cdiv class=\"p-op\">② is snowing\u003c/div>\u003cdiv class=\"p-op\">③ has snowed\u003c/div>\u003cdiv class=\"p-op\">④ has snowing\u003c/div>\u003cdiv class=\"p-op\">⑤ is going to snow\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"이번 문제는 오늘 오후부터 쭉이라는 표현에 주목해야 해요. 어떤 시제가 어울리는지 생각해 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":7},{"n":33,"text":"정답은 세 번째 선택지예요. since와 함께 과거에 시작해 지금까지 이어지는 일을 나타내므로 has snowed를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 9\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>우리말과 일치하도록 빈칸에 들어갈 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">오늘 오후부터 쭉 눈이 내렸다.\u003cbr>→ It \u003cspan class=\"p-blank\">\
