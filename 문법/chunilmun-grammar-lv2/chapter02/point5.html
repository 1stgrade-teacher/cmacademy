</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"point5","title":"과거와 현재를 잇는 현재완료 — have + p.p. 완전 정복","audioDir":"point5_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter02 시제 — 현재완료(have + p.p.)\u003c/div>\u003ch1>과거와 현재를 잇는 현재완료 — have + p.p. 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>현재완료 have[has]+과거분사의 의미와 형태를 이해하고, 불규칙 동사의 과거분사를 구별해 문장을 완성할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 Chapter02 시제 단원에서 현재완료를 공부해 볼 거예요. 현재완료는 과거에 일어난 일이 지금까지 영향을 줄 때 쓰는 표현인데요, 이름은 조금 어렵게 들려도 형태는 아주 단순해요. 오늘 배울 핵심은 have 또는 has 뒤에 과거분사를 붙인다는 것, 그리고 그 과거분사를 정확하게 만드는 방법이에요. 불규칙 동사까지 함께 정리하면 여러분도 바로 문장을 만들 수 있으니까 끝까지 집중해 주세요!","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">현재완료의 의미와 기본 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 \u003cb class=\"key\">과거\u003c/b>에 일어난 일이 \u003cb class=\"key\">현재\u003c/b>까지 영향을 줄 때 사용해요. 형태는 \u003cb class=\"key\">have[has]+과거분사(p.p.)\u003c/b>이며, 주어가 I, you, we, they이면 have를, he, she, it 같은 삼인칭 단수 주어이면 has를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have[has] + 과거분사(p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have received\u003c/span> your email.\u003c/div>\u003cdiv class=\"g-ko\">나는 너의 이메일을 받았다.\u003c/div>\u003cdiv class=\"g-note\">과거에 받은 메일이 지금도 유효하다는 뜻을 담고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">has studied\u003c/span> history all day.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 하루 종일 역사를 공부했다.\u003c/div>\u003cdiv class=\"g-note\">주어가 She이므로 have가 아니라 has를 써요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어가 \u003cb class=\"key\">삼인칭 단수\u003c/b>일 때는 have가 아니라 \u003cb class=\"key\">has\u003c/b>를 쓰는 것을 잊지 마세요.\u003c/div>","segs":[{"n":2,"text":"현재완료는 과거에 일어난 일이 지금까지 이어지거나 지금에 영향을 줄 때 쓰는 표현이에요. 형태는 아주 간단한데, 주어 다음에 have 또는 has를 쓰고 그 뒤에 과거분사를 붙이면 됩니다. 주어가 I, you, we, they일 때는 have를 쓰고, he, she, it처럼 삼인칭 단수일 때는 has를 써요. 그래서 지금부터는 have와 has 뒤에 과거분사가 온다는 점만 기억해 두면 돼요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. I have received your email, 나는 너의 이메일을 받았다는 뜻이에요. 과거에 메일을 받았고 그 상태가 지금까지 이어진다는 느낌을 담고 있죠. have 뒤에 received라는 과거분사가 온 점을 눈여겨 봐 주세요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. She has studied history all day, 그녀는 하루 종일 역사를 공부했다는 뜻이에요. 주어가 She라서 have가 아니라 has가 왔다는 점이 중요해요. has 뒤에는 studied라는 과거분사가 오죠.","hl":"ex-1"},{"n":5,"text":"한 가지만 더 강조할게요. 주어가 he나 she, it처럼 삼인칭 단수일 때는 have가 아니라 has를 써야 해요. 이 부분이 시험에서 정말 자주 나오니까 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">과거분사(p.p.) 만들기 — 규칙 변화와 불규칙 변화\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사의 과거분사는 보통 \u003cb class=\"key\">동사원형+-(e)d\u003c/b> 형태로 만들고, 이때 모양이 과거형과 같아요. 그런데 \u003cb class=\"key\">불규칙\u003c/b>으로 변하는 동사도 아주 많아서 하나씩 외워야 해요.\u003cdiv>\u003cspan class=\"g-formula\">규칙동사: 동사원형 + -(e)d / 불규칙동사: 변화형을 따로 암기\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have cut\u003c/span> my nails too short.\u003c/div>\u003cdiv class=\"g-ko\">나는 손톱을 너무 짧게 잘랐다.\u003c/div>\u003cdiv class=\"g-note\">cut은 cut - cut - cut으로 변하지 않는 동사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The singer \u003cspan class=\"fx\">has become\u003c/span> very popular recently.\u003c/div>\u003cdiv class=\"g-ko\">그 가수는 최근에 아주 인기를 얻었다.\u003c/div>\u003cdiv class=\"g-note\">become의 과거분사는 became이 아니라 become이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>have 뒤에는 동사원형이나 과거형이 아니라 반드시 \u003cb class=\"key\">과거분사\u003c/b>가 와요.\u003c/div>","segs":[{"n":6,"text":"이번에는 have 뒤에 오는 과거분사를 만드는 방법을 볼게요. 규칙 동사는 과거형과 똑같이 동사원형 뒤에 ed나 d를 붙이면 됩니다. 그래서 play는 played, study는 studied처럼 만들 수 있어요. 하지만 cut처럼 전혀 변하지 않는 동사, become처럼 과거형과 과거분사가 다른 동사도 있으니 불규칙 동사는 따로 정리해 두어야 해요.","hl":"rule"},{"n":7,"text":"이 예문은 I have cut my nails too short, 나는 손톱을 너무 짧게 잘랐다는 뜻이에요. 여기서 cut은 원형, 과거형, 과거분사가 모두 cut으로 똑같아요. 그래서 have 뒤에도 그대로 cut이 온답니다.","hl":"ex-0"},{"n":8,"text":"이 문장은 The singer has become very popular recently, 그 가수가 최근에 아주 인기를 얻었다는 뜻이에요. become의 과거형은 became이지만 과거분사는 become이에요. 그래서 has 뒤에는 became이 아니라 become이 와야 합니다.","hl":"ex-1"},{"n":9,"text":"꼭 주의할 점이 있어요. have 뒤에 동사원형을 쓰거나 과거형을 쓰면 틀린 문장이 돼요. 반드시 과거분사를 써야 한다는 것, 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">불규칙 변화, 형태별로 묶어서 암기하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">불규칙 동사는 \u003cb class=\"key\">A-A-A형\u003c/b>, \u003cb class=\"key\">A-B-A형\u003c/b>, \u003cb class=\"key\">A-B-B형\u003c/b>, \u003cb class=\"key\">A-B-C형\u003c/b>으로 묶어서 외우면 훨씬 쉽게 기억할 수 있어요. 예를 들어 keep은 keep-kept-kept, do는 do-did-done으로 변합니다.\u003cdiv>\u003cspan class=\"g-formula\">A-A-A / A-B-A / A-B-B / A-B-C 형태로 분류\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have kept\u003c/span> my childhood toys in the box.\u003c/div>\u003cdiv class=\"g-ko\">나는 어린 시절 장난감을 상자에 보관해 왔다.\u003c/div>\u003cdiv class=\"g-note\">keep-kept-kept, 과거형과 과거분사가 같은 A-B-B형이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Everyone \u003cspan class=\"fx\">has done\u003c/span> a good job in the team.\u003c/div>\u003cdiv class=\"g-ko\">모두가 팀에서 좋은 일을 해냈다.\u003c/div>\u003cdiv class=\"g-note\">do-did-done, 셋이 모두 다른 A-B-C형이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시험에 자주 나오는 \u003cb class=\"key\">bring-brought-brought\u003c/b>, \u003cb class=\"key\">catch-caught-caught\u003c/b>처럼 A-B-B형부터 익히면 효율적이에요.\u003c/div>","segs":[{"n":10,"text":"불규칙 동사는 양이 많아 보이지만 형태별로 묶으면 금방 정리돼요. 원형과 과거형, 과거분사가 모두 같은 A-A-A형, 원형과 과거분사가 같은 A-B-A형, 과거형과 과거분사가 같은 A-B-B형, 셋이 모두 다른 A-B-C형이 있어요. keep은 keep, kept, kept으로 A-B-B형이고, do는 do, did, done으로 A-B-C형이에요. 이렇게 묶어서 소리 내어 읽으면 훨씬 오래 기억에 남습니다.","hl":"rule"},{"n":11,"text":"이 예문은 I have kept my childhood toys in the box, 나는 어린 시절 장난감을 상자에 보관해 왔다는 뜻이에요. keep의 변화는 keep, kept, kept으로 과거형과 과거분사가 같아요. 그래서 have 뒤에 kept이 온답니다.","hl":"ex-0"},{"n":12,"text":"마지막 예문은 Everyone has done a good job in the team, 모두가 팀에서 좋은 일을 해냈다는 뜻이에요. do의 변화는 do, did, done으로 셋이 모두 달라요. Everyone은 삼인칭 단수로 보기 때문에 has가 온다는 점도 함께 기억해 주세요.","hl":"ex-1"},{"n":13,"text":"공부 팁을 하나 드릴게요. bring, brought, brought나 catch, caught, caught처럼 규칙이 보이는 A-B-B형부터 익히면 훨씬 빨리 외워져요. 형태별로 묶어서 소리 내어 읽어 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She have studied history all day.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She has studied history all day.\u003c/div>\u003cdiv class=\"g-why\">주어 She는 삼인칭 단수라서 have가 아니라 has를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I have receive your email.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I have received your email.\u003c/div>\u003cdiv class=\"g-why\">have 뒤에는 동사원형이 아니라 과거분사가 와야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The singer has became very popular recently.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The singer has become very popular recently.\u003c/div>\u003cdiv class=\"g-why\">become의 과거분사는 became이 아니라 become이에요.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"이 문장은 주어가 She인데 have를 썼어요. 삼인칭 단수 주어에는 has를 써야 하죠. 그래서 She has studied history all day가 맞습니다.","hl":"mk-0"},{"n":15,"text":"이 문장은 have 뒤에 동사원형 receive를 그대로 썼어요. 현재완료에서는 have 뒤에 반드시 과거분사가 와야 합니다. 그래서 received로 고쳐야 해요.","hl":"mk-1"},{"n":16,"text":"여기서는 became을 썼는데, became은 과거형이에요. become의 과거분사는 become이기 때문에 has become으로 써야 합니다. 과거형과 과거분사를 헷갈리지 않도록 주의하세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 동사를 알맞은 형태로 바꿔 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">We have ____ soccer for 2 hours. (play)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">played\u003c/span>\u003cdiv class=\"g-exp\">현재완료는 have 뒤에 과거분사가 와요. play는 규칙 동사이므로 과거분사는 played예요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제예요. 괄호 안의 play를 알맞은 형태로 바꿔서, We have soccer for two hours의 빈칸을 채워 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 played예요. 현재완료에서는 have 뒤에 과거분사가 오죠. play는 규칙 동사라서 뒤에 ed를 붙여 played가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 동사를 알맞은 형태로 바꿔 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">The farmers have ____ down the tree. (cut)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">cut\u003c/span>\u003cdiv class=\"g-exp\">cut은 cut-cut-cut으로 변하지 않는 동사라서 과거분사도 cut이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제예요. 괄호 안의 cut을 알맞은 형태로 바꿔서, The farmers have down the tree의 빈칸을 채워 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 cut이에요. cut은 원형과 과거형, 과거분사가 모두 똑같은 동사예요. 그래서 have 뒤에도 그대로 cut을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span
