  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Actual Test 17~23번","title":"천일문그래마2 챕터2 현재완료와 과거시제 문제풀이","audioDir":"test3_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">현재완료와 과거시제 / 시제 구분\u003c/div>\u003ch1>천일문그래마2 챕터2 현재완료와 과거시제 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>7문제 · 객관식 영작, 빈칸 완성, 틀린 문장 고르기, 현재완료 쓰임 찾기, 지문 어법 고치기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 천일문 그래마 챕터 이에서 현재완료와 과거시제를 구분하는 문제를 풀어 볼 거예요. since와 for, 그리고 현재완료의 여러 쓰임을 중심으로 차근차근 정리해 봅시다. 문제를 풀 때는 항상 시간 표현을 먼저 찾는 습관을 가져 보세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">과거시제와 현재완료의 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거의 특정 시점을 나타내는 말이 있으면 \u003cb class=\"key\">과거시제\u003c/b>를 쓰고, 현재까지 이어지는 일이나 경험·완료를 말할 때는 \u003cb class=\"key\">현재완료\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">과거의 특정 시점(last night, yesterday, ago) → 과거시제 / for·since와 현재까지의 상황 → have[has] + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>last night, yesterday, ago 같은 표현이 있으면 현재완료를 쓰지 않습니다.\u003c/li>\u003cli>현재완료는 현재와 연결된 느낌을 가지므로 과거의 명확한 시점과 함께 쓰지 않습니다.\u003c/li>\u003cli>문장 안의 시간 표현을 먼저 찾아 시제를 결정합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I lost my umbrella yesterday.\u003c/div>\u003cdiv class=\"g-ko\">나는 어제 우산을 잃어버렸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I have been busy for two weeks.\u003c/div>\u003cdiv class=\"g-ko\">나는 두 주 동안 바빴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, 시제 문제를 볼 때 가장 먼저 찾을 것은 시간 표현이에요. last night이나 yesterday, ago처럼 과거의 특정 시점을 콕 집어 주는 말이 있으면 과거시제를 써야 해요. 반대로 for two weeks나 since last year처럼 현재까지 이어지는 느낌이 있으면 현재완료를 써요. 현재완료는 현재와 연결된 시제라서 어제나 지난밤처럼 끝난 과거 시점과는 함께 쓰지 않는다는 점을 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료의 형태와 함께 쓰는 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 \u003cb class=\"key\">have[has] + 과거분사\u003c/b> 형태로 쓰고, 주어가 삼인칭 단수이면 \u003cb class=\"key\">has\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have/has + p.p. / since + 시작점, for + 기간\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어가 he, she, it, Yumi처럼 삼인칭 단수이면 has를 씁니다.\u003c/li>\u003cli>since 뒤에는 시작 시점, for 뒤에는 기간이 옵니다.\u003c/li>\u003cli>never, already, just 같은 부사는 현재완료와 자주 함께 쓰입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She has lived in London for five years.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 오 년 동안 런던에 살아 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have never ridden\u003c/span> a bike.\u003c/div>\u003cdiv class=\"g-ko\">나는 한 번도 자전거를 타 본 적이 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"현재완료는 모양을 정확히 아는 것이 시작이에요. 주어 뒤에 have나 has를 쓰고 그다음 동사의 과거분사를 붙여요. 주어가 he, she, it처럼 삼인칭 단수이면 has를 쓴다는 점도 중요해요. 기간을 말할 때는 for를 쓰고 시작점을 말할 때는 since를 써요. never나 already, just 같은 표현도 현재완료와 자주 만나니 함께 익혀 두면 좋아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 7\u003c/span>\u003cspan class=\"g-kind\">객관식 영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 중 주어진 우리말을 바르게 영작한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">그는 5년 동안 런던에 살고 있다.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① He lived in London for five years ago.\u003c/div>\u003cdiv class=\"p-op\">② He lived in London since five years ago.\u003c/div>\u003cdiv class=\"p-op\">③ He has lived in London for five years ago.\u003c/div>\u003cdiv class=\"p-op\">④ He has lived in London for five years.\u003c/div>\u003cdiv class=\"p-op\">⑤ He has living in London since five years ago.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":4,"text":"이번 문제는 우리말을 영어로 가장 알맞게 옮긴 문장을 고르는 문제예요. 먼저 오 년 동안이라는 시간 표현이 현재완료와 어떻게 연결되는지 보세요.","hl":"q"},{"n":5,"text":"","hl":"q","pause":7},{"n":6,"text":"정답은 네 번째 선택지예요. 현재까지 런던에 살고 있으므로 has lived와 for five years를 쓴 문장이 알맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 7\u003c/span>\u003cspan class=\"g-kind\">객관식 영작\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 중 주어진 우리말을 바르게 영작한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">그는 5년 동안 런던에 살고 있다.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① He lived in London for five years ago.\u003c/div>\u003cdiv class=\"p-op\">② He lived in London since five years ago.\u003c/div>\u003cdiv class=\"p-op\">③ He has lived in London for five years ago.\u003c/div>\u003cdiv class=\"p-op\">④ He has lived in London for five years.\u003c/div>\u003cdiv class=\"p-op\">⑤ He has living in London since five years ago.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>‘5년 동안’은 현재까지 이어지는 \u003cb class=\"key\">기간\u003c/b>이므로 현재완료와 \u003cb class=\"key\">for\u003c/b>를 써야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">형태 확인\u003c/b>주어 He는 삼인칭 단수이므로 \u003cb class=\"key\">has lived\u003c/b>가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>①, ②는 과거시제라 현재까지 이어지는 뜻이 약하고, ③은 for와 ago를 함께 써 틀리며, ⑤는 has living 형태가 틀립니다. ④만 \u003cb class=\"key\">has lived + for five years\u003c/b>로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">He has lived in London for five years.\u003c/div>\u003cdiv class=\"p-ko\">그는 오 년 동안 런던에 살고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>for와 ago를 함께 쓰거나 since 뒤에 기간을 쓰면 틀립니다.\u003c/div>","segs":[{"n":7,"text":"먼저 우리말에서 오 년 동안이라는 표현을 봐요. 이는 현재까지 이어지는 기간이므로 현재완료와 for를 함께 써야 해요.","hl":"st-0"},{"n":8,"text":"그다음 주어 He를 보면 삼인칭 단수예요. 그래서 has lived 형태가 되어야 해요.","hl":"st-1"},{"n":9,"text":"선택지를 하나씩 보면 첫 번째와 두 번째는 과거시제라서 지금까지 이어지는 느낌을 살리지 못해요. 세 번째는 for와 ago를 같이 써서 틀리고, 다섯 번째는 has living이라는 잘못된 형태예요. 그래서 has lived와 for five years가 들어간 네 번째 선택지가 정답이에요.","hl":"st-2"},{"n":10,"text":"이 문제의 함정도 짚고 갈게요. for와 ago를 함께 쓰거나 since 뒤에 기간을 쓰면 틀립니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 7\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>주어진 단어를 사용하여 시제에 맞게 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-psg\">A: I (1) \u003cspan class=\"p-blank\">\u003c/span> (ride) a bike with my father last weekend.\u003cbr>B: Oh, you had a great time. I (2) \u003cspan class=\"p-blank\">\u003c/span> (never, ride) a bike.\u003cbr>A: Really? Then, I will teach you.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) rode / (2) have never ridden\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"이번 문제는 주어진 동사를 문장의 시제에 맞게 바꾸는 문제예요. 각 문장에서 시간 표현과 경험을 나타내는 말을 먼저 찾아보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"첫 번째 빈칸은 last weekend가 있으므로 과거형 rode를 쓰고, 두 번째 빈칸은 never가 있는 경험이므로 have never ridden을 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 7\u003c/span>\u003cspan class=\"g-kind\">빈칸 완성\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>주어진 단어를 사용하여 시제에 맞게 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-psg sm\">A: I (1) \u003cspan class=\"p-blank\">\u003c/span> (ride) a bike with my father last weekend.\u003cbr>B: Oh, you had a great time. I (2) \u003cspan class=\"p-blank\">\u003c/span> (never, ride) a bike.\u003cbr>A: Really? Then, I will teach you.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">last weekend 확인\u003c/b>A 문장에는 \u003cb class=\"key\">last weekend\u003c/b>라는 과거의 특정 시점이 있으므로 ride를 과거형 \u003cb class=\"key\">rode\u003c/b>로 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">never 확인\u003c/b>B 문장은 ‘한 번도 ~한 적이 없다’는 \u003cb class=\"key\">경험\u003c/b>이므로 현재완료 \u003cb class=\"key\">have never ridden\u003c/b>을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>A: I \u003cb class=\"key\">rode\u003c/b> a bike with my father last weekend. / B: I \u003cb class=\"key\">have never ridden\u003c/b> a bike.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) rode / (2) have never ridden\u003c/span>\u003cdiv class=\"p-full\">A: I rode a bike with my father last weekend.\u003cbr>B: Oh, you had a great time. I have never ridden a bike.\u003cbr>A: Really? Then, I will teach you.\u003c/div>\u003cdiv class=\"p-ko\">A: 나는 지난주에 아버지와 함께 자전거를 탔어. B: 오, 좋은 시간을 보냈구나. 나는 한 번도 자전거를 타 본 적이 없어. A: 정말? 그럼 내가 알려 줄게.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>last weekend가 있는데 현재완료를 쓰거나, never 경험에 과거형을 쓰지 않도록 주의합니다.\u003c/div>","segs":[{"n":14,"text":"먼저 첫 번째 문장에서 last weekend를 찾아요. last weekend는 지난주라는 과거의 특정 시점이므로 ride를 과거형 rode로 바꿔야 해요.","hl":"st-0"},{"n":15,"text":"두 번째 문장에는 never가 있어요. 한 번도 자전거를 타 본 적이 없다는 경험을 말하므로 have never ridden 형태를 써야 해요.","hl":"st-1"},{"n":16,"text":"완성된 문장은 I rode a bike with my father last weekend와 I have never ridden a bike예요. 두 문장의 시간 표현과 시제가 잘 맞는지 마지막으로 확인해 주세요.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. last weekend가 있는데 현재완료를 쓰거나, never 경험에 과거형을 쓰지 않도록 주의합니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 중 어법상 알맞지 &lt;&lt;않은&gt;&gt; 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① A dragonfly has six legs.\u003c/div>\u003cdiv class=\"p-op\">② She has written a diary last night.\u003c/div>\u003cdiv class=\"p-op\">③ My friends are going to come here soon.\u003c/div>\u003cdiv class=\"p-op\">④ The teacher has ended the class already.\u003c/div>\u003cdiv class=\"p-op\">⑤ Ben is cleaning the window now.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"이번 문제는 어법상 알맞지 않은 문장을 고르는 문제예요. 각 문장에서 시간 표현과 동사의 형태가 잘 맞는지 살펴보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":7},{"n":20,"text":"정답은 두 번째 문장이에요. last night라는 과거 시점이 있으므로 has written이 아니라 wrote를 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 중 어법상 알맞지 &lt;&lt;않은&gt;&gt; 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① A dragonfly has six legs.\u003c/div>\u003cdiv class=\"p-op\">② She has written a diary last night.\u003c/div>\u003cdiv class=\"p-op\">③ My friends are going to come here soon.\u003c/div>\u003cdiv class=\"p-op\">④ The teacher has ended the class already.\u003c/div s=\"lp-tag\">문제 4 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 중 어법상 알맞지 &lt;&lt;않은&gt;&gt; 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① He is eating dinner now.\u003c/div>\u003cdiv class=\"p-op\">② I lost my umbrella yesterday.\u003c/div>\u003cdiv class=\"p-op\">③ I have been busy for two weeks.\u003c/div>\u003cdiv class=\"p-op\">④ He has just finished his work an hour ago.\u003c/div>\u003cdiv class=\"p-op\">⑤ They have traveled the world for 5 years.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"이번 문제도 어법상 알맞지 않은 문장을 고르는 문제예요. 각 문장의 시간 표현이 과거시제와 현재완료 중 어느 쪽을 요구하는지 확인해 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 네 번째 문장이에요. an hour ago라는 과거 시점이 있으므로 has just finished가 아니라 finished를 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 중 어법상 알맞지 &lt;&lt;않은&gt;&gt; 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① He is eating dinner now.\u003c/div>\u003cdiv class=\"p-op\">② I lost my umbrella yesterday.\u003c/div>\u003cdiv class=\"p-op\">③ I have been busy for two weeks.\u003c/div>\u003cdiv class=\"p-op\">④ He has just finished his work an hour ago.\u003c/div>\u003cdiv class=\"p-op\">⑤ They have traveled the world for 5 years.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>He is eating dinner now.는 now와 함께 쓰인 \u003cb class=\"key\">현재진행형\u003c/b>이라 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>I lost my umbrella yesterday.는 \u003cb class=\"key\">yesterday\u003c/b>가 있으므로 과거시제 lost가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>I have been busy for two weeks.는 \u003cb class=\"key\">for two weeks\u003c/b>가 있어 현재까지 이어지는 \u003cb class=\"key\">계속\u003c/b>의 현재완료로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>He has just finished his work an hour ago.에는 \u003cb class=\"key\">an hour ago\u003c/b>가 있으므로 과거시제 \u003cb class=\"key\">finished\u003c/b>를 써야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>They have traveled the world for 5 years.는 \u003cb class=\"key\">for 5 years\u003c/b>가 있어 \u003cb class=\"key\">계속\u003c/b>의 현재완료로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">He finished his work an hour ago.\u003c/div>\u003cdiv class=\"p-ko\">그는 한 시간 전에 일을 마쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>an hour ago가 있으면 현재완료 has finished를 쓰지 않습니다.\u003c/div>","segs":[{"n":30,"text":"첫 번째 문장은 지금 저녁을 먹고 있다는 현재진행형이므로 알맞아요.","hl":"st-0"},{"n":31,"text":"두 번째 문장에는 yesterday가 있어요. 어제는 과거의 특정 시점이므로 과거형 lost를 쓴 것이 알맞아요.","hl":"st-1"},{"n":32,"text":"세 번째 문장은 for two weeks가 있어서 현재까지 이어지는 계속의 현재완료로 볼 수 있어요.","hl":"st-2"},{"n":33,"text":"네 번째 문장에는 an hour ago가 있어요. 한 시간 전은 과거의 특정 시점이므로 현재완료 has just finished가 아니라 과거형 finished를 써야 해요.","hl":"st-3"},{"n":34,"text":"다섯 번째 문장은 for five years가 있어서 오 년 동안 계속된 일을 나타내는 현재완료로 알맞아요.","hl":"st-4"},{"n":35,"text":"이 문제의 함정도 짚고 갈게요. an hour ago가 있으면 현재완료 has finished를 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료의 네 가지 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재완료는 문맥에 따라 \u003cb class=\"key\">완료\u003c/b>, \u003cb class=\"key\">경험\u003c/b>, \u003cb class=\"key\">계속\u003c/b>, \u003cb class=\"key\">결과\u003c/b>를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">완료: just/already / 경험: ever/never/twice / 계속: for/since / 결과: 현재 상태와 연결\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>just, already는 완료의 느낌을 만듭니다.\u003c/li>\u003cli>ever, never, 횟수 표현은 경험을 나타냅니다.\u003c/li>\u003cli>for, since는 계속을 나타내고, 현재 결과가 보이면 결과의 쓰임입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The race has just started.\u003c/div>\u003cdiv class=\"g-ko\">경주가 이제 막 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He has worked as an engineer for three years.\u003c/div>\u003cdiv class=\"g-ko\">그는 삼 년 동안 기술자로 일해 왔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"현재완료는 하나의 뜻만 있는 것이 아니라 문맥에 따라 네 가지 느낌으로 나뉘어요. just나 already가 있으면 방금 끝난 완료의 느낌이 강하고, never나 횟수 표현이 있으면 경험을 말해요. for나 since가 있으면 지금까지 계속되는 상황을 나타내고, 과거의 일이 지금 상태에 영향을 주면 결과의 쓰임이에요. 문제에서는 시간 표현과 문장의 느낌을 함께 보면서 어떤 쓰임인지 판단해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 7\u003c/span>\u003cspan class=\"g-kind\">현재완료 쓰임 찾기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">21\u003c/span>다음 중 현재완료의 쓰임이 &lt;보기&gt;와 같은 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-psg\">[보기] The race has just started.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① My friend has gone to France.\u003c/div>\u003cdiv class=\"p-op\">② My dad has fixed his laptop twice.\u003c/div>\u003cdiv class=\"p-op\">③ Jim has used the smartphone since 2018.\u003c/div>\u003cdiv class=\"p-op\">④ She has already bought a concert ticket.\u003c/div>\u003cdiv class=\"p-op\">⑤ He has worked as an engineer for three years.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"이번 문제는 보기의 현재완료 쓰임과 같은 문장을 고르는 문제예요. 보기에서 just가 어떤 느낌을 만드는지 먼저 생각해 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":7},{"n":39,"text":"정답은 네 번째 문장이에요. already가 있어서 보기의 just와 마찬가지로 완료의 쓰임을 나타냅니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 7\u003c/span>\u003cspan class=\"g-kind\">현재완료 쓰임 찾기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">21\u003c/span>다음 중 현재완료의 쓰임이 &lt;보기&gt;와 같은 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-psg sm\">[보기] The race has just started.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① My friend has gone to France.\u003c/div>\u003cdiv class=\"p-op\">② My dad has fixed his laptop twice.\u003c/div>\u003cdiv class=\"p-op\">③ Jim has used the smartphone since 2018.\u003c/div>\u003cdiv class=\"p-op\">④ She has already bought a concert ticket.\u003c/div>\u003cdiv class=\"p-op\">⑤ He has worked as an engineer for three years.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">보기 분석\u003c/b>The race has just started.에서 \u003cb class=\"key\">just\u003c/b>는 ‘이제 막’이라는 \u003cb class=\"key\">완료\u003c/b>의 의미를 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">① 확인\u003c/b>My friend has gone to France.는 가 버린 결과가 현재와 연결되는 \u003cb class=\"key\">결과\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">② 확인\u003c/b>My dad has fixed his laptop twice.의 \u003cb class=\"key\">twice\u003c/b>는 횟수이므로 \u003cb class=\"key\">경험\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">③ 확인\u003c/b>Jim has used the smartphone since 2018.의 \u003cb class=\"key\">since 2018\u003c/b>은 계속입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">④ 확인\u003c/b>She has already bought a concert ticket.의 \u003cb class=\"key\">already\u003c/b>는 이미라는 \u003cb class=\"key\">완료\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">⑤ 확인\u003c/b>He has worked as an engineer for three years.의 \u003cb class=\"key\">for three years\u003c/b>는 \u003cb class=\"key\">계속\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">She has already bought a concert ticket.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 이미 콘서트 표를 샀다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>already와 just는 완료, ever·never·횟수는 경험, for·since는 계속으로 구분합니다.\u003c/div>","segs":[{"n":40,"text":"먼저 보기를 봐요. The race has just started에서 just는 이제 막이라는 완료의 느낌을 만들어요.","hl":"st-0"},{"n":41,"text":"첫 번째 문장의 has gone은 프랑스로 가 버린 결과가 지금과 이어지는 결과의 쓰임이에요.","hl":"st-1"},{"n":42,"text":"두 번째 문장의 twice는 두 번이라는 횟수이므로 경험을 나타내요.","hl":"st-2"},{"n":43,"text":"세 번째 문장은 since 뒤에 시작점이 있어서 계속의 쓰임이에요.","hl":"st-3"},{"n":44,"text":"네 번째 문장의 already는 이미라는 뜻으로 완료의 쓰임을 나타내요.","hl":"st-4"},{"n":45,"text":"다섯 번째 문장의 for three years는 삼 년 동안 이어지는 기간이라서 계속의 쓰임이에요.","hl":"st-5"},{"n":46,"text":"이 문제의 함정도 짚고 갈게요. already와 just는 완료, ever·never·횟수는 경험, for·since는 계속으로 구분합니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 7\u003c/span>\u003cspan class=\"g-kind\">현재완료 쓰임 찾기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">22\u003c/span>다음 중 현재완료의 쓰임이 &lt;보기&gt;와 같은 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-psg\">[보기] I have practiced the piano for two hours.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① We have gone fishing five times.\u003c/div>\u003cdiv class=\"p-op\">② They have just heard the news.\u003c/div>\u003cdiv class=\"p-op\">③ He has never worn sunglasses.\u003c/div>\u003cdiv class=\"p-op\">④ Ted has forgotten the appointment.\u003c/div>\u003cdiv class=\"p-op\">⑤ We have helped the poor since last year.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":47,"text":"이번 문제도 보기의 현재완료 쓰임과 같은 문장을 고르는 문제예요. 보기에서 for two hours가 어떤 쓰임을 나타내는지 먼저 찾아보세요.","hl":"q"},{"n":48,"text":"","hl":"q","pause":7},{"n":49,"text":"정답은 다섯 번째 문장이에요. since last year가 있어서 보기의 for two hours와 마찬가지로 계속의 쓰임을 나타냅니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 7\u003c/span>\u003cspan class=\"g-kind\">현재완료 쓰임 찾기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">22\u003c/span>다음 중 현재완료의 쓰임이 &lt;보기&gt;와 같은 문장을 고르세요.\u003c/div>\u003cdiv class=\"p-psg sm\">[보기] I have practiced the piano for two hours.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① We have gone fishing five times.\u003c/div>\u003cdiv class=\"p-op\">② They have just heard the news.\u003c/div>\u003cdiv class=\"p-op\">③ He has never worn sunglasses.\u003c/div>\u003cdiv class=\"p-op\">④ Ted has forgotten the appointment.\u003c/div>\u003cdiv class=\"p-op\">⑤ We have helped the poor since last year.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">보기 분석\u003c/b>I have practiced the piano for two hours.에서 \u003cb class=\"key\">for two hours\u003c/b>는 현재까지 이어지는 \u003cb class=\"key\">계속\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">① 확인\u003c/b>We have gone fishing five times.의 \u003cb class=\"key\">five times\u003c/b>는 횟수이므로 \u003cb class=\"key\">경험\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">② 확인\u003c/b>They have just heard the news.의 \u003cb class=\"key\">just\u003c/b>는 방금이라는 \u003cb class=\"key\">완료\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">③ 확인\u003c/b>He has never worn sunglasses.의 \u003cb class=\"key\">never\u003c/b>는 한 번도 ~한 적 없다는 \u003cb class=\"key\">경험\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">④ 확인\u003c/b>Ted has forgotten the appointment.는 약속을 잊어버린 결과가 현재와 연결되는 \u003cb class=\"key\">결과\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">⑤ 확인\u003c/b>We have helped the poor since last year.의 \u003cb class=\"key\">since last year\u003c/b>는 작년부터 이어지는 \u003cb class=\"key\">계속\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">We have helped the poor since last year.\u003c/div>\u003cdiv class=\"p-ko\">우리는 작년부터 가난한 사람들을 도왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>for와 since는 계속, just는 완료, never와 횟수는 경험으로 구분합니다.\u003c/div>","segs":[{"n":50,"text":"먼저 보기를 봐요. for two hours는 두 시간 동안 이어지는 기간이므로 계속의 쓰임이에요.","hl":"st-0"},{"n":51,"text":"첫 번째 문장의 five times는 다섯 번이라는 횟수이므로 경험을 나타내요.","hl":"st-1"},{"n":52,"text":"두 번째 문장의 just는 방금이라는 완료의 느낌을 만들어요.","hl":"st-2"},{"n":53,"text":"세 번째 문장의 never는 한 번도 해 본 적 없다는 경험을 나타내요.","hl":"st-3"},{"n":54,"text":"네 번째 문장은 약속을 잊어버린 결과가 지금까지 이어지는 결과의 쓰임이에요.","hl":"st-4"},{"n":55,"text":"다섯 번째 문장은 since last year가 있어서 작년부터 지금까지 이어지는 계속의 쓰임이에요.","hl":"st-5"},{"n":56,"text":"이 문제의 함정도 짚고 갈게요. for와 since는 계속, just는 완료, never와 횟수는 경험으로 구분합니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 7\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">23\u003c/span>다음 대화에서 어법상 알맞지 &lt;&lt;않은&gt;&gt; &lt;&lt;두 개&gt;&gt;를 찾아 그 기호를 쓰고 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-psg\">A: ⓐ \u003cu class=\"p-u\">Have you been\u003c/u> to that new cafe downtown?\u003cbr>B: Yes, it’s great! My friend, Yumi ⓑ \u003cu class=\"p-u\">have worked\u003c/u> at the cafe ⓒ \u003cu class=\"p-u\">since\u003c/u> last month.\u003cbr>A: Oh, really? How was the food?\u003cbr>B: I ⓓ \u003cu class=\"p-u\">eat\u003c/u> a piece of cake there yesterday, and it was really delicious.\u003cbr>A: ⓔ \u003cu class=\"p-u\">I’m going to taste it\u003c/u> soon!\u003cbr>B: Of course. I highly recommend it.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) ⓑ have worked → has worked\n(2) ⓓ eat → ate\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":57,"text":"이번 문제는 긴 대화에서 어법상 알맞지 않은 부분 두 개를 찾아 고치는 문제예요. 각 표시 앞뒤의 주어와 시간 표현을 꼼꼼히 보세요.","hl":"q"},{"n":58,"text":"","hl":"q","pause":7},{"n":59,"text":"정답은 두 군데예요. 유미가 삼인칭 단수라서 have worked를 has worked로 고치고, yesterday가 있으므로 eat을 ate로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 7\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">23\u003c/span>다음 대화에서 어법상 알맞지 &lt;&lt;않은&gt;&gt; &lt;&lt;두 개&gt;&gt;를 찾아 그 기호를 쓰고 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-psg sm\">A: ⓐ \u003cu class=\"p-u\">Have you been\u003c/u> to that new cafe downtown?\u003cbr>B: Yes, it’s great! My friend, Yumi ⓑ \u003cu class=\"p-u\">have worked\u003c/u> at the cafe ⓒ \u003cu class=\"p-u\">since\u003c/u> last month.\u003cbr>A: Oh, really? How was the food?\u003cbr>B: I ⓓ \u003cu class=\"p-u\">eat\u003c/u> a piece of cake there yesterday, and it was really delicious.\u003cbr>A: ⓔ \u003cu class=\"p-u\">I’m going to taste it\u003c/u> soon!\u003cbr>B: Of course. I highly recommend it.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>ⓐ Have you been to ...?는 ‘가 본 적이 있니’라는 \u003cb class=\"key\">경험\u003c/b>의 현재완료로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>주어 Yumi는 삼인칭 단수이므로 \u003cb class=\"key\">have worked\u003c/b>를 \u003cb class=\"key\">has worked\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>since last month는 ‘지난달부터’라는 \u003cb class=\"key\">시작점\u003c/b>이라 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>yesterday라는 과거 시점이 있으므로 \u003cb class=\"key\">eat\u003c/b>을 과거형 \u003cb class=\"key\">ate\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>I’m going to taste it soon!은 곧 맛볼 것이라는 \u003cb class=\"key\">미래\u003c/b> 표현이라 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ⓑ have worked → has worked\n(2) ⓓ eat → ate\u003c/span>\u003cdiv class=\"p-full\">A: Have you been to that new cafe downtown?\u003cbr>B: Yes, it’s great! My friend, Yumi has worked at the cafe since last month.\u003cbr>A: Oh, really? How was the food?\u003cbr>B: I ate a piece of cake there yesterday, and it was really delicious.\u003cbr>A: I’m going to taste it soon!\u003cbr>B: Of course. I highly recommend it.\u003c/div>\u003cdiv class=\"p-ko\">A: 너는 시내에 그 새로운 카페에 가 본 적 있니? B: 응, 아주 좋아! 내 친구 유미는 지난달부터 그 카페에서 일하고 있어. A: 오, 정말? 음식은 어땠어? B: 어제 그곳에서 케이크 한 조각을 먹었는데 정말 맛있었어. A: 곧 내가 맛볼 거야! B: 물론이지. 내가 매우 추천해.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어가 삼인칭 단수일 때 has를 쓰고, yesterday가 있으면 현재완료가 아니라 과거형을 씁니다.\u003c/div>","segs":[{"n":60,"text":"먼저 첫 번째 표시를 봐요. Have you been to that new cafe downtown은 그 카페에 가 본 적이 있냐는 경험을 묻는 현재완료라서 알맞아요.","hl":"st-0"},{"n":61,"text":"두 번째 표시에서는 주어 Yumi가 삼인칭 단수예요. 그래서 have worked를 has worked로 고쳐야 해요.","hl":"st-1"},{"n":62,"text":"세 번째 표시의 since last month는 지난달부터라는 시작점을 나타내므로 알맞아요.","hl":"st-2"},{"n":63,"text":"네 번째 표시에는 yesterday가 있어요. 어제는 과거의 특정 시점이므로 eat을 과거형 ate로 고쳐야 해요.","hl":"st-3"},{"n":64,"text":"다섯 번째 표시는 곧 맛볼 것이라는 미래 표현이라서 알맞아요.","hl":"st-4"},{"n":65,"text":"이 문제의 함정도 짚고 갈게요. 주어가 삼인칭 단수일 때 has를 쓰고, yesterday가 있으면 현재완료가 아니라 과거형을 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">현재완료와 과거시제 / 시제 구분\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>과거의 특정 시점(last night, yesterday, ago)이 있으면 \u003cb class=\"key\">과거시제\u003c/b>를 씁니다.\u003c/li>\u003cli>현재까지 이어지는 기간에는 \u003cb class=\"key\">have/has + p.p.\u003c/b>와 for를, 시작점에는 since를 씁니다.\u003c/li>\u003cli>현재완료의 쓰임은 \u003cb class=\"key\">완료, 경험, 계속, 결과\u003c/b>로 구분합니다.\u003c/li>\u003cli>주어가 삼인칭 단수이면 현재완료에서 \u003cb class=\"key\">has\u003c/b>를 씁니다.\u003c/li>\u003c/ul>","segs":[{"n":66,"text":"오늘은 시간 표현을 먼저 찾는 것이 가장 중요했다는 점을 기억해 주세요. last night이나 yesterday, ago가 있으면 과거시제, for나 since로 현재까지 이어지면 현재완료를 떠올리면 됩니다. 현재완료의 완료, 경험, 계속, 결과도 문맥 속에서 구분하는 연습을 계속해 봅시다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
