</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"point3","title":"현재진행형 완전 정복: 지금 하고 있는 일과 하면 안 되는 동사","audioDir":"point3_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter02 시제 – 현재진행형(be동사 + -ing)\u003c/div>\u003ch1>현재진행형 완전 정복: 지금 하고 있는 일과 하면 안 되는 동사\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>현재진행형의 형태와 쓰임을 익히고, 진행형으로 쓸 수 없는 동사를 구별할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 지금 이 순간 하고 있는 일을 영어로 어떻게 말하는지 배워 볼 거예요. 바로 be동사에 동사의 ing형을 붙이는 현재진행형이에요. 그런데 아무 동사나 ing형을 붙이면 안 된다는 사실, 알고 있었나요? 오늘 수업을 끝내면 여러분은 진행형을 써도 되는 동사와 쓰면 안 되는 동사를 정확히 구별할 수 있게 될 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">현재진행형의 형태: be동사 + 동사-ing\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재진행형은 \u003cb class=\"key\">be동사의 현재형\u003c/b>인 am, are, is 뒤에 \u003cb class=\"key\">동사의 -ing형\u003c/b>을 붙여 '~하고 있다, ~하는 중이다'라는 뜻을 나타냅니다. 지금 이 순간 하고 있는 동작을 말할 때 써요. 주어가 I면 am, we나 you나 they면 are, he나 she나 it이면 is를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + am/are/is + 동사-ing = ~하고 있다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I'm \u003cspan class=\"fx\">looking for\u003c/span> a bus stop.\u003c/div>\u003cdiv class=\"g-ko\">나는 버스 정류장을 찾고 있다.\u003c/div>\u003cdiv class=\"g-note\">am 뒤에 looking이 와서 지금 찾는 중이라는 뜻을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">is talking\u003c/span> on the phone.\u003c/div>\u003cdiv class=\"g-ko\">그는 전화로 이야기하고 있다.\u003c/div>\u003cdiv class=\"g-note\">주어가 He라서 be동사 is가 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">are doing\u003c/span> their homework.\u003c/div>\u003cdiv class=\"g-ko\">그들은 숙제를 하고 있다.\u003c/div>\u003cdiv class=\"g-note\">주어가 They라서 be동사 are가 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재진행형은 말하는 순간 하고 있는 \u003cb class=\"key\">동작\u003c/b>을 나타내요. be동사를 빠뜨리고 I looking이라고 쓰지 않도록 조심하세요.\u003c/div>","segs":[{"n":2,"text":"현재진행형은 지금 하고 있는 일을 말할 때 쓰는 표현이에요. be동사의 현재형, 그러니까 am, are, is 뒤에 동사의 ing형을 붙여 주면 된답니다. 주어가 I면 am, we나 you나 they면 are, he나 she나 it이면 is를 쓴다는 것도 꼭 기억해 두세요. 예를 들어 I am looking for a bus stop이라고 하면 나는 버스 정류장을 찾고 있다는 뜻이 돼요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. I'm looking for a bus stop. 나는 버스 정류장을 찾고 있다는 뜻이에요. am 뒤에 looking이 와서 지금 이 순간 찾고 있다는 걸 보여 주죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 He is talking on the phone이에요. 그는 전화로 이야기하고 있다는 뜻이죠. 주어가 he니까 be동사로 is를 쓰고 talking을 붙였어요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문은 They are doing their homework예요. 그들은 숙제를 하고 있다는 뜻이에요. 주어가 they라서 are를 썼다는 점을 꼭 봐 두세요.","hl":"ex-2"},{"n":6,"text":"한 가지 조심할 점이 있어요. 현재진행형은 지금 이 순간 하고 있는 일에 쓰는 표현이에요. be동사를 빠뜨리고 I looking처럼 쓰면 틀린 문장이 되니까 be동사를 꼭 챙겨 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">진행형으로 쓸 수 없는 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">진행형은 어떤 동작을 하고 있음을 나타내므로, 동작이 아니라 상태를 나타내는 동사는 진행형으로 쓰지 않아요. \u003cb class=\"key\">감정\u003c/b>을 나타내는 like, love, hate, \u003cb class=\"key\">감각\u003c/b>을 나타내는 see, feel, \u003cb class=\"key\">인식\u003c/b>을 나타내는 know, think, 소유를 나타내는 have, belong to, 그리고 상태를 나타내는 be, want가 대표적입니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">like\u003c/span> you.\u003c/div>\u003cdiv class=\"g-ko\">나는 너를 좋아해.\u003c/div>\u003cdiv class=\"g-note\">좋아하는 마음은 변하지 않는 상태라서 현재형으로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">know\u003c/span> the answer.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 답을 알아.\u003c/div>\u003cdiv class=\"g-note\">know는 인식을 나타내는 동사라서 진행형으로 쓰지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This book \u003cspan class=\"fx\">belongs to\u003c/span> my sister.\u003c/div>\u003cdiv class=\"g-ko\">이 책은 내 여동생의 것이다.\u003c/div>\u003cdiv class=\"g-note\">belong to는 '~에 속하다'라는 상태를 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">like\u003c/b>, \u003cb class=\"key\">know\u003c/b>처럼 마음과 상태를 나타내는 동사는 현재형으로 써요. am liking, is knowing 같은 표현은 틀린 문장이에요.\u003c/div>","segs":[{"n":7,"text":"이번에는 진행형으로 쓰면 안 되는 동사를 볼게요. 진행형은 어떤 동작을 하고 있다는 걸 보여 주는 표현이에요. 그래서 동작이 아니라 마음이나 상태를 나타내는 동사는 진행형으로 쓰지 않아요. 감정을 나타내는 like, love, hate, 감각을 나타내는 see, feel, 인식을 나타내는 know, think, 소유를 나타내는 have나 belong to, 상태를 나타내는 be나 want가 여기에 속해요. 이런 동사는 그냥 현재형으로 써 주면 된답니다.","hl":"rule"},{"n":8,"text":"첫 번째 예문은 I like you예요. 나는 너를 좋아한다는 뜻이죠. 좋아하는 마음은 지금 하고 있는 동작이 아니라 상태라서 like를 현재형 그대로 써요.","hl":"ex-0"},{"n":9,"text":"두 번째 예문은 I know the answer예요. 나는 그 답을 안다는 뜻이에요. know는 아는 상태를 나타내니까 knowing이라고 쓰지 않고 현재형으로 써요.","hl":"ex-1"},{"n":10,"text":"세 번째 예문은 This book belongs to my sister예요. 이 책은 내 여동생의 것이라는 뜻이죠. belong to는 어디에 속해 있는 상태를 나타내서 진행형으로 쓰지 않아요.","hl":"ex-2"},{"n":11,"text":"시험에서는 I am liking you나 She is knowing the answer처럼 상태 동사를 진행형으로 쓴 틀린 문장이 자주 나와요. 이런 표현이 보이면 바로 현재형으로 고쳐야 한다는 걸 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">동작의 의미로 쓰이면 진행형이 가능해요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">같은 동사라도 \u003cb class=\"key\">동작\u003c/b>의 의미로 쓰여 일시적인 행동을 나타내면 진행형으로 쓸 수 있어요. have가 '식사하다'의 뜻이면 having a meal, think가 '고민하다'의 뜻이면 thinking of a solution처럼 씁니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I'm \u003cspan class=\"fx\">having\u003c/span> a meal.\u003c/div>\u003cdiv class=\"g-ko\">나는 식사를 하고 있다.\u003c/div>\u003cdiv class=\"g-note\">have가 '식사하다'라는 동작의 의미로 쓰여 진행형이 되었어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He is \u003cspan class=\"fx\">thinking\u003c/span> of a solution.\u003c/div>\u003cdiv class=\"g-ko\">그는 해결책을 생각하고 있다.\u003c/div>\u003cdiv class=\"g-note\">think가 '생각하다'라는 동작을 나타내서 진행형으로 썼어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">have\u003c/b>는 '가지고 있다'면 진행형을 쓰지 않고, '식사하다'면 진행형을 써요. \u003cb class=\"key\">뜻\u003c/b>을 먼저 확인하세요.\u003c/div>","segs":[{"n":12,"text":"그런데 같은 동사라도 뜻이 달라지면 진행형을 쓸 수 있어요. have가 가지고 있다는 뜻이 아니라 식사를 하다라는 뜻으로 쓰이면 지금 밥을 먹고 있는 동작이 되니까 진행형이 되는 거예요. think도 머릿속으로 고민하는 동작을 나타내면 진행형으로 쓸 수 있어요. 이렇게 일시적으로 어떤 동작을 하고 있을 때는 진행형이 가능하다는 점이 중요해요.","hl":"rule"},{"n":13,"text":"첫 번째 예문은 I'm having a meal이에요. 나는 식사를 하고 있다는 뜻이죠. have가 식사를 하다라는 동작의 뜻으로 쓰여서 having으로 바뀐 거예요.","hl":"ex-0"},{"n":14,"text":"두 번째 예문은 He is thinking of a solution이에요. 그는 해결책을 생각하고 있다는 뜻이에요. 이때 think는 머릿속으로 고민하는 동작이라서 thinking으로 쓸 수 있답니다.","hl":"ex-1"},{"n":15,"text":"그러니까 have가 나오면 무조건 진행형이 안 된다고 외우면 안 돼요. 가지고 있다는 뜻인지 식사하다는 뜻인지 먼저 확인하는 습관을 가져 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">현재진행형으로 나타내는 가까운 미래\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가까운 미래에 \u003cb class=\"key\">예정\u003c/b>된 일이나 \u003cb class=\"key\">계획\u003c/b>은 현재진행형으로 나타낼 수 있어요. 이미 정해 둔 일을 말할 때 자주 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + am/are/is + 동사-ing + 미래 시점(tomorrow, tonight 등)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We're \u003cspan class=\"fx\">watching\u003c/span> a movie tonight.\u003c/div>\u003cdiv class=\"g-ko\">우리는 오늘 밤에 영화 볼 거야.\u003c/div>\u003cdiv class=\"g-note\">tonight가 있어서 지금이 아니라 오늘 밤에 할 계획을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">tonight\u003c/b>, \u003cb class=\"key\">tomorrow\u003c/b>처럼 미래를 가리키는 말이 함께 있으면 가까운 미래의 계획을 나타내요.\u003c/div>","segs":[{"n":16,"text":"마지막으로 재미있는 쓰임을 하나 더 볼게요. 가까운 미래에 이미 예정되어 있는 일이나 계획은 현재진행형으로 나타낼 수 있어요. tonight이나 tomorrow처럼 미래를 가리키는 말이 함께 나오면, 지금 하는 일이 아니라 앞으로 할 일을 말하는 거예요.","hl":"rule"},{"n":17,"text":"예문을 보세요. We're watching a movie tonight. 우리는 오늘 밤에 영화 볼 거야라는 뜻이에요. tonight이 붙어 있어서 지금 영화를 보는 게 아니라 오늘 밤에 볼 계획을 말하는 거죠.","hl":"ex-0"},{"n":18,"text":"이때는 tonight이나 tomorrow처럼 미래를 가리키는 말이 함께 있어야 자연스러워요. 그 말이 문장에 있는지 꼭 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I am liking you.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I like you.\u003c/div>\u003cdiv class=\"g-why\">like는 감정을 나타내는 상태 동사라서 진행형으로 쓰지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She is knowing the answer.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She knows the answer.\u003c/div>\u003cdiv class=\"g-why\">know는 인식을 나타내는 동사라서 진행형으로 쓸 수 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I am having a dog.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I have a dog.\u003c/div>\u003cdiv class=\"g-why\">have가 '가지고 있다'라는 소유의 의미일 때는 진행형으로 쓰지 않아요.\u003c/div>\u003c/div>","segs":[{"n":19,"text":"I am liking you라고 쓰면 틀린 문장이에요. like는 좋아하는 마음을 나타내는 상태 동사라서 진행형으로 쓰지 않아요. 그래서 I like you라고 현재형으로 써야 합니다.","hl":"mk-0"},{"n":20,"text":"She is knowing the answer도 자주 나오는 틀린 문장이에요. know는 아는 상태를 나타내는 인식 동사라서 진행형으로 쓸 수 없어요. 주어가 she니까 현재형에 s를 붙여 She knows the answer라고 해야 해요.","hl":"mk-1"},{"n":21,"text":"I am having a dog라고 하면 어색한 문장이 돼요. 여기서 have는 개를 가지고 있다는 소유의 뜻이라서 진행형으로 쓰지 않아요. 그래서 I have a dog라고 해야 하고, 식사를 하고 있다는 뜻일 때만 having을 쓸 수 있어요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">보기와 같이 주어진 현재시제 문장을 현재진행형으로 바꿔 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">We take pictures at the park. → We ____ pictures at the park.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">are taking\u003c/span>\u003cdiv class=\"g-exp\">주어 We에는 be동사 are를 쓰고, take를 taking으로 바꿔요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"첫 번째 문제예요. We take pictures at the park라는 문장을 현재진행형으로 바꾸는 문제입니다. 빈칸에 들어갈 말을 직접 써 보세요. 잠시 멈추고 풀어 볼까요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 are taking이에요. 주어가 we니까 be동사는 are를 쓰고, take에는 ing를 붙여 taking으로 바꿔 주면 돼요. 그래서 We are taking pictures at the park가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 현재시제 문장을 현재진행형으로 바꿔 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I plan a trip to Jeju-do. → I ____ a trip to Jeju-do.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">am planning\u003c/span>\u003cdiv class=\"g-exp\">주어 I에는 be동사 am을 쓰고, plan은 자음을 하나 더 붙여 planning으로 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"두 번째 문제예요. I plan a trip to Jeju-do를 현재진행형으로 바꾸는 문제입니다. 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 am planning이에요. 주어가 I니까 be동사는 am을 쓰고, plan은 자음 p로 끝나서 자음을 하나 더 붙여 planning으로 써요. 그래서 I am planning a trip to Jeju-do가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 현재진행형 문장으로 알맞은 것은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I am knowing the answer.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>She is liking music.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>He is talking on the phone.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>They are wanting a new bike.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He is talking on the phone.\u003c/span>\u003cdiv class=\"g-exp\">know, like, want는 상태를 나타내는 동사라서 진행형으로 쓰지 않아요. talking은 동작을 나타내므로 진행형이 가능해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"세 번째 문제는 객관식이에요. 다음 중에서 현재진행형 문장으로 알맞은 것을 골라 보세요. 첫 번째 보기부터 차례대로 읽어 볼게요. 잠시 멈추고 정답을 골라 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 세 번째 보기예요. He is talking on the phone은 동작을 나타내서 진행형이 자연스러워요. 반면에 know, like, want는 상태를 나타내는 동사라서 진행형으로 쓸 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 알맞은 것은?\u003c/div>\u003cdiv class=\"g-qs\">My brother ____ his homework now.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>does\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>is doing\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>is do\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>doing\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is doing\u003c/span>\u003cdiv class=\"g-exp\">now가 있어서 지금 하고 있는 일을 나타내는 현재진행형이 필요해요. 주어가 My brother라서 is를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"네 번째 문제예요. My brother 빈칸 his homework now라는 문장에서 빈칸에 들어갈 말을 골라 보세요. now라는 말에 주목하면서 직접 풀어 보세요. 잠시 멈춰 볼까요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 두 번째 보기인 is doing이에요. now가 있으니까 지금 하고 있는 일을 나타내는 현재진행형이 필요해요. 주어가 my brother라서 be동사는 is를 쓰고 do는 doing으로 바꿔 줍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I am having a dog.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I have a dog.\u003c/span>\u003cdiv class=\"g-exp\">여기서 have는 '가지고 있다'라는 소유의 의미라서 진행형으로 쓰지 않아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다섯 번째 문제는 틀린 부분을 고치는 문제예요. I am having a dog라는 문장에서 어색한 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 고쳐 볼까요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 I have a dog예요. 여기서 have는 개를 가지고 있다는 소유의 뜻이라서 진행형으로 쓰지 않아요. 식사를 하고 있다는 뜻일 때만 having을 쓸 수 있다는 것도 함께 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">We / a movie / are / tonight / watching\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">We are watching a movie tonight.\u003c/span>\u003cdiv class=\"g-exp\">가까운 미래의 계획은 현재진행형으로 나타낼 수 있어요. tonight이 미래 시점을 알려 줍니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"마지막 문제는 단어를 배열하는 문제예요. we, a movie, are, tonight, watching을 모두 사용해서 문장을 만들어 보세요. 잠시 멈추고 직접 배열해 볼까요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 We are watching a movie tonight이에요. 주어 we 뒤에 are를 두고 watching을 붙인 다음 a movie와 tonight을 차례로 놓으면 돼요. 오늘 밤에 영화를 볼 계획을 말하는 문장이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter02 시제 – 현재진행형(be동사 + -ing)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>현재진행형은 \u003cb class=\"key\">be동사의 현재형\u003c/b>과 \u003cb class=\"key\">동사의 -ing형\u003c/b>을 합쳐 '~하고 있다'는 뜻을 나타내요.\u003c/li>\u003cli>\u003cb class=\"key\">감정\u003c/b>이나 \u003cb class=\"key\">상태\u003c/b>를 나타내는 동사는 진행형으로 쓰지 않아요.\u003c/li>\u003cli>have, think도 \u003cb class=\"key\">동작\u003c/b>의 의미로 쓰이면 진행형이 가능해요.\u003c/li>\u003cli>가까운 미래의 \u003cb class=\"key\">계획\u003c/b>은 현재진행형으로 나타낼 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘 우리는 현재진행형을 배웠어요. be동사의 현재형 뒤에 동사의 ing형을 붙이면 지금 하고 있는 일을 말할 수 있었죠. 그리고 like나 know처럼 마음과 상태를 나타내는 동사는 진행형으로 쓰지 않는다는 것도 꼭 기억해 주세요. have나 think처럼 뜻에 따라 진행형이 되기도 한다는 점, 가까운 미래의 계획도 현재진행형으로 말할 수 있다는 점까지 정리해 봤어요. 오늘 배운 내용 복습 잘 해 두고요, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script></body></html>
