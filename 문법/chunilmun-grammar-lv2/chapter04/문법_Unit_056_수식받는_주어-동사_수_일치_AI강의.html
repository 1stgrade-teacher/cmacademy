  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

lecturePlayer(document.getElementById("app"),{"brand":"Unit 56 수식받는 주어-동사 수 일치","title":"주어가 길어져도 동사는 핵심 명사와 손을 잡는다","audioDir":"문법_Unit_056_수식받는_주어-동사_수_일치_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 056 수식받는 주어-동사 수 일치\u003c/div>\u003ch1>주어가 길어져도 동사는 핵심 명사와 손을 잡는다\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>수식어구가 붙은 주어에서 동사의 수를 핵심 명사에 정확히 일치시킬 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 주어가 길어졌을 때 동사의 수를 어떻게 맞춰야 하는지 배워 볼 거예요. 시험에서 정말 자주 나오는 부분이고, 한 번 감을 잡으면 틀리기 어려운 유형이죠. 오늘은 전치사구나 분사구, 관계절이 붙은 주어에서 동사를 어디에 맞추는지, 그리고 a number of와 the number of의 차이까지 확실하게 정리해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">수식어구가 붙은 주어는 핵심 명사에 동사를 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어에 전치사구, 분사구, 관계절 같은 \u003cb class=\"key\">수식어구\u003c/b>가 붙어 있으면, 동사는 그 수식어구가 아니라 주어의 \u003cb class=\"key\">핵심 명사\u003c/b>에 수를 일치시킨다. 수식어구는 주어를 꾸며 주는 덧붙은 정보일 뿐이므로 \u003cb class=\"key\">동사의 수\u003c/b>를 결정하지 못한다.\u003cdiv>\u003cspan class=\"g-formula\">핵심 명사 + (수식어구) + 동사 → 동사는 핵심 명사의 수에 일치\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The books on the shelf are\u003c/span> mine.\u003c/div>\u003cdiv class=\"g-ko\">선반 위의 책들은 내 것이다.\u003c/div>\u003cdiv class=\"g-note\">on the shelf는 books를 꾸미는 전치사구이므로 동사는 복수 books에 맞춘 are가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The girl with two dogs is\u003c/span> my sister.\u003c/div>\u003cdiv class=\"g-ko\">두 마리의 개와 함께 있는 그 소녀는 나의 여동생이다.\u003c/div>\u003cdiv class=\"g-note\">with two dogs 안의 복수 dogs에 끌리지 않고 핵심 명사 The girl에 맞춰 is를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어가 길게 느껴질수록 꾸며 주는 말을 괄호로 묶어 지우고 \u003cb class=\"key\">핵심 명사\u003c/b>만 남겨 보세요.\u003c/div>","segs":[{"n":2,"text":"주어에 전치사구나 분사구, 관계절이 붙어서 길어지는 경우가 정말 많죠. 이때 동사를 어디에 맞추느냐가 핵심인데요, 답은 아주 단순해요. 수식어구는 그냥 꾸며 주는 덧붙은 말이고, 실제로 동사를 지배하는 것은 주어의 핵심 명사예요. 그래서 주어가 길어 보여도 꾸미는 말을 걷어 내고 핵심 명사만 찾으면 동사의 수가 바로 보여요. 이 감각만 잡으면 어떤 긴 문장이 나와도 흔들리지 않아요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 The books on the shelf are mine, 즉 선반 위의 책들은 내 것이다라는 뜻이에요. 여기서 주어는 books이고 on the shelf는 books를 꾸며 주는 전치사구예요. 그러니까 동사는 shelf가 아니라 복수 명사인 books에 맞춰서 are가 되는 거죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 The girl with two dogs is my sister, 즉 두 마리의 개와 함께 있는 그 소녀는 나의 여동생이다라는 뜻이에요. with two dogs 때문에 dogs가 눈에 들어오지만 주어의 핵심은 The girl 하나예요. 그래서 동사는 is가 되죠. 이렇게 수식어구 안의 명사에 흔들리지 않는 게 중요해요.","hl":"ex-1"},{"n":5,"text":"아무리 주어가 길어 보여도 꾸며 주는 말은 과감하게 지워 버리세요. 그러면 핵심 명사 하나만 남고, 동사의 수는 그 하나로 결정돼요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">수식어구 안의 명사에 끌려가지 않기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사구 안에 있는 명사는 주어가 아니므로 \u003cb class=\"key\">동사의 수\u003c/b>에 영향을 주지 않는다. of 뒤에 복수 명사가 와도 앞의 핵심 명사가 단수이면 동사는 \u003cb class=\"key\">단수\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">단수 핵심 명사 + of + 복수 명사 + 단수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A list of names was\u003c/span> posted.\u003c/div>\u003cdiv class=\"g-ko\">이름 목록이 게시되었다.\u003c/div>\u003cdiv class=\"g-note\">of names의 복수 names에 끌리지 않고 단수 주어 A list에 맞춰 was를 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The box of apples is\u003c/span> heavy.\u003c/div>\u003cdiv class=\"g-ko\">그 사과 상자는 무겁다.\u003c/div>\u003cdiv class=\"g-note\">전치사구 안의 복수 apples가 아니라 핵심 명사 The box에 동사 is를 일치시킨다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>of 앞은 주어, of 뒤는 꾸며 주는 말이라고 \u003cb class=\"key\">구분\u003c/b>해서 보면 실수가 확 줄어요.\u003c/div>","segs":[{"n":6,"text":"이번에는 학생들이 가장 많이 넘어지는 부분이에요. of 뒤에 복수 명사가 보이면 왠지 동사를 복수로 쓰고 싶어지죠. 하지만 of 뒤의 명사는 전치사구 안에 있는 명사일 뿐이라서 주어가 아니에요. 주어는 항상 of 앞에 있는 핵심 명사예요. 그러니까 핵심 명사가 단수면 동사도 단수, 이 원칙 하나만 기억하세요.","hl":"rule"},{"n":7,"text":"예문은 A list of names was posted, 즉 이름 목록이 게시되었다라는 뜻이에요. names가 복수라서 were를 쓰고 싶은 유혹이 강하지만, 주어는 of 앞의 A list예요. 그래서 동사는 단수인 was가 되는 거죠.","hl":"ex-0"},{"n":8,"text":"다음 예문은 The box of apples is heavy, 즉 그 사과 상자는 무겁다라는 뜻이에요. apples가 복수라서 헷갈리지만 of 앞의 핵심 명사는 The box 하나죠. 그래서 동사는 is예요. 방금 배운 원칙이 그대로 적용되는 문장이에요.","hl":"ex-1"},{"n":9,"text":"머릿속으로 of 앞은 주어, of 뒤는 그냥 설명이라고 표시해 두세요. 이 구분 하나만 해도 실수가 확 줄어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">a number of는 복수, the number of는 단수\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">a number of\u003c/b> + 복수 명사는 '많은 ~'이라는 뜻으로 \u003cb class=\"key\">복수\u003c/b> 취급한다. \u003cb class=\"key\">the number of\u003c/b> + 복수 명사는 '~의 수'라는 뜻으로 \u003cb class=\"key\">단수\u003c/b> 취급한다.\u003cdiv>\u003cspan class=\"g-formula\">a number of + 복수 명사 + 복수 동사 / the number of + 복수 명사 + 단수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The number of students is\u003c/span> increasing.\u003c/div>\u003cdiv class=\"g-ko\">학생 수가 늘고 있다.\u003c/div>\u003cdiv class=\"g-note\">'학생 수'라는 하나의 수치를 뜻하므로 단수 동사 is를 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A number of students are\u003c/span> absent today.\u003c/div>\u003cdiv class=\"g-ko\">많은 학생들이 오늘 결석했다.\u003c/div>\u003cdiv class=\"g-note\">'많은 학생들'이라는 복수 의미이므로 복수 동사 are를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관사 \u003cb class=\"key\">a\u003c/b>가 붙으면 복수, \u003cb class=\"key\">the\u00
