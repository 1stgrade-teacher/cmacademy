lecturePlayer(document.getElementById("app"),{"brand":"Unit 41 동명사의 역할 2: 동사의 목적어","title":"동명사만 부르는 동사들, 목적어 완전 정복","audioDir":"문법_Unit_041_동명사의_역할_2_동사의_목적어_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 041 동명사의 역할 2: 동사의 목적어\u003c/div>\u003ch1>동명사만 부르는 동사들, 목적어 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동명사만 목적어로 취하는 동사를 익히고, 동명사의 의미상 주어 표현까지 정확히 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 동명사의 역할 두 번째 시간으로, 동사 뒤에 목적어로 오는 동명사를 배워 볼 거예요. 특히 enjoy나 avoid처럼 동명사만 목적어로 데려오는 동사들을 집중적으로 익혀 볼게요. 그리고 동명사 앞에 의미상 주어를 어떻게 쓰는지도 함께 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">동명사만 목적어로 취하는 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">enjoy\u003c/b>나 \u003cb class=\"key\">avoid\u003c/b>처럼 동명사만 목적어로 취하는 동사 뒤에는 to부정사가 아니라 동명사가 와요. finish, mind, give up, admit, deny, consider, suggest, postpone, practice, quit도 같은 \u003cb class=\"key\">동명사만 목적어로 취하는 동사\u003c/b>예요. 동명사는 동사원형에 ing를 붙인 형태로, 동사 뒤 목적어 자리에 놓여요.\u003cdiv>\u003cspan class=\"g-formula\">enjoy / avoid / finish + 동명사(~ing)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">enjoys cooking\u003c/span> for friends.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 친구들을 위해 요리하는 것을 즐긴다.\u003c/div>\u003cdiv class=\"g-note\">enjoy 뒤에 동명사 cooking이 목적어로 왔어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">avoided answering\u003c/span> the question.\u003c/div>\u003cdiv class=\"g-ko\">그는 그 질문에 대답하는 것을 피했다.\u003c/div>\u003cdiv class=\"g-note\">avoid 뒤에는 동명사 answering이 와서 대답하는 것을 피했다는 의미를 만들어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>이 동사들은 목적어 자리에 \u003cb class=\"key\">to부정사\u003c/b>가 오면 틀리는 경우가 많으니 특히 조심하세요.\u003c/div>","segs":[{"n":2,"text":"자, 먼저 동명사만 목적어로 취하는 동사를 알아볼게요. enjoy는 즐기다는 뜻인데, enjoy 뒤에는 꼭 동명사가 와요. avoid도 피하다는 뜻으로 avoid 뒤에는 동명사가 와야 하죠. finish, mind, give up, admit, deny, consider, suggest, postpone, practice, quit도 모두 같은 동명사 친구들이에요. 그래서 이 동사들 뒤에서는 to부정사가 아니라 동사원형에 ing를 붙인 동명사를 목적어로 쓴다고 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 She enjoys cooking for friends. 그녀는 친구들을 위해 요리하는 것을 즐긴다는 뜻이에요. 여기서 enjoy 뒤에 cooking이라는 동명사가 목적어로 왔다는 점을 꼭 봐 주세요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 He avoided answering the question. 그는 그 질문에 대답하는 것을 피했다는 뜻이에요. avoided 뒤에 answering이라는 동명사가 와서 질문에 대답하는 행동을 피했다는 것을 보여 주죠.","hl":"ex-1"},{"n":5,"text":"이 동사들은 목적어 자리에 to부정사가 오면 틀리는 경우가 많아요. 그래서 동사 뒤 목적어 자리를 볼 때 to부정사가 아니라 동명사인지 꼭 확인해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">동명사를 쓰는 동사의 느낌\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">현실적이고 지속적·부정적인 동작\u003c/b>의 동사는 동명사를 쓴다고 기억해요. 이미 해 본 일이나 계속 이어지는 일, 피하거나 그만두는 부정적인 일은 동명사와 잘 어울려요. 그래서 \u003cb class=\"key\">enjoy\u003c/b>나 \u003cb class=\"key\">avoid\u003c/b>처럼 실제 행동과 이어지거나 피하는 느낌의 동사가 대표적이에요.\u003cdiv>\u003cspan class=\"g-formula\">현실적·지속적·부정적 동작 → 동명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">gave up smoking\u003c/span> last year.\u003c/div>\u003cdiv class=\"g-ko\">그는 작년에 담배 피우는 것을 그만두었다.\u003c/div>\u003cdiv class=\"g-note\">give up은 그만두다는 부정적 동작의 동사로, 동명사 smoking을 목적어로 취해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">부정적인 동작\u003c/b>의 동사는 동명사와 친하다고 기억하면 문제를 빠르게 풀 수 있어요.\u003c/div>","segs":[{"n":6,"text":"이번에는 어떤 동사가 동명사를 데려오는지 느낌으로 기억해 볼게요. 현실적이고 지속적인 동작, 그리고 피하거나 그만두는 부정적인 동작을 나타내는 동사는 동명사와 잘 어울려요. 이미 해 본 일이나 계속 이어지는 일을 말할 때는 동명사가 자연스럽다는 뜻이죠. 그래서 enjoy나 finish, practice처럼 실제 행동과 이어지는 동사, avoid나 give up, quit처럼 피하거나 중단하는 동사가 동명사를 목적어로 취해요. 이 느낌을 함께 기억하면 동명사 동사를 훨씬 쉽게 떠올릴 수 있어요.","hl":"rule"},{"n":7,"text":"세 번째 예문은 He gave up smoking last year. 그는 작년에 담배 피우는 것을 그만두었다는 뜻이에요. give up은 그만두는 부정적인 동작을 나타내서 smoking이라는 동명사를 목적어로 자연스럽게 데려온답니다.","hl":"ex-0"},{"n":8,"text":"모든 동사를 하나씩 외우기 어렵다면 피하거나 그만두는 부정적인 동작의 동사가 동명사와 친하다는 느낌을 떠올려 보세요. 그러면 avoid나 give up 같은 동사를 더 쉽게 찾을 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">동명사의 의미상 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동명사 앞에 누가 하는 동작인지를 밝히는 \u003cb class=\"key\">의미상 주어\u003c/b>를 쓸 수 있어요. 의미상 주어는 \u003cb class=\"key\">소유격\u003c/b> 또는 \u003cb class=\"key\">목적격\u003c/b>으로 나타내요. 그래서 네가 창문을 여는 것은 your opening the window 또는 you opening the window처럼 표현할 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">소유격/목적격 + 동명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I don't mind \u003cspan class=\"fx\">your opening\u003c/span> the window.\u003c/div>\u003cdiv class=\"g-ko\">네가 창문을 여는 것은 상관없다.\u003c/div>\u003cdiv class=\"g-note\">mind 뒤에 동명사 opening이 오고, 의미상 주어 your가 소유격으로 쓰였어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>의미상 주어가 \u003cb class=\"key\">목적격\u003c/b>으로 쓰인 표현도 문법적으로 가능하지만, 소유격 형태가 시험에 자주 나와요.\u003c/div>","segs":[{"n":9,"text":"이제 동명사 앞에 누가 그 행동을 하는지 밝히는 방법을 배워 볼게요. 동명사의 의미상 주어는 소유격이나 목적격으로 나타낼 수 있어요. 예를 들어 네가 창문을 여는 것이라고 할 때는 your opening the window처럼 소유격을 쓰거나 you opening the window처럼 목적격을 쓸 수 있죠. 시험에서는 소유격 형태가 자주 나오니 두 표현을 눈에 익혀 두면 좋아요.","hl":"rule"},{"n":10,"text":"마지막 예문은 I don't mind your opening the window. 네가 창문을 여는 것은 상관없다는 뜻이에요. mind 뒤에 opening이라는 동명사가 오고, 그 앞에 your가 와서 네가 여는 동작이라는 것을 분명히 보여 주죠. 의미상 주어는 소유격으로도 목적격으로도 나타낼 수 있다는 점을 기억해 주세요.","hl":"ex-0"},{"n":11,"text":"의미상 주어는 목적격으로도 표현할 수 있지만, 소유격 형태가 시험에 자주 등장해요. your opening the window처럼 소유격과 동명사가 이어지는 모양을 특히 익혀 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u 3cb class=\"key\">finish\u003c/b> 등이 있어요.\u003c/li>\u003cli>현실적이고 \u003cb class=\"key\">지속적\u003c/b>이며 \u003cb class=\"key\">부정적\u003c/b>인 동작의 동사는 동명사와 잘 어울려요.\u003c/li>\u003cli>동명사의 \u003cb class=\"key\">의미상 주어\u003c/b>는 \u003cb class=\"key\">소유격\u003c/b> 또는 \u003cb class=\"key\">목적격\u003c/b>으로 나타내요.\u003c/li>\u003c/ul>","segs":[{"n":33,"text":"오늘은 동명사의 역할 두 번째 시간으로 동사 뒤 목적어 자리에 오는 동명사를 배웠어요. enjoy, avoid, finish처럼 동명사만 목적어로 취하는 동사들은 반드시 동명사를 데려온다는 점을 기억해 주세요. 현실적이고 지속적이거나 부정적인 동작의 동사가 동명사와 잘 어울린다는 느낌과, 의미상 주어는 소유격이나 목적격으로 나타낸다는 점도 함께 기억해요. 오늘 수업도 수고했고 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
