}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 37 부정사의 부사적 역할 1: 목적, 감정의 원인, 판단의 근거","title":"to 부정사의 세 얼굴: 목적, 감정의 원인, 판단의 근거","audioDir":"문법_Unit_037_부정사의_부사적_역할_1_목적,_감정의_원인,_판단의_근거_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 037 부정사의 부사적 역할 1: 목적, 감정의 원인, 판단의 근거\u003c/div>\u003ch1>to 부정사의 세 얼굴: 목적, 감정의 원인, 판단의 근거\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>to 부정사가 부사처럼 쓰여 목적, 감정의 원인, 판단의 근거를 나타내는 세 가지 쓰임을 구별하고 바르게 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 to 부정사가 문장에서 부사처럼 쓰이는 세 가지 경우를 배워 볼 거예요. to 부정사는 명사처럼도, 형용사처럼도 쓰이지만 오늘은 왜 그랬는지, 어떤 마음이었는지를 설명해 주는 부사 역할에 집중합니다. 목적, 감정의 원인, 판단의 근거, 이 세 가지만 확실히 잡으면 해석이 훨씬 쉬워져요. 자, 그럼 예문과 함께 하나씩 시작해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">목적: '~하기 위해'\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to 부정사가 '~하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내요. 이때 \u003cb class=\"key\">in order to\u003c/b> V나 \u003cb class=\"key\">so as to\u003c/b> V로 바꿔 써도 같은 뜻이 돼요.\u003cdiv>\u003cspan class=\"g-formula\">to + 동사원형 = ~하기 위해 (in order to V / so as to V)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He studied hard \u003cspan class=\"fx\">to pass the exam\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 시험에 합격하기 위해 열심히 공부했다.\u003c/div>\u003cdiv class=\"g-note\">to pass the exam이 공부한 목적을 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I got up early \u003cspan class=\"fx\">to catch the bus\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 버스를 타기 위해 일찍 일어났다.\u003c/div>\u003cdiv class=\"g-note\">일찍 일어난 이유, 즉 목적을 to 부정사가 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He studied hard \u003cspan class=\"fx\">in order not to fail the exam\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 시험에서 떨어지지 않기 위해 열심히 공부했다.\u003c/div>\u003cdiv class=\"g-note\">목적을 부정할 때는 not을 to 앞에 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적의 부정은 \u003cb class=\"key\">in order not to\u003c/b> V처럼 not을 to 앞에 써요. \u003cb class=\"key\">for\u003c/b> 뒤에 동사원형을 쓰는 실수는 금물이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 목적을 나타내는 쓰임이에요. 어떤 행동을 한 이유, 즉 '~하기 위해'라는 뜻을 to 부정사로 표현할 수 있죠. 이때 in order to나 so as to로 바꿔 써도 뜻은 똑같아요. 그리고 부정할 때는 not을 to 앞에 붙여서 in order not to라고 한다는 점도 꼭 기억해 두세요. 시험에도 정말 자주 나오는 포인트예요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. He studied hard to pass the exam. 그는 시험에 합격하기 위해 열심히 공부했다는 뜻이죠. 여기서 to pass the exam이 바로 열심히 공부한 목적, 시험에 합격하기 위해서라는 목적을 알려 주고 있어요.","hl":"ex-0"},{"n":4,"text":"이번 예문은 I got up early to catch the bus. 나는 버스를 타기 위해 일찍 일어났어요. to catch the bus가 왜 일찍 일어났는지를 알려 주는 목적 표현이에요. 해석할 때 '~하기 위해'를 붙이면 자연스럽습니다.","hl":"ex-1"},{"n":5,"text":"마지막으로 부정형이에요. He studied hard in order not to fail the exam. 그는 시험에서 떨어지지 않기 위해 열심히 공부했어요. 목적을 부정하고 싶을 때는 not을 동사 앞이 아니라 to 앞에 쓴다는 것, 꼭 기억해 두세요.","hl":"ex-2"},{"n":6,"text":"학생들이 가장 많이 하는 실수가 for 뒤에 동사원형을 쓰는 거예요. for는 전치사라서 뒤에 동사원형이 올 수 없으니, 목적은 반드시 to 부정사로 써야 합니다. 그리고 목적을 부정할 때는 not을 to 앞에 놓는 것도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">감정의 원인: '~해서'\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">glad, sorry, surprised 같은 \u003cb class=\"key\">감정 형용사\u003c/b> 뒤에 오는 to 부정사는 '~해서'라는 \u003cb class=\"key\">감정의 원인\u003c/b>을 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">감정 형용사 + to + 동사원형 = ~해서 (그런 감정이 든다)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I was \u003cspan class=\"fx\">glad to see you\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너를 만나서 기뻤다.\u003c/div>\u003cdiv class=\"g-note\">glad 뒤의 to see you가 기쁨의 원인을 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She was \u003cspan class=\"fx\">surprised to hear the news\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 그 소식을 듣고 놀랐다.\u003c/div>\u003cdiv class=\"g-note\">surprised 뒤의 to hear가 놀란 이유를 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I'm \u003cspan class=\"fx\">sorry to be late\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">늦어서 죄송합니다.\u003c/div>\u003cdiv class=\"g-note\">sorry 뒤의 to be late가 미안한 이유를 나타낸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>감정 형용사 뒤에는 동명사가 아니라 \u003cb class=\"key\">to 부정사\u003c/b>가 와요. \u003cb class=\"key\">감정의 원인\u003c/b>을 묻는 문제는 '~해서'로 해석되는지 확인하면 끝이에요.\u003c/div>","segs":[{"n":7,"text":"두 번째는 감정의 원인이에요. glad나 sorry, surprised처럼 감정을 나타내는 형용사 뒤에 to 부정사가 오면 '~해서'라고 해석합니다. 즉 그 감정이 생긴 이유를 to 부정사가 알려 주는 거예요. 해석할 때는 '~해서 기쁘다', '~해서 놀랐다'처럼 감정 형용사와 자연스럽게 이어 주시면 됩니다.","hl":"rule"},{"n":8,"text":"이 예문은 I was glad to see you. 너를 만나서 기뻤다는 뜻이에요. glad라는 감정 형용사 뒤에 to see you가 와서 기쁨의 원인을 알려 주고 있죠. 그래서 '만나서'라는 뜻으로 해석합니다.","hl":"ex-0"},{"n":9,"text":"She was surprised to hear the news. 그녀는 그 소식을 듣고 놀랐어요. surprised 뒤에 to hear the news가 와서 왜 놀랐는지, 그 원인을 설명하고 있습니다. '듣고'라고 해석하면 딱 맞아요.","hl":"ex-1"},{"n":10,"text":"I'm sorry to be late. 늦어서 죄송합니다라는 뜻이에요. sorry 뒤에 to be late가 붙어서 미안한 이유를 알려 주고 있죠. 이렇게 감정 형용사 뒤의 to 부정사는 '~해서'로 해석한다고 정리해 두세요.","hl":"ex-2"},{"n":11,"text":"glad 뒤에 seeing처럼 동명사를 쓰는 학생이 의외로 많아요. 감정 형용사 뒤에서 원인을 나타낼 때는 반드시 to 부정사를 쓴다는 점을 강조해서 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">판단의 근거: '~하다니'\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">must be나 cannot be, foolish처럼 \u003cb class=\"key\">판단\u003c/b>을 나타내는 말 뒤의 to 부정사는 '~하다니'라는 \u003cb class=\"key\">판단의 근거\u003c/b>를 나타내요.\u003cdiv>\u003cspan class=\"g-formula\">must be / cannot be + 형용사 + to + 동사원형 = ~하다니 …한 것이 틀림없다 / 그럴 리 없다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">must be kind to help us\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리를 도와주다니 그녀는 친절한 것이 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">to help us가 '친절하다'는 판단의 근거가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">must be foolish to believe that\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그것을 믿다니 그는 어리석은 것이 틀림없다.\u003c/div>\u003cdiv class=\"g-note\">to believe that이 '어리석다'는 판단의 근거다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">cannot be honest to say such a thing\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그런 말을 하다니 그는 정직할 리가 없다.\u003c/div>\u003cdiv class=\"g-note\">cannot be 뒤의 to 부정사가 '그럴 리 없다'는 판단의 근거가 된다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>판단의 근거는 보통 \u003cb class=\"key\">must be\u003c/b>나 \u003cb class=\"key\">cannot be\u003c/b> 뒤에서 '~하다니'로 해석해요. \u003cb class=\"key\">foolish\u003c/b> 같은 판단 형용사 뒤에서도 같은 방식으로 쓰여요.\u003c/div>","segs":[{"n":12,"text":"마지막은 판단의 근거예요. must be나 cannot be, 그리고 foolish 같은 판단 표현 뒤에 to 부정사가 오면 '~하다니'라고 해석합니다. 앞에서 내린 판단의 근거를 뒤에서 제시하는 구조인 거죠. 이때 must be는 '틀림없다', cannot be는 '그럴 리 없다'로 해석한다는 것도 함께 기억해 주세요.","hl":"rule"},{"n":13,"text":"세 번째 예문이에요. She must be kind to help us. 우리를 도와주다니 그녀는 친절한 것이 틀림없다는 뜻이죠. 뒤에 있는 to help us가 우리를 돕는다는 사실, 즉 친절하다고 판단한 근거를 알려 주고 있어요.","hl":"ex-0"},{"n":14,"text":"He must be foolish to believe that. 그것을 믿다니 그는 어리석은 것이 틀림없어요. to believe that이 그가 어리석다고 판단한 근거가 되고 있습니다. '~하다니'로 해석하는 게 포인트예요.","hl":"ex-1"},{"n":15,"text":"He cannot be honest to say such a thing. 그런 말을 하다니 그는 정직할 리가 없어요. cannot be는 '그럴 리 없다'라는 강한 판단이고, 뒤의 to say such a thing이 그 판단의 근거를 제시하고 있습니다.","hl":"ex-2"},{"n":16,"text":"이 쓰임은 해석이 조금 어색하게 느껴질 수 있어요. 하지만 앞의 must be나 cannot be가 판단이고 뒤의 to 부정사가 그 판단의 근거라고 생각하면 '~하다니'라는 해석이 자연스럽게 나옵니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He studied hard for pass the exam.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He studied hard to pass the exam.\u003c/div>\u003cdiv class=\"g-why\">목적을 나타낼 때는 전치사 for가 아니라 to 부정사를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I was glad seeing you.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I was glad to see you.\u003c/div>\u003cdiv class=\"g-why\">감정 형용사 뒤에서 감정의 원인은 동명사가 아니라 to 부정사로 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>In order to not fail the exam, he studied hard.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ In order not to fail the exam, he studied hard.\u003c/div>\u003cdiv class=\"g-why\">to 부정사의 부정은 not을 to 앞에 두어야 한다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"목적을 말할 때 for 뒤에 동사를 그대로 쓰는 학생이 정말 많아요. 하지만 for는 전치사라서 뒤에 동사원형이 올 수 없죠. 이럴 때는 반드시 to 부정사를 써서 to pass the exam이라고 해야 합니다.","hl":"mk-0"},{"n":18,"text":"감정 형용사 뒤에 동명사를 쓰면 어색하게 들려요. glad, sorry, surprised 뒤에서 원인을 말할 때는 to 부정사를 씁니다. 그래서 I was glad to see you라고 해야 자연스러워요.","hl":"mk-1"},{"n":19,"text":"to 부정사를 부정할 때 not을 동사 앞에 넣는 실수가 정말 많아요. 하지만 to 부정사는 한 덩어리라서 not을 to 앞에 붙여 in order not to fail이라고 써야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 to 부정사의 쓰임이 나머지 셋과 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I was glad to see you.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>He studied hard to pass the exam.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She was surprised to hear the news.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I'm sorry to be late.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He studied hard to pass the exam.\u003c/span>\u003cdiv class=\"g-exp\">두 번째 문장의 to pass the exam은 '~하기 위해'라는 목적을 나타내고, 나머지는 모두 감정의 원인을 나타낸다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"첫 번째 문제입니다. 다음 중 to 부정사의 쓰임이 나머지 셋과 다른 하나를 고르세요. 첫 번째 보기부터 네 번째 보기까지 잘 읽어 보시고, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기예요. He studied hard to pass the exam에서 to pass the exam은 시험에 합격하기 위해라는 목적을 나타내죠. 나머지 세 문장은 모두 glad, surprised, sorry 같은 감정 형용사 뒤에서 '~해서'라는 감정의 원인을 나타내고 있습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 넣으세요.\u003c/div>\u003cdiv class=\"g-qs\">He studied hard ____ pass the exam.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to\u003c/span>\u003cdiv class=\"g-exp\">'~하기 위해'라는 목적을 나타낼 때는 to 부정사를 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"두 번째 문제는 빈칸 채우기입니다. He studied hard 빈칸 pass the exam. 빈칸에 들어갈 말을 생각해 보시고, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 to입니다. 그는 시험에 합격하기 위해 열심히 공부했다는 뜻이니까 목적을 나타내는 to 부정사가 필요해요. 그래서 He studied hard to pass the exam이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">문장에서 틀린 부분을 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">He studied hard in order to not fail the exam.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He studied hard in order not to fail the exam.\u003c/span>\u003cdiv class=\"g-exp\">to 부정사의 부정은 not을 to 앞에 두어 in order not to V로 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"세 번째 문제는 오류 수정입니다. He studied hard in order to not fail the exam. 이 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 He studied hard in order not to fail the exam입니다. to 부정사를 부정할 때는 not을 동사 앞이 아니라 to 앞에 두어야 해요. 그래서 in order not to fail이라고 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">to / the bus / I / up / catch / got / early\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I got up early to catch the bus.\u003c/span>\u003cdiv class=\"g-exp\">주어 I 뒤에 동사 got up이 오고, 목적을 나타내는 to catch the bus가 이어진다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"네 번째 문제는 단어 배열입니다. 주어진 단어를 모두 사용해서 나는 버스를 타기 위해 일찍 일어났다라는 뜻의 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 I got up early to catch the bus입니다. 먼저 주어와 동사로 I got up을 만들고, early로 일찍이라는 뜻을 더한 뒤, 목적을 나타내는 to catch the bus를 붙이면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 해석으로 가장 알맞은 것을 고르세요. She must be kind to help us.\u003c/div>\u003cdiv class=\"g-qs\">She must be kind to help us.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>우리를 도와주다니 그녀는 친절한 것이 틀림없다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>그녀는 우리를 도와주기 위해 친절해야 한다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>그녀는 우리를 도와서 친절했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>그녀는 우리를 도와주고 싶어 한다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">우리를 도와주다니 그녀는 친절한 것이 틀림없다.\u003c/span>\u003cdiv class=\"g-exp\">must be 뒤의 to help us는 '~하다니'라는 판단의 근거를 나타낸다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"다섯 번째 문제입니다. She must be kind to help us. 이 문장의 해석으로 가장 알맞은 것을 고르세요. 네 개의 보기를 잘 읽어 보고, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 첫 번째 보기예요. must be kind 뒤에 to help us가 와서 우리를 도와준다는 사실이 친절하다고 판단한 근거가 됩니다. 그래서 우리를 도와주다니 그녀는 친절한 것이 틀림없다고 해석합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">그는 그 소식을 듣고 놀랐다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He was surprised to hear the news.\u003c/span>\u003cdiv class=\"g-exp\">감정 형용사 surprised 뒤에 to hear the news를 써서 놀란 원인을 나타낸다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"마지막 문제는 영작입니다. 그는 그 소식을 듣고 놀랐다를 영어로 써 보세요. 감정 형용사 뒤에 무엇이 오는지 떠올리면서 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 He was surprised to hear the news입니다. 놀랐다는 감정 형용사 surprised 뒤에 to hear the news를 붙여서 놀란 원인을 나타내 주면 돼요. 감정의 원인은 to 부정사로 쓴다는 점, 다시 한 번 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 037 부정사의 부사적 역할 1: 목적, 감정의 원인, 판단의 근거\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>to 부정사는 '~하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내고, \u003cb class=\"key\">in order to\u003c/b> V로 바꿔 쓸 수 있어요.\u003c/li>\u003cli>glad, sorry, surprised 같은 \u003cb class=\"key\">감정 형용사\u003c/b> 뒤의 to 부정사는 '~해서'라는 \u003cb class=\"key\">감정의 원인\u003c/b>을 나타내요.\u003c/li>\u003cli>must be나 cannot be 뒤의 to 부정사는 '~하다니'라는 \u003cb class=\"key\">판단의 근거\u003c/b>를 나타내요.\u003c/li>\u003cli>to 부정사의 부정은 \u003cb class=\"key\">not\u003c/b>을 to 앞에 써서 in order not to V로 만들어요.\u003c/li>\u003c/ul>","segs":[{"n":38,"text":"오늘은 to 부정사가 부사처럼 쓰이는 세 가지 경우를 배웠어요. 첫째는 목적을 나타내는 쓰임으로 '~하기 위해'라고 해석하고, in order to로 바꿔 쓸 수 있었죠. 둘째는 감정 형용사 뒤에서 '~해서'라는 감정의 원인을, 셋째는 must be나 cannot be 뒤에서 '~하다니'라는 판단의 근거를 나타냈어요. 마지막으로 부정할 때는 not을 to 앞에 쓴다는 것까지 꼭 기억해 주세요. 오늘도 수고 많았습니다, 다음 시간에 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
