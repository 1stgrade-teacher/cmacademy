lecturePlayer(document.getElementById("app"),{"brand":"Unit 18 구동사 수동태 & 수동태의 관용적 표현","title":"전치사까지 따라온다! 구동사 수동태와 수동태의 관용 표현","audioDir":"문법_Unit_018_구동사_수동태_&_수동태의_관용적_표현_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 03 동사의 태 | Unit 018 구동사 수동태 &amp; 수동태의 관용적 표현\u003c/div>\u003ch1>전치사까지 따라온다! 구동사 수동태와 수동태의 관용 표현\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>구동사가 수동태가 될 때 전치사를 그대로 남기는 원리를 이해하고, by 이외의 전치사를 쓰는 관용 표현과 be made of/from을 구별해 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요, 오늘도 함께 문법 정리해 볼게요. 오늘은 구동사의 수동태와 수동태의 관용 표현을 배웁니다. 전치사 하나 때문에 점수가 갈리는 단원이니까 끝까지 집중해 주세요. 예문으로 개념을 확실히 잡고, 마지막에 문제까지 같이 풀어 볼 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">구동사의 수동태: 전치사는 절대 떨어지지 않는다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">구동사는 \u003cb class=\"key\">동사 + 전치사\u003c/b>가 하나의 동사처럼 움직이기 때문에, 수동태로 바꿀 때도 \u003cb class=\"key\">전치사\u003c/b>를 동사 뒤에 그대로 남겨 둡니다. look after는 \u003cb class=\"key\">be looked after\u003c/b>의 형태가 되고, 전치사를 지우거나 문장 끝으로 따로 옮기면 안 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">능동: look after + 목적어 → 수동: be looked after + by + 행위자\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The baby \u003cspan class=\"fx\">was looked after\u003c/span> by her aunt.\u003c/div>\u003cdiv class=\"g-ko\">아기는 이모가 돌보았다.\u003c/div>\u003cdiv class=\"g-note\">look after가 수동태가 되어도 after가 그대로 남아 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This word is often looked up in the dictionary.\u003c/div>\u003cdiv class=\"g-ko\">이 단어는 사전에서 자주 찾아진다.\u003c/div>\u003cdiv class=\"g-note\">look up처럼 부사가 붙은 구동사도 up을 그대로 남깁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">look after\u003c/b>, \u003cb class=\"key\">take care of\u003c/b>처럼 동사와 전치사를 \u003cb class=\"key\">한 덩어리\u003c/b>로 묶어서 외워 두세요.\u003c/div>","segs":[{"n":2,"text":"먼저 구동사의 수동태부터 볼게요. look after처럼 동사 뒤에 전치사가 붙어 하나의 동사처럼 쓰이는 표현을 구동사라고 합니다. 이걸 수동태로 바꿀 때도 전치사는 그대로 따라옵니다. 그래서 be looked after라는 형태가 되고, 전치사를 지우거나 따로 떼어 놓으면 안 됩니다. 그러니까 전치사까지 한 덩어리로 통째로 외워 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. The baby was looked after by her aunt. 뜻은 아기는 이모가 돌보았다입니다. look after가 was looked after로 바뀌었는데 after가 그대로 붙어 있는 걸 꼭 확인하세요.","hl":"ex-0"},{"n":4,"text":"이 예문도 읽어 볼게요. This word is often looked up in the dictionary. 뜻은 이 단어는 사전에서 자주 찾아진다는 말이에요. look up이 is looked up으로 바뀌어도 up이 그대로 붙어 있죠.","hl":"ex-1"},{"n":5,"text":"시험에서는 전치사를 일부러 빼거나 다른 걸로 바꿔서 틀리게 만드니까, 동사와 전치사를 한 덩어리로 묶어서 외워 두면 안전합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">by가 아닌 전치사를 쓰는 수동태 관용 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be interested in, be satisfied with, be covered with, be known to, be known for, be known as처럼 \u003cb class=\"key\">by 이외의 전치사\u003c/b>를 쓰는 표현은 수동태 형태로 굳어져 있습니다. 감정이나 상태를 나타내는 표현이 많아서 \u003cb class=\"key\">전치사 짝\u003c/b>을 통째로 외워야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">be + 과거분사 + 고정 전치사 (in / with / to / for / as)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">is interested in\u003c/span> astronomy.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 천문학에 관심이 있다.\u003c/div>\u003cdiv class=\"g-note\">interested 뒤에는 in이 고정으로 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The mountain \u003cspan class=\"fx\">is covered with\u003c/span> snow.\u003c/div>\u003cdiv class=\"g-ko\">그 산은 눈으로 덮여 있다.\u003c/div>\u003cdiv class=\"g-note\">덮여 있다는 상태를 나타내므로 with를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">am satisfied with\u003c/span> my result.\u003c/div>\u003cdiv class=\"g-ko\">나는 내 결과에 만족한다.\u003c/div>\u003cdiv class=\"g-note\">만족하다는 satisfied with로 짝을 이룹니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">is known for\u003c/span> his honesty.\u003c/div>\u003cdiv class=\"g-ko\">그는 정직함으로 유명하다.\u003c/div>\u003cdiv class=\"g-note\">known은 for, to, as와 각각 다른 의미로 쓰입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">be interested in\u003c/b>의 in을 about으로 바꾸면 틀립니다. 전치사만 바꿔서 출제되니 \u003cb class=\"key\">전치사 짝\u003c/b>을 정확히 외우세요.\u003c/div>","segs":[{"n":6,"text":"이번에는 by가 아닌 전치사를 쓰는 관용 표현을 볼게요. be interested in, be satisfied with, be covered with, be known for처럼 수동태 모양이지만 by가 아니라 자기만의 전치사를 데리고 다니는 표현들이 있어요. 이런 표현은 감정이나 상태를 나타내는 경우가 많아서 규칙으로 유추하기보다 짝을 통째로 외우는 게 빠릅니다. 시험에도 전치사만 바꿔 놓고 고르라고 자주 냅니다.","hl":"rule"},{"n":7,"text":"예문 읽어 볼게요. She is interested in astronomy. 뜻은 그녀는 천문학에 관심이 있다입니다. 관심 있다는 표현은 interested 다음에 in을 쓴다는 점을 기억하세요.","hl":"ex-0"},{"n":8,"text":"다음 예문이에요. The mountain is covered with snow. 뜻은 그 산은 눈으로 덮여 있다입니다. 여기서는 by가 아니라 with를 쓴다는 게 포인트예요.","hl":"ex-1"},{"n":9,"text":"이 문장도 읽어 볼게요. I am satisfied with my result. 뜻은 나는 내 결과에 만족한다예요. satisfied 뒤에는 with가 온다고 같이 기억해 두세요.","hl":"ex-2"},{"n":10,"text":"마지막 예문입니다. He is known for his honesty. 뜻은 그는 정직함으로 유명하다예요. known 뒤에 for가 오면 어떤 특징으로 유명하다는 뜻이 됩니다.","hl":"ex-3"},{"n":11,"text":"interested 뒤에 about을 쓰면 틀린 문장이 됩니다. 이렇게 전치사 하나만 바꿔서 출제되는 경우가 많으니 짝을 정확히 외워 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">be made of와 be made from의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be made of는 \u003cb class=\"key\">재료의 형태가 그대로 유지\u003c/b>되어 눈으로 알아볼 수 있을 때 쓰고, be made from은 가공을 거쳐 \u003cb class=\"key\">원래 형태를 알아볼 수 없을 때\u003c/b> 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">be made of + 형태가 남는 재료 / be made from + 변형된 재료\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The table \u003cspan class=\"fx\">is made of\u003c/span> wood.\u003c/div>\u003cdiv class=\"g-ko\">그 탁자는 나무로 만들어졌다.\u003c/div>\u003cdiv class=\"g-note\">나무의 형태가 그대로 남아 있으므로 of를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Wine \u003cspan class=\"fx\">is made from\u003c/span> grapes.\u003c/div>\u003cdiv class=\"g-ko\">와인은 포도로 만들어진다.\u003c/div>\u003cdiv class=\"g-note\">포도가 발효되어 원래 형태가 사라지므로 from을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>같은 재료라도 \u003cb class=\"key\">형태 유지\u003c/b>면 of, \u003cb class=\"key\">변화\u003c/b>면 from입니다. 문제에서 재료가 무엇인지보다 \u003cb class=\"key\">형태가 남았는지\u003c/b>를 먼저 보세요.\u003c/div>","segs":[{"n":12,"text":"마지막으로 be made of와 be made from을 구별해 볼게요. 둘 다 만들어졌다는 뜻이지만 재료의 형태가 남아 있으면 of를 쓰고, 가공을 거쳐서 원래 모습을 알아볼 수 없으면 from을 씁니다. 탁자는 나무의 결이 그대로 보이니까 of, 와인은 포도가 변해서 만들어졌으니까 from이에요. 형태가 보이는지 아닌지만 따져 보면 쉽게 갈라집니다.","hl":"rule"},{"n":13,"text":"예문 읽어 볼게요. The table is made of wood. 뜻은 그 탁자는 나무로 만들어졌다입니다. 탁자를 보면 나무라는 재료가 그대로 보이니까 of를 쓴 거예요.","hl":"ex-0"},{"n":14,"text":"이 문장도 읽어 볼게요. Wine is made from grapes. 뜻은 와인은 포도로 만들어진다예요. 와인에서는 포도 모양을 찾을 수 없죠, 그래서 from을 씁니다.","hl":"ex-1"},{"n":15,"text":"나무든 포도든 재료 이름이 아니라 형태가 남았는지를 보셔야 해요. 형태가 보이면 of, 사라졌으면 from이라고 정리해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The baby was looked after her aunt.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The baby was looked after by her aunt.\u003c/div>\u003cdiv class=\"g-why\">수동태에서 행위자를 나타낼 때는 by가 필요하고, 구동사의 전치사 after도 그대로 남아야 합니다.\u003c/div>\u003c/div>\u00
