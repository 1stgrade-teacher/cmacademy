lecturePlayer(document.getElementById("app"),{"brand":"Unit 61 명사절 1 (that)","title":"that절 완전 정복: 명사절의 네 가지 역할","audioDir":"문법_Unit_061_명사절_1_(that)_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">명사절 1 (that)\u003c/div>\u003ch1>that절 완전 정복: 명사절의 네 가지 역할\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>접속사 that이 이끄는 명사절의 역할을 이해하고, 목적어절의 생략과 가주어 it 구조를 활용해 문장을 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 that이 이끄는 명사절을 배워 볼 거예요. that은 문장 안에서 명사처럼 쓰이면서 주어, 목적어, 보어, 동격의 역할을 할 수 있어요. 특히 목적어절에서 that을 생략하는 경우와 주어절에서 가주어 it을 쓰는 경우를 함께 익혀 볼게요. 예문을 하나씩 읽으면서 that절이 문장에서 어떤 일을 하는지 찾아봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">that절의 의미와 네 가지 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사 \u003cb class=\"key\">that\u003c/b>은 '~라는 것'이라는 뜻으로 \u003cb class=\"key\">명사절\u003c/b>을 이끕니다. 이 that절은 문장 안에서 \u003cb class=\"key\">주어, 목적어, 보어, 동격\u003c/b>의 역할을 할 수 있습니다. 예를 들어 목적어 자리에서는 '~라는 것을'로 해석합니다.\u003cdiv>\u003cspan class=\"g-formula\">that + 완전한 절 = ~라는 것\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I know \u003cspan class=\"fx\">(that) she is honest\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀가 정직하다는 것을 안다.\u003c/div>\u003cdiv class=\"g-note\">know의 목적어로 that절이 왔고, 목적어절의 that은 생략할 수 있습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>that절은 \u003cb class=\"key\">명사\u003c/b>처럼 한 문장 성분을 통째로 대신하므로, 해석할 때 \u003cb class=\"key\">~라는 것\u003c/b>으로 자연스럽게 풀어 보세요.\u003c/div>","segs":[{"n":2,"text":"오늘은 that이 이끄는 명사절을 배워 볼게요. that은 한국어로 '라는 것'이라는 뜻으로 명사처럼 문장의 한 자리를 차지해요. 주어 자리, 목적어 자리, 보어 자리, 그리고 동격 자리까지 갈 수 있답니다. 먼저 목적어 자리에서 어떻게 쓰이는지 예문으로 확인해 볼게요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 I know that she is honest. 입니다. 뜻은 나는 그녀가 정직하다는 것을 안다예요. know 뒤에 that절이 목적어로 왔고, 이때 that은 생략해도 뜻이 그대로예요.","hl":"ex-0"},{"n":4,"text":"that절은 명사처럼 문장의 한 자리를 통째로 차지한다고 생각하면 이해가 쉬워요. 해석할 때는 한국어로 자연스럽게 풀어 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">that 뒤에는 완전한 절, 목적어절의 생략\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">that 뒤에는 주어와 동사가 갖춰진 \u003cb class=\"key\">완전한 절\u003c/b>이 와야 합니다. \u003cb class=\"key\">목적어절\u003c/b>의 that은 \u003cb class=\"key\">생략\u003c/b>할 수 있지만, 주어절이나 동격절의 that은 함부로 생략하지 않는 경우가 많습니다.\u003cdiv>\u003cspan class=\"g-formula\">목적어절: (that) + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I think \u003cspan class=\"fx\">(that) he is right\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 맞다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">think의 목적어절에서 that을 생략할 수 있고, that 뒤에는 he is right라는 완전한 절이 옵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어절의 that은 생략할 수 있지만, 먼저 \u003cb class=\"key\">완전한 절\u003c/b>인지 확인하는 습관이 중요합니다.\u003c/div>","segs":[{"n":5,"text":"that 뒤에는 주어와 동사가 모두 있는 완전한 절이 와야 해요. 그래서 that 다음에 주어나 동사가 빠지면 문장이 어색해집니다. 반대로 목적어절에서는 that을 생략해도 자연스러운 경우가 많아요. 이 점을 기억하면서 보충 예문을 볼게요.","hl":"rule"},{"n":6,"text":"이 예문은 I think that he is right. 입니다. 뜻은 나는 그가 맞다고 생각한다예요. think 뒤에 that절이 목적어로 왔고, that을 빼도 I think he is right.처럼 자연스럽게 말할 수 있어요.","hl":"ex-0"},{"n":7,"text":"that을 생략하기 전에 먼저 that 뒤가 완전한 절인지 확인해 보세요. 그 습관이 정확한 문장을 만드는 데 도움이 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">주어절 that과 가주어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">주어절\u003c/b>의 that은 문장 앞에 길게 오면 어색할 수 있어 \u003cb class=\"key\">가주어 it\u003c/b>으로 바꿔 쓰는 경우가 많습니다. 이때 진짜 주어인 that절은 문장 뒤로 보냅니다. 대표 구조는 It is true that ~입니다.\u003cdiv>\u003cspan class=\"g-formula\">It is + 형용사 + that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It is certain that he will come.\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">그가 올 것은 확실하다.\u003c/div>\u003cdiv class=\"g-note\">가주어 it을 사용해 that절을 뒤로 보낸 주어절입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가주어 it은 '그것'으로 해석하지 말고, 뒤의 \u003cb class=\"key\">that절\u003c/b>이 \u003cb class=\"key\">진짜 주어\u003c/b>임을 기억하세요.\u003c/div>","segs":[{"n":8,"text":"that절이 주어로 쓰이면 문장이 길어져서 듣기에 부담스러울 수 있어요. 그래서 영어는 가주어 it을 앞에 세우고 진짜 주어인 that절을 뒤로 보내는 방식을 자주 씁니다. It is true that she is honest.처럼 말이죠. 이때 it은 그것이라고 해석하지 않는다는 점도 중요해요.","hl":"rule"},{"n":9,"text":"두 번째 예문은 It is certain that he will come. 입니다. 뜻은 그가 올 것은 확실하다예요. 앞의 it은 가주어이고, 진짜 주어는 that he will come이에요. 그래서 그것이 확실하다가 아니라 그가 올 것이 확실하다로 해석해요.","hl":"ex-0"},{"n":10,"text":"가주어 it은 그것이라고 해석하지 말고, 뒤에 있는 that절이 진짜 주어라는 점을 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">동격절 that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">동격절\u003c/b>의 that은 앞에 오는 \u003cb class=\"key\">명사\u003c/b>의 내용을 구체적으로 설명합니다. 특히 fact, idea, news 같은 명사 뒤에서 '~라는 사실, ~라는 생각'처럼 해석합니다. 이때도 that 뒤에는 \u003cb class=\"key\">완전한 절\u003c/b>이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The fact \u003cspan class=\"fx\">that he lied\u003c/span> surprised us.\u003c/div>\u003cdiv class=\"g-ko\">그가 거짓말을 했다는 사실은 우리를 놀라게 했다.\u003c/div>\u003cdiv class=\"g-note\">fact의 내용을 that절이 설명하는 동격절입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동격절은 앞의 \u003cb class=\"key\">명사\u003c/b>와 내용이 같아지는 구조이므로 fact, idea, news 같은 명사를 함께 익혀 두세요.\u003c/div>","segs":[{"n":11,"text":"동격절은 앞에 있는 명사의 내용을 뒤에서 풀어 주는 역할을 해요. 예를 들어 fact 뒤에 that절이 오면 라는 사실이라는 뜻으로 fact의 내용을 설명하죠. 이때 that은 접
