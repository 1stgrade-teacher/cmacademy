}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 78 복합관계사","title":"복합관계사, 하나로 두 가지 뜻을 잡는 법","audioDir":"문법_Unit_078_복합관계사_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 078 복합관계사\u003c/div>\u003ch1>복합관계사, 하나로 두 가지 뜻을 잡는 법\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>복합관계대명사와 복합관계부사의 뜻과 쓰임을 이해하고, no matter 표현으로 바꿔 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Unit 078 복합관계사를 공부해 볼 거예요. 이름이 조금 어렵게 느껴질 수 있는데, whoever나 whatever처럼 두 가지 역할을 한 몸에 담고 있는 표현이라고 생각하면 훨씬 쉬워요. 오늘은 복합관계대명사와 복합관계부사가 문장에서 어떤 일을 하는지 예문으로 확인하고, 마지막에는 no matter 표현으로 바꿔 쓰는 연습까지 해 볼게요. 준비되셨으면 바로 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">복합관계대명사 whoever, whatever, whichever\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whoever\u003c/b>, \u003cb class=\"key\">whatever\u003c/b>, \u003cb class=\"key\">whichever\u003c/b>는 '~하는 누구든지, 무엇이든'이라는 뜻으로 \u003cb class=\"key\">명사절\u003c/b>을 이끌어 문장에서 주어나 목적어 역할을 해요. 또 쉼표 뒤에서는 '누가 무엇을 하더라도'라는 \u003cb class=\"key\">양보 부사절\u003c/b>로도 쓰여요.\u003cdiv>\u003cspan class=\"g-formula\">whoever + 불완전한 문장 = ~하는 누구든지 / 누가 ~하더라도\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Whoever comes first\u003c/span> will get a prize.\u003c/div>\u003cdiv class=\"g-ko\">가장 먼저 오는 사람은 누구든 상을 받을 것이다.\u003c/div>\u003cdiv class=\"g-note\">whoever가 이끄는 절이 문장 전체의 주어로 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Whatever you decide\u003c/span>, I will support you.\u003c/div>\u003cdiv class=\"g-ko\">네가 무엇을 결정하든 나는 지지할 것이다.\u003c/div>\u003cdiv class=\"g-note\">쉼표 앞의 whatever절은 '무엇을 ~하든'이라는 양보의 부사절이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Whichever you choose\u003c/span>, I will be happy.\u003c/div>\u003cdiv class=\"g-ko\">네가 어느 것을 고르든 나는 기쁠 거야.\u003c/div>\u003cdiv class=\"g-note\">whichever는 정해진 범위 안에서 '어느 것이든'이라는 뜻을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>whoever가 문장의 주어로 쓰이면 \u003cb class=\"key\">단수\u003c/b>로 취급해서 동사에 s를 붙여요.\u003c/div>","segs":[{"n":2,"text":"먼저 복합관계대명사부터 살펴볼게요. whoever는 '누구든지'라는 뜻으로, 문장에서 주어나 목적어 자리를 채우는 명사절을 이끕니다. 그리고 쉼표 뒤에 오면 '누가 무엇을 하더라도'라는 양보의 뜻을 만들어요. whatever와 whichever도 똑같이 이 두 가지 쓰임을 가진다는 점이 핵심이에요. 그래서 문장에서 자리가 어디인지, 쉼표가 있는지를 보면 뜻이 바로 잡힌답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 Whoever comes first will get a prize.이고, 뜻은 가장 먼저 오는 사람은 누구든 상을 받을 것이다예요. whoever가 이끄는 절이 문장 전체의 주어 역할을 하고 있죠. '누구든'이라는 뜻이 그대로 살아 있는 게 보이시죠?","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 Whatever you decide, I will support you.이고, 뜻은 네가 무엇을 결정하든 나는 지지할 것이다예요. 여기서는 쉼표 앞에 whatever절이 놓여서 '무엇을 결정하든'이라는 양보의 뜻을 만들고 있어요. 뒤에 나오는 완전한 문장과 함께 읽으면 뜻이 아주 자연스럽게 연결됩니다.","hl":"ex-1"},{"n":5,"text":"여기서 하나 더 보충해 볼게요. Whichever you choose, I will be happy.이고, 뜻은 네가 어느 것을 고르든 나는 기쁠 거야예요. whichever는 정해진 몇 가지 중에서 '어느 것이든'이라는 뜻을 담고 있어요. whatever와 비슷하지만 선택의 범위가 정해져 있을 때 쓴다고 기억해 두세요.","hl":"ex-2"},{"n":6,"text":"한 가지 조심할 점이 있어요. whoever가 문장의 주어로 쓰이면 단수로 취급하기 때문에 동사에 s를 붙여야 합니다. 예문에서도 comes라고 되어 있는 걸 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">복합관계부사 whenever, wherever, however\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whenever\u003c/b>, \u003cb class=\"key\">wherever\u003c/b>, \u003cb class=\"key\">however\u003c/b>는 각각 '언제든지, 어디든지, 아무리 ~해도'라는 뜻으로 \u003cb class=\"key\">부사절\u003c/b>을 이끌어요. 특히 however 뒤에는 \u003cb class=\"key\">형용사나 부사\u003c/b>가 바로 와서 '아무리 ~해도'라는 뜻을 만들어요.\u003cdiv>\u003cspan class=\"g-formula\">however + 형용사/부사 + 주어 + 동사 = 아무리 ~해도\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">However hard\u003c/span> he tried, he failed.\u003c/div>\u003cdiv class=\"g-ko\">아무리 열심히 노력해도 그는 실패했다.\u003c/div>\u003cdiv class=\"g-note\">however 뒤에 부사 hard가 바로 와서 '아무리 열심히'라는 뜻이 됐어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Whenever you need help\u003c/span>, call me.\u003c/div>\u003cdiv class=\"g-ko\">도움이 필요할 때는 언제든 나에게 전화해.\u003c/div>\u003cdiv class=\"g-note\">whenever는 '언제든지'라는 뜻으로 시간의 부사절을 이끌어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Wherever you go\u003c/span>, you can find good friends.\u003c/div>\u003cdiv class=\"g-ko\">어디를 가든 너는 좋은 친구들을 만날 수 있어.\u003c/div>\u003cdiv class=\"g-note\">wherever는 '어디든지'라는 뜻으로 장소의 부사절을 이끌어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>however는 '하지만'이라는 접속부사와 헷갈리기 쉬운데, 뒤에 \u003cb class=\"key\">형용사나 부사\u003c/b>가 오면 '아무리 ~해도'라는 \u003cb class=\"key\">복합관계부사\u003c/b>예요.\u003c/div>","segs":[{"n":7,"text":"이번에는 복합관계부사를 볼게요. whenever는 '언제든지', wherever는 '어디든지', however는 '아무리 ~해도'라는 뜻으로 부사절을 이끕니다. 이 중에서 however는 뒤에 형용사나 부사가 바로 와야 한다는 점이 아주 중요해요. 그 순서만 기억하면 '아무리 열심히, 아무리 어려워도' 같은 표현을 자유롭게 만들 수 있답니다.","hl":"rule"},{"n":8,"text":"예문을 하나 읽어 볼게요. However hard he tried, he failed.이고, 뜻은 아무리 열심히 노력해도 그는 실패했다예요. however 바로 뒤에 부사 hard가 와서 '아무리 열심히'라는 뜻을 만들고 있죠. 이 순서가 이 단원에서 가장 중요한 포인트예요.","hl":"ex-0"},{"n":9,"text":"보충 예문도 하나 볼게요. Whenever you need help, call me.이고, 뜻은 도움이 필요할 때는 언제든 나에게 전화해예요. whenever가 '언제든지'라는 뜻으로 부사절을 이끌고 있답니다. 뒤에 오는 문장이 명령문이어도 자연스럽게 이어져요.","hl":"ex-1"},{"n":10,"text":"또 하나 더 볼게요. Wherever you go, you can find good friends.이고, 뜻은 어디를 가든 너는 좋은 친구들을 만날 수 있어예요. wherever가 장소를 나타내면서 '어디든지'라는 뜻을 담고 있죠. whenever와 짝을 지어 함께 외워 두면 좋아요.","hl":"ex-2"},{"n":11,"text":"헷갈리기 쉬운 부분이 하나 있어요. however는 '하지만'이라는 접속부사로도 쓰이는데, 뒤에 형용사나 부사가 오면 '아무리 ~해도'라는 복합관계부사가 됩니다. 뒤에 무엇이 오는지 꼭 확인해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">no matter + 의문사로 바꿔 쓰기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">복합관계사는 \u003cb class=\"key\">no matter who\u003c/b>, \u003cb class=\"key\">no matter what\u003c/b>, \u003cb class=\"key\">no matter how\u003c/b>처럼 no matter에 의문사를 붙인 표현으로 바꿔 쓸 수 있어요. 뜻은 완전히 같으므로 \u003cb class=\"key\">바꿔 쓰기\u003c/b>가 가능하다는 점을 기억하세요.\u003cdiv>\u003cspan class=\"g-formula\">no matter + who/what/when/where/how = whoever/whatever/whenever/wherever/however\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">No matter what\u003c/span> you decide, I will support you.\u003c/div>\u003cdiv class=\"g-ko\">네가 무엇을 결정하든 나는 지지할 것이다.\u003c/div>\u003cdiv class=\"g-note\">whatever you decide와 똑같은 뜻으로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">No matter how hard\u003c/span> he tried, he failed.\u003c/div>\u003cdiv class=\"g-ko\">아무리 열심히 노력해도 그는 실패했다.\u003c/div>\u003cdiv class=\"g-note\">however hard와 같은 뜻이며, no matter how 뒤에도 형용사나 부사가 와요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>no matter 뒤에는 \u003cb class=\"key\">의문사\u003c/b>가 와야 하고, no matter however처럼 however와 함께 쓰지는 않아요.\u003c/div>","segs":[{"n":12,"text":"마지막으로 바꿔 쓰기예요. 복합관계사는 no matter에 의문사를 붙인 표현으로 바꿀 수 있습니다. no matter who는 whoever, no matter what은 whatever, no matter how는 however와 뜻이 완전히 같아요. 그래서 독해를 할 때 이 표현이 나오면 복합관계사로 바꿔서 생각하면 훨씬 편하게 이해할 수 있답니다.","hl":"rule"},{"n":13,"text":"예문을 하나 볼게요. No matter what you decide, I will support you.이고, 뜻은 네가 무엇을 결정하든 나는 지지할 것이다예요. 앞에서 배운 whatever you decide와 완전히 같은 뜻이죠. no matter what이 whatever 자리에 그대로 들어갔다고 생각하면 쉬워요.","hl":"ex-0"},{"n":14,"text":"하나 더 볼게요. No matter how hard he tried, he failed.이고, 뜻은 아무리 열심히 노력해도 그는 실패했다예요. however hard를 no matter how hard로 바꾼 문장이에요. no matter how 뒤에도 형용사나 부사가 온다는 점은 똑같답니다.","hl":"ex-1"},{"n":15,"text":"여기서 주의할 점이 있어요. no matter 뒤에는 의문사가 와야 하기 때문에 however와 함께 no matter however라고 쓰지는 않습니다. however 하나만으로 이미 '아무리 ~해도'라는 뜻이 완성되니까요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Whoever come first will get a prize.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Whoever comes first will get a prize.\u003c/div>\u003cdiv class=\"g-why\">whoever가 이끄는 절의 주어가 단수로 취급되므로 동사에 s를 붙여야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>However he tried hard, he failed.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ However hard he tried, he failed.\u003c/div>\u003cdiv class=\"g-why\">however 뒤에는 형용사나 부사가 바로 와야 '아무리 ~해도'의 뜻이 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>However hard he tried, but he failed.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ However hard he tried, he failed.\u003c/div>\u003cdiv class=\"g-why\">however가 이끄는 양보 부사절이 이미 있으므로 접속사 but을 함께 쓰지 않아요.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"자주 나오는 실수 하나 볼게요. whoever가 주어로 쓰이면 단수로 취급하기 때문에 동사에 s를 붙여야 합니다. 그래서 Whoever come first가 아니라 Whoever comes first라고 써야 맞아요.","hl":"mk-0"},{"n":17,"text":"두 번째 실수는 어순이에요. however 뒤에는 형용사나 부사가 바로 와야 합니다. 그래서 he tried hard가 아니라 hard he tried 순서로 써야 '아무리 열심히 노력해도'라는 뜻이 된답니다.","hl":"mk-1"},{"n":18,"text":"마지막으로 접속사 but을 같이 쓰는 실수예요. however가 이끄는 양보 부사절 하나로 두 문장이 이미 연결되어 있기 때문에 but을 또 쓸 필요가 없습니다. 뒤 문장은 그냥 he failed로 끝내 주세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv er가 '무엇을 결정하든'이라는 양보의 뜻을 담고 있죠. no matter what으로 바꿔 써도 똑같은 뜻이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">However hard he tried, but he failed.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">However hard he tried, he failed.\u003c/span>\u003cdiv class=\"g-exp\">however가 이끄는 양보 부사절이 이미 문장을 연결하고 있으므로 but을 쓰지 않아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"세 번째 문제는 틀린 부분을 고치는 문제예요. However hard he tried, but he failed. 어색한 부분이 어디인지 잠시 멈추고 찾아 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 but을 빼고 However hard he tried, he failed.라고 쓰는 거예요. however가 이끄는 양보 부사절이 이미 두 문장을 연결해 주고 있으니까 but을 또 쓸 필요가 없답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">comes / first / whoever / will / a prize / get\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Whoever comes first will get a prize.\u003c/span>\u003cdiv class=\"g-exp\">whoever가 이끄는 절이 주어이고, comes first가 그 절의 동사부가 돼요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"네 번째 문제는 단어 배열이에요. comes, first, whoever, will, a prize, get을 알맞은 순서로 놓아야 합니다. 잠시 멈추고 직접 배열해 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 Whoever comes first will get a prize.예요. whoever가 이끄는 절이 문장 전체의 주어가 되고, comes first가 그 안의 동사부 역할을 해요. 그리고 뒤에 will get a prize가 와서 전체 문장이 완성된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">No matter ____ you go, I will find you.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>who\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>what\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>where\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>how\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">where\u003c/span>\u003cdiv class=\"g-exp\">'어디를 가든'이라는 뜻이므로 장소를 나타내는 where가 필요해요. wherever you go로 바꿔 쓸 수 있어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다섯 번째 문제도 빈칸에 알맞은 말을 고르는 문제예요. No matter ... you go, I will find you. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 세 번째 보기인 where예요. '어디를 가든'이라는 뜻이니까 장소를 나타내는 where가 들어가야 하죠. 이 문장은 wherever you go로 바꿔 써도 같은 뜻이 된답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 however를 사용하여 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">아무리 피곤해도 나는 숙제를 끝낼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">However tired I am, I will finish my homework.\u003c/span>\u003cdiv class=\"g-exp\">however 뒤에 형용사 tired를 두고 '아무리 ~해도'의 양보 부사절을 만들어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"마지막 문제는 영작이에요. 아무리 피곤해도 나는 숙제를 끝낼 것이다. however를 사용해서 영어로 만들어 보세요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 However tired I am, I will finish my homework.예요. however 바로 뒤에 형용사 tired를 놓아서 '아무리 피곤해도'라는 양보의 뜻을 만들었어요. 이 순서만 지키면 어떤 형용사든 자유롭게 쓸 수 있답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 078 복합관계사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>복합관계대명사 \u003cb class=\"key\">whoever\u003c/b>, \u003cb class=\"key\">whatever\u003c/b>, \u003cb class=\"key\">whichever\u003c/b>는 명사절과 양보 부사절을 이끌어요.\u003c/li>\u003cli>복합관계부사 \u003cb class=\"key\">whenever\u003c/b>, \u003cb class=\"key\">wherever\u003c/b>, \u003cb class=\"key\">however\u003c/b>는 부사절을 이끌고, however 뒤에는 \u003cb class=\"key\">형용사나 부사\u003c/b>가 바로 와요.\u003c/li>\u003cli>복합관계사는 \u003cb class=\"key\">no matter + 의문사\u003c/b>로 뜻이 같게 바꿔 쓸 수 있어요.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘 배운 내용을 정리해 볼게요. whoever, whatever, whichever는 명사절과 양보 부사절을 이끄는 복합관계대명사였습니다. whenever, wherever, however는 부사절을 이끄는 복합관계부사이고, however 뒤에는 형용사나 부사가 바로 온다는 점이 중요해요. 그리고 이 표현들은 모두 no matter에 의문사를 붙인 형태로 바꿔 쓸 수 있답니다. 오늘 배운 예문들을 소리 내어 몇 번씩 읽어 보면서 익혀 보세요. 수고 많았어요, 다음 시간에 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
