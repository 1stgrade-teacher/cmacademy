}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 95 주의해야 할 주요 부사","title":"Unit 095 주의해야 할 주요 부사 — 헷갈리는 부사 완전 정복","audioDir":"문법_Unit_095_주의해야_할_주요_부사_Chapter_13_품사_Unit_95_주의해야_할_주요_부사_audio","preview":false,"count":44,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 13 품사 | Unit 95 주의해야 할 주요 부사\u003c/div>\u003ch1>Unit 095 주의해야 할 주요 부사 — 헷갈리는 부사 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>비슷하게 생겼지만 뜻과 쓰임이 다른 주요 부사를 예문으로 구분해 실제 문장에 정확히 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 헷갈리기 쉬운 부사들을 확실하게 정리해 볼 거예요. already, yet, still처럼 비슷해 보이지만 쓰임이 다른 부사부터, hard와 hardly처럼 모양은 닮았지만 뜻이 전혀 다른 부사까지 함께 살펴볼게요. 예문을 하나씩 읽으면서 어떤 상황에서 어떤 부사를 쓰는지 감을 잡아 봅시다. 오늘 수업이 끝나면 여러분은 시험에 자주 나오는 부사 함정을 스스로 피할 수 있게 될 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">already, yet, still — 시점을 나타내는 부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">already\u003c/b>는 '이미'라는 뜻으로 이미 완료된 일에 씁니다. \u003cb class=\"key\">yet\u003c/b>은 '아직'이라는 뜻으로 주로 부정문과 의문문 끝에 쓰입니다. \u003cb class=\"key\">still\u003c/b>은 '여전히'라는 뜻으로 어떤 상태가 계속되고 있음을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">have + already + p.p. / have not + p.p. + yet / still + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She has \u003cspan class=\"fx\">already\u003c/span> finished it.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 이미 그것을 끝냈다.\u003c/div>\u003cdiv class=\"g-note\">현재완료에서 already는 have와 과거분사 사이에 놓여 완료된 일을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I haven't finished my homework \u003cspan class=\"fx\">yet\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 아직 숙제를 끝내지 못했다.\u003c/div>\u003cdiv class=\"g-note\">부정문에서 yet은 문장 끝에 놓여 '아직'이라는 뜻을 더합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She is \u003cspan class=\"fx\">still\u003c/span> sleeping.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 여전히 자고 있다.\u003c/div>\u003cdiv class=\"g-note\">still은 be동사 뒤에 놓여 상태가 계속됨을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">yet\u003c/b>은 부정문·의문문 끝에, \u003cb class=\"key\">already\u003c/b>는 긍정문 가운데에 온다는 자리 차이를 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 시점을 나타내는 부사 세 친구를 볼게요. already는 '이미'라는 뜻으로 이미 끝난 일을 말할 때 써요. yet은 '아직'이라는 뜻으로 주로 부정문과 의문문에서 문장 끝에 놓입니다. still은 '여전히'라는 뜻으로 어떤 상태가 계속되고 있다는 걸 보여 줘요. 세 부사의 뜻과 자리를 함께 기억해 두세요.","hl":"rule"},{"n":3,"text":"She has already finished it. 이 문장은 '그녀는 이미 그것을 끝냈다'라는 뜻이에요. 현재완료 문장에서 already가 have와 과거분사 사이에 들어가서 이미 끝난 일을 강조하고 있죠.","hl":"ex-0"},{"n":4,"text":"I haven't finished my homework yet. 이 문장은 '나는 아직 숙제를 끝내지 못했다'라는 뜻이에요. 부정문에서 yet은 문장 맨 끝에 놓여서 '아직'이라는 의미를 더해 준답니다.","hl":"ex-1"},{"n":5,"text":"She is still sleeping. 이 문장은 '그녀는 여전히 자고 있다'라는 뜻이에요. still이 be동사 뒤에 놓이면서 그 상태가 계속되고 있다는 걸 보여 주고 있죠.","hl":"ex-2"},{"n":6,"text":"yet은 부정문이나 의문문 끝에 오고, already는 긍정문 가운데에 온다는 자리 차이를 꼭 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">too / either, ago / before — 짝으로 익히는 부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">too\u003c/b>는 '~도'라는 뜻으로 긍정문 끝에 쓰고, \u003cb class=\"key\">either\u003c/b>는 부정문 끝에 씁니다. \u003cb class=\"key\">ago\u003c/b>는 '~전에'로 과거 시제와 함께 쓰고, \u003cb class=\"key\">before\u003c/b>는 '이전에'라는 뜻으로 현재완료와 함께 쓰는 경우가 많습니다.\u003cdiv>\u003cspan class=\"g-formula\">긍정문 + too / 부정문 + either / 시간 표현 + ago (과거) / before (현재완료)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He can swim, and I can swim, \u003cspan class=\"fx\">too\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 수영할 수 있고, 나도 수영할 수 있다.\u003c/div>\u003cdiv class=\"g-note\">긍정문에서 '~도'는 too로 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I don't like this food, \u003cspan class=\"fx\">either\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 이 음식도 좋아하지 않는다.\u003c/div>\u003cdiv class=\"g-note\">부정문에서 '~도'는 either로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I met him two years \u003cspan class=\"fx\">ago\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그를 2년 전에 만났다.\u003c/div>\u003cdiv class=\"g-note\">ago는 과거 시제와 함께 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I have seen this movie \u003cspan class=\"fx\">before\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 이 영화를 전에 본 적이 있다.\u003c/div>\u003cdiv class=\"g-note\">before는 '이전에'라는 뜻으로 현재완료와 잘 어울립니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">ago\u003c/b>는 과거 시제와만, \u003cb class=\"key\">before\u003c/b>는 현재완료와 함께 쓰인다는 짝을 기억하세요.\u003c/div>","segs":[{"n":7,"text":"이번에는 짝을 이루는 부사들을 볼게요. too는 '나도 그래'처럼 긍정문 끝에 붙고, either는 부정문 끝에 붙어서 '나도 안 그래'를 만들어 줍니다. ago는 '몇 년 전에'처럼 과거의 시점을 말할 때 쓰고, before는 '이전에'라는 뜻으로 현재완료와 잘 어울려요. 긍정이냐 부정이냐, 과거냐 현재완료냐를 기준으로 골라 쓰면 된답니다.","hl":"rule"},{"n":8,"text":"He can swim, and I can swim, too. 이 문장은 '그는 수영할 수 있고, 나도 수영할 수 있다'라는 뜻이에요. 이렇게 긍정문에서 '나도'라고 말할 때는 문장 끝에 too를 붙여 줍니다.","hl":"ex-0"},{"n":9,"text":"I don't like this food, either. 이 문장은 '나는 이 음식도 좋아하지 않는다'라는 뜻이에요. 부정문에서 '나도 안 그래'라고 말할 때는 too가 아니라 either를 문장 끝에 쓴다는 점, 꼭 기억하세요.","hl":"ex-1"},{"n":10,"text":"I met him two years ago. 이 문장은 '나는 그를 이 년 전에 만났다'라는 뜻이에요. ago는 '얼마 전에'라는 뜻으로 과거 시제 문장에서 쓰인답니다.","hl":"ex-2"},{"n":11,"text":"I have seen this movie before. 이 문장은 '나는 이 영화를 전에 본 적이 있다'라는 뜻이에요. before는 '이전에'라는 뜻으로 현재완료 문장에서 경험을 말할 때 자주 쓰입니다.","hl":"ex-3"},{"n":12,"text":"ago는 과거 시제와만 어울리고, before는 현재완료와 함께 쓰인다는 짝을 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">hard / hardly, late / lately — 모양은 닮았지만 뜻은 반대\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">hard\u003c/b>는 '열심히', \u003cb class=\"key\">hardly\u003c/b>는 '거의 ~않다'라는 뜻으로 의미가 완전히 다릅니다. \u003cb class=\"key\">late\u003c/b>는 '늦게', \u003cb class=\"key\">lately\u003c/b>는 '최근에'라는 뜻이며, near와 nearly, most와 almost, high와 highly, deep과 deeply도 형태가 비슷할 뿐 뜻은 다릅니다.\u003cdiv>\u003cspan class=\"g-formula\">hard(열심히) ≠ hardly(거의 ~않다) / late(늦게) ≠ lately(최근에)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He worked \u003cspan class=\"fx\">hard\u003c/span> all day.\u003c/div>\u003cdiv class=\"g-ko\">그는 하루 종일 열심히 일했다.\u003c/div>\u003cdiv class=\"g-note\">hard는 '열심히'라는 뜻의 부사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I can \u003cspan class=\"fx\">hardly\u003c/span> hear you.\u003c/div>\u003cdiv class=\"g-ko\">나는 네 말이 거의 들리지 않는다.\u003c/div>\u003cdiv class=\"g-note\">hardly는 '열심히'가 아니라 '거의 ~않다'입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He was \u003cspan class=\"fx\">late\u003c/span> for school this morning.\u003c/div>\u003cdiv class=\"g-ko\">그는 오늘 아침 학교에 늦었다.\u003c/div>\u003cdiv class=\"g-note\">late는 '늦게'라는 뜻입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I have been very busy \u003cspan class=\"fx\">lately\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 최근에 매우 바빴다.\u003c/div>\u003cdiv class=\"g-note\">lately는 '최근에'라는 뜻입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">most\u003c/b>는 '대부분의'로 명사 앞에, \u003cb class=\"key\">almost\u003c/b>는 '거의'로 형용사·부사·동사 앞에 씁니다. \u003cb class=\"key\">near\u003c/b>는 '가까이', \u003cb class=\"key\">nearly\u003c/b>는 '거의'라는 차이도 함께 기억하세요.\u003c/div>","segs":[{"n":13,"text":"여기서부터가 시험에 정말 자주 나오는 부분이에요. hard는 '열심히'라는 뜻이고, 뒤에 ly가 붙은 hardly는 '열심히'가 아니라 '거의 그렇지 않다'라는 뜻이 됩니다. late는 '늦게', lately는 '최근에'라는 뜻으로 완전히 달라지죠. near와 nearly, most와 almost, high와 highly, deep과 deeply도 같은 함정이 숨어 있으니 하나씩 짝으로 외워 두세요.","hl":"rule"},{"n":14,"text":"He worked hard all day. 이 문장은 '그는 하루 종일 열심히 일했다'라는 뜻이에요. 여기서 hard는 '열심히'라는 뜻으로 동사 worked를 꾸며 주고 있죠.","hl":"ex-0"},{"n":15,"text":"I can hardly hear you. 이 문장은 '나는 네 말이 거의 들리지 않는다'라는 뜻이에요. hardly를 '열심히'라고 해석하면 뜻이 완전히 틀어지니까, '거의 그렇지 않다'로 기억해 두세요.","hl":"ex-1"},{"n":16,"text":"He was late for school this morning. 이 문장은 '그는 오늘 아침 학교에 늦었다'라는 뜻이에요. late는 '늦게'라는 뜻으로, 최근이라는 의미는 전혀 없다는 걸 기억하세요.","hl":"ex-2"},{"n":17,"text":"I have been very busy lately. 이 문장은 '나는 최근에 매우 바빴다'라는 뜻이에요. 이렇게 lately는 '최근에'라는 뜻으로, 늦게라는 뜻의 late와 꼭 구분해서 써야 합니다.","hl":"ex-3"},{"n":18,"text":"most는 '대부분의'라는 뜻으로 명사 앞에 서고, almost는 '거의'라는 뜻으로 형용사나 부사, 동사 앞에 온다는 차이도 함께 기억해 두세요. near는 '가까이', nearly는 '거의'라는 것도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">even — 비교급을 강조하는 부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">even\u003c/b>은 '~조차'라는 뜻으로도 쓰이지만, \u003cb class=\"key\">비교급\u003c/b> 앞에서는 '훨씬, 더욱'이라는 의미로 비교급을 강조합니다. much, far, a lot, still도 비교급을 강조하는 역할을 합니다.\u003cdiv>\u003cspan class=\"g-formula\">even + 비교급 + than\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This book is \u003cspan class=\"fx\">even more interesting\u003c/span> than the movie.\u003c/div>\u003cdiv class=\"g-ko\">이 책은 그 영화보다 훨씬 더 재미있다.\u003c/div>\u003cdiv class=\"g-note\">even이 비교급 more interesting을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">It is \u003cspan class=\"fx\">even colder\u003c/span> today.\u003c/div>\u003cdiv class=\"g-ko\">오늘은 훨씬 더 춥다.\u003c/div>\u003cdiv class=\"g-note\">even은 비교급 colder 앞에서 '훨씬'을 뜻합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비교급 강조는 \u003cb class=\"key\">even\u003c/b> 외에도 \u003cb class=\"key\">much\u003c/b>, \u003cb class=\"key\">far\u003c/b>, \u003cb class=\"key\">a lot\u003c/b>, \u003cb class=\"key\">still\u003c/b>로 할 수 있고, \u003cb class=\"key\">very\u003c/b>는 비교급 앞에 쓰지 않습니다.\u003c/div>","segs":[{"n":19,"text":"마지막으로 even을 볼게요. even은 '~조차'라는 뜻으로도 자주 쓰이지만, 비교급 앞에 오면 '훨씬'이라는 뜻으로 비교를 강하게 밀어 줍니다. much나 far, a lot, still도 똑같이 비교급을 강조하는 부사예요. 다만 very는 비교급 앞에 쓸 수 없다는 점, 꼭 주의하세요.","hl":"rule"},{"n":20,"text":"This book is even more interesting than the movie. 이 문장은 '이 책은 그 영화보다 훨씬 더 재미있다'라는 뜻이에요. 이렇게 even이 비교급 more interesting 앞에 와서 '훨씬 더'라는 의미를 더해 주고 있죠.","hl":"ex-0"},{"n":21,"text":"It is even colder today. 이 문장은 '오늘은 훨씬 더 춥다'라는 뜻이에요. 비교급 colder 앞에 even이 붙어서 추위가 더 심해졌다는 걸 강조하고 있답니다.","hl":"ex-1"},{"n":22,"text":"비교급을 강조할 때는 even 말고도 much나 far, a lot, still을 쓸 수 있어요. 그런데 very는 비교급 앞에 쓸 수 없으니 이 점은 꼭 주의하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He worked hardly all day.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He worked hard all day.\u003c/div>\u003cdiv class=\"g-why\">hardly는 '거의 ~않다'라는 뜻이라 '열심히'를 나타낼 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I don't like coffee, too.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I don't like coffee, either.\u003c/div>\u003cdiv class=\"g-why\">부정문에서 '~도'는 too가 아니라 either로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I have met him three years ago.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I met him three years ago.\u003c/div>\u003cdiv class=\"g-why\">ago는 과거 시제와 함께 쓰므로 현재완료와는 함께 쓸 수 없습니다.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"hardly를 '열심히'라고 생각해서 쓰면 뜻이 정반대가 되어 버려요. '열심히 일했다'라고 말하고 싶다면 뒤에 ly가 붙지 않은 hard를 써야 합니다. 그래서 He worked hard all day가 맞는 문장이에요.","hl":"mk-0"},{"n":24,"text":"too는 긍정문에서 '나도 그래'라고 말할 때 쓰는 부사예요. 부정문에서 '나도 안 그래'라고 말할 때는 either를 문장 끝에 써야 합니다. 그래서 I don't like coffee, either가 맞아요.","hl":"mk-1"},{"n":25,"text":"ago는 '몇 년 전에'처럼 과거의 한 시점을 가리키는 표현이에요. 그래서 현재완료인 have met과는 함께 쓸 수 없고, 과거 시제 met으로 써야 합니다. 만약 현재완료를 쓰고 싶다면 before를 쓰면 된답니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She has ____ finished her report, so she can take a rest now.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>already\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>yet\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>still\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>ago\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">already\u003c/span>\u003cdiv class=\"g-exp\">이미 보고서를 끝낸 상황이므로 '이미'라는 뜻의 already가 알맞습니다. yet은 부정문·의문문에, ago는 과거 시제와 함께 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"자, 첫 번째 문제입니다. She has, 빈칸, finished her report, so she can take a rest now. 빈칸에 들어갈 말을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 첫 번째 보기인 already예요. 이미 보고서를 끝내서 쉴 수 있다는 상황이니까 '이미'라는 뜻의 already가 딱 맞습니다. yet은 부정문이나 의문문에 쓰고, ago는 과거 시제와 함께 쓴다는 점도 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I don't enjoy horror movies, and my brother doesn't, ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>too\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>either\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>also\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>still\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">either\u003c/span>\u003cdiv class=\"g-exp\">앞 문장이 부정문이므로 '~도'는 either로 받습니다. too는 긍정문에서 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"두 번째 문제입니다. I don't enjoy horror movies, and my brother doesn't, 빈칸. 빈칸에 들어갈 말을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 두 번째 보기인 either예요. 앞부분이 부정문이니까 '나도 안 그래'를 뜻하는 either를 문장 끝에 써야 합니다. too는 긍정문에서만 쓴다는 점도 함께 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 말을 알맞은 형태로 빈칸에 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I can ____ hear what you are saying. (hard)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hardly\u003c/span>\u003cdiv class=\"g-exp\">'거의 들리지 않는다'라는 뜻이므로 hardly를 씁니다. hard는 '열심히'라는 뜻이라 여기에는 맞지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"세 번째 문제입니다. I can, 빈칸, hear what you are saying. 괄호 안의 hard를 알맞은 형태로 바꿔 빈칸에 넣어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 hardly예요. '네가 하는 말이 거의 들리지 않는다'라는 뜻이니까 '거의 그렇지 않다'를 뜻하는 hardly를 씁니다. hard를 그대로 쓰면 '열심히 듣는다'가 되어 뜻이 달라지니 주의하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">Almost students in my class enjoy playing soccer.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Most students in my class enjoy playing soccer.\u003c/span>\u003cdiv class=\"g-exp\">'대부분의 학생들'은 명사 앞에 most를 써서 most students로 표현합니다. almost는 '거의'라는 뜻으로 명사를 꾸미지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"네 번째 문제입니다. Almost students in my class enjoy playing soccer. 이 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 Almost students를 Most students로 고치는 거예요. '대부분의 학생들'이라고 할 때는 명사 앞에 most를 씁니다. almost는 '거의'라는 뜻으로 형용사나 부사, 동사 앞에 오는 부사라서 명사를 꾸밀 수 없답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">still / is / she / waiting / for the bus\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She is still waiting for the bus.\u003c/span>\u003cdiv class=\"g-exp\">still은 be동사 뒤, 본동사 앞에 놓습니다. '그녀는 여전히 버스를 기다리고 있다'라는 뜻입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"다섯 번째 문제입니다. still, is, she, waiting, for the bus, 이 단어들을 모두 사용해서 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 She is still waiting for the bus예요. still은 be동사 뒤에 놓여서 '여전히'라는 뜻을 더합니다. 그래서 '그녀는 여전히 버스를 기다리고 있다'라는 문장이 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">even을 사용하여 다음 우리말을 영어로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">이 책은 그 영화보다 훨씬 더 재미있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">This book is even more interesting than the movie.\u003c/span>\u003cdiv class=\"g-exp\">even은 비교급 앞에 놓여 '훨씬'을 뜻합니다. 비교급 more interesting 앞에 even을 넣어 주세요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"마지막 문제입니다. '이 책은 그 영화보다 훨씬 더 재미있다'를 even을 사용해서 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":6},{"n":43,"text":"정답은 This book is even more interesting than the movie예요. even이 비교급 more interesting 앞에 와서 '훨씬 더'라는 의미를 더해 줍니다. 비교급을 강조할 때 very는 쓰지 않는다는 점도 꼭 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 13 품사 | Unit 95 주의해야 할 주요 부사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">already\u003c/b>는 '이미', \u003cb class=\"key\">yet\u003c/b>은 '아직'으로 부정문·의문문 끝, \u003cb class=\"key\">still\u003c/b>은 '여전히'로 상태가 계속됨을 나타냅니다.\u003c/li>\u003cli>긍정문의 '~도'는 \u003cb class=\"key\">too\u003c/b>, 부정문의 '~도'는 \u003cb class=\"key\">either\u003c/b>이며, \u003cb class=\"key\">ago\u003c/b>는 과거 시제, \u003cb class=\"key\">before\u003c/b>는 현재완료와 어울립니다.\u003c/li>\u003cli>\u003cb class=\"key\">hard\u003c/b>는 '열심히', \u003cb class=\"key\">hardly\u003c/b>는 '거의 ~않다'이고 \u003cb class=\"key\">late\u003c/b>는 '늦게', \u003cb class=\"key\">lately\u003c/b>는 '최근에'로 뜻이 완전히 다릅니다.\u003c/li>\u003cli>\u003cb class=\"key\">even\u003c/b>은 비교급 앞에서 '훨씬'을 뜻하며, \u003cb class=\"key\">much\u003c/b>, \u003cb class=\"key\">far\u003c/b>, \u003cb class=\"key\">a lot\u003c/b>, \u003cb class=\"key\">still\u003c/b>도 비교급을 강조합니다.\u003c/li>\u003c/ul>","segs":[{"n":44,"text":"오늘은 헷갈리기 쉬운 주요 부사들을 정리했어요. already와 yet, still은 시점에 따라, too와 either는 긍정과 부정에 따라 골라 쓴다는 점을 기억하세요. hard와 hardly, late와 lately처럼 모양은 비슷해도 뜻이 반대인 부사들은 꼭 짝으로 외워 두시고요. even이 비교급 앞에서 '훨씬'이라는 뜻으로 쓰인다는 것까지 챙겼으니, 오늘 배운 내용을 예문과 함께 다시 한 번 소리 내어 읽어 보면 오래 기억에 남을 거예요. 수고했어요, 여러분!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
