lecturePlayer(document.getElementById("app"),{"brand":"Unit 90 부정대명사 2 (each, all, both 등)","title":"each·both·all, 뜻은 쉬운데 수 일치에서 무너진다!","audioDir":"문법_Unit_090_부정대명사_2_(each,_all,_both_등)_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 090 부정대명사 2 (each, all, both 등)\u003c/div>\u003ch1>each·both·all, 뜻은 쉬운데 수 일치에서 무너진다!\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>each, both, all, either, neither, none의 의미를 익히고 뒤에 오는 명사와 동사의 수를 정확히 일치시킬 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 부정대명사 두 번째 시간이에요. each, all, both, either, neither, none처럼 '각각, 모두, 둘 다'를 표현하는 말들을 배울 거예요. 뜻은 그렇게 어렵지 않은데, 시험에서 점수를 잃는 이유는 딱 하나, 동사의 수를 맞추지 못하기 때문이에요. 오늘 예문 세 개만 확실히 잡으면 이 단원 문제는 거의 다 맞힐 수 있으니까 끝까지 함께 가 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">each와 every는 단수 취급\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">each는 '각각'이라는 뜻으로 \u003cb class=\"key\">각각의 사람이나 사물\u003c/b>을 하나씩 떠올리게 하고, every는 '모든'이라는 뜻으로 \u003cb class=\"key\">뒤에 단수 명사\u003c/b>가 옵니다. 두 표현 모두 \u003cb class=\"key\">단수 취급\u003c/b>하기 때문에 뒤에 오는 동사도 단수형을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">each / every + 단수 명사 + 단수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Each student has\u003c/span> a locker.\u003c/div>\u003cdiv class=\"g-ko\">각 학생은 사물함이 하나씩 있다.\u003c/div>\u003cdiv class=\"g-note\">each 뒤에는 단수 명사 student, 동사도 단수 has를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Every classroom has\u003c/span> a whiteboard.\u003c/div>\u003cdiv class=\"g-ko\">모든 교실에는 화이트보드가 있다.\u003c/div>\u003cdiv class=\"g-note\">every 뒤에도 단수 명사와 단수 동사가 옵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>every는 \u003cb class=\"key\">뒤에 단수 명사\u003c/b>만 오고 every of라는 형태로는 쓰지 않는다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"첫 번째는 each와 every예요. each는 각각, 하나하나를 콕 집어 말할 때 쓰고, every는 모든이라는 뜻으로 전체를 두루 말할 때 쓰죠. 중요한 건 둘 다 뒤에 단수 명사가 오고, 동사도 단수형을 쓴다는 점이에요. 그래서 each student처럼 명사에 s를 붙이지 않고, 동사도 has처럼 단수형으로 맞춰 줍니다. 이 부분이 시험에서 정말 자주 나오니까 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. Each student has a locker. 각 학생은 사물함이 하나씩 있다는 뜻이에요. each 뒤에 student라는 단수 명사가 오고, 동사도 has로 단수형이 쓰였죠. 여기서 students나 have를 쓰면 바로 틀린 문장이 됩니다.","hl":"ex-0"},{"n":4,"text":"보충 예문 하나 더 볼게요. Every classroom has a whiteboard. 모든 교실에는 화이트보드가 있다는 뜻이에요. every 뒤에 classroom이라는 단수 명사가 오고 동사도 has가 왔죠. every도 each와 똑같이 단수 취급이라는 것, 잊지 마세요.","hl":"ex-1"},{"n":5,"text":"한 가지만 더 짚고 갈게요. every는 뒤에 단수 명사를 그대로 데리고 오고, every of라는 말은 쓰지 않아요. every of the students 같은 표현은 틀린 거니까 주의하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">both는 복수 취급\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">both는 '\u003cb class=\"key\">둘 다\u003c/b>'라는 뜻으로 \u003cb class=\"key\">두 사람이나 두 사물\u003c/b>을 함께 가리킵니다. 둘을 하나로 묶지 않고 복수로 보기 때문에 \u003cb class=\"key\">복수 취급\u003c/b>해서 동사에 are나 were 같은 복수형을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">both (of + 복수 명사) + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Both of them are\u003c/span> teachers.\u003c/div>\u003cdiv class=\"g-ko\">그들 둘 다 교사이다.\u003c/div>\u003cdiv class=\"g-note\">both는 복수 취급이라 동사는 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Both of my sisters like\u003c/span> music.\u003c/div>\u003cdiv class=\"g-ko\">내 여동생 둘 다 음악을 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">both of 뒤에 복수 명사가 와서 동사도 복수형 like를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>both 뒤에 명사가 바로 오면 \u003cb class=\"key\">복수 명사\u003c/b>를 쓰고, both of 뒤에는 \u003cb class=\"key\">them\u003c/b> 같은 대명사나 the, my가 붙은 명사가 옵니다.\u003c/div>","segs":[{"n":6,"text":"두 번째는 both예요. both는 둘 다라는 뜻으로, 두 사람이나 두 사물을 함께 가리키는 말이에요. 여기서 핵심은 both를 복수로 본다는 거예요. 둘을 하나로 묶지 않고 두 개로 세기 때문에 동사 자리에는 are나 were 같은 복수형이 와야 합니다. 그래서 both of them are teachers처럼 써야 하고, is를 쓰면 틀린 문장이 돼요.","hl":"rule"},{"n":7,"text":"두 번째 예문입니다. Both of them are teachers. 그들 둘 다 교사라는 뜻이에요. both가 들어갔으니 동사는 당연히 are, 복수형이 왔죠. 그리고 뒤에 오는 teachers도 복수형으로 맞춰 줍니다. 이 문장에서 is를 쓰면 바로 감점이에요.","hl":"ex-0"},{"n":8,"text":"Both of my sisters like music. 내 여동생 둘 다 음악을 좋아한다.","hl":"ex-1"},{"n":9,"text":"참고로 both 뒤에 명사가 바로 올 때는 복수 명사를 써야 해요. 그리고 both of 뒤에는 them 같은 대명사나 the, my가 붙은 명사가 온다는 것도 같이 기억해 두면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">either, neither, none의 의미\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">either는 '\u003cb class=\"key\">둘 중 하나\u003c/b>', neither는 '\u003cb class=\"key\">둘 중 어느 쪽도 아닌\u003c/b>', none은 '\u003cb class=\"key\">아무도 ~않다\u003c/b>'라는 뜻입니다. either와 neither는 둘 중 하나를 다루는 말이라 \u003cb class=\"key\">단수 취급\u003c/b>해서 단수 동사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">either / neither of + 복수 명사 + 단수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Neither of them is\u003c/span> at home.\u003c/div>\u003cdiv class=\"g-ko\">그들 중 어느 쪽도 집에 없다.\u003c/div>\u003cdiv class=\"g-note\">neither는 단수 취급이라 동사는 is를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Either of the two answers is\u003c/span> fine.\u003c/div>\u003cdiv class=\"g-ko\">두 답 중 어느 하나도 괜찮다.\u003c/div>\u003cdiv class=\"g-note\">either도 단수 취급이라 동사는 is를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>either와 neither는 \u003cb class=\"key\">단수 동사\u003c/b>와 짝을 이룬다는 점, 헷갈리면 '둘 중 하나'라는 뜻을 떠올리세요.\u003c/div>","segs":[{"n":10,"text":"세 번째는 either, neither, none이에요. either는 둘 중 하나, neither는 둘 중 어느 쪽도 아닌, none은 아무도 안 된다는 뜻이죠. 여기서 either와 neither는 하나를 다루는 말이라 단수 취급을 해요. 그래서 neither of them is처럼 동사를 단수로 씁니다. 둘 중 하나라는 그림을 머릿속에 그려 두면 자연스럽게 단수가 떠오를 거예요.","hl":"rule"},{"n":11,"text":"보충 예문입니다. Neither of them is at home. 그들 중 어느 쪽도 집에 없다는 뜻이에요. neither는 둘 중 어느 쪽도 아니라는 의미로 단수 취급하기 때문에 동사가 is로 왔습니다. are를 쓰면 틀려요.","hl":"ex-0"},{"n":12,"text":"Either of the two answers is fine. 두 답 중 어느 하나도 괜찮다.","hl":"ex-1"},{"n":13,"text":"정리하면 either와 neither는 항상 단수 동사와 짝을 이뤄요. 헷갈릴 때는 둘 중 하나를 다루는 말이라는 뜻을 먼저 떠올리면 훨씬 쉽게 판단할 수 있습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">all of, none of 뒤 동사는 뒤 명사에 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">all은 '\u003cb class=\"key\">모두\u003c/b>'라는 뜻이고, all of나 none of 뒤에 오는 동사는 \u003cb class=\"key\">뒤에 오는 명사\u003c/b>에 맞춥니다. 셀 수 없는 명사가 오면 \u003cb class=\"key\">단수 동사\u003c/b>, 복수 명사가 오면 \u003cb class=\"key\">복수 동사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">all of / none of + 명사 + (그 명사에 맞춘) 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">All of the water was\u003c/span> gone.\u003c/div>\u003cdiv class=\"g-ko\">물이 모두 없어졌다.\u003c/div>\u003cdiv class=\"g-note\">water는 셀 수 없는 명사라 단수 동사 was를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">All of the students are\u003c/span> here.\u003c/div>\u003cdiv class=\"g-ko\">학생들이 모두 여기 있다.\u003c/div>\u003cdiv class=\"g-note\">students가 복수 명사라 동사도 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">None of the milk is\u003c/span> left.\u003c/div>\u003cdiv class=\"g-ko\">우유가 하나도 남아 있지 않다.\u003c/div>\u003cdiv class=\"g-note\">milk가 셀 수 없는 명사라 none of 뒤에서도 단수 동사 is를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>all of the water처럼 셀 수 없는 명사일 때는 \u003cb class=\"key\">단수 동사\u003c/b>, all of the students처럼 복수일 때는 \u003cb class=\"key\">복수 동사\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":14,"text":"마지막 개념은 all과 none이에요. all은 모두라는 뜻이고, all of나 none of 뒤에 오는 동사는 앞이 아니라 뒤를 봐야 합니다. 바로 뒤에 오는 명사가 셀 수 없는 명사면 단수 동사, 복수 명사면 복수 동사를 쓰는 거죠. 그래서 all of the water was처럼 물은 단수, all of the students are처럼 학생들은 복수가 됩니다. 뒤를 보고 동사를 고른다는 이 원리만 잡으면 끝이에요.","hl":"rule"},{"n":15,"text":"세 번째 자료 예문입니다. All of the water was gone. 물이 모두 없어졌다는 뜻이에요. water는 셀 수 없는 명사라 단수로 보고 동사에 was를 썼습니다. all이 들어갔다고 무조건 복수 동사를 쓰면 안 된다는 걸 보여 주는 문장이에요.","hl":"ex-0"},{"n":16,"text":"All of the students are here. 학생들이 모두 여기 있다.","hl":"ex-1"},{"n":17,"text":"None of the milk is left. 우유가 하나도 남아 있지 않다.","hl":"ex-2"},{"n":18,"text":"여기서 실수하면 정말 억울해요. all이 나왔다고 무조건 복수 동사를 쓰는 게 아니라, 뒤에 오는 명사를 꼭 확인하세요. 물이나 우유처럼 셀 수 없는 명사면 단수 동사, 학생들처럼 여럿이면 복수 동사입니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Each students have a locker.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Each student has a locker.\u003c/div>\u003cdiv class=\"g-why\">each 뒤에는 단수 명사, 동사도 단수형이 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Both of them is teachers.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Both of them are teachers.\u003c/div>\u003cdiv class=\"g-why\">both는 복수 취급이라 동사는 are를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>All of the water were gone.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ All of the water was gone.\u003c/di
