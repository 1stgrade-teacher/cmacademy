}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 86 명사, 관사","title":"명사, 관사 — 셀 수 있는 명사 vs 셀 수 없는 명사, 그리고 a/an·the","audioDir":"문법_Unit_086_명사,_관사_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 086 명사, 관사\u003c/div>\u003ch1>명사, 관사 — 셀 수 있는 명사 vs 셀 수 없는 명사, 그리고 a/an·the\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>가산·불가산 명사를 구분하고, a/an과 the의 쓰임, 관사가 생략되는 경우를 예문으로 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 명사와 관사에 대해 함께 공부해 볼 거예요. 영어 문장을 쓰다 보면 a를 붙일지 the를 붙일지, 아니면 아무것도 붙이지 않을지 헷갈릴 때가 많죠. 오늘은 세 가지만 확실히 잡아 볼게요. 셀 수 있는 명사와 셀 수 없는 명사의 차이, a와 the의 차이, 그리고 관사를 아예 쓰지 않는 경우를 예문으로 차근차근 살펴보겠습니다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">셀 수 있는 명사와 셀 수 없는 명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">셀 수 있는 명사는 \u003cb class=\"key\">단수\u003c/b>와 \u003cb class=\"key\">복수\u003c/b> 형태가 있고, 셀 수 없는 명사는 \u003cb class=\"key\">a/an\u003c/b>을 붙이거나 복수형으로 쓰지 않아요. information, advice, furniture, equipment 같은 단어가 대표적인 셀 수 없는 명사입니다.\u003cdiv>\u003cspan class=\"g-formula\">불가산 명사 + 단수 동사 / some · much · a lot of + 불가산 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She gave me \u003cspan class=\"fx\">some useful advice\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나에게 유용한 조언을 해 주었다.\u003c/div>\u003cdiv class=\"g-note\">advice는 셀 수 없는 명사라서 an advice가 아니라 some advice로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">We bought \u003cspan class=\"fx\">a lot of furniture\u003c/span> for the new office.\u003c/div>\u003cdiv class=\"g-ko\">우리는 새 사무실을 위해 가구를 많이 샀다.\u003c/div>\u003cdiv class=\"g-note\">furniture는 불가산 명사로, furnitures나 a furniture로 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The lab needs \u003cspan class=\"fx\">new equipment\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 실험실은 새 장비가 필요하다.\u003c/div>\u003cdiv class=\"g-note\">equipment도 불가산 명사라서 an equipment라고 쓰지 않습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>셀 수 없는 명사 앞에는 \u003cb class=\"key\">a/an\u003c/b> 대신 \u003cb class=\"key\">some\u003c/b>, \u003cb class=\"key\">much\u003c/b>, \u003cb class=\"key\">a lot of\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":2,"text":"먼저 명사를 두 갈래로 나눠 볼게요. 셀 수 있는 명사는 하나, 둘 하고 셀 수 있어서 단수와 복수 형태가 다 있습니다. 그런데 셀 수 없는 명사는 숫자로 셀 수 없기 때문에 a나 an을 붙이지 않고, 복수형으로도 쓰지 않아요. information, advice, furniture, equipment 같은 단어들이 바로 그런 경우입니다. 이런 단어 앞에는 some이나 much, a lot of 같은 표현을 써 준다고 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. She gave me some useful advice. 그녀는 나에게 유용한 조언을 해 주었다는 뜻이에요. 여기서 advice는 셀 수 없는 명사라서 앞에 an을 붙이지 않고 some을 썼다는 점이 핵심입니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 제가 조금 보충해 봤어요. We bought a lot of furniture for the new office. 우리는 새 사무실을 위해 가구를 많이 샀다는 뜻이죠. furniture도 셀 수 없는 명사라서 furnitures라고 하지 않고 a lot of furniture라고 표현합니다.","hl":"ex-1"},{"n":5,"text":"하나 더 볼게요. The lab needs new equipment. 그 실험실은 새 장비가 필요하다는 뜻이에요. equipment 역시 셀 수 없는 명사라서 앞에 a나 an을 붙이지 않습니다.","hl":"ex-2"},{"n":6,"text":"팁 하나 드릴게요. 셀 수 없는 명사 앞에는 a나 an을 쓰지 않고 some이나 much, a lot of를 써 준다고 기억하시면 됩니다. 시험에서도 이 부분이 자주 함정으로 나와요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">a/an과 the의 차이\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">a/an\u003c/b>은 여러 개 중 \u003cb class=\"key\">불특정한 하나\u003c/b>를 가리키고, \u003cb class=\"key\">the\u003c/b>는 이미 알려진 특정한 것과 세상에 유일한 것에 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">a/an + 불특정 단수 명사 / the + 특정·유일한 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The sun\u003c/span> rises in the east.\u003c/div>\u003cdiv class=\"g-ko\">해는 동쪽에서 뜬다.\u003c/div>\u003cdiv class=\"g-note\">해는 세상에 하나뿐인 대상이라 the를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I saw \u003cspan class=\"fx\">a dog\u003c/span> in the park. The dog was very big.\u003c/div>\u003cdiv class=\"g-ko\">나는 공원에서 개 한 마리를 보았다. 그 개는 매우 컸다.\u003c/div>\u003cdiv class=\"g-note\">처음 언급할 때는 a, 두 번째 언급할 때는 the로 받습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">the\u003c/b>는 앞에서 이미 나온 명사를 다시 가리킬 때도 씁니다.\u003c/div>","segs":[{"n":7,"text":"이번에는 관사 a와 the를 비교해 볼게요. a나 an은 여러 개 가운데 특별히 정해지지 않은 하나를 말할 때 씁니다. 반면에 the는 앞에서 이미 이야기했거나 서로 알고 있는 특정한 것을 가리킬 때 써요. 그리고 해나 달처럼 세상에 하나뿐인 것에도 the를 붙입니다.","hl":"rule"},{"n":8,"text":"자료의 예문 하나 볼게요. The sun rises in the east. 해는 동쪽에서 뜬다는 뜻입니다. 해는 세상에 하나뿐이니까 the sun이라고 하고, 방향인 east 앞에도 the를 붙여요.","hl":"ex-0"},{"n":9,"text":"보충 예문도 하나 들어 볼게요. I saw a dog in the park. The dog was very big. 나는 공원에서 개 한 마리를 보았다, 그 개는 매우 컸다는 뜻이에요. 처음 말할 때는 a dog, 이미 이야기한 그 개를 다시 말할 때는 the dog라고 하는 거죠.","hl":"ex-1"},{"n":10,"text":"여기서 팁 하나 더 드릴게요. 앞에서 한 번 나온 명사를 다시 언급할 때는 the를 붙인다고 기억하면 문장이 훨씬 자연스러워집니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">관사를 쓰지 않는 경우\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">by + 교통수단\u003c/b> 앞에는 관사를 쓰지 않고, \u003cb class=\"key\">go to school\u003c/b>처럼 굳어진 표현과 \u003cb class=\"key\">식사\u003c/b>·운동 이름 앞에도 관사가 없어요.\u003cdiv>\u003cspan class=\"g-formula\">by bus / by car / go to school / go to bed / have breakfast / play tennis\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He goes to school \u003cspan class=\"fx\">by bus\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 버스로 학교에 간다.\u003c/div>\u003cdiv class=\"g-note\">by + 교통수단에는 관사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">plays tennis\u003c/span> every Sunday.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 일요일마다 테니스를 친다.\u003c/div>\u003cdiv class=\"g-note\">운동 이름 앞에는 관사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have breakfast\u003c/span> at seven.\u003c/div>\u003cdiv class=\"g-ko\">나는 일곱 시에 아침을 먹는다.\u003c/div>\u003cdiv class=\"g-note\">식사 이름 앞에는 관사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">식사\u003c/b> 이름과 \u003cb class=\"key\">운동\u003c/b> 이름 앞에는 a나 the를 붙이지 않습니다.\u003c/div>","segs":[{"n":11,"text":"마지막으로 관사를 아예 쓰지 않는 경우를 정리해 볼게요. by bus나 by car처럼 교통수단 앞에 by가 오면 관사를 쓰지 않습니다. 학교에 가다, 잠자리에 들다는 go to school, go to bed처럼 굳어진 표현도 관사가 없어요. 그리고 아침, 점심, 저녁 같은 식사 이름과 tennis, soccer 같은 운동 이름 앞에도 관사를 붙이지 않습니다.","hl":"rule"},{"n":12,"text":"세 번째 예문입니다. He goes to school by bus. 그는 버스로 학교에 간다는 뜻이에요. by bus처럼 교통수단 앞에는 the를 붙이지 않는다는 점을 꼭 기억하세요.","hl":"ex-0"},{"n":13,"text":"보충 예문 하나 더 볼게요. She plays tennis every Sunday. 그녀는 일요일마다 테니스를 친다는 뜻입니다. tennis 같은 운동 이름 앞에는 a나 the를 붙이지 않아요.","hl":"ex-1"},{"n":14,"text":"이 문장도 함께 볼게요. I have breakfast at seven. 나는 일곱 시에 아침을 먹는다는 뜻이에요. breakfast처럼 식사 이름 앞에도 관사를 붙이지 않습니다.","hl":"ex-2"},{"n":15,"text":"정리하자면 식사 이름과 운동 이름 앞에는 a나 the를 붙이지 않는다고 기억해 두세요. 또 go to bed처럼 잠자리에 드는 표현에도 관사가 들어가지 않습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She gave me an advice.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She gave me some advice.\u003c/div>\u003cdiv class=\"g-why\">advice는 셀 수 없는 명사라서 a/an을 붙일 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He goes to school by the bus.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He goes to school by bus.\u003c/div>\u003cdiv class=\"g-why\">by + 교통수단에는 관사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I bought a new furniture yesterday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I bought some new furniture yesterday.\u003c/div>\u003cdiv class=\"g-why\">furniture는 불가산 명사라서 a를 붙이거나 복수형으로 쓰지 않습니다.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"자주 나오는 실수 하나 볼게요. She gave me an advice라고 쓰면 틀립니다. advice는 셀 수 없는 명사라서 관사를 붙일 수 없고, She gave me some advice라고 해야 맞아요.","hl":"mk-0"},{"n":17,"text":"두 번째 실수입니다. He goes to school by the bus라고 하면 어색해요. by와 교통수단 사이에는 관사를 넣지 않기 때문에 by bus라고 해야 합니다.","hl":"mk-1"},{"n":18,"text":"세 번째 실수도 확인해 볼게요. I bought a new furniture yesterday는 틀린 문장입니다. furniture는 셀 수 없는 명사라서 some new furniture라고 표현해야 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 셀 수 없는 명사로만 묶인 보기를 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>book, apple\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>advice, furniture\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>chair, desk\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>dog, cat\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">advice, furniture\u003c/span>\u003cdiv class=\"g-exp\">advice와 furniture는 셀 수 없는 명사로, a/an을 붙이거나 복수형으로 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"첫 번째 문제는 객관식입니다. 다음 중 셀 수 없는 명사로만 묶인 보기를 골라 보세요. 네 개의 보기를 잘 비교해 보고, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 두 번째 보기예요. advice와 furniture는 셀 수 없는 명사라서 a를 붙이거나 복수형으로 쓸 수 없습니다. 나머지 보기의 book, apple, chair, desk, dog, cat은 모두 셀 수 있는 명사예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 관사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The sun rises in ____ east.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>a\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>an\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>the\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>관사 없음\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">the\u003c/span>\u003cdiv class=\"g-exp\">해는 유일한 대상이고, 동서남북 방향 앞에도 the를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"두 번째 문제도 객관식입니다. The sun rises in 다음에 들어갈 관사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 세 번째 보기, the입니다. 해는 세상에 하나뿐인 대상이고, 동서남북 방향 앞에도 the를 붙이기 때문에 the east라고 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 명사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">She gave me some useful ____.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">advice\u003c/span>\u003cdiv class=\"g-exp\">advice는 셀 수 없는 명사로 some과 함께 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"세 번째 문제는 빈칸 채우기입니다. She gave me some useful 다음에 들어갈 명사를 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 advice입니다. advice는 셀 수 없는 명사라서 some과 함께 쓰고, a나 an은 붙이지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">어법상 틀린 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">He goes to school by the bus.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">by the bus → by bus\u003c/span>\u003cdiv class=\"g-exp\">by 뒤에 교통수단이 오면 관사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"네 번째 문제는 오류 수정입니다. He goes to school by the bus. 이 문장에서 잘못된 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 by the bus를 by bus로 고치는 것입니다. by 뒤에 교통수단이 오면 관사를 쓰지 않기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 말을 바르게 배열해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">by bus / goes / to school / He\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He goes to school by bus.\u003c/span>\u003cdiv class=\"g-exp\">주어 다음에 동사, 장소, 교통수단 순서로 놓습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다섯 번째 문제는 단어 배열입니다. by bus, goes, to school, He 이 네 덩어리를 바르게 배열해 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 He goes to school by bus입니다. 주어 다음에 동사, 장소, 그리고 교통수단 순서로 놓으면 자연스러워요. by bus 앞에는 관사를 쓰지 않는다는 것도 함께 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">해는 동쪽에서 뜬다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The sun rises in the east.\u003c/span>\u003cdiv class=\"g-exp\">해는 유일한 대상이라 the sun, 방향 앞에도 the를 붙입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"마지막 문제는 영작입니다. 해는 동쪽에서 뜬다, 이 문장을 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 The sun rises in the east입니다. 해는 하나뿐이라 the sun이라고 하고, 방향 앞에도 the를 붙여서 the east라고 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 086 명사, 관사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>셀 수 없는 명사는 \u003cb class=\"key\">a/an\u003c/b>을 붙이지 않고 \u003cb class=\"key\">복수형\u003c/b>으로도 쓰지 않습니다.\u003c/li>\u003cli>\u003cb class=\"key\">a/an\u003c/b>은 불특정한 하나, \u003cb class=\"key\">the\u003c/b>는 특정하거나 \u003cb class=\"key\">유일한\u003c/b> 것에 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">by + 교통수단\u003c/b>, \u003cb class=\"key\">식사\u003c/b>, \u003cb class=\"key\">운동\u003c/b> 이름 앞에는 관사를 쓰지 않습니다.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘 배운 내용을 정리해 볼게요. 셀 수 없는 명사에는 a나 an을 붙이지 않고 복수형으로도 쓰지 않는다는 점, a와 an은 정해지지 않은 하나, the는 특정하거나 세상에 하나뿐인 것에 쓴다는 점을 기억하세요. 그리고 by bus처럼 교통수단이나 식사, 운동 이름 앞에는 관사를 쓰지 않습니다. 오늘 내용 잘 정리해 두고 예문을 소리 내어 읽으면서 복습해 보세요. 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
