  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 101 부정","title":"부정 표현 완전 정복: 전체 부정·부분 부정·준부정·이중 부정","audioDir":"문법_Unit_101_부정_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 101 부정\u003c/div>\u003ch1>부정 표현 완전 정복: 전체 부정·부분 부정·준부정·이중 부정\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>전체 부정과 부분 부정, 준부정, 이중 부정을 구별하고 예문에서 정확히 해석할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 영문법 공부해 볼까요. 오늘은 부정 표현을 공부합니다. 부정이라고 하면 not만 떠올리기 쉬운데, 전체 부정과 부분 부정, 준부정, 이중 부정까지 알아 두면 훨씬 정확하게 해석할 수 있어요. 예문을 통해 하나씩 차근차근 익혀 보아요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">전체 부정을 나타내는 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전체 부정은 \u003cb class=\"key\">no\u003c/b>, \u003cb class=\"key\">none\u003c/b>, \u003cb class=\"key\">nothing\u003c/b>처럼 '전혀 아니다, 아무도 아니다'라는 뜻으로 문장 전체를 부정하는 표현이에요. never나 neither도 전체 부정에 쓰이며, 부정의 뜻이 이미 들어 있으므로 not을 함께 쓰지 않아요.\u003cdiv>\u003cspan class=\"g-formula\">no / none / never / neither / nothing + 긍정 형태의 문장\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Nothing\u003c/span> is impossible.\u003c/div>\u003cdiv class=\"g-ko\">아무것도 불가능하지 않다.\u003c/div>\u003cdiv class=\"g-note\">nothing이 주어로 쓰여 문장 전체를 부정해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Neither\u003c/span> of them came.\u003c/div>\u003cdiv class=\"g-ko\">그들 중 어느 누구도 오지 않았다.\u003c/div>\u003cdiv class=\"g-note\">neither는 둘 중 어느 쪽도 아님을 나타내는 전체 부정이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전체 부정 표현이 들어간 문장에는 \u003cb class=\"key\">not\u003c/b>을 추가로 쓰지 않도록 주의하세요. 특히 \u003cb class=\"key\">nothing\u003c/b> 뒤에 not을 쓰면 이중 부정처럼 어색해질 수 있어요.\u003c/div>","segs":[{"n":2,"text":"전체 부정은 문장 전체를 아예 부정하는 표현이에요. no, none, nothing, never, neither 같은 말들이 대표적이죠. 이런 표현에는 이미 부정의 뜻이 들어 있어서 not을 또 붙이지 않아요. 예를 들어 nothing은 아무것도 아니다라는 뜻으로 문장 전체를 부정해 줍니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 Nothing is impossible이에요. 뜻은 아무것도 불가능하지 않다는 말이죠. Nothing이 이미 아무것도 아니다라는 부정의 뜻을 담고 있어서 not을 따로 쓰지 않았어요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 Neither of them came이에요. 뜻은 그들 중 어느 누구도 오지 않았다는 것이죠. Neither가 둘 중 어느 쪽도 아니라는 전체 부정을 만들어 줍니다.","hl":"ex-1"},{"n":5,"text":"전체 부정 표현 안에는 이미 부정의 뜻이 들어 있어요. 그래서 not을 또 붙이면 의미가 꼬이거나 어색해질 수 있으니 조심해야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">부분 부정: 전부가 그런 것은 아니다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부분 부정은 \u003cb class=\"key\">not all\u003c/b>, \u003cb class=\"key\">not every\u003c/b>, \u003cb class=\"key\">not always\u003c/b>처럼 '모두가 그런 것은 아니다, 항상 그런 것은 아니다'라는 뜻을 나타내요. not both는 '둘 다는 아니다', not necessarily는 '반드시 ~은 아니다'라는 부분 부정이에요.\u003cdiv>\u003cspan class=\"g-formula\">not all / not every / not always / not necessarily + 긍정 형태\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Not all\u003c/span> birds can fly.\u003c/div>\u003cdiv class=\"g-ko\">모든 새가 날 수 있는 것은 아니다.\u003c/div>\u003cdiv class=\"g-note\">not all은 '모든 ~가 …한 것은 아니다'라는 부분 부정을 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Not every\u003c/span> student passed the exam.\u003c/div>\u003cdiv class=\"g-ko\">모든 학생이 시험에 합격한 것은 아니다.\u003c/div>\u003cdiv class=\"g-note\">not every는 각각의 모든 학생이 그런 것은 아니라는 뜻이에요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>'모든 새가 날 수 있는 것은 아니다'는 \u003cb class=\"key\">All birds cannot fly\u003c/b>가 아니라 \u003cb class=\"key\">Not all birds can fly\u003c/b>로 표현해요.\u003c/div>","segs":[{"n":6,"text":"부분 부정은 전부를 부정하는 게 아니라 일부만 부정하는 표현이에요. not all은 모든 것이 그런 것은 아니다라는 뜻이고, not every도 모든 각각이 그런 것은 아니라는 뜻이죠. not always는 항상 그런 것은 아니라는 말로 쓰여요. not both는 둘 다는 아니라는 뜻이고, not necessarily는 반드시 그런 것은 아니라는 뜻이에요. 해석할 때 모든 것이 아니다라고 받아들이면 됩니다.","hl":"rule"},{"n":7,"text":"첫 번째 예문은 Not all birds can fly예요. 뜻은 모든 새가 날 수 있는 것은 아니라는 것이죠. 여기서 Not all은 모든 새가 그런 것은 아니다라는 부분 부정을 나타냅니다.","hl":"ex-0"},{"n":8,"text":"두 번째 예문은 Not every student passed the exam이에요. 뜻은 모든 학생이 시험에 합격한 것은 아니라는 말이죠. Not every는 모든 각각이 그런 것은 아니다라는 부분 부정을 만들어 줍니다.","hl":"ex-1"},{"n":9,"text":"부분 부정은 전체 부정과 뜻이 완전히 달라요. 모든 새가 날 수 있는 것은 아니다라는 뜻을 만들 때는 All birds cannot fly가 아니라 Not all birds can fly로 써야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">준부정: 거의 ~않다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">준부정은 \u003cb class=\"key\">few\u003c/b>, \u003cb class=\"key\">little\u003c/b>, \u003cb class=\"key\">hardly\u003c/b>처럼 '거의 ~않다'라는 부정의 뜻을 가진 표현이에요. 문장에서 not 없이도 부정의 의미를 나타내며, scarcely, rarely, seldom도 준부정에 들어가요.\u003cdiv>\u003cspan class=\"g-formula\">few / little / hardly / scarcely / rarely / seldom + 긍정 형태\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I could \u003cspan class=\"fx\">hardly\u003c/span> breathe.\u003c/div>\u003cdiv class=\"g-ko\">나는 거의 숨을 쉴 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">hardly가 '거의 ~않다'라는 준부정의 뜻을 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Few\u003c/span> people know the truth.\u003c/div>\u003cdiv class=\"g-ko\">진실을 아는 사람은 거의 없다.\u003c/div>\u003cdiv class=\"g-note\">few는 셀 수 있는 명사 앞에서 '거의 없는'을 뜻해요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">hardly\u003c/b>는 '열심히'라는 뜻의 \u003cb class=\"key\">hard\u003c/b>와 다르므로 구별해야 해요. '거의 ~않다'는 뜻으로 쓸 때는 반드시 hardly를 사용하세요.\u003c/div>","segs":[{"n":10,"text":"준부정은 겉으로는 부정어가 없어 보이지만 뜻은 거의 그렇지 않다인 표현이에요. few와 little은 거의 없는이라는 뜻이고, hardly는 거의 아니다라는 뜻이죠. scarcely, rarely, seldom도 같은 준부정으로 묶여요. 그래서 해석할 때 부정의 느낌을 살려 주는 게 중요합니다.","hl":"rule"},{"n":11,"text":"첫 번째 예문은 I could hardly breathe예요. 뜻은 나는 거의 숨을 쉴 수 없었다는 것이죠. Hardly가 거의 아니다라는 준부정의 뜻을 담고 있습니다.","hl":"ex-0"},{"n":12,"text":"두 번째 예문은 Few people know the truth예요. 뜻은 진실을 아는 사람은 거의 없다는 말이죠. Few가 셀 수 있는 명사 people 앞에서 거의 없는이라는 부정의 뜻을 냅니다.","hl":"ex-1"},{"n":13,"text":"hardly는 열심히라는 뜻의 hard와 헷갈리기 쉬워요. 거의 그렇지 않다는 뜻으로 쓸 때는 꼭 hardly를 사용해야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">이중 부정 표현: no ~ without, nothing but, anything but\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">이중 부정 표현은 부정의 의미가 겹쳐서 오히려 강한 긍정을 나타내는 구조예요. \u003cb class=\"key\">no ~ without ~ing\u003c/b>는 '~하면 반드시 …한다', \u003cb class=\"key\">nothing but\u003c/b>은 '~뿐', \u003cb class=\"key\">anything but\u003c/b>은 '결코 ~아닌'이라는 뜻이에요.\u003cdiv>\u003cspan class=\"g-formula\">no + 명사 + without + 동명사 / nothing but + 명사 / anything but + 형용사·명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He is \u003cspan class=\"fx\">anything but\u003c/span> lazy.\u003c/div>\u003cdiv class=\"g-ko\">그는 결코 게으르지 않다.\u003c/div>\u003cdiv class=\"g-note\">anything but은 '결코 ~아닌'이라는 강한 부정을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">No one can succeed without working hard\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">누구도 열심히 노력하지 않고서는 성공할 수 없다.\u003c/div>\u003cdiv class=\"g-note\">no ~ without ~ing는 '~하지 않고서는 …할 수 없다', 즉 '~하면 반드시 …한다'는 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He has \u003cspan class=\"fx\">nothing but\u003c/span> books.\u003c/div>\u003cdiv class=\"g-ko\">그는 책밖에 없다.\u003c/div>\u003cdiv class=\"g-note\">nothing but은 '~뿐'이라는 뜻으로 쓰여요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">anything but\u003c/b>은 '결코 ~아닌', \u003cb class=\"key\">nothing but\u003c/b>은 '~뿐'이라 뜻이 정반대예요. 세트로 외우고 해석할 때 특히 주의하세요.\u003c/div>","segs":[{"n":14,"text":"이중 부정은 부정 표현이 두 번 겹치면서 오히려 강한 긍정의 뜻을 만드는 구조예요. no와 without이 만나면 그렇게 하지 않고서는 안 된다는 뜻이 되죠. nothing but은 그것뿐이라는 뜻이고, anything but은 결코 그것이 아니라는 뜻이에요. 그래서 앞뒤 표현을 세트로 익혀 두는 게 좋습니다.","hl":"rule"},{"n":15,"text":"첫 번째 예문은 He is anything but lazy예요. 뜻은 그는 결코 게으르지 않다는 것이죠. Anything but은 결코 그렇지 않다는 강한 부정을 나타냅니다.","hl":"ex-0"},{"n":16,"text":"두 번째 예문은 No one can succeed without working hard예요. 뜻은 누구도 열심히 노력하지 않고서는 성공할 수 없다는 것이죠. no와 without working hard가 만나서 노력하지 않고서는 안 된다는 강한 의미를 만들어 줍니다.","hl":"ex-1"},{"n":17,"text":"세 번째 예문은 He has nothing but books예요. 뜻은 그는 책밖에 없다는 것이죠. Nothing but은 그것뿐이라는 뜻으로, 다른 것은 없다는 의미를 담고 있습니다.","hl":"ex-2"},{"n":18,"text":"anything but과 nothing but은 모양은 비슷하지만 뜻은 정반대예요. anything but은 결코 아니라는 뜻이고 nothing but은 그것뿐이라는 뜻이니 꼭 구별해야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>All birds cannot fly.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Not all birds can fly.\u003c/div>\u003cdiv class=\"g-why\">'모든 새가 날 수 있는 것은 아니다'는 전체 부정이 아니라 부분 부정으로 표현해야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I could hard breathe.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I could hardly breathe.\u003c/div>\u003cdiv class=\"g-why\">'거의 숨을 쉴 수 없었다'는 뜻에는 hard가 아니라 준부정 hardly가 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He is nothing but lazy.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He is anything but lazy.\u003c/div>\u003cdiv class=\"g-why\">'그는 결코 게으르지 않다'는 뜻에는 anything but을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":19,"text":"모든 새가 날 수 있는 것은 아니다라는 뜻을 만들 때 All birds cannot fly라고 쓰면 뜻이 달라질 수 있어요. 이때는 Not all birds can fly라고 해야 부분 부정이 자연스럽게 표현됩니다.","hl":"mk-0"},{"n":20,"text":"거의 숨을 쉴 수 없었다는 뜻을 만들 때 hard를 쓰면 열심히 숨을 쉬었다는 이상한 말이 돼요. 이때는 꼭 hardly를 써서 I could hardly breathe라고 해야 합니다.","hl":"mk-1"},{"n":21,"text":"그는 결코 게으르지 않다는 뜻인데 nothing but을 쓰면 그는 게으르기 짝이 없다는 뜻이 되어 버려요. 그래서 He is anything but lazy라고 써야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 '모든 새가 날 수 있는 것은 아니다'의 올바른 영작은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>Not all birds can fly.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>All birds cannot fly.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>No birds can fly.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Every bird cannot fly.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Not all birds can fly.\u003c/span>\u003cdiv class=\"g-exp\">not all은 '모든 ~가 …한 것은 아니다'라는 부분 부정을 만들어요. 따라서 '모든 새가 날 수 있는 것은 아니다'에는 Not all birds can fly.가 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"다음 중 모든 새가 날 수 있는 것은 아니라는 뜻을 가장 잘 나타낸 문장을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 첫 번째 보기인 Not all birds can fly예요. not all은 모든 것이 그런 것은 아니다라는 부분 부정을 만들어 주죠. All birds cannot fly는 모든 새가 날 수 없다는 뜻으로 받아들여질 수 있어서 구별해야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'나는 거의 숨을 쉴 수 없었다'가 되도록 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I could ____ breathe.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hardly\u003c/span>\u003cdiv class=\"g-exp\">hardly는 '거의 ~않다'라는 뜻의 준부정이에요. hard는 '열심히'라는 뜻이므로 구별해야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"나는 거의 숨을 쉴 수 없었다는 뜻이 되도록 빈칸에 알맞은 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 hardly예요. hardly는 거의 그렇지 않다는 준부정의 뜻을 가지고 있습니다. 열심히라는 뜻의 hard와 헷갈리지 않도록 조심하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'그는 결코 게으르지 않다'가 되도록 문장에서 잘못된 부분을 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">He is nothing but lazy.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He is anything but lazy.\u003c/span>\u003cdiv class=\"g-exp\">anything but은 '결코 ~아닌'이라는 뜻이고, nothing but은 '~뿐'이라는 뜻이에요. 따라서 '결코 게으르지 않다'에는 anything but이 알맞아요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"다음 문장이 그는 결코 게으르지 않다는 뜻이 되도록 잘못된 부분을 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 He is anything but lazy예요. anything but은 결코 그렇지 않다는 뜻을 만들고, nothing but은 그것뿐이라는 뜻을 만들어요. 그래서 이 문장에서는 anything but을 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 전체 부정을 나타내는 표현으로 알맞은 것은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>not all\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>not every\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>nothing\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>not necessarily\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">nothing\u003c/span>\u003cdiv class=\"g-exp\">nothing은 '아무것도 아니다'라는 전체 부정 표현이에요. not all, not every, not necessarily는 부분 부정에 해당해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다음 중 전체 부정을 나타내는 표현을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 세 번째 보기인 nothing이에요. nothing은 아무것도 아니다라는 전체 부정을 나타냅니다. not all이나 not every, not necessarily는 일부만 부정하는 부분 부정이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'열심히 노력하지 않고서는 성공할 수 없다'가 되도록 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">No one can succeed ____ working hard.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">without\u003c/span>\u003cdiv class=\"g-exp\">no ~ without ~ing는 '~하지 않고서는 …할 수 없다', 즉 '~하면 반드시 …한다'는 뜻을 나타내요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"열심히 노력하지 않고서는 성공할 수 없다는 뜻이 되도록 빈칸에 알맞은 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 without이에요. no one can succeed와 without working hard가 만나서 노력하지 않고서는 성공할 수 없다는 뜻을 만들어 줍니다. 이 표현은 노력하면 반드시 성공한다는 강한 의미로도 이해할 수 있어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 not necessarily의 의미로 가장 알맞은 것은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>반드시 ~은 아니다\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>결코 ~아니다\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>거의 ~않다\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>~뿐이다\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">반드시 ~은 아니다\u003c/span>\u003cdiv class=\"g-exp\">not necessarily는 '반드시 ~한 것은 아니다'라는 부분 부정 표현이에요. 전체를 부정하지 않는다는 점이 핵심이에요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"다음 중 not necessarily의 의미로 가장 알맞은 보기를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 첫 번째 보기인 반드시 그런 것은 아니다예요. not necessarily는 전체를 부정하지 않고 반드시 그렇지는 않다는 부분 부정을 나타냅니다. 결코 아니다나 거의 않다는 다른 표현과 구별해야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 101 부정\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>전체 부정은 \u003cb class=\"key\">no\u003c/b>, \u003cb class=\"key\">none\u003c/b>, \u003cb class=\"key\">nothing\u003c/b>처럼 문장 전체를 부정하는 표현이에요.\u003c/li>\u003cli>부분 부정은 \u003cb class=\"key\">not all\u003c/b>, \u003cb class=\"key\">not every\u003c/b>, \u003cb class=\"key\">not always\u003c/b>로 '모든 ~가 …한 것은 아니다'를 나타내요.\u003c/li>\u003cli>준부정은 \u003cb class=\"key\">hardly\u003c/b>, \u003cb class=\"key\">few\u003c/b>, \u003cb class=\"key\">little\u003c/b>처럼 '거의 ~않다'라는 뜻을 가져요.\u003c/li>\u003cli>이중 부정에서 \u003cb class=\"key\">anything but\u003c/b>은 '결코 ~아닌', \u003cb class=\"key\">nothing but\u003c/b>은 '~뿐'이라는 뜻이에요.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘은 부정 표현을 전체 부정과 부분 부정, 준부정, 이중 부정으로 나누어 배웠어요. 전체 부정은 no나 nothing처럼 문장 전체를 부정하고, 부분 부정은 not all처럼 일부만 부정한다는 점이 중요하죠. hardly나 few 같은 준부정은 거의 그렇지 않다는 뜻을 가지고, anything but과 nothing but은 뜻이 정반대라서 꼭 구별해야 합니다. 오늘 배운 표현들을 예문과 함께 복습하면서 실제 문장에서 자신 있게 써 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
