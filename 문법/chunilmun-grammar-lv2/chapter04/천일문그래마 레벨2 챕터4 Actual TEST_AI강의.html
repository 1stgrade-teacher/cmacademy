  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;

  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Actual Test 1~15번","title":"천일문그래마 레벨2 챕터4 Actual TEST","audioDir":"천일문그래마_레벨2_챕터4_Actual_TEST_audio","preview":false,"count":121,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">수동태\u003c/div>\u003ch1>수동태 기본과 시제·조동사·의문문 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>15문제 · 빈칸에 알맞은 것 고르기, 능동태를 수동태로 전환하기, 틀린 문장 고르기, 밑줄 친 부분 고르기, 그림 보고 문장 완성하기, 수동태 전환 고르기, 밑줄 친 부분 고치기, 어법상 알맞은 문장 개수 고르기, 수동태로 바꿔 쓰기, 영작 고르기, 조건에 맞춰 영작하기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 천일문 그래마 레벨2 챕터4의 수동태 문제를 함께 풀어 볼 거예요. 수동태는 be동사와 과거분사의 형태만 정확히 잡아도 많은 문제가 풀리는 아주 중요한 문법이에요. 기본 구조부터 시제, 조동사, 의문문까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태의 기본 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 동작을 \u003cb class=\"key\">당하는\u003c/b> 대상이면 「be동사 + 과거분사(p.p.)」로 쓰고, 행위자는 \u003cb class=\"key\">by + 목적격\u003c/b>으로 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + be동사 + p.p. (+ by + 행위자)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>해석은 '~되다, ~당하다'\u003c/li>\u003cli>be동사는 시제와 주어에 맞춰 변한다\u003c/li>\u003cli>과거분사는 동사의 세 번째 형태\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The window \u003cspan class=\"fx\">was broken by\u003c/span> us.\u003c/div>\u003cdiv class=\"g-ko\">그 창문은 우리에 의해 깨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">English \u003cspan class=\"fx\">is spoken\u003c/span> in many countries.\u003c/div>\u003cdiv class=\"g-ko\">영어는 많은 나라에서 말해진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"수동태는 주어가 어떤 동작을 당하는 문장이에요. 이때 동사는 be동사와 과거분사로 이루어지고, 행위자는 by 뒤에 붙여요. 해석은 보통 되다나 당하다로 자연스럽게 해 줍니다. be동사는 현재인지 과거인지, 주어가 단수인지 복수인지에 따라 달라진다는 점도 기억해 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태의 시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태에서도 시제는 \u003cb class=\"key\">be동사\u003c/b>로 나타낸다. 현재는 is/are + p.p., 과거는 was/were + p.p., 미래는 \u003cb class=\"key\">will be + p.p.\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">현재 is/are + p.p. / 과거 was/were + p.p. / 미래 will be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>원래 문장의 시제를 먼저 확인한다\u003c/li>\u003cli>미래 수동태는 will과 p.p. 사이에 be가 필요하다\u003c/li>\u003cli>과거를 나타내는 last night, yesterday 같은 표현을 본다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The letter \u003cspan class=\"fx\">was delivered\u003c/span> this morning.\u003c/div>\u003cdiv class=\"g-ko\">그 편지는 오늘 아침에 배달되었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The winner \u003cspan class=\"fx\">will be announced\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우승자는 발표될 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"수동태라고 해서 시제가 사라지는 것은 아니에요. be동사를 현재형으로 쓰면 현재 수동태, 과거형으로 쓰면 과거 수동태가 됩니다. 미래를 나타낼 때는 will be 뒤에 과거분사를 붙여요. 문제에서 yesterday나 last night, tomorrow 같은 표현을 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">자주 쓰는 불규칙 동사의 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태에는 동사의 \u003cb class=\"key\">과거분사\u003c/b>가 필요하다. write-written, catch-caught, steal-stolen, make-made, bear-born처럼 불규칙 형태를 정확히 외운다.\u003cdiv>\u003cspan class=\"g-formula\">write-wrote-written / catch-caught-caught / steal-stole-stolen / make-made-made / bear-bore-born\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거형과 과거분사를 구별한다\u003c/li>\u003cli>was wrote, was catched 같은 형태는 틀린다\u003c/li>\u003cli>born은 '태어난'이라는 수동 표현에 쓰인다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It was \u003cspan class=\"fx\">written\u003c/span> by Shakespeare.\u003c/div>\u003cdiv class=\"g-ko\">그것은 셰익스피어에 의해 쓰였다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The error was \u003cspan class=\"fx\">caught\u003c/span> by the software.\u003c/div>\u003cdiv class=\"g-ko\">그 오류는 소프트웨어에 의해 발견되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"수동태에서는 동사의 과거분사가 정말 중요해요. write의 과거분사는 written이고, catch는 caught, steal은 stolen입니다. 과거형 wrote나 catched를 그대로 쓰면 수동태가 아니게 되거나 틀린 문장이 돼요. 불규칙 동사는 소리 내어 세 번째 형태까지 함께 익혀 두면 좋습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">빈칸에 알맞은 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">A: Who wrote Romeo and Juliet?\u003cbr>B: It \u003cspan class=\"p-blank\">\u003c/span> by William Shakespeare.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① writes\u003c/div>\u003cdiv class=\"p-op\">② wrote\u003c/div>\u003cdiv class=\"p-op\">③ written\u003c/div>\u003cdiv class=\"p-op\">④ was wrote\u003c/div>\u003cdiv class=\"p-op\">⑤ was written\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":5,"text":"첫 번째 문제는 대화 속 빈칸에 들어갈 표현을 고르는 문제예요. 빈칸 뒤에 by William Shakespeare가 있으니 로미오와 줄리엣이 어떤 동작을 당하는지 생각해 보세요.","hl":"q"},{"n":6,"text":"","hl":"q","pause":7},{"n":7,"text":"정답은 다섯 번째 선택지예요. 과거에 쓰인 일이므로 was와 write의 과거분사 written을 써서 was written이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 15\u003c/span>\u003cspan class=\"g-kind\">빈칸에 알맞은 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">A: Who wrote Romeo and Juliet?\u003cbr>B: It \u003cspan class=\"p-blank\">\u003c/span> by William Shakespeare.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① writes\u003c/div>\u003cdiv class=\"p-op\">② wrote\u003c/div>\u003cdiv class=\"p-op\">③ written\u003c/div>\u003cdiv class=\"p-op\">④ was wrote\u003c/div>\u003cdiv class=\"p-op\">⑤ was written\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어와 의미 확인\u003c/b>It은 Romeo and Juliet를 가리키고, 뒤에 \u003cb class=\"key\">by William Shakespeare\u003c/b>가 있으므로 '쓰이다'라는 \u003cb class=\"key\">수동태\u003c/b>가 필요하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">형태와 시제 확인\u003c/b>수동태는 \u003cb class=\"key\">be동사 + p.p.\u003c/b>이고 과거의 일이므로 \u003cb class=\"key\">was + written\u003c/b>이 된다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 점검\u003c/b>① writes는 능동 현재, ② wrote는 능동 과거, ③ written은 be동사 없음, ④ was wrote는 과거분사 오류, ⑤ \u003cb class=\"key\">was written\u003c/b>이 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">It was written by William Shakespeare.\u003c/div>\u003cdiv class=\"p-ko\">그것은 윌리엄 셰익스피어에 의해 쓰였다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>wrote는 과거형이지 과거분사가 아니다.\u003c/div>","segs":[{"n":8,"text":"먼저 It이 무엇을 가리키는지 보세요. 로미오와 줄리엣이고 뒤에 by William Shakespeare가 있으니 셰익스피어가 쓰는 쪽이 아니라 로미오와 줄리엣이 쓰이는 쪽이에요.","hl":"st-0"},{"n":9,"text":"수동태는 be동사와 과거분사로 만들어요. 과거에 쓰인 일이니까 be동사는 was를 쓰고 write의 과거분사 written을 붙이면 됩니다.","hl":"st-1"},{"n":10,"text":"첫 번째 선택지는 능동 현재이고, 두 번째는 능동 과거라서 수동태가 아니에요. 세 번째는 be동사가 없고, 네 번째는 wrote를 과거분사처럼 써서 틀립니다. 그래서 다섯 번째 선택지가 정답입니다.","hl":"st-2"},{"n":11,"text":"이 문제의 함정도 짚고 갈게요. wrote는 과거형이지 과거분사가 아니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">능동태를 수동태로 바꾸는 순서\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">능동태의 \u003cb class=\"key\">목적어\u003c/b>를 수동태의 주어로 올리고, 동사는 \u003cb class=\"key\">be동사 + p.p.\u003c/b>로 바꾼 뒤, 원래 주어는 \u003cb class=\"key\">by + 목적격\u003c/b>으로 만든다.\u003cdiv>\u003cspan class=\"g-formula\">능동태: A + 동사 + B → 수동태: B + be동사 + p.p. + by A\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 없으면 수동태로 바꾸기 어렵다\u003c/li>\u003cli>시제는 원래 문장과 똑같이 유지한다\u003c/li>\u003cli>대명사는 by 뒤에서 목적격으로 바꾼다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The actress played the main character.\u003c/div>\u003cdiv class=\"g-ko\">그 여배우는 주인공을 연기했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The main character was played \u003cspan class=\"fx\">by the actress\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">주인공은 그 여배우에 의해 연기되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"능동태를 수동태로 바꿀 때는 먼저 동사의 목적어를 찾아요. 그 목적어를 문장 앞 주어 자리로 보내고, 동사는 be동사와 과거분사로 바꿔요. 원래 주어는 by 뒤에 목적격으로 붙여 주고, 원래 시제는 그대로 살려야 합니다. 이 순서를 기억하면 긴 문장도 차분히 바꿀 수 있어요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">능동태를 수동태로 전환하기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 문장을 수동태로 바르게 전환한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">The actress played the main character.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① The main character played by the actress.\u003c/div>\u003cdiv class=\"p-op\">② The main character was played the actress.\u003c/div>\u003cdiv class=\"p-op\">③ The main character is played by the actress.\u003c/div>\u003cdiv class=\"p-op\">④ The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-op\">⑤ The actress was played by the main character.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":13,"text":"이번에는 능동태 문장을 수동태로 바꾸는 문제예요. 동사 played의 목적어가 무엇인지 먼저 찾아보세요.","hl":"q"},{"n":14,"text":"","hl":"q","pause":7},{"n":15,"text":"정답은 네 번째 선택지입니다. 목적어 The main character가 주어로 가고, 과거 시제를 살려 was played by the actress가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 15\u003c/span>\u003cspan class=\"g-kind\">능동태를 수동태로 전환하기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 문장을 수동태로 바르게 전환한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">The actress played the main character.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① The main character played by the actress.\u003c/div>\u003cdiv class=\"p-op\">② The main character was played the actress.\u003c/div>\u003cdiv class=\"p-op\">③ The main character is played by the actress.\u003c/div>\u003cdiv class=\"p-op\">④ The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-op\">⑤ The actress was played by the main character.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">목적어 찾기\u003c/b>능동태의 목적어 \u003cb class=\"key\">the main character\u003c/b>를 수동태의 주어로 올린다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동사와 시제 바꾸기\u003c/b>played는 과거이므로 \u003cb class=\"key\">was played\u003c/b>로 바꾼다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">행위자 붙이기\u003c/b>원래 주어 the actress는 \u003cb class=\"key\">by the actress\u003c/b>로 만든다. 완성: \u003cb class=\"key\">The main character was played by the actress.\u003c/b>\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">선택지 점검\u003c/b>① be동사 없음, ② by 누락, ③ 현재 is, ④ \u003cb class=\"key\">was played by\u003c/b>로 알맞음, ⑤ 주어와 행위자가 뒤바뀜.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-ko\">주인공은 그 여배우에 의해 연기되었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>수동태에서 행위자 앞의 by를 빠뜨리지 않는다.\u003c/div>","segs":[{"n":16,"text":"먼저 동사 played의 목적어를 찾아보세요. 주인공을 연기한 것이므로 the main character가 수동태의 주어로 가야 합니다.","hl":"st-0"},{"n":17,"text":"원래 문장이 과거에 일어난 일이니까 수동태도 과거로 써야 해요. 그래서 was played라는 형태가 필요합니다.","hl":"st-1"},{"n":18,"text":"연기한 사람은 여배우이므로 원래 주어 the actress를 by 뒤에 붙여요. 그러면 The main character was played by the actress가 됩니다.","hl":"st-2"},{"n":19,"text":"첫 번째는 be동사가 없고, 두 번째는 by가 빠졌어요. 세 번째는 현재 시제라서 틀리고, 다섯 번째는 주인공과 여배우의 역할이 뒤바뀌었습니다. 네 번째 선택지가 정확합니다.","hl":"st-3"},{"n":20,"text":"이 문제의 함정도 짚고 갈게요. 수동태에서 행위자 앞의 by를 빠뜨리지 않는다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태 부정문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태 부정문은 \u003cb class=\"key\">be동사 뒤에 not\u003c/b>을 붙여 「be동사 + not + p.p.」로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + be동사 + not + p.p. (+ by + 행위자)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>not은 be동사 뒤에 온다\u003c/li>\u003cli>didn't be나 not was 같은 어순은 틀린다\u003c/li>\u003cli>과거 부정은 wasn't/weren't + p.p.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The problem \u003cspan class=\"fx\">was not solved\u003c/span> by Harry.\u003c/div>\u003cdiv class=\"g-ko\">그 문제는 Harry에 의해 해결되지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">My offer \u003cspan class=\"fx\">wasn't accepted\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 제안은 받아들여지지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"수동태에서 부정은 be동사 뒤에 not을 붙여서 만들어요. 그래서 was not solved처럼 be동사, not, 과거분사 순서가 됩니다. did not be reviewed처럼 일반동사 부정문을 그대로 가져오면 틀려요. not의 위치만 정확히 기억해도 많은 문제를 고칠 수 있어요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 15\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>[3-4] 다음 중 어법상 알맞지 않은 문장 두 개를 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① The window was broken by us.\u003c/div>\u003cdiv class=\"p-op\">② The park is cleaned by volunteers.\u003c/div>\u003cdiv class=\"p-op\">③ This puzzle will be complete by Nancy.\u003c/div>\u003cdiv class=\"p-op\">④ These flowers are found only in Africa.\u003c/div>\u003cdiv class=\"p-op\">⑤ The problem not was solved by Harry.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③, ⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"세 번째 문제는 다섯 문장 중 어법상 틀린 문장을 두 개 고르는 문제예요. 미래 수동태와 부정문의 위치를 특히 살펴보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":7},{"n":24,"text":"정답은 세 번째와 다섯 번째 문장입니다. 미래 수동태는 will be completed가 되어야 하고, 부정문은 was not solved처럼 not이 be동사 뒤에 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 15\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>[3-4] 다음 중 어법상 알맞지 않은 문장 두 개를 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① The window was broken by us.\u003c/div>\u003cdiv class=\"p-op\">② The park is cleaned by volunteers.\u003c/div>\u003cdiv class=\"p-op\">③ This puzzle will be complete by Nancy.\u003c/div>\u003cdiv class=\"p-op\">④ These flowers are found only in Africa.\u003c/div>\u003cdiv class=\"p-op\">⑤ The problem not was solved by Harry.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">수동태 기본 확인\u003c/b>① was broken, ② is cleaned, ④ are found는 모두 \u003cb class=\"key\">be동사 + p.p.\u003c/b>로 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">미래 수동태 확인\u003c/b>③은 미래 수동태이므로 \u003cb class=\"key\">will be completed\u003c/b>가 되어야 하는데 will be complete로 써서 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">부정문 위치 확인\u003c/b>⑤는 부정문이므로 \u003cb class=\"key\">was not solved\u003c/b> 또는 wasn't solved가 되어야 하는데 not was solved로 어순이 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답 확정\u003c/b>틀린 문장은 \u003cb class=\"key\">③, ⑤\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③, ⑤\u003c/span>\u003cdiv class=\"p-ko\">③ 이 퍼즐은 Nancy에 의해 완성될 것이다. / ⑤ 그 문제는 Harry에 의해 해결되지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>미래 수동태는 will be p.p.이고, 부정은 be동사 뒤에 not을 쓴다.\u003c/div>","segs":[{"n":25,"text":"첫 번째, 두 번째, 네 번째 문장은 be동사와 과거분사가 바르게 쓰였어요. 그래서 기본 수동태 형태는 문제가 없습니다.","hl":"st-0"},{"n":26,"text":"세 번째 문장은 미래에 완성될 것이라는 뜻이에요. 미래 수동태는 will be 뒤에 과거분사 completed가 와야 하므로 complete는 틀립니다.","hl":"st-1"},{"n":27,"text":"다섯 번째 문장은 부정문인데 not이 be동사 앞에 왔어요. 수동태 부정문에서는 not이 was 뒤에 와야 합니다.","hl":"st-2"},{"n":28,"text":"그래서 어법상 알맞지 않은 문장은 세 번째와 다섯 번째입니다. 미래 수동태와 부정문 위치를 꼭 기억해 주세요.","hl":"st-3"},{"n":29,"text":"이 문제의 함정도 짚고 갈게요. 미래 수동태는 will be p.p.이고, 부정은 be동사 뒤에 not을 쓴다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태에서 주어와 be동사 수 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태의 be동사는 주어의 수와 시제에 맞춘다. 복수 주어에는 \u003cb class=\"key\">were/are\u003c/b>를, 단수 주어에는 \u003cb class=\"key\">was/is\u003c/b>를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">단수 주어 + was/is + p.p. / 복수 주어 + were/are + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어가 Those pictures처럼 복수인지 확인한다\u003c/li>\u003cli>과거면 was/were, 현재면 is/are\u003c/li>\u003cli>주어와 be동사 사이에 다른 말이 있어도 주어를 찾는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Those pictures \u003cspan class=\"fx\">were taken\u003c/span> by Danny.\u003c/div>\u003cdiv class=\"g-ko\">저 사진들은 Danny에 의해 찍혔다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The window \u003cspan class=\"fx\">was broken\u003c/span> by us.\u003c/div>\u003cdiv class=\"g-ko\">그 창문은 우리에 의해 깨졌다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"수동태도 주어와 be동사의 수를 맞춰야 해요. 주어가 복수이면 과거에는 were, 현재에는 are를 쓰고, 단수이면 was나 is를 씁니다. 특히 pictures, flowers처럼 끝에 s가 붙은 복수 주어를 놓치지 마세요. be동사만 바꿔도 어법상 맞는 문장이 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 15\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>[3-4] 다음 중 어법상 알맞지 않은 문장 두 개를 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① The error was catched by the software.\u003c/div>\u003cdiv class=\"p-op\">② The letters were delivered this morning.\u003c/div>\u003cdiv class=\"p-op\">③ The homework must be done by tomorrow.\u003c/div>\u003cdiv class=\"p-op\">④ Those unique pictures was taken by Danny.\u003c/div>\u003cdiv class=\"p-op\">⑤ The winner will be announced by the judge.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">①, ④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"네 번째 문제도 틀린 문장 두 개를 고르는 문제예요. 불규칙 동사의 과거분사와 주어의 수를 확인해 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":7},{"n":33,"text":"정답은 첫 번째와 네 번째 문장입니다. catch의 과거분사는 caught이고, Those unique pictures는 복수라서 were taken으로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 15\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>[3-4] 다음 중 어법상 알맞지 않은 문장 두 개를 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① The error was catched by the software.\u003c/div>\u003cdiv class=\"p-op\">② The letters were delivered this morning.\u003c/div>\u003cdiv class=\"p-op\">③ The homework must be done by tomorrow.\u003c/div>\u003cdiv class=\"p-op\">④ Those unique pictures was taken by Danny.\u003c/div>\u003cdiv class=\"p-op\">⑤ The winner will be announced by the judge.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">불규칙 과거분사 확인\u003c/b>① catch의 p.p.는 caught이므로 \u003cb class=\"key\">was caught\u003c/b>가 되어야 한다. was catched는 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">복수 주어 확인\u003c/b>④ 주어 Those unique pictures는 복수이므로 \u003cb class=\"key\">were taken\u003c/b>이 되어야 한다. was taken은 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">나머지 점검\u003c/b>② were delivered, ③ must be done, ⑤ will be announced는 모두 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답 확정\u003c/b>틀린 문장은 \u003cb class=\"key\">①, ④\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ①, ④\u003c/span>\u003cdiv class=\"p-ko\">① 그 오류는 소프트웨어에 의해 발견되었다. / ④ 저 독특한 사진들은 Danny에 의해 찍혔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>catched, was taken처럼 불규칙 과거분사와 수 일치를 놓치지 않는다.\u003c/div>","segs":[{"n":34,"text":"첫 번째 문장에서 catch의 과거분사는 caught예요. catched라고 쓰면 틀리므로 was caught가 되어야 합니다.","hl":"st-0"},{"n":35,"text":"네 번째 문장의 주어는 Those unique pictures로 복수예요. 그래서 be동사는 was가 아니라 were를 써야 합니다.","hl":"st-1"},{"n":36,"text":"두 번째는 과거 수동태, 세 번째는 조동사 수동태, 다섯 번째는 미래 수동태로 모두 바르게 쓰였어요.","hl":"st-2"},{"n":37,"text":"따라서 틀린 문장은 첫 번째와 네 번째입니다. 불규칙 과거분사와 주어의 수를 함께 확인해야 해요.","hl":"st-3"},{"n":38,"text":"이 문제의 함정도 짚고 갈게요. catched, was taken처럼 불규칙 과거분사와 수 일치를 놓치지 않는다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사가 있는 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사가 있으면 수동태는 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b> 형태로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">can/must/will/should + be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be는 조동사 뒤에 오는 동사원형\u003c/li>\u003cli>p.p. 앞에 be를 빠뜨리지 않는다\u003c/li>\u003cli>can be used, must be done처럼 통째로 외운다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This computer \u003cspan class=\"fx\">can be used\u003c/span> by children.\u003c/div>\u003cdiv class=\"g-ko\">이 컴퓨터는 아이들에 의해 사용될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The homework \u003cspan class=\"fx\">must be done\u003c/span> by tomorrow.\u003c/div>\u003cdiv class=\"g-ko\">그 숙제는 내일까지 완료되어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"조동사가 들어간 수동태는 조동사 뒤에 be를 꼭 넣어요. 그래서 can be used, must be done, will be announced 같은 모양이 됩니다. 조동사 다음에는 동사원형이 오니까 be를 쓰는 것이 자연스럽고, 그 뒤에는 과거분사가 이어져요. be를 빼먹으면 문장이 바로 어색해진다는 점을 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 15\u003c/span>\u003cspan class=\"g-kind\">밑줄 친 부분 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>[5-6] 다음 중 밑줄 친 (A), (B)를 바르게 고쳐 쓴 것끼리 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-psg\">• The piano in this room (A) \u003cu class=\"p-u\">play\u003c/u> by Jane.\u003cbr>• This computer (B) \u003cu class=\"p-u\">can use\u003c/u> even by l p.는 written이므로 \u003cb class=\"key\">was the song written\u003c/b>이 된다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">행위자 붙이기\u003c/b>행위자 him을 \u003cb class=\"key\">by him\u003c/b>으로 붙여 \u003cb class=\"key\">When was the song written by him?\u003c/b>을 완성한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 When was the song written by him?\u003c/span>\u003cdiv class=\"p-full\">When was the song written by him?\u003c/div>\u003cdiv class=\"p-ko\">그 노래는 언제 그에 의해 쓰였습니까?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>When did the song write?처럼 일반동사 의문문으로 만들지 않는다.\u003c/div>","segs":[{"n":117,"text":"언제인지 묻는 문장이므로 when이 가장 앞에 와요. 그 뒤에는 수동태 의문문 어순으로 was와 주어, 과거분사가 이어집니다.","hl":"st-0"},{"n":118,"text":"그 노래는 쓰이는 대상이므로 주어는 the song입니다. write의 과거분사는 written이므로 was the song written 순서로 씁니다.","hl":"st-1"},{"n":119,"text":"그에 의해라는 뜻은 by him으로 나타내요. 그래서 완성된 문장은 When was the song written by him?입니다.","hl":"st-2"},{"n":120,"text":"이 문제의 함정도 짚고 갈게요. When did the song write?처럼 일반동사 의문문으로 만들지 않는다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">수동태\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>수동태는 \u003cb class=\"key\">be동사 + p.p.\u003c/b>가 기본이고, 행위자는 \u003cb class=\"key\">by + 목적격\u003c/b>으로 쓴다.\u003c/li>\u003cli>미래 수동태는 \u003cb class=\"key\">will be + p.p.\u003c/b>, 조동사 수동태는 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b>이다.\u003c/li>\u003cli>수동태 부정문은 \u003cb class=\"key\">be동사 뒤에 not\u003c/b>을 붙인다.\u003c/li>\u003cli>불규칙 과거분사와 주어의 수, by/at/for 같은 전치사를 함께 확인한다.\u003c/li>\u003c/ul>","segs":[{"n":121,"text":"오늘은 수동태의 기본 구조부터 시제, 부정문, 조동사, 의문문까지 차근차근 풀어 봤어요. 가장 중요한 것은 be동사와 과거분사의 짝을 정확히 쓰는 것이고, 행위자 앞에는 by를 붙인다는 점이에요. 오늘 틀린 문제는 과거분사와 be동사 위치를 다시 확인하면서 복습해 보세요. 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
