}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 14 진행형 수동태 & 완료형 수동태","title":"진행형 수동태 & 완료형 수동태 — be being p.p. 완벽 정리","audioDir":"문법_Unit_014_진행형_수동태_&_완료형_수동태_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 03 동사의 태 | Unit 014 진행형 수동태 &amp; 완료형 수동태\u003c/div>\u003ch1>진행형 수동태 &amp; 완료형 수동태 — be being p.p. 완벽 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>진행형 수동태와 완료형 수동태, 그리고 조동사가 있는 수동태의 구조를 익히고 직접 문장으로 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 진행형 수동태와 완료형 수동태를 함께 공부할 거예요. 수동태의 기본 형태는 이미 다들 알고 있죠? 오늘은 그 수동태에 진행의 느낌과 완료의 느낌을 얹는 방법을 배웁니다. be 뒤에 being이 하나 더 붙는다는 점, 그리고 been이 들어간다는 점만 잡으면 아주 쉬워요. 자, 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">진행형 수동태 — be + being + p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">진행형 수동태는 \u003cb class=\"key\">be + being + p.p.\u003c/b> 형태로 '~되고 있는 중이다'를 뜻합니다. 능동태의 진행형이 be + -ing이듯이, 수동태에서는 -ing 자리에 \u003cb class=\"key\">being\u003c/b>이 들어갑니다. 즉 \u003cb class=\"key\">be동사\u003c/b>가 주어와 시제에 맞춰 변하고, 그 뒤에 being과 과거분사가 차례로 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">be(is/are/was/were) + being + p.p. = ~되고 있는 중이다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The bridge \u003cspan class=\"fx\">is being repaired\u003c/span> now.\u003c/div>\u003cdiv class=\"g-ko\">그 다리는 지금 수리되고 있다.\u003c/div>\u003cdiv class=\"g-note\">be + being + p.p.가 모두 갖춰진 진행형 수동태의 기본 예문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">A new library \u003cspan class=\"fx\">is being built\u003c/span> in our town.\u003c/div>\u003cdiv class=\"g-ko\">우리 동네에 새 도서관이 지어지고 있다.\u003c/div>\u003cdiv class=\"g-note\">도서관은 '지어지는' 대상이므로 진행형 수동태를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>being을 \u003cb class=\"key\">빠뜨리면\u003c/b> 진행의 의미가 사라지니 주의하세요. 진행형 수동태에는 \u003cb class=\"key\">now\u003c/b>나 \u003cb class=\"key\">right now\u003c/b> 같은 표현이 자주 함께 옵니다.\u003c/div>","segs":[{"n":2,"text":"먼저 진행형 수동태부터 볼게요. 진행형 수동태는 be 동사 뒤에 being, 그다음에 과거분사를 붙여서 만듭니다. '그 다리는 지금 수리되고 있다'처럼 어떤 일이 지금 진행 중인데 그 일을 당하고 있을 때 쓰는 표현이에요. 능동태에서는 be 동사 뒤에 동사 ing가 왔지만, 수동태에서는 그 자리에 being이 들어간다고 생각하면 됩니다. 그래서 be 동사는 주어와 시제에 맞춰 is, are, was, were로 바뀌고, being과 과거분사는 그대로 남아요.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. The bridge is being repaired now. 뜻은 '그 다리는 지금 수리되고 있다'예요. is being repaired, 이렇게 be 동사와 being과 과거분사가 나란히 있는 모습이 바로 진행형 수동태입니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. A new library is being built in our town. 뜻은 '우리 동네에 새 도서관이 지어지고 있다'예요. 도서관은 스스로 짓는 것이 아니라 지어지는 대상이니까 is being built라는 진행형 수동태가 필요합니다.","hl":"ex-1"},{"n":5,"text":"여기서 실수 하나만 조심하면 되는데요, being을 빠뜨리면 안 됩니다. The bridge is repairing now라고 하면 다리가 스스로 수리하는 것처럼 들려서 어색해져요. 그리고 진행형이니까 now나 right now 같은 표현과 자주 같이 나온다는 것도 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">완료형 수동태 — have/has/had + been + p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">완료형 수동태는 \u003cb class=\"key\">have/has/had + been + p.p.\u003c/b> 형태입니다. 완료형의 \u003cb class=\"key\">have + p.p.\u003c/b>에 수동태가 더해지면서 p.p. 앞에 \u003cb class=\"key\">been\u003c/b>이 추가됩니다. 주어와 시제에 따라 have, has, had 중에서 알맞은 것을 골라 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">have/has/had + been + p.p. = ~되어 왔다 / ~되어 있다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The work \u003cspan class=\"fx\">has been finished\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 일은 끝났다.\u003c/div>\u003cdiv class=\"g-note\">have/has + been + p.p. 구조의 완료형 수동태입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">All the tickets \u003cspan class=\"fx\">have been sold out\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">모든 표가 매진되었다.\u003c/div>\u003cdiv class=\"g-note\">주어가 복수이므로 have been을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The building \u003cspan class=\"fx\">had been cleaned\u003c/span> before the guests arrived.\u003c/div>\u003cdiv class=\"g-ko\">손님들이 도착하기 전에 그 건물은 청소되어 있었다.\u003c/div>\u003cdiv class=\"g-note\">had been p.p.는 과거의 어떤 시점보다 더 이전에 완료된 수동의 일을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>have + p.p.만 쓰면 \u003cb class=\"key\">능동\u003c/b>의 현재완료가 되므로 \u003cb class=\"key\">been\u003c/b>을 꼭 넣어야 수동의 의미가 살아납니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 완료형 수동태를 볼게요. 완료형 수동태는 have, has, had 뒤에 been, 그리고 과거분사가 오는 구조입니다. 현재완료에서 have 뒤에 과거분사를 썼던 것 기억나죠? 거기에 수동의 의미를 더하려고 been을 하나 끼워 넣는다고 생각하면 쉬워요. 그래서 주어가 단수면 has been, 복수면 have been, 과거보다 앞선 일이면 had been을 씁니다.","hl":"rule"},{"n":7,"text":"첫 번째 예문입니다. The work has been finished. 뜻은 '그 일은 끝났다'예요. has been finished, has와 been과 과거분사가 차례로 오는 완료형 수동태의 전형적인 모습입니다.","hl":"ex-0"},{"n":8,"text":"두 번째 예문입니다. All the tickets have been sold out. 뜻은 '모든 표가 매진되었다'예요. 주어인 tickets가 복수라서 has가 아니라 have been이 온다는 점을 눈여겨보세요.","hl":"ex-1"},{"n":9,"text":"세 번째 예문입니다. The building had been cleaned before the guests arrived. 뜻은 '손님들이 도착하기 전에 그 건물은 청소되어 있었다'예요. 손님이 도착한 때보다 더 이전에 청소가 끝나 있었으니까 had been cleaned를 쓴 거예요.","hl":"ex-2"},{"n":10,"text":"여기서 가장 많이 나오는 실수가 been을 빼먹는 거예요. The work has finished라고 하면 그 일이 뭔가를 끝낸 것처럼 되어 버립니다. 일이 끝남을 당하는 입장이니까 has been finished라고 해야 정확한 뜻이 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">조동사가 있는 수동태 — 조동사 + be + p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사가 있으면 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b> 순서로 씁니다. 조동사 뒤에는 항상 \u003cb class=\"key\">동사원형\u003c/b>이 오기 때문에 be가 그대로 쓰입니다. \u003cb class=\"key\">조동사\u003c/b>의 의미가 더해져 '~되어야 한다, ~될 수 있다'처럼 해석됩니다.\u003cdiv>\u003cspan class=\"g-formula\">조동사(can/must/should/will) + be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The rules \u003cspan class=\"fx\">must be followed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">규칙은 지켜져야 한다.\u003c/div>\u003cdiv class=\"g-note\">조동사 must 뒤에 be + p.p.가 와서 '지켜져야 한다'는 수동의 의미를 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This machine \u003cspan class=\"fx\">can be used\u003c/span> by anyone.\u003c/div>\u003cdiv class=\"g-ko\">이 기계는 누구나 사용할 수 있다.\u003c/div>\u003cdiv class=\"g-note\">조동사 can 뒤에 be + p.p.가 와서 '사용될 수 있다'는 의미가 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>조동사 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오므로 be를 그대로 씁니다. \u003cb class=\"key\">must be p.p.\u003c/b>처럼 be를 빼먹지 마세요.\u003c/div>","segs":[{"n":11,"text":"마지막은 조동사가 들어 있는 수동태예요. 조동사가 있으면 조동사 뒤에 be를 쓰고 그 뒤에 과거분사를 붙입니다. 조동사 뒤에는 언제나 동사원형이 오니까 be가 그대로 오는 거죠. 그래서 must be followed는 '지켜져야 한다', can be used는 '사용될 수 있다'로 해석됩니다. 조동사의 뜻에 수동의 뜻이 얹힌다고 이해하면 됩니다.","hl":"rule"},{"n":12,"text":"예문입니다. The rules must be followed. 뜻은 '규칙은 지켜져야 한다'예요. must 다음에 be, 그다음에 과거분사 followed가 오는 조동사 수동태의 기본 형태입니다.","hl":"ex-0"},{"n":13,"text":"두 번째 예문입니다. This machine can be used by anyone. 뜻은 '이 기계는 누구나 사용할 수 있다'예요. can 뒤에 be used가 와서 '사용될 수 있다'는 수동의 의미를 만들어 주고 있어요.","hl":"ex-1"},{"n":14,"text":"조동사가 나오면 뒤에는 무조건 동사원형이 온다는 규칙만 기억하세요. 그래서 must be followed처럼 be가 그대로 오는 겁니다. must followed처럼 be를 빼먹으면 문장이 성립하지 않으니 꼭 확인하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The bridge is repairing now.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The bridge is being repaired now.\u003c/div>\u003cdiv class=\"g-why\">진행형 수동태는 be + being + p.p.인데 being과 p.p.를 갖추지 않아 능동의 진행형처럼 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The work has finished.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The work has been finished.\u003c/div>\u003cdiv class=\"g-why\">완료형 수동태에는 been이 필요하며, has finished는 능동의 현재완료가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The rules must followed.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The rules must be followed.\u003c/div>\u003cdiv class=\"g-why\">조동사가 있는 수동태는 조동사 + be + p.p.이므로 be가 반드시 들어가야 합니다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"첫 번째 실수는 being을 빠뜨리는 경우예요. The bridge is repairing now라고 하면 다리가 직접 뭔가를 수리하는 것처럼 들립니다. 다리는 수리되는 입장이니까 is being repaired라고 해야 정확해요.","hl":"mk-0"},{"n":16,"text":"두 번째는 완료형 수동태에서 been을 빼먹는 실수예요. The work has finished라고 하면 그 일이 스스로 뭔가를 끝낸 것처럼 되어 버립니다. 일은 끝남을 당하는 쪽이니까 has been finished라고 해야 합니다.","hl":"mk-1"},{"n":17,"text":"세 번째는 조동사 뒤에서 be를 빼먹는 경우예요. 조동사 뒤에는 동사원형이 오니까 must be followed처럼 be를 꼭 넣어 주세요. must followed라고 하면 문장이 아예 성립하지 않아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 가장 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The bridge ____ now.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>is repairing\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>is being repaired\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>has been repaired\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>must be repaired\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is being repaired\u003c/span>\u003cdiv class=\"g-exp\">now가 있어 '지금 수리되고 있는 중'이라는 진행의 의미가 필요하고, 다리는 수리되는 대상이므로 be + being + p.p. 형태를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제입니다. The bridge, 빈칸, now. 빈칸에 들어갈 말로 가장 알맞은 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 두 번째 보기예요. is being repaired입니다. now가 있으니까 지금 수리되고 있는 중이라는 진행의 의미가 필요하고, 다리는 수리되는 대상이니까 수동태가 되어야 합니다. 그래서 be 동사 뒤에 being과 과거분사가 함께 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 조건에 맞게 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">The work ____ finished. (현재완료 수동태)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">has been\u003c/span>\u003cdiv class=\"g-exp\">완료형 수동태는 have/has/had + been + p.p.이며, 주어 The work가 단수이므로 has been을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제입니다. The work, 빈칸, finished. 현재완료 수동태가 되도록 빈칸을 채워 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 has been이에요. 완료형 수동태는 have, has, had 뒤에 been과 과거분사가 오는 구조죠. 주어인 The work가 단수라서 has been을 쓰고 뒤에 finished가 이어집니다. 그래서 The work has been finished, '그 일은 끝났다'가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The rules must followed.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The rules must be followed.\u003c/span>\u003cdiv class=\"g-exp\">조동사가 있는 수동태는 조동사 + be + p.p. 순서이므로 must 뒤에 be가 필요합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제입니다. The rules must followed. 이 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 The rules must be followed예요. 조동사 must 뒤에는 동사원형이 오고, 그 뒤에 be와 과거분사가 이어져야 수동의 의미가 완성됩니다. 그래서 must와 followed 사이에 be를 꼭 넣어 주셔야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">is / The / repaired / being / bridge\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The bridge is being repaired.\u003c/span>\u003cdiv class=\"g-exp\">진행형 수동태는 be + being + p.p. 순서이므로 The bridge is being repaired로 배열합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제입니다. is, The, repaired, being, bridge 이 다섯 단어를 모두 사용해서 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 The bridge is being repaired예요. 주어 The bridge 다음에 be 동사 is, 그다음에 being과 과거분사 repaired가 오는 순서입니다. 진행형 수동태의 공식, be + being + p.p.를 그대로 따라 배열하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">진행형 수동태의 올바른 형태를 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>be + p.p.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>be + being + p.p.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>have + been + p.p.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>조동사 + p.p.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">be + being + p.p.\u003c/span>\u003cdiv class=\"g-exp\">진행형 수동태는 be + being + p.p.이고, have + been + p.p.는 완료형 수동태입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제입니다. 진행형 수동태의 올바른 형태를 보기에서 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 두 번째 보기, be + being + p.p.예요. 진행의 느낌을 살리려고 being이 하나 더 들어가는 것이죠. 세 번째 보기인 have + been + p.p.는 완료형 수동태의 형태라서 헷갈리면 안 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 조동사를 사용한 수동태로 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">규칙은 지켜져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The rules must be followed.\u003c/span>\u003cdiv class=\"g-exp\">조동사 must를 사용한 수동태는 must + be + p.p.이므로 must be followed로 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제입니다. '규칙은 지켜져야 한다'를 조동사를 사용한 수동태로 영작해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 The rules must be followed예요. '지켜져야 한다'에는 must의 의미가 들어가고, 규칙은 지켜지는 대상이니까 수동태가 됩니다. 그래서 must be followed, 조동사 뒤에 be와 과거분사를 차례로 써 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 03 동사의 태 | Unit 014 진행형 수동태 &amp; 완료형 수동태\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>진행형 수동태는 \u003cb class=\"key\">be + being + p.p.\u003c/b>로 '~되고 있는 중이다'를 뜻합니다.\u003c/li>\u003cli>완료형 수동태는 \u003cb class=\"key\">have/has/had + been + p.p.\u003c/b> 형태입니다.\u003c/li>\u003cli>조동사가 있으면 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b> 순서로 씁니다.\u003c/li>\u003cli>being과 \u003cb class=\"key\">been\u003c/b>을 빠뜨리면 뜻이 달라지니 문장을 쓸 때 꼭 확인하세요.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 진행형 수동태와 완료형 수동태를 배웠어요. 진행형 수동태는 be 뒤에 being과 과거분사를 붙여서 '되고 있는 중'이라는 뜻을 만들고, 완료형 수동태는 have, has, had 뒤에 been과 과거분사를 붙인다고 정리하면 됩니다. 조동사가 나오면 조동사 뒤에 be와 과거분사를 쓰는 것도 잊지 마세요. being과 been 하나만 놓치지 않아도 오늘 배운 문장은 실수 없이 만들 수 있을 거예요. 모두 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
