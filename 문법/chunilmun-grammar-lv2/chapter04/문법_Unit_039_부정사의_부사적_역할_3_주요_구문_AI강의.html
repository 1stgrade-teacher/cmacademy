}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 39 부정사의 부사적 역할 3: 주요 구문","title":"부정사의 부사적 역할 3: 주요 구문","audioDir":"문법_Unit_039_부정사의_부사적_역할_3_주요_구문_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 039 부정사의 부사적 역할 3: 주요 구문\u003c/div>\u003ch1>부정사의 부사적 역할 3: 주요 구문\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>too ~ to V, enough to V, so ~ as to V, 독립부정사, seem/appear to V의 구조와 의미를 예문으로 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 부정사의 부사적 역할 중에서 시험에 자주 나오는 주요 구문을 정리해 볼 거예요. too와 enough, so as to, 그리고 독립부정사와 seem, appear 구문까지 예문으로 차근차근 익혀 봅시다. 뜻을 먼저 잡고 구조를 확인하면 문제 풀이가 훨씬 쉬워질 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">too + 형용사/부사 + to V\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">too\u003c/b> + 형용사/부사 + \u003cb class=\"key\">to V\u003c/b>는 '너무 ~해서 …할 수 없다'라는 뜻이에요. \u003cb class=\"key\">형용사\u003c/b>나 부사 앞에 too를 두고, 그 뒤에 to부정사를 붙여 결과를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">too + [[형용사/부사]] + to V\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The box is \u003cspan class=\"fx\">too heavy to carry\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 상자는 너무 무거워서 들 수 없다.\u003c/div>\u003cdiv class=\"g-note\">too 뒤에 형용사 heavy가 오고 to carry가 결과를 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He was \u003cspan class=\"fx\">too tired to finish\u003c/span> the work.\u003c/div>\u003cdiv class=\"g-ko\">그는 너무 피곤해서 그 일을 끝낼 수 없었다.\u003c/div>\u003cdiv class=\"g-note\">too 뒤에 형용사 tired가 오고 to finish가 결과를 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>too ~ to V에서 to부정사의 목적어가 주어와 같으면 \u003cb class=\"key\">목적어\u003c/b>를 반복하지 않아요.\u003c/div>","segs":[{"n":2,"text":"too 뒤에 형용사나 부사를 두고 to부정사를 붙이면 너무해서 할 수 없다는 뜻이 돼요. 예를 들어 too heavy to carry는 너무 무거워서 들 수 없다는 뜻이죠. 여기서 too는 형용사 heavy를 꾸며 주고 to carry는 그 결과를 설명해 줘요. 그래서 too 뒤에는 형용사나 부사, 그 뒤에는 to부정사가 온다고 기억하면 됩니다.","hl":"rule"},{"n":3,"text":"이 예문은 The box is too heavy to carry. 입니다. 뜻은 그 상자는 너무 무거워서 들 수 없다는 거예요. too heavy to carry 부분에서 too가 heavy를 꾸미고 to carry가 할 수 없다는 결과를 보여 줍니다.","hl":"ex-0"},{"n":4,"text":"이 예문은 He was too tired to finish the work. 입니다. 뜻은 그는 너무 피곤해서 그 일을 끝낼 수 없었다는 거예요. too tired to finish에서 too가 tired를 꾸미고 to finish가 끝낼 수 없다는 결과를 나타냅니다.","hl":"ex-1"},{"n":5,"text":"too to 구문에서 to부정사 뒤의 목적어가 주어와 같으면 목적어를 반복하지 않아요. The box is too heavy to carry라고 하지, carry 뒤에 it을 붙이지는 않습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">형용사/부사 + enough to V\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">enough\u003c/b> to V는 '…할 만큼 충분히 ~한'이라는 뜻이에요. enough는 꾸밈을 받는 \u003cb class=\"key\">형용사\u003c/b>나 \u003cb class=\"key\">부사\u003c/b> 뒤에 놓고, 그 뒤에 to부정사를 붙입니다.\u003cdiv>\u003cspan class=\"g-formula\">형용사/부사 + [[enough]] + to V\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is \u003cspan class=\"fx\">old enough to drive\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 운전할 만큼 충분히 나이가 들었다.\u003c/div>\u003cdiv class=\"g-note\">enough가 형용사 old 뒤에 와서 '운전할 만큼 충분히 나이가 든'을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The room is \u003cspan class=\"fx\">bright enough to read in\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 방은 책을 읽을 만큼 충분히 밝다.\u003c/div>\u003cdiv class=\"g-note\">enough가 형용사 bright 뒤에 와서 '읽을 만큼 충분히 밝은'을 만듭니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>enough는 \u003cb class=\"key\">형용사/부사\u003c/b> 뒤에 오고, too는 \u003cb class=\"key\">형용사/부사\u003c/b> 앞에 온다는 차이를 기억하세요.\u003c/div>","segs":[{"n":6,"text":"enough to부정사는 할 만큼 충분히 그렇다는 뜻을 만들어요. 중요한 건 enough의 위치인데요, 형용사나 부사 뒤에 enough가 와야 해요. 예를 들어 old enough to drive는 운전할 만큼 충분히 나이가 들었다는 뜻이죠. enough가 old 뒤에 온다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":7,"text":"이 예문은 She is old enough to drive. 입니다. 뜻은 그녀는 운전할 만큼 충분히 나이가 들었다는 거예요. old enough to drive에서 enough가 old 뒤에 와서 충분히 나이가 들었다는 의미를 만들어 줍니다.","hl":"ex-0"},{"n":8,"text":"이 예문은 The room is bright enough to read in. 입니다. 뜻은 그 방은 책을 읽을 만큼 충분히 밝다는 거예요. bright enough to read in에서 enough가 bright 뒤에 와서 읽을 만큼 충분히 밝다는 의미를 보여 줍니다.","hl":"ex-1"},{"n":9,"text":"too는 형용사 앞에 오지만 enough는 형용사 뒤에 온다는 차이가 있어요. 그래서 too old와 old enough처럼 위치를 헷갈리지 않도록 꼭 비교해서 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">so ~ as to V와 독립부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">so ~ as to V\u003c/b>는 '…할 정도로 ~하게'라는 뜻으로, so 뒤에 형용사나 부사가 옵니다. \u003cb class=\"key\">독립부정사\u003c/b>는 문장 전체를 꾸미는 to부정사로, to tell the truth, to be sure, to begin with, needless to say, strange to say 등이 있어요.\u003cdiv>\u003cspan class=\"g-formula\">[[so]] + 형용사/부사 + [[as to V]]\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To tell the truth\u003c/span>, I forgot.\u003c/div>\u003cdiv class=\"g-ko\">사실대로 말하면 나는 잊어버렸다.\u003c/div>\u003cdiv class=\"g-note\">To tell the truth는 문장 전체를 꾸미는 독립부정사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He was \u003cspan class=\"fx\">so kind as to help\u003c/span> me.\u003c/div>\u003cdiv class=\"g-ko\">그는 나를 도와줄 정도로 친절했다.\u003c/div>\u003cdiv class=\"g-note\">so와 as to 사이에 형용사 kind가 들어간 구문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">To be sure\u003c/span>, this is not easy.\u003c/div>\u003cdiv class=\"g-ko\">확실히 말하자면, 이것은 쉽지 않다.\u003c/div>\u003cdiv class=\"g-note\">To be sure도 문장 전체를 꾸미는 독립부정사예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>독립부정사에는 to tell the truth, to be sure, to begin with, needless to say, strange to say 등이 있으며, 문장 앞에서 \u003cb class=\"key\">문장 전체\u003c/b>를 꾸밉니다.\u003c/div>","segs":[{"n":10,"text":"so와 as to 사이에 형용사나 부사를 넣으면 어느 정도로 그런지를 말할 수 있어요. 예를 들어 so kind as to help는 도와줄 정도로 친절한이라는 뜻이 됩니다. 독립부정사는 문장 앞에 놓여서 말하는 사람의 태도를 나타내요. to tell the truth는 사실대로 말하면, to be sure는 확실히 말하자면처럼 문장 전체를 꾸며 줍니다.","hl":"rule"},{"n":11,"text":"이 예문은 To tell the truth, I forgot. 입니다. 뜻은 사실대로 말하면 나는 잊어버렸다는 거예요. To tell the truth는 문장 전체를 꾸미면서 사실대로 말하자면이라는 태도를 보여 주는 독립부정사입니다.","hl":"ex-0"},{"n":12,"text":"이 예문은 He was so kind as to help me. 입니다. 뜻은 그는 나를 도와줄 정도로 친절했다는 거예요. so kind as to help에서 so와 as to 사이에 형용사 kind가 들어가서 어느 정도로 친절한지를 나타냅니다.","hl":"ex-1"},{"n":13,"text":"이 예문은 To be sure, this is not easy. 입니다. 뜻은 확실히 말하자면 이것은 쉽지 않다는 거예요. To be sure는 문장 전체를 꾸미는 독립부정사로 쓰였습니다.","hl":"ex-2"},{"n":14,"text":"독립부정사는 주어나 목적어로 쓰이지 않고 문장 전체를 꾸며요. to begin with는 우선 첫째로, needless to say는 말할 필요도 없이, strange to say는 이상하게도처럼 외워 두면 좋습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">seem to V와 appear to V\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">seem to V\u003c/b>와 \u003cb class=\"key\">appear to V\u003c/b>는 '~인 것 같다, ~해 보이다'라는 뜻이에요. 주어 뒤에 seem이나 appear를 두고 to부정사를 붙여 판단이나 인상을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">[[seem/appear]] + to V\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">seems to know\u003c/span> the answer.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 답을 아는 것 같다.\u003c/div>\u003cdiv class=\"g-note\">seem to V가 '~인 것 같다'는 판단을 나타내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The sky \u003cspan class=\"fx\">appears to be\u003c/span> clear.\u003c/div>\u003cdiv class=\"g-ko\">하늘은 맑은 것 같다.\u003c/div>\u003cdiv class=\"g-note\">appear to V도 '~인 것 같다, ~해 보이다'라는 뜻을 나타내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>seem to V와 appear to V 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오며, 부정은 \u003cb class=\"key\">not\u003c/b>을 to 앞에 둡니다.\u003c/div>","segs":[{"n":15,"text":"seem과 appear 뒤에 to부정사를 붙이면 무엇인가처럼 보인다는 뜻을 만들어요. 주어 뒤에 seem이나 appear를 쓰고 to부정사를 붙이면 됩니다. 예를 들어 seems to know는 아는 것 같다는 뜻이죠. appear는 seem보다 조금 더 격식 있는 표현으로 알아 두면 좋아요.","hl":"rule"},{"n":16,"text":"이 예문은 She seems to know the answer. 입니다. 뜻은 그녀는 답을 아는 것 같다는 거예요. seems to know에서 seem to부정사가 아는 것 같다는 판단을 나타냅니다.","hl":"ex-0"},{"n":17,"text":"이 예문은 The sky appears to be clear. 입니다. 뜻은 하늘은 맑은 것 같다는 거예요. appears to be에서 appear to부정사가 맑아 보인다는 인상을 나타냅니다.","hl":"ex-1"},{"n":18,"text":"seem과 appear 뒤에는 to부정사가 오고, to 뒤에는 동사원형이 와요. 부정할 때는 not을 to 앞에 두어 seem not to know처럼 쓴다는 점도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The box is too heavy to carry it.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The box is too heavy to carry.\u003c/div>\u003cdiv class=\"g-why\">too ~ to V에서 to부정사의 목적어가 주어와 같으면 it을 쓰지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She is enough old to drive.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She is old enough to drive.\u003c/div>\u003cdiv class=\"g-why\">enough는 형용사나 부사 뒤에 와야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He seems to is happy.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He seems to be happy.\u003c/div>\u003cdiv class=\"g
