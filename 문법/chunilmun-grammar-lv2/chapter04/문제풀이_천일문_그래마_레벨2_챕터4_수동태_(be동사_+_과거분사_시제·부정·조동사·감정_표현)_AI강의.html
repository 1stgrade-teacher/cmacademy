  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Actual Test 1~6번","title":"수동태 완전 정복 — be동사와 과거분사 문제풀이","audioDir":"문제풀이_천일문_그래마_레벨2_챕터4_수동태_(be동사_+_과거분사_시제·부정·조동사·감정_표현)_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">수동태 (be동사 + 과거분사 / 시제·부정·조동사·감정 표현)\u003c/div>\u003ch1>수동태 완전 정복 — be동사와 과거분사 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>6문제 · 빈칸 채우기(양자택일), 수동태 전환, 틀린 것 고르기, 틀린 부분 고치기(짝 고르기)\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 천일문 그래마, 챕터 사의 수동태 문제를 함께 풀어 볼 거예요. 수동태는 결국 비동사 다음에 과거분사를 쓰는 틀 하나만 잡으면 여섯 문제가 전부 풀린답니다. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태의 기본 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동작을 받는 목적어를 주어 자리로 올리고, 동사는 \u003cb class=\"key\">be동사+과거분사\u003c/b>로 바꾸며 행위자 앞에는 \u003cb class=\"key\">by\u003c/b>를 붙인다.\u003cdiv>\u003cspan class=\"g-formula\">주어(동작을 받는 대상) + be동사 + p.p. + by + 행위자\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 주어로 올라오면 동사는 반드시 be동사+과거분사\u003c/li>\u003cli>행위자는 by 뒤에 오고 필요 없으면 생략 가능\u003c/li>\u003cli>be동사의 시제는 원래 문장의 시제를 그대로 따른다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The cake \u003cspan class=\"fx\">was made by\u003c/span> my mom.\u003c/div>\u003cdiv class=\"g-ko\">그 케이크는 엄마에 의해 만들어졌다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"수동태는 동작을 하는 사람이 아니라 동작을 받는 대상을 문장의 주인공으로 세우는 표현이에요. 엄마가 케이크를 만들었다는 문장을 케이크가 엄마에 의해 만들어졌다고 바꾸는 거죠. 이때 동사는 반드시 비동사 다음에 과거분사가 옵니다. 그리고 동작을 한 사람은 바이 뒤에 붙여 주면 돼요. 시제는 비동사가 담당한다는 점도 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸 채우기(양자택일)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">A: Who wrote Romeo and Juliet?\u003cbr>B: It \u003cspan class=\"p-blank\">\u003c/span> by William Shakespeare.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① writes\u003c/div>\u003cdiv class=\"p-op\">② wrote\u003c/div>\u003cdiv class=\"p-op\">③ written\u003c/div>\u003cdiv class=\"p-op\">④ was wrote\u003c/div>\u003cdiv class=\"p-op\">⑤ was written\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 대화 속 빈칸을 채우는 문제예요. 빈칸 뒤에 있는 바이 윌리엄 셰익스피어, 이 부분을 먼저 눈여겨보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 다섯 번째, 워스 리튼입니다. 주어 잇이 로미오와 줄리엣을 가리키고 바이 행위자가 있으니 수동태로 써야 하고, 과거 일이니까 워스 리튼이 되는 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸 채우기(양자택일)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">A: Who wrote Romeo and Juliet?\u003cbr>B: It \u003cspan class=\"p-blank\">\u003c/span> by William Shakespeare.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① writes\u003c/div>\u003cdiv class=\"p-op\">② wrote\u003c/div>\u003cdiv class=\"p-op\">③ written\u003c/div>\u003cdiv class=\"p-op\">④ was wrote\u003c/div>\u003cdiv class=\"p-op\">⑤ was written\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">수동태 표지 찾기\u003c/b>빈칸 뒤에 \u003cb class=\"key\">by William Shakespeare\u003c/b>가 있으므로 이 문장은 \u003cb class=\"key\">수동태\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">형태 결정\u003c/b>주어 It은 Romeo and Juliet을 가리키는 동작의 대상이므로 \u003cb class=\"key\">be동사+과거분사\u003c/b>가 필요하고, write의 과거분사는 \u003cb class=\"key\">written\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">시제 맞추기\u003c/b>A가 Who \u003cb class=\"key\">wrote\u003c/b>라고 과거로 물었으므로 be동사는 과거형 \u003cb class=\"key\">was\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">선택지 확인\u003c/b>① writes는 능동 현재, ② wrote는 능동 과거, ③ written은 be동사가 빠진 형태, ④ was wrote는 과거분사 자리에 과거형이 온 오류, ⑤ was written이 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">It was written by William Shakespeare.\u003c/div>\u003cdiv class=\"p-ko\">그것은 윌리엄 셰익스피어에 의해 쓰였어.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be동사 뒤에 과거분사 대신 과거형 wrote를 쓰는 실수(④)\u003c/div>","segs":[{"n":6,"text":"먼저 빈칸 뒤를 보면 바이 윌리엄 셰익스피어가 있죠. 바이 행위자가 나오면 수동태라고 생각하면 됩니다.","hl":"st-0"},{"n":7,"text":"주어 잇은 로미오와 줄리엣을 가리키니까 글을 쓰는 쪽이 아니라 쓰이는 쪽이에요. 그래서 비동사 다음에 라이트의 과거분사인 리튼을 써야 합니다.","hl":"st-1"},{"n":8,"text":"질문에서 라이트가 아니라 로우트, 과거형을 썼죠. 그래서 답도 과거로 맞춰서 워스 리튼이 되어야 합니다.","hl":"st-2"},{"n":9,"text":"첫 번째는 능동 현재, 두 번째는 능동 과거라서 탈락이고, 세 번째는 비동사가 없어서 안 됩니다. 네 번째는 리튼 대신 로우트를 써서 틀렸고, 다섯 번째가 정답이에요.","hl":"st-3"},{"n":10,"text":"이 문제의 함정도 짚고 갈게요. be동사 뒤에 과거분사 대신 과거형 wrote를 쓰는 실수(4번)","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">수동태 전환\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 문장을 수동태로 바르게 전환한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">The actress played the main character.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① The main character played by the actress.\u003c/div>\u003cdiv class=\"p-op\">② The main character was played the actress.\u003c/div>\u003cdiv class=\"p-op\">③ The main character is played by the actress.\u003c/div>\u003cdiv class=\"p-op\">④ The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-op\">⑤ The actress was played by the main character.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 능동 문장을 수동태로 바꾸는 문제예요. 목적어가 무엇인지, 시제가 언제인지 두 가지만 확인하면 됩니다.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 네 번째예요. 목적어였던 더 메인 캐릭터가 주어로 올라가고, 과거 시제니까 워스 플레이드 바이 디 액트레스가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">수동태 전환\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 문장을 수동태로 바르게 전환한 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">The actress played the main character.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① The main character played by the actress.\u003c/div>\u003cdiv class=\"p-op\">② The main character was played the actress.\u003c/div>\u003cdiv class=\"p-op\">③ The main character is played by the actress.\u003c/div>\u003cdiv class=\"p-op\">④ The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-op\">⑤ The actress was played by the main character.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">목적어 찾기\u003c/b>동사 played의 동작을 받는 목적어는 \u003cb class=\"key\">the main character\u003c/b>이므로 이것이 수동태의 주어가 된다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">형태 결정\u003c/b>주어 뒤에 \u003cb class=\"key\">was played\u003c/b>를 쓰고 행위자인 the actress를 \u003cb class=\"key\">by\u003c/b> 뒤에 붙인다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">시제 확인\u003c/b>원문이 과거시제이므로 현재형 is가 아니라 과거형 \u003cb class=\"key\">was\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">선택지 확인\u003c/b>①은 be동사가 없고, ②는 by가 빠졌고, ③은 현재시제라 틀리며, ⑤는 주어와 행위자가 뒤바뀌었다. ④가 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">The main character was played by the actress.\u003c/div>\u003cdiv class=\"p-ko\">그 주인공은 그 여배우에 의해 연기되었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be동사를 빼먹거나 by를 빠뜨리는 실수\u003c/div>","segs":[{"n":14,"text":"먼저 동사 플레이드의 동작을 받는 쪽이 누구인지 찾아보세요. 주인공이 연기되는 쪽이니까 더 메인 캐릭터가 주어 자리로 올라갑니다.","hl":"st-0"},{"n":15,"text":"주어 다음에는 비동사와 과거분사, 즉 워스 플레이드를 써 주고, 연기한 사람인 디 액트레스를 바이 뒤에 붙입니다.","hl":"st-1"},{"n":16,"text":"원래 문장이 과거 시제였죠. 그래서 이즈가 아니라 워스를 골라야 합니다.","hl":"st-2"},{"n":17,"text":"첫 번째는 비동사가 없어서 안 되고, 두 번째는 바이가 빠졌어요. 세 번째는 시제가 현재라서 틀리고, 다섯 번째는 주인공과 여배우의 자리가 뒤바뀌었죠. 그래서 네 번째가 정답입니다.","hl":"st-3"},{"n":18,"text":"이 문제의 함정도 짚고 갈게요. be동사를 빼먹거나 by를 빠뜨리는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태의 시제와 부정문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시제는 \u003cb class=\"key\">be동사\u003c/b>가 담당하므로 미래는 \u003cb class=\"key\">will be+p.p.\u003c/b>, 부정문은 \u003cb class=\"key\">be동사 뒤에 not\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">will be + p.p. / be동사 + not + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>미래 수동태는 will be completed처럼 be 뒤에 과거분사\u003c/li>\u003cli>부정은 not was가 아니라 was not[wasn't]\u003c/li>\u003cli>be동사가 이미 있으므로 did 같은 조동사를 또 쓰지 않는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The bridge \u003cspan class=\"fx\">will be finished\u003c/span> next year.\u003c/div>\u003cdiv class=\"g-ko\">그 다리는 내년에 완성될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The door \u003cspan class=\"fx\">was not opened\u003c/span>.\u003c/div>\u ⑤ 확인\u003c/b>조동사 will 뒤에 \u003cb class=\"key\">be announced\u003c/b>가 왔으므로 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ①, ④\u003c/span>\u003cdiv class=\"p-full\">① The error was caught by the software. / ④ Those unique pictures were taken by Danny.\u003c/div>\u003cdiv class=\"p-ko\">① 그 오류는 소프트웨어로 인해 발견되었다. / ④ 저 독특한 사진들은 대니에 의해 찍혔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>불규칙 과거분사(caught)와 주어의 수 일치(were)를 놓치는 실수\u003c/div>","segs":[{"n":33,"text":"첫 번째를 보면 캐치드라고 되어 있죠. 캐치의 과거분사는 코트이기 때문에 워스 코트로 고쳐야 합니다.","hl":"st-0"},{"n":34,"text":"두 번째는 편지들이 복수라서 워 딜리버드를 썼고, 시제도 과거라서 아주 정확합니다.","hl":"st-1"},{"n":35,"text":"세 번째는 머스트 비 던, 조동사 다음에 비 원형과 과거분사가 잘 왔으니 맞는 문장이에요.","hl":"st-2"},{"n":36,"text":"네 번째는 주어가 복수인데 워스를 썼어요. 이때는 워 테이큰으로 고쳐야 합니다.","hl":"st-3"},{"n":37,"text":"다섯 번째는 윌 비 어나운스트로 미래 수동태를 잘 만들었으니 맞습니다.","hl":"st-4"},{"n":38,"text":"이 문제의 함정도 짚고 갈게요. 불규칙 과거분사(caught)와 주어의 수 일치(were)를 놓치는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사가 있는 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사가 있으면 \u003cb class=\"key\">조동사+be+과거분사\u003c/b> 순서로 쓰고, be는 \u003cb class=\"key\">원형\u003c/b> 그대로 둔다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>can be used, must be done처럼 be는 항상 원형\u003c/li>\u003cli>can used나 can is used는 틀린 형태\u003c/li>\u003cli>조동사가 있어도 과거분사는 그대로 유지\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This computer \u003cspan class=\"fx\">can be used\u003c/span> by children.\u003c/div>\u003cdiv class=\"g-ko\">이 컴퓨터는 아이들에 의해 사용될 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"조동사가 들어간 수동태는 순서만 정확히 알면 아주 쉬워요. 조동사 다음에는 반드시 be 원형이 오고, 그 뒤에 과거분사가 붙습니다. 그래서 can be used는 맞지만 can used나 can is used는 틀린 표현이에요. 조동사 뒤에는 언제나 동사원형이 온다는 기본 규칙을 그대로 따라가면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기(짝 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 중 밑줄 친 (A), (B)를 바르게 고쳐 쓴 것끼리 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">• The piano in this room (A)\u003cu class=\"p-u\">play\u003c/u> by Jane.\u003cbr>• This computer (B)\u003cu class=\"p-u\">can use\u003c/u> even by little children.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① plays — can use\u003c/div>\u003cdiv class=\"p-op\">② played — can use\u003c/div>\u003cdiv class=\"p-op\">③ be played — can used\u003c/div>\u003cdiv class=\"p-op\">④ is played — can is used\u003c/div>\u003cdiv class=\"p-op\">⑤ is played — can be used\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"다섯 번째 문제는 두 문장의 밑줄 친 부분을 알맞게 고친 짝을 찾는 문제예요. 각각 주어가 동작을 받는 대상인지 먼저 확인해 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":7},{"n":42,"text":"정답은 다섯 번째입니다. The piano는 is played, This computer는 can be used로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기(짝 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 중 밑줄 친 (A), (B)를 바르게 고쳐 쓴 것끼리 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">• The piano in this room (A)\u003cu class=\"p-u\">play\u003c/u> by Jane.\u003cbr>• This computer (B)\u003cu class=\"p-u\">can use\u003c/u> even by little children.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① plays — can use\u003c/div>\u003cdiv class=\"p-op\">② played — can use\u003c/div>\u003cdiv class=\"p-op\">③ be played — can used\u003c/div>\u003cdiv class=\"p-op\">④ is played — can is used\u003c/div>\u003cdiv class=\"p-op\">⑤ is played — can be used\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(A) 확인\u003c/b>주어 The piano는 play의 대상이고 \u003cb class=\"key\">by Jane\u003c/b>이 있으므로 수동태 \u003cb class=\"key\">is played\u003c/b>가 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(B) 확인\u003c/b>This computer는 use의 대상이고 조동사 can이 있으므로 \u003cb class=\"key\">can be used\u003c/b>가 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>①과 ②는 능동 형태라 틀리고, ③은 be played에 be동사가 없고 can used 형태도 틀리며, ④는 can is used로 be가 원형이 아니다. ⑤가 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">The piano in this room is played by Jane. / This computer can be used even by little children.\u003c/div>\u003cdiv class=\"p-ko\">이 방에 있는 그 피아노는 제인에 의해 연주된다. / 이 컴퓨터는 어린 아이들에 의해서도 사용될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>조동사 뒤 be를 is로 쓰거나 과거분사 대신 원형·과거형을 쓰는 실수\u003c/div>","segs":[{"n":43,"text":"먼저 에이 자리부터 볼게요. 피아노는 연주되는 대상이고 바이 제인이 있으니까 이즈 플레이드가 되어야 합니다.","hl":"st-0"},{"n":44,"text":"비 자리는 컴퓨터가 사용되는 대상이고 캔이 있죠. 그래서 캔 비 유즈드, 조동사 다음에 비 원형과 과거분사가 옵니다.","hl":"st-1"},{"n":45,"text":"첫 번째와 두 번째는 능동으로 남아 있어서 안 되고, 세 번째는 be played에 be동사가 빠졌고 can used도 틀려요. 네 번째는 can is used라서 be 원형이 아니죠. 그래서 다섯 번째가 정답입니다.","hl":"st-2"},{"n":46,"text":"이 문제의 함정도 짚고 갈게요. 조동사 뒤 be를 is로 쓰거나 과거분사 대신 원형·과거형을 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">감정을 나타내는 수동태 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">놀라다, 만족하다 같은 감정은 \u003cb class=\"key\">be surprised at\u003c/b>처럼 수동태 형태로 굳어져 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">be surprised at + 대상\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>surprise는 '놀라게 하다'라서 사람이 주어면 수동태\u003c/li>\u003cli>감정 표현 뒤 전치사는 at을 쓴다\u003c/li>\u003cli>시제는 be동사로 표현한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">will be surprised at\u003c/span> my gift.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 내 선물에 놀랄 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":47,"text":"놀라다, 만족하다 같은 감정 표현은 한국어로는 능동처럼 느껴지지만 영어에서는 수동태 모양으로 굳어져 있어요. 그래서 셀 비 서프라이즈드 앳, 이렇게 비동사와 과거분사, 그리고 전치사 앳을 한 덩어리로 외워 두면 좋습니다. 미래를 말할 때는 윌 비 서프라이즈드 앳처럼 비동사 자리에 시제를 실어 주면 돼요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기(짝 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 (A), (B)를 바르게 고쳐 쓴 것끼리 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">• My offer (A)\u003cu class=\"p-u\">didn’t accept\u003c/u> by Mr. Smith.\u003cbr>• She (B)\u003cu class=\"p-u\">will surprise with\u003c/u> my gift.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① wasn’t accept — will surprised at\u003c/div>\u003cdiv class=\"p-op\">② wasn’t accepted — will surprised at\u003c/div>\u003cdiv class=\"p-op\">③ wasn’t accepted — will be surprised at\u003c/div>\u003cdiv class=\"p-op\">④ wasn’t be accepted — will be surprised in\u003c/div>\u003cdiv class=\"p-op\">⑤ wasn’t be accepted — will is surprised in\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":48,"text":"마지막 문제도 밑줄 친 부분을 고친 짝을 찾는 문제예요. 부정문에서 낫의 위치와 감정 표현의 모양을 눈여겨보세요.","hl":"q"},{"n":49,"text":"","hl":"q","pause":7},{"n":50,"text":"정답은 세 번째예요. 워즌트 억셉티드로 쓰고, 놀라다는 비 서프라이즈드 앳이니까 윌 비 서프라이즈드 앳이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기(짝 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 (A), (B)를 바르게 고쳐 쓴 것끼리 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">• My offer (A)\u003cu class=\"p-u\">didn’t accept\u003c/u> by Mr. Smith.\u003cbr>• She (B)\u003cu class=\"p-u\">will surprise with\u003c/u> my gift.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① wasn’t accept — will surprised at\u003c/div>\u003cdiv class=\"p-op\">② wasn’t accepted — will surprised at\u003c/div>\u003cdiv class=\"p-op\">③ wasn’t accepted — will be surprised at\u003c/div>\u003cdiv class=\"p-op\">④ wasn’t be accepted — will be surprised in\u003c/div>\u003cdiv class=\"p-op\">⑤ wasn’t be accepted — will is surprised in\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(A) 확인\u003c/b>My offer는 accept의 대상이고 \u003cb class=\"key\">by Mr. Smith\u003c/b>가 있으므로 과거 수동태 부정문 \u003cb class=\"key\">wasn’t accepted\u003c/b>가 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(B) 확인\u003c/b>'~에 놀라다'는 \u003cb class=\"key\">be surprised at\u003c/b>이므로 미래형 \u003cb class=\"key\">will be surprised at\u003c/b>이 알맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>①은 wasn’t accept로 과거분사가 아니고, ②는 will surprised at에 be가 빠졌으며, ④와 ⑤는 wasn’t be accepted라는 틀린 형태이고 전치사도 in으로 잘못됐다. ③이 알맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">My offer wasn’t accepted by Mr. Smith. / She will be surprised at my gift.\u003c/div>\u003cdiv class=\"p-ko\">내 제안은 스미스 씨에게 받아들여지지 않았다. / 그녀는 내 선물에 놀랄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>수동태 부정문에 be를 두 번 쓰거나, 감정 표현의 전치사를 in으로 쓰는 실수\u003c/div>","segs":[{"n":51,"text":"에이 자리부터 볼게요. 내 제안은 받아들여지는 대상이고 바이 미스터 스미스가 있으니 과거 수동태 부정문, 워즌트 억셉티드가 되어야 합니다.","hl":"st-0"},{"n":52,"text":"비 자리는 놀라다라는 감정 표현이죠. 놀라다는 비 서프라이즈드 앳으로 굳어져 있어서 윌 비 서프라이즈드 앳이 됩니다.","hl":"st-1"},{"n":53,"text":"첫 번째는 억셉트 원형이라서 틀리고, 두 번째는 윌 서프라이즈드 앳이라 비동사가 빠졌어요. 네 번째와 다섯 번째는 워즌트 비 억셉티드라는 말이 안 되는 형태에 전치사도 인으로 잘못 썼죠. 그래서 세 번째가 정답입니다.","hl":"st-2"},{"n":54,"text":"이 문제의 함정도 짚고 갈게요. 수동태 부정문에 be를 두 번 쓰거나, 감정 표현의 전치사를 in으로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">수동태 (be동사 + 과거분사 / 시제·부정·조동사·감정 표현)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>수동태는 \u003cb class=\"key\">be동사+과거분사\u003c/b>, 행위자는 \u003cb class=\"key\">by\u003c/b> 뒤에 둔다.\u003c/li>\u003cli>시제는 be동사가 담당하므로 미래는 \u003cb class=\"key\">will be+p.p.\u003c/b>, 부정은 \u003cb class=\"key\">be동사+not+p.p.\u003c/b>이다.\u003c/li>\u003cli>조동사가 있으면 \u003cb class=\"key\">조동사+be(원형)+p.p.\u003c/b> 순서를 지킨다.\u003c/li>\u003cli>불규칙 과거분사(caught)와 주어의 수(were)를 반드시 확인한다.\u003c/li>\u003cli>감정 표현은 \u003cb class=\"key\">be surprised at\u003c/b>처럼 수동태 모양으로 굳어져 있다.\u003c/li>\u003c/ul>","segs":[{"n":55,"text":"오늘 여섯 문제를 풀면서 확인한 핵심은 딱 하나예요. 수동태는 비동사 다음에 과거분사, 그리고 행위자는 바이 뒤에 둔다, 이 틀만 기억하면 됩니다. 여기에 시제는 비동사가 맡는다는 것, 조동사가 있으면 비 원형을 쓴다는 것까지 챙겨 두세요. 다음 시간에도 좋은 문제로 만나요, 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
