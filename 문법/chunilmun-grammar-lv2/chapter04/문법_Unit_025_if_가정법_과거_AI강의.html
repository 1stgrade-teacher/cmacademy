}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 25 if 가정법 과거","title":"if 가정법 과거 — 지금과 반대되는 상황을 상상하는 법","audioDir":"문법_Unit_025_if_가정법_과거_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 025 if 가정법 과거\u003c/div>\u003ch1>if 가정법 과거 — 지금과 반대되는 상황을 상상하는 법\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>if 가정법 과거의 형태(if + 과거형, 주절 + would/could/might + 동사원형)를 이해하고 예문에 직접 적용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 if 가정법 과거를 함께 공부해 볼 거예요. 지금 사실과 반대되는 상황을 상상할 때 쓰는 표현인데요, 형태는 과거인데 뜻은 현재라는 점이 가장 중요한 포인트예요. 오늘 if절과 주절에 어떤 형태가 오는지 정확히 잡아 보고, 예문과 문제로 바로 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">현재 사실의 반대를 가정하는 if\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거는 \u003cb class=\"key\">현재 사실의 반대\u003c/b>를 가정할 때 씁니다. if절에는 동사의 \u003cb class=\"key\">과거형\u003c/b>을 쓰고, 주절에는 would/could/might + \u003cb class=\"key\">동사원형\u003c/b>을 씁니다. 여기서 과거형은 실제 과거가 아니라 현재 사실과 반대라는 의미를 담고 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + 과거형, S + would/could/might + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I knew his number, I would call him\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내가 그의 번호를 안다면 전화할 텐데.\u003c/div>\u003cdiv class=\"g-note\">실제로는 번호를 모르기 때문에 if절에 과거형 knew를 써서 현재 사실의 반대를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I had a car\u003c/span>, I would drive you home.\u003c/div>\u003cdiv class=\"g-ko\">내가 차가 있다면 너를 집까지 태워다 줄 텐데.\u003c/div>\u003cdiv class=\"g-note\">have의 과거형 had를 써서 지금 차가 없다는 사실의 반대를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>해석할 때는 실제로 일어난 일이 아니라 \u003cb class=\"key\">현재 사실의 반대\u003c/b>를 상상하는 것이므로 '만약 ~라면 ~할 텐데'로 마무리하세요.\u003c/div>","segs":[{"n":2,"text":"가정법 과거는 지금 사실과 반대되는 상황을 상상할 때 쓰는 표현이에요. if절에는 동사의 과거형을 쓰고, 주절에는 would나 could, might 뒤에 동사원형을 붙여 주시면 됩니다. 여기서 과거형은 실제로 과거 일을 말하는 게 아니라 지금 사실과 반대라는 느낌을 담고 있어요. 그래서 형태는 과거지만 해석은 현재로 해 주시면 됩니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 If I knew his number, I would call him, 내가 그의 번호를 안다면 전화할 텐데, 라는 뜻이에요. 지금은 번호를 모르는 상황이니까 if절에 know가 아니라 과거형 knew를 썼어요. 주절에는 would 뒤에 동사원형 call이 온 것까지 함께 확인해 주세요.","hl":"ex-0"},{"n":4,"text":"이 예문은 If I had a car, I would drive you home, 내가 차가 있다면 너를 집까지 태워다 줄 텐데, 라는 뜻이에요. 지금은 차가 없지만 있다고 가정한 거라서 have의 과거형 had를 썼어요. 주절에는 would 다음에 동사원형 drive가 왔다는 점도 같이 봐 주세요.","hl":"ex-1"},{"n":5,"text":"해석할 때는 실제로 일어난 일이 아니라 현재 사실의 반대를 상상하는 것이니까, 만약 이라면 할 텐데, 로 마무리해 주시면 자연스러워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">if절의 be동사는 were\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if절에 \u003cb class=\"key\">be동사\u003c/b>가 들어가면 주어가 I나 he, she여도 인칭에 관계없이 \u003cb class=\"key\">were\u003c/b>를 씁니다. 다만 \u003cb class=\"key\">구어체\u003c/b>에서는 was를 쓰기도 합니다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + were ..., S + would/could/might + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If she were here\u003c/span>, she could help us.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 여기 있다면 우리를 도울 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">주어가 she인데도 if절의 be동사로 was가 아니라 were를 썼습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If he were taller\u003c/span>, he could join the basketball team.\u003c/div>\u003cdiv class=\"g-ko\">그가 키가 더 크다면 농구부에 들어갈 수 있을 텐데.\u003c/div>\u003cdiv class=\"g-note\">주어가 he여도 if절의 be동사는 were를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>격식 있는 글쓰기나 시험에서는 \u003cb class=\"key\">were\u003c/b>를 쓰는 것이 안전하고, \u003cb class=\"key\">was\u003c/b>는 구어체에서만 허용된다는 점을 기억하세요.\u003c/div>","segs":[{"n":6,"text":"이번에는 if절에 be동사가 들어갈 때를 볼게요. 이때는 주어가 I든 he든 she든 상관없이 were를 써 주시면 됩니다. 물론 회화에서는 was를 쓰는 경우도 있지만 원칙은 were라는 점을 기억해 주세요. 시험이나 격식 있는 글에서는 were를 쓰는 것이 안전합니다.","hl":"rule"},{"n":7,"text":"두 번째 예문은 If she were here, she could help us, 그녀가 여기 있다면 우리를 도울 수 있을 텐데, 라는 뜻이에요. 주어가 she인데도 be동사로 was가 아니라 were를 썼다는 점이 핵심이에요. 주절에서는 could 뒤에 동사원형 help가 온 것도 함께 봐 주세요.","hl":"ex-0"},{"n":8,"text":"이 예문은 If he were taller, he could join the basketball team, 그가 키가 더 크다면 농구부에 들어갈 수 있을 텐데, 라는 뜻이에요. 주어가 he인데도 were를 썼죠. be동사는 인칭에 상관없이 were라고 기억해 두시면 좋겠어요.","hl":"ex-1"},{"n":9,"text":"글을 쓰거나 시험을 볼 때는 were를 쓰는 게 안전하고, was는 편하게 말할 때 허용된다고 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">실현 가능성이 낮은 현재·미래 상상하기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법 과거는 현재 사실의 반대뿐 아니라 \u003cb class=\"key\">실현 가능성\u003c/b>이 낮은 현재나 미래의 일을 상상할 때도 씁니다. \u003cb class=\"key\">복권 당첨\u003c/b>처럼 일어나기 어려운 상황을 떠올리면 자연스럽게 쓸 수 있습니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">If I won the lottery\u003c/span>, I would travel the world.\u003c/div>\u003cdiv class=\"g-ko\">내가 복권에 당첨된다면 세계를 여행할 텐데.\u003c/div>\u003cdiv class=\"g-note\">미래의 일이지만 실현 가능성이 낮기 때문에 if절에 과거형 won을 썼습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>일어날 가능성이 높은 일에는 if절에 \u003cb class=\"key\">현재 시제\u003c/b>를 쓰고 주절에 will을 쓰니, \u003cb class=\"key\">가정법 과거\u003c/b>와 구별하세요.\u003c/div>","segs":[{"n":10,"text":"가정법 과거는 지금 사실과 반대일 때만 쓰는 게 아니에요. 앞으로 일어날 가능성이 아주 낮은 일을 상상할 때도 씁니다. 복권에 당첨된다거나 갑자기 유명해진다거나, 그런 일어나기 힘든 상황을 떠올리면 자연스러워요. 가능성이 낮다는 느낌을 과거형으로 표현한다고 이해하시면 됩니다.","hl":"rule"},{"n":11,"text":"세 번째 예문은 If I won the lottery, I would travel the world, 내가 복권에 당첨된다면 세계를 여행할 텐데, 라는 뜻이에요. 복권 당첨은 미래의 일이지만 가능성이 아주 낮죠. 그래서 if절에 will이 아니라 과거형 won을 쓰고, 주절에는 would를 쓴 거예요.","hl":"ex-0"},{"n":12,"text":"반대로 비가 오면 이라는 것처럼 가능성이 높은 일에는 if절에 현재 시제를 쓰고 주절에 will을 써요. 오늘 배운 가정법 과거와 헷갈리지 않게 비교해 보세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I know his number, I would call him.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I knew his number, I would call him.\u003c/div>\u003cdiv class=\"g-why\">현재 사실의 반대를 가정하므로 if절에는 현재형 know가 아니라 과거형 knew를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If she is here, she could help us.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If she were here, she could help us.\u003c/div>\u003cdiv class=\"g-why\">if절의 be동사는 인칭에 관계없이 were를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>If I won the lottery, I will travel the world.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ If I won the lottery, I would travel the world.\u003c/div>\u003cdiv class=\"g-why\">if절이 과거형이면 주절에는 will이 아니라 would + 동사원형을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":13,"text":"많이 틀리는 문장인데요, 주절에 would가 있으면 if절도 짝을 맞춰 과거형을 써야 해요. If I know his number, I would call him이라고 하면 if절과 주절의 시제가 어긋나죠. If I knew his number, I would call him으로 고쳐 주세요.","hl":"mk-0"},{"n":14,"text":"가정법 과거에서 if절에 be동사가 오면 is나 was가 아니라 were를 써요. 주어가 she라고 해서 is를 쓰면 지금 사실과 반대라는 의미가 살지 않아요. If she were here, she could help us가 맞습니다.","hl":"mk-1"},{"n":15,"text":"if절에 과거형 won이 왔는데 주절에 will을 쓰면 짝이 맞지 않아요. 가정법 과거에서는 주절에 would나 could, might를 써야 합니다. If I won the lottery, I would travel the world로 고쳐 주세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">If I ____ his number, I would call him.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>know\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>knew\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>will know\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>have known\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">knew\u003c/span>\u003cdiv class=\"g-exp\">주절에 would call이 있으므로 if절에는 과거형 knew가 와야 가정법 과거가 완성됩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제는 빈칸 채우기예요. If I blank his number, I would call him, 빈칸에 들어갈 말을 네 가지 보기에서 골라 주세요. 보기는 know, knew, will know, have known입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 두 번째 보기인 knew예요. 주절에 would call이 있으니까 if절에도 과거형 knew를 써서 짝을 맞춰야 해요. know나 will know를 쓰면 지금 사실과 반대라는 의미가 살지 않습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 be동사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">If she ____ here, she could help us.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were\u003c/span>\u003cdiv class=\"g-exp\">if절의 be동사는 인칭에 관계없이 were를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"두 번째 문제는 빈칸에 be동사를 넣는 문제예요. If she blank here, she could help us, 빈칸에 알맞은 be동사를 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 were예요. 주어가 she지만 가정법 과거의 if절에서는 인칭에 상관없이 were를 씁니다. 그래서 If she were here, she could help us가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">If I won the lottery, I will travel the world.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">If I won the lottery, I would travel the world.\u003c/span>\u003cdiv class=\"g-exp\">if절이 과거형이므로 주절에는 will이 아니라 would + 동사원형을 써야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"세 번째 문제는 틀린 부분을 고치는 문제예요. If I won the lottery, I will travel the world, 이 문장에서 어색한 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 If I won the lottery, I would travel the world예요. if절에 과거형 won이 왔으니까 주절에는 will이 아니라 would를 써야 짝이 맞습니다. would 뒤에는 동사원형 travel이 오는 것도 확인해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 알맞게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">I / knew / his / number / if / I / would / call / him\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">If I knew his number, I would call him.\u003c/span>\u003cdiv class=\"g-exp\">if절이 먼저 오고, 주절에 would + 동사원형이 이어지는 구조입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"네 번째 문제는 단어 배열이에요. I, knew, his, number, if, I, would, call, him을 알맞게 배열해서 오늘 배운 가정법 과거 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 If I knew his number, I would call him이에요. if절에 과거형 knew를 쓰고, 주절에 would call을 붙이면 됩니다. 어순은 if절이 먼저, 주절이 뒤에 온다는 점을 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 가정법 과거를 사용하여 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">내가 너라면 그렇게 하지 않을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">If I were you, I wouldn't do that.\u003c/span>\u003cdiv class=\"g-exp\">if절의 be동사는 were를 쓰고, 주절에는 would not + 동사원형을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"다섯 번째 문제는 영작이에요. 내가 너라면 그렇게 하지 않을 텐데, 를 가정법 과거로 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 If I were you, I wouldn't do that이에요. If I were you는 너라면 이라는 뜻으로 자주 쓰는 표현이죠. 주절에는 would not 뒤에 동사원형 do를 붙여 주시면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 의미로 가장 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">If I won the lottery, I would travel the world.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>나는 복권에 당첨되어서 세계를 여행했다.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>나는 복권에 당첨된다면 세계를 여행할 텐데.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>나는 복권에 당첨되지 않아서 세계를 여행하지 못했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>나는 복권에 당첨되면 세계를 여행할 것이다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">나는 복권에 당첨된다면 세계를 여행할 텐데.\u003c/span>\u003cdiv class=\"g-exp\">가정법 과거는 실현 가능성이 낮은 현재·미래의 일을 상상하며 '~라면 ~할 텐데'로 해석합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"마지막 문제는 문장의 의미를 고르는 문제예요. If I won the lottery, I would travel the world, 이 문장의 뜻으로 가장 알맞은 보기를 골라 주세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 두 번째 보기예요. 가정법 과거는 실현 가능성이 낮은 일을 상상하면서 라면 할 텐데, 로 해석합니다. 첫 번째 보기처럼 이미 당첨된 일이 아니고, 네 번째 보기처럼 will로 확정된 미래도 아니라는 점을 구별해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 025 if 가정법 과거\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>가정법 과거는 \u003cb class=\"key\">현재 사실의 반대\u003c/b>를 가정하며, if절에는 \u003cb class=\"key\">과거형\u003c/b>, 주절에는 would/could/might + \u003cb class=\"key\">동사원형\u003c/b>을 씁니다.\u003c/li>\u003cli>if절의 be동사는 인칭과 관계없이 \u003cb class=\"key\">were\u003c/b>를 쓰고, \u003cb class=\"key\">구어체\u003c/b>에서는 was도 허용됩니다.\u003c/li>\u003cli>\u003cb class=\"key\">실현 가능성\u003c/b>이 낮은 현재·미래의 일을 상상할 때도 가정법 과거를 사용합니다.\u003c/li>\u003c/ul>","segs":[{"n":34,"text":"오늘은 if 가정법 과거를 공부했어요. if절에는 과거형, 주절에는 would나 could, might 뒤에 동사원형을 쓴다는 점이 가장 중요합니다. if절의 be동사는 인칭과 상관없이 were를 쓰고, 복권 당첨처럼 가능성이 낮은 일을 상상할 때도 이 표현을 쓴다는 것도 기억해 주세요. 오늘 배운 문장들을 소리 내어 여러 번 읽어 보면서 꼭 자기 것으로 만들어 보세요. 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
