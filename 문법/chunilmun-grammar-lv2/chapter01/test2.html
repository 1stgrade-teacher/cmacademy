  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Actual Test 8~15번","title":"천일문 그래마 레벨2 챕터1 문제풀이","audioDir":"test2_audio","preview":false,"count":74,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">사역동사·지각동사와 4형식 문장 전환\u003c/div>\u003ch1>천일문 그래마 레벨2 챕터1 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>8문제 · 양자택일, 의미 구별, 문장 전환(틀린 것 모두 고르기), 틀린 부분 고치기, 어법상 알맞은 문장 개수, 빈칸에 to를 쓸 수 있는 문장 찾기, 영작(어법상 알맞은 문장 찾기)\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 천일문 그래마 챕터원. 챕터 테스트 문제풀이 여덟 번째 문제부터 열다섯번째 문제까지 함께 풀어 보겠습니다. 사역동사와 지각동사의 목적격보어, make의 여러 뜻, 그리고 사형식 문장 전환을 중심으로 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">사역동사와 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">사역동사 make·let·have는 「목적어 + 동사원형」, get은 「목적어 + to부정사」를 쓴다. ask·want도 목적격보어로 to부정사를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">make/let/have + 목적어 + 동사원형 / get·ask·want + 목적어 + to부정사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>make, let, have 뒤에는 to를 쓰지 않는다.\u003c/li>\u003cli>get은 사역의 뜻일 때 to부정사를 쓴다.\u003c/li>\u003cli>ask/want는 '~에게 …해 달라고 하다/원하다'로 to부정사를 쓴다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My dad got me to stay at home.\u003c/div>\u003cdiv class=\"g-ko\">아빠는 내가 집에 있게 하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Our team leader let us help each other.\u003c/div>\u003cdiv class=\"g-ko\">팀 리더는 우리가 서로 돕도록 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 사역동사부터 볼게요. make, let, have는 목적어 뒤에 동사원형을 써서 '~가 …하도록 하다'라는 뜻을 만들어요. 반면에 get은 목적어 뒤에 to부정사를 써야 하고, ask나 want도 목적어 뒤에 to부정사를 씁니다. 그래서 같은 '하게 하다'처럼 보여도 동사마다 뒤에 오는 모양이 다르다는 점을 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 8\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 중 (A), (B)에 들어갈 말이 바르게 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">•My dad got me \u003cu class=\"p-u\">   (A)  \u003c/u>  at home because I was sick.\u003cbr>•Our team leader let us \u003cu class=\"p-u\">    (B)   \u003c/u>  each other.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① stay — help\u003c/div>\u003cdiv class=\"p-op\">② stay — helping\u003c/div>\u003cdiv class=\"p-op\">③ to stay — help\u003c/div>\u003cdiv class=\"p-op\">④ to stay — to help\u003c/div>\u003cdiv class=\"p-op\">⑤ staying — helping\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"이번 문제는 사역동사 get과 let 뒤에 목적격보어가 어떤 모양으로 오는지 묻고 있어요. 두 문장의 동사를 먼저 찾고, 그 뒤에 to가 필요한지 아닌지를 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 세 번째입니다. get은 목적어 뒤에 to부정사인 to stay를 쓰고, let은 목적어 뒤에 동사원형인 help를 쓰기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 8\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 중 (A), (B)에 들어갈 말이 바르게 짝지어진 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">•My dad got me \u003cu class=\"p-u\">   (A)  \u003c/u>  at home because I was sick.\u003cbr>•Our team leader let us \u003cu class=\"p-u\">    (B)   \u003c/u>  each other.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① stay — help\u003c/div>\u003cdiv class=\"p-op\">② stay — helping\u003c/div>\u003cdiv class=\"p-op\">③ to stay — help\u003c/div>\u003cdiv class=\"p-op\">④ to stay — to help\u003c/div>\u003cdiv class=\"p-op\">⑤ staying — helping\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">get 확인\u003c/b>get은 사역동사로 「get + 목적어 + \u003cb class=\"key\">to부정사\u003c/b>」를 쓰므로 (A)에는 \u003cb class=\"key\">to stay\u003c/b>가 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">let 확인\u003c/b>let은 「let + 목적어 + \u003cb class=\"key\">동사원형\u003c/b>」을 쓰므로 (B)에는 \u003cb class=\"key\">help\u003c/b>가 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">짝 찾기\u003c/b>(A) to stay, (B) help를 묶은 선택지는 \u003cb class=\"key\">③\u003c/b>이에요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">My dad got me to stay at home because I was sick. / Our team leader let us help each other.\u003c/div>\u003cdiv class=\"p-ko\">내가 아팠기 때문에 아빠는 내가 집에 있게 하셨다. / 우리 팀 리더는 우리가 서로 돕도록 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>get 뒤에도 let처럼 동사원형을 쓴다고 착각하지 마세요.\u003c/div>","segs":[{"n":6,"text":"먼저 첫 문장의 get을 보세요. get이 '하게 하다'로 쓰일 때는 목적어 뒤에 to부정사가 와요. 그래서 내가 집에 있게 하셨다는 뜻으로 to stay가 필요합니다.","hl":"st-0"},{"n":7,"text":"다음으로 let을 봐요. let은 목적어 뒤에 동사원형을 쓰는 대표적인 사역동사예요. 그래서 서로 돕도록 했다는 뜻으로 help가 들어갑니다.","hl":"st-1"},{"n":8,"text":"두 자리를 합치면 to stay와 help가 되고, 이 짝을 고른 선택지는 세 번째예요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. get 뒤에도 let처럼 동사원형을 쓴다고 착각하지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">make의 의미와 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">make는 목적격보어에 동사원형이 오면 '~가 …하도록 하다', 형용사·명사가 오면 '~을 …하게/로 만들다'이다. make + 간접목적어 + 직접목적어는 '~에게 …을 만들어 주다'이다.\u003cdiv>\u003cspan class=\"g-formula\">make + 목적어 + 동사원형 / make + 목적어 + 형용사·명사 / make + 사람 + 물건\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>made me get up은 사역의 의미\u003c/li>\u003cli>made the room bright는 '~하게 만들다'\u003c/li>\u003cli>made Jake the captain은 '~로 만들다'\u003c/li>\u003cli>made my parents a pancake는 '~에게 …을 만들어 주다'\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Mom made me get up early today.\u003c/div>\u003cdiv class=\"g-ko\">엄마는 오늘 내가 일찍 일어나게 하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The sunlight made the room bright.\u003c/div>\u003cdiv class=\"g-ko\">햇빛이 방을 환하게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I made my parents a pancake.\u003c/div>\u003cdiv class=\"g-ko\">나는 부모님께 팬케이크를 만들어 드렸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 make의 여러 얼굴을 정리해 볼게요. make 뒤에 목적어와 동사원형이 오면 '~가 …하도록 하다'라는 사역의 뜻이에요. 그런데 목적어 뒤에 형용사나 명사가 오면 '~을 …하게 만들다' 또는 '~을 …로 만들다'라는 뜻이 되고, 사람 뒤에 물건이 오면 '~에게 …을 만들어 주다'라는 뜻도 됩니다. 그래서 문장 구조를 먼저 보고 make의 뜻을 구별해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 8\u003c/span>\u003cspan class=\"g-kind\">의미 구별\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 중 &lt;보기&gt;의 밑줄 친 made와 같은 의미로 쓰인 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">[보기] Mom \u003cu class=\"p-u\">made\u003c/u> me get up early today.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① I made my parents a pancake for breakfast.\u003c/div>\u003cdiv class=\"p-op\">② She made several movies as a movie director.\u003c/div>\u003cdiv class=\"p-op\">③ The coach made Jake the captain of the baseball team.\u003c/div>\u003cdiv class=\"p-op\">④ The sunlight from the window made the room bright.\u003c/div>\u003cdiv class=\"p-op\">⑤ Dad made me look after my younger sister when he was out.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"이번 문제는 보기의 made와 같은 의미로 쓰인 문장을 찾는 문제예요. made 뒤에 목적어와 어떤 형태가 오는지, 그리고 그때 해석이 '하게 하다'인지 다른 뜻인지 살펴보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 다섯 번째입니다. 다섯 번째의 made도 목적어 뒤에 동사원형 look after가 와서 '내가 여동생을 돌보게 하셨다'라는 사역의 뜻이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 8\u003c/span>\u003cspan class=\"g-kind\">의미 구별\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 중 &lt;보기&gt;의 밑줄 친 made와 같은 의미로 쓰인 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">[보기] Mom \u003cu class=\"p-u\">made\u003c/u> me get up early today.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① I made my parents a pancake for breakfast.\u003c/div>\u003cdiv class=\"p-op\">② She made several movies as a movie director.\u003c/div>\u003cdiv class=\"p-op\">③ The coach made Jake the captain of the baseball team.\u003c/div>\u003cdiv class=\"p-op\">④ The sunlight from the window made the room bright.\u003c/div>\u003cdiv class=\"p-op\">⑤ Dad made me look after my younger sister when he was out.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">보기 분석\u003c/b>보기의 made는 「make + 목적어 + \u003cb class=\"key\">동사원형\u003c/b>」으로 '~가 …하도록 하다'라는 \u003cb class=\"key\">사역\u003c/b>의 의미예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">① 확인\u003c/b>①은 「make + 사람 + 물건」으로 '~에게 …을 만들어 주다'라는 뜻이라 달라요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">② 확인\u003c/b>②는 '영화를 만들었다'라는 뜻의 \u003cb class=\"key\">일반동사 make\u003c/b>예요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">③ 확인\u003c/b>③은 「make + 목적어 + 명사」로 '~를 …로 만들다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">④ 확인\u003c/b>④는 「make + 목적어 + 형용사」로 '~을 …하게 만들다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">⑤ 확인\u003c/b>⑤는 「make + 목적어 + 동사원형」으로 '~가 …하도록 하다'라는 \u003cb class=\"key\">사역\u003c/b>의 의미라서 보기와 같아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">Mom made me get up early today. / Dad made me look after my younger sister when he was out.\u003c/div>\u003cdiv class=\"p-ko\">엄마는 오늘 내가 일찍 일어나게 하셨다. / 아빠는 밖에 계실 때 내가 여동생을 돌보게 하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>made가 모두 '만들다'로만 해석된다고 생각하면 안 돼요. 구조에 따라 뜻이 달라져요.\u003c/div>","segs":[{"n":14,"text":"먼저 보기의 made를 분석해 볼게요. made 뒤에 me와 동사원형 get up이 와서 '내가 일찍 일어나게 하셨다'라는 사역의 뜻을 만들어요.","hl":"st-0"},{"n":15,"text":"첫 번째는 made 뒤에 사람과 물건이 와서 부모님께 팬케이크를 만들어 드렸다는 뜻이에요. 그래서 보기와 다릅니다.","hl":"st-1"},{"n":16,"text":"두 번째는 영화를 만들었다는 뜻으로, 사역의 의미가 아니라 실제로 무언가를 제작했다는 뜻이에요.","hl":"st-2"},{"n":17,"text":"세 번째는 Jake를 야구팀의 주장으로 만들었다는 뜻이에요. 목적어 뒤에 명사가 와서 '~로 만들다'로 해석됩니다.","hl":"st-3"},{"n":18,"text":"네 번째는 햇빛이 방을 환하게 만들었다는 뜻이에요. 목적어 뒤에 형용사 bright가 와서 '~하게 만들다'로 해석됩니다.","hl":"st-4"},{"n":19,"text":"다섯 번째는 아빠가 내가 여동생을 돌보게 하셨다는 뜻이에요. made 뒤에 목적어와 동사원형이 와서 보기와 같은 사역의 의미입니다.","hl":"st-5"},{"n":20,"text":"이 문제의 함정도 짚고 갈게요. made가 모두 '만들다'로만 해석된다고 생각하면 안 돼요. 구조에 따라 뜻이 달라져요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">4형식 문장의 전환\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">4형식 「동사 + 간접목적어 + 직접목적어」는 직접목적어를 앞세울 때 동사에 따라 전치사 to·for·of를 써서 「동사 + 직접목적어 + 전치사 + 간접목적어」로 전환한다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + IO + DO ↔ 동사 + DO + to/for/of + IO\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>간접목적어가 직접목적어 앞에 오면 전치사를 쓰지 않는다.\u003c/li>\u003cli>to는 '~에게' 방향, for는 '~을 위해'의 느낌이다.\u003c/li>\u003cli>전치사구는 직접목적어 뒤에 와야 한다.\u003c/li>\u003cli>ask a question of 사람 형태도 가능하다.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Chris sent me a package.\u003c/div>\u003cdiv class=\"g-ko\">Chris는 나에게 소포를 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I taught my friends a new card game.\u003c/div>\u003cdiv class=\"g-ko\">나는 친구들에게 새로운 카드 게임을 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Paul asked his teacher a question.\u003c/div>\u003cdiv class=\"g-ko\">Paul은 선생님께 질문을 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":21,"text":"이번에는 네 형식 문장의 전환을 정리해 볼게요. 동사 뒤에 간접목적어가 먼저 오고 직접목적어가 오는 구조를 기억하면 돼요. 직접목적어를 앞으로 보낼 때는 to나 for, 또는 ask a question처럼 of를 써서 간접목적어를 뒤로 보냅니다. 이때 전치사구를 직접목적어 앞에 두면 순서가 틀린다는 점도 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 8\u003c/span>\u003cspan class=\"g-kind\">문장 전환(틀린 것 모두 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>다음 중 문장의 전환이 알맞지 않은 것을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Don’t tell anyone my secret.\u003cbr>  → Don’t tell my secret to anyone.\u003c/div>\u003cdiv class=\"p-op\">② Paul asked his teacher a question.\u003cbr>  → Paul asked a question of his teacher.\u003c/div>\u003cdiv class=\"p-op\">③ Would you get some tissue for me?\u003cbr>  → Would you get for me some tissue?\u003c/div>\u003cdiv class=\"p-op\">④ I taught my friends a new card game.\u003cbr>  → I taught to my friends a new card game.\u003c/div>\u003cdiv class=\"p-op\">⑤ Chris sent me a package from America.\u003cbr>  → Chris sent a package from America of me.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③, ④, ⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"이번 문제는 네 형식 문장을 다른 형태로 바꿀 때 순서와 전치사가 알맞은지 묻고 있어요. 각 문장에서 간접목적어와 직접목적어가 어디로 움직였는지, 전치사가 맞는지 확인하세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":7},{"n":24,"text":"정답은 세 번째, 네 번째, 다섯 번째입니다. 세 번째는 get me some tissue가 되어야 하고, 네 번째는 teach my friends a new card game이 되어야 하며, 다섯 번째는 sent a package to me가 되어야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 8\u003c/span>\u003cspan class=\"g-kind\">문장 전환(틀린 것 모두 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>다음 중 문장의 전환이 알맞지 않은 것을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Don’t tell anyone my secret.\u003cbr>  → Don’t tell my secret to anyone.\u003c/div>\u003cdiv class=\"p-op\">② Paul asked his teacher a question.\u003cbr>  → Paul asked a question of his teacher.\u003c/div>\u003cdiv class=\"p-op\">③ Would you get some tissue for me?\u003cbr>  → Would you get for me some tissue?\u003c/div>\u003cdiv class=\"p-op\">④ I taught my friends a new card game.\u003cbr>  → I taught to my friends a new card game.\u003c/div>\u003cdiv class=\"p-op\">⑤ Chris sent me a package from America.\u003cbr>  → Chris sent a package from America of me.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">전환 원리\u003c/b>4형식은 「동사 + \u003cb class=\"key\">간접목적어\u003c/b> + \u003cb class=\"key\">직접목적어\u003c/b>」이고, 직접목적어를 앞세우면 \u003cb class=\"key\">전치사\u003c/b>를 써요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">① 확인\u003c/b>①은 tell의 4형식으로, 직접목적어 my secret을 앞세울 때 \u003cb class=\"key\">to anyone\u003c/b>을 쓰므로 알맞아요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">② 확인\u003c/b>②는 ask a question of someone 형태로 전환할 수 있어 \u003cb class=\"key\">알맞아요\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">③ 확인\u003c/b>③의 get은 「get + 사람 + 물건」 또는 「get + 물건 + for + 사람」이므로 for me를 \u003cb class=\"key\">me\u003c/b>로 고쳐야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">④ 확인\u003c/b>④의 teach는 「teach + 사람 + 물건」이므로 to my friends를 \u003cb class=\"key\">my friends\u003c/b>로 고쳐야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">⑤ 확인\u003c/b>⑤의 send는 직접목적어를 앞세울 때 \u003cb class=\"key\">to me\u003c/b>를 써야 하므로 of me가 틀려요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③, ④, ⑤\u003c/span>\u003cdiv class=\"p-full\">③ Would you get me some tissue? / ④ I taught my friends a new card game. / ⑤ Chris sent a package from America to me.\u003c/div>\u003cdiv class=\"p-ko\">③ 나에게 화장지 좀 가져다줄래? / ④ 나는 친구들에게 새로운 카드 게임을 가르쳐 주었다. / ⑤ Chris는 나에게 미국에서 소포를 보내 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>전치사구를 직접목적어 앞에 두거나 of와 to를 바꿔 쓰는 실수가 많아요.\u003c/div>","segs":[{"n":25,"text":"먼저 네 형식 문장의 기본 순서를 떠올려 보세요. 동사 뒤에 간접목적어가 먼저 오고 직접목적어가 오는 구조예요. 직접목적어를 앞으로 보낼 때는 알맞은 전치사를 써서 간접목적어를 뒤로 보냅니다.","hl":"st-0"},{"n":26,"text":"첫 번째는 tell을 쓴 문장이에요. my secret을 앞에 두고 anyone을 뒤로 보낼 때 to를 쓰면 자연스럽습니다.","hl":"st-1"},{"n":27,"text":"두 번째는 ask를 쓴 문장인데, ask a question of someone처럼 of를 써서 질문을 하는 대상을 뒤에 둘 수 있어요.","hl":"st-2"},{"n":28,"text":"세 번째는 get some tissue for me를 바꾼 모양이에요. get은 사람을 먼저 두는 형태로 get me some tissue라고 해야 자연스럽고, for me를 동사 바로 뒤에 두면 틀립니다.","hl":"st-3"},{"n":29,"text":"네 번째는 teach를 쓴 문장이에요. teach my friends a new card game처럼 사람이 먼저 와야 하고, to my friends를 동사 바로 뒤에 두면 어색합니다.","hl":"st-4"},{"n":30,"text":"다섯 번째는 send를 쓴 문장이에요. send a package from America to me처럼 받는 사람 앞에는 of가 아니라 to를 써야 합니다.","hl":"st-5"},{"n":31,"text":"이 문제의 함정도 짚고 갈게요. 전치사구를 직접목적어 앞에 두거나 of와 to를 바꿔 쓰는 실수가 많아요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">보어 자리의 형용사와 명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">make·taste 뒤의 보어가 상태를 나타내면 형용사를 쓰고, name 뒤의 목적격보어가 이름·지위를 나타내면 명사를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">make + 목적어 + 형용사 / taste + 형용사 / name + 목적어 + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>health(명사) → healthy(형용사)\u003c/li>\u003cli>make you healthy\u003c/li>\u003cli>tastes delicious\u003c/li>\u003cli>named her hamster Willie\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Fresh vegetables will make you healthy.\u003c/div>\u003cdiv class=\"g-ko\">신선한 채소는 너를 건강하게 만들어 줄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She named her hamster Willie.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 햄스터 이름을 Willie라고 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The pasta tastes delicious.\u003c/div>\u003cdiv class=\"g-ko\">그 파스타는 맛이 좋다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"마지막으로 보어 자리에 어떤 품사가 오는지 정리해 볼게요. make가 '~을 …하게 만들다'로 쓰이면 목적격보어 자리에 형용사가 와요. taste처럼 감각을 나타내는 동사 뒤에도 형용사가 오고, name 뒤에 이름이나 지위가 오면 명사를 씁니다. 그래서 health처럼 명사가 와야 할 자리인지, healthy처럼 형용사가 와야 할 자리인지 품사를 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 8\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">11\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q\">Fresh vegetables will make you health.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">health → healthy\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"이번 문제는 make 뒤에 목적어와 어떤 품사가 와야 자연스러운지 찾는 문제예요. health가 명사인지 형용사인지, 그리고 make의 뜻을 함께 생각해 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":7},{"n":35,"text":"정답은 health를 healthy로 고치는 것입니다. make가 '~을 …하게 만들다'로 쓰일 때 목적격보어 자리에는 형용사가 와야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 8\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">11\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q sm\">Fresh vegetables will make you health.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 구조\u003c/b>make 뒤에 you라는 목적어가 있고, 그 뒤 health가 목적격보어 자리예요. 이때 '건강하게'라는 \u003cb class=\"key\">상태\u003c/b>를 나타내야 해요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">품사 확인\u003c/b>health는 명사이므로 형용사 \u003cb class=\"key\">healthy\u003c/b>로 고쳐야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 health → healthy\u003c/span>\u003cdiv class=\"p-full\">Fresh vegetables will make you healthy.\u003c/div>\u003cdiv class=\"p-ko\">신선한 채소는 너를 건강하게 만들어 줄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>health와 healthy의 품사를 구별하세요.\u003c/div>","segs":[{"n":36,"text":"먼저 make 뒤의 구조를 보세요. you라는 목적어 뒤에 health가 목적격보어로 와 있어요. 여기서는 '건강하게'라는 상태를 나타내야 자연스럽습니다.","hl":"st-0"},{"n":37,"text":"health는 명사이고, healthy는 형용사예요. make가 '~을 …하게 만들다'로 쓰일 때는 목적격보어 자리에 형용사가 와야 하므로 healthy로 고쳐야 합니다.","hl":"st-1"},{"n":38,"text":"이 문제의 함정도 짚고 갈게요. health와 healthy의 품사를 구별하세요.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 8\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">12\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q\">My little sister was hungry so she asked me cook some food.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">cook → to cook\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":39,"text":"이번 문제는 ask 뒤에 목적격보어가 어떤 형태로 와야 하는지 확인하는 문제예요. me 뒤에 동사가 바로 왔을 때 ask의 문형을 떠올려 보세요.","hl":"q"},{"n":40,"text":"","hl":"q","pause":7},{"n":41,"text":"정답은 cook을 to cook으로 고치는 것입니다. ask는 목적어 뒤에 to부정사를 쓰는 동사이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 8\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">12\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q sm\">My little sister was hungry so she asked me cook some food.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ask 구조\u003c/b>ask는 「ask + 목적어 + \u003cb class=\"key\">to부정사\u003c/b>」로 '~에게 …해 달라고 부탁하다'라는 뜻을 나타내요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">고치기\u003c/b>목적격보어 자리의 동사원형 cook을 \u003cb class=\"key\">to cook\u003c/b>으로 고쳐요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 cook → to cook\u003c/span>\u003cdiv class=\"p-full\">My little sister was hungry so she asked me to cook some food.\u003c/div>\u003cdiv class=\"p-ko\">내 여동생은 배가 고파서 나에게 요리를 좀 해 달라고 부탁했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ask 뒤에도 목적격보어로 동사원형을 쓴다고 착각하지 마세요.\u003c/div>","segs":[{"n":42,"text":"먼저 ask의 문형을 떠올려 보세요. ask는 목적어 뒤에 to부정사를 써서 '~에게 …해 달라고 부탁하다'라는 뜻을 만들어요.","hl":"st-0"},{"n":43,"text":"문장에서 me 뒤에 cook이 바로 왔는데, ask의 목적격보어 자리에는 to부정사가 필요해요. 그래서 cook을 to cook으로 고쳐야 합니다.","hl":"st-1"},{"n":44,"text":"이 문제의 함정도 짚고 갈게요. ask 뒤에도 목적격보어로 동사원형을 쓴다고 착각하지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">지각동사와 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">지각동사 see·hear·feel·smell 등은 「목적어 + 동사원형」 또는 「목적어 + 현재분사」를 쓴다. 목적격보어 자리에 to부정사는 쓰지 않는다.\u003cdiv>\u003cspan class=\"g-formula\">see/hear/feel/smell + 목적어 + 동사원형[현재분사]\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동사원형은 동작 전체, 현재분사는 진행 중인 동작을 강조한다.\u003c/li>\u003cli>feel someone hold/holding O\u003c/li>\u003cli>hear her baby cry/crying O\u003c/li>\u003cli>to hold, to cry, to burn은 틀림\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I felt someone hold my hand.\u003c/div>\u003cdiv class=\"g-ko\">나는 누군가 내 손을 잡는 것을 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He heard his baby crying.\u003c/div>\u003cdiv class=\"g-ko\">그는 아기가 우는 것을 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He smelled something burning.\u003c/div>\u003cdiv class=\"g-ko\">그는 무언가 타는 냄새를 맡았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"지각동사는 눈이나 귀로 느끼는 동작을 표현하는 동사예요. see, hear, feel, smell 같은 동사 뒤에는 목적어와 동사원형이 오거나, 목적어와 현재분사가 옵니다. 동사원형은 동작 전체를, 현재분사는 진행 중인 느낌을 살리고 싶을 때 써요. 하지만 목적격보어 자리에 to부정사는 쓰지 않는다는 점을 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 8\u003c/span>\u003cspan class=\"g-kind\">어법상 알맞은 문장 개수\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">13\u003c/span>다음 중 어법상 알맞은 문장의 개수를 고르세요.\u003c/div>\u003cdiv class=\"p-q\">ⓐ Can you pass the cushion to me?\u003cbr>ⓑ I felt someone to hold my hand.\u003cbr>ⓒ She named her hamster Willie.\u003cbr>ⓓ The pasta in this restaurant tastes delicious.\u003cbr>ⓔ Peter asked the waiter bringing the bill.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" d  he arrived home.\u003c/div>\u003cdiv class=\"p-op\">③ He smelled something to burn when he arrived home.\u003c/div>\u003cdiv class=\"p-op\">④ He smelled something burning when he arrived home.\u003c/div>\u003cdiv class=\"p-op\">⑤ He smelled something to burning when he arrived home.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 찾기\u003c/b>우리말의 핵심 동사는 '냄새를 맡았다'이므로 \u003cb class=\"key\">smelled\u003c/b>를 써야 해요. '태웠다'라는 burned가 아니에요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">목적격보어\u003c/b>smell은 \u003cb class=\"key\">지각동사\u003c/b>라서 「smell + 목적어 + 동사원형/현재분사」 구조를 써요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">형태 선택\u003c/b>'무언가 타는'이라는 진행 중인 상태를 나타내므로 현재분사 \u003cb class=\"key\">burning\u003c/b>이 자연스러워요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">선택지 비교\u003c/b>④ He smelled something burning when he arrived home.만 구조와 의미가 모두 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">He smelled something burning when he arrived home.\u003c/div>\u003cdiv class=\"p-ko\">그가 집에 도착했을 때 무언가 타는 냄새를 맡았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>burned something to smell처럼 동사와 목적어 순서를 뒤집지 마세요.\u003c/div>","segs":[{"n":69,"text":"먼저 우리말에서 중심 동사를 찾아보세요. '냄새를 맡았다'가 중심이므로 smelled를 써야 하고, burned는 중심 동사가 될 수 없어요.","hl":"st-0"},{"n":70,"text":"smell은 냄새를 맡는 지각동사예요. 그래서 목적어 뒤에 동사원형이나 현재분사를 써서 목적격보어를 만듭니다.","hl":"st-1"},{"n":71,"text":"무언가가 타고 있는 상태를 표현하고 싶으므로 현재분사 burning이 자연스러워요. to burning처럼 전치사를 붙이면 안 됩니다.","hl":"st-2"},{"n":72,"text":"선택지를 비교하면 네 번째만 smelled 뒤에 something burning이 와서 '무언가 타는 냄새를 맡았다'라는 뜻을 정확히 만듭니다.","hl":"st-3"},{"n":73,"text":"이 문제의 함정도 짚고 갈게요. burned something to smell처럼 동사와 목적어 순서를 뒤집지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">사역동사·지각동사와 4형식 문장 전환\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>사역동사 make·let·have는 \u003cb class=\"key\">목적어 + 동사원형\u003c/b>, get·ask·want는 \u003cb class=\"key\">목적어 + to부정사\u003c/b>를 쓴다.\u003c/li>\u003cli>make는 구조에 따라 '~하게 하다, ~을 만들다, ~에게 …을 만들어 주다'로 달라진다.\u003c/li>\u003cli>4형식 전환에서 직접목적어를 앞세우면 \u003cb class=\"key\">to/for/of\u003c/b>를 알맞게 쓴다.\u003c/li>\u003cli>지각동사 see·hear·feel·smell 뒤에는 \u003cb class=\"key\">동사원형 또는 현재분사\u003c/b>를 쓰고 to는 쓰지 않는다.\u003c/li>\u003cli>make 뒤에 상태를 나타내는 목적격보어가 오면 \u003cb class=\"key\">형용사\u003c/b>를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":74,"text":"오늘은 사역동사와 지각동사의 목적격보어, make의 여러 뜻, 그리고 네 형식 문장 전환을 함께 정리했어요. 동사마다 뒤에 오는 모양이 다르기 때문에 문제를 풀 때는 먼저 동사를 찾고 목적격보어 자리를 확인하는 습관이 중요합니다. 오늘 배운 기준을 기억하면서 비슷한 문제도 꼭 다시 풀어 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
