</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"point2","title":"두 개의 목적어를 잡아라! SVOO와 to, for, of","audioDir":"point2_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter01 문장의 주요 형식\u003c/div>\u003ch1>두 개의 목적어를 잡아라! SVOO와 to, for, of\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>수여동사가 쓰인 SVOO 문장의 어순을 이해하고, 간접목적어를 to, for, of를 사용해 직접목적어 뒤로 옮길 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 문장의 주요 형식 중에서 두 개의 목적어를 갖는 문장을 배워요. 영어에서는 누군가에게 무엇을 해 주다라는 뜻을 한 문장에 담을 때가 많아요. 이때 목적어의 순서와 전치사 to, for, of의 쓰임을 정확히 알아 두면 문장을 훨씬 자연스럽게 만들 수 있어요. 예문을 함께 읽으면서 어순을 익혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">SVOO의 기본 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">SVOO는 주어 + 수여동사 + \u003cb class=\"key\">간접목적어\u003c/b> + \u003cb class=\"key\">직접목적어\u003c/b> 순서로 써요. give, send처럼 ‘~에게 ~을 ...(해)주다’라는 의미의 동사는 ‘~에게’에 해당하는 목적어를 동사 바로 뒤에 두어 ‘~에게 ~을 ...(해)주다’라는 뜻을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">SVOO = 주어 + 수여동사 + A(간접목적어) + B(직접목적어)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I sent \u003cspan class=\"fx\">him a text message\u003c/span> two days ago.\u003c/div>\u003cdiv class=\"g-ko\">나는 이틀 전에 그에게 문자 메시지를 보냈다.\u003c/div>\u003cdiv class=\"g-note\">him이 간접목적어, a text message가 직접목적어예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">My mom gave \u003cspan class=\"fx\">me a birthday gift\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">엄마는 나에게 생일 선물을 주셨다.\u003c/div>\u003cdiv class=\"g-note\">give도 ‘~에게 ~을 주다’로 간접목적어가 먼저 와요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>‘~에게’에 해당하는 \u003cb class=\"key\">간접목적어\u003c/b>가 먼저 오고, ‘~을’에 해당하는 \u003cb class=\"key\">직접목적어\u003c/b>가 뒤에 와요.\u003c/div>","segs":[{"n":2,"text":"이제 두 개의 목적어를 갖는 문장을 볼게요. 주어 다음에 수여동사가 오고, 그 뒤에 간접목적어, 그리고 직접목적어가 와요. give나 send처럼 누군가에게 무엇을 해 주다라는 뜻을 가진 동사가 대표적이에요. 이때 간접목적어는 동사 바로 뒤에 와서 누구에게인지 먼저 알려 주는 역할을 해요.","hl":"rule"},{"n":3,"text":"I sent him a text message two days ago. 이 문장은 나는 이틀 전에 그에게 문자 메시지를 보냈다는 뜻이에요. him이 간접목적어이고, a text message가 직접목적어예요.","hl":"ex-0"},{"n":4,"text":"My mom gave me a birthday gift. 이 문장은 엄마는 나에게 생일 선물을 주셨다는 뜻이에요. me가 간접목적어, a birthday gift가 직접목적어로 동사 바로 뒤에 나와요.","hl":"ex-1"},{"n":5,"text":"기억할 점은 누구에게에 해당하는 말이 먼저 오고, 무엇을에 해당하는 말이 뒤에 온다는 거예요. 우리말 순서와 비슷해서 이해하기 쉬워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">간접목적어를 뒤로 보내는 to와 for\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">‘~에게’에 해당하는 \u003cb class=\"key\">간접목적어\u003c/b>는 전치사 to나 for와 함께 \u003cb class=\"key\">직접목적어\u003c/b> 뒤에 쓸 수도 있어요. 이때 동사에 따라 to를 쓰는지 for를 쓰는지 달라집니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 수여동사 + A + B → 주어 + 수여동사 + B + to/for + A\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I sent a text message \u003cspan class=\"fx\">to him\u003c/span> two days ago.\u003c/div>\u003cdiv class=\"g-ko\">나는 이틀 전에 그에게 문자 메시지를 보냈다.\u003c/div>\u003cdiv class=\"g-note\">send는 간접목적어 him을 to와 함께 직접목적어 뒤로 보내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They showed their vacation photos \u003cspan class=\"fx\">to us\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 우리에게 그들의 휴가 사진을 보여 주었다.\u003c/div>\u003cdiv class=\"g-note\">show는 to를 사용해 us를 직접목적어 뒤로 보내요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">She bought a new bicycle \u003cspan class=\"fx\">for her son\u003c/span> on Christmas.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 크리스마스에 그녀의 아들에게 새 자전거를 사 주었다.\u003c/div>\u003cdiv class=\"g-note\">buy는 for를 사용해 her son을 직접목적어 뒤로 보내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>간접목적어를 뒤로 보낼 때 \u003cb class=\"key\">to\u003c/b>를 쓰는 동사는 give, send, show, tell, teach, write, lend, bring, pass, pay, read이고, \u003cb class=\"key\">for\u003c/b>를 쓰는 동사는 buy, make, cook, get, find예요.\u003c/div>","segs":[{"n":6,"text":"간접목적어를 꼭 동사 바로 뒤에만 써야 하는 것은 아니에요. 전치사 to나 for를 붙이면 직접목적어 뒤로 보낼 수 있어요. 이때 to는 주로 전달하는 느낌을 살리고, for는 누군가를 위해 한다는 느낌을 살려 줘요. 어떤 동사가 to를 쓰고 어떤 동사가 for를 쓰는지는 함께 외워 두면 좋아요.","hl":"rule"},{"n":7,"text":"I sent a text message to him two days ago. 이 문장도 나는 이틀 전에 그에게 문자 메시지를 보냈다는 뜻이에요. a text message 뒤에 to him이 와서 간접목적어가 뒤로 이동했어요.","hl":"ex-0"},{"n":8,"text":"They showed their vacation photos to us. 이 문장은 그들은 우리에게 그들의 휴가 사진을 보여 주었다는 뜻이에요. their vacation photos가 직접목적어이고, to us가 뒤로 간 간접목적어예요.","hl":"ex-1"},{"n":9,"text":"She bought a new bicycle for her son on Christmas. 이 문장은 그녀는 크리스마스에 그녀의 아들에게 새 자전거를 사 주었다는 뜻이에요. buy는 for를 써서 her son을 a new bicycle 뒤로 보내요.","hl":"ex-2"},{"n":10,"text":"to를 쓰는 동사로는 give, send, show, tell, teach, write, lend, bring, pass, pay, read가 있어요. for를 쓰는 동사로는 buy, make, cook, get, find가 있으니 꼭 함께 외워 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">ask는 of를 사용해요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사 \u003cb class=\"key\">ask\u003c/b>는 ask a question이나 ask a favor 같은 표현에 한해 전치사 \u003cb class=\"key\">of\u003c/b>를 씁니다. 즉 ask A B를 ask B of A로 바꿀 수 있어요.\u003cdiv>\u003cspan class=\"g-formula\">ask + A + B → ask + B + of + A\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They asked \u003cspan class=\"fx\">me a favor\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 나에게 부탁을 했다.\u003c/div>\u003cdiv class=\"g-note\">ask a favor는 ‘부탁을 하다’라는 표현이에요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They asked a favor \u003cspan class=\"fx\">of me\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 나에게 부탁을 했다.\u003c/div>\u003cdiv class=\"g-note\">ask a favor에서는 전치사 of로 me를 뒤로 보내요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">ask\u003c/b>가 쓰인 모든 문장에 of를 쓰는 것이 아니라 \u003cb class=\"key\">ask a favor\u003c/b> 같은 특정 표현에서만 \u003cb class=\"key\">of\u003c/b>를 써요.\u003c/div>","segs":[{"n":11,"text":"여기서 주의할 동사가 ask예요. ask는 간접목적어를 뒤로 보낼 때 to나 for가 아니라 of를 쓰는 경우가 있어요. 다만 모든 문장에서 그런 것은 아니고 ask a question이나 ask a favor 같은 표현에서 of를 사용해요. 그래서 They asked me a favor를 They asked a favor of me로 바꿀 수 있어요.","hl":"rule"},{"n":12,"text":"They asked me a favor. 이 문장은 그들은 나에게 부탁을 했다는 뜻이에요. ask a favor가 부탁을 하다라는 표현으로 쓰였어요.","hl":"ex-0"},{"n":13,"text":"They asked a favor of me. 이 문장도 그들은 나에게 부탁을 했다는 뜻이에요. 이때는 a favor 뒤에 of me가 와서 of를 사용했어요.","hl":"ex-1"},{"n":14,"text":"ask라고 해서 항상 of를 쓰는 것은 아니에요. ask a question이나 ask a favor 같은 표현에서만 of를 쓴다고 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I sent to him a text message two days ago.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I sent him a text message two days ago.\u003c/div>\u003cdiv class=\"g-why\">send는 to 없이 간접목적어 him을 동사 바로 뒤에 먼저 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She bought a new bicycle to her son on Christmas.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She bought a new bicycle for her son on Christmas.\u003c/div>\u003cdiv class=\"g-why\">buy는 간접목적어를 뒤로 보낼 때 to가 아니라 for를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>They asked a favor to me.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ They asked a favor of me.\u003c/div>\u003cdiv class=\"g-why\">ask a favor 표현에서는 전치사 of를 써요.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"send 다음에 to him을 바로 쓰면 SVOO의 기본 어순이 아니에요. 이때는 him을 동사 바로
