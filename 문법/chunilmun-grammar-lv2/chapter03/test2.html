</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"9~15번","title":"천일문 그래마2 챕터3 조동사 Chapter Test 9~15번","audioDir":"test2_audio","preview":false,"count":67,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조동사 (의무·충고·능력·과거 습관·부정문)\u003c/div>\u003ch1>천일문 그래마 챕터3 조동사 Chapter Test 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>7문제 · 빈칸에 공통으로 들어갈 말 고르기, 틀린 부분 고치기, 같은 의미 찾기, 조건 영작 서술형, 틀린 문장 모두 고르기, 어법상 알맞은 문장 짝짓기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 천일문 그래마 챕터 삼 조동사 챕터 테스트를 함께 풀어 볼 거예요. 조동사는 뒤에 오는 동사 모양과 부정 위치만 잘 잡아도 많은 문제를 맞힐 수 있죠. 차근차근 문제를 읽으면서 꼭 필요한 규칙을 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">have to와 had to\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">have to + 동사원형\u003c/b>은 '~해야 한다'는 의무, 과거에는 \u003cb class=\"key\">had to + 동사원형\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + have/has/had to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>현재: I/you/we/they have to, he/she/it has to\u003c/li>\u003cli>과거: 주어와 관계없이 had to\u003c/li>\u003cli>부정: don't/doesn't/didn't have to + 동사원형\u003c/li>\u003cli>will, can 같은 조동사 뒤에는 have to (will have to)\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I had to go home early yesterday.\u003c/div>\u003cdiv class=\"g-ko\">나는 어제 집에 일찍 가야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He doesn't have to hurry.\u003c/div>\u003cdiv class=\"g-ko\">그는 서두를 필요가 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"have to는 꼭 해야 하는 일을 말할 때 써요. 현재에는 주어에 따라 have to나 has to를 쓰지만 과거에는 주어와 상관없이 had to를 씁니다. 과거를 나타내는 yesterday나 last Friday가 보이면 had to로 바꿔야 해요. 그리고 will 같은 조동사 뒤에서는 has to가 아니라 have to가 와요. 부정할 때는 don't have to, doesn't have to, didn't have to처럼 일반동사처럼 꾸며 줍니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">had better\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">had better + 동사원형\u003c/b>은 '~하는 게 좋겠다, ~해야 한다'는 충고를 나타낸다. 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + had better (not) + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>had better는 'had'가 들어가도 과거가 아니라 충고\u003c/li>\u003cli>부정은 had not better가 아니라 had better not\u003c/li>\u003cli>뒤에는 동사원형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You had better go to bed early.\u003c/div>\u003cdiv class=\"g-ko\">너는 일찍 자는 게 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You had better not go out at night.\u003c/div>\u003cdiv class=\"g-ko\">너는 밤에 외출하지 않는 게 좋다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"had better는 상대에게 충고할 때 쓰는 표현이에요. 여기서 had는 과거를 뜻하는 것이 아니라 그냥 굳어진 형태라서 지금 일에도 씁니다. 뒤에는 반드시 동사원형이 오고요. 부정할 때는 had better not 다음에 동사원형을 써요. had not better라고 쓰면 틀리니 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 뒤 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사 뒤에는 항상 \u003cb class=\"key\">동사원형\u003c/b>이 온다. 조동사는 인칭이나 수에 따라 형태가 변하지 않는다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must, can, will, should 뒤에는 동사원형\u003c/li>\u003cli>have to, used to 뒤에도 동사원형\u003c/li>\u003cli>조동사 뒤에 to를 붙이면 틀림: must not to X\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She can swim well.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 수영을 잘할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Students must not cheat on the exam.\u003c/div>\u003cdiv class=\"g-ko\">학생들은 시험에서 부정행위를 해서는 안 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"조동사는 뒤에 오는 동사 모양을 바꾸지 않아요. will이나 can, must 뒤에는 항상 동사원형이 오죠. have to나 used to도 조동사처럼 뒤에 동사원형을 씁니다. 그래서 can rides가 아니라 can ride, must not to cheat가 아니라 must not cheat가 맞아요. 조동사 뒤에 to가 붙는지 안 붙는지도 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 7\u003c/span>\u003cspan class=\"g-kind\">빈칸에 공통으로 들어갈 말 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 중 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">• Mike \u003cspan class=\"p-blank\">\u003c/span> to take care of his little brother yesterday.\u003cbr>• You \u003cspan class=\"p-blank\">\u003c/span> better not go out at night.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① may\u003c/div>\u003cdiv class=\"p-op\">② could\u003c/div>\u003cdiv class=\"p-op\">③ have\u003c/div>\u003cdiv class=\"p-op\">④ should\u003c/div>\u003cdiv class=\"p-op\">⑤ had\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤ had\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":5,"text":"이번 문제는 두 문장의 빈칸에 공통으로 들어갈 조동사를 찾는 문제예요. 첫 문장은 yesterday와 to, 두 번째 문장은 better not을 중심으로 보면 됩니다.","hl":"q"},{"n":6,"text":"","hl":"q","pause":7},{"n":7,"text":"정답은 다섯 번째 선택지인 had예요. 첫 문장은 had to로 해야 했다, 두 번째 문장은 had better not으로 하지 않는 게 좋다가 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 7\u003c/span>\u003cspan class=\"g-kind\">빈칸에 공통으로 들어갈 말 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 중 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">• Mike \u003cspan class=\"p-blank\">\u003c/span> to take care of his little brother yesterday.\u003cbr>• You \u003cspan class=\"p-blank\">\u003c/span> better not go out at night.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① may\u003c/div>\u003cdiv class=\"p-op\">② could\u003c/div>\u003cdiv class=\"p-op\">③ have\u003c/div>\u003cdiv class=\"p-op\">④ should\u003c/div>\u003cdiv class=\"p-op\">⑤ had\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 문장 시제·형태\u003c/b>yesterday가 있으므로 과거이고, 빈칸 뒤에 \u003cb class=\"key\">to take\u003c/b>가 있다. '~해야 했다'는 \u003cb class=\"key\">had to + 동사원형\u003c/b>이므로 had가 필요하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">둘째 문장 충고 표현\u003c/b>빈칸 뒤에 \u003cb class=\"key\">better not\u003c/b>이 있으므로 '~하지 않는 게 좋다'는 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 확인\u003c/b>① may to, ② could to, ③ have better not, ④ should to는 형태가 틀리고, ⑤ had만 두 문장에 모두 들어간다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤ had\u003c/span>\u003cdiv class=\"p-full\">Mike had to take care of his little brother yesterday. / You had better not go out at night.\u003c/div>\u003cdiv class=\"p-ko\">마이크는 어제 남동생을 돌봐야 했다. / 너는 밤에 외출하지 않는 게 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>had better의 had를 과거로 착각하지 않기\u003c/div>","segs":[{"n":8,"text":"먼저 첫 문장을 볼게요. yesterday가 있으니 과거 이야기이고 뒤에 to take가 이어져요. 그래서 해야 했다라는 뜻의 had to가 되어야 합니다.","hl":"st-0"},{"n":9,"text":"두 번째 문장은 better not이 보이죠. 이때는 had better not 형태로 하지 않는 게 좋다라고 충고하는 표현이 됩니다.","hl":"st-1"},{"n":10,"text":"선택지를 하나씩 보면 may나 could, should는 뒤에 to가 바로 오는 형태가 아니에요. have는 과거 시제와 맞지 않고 have better not도 틀립니다. 그래서 두 문장에 공통으로 들어갈 수 있는 것은 had입니다.","hl":"st-2"},{"n":11,"text":"이 문제의 함정도 짚고 갈게요. had better의 had를 과거로 착각하지 않기","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q\">The students have to finish their project by last Friday.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">have → had (have to finish → had to finish)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"이번 문제는 문장에서 어법상 틀린 부분을 찾아 고치는 문제예요. last Friday가 언제를 가리키는지 먼저 보세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 have를 had로 고치는 것이에요. 과거 시점이므로 have to를 had to로 바꿔야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>다음 문장에서 어법상 알맞지 않은 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"p-q sm\">The students have to finish their project by last Friday.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시제 표시 찾기\u003c/b>\u003cb class=\"key\">last Friday\u003c/b>는 과거 시점을 나타낸다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">have to 과거형\u003c/b>과거의 의무는 주어와 관계없이 \u003cb class=\"key\">had to + 동사원형\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>The students \u003cb class=\"key\">had to finish\u003c/b> their project by last Friday.로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 have → had (have to finish → had to finish)\u003c/span>\u003cdiv class=\"p-full\">The students had to finish their project by last Friday.\u003c/div>\u003cdiv class=\"p-ko\">그 학생들은 지난주 금요일까지 프로젝트를 끝내야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>last Friday가 있는데 현재형 have to를 그대로 두는 실수\u003c/div>","segs":[{"n":15,"text":"문장 끝에 last Friday가 있죠. 지난주 금요일까지였으니 과거의 일을 말하고 있어요.","hl":"st-0"},{"n":16,"text":"과거에 해야 했다라고 할 때는 주어가 복수여도 had to를 씁니다. 그래서 have to를 had to로 바꿔야 해요.","hl":"st-1"},{"n":17,"text":"고친 문장은 The students had to finish their project by last Friday가 됩니다. finish는 그대로 동사원형이에요.","hl":"st-2"},{"n":18,"text":"이 문제의 함정도 짚고 갈게요. last Friday가 있는데 현재형 have to를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">be able to\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">can이 '~할 수 있다'는 능력이나 가능을 나타낼 때 \u003cb class=\"key\">be able to + 동사원형\u003c/b>으로 바꿔 쓸 수 있다. 과거 부정은 \u003cb class=\"key\">wasn't/weren't able to + 동사원형\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + am/is/are/was/were able to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>can = am/are/is able to\u003c/li>\u003cli>could = was/were able to\u003c/li>\u003cli>couldn't = wasn't/weren't able to\u003c/li>\u003cli>주어의 수와 시제에 맞춰 be동사 선택\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We weren't able to see each other.\u003c/div>\u003cdiv class=\"g-ko\">우리는 서로를 볼 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is able to speak three languages.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 세 언어를 말할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"can과 같은 뜻으로 be able to를 쓸 수 있어요. 이때 be동사는 주어와 시제에 맞춰 골라야 합니다. 과거의 부정이면 couldn't를 wasn't able to나 weren't able to로 바꿀 수 있죠. 주어가 we라면 were able to, weren't able to를 써야 합니다. 시제가 과거인지도 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 7\u003c/span>\u003cspan class=\"g-kind\">같은 의미 찾기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">11\u003c/span>주어진 문장과 의미가 같도록 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">We couldn’t see each other for a while.\u003cbr>= We \u003cspan class=\"p-blank\">\u003c/span> see each other for a while.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① isn’t able to\u003c/div>\u003cdiv class=\"p-op\">② aren’t able to\u003c/div>\u003cdiv class=\"p-op\">③ wasn’t able to\u003c/div>\u003cdiv class=\"p-op\">④ weren’t able to\u003c/div>\u003cdiv class=\"p-op\">⑤ were able to\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ weren’t able to\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"이번 문제는 couldn't와 같은 뜻이 되도록 be able to 표현으로 바꾸는 문제예요. 주어와 시제, 부정 여부를 함께 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":7},{"n":22,"text":"정답은 네 번째 선택지인 weren't able to예요. 주어가 we이고 과거 부정이므로 weren't able to가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 7\u003c/span>\u003cspan class=\"g-kind\">같은 의미 찾기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">11\u003c/span>주어진 문장과 의미가 같도록 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">We couldn’t see each other for a while.\u003cbr>= We \u003cspan class=\"p-blank\">\u003c/span> see each other for a while.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① isn’t able to\u003c/div>\u003cdiv class=\"p-op\">② aren’t able to\u003c/div>\u003cdiv class=\"p-op\">③ wasn’t able to\u003c/div>\u003cdiv class=\"p-op\">④ weren’t able to\u003c/div>\u003cdiv class=\"p-op\">⑤ were able to\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">원문 시제·의미\u003c/b>\u003cb class=\"key\">couldn’t\u003c/b>는 can의 과거 부정형으로 '~할 수 없었다'이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주어와 be동사\u003c/b>주어 \u003cb class=\"key\">We\u003c/b>는 복수이고 시제는 과거이므로 be동사는 \u003cb class=\"key\">were\u003c/b>가 맞다. 부정이므로 \u003cb class=\"key\">weren’t\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 확인\u003c/b>①·②는 현재, ③은 단수 과거, ⑤는 긍정이라 틀리고 \u003cb class=\"key\">④ weren’t able to\u003c/b>만 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ weren’t able to\u003c/span>\u003cdiv class=\"p-full\">We weren’t able to see each other for a while.\u003c/div>\u003cdiv class=\"p-ko\">우리는 한동안 서로를 볼 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>we에 wasn’t를 쓰거나 부정을 놓치지 않기\u003c/div>","segs":[{"n":23,"text":"원문에 couldn't가 있으니 과거에 볼 수 없었다는 뜻이에요. 이걸 be able to 표현으로 바꾸는 문제입니다.","hl":"st-0"},{"n":24,"text":"주어가 we라서 be동사는 were를 써야 하고, 부정이니까 weren't가 됩니다. 시제도 과거로 맞춰야 해요.","hl":"st-1"},{"n":25,"text":"첫 번째와 두 번째 선택지는 현재 시제라 틀리고, 세 번째는 단수 주어에 쓰는 형태라 맞지 않아요. 다섯 번째는 긍정이라 뜻이 반대이고, 네 번째만 주어와 시제, 부정이 모두 맞습니다.","hl":"st-2"},{"n":26,"text":"이 문제의 함정도 짚고 갈게요. we에 wasn’t를 쓰거나 부정을 놓치지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">Would you like to\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Would you like to + 동사원형?\u003c/b>은 '~하시겠어요?, ~할래요?'라고 정중하게 권유하거나 물을 때 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">Would you like to + 동사원형?\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Would you like to drink some water? = 물 좀 마실래요?\u003c/li>\u003cli>Would 뒤에 주어 you, 그다음 like to + 동사원형\u003c/li>\u003cli>권유·제안 표현\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Would you like to drink some water?\u003c/div>\u003cdiv class=\"g-ko\">물 좀 마실래요?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Would you like to come with us?\u003c/div>\u003cdiv class=\"g-ko\">우리와 함께 갈래요?\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"상대에게 정중하게 뭘 하겠냐고 물을 때는 Would you like to 다음에 동사원형을 써요. 물 좀 마실래는 Would you like to drink some water가 됩니다. 여기서 like to는 정중한 권유를 만들어 주는 중요한 부분이에요. 주어진 단어 would, you, drink를 모두 사용하면서 like to를 추가하면 자연스러운 문장이 완성됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 7\u003c/span>\u003cspan class=\"g-kind\">조건 영작 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">12\u003c/span>다음 대화를 읽고 주어진 단어를 사용하여 밑줄 친 우리말을 &lt;조건&gt;에 맞게 쓰세요.\u003c/div>\u003cdiv class=\"p-psg\">Sumi: Mom, can I have more rice?\u003cbr>Mom: Yes, but (1) \u003cu class=\"p-u\">너는 천천히 먹는 게 좋겠어.\u003c/u>\u003cbr>(better, eat slowly)\u003cbr>Sumi: Okay. I want something to drink.\u003cbr>Mom: (2) \u003cu class=\"p-u\">물 좀 마실래?\u003c/u> (would, you, drink)\u003cbr>[조건]\u003cbr>•주어, 동사를 포함한 문장으로 쓸 것\u003cbr>•주어진 단어를 모두 활용해야 함. 필요한 경우 단어를 추가할 것\u003c/div>\u003cdiv class=\"p-q\">(1) \u003cspan class=\"p-blank\">\u003c/span>.\u003cbr>(2) \u003cspan class=\"p-blank\">\u003c/span> some water?\u003c/div>\u003cdiv class=\"p-words\">(1) better, eat slowly / (2) would, you, drink\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) You had better eat slowly. (2) Would you like to drink\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"이번 문제는 대화 속 우리말을 조건에 맞게 영어로 바꾸는 문제예요. 첫 번째는 충고 표현, 두 번째는 정중한 권유 표현을 떠올려 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":7},{"n":30,"text":"첫 번째는 You had better eat slowly, 두 번째는 Would you like to drink로 시작하면 됩니다. had better 뒤와 like to 뒤에는 동사원형이 와요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 7\u003c/span>\u003cspan class=\"g-kind\">조건 영작 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">12\u003c/span>다음 대화를 읽고 주어진 단어를 사용하여 밑줄 친 우리말을 &lt;조건&gt;에 맞게 쓰세요.\u003c/div>\u003cdiv class=\"p-psg sm\">Sumi: Mom, can I have more rice?\u003cbr>Mom: Yes, but (1) \u003cu class=\"p-u\">너는 천천히 먹는 게 좋겠어.\u003c/u>\u003cbr>(better, eat slowly)\u003cbr>Sumi: Okay. I want something to drink.\u003cbr>Mom: (2) \u003cu class=\"p-u\">물 좀 마실래?\u003c/u> (would, you, drink)\u003cbr>[조건]\u003cbr>•주어, 동사를 포함한 문장으로 쓸 것\u003cbr>•주어진 단어를 모두 활용해야 함. 필요한 경우 단어를 추가할 것\u003c/div>\u003cdiv class=\"p-q sm\">(1) \u003cspan class=\"p-blank\">\u003c/span>.\u003cbr>(2) \u003cspan class=\"p-blank\">\u003c/span> some water?\u003c/div>\u003cdiv class=\"p-words\">(1) better, eat slowly / (2) would, you, drink\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 충고 표현\u003c/b>‘먹는 게 좋겠어’는 \u003cb class=\"key\">had better + 동사원형\u003c/b>이다. 주어 You를 세우고 \u003cb class=\"key\">had better eat slowly\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(1) 단어 확인\u003c/b>주어진 \u003cb class=\"key\">better\u003c/b>, \u003cb class=\"key\">eat slowly\u003c/b>를 모두 사용하고, had는 추가한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(2) 정중한 권유\u003c/b>‘~할래?’라고 정중히 물을 때 \u003cb class=\"key\">Would you like to + 동사원형?\u003c/b>을 쓴다. \u003cb class=\"key\">Would you like to drink\u003c/b> 뒤에 some water가 이어진다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">전체 확인\u003c/b>(1) \u003cb class=\"key\">You had better eat slowly.\u003c/b> (2) \u003cb class=\"key\">Would you like to drink some water?\u003c/b>\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) You had better eat slowly. (2) Would you like to drink\u003c/span>\u003cdiv class=\"p-full\">(1) You had better eat slowly. (2) Would you like to drink some water?\u003c/div>\u003cdiv class=\"p-ko\">(1) 너는 천천히 먹는 게 좋겠어. (2) 물 좀 마실래?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>had better를 have better로 쓰거나 Would you like to 뒤의 to를 빼지 않기\u003c/div>","segs":[{"n":31,"text":"먼저 첫 번째 빈칸은 엄마가 수미에게 충고하는 말이에요. 먹는 게 좋겠어는 had better로 표현하고 주어 you를 붙여 You had better eat slowly라고 씁니다.","hl":"st-0"},{"n":32,"text":"주어진 단어인 better와 eat slowly를 모두 써야 하니 had better eat slowly 형태로 완성하면 됩니다.","hl":"st-1"},{"n":33,"text":"두 번째 빈칸은 물을 마실래라고 정중하게 권하는 말이에요. Would you like to 다음에 동사원형 drink를 쓰고 뒤에 이미 있는 some water를 붙이면 됩니다.","hl":"st-2"},{"n":34,"text":"그래서 첫 번째는 You had better eat slowly, 두 번째는 Would you like to drink some water가 됩니다. 주어와 동사가 들어갔는지, 주어진 단어를 모두 썼는지 확인하세요.","hl":"st-3"},{"n":35,"text":"이 문제의 함정도 짚고 갈게요. had better를 have better로 쓰거나 Would you like to 뒤의 to를 빼지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">used to\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">used to + 동사원형\u003c/b>은 '과거에는 ~했지만 지금은 아니다'라는 과거 습관이나 상태를 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + used to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>used to 뒤에는 동사원형\u003c/li>\u003cli>과거 습관: I used to get up late.\u003c/li>\u003cli>부정: didn't use to + 동사원형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I used to get up late during vacations.\u003c/div>\u003cdiv class=\"g-ko\">나는 방학 동안 늦게 일어나곤 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">John used to help his dad.\u003c/div>\u003cdiv class=\"g-ko\">존은 예전에 아빠를 도와주곤 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"used to는 지금은 하지 않지만 예전에는 했던 일을 말할 때 써요. 뒤에는 반드시 동사원형이 옵니다. 그래서 used help가 아니라 used to help가 맞아요. 부정문에서는 didn't use to처럼 use에 d를 붙이지 않는 형태를 씁니다. 과거 습관이라는 뜻과 뒤의 동사원형을 꼭 같이 봐 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 모두 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">13\u003c/span>다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-q\">다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① He will has to pay the bills for the meal.\u003c/div>\u003cdiv class=\"p-op\">② I used to get up late during vacations.\u003c/div>\u003cdiv class=\"p-op\">③ You have to wash all the dirty clothes.\u003c/div>\u003cdiv class=\"p-op\">④ You had not better play loud music at midnight.\u003c/div>\u003cdiv class=\"p-op\">⑤ We had to cancel our trip due to bad weather.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">①, ④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"이번 문제는 다섯 문장 중에서 어법상 틀린 문장을 모두 고르는 문제예요. 조동사 뒤의 동사 형태와 부정 위치를 중심으로 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":7},{"n":39,"text":"정답은 첫 번째와 네 번째 문장이에요. will 뒤에는 have to가 와야 하고, had better의 부정은 had better not으로 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 모두 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">13\u003c/span>다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① He will has to pay the bills for the meal.\u003c/div>\u003cdiv class=\"p-op\">② I used to get up late during vacations.\u003c/div>\u003cdiv class=\"p-op\">③ You have to wash all the dirty clothes.\u003c/div>\u003cdiv class=\"p-op\">④ You had not better play loud music at midnight.\u003c/div>\u003cdiv class=\"p-op\">⑤ We had to cancel our trip due to bad weather.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">will\u003c/b> 뒤에는 동사원형이 와야 하므로 \u003cb class=\"key\">will have to\u003c/b>가 맞다. \u003cb class=\"key\">will has to\u003c/b>는 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">used to + get up\u003c/b>은 과거 습관으로 어법상 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>\u003cb class=\"key\">have to + wash\u003c/b>는 '씻어야 한다'로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>had better의 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이므로 \u003cb class=\"key\">had not better\u003c/b>는 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>\u003cb class=\"key\">had to + cancel\u003c/b>은 과거 의무로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ①, ④\u003c/span>\u003cdiv class=\"p-full\">① He will have to pay the bills for the meal. / ④ You had better not play loud music at midnight.\u003c/div>\u003cdiv class=\"p-ko\">① 그는 식사비를 내야 할 것이다. / ④ 너는 자정에 큰 음악을 틀지 않는 게 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>had better 부정을 had not better로 쓰는 실수\u003c/div>","segs":[{"n":40,"text":"첫 번째 문장은 will 뒤에 has to가 왔어요. will 같은 조동사 뒤에는 have to가 와야 하므로 will have to가 맞고 will has to는 틀립니다.","hl":"st-0"},{"n":41,"text":"두 번째 문장은 used to 다음에 get up이 왔으니 과거 습관을 나타내는 올바른 문장입니다.","hl":"st-1"},{"n":42,"text":"세 번째 문장은 have to 뒤에 wash가 와서 씻어야 한다는 뜻이 잘 표현됐어요. 어법에 문제가 없습니다.","hl":"st-2"},{"n":43,"text":"네 번째 문장은 had not better라고 했는데, 충고 표현의 부정은 had better not입니다. 그래서 이 문장은 틀렸어요.","hl":"st-3"},{"n":44,"text":"다섯 번째 문장은 had to 다음에 cancel이 와서 과거에 취소해야 했다는 뜻을 잘 나타냅니다. 따라서 맞는 문장입니다.","hl":"st-4"},{"n":45,"text":"이 문제의 함정도 짚고 갈게요. had better 부정을 had not better로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 부정문의 위치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사의 부정은 \u003cb class=\"key\">조동사 + not + 동사원형\u003c/b> 순서로 쓴다. have to의 부정은 \u003cb class=\"key\">don't/doesn't/didn't have to + 동사원형\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + not + 동사원형 / do(es/did) not + have to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must not + 동사원형\u003c/li>\u003cli>can not/cannot + 동사원형\u003c/li>\u003cli>had better not + 동사원형\u003c/li>\u003cli>has to not X → doesn't have to O\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You must not pull the cat's tail.\u003c/div>\u003cdiv class=\"g-ko\">너는 고양이 꼬리를 잡아당기면 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He doesn't have to hurry.\u003c/div>\u003cdiv class=\"g-ko\">그는 서두를 필요가 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"부정문을 만들 때 not의 위치가 아주 중요해요. must나 can, had better 같은 조동사는 조동사 바로 뒤에 not을 붙이고 그다음 동사원형을 씁니다. have to는 조동사처럼 보이지만 부정할 때 do, does, did의 도움을 받아요. 그래서 has to not hurry가 아니라 doesn't have to hurry가 맞습니다. not을 동사 앞에 함부로 넣지 않도록 조심해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 모두 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">14\u003c/span>다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-q\">다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① We will not spend much money on groceries this week.\u003c/div>\u003cdiv class=\"p-op\">② You cannot leave the classroom before the bell rings.\u003c/div>\u003cdiv class=\"p-op\">③ He has to not hurry to catch the bus. The next one is coming.\u003c/div>\u003cdiv class=\"p-op\">④ John used help his dad’s work in the house.\u003c/div>\u003cdiv class=\"p-op\">⑤ Students must not to cheat on the exam.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③, ④, ⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":47,"text":"이번 문제도 어법상 틀린 문장을 모두 고르는 문제예요. not의 위치와 to의 유무를 꼼꼼히 비교해 보세요.","hl":"q"},{"n":48,"text":"","hl":"q","pause":7},{"n":49,"text":"정답은 세 번째, 네 번째, 다섯 번째 문장이에요. have to의 부정은 doesn't have to, used to 뒤에는 to와 동사원형, must not 뒤에는 동사원형이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 7\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 모두 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">14\u003c/span>다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">다음 중 어법상 알맞지 않은 문장을 모두 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① We will not spend much money on groceries this week.\u003c/div>\u003cdiv class=\"p-op\">② You cannot leave the classroom before the bell rings.\u003c/div>\u003cdiv class=\"p-op\">③ He has to not hurry to catch the bus. The next one is coming.\u003c/div>\u003cdiv class=\"p-op\">④ John used help his dad’s work in the house.\u003c/div>\u003cdiv class=\"p-op\">⑤ Students must not to cheat on the exam.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">will not + spend\u003c/b>는 조동사 will 뒤에 not과 동사원형이 와서 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">cannot + leave\u003c/b>는 '떠날 수 없다'로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>have to의 부정은 \u003cb class=\"key\">doesn't have to + 동사원형\ h를 틀렸다고 오해하지 않기\u003c/div>","segs":[{"n":59,"text":"첫 번째 문장은 didn't have to 뒤에 asked가 왔어요. 조동사 뒤에는 동사원형이 와야 하므로 ask가 맞습니다. 그래서 이 문장은 틀렸어요.","hl":"st-0"},{"n":60,"text":"두 번째 문장은 must pull not 순서로 되어 있는데, must not pull처럼 not이 must 바로 뒤에 와야 합니다. 그래서 틀린 문장이에요.","hl":"st-1"},{"n":61,"text":"세 번째 문장은 What will you do on your trip인데, 의문사 뒤에 will, 주어 you, 동사원형 do가 잘 왔습니다. 어법에 맞는 문장이에요.","hl":"st-2"},{"n":62,"text":"네 번째 문장은 can 다음에 rides가 왔어요. can 뒤에는 동사원형이 와야 하므로 can ride가 맞습니다. 따라서 틀린 문장입니다.","hl":"st-3"},{"n":63,"text":"다섯 번째 문장은 You'd better go to bed earlier인데, You had better go의 줄임말로 충고 표현이 잘 쓰였습니다. 어법에 맞아요.","hl":"st-4"},{"n":64,"text":"여섯 번째 문장은 can take와 may not use가 모두 조동사 뒤에 동사원형을 썼어요. 그래서 어법에 맞는 문장입니다.","hl":"st-5"},{"n":65,"text":"맞는 문장은 세 번째, 다섯 번째, 여섯 번째예요. 이 셋을 묶은 선택지는 다섯 번째입니다.","hl":"st-6"},{"n":66,"text":"이 문제의 함정도 짚고 갈게요. f의 may not use flash를 틀렸다고 오해하지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 (의무·충고·능력·과거 습관·부정문)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>조동사 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/li>\u003cli>과거의 의무는 \u003cb class=\"key\">had to + 동사원형\u003c/b>, 충고의 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003c/li>\u003cli>과거 부정 능력은 주어에 맞춰 \u003cb class=\"key\">wasn't/weren't able to + 동사원형\u003c/b>으로 쓴다.\u003c/li>\u003cli>have to의 부정은 \u003cb class=\"key\">don't/doesn't/didn't have to + 동사원형\u003c/b>이다.\u003c/li>\u003cli>used to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오고, will 뒤에는 \u003cb class=\"key\">have to\u003c/b>가 온다.\u003c/li>\u003c/ul>","segs":[{"n":67,"text":"오늘은 조동사 문제를 집중적으로 풀어 봤어요. 조동사 뒤에는 동사원형이 온다는 점, 과거 의무는 had to, 충고의 부정은 had better not이라는 점을 꼭 기억해 주세요. have to의 부정과 used to의 형태도 함께 정리해 두면 시험에서 실수를 줄일 수 있습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
