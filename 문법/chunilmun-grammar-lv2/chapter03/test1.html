</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"1~8번","title":"천일문 그래마2 챕터3 조동사 Chapter Test 1~8번","audioDir":"test1_audio","preview":false,"count":64,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조동사 (can/could, must, may, had better, have to)\u003c/div>\u003ch1>천일문 그래마 챕터3 조동사 Chapter Test 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>8문제 · 선택지 고르기, 밑줄 친 부분 바꾸기, 서술형(빈칸 완성), 의미가 다른 것 고르기, 공통 빈칸 선택\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 천일문 그래마 챕터3, 조동사 챕터 테스트를 함께 풀어 볼 거예요. 조동사는 뜻이 여러 가지라서 상황을 보고 판단하는 힘이 중요한데, 오늘 여덟 문제를 풀면서 그 감각을 확실히 잡아 봅시다. 하나씩 차근차근 풀어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">had better (충고·권고)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">충고나 권고를 나타낼 때는 \u003cb class=\"key\">had better + 동사원형\u003c/b>을 쓴다. 부정형은 not을 had better 뒤에 붙인 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + had better (not) + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>의미는 '~하는 게 낫다, ~하는 게 좋겠다'\u003c/li>\u003cli>부정은 had better not (had not better는 틀림)\u003c/li>\u003cli>모든 주어에 형태 변화 없이 그대로 사용\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You had better see a doctor.\u003c/div>\u003cdiv class=\"g-ko\">너는 병원에 가 보는 게 좋겠어.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You had better not make too much noise.\u003c/div>\u003cdiv class=\"g-ko\">너는 소란을 너무 피우지 않는 게 좋겠어.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 충고 표현부터 볼게요. 누군가에게 이렇게 하는 게 좋겠다고 부드럽게 권할 때 영어로는 had better를 씁니다. had better 뒤에는 항상 동사원형이 와요. 그리고 ~하지 않는 게 좋겠다고 부정할 때는 not을 had better 바로 뒤에 붙여서 had better not 다음에 동사원형을 씁니다. 모든 주어에서 형태가 똑같다는 점도 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 8\u003c/span>\u003cspan class=\"g-kind\">선택지 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">A: I have a terrible sore throat.\u003cbr>B: That’s too bad. You \u003cspan class=\"p-blank\">\u003c/span> see a doctor.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① must not\u003c/div>\u003cdiv class=\"p-op\">② won’t\u003c/div>\u003cdiv class=\"p-op\">③ had better\u003c/div>\u003cdiv class=\"p-op\">④ would\u003c/div>\u003cdiv class=\"p-op\">⑤ can’t\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 대화형 문제예요. 에이가 목이 아프다고 했으니 비가 어떤 반응을 해야 자연스러운지, 그리고 빈칸에 들어갈 조동사가 충고인지 금지인지 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 세 번째 선택지인 had better입니다. 목이 아프다고 하니 병원에 가 보는 게 좋겠다고 충고하는 상황이죠. had better는 ~하는 게 좋겠다는 뜻이라 여기에 딱 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 8\u003c/span>\u003cspan class=\"g-kind\">선택지 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 대화의 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">A: I have a terrible sore throat.\u003cbr>B: That’s too bad. You \u003cspan class=\"p-blank\">\u003c/span> see a doctor.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① must not\u003c/div>\u003cdiv class=\"p-op\">② won’t\u003c/div>\u003cdiv class=\"p-op\">③ had better\u003c/div>\u003cdiv class=\"p-op\">④ would\u003c/div>\u003cdiv class=\"p-op\">⑤ can’t\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">상황 파악\u003c/b>A가 \u003cb class=\"key\">목이 심하게 아프다\u003c/b>고 했으므로 B는 병원에 가 보라고 \u003cb class=\"key\">충고\u003c/b>하는 상황이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">①·⑤ 확인\u003c/b>must not은 '~하면 안 된다', can’t는 '~할 수 없다'는 금지·불가 표현이라 충고가 되지 않는다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">②·④ 확인\u003c/b>won’t는 미래·거부, would는 공손한 표현이나 과거 습관이라 이 대화의 충고 의미를 담지 못한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">③ 확인\u003c/b>had better는 \u003cb class=\"key\">~하는 게 좋겠다\u003c/b>는 충고를 나타내므로 '병원에 가 보는 게 좋겠다'로 자연스럽다. 따라서 \u003cb class=\"key\">③\u003c/b>이 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">You had better see a doctor.\u003c/div>\u003cdiv class=\"p-ko\">A: 나는 목이 심하게 아파. B: 그것 참 안됐구나. 너는 병원에 가 보는 게 좋겠어.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must not을 '~할 필요가 없다'로 착각하면 안 된다. must not은 '~하면 안 된다'는 금지다.\u003c/div>","segs":[{"n":6,"text":"먼저 대화 상황을 봐야 해요. 에이가 목이 심하게 아프다고 말하고 있으니, 비는 병원에 가 보라고 충고하는 게 자연스럽겠죠.","hl":"st-0"},{"n":7,"text":"첫 번째 선택지 must not은 하면 안 된다는 금지이고, 다섯 번째 can't는 할 수 없다는 뜻이라서 여기에는 어울리지 않아요.","hl":"st-1"},{"n":8,"text":"두 번째 won't는 미래나 거부의 느낌이고, 네 번째 would는 공손한 표현이나 과거의 습관을 나타내서 충고의 의미가 없습니다.","hl":"st-2"},{"n":9,"text":"그래서 세 번째 had better가 정답이에요. 병원에 가 보는 게 좋겠다는 충고의 뜻이 딱 맞습니다.","hl":"st-3"},{"n":10,"text":"이 문제의 함정도 짚고 갈게요. must not을 '~할 필요가 없다'로 착각하면 안 된다. must not은 '~하면 안 된다'는 금지다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">can/could의 의미 (능력·가능, 허가, 요청)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">can/could + 동사원형\u003c/b>은 능력·가능(~할 수 있다), 허가(~해도 된다), 요청(~해 주시겠어요?)을 나타내며, 어느 의미인지는 \u003cb class=\"key\">문장의 상황과 주어\u003c/b>로 판단한다.\u003cdiv>\u003cspan class=\"g-formula\">can/could + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>능력·가능: ~할 수 있다 / 과거에는 could\u003c/li>\u003cli>허가: Can I ~? (~해도 될까요?), You can ~ (~해도 된다)\u003c/li>\u003cli>요청: Could you ~? (~해 주시겠어요?)\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Can I have some more juice?\u003c/div>\u003cdiv class=\"g-ko\">주스를 좀 더 마셔도 될까요?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Could you show me the way?\u003c/div>\u003cdiv class=\"g-ko\">길 좀 알려 주시겠어요?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I could pass the exam.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 시험을 통과할 수 있었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"can과 could는 정말 여러 가지 뜻으로 쓰이는 조동사예요. ~할 수 있다는 능력이나 가능, ~해도 된다는 허가, ~해 주시겠어요라는 요청까지 모두 can과 could로 표현합니다. 그래서 문제를 풀 때는 뜻을 하나로 외우지 말고, 문장의 상황과 주어를 보고 어떤 의미인지 판단해야 해요. 특히 could you로 시작하면 대부분 요청이고, 과거 이야기 속에서 could가 나오면 ~할 수 있었다는 과거의 능력이나 가능이에요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 8\u003c/span>\u003cspan class=\"g-kind\">밑줄 친 부분 바꾸기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 중 밑줄 친 부분을 may로 바꿔 쓸 수 있는 것을 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① \u003cu class=\"p-u\">Can\u003c/u> you imagine the world without internet?\u003c/div>\u003cdiv class=\"p-op\">② He \u003cu class=\"p-u\">can\u003c/u> repair almost everything with the right tools.\u003c/div>\u003cdiv class=\"p-op\">③ He \u003cu class=\"p-u\">can\u003c/u> dance various styles, from jazz to hip-hop.\u003c/div>\u003cdiv class=\"p-op\">④ \u003cu class=\"p-u\">Can\u003c/u> I have some more juice on the table?\u003c/div>\u003cdiv class=\"p-op\">⑤ How fast \u003cu class=\"p-u\">can\u003c/u> you run 100 meters?\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"두 번째 문제는 밑줄 친 can을 may로 바꿀 수 있는 문장을 찾는 거예요. 각 문장에서 can이 능력인지 허가인지 먼저 따져 보세요.","hl":"q"},{"n":13,"text":"","hl":"q","pause":7},{"n":14,"text":"정답은 네 번째 문장입니다. 주스를 좀 더 마셔도 될까요라고 허락을 구하는 표현이라 May I have로 바꿔 쓸 수 있어요. 나머지는 모두 ~할 수 있다는 능력이나 가능을 나타냅니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 8\u003c/span>\u003cspan class=\"g-kind\">밑줄 친 부분 바꾸기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 중 밑줄 친 부분을 may로 바꿔 쓸 수 있는 것을 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① \u003cu class=\"p-u\">Can\u003c/u> you imagine the world without internet?\u003c/div>\u003cdiv class=\"p-op\">② He \u003cu class=\"p-u\">can\u003c/u> repair almost everything with the right tools.\u003c/div>\u003cdiv class=\"p-op\">③ He \u003cu class=\"p-u\">can\u003c/u> dance various styles, from jazz to hip-hop.\u003c/div>\u003cdiv class=\"p-op\">④ \u003cu class=\"p-u\">Can\u003c/u> I have some more juice on the table?\u003c/div>\u003cdiv class=\"p-op\">⑤ How fast \u003cu class=\"p-u\">can\u003c/u> you run 100 meters?\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">기준 세우기\u003c/b>may로 바꿀 수 있는 것은 can이 \u003cb class=\"key\">허가\u003c/b>(~해도 된다)의 의미로 쓰인 경우이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">①·②·③·⑤ 확인\u003c/b>①은 '상상할 수 있니', ②는 '고칠 수 있다', ③은 '춤출 수 있다', ⑤는 '달릴 수 있니'로 모두 \u003cb class=\"key\">능력·가능\u003c/b>의 의미다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">④ 확인\u003c/b>④의 Can I ~?는 '~해도 될까요?'라는 \u003cb class=\"key\">허가\u003c/b>를 구하는 표현이므로 \u003cb class=\"key\">May I ~?\u003c/b>로 바꿀 수 있다. 따라서 \u003cb class=\"key\">④\u003c/b>가 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-ko\">① 너는 인터넷 없는 세상을 상상할 수 있니? ② 그는 올바른 도구를 가지고 거의 모든 것을 고칠 수 있다. ③ 그는 재즈부터 힙합까지 다양한 스타일의 춤을 출 수 있다. ④ 테이블 위에 주스를 좀 더 마셔도 될까요? ⑤ 너는 100미터를 얼마나 빨리 달릴 수 있니?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>Can you imagine~?처럼 '상상하다'가 들어가도 결국 '~할 수 있니'라는 가능의 의미라는 점을 놓치기 쉽다.\u003c/div>","segs":[{"n":15,"text":"이 문제의 핵심은 may로 바꿀 수 있는 can을 찾는 거예요. may는 허가의 뜻이 있으니, can이 허락을 구하는 상황에서 쓰였는지부터 보면 됩니다.","hl":"st-0"},{"n":16,"text":"첫 번째는 상상할 수 있니, 두 번째는 고칠 수 있다, 세 번째는 춤출 수 있다, 다섯 번째는 달릴 수 있니라는 뜻이라 모두 능력이나 가능을 나타내요. 그래서 may로 바꿀 수 없습니다.","hl":"st-1"},{"n":17,"text":"네 번째 문장은 주스를 좀 더 마셔도 될까요라고 허락을 구하는 표현이에요. 이럴 때는 may I have로 바꿔 쓸 수 있으니 네 번째가 정답입니다.","hl":"st-2"},{"n":18,"text":"이 문제의 함정도 짚고 갈게요. Can you imagine~?처럼 '상상하다'가 들어가도 결국 '~할 수 있니'라는 가능의 의미라는 점을 놓치기 쉽다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">don't have to (~할 필요가 없다)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">~할 필요가 없다\u003c/b>는 \u003cb class=\"key\">don't have to + 동사원형\u003c/b>으로 쓴다. 주어가 3인칭 단수면 doesn't have to가 된다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + don't/doesn't have to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must not(~하면 안 된다)과 의미가 완전히 다르다\u003c/li>\u003cli>have to 뒤에는 항상 동사원형\u003c/li>\u003cli>3인칭 단수 주어는 doesn't have to\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You don't have to tell me about your plan.\u003c/div>\u003cdiv class=\"g-ko\">너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"~할 필요가 없다는 영어로 don't have to입니다. 주어가 삼인칭 단수면 doesn't have to로 바꿔 주고, 뒤에는 동사원형이 와요. 여기서 꼭 구별해야 하는 게 must not인데요, must not은 ~하면 안 된다는 금지라서 의미가 완전히 반대예요. 그러니까 우리말에 필요가 없다가 나오면 반드시 don't have to를 떠올리세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 8\u003c/span>\u003cspan class=\"g-kind\">서술형(빈칸 완성)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>[3-4] 우리말과 일치하도록 주어진 단어를 사용하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-q\">너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003cbr>(have, tell)\u003cbr>→ \u003cspan class=\"p-blank\">\u003c/span> about your plan.\u003c/div>\u003cdiv class=\"p-words\">보기 단어: have, tell / 우리말: 너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">You don’t have to tell me\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"세 번째 문제는 우리말에 맞게 문장을 완성하는 문제예요. ~할 필요가 없다를 어떤 표현으로 쓰는지, 주어진 단어 두 개를 어떤 순서로 넣을지 생각해 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":7},{"n":22,"text":"정답은 you don't have to tell me까지입니다. ~할 필요가 없다는 don't have to로 쓰고, 그 뒤에 동사원형 tell과 목적어 me를 붙여 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 8\u003c/span>\u003cspan class=\"g-kind\">서술형(빈칸 완성)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>[3-4] 우리말과 일치하도록 주어진 단어를 사용하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-q sm\">너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003cbr>(have, tell)\u003cbr>→ \u003cspan class=\"p-blank\">\u003c/span> about your plan.\u003c/div>\u003cdiv class=\"p-words\">보기 단어: have, tell / 우리말: 너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">표현 찾기\u003c/b>'~할 필요가 없다'는 \u003cb class=\"key\">don't have to + 동사원형\u003c/b>으로 표현한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동사 배열\u003c/b>주어 You 뒤에 \u003cb class=\"key\">don't have to\u003c/b>를 놓고, 보기 단어 \u003cb class=\"key\">tell\u003c/b>을 동사원형 그대로 이어 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">목적어 확인\u003c/b>'나에게'에 해당하는 \u003cb class=\"key\">me\u003c/b>를 tell 뒤에 넣어 'You don't have to tell me about your plan.'을 완성한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 You don’t have to tell me\u003c/span>\u003cdiv class=\"p-full\">You don’t have to tell me about your plan.\u003c/div>\u003cdiv class=\"p-ko\">너는 나에게 너의 계획에 대해 말할 필요가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must not을 쓰면 '말하면 안 된다'는 금지가 되어 우리말 뜻과 달라진다.\u003c/div>","segs":[{"n":23,"text":"먼저 우리말에서 ~할 필요가 없다는 부분을 찾아요. 이건 don't have to로 표현한다고 배웠죠.","hl":"st-0"},{"n":24,"text":"주어 you 다음에 don't have to를 쓰고, 보기 단어인 tell을 동사원형 그대로 붙여 주면 됩니다.","hl":"st-1"},{"n":25,"text":"우리말에 나에게가 있으니 tell 뒤에 me를 넣어 주세요. 그래서 you don't have to tell me about your plan이 완성됩니다.","hl":"st-2"},{"n":26,"text":"이 문제의 함정도 짚고 갈게요. must not을 쓰면 '말하면 안 된다'는 금지가 되어 우리말 뜻과 달라진다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 8\u003c/span>\u003cspan class=\"g-kind\">서술형(빈칸 완성)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>[3-4] 우리말과 일치하도록 주어진 단어를 사용하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-q\">너는 소란을 너무 피우지 않는 게 좋겠다.\u003cbr>(had, make)\u003cbr>→ You \u003cspan class=\"p-blank\">\u003c/span> too much noise.\u003c/div>\u003cdiv class=\"p-words\">보기 단어: had, make / 우리말: 너는 소란을 너무 피우지 않는 게 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had better not make\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제도 문장 완성형이에요. 이번에는 ~하지 않는 게 좋겠다는 부정 충고인데요, not을 어디에 넣어야 하는지가 핵심입니다.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 had better not make입니다. had better의 부정은 not을 had better 뒤에 붙여서 had better not 다음에 동사원형을 쓰면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 8\u003c/span>\u003cspan class=\"g-kind\">서술형(빈칸 완성)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>[3-4] 우리말과 일치하도록 주어진 단어를 사용하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"p-q sm\">너는 소란을 너무 피우지 않는 게 좋겠다.\u003cbr>(had, make)\u003cbr>→ You \u003cspan class=\"p-blank\">\u003c/span> too much noise.\u003c/div>\u003cdiv class=\"p-words\">보기 단어: had, make / 우리말: 너는 소란을 너무 피우지 않는 게 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">표현 찾기\u003c/b>'~하지 않는 게 낫다[좋다]'는 \u003cb class=\"key\">had better의 부정형\u003c/b>으로 표현한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">not 위치\u003c/b>부정어 \u003cb class=\"key\">not\u003c/b>은 had better \u003cb class=\"key\">뒤\u003c/b>에 쓴다. had not better가 아니라 \u003cb class=\"key\">had better not\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">동사원형 확인\u003c/b>보기 단어 \u003cb class=\"key\">make\u003c/b>를 동사원형 그대로 붙여 'You had better not make too much noise.'를 완성한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 had better not make\u003c/span>\u003cdiv class=\"p-full\">You had better not make too much noise.\u003c/div>\u003cdiv class=\"p-ko\">너는 소란을 너무 피우지 않는 게 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>not을 had 앞에 써서 'had not better'로 쓰면 틀린다. 반드시 had better not 순서다.\u003c/div>","segs":[{"n":30,"text":"우리말에 ~하지 않는 게 좋겠다가 나오니, had better의 부정형을 써야겠다는 걸 먼저 떠올려요.","hl":"st-0"},{"n":31,"text":"여기서 실수가 많이 나오는데요, not은 절대 had 앞에 쓰지 않아요. 반드시 had better 뒤에 붙여서 had better not 순서로 씁니다.","hl":"st-1"},{"n":32,"text":"그다음 make를 동사원형 그대로 붙여 주면 you had better not make too much noise가 완성됩니다.","hl":"st-2"},{"n":33,"text":"이 문제의 함정도 짚고 갈게요. not을 had 앞에 써서 'had not better'로 쓰면 틀린다. 반드시 had better not 순서다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Lora \u003cu class=\"p-u\">could not\u003c/u> find anything to eat.\u003c/div>\u003cdiv class=\"p-op\">② Thanks to your help, I \u003cu class=\"p-u\">could\u003c/u> pass the exam.\u003c/div>\u003cdiv class=\"p-op\">③ \u003cu class=\"p-u\">Could\u003c/u> you show me the way to the National Museum?\u003c/div>\u003cdiv class=\"p-op\">④ He was very sick, so he \u003cu class=\"p-u\">could not\u003c/u> go to school yesterday.\u003c/div>\u003cdiv class=\"p-op\">⑤ I \u003cu class=\"p-u\">could not\u003c/u> sleep well last night.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다섯 번째 문제는 could의 의미가 다른 하나를 찾는 문제예요. 과거 이야기인지, 상대에게 부탁하는 상황인지 구분해서 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":7},{"n":36,"text":"정답은 세 번째입니다. 국립박물관에 가는 길을 알려 달라는 요청이고, 나머지 네 문장은 모두 과거에 ~할 수 있었다는 능력이나 가능을 나타내요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Lora \u003cu class=\"p-u\">could not\u003c/u> find anything to eat.\u003c/div>\u003cdiv class=\"p-op\">② Thanks to your help, I \u003cu class=\"p-u\">could\u003c/u> pass the exam.\u003c/div>\u003cdiv class=\"p-op\">③ \u003cu class=\"p-u\">Could\u003c/u> you show me the way to the National Museum?\u003c/div>\u003cdiv class=\"p-op\">④ He was very sick, so he \u003cu class=\"p-u\">could not\u003c/u> go to school yesterday.\u003c/div>\u003cdiv class=\"p-op\">⑤ I \u003cu class=\"p-u\">could not\u003c/u> sleep well last night.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">기준 세우기\u003c/b>could의 의미를 \u003cb class=\"key\">과거의 능력·가능\u003c/b>과 \u003cb class=\"key\">요청\u003c/b>으로 나눠서 본다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">①②④⑤ 확인\u003c/b>①은 '먹을 것을 찾을 수 없었다', ②는 '시험을 통과할 수 있었다', ④는 '학교에 갈 수 없었다', ⑤는 '잠을 잘 잘 수 없었다'로 모두 \u003cb class=\"key\">과거의 능력·가능\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>③의 Could you ~?는 '~해 주시겠어요?'라는 \u003cb class=\"key\">요청\u003c/b>의 의미이므로 나머지와 다르다. 따라서 \u003cb class=\"key\">③\u003c/b>이 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">① Lora는 먹을 것을 전혀 찾을 수 없었다. ② 네 도움 덕분에 나는 그 시험을 통과할 수 있었다. ③ 국립박물관에 가는 길 좀 알려 주시겠어요? ④ 그는 너무 아파서 어제 학교에 갈 수 없었다. ⑤ 나는 어젯밤에 잠을 잘 잘 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>②의 could를 미래나 추측으로 오해하기 쉽지만, 과거에 시험을 통과할 수 있었다는 과거의 가능이다.\u003c/div>","segs":[{"n":37,"text":"이 문제는 could의 의미를 구별하는 문제예요. 과거에 할 수 있었다는 뜻인지, 부탁하는 뜻인지 나눠서 보면 됩니다.","hl":"st-0"},{"n":38,"text":"첫 번째, 두 번째, 네 번째, 다섯 번째는 모두 어젯밤이나 시험 같은 과거 상황에서 할 수 있었다, 할 수 없었다를 말하고 있어요. 그래서 과거의 능력이나 가능이에요.","hl":"st-1"},{"n":39,"text":"세 번째는 국립박물관에 가는 길을 알려 달라고 부탁하는 요청 표현이에요. 그래서 의미가 다른 하나는 세 번째입니다.","hl":"st-2"},{"n":40,"text":"이 문제의 함정도 짚고 갈게요. 2번의 could를 미래나 추측으로 오해하기 쉽지만, 과거에 시험을 통과할 수 있었다는 과거의 가능이다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">must의 의미 (의무 vs 강한 추측)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">must\u003c/b>는 '~해야 한다'는 \u003cb class=\"key\">의무\u003c/b>와 '~임이 틀림없다'는 \u003cb class=\"key\">강한 추측\u003c/b>을 나타낸다. 뒤에 상태·판단 표현이 오거나 앞에 근거가 있으면 추측으로 본다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + must + 동사원형 / 주어 + must + be + 형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>행동 동사(complete, get angry)가 오면 의무\u003c/li>\u003cli>be tired, be true처럼 상태가 오면 강한 추측\u003c/li>\u003cli>앞 문장에 근거가 제시되면 추측일 가능성이 높다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Tom must complete his report.\u003c/div>\u003cdiv class=\"g-ko\">Tom은 자신의 보고서를 완성해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Susan must be tired.\u003c/div>\u003cdiv class=\"g-ko\">Susan은 피곤한 것이 틀림없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"must는 두 얼굴을 가진 조동사예요. 하나는 ~해야 한다는 의무이고, 다른 하나는 ~임이 틀림없다는 강한 추측이죠. 구별하는 방법은 뒤에 오는 말을 보는 거예요. complete나 get angry처럼 누가 하는 행동이 오면 의무, be tired나 be true처럼 상태나 판단이 오면 추측으로 보면 됩니다. 또 앞 문장에 근거가 제시되어 있으면 추측일 가능성이 아주 높아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Tom \u003cu class=\"p-u\">must\u003c/u> complete his report by 10 o’clock.\u003c/div>\u003cdiv class=\"p-op\">② Susan \u003cu class=\"p-u\">must\u003c/u> be tired after her hard work.\u003c/div>\u003cdiv class=\"p-op\">③ She \u003cu class=\"p-u\">must\u003c/u> get angry at his rude actions.\u003c/div>\u003cdiv class=\"p-op\">④ There \u003cu class=\"p-u\">must\u003c/u> be something in the box. It looks so heavy.\u003c/div>\u003cdiv class=\"p-op\">⑤ The rumor about him \u003cu class=\"p-u\">must\u003c/u> be true.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">①\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":42,"text":"여섯 번째 문제는 must의 의미를 구별하는 문제예요. 의무인지 강한 추측인지, 뒤에 오는 말과 앞뒤 상황을 함께 보세요.","hl":"q"},{"n":43,"text":"","hl":"q","pause":7},{"n":44,"text":"정답은 첫 번째입니다. 보고서를 완성해야 한다는 의무이고, 나머지는 모두 ~임이 틀림없다는 강한 추측입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Tom \u003cu class=\"p-u\">must\u003c/u> complete his report by 10 o’clock.\u003c/div>\u003cdiv class=\"p-op\">② Susan \u003cu class=\"p-u\">must\u003c/u> be tired after her hard work.\u003c/div>\u003cdiv class=\"p-op\">③ She \u003cu class=\"p-u\">must\u003c/u> get angry at his rude actions.\u003c/div>\u003cdiv class=\"p-op\">④ There \u003cu class=\"p-u\">must\u003c/u> be something in the box. It looks so heavy.\u003c/div>\u003cdiv class=\"p-op\">⑤ The rumor about him \u003cu class=\"p-u\">must\u003c/u> be true.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">기준 세우기\u003c/b>must의 의미를 \u003cb class=\"key\">의무\u003c/b>(~해야 한다)와 \u003cb class=\"key\">강한 추측\u003c/b>(~임이 틀림없다)으로 나눠 본다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">②③④⑤ 확인\u003c/b>②는 '피곤한 것이 틀림없다', ③은 '화가 난 게 틀림없다', ④는 '무언가 있는 게 틀림없다', ⑤는 '사실임이 틀림없다'로 모두 \u003cb class=\"key\">강한 추측\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">① 확인\u003c/b>①은 Tom이 10시까지 보고서를 \u003cb class=\"key\">완성해야 한다\u003c/b>는 \u003cb class=\"key\">의무\u003c/b>의 의미이므로 나머지와 다르다. 따라서 \u003cb class=\"key\">①\u003c/b>이 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ①\u003c/span>\u003cdiv class=\"p-ko\">① Tom은 10시까지 자신의 보고서를 완성해야 한다. ② Susan은 그녀의 힘든 일이 끝나고 피곤한 것이 틀림없다. ③ 그녀는 그의 무례한 행동에 화가 난 게 틀림없다. ④ 그 상자 안에 무언가 있는 게 틀림없다. 그것은 무거워 보인다. ⑤ 그에 대한 그 소문은 사실임이 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>③의 get angry를 상태 표현으로 착각하기 쉽지만, 화가 나는 행동을 해야 한다가 아니라 화가 난 게 틀림없다는 추측이다.\u003c/div>","segs":[{"n":45,"text":"must는 의무와 강한 추측, 두 가지 뜻이 있었죠. 각 문장이 어느 쪽인지 하나씩 확인해 볼게요.","hl":"st-0"},{"n":46,"text":"두 번째부터 다섯 번째까지는 모두 ~임이 틀림없다는 강한 추측이에요. 특히 네 번째는 상자가 무거워 보인다는 근거까지 제시되어 있죠.","hl":"st-1"},{"n":47,"text":"첫 번째는 톰이 십 시까지 보고서를 완성해야 한다는 의무의 뜻이에요. 그래서 의미가 다른 하나는 첫 번째입니다.","hl":"st-2"},{"n":48,"text":"이 문제의 함정도 짚고 갈게요. 3번의 get angry를 상태 표현으로 착각하기 쉽지만, 화가 나는 행동을 해야 한다가 아니라 화가 난 게 틀림없다는 추측이다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">may의 의미 (추측 vs 허가)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">may\u003c/b>는 '~일지도 모른다'는 \u003cb class=\"key\">추측\u003c/b>과 '~해도 된다'는 \u003cb class=\"key\">허가\u003c/b>를 나타낸다. 상대에게 허락하는 상황이면 허가로 읽는다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + may + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>추측: ~일지도[할지도] 모른다\u003c/li>\u003cli>허가: You may ~ (~해도 된다)\u003c/li>\u003cli>주어가 you이고 허락·권유 상황이면 허가\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Bill may be late for the class.\u003c/div>\u003cdiv class=\"g-ko\">Bill은 수업에 늦을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You may visit us at any time.\u003c/div>\u003cdiv class=\"g-ko\">너는 언제든 우리를 방문해도 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"may도 두 가지 뜻이 있어요. ~일지도 모른다는 추측과 ~해도 된다는 허가입니다. 주어가 you이고 상대에게 무엇을 해도 된다고 허락하는 상황이면 허가로 읽으면 돼요. 반대로 어떤 일이 일어날지 모른다고 말하는 문장에서는 추측이에요. 이렇게 상황을 함께 보는 습관이 정말 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Jane \u003cu class=\"p-u\">may\u003c/u> agree with the decision.\u003c/div>\u003cdiv class=\"p-op\">② She \u003cu class=\"p-u\">may\u003c/u> need some help with her project.\u003c/div>\u003cdiv class=\"p-op\">③ Bill \u003cu class=\"p-u\">may\u003c/u> be late for the class because he woke up late.\u003c/div>\u003cdiv class=\"p-op\">④ There \u003cu class=\"p-u\">may\u003c/u> be heavy rain later, so bring an umbrella.\u003c/div>\u003cdiv class=\"p-op\">⑤ You \u003cu class=\"p-u\">may\u003c/u> visit us at any time.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":50,"text":"일곱 번째 문제는 may의 의미를 구별하는 문제예요. ~일지도 모른다는 추측인지, ~해도 된다는 허가인지 확인해 보세요.","hl":"q"},{"n":51,"text":"","hl":"q","pause":7},{"n":52,"text":"정답은 다섯 번째입니다. 언제든 방문해도 된다는 허가의 의미이고, 나머지는 모두 추측이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 8\u003c/span>\u003cspan class=\"g-kind\">의미가 다른 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>[5-7] 다음 중 밑줄 친 부분의 의미가 다른 하나를 고르세요.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Jane \u003cu class=\"p-u\">may\u003c/u> agree with the decision.\u003c/div>\u003cdiv class=\"p-op\">② She \u003cu class=\"p-u\">may\u003c/u> need some help with her project.\u003c/div>\u003cdiv class=\"p-op\">③ Bill \u003cu class=\"p-u\">may\u003c/u> be late for the class because he woke up late.\u003c/div>\u003cdiv class=\"p-op\">④ There \u003cu class=\"p-u\">may\u003c/u> be heavy rain later, so bring an umbrella.\u003c/div>\u003cdiv class=\"p-op\">⑤ You \u003cu class=\"p-u\">may\u003c/u> visit us at any time.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">기준 세우기\u003c/b>may의 의미를 \u003cb class=\"key\">추측\u003c/b>(~일지도 모른다)과 \u003cb class=\"key\">허가\u003c/b>(~해도 된다)로 나눠 본다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">①~④ 확인\u003c/b>①은 '동의할지도 모른다', ②는 '필요할지도 모른다', ③은 '늦을지도 모른다', ④는 '비가 올지도 모른다'로 모두 \u003cb class=\"key\">추측\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">⑤ 확인\u003c/b>⑤는 '언제든 방문해도 된다'는 \u003cb class=\"key\">허가\u003c/b>의 의미이므로 나머지와 다르다. 따라서 \u003cb class=\"key\">⑤\u003c/b>가 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-ko\">① Jane은 그 결정에 동의할지도 모른다. ② 그녀는 자신의 프로젝트에 도움이 좀 필요할지도 모른다. ③ Bill은 늦게 일어났기 때문에 수업에 늦을지도 모른다. ④ 나중에 많은 비가 올지도 모른다. 그러니 우산을 챙겨가라. ⑤ 너는 언제든 우리를 방문해도 된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>④에서 so bring an umbrella 때문에 허가로 보기 쉽지만, 비가 올지도 모른다는 추측이다.\u003c/div>","segs":[{"n":53,"text":"may도 추측과 허가, 두 가지 뜻이 있어요. 각 문장이 어느 쪽인지 확인해 봅시다.","hl":"st-0"},{"n":54,"text":"첫 번째부터 네 번째까지는 모두 ~일지도 모른다는 추측이에요. 어떤 일이 일어날지 확실하지 않다고 말하고 있죠.","hl":"st-1"},{"n":55,"text":"다섯 번째는 너는 언제든 우리를 방문해도 된다는 허락의 표현이에요. 그래서 의미가 다른 하나는 다섯 번째입니다.","hl":"st-2"},{"n":56,"text":"이 문제의 함정도 짚고 갈게요. 네 번째에서 so bring an umbrella 때문에 허가로 보기 쉽지만, 비가 올지도 모른다는 추측이다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 8\u003c/span>\u003cspan class=\"g-kind\">공통 빈칸 선택\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>[8-9] 다음 중 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q\">• \u003cspan class=\"p-blank\">\u003c/span> you speak a little bit slowly?\u003cbr>• The weather was fine, so we \u003cspan class=\"p-blank\">\u003c/span> play outside.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① Can[can]\u003c/div>\u003cdiv class=\"p-op\">② Could[could]\u003c/div>\u003cdiv class=\"p-op\">③ May[may]\u003c/div>\u003cdiv class=\"p-op\">④ Will[will]\u003c/div>\u003cdiv class=\"p-op\">⑤ Must[must]\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":57,"text":"여덟 번째 문제는 두 문장의 빈칸에 공통으로 들어갈 조동사를 찾는 문제예요. 첫 문장은 요청, 두 번째 문장은 과거의 가능이라는 점을 놓치지 마세요.","hl":"q"},{"n":58,"text":"","hl":"q","pause":7},{"n":59,"text":"정답은 두 번째 선택지인 could입니다. 첫 문장은 조금 천천히 말씀해 주시겠어요라는 요청이고, 두 번째 문장은 날씨가 좋아서 밖에서 놀 수 있었다는 과거의 가능이라 could 하나로 둘 다 해결됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 8\u003c/span>\u003cspan class=\"g-kind\">공통 빈칸 선택\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>[8-9] 다음 중 빈칸에 공통으로 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"p-q sm\">• \u003cspan class=\"p-blank\">\u003c/span> you speak a little bit slowly?\u003cbr>• The weather was fine, so we \u003cspan class=\"p-blank\">\u003c/span> play outside.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① Can[can]\u003c/div>\u003cdiv class=\"p-op\">② Could[could]\u003c/div>\u003cdiv class=\"p-op\">③ May[may]\u003c/div>\u003cdiv class=\"p-op\">④ Will[will]\u003c/div>\u003cdiv class=\"p-op\">⑤ Must[must]\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 문장 분석\u003c/b>'조금 천천히 말씀해 주시겠어요?'는 \u003cb class=\"key\">요청\u003c/b>이므로 \u003cb class=\"key\">Could you ~?\u003c/b> 또는 Can you ~?가 필요하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">둘째 문장 분석\u003c/b>'날씨가 좋아서 우리는 밖에서 놀 수 있었다'는 \u003cb class=\"key\">과거의 가능\u003c/b>이므로 \u003cb class=\"key\">could + 동사원형\u003c/b>이 필요하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">공통 조동사 찾기\u003c/b>③ May, ④ Will, ⑤ Must는 두 문장 모두에 들어갈 수 없고, ① Can은 두 번째 문장이 \u003cb class=\"key\">과거\u003c/b>라 쓸 수 없다. 따라서 \u003cb class=\"key\">② Could[could\u003c/b>]가 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-full\">Could you speak a little bit slowly? / The weather was fine, so we could play outside.\u003c/div>\u003cdiv class=\"p-ko\">• 조금 천천히 말씀해 주시겠어요? • 날씨가 좋아서 우리는 밖에서 놀 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>첫 문장만 보고 Can을 고르면 두 번째 문장이 과거라는 점을 놓쳐 틀린다. 두 문장을 모두 확인해야 한다.\u003c/div>","segs":[{"n":60,"text":"첫 번째 문장은 상대에게 조금 천천히 말해 달라고 부탁하는 요청이에요. 그래서 could you나 can you가 필요합니다.","hl":"st-0"},{"n":61,"text":"두 번째 문장을 보면 날씨가 좋았다는 과거 상황이고, 우리는 밖에서 놀 수 있었다는 과거의 가능을 말하고 있어요. 그래서 여기에는 could가 와야 합니다.","hl":"st-1"},{"n":62,"text":"세 번째 may와 네 번째 will, 다섯 번째 must는 두 문장에 다 들어갈 수 없어요. 첫 번째 can은 두 번째 문장이 과거라서 쓸 수 없고요. 그래서 두 문장을 모두 채울 수 있는 것은 두 번째 선택지 could입니다.","hl":"st-2"},{"n":63,"text":"이 문제의 함정도 짚고 갈게요. 첫 문장만 보고 Can을 고르면 두 번째 문장이 과거라는 점을 놓쳐 틀린다. 두 문장을 모두 확인해야 한다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 (can/could, must, may, had better, have to)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>충고는 \u003cb class=\"key\">had better + 동사원형\u003c/b>, 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>으로 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">can/could\u003c/b>는 능력·가능, 허가, 요청의 의미를 가지므로 문장 상황으로 구별한다.\u003c/li>\u003cli>\u003cb class=\"key\">~할 필요가 없다\u003c/b>는 don't have to이며, must not(~하면 안 된다)과 반드시 구별한다.\u003c/li>\u003cli>\u003cb class=\"key\">must\u003c/b>는 의무와 강한 추측, \u003cb class=\"key\">may\u003c/b>는 추측과 허가로 의미가 갈린다.\u003c/li>\u003cli>요청은 \u003cb class=\"key\">Could you ~?\u003c/b>, 과거의 가능은 \u003cb class=\"key\">could + 동사원형\u003c/b>으로 표현한다.\u003c/li>\u003c/ul>","segs":[{"n":64,"text":"오늘은 조동사의 의미를 구별하는 문제를 집중적으로 풀어 봤어요. 조동사는 뜻이 하나가 아니라 여러 개라서, 문장의 상황과 뒤에 오는 말을 함께 보는 습관이 가장 중요합니다. had better, have to, must, may, can과 could의 대표 의미를 정리해 두고 다음 문제에서도 꼭 활용해 보세요.","hl":"sum"}]}]});</script></body></html>
