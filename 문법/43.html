  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;

lecturePlayer(document.getElementById("app"),{"lc":["\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 밑줄 친 말 알아보기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'where I can see the whole town'의 역할(쓰임)은?\u003c/div>\u003cdiv class=\"g-qs\">My favorite place is the rooftop, where I can see the whole town.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>주어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>목적어\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>보어\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>계속적 수식어\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">계속적 수식어\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">콤마 뒤의 관계부사절은 선행사를 계속해서 부연 설명하는 수식어 역할을 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 형식 고르기\u003c/span>\u003cdiv class=\"g-q\">이 문장의 형식은?\u003c/div>\u003cdiv class=\"g-qs\">Come on Friday, when I will be free.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>SV\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>SVA\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>SVC\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>SVO\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">SVC\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">when절 내부의 'I(주어) will be(동사) free(보어)'는 2형식(SVC) 구조입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'which'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">We stayed at a farmhouse, which we learned how to make cheese.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">장소 선행사(a farmhouse) 뒤의 절이 완전하므로 관계대명사 which가 아니라 관계부사 where를 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 어법 O/X 고치기\u003c/span>\u003cdiv class=\"g-q\">밑줄 친 'where'은(는) 어법상 맞나요?\u003c/div>\u003cdiv class=\"g-qs\">The astronauts landed on the Moon in 1969, where millions of people watched the event.\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>O\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>X\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">X\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">선행사가 연도(1969)라는 시간이므로 장소인 where 대신 시간의 관계부사 when을 써야 합니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 객관식\u003c/span>\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분의 쓰임이 나머지 와 다른 것은?\u003c/div>\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I know the day &lt;u&gt;when&lt;/u&gt; she will arrive.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>This is the town &lt;u&gt;where&lt;/u&gt; I was born.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>We visited Seoul, &lt;u&gt;where&lt;/u&gt; my grandparents live.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Tell me the time &lt;u&gt;when&lt;/u&gt; we should start.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>Show me the place &lt;u&gt;where&lt;/u&gt; you lost your bag.\u003c/button>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">We visited Seoul, &lt;u&gt;where&lt;/u&gt; my grandparents live.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">3번 문장의 where 앞에는 콤마가 있어 계속적 용법으로 쓰였고, 나머지는 선행사를 한정하는 일반적인 관계부사절입니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 전환 · 배열\u003c/span>\u003cdiv class=\"g-q\">두 문장을 콤마와 관계부사 where를 이용하여 하나의 문장으로 합치기 바꾼 문장을 배열하여 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">I visited Gyeongju, where I saw many old temples.\u003c/span>\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 배열\u003c/span>\u003cdiv class=\"g-q\">알맞은 순서로 배열하여 문장을 완성하세요. (우리는 제주도에 갔는데, 거기에서 아름다운 바다를 보았다.)\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">We went to Jeju-do, where we saw the beautiful sea.\u003c/span>\u003c/div>\u003cdiv class=\"g-exp\">선행사 뒤에 콤마와 관계부사 where를 쓰고 완전한 절을 이어줍니다.\u003c/div>\u003c/div>","\u003cdiv class=\"lc-q\">\u003cspan class=\"g-kind\">구문 · 문장 전환 · 배열\u003c/span>\u003cdiv class=\"g-q\">두 문장을 콤마가 있는 계속적 용법의 관계부사절로 바꾸기 바꾼 문장을 배열하여 완성하세요.\u003c/div>\u003cdiv class=\"g-ans\">\u003cspan class=\"a\">Sunday is a day, when we usually rest.\u003c/span>\u003c/div>\u003c/div>"],"brand":"Syntax","title":"플러스구문(Essential) UNIT 43","audioDir":"43_audio","preview":false,"count":223,"slides":[{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-badge an-pop\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">UNIT\u003cbr>43\u003c/span>\u003c/div>\u003cdiv class=\"k-big\">\u003cspan class=\"an-bnc\">📌\u003c/span>\u003c/div>\u003ch1 class=\"gk-h1 an\" style=\"--d:0.30s\">콤마 뒤의 관계부사절 해석 공식\u003c/h1>\u003cdiv class=\"g-en2 an\" style=\"--d:0.60s\">S + V + ~, where / when ~\u003c/div>\u003cdiv class=\"k-src\">플러스구문(Essential)\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 우리는 콤마 뒤에 숨어 있는 아주 특별한 표현인 계속용법 관계부사를 시원하게 정복해 보겠습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag an-pop\">도입\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"g-scene\" data-hl=\"hs\">\u003cspan class=\"an-pop\" style=\"display:inline-block;--d:0.00s\">🏃\u003c/span>\u003cspan class=\"an-pop\" style=\"display:inline-block;--d:0.25s\">🏙️\u003c/span>\u003cspan class=\"an-pop\" style=\"display:inline-block;--d:0.50s\">❓\u003c/span>\u003c/div>\u003cdiv class=\"g-dlg\">\u003cdiv class=\"g-bub gx\" data-rv=\"hd0\" data-hl=\"hd0\">\u003cspan class=\"w\">📖\u003c/span>\u003cb>We went to Sokcho, where we saw the sunrise.\u003c/b>\u003csmall>우리는 속초에 갔는데, 거기에서 해돋이를 보았다.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-q gx\" data-rv=\"hq\" data-hl=\"hq\">\u003cb>Q\u003c/b>문장 끝에 콤마가 있고 where가 나오면, 장소를 어디
