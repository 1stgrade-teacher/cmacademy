}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"누적 TEST Chapters 1-3","audioDir":"test-1to3_audio","preview":false,"count":106,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">고1·2 어법 종합: 분사, 관계부사, 수일치, 준동사, 수동태, 병렬, 대명사\u003c/div>\u003ch1>누적 TEST Chapters 1-3 어법 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 틀린 것 고르기, 개수 고르기, 틀린 부분 고치기, 어순 배열, 지문 어법, 영작 서술형\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 누적 테스트 첫 단원부터 세 단원까지의 어법 문제를 함께 풀어 볼 거예요. 분사와 관계부사, 수일치, 준동사, 수동태처럼 시험에 반복해서 나오는 개념을 문제 속에서 하나씩 확인하겠습니다. 정답만 외우는 게 아니라 왜 그 선택지가 틀렸는지까지 짚어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사(현재분사와 과거분사)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사는 동사에 -ing나 -ed를 붙여 명사를 수식하거나 분사구문으로 쓰며, 능동·진행의 의미면 \u003cb class=\"key\">현재분사\u003c/b>, 수동·완료의 의미면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">능동·진행 → -ing / 수동·완료 → p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명사 뒤에서 형용사처럼 수식\u003c/li>\u003cli>분사구문의 의미상 주어와 능동·수동 판단\u003c/li>\u003cli>감정을 나타내는 분사는 -ing와 -ed 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The painting was stolen, causing a sensation.\u003c/div>\u003cdiv class=\"g-ko\">그 그림이 도난당해서 큰 화제를 일으켰다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">a trunk belonging to an immigrant\u003c/div>\u003cdiv class=\"g-ko\">한 이민자 소유의 여행 가방\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 분사부터 정리할게요. 분사는 동사에 ing를 붙이거나 과거분사 형태를 써서 명사를 꾸며 주거나 문장을 이어 주는 역할을 합니다. 의미상 주어가 스스로 하는 일이면 현재분사를 쓰고, 당하는 일이거나 이미 끝난 상태면 과거분사를 씁니다. 예를 들어 어떤 그림이 도난당해서 화제를 일으켰다면 causing처럼 현재분사로 앞 절의 결과를 이어 줄 수 있어요. 반대로 이민자에게 속해 있는 여행 가방은 belonging to처럼 능동의 현재분사로 표현합니다. 시험에서는 명사 뒤에 오는 분사가 능동인지 수동인지부터 확인해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계부사 where\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">장소를 나타내는 선행사 뒤에서 그 장소에서라는 의미를 이어 줄 때 \u003cb class=\"key\">where\u003c/b>를 쓰고, where 뒤에는 주어와 동사가 갖추어진 완전한 절이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">장소 명사 + where + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>선행사가 장소인지 확인\u003c/li>\u003cli>where 뒤 절은 불완전하지 않음\u003c/li>\u003cli>where = in which로 바꿔 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">the empty space where the painting had once hung\u003c/div>\u003cdiv class=\"g-ko\">그 그림이 한때 걸려 있던 빈 공간\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">the city where I was born\u003c/div>\u003cdiv class=\"g-ko\">내가 태어난 도시\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"다음은 관계부사 where입니다. 장소를 나타내는 명사 뒤에서 그 장소에서라는 뜻으로 절을 이어 줄 때 where를 씁니다. 중요한 점은 where 뒤에는 주어와 동사가 모두 있는 완전한 절이 온다는 거예요. 예를 들어 그림이 한때 걸려 있던 빈 공간은 the empty space where the painting had once hung처럼 표현합니다. where를 in which로 바꿔도 말이 되면 관계부사 where를 제대로 쓴 경우입니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and, or, but으로 연결되는 요소는 \u003cb class=\"key\">같은 문법 형태\u003c/b>로 맞춰야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">A and B / A, B, and C (같은 품사·형태)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동사와 동사, 분사와 분사 연결\u003c/li>\u003cli>병렬 연결 앞뒤 형태 비교\u003c/li>\u003cli>and 뒤만 보지 말고 앞 전체 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He had hidden, taken, and run off.\u003c/div>\u003cdiv class=\"g-ko\">그는 숨어 있었고, 가져갔고, 도망쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">gained the use of their hands and developed a brain\u003c/div>\u003cdiv class=\"g-ko\">손의 사용을 얻었고 뇌를 발달시켰다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"병렬 구조는 연결어 앞뒤의 형태를 똑같이 맞추는 규칙입니다. and나 or, but이 나오면 앞에 있는 요소와 뒤에 있는 요소가 같은 품사인지, 같은 동사 형태인지 확인해야 해요. 예를 들어 숨어 있었고 가져갔고 도망쳤다는 문장에서는 hidden, taken, run이 모두 과거분사로 나란히 연결됩니다. 한쪽만 동사원형으로 바꾸면 병렬이 깨지므로 연결어 앞뒤를 함께 보는 습관이 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">The Mona Lisa was installed in the Louvre Museum at the turn of the 19th century. In 1911 the painting was stolen, ① \u003cu class=\"p-u\">causing\u003c/u> an immediate media sensation. People flocked to the Louvre to view the empty space ② \u003cu class=\"p-u\">where\u003c/u> the painting had once hung. Two years later an art dealer in Florence alerted local authorities that a man had tried to sell him the painting. Police found that the portrait was stashed in the false bottom of a trunk ③ \u003cu class=\"p-u\">belonged\u003c/u> to Vincenzo Peruggia, an Italian immigrant who had briefly worked at the Louvre fitting glass on a selection of paintings, including the Mona Lisa. He had hidden in a closet overnight, taken the portrait from the wall and ④ \u003cu class=\"p-u\">run\u003c/u> off without suspicion. Peruggia was arrested, tried, and imprisoned, while the Mona Lisa took a tour of Italy before ⑤ \u003cu class=\"p-u\">making\u003c/u> its triumphant return to France.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① causing\u003c/div>\u003cdiv class=\"p-op\">② where\u003c/div>\u003cdiv class=\"p-op\">③ belonged\u003c/div>\u003cdiv class=\"p-op\">④ run\u003c/div>\u003cdiv class=\"p-op\">⑤ making\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":5,"text":"첫 번째 문제는 모나리자 도난 사건을 다룬 글이에요. 각 밑줄이 명사를 꾸미는 분사인지, 관계부사인지, 병렬 구조인지 차례대로 확인해 봅시다.","hl":"q"},{"n":6,"text":"","hl":"q","pause":7},{"n":7,"text":"정답은 세 번째 선택지입니다. a trunk 뒤에서 페루자에게 속해 있는 가방을 나타내려면 belonged가 아니라 현재분사 belonging을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">The Mona Lisa was installed in the Louvre Museum at the turn of the 19th century. In 1911 the painting was stolen, ① \u003cu class=\"p-u\">causing\u003c/u> an immediate media sensation. People flocked to the Louvre to view the empty space ② \u003cu class=\"p-u\">where\u003c/u> the painting had once hung. Two years later an art dealer in Florence alerted local authorities that a man had tried to sell him the painting. Police found that the portrait was stashed in the false bottom of a trunk ③ \u003cu class=\"p-u\">belonged\u003c/u> to Vincenzo Peruggia, an Italian immigrant who had briefly worked at the Louvre fitting glass on a selection of paintings, including the Mona Lisa. He had hidden in a closet overnight, taken the portrait from the wall and ④ \u003cu class=\"p-u\">run\u003c/u> off without suspicion. Peruggia was arrested, tried, and imprisoned, while the Mona Lisa took a tour of Italy before ⑤ \u003cu class=\"p-u\">making\u003c/u> its triumphant return to France.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① causing\u003c/div>\u003cdiv class=\"p-op\">② where\u003c/div>\u003cdiv class=\"p-op\">③ belonged\u003c/div>\u003cdiv class=\"p-op\">④ run\u003c/div>\u003cdiv class=\"p-op\">⑤ making\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① causing 확인\u003c/b>앞 절 전체의 결과를 이어 주는 분사구문이므로 \u003cb class=\"key\">causing\u003c/b>은 맞습니다. 도난당한 결과 화제가 즉시 일어났다는 능동 흐름입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② where 확인\u003c/b>장소 선행사 the empty space 뒤에서 \u003cb class=\"key\">where\u003c/b>가 완전한 절을 이끌고 있으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ belonged 확인\u003c/b>a trunk를 수식하는 분사 자리입니다. 가방이 페루자에게 속해 있는 것은 능동이므로 \u003cb class=\"key\">belonging\u003c/b>이 되어야 합니다. belonged는 과거동사라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ run 확인\u003c/b>had hidden, taken, and \u003cb class=\"key\">run\u003c/b>이 모두 과거분사로 병렬 연결되어 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ making 확인\u003c/b>while절과 함께 이어지는 분사구문으로 \u003cb class=\"key\">making\u003c/b>이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">Police found that the portrait was stashed in the false bottom of a trunk belonging to Vincenzo Peruggia.\u003c/div>\u003cdiv class=\"p-ko\">모나리자는 도난당해 즉시 미디어의 센세이션을 일으켰고, 사람들은 그림이 걸려 있던 빈 공간을 보려 몰려들었다. 범인 페루자는 체포되어 수감되었고, 모나리자는 이탈리아 순회 후 프랑스로 돌아왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>belong은 자동사라서 belonged to를 수동으로 해석하지 말고, 명사 뒤에서는 belonging to로 능동 수식임을 기억하세요.\u003c/div>","segs":[{"n":8,"text":"첫 번째 선택지부터 볼게요. 그림이 도난당한 일이 즉시 화제를 일으켰다는 결과를 이어 주는 자리라서 causing은 자연스럽습니다.","hl":"st-0"},{"n":9,"text":"두 번째 선택지는 장소인 빈 공간 뒤에 나오는 where예요. 뒤에 주어와 동사가 갖추어져 있으니 관계부사 where가 맞습니다.","hl":"st-1"},{"n":10,"text":"세 번째 선택지가 핵심입니다. 여행 가방이 어떤 사람에게 속해 있는 상태를 나타내려면 능동의 현재분사 belonging을 써야 해요. belonged는 동사 형태라서 명사를 꾸밀 수 없습니다.","hl":"st-2"},{"n":11,"text":"네 번째 선택지는 앞의 hidden과 taken에 이어지는 병렬 구조예요. run off의 과거분사 run이 나란히 연결되어 있으므로 문제가 없습니다.","hl":"st-3"},{"n":12,"text":"다섯 번째 선택지는 여행을 마치고 귀환하는 과정을 이어 주는 분사구문이라서 making이 알맞습니다.","hl":"st-4"},{"n":13,"text":"이 문제의 함정도 짚고 갈게요. belong은 자동사라서 belonged to를 수동으로 해석하지 말고, 명사 뒤에서는 belonging to로 능동 수식임을 기억하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사와 동명사의 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사는 명사적·형용사적·부사적 역할을 하고, 동명사는 주어·목적어·보어 자리에서 명사처럼 쓰이며, 목적을 나타낼 때는 \u003cb class=\"key\">to + 동사원형\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">to + 동사원형 / 동사 + -ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어 자리에는 to부정사와 동명사 모두 가능\u003c/li>\u003cli>목적을 나타내면 to부정사\u003c/li>\u003cli>전치사 뒤에는 동명사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">To deny reality is to deny facts.\u003c/div>\u003cdiv class=\"g-ko\">현실을 부정하는 것은 사실을 부정하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">energy required for cell function\u003c/div>\u003cdiv class=\"g-ko\">세포 기능에 필요한 에너지\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":14,"text":"to부정사와 동명사는 모양은 다르지만 명사 자리에 들어갈 수 있다는 공통점이 있어요. to부정사는 목적을 나타낼 때 자주 쓰이고, 동명사는 전치사 뒤나 주어, 목적어 자리에서 자연스럽게 쓰입니다. 예를 들어 현실을 부정하는 것은 사실을 부정하는 것이다라는 문장에서는 to deny가 주어와 보어 역할을 합니다. 반면에 세포 기능에 필요한 에너지처럼 명사를 수식할 때는 require의 과거분사 required가 쓰입니다. 준동사가 나오면 그 자리가 명사 자리인지, 형용사 자리인지, 목적을 나타내는 부사 자리인지 먼저 판단해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어-동사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사는 주어의 인칭과 수에 맞추며, 주어 뒤의 \u003cb class=\"key\">along with, together with, as well as\u003c/b> 같은 표현은 주어의 수에 영향을 주지 않습니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 주어 + 단수 동사 / 복수 주어 + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>진짜 주어 찾기\u003c/li>\u003cli>전치사구와 수식어는 무시\u003c/li>\u003cli>동명사·to부정사 주어는 단수 취급\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Each type of cell is adapted.\u003c/div>\u003cdiv class=\"g-ko\">각 세포 유형은 적응되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">These cells along with other cells have characteristics.\u003c/div>\u003cdiv class=\"g-ko\">이 세포들은 다른 세포들과 함께 특징을 가진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"주어와 동사의 수일치는 문장의 뼈대를 잡는 가장 기본적인 규칙입니다. 동사는 진짜 주어의 수에 맞춰야 하고, 주어 뒤에 along with나 together with 같은 표현이 붙어도 주어의 수는 바뀌지 않습니다. 예를 들어 these cells along with other cells에서는 앞의 these cells가 진짜 주어라서 복수 동사 have를 씁니다. 또 동명사나 to부정사가 주어로 오면 단수 동사를 쓰는 것도 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Many behavioral-genetic studies show that permanently ① \u003cu class=\"p-u\">changing\u003c/u> one's happiness levels is very difficult, if not impossible. For example, evidence from a sample of twins ② \u003cu class=\"p-u\">to suggest\u003c/u> that the heritability of happiness may be as high as 80%, although a more widely accepted figure is 50%. This suggests that each person has an inborn &quot;attractor&quot; for happiness, which he or she can orbit around, but never ③ \u003cu class=\"p-u\">leave\u003c/u> behind. In other words, a person may have a &quot;set range&quot; that includes the most likely or ④ \u003cu class=\"p-u\">expected\u003c/u> value in his or her temporal distribution of happiness across the life span. Consistent with this idea, Headey and Wearing found in their study ⑤ \u003cu class=\"p-u\">that\u003c/u> participants tended to keep returning to their own baselines over time.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① changing\u003c/div>\u003cdiv class=\"p-op\">② to suggest\u003c/div>\u003cdiv class=\"p-op\">③ leave\u003c/div>\u003cdiv class=\"p-op\">④ expected\u003c/div>\u003cdiv class=\"p-op\">⑤ that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"두 번째 문제는 행복의 유전율과 기준선에 관한 글이에요. 준동사 주어, 주동사, 조동사 뒤 형태를 중심으로 밑줄을 확인해 봅시다.","hl":"q"},{"n":17,"text":"","hl":"q","pause":7},{"n":18,"text":"정답은 두 번째 선택지입니다. evidence from a sample of twins가 주어이므로 to suggest가 아니라 단수 동사 suggests가 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Many behavioral-genetic studies show that permanently ① \u003cu class=\"p-u\">changing\u003c/u> one's happiness levels is very difficult, if not impossible. For example, evidence from a sample of twins ② \u003cu class=\"p-u\">to suggest\u003c/u> that the heritability of happiness may be as high as 80%, although a more widely accepted figure is 50%. This suggests that each person has an inborn &quot;attractor&quot; for happiness, which he or she can orbit around, but never ③ \u003cu class=\"p-u\">leave\u003c/u> behind. In other words, a person may have a &quot;set range&quot; that includes the most likely or ④ \u003cu class=\"p-u\">expected\u003c/u> value in his or her temporal distribution of happiness across the life span. Consistent with this idea, Headey and Wearing found in their study ⑤ \u003cu class=\"p-u\">that\u003c/u> participants tended to keep returning to their own baselines over time.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① changing\u003c/div>\u003cdiv class=\"p-op\">② to suggest\u003c/div>\u003cdiv class=\"p-op\">③ leave\u003c/div>\u003cdiv class=\"p-op\">④ expected\u003c/div>\u003cdiv class=\"p-op\">⑤ that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① changing 확인\u003c/b>permanently \u003cb class=\"key\">changing\u003c/b> one's happiness levels가 동명사 주어이고, 단수 동사 is와 호응하므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② to suggest 확인\u003c/b>evidence from a sample of twins가 주어이므로 동사 자리에는 \u003cb class=\"key\">suggests\u003c/b>가 와야 합니다. to suggest는 주동사가 될 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ leave 확인\u003c/b>조동사 can 뒤에서 orbit around와 never \u003cb class=\"key\">leave\u003c/b> behind가 동사원형으로 병렬 연결되어 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ expected 확인\u003c/b>value를 수식하는 과거분사 \u003cb class=\"key\">expected\u003c/b>로 기대되는 값이라는 뜻이므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ that 확인\u003c/b>found in their study 뒤에서 목적어절을 이끄는 접속사 \u003cb class=\"key\">that\u003c/b>이므로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-full\">For example, evidence from a sample of twins suggests that the heritability of happiness may be as high as 80%, although a more widely accepted figure is 50%.\u003c/div>\u003cdiv class=\"p-ko\">행복 수준을 영구히 바꾸는 것은 매우 어렵고, 쌍둥이 연구는 행복의 유전율이 높을 수 있음을 시사한다. 각자는 행복의 일정 범위를 벗어나기 어렵다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>evidence는 불가산명사라 단수 취급하며, to부정사가 문장의 주동사를 대신할 수 없습니다.\u003c/div>","segs":[{"n":19,"text":"첫 번째 선택지는 행복 수준을 바꾸는 행위를 주어로 만든 동명사예요. 뒤에 단수 동사 is가 와서 자연스럽습니다.","hl":"st-0"},{"n":20,"text":"두 번째 선택지가 틀린 부분입니다. 주어는 쌍둥이 표본에서 나온 증거이고, 그 증거가 시사한다는 주동사가 필요하므로 suggests가 와야 해요.","hl":"st-1"},{"n":21,"text":"세 번째 선택지는 can 뒤에 오는 동사원형 자리예요. orbit과 leave가 나란히 연결되어 있으므로 문제가 없습니다.","hl":"st-2"},{"n":22,"text":"네 번째 선택지는 값이 기대되는 대상이라는 수동 의미를 가진 분사예요. 그래서 expected가 맞습니다.","hl":"st-3"},{"n":23,"text":"다섯 번째 선택지는 연구에서 발견한 내용을 이끄는 that절이에요. 목적어절 접속사로 잘 쓰였습니다.","hl":"st-4"},{"n":24,"text":"이 문제의 함정도 짚고 갈게요. evidence는 불가산명사라 단수 취급하며, to부정사가 문장의 주동사를 대신할 수 없습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">stop to부정사와 stop 동명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">stop to + 동사원형은 ~하기 위해 멈추다, stop + 동명사는 ~하는 것을 멈추다라는 뜻입니다.\u003cdiv>\u003cspan class=\"g-formula\">stop to do / stop doing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>to부정사는 목적\u003c/li>\u003cli>동명사는 중단\u003c/li>\u003cli>문맥으로 의미 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He stopped to talk.\u003c/div>\u003cdiv class=\"g-ko\">그는 이야기하기 위해 멈췄다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He stopped talking.\u003c/div>\u003cdiv class=\"g-ko\">그는 이야기하는 것을 멈췄다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":25,"text":"stop 뒤에 to부정사가 오면 잠시 멈춰서 그 일을 하러 간다는 뜻이고, 동명사가 오면 하던 일을 그만둔다는 뜻입니다. 예를 들어 stopped to talk는 이야기하기 위해 멈춘 것이고, stopped talking은 이야기하던 것을 멈춘 것이죠. 문장에서 친구가 몇 마일 동안 이야기하다가 말을 멈췄다는 흐름이라면 stopped talking이 자연스럽습니다. 의미 차이가 크기 때문에 stop이 보이면 뒤 형태와 문맥을 꼭 함께 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">의문사절 how\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">how는 ~하는 방식이라는 뜻으로 명사절을 이끌며, \u003cb class=\"key\">how + 주어 + 동사\u003c/b> 순서로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">how + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명사절 접속사 역할\u003c/li>\u003cli>간접의문문 어순\u003c/li>\u003cli>전치사 of의 목적어로도 사용\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">an example of how silence can convey meaning\u003c/div>\u003cdiv class=\"g-ko\">침묵이 어떻게 의미를 전달할 수 있는지에 대한 예\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I know how he solved it.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 그것을 어떻게 해결했는지 안다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"how는 어떻게라는 뜻을 살리면서 명사절을 이끄는 접속사로도 쓰입니다. 이때는 how 다음에 주어와 동사가 오는 간접의문문 어순을 지켜야 해요. 예를 들어 침묵이 어떻게 의미를 전달할 수 있는지에 대한 예는 an example of how silence can convey meaning처럼 표현합니다. of 뒤에 how절이 통째로 목적어처럼 들어간 구조라는 점도 함께 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">All communication has the potential to convey meaning to someone else. Actually, we cannot not communicate. Even when we think we are not communicating, we ① \u003cu class=\"p-u\">are\u003c/u>. We are constantly perceiving and interpreting other people's behavior. Take a moment and think about a time ② \u003cu class=\"p-u\">when\u003c/u> you were riding in a car with a friend. Perhaps your friend talked for several miles and then stopped ③ \u003cu class=\"p-u\">to talk\u003c/u>. After a few moments, you may have begun to feel uncomfortable because you were not sure the reason. You may have turned to your friend and asked, &quot;What's wrong?&quot; ④ \u003cu class=\"p-u\">Surprised\u003c/u>, your friend may have answered, &quot;Nothing.&quot; She or he may have merely been paying attention to the road, but you interpreted the silence to mean something else. This is an example of ⑤ \u003cu class=\"p-u\">how\u003c/u> a person's silence can convey meaning even though it's not intended to communicate.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① are\u003c/div>\u003cdiv class=\"p-op\">② when\u003c/div>\u003cdiv class=\"p-op\">③ to talk\u003c/div>\u003cdiv class=\"p-op\">④ Surprised\u003c/div>\u003cdiv class=\"p-op\">⑤ how\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"세 번째 문제는 의사소통과 침묵에 대한 글이에요. 분사, 관계부사, stop 뒤 형태, 의문사절을 하나씩 점검해 봅시다.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 세 번째 선택지입니다. 친구가 이야기하던 것을 멈춘 것이므로 stopped to talk가 아니라 stopped talking으로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">All communication has the potential to convey meaning to someone else. Actually, we cannot not communicate. Even when we think we are not communicating, we ① \u003cu class=\"p-u\">are\u003c/u>. We are constantly perceiving and interpreting other people's behavior. Take a moment and think about a time ② \u003cu class=\"p-u\">when\u003c/u> you were riding in a car with a friend. Perhaps your friend talked for several miles and then stopped ③ \u003cu class=\"p-u\">to talk\u003c/u>. After a few moments, you may have begun to feel uncomfortable because you were not sure the reason. You may have turned to your friend and asked, &quot;What's wrong?&quot; ④ \u003cu class=\"p-u\">Surprised\u003c/u>, your friend may have answered, &quot;Nothing.&quot; She or he may have merely been paying attention to the road, but you interpreted the silence to mean something else. This is an example of ⑤ \u003cu class=\"p-u\">how\u003c/u> a person's silence can convey meaning even though it's not intended to communicate.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① are\u003c/div>\u003cdiv class=\"p-op\">② when\u003c/div>\u003cdiv class=\"p-op\">③ to talk\u003c/div>\u003cdiv class=\"p-op\">④ Surprised\u003c/div>\u003cdiv class=\"p-op\">⑤ how\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① are 확인\u003c/b>we are 뒤에 communicating이 반복 생략된 형태로, 우리는 의사소통하고 있다는 뜻이므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② when 확인\u003c/b>a time 뒤에서 시간의 관계부사 \u003cb class=\"key\">when\u003c/b>이 완전한 절을 이끌고 있으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ to talk 확인\u003c/b>친구가 이야기하던 것을 멈춘 것이므로 stopped \u003cb class=\"key\">talking\u003c/b>이 되어야 합니다. to talk는 이야기하러 멈췄다는 다른 의미가 됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ Surprised 확인\u003c/b>친구가 놀란 상태를 나타내는 감정의 과거분사 \u003cb class=\"key\">Surprised\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ how 확인\u003c/b>전치사 of 뒤에서 how절이 명사절로 쓰였고, how + 주어 + 동사 어순이므로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">Perhaps your friend talked for several miles and then stopped talking.\u003c/div>\u003cdiv class=\"p-ko\">의사소통은 하지 않으려 해도 계속되며, 침묵도 의미를 전달할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>stop to는 목적, stop -ing는 중단이므로 문맥에서 하던 일을 멈췄는지 확인해야 합니다.\u003c/div>","segs":[{"n":30,"text":"첫 번째 선택지는 앞에 나온 communicating을 반복하지 않고 are만 남긴 표현이에요. 우리는 실제로 의사소통하고 있다는 뜻이라 자연스럽습니다.","hl":"st-0"},{"n":31,"text":"두 번째 선택지는 시간을 나타내는 a time 뒤에 오는 when이에요. 뒤에 주어와 동사가 갖추어져 있으니 관계부사가 맞습니다.","hl":"st-1"},{"n":32,"text":"세 번째 선택지가 틀린 부분입니다. 친구가 몇 마일 동안 이야기하다가 말을 멈춘 것이므로 stopped talking을 써야 해요.","hl":"st-2"},{"n":33,"text":"네 번째 선택지는 친구가 놀란 상태를 나타내는 분사예요. 감정을 느끼는 사람은 과거분사로 표현하므로 맞습니다.","hl":"st-3"},{"n":34,"text":"다섯 번째 선택지는 침묵이 어떻게 의미를 전달하는지를 나타내는 how절이에요. 의문사절 어순이 잘 지켜졌습니다.","hl":"st-4"},{"n":35,"text":"이 문제의 함정도 짚고 갈게요. stop to는 목적, stop -ing는 중단이므로 문맥에서 하던 일을 멈췄는지 확인해야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">as ... as 비교구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">as와 as 사이에는 \u003cb class=\"key\">원급\u003c/b>을 쓰고, not as ... as는 ~만큼 ...하지 않은이라는 뜻입니다.\u003cdiv>\u003cspan class=\"g-formula\">as + 원급 + as / not as + 원급 + as\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>비교 대상 확인\u003c/li>\u003cli>원급 자리에 형용사·부사\u003c/li>\u003cli>as is believed처럼 반복 표현 생략\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">not as different from many societies as is commonly believed\u003c/div>\u003cdiv class=\"g-ko\">흔히 믿는 것만큼 많은 사회와 다르지 않은\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">as tall as his brother\u003c/div>\u003cdiv class=\"g-ko\">그의 형만큼 키가 큰\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"as와 as 사이에는 비교의 기준이 되는 원급이 들어갑니다. not as different from many societies as is commonly believed는 흔히 믿는 것만큼 많은 사회와 다르지 않다는 뜻이에요. 여기서 different는 원급 형용사로 제대로 쓰였고, 뒤의 as는 비교 기준을 이끕니다. 비교구문에서는 형용사나 부사의 원급인지, 비교 대상이 논리적으로 맞는지를 확인하면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">As a thought experiment, imagine how difficult it would be ① \u003cu class=\"p-u\">to continue\u003c/u> working or studying without primary needs such as sleep, food, or water. These deprivations happen, often enough, and they produce predictable consequences. Moreover, most of us ② \u003cu class=\"p-u\">spend\u003c/u> most of our available time and energy on activities that are directly or indirectly related to satisfying our basic needs. A survey ③ \u003cu class=\"p-u\">conducted\u003c/u> by the Bureau of Labor Statistics indicates that the pattern in the developed countries is not as ④ \u003cu class=\"p-u\">different\u003c/u> from many less affluent societies as is commonly believed, though we spend more of our leisure time watching television and using various electronic devices. ⑤ \u003cu class=\"p-u\">Deny\u003c/u> the relevance of our primary biological needs in our daily existence and in shaping our priorities for the future is to deny reality.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① to continue\u003c/div>\u003cdiv class=\"p-op\">② spend\u003c/div>\u003cdiv class=\"p-op\">③ conducted\u003c/div>\u003cdiv class=\"p-op\">④ different\u003c/div>\u003cdiv class=\"p-op\">⑤ Deny\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"네 번째 문제는 기본 욕구의 중요성을 다룬 글이에요. 가주어와 진주어, 분사 수식, 원급 비교, 주어 자리 준동사를 확인해 봅시다.","hl":"q"},{"n":38,"text":"","hl":"q","pause":7},{"n":39,"text":"정답은 다섯 번째 선택지입니다. 문장 전체의 주어 자리이므로 Deny가 아니라 To deny나 Denying으로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">As a thought experiment, imagine how difficult it would be ① \u003cu class=\"p-u\">to continue\u003c/u> working or studying without primary needs such as sleep, food, or water. These deprivations happen, often enough, and they produce predictable consequences. Moreover, most of us ② \u003cu class=\"p-u\">spend\u003c/u> most of our available time and energy on activities that are directly or indirectly related to satisfying our basic needs. A survey ③ \u003cu class=\"p-u\">conducted\u003c/u> by the Bureau of Labor Statistics indicates that the pattern in the developed countries is not as ④ \u003cu class=\"p-u\">different\u003c/u> from many less affluent societies as is commonly believed, though we spend more of our leisure time watching television and using various electronic devices. ⑤ \u003cu class=\"p-u\">Deny\u003c/u> the relevance of our primary biological needs in our daily existence and in shaping our priorities for the future is to deny reality.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① to continue\u003c/div>\u003cdiv class=\"p-op\">② spend\u003c/div>\u003cdiv class=\"p-op\">③ conducted\u003c/div>\u003cdiv class=\"p-op\">④ different\u003c/div>\u003cdiv class=\"p-op\">⑤ Deny\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① to continue 확인\u003c/b>imagine how difficult it would be 뒤에서 가주어 it의 진주어 역할을 하는 \u003cb class=\"key\">to continue\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② spend 확인\u003c/b>most of us가 복수 주어이므로 복수 동사 \u003cb class=\"key\">spend\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ conducted 확인\u003c/b>a survey가 조사받는 대상이므로 과거분사 \u003cb class=\"key\">conducted\u003c/b>가 survey를 수식하는 구조가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ different 확인\u003c/b>not as ... as 사이의 원급 형용사 \u003cb class=\"key\">different\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ Deny 확인\u003c/b>문장 전체의 주어 자리이므로 동사원형 \u003cb class=\"key\">Deny\u003c/b>가 올 수 없습니다. To deny 또는 Denying으로 고쳐야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">To deny the relevance of our primary biological needs in our daily existence and in shaping our priorities for the future is to deny reality.\u003c/div>\u003cdiv class=\"p-ko\">수면, 음식, 물 같은 기본 욕구를 배제하고 일하거나 공부하기는 어렵고, 기본 생물학적 욕구의 중요성을 부정하는 것은 현실을 부정하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>동사원형은 주어 자리에 올 수 없고, 주어가 길면 to부정사나 동명사로 바꿔야 합니다.\u003c/div>","segs":[{"n":40,"text":"첫 번째 선택지는 어려움의 대상이 되는 진주어 자리예요. to continue가 가주어 it의 내용을 받아 주므로 자연스럽습니다.","hl":"st-0"},{"n":41,"text":"두 번째 선택지는 대부분의 우리들이라는 복수 주어와 연결됩니다. 그래서 복수 동사 spend가 맞습니다.","hl":"st-1"},{"n":42,"text":"세 번째 선택지는 조사가 시행되는 수동 의미를 가진 분사예요. a survey conducted by 형태로 명사를 꾸미므로 맞습니다.","hl":"st-2"},{"n":43,"text":"네 번째 선택지는 비교구문 안의 원급 형용사 자리예요. different가 제대로 쓰였습니다.","hl":"st-3"},{"n":44,"text":"다섯 번째 선택지가 틀린 부분입니다. 문장의 주어 자리에는 동사원형이 올 수 없고, to deny나 denying처럼 준동사 형태가 와야 해요.","hl":"st-4"},{"n":45,"text":"이 문제의 함정도 짚고 갈게요. 동사원형은 주어 자리에 올 수 없고, 주어가 길면 to부정사나 동명사로 바꿔야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">문장 성분과 주동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">영어 문장에는 주어와 \u003cb class=\"key\">주동사\u003c/b>가 필요하며, 분사만으로는 문장의 서술어가 될 수 없습니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + 목적어/보어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어 뒤에 진짜 동사 있는지 확인\u003c/li>\u003cli>분사는 서술어가 될 수 없음\u003c/li>\u003cli>to부정사만으로 주절 동사 대체 불가\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The red blood cells transport oxygen.\u003c/div>\u003cdiv class=\"g-ko\">적혈구는 산소를 운반한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Popular games provide emotional release.\u003c/div>\u003cdiv class=\"g-ko\">인기 있는 놀이는 정서적 해소를 제공한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"문장을 볼 때는 먼저 주어와 진짜 동사를 찾아야 합니다. 분사는 명사를 꾸미거나 문장을 이어 주는 역할을 할 뿐, 주동사를 대신할 수는 없어요. 예를 들어 the red blood cells transporting oxygen만 있으면 동사가 없는 불완전한 문장이 되므로 transport라는 주동사가 필요합니다. to부정사도 주동사 자리를 대신할 수 없으니, 주어 뒤에 동사다운 형태가 있는지 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">개수 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 알맞은 문장의 개수는?\u003c/div>\u003cdiv class=\"p-psg\">ⓐ \u003cu class=\"p-u\">The basic living unit of the body is the cell, and each organ is an aggregate of many different cells held together by intercellular supporting structures.\u003c/u> ⓑ \u003cu class=\"p-u\">Each type of cell is specially adapted to perform one particular function.\u003c/u> ⓒ \u003cu class=\"p-u\">For instance, the red blood cells transporting oxygen from the lungs to the tissues.\u003c/u> ⓓ \u003cu class=\"p-u\">These cells along with the other numerous cells of the body has certain basic characteristics that are alike.\u003c/u> ⓔ \u003cu class=\"p-u\">For example, in all cells oxygen combines with carbohydrates, fat, or protein to release the energy requiring for cell function.\u003c/u> Furthermore, the general mechanisms for changing nutrients into energy are basically the same in all cells. All cells also deliver the end-products of their chemical reactions into the surrounding fluids.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② (ⓐ, ⓑ / ⓒ transporting → transport, ⓓ has → have, ⓔ requiring → required)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":47,"text":"다섯 번째 문제는 세포의 기본 특성에 관한 글이에요. 다섯 문장 중에서 어법상 알맞은 문장이 몇 개인지 세어 봅시다.","hl":"q"},{"n":48,"text":"","hl":"q","pause":7},{"n":49,"text":"정답은 두 번째 선택지예요. 첫 번째와 두 번째 문장은 맞고, 세 번째는 transporting을 transport로, 네 번째는 has를 have로, 다섯 번째는 requiring을 required로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">개수 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 알맞은 문장의 개수는?\u003c/div>\u003cdiv class=\"p-psg sm\">ⓐ \u003cu class=\"p-u\">The basic living unit of the body is the cell, and each organ is an aggregate of many different cells held together by intercellular supporting structures.\u003c/u> ⓑ \u003cu class=\"p-u\">Each type of cell is specially adapted to perform one particular function.\u003c/u> ⓒ \u003cu class=\"p-u\">For instance, the red blood cells transporting oxygen from the lungs to the tissues.\u003c/u> ⓓ \u003cu class=\"p-u\">These cells along with the other numerous cells of the body has certain basic characteristics that are alike.\u003c/u> ⓔ \u003cu class=\"p-u\">For example, in all cells oxygen combines with carbohydrates, fat, or protein to release the energy requiring for cell function.\u003c/u> Furthermore, the general mechanisms for changing nutrients into energy are basically the same in all cells. All cells also deliver the end-products of their chemical reactions into the surrounding fluids.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>The basic living unit of the body is the cell에서 주어와 동사가 맞고, cells held together는 과거분사 수식으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>Each type of cell이 단수 주어이고 is adapted to perform이므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>the red blood cells transporting oxygen은 동사가 없는 분사구입니다. 주동사가 필요하므로 \u003cb class=\"key\">transport\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>These cells along with the other numerous cells가 주어이고, along with는 수일치에 영향을 주지 않으므로 \u003cb class=\"key\">has\u003c/b>를 \u003cb class=\"key\">have\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>energy가 세포 기능을 위해 요구되는 대상이므로 \u003cb class=\"key\">requiring\u003c/b>을 \u003cb class=\"key\">required\u003c/b>로 고쳐야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (ⓐ, ⓑ / ⓒ transporting → transport, ⓓ has → have, ⓔ requiring → required)\u003c/span>\u003cdiv class=\"p-full\">For instance, the red blood cells transport oxygen from the lungs to the tissues. These cells along with the other numerous cells of the body have certain basic characteristics that are alike. For example, in all cells oxygen combines with carbohydrates, fat, or protein to release the energy required for cell function.\u003c/div>\u003cdiv class=\"p-ko\">세포는 신체의 기본 단위이고 각 세포는 특정 기능에 적응되어 있으며, 모든 세포는 산소와 영양소로 에너지를 만드는 기본 특성을 공유한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>along with는 주어의 수에 영향을 주지 않으며, 분사만으로는 주동사를 대신할 수 없습니다.\u003c/div>","segs":[{"n":50,"text":"첫 번째 문장은 기본 단위가 세포라는 주어와 동사의 연결이 정확합니다. held together도 세포가 서로 붙들려 있는 수동 의미로 잘 쓰였어요.","hl":"st-0"},{"n":51,"text":"두 번째 문장은 각 유형이라는 단수 주어에 is가 맞춰져 있습니다. adapted to perform도 자연스럽습니다.","hl":"st-1"},{"n":52,"text":"세 번째 문장은 적혈구가 산소를 운반한다는 주동사가 빠져 있어요. transporting이 아니라 transport로 고쳐야 완전한 문장이 됩니다.","hl":"st-2"},{"n":53,"text":"네 번째 문장은 주어가 these cells라는 복수명사예요. along with 뒤에 다른 세포들이 나와도 주어의 수는 그대로이므로 have를 써야 합니다.","hl":"st-3"},{"n":54,"text":"다섯 번째 문장은 에너지가 요구되는 수동 의미예요. 그래서 requiring이 아니라 required로 고쳐야 합니다.","hl":"st-4"},{"n":55,"text":"이 문제의 함정도 짚고 갈게요. along with는 주어의 수에 영향을 주지 않으며, 분사만으로는 주동사를 대신할 수 없습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">allow + 목적어 + to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">allow는 목적어 뒤에 \u003cb class=\"key\">to부정사\u003c/b>를 붙여 allow somebody to do 형태로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">allow + 목적어 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적격보어로 to부정사\u003c/li>\u003cli>동사원형만 쓰지 않음\u003c/li>\u003cli>허락·가능의 의미\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">a brain that allowed them to solve problems\u003c/div>\u003cdiv class=\"g-ko\">그들이 문제를 해결하도록 해 준 뇌\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">allow us to enter\u003c/div>\u003cdiv class=\"g-ko\">우리가 들어가도록 허락하다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":56,"text":"allow는 목적어 뒤에 동사원형만 쓰지 않고 to부정사를 붙입니다. 그래서 그들이 문제를 해결하도록 해 준 뇌는 a brain that allowed them to solve problems처럼 씁니다. allow somebody to do 형태를 하나의 덩어리로 기억해 두면 solve 앞에 to가 빠지는 실수를 막을 수 있어요. 비슷한 동사로 encourage나 enable도 목적어 뒤에 to부정사를 자주 씁니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대명사 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대명사는 앞에 나온 명사의 \u003cb class=\"key\">인칭·수·성\u003c/b>에 맞춰야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 명사 → it / 복수 명사 → they·them\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞 명사 찾기\u003c/li>\u003cli>추상명사는 it\u003c/li>\u003cli>복수명사는 they·them\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Human evolution is still going on, though most of us never think about it.\u003c/div>\u003cdiv class=\"g-ko\">인간 진화는 계속되고 있지만 대부분은 그것에 대해 생각하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">These cells have characteristics.\u003c/div>\u003cdiv class=\"g-ko\">이 세포들은 특징을 가진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"대명사 문제는 앞에 나온 어떤 명사를 가리키는지 찾는 것이 시작입니다. Human evolution처럼 단수이고 추상적인 명사는 it으로 받고, 복수 명사는 they나 them으로 받습니다. 특히 evolution을 them으로 받으면 수와 의미가 모두 어긋나므로 주의해야 해요. 대명사가 나오면 바로 앞 문장이나 같은 문장 안의 선행사를 확인해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">자동사의 수동태 불가\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">occur, happen, appear처럼 \u003cb class=\"key\">자동사\u003c/b>는 목적어를 가지지 않아 수동태로 쓸 수 없습니다.\u003cdiv>\u003cspan class=\"g-formula\">자동사 → 수동태 불가 / 과거동사로 사용\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>occur는 일어나다라는 자동사\u003c/li>\u003cli>was occurred는 틀림\u003c/li>\u003cli>과거형 occurred로 사용\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">These things occurred because of natural selection.\u003c/div>\u003cdiv class=\"g-ko\">이런 일들은 자연선택 때문에 일어났다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The accident happened yesterday.\u003c/div>\u003cdiv class=\"g-ko\">그 사고는 어제 일어났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"occur나 happen은 스스로 일어나는 일을 나타내는 자동사입니다. 자동사는 목적어를 가지지 않기 때문에 was occurred나 was happened처럼 수동태로 만들 수 없어요. 그래서 이런 일들이 일어났다는 문장은 these things occurred처럼 과거동사로 써야 합니다. 자동사가 수동태로 보이면 일단 목적어가 있는지부터 의심해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고칠 때, 적절하지 않은 것은?\u003c/div>\u003cdiv class=\"p-psg\">Over the course of human development, humans gained the use of their hands for many tasks and developed an inventive brain that allowed them ⓐ \u003cu class=\"p-u\">solve\u003c/u> problems. During this time, it is believed that humans lost almost all their body hair, their tails—if they ever had them—and ⓑ \u003cu class=\"p-u\">to reduce\u003c/u> the size of their teeth. Human evolution is still going on, though most of us never think about ⓒ \u003cu class=\"p-u\">them\u003c/u>. The human appendix, for instance, has shrunk in size and usefulness, seldom used wisdom teeth are usually removed, the thickness of the bones in the skull has diminished. These things ⓓ \u003cu class=\"p-u\">occurring\u003c/u> because natural selection favored individuals with shorter tails, thinner skulls or smaller teeth. ⓔ \u003cu class=\"p-u\">Maintain\u003c/u> unused traits requires a great deal of energy and energy was needed for other uses.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ → to solve\u003c/div>\u003cdiv class=\"p-op\">② ⓑ → reduced\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ → it\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ → was occurred\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ → To maintain\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"여섯 번째 문제는 인간 진화에 관한 글이에요. 각 밑줄을 어떻게 고쳐야 하는지 보고, 그중 적절하지 않은 고치기를 찾아봅시다.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"정답은 네 번째 선택지입니다. occur는 자동사라서 was occurred가 아니라 occurred로 고쳐야 하므로, 네 번째 고치기는 적절하지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고칠 때, 적절하지 않은 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Over the course of human development, humans gained the use of their hands for many tasks and developed an inventive brain that allowed them ⓐ \u003cu class=\"p-u\">solve\u003c/u> problems. During this time, it is believed that humans lost almost all their body hair, their tails—if they ever had them—and ⓑ \u003cu class=\"p-u\">to reduce\u003c/u> the size of their teeth. Human evolution is still going on, though most of us never think about ⓒ \u003cu class=\"p-u\">them\u003c/u>. The human appendix, for instance, has shrunk in size and usefulness, seldom used wisdom teeth are usually removed, the thickness of the bones in the skull has diminished. These things ⓓ \u003cu class=\"p-u\">occurring\u003c/u> because natural selection favored individuals with shorter tails, thinner skulls or smaller teeth. ⓔ \u003cu class=\"p-u\">Maintain\u003c/u> unused traits requires a great deal of energy and energy was needed for other uses.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ → to solve\u003c/div>\u003cdiv class=\"p-op\">② ⓑ → reduced\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ → it\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ → was occurred\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ → To maintain\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>allow는 목적어 뒤에 to부정사를 쓰므로 \u003cb class=\"key\">solve\u003c/b>를 \u003cb class=\"key\">to solve\u003c/b>로 고치는 것이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>lost, their tails, and \u003cb class=\"key\">to reduce\u003c/b>가 병렬이므로 \u003cb class=\"key\">reduced\u003c/b>로 고쳐 lost와 형태를 맞추는 것이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>Human evolution은 단수 추상명사이므로 \u003cb class=\"key\">them\u003c/b>을 \u003cb class=\"key\">it\u003c/b>으로 고치는 것이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>These things 뒤에는 주동사가 필요하므로 occurring을 \u003cb class=\"key\">occurred\u003c/b>로 고쳐야 합니다. occur는 자동사라서 \u003cb class=\"key\">was occurred\u003c/b>로 고치면 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>문장 주어 자리이므로 \u003cb class=\"key\">Maintain\u003c/b>을 \u003cb class=\"key\">To maintain\u003c/b> 또는 Maintaining으로 고치는 것이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">These things occurred because natural selection favored individuals with shorter tails, thinner skulls or smaller teeth.\u003c/div>\u003cdiv class=\"p-ko\">인간은 손과 뇌를 발달시켰고, 털·꼬리·치아 크기를 줄이는 방향으로 진화했다. 자연선택이 에너지 효율에 유리한 형질을 선호했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>occur는 자동사이므로 was occurred처럼 수동태로 고치면 안 되고 occurred로 써야 합니다.\u003c/div>","segs":[{"n":62,"text":"첫 번째 고치기는 allowed them 뒤에 to solve를 넣는 것이에요. allow가 목적어 뒤에 to부정사를 취하므로 적절합니다.","hl":"st-0"},{"n":63,"text":"두 번째 고치기는 lost와 reduced를 병렬로 맞추는 것입니다. 잃어버렸고 줄였다는 과거동사 연결이 자연스러워요.","hl":"st-1"},{"n":64,"text":"세 번째 고치기는 human evolution을 받는 대명사를 it으로 바꾸는 것이에요. 단수명사이므로 it이 맞습니다.","hl":"st-2"},{"n":65,"text":"네 번째 고치기가 적절하지 않습니다. occur는 자동사라서 수동태로 만들 수 없고, 과거동사 occurred로만 써야 해요.","hl":"st-3"},{"n":66,"text":"다섯 번째 고치기는 문장 주어 자리를 준동사로 바꾸는 것이에요. to maintain이나 maintaining이 주어로 쓰일 수 있습니다.","hl":"st-4"},{"n":67,"text":"이 문제의 함정도 짚고 갈게요. occur는 자동사이므로 was occurred처럼 수동태로 고치면 안 되고 occurred로 써야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대동사 do\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 동사구를 반복할 때는 \u003cb class=\"key\">do, does, did\u003c/b>로 대신할 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">than + 주어 + do/does/did\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>반복되는 일반동사 대체\u003c/li>\u003cli>시제와 수에 맞춘 do\u003c/li>\u003cli>be동사는 be로 받음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They work more from home than they do at the office.\u003c/div>\u003cdiv class=\"g-ko\">그들은 사무실에서보다 집에서 더 많이 일한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She studies harder than I do.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나보다 더 열심히 공부한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":68,"text":"대동사 do는 앞에 나온 일반동사 표현을 반복하지 않고 짧게 받아 줄 때 씁니다. They work more from home than they do at the office에서 do는 work를 대신하는 말이에요. 시제와 주어의 수에 맞춰 do, does, did 중에서 골라야 하고, be동사는 do가 아니라 be로 받는다는 점도 기억해 주세요. 비교 문장에서 than 뒤에 동사가 또 나오면 대동사가 필요한지 자연스럽게 확인해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사의 의미상 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동명사 앞에 의미상 주어를 둘 때는 목적격이나 소유격을 쓸 수 있으며, \u003cb class=\"key\">of + 목적격 + 동명사\u003c/b> 형태도 자주 쓰입니다.\u003cdiv>\u003cspan class=\"g-formula\">of + 목적격 + 동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동명사 앞 의미상 주어\u003c/li>\u003cli>employees experiencing처럼 목적격 가능\u003c/li>\u003cli>전치사 of 뒤 동명사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">the side-effect of employees experiencing burnout\u003c/div>\u003cdiv class=\"g-ko\">직원들이 번아웃을 겪는 부작용\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I don't like him smoking.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 담배 피우는 것을 좋아하지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"동명사에도 의미상 주어를 붙일 수 있습니다. 누가 그 동명사 행동을 하는지 분명히 하고 싶을 때 동명사 앞에 목적격이나 소유격을 둡니다. 예를 들어 직원들이 번아웃을 겪는 부작용은 the side-effect of employees experiencing burnout처럼 표현할 수 있어요. 여기서 employees는 experiencing의 의미상 주어이고, of 뒤에 동명사구가 길게 이어지는 구조입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 글을 읽고, (A), (B), (C)를 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">There are a lot of advantages to working remotely. There's no commute, fewer interruptions from coworkers, flexible schedules, and more. However, it can be difficult for some employees to maintain a good work-life balance while working from home. Employees often work more from home than they (A) \u003cu class=\"p-u\">are\u003c/u> at the office. The boundaries between work and home life can blur and employees end up working later into the evening. Employees (B) \u003cu class=\"p-u\">work\u003c/u> remotely often put in between 50 and 75 hours a week of work. This can have the unfortunate side-effect of employees (C) \u003cu class=\"p-u\">experience\u003c/u> burnout.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(A) do (B) working (C) experiencing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":70,"text":"일곱 번째 문제는 원격 근무의 부작용에 관한 글이에요. 비교 구문의 대동사, 명사 수식 분사, 전치사 뒤 동명사를 차례로 확인해 봅시다.","hl":"q"},{"n":71,"text":"","hl":"q","pause":7},{"n":72,"text":"정답은 첫 번째 빈칸에 do, 두 번째 빈칸에 working, 세 번째 빈칸에 experiencing입니다. 일반동사 work를 대신하는 do, 직원들을 꾸미는 현재분사 working, 전치사 of 뒤의 동명사 experiencing을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 글을 읽고, (A), (B), (C)를 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">There are a lot of advantages to working remotely. There's no commute, fewer interruptions from coworkers, flexible schedules, and more. However, it can be difficult for some employees to maintain a good work-life balance while working from home. Employees often work more from home than they (A) \u003cu class=\"p-u\">are\u003c/u> at the office. The boundaries between work and home life can blur and employees end up working later into the evening. Employees (B) \u003cu class=\"p-u\">work\u003c/u> remotely often put in between 50 and 75 hours a week of work. This can have the unfortunate side-effect of employees (C) \u003cu class=\"p-u\">experience\u003c/u> burnout.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(A) than they are\u003c/b>앞의 일반동사 work를 반복하지 않고 대동사로 받아야 하므로 \u003cb class=\"key\">do\u003c/b>가 맞습니다. are는 work를 대신할 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(B) Employees work\u003c/b>Employees를 꾸미는 현재분사구가 필요하므로 \u003cb class=\"key\">working\u003c/b> remotely가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(C) employees experience\u003c/b>전치사 of 뒤에서 동명사가 필요하고 employees는 experiencing의 의미상 주어이므로 \u003cb class=\"key\">experiencing\u003c/b>이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (A) do (B) working (C) experiencing\u003c/span>\u003cdiv class=\"p-full\">Employees often work more from home than they do at the office. Employees working remotely often put in between 50 and 75 hours a week of work. This can have the unfortunate side-effect of employees experiencing burnout.\u003c/div>\u003cdiv class=\"p-ko\">재택근무는 장점이 있지만 경계가 흐려져 더 오래 일하게 되고, 원격 근무자들이 번아웃을 겪는 부작용이 생길 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>than 뒤에서 일반동사를 받을 때는 be동사가 아니라 do를 쓰고, 전치사 of 뒤에는 동명사를 씁니다.\u003c/div>","segs":[{"n":73,"text":"첫 번째 빈칸은 앞에 나온 work를 대신하는 자리예요. 일반동사를 받을 때는 do를 쓰므로 than they do at the office가 됩니다.","hl":"st-0"},{"n":74,"text":"두 번째 빈칸은 직원들이라는 명사를 꾸며 주는 분사가 필요해요. 원격으로 일하는 직원들은 employees working remotely로 표현합니다.","hl":"st-1"},{"n":75,"text":"세 번째 빈칸은 전치사 of 뒤의 동명사 자리예요. 직원들이 번아웃을 겪는 부작용은 employees experiencing burnout으로 씁니다.","hl":"st-2"},{"n":76,"text":"이 문제의 함정도 짚고 갈게요. than 뒤에서 일반동사를 받을 때는 be동사가 아니라 do를 쓰고, 전치사 of 뒤에는 동명사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">make + 목적어 + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">make가 ~하게 만들다라는 뜻으로 쓰이면 \u003cb class=\"key\">목적어 + 동사원형\u003c/b>을 취합니다.\u003cdiv>\u003cspan class=\"g-formula\">make + 목적어 + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적격보어에 동사원형\u003c/li>\u003cli>to붙이지 않음\u003c/li>\u003cli>목적어 뒤 상태·행동 표현\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">to make them taste much better\u003c/div>\u003cdiv class=\"g-ko\">그것들이 훨씬 더 좋은 맛이 나도록 만들기 위해\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It makes me laugh.\u003c/div>\u003cdiv class=\"g-ko\">그것은 나를 웃게 만든다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":77,"text":"make가 목적어를 어떤 상태나 행동으로 만들다라는 뜻일 때는 목적어 뒤에 동사원형을 씁니다. 그래서 그것들이 더 좋은 맛이 나도록 만들기 위해는 to make them taste much better처럼 표현해요. make 뒤에 to taste를 붙이면 틀리고, taste가 목적격보어로 바로 옵니다. much better는 taste를 꾸며 주는 비교 표현으로 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가목적어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">make, find, think 같은 동사 뒤에서 진목적어가 to부정사나 that절처럼 길 때 \u003cb class=\"key\">가목적어 it\u003c/b>을 먼저 쓰고 진목적어를 뒤에 둡니다.\u003cdiv>\u003cspan class=\"g-formula\">make + it + 형용사 + to부정사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>it은 형식상 목적어\u003c/li>\u003cli>진목적어는 뒤의 to부정사\u003c/li>\u003cli>make it easier to do\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It makes it easier to avoid preservatives.\u003c/div>\u003cdiv class=\"g-ko\">그것은 방부제를 피하는 것을 더 쉽게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I found it difficult to understand.\u003c/div>\u003cdiv class=\"g-ko\">나는 그것을 이해하기 어렵다고 느꼈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":78,"text":"가목적어 it은 진짜 목적어가 너무 길 때 자리를 잡아 주는 역할을 합니다. make it easier to avoid preservatives에서는 it이 형식상 목적어이고, to avoid preservatives가 진짜 목적어예요. 이때 it을 빼먹거나 진목적어를 앞에 두면 어색해집니다. make, find, think 뒤에 형용사와 to부정사가 함께 보이면 가목적어 it을 떠올려 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">어순 배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 (1), (2)의 밑줄 친 우리말과 같은 뜻이 되도록 괄호 안의 말을 알맞게 배열하시오.\u003c/div>\u003cdiv class=\"p-psg\">Most agree that sugar is empty calories—meaning that there are no nutrients in it. Processed foods contain sugar and other preservatives (1) \u003cu class=\"p-u\">그것이 훨씬 더 좋은 맛이 나도록 만들기 위해\u003c/u> and have a far longer shelf life. Furthermore, processed foods may not contain all the essential nutrients and minerals the body needs. Hence, they contribute to weight gain as well as other health repercussions. Unprocessed foods, on the other hand, are not infused with artificial chemicals nor do they contain preservatives. Examples of unprocessed foods include tubers, grains, fruits and vegetables. Eating unprocessed foods (2) \u003cu class=\"p-u\">방부제를 피하는 것을 더 쉽게 만든다.\u003c/u> They may not taste as good as processed foods but are far healthier.\u003c/div>\u003cdiv class=\"p-words\">(1) (better / them / taste / make / to / much)\u003cbr>(2) (avoid / preservatives / to / it / easier / makes)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) to make them taste much better (2) makes it easier to avoid preservatives\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":79,"text":"여덟 번째 문제는 가공식품과 비가공식품에 관한 글이에요. 주어진 단어를 목적과 가목적어 구문에 맞게 배열해 봅시다.","hl":"q"},{"n":80,"text":"","hl":"q","pause":7},{"n":81,"text":"정답은  주어이므로 단수 동사 \u003cb class=\"key\">makes\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">(2) 가목적어 it\u003c/b>make it easier to avoid preservatives 구조입니다. \u003cb class=\"key\">it\u003c/b>은 가목적어, \u003cb class=\"key\">to avoid preservatives\u003c/b>는 진목적어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) to make them taste much better (2) makes it easier to avoid preservatives\u003c/span>\u003cdiv class=\"p-full\">Processed foods contain sugar and other preservatives to make them taste much better. Eating unprocessed foods makes it easier to avoid preservatives.\u003c/div>\u003cdiv class=\"p-ko\">가공식품은 맛을 좋게 하기 위해 당과 방부제를 넣지만, 비가공식품을 먹으면 방부제를 피하기 쉽다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>make 뒤 목적격보어에는 to를 붙이지 않고, 동명사 주어 Eating은 단수 동사 makes와 호응합니다.\u003c/div>","segs":[{"n":82,"text":"첫 번째 배열은 목적을 나타내는 to make로 시작해요. make 뒤에는 목적어 them과 동사원형 taste가 오고, 훨씬 더 좋은 맛이라는 의미를 위해 much better를 붙입니다.","hl":"st-0"},{"n":83,"text":"그래서 to make them taste much better가 됩니다. make 뒤에 to taste를 붙이지 않는 점이 중요해요.","hl":"st-1"},{"n":84,"text":"두 번째 배열의 주어는 비가공식품을 먹는 행위예요. 동명사 주어는 단수 취급하므로 makes를 씁니다.","hl":"st-2"},{"n":85,"text":"그다음에는 가목적어 it을 놓고 easier를 붙여요. 진짜 목적어인 to avoid preservatives는 뒤로 보내면 문장이 완성됩니다.","hl":"st-3"},{"n":86,"text":"이 문제의 함정도 짚고 갈게요. make 뒤 목적격보어에는 to를 붙이지 않고, 동명사 주어 Eating은 단수 동사 makes와 호응합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태는 \u003cb class=\"key\">be동사 + 과거분사\u003c/b> 형태로 만들며, 조동사가 있으면 \u003cb class=\"key\">조동사 + be + 과거분사\u003c/b> 순서입니다.\u003cdiv>\u003cspan class=\"g-formula\">be + p.p. / 조동사 + be + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 주어 자리로 이동\u003c/li>\u003cli>조동사 뒤에는 be\u003c/li>\u003cli>by 행위자 생략 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Children should be encouraged to engage in activities.\u003c/div>\u003cdiv class=\"g-ko\">아이들은 활동에 참여하도록 격려받아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The child is given an opportunity.\u003c/div>\u003cdiv class=\"g-ko\">그 아이는 기회를 받는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":87,"text":"수동태는 주어가 어떤 행동을 당하는 입장일 때 be동사와 과거분사를 이용해 만듭니다. 조동사가 있으면 조동사 뒤에 be를 두고 그 뒤에 과거분사를 붙여요. 예를 들어 아이들이 격려받아야 한다는 children should be encouraged처럼 씁니다. 수동태에서는 행위자가 중요하지 않으면 by 표현을 생략할 수 있다는 점도 자연스럽게 익혀 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글을 읽고, 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">School-age children seem to be ① \u003cu class=\"p-u\">constantly\u003c/u> in motion. They enjoy active sports and games as well as crafts and fine motor activities. Activities ② \u003cu class=\"p-u\">requiring\u003c/u> balance and strength, such as bicycle riding, tree climbing, and skating, are exciting and fun for the school-age child. Coordination and motor skills improve as the child ③ \u003cu class=\"p-u\">is given\u003c/u> an opportunity to practice. Therefore, \u003cu class=\"p-u\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/u> During the school-age years, children learn physical fitness skills that ④ \u003cu class=\"p-u\">contribute\u003c/u> to their health for the rest of their lives. Cardiovascular fitness, strength, and flexibility are improved by physical activity. Popular games such as tag, jump rope, and hide-and-seek ⑤ \u003cu class=\"p-u\">to provide\u003c/u> a release of emotional tension and enhance the development of leader and follower skills.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① constantly\u003c/div>\u003cdiv class=\"p-op\">② requiring\u003c/div>\u003cdiv class=\"p-op\">③ is given\u003c/div>\u003cdiv class=\"p-op\">④ contribute\u003c/div>\u003cdiv class=\"p-op\">⑤ to provide\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":88,"text":"아홉 번째 문제는 학령기 아이들의 신체 활동에 관한 글이에요. 각 밑줄이 부사인지, 분사인지, 수동태인지, 주동사인지 확인해 봅시다.","hl":"q"},{"n":89,"text":"","hl":"q","pause":7},{"n":90,"text":"정답은 다섯 번째 선택지입니다. 인기 있는 놀이들이라는 복수 주어 뒤에는 to provide가 아니라 주동사 provide가 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글을 읽고, 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">School-age children seem to be ① \u003cu class=\"p-u\">constantly\u003c/u> in motion. They enjoy active sports and games as well as crafts and fine motor activities. Activities ② \u003cu class=\"p-u\">requiring\u003c/u> balance and strength, such as bicycle riding, tree climbing, and skating, are exciting and fun for the school-age child. Coordination and motor skills improve as the child ③ \u003cu class=\"p-u\">is given\u003c/u> an opportunity to practice. Therefore, \u003cu class=\"p-u\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/u> During the school-age years, children learn physical fitness skills that ④ \u003cu class=\"p-u\">contribute\u003c/u> to their health for the rest of their lives. Cardiovascular fitness, strength, and flexibility are improved by physical activity. Popular games such as tag, jump rope, and hide-and-seek ⑤ \u003cu class=\"p-u\">to provide\u003c/u> a release of emotional tension and enhance the development of leader and follower skills.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① constantly\u003c/div>\u003cdiv class=\"p-op\">② requiring\u003c/div>\u003cdiv class=\"p-op\">③ is given\u003c/div>\u003cdiv class=\"p-op\">④ contribute\u003c/div>\u003cdiv class=\"p-op\">⑤ to provide\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① constantly 확인\u003c/b>be동사 뒤에서 in motion을 꾸미는 부사 \u003cb class=\"key\">constantly\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② requiring 확인\u003c/b>Activities를 수식하는 현재분사 \u003cb class=\"key\">requiring\u003c/b>이 맞습니다. 활동들이 균형과 힘을 요구하는 능동 의미입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ is given 확인\u003c/b>the child가 기회를 받는 대상이므로 수동태 \u003cb class=\"key\">is given\u003c/b>이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ contribute 확인\u003c/b>선행사 physical fitness skills가 복수이므로 복수 동사 \u003cb class=\"key\">contribute\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ to provide 확인\u003c/b>Popular games가 주어이고 주동사가 필요하므로 \u003cb class=\"key\">to provide\u003c/b>를 \u003cb class=\"key\">provide\u003c/b>로 고쳐야 합니다. to부정사는 주동사가 될 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">Popular games such as tag, jump rope, and hide-and-seek provide a release of emotional tension and enhance the development of leader and follower skills.\u003c/div>\u003cdiv class=\"p-ko\">학령기 아이들은 활동적이며, 신체 활동은 건강과 정서 해소, 리더십 발달에 기여한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어 뒤에 to부정사가 와서 주동사를 대신할 수 없고, 복수 주어 Popular games에는 복수 동사 provide가 필요합니다.\u003c/div>","segs":[{"n":91,"text":"첫 번째 선택지는 계속해서라는 뜻으로 동작을 꾸며 주는 부사예요. seem to be constantly in motion 구조가 자연스럽습니다.","hl":"st-0"},{"n":92,"text":"두 번째 선택지는 활동들이 균형과 힘을 요구한다는 능동 의미의 분사예요. 그래서 requiring이 맞습니다.","hl":"st-1"},{"n":93,"text":"세 번째 선택지는 아이가 기회를 받는다는 수동 의미예요. is given이 자연스럽습니다.","hl":"st-2"},{"n":94,"text":"네 번째 선택지는 신체 건강 기술들이 건강에 기여한다는 뜻이에요. 복수 선행사와 복수 동사가 잘 맞습니다.","hl":"st-3"},{"n":95,"text":"다섯 번째 선택지가 어색한 부분입니다. 인기 있는 놀이들이라는 주어 뒤에는 주동사 provide가 와야 하므로 to provide가 아니라 provide를 써야 해요.","hl":"st-4"},{"n":96,"text":"이 문제의 함정도 짚고 갈게요. 주어 뒤에 to부정사가 와서 주동사를 대신할 수 없고, 복수 주어 Popular games에는 복수 동사 provide가 필요합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">encourage + 목적어 + to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">encourage는 \u003cb class=\"key\">목적어 + to부정사\u003c/b>를 취해 ~하도록 격려하다라는 뜻을 만듭니다.\u003cdiv>\u003cspan class=\"g-formula\">encourage + 목적어 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적격보어로 to부정사\u003c/li>\u003cli>수동태는 be encouraged to\u003c/li>\u003cli>동사원형만 쓰지 않음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Children should be encouraged to engage in physical activities.\u003c/div>\u003cdiv class=\"g-ko\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Teachers encourage students to ask questions.\u003c/div>\u003cdiv class=\"g-ko\">교사들은 학생들이 질문하도록 격려한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":97,"text":"encourage는 목적어 뒤에 to부정사를 붙여서 그 사람이 어떤 행동을 하도록 격려하다라는 뜻을 만듭니다. 수동태로 바뀌면 be encouraged to do 형태가 되죠. 아이들은 신체 활동에 참여하도록 격려받아야 한다는 children should be encouraged to engage in physical activities처럼 표현합니다. encourage 뒤에 to를 빼먹지 않는 것이 핵심입니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">engage in\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">engage in은 \u003cb class=\"key\">활동에 참여하다\u003c/b>라는 뜻으로, in 뒤에 동명사나 명사가 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">engage in + 명사/동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>in은 전치사\u003c/li>\u003cli>뒤에 명사구\u003c/li>\u003cli>physical activities와 자주 결합\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">engage in physical activities\u003c/div>\u003cdiv class=\"g-ko\">신체 활동에 참여하다\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">engage in research\u003c/div>\u003cdiv class=\"g-ko\">연구에 참여하다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":98,"text":"engage in은 어떤 활동에 참여한다는 뜻을 나타내는 구동사입니다. in이 전치사이기 때문에 뒤에는 명사나 동명사가 와야 해요. 신체 활동에 참여하다는 engage in physical activities처럼 표현합니다. encourage 목적어 to engage in activities 형태로 자주 나오니 한 덩어리로 익혀 두면 좋습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">영작 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cu class=\"p-u\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/u>\u003c/div>\u003cdiv class=\"p-words\">보기: children / activities / physical / encourage / should / in / engage\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Children should be encouraged to engage in physical activities.\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":99,"text":"마지막 문제는 주어진 우리말을 영어로 완성하는 문제예요. 누가 무엇을 하도록 격려받는지, 수동태와 to부정사, engage in 구문을 순서대로 조립해 봅시다.","hl":"q"},{"n":100,"text":"","hl":"q","pause":7},{"n":101,"text":"정답은 Children should be encouraged to engage in physical activities입니다. should be encouraged로 수동태를 만들고, to engage in 뒤에 physical activities를 붙이면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">영작 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cu class=\"p-u\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/u>\u003c/div>\u003cdiv class=\"p-words\">보기: children / activities / physical / encourage / should / in / engage\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어와 조동사\u003c/b>주어는 children이고, 아이들은 격려받아야 하므로 수동태 \u003cb class=\"key\">should be encouraged\u003c/b>를 만듭니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">to부정사 연결\u003c/b>encourage는 수동태에서도 \u003cb class=\"key\">be encouraged to + 동사원형\u003c/b> 형태를 취합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">engage in 목적어\u003c/b>참여하다는 \u003cb class=\"key\">engage in\u003c/b>으로 표현하고, 신체 활동은 \u003cb class=\"key\">physical activities\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 Children should be encouraged to engage in physical activities.\u003c/span>\u003cdiv class=\"p-full\">Children should be encouraged to engage in physical activities.\u003c/div>\u003cdiv class=\"p-ko\">아이들은 신체 활동에 참여하도록 격려받아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>수동태 be encouraged 뒤의 to를 빠뜨리지 말고, engage in 뒤에는 전치사 in이 필요합니다.\u003c/div>","segs":[{"n":102,"text":"먼저 주어 children을 놓고 격려받아야 한다는 수동 의미를 만듭니다. 조동사 should 뒤에 be encouraged를 붙이면 됩니다.","hl":"st-0"},{"n":103,"text":"encourage는 목적어 뒤에 to부정사를 쓰는 동사예요. 수동태가 되어도 encouraged to engage처럼 to를 유지합니다.","hl":"st-1"},{"n":104,"text":"참여하다는 engage in으로 쓰고, 신체 활동은 physical activities로 표현합니다. 그래서 to engage in physical activities가 됩니다.","hl":"st-2"},{"n":105,"text":"이 문제의 함정도 짚고 갈게요. 수동태 be encouraged 뒤의 to를 빠뜨리지 말고, engage in 뒤에는 전치사 in이 필요합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">고1·2 어법 종합: 분사, 관계부사, 수일치, 준동사, 수동태, 병렬, 대명사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>분사는 의미상 주어와의 관계로 \u003cb class=\"key\">현재분사\u003c/b>와 \u003cb class=\"key\">과거분사\u003c/b>를 구별한다.\u003c/li>\u003cli>주어와 동사 사이에 끼어든 along with 같은 표현은 \u003cb class=\"key\">수일치\u003c/b>에 영향을 주지 않는다.\u003c/li>\u003cli>동사원형은 주어나 주동사 자리를 대신할 수 없고, 필요하면 \u003cb class=\"key\">to부정사\u003c/b>나 \u003cb class=\"key\">동명사\u003c/b>를 쓴다.\u003c/li>\u003cli>occur, happen 같은 \u003cb class=\"key\">자동사\u003c/b>는 수동태로 쓸 수 없다.\u003c/li>\u003cli>비교 문장의 반복 동사는 \u003cb class=\"key\">do, does, did\u003c/b>로 받고, 긴 진목적어는 \u003cb class=\"key\">가목적어 it\u003c/b>으로 처리한다.\u003c/li>\u003cli>encourage는 \u003cb class=\"key\">encourage + 목적어 + to부정사\u003c/b>로 기억한다.\u003c/li>\u003c/ul>","segs":[{"n":106,"text":"오늘 문제에서 가장 중요한 흐름은 밑줄이 명사 자리인지, 동사 자리인지, 수식 자리인지 먼저 판단하는 것이었어요. 분사와 준동사는 능동과 수동, 주동사 필요 여부를 확인하면 많은 문제가 풀립니다. 수일치와 병렬, 대동사, 가목적어까지 묶어서 복습해 두면 누적 테스트에서 흔들리지 않을 거예요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
