</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"챕터1 동사 Point02","title":"대동사, 앞 동사를 똑똑하게 대신하기","audioDir":"point02_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">솔리드 어법실력 - 출제 포인트 2. 대동사\u003c/div>\u003ch1>대동사, 앞 동사를 똑똑하게 대신하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>대동사가 무엇인지 이해하고, 앞 동사의 성격과 주어의 수, 문맥의 시제에 따라 알맞은 대동사를 고를 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 대동사라는 문법을 함께 공부해 볼 거예요. 대동사는 앞에 나온 동사를 똑같이 반복하지 않고 짧고 자연스럽게 대신 표현해 주는 아주 똑똑한 동사랍니다. 오늘 예문들을 하나씩 읽으면서 대동사를 언제, 어떻게 골라야 하는지 정확히 익혀 보도록 해요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">대동사란 무엇인가\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞에 이미 쓰인 동사(구)를 다시 반복하지 않기 위해 대신 쓰는 동사입니다. 같은 동사를 두 번 말하면 문장이 길어지고 어색해지므로, \u003cb class=\"key\">대동사\u003c/b>로 \u003cb class=\"key\">반복\u003c/b>을 피합니다.\u003cdiv>\u003cspan class=\"g-formula\">동사(구)의 반복 → 대동사로 대신\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I like pizza, and she \u003cspan class=\"fx\">does\u003c/span> too.\u003c/div>\u003cdiv class=\"g-ko\">나는 피자를 좋아하고, 그녀도 그렇다.\u003c/div>\u003cdiv class=\"g-note\">앞의 like를 반복하지 않고 대동사 does로 대신했다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>대동사는 혼자서 뜻을 다하지 못하고 앞에 나온 \u003cb class=\"key\">동사(구)\u003c/b>의 뜻을 이어받는다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 대동사가 무엇인지부터 볼게요. 대동사는 앞에 이미 나온 동사나 동사구를 다시 쓰지 않으려고 대신 쓰는 동사예요. 예를 들어 I like pizza, and she does too라고 하면 뒤에 like를 또 쓰지 않고 does 하나로 대신한 거죠. 이렇게 하면 문장이 훨씬 짧고 자연스러워져요.","hl":"rule"},{"n":3,"text":"I like pizza, and she does too. 뜻은 나는 피자를 좋아하고, 그녀도 그렇다는 말이에요. 뒤에 있는 does가 앞의 like를 대신하는 대동사예요.","hl":"ex-0"},{"n":4,"text":"대동사는 혼자서는 뜻이 완성되지 않아요. 항상 앞에 나온 동사구의 뜻을 이어받는다는 점을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">앞 동사의 성격에 따라 대동사를 고른다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞에 쓰인 동사의 성격에 따라 골라야 합니다. \u003cb class=\"key\">일반동사\u003c/b>는 \u003cb class=\"key\">do\u003c/b>, \u003cb class=\"key\">be동사\u003c/b>는 be동사, 조동사는 같은 조동사, \u003cb class=\"key\">완료형\u003c/b>은 have나 has를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">일반동사 → do / be동사 → be동사 / 조동사 → 조동사 / 완료형 → have·has\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Today's cats look as different from their ancestors \u003cspan class=\"fx\">as do humans from theirs\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">오늘날의 고양이들은 그들의 조상과 다른 만큼, 인간도 인간의 조상과 다르다.\u003c/div>\u003cdiv class=\"g-note\">앞에 일반동사 look이 쓰였으므로 대동사로 do를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Glass and steel \u003cspan class=\"fx\">are\u003c/span> heavier to transport than plastics are.\u003c/div>\u003cdiv class=\"g-ko\">유리와 강철은 플라스틱보다 운반하기가 더 무겁다.\u003c/div>\u003cdiv class=\"g-note\">앞에 be동사가 쓰였으므로 대동사로 are를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">can\u003c/span> play the piano better than I can.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나보다 피아노를 더 잘 칠 수 있다.\u003c/div>\u003cdiv class=\"g-note\">앞에 조동사 can이 쓰였으므로 대동사로 같은 조동사 can을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">has\u003c/span> finished his homework, and his sister has too.\u003c/div>\u003cdiv class=\"g-ko\">그는 숙제를 끝냈고, 그의 여동생도 끝냈다.\u003c/div>\u003cdiv class=\"g-note\">앞에 완료형 has finished가 쓰였으므로 대동사로 has를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>대동사를 고를 때는 앞 동사의 \u003cb class=\"key\">종류\u003c/b>를 먼저 확인하세요. be동사와 조동사는 같은 형태를 그대로 다시 쓰고, 일반동사와 완료형은 do와 have를 씁니다.\u003c/div>","segs":[{"n":5,"text":"이제 어떤 대동사를 골라야 하는지가 중요해요. 기준은 아주 간단한데, 앞에 쓰인 동사의 성격을 그대로 따라가면 돼요. 일반동사가 앞에 있으면 do를 쓰고, be동사가 앞에 있으면 be동사를 쓰고, 조동사가 앞에 있으면 같은 조동사를 쓰고, 완료형이 앞에 있으면 have나 has를 써요. 이 네 가지만 기억하면 대동사 고르기는 어렵지 않아요.","hl":"rule"},{"n":6,"text":"Today's cats look as different from their ancestors as do humans from theirs. 뜻은 오늘날의 고양이들이 자기 조상과 다른 만큼 인간도 자기 조상과 다르다는 말이에요. 앞에 일반동사 look이 나왔으니까 뒤에서는 do를 대동사로 쓴 거예요.","hl":"ex-0"},{"n":7,"text":"Glass and steel are heavier to transport than plastics are. 뜻은 유리와 강철이 플라스틱보다 운반하기가 더 무겁다는 말이에요. 앞에 be동사가 쓰였으니까 대동사도 be동사인 are를 쓴 거예요.","hl":"ex-1"},{"n":8,"text":"She can play the piano better than I can. 뜻은 그녀가 나보다 피아노를 더 잘 칠 수 있다는 말이에요. 앞에 조동사 can이 나왔으니까 뒤에서도 똑같이 can을 대동사로 써 준 거예요.","hl":"ex-2"},{"n":9,"text":"He has finished his homework, and his sister has too. 뜻은 그가 숙제를 끝냈고 그의 여동생도 끝냈다는 말이에요. 앞에 완료형이 나왔으니까 대동사로 has를 써 준 거죠.","hl":"ex-3"},{"n":10,"text":"대동사를 고를 때는 앞 동사의 종류를 먼저 확인하는 습관을 들이세요. be동사와 조동사는 같은 형태를 그대로 다시 쓰고, 일반동사와 완료형은 do와 have 계열을 쓴다는 점도 함께 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">대동사는 주어와 수를 일치시킨다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞 동사를 그대로 복사하는 것이 아니라, 대동사가 가리키는 \u003cb class=\"key\">주어\u003c/b>에 맞춰 \u003cb class=\"key\">수\u003c/b>를 일치시킵니다. 그래서 앞 동사가 단수형이어도 대동사의 주어가 복수이면 복수형 do를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">대동사 + 주어 → 주어의 수에 일치\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">No one knows the real estate market better than \u003cspan class=\"fx\">do\u003c/span> our experts.\u003c/div>\u003cdiv class=\"g-ko\">우리 전문가들보다 부동산 시장을 더 잘 아는 사람은 없다.\u003c/div>\u003cdiv class=\"g-note\">앞의 knows는 단수형이지만 대동사는 주어 our experts에 수를 일치시켜 do를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>대동사가 가리키는 \u003cb class=\"key\">주어\u003c/b>를 찾아 \u003cb class=\"key\">복수\u003c/b>인지 \u003cb class=\"key\">단수\u003c/b>인지 먼저 확인하세요.\u003c/div>","segs":[{"n":11,"text":"여기서 학생들이 가장 많이 실수하는 부분이 나와요. 대동사는 앞 동사를 그대로 베끼는 게 아니라, 대동사가 가리키는 주어에 맞춰서 수를 일치시켜야 해요. 그래서 앞 동사가 단수형이더라도 대동사의 주어가 복수라면 복수형을 써야 합니다. 앞 동사가 아니라 대동사의 주어를 보라는 점, 꼭 기억하세요.","hl":"rule"},{"n":12,"text":"No one knows the real estate market better than do our experts. 뜻은 우리 전문가들보다 부동산 시장을 더 잘 아는 사람은 없다는 말이에요. 앞의 knows는 단수형이지만 대동사는 our experts라는 복수 주어에 맞춰야 하니까 do를 쓴 거예요.","hl":"ex-0"},{"n":13,"text":"대동사를 쓰기 전에 그 대동사가 가리키는 주어를 먼저 찾아 보세요. 그 주어가 복수인지 단수인지 확인하는 습관이 실수를 막아 줍니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">대동사는 문맥에 맞는 시제를 쓴다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞 동사의 시제를 그대로 따라가는 것이 아니라, \u003cb class=\"key\">문맥\u003c/b>에 맞는 \u003cb class=\"key\">시제\u003c/b>를 써야 합니다. 문장 안에 과거를 나타내는 말이 있으면 대동사도 과거시제로 바꿔 줍니다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is not the same little girl as she \u003cspan class=\"fx\">was\u003c/span> a few years ago.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 몇 년 전과 같은 어린 소녀가 아니다.\u003c/div>\u003cdiv class=\"g-note\">앞의 is는 현재시제이지만 a few years ago가 있으므로 대동사는 과거시제가 되어야 한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>a few years ago처럼 \u003cb class=\"key\">과거\u003c/b>를 가리키는 표현이 있으면 대동사를 \u003cb class=\"key\">과거시제\u003c/b>로 바꾸세요.\u003c/div>","segs":[{"n":14,"text":"마지막으로 시제예요. 대동사의 시제는 앞 동사의 시제가 아니라 문맥이 결정해요. 문장 안에 과거를 가리키는 말이 있으면 앞 동사가 현재형이어도 대동사는 과거형으로 바꿔 줘야 합니다. 시제 문제는 해석과 함께 판단해야 하니까 문장 전체를 꼭 끝까지 읽어 보세요.","hl":"rule"},{"n":15,"text":"She is not the same little girl as she was a few years ago. 뜻은 그녀가 몇 년 전과 같은 어린 소녀가 아니라는 말이에요. 앞의 is는 현재시제지만 a few years ago라는 표현이 있으니까 대동사는 과거시제인 was가 되어야 해요.","hl":"ex-0"},{"n":16,"text":"문장 안에 과거를 가리키는 표현이 보이면 대동사의 시제도 과거로 바꿔야 한다는 걸 잊지 마세요. 해석으로 시간을 확인하는 습관이 중요합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>No one knows the real estate market better than does our experts.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ No one knows the real estate market better than do our experts.\u003c/div>\u003cdiv class=\"g-why\">대동사는 앞 동사가 아니라 대동사의 주어 our experts에 수를 일치시켜야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She is not the same little girl as she is a few years ago.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She is not the same little girl as she was a few years ago.\u003c/div>\u003cdiv class=\"g-why\">a few years ago가 있으므로 대동사는 과거시제 was가 되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Glass and steel are heavier to transport than plastics do.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Glass and steel are heavier to transport than plastics are.\u003c/div>\u003cdiv class=\"g-why\">앞에 be동사 are가 쓰였으므로 대동사도 be동사 are를 써야 한다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장에서 자주 틀리는 부분은 대동사의 수 일치예요. 앞에 있는 knows가 단수라서 does를 쓰고 싶어지지만, 대동사는 our experts라는 복수 주어에 맞춰야 하니까 do를 써야 해요. 그래서 No one knows the real estate market better than do our experts라고 해야 맞아요.","hl":"mk-0"},{"n":18,"text":"이 문장은 시제 때문에 틀리기 쉬워요. a few years ago라는 표현이 있으니까 몇 년 전, 즉 과거를 말하고 있는 거죠. 그래서 대동사는 is가 아니라 was로 써야 합니다.","hl":"mk-1"},{"n":19,"text":"이 문장은 대동사의 종류를 잘못 고른 경우예요. 앞에 나온 동사가 be동사인 are이니까 뒤에서도 do가 아니라 be동사 are를 써 줘야 해요. 그래서 than plastics are라고 해야 맞는 문장이 됩니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 대동사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Today's cats look as different from their ancestors as ____ humans from theirs.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>are\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>do\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>does\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>have\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">do\u003c/span>\u003cdiv class=\"g-exp\">앞에 일반동사 look이 쓰였으므로 대동사로 do를 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"첫 번째 문제입니다. Today's cats look as different from their ancestors as 빈칸 humans from theirs. 빈칸에 들어갈 대동사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기인 do예요. 앞에 일반동사 look이 쓰였으니까 대동사로 do를 써야 하거든요. be동사 are가 아니라 do라는 점을 꼭 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 대동사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Glass and steel are heavier to transport than plastics ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>are\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>do\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>does\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>is\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">are\u003c/span>\u003cdiv class=\"g-exp\">앞에 be동사가 쓰였으므로 대동사로 are를 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"두 번째 문제입니다. Glass and steel are heavier to transport than plastics 빈칸. 빈칸에 알맞은 대동사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24
