</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"챕터1 동사 Point03","title":"대동사 완전 정복: do, be동사, 조동사, have","audioDir":"point02_alt_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">솔리드 어법실력 - 대동사\u003c/div>\u003ch1>대동사 완전 정복: do, be동사, 조동사, have\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>앞에 쓰인 동사(구)에 따라 대동사를 고르고, 주어와 수·시제를 일치시킬 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 솔리드 어법실력에서 대동사에 대해 배워 볼 거예요. 대동사는 앞에 나온 동사를 반복하지 않으려고 대신 쓰는 표현이라서, 앞 동사의 성격과 주어, 시제를 잘 보는 게 중요해요. 오늘 예문을 통해 do, be동사, 조동사, have 중 무엇을 골라야 하는지 차근차근 알아봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">대동사의 기본 개념과 종류 선택\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞에 쓰인 \u003cb class=\"key\">동사(구)\u003c/b>의 반복을 피하기 위해 사용합니다. 앞에 쓰인 동사의 성격에 따라 일반동사는 \u003cb class=\"key\">do\u003c/b>, be동사는 \u003cb class=\"key\">be동사\u003c/b>, 조동사는 조동사, 완료형은 have를 선택합니다.\u003cdiv>\u003cspan class=\"g-formula\">일반동사 → do / be동사 → be동사 / 조동사 → 조동사 / 완료형 → have[has]\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Today's cats look as different from their ancestors as (are / \u003cspan class=\"fx\">do\u003c/span>) humans from theirs.\u003c/div>\u003cdiv class=\"g-ko\">오늘날의 고양이들은 그들의 조상과 다른 만큼, 인간들도 그들의 조상과 다르다.\u003c/div>\u003cdiv class=\"g-note\">앞에 일반동사 look이 쓰였으므로 대동사로 do를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Glass and steel \u003cspan class=\"fx\">are\u003c/span> heavier to transport than plastics (are / do).\u003c/div>\u003cdiv class=\"g-ko\">유리와 철은 플라스틱보다 운반하기가 더 무겁다.\u003c/div>\u003cdiv class=\"g-note\">앞에 be동사가 쓰였으므로 대동사로 are를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">can\u003c/span> play the guitar better than she can.\u003c/div>\u003cdiv class=\"g-ko\">그는 그녀보다 기타를 더 잘 칠 수 있다.\u003c/div>\u003cdiv class=\"g-note\">앞에 조동사 can이 쓰였으므로 대동사로 can을 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She has finished her homework, and her brothers \u003cspan class=\"fx\">have\u003c/span>, too.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 숙제를 끝냈고, 그녀의 형제들도 끝냈다.\u003c/div>\u003cdiv class=\"g-note\">완료형에서는 대동사로 have[has]를 사용하며 주어에 수를 일치시킵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>조동사는 앞에 나온 \u003cb class=\"key\">조동사\u003c/b>를, 완료형은 \u003cb class=\"key\">have\u003c/b>를 대동사로 쓴다는 점도 꼭 기억하세요.\u003c/div>","segs":[{"n":2,"text":"대동사는 앞에 이미 나온 동사나 동사구를 다시 쓰지 않으려고 대신 사용하는 말이에요. 예를 들어 앞에서 look이 나왔는데 뒤에서 또 look을 쓰면 문장이 지루해지겠죠. 그래서 앞 동사의 성격에 맞는 do, be동사, 조동사, have 같은 표현을 대동사로 씁니다. 핵심은 앞에 나온 동사가 무엇이었는지 잘 보는 거예요.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. Today's cats look as different from their ancestors as do humans from theirs. 뜻은 오늘날의 고양이들은 그들의 조상과 다른 만큼 인간들도 그들의 조상과 다르다는 말이에요. 앞에 일반동사 look이 나왔기 때문에 대동사로 do를 썼습니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. Glass and steel are heavier to transport than plastics are. 뜻은 유리와 철은 플라스틱보다 운반하기가 더 무겁다는 말이에요. 앞에 be동사 are가 쓰였으므로 대동사도 are를 씁니다.","hl":"ex-1"},{"n":5,"text":"이번 예문도 제가 준비했어요. He can play the guitar better than she can. 뜻은 그는 그녀보다 기타를 더 잘 칠 수 있다는 말이에요. 앞에 조동사 can이 쓰였으므로 뒤에서도 대동사로 can을 씁니다.","hl":"ex-2"},{"n":6,"text":"이번에는 완료형 예문이에요. She has finished her homework, and her brothers have, too. 뜻은 그녀는 숙제를 끝냈고 그녀의 형제들도 끝냈다는 말이에요. 앞에 완료형 has finished가 쓰였으므로 대동사는 have를 쓰고, 주어 her brothers에 맞춰 have를 씁니다.","hl":"ex-3"},{"n":7,"text":"대동사를 고를 때는 뒤만 보지 말고 앞에 나온 동사를 먼저 확인해야 해요. 앞 동사가 일반동사면 do, be동사면 be동사를 떠올리면 됩니다. 조동사는 앞에 나온 조동사를 그대로 쓰고, 완료형은 have를 쓴다는 것도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">대동사의 수 일치와 시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대동사는 앞 동사의 형태에만 끌리지 않고 \u003cb class=\"key\">주어\u003c/b>와 \u003cb class=\"key\">수\u003c/b>를 일치시켜야 합니다. 또한 문맥에 따라 적절한 \u003cb class=\"key\">시제\u003c/b>를 적용해야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">대동사 = 주어 수 일치 + 문맥 시제 일치\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">No one knows the real estate market better than (\u003cspan class=\"fx\">do\u003c/span> / does) our experts.\u003c/div>\u003cdiv class=\"g-ko\">우리 전문가들보다 부동산 시장을 더 잘 아는 사람은 없다.\u003c/div>\u003cdiv class=\"g-note\">앞의 동사 knows는 단수형이지만 대동사는 주어 our experts에 수를 일치시켜야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is not the same little girl as she (is / \u003cspan class=\"fx\">was\u003c/span>) a few years ago.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 몇 년 전과 같은 어린 소녀가 아니다.\u003c/div>\u003cdiv class=\"g-note\">a few years ago가 있으므로 대동사는 과거시제가 되어야 합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>앞 동사의 시제와 대동사의 시제가 달라질 수 있으니 \u003cb class=\"key\">문맥\u003c/b>과 \u003cb class=\"key\">시간 표현\u003c/b>을 꼭 확인하세요.\u003c/div>","segs":[{"n":8,"text":"대동사는 앞 동사의 형태만 보고 정하면 안 돼요. 뒤에 나온 주어와 수를 맞춰야 하고, 문맥에 따라 시제도 바꿔야 합니다. 예를 들어 앞 동사가 단수형이어도 대동사의 주어가 복수면 복수형을 써야 해요. 또 과거를 나타내는 표현이 있으면 대동사도 과거시제로 바꿔야 합니다.","hl":"rule"},{"n":9,"text":"세 번째 예문이에요. No one knows the real estate market better than do our experts. 뜻은 우리 전문가들보다 부동산 시장을 더 잘 아는 사람은 없다는 말이에요. 앞에 knows가 단수라서 does를 고르기 쉽지만, 대동사는 주어 our experts에 수를 맞춰 do를 씁니다.","hl":"ex-0"},{"n":10,"text":"네 번째 예문이에요. She is not the same little girl as she was a few years ago. 뜻은 그녀는 몇 년 전과 같은 어린 소녀가 아니라는 말이에요. 앞에 is가 있지만 a few years ago가 있으므로 대동사는 과거시제 was가 되어야 합니다.","hl":"ex-1"},{"n":11,"text":"대동사의 시제는 앞 동사와 항상 같다고 생각하면 틀릴 수 있어요. a few years ago처럼 시간을 알려 주는 표현이 있으면 대동사도 그에 맞춰 과거로 바꿔야 합니다. 문맥을 꼭 확인하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Today's cats look as different from their ancestors as are humans from theirs.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Today's cats look as different from their ancestors as do humans from theirs.\u003c/div>\u003cdiv class=\"g-why\">앞에 일반동사 look이 쓰였는데 be동사 are를 대동사로 써서 틀렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Glass and steel are heavier to transport than plastics do.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Glass and steel are heavier to transport than plastics are.\u003c/div>\u003cdiv class=\"g-why\">앞에 be동사 are가 쓰였으므로 대동사로 do가 아니라 are를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>No one knows the real estate market better than does our experts.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ No one knows the real estate market better than do our experts.\u003c/div>\u003cdiv class=\"g-why\">대동사는 주어 our experts에 수를 일치시켜야 하므로 does가 아니라 do를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"첫 번째로 자주 하는 실수예요. 앞에 look이라는 일반동사가 나왔는데 뒤에서 are를 쓰면 안 됩니다. 이때는 do를 써서 Today's cats look as different from their ancestors as do humans from theirs라고 해야 해요. 일반동사에는 do가 대동사로 온다는 점을 기억하세요.","hl":"mk-0"},{"n":13,"text":"두 번째 실수예요. Glass and steel are heavier to transport than plastics do라고 하면 어색합니다. 앞에 be동사 are가 나왔으니까 뒤에도 are를 써서 than plastics are라고 해야 해요. be동사는 대동사도 be동사입니다.","hl":"mk-1"},{"n":14,"text":"세 번째 실수예요. No one knows the real estate market better than does our experts라고 쓰기 쉬운데, 대동사는 주어 our experts에 수를 맞춰야 합니다. our experts가 복수이므로 does가 아니라 do를 써서 than do our experts라고 해야 해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 대동사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Today's cats look as different from their ancestors as ____ humans from theirs.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>are\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>do\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>does\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>have\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">do\u003c/span>\u003cdiv class=\"g-exp\">앞에 일반동사 look이 쓰였으므로 대동사 do를 사용합니다. 주어 humans에 맞춰 do입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제예요. Today's cats look as different from their ancestors as 빈칸 humans from theirs. 빈칸에 들어갈 대동사를 고르세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 do예요. 앞에 일반동사 look이 쓰였으니까 be동사 are가 아니라 do를 써야 해요. 대동사는 앞에 나온 동사를 대신하죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 대동사를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Glass and steel are heavier to transport than plastics ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>are\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>do\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>does\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>is\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">are\u003c/span>\u003cdiv class=\"g-exp\">앞에 be동사 are가 쓰였으므로 대동사로 are를 사용합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":
