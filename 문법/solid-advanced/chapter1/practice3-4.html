.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 1 Basic Practice (포인트 3-4)","audioDir":"practice3-4_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">동사 어법과 전치사, 주어-동사 수일치, rise/raise, seat/sit\u003c/div>\u003ch1>Chapter 1 Basic Practice 포인트 3-4 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법 고치기\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 기본 연습 문제를 통해 동사의 쓰임과 주어와 동사의 수일치를 함께 정리해 볼 거예요. 문제를 하나씩 읽으면서 어떤 기준을 먼저 확인해야 하는지 차근차근 짚어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">타동사와 불필요한 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">discuss\u003c/b>, \u003cb class=\"key\">await\u003c/b>, \u003cb class=\"key\">approach\u003c/b>, \u003cb class=\"key\">resemble\u003c/b>, \u003cb class=\"key\">marry\u003c/b>처럼 목적어를 바로 받는 타동사에는 전치사를 붙이지 않아요.\u003cdiv>\u003cspan class=\"g-formula\">타동사 + 목적어 / 자동사 + 전치사 + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>discuss about, approach to, resemble with처럼 타동사 뒤에 전치사를 붙이면 틀려요.\u003c/li>\u003cli>wait는 자동사라서 wait for a reply처럼 for가 필요하지만, await는 타동사라서 await a reply로 써요.\u003c/li>\u003cli>marry는 타동사로 marry someone이지만, 상태를 말할 때는 be married to someone을 써요.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We discussed the problem.\u003c/div>\u003cdiv class=\"g-ko\">우리는 그 문제를 논의했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We are awaiting a reply.\u003c/div>\u003cdiv class=\"g-ko\">우리는 답변을 기다리고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">She resembles her mother.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 어머니를 닮았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 동사 뒤에 div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 찾기\u003c/b>핵심 동사는 \u003cb class=\"key\">discuss\u003c/b>이고 뒤에 목적어 the matter가 와요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">타동사 확인\u003c/b>\u003cb class=\"key\">discuss\u003c/b>는 타동사라서 목적어를 바로 받고, 전치사 about은 필요 없어요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 선택\u003c/b>따라서 {{discuss about}}가 아니라 \u003cb class=\"key\">discuss\u003c/b>가 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 discuss\u003c/span>\u003cdiv class=\"p-full\">Let's discuss the matter with him before it's too late.\u003c/div>\u003cdiv class=\"p-ko\">너무 늦기 전에 그 문제를 그와 논의하자.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>discuss about처럼 타동사 뒤에 about을 붙이지 않기\u003c/div>","segs":[{"n":6,"text":"먼저 동사 discuss를 찾고 뒤에 목적어 the matter가 바로 오는지 보세요.","hl":"st-0"},{"n":7,"text":"discuss는 타동사라서 about 없이 목적어를 바로 받습니다.","hl":"st-1"},{"n":8,"text":"그래서 discuss about이 아니라 discuss가 맞아요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. discuss about처럼 타동사 뒤에 about을 붙이지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어-동사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장의 \u003cb class=\"key\">진짜 주어\u003c/b>를 찾아 단수·복수를 판단하고, 주어에 맞춰 동사의 수를 결정해요.\u003cdiv>\u003cspan class=\"g-formula\">단수 주어 + 단수 동사 / 복수 주어 + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>\u003cb class=\"key\">What 절\u003c/b>이 주어로 쓰이면 단수 취급해요.\u003c/li>\u003cli>\u003cb class=\"key\">a number of + 복수명사\u003c/b>는 '많은'이라는 뜻으로 복수 취급하고, \u003cb class=\"key\">the number of + 복수명사\u003c/b>는 숫자 자체라서 단수 취급해요.\u003c/li>\u003cli>\u003cb class=\"key\">both A and B\u003c/b>와 \u003cb class=\"key\">the homeless\u003c/b>처럼 사람들을 나타내는 표현은 복수 취급해요.\u003c/li>\u003cli>전치사구 between A and B는 주어의 수에 영향을 주지 않아요.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">What he said is true.\u003c/div>\u003cdiv class=\"g-ko\">그가 말한 것은 사실이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">A number of students are absent.\u003c/div>\u003cdiv class=\"g-ko\">많은 학생들이 결석했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The homeless need help.\u003c/div>\u003cdiv class=\"g-ko\">노숙자들은 도움이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The dissimilarities are clear.\u003c/div>\u003cdiv class=\"g-ko\">그 차이점들은 분명하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"수일치 문제에서는 동사 바로 앞에 있는 말에 속지 말고 진짜 주어를 찾아야 해요. What으로 시작하는 절이 주어로 쓰이면 하나의 덩어리로 보고 단수 동사를 씁니다. a number of 뒤에 복수명사가 오면 많은이라는 뜻이라 복수 동사를 쓰지만, the number of는 숫자 자체를 말하므로 단수 동사를 써요. both A and B나 the homeless처럼 여러 사람을 가리키는 표현도 복수로 봅니다. between A and B 같은 전치사구는 주어의 수를 바꾸지 않는다는 점도 꼭 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">What is unique about journalism as a profession \u003cspan class=\"p-box\">\u003cspan>is\u003c/span>\u003ci>/\u003c/i>\u003cspan>are\u003c/span>\u003c/span> its lack of independence.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">is\u003c/div>\u003cdiv class=\"p-op\">are\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 What절이 주어로 쓰일 때 동사의 수를 묻고 있어요. 진짜 주어가 무엇인지 찾아보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 is입니다. W ,"text":"수동태 be seated를 쓰거나 자동사 sit으로 고치면 됩니다.","hl":"st-2"},{"n":60,"text":"이 문제의 함정도 짚고 갈게요. seat를 sit처럼 자동사로 착각하지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">rise와 raise의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">rise\u003c/b>는 '오르다, 상승하다'라는 자동사이고, \u003cb class=\"key\">raise\u003c/b>는 '올리다, 높이다'라는 타동사예요.\u003cdiv>\u003cspan class=\"g-formula\">rise(자동사) / raise + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>\u003cb class=\"key\">rise\u003c/b> 뒤에는 목적어가 오지 않아요.\u003c/li>\u003cli>\u003cb class=\"key\">raise\u003c/b>는 뒤에 올리는 대상인 목적어가 필요해요.\u003c/li>\u003cli>contribute to 뒤에서 the standard를 목적어로 받으려면 \u003cb class=\"key\">raising\u003c/b>을 써야 해요.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The sun rises in the east.\u003c/div>\u003cdiv class=\"g-ko\">해는 동쪽에서 뜬다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She raised her hand.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 손을 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">They are raising the standard.\u003c/div>\u003cdiv class=\"g-ko\">그들은 기준을 높이고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":61,"text":"rise는 스스로 올라가거나 상승한다는 뜻의 자동사라서 뒤에 목적어가 오지 않아요. raise는 무엇을 올리거나 높인다는 뜻의 타동사라서 반드시 목적어가 필요합니다. 그래서 the standard를 올린다는 뜻을 만들 때는 rising the standard가 아니라 raising the standard라고 해야 해요. contribute to 뒤에는 동명사가 오는데, 그 동명사가 목적어를 가질 수 있는지도 함께 확인하면 좋아요. rise와 raise는 뜻과 문장 구조가 모두 다르니 세트로 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">When many of us (1) \u003cu class=\"p-u\">thinks\u003c/u> about problems such as world poverty, we tend to see ourselves as powerless to bring about change in such a vast issue. However, a recurring message from social activists and religious leaders (2) \u003cu class=\"p-u\">are\u003c/u> that each person can contribute to (3) \u003cu class=\"p-u\">rising\u003c/u> the standard of other people and sometimes the entire world.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) think (2) is (3) raising\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":62,"text":"이 지문에서는 밑줄 친 세 곳을 차례로 보면서 주어와 동사의 수, 그리고 동사의 타동성 여부를 확인해 보세요.","hl":"q"},{"n":63,"text":"","hl":"q","pause":7},{"n":64,"text":"첫 번째는 many of us에 맞춰 think, 두 번째는 단수 주어 a recurring message에 맞춰 is, 세 번째는 the standard를 목적어로 받는 raising으로 고치면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">When many of us (1) \u003cu class=\"p-u\">thinks\u003c/u> about problems such as world poverty, we tend to see ourselves as powerless to bring about change in such a vast issue. However, a recurring message from social activists and religious leaders (2) \u003cu class=\"p-u\">are\u003c/u> that each person can contribute to (3) \u003cu class=\"p-u\">rising\u003c/u> the standard of other people and sometimes the entire world.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) many of us\u003c/b>주어 \u003cb class=\"key\">many of us\u003c/b>는 '우리 중 많은 사람들'이라 복수 취급하므로 \u003cb class=\"key\">thinks\u003c/b>를 \u003cb class=\"key\">think\u003c/b>로 고쳐요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) a recurring message\u003c/b>주어 \u003cb class=\"key\">a recurring message\u003c/b>가 단수이고 that절 전체가 보어이므로 \u003cb class=\"key\">are\u003c/b>를 \u003cb class=\"key\">is\u003c/b>로 고쳐요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) rising\u003c/b>contribute to 뒤에서 \u003cb class=\"key\">the standard\u003c/b>를 목적어로 받아야 하므로 자동사 \u003cb class=\"key\">rising\u003c/b>이 아니라 타동사 \u003cb class=\"key\">raising\u003c/b>을 써요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) think (2) is (3) raising\u003c/span>\u003cdiv class=\"p-full\">When many of us think about problems such as world poverty, we tend to see ourselves as powerless to bring about change in such a vast issue. However, a recurring message from social activists and religious leaders is that each person can contribute to raising the standard of other people and sometimes the entire world.\u003c/div>\u003cdiv class=\"p-ko\">우리 중 많은 사람은 세계 빈곤 같은 문제를 생각할 때 그러한 거대한 문제를 바꿀 힘이 없다고 여긴다. 그러나 사회 활동가와 종교 지도자들이 반복해서 하는 메시지는 각 개인이 다른 사람의 기준을 높이는 데 기여할 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>many of us를 단수로 보거나 rising 뒤의 목적어를 놓치지 않기\u003c/div>","segs":[{"n":65,"text":"먼저 many of us를 주어로 보세요. 우리 중 많은 사람들이라는 뜻이라 복수로 취급하므로 thinks가 아니라 think가 맞습니다.","hl":"st-0"},{"n":66,"text":"다음은 a recurring message를 찾으세요. 반복되는 메시지 하나라서 단수 주어이고, 뒤의 that절은 보어 역할을 하므로 동사는 is가 맞아요.","hl":"st-1"},{"n":67,"text":"마지막으로 rising 뒤에 the standard라는 목적어가 있는지 보세요. rise는 자동사라 목적어를 받을 수 없고, raise가 타동사라서 raising the standard가 되어야 합니다.","hl":"st-2"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. many of us를 단수로 보거나 rising 뒤의 목적어를 놓치지 않기","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Marc (1) \u003cu class=\"p-u\">resembles with\u003c/u> his father, but the two of them have different hair and eye colors. The dissimilarities between Marc and his father (2) \u003cu class=\"p-u\">is\u003c/u> likely due to the recombination of genes. In other words, the woman his father (3) \u003cu class=\"p-u\">married to\u003c/u>, his mother, has hair and eye color genes different from what he carries.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) resembles (with 삭제) (2) are (3) was married to 또는 married\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":69,"text":"이 지문에서는 resemble 뒤의 전치사, 복수 주어 dissimilarities, 그리고 marry가 쓰인 관계절을 차례로 확인해 보세요.","hl":"q"},{"n":70,"text":"","hl":"q","pause":7},{"n":71,"text":"첫 번째는 with를 지우고 resembles, 두 번째는 복수 주어에 맞춰 are, 세 번째는 was married to 또는 married로 고치면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Marc (1) \u003cu class=\"p-u\">resembles with\u003c/u> his father, but the two of them have different hair and eye colors. The dissimilarities between Marc and his father (2) \u003cu class=\"p-u\">is\u003c/u> likely due to the recombination of genes. In other words, the woman his father (3) \u003cu class=\"p-u\">married to\u003c/u>, his mother, has hair and eye color genes different from what he carries.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) resembles with\u003c/b>\u003cb class=\"key\">resemble\u003c/b>은 타동사라서 \u003cb class=\"key\">with\u003c/b>를 삭제하고, 주어 Marc가 단수이므로 \u003cb class=\"key\">resembles\u003c/b>로 써요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) dissimilarities is\u003c/b>주어는 \u003cb class=\"key\">The dissimilarities\u003c/b>로 복수이고 between Marc and his father는 전치사구이므로 \u003cb class=\"key\">is\u003c/b>를 \u003cb class=\"key\">are\u003c/b>로 고쳐요.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) married to\u003c/b>\u003cb class=\"key\">marry\u003c/b>는 타동사라서 his father \u003cb class=\"key\">married\u003c/b> his mother로 쓰거나, 상태 표현 \u003cb class=\"key\">was married to\u003c/b>를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) resembles (with 삭제) (2) are (3) was married to 또는 married\u003c/span>\u003cdiv class=\"p-full\">Marc resembles his father, but the two of them have different hair and eye colors. The dissimilarities between Marc and his father are likely due to the recombination of genes. In other words, the woman his father was married to, his mother, has hair and eye color genes different from what he carries.\u003c/div>\u003cdiv class=\"p-ko\">Marc는 아버지를 닮았지만 두 사람은 머리카락과 눈 색깔이 다르다. Marc와 아버지 사이의 차이점은 유전자 재조합 때문일 가능성이 크다. 다시 말해 아버지가 결혼한 여성인 그의 어머니는 그가 가진 것과 다른 머리카락과 눈 색깔 유전자를 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>between 이하에 끌려 주어의 수를 판단하지 않기\u003c/div>","segs":[{"n":72,"text":"먼저 resemble 뒤에 with가 필요한지 확인하세요. resemble은 타동사라서 with 없이 his father를 바로 목적어로 받고, 주어가 Marc라서 resembles로 씁니다.","hl":"st-0"},{"n":73,"text":"다음은 주어를 찾아보세요. The dissimilarities가 복수 주어이고 between 이하는 전치사구라서 동사의 수에 영향을 주지 않아요. 그래서 is가 아니라 are가 맞습니다.","hl":"st-1"},{"n":74,"text":"마지막으로 his father married to를 보세요. marry는 타동사라서 to 없이 married만 써도 되고, 결혼한 상태를 말하려면 was married to로 고쳐야 합니다.","hl":"st-2"},{"n":75,"text":"이 문제의 함정도 짚고 갈게요. between 이하에 끌려 주어의 수를 판단하지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">동사 어법과 전치사, 주어-동사 수일치, rise/raise, seat/sit\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>전치사가 필요 없는 타동사 \u003cb class=\"key\">discuss\u003c/b>, \u003cb class=\"key\">await\u003c/b>, \u003cb class=\"key\">approach\u003c/b>, \u003cb class=\"key\">resemble\u003c/b>, \u003cb class=\"key\">marry\u003c/b>를 구분한다.\u003c/li>\u003cli>주어의 핵심 명사와 수를 확인해 \u003cb class=\"key\">주어-동사 수일치\u003c/b>를 맞춘다.\u003c/li>\u003cli>\u003cb class=\"key\">a number of + 복수명사\u003c/b>는 복수 동사, \u003cb class=\"key\">the number of + 복수명사\u003c/b>는 단수 동사를 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">the + 형용사\u003c/b>가 사람들을 뜻하면 복수 취급한다.\u003c/li>\u003cli>\u003cb class=\"key\">rise\u003c/b>는 자동사, \u003cb class=\"key\">raise\u003c/b>는 타동사이며 \u003cb class=\"key\">seat\u003c/b>는 목적어가 필요해 \u003cb class=\"key\">be seated\u003c/b> 또는 \u003cb class=\"key\">sit\u003c/b>으로 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":76,"text":"오늘 문제들을 풀면서 동사의 타동성과 주어의 수를 먼저 확인하는 습관이 얼마나 중요한지 알 수 있었어요. 특히 discuss나 await처럼 목적어를 바로 받는 동사, a number of 뒤의 복수 동사, the homeless처럼 복수로 보는 표현을 꼭 기억해 주세요. 다음 시간에도 이 기준을 먼저 떠올리면서 문제를 풀어 봅시다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
