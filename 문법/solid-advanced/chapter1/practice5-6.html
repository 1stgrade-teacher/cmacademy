.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 1 Basic Practice (포인트 5-6)","audioDir":"practice5-6_audio","preview":false,"count":79,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조건·시간 부사절의 시제, 수동태, 특정 과거 시점, 자동사 구분\u003c/div>\u003ch1>Chapter 1 Basic Practice 포인트 5-6 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 첫 번째 챕터의 기본 연습 문제를 함께 풀어 볼 거예요. 조건과 시간 부사절, 수동태, 시제, 자동사 구분이 핵심이니 주어와 동사의 관계를 중심으로 들어 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">시간·조건 부사절의 현재시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시간·조건을 나타내는 접속사 if, when, until절에서는 미래의 일이라도 \u003cb class=\"key\">현재시제\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">if/until + 주어 + 현재동사, 주절 + will/may/can\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>if가 '만약'이면 조건 부사절\u003c/li>\u003cli>until은 '~할 때까지' 시간 부사절\u003c/li>\u003cli>주절의 미래 표현은 그대로 둔다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If it \u003cspan class=\"fx\">rains\u003c/span> tomorrow, we will stay home.\u003c/div>\u003cdiv class=\"g-ko\">내일 비가 오면 우리는 집에 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Wait until he \u003cspan class=\"fx\">comes\u003c/span> back.\u003c/div>\u003cdiv class=\"g-ko\">그가 돌아올 때까지 기다려라.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"시간과 조건을 나타내는 if, when, until절은 앞으로의 일을 말해도 현재시제를 씁니다. 주절에는 will이나 can 같은 미래 표현이 와도 괜찮아요. 쉽게 말해 조건절 안에서는 will을 쓰지 않는다고 기억하면 됩니다. 예를 들어 내일 비가 오면이라고 할 때 if it rains tomorrow처럼 rains를 써요. until도 마찬가지로 until he comes back처럼 현재시제를 씁니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If you \u003cspan class=\"p-box\">\u003cspan>have\u003c/span>\u003ci>/\u003c/i>\u003cspan>will have\u003c/span>\u003c/span> any questions, please visit www.rocky4.info.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">have\u003c/div>\u003cdiv class=\"p-op\">will have\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">have\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 if절 안의 시제를 고르는 문제예요. if가 어떤 의미로 쓰였는지부터 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 have예요. 조건을 나타내는 if절에서는 미래의 일도 현재시제로 쓰기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">If you \u003cspan class=\"p-box\">\u003cspan class=\"ok\">have\u003c/span>\u003ci>/\u003c/i>\u003cspan>will have\u003c/span>\u003c/span> any questions, please visit www.rocky4.info.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">have\u003c/div>\u003cdiv class=\"p-op\">will have\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">if절 확인\u003c/b>조건의 if절에서는 미래의 일도 \u003cb class=\"key\">현재시제\u003c/b>로 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주절 확인\u003c/b>주절은 please visit로 명령문이라 미래 의미를 이미 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>will have는 조건의 if절에 쓰기 어렵고, have가 문법적으로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 have\u003c/span>\u003cdiv class=\"p-full\">If you have any questions, please visit www.rocky4.info.\u003c/div>\u003cdiv class=\"p-ko\">질문이 있으면 www.rocky4.info를 방문하세요.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>미래 의미라고 무조건 will을 쓰면 안 됩니다.\u003c/div>","segs":[{"n":6,"text":"먼저 if절을 봐요. 여기서 if는 만약이라는 조건을 나타내죠. 그래서 미래 일이라도 현재시제 have를 씁니다.","hl":"st-0"},{"n":7,"text":"주절은 please visit라는 명령문이에요. 조건절에는 will을 넣지 않고 현재시제로 맞춰 줍니다.","hl":"st-1"},{"n":8,"text":"will have는 여기서 조건을 나타내는 if절에 쓰기 어렵습니다. 그래서 have가 정답입니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 미래 의미라고 무조건 will을 쓰면 안 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">능동태와 수동태의 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 동작을 하면 \u003cb class=\"key\">능동태\u003c/b>, 주어가 동작을 당하면 \u003cb class=\"key\">be동사 + 과거분사\u003c/b>의 수동태를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">능동: 주어 + 동사 + 목적어 / 수동: 주어 + be동사 + 과거분사 + by 행위자\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 주어 자리로 오면 수동태\u003c/li>\u003cli>시제는 be동사로, 의미는 과거분사로\u003c/li>\u003cli>문맥상 주어가 하는 일인지 당하는 일인지 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The letter \u003cspan class=\"fx\">was written\u003c/span> by Tom.\u003c/div>\u003cdiv class=\"g-ko\">그 편지는 톰에 의해 쓰였다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Tom \u003cspan class=\"fx\">wrote\u003c/span> the letter.\u003c/div>\u003cdiv class=\"g-ko\">톰이 그 편지를 썼다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"수동태는 주어가 어떤 동작을 당할 때 씁니다. 형태는 be동사 뒤에 과거분사를 붙이면 되고, 시제는 be동사가 보여 줍니다. 예를 들어 편지가 쓰였다고 할 때는 the letter was written처럼 써요. 반대로 톰이 편지를 썼다고 하면 톰이 동작을 직접 하므로 능동태로 씁니다. 그래서 문제를 풀 때는 주어가 하는 쪽인지 당하는 쪽인지 먼저 판단해야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">T-shirts and mugs \u003cspan class=\"p-box\">\u003cspan>gave\u003c/span>\u003ci>/\u003c/i>\u003cspan>were given\u003c/span>\u003c/span> to those who attended this event.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">gave\u003c/div>\u003cdiv class=\"p-op\">were given\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were given\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 주어가 무엇을 받는지, 즉 수동의 의미인지 확인하는 문제예요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 were given이에요. 티셔츠와 머그잔은 주는 대상이므로 수동태 were given을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">T-shirts and mugs \u003cspan class=\"p-box\">\u003cspan>gave\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">were given\u003c/span>\u003c/span> to those who attended this event.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">gave\u003c/div>\u003cdiv class=\"p-op\">were given\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어와 동사 관계\u003c/b>T-shirts and mugs는 \u003cb class=\"key\">주어진\u003c/b> 대상이므로 수동태가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">수동태 형태\u003c/b>복수 주어라 be동사는 were, give의 과거분사 given을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">선택지 비교\u003c/b>gave는 능동, were given은 수동으로 문맥에 맞는 것은 were given입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 were given\u003c/span>\u003cdiv class=\"p-full\">T-shirts and mugs were given to those who attended this event.\u003c/div>\u003cdiv class=\"p-ko\">티셔츠와 머그잔은 이 행사에 참석한 사람들에게 주어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어가 무엇을 하는지가 아니라 무엇을 당하는지 보세요.\u003c/div>","segs":[{"n":14,"text":"주어인 T-shirts and mugs를 봐요. 이들은 무언가를 주는 쪽이 아니라 주어지는 대상이에요. 그래서 수동태가 필요합니다.","hl":"st-0"},{"n":15,"text":"주어가 복수이므로 be동사는 were를 씁니다. give의 과거분사 given을 붙여서 were given이 됩니다.","hl":"st-1"},{"n":16,"text":"gave는 주어가 직접 준다는 능동의 의미입니다. 문맥상 티셔츠와 머그잔이 주어지는 대상이므로 were given이 맞습니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. 주어가 무엇을 하는지가 아니라 무엇을 당하는지 보세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">특정 과거 시점과 과거시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">in 2006, in 2002처럼 \u003cb class=\"key\">특정 과거 시점\u003c/b>을 나타내는 표현이 있으면 현재완료 대신 \u003cb class=\"key\">과거시제\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">특정 과거 시점 + 주어 + 과거동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>현재완료는 정확한 과거 시점과 함께 쓰지 않는다\u003c/li>\u003cli>과거 수동태는 was/were + p.p.\u003c/li>\u003cli>문장 속 연도와 시간 표현을 먼저 찾는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">graduated\u003c/span> in 2010.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 이천십 년에 졸업했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The event \u003cspan class=\"fx\">was held\u003c/span> in 2006.\u003c/div>\u003cdiv class=\"g-ko\">그 행사는 이천육 년에 열렸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"영어에서 특정 과거 시점이 있으면 그 문장은 과거시제를 씁니다. 대표적으로 in 이천육 년, in 이천이 년 같은 표현이 있어요. 이때 현재완료를 쓰면 어색하거나 틀린 문장이 됩니다. 수동태라면 was held나 were given처럼 과거형 be동사를 써야 해요. 문제에서 연도나 과거 시간 표현을 먼저 찾는 습관을 들이세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He didn't know that the 2002 World Cup \u003cspan class=\"p-box\">\u003cspan>was\u003c/span>\u003ci>/\u003c/i>\u003cspan>has been\u003c/span>\u003c/span> held in Asia.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">was\u003c/div>\u003cdiv class=\"p-op\">has been\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">was\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 과거를 나타내는 표현과 수동태를 함께 보는 문제예요. 월드컵이 열린 시점을 찾아보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 was예요. 이천이 년이라는 특정 과거 시점이 있고 월드컵은 열리는 대상이므로 과거 수동태 was held를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He didn't know that the 2002 World Cup \u003cspan class=\"p-box\">\u003cspan class=\"ok\">was\u003c/span>\u003ci>/\u003c/i>\u003cspan>has been\u003c/span>\u003c/span> held in Asia.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">was\u003c/div>\u003cdiv class=\"p-op\">has been\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">과거 시점 찾기\u003c/b>2002라는 \u003cb class=\"key\">특정 과거 시점\u003c/b>이 있으므로 과거시제가 필요합니다.\ 달라지다'는 능동이 맞습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Margaret Knight \u003cu class=\"p-u\">has entered\u003c/u> the National Inventors Hall of Fame in 2006.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">entered\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"다섯 번째 문제는 밑줄 친 시제가 시간 표현과 맞는지 확인하는 문제예요. 문장 끝의 연도를 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":7},{"n":35,"text":"정답은 entered예요. 이천육 년이라는 특정 과거 시점이 있으므로 현재완료가 아니라 과거시제를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Margaret Knight \u003cu class=\"p-u\">has entered\u003c/u> the National Inventors Hall of Fame in 2006.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>in 2006은 \u003cb class=\"key\">특정 과거 시점\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 판단\u003c/b>현재완료 has entered는 특정 과거 시점과 함께 쓰지 않고 \u003cb class=\"key\">과거시제\u003c/b> entered를 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>Margaret Knight entered the National Inventors Hall of Fame in 2006으로 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 entered\u003c/span>\u003cdiv class=\"p-full\">Margaret Knight entered the National Inventors Hall of Fame in 2006.\u003c/div>\u003cdiv class=\"p-ko\">마거릿 나이트는 2006년에 전국 발명가 명예의 전당에 헌액되었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>in 2006 같은 과거 시점이 있는데 현재완료를 쓰면 틀립니다.\u003c/div>","segs":[{"n":36,"text":"문장 끝에 이천육 년이라는 특정 과거 시점이 보여요. 이 표현이 시제를 결정하는 중요한 단서입니다.","hl":"st-0"},{"n":37,"text":"현재완료는 정확한 과거 시점과 함께 쓰지 않습니다. 그래서 has entered를 과거시제 entered로 고쳐야 해요.","hl":"st-1"},{"n":38,"text":"고친 문장은 Margaret Knight entered the National Inventors Hall of Fame in 2006이 됩니다. 과거에 일어난 일을 과거시제로 깔끔하게 표현했어요.","hl":"st-2"},{"n":39,"text":"이 문제의 함정도 짚고 갈게요. in 2006 같은 과거 시점이 있는데 현재완료를 쓰면 틀립니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">if의 의미 구분: 조건과 whether\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if가 '만약'이면 \u003cb class=\"key\">조건 부사절\u003c/b>이라 현재시제를 쓰지만, wonder if처럼 '~인지 아닌지'이면 \u003cb class=\"key\">명사절\u003c/b>이라 미래시제 will을 쓸 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">조건 if + 현재시제 / wonder if + 미래시제 가능\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>조건의 if절에는 will을 쓰지 않는다\u003c/li>\u003cli>wonder, ask 뒤의 if는 whether 의미\u003c/li>\u003cli>명사절 안에서는 미래 일을 will로 표현 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wonder if he \u003cspan class=\"fx\">will come\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그가 올지 궁금하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">If he \u003cspan class=\"fx\">comes\u003c/span>, we will start.\u003c/div>\u003cdiv class=\"g-ko\">그가 오면 우리는 시작할 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"if는 두 가지 얼굴을 가지고 있어요. 만약이라는 조건을 나타낼 때는 if절 안에 현재시제를 씁니다. 그런데 wonder if처럼 인지 아닌지를 뜻할 때는 if가 명사절을 이끌기 때문에 미래 일을 will로 표현할 수 있어요. 그래서 wonder if they will accept는 문법적으로 맞는 표현입니다. if의 의미가 조건인지 아닌지부터 확인하는 습관이 중요합니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사의 수동형 being p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동명사가 수동의 의미를 가지면 \u003cb class=\"key\">being + 과거분사\u003c/b> 형태로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + being + 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>being cared for는 '돌봄을 받는 것'\u003c/li>\u003cli>전치사 for의 목적어로 being이 온다\u003c/li>\u003cli>accept 뒤 목적어로 동명사 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He enjoys \u003cspan class=\"fx\">being praised\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 칭찬받는 것을 즐긴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is afraid of \u003cspan class=\"fx\">being misunderstood\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 오해받는 것을 두려워한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"동명사가 수동의 의미를 가질 때는 being 뒤에 과거분사를 붙입니다. 예를 들어 칭찬받는 것은 being praised, 돌봄을 받는 것은 being cared for처럼 표현해요. accept는 뒤에 동명사를 목적어로 받을 수 있으므로 accept being cared for가 자연스럽습니다. 이 표현은 주어가 돌봄을 받는 입장이라는 수동의 의미를 담고 있습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">We wonder if they \u003cu class=\"p-u\">will accept\u003c/u> being cared for by the staff.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":42,"text":"여섯 번째 문제는 if의 의미를 구분하는 문제예요. wonder 뒤의 if가 조건인지 아닌지 확인해 보세요.","hl":"q"},{"n":43,"text":"","hl":"q","pause":7},{"n":44,"text":"정답은 맞아요. 여기서 if는 인지 아닌지를 뜻하는 명사절이라 will accept가 가능하고, being cared for도 수동 동명사로 알맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">We wonder if they \u003cu class=\"p-u\">will accept\u003c/u> being cared for by the staff.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">if의 의미\u003c/b>wonder if는 '~인지 아닌지'라는 \u003cb class=\"key\">명사절\u003c/b>이므로 조건의 if가 아닙니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">미래시제 가능\u003c/b>명사절 안에서는 미래 일을 \u003cb class=\"key\">will\u003c/b>로 표현할 수 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">동명사 확인\u003c/b>accept 뒤에는 동명사 being cared for가 목적어로 와서 문법적으로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">We wonder if they will accept being cared for by the staff.\u003c/div>\u003cdiv class=\"p-ko\">우리는 그들이 직원들에 의해 돌봄을 받는 것을 받아들일지 궁금하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>조건의 if절이라고 착각해 will을 지우면 안 됩니다.\u003c/div>","segs":[{"n":45,"text":"wonder if를 보면 만약이라는 조건이 아니라 인지 아닌지를 묻는 표현이에요. 그래서 if절이 명사절로 쓰였습니다.","hl":"st-0"},{"n":46,"text":"명사절 안에서는 미래의 일을 will로 표현할 수 있습니다. 그래서 will accept는 문법적으로 문제가 없어요.","hl":"st-1"},{"n":47,"text":"accept 뒤에 being cared for가 목적어로 왔습니다. 이는 돌봄을 받는 것이라는 수동 동명사로 알맞은 형태입니다.","hl":"st-2"},{"n":48,"text":"이 문제의 함정도 짚고 갈게요. 조건의 if절이라고 착각해 will을 지우면 안 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태로 쓸 수 없는 자동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">belong, seem, rise, respond처럼 \u003cb class=\"key\">자동사\u003c/b>는 목적어를 가지지 않아 수동태로 쓸 수 없습니다.\u003cdiv>\u003cspan class=\"g-formula\">자동사 + 전치사 + 목적어 / 수동태 불가\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>belong to는 능동으로 belong to\u003c/li>\u003cli>seem은 2형식 동사라 be seemed 불가\u003c/li>\u003cli>rise는 자동사라 be risen 불가\u003c/li>\u003cli>respond to도 능동으로 respond to\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">belong\u003c/span> to the cat family.\u003c/div>\u003cdiv class=\"g-ko\">그들은 고양이과에 속한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Prices \u003cspan class=\"fx\">rise\u003c/span> every year.\u003c/div>\u003cdiv class=\"g-ko\">가격은 매년 오른다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"자동사는 목적어를 가지지 않기 때문에 수동태로 만들 수 없습니다. belong은 belong to로, respond는 respond to로, rise는 그냥 rise로 씁니다. seem도 be seemed처럼 수동태로 쓰지 않고 주어 뒤에 바로 seem을 써요. 그래서 are belonged, are seemed, be risen, are not responded가 보이면 자동사를 잘못 수동태로 만든 것은 아닌지 의심해야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Wild animals such as tigers, cheetahs, and leopards \u003cu class=\"p-u\">are belonged\u003c/u> to the cat family.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">belong\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":50,"text":"일곱 번째 문제는 밑줄 친 동사가 수동태로 쓸 수 있는 동사인지 보는 문제예요.","hl":"q"},{"n":51,"text":"","hl":"q","pause":7},{"n":52,"text":"정답은 belong이에요. belong은 자동사라서 수동태로 만들 수 없고, 복수 주어에 맞춰 현재시제 belong을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Wild animals such as tigers, cheetahs, and leopards \u003cu class=\"p-u\">are belonged\u003c/u> to the cat family.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 성질 확인\u003c/b>belong은 '속하다'라는 \u003cb class=\"key\">자동사\u003c/b>라서 수동태로 쓸 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">수동태 오류\u003c/b>are belonged는 be동사 + 과거분사 형태지만 belong은 타동사가 아니므로 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">고친 형태\u003c/b>주어가 복수라 현재시제 \u003cb class=\"key\">belong\u003c/b>을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 belong\u003c/span>\u003cdiv class=\"p-full\">Wild animals such as tigers, cheetahs, and leopards belong to the cat family.\u003c/div>\u003cdiv class=\"p-ko\">호랑이, 치타, 표범 같은 야생 동물은 고양이과에 속한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>belong to를 'be belonged to'로 쓰는 실수가 많습니다.\u003c/div>","segs":[{"n":53,"text":"belong은 속하다라는 뜻을 가진 자동사예요. 자동사는 목적어를 가지지 않으므로 수동태로 만들 수 없습니다.","hl":"st-0"},{"n":54,"text":"are belonged는 형태만 보면 수동태처럼 보입니다. 하지만 belong은 타동사가 아니어서 이렇게 쓸 수 없어요.","hl":"st-1"},{"n":55,"text":"주어인 Wild animals가 복수이므로 현재시제 belong을 씁니다. belong to the cat family로 고치면 됩니다.","hl":"st-2"},{"n":56,"text":"이 문제의 함정도 짚고 갈게요. belong to를 'be belonged to'로 쓰는 실수가 많습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Poetry \u003cu class=\"p-u\">is considered\u003c/u> to be an easy and useful means of expressing emotions.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":57,"text":"여덟 번째 문제는 consider의 수동태 표현이 알맞은지 확인하는 문제예요.","hl":"q"},{"n":58,"text":"","hl":"q","pause":7},{"n":59,"text":"정답은 맞아요. 시는 여겨지는 대상이므로 is considered to be 형태가 알맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Poetry \u003cu class=\"p-u\">is considered\u003c/u> to be an easy and useful means of expressing emotions.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">수동태 판단\u003c/b>Poetry는 consider되는 대상이므로 \u003cb class=\"key\">수동태\u003c/b> is considered가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">consider 구문\u003c/b>consider A to be B는 'A를 B라고 여기다'이고 수동태로 쓰면 A is considered to be B가 됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">전체 확인\u003c/b>to be an easy and useful means of expressing emotions까지 문법적으로 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">Poetry is considered to be an easy and useful means of expressing emotions.\u003c/div>\u003cdiv class=\"p-ko\">시는 감정을 표현하는 쉽고 유용한 수단으로 여겨진다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>consider를 수동태로 쓸 때 to be를 빠뜨리지 않도록 주의하세요.\u003c/div>","segs":[{"n":60,"text":"주어인 Poetry는 사람들이 여기는 대상이에요. 그래서 수동태 is considered가 필요합니다.","hl":"st-0"},{"n":61,"text":"consider는 목적어를 어떤 상태라고 여긴다는 뜻으로 씁니다. 수동태로 바꾸면 is considered to be 형태가 됩니다.","hl":"st-1"},{"n":62,"text":"뒤에 to be an easy and useful means of expressing emotions가 이어집니다. 전체적으로 문법에 맞고 의미도 자연스럽습니다.","hl":"st-2"},{"n":63,"text":"이 문제의 함정도 짚고 갈게요. consider를 수동태로 쓸 때 to be를 빠뜨리지 않도록 주의하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">It is reported that 수동태 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">It is reported that ...는 '...라고 보고된다'라는 뜻으로, that절 내용을 뒤에 두고 \u003cb class=\"key\">가주어 It\u003c/b>을 쓰는 수동태 구문입니다.\u003cdiv>\u003cspan class=\"g-formula\">It is/has been reported that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>report는 타동사라 수동태 가능\u003c/li>\u003cli>It은 가주어, that절이 진주어\u003c/li>\u003cli>현재완료 수동은 has been reported\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It \u003cspan class=\"fx\">is said\u003c/span> that he is honest.\u003c/div>\u003cdiv class=\"g-ko\">그가 정직하다고 말해진다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It \u003cspan class=\"fx\">has been reported\u003c/span> that the plan changed.\u003c/div>\u003cdiv class=\"g-ko\">그 계획이 바뀌었다고 보고되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":64,"text":"It is reported that은 어떤 내용이 사람들에게 보고된다는 뜻을 가진 수동태 구문입니다. 여기서 it은 진짜 주어가 아니라 that절 내용을 받쳐 주는 가주어예요. 그래서 report가 타동사로서 수동태가 되면 is reported나 has been reported 형태로 씁니다. 문제처럼 It has reported that이라고 쓰면 보고하는 주체가 it이라는 뜻이 되어 문맥에 맞지 않습니다. 이 구문은 It has been reported that으로 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Things are changing. It (1) \u003cu class=\"p-u\">has reported\u003c/u> that 62 percent of jobs in America will be in danger due to advances in automation. You might say that the numbers (2) \u003cu class=\"p-u\">are seemed\u003c/u> a bit unrealistic, but the threat is real. One fast food franchise has a robot that can flip a burger in ten seconds. It is just a simple task but the robot could (3) \u003cu class=\"p-u\">be replaced\u003c/u> an entire crew.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) has been reported (2) seem (3) replace\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":65,"text":"이번 지문 문제는 밑줄 친 세 부분을 모두 어법에 맞게 고치는 문제예요. 먼저 주어와 동사의 관계를 하나씩 보세요.","hl":"q"},{"n":66,"text":"","hl":"q","pause":7},{"n":67,"text":"정답은 첫째, has been reported, 둘째, seem, 셋째, replace예요. report는 수동태, seem은 자동사, robot은 대체하는 주체라는 점을 기억하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Things are changing. It (1) \u003cu class=\"p-u\">has reported\u003c/u> that 62 percent of jobs in America will be in danger due to advances in automation. You might say that the numbers (2) \u003cu class=\"p-u\">are seemed\u003c/u> a bit unrealistic, but the threat is real. One fast food franchise has a robot that can flip a burger in ten seconds. It is just a simple task but the robot could (3) \u003cu class=\"p-u\">be replaced\u003c/u> an entire crew.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>report는 타동사이고 that절 내용이 보고되는 대상이므로 \u003cb class=\"key\">It has been reported that\u003c/b> 구문이 됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>seem은 \u003cb class=\"key\">자동사\u003c/b>라 수동태 are seemed로 쓸 수 없고 주어 numbers에 맞춰 seem입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>robot이 an entire crew를 \u003cb class=\"key\">대체하는\u003c/b> 주체이므로 could replace가 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) has been reported (2) seem (3) replace\u003c/span>\u003cdiv class=\"p-full\">Things are changing. It has been reported that 62 percent of jobs in America will be in danger due to advances in automation. You might say that the numbers seem a bit unrealistic, but the threat is real. One fast food franchise has a robot that can flip a burger in ten seconds. It is just a simple task but the robot could replace an entire crew.\u003c/div>\u003cdiv class=\"p-ko\">사물은 변화하고 있다. 미국 일자리의 62퍼센트가 자동화의 발전 때문에 위험에 처할 것이라고 보고되었다. 그 수치가 조금 비현실적으로 보인다고 말할 수도 있지만 위협은 현실이다. 한 패스트푸드 프랜차이즈에는 십 초 만에 버거를 뒤집는 로봇이 있다. 단순한 작업이지만 그 로봇은 전체 직원을 대체할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>seem, belong, rise, respond처럼 자동사는 수동태로 쓰지 않습니다.\u003c/div>","segs":[{"n":68,"text":"첫째, It has reported that을 봐요. 여기서는 어떤 내용이 보고되는 것이므로 report를 수동태로 만들어야 합니다. 그래서 has been reported가 맞습니다.","hl":"st-0"},{"n":69,"text":"둘째, are seemed를 봐요. seem은 스스로 여겨지는 상태를 나타내는 자동사라서 수동태로 쓸 수 없습니다. 주어가 복수이므로 현재시제 seem을 씁니다.","hl":"st-1"},{"n":70,"text":"셋째, could be replaced를 봐요. 문맥상 로봇이 전체 직원을 대체하는 주체입니다. 그래서 수동태가 아니라 능동태 could replace를 씁니다.","hl":"st-2"},{"n":71,"text":"이 문제의 함정도 짚고 갈게요. seem, belong, rise, respond처럼 자동사는 수동태로 쓰지 않습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">If countries (1) \u003cu class=\"p-u\">are not responded\u003c/u> to climate change, the consequences will be severe. CO2 emissions will reach 5,000 gigatons, and CO2 concentrations will jump to toxic levels of over 1900-2000 ppm. Temperatures will increase by 6-9°C, and sea levels will (2) \u003cu class=\"p-u\">be risen\u003c/u> by 70 meters. These changes will continue until the Earth (3) \u003cu class=\"p-u\">will cool down\u003c/u> and reaches today's levels—500,000 years from now.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) do not respond (2) rise (3) cools down\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":72,"text":"마지막 지문 문제는 자동사와 시간 부사절을 함께 확인하는 문제예요. 각 밑줄 앞의 주어와 의미를 보세요.","hl":"q"},{"n":73,"text":"","hl":"q","pause":7},{"n":74,"text":"정답은 첫째, do not respond, 둘째, rise, 셋째, cools down이에요. respond와 rise는 자동사이고 until절에서는 현재시제를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">If countries (1) \u003cu class=\"p-u\">are not responded\u003c/u> to climate change, the consequences will be severe. CO2 emissions will reach 5,000 gigatons, and CO2 concentrations will jump to toxic levels of over 1900-2000 ppm. Temperatures will increase by 6-9°C, and sea levels will (2) \u003cu class=\"p-u\">be risen\u003c/u> by 70 meters. These changes will continue until the Earth (3) \u003cu class=\"p-u\">will cool down\u003c/u> and reaches today's levels—500,000 years from now.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>respond는 '반응하다'라는 \u003cb class=\"key\">자동사\u003c/b>라 수동태 are not responded가 아니라 do not respond입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>rise는 '오르다'라는 \u003cb class=\"key\">자동사\u003c/b>라 will be risen이 아니라 will rise입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>until은 \u003cb class=\"key\">시간 부사절\u003c/b>이라 미래의 일도 현재시제 cools down으로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) do not respond (2) rise (3) cools down\u003c/span>\u003cdiv class=\"p-full\">If countries do not respond to climate change, the consequences will be severe. CO2 emissions will reach 5,000 gigatons, and CO2 concentrations will jump to toxic levels of over 1900-2000 ppm. Temperatures will increase by 6-9°C, and sea levels will rise by 70 meters. These changes will continue until the Earth cools down and reaches today's levels—500,000 years from now.\u003c/div>\u003cdiv class=\"p-ko\">국가들이 기후 변화에 대응하지 않으면 결과는 심각할 것이다. 이산화탄소 배출량은 오천 기가톤에 이르고, 이산화탄소 농도는 독성 수준인 천구백에서 이천 피피엠을 넘어설 것이다. 기온은 육에서 구 도씨까지 오르고, 해수면은 칠십 미터까지 상승할 것이다. 이런 변화는 지구가 식어서 오늘날의 수준에 도달할 때까지 계속될 것이다. 그것은 지금으로부터 오십만 년 후의 일이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>자동사 respond와 rise를 수동태로 만들지 말고, 시간 부사절에서는 will을 쓰지 않도록 주의하세요.\u003c/div>","segs":[{"n":75,"text":"첫째, are not responded를 봐요. respond는 반응하다라는 자동사라서 수동태로 만들 수 없습니다. 그래서 do not respond로 고칩니다.","hl":"st-0"},{"n":76,"text":"둘째, will be risen을 봐요. rise는 스스로 오르는 자동사라서 수동태로 쓰지 않습니다. 그래서 will rise가 맞습니다.","hl":"st-1"},{"n":77,"text":"셋째, until the Earth will cool down을 봐요. until은 때까지라는 시간 부사절을 이끌기 때문에 미래 일도 현재시제로 씁니다. 그래서 cools down으로 고칩니다.","hl":"st-2"},{"n":78,"text":"이 문제의 함정도 짚고 갈게요. 자동사 respond와 rise를 수동태로 만들지 말고, 시간 부사절에서는 will을 쓰지 않도록 주의하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조건·시간 부사절의 시제, 수동태, 특정 과거 시점, 자동사 구분\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>조건·시간 부사절에서는 미래 의미라도 \u003cb class=\"key\">현재시제\u003c/b>를 씁니다.\u003c/li>\u003cli>주어가 동작을 당하면 \u003cb class=\"key\">be동사 + 과거분사\u003c/b>의 수동태를 씁니다.\u003c/li>\u003cli>특정 과거 시점이 있으면 \u003cb class=\"key\">현재완료\u003c/b> 대신 \u003cb class=\"key\">과거시제\u003c/b>를 씁니다.\u003c/li>\u003cli>belong, seem, rise, respond 같은 \u003cb class=\"key\">자동사\u003c/b>는 수동태로 쓰지 않습니다.\u003c/li>\u003cli>wonder if의 if는 \u003cb class=\"key\">whether\u003c/b> 의미라 미래시제 \u003cb class=\"key\">will\u003c/b>이 가능합니다.\u003c/li>\u003c/ul>","segs":[{"n":79,"text":"오늘은 조건과 시간 부사절의 시제, 수동태, 특정 과거 시점의 시제, 자동사의 수동태 불가를 중심으로 풀었어요. 특히 if가 조건인지 아닌지 구분하는 것과 자동사를 수동태로 만들지 않는 것이 중요합니다. 복습할 때는 주어와 동사의 관계를 먼저 표시하면서 다시 풀어 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
