window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"접속사 that","title":"Chapter 1 출제 포인트 3 자동사 vs. 타동사","audioDir":"point3_audio","preview":false,"count":44,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 1 출제 포인트 3 자동사 vs. 타동사\u003c/div>\u003ch1>자동사 vs. 타동사 — 목적어와 전치사 하나로 갈리는 어법 포인트\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>동사 뒤에 목적어가 필요한지, 전치사가 필요한지를 판단하여 어법 문제를 정확하게 풀 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter 1의 출제 포인트, 자동사와 타동사를 함께 공부할 거예요. 영어 동사는 뒤에 목적어가 필요한지 아닌지에 따라 두 종류로 나뉘는데요. 이 차이만 확실히 잡아 두어도 어법 문제에서 전치사 하나 때문에 틀리는 일이 확 줄어듭니다. 오늘은 개념 설명과 예문, 그리고 문제 여섯 개로 아주 확실하게 정리해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">자동사와 타동사의 기본 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사 뒤에 \u003cb class=\"key\">목적어\u003c/b>가 반드시 필요한 동사를 \u003cb class=\"key\">타동사\u003c/b>라고 하고, 목적어 없이도 문장이 완성되는 동사를 \u003cb class=\"key\">자동사\u003c/b>라고 합니다. 같은 동사라도 뒤에 무엇이 오는지를 보고 자동사인지 타동사인지 판단합니다.\u003cdiv>\u003cspan class=\"g-formula\">자동사: 주어 + 동사 (문장 완성) / 타동사: 주어 + 동사 + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Birds \u003cspan class=\"fx\">fly\u003c/span> high in the sky.\u003c/div>\u003cdiv class=\"g-ko\">새들은 하늘 높이 난다.\u003c/div>\u003cdiv class=\"g-note\">fly 뒤에 목적어가 없고 부사구만 왔으므로 fly는 자동사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">bought a new bike\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 새 자전거를 한 대 샀다.\u003c/div>\u003cdiv class=\"g-note\">bought 뒤에 목적어 a new bike가 와야 뜻이 완성되므로 bought는 타동사입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>한 문장을 볼 때 동사 뒤에 \u003cb class=\"key\">목적어\u003c/b>가 있는지부터 확인하세요. 목적어가 없으면 그 동사는 \u003cb class=\"key\">자동사\u003c/b>입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 가장 기본부터 볼게요. 동사 뒤에 목적어가 꼭 필요한 동사를 타동사라고 하고, 목적어가 없어도 문장이 완성되는 동사를 자동사라고 합니다. 예를 들어 새들은 난다는 Birds fly라고만 해도 문장이 다 되죠. 그런데 그는 자전거를 샀다는 말은 목적어 없이는 뜻이 완성되지 않아요. 그래서 문장을 볼 때 동사 뒤에 무엇이 오는지를 먼저 보는 습관이 중요합니다.","hl":"rule"},{"n":3,"text":"Birds fly high in the sky. 새들은 하늘 높이 난다, 라는 뜻이에요. 여기서 fly 뒤에는 목적어가 없고 high in the sky라는 부사구만 왔죠. 이렇게 목적어 없이도 문장이 완성되면 fly는 자동사입니다.","hl":"ex-0"},{"n":4,"text":"He bought a new bike. 그는 새 자전거를 한 대 샀다, 라는 뜻이에요. bought 뒤에 a new bike라는 목적어가 와야 뜻이 완성되죠. 이렇게 목적어를 꼭 데리고 다니는 동사가 타동사입니다.","hl":"ex-1"},{"n":5,"text":"문제를 풀 때는 동사 뒤에 목적어가 있는지부터 눈으로 확인해 보세요. 목적어가 없으면 자동사, 있으면 타동사라고 생각하면 아주 쉽게 정리됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">자동사는 목적어 앞에 전치사가 필요하다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">자동사는 목적어를 가지려면 반드시 \u003cb class=\"key\">전치사\u003c/b>의 도움을 받아야 합니다. arrive at, listen to, reply to, wait for처럼 자동사와 \u003cb class=\"key\">전치사\u003c/b>가 붙어 다니는 표현은 한 덩어리로 외워야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">자동사 + 전치사 + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We \u003cspan class=\"fx\">arrived at\u003c/span> the airport at noon.\u003c/div>\u003cdiv class=\"g-ko\">우리는 정오에 공항에 도착했다.\u003c/div>\u003cdiv class=\"g-note\">arrive는 자동사라 목적어 앞에 전치사 at을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">listens to\u003c/span> music every night.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 매일 밤 음악을 듣는다.\u003c/div>\u003cdiv class=\"g-note\">listen은 자동사라 목적어 music 앞에 전치사 to가 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">replied to\u003c/span> my email right away.\u003c/div>\u003cdiv class=\"g-ko\">그는 내 이메일에 곧바로 답장했다.\u003c/div>\u003cdiv class=\"g-note\">reply는 자동사라 목적어 앞에 전치사 to를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>arrive at, listen to, wait for, reply to처럼 자동사와 \u003cb class=\"key\">전치사\u003c/b>가 붙어 다니는 표현은 \u003cb class=\"key\">덩어리\u003c/b>로 외워 두세요.\u003c/div>","segs":[{"n":6,"text":"자동사는 혼자서는 목적어를 가질 수 없어요. 그래서 목적어를 붙이고 싶으면 전치사의 도움을 받아야 합니다. arrive at the airport처럼 arrive 뒤에 at이 붙고, listen to music처럼 listen 뒤에 to가 붙죠. 이런 표현은 자동사와 전치사가 한 덩어리로 굳어 있다고 생각하고 통째로 외워 두면 좋습니다.","hl":"rule"},{"n":7,"text":"We arrived at the airport at noon. 우리는 정오에 공항에 도착했다, 라는 뜻이에요. arrive는 목적어를 바로 받지 못하는 자동사라서 at의 도움을 받아 the airport와 연결됩니다. 이때 at은 공항이나 역처럼 좁은 장소에 쓴다는 점도 같이 기억해 두세요.","hl":"ex-0"},{"n":8,"text":"She listens to music every night. 그녀는 매일 밤 음악을 듣는다, 라는 뜻이에요. listen은 자동사라서 목적어 music을 데려오려면 to가 꼭 필요합니다. to를 빼고 listen music이라고 쓰면 틀린 문장이 되니 주의하세요.","hl":"ex-1"},{"n":9,"text":"He replied to my email right away. 그는 내 이메일에 곧바로 답장했다, 라는 뜻이에요. reply도 자동사라서 목적어 앞에 to를 붙여야 합니다. reply to, 이렇게 두 단어를 한 덩어리로 외워 두면 편해요.","hl":"ex-2"},{"n":10,"text":"이런 표현은 따로따로 외우지 말고 두 단어를 붙여서 덩어리로 외워 보세요. 그러면 시험장에서 전치사를 빠뜨리는 실수가 확실히 줄어듭니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">타동사는 목적어 앞에 전치사를 쓰지 않는다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">타동사는 목적어를 바로 받는 힘이 있어서 목적어 앞에 \u003cb class=\"key\">전치사\u003c/b>를 쓰지 않습니다. discuss, marry, resemble, reach는 목적어를 그대로 데리고 오는 \u003cb class=\"key\">타동사\u003c/b>입니다.\u003cdiv>\u003cspan class=\"g-formula\">타동사 + 목적어 (전치사 없음)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">discussed the problem\u003c/span> for hours.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그 문제를 몇 시간 동안 논의했다.\u003c/div>\u003cdiv class=\"g-note\">discuss는 타동사라 about을 넣지 않고 목적어를 바로 받습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">married a famous doctor\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 유명한 의사와 결혼했다.\u003c/div>\u003cdiv class=\"g-note\">marry는 타동사라 목적어 앞에 with를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">resembles his father\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 그의 아버지를 닮았다.\u003c/div>\u003cdiv class=\"g-note\">resemble은 타동사라 목적어 앞에 전치사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">We \u003cspan class=\"fx\">reached the top\u003c/span> of the mountain.\u003c/div>\u003cdiv class=\"g-ko\">우리는 산꼭대기에 도착했다.\u003c/div>\u003cdiv class=\"g-note\">reach는 타동사라 목적어 앞에 전치사 at이나 to를 쓰지 않습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>discuss, marry, resemble, reach 뒤에 전치사를 습관적으로 붙이면 \u003cb class=\"key\">어법 오류\u003c/b>가 됩니다. 목적어를 바로 받는 \u003cb class=\"key\">타동사\u003c/b>임을 기억하세요.\u003c/div>","segs":[{"n":11,"text":"반대로 타동사는 목적어를 바로 끌어당기는 힘이 있어요. 그래서 목적어 앞에 전치사를 넣으면 오히려 틀린 문장이 됩니다. discuss는 discuss the problem처럼 바로 목적어를 받고, marry도 marry a doctor처럼 전치사 없이 사람을 받습니다. resemble이나 reach도 마찬가지로 전치사를 쓰지 않는다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":12,"text":"They discussed the problem for hours. 그들은 그 문제를 몇 시간 동안 논의했다, 라는 뜻이에요. discuss는 타동사라서 the problem을 바로 받습니다. discuss about the problem처럼 about을 넣으면 틀린 문장이 되니 조심하세요.","hl":"ex-0"},{"n":13,"text":"She married a famous doctor. 그녀는 유명한 의사와 결혼했다, 라는 뜻이에요. 우리말로는 와 결혼하다라고 해서 with가 떠오르지만, marry는 타동사라서 전치사 없이 사람을 바로 받습니다. married with a doctor라고 쓰면 안 됩니다.","hl":"ex-1"},{"n":14,"text":"He resembles his father. 그는 그의 아버지를 닮았다, 라는 뜻이에요. resemble도 타동사라서 his father를 전치사 없이 바로 받습니다. resemble to his father처럼 to를 붙이지 않도록 주의하세요.","hl":"ex-2"},{"n":15,"text":"We reached the top of the mountain. 우리는 산꼭대기에 도착했다, 라는 뜻이에요. reach는 타동사라서 the top을 바로 받고, 도착하다는 뜻이어도 arrive처럼 전치사를 쓰지 않습니다. arrive at과 reach를 헷갈리지 않도록 비교해서 기억해 두세요.","hl":"ex-3"},{"n":16,"text":"우리말에 끌려서 about이나 with를 넣기 쉬운데, 이 네 동사는 전치사 없이 목적어를 바로 받는다고 정리해 두세요. 시험에서는 바로 이 부분을 바꿔서 함정으로 냅니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">헷갈리는 자동사와 타동사 짝 (rise/raise, lie/lay)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">모양이 비슷해서 시험에 자주 나오는 짝이 있습니다. rise는 \u003cb class=\"key\">자동사\u003c/b>로 스스로 오르다라는 뜻이고, raise는 \u003cb class=\"key\">타동사\u003c/b>로 무엇을 올리다라는 뜻입니다. lie는 눕다는 뜻의 \u003cb class=\"key\">자동사\u003c/b>이고, lay는 무엇을 놓다는 뜻의 \u003cb class=\"key\">타동사\u003c/b>입니다.\u003cdiv>\u003cspan class=\"g-formula\">rise - rose - risen (자동사) / raise - raised - raised (타동사) / lie - lay - lain (자동사) / lay - laid - laid (타동사)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The sun \u003cspan class=\"fx\">rises\u003c/span> in the east.\u003c/div>\u003cdiv class=\"g-ko\">해는 동쪽에서 뜬다.\u003c/div>\u003cdiv class=\"g-note\">스스로 오르는 동작이라 목적어가 없는 자동사 rise를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Please \u003cspan class=\"fx\">raise your hand\u003c/span> if you have a question.\u003c/div>\u003cdiv class=\"g-ko\">질문이 있으면 손을 들어 주세요.\u003c/div>\u003cdiv class=\"g-note\">무엇을 올린다는 뜻이라 목적어 your hand가 필요한 타동사 raise입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">lay\u003c/span> on the grass and looked at the sky.\u003c/div>\u003cdiv class=\"g-ko\">그는 풀밭에 누워 하늘을 바라보았다.\u003c/div>\u003cdiv class=\"g-note\">스스로 눕는다는 뜻의 자동사 lie의 과거형 lay입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">laid the book\u003c/span> on the table.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 책을 탁자 위에 놓았다.\u003c/div>\u003cdiv class=\"g-note\">무엇을 놓는다는 뜻이라 목적어가 필요한 타동사 lay의 과거형 laid입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>rise와 raise, lie와 lay는 뜻이 비슷해 보이지만 \u003cb class=\"key\">목적어\u003c/b> 유무로 갈립니다. 목적어가 뒤에 있으면 \u003cb class=\"key\">타동사\u003c/b>인 raise나 lay를 고르세요.\u003c/div>","segs":[{"n":17,"text":"마지막으로 모양이 비슷해서 헷갈리는 짝을 정리할게요. rise는 스스로 오르는 자동사이고, raise는 무엇인가를 올리는 타동사입니다. lie는 스스로 눕는 자동사이고, lay는 무엇인가를 놓는 타동사죠. 해가 뜨는 것과 손을 드는 것은 완전히 다른 동사이고, 소파에 눕는 것과 책을 놓는 것도 다른 동사라는 점을 구분해서 기억해 주세요. 특히 뒤에 목적어가 있으면 raise나 lay를 고른다고 생각하면 됩니다.","hl":"rule"},{"n":18,"text":"The sun rises in the east. 해는 동쪽에서 뜬다, 라는 뜻이에요. 해가 스스로 떠오르는 동작이니까 목적어가 필요 없는 자동사 rise를 씁니다. 뒤에 목적어가 없다는 점을 눈으로 확인해 보세요.","hl":"ex-0"},{"n":19,"text":"Please raise your hand if you have a question. 질문이 있으면 손을 들어 주세요, 라는 뜻이에요. 무엇을 올린다는 뜻이라 목적어 your hand가 필요하죠. 그래서 목적어를 데리고 오는 타동사 raise를 씁니다.","hl":"ex-1"},{"n":20,"text":"He lay on the grass and looked at the sky. 그는 풀밭에 누워 하늘을 바라보았다, 라는 뜻이에요. 여기서 lay는 눕다라는 뜻의 자동사 lie의 과거형입니다. 뒤에 목적어 없이 on the grass라는 전치사구만 왔다는 점을 봐 두세요.","hl":"ex-2"},{"n":21,"text":"She laid the book on the table. 그녀는 책을 탁자 위에 놓았다, 라는 뜻이에요. 무엇을 놓는다는 뜻이라 목적어 the book이 필요하고, 그래서 타동사 lay의 과거형 laid를 씁니다. 눕다의 lay와 놓다의 laid를 소리 내어 구분해 보세요.","hl":"ex-3"},{"n":22,"text":"정리하면 뒤에 목적어가 있으면 raise나 lay, 없으면 rise나 lie입니다. 이 한 줄만 기억해도 이 유형의 문제는 거의 다 맞힐 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I arrived the airport late.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I arrived at the airport late.\u003c/div>\u003cdiv class=\"g-why\">arrive는 자동사라 목적어 앞에 전치사 at이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>We discussed about the issue.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ We discussed the issue.\u003c/div>\u003cdiv class=\"g-why\">discuss는 타동사라 목적어 앞에 전치사 about을 쓰지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She married with him last year.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She married him last year.\u003c/div>\u003cdiv class=\"g-why\">marry는 타동사라 목적어 앞에 전치사 with를 쓰지 않습니다.\u003c/div>\u003c/div>","segs":[{"n":23,"text":"arrive는 목적어를 바로 받지 못하는 자동사예요. 그래서 공항이라는 목적어 앞에 at을 넣어야 합니다. arrive at the airport, 이렇게 덩어리로 기억해 두세요.","hl":"mk-0"},{"n":24,"text":"우리말로는 그 문제에 대해 논의하다라고 해서 about이 자연스럽게 떠오르죠. 하지만 discuss는 타동사라서 about 없이 목적어를 바로 받습니다. discussed the issue, 이렇게 전치사 없이 써야 맞습니다.","hl":"mk-1"},{"n":25,"text":"결혼하다는 말에 with가 따라붙는 것 같지만, marry는 타동사라서 사람을 바로 목적어로 받아요. 그래서 married him이라고 써야 하고, with를 넣으면 틀린 문장이 됩니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>She arrived the airport at six.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>They discussed about the plan.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>He married with a nurse.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>We listened to the radio all night.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>She resembled to her mother.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">We listened to the radio all night.\u003c/span>\u003cdiv class=\"g-exp\">listen은 자동사라 목적어 앞에 전치사 to가 필요합니다. arrive는 arrive at, discuss는 discuss the plan, marry는 marry a nurse, resemble은 resemble her mother처럼 전치사 없이 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"첫 번째 문제입니다. 다음 중 어법상 올바른 문장을 고르는 문제예요. 보기는 다섯 개입니다. 첫 번째, She arrived the airport at six. 두 번째, They discussed about the plan. 세 번째, He married with a nurse. 네 번째, We listened to the radio all night. 다섯 번째, She resembled to her mother. 자, 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 네 번째 보기예요. We listened to the radio all night. listen은 자동사라서 목적어 앞에 to가 꼭 필요하죠. 반대로 arrive는 at을 붙여야 하고, discuss와 marry와 resemble은 전치사 없이 목적어를 바로 받습니다. 그래서 나머지 보기는 모두 틀린 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 전치사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">We arrived ____ the airport at seven.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">at\u003c/span>\u003cdiv class=\"g-exp\">arrive는 자동사라 목적어 앞에 전치사 at을 씁니다. 도시나 나라처럼 넓은 장소에는 in을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"두 번째 문제입니다. 빈칸에 알맞은 전치사를 쓰는 문제예요. We arrived blank the airport at seven. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 at입니다. arrive는 목적어를 바로 받지 못하는 자동사라서 전치사의 도움이 필요해요. 공항이나 역처럼 좁은 장소에는 at을 쓰고, 도시나 나라처럼 넓은 장소에는 in을 쓴다는 점도 함께 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">They discussed about the problem for two hours.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">They discussed the problem for two hours.\u003c/span>\u003cdiv class=\"g-exp\">discuss는 타동사라 목적어 앞에 전치사 about을 쓰지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"세 번째 문제입니다. 문장에서 틀린 부분을 찾아 바르게 고치는 문제예요. They discussed about the problem for two hours. 잠시 멈추고 직접 고쳐 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 about을 빼는 거예요. 그래서 They discussed the problem for two hours가 됩니다. discuss는 타동사라서 목적어를 바로 받고, about을 넣으면 틀린 문장이 돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">she / listens / to / music / every day\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She listens to music every day.\u003c/span>\u003cdiv class=\"g-exp\">listen은 자동사라 목적어 music 앞에 전치사 to가 필요합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"네 번째 문제입니다. 주어진 단어를 모두 사용해 문장을 만드는 문제예요. she, listens, to, music, every day가 주어져 있습니다. 잠시 멈추고 직접 배열해 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 She listens to music every day입니다. listen은 자동사라서 목적어 music 앞에 전치사 to를 꼭 붙여야 합니다. 그래서 매일 음악을 듣는다는 뜻이 되는 거죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 동사의 쓰임이 나머지 넷과 다른 문장은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>The sun rises in the east.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>He bought a new bike.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>My sister married a doctor.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>We reached the top of the mountain.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>She laid the book on the table.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The sun rises in the east.\u003c/span>\u003cdiv class=\"g-exp\">rise는 목적어 없이 쓰인 자동사이고, 나머지 문장의 동사는 모두 목적어를 데리고 있는 타동사입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"다섯 번째 문제입니다. 동사의 쓰임이 나머지 넷과 다른 문장을 고르는 문제예요. 첫 번째, The sun rises in the east. 두 번째, He bought a new bike. 세 번째, My sister married a doctor. 네 번째, We reached the top of the mountain. 다섯 번째, She laid the book on the table. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 첫 번째 보기예요. The sun rises in the east. 여기서 rise는 목적어 없이 쓰인 자동사입니다. 나머지 보기는 bought a new bike, married a doctor, reached the top, laid the book처럼 목적어를 바로 데리고 있는 타동사 문장이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">그들은 그 문제를 두 시간 동안 논의했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">They discussed the problem for two hours.\u003c/span>\u003cdiv class=\"g-exp\">discuss는 타동사라 목적어 앞에 전치사를 쓰지 않습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"여섯 번째 문제입니다. 우리말을 영어로 쓰는 문제예요. 그들은 그 문제를 두 시간 동안 논의했다. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":6},{"n":43,"text":"정답은 They discussed the problem for two hours입니다. discuss는 타동사라서 the problem을 바로 받고, about 같은 전치사는 넣지 않아요. 두 시간 동안은 for two hours로 표현하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 1 출제 포인트 3 자동사 vs. 타동사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>동사 뒤에 \u003cb class=\"key\">목적어\u003c/b>가 필요하면 타동사, 목적어 없이도 완성되면 \u003cb class=\"key\">자동사\u003c/b>입니다.\u003c/li>\u003cli>자동사가 목적어를 가지려면 \u003cb class=\"key\">전치사\u003c/b>가 필요합니다. arrive at, listen to처럼 덩어리로 외웁니다.\u003c/li>\u003cli>discuss, marry, resemble, reach는 \u003cb class=\"key\">타동사\u003c/b>라서 목적어 앞에 전치사를 쓰지 않습니다.\u003c/li>\u003cli>rise와 lie는 \u003cb class=\"key\">자동사\u003c/b>, raise와 lay는 \u003cb class=\"key\">타동사\u003c/b>로 목적어 유무로 구분합니다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":44,"text":"오늘은 자동사와 타동사를 구분하는 기준부터 정리했어요. 동사 뒤에 목적어가 필요하면 타동사, 목적어 없이도 문장이 되면 자동사였죠. 자동사는 목적어를 데려올 때 전치사가 필요하고, discuss나 marry처럼 타동사는 전치사 없이 목적어를 바로 받는다는 점도 꼭 기억해 주세요. 마지막으로 rise와 raise, lie와 lay는 뒤에 목적어가 있는지로 골라 주면 됩니다. 오늘 배운 기준만 있으면 어법 문제에서 전치사 함정은 충분히 피할 수 있어요. 수고 많았습니다.","hl":"sum"}]}],"practice":{"unit":"Chapter 1 출제 포인트 3 자동사 vs. 타동사","level":"고1·2","ctx":"단원: Chapter 1 출제 포인트 3 자동사 vs. 타동사\n강의 제목: 자동사 vs. 타동사 — 목적어와 전치사 하나로 갈리는 어법 포인트\n목표: 동사 뒤에 목적어가 필요한지, 전치사가 필요한지를 판단하여 어법 문제를 정확하게 풀 수 있다.\n개념 1. 자동사와 타동사의 기본 구분: 동사 뒤에 목적어가 반드시 필요한 동사를 타동사라고 하고, 목적어 없이도 문장이 완성되는 동사를 자동사라고 합니다. 같은 동사라도 뒤에 무엇이 오는지를 보고 자동사인지 타동사인지 판단합니다. [자동사: 주어 + 동사 (문장 완성) / 타동사: 주어 + 동사 + 목적어] (주의: 한 문장을 볼 때 동사 뒤에 목적어가 있는지부터 확인하세요. 목적어가 없으면 그 동사는 자동사입니다.)\n  예문: Birds fly high in the sky. (새들은 하늘 높이 난다.) / He bought a new bike. (그는 새 자전거를 한 대 샀다.)\n개념 2. 자동사는 목적어 앞에 전치사가 필요하다: 자동사는 목적어를 가지려면 반드시 전치사의 도움을 받아야 합니다. arrive at, listen to, reply to, wait for처럼 자동사와 전치사가 붙어 다니는 표현은 한 덩어리로 외워야 합니다. [자동사 + 전치사 + 목적어] (주의: arrive at, listen to, wait for, reply to처럼 자동사와 전치사가 붙어 다니는 표현은 덩어리로 외워 두세요.)\n  예문: We arrived at the airport at noon. (우리는 정오에 공항에 도착했다.) / She listens to music every night. (그녀는 매일 밤 음악을 듣는다.) / He replied to my email right away. (그는 내 이메일에 곧바로 답장했다.)\n개념 3. 타동사는 목적어 앞에 전치사를 쓰지 않는다: 타동사는 목적어를 바로 받는 힘이 있어서 목적어 앞에 전치사를 쓰지 않습니다. discuss, marry, resemble, reach는 목적어를 그대로 데리고 오는 타동사입니다. [타동사 + 목적어 (전치사 없음)] (주의: discuss, marry, resemble, reach 뒤에 전치사를 습관적으로 붙이면 어법 오류가 됩니다. 목적어를 바로 받는 타동사임을 기억하세요.)\n  예문: They discussed the problem for hours. (그들은 그 문제를 몇 시간 동안 논의했다.) / She married a famous doctor. (그녀는 유명한 의사와 결혼했다.) / He resembles his father. (그는 그의 아버지를 닮았다.) / We reached the top of the mountain. (우리는 산꼭대기에 도착했다.)\n개념 4. 헷갈리는 자동사와 타동사 짝 (rise/raise, lie/lay): 모양이 비슷해서 시험에 자주 나오는 짝이 있습니다. rise는 자동사로 스스로 오르다라는 뜻이고, raise는 타동사로 무엇을 올리다라는 뜻입니다. lie는 눕다는 뜻의 자동사이고, lay는 무엇을 놓다는 뜻의 타동사입니다. [rise - rose - risen (자동사) / raise - raised - raised (타동사) / lie - lay - lain (자동사) / lay - laid - laid (타동사)] (주의: rise와 raise, lie와 lay는 뜻이 비슷해 보이지만 목적어 유무로 갈립니다. 목적어가 뒤에 있으면 타동사인 raise나 lay를 고르세요.)\n  예문: The sun rises in the east. (해는 동쪽에서 뜬다.) / Please raise your hand if you have a question. (질문이 있으면 손을 들어 주세요.) / He lay on the grass and looked at the sky. (그는 풀밭에 누워 하늘을 바라보았다.) / She laid the book on the table. (그녀는 책을 탁자 위에 놓았다.)\n자주 하는 실수: I arrived the airport late. → I arrived at the airport late. / We discussed about the issue. → We discussed the issue. / She married with him last year. → She married him last year.\n정리: 동사 뒤에 목적어가 필요하면 타동사, 목적어 없이도 완성되면 자동사입니다. / 자동사가 목적어를 가지려면 전치사가 필요합니다. arrive at, listen to처럼 덩어리로 외웁니다. / discuss, marry, resemble, reach는 타동사라서 목적어 앞에 전치사를 쓰지 않습니다. / rise와 lie는 자동사, raise와 lay는 타동사로 목적어 유무로 구분합니다.","items":[{"t":"choose","q":"다음 중 어법상 옳은 문장 두 개를 고르세요.","ref":"","opts":["She married with a famous pianist last year.","We arrived at the station thirty minutes early.","They discussed about the new project all night.","The little boy resembles to his grandfather.","The temperature rises quickly in summer."],"ans":[2,5],"exp":"②⑤는 자동사 arrive에 전치사 at을 쓴 표현과 목적어 없이 쓰인 자동사 rise가 옳게 쓰였어요. ① marry, ③ discuss, ④ resemble는 타동사라서 목적어 앞에 전치사를 쓰지 않아요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"The train [[arrived at]] the platform on time.","ok":true,"right":[],"exp":"arrive는 자동사라서 목적어 the platform 앞에 전치사 at이 필요해요. 따라서 arrived at은 옳은 표현입니다."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"The price of oil has raised sharply since last month.","wrong":"raised","right":["risen"],"exp":"rise는 자동사로 ‘오르다’라는 뜻이고, raise는 타동사로 ‘올리다’라는 뜻이에요. 주어 The price가 스스로 오르는 것이므로 has risen을 써야 해요."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["at","to","for","with"],"items":[{"s":"We arrived ____ the station early in the morning.","a":"at"},{"s":"She listens ____ classical music every night.","a":"to"},{"s":"I waited ____ the bus for ten minutes.","a":"for"},{"s":"He replied ____ the question without hesitation.","a":"to"}],"exp":"arrive at, listen to, wait for, reply to처럼 자동사는 전치사와 함께 목적어를 받아요. 각 빈칸에는 그 동사와 붙어 다니는 전치사가 들어갑니다."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"The manager discussed","r":"the new plan with his team."},{"l":"The guests arrived","r":"at the hotel before dinner."},{"l":"Please raise","r":"your hand when you know the answer."},{"l":"The cat lay","r":"on the warm floor all afternoon."}],"exp":"discuss와 raise는 타동사라 목적어를 바로 받고, arrive는 자동사라 전치사 at이, lie는 자동사로 장소를 나타내는 on이 함께 쓰여요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"The sun [[rose]] behind the clouds this morning.","hint":"(rise)"},"items":[{"scene":"🙋‍♀️❓ 잠시 전에 질문이 있어 손을 든 학생","pre":"The student","post":" his hand to ask a question a moment ago.","hint":"(raise)","a":["raised"]}],"exp":"raise는 타동사라 목적어 his hand를 바로 받고, a moment ago가 있으므로 과거형 raised를 써요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"그 승객들은 기차가 떠나기 전에 역에 도착했다.","chunks":["The passengers","arrived at the station","before the train left"],"end":".","alts":[],"exp":"arrive는 자동사라서 목적어 the station 앞에 전치사 at이 필요해요. ‘도착했다’는 과거이므로 arrived로 썼습니다."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"The committee [[discussed about]] the budget for two hours.","ok":false,"right":["discussed"],"exp":"discuss는 타동사라서 목적어 the budget 앞에 전치사 about을 쓰지 않아요. 따라서 discussed about을 discussed로 고쳐야 합니다."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ul(t){return esc(t).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");}
  function plain(t){return s(t).replace(/\[\[|\]\]/g,"");}
  function nz(t){return plain(t).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}
  function blank(t){return s(t).replace(/_{2,}|\(\s*\)|\[\s*\]/g,"____");}
  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){
    if(!x||typeof x!=="object")return null;
    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();
    if(t==="same"||t==="mcq")t="choose";
    if(t==="choose"){
      var opts=A(x.opts||x.options).map(s).filter(function(v){return v.trim();}).slice(0,8),ans=A(Array.isArray(x.ans)?x.ans:[x.ans]),seen={};
      ans=ans.map(function(n){return parseInt(n,10);}).filter(function(n){if(!(n>=1&&n<=opts.length)||seen[n])return false;seen[n]=1;return true;});
      if(opts.length<3||!ans.length)return null;
      return {t:t,q:q||(ans.length>1?"알맞은 것을 "+ans.length+"개 고르세요.":"알맞은 것을 고르세요."),ref:s(x.ref).trim(),opts:opts,ans:ans.sort(),exp:exp};}
    if(t==="fix"){
      var S=s(x.s||x.sentence).trim(),w=s(x.wrong).trim(),r=alts(x.right);
      if(!S||!w||S.indexOf(w)<0||!r.length)return null;
      return {t:t,q:q||"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.",s:S,wrong:w,right:r,exp:exp};}
    if(t==="bank"){
