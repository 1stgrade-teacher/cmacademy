.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 1 Basic Practice (포인트 1-2)","audioDir":"practice1-2_audio","preview":false,"count":80,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">정동사·준동사, 비교 구문, 대동사, 수일치\u003c/div>\u003ch1>Chapter 1 Basic Practice 포인트 1-2 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 어법 판단 및 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter One Basic Practice 포인트 원 투 문제를 함께 풀어 볼 거예요. 주어와 동사의 관계, 준동사, 비교 구문, 대동사를 중심으로 하나씩 정확히 짚어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">정동사와 준동사 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장에는 주어와 \u003cb class=\"key\">정동사\u003c/b>가 반드시 필요하며, to부정사·동명사·분사는 동사 자리를 대신하지 못한다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + (조)동사 + 나머지\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주어 뒤에 동사원형·분사·to부정사만 있으면 문장 성립이 어렵다\u003c/li>\u003cli>be동사와 일반동사 중 문맥에 맞는 정동사를 고른다\u003c/li>\u003cli>정동사를 고를 때 수일치도 함께 확인한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The book on the desk is mine.\u003c/div>\u003cdiv class=\"g-ko\">책상 위의 책은 내 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I want to be a doctor.\u003c/div>\u003cdiv class=\"g-ko\">나는 의사가 되고 싶다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"영어 문장을 볼 때 가장 먼저 확인할 것은 주어와 정동사예요. 정동사란 시제와 수를 갖춘 진짜 동사를 말합니다. to부정사나 동명사, 분사는 동사처럼 보여도 문장의 동사 자리를 대신하지 못해요. 그래서 주어 뒤에 동사원형이나 분사만 있으면 틀린 문장이 되기 쉬워요. 문장이 완결되려면 반드시 정동사를 찾아 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The bridge built over the river \u003cspan class=\"p-box\">\u003cspan>is\u003c/span>\u003ci>/\u003c/i>\u003cspan>being\u003c/span>\u003c/span> no longer safe for cars.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">is\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">is\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 강 위에 세워진 다리가 주어인 문장이에요. 주어와 동사 사이에 어떤 요소가 끼어 있는지 먼저 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 is예요. built over the river는 the bridge를 꾸미는 분사구이고, 문장 전체의 정동사는 is가 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The bridge built over the river \u003cspan class=\"p-box\">\u003cspan class=\"ok\">is\u003c/span>\u003ci>/\u003c/i>\u003cspan>being\u003c/span>\u003c/span> no longer safe for cars.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">is\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 찾기\u003c/b>주어는 \u003cb class=\"key\">The bridge\u003c/b>이고, built over the river는 the bridge를 꾸미는 분사구이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동사 자리 확인\u003c/b>주어 뒤에는 문장을 완성할 \u003cb class=\"key\">정동사\u003c/b>가 필요하다. being은 분사·동명사이므로 동사 자리를 대신하지 못한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확인\u003c/b>be동사 \u003cb class=\"key\">is\u003c/b>가 와서 The bridge is no longer safe가 되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 is\u003c/span>\u003cdiv class=\"p-full\">The bridge built over the river is no longer safe for cars.\u003c/div>\u003cdiv class=\"p-ko\">강 위에 세워진 다리는 더 이상 차량에 안전하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>built를 본동사로 착각해 being을 고르는 것\u003c/div>","segs":[{"n":6,"text":"첫 번째 문제는 강 위에 세워진 다리가 주어인 문장이에요. 주어와 동사 사이에 어떤 요소가 끼어 있는지 먼저 보세요.","hl":"st-0"},{"n":7,"text":"the bridge 뒤에 built over the river가 있지만 이것은 주어를 꾸며 주는 표현이에요. 그래서 문장 전체의 동사는 따로 필요합니다.","hl":"st-1"},{"n":8,"text":"being은 동사처럼 보이지만 정동사가 아니에요. 그래서 is를 골라 the bridge is no longer safe가 되도록 해야 합니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. built를 본동사로 착각해 being을 고르는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">비교 구문의 도치와 대동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">than 뒤에서 반복되는 동사는 \u003cb class=\"key\">be동사\u003c/b>이면 be동사로, \u003cb class=\"key\">일반동사\u003c/b>이면 do/does/did로 받는다.\u003cdiv>\u003cspan class=\"g-formula\">A + be동사 ... than + (주어 + be동사 / be동사 + 주어)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞 동사가 be동사인지 일반동사인지 먼저 확인한다\u003c/li>\u003cli>than 뒤에서 주어와 동사가 도치될 수 있다\u003c/li>\u003cli>do는 일반동사를 받을 때 쓴다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is taller than I am.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나보다 키가 크다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He runs faster than I do.\u003c/div>\u003cdiv class=\"g-ko\">그는 나보다 더 빨리 달린다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"비교 구문에서 than 뒤에는 앞에 나온 동사를 반복해서 받아요. 이때 앞 동사가 be동사면 are나 is 같은 be동사를 쓰고, 일반동사면 do, does, did를 써요. than are adults처럼 주어와 동사가 도치되기도 하고, than adults are처럼 원래 순서로 쓰이기도 합니다. 앞 동사의 종류를 먼저 확인하는 습관이 중요해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대동사 do와 be동사의 반복\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 동사구를 다시 받을 때 \u003cb class=\"key\">일반동사\u003c/b>는 do/does/did로, \u003cb class=\"key\">be동사\u003c/b>는 be동사 형태로 받는다.\u003cdiv>\u003cspan class=\"g-formula\">일반동사 → do/does/did / be동사 → am/are/is/was/were\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞 동사의 종류를 먼저 확인한다\u003c/li>\u003cli>대동사는 시제와 수를 앞 동사에 맞춘다\u003c/li>\u003cli>as, than, so 구문에서 자주 나온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She sings better than he does.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 그보다 노래를 더 잘한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They are happier than we are.\u003c/div>\u003cdiv class=\"g-ko\">그들은 우리보다 더 행복하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"앞에 나온 동사구를 다시 받을 때는 동사의 종류를 봐야 해요. 일반동사 behave는 does로 받고, 일반동사 increase도 does로 받습니다. be동사 are는 are로 받아야 합니다. as나 than, so 구문에서 이 대동사가 자주 나오니 앞 동사를 정확히 찾아 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Children are more likely to be victims of crimes than \u003cspan class=\"p-box\">\u003cspan>are\u003c/span>\u003ci>/\u003c/i>\u003cspan>do\u003c/span>\u003c/span> adults.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">are\u003c/div>\u003cdiv class=\"p-op\">do\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">are\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":12,"text":"두 번째 문제는 아이들과 성인을 비교하는 문장이에요. than 앞에 나온 동사가 무엇인지 먼저 찾아보세요.","hl":"q"},{"n":13,"text":"","hl":"q", 래서 have만 남아 있어도 이상하지 않습니다.","hl":"st-1"},{"n":56,"text":"they에 have를 쓴 것도 맞고, for years와 현재완료도 잘 어울려요. 그래서 이 밑줄은 맞는 표현입니다.","hl":"st-2"},{"n":57,"text":"이 문제의 함정도 짚고 갈게요. have 뒤에 과거분사가 보이지 않는다고 바로 틀렸다고 판단하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명령문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명령문은 주어 없이 \u003cb class=\"key\">동사원형\u003c/b>으로 시작한다.\u003cdiv>\u003cspan class=\"g-formula\">[[동사원형]] + 목적어/보어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명령·충고 문맥에서는 동사원형으로 시작한다\u003c/li>\u003cli>동명사나 분사로 시작하면 문장 성립을 다시 확인한다\u003c/li>\u003cli>Encourage your students처럼 목적어가 따라올 수 있다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Close the door.\u003c/div>\u003cdiv class=\"g-ko\">문을 닫으세요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Be kind to others.\u003c/div>\u003cdiv class=\"g-ko\">다른 사람에게 친절하세요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"명령문은 주어를 생략하고 동사원형으로 시작해요. Encourage your students처럼 동사원형으로 시작하면 학생들에게 격려하라는 명령이나 충고가 됩니다. Encouraging은 동명사나 분사라서 그 자체로는 문장을 완성하지 못해요. 문장에 주어와 정동사가 없다면 명령문으로 고칠 수 있는지 확인해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">어법 판단 및 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cu class=\"p-u\">Encouraging\u003c/u> your students to discover what they are passionate about.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Encourage\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"여덟 번째 문제는 동명사처럼 보이는 표현으로 시작해요. 문장에 주어와 정동사가 있는지 먼저 확인해 보세요.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"정답은 Encourage예요. 문장을 명령문으로 만들어야 하므로 동사원형 Encourage로 시작합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">어법 판단 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cu class=\"p-u\">Encouraging\u003c/u> your students to discover what they are passionate about.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문장 구조 확인\u003c/b>문장에 주어와 정동사가 없다. \u003cb class=\"key\">Encouraging\u003c/b>은 동명사·분사로 시작하는 표현이라 문장을 완성하지 못한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">명령문 확인\u003c/b>학생들에게 격려하라는 명령·충고 문맥이므로 \u003cb class=\"key\">동사원형\u003c/b> Encourage로 시작하는 명령문이 적절하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확인\u003c/b>&lt;&lt;Encouraging&gt;&gt;을 \u003cb class=\"key\">Encourage\u003c/b>로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 Encourage\u003c/span>\u003cdiv class=\"p-full\">Encourage your students to discover what they are passionate about.\u003c/div>\u003cdiv class=\"p-ko\">학생들이 무엇에 열정을 느끼는지 발견하도록 격려하라.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>동명사 주어인 줄 알고 Encouraging을 그대로 두는 것\u003c/div>","segs":[{"n":62,"text":"여덟 번째 문제는 동명사처럼 보이는 표현으로 시작해요. 문장에 주어와 정동사가 있는지 먼저 확인해 보세요.","hl":"st-0"},{"n":63,"text":"이 문장은 학생들에게 무엇을 하라고 말하는 명령문으로 볼 수 있어요. 명령문은 동사원형으로 시작합니다.","hl":"st-1"},{"n":64,"text":"그래서 Encouraging을 Encourage로 고쳐야 합니다. Encourage your students to discover 형태가 됩니다.","hl":"st-2"},{"n":65,"text":"이 문제의 함정도 짚고 갈게요. 동명사 주어인 줄 알고 Encouraging을 그대로 두는 것","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">The socioeconomic circumstances of persons and the places where they live and work strongly \u003cu class=\"p-u\">influencing\u003c/u> their health. People who are wealthy and well-educated and who have high-paying jobs are much more likely to be healthy than \u003cu class=\"p-u\">do\u003c/u> poor people. As people's economic status increases, so \u003cu class=\"p-u\">is\u003c/u> their health status.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) influence (2) are (3) does\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":66,"text":"이제 지문 하나를 볼게요. 각 밑줄마다 주어와 동사의 관계, 앞에 나온 표현을 그대로 받는지를 차례로 확인해 보세요.","hl":"q"},{"n":67,"text":"","hl":"q","pause":7},{"n":68,"text":"정답은 influence, are, does입니다. 복수 주어에는 influence, be동사 비교에는 are, 일반동사 증가를 받을 때는 does를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The socioeconomic circumstances of persons and the places where they live and work strongly \u003cu class=\"p-u\">influencing\u003c/u> their health. People who are wealthy and well-educated and who have high-paying jobs are much more likely to be healthy than \u003cu class=\"p-u\">do\u003c/u> poor people. As people's economic status increases, so \u003cu class=\"p-u\">is\u003c/u> their health status.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 밑줄 확인\u003c/b>주어의 핵심은 복수 명사 \u003cb class=\"key\">circumstances\u003c/b>이고 strongly 뒤에는 정동사가 필요하다. influencing은 준동사이므로 \u003cb class=\"key\">influence\u003c/b>로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 밑줄 확인\u003c/b>앞의 are much more likely to be healthy와 비교되므로 than 뒤에는 be동사 \u003cb class=\"key\">are\u003c/b>가 와야 한다. do는 일반동사를 받을 때 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">세 번째 밑줄 확인\u003c/b>so + \u003cb class=\"key\">대동사\u003c/b> + 주어 구문이다. 앞의 increases가 일반동사 현재형이므로 \u003cb class=\"key\">does\u003c/b>로 받는다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) influence (2) are (3) does\u003c/span>\u003cdiv class=\"p-full\">The socioeconomic circumstances of persons and the places where they live and work strongly influence their health. People who are wealthy and well-educated and who have high-paying jobs are much more likely to be healthy than are poor people. As people's economic status increases, so does their health status.\u003c/div>\u003cdiv class=\"p-ko\">사람들의 사회경제적 환경과 그들이 살고 일하는 장소는 그들의 건강에 강하게 영향을 미친다. 부유하고 교육 수준이 높으며 고소득 직업을 가진 사람들은 가난한 사람들보다 건강할 가능성이 훨씬 높다. 사람들의 경제적 지위가 증가함에 따라 그들의 건강 상태도 증가한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>influencing을 동사로 착각하거나 so is를 그대로 두는 것\u003c/div>","segs":[{"n":69,"text":"첫 번째 밑줄을 보면 주어의 핵심이 복수 명사 circumstances예요. 그래서 정동사 influence가 와야 하고 influencing은 동사 자리를 대신할 수 없습니다.","hl":"st-0"},{"n":70,"text":"두 번째 밑줄은 앞에 나온 be동사 are를 그대로 받아야 해요. poor people 앞에서도 are를 써서 than are poor people 형태로 맞춥니다.","hl":"st-1"},{"n":71,"text":"세 번째 밑줄은 so가 앞에 나와서 동사가 주어 앞으로 가는 구문이에요. 앞 문장의 increases를 받아야 하니까 does를 씁니다.","hl":"st-2"},{"n":72,"text":"이 문제의 함정도 짚고 갈게요. influencing을 동사로 착각하거나 so is를 그대로 두는 것","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Adults generally do not hesitate to enter the personal space of a child. Similarly, young children who invade the personal space of an adult \u003cu class=\"p-u\">to tend\u003c/u> to have a more favorable response than \u003cu class=\"p-u\">are\u003c/u> older uninvited visitors. The need for personal space \u003cu class=\"p-u\">appearing\u003c/u> to increase with age, although it may begin to decrease at about age forty.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) tend (2) do (3) appears\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":73,"text":"두 번째 지문에서는 긴 주어와 비교 구문이 함께 나와요. 주어의 핵심을 찾고 than 뒤에서 어떤 동사를 받는지 보세요.","hl":"q"},{"n":74,"text":"","hl":"q","pause":7},{"n":75,"text":"정답은 tend, do, appears입니다. 주어 young children에는 tend, 일반동사 반복에는 do, 단수 주어 the need에는 appears가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Adults generally do not hesitate to enter the personal space of a child. Similarly, young children who invade the personal space of an adult \u003cu class=\"p-u\">to tend\u003c/u> to have a more favorable response than \u003cu class=\"p-u\">are\u003c/u> older uninvited visitors. The need for personal space \u003cu class=\"p-u\">appearing\u003c/u> to increase with age, although it may begin to decrease at about age forty.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 밑줄 확인\u003c/b>주어 young children 뒤에 관계절 who invade가 있고, 주절의 정동사가 필요하다. to tend는 준동사이므로 \u003cb class=\"key\">tend\u003c/b>로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 밑줄 확인\u003c/b>비교 대상인 older uninvited visitors가 young children처럼 tend to have하는지를 비교한다. 일반동사 반복이므로 \u003cb class=\"key\">do\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">세 번째 밑줄 확인\u003c/b>주어 The need는 단수이고 정동사가 필요하다. appearing은 준동사이므로 \u003cb class=\"key\">appears\u003c/b>로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) tend (2) do (3) appears\u003c/span>\u003cdiv class=\"p-full\">Adults generally do not hesitate to enter the personal space of a child. Similarly, young children who invade the personal space of an adult tend to have a more favorable response than do older uninvited visitors. The need for personal space appears to increase with age, although it may begin to decrease at about age forty.\u003c/div>\u003cdiv class=\"p-ko\">성인들은 대체로 아이의 개인 공간에 들어가는 것을 주저하지 않는다. 마찬가지로 성인의 개인 공간을 침범하는 어린아이들은 초대받지 않은 나이 든 방문자들보다 더 호의적인 반응을 받는 경향이 있다. 개인 공간에 대한 필요는 나이가 들수록 증가하는 것으로 보이지만, 마흔 살 정도부터는 감소하기 시작할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>than are older에서 are를 그대로 두거나 appearing을 동사로 착각하는 것\u003c/div>","segs":[{"n":76,"text":"첫 번째 밑줄에서는 young children이 주어이고 who invade는 주어를 꾸며 주는 관계절이에요. 주절의 정동사는 tend가 되어야 합니다.","hl":"st-0"},{"n":77,"text":"두 번째 밑줄은 앞에 나온 일반동사 표현을 받아야 해요. 그래서 be동사 are가 아니라 대동사 do를 써서 than do older uninvited visitors로 맞춥니다.","hl":"st-1"},{"n":78,"text":"세 번째 밑줄의 주어는 The need예요. 단수 주어에 맞는 정동사 appears가 필요하고 appearing은 동사 자리를 대신할 수 없습니다.","hl":"st-2"},{"n":79,"text":"이 문제의 함정도 짚고 갈게요. than are older에서 are를 그대로 두거나 appearing을 동사로 착각하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">정동사·준동사, 비교 구문, 대동사, 수일치\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>문장에는 주어와 \u003cb class=\"key\">정동사\u003c/b>가 반드시 필요하고, 준동사는 동사 자리를 대신하지 못한다.\u003c/li>\u003cli>than 뒤에서는 앞 동사가 be동사인지 일반동사인지 확인해 \u003cb class=\"key\">are/do\u003c/b>를 고른다.\u003c/li>\u003cli>동명사구 주어는 \u003cb class=\"key\">단수\u003c/b>로 취급한다.\u003c/li>\u003cli>so + 대동사 구문에서는 앞 동사의 종류와 시제를 그대로 받는다.\u003c/li>\u003cli>for years는 \u003cb class=\"key\">현재완료\u003c/b>와 함께 쓰인다.\u003c/li>\u003c/ul>","segs":[{"n":80,"text":"오늘 문제의 핵심은 결국 주어와 동사를 정확히 찾는 것이었어요. 준동사와 정동사를 구별하고, 비교 구문에서는 앞 동사를 그대로 받는 연습을 꼭 해 두세요. 다음 시간에도 이런 기준을 하나씩 적용해 봅시다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
