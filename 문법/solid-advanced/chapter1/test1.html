}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 1 Chapter Test","audioDir":"test1_audio","preview":false,"count":163,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">시제(과거/현재완료), 수동태, 대동사, 어법 판단\u003c/div>\u003ch1>Chapter 1 Chapter Test 풀이 — 시제·수동태·대동사 총정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 어법상 맞는 문장 짝 고르기, 틀린 부분 고치기, 배열 서술형, 배열·조건 영작, 밑줄 어법 개수 고르기, 빈칸 형태 변형, 지문 어법 + 조건 영작\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter 1 Chapter Test를 함께 풀어 볼 거예요. 시제와 수동태, 대동사, 그리고 지문 어법 판단까지 고1, 고2 여러분이 가장 자주 흔들리는 유형이 골고루 모여 있죠. 한 문제씩 차근차근, 왜 그 답이 되는지 원리부터 짚어 드릴게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">lie와 lay 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">lie는 '눕다·자리하다'라는 \u003cb class=\"key\">자동사\u003c/b>라 목적어가 없고, lay는 '낳다·놓다'라는 \u003cb class=\"key\">타동사\u003c/b>라 뒤에 목적어가 필요하다.\u003cdiv>\u003cspan class=\"g-formula\">lie(자동사): 주어 + lie / lay(타동사): 주어 + lay + 목적어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>lie - lay - lain - lying (자동사)\u003c/li>\u003cli>lay - laid - laid - laying (타동사)\u003c/li>\u003cli>뒤에 eggs, a book 같은 목적어가 보이면 lay\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The hens lay eggs every morning.\u003c/div>\u003cdiv class=\"g-ko\">암탉들은 매일 아침 알을 낳는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 lie와 lay부터 정리해 볼게요. lie는 스스로 눕는다는 뜻의 자동사라서 뒤에 목적어가 없어요. 반대로 lay는 알을 낳다, 무언가를 놓는다는 뜻의 타동사라서 뒤에 꼭 목적어가 와야 하죠. 그래서 뒤에 eggs나 a book처럼 목적어가 보이면 주저 없이 lay를 고르시면 됩니다. 헷갈리는 이유는 lie의 과거형이 lay이기 때문인데, 지금처럼 현재형 자리에서는 목적어 유무만 보면 충분해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Queen ants \u003cspan class=\"p-box\">\u003cspan>lie\u003c/span>\u003ci>/\u003c/i>\u003cspan>lay\u003c/span>\u003c/span> eggs, worker ants attend to the queen, and soldiers defend the colony from invaders.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">lay\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 여왕개미 이야기로 시작하네요. 괄호 안 두 동사 중에서 어떤 것이 목적어 eggs와 어울리는지가 핵심입니다.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 lay예요. eggs라는 목적어가 있으니 타동사 lay를 골라야 하고, lie는 목적어를 가질 수 없는 자동사라서 탈락입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Queen ants \u003cspan class=\"p-box\">\u003cspan>lie\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">lay\u003c/span>\u003c/span> eggs, worker ants attend to the queen, and soldiers defend the colony from invaders.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">목적어 찾기\u003c/b>Queen ants 바로 뒤에 \u003cb class=\"key\">eggs\u003c/b>라는 목적어가 와 있다. 목적어를 가지는 동사 자리이므로 \u003cb class=\"key\">타동사\u003c/b>를 골라야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">lie / lay 구분\u003c/b>lie는 '눕다'라는 \u003cb class=\"key\">자동사\u003c/b>, lay는 '낳다·놓다'라는 \u003cb class=\"key\">타동사\u003c/b>이므로 eggs를 목적어로 데리고 갈 수 있는 것은 \u003cb class=\"key\">lay\u003c/b>.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 lay\u003c/span>\u003cdiv class=\"p-full\">Queen ants lay eggs, worker ants attend to the queen, and soldiers defend the colony from invaders.\u003c/div>\u003cdiv class=\"p-ko\">여왕개미는 알을 낳고, 일개미는 여왕개미를 돌보며, 병정개미는 침입자로부터 군체를 방어한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>lie의 과거형이 lay라서 형태만 외우면 현재형 자리에서 자꾸 틀려요.\u003c/div>","segs":[{"n":6,"text":"먼저 주어와 목적어를 찾아볼게요. Queen ants 뒤에 eggs라는 목적어가 딱 붙어 있죠. 목적어가 있으면 타동사 자리라고 생각하시면 됩니다.","hl":"st-0"},{"n":7,"text":"lie는 스스로 눕는다는 자동사이고 lay는 알을 낳는다는 타동사예요. eggs를 목적어로 데리고 갈 수 있는 건 lay뿐이죠. 그래서 답은 lay입니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. lie의 과거형이 lay라서 형태만 외우면 현재형 자리에서 자꾸 틀려요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">시제 — 과거 시간 표현과 과거시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장 안에 \u003cb class=\"key\">과거를 가리키는 시간 표현\u003c/b>이 있으면 동사는 \u003cb class=\"key\">과거시제\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">과거 시간 표현 + 주어 + 과거동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the nineteenth century, in the 1920s, last year는 과거시제 신호\u003c/li>\u003cli>현재완료는 '지금까지'와 연결될 때만 사용\u003c/li>\u003cli>시간 표현을 먼저 찾고 동사 형태를 결정\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Bluma Zeigarnik wrote about the effect in the 1920s.\u003c/div>\u003cdiv class=\"g-ko\">블루마 자이гар닉은 1920년대에 그 효과에 관해 썼다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"다음은 시제입니다. 문장 안에 the nineteenth century, in the 1920s, last year처럼 과거의 특정 시점을 가리키는 표현이 있으면 동사는 반드시 과거시제로 써요. 현재완료는 과거의 일이 지금까지 이어지거나 현재와 연결될 때만 쓰는 시제예요. 그러니까 시간 표현을 먼저 찾고, 그다음에 동사 형태를 결정한다고 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The nineteenth and early-twentieth centuries \u003cspan class=\"p-box\">\u003cspan>saw\u003c/span>\u003ci>/\u003c/i>\u003cspan>have seen\u003c/span>\u003c/span> destructive outbreaks of cholera, typhoid, and influenza in European cities.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">saw\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 주어가 시간 표현이라는 게 포인트예요. 어느 시대를 가리키는지 먼저 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 saw입니다. 십구 세기와 이십 세기 초라는 특정 과거 시점에는 과거시제를 써야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The nineteenth and early-twentieth centuries \u003cspan class=\"p-box\">\u003cspan class=\"ok\">saw\u003c/span>\u003ci>/\u003c/i>\u003cspan>have seen\u003c/span>\u003c/span> destructive outbreaks of cholera, typhoid, and influenza in European cities.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시간 표현 확인\u003c/b>주어가 \u003cb class=\"key\">The nineteenth and early-twentieth centuries\u003c/b>로 특정 과거 시대를 가리킨다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 결정\u003c/b>과거의 특정 시대가 주어이므로 \u003cb class=\"key\">과거시제 saw\u003c/b>를 쓴다. 현재완료 have seen은 '지금까지'와 연결될 때만 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 saw\u003c/span>\u003cdiv class=\"p-full\">The nineteenth and early-twentieth centuries saw destructive outbreaks of cholera, typhoid, and influenza in European cities.\u003c/div>\u003cdiv class=\"p-ko\">19세기와 20세기 초는 유럽 도시들에서 콜레라, 장티푸스, 인플루엔자의 파괴적인 발생을 겪었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>have seen이 '겪어 왔다'로 자연스러워 보여서 끌리지만, 특정 과거 시대에는 과거시제를 씁니다.\u003c/div>","segs":[{"n":13,"text":"먼저 주어를 볼게요. 십구 세기와 이십 세기 초라는, 아주 분명한 과거 시점이죠.","hl":"st-0"},{"n":14,"text":"과거의 특정 시대를 가리키는 주어이기 때문에 동사는 과거시제로 써야 해요. 현재완료는 지금까지 이어지는 느낌이라 여기에는 맞지 않죠. 그래서 답은 saw입니다.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. have seen이 '겪어 왔다'로 자연스러워 보여서 끌리지만, 특정 과거 시대에는 과거시제를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대동사 do / does / did\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 \u003cb class=\"key\">동사(구)를 반복하지 않고\u003c/b> do, does, did로 대신 받는다. 앞 동사가 \u003cb class=\"key\">be동사\u003c/b>나 수동태면 be동사 형태로 받는다.\u003cdiv>\u003cspan class=\"g-formula\">than / as + 주어 + do(does/did)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>than, as 뒤에서 자주 등장\u003c/li>\u003cli>시제와 수를 앞 동사에 맞춤\u003c/li>\u003cli>be동사·수동태를 받으면 are, is, was 같은 be동사 형태\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Fungi do not make food from sunlight as plants do.\u003c/div>\u003cdiv class=\"g-ko\">균류는 식물이 그러듯 햇빛으로 양분을 만들지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"대동사는 앞에 나온 동사를 똑같이 반복하지 않고 do, does, did로 짧게 받는 표현이에요. 비교 구문의 than이나 as 뒤에서 정말 자주 나오죠. 중요한 건 시제와 수를 앞 동사에 맞춰야 한다는 점이에요. 그리고 앞 동사가 be동사나 수동태이면 do가 아니라 be동사 형태로 받는다는 것도 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Learning a new language takes more time and effort than \u003cspan class=\"p-box\">\u003cspan>does\u003c/span>\u003ci>/\u003c/i>\u003cspan>is\u003c/span>\u003c/span> learning a new skill.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">does\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"세 번째 문제는 than 뒤에 무엇이 오는지가 관건이에요. 앞 동사가 무엇인지 먼저 확인해 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 does예요. 앞의 takes를 대신 받는 대동사이고, 뒤에 긴 주어가 와서 도치된 구조입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Learning a new language takes more time and effort than \u003cspan class=\"p-box\">\u003cspan class=\"ok\">does\u003c/span>\u003ci>/\u003c/i>\u003cspan>is\u003c/span>\u003c/span> learning a new skill.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">앞 동사 찾기\u003c/b>than 앞의 동사는 \u003cb class=\"key\">takes\u003c/b>이고 주어는 Learning a new language이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">대동사 선택\u003c/b>비교 구문에서 앞 동사를 반복하지 않고 \u003cb class=\"key\">대동사 does\u003c/b>로 받는다. than 뒤에 긴 주어 learning a new skill이 와서 도치된 형태다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 does\u003c/span>\u003cdiv class=\"p-full\">Learning a new language takes more time and effort than does learning a new skill.\u003c/div>\u003cdiv class=\"p-ko\">새로운 언어를 배우는 것은 새로운 기술을 배우는 것보다 더 많은 시간과 노력이 든다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>is를 고르면 '배워지고 있다'는 진행형처럼 보여 비교 대상이 어긋나요.\u003c/div>","segs":[{"n":20,"text":"먼저 than 앞을 볼게요. 동사가 takes이고 주어는 Learning a new language라는 동명사구죠.","hl":"st-0"},{"n":21,"text":"비교 구문에서는 앞 동사를 그대로 반복하지 않고 대동사로 받아요. takes를 받는 대동사는 does이고, 뒤에 주어가 길어서 도치된 모양이에요. 그래서 답은 does입니다.","hl":"st-1"},{"n":22,"text":"이 문제의 함정도 짚고 갈게요. is를 고르면 '배워지고 있다'는 진행형처럼 보여 비교 대상이 어긋나요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">자동사 consist of / 타동사 share\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">consist of\u003c/b>는 '이루어져 있다'는 뜻의 \u003cb class=\"key\">자동사\u003c/b>라 수동태로 쓰지 않고, share처럼 목적어를 갖는 동사는 능동형으로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">A consists of B / A and B share C\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be consisted of는 오류\u003c/li>\u003cli>관계사 who 뒤 동사는 선행사 people에 수 일치\u003c/li>\u003cli>and로 연결되면 앞 동사와 형태를 맞춤(병렬)\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The team consists of five members.\u003c/div>\u003cdiv class=\"g-ko\">그 팀은 다섯 명으로 이루어져 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"consist of는 무엇으로 이루어져 있다는 뜻의 자동사예요. 자동사는 목적어가 없으니까 수동태로 바꿀 수가 없어요. 그래서 be consisted of라고 쓰면 바로 오답이 됩니다. 그리고 share처럼 목적어를 가지는 동사는 능동형 그대로 써야 하고, 관계대명사 who 뒤에 오면 선행사의 수에 맞춰 줘야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">A social group \u003cspan class=\"p-box\">\u003cspan>consists\u003c/span>\u003ci>/\u003c/i>\u003cspan>is consisted\u003c/span>\u003c/span> of two or more people who interact frequently and \u003cspan class=\"p-box\">\u003cspan>share\u003c/span>\u003ci>/\u003c/i>\u003cspan>sharing\u003c/span>\u003c/span> a common identity and sense of interdependence.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">consists, share\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"네 번째 문제는 두 개의 빈칸이 있는데, 둘 다 동사의 성질을 묻고 있어요. 수동태가 가능한지부터 따져 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":7},{"n":26,"text":"정답은 consists와 share입니다. consist of는 자동사라 수동태가 안 되고, share는 복수 선행사 people에 맞춰 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">A social group \u003cspan class=\"p-box\">\u003cspan>consists\u003c/span>\u003ci>/\u003c/i>\u003cspan>is consisted\u003c/span>\u003c/span> of two or more people who interact frequently and \u003cspan class=\"p-box\">\u003cspan>share\u003c/span>\u003ci>/\u003c/i>\u003cspan>sharing\u003c/span>\u003c/span> a common identity and sense of interdependence.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 빈칸\u003c/b>\u003cb class=\"key\">consist of\u003c/b>는 자동사라서 \u003cb class=\"key\">수동태 불가\u003c/b>. 따라서 is consisted가 아니라 consists.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 빈칸\u003c/b>관계사 who의 선행사는 \u003cb class=\"key\">people\u003c/b>(복수)이고, and로 \u003cb class=\"key\">interact\u003c/b>와 병렬이므로 \u003cb class=\"key\">share\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>A social group consists of two or more people who interact frequently and share a common identity.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 consists, share\u003c/span>\u003cdiv class=\"p-full\">A social group consists of two or more people who interact frequently and share a common identity and sense of interdependence.\u003c/div>\u003cdiv class=\"p-ko\">사회적 집단은 자주 상호작용하며 공통의 정체성과 상호의존감을 공유하는 두 명 이상의 사람들로 이루어진다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be consisted of는 형태가 그럴듯해서 가장 많이 걸리는 함정입니다.\u003c/div>","segs":[{"n":27,"text":"첫 번째 빈칸부터 볼게요. consist of는 목적어가 필요 없는 자동사라서 수동태로 만들 수 없어요. 그래서 is consisted가 아니라 consists가 맞습니다.","hl":"st-0"},{"n":28,"text":"두 번째 빈칸은 who절 안의 동사 자리예요. 선행사 people이 복수이고, and로 interact와 나란히 연결되니까 share라고 써야 합니다.","hl":"st-1"},{"n":29,"text":"두 답을 넣으면 사회적 집단은 자주 상호작용하고 공통의 정체성을 공유하는 두 명 이상의 사람들로 이루어진다는 문장이 완성돼요.","hl":"st-2"},{"n":30,"text":"이 문제의 함정도 짚고 갈게요. be consisted of는 형태가 그럴듯해서 가장 많이 걸리는 함정입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">혼동 어휘 join / raise / rise\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">join은 '무리에 합류하다'라서 \u003cb class=\"key\">join us\u003c/b>처럼 목적어를 바로 받고, raise는 '올리다·모으다'라는 \u003cb class=\"key\">타동사\u003c/b>, rise는 '오르다'라는 자동사다.\u003cdiv>\u003cspan class=\"g-formula\">join + 사람/단체 / raise + 목적어 / rise(자동사)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>join with는 '~와 함께 손잡다'의 뜻일 때만\u003c/li>\u003cli>기금을 모으는 것은 raise funds\u003c/li>\u003cli>rise - rose - risen\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We need to raise funds for the campaign.\u003c/div>\u003cdiv class=\"g-ko\">우리는 캠페인을 위해 기금을 모아야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":31,"text":"join과 raise는 뜻이 헷갈리는 대표 단어예요. join은 무리에 합류하다는 뜻이라서 join us처럼 목적어를 바로 받아요. raise는 올리다, 모으다라는 타동사이고, rise는 스스로 오르다라는 자동사예요. 기금을 모은다고 할 때는 반드시 raise funds라고 쓴다는 것, 꼭 챙겨 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">There is strength in numbers, so please \u003cspan class=\"p-box\">\u003cspan>join\u003c/span>\u003ci>/\u003c/i>\u003cspan>join with\u003c/span>\u003c/span> us in the fight against Parkinson's disease (PD). The more funds we can \u003cspan class=\"p-box\">\u003cspan>rise\u003c/span>\u003ci>/\u003c/i>\u003cspan>raise\u003c/span>\u003c/span>, the more people we can help in the local PD community.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">join, raise\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"다섯 번째 문제는 소리가 비슷한 단어 두 쌍이 나와요. 뒤에 목적어가 있는지를 기준으로 판단해 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":7},{"n":34,"text":"정답은 join과 raise입니다. join은 사람을 목적어로 바로 받고, 기금을 모으는 것은 타동사 raise로 표현해야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">There is strength in numbers, so please \u003cspan class=\"p-box\">\u003cspan>join\u003c/span>\u003ci>/\u003c/i>\u003cspan>join with\u003c/span>\u003c/span> us in the fight against Parkinson's disease (PD). The more funds we can \u003cspan class=\"p-box\">\u003cspan>rise\u003c/span>\u003ci>/\u003c/i>\u003cspan>raise\u003c/span>\u003c/span>, the more people we can help in the local PD community.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 빈칸\u003c/b>'우리와 함께하다'는 \u003cb class=\"key\">join us\u003c/b>처럼 목적어를 바로 받는다. join with는 '~와 손잡다'라는 별도 의미다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 빈칸\u003c/b>funds를 모으는 것은 \u003cb class=\"key\">타동사 raise\u003c/b>. rise는 '오르다'라는 자동사라 목적어를 못 가진다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 join, raise\u003c/span>\u003cdiv class=\"p-full\">There is strength in numbers, so please join us in the fight against Parkinson's disease (PD). The more funds we can raise, the more people we can help in the local PD community.\u003c/div>\u003cdiv class=\"p-ko\">여럿이 모이면 힘이 세지므로 파킨슨병과의 싸움에 우리와 함께해 주세요. 우리가 더 많은 기금을 모을수록 지역 파킨슨병 환자 공동체에서 더 많은 사람을 도울 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>rise와 raise는 철자 하나 차이라서 뜻과 목적어 유무를 함께 외워야 합니다.\u003c/div>","segs":[{"n":35,"text":"첫 번째는 join입니다. join은 사람이나 단체를 목적어로 바로 받아서 join us라고 쓰죠. join with는 다른 뉘앙스라서 여기에는 어울리지 않아요.","hl":"st-0"},{"n":36,"text":"두 번째는 raise예요. 기금을 모은다는 뜻으로 funds를 목적어로 데리고 가야 하니까 타동사 raise를 씁니다. rise는 스스로 오르는 자동사라서 목적어를 가질 수 없어요.","hl":"st-1"},{"n":37,"text":"이 문제의 함정도 짚고 갈게요. rise와 raise는 철자 하나 차이라서 뜻과 목적어 유무를 함께 외워야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태를 만들 수 없는 자동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">자동사\u003c/b>는 목적어가 없어 수동태로 만들 수 없다. result in, last, happen, occur, rise 등이 대표적이다.\u003cdiv>\u003cspan class=\"g-formula\">X results in Y (O) / X is resulted in Y (X)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be + p.p. 형태라도 자동사면 오류\u003c/li>\u003cli>3형식 타동사만 수동태 가능\u003c/li>\u003cli>Corruption results in unfair elections\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Corruption results in unfair elections.\u003c/div>\u003cdiv class=\"g-ko\">부패는 불공정한 선거를 초래한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"수동태는 목적어를 주어 자리로 끌어올리는 문법이에요. 그러니까 목적어가 없는 자동사는 수동태로 만들 수가 없죠. result in, last, happen, occur, rise 같은 동사들이 대표적이에요. be동사에 과거분사가 붙어 있으면 무조건 수동태가 맞다고 생각하기 쉬운데, 그 동사가 자동사인지 먼저 확인하는 습관이 필요해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">능동태와 수동태의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 \u003cb class=\"key\">동작을 하는 주체\u003c/b>면 능동, \u003cb class=\"key\">동작을 당하는 대상\u003c/b>이면 수동으로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 / 주어 + be + p.p. (+ by)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>last, consist of, take place는 능동\u003c/li>\u003cli>consider A B → A is considered B\u003c/li>\u003cli>수동태 뒤에 목적어가 남아 있으면 의심\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Democracy is considered one of the fairest forms of government.\u003c/div>\u003cdiv class=\"g-ko\">민주주의는 가장 공정한 정부 형태 중 하나로 여겨진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"능동과 수동을 고르는 기준은 하나예요. 주어가 동작을 하는 주체면 능동, 동작을 당하는 대상이면 수동이에요. last나 consist of, take place처럼 스스로 그런 상태가 되는 동사는 능동으로 써야 합니다. 그리고 consider A B는 A is considered B로 수동태가 가능하다는 점도 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① There \u003cu class=\"p-u\">are\u003c/u> approximately 10 to 20 volcanic eruptions per day on Earth.\u003c/div>\u003cdiv class=\"p-op\">② It is said that dogs \u003cu class=\"p-u\">can be trained\u003c/u> to detect cancer and other diseases.\u003c/div>\u003cdiv class=\"p-op\">③ Corruption \u003cu class=\"p-u\">is resulted\u003c/u> in unfair elections that limit the power of the people.\u003c/div>\u003cdiv class=\"p-op\">④ Around 60 percent of our body \u003cu class=\"p-u\">is made up of\u003c/u> water.\u003c/div>\u003cdiv class=\"p-op\">⑤ As the economy continues to slow down, people are wondering if things \u003cu class=\"p-u\">will turn\u003c/u> around.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (is resulted → results)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":40,"text":"여섯 번째 문제는 다섯 문장 중 하나만 틀렸어요. 각 밑줄이 능동이어야 하는지 수동이어야 하는지 따져 보세요.","hl":"q"},{"n":41,"text":"","hl":"q","pause":7},{"n":42,"text":"정답은 세 번째입니다. result in은 자동사라서 수동태로 쓸 수 없고, results라고 능동으로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① There \u003cu class=\"p-u\">are\u003c/u> approximately 10 to 20 volcanic eruptions per day on Earth.\u003c/div>\u003cdiv class=\"p-op\">② It is said that dogs \u003cu class=\"p-u\">can be trained\u003c/u> to detect cancer and other diseases.\u003c/div>\u003cdiv class=\"p-op\">③ Corruption \u003cu class=\"p-u\">is resulted\u003c/u> in unfair elections that limit the power of the people.\u003c/div>\u003cdiv class=\"p-op\">④ Around 60 percent of our body \u003cu class=\"p-u\">is made up of\u003c/u> water.\u003c/div>\u003cdiv class=\"p-op\">⑤ As the economy continues to slow down, people are wondering if things \u003cu class=\"p-u\">will turn\u003c/u> around.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>주어 \u003cb class=\"key\">eruptions\u003c/b>가 복수이므로 are는 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>dogs는 '훈련받는' 대상이므로 \u003cb class=\"key\">can be trained\u003c/b> 수동태가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>\u003cb class=\"key\">result in\u003c/b>은 자동사라서 수동태 불가. is resulted → \u003cb class=\"key\">results\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④·⑤ 확인\u003c/b>④ 60 percent of our body는 단수 취급이라 is made up of가 맞고, ⑤ if절 뒤 will turn도 미래 의미로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (is resulted → results)\u003c/span>\u003cdiv class=\"p-ko\">부패는 국민의 힘을 제한하는 불공정한 선거를 초래한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be + p.p.가 보이면 무조건 수동태라고 넘기면 ③을 놓칩니다.\u003c/div>","segs":[{"n":43,"text":"첫 번째 선택지를 볼게요. 주어가 복수 명사인 eruptions이니까 are가 맞습니다.","hl":"st-0"},{"n":44,"text":"두 번째는 개가 훈련을 받는 대상이니까 수동태 can be trained가 자연스럽습니다. 여기까지는 맞아요.","hl":"st-1"},{"n":45,"text":"세 번째를 보세요. result in은 목적어가 없는 자동사라 수동태로 쓸 수 없어요. 그래서 is resulted가 아니라 results가 되어야 합니다. 바로 이 부분이 틀렸죠.","hl":"st-2"},{"n":46,"text":"네 번째는 육십 퍼센트가 단수로 취급되어 is가 맞고, 다섯 번째는 if절 안에서도 will이 쓰인 미래 의미라 문제가 없습니다.","hl":"st-3"},{"n":47,"text":"이 문제의 함정도 짚고 갈게요. be + p.p.가 보이면 무조건 수동태라고 넘기면 세 번째를 놓칩니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">어법상 맞는 문장 짝 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">ⓐ The law states that all citizens have the right to vote.\u003cbr>ⓑ When dinosaurs lived on the Earth, a day was lasted only about twenty-three hours.\u003cbr>ⓒ Democracy is considered one of the fairest forms of government.\u003cbr>ⓓ The pressure caused the members to do what they were unwilling to be.\u003cbr>ⓔ The social structure has been changing rapidly in recent decades.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":48,"text":"일곱 번째 문제는 다섯 문장 중 맞는 것을 골라 짝짓는 유형이에요. 자동사가 수동태로 쓰였는지부터 표시하면서 읽어 보세요.","hl":"q"},{"n":49,"text":"","hl":"q","pause":7},{"n":50,"text":"정답은 세 번째 선택지입니다. 에이, 씨, 이 세 문장만 어법에 맞고, 비와 디는 자동사 last의 수동태와 to be 오류로 틀렸어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">어법상 맞는 문장 짝 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">ⓐ The law states that all citizens have the right to vote.\u003cbr>ⓑ When dinosaurs lived on the Earth, a day was lasted only about twenty-three hours.\u003cbr>ⓒ Democracy is considered one of the fairest forms of government.\u003cbr>ⓓ The pressure caused the members to do what they were unwilling to be.\u003cbr>ⓔ The social structure has been changing rapidly in recent decades.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>The law states that절 안의 \u003cb class=\"key\">have the right to vote\u003c/b>는 현재시제로 자연스럽다. → 맞음\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>\u003cb class=\"key\">last\u003c/b>는 '지속되다'라는 자동사라 수동태 불가. was lasted → \u003cb class=\"key\">lasted\u003c/b>. → 틀림\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>consider A B → \u003cb class=\"key\">A is considered B\u003c/b> 수동태 가능. → 맞음\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>do what they were unwilling to \u003cb class=\"key\">do\u003c/b>가 되어야 한다. to be는 동사 do를 대신하지 못한다. → 틀림\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>in recent decades와 함께 \u003cb class=\"key\">has been changing\u003c/b> 현재완료진행이 맞다. → 맞음\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">정답 조합\u003c/b>맞는 문장은 \u003cb class=\"key\">ⓐ, ⓒ, ⓔ\u003c/b>이므로 ③.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">ⓐ 법은 모든 시민이 투표권을 가진다고 규정한다. / ⓒ 민주주의는 가장 공정한 정부 형태 중 하나로 여겨진다. / ⓔ 사회 구조는 최근 수십 년 동안 빠르게 변해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ⓓ를 'be unwilling to be'로 자연스럽게 읽어 버리면 오답이 됩니다.\u003c/div>","segs":[{"n":51,"text":"에이 문장부터 볼게요. 법이 규정한다는 현재 사실이고, 국민이 투표권을 가진다는 내용도 현재시제로 자연스럽습니다. 맞는 문장이에요.","hl":"st-0"},{"n":52,"text":"비 문장은 last가 지속되다는 자동사인데 수동태로 만들어져 있어요. 그래서 틀린 문장입니다. 이걸로 비가 들어간 이번과 사번 선택지는 탈락이네요.","hl":"st-1"},{"n":53,"text":"씨 문장은 민주주의가 가장 공정한 정부 형태 중 하나로 여겨진다는 수동태인데, consider가 수동태로 잘 쓰였습니다. 맞는 문장이에요.","hl":"st-2"},{"n":54,"text":"디 문장을 보면 caused the members to do what they were unwilling to be라고 되어 있죠. 여기서는 앞의 do를 받아야 하니까 to do가 되어야 합니다. 틀린 문장이에요.","hl":"st-3"},{"n":55,"text":"이 문장은 최근 수십 년 동안이라는 표현과 함께 현재완료진행이 쓰여서 아주 자연스럽습니다. 맞는 문장입니다.","hl":"st-4"},{"n":56,"text":"결국 맞는 문장은 에이, 씨, 이 세 개이고 세 번째 선택지가 정답입니다.","hl":"st-5"},{"n":57,"text":"이 문제의 함정도 짚고 갈게요. d를 'be unwilling to be'로 자연스럽게 읽어 버리면 오답이 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">시간·조건 부사절의 현재시제\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">시간·조건을 나타내는 접속사\u003c/b> 뒤에서는 미래의 일도 \u003cb class=\"key\">현재시제\u003c/b>로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">until / when / if / as soon as + 주어 + 현재동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>if, when, until 절에 will 쓰지 않기\u003c/li>\u003cli>미래의 의미는 주절의 will이 담당\u003c/li>\u003cli>until that task is complete\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Wait here until the light turns green.\u003c/div>\u003cdiv class=\"g-ko\">불이 초록색으로 바뀔 때까지 여기서 기다려라.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"시간이나 조건을 나타내는 접속사 뒤에서는 미래의 일이라도 현재시제를 써요. when, until, if, before, as soon as가 그 대표 선수들이죠. 그래서 until that task will be complete가 아니라 until that task is complete라고 씁니다. 미래의 느낌은 주절의 will이 담당한다고 생각하면 쉬워요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">The Zeigarnik effect ⓐ \u003cu class=\"p-u\">is referred to\u003c/u> as the tendency of the subconscious mind to remind you of a task that is incomplete until that task ⓑ \u003cu class=\"p-u\">will be\u003c/u> complete. Bluma Zeigarnik was a Lithuanian psychologist who ⓒ \u003cu class=\"p-u\">has written\u003c/u> in the 1920s about the effects of leaving tasks incomplete.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓑ will be → is, ⓒ has written → wrote\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"여덟 번째 문제는 자이гар닉 효과를 설명하는 글이에요. 시간 접속사와 과거 시간 표현을 눈여겨보면서 읽어 보세요.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"정답은 비의 will be를 is로, 씨의 has written을 wrote로 고치는 것입니다. 시간 부사절은 현재시제, 십구이십 년대는 과거시제라는 원칙 그대로예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The Zeigarnik effect ⓐ \u003cu class=\"p-u\">is referred to\u003c/u> as the tendency of the subconscious mind to remind you of a task that is incomplete until that task ⓑ \u003cu class=\"p-u\">will be\u003c/u> complete. Bluma Zeigarnik was a Lithuanian psychologist who ⓒ \u003cu class=\"p-u\">has written\u003c/u> in the 1920s about the effects of leaving tasks incomplete.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>be referred to as는 '~로 불리다'라는 \u003cb class=\"key\">수동태\u003c/b>로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>until은 \u003cb class=\"key\">시간 부사절\u003c/b> 접속사이므로 미래 의미라도 현재시제. will be → \u003cb class=\"key\">is\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>\u003cb class=\"key\">in the 1920s\u003c/b>라는 과거 시간 표현이 있으므로 과거시제 \u003cb class=\"key\">wrote\u003c/b>.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓑ will be → is, ⓒ has written → wrote\u003c/span>\u003cdiv class=\"p-full\">The Zeigarnik effect is referred to as the tendency of the subconscious mind to remind you of a task that is incomplete until that task is complete. Bluma Zeigarnik was a Lithuanian psychologist who wrote in the 1920s about the effects of leaving tasks incomplete.\u003c/div>\u003cdiv class=\"p-ko\">자이гар닉 효과는 과제가 완료될 때까지 잠재의식이 미완성 과제를 계속 상기시키는 경향으로 불린다. 블루마 자이гар닉은 1920년대에 과제를 미완성으로 남겨 두는 것의 효과에 관해 글을 쓴 리투아니아 심리학자였다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>until절 안의 will과 in the 1920s를 그냥 지나치면 두 곳을 모두 놓칩니다.\u003c/div>","segs":[{"n":62,"text":"먼저 에이를 볼게요. be referred to as는 무엇으로 불리다라는 뜻의 수동태라서 그대로 두면 됩니다.","hl":"st-0"},{"n":63,"text":"비는 until 뒤에 있죠. until은 시간을 나타내는 접속사라서 미래의 일이라도 현재시제를 써야 해요. 그래서 will be가 아니라 is로 고칩니다.","hl":"st-1"},{"n":64,"text":"씨는 in the 1920s라는 과거 시간 표현이 함께 있어요. 그렇다면 현재완료 has written이 아니라 과거시제 wrote를 써야 합니다.","hl":"st-2"},{"n":65,"text":"이 문제의 함정도 짚고 갈게요. until절 안의 will과 in the 1920s를 그냥 지나치면 두 곳을 모두 놓칩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사·to부정사 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장의 \u003cb class=\"key\">주어 자리\u003c/b>에는 동명사나 to부정사를 써야 하고, \u003cb class=\"key\">동사원형\u003c/b>은 주어가 될 수 없다.\u003cdiv>\u003cspan class=\"g-formula\">Deleting + 동사 / To delete + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>문장 맨 앞 동사원형은 오류 신호\u003c/li>\u003cli>동명사 주어는 단수 취급\u003c/li>\u003cli>Delete → Deleting 또는 To delete\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Deleting a file does not remove it completely.\u003c/div>\u003cdiv class=\"g-ko\">파일을 삭제하는 것은 그것을 완전히 없애지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"주어 자리에는 동사원형이 올 수 없어요. 동명사나 to부정사 형태로 바꿔 줘야 하죠. Delete an e-mail이라고 쓰면 명령문처럼 보이거나 주어가 없는 문장이 되어 버려요. Deleting이나 To delete로 고쳐서 주어로 만들어 주면 됩니다. 동명사 주어는 단수로 취급한다는 것도 같이 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">&quot;A college student's privacy is protected as long as they ⓐ \u003cu class=\"p-u\">will delete\u003c/u> the documents they ⓑ \u003cu class=\"p-u\">have worked\u003c/u> on from the school-owned computer. This prevents anyone else from examining those documents.&quot; Is this statement true or false? It is absolutely wrong. ⓒ \u003cu class=\"p-u\">Delete\u003c/u> an e-mail or other document from a computer does not actually remove it from the computer's memory.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ will delete → delete, ⓒ Delete → Deleting (또는 To delete)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":67,"text":"아홉 번째 문제는 개인정보 보호에 관한 짧은 글 속 어법이에요. 조건 접속사와 문장 첫머리를 특히 조심해서 보세요.","hl":"q"},{"n":68,"text":"","hl":"q","pause":7},{"n":69,"text":"정답은 에이의 will delete를 delete로, 씨의 Delete를 Deleting으로 고치는 것입니다. 조건 부사절은 현재시제, 주어 자리에는 동명사를 써야 하죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">&quot;A college student's privacy is protected as long as they ⓐ \u003cu class=\"p-u\">will delete\u003c/u> the documents they ⓑ \u003cu class=\"p-u\">have worked\u003c/u> on from the school-owned computer. This prevents anyone else from examining those documents.&quot; Is this statement true or false? It is absolutely wrong. ⓒ \u003cu class=\"p-u\">Delete\u003c/u> an e-mail or other document from a computer does not actually remove it from the computer's memory.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>as long as는 \u003cb class=\"key\">조건 부사절\u003c/b>이므로 미래 의미라도 현재시제. will delete → \u003cb class=\"key\">delete\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>documents they have worked on은 '지금까지 작업해 온'이라 \u003cb class=\"key\">현재완료\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>문장의 \u003cb class=\"key\">주어 자리\u003c/b>에 동사원형은 불가. \u003cb class=\"key\">Deleting\u003c/b> 또는 \u003cb class=\"key\">To delete\u003c/b>로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ will delete → delete, ⓒ Delete → Deleting (또는 To delete)\u003c/span>\u003cdiv class=\"p-full\">&quot;A college student's privacy is protected as long as they delete the documents they have worked on from the school-owned computer. This prevents anyone else from examining those documents.&quot; Is this statement true or false? It is absolutely wrong. Deleting an e-mail or other document from a computer does not actually remove it from the computer's memory.\u003c/div>\u003cdiv class=\"p-ko\">&quot;대학생이 학교 소유 컴퓨터에서 작업한 문서를 삭제하는 한 그 학생의 사생활은 보호된다. 이것은 다른 사람이 그 문서를 검사하는 것을 막는다.&quot; 이 말은 참일까 거짓일까? 완전히 틀렸다. 컴퓨터에서 이메일이나 다른 문서를 삭제하는 것은 그것을 컴퓨터 기억에서 실제로 없애지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>전치사 on을 지우고 싶은 유혹이 있지만, work on은 '~에 작업하다'라는 정확한 표현입니다.\u003c/div>","segs":[{"n":70,"text":"에이는 as long as 뒤에 있어요. 조건을 나타내는 접속사 뒤에서는 미래의 일도 현재시제로 써야 하니까 will delete를 delete로 고칩니다.","hl":"st-0"},{"n":71,"text":"비는 그대로 두시면 됩니다. 지금까지 작업해 온 문서라는 뜻으로 현재완료가 자연스럽게 쓰였어요.","hl":"st-1"},{"n":72,"text":"씨는 문장 맨 앞 주어 자리인데 동사원형 Delete가 와 있죠. 주어 자리에는 동명사나 to부정사가 와야 하니까 Deleting이나 To delete로 고칩니다.","hl":"st-2"},{"n":73,"text":"이 문제의 함정도 짚고 갈게요. 전치사 on을 지우고 싶은 유혹이 있지만, work on은 '~에 작업하다'라는 정확한 표현입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">the number of / a number of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">the number of + 복수명사\u003c/b>는 '~의 수'라서 \u003cb class=\"key\">단수동사\u003c/b>, \u003cb class=\"key\">a number of + 복수명사\u003c/b>는 '많은 ~'이라서 \u003cb class=\"key\">복수동사\u003c/b>를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">The number of + 복수명사 + 단수동사 / A number of + 복수명사 + 복수동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동사의 수를 결정하는 것은 관사\u003c/li>\u003cli>the number of species has declined\u003c/li>\u003cli>a number of scientists were expressing\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The number of wild animal species has declined by half.\u003c/div>\u003cdiv class=\"g-ko\">야생 동물 종의 수가 절반으로 감소했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":74,"text":"the number of는 무엇의 수라는 뜻이라서 핵심 명사가 number 하나예요. 그래서 동사는 단수로 받아요. 반대로 a number of는 많은이라는 뜻의 덩어리라서 뒤에 복수명사가 오고 동사도 복수로 받죠. 관사 하나 차이로 동사의 수가 완전히 달라지니까 시험에서 정말 자주 노리는 부분이에요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 20\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>우리말과 같은 뜻이 되도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"p-q\">In the 20th century \u003cspan class=\"p-blank\">\u003c/span> of many species.\u003c/div>\u003cdiv class=\"p-words\">(20세기에, 많은 과학자가 많은 종의 멸종에 관해 우려를 표현하고 있었다.) / 보기: scientists, of, about, express, number, concern, the, a, extinction / 시작: In the 20th century \u003cspan class=\"p-blank\">\u003c/span> of many species.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">a number of scientists were expressing concern about the extinction\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":75,"text":"열 번째 문제는 관사 하나가 동사의 수를 결정하는 유형이에요. number 앞에 어떤 관사가 오는지부터 확인하세요.","hl":"q"},{"n":76,"text":"","hl":"q","pause":7},{"n":77,"text":"정답은 a number of scientists were expressing concern about the extinction입니다. a number of는 복수 취급이라 were를 쓴다는 게 포인트예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 20\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\  class=\"p-u\">where\u003c/u> the water is clear and there is enough light, it is quite possible for an amateur photographer ⓔ \u003cu class=\"p-u\">to take\u003c/u> great shots with an inexpensive underwater camera. At greater depths it is dark and cold there photography is the principal way of exploring a mysterious deep-sea world, \u003cu class=\"p-u\">그것의 95퍼센트는 예전에는 전혀 드러난 적이 없었다.\u003c/u>\u003c/div>\u003cdiv class=\"p-words\">(보기) before / never / 95 percent / of / see / which\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ·ⓑ 확인\u003c/b>ⓐ 사진은 '찍히는' 대상이라 \u003cb class=\"key\">were taken\u003c/b> 수동태 맞음. ⓑ after 뒤 \u003cb class=\"key\">waterproofing\u003c/b> 분사구문도 맞음.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓒ 확인\u003c/b>\u003cb class=\"key\">survive\u003c/b>는 자동사라 수동태 불가. was survived → \u003cb class=\"key\">survived\u003c/b>.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓓ·ⓔ 확인\u003c/b>ⓓ 장소를 받는 관계부사 \u003cb class=\"key\">where\u003c/b> 맞음, ⓔ possible for A to do 구문의 \u003cb class=\"key\">to take\u003c/b>도 맞음.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">(2) 영작\u003c/b>'그것의 95퍼센트'는 \u003cb class=\"key\">95 percent of which\u003c/b>, '예전에 전혀 드러난 적이 없다'는 \u003cb class=\"key\">has never been seen before\u003c/b>.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ③ (was survived → survived) / (2) 95 percent of which has never been seen before\u003c/span>\u003cdiv class=\"p-full\">At greater depths it is dark and cold there photography is the principal way of exploring a mysterious deep-sea world, 95 percent of which has never been seen before.\u003c/div>\u003cdiv class=\"p-ko\">표면 근처에서는 물이 맑고 빛이 충분해서 값싼 수중 카메라로도 아마추어 사진가가 멋진 사진을 찍는 것이 충분히 가능하다. 더 깊은 곳에서는 어둡고 차가워서 사진 촬영이 신비로운 심해 세계를 탐험하는 주요 수단이며, 그 세계의 95퍼센트는 예전에는 전혀 드러난 적이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>survive를 타동사로 착각해 was survived를 그냥 두는 경우가 많습니다.\u003c/div>","segs":[{"n":140,"text":"에이는 사진이 찍히는 대상이라 수동태가 맞습니다. 비도 전치사 after 뒤에 동명사가 온 형태라 문제없어요.","hl":"st-0"},{"n":141,"text":"씨를 보세요. survive는 살아남는다는 자동사라서 수동태로 쓸 수 없어요. 그래서 was survived가 아니라 survived가 되어야 합니다. 이게 바로 어색한 부분이에요.","hl":"st-1"},{"n":142,"text":"디는 장소를 받는 관계부사라 맞고, 이는 목적격 의미상 주어 뒤에 to부정사가 온 표현이라 맞습니다.","hl":"st-2"},{"n":143,"text":"두 번째 물음은 관계대명사 which를 이용해 이어 주면 됩니다. 그것의 구십오 퍼센트는 95 percent of which, 본 적이 없다는 뜻은 현재완료 수동태로 has never been seen before라고 씁니다.","hl":"st-3"},{"n":144,"text":"이 문제의 함정도 짚고 갈게요. survive를 타동사로 착각해 was survived를 그냥 두는 경우가 많습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Fossil evidence shows that there ① \u003cu class=\"p-u\">was\u003c/u> another group of humans that existed at the same time as Neanderthals. They were definitely not Neanderthal nor ② \u003cu class=\"p-u\">were\u003c/u> they related to them. A number of fossils very different from Neanderthal ③ \u003cu class=\"p-u\">have found\u003c/u> in various places in Europe and Western Asia. These prehumans have vertical foreheads and flat faces like modern humans. It ④ \u003cu class=\"p-u\">is believed\u003c/u> that they evolved in Africa, but when they occupied that continent is not known. They are known to have moved out of Africa one hundred to a hundred fifty thousand years ago. These hominids have been given the name Cro Magnon after the site in France ⑤ \u003cu class=\"p-u\">where\u003c/u> their fossils were found.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① was\u003c/div>\u003cdiv class=\"p-op\">② were\u003c/div>\u003cdiv class=\"p-op\">③ have found\u003c/div>\u003cdiv class=\"p-op\">④ is believed\u003c/div>\u003cdiv class=\"p-op\">⑤ where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (have found → have been found)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":145,"text":"열아홉 번째 문제는 크로마뇽인에 관한 지문이에요. 화석이 스스로 발견하는 것이 아니라 발견되는 대상이라는 점을 염두에 두세요.","hl":"q"},{"n":146,"text":"","hl":"q","pause":7},{"n":147,"text":"정답은 세 번째입니다. fossils는 발견되는 대상이므로 have found가 아니라 have been found라고 수동태로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Fossil evidence shows that there ① \u003cu class=\"p-u\">was\u003c/u> another group of humans that existed at the same time as Neanderthals. They were definitely not Neanderthal nor ② \u003cu class=\"p-u\">were\u003c/u> they related to them. A number of fossils very different from Neanderthal ③ \u003cu class=\"p-u\">have found\u003c/u> in various places in Europe and Western Asia. These prehumans have vertical foreheads and flat faces like modern humans. It ④ \u003cu class=\"p-u\">is believed\u003c/u> that they evolved in Africa, but when they occupied that continent is not known. They are known to have moved out of Africa one hundred to a hundred fifty thousand years ago. These hominids have been given the name Cro Magnon after the site in France ⑤ \u003cu class=\"p-u\">where\u003c/u> their fossils were found.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① was\u003c/div>\u003cdiv class=\"p-op\">② were\u003c/div>\u003cdiv class=\"p-op\">③ have found\u003c/div>\u003cdiv class=\"p-op\">④ is believed\u003c/div>\u003cdiv class=\"p-op\">⑤ where\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>there 뒤 \u003cb class=\"key\">another group\u003c/b>(단수)에 맞춰 was가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>nor 뒤 \u003cb class=\"key\">주어-동사 도치\u003c/b>로 were they related가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>fossils는 '발견되는' 대상인데 목적어 없이 have found가 왔다. \u003cb class=\"key\">have been found\u003c/b>로 고쳐야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④·⑤ 확인\u003c/b>④ It is believed that 수동태 맞음, ⑤ 장소 선행사 the site를 받는 \u003cb class=\"key\">where\u003c/b>도 맞음.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (have found → have been found)\u003c/span>\u003cdiv class=\"p-full\">A number of fossils very different from Neanderthal have been found in various places in Europe and Western Asia.\u003c/div>\u003cdiv class=\"p-ko\">네안데르탈인과 매우 다른 다수의 화석이 유럽과 서아시아 여러 지역에서 발견되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>A number of에 끌려 복수 동사를 찾다가 ③의 수동태 누락을 놓치기 쉬워요.\u003c/div>","segs":[{"n":148,"text":"첫 번째는 another group이 단수라서 was가 맞습니다. 또 같은 시기에 존재했다는 과거 사실이라 시제도 문제없어요.","hl":"st-0"},{"n":149,"text":"두 번째는 nor 다음에 주어와 동사가 도치된 형태인데, 관계가 없다는 수동 의미라 were가 맞습니다.","hl":"st-1"},{"n":150,"text":"세 번째를 보세요. 화석은 발견되는 대상인데 뒤에 목적어가 없이 have found만 있죠. 그래서 have been found라고 수동태로 고쳐야 합니다. 바로 이 부분이 틀렸어요.","hl":"st-2"},{"n":151,"text":"네 번째는 여겨진다는 수동태 구문으로 맞고, 다섯 번째도 장소를 받는 관계부사라 맞습니다.","hl":"st-3"},{"n":152,"text":"이 문제의 함정도 짚고 갈게요. A number of에 끌려 복수 동사를 찾다가 3번의 수동태 누락을 놓치기 쉬워요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">비교 구문의 반복 대체 (those / are)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">than\u003c/b> 뒤에서 앞의 복수명사를 반복할 때는 \u003cb class=\"key\">those\u003c/b>로, 동사구는 \u003cb class=\"key\">대동사\u003c/b>로 받는다. 앞 동사가 be동사 수동태면 be동사 형태를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">than + those of + 명사 / than + are + 주어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞이 복수명사 perceptions → those\u003c/li>\u003cli>앞이 are detected → than are smiling faces\u003c/li>\u003cli>than do는 일반동사 대체일 때만\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Threatening faces are detected faster than are smiling faces.\u003c/div>\u003cdiv class=\"g-ko\">위협적인 얼굴은 웃는 얼굴보다 더 빨리 감지된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":153,"text":"비교 구문에서 앞에 나온 명사를 그대로 반복하는 건 어색하죠. 이때 사람이나 사물이 복수면 those, 단수면 that으로 받아요. 동사구는 대동사로 받는데, 앞 동사가 be동사가 들어간 수동태라면 do가 아니라 be동사 형태를 써야 해요. 이 두 가지만 구분하면 비교 구문 문제는 거의 다 맞힐 수 있어요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Research on how people form impressions of others has found that negative information receives more attention, ① \u003cu class=\"p-u\">is processed\u003c/u> more thoroughly, and contributes more strongly to an impression than does positive information. Similarly, in the language of emotions and emotion-related words, there ② \u003cu class=\"p-u\">is\u003c/u> consistent evidence that humans have many more (one-and-a-half times more) words for negative emotions than for positive emotions. With respect to self-esteem, perceptions of rejections appear to be much more important to people's self-esteem and sense of worth than ③ \u003cu class=\"p-u\">those\u003c/u> of acceptance. Research on affective forecasting shows ④ \u003cu class=\"p-u\">that\u003c/u> people overestimate the enduring impact of negative events much more than they overestimate the effect of positive events. As a final example, threatening faces in a crowd are more rapidly detected than ⑤ \u003cu class=\"p-u\">do\u003c/u> smiling faces.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① is processed\u003c/div>\u003cdiv class=\"p-op\">② is\u003c/div>\u003cdiv class=\"p-op\">③ those\u003c/div>\u003cdiv class=\"p-op\">④ that\u003c/div>\u003cdiv class=\"p-op\">⑤ do\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤ (do → are)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":154,"text":"스무 번째 문제는 부정적 정보가 더 강하게 작용한다는 내용이에요. 마지막 비교 구문에서 앞 동사가 무엇인지 확인해 보세요.","hl":"q"},{"n":155,"text":"","hl":"q","pause":7},{"n":156,"text":"정답은 다섯 번째입니다. 앞에서 are detected라는 수동태를 받아야 하므로 do가 아니라 are를 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Research on how people form impressions of others has found that negative information receives more attention, ① \u003cu class=\"p-u\">is processed\u003c/u> more thoroughly, and contributes more strongly to an impression than does positive information. Similarly, in the language of emotions and emotion-related words, there ② \u003cu class=\"p-u\">is\u003c/u> consistent evidence that humans have many more (one-and-a-half times more) words for negative emotions than for positive emotions. With respect to self-esteem, perceptions of rejections appear to be much more important to people's self-esteem and sense of worth than ③ \u003cu class=\"p-u\">those\u003c/u> of acceptance. Research on affective forecasting shows ④ \u003cu class=\"p-u\">that\u003c/u> people overestimate the enduring impact of negative events much more than they overestimate the effect of positive events. As a final example, threatening faces in a crowd are more rapidly detected than ⑤ \u003cu class=\"p-u\">do\u003c/u> smiling faces.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① is processed\u003c/div>\u003cdiv class=\"p-op\">② is\u003c/div>\u003cdiv class=\"p-op\">③ those\u003c/div>\u003cdiv class=\"p-op\">④ that\u003c/div>\u003cdiv class=\"p-op\">⑤ do\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>receives, is processed, contributes가 \u003cb class=\"key\">병렬\u003c/b> 구조로 모두 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">there is consistent evidence\u003c/b>에서 evidence는 불가산 단수라 is가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>앞의 복수명사 \u003cb class=\"key\">perceptions\u003c/b>를 받는 \u003cb class=\"key\">those\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>shows 뒤 목적절을 이끄는 접속사 \u003cb class=\"key\">that\u003c/b> 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>앞은 \u003cb class=\"key\">are detected\u003c/b> 수동태이므로 대동사는 \u003cb class=\"key\">are\u003c/b>. do → are.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤ (do → are)\u003c/span>\u003cdiv class=\"p-full\">threatening faces in a crowd are more rapidly detected than are smiling faces.\u003c/div>\u003cdiv class=\"p-ko\">군중 속에서 위협적인 얼굴은 웃는 얼굴보다 더 빠르게 감지된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>than 뒤에는 무조건 do 계열 대동사라고 외우면 ⑤를 놓칩니다.\u003c/div>","segs":[{"n":157,"text":"첫 번째는 부정적 정보가 주목을 받고, 더 철저히 처리되고, 더 강하게 기여한다는 세 동사가 나란히 연결돼요. 수동태 is processed도 병렬에 맞습니다.","hl":"st-0"},{"n":158,"text":"두 번째는 근거라는 명사가 불가산이라 단수 취급합니다. 그래서 there is가 맞아요.","hl":"st-1"},{"n":159,"text":"세 번째는 앞에 나온 인식이라는 복수명사를 받아서 those로 표현한 것이 맞습니다.","hl":"st-2"},{"n":160,"text":"네 번째는 동사 shows 뒤에 절을 이끄는 접속사 that이라 문제없습니다.","hl":"st-3"},{"n":161,"text":"다섯 번째를 보세요. 앞에서 위협적인 얼굴이 더 빨리 감지된다고 했으니 감지된다는 수동태를 받아야 해요. 그런데 do가 와 있죠. be동사를 받아야 하니까 are로 고쳐야 합니다.","hl":"st-4"},{"n":162,"text":"이 문제의 함정도 짚고 갈게요. than 뒤에는 무조건 do 계열 대동사라고 외우면 다섯 번째를 놓칩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">시제(과거/현재완료), 수동태, 대동사, 어법 판단\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>목적어가 있으면 \u003cb class=\"key\">타동사 lay\u003c/b>, 없으면 자동사 lie로 정리합니다.\u003c/li>\u003cli>특정 과거 시간 표현이 보이면 \u003cb class=\"key\">과거시제\u003c/b>, since나 지금까지의 결과는 \u003cb class=\"key\">현재완료\u003c/b>입니다.\u003c/li>\u003cli>than과 as 뒤에서는 \u003cb class=\"key\">대동사\u003c/b>로 반복을 피하고, 앞 동사가 be동사·수동태면 \u003cb class=\"key\">be동사 형태\u003c/b>를 씁니다.\u003c/li>\u003cli>자동사(result in, consist of, last, survive)는 \u003cb class=\"key\">수동태로 쓸 수 없다\u003c/b>는 것만 기억해도 절반은 맞힙니다.\u003c/li>\u003cli>\u003cb class=\"key\">the number of는 단수\u003c/b>, \u003cb class=\"key\">a number of는 복수\u003c/b> 동사를 받습니다.\u003c/li>\u003c/ul>","segs":[{"n":163,"text":"오늘 스무 문제 정말 잘 따라와 주셨어요. 핵심은 결국 세 가지예요. 시간 표현을 보고 시제를 정하고, 목적어 유무로 능동과 수동을 가르고, 반복되는 동사는 대동사로 받는 것. 이 세 가지 기준만 손에 익히면 Chapter 1 시험은 흔들리지 않을 거예요. 복습 꼭 하시고, 다음 강의에서 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
