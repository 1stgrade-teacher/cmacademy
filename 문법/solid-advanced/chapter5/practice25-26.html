window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 5 Basic Practice (포인트 25-26)","audioDir":"practice25-26_audio","preview":false,"count":81,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">접속사와 전치사 구별, 상관접속사와 병렬 구조\u003c/div>\u003ch1>Chapter 5 Basic Practice 포인트 25-26 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, O/X 및 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 Chapter five Basic Practice, 포인트 스물다섯과 스물여섯을 함께 풀어 볼 거예요. 접속사와 전치사의 차이, 상관접속사의 병렬 구조, 그리고 문장 안에서 형태를 맞추는 문제를 차근차근 정리해 볼게요. 정답만 외우지 말고 왜 그 형태가 와야 하는지 같이 생각해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">양보 접속사 although와 전치사 despite\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">although는 \u003cb class=\"key\">절\u003c/b>을 이끌고, despite는 \u003cb class=\"key\">명사구\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">although + 주어 + 동사 / despite + 명사(구)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>although 뒤에는 완전한 절\u003c/li>\u003cli>despite 뒤에는 명사구\u003c/li>\u003cli>in spite of도 despite와 같은 전치사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Although it was raining, we went out.\u003c/div>\u003cdiv class=\"g-ko\">비가 오고 있었지만 우리는 외출했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Despite the rain, we went out.\u003c/div>\u003cdiv class=\"g-ko\">비에도 불구하고 우리는 외출했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"양보라는 말은 앞의 내용과 반대되는 상황을 말할 때 써요. although는 접속사라서 뒤에 주어와 동사가 있는 절이 와요. despite는 전치사라서 뒤에 명사구만 와요. 그래서 뒤에 절이 있으면 although를, 명사구만 있으면 despite를 골라야 해요. in spite of도 despite처럼 명사구를 받는다는 점도 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Ecosystems are dynamic, \u003cspan class=\"p-box\">\u003cspan>although\u003c/span>\u003ci>/\u003c/i>\u003cspan>despite\u003c/span>\u003c/span> some may appear unchanged.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">although\u003c/div>\u003cdiv class=\"p-op\">despite\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">although\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 although와 despite 중에서 고르는 문제예요. 쉼표 뒤에 절이 오는지 명사구가 오는지 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 although입니다. 뒤에 주어와 동사가 있는 절이 오므로 양보 접속사 although를 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Ecosystems are dynamic, \u003cspan class=\"p-box\">\u003cspan class=\"ok\">although\u003c/span>\u003ci>/\u003c/i>\u003cspan>despite\u003c/span>\u003c/span> some may appear unchanged.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">although\u003c/div>\u003cdiv class=\"p-op\">despite\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">뒤 표현 확인\u003c/b>쉼표 뒤에 some may appear unchanged라는 \u003cb class=\"key\">절\u003c/b>이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">접속사 고르기\u003c/b>절을 이끌 수 있는 양보의 \u003cb class=\"key\">접속사\u003c/b> although가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">despite 제외\u003c/b>despite는 \u003cb class=\"key\">명사구\u003c/b>를 받는 전치사이므로 여기서는 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 although\u003c/span>\u003cdiv class=\"p-full\">Ecosystems are dynamic, although some may appear unchanged.\u003c/div>\u003cdiv class=\"p-ko\">생태계는 역동적이다. 비록 일부는 변하지 않는 것처럼 보일지라도.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>뒤에 절이 있는데도 해석만 보고 despite를 고르기 쉽습니다.\u003c/div>","segs":[{"n":6,"text":"쉼표 뒤를 보면 some may appear unchanged처럼 주어와 동사가 있는 절이 와요.","hl":"st-0"},{"n":7,"text":"절을 이끌려면 접속사가 필요하므로 although를 골라야 해요.","hl":"st-1"},{"n":8,"text":"despite는 뒤에 명사구가 와야 하므로 이 자리에는 맞지 않아요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 뒤에 절이 있는데도 해석만 보고 despite를 고르기 쉽습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">상관접속사 not only A but also B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">not only와 but also 뒤에는 \u003cb class=\"key\">같은 품사·구조\u003c/b>가 와야 한다.\u003cdiv>\u003cspan class=\"g-formula\">not only + A + but also + B\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>not only 뒤와 but also 뒤를 비교\u003c/li>\u003cli>명사·전치사구·to부정사 등을 같은 형태로\u003c/li>\u003cli>해석은 A뿐만 아니라 B도\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is not only smart but also kind.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 똑똑할 뿐만 아니라 친절하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The goal is not only to prevent collusion but also to prevent influence.\u003c/div>\u003cdiv class=\"g-ko\">목표는 공모를 막는 것뿐만 아니라 영향을 주는 것도 막는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"not only와 but also는 한 쌍으로 쓰여서 앞뒤에 같은 형태가 와야 해요. not only 뒤에 명사가 오면 but also 뒤에도 명사가 와야 하고, to부정사가 오면 but also 뒤에도 to부정사가 와야 해요. 해석은 앞의 것뿐만 아니라 뒤의 것도라는 뜻이에요. 짝을 이루는 표현이므로 한쪽만 보고 답을 고르면 안 돼요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Smoking is not only bad for your health \u003cspan class=\"p-box\">\u003cspan>so\u003c/span>\u003ci>/\u003c/i>\u003cspan>but\u003c/span>\u003c/span> also for your wallet.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">so\u003c/div>\u003cdiv class=\"p-op\">but\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">but\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 not only와 but also의 짝을 찾는 문제예요. not only 뒤와 also 앞의 표현이 어떻게 연결되는지 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 but입니다. not only와 but also가 한 쌍으로 쓰이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Smoking is not only bad for your health \u003cspan class=\"p-box\">\u003cspan>so\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">but\u003c/span>\u003c/span> also for your wallet.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">so\u003c/div>\u003cdiv class=\"p-op\">but\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">짝 찾기\u003c/b>not only와 함께 쓰이는 짝은 \u003cb class=\"key\">but also\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">so 확인\u003c/b>so는 여기서 not only와 짝을 이루는 표현이 아닙니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>but을 넣어 \u003cb class=\"key\">not only A but also B\u003c/b> 구조를 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 but\u003c/span>\u003cdiv class=\"p-full\">Smoking is not only bad for your health but also for your wallet.\u003c/div>\u003cdiv class=\"p-ko\">흡연은 건강에 나쁠 뿐만 아니라 지갑에도 나쁘다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>not only를 보고도 so를 골라 짝을 놓치는 경우가 많습니다.\u003c/div>","segs":[{"n":14,"text":"not only가 나오면 but also가 짝을 이룬다는 것을 먼저 떠올려요.","hl":"st-0"},{"n":15,"text":"so는 원인과 결과를 말할 때 쓰는 표현이라서 이 짝에는 맞지 않아요.","hl":"st-1"},{"n":16,"text":"그래서 but을 넣어 not only와 but also의 짝을 완성하면 됩니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. not only를 보고도 so를 골라 짝을 놓치는 경우가 많습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">상관접속사 not A but B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">not A but B는 A가 아니라 B라는 뜻으로, A와 B에 \u003cb class=\"key\">같은 형태\u003c/b>가 온다.\u003cdiv>\u003cspan class=\"g-formula\">not + A + but + B\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>A와 B의 품사·구조 일치\u003c/li>\u003cli>가격이 아니라 의도처럼 대조\u003c/li>\u003cli>but 뒤의 B를 기준으로 앞 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He is not a teacher but a doctor.\u003c/div>\u003cdiv class=\"g-ko\">그는 선생님이 아니라 의사다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">What matters is not the price but the intention.\u003c/div>\u003cdiv class=\"g-ko\">중요한 것은 가격이 아니라 의도다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"not A but B는 앞의 것이 아니라 뒤의 것이라는 뜻이에요. 이때 not 뒤와 but 뒤에는 같은 품사나 같은 구조가 와야 해요. 가격이 아니라 의도처럼 두 요소를 대조해서 볼 때 자주 나와요. but 뒤에 오는 표현을 기준으로 앞의 형태도 함께 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">What makes gifts valuable is not the price \u003cspan class=\"p-box\">\u003cspan>as\u003c/span>\u003ci>/\u003c/i>\u003cspan>but\u003c/span>\u003c/span> the intention.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">as\u003c/div>\u003cdiv class=\"p-op\">but\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">but\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 not A but B 구조를 찾는 문제예요. not 뒤와 but 뒤에 어떤 표현이 나란히 오는지 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 but입니다. not the price but the intention처럼 두 명사구를 대조하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">What makes gifts valuable is not the price \u003cspan class=\"p-box\">\u003cspan>as\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">but\u003c/span>\u003c/span> the intention.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">as\u003c/div>\u003cdiv class=\"p-op\">but\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">구조 확인\u003c/b>not the price와 대조되는 표현이 뒤에 오므로 \u003cb class=\"key\">not A but B\u003c/b> 구조입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">as 확인\u003c/b>as는 여기서 A가 아니라 B라는 대조의 짝이 아닙니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>but을 넣어 \u003cb class=\"key\">the price\u003c/b>와 \u003cb class=\"key\">the intention\u003c/b>을 대조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 but\u003c/span>\u003cdiv class=\"p-full\">What makes gifts valuable is not the price but the intention.\u003c/div>\u003cdiv class=\"p-ko\">선물을 가치 있게 만드는 것은 가격이 아니라 의도다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>not과 but의 대조 구조를 놓치고 as를 고르기 쉽습니다.\u003c/div>","segs":[{"n":22,"text":"not the price 뒤에 대조되는 표현이 이어지므로 not A but B 구조를 생각해요.","hl":"st-0"},{"n":23,"text":"as는 이 자리에서 not과 짝을 이루어 A가 아니라 B라는 뜻을 만들지 않아요.","hl":"st-1"},{"n":24,"text":"그래서 but을 넣어 가격이 아니라 의도라는 대조를 만들어야 해요.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. not과 but의 대조 구조를 놓치고 as를 고르기 쉽습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">시간 접속사 while과 전치사 during\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">while은 \u003cb class=\"key\">절\u003c/b>을, during은 \u003cb class=\"key\">명사구\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">while + 주어 + 동사 / during + 명사(구)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>while 뒤에 완전한 절\u003c/li>\u003cli>during 뒤에는 명사구\u003c/li>\u003cli>특정 기간을 말할 때 during을 씀\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He called while I was studying.\u003c/div>\u003cdiv class=\"g-ko\">내가 공부하고 있는 동안 그는 전화했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He called during the break.\u003c/div>\u003cdiv class=\"g-ko\">휴식 시간 동안 그는 전화했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"while은 접속사라서 뒤에 주어와 동사가 있는 절이 와요. during은 전치사라서 뒤에 명사구만 와요. 그래서 뒤에 peak usage periods처럼 명사구가 오면 during을 골라요. while 뒤에는 보통 주어와 동사가 함께 나온다는 점을 먼저 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Power companies sometimes have trouble meeting demand \u003cspan class=\"p-box\">\u003cspan>while\u003c/span>\u003ci>/\u003c/i>\u003cspan>during\u003c/span>\u003c/span> peak usage periods.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">while\u003c/div>\u003cdiv class=\"p-op\">during\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">during\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 while과 during 중에서 고르는 문제예요. 뒤에 peak usage periods라는 명사구가 오는지 절이 오는지 확인해 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 during입니다. 뒤에 명사구가 오므로 전치사 during을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Power companies sometimes have trouble meeting demand \u003cspan class=\"p-box\">\u003cspan>while\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">during\u003c/span>\u003c/span> peak usage periods.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">while\u003c/div>\u003cdiv class=\"p-op\">during\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">뒤 표현 확인\u003c/b>뒤에 peak usage periods라는 \u003cb class=\"key\">명사구\u003c/b>가 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">while 제외\u003c/b>while은 \u003cb class=\"key\">절\u003c/b>을 이끄는 접속사이므로 명사구 앞에 쓸 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>명사구 앞에는 전치사 \u003cb class=\"key\">during\u003c/b>을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 during\u003c/span>\u003cdiv class=\"p-full\">Power companies sometimes have trouble meeting demand during peak usage periods.\u003c/div>\u003cdiv class=\"p-ko\">전력 회사들은 때때로 사용량이 많은 기간 동안 수요를 맞추는 데 어려움을 겪는다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>peak usage periods를 기간으로만 생각하고 while을 고르기 쉽습니다.\u003c/div>","segs":[{"n":30,"text":"뒤를 보면 peak usage periods라는 명사구가 와요.","hl":"st-0"},{"n":31,"text":"while은 뒤에 주어와 동사가 있는 절이 와야 하므로 이 자리에는 맞지 않아요.","hl":"st-1"},{"n":32,"text":"명사구 앞에는 전치사 during을 써서 during peak usage periods로 만들어야 해요.","hl":"st-2"},{"n":33,"text":"이 문제의 함정도 짚고 갈게요. peak usage periods를 기간으로만 생각하고 while을 고르기 쉽습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">상관접속사 either A or B, both A and B, neither A nor B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">either, both, neither 뒤에는 \u003cb class=\"key\">병렬 구조\u003c/b>가 와야 한다.\u003cdiv>\u003cspan class=\"g-formula\">either + A + or + B / both + A + and + B / neither + A + nor + B\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>A와 B는 같은 품사\u003c/li>\u003cli>both는 and, neither는 nor와 짝\u003c/li>\u003cli>동사원형끼리도 병렬 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Cats can be either liquid or solid.\u003c/div>\u003cdiv class=\"g-ko\">고양이는 액체일 수도 고체일 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Avoid habits that bother both employees and guests.\u003c/div>\u003cdiv class=\"g-ko\">직원과 손님 모두를 괴롭히는 습관을 피하라.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I neither know nor care about him.\u003c/div>\u003cdiv class=\"g-ko\">나는 그를 알지도 관심도 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"either와 or, both와 and, neither와 nor는 각각 짝을 이루는 상관접속사예요. 이때 앞과 뒤에는 같은 품사나 같은 구조가 와야 해요. either liquid or solid처럼 형용사끼리, both employees and guests처럼 명사끼리 맞춰야 하죠. neither know nor care처럼 동사원형끼리 맞추는 것도 중요해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Cats can be either liquid or \u003cu class=\"p-u\">solidity\u003c/u>, depending on the circumstances.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">solidity → solid\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"이번에는 밑줄 친 solidity가 어법에 맞는지 판단하는 문제예요. either와 or 사이의 liquid와 뒤의 표현이 같은 품사로 병렬되는지 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":7},{"n":37,"text":"solidity는 명사라서 liquid와 병렬이 되지 않아요. 형용사 solid로 고쳐서 either liquid or solid로 만들어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Cats can be either liquid or \u003cu class=\"p-u\">solidity\u003c/u>, depending on the circumstances.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">병렬 구조 확인\u003c/b>either A or B에서 A와 B는 \u003cb class=\"key\">같은 품사\u003c/b>로 병렬되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">품사 판단\u003c/b>liquid는 형용사로 쓰였으므로 뒤에도 형용사 \u003cb class=\"key\">solid\u003c/b>가 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>solidity를 \u003cb class=\"key\">solid\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 solidity → solid\u003c/span>\u003cdiv class=\"p-full\">Cats can be either liquid or solid, depending on the circumstances.\u003c/div>\u003cdiv class=\"p-ko\">고양이는 상황에 따라 액체일 수도 고체일 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>solidity가 명사라는 점을 놓치고 그대로 두기 쉽습니다.\u003c/div>","segs":[{"n":38,"text":"either와 or 사이, or 뒤를 비교해 보세요. 두 자리는 같은 품사로 맞춰야 해요.","hl":"st-0"},{"n":39,"text":"앞의 liquid가 형용사로 쓰였죠. 그래서 뒤의 solidity를 형용사인 solid로 바꿔야 해요.","hl":"st-1"},{"n":40,"text":"따라서 밑줄 친 부분은 solid로 고치면 됩니다.","hl":"st-2"},{"n":41,"text":"이 문제의 함정도 짚고 갈게요. solidity가 명사라는 점을 놓치고 그대로 두기 쉽습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Avoid these rude habits that bother both hotel employees and \u003cu class=\"p-u\">other guests\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":42,"text":"밑줄 친 other guests가 맞는지 보는 문제예요. both와 and 사이, 그리고 and 뒤의 표현이 나란히 연결되는지 확인해 보세요.","hl":"q"},{"n":43,"text":"","hl":"q","pause":7},{"n":44,"text":"이 문장은 hotel employees와 other guests가 모두 명사구로 나란히 연결되어 있어요. 그래서 그대로 두면 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Avoid these rude habits that bother both hotel employees and \u003cu class=\"p-u\">other guests\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">both A and B 확인\u003c/b>both와 and 사이에는 \u003cb class=\"key\">병렬 구조\u003c/b>가 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">명사 확인\u003c/b>hotel employees와 other guests가 모두 \u003cb class=\"key\">명사구\u003c/b>로 병렬됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>구조가 맞으므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">Avoid these rude habits that bother both hotel employees and other guests.\u003c/div>\u003cdiv class=\"p-ko\">직원과 다른 손님 모두를 괴롭히는 이런 무례한 습관을 피하라.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>other guests를 명사구로 보지 않고 불필요하게 고치려는 경우가 있습니다.\u003c/div>","segs":[{"n":45,"text":"both와 and가 짝을 이루고 있으므로 앞뒤 표현이 나란히 연결되는지 보세요.","hl":"st-0"},{"n":46,"text":"hotel employees도 명사구이고 other guests도 명사구라서 형태가 잘 맞아요.","hl":"st-1"},{"n":47,"text":"그래서 이 문장은 그대로 두면 됩니다.","hl":"st-2"},{"n":48,"text":"이 문제의 함정도 짚고 갈게요. other guests를 명사구로 보지 않고 불필요하게 고치려는 경우가 있습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">이유 접속사 because·since와 전치사 because of\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">because와 since는 \u003cb class=\"key\">절\u003c/b>을, because of는 \u003cb class=\"key\">명사구\u003c/b>를 받는다.\u003cdiv>\u003cspan class=\"g-formula\">because/since + 주어 + 동사 / because of + 명사(구)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>because of 뒤에는 명사구\u003c/li>\u003cli>since는 이유 접속사로도 쓰임\u003c/li>\u003cli>because of는 한 덩어리 전치사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He was late because it snowed.\u003c/div>\u003cdiv class=\"g-ko\">눈이 왔기 때문에 그는 늦었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He was late because of the snow.\u003c/div>\u003cdiv class=\"g-ko\">눈 때문에 그는 늦었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"because와 since는 이유를 말하는 접속사라서 뒤에 절이 와요. because of는 전치사 덩어리라서 뒤에 명사구가 와요. 그래서 뒤에 the chemical properties 같은 명사구가 있으면 because of를 써야 해요. since는 시간의 뜻도 있지만 이유를 나타내는 접속사로도 자주 쓰인다는 점 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Blue was the chosen color for denim \u003cu class=\"p-u\">because\u003c/u> the chemical properties of blue dye.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">because → because of\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":50,"text":"밑줄 친 because가 맞는지 판단하는 문제예요. 뒤에 절이 오는지 명사구가 오는지 확인해 보세요.","hl":"q"},{"n":51,"text":"","hl":"q","pause":7},{"n":52,"text":"뒤에 the chemical properties라는 명사구가 오므로 because가 아니라 because of를 써야 해요. 그래서 because of로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Blue was the chosen color for denim \u003cu class=\"p-u\">because\u003c/u> the chemical properties of blue dye.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">뒤 표현 확인\u003c/b>뒤에 the chemical properties라는 \u003cb class=\"key\">명사구\u003c/b>가 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">because of 선택\u003c/b>명사구 앞에는 전치사 \u003cb class=\"key\">because of\u003c/b>를 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답\u003c/b>because를 \u003cb class=\"key\">because of\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 because → because of\u003c/span>\u003cdiv class=\"p-full\">Blue was the chosen color for denim because of the chemical properties of blue dye.\u003c/div>\u003cdiv class=\"p-ko\">파란색은 청바지에 사용되는 염료의 화학적 특성 때문에 선택된 색이었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>because 뒤에 절이 없다는 점을 놓치고 그대로 두기 쉽습니다.\u003c/div>","segs":[{"n":53,"text":"밑줄 뒤를 보면 the chemical properties라는 명사구가 와요.","hl":"st-0"},{"n":54,"text":"명사구 앞에는 because가 아니라 because of를 써야 해요.","hl":"st-1"},{"n":55,"text":"그래서 because를 because of로 고치면 됩니다.","hl":"st-2"},{"n":56,"text":"이 문제의 함정도 짚고 갈게요. because 뒤에 절이 없다는 점을 놓치고 그대로 두기 쉽습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">The old man asked his daughter to come closer \u003cu class=\"p-u\">since\u003c/u> he wanted to say something to her.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":57,"text":"밑줄 친 since가 맞는지 보는 문제예요. since 뒤에 주어와 동사가 있는 절이 오는지 확인해 보세요.","hl":"q"},{"n":58,"text":"","hl":"q","pause":7},{"n":59,"text":"since 뒤에 he wanted to say something to her라는 절이 와요. 이유를 나타내는 접속사 since로 문법에 맞으므로 그대로 두면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">O/X 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">The old man asked his daughter to come closer \u003cu class=\"p-u\">since\u003c/u> he wanted to say something to her.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">since 뒤 확인\u003c/b>since 뒤에 he wanted to say something to her라는 \u003cb class=\"key\">절\u003c/b>이 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">접속사 판단\u003c/b>since는 이유를 나타내는 \u003cb class=\"key\">접속사\u003c/b>로 절을 이끌 수 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>문법에 맞으므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">The old man asked his daughter to come closer since he wanted to say something to her.\u003c/div>\u003cdiv class=\"p-ko\">그 노인은 딸에게 하고 싶은 말이 있었기 때문에 더 가까이 오라고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>since를 시간의 뜻으로만 기억해서 틀렸다고 판단하기 쉽습니다.\u003c/div>","segs":[{"n":60,"text":"since 뒤를 보면 he wanted to say something to her처럼 주어와 동사가 있는 절이 와요.","hl":"st-0"},{"n":61,"text":"since는 이유를 나타내는 접속사로 절을 이끌 수 있어요.","hl":"st-1"},{"n":62,"text":"그래서 밑줄 친 since는 그대로 두면 됩니다.","hl":"st-2"},{"n":63,"text":"이 문제의 함정도 짚고 갈게요. since를 시간의 뜻으로만 기억해서 틀렸다고 판단하기 쉽습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">The rule of independence can be applied (1) \u003cu class=\"p-u\">while\u003c/u> good police procedure. When there are multiple witnesses to an event, they are not allowed to discuss it before giving their testimony. The goal is not only to prevent collusion by hostile witnesses, it is also (2) \u003cu class=\"p-u\">preventing\u003c/u> witnesses from influencing each other.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) during (2) to prevent\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":64,"text":"이번에는 두 개의 밑줄이 있는 지문이에요. 각 밑줄 뒤에 절이 오는지 명사구가 오는지, 그리고 병렬 구조가 맞는지 확인하면서 읽어 보세요.","hl":"q"},{"n":65,"text":"","hl":"q","pause":7},{"n":66,"text":"첫 번째 밑줄은 during으로, 두 번째 밑줄은 to prevent로 고칩니다. 앞뒤에 명사구가 오는지, not only와 also의 병렬이 맞는지를 보면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The rule of independence can be applied (1) \u003cu class=\"p-u\">while\u003c/u> good police procedure. When there are multiple witnesses to an event, they are not allowed to discuss it before giving their testimony. The goal is not only to prevent collusion by hostile witnesses, it is also (2) \u003cu class=\"p-u\">preventing\u003c/u> witnesses from influencing each other.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) while 뒤 확인\u003c/b>while 뒤에 good police procedure라는 \u003cb class=\"key\">명사구\u003c/b>가 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(1) during으로\u003c/b>명사구 앞에는 전치사 \u003cb class=\"key\">during\u003c/b>을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(2) 병렬 확인\u003c/b>not only to prevent와 병렬이 되려면 it is also 뒤에 \u003cb class=\"key\">to prevent\u003c/b>가 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답\u003c/b>(1)은 \u003cb class=\"key\">during\u003c/b>, (2)는 \u003cb class=\"key\">to prevent\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) during (2) to prevent\u003c/span>\u003cdiv class=\"p-full\">The rule of independence can be applied during good police procedure. When there are multiple witnesses to an event, they are not allowed to discuss it before giving their testimony. The goal is not only to prevent collusion by hostile witnesses, it is also to prevent witnesses from influencing each other.\u003c/div>\u003cdiv class=\"p-ko\">독립성 규칙은 적절한 경찰 절차 중에 적용될 수 있다. 사건에 여러 목격자가 있을 때, 그들은 증언하기 전에 사건에 대해 논의할 수 없다. 목표는 적대적인 목격자들의 공모를 막는 것뿐만 아니라 목격자들이 서로에게 영향을 주는 것을 막는 것이기도 하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>while 뒤에 명사구가 와도 습관적으로 while을 고르지 않도록 주의합니다.\u003c/div>","segs":[{"n":67,"text":"먼저 첫 번째 밑줄을 보세요. while 뒤에 주어와 동사가 아니라 명사구가 와요.","hl":"st-0"},{"n":68,"text":"이럴 때는 접속사 while이 아니라 전치사 during을 써야 해요.","hl":"st-1"},{"n":69,"text":"두 번째 밑줄은 not only to prevent와 짝을 이루는 부분이에요. also 뒤에도 to부정사가 와야 자연스러워요.","hl":"st-2"},{"n":70,"text":"그래서 첫 번째는 during, 두 번째는 to prevent로 고치면 됩니다.","hl":"st-3"},{"n":71,"text":"이 문제의 함정도 짚고 갈게요. while 뒤에 명사구가 와도 습관적으로 while을 고르지 않도록 주의합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">and로 연결되는 병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and로 두 요소를 연결할 때는 \u003cb class=\"key\">같은 품사\u003c/b>로 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">형용사 + and + 형용사 / 동사 + and + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주격 보어는 형용사\u003c/li>\u003cli>and 앞뒤 품사 확인\u003c/li>\u003cli>병렬 구조는 문장 전체 균형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I am cold and silent.\u003c/div>\u003cdiv class=\"g-ko\">나는 차갑고 조용하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She sings and dances.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 노래하고 춤춘다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":72,"text":"and로 두 요소를 연결할 때는 앞과 뒤의 품사를 같게 맞춰야 해요. 주격 보어 자리라면 형용사와 형용사를 연결해야 자연스러워요. I am cold and silent처럼 cold와 silent가 모두 형용사로 나란히 와야 하죠. and 앞뒤를 눈으로 비교하는 습관을 들이면 병렬 문제가 쉬워져요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">I am always a little cold and (1) \u003cu class=\"p-u\">silently\u003c/u> at first, particularly to people whom I neither know nor (2) \u003cu class=\"p-u\">caring\u003c/u> about. This may make people think of me as a cynical and unapproachable person. However, as I spend more time with them, I gradually begin to relax and become more sociable. People begin to like me (3) \u003cu class=\"p-u\">although\u003c/u> the first impression they had.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) silent (2) care (3) despite 또는 in spite of\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":73,"text":"마지막 지문에는 세 개의 밑줄이 있어요. and와 neither nor, although 뒤의 형태를 중심으로 차근차근 살펴보세요.","hl":"q"},{"n":74,"text":"","hl":"q","pause":7},{"n":75,"text":"첫 번째는 silent, 두 번째는 care, 세 번째는 despite 또는 in spite of로 고칩니다. 형용사 병렬, 동사원형 병렬, 명사구를 받는 전치사를 확인한 결과예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">I am always a little cold and (1) \u003cu class=\"p-u\">silently\u003c/u> at first, particularly to people whom I neither know nor (2) \u003cu class=\"p-u\">caring\u003c/u> about. This may make people think of me as a cynical and unapproachable person. However, as I spend more time with them, I gradually begin to relax and become more sociable. People begin to like me (3) \u003cu class=\"p-u\">although\u003c/u> the first impression they had.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 형용사 병렬\u003c/b>cold와 silently가 and로 연결되므로 둘 다 \u003cb class=\"key\">형용사\u003c/b>여야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 동사원형 병렬\u003c/b>neither A nor B에서 know와 \u003cb class=\"key\">care\u003c/b>가 동사원형으로 병렬되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) although 뒤 확인\u003c/b>although 뒤에 the first impression이라는 \u003cb class=\"key\">명사구\u003c/b>가 오므로 전치사 \u003cb class=\"key\">despite\u003c/b> 또는 \u003cb class=\"key\">in spite of\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답\u003c/b>(1) silent, (2) care, (3) \u003cb class=\"key\">despite\u003c/b> 또는 \u003cb class=\"key\">in spite of\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) silent (2) care (3) despite 또는 in spite of\u003c/span>\u003cdiv class=\"p-full\">I am always a little cold and silent at first, particularly to people whom I neither know nor care about. This may make people think of me as a cynical and unapproachable person. However, as I spend more time with them, I gradually begin to relax and become more sociable. People begin to like me despite the first impression they had.\u003c/div>\u003cdiv class=\"p-ko\">나는 처음에는 특히 잘 알지도 않고 관심도 없는 사람들에게 다소 차갑고 조용하다. 이것은 사람들이 나를 냉소적이고 다가가기 어려운 사람으로 생각하게 만들 수 있다. 그러나 그들과 더 많은 시간을 보내면서 나는 점차 긴장을 풀고 더 사교적으로 변한다. 사람들은 그들이 가졌던 첫인상에도 불구하고 나를 좋아하기 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>and와 neither nor로 연결된 요소는 품사를 반드시 맞춰야 합니다.\u003c/div>","segs":[{"n":76,"text":"첫 번째 밑줄 앞을 보면 cold가 형용사로 쓰였어요. and로 연결된 silently도 형용사 silent로 맞춰야 해요.","hl":"st-0"},{"n":77,"text":"두 번째 밑줄은 neither know nor 뒤에 이어져요. know와 같은 동사원형 care가 와야 하죠.","hl":"st-1"},{"n":78,"text":"세 번째 밑줄 뒤에는 절이 아니라 명사구가 와요. 그래서 although 대신 despite나 in spite of를 써야 해요.","hl":"st-2"},{"n":79,"text":"정리하면 첫 번째는 silent, 두 번째는 care, 세 번째는 despite나 in spite of로 고치면 됩니다.","hl":"st-3"},{"n":80,"text":"이 문제의 함정도 짚고 갈게요. and와 neither nor로 연결된 요소는 품사를 반드시 맞춰야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">접속사와 전치사 구별, 상관접속사와 병렬 구조\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>뒤에 \u003cb class=\"key\">절\u003c/b>이 오면 접속사, \u003cb class=\"key\">명사구\u003c/b>가 오면 전치사를 고릅니다.\u003c/li>\u003cli>not only A but also B, not A but B, either A or B, both A and B, neither A nor B는 \u003cb class=\"key\">병렬 구조\u003c/b>를 맞춥니다.\u003c/li>\u003cli>and로 연결된 요소는 \u003cb class=\"key\">같은 품사\u003c/b>여야 합니다.\u003c/li>\u003cli>이유는 because나 since 뒤에 절, because of 뒤에 명사구로 구분합니다.\u003c/li>\u003cli>양보는 although 뒤에 절, despite나 in spite of 뒤에 명사구로 구분합니다.\u003c/li>\u003c/ul>","segs":[{"n":81,"text":"오늘은 접속사와 전치사의 차이, 상관접속사의 병렬 구조를 확인했어요. 뒤에 절이 오면 접속사, 명사구가 오면 전치사를 고르는 습관을 기억해 주세요. 상관접속사는 앞뒤 형태를 꼭 같게 맞춰야 한다는 점도 잊지 마세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
