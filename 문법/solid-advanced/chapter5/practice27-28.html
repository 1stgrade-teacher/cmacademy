window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 5 Basic Practice (포인트 27-28)","audioDir":"practice27-28_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">명사절 접속사 whether와 that, 전치사 뒤 동명사, to부정사 표현, 동격의 that\u003c/div>\u003ch1>Chapter 5 Basic Practice 포인트 27-28 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 옳고 그름 판단, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 기본 연습 문제에서 명사절 접속사와 동명사, to부정사, 그리고 동격의 that을 구별하는 문제를 함께 풀어 볼 거예요. 문제마다 무엇을 먼저 보고 어떤 형태를 확인해야 하는지 차근차근 짚어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명사절 접속사 whether와 that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">‘~인지 아닌지’는 \u003cb class=\"key\">whether\u003c/b> 또는 if로, ‘~라는 사실·생각’은 \u003cb class=\"key\">that\u003c/b>으로 이끕니다. whether는 or not과 함께 자주 쓰입니다.\u003cdiv>\u003cspan class=\"g-formula\">whether + 주어 + 동사 + or not / that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>or not이 보이면 whether를 우선 확인\u003c/li>\u003cli>사실·주장·생각의 내용은 that\u003c/li>\u003cli>that절은 주어와 동사가 완전한 절\u003c/li>\u003cli>문장 앞의 whether절은 주어 역할 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wonder whether he will come.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 올지 궁금하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I know that he is honest.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 정직하다는 것을 안다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, 명사절을 이끄는 접속사에서 가장 중요한 건 의미예요. ‘~인지 아닌지’라는 불확실한 내용이면 whether나 if를 쓰고, ‘~라는 사실’처럼 정해진 내용이면 that을 씁니다. 특히 whether는 or not과 함께 자주 나오니까 문제에서 or not이 보이면 먼저 whether를 떠올리세요. that은 뒤에 주어와 동사가 있는 완전한 절이 와도 사실의 내용을 나타낼 수 있다는 점을 기억하면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Audience feedback indicates \u003cspan class=\"p-box\">\u003cspan>whether\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> listeners understand the speaker's ideas or not.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">whether\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whether\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 indicates 뒤에 whether와 that 중 무엇이 알맞은지 고르는 문제예요. 문장 끝에 있는 or not에 주목해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 whether입니다. ‘~인지 아닌지’라는 의미이고 or not과 함께 쓰였기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Audience feedback indicates \u003cspan class=\"p-box\">\u003cspan class=\"ok\">whether\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> listeners understand the speaker's ideas or not.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">whether\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">의미 파악\u003c/b>문장은 ‘청중의 피드백은 청취자들이 화자의 생각을 이해하는지 \u003cb class=\"key\">아닌지\u003c/b>를 보여 준다’는 의미입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">or not 확인\u003c/b>문장 끝에 \u003cb class=\"key\">or not\u003c/b>이 있으므로 ‘~인지 아닌지’를 뜻하는 whether가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">that과 비교\u003c/b>that을 쓰면 ‘~라는 사실’이 되어 or not과 의미가 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 whether\u003c/span>\u003cdiv class=\"p-full\">Audience feedback indicates whether listeners understand the speaker's ideas or not.\u003c/div>\u003cdiv class=\"p-ko\">청중의 피드백은 청취자들이 화자의 생각을 이해하는지 아닌지를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>or not이 있는데 that을 고르는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 전체 의미를 보면 청취자들이 화자의 생각을 이해하는지 아닌지를 나타내고 있어요. 그래서 ‘인지 아닌지’라는 의미가 필요한 상황입니다.","hl":"st-0"},{"n":7,"text":"문장 끝에 or not이 붙어 있죠. 이때는 whether를 선택하면 자연스럽습니다.","hl":"st-1"},{"n":8,"text":"that은 사실의 내용을 나타내므로 여기에서는 or not과 어울리지 않아요. 따라서 정답은 whether입니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. or not이 있는데 that을 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤 동명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 동사원형이 아니라 \u003cb class=\"key\">동명사\u003c/b>가 옵니다. object to의 to와 ‘~에 익숙하다’의 be used to의 to는 전치사입니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + V-ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>object to, be used to, be interested in 뒤 확인\u003c/li>\u003cli>to가 전치사인지 to부정사인지 구분\u003c/li>\u003cli>전치사 뒤에는 명사 역할의 동명사\u003c/li>\u003cli>동명사는 -ing 형태로 고쳐 쓰기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I am interested in learning English.\u003c/div>\u003cdiv class=\"g-ko\">나는 영어 배우는 것에 관심이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She insisted on paying.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 지불하는 것을 주장했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"전치사 뒤에는 명사가 와야 하니까 동사는 반드시 동명사 형태로 바꿔야 해요. 예를 들어 object to는 여기서 to가 전치사라서 뒤에 paying처럼 동명사가 옵니다. be used to도 ‘~에 익숙하다’라는 뜻일 때는 to가 전치사라서 동명사가 따라와요. 시험에서는 to가 to부정사인지 전치사인지부터 확인하는 습관이 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I object to \u003cspan class=\"p-box\">\u003cspan>pay\u003c/span>\u003ci>/\u003c/i>\u003cspan>paying\u003c/span>\u003c/span> that much for this slow internet service.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">pay\u003c/div>\u003cdiv class=\"p-op\">paying\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">paying\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 object to 뒤에 어떤 형태가 와야 하는지 묻고 있어요. 여기서 to가 어떤 역할인지 생각해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 paying입니다. object to의 to는 전치사라서 뒤에 동명사가 와야 하거든요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I object to \u003cspan class=\"p-box\">\u003cspan>pay\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">paying\u003c/span>\u003c/span> that much for this slow internet service.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">pay\u003c/div>\u003cdiv class=\"p-op\">paying\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">to의 역할\u003c/b>object to의 to는 \u003cb class=\"key\">전치사\u003c/b>이므로 뒤에 동명사가 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">형태 비교\u003c/b>pay는 동사원형이고 paying은 동명사이므로 \u003cb class=\"key\">paying\u003c/b>이 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 해석\u003c/b>‘나는 이 느린 인터넷 서비스에 그렇게 많은 돈을 내는 것에 반대한다’가 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 paying\u003c/span>\u003cdiv class=\"p-full\">I object to paying that much for this slow internet service.\u003c/div>\u003cdiv class=\"p-ko\">나는 이 느린 인터넷 서비스에 그렇게 많은 돈을 내는 것에 반대한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>to를 to부정사로 오해해 pay를 고르는 것\u003c/div>","segs":[{"n":14,"text":"object to에서 to는 to부정사가 아니라 전치사예요. 전치사 뒤에는 명사 역할을 하는 동명사가 와야 합니다.","hl":"st-0"},{"n":15,"text":"그래서 동사원형 pay가 아니라 동명사 paying을 골라야 해요.","hl":"st-1"},{"n":16,"text":"문장 전체는 이 느린 인터넷 서비스에 그렇게 많은 돈을 내는 것에 반대한다는 뜻이 됩니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. to를 to부정사로 오해해 pay를 고르는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사를 취하는 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">be willing to\u003c/b>, \u003cb class=\"key\">be supposed to\u003c/b>, \u003cb class=\"key\">be likely to\u003c/b>, \u003cb class=\"key\">be eager to\u003c/b> 뒤에는 동사원형이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">be + 형용사/분사 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be willing to는 ‘기꺼이 ~하다’\u003c/li>\u003cli>be supposed to는 ‘~하기로 되어 있다’\u003c/li>\u003cli>be likely to는 ‘~할 가능성이 있다’\u003c/li>\u003cli>be eager to는 ‘간절히 ~하다’\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He is willing to try again.\u003c/div>\u003cdiv class=\"g-ko\">그는 기꺼이 다시 시도할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is likely to win.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 이길 가능성이 높다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"be willing to나 be supposed to처럼 to가 들어간 표현은 뒤에 동사원형이 오는 경우가 많아요. ‘기꺼이 하다’, ‘하기로 되어 있다’, ‘할 가능성이 있다’, ‘간절히 바라다’ 같은 표현은 모두 to부정사를 취합니다. 그래서 to 뒤에 동명사가 보이면 한 번 더 의심하고 동사원형으로 고쳐야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He is willing to \u003cspan class=\"p-box\">\u003cspan>work\u003c/span>\u003ci>/\u003c/i>\u003cspan>working\u003c/span>\u003c/span> to overcome the biases to make informed decisions.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">work\u003c/div>\u003cdiv class=\"p-op\">working\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">work\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 be willing to 뒤에 work와 working 중 무엇이 알맞은지 고르는 문제예요. to 뒤에 오는 형태를 확인해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 work입니다. be willing to는 to부정사를 취하므로 to 뒤에 동사원형이 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He is willing to \u003cspan class=\"p-box\">\u003cspan class=\"ok\">work\u003c/span>\u003ci>/\u003c/i>\u003cspan>working\u003c/span>\u003c/span> to overcome the biases to make informed decisions.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\" \u003cdiv class=\"g-ko\">그가 거짓말했다는 사실이 우리를 놀라게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The book which I bought is interesting.\u003c/div>\u003cdiv class=\"g-ko\">내가 산 책은 흥미롭다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"명사 fact나 idea 뒤에 그 내용이 무엇인지 설명하는 절이 이어질 때는 that을 씁니다. 이때 that은 관계대명사가 아니라 동격의 접속사라서 뒤에 주어와 동사가 모두 있는 완전한 절이 와요. 반면 which는 앞의 명사를 꾸미는 관계대명사라서 뒤에 빠진 주어나 목적어가 있어야 자연스럽습니다. 그래서 뒤 문장이 완전한지 불완전한지를 보면 that과 which를 구별할 수 있습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">We support the idea \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u003ci>/\u003c/i>\u003cspan>that\u003c/span>\u003c/span> everyone should have access to education.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">which\u003c/div>\u003cdiv class=\"p-op\">that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 the idea 뒤에 which와 that 중 무엇이 알맞은지 고르는 문제예요. 뒤에 오는 절이 완전한지 불완전한지 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 that입니다. 뒤 절이 완전하므로 관계대명사 which가 아니라 동격의 접속사 that이 필요해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">We support the idea \u003cspan class=\"p-box\">\u003cspan>which\u003c/span>\u
