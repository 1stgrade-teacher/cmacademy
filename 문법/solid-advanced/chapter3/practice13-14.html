window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 3 Basic Practice (포인트 13-14)","audioDir":"practice13-14_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사와 목적격 보어 어법\u003c/div>\u003ch1>Chapter 3 Basic Practice 포인트 13-14\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 옳고 그름 판단, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 분사와 목적격 보어가 함께 나오는 어법 문제를 풀어 볼 거예요. 제품이나 도로, 사람이나 동물이 어떤 행동을 직접 하는지 아니면 어떤 일을 당하는지 구별하는 연습이에요. 선택형 문제부터 틀린 부분 고치기, 긴 지문 속 어법까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재분사와 과거분사 형용사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사가 \u003cb class=\"key\">스스로 ~하는\u003c/b> 주체면 현재분사, \u003cb class=\"key\">~되는\u003c/b> 대상이거나 이미 그런 상태면 과거분사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">능동·진행 → -ing / 수동·완료 → p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>manufactured products처럼 제품이 제조되는 대상이면 과거분사\u003c/li>\u003cli>rising sea levels처럼 해수면이 스스로 오르는 변화면 현재분사\u003c/li>\u003cli>packaged foods, preferred pathways, broken leg는 모두 '되는/된' 의미의 과거분사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">rising sea levels\u003c/div>\u003cdiv class=\"g-ko\">상승하는 해수면\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">manufactured products\u003c/div>\u003cdiv class=\"g-ko\">제조된 제품\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"분사는 명사 앞이나 뒤에서 명사를 꾸며 줍니다. 명사가 스스로 그 행동을 하는 주체라면 현재분사를 쓰고, 다른 사람에 의해 그렇게 되거나 이미 그런 상태라면 과거분사를 씁니다. 예를 들어 해수면이 스스로 오르면 rising sea levels가 되고, 제품이 제조되는 대상이면 manufactured products가 됩니다. packaged foods도 식품이 포장되는 대상이라서 packaged로 씁니다. 그러니까 명사와 분사의 관계가 능동인지 수동인지부터 판단하는 습관을 가져야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Many \u003cspan class=\"p-box\">\u003cspan>manufacturing\u003c/span>\u003ci>/\u003c/i>\u003cspan>manufactured\u003c/span>\u003c/span> products contain a lot of chemicals.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">manufacturing\u003c/div>\u003cdiv class=\"p-op\">manufactured\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">manufactured\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 Many 뒤에서 products를 꾸미는 분사를 고르는 문제예요. 제품이 직접 제조하는 주체인지, 제조되는 대상인지부터 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 manufactured예요. products는 제조되는 대상이므로 과거분사 manufactured가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Many \u003cspan class=\"p-box\">\u003cspan>manufacturing\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">manufactured\u003c/span>\u003c/span> products contain a lot of chemicals.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">manufacturing\u003c/div>\u003cdiv class=\"p-op\">manufactured\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">명사 찾기\u003c/b>Many 뒤의 핵심 명사는 \u003cb class=\"key\">products\u003c/b>이고, 빈칸은 products를 꾸미는 분사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">능동·수동 판단\u003c/b>products는 \u003cb class=\"key\">제조되는\u003c/b> 대상이므로 과거분사 \u003cb class=\"key\">manufactured\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">오답 확인\u003c/b>manufacturing은 '제조하는'이라는 능동 의미라 products가 직접 제조하는 것처럼 되어 부적절합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 manufactured\u003c/span>\u003cdiv class=\"p-full\">Many manufactured products contain a lot of chemicals.\u003c/div>\u003cdiv class=\"p-ko\">많은 제조된 제품에는 화학 물질이 많이 들어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>products가 제조하는 주체가 아니라 제조되는 대상임을 놓치지 마세요.\u003c/div>","segs":[{"n":6,"text":"먼저 Many 뒤에서 꾸밈을 받는 핵심 명사를 찾아보세요. 바로 products입니다. 이제 products와 분사의 관계만 판단하면 돼요.","hl":"st-0"},{"n":7,"text":"제품은 스스로 제조하는 주체가 아니라 사람들에 의해 제조되는 대상이죠. 그래서 수동의 의미를 가진 과거분사가 필요합니다.","hl":"st-1"},{"n":8,"text":"manufacturing을 쓰면 제품이 무언가를 제조하는 주체처럼 들려요. 문맥에 맞지 않습니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. products가 제조하는 주체가 아니라 제조되는 대상임을 놓치지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">get + 목적어 + 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">get은 목적어가 \u003cb class=\"key\">~된 상태\u003c/b>가 되게 하다는 뜻으로 get + 목적어 + \u003cb class=\"key\">과거분사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">get + 목적어 + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어와 분사의 관계가 수동이면 과거분사\u003c/li>\u003cli>get your office cleaned처럼 목적어가 청소되는 대상이면 cleaned\u003c/li>\u003cli>get + 목적어 + to부정사와 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">get your office cleaned\u003c/div>\u003cdiv class=\"g-ko\">사무실이 청소되게 하다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"get은 목적어 뒤에 과거분사를 데리고 와서 목적어가 어떤 상태가 되게 만들다는 뜻을 나타낼 수 있어요. 이때 목적어와 동사의 관계는 수동이어야 합니다. 사무실은 전문적으로 청소를 하는 주체가 아니라 청소가 되는 대상이죠. 그래서 get your office cleaned라고 말합니다. 만약 to clean을 쓰면 사무실이 직접 청소하는 것처럼 되어 의미가 어색해져요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">How often should you get your office \u003cspan class=\"p-box\">\u003cspan>to clean\u003c/span>\u003ci>/\u003c/i>\u003cspan>cleaned\u003c/span>\u003c/span> professionally?\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to clean\u003c/div>\u003cdiv class=\"p-op\">cleaned\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">cleaned\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 get 뒤에 목적어와 목적격 보어가 나오는 구조예요. 사무실이 청소하는 주체인지 청소되는 대상인지 생각해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 cleaned입니다. 사무실은 전문적으로 청소되는 대상이므로 get your office cleaned 형태가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">How often should you get your office \u003cspan class=\"p-box\">\u003cspan>to clean\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">cleaned\u003c/span>\u003c/span> professionally?\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to clean\u003c/div>\u003cdiv class=\"p-op\">cleaned\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">get 구조\u003c/b>get + 목적어 + 목적격 보어 구조에서 목적어는 \u003cb class=\"key\">your office\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">목적어 관계\u003c/b>사무실은 전문적으로 \u003cb class=\"key\">청소되는\u003c/b> 대상이므로 과거분사 \u003cb class=\"key\">cleaned\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">to clean 확인\u003c/b>to clean은 사무실이 직접 청소한다는 능동 의미가 되어 문맥상 어색합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 cleaned\u003c/span>\u003cdiv class=\"p-full\">How often should you get your office cleaned professionally?\u003c/div>\u003cdiv class=\"p-ko\">얼마나 자주 사무실을 전문적으로 청소하게 해야 할까요?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>get 뒤에 to부정사를 무조건 쓰는 것이 아니라 목적어가 당하는 일이면 과거분사를 씁니다.\u003c/div>","segs":[{"n":14,"text":"먼저 get 뒤에 목적어가 오고 그 뒤에 목적격 보어가 오는 구조를 확인하세요. 목적어는 your office예요.","hl":"st-0"},{"n":15,"text":"사무실은 직접 청소하는 주체가 아니라 청소를 받는 대상이죠. 그래서 수동의 과거분사를 써야 합니다.","hl":"st-1"},{"n":16,"text":"to clean을 쓰면 사무실이 스스로 청소하는 것처럼 들려서 자연스럽지 않아요.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. get 뒤에 to부정사를 무조건 쓰는 것이 아니라 목적어가 당하는 일이면 과거분사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">find + 목적어 + 목적격 보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">find는 목적어가 \u003cb class=\"key\">어떤 상태\u003c/b>임을 알게 되다는 뜻으로 find + 목적어 + \u003cb class=\"key\">형용사·분사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">find + 목적어 + (p.p./형용사)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어의 상태를 설명하는 보어 필요\u003c/li>\u003cli>도로가 폐쇄된 상태이므로 closed\u003c/li>\u003cli>closing은 도로가 스스로 닫는 능동 의미라 부적절\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">found the main road closed\u003c/div>\u003cdiv class=\"g-ko\">주요 도로가 폐쇄된 것을 발견했다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"find는 목적어 뒤에 목적격 보어를 붙여서 목적어가 어떤 상태인지 알게 되었다는 의미를 만듭니다. 이 문제에서는 주요 도로가 홍수 때문에 폐쇄된 상태라는 점이 핵심이에요. 도로는 스스로 닫는 주체가 아니라 닫히는 대상이므로 과거분사 closed를 씁니다. closing을 쓰면 도로가 스스로 닫고 있는 것처럼 들려서 자연스럽지 않습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Motorists found the main road \u003cspan class=\"p-box\">\u003cspan>closing\u003c/span>\u003ci>/\u003c/i>\u003cspan>closed\u003c/span>\u003c/span> due to flooding.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">closing\u003c/div>\u003cdiv class=\"p-op\">closed\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">closed\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 find 뒤에 목적어와 목적격 보어가 나오는 문장이에요. 주요 도로가 어떤 상태인지에 집중해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 closed예요. 도로가 홍수 때문에 폐쇄된 상태이므로 과거분사 closed가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Motorists found the main road \u003cspan class=\"p-box\">\u003cspan>closing\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">closed\u003c/span>\u003c/span> due to flooding.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">closing\u003c/div>\u003cdiv class=\"p-op\">closed\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">find 구조\u003c/b>found 뒤에 목적어 \u003cb class=\"key\">the main road\u003c/b>가 오고, 그 뒤 빈칸은 목적어의 상태를 설명하는 목적격 보어입니다.\u003c/div>\u003cdiv class=\"p-st\ 알아차렸다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"see, hear, notice, witness 같은 지각동사 뒤에는 목적어와 목적격 보어가 옵니다. 목적어가 직접 행동하는 주체라면 동사원형이나 현재분사를 써서 그 행동을 나타냅니다. 진행 중인 느낌을 살리고 싶을 때는 현재분사가 자연스럽고, 한 번의 동작을 간단히 말할 때는 동사원형을 씁니다. 반대로 목적어가 어떤 일을 당하는 대상이면 과거분사를 써야 합니다. 그래서 목적어와 보어의 관계가 능동인지 수동인지 늘 확인해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">We are witnessing more people \u003cspan class=\"p-box\">\u003cspan>moving\u003c/span>\u003ci>/\u003c/i>\u003cspan>moved\u003c/span>\u003c/span> to rural areas for a better way of life.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">moving\u003c/div>\u003cdiv class=\"p-op\">moved\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">moving\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 사람들이 시골로 이동하는 장면을 표현한 문장이에요. people이 행동을 직접 하는지, 당하는지 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 moving이에요. 사람들이 스스로 시골로 이동하는 주체이므로 현재분사 moving이 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>A. 네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">We are witnessing more people \u003cspan class=\"p-box\">\u003cspan class=\"ok\">moving\u003c/span>\u003ci>/\u003c/i>\u003cspan>moved\u003c/span>\u003c/span> to rural areas for a better way of life.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">moving\u003c/div>\u003cdiv class=\"p-op\">moved\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 구조\u003c/b>witness는 지각동사처럼 목적어 뒤에 \u003cb class=\"key\">현재분사\u003c/b>나 동사원형을 취해 목적어가 하는 행동을 나타낼 수 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">능동·진행 판단\u003c/b>people은 시골로 \u003cb class=\"key\">이동하는\u003c/b> 주체이므로 현재분사 \u003cb class=\"key\">moving\u003c/b>이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">moved 확인\u003c/b>moved는 사람들이 '이동된' 수동 의미가 되어 부적절합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 moving\u003c/span>\u003cdiv class=\"p-full\">We are witnessing more people moving to rural areas for a better way of life.\u003c/div>\u003cdiv class=\"p-ko\">우리는 더 많은 사람들이 더 나은 삶을 위해 시골 지역으로 이동하는 것을 목격하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>목적어가 직접 하는 행동이면 현재분사나 동사원형, 당하는 일이면 과거분사를 씁니다.\u003c/div>","segs":[{"n":30,"text":"witness 뒤에 목적어 people이 오고 그 뒤에 동사의 형태가 이어지죠. 여기서는 사람들이 하는 행동을 표현하는 구조로 보면 됩니다.","hl":"st-0"},{"n":31,"text":"사람들은 이사를 당하는 대상이 아니라 스스로 시골로 이동하는 주체예요. 그래서 능동의 현재분사가 필요합니다.","hl":"st-1"},{"n":32,"text":"moved를 쓰면 사람들이 누군가에 의해 옮겨진 것처럼 들려서 자연스럽지 않습니다.","hl":"st-2"},{"n":33,"text":"이 문제의 함정도 짚고 갈게요. 목적어가 직접 하는 행동이면 현재분사나 동사원형, 당하는 일이면 과거분사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">get + 목적어 + to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">get이 목적어에게 \u003cb class=\"key\">~하게 하다\u003c/b>는 뜻으로 쓰일 때는 get + 목적어 + \u003cb class=\"key\">to부정사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">get + 목적어 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 직접 행동하는 능동 관계\u003c/li>\u003cli>get your dog to respect you처럼 개가 존경하는 주체\u003c/li>\u003cli>get + 목적어 + p.p.와 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">get your dog to respect you\u003c/div>\u003cdiv class=\"g-ko\">개가 너를 존경하게 하다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"get이 목적어에게 어떤 행동을 하게 만든다는 뜻일 때는 목적어 뒤에 to부정사를 씁니다. 여기서는 개가 주인을 리더로 존경하는 주체이므로 to respect가 맞아요. respected를 쓰면 개가 존경을 받는 대상이 되어 의미가 반대로 뒤집힙니다. 그러니까 목적어가 행동을 직접 하는지, 행동을 당하는지에 따라 to부정사와 과거분사를 구별해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>B. 밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">You should get your dog \u003cu class=\"p-u\">respected\u003c/u> you as his leader.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">respected → to respect\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"첫 번째 고치기 문제는 get 뒤에 개가 해야 할 행동을 붙인 문장이에요. 개가 존경하는 주체인지 존경받는 대상인지 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":7},{"n":37,"text":"정답은 to respect입니다. 개가 주인을 존경하는 능동 관계이므로 get your dog to respect you가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>B. 밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">You should get your dog \u003cu class=\"p-u\">respected\u003c/u> you as his leader.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">get 구조\u003c/b>get 뒤의 목적어는 \u003cb class=\"key\">your dog\u003c/b>이고, 빈칸은 개가 해야 할 행동을 나타내는 목적격 보어 자리입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">능동 관계\u003c/b>개가 주인을 리더로 \u003cb class=\"key\">존경하는\u003c/b> 주체이므로 get + 목적어 + \u003cb class=\"key\">to부정사\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">고치기\u003c/b>respected를 \u003cb class=\"key\">to respect\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 respected → to respect\u003c/span>\u003cdiv class=\"p-full\">You should get your dog to respect you as his leader.\u003c/div>\u003cdiv class=\"p-ko\">너는 네 개가 너를 리더로 존경하게 해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>get + 목적어 + p.p.는 목적어가 당하는 일, get + 목적어 + to부정사는 목적어가 직접 하는 일에 씁니다.\u003c/div>","segs":[{"n":38,"text":"get 뒤에서 목적어를 찾아보세요. your dog가 목적어이고, respected 자리는 개가 무엇을 해야 하는지 말해 주는 자리입니다.","hl":"st-0"},{"n":39,"text":"개는 주인을 존경하는 주체예요. 목적어가 직접 행동하게 만들 때는 get 뒤에 to부정사를 씁니다.","hl":"st-1"},{"n":40,"text":"그래서 respected를 to respect로 고쳐야 합니다. respected를 그대로 두면 개가 존경을 받는 대상이 되어 의미가 달라져요.","hl":"st-2"},{"n":41,"text":"이 문제의 함정도 짚고 갈게요. get + 목적어 + p.p.는 목적어가 당하는 일, get + 목적어 + to부정사는 목적어가 직접 하는 일에 씁니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">옳고 그름 판단\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B2\u003c/span>B. 밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Scientists argue that coastal towns have to prepare for \u003cu class=\"p-u\">rising\u003c/u> sea levels.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":42,"text":"두 번째 문제는 해수면을 꾸미는 분사가 맞는지 확인하는 문장이에요. 해수면이 스스로 오르는지, 오르게 되는지 생각해 보세요.","hl":"q"},{"n":43,"text":"","hl":"q","pause":7},{"n":44,"text":"정답은 맞음입니다. 해수면이 스스로 상승하는 주체이므로 현재분사 risi  맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">When we hear someone \u003cu class=\"p-u\">spoken\u003c/u>, our brain begins to analyze the information.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">spoken → speaking 또는 speak\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":49,"text":"세 번째 문제는 hear 뒤에 목적어와 목적격 보어가 이어진 문장이에요. 누군가가 말하는 주체인지 말해지는 대상인지 보세요.","hl":"q"},{"n":50,"text":"","hl":"q","pause":7},{"n":51,"text":"정답은 speaking 또는 speak입니다. someone이 말하는 주체이므로 능동 형태가 필요해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B3\u003c/span>B. 밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">When we hear someone \u003cu class=\"p-u\">spoken\u003c/u>, our brain begins to analyze the information.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">hear 구조\u003c/b>hear + 목적어 \u003cb class=\"key\">someone\u003c/b> + 목적격 보어 구조입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">능동 판단\u003c/b>누군가는 말하는 주체이므로 \u003cb class=\"key\">speaking\u003c/b> 또는 \u003cb class=\"key\">speak\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">고치기\u003c/b>spoken을 \u003cb class=\"key\">speaking\u003c/b> 또는 \u003cb class=\"key\">speak\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 spoken → speaking 또는 speak\u003c/span>\u003cdiv class=\"p-full\">When we hear someone speak, our brain begins to analyze the information.\u003c/div>\u003cdiv class=\"p-ko\">우리가 누군가 말하는 것을 들으면, 뇌는 그 정보를 분석하기 시작한다.\u003c/div> class=\"l\">명사 관계\u003c/b>packaged는 뒤의 명사 \u003cb class=\"key\">foods\u003c/b>를 꾸밉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">수동 판단\u003c/b>식품은 포장되는 대상이므로 과거분사 \u003cb class=\"key\">packaged\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>어법상 맞으므로 ○표 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">As you all already know, packaged foods are actually harmful for overall health.\u003c/div>\u003cdiv class=\"p-ko\">여러분 모두 이미 알다시피, 포장된 식품은 전반적인 건강에 실제로 해롭다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>packaged foods는 '포장된 식품'이라는 수동 의미입니다.\u003c/div>","segs":[{"n":59,"text":"packaged가 꾸미는 명사를 찾아보세요. 바로 foods입니다.","hl":"st-0"},{"n":60,"text":"식품은 스스로 포장하는 주체가 아니라 포장되는 대상이에요. 그래서 과거분사가 자연스럽습니다.","hl":"st-1"},{"n":61,"text":"따라서 이 부분은 그대로 두면 됩니다. 맞으면 동그라미 표시를 해 주세요.","hl":"st-2"},{"n":62,"text":"이 문제의 함정도 짚고 갈게요. packaged foods는 '포장된 식품'이라는 수동 의미입니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>C. 다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">In autumn we see V-shaped flocks of birds (1) \u003cu class=\"p-u\">to fly\u003c/u> across the sky, which alerts us to the change of seasons. (2) \u003cu class=\"p-u\">Migrated\u003c/u> birds can cover thousands of miles in their annual travels, often traveling the same course year after year with little deviation. Different species of birds have their own (3) \u003cu class=\"p-u\">preferring\u003c/u> pathways on their annual migrations.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) flying 또는 fly (2) Migrating (3) preferred\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"이 지문은 세 군데의 밑줄을 모두 고쳐야 하는 문제예요. 새 떼가 하늘을 나는 장면, 철새를 꾸미는 분사, 이동 경로를 꾸미는 분사를 차례로 확인해 보세요.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"첫째는 flying 또는 fly, 둘째는 Migrating, 셋째는 preferred입니다. 새와 철새는 스스로 하는 주체라서 현재분사나 동사원형을 쓰고, 경로는 선호되는 대상이라서 과거분사를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>C. 다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">In autumn we see V-shaped flocks of birds (1) \u003cu class=\"p-u\">to fly\u003c/u> across the sky, which alerts us to the change of seasons. (2) \u003cu class=\"p-u\">Migrated\u003c/u> birds can cover thousands of miles in their annual travels, often traveling the same course year after year with little deviation. Different species of birds have their own (3) \u003cu class=\"p-u\">preferring\u003c/u> pathways on their annual migrations.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫째 &lt;&lt;to fly&gt;&gt;\u003c/b>see + 목적어 \u003cb class=\"key\">flocks of birds\u003c/b> + 목적격 보어 구조에서 새들은 하늘을 \u003cb class=\"key\">나는\u003c/b> 주체이므로 \u003cb class=\"key\">flying\u003c/b> 또는 \u003cb class=\"key\">fly\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">둘째 &lt;&lt;Migrated&gt;&gt;\u003c/b>철새는 스스로 \u003cb class=\"key\">이동하는\u003c/b> 주체이므로 현재분사 \u003cb class=\"key\">Migrating\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">셋째 &lt;&lt;preferring&gt;&gt;\u003c/b>pathways는 새들이 \u003cb class=\"key\">선호하는\u003c/b> 대상이므로 과거분사 \u003cb class=\"key\">preferred\u003c/b>가 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) flying 또는 fly (2) Migrating (3) preferred\u003c/span>\u003cdiv class=\"p-full\">In autumn we see V-shaped flocks of birds flying across the sky, which alerts us to the change of seasons. Migrating birds can cover thousands of miles in their annual travels, often traveling the same course year after year with little deviation. Different species of birds have their own preferred pathways on their annual migrations.\u003c/div>\u003cdiv class=\"p-ko\">가을에는 하늘을 가로질러 나는 V자 모양의 새 떼를 보게 되고, 그것은 계절의 변화를 알려 준다. 철새는 연간 이동에서 수천 마일을 이동할 수 있으며, 거의 벗어남 없이 해마다 같은 경로를 여행하는 경우가 많다. 서로 다른 종의 새들은 연간 이동에서 각자의 선호하는 경로를 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>새가 나는 것과 철새가 이동하는 것은 능동, 경로가 선호되는 것은 수동입니다.\u003c/div>","segs":[{"n":66,"text":"먼저 see 뒤에 새 떼가 목적어로 오고 그 뒤에 행동이 이어지는 구조를 보세요. 새들은 하늘을 스스로 나는 주체라서 flying 또는 fly가 필요합니다.","hl":"st-0"},{"n":67,"text":"두 번째는 철새를 꾸미는 분사예요. 철새는 스스로 이동하는 주체이므로 Migrating이 맞습니다.","hl":"st-1"},{"n":68,"text":"세 번째는 이동 경로를 꾸미는 분사입니다. 경로는 새들이 선호하는 대상이므로 preferred를 씁니다.","hl":"st-2"},{"n":69,"text":"이 문제의 함정도 짚고 갈게요. 새가 나는 것과 철새가 이동하는 것은 능동, 경로가 선호되는 것은 수동입니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>C. 다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">On my daughter Marie's 8th birthday, we went to a restaurant to celebrate. Marie held her favorite present, a teddy bear, in her arms. Our server, a friendly woman, noticed Marie (1) \u003cu class=\"p-u\">held\u003c/u> a teddy bear and said, &quot;My daughter loves teddy bears, too.&quot; We started chatting about her family. The server mentioned during the conversation that her daughter was in the hospital with a (2) \u003cu class=\"p-u\">breaking\u003c/u> leg.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) holding (2) broken\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":70,"text":"두 번째 지문은 사람이 들고 있는 장면과 다리의 상태를 표현한 부분을 고치는 문제예요. 각각 행동을 직접 하는 주체인지, 어떤 상태가 된 대상인지 보세요.","hl":"q"},{"n":71,"text":"","hl":"q","pause":7},{"n":72,"text":"첫째는 holding, 둘째는 broken입니다. Marie는 곰인형을 들고 있는 주체라서 현재분사, leg는 부러진 상태라서 과거분사를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>C. 다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">On my daughter Marie's 8th birthday, we went to a restaurant to celebrate. Marie held her favorite present, a teddy bear, in her arms. Our server, a friendly woman, noticed Marie (1) \u003cu class=\"p-u\">held\u003c/u> a teddy bear and said, &quot;My daughter loves teddy bears, too.&quot; We started chatting about her family. The server mentioned during the conversation that her daughter was in the hospital with a (2) \u003cu class=\"p-u\">breaking\u003c/u> leg.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫째 &lt;&lt;held&gt;&gt;\u003c/b>noticed + 목적어 \u003cb class=\"key\">Marie\u003c/b> + 목적격 보어 구조에서 Marie는 곰인형을 \u003cb class=\"key\">들고 있는\u003c/b> 주체이므로 \u003cb class=\"key\">holding\u003c/b>이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">둘째 &lt;&lt;breaking&gt;&gt;\u003c/b>leg는 부러지는 대상이므로 과거분사 \u003cb class=\"key\">broken\u003c/b>으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) holding (2) broken\u003c/span>\u003cdiv class=\"p-full\">On my daughter Marie's 8th birthday, we went to a restaurant to celebrate. Marie held her favorite present, a teddy bear, in her arms. Our server, a friendly woman, noticed Marie holding a teddy bear and said, &quot;My daughter loves teddy bears, too.&quot; We started chatting about her family. The server mentioned during the conversation that her daughter was in the hospital with a broken leg.\u003c/div>\u003cdiv class=\"p-ko\">내 딸 마리의 여덟 번째 생일에 우리는 축하하기 위해 식당에 갔다. 마리는 가장 좋아하는 선물인 곰인형을 품에 안고 있었다. 친절한 여성인 우리 서버는 마리가 곰인형을 들고 있는 것을 알아차리고 자기 딸도 곰인형을 좋아한다고 말했다. 우리는 그녀의 가족에 대해 이야기를 나누기 시작했다. 그 서버는 대화 중에 자기 딸이 부러진 다리 때문에 병원에 있다고 언급했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>Marie는 들고 있는 주체, leg는 부러진 대상이라는 관계 차이를 구별합니다.\u003c/div>","segs":[{"n":73,"text":"먼저 noticed 뒤에서 목적어 Marie를 찾아보세요. Marie는 곰인형을 들고 있는 주체이므로 현재분사 holding이 필요합니다.","hl":"st-0"},{"n":74,"text":"두 번째는 다리를 꾸미는 분사예요. 다리는 스스로 부러뜨리는 주체가 아니라 부러진 상태이므로 broken을 씁니다.","hl":"st-1"},{"n":75,"text":"이 문제의 함정도 짚고 갈게요. Marie는 들고 있는 주체, leg는 부러진 대상이라는 관계 차이를 구별합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">분사와 목적격 보어 어법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>명사를 꾸미는 분사는 \u003cb class=\"key\">능동·진행\u003c/b>이면 현재분사, \u003cb class=\"key\">수동·완료\u003c/b>면 과거분사입니다.\u003c/li>\u003cli>get + 목적어 + 과거분사는 목적어가 \u003cb class=\"key\">~되게\u003c/b> 하다, get + 목적어 + to부정사는 목적어가 \u003cb class=\"key\">~하게\u003c/b> 하다입니다.\u003c/li>\u003cli>지각동사 뒤 목적격 보어는 \u003cb class=\"key\">동사원형\u003c/b> 또는 \u003cb class=\"key\">현재분사\u003c/b>, 목적어가 당하는 일이면 \u003cb class=\"key\">과거분사\u003c/b>입니다.\u003c/li>\u003c/ul>","segs":[{"n":76,"text":"오늘의 핵심은 명사나 목적어가 행동을 직접 하는지, 아니면 어떤 일을 당하는지 판단하는 거였어요. 능동이면 현재분사나 동사원형 또는 to부정사를, 수동이면 과거분사를 떠올리면 됩니다. 이 기준만 잡아도 분사와 목적격 보어 문제는 훨씬 안정적으로 풀 수 있을 거예요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
