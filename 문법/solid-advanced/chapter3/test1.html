}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 3 Chapter Test","audioDir":"test1_audio","preview":false,"count":169,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사·분사구문과 준동사 어법\u003c/div>\u003ch1>Chapter 3 Chapter Test 분사와 준동사 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 지문 어법, 틀린 것 고르기, 맞는 문장 짝짓기, 틀린 부분 고치기, 배열 서술형, 개수 고르기, 빈칸 형태 변형, 지문 어법 + 영작\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 챕터 테스트에 나온 분사와 준동사 문제를 함께 풀어 볼 거예요. 현재분사와 과거분사의 능동과 수동, 분사구문, 그리고 배열형 서술형까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재분사와 과거분사의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사는 동사가 형용사처럼 쓰인 형태로, \u003cb class=\"key\">능동·진행\u003c/b>이면 현재분사, \u003cb class=\"key\">수동·완료\u003c/b>면 과거분사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">능동/진행 → -ing / 수동/완료 → p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명사와 분사의 관계를 먼저 확인\u003c/li>\u003cli>감정 분사는 원인을 주면 -ing, 감정을 느끼면 p.p.\u003c/li>\u003cli>자동사 result는 resulting from 형태로 자주 출제\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The children looking for the watch are tired.\u003c/div>\u003cdiv class=\"g-ko\">시계를 찾고 있는 아이들은 피곤하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">a surprising result / surprised people\u003c/div>\u003cdiv class=\"g-ko\">놀라게 하는 결과 / 놀란 사람들\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 분사의 기본을 잡아 볼게요. 분사는 동사가 형용사처럼 명사를 꾸미거나 문장을 수식하는 형태예요. 명사가 직접 어떤 행동을 하면 현재분사, 명사가 어떤 행동을 당하거나 이미 완료된 상태면 과거분사를 씁니다. 예를 들어 시계를 찾고 있는 아이들은 직접 찾는 주체니까 looking을 쓰고, 피곤함을 느낀 아이들은 tired를 써요. 감정을 나타낼 때는 원인을 주는 쪽이 현재분사, 감정을 느끼는 사람이 과거분사라고 기억하면 편해요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사 후치수식\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사 뒤에서 \u003cb class=\"key\">분사\u003c/b>가 \u003cb class=\"key\">형용사\u003c/b>처럼 명사를 꾸미며, 앞의 명사와 능동 관계면 -ing, 수동 관계면 p.p.를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + -ing/p.p. (+ 목적어/수식어)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>관계대명사와 be동사가 생략된 형태로 이해\u003c/li>\u003cli>명사를 뒤에서 길게 꾸밀 때 사용\u003c/li>\u003cli>분사 뒤에 목적어가 있으면 현재분사 가능성 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">a cat sitting near the window\u003c/div>\u003cdiv class=\"g-ko\">창문 가까이에 앉아 있는 고양이\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">diseases caused by a gene\u003c/div>\u003cdiv class=\"g-ko\">유전자에 의해 생기는 질병\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"명사 뒤에 분사가 오면 관계대명사와 be동사가 줄어든 후치수식으로 보면 돼요. 앞의 명사가 분사 행동을 직접 하면 현재분사를 쓰고, 당하면 과거분사를 씁니다. 예를 들어 창문 가까이에 앉아 있는 고양이는 고양이가 직접 앉아 있으니 sitting이고, 유전자에 의해 생기는 질병은 질병이 야기되는 쪽이니 caused를 써요. 명사와 분사의 관계를 우리말로 먼저 해석해 보는 습관이 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">In ancient times, Greeks and Romans believed that rainbows were paths \u003cspan class=\"p-box\">\u003cspan>created\u003c/span>\u003ci>/\u003c/i>\u003cspan>were created\u003c/span>\u003c/span> by the goddess of the rainbow, Iris.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">created\u003c/div>\u003cdiv class=\"p-op\">were created\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">created\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":4,"text":"첫 번째 문제입니다. paths 뒤에서 무지개 길을 꾸며 주는 표현이 무엇인지, created와 were created 중에서 골라야 해요.","hl":"q"},{"n":5,"text":"","hl":"q","pause":7},{"n":6,"text":"정답은 created입니다. 무지개 길은 여신이 만든 대상이라 과거분사로 수동 관계를 나타내고, were created는 명사 뒤에서 수식할 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">In ancient times, Greeks and Romans believed that rainbows were paths \u003cspan class=\"p-box\">\u003cspan class=\"ok\">created\u003c/span>\u003ci>/\u003c/i>\u003cspan>were created\u003c/span>\u003c/span> by the goddess of the rainbow, Iris.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">created\u003c/div>\u003cdiv class=\"p-op\">were created\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">명사 paths와 분사의 관계 확인\u003c/b>paths 뒤에서 수식하는 표현이 필요합니다. paths는 신이 \u003cb class=\"key\">만든\u003c/b> 대상이므로 수동 관계입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 비교\u003c/b>{{were created}}는 절의 동사 형태라 명사 뒤에서 수식할 수 없습니다. 과거분사 \u003cb class=\"key\">created\u003c/b>만 paths를 뒤에서 꾸밀 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 created\u003c/span>\u003cdiv class=\"p-full\">In ancient times, Greeks and Romans believed that rainbows were paths created by the goddess of the rainbow, Iris.\u003c/div>\u003cdiv class=\"p-ko\">고대에 그리스인과 로마인은 무지개가 무지개 여신 이리스가 만든 길이라고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>by가 보이면 무조건 수동 동사로 만들려 하지 말고, 수식어 자리인지 확인\u003c/div>","segs":[{"n":7,"text":"먼저 paths와 뒤에 오는 말의 관계를 봐요. 무지개 길은 여신이 만든 대상이니까 수동 관계입니다.","hl":"st-0"},{"n":8,"text":"were created는 동사가 들어 있는 절 형태라서 명사 바로 뒤에서 꾸밀 수 없어요. 그래서 과거분사 created를 써서 paths created by Iris로 연결합니다.","hl":"st-1"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. by가 보이면 무조건 수동 동사로 만들려 하지 말고, 수식어 자리인지 확인","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문은 접속사와 주어를 줄여 \u003cb class=\"key\">-ing\u003c/b>나 \u003cb class=\"key\">p.p.\u003c/b>로 문장 전체를 수식하며, 이유·시간·조건·결과·부대상황을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">접속사 + 주어 + 동사 → 분사구문\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주절 주어와 분사구문의 주어가 같으면 주어 생략\u003c/li>\u003cli>수동 관계면 being p.p.에서 being을 생략한 p.p.\u003c/li>\u003cli>결과는 앞 절 전체를 받아 '그 결과 ~하게 하다'로 해석\u003c/li>\u003cli>독립분사구문은 주어를 남겨 의미를 분명히 함\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Walking into the café, he saw a cat.\u003c/div>\u003cdiv class=\"g-ko\">카페에 걸어 들어가서, 그는 고양이를 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The storm having passed, they went out.\u003c/div>\u003cdiv class=\"g-ko\">폭풍이 지나간 후, 그들은 밖으로 나갔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"분사구문은 긴 접속사 절을 간단하게 줄인 표현이에요. 주절과 주어가 같을 때 주어를 지우고 동사를 분사로 바꾸죠. 이때 주어가 직접 하는 행동이면 현재분사, 당하는 행동이면 과거분사를 씁니다. 결과를 나타낼 때는 앞 문장 전체가 원인이 되고 뒤의 분사구문이 결과가 돼요. 주어가 다르면 주어를 남기는 독립분사구문이 되고, 완료 의미는 having과 과거분사로 표현합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Running for office is extremely expensive, typically \u003cspan class=\"p-box\">\u003cspan>limits\u003c/span>\u003ci>/\u003c/i>\u003cspan>limiting\u003c/span>\u003c/span> positions of power to the wealthy.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">limits\u003c/div>\u003cdiv class=\"p-op\">limiting\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">limiting\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 콤마 뒤에서 앞 문장 전체를 받아 결과를 나타내는 표현을 고르는 문제예요. limits와 limiting 중 어느 것이 자연스러운지 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 limiting입니다. 앞 절 전체가 원인이 되고, 그 결과로 권력의 자리를 제한한다는 능동 의미를 현재분사로 나타내요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Running for office is extremely expensive, typically \u003cspan class=\"p-box\">\u003cspan>limits\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">limiting\u003c/span>\u003c/span> positions of power to the wealthy.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">limits\u003c/div>\u003cdiv class=\"p-op\">limiting\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">앞 절과 뒤 표현의 관계\u003c/b>앞 절 전체 '선거 출마는 매우 비싸다'가 원인, 뒤는 그 결과 '권력의 자리를 부유층으로 제한한다'입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">동사가 아닌 분사구문\u003c/b>주어를 다시 세우면 'This limits...'이므로 능동 관계의 현재분사 \u003cb class=\"key\">limiting\u003c/b>이 필요합니다. limits는 동사라 comma 뒤에서 연결할 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 limiting\u003c/span>\u003cdiv class=\"p-full\">Running for office is extremely expensive, typically limiting positions of power to the wealthy.\u003c/div>\u003cdiv class=\"p-ko\">선거 출마는 매우 비싸서, 일반적으로 권력의 자리를 부유층으로 제한한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주절 동사 is가 이미 있으므로 또 동사 limits를 쓰면 문장 연결 오류\u003c/div>","segs":[{"n":14,"text":"앞에서는 선거 출마가 매우 비싸다고 말하고, 뒤에서는 그 결과 권력의 자리가 부유층으로 제한된다는 의미가 이어져요.","hl":"st-0"},{"n":15,"text":"limits는 동사라서 콤마 뒤에 그대로 이어 쓸 수 없어요. 앞 절 전체를 받아 결과를 나타내는 현재분사 limiting을 씁니다.","hl":"st-1"},{"n":16,"text":"이 문제의 함정도 짚고 갈게요. 주절 동사 is가 이미 있으므로 또 동사 limits를 쓰면 문장 연결 오류","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">with + 명사 + 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">with + 명사 + 분사\u003c/b>는 '명사가 ~한 상태로'라는 부대상황을 나타내며, 명사와 분사의 관계에 따라 -ing 또는 p.p.를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 목적어 + -ing/p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 분사 행동을 하면 현재분사\u003c/li>\u003cli>목적어가 분사 행동을 당하면 과거분사\u003c/li>\u003cli>전치사 with 뒤에 명사와 분사가 함께 옴\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">with his eyes closed\u003c/div>\u003cdiv class=\"g-ko\">그의 눈이 감긴 채로\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">with a dog following him\u003c/div>\u003cdiv class=\"g-ko\">개가 그를 따라오는 상태로\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"with 다음에 명사와 분사가 오는 표현은 부대상황을 아주 간단하게 만들어 줘요. 목적어가 분사 행동을 직접 하면 현재분사, 당하면 과거분사를 씁니다. 예를 들어 눈이 감긴 채라는 말은 눈이 감기는 쪽이니까 closed를 쓰고, 개가 따라오는 상태는 개가 직접 따라오니까 following을 써요. 해석은 명사가 어떤 상태에 있는지로 잡으면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">This time of year it is common to see a mother duck working her way along a wood's road with her chicks \u003cspan class=\"p-box\">\u003cspan>follow\u003c/span>\u003ci>/\u003c/i>\u003cspan>following\u003c/span>\u003c/span> along.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">follow\u003c/div>\u003cdiv class=\"p-op\">following\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">following\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"세 번째 문제는 with her chicks 뒤에 오는 표현을 고르는 문제예요. 새끼 오리가 따라오는 주체인지, 따라오는 대상인지 생각해 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":7},{"n":20,"text":"정답은 following입니다. 새끼 오리들이 직접 따라오는 능동 관계라서 현재분사를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">This time of year it is common to see a mother duck working her way along a wood's road with her chicks \u003cspan class=\"p-box\">\u003cspan>follow\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">following\u003c/span>\u003c/span> along.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">follow\u003c/div>\u003cdiv class=\"p-op\">following\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">with + 명사 + 분사 구조\u003c/b>with her chicks 뒤에서 chicks의 상태를 나타내는 분사가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">chicks와 follow의 관계\u003c/b>새끼 오리들이 어미를 따라오는 주체이므로 능동 관계입니다. 따라서 현재분사 \u003cb class=\"key\">following\u003c/b>을 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">동사원형 불가\u003c/b>전치사 with 뒤에 명사와 동사원형이 바로 이어질 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 following\u003c/span>\u003cdiv class=\"p-full\">This time of year it is common to see a mother duck working her way along a wood's road with her chicks following along.\u003c/div>\u003cdiv class=\"p-ko\">이맘때면 어미 오리가 새끼 오리들을 따라오게 하며 숲길을 따라가는 모습을 흔히 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>with 뒤에 명사가 있으면 목적어가 분사 행동을 직접 하는지 확인\u003c/div>","segs":[{"n":21,"text":"with her chicks 뒤에는 새끼 오리들의 상태를 나타내는 분사가 와야 해요.","hl":"st-0"},{"n":22,"text":"새끼 오리들은 어미를 따라오는 주체예요. 그래서 능동 관계를 나타내는 현재분사 following을 씁니다.","hl":"st-1"},{"n":23,"text":"follow는 동사원형이라서 with her chicks 뒤에 그대로 이어질 수 없어요.","hl":"st-2"},{"n":24,"text":"이 문제의 함정도 짚고 갈게요. with 뒤에 명사가 있으면 목적어가 분사 행동을 직접 하는지 확인","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The number of children \u003cspan class=\"p-box\">\u003cspan>looking\u003c/span>\u003ci>/\u003c/i>\u003cspan>look\u003c/span>\u003c/span> for the watch slowly decreased and only a few \u003cspan class=\"p-box\">\u003cspan>tiring\u003c/span>\u003ci>/\u003c/i>\u003cspan>tired\u003c/span>\u003c/span> children were left.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">looking / tiring\u003c/div>\u003cdiv class=\"p-op\">looking / tired\u003c/div>\u003cdiv class=\"p-op\">look / tiring\u003c/div>\u003cdiv class=\"p-op\">look / tired\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">looking, tired\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"네 번째 문제는 두 군데를 고르는 문제예요. children과의 관계를 생각해서 looking과 look, tiring과 tired를 각각 판단해 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":7},{"n":27,"text":"정답은 looking과 tired입니다. 시계를 찾고 있는 아이들은 직접 찾는 주체라 looking이고, 피곤함을 느낀 아이들은 tired를 씁니다.","hl":"ans","re 003c/span> genetic engineering.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to replace / used\u003c/div>\u003cdiv class=\"p-op\">to replace / using\u003c/div>\u003cdiv class=\"p-op\">replacing / used\u003c/div>\u003cdiv class=\"p-op\">replacing / using\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">allow + 목적어 + to부정사\u003c/b>allow는 목적어 medical professionals 뒤에 \u003cb class=\"key\">to replace\u003c/b>를 취합니다. replacing은 allow의 목적격 보어 자리에 맞지 않습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">caused by a gene\u003c/b>caused는 diseases를 뒤에서 수식하는 과거분사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">using genetic engineering\u003c/b>유전공학을 이용하여 질병을 치료한다는 수단의 의미로 현재분사 \u003cb class=\"key\">using\u003c/b>을 씁니다. used는 '사용된'이라는 수동 의미가 되어 문맥에 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 to replace, using\u003c/span>\u003cdiv class=\"p-full\">Gene therapy is a new process that is still in the experimental stage. It may allow medical professionals to replace the damaged gene with a good one. This way, they can cure diseases caused by a gene using genetic engineering.\u003c/div>\u003cdiv class=\"p-ko\">유전자 치료는 아직 실험 단계에 있는 새로운 과정이다. 그것은 의료 전문가들이 손상된 유전자를 좋은 유전자로 대체하도록 해 줄 수 있다. 이렇게 해서 그들은 유전공학을 이용해 유전자에 의해 생기는 질병을 치료할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>allow 뒤에는 to부정사, 수단을 나타내는 분사구문은 현재분사\u003c/div>","segs":[{"n":37,"text":"allow는 목적어 뒤에 to부정사를 데리고 와요. 그래서 medical professionals to replace가 맞습니다.","hl":"st-0"},{"n":38,"text":"caused는 diseases를 뒤에서 꾸며 주는 과거분사예요. 질병이 유전자에 의해 야기되는 수동 관계죠.","hl":"st-1"},{"n":39,"text":"using genetic engineering은 유전공학을 이용하여라는 수단의 분사구문이에요. used를 쓰면 수동 의미가 되어 어색합니다.","hl":"st-2"},{"n":40,"text":"이 문제의 함정도 짚고 갈게요. allow 뒤에는 to부정사, 수단을 나타내는 분사구문은 현재분사","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">① \u003cu class=\"p-u\">Not knowing\u003c/u> what to do, she called the store manager to handle it.\u003cbr>② High heels were originally designed for men when \u003cu class=\"p-u\">riding\u003c/u> horses.\u003cbr>③ Many people think of insects as pests that can be \u003cu class=\"p-u\">annoyed\u003c/u>.\u003cbr>④ Climate change is a \u003cu class=\"p-u\">summed\u003c/u> product of each person's behavior.\u003cbr>⑤ Human body cells use instructions \u003cu class=\"p-u\">contained\u003c/u> in the genes to carry out their functions.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"여섯 번째 문제는 다섯 문장 중 밑줄 친 부분이 틀린 곳을 고르는 문제예요. 각 밑줄이 능동인지 수동인지, 감정의 원인인지 결과인지 구분해 보세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":7},{"n":43,"text":"정답은 세 번째입니다. 곤충은 사람을 짜증나게 하는 주체라서 annoyed가 아니라 annoying이 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">① \u003cu class=\"p-u\">Not knowing\u003c/u> what to do, she called the store manager to handle it.\u003cbr>② High heels were originally designed for men when \u003cu class=\"p-u\">riding\u003c/u> horses.\u003cbr>③ Many people think of insects as pests that can be \u003cu class=\"p-u\">annoyed\u003c/u>.\u003cbr>④ Climate change is a \u003cu class=\"p-u\">summed\u003c/u> product of each person's behavior.\u003cbr>⑤ Human body cells use instructions \u003cu class=\"p-u\">contained\u003c/u> in the genes to carry out their functions.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>Not knowing은 she가 직접 모르는 능동 관계의 현재분사구문이라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>riding horses는 when (they were) riding horses에서 주어와 be동사가 줄어든 표현으로, 말을 타는 상황을 나타내어 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>insects가 사람을 짜증나게 하는 주체이므로 \u003cb class=\"key\">annoying\u003c/b>이 맞습니다. be annoyed는 '짜증난'이라는 수동 상태가 되어 곤충의 성질을 나타낼 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>summed product는 '합산된 산물'이라는 수동 과거분사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>instructions contained in the genes는 유전자 안에 포함된 지침이라는 수동 관계로 contained가 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">Many people think of insects as pests that can be annoying.\u003c/div>\u003cdiv class=\"p-ko\">많은 사람들은 곤충을 짜증나게 할 수 있는 해충으로 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>감정 분사에서 사물이 원인이면 -ing, 사람이 감정을 느끼면 p.p.\u003c/div>","segs":[{"n":44,"text":"첫 번째 문장의 Not knowing은 she가 직접 모르는 상태를 나타내는 현재분사구문이라서 맞아요.","hl":"st-0"},{"n":45,"text":"두 번째 문장의 riding은 말을 타는 상황을 나타내는 분사 표현이라서 문맥에 맞습니다.","hl":"st-1"},{"n":46,"text":"곤충은 사람을 짜증나게 하는 주체예요. 그래서 annoyed가 아니라 annoying이 와야 합니다.","hl":"st-2"},{"n":47,"text":"네 번째 문장의 summed는 합산된이라는 수동 의미를 나타내서 맞아요.","hl":"st-3"},{"n":48,"text":"다섯 번째 문장의 contained는 유전자 안에 포함된 지침이라는 수동 관계라서 맞습니다.","hl":"st-4"},{"n":49,"text":"이 문제의 함정도 짚고 갈게요. 감정 분사에서 사물이 원인이면 -ing, 사람이 감정을 느끼면 p.p.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">사역·지각동사 + 목적어 + 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">get\u003c/b>은 '목적어를 ~하게 하다'로 \u003cb class=\"key\">get + 목적어 + p.p.\u003c/b>를 쓰고, 지각동사는 목적어가 하는 행동을 \u003cb class=\"key\">-ing\u003c/b>로 나타낼 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">get + O + p.p. / see + O + -ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>목적어가 당하는 관계면 get + O + p.p.\u003c/li>\u003cli>see, watch, hear 뒤에서 진행 중인 행동은 -ing\u003c/li>\u003cli>사역동사 have/make와 구별\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">get the project completed\u003c/div>\u003cdiv class=\"g-ko\">그 프로젝트를 완료되게 하다\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">saw a cat sitting near the window\u003c/div>\u003cdiv class=\"g-ko\">고양이가 앉아 있는 것을 보았다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":50,"text":"사역동사 get은 목적어가 어떤 상태가 되게 할 때 get plus 목적어 plus 과거분사로 써요. 프로젝트가 완료되는 쪽이니까 completed가 자연스럽죠. 지각동사 see는 목적어가 어떤 행동을 하고 있는 장면을 볼 때 목적어 뒤에 현재분사를 씁니다. 고양이가 직접 앉아 있으니까 sitting이 되는 거예요. 목적어와 분사의 관계가 능동인지 수동인지가 핵심입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 짝짓기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">ⓐ The moon has always enchanted humans, inspired scientists and artists alike.\u003cbr>ⓑ The project manager was told to get the project completed two weeks early.\u003cbr>ⓒ A person may develop a phobia after a particularly frightening event.\u003cbr>ⓓ The storm having passed, villagers went outside to check their houses for any damage.\u003cbr>ⓔ Most athletes display the positive character traits promoting by supporters of sport.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":51,"text":"일곱 번째 문제는 다섯 문장 중 어법상 맞는 문장을 골라 짝지은 선택지를 찾는 문제예요. 각 문장의 분사가 능동인지 수동인지 차례로 확인해 보세요.","hl":"q"},{"n":52,"text":"","hl":"q","pause":7},{"n":53,"text":"정답은 세 번째 선택지입니다. 두 번째, 세 번째, 네 번째 문장이 맞고, 첫 번째는 inspiring, 다섯 번째는 promoted로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 짝짓기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">ⓐ The moon has always enchanted humans, inspired scientists and artists alike.\u003cbr>ⓑ The project manager was told to get the project completed two weeks early.\u003cbr>ⓒ A person may develop a phobia after a particularly frightening event.\u003cbr>ⓓ The storm having passed, villagers went outside to check their houses for any damage.\u003cbr>ⓔ Most athletes display the positive character traits promoting by supporters of sport.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>inspired는 앞 절을 받아 결과를 나타내는 자리인데, 달이 과학자와 예술가들을 '영감을 받게 하는' 능동 원인이므로 \u003cb class=\"key\">inspiring\u003c/b>이 맞습니다. inspired는 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>get + 목적어 + p.p. 구조로 the project completed가 맞습니다. 프로젝트는 완료되는 대상입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>a particularly frightening event에서 frightening은 사건이 두려움을 주는 원인이므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>The storm having passed는 주어가 다른 독립분사구문으로 '폭풍이 지나간 후'라는 완료 의미를 잘 나타냅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>traits promoting by supporters는 수동 관계여야 하므로 \u003cb class=\"key\">promoted\u003c/b>가 맞습니다. promoting은 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">정답 조합\u003c/b>맞는 문장은 ⓑ, ⓒ, ⓓ이므로 ③입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">달은 항상 인간을 매료시켜 과학자와 예술가 모두에게 영감을 주었다. / 프로젝트 매니저는 프로젝트를 2주 일찍 완료하라는 말을 들었다. / 사람은 특히 무서운 사건 후에 공포증이 생길 수 있다. / 폭풍이 지나간 후, 마을 사람들은 밖으로 나가 집의 피해를 확인했다. / 대부분의 운동선수는 스포츠 지지자들에 의해 홍보되는 긍정적인 성격 특성을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ⓐ의 inspired를 주절 동사로 착각하지 말고, 콤마 뒤 분사구문의 능동 관계로 보기\u003c/div>","segs":[{"n":54,"text":"첫 번째 문장은 달이 과학자와 예술가들에게 영감을 주는 능동 원인이에요. 그래서 inspired가 아니라 inspiring이 와야 합니다.","hl":"st-0"},{"n":55,"text":"두 번째 문장은 get plus 목적어 plus 과거분사 구조예요. 프로젝트는 완료되는 대상이라 completed가 맞습니다.","hl":"st-1"},{"n":56,"text":"세 번째 문장의 frightening은 사건이 두려움을 주는 원인이라서 맞아요.","hl":"st-2"},{"n":57,"text":"네 번째 문장은 폭풍이 지나간 후라는 완료 의미의 독립분사구문이라서 맞습니다.","hl":"st-3"},{"n":58,"text":"다섯 번째 문장에서 특성은 지지자들에 의해 홍보되는 대상이에요. 그래서 promoting이 아니라 promoted가 와야 합니다.","hl":"st-4"},{"n":59,"text":"맞는 문장은 두 번째, 세 번째, 네 번째 문장이에요. 그래서 세 번째 선택지가 정답입니다.","hl":"st-5"},{"n":60,"text":"이 문제의 함정도 짚고 갈게요. a의 inspired를 주절 동사로 착각하지 말고, 콤마 뒤 분사구문의 능동 관계로 보기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">준동사의 병렬\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and로 연결된 \u003cb class=\"key\">준동사\u003c/b>는 앞의 형태와 \u003cb class=\"key\">같은 형태\u003c/b>로 맞춰야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">to부정사 and to부정사 / 동사원형 and 동사원형 / -ing and -ing\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>and 앞뒤의 문법 형태를 먼저 비교\u003c/li>\u003cli>조동사나 to부정사 뒤의 동사원형 주의\u003c/li>\u003cli>병렬 구조에서는 의미보다 형태 일치가 우선\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">used to aid, develop, and reconsider\u003c/div>\u003cdiv class=\"g-ko\">돕고, 발전시키고, 재고하는 데 사용되다\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">to improve, diminish, and enhance\u003c/div>\u003cdiv class=\"g-ko\">향상시키고, 줄이고, 강화하다\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":61,"text":"병렬 구조는 and 앞뒤를 같은 모양으로 맞추는 규칙이에요. 앞에서 to부정사가 나왔다면 뒤에도 동사원형이 와야 하고, 동명사가 나왔다면 뒤에도 동명사 형태가 와야 합니다. 시험에서는 and 앞부분을 먼저 확인하고 뒤의 형태가 달라졌는지 보면 돼요. 의미가 통하더라도 형태가 어긋나면 틀린 문장이 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">Writing poetry has been shown to have physical and mental benefits, with expressive writing ⓐ \u003cu class=\"p-u\">find\u003c/u> to improve the immune system, diminish psychological distress, and enhance relationships. Poetry ⓑ \u003cu class=\"p-u\">has long been used\u003c/u> to aid different mental health needs, develop empathy, and ⓒ \u003cu class=\"p-u\">reconsidering\u003c/u> our relationship with both natural and built environments.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ find → found, ⓒ reconsidering → reconsider\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":62,"text":"여덟 번째 문제는 두 군데를 찾아 고치는 문제예요. with 뒤의 명사와 분사의 관계, 그리고 and로 이어진 동사들의 모양을 특히 보세요.","hl":"q"},{"n":63,"text":"","hl":"q","pause":7},{"n":64,"text":"정답은 첫 번째 밑줄의 find를 found로, 세 번째 밑줄의 reconsidering을 reconsider로 고치는 것입니다. expressive writing은 밝혀지는 대상이고, and 뒤에는 동사원형이 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Writing poetry has been shown to have physical and mental benefits, with expressive writing ⓐ \u003cu class=\"p-u\">find\u003c/u> to improve the immune system, diminish psychological distress, and enhance relationships. Poetry ⓑ \u003cu class=\"p-u\">has long been used\u003c/u> to aid different mental health needs, develop empathy, and ⓒ \u003cu class=\"p-u\">reconsidering\u003c/u> our relationship with both natural and built environments.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ with expressive writing ...\u003c/b>with + 명사 + 분사 구조에서 expressive writing은 연구를 통해 '밝혀진' 대상이므로 수동 과거분사 \u003cb class=\"key\">found\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>has long been used는 수동 현재완료로 '오랫동안 사용되어 왔다'라는 의미라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ and 병렬\u003c/b>to aid, develop, and ...에서 and 뒤는 동사원형 \u003cb class=\"key\">reconsider\u003c/b>로 맞춰야 합니다. reconsidering은 병렬이 깨집니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ find → found, ⓒ reconsidering → reconsider\u003c/span>\u003cdiv class=\"p-full\">Writing poetry has been shown to have physical and mental benefits, with expressive writing found to improve the immune system, diminish psychological distress, and enhance relationships. Poetry has long been used to aid different mental health needs, develop empathy, and reconsider our relationship with both natural and built environments.\u003c/div>\u003cdiv class=\"p-ko\">시 쓰기는 신체적·정신적 이점이 있다는 것이 밝혀져 왔으며, 표현적 글쓰기는 면역 체계를 향상시키고 심리적 고통을 줄이며 관계를 증진시키는 것으로 밝혀졌다. 시는 다양한 정신 건강 요구를 돕고, 공감을 발달시키고, 자연환경과 인공환경 모두와의 관계를 재고하는 데 오랫동안 사용되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>with 뒤 명사가 분사 행동을 당하면 p.p.; and 뒤는 앞의 동사원형과 병렬\u003c/div>","segs":[{"n":65,"text":"첫 번째 밑줄은 with 뒤에서 expressive writing의 상태를 나타내요. 글쓰기가 밝혀지는 대상이라서 found를 써야 합니다.","hl":"st-0"},{"n":66,"text":"두 번째 밑줄은 오랫동안 사용되어 왔다는 수동 현재완료라서 맞습니다.","hl":"st-1"},{"n":67,"text":"세 번째 밑줄은 and로 이어진 동사원형 병렬을 확인해야 해요. aid와 develop에 맞춰 reconsider를 써야 합니다.","hl":"st-2"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. with 뒤 명사가 분사 행동을 당하면 p.p.; and 뒤는 앞의 동사원형과 병렬","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">With 30 percent of United States workers not ⓐ \u003cu class=\"p-u\">got\u003c/u> enough sleep at night, according to the Wall Street Journal, US companies lose a yearly sum of $63.2 billion annually due to the drop in employee productivity ⓑ \u003cu class=\"p-u\">resulted\u003c/u> from sleep deprivation. ⓒ \u003cu class=\"p-u\">Sleep-deprived\u003c/u> workers generally have lower morale and are less able to retain information than their better-rested colleagues.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ got → getting, ⓑ resulted → resulting\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":69,"text":"아홉 번째 문제도 두 군데를 찾아 고치는 문제입니다. with 뒤에서 workers가 직접 잠을 자는 주체인지, 그리고 result from이 어떤 분사로 이어지는지 확인해 보세요.","hl":"q"},{"n":70,"text":"","hl":"q","pause":7},{"n":71,"text":"정답은 got을 getting으로, resulted를 resulting으로 고치는 것입니다. workers가 직접 잠을 자지 못하는 능동 관계이고, result from은 현재분사 resulting으로 연결해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">With 30 percent of United States workers not ⓐ \u003cu class=\"p-u\">got\u003c/u> enough sleep at night, according to the Wall Street Journal, US companies lose a yearly sum of $63.2 billion annually due to the drop in employee productivity ⓑ \u003cu class=\"p-u\">resulted\u003c/u> from sleep deprivation. ⓒ \u003cu class=\"p-u\">Sleep-deprived\u003c/u> workers generally have lower morale and are less able to retain information than their better-rested colleagues.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ with workers not ...\u003c/b>workers가 잠을 충분히 '자지 못하는' 주체이므로 능동 현재분사 \u003cb class=\"key\">getting\u003c/b>이 필요합니다. got은 동사 형태라 with + 명사 뒤에 올 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ productivity resulting from\u003c/b>result from은 '~에서 비롯되다'라는 자동사 구문으로, productivity를 뒤에서 꾸미는 현재분사 \u003cb class=\"key\">resulting\u003c/b>이 맞습니다. resulted는 과거분사로 오면 수동 의미가 되어 어색합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ Sleep-deprived\u003c/b>명사 workers 앞에서 '수면이 부족한' 상태를 나타내는 과거분사형 복합 형용사로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ got → getting, ⓑ resulted → resulting\u003c/span>\u003cdiv class=\"p-full\">With 30 percent of United States workers not getting enough sleep at night, according to the Wall Street Journal, US companies lose a yearly sum of $63.2 billion annually due to the drop in employee productivity resulting from sleep deprivation. Sleep-deprived workers generally have lower morale and are less able to retain information than their better-rested colleagues.\u003c/div>\u003cdiv class=\"p-ko\">월스트리트 저널에 따르면 미국 근로자의 30퍼센트가 밤에 충분히 잠을 자지 못하기 때문에, 미국 기업들은 수면 부족에서 비롯된 직원 생산성 저하로 인해 매년 632억 달러의 손실을 본다. 수면이 부족한 근로자는 일반적으로 사기가 더 낮고, 잠을 더 잘 잔 동료들보다 정보를 유지하는 능력이 떨어진다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>result는 타동사로 오해해 resulted를 쓰기 쉬우나 result from은 자동사 현재분사\u003c/div>","segs":[{"n":72,"text":"첫 번째 밑줄에서 workers는 잠을 충분히 자지 못하는 주체예요. 그래서 능동 현재분사 getting을 씁니다.","hl":"st-0"},{"n":73,"text":"두 번째 밑줄의 result from은 어떤 것에서 비롯된다는 자동사 구문이에요. 생산성을 뒤에서 꾸미는 현재분사 resulting이 맞습니다.","hl":"st-1"},{"n":74,"text":"세 번째 밑줄 Sleep-deprived는 수면이 부족한 상태를 나타내는 형용사라서 맞습니다.","hl":"st-2"},{"n":75,"text":"이 문제의 함정도 짚고 갈게요. result는 타동사로 오해해 resulted를 쓰기 쉬우나 result from은 자동사 현재분사","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 20\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>우리말과 같은 뜻이 되도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"p-q\">우리는 그의 위협적인 목소리에 겁을 먹고 일어나 달아났다.\u003cbr>(frighte "text":"전치사 뒤에 동사가 오면 동명사 형태를 써야 해요. by breaking처럼 by 뒤에서 breaking이 오는 식이죠. 전치사의 목적어 자리에는 명사나 명사 역할을 하는 동명사가 와야 합니다. 동사원형이나 과거분사를 그대로 쓰면 문법이 깨지니 전치사를 먼저 표시해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 16 / 20\u003c/span>\u003cspan class=\"g-kind\">개수 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">16\u003c/span>다음 글의 밑줄 친 부분 중 어법상 알맞은 것의 개수를 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">Sensation is the immediate mapping of raw sensory data, and perception is the next step in the process where all that raw data is combined into more complex maps. These maps are then linked via memory to similar maps ⓐ \u003cu class=\"p-u\">are drawn\u003c/u> from past experience. This allows us to classify the images into ⓑ \u003cu class=\"p-u\">known\u003c/u> categories. Perception occurs when the initial sensory information ⓒ \u003cu class=\"p-u\">is organized\u003c/u> into a sufficiently complete whole so that it can be recognized as an object. At this point, we recognize that the pattern of light waves ⓓ \u003cu class=\"p-u\">hit\u003c/u> our retina is actually a chair, for example. Thus sensation works by analysis—by ⓔ \u003cu class=\"p-u\">breaking\u003c/u> down information into its smallest parts. Perception works by synthesis, by coordinating the parts back into a whole.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":123,"text":"열여섯 번째 문제는 다섯 개 밑줄 중 어법상 알맞은 것의 개수를 세는 문제예요. 각 밑줄이 절의 동사인지 분사인지, 능동인지 수동인지 차례대로 확인해 보세요.","hl":"q"},{"n":124,"text":"","hl":"q","pause":7},{"n":125,"text":"정답은 세 개입니다. 두 번째, 세 번째, 다섯 번째 밑줄은 맞고, 첫 번째는 drawn, 네 번째는 hitting으로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 16 / 20\u003c/span>\u003cspan class=\"g-kind\">개수 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">16\u003c/span>다음 글의 밑줄 친 부분 중 어법상 알맞은 것의 개수를 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Sensation is the immediate mapping of raw sensory data, and perception is the next step in the process where all that raw data is combined into more complex maps. These maps are then linked via memory to similar maps ⓐ \u003cu class=\"p-u\">are drawn\u003c/u> from past experience. This allows us to classify the images into ⓑ \u003cu class=\"p-u\">known\u003c/u> categories. Perception occurs when the initial sensory information ⓒ \u003cu class=\"p-u\">is organized\u003c/u> into a sufficiently complete whole so that it can be recognized as an object. At this point, we recognize that the pattern of light waves ⓓ \u003cu class=\"p-u\">hit\u003c/u> our retina is actually a chair, for example. Thus sensation works by analysis—by ⓔ \u003cu class=\"p-u\">breaking\u003c/u> down information into its smallest parts. Perception works by synthesis, by coordinating the parts back into a whole.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>similar maps를 뒤에서 꾸며야 하므로 \u003cb class=\"key\">drawn\u003c/b>이 맞고, are drawn은 절 동사라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>known은 '알려진' 수동 과거분사 형용사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>감각 정보가 조직되는 수동태라 is organized가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>light waves가 망막을 때리는 주체이므로 현재분사 \u003cb class=\"key\">hitting\u003c/b>이 맞고, hit은 동사라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>전치사 by 뒤에는 동명사 \u003cb class=\"key\">breaking\u003c/b>이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">개수 세기\u003c/b>맞는 것은 ⓑ, ⓒ, ⓔ 세 개이므로 ③입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">감각은 원시 감각 자료를 즉시 지도화하는 것이고, 지각은 그 원시 자료가 더 복잡한 지도로 결합되는 과정의 다음 단계이다. 이 지도들은 기억을 통해 과거 경험에서 그려진 유사한 지도들과 연결된다. 이것은 우리가 이미지를 알려진 범주로 분류할 수 있게 한다. 지각은 초기 감각 정보가 하나의 대상으로 인식될 수 있을 만큼 충분히 완전한 전체로 조직될 때 일어난다. 이 지점에서 우리는 우리 망막을 때리는 빛 파동의 패턴이 실제로 의자라는 것을 인식한다. 따라서 감각은 분석, 즉 정보를 가장 작은 부분으로 분해함으로써 작동한다. 지각은 종합, 즉 부분들을 다시 전체로 조정함으로써 작동한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>명사 뒤에서 꾸미는 자리에 절 동사를 그대로 쓰지 않았는지 확인\u003c/div>","segs":[{"n":126,"text":"첫 번째 밑줄은 similar maps를 뒤에서 꾸미는 자리예요. 동사절인 are drawn이 아니라 과거분사 drawn이 와야 합니다.","hl":"st-0"},{"n":127,"text":"두 번째 밑줄 known은 알려진이라는 수동 의미의 과거분사라서 맞아요.","hl":"st-1"},{"n":128,"text":"세 번째 밑줄은 감각 정보가 조직되는 수동태라서 is organized가 맞습니다.","hl":"st-2"},{"n":129,"text":"네 번째 밑줄에서 빛의 파동은 망막을 때리는 주체예요. 그래서 hit이 아니라 현재분사 hitting이 와야 합니다.","hl":"st-3"},{"n":130,"text":"다섯 번째 밑줄은 전치사 by 뒤에 동명사 breaking이 와서 맞습니다.","hl":"st-4"},{"n":131,"text":"맞는 밑줄은 두 번째, 세 번째, 다섯 번째로 모두 세 개예요. 그래서 세 번째 선택지가 정답입니다.","hl":"st-5"},{"n":132,"text":"이 문제의 함정도 짚고 갈게요. 명사 뒤에서 꾸미는 자리에 절 동사를 그대로 쓰지 않았는지 확인","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">빈칸 형태 변형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 괄호 안의 주어진 말을 알맞은 형태로 바꿔 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Penguins, only (1) \u003cspan class=\"p-blank\">\u003c/span> (find) in the Southern Hemisphere, are most concentrated in Antarctica. Ten penguin species are listed as either vulnerable or endangered on the IUCN Red List, (2) \u003cspan class=\"p-blank\">\u003c/span> (make) penguins the second-most threatened bird group in the world after the albatross. The most imminent danger to penguins is the rapidly changing oceanic conditions (3) \u003cspan class=\"p-blank\">\u003c/span> (cause) by climate change. Factory farming is one of the greatest contributors to climate change. You can help endangered and vulnerable penguins by pledging to eat less meat.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) found (2) making (3) caused\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":133,"text":"열일곱 번째 문제는 세 빈칸에 주어진 동사를 알맞은 분사 형태로 바꾸는 문제예요. 각 명사가 발견되는 대상인지, 원인인지, 야기되는 대상인지 생각해 보세요.","hl":"q"},{"n":134,"text":"","hl":"q","pause":7},{"n":135,"text":"정답은 found, making, caused입니다. 펭귄은 발견되는 대상이라 found, 앞 절의 결과는 making, 해양 조건은 야기되는 대상이라 caused를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">빈칸 형태 변형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 괄호 안의 주어진 말을 알맞은 형태로 바꿔 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Penguins, only (1) \u003cspan class=\"p-blank\">\u003c/span> (find) in the Southern Hemisphere, are most concentrated in Antarctica. Ten penguin species are listed as either vulnerable or endangered on the IUCN Red List, (2) \u003cspan class=\"p-blank\">\u003c/span> (make) penguins the second-most threatened bird group in the world after the albatross. The most imminent danger to penguins is the rapidly changing oceanic conditions (3) \u003cspan class=\"p-blank\">\u003c/span> (cause) by climate change. Factory farming is one of the greatest contributors to climate change. You can help endangered and vulnerable penguins by pledging to eat less meat.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) found\u003c/b>펭귄은 남반구에서만 '발견되는' 대상이므로 과거분사 \u003cb class=\"key\">found\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) making\u003c/b>앞 절 전체가 원인이 되어 '펭귄을 두 번째로 가장 위협받는 조류 집단으로 만든다'는 결과 분사구문 \u003cb class=\"key\">making\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) caused\u003c/b>해양 조건은 기후 변화에 의해 '야기되는' 대상이므로 과거분사 \u003cb class=\"key\">caused\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) found (2) making (3) caused\u003c/span>\u003cdiv class=\"p-full\">Penguins, only found in the Southern Hemisphere, are most concentrated in Antarctica. Ten penguin species are listed as either vulnerable or endangered on the IUCN Red List, making penguins the second-most threatened bird group in the world after the albatross. The most imminent danger to penguins is the rapidly changing oceanic conditions caused by climate change. Factory farming is one of the greatest contributors to climate change. You can help endangered and vulnerable penguins by pledging to eat less meat.\u003c/div>\u003cdiv class=\"p-ko\">남반구에서만 발견되는 펭귄은 남극에 가장 많이 집중되어 있다. 열 종의 펭귄이 IUCN 적색 목록에서 취약 또는 멸종 위기로 등재되어 있으며, 이는 펭귄을 알바트로스 다음으로 세계에서 두 번째로 가장 위협받는 조류 집단으로 만든다. 펭귄에게 가장 임박한 위험은 기후 변화로 인해 야기되는 빠르게 변하는 해양 조건이다. 공장식 축산은 기후 변화의 가장 큰 원인 중 하나이다. 고기를 덜 먹겠다고 서약함으로써 멸종 위기 및 취약한 펭귄을 도울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>making은 결과 분사구문의 능동, caused는 conditions의 수동 후치수식\u003c/div>","segs":[{"n":136,"text":"첫 번째 빈칸에서 펭귄은 남반구에서만 발견되는 대상이에요. 그래서 과거분사 found를 씁니다.","hl":"st-0"},{"n":137,"text":"두 번째 빈칸은 앞 절 전체가 원인이 되어 펭귄을 위협받는 집단으로 만든다는 결과를 나타내요. 그래서 making을 씁니다.","hl":"st-1"},{"n":138,"text":"세 번째 빈칸에서 해양 조건은 기후 변화에 의해 야기되는 대상이에요. 그래서 caused를 씁니다.","hl":"st-2"},{"n":139,"text":"이 문제의 함정도 짚고 갈게요. making은 결과 분사구문의 능동, caused는 conditions의 수동 후치수식","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 + 영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg\">Plastic is extremely slow to degrade and tends to float, which allows it ⓐ \u003cu class=\"p-u\">to travel\u003c/u> in ocean currents for thousands of miles. Most plastics break down into smaller and smaller pieces when ⓑ \u003cu class=\"p-u\">exposing\u003c/u> to ultraviolet (UV) light, forming microplastics. These microplastics are very difficult to measure once they are small enough \u003cu class=\"p-u\">그것들을 수거하기 위해 일반적으로 사용되는 그물망을 통과할 만큼\u003c/u>. Their impacts on the marine environment and food webs are still ⓒ \u003cu class=\"p-u\">poorly\u003c/u> understood. These tiny particles are known ⓓ \u003cu class=\"p-u\">to be eaten\u003c/u> by various animals and to get into the food chain. Because most of the plastic particles in the ocean ⓔ \u003cu class=\"p-u\">are\u003c/u> so small, there is no practical way to clean up the ocean.\u003c/div>\u003cdiv class=\"p-q\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003cbr>보기: use, them, through, typically, the nets, to collect, to pass\u003c/div>\u003cdiv class=\"p-words\">(2) 보기: use, them, through, typically, the nets, to collect, to pass\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) ② (2) to pass through the nets typically used to collect them\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":140,"text":"열여덟 번째 문제는 지문 어법과 영작이 함께 나오는 문제예요. 먼저 밑줄 중 수동 관계가 잘못된 곳을 찾고, 그다음 enough to 구문과 과거분사 used를 이용해 우리말을 영작해 보세요.","hl":"q"},{"n":141,"text":"","hl":"q","pause":7},{"n":142,"text":"첫 번째 답은 두 번째 밑줄이고 exposing을 exposed로 고칩니다. 두 번째 답은 to pass through the nets typically used to collect them입니다. 그물은 수거를 위해 사용되는 대상이라 used를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 + 영작\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Plastic is extremely slow to degrade and tends to float, which allows it ⓐ \u003cu class=\"p-u\">to travel\u003c/u> in ocean currents for thousands of miles. Most plastics break down into smaller and smaller pieces when ⓑ \u003cu class=\"p-u\">exposing\u003c/u> to ultraviolet (UV) light, forming microplastics. These microplastics are very difficult to measure once they are small enough \u003cu class=\"p-u\">그것들을 수거하기 위해 일반적으로 사용되는 그물망을 통과할 만큼\u003c/u>. Their impacts on the marine environment and food webs are still ⓒ \u003cu class=\"p-u\">poorly\u003c/u> understood. These tiny particles are known ⓓ \u003cu class=\"p-u\">to be eaten\u003c/u> by various animals and to get into the food chain. Because most of the plastic particles in the ocean ⓔ \u003cu class=\"p-u\">are\u003c/u> so small, there is no practical way to clean up the ocean.\u003c/div>\u003cdiv class=\"p-q sm\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003cbr>보기: use, them, through, typically, the nets, to collect, to pass\u003c/div>\u003cdiv class=\"p-words\">(2) 보기: use, them, through, typically, the nets, to collect, to pass\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) ⓐ 확인\u003c/b>allow it to travel: allow + 목적어 + to부정사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(1) ⓑ 확인\u003c/b>when exposing to UV light는 플라스틱이 노출되는 수동 관계이므로 \u003cb class=\"key\">exposed\u003c/b>가 맞습니다. exposing은 능동이라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(1) ⓒ 확인\u003c/b>poorly understood: '잘 이해되지 않은'으로 부사 poorly가 understood를 수식해 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">(1) ⓓ 확인\u003c/b>are known to be eaten: be known to부정사 수동으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">(1) ⓔ 확인\u003c/b>particles are so small: 주어가 복수라 are가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">(2) 영작 순서\u003c/b>small enough to pass through the nets: '통과할 만큼 충분히 작은'. the nets typically used to collect them: '그것들을 수거하기 위해 일반적으로 사용되는 그물망'. used는 nets를 수식하는 과거분사, to collect는 목적의 to부정사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ② (2) to pass through the nets typically used to collect them\u003c/span>\u003cdiv class=\"p-full\">Most plastics break down into smaller and smaller pieces when exposed to ultraviolet light, forming microplastics. These microplastics are very difficult to measure once they are small enough to pass through the nets typically used to collect them.\u003c/div>\u003cdiv class=\"p-ko\">대부분의 플라스틱은 자외선에 노출될 때 더 작고 작은 조각으로 분해되어 미세플라스틱을 형성한다. 이 미세플라스틱은 그것들을 수거하기 위해 일반적으로 사용되는 그물망을 통과할 만큼 충분히 작아지면 측정하기가 매우 어렵다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>when exposed to ~는 '노출될 때' 수동 분사구문; enough 뒤 to부정사\u003c/div>","segs":[{"n":143,"text":"첫 번째 밑줄은 allow 다음에 목적어와 to부정사가 와서 맞습니다.","hl":"st-0"},{"n":144,"text":"두 번째 밑줄에서 플라스틱은 자외선에 노출되는 대상이에요. 그래서 exposing이 아니라 exposed가 와야 합니다.","hl":"st-1"},{"n":145,"text":"세 번째 밑줄 poorly는 잘 이해되지 않았다는 의미로 understood를 수식해서 맞습니다.","hl":"st-2"},{"n":146,"text":"네 번째 밑줄은 알려져 있다는 수동 구문 안에 to be eaten이 와서 맞습니다.","hl":"st-3"},{"n":147,"text":"다섯 번째 밑줄은 복수 주어 particles에 맞춰 are가 쓰여서 맞습니다.","hl":"st-4"},{"n":148,"text":"영작에서는 enough 뒤에 to pass를 붙여 통과할 만큼 충분히 작다는 의미를 만들어요. 그물망은 수거를 위해 일반적으로 사용되는 대상이라 the nets typically used to collect them 순서로 씁니다.","hl":"st-5"},{"n":149,"text":"이 문제의 함정도 짚고 갈게요. when exposed to ~는 '노출될 때' 수동 분사구문; enough 뒤 to부정사","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사와 접속사 what\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사 뒤에서 그 명사를 수식하며 절 안에서 역할을 하면 \u003cb class=\"key\">관계대명사\u003c/b>, '무엇'의 의미로 불완전한 절을 이끌면 \u003cb class=\"key\">what\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + which/that + 불완전한 절 / what + 불완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>which/that 뒤에는 필요한 성분이 빠져 있어야 함\u003c/li>\u003cli>that은 접속사로 완전한 절도 이끌 수 있음\u003c/li>\u003cli>what은 선행사 포함\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">the system which they were using\u003c/div>\u003cdiv class=\"g-ko\">그들이 사용하고 있던 시스템\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">what we can do\u003c/div>\u003cdiv class=\"g-ko\">우리가 할 수 있는 것\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":150,"text":"관계대명사는 앞의 명사를 꾸미면서 뒤 절에서 빠진 주어나 목적어 역할을 해요. which나 that 뒤에 목적어가 빠져 있으면 관계대명사로 볼 수 있습니다. 반면 what은 앞에 명사 없이 쓰여서 무엇이라는 의미를 담고, 뒤 절의 빠진 성분을 채워 줘요. that은 접속사로도 쓰여서 완전한 절을 이끌 수 있다는 점도 구별해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Will West was a criminal ① \u003cu class=\"p-u\">arrested\u003c/u> in 1903. He was sentenced to serve his penalty in a prison in Kansas. Right after he was sent to jail, the authorities discovered that there was already a man named William West ② \u003cu class=\"p-u\">reside\u003c/u> in the same prison. Not only were their names the same, but the two felons also looked ③ \u003cu class=\"p-u\">nearly identical\u003c/u>, although they were not related. This caused the prison authorities some problems with their correct identification. Driven by the need for a more accurate method of identification than the system ④ \u003cu class=\"p-u\">which\u003c/u> they were using, they established the fingerprint recognition system for identifying criminals. Thus two ⑤ \u003cu class=\"p-u\">convicted\u003c/u> felons sparked the invention of fingerprint identification.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① arrested\u003c/div>\u003cdiv class=\"p-op\">② reside\u003c/div>\u003cdiv class=\"p-op\">③ nearly identical\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ convicted\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② (reside → residing)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":151,"text":"열아홉 번째 문제는 다섯 밑줄 중 어법상 틀린 곳을 고르는 문제예요. 명사를 뒤에서 꾸미는 자리에 동사원형이 왔는지, 관계대명사가 잘 쓰였는지 확인해 보세요.","hl":"q"},{"n":152,"text":"","hl":"q","pause":7},{"n":153,"text":"정답은 두 번째입니다. a man named William West 뒤에는 현재분사 residing이 와서 그 남자가 같은 교도소에 살고 있다는 의미를 만들어야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Will West was a criminal ① \u003cu class=\"p-u\">arrested\u003c/u> in 1903. He was sentenced to serve his penalty in a prison in Kansas. Right after he was sent to jail, the authorities discovered that there was already a man named William West ② \u003cu class=\"p-u\">reside\u003c/u> in the same prison. Not only were their names the same, but the two felons also looked ③ \u003cu class=\"p-u\">nearly identical\u003c/u>, although they were not related. This caused the prison authorities some problems with their correct identification. Driven by the need for a more accurate method of identification than the system ④ \u003cu class=\"p-u\">which\u003c/u> they were using, they established the fingerprint recognition system for identifying criminals. Thus two ⑤ \u003cu class=\"p-u\">convicted\u003c/u> felons sparked the invention of fingerprint identification.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① arrested\u003c/div>\u003cdiv class=\"p-op\">② reside\u003c/div>\u003cdiv class=\"p-op\">③ nearly identical\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ convicted\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① arrested\u003c/b>a criminal arrested in 1903: criminal이 체포되는 대상이므로 과거분사 \u003cb class=\"key\">arrested\u003c/b> 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② reside\u003c/b>a man named William West reside in the same prison에서 a man을 뒤에서 꾸미려면 현재분사 \u003cb class=\"key\">residing\u003c/b>이 필요합니다. reside는 동사원형이라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ nearly identical\u003c/b>look + 형용사 보어로 nearly identical 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ which\u003c/b>the system which they were using: using의 목적어가 빠진 관계대명사 which로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ convicted\u003c/b>two convicted felons: 유죄 판결을 받은 죄수들, 과거분사 형용사 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (reside → residing)\u003c/span>\u003cdiv class=\"p-full\">Right after he was sent to jail, the authorities discovered that there was already a man named William West residing in the same prison.\u003c/div>\u003cdiv class=\"p-ko\">그가 감옥에 보내진 직후, 당국은 이미 같은 교도소에 윌리엄 웨스트라는 남자가 살고 있다는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>there was a man ... 뒤에 동사원형을 쓰지 말고, 명사를 꾸미는 분사 residing\u003c/div>","segs":[{"n":154,"text":"첫 번째 밑줄에서 범죄자는 체포되는 대상이에요. 그래서 과거분사 arrested가 맞습니다.","hl":"st-0"},{"n":155,"text":"두 번째 밑줄은 a man을 뒤에서 꾸미는 자리예요. 같은 교도소에 살고 있는이라는 의미를 내려면 현재분사 residing이 와야 합니다.","hl":"st-1"},{"n":156,"text":"세 번째 밑줄은 look 뒤에 형용사 보어가 와서 맞습니다.","hl":"st-2"},{"n":157,"text":"네 번째 밑줄 which는 그들이 사용하고 있던 시스템이라는 관계대명사로 맞습니다.","hl":"st-3"},{"n":158,"text":"다섯 번째 밑줄 convicted는 유죄 판결을 받은이라는 과거분사 형용사라서 맞습니다.","hl":"st-4"},{"n":159,"text":"이 문제의 함정도 짚고 갈게요. there was a man ... 뒤에 동사원형을 쓰지 말고, 명사를 꾸미는 분사 residing","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">When you pull up at an intersection and see a person ① \u003cu class=\"p-u\">holding\u003c/u> a torn piece of cardboard with a handwritten sign on it, how do you react? Many of us shy away from chance encounters such as this because we know, without actually looking, ② \u003cu class=\"p-u\">that\u003c/u> the sign says something like &quot;Homeless, please help.&quot; In an attempt to avoid eye contact with the person on the street corner, we suddenly look with newfound interest at something ③ \u003cu class=\"p-u\">lie\u003c/u> on our car seat. We check our appearance in the rearview mirror or clean the dust. In fact, we do just about whatever it takes to divert our attention, ④ \u003cu class=\"p-u\">making\u003c/u> eye contact with this person impossible until the traffic light changes and we can be on our way. Many of us see homeless individuals on street corners and elsewhere and are uncomfortable in their presence because we don't know ⑤ \u003cu class=\"p-u\">what\u003c/u> we can do to help them, or even if we should.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① holding\u003c/div>\u003cdiv class=\"p-op\">② that\u003c/div>\u003cdiv class=\"p-op\">③ lie\u003c/div>\u003cdiv class=\"p-op\">④ making\u003c/div>\u003cdiv class=\"p-op\">⑤ what\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (lie → lying)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":160,"text":"스무 번째 문제는 지문 속 다섯 밑줄 중 틀린 곳을 고르는 문제예요. 사람이 직접 하는 행동인지, 사물이 어떤 상태로 놓여 있는지, 그리고 접속사와 의문사의 쓰임을 확인해 보세요.","hl":"q"},{"n":161,"text":"","hl":"q","pause":7},{"n":162,"text":"정답은 세 번째입니다. something 뒤에서 놓여 있는 상태를 나타내려면 lie가 아니라 lying을 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">When you pull up at an intersection and see a person ① \u003cu class=\"p-u\">holding\u003c/u> a torn piece of cardboard with a handwritten sign on it, how do you react? Many of us shy away from chance encounters such as this because we know, without actually looking, ② \u003cu class=\"p-u\">that\u003c/u> the sign says something like &quot;Homeless, please help.&quot; In an attempt to avoid eye contact with the person on the street corner, we suddenly look with newfound interest at something ③ \u003cu class=\"p-u\">lie\u003c/u> on our car seat. We check our appearance in the rearview mirror or clean the dust. In fact, we do just about whatever it takes to divert our attention, ④ \u003cu class=\"p-u\">making\u003c/u> eye contact with this person impossible until the traffic light changes and we can be on our way. Many of us see homeless individuals on street corners and elsewhere and are uncomfortable in their presence because we don't know ⑤ \u003cu class=\"p-u\">what\u003c/u> we can do to help them, or even if we should.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① holding\u003c/div>\u003cdiv class=\"p-op\">② that\u003c/div>\u003cdiv class=\"p-op\">③ lie\u003c/div>\u003cdiv class=\"p-op\">④ making\u003c/div>\u003cdiv class=\"p-op\">⑤ what\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① holding\u003c/b>a person holding a torn piece of cardboard: 사람이 직접 들고 있는 능동 관계라 현재분사 \u003cb class=\"key\">holding\u003c/b> 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② that\u003c/b>we know that the sign says ...: know의 목적어절을 이끄는 접속사 that 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ lie\u003c/b>something lie on our car seat: something을 뒤에서 꾸미며 '놓여 있는' 상태를 나타내야 하므로 현재분사 \u003cb class=\"key\">lying\u003c/b>이 맞습니다. lie는 동사원형이라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ making\u003c/b>앞 절 전체의 결과로 '눈맞춤을 불가능하게 만든다'는 현재분사 \u003cb class=\"key\">making\u003c/b> 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ what\u003c/b>we don't know what we can do: do의 목적어 역할을 하는 의문사 what 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (lie → lying)\u003c/span>\u003cdiv class=\"p-full\">In an attempt to avoid eye contact with the person on the street corner, we suddenly look with newfound interest at something lying on our car seat.\u003c/div>\u003cdiv class=\"p-ko\">길모퉁이에 있는 사람과 눈을 마주치지 않으려고, 우리는 갑자기 새삼스러운 관심을 가지고 우리 차 좌석 위에 놓여 있는 무언가를 본다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>lie의 현재분사는 lying; something 뒤에서 동사원형 불가\u003c/div>","segs":[{"n":163,"text":"첫 번째 밑줄은 사람이 직접 판지를 들고 있는 능동 관계라서 현재분사 holding이 맞습니다.","hl":"st-0"},{"n":164,"text":"두 번째 밑줄 that은 know 뒤에서 목적어절을 이끄는 접속사라서 맞습니다.","hl":"st-1"},{"n":165,"text":"세 번째 밑줄은 something 뒤에서 놓여 있는 상태를 나타내야 해요. 그래서 lie가 아니라 lying을 씁니다.","hl":"st-2"},{"n":166,"text":"네 번째 밑줄 making은 앞 절 전체의 결과로 눈맞춤을 불가능하게 만든다는 의미를 나타내서 맞습니다.","hl":"st-3"},{"n":167,"text":"다섯 번째 밑줄 what은 우리가 무엇을 할 수 있는지에서 do의 목적어 역할을 해서 맞습니다.","hl":"st-4"},{"n":168,"text":"이 문제의 함정도 짚고 갈게요. lie의 현재분사는 lying; something 뒤에서 동사원형 불가","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">분사·분사구문과 준동사 어법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>분사는 명사와의 관계가 \u003cb class=\"key\">능동\u003c/b>이면 -ing, \u003cb class=\"key\">수동\u003c/b>이면 p.p.를 쓴다.\u003c/li>\u003cli>분사구문은 접속사와 주어를 줄인 표현이며, \u003cb class=\"key\">결과\u003c/b>는 앞 절 전체를 받아 나타낸다.\u003c/li>\u003cli>with + 명사 + 분사에서 목적어가 당하면 \u003cb class=\"key\">과거분사\u003c/b>를 쓴다.\u003c/li>\u003cli>and 병렬에서는 앞뒤 \u003cb class=\"key\">준동사 형태\u003c/b>를 반드시 맞춘다.\u003c/li>\u003cli>감정 분사는 원인을 주면 -ing, 사람이 감정을 느끼면 p.p.를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":169,"text":"오늘은 분사의 능동과 수동을 중심으로 챕터 테스트를 정리했어요. 명사와 분사의 관계를 먼저 보고, with 구문과 분사구문, 병렬 구조를 차근차근 확인하면 시험에서도 흔들리지 않을 거예요. 복습할 때는 각 문장에서 꾸밈을 받는 명사가 무엇인지 표시해 보세요.","hl":"sum"}]}]});</script><script src=
