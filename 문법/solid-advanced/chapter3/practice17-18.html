}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 3 Basic Practice (포인트 17-18)","audioDir":"practice17-18_audio","preview":false,"count":76,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사구문 · with 분사구문 · 준동사 어법\u003c/div>\u003ch1>분사구문 현재분사·과거분사 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 분사구문과 준동사가 나오는 기본 연습 문제를 함께 풀어 볼 거예요. 콤마 뒤에 분사가 오는 문장, with 표현, 그리고 지문 속 밑줄을 고치는 문제까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">현재분사와 과거분사의 선택\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사는 의미상 주어와의 관계가 \u003cb class=\"key\">능동\u003c/b>이면 현재분사, \u003cb class=\"key\">수동\u003c/b>이면 과거분사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">의미상 주어 + 현재분사(능동) / 과거분사(수동)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>콤마 뒤에 접속사 없이 동사가 이어지면 분사구문을 의심\u003c/li>\u003cli>주어가 직접 하는 동작은 현재분사\u003c/li>\u003cli>주어가 당하는 동작은 과거분사\u003c/li>\u003cli>감정·상태를 나타내는 수동 표현은 과거분사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">thinking\u003c/span> it won't be a problem\u003c/div>\u003cdiv class=\"g-ko\">그것이 문제가 되지 않을 것이라고 생각하면서\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">filled\u003c/span> with stolen goods\u003c/div>\u003cdiv class=\"g-ko\">훔친 물건들로 가득 찬\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"분사구문에서 가장 중요한 건 의미상 주어와 분사의 관계예요. 의미상 주어가 동작을 직접 하면 현재분사를 쓰고, 동작을 당하는 대상이면 과거분사를 씁니다. 예를 들어 사람이 생각하는 것은 thinking이고, 시트가 물건으로 채워지는 것은 filled예요. 콤마 뒤에 접속사 없이 동사가 이어지는 느낌이 들면 분사구문을 떠올려 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">People cut back on their sleep, \u003cspan class=\"p-box\">\u003cspan>think\u003c/span>\u003ci>/\u003c/i>\u003cspan>thinking\u003c/span>\u003c/span> it won't be a problem.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">think\u003c/div>\u003cdiv class=\"p-op\">thinking\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">thinking\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 콤마 뒤에 think와 thinking 중 어느 것을 써야 하는지 고르는 문제예요. 주절과 콤마 뒤의 관계를 먼저 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 thinking이에요. 주어 People이 직접 생각하는 주체이므로 능동을 나타내는 현재분사 thinking이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">People cut back on their sleep, \u003cspan class=\"p-box\">\u003cspan>think\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">thinking\u003c/span>\u003c/span> it won't be a problem.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">think\u003c/div>\u003cdiv class=\"p-op\">thinking\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주절 확인\u003c/b>주절은 People cut back on their sleep이고, 콤마 뒤는 \u003cb class=\"key\">분사구문\u003c/b>으로 이어지는 부분입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">think 확인\u003c/b>think를 쓰면 접속사 없이 동사가 이어져 두 절을 연결할 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">thinking 확인\u003c/b>생각하는 주체는 People이므로 능동의 \u003cb class=\"key\">현재분사\u003c/b> thinking이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 thinking\u003c/span>\u003cdiv class=\"p-full\">People cut back on their sleep, thinking it won't be a problem.\u003c/div>\u003cdiv class=\"p-ko\">사람들은 그것이 문제가 되지 않을 것이라고 생각하면서 수면을 줄인다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>콤마 뒤 동사 원형을 그대로 남기면 접속사 없이 동사가 두 개 생겨 틀립니다.\u003c/div>","segs":[{"n":6,"text":"먼저 주절을 찾아보면 People cut back on their sleep이에요. 콤마 뒤는 이 주절을 자연스럽게 이어 주는 분사구문 자리라고 보면 됩니다.","hl":"st-0"},{"n":7,"text":"만약 think를 그대로 쓰면 콤마 뒤에 또 하나의 동사가 생겨요. 그런데 두 절을 이어 주는 접속사가 없어서 문장이 어색해집니다.","hl":"st-1"},{"n":8,"text":"반면 thinking은 사람들이 생각하는 동작을 능동으로 나타내요. 그래서 주어 People과 자연스럽게 연결되는 thinking이 정답입니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 콤마 뒤 동사 원형을 그대로 남기면 접속사 없이 동사가 두 개 생겨 틀립니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">with + 목적어 + 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">with 뒤 목적어가 분사의 동작을 직접 하면 \u003cb class=\"key\">현재분사\u003c/b>, 목적어가 동작을 당하면 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 목적어 + 현재분사 / 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>with 뒤에는 목적어와 분사가 함께 온다\u003c/li>\u003cli>목적어와 분사의 능동·수동 관계를 먼저 확인\u003c/li>\u003cli>동물이 사는 상태는 living\u003c/li>\u003cli>다리가 완공된 상태는 completed\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">with many animals \u003cspan class=\"fx\">living\u003c/span> in snowy conditions\u003c/div>\u003cdiv class=\"g-ko\">많은 동물들이 눈 덮인 환경에서 사는 상태로\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">With the bridge \u003cspan class=\"fx\">completed\u003c/span>\u003c/div>\u003cdiv class=\"g-ko\">다리가 완공된 상태로\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"with 뒤에 목적어가 나오고 그 뒤에 분사가 오는 구조를 자주 봅니다. 이때 목적어가 분사의 동작을 직접 하면 현재분사를 쓰고, 목적어가 동작을 당하면 과거분사를 써요. 동물이 사는 상태는 living이고, 다리가 완공되는 상태는 completed입니다. 목적어와 분사의 관계를 우리말로 먼저 해석해 보면 훨씬 쉽습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Canada is primarily cold, with many animals \u003cspan class=\"p-box\">\u003cspan>lived\u003c/span>\u003ci>/\u003c/i>\u003cspan>living\u003c/span>\u003c/span> in snowy conditions.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">lived\u003c/div>\u003cdiv class=\"p-op\">living\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">living\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 with 뒤에 many animals가 나오는 구조예요. 목적어와 분사가 어떤 관계인지부터 확인해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 living이에요. many animals가 직접 사는 주체이므로 현재분사 living이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Canada is primarily cold, with many animals \u003cspan class=\"p-box\">\u003cspan>lived\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">living\u003c/span>\u003c/span> in snowy conditions.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">lived\u003c/div>\u003cdiv class=\"p-op\">living\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">with 구조 찾기\u003c/b>with + 목적어 many animals + 분사 구조이므로 many animals와 분사의 관계를 봅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">lived 확인\u003c/b>lived를 분사로 쓰면 동물이 살아지는 수동 의미가 되어 동물이 사는 상태를 나타낼 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">living 확인\u003c/b>many animals가 live하는 주체이므로 능동의 \u003cb class=\"key\">현재분사\u003c/b> living이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 living\u003c/span>\u003cdiv class=\"p-full\">Canada is primarily cold, with many animals living in snowy conditions.\u003c/div>\u003cdiv class=\"p-ko\">캐나다는 주로 춥고, 많은 동물들이 눈 덮인 환경에서 산다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>with 뒤에 목적어가 있으면 목적어와 분사의 능동·수동 관계를 먼저 봐야 합니다.\u003c/div>","segs":[{"n":14,"text":"with 뒤를 보면 목적어 many animals가 나오고 그 뒤에 분사가 와요. 이때 목적어와 분사가 어떤 관계인지가 핵심입니다.","hl":"st-0"},{"n":15,"text":"lived를 쓰면 동물이 누군가에 의해 살아지는 것처럼 들려요. 동물이 스스로 사는 상태를 나타내기에는 맞지 않습니다.","hl":"st-1"},{"n":16,"text":"many animals는 눈 덮인 환경에서 직접 사는 주체예요. 그래서 능동을 나타내는 현재분사 living이 자연스럽습니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. with 뒤에 목적어가 있으면 목적어와 분사의 능동·수동 관계를 먼저 봐야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사구문의 기본 형태와 being·having\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사와 주어를 지우고 동사를 분사로 바꾸며, There being이나 Nobody having처럼 원래 동사의 의미를 살린 형태를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">접속사 + 주어 + 동사 → 분사구문 / There being ... / Nobody having ...\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>콤마 앞뒤에 접속사가 없으면 분사구문\u003c/li>\u003cli>There was → There being\u003c/li>\u003cli>Nobody had → Nobody having\u003c/li>\u003cli>분사구문의 의미상 주어가 주절과 다르면 남길 수 있음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There being\u003c/span> no bus, we walked home.\u003c/div>\u003cdiv class=\"g-ko\">버스가 없어서 우리는 집까지 걸어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Nobody having\u003c/span> anything to say, the meeting ended.\u003c/div>\u003cdiv class=\"g-ko\">아무도 할 말이 없어서 회의가 끝났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"분사구문은 접속사와 주어를 지우고 동사를 분사로 바꾸어 만듭니다. There was 구문은 There being으로, Nobody had 구문은 Nobody having처럼 원래 동사의 의미를 살린 분사 형태를 써요. 콤마 앞뒤에 접속사가 없는데 동사가 두 개처럼 보이면 분사구문으로 바꿔야 한다는 신호입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">There \u003cspan class=\"p-box\">\u003cspan>was\u003c/span>\u003ci>/\u003c/i>\u003cspan>being\u003c/span>\u003c/span> no other choice, I had to accept the offer.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">was\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">being\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 콤마 앞뒤 두 내용을 연결하는 형태를 고르는 문제예요. 접속사가 있는지부터 확인해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 being이에요. 접속사 없이 앞 내용을 분사구문으로 만들어 There being의 형태가 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">There \u003cspan class=\"p-box\">\u003cspan>was\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">being\u003c/span>\u003c/span> no other choice, I had to accept the offer.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">was\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">두 절 관계 보기\u003c/b>There was no other choice와 I had to accept the offer 사이에 접속사가 없으므로 앞부분을 \u003cb class=\"key\">분사구문\u003c/b>으로 바꿉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">was 확인\u003c/b>was를 그대로 두면 접속사 없이 두 개의 완전한 절이 이어져 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">being 확인\u003c/b>There was 구문을 분사구문으로 바꾸면 There \u003cb class=\"key\">being\u003c/b>이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 being\u003c/span>\u003cdiv class=\"p-full\">There being no other choice, I had to accept the offer.\u003c/div>\u003cdiv class=\"p-ko\">다른 선택이 없었기 때문에, 나는 그 제안을 받아들여야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>There was를 그대로 두면 두 절을 이어 줄 접속사가 없어 틀립니다.\u003c/div>","segs":[{"n":22,"text":"앞에는 선택지가 없다는 내용이 있고 뒤에는 제안을 받아들였다는 내용이 있어요. 두 절 사이에 접속사가 없으니 앞부분을 분사구문으로 만들어야 합니다.","hl":"st-0"},{"n":23,"text":"was를 그대로 남기면 동사가 있는 절이 두 개가 되어 버려요. 접속사가 없으니 문장이 성립하지 않습니다.","hl":"st-1"},{"n":24,"text":"There was 구문을 분사구문으로 바꿀 때는 was를 being으로 바꿔요. 그래서 There being no other choice가 맞습니다.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. There was를 그대로 두면 두 절을 이어 줄 접속사가 없어 틀립니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사구문의 의미상 주어 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사구문의 의미상 주어는 주절의 주어와 같으므로, 주절 주어가 분사 행동을 직접 하는지 당하는지 확인합니다.\u003cdiv>\u003cspan class=\"g-formula\">주절 주어 + 분사구문, 주절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>분사구문의 의미상 주어를 먼저 찾기\u003c/li>\u003cli>주절 주어가 직접 하면 현재분사\u003c/li>\u003cli>주절 주어가 당하면 과거분사\u003c/li>\u003cli>while admiring처럼 접속사가 남아 있어도 주체 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Seeing\u003c/span> the dog, the boy smiled.\u003c/div>\u003cdiv class=\"g-ko\">그 개를 보고, 소년은 미소 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Located\u003c/span> near the station, the shop is popular.\u003c/div>\u003cdiv class=\"g-ko\">역 근처에 위치한 그 가게는 인기가 많다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"분사구문의 의미상 주어는 보통 주절의 주어와 같습니다. 그래서 주절 주어가 그 동작을 직접 하는지, 아니면 당하는 대상인지를 먼저 확인해야 해요. 도둑이 사람들을 보는 것은 Seeing이고, 건물이 위치해 있는 것은 Located입니다. while admiring처럼 접속사가 남아 있을 때도 주절의 주어가 감상하는 주체인지 꼭 확인해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cspan class=\"p-box\">\u003cspan>Located\u003c/span>\u003ci>/\u003c/i>\u003cspan>Locating\u003c/span>\u003c/span> in the heart of La Paz, the building was formerly the town's courthouse.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">Located\u003c/div>\u003cdiv class=\"p-op\">Locating\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Located\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 콤마 뒤 주절의 주어와 앞의 분사가 어떻게 연결되는지 보는 문제예요. 건물이 어떤 관계에 있는지 생각해 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 Located예요. 건물은 위치해 있는 대상이므로 수동을 나타내는 과거분사 Located가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cspan class=\"p-box\">\u003cspan class=\"ok\">Located\u003c/span>\u003ci>/\u003c/i>\u003cspan>Locating\u003c/span>\u003c/span> in the heart of La Paz, the building was formerly the town's courthouse.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">Located\u003c/div>\u003cdiv class=\"p-op\">Locating\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">의미상 주어 찾기\u003c/b>콤마 뒤 주절의 주어는 the building이므로 분사구문의 의미상 주어도 the building입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">Locating 확인\u003c/b>the building이 다른 무엇을 locate하는 능동 의미가 아니므로 Locating은 어색합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">Located 확인\u003c/b>건물은 위치해 있는 대상이므로 수동의 과거분사 \u003cb class=\"key\">Located\u003c/b>가 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 Located\u003c/span>\u003cdiv class=\"p-full\">Located in the heart of La Paz, the building was formerly the town's courthouse.\u003c/div>\u003cdiv class=\"p-ko\">라파스 중심부에 위치한 그 건물은 예전에 마을의 법원이었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>the building이 스스로 locate하는 것으로 착각해 Locating을 고르기 쉽습니다.\u003c/div>","segs":[{"n":30,"text":"콤마 뒤 주절을 보면 주어가 the building이에요. 분사구문의 의미상 주어도 이 건물이라고 생각하면 됩니다.","hl":"st-0"},{"n":31,"text":"Locating을 쓰면 건물이 무언가를 위치시키는 주체가 되어야 해요. 하지만 건물은 스스로 다른 것을 위치시키는 대상이 아니죠.","hl":"st-1"},{"n":32,"text":"건물은 라파스 중심부에 위치해 있는 대상이에요. 그래서 수동 관계를 나타내는 과거분사 Located가 정답입니다.","hl":"st-2"},{"n":33,"text":"이 문제의 함정도 짚고 갈게요. the building이 스스로 locate하는 것으로 착각해 Locating을 고르기 쉽습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">With the bridge \u003cu class=\"p-u\">completing\u003c/u>, it is a 10-minute drive to reach the other side.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">completing → completed\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"첫 번째 고치기 문제는 with 뒤에 the bridge가 나오는 구조예요. 다리와 complete의 관계를 먼저 확인해 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":7},{"n":36,"text":"정답은 completed로 고치는 거예요. 다리는 완공되는 대상이므로 과거분사 completed가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">With the bridge \u003cu class=\"p-u\">completing\u003c/u>, it is a 10-minute drive to reach the other side.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">with 구조 확인\u003c/b>with + 목적어 the bridge + 분사 구조이므로 the bridge와 complete의 관계를 봅니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">completing 확인\u003c/b>the bridge가 스스로 complete하는 주체가 아니므로 현재분사 completing은 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">completed로 고치기\u003c/b>다리는 완공되는 대상이므로 과거분사 completed로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 completing → completed\u003c/span>\u003cdiv class=\"p-full\">With the bridge completed, it is a 10-minute drive to reach the other side. s\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">If 뒤 생략 구조\u003c/b>If used correctly는 If the Internet is used correctly에서 주어와 be동사가 생략된 구조입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">used 확인\u003c/b>the Internet은 use하는 대상, 즉 수동 관계이므로 과거분사 used가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판단\u003c/b>밑줄 친 used가 어법상 맞으므로 ○표 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">If used correctly, the Internet could make a good impact on your life.\u003c/div>\u003cdiv class=\"p-ko\">만약 인터넷을 올바르게 사용한다면, 그것은 당신의 삶에 좋은 영향을 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>used를 능동으로 오해해 using으로 바꾸면 안 됩니다.\u003c/div>","segs":[{"n":44,"text":"If 뒤를 보면 주어와 be동사가 생략되어 있어요. 원래는 인터넷이 올바르게 사용된다는 수동 표현입니다.","hl":"st-0"},{"n":45,"text":"인터넷은 사람들이 사용하는 대상이에요. 그래서 수동 관계를 나타내는 과거분사 used가 맞습니다.","hl":"st-1"},{"n":46,"text":"그러면 밑줄 친 used는 그대로 두면 됩니다. 정답은 동그라미예요.","hl":"st-2"},{"n":47,"text":"이 문제의 함정도 짚고 갈게요. used를 능동으로 오해해 using으로 바꾸면 안 됩니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">She worked as a washerwoman, \u003cu class=\"p-u\">earned\u003c/u> barely more than a dollar a day.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">earned → earning\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":48,"text":"세 번째 고치기 문제는 콤마 뒤에 earned가 이어지는 문장이에요. 앞 주어 She와 earn의 관계를 확인해 보세요.","hl":"q"},{"n":49,"text":"","hl":"q","pause":7},{"n":50,"text":"정답은 earning으로 고치는 거예요. She가 돈을 버는 주체이므로 능동의 현재분사 earning이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">She worked as a washerwoman, \u003cu class=\"p-u\">earned\u003c/u> barely more than a dollar a day.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">콤마 뒤 구조\u003c/b>콤마 뒤에는 접속사 없이 earned가 이어지므로 \u003cb class=\"key\">분사구문\u003c/b>이 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">earned 확인\u003c/b>earned를 과거형 동사로 쓰면 접속사 없이 동사가 또 생겨 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">earning으로 고치기\u003c/b>주어 She가 돈을 버는 주체이므로 능동의 현재분사 earning으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 earned → earning\u003c/span>\u003cdiv class=\"p-full\">She worked as a washerwoman, earning barely more than a dollar a day.\u003c/div>\u003cdiv class=\"p-ko\">그녀는 하루에 겨우 일 달러보다 조금 더 버는 세탁부로 일했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞 동사 worked와 시제를 맞추려고 earned를 쓰면 분사구문이 깨집니다.\u003c/div>","segs":[{"n":51,"text":"콤마 뒤를 보면 접속사 없이 earned가 바로 이어져요. 이런 자리에는 분사구문이 와서 앞 문장과 자연스럽게 연결되어야 합니다.","hl":"st-0"},{"n":52,"text":"earned를 그대로 동사로 보면 문장 안에 동사가 또 하나 생겨요. 접속사가 없으니 두 동사를 자연스럽게 연결할 수 없습니다.","hl":"st-1"},{"n":53,"text":"앞 주어 She는 돈을 버는 주체예요. 그래서 능동을 나타내는 현재분사 earning으로 고쳐야 합니다.","hl":"st-2"},{"n":54,"text":"이 문제의 함정도 짚고 갈게요. 앞 동사 worked와 시제를 맞추려고 earned를 쓰면 분사구문이 깨집니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Nobody \u003cu class=\"p-u\">had\u003c/u> any more to say, the meeting was closed earlier than scheduled.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had → having\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":55,"text":"네 번째 고치기 문제는 두 절 사이에 접속사가 없는 문장이에요. 앞절을 어떻게 분사구문으로 바꿀지 생각해 보세요.","hl":"q"},{"n":56,"text":"","hl":"q","pause":7},{"n":57,"text":"정답은 having으로 고치는 거예요. Nobody가 할 말이 없는 주체이므로 현재분사 having이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Nobody \u003cu class=\"p-u\">had\u003c/u> any more to say, the meeting was closed earlier than scheduled.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">두 절 연결 확인\u003c/b>Nobody had any more to say와 the meeting was closed 사이에 접속사가 없으므로 앞절을 \u003cb class=\"key\">분사구문\u003c/b>으로 바꿉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">had 확인\u003c/b>had를 그대로 두면 접속사 없이 완전한 절이 둘 이어져 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">having으로 고치기\u003c/b>Nobody가 말이 없는 주체이므로 능동의 현재분사 having으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 had → having\u003c/span>\u003cdiv class=\"p-full\">Nobody having any more to say, the meeting was closed earlier than scheduled.\u003c/div>\u003cdiv class=\"p-ko\">더 이상 할 말이 없었기 때문에, 회의는 예정보다 일찍 끝났다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞절을 완전한 절로 남기면 접속사 없이 두 절이 이어져 틀립니다.\u003c/div>","segs":[{"n":58,"text":"앞절은 아무도 더 할 말이 없었다는 뜻이고 뒤절은 회의가 끝났다는 뜻이에요. 두 절 사이에 접속사가 없으니 앞절을 분사구문으로 바꿔야 합니다.","hl":"st-0"},{"n":59,"text":"had를 그대로 쓰면 동사가 있는 절이 두 개가 되어 버려요. 접속사가 없으므로 문장이 자연스럽지 않습니다.","hl":"st-1"},{"n":60,"text":"Nobody는 더 이상 할 말이 없는 주체예요. 그래서 능동을 나타내는 현재분사 having으로 고쳐야 합니다.","hl":"st-2"},{"n":61,"text":"이 문제의 함정도 짚고 갈게요. 앞절을 완전한 절로 남기면 접속사 없이 두 절이 이어져 틀립니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">The thief got nervous and quickly lifted the sheet. To his surprise, the thin sheet, (1) \u003cu class=\"p-u\">filling\u003c/u> with stolen goods, was torn apart. All the stolen goods fell down on the floor, (2) \u003cu class=\"p-u\">created\u003c/u> a very loud and unpleasant noise. (3) \u003cu class=\"p-u\">See\u003c/u> many people running towards him, the thief had to give up on all of the stolen goods.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) filled, (2) creating, (3) Seeing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":62,"text":"이번에는 지문형 문제예요. 세 군데 밑줄 친 분사가 각각 어떤 주체와 어떤 관계인지 차례대로 확인해 보세요.","hl":"q"},{"n":63,"text":"","hl":"q","pause":7},{"n":64,"text":"정답은 차례로 filled, creating, Seeing이에요. 시트는 채워지는 대상이라 filled, 소음을 만드는 것은 능동이라 creating, 도둑이 사람들을 보는 것은 능동이라 Seeing입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The thief got nervous and quickly lifted the sheet. To his surprise, the thin sheet, (1) \u003cu class=\"p-u\">filling\u003c/u> with stolen goods, was torn apart. All the stolen goods fell down on the floor, (2) \u003cu class=\"p-u\">created\u003c/u> a very loud and unpleasant noise. (3) \u003cu class=\"p-u\">See\u003c/u> many people running towards him, the thief had to give up on all of the stolen goods.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) filling 확인\u003c/b>the thin sheet는 stolen goods로 채워진 대상이므로 수동의 과거분사 \u003cb class=\"key\">filled\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) created 확인\u003c/b>앞 문장 전체가 소음을 만드는 능동 관계이므로 현재분사 \u003cb class=\"key\">creating\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) See 확인\u003c/b>분사구문의 의미상 주어 the thief가 people을 보는 주체이므로 현재분사 \u003cb class=\"key\">Seeing\u003c/b>으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) filled, (2) creating, (3) Seeing\u003c/span>\u003cdiv class=\"p-full\">The thief got nervous and quickly lifted the sheet. To his surprise, the thin sheet, filled with stolen goods, was torn apart. All the stolen goods fell down on the floor, creating a very loud and unpleasant noise. Seeing many people running towards him, the thief had to give up on all of the stolen goods.\u003c/div>\u003cdiv class=\"p-ko\">도둑은 긴장해서 시트를 재빨리 들어 올렸다. 놀랍게도, 훔친 물건들로 가득 찬 얇은 시트는 찢어졌다. 모든 훔친 물건들이 바닥으로 떨어져서 아주 크고 불쾌한 소음을 만들었다. 많은 사람들이 자신을 향해 달려오는 것을 보고, 도둑은 훔친 물건들을 모두 포기해야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞 문장 전체를 받는 creating을 created로 착각하기 쉽습니다.\u003c/div>","segs":[{"n":65,"text":"첫 번째 밑줄은 얇은 시트가 훔친 물건들로 가득 찬 상태를 말해요. 시트는 채워지는 대상이므로 과거분사 filled가 맞습니다.","hl":"st-0"},{"n":66,"text":"두 번째 밑줄은 물건들이 떨어지는 상황이 큰 소음을 만들어 낸다는 뜻이에요. 소음을 만드는 주체가 능동이므로 creating이 맞습니다.","hl":"st-1"},{"n":67,"text":"세 번째 밑줄의 의미상 주어는 도둑이에요. 도둑이 사람들을 보는 주체이므로 현재분사 Seeing으로 고쳐야 합니다.","hl":"st-2"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. 앞 문장 전체를 받는 creating을 created로 착각하기 쉽습니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Now you see a wych elm, one of the tallest trees in the park. Originally (1) \u003cu class=\"p-u\">planting\u003c/u> as seed around 1893, this majestic tree is known for its foliage, with its leaves (2) \u003cu class=\"p-u\">turn\u003c/u> a beautiful golden-yellow color in the fall. In the spring and summer, relax under its bright green leaves while (3) \u003cu class=\"p-u\">admired\u003c/u> the beauty of Redwood Park.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) planted, (2) turning, (3) admiring\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":69,"text":"마지막 지문형 문제예요. 나무가 심어진 것인지, 잎이 색을 바꾸는 것인지, 사람이 감상하는 것인지 각각의 주체를 찾아보세요.","hl":"q"},{"n":70,"text":"","hl":"q","pause":7},{"n":71,"text":"정답은 차례로 planted, turning, admiring이에요. 나무는 심어진 대상이라 planted, 잎은 색을 바꾸는 주체라 turning, 사람은 감상하는 주체라 admiring입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Now you see a wych elm, one of the tallest trees in the park. Originally (1) \u003cu class=\"p-u\">planting\u003c/u> as seed around 1893, this majestic tree is known for its foliage, with its leaves (2) \u003cu class=\"p-u\">turn\u003c/u> a beautiful golden-yellow color in the fall. In the spring and summer, relax under its bright green leaves while (3) \u003cu class=\"p-u\">admired\u003c/u> the beauty of Redwood Park.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) planting 확인\u003c/b>this majestic tree는 씨앗으로 심어진 대상이므로 수동의 과거분사 \u003cb class=\"key\">planted\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) turn 확인\u003c/b>with its leaves에서 its leaves가 색을 바꾸는 주체이므로 현재분사 \u003cb class=\"key\">turning\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) admired 확인\u003c/b>while admiring은 주절의 you가 공원의 아름다움을 감상하는 능동이므로 현재분사 \u003cb class=\"key\">admiring\u003c/b>으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) planted, (2) turning, (3) admiring\u003c/span>\u003cdiv class=\"p-full\">Now you see a wych elm, one of the tallest trees in the park. Originally planted as seed around 1893, this majestic tree is known for its foliage, with its leaves turning a beautiful golden-yellow color in the fall. In the spring and summer, relax under its bright green leaves while admiring the beauty of Redwood Park.\u003c/div>\u003cdiv class=\"p-ko\">이제 공원에서 가장 키가 큰 나무 중 하나인 wych elm을 보게 됩니다. 원래 1893년경 씨앗으로 심어진 이 장엄한 나무는 잎으로 유명한데, 가을에는 잎이 아름다운 황금빛 노란색으로 변합니다. 봄과 여름에는 Redwood Park의 아름다움을 감상하면서 그 밝은 녹색 잎 아래에서 쉬어 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>with its leaves 뒤에서 leaves가 turn하는 주체임을 놓치면 turned를 고르기 쉽습니다.\u003c/div>","segs":[{"n":72,"text":"첫 번째 밑줄은 이 장엄한 나무가 씨앗으로 심어졌다는 뜻이에요. 나무는 심어지는 대상이므로 과거분사 planted가 맞습니다.","hl":"st-0"},{"n":73,"text":"두 번째 밑줄 앞에는 with its leaves가 있어요. 잎이 가을에 색을 바꾸는 주체이므로 현재분사 turning이 자연스럽습니다.","hl":"st-1"},{"n":74,"text":"세 번째 밑줄은 공원의 아름다움을 감상하는 상황이에요. 감상하는 주체인 you가 직접 하는 동작이므로 현재분사 admiring이 맞습니다.","hl":"st-2"},{"n":75,"text":"이 문제의 함정도 짚고 갈게요. with its leaves 뒤에서 leaves가 turn하는 주체임을 놓치면 turned를 고르기 쉽습니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">분사구문 · with 분사구문 · 준동사 어법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>콤마 뒤에 접속사 없이 동사가 이어지면 \u003cb class=\"key\">분사구문\u003c/b>을 의심한다.\u003c/li>\u003cli>의미상 주어가 동작을 직접 하면 \u003cb class=\"key\">현재분사\u003c/b>, 당하면 \u003cb class=\"key\">과거분사\u003c/b>를 쓴다.\u003c/li>\u003cli>with + 목적어 + 분사에서는 목적어와 분사의 \u003cb class=\"key\">능동·수동\u003c/b> 관계를 먼저 확인한다.\u003c/li>\u003cli>There being, Nobody having처럼 분사구문 안에서도 \u003cb class=\"key\">being/having\u003c/b> 형태가 쓰인다.\u003c/li>\u003c/ul>","segs":[{"n":76,"text":"오늘은 분사구문에서 현재분사와 과거분사를 고르는 문제를 많이 풀었어요. 핵심은 의미상 주어가 동작을 직접 하는지 아니면 동작을 당하는 대상인지 확인하는 거예요. with 뒤에서도 목적어와 분사의 관계를 꼭 다시 보고, 콤마 앞뒤에 접속사가 없으면 분사구문으로 자연스럽게 연결해 보세요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
