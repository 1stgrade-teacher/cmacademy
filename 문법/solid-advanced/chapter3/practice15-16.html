.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function segs(){return D.slides[i].segs||[];}

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 3 Basic Practice (포인트 15-16)","audioDir":"practice15-16_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">분사(현재분사·과거분사)의 능동·수동 구별과 감정 분사, 분사와 동사의 구별\u003c/div>\u003ch1>분사 완전 정복: 감정 분사부터 지문 어법까지 (Chapter 3 Basic Practice)\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 어법 판단 및 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 분사 표현을 집중적으로 연습하는 시간이에요. 감정을 나타내는 분사부터 명사를 꾸미는 분사, 그리고 분사인지 동사인지 헷갈리는 부분까지 차근차근 풀어 볼게요. 끝까지 따라오면 선택형이든 서술형이든 흔들리지 않을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">감정을 나타내는 분사(현재분사와 과거분사)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">감정을 일으키는 대상이 주어이면 \u003cb class=\"key\">-ing\u003c/b>, 감정을 느끼는 사람이 주어이면 \u003cb class=\"key\">-ed\u003c/b>를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">감정 유발 대상 + -ing / 감정을 느끼는 사람 + -ed\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>사물·상황이 주어이면 depressing, disappointing, exciting, amazing\u003c/li>\u003cli>사람이 주어이면 depressed, disappointed, excited, relieved, frightened\u003c/li>\u003cli>be동사나 feel 뒤 보어 자리에서 자주 출제된다\u003c/li>\u003cli>주어가 감정의 원인인지 감정의 주체인지로 판단한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The news was shocking.\u003c/div>\u003cdiv class=\"g-ko\">그 뉴스는 충격적이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I was shocked at the news.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 뉴스에 충격을 받았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"감정을 나타내는 분사는 딱 하나만 기억하면 돼요. 그 감정을 일으키는 대상에는 ing를 붙이고, 그 감정을 느끼는 사람에게는 ed를 붙입니다. 그래서 뉴스나 사건, 서비스처럼 감정을 만들어 내는 쪽은 depressing, disappointing, exciting이 되고, 사람은 depressed, disappointed, excited가 되는 거예요. 시험에서는 주어가 사람인지 사물인지만 확인하면 절반은 끝납니다. 나머지 절반은 해석으로 자연스러운 쪽을 고르면 돼요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">When a news story is gloomy, people feel \u003cspan class=\"p-box\">\u003cspan>depressing\u003c/span>\u003ci>/\u003c/i>\u003cspan>depressed\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">depressing\u003c/div>\u003cdiv class=\"p-op\">depressed\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">depressed\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 감정 분사 고르기예요. 뉴스가 우울할 때 사람들이 어떤 감정을 느끼는지, 주어가 사람인지부터 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"주어가 사람인 people이니까 감정을 느끼는 쪽인 depressed가 정답이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">When a news story is gloomy, people feel \u003cspan class=\"p-box\">\u003cspan>depressing\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">depressed\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">depressing\u003c/div>\u003cdiv class=\"p-op\">depressed\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 확인\u003c/b>주어는 \u003cb class=\"key\">people\u003c/b>, 즉 사람입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 판단\u003c/b>depressing은 감정을 \u003cb class=\"key\">일으키는\u003c/b> 쪽, depressed는 감정을 \u003cb class=\"key\">느끼는\u003c/b> 쪽에 씁니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확정\u003c/b>사람이 감정을 느끼므로 \u003cb class=\"key\">depressed\u003c/b>가 정답입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 depressed\u003c/span>\u003cdiv class=\"p-full\">When a news story is gloomy, people feel depressed.\u003c/div>\u003cdiv class=\"p-ko\">뉴스가 우울하면 사람들은 우울함을 느낀다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>사물 주어에 익숙해져서 depressing을 고르는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 주어가 누구인지 보세요. 여기서는 people, 사람이 주어입니다.","hl":"st-0"},{"n":7,"text":"depressing은 우울함을 일으키는 쪽에 쓰고, depressed는 우울함을 느끼는 쪽에 써요.","hl":"st-1"},{"n":8,"text":"사람이 뉴스를 보고 우울함을 느끼는 거니까 depressed를 골라야 합니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 사물 주어에 익숙해져서 depressing을 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명사를 꾸미는 분사(능동이면 현재분사, 수동이면 과거분사)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사가 동작을 하는 주체이면 \u003cb class=\"key\">현재분사\u003c/b>, 동작을 당하는 대상이면 \u003cb class=\"key\">과거분사\u003c/b>로 뒤에서 꾸민다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + -ing(능동) / 명사 + p.p.(수동)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명사와 분사의 관계를 능동·수동으로 먼저 판단한다\u003c/li>\u003cli>문장의 본동사가 따로 있는지 확인한다\u003c/li>\u003cli>수동은 which is/are + p.p.로 바꿔 말이 되는지 확인한다\u003c/li>\u003cli>분사구는 명사 바로 뒤에서 꾸미는 경우가 많다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">the people working there\u003c/div>\u003cdiv class=\"g-ko\">그곳에서 일하는 사람들\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">the highway constructed in 1920\u003c/div>\u003cdiv class=\"g-ko\">1920년에 건설된 그 고속도로\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 명사를 꾸미는 분사예요. 명사가 직접 그 동작을 하는 주체라면 현재분사, 다시 말해 ing 형태를 씁니다. 반대로 그 동작을 당하는 대상이라면 과거분사, 피피 형태를 쓰는 거죠. 예를 들어 그곳에서 일하는 사람들은 일을 하는 주체니까 working이고, 건설된 고속도로는 건설을 당하는 대상이니까 constructed예요. 헷갈릴 때는 which is나 which are를 넣어서 수동으로 읽어 보고, 자연스러운 쪽을 고르면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">People \u003cspan class=\"p-box\">\u003cspan>working\u003c/span>\u003ci>/\u003c/i>\u003cspan>worked\u003c/span>\u003c/span> there were very enthusiastic about their work.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">working\u003c/div>\u003cdiv class=\"p-op\">worked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">working\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제예요. 문장의 진짜 동사가 무엇인지 먼저 찾고, 사람들이 일을 하는 쪽인지 당하는 쪽인지 생각해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"사람들이 직접 일하는 주체이므로 현재분사 working이 정답이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">People \u003cspan class=\"p-box\">\u003cspan class=\"ok\">working\u003c/span>\u003ci>/\u003c/i>\u003cspan>worked\u003c/span>\u003c/span> there were very enthusiastic about their work.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">working\u003c/div>\u003cdiv class=\"p-op\">worked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0 003cspan class=\"p-ab\">정답 makes\u003c/span>\u003cdiv class=\"p-full\">The brain makes up just two percent of our body weight, but uses 20 percent of our energy.\u003c/div>\u003cdiv class=\"p-ko\">뇌는 우리 몸무게의 단지 2퍼센트를 차지하지만 우리 에너지의 20퍼센트를 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>making을 그대로 두고 '뇌가 차지하면서'라고 분사로 해석해 버리는 실수\u003c/div>","segs":[{"n":57,"text":"먼저 접속사를 찾아보세요. but이 두 절을 이어 주고 있죠. 그러면 앞 절에도 동사가 있어야 합니다.","hl":"st-0"},{"n":58,"text":"making은 준동사여서 혼자 동사 노릇을 못 해요. 주어가 삼인칭 단수인 The brain이니까 makes로 고쳐 줍니다.","hl":"st-1"},{"n":59,"text":"뒤 절에 uses가 있으니까 시제도 현재로 맞춰 주면 깔끔합니다.","hl":"st-2"},{"n":60,"text":"이 문제의 함정도 짚고 갈게요. making을 그대로 두고 '뇌가 차지하면서'라고 분사로 해석해 버리는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Plant growth is controlled by a group of hormones (1) \u003cu class=\"p-u\">call\u003c/u> auxins which are found at the tips of stems and roots of plants. Auxins (2) \u003cu class=\"p-u\">producing\u003c/u> at the tips of stems tend to accumulate on the side of the stem that is in the shade. Accordingly, the auxins stimulate growth on the shaded side of the plant. Therefore, the shaded side grows faster than the side (3) \u003cu class=\"p-u\">faces\u003c/u> the sunlight.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) called (2) produced (3) facing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":61,"text":"이제 지문형 문제예요. 밑줄 세 곳 모두 명사를 꾸미거나 주체와 대상의 관계를 따져야 하는 자리이니, 꾸밈을 받는 명사가 무엇인지부터 찾아보세요.","hl":"q"},{"n":62,"text":"","hl":"q","pause":7},{"n":63,"text":"호르몬은 불리는 대상, 옥신은 생성되는 대상, 쪽은 햇빛을 향하는 주체라서 각각 called, produced, facing으로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Plant growth is controlled by a group of hormones (1) \u003cu class=\"p-u\">call\u003c/u> auxins which are found at the tips of stems and roots of plants. Auxins (2) \u003cu class=\"p-u\">producing\u003c/u> at the tips of stems tend to accumulate on the side of the stem that is in the shade. Accordingly, the auxins stimulate growth on the shaded side of the plant. Therefore, the shaded side grows faster than the side (3) \u003cu class=\"p-u\">faces\u003c/u> the sunlight.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>hormones를 꾸미는 분사입니다. hormones는 auxins라고 \u003cb class=\"key\">불리는\u003c/b> 대상이므로 수동, \u003cb class=\"key\">called\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>Auxins는 줄기 끝에서 \u003cb class=\"key\">생성되는\u003c/b> 대상이므로 과거분사 \u003cb class=\"key\">produced\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>the side는 햇빛을 \u003cb class=\"key\">향하는\u003c/b> 주체이므로 능동, \u003cb class=\"key\">facing\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) called (2) produced (3) facing\u003c/span>\u003cdiv class=\"p-full\">Plant growth is controlled by a group of hormones called auxins which are found at the tips of stems and roots of plants. Auxins produced at the tips of stems tend to accumulate on the side of the stem that is in the shade. Accordingly, the auxins stimulate growth on the shaded side of the plant. Therefore, the shaded side grows faster than the side facing the sunlight.\u003c/div>\u003cdiv class=\"p-ko\">식물의 생장은 줄기와 뿌리 끝에서 발견되는 옥신이라는 호르몬 무리에 의해 조절된다. 줄기 끝에서 생성되는 옥신은 그늘진 쪽에 축적되는 경향이 있다. 따라서 옥신은 그늘진 쪽의 생장을 촉진한다. 그러므로 그늘진 쪽은 햇빛을 향하는 쪽보다 더 빨리 자란다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)를 '생성하는'으로 읽고 producing을 그대로 두는 실수\u003c/div>","segs":[{"n":64,"text":"첫 번째 밑줄은 호르몬을 꾸며 주는 자리예요. 호르몬은 옥신이라고 불리는 대상이니까 수동인 called로 고칩니다.","hl":"st-0"},{"n":65,"text":"두 번째는 옥신이 줄기 끝에서 생성되는 입장이에요. 만들어지는 대상이니까 produced로 고쳐 줍니다.","hl":"st-1"},{"n":66,"text":"세 번째는 햇빛을 향하는 쪽, 즉 스스로 향하는 주체이므로 능동인 facing이 맞습니다.","hl":"st-2"},{"n":67,"text":"이 문제의 함정도 짚고 갈게요. (2)를 '생성하는'으로 읽고 producing을 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">The rescue team (1) \u003cu class=\"p-u\">locating\u003c/u> Danny about 20 feet from the vehicle, conscious but with a broken leg. Considering how badly it could have gone for the kid, everyone was (2) \u003cu class=\"p-u\">relieving\u003c/u> when the rescue team brought him up. It was a terrible accident, so it was (3) \u003cu class=\"p-u\">amaze\u003c/u> that the kid survived. I hope he is going to be okay.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) located (2) relieved (3) amazing\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":68,"text":"마지막 지문 문제입니다. 첫 번째 밑줄 자리에 동사가 있는지, 나머지 두 자리는 누가 감정을 느끼고 무엇이 감정을 일으키는지 따져 보세요.","hl":"q"},{"n":69,"text":"","hl":"q","pause":7},{"n":70,"text":"구조대는 찾아낸 동사가 필요하고, 사람은 안도감을 느끼고, 상황은 놀라움을 주니까 located, relieved, amazing으로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The rescue team (1) \u003cu class=\"p-u\">locating\u003c/u> Danny about 20 feet from the vehicle, conscious but with a broken leg. Considering how badly it could have gone for the kid, everyone was (2) \u003cu class=\"p-u\">relieving\u003c/u> when the rescue team brought him up. It was a terrible accident, so it was (3) \u003cu class=\"p-u\">amaze\u003c/u> that the kid survived. I hope he is going to be okay.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>이 절에는 \u003cb class=\"key\">동사\u003c/b>가 없습니다. 구조대가 대니를 찾은 것이므로 과거 동사 \u003cb class=\"key\">located\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>everyone은 안도감을 \u003cb class=\"key\">느끼는\u003c/b> 주체이므로 과거분사 \u003cb class=\"key\">relieved\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>it은 감탄을 \u003cb class=\"key\">일으키는\u003c/b> 대상이므로 현재분사 \u003cb class=\"key\">amazing\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) located (2) relieved (3) amazing\u003c/span>\u003cdiv class=\"p-full\">The rescue team located Danny about 20 feet from the vehicle, conscious but with a broken leg. Considering how badly it could have gone for the kid, everyone was relieved when the rescue team brought him up. It was a terrible accident, so it was amazing that the kid survived. I hope he is going to be okay.\u003c/div>\u003cdiv class=\"p-ko\">구조대는 차량에서 약 20피트 떨어진 곳에서 의식은 있지만 다리가 부러진 대니를 발견했다. 그 아이에게 얼마나 나쁘게 전개될 수도 있었는지 생각하면, 구조대가 그를 데리고 올라왔을 때 모두가 안도했다. 끔찍한 사고였기 때문에 그 아이가 살아남은 것은 놀라운 일이었다. 나는 그가 괜찮을 것이기를 바란다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(1)을 분사로 착각해 locating을 그대로 두는 실수\u003c/div>","segs":[{"n":71,"text":"첫 번째 문장에는 동사가 아예 없어요. 구조대가 대니를 찾아낸 것이니까 과거 동사 located로 고쳐 줍니다.","hl":"st-0"},{"n":72,"text":"두 번째는 모두가 안도감을 느끼는 쪽이에요. 사람이 감정을 느끼니까 relieved로 고칩니다.","hl":"st-1"},{"n":73,"text":"세 번째는 아이가 살아남은 상황이 놀라움을 일으키는 쪽이니까 amazing이 맞습니다.","hl":"st-2"},{"n":74,"text":"이 문제의 함정도 짚고 갈게요. (1)을 분사로 착각해 locating을 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">분사(현재분사·과거분사)의 능동·수동 구별과 감정 분사, 분사와 동사의 구별\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>감정을 일으키는 대상에는 \u003cb class=\"key\">-ing\u003c/b>, 감정을 느끼는 사람에는 \u003cb class=\"key\">-ed\u003c/b>를 쓴다.\u003c/li>\u003cli>명사가 동작의 주체면 \u003cb class=\"key\">현재분사\u003c/b>, 대상이면 \u003cb class=\"key\">과거분사\u003c/b>로 뒤에서 꾸민다.\u003c/li>\u003cli>but이나 and로 이어진 절에는 반드시 \u003cb class=\"key\">동사\u003c/b>가 있어야 하며, 준동사만 있으면 동사로 고친다.\u003c/li>\u003cli>수동 판단이 헷갈리면 which is/are + p.p.로 바꿔 \u003cb class=\"key\">해석\u003c/b>해 본다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘 핵심은 딱 두 가지였어요. 감정을 주는 쪽인지 느끼는 쪽인지, 그리고 명사가 동작을 하는 주체인지 당하는 대상인지 판단하는 것입니다. 접속사가 보이면 각 절에 동사가 있는지도 꼭 확인하세요. 이 세 가지만 습관처럼 체크하면 분사 문제는 틀리지 않을 거예요. 수고하셨습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
