}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"누적 TEST Chapters 4-6","audioDir":"test-4to6_audio","preview":false,"count":98,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">관계대명사·관계부사, 준동사, 가정법, 병렬 구조 등 어법 종합\u003c/div>\u003ch1>누적 TEST Chapters 4-6 어법 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 지문 어법(틀린 것 고르기), 지문 어법(맞은 문장 개수), 지문 어법(맞게 고친 것 고르기), 지문 어법(틀린 부분 고치기), 배열 서술형, 지문 어법(어색한 것 고르기), 영작 서술형\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 누적 테스트 네 번째 단원부터 여섯 번째 단원까지의 어법 문제를 함께 풀어 볼 거예요. 관계대명사와 준동사, 가정법, 병렬 구조가 골고루 나오니까 문제마다 무엇을 먼저 확인해야 하는지 차근차근 짚어 볼게요. 열 문제를 하나도 빠짐없이 풀면서 실전 감각을 올려 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">what과 which의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 없고 '~하는 것'으로 해석되면 \u003cb class=\"key\">what\u003c/b>, 선행사가 있으면 \u003cb class=\"key\">which/that\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 없음 + what / 선행사 있음 + which·that\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>전치사 뒤에서도 what은 가능\u003c/li>\u003cli>which 뒤에는 완전한 절이 와야 함\u003c/li>\u003cli>recordings of what really happened\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I don't understand what he said.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 말한 것을 이해하지 못한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is the book which he wrote.\u003c/div>\u003cdiv class=\"g-ko\">이것은 그가 쓴 책이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"what은 선행사가 없을 때 쓰는 관계대명사예요. 문장에서 하는 일은 which와 비슷하지만 앞에 명사가 없고, 전체가 하는 것이라는 뜻의 명사처럼 쓰입니다. which는 앞에 선행사가 있고 뒤에 빠진 주어나 목적어가 있을 때 써요. 전치사 of 뒤에서도 what이 목적어 역할을 할 수 있다는 점을 꼭 기억하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 + have p.p.와 병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실에 대한 추측은 \u003cb class=\"key\">must have p.p.\u003c/b>, 병렬은 같은 형태로 \u003cb class=\"key\">have run and made\u003c/b>처럼 맞춥니다.\u003cdiv>\u003cspan class=\"g-formula\">must + have + p.p. / 조동사 뒤 동사원형 병렬\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must have run\u003c/li>\u003cli>may have been\u003c/li>\u003cli>and 앞뒤 형태 맞추기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He must have run fast.\u003c/div>\u003cdiv class=\"g-ko\">그는 분명히 빨리 달렸을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She may have been tired.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 피곤했을지도 모른다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"조동사 뒤에 have와 과거분사가 함께 오면 과거 사실에 대한 추측이나 후회를 나타내요. 예를 들어 must have run은 과거에 분명히 달렸다고 추측하는 표현이에요. and로 두 동작을 연결할 때는 앞의 형태와 뒤의 형태를 꼭 맞춰야 합니다. made가 과거분사로 쓰였으니 run도 have run으로 맞춰 주는 거예요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사와 동명사, 준동사의 쓰임\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be supposed to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>, 전치사 뒤에는 \u003cb class=\"key\">동명사\u003c/b>, 조동사 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">be supposed to + V / 전치사 + V-ing / 조동사 + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be supposed to build\u003c/li>\u003cli>used to working\u003c/li>\u003cli>help us cope and plan\u003c/li>\u003cli>may regulate and make\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You are supposed to build others up.\u003c/div>\u003cdiv class=\"g-ko\">너는 다른 사람을 세워 줘야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is used to working late.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 늦게까지 일하는 것에 익숙하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"be supposed to 뒤에는 동사원형이 와서 당연히 해야 한다는 뜻을 만들어요. 전치사 뒤에서는 동명사를 쓰고, 조동사 뒤에서는 동사원형을 씁니다. help us cope and plan처럼 and로 연결된 동사들은 같은 형태로 맞춰 줘야 해요. may regulate and make처럼 조동사가 이끄는 동사들도 모두 원형으로 병렬을 맞춥니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">의문사 what과 간접의문문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">간접의문문은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 순서; '~하는 것'의 what은 \u003cb class=\"key\">명사절 접속사\u003c/b>로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">what + S + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>what he wants to hear\u003c/li>\u003cli>what really happened\u003c/li>\u003cli>digest what he eats\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I know what he wants.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 원하는 것을 안다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Tell me what you think.\u003c/div>\u003cdiv class=\"g-ko\">네가 생각하는 것을 말해 줘.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":5,"text":"what은 명사절을 이끌면서 그 절 안에서 주어나 목적어 역할을 해요. 간접의문문은 의문사 다음에 주어와 동사 순서가 와야 하고, 의문사가 주어일 때는 그 뒤에 동사가 바로 이어집니다. what he eats, what he wants to hear처럼 what절 전체를 하나의 명사 덩어리로 보는 연습을 해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(틀린 것 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">The human brain may ① \u003cu class=\"p-u\">have been\u003c/u> a mysterious universe in many ways, and it still is. Fortunately, enough has been revealed to offer us some guidance toward wiser and safer navigations through daily life. Your memory is best thought of as helpful input. It is information sent to help us cope in the present and ② \u003cu class=\"p-u\">plan\u003c/u> for the future. It is not meant to provide foolproof transcripts or recordings of ③ \u003cu class=\"p-u\">which\u003c/u> really happened. And while this can complicate our lives, it works just fine most of the time. We don't need to remember every detail about everything. For more than two million years of human existence, we have survived and thrived in large part ④ \u003cu class=\"p-u\">because\u003c/u> our memory worked well enough. Even in our information-soaked and fast-changing world, it still ⑤ \u003cu class=\"p-u\">does\u003c/u>.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① may have been\u003c/div>\u003cdiv class=\"p-op\">② plan\u003c/div>\u003cdiv class=\"p-op\">③ which\u003c/div>\u003cdiv class=\"p-op\">④ because\u003c/div>\u003cdiv class=\"p-op\">⑤ does\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (which → what)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":6,"text":"첫 번째 문제는 기억의 역할에 관한 글이에요. 각 밑줄이 관계사인지 접속사인지, 준동사가 올바른 자리인지 확인하면서 틀린 곳을 찾아보세요.","hl":"q"},{"n":7,"text":"","hl":"q","pause":7},{"n":8,"text":"정답은 세 번째 밑줄이에요. which는 앞에 선행사가 필요하고 뒤에 빠진 성분이 있어야 하는데, 여기서는 실제로 일어난 일을 통째로 받는 what이 필요합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(틀린 것 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">The human brain may ① \u003cu class=\"p-u\">have been\u003c/u> a mysterious universe in many ways, and it still is. Fortunately, enough has been revealed to offer us some guidance toward wiser and safer navigations through daily life. Your memory is best thought of as helpful input. It is information sent to help us cope in the present and ② \u003cu class=\"p-u\">plan\u003c/u> for the future. It is not meant to provide foolproof transcripts or recordings of ③ \u003cu class=\"p-u\">which\u003c/u> really happened. And while this can complicate our lives, it works just fine most of the time. We don't need to remember every detail about everything. For more than two million years of human existence, we have survived and thrived in large part ④ \u003cu class=\"p-u\">because\u003c/u> our memory worked well enough. Even in our information-soaked and fast-changing world, it still ⑤ \u003cu class=\"p-u\">does\u003c/u>.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① may have been\u003c/div>\u003cdiv class=\"p-op\">② plan\u003c/div>\u003cdiv class=\"p-op\">③ which\u003c/div>\u003cdiv class=\"p-op\">④ because\u003c/div>\u003cdiv class=\"p-op\">⑤ does\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① have been\u003c/b>may 뒤에 have p.p.가 온 \u003cb class=\"key\">현재완료 추측\u003c/b> 표현이라 어법상 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② plan\u003c/b>help us cope and plan에서 \u003cb class=\"key\">cope와 plan\u003c/b>이 and로 병렬된 동사원형이라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ which\u003c/b>recordings of \u003cb class=\"key\">what\u003c/b> really happened: 전치사 of의 목적어이자 really happened의 주어 역할을 하는 명사절 접속사가 필요합니다. which는 선행사가 있어야 하므로 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ because\u003c/b>뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 와서 이유를 나타내는 접속사 because가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ does\u003c/b>앞의 works well enough를 대신하는 \u003cb class=\"key\">대동사 does\u003c/b>라 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (which → what)\u003c/span>\u003cdiv class=\"p-full\">It is not meant to provide foolproof transcripts or recordings of what really happened.\u003c/div>\u003cdiv class=\"p-ko\">인간의 뇌는 여러 면에서 신비로운 우주였을지 모르지만, 기억은 실제로 일어난 일을 그대로 기록한 것이 아니라 현재와 미래에 도움이 되는 정보라는 내용입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>which 앞에 선행사가 있는지, 뒤에 빠진 성분이 있는지 확인하지 않고 해석만 하는 것\u003c/div>","segs":[{"n":9,"text":"첫 번째 밑줄은 may have been이에요. may 뒤에 have been이 와서 과거부터 이어진 상태를 추측하는 표현으로 자연스럽습니다.","hl":"st-0"},{"n":10,"text":"두 번째 밑줄은 help us cope and plan에서 cope와 plan이 나란히 연결된 구조예요. and 앞뒤가 동사원형으로 맞으니까 문제가 없습니다.","hl":"st-1"},{"n":11,"text":"세 번째 밑줄은 recordings of what really happened로 봐야 해요. 전치사 of 뒤에서 really happened의 주어 역할을 하는 what이 필요하고, which는 앞에 선행사가 있어야 하므로 틀립니다.","hl":"st-2"},{"n":12,"text":"네 번째 밑줄 because는 뒤에 완전한 절이 와서 이유를 나타내요. our memory worked well enough가 완전한 절이라 because가 알맞습니다.","hl":"st-3"},{"n":13,"text":"다섯 번째 밑줄 does는 앞에 나온 works well enough를 대신하는 대동사예요. 시제와 수가 맞으므로 어법상 문제가 없습니다.","hl":"st-4"},{"n":14,"text":"이 문제의 함정도 짚고 갈게요. which 앞에 선행사가 있는지, 뒤에 빠진 성분이 있는지 확인하지 않고 해석만 하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동격 that과 관계대명사 which\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">fact, idea, notion, evidence, clue 뒤에서 내용을 설명하는 접속사는 \u003cb class=\"key\">that\u003c/b>, 선행사를 받는 관계대명사는 \u003cb class=\"key\">which\u003c/b>입니다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + that + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>that 뒤는 완전한 절\u003c/li>\u003cli>which 뒤는 불완전한 절\u003c/li>\u003cli>the notion that he must be fed\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There is a notion that the patient must be fed.\u003c/div>\u003cdiv class=\"g-ko\">환자는 반드시 먹여야 한다는 생각이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is the clue which he left.\u003c/div>\u003cdiv class=\"g-ko\">이것은 그가 남긴 단서이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"동격 that은 앞에 나온 명사의 내용을 that 이하 문장으로 설명해 줘요. 그래서 that 뒤에는 주어와 동사가 다 있는 완전한 절이 옵니다. 반면 which는 앞의 명사를 받는 관계대명사라서 뒤에 빠진 성분이 있어야 해요. notion, fact, idea, evidence, clue 뒤에서는 동격 that이 자주 나온다는 점도 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법과 as if 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재 사실의 반대는 \u003cb class=\"key\">if + 과거, would + V\u003c/b>, 과거 사실의 반대는 \u003cb class=\"key\">if + had p.p., would have p.p.\u003c/b>; as if 뒤에는 \u003cb class=\"key\">were\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + had p.p., S + would + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>as if it were medicine\u003c/li>\u003cli>had he studied = if he had studied\u003c/li>\u003cli>if the meal had been better\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If I were you, I would apologize.\u003c/div>\u003cdiv class=\"g-ko\">내가 너라면 사과할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He would have come if he had known.\u003c/div>\u003cdiv class=\"g-ko\">알았더라면 그는 왔을 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"가정법은 현실과 반대되는 상황을 상상할 때 써요. 과거 사실의 반대라면 if절에 had와 과거분사를 쓰고 주절에는 would를 씁니다. as if 뒤에서 현재 사실과 반대되는 상상을 할 때는 were를 쓰는 경우가 많아요. 조건절에서 if를 생략하면 had가 문장 앞으로 나올 수 있다는 점도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(틀린 것 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">There is the foolish notion ① \u003cu class=\"p-u\">which\u003c/u> the weak patient must be fed. It is argued that if the patient does not eat, his strength cannot ② \u003cu class=\"p-u\">be\u003c/u> sustained; that he must, therefore, inevitably be weak and worse over time. It is believed that he must be fed, even if he cannot digest ③ \u003cu class=\"p-u\">what\u003c/u> he eats. The patient is so weak in many cases that he can hardly move his hands or feet, yet it is insisted that he ④ \u003cu class=\"p-u\">be\u003c/u> fed three times a day. Will he recover if fed? He may die of intestinal intoxication if he is fed. He cannot be nourished by feeding, ⑤ \u003cu class=\"p-u\">no matter what\u003c/u> foods are given. He may be so weak that he will die if he gets much weaker, yet he should still fast. The surest way to make him weaker is to feed him. It is a fact which has been demonstrated hundreds of times.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① which\u003c/div>\u003cdiv class=\"p-op\">② be sustained\u003c/div>\u003cdiv class=\"p-op\">③ what\u003c/div>\u003cdiv class=\"p-op\">④ be fed\u003c/div>\u003cdiv class=\"p-op\">⑤ no matter what foods are given\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">① (which → that)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"두 번째 문제는 환자를 먹이는 것에 대한 주장을 다뤄요. 동격 that과 관계대명사 which를 구별하고, insist 뒤의 동사 형태도 함께 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 첫 번째 밑줄이에요. notion의 내용을 설명하는 동격 접속사 that이 와야 하고 which는 이 자리에 쓸 수 없습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(틀린 것 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">There is the foolish notion ① \u003cu class=\"p-u\">which\u003c/u> the weak patient must be fed. It is argued that if the patient does not eat, his strength cannot ② \u003cu class=\"p-u\">be\u003c/u> sustained; that he must, therefore, inevitably be weak and worse over time. It is believed that he must be fed, even if he cannot digest ③ \u003cu class=\"p-u\">what\u003c/u> he eats. The patient is so weak in many cases that he can hardly move his hands or feet, yet it is insisted that he ④ \u003cu class=\"p-u\">be\u003c/u> fed three times a day. Will he recover if fed? He may die of intestinal intoxication if he is fed. He cannot be nourished by feeding, ⑤ \u003cu class=\"p-u\">no matter what\u003c/u> foods are given. He may be so weak that he will die if he gets much weaker, yet he should still fast. The surest way to make him weaker is to feed him. It is a fact which has been demonstrated hundreds of times.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① which\u003c/div>\u003cdiv class=\"p-op\">② be sustained\u003c/div>\u003cdiv class=\"p-op\">③ what\u003c/div>\u003cdiv class=\"p-op\">④ be fed\u003c/div>\u003cdiv class=\"p-op\">⑤ no matter what foods are given\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① which\u003c/b>the foolish notion \u003cb class=\"key\">that\u003c/b> the weak patient must be fed: notion의 내용을 설명하는 동격 that이 필요합니다. which는 뒤 절이 완전하므로 불가능합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② be sustained\u003c/b>cannot \u003cb class=\"key\">be sustained\u003c/b>는 수동태로, his strength가 유지될 수 없다는 뜻이라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ what\u003c/b>digest \u003cb class=\"key\">what\u003c/b> he eats에서 what he eats가 digest의 목적어 역할을 하므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ be fed\u003c/b>insist 뒤 that절에서 should가 생략된 \u003cb class=\"key\">be\u003c/b> 동사원형이 쓰일 수 있으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\"  \u003cu class=\"p-u\">began\u003c/u> when some random mutation caused wings to grow.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① to result\u003c/div>\u003cdiv class=\"p-op\">② run\u003c/div>\u003cdiv class=\"p-op\">③ that\u003c/div>\u003cdiv class=\"p-op\">④ that\u003c/div>\u003cdiv class=\"p-op\">⑤ began\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① to result\u003c/b>be likely \u003cb class=\"key\">to result\u003c/b>는 '~할 가능성이 있다'로 to부정사가 와서 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② run\u003c/b>must \u003cb class=\"key\">have run\u003c/b> faster and faster and made longer and longer leaps: made가 과거분사이므로 과거 추측 must have p.p.로 병렬을 맞춰야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ that\u003c/b>predators \u003cb class=\"key\">that\u003c/b> pounced에서 that은 주격 관계대명사라 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ that\u003c/b>agree that ... and \u003cb class=\"key\">that\u003c/b> ...에서 두 번째 that절이 병렬로 연결되어 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ began\u003c/b>flight \u003cb class=\"key\">began\u003c/b>은 자동사 began이 주어 flight와 함께 쓰여 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (run → have run)\u003c/span>\u003cdiv class=\"p-full\">One theory proposes that bird ancestors must have run faster and faster and made longer and longer leaps.\u003c/div>\u003cdiv class=\"p-ko\">새의 비행 기원에 관한 여러 이론이 행동 변화가 먼저였고 형태 적응이 뒤따랐다고 본다는 내용입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must 뒤에 made가 있으니 run도 과거형으로 착각하는 것\u003c/div>","segs":[{"n":39,"text":"첫 번째 밑줄은 be likely to result예요. be likely to 뒤에는 동사원형이 오므로 result가 맞습니다.","hl":"st-0"},{"n":40,"text":"두 번째 밑줄은 must run and made인데, made가 과거분사로 쓰였어요. 과거 사실에 대한 강한 추측은 must have run으로 맞춰야 하고, and 뒤 mad  she may just be a person who doesn't care enough.\u003c/u> ⓔ \u003cu class=\"p-u\">That may be the clue which your friend does not care about you.\u003c/u>\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② (ⓑ, ⓓ가 어법상 맞음)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":47,"text":"다섯 번째 문제는 친구 관계에 대한 글에서 다섯 문장의 어법을 판별하는 문제예요. 각 문장에서 준동사, 접속사, 관계사를 하나씩 확인해 보세요.","hl":"q"},{"n":48,"text":"","hl":"q","pause":7},{"n":49,"text":"정답은 두 개예요. 두 번째와 네 번째 문장은 어법상 맞고, 첫 번째는 build, 세 번째는 although, 다섯 번째는 that으로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(맞은 문장 개수)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 알맞은 문장의 개수는?\u003c/div>\u003cdiv class=\"p-psg sm\">ⓐ \u003cu class=\"p-u\">Friends are supposed to building you up, not knock you down.\u003c/u> These red flags will help you spot the pals that could be toxic. ⓑ \u003cu class=\"p-u\">Remember when you were younger and you'd talk to your friends on the phone for hours?\u003c/u> Texting and social media have made staying in touch easier, but it has also contributed to strange relationships. People often say, &quot;ⓒ \u003cu class=\"p-u\">My feeling is that despite we text nearly every day, I need personal contact with people I care about.\u003c/u> To me, it says, 'You're important enough that I want to make time for you.'&quot; ⓓ \u003cu class=\"p-u\">If your friend can't figure out how to reach out over the phone or in person for months, he or she may just be a person who doesn't care enough.\u003c/u> ⓔ \u003cu class=\"p-u\">That may be the clue which your friend does not care about you.\u003c/u>\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ build\u003c/b>be supposed to 뒤에는 동사원형이 와야 하므로 \u003cb class=\"key\">building → build\u003c/b>입니다. ⓐ는 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 맞음\u003c/b>when절 안에서 you were younger and you'd talk가 과거의 습관을 나타내며 어법상 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ although\u003c/b>despite 뒤에 절이 왔으므로 \u003cb class=\"key\">although/though\u003c/b>로 고쳐야 합니다. ⓒ는 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 맞음\u003c/b>how to reach out과 who doesn't care enough가 모두 어법상 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ that\u003c/b>the clue 뒤에 완전한 절이 오므로 동격 \u003cb class=\"key\">that\u003c/b>이 필요합니다. which는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (ⓑ, ⓓ가 어법상 맞음)\u003c/span>\u003cdiv class=\"p-full\">Friends are supposed to build you up, not knock you down. My feeling is that although we text nearly every day, I need personal contact with people I care about. That may be the clue that your friend does not care about you.\u003c/div>\u003cdiv class=\"p-ko\">친구는 너를 세워 줘야 하며, 단지 문자만 자주 하는 것이 아니라 진짜 관심을 보이는지 살펴보라는 내용입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>despite 뒤에 절이 와도 그대로 맞다고 판단하는 것\u003c/div>","segs":[{"n":50,"text":"첫 번째 문장은 be supposed to 뒤에 동사원형이 와야 해요. building이 아니라 build가 되어야 하므로 틀립니다.","hl":"st-0"},{"n":51,"text":"두 번째 문장은 when you were younger and you'd talk 구조예요. would가 과거의 습관을 나타내고 문장도 자연스러우므로 맞습니다.","hl":"st-1"},{"n":52,"text":"세 번째 문장은 despite 뒤에 we text라는 절이 와서 틀렸어요. 절을 이끌려면 although나 though를 써야 합니다.","hl":"st-2"},{"n":53,"text":"네 번째 문장은 how to reach out과 who doesn't care enough가 모두 자연스러워요. 어법상 맞는 문장입니다.","hl":"st-3"},{"n":54,"text":"다섯 번째 문장은 the clue 뒤에 your friend does not care about you라는 완전한 절이 와요. 이때는 동격 that을 써야 하고 which는 틀립니다.","hl":"st-4"},{"n":55,"text":"이 문제의 함정도 짚고 갈게요. despite 뒤에 절이 와도 그대로 맞다고 판단하는 것","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(맞게 고친 것 고르기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고친 것은?\u003c/div>\u003cdiv class=\"p-psg\">No one knows exactly how music heals, but it looks like our brains are wired to respond to it. There is evidence ⓐ \u003cu class=\"p-u\">what\u003c/u> shows music can heal the body, strengthen the mind, and unlock the creative spirit. Exciting new research suggests that our brains respond to music almost as if ⓑ \u003cu class=\"p-u\">it\u003c/u> ⓒ \u003cu class=\"p-u\">be\u003c/u> medicine. Music may regulate some body functions, synchronize motor skills, stimulate the mind and even ⓓ \u003cu class=\"p-u\">making\u003c/u> us smarter. According to Suzanne Hanser, D. Ed., a lecturer at Harvard Medical School's Department of Social Medicine: &quot;There is no set prescription or a particular piece of music that will make everyone feel better or more relaxed. ⓔ \u003cu class=\"p-u\">That\u003c/u> counts is musical taste, the kinds of memories, feelings and associations a piece of music brings to mind. Some people relax to classical music, and others like the Moody Blues. ⓕ \u003cu class=\"p-u\">However\u003c/u> the genre is, the key is to individualize your musical selections.&quot;\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ it\u003c/div>\u003cdiv class=\"p-op\">② ⓑ are\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ to make\u003c/div>\u003cdiv class=\"p-op\">④ ⓔ What\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓕ However\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ (ⓔ That → What)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":56,"text":"여섯 번째 문제는 음악 치료에 관한 글이에요. 관계대명사 what과 that, as if 뒤의 동사, 병렬 구조, What counts 구문을 차례로 확인해 보세요.","hl":"q"},{"n":57,"text":"","hl":"q","pause":7},{"n":58,"text":"정답은 네 번째 선택지예요. That을 What으로 고쳐 What counts is musical taste로 만들어야 문장의 주어 역할을 제대로 할 수 있습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(맞게 고친 것 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고친 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">No one knows exactly how music heals, but it looks like our brains are wired to respond to it. There is evidence ⓐ \u003cu class=\"p-u\">what\u003c/u> shows music can heal the body, strengthen the mind, and unlock the creative spirit. Exciting new research suggests that our brains respond to music almost as if ⓑ \u003cu class=\"p-u\">it\u003c/u> ⓒ \u003cu class=\"p-u\">be\u003c/u> medicine. Music may regulate some body functions, synchronize motor skills, stimulate the mind and even ⓓ \u003cu class=\"p-u\">making\u003c/u> us smarter. According to Suzanne Hanser, D. Ed., a lecturer at Harvard Medical School's Department of Social Medicine: &quot;There is no set prescription or a particular piece of music that will make everyone feel better or more relaxed. ⓔ \u003cu class=\"p-u\">That\u003c/u> counts is musical taste, the kinds of memories, feelings and associations a piece of music brings to mind. Some people relax to classical music, and others like the Moody Blues. ⓕ \u003cu class=\"p-u\">However\u003c/u> the genre is, the key is to individualize your musical selections.&quot;\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ it\u003c/div>\u003cdiv class=\"p-op\">② ⓑ are\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ to make\u003c/div>\u003cdiv class=\"p-op\">④ ⓔ What\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓕ However\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>evidence \u003cb class=\"key\">that/which\u003c/b> shows: 선행사 evidence가 있으므로 what이 아니라 that/which가 필요합니다. 선택지 ①의 it은 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>it은 music을 받는 단수 주어라 \u003cb class=\"key\">are\u003c/b>로 바꿀 수 없습니다. 선택지 ②는 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>as if 뒤 가정법에서는 \u003cb class=\"key\">were\u003c/b>가 필요하므로 to make로 바꿀 수 없습니다. 선택지 ③은 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>may regulate, synchronize, stimulate와 병렬이므로 \u003cb class=\"key\">making → make\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>That을 \u003cb class=\"key\">What\u003c/b>으로 고쳐 What counts is musical taste가 되어야 합니다. 선택지 ④가 정답입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">ⓕ 확인\u003c/b>However는 명사 the genre를 바로 받을 수 없으므로 \u003cb class=\"key\">Whatever\u003c/b> the genre is로 고쳐야 합니다. 선택지 ⑤는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ (ⓔ That → What)\u003c/span>\u003cdiv class=\"p-full\">There is evidence that shows music can heal the body, strengthen the mind, and unlock the creative spirit. Our brains respond to music almost as if it were medicine. Music may regulate some body functions, synchronize motor skills, stimulate the mind and even make us smarter. What counts is musical taste. Whatever the genre is, the key is to individualize your musical selections.\u003c/div>\u003cdiv class=\"p-ko\">음악이 몸과 마음에 도움을 주며, 중요한 것은 음악의 장르가 아니라 각자에게 맞는 음악을 선택하는 것이라는 내용입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>as if 뒤의 be와 병렬 구조의 make를 놓치고 What counts 구문만 보는 것\u003c/div>","segs":[{"n":59,"text":"첫 번째 밑줄은 evidence 뒤에서 shows의 주어 역할을 해야 해요. 선행사 evidence가 있으므로 that이나 which가 필요하고 what은 틀립니다.","hl":"st-0"},{"n":60,"text":"두 번째 밑줄 it은 music을 받는 단수 주어예요. are로 바꾸면 주어와 맞지 않습니다.","hl":"st-1"},{"n":61,"text":"세 번째 밑줄 be는 as if 뒤에서 가정법으로 쓰여 were가 되어야 해요. to make로 바꾸는 것은 알맞지 않습니다.","hl":"st-2"},{"n":62,"text":"네 번째 밑줄 making은 may regulate, synchronize, stimulate와 병렬이어야 해요. 그래서 make가 되어야 합니다.","hl":"st-3"},{"n":63,"text":"다섯 번째 밑줄 That은 What으로 고쳐 What counts is musical taste로 만들어야 해요. 이 선택지가 정답입니다.","hl":"st-4"},{"n":64,"text":"여섯 번째 밑줄 However는 Whatever the genre is로 고쳐야 해요. however는 이 구조에서 명사 the genre를 바로 받을 수 없습니다.","hl":"st-5"},{"n":65,"text":"이 문제의 함정도 짚고 갈게요. as if 뒤의 be와 병렬 구조의 make를 놓치고 What counts 구문만 보는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어와 동사의 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계대명사절의 동사는 \u003cb class=\"key\">선행사\u003c/b>에, 본동사는 \u003cb class=\"key\">주어\u003c/b>에 수를 맞춥니다.\u003cdiv>\u003cspan class=\"g-formula\">복수 선행사 + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>participants who use\u003c/li>\u003cli>races are common\u003c/li>\u003cli>it were\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Participants who use the option are many.\u003c/div>\u003cdiv class=\"g-ko\">그 선택지를 사용하는 참가자가 많다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">These races are common in chemistry.\u003c/div>\u003cdiv class=\"g-ko\">이런 경쟁은 화학에서 er their circumstances. All people matter, (1) \u003cu class=\"p-u\">그들이 어디에 살든, 그들이 아무리 부자일지라도\u003c/u>, and whatever their ethnicity, age, gender, ability, religious views, etc. All else being equal, we should save more lives, help people live longer, and make more people happier. Imagine twenty sick people lining a hospital ward who'll die if you don't give them medicine. You have enough medicine for everyone, and no reason to hold onto it for later: would anyone really choose to arbitrarily save only some of the people if it was just as easy to save all of them? (2) \u003cu class=\"p-u\">여러분은 여러분이 할 수 있는 한 많은 이를 돕는 것이 더 낫다.\u003c/u> Helping more is better than helping less.\u003c/div>\u003cdiv class=\"p-words\">(1) however / wherever / they / they / are / live / rich\u003cbr>(2) you / you / can / might / help / as / as / as well / many\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) wherever they live, however rich they are (2) You might as well help as many as you can.\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":74,"text":"여덟 번째 문제는 두 우리말을 주어진 단어로 배열하는 문제예요. however와 wherever의 어순, might as well과 as many as의 짝을 찾아보세요.","hl":"q"},{"n":75,"text":"","hl":"q","pause":7},{"n":76,"text":"첫 번째는 wherever they live, however rich they are이고, 두 번째는 You might as well help as many as you can입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 (1), (2)의 밑줄 친 우리말과 같은 뜻이 되도록 괄호 안의 말을 바르게 배열하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">People are equal—everyone has an equal claim to being happy, healthy, fulfilled and free, whatever their circumstances. All people matter, (1) \u003cu  to every question. Some participants respond &quot;disagree&quot; or &quot;strongly disagree&quot; to every statement. Other participants always choose the &quot;neutral&quot; or ⑤ \u003cu class=\"p-u\">neither agree nor disagree\u003c/u> option.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① asking\u003c/div>\u003cdiv class=\"p-op\">② after\u003c/div>\u003cdiv class=\"p-op\">③ what\u003c/div>\u003cdiv class=\"p-op\">④ whose\u003c/div>\u003cdiv class=\"p-op\">⑤ neither agree nor disagree\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ (whose → who)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":82,"text":"아홉 번째 문제는 설문 조사에서의 응답 습관에 관한 글이에요. 전치사 뒤 동명사, 관계대명사 who와 whose, what절을 확인해 보세요.","hl":"q"},{"n":83,"text":"","hl":"q","pause":7},{"n":84,"text":"정답은 네 번째 밑줄이에요. participants 뒤에서 use의 주어 역할을 해야 하므로 whose가 아니라 who가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(어색한 것 고르기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글을 읽고, 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">When it comes to ① \u003cu class=\"p-u\">asking\u003c/u> participants questions in a survey, sometimes participants will give you the answer they think you want to hear. Their behavior may be similar to yours when, ② \u003cu class=\"p-u\">after\u003c/u> a lousy meal, the server asks you, &quot;Was everything okay?&quot; In such a case, rather than telling the server everything was lousy, you say ③ \u003cu class=\"p-u\">what\u003c/u> you think he wants to hear—&quot;Yes, everything was okay.&quot; Of course, \u003cu class=\"p-u\">당신은 식사가 더 좋았더라면 그것을 더 신나서 말할 것이다.\u003c/u> But the point is that you give the server the answer you think he wants to hear. Also, participants may follow a response set: a habit of responding in a certain, set way, regardless of what the question is. There are participants ④ \u003cu class=\"p-u\">whose\u003c/u> use the &quot;agree&quot; or &quot;strongly agree&quot; option in response to every question. Some participants respond &quot;disagree&quot; or &quot;strongly disagree&quot; to every statement. Other participants always choose the &quot;neutral&quot; or ⑤ \u003cu class=\"p-u\">neither agree nor disagree\u003c/u> option.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① asking\u003c/div>\u003cdiv class=\"p-op\">② after\u003c/div>\u003cdiv class=\"p-op\">③ what\u003c/div>\u003cdiv class=\"p-op\">④ whose\u003c/div>\u003cdiv class=\"p-op\">⑤ neither agree nor disagree\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① asking\u003c/b>When it comes to는 전치사 to로 끝나므로 뒤에 동명사 \u003cb class=\"key\">asking\u003c/b>이 와서 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② after\u003c/b>\u003cb class=\"key\">after\u003c/b> a lousy meal은 전치사 after + 명사구라서 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ what\u003c/b>say의 목적어 역할을 하는 명사절 \u003cb class=\"key\">what you think he wants to hear\u003c/b>가 되어 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ whose\u003c/b>participants 뒤에서 use의 주어 역할을 해야 하므로 \u003cb class=\"key\">who\u003c/b>가 필요합니다. whose는 소유격이라 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ neither agree nor disagree\u003c/b>neither A nor B 병렬 구조로 option을 꾸미므로 어법상 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ (whose → who)\u003c/span>\u003cdiv class=\"p-full\">There are participants who use the agree or strongly agree option in response to every question.\u003c/div>\u003cdiv class=\"p-ko\">설문에서 참가자들이 듣고 싶어 하는 대답이나 습관적인 응답 방식을 따를 수 있다는 내용입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>whose 뒤에 명사가 없는데도 소유격 관계대명사로 판단하는 것\u003c/div>","segs":[{"n":85,"text":"첫 번째 밑줄은 When it comes to 뒤에 asking이 온 구조예요. 전치사 to 뒤에 동명사가 왔으므로 맞습니다.","hl":"st-0"},{"n":86,"text":"두 번째 밑줄 after는 a lousy meal 앞에 놓인 전치사예요. 식사 후에라는 뜻으로 자연스럽습니다.","hl":"st-1"},{"n":87,"text":"세 번째 밑줄 what은 say의 목적어 역할을 하는 what you think he wants to hear를 이끌어요. 맞습니다.","hl":"st-2"},{"n":88,"text":"네 번째 밑줄은 participants 뒤에 use라는 동사가 바로 이어져요. 주격 관계대명사 who가 필요하고 whose는 소유격이라 틀립니다.","hl":"st-3"},{"n":89,"text":"다섯 번째 밑줄 neither agree nor disagree는 neither A nor B 병렬 구조로 option을 꾸며요. 어법상 맞습니다.","hl":"st-4"},{"n":90,"text":"이 문제의 함정도 짚고 갈게요. whose 뒤에 명사가 없는데도 소유격 관계대명사로 판단하는 것","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">영작 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003c/div>\u003cdiv class=\"p-q\">당신은 식사가 더 좋았더라면 그것을 더 신나서 말할 것이다.\u003c/div>\u003cdiv class=\"p-words\">보기: if / excitedly / the meal / you / would / be / say / better / it / more / have\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">You would say it more excitedly if the meal had been better.\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":91,"text":"마지막 문제는 우리말을 조건에 맞게 영작하는 문제예요. 과거 사실의 반대를 나타내는 가정법 형태와 부사의 위치를 확인해 보세요.","hl":"q"},{"n":92,"text":"","hl":"q","pause":7},{"n":93,"text":"정답은 You would say it more excitedly if the meal had been better입니다. if절에는 had been을 쓰고, 주절에는 would say를 써서 과거 사실의 반대를 표현합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">영작 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오.\u003c/div>\u003cdiv class=\"p-q sm\">당신은 식사가 더 좋았더라면 그것을 더 신나서 말할 것이다.\u003c/div>\u003cdiv class=\"p-words\">보기: if / excitedly / the meal / you / would / be / say / better / it / more / have\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">if절 만들기\u003c/b>과거 사실의 반대이므로 if절은 \u003cb class=\"key\">if + 주어 + had p.p.\u003c/b>로 if the meal had been better를 만듭니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주절 만들기\u003c/b>주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>으로 you would say it more excitedly를 만듭니다. more excitedly는 say를 꾸밉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">전체 결합\u003c/b>if절을 뒤에 붙여 \u003cb class=\"key\">You would say it more excitedly if the meal had been better\u003c/b>를 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 You would say it more excitedly if the meal had been better.\u003c/span>\u003cdiv class=\"p-full\">You would say it more excitedly if the meal had been better.\u003c/div>\u003cdiv class=\"p-ko\">식사가 더 좋았더라면 당신은 그것을 더 신나서 말했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>if절에 would를 쓰거나 excitedly를 more 없이 쓰는 것\u003c/div>","segs":[{"n":94,"text":"이 문장은 과거 사실의 반대를 상상하는 가정법 과거완료예요. if절에는 if the meal had been better를 씁니다.","hl":"st-0"},{"n":95,"text":"주절은 you would say it more excitedly로 만들어요. more excitedly는 say를 꾸미는 부사로 뒤에 놓습니다.","hl":"st-1"},{"n":96,"text":"두 부분을 합치면 You would say it more excitedly if the meal had been better가 됩니다.","hl":"st-2"},{"n":97,"text":"이 문제의 함정도 짚고 갈게요. if절에 would를 쓰거나 excitedly를 more 없이 쓰는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사·관계부사, 준동사, 가정법, 병렬 구조 등 어법 종합\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>선행사가 없으면 \u003cb class=\"key\">what\u003c/b>, 선행사가 있으면 \u003cb class=\"key\">which/that\u003c/b>을 쓴다.\u003c/li>\u003cli>명사 뒤에서 내용을 설명하는 절은 \u003cb class=\"key\">동격 that\u003c/b>, 장소·상황은 \u003cb class=\"key\">where/in which\u003c/b>로 연결한다.\u003c/li>\u003cli>조동사 뒤 병렬은 \u003cb class=\"key\">같은 형태\u003c/b>로 맞추고, 과거 추측은 \u003cb class=\"key\">must have p.p.\u003c/b>로 쓴다.\u003c/li>\u003cli>과거 사실의 반대는 \u003cb class=\"key\">if + had p.p., would + V\u003c/b>로 표현한다.\u003c/li>\u003cli>전치사 뒤에는 \u003cb class=\"key\">동명사\u003c/b>, 조동사 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>을 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":98,"text":"오늘은 관계사와 준동사, 가정법, 병렬 구조를 중심으로 열 문제를 풀었어요. 정답만 외우지 말고 선행사가 있는지, 절이 완전한지, 동사 형태가 병렬인지 먼저 확인하는 습관을 기르세요. 틀린 문제는 다시 풀면서 왜 그 형태가 되어야 하는지 소리 내어 설명해 보면 좋습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
