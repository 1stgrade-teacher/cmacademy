  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};

lecturePlayer(document.getElementById("app"),{"brand":"챕터1 동사 Point06","title":"태 — 주어가 하면 능동태, 당하면 수동태","audioDir":"point06_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">태 (Voice)\u003c/div>\u003ch1>태 — 주어가 하면 능동태, 당하면 수동태\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어가 동작의 주체인지 대상인지 판단해 능동태와 수동태를 정확히 구별하고, 수동태로 쓸 수 없는 동사를 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 문장의 태, 즉 능동태와 수동태를 함께 공부해 볼 거예요. 태는 주어가 동작을 직접 하는지, 아니면 동작을 당하는지에 따라 결정되는 아주 중요한 개념이에요. 오늘은 기본 규칙 세 가지와 함께 학생들이 자주 틀리는 함정까지 깔끔하게 정리해 드릴게요. 자, 그럼 시작해 볼까요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">주어가 주체면 능동태, 대상이면 수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 동사가 나타내는 동작의 \u003cb class=\"key\">주체\u003c/b>이면 \u003cb class=\"key\">능동태\u003c/b>, 동작의 \u003cb class=\"key\">대상\u003c/b>이면 \u003cb class=\"key\">수동태\u003c/b>를 쓴다. 다시 말해 주어가 스스로 하는 일이면 능동태, 주어가 당하는 일이면 수동태이다.\u003cdiv>\u003cspan class=\"g-formula\">능동태: S + V + O / 수동태: S + be + p.p. (+ by + 행위자)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Employees \u003cspan class=\"fx\">were offered\u003c/span> gifts and benefits by the company.\u003c/div>\u003cdiv class=\"g-ko\">직원들은 회사로부터 선물과 혜택을 제공받았다.\u003c/div>\u003cdiv class=\"g-note\">주어 Employees가 선물과 혜택을 제공 받는 대상이므로 수동태가 적절하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The company \u003cspan class=\"fx\">offered\u003c/span> employees gifts and benefits.\u003c/div>\u003cdiv class=\"g-ko\">그 회사는 직원들에게 선물과 혜택을 제공했다.\u003c/div>\u003cdiv class=\"g-note\">주어 The company가 제공하는 주체이므로 능동태를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>수동태에서 \u003cb class=\"key\">by + 행위자\u003c/b>는 누가 그 일을 했는지 밝힐 필요가 있을 때만 쓴다.\u003c/div>","segs":[{"n":2,"text":"먼저 태의 가장 기본 개념부터 볼게요. 주어가 동사가 나타내는 동작을 직접 하는 주체라면 능동태를 쓰고, 동작을 당하는 대상이라면 수동태를 씁니다. 능동태는 주어 다음에 동사와 목적어가 오는 익숙한 모양이고, 수동태는 be 동사와 과거분사가 오는 모양이죠. 그래서 문장을 볼 때 주어가 하는 쪽인지 당하는 쪽인지를 먼저 따져 보면 답이 훨씬 쉽게 보입니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. Employees were offered gifts and benefits by the company. 직원들은 회사로부터 선물과 혜택을 제공받았다는 뜻이에요. 주어인 Employees는 제공하는 쪽이 아니라 제공을 받는 쪽이죠. 그래서 were offered라는 수동태가 쓰였습니다.","hl":"ex-0"},{"n":4,"text":"이번에는 같은 내용을 능동태로 바꿔 볼게요. The company offered employees gifts and benefits. 그 회사는 직원들에게 선물과 혜택을 제공했다는 뜻입니다. 주어인 The company가 제공하는 주체이기 때문에 능동태 offered를 그대로 씁니다. 이렇게 같은 상황도 주어가 누구냐에 따라 태가 달라진다는 점을 눈여겨보세요.","hl":"ex-1"},{"n":5,"text":"수동태 뒤에 오는 by 표현은 누가 그 일을 했는지 꼭 밝혀야 할 때만 씁니다. 누가 했는지가 중요하지 않다면 굳이 쓰지 않아도 된다는 점 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">수동태 뒤에는 목적어가 없다, 4·5형식은 예외\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">수동태는 능동태의 \u003cb class=\"key\">목적어\u003c/b>가 수동태의 \u003cb class=\"key\">주어\u003c/b>가 되므로 동사 뒤에 목적어가 없다. 단, \u003cb class=\"key\">4형식\u003c/b> 수동태는 동사 뒤에 목적어가, \u003cb class=\"key\">5형식\u003c/b> 수동태는 보어가 남는다.\u003cdiv>\u003cspan class=\"g-formula\">4형식: S + be + p.p. + (남은) 목적어 / 5형식: S + be + p.p. + (남은) 목적격보어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Employees were offered \u003cspan class=\"fx\">gifts and benefits\u003c/span> by the company.\u003c/div>\u003cdiv class=\"g-ko\">직원들은 회사로부터 선물과 혜택을 제공받았다.\u003c/div>\u003cdiv class=\"g-note\">4형식 능동태 문장의 직접목적어(gifts and benefits)가 동사 뒤에 남겨진 형태이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Spilling salt has been considered \u003cspan class=\"fx\">unlucky\u003c/span> for thousands of years.\u003c/div>\u003cdiv class=\"g-ko\">소금을 쏟는 것은 수천 년 동안 불운한 일로 여겨져 왔다.\u003c/div>\u003cdiv class=\"g-note\">unlucky는 보어(능동태 문장의 목적격보어)로 수동태 뒤에 남는다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>4형식 수동태에서 사람이 주어가 되면 \u003cb class=\"key\">직접목적어\u003c/b>가 남고, 사물이 주어가 되면 \u003cb class=\"key\">간접목적어\u003c/b> 앞에 to나 for가 붙는다.\u003c/div>","segs":[{"n":6,"text":"두 번째는 수동태 문장의 모양에 대한 규칙이에요. 수동태는 능동태의 목적어가 주어 자리로 올라가면서 만들어지기 때문에 동사 뒤에 목적어가 남지 않습니다. 그런데 4형식과 5형식 문장이 수동태가 되면 이야기가 조금 달라져요. 4형식에서는 목적어 하나가 동사 뒤에 그대로 남고, 5형식에서는 목적격보어가 그대로 남습니다. 그래서 동사 뒤에 목적어나 보어가 보이더라도 당황하지 마세요.","hl":"rule"},{"n":7,"text":"이 예문을 4형식 수동태로 다시 볼게요. Employees were offered gifts and benefits by the company. 주어는 Employees인데도 동사 뒤에 gifts and benefits가 남아 있죠. 능동태 문장의 직접목적어가 주어로 가지 않고 동사 뒤에 그대로 남겨진 형태입니다.","hl":"ex-0"},{"n":8,"text":"이번 예문도 볼게요. Spilling salt has been considered unlucky for thousands of years. 소금을 쏟는 것은 수천 년 동안 불운한 일로 여겨져 왔다는 뜻이에요. 주어인 Spilling salt는 불운으로 여겨지는 대상이니까 수동태를 썼고, 뒤에 남아 있는 unlucky는 보어, 즉 능동태 문장의 목적격보어입니다. 완료형 수동태라서 has been considered의 형태가 쓰였습니다.","hl":"ex-1"},{"n":9,"text":"4형식 문장이 수동태가 될 때는 남는 목적어가 달라질 수 있어요. 사람이 주어가 되면 직접목적어가 그대로 남고, 사물이 주어가 되면 간접목적어 앞에 to나 for를 붙여 주면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">자동사와 일부 타동사는 수동태로 쓸 수 없다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">자동사\u003c/b>는 목적어가 없으므로 수동태로 쓸 수 없다. 일부 \u003cb class=\"key\">타동사\u003c/b> resemble, lack, cost, escape 등도 수동태로 사용하지 않는다.\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A problem has recently \u003cspan class=\"fx\">occurred\u003c/span> that needs your attention.\u003c/div>\u003cdiv class=\"g-ko\">최근에 주의를 기울여야 할 문제가 발생했다.\u003c/div>\u003cdiv class=\"g-note\">occur는 '발생하다'라는 뜻의 자동사이므로 수동태로 쓸 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">resembles\u003c/span> her mother.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 어머니를 닮았다.\u003c/div>\u003cdiv class=\"g-note\">resemble은 수동태로 쓰지 않는 타동사이므로 능동태 그대로 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>수동태로 잘못 사용하기 쉬운 자동사: happen, occur, appear, disappear, exist, result, remain, vary, last, respond, belong, consist 등. \u003cb class=\"key\">진행형 수동태\u003c/b>는 be being + p.p., \u003cb class=\"key\">완료형 수동태\u003c/b>는 have been + p.p.로 쓴다.\u003c/div>","segs":[{"n":10,"text":"세 번째 규칙은 수동태로 쓸 수 없는 동사들이에요. 자동사는 목적어를 가지지 않기 때문에 애초에 목적어를 주어로 올리는 수동태를 만들 수 없습니다. 발생하다라는 뜻의 occur나 happen, 나타나다라는 뜻의 appear 같은 동사들이 대표적이죠. 그리고 목적어를 가지는 타동사라도 resemble, lack, cost, escape처럼 수동태로 쓰지 않는 동사들이 있으니 따로 기억해 두셔야 합니다.","hl":"rule"},{"n":11,"text":"예문 읽어 볼게요. A problem has recently occurred that needs your attention. 최근에 주의를 기울여야 할 문제가 발생했다는 뜻입니다. occur는 발생하다라는 뜻의 자동사여서 수동태로 쓸 수 없어요. 그래서 has been occurred가 아니라 has occurred로 쓴 것입니다.","hl":"ex-0"},{"n":12,"text":"이 문장도 확인해 볼게요. She resembles her mother. 그녀는 어머니를 닮았다는 뜻이에요. resemble은 목적어를 가지는 타동사이지만 수동태로 쓰지 않는 동사입니다. 그래서 be resembled by의 형태로 바꾸지 않고 능동태 그대로 씁니다.","hl":"ex-1"},{"n":13,"text":"수동태로 잘못 쓰기 쉬운 자동사를 묶어서 기억해 두면 좋아요. happen, occur, appear, disappear, exist, result, remain, vary, last, respond, belong, consist 같은 동사들이에요. 그리고 진행형 수동태는 be being 뒤에 과거분사를 쓰고, 완료형 수동태는 have been 뒤에 과거분사를 쓴다는 것도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>A problem has been occurred recently.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ A problem has occurred recently.\u003c/div>\u003cdiv class=\"g-why\">occur는 자동사이므로 수동태로 쓸 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Spilling salt has considered unlucky for thousands of years.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Spilling salt has been considered unlucky for thousands of years.\u003c/div>\u003cdiv class=\"g-why\">주어 Spilling salt가 여겨지는 대상이므로 수동태를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She is resembled by her mother.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She resembles her mother.\u003c/div>\u003cdiv class=\"g-why\">resemble은 수동태로 쓰지 않는 타동사이다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 정말 자주 틀리는 문장이에요. A problem has been occurred recently라고 쓰면 틀립니다. occur는 목적어를 가지지 않는 자동사라서 수동태를 만들 수 없어요. 그래서 A problem has occurred recently라고 능동태로 써야 합니다.","hl":"mk-0"},{"n":15,"text":"이번 문장도 확인해 볼게요. Spilling salt has considered unlucky라고 하면 소금을 쏟는 것이 무언가를 여긴다는 이상한 뜻이 됩니다. 주어인 Spilling salt는 여겨지는 대상이니까 수동태를 써야 하죠. 그래서 has been considered를 써야 합니다.","hl":"mk-1"},{"n":16,"text":"마지막으로 이 문장을 보세요. She is resembled by her mother는 어법에 맞지 않아요. resemble은 목적어를 가지는 타동사이지만 수동태로 쓰지 않는 동사입니다. 그래서 She resembles her mother라고 능동태로 써야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Employees were ____ gifts and benefits by the company.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>offering\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>offered\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>been offered\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>being offered\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">offered\u003c/span>\u003cdiv class=\"g-exp\">주어 Employees가 선물과 혜택을 제공 받는 대상이므로 수동태가 적절하다. 4형식 능동태 문장의 직접목적어(gifts and benefits)가 동사 뒤에 남겨진 형태이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"첫 번째 문제는 빈칸에 알맞은 표현을 고르는 문제예요. Employees were 빈칸 gifts and benefits by the company. 직원들이 회사로부터 선물과 혜택을 받았다는 문장이죠. 빈칸에 들어갈 표현을 보기에서 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 두 번째 보기 offered예요. 주어인 Employees는 선물과 혜택을 제공받는 대상이니까 수동태가 필요합니다. were 뒤에 과거분사 offered가 오고, 선물과 혜택이라는 목적어는 동사 뒤에 그대로 남아 있죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Spilling salt has ____ unlucky for thousands of years.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>considered\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>been considered\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>being considered\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>been considering\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">been considered\u003c/span>\u003cdiv class=\"g-exp\">주어 Spilling salt는 불운으로 여겨지는 대상이므로 수동태가 적절하다. unlucky는 보어(능동태 문장의 목적격보어)이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제도 빈칸 채우기예요. Spilling salt has 빈칸 unlucky for thousands of years. 소금을 쏟는 것은 수천 년 동안 불운한 일로 여겨져 왔다는 문장입니다. 빈칸에 알맞은 표현을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 두 번째 보기 been considered입니다. 주어인 Spilling salt는 불운으로 여겨지는 대상이니까 수동태를 써야 하죠. 완료형 수동태라서 has been considered의 형태가 되고, 뒤에 남아 있는 unlucky는 능동태 문장의 목적격보어입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">A problem has recently ____ that needs your attention.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>occurred\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>been occurred\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>occurring\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>been occurring\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">occurred\u003c/span>\u003cdiv class=\"g-exp\">occur는 '발생하다'라는 뜻의 자동사이므로 수동태로 쓸 수 없다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"세 번째 문제예요. A problem has recently 빈칸 that needs your attention. 최근에 주의를 기울여야 할 문제가 발생했다는 문장입니다. 빈칸에 들어갈 표현을 보기에서 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 첫 번째 보기 occurred입니다. occur는 발생하다라는 뜻의 자동사여서 수동태로 쓸 수 없어요. 그래서 been occurred나 been occurring은 모두 틀린 표현이고, 능동태 occurred를 그대로 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>The accident was happened last night.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>The two brothers resemble each other.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>This book is belonged to me.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The problem was occurred suddenly.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The two brothers resemble each other.\u003c/span>\u003cdiv class=\"g-exp\">resemble은 수동태로 쓰지 않는 타동사이다. happen, belong, occur도 자동사이므로 수동태로 쓸 수 없다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"네 번째 문제는 어법상 올바른 문장을 고르는 문제예요. 네 문장을 하나씩 확인하면서 수동태로 쓸 수 없는 동사가 들어 있는지 살펴보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 두 번째 문장입니다. The two brothers resemble each other. 두 형제는 서로를 닮았다는 뜻이에요. resemble은 수동태로 쓰지 않는 타동사이고, happen이나 belong, occur도 수동태로 쓸 수 없어서 나머지 문장들은 모두 틀린 표현입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">The new policy was lacked flexibility.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The new policy lacked flexibility.\u003c/span>\u003cdiv class=\"g-exp\">lack은 수동태로 쓰지 않는 타동사이므로 be동사를 빼고 능동태로 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"다섯 번째 문제는 오류를 고치는 문제예요. The new policy was lacked flexibility. 이 문장에서 어법에 맞지 않는 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 The new policy lacked flexibility입니다. lack은 수동태로 쓰지 않는 타동사이기 때문에 was lacked라고 쓸 수 없어요. 그래서 be 동사를 빼고 과거형 lacked로 써 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어를 바르게 배열하여 수동태 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">The song / was / written / by / a famous singer\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The song was written by a famous singer.\u003c/span>\u003cdiv class=\"g-exp\">주어 The song이 쓰여지는 대상이므로 was written이라는 수동태를 쓰고, 행위자는 by + 명사로 나타낸다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"마지막 문제는 배열 문제예요. The song, was, written, by, a famous singer 이 단어들을 바르게 배열해서 수동태 문장을 완성해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 The song was written by a famous singer입니다. 그 노래는 유명한 가수에 의해 쓰였습니다라는 뜻이죠. 주어인 The song이 쓰여지는 대상이므로 was written이라는 수동태를 쓰고, 누가 썼는지 밝히는 by a famous singer를 뒤에 붙여 줍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">태 (Voice)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어가 동작의 \u003cb class=\"key\">주체\u003c/b>면 \u003cb class=\"key\">능동태\u003c/b>, 동작의 \u003cb class=\"key\">대상\u003c/b>이면 수동태를 쓴다.\u003c/li>\u003cli>수동태는 목적어가 주어로 가므로 동사 뒤에 목적어가 없다. 단, \u003cb class=\"key\">4형식\u003c/b>은 목적어가, \u003cb class=\"key\">5형식\u003c/b>은 보어가 남는다.\u003c/li>\u003cli>\u003cb class=\"key\">자동사\u003c/b>와 resemble, lack, cost, escape 같은 동사는 수동태로 쓸 수 없다.\u003c/li>\u003cli>\u003cb class=\"key\">진행형 수동태\u003c/b>는 be being + p.p., \u003cb class=\"key\">완료형 수동태\u003c/b>는 have been + p.p. 형태이다.\u003c/li>\u003c/ul>","segs":[{"n":35,"text":"오늘은 태에 대해서 배웠어요. 주어가 동작을 하는 주체면 능동태, 당하는 대상이면 수동태라는 것, 그리고 수동태 뒤에는 목적어가 남지 않지만 4형식과 5형식에서는 목적어나 보어가 남는다는 것도 확인했죠. 자동사와 resemble, lack, cost, escape 같은 동사는 수동태로 쓸 수 없다는 점도 꼭 기억해 주세요. 오늘 배운 내용을 문제에 적용하면서 복습해 보시고, 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
