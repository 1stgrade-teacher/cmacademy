  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

lecturePlayer(document.getElementById("app"),{"brand":"포인트 49 강조 구문","title":"문장을 더 확실하게 말하는 방법, 강조 구문 마스터하기","audioDir":"point49_audio","preview":false,"count":13,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">포인트 49 강조 구문\u003c/div>\u003ch1>문장을 더 확실하게 말하는 방법, 강조 구문 마스터하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>강조 구문과 동사 강조의 형태와 쓰임을 정확하게 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 문장의 특정 부분을 힘주어 말하는 강조 구문을 공부해 볼 거예요. 우리가 평소에 말할 때도 정말 그랬다고 강조하듯이 영어에서도 특별한 모양을 사용해 강조를 나타낼 수 있답니다. 오늘 저와 함께 차근차근 배워서 시험에 나오는 함정까지 완벽하게 정복해 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">It is ~ that 강조 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">강조하려는 어구를 \u003cb class=\"key\">It is\u003c/b>와 \u003cb class=\"key\">that\u003c/b> 사이에 두고, that 뒤의 절은 그 어구가 빠진 형태가 된다.\u003cdiv>\u003cspan class=\"g-formula\">It is/was + 강조어구 + that + 나머지 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It was \u003cspan class=\"fx\">yesterday\u003c/span> that I met him.\u003c/div>\u003cdiv class=\"g-ko\">내가 그를 만난 것은 바로 어제였다.\u003c/div>\u003cdiv class=\"g-note\">시간 부사구 yesterday를 강조한 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>강조 구문의 that은 명사절 \u003cb class=\"key\">접속사\u003c/b> that과 구별해야 한다.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 바로 It is that 강조 구문이에요. 강조하고 싶은 말을 It is와 that 사이에 쏙 집어넣으면 된답니다. 그리고 원래 문장에서 그 강조한 말을 빼고 남은 부분을 that 뒤에 그대로 쓰면 완성돼요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 볼게요. It was yesterday that I met him.이라는 문장이에요. 내가 그를 만난 것은 바로 어제였다라는 뜻으로, 시간인 yesterday를 강조하고 있어요.","hl":"ex-0"},{"n":4,"text":"여기서 주의할 점이 있어요. 강조 구문에 쓰이는 that을 다른 접속사와 헷갈리지 않도록 모양을 잘 살펴봐야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">동사의 강조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사는 \u003cb class=\"key\">do/does/did\u003c/b> + \u003cb class=\"key\">동사원형\u003c/b>으로 강조한다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + do/does/did + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">do love\u003c/span> this song.\u003c/div>\u003cdiv class=\"g-ko\">나는 이 노래를 정말 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">일반동사 love를 do로 강조한 문장\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주어의 인칭과 시제에 따라 \u003cb class=\"key\">do의 형태\u003c/b>가 변하는 것에 주의한다.\u003c/div>","segs":[{"n":5,"text":"두 번째는 일반동사를 강조하는 방법이에요. 일반동사를 강조하고 싶을 때는 동사 앞에 do나 does나 did를 쓰면 된대요. 물론 뒤에는 반드시 원래 모양인 동사 원형을 써야 한다는 것 잊지 마세요.","hl":"rule"},{"n":6,"text":"두 번째 예문을 함께 볼까요. I do love this song.이라는 문장이에요. 나는 이 노래를 정말 좋아한다라는 뜻으로, love 앞에 do를 써서 정말 좋아한다는 마음을 힘주어 말하고 있어요.","hl":"ex-0"},{"n":7,"text":"동사를 강조할 때 주어가 3인칭 단수이거나 과거 시제일 때 do의 모양이 does나 did로 바뀐다는 것을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It is yesterday when I met him.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It was yesterday that I met him.\u003c/div>\u003cdiv class=\"g-why\">강조 구문에서는 관계부사 when이 아니라 접속사 that을 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I did loved this song.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I did love this song.\u003c/div>\u003cdiv class=\"g-why\">do/does/did 뒤에는 반드시 동사원형을 써야 한다.\u003c/div>\u003c/div>","segs":[{"n":8,"text":"학생들이 자주 틀리는 첫 번째 실수를 살펴볼게요. yesterday가 시간이라고 해서 that 자리에 when을 쓰면 안 돼요. 강조 구문에서는 언제나 that을 쓴다는 것을 잊지 마세요.","hl":"mk-0"},{"n":9,"text":"두 번째 함정도 확인해 볼게요. 과거를 나타낸다고 did 뒤에 loved처럼 과거형을 또 쓰면 틀려요. 조동사 뒤에는 반드시 동사 원형이 온다는 규칙을 꼭 기억해 주세요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 1\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 밑줄 친 부분을 바르게 강조한 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I met [[him]] yesterday. (him 강조)\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>It was him that I met yesterday.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>It is he when I met yesterday.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>It was yesterday that I met him.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I did met him yesterday.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">It was him that I met yesterday.\u003c/span>\u003cdiv class=\"g-exp\">목적어 him을 강조하는 구문은 It was ~ that 형태이며, 시제가 과거이므로 was를 쓰고 뒤에 that을 연결해야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"이번에는 배운 내용을 확인하는 문제를 풀어 볼 시간이에요. 화면에 나오는 문장에서 him을 강조하는 올바른 문장을 찾아보세요. 잠시 멈추고 직접 정답을 골라 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":6},{"n":12,"text":"정답은 첫 번째 보기인 It was him that I met yesterday예요. 목적어인 him을 It was와 that 사이에 넣고 나머지를 뒤에 쓰면 되니까 첫 번째 보기가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">포인트 49 강조 구문\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>강조하려는 어구는 \u003cb class=\"key\">It is와 that\u003c/b> 사이에 둔다.\u003c/li>\u003cli>동사는 \u003cb class=\"key\">do/does/did\u003c/b>와 \u003cb class=\"key\">동사원형\u003c/b>으로 강조한다.\u003c/li>\u003c/ul>","segs":[{"n":13,"text":"오늘 우리는 It is that 강조 구문과 do를 이용한 동사 강조를 멋지게 배웠어요. 강조하고 싶은 말을 어디에 넣어야 하는지 잘 기억해 두기로 해요. 오늘 수고 많았고 우리는 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
