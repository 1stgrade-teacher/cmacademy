}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 4 Basic Practice (포인트 21-22)","audioDir":"practice21-22_audio","preview":false,"count":77,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조동사 관용 표현과 가정법(가정법 과거·혼합 가정법·도치)\u003c/div>\u003ch1>조동사 표현과 가정법 총정리 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter Four의 기본 문제로 조동사 관용 표현과 가정법을 함께 정리해 볼 거예요. 양자택일 문제부터 틀린 부분을 고치는 문제, 지문 어법 문제까지 차근차근 풀어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">had better + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">had better\u003c/b>는 '~하는 게 좋겠다'라는 뜻으로, 뒤에는 항상 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + had better + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>'d better는 would better가 아니라 had better의 줄임\u003c/li>\u003cli>부정은 had better not + 동사원형\u003c/li>\u003cli>과거형 had라고 해서 뒤에 과거동사를 쓰지 않는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You had better take an umbrella.\u003c/div>\u003cdiv class=\"g-ko\">우산을 챙기는 게 좋겠어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We'd better not be late.\u003c/div>\u003cdiv class=\"g-ko\">늦지 않는 게 좋겠어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 had better부터 볼게요. 여러분이 '디 베러'로 자주 듣는 표현인데, 여기서 had는 과거가 아니라 그냥 굳어진 형태예요. 그래서 뒤에는 반드시 동사원형이 옵니다. 시제를 맞춰서 과거동사를 쓰면 안 된다는 점, 꼭 기억해 두세요. 부정은 had better not 뒤에 동사원형을 붙입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I'd better \u003cspan class=\"p-box\">\u003cspan>hurry\u003c/span>\u003ci>/\u003c/i>\u003cspan>hurried\u003c/span>\u003c/span> off so I won't miss my train.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">hurry\u003c/div>\u003cdiv class=\"p-op\">hurried\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hurry\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 had better가 들어간 문장이에요. 괄호 안에 동사원형과 과거형이 나란히 있으니, had better 뒤에 무엇이 와야 하는지 떠올려 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 hurry예요. had better는 굳어진 표현이라 뒤에 반드시 동사원형이 오고, hurried처럼 과거형을 쓰면 안 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I'd better \u003cspan class=\"p-box\">\u003cspan class=\"ok\">hurry\u003c/span>\u003ci>/\u003c/i>\u003cspan>hurried\u003c/span>\u003c/span> off so I won't miss my train.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">hurry\u003c/div>\u003cdiv class=\"p-op\">hurried\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">표현 확인\u003c/b>'d better는 \u003cb class=\"key\">had better\u003c/b>의 줄임말이므로 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 와야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 비교\u003c/b>hurried는 과거형이므로 탈락하고, \u003cb class=\"key\">hurry\u003c/b>가 정답이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 hurry\u003c/span>\u003cdiv class=\"p-full\">I'd better hurry off so I won't miss my train.\u003c/div>\u003cdiv class=\"p-ko\">기차를 놓치지 않도록 서둘러 가는 게 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>had가 과거형이라고 뒤에 과거동사를 쓰는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 '아이드 베러'에서 '디'가 had better의 줄임말이라는 걸 알아차려야 해요. 그래서 뒤에는 동사원형이 와야 합니다.","hl":"st-0"},{"n":7,"text":"hurried는 과거형이라서 여기에는 맞지 않고, 동사원형인 hurry가 정답이에요.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. had가 과거형이라고 뒤에 과거동사를 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">may as well / may well + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">may[might] as well + 동사원형\u003c/b>은 '~하는 편이 낫겠다', \u003cb class=\"key\">may well + 동사원형\u003c/b>은 '~하는 것이 당연하다, 충분히 ~할 수 있다'라는 뜻이다.\u003cdiv>\u003cspan class=\"g-formula\">may[might] as well + 동사원형 / may well + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>as well이 있으면 '이왕이면 ~하는 게 낫다'는 선택의 의미\u003c/li>\u003cli>as well이 없으면 '~하는 것이 당연하다'는 추측의 의미\u003c/li>\u003cli>뒤에는 언제나 동사원형이 온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We might as well start now.\u003c/div>\u003cdiv class=\"g-ko\">지금 시작하는 편이 낫겠어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">That may well be true.\u003c/div>\u003cdiv class=\"g-ko\">그건 충분히 사실일 수 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"may as well과 may well은 생김새가 비슷해서 시험에 자주 나와요. as well이 붙어 있으면 '이왕이면 하는 게 낫겠다'는 선택의 느낌이고, as well이 없으면 '~하는 것이 당연하다, 충분히 그럴 수 있다'는 추측의 느낌이에요. 두 표현 모두 뒤에는 동사원형이 옵니다. 해석으로 구별하는 습관을 들이면 훨씬 쉬워져요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">You'll find out in the end, so I \u003cspan class=\"p-box\">\u003cspan>must\u003c/span>\u003ci>/\u003c/i>\u003cspan>might\u003c/span>\u003c/span> as well tell you now.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">must\u003c/div>\u003cdiv class=\"p-op\">might\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">might\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 as well이 붙은 표현을 고르는 문제예요. must와 might 중에서 어떤 조동사가 as well과 자연스럽게 어울리는지 생각해 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 might예요. might as well은 '이왕이면 하는 게 낫다'는 뜻으로 쓰이고, must는 as well과 결합해 이런 의미를 만들지 못합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">You'll find out in the end, so I \u003cspan class=\"p-box\">\u003cspan>must\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">might\u003c/span>\u003c/span> as well tell you now.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">must\u003c/div>\u003cdiv class=\"p-op\">might\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">구문 확인\u003c/b>뒤에 \u003cb class=\"key\">as well\u003c/b>이 있으므로 \u003cb class=\"key\">may[might] as well + 동사원형\u003c/b> 구문이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 비교\u003c/b>must는 as well과 결합해 '~하는 편이 낫다'는 뜻을 만들지 못하므로 \u003cb class=\"key\">might\u003c/b>가 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 might\u003c/span>\u003cdiv class=\"p-full\">You'll find out in the end, so I might as well tell you now.\u003c/div>\u003cdiv class=\"p-ko\">결국엔 알게 될 테니, 지금 말해 주는 편이 낫겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must as well이라는 형태는 쓰지 않는다는 점을 놓치는 것\u003c/div>","segs":[{"n":13,"text":"빈칸 뒤에 as well이 붙어 있죠. 그러면 '~하는 편이 낫다'는 뜻의 구문이라는 걸 바로 알아채야 해요.","hl":"st-0"},{"n":14,"text":"그 구문에 들어갈 수 있는 조동사는 might이고, must는 as well과 붙어서 이런 의미를 만들어 주지 못해요.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. must as well이라는 형태는 쓰지 않는다는 점을 놓치는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 과거\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">현재 사실의 반대\u003c/b>를 가정할 때는 if절에 \u003cb class=\"key\">과거동사(were)\u003c/b>를, 주절에 \u003cb class=\"key\">would + 동사원형\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + were[과거동사] ~, 주어 + would[could] + 동사원형 ~.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사는 인칭에 상관없이 were를 쓴다\u003c/li>\u003cli>주절에는 would, could, might + 동사원형\u003c/li>\u003cli>실제로는 그렇지 않다는 뜻이 담긴다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If I were you, I would apologize.\u003c/div>\u003cdiv class=\"g-ko\">내가 너라면 사과할 거야.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"가정법 과거는 현재 사실을 반대로 상상할 때 써요. if절에는 과거동사를 쓰는데, be동사는 인칭과 상관없이 were를 씁니다. 주절에는 would나 could 뒤에 동사원형을 붙여요. '내가 너라면' 할 때 If I were you라고 하는 게 바로 이 문법이에요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If we \u003cspan class=\"p-box\">\u003cspan>are\u003c/span>\u003ci>/\u003c/i>\u003cspan>were\u003c/span>\u003c/span> a pair of lions, we would be lying on the Serengeti.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">are\u003c/div>\u003cdiv class=\"p-op\">were\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"세 번째 문제는 사자가 된다고 상상하는 문장이에요. 뒤에 would be lying이 있으니 가정법이라는 걸 먼저 알아차려야 합니다.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 were예요. 현재 사실의 반대를 가정하고 있으니 if절의 be동사는 인칭과 상관없이 were를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">If we \u003cspan class=\"p-box\">\u003cspan>are\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">were\u003c/span>\u003c/span> a pair of lions, we would be lying on the Serengeti.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">are\u003c/div>\u003cdiv class=\"p-op\">were\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주절 확인\u003c/b>주절이 \u003cb class=\"key\">would be lying\u003c/b>이므로 \u003cb class=\"key\">현재 사실의 반대\u003c/b>를 가정하는 \u003cb class=\"key\">가정법 과거\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">if절 채우기\u003c/b>가정법 과거의 if절 be동사는 인칭과 상관없이 \u003cb class=\"key\">were\u003c/b>를 쓰므로 are는 탈락이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 were\u003c/span>\u003cdiv class=\"p-full\">If we were a pair of lions, we would be lying on the Serengeti.\u003c/div>\u003cdiv class=\"p-ko\">우리가 한 쌍의 사자라면 세렝게티에 누워 있을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어가 we라서 are를 고르는 실수\u003c/div>","segs":[{"n":20,"text":"먼저 주절을 보면 would be lying이 나와요. 이 형태가 보이면 현재 사실의 반대를 상상하는 가정법이라는 신호예요.","hl":"st-0"},{"n":21,"text":"가정법 과거에서는 be동사를 인칭에 상관없이 were로 씁니다. 그래서 are가 아니라 were가 정답이에요.","hl":"st-1"},{"n":22,"text":"이 문제의 함정도 짚고 갈게요. 주어가 we라서 are를 고르는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">A budget based on living for 30 years after retirement \u003cspan class=\"p-box\">\u003cspan>shouldn't\u003c/span>\u003ci>/\u003c/i>\u003cspan>may well\u003c/span>\u003c/span> fail if you live longer.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">shouldn't\u003c/div>\u003cdiv class=\"p-op\">may well\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">may well\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"네 번째 문제는 예산이 실패할 수 있다는 내용이에요. 형태는 둘 다 조동사라서 가능하니, 앞뒤 문맥의 의미로 골라야 합니다.","hl":"q"},{"n":24,"text":"","hl":"q","pause":7},{"n":25,"text":"정답은 may well이에요. 더 오래 살면 예산이 무너지는 것은 충분히 있을 수 있는 일이니까, '~하는 것이 당연하다'는 may well이 어울립니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">A budget based on living for 30 years after retirement \u003cspan class=\"p-box\">\u003cspan>shouldn't\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">may well\u003c/span>\u003c/span> fail if you live longer.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">shouldn't\u003c/div>\u003cdiv class=\"p-op\">may well\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문장 구조\u003c/b>주어는 \u003cb class=\"key\">A budget\u003c/b>, 동사는 \u003cb class=\"key\">fail\u003c/b>이고 빈칸은 조동사 자리이므로 두 선택지 모두 형태상으로는 가능하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>'더 오래 살면 예산이 무너질 수 있다'는 내용이므로 \u003cb class=\"key\">may well\u003c/b>(~하는 것이 당연하다)이 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 may well\u003c/span>\u003cdiv class=\"p-full\">A budget based on living for 30 years after retirement may well fail if you live longer.\u003c/div>\u003cdiv class=\"p-ko\">은퇴 후 삼십 년을 사는 것을 기준으로 짠 예산은 더 오래 산다면 충분히 실패할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>형태만 보고 should를 넣어 '실패하면 안 된다'는 반대 의미로 만드는 실수\u003c/div>","segs":[{"n":26,"text":"주어가 예산이고 동사가 fail인데, 그 사이에 조동사 자리가 비어 있어요. 형태만 보면 두 선택지 다 들어갈 수 있으니 의미로 판단해야 합니다.","hl":"st-0"},{"n":27,"text":"뒤에 더 오래 살면이라는 조건이 붙어 있죠. 그럴 경우 예산이 무너지는 건 충분히 있을 수 있는 일이니 may well이 어울려요. shouldn't를 쓰면 의미가 반대가 됩니다.","hl":"st-1"},{"n":28,"text":"이 문제의 함정도 짚고 갈게요. 형태만 보고 should를 넣어 '실패하면 안 된다'는 반대 의미로 만드는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">혼합 가정법\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if절은 \u003cb class=\"key\">과거완료(had p.p.)\u003c/b>로 과거의 원인을, 주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>으로 현재의 결과를 말하면 \u003cb class=\"key\">혼합 가정법\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">If + 주어 + had p.p. ~, 주어 + would + 동사원형 (now).\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거의 원인이 현재의 결과로 이어진다\u003c/li>\u003cli>주절에 now, today 같은 현재 표현이 있으면 혼합 가정법을 의심\u003c/li>\u003cli>주절은 현재 결과이므로 would + 동사원형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If I had studied harder, I would be a doctor now.\u003c/div>\u003cdiv class=\"g-ko\">공부를 더 열심히 했더라면 지금 의사일 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"혼합 가정법은 과거의 일이 현재의 결과로 이어질 때 씁니다. if절은 과거완료로 과거의 원인을 말하고, 주절은 would에 동사원형을 붙여 현재의 결과를 말해요. 문장 끝에 now나 today 같은 현재 표현이 보이면 혼합 가정법인지 꼭 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">If he \u003cu class=\"p-u\">had graduated\u003c/u> with a degree in business, he would have a better job now.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"첫 번째 문제는 if절은 과거완료인데 주절은 현재 결과를 말하고 있어요. 이런 구조를 무엇이라고 하는지 떠올려 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":7},{"n":32,"text":"정답은 맞다는 표시예요. 과거의 일이 현재 결과로 이어지는 혼합 가정법이라 would have가 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-1\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">If he \u003cu class=\"p-u\">had graduated\u003c/u> with a degree in business, he would have a better job now.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">if절 확인\u003c/b>if절이 \u003cb class=\"key\">had graduated\u003c/b>로 과거완료이므로 \u003cb class=\"key\">과거 사실의 반대\u003c/b>를 가정한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주절 확인\u003c/b>주절은 \u003cb class=\"key\">would have\u003c/b>로 현재 결과를 말하고, 문장 끝에 \u003cb class=\"key\">now\u003c/b>가 있으므로 \u003cb class=\"key\">혼합 가정법\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>과거의 원인이 현재의 결과로 이어지는 구조가 완벽히 맞으므로 \u003cb class=\"key\">○\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">If he had graduated with a degree in business, he would have a better job now.\u003c/div>\u003cdiv class=\"p-ko\">그가 경영학 학위로 졸업했더라면 지금 더 좋은 직업을 가졌을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>had graduated와 would have가 시제가 안 맞는다고 착각해 고치는 실수\u003c/div>","segs":[{"n":33,"text":"if절에 had graduated가 왔으니 과거의 일을 가정하고 있다는 걸 알 수 있어요.","hl":"st-0"},{"n":34,"text":"그런데 주절은 would have로 현재 상태를 말하고 있고, 끝에 now까지 붙어 있어요. 이게 바로 혼합 가정법이에요.","hl":"st-1"},{"n":35,"text":"구조가 정확히 맞으니 고칠 필요 없이 맞다는 표시를 하면 됩니다.","hl":"st-2"},{"n":36,"text":"이 문제의 함정도 짚고 갈게요. had graduated와 would have가 시제가 안 맞는다고 착각해 고치는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 도치(Were/Had + 주어)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">가정법에서 if를 생략하면 \u003cb class=\"key\">주어와 동사의 순서\u003c/b>가 바뀌어 Were[Had, Should] + 주어 형태가 된다.\u003cdiv>\u003cspan class=\"g-formula\">Were + 주어 ~ = If + 주어 + were ~ / Had + 주어 + p.p. ~ = If + 주어 + had p.p. ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Were you ~는 If you were ~와 같은 뜻\u003c/li>\u003cli>도치된 절도 if절 역할이므로 주절에는 would가 온다\u003c/li>\u003cli>도치했다고 시제가 달라지지는 않는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Were I rich, I would travel the world.\u003c/div>\u003cdiv class=\"g-ko\">내가 부자라면 세계를 여행할 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"가정법에서 if를 생략하면 주어와 동사의 순서가 바뀌어요. Were you처럼 be동사가 주어 앞으로 나오거나, Had he처럼 had가 앞으로 나오는 형태죠. 이때도 if절 역할은 그대로라서 주절에는 would를 써야 합니다. 도치됐다고 해서 시제가 달라지지는 않아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Were you a songwriter, what \u003cu class=\"p-u\">will\u003c/u> be your songs about?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"두 번째 문제는 if가 생략된 도치 문장이에요. 주절에 어떤 조동사가 와야 하는지 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":7},{"n":40,"text":"정답은 would예요. Were you는 If you were의 도치이고, 가정법이므로 주절에는 would be가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Were you a songwriter, what \u003cu class=\"p-u\">will\u003c/u> be your songs about?\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">도치 확인\u003c/b>\u003cb class=\"key\">Were you\u003c/b>는 If you were의 도치로, \u003cb class=\"key\">가정법 과거\u003c/b>의 if절 역할을 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주절 확인\u003c/b>if절이 가정법이므로 주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>이어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">고치기\u003c/b>will을 \u003cb class=\"key\">would\u003c/b>로 고쳐 'what would be your songs about'로 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 would\u003c/span>\u003cdiv class=\"p-full\">Were you a songwriter, what would be your songs about?\u003c/div>\u003cdiv class=\"p-ko\">네가 작곡가라면, 네 노래는 무엇에 관한 것이겠니?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>도치된 문장을 일반 의문문으로 보고 will을 그대로 두는 실수\u003c/div>","segs":[{"n":41,"text":"문장이 Were you로 시작하죠. 이건 if를 생략하면서 주어와 be동사의 순서가 바뀐 도치 문장이에요.","hl":"st-0"},{"n":42,"text":"if절이 가정법 역할을 하니까 주절에는 would가 와야 해요. will은 현재 사실을 말할 때 쓰는 표현이라 어울리지 않습니다.","hl":"st-1"},{"n":43,"text":"그래서 will을 would로 고쳐 주면 됩니다.","hl":"st-2"},{"n":44,"text":"이 문제의 함정도 짚고 갈게요. 도치된 문장을 일반 의문문으로 보고 will을 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">could not but + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">could not but + 동사원형\u003c/b>은 '~하지 않을 수 없었다'라는 뜻으로, \u003cb class=\"key\">cannot help ~ing\u003c/b>와 같은 의미다.\u003cdiv>\u003cspan class=\"g-formula\">could not but + 동사원형 = could not help + 동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>but 뒤에는 to 없는 동사원형이 온다\u003c/li>\u003cli>help 뒤에는 동명사가 온다\u003c/li>\u003cli>과거 시제는 could not but\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I could not but laugh.\u003c/div>\u003cdiv class=\"g-ko\">웃지 않을 수 없었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"could not but 다음에는 to 없는 동사원형이 옵니다. '~하지 않을 수 없었다'는 뜻이고, cannot help 뒤에 동명사를 쓰는 표현과 같은 의미예요. but이 보이면 뒤에 동사원형인지부터 확인하세요. help가 보이면 뒤에는 동명사라는 것도 함께 기억해 두면 좋아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">When she suddenly refused to talk to him, he could not but \u003cu class=\"p-u\">wondering\u003c/u> about the reasons.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">wonder\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":46,"text":"세 번째 문제는 could not but 뒤의 형태를 묻고 있어요. but 뒤에 무엇이 오는지 기억나나요?","hl":"q"},{"n":47,"text":"","hl":"q","pause":7},{"n":48,"text":"정답은 wonder예요. could not but 뒤에는 to 없는 동사원형이 오기 때문에 wondering을 wonder로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">When she suddenly refused to talk to him, he could not but \u003cu class=\"p-u\">wondering\u003c/u> about the reasons.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">구문 확인\u003c/b>\u003cb class=\"key\">could not but\u003c/b>는 '~하지 않을 수 없었다'는 뜻으로, but 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">고치기\u003c/b>wondering은 동명사이므로 \u003cb class=\"key\">wonder\u003c/b>로 고쳐야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">의미 확인\u003c/b>'그는 이유에 대해 궁금해하지 않을 수 없었다'로 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 wonder\u003c/span>\u003cdiv class=\"p-full\">When she suddenly refused to talk to him, he could not but wonder about the reasons.\u003c/div>\u003cdiv class=\"p-ko\">그녀가 갑자기 그에게 말하기를 거부했을 때, 그는 그 이유가 궁금하지 않을 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>cannot help ~ing에 끌려 but 뒤에도 동명사를 쓰는 실수\u003c/div>","segs":[{"n":49,"text":"could not but이 보이면 뒤에 어떤 형태가 오는지부터 확인해야 해요. 여기서는 to 없는 동사원형이 와야 합니다.","hl":"st-0"},{"n":50,"text":"wondering은 동명사 형태라서 여기에 맞지 않아요. 동사원형인 wonder로 고쳐 주면 됩니다.","hl":"st-1"},{"n":51,"text":"고치고 나면 '이유가 궁금하지 않을 수 없었다'는 뜻이 되어 문맥도 자연스러워요.","hl":"st-2"},{"n":52,"text":"이 문제의 함정도 짚고 갈게요. cannot help ~ing에 끌려 but 뒤에도 동명사를 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">Without[But for] = If it were not for / If it had not been for\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Without[But for] + 명사\u003c/b>는 if절을 대신해 '~이 없다면'이라는 가정을 나타내며, \u003cb class=\"key\">If it were not for\u003c/b>는 현재, \u003cb class=\"key\">If it had not been for\u003c/b>는 과거 사실의 반대를 담당한다.\u003cdiv>\u003cspan class=\"g-formula\">Without + 명사, 주어 + would (have) + 동사원형(p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거 사실의 반대면 주절에 would have p.p.\u003c/li>\u003cli>yesterday처럼 과거를 가리키는 말이 있으면 과거 사실의 반대로 판단\u003c/li>\u003cli>without은 전치사이므로 뒤에 명사(구)가 온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Without your help, I would have failed.\u003c/div>\u003cdiv class=\"g-ko\">네 도움이 없었다면 실패했을 거야.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">If it were not for water, nothing could live.\u003c/div>\u003cdiv class=\"g-ko\">물이 없다면 아무것도 살 수 없을 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":53,"text":"Without이나 But for는 if절을 대신해서 '~이 없다면'이라는 가정을 만들어요. 뒤에는 명사가 오고, 주절은 현재 사실의 반대면 would에 동사원형, 과거 사실의 반대면 would have에 과거분사를 씁니다. If it were not for는 현재, If it had not been for는 과거를 담당한다고 짝지어 기억하면 쉬워요. yesterday 같은 과거 표현이 있으면 과거 쪽을 골라야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Without his help yesterday, I would \u003cu class=\"p-u\">have never been\u003c/u> able to get my car to run.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":54,"text":"네 번째 문제는 Without으로 시작하는 가정법 문장이에요. yesterday가 있다는 점을 눈여겨보세요.","hl":"q"},{"n":55,"text":"","hl":"q","pause":7},{"n":56,"text":"정답은 맞다는 표시예요. 과거 사실의 반대이므로 would have 과거분사 형태가 맞고, never의 위치도 문제가 없습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Without his help yesterday, I would \u003cu class=\"p-u\">have never been\u003c/u> able to get my car to run.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">구문 확인\u003c/b>\u003cb class=\"key\">Without + 명사\u003c/b>는 if절을 대신하는 가정 표현이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">시제 확인\u003c/b>\u003cb class=\"key\">yesterday\u003c/b>가 있으므로 \u003cb class=\"key\">과거 사실의 반대\u003c/b>이고, 주절은 \u003cb class=\"key\">would have p.p.\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">판정\u003c/b>have never been은 would have p.p. 형태로 어법에 맞으므로 \u003cb class=\"key\">○\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">Without his help yesterday, I would have never been able to get my car to run.\u003c/div>\u003cdiv class=\"p-ko\">어제 그의 도움이 없었다면 나는 차를 시동 걸리게 할 수 없었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>never의 위치 때문에 틀렸다고 판단해 고치는 실수\u003c/div>","segs":[{"n":57,"text":"Without his help는 '그의 도움이 없었다면'이라는 if절을 대신하는 표현이에요.","hl":"st-0"},{"n":58,"text":"yesterday가 있으니 과거 사실의 반대를 말하고 있죠. 그래서 주절에는 would have 과거분사가 와야 합니다.","hl":"st-1"},{"n":59,"text":"have never been은 would have 뒤에 과거분사가 온 형태라서 문제가 없어요. 그래서 맞다는 표시를 하면 됩니다.","hl":"st-2"},{"n":60,"text":"이 문제의 함정도 짚고 갈게요. never의 위치 때문에 틀렸다고 판단해 고치는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">(1) \u003cu class=\"p-u\">If it had not been for\u003c/u> money, people could only barter. Many of us barter to a small extent, when we return favors. However, what would (2) \u003cu class=\"p-u\">have happened\u003c/u> if you wanted a loaf of bread and all you had to trade was your new car? We need to use money to solve all these problems.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) If it were not for (또는 Without / But for) (2) happen\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":61,"text":"이번에는 지문에서 두 군데를 고치는 문제예요. 첫 번째는 if it had not been for, 두 번째는 would have happened인데, 각각 주절과 if절의 시제를 살펴보세요.","hl":"q"},{"n":62,"text":"","hl":"q","pause":7},{"n":63,"text":"첫 번째는 If it were not for 또는 Without, But for로 고쳐야 해요. 주절이 could barter로 현재 사실의 반대이기 때문이에요. 두 번째는 happen으로 고쳐요. if절이 wanted로 과거이니 주절은 would에 동사원형을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">(1) \u003cu class=\"p-u\">If it had not been for\u003c/u> money, people could only barter. Many of us barter to a small extent, when we return favors. However, what would (2) \u003cu class=\"p-u\">have happened\u003c/u> if you wanted a loaf of bread and all you had to trade was your new car? We need to use money to solve all these problems.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주절 시제 확인\u003c/b>주절이 \u003cb class=\"key\">could only barter\u003c/b>이므로 \u003cb class=\"key\">현재 사실의 반대\u003c/b>를 가정하는 \u003cb class=\"key\">가정법 과거\u003c/b>이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(1) 고치기\u003c/b>따라서 if절은 \u003cb class=\"key\">If it were not for\u003c/b>가 되어야 하고, \u003cb class=\"key\">Without\u003c/b>이나 \u003cb class=\"key\">But for\u003c/b>로 바꿔 쓸 수도 있다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">if절 시제 확인\u003c/b>(2)의 if절이 \u003cb class=\"key\">wanted\u003c/b>로 과거이므로 이 역시 \u003cb class=\"key\">가정법 과거\u003c/b> 문장이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">(2) 고치기\u003c/b>주절은 \u003cb class=\"key\">would + 동사원형\u003c/b>이므로 \u003cb class=\"key\">have happened\u003c/b>를 \u003cb class=\"key\">happen\u003c/b>으로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) If it were not for (또는 Without / But for) (2) happen\u003c/span>\u003cdiv class=\"p-full\">If it were not for money, people could only barter. However, what would happen if you wanted a loaf of bread and all you had to trade was your new car?\u003c/div>\u003cdiv class=\"p-ko\">돈이 없다면 사람들은 물물교환만 할 수 있을 것이다. 하지만 빵 한 덩이를 원하는데 가진 게 새 차뿐이라면 무슨 일이 일어날까?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞 문장의 had not been for에 끌려 뒤 문장까지 과거완료로 맞추는 실수\u003c/div>","segs":[{"n":64,"text":"먼저 첫 문장의 주절을 보면 could only barter라고 되어 있어요. 이건 현재 사실의 반대를 상상하는 가정법 과거예요.","hl":"st-0"},{"n":65,"text":"그러면 if절도 현재 쪽에 맞춰야 하니 If it had not been for를 If it were not for로 고쳐야 해요. Without이나 But for로 바꿔도 같은 뜻이 됩니다.","hl":"st-1"},{"n":66,"text":"두 번째는 if절에 wanted가 와 있어요. 이것도 과거형을 쓴 가정법 과거라는 뜻이죠.","hl":"st-2"},{"n":67,"text":"가정법 과거의 주절은 would 뒤에 동사원형이 와야 하니, have happened를 happen으로 고쳐 주면 됩니다.","hl":"st-3"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. 앞 문장의 had not been for에 끌려 뒤 문장까지 과거완료로 맞추는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">have no choice but to + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">have no choice but to + 동사원형\u003c/b>은 '~할 수밖에 없다'라는 뜻이다.\u003cdiv>\u003cspan class=\"g-formula\">have no choice but to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>but 뒤에 to부정사가 온다\u003c/li>\u003cli>could not but + 동사원형과 헷갈리지 않기\u003c/li>\u003cli>do nothing but + 동사원형도 함께 기억\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I had no choice but to wait.\u003c/div>\u003cdiv class=\"g-ko\">기다릴 수밖에 없었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"have no choice but to는 '~할 수밖에 없다'는 뜻이에요. 여기서 but 뒤에는 반드시 to부정사가 옵니다. 앞에서 본 could not but 뒤에 동사원형이 오는 것과 헷갈리기 쉬우니, but 앞에 choice가 있는지 없는지로 구별해 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">You've accepted the job, and as long as you're going to be doing it, you might as well (1) \u003cu class=\"p-u\">to do\u003c/u> it capably. If there is something you don't know how to do at this job, you have no choice but (2) \u003cu class=\"p-u\">learning\u003c/u> how to do it and do it to the best of your ability. Without doing so, you will never reach above an average level.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) do (2) to learn\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":70,"text":"이번 지문에는 might as well 뒤와 have no choice but 뒤가 밑줄로 표시되어 있어요. 각 표현 뒤에 어떤 형태가 와야 하는지 따져 보세요.","hl":"q"},{"n":71,"text":"","hl":"q","pause":7},{"n":72,"text":"첫 번째는 might as well 뒤에 동사원형이 오니 do로, 두 번째는 have no choice but to 뒤에 동사원형이 오니 to learn으로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">You've accepted the job, and as long as you're going to be doing it, you might as well (1) \u003cu class=\"p-u\">to do\u003c/u> it capably. If there is something you don't know how to do at this job, you have no choice but (2) \u003cu class=\"p-u\">learning\u003c/u> how to do it and do it to the best of your ability. Without doing so, you will never reach above an average level.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 구문 확인\u003c/b>\u003cb class=\"key\">might as well + 동사원형\u003c/b> 구문이므로 \u003cb class=\"key\">to do\u003c/b>를 \u003cb class=\"key\">do\u003c/b>로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 구문 확인\u003c/b>\u003cb class=\"key\">have no choice but to + 동사원형\u003c/b> 구문이므로 \u003cb class=\"key\">learning\u003c/b>을 \u003cb class=\"key\">to learn\u003c/b>으로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>'you might as well do it capably'와 'you have no choice but to learn'이 되어야 어법에 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) do (2) to learn\u003c/span>\u003cdiv class=\"p-full\">You might as well do it capably. If there is something you don't know how to do at this job, you have no choice but to learn how to do it.\u003c/div>\u003cdiv class=\"p-ko\">이왕 할 거라면 유능하게 하는 편이 낫다. 이 일에서 할 줄 모르는 게 있다면 배워서 익힐 수밖에 없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>but이 나오면 무조건 동사원형이라고 외워서 (2)를 learn으로 쓰는 실수\u003c/div>","segs":[{"n":73,"text":"먼저 might as well 뒤를 보면 to do가 와 있어요. 이 표현 뒤에는 to 없는 동사원형이 오니 do로 고쳐야 합니다.","hl":"st-0"},{"n":74,"text":"두 번째는 have no choice but 뒤에 learning이 왔죠. 이 표현은 but 뒤에 to부정사가 와서 to learn이 되어야 해요.","hl":"st-1"},{"n":75,"text":"고치고 나면 '차라리 능숙하게 하라'와 '배울 수밖에 없다'는 뜻이 정확히 살아납니다.","hl":"st-2"},{"n":76,"text":"이 문제의 함정도 짚고 갈게요. but이 나오면 무조건 동사원형이라고 외워서 (2)를 learn으로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 관용 표현과 가정법(가정법 과거·혼합 가정법·도치)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">had better\u003c/b>, \u003cb class=\"key\">may as well\u003c/b>, \u003cb class=\"key\">have no choice but to\u003c/b> 뒤에는 모두 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/li>\u003cli>현재 사실의 반대는 \u003cb class=\"key\">가정법 과거\u003c/b>(were, would + 동사원형), 과거의 원인이 현재 결과로 이어지면 \u003cb class=\"key\">혼합 가정법\u003c/b>(had p.p., would + 동사원형)이다.\u003c/li>\u003cli>\u003cb class=\"key\">Without\u003c/b>과 \u003cb class=\"key\">But for\u003c/b>는 if절을 대신하며, 과거 사실의 반대면 주절에 \u003cb class=\"key\">would have p.p.\u003c/b>를 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">could not but + 동사원형\u003c/b>은 \u003cb class=\"key\">cannot help ~ing\u003c/b>와 같은 뜻이다.\u003c/li>\u003c/ul>","segs":[{"n":77,"text":"오늘 문제들을 통해 조동사 뒤에는 동사원형이 온다는 기본기부터, 가정법 과거와 혼합 가정법, 도치까지 한 번에 정리했어요. 특히 without이나 but for가 나오면 뒤 문장의 시제를 보고 현재인지 과거인지 판단하는 습관을 꼭 들이세요. 복습할 때는 각 문장을 소리 내어 읽으면서 어느 형태가 와야 하는지 스스로 설명해 보면 좋습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
