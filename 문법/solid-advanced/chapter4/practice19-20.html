    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 4 Basic Practice (포인트 19-20)","audioDir":"practice19-20_audio","preview":false,"count":70,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">조동사 뒤의 형태(동사원형·have p.p.) / used to와 be used to / 수동태\u003c/div>\u003ch1>Chapter 4 Basic Practice (포인트 19-20) 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 챕터 포에 있는 포인트 십구와 이십 문제를 함께 풀어 볼 거예요. 조동사 뒤에 어떤 형태가 오는지, used to와 be used to를 어떻게 구별하는지, 그리고 수동태 형태가 핵심이니까 순서대로 차근차근 짚어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">조동사(might, can, must, should 등) 뒤에는 항상 \u003cb class=\"key\">동사원형\u003c/b>이 온다. 부정어 nor가 문두에 오면 「조동사 + 주어 + 동사원형」 어순이 된다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + 동사원형 (예: might not be / nor can I get)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사도 조동사 뒤에서는 원형 be로 쓴다\u003c/li>\u003cli>조동사 뒤에 to부정사는 오지 않는다\u003c/li>\u003cli>nor가 문두에 오면 조동사가 주어 앞으로 나온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I might not be able to come.\u003c/div>\u003cdiv class=\"g-ko\">나는 올 수 없을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I can't swim, nor can I ride a bike.\u003c/div>\u003cdiv class=\"g-ko\">나는 수영도 못 하고 자전거도 못 탄다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, 조동사 문제는 규칙 하나로 정리됩니다. might나 can, must 같은 조동사 뒤에는 반드시 동사원형이 와요. be동사도 예외가 아니어서 is나 are가 아니라 원형 be를 씁니다. 그리고 부정어 nor가 문장 앞에 나오면 조동사가 주어 앞으로 나오면서 조동사 다음에 주어, 그다음에 동사원형 순서가 돼요. 이 두 가지만 기억하면 오늘 문제는 아주 쉽게 풀립니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A 1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I fear they might not \u003cspan class=\"p-box\">\u003cspan>be\u003c/span>\u003ci>/\u003c/i>\u003cspan>to be\u003c/span>\u003c/span> able to pay back the loans.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">be\u003c/div>\u003cdiv class=\"p-op\">to be\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">be\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 조동사 might 뒤에 무엇이 오는지를 묻는 문제예요. 네모 안의 두 선택지를 보면서 조동사 뒤에 올 수 있는 형태가 무엇인지 생각해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 be입니다. might라는 조동사 뒤에는 동사원형이 와야 하니까 to가 붙은 to be는 탈락이에요. be able to에서 be가 원형 그대로 쓰인 겁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A 1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I fear they might not \u003cspan class=\"p-box\">\u003cspan class=\"ok\">be\u003c/span>\u003ci>/\u003c/i>\u003cspan>to be\u003c/span>\u003c/span> able to pay back the loans.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">be\u003c/div>\u003cdiv class=\"p-op\">to be\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">조동사 찾기\u003c/b>might는 조동사이므로 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 와야 합니다. to be는 조동사 뒤에 올 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">be able to 확인\u003c/b>be able to는 '~할 수 있다'라는 덩어리로, 조동사 뒤에서는 원형 \u003cb class=\"key\">be\u003c/b>가 그대로 쓰입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 be\u003c/span>\u003cdiv class=\"p-full\">I fear they might not be able to pay back the loans.\u003c/div>\u003cdiv class=\"p-ko\">나는 그들이 그 대출금을 갚지 못할까 봐 걱정된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be able to를 하나의 동사로 착각해 to be를 고르는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 might를 찾아 주세요. might는 조동사니까 바로 뒤에는 동사원형이 와야 해요. 그래서 to가 붙은 to be는 답이 될 수 없습니다.","hl":"st-0"},{"n":7,"text":"be able to는 ~할 수 있다는 뜻의 덩어리예요. 조동사 뒤에서는 이 덩어리의 앞부분이 원형 be 그대로 쓰인답니다. 그래서 정답은 be입니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. be able to를 하나의 동사로 착각해 to be를 고르는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A 2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I cannot cancel my order nor can I \u003cspan class=\"p-box\">\u003cspan>get\u003c/span>\u003ci>/\u003c/i>\u003cspan>getting\u003c/span>\u003c/span> a refund.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">get\u003c/div>\u003cdiv class=\"p-op\">getting\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">get\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":9,"text":"두 번째 문제는 nor가 들어간 문장이에요. nor 뒤의 어순과 동사 형태를 함께 보면서 어느 쪽이 맞는지 판단해 보세요.","hl":"q"},{"n":10,"text":"","hl":"q","pause":7},{"n":11,"text":"정답은 get입니다. nor가 문두에 오면 조동사 다음에 주어, 그다음 동사원형 순서가 되니까 can I get이 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A 2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I cannot cancel my order nor can I \u003cspan class=\"p-box\">\u003cspan class=\"ok\">get\u003c/span>\u003ci>/\u003c/i>\u003cspan>getting\u003c/span>\u003c/span> a refund.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">get\u003c/div>\u003cdiv class=\"p-op\">getting\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">nor의 어순\u003c/b>nor가 문장 앞에 오면 '\u003cb class=\"key\">조동사 + 주어 + 동사원형\u003c/b>' 어순이 되므로 can I get 형태가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">앞 문장과 연결\u003c/b>앞의 cannot cancel과 같은 조동사 can이 이어지므로 뒤에는 원형 \u003cb class=\"key\">get\u003c/b>이 옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 get\u003c/span>\u003cdiv class=\"p-full\">I cannot cancel my order nor can I get a refund.\u003c/div>\u003cdiv class=\"p-ko\">나는 주문을 취소할 수 없고 환불도 받을 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>nor를 그냥 접속사로 보고 뒤에 동명사 getting을 고르는 실수\u003c/div>","segs":[{"n":12,"text":"nor가 문장 앞으로 나오면 조동사가 주어 앞으로 갑니다. 그래서 can이 I보다 먼저 오고 그 뒤에는 동사원형이 와요. getting은 동명사나 분사라서 여기에 올 수 없습니다.","hl":"st-0"},{"n":13,"text":"앞에서 cannot cancel이라고 했죠. 같은 조동사 can이 뒤 문장에도 이어지니까 뒤에는 원형 get이 와야 자연스럽습니다.","hl":"st-1"},{"n":14,"text":"이 문제의 함정도 짚고 갈게요. nor를 그냥 접속사로 보고 뒤에 동명사 getting을 고르는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 + have p.p. (과거 추측·후회)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실에 대한 추측과 후회는 \u003cb class=\"key\">조동사 + have + p.p.\u003c/b>로 표현한다. must have p.p.는 강한 긍정 추측, cannot have p.p.는 강한 부정 추측, should have p.p.는 하지 않은 일에 대한 후회·비난이다.\u003cdiv>\u003cspan class=\"g-formula\">조동사 + have + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must have p.p. ~했음에 틀림없다 / cannot have p.p. ~했을 리 없다\u003c/li>\u003cli>should have p.p. ~했어야 했는데 (하지 않았다)\u003c/li>\u003cli>might have p.p. ~했을지도 모른다\u003c/li>\u003cli>have 뒤에는 반드시 과거분사(p.p.)가 온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He must have missed the bus.\u003c/div>\u003cdiv class=\"g-ko\">그는 버스를 놓쳤음에 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You should have followed the recipe.\u003c/div>\u003cdiv class=\"g-ko\">너는 그 조리법을 따랐어야 했는데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":15,"text":"이번에는 조동사 뒤에 have 피피가 붙는 표현을 볼게요. must have 피피는 했음에 틀림없다, cannot have 피피는 했을 리 없다, should have 피피는 했어야 했는데 하지 않았다, might have 피피는 했을지도 모른다로 정리됩니다. 여기서 가장 중요한 건 문맥이에요. 이미 벌어진 결과를 보고 강하게 추측하면 must, 하지 않은 일을 아쉬워하거나 나무라면 should를 씁니다. 문제를 읽을 때 앞 문장의 상황을 꼭 함께 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A 3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">This soup tastes awful. You \u003cspan class=\"p-box\">\u003cspan>must\u003c/span>\u003ci>/\u003c/i>\u003cspan>should\u003c/span>\u003c/span> have followed the good recipe.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">must\u003c/div>\u003cdiv class=\"p-op\">should\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">should\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"세 번째 문제는 조동사 뒤에 have 피피가 붙은 표현이에요. 앞 문장의 상황을 먼저 읽고, 어떤 조동사가 어울리는지 생각해 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":7},{"n":18,"text":"정답은 should입니다. 조리법을 따랐어야 했는데 따르지 않았다는 후회를 나타내니까 should have 피피가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / u003cb class=\"key\">목적의 to부정사\u003c/b>이므로 뒤에 동사원형 \u003cb class=\"key\">prepare\u003c/b>가 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) have used\u003c/b>might (2) use는 과거 사실에 대한 추측이므로 \u003cb class=\"key\">might have p.p.\u003c/b> 형태인 might have used가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) been\u003c/b>could have (3) being은 have 뒤에 \u003cb class=\"key\">과거분사\u003c/b>가 와야 하므로 been입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) prepare (2) have used (3) been\u003c/span>\u003cdiv class=\"p-ko\">연구들은 우리 조상들이 일종의 흙 오븐을 사용했다고 말한다. 고대의 화덕이 단지 따뜻하게 하는 용도가 아니라 음식을 준비하는 데 사용되었다는 것을 증명하기는 어렵다. 우리 조상들은 불을 따뜻하게 하는 데 사용했을지도 모른다. 그렇다면 그들은 불 옆에서 생선을 먹고 뼈를 불에 던졌을 수 있다. 그것이 잘 익은 생선의 시작이었을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>was used to를 '익숙하다'로 읽고 preparing을 그대로 두는 함정 — 주어가 사물이면 '사용되다'입니다\u003c/div>","segs":[{"n":59,"text":"첫 번째 밑줄부터 볼게요. 주어가 화덕이라는 사물이니까 사용되었다는 수동태로 읽어야 합니다. 여기서 to는 ~하기 위해라는 목적의 to부정사라서 뒤에 동사원형이 와야 해요. 그래서 prepare입니다.","hl":"st-0"},{"n":60,"text":"두 번째는 might 뒤예요. 조상들이 불을 사용했을지도 모른다고 과거 일을 추측하고 있으니 might have 피피 형태가 필요합니다. 그래서 have used가 됩니다.","hl":"st-1"},{"n":61,"text":"세 번째는 could have 뒤예요. have 다음에는 반드시 과거분사가 와야 하니까 being이 아니라 been을 씁니다. 그래서 세 답은 prepare, have used, been입니다.","hl":"st-2"},{"n":62,"text":"이 문제의 함정도 짚고 갈게요. was used to를 '익숙하다'로 읽고 preparing을 그대로 두는 함정 — 주어가 사물이면 '사용되다'입니다","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C 2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">There used (1) \u003cu class=\"p-u\">to being\u003c/u> dangerous challenges online. A 12-year-old boy from Michigan spent four days in the hospital recovering from second-degree burns he got while completing the &quot;fire challenge.&quot; Basically, some sort of flammable liquid, like nail polish remover, (2) \u003cu class=\"p-u\">used\u003c/u> to set him on fire for a few seconds. This challenge should have never (3) \u003cu class=\"p-u\">happen\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) to be (2) was used (3) happened\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"이번 지문에는 used to와 수동태, 그리고 should have 표현이 모두 들어 있어요. 밑줄마다 앞에 있는 표현이 무엇인지 확인하면서 읽어 보세요.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"정답은 to be, was used, happened입니다. There used to 뒤에는 동사원형, 액체는 사용되는 대상이라 수동태, should have 뒤에는 과거분사가 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C 2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">There used (1) \u003cu class=\"p-u\">to being\u003c/u> dangerous challenges online. A 12-year-old boy from Michigan spent four days in the hospital recovering from second-degree burns he got while completing the &quot;fire challenge.&quot; Basically, some sort of flammable liquid, like nail polish remover, (2) \u003cu class=\"p-u\">used\u003c/u> to set him on fire for a few seconds. This challenge should have never (3) \u003cu class=\"p-u\">happen\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) to be\u003c/b>There used to (1) being은 '예전에 ~가 있었다'라는 \u003cb class=\"key\">There used to + 동사원형\u003c/b>이므로 to be가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) was used\u003c/b>주어 liquid는 '불을 붙이는 데 사용된' 대상이므로 수동태 \u003cb class=\"key\">was used\u003c/b>가 맞고, 뒤의 to set은 목적의 to부정사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) happened\u003c/b>should have 뒤에는 \u003cb class=\"key\">과거분사\u003c/b>가 와야 하므로 happen이 아니라 happened입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) to be (2) was used (3) happened\u003c/span>\u003cdiv class=\"p-ko\">예전에는 온라인에 위험한 챌린지들이 있었다. 미시간 출신의 열두 살 소년은 '파이어 챌린지'를 하다가 입은 2도 화상에서 회복하느라 나흘을 병원에서 보냈다. 기본적으로, 매니큐어 리무버 같은 일종의 인화성 액체가 그에게 몇 초 동안 불을 붙이는 데 사용되었다. 이 챌린지는 절대 일어나지 않았어야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(1)을 '익숙해지고 있었다'로 오해해 being을 그대로 두는 것\u003c/div>","segs":[{"n":66,"text":"첫 번째 밑줄은 There used to 뒤예요. 예전에 ~가 있었다는 표현은 There used to 다음에 동사원형을 씁니다. 그래서 to be가 됩니다.","hl":"st-0"},{"n":67,"text":"두 번째는 주어가 액체죠. 액체는 사용되는 대상이니까 수동태로 써야 합니다. 그래서 used가 아니라 was used가 되고, 뒤에 오는 to set은 ~하는 데 사용되었다는 목적의 to부정사입니다.","hl":"st-1"},{"n":68,"text":"세 번째는 should have 뒤예요. should have 피피는 했어야 했는데 하지 않았다는 뜻이니까 have 다음에 과거분사가 와야 합니다. 그래서 happened가 맞습니다.","hl":"st-2"},{"n":69,"text":"이 문제의 함정도 짚고 갈게요. (1)을 '익숙해지고 있었다'로 오해해 being을 그대로 두는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 뒤의 형태(동사원형·have p.p.) / used to와 be used to / 수동태\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>조동사 뒤에는 언제나 \u003cb class=\"key\">동사원형\u003c/b>이 옵니다. be동사도 원형 be로 씁니다.\u003c/li>\u003cli>과거 사실에 대한 추측은 \u003cb class=\"key\">조동사 + have + p.p.\u003c/b>이며, 강한 긍정은 must, 강한 부정은 cannot, 후회는 should입니다.\u003c/li>\u003cli>\u003cb class=\"key\">used to + 동사원형\u003c/b>은 과거의 습관, \u003cb class=\"key\">be used to + 명사·동명사\u003c/b>는 익숙함입니다.\u003c/li>\u003cli>수동태는 \u003cb class=\"key\">be + p.p.\u003c/b>, 조동사가 붙으면 \u003cb class=\"key\">조동사 + be + p.p.\u003c/b>, 완료면 \u003cb class=\"key\">조동사 + have + been + p.p.\u003c/b>입니다.\u003c/li>\u003c/ul>","segs":[{"n":70,"text":"오늘 문제의 핵심은 결국 세 가지였어요. 조동사 뒤에는 동사원형이나 have 피피가 온다는 것, used to와 be used to는 뒤에 오는 형태로 뜻이 갈린다는 것, 그리고 수동태는 be동사와 과거분사의 짝이라는 점입니다. 이 세 가지만 확실히 잡아 두면 시험에서 비슷한 문제는 바로 풀 수 있을 거예요. 오늘도 수고 많았습니다!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
