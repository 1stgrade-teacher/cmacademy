window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 4 Chapter Test","audioDir":"test1_audio","preview":false,"count":175,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">가정법·조동사·제안/요구 표현과 어법 종합\u003c/div>\u003ch1>Chapter 4 Chapter Test\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 맞는 문장끼리 짝지어 고르기, 틀린 부분 두 개 찾아 고치기, 배열 서술형, 문장 완성, 틀린 것 개수 고르기, 괄호 안 말을 알맞은 형태로 바꿔 쓰기, 지문 어법+영작\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 챕터 테스트에 나오는 어법 문제를 함께 풀어 볼 거예요. 가정법과 조동사 표현, 그리고 여러 관용 표현이 골고루 나오니까 하나씩 차근차근 짚어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">be used to + 동명사 / used to + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be used to의 to는 전치사라서 뒤에 \u003cb class=\"key\">동명사\u003c/b>가 온다. used to는 '예전에 ~했다'로 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">be used to + V-ing / used to + V / be used to + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be used to는 '~에 익숙하다'\u003c/li>\u003cli>used to는 과거 습관\u003c/li>\u003cli>be used to + 동사원형은 '~하는 데 사용되다'\u003c/li>\u003cli>to의 역할을 먼저 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is used to getting up early.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 일찍 일어나는 것에 익숙하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He used to live in Busan.\u003c/div>\u003cdiv class=\"g-ko\">그는 예전에 부산에 살았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 be used to부터 볼게요. 여기서 to는 전치사라서 뒤에는 꼭 동명사가 와요. 그래서 be used to living처럼 쓰고, 뜻은 무엇에 익숙하다예요. 반면에 used to live는 예전에 살았다는 과거 습관을 말해요. 또 be used to 뒤에 동사원형이 오면 무엇을 하기 위해 사용되다라는 수동의 뜻이 된다는 점도 구분해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He is used to \u003cspan class=\"p-box\">\u003cspan>live\u003c/span>\u003ci>/\u003c/i>\u003cspan>living\u003c/span>\u003c/span> in a small room that is easy to take care of.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">live\u003c/div>\u003cdiv class=\"p-op\">living\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">living\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 be used to 뒤에 어떤 형태가 오는지 묻고 있어요. to의 역할과 문장 전체의 의미를 함께 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 living이에요. is used to의 to는 전치사라서 뒤에 동명사 living이 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He is used to \u003cspan class=\"p-box\">\u003cspan>live\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">living\u003c/span>\u003c/span> in a small room that is easy to take care of.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">live\u003c/div>\u003cdiv class=\"p-op\">living\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">to의 정체 확인\u003c/b>is used to의 to는 \u003cb class=\"key\">전치사\u003c/b>이므로 뒤에는 동명사가 와야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>'~에 익숙하다'라는 뜻이므로 \u003cb class=\"key\">be used to + V-ing\u003c/b> 구조가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확정\u003c/b>live가 아니라 \u003cb class=\"key\">living\u003c/b>을 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 living\u003c/span>\u003cdiv class=\"p-full\">He is used to living in a small room that is easy to take care of.\u003c/div>\u003cdiv class=\"p-ko\">그는 관리하기 쉬운 작은 방에서 사는 것에 익숙하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>used to를 '예전에 ~했다'로 착각해 live를 고르기 쉽다.\u003c/div>","segs":[{"n":6,"text":"먼저 is used to에서 to가 어떤 역할인지 봐요. 여기서 to는 전치사라서 뒤에 동사원형이 아니라 동명사가 와요.","hl":"st-0"},{"n":7,"text":"문장 전체의 뜻은 작은 방에서 사는 것에 익숙하다는 거예요. 그래서 be used to 뒤에 동명사가 오는 구조가 자연스러워요.","hl":"st-1"},{"n":8,"text":"따라서 정답은 living이에요. living을 넣어서 그는 작은 방에서 사는 것에 익숙하다고 해석하면 됩니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. used to를 '예전에 ~했다'로 착각해 live를 고르기 쉽다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">had better / had better not\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">had better + 동사원형은 '~하는 것이 낫다'는 충고이고, 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003cdiv>\u003cspan class=\"g-formula\">had better + V / had better not + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>had better 뒤에는 동사원형\u003c/li>\u003cli>not은 better 뒤에 위치\u003c/li>\u003cli>not better는 비교 표현이 되어 부적절\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You had better see a doctor.\u003c/div>\u003cdiv class=\"g-ko\">너는 의사에게 보이는 게 낫겠어.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We had better not go out now.\u003c/div>\u003cdiv class=\"g-ko\">우리는 지금 나가지 않는 게 낫겠어.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"두 번째 개념은 had better예요. 이 표현은 충고할 때 쓰고 뒤에는 동사원형이 와요. 부정할 때는 not을 better 뒤에 붙여서 had better not으로 써요. not better라고 하면 비교 표현처럼 들려서 충고의 뜻이 되지 않아요. 시험에서는 not의 위치만 정확히 봐도 답이 보여요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">After the creative differences we had, Eddie and I decided that we had \u003cspan class=\"p-box\">\u003cspan>not better\u003c/span>\u003ci>/\u003c/i>\u003cspan>better not\u003c/span>\u003c/span> work together on the next movie.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">not better\u003c/div>\u003cdiv class=\"p-op\">better not\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">better not\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 충고 표현 had better의 부정형을 고르는 문제예요. not이 어디에 와야 자연스러운지 생각해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 better not이에요. had better의 부정은 better 앞이 아니라 better 뒤에 not을 붙여 had better not으로 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">After the creative differences we had, Eddie and I decided that we had \u003cspan class=\"p-box\">\u003cspan>not better\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">better not\u003c/span>\u003c/span> work together on the next movie.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">not better\u003c/div>\u003cdiv class=\"p-op\">better not\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">had better 확인\u003c/b>had better는 충고를 나타내며 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">부정어 위치\u003c/b>부정은 had better 뒤에 not을 붙여 \u003cb class=\"key\">had better not + 동사원형\u003c/b>으로 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확정\u003c/b>not better가 아니라 \u003cb class=\"key\">better not\u003c/b>이 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 better not\u003c/span>\u003cdiv class=\"p-full\">After the creative differences we had, Eddie and I decided that we had better not work together on the next movie.\u003c/div>\u003cdiv class=\"p-ko\">우리가 겪은 창작상의 의견 차이 이후, 에디와 나는 다음 영화에서 함께 작업하지 않는 것이 낫다고 결정했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>not better는 '더 낫지 않은'이라는 비교 표현이 되어 충고의 의미가 되지 않는다.\u003c/div>","segs":[{"n":14,"text":"먼저 had better가 충고를 나타내는 표현이라는 점을 기억해요. 이 표현 뒤에는 동사원형 work가 와요.","hl":"st-0"},{"n":15,"text":"부정할 때는 not을 better 앞에 두지 않고 better 뒤에 붙여요. 그래서 had better not work가 됩니다.","hl":"st-1"},{"n":16,"text":"따라서 정답은 better not이에요. not better는 비교 표현처럼 되어 충고의 의미가 되지 않아요.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. not better는 '더 낫지 않은'이라는 비교 표현이 되어 충고의 의미가 되지 않는다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">조동사 + have + 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실에 대한 추측은 \u003cb class=\"key\">must have p.p.\u003c/b>, \u003cb class=\"key\">cannot have p.p.\u003c/b>, \u003cb class=\"key\">may/might have p.p.\u003c/b>로 표현한다.\u003cdiv>\u003cspan class=\"g-formula\">must/cannot/may/might + have + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>must have p.p.는 강한 긍정 추측\u003c/li>\u003cli>cannot have p.p.는 강한 부정 추측\u003c/li>\u003cli>may have p.p.는 불확실한 가능성\u003c/li>\u003cli>문맥의 확신 정도를 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He must have missed the bus.\u003c/div>\u003cdiv class=\"g-ko\">그는 버스를 놓친 게 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She cannot have said that.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 그런 말을 했을 리가 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"조동사 뒤에 have와 과거분사가 오면 과거 사실에 대한 추측이나 후회를 나타낼 수 있어요. must have 과거분사는 틀림없이 그랬을 거라는 강한 긍정 추측이에요. cannot have 과거분사는 그랬을 리가 없다는 강한 부정 추측이고요. may have 과거분사나 might have 과거분사는 그랬을지도 모른다는 불확실한 추측이에요. 문맥의 확신 정도를 보고 조동사를 골라야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">We looked and looked and thought about the hidden meaning but came up with nothing. We \u003cspan class=\"p-box\">\u003cspan>must\u003c/span>\u003ci>/\u003c/i>\u003cspan>cannot\u003c/span>\u003c/span> have missed it.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">must\u003c/div>\u003cdiv class=\"p-op\">cannot\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">must\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 과거 사실에 대한 추측 표현을 고르는 문제예요. 앞뒤 문맥에서 화자가 얼마나 확신하는지 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 must예요. 답을 못 찾았으니 우리가 놓친 게 틀림없다는 강한 긍정 추측이라서 must have missed를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">We looked and looked and thought about the hidden meaning but came up with nothing. We \u003cspan class=\"p-box\">\u003cspan class=\"ok\">must\u003c/span>\u003ci>/\u003c/i>\u003cspan>cannot\u003c/span>\u003c/span> have missed it.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">must\u003c/div>\u003cdiv class=\"p-op\">cannot\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문맥 파악\u003c/b>계속 찾아도 답을 못 찾았으므로 '우리가 놓친 게 틀림없다'는 \u003cb class=\"key\">강한 긍정 추측\u003c/b>이 자연스럽다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">조동사 선택\u003c/b>과거 사실에 대한 강한 긍정 추측은 \u003cb class=\"key\">must have p.p.\u003c/b>, 강한 부정 추측은 cannot have p.p.이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확정\u003c/b>문맥상 \u003cb class=\"key\">must\u003c/b>가 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 must\u003c/span>\u003cdiv class=\"p-full\">We looked and looked and thought about the hidden meaning but came up with nothing. We must have missed it.\u003c/div>\u003cdiv class=\"p-ko\">우리는 보고 또 보고 숨은 의미를 생각했지만 아무것도 떠올리지 못했다. 우리가 그것을 놓친 게 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>cannot have missed를 '놓칠 수 없었다'로 해석하면 문맥과 반대가 된다.\u003c/div>","segs":[{"n":22,"text":"앞에서 보고 또 보고 생각했는데 아무것도 떠올리지 못했어요. 이 흐름이라면 우리가 무언가를 놓친 게 틀림없다는 쪽이 자연스러워요.","hl":"st-0"},{"n":23,"text":"과거 사실을 강하게 긍정하며 추측할 때는 must have 과거분사를 써요. 반대로 그랬을 리가 없다고 할 때는 cannot have 과거분사를 써요.","hl":"st-1"},{"n":24,"text":"그래서 정답은 must예요. 우리가 그것을 놓친 게 틀림없다고 해석하면 됩니다.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. cannot have missed를 '놓칠 수 없었다'로 해석하면 문맥과 반대가 된다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 과거와 I wish\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">현재 사실의 반대는 If + 주어 + \u003cb class=\"key\">were/과거동사\u003c/b>, 주어 + would/could + 동사원형으로 표현한다. I wish 뒤에도 현재의 소망을 나타내는 \u003cb class=\"key\">가정법 과거\u003c/b>가 온다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + were/과거형, S + would/could + V / I wish + S + could + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be동사는 were를 자주 사용\u003c/li>\u003cli>as if 뒤에도 가정법 과거 가능\u003c/li>\u003cli>I wish + could는 현재의 소망\u003c/li>\u003cli>주절의 시제와 의미를 함께 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If I were taller, I could play basketball.\u003c/div>\u003cdiv class=\"g-ko\">내가 키가 더 크다면 농구를 할 수 있을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wish I could fly.\u003c/div>\u003cdiv class=\"g-ko\">나는 날 수 있으면 좋겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"가정법 과거는 현재 사실의 반대를 말할 때 써요. if절에는 were나 과거 동사를 쓰고 주절에는 would나 could 뒤에 동사원형을 써요. be동사는 주어와 상관없이 were를 쓰는 경우가 많다는 점도 기억하세요. I wish 뒤에도 현재 이루기 어려운 소망을 나타낼 때 could와 동사원형을 써요. as if 뒤에 실제와 다른 상황을 가정할 때도 were를 쓸 수 있어요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If I \u003cspan class=\"p-box\">\u003cspan>were\u003c/span>\u003ci>/\u003c/i>\u003cspan>had been\u003c/span>\u003c/span> wiser, I would be able to deal with this problem better. I wish I \u003cspan class=\"p-box\">\u003cspan>could live\u003c/span>\u003ci>/\u003c/i>\u003cspan>had lived\u003c/span>\u003c/span> my life over again, knowing what I know now.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">were\u003c/div>\u003cdiv class=\"p-op\">had been\u003c/div>\u003cdiv class=\"p-op\">could live\u003c/div>\u003cdiv class=\"p-op\">had lived\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were, could live\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 가정법과 I wish 표현이 함께 나와요. 주절의 시제와 전체 의미를 단서로 잡으세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":7},{"n":29,"text":"정답은 were와 could live예요. 현재 사실의 반대라서 If절에는 were를 쓰고, I wish 뒤에는 현재의 소망을 나타내는 could live를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">If I \u003cspan class=\"p-box\">\u003cspan>were\u003c/span>\u003ci>/\u003c/i>\u003cspan>had been\u003c/span>\u003c/span> wiser, I would be able to deal with this problem better. I wish I \u003cspan class=\"p-box\">\u003cspan>could live\u003c/span>\u003ci>/\u003c/i>\u003cspan>had lived\u003c/span>\u003c/span> my life over again, knowing what I know now.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">were\u003c/div>\u003cdiv class=\"p-op\">had been\u003c/div>\u003cdiv class=\"p-op\">could live\u003c/div>\u003cdiv class=\"p-op\">had lived\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">If절 확인\u003c/b>주절이 would be able to로 현재 결과를 나타내므로 If절은 현재 사실의 반대인 \u003cb class=\"key\">가정법 과거\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">be동사 선택\u003c/b>가정법 과거에서 be동사는 \u003cb class=\"key\">were\u003c/b>를 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">I wish 확인\u003c/b>I wish 뒤에서 현재 실현하기 어려운 소망은 \u003cb class=\"key\">could + 동사원형\u003c/b>으로 표현한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답 확정\u003c/b>\u003cb class=\"key\">were\u003c/b>, \u003cb class=\"key\">could live\u003c/b>가 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 were, could live\u003c/span>\u003cdiv class=\"p-full\">If I were wiser, I would be able to deal with this problem better. I wish I could live my life over again, knowing what I know now.\u003c/div>\u003cdiv class=\"p-ko\">내가 더 현명하다면 이 문제를 더 잘 다룰 수 있을 텐데. 지금 아는 것을 알고서 내 인생을 다시 살 수 있다면 좋겠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주절의 would be를 보고 무조건 had been을 고르면 안 된다. 의미상 현재의 반대인지 확인해야 한다.\u003c/div>","segs":[{"n":30,"text":"먼저 주절을 보면 would be able to가 와요. 현재 결과를 말하고 있으니 if절도 현재 사실의 반대인 가정법 과거로 맞춰요.","hl":"st-0"},{"n":31,"text":"이때 be동사는 주어가 I여도 were를 쓰는 것이 기본이에요. 그래서 If I were wiser가 됩니다.","hl":"st-1"},{"n":32,"text":"두 번째 문장은 I wish 뒤에 내 인생을 다시 살 수 있다면이라는 소망이 와요. 현재 이루기 어려운 소망이므로 could live를 써요.","hl":"st-2"},{"n":33,"text":"따라서 정답은 were와 could live예요.","hl":"st-3"},{"n":34,"text":"이 문제의 함정도 짚고 갈게요. 주절의 would be를 보고 무조건 had been을 고르면 안 된다. 의미상 현재의 반대인지 확인해야 한다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">suggest·insist·request + (should) 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">제안·요구·주장 동사 뒤 that절에는 \u003cb class=\"key\">(should) + 동사원형\u003c/b>을 쓴다. 단 suggest가 '보여 주다, 암시하다'일 때는 \u003cb class=\"key\">평서문\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">suggest/insist/request + that + S + (should) + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>should는 생략 가능\u003c/li>\u003cli>주어가 3인칭 단수여도 동사원형\u003c/li>\u003cli>suggest의 의미 구분\u003c/li>\u003cli>부정은 not + 동사원형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He insisted that she go home.\u003c/div>\u003cdiv class=\"g-ko\">그는 그녀가 집에 가야 한다고 주장했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The evidence suggests that he used tools.\u003c/div>\u003cdiv class=\"g-ko\">증거는 그가 도구를 사용했음을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"제안하다, 요구하다, 주장하다라는 뜻의 동사 뒤 that절에는 should와 동사원형이 와요. 이때 should는 자주 생략되어서 주어가 삼인칭 단수여도 동사원형이 그대로 남아요. 그래서 request that he appear처럼 써요. 하지만 suggest가 보여 주다나 암시하다라는 뜻일 때는 제안의 should 생략이 아니라 평서문이 와요. 이 차이를 문맥으로 꼭 구분해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Tony suggested to Lisa that whenever she feels sad or out of control, she \u003cspan class=\"p-box\">\u003cspan>do\u003c/span>\u003ci>/\u003c/i>\u003cspan>does\u003c/span>\u003c/span> two things. First, she needs to write down the problems that bother her objectively \u003cspan class=\"p-box\">\u003cspan>if\u003c/span>\u003ci>/\u003c/i>\u003cspan>as if\u003c/span>\u003c/span> they were someone else's problems. Second, she should ask herself if they truly matter.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">do\u003c/div>\u003cdiv class=\"p-op\">does\u003c/div>\u003cdiv class=\"p-op\">if\u003c/div>\u003cdiv class=\"p-op\">as if\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">do, as if\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":36,"text":"다섯 번째 문제는 suggest that절과 as if 표현이 함께 나와요. 제안의 의미인지, 가정의 의미인지 차례로 확인하세요.","hl":"q"},{"n":37,"text":"","hl":"q","pause":7},{"n":38,"text":"정답은 do와 as if예요. suggest가 제안하다로 쓰여 that절에 동사원형 do를 쓰고, 마치 다른 사람의 문제인 것처럼이라는 뜻으로 as if를 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 표현을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Tony suggested to Lisa that whenever she feels sad or out of control, she \u003cspan class=\"p-box\">\u003cspan>do\u003c/span>\u003ci>/\u003c/i>\u003cspan>does\u003c/span>\u003c/span> two things. First, she needs to write down the problems that bother her objectively \u003cspan class=\"p-box\">\u003cspan>if\u003c/span>\u003ci>/\u003c/i>\u003cspan>as if\u003c/span>\u003c/span> they were someone else's problems. Second, she should ask herself if they truly matter.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">do\u003c/div>\u003cdiv class=\"p-op\">does\u003c/div>\u003cdiv class=\"p-op\">if\u003c/div>\u003cdiv class=\"p-op\">as if\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">suggest that절\u003c/b>suggest가 '제안하다'로 쓰이면 that절에 \u003cb class=\"key\">(should) + 동사원형\u003c/b>을 쓰므로 주어 she여도 do가 온다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">as if 확인\u003c/b>'마치 ~인 것처럼'은 \u003cb class=\"key\">as if\u003c/b>로 쓰고, 뒤에 실제와 다른 가정이 와서 were와 호응한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확정\u003c/b>\u003cb class=\"key\">do\u003c/b>, \u003cb class=\"key\">as if\u003c/b>가 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 do, as if\u003c/span>\u003cdiv class=\"p-full\">Tony suggested to Lisa that whenever she feels sad or out of control, she do two things. First, she needs to write down the problems that bother her objectively as if they were someone else's problems. Second, she should ask herself if they truly matter.\u003c/div>\u003cdiv class=\"p-ko\">토니는 리사에게 슬프거나 통제력을 잃은 느낌이 들 때마다 두 가지 일을 하라고 제안했다. 첫째, 그녀를 괴롭히는 문제들을 마치 다른 사람의 문제인 것처럼 객관적으로 적어야 한다. 둘째, 그 문제들이 정말 중요한지 스스로에게 물어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>suggest 뒤에 항상 현재형 does를 쓰는 것이 아니다. '제안' 의미면 동사원형이 오고, as if 뒤 were도 단서가 된다.\u003c/div>","segs":[{"n":39,"text":"먼저 suggested that 뒤를 보세요. 여기서 suggest는 제안하다는 뜻이라 that절에 동사원형이 와요. 주어가 she여도 do를 씁니다.","hl":"st-0"},{"n":40,"text":"두 번째 빈칸은 마치 다른 사람의 문제인 것처럼이라는 뜻이에요. 그래서 as if를 쓰고 뒤의 were와 자연스럽게 이어져요.","hl":"st-1"},{"n":41,"text":"따라서 정답은 do와 as if예요.","hl":"st-2"},{"n":42,"text":"이 문제의 함정도 짚고 갈게요. suggest 뒤에 항상 현재형 does를 쓰는 것이 아니다. '제안' 의미면 동사원형이 오고, as if 뒤 were도 단서가 된다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">should have p.p. / wish + had p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거에 하지 않은 일에 대한 후회는 \u003cb class=\"key\">should have p.p.\u003c/b> 또는 I wish + \u003cb class=\"key\">had p.p.\u003c/b>로 표현한다.\u003cdiv>\u003cspan class=\"g-formula\">should (not) have + p.p. / I wish + S + had + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>should have p.p.는 '~했어야 했다'\u003c/li>\u003cli>should not have p.p.는 '~하지 말았어야 했다'\u003c/li>\u003cli>I wish had p.p.는 과거 후회\u003c/li>\u003cli>과거 사건인지 먼저 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I should have called you.\u003c/div>\u003cdiv class=\"g-ko\">나는 너에게 전화했어야 했어.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wish I had been more careful.\u003c/div>\u003cdiv class=\"g-ko\">더 조심했더라면 좋았을 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"should have 과거분사는 그렇게 했어야 했는데 하지 않았다는 후회를 나타내요. 부정형 should not have 과거분사는 하지 말았어야 했다는 뜻이에요. I wish 뒤에 had 과거분사를 쓰면 과거에 그랬더라면 좋았을 텐데라는 후회가 돼요. 과거에 대한 아쉬움은 현재형이 아니라 had와 과거분사로 표현한다는 점을 기억하세요. 문제에서 과거의 사건인지 먼저 확인하면 좋아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">① Jay wished he \u003cu class=\"p-u\">had met\u003c/u> a girl like Sarah sooner.\u003cbr>② There \u003cu class=\"p-u\">used to be\u003c/u> several mills here, but they have all closed down.\u003cbr>③ The evidence suggests that early humans \u003cu class=\"p-u\">use\u003c/u> tools for hunting.\u003cbr>④ I sincerely apologize. I should \u003cu class=\"p-u\">have been\u003c/u> more careful with my language.\u003cbr>⑤ She moved her fingers across the photograph as if she \u003cu class=\"p-u\">were\u003c/u> touching a diamond.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③ (use → used)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":44,"text":"여섯 번째 문제는 다섯 문장 중 어법상 틀린 것을 찾는 문제예요. 각 문장의 동사 형태와 가정법 표현을 하나씩 확인해 보세요.","hl":"q"},{"n":45,"text":"","hl":"q","pause":7},{"n":46,"text":"정답은 세 번째예요. evidence suggests that은 증거가 보여 준다는 뜻이라 뒤에 평서문이 와야 하고, 주어가 복수라 used가 되어야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">① Jay wished he \u003cu class=\"p-u\">had met\u003c/u> a girl like Sarah sooner.\u003cbr>② There \u003cu class=\"p-u\">used to be\u003c/u> several mills here, but they have all closed down.\u003cbr>③ The evidence suggests that early humans \u003cu class=\"p-u\">use\u003c/u> tools for hunting.\u003cbr>④ I sincerely apologize. I should \u003cu class=\"p-u\">have been\u003c/u> more careful with my language.\u003cbr>⑤ She moved her fingers across the photograph as if she \u003cu class=\"p-u\">were\u003c/u> touching a diamond.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>wished 뒤 had met은 과거에 더 일찍 만나지 못한 것에 대한 후회라서 \u003cb class=\"key\">had p.p.\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>There used to be는 '예전에 있었다'라는 \u003cb class=\"key\">used to + 동사원형\u003c/b> 구조라 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>The evidence suggests that은 '증거가 보여 준다'는 뜻이므로 \u003cb class=\"key\">평서문\u003c/b>이 와야 하고, 주어 early humans가 복수라 \u003cb class=\"key\">used\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>should have been은 '더 조심했어야 했다'는 \u003cb class=\"key\">과거에 대한 후회\u003c/b>라 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>as if 뒤에 실제와 다른 가정이 와서 \u003cb class=\"key\">were\u003c/b>가 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (use → used)\u003c/span>\u003cdiv class=\"p-ko\">① 제이는 사라 같은 소녀를 더 일찍 만났더라면 하고 소원했다. ② 예전에 이곳에 제분소가 여러 개 있었지만 모두 문을 닫았다. ③ 증거는 초기 인류가 사냥을 위해 도구를 사용했음을 보여 준다. ④ 진심으로 사과한다. 내 말투를 더 조심했어야 했다. ⑤ 그녀는 마치 다이아몬드를 만지고 있는 것처럼 사진 위로 손가락을 움직였다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>suggest를 무조건 '제안하다'로만 보면 ③을 놓친다. '보여 주다'일 때는 평서문이 온다.\u003c/div>","segs":[{"n":47,"text":"첫 번째 문장을 볼게요. 더 일찍 만났더라면 하고 과거의 후회를 말하고 있으므로 had met이 맞아요.","hl":"st-0"},{"n":48,"text":"두 번째 문장의 used to be는 예전에 있었다는 뜻이에요. used to 뒤에 동사원형 be가 와서 맞습니다.","hl":"st-1"},{"n":49,"text":"세 번째 문장에서 suggests는 제안하다가 아니라 보여 준다라는 뜻이에요. 그래서 뒤에는 평서문이 와야 하고, 주어가 복수라서 use가 아니라 used가 되어야 해요.","hl":"st-2"},{"n":50,"text":"네 번째 문장은 더 조심했어야 했다는 후회를 말해요. should have 과거분사 형태라서 맞아요.","hl":"st-3"},{"n":51,"text":"다섯 번째 문장은 마치 다이아몬드를 만지는 것처럼이라는 가정을 말해요. as if 뒤에 were가 와서 맞습니다.","hl":"st-4"},{"n":52,"text":"이 문제의 함정도 짚고 갈게요. suggest를 무조건 '제안하다'로만 보면 세 번째를 놓친다. '보여 주다'일 때는 평서문이 온다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 과거완료\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거 사실의 반대는 If + \u003cb class=\"key\">had p.p.\u003c/b>, 주어 + \u003cb class=\"key\">would have p.p.\u003c/b>로 표현한다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + had p.p., S + would have p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>if절에는 had p.p.\u003c/li>\u003cli>주절에는 would have p.p.\u003c/li>\u003cli>과거의 결과를 나타냄\u003c/li>\u003cli>if절 부정은 had not p.p.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If he had left earlier, he would have caught the train.\u003c/div>\u003cdiv class=\"g-ko\">그가 더 일찍 떠났더라면 기차를 잡았을 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">If she \u003cspan class=\"fx\">had not won\u003c/span>, she would have been sad.\u003c/div>\u003cdiv class=\"g-ko\">그녀가 이기지 못했더라면 슬펐을 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":53,"text":"가정법 과거완료는 과거 사실의 반대를 말할 때 써요. if절에는 had와 과거분사를 쓰고 주절에는 would have와 과거분사를 써요. 과거에 일어나지 않은 일을 상상할 때 이 짝을 기억하면 됩니다. if절에 did not을 쓰지 않고 had not으로 쓰는 경우도 많아요. 과거의 결과인지 현재의 결과인지도 함께 확인해 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">혼합 가정법: 과거 조건 + 현재 결과\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">과거에 일어나지 않은 일이 현재 결과에 영향을 줄 때 If + \u003cb class=\"key\">had p.p.\u003c/b>, 주어 + \u003cb class=\"key\">would + 동사원형\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">If + S + had p.p., S + would + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>과거 조건은 had p.p.\u003c/li>\u003cli>현재 결과는 would + 동사원형\u003c/li>\u003cli>now, back then 같은 시간 표현이 단서\u003c/li>\u003cli>would have p.p.와 구분\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">If I had studied harder, I would be a doctor now.\u003c/div>\u003cdiv class=\"g-ko\">내가 더 열심히 공부했더라면 지금 의사일 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"혼합 가정법은 과거의 조건이 현재의 결과로 이어질 때 써요. if절에는 had와 과거분사를 쓰고 주절에는 would와 동사원형을 써요. 그래서 과거에 그렇게 하지 않았으면 지금 다를 텐데라는 문장을 만들 수 있어요. now나 back then 같은 시간 표현이 큰 단서가 돼요. 주절에 have 과거분사가 아니라 동사원형이 온다는 점을 조심하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장끼리 짝지어 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">ⓐ If it had happened to me, I would have taken immediate action.\u003cbr>ⓑ Research suggests that happiness depends on a number of factors.\u003cbr>ⓒ The technology was used to managing a virtual environment on a PC.\u003cbr>ⓓ If he had practiced harder, he would have been a great player now.\u003cbr>ⓔ I may have said something during the argument, but I'm not sure.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓑ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓑ, ⓒ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":55,"text":"일곱 번째 문제는 다섯 보기 중 어법상 맞는 문장끼리 묶인 선택지를 고르는 문제예요. 각 보기의 동사 형태를 하나씩 확인하세요.","hl":"q"},{"n":56,"text":"","hl":"q","pause":7},{"n":57,"text":"정답은 세 번째 선택지예요. 첫 번째, 두 번째, 다섯 번째 문장이 맞고, 세 번째는 to manage로, 네 번째는 would be로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">맞는 문장끼리 짝지어 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">ⓐ If it had happened to me, I would have taken immediate action.\u003cbr>ⓑ Research suggests that happiness depends on a number of factors.\u003cbr>ⓒ The technology was used to managing a virtual environment on a PC.\u003cbr>ⓓ If he had practiced harder, he would have been a great player now.\u003cbr>ⓔ I may have said something during the argument, but I'm not sure.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓑ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓑ, ⓒ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>If + had p.p., would have p.p.는 \u003cb class=\"key\">가정법 과거완료\u003c/b>로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>Research suggests that은 '연구가 보여 준다'라서 뒤에 \u003cb class=\"key\">평서문\u003c/b> depends가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>문맥은 'PC 환경을 관리하는 데 사용되었다'이므로 \u003cb class=\"key\">be used to + 동사원형\u003c/b>이 맞다. managing은 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>과거 조건 + now의 현재 결과이므로 \u003cb class=\"key\">would be\u003c/b>가 와야 한다. would have been은 틀리다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>may have said는 과거에 대한 \u003cb class=\"key\">불확실한 추측\u003c/b>으로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">정답 확정\u003c/b>맞는 문장은 ⓐ, ⓑ, ⓔ이므로 \u003cb class=\"key\">③\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">ⓐ 그 일이 내게 일어났더라면 나는 즉시 행동을 취했을 것이다. ⓑ 연구는 행복이 여러 요인에 달려 있음을 보여 준다. ⓒ 그 기술은 PC에서 가상 환경을 관리하는 데 사용되었다. ⓓ 그가 더 열심히 연습했더라면 지금 훌륭한 선수가 되었을 텐데. ⓔ 나는 논쟁 중에 무언가 말했을지도 모르지만 확실하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ⓓ에서 now를 놓치면 과거 결과로 착각해 맞다고 판단하기 쉽다.\u003c/div>","segs":[{"n":58,"text":"첫 번째 보기는 과거 사실의 반대를 말하는 가정법 과거완료예요. if절에 had happened, 주절에 would have taken이 와서 맞아요.","hl":"st-0"},{"n":59,"text":"두 번째 보기의 suggests는 보여 준다라는 뜻이에요. 그래서 that절에 평서문이 와서 depends가 맞습니다.","hl":"st-1"},{"n":60,"text":"세 번째 보기는 기술이 가상 환경을 관리하는 데 사용되었다는 수동 의미예요. 그래서 was used to manage가 되어야 하고 managing은 틀려요.","hl":"st-2"},{"n":61,"text":"네 번째 보기에는 now가 있어요. 과거 조건이 현재 결과로 이어지므로 would be가 와야 합니다. would have been은 과거 결과라서 틀려요.","hl":"st-3"},{"n":62,"text":"다섯 번째 보기는 논쟁 중에 무언가 말했을지도 모른다는 불확실한 추측이에요. may have said가 맞습니다.","hl":"st-4"},{"n":63,"text":"따라서 맞는 문장은 첫 번째, 두 번째, 다섯 번째이고 정답은 세 번째 선택지예요.","hl":"st-5"},{"n":64,"text":"이 문제의 함정도 짚고 갈게요. d에서 now를 놓치면 과거 결과로 착각해 맞다고 판단하기 쉽다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 두 개 찾아 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">As she stepped back onto the court, down 5-3, Stephanie looked up into the crowd as if she ⓐ \u003cu class=\"p-u\">is\u003c/u> searching for someone or something. The crowd did not know what was going on, but had no choice but ⓑ \u003cu class=\"p-u\">to respond\u003c/u> with a cheer. The opponent hit the ball over the net and scored the final point. Stephanie was unable to return the ball, resulting in a victory for her opponent. The match would have been significant for Stephanie if she ⓒ \u003cu class=\"p-u\">won\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ is → were, ⓒ won → had won\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":65,"text":"여덟 번째 문제는 지문에서 틀린 밑줄 두 개를 찾아 고치는 문제예요. as if 뒤와 if절의 가정법 형태를 중심으로 보세요.","hl":"q"},{"n":66,"text":"","hl":"q","pause":7},{"n":67,"text":"정답은 첫 번째 밑줄은 were로, 세 번째 밑줄은 had won으로 고치는 거예요. as if 뒤에는 가정법 과거 were를 쓰고, 과거 사실의 반대 조건에는 had won을 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 두 개 찾아 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">As she stepped back onto the court, down 5-3, Stephanie looked up into the crowd as if she ⓐ \u003cu class=\"p-u\">is\u003c/u> searching for someone or something. The crowd did not know what was going on, but had no choice but ⓑ \u003cu class=\"p-u\">to respond\u003c/u> with a cheer. The opponent hit the ball over the net and scored the final point. Stephanie was unable to return the ball, resulting in a victory for her opponent. The match would have been significant for Stephanie if she ⓒ \u003cu class=\"p-u\">won\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>as if 뒤에 실제와 다른 가정이 오므로 \u003cb class=\"key\">were\u003c/b>를 써야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>have no choice but to + 동사원형은 '~할 수밖에 없다'라서 \u003cb class=\"key\">to respond\u003c/b>가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>경기가 그녀에게 의미 있었을 텐데는 과거 사실의 반대이므로 If she \u003cb class=\"key\">had won\u003c/b>이 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답 확정\u003c/b>틀린 부분은 \u003cb class=\"key\">ⓐ is → were\u003c/b>, \u003cb class=\"key\">ⓒ won → had won\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ is → were, ⓒ won → had won\u003c/span>\u003cdiv class=\"p-full\">As she stepped back onto the court, down 5-3, Stephanie looked up into the crowd as if she were searching for someone or something. The crowd did not know what was going on, but had no choice but to respond with a cheer. The opponent hit the ball over the net and scored the final point. Stephanie was unable to return the ball, resulting in a victory for her opponent. The match would have been significant for Stephanie if she had won.\u003c/div>\u003cdiv class=\"p-ko\">5대 3으로 뒤진 채 코트로 돌아서면서, 스테파니는 마치 누군가나 무언가를 찾는 것처럼 관중석을 올려다보았다. 관중들은 무슨 일인지 몰랐지만 환호로 응할 수밖에 없었다. 상대는 공을 네트 너머로 넘겨 마지막 점수를 얻었다. 스테파니는 공을 되받아치지 못해 상대가 승리하게 되었다. 그녀가 이겼더라면 그 경기는 스테파니에게 의미 있었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ⓑ의 but to를 보고 틀렸다고 생각하기 쉽지만 have no choice but to는 고정 표현이다.\u003c/div>","segs":[{"n":68,"text":"첫 번째 밑줄을 볼게요. 마치 누군가를 찾는 것처럼이라는 가정이므로 as if 뒤에는 were가 와야 해요.","hl":"st-0"},{"n":69,"text":"두 번째 밑줄은 have no choice but to respond 형태예요. 이 표현은 할 수밖에 없다는 뜻으로 but to 뒤에 동사원형이 와서 맞습니다.","hl":"st-1"},{"n":70,"text":"세 번째 밑줄은 과거에 이겼더라면 경기가 의미 있었을 텐데라는 반대 상황이에요. 과거 사실의 반대이므로 had won으로 써야 합니다.","hl":"st-2"},{"n":71,"text":"따라서 첫 번째 밑줄은 were로, 세 번째 밑줄은 had won으로 고치면 됩니다.","hl":"st-3"},{"n":72,"text":"이 문제의 함정도 짚고 갈게요. b의 but to를 보고 틀렸다고 생각하기 쉽지만 have no choice but to는 고정 표현이다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">would rather A than B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">would rather는 '차라리 ~하겠다'로 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 온다. would rather A than B에서는 A와 B를 \u003cb class=\"key\">동사원형\u003c/b>으로 병렬한다.\u003cdiv>\u003cspan class=\"g-formula\">would rather + V / would rather + V than + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>than 뒤도 동사원형\u003c/li>\u003cli>동명사와 섞지 않기\u003c/li>\u003cli>rather와 than의 짝\u003c/li>\u003cli>앞뒤 동사 형태 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I would rather walk than take a bus.\u003c/div>\u003cdiv class=\"g-ko\">나는 버스를 타기보다 걷겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":73,"text":"would rather는 차라리 하겠다라는 뜻으로 뒤에 동사원형이 와요. would rather A than B에서는 A와 B가 같은 형태로 병렬되어야 해요. 그래서 앞이 give up이면 뒤도 leaving이 아니라 leave로 맞춰요. than 뒤에 동명사를 쓰면 병렬이 깨져서 틀린 문장이 됩니다. rather와 than의 짝을 한 덩어리로 익혀 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 두 개 찾아 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">Kat's family went on a trip to Lake Mont that summer. They insisted their dog Elmo ⓐ \u003cu class=\"p-u\">go\u003c/u> with them even though it was not welcome at the cottage they rented. They would rather give up their trip than ⓑ \u003cu class=\"p-u\">leaving\u003c/u> it alone at home. Kat's mom paid me forty dollars a day to feed and walk him. She gave me the key to the cottage, but I had forgotten to give it back. She must ⓒ \u003cu class=\"p-u\">forget\u003c/u> too because she has never asked for it.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓑ leaving → leave, ⓒ forget → have forgotten\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":74,"text":"아홉 번째 문제는 지문에서 틀린 밑줄 두 개를 찾는 문제예요. insist, would rather, must 뒤의 형태를 차례로 보세요.","hl":"q"},{"n":75,"text":"","hl":"q","pause":7},{"n":76,"text":"정답은 두 번째 밑줄을 leave로, 세 번째 밑줄을 have forgotten으로 고치는 거예요. would rather than 뒤에는 동사원형을 쓰고, 과거 사실에 대한 추측은 must have 과거분사로 표현해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 두 개 찾아 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Kat's family went on a trip to Lake Mont that summer. They insisted their dog Elmo ⓐ \u003cu class=\"p-u\">go\u003c/u> with them even though it was not welcome at the cottage they rented. They would rather give up their trip than ⓑ \u003cu class=\"p-u\">leaving\u003c/u> it alone at home. Kat's mom paid me forty dollars a day to feed and walk him. She gave me the key to the cottage, but I had forgotten to give it back. She must ⓒ \u003cu class=\"p-u\">forget\u003c/u> too because she has never asked for it.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>insist that 뒤에 요구 내용은 \u003cb class=\"key\">(should) + 동사원형\u003c/b>이라 go가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>would rather A than B는 A와 B를 \u003cb class=\"key\">동사원형\u003c/b>으로 병렬하므로 leaving이 아니라 leave다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>과거에 열쇠를 돌려주지 않은 일에 대한 강한 추측은 \u003cb class=\"key\">must have p.p.\u003c/b>라서 must have forgotten이다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">정답 확정\u003c/b>틀린 부분은 \u003cb class=\"key\">ⓑ leaving → leave\u003c/b>, \u003cb class=\"key\">ⓒ forget → have forgotten\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓑ leaving → leave, ⓒ forget → have forgotten\u003c/span>\u003cdiv class=\"p-full\">Kat's family went on a trip to Lake Mont that summer. They insisted their dog Elmo go with them even though it was not welcome at the cottage they rented. They would rather give up their trip than leave it alone at home. Kat's mom paid me forty dollars a day to feed and walk him. She gave me the key to the cottage, but I had forgotten to give it back. She must have forgotten too because she has never asked for it.\u003c/div>\u003cdiv class=\"p-ko\">캣의 가족은 그해 여름 몬트 호수로 여행을 갔다. 그들은 빌린 별장에서 환영받지 못했는데도 개 엘모가 함께 가야 한다고 주장했다. 그들은 엘모를 집에 혼자 두느니 여행을 포기하겠다고 했다. 캣의 엄마는 내게 하루 사십 달러를 주고 엘모에게 먹이를 주고 산책을 시키게 했다. 그녀는 별장 열쇠를 내게 주었지만 나는 그것을 돌려주는 것을 잊고 있었다. 그녀도 잊은 게 틀림없다. 왜냐하면 그녀는 한 번도 열쇠를 달라고 하지 않았기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must forget을 현재의 추측으로 보면 어색하다. never asked for it이라는 현재 결과는 과거 추측의 단서다.\u003c/div>","segs":[{"n":77,"text":"첫 번째 밑줄은 insist that 뒤에 동사원형 go가 와요. 요구하는 내용이라서 should가 생략된 형태로 맞습니다.","hl":"st-0"},{"n":78,"text":"두 번째 밑줄은 would rather give up than 뒤에 와요. 앞의 give up과 병렬되어야 하므로 leaving이 아니라 leave를 써야 해요.","hl":"st-1"},{"n":79,"text":"세 번째 밑줄은 엄마도 열쇠를 잊은 게 틀림없다는 과거 추측이에요. 그래서 must have forgotten으로 써야 합니다.","hl":"st-2"},{"n":80,"text":"따라서 두 번째 밑줄은 leave로, 세 번째 밑줄은 have forgotten으로 고칩니다.","hl":"st-3"},{"n":81,"text":"이 문제의 함정도 짚고 갈게요. must forget을 현재의 추측으로 보면 어색하다. never asked for it이라는 현재 결과는 과거 추측의 단서다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 20\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">10\u003c/span>우리말과 같은 뜻이 되도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.\u003c/div>\u003cdiv class=\"p-q\">→ We are asked to watch the actions \u003cspan class=\"p-blank\">\u003c/span>.\u003c/div>\u003cd ko\">이 아름다운 성은 그 영화 감독을 매료시켰음이 틀림없다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>must fascinate를 현재 추측으로 보면 과거 사실을 말하는 문맥과 충돌한다.\u003c/div>","segs":[{"n":160,"text":"첫 번째 밑줄은 과거에 일어났을지도 모른다는 가능성 추측이에요. might have happened가 맞습니다.","hl":"st-0"},{"n":161,"text":"두 번째 밑줄의 their는 앞에 나온 버려진 성들을 가리켜요. 소유격으로 맞습니다.","hl":"st-1"},{"n":162,"text":"세 번째 밑줄은 예전에 가장 훌륭한 성 중 하나로 여겨졌다는 뜻이에요. used to 뒤에 be가 와서 맞습니다.","hl":"st-2"},{"n":163,"text":"네 번째 밑줄은 우크라이나 서부에 위치한이라는 뜻으로 성을 꾸며요. 과거분사 located가 맞고, was used to film도 사용되었다는 수동 표현으로 맞습니다.","hl":"st-3"},{"n":164,"text":"다섯 번째 밑줄은 그 성이 감독을 매료시켰음이 틀림없다는 과거 추측이에요. 그래서 must have fascinated가 되어야 합니다.","hl":"st-4"},{"n":165,"text":"이 문제의 함정도 짚고 갈게요. must fascinate를 현재 추측으로 보면 과거 사실을 말하는 문맥과 충돌한다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">The 19th Amendment to the U.S. Constitution, ① \u003cu class=\"p-u\">which\u003c/u> granted some women the right to vote, had been kicked around in Congress for years. Women had no choice but to focus on housework and motherhood, not politics. But the amendment was finally ratified on August 18, 1920, when Tennessee signed on. ② \u003cu class=\"p-u\">What\u003c/u> you probably don't know is that Tennessee's deciding vote was cast by 24-year-old Harry T. Burn. Although Burn opposed the amendment, his mother insisted that he ③ \u003cu class=\"p-u\">approve\u003c/u> it. Mrs. Burn reportedly wrote to her son: &quot;Don't forget to be a good boy.&quot; His vote was the 50th out of a possible 99. Now that's what we call a close call! If he ④ \u003cu class=\"p-u\">did not vote\u003c/u> for it, women would not have the right to vote. On August 26, 1920, women finally achieved the right to vote throughout the United States. You might be surprised to learn that many countries gave women the right to vote before the United States ⑤ \u003cu class=\"p-u\">did\u003c/u>.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ (did not vote → had not voted)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":166,"text":"스무 번째 문제는 지문에서 어법상 틀린 밑줄을 찾는 문제예요. 관계사, 명사절, 제안 표현, 가정법을 차례로 확인하세요.","hl":"q"},{"n":167,"text":"","hl":"q","pause":7},{"n":168,"text":"정답은 네 번째예요. 과거 사실의 반대 조건이므로 did not vote가 아니라 had not voted로 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">The 19th Amendment to the U.S. Constitution, ① \u003cu class=\"p-u\">which\u003c/u> granted some women the right to vote, had been kicked around in Congress for years. Women had no choice but to focus on housework and motherhood, not politics. But the amendment was finally ratified on August 18, 1920, when Tennessee signed on. ② \u003cu class=\"p-u\">What\u003c/u> you probably don't know is that Tennessee's deciding vote was cast by 24-year-old Harry T. Burn. Although Burn opposed the amendment, his mother insisted that he ③ \u003cu class=\"p-u\">approve\u003c/u> it. Mrs. Burn reportedly wrote to her son: &quot;Don't forget to be a good boy.&quot; His vote was the 50th out of a possible 99. Now that's what we call a close call! If he ④ \u003cu class=\"p-u\">did not vote\u003c/u> for it, women would not have the right to vote. On August 26, 1920, women finally achieved the right to vote throughout the United States. You might be surprised to learn that many countries gave women the right to vote before the United States ⑤ \u003cu class=\"p-u\">did\u003c/u>.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>which는 the 19th Amendment를 받는 \u003cb class=\"key\">주격 관계대명사\u003c/b>로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>What you probably don't know는 '네가 아마 모르는 것'이라는 \u003cb class=\"key\">명사절\u003c/b>로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>insisted that he approve는 \u003cb class=\"key\">(should) + 동사원형\u003c/b>이라 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>과거 사실의 반대 가정이므로 If he \u003cb class=\"key\">had not voted\u003c/b> for it이 되어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>before the United States did의 did는 앞의 gave women the right to vote를 대신하는 \u003cb class=\"key\">대동사\u003c/b>로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ (did not vote → had not voted)\u003c/span>\u003cdiv class=\"p-full\">If he had not voted for it, women would not have the right to vote.\u003c/div>\u003cdiv class=\"p-ko\">그가 그것에 반대표를 던지지 않았더라면, 여성들은 투표권을 갖지 못했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주절에 would not have가 있다고 if절도 would로 쓰면 안 된다. if절은 had p.p.다.\u003c/div>","segs":[{"n":169,"text":"첫 번째 밑줄의 which는 앞의 수정 헌법 조항을 받는 주격 관계대명사예요. granted와 이어져서 맞습니다.","hl":"st-0"},{"n":170,"text":"두 번째 밑줄은 네가 아마 모르는 것이라는 명사절이에요. 문장 주어로 쓰여서 맞습니다.","hl":"st-1"},{"n":171,"text":"세 번째 밑줄은 insisted that 뒤에 동사원형 approve가 온 형태예요. 요구나 주장의 that절이라서 맞습니다.","hl":"st-2"},{"n":172,"text":"네 번째 밑줄은 과거에 그에게 투표하지 않았더라면이라는 반대 상황이에요. 그래서 did not vote가 아니라 had not voted가 되어야 합니다.","hl":"st-3"},{"n":173,"text":"다섯 번째 밑줄의 did는 앞에 나온 gave women the right to vote를 대신하는 말이에요. 그래서 맞습니다.","hl":"st-4"},{"n":174,"text":"이 문제의 함정도 짚고 갈게요. 주절에 would not have가 있다고 if절도 would로 쓰면 안 된다. if절은 had p.p.다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">가정법·조동사·제안/요구 표현과 어법 종합\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>be used to 뒤에는 \u003cb class=\"key\">동명사\u003c/b>, used to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/li>\u003cli>had better의 부정은 \u003cb class=\"key\">had better not + 동사원형\u003c/b>이다.\u003c/li>\u003cli>과거 추측은 must/cannot/may + \u003cb class=\"key\">have p.p.\u003c/b>로 표현한다.\u003c/li>\u003cli>가정법 과거는 \u003cb class=\"key\">were\u003c/b>와 would/could + 동사원형, 가정법 과거완료는 \u003cb class=\"key\">had p.p.\u003c/b>와 would have p.p.로 짝을 이룬다.\u003c/li>\u003cli>제안·요구·주장 동사 뒤 that절에는 \u003cb class=\"key\">(should) + 동사원형\u003c/b>을 쓴다.\u003c/li>\u003cli>suggest가 '보여 주다'일 때는 \u003cb class=\"key\">평서문\u003c/b>이 온다.\u003c/li>\u003cli>혼합 가정법은 과거 조건 \u003cb class=\"key\">had p.p.\u003c/b> + 현재 결과 \u003cb class=\"key\">would + 동사원형\u003c/b>이다.\u003c/li>\u003cli>동명사구 주어는 \u003cb class=\"key\">단수 동사\u003c/b>와 일치시킨다.\u003c/li>\u003c/ul>","segs":[{"n":175,"text":"오늘은 be used to와 used to의 차이, had better와 might as well, 조동사 과거 추측, 가정법과 제안 요구 표현을 확인했어요. 특히 to 뒤에 동명사가 오는지 동사원형이 오는지, if절과 주절의 시제가 의미에 맞게 짝을 이루는지 꼭 다시 보세요. 틀린 문제는 해설을 보지 않고 스스로 한 번 더 풀어 보면 좋겠어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
