때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 4 포인트21 조동사 관용 표현 - 문법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>조동사 관용 표현은 모양과 뜻을 하나의 \u003cb class=\"key\">세트\u003c/b>로 암기해야 한다.\u003c/li>\u003cli>had better와 would rather, 그리고 may 계열 표현 뒤에는 반드시 \u003cb class=\"key\">동사원형\u003c/b>이 온다.\u003c/li>\u003cli>cannot help 뒤에는 동사원형이 아니라 반드시 \u003cb class=\"key\">동명사\u003c/b>를 쓴다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":34,"text":"오늘 우리는 조동사 관용 표현들을 하나씩 살펴보았어요. had better와 would rather, may well과 may as well 뒤에는 동사원형이 온다는 것과 cannot help 뒤에는 동명사 ing가 온다는 함정만 잘 기억하면 시험에서 틀릴 일이 없을 거예요. 오늘 배운 내용을 복습하면서 오늘 수업을 마무리할게요. 수고하셨습니다.","hl":"sum"}]}],"practice":{"unit":"Chapter 4 포인트21 조동사 관용 표현 - 문법","level":"고1·2","ctx":"단원: Chapter 4 포인트21 조동사 관용 표현 - 문법\n강의 제목: 한 번에 끝내는 조동사 관용 표현 완전 정복\n목표: 시험에 무조건 나오는 조동사 관용 표현의 형태와 의미를 정확하게 이해하고 헷갈리기 쉬운 함정을 피한다.\n개념 1. 제안과 선호 표현: had better V는 '~하는 것이 좋다'라는 강한 충고를 나타내며, would rather A than B는 'B하느니 차라리 A하겠다'라는 선호를 나타낸다. [had better V / would rather A than B] (주의: had better와 would rather 뒤에는 반드시 동사원형을 써야 하며, to부정사를 쓰면 틀린다.)\n  예문: You had better see a doctor. (너는 의사의 진찰을 받는 것이 좋다.) / I would rather stay home than go out. (나는 외출하느니 차라리 집에 머물겠다.)\n개념 2. 당연함과 불가피함 표현: may well V는 '~하는 것도 당연하다'라는 의미이고, may as well V는 '~하는 편이 낫다'라는 의미를 나타낸다. [may well V / may as well V] (주의: may well과 may as well도 조동사 표현이므로 뒤에 동사원형이 온다는 것을 잊지 말자.)\n  예문: You may well be proud of your son. (네가 네 아들을 자랑스러워하는 것도 당연하다.) / You may as well start now. (너는 지금 시작하는 편이 낫다.)\n개념 3. 피할 수 없음과 강조 표현: cannot help V-ing는 '~하지 않을 수 없다'라는 뜻이고, cannot ~ too는 '아무리 ~해도 지나치지 않다'라는 뜻의 강조 표현이다. [cannot help V-ing / cannot ~ too] (주의: cannot help 뒤에는 절대 동사원형을 쓰면 안 되고 반드시 동사 -ing 형태를 써야 한다.)\n  예문: I cannot help laughing at his joke. (나는 그의 농담에 웃지 않을 수 없다.) / You cannot be too careful in choosing friends. (너는 친구를 고를 때 아무리 조심해도 지나치지 않다.)\n자주 하는 실수: You had better to study hard. → You had better study hard. / I cannot help to laugh at him. → I cannot help laughing at him.\n정리: 조동사 관용 표현은 모양과 뜻을 하나의 세트로 암기해야 한다. / had better와 would rather, 그리고 may 계열 표현 뒤에는 반드시 동사원형이 온다. / cannot help 뒤에는 동사원형이 아니라 반드시 동명사를 쓴다.","items":[{"t":"choose","q":"다음 중 어법상 빈칸에 들어갈 말이 나머지 넷과 다른 하나를 고르세요.","ref":"","opts":["You had better [[finish]] your homework before dinner.","We would rather stay at home than [[go]] to the crowded beach.","You may well [[be]] proud of your excellent grades.","She cannot [[help]] crying when she watches sad movies.","He had better [[consult]] a lawyer about the contract."],"ans":[4],"exp":"①, ②, ③, ⑤는 had better, would rather, may well 조동사 표현 뒤에 동사원형이 오지만, ④번의 cannot help 뒤에는 반드시 동명사(-ing)가 와야 하므로 crying이 되어야 해요."},{"t":"fix","q":"다음 문장에서 어법상 틀린 곳을 하나 찾아 바르게 고치세요.","s":"You had better to leave right now if you want to catch the last bus.","wrong":"had better to leave","right":["had better leave"],"exp":"had better는 조동사 관용 표현이므로 뒤에 to부정사가 아니라 반드시 동사원형(leave)을 써야 해요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"I [[cannot help laughing]] at his funny mistakes.","ok":true,"right":[],"exp":"cannot help V-ing는 '~하지 않을 수 없다'라는 뜻이며, help 뒤에 동명사(laughing)가 알맞게 쓰였어요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"그는 내게 소리 지르느니 차라리 침묵을 지키겠다.","chunks":["He","would rather","stay silent","than","shout at me"],"end":".","alts":[],"exp":"'would rather A than B'(~하느니 차라리 A하겠다) 구문을 활용하여 'He would rather stay silent than shout at me.'로 배열합니다."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["help","helping","well","as well"],"items":[{"s":"You may ____ start preparing for the presentation now.","a":"as well"},{"s":"She could not help ____ when she heard the good news.","a":"helping"}],"exp":"'~하는 편이 낫다'는 may as well V, '~하지 않을 수 없다'는 cannot help V-ing를 사용합니다."},{"t":"choose","q":"다음 중 \u003c보기>의 밑줄 친 표현과 의미가 가장 가까운 것을 두 개 고르세요.","ref":"You [[cannot be too careful]] when you share personal information online.","opts":["It is impossible for you to be careful online.","You should be extremely careful because you can never be too careful.","Being careful online is totally unnecessary.","No matter how careful you are, it is still not enough.","You must avoid being careful on the internet."],"ans":[2,4],"exp":"cannot ~ too는 '아무리 ~해도 지나치지 않다'라는 의미이므로, 극도의 주의를 강조하는 ②번과 ④번이 정답이에요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"You [[had better submit]] the report by tomorrow.","hint":"(submit, report)"},"items":[{"scene":"🌧️☂️ 비가 쏟아지는 날씨에 우산을 챙기라고 충고하는 상황","pre":"You ","post":" an umbrella.","hint":"(take)","a":["had better take"]}],"exp":"'~하는 것이 좋다'라는 강한 충고를 나타낼 때는 'had better + 동사원형'을 사용하여 'You had better take an umbrella.'로 완성합니다."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"You [[may well be]] proud of your volunteering work.","ok":true,"right":[],"exp":"may well V는 '~하는 것도 당연하다'라는 의미로 조동사 뒤에 동사원형(be)이 올바르게 쓰였습니다."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ul(t){return esc(t).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");}
  function plain(t){return s(t).replace(/\[\[|\]\]/g,"");}
  function nz(t){return plain(t).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}
  function blank(t){return s(t).replace(/_{2,}|\(\s*\)|\[\s*\]/g,"____");}
  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){
    if(!x||typeof x!=="object")return null;
    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();
    if(t==="same"||t==="mcq")t="choose";
    if(t==="choose"){
      var opts=A(x.opts||x.options).map(s).filter(function(v){return v.trim();}).slice(0,8),ans=A(Array.isArray(x.ans)?x.ans:[x.ans]),seen={};
      ans=ans.map(function(n){return parseInt(n,10);}).filter(function(n){if(!(n>=1&&n<=opts.length)||seen[n])return false;seen[n]=1;return true;});
      if(opts.length<3||!ans.length)return null;
      return {t:t,q:q||(ans.length>1?"알맞은 것을 "+ans.length+"개 고르세요.":"알맞은 것을 고르세요."),ref:s(x.ref).trim(),opts:opts,ans:ans.sort(),exp:exp};}
    if(t==="fix"){
      var S=s(x.s||x.sentence).trim(),w=s(x.wrong).trim(),r=alts(x.right);
      if(!S||!w||S.indexOf(w)<0||!r.length)return null;
      return {t:t,q:q||"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.",s:S,wrong:w,right:r,exp:exp};}
    if(t==="bank"){
      var bank=A(x.bank).map(s).map(function(v){return v.trim();}).filter(Boolean),low=bank.map(function(v){return nz(v);});
      var its=A(x.items).map(function(it){var ss=blank(it&&it.s);var a=s(it&&it.a).trim(),k=low.indexOf(nz(a));
        if(ss.split("____").length!==2||k<0)return null;return {s:ss,a:bank[k]};}).filter(Boolean).slice(0,8);
      if(bank.length<2||its.length<2)return null;
      return {t:t,q:q||"빈칸에 알맞은 것을 <보기>에서 고르세요.",bank:bank,items:its,exp:exp};}
    if(t==="match"){
      var pr=A(x.pairs).map(function(p){return p&&s(p.l).trim()&&s(p.r).trim()?{l:s(p.l).trim(),r:s(p.r).trim()}:null;}).filter(Boolean).slice(0,7);
      if(pr.length<3)return null;
      return {t:t,q:q||"알맞은 것끼리 연결하세요.",pairs:pr,exp:exp};}
    if(t==="scene"){
      var ex=x.ex&&typeof x.ex==="object"?{s:s(x.ex.s).trim(),hint:s(x.ex.hint).trim()}:{s:"",hint:""};
      var sit=A(x.items).map(function(it){if(!it)return null;var a=alts(it.a);if(!a.length)return null;
        return {scene:s(it.scene).trim(),pre:s(it.pre),post:s(it.post),hint:s(it.hint).trim(),a:a};}).filter(Boolean).slice(0,3);
      if(!sit.length)return null;
      return {t:t,q:q||"상황을 보고 <보기>와 같이 문장을 완성하세요.",ex:ex,items:sit,exp:exp};}
    if(t==="order"){
      var ch=A(x.chunks).map(s).map(function(v){return v.trim();}).filter(Boolean).slice(0,8);
      if(ch.length<3)return null;
