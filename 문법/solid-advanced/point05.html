</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"챕터1 동사 Point06","title":"시제 완전 정복 — 부사구로 판단하고, 시제를 일치시키자","audioDir":"point05_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">솔리드 어법 실력 - 시제\u003c/div>\u003ch1>시제 완전 정복 — 부사구로 판단하고, 시제를 일치시키자\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>문장 속 부사(구)와 절의 종류를 근거로 알맞은 시제를 스스로 판단할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 시제를 주제로 공부해 볼 거예요. 문장 속에 있는 부사나 부사구를 보고 시제가 알맞은지 판단하는 방법, 그리고 시간이나 조건을 나타내는 부사절에서 시제를 어떻게 쓰는지를 배웁니다. 주절과 종속절의 시제를 맞추는 규칙과 그 예외까지 정리하면 오늘 목표는 끝나요. 그럼 차근차근 시작해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">과거시제와 현재완료시제는 부사(구)로 판단한다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">문장에 쓰인 \u003cb class=\"key\">부사(구)\u003c/b>를 보고 시제가 적절한지 판단한다. ago, yesterday, late ~, then, in + 연도처럼 명백한 과거를 나타내는 부사(구)가 있으면 \u003cb class=\"key\">과거시제\u003c/b>를 쓰고, since + 과거 시점, for + 기간, before 같은 완료시제 부사(구)와 함께 쓰면 \u003cb class=\"key\">현재완료시제\u003c/b>를 쓴다. 현재완료시제는 과거의 일이 현재까지 영향을 미칠 때 쓰므로 명백한 과거를 나타내는 부사(구)와는 함께 쓸 수 없다.\u003cdiv>\u003cspan class=\"g-formula\">과거 부사(구)(ago, yesterday, in + 연도) + 과거시제 / since + 과거 시점, for + 기간 + 현재완료시제\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Doctors (didn't operate / have not operated) on people \u003cspan class=\"fx\">only a few centuries ago\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">의사들은 불과 몇 세기 전만 해도 사람들을 수술하지 않았다.\u003c/div>\u003cdiv class=\"g-note\">과거를 나타내는 부사구 only a few centuries ago가 있으므로 과거시제 didn't operate를 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">have lived\u003c/span> in Busan for ten years.\u003c/div>\u003cdiv class=\"g-ko\">나는 부산에서 십 년째 살고 있다.\u003c/div>\u003cdiv class=\"g-note\">for + 기간은 완료시제 부사구이므로 현재완료시제 have lived를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재완료시제는 \u003cb class=\"key\">ago\u003c/b>, \u003cb class=\"key\">yesterday\u003c/b> 같은 명백한 \u003cb class=\"key\">과거\u003c/b> 부사(구)와 함께 쓸 수 없다.\u003c/div>","segs":[{"n":2,"text":"먼저 과거시제와 현재완료시제를 구별하는 방법부터 볼게요. 문장에 어떤 부사나 부사구가 들어 있는지 보면 시제를 결정할 수 있어요. ago나 yesterday, 그리고 in 다음에 연도가 오는 표현은 명백한 과거를 가리키니까 과거시제를 씁니다. 반대로 since 다음에 과거 시점이 오거나 for 다음에 기간이 오면 현재완료시제와 잘 어울려요. 그리고 현재완료시제는 과거의 일이 현재까지 영향을 미칠 때 쓰는 것이니까 명백한 과거를 나타내는 부사구와는 절대로 함께 쓸 수 없다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"이 문장을 한번 읽어 볼게요. Doctors didn't operate on people only a few centuries ago. 뜻은 의사들은 불과 몇 세기 전만 해도 사람들을 수술하지 않았다는 거예요. 여기서 눈여겨볼 부분은 바로 only a few centuries ago라는 부사구입니다. 과거를 확실히 가리키는 표현이 있으니까 과거시제 didn't operate를 써야 하고, have not operated는 답이 될 수 없어요.","hl":"ex-0"},{"n":4,"text":"보충 예문 하나 더 볼게요. I have lived in Busan for ten years. 나는 부산에서 십 년째 살고 있다는 뜻이에요. 여기에는 for ten years라는 기간 표현이 있죠. for 다음에 기간이 오면 현재완료시제와 함께 쓰는 게 자연스러우니까 have lived를 쓴 겁니다.","hl":"ex-1"},{"n":5,"text":"한 가지만 더 강조할게요. 현재완료시제는 ago나 yesterday처럼 명백하게 과거를 가리키는 부사구와 함께 쓸 수 없어요. 그래서 He has visited Jeju Island last year라고 쓰면 틀리고, He visited Jeju Island last year라고 써야 맞습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">시간·조건 부사절에서는 미래를 현재시제로 쓴다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">when, if처럼 \u003cb class=\"key\">시간\u003c/b>이나 \u003cb class=\"key\">조건\u003c/b>을 나타내는 부사절에서는 미래의 일도 현재시제나 \u003cb class=\"key\">현재완료시제\u003c/b>로 나타낸다. 반면 when이 이끄는 절이 명사절인 경우에는 미래시제를 그대로 쓴다. 즉 같은 when이라도 부사절인지 명사절인지에 따라 시제가 달라진다.\u003cdiv>\u003cspan class=\"g-formula\">when/if + 현재시제, 주절 + will (미래) / 명사절 when + will\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You can give this book to her when you (\u003cspan class=\"fx\">visit\u003c/span> / will visit) her tomorrow.\u003c/div>\u003cdiv class=\"g-ko\">너는 내일 그녀를 방문할 때 이 책을 그녀에게 줄 수 있다.\u003c/div>\u003cdiv class=\"g-note\">when이 이끄는 시간의 부사절에서는 미래의 일도 현재시제 visit으로 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We don't know when this war \u003cspan class=\"fx\">will end\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 이 전쟁이 언제 끝날지 모른다.\u003c/div>\u003cdiv class=\"g-note\">when이 이끄는 절이 명사절인 경우에는 미래시제 will end를 그대로 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>when절이 \u003cb class=\"key\">부사절\u003c/b>이면 현재시제, \u003cb class=\"key\">명사절\u003c/b>이면 미래시제를 쓴다.\u003c/div>","segs":[{"n":6,"text":"이번에는 시간과 조건을 나타내는 부사절을 볼게요. when이나 if가 이끄는 부사절 안에서는 미래의 일이라도 미래시제를 쓰지 않고 현재시제나 현재완료시제로 나타냅니다. 그래서 내일 일어날 일이어도 when절 안에는 visit처럼 현재시제를 써 주는 거예요. 하지만 같은 when이라도 명사절로 쓰이면 이야기가 달라집니다. 이때는 미래시제를 그대로 써도 되니까, 그 절이 부사절인지 명사절인지 먼저 따져 보세요.","hl":"rule"},{"n":7,"text":"이 문장을 읽어 볼게요. You can give this book to her when you visit her tomorrow. 뜻은 너는 내일 그녀를 방문할 때 이 책을 그녀에게 줄 수 있다는 거예요. 내일 일어날 일이지만 when이 이끄는 시간의 부사절 안에서는 미래시제를 쓰지 않고 현재시제 visit을 씁니다. 그래서 will visit은 답이 아니에요.","hl":"ex-0"},{"n":8,"text":"비교해서 이 문장도 볼게요. We don't know when this war will end. 우리는 이 전쟁이 언제 끝날지 모른다는 뜻입니다. 여기서 when은 언제인지를 담고 있는 명사절을 이끌죠. 명사절일 때는 미래시제를 그대로 써도 되니까 will end를 쓰는 거예요.","hl":"ex-1"},{"n":9,"text":"헷갈리기 쉬운 부분이 하나 있어요. 같은 when이라도 시간을 나타내는 부사절이면 현재시제를 쓰고, 언제인지를 담은 명사절이면 미래시제를 그대로 씁니다. We don't know when this war will end가 그 예예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">주절의 시제에 맞게 종속절의 시제를 일치시킨다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주절의 시제에 맞게 \u003cb class=\"key\">종속절\u003c/b>의 시제를 \u003cb class=\"key\">일치\u003c/b>시킨다. 주절이 과거시제이면 종속절도 과거시제로 맞춰 쓰고, 이때 미래의 뜻은 \u003cb class=\"key\">would\u003c/b> 같은 과거 조동사로 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주절 과거시제 + that절 (would + 동사원형)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Mom told him that he (will / \u003cspan class=\"fx\">would\u003c/span>) have to say goodbye to his friends.\u003c/div>\u003cdiv class=\"g-ko\">엄마는 그에게 친구들에게 작별 인사를 해야 할 거라고 말했다.\u003c/div>\u003cdiv class=\"g-note\">주절이 과거시제 told이므로 종속절도 과거시제의 조동사 would를 써야 한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절이 \u003cb class=\"key\">과거\u003c/b>이면 종속절의 미래 표현은 \u003cb class=\"key\">would\u003c/b>로 바꾼다.\u003c/div>","segs":[{"n":10,"text":"이제 주절과 종속절의 시제를 맞추는 규칙을 알아볼게요. 주절이 과거시제라면 종속절도 과거시제로 맞춰 주는 것이 기본입니다. 이때 종속절에 미래의 뜻이 필요하면 will 대신 과거 조동사 would를 씁니다. 그래서 엄마가 말했다는 문장에서는 told라는 과거시제에 맞춰 that절 안에도 would를 써 주는 거예요. 주절의 시제가 기준이 된다는 것만 기억하면 어렵지 않아요.","hl":"rule"},{"n":11,"text":"이 문장을 읽어 볼게요. Mom told him that he would have to say goodbye to his friends. 뜻은 엄마는 그에게 친구들에게 작별 인사를 해야 할 거라고 말했다는 거예요. 주절의 told가 과거시제니까 종속절도 과거 조동사 would로 맞춰 줍니다. will을 그대로 쓰면 시제가 어긋나요.","hl":"ex-0"},{"n":12,"text":"정리하면, 주절이 과거시제면 종속절의 미래 표현은 will이 아니라 would로 바꿔 준다고 기억하세요. 시제 일치 문제에서 가장 자주 나오는 포인트입니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">시제 일치의 예외 — 역사적 사실과 불변의 진리\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주절의 시제에 관계없이 \u003cb class=\"key\">역사적 사실\u003c/b>은 과거시제로, \u003cb class=\"key\">불변의 진리\u003c/b>와 일반적·과학적 사실은 현재시제로 쓴다. 그래서 주절이 과거시제라도 that절의 내용이 \u003cb class=\"key\">과학적 사실\u003c/b>이면 현재시제를 그대로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">주절 과거 + that + 역사적 사실(과거시제) / 불변의 진리·과학적 사실(현재시제)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The ancient Greeks knew that the Moon (\u003cspan class=\"fx\">reflects\u003c/span> / reflected) light from the Sun.\u003c/div>\u003cdiv class=\"g-ko\">고대 그리스인들은 달이 태양의 빛을 반사한다는 것을 알고 있었다.\u003c/div>\u003cdiv class=\"g-note\">that절의 내용이 과학적 사실에 해당하므로 주절의 시제(knew)와 관계없이 현재시제 reflects를 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Our teacher told us that water \u003cspan class=\"fx\">boils\u003c/span> at 100 degrees Celsius.\u003c/div>\u003cdiv class=\"g-ko\">우리 선생님은 물이 섭씨 100도에서 끓는다고 우리에게 말씀하셨다.\u003c/div>\u003cdiv class=\"g-note\">불변의 진리·과학적 사실은 주절이 과거시제(told)여도 현재시제 boils를 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>역사적 사실은 \u003cb class=\"key\">과거시제\u003c/b>, 과학적 사실은 \u003cb class=\"key\">현재시제\u003c/b>를 쓴다.\u003c/div>","segs":[{"n":13,"text":"그런데 시제 일치에도 예외가 있어요. 주절의 시제와 상관없이 역사적 사실은 과거시제로, 불변의 진리나 일반적이고 과학적인 사실은 현재시제로 씁니다. 달이 태양 빛을 반사한다는 것은 과학적 사실이니까, 주절이 knew라는 과거시제여도 that절 안에는 현재시제 reflects를 쓰는 거예요. 시험에서는 이런 예외를 특히 좋아하니까 꼭 기억해 두세요.","hl":"rule"},{"n":14,"text":"이 문장을 읽어 볼게요. The ancient Greeks knew that the Moon reflects light from the Sun. 뜻은 고대 그리스인들은 달이 태양의 빛을 반사한다는 것을 알고 있었다는 거예요. 주절은 knew로 과거지만, 달이 빛을 반사한다는 내용은 언제나 변하지 않는 과학적 사실이죠. 그래서 현재시제 reflects를 그대로 씁니다.","hl":"ex-0"},{"n":15,"text":"보충 예문도 하나 볼게요. Our teacher told us that water boils at 100 degrees Celsius. 우리 선생님은 물이 섭씨 100도에서 끓는다고 우리에게 말씀하셨다는 뜻이에요. 주절이 told로 과거지만 물이 끓는 온도는 변하지 않는 사실이니까 현재시제 boils를 씁니다.","hl":"ex-1"},{"n":16,"text":"시험에서는 역사적 사실과 과학적 사실을 섞어서 함정을 만들기도 해요. that절의 내용이 언제나 변하지 않는 사실인지 먼저 판단하고 시제를 고르세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He has visited Jeju Island last year.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He visited Jeju Island last year.\u003c/div>\u003cdiv class=\"g-why\">last year는 명백한 과거를 나타내는 부사구라서 현재완료시제와 함께 쓸 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I will call you when I will arrive.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I will call you when I arrive.\u003c/div>\u003cdiv class=\"g-why\">when이 이끄는 시간의 부사절에서는 미래의 일도 현재시제로 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She said that she will come.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She said that she would come.\u003c/div>\u003cdiv class=\"g-why\">주절이 과거시제(said)이므로 종속절도 과거 조동사 would를 써야 한다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"이 문장을 볼게요. He has visited Jeju Island last year라고 쓰면 틀린 문장이에요. last year는 명백한 과거를 가리키는 부사구니까 현재완료시제와 함께 쓸 수 없습니다. 그래서 He visited Jeju Island last year라고 과거시제로 고쳐 써야 해요.","hl":"mk-0"},{"n":18,"text":"다음 문장도 자주 틀려요. I will call you when I will arrive라고 쓰면 어색한 문장이 됩니다. when이 이끄는 시간의 부사절에서는 미래의 일이라도 현재시제로 나타내니까 when I arrive라고 써야 맞아요.","hl":"mk-1"},{"n":19,"text":"마지막으로 이 문장을 보세요. She said that she will come이라고 쓰면 시제가 어긋납니다. 주절의 said가 과거시제니까 종속절도 would를 써서 She said that she would come이라고 해야 맞아요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Doctors (didn't operate / have not operated) on people only a few centuries ago.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>didn't operate\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>have not operated\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">didn't operate\u003c/span>\u003cdiv class=\"g-exp\">only a few centuries ago라는 과거를 나타내는 부사구가 있으므로 과거시제를 써야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"첫 번째 문제입니다. Doctors didn't operate on people only a few centuries ago와 Doctors have not operated on people only a few centuries ago 중에서 알맞은 것을 고르세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":6},{"n":22,"text":"정답은 첫 번째, didn't operate예요. only a few centuries ago라는 과거를 나타내는 부사구가 있으니까 과거시제를 써야 합니다. have not operated는 현재완료시제라서 명백한 과거 부사구와 함께 쓸 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">You can give this book to her when you (visit / will visit) her tomorrow.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>visit\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>will visit\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">visit\u003c/span>\u003cdiv class=\"g-exp\">when이 이끄는 시간의 부사절에서는 미래의 일도 현재시제로 나타내므로 visit을 쓴다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"두 번째 문제입니다. You can give this book to her when you visit her tomorrow와 You can give this book to her when you will visit her tomorrow 중에서 알맞은 것을 고르세요. 잠시 멈추고 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 첫 번째, visit입니다. when이 이끄는 시간의 부사절에서는 미래의 일도 현재시제로 나타내니까 will visit이 아니라 visit을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에서 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">Mom told him that he (will / would) have to say goodbye to his friends.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>will\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>would\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would\u0 -show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"마지막 문제입니다. We will leave as soon as the rain 다음에 stop을 알맞은 형태로 넣어 보세요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 stops입니다. as soon as도 시간을 나타내는 부사절을 이끌기 때문에 미래의 일이라도 현재시제로 써 줍니다. 그래서 will stop이 아니라 stops가 들어가요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">솔리드 어법 실력 - 시제\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>ago, yesterday, in + 연도 같은 명백한 \u003cb class=\"key\">과거\u003c/b> 부사(구)가 있으면 \u003cb class=\"key\">과거시제\u003c/b>를 쓴다.\u003c/li>\u003cli>현재완료시제는 명백한 \u003cb class=\"key\">과거\u003c/b> 부사(구)와 함께 쓸 수 없고, \u003cb class=\"key\">since\u003c/b> + 과거 시점이나 \u003cb class=\"key\">for\u003c/b> + 기간과 함께 쓴다.\u003c/li>\u003cli>when, if가 이끄는 \u003cb class=\"key\">시간\u003c/b>·\u003cb class=\"key\">조건\u003c/b> 부사절에서는 미래의 일도 \u003cb class=\"key\">현재시제\u003c/b>로 나타낸다.\u003c/li>\u003cli>주절이 과거시제이면 \u003cb class=\"key\">종속절\u003c/b>도 과거시제로 맞추고, 미래의 뜻은 \u003cb class=\"key\">would\u003c/b>로 나타낸다.\u003c/li>\u003cli>역사적 사실은 과거시제, \u003cb class=\"key\">불변의 진리\u003c/b>와 과학적 사실은 \u003cb class=\"key\">현재시제\u003c/b>를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":38,"text":"오늘 배운 내용을 정리해 볼게요. 문장에 ago나 yesterday 같은 명백한 과거 부사구가 있으면 과거시제를 쓰고, since나 for가 있으면 현재완료시제를 쓴다는 점 기억하시죠? 시간과 조건을 나타내는 부사절에서는 미래의 일도 현재시제로 쓰고, 주절이 과거면 종속절도 과거로 맞춰 주면 됩니다. 역사적 사실은 과거시제, 과학적 사실은 현재시제라는 예외까지 꼭 챙겨 가세요. 오늘도 수고 많았어요, 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
