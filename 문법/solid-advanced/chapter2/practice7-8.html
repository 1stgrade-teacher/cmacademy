  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;

    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};

  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;

}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 2 Basic Practice (포인트 7-8)","audioDir":"practice7-8_audio","preview":false,"count":68,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">to부정사와 동명사(주어·목적어·의미 차이), 명령문 어법\u003c/div>\u003ch1>to부정사와 동명사 선택 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 옳고 틀림 판정, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 챕터 투 베이직 프랙티스, 포인트 칠과 팔에 해당하는 to부정사와 동명사 문제를 풀어 볼 거예요. 선택지 문제부터 문장 오류 수정, 지문 어법까지 순서대로 함께 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어·보어 자리의 동명사와 to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어나 주격 보어 자리에는 동사원형이 올 수 없고, \u003cb class=\"key\">동명사\u003c/b>나 \u003cb class=\"key\">to부정사\u003c/b>를 씁니다. 동명사구가 주어이면 \u003cb class=\"key\">단수 동사\u003c/b>로 받습니다.\u003cdiv>\u003cspan class=\"g-formula\">동명사구/To부정사구 + 단수 동사 / 주어 + be + 동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>문장 주어 자리에서 동사원형은 불가\u003c/li>\u003cli>동명사 주어는 단수 취급\u003c/li>\u003cli>be동사 뒤 보어에도 동명사 가능\u003c/li>\u003cli>to부정사와 동명사 모두 주어 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Swimming is good exercise.\u003c/div>\u003cdiv class=\"g-ko\">수영은 좋은 운동이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">To learn a language takes time.\u003c/div>\u003cdiv class=\"g-ko\">언어를 배우는 데는 시간이 걸린다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">My hobby is traveling.\u003c/div>\u003cdiv class=\"g-ko\">내 취미는 여행하는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 주어와 보어 자리를 볼게요. 영어 문장에서 주어 자리에는 동사원형이 그대로 올 수 없고, 동명사나 to부정사가 와야 해요. 예를 들어 Swimming is good exercise에서 Swimming은 동명사 주어이고, 단수 동사 is와 짝을 이룹니다. To learn a language takes time처럼 to부정사구가 주어가 될 수도 있어요. be동사 뒤 보어 자리에서도 동명사가 자연스럽게 쓰인다는 점도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cspan class=\"p-box\">\u003cspan>Believe\u003c/span>\u003ci>/\u003c/i>\u003cspan>To believe\u003c/span>\u003c/span> what you see is not yet believing what is true.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">Believe\u003c/div>\u003cdiv class=\"p-op\">To believe\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">To believe\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 보는 것을 믿는 것과 진실을 믿는 것을 비교하는 문장이에요. 네모 안의 두 표현 중에서 is 앞의 주어 자리에 무엇이 와야 하는지 먼저 찾아보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 To believe예요. is 앞의 주어 자리에는 동사원형이 올 수 없고, to부정사구가 주어로 쓰였습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cspan class=\"p-box\">\u003cspan>Believe\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">To believe\u003c/span>\u003c/span> what you see is not yet believing what is true.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">Believe\u003c/div>\u003cdiv class=\"p-op\">To believe\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 자리 찾기\u003c/b>is 앞의 \u003cb class=\"key\">To believe what you see\u003c/b>가 주어이고, 주어 자리에는 동사원형 \u003cb class=\"key\">Believe\u003c/b>가 올 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">보어 확인\u003c/b>is 뒤의 \u003cb class=\"key\">believing\u003c/b>은 동명사 보어로 자연스럽게 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 To believe\u003c/span>\u003cdiv class=\"p-full\">To believe what you see is not yet believing what is true.\u003c/div>\u003cdiv class=\"p-ko\">보는 것을 믿는 것은 아직 진실을 믿는 것이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어 자리라고 해서 동사원형 Believe를 그대로 쓰는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 is 앞을 보면 what you see가 붙어 있는데, 이 전체가 문장의 주어 자리예요. 주어 자리에는 동사원형을 그대로 쓸 수 없으니 to부정사 형태를 골라야 합니다.","hl":"st-0"},{"n":7,"text":"그다음 is 뒤를 보면 believing이 동명사로 쓰여서 진실을 믿는 것이라는 의미를 만들고 있어요. 그래서 앞에는 To believe가 와야 합니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. 주어 자리라고 해서 동사원형 Believe를 그대로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사만 / to부정사만 취하는 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사마다 목적어로 오는 형태가 정해져 있습니다. \u003cb class=\"key\">give up, finish, enjoy, avoid\u003c/b>는 동명사를, \u003cb class=\"key\">refuse, manage, decide, want, hope\u003c/b>는 to부정사를 취합니다.\u003cdiv>\u003cspan class=\"g-formula\">give up/finish + -ing / refuse/manage/decide + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>give up은 동명사 목적어\u003c/li>\u003cli>refuse/manage/decide는 to부정사 목적어\u003c/li>\u003cli>finish는 동명사 목적어\u003c/li>\u003cli>동사별 암기 필요\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I gave up smoking.\u003c/div>\u003cdiv class=\"g-ko\">나는 담배를 끊었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She refused to answer.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 대답하기를 거부했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He finished writing the report.\u003c/div>\u003cdiv class=\"g-ko\">그는 보고서 쓰기를 끝냈다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">We decided to leave early.\u003c/div>\u003cdiv class=\"g-ko\">우리는 일찍 떠나기로 결정했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이번에는 동사 뒤에 오는 목적어 형태를 정리해 볼게요. give up, finish, enjoy, avoid 같은 동사들은 뒤에 동명사를 취해요. 반대로 refuse, manage, decide, want, hope 같은 동사들은 to부정사를 목적어로 가집니다. 그래서 give up finding처럼 동명사를 쓰고, refuse to accept나 decide to publish처럼 to부정사를 써야 해요. 동사 하나하나의 짝을 묶어서 외워 두면 선택지 문제에서 바로 답이 보입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Despite the difficulties, I won't give up \u003cspan class=\"p-box\">\u003cspan>to find\u003c/span>\u003ci>/\u003c/i>\u003cspan>finding\u003c/span>\u003c/span> the solution to it.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to find\u003c/div>\u003cdiv class=\"p-op\">finding\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">finding\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 give up 뒤에 무엇이 오는지 묻고 있어요. give up의 목적어 형태를 떠올려 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 finding입니다. give up은 뒤에 동명사를 취하는 표현이라서 finding이 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Despite the difficulties, I won't give up \u003cspan class=\"p-box\">\u003cspan>to find\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">finding\u003c/span>\u003c/span> the solution to it.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to find\u003c/div>\u003cdiv class=\"p-op\">finding\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사구 확인\u003c/b>\u003cb class=\"key\">give up\u003c/b>은 뒤에 \u003cb class=\"key\">동명사\u003c/b>를 목적어로 취하는 표현입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">의미 확인\u003c/b>해결책을 \u003cb class=\"key\">찾는 것\u003c/b>을 포기하지 않는다는 의미이므로 finding이 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 finding\u003c/span>\u003cdiv class=\"p-full\">Despite the difficulties, I won't give up finding the solution to it.\u003c/div>\u003cdiv class=\"p-ko\">어려움에도 불구하고 나는 그것에 대한 해결책을 찾는 것을 포기하지 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>give up 뒤에 to부정사를 쓰는 실수\u003c/div>","segs":[{"n":13,"text":"give up은 포기하다라는 뜻의 구동사로, 뒤에 동명사가 와야 하는 표현이에요. 그래서 to부정사가 아니라 finding 형태를 골라야 합니다.","hl":"st-0"},{"n":14,"text":"문장 전체는 어려움에도 불구하고 해결책을 찾는 것을 포기하지 않겠다는 뜻이에요. 의미와 형태가 모두 finding과 잘 맞습니다.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. give up 뒤에 to부정사를 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">forget·regret의 to부정사와 동명사 의미 차이\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">forget/regret + to부정사\u003c/b>는 앞으로 할 일이나 유감을 알리는 의미이고, \u003cb class=\"key\">forget/regret + 동명사\u003c/b>는 과거에 한 일을 잊거나 후회하는 의미입니다.\u003cdiv>\u003cspan class=\"g-formula\">forget/regret + to + 동사원형 = 앞으로 할 일·유감 표시 / forget/regret + -ing = 과거의 일\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>forget to pack = 챙길 일을 잊지 않다\u003c/li>\u003cli>regret to tell = 유감스럽게 알리다\u003c/li>\u003cli>regret -ing = 한 일을 후회하다\u003c/li>\u003cli>시간 표현으로 의미 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Don't forget to lock the door.\u003c/div>\u003cdiv class=\"g-ko\">문 잠그는 것을 잊지 마라.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I regret telling him the secret.\u003c/div>\u003cdiv class=\"g-ko\">그에게 비밀을 말한 것을 후회한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">We regret to tell you the news.\u003c/div>\u003cdiv class=\"g-ko\">유감스럽게도 그 소식을 알려 드립니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"forget과 regret은 뒤에 무엇이 오느냐에 따라 의미가 달라져요. forget to pack은 앞으로 차 키트를 챙길 일을 잊지 말라는 뜻이고, regret to tell은 유감스럽게도 알려 드린다는 뜻이에요. 반대로 동명사가 오면 이미 한 일을 잊거나 후회하는 의미가 됩니다. 그래서 문장의 시간 표현과 전체 상황을 함께 보면서 to부정사인지 동명사인지 판단해야 해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Before you go, don't forget \u003cspan class=\"p-box\">\u003cspan>to pack\u003c/span>\u003ci>/\u003c/i>\u003cspan>packing\u003c/span>\u003c/span> your winter car emergency kit.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to pack\u003c/div>\u003cdiv class=\"p-op\">packing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to pack\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"세 번째 문제는 forget 뒤에 to부정사가 오는지 동명사가 오는지가 핵심이에요. 가기 전이라는 시간 표현에 주목해 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 to pack입니다. 앞으로 차 키트를 챙길 일을 잊지 말라는 뜻이므로 forget to부정사가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-ta cu class=\"p-u\">Have\u003c/u> a strong desire to improve your skills can keep you motivated.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) learning 또는 to learn (2) Choose (3) Having 또는 To have\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":54,"text":"이제 지문형 문제입니다. 각 밑줄이 주어 자리인지, 명령문으로 시작해야 하는 자리인지 구분하면서 문장 구조를 보세요.","hl":"q"},{"n":55,"text":"","hl":"q","pause":7},{"n":56,"text":"정답은 첫 번째 learning 또는 to learn, 두 번째 Choose, 세 번째 Having 또는 To have입니다. 주어 자리는 동명사나 to부정사로, 명령문은 동사원형으로 고치는 것이 핵심이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Whether you want to join your school's band, have dreams of being a professional musician, or just want a new hobby, (1) \u003cu class=\"p-u\">learn\u003c/u> to play an instrument is a rewarding activity. (2) \u003cu class=\"p-u\">Choosing\u003c/u> an instrument that you want to play and learn music you enjoy. (3) \u003cu class=\"p-u\">Have\u003c/u> a strong desire to improve your skills can keep you motivated.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 주어 확인\u003c/b>Whether절 뒤에서 is의 주어는 \u003cb class=\"key\">learn to play an instrument\u003c/b>에 해당하므로, 동사원형 \u003cb class=\"key\">learn\u003c/b>을 동명사 \u003cb class=\"key\">learning\u003c/b> 또는 to부정사 \u003cb class=\"key\">to learn\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 명령문 확인\u003c/b>Choosing 이하에는 문장을 이끄는 주어와 동사가 없으므로 \u003cb class=\"key\">Choose\u003c/b>로 시작하는 명령문으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 주어 확인\u003c/b>can keep의 주어는 \u003cb class=\"key\">Have a strong desire to improve your skills\u003c/b> 전체이므로 동사원형 Have를 동명사 \u003cb class=\"key\">Having\u003c/b> 또는 to부정사 \u003cb class=\"key\">To have\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) learning 또는 to learn (2) Choose (3) Having 또는 To have\u003c/span>\u003cdiv class=\"p-full\">Whether you want to join your school's band, have dreams of being a professional musician, or just want a new hobby, learning to play an instrument is a rewarding activity. Choose an instrument that you want to play and learn music you enjoy. Having a strong desire to improve your skills can keep you motivated.\u003c/div>\u003cdiv class=\"p-ko\">학교 밴드에 들어가고 싶든, 전문 음악가가 되고 싶든, 아니면 새 취미를 원하든, 악기를 배우는 것은 보람 있는 활동이다. 연주하고 싶은 악기를 고르고 네가 즐기는 음악을 배워라. 기술을 향상시키려는 강한 열망을 갖는 것이 동기를 유지하게 해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>주어 자리와 명령문 자리를 구별하지 않고 모두 동명사로 바꾸는 실수\u003c/div>","segs":[{"n":57,"text":"첫 번째 밑줄은 is 앞의 주어 자리예요. 동사원형 learn은 주어가 될 수 없으니 learning이나 to learn으로 고쳐야 합니다.","hl":"st-0"},{"n":58,"text":"두 번째는 밑줄 친 Choosing으로 시작하는 부분이 완전한 문장인지 봐야 해요. 주어와 동사가 없으니 동사원형 Choose로 시작하는 명령문으로 바꿔 줍니다.","hl":"st-1"},{"n":59,"text":"세 번째도 can keep 앞의 주어 자리예요. 강한 의욕을 갖는 것이 주어가 되므로 Having이나 To have로 고쳐야 합니다.","hl":"st-2"},{"n":60,"text":"이 문제의 함정도 짚고 갈게요. 주어 자리와 명령문 자리를 구별하지 않고 모두 동명사로 바꾸는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">I got a scholarship to learn how to write a book, and out of those three months, I managed (1) \u003cu class=\"p-u\">finishing\u003c/u> a novel. When I finished (2) \u003cu class=\"p-u\">to write\u003c/u> my first novel, I asked for my writing teacher's recommendation and sent the manuscript to one of the big publishers in the country. They liked it and decided (3) \u003cu class=\"p-u\">publishing\u003c/u> it.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) to finish (2) writing (3) to publish\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":61,"text":"마지막 지문은 manage, finish, decide 뒤에 어떤 목적어 형태가 오는지 묻고 있어요. 각 동사가 동명사를 좋아하는지 to부정사를 좋아하는지 떠올려 보세요.","hl":"q"},{"n":62,"text":"","hl":"q","pause":7},{"n":63,"text":"정답은 첫 번째 to finish, 두 번째 writing, 세 번째 to publish입니다. manage와 decide는 to부정사, finish는 동명사를 목적어로 취해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">I got a scholarship to learn how to write a book, and out of those three months, I managed (1) \u003cu class=\"p-u\">finishing\u003c/u> a novel. When I finished (2) \u003cu class=\"p-u\">to write\u003c/u> my first novel, I asked for my writing teacher's recommendation and sent the manuscript to one of the big publishers in the country. They liked it and decided (3) \u003cu class=\"p-u\">publishing\u003c/u> it.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) manage 확인\u003c/b>\u003cb class=\"key\">manage\u003c/b>는 목적어로 to부정사를 취하므로 \u003cb class=\"key\">finishing\u003c/b>을 \u003cb class=\"key\">to finish\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) finish 확인\u003c/b>\u003cb class=\"key\">finish\u003c/b>는 목적어로 동명사를 취하므로 \u003cb class=\"key\">to write\u003c/b>를 \u003cb class=\"key\">writing\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) decide 확인\u003c/b>\u003cb class=\"key\">decide\u003c/b>는 목적어로 to부정사를 취하므로 \u003cb class=\"key\">publishing\u003c/b>을 \u003cb class=\"key\">to publish\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) to finish (2) writing (3) to publish\u003c/span>\u003cdiv class=\"p-full\">I got a scholarship to learn how to write a book, and out of those three months, I managed to finish a novel. When I finished writing my first novel, I asked for my writing teacher's recommendation and sent the manuscript to one of the big publishers in the country. They liked it and decided to publish it.\u003c/div>\u003cdiv class=\"p-ko\">나는 책 쓰는 법을 배우기 위해 장학금을 받았고, 그 석 달 동안 소설 한 편을 끝낼 수 있었다. 첫 소설 쓰기를 마쳤을 때, 나는 글쓰기 선생님의 추천서를 부탁하고 원고를 국내의 큰 출판사 중 한 곳에 보냈다. 그들은 그것을 좋아했고 출판하기로 결정했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>manage, decide 뒤에 동명사를 쓰거나 finish 뒤에 to부정사를 쓰는 실수\u003c/div>","segs":[{"n":64,"text":"첫 번째는 managed 뒤의 목적어 형태를 보는 문제예요. manage는 to부정사를 목적어로 취하므로 finishing을 to finish로 고칩니다.","hl":"st-0"},{"n":65,"text":"두 번째는 finished 뒤를 봐야 해요. finish는 동명사를 목적어로 취하는 동사라서 to write가 아니라 writing이 맞습니다.","hl":"st-1"},{"n":66,"text":"세 번째는 decided 뒤예요. decide는 to부정사를 목적어로 취하므로 publishing을 to publish로 고쳐야 합니다.","hl":"st-2"},{"n":67,"text":"이 문제의 함정도 짚고 갈게요. manage, decide 뒤에 동명사를 쓰거나 finish 뒤에 to부정사를 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사와 동명사(주어·목적어·의미 차이), 명령문 어법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어 자리에는 동사원형이 올 수 없고 \u003cb class=\"key\">동명사\u003c/b>나 \u003cb class=\"key\">to부정사\u003c/b>를 씁니다.\u003c/li>\u003cli>\u003cb class=\"key\">give up, finish\u003c/b>는 동명사, \u003cb class=\"key\">refuse, manage, decide\u003c/b>는 to부정사를 목적어로 취합니다.\u003c/li>\u003cli>\u003cb class=\"key\">forget/regret + to부정사\u003c/b>와 \u003cb class=\"key\">forget/regret + 동명사\u003c/b>는 의미가 달라집니다.\u003c/li>\u003cli>주어와 동사가 없는 \u003cb class=\"key\">to부정사구\u003c/b>는 \u003cb class=\"key\">명령문\u003c/b>으로 고쳐 완전한 문장을 만듭니다.\u003c/li>\u003c/ul>","segs":[{"n":68,"text":"오늘은 to부정사와 동명사가 주어, 보어, 목적어 자리에서 어떻게 달라지는지 확인했어요. 동사별로 목적어 형태를 묶어 외우고, forget과 regret은 의미 차이까지 꼭 챙겨 두세요. 명령문과 to부정사구를 구별하는 눈도 함께 길러 두면 좋겠습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
