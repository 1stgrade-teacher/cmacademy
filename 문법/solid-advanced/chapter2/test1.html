old out\u003c/b>을 넣어 '매진될 가능성이 높다'로 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 be sold out\u003c/span>\u003cdiv class=\"p-full\">The flight tickets are likely to be sold out quickly, so you should book in advance.\u003c/div>\u003cdiv class=\"p-ko\">항공권은 곧 매진될 가능성이 높으니 미리 예약해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>likely to 뒤에 과거분사 sold out만 그대로 쓰는 실수\u003c/div>","segs":[{"n":6,"text":"likely to 뒤에는 동사원형이 와야 해요. 그래서 sold out만 덩그러니 쓰면 문장이 어색해집니다.","hl":"st-0"},{"n":7,"text":"항공권은 누군가에게 팔리는 대상이죠. 그래서 be sold out 형태로 매진된 상태를 표현해야 합니다.","hl":"st-1"},{"n":8,"text":"두 조건을 합치면 be sold out이 정답입니다. 해석은 매진될 가능성이 높다는 뜻이 됩니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. likely to 뒤에 과거분사 sold out만 그대로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사와 동명사의 의미 차이\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">forget, remember, stop 뒤에 \u003cb class=\"key\">to부정사\u003c/b>가 오면 앞으로 할 일, \u003cb class=\"key\">동명사\u003c/b>가 오면 이미 한 일이나 진행 중인 일을 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">forget/remember to do = 할 일을 잊다/기억하다 / forget/remember doing = 한 일을 잊다/기억하다 / stop to do = ~하러 멈추다 / stop doing = ~하는 것을 멈추다\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>forget to eat = 먹을 것을 잊다\u003c/li>\u003cli>remember to do = 앞으로 할 일을 기억하다\u003c/li>\u003cli>stop singing = 노래하는 것을 멈추다\u003c/li>\u003cli>문맥의 시간 관계를 먼저 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He forgot \u003cspan class=\"fx\">to eat\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 먹는 것을 잊었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I remember \u003cspan class=\"fx\">meeting\u003c/span> her.\u003c/div>\u003cdiv class=\"g-ko\">나는 그녀를 만난 것을 기억한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에는 to부정사와 동명사의 의미 차이를 정리해 볼게요. forget to eat은 앞으로 먹어야 할 일을 잊었다는 뜻이고, forget eating은 이미 먹은 사실을 잊었다는 뜻이에요. remember도 remember to do면 해야 할 일을 기억하다, remember doing이면 한 일을 기억하다가 됩니다. stop은 stop to do가 하러 멈추다, stop doing이 하는 동작을 멈추다로 갈려요. 그래서 문장의 시간 관계와 문맥을 먼저 보는 습관이 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He was so absorbed in his work that he forgot \u003cspan class=\"p-box\">\u003cspan>to eat\u003c/span>\u003ci>/\u003c/i>\u003cspan>eating\u003c/span>\u003c/span> and would sometimes fast all day.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to eat\u003c/div>\u003cdiv class=\"p-op\">eating\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to eat\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 forget 뒤에 to부정사가 오는지 동명사가 오는지 묻고 있어요. 실제로 먹었는지, 먹어야 할 일을 잊었는지를 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 to eat이에요. 여기서는 먹어야 할 일을 잊었다는 뜻이므로 forget to eat을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He was so absorbed in his work that he forgot \u003cspan class=\"p-box\">\u003cspan class=\"ok\">to eat\u003c/span>\u003ci>/\u003c/i>\u003cspan>eating\u003c/span>\u003c/span> and would sometimes fast all day.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to eat\u003c/div>\u003cdiv clas 03c/span> uncomfortable. Therefore, \u003cspan class=\"p-box\">\u003cspan>overcome\u003c/span>\u003ci>/\u003c/i>\u003cspan>overcoming\u003c/span>\u003c/span> your instinct to avoid uncomfortable things at first is essential.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">to be\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003cdiv class=\"p-op\">overcome\u003c/div>\u003cdiv class=\"p-op\">overcoming\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">being, overcoming\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"다섯 번째 문제는 avoid 뒤와 문장 주어 자리에 어떤 형태가 와야 하는지 묻고 있어요. 동명사가 필요한 자리를 찾아보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":7},{"n":37,"text":"정답은 being과 overcoming이에요. avoid 뒤에는 동명사가 오고, 두 번째 빈칸은 문장의 주어 자리라서 동명사 overcoming이 필요합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">You are actively shutting out success because you want to avoid \u003cspan class=\"p-box\">\u003cspan>to be\u003c/span>\u003ci>/\u003c/i>\u003cspan>being\u003c/span>\u003c/span> uncomfortable. Therefore, \u003cspan class=\"p-box\">\u003cspan>overcome\u003c/span>\u003ci>/\u003c/i>\u003cspan>overcoming\u003c/span>\u003c/span> your instinct to avoid uncomfortable things at first is essential.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">to be\u003c/div>\u003cdiv class=\"p-op\">being\u003c/div>\u003cdiv class=\"p-op\">overcome\u003c/div>\u003cdiv class=\"p-op\">overcoming\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">avoid 뒤 확인\u003c/b>avoid는 목적어로 \u003cb class=\"key\">동명사\u003c/b>를 쓰므로 being이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주어 자리 확인\u003c/b>두 번째 빈칸은 문장의 주어 자리이므로 동명사 \u003cb class=\"key\">overcoming\u003c/b>이 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">전체 구조\u003c/b>Overcoming your instinct ... is essential은 '본능을 극복하는 것은 필수적이다'라는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 being, overcoming\u003c/span>\u003cdiv class=\"p-full\">You are actively shutting out success because you want to avoid being uncomfortable. Therefore, overcoming your instinct to avoid uncomfortable things at first is essential.\u003c/div>\u003cdiv class=\"p-ko\">당신은 불편함을 피하고 싶어서 성공을 적극적으로 차단하고 있다. 그러므로 처음에 불편한 것을 피하려는 본능을 극복하는 것이 필수적이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>avoid 뒤에 to부정사를 쓰거나 주어 자리에 동사원형을 쓰는 실수\u003c/div>","segs":[{"n":38,"text":"avoid는 뒤에 동명사를 쓰는 동사예요. 그래서 to be가 아니라 being이 와야 합니다.","hl":"st-0"},{"n":39,"text":"두 번째 빈칸은 문장 전체의 주어 자리예요. 동사원형이 아니라 동명사 overcoming이 주어 역할을 합니다.","hl":"st-1"},{"n":40,"text":"overcoming your instinct to avoid uncomfortable things가 긴 주어이고, is essential이 동사입니다. 동명사 주어 구조로 자연스럽게 완성됩니다.","hl":"st-2"},{"n":41,"text":"이 문제의 함정도 짚고 갈게요. avoid 뒤에 to부정사를 쓰거나 주어 자리에 동사원형을 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">목적격보어: to부정사와 원형부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사에 따라 목적어 뒤에 \u003cb class=\"key\">to부정사\u003c/b>가 오기도 하고, \u003cb class=\"key\">동사원형\u003c/b>이 오기도 합니다.\u003cdiv>\u003cspan class=\"g-formula\">persuade/get/cause + 목적어 + to do / make/have/let + 목적어 + do / see + 목적어 + do(수동에서는 to do)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>persuade someone to pay\u003c/li>\u003cli>have employees work\u003c/li>\u003cli>let something ignite\u003c/li>\u003cli>cause glaciers to melt\u003c/li>\u003cli>be seen to wait\u003c/li>\u003cli>be made to perform\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They persuaded him \u003cspan class=\"fx\">to pay\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그를 설득해 돈을 내게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She had him \u003cspan class=\"fx\">clean\u003c/span> the room.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 그가 방을 청소하게 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"목적격보어는 동사마다 모양이 달라서 시험에 정말 자주 나와요. persuade, get, cause는 목적어 뒤에 to부정사를 쓰고, make, have, let은 목적어 뒤에 동사원형을 씁니다. see도 능동태에서는 동사원형을 쓰지만 수동태가 되면 to부정사를 써요. 이 묶음을 표처럼 머릿속에 정리해 두면 선택지가 보일 때 바로 판단할 수 있습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① The team manager needs to get the team \u003cu class=\"p-u\">to work\u003c/u> together more effectively.\u003c/div>\u003cdiv class=\"p-op\">② Please remember \u003cu class=\"p-u\">to bring\u003c/u> your own power cable for your computer tomorrow.\u003c/div>\u003cdiv class=\"p-op\">③ The last of this ancient species is believed \u003cu class=\"p-u\">to have died out\u003c/u> 37,000 years ago.\u003c/div>\u003cdiv class=\"p-op\">④ Some customers might be persuaded \u003cu class=\"p-u\">paying\u003c/u> an extra fee for something.\u003c/div>\u003cdiv class=\"p-op\">⑤ I think it is wise \u003cu class=\"p-u\">of you\u003c/u> to anticipate the same problems this year.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":43,"text":"여섯 번째 문제는 다섯 문장 중 어법상 틀린 문장을 고르는 문제예요. 각 동사 뒤에 오는 형태를 차례로 확인해 보세요.","hl":"q"},{"n":44,"text":"","hl":"q","pause":7},{"n":45,"text":"정답은 네 번째예요. persuade는 목적어 뒤에 to부정사를 쓰므로 paying을 to pay로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① The team manager needs to get the team \u003cu class=\"p-u\">to work\u003c/u> together more effectively.\u003c/div>\u003cdiv class=\"p-op\">② Please remember \u003cu class=\"p-u\">to bring\u003c/u> your own power cable for your computer tomorrow.\u003c/div>\u003cdiv class=\"p-op\">③ The last of this ancient species is believed \u003cu class=\"p-u\">to have died out\u003c/u> 37,000 years ago.\u003c/div>\u003cdiv class=\"p-op\">④ Some customers might be persuaded \u003cu class=\"p-u\">paying\u003c/u> an extra fee for something.\u003c/div>\u003cdiv class=\"p-op\">⑤ I think it is wise \u003cu class=\"p-u\">of you\u003c/u> to anticipate the same problems this year.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>get + 목적어 + \u003cb class=\"key\">to work\u003c/b>는 '팀이 더 효과적으로 협력하게 만들다'로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>remember to bring은 '앞으로 가져올 것을 기억하다'로 문맥에 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>be believed to have died out은 '이미 멸종한 것으로 여겨진다'로 완료형 to부정사가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>persuade는 목적어 뒤에 \u003cb class=\"key\">to부정사\u003c/b>를 쓰므로 paying을 to pay로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>It is wise of you to anticipate는 '네가 예상하는 것은 현명하다'로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">Some customers might be persuaded to pay an extra fee for something.\u003c/div>\u003cdiv class=\"p-ko\">④에서 persuade는 목적어 뒤에 to부정사를 취합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>persuade 뒤에 동명사를 바로 쓰는 실수\u003c/div>","segs":[{"n":46,"text":"첫 번째 문장은 get 다음에 목적어와 to부정사가 와서 팀이 협력하게 만들다는 뜻을 만듭니다. 형태가 맞아요.","hl":"st-0"},{"n":47,"text":"두 번째 문장은 내일 가져올 것을 기억하라는 뜻이므로 remember to bring이 맞습니다.","hl":"st-1"},{"n":48,"text":"세 번째 문장은 이미 일어난 과거 사실을 나타내므로 to have died out이 맞습니다.","hl":"st-2"},{"n":49,"text":"네 번째 문장은 persuade 다음에 목적어와 to부정사가 와야 해요. 따라서 paying이 아니라 to pay가 맞습니다.","hl":"st-3"},{"n":50,"text":"다섯 번째 문장은 사람의 성격이나 판단을 나타내는 of you to anticipate 형태로 자연스럽습니다.","hl":"st-4"},{"n":51,"text":"이 문제의 함정도 짚고 갈게요. persuade 뒤에 동명사를 바로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동 to부정사와 for 의미상 주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사의 수동형은 \u003cb class=\"key\">to be + p.p.\u003c/b>이고, 'for + 목적격'은 to부정사의 \u003cb class=\"key\">의미상 주어\u003c/b>를 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">to be + p.p. / It is + 형용사 + for + 목적격 + to do\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>deserve to be disliked = 미움받을 만하다\u003c/li>\u003cli>It is illegal for drivers to text\u003c/li>\u003cli>주어가 동작을 당하면 to be p.p.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You deserve \u003cspan class=\"fx\">to be praised\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 칭찬받을 만하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It is hard \u003cspan class=\"fx\">for me\u003c/span> to decide.\u003c/div>\u003cdiv class=\"g-ko\">내가 결정하기는 어렵다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"to부정사에도 수동형이 있어요. 주어가 어떤 동작을 당하는 입장이면 to be 뒤에 과거분사를 붙여서 to be disliked처럼 씁니다. 또 It is illegal for drivers to text처럼 for 다음에 목적격을 두면 to부정사의 의미상 주어가 됩니다. 누가 그 행동을 하는지, 당하는지를 구분하는 것이 핵심입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">어법상 맞는 문장끼리 짝지어진 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">ⓐ You deserve to be disliked for having said such a rude thing.\u003cbr>ⓑ Many companies have had their employees work from home.\u003cbr>ⓒ It is illegal for drivers to text or make a phone call while driving.\u003cbr>ⓓ Pollution and global warming are causing glaciers melt and sea levels to rise.\u003cbr>ⓔ If every algorithm suddenly stopped to work, it would be the end of the world as we know it.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓑ\u003c/div>\u003cdiv class=\"p-op\">② ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":53,"text":"일곱 번째 문제는 다섯 문장 중 맞는 문장끼리 묶인 선택지를 고르는 문제예요. 각 문장의 동사 뒤 형태를 하나씩 확인해 보세요.","hl":"q"},{"n":54,"text":"","hl":"q","pause":7},{"n":55,"text":"정답은 세 번째 선택지예요. 첫 번째, 두 번째, 세 번째 문장은 맞고, 네 번째는 to melt, 다섯 번째는 working으로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">어법상 맞는 문장끼리 짝지어진 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 맞는 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">ⓐ You deserve to be disliked for having said such a rude thing.\u003cbr>ⓑ Many companies have had their employees work from home.\u003cbr>ⓒ It is illegal for drivers to text or make a phone call while driving.\u003cbr>ⓓ Pollution and global warming are causing glaciers melt and sea levels to rise.\u003cbr>ⓔ If every algorithm suddenly stopped to work, it would be the end of the world as we know it.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓑ\u003c/div>\u003cdiv class=\"p-op\">② ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓐ, ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>deserve + \u003cb class=\"key\">to be disliked\u003c/b>는 '미움을 받을 만하다'로 수동 to부정사가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>have + 목적어 + \u003cb class=\"key\">work\u003c/b>는 '직원들이 재택근무하게 하다'로 원형부정사가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>It is illegal for drivers to text는 for + 의미상 주어 + to부정사 구조로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>cause는 목적어 뒤에 to부정사를 쓰므로 glaciers \u003cb class=\"key\">to melt\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>stop \u003cb class=\"key\">working\u003c/b>은 '작동을 멈추다'이고, stopped to work는 '일하러 멈추다'라서 문맥에 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-ko\">ⓐ, ⓑ, ⓒ가 어법상 맞고, ⓓ는 to melt, ⓔ는 working이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>cause 뒤 목적격보어에 동사원형을 쓰거나 stop to와 stop -ing를 구분하지 못하는 실수\u003c/div>","segs":[{"n":56,"text":"첫 번째 문장은 deserve 뒤에 to be disliked가 와서 미움을 받을 만하다는 뜻을 만듭니다. 수동 to부정사 형태가 맞아요.","hl":"st-0"},{"n":57,"text":"두 번째 문장은 have 다음에 목적어와 동사원형이 와서 직원들이 재택근무하게 한다는 뜻을 만듭니다. 맞는 형태예요.","hl":"st-1"},{"n":58,"text":"세 번째 문장은 for drivers to text처럼 for 다음에 의미상 주어가 와서 to부정사로 이어집니다. 문법적으로 맞습니다.","hl":"st-2"},{"n":59,"text":"네 번째 문장은 cause 다음에 목적어와 to부정사가 와야 해요. 그래서 glaciers melt가 아니라 glaciers to melt가 맞습니다.","hl":"st-3"},{"n":60,"text":"다섯 번째 문장은 알고리즘이 작동을 멈춘다는 뜻이어야 하므로 stop working이 필요해요. stopped to work는 일하러 멈추다라는 뜻이라 어색합니다.","hl":"st-4"},{"n":61,"text":"이 문제의 함정도 짚고 갈게요. cause 뒤 목적격보어에 동사원형을 쓰거나 stop to와 stop -ing를 구분하지 못하는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">with + 목적어 + 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">with 구문에서 목적어와 분사의 관계가 능동이면 \u003cb class=\"key\">현재분사\u003c/b>, 수동이면 \u003cb class=\"key\">과거분사\u003c/b>나 \u003cb class=\"key\">being + p.p.\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 목적어 + 현재분사/과거분사/being p.p.\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>with our words being tested = 우리 말이 시험받는 상황\u003c/li>\u003cli>목적어와 분사의 능동·수동 관계 확인\u003c/li>\u003cli>진행 중인 수동은 being p.p.\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He sat with his arms \u003cspan class=\"fx\">crossed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 팔짱을 낀 채 앉아 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She left with the music \u003cspan class=\"fx\">playing\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 음악이 재생되는 채로 떠났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":62,"text":"with 구문은 목적어 뒤에 분사를 붙여서 상황을 설명해요. 목적어가 스스로 하는 동작이면 현재분사를 쓰고, 목적어가 당하는 동작이면 과거분사를 씁니다. 진행 중이면서 당하는 상황이라면 being 다음에 과거분사를 붙여요. 목적어와 분사의 관계를 먼저 확인하면 형태가 자연스럽게 정해집니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">Too many people wait for something outside of themselves to spark their motivation. We call them extrinsic motivators. The problem is that they tend to come with negative consequences. It's the heart attack that people wait for before they get into the gym and exercise or ⓐ \u003cu class=\"p-u\">watching\u003c/u> what they eat and lose weight. So rather than letting something outside of yourself ⓑ \u003cu class=\"p-u\">to ignite\u003c/u> that motivation, try ⓒ \u003cu class=\"p-u\">to find\u003c/u> motivators inside of yourself.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ watching → watch, ⓑ to ignite → ignite\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"여덟 번째 문제는 지문에서 틀린 부분 두 개를 찾아 고치는 문제예요. or로 연결된 동사와 let 뒤에 오는 형태를 보세요.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"정답은 첫 번째 밑줄 watching을 watch로, 두 번째 밑줄 to ignite를 ignite로 고치는 거예요. 동사원형 병렬과 let 뒤 원형부정사를 확인하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Too many people wait for something outside of themselves to spark their motivation. We call them extrinsic motivators. The problem is that they tend to come with negative consequences. It's the heart attack that people wait for before they get into the gym and exercise or ⓐ \u003cu class=\"p-u\">watching\u003c/u> what they eat and lose weight. So rather than letting something outside of yourself ⓑ \u003cu class=\"p-u\">to ignite\u003c/u> that motivation, try ⓒ \u003cu class=\"p-u\">to find\u003c/u> motivators inside of yourself.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>or로 get into, exercise와 병렬이므로 \u003cb class=\"key\">watch\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>let은 목적어 뒤에 \u003cb class=\"key\">동사원형\u003c/b>을 쓰므로 to ignite가 아니라 ignite입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>try to find는 '찾으려고 노력하다'로 문맥에 맞으므로 그대로 둡니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ watching → watch, ⓑ to ignite → ignite\u003c/span>\u003cdiv class=\"p-full\">It's the heart attack that people wait for before they get into the gym and exercise or watch what they eat and lose weight. So rather than letting something outside of yourself ignite that motivation, try to find motivators inside of yourself.\u003c/div>\u003cdiv class=\"p-ko\">사람들은 밖의 계기가 동기를 불러오기를 기다리지만, 외부의 것이 동기를 불러오게 하기보다 내면의 동기 부여 요인을 찾아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>or로 연결된 동사원형 병렬과 let 뒤 원형부정사를 놓치는 실수\u003c/div>","segs":[{"n":66,"text":"첫 번째 밑줄은 get into the gym and exercise와 or로 연결돼요. 그래서 같은 동사원형인 watch가 와야 합니다.","hl":"st-0"},{"n":67,"text":"두 번째 밑줄은 let 다음에 목적어가 오고 그 뒤에 동사원형이 와야 해요. 따라서 to ignite가 아니라 ignite입니다.","hl":"st-1"},{"n":68,"text":"세 번째 밑줄은 try to find로 찾으려고 노력하다는 뜻을 만듭니다. 여기는 틀린 부분이 아니에요.","hl":"st-2"},{"n":69,"text":"이 문제의 함정도 짚고 갈게요. or로 연결된 동사원형 병렬과 let 뒤 원형부정사를 놓치는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">We might break a promise because we think that we will never end up with our words ⓐ \u003cu class=\"p-u\">testing\u003c/u>. We might not donate to charities because we forget ⓑ \u003cu class=\"p-u\">doing\u003c/u> it. Thus, we know how frequently we are not up to the moral standards we accept on a cognitive level. It appears therefore that we accept certain common moral standards on a cognitive level, but that we frequently fail ⓒ \u003cu class=\"p-u\">to follow\u003c/u> them at a behavioral level.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ testing → being tested, ⓑ doing → to do\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":70,"text":"아홉 번째 문제도 틀린 부분 두 개를 찾는 문제예요. with 뒤 목적어와 분사의 관계, forget 뒤의 의미를 확인해 보세요.","hl":"q"},{"n":71,"text":"","hl":"q","pause":7},{"n":72,"text":"정답은 testing을 being tested로, doing을 to do로 고치는 거예요. 말이 시험받는 수동 관계이고, 기부할 일을 잊은 것이기 때문입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">We might break a promise because we think that we will never end up with our words ⓐ \u003cu class=\"p-u\">testing\u003c/u>. We might not donate to charities because we forget ⓑ \u003cu class=\"p-u\">doing\u003c/u> it. Thus, we know how frequently we are not up to the moral standards we accept on a cognitive level. It appears therefore that we accept certain common moral standards on a cognitive level, but that we frequently fail ⓒ \u003cu class=\"p-u\">to follow\u003c/u> them at a behavioral level.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>our words와 test의 관계는 수동이므로 with + 목적어 + \u003cb class=\"key\">being tested\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>여기서는 '기부할 일을 잊다'이므로 forget \u003cb class=\"key\">to do\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>fail to follow는 '따르지 못하다'로 맞으므로 그대로 둡니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ testing → being tested, ⓑ doing → to do\u003c/span>\u003cdiv class=\"p-full\">We might break a promise because we think that we will never end up with our words being tested. We might not donate to charities because we forget to do it. It appears therefore that we accept certain common moral standards on a cognitive level, but that we frequently fail to follow them at a behavioral level.\u003c/div>\u003cdiv class=\"p-ko\">우리는 말이 시험받는 상황을 겪지 않을 것이라 생각해 약속을 어길 수 있고, 기부할 일을 잊기도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>with 뒤 목적어와 분사의 능동·수동 관계를 놓치는 실수\u003c/div>","segs":[{"n":73,"text":"첫 번째 밑줄은 우리의 말이 시험받는 상황이에요. 말이 시험하는 것이 아니라 시험받는 대상이므로 being tested가 맞습니다.","hl":"st-0"},{"n":74,"text":"두 번째 밑줄은 기부할 일을 잊었다는 뜻이에요. 그래서 forget doing이 아니라 forget to do가 맞습니다.","hl":"st-1"},{"n":75,"text":"세 번째 밑줄은 fail to follow로 따르지 못한다는 뜻을 만듭니다. 여기는 틀린 부분이 아니에요.","hl":"st-2"},{"n":76,"text":"이 문제의 함정도 짚고 갈게요. with 뒤 목적어와 분사의 능동·수동 관계를 놓치는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">allow·help·enable·prevent 패턴\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">allow/enable은 \u003cb class=\"key\">목적어 + to부정사\u003c/b>, help는 \u003cb class=\"key\">목적어 + (to)동사원형\u003c/b>, prevent는 \u003cb class=\"key\">목적어 + from -ing\u003c/b>로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">allow/enable + 목적어 + to do / help + 목적어 + (to ":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬구조와 문장 성분 점검\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and로 연결된 요소는 \u003cb class=\"key\">같은 형태\u003c/b>로 맞추고, 문장에는 \u003cb class=\"key\">주어와 동사\u003c/b>가 반드시 있어야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">to do, do, and do / 동명사, 동명사, and 동명사 / 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>know, get처럼 동사원형 병렬\u003c/li>\u003cli>getting이 아니라 get\u003c/li>\u003cli>Treatment ... includes처럼 주어와 동사 확인\u003c/li>\u003cli>문장 개수 문제는 맞는 문장만 세기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is important to eat, sleep, and exercise.\u003c/div>\u003cdiv class=\"g-ko\">먹고 자고 운동하는 것이 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The treatment \u003cspan class=\"fx\">includes\u003c/span> rest and fluids.\u003c/div>\u003cdiv class=\"g-ko\">그 치료는 휴식과 수분을 포함한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":127,"text":"병렬구조는 and 앞뒤의 모양을 똑같이 맞추는 규칙이에요. 앞에서 동사원형을 썼다면 뒤에서도 동사원형을 써야 하고, 앞에서 동명사를 썼다면 뒤에서도 동명사를 써야 합니다. 또 아무리 긴 문장이어도 주어와 동사가 있어야 완전한 문장이 돼요. 개수를 고르는 문제에서는 틀린 문장이 아니라 맞는 문장을 세야 한다는 점도 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 16 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 개수 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">16\u003c/span>다음 글의 밑줄 친 부분 중 어법상 알맞은 문장의 개수를 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">People of any age can get meningitis. ⓐ \u003cu class=\"p-u\">But it can spread easily among those living in close quarters, so teens, college students, and boarding-school students are at higher risk for infection.\u003c/u> If dealt with quickly, meningitis can be treated successfully. ⓑ \u003cu class=\"p-u\">So it's important to get routine vaccinations, know the signs of meningitis, and getting medical care right away if you think that you have the illness.\u003c/u> ⓒ \u003cu class=\"p-u\">Most cases of viral meningitis end within 7 to 10 days.\u003c/u> ⓓ \u003cu class=\"p-u\">Some people might need to treat in the hospital, although kids usually can recover at home if they're not too ill.\u003c/u> ⓔ \u003cu class=\"p-u\">Treatment to ease symptoms including rest, fluids, and over-the-counter pain medicine.\u003c/u>\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">② (ⓑ getting → get, ⓓ to treat → to be treated, ⓔ including → includes)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":128,"text":"열여섯 번째 문제는 다섯 문장 중 어법상 맞는 문장의 개수를 고르는 문제예요. 각 밑줄을 하나씩 확인하면서 맞는 문장만 세야 해요.","hl":"q"},{"n":129,"text":"","hl":"q","pause":7},{"n":130,"text":"정답은 두 번째 선택지예요. 맞는 문장은 첫 번째와 세 번째이고, 두 번째는 get으로, 네 번째는 be treated로, 다섯 번째는 includes로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 16 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 개수 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">16\u003c/span>다음 글의 밑줄 친 부분 중 어법상 알맞은 문장의 개수를 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">People of any age can get meningitis. ⓐ \u003cu class=\"p-u\">But it can spread easily among those living in close quarters, so teens, college students, and boarding-school students are at higher risk for infection.\u003c/u> If dealt with quickly, meningitis can be treated successfully. ⓑ \u003cu class=\"p-u\">So it's important to get routine vaccinations, know the signs of meningitis, and getting medical care right away if you think that you have the illness.\u003c/u> ⓒ \u003cu class=\"p-u\">Most cases of viral meningitis end within 7 to 10 days.\u003c/u> ⓓ \u003cu class=\"p-u\">Some people might need to treat in the hospital, although kids usually can recover at home if they're not too ill.\u003c/u> ⓔ \u003cu class=\"p-u\">Treatment to ease symptoms including rest, fluids, and over-the-counter pain medicine.\u003c/u>\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>those living은 분사 수식, are at higher risk는 주어와 동사가 맞으므로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>to get, know, and getting에서 \u003cb class=\"key\">get\u003c/b>으로 병렬을 맞춰야 하므로 틀렸습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>Most cases가 복수 주어이고 end가 복수 동사라서 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>사람들이 치료를 받는 대상이므로 \u003cb class=\"key\">to be treated\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>Treatment가 주어이므로 동사 \u003cb class=\"key\">includes\u003c/b>가 필요해 완전한 문장이 됩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">개수 세기\u003c/b>어법상 알맞은 문장은 \u003cb class=\"key\">ⓐ, ⓒ\u003c/b> 두 개입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ② (ⓑ getting → get, ⓓ to treat → to be treated, ⓔ including → includes)\u003c/span>\u003cdiv class=\"p-ko\">ⓐ와 ⓒ가 어법상 알맞고, ⓑ는 get, ⓓ는 be treated, ⓔ는 includes로 고쳐야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>맞는 문장의 개수를 묻는데 틀린 문장의 개수를 세는 실수\u003c/div>","segs":[{"n":131,"text":"첫 번째 문장은 those living처럼 분사가 people을 꾸미고, 뒤에 are가 와서 주어와 동사도 맞습니다. 그래서 맞는 문장이에요.","hl":"st-0"},{"n":132,"text":"두 번째 문장은 to get, know, and get처럼 동사원형 병렬이어야 하는데 getting이 와서 틀렸어요.","hl":"st-1"},{"n":133,"text":"세 번째 문장은 Most cases가 복수 주어이고 end가 복수 동사로 맞습니다. 그래서 맞는 문장입니다.","hl":"st-2"},{"n":134,"text":"네 번째 문장은 사람들이 병원에서 치료를 받는 대상이에요. 그래서 to treat가 아니라 to be treated가 맞습니다.","hl":"st-3"},{"n":135,"text":"다섯 번째 문장은 주어 Treatment에 동사가 없고 including이 와서 문장이 완성되지 않아요. includes로 고쳐야 합니다.","hl":"st-4"},{"n":136,"text":"맞는 문장은 첫 번째와 세 번째이고, 모두 두 개입니다. 그래서 두 번째 선택지가 정답입니다.","hl":"st-5"},{"n":137,"text":"이 문제의 함정도 짚고 갈게요. 맞는 문장의 개수를 묻는데 틀린 문장의 개수를 세는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">빈칸 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 괄호 안의 주어진 말을 알맞은 형태로 바꿔 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">As most species are potential prey for another animal at least sometime during their lives, they possess several lines of defense against predators. Often the first line of defense is to avoid (1) \u003cspan class=\"p-blank\">\u003c/span> (detect) by the predator. One way to do this is to minimize noise production and any visual cues that the predator might use to locate the prey. Frogs and crickets usually stop (2) \u003cspan class=\"p-blank\">\u003c/span> (sing) as another creature approaches. The resulting silence makes it more difficult for the predator (3) \u003cspan class=\"p-blank\">\u003c/span> (find) them.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) being detected (2) singing (3) to find\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":138,"text":"열일곱 번째 문제는 괄호 안의 동사를 알맞은 형태로 바꾸는 문제예요. avoid와 stop 뒤에 오는 형태, 그리고 for 목적어 뒤의 to부정사를 확인하세요.","hl":"q"},{"n":139,"text":"","hl":"q","pause":7},{"n":140,"text":"정답은 being detected, singing, to find예요. avoid 뒤에는 수동 동명사, stop 뒤에는 동명사, difficult for 목적어 뒤에는 to부정사가 필요합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">빈칸 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 괄호 안의 주어진 말을 알맞은 형태로 바꿔 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">As most species are potential prey for another animal at least sometime during their lives, they possess several lines of defense against predators. Often the first line of defense is to avoid (1) \u003cspan class=\"p-blank\">\u003c/span> (detect) by the predator. One way to do this is to minimize noise production and any visual cues that the predator might use to locate the prey. Frogs and crickets usually stop (2) \u003cspan class=\"p-blank\">\u003c/span> (sing) as another creature approaches. The resulting silence makes it more difficult for the predator (3) \u003cspan class=\"p-blank\">\u003c/span> (find) them.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) avoid 뒤\u003c/b>avoid는 동명사를 쓰고, prey는 detect되는 대상이므로 \u003cb class=\"key\">being detected\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) stop 뒤\u003c/b>stop은 여기서 '노래하는 것을 멈추다'이므로 동명사 \u003cb class=\"key\">singing\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) for + 목적어 + to부정사\u003c/b>make it difficult for the predator \u003cb class=\"key\">to find\u003c/b> 구조이므로 to find입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) being detected (2) singing (3) to find\u003c/span>\u003cdiv class=\"p-full\">Often the first line of defense is to avoid being detected by the predator. Frogs and crickets usually stop singing as another creature approaches. The resulting silence makes it more difficult for the predator to find them.\u003c/div>\u003cdiv class=\"p-ko\">첫 번째 방어선은 포식자에게 발견되는 것을 피하는 것이고, 개구리와 귀뚜라미는 다른 생물이 다가오면 우는 것을 멈춘다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>avoid 뒤에 to detect를 쓰거나 stop to sing으로 쓰는 실수\u003c/div>","segs":[{"n":141,"text":"첫 번째 빈칸은 avoid 뒤이므로 동명사가 필요해요. 먹이가 발견되는 대상이므로 being detected가 맞습니다.","hl":"st-0"},{"n":142,"text":"두 번째 빈칸은 개구리와 귀뚜라미가 노래하는 것을 멈춘다는 뜻이에요. 그래서 stop singing이 맞습니다.","hl":"st-1"},{"n":143,"text":"세 번째 빈칸은 for the predator to find 구조예요. 목적어 뒤에 to부정사가 와서 발견하는 것을 어렵게 만든다는 뜻을 완성합니다.","hl":"st-2"},{"n":144,"text":"이 문제의 함정도 짚고 갈게요. avoid 뒤에 to detect를 쓰거나 stop to sing으로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">that절 주어와 동사 수 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">that절이 문장의 주어로 오면 \u003cb class=\"key\">단수 동사\u003c/b>를 쓰는 경우가 많습니다.\u003cdiv>\u003cspan class=\"g-formula\">That + 주어 + 동사 + 단수동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>That future computers will learn is the core difference\u003c/li>\u003cli>that절 전체를 하나의 주어로 봄\u003c/li>\u003cli>to be가 아니라 is\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">That he passed the exam \u003cspan class=\"fx\">is\u003c/span> surprising.\u003c/div>\u003cdiv class=\"g-ko\">그가 시험에 합격한 것은 놀랍다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":145,"text":"that절이 문장 전체의 주어로 쓰일 때가 있어요. 이때는 that절 전체를 하나의 덩어리로 보기 때문에 동사를 단수로 맞추는 경우가 많습니다. 그래서 future computers가 복수처럼 보여도 주어는 that절 전체이므로 is가 와야 해요. 긴 주어를 만나면 동사 바로 앞의 명사가 아니라 진짜 주어 덩어리를 찾는 것이 중요합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법·영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg\">You may have seen headlines in the news about some of the things that machines ⓐ \u003cu class=\"p-u\">powered\u003c/u> by artificial intelligence can do. However, if you were to consider all the tasks ⓑ \u003cu class=\"p-u\">that\u003c/u> AI-powered machines could actually perform, it would be quite mind-blowing! One of the key features of artificial intelligence is \u003cu class=\"p-u\">그것이 기계가 새로운 것을 학습하는 것을 가능하게 한다는 것\u003c/u>, rather than requiring programming specific to new tasks. Therefore, that future computers will be able to learn and self-improve ⓒ \u003cu class=\"p-u\">to be\u003c/u> the core difference between computers of the future and those of the past. In the near future, smart virtual assistants will know more about you than your closest friends and family members ⓓ \u003cu class=\"p-u\">do\u003c/u>. Can you imagine ⓔ \u003cu class=\"p-u\">how\u003c/u> that might change our lives?\u003c/div>\u003cdiv class=\"p-q\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오. 보기: learn, enable, that, new things, it, machines\u003c/div>\u003cdiv class=\"p-words\">보기: learn, enable, that, new things, it, machines\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) ③ (to be → is) / (2) that it enables machines to learn new things\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":146,"text":"열여덟 번째 문제는 지문에서 어법상 어색한 부분을 고르고, 우리말을 조건에 맞게 영작하는 문제예요. 주어가 긴 that절인지와 enable 뒤 형태를 보세요.","hl":"q"},{"n":147,"text":"","hl":"q","pause":7},{"n":148,"text":"첫 번째 답은 세 번째 선택지예요. to be를 is로 고쳐야 하고, 두 번째 답은 that it enables machines to learn new things입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법·영작\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">You may have seen headlines in the news about some of the things that machines ⓐ \u003cu class=\"p-u\">powered\u003c/u> by artificial intelligence can do. However, if you were to consider all the tasks ⓑ \u003cu class=\"p-u\">that\u003c/u> AI-powered machines could actually perform, it would be quite mind-blowing! One of the key features of artificial intelligence is \u003cu class=\"p-u\">그것이 기계가 새로운 것을 학습하는 것을 가능하게 한다는 것\u003c/u>, rather than requiring programming specific to new tasks. Therefore, that future computers will be able to learn and self-improve ⓒ \u003cu class=\"p-u\">to be\u003c/u> the core difference between computers of the future and those of the past. In the near future, smart virtual assistants will know more about you than your closest friends and family members ⓓ \u003cu class=\"p-u\">do\u003c/u>. Can you imagine ⓔ \u003cu class=\"p-u\">how\u003c/u> that might change our lives?\u003c/div>\u003cdiv class=\"p-q sm\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오. 보기: learn, enable, that, new things, it, machines\u003c/div>\u003cdiv class=\"p-words\">보기: learn, enable, that, new things, it, machines\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>machines \u003cb class=\"key\">powered\u003c/b> by artificial intelligence는 과거분사 수식으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>tasks \u003cb class=\"key\">that\u003c/b> AI-powered machines could perform은 목적격 관계대명사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>that future computers will be able to learn and self-improve가 주어이므로 동사는 \u003cb class=\"key\">is\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>friends and family members \u003cb class=\"key\">do\u003c/b>는 앞의 know를 대신하는 대동사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>imagine \u003cb class=\"key\">how\u003c/b> that might change our lives는 간접의문문으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">(2) 영작\u003c/b>enable + 목적어 + to부정사를 이용해 \u003cb class=\"key\">that it enables machines to learn new things\u003c/b>로 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ③ (to be → is) / (2) that it enables machines to learn new things\u003c/span>\u003cdiv class=\"p-full\">One of the key features of artificial intelligence is that it enables machines to learn new things, rather than requiring programming specific to new tasks.\u003c/div>\u003cdiv class=\"p-ko\">인공지능의 핵심 특징 중 하나는 그것이 기계가 새로운 것을 학습하는 것을 가능하게 한다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>that절 주어를 복수로 보거나 enable 뒤에 to부정사를 빼는 실수\u003c/div>","segs":[{"n":149,"text":"첫 번째 밑줄은 machines가 인공지능에 의해 작동되는 관계이므로 powered가 맞습니다.","hl":"st-0"},{"n":150,"text":"두 번째 밑줄은 tasks를 받는 목적격 관계대명사 that입니다. 뒤에 perform의 목적어가 빠져 있으므로 맞아요.","hl":"st-1"},{"n":151,"text":"세 번째 밑줄 앞의 that절 전체가 주어예요. 그래서 to be가 아니라 단수 동사 is가 와야 합니다.","hl":"st-2"},{"n":152,"text":"네 번째 밑줄의 do는 앞에 나온 know를 대신하는 표현입니다. 그래서 맞습니다.","hl":"st-3"},{"n":153,"text":"다섯 번째 밑줄은 how가 이끄는 간접의문문으로 imagine의 목적어 역할을 합니다. 문법적으로 맞아요.","hl":"st-4"},{"n":154,"text":"우리말은 먼저 that으로 시작해요. 그다음 it enables machines to learn new things 순서로 쓰면 됩니다.","hl":"st-5"},{"n":155,"text":"이 문제의 함정도 짚고 갈게요. that절 주어를 복수로 보거나 enable 뒤에 to부정사를 빼는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Most supplements are absorbed best when taken with, or just after, a meal. This is especially true for supplements that are better absorbed with a meal ① \u003cu class=\"p-u\">containing\u003c/u> some fat, such as vitamins A, D, and E. And taking supplements with meals helps prevent the digestive upset ② \u003cu class=\"p-u\">that\u003c/u> can occasionally occur if you take supplements on an empty stomach. If you are taking liquid herbal supplements, however, they seem ③ \u003cu class=\"p-u\">to be best absorbed\u003c/u> on an empty stomach. Take them a few minutes before a meal, and dilute the dosage with a small amount of water or juice ④ \u003cu class=\"p-u\">to make\u003c/u> them more palatable. If you can remember ⑤ \u003cu class=\"p-u\">doing\u003c/u> so, it's also best to divide up supplement dosages so that you're taking them two or three times a day instead of all at once.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① containing\u003c/div>\u003cdiv class=\"p-op\">② that\u003c/div>\u003cdiv class=\"p-op\">③ to be best absorbed\u003c/div>\u003cdiv class=\"p-op\">④ to make\u003c/div>\u003cdiv class=\"p-op\">⑤ doing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤ (doing → to do)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":156,"text":"열아홉 번째 문제는 지문에서 어법상 틀린 부분을 고르는 문제예요. 특히 remember 뒤에 오는 형태와 수동태를 확인해 보세요.","hl":"q"},{"n":157,"text":"","hl":"q","pause":7},{"n":158,"text":"정답은 다섯 번째예요. 앞으로 해야 할 일을 기억한다는 뜻이므로 doing을 to do로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Most supplements are absorbed best when taken with, or just after, a meal. This is especially true for supplements that are better absorbed with a meal ① \u003cu class=\"p-u\">containing\u003c/u> some fat, such as vitamins A, D, and E. And taking supplements with meals helps prevent the digestive upset ② \u003cu class=\"p-u\">that\u003c/u> can occasionally occur if you take supplements on an empty stomach. If you are taking liquid herbal supplements, however, they seem ③ \u003cu class=\"p-u\">to be best absorbed\u003c/u> on an empty stomach. Take them a few minutes before a meal, and dilute the dosage with a small amount of water or juice ④ \u003cu class=\"p-u\">to make\u003c/u> them more palatable. If you can remember ⑤ \u003cu class=\"p-u\">doing\u003c/u> so, it's also best to divide up supplement dosages so that you're taking them two or three times a day instead of all at once.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① containing\u003c/div>\u003cdiv class=\"p-op\">② that\u003c/div>\u003cdiv class=\"p-op\">③ to be best absorbed\u003c/div>\u003cdiv class=\"p-op\">④ to make\u003c/div>\u003cdiv class=\"p-op\">⑤ doing\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>a meal \u003cb class=\"key\">containing\u003c/b> some fat은 현재분사가 meal을 꾸며 주므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>the digestive upset \u003cb class=\"key\">that\u003c/b> can occur은 주격 관계대명사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>supplements seem \u003cb class=\"key\">to be best absorbed\u003c/b>는 seem + to부정사와 수동태가 결합한 형태로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>\u003cb class=\"key\">to make\u003c/b> them more palatable은 목적을 나타내는 to부정사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>앞으로 해야 할 일을 기억한다는 뜻이므로 \u003cb class=\"key\">to do\u003c/b>가 되어야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤ (doing → to do)\u003c/span>\u003cdiv class=\"p-full\">If you can remember to do so, it's also best to divide up supplement dosages so that you're taking them two or three times a day instead of all at once.\u003c/div>\u003cdiv class=\"p-ko\">그렇게 해야 한다는 것을 기억할 수 있다면, 보충제 용량을 나누어 하루에 두세 번 먹는 것이 가장 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>remember doing과 remember to do의 의미 차이를 구분하지 못하는 실수\u003c/div>","segs":[{"n":159,"text":"첫 번째 밑줄은 a meal이 some fat을 포함하는 관계이므로 현재분사 containing이 맞습니다.","hl":"st-0"},{"n":160,"text":"두 번째 밑줄은 the digestive upset을 받는 주격 관계대명사 that입니다. 뒤에 can occur가 이어지므로 맞아요.","hl":"st-1"},{"n":161,"text":"세 번째 밑줄은 supplements가 흡수되는 대상이므로 to be best absorbed가 맞습니다. seem 뒤에 to부정사가 온 것도 자연스러워요.","hl":"st-2"},{"n":162,"text":"네 번째 밑줄은 더 맛있게 만들기 위해라는 목적을 나타내는 to부정사입니다. 형태가 맞습니다.","hl":"st-3"},{"n":163,"text":"다섯 번째 밑줄은 앞으로 그렇게 해야 할 일을 기억한다는 뜻이에요. 그래서 remember doing이 아니라 remember to do가 맞습니다.","hl":"st-4"},{"n":164,"text":"이 문제의 함정도 짚고 갈게요. remember doing과 remember to do의 의미 차이를 구분하지 못하는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤의 동명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 \u003cb class=\"key\">동명사\u003c/b>가 오고, 동명사의 의미상 주어는 목적격이나 소유격으로 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 동명사 / about + 목적격 + 동명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>be happy about his child dropping out\u003c/li>\u003cli>전치사 about 뒤에는 dropping\u003c/li>\u003cli>동명사 앞 child는 의미상 주어\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I am worried about him \u003cspan class=\"fx\">leaving\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 떠나는 것이 걱정된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":165,"text":"전치사 뒤에는 명사 역할을 하는 동명사가 와요. 그래서 about 뒤에 동사인 drops를 그대로 쓰면 안 되고 dropping을 써야 합니다. 이때 child는 dropping의 의미상 주어 역할을 해요. 전치사 뒤에서는 동명사, 그리고 그 앞의 의미상 주어까지 함께 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Bill Gates dropped out of Harvard in his second year to pursue programming for an early version of the personal computer, ① \u003cu class=\"p-u\">joining\u003c/u> forces with another equally gifted computer nerd, Paul Allen. Together, they created Microsoft. Gates returned to Harvard in 2007 ② \u003cu class=\"p-u\">to receive\u003c/u> an honorary degree. With this retrospective knowledge, it's easy enough to declare that it would have been a big mistake ③ \u003cu class=\"p-u\">for Gates\u003c/u> to stay at Harvard, graduate with his class, and take a comfortable job at a large company, such as IBM or Digital Equipment Corporation (DEC). But what parent would have been happy about his or her child ④ \u003cu class=\"p-u\">drops\u003c/u> out of Harvard when the future was still shrouded in uncertainty? We often have to wait a long time before we can really judge ⑤ \u003cu class=\"p-u\">if\u003c/u> a decision was smart, dumb, lucky, or somewhere in between.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① joining\u003c/div>\u003cdiv class=\"p-op\">② to receive\u003c/div>\u003cdiv class=\"p-op\">③ for Gates\u003c/div>\u003cdiv class=\"p-op\">④ drops\u003c/div>\u003cdiv class=\"p-op\">⑤ if\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④ (drops → dropping)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":166,"text":"스무 번째 문제는 지문에서 어법상 틀린 부분을 고르는 문제예요. 전치사 about 뒤에 어떤 형태가 와야 하는지 확인해 보세요.","hl":"q"},{"n":167,"text":"","hl":"q","pause":7},{"n":168,"text":"정답은 네 번째예요. 전치사 about 뒤에는 동명사가 와야 하므로 drops를 dropping으로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Bill Gates dropped out of Harvard in his second year to pursue programming for an early version of the personal computer, ① \u003cu class=\"p-u\">joining\u003c/u> forces with another equally gifted computer nerd, Paul Allen. Together, they created Microsoft. Gates returned to Harvard in 2007 ② \u003cu class=\"p-u\">to receive\u003c/u> an honorary degree. With this retrospective knowledge, it's easy enough to declare that it would have been a big mistake ③ \u003cu class=\"p-u\">for Gates\u003c/u> to stay at Harvard, graduate with his class, and take a comfortable job at a large company, such as IBM or Digital Equipment Corporation (DEC). But what parent would have been happy about his or her child ④ \u003cu class=\"p-u\">drops\u003c/u> out of Harvard when the future was still shrouded in uncertainty? We often have to wait a long time before we can really judge ⑤ \u003cu class=\"p-u\">if\u003c/u> a decision was smart, dumb, lucky, or somewhere in between.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① joining\u003c/div>\u003cdiv class=\"p-op\">② to receive\u003c/div>\u003cdiv class=\"p-op\">③ for Gates\u003c/div>\u003cdiv class=\"p-op\">④ drops\u003c/div>\u003cdiv class=\"p-op\">⑤ if\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>\u003cb class=\"key\">joining\u003c/b> forces는 앞 절을 이어 주는 분사구문으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>returned to Harvard \u003cb class=\"key\">to receive\u003c/b>는 목적을 나타내는 to부정사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>a big mistake \u003cb class=\"key\">for Gates\u003c/b> to stay는 to부정사의 의미상 주어 for + 목적격으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>전치사 about 뒤에는 동명사가 와야 하므로 \u003cb class=\"key\">dropping\u003c/b>이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>judge \u003cb class=\"key\">if\u003c/b> a decision was smart는 if가 이끄는 명사절로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④ (drops → dropping)\u003c/span>\u003cdiv class=\"p-full\">But what parent would have been happy about his or her child dropping out of Harvard when the future was still shrouded in uncertainty?\u003c/div>\u003cdiv class=\"p-ko\">미래가 불확실했을 때 자녀가 하버드를 중퇴하는 것을 기뻐할 부모가 어디 있겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>전치사 about 뒤에 동사 현재형을 그대로 쓰는 실수\u003c/div>","segs":[{"n":169,"text":"첫 번째 밑줄은 앞의 행동과 이어지는 상황을 나타내는 분사구문입니다. joining이 맞습니다.","hl":"st-0"},{"n":170,"text":"두 번째 밑줄은 학위를 받기 위해 돌아왔다는 목적을 나타냅니다. to receive가 맞아요.","hl":"st-1"},{"n":171,"text":"세 번째 밑줄은 to stay의 의미상 주어를 나타내는 for Gates입니다. 문법적으로 맞습니다.","hl":"st-2"},{"n":172,"text":"네 번째 밑줄은 전치사 about 뒤예요. 그래서 동사 drops가 아니라 동명사 dropping이 와야 합니다.","hl":"st-3"},{"n":173,"text":"다섯 번째 밑줄은 판단하다의 목적어로 if절이 온 형태입니다. 문법적으로 자연스러워요.","hl":"st-4"},{"n":174,"text":"이 문제의 함정도 짚고 갈게요. 전치사 about 뒤에 동사 현재형을 그대로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">준동사·수동태·목적격보어 종합\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>be likely to 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>이 오고, 주어가 당하는 동작이면 \u003cb class=\"key\">be + p.p.\u003c/b>를 씁니다.\u003c/li>\u003cli>forget/remember는 \u003cb class=\"key\">to do\u003c/b>면 할 일, \u003cb class=\"key\">doing\u003c/b>면 한 일이고, stop to는 하러 멈추다, stop doing은 하던 일을 멈추다입니다.\u003c/li>\u003cli>avoid/enjoy/mind 뒤에는 \u003cb class=\"key\">동명사\u003c/b>가 오고, 동명사의 의미상 주어는 \u003cb class=\"key\">목적격\u003c/b>으로 씁니다.\u003c/li>\u003cli>allow/enable은 \u003cb class=\"key\">목적어 + to부정사\u003c/b>, help는 \u003cb class=\"key\">목적어 + (to)동사원형\u003c/b>, prevent는 \u003cb class=\"key\">목적어 + from -ing\u003c/b>입니다.\u003c/li>\u003cli>see/make의 수동태 뒤에는 \u003cb class=\"key\">to부정사\u003c/b>가 오고, believe는 \u003cb class=\"key\">to have p.p.\u003c/b>로 과거 사실을 나타낼 수 있습니다.\u003c/li>\u003cli>병렬구조는 \u003cb class=\"key\">같은 형태\u003c/b>로 맞추고, 전치사 뒤에는 \u003cb class=\"key\">동명사\u003c/b>가 옵니다.\u003c/li>\u003c/ul>","segs":[{"n":175,"text":"오늘은 준동사와 수동태, 목적격보어를 중심으로 문제를 풀었어요. 동사 뒤에 오는 형태와 주어가 동작을 하는지 당하는지를 먼저 확인하는 습관을 꼭 들이세요. 특히 to부정사와 동명사의 의미 차이, 수동태 뒤의 to부정사를 다시 복습하면 좋겠습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
