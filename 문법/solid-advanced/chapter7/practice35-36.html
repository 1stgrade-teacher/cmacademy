window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 7 Basic Practice (포인트 35-36)","audioDir":"practice35-36_audio","preview":false,"count":81,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">인칭대명사(수·성 일치) / 가주어·가목적어 it / 비교 구문의 비교 대상\u003c/div>\u003ch1>Chapter 7 Basic Practice — 대명사와 it 구문 총정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter 7 Basic Practice, 포인트 서른다섯에서 서른여섯까지 함께 풀어 볼 거예요. 대명사 하나만 제대로 잡아도 이번 단원 문제는 거의 다 맞힐 수 있어요. 선택형, 틀린 부분 고치기, 지문 어법까지 순서대로 차근차근 가 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어와 대명사의 수 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어가 「A and B」처럼 두 개 이상이면 \u003cb class=\"key\">복수\u003c/b>로 보고, 이를 받는 대명사도 복수형을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">A and B → they / their / them\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the woodpecker and its mate는 두 마리이므로 복수\u003c/li>\u003cli>its는 단수, \u003cb class=\"key\">their\u003c/b>는 복수\u003c/li>\u003cli>뒤에 붙은 its mate에 속지 말고 주어 전체를 보기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The bird and its mate built \u003cspan class=\"fx\">their\u003c/span> nest.\u003c/div>\u003cdiv class=\"g-ko\">그 새와 그 짝은 자기들의 둥지를 지었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"자, 첫 번째 개념은 주어와 대명사의 수를 맞추는 거예요. 주어가 and로 두 개 이상 연결되면 우리는 그걸 복수로 봐요. 그래서 그 주어를 다시 받아 주는 대명사도 복수형이 되어야 하죠. the woodpecker and its mate는 딱따구리 한 마리와 그 짝, 즉 두 마리예요. 그러니까 소유격은 their가 맞고, its는 한 마리일 때만 씁니다. 바로 뒤에 its mate가 보여서 헷갈리기 쉬운데, 주어 전체를 보는 습관을 들여요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The woodpecker and its mate tried \u003cspan class=\"p-box\">\u003cspan>its\u003c/span>\u003ci>/\u003c/i>\u003cspan>their\u003c/span>\u003c/span> best to protect the nest.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">its\u003c/div>\u003cdiv class=\"p-op\">their\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">their\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제예요. 주어가 몇 개인지, 그 주어를 받는 대명사가 무엇인지 두 가지만 보면 됩니다.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 their예요. 주어가 두 마리라서 복수이고, 소유격도 복수형으로 맞춰 줘야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The woodpecker and its mate tried \u003cspan class=\"p-box\">\u003cspan>its\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">their\u003c/span>\u003c/span> best to protect the nest.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">its\u003c/div>\u003cdiv class=\"p-op\">their\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 찾기\u003c/b>주어는 The woodpecker and its mate로 「딱따구리와 그 짝」, 즉 두 마리이므로 \u003cb class=\"key\">복수\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">대명사 고르기\u003c/b>복수 주어를 받는 소유격은 \u003cb class=\"key\">their\u003c/b>이고, its는 단수 주어를 받는 형태입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>tried their best to protect the nest, 「둥지를 지키기 위해 최선을 다했다」로 자연스럽게 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 their\u003c/span>\u003cdiv class=\"p-full\">The woodpecker and its mate tried their best to protect the nest.\u003c/div>\u003cdiv class=\"p-ko\">딱따구리와 그 짝은 둥지를 지키기 위해 최선을 다했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>바로 뒤의 its mate에 끌려 its를 고르면 함정입니다. 주어 전체가 복수라는 점을 보세요.\u003c/div>","segs":[{"n":6,"text":"먼저 주어를 찾아볼까요. the woodpecker and its mate, 딱따구리와 그 짝이에요. 두 마리니까 복수로 봐야겠죠.","hl":"st-0"},{"n":7,"text":"그러면 이 주어를 받는 소유격은 복수형이어야 해요. their가 맞고, its는 한 마리일 때만 쓸 수 있습니다.","hl":"st-1"},{"n":8,"text":"완성해서 읽어 보면 tried their best to protect the nest, 둥지를 지키기 위해 최선을 다했다, 아주 자연스럽죠.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. 바로 뒤의 its mate에 끌려 its를 고르면 함정입니다. 주어 전체가 복수라는 점을 보세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가주어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">to부정사나 that절이 주어 자리에 오면 길어지므로, 그 자리에 \u003cb class=\"key\">가주어 it\u003c/b>을 쓰고 진주어는 뒤로 보냅니다.\u003cdiv>\u003cspan class=\"g-formula\">It + 동사 + to부정사 / that절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>가주어 it은 해석하지 않는다\u003c/li>\u003cli>진주어가 뒤에 남아 있는지 반드시 확인\u003c/li>\u003cli>It is clear that ~, It makes no sense to ~ 형태로 자주 출제\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It makes no sense to use more money on that.\u003c/div>\u003cdiv class=\"g-ko\">그 일에 돈을 더 쓰는 것은 말이 되지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"두 번째 개념은 가주어 it이에요. 영어는 주어 자리가 너무 길어지는 걸 싫어해요. to부정사나 that절이 주어로 오면 뒤로 던져 버리고, 그 빈자리에 it을 딱 세워 두는 거죠. 이때 it은 해석하지 않아요. 「그것이 말이 되지 않는다」가 아니라 「무엇을 하는 것이 말이 되지 않는다」로 읽어야 하죠. 그리고 진주어가 뒤에 살아 있는지 꼭 확인해야 해요. 그게 없으면 it은 그냥 장식이 되어 버리니까요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He thinks that \u003cspan class=\"p-box\">\u003cspan>it\u003c/span>\u003ci>/\u003c/i>\u003cspan>he\u003c/span>\u003c/span> makes no sense to use more money on that.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">it\u003c/div>\u003cdiv class=\"p-op\">he\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">it\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제입니다. that절 안에서 진짜 주어가 어디로 갔는지 찾아보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 it이에요. to부정사가 진주어로 뒤에 있으니 주어 자리에는 가주어 it을 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He thinks that \u003cspan class=\"p-box\">\u003cspan class=\"ok\">it\u003c/span>\u003ci>/\u003c/i>\u003cspan>he\u003c/span>\u003c/span> makes no sense to use more money on that.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">it\u003c/div>\u003cdiv class=\"p-op\">he\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">that절 구조 보기\u003c/b>that절 안에서 makes의 주어 자리를 찾으면, 뒤에 \u003cb class=\"key\">to use more money on that\u003c/b>이라는 진주어가 남아 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">가주어 판단\u003c/b>주어가 뒤로 빠졌으므로 그 자리에는 \u003cb class=\"key\">가주어 it\u003c/b>을 씁니다. he를 쓰면 뒤의 to부정사가 갈 곳이 없어집니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>He thinks that it makes no sense to use more money on that.으로 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 it\u003c/span>\u003cdiv class=\"p-full\">He thinks that it makes no sense to use more money on that.\u003c/div>\u003cdiv class=\"p-ko\">그는 그 일에 돈을 더 쓰는 것이 말이 되지 않는다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞에 있는 He에 끌려 he를 고르면, to use 이하가 주어 없이 붙어 버려 어색해집니다.\u003c/div>","segs":[{"n":14,"text":"that절 안을 자세히 보세요. makes no sense 뒤에 to use more money on that이 길게 늘어져 있죠. 이게 진짜 주어예요.","hl":"st-0"},{"n":15,"text":"그러면 빈 주어 자리에는 가주어 it이 들어가야 해요. he를 쓰면 주어가 두 개가 되면서 뒤 문장이 엉켜 버립니다.","hl":"st-1"},{"n":16,"text":"완성하면 그는 그 일에 돈을 더 쓰는 것이 말이 되지 않는다고 생각한다, 라는 뜻이 됩니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. 앞에 있는 He에 끌려 he를 고르면, to use 이하가 주어 없이 붙어 버려 어색해집니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">소유격과 소유대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">소유격은 \u003cb class=\"key\">명사 앞\u003c/b>에 붙여 쓰고, 소유대명사는 명사를 \u003cb class=\"key\">혼자 대신\u003c/b>합니다.\u003cdiv>\u003cspan class=\"g-formula\">소유격 + 명사(his age) / 소유대명사 단독(hers, mine)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>hers = her + sneakers\u003c/li>\u003cli>mine = my + plan\u003c/li>\u003cli>소유대명사 뒤에는 명사가 오지 않는다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My sister lent me \u003cspan class=\"fx\">hers\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">언니가 자기 것을 나에게 빌려 주었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"세 번째는 소유격과 소유대명사를 구별하는 거예요. 소유격은 반드시 뒤에 명사가 따라와요. his age처럼요. 반대로 소유대명사는 명사를 혼자서 대신해요. hers는 her sneakers, mine은 my plan을 한 단어로 줄인 표현이에요. 그래서 소유대명사 뒤에는 명사가 절대 오지 않아요. 빌려주는 대상이 이미 앞에 나왔다면 소유대명사 하나로 충분하다는 것, 꼭 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I don't know where my sneakers went, so my sister lent me \u003cspan class=\"p-box\">\u003cspan>her\u003c/span>\u003ci>/\u003c/i>\u003cspan>hers\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">her\u003c/div>\u003cdiv class=\"p-op\">hers\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hers\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제예요. 빌려준 것이 무엇인지, 그걸 어떤 형태로 받아야 하는지 생각해 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":7},{"n":21,"text":"정답은 hers입니다. 앞에 나온 sneakers를 대신하는 소유대명사이고, 소유대명사는 혼자서 명사 역할을 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I don't know where my sneakers went, so my sister lent me \u003cspan class=\"p-box\">\u003cspan>her\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">hers\u003c/span>\u003c/span>.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">her\u003c/div>\u003cdiv class=\"p-op\">hers\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문장 형식 확인\u003c/b>lent는 lend + 사람 + 물건의 4형식이므로, me 뒤에는 \u003cb class=\"key\">명사 역할\u003c/b>을 하는 말이 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">반복 대신 소유대명사\u003c/b>앞의 my sneakers를 다시 쓰지 않으려면 소유대명사 \u003cb class=\"key\">hers\u003c/b>를 씁니다. her는 소유격이라 명사 없이 혼자 못 섭니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>my sister lent me hers = 「언니가 자기 운동화를 빌려 주었다」로 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 hers\u003c/span>\u003cdiv class=\"p-full\">I don't know where my sneakers went, so my sister lent me hers.\u003c/div>\u003cdiv class=\"p-ko\">내 운동화가 어디로 갔는지 모르겠어서 언니가 자기 것을 빌려 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>her를 고르면 「언니가 나에게 그녀를 빌려줬다」는 이상한 문장이 됩니다.\u003c/div>","segs":[{"n":22,"text":"lent라는 동사를 보세요. 누구에게 무엇을 빌려주다, 이렇게 목적어가 두 개 필요한 동사예요. 그러니까 me 뒤에는 물건에 해당하는 말이 와야 합니다.","hl":"st-0"},{"n":23,"text":"앞에 이미 my sneakers가 나왔으니까 또 쓰지 않고 한 단어로 줄이면 돼요. 그게 바로 hers입니다. her는 뒤에 명사가 꼭 필요한 형태라 혼자 못 와요.","hl":"st-1"},{"n":24,"text":"완성하면 언니가 자기 것을 빌려 주었다, 라는 뜻이 되어 아주 매끄럽습니다.","hl":"st-2"},{"n":25,"text":"이 문제의 함정도 짚고 갈게요. her를 고르면 「언니가 나에게 그녀를 빌려줬다」는 이상한 문장이 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가목적어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적어 자리에 to부정사나 that절이 오면 \u003cb class=\"key\">가목적어 it\u003c/b>을 세우고 진목적어는 뒤로 보냅니다.\u003cdiv>\u003cspan class=\"g-formula\">find / think / take + it + 형용사·명사 + to부정사·that절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>take it for granted that ~ : ~을 당연하게 여기다\u003c/li>\u003cli>find it necessary to ~ : ~하는 것이 필요하다고 여기다\u003c/li>\u003cli>이 자리에 that을 쓰면 틀린다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She took it for granted that her son would pass the exam.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 아들이 시험에 합격할 것을 당연하게 여겼다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"네 번째 개념은 가목적어 it이에요. 목적어 자리에 to부정사나 that절이 길게 늘어서면, 역시 it을 가목적어로 세우고 진짜 목적어는 뒤로 보내요. find it necessary to tell, take it for granted that처럼 자주 쓰이는 덩어리가 있으니 통째로 외워 두면 좋아요. 여기서 it 자리에 that을 at many people will lose their jobs if the factory closes.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 구조 확인\u003c/b>문장 맨 앞 It 뒤에 is clear가 오고, 그 뒤에 \u003cb class=\"key\">that절\u003c/b>이 통째로 따라옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">가주어 판단\u003c/b>that절이 진주어로 뒤에 있으므로 앞의 It은 \u003cb class=\"key\">가주어\u003c/b>로 올바르게 쓰였습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 표시\u003c/b>어법상 문제가 없으므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">It is clear that many people will lose their jobs if the factory closes.\u003c/div>\u003cdiv class=\"p-ko\">공장이 문을 닫으면 많은 사람이 일자리를 잃을 것이 분명하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>가주어 It을 지우고 that절을 앞으로 옮기면 어색해집니다. 그대로 두는 것이 정답입니다.\u003c/div>","segs":[{"n":45,"text":"문장을 보면 It is clear that, 이렇게 이어지죠. that절이 통째로 뒤에 붙어 있습니다.","hl":"st-0"},{"n":46,"text":"이 that절이 진짜 주어예요. 그래서 앞의 It은 가주어로 제 역할을 하고 있습니다.","hl":"st-1"},{"n":47,"text":"따라서 이 문장은 고칠 필요가 없어요. 동그라미를 표시하면 됩니다.","hl":"st-2"},{"n":48,"text":"이 문제의 함정도 짚고 갈게요. 가주어 It을 지우고 that절을 앞으로 옮기면 어색해집니다. 그대로 두는 것이 정답입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대명사의 선행사 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대명사는 가리키는 말과 \u003cb class=\"key\">인칭·수·성\u003c/b>이 모두 맞아야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">사물·행위 → it / 복수 → they·them / 남성 단수 → he·his\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>to go to London이라는 행위 → it\u003c/li>\u003cli>his friends(복수) → them\u003c/li>\u003cli>your friends(복수·주격) → they\u003c/li>\u003cli>Jerome(단수·남성) → His\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Ronald could not make them look his way.\u003c/div>\u003cdiv class=\"g-ko\">로널드는 그들이 자기 쪽을 보게 할 수 없었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"여섯 번째는 대명사가 무엇을 가리키는지 확인하는 거예요. 대명사는 앞에 나온 말과 인칭, 수, 성이 모두 맞아야 해요. 사람은 he나 his, 사물이나 행위는 it, 복수 명사는 they나 them으로 받죠. 문장을 읽다가 대명사가 나오면 반드시 한 발짝 물러나서 무엇을 가리키는지 되짚어 보세요. 그거 하나만 확인해도 절반은 맞힙니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">I would like to go to London tomorrow if you will permit \u003cu class=\"p-u\">them\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">it\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":50,"text":"세 번째 문제입니다. permit 뒤에 오는 목적어가 무엇을 가리키는지 따져 보세요.","hl":"q"},{"n":51,"text":"","hl":"q","pause":7},{"n":52,"text":"them을 it으로 고칩니다. 허락의 대상은 런던이 아니라 런던에 가는 행위 하나이기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">I would like to go to London tomorrow if you will permit \u003cu class=\"p-u\">them\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 목적어 찾기\u003c/b>permit은 타동사이므로 뒤에 \u003cb class=\"key\">목적어\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">가리키는 대상 확인\u003c/b>허락받는 내용은 「내일 런던에 가는 것」이라는 행위이므로 \u003cb class=\"key\">단수 it\u003c/b>으로 받아야 합니다.\ ns\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Ronald wanted the attention of his friends, but he could not make \u003cu class=\"p-u\">him\u003c/u> look his way.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">목적격 자리 확인\u003c/b>make는 make + 목적어 + 동사원형 구조이므로, 목적어 자리에 \u003cb class=\"key\">목적격\u003c/b>이 필요합니다. him은 목적격이긴 하지만 가리키는 대상이 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선행사 확인\u003c/b>앞의 his friends는 \u003cb class=\"key\">복수\u003c/b>이므로 목적격 \u003cb class=\"key\">them\u003c/b>으로 받아야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>make them look his way, 「그들이 자기 쪽을 보게 하다」로 완성됩니다. 이때 his는 로널드를 가리킵니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 them\u003c/span>\u003cdiv class=\"p-full\">Ronald wanted the attention of his friends, but he could not make them look his way.\u003c/div>\u003cdiv class=\"p-ko\">로널드는 친구들의 관심을 원했지만, 그들이 자기 쪽을 보게 할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞의 he에 끌려 him을 그대로 두면 친구들이 아니라 로널드 자신을 보게 하라는 문장이 됩니다.\u003c/div>","segs":[{"n":60,"text":"make 다음을 보세요. 목적어 하나와 동사원형 look이 이어지죠. 그런데 목적어 him이 가리키는 게 이상하지 않나요?","hl":"st-0"},{"n":61,"text":"앞에 his friends, 친구들이 복수로 나와 있어요. 그러면 목적격도 복수인 them이 되어야 합니다.","hl":"st-1"},{"n":62,"text":"완성하면 로널드가 친구들이 자기 쪽을 보게 만들 수 없었다, 는 뜻이 됩니다. 뒤의 his는 로널드를 가리키는 거예요.","hl":"st-2"},{"n":63,"text":"이 문제의 함정도 짚고 갈게요. 앞의 he에 끌려 him을 그대로 두면 친구들이 아니라 로널드 자신을 보게 하라는 문장이 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사의 진주어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「~하는 것은 …하다」에서 to부정사가 주어 역할을 하면 가주어 it을 쓰고 \u003cb class=\"key\">to + 동사원형\u003c/b>으로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">It is + 형용사 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>it is wrong to tell a lie\u003c/li>\u003cli>전치사 to가 아니라 to부정사\u003c/li>\u003cli>시제와 상관없이 동사원형을 그대로 쓴다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is wrong \u003cspan class=\"fx\">to tell\u003c/span> a lie.\u003c/div>\u003cdiv class=\"g-ko\">거짓말을 하는 것은 옳지 않다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":64,"text":"일곱 번째는 to부정사가 주어 역할을 할 때예요. 「거짓말을 하는 것은 옳지 않다」를 영어로 하면 it is wrong to tell a lie가 되죠. 여기서 it은 가주어이고, 진짜 주어는 뒤에 있는 to tell이에요. 전치사 to가 아니라 동사원형을 끌고 가는 to부정사라는 점, 그리고 문장이 과거라고 해서 told로 바꾸지 않는다는 점도 함께 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">We teach our children from a young age that it is wrong (1) \u003cu class=\"p-u\">tell\u003c/u> a lie. However, as adults we often find (2) \u003cu class=\"p-u\">that\u003c/u> necessary to tell white lies to avoid hurting somebody's feelings. When your friends ask for your opinion, (3) \u003cu class=\"p-u\">them\u003c/u> sometimes want reassurance, not honest criticism.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) to tell (2) it (3) they\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":65,"text":"이제 지문형 문제예요. 세 군데 밑줄이 있는데, 각각 가주어인지 가목적어인지 주격인지 구별하는 게 핵심입니다.","hl":"q"},{"n":66,"text":"","hl":"q","pause":7},{"n":67,"text":"첫 번째는 to tell, 두 번째는 it, 세 번째는 they로 고칩니다. 가주어와 가목적어 자리에는 it을, 주어 자리에는 주격 they를 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">We teach our children from a young age that it is wrong (1) \u003cu class=\"p-u\">tell\u003c/u> a lie. However, as adults we often find (2) \u003cu class=\"p-u\">that\u003c/u> necessary to tell white lies to avoid hurting somebody's feelings. When your friends ask for your opinion, (3) \u003cu class=\"p-u\">them\u003c/u> sometimes want reassurance, not honest criticism.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 밑줄\u003c/b>it is wrong ___ a lie에서 it은 \u003cb class=\"key\">가주어\u003c/b>이고 진주어 자리에는 \u003cb class=\"key\">to부정사\u003c/b>가 와야 하므로 to tell입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 밑줄\u003c/b>find ___ necessary to tell white lies에서 목적어 자리에 to부정사가 오므로 \u003cb class=\"key\">가목적어 it\u003c/b>을 씁니다. that은 이 자리에 올 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">세 번째 밑줄\u003c/b>접속사 when절의 주어 자리이므로 주격이 필요하고, 가리키는 말이 your friends로 복수이므로 \u003cb class=\"key\">they\u003c/b>입니다. them은 목적격이라 주어가 될 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">전체 확인\u003c/b>고친 문장을 다시 읽어 가주어 it, 가목적어 it, 주격 they가 각자 제자리에 있는지 확인합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) to tell (2) it (3) they\u003c/span>\u003cdiv class=\"p-full\">We teach our children from a young age that it is wrong to tell a lie. However, as adults we often find it necessary to tell white lies to avoid hurting somebody's feelings. When your friends ask for your opinion, they sometimes want reassurance, not honest criticism.\u003c/div>\u003cdiv class=\"p-ko\">우리는 어릴 때부터 아이들에게 거짓말을 하는 것은 옳지 않다고 가르친다. 그러나 어른이 되면 누군가의 기분을 상하게 하지 않으려고 선의의 거짓말을 하는 것이 필요하다고 느낀다. 친구들이 네 의견을 물을 때, 그들은 때로 정직한 비판이 아니라 안심시키는 말을 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>접속사 뒤라고 해서 무조건 목적격 them을 쓰면 안 됩니다. 주어 자리인지부터 확인하세요.\u003c/div>","segs":[{"n":68,"text":"먼저 첫 번째 밑줄을 볼게요. it이 가주어로 서 있고, 진짜 주어는 뒤에 와야 하는 구조예요. 그래서 동사원형 tell이 아니라 to tell, 이렇게 to부정사로 고쳐 주면 됩니다.","hl":"st-0"},{"n":69,"text":"두 번째는 find 다음 자리예요. 뒤에 necessary to tell, 그리고 to부정사가 길게 이어지죠. 이때 목적어 자리에는 가목적어 it을 세워야 하고, that은 여기에 쓸 수 없어요.","hl":"st-1"},{"n":70,"text":"세 번째는 when절의 주어 자리예요. 앞에 나온 your friends를 가리키니까 복수 주격이 필요하겠죠. them은 목적격이라 주어 자리에 앉을 수 없습니다. 그래서 they로 고쳐요.","hl":"st-2"},{"n":71,"text":"마지막으로 세 군데를 모두 넣고 처음부터 읽어 보세요. 가주어 it, 가목적어 it, 주격 they가 각자 제자리에 잘 들어가 있으면 끝입니다.","hl":"st-3"},{"n":72,"text":"이 문제의 함정도 짚고 갈게요. 접속사 뒤라고 해서 무조건 목적격 them을 쓰면 안 됩니다. 주어 자리인지부터 확인하세요.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">I have recorded Jerome playing basketball and making moves that are beyond a player of (1) \u003cu class=\"p-u\">him\u003c/u> age. He is talented enough to become a professional player. Jerome is now as tall as me and has long fingers. (2) \u003cu class=\"p-u\">Their\u003c/u> basketball skills have improved a lot, and his shot and dribbling are much better than (3) \u003cu class=\"p-u\">me\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) his (2) His (3) mine\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":73,"text":"마지막 지문 문제예요. 대명사가 무엇을 가리키는지, 무엇과 무엇을 비교하는지 표시하면서 읽어 보세요.","hl":"q"},{"n":74,"text":"","hl":"q","pause":7},{"n":75,"text":"첫 번째는 his, 두 번째는 His, 세 번째는 mine으로 고칩니다. 명사 앞은 소유격, 사람을 받을 때는 단수 남성, 비교 대상은 소유대명사로 맞춰 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">I have recorded Jerome playing basketball and making moves that are beyond a player of (1) \u003cu class=\"p-u\">him\u003c/u> age. He is talented enough to become a professional player. Jerome is now as tall as me and has long fingers. (2) \u003cu class=\"p-u\">Their\u003c/u> basketball skills have improved a lot, and his shot and dribbling are much better than (3) \u003cu class=\"p-u\">me\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">첫 번째 밑줄\u003c/b>a player of ___ age에서 뒤에 \u003cb class=\"key\">명사 age\u003c/b>가 있으므로 소유격 \u003cb class=\"key\">his\u003c/b>가 필요합니다. him은 목적격이라 명사를 꾸밀 수 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">두 번째 밑줄\u003c/b>Their는 Jerome을 받을 수 없습니다. Jerome은 \u003cb class=\"key\">단수·남성\u003c/b>이므로 \u003cb class=\"key\">His\u003c/b>로 고치고, 문장 첫머리이므로 대문자로 시작합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">세 번째 밑줄\u003c/b>비교 대상은 Jerome의 슛과 드리블에 대응하는 「나의 슛과 드리블」이므로 \u003cb class=\"key\">mine\u003c/b>입니다. me는 사람이라 비교 대상이 어긋납니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">전체 확인\u003c/b>his age, His basketball skills, better than mine으로 모두 고쳐 문장을 다시 읽어 봅니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) his (2) His (3) mine\u003c/span>\u003cdiv class=\"p-full\">I have recorded Jerome playing basketball and making moves that are beyond a player of his age. He is talented enough to become a professional player. Jerome is now as tall as me and has long fingers. His basketball skills have improved a lot, and his shot and dribbling are much better than mine.\u003c/div>\u003cdiv class=\"p-ko\">나는 제롬이 농구를 하고 자기 나이의 선수로서는 믿기 힘든 움직임을 하는 것을 영상으로 담았다. 그는 프로 선수가 될 만큼 재능이 있다. 제롬은 이제 나만큼 키가 크고 손가락도 길다. 그의 농구 실력은 많이 늘었고, 그의 슛과 드리블은 나보다 훨씬 낫다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>세 번째에서 as tall as me가 눈에 밟혀 me를 그대로 두기 쉽습니다. 밑줄 친 곳은 비교 대상이 슛과 드리블이라는 점을 보세요.\u003c/div>","segs":[{"n":76,"text":"첫 번째 밑줄을 보세요. 뒤에 age라는 명사가 딱 붙어 있죠. 명사 앞에는 소유격이 와야 하니까 his가 맞습니다. him은 목적격이라 명사를 꾸밀 수 없어요.","hl":"st-0"},{"n":77,"text":"두 번째는 대명사가 누구를 받는지 봐야 해요. 바로 Jerome, 한 사람이죠. 그러면 복수 Their는 안 되고 단수 남성 His가 맞습니다. 문장 첫머리니까 대문자로 시작하는 것도 잊지 마세요.","hl":"st-1"},{"n":78,"text":"세 번째는 비교 구문이에요. his shot and dribbling과 비교되는 건 나의 슛과 드리블이겠죠. 그러면 mine을 써야 합니다. me를 쓰면 슛과 사람을 비교하는 이상한 문장이 돼요.","hl":"st-2"},{"n":79,"text":"세 군데를 모두 고쳐서 읽어 보면 훨씬 자연스러워집니다. his age, His basketball skills, better than mine, 이렇게 정리해 두세요.","hl":"st-3"},{"n":80,"text":"이 문제의 함정도 짚고 갈게요. 세 번째에서 as tall as me가 눈에 밟혀 me를 그대로 두기 쉽습니다. 밑줄 친 곳은 비교 대상이 슛과 드리블이라는 점을 보세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">인칭대명사(수·성 일치) / 가주어·가목적어 it / 비교 구문의 비교 대상\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>주어가 and로 연결되면 복수로 보고 대명사도 \u003cb class=\"key\">their\u003c/b>, \u003cb class=\"key\">they\u003c/b>, \u003cb class=\"key\">them\u003c/b>으로 맞춘다.\u003c/li>\u003cli>to부정사나 that절이 주어·목적어 자리에 오면 \u003cb class=\"key\">가주어 it\u003c/b>, \u003cb class=\"key\">가목적어 it\u003c/b>을 세우고 가목적어는 항상 단수 it이다.\u003c/li>\u003cli>명사 앞에는 소유격(his age), 명사 없이 혼자면 소유대명사(hers, mine)를 쓴다.\u003c/li>\u003cli>비교 구문에서는 계획과 계획, 실력과 실력처럼 \u003cb class=\"key\">같은 종류\u003c/b>끼리 비교해야 하므로 me가 아니라 mine을 쓴다.\u003c/li>\u003cli>대명사가 나오면 반드시 \u003cb class=\"key\">선행사\u003c/b>를 되짚어 인칭·수·성을 확인한다.\u003c/li>\u003c/ul>","segs":[{"n":81,"text":"오늘 문제들을 관통하는 열쇠는 결국 하나예요. 대명사가 무엇을 가리키는지, 그리고 그 자리가 주어인지 목적어인지 확인하는 것. 가주어와 가목적어 it은 뒤에 진짜 주어나 목적어가 남아 있는지로 판단하면 절대 헷갈리지 않습니다. 비교 구문에서는 사람이 아니라 소유대명사를 쓴다는 점, 꼭 기억하고 다음 단원에서 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
