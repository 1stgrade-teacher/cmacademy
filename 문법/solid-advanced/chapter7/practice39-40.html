    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 7 Basic Practice (포인트 39-40)","audioDir":"practice39-40_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">수량 표현, 가산·불가산 명사, another/the other/others, 주어-동사 수일치\u003c/div>\u003ch1>Chapter 7 Basic Practice 포인트 39-40 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 어법 판단 및 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 수량 표현과 가산 명사와 불가산 명사, another와 the other, 그리고 주어와 동사의 수일치를 다루는 기본 연습 문제를 풀어 볼 거예요. 선택지가 있는 문제부터 밑줄 고치기 문제까지 차근차근 확인해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어-동사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사는 주어의 핵심 명사에 맞춘다. \u003cb class=\"key\">of\u003c/b> 뒤 명사가 수일치 기준이 되고, \u003cb class=\"key\">each/everyone\u003c/b>은 단수로 취급한다.\u003cdiv>\u003cspan class=\"g-formula\">단수 주어 + 단수 동사 / 복수 주어 + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>all/most/some of + 복수 명사 → 복수 동사\u003c/li>\u003cli>all/most of + 불가산 명사 → 단수 동사\u003c/li>\u003cli>each/everyone/every + 단수 동사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Most of the students are excited.\u003c/div>\u003cdiv class=\"g-ko\">대부분의 학생들은 신이 났다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Most of the water is clean.\u003c/div>\u003cdiv class=\"g-ko\">대부분의 물은 깨끗하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Each of the shops has its own products.\u003c/div>\u003cdiv class=\"g-ko\">그 가게들 각각은 자기만의 상품을 가지고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"주어와 동사의 수일치는 동사의 주어가 무엇인지 정확히 찾는 데서 시작해요. all, most, some of 같은 표현이 나오면 of 뒤에 있는 명사가 실제 수일치 기준이 됩니다. 그 명사가 복수면 복수 동사를, 불가산 명사나 단수 명사면 단수 동사를 골라야 해요. ea  보세요.","hl":"st-0"},{"n":20,"text":"luggage는 셀 수 없는 명사라서 복수형으로 luggages라고 쓰지 않습니다. 그대로 luggage를 써야 해요.","hl":"st-1"},{"n":21,"text":"이 문제의 함정도 짚고 갈게요. luggage는 셀 수 없어서 -s를 붙이지 않는다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">another, the other, others 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">another\u003c/b>는 불특정한 하나 더, \u003cb class=\"key\">the other\u003c/b>는 정해진 나머지 하나, \u003cb class=\"key\">others\u003c/b>는 불특정한 다른 사람·것들이다.\u003cdiv>\u003cspan class=\"g-formula\">one ... the other (둘 중), some ... others (여럿 중)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>another + 단수 명사\u003c/li>\u003cli>둘 중 나머지 하나는 the other\u003c/li>\u003cli>복수 명사 앞의 '다른'은 other\u003c/li>\u003cli>others는 명사 없이 단독으로 쓰는 복수 대명사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have two bags: one is red, the other is blue.\u003c/div>\u003cdiv class=\"g-ko\">나는 가방이 두 개 있다. 하나는 빨간색이고 다른 하나는 파란색이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Would you like another cup?\u003c/div>\u003cdiv class=\"g-ko\">한 잔 더 마실래요?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Some like tea, and others like coffee.\u003c/div>\u003cdiv class=\"g-ko\">어떤 사람들은 차를 좋아하고 다른 사람들은 커피를 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">There are many other teams.\u003c/div>\u003cdiv class=\"g-ko\">다른 팀들이 많이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":22,"text":"another, the other, others는 해석이 비슷해서 헷갈리기 쉬운 표현이에요. another는 정해지지 않은 하나 더를 말할 때 단수 명사 앞에 씁니다. the other는 둘 중에서 정해진 나머지 하나를 가리키고, one과 짝을 이루어 one은 하나, the other는 나머지 하나로 정리할 수 있어요. others는 명사 없이 단독으로 쓰여서 다른 사람들이나 다른 것들을 뜻하는 복수 대명사입니다. 복수 명사 앞에 다른이라는 뜻을 붙일 때는 other를 쓴다는 점도 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The program is divided into two parts: one for kids aged 5-7, \u003cspan class=\"p-box\">\u003cspan>another\u003c/span>\u003ci>/\u003c/i>\u003cspan>the other\u003c/span>\u003c/span> for teenagers.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">another\u003c/div>\u003cdiv class=\"p-op\">the other\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">the other\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"네 번째 문제는 두 부분으로 나뉜 프로그램에서 하나는 어린이용, 나머지 하나는 청소년용이라고 말하는 문장이에요. 둘 중 나머지를 받을 때 어떤 표현을 쓰는지 생각해 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":7},{"n":25,"text":"정답은 the other예요. 두 부분 중 하나를 one으로 받았으니 나머지 하나는 정해진 대상이라 the other로 받아야 해요. another는 정해지지 않은 하나 더를 말할 때 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-4\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The program is divided into two parts: one for kids aged 5-7, \u003cspan class=\"p-box\">\u003cspan>another\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">the other\u003c/span>\u003c/span> for teenagers.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">another\u003c/div>\u003cdiv class=\"p-op\">the other\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">두 부분 확인\u003c/b>the program is divided into two parts라고 했으니 두 부분 중 하나와 나머지 하나의 관계이다.\u003c/div>\u003cdiv cla
