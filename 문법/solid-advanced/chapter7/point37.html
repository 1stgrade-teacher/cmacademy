window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"접속사 that","title":"Chapter 7 출제 포인트 37 that vs. those it vs. one","audioDir":"point37_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 7 출제 포인트 37 that vs. those / it vs. one\u003c/div>\u003ch1>that vs. those, it vs. one 완벽 구별\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>that·those와 it·one의 차이를 예문으로 익혀 앞에 나온 명사를 알맞게 받아 쓰는 능력을 기른다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 that과 those, 그리고 it과 one을 구별하는 문법을 배워 볼 거예요. 앞에 나온 명사를 다시 말할 때 어떤 표현을 골라야 하는지 예문으로 차근차근 익혀 봅시다. 비교할 때와 같은 종류의 하나를 말할 때 헷갈리기 쉬우니 오늘 확실히 정리해요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">that vs. those: 앞에 나온 명사를 받는 지시대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 명사를 반복하지 않기 위해 \u003cb class=\"key\">that\u003c/b>은 단수 명사를, \u003cb class=\"key\">those\u003c/b>는 복수 명사를 받아요. 주로 비교 구문에서 '~의 것'이라는 뜻으로 쓰여요.\u003cdiv>\u003cspan class=\"g-formula\">단수 명사 → that / 복수 명사 → those\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The climate of Korea is different from \u003cspan class=\"fx\">that\u003c/span> of Japan.\u003c/div>\u003cdiv class=\"g-ko\">한국의 기후는 일본의 기후와 다르다.\u003c/div>\u003cdiv class=\"g-note\">단수 명사 climate를 반복하지 않고 that으로 받았어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The ears of a rabbit are longer than \u003cspan class=\"fx\">those\u003c/span> of a fox.\u003c/div>\u003cdiv class=\"g-ko\">토끼의 귀는 여우의 귀보다 더 길다.\u003c/div>\u003cdiv class=\"g-note\">복수 명사 ears를 those로 받았어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The population of Seoul is larger than \u003cspan class=\"fx\">that\u003c/span> of Busan.\u003c/div>\u003cdiv class=\"g-ko\">서울의 인구는 부산의 인구보다 더 많다.\u003c/div>\u003cdiv class=\"g-note\">단수 명사 population을 that으로 받았어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The apples in this box are sweeter than \u003cspan class=\"fx\">those\u003c/span> in that box.\u003c/div>\u003cdiv class=\"g-ko\">이 상자에 있는 사과들이 저 상자에 있는 사과들보다 더 달다.\u003c/div>\u003cdiv class=\"g-note\">복수 명사 apples를 those로 받았어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>비교 대상의 명사가 단수인지 복수인지 먼저 확인하고 \u003cb class=\"key\">that\u003c/b>과 \u003cb class=\"key\">those\u003c/b>를 골라야 해요.\u003c/div>","segs":[{"n":2,"text":"앞에서 이미 나온 명사를 다시 말할 때 같은 말을 반복하면 문장이 길어지고 어색해질 수 있어요. 이때 단수 명사는 that으로, 복수 명사는 those로 받아 줍니다. 특히 비교 구문에서 that은 앞에 나온 단수 명사를, those는 앞에 나온 복수 명사를 가리키는 경우가 많아요. 그래서 뒤에 오는 명사의 수를 잘 확인하는 게 중요합니다.","hl":"rule"},{"n":3,"text":"The climate of Korea is different from that of Japan. 이 문장은 한국의 기후는 일본의 기후와 다르다는 뜻이에요. 앞에 나온 단수 명사 climate를 다시 말하지 않고 that으로 받은 점을 보세요.","hl":"ex-0"},{"n":4,"text":"The ears of a rabbit are longer than those of a fox. 이 문장은 토끼의 귀는 여우의 귀보다 더 길다는 뜻이에요. 앞에 나온 복수 명사 ears를 those로 받아 반복을 피했어요.","hl":"ex-1"},{"n":5,"text":"The population of Seoul is larger than that of Busan. 이 문장은 서울의 인구는 부산의 인구보다 더 많다는 뜻이에요. 단수 명사 population을 that으로 받았습니다.","hl":"ex-2"},{"n":6,"text":"The apples in this box are sweeter than those in that box. 이 문장은 이 상자에 있는 사과들이 저 상자에 있는 사과들보다 더 달다는 뜻이에요. 복수 명사 apples를 those로 받은 점을 기억하세요.","hl":"ex-3"},{"n":7,"text":"팁이 하나 있어요. 비교 문장에서는 앞에 나온 명사가 단수인지 복수인지 먼저 확인하세요. 단수면 that, 복수면 those를 골라야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">it vs. one: 특정한 것과 같은 종류의 하나\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">it\u003c/b>은 앞에 나온 특정한 명사를 그대로 가리켜요. \u003cb class=\"key\">one\u003c/b>은 앞에 나온 명사와 같은 종류의 불특정한 하나를 가리켜요.\u003cdiv>\u003cspan class=\"g-formula\">특정한 것 → it / 같은 종류의 하나 → one\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I lost my umbrella, so I need to buy \u003cspan class=\"fx\">one\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 우산을 잃어버려서 하나 사야 한다.\u003c/div>\u003cdiv class=\"g-note\">잃어버린 우산이 아니라 같은 종류의 우산 하나를 뜻해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I found your phone. Is \u003cspan class=\"fx\">it\u003c/span> yours?\u003c/div>\u003cdiv class=\"g-ko\">네 휴대폰을 찾았어. 이거 네 거야?\u003c/div>\u003cdiv class=\"g-note\">앞에 나온 특정한 phone을 가리켜요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I don't like this shirt. Can you show me another \u003cspan class=\"fx\">one\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">나는 이 셔츠가 마음에 들지 않아. 다른 것 하나를 보여 줄래?\u003c/div>\u003cdiv class=\"g-note\">셔츠와 같은 종류의 다른 하나를 뜻해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">The cake was delicious, so I ate \u003cspan class=\"fx\">it\u003c/span> all.\u003c/div>\u003cdiv class=\"g-ko\">그 케이크는 맛있어서 나는 그것을 다 먹었다.\u003c/div>\u003cdiv class=\"g-note\">앞에 나온 특정한 cake를 가리켜요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">it\u003c/b>은 '그것'처럼 이미 정해진 대상을, \u003cb class=\"key\">one\u003c/b>은 '그런 것 하나'처럼 정해지지 않은 대상을 가리킨다고 기억하세요.\u003c/div>","segs":[{"n":8,"text":"이번에는 it과 one을 구별해 볼게요. it은 앞에 나온 특정한 명사, 즉 이미 정해진 바로 그 대상을 가리켜요. 반면 one은 앞에 나온 명사와 같은 종류의 하나를 새로 말할 때 써요. 그래서 내 우산을 잃어버리고 새로 하나 살 때는 one을 쓰고, 내가 찾은 바로 그 휴대폰을 말할 때는 it을 씁니다.","hl":"rule"},{"n":9,"text":"I lost my umbrella, so I need to buy one. 이 문장은 나는 우산을 잃어버려서 하나 사야 한다는 뜻이에요. 잃어버린 우산 자체가 아니라 같은 종류의 우산 하나를 말하므로 one을 써요.","hl":"ex-0"},{"n":10,"text":"I found your phone. Is it yours? 이 문장은 네 휴대폰을 찾았어. 이거 네 거야?라는 뜻이에요. 앞에 나온 특정한 phone을 가리키므로 it을 써요.","hl":"ex-1"},{"n":11,"text":"I don't like this shirt. Can you show me another one? 이 문장은 나는 이 셔츠가 마음에 들지 않아. 다른 것 하나를 보여 줄래?라는 뜻이에요. 셔츠와 같은 종류의 다른 하나를 뜻하므로 one을 써요.","hl":"ex-2"},{"n":12,"text":"The cake was delicious, so I ate it all. 이 문장은 그 케이크는 맛있어서 나는 그것을 다 먹었다는 뜻이에요. 앞에 나온 특정한 cake를 가리키므로 it을 써요.","hl":"ex-3"},{"n":13,"text":"팁이 하나 있어요. it은 그것처럼 이미 정해진 대상을 가리키고, one은 그런 것 하나처럼 정해지지 않은 대상을 가리킨다고 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">that·those와 it·one의 선택 기준\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">비교 문장에서 앞 명사의 반복을 피할 때는 \u003cb class=\"key\">that\u003c/b>과 \u003cb class=\"key\">those\u003c/b>를 써요. 같은 종류의 하나를 새로 고를 때는 \u003cb class=\"key\">one\u003c/b>을 쓰고, 이미 정해진 대상은 it으로 받아요.\u003cdiv>\u003cspan class=\"g-formula\">비교 대상의 반복 → that·those / 같은 종류의 선택 → one / 특정 대상 → it\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The weather in Busan is warmer than \u003cspan class=\"fx\">that\u003c/span> in Seoul.\u003c/div>\u003cdiv class=\"g-ko\">부산의 날씨는 서울의 날씨보다 더 따뜻하다.\u003c/div>\u003cdiv class=\"g-note\">비교 문장에서 단수 명사 weather를 that으로 받았어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I need a pen. Can you lend me \u003cspan class=\"fx\">one\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">나는 펜이 필요하다. 하나 빌려 줄 수 있니?\u003c/div>\u003cdiv class=\"g-note\">같은 종류의 펜 하나를 뜻해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">The food was great. I really enjoyed \u003cspan class=\"fx\">it\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 음식은 훌륭했다. 나는 그것을 정말 즐겼다.\u003c/div>\u003cdiv class=\"g-note\">앞에 나온 특정한 food를 가리켜요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">These shoes are expensive, but \u003cspan class=\"fx\">those\u003c/span> in the window are cheap.\u003c/div>\u003cdiv class=\"g-ko\">이 신발들은 비싸지만 진열장에 있는 저 신발들은 싸다.\u003c/div>\u003cdiv class=\"g-note\">복수 명사 shoes를 those로 받았어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>셀 수 없는 명사는 \u003cb class=\"key\">one\u003c/b>으로 받을 수 없고 \u003cb class=\"key\">that\u003c/b>으로 받아야 해요.\u003c/div>","segs":[{"n":14,"text":"이제 선택 기준을 정리해 볼게요. 비교 문장에서 앞 명사의 반복을 피할 때는 that과 those를 사용해요. 같은 종류의 하나를 새로 고를 때는 one을 쓰고, 이미 정해진 대상을 그대로 가리킬 때는 it을 써요. 문장에서 무엇을 가리키는지 먼저 생각하면 답이 보일 거예요.","hl":"rule"},{"n":15,"text":"The weather in Busan is warmer than that in Seoul. 이 문장은 부산의 날씨는 서울의 날씨보다 더 따뜻하다는 뜻이에요. 비교 문장에서 단수 명사 weather를 that으로 받았어요.","hl":"ex-0"},{"n":16,"text":"I need a pen. Can you lend me one? 이 문장은 나는 펜이 필요하다. 하나 빌려 줄 수 있니?라는 뜻이에요. 같은 종류의 펜 하나를 말하므로 one을 써요.","hl":"ex-1"},{"n":17,"text":"The food was great. I really enjoyed it. 이 문장은 그 음식은 훌륭했다. 나는 그것을 정말 즐겼다는 뜻이에요. 앞에 나온 특정한 food를 가리키므로 it을 써요.","hl":"ex-2"},{"n":18,"text":"These shoes are expensive, but those in the window are cheap. 이 문장은 이 신발들은 비싸지만 진열장에 있는 저 신발들은 싸다는 뜻이에요. 복수 명사 shoes를 those로 받았어요.","hl":"ex-3"},{"n":19,"text":"마지막으로 셀 수 없는 명사는 one으로 받을 수 없고 that으로 받아야 해요. 예를 들어 water나 population 같은 명사는 하나둘 세는 대상이 아니므로 that으로 받는다고 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The cars in Korea are smaller than that in the United States.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The cars in Korea are smaller than those in the United States.\u003c/div>\u003cdiv class=\"g-why\">복수 명사 cars를 받으므로 that이 아니라 those를 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I need a pencil. Can you lend me it?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I need a pencil. Can you lend me one?\u003c/div>\u003cdiv class=\"g-why\">특정한 것이 아니라 같은 종류의 연필 하나를 뜻하므로 one을 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The water in this bottle is cleaner than one in that bottle.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The water in this bottle is cleaner than that in that bottle.\u003c/div>\u003cdiv class=\"g-why\">단수 명사 water를 받으므로 one이 아니라 that을 써야 해요.\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 문장에서는 cars가 복수인데 that을 썼기 때문에 틀렸어요. 복수 명사를 받을 때는 those를 써야 하므로 those in the United States가 되어야 합니다.","hl":"mk-0"},{"n":21,"text":"두 번째 문장은 연필 하나를 빌려 달라는 말이에요. 여기서는 이미 정해진 연필이 아니라 같은 종류의 연필 하나를 뜻하므로 it이 아니라 one을 써야 합니다.","hl":"mk-1"},{"n":22,"text":"세 번째 문장에서 water는 셀 수 없는 명사예요. 이런 명사는 one으로 받을 수 없고 that으로 받아야 하므로 that in that bottle이 되어야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The population of Seoul is larger than ____ of Busan.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>those\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>it\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>one\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003cdiv class=\"g-exp\">단수 명사 population을 받으므로 that을 써야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"첫 번째 문제예요. The population of Seoul is larger than 빈칸 of Busan. 빈칸에 알맞은 표현을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 첫 번째 보기인 that이에요. 앞에 나온 population이 단수 명사이므로 that으로 받아야 해요. those는 복수 명사를 받을 때 쓰고, one은 같은 종류의 하나를 말할 때 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 대화의 빈칸에 알맞은 것을 고르세요 ">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">I found your phone. Is one yours?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I found your phone. Is it yours?\u003c/span>\u003cdiv class=\"g-exp\">특정한 phone을 가리키므로 one이 아니라 it을 써야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":32,"text":"네 번째 문제예요. I found your phone. Is one yours? 이 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":33,"text":"","hl":"q","pause":6},{"n":34,"text":"정답은 Is it yours예요. 앞에 나온 your phone은 특정한 대상이므로 one이 아니라 it으로 받아야 해요. one은 같은 종류의 불특정한 하나를 말할 때 써요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어들을 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">The / climate / of / Korea / is / different / from / that / of / Japan\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The climate of Korea is different from that of Japan.\u003c/span>\u003cdiv class=\"g-exp\">단수 명사 climate를 that으로 받아 비교 문장을 완성해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":35,"text":"다섯 번째 문제는 단어 배열이에요. 제시된 단어들을 바르게 배열해서 비교 문장을 완성해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":36,"text":"","hl":"q","pause":6},{"n":37,"text":"정답은 The climate of Korea is different from that of Japan이에요. 앞에 나온 단수 명사 climate를 반복하지 않고 that으로 받았어요. 비교 문장에서는 이렇게 that이나 those로 앞 명사를 받는다는 점을 기억하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">나는 펜이 필요하다. 같은 종류의 펜 하나를 빌려 줄 수 있니?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I need a pen. Can you lend me one?\u003c/span>\u003cdiv class=\"g-exp\">같은 종류의 펜 하나를 뜻하므로 one을 써요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"여섯 번째 문제는 영작이에요. 나는 펜이 필요하다. 같은 종류의 펜 하나를 빌려 줄 수 있니? 이 문장을 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 I need a pen. Can you lend me one?이에요. 여기서는 특정한 펜이 아니라 같은 종류의 펜 하나를 말하므로 one을 써요. it을 쓰면 이미 정해진 펜을 가리키게 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 7 출제 포인트 37 that vs. those / it vs. one\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>앞에 나온 단수 명사는 \u003cb class=\"key\">that\u003c/b>, 복수 명사는 \u003cb class=\"key\">those\u003c/b>로 받아요.\u003c/li>\u003cli>특정한 대상은 \u003cb class=\"key\">it\u003c/b>, 같은 종류의 불특정한 하나는 \u003cb class=\"key\">one\u003c/b>으로 받아요.\u003c/li>\u003cli>비교 구문에서는 앞 명사의 \u003cb class=\"key\">수\u003c/b>를 먼저 확인해요.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":41,"text":"오늘은 that과 those, 그리고 it과 one을 구별하는 방법을 배웠어요. 앞에 나온 명사가 단수면 that, 복수면 those로 받고, 특정한 대상은 it, 같은 종류의 하나는 one으로 받는다는 점을 기억하세요. 비교 문장에서는 명사의 수를 먼저 확인하는 습관을 들이면 실수를 줄일 수 있을 거예요. 오늘도 수고했어요.","hl":"sum"}]}],"practice":{"unit":"Chapter 7 출제 포인트 37 that vs. those / it vs. one","level":"고1·2","ctx":"단원: Chapter 7 출제 포인트 37 that vs. those / it vs. one\n강의 제목: that vs. those, it vs. one 완벽 구별\n목표: that·those와 it·one의 차이를 예문으로 익혀 앞에 나온 명사를 알맞게 받아 쓰는 능력을 기른다.\n개념 1. that vs. those: 앞에 나온 명사를 받는 지시대명사: 앞에 나온 명사를 반복하지 않기 위해 that은 단수 명사를, those는 복수 명사를 받아요. 주로 비교 구문에서 '~의 것'이라는 뜻으로 쓰여요. [단수 명사 → that / 복수 명사 → those] (주의: 비교 대상의 명사가 단수인지 복수인지 먼저 확인하고 that과 those를 골라야 해요.)\n  예문: The climate of Korea is different from that of Japan. (한국의 기후는 일본의 기후와 다르다.) / The ears of a rabbit are longer than those of a fox. (토끼의 귀는 여우의 귀보다 더 길다.) / The population of Seoul is larger than that of Busan. (서울의 인구는 부산의 인구보다 더 많다.) / The apples in this box are sweeter than those in that box. (이 상자에 있는 사과들이 저 상자에 있는 사과들보다 더 달다.)\n개념 2. it vs. one: 특정한 것과 같은 종류의 하나: it은 앞에 나온 특정한 명사를 그대로 가리켜요. one은 앞에 나온 명사와 같은 종류의 불특정한 하나를 가리켜요. [특정한 것 → it / 같은 종류의 하나 → one] (주의: it은 '그것'처럼 이미 정해진 대상을, one은 '그런 것 하나'처럼 정해지지 않은 대상을 가리킨다고 기억하세요.)\n  예문: I lost my umbrella, so I need to buy one. (나는 우산을 잃어버려서 하나 사야 한다.) / I found your phone. Is it yours? (네 휴대폰을 찾았어. 이거 네 거야?) / I don't like this shirt. Can you show me another one? (나는 이 셔츠가 마음에 들지 않아. 다른 것 하나를 보여 줄래?) / The cake was delicious, so I ate it all. (그 케이크는 맛있어서 나는 그것을 다 먹었다.)\n개념 3. that·those와 it·one의 선택 기준: 비교 문장에서 앞 명사의 반복을 피할 때는 that과 those를 써요. 같은 종류의 하나를 새로 고를 때는 one을 쓰고, 이미 정해진 대상은 it으로 받아요. [비교 대상의 반복 → that·those / 같은 종류의 선택 → one / 특정 대상 → it] (주의: 셀 수 없는 명사는 one으로 받을 수 없고 that으로 받아야 해요.)\n  예문: The weather in Busan is warmer than that in Seoul. (부산의 날씨는 서울의 날씨보다 더 따뜻하다.) / I need a pen. Can you lend me one? (나는 펜이 필요하다. 하나 빌려 줄 수 있니?) / The food was great. I really enjoyed it. (그 음식은 훌륭했다. 나는 그것을 정말 즐겼다.) / These shoes are expensive, but those in the window are cheap. (이 신발들은 비싸지만 진열장에 있는 저 신발들은 싸다.)\n자주 하는 실수: The cars in Korea are smaller than that in the United States. → The cars in Korea are smaller than those in the United States. / I need a pencil. Can you lend me it? → I need a pencil. Can you lend me one? / The water in this bottle is cleaner than one in that bottle. → The water in this bottle is cleaner than that in that bottle.\n정리: 앞에 나온 단수 명사는 that, 복수 명사는 those로 받아요. / 특정한 대상은 it, 같은 종류의 불특정한 하나는 one으로 받아요. / 비교 구문에서는 앞 명사의 수를 먼저 확인해요.","items":[{"t":"choose","q":"다음 중 \u003c보기>의 밑줄 친 부분과 쓰임이 같은 것 두 개를 고르세요.","ref":"I need a new notebook, so I will buy [[one]] tomorrow.","opts":["My old watch is broken, so I need to buy [[one]].","Your phone is on the desk. Please bring [[it]] to me.","The chairs in this room are more comfortable than [[those]] in the hall.","This hat is nice, but I want a cheaper [[one]].","The soup in this bowl is tastier than [[that]] in the pot."],"ans":[1,4],"exp":"\u003c보기>와 ①, ④의 one은 앞에 나온 명사와 같은 종류의 불특정한 하나를 가리켜요. ②의 it은 특정한 대상을, ③의 those와 ⑤의 that은 비교 구문에서 앞 명사의 반복을 피하는 지시대명사예요."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"The roads in this city are wider than that in the village.","wrong":"that","right":["those"],"exp":"앞에 나온 The roads가 복수이므로 비교 구문에서는 복수 명사를 받는 those를 써야 해요."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["that","those","it","one"],"items":[{"s":"The price of this laptop is lower than ____ of the older model.","a":"that"},{"s":"The trees in our yard are taller than ____ in the park.","a":"those"},{"s":"I need a new brush. Can you buy me ____?","a":"one"},{"s":"Your ticket is on the table. Don't forget to bring ____.","a":"it"}],"exp":"단수 명사 price는 that, 복수 명사 trees는 those로 받고, 같은 종류의 불특정한 하나는 one, 이미 정해진 대상은 it으로 받아요."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"The water in this lake is cleaner than","r":"that in the river."},{"l":"The shoes in this store are more expensive than","r":"those in the market."},{"l":"I forgot to bring a pencil. Could you lend me","r":"one?"},{"l":"Your phone is on the desk. Please bring","r":"it to me."}],"exp":"호수 물(단수·불가산)은 that, 신발(복수)은 those로 받고, 같은 종류의 하나는 one, 이미 정해진 phone은 it으로 받아요."},{"t":"scene","q":"상황을 보고 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"Your umbrella is wet. Please put [[it]] in the corner.","hint":"(it)"},"items":[{"scene":"👕🙅 이 셔츠가 작아서 더 큰 것을 요청하는 손님","pre":"This shirt is too small. Do you have","post":"?","hint":"(a bigger one)","a":["a bigger one"]}],"exp":"앞에 나온 shirt와 같은 종류의 불특정한 하나를 가리키므로 one을 써요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"The milk in this glass is colder than [[one]] in the bottle.","ok":false,"right":["that"],"exp":"milk는 셀 수 없는 명사라 one으로 받을 수 없고, 비교 구문에서는 that으로 받아야 해요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"이 마을의 거리들은 도시의 거리들보다 더 좁다.","chunks":["The streets in this town","are narrower than","those in the city"],"end":".","alts":[],"exp":"앞에 나온 The streets가 복수이므로 비교 구문에서 those로 받아요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"The flowers in this garden are more colorful than [[those]] in the park.","ok":true,"right":[],"exp":"앞에 나온 The flowers가 복수이므로 비교 구문에서 those로 받는 것이 알맞아요."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}

  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){

    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();

      var cb=main.querySelector('[data-a="code"]');if(cb)cb.onclick=function(){var v=main.querySelector(".pq-code input").value.trim();if(!v)return;try{localStorage.setItem("cm-chat-code",v);}catch(_){}main.querySelector(".pq-code").hidden=true;more();};
    }
    function more(){
      if(S.busy)return;var m=main.querySelector(".pq-aimsg"),btn=main.querySelector('[data-a="ai"]');
      if(location.protocol==="file:"){m.className="pq-aimsg no";m.textContent="AI 새 문제는 강의를 사이트(인터넷 주소)에서 열었을 때 쓸 수 있어요.";return;}
      S.busy=true;if(btn)btn.disabled=true;m.className="pq-aimsg";m.textContent="AI가 새 문제를 만드는 중이에요… 20~40초 정도 걸려요.";
      var code="";try{code=localStorage.getItem("cm-chat-code")||"";}catch(_){}
      var avoid=[];S.sets.forEach(function(x){x.items.forEach(function(it){avoid.push(plain(it.q+" "+(it.s||it.ref||(it.opts&&it.opts[0])||(it.items&&it.items[0]&&(it.items[0].s||it.items[0].post))||"")).slice(0,90));});});
      var body=JSON.stringify({ctx:s(P.ctx),level:s(P.level),unit:s(P.unit||D.title),n:opt.n||6,avoid:avoid.slice(-30),code:code}),t0=Date.now();
      var tm=setInterval(function(){m.textContent="AI가 새 문제를 만드는 중이에요… ("+Math.round((Date.now()-t0)/1000)+"초)";},1000);
      fetch(opt.api||"/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).then(function(res){
        var ct=res.headers.get("content-type")||"";
        if(!res.ok)return res.json().catch(function(){return {};}).then(function(j){if(j.error==="code"){main.querySelector(".pq-code").hidden=false;}throw new Error(j.msg||"새 문제를 받지 못했어요. 잠시 뒤 다시 해 주세요.");});
        if(ct.indexOf("application/json")>=0)return res.json();
        return res.text().then(function(t){var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("AI가 문제를 다 만들지 못했어요. 다시 눌러 주세요.");return JSON.parse(t.slice(a,b+1));});
      }).then(function(j){var L=norm(j);if(L.length<2)throw new Error("AI가 만든 문제가 알맞지 않아요. 다시 눌러 주세요.");
        S.sets.push({name:"AI 새 문제 "+S.sets.length,items:L});start(S.sets.length-1,null);
      }).catch(function(e){m.className="pq-aimsg no";m.textContent=(e&&e.message&&!/JSON|Unexpected|fetch/i.test(e.message))?e.message:"새 문제를 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.";if(btn)btn.disabled=false;
      }).then(function(){clearInterval(tm);S.busy=false;});
    }
    /* AI 조교(질문하기)에게: 아직 [정답 확인]을 하지 않은 문제는 답을 알려 주지 않도록 */
    window.__cmPQ={locked:function(){var L=[];S.sets.forEach(function(x){x.items.forEach(function(it){if(!it._done)L.push(it);});});return L;},
      current:function(){return root.hidden?null:S.list[S.idx]||null;}};
    return {open:open,close:close};
  }
