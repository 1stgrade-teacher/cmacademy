3c/b> 표현인지 먼저 확인하세요.\u003c/div>","segs":[{"n":6,"text":"이번에는 비인칭 it을 볼게요. 날씨나 시간, 거리, 명암처럼 특정한 사물을 가리키지 않는 상황에서도 it을 사용해요. 이때 it은 그것이라고 해석하지 않고 문장을 자연스럽게 만들어 주는 역할을 해요. 그래서 비인칭 it은 해석보다 문장의 종류를 먼저 떠올리는 것이 중요해요.","hl":"rule"},{"n":7,"text":"첫 번째 예문은 It is raining heavily outside. 예요. 뜻은 밖에 비가 많이 오고 있다는 거예요. 여기서 It은 비가 온다는 날씨 상황을 나타내는 비인칭 it이에요.","hl":"ex-0"},{"n":8,"text":"두 번째 예문은 It is ten minutes' walk from here to the station. 이에요. 뜻은 여기서 역까지 걸어서 십 분 거리라는 거죠. 이 It은 거리를 나타내는 비인칭 it이에요.","hl":"ex-1"},{"n":9,"text":"세 번째 예문은 It is already noon. 예요. 뜻은 벌써 정오라는 거예요. 여기서 It은 시간을 나타내는 비인칭 it이에요.","hl":"ex-2"},{"n":10,"text":"비인칭 it이 나오면 그것이라고 해석하려고 하지 말고, 날씨나 시간, 거리, 명암을 말하는 문장인지 먼저 살펴보세요. 해석보다 상황을 파악하는 것이 훨씬 중요해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">가주어 it과 가목적어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">to부정사\u003c/b>나 \u003cb class=\"key\">that절\u003c/b>이 주어나 목적어 자리에 오면 문장이 길어지므로, 그 자리에 \u003cb class=\"key\">가주어\u003c/b>나 \u003cb class=\"key\">가목적어\u003c/b> it을 쓰고 진짜 주어나 목적어는 뒤로 보냅니다.\u003cdiv>\u003cspan class=\"g-formula\">It + be + 형용사/명사 + to부정사/that절 / find·think·make + it + 형용사/명사 + to부정사/that절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It\u003c/span> is important to practice every day.\u003c/div>\u003cdiv class=\"g-ko\">매일 연습하는 것은 중요하다.\u003c/div>\u003cdiv class=\"g-note\">to practice every day가 진주어이고 it은 가주어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I found \u003cspan class=\"fx\">it\u003c/span> difficult to solve the problem.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 문제를 푸는 것이 어렵다고 느꼈다.\u003c/div>\u003cdiv class=\"g-note\">to solve the problem이 진목적어이고 it은 가목적어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">She made \u003cspan class=\"fx\">it\u003c/span> clear that she would leave.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 자신이 떠날 것임을 분명히 했다.\u003c/div>\u003cdiv class=\"g-note\">that절이 진목적어이고 it은 가목적어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가주어 it은 \u003cb class=\"key\">뒤의 to부정사·that절\u003c/b>이 진주어, 가목적어 it은 \u003cb class=\"key\">find·think·make\u003c/b> 뒤에서 진목적어를 받습니다.\u003c/div>","segs":[{"n":11,"text":"이제 시험에서 정말 자주 나오는 가주어 it과 가목적어 it을 볼게요. to부정사나 that절이 주어 자리에 그대로 오면 문장이 너무 길어지기 때문에, 그 자리에 it을 먼저 쓰고 진짜 주어는 뒤로 보내요. 목적어 자리에서도 find나 think, make 같은 동사 뒤에 it을 먼저 두고 진짜 목적어를 뒤로 보낼 수 있어요. 이때 it은 해석하지 않고, 뒤에 오는 to부정사나 that절이 진짜 주어나 목적어라는 점이 핵심이에요.","hl":"rule"},{"n":12,"text":"첫 번째 예문은 It is important to practice every day. 예요. 뜻은 매일 연습하는 것은 중요하다는 거예요. 여기서 It은 가주어이고, 진짜 주어는 뒤에 있는 to practice every day예요.","hl":"ex-0"},{"n":13,"text":"두 번째 예문은 I found it difficult to solve the problem. 이에요. 뜻은 나는 그 문제를 푸는 것이 어렵다고 느꼈다는 거죠. 여기서 it은 가목적어이고, 진짜 목적어는 to solve the problem이에요.","hl":"ex-1"},{"n":14,"text":"세 번째 예문은 She made it clear that she would leave. 예요. 뜻은 그녀는 자신이 떠날 것임을 분명히 했다는 거예요. 여기서 it은 가목적어이고, that she would leave가 진짜 목적어예요.","hl":"ex-2"},{"n":15,"text":"가주어인지 가목적어인지 헷갈릴 때는 it 뒤에 to부정사나 that절이 있는지, 그리고 앞에 find나 think, make 같은 동사가 있는지 확인해 보세요. 뒤에 있는 내용이 진짜 주어나 목적어라는 사실만 기억해도 많은 문제를 풀 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">It is/was ... that 강조구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">It is/was\u003c/b>와 \u003cb class=\"key\">that\u003c/b> 사이에 강조할 말을 넣어 특정 부분을 강조할 수 있습니다. 강조하는 말이 사람이면 that 대신 who를 쓸 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">It is/was + 강조할 말 + that/who + 나머지\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It was Minji that\u003c/span> broke the window.\u003c/div>\u003cdiv class=\"g-ko\">창문을 깬 사람은 바로 민지였다.\u003c/div>\u003cdiv class=\"g-note\">Minji를 강조하는 강조구문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">It is in this room that\u003c/span> we met for the first time.\u003c/div>\u003cdiv class=\"g-ko\">우리가 처음 만난 곳은 바로 이 방이다.\u003c/div>\u003cdiv class=\"g-note\">in this room을 강조하는 강조구문입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>강조구문의 it은 \u003cb class=\"key\">해석하지 않고\u003c/b>, 강조할 말이 사람이면 \u003cb class=\"key\">who\u003c/b>도 가능하다는 점을 기억하세요.\u003c/div>","segs":[{"n":16,"text":"마지막으로 It is나 It was와 that을 이용한 강조구문을 볼게요. 강조하고 싶은 말을 It is나 It was 뒤에 넣고, 나머지 문장을 that 뒤에 붙이면 그 부분이 특히 강조돼요. 강조하는 말이 사람이면 that 대신 who를 쓸 수도 있어요. 이때 It은 해석하지 않고 강조구문의 틀로만 기억하면 돼요.","hl":"rule"},{"n":17,"text":"첫 번째 예문은 It was Minji that broke the window. 예요. 뜻은 창문을 깬 사람은 바로 민지였다는 거예요. It was와 that 사이에 Minji를 넣어서 민지가 창문을 깬 사람이라는 점을 강조하고 있어요.","hl":"ex-0"},{"n":18,"text":"두 번째 예문은 It is in this room that we met for the first time. 이에요. 뜻은 우리가 처음 만난 곳은 바로 이 방이라는 거죠. It is와 that 사이에 in this room을 넣어 장소를 강조하고 있어요.","hl":"ex-1"},{"n":19,"text":"강조구문에서 It은 그것이라고 해석하지 않아요. 강조할 말이 사람이면 that 대신 who를 쓸 수 있다는 점도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I think difficult to solve this problem.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I think it difficult to solve this problem.\u003c/div>\u003cdiv class=\"g-why\">think 뒤 목적어 자리에 가목적어 it이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It is rain today.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It is rainy today.\u003c/div>\u003cdiv class=\"g-why\">날씨를 나타낼 때는 비인칭 it 뒤에 형용사 rainy를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>It was yesterday when I met him.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ It was yesterday that I met him.\u003c/div>\u003cdiv class=\"g-why\">시간을 강조하는 강조구문에서는 that을 씁니다.\u003c/div>\u003c/div>","segs":[{"n":20,"text":"첫 번째 실수는 I think difficult to solve this problem. 처럼 쓴 경우예요. think 뒤에 바로 difficult를 두면 목적어가 빠진 어색한 문장이 돼요. 이때는 I think it difficult to solve this problem. 처럼 가목적어 it을 넣어야 해요.","hl":"mk-0"},{"n":21,"text":"두 번째 실수는 It is rain today. 라고 쓴 경우예요. 날씨를 나타낼 때는 rain이 아니라 형용사 rainy를 써서 It is rainy today. 라고 해야 자연스러워요.","hl":"mk-1"},{"n":22,"text":"세 번째 실수는 It was yesterday when I met him. 처럼 when을 쓴 경우예요. yesterday를 강조하는 강조구문에서는 It was yesterday that I met him. 처럼 that을 쓰는 것이 안전해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 it이 가주어로 쓰인 문장은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I bought a book and read it.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>It is very cold outside.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>It is hard to finish the work today.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>She found it easy to answer the question.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">It is hard to finish the work today.\u003c/span>\u003cdiv class=\"g-exp\">It is hard to finish the work today에서 it은 to finish the work today를 받는 가주어입니다. 나머지는 인칭대명사, 비인칭 it, 가목적어입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":23,"text":"다음 중 it이 가주어로 쓰인 문장을 골라 보세요. 첫 번째 보기, I bought a book and read it. 두 번째 보기, It is very cold outside. 세 번째 보기, It is hard to finish the work today. 네 번째 보기, She found it easy to answer the question. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":24,"text":"","hl":"q","pause":6},{"n":25,"text":"정답은 세 번째 보기예요. It is hard to finish the work today에서 it은 뒤에 있는 to finish the work today를 받는 가주어로 쓰였어요. 첫 번째 보기의 it은 앞에 나온 book을 받는 인칭대명사이고, 두 번째 보기의 it은 날씨를 나타내는 비인칭 it이며, 네 번째 보기의 it은 가목적어예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">날씨가 매우 추운 상황을 나타내도록 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">____ is very cold today.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">It\u003c/span>\u003cdiv class=\"g-exp\">날씨를 나타내는 비인칭 it이 필요합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":26,"text":"날씨가 매우 추운 상황을 나타내도록 빈칸에 알맞은 말을 써 보세요. 문장은 빈칸 is very cold today. 예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":27,"text":"","hl":"q","pause":6},{"n":28,"text":"정답은 It이에요. 날씨를 나타낼 때는 비인칭 it을 써서 It is very cold today. 라고 해야 해요. 이때 it은 그것이라고 해석하지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">I found difficult to understand the lecture.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I found it difficult to understand the lecture.\u003c/span>\u003cdiv class=\"g-exp\">find 뒤에 가목적어 it을 넣어야 to부정사가 진목적어로 이어집니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":29,"text":"다음 문장에서 틀린 부분을 바르게 고쳐 보세요. I found difficult to understand the lecture. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":30,"text":"","hl":"q","pause":6},{"n":31,"text":"정답은 I found it difficult to understand the lecture. 예요. find 뒤에 it을 넣어 가목적어로 쓰고, 진짜 목적어인 to understand the lecture를 뒤에 두어야 해 s=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장은?\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>It is rain a lot yesterday.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>I think it important to read books.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She made clear that she was tired.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>It was in Paris where we met.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I think it important to read books.\u003c/span>\u003cdiv class=\"g-exp\">think 뒤에 가목적어 it을 써서 to read books가 진목적어로 이어집니다. 나머지는 비인칭 it, 가목적어 it, 강조구문 that이 필요한 문장입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"다음 중 어법상 올바른 문장을 골라 보세요. 첫 번째 보기, It is rain a lot yesterday. 두 번째 보기, I think it important to read books. 세 번째 보기, She made clear that she was tired. 네 번째 보기, It was in Paris where we met. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":6},{"n":40,"text":"정답은 두 번째 보기예요. I think it important to read books. 에서는 think 뒤에 가목적어 it을 쓰고 to read books가 진목적어로 이어져 올바른 문장이에요. 첫 번째 보기는 rainy 같은 형용사가 필요하고, 세 번째 보기는 made와 clear 사이에 it이 필요하며, 네 번째 보기는 강조구문에서 that을 쓰는 것이 안전해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 7 출제 포인트 36 대명사 it\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>it은 앞에 나온 \u003cb class=\"key\">특정 명사\u003c/b>를 받는 인칭대명사로 쓸 수 있습니다.\u003c/li>\u003cli>날씨·시간·거리·명암을 말할 때는 \u003cb class=\"key\">비인칭 it\u003c/b>을 사용합니다.\u003c/li>\u003cli>to부정사나 that절이 주어나 목적어 자리에 오면 \u003cb class=\"key\">가주어 it\u003c/b>이나 \u003cb class=\"key\">가목적어 it\u003c/b>으로 문장을 정리합니다.\u003c/li>\u003cli>특정 부분을 강조할 때는 \u003cb class=\"key\">It is/was ... that\u003c/b> 구문을 사용합니다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":41,"text":"오늘은 대명사 it의 네 가지 큰 쓰임을 정리했어요. 앞에 나온 명사를 받는 it, 날씨나 시간을 말하는 비인칭 it, 긴 주어와 목적어를 대신하는 가주어와 가목적어 it, 그리고 It is나 It was를 쓰는 강조구문까지 살펴봤죠. it이 나오면 먼저 앞에 가리키는 명사가 있는지, 날씨나 시간 표현인지, 뒤에 to부정사나 that절이 있는지 확인해 보세요. 오늘 배운 기준으로 예문을 다시 읽어 보면 시험 문제에서 it의 쓰임이 훨씬 쉽게 구별될 거예요. 수고했어요.","hl":"sum"}]}],"practice":{"unit":"Chapter 7 출제 포인트 36 대명사 it","level":"고1·2","ctx":"단원: Chapter 7 출제 포인트 36 대명사 it\n강의 제목: 대명사 it 완전 정복\n목표: 대명사 it의 인칭대명사, 비인칭, 가주어·가목적어, 강조구문 쓰임을 예문으로 구별할 수 있다.\n개념 1. 앞에 나온 특정 명사를 받는 it: it은 앞에 나온 특정한 명사나 명사구를 반복하지 않고 받는 인칭대명사입니다. 사람은 보통 he나 she로 받고, 사물이나 동물은 it으로 받습니다. [특정 명사(구) → it] (주의: 가리키는 대상이 분명한지 확인하고, 사람을 it으로 받지 않도록 주의하세요.)\n  예문: I lost my wallet, but I found it under the desk. (나는 지갑을 잃어버렸지만, 책상 아래에서 그것을 찾았다.) / This book is interesting, so I read it twice. (이 책은 흥미로워서 나는 그것을 두 번 읽었다.)\n개념 2. 비인칭 it: 날씨, 시간, 거리, 명암 같은 상황을 말할 때는 특정 명사를 가리키지 않는 비인칭 it을 씁니다. 이때 it은 '그것'으로 해석하지 않습니다. [It is + 날씨/시간/거리/명암] (주의: 비인칭 it은 해석하지 않고, 날씨·시간·거리·명암 표현인지 먼저 확인하세요.)\n  예문: It is raining heavily outside. (밖에 비가 많이 오고 있다.) / It is ten minutes' walk from here to the station. (여기서 역까지는 걸어서 십 분 거리이다.) / It is already noon. (벌써 정오이다.)\n개념 3. 가주어 it과 가목적어 it: to부정사나 that절이 주어나 목적어 자리에 오면 문장이 길어지므로, 그 자리에 가주어나 가목적어 it을 쓰고 진짜 주어나 목적어는 뒤로 보냅니다. [It + be + 형용사/명사 + to부정사/that절 / find·think·make + it + 형용사/명사 + to부정사/that절] (주의: 가주어 it은 뒤의 to부정사·that절이 진주어, 가목적어 it은 find·think·make 뒤에서 진목적어를 받습니다.)\n  예문: It is important to practice every day. (매일 연습하는 것은 중요하다.) / I found it difficult to solve the problem. (나는 그 문제를 푸는 것이 어렵다고 느꼈다.) / She made it clear that she would leave. (그녀는 자신이 떠날 것임을 분명히 했다.)\n개념 4. It is/was ... that 강조구문: It is/was와 that 사이에 강조할 말을 넣어 특정 부분을 강조할 수 있습니다. 강조하는 말이 사람이면 that 대신 who를 쓸 수 있습니다. [It is/was + 강조할 말 + that/who + 나머지] (주의: 강조구문의 it은 해석하지 않고, 강조할 말이 사람이면 who도 가능하다는 점을 기억하세요.)\n  예문: It was Minji that broke the window. (창문을 깬 사람은 바로 민지였다.) / It is in this room that we met for the first time. (우리가 처음 만난 곳은 바로 이 방이다.)\n자주 하는 실수: I think difficult to solve this problem. → I think it difficult to solve this problem. / It is rain today. → It is rainy today. / It was yesterday when I met him. → It was yesterday that I met him.\n정리: it은 앞에 나온 특정 명사를 받는 인칭대명사로 쓸 수 있습니다. / 날씨·시간·거리·명암을 말할 때는 비인칭 it을 사용합니다. / to부정사나 that절이 주어나 목적어 자리에 오면 가주어 it이나 가목적어 it으로 문장을 정리합니다. / 특정 부분을 강조할 때는 It is/was ... that 구문을 사용합니다.","items":[{"t":"choose","q":"다음 중 \u003c보기>의 밑줄 친 it과 쓰임이 같은 것 두 개를 고르세요.","ref":"I bought a new phone, and I use [[it]] every day.","opts":["[[It]] is very cold outside.","The movie was boring, so I turned [[it]] off.","[[It]] is necessary to wear a seatbelt.","I found [[it]] hard to understand the instructions.","She lost her umbrella, so she bought [[it]] again."],"ans":[2,5],"exp":"\u003c보기>와 ②, ⑤의 it은 앞에 나온 특정 명사(phone, movie, umbrella)를 받는 인칭대명사예요. ①은 날씨를 나타내는 비인칭 it, ③은 가주어, ④는 가목적어로 쓰였어요."},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"She found difficult to answer the question.","wrong":"found difficult","right":["found it difficult"],"exp":"find 뒤에 가목적어 it을 써서 'found it difficult to answer'와 같이 표현해야 해요. it이 없으면 어법상 틀립니다."},{"t":"bank","q":"빈칸에 알맞은 것을 \u003c보기>에서 고르세요.","bank":["it","that","who","when"],"items":[{"s":"I bought a new watch, and I wear ____ every day.","a":"it"},{"s":"They consider ____ important to protect the environment.","a":"it"},{"s":"It was yesterday ____ I met him.","a":"that"},{"s":"It was in the park ____ we had a picnic.","a":"that"}],"exp":"①은 앞에 나온 watch를 받는 인칭대명사 it, ②는 가목적어 it, ③④는 It was ... that 강조구문의 that이에요. who는 사람 강조, when은 시간의 접속사로 여기서는 쓰이지 않아요."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"It is very hot today,","r":"so let's go swimming."},{"l":"I borrowed a book from the library,","r":"but I haven't read it yet."},{"l":"It is important","r":"to drink enough water every day."},{"l":"The teacher made it clear","r":"that we must submit the assignment by Friday."},{"l":"It was in the library","r":"that we first met."}],"exp":"①은 날씨를 나타내는 비인칭 it, ②는 book을 받는 인칭대명사 it, ③은 가주어 it, ④는 가목적어 it, ⑤는 It was ... that 강조구문이에요."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"[[It is fun]] to play with friends.","hint":"(fun, play)"},"items":[{"scene":"❄️🌨️ 밖에 눈이 많이 오고 있어 따뜻한 옷이 필요한 상황","pre":"","post":" outside, so wear warm clothes.","hint":"(snow, heavily)","a":["It is snowing heavily"]},{"scene":"🏞️🚶‍♂️ 여기서 공원까지 걸어서 오 분 걸리는 상황","pre":"","post":" from here to the park.","hint":"(five minutes, walk)","a":["It is five minutes' walk","It is a five-minute walk"]}],"exp":"①은 날씨를 나타내는 비인칭 it, ②는 거리를 나타내는 비인칭 it으로, 둘 다 '그것'으로 해석하지 않아요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"I think [[it]] necessary to check the results again.","ok":true,"right":[],"exp":"think 뒤에 가목적어 it을 써서 'think it necessary to ...'로 표현하는 것이 옳아요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"내가 그녀를 만난 것은 바로 어제였다.","chunks":["It was","yesterday","that","I met her"],"end":".","alts":[],"exp":"It was ... that 강조구문으로, 시간(어제)을 강조하고 있어요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"It is [[cloud]] today.","ok":false,"right":["cloudy"],"exp":"날씨를 나타낼 때는 'It is cloudy'와 같이 형용사를 써야 해요. cloud는 명사이므로 틀립니다."}]}});</script><script>function practiceKit(){

    function summary(){
      var n=S.list.length,ok=S.res.filter(function(v){return v===true;}).length,wrong=[];S.res.forEach(function(v,i){if(v!==true)wrong.push(S.map[i]);});
      var h='<div class="pq-sum"><div class="pq-score"><b>'+ok+'</b> / '+n+'</div><p>'+(ok===n?"모두 맞았어요! 훌륭해요 👏":ok>=n*0.7?"잘했어요! 틀린 문제만 한 번 더 풀어 볼까요?":"틀린 문제를 해설과 함께 다시 풀어 봐요.")+'</p>'+
        '<ol class="pq-list">'+S.list.map(function(it,i){return '<li class="'+(S.res[i]===true?"ok":"no")+'"><span>'+(S.res[i]===true?"✓":"✗")+'</span>'+esc(TL[it.t]||"")+' · '+esc(plain(it.q)).slice(0,60)+'</li>';}).join("")+'</ol><div class="pq-acts">'+
        (wrong.length?'<button class="pq-btn" data-a="wrong">틀린 문제 다시 풀기 ('+wrong.length+')</button>':'')+
        '<button class="pq-btn ghost" data-a="again">처음부터 다시</button>'+
        '<button class="pq-btn ai" data-a="ai">✨ AI 새 문제 더 풀기</button>'+
        (S.sets.length>1?'<select class="pq-sets">'+S.sets.map(function(x,i){return '<option value="'+i+'"'+(i===S.set?' selected':'')+'>'+esc(x.name)+' ('+x.items.length+'문제)</option>';}).join("")+'</select><button class="pq-btn ghost" data-a="set">이 세트 풀기</button>':'')+
        '<button class="pq-btn ghost" data-a="close">강의로 돌아가기</button></div><div class="pq-aimsg" role="status"></div><div class="pq-code" hidden><input type="password" placeholder="선생님께 받은 입장 코드" autocomplete="off"><button class="pq-btn" data-a="code">확인</button></div></div>';
      main.innerHTML=h;
      main.querySelector(".pq-acts").onclick=function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
        if(a==="wrong")start(S.set,wrong);else if(a==="again")start(S.set,null);else if(a==="close")close();
        else if(a==="set")start(+main.querySelector(".pq-sets").value,null);else if(a==="ai")more();};
      var cb=main.querySelector('[data-a="code"]');if(cb)cb.onclick=function(){var v=main.querySelector(".pq-code input").value.trim();if(!v)return;try{localStorage.setItem("cm-chat-code",v);}catch(_){}main.querySelector(".pq-code").hidden=true;more();};
    }
    function more(){
      if(S.busy)return;var m=main.querySelector(".pq-aimsg"),btn=main.querySelector('[data-a="ai"]');
      if(location.protocol==="file:"){m.className="pq-aimsg no";m.textContent="AI 새 문제는 강의를 사이트(인터넷 주소)에서 열었을 때 쓸 수 있어요.";return;}
      S.busy=true;if(btn)btn.disabled=true;m.className="pq-aimsg";m.textContent="AI가 새 문제를 만드는 중이에요… 20~40초 정도 걸려요.";
      var code="";try{code=localStorage.getItem("cm-chat-code")||"";}catch(_){}
      var avoid=[];S.sets.forEach(function(x){x.items.forEach(function(it){avoid.push(plain(it.q+" "+(it.s||it.ref||(it.opts&&it.opts[0])||(it.items&&it.items[0]&&(it.items[0].s||it.items[0].post))||"")).slice(0,90));});});
      var body=JSON.stringify({ctx:s(P.ctx),level:s(P.level),unit:s(P.unit||D.title),n:opt.n||6,avoid:avoid.slice(-30),code:code}),t0=Date.now();
      var tm=setInterval(function(){m.textContent="AI가 새 문제를 만드는 중이에요… ("+Math.round((Date.now()-t0)/1000)+"초)";},1000);
      fetch(opt.api||"/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:body}).then(function(res){
        var ct=res.headers.get("content-type")||"";
        if(!res.ok)return res.json().catch(function(){return {};}).then(function(j){if(j.error==="code"){main.querySelector(".pq-code").hidden=false;}throw new Error(j.msg||"새 문제를 받지 못했어요. 잠시 뒤 다시 해 주세요.");});
        if(ct.indexOf("application/json")>=0)return res.json();
        return res.text().then(function(t){var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("AI가 문제를 다 만들지 못했어요. 다시 눌러 주세요.");return JSON.parse(t.slice(a,b+1));});
      }).then(function(j){var L=norm(j);if(L.length<2)throw new Error("AI가 만든 문제가 알맞지 않아요. 다시 눌러 주세요.");
        S.sets.push({name:"AI 새 문제 "+S.sets.length,items:L});start(S.sets.length-1,null);
      }).catch(function(e){m.className="pq-aimsg no";m.textContent=(e&&e.message&&!/JSON|Unexpected|fetch/i.test(e.message))?e.message:"새 문제를 받지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.";if(btn)btn.disabled=false;
      }).then(function(){clearInterval(tm);S.busy=false;});
    }
    /* AI 조교(질문하기)에게: 아직 [정답 확인]을 하지 않은 문제는 답을 알려 주지 않도록 */
    window.__cmPQ={locked:function(){var L=[];S.sets.forEach(function(x){x.items.forEach(function(it){if(!it._done)L.push(it);});});return L;},
      current:function(){return root.hidden?null:S.list[S.idx]||null;}};
    return {open:open,close:close};
  }
  return {norm:norm,item:item,mount:mount,plain:plain,TL:TL};
}
practiceKit().mount(window.__LP);</script><script src="/chat-widget.js" defer></script>
