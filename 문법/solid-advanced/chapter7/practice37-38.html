window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 7 Basic Practice (포인트 37-38)","audioDir":"practice37-38_audio","preview":false,"count":75,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">대명사·재귀대명사·지시대명사 수일치\u003c/div>\u003ch1>Chapter 7 Basic Practice 포인트 37-38 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 밑줄 친 부분 판단, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter Seven Basic Practice의 포인트 서른일곱과 서른여덟 문제를 함께 풀어 볼 거예요. 대명사와 재귀대명사, 지시대명사의 수일치를 중심으로 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">지시대명사 that/those와 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 명사를 반복하지 않고 가리킬 때, 단수 명사는 \u003cb class=\"key\">that\u003c/b>, 복수 명사는 \u003cb class=\"key\">those\u003c/b>로 받습니다. 뒤에 who나 of 같은 수식어가 붙어도 \u003cb class=\"key\">가리키는 명사의 수\u003c/b>에 맞춰야 합니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 명사 → that / 복수 명사 → those\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>information, population처럼 단수 개념이면 that\u003c/li>\u003cli>tasks, people처럼 복수 개념이면 those\u003c/li>\u003cli>Those who = people who, That who는 불가\u003c/li>\u003cli>비교 구문에서도 앞 명사의 수를 확인\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The weather in Seoul is warmer than that of London.\u003c/div>\u003cdiv class=\"g-ko\">서울의 날씨는 런던의 날씨보다 더 따뜻하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">These shoes are cheaper than those on the shelf.\u003c/div>\u003cdiv class=\"g-ko\">이 신발들은 선반 위의 신발들보다 싸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Those who try can succeed.\u003c/div>\u003cdiv class=\"g-ko\">노력하는 사람들은 성공할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 지시대명사 that과 those부터 볼게요. 앞에 나온 명사를 다시 말하지 않고 가리킬 때, 단수는 that, 복수는 those를 씁니다. 뒤에 who나 of가 붙어도 가리키는 명사의 수는 변하지 않아요. 그래서 information은 단수라서 that, tasks는 복수라서 those, people은 복수라서 Those who가 됩니다. 비교 구문에서도 앞 명사의 수를 꼭 확인해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The most important information is \u003cspan class=\"p-box\">\u003cspan>that\u003c/span>\u003ci>/\u003c/i>\u003cspan>those\u003c/span>\u003c/span> written on the first page.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">those\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 information을 받는 지시대명사를 고르는 문제예요. 주어가 단수인지 복수인지부터 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"information은 단수 개념이라서 that이 정답입니다. those는 복수 명사를 받을 때 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The most important information is \u003cspan class=\"p-box\">\u003cspan class=\"ok\">that\u003c/span>\u003ci>/\u003c/i>\u003cspan>those\u003c/span>\u003c/span> written on the first page.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">those\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어·보어 확인\u003c/b>주어는 The most important information이고 \u003cb class=\"key\">단수\u003c/b> 개념입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">받는 말 확인\u003c/b>뒤의 written on the first page는 information을 수식하므로 \u003cb class=\"key\">단수\u003c/b>를 받는 that이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">those 오답 확인\u003c/b>those는 복수라서 information과 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 that\u003c/span>\u003cdiv class=\"p-full\">The most important information is that written on the first page.\u003c/div>\u003cdiv class=\"p-ko\">가장 중요한 정보는 첫 페이지에 쓰여 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>information 뒤에 s가 없어도 복수로 착각해 those를 고르지 마세요.\u003c/div>","segs":[{"n":6,"text":"먼저 주어를 보면 The most important information이에요. information은 셀 수 없는 단수 명사로 봅니다.","hl":"st-0"},{"n":7,"text":"뒤에 written on the first page가 붙어도 가리키는 대상은 information 하나예요. 그래서 단수 지시대명사 that을 골라야 합니다.","hl":"st-1"},{"n":8,"text":"those는 복수 명사를 받는 말이라서 information과 맞지 않습니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. information 뒤에 s가 없어도 복수로 착각해 those를 고르지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">재귀대명사와 인칭대명사의 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">재귀대명사는 \u003cb class=\"key\">주어와 같은 사람\u003c/b>을 다시 가리킬 때 쓰고, 주어와 다른 사람을 가리키면 \u003cb class=\"key\">목적격\u003c/b>을 씁니다. 재귀대명사는 주어의 수와 인칭에 맞춰 \u003cb class=\"key\">myself, yourself, himself, herself, ourselves, yourselves, themselves\u003c/b>로 달라집니다.\u003cdiv>\u003cspan class=\"g-formula\">주어와 같은 대상 → 재귀대명사 / 다른 대상 → 목적격\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>you all의 재귀대명사는 yourselves\u003c/li>\u003cli>Jack처럼 남성 단수 주어의 강조 재귀대명사는 himself\u003c/li>\u003cli>명령문의 you와 myself는 같은 사람이 아니므로 me\u003c/li>\u003cli>동사 뒤 목적어가 주어와 다르면 her, him, them 같은 목적격\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You should be proud of yourselves.\u003c/div>\u003cdiv class=\"g-ko\">너희는 스스로를 자랑스러워해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Jack cooked dinner himself.\u003c/div>\u003cdiv class=\"g-ko\">잭이 직접 저녁을 요리했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">Please contact Bob or me.\u003c/div>\u003cdiv class=\"g-ko\">밥이나 저에게 연락해 주세요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"다음은 재귀대명사입니다. 재귀대명사는 주어가 한 행동이 다시 주어 자신에게 돌아올 때 씁니다. 주어가 복수면 yourselves나 themselves처럼 복수형을 골라야 하고, 주어와 다른 사람을 가리키면 myself가 아니라 me, herself가 아니라 her를 써야 해요. 강조의 뜻으로 문장 끝에 himself를 쓰는 경우도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I hope you all enjoy \u003cspan class=\"p-box\">\u003cspan>yourself\u003c/span>\u003ci>/\u003c/i>\u003cspan>yourselves\u003c/span>\u003c/span> at the party tonight!\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">yourself\u003c/div>\u003cdiv class=\"p-op\">yourselves\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">yourselves\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 파티에서 즐기라는 문장이에요. 주어 you all이 몇 명을 가리키는지 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"you all은 복수라서 yourselves가 정답입니다. yourself는 한 사람일 때만 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">I hope you all enjoy \u003cspan class=\"p-box\">\u003cspan>yourself\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">yourselves\u003c/span>\u003c/span> at the party tonight!\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">yourself\u003c/div>\u003cdiv class=\"p-op\">yourselves\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">주어 확인\u003c/b>주어는 you all로 \u003cb class=\"key\">복수\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">재귀대명사 일치\u003c/b>you all에 맞는 재귀대명사는 \u003cb class=\"key\">yourselves\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">yourself 오답 확인\u003c/b>yourself는 한 사람 you에 쓰므로 이 문장에는 맞지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 yourselves\u003c/span>\u003cdiv class=\"p-full\">I hope you all enjoy yourselves at the party tonight!\u003c/div>\u003cdiv class=\"p-ko\">오늘 밤 파티에서 여러분 모두 즐겁게 보내길 바라요!\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>you all을 단수 you로 착각해 yourself를 고르지 마세요.\u003c/div>","segs":[{"n":14,"text":"주어는 you all로 복수입니다. 여러 사람에게 말하고 있죠.","hl":"st-0"},{"n":15,"text":"you all에 맞는 재귀대명사는 yourselves입니다. 복수 주어에는 복수 재귀대명사를 씁니다.","hl":"st-1"},{"n":16,"text":"yourself는 한 사람 you에 쓰는 형태라서 이 문장에는 맞지 않습니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. you all을 단수 you로 착각해 yourself를 고르지 마세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">one/ones와 it/them의 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 가산명사를 불특정하게 다시 가리키면 단수 \u003cb class=\"key\">one\u003c/b>, 복수 \u003cb class=\"key\">ones\u003c/b>를 쓰고, 이미 특정된 바로 그 대상을 가리키면 단수 \u003cb class=\"key\">it\u003c/b>, 복수 \u003cb class=\"key\">them\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">불특정 단수 one / 불특정 복수 ones / 특정 단수 it / 특정 복수 them\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>a large box처럼 특정된 단수는 it\u003c/li>\u003cli>good ones처럼 복수 명사는 them\u003c/li>\u003cli>ones with raspberry 같은 복수는 them\u003c/li>\u003cli>일반 사람을 가리키는 one은 단수 취급\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I need a pen. Do you have one?\u003c/div>\u003cdiv class=\"g-ko\">나는 펜이 필요해. 하나 가지고 있어?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">These cookies are old. I want fresh ones.\u003c/div>\u003cdiv class=\"g-ko\">이 쿠키들은 오래됐다. 나는 신선한 것들을 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">I found a box and opened it.\u003c/div>\u003cdiv class=\"g-ko\">나는 상자를 발견하고 그것을 열었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"이번에는 one과 ones, 그리고 it과 them을 구분해 볼게요. one과 ones는 앞에 나온 명사를 불특정하게 다시 말할 때 쓰고, it과 them은 이미 특정된 대상을 가리킬 때 씁니다. 단수인지 복수인지도 꼭 맞춰야 해요. 상자 하나는 it, 초콜릿 여러 개는 them이라고 기억하면 쉽습니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A3\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If you take in too much water, like \u003cspan class=\"p-box\">\u003cspan>one\u003c/span>\u003ci>/\u003c/i>\u003cspan>those\u003c/span>\u003c/span> who is drowning, it could kill you.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">one\u003c/div>\u003cdiv class=\"p-op\">those\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">one\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"세 번째 문제는 who 고치는 문제예요. 각 밑줄이 누구를 가리키는지 차례대로 확인해 보세요.","hl":"q"},{"n":62,"text":"","hl":"q","pause":7},{"n":63,"text":"첫 번째는 herself, 두 번째는 her, 세 번째는 Those로 고치면 됩니다. 주어와 같은 사람인지, 복수인지가 핵심이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">&quot;Jane shook (1) \u003cu class=\"p-u\">her\u003c/u> awake.&quot; The meaning of the sentence is fairly clear. Jane was drifting to sleep at a time when she shouldn't be, possibly during class, so she made a sudden movement in order to stay awake. Now let's look at another sentence, &quot;Jane shook (2) \u003cu class=\"p-u\">herself\u003c/u> awake.&quot; (3) \u003cu class=\"p-u\">That\u003c/u> who read this sentence will think that Jane was shaking someone else.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) her\u003c/b>Jane이 자기 자신을 흔들어 깨운 문맥이므로 her를 \u003cb class=\"key\">herself\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) herself\u003c/b>다른 사람을 흔들어 깨우는 문장이므로 herself를 \u003cb class=\"key\">her\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) That\u003c/b>who read 이하가 복수 사람을 가리키므로 That을 \u003cb class=\"key\">Those\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) herself (2) her (3) Those\u003c/span>\u003cdiv class=\"p-full\">&quot;Jane shook herself awake.&quot; The meaning of the sentence is fairly clear. Jane was drifting to sleep at a time when she shouldn't be, possibly during class, so she made a sudden movement in order to stay awake. Now let's look at another sentence, &quot;Jane shook her awake.&quot; Those who read this sentence will think that Jane was shaking someone else.\u003c/div>\u003cdiv class=\"p-ko\">제인은 스스로를 흔들어 깨웠다. ... 이제 다른 문장을 보면, 제인은 다른 여자를 흔들어 깨웠다는 뜻이 된다. 이 문장을 읽는 사람들은 제인이 다른 사람을 흔들고 있다고 생각할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>첫 문장과 두 번째 문장의 의미가 반대라는 점을 놓치지 마세요.\u003c/div>","segs":[{"n":64,"text":"먼저 첫 번째 밑줄을 봅시다. Jane이 졸음을 깨려고 스스로 몸을 흔든 상황이므로 her가 아니라 herself가 되어야 합니다.","hl":"st-0"},{"n":65,"text":"두 번째 문장은 Jane이 다른 여자를 흔들어 깨우는 뜻이 되어야 해요. 그래서 herself가 아니라 her를 씁니다.","hl":"st-1"},{"n":66,"text":"세 번째는 who read this sentence를 받는 말이에요. 여러 사람을 뜻하므로 That이 아니라 Those로 고칩니다.","hl":"st-2"},{"n":67,"text":"이 문제의 함정도 짚고 갈게요. 첫 문장과 두 번째 문장의 의미가 반대라는 점을 놓치지 마세요.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Peter searched high and low. He found a large box of chocolates hidden behind some books, and he opened (1) \u003cu class=\"p-u\">one\u003c/u>. Then he took a tiny bite out of every single chocolate. When he found good ones with chocolate fudge centers, he ate (2) \u003cu class=\"p-u\">it\u003c/u>. However, when he found ones with raspberry, strawberry, or lemon creams, he put (3) \u003cu class=\"p-u\">themselves\u003c/u> back.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) it (2) them (3) them\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":68,"text":"이 지문은 one, it, themselves를 상황에 맞게 고치는 문제예요. 각 밑줄이 단수인지 복수인지, 특정된 대상인지 확인하세요.","hl":"q"},{"n":69,"text":"","hl":"q","pause":7},{"n":70,"text":"상자 하나는 it, 좋은 초콜릿 여러 개는 them, 다른 맛 초콜릿 여러 개도 them으로 고칩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Peter searched high and low. He found a large box of chocolates hidden behind some books, and he opened (1) \u003cu class=\"p-u\">one\u003c/u>. Then he took a tiny bite out of every single chocolate. When he found good ones with chocolate fudge centers, he ate (2) \u003cu class=\"p-u\">it\u003c/u>. However, when he found ones with raspberry, strawberry, or lemon creams, he put (3) \u003cu class=\"p-u\">themselves\u003c/u> back.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) one\u003c/b>앞의 a large box of chocolates에서 열린 대상은 \u003cb class=\"key\">단수\u003c/b> 상자 하나이므로 one을 \u003cb class=\"key\">it\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) it\u003c/b>good ones는 복수 초콜릿들이므로 it을 \u003cb class=\"key\">them\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) themselves\u003c/b>raspberry, strawberry, lemon creams로 만든 ones는 복수 대상이고 주어 he와 다르므로 themselves를 \u003cb class=\"key\">them\u003c/b>으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) it (2) them (3) them\u003c/span>\u003cdiv class=\"p-full\">Peter searched high and low. He found a large box of chocolates hidden behind some books, and he opened it. Then he took a tiny bite out of every single chocolate. When he found good ones with chocolate fudge centers, he ate them. However, when he found ones with raspberry, strawberry, or lemon creams, he put them back.\u003c/div>\u003cdiv class=\"p-ko\">피터는 여기저기 찾아다녔다. ... 상자를 열고, 좋은 초콜릿들은 먹고, 다른 맛 초콜릿들은 다시 놓았다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>ones가 나오면 복수라는 신호예요. it이나 themselves로 받지 않도록 주의하세요.\u003c/div>","segs":[{"n":71,"text":"첫 번째는 상자를 열었다는 부분이에요. a large box 하나를 가리키므로 one이 아니라 it을 씁니다.","hl":"st-0"},{"n":72,"text":"두 번째는 good ones를 먹었다는 말이에요. ones가 복수이므로 it이 아니라 them을 써야 합니다.","hl":"st-1"},{"n":73,"text":"세 번째는 그 초콜릿들을 다시 놓았다는 뜻이에요. 주어 he와 다른 복수 대상이므로 themselves가 아니라 them을 씁니다.","hl":"st-2"},{"n":74,"text":"이 문제의 함정도 짚고 갈게요. ones가 나오면 복수라는 신호예요. it이나 themselves로 받지 않도록 주의하세요.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">대명사·재귀대명사·지시대명사 수일치\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>단수 명사는 \u003cb class=\"key\">that\u003c/b>, 복수 명사는 \u003cb class=\"key\">those\u003c/b>로 받는다.\u003c/li>\u003cli>재귀대명사는 \u003cb class=\"key\">주어와 같은 사람\u003c/b>을 가리킬 때만 쓰고, 주어와 다르면 목적격을 쓴다.\u003c/li>\u003cli>you all에는 \u003cb class=\"key\">yourselves\u003c/b>, Jack에게는 \u003cb class=\"key\">himself\u003c/b>처럼 주어의 인칭과 수를 맞춘다.\u003c/li>\u003cli>불특정 단수는 \u003cb class=\"key\">one\u003c/b>, 불특정 복수는 \u003cb class=\"key\">ones\u003c/b>, 특정 단수는 \u003cb class=\"key\">it\u003c/b>, 특정 복수는 \u003cb class=\"key\">them\u003c/b>이다.\u003c/li>\u003c/ul>","segs":[{"n":75,"text":"오늘은 지시대명사와 재귀대명사, 그리고 one과 ones의 구분을 연습했어요. 단수와 복수를 먼저 확인하고, 주어와 같은 사람을 가리키는지 꼭 따져 보세요. 이 기준만 잡으면 시험에서 대명사 문제는 자신 있게 풀 수 있습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
