window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 6 Chapter Test","audioDir":"test1_audio","preview":false,"count":171,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">관계대명사·관계부사·복합관계사 어법 종합\u003c/div>\u003ch1>Chapter 6 Chapter Test 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 맞는 문장 짝짓기, 틀린 부분 고치기, 배열 서술형, 지문 어법 개수, 지문 틀린 부분 고치기, 지문 어법+영작, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 여섯 번째 챕터 테스트를 함께 풀어 볼 거예요. 관계대명사와 관계부사, 복합관계사가 섞여 나오는 문제들이니 선행사와 뒤 절의 모양을 차근차근 확인하면서 풀어 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 whose\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사와 뒤 명사가 소유 관계이면 \u003cb class=\"key\">whose + 명사\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + whose + 명사 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>whose 뒤에는 명사가 바로 온다\u003c/li>\u003cli>who's와 구별한다\u003c/li>\u003cli>사람뿐 아니라 사물에도 쓸 수 있다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I met a scientist \u003cspan class=\"fx\">whose theory\u003c/span> was right.\u003c/div>\u003cdiv class=\"g-ko\">나는 이론이 옳았던 과학자를 만났다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"관계대명사 whose는 소유격이에요. 앞에 나온 사람이나 사물이 뒤에 나오는 명사의 주인일 때 씁니다. 예를 들어 과학자와 이론이 소유 관계이면 whose theory처럼 whose 뒤에 명사를 바로 붙여요. whose 뒤에는 절의 주어가 아니라 명사가 온다는 점을 꼭 기억하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">There are scientists \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan>whose\u003c/span>\u003c/span> theories were right but disproved at first.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whose\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">whose\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 scientists 뒤에 올 관계대명사를 고르는 문제예요. 뒤에 theories라는 명사가 나온다는 점을 먼저 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 whose예요. scientists와 theories가 소유 관계이고 whose 뒤에 명사가 바로 왔기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">There are scientists \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">whose\u003c/span>\u003c/span> theories were right but disproved at first.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">who\u003c/div>\u003cdiv class=\"p-op\">whose\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>scientists와 theories의 관계를 봅니다. theories는 scientists의 이론이므로 \u003cb class=\"key\">소유 관계\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">관계대명사 선택\u003c/b>소유 관계는 \u003cb class=\"key\">whose\u003c/b>로 받고 뒤에 명사 theories가 바로 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>whose theories were right가 되어 '이론이 옳았던 과학자들'이라는 뜻이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 whose\u003c/span>\u003cdiv class=\"p-full\">There are scientists whose theories were right but disproved at first.\u003c/div>\u003cdiv class=\"p-ko\">처음에는 반박되었지만 이론이 옳았던 과학자들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>who 뒤에 명사 theories를 그대로 붙이면 주격 관계대명사 뒤에 동사가 와야 해서 틀립니다.\u003c/div>","segs":[{"n":6,"text":"먼저 scientists와 theories의 관계를 보세요. theories는 scientists가 가진 이론이므로 소유 관계예요.","hl":"st-0"},{"n":7,"text":"소유 관계를 받을 때는 whose를 쓰고, whose 뒤에는 명사가 바로 와요. 그래서 whose theories가 됩니다.","hl":"st-1"},{"n":8,"text":"완성해 보면 이론이 옳았던 과학자들이라는 뜻이 자연스럽게 만들어져요.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. who 뒤에 명사 theories를 그대로 붙이면 주격 관계대명사 뒤에 동사가 와야 해서 틀립니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 who, which, that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">사람 선행사는 \u003cb class=\"key\">who\u003c/b>, 사물 선행사는 \u003cb class=\"key\">which\u003c/b>로 받고 제한적 용법에서는 that도 가능합니다.\u003cdiv>\u003cspan class=\"g-formula\">사람 + who/that / 사물 + which/that\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>계속적 용법의 쉼표 뒤에는 that을 쓰지 않는다\u003c/li>\u003cli>주격인지 목적격인지 뒤 절을 보고 판단한다\u003c/li>\u003cli>선행사가 사람인지 사물인지 먼저 확인한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The woman \u003cspan class=\"fx\">who helped\u003c/span> me was kind.\u003c/div>\u003cdiv class=\"g-ko\">나를 도와준 여성은 친절했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"관계대명사는 앞에 나온 선행사를 받아 뒤 절을 이어 줘요. 선행사가 사람이면 who, 사물이면 which를 기본으로 쓰고, 제한적 용법에서는 that도 쓸 수 있어요. 다만 쉼표가 있는 계속적 용법에서는 that을 쓰지 않는다는 점이 시험에 자주 나옵니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Kinetic energy is the energy associated with motion, while potential energy represents the energy \u003cspan class=\"p-box\">\u003cspan>it\u003c/span>\u003ci>/\u003c/i>\u003cspan>which\u003c/span>\u003c/span> is &quot;stored&quot; in a physical system.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">it\u003c/div>\u003cdiv class=\"p-op\">which\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">which\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 energy 뒤에 이어지는 말을 고르는 문제예요. 뒤에 is stored가 이어지므로 주어가 비어 있는지 확인하세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 which예요. is stored의 주어 역할을 해야 하므로 주격 관계대명사 which가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Kinetic energy is the energy associated with motion, while potential energy represents the energy \u003cspan class=\"p-box\">\u003cspan>it\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">which\u003c/span>\u003c/span> is &quot;stored&quot; in a physical system.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">it\u003c/div>\u003cdiv class=\"p-op\">which\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">선행사 확인\u003c/b>the energy가 선행사이고 뒤에 is stored가 이어집니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">주어 자리 확인\u003c/b>is stored 앞에 주어가 필요하므로 \u003cb class=\"key\">주격 which\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">it과 비교\u003c/b>it을 쓰면 접속사 없이 두 절이 이어져 문장이 성립하지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 which\u003c/span>\u003cdiv class=\"p-full\">Kinetic energy is the energy associated with motion, while potential energy represents the energy which is &quot;stored&quot; in a physical system.\u003c/div>\u003cdiv class=\"p-ko\">운동 에너지는 운동과 관련된 에너지이고, 위치 에너지는 물리적 체계에 저장된 에너지를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>it은 앞 명사를 받는 대명사일 뿐이라 관계사처럼 두 절을 연결하지 못합니다.\u003c/div>","segs":[{"n":14,"text":"먼저 the energy가 선행사라는 것을 확인하세요. 그리고 뒤에 is stored가 이어지는 모양을 보세요.","hl":"st-0"},{"n":15,"text":"is stored 앞에는 주어가 필요해요. 이 주어 역할을 which가 해 주는 거예요.","hl":"st-1"},{"n":16,"text":"it은 대명사라서 앞 명사를 이어 주는 접속 역할을 하지 못해요. 그래서 여기에는 which가 필요합니다.","hl":"st-2"},{"n":17,"text":"이 문제의 함정도 짚고 갈게요. it은 앞 명사를 받는 대명사일 뿐이라 관계사처럼 두 절을 연결하지 못합니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">I visited the chief investment officer of a large financial firm, \u003cspan class=\"p-box\">\u003cspan>that\u003c/span>\u003ci>/\u003c/i>\u003cspan>who\u003c/span>\u003c/span> had invested some tens of millions of dollars in the stock of the ABC Motor Company.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">that\u003c/div>\u003cdiv class=\"p-op\">who\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"세 번째 문제는 쉼표 뒤에 이어지는 관계대명사를 고르는 문제예요. 선행사가 사람인지와 계속적 용법인지를 함께 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":7},{"n":20,"text":"정답은 who예요. 사람 선행사를 받고 계속적 용법에서는 that을 쓰지 않기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u00  before you open your wallet, let me tell you about a charity ⓒ \u003cu class=\"p-u\">which\u003c/u> you can donate. You probably recall the amazing, heroic story of Helen Keller, ⓓ \u003cu class=\"p-u\">whom\u003c/u> while deaf and blind, wrote timeless classics and became the very first blind-deaf person to earn a bachelor's degree. Named in her honor, the Helen Keller International charity is working to improve the quality of life and the prevalence of malnutrition and blindness. This includes programs and research ⓔ \u003cu class=\"p-u\">connected\u003c/u> to all areas of health, nutrition, and vision.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>December, &lt;&lt;that&gt;&gt; makes sense에서 앞 절 전체를 받는 계속적 관계대명사가 필요하므로 \u003cb class=\"key\">which\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>&lt;&lt;what&gt;&gt; we give to those in need makes the season bright에서 what은 선행사를 포함한 주어로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>a charity &lt;&lt;which&gt;&gt; you can donate에서 donate는 to가 필요한 동사이므로 \u003cb class=\"key\">to which\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>Helen Keller, &lt;&lt;whom&gt;&gt; wrote timeless classics에서 wrote의 주어는 Helen Keller이므로 \u003cb class=\"key\">who\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>programs and research &lt;&lt;connected&gt;&gt; to all areas는 분사구문으로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">개수 세기\u003c/b>틀린 곳은 ⓐ, ⓒ, ⓓ로 모두 3개이므로 ③입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③ (ⓐ which, ⓒ to which, ⓓ who)\u003c/span>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>계속적 which, donate to, 주격 who를 각각 놓치면 개수를 잘못 세게 됩니다.\u003c/div>","segs":[{"n":126,"text":"첫 번째 밑줄은 앞 내용 전체를 받아야 해요. 계속적 용법에서는 that이 아니라 which를 써야 합니다.","hl":"st-0"},{"n":127,"text":"두 번째 밑줄의 what은 우리가 필요한 사람들에게 주는 것이라는 의미로 주어 역할을 해요. 그래서 맞습니다.","hl":"st-1"},{"n":128,"text":"세 번째 밑줄은 donate to a charity의 구조를 생각해야 해요. 그래서 which가 아니라 to which가 필요합니다.","hl":"st-2"},{"n":129,"text":"네 번째 밑줄은 wrote의 주어가 Helen Keller이므로 주격 who가 필요해요. whom은 틀립니다.","hl":"st-3"},{"n":130,"text":"다섯 번째 밑줄의 connected는 programs and research를 수식하는 분사로 맞아요.","hl":"st-4"},{"n":131,"text":"틀린 곳은 첫 번째, 세 번째, 네 번째 밑줄로 모두 세 개예요. 그래서 정답은 세 번째 선택지입니다.","hl":"st-5"},{"n":132,"text":"이 문제의 함정도 짚고 갈게요. 계속적 which, donate to, 주격 who를 각각 놓치면 개수를 잘못 세게 됩니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">whose와 that/which의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">whose 뒤에는 \u003cb class=\"key\">명사\u003c/b>가 오고, 뒤에 바로 동사가 오면 주격 \u003cb class=\"key\">that/which\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">whose + 명사 / that·which + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>whose impact처럼 명사가 오면 소유격\u003c/li>\u003cli>impact가 동사로 쓰이면 주격 which/that\u003c/li>\u003cli>해석으로 소유인지 행동인지 확인한다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I know a boy \u003cspan class=\"fx\">whose father\u003c/span> is a doctor.\u003c/div>\u003cdiv class=\"g-ko\">나는 아버지가 의사인 소년을 안다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":133,"text":"whose는 소유격이라서 뒤에 명사가 와야 해요. 그런데 뒤에 impact처럼 동사가 바로 오면 소유격이 아니라 주격 관계대명사를 써야 해요. 그래서 whose 뒤에 명사가 있는지, 아니면 동사가 있는지를 먼저 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 밑줄 친 ⓐ~ⓓ 중 어법상 틀린 부분을 모두 찾아 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">I believe we can save the Earth if we change ⓐ \u003cu class=\"p-u\">the way\u003c/u> we live. For me, reducing plastic consumption is ⓑ \u003cu class=\"p-u\">that\u003c/u> makes a difference in the world. If I have to buy something brand new, I look to invest in items ⓒ \u003cu class=\"p-u\">whose\u003c/u> impact the environment as minimally as possible. This includes paying attention to packaging and materials, ⓓ \u003cu class=\"p-u\">it\u003c/u> applies to everything from eggs in the grocery store (skip the plastic cartons in favor of cardboard) to buying a new couch.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓑ that → what, ⓒ whose → that 또는 which, ⓓ it → which\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":134,"text":"열일곱 번째 문제는 지문에서 틀린 부분을 모두 찾아 고치는 문제예요. the way 뒤와 what, whose, it의 쓰임을 차례로 확인하세요.","hl":"q"},{"n":135,"text":"","hl":"q","pause":7},{"n":136,"text":"정답은 두 번째 that을 what으로, 세 번째 whose를 that이나 which로, 네 번째 it을 which로 고치는 거예요. impact가 동사로 쓰였고, 앞 내용을 이어 주려면 계속적 which가 필요해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 17 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">17\u003c/span>다음 글을 읽고, 밑줄 친 ⓐ~ⓓ 중 어법상 틀린 부분을 모두 찾아 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">I believe we can save the Earth if we change ⓐ \u003cu class=\"p-u\">the way\u003c/u> we live. For me, reducing plastic consumption is ⓑ \u003cu class=\"p-u\">that\u003c/u> makes a difference in the world. If I have to buy something brand new, I look to invest in items ⓒ \u003cu class=\"p-u\">whose\u003c/u> impact the environment as minimally as possible. This includes paying attention to packaging and materials, ⓓ \u003cu class=\"p-u\">it\u003c/u> applies to everything from eggs in the grocery store (skip the plastic cartons in favor of cardboard) to buying a new couch.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>change &lt;&lt;the way&gt;&gt; we live에서 the way 뒤에는 관계부사 that이 생략될 수 있으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>is &lt;&lt;that&gt;&gt; makes a difference에서 that 앞에 선행사가 없고 makes의 주어가 필요하므로 \u003cb class=\"key\">what\u003c/b>으로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>items &lt;&lt;whose&gt;&gt; impact the environment에서 impact는 동사이므로 \u003cb class=\"key\">that 또는 which\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>materials, &lt;&lt;it&gt;&gt; applies to everything에서 앞 내용을 이어 받아야 하므로 \u003cb class=\"key\">which\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">정리\u003c/b>고칠 곳은 ⓑ, ⓒ, ⓓ입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓑ that → what, ⓒ whose → that 또는 which, ⓓ it → which\u003c/span>\u003cdiv class=\"p-full\">reducing plastic consumption is what makes a difference in the world / items that impact the environment / materials, which applies to everything\u003c/div>\u003cdiv class=\"p-ko\">플라스틱 소비를 줄이는 것이 세상에 변화를 만드는 것이다. / 환경에 영향을 주는 물건 / 재료, 그리고 그것은 모든 것에 적용된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>impact를 명사로 착각하면 whose가 맞다고 생각하게 됩니다. 뒤에 목적어 the environment가 있으므로 impact는 동사입니다.\u003c/div>","segs":[{"n":137,"text":"첫 번째 밑줄은 the way we live로, the way 뒤에 that이 생략된 형태라서 맞아요.","hl":"st-0"},{"n":138,"text":"두 번째 밑줄은 that 앞에 선행사가 없어요. makes의 주어 역할을 하려면 what이 되어야 합니다.","hl":"st-1"},{"n":139,"text":"세 번째 밑줄은 impact가 동사로 쓰였어요. 그렇다면 whose가 아니라 주격 that이나 which가 필요합니다.","hl":"st-2"},{"n":140,"text":"네 번째 밑줄은 앞의 내용을 이어 받아야 하므로 it이 아니라 which를 써야 해요.","hl":"st-3"},{"n":141,"text":"그래서 고칠 곳은 두 번째, 세 번째, 네 번째 밑줄이에요.","hl":"st-4"},{"n":142,"text":"이 문제의 함정도 짚고 갈게요. impact를 명사로 착각하면 whose가 맞다고 생각하게 됩니다. 뒤에 목적어 the environment가 있으므로 impact는 동사입니다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법+영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg\">ⓐ \u003cu class=\"p-u\">However\u003c/u> hard we try not to think about something, we often end up thinking about it more. So, if we want to spend less time thinking about something, simply trying not to think about it won't work. Therefore, the worry time technique can be used ⓑ \u003cu class=\"p-u\">to reduce\u003c/u> the amount of time we spend worrying about things outside of our control. We can then spend the time ⓒ \u003cu class=\"p-u\">that\u003c/u> we aren't worrying doing productive things. How do we set up the worry time? \u003cu class=\"p-u\">하루 중에 여러분이 걱정하도록 허용된 시간을 만들어라.\u003c/u> It is usually advised to make this a 15-minute period. Your worry time should not be longer than 30 minutes! Consider taking your worry time on a chair that is pushed away from ⓓ \u003cu class=\"p-u\">what\u003c/u> you sleep. Also, during the day when a worrying thought comes to you, write it down in a notebook which you keep on the desk and save ⓔ \u003cu class=\"p-u\">it\u003c/u> for your worry time.\u003c/div>\u003cdiv class=\"p-q\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오. (2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오. 보기: make, time during the day, be allowed, worry\u003c/div>\u003cdiv class=\"p-words\">(2) make, time during the day, be allowed, worry\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) ④(what → where) (2) Make time during the day when you are allowed to worry.\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":143,"text":"열여덟 번째 문제는 지문의 어법 문제와 영작 문제가 함께 나온 문제예요. 밑줄 친 부분을 하나씩 확인하고, 우리말 문장에서는 time을 꾸미는 말을 생각하세요.","hl":"q"},{"n":144,"text":"","hl":"q","pause":7},{"n":145,"text":"첫 번째 답은 네 번째 밑줄이에요. sleep 앞에는 what이 아니라 장소의 where가 와야 해요. 영작은 Make time during the day when you are allowed to worry예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법+영작\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">ⓐ \u003cu class=\"p-u\">However\u003c/u> hard we try not to think about something, we often end up thinking about it more. So, if we want to spend less time thinking about something, simply trying not to think about it won't work. Therefore, the worry time technique can be used ⓑ \u003cu class=\"p-u\">to reduce\u003c/u> the amount of time we spend worrying about things outside of our control. We can then spend the time ⓒ \u003cu class=\"p-u\">that\u003c/u> we aren't worrying doing productive things. How do we set up the worry time? \u003cu class=\"p-u\">하루 중에 여러분이 걱정하도록 허용된 시간을 만들어라.\u003c/u> It is usually advised to make this a 15-minute period. Your worry time should not be longer than 30 minutes! Consider taking your worry time on a chair that is pushed away from ⓓ \u003cu class=\"p-u\">what\u003c/u> you sleep. Also, during the day when a worrying thought comes to you, write it down in a notebook which you keep on the desk and save ⓔ \u003cu class=\"p-u\">it\u003c/u> for your worry time.\u003c/div>\u003cdiv class=\"p-q sm\">(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오. (2) 윗글의 밑줄 친 우리말을 조건에 맞게 영작하시오. 보기: make, time during the day, be allowed, worry\u003c/div>\u003cdiv class=\"p-words\">(2) make, time during the day, be allowed, worry\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>&lt;&lt;However&gt;&gt; hard we try에서 however 뒤에 형용사·부사 hard가 와서 '아무리 ~해도'를 만들므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>can be used &lt;&lt;to reduce&gt;&gt;에서 '줄이기 위해 사용되다'라는 목적의 to부정사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>the time &lt;&lt;that&gt;&gt; we aren't worrying에서 that은 시간을 받는 관계부사 역할로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>away from &lt;&lt;what&gt;&gt; you sleep에서 sleep은 목적어가 필요 없는 동사이고 장소가 필요하므로 \u003cb class=\"key\">where\u003c/b>로 고칩니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>save &lt;&lt;it&gt;&gt; for your worry time에서 it은 a worrying thought를 받으므로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">영작 완성\u003c/b>Make time during the day + when + you are allowed to worry로 배열합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ④(what → where) (2) Make time during the day when you are allowed to worry.\u003c/span>\u003cdiv class=\"p-full\">Make time during the day when you are allowed to worry.\u00 ll advise rest and drink fluids for the virus if it's mild, and antiviral medications for cases that are more severe. We can get vaccinated to prevent both viral diseases and bacterial diseases. When washing hands and cleaning surfaces, ⑤ \u003cu class=\"p-u\">that\u003c/u> works against bacteria vs. viruses can differ.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① goes\u003c/div>\u003cdiv class=\"p-op\">② are\u003c/div>\u003cdiv class=\"p-op\">③ where\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ that\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤(that → what)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":153,"text":"열아홉 번째 문제는 지문에서 어법상 틀린 부분을 고르는 문제예요. 각 밑줄 앞에 선행사가 있는지와 주어가 무엇인지 확인하세요.","hl":"q"},{"n":154,"text":"","hl":"q","pause":7},{"n":155,"text":"정답은 다섯 번째예요. that 앞에 선행사가 없고 works의 주어 역할을 해야 하므로 what으로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Both viruses and bacteria can cause illness, but they don't cause the same illnesses. And while all viruses are bad, there are both &quot;bad&quot; bacteria and &quot;good&quot; bacteria, such as the kind that ① \u003cu class=\"p-u\">goes\u003c/u> into making things like cheese and yogurt. But whereas bacteria are living organisms, viruses ② \u003cu class=\"p-u\">are\u003c/u> not. That means that treating our bodies ③ \u003cu class=\"p-u\">where\u003c/u> bacteria and virus germs live requires different methods. To treat a bacterial infection, doctors will prescribe antibiotics. To treat .\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>that을 접속사로 착각하면 틀린 곳을 놓칩니다. 앞에 선행사가 없으면 what을 먼저 의심하세요.\u003c/div>","segs":[{"n":156,"text":"첫 번째 밑줄은 the kind that goes로, the kind가 단수라서 goes가 맞아요.","hl":"st-0"},{"n":157,"text":"두 번째 밑줄은 viruses are not으로, 주어가 복수라서 are가 맞습니다.","hl":"st-1"},{"n":158,"text":"세 번째 밑줄은 our bodies where bacteria and virus germs live로, where 뒤에 완전한 절이 와서 맞아요.","hl":"st-2"},{"n":159,"text":"네 번째 밑줄은 antibiotics를 받아 which will have no effect로 이어져요. 그래서 맞습니다.","hl":"st-3"},{"n":160,"text":"다섯 번째 밑줄은 that 앞에 선행사가 없어요. works의 주어 역할을 해야 하므로 what이 되어야 합니다.","hl":"st-4"},{"n":161,"text":"이 문제의 함정도 짚고 갈게요. that을 접속사로 착각하면 틀린 곳을 놓칩니다. 앞에 선행사가 없으면 what을 먼저 의심하세요.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">It's easier and more important than ever to be a responsible traveler. Here's what you need to know about ecotourism before booking your next trip. Ecotourism is defined as responsible travel to natural areas ① \u003cu class=\"p-u\">to conserve\u003c/u> (원문: that conserves) the environment and ② \u003cu class=\"p-u\">sustains\u003c/u> the well-being of the local people. ③ \u003cu class=\"p-u\">Wherever\u003c/u> they go, visitors should experience the beauty of a destination without causing damage. Often, ecotourism also lets them participate in activities that benefit the environment. For example, travelers can also act as citizen scientists in places around the world, including national parks and dive sites, ④ \u003cu class=\"p-u\">which\u003c/u> they help do research and collect data. Also, ecotourism helps local communities thrive. It is vital to care for the people who live in a destination. Just look at Venice, Italy, where overtourism has gotten ⑤ \u003cu class=\"p-u\">so\u003c/u> out of hand that residents are leaving the city.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① to conserve (원문: that conserves)\u003c/div>\u003cdiv class=\"p-op\">② sustains\u003c/div>\u003cdiv class=\"p-op\">③ Wherever\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ so\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④(which → where 또는 in which)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":162,"text":"스무 번째 문제는 지문에서 어법상 틀린 부분을 고르는 문제예요. 장소를 받는 말과 so that 구문을 중심으로 확인하세요.","hl":"q"},{"n":163,"text":"","hl":"q","pause":7},{"n":164,"text":"정답은 네 번째예요. national parks and dive sites 같은 장소 뒤에서 연구하고 자료를 모으는 곳을 나타내므로 which가 아니라 where나 in which가 와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 20 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">20\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">It's easier and more important than ever to be a responsible traveler. Here's what you need to know about ecotourism before booking your next trip. Ecotourism is defined as responsible travel to natural areas ① \u003cu class=\"p-u\">to conserve\u003c/u> (원문: that conserves) the environment and ② \u003cu class=\"p-u\">sustains\u003c/u> the well-being of the local people. ③ \u003cu class=\"p-u\">Wherever\u003c/u> they go, visitors should experience the beauty of a destination without causing damage. Often, ecotourism also lets them participate in activities that benefit the environment. For example, travelers can also act as citizen scientists in places around the world, including national parks and dive sites, ④ \u003cu class=\"p-u\">which\u003c/u> they help do research and collect data. Also, ecotourism helps local communities thrive. It is vital to care for the people who live in a destination. Just look at Venice, Italy, where overtourism has gotten ⑤ \u003cu class=\"p-u\">so\u003c/u> out of hand that residents are leaving the city.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① to conserve (원문: that conserves)\u003c/div>\u003cdiv class=\"p-op\">② sustains\u003c/div>\u003cdiv class=\"p-op\">③ Wherever\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ so\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>① &lt;&lt;to conserve&gt;&gt;는 목적의 to부정사로 볼 수 있고, 원문의 that conserves는 responsible travel을 받는 주격 관계대명사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>② &lt;&lt;sustains&gt;&gt;는 주어 Ecotourism에 이어지는 동사로 보면 단수형 sustains가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>③ &lt;&lt;Wherever&gt;&gt; they go는 '그들이 어디로 가든'이라는 복합관계부사로 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>places around the world, including national parks and dive sites, &lt;&lt;which&gt;&gt; they help do research에서 장소를 받아 '그곳에서'를 나타내야 하므로 \u003cb class=\"key\">where 또는 in which\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>⑤ &lt;&lt;so&gt;&gt; out of hand that residents are leaving the city에서 so + 형용사 + that 구문으로 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④(which → where 또는 in which)\u003c/span>\u003cdiv class=\"p-full\">For example, travelers can also act as citizen scientists in places around the world, including national parks and dive sites, where they help do research and collect data.\u003c/div>\u003cdiv class=\"p-ko\">예를 들어 여행자들은 국립공원과 다이빙 장소를 포함한 전 세계 여러 곳에서 시민 과학자로서 연구와 자료 수집을 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>장소 선행사 뒤에서 '그곳에서'의 의미가 필요하면 which가 아니라 where나 in which를 써야 합니다.\u003c/div>","segs":[{"n":165,"text":"첫 번째 밑줄은 to conserve로 목적을 나타낼 수 있어요. 원문의 that conserves도 responsible travel을 받는 주격 관계대명사로 맞습니다.","hl":"st-0"},{"n":166,"text":"두 번째 밑줄은 주어 Ecotourism에 맞춰 단수형 sustains가 와서 맞아요.","hl":"st-1"},{"n":167,"text":"세 번째 밑줄의 Wherever they go는 그들이 어디로 가든이라는 뜻으로 맞아요.","hl":"st-2"},{"n":168,"text":"네 번째 밑줄은 national parks and dive sites 같은 장소를 받아요. 그곳에서 연구하고 자료를 모은다는 의미이므로 where나 in which가 필요합니다.","hl":"st-3"},{"n":169,"text":"다섯 번째 밑줄은 so out of hand that으로 너무 통제 불능이어서라는 뜻을 만들어요. 그래서 맞습니다.","hl":"st-4"},{"n":170,"text":"이 문제의 함정도 짚고 갈게요. 장소 선행사 뒤에서 '그곳에서'의 의미가 필요하면 which가 아니라 where나 in which를 써야 합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사·관계부사·복합관계사 어법 종합\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>소유 관계면 \u003cb class=\"key\">whose + 명사\u003c/b>, 뒤에 동사가 오면 \u003cb class=\"key\">that/which + 동사\u003c/b>를 쓴다.\u003c/li>\u003cli>장소·상황 뒤 완전한 절이면 \u003cb class=\"key\">where\u003c/b>, 전치사가 필요하면 \u003cb class=\"key\">전치사 + which\u003c/b>를 쓴다.\u003c/li>\u003cli>앞에 선행사가 없으면 \u003cb class=\"key\">what\u003c/b>, 선행사가 있으면 \u003cb class=\"key\">that/which\u003c/b>를 쓴다.\u003c/li>\u003cli>'아무리 ~해도'는 \u003cb class=\"key\">however + 형용사/부사 + 주어 + 동사\u003c/b>, '~할 때마다'는 \u003cb class=\"key\">whenever + 주어 + 동사\u003c/b>로 만든다.\u003c/li>\u003cli>계속적 용법 쉼표 뒤에서는 \u003cb class=\"key\">that\u003c/b>을 쓰지 않고 \u003cb class=\"key\">which\u003c/b>를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":171,"text":"오늘은 관계대명사와 관계부사, 복합관계사를 중심으로 시험에 자주 나오는 어법 문제를 풀었어요. whose 뒤에는 명사, where 뒤에는 완전한 절, what 앞에는 선행사가 없다는 점을 꼭 기억하세요. however 뒤에는 형용사나 부사가 온다는 것도 함께 정리해 두면 좋아요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
